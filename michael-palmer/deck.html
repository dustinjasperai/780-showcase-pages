<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 6 Belts of a Bookkeeping Business That Runs Without You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a2e;        /* brand navy ground (extract_brand dominant dark) */
    --panel:#121238;     /* navy tint panel */
    --rule:#2a2a52;      /* hairline */
    --ink:#f3f3fb;       /* near-white type */
    --muted:#aab0d6;     /* muted navy-grey */
    --accent:#ff6b35;    /* brand orange accent */
    --font:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .deckwrap{max-width:1040px;margin:0 auto;padding:28px 20px 72px}
  .slide{
    background:linear-gradient(180deg,var(--panel),#0c0c30);
    border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:22px 0;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-size:46px;line-height:1.08;font-weight:800;letter-spacing:-.01em}
  h2{font-size:34px;line-height:1.14;font-weight:700;letter-spacing:-.01em}
  .lead{font-size:20px;line-height:1.5;color:var(--muted);margin-top:18px;max-width:40ch}
  .big{font-size:22px;line-height:1.5;margin-top:14px;max-width:46ch}
  .pt{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  li{font-size:19px;line-height:1.4;padding-left:30px;position:relative}
  li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .belt{display:flex;align-items:center;gap:18px;margin-top:10px}
  .chip{min-width:132px;text-align:center;padding:12px 10px;border-radius:12px;font-weight:700;border:1px solid var(--rule)}
  .belt .stage{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .belt .what{font-size:20px;line-height:1.4;margin-top:4px}
  .foot{position:absolute;right:28px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .num{position:absolute;left:54px;bottom:20px;font-size:12px;color:var(--muted)}
  .presenter{margin-top:30px;font-size:16px;color:var(--muted)}
  .presenter b{color:var(--ink);font-weight:600}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .cta-steps{margin-top:20px;display:grid;gap:12px}
  .cta-steps div{font-size:19px;padding-left:30px;position:relative}
  .cta-steps div::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:auto}h1{font-size:32px}h2{font-size:26px}.chip{min-width:92px}}
</style>
</head>
<body>
<div class="deckwrap" id="deck"></div>
<script>
/* Masterclass deck — Michael Palmer, The Successful Bookkeeper.
   Built from his own IP: the Bookkeeping Business Blueprint (six belts) and the
   Pure Bookkeeping System. His audience, his framework, his call to action. */
const S = [
  {t:'title',
    kick:'A live masterclass with Michael Palmer',
    h:'The 6 Belts of a Bookkeeping Business That Runs Without You',
    lead:'How established firm owners move from doing every client themselves to a business that runs, and sells, without them.'},

  {t:'who',
    kick:'Who this is for',
    h:'You already have the clients. You are the bottleneck.',
    items:['You own a bookkeeping or accounting firm and the work still flows through you',
           'You are booked solid but the income does not match the hours',
           'You cannot take a real week off without the firm wobbling',
           'You want a business that runs on systems, not on you']},

  {t:'trap',
    kick:'The trap',
    h:'Most owners did not build a business. They built a very demanding job.',
    big:'When you are the one who has to do the books, review the books, chase the client and fix the mistake, growth just means more of you. And there is only one of you.'},

  {t:'hook',
    kick:'The reframe',
    h:'The belt you are stuck on is predictable.',
    big:'Every bookkeeping firm climbs the same six stages. Once you can name the belt you are on, the next move stops being a guess. That is what the Bookkeeping Business Blueprint does.'},

  {t:'part', pt:'Part one', h:'Why working harder makes the trap tighter.'},

  {t:'trap',
    kick:'The core problem',
    h:'More clients is the wrong lever.',
    big:'Taking on more work when you are already the bottleneck does not create freedom. It buys you a busier version of the same job. The lever is not volume. It is leverage.'},

  {t:'part', pt:'Part two', h:'The Bookkeeping Business Blueprint.'},

  {t:'who',
    kick:'The framework',
    h:'Six belts, one path.',
    lead:'A martial-arts belt system for your firm. You earn your way out of the day-to-day one belt at a time. Here is the whole ladder.',
    items:['White to Yellow, you fix what you build and what you charge',
           'Green to Blue, you build the systems and the team',
           'Red to Black, you step out, and the firm stands on its own']},

  {t:'belt', chip:'White', fill:'outline', stage:'Decision',
    what:'Commit to building a business, not a job. Decide the firm exists to serve the life, not the other way around.'},
  {t:'belt', chip:'Yellow', fill:'outline', stage:'Value',
    what:'Get paid for the value you create, not the hours you log. Close the gap between effort and income.'},
  {t:'belt', chip:'Green', fill:'deep', stage:'Activity',
    what:'Stop being the bottleneck. Find the tasks only you can do, and start moving the rest off your plate.'},
  {t:'belt', chip:'Blue', fill:'deep', stage:'Environment',
    what:'Build the systems and the team structure that make growth sustainable instead of chaotic. This is where the Pure Bookkeeping System lives.'},
  {t:'belt', chip:'Red', fill:'accent', stage:'Leverage',
    what:'Take yourself out of daily operations. The firm runs on documented process and a capable team, not on your memory.'},
  {t:'belt', chip:'Black', fill:'accent', stage:'Exit',
    what:'A firm that functions independently of you. It runs without you in the room, and that is exactly what makes it sellable.'},

  {t:'part', pt:'Part three', h:'What Black belt actually looks like.'},

  {t:'trap',
    kick:'The destination',
    h:'Your week stops being the product.',
    big:'At Black belt the question changes from how do I get through this week to what do I want this business to do for me. A firm that runs without you is a firm you can grow, step back from, or sell on your terms.'},

  {t:'why',
    kick:'Why listen to this',
    h:'Built from thousands of real bookkeeping firms.',
    items:['Michael Palmer, host of The Successful Bookkeeper podcast, 500+ episodes',
           'CEO of Pure Bookkeeping, the operating system used to systemize bookkeeping firms',
           'A community of more than 40,000 bookkeeping owners across 40+ countries',
           'The Blueprint is the pattern underneath all of it, drawn from firms at every belt']},

  {t:'recap',
    kick:'Your next move',
    h:'First, find your belt.',
    big:'You cannot plan the next stage until you know the one you are standing on. Name your belt, and the single most important move becomes obvious.'},

  {t:'cta',
    kick:'Your next belt starts here',
    h:'Map your firm to its belt, and install what comes next.',
    steps:['Book a call with our team to place your firm on the Blueprint',
           'We map the one system that moves you to your next belt',
           'Start with Freedom Gateway and build the firm that runs without you'],
    foot:'thesuccessfulbookkeeper.com',
    disc:'This masterclass is educational. It shares a framework and is not individual financial, tax, or business advice. Results vary from firm to firm and nothing here is guaranteed.'}
];

const deck = document.getElementById('deck');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let html='';
  if(s.kick) html+=`<div class="kick">${esc(s.kick)}</div>`;
  if(s.pt) html+=`<div class="pt">${esc(s.pt)}</div>`;
  if(s.t==='title'){
    html+=`<h1>${esc(s.h)}</h1>`;
    if(s.lead) html+=`<div class="lead">${esc(s.lead)}</div>`;
    html+=`<div class="presenter">Presented live by <b>Michael Palmer</b>, The Successful Bookkeeper</div>`;
  } else if(s.t==='belt'){
    const fill = s.fill==='accent' ? 'background:var(--accent);color:#0a0a2e;border-color:var(--accent)' :
                 s.fill==='deep' ? 'background:#1c1c4a' : '';
    html+=`<div class="belt"><div class="chip" style="${fill}">${esc(s.chip)} belt</div><div><div class="stage">${esc(s.stage)}</div><div class="what">${esc(s.what)}</div></div></div>`;
  } else if(s.t==='cta'){
    html+=`<h2>${esc(s.h)}</h2><div class="cta-steps">${s.steps.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
    html+=`<div class="disc">${esc(s.disc)}</div>`;
  } else {
    if(s.h) html+= (s.t==='part'? `<h2>${esc(s.h)}</h2>` : `<h2>${esc(s.h)}</h2>`);
    if(s.lead) html+=`<div class="lead">${esc(s.lead)}</div>`;
    if(s.big) html+=`<div class="big">${esc(s.big)}</div>`;
    if(s.items) html+=`<ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  }
  html+=`<div class="num">${i+1} / ${S.length}</div>`;
  if(s.foot) html+=`<div class="foot">${esc(s.foot)}</div>`;
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
