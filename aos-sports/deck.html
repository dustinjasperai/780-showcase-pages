<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Athlete of Significance Pathway | AOS Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;        /* from brand #000000 dominant ground; dark-scheme brand -> dark deck */
    --panel:#15151a;     /* lifted near-black */
    --rule:#2a2a30;      /* from slate #6e6b74 family */
    --accent:#e67e21;    /* AOS brand dominant color, 41 uses in extract_brand.js */
    --ink:#ffffff;       /* brand H1 white */
    --muted:#aaafb8;     /* brand second-ranked color */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);font-size:13px;margin-bottom:18px}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:52px;line-height:1.04;
    text-transform:uppercase;letter-spacing:.01em;margin-bottom:18px}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:34px;line-height:1.1;
    text-transform:uppercase;margin-bottom:18px}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:40ch;margin-bottom:14px}
  p.lead{color:#e9eaee;font-size:21px;max-width:46ch}
  .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;color:var(--ink);
    line-height:1.12;max-width:20ch;text-transform:none}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.45;color:#e9eaee;padding:14px 0 14px 34px;position:relative;
    border-bottom:1px solid var(--rule);max-width:44ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:14px;height:3px;background:var(--accent)}
  li b{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--ink);text-transform:uppercase;
    letter-spacing:.03em;font-size:17px;display:block;margin-bottom:3px}
  .num{font-family:'Barlow Condensed',sans-serif;color:var(--accent);font-weight:700;font-size:15px;
    letter-spacing:.2em}
  .foot{position:absolute;right:30px;bottom:22px;font-family:'Barlow Condensed',sans-serif;
    letter-spacing:.2em;font-size:12px;color:#55555f;text-transform:uppercase}
  .title-slide{align-items:flex-start}
  .title-slide h1{font-size:62px;max-width:16ch}
  .brandline{font-family:'Barlow Condensed',sans-serif;letter-spacing:.3em;text-transform:uppercase;
    color:var(--muted);font-size:14px;margin-top:26px}
  .disc{font-size:13px;color:#6b6b74;max-width:60ch;line-height:1.5}
  .cta-step{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;
    font-size:22px;color:var(--ink);margin:6px 0 0;padding-left:34px;position:relative}
  .cta-step::before{content:"";position:absolute;left:0;top:13px;width:16px;height:3px;background:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A Masterclass for College-Bound Families',h1:'The Athlete of Significance Pathway',sub:'How to get recruited by becoming the player colleges fight for, not just the one they can find.',brand:'AOS Sports · with Christian DeVries'},

 {t:'promise',kicker:'What this hour gives you',big:'A recruiting plan built on who your athlete becomes, not just where they get seen.',p:'By the end you will know the difference between being recruited for exposure and being recruited for significance, and the exact pathway that gets families there with direction, honesty, and integrity.'},

 {t:'who',kicker:'Who this is for',h2:'If any of this is you',list:[
   ['The committed family','Your athlete trains hard, the talent is real, and the recruiting process still feels like a black box.'],
   ['The overwhelmed parent','You are getting advice from every direction and none of it tells you what to actually do next.'],
   ['The player who wants more than an offer','You want the college years to build a person, not just extend a season.']]},

 {t:'trap',kicker:'The trap almost every family falls into',h2:'The success trap',p:'Most recruiting advice points at one thing: get seen. More showcases. More highlight tape. More cold emails to more coaches. Be everywhere, be loud, chase the offer.',p2:'It is exhausting, expensive, and it quietly measures your athlete’s worth by stars, offers, and exposure. The player gets lost inside the hunt for the player.'},

 {t:'reframe',kicker:'The reframe',big:'Exposure gets you noticed. Significance gets you chosen.',p:'College coaches are not only buying talent. They are buying a locker room, a culture, four years of a young person inside their program. The families who understand that stop competing on noise and start competing on character.'},

 {t:'part',num:'PART ONE',h2:'Why the loudest recruits are not the ones who get the call'},

 {t:'body',kicker:'Part One',h2:'Talent is the ticket, not the trophy',list:[
   ['Talent opens the door','It does not hold it open. Every recruit in the conversation can play. That is the baseline, not the edge.'],
   ['Coaches recruit character','They are projecting four years forward: who leads, who is coachable, who raises the room. That is the real evaluation.'],
   ['Noise is forgettable','A thousand identical emails and reels blur together. What a coach remembers is a player of substance and the family that gets it.']]},

 {t:'part',num:'PART TWO',h2:'The Athlete of Significance method'},

 {t:'body',kicker:'Part Two · the core idea',big:'Significance over success.',p:'Significance over success is the mindset shift this whole pathway is built on: lasting impact comes from character and purpose, not talent alone. Value drives influence. When an athlete leads with value, the offers follow the person.'},

 {t:'values',kicker:'Part Two · the six core values',h2:'What we actually develop',list:[
   ['Significance Over Success','Impact over outcomes, the standard everything else is measured against.'],
   ['Character Over Clout','Who you are when no coach is watching is the thing coaches are hunting for.'],
   ['Community Through Connection','Recruiting is relationships; we build real ones, not transactions.']]},

 {t:'values',kicker:'Part Two · the six core values',h2:'And the three that carry it',list:[
   ['Significance Happens Everywhere','On the field, in the classroom, at home, the same athlete, all the time.'],
   ['Structure With Compassion','A real plan with real accountability, delivered by people who care how it lands.'],
   ['Purpose-Driven Development','Growth with a reason behind it, so effort compounds instead of scattering.']]},

 {t:'part',num:'PART THREE',h2:'The pathway, step by step'},

 {t:'body',kicker:'Part Three · the roadmap',h2:'The College Player Pathway',list:[
   ['Recruitment Roadmap','The honest map of the process, timelines, targets, and what matters at each stage, so you stop guessing.'],
   ['Competitive Edge development','Player and mindset work that sharpens the thing coaches are actually evaluating.'],
   ['AOS Leadership','The character and leadership layer that turns a good recruit into one a program builds around.'],
   ['Live weekly mentorship','Experienced advisors in the room with you, every week, as real decisions come up.']]},

 {t:'body',kicker:'Part Three · the shift',h2:'From hunted to chosen',list:[
   ['Direction','You always know the next right step, instead of reacting to the loudest voice that week.'],
   ['Honesty','Straight answers about fit, level, and odds, so the family makes real decisions.'],
   ['Integrity','A process you are proud of, that builds the athlete whether or not any single offer lands.']]},

 {t:'why',kicker:'Why trust this',h2:'Who is teaching this',p:'Christian DeVries spent over twenty years as a college soccer coach and sports management professor, with six championships across NCAA Division II and III, the NAIA, and junior college.',p2:'He has sat on the recruiting side of the table for three decades. AOS exists to give families that same inside view, the significance-over-success approach, before they ever send the first email.'},

 {t:'cta',kicker:'Your next step',h2:'Start the pathway',steps:[
   'Enroll in the College Player Pathway and get the full Recruitment Roadmap',
   'Join the live weekly mentorship and bring your real questions',
   'Build the athlete of significance colleges choose'],
 disc:'Educational content only. AOS Sports does not guarantee recruitment, scholarship, roster, or admissions outcomes. Every athlete’s path is different and results vary.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
 const d=document.createElement('section');d.className='slide '+(s.t==='title'?'title-slide':'');
 let h='';
 if(s.kicker)h+=`<div class="kicker">${s.kicker}</div>`;
 if(s.num)h+=`<div class="num">${s.num}</div>`;
 if(s.h1)h+=`<h1>${s.h1}</h1>`;
 if(s.sub)h+=`<p class="lead">${s.sub}</p>`;
 if(s.h2)h+=`<h2>${s.h2}</h2>`;
 if(s.big)h+=`<div class="big">${s.big}</div>`;
 if(s.p)h+=`<p class="${s.t==='reframe'||s.t==='promise'?'lead':''}">${s.p}</p>`;
 if(s.p2)h+=`<p>${s.p2}</p>`;
 if(s.list){h+='<ul>';s.list.forEach(x=>h+=`<li><b>${x[0]}</b>${x[1]}</li>`);h+='</ul>';}
 if(s.steps){s.steps.forEach(x=>h+=`<div class="cta-step">${x}</div>`);}
 if(s.brand)h+=`<div class="brandline">${s.brand}</div>`;
 if(s.disc)h+=`<p class="disc" style="margin-top:28px">${s.disc}</p>`;
 h+=`<div class="foot">AOS Sports · ${i+1}/${S.length}</div>`;
 d.innerHTML=h;deck.appendChild(d);
});
</script>
</body>
</html>
