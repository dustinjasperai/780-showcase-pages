<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Neuro-Performance Method · Andy Murphy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f3f2ee; --panel:#fbfaf7; --rule:#e7e4dc;
    --accent:#c5ab3b; --acc:#8a6f18; --ink:#141414; --body:#4a4a46; --dim:#9a978c;
    --deep:#1c1b18; --cream:#f3f2ee;
  }
  html,body{height:100%}
  body{background:#e7e5df;font-family:'Poppins',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e7e5df}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.08;letter-spacing:.004em}
  .t-title h1{font-size:5.8vw;max-width:94%}
  .t-normal h1{font-size:3.7vw;max-width:90%;font-weight:600}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Cormorant Garamond',serif;font-size:2.2vw;color:var(--acc);margin-top:3.2vh;max-width:86%;line-height:1.34;font-weight:600}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.4vw;max-width:92%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#25231d 0%,#141310 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.2vw;max-width:88%;color:var(--cream)}
  .t-dark h1 b{color:var(--accent);font-weight:700}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#25231d 0%,#141310 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.3vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Poppins',sans-serif;color:#e6e2d6;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.5%;bottom:9%;width:20vw;opacity:.95}
  .corner-vf{right:6.5%;bottom:8%;width:10vw;opacity:.55}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(20,20,20,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9.4vw}.t-normal h1{font-size:6.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.4vw}.t-section h1{font-size:8.2vw}.t-dark h1{font-size:6.8vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Andy Murphy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a nervous system settling. a jagged spike resolving into one clean line, drawn in gold, the state coming under control -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 180 80">
  <g fill="none" stroke="#c5ab3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 42 L26 42 L34 16 L44 66 L54 24 L62 58 L70 42 L96 42" opacity="0.9"/>
    <path d="M96 42 H174" opacity="0.55"/>
    <circle cx="174" cy="42" r="5" fill="#c5ab3b" stroke="none" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Neuro-Performance Method',sub:'How elite operators hold a clean decision-making state when the pressure is highest, so the biggest calls get made from control, not adrenaline.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You make high-stakes calls. The hard part was never the strategy.',body:'You run capital, a company, or a career where the decisions are enormous and public. The models are built, the data is in, the experience is real. What actually moves the outcome at the top is whether your state holds when the stakes spike, because that is the moment the plan meets the pressure.'},
 {t:'dark',title:'Under enough pressure, the sharpest operator in the room defaults to their nervous system, not their knowledge.'},

 {t:'section',idx:'Part One',title:'Why Pressure Beats Preparation'},
 {t:'normal',k:'The real bottleneck',title:'Your brain chemistry decides a half-second before you do.',body:'When the stakes spike, the body reads it as threat. Cortisol and adrenaline rise, and the prefrontal cortex, the part that weighs a hard decision cleanly, quietly goes offline. You narrow, you rush, or you freeze. It feels like a judgment call. It is a chemistry event happening underneath one.'},
 {t:'normal',k:'The cost at your level',title:'At eight and nine figures, one dysregulated call is expensive.',body:'The negotiation you forced instead of held. The exit you rushed because the room got loud. The raise you walked into carrying last quarter in your chest. None of it was a gap in what you know. It was a gap in the state you were in when you had to use it.'},
 {t:'dark',title:'You cannot out-think a nervous system that is convinced you are in danger.'},

 {t:'section',idx:'Part Two',title:'The Triad'},
 {t:'normal',k:'The Triad',title:'Three systems, installed at the level where performance actually breaks.',body:'Most performance advice works on tactics and mindset, the top layer. The Triad works underneath it, on the state, the subconscious patterns, and the positioning that decide the outcome before the tactics ever get a turn. You install all three, in order.'},
 {t:'normal',k:'Pillar one · Neuro-Performance Control',title:'Regulate the state on demand.',body:'This is the foundation: conditioning the nervous system so you can reach a clean, regulated state under fire instead of hoping one shows up. Prefrontal priming, heart coherence over ego-ambition, and snapback control, so a spike in pressure no longer takes the decision-maker offline at the exact moment you need him most.'},
 {t:'normal',k:'Pillar two · Subconscious Sales & Influence',title:'Win the room below the conscious level.',body:'The highest-stakes rooms are not won by the best argument, they are won by the person whose presence is not negotiable. Through anchoring and identity work, the negotiation runs from a rehearsed subconscious pattern rather than raw nerves, so you hold frame, read the room, and close from a state you chose in advance.'},
 {t:'normal',k:'Pillar three · Strategic Positioning & Blue Ocean Authority',title:'Operate as the category of one.',body:'The last pillar points the regulated state outward. You position so you are not being compared on a list, you are the obvious choice before the conversation starts. Authority that compounds, a lane no competitor is standing in, and the leverage that comes from being the only real option in the room.'},
 {t:'dark',title:'Regulate the state. Rewire the pattern. Own the position. <b>In that order.</b>'},

 {t:'section',idx:'Part Three',title:'What Changes When the State Holds'},
 {t:'normal',k:'The regulated operator',title:'The same operator, making cleaner calls, faster.',body:'You walk into the raise, the exit, or the boardroom already regulated. The pressure still spikes, but it no longer runs you. Decisions get made from the top of your ability instead of the bottom of your stress response, and the people across the table feel the difference before you say a word.'},
 {t:'dark',title:'The edge was never more information. It is a nervous system that stays <b>yours</b> under pressure.'},
 {t:'normal',k:'Why Andy',title:'Twenty-three years inside high-pressure success stories.',body:'Andy Murphy has spent 23 years as the mental-performance resource behind IPO founders, fund managers, world champions, and public figures, with an NLP foundation and a seat on the Forbes Coaches Council. His Neuro Performance work has reached millions through the podcast of the same name. This is the method, drawn from that work.'},

 {t:'section',idx:'Your Next Step',title:'Train the State Behind the Decisions'},
 {t:'normal',k:'Keep going with Andy',title:'Start with a conversation about your highest-stakes calls.',body:'The place to begin is a discovery call about where the pressure is actually costing you. If it is a fit, the work goes deeper through the Fixer Protocol and, for a small group of operators, the 8-10 Figure Members Club, where the Triad gets installed for good.'},
 {t:'cta',title:'Ready to make your biggest calls from control?',body:'Take the next step with Andy Murphy.',chips:['Book a discovery call','Apply for the Fixer Protocol'],disc:'Educational content for leaders and operators working on mental performance. No income, result, or outcome is guaranteed. Individual results vary by person, situation, and effort.'}
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Andy <b>Murphy</b> · Neuro-Performance for Elite Operators</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
