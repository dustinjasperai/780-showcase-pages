<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Profitable Hardscape Job | The Hardscape Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#12151a;
    --panel:#0e1116;
    --stage:#0a0b0d;
    --accent:#f1c40f;
    --gold:#f1c40f;
    --ink:#f2efe8;
    --ink-soft:#c2c9d1;
    --muted:#7d8894;
    --rule:#55636f;
  }
  html,body{height:100%}
  body{background:var(--stage);font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:8.5vh 9vw;opacity:0;transition:opacity .5s ease;pointer-events:none;background:var(--bg)}
  .slide.active{opacity:1;pointer-events:auto}
  .kicker{font-family:'Open Sans',sans-serif;font-size:1.05vw;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin-bottom:3.2vh}
  h1{font-family:'Montserrat',system-ui,sans-serif;font-weight:700;font-size:4.1vw;line-height:1.1;
    letter-spacing:-.014em;color:var(--ink);max-width:21ch}
  .sub{font-family:'Open Sans',sans-serif;font-weight:500;font-size:1.7vw;line-height:1.5;
    color:var(--ink-soft);margin-top:3.4vh;max-width:34ch}
  .body{font-family:'Open Sans',sans-serif;font-weight:400;font-size:1.5vw;line-height:1.64;
    color:var(--ink-soft);margin-top:3.4vh;max-width:42ch}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.2vw;font-weight:700;letter-spacing:.03em;
    color:var(--accent);margin-top:5vh;text-transform:uppercase}
  .brandline b{font-weight:800}
  /* section slides */
  .t-section{background:var(--panel)}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.15vw;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--gold);margin-bottom:2.6vh}
  .t-section h1{font-size:4.9vw}
  .t-section .rule{width:8.5vw;height:4px;background:var(--gold);border-radius:3px;margin-top:4vh}
  /* dark reframe slides */
  .t-dark{background:var(--stage)}
  .t-dark h1{color:#fff;font-weight:700;font-size:3.7vw;max-width:26ch}
  .t-dark .kicker{color:var(--gold)}
  .t-dark .em{color:var(--gold);font-style:italic}
  /* cta */
  .t-cta{background:var(--panel)}
  .chips{display:flex;gap:1.4vw;margin-top:4.6vh;flex-wrap:wrap}
  .chip{font-family:'Open Sans',sans-serif;font-weight:700;font-size:1.3vw;color:#12151a;background:var(--accent);
    border-radius:100px;padding:1.5vh 2.2vw}
  .disc{font-family:'Open Sans',sans-serif;font-size:.95vw;line-height:1.5;color:var(--muted);
    margin-top:6vh;max-width:56ch}
  h1 .a{color:var(--accent);font-style:italic}
  /* production-rate motif */
  .mc{position:absolute;right:7vw;bottom:8.5vh;width:18vw;height:9vw;opacity:.95}
  .t-title .mc{right:8vw;bottom:11vh;width:23vw;height:12vw;opacity:1}
  /* chrome */
  #hud{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:18px;
    padding:16px 26px;z-index:20;pointer-events:none}
  #track{flex:1;height:3px;background:rgba(241,196,15,.16);border-radius:3px;overflow:hidden}
  #bar{height:100%;width:0;background:var(--gold);transition:width .5s ease}
  #count{font-family:'Open Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
  .nav{position:fixed;top:0;height:100vh;width:14vw;z-index:15;cursor:pointer;background:transparent;border:0}
  #prev{left:0}#next{right:0}
  #hint{position:fixed;right:26px;bottom:34px;font-family:'Open Sans',sans-serif;font-size:12px;
    letter-spacing:.08em;color:var(--muted);z-index:20;transition:opacity .4s}
  @media(max-width:760px){h1{font-size:7.2vw}.sub,.body{font-size:3.4vw}.kicker{font-size:2.6vw}
    .t-section h1{font-size:8.4vw}.chip{font-size:3vw}.disc{font-size:2.4vw}.mc{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="ratemotif" viewBox="0 0 260 140">
  <line x1="18" y1="118" x2="248" y2="118" stroke="#55636f" stroke-width="2"/>
  <line x1="18" y1="118" x2="18" y2="14" stroke="#55636f" stroke-width="2"/>
  <path d="M22 104 L70 104 L70 80 L118 80 L118 58 L166 58 L166 36 L214 36 L214 18" fill="none" stroke="#f1c40f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22" cy="104" r="5" fill="#55636f"/>
  <circle cx="214" cy="18" r="5.5" fill="#f1c40f"/>
</symbol></svg>

<div id="deck"></div>
<div id="hud"><div id="track"><div id="bar"></div></div><div id="count">01 / 01</div></div>
<button id="prev" class="nav" aria-label="Previous"></button>
<button id="next" class="nav" aria-label="Next"></button>
<div id="hint">Use arrow keys &rarr;</div>
<script>
const S = [
 {t:'title',title:'The Profitable Hardscape Job',sub:'How working hardscape crews turn great installs into real profit, by building every job around the numbers instead of hoping it pencils out at the end.',brand:true,mc:true},
 {t:'normal',k:'Who this is for',title:'The work looks incredible. The bank account does not agree.',body:'You are booked out. The patios photograph beautifully, the walls are dead straight, the reviews are glowing. Then the season ends, you look at what is left over, and it is nowhere near what all that work should have paid. If you are busier than ever and the money still feels tight, this is for you.'},
 {t:'normal',k:'The real cost',title:'Revenue went up. Profit stayed flat. That is not a coincidence.',body:'More jobs did not fix it, and it will not, because the leak is inside the job, not the calendar. A crew that loses a few hours a day to rework, slow base prep, and guesswork pricing loses them on every single install. Scale that up and you are just doing more work for the same thin margin.'},
 {t:'dark',title:'A patio can look <span class="em">perfect</span> and still lose money. The install is not the problem. The <span class="em">pace</span> is.'},

 {t:'section',idx:'Part One',title:'Why Good Crews Still Lose Money'},
 {t:'normal',k:'The hidden number',title:'You do not know your production rate, so you cannot price the job.',body:'Production rate is simply how much finished work your crew lays per labor hour: square feet of pavers, face feet of wall. Most contractors have never measured it, so the bid is a guess and the profit is whatever is left by accident. When you do not know the number, the job sets your pay. When you do, you set it.'},
 {t:'normal',k:'Doing it twice',title:'Every shortcut in the base gets paid for later, with interest.',body:'Skipped sub-soil compaction, thin base, geo-fabric left in the truck: none of it shows on day one. It shows in the callback, the settled paver, the wall that leans in year two. Rework is the most expensive labor you will ever run, because you already spent the first set of hours and now you are buying them again.'},
 {t:'dark',title:'You do not get paid for the patio. You get paid for the hours it <span class="em">did not</span> take.'},

 {t:'section',idx:'Part Two',title:'Build the Job Around the Numbers'},
 {t:'normal',k:'Know your rate',title:'Measure production once, and every bid after it gets honest.',body:'Time a real crew on a real install and you get your true rate for pavers, seat walls, and retaining walls. That one number turns estimating from a hopeful guess into arithmetic. You stop underbidding the hard jobs, you stop leaving money on the easy ones, and you finally know which work is actually worth taking.'},
 {t:'normal',k:'Base done once',title:'Sub-soil compaction, geo-grid, and the details that hold for years.',body:'The parts nobody sees are the parts that decide whether you are back on this job in two years for free. Proper sub-soil compaction, the right base depth, geo-fabric and geo-grid where the engineering calls for it: get these right once and the finished work stays finished. That is craftsmanship and it is also margin protection.'},
 {t:'normal',k:'Systematize the crew',title:'A crew that runs on standards does not run on you.',body:'When the process for attire, time off, phones, and how a job gets set up lives in a handbook instead of in your head, the work holds its standard whether you are on site or quoting the next one. Systems are what let a good install become a repeatable one, and a repeatable install is the only kind you can price with confidence.'},
 {t:'normal',k:'Price from the numbers',title:'Budget the job before the first paver, not after the last.',body:'Once you know your production rate and your true material and crew costs, the budget writes itself and the price defends itself. You build the margin in at the estimate, you watch the hours against the rate as the job runs, and you know by day two whether you are ahead or behind, while you can still do something about it.'},
 {t:'dark',title:'Same crew. Same trucks. A job that pays because you <span class="em">built</span> it to.'},

 {t:'section',idx:'Part Three',title:'Run It Like a Real Company'},
 {t:'normal',k:'On the next job',title:'What changes on the very next install.',body:'You bid it from your rate, not your gut. You set the base to a standard the crew already knows. You track the hours as they happen. The patio still looks incredible, the reviews still come in, but this time the number at the end is one you decided on before you ever broke ground.'},
 {t:'normal',k:'Why learn this from me',title:'I still run the crew. This is how we actually build.',body:'I am Caleb Auman. Alongside The Hardscape Academy, my wife Brittany and I run Auman Landscape, a seven-figure hardscape company, with more than twenty years in the trade. I host the Kid Contractor Podcast, and everything I teach is the exact system we use on our own jobs, not theory from a classroom.'},
 {t:'dark',title:'Profit is not a bigger job. It is a tighter <span class="em">system</span> on the job you already have.'},

 {t:'section',idx:'Your next step',title:'Learn the System With Me'},
 {t:'normal',k:'How the training helps',title:'Hands on the material, numbers on the whiteboard.',body:'At the in-person training we install pavers and walls together, then take the same job back to the numbers: your production rate, your base standards, your budget, and how to price the next one to profit. You leave with the method in your hands and the math in your notebook, ready to run on Monday.'},
 {t:'cta',title:'Ready to build jobs that actually pay?',chips:['Reserve your in-person training seat','Join the bi-weekly coaching calls'],disc:'Educational content on hardscape installation and running a contracting business, for professional contractors and crews. No specific revenue, profit, or business result is guaranteed. Results vary by contractor, market, crew, and effort.'},
];

const deck=document.getElementById('deck');
function mc(){return '<svg class="mc"><use href="#ratemotif"/></svg>'}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Hardscape <b>Academy</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mc||s.t==='title') h+=mc();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
