<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Three Skills That Hold Up Under Match Pressure — Christian Straka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe6;        /* his dominant cream ground (brand.json, 58 uses) */
    --panel:#ffffff;     /* tint of the ground */
    --rule:#e4dccb;      /* soft rule, tint of ground */
    --ink:#1a1814;       /* his body ink (brand.json, 35 uses) */
    --muted:#6f675b;     /* muted warm grey */
    --accent:#c17a3e;    /* his bronze accent (brand.json, 8 uses) */
    --display:"Cormorant Garamond",Georgia,serif;  /* his display face */
    --body:"Inter",system-ui,sans-serif;           /* his body face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:10px;
    padding:52px 56px;margin:0 0 22px;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 2px rgba(26,24,20,.04);
  }
  .kicker{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;
    letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.1;
    margin-bottom:18px}
  h3{font-family:var(--display);font-weight:600;font-size:26px;margin-bottom:8px}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:64ch;margin-bottom:14px}
  p.lede{font-size:21px;color:var(--muted)}
  .courtline{height:2px;width:74px;background:var(--accent);border:0;margin:0 0 26px}
  .courtline.center{margin-left:auto;margin-right:auto}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:18px;line-height:1.5;padding:14px 0 14px 30px;position:relative;
    border-top:1px solid var(--rule)}
  li:first-child{border-top:0}
  li:before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;
    background:var(--accent);border-radius:50%}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:16px;margin-top:3px}
  .title-slide{text-align:center;align-items:center}
  .title-slide .courtline{margin-left:auto;margin-right:auto}
  .meta{font-size:15px;color:var(--muted);margin-top:8px}
  .big{font-family:var(--display);font-size:30px;line-height:1.25;color:var(--ink);
    max-width:24ch}
  .cta h2{font-size:42px}
  .steps{margin-top:12px}
  .steps li:before{background:transparent;border:2px solid var(--accent);
    width:22px;height:22px;top:14px;left:0}
  .steps li{padding-left:42px;counter-increment:step}
  .steps{counter-reset:step}
  .steps li:after{content:counter(step);position:absolute;left:6px;top:15px;
    font-size:12px;font-weight:600;color:var(--accent)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;max-width:70ch;
    line-height:1.5}
  .pagenum{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-top:26px}
  @media(max-width:640px){
    .slide{padding:34px 26px;min-height:auto}
    h1{font-size:38px}h2{font-size:30px}.cta h2{font-size:32px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',
  kicker:'A masterclass for competitive players and their parents',
  h1:'The Three Skills That Hold Up Under Match Pressure',
  lede:'Why "just stay present" never worked, and what to train instead.',
  meta:'Christian Straka · Mental Performance for Tennis'},

 {t:'std', kicker:'Who this is for',
  h2:'You have watched this happen.',
  p:['A player who strikes the ball beautifully in practice, then plays a different, smaller game the moment the match matters.',
     'The forehand is there. The footwork is there. What leaves is the mind, and nobody has ever trained it the way they trained the forehand.'],
  lede:'This is for competitive juniors, college and pro players, and the parents and coaches around them.'},

 {t:'hook', kicker:'The uncomfortable part',
  big:'The most common mental advice in tennis is also the least useful.',
  p:['"Stay present." "Be confident." "Relax out there." None of it tells a player what to actually do with their attention on the next point.',
     'You cannot train an instruction that vague. So under pressure, it disappears.']},

 {t:'std', kicker:'Part One · The real problem',
  h2:'The mind is treated as a mood, not a skill.',
  p:['We train the body with precision: reps, feedback, progressions. Then we hand the mind a slogan and hope.',
     'The truth underneath every choke, every rushed shot, every spiral after an error, is that attention was never trained as equipment. It was left to chance.']},

 {t:'std', kicker:'Part One · The real problem',
  h2:'What actually breaks down under pressure.',
  ul:[
   {b:'Attention goes to the wrong place.',s:'The scoreboard, the opponent&#39;s body language, the last mistake, instead of the ball and the pattern.'},
   {b:'Perception blurs.',s:'The player is trying hard but no longer noticing the information that decides the point.'},
   {b:'Reaction takes over.',s:'One bad call or one loose game, and the emotional noise runs the match.'}
  ]},

 {t:'hook', kicker:'Part One · The mechanism',
  big:'A choke is not a character flaw. It is untrained attention doing exactly what untrained attention does.',
  p:['Under threat, attention narrows and jumps to the danger: the score, the fear of the double fault, the memory of last time.',
     'The player is not weak. They are running a mind that was never given a job for that moment, so it took the first one it found.']},

 {t:'std', kicker:'Part Two · The system',
  h2:'Three skills. One system.',
  lede:'Mental performance is not one thing to "get right." It is three trainable skills that have to work at the same time, under pressure.',
  p:['Trained in isolation, none of them holds. Trained together, they become the part of the game that stops collapsing when the score gets close.']},

 {t:'std', kicker:'Part Two · Skill one',
  h2:'Concentration',
  p:['Concentration is not one thing. In tennis it is four distinct subskills that can be weak or strong independently.'],
  ul:[
   {b:'Where attention goes',s:'Aiming it at what matters on this point.'},
   {b:'How stable it stays',s:'Holding it when the score, the crowd, or the body pulls on it.'},
   {b:'How fast it returns',s:'Recovering it in the seconds after it is lost.'},
   {b:'How wide or narrow it is',s:'Sizing it to the moment: the serve, the rally, the read.'}
  ]},

 {t:'std', kicker:'Part Two · Skill two',
  h2:'Sensory Clarity',
  big:'Paying attention and noticing clearly are not the same thing.',
  p:['A player can be trying with everything they have and still miss the information that would have won the point: the height of the ball, the tell in the toss, the shift in their own tension.',
     'Sensory clarity is the trained ability to see, feel and hear what is actually happening, instead of what the nerves are narrating.']},

 {t:'std', kicker:'Part Two · Skill three',
  h2:'Equanimity',
  big:'Equanimity is not calm. It is the trained ability to let experience be exactly what it is without adding interference.',
  p:['The bad line call still happens. The nerves still show up. Equanimity is not making them go away, it is not letting them run the next point.',
     'This is what people are pointing at when they say a player is "mentally tough." It is a skill, and it can be built.']},

 {t:'std', kicker:'Part Two · Why one is not enough',
  h2:'Training one without the others is not enough.',
  p:['Concentration without clarity aims hard at the wrong thing. Clarity without equanimity notices the danger and panics. Equanimity without concentration is calm and aimless.',
     'The three only pay off together, which is why they are trained as one system, not three separate drills.']},

 {t:'std', kicker:'Part Two · One point, all three',
  h2:'One second serve, in slow motion.',
  p:['Serving at 4-5, second serve. Concentration puts attention on the toss and the target, not the consequence.',
     'Sensory clarity feels the exact tension in the arm and the height of the ball, so the swing is a read, not a guess. Equanimity lets the nerves be there without turning them into a push or a pull.'],
  lede:'One point, three skills, working at once. That is the unit we train.'},

 {t:'std', kicker:'Part Three · How it is trained',
  h2:'Built inside the workout, not bolted on.',
  p:['The mistake is treating the mind as a separate session: a book, a meditation app, a talk before the tournament.',
     'These three skills are trained inside the practice itself, woven into the drills and the points, so they transfer to the one place that counts: the match.'],
  lede:'You do not add mental training to the schedule. You change how the practice already on the schedule is run.'},

 {t:'std', kicker:'Part Three · Inside a drill',
  h2:'The same crosscourt drill, run as mental training.',
  ul:[
   {b:'Give attention a job.',s:'Before the ball, the player names where attention goes. Every ball, not just the misses.'},
   {b:'Add a noticing target.',s:'Call the contact height, or the spin, out loud. Perception becomes a rep, not an accident.'},
   {b:'Rehearse the reset.',s:'After an error, a trained two-second return to the next ball, so nothing compounds.'}
  ],
  lede:'No new hour on the calendar. The drill was already happening.'},

 {t:'std', kicker:'Part Three · Over a season',
  h2:'The two games become one.',
  ul:[
   {b:'The practice player and the match player converge.',s:'The level in the drill starts showing up when it is 4-4 in the third.'},
   {b:'Errors stop compounding.',s:'One bad point stays one point, instead of becoming three games.'},
   {b:'Attention has somewhere to go.',s:'Under pressure the player has a trained answer, not a slogan.'}
  ]},

 {t:'std', kicker:'For the parents in the room',
  h2:'What to watch for, and what not to say.',
  p:['The tell is not the losing. It is the gap: a player who is clearly better in practice than they are allowed to be in matches.',
     '"Just relax" and "you&#39;ve got this" are the adult version of "stay present." Kindly meant, and just as untrainable. The support that helps is the kind that points at a skill being built, not an outcome being demanded.']},

 {t:'std', kicker:'Why this, why me',
  h2:'Forty years, on both sides of the net.',
  p:['I played professionally, coached at an academy in Spain for six years, and built a course at USC on mindfulness and athletic performance. I have led mindset work for teams and for a global program across 80 cities.',
     'Fifteen years of daily practice sit behind this, but the reason it works is simpler: it treats the mind the way good coaching already treats the body. As something you train on purpose.'],
  meta:'Named work includes Grand Slam and ATP-level players; a book with Mike Bryan is in progress.'},

 {t:'cta', kicker:'Where to start',
  h2:'Train the part of the game everyone else is guessing at.',
  p:['If you are a competitive player, a parent, or a coach who wants the mental side trained with the same rigor as the forehand, the next step is a conversation.'],
  steps:[
   {b:'Apply to work together',s:'A short application so we can see if it is a fit.'},
   {b:'We map the gaps',s:'Which of the three skills is actually costing points right now.'},
   {b:'It gets built into practice',s:'On-court in Los Angeles, or remote over a 12-week start.'}
  ],
  disclaimer:'This masterclass is educational. Mental performance training supports how a player competes; it is not therapy or mental-health treatment, and it makes no guarantee of specific rankings, wins, or results. Outcomes vary by player and effort.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
 const el=document.createElement('section');
 el.className='slide '+(s.t==='title'?'title-slide':s.t==='cta'?'cta':'');
 let h='';
 if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
 h+='<hr class="courtline'+(s.t==='title'?' center':'')+'">';
 if(s.h1) h+='<h1>'+s.h1+'</h1>';
 if(s.h2) h+='<h2>'+s.h2+'</h2>';
 if(s.big) h+='<p class="big">'+s.big+'</p>';
 if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
 if(s.p) s.p.forEach(x=>h+='<p>'+x+'</p>');
 if(s.ul){h+='<ul>';s.ul.forEach(li=>h+='<li><b>'+li.b+'</b><span>'+li.s+'</span></li>');h+='</ul>';}
 if(s.steps){h+='<ul class="steps">';s.steps.forEach(li=>h+='<li><b>'+li.b+'</b><span>'+li.s+'</span></li>');h+='</ul>';}
 if(s.meta) h+='<p class="meta">'+s.meta+'</p>';
 if(s.disclaimer) h+='<p class="disclaimer">'+s.disclaimer+'</p>';
 h+='<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
 el.innerHTML=h;
 deck.appendChild(el);
});
</script>
</body>
</html>
