<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Why Willpower Keeps Failing You · The Mindful Habit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#20242c; --panel:#171a20; --rule:#333842;
    --acc:#c67a6b; --idx:#9aa2b2; --chalk:#f4f1ec; --grey:#c3c7d0; --dim:#7b828f;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Roboto',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Roboto',sans-serif;font-size:1.02vw;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:500;color:var(--chalk);line-height:1.18;letter-spacing:-.005em}
  .t-title h1{font-size:4vw;max-width:90%}
  .t-normal h1{font-size:2.7vw;max-width:82%;font-weight:600}
  .t-normal .body{font-family:'Roboto',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.8vh;max-width:76%;line-height:1.62;font-weight:300}
  .sub{font-family:'Roboto',sans-serif;font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.55;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Roboto',sans-serif;font-size:1.3vw;font-weight:500;color:var(--idx);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:4vw;max-width:88%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#2a2f39 0%,#12151b 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.1vw;max-width:82%;font-style:italic;color:#f4f1ec;font-weight:400}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2a2f39 0%,#12151b 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.3vw;max-width:80%;font-weight:600}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#e7c8bf;border-radius:100px;padding:1.4vh 1.8vw;font-size:1.18vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-family:'Roboto',sans-serif;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .ring-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-ring{right:7%;bottom:9%;width:19vw}
  .brandline{font-family:'Roboto',sans-serif;font-size:1.2vw;color:var(--grey);margin-top:3.6vh;font-weight:300;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:500}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(244,241,236,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:500}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.4vw}
    .t-cta h1{font-size:6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Mindful Habit</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- breathing ring motif: concentric circles, mindfulness -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ring" viewBox="0 0 200 200">
  <g fill="none" stroke="#c67a6b">
    <circle cx="100" cy="100" r="20" stroke-width="2.4" opacity="0.95"/>
    <circle cx="100" cy="100" r="46" stroke-width="1.8" opacity="0.6"/>
    <circle cx="100" cy="100" r="72" stroke-width="1.4" opacity="0.35"/>
    <circle cx="100" cy="100" r="96" stroke-width="1" opacity="0.18"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Why Willpower Keeps Failing You',sub:'A live masterclass for men on ending compulsive sexual behavior by changing the habit that drives it, instead of white-knuckling against it.',brand:true},
 {t:'normal',k:'Who this is for',title:'You have built a life that works. This one thing will not stay fixed.',body:'You are capable, respected, and successful in the parts of your life that people see. In private there is a pattern you have tried to stop more times than you can count, and every time you promise yourself that this was the last one.'},
 {t:'dark',title:'You do not have a willpower problem. Willpower was never the right tool for this.'},

 {t:'section',idx:'Part One',title:'Why Willpower and Shame Lose'},
 {t:'normal',k:'The willpower trap',title:'Willpower is the tool that fails you exactly when you need it most.',body:'On a good day, gritting your teeth works. On a hard night, tired or stressed or alone, willpower is the first thing to go. A plan that depends on being strong in your weakest moment is a plan built to break, and every break makes the next one feel more certain.'},
 {t:'normal',k:'The shame loop',title:'Shame does not stop the behavior. It feeds it.',body:'The secrecy, the self-punishment, and the promise to try harder become the exact stress the behavior exists to relieve. Fighting yourself harder tightens the loop instead of loosening it.'},
 {t:'normal',k:'The powerless dead end',title:'Being told you are powerless leaves you with nothing to actually do.',body:'If the only story on offer is that this is a disease you are helpless against, there is no lever to pull on a hard night. Change needs the opposite starting point: this is something you can learn to run differently.'},
 {t:'dark',title:'The behavior is not who you are. It is a habit your brain learned, and a habit can be redesigned.'},

 {t:'section',idx:'Part Two',title:'The Mindful Habit System'},
 {t:'normal',k:'Principle one, the science of habits',title:'Every episode runs the same quiet loop.',body:'A trigger, a routine, and a moment of relief that teaches your brain to do it again. Once you can see the loop instead of being swept along by it, you have something you can change on purpose rather than by force.'},
 {t:'normal',k:'Principle two, mindfulness',title:'The whole change lives in the pause between the trigger and the act.',body:'Mindfulness is the trained ability to notice the pull the moment it arrives and to stay with it long enough to choose. It is not meditation for its own sake. It is the space where a different decision becomes possible.'},
 {t:'normal',k:'Principle three, a great life',title:'Recovery is not a smaller life. It is a fuller one.',body:'Trying to subtract a behavior and add nothing leaves a vacuum the old habit rushes back to fill. The system points the other way: build a life with enough real connection, purpose, and meaning that the old pattern has no room left.'},
 {t:'normal',k:'Find the unmet need',title:'The habit was never really about the behavior.',body:'It was medicating something underneath: stress, loneliness, boredom, a disconnection you did not have words for. When you name the need and start meeting it directly, the pull on the surface begins to lose its grip.'},
 {t:'normal',k:'Install the replacement',title:'You do not delete a habit. You give it a new routine to run.',body:'Map the trigger before it arrives, decide the healthy response in advance, and repeat it until the new loop is the automatic one. This is where self control stops being a fight and starts being a system that mostly runs itself.'},
 {t:'normal',k:'Rebuild trust and connection',title:'The part most programs skip: the relationship, and healthy sexuality.',body:'Lasting change includes restoring trust with the people the behavior hurt and building a healthy, connected sexuality to move toward, not just a list of things to avoid. This is the difference between staying stopped and being well.'},
 {t:'dark',title:'You are not trying to stop a behavior. You are becoming the man who no longer needs it.'},

 {t:'section',idx:'Part Three',title:'What Change Looks Like'},
 {t:'normal',k:'The first weeks',title:'Fewer episodes, longer gaps, and a plan instead of a fight.',body:'The first thing most men notice is not perfection. It is that when a trigger arrives, they finally have something to do with it besides brace and hope. The gaps stretch, the shame quiets, and the work becomes building the life rather than resisting the habit.'},
 {t:'normal',k:'Who is teaching this',title:'A method built the hard way, by someone who lived it.',body:'Craig Perra is a former attorney with more than thirteen years of his own recovery who built The Mindful Habit System and has guided men and their partners through it, backed by hundreds of verified client reviews. The approach is structured, private, and built on agency rather than shame.'},
 {t:'cta',title:'Ready to change the habit instead of fighting it?',chips:['Book a call with Coach Craig'],disc:'Educational content for men seeking to change compulsive sexual behavior. This is coaching, not therapy, medical, or psychological treatment, and not a substitute for care from a licensed professional. No specific outcome is guaranteed and results vary by person and effort.'},
];

const deck=document.getElementById('deck');
function ringSvg(){return `<svg class="ring-motif title-ring"><use href="#ring"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The <b>Mindful Habit</b> &middot; Craig Perra</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=ringSvg();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
