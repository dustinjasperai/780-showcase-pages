<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Floor of the Mouth - A Live Masterclass with Dr. Neel Bulchandani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f3fb;        /* light indigo-tinted ground (from brand #131133 family) */
    --panel:#ffffff;
    --ink:#15132e;       /* deep indigo, near brand #131133 */
    --soft:#5a5775;      /* muted indigo-grey */
    --rule:#2b2958;      /* brand indigo */
    --accent:#607179;    /* brand slate - the one accent */
    --display:'Poppins',system-ui,sans-serif;
    --serif:'Merriweather',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    position:relative;background:var(--panel);border:1px solid #e4e1f0;
    border-radius:16px;padding:52px 56px;margin:0 0 20px;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 1px 0 #ece9f6;
  }
  .slide::before{ /* fine concentric phase-shift keyline motif */
    content:"";position:absolute;right:-120px;top:-120px;width:300px;height:300px;
    border-radius:50%;border:1px solid rgba(96,113,121,.25);
    box-shadow:0 0 0 18px rgba(43,41,88,.04),0 0 0 44px rgba(96,113,121,.07);
  }
  .n{position:absolute;left:56px;top:26px;font-family:var(--display);font-weight:600;
     font-size:12px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
  .eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.16em;
     text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:48px;line-height:1.05;
     letter-spacing:-.01em;color:var(--ink);margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:33px;line-height:1.12;
     color:var(--ink);margin-bottom:16px}
  .lede{font-size:20px;color:var(--soft);max-width:42ch}
  p.body{font-size:18px;color:var(--ink);max-width:54ch;margin-top:6px}
  .sub{font-size:16px;color:var(--soft);margin-top:14px}
  ul{list-style:none;margin-top:10px}
  li{position:relative;padding-left:30px;margin:14px 0;font-size:19px;max-width:52ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;
     border-radius:50%;border:2px solid var(--accent)}
  .pillar-k{font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent);
     letter-spacing:.05em;text-transform:uppercase}
  .pillar-t{font-family:var(--display);font-weight:600;font-size:26px;margin:4px 0 8px}
  .foot{position:absolute;left:56px;bottom:24px;font-family:var(--display);font-size:12px;
     letter-spacing:.08em;color:var(--soft)}
  .presenter{margin-top:26px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink)}
  .presenter span{display:block;font-family:var(--serif);font-weight:400;font-size:14px;color:var(--soft);margin-top:3px}
  .rulebar{width:52px;height:4px;background:var(--rule);border-radius:3px;margin:0 0 22px}
  .cta h1{font-size:40px}
  .disc{font-size:13px;color:var(--soft);margin-top:26px;max-width:58ch;font-style:italic}
  @media(max-width:640px){.slide{padding:40px 26px}h1{font-size:34px}.cta h1{font-size:30px}h2{font-size:26px}.n,.foot,.presenter{left:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass for practitioners',h1:'Open the Mouth.<br>Reset the System.',lede:'The floor of the mouth is the hidden switch for airway, posture and the nervous system. Here is how to work it.',presenter:'Dr. Neel Bulchandani, DC',presenterSub:'Creator of Floor 4, FMDI and the Phase Shift approach'},
  {t:'big',eyebrow:'What you will leave with',h2:'By the end of this hour you will see the floor of the mouth the way I do.',body:'A clear map of why freeing the mandibular diaphragm reorganizes the whole body, and where it fits in the work you already do.'},
  {t:'list',eyebrow:'Who this is for',h2:'If you work with bodies and breath, this is for you.',items:['Bodyworkers, manual and craniosacral therapists','Myofunctional and orofacial therapists','Dentists, ENTs, RDHs and airway-focused clinicians','Speech-language pathologists and birth workers']},
  {t:'big',eyebrow:'The trap',h2:'You keep chasing the symptom downstream.',body:'Tension comes back. The airway case plateaus. The tongue work only holds for so long. It is not that the methods are wrong. It is that the real switch is upstream of where most hands are working.'},
  {t:'big',eyebrow:'The reframe',h2:'The jaw is the body\'s switchboard.',body:'The floor of the mouth, the mandibular diaphragm, sits at the crossroads of breath, posture and regulation. Treat it as scenery and the system fights you. Free it and the system reorganizes itself.'},
  {t:'big',eyebrow:'Part one - the core problem',h2:'Most training treats the floor of the mouth as scenery.',body:'We are taught to assess the tongue, the palate, the bite. The floor beneath them, the mandibular diaphragm, almost never gets its own assessment. So the one tissue that gates the others is the one left untouched.'},
  {t:'big',eyebrow:'Part one',h2:'Meet the mandibular diaphragm.',body:'A living sheet of muscle and fascia under the tongue that tethers the jaw, the hyoid and the airway together. When it is bound, breath, swallow and posture all pay the tax. When it releases, they all get slack back at once.'},
  {t:'big',eyebrow:'Part two - the framework',h2:'FMDI: Functional Mandibular Diaphragmatic Integration.',body:'The method I built to assess and release the floor of the mouth and then let the change travel. Three pillars carry it.'},
  {t:'pillar',eyebrow:'FMDI - pillar one',k:'Pillar 1',pt:'Mandibular diaphragm release',body:'Freeing the floor of the mouth changes cranial-base mechanics and opens airway function at the source. This is the first domino, not the last.'},
  {t:'pillar',eyebrow:'FMDI - pillar two',k:'Pillar 2',pt:'Visceral-postural reorganization',body:'The release cascade. As the floor lets go, the body\'s alignment chains restructure - the change does not stay local, it travels down the line.'},
  {t:'pillar',eyebrow:'FMDI - pillar three',k:'Pillar 3',pt:'Nervous-system baseline shift',body:'With less to brace against, the nervous system settles into a more efficient baseline: less strain, more stability. The body stops guarding and starts trusting the new pattern.'},
  {t:'big',eyebrow:'The Phase Shift',h2:'When the floor releases, the whole system shifts at once.',body:'Easier breathing, improved alignment, more efficient movement, together, quickly. That rapid, system-wide reorganization is what I call the Phase Shift. It is the moment the body picks a new baseline.'},
  {t:'list',eyebrow:'Part three - the protocol',h2:'Floor 4: how I actually assess the floor of the mouth.',items:['Read the floor of the mouth as its own tissue, not an afterthought','Locate where the mandibular diaphragm is tethered','Release in the order the body can accept','Let the Phase Shift travel, then re-check the whole chain']},
  {t:'big',eyebrow:'In the room',h2:'The System Reset Experience.',body:'A single focused session built on this protocol. One floor-of-the-mouth release, then time to let the Phase Shift reorganize the body before you re-assess. You watch the baseline move in real time.'},
  {t:'list',eyebrow:'Where it reaches',h2:'The floor of the mouth connects further than you think.',items:['Cranial mechanics and the airway','Visceral relationships through the fascial chains','Plantar and foot dynamics at the far end of the line','Breath, swallow, sleep and jaw function at the source']},
  {t:'big',eyebrow:'Why me',h2:'I built Floor 4 because I needed it in my own hands first.',body:'I am a chiropractor and bodyworker who kept finding the same tethered floor under every stubborn case. So I systematized it into FMDI and now teach it to practitioners across Santa Barbara, Houston and Portland, and on the Compromised to Alchemized podcast.'},
  {t:'big',eyebrow:'The community',h2:'A growing directory of Floor-trained practitioners.',body:'Clinicians who have learned to assess and release the floor of the mouth and are putting it to work in their own rooms. The method is teachable, repeatable and already in practice.'},
  {t:'list',eyebrow:'What this is not',h2:'Let us be clear about the claim.',items:['Not a magic bullet - it is a tissue most training skips','Not tongue exercises - this is upstream of the tongue','Not a replacement for your scope - it is a layer underneath it','A switch worth learning to find for yourself']},
  {t:'big',eyebrow:'Recap',h2:'Three pillars. One switch.',body:'Release the mandibular diaphragm. Let the body reorganize. Watch the nervous system pick a steadier baseline. That is the Phase Shift, and it starts at the floor of the mouth.'},
  {t:'cta',eyebrow:'Your next step',h1:'Bring Floor 4 into your practice.',body:'If you want the floor of the mouth in your own hands, train with me. The Floor 4 and FMDI certification path teaches the full protocol, hands-on.',cta:'Train in Floor 4 with Dr. Neel Bulchandani',disc:'Educational content only. Clinical outcomes vary by patient and practitioner, and nothing here is a promise or guarantee of any specific result.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  const num=String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  let html='<div class="n">'+num+'</div>';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){
    html+='<div class="rulebar"></div><h1>'+s.h1+'</h1><p class="lede">'+s.lede+'</p>'+
      '<div class="presenter">'+s.presenter+'<span>'+s.presenterSub+'</span></div>';
  } else if(s.t==='pillar'){
    html+='<div class="pillar-k">'+s.k+'</div><div class="pillar-t">'+s.pt+'</div><p class="body">'+s.body+'</p>';
  } else if(s.t==='list'){
    html+='<h2>'+s.h2+'</h2><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  } else if(s.t==='cta'){
    html+='<div class="rulebar"></div><h1>'+s.h1+'</h1><p class="body">'+s.body+'</p>'+
      '<div class="presenter">'+s.cta+'</div><p class="disc">'+s.disc+'</p>';
  } else {
    html+='<h2>'+s.h2+'</h2><p class="body">'+s.body+'</p>';
  }
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
