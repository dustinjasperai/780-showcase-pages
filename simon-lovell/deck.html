<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off The Hourly Court — a Picklepreneurs masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1512; --panel:#13201F; --rule:#27352F;
    --ink:#EAF2EC; --muted:#9FB7AE; --accent:#C8E600;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Roboto",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:48px 44px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;right:30px;top:28px;width:16px;height:16px;border-radius:50%;background:var(--accent);opacity:.9}
  .slide::before{content:"";position:absolute;right:52px;top:34px;width:4px;height:4px;border-radius:50%;background:var(--bg);box-shadow:8px 0 0 var(--bg),-8px 0 0 var(--bg),0 8px 0 var(--bg),0 -8px 0 var(--bg);opacity:.0}
  .kicker{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:52px;line-height:1.03;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-.01em;margin-bottom:16px}
  .lede{font-size:21px;line-height:1.5;color:var(--ink);max-width:46ch}
  .sub{font-size:19px;line-height:1.55;color:var(--muted);max-width:52ch;margin-top:6px}
  ul{list-style:none;margin-top:14px}
  li{font-size:19px;line-height:1.45;padding-left:30px;position:relative;margin-bottom:14px;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .big{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:72px;color:var(--accent);line-height:1}
  .step{font-family:"Space Grotesk",sans-serif;font-weight:700;color:var(--accent);font-size:20px;letter-spacing:.04em}
  .foot{position:absolute;left:44px;bottom:22px;font-size:12px;color:var(--muted);letter-spacing:.06em;font-family:"Space Grotesk",sans-serif;text-transform:uppercase}
  .pg{position:absolute;right:44px;bottom:22px;font-size:12px;color:var(--muted);font-family:"Space Grotesk",sans-serif}
  .cta h2{font-size:40px}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:var(--muted);max-width:60ch;border-top:1px solid var(--rule);padding-top:14px}
  .brandline{font-family:"Space Grotesk",sans-serif;color:var(--accent);font-weight:600;font-size:15px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A Picklepreneurs masterclass',h1:'Off The Hourly Court',lede:'How pickleball coaches build a six-figure business without trading more hours for dollars.',foot:'Simon Lovell · Picklepreneurs'},
 {t:'audience',kicker:'Who this is for',h2:'The coach who is fully booked and still stuck',sub:'You are certified. Players love you on court. Your calendar is packed. And your income still has a hard ceiling, because there is one of you and the day only has so many hours.'},
 {t:'trap',kicker:'The trap',h2:'You left a job you tolerated for a court you love',sub:'Then you quietly rebuilt the same ceiling. Your rate times your open hours is the whole business. Rain cancels your pay. One body, one court, one calendar. Growth means waking up earlier.'},
 {t:'reframe',kicker:'The hard truth',h2:'More students will not fix this',lede:'The better you get, the fuller you are, and the tighter the trap gets. The hourly model is not the floor you build on. It is the problem.'},
 {t:'part',kicker:'Part one',h2:'The core problem',lede:'You are selling hours. A business sells transformations. Those are two different things, and only one of them scales past you.'},
 {t:'content',kicker:'Part one',h2:'The hourly ceiling, in numbers',sub:'Say you coach 30 billable hours a week at your private rate. That number is your entire income, forever, minus the weeks it rains and the weeks you are sick. There is no leverage in it. Every dollar is rented, not owned.'},
 {t:'part',kicker:'Part two',h2:'The 5-Step Beginner Ascension System',lede:'This is the system I teach inside Pickleball Coach Business Mastery. It moves you from selling single sessions to running a business that grows while you sleep.'},
 {t:'content',kicker:'Step 1 · Group',h2:'Stop selling one seat at a time',sub:'A beginner does not need a private lesson. They need a room of people at their level. Group players together and a single court hour that paid you for one now pays you for six.',extra:'A group of six beginners is roughly $1,800 of value from the same hour you were renting out one at a time.'},
 {t:'content',kicker:'Step 2 · Ascend',h2:'Build the ladder up front',sub:'Beginners do not stay beginners. The system is designed so a new player has an obvious next rung the day they finish the first one, so nobody graduates out of your business the moment they improve.'},
 {t:'content',kicker:'Step 3 · Multiply',h2:'Clone your court hours',sub:'There is a point where the answer is not another hour from you. It is an assistant coach running your system. We cover exactly when to hire, what to hand off, and how to keep your standard on every court without you standing on it.'},
 {t:'content',kicker:'Step 4 · Attract',h2:'A lead system that is not luck',sub:'Use the certification you already have to show up as the authority in your local pickleball groups, feed a simple email database that keeps attracting new players, and run a content rhythm so you never sit down wondering what to post.'},
 {t:'content',kicker:'Step 5 · Referral',h2:'Turn members into human billboards',sub:'Your best marketing already plays on your courts. Built right, your members do the selling for you, bringing their friends in without you spending a dollar on ads. This is the engine that compounds.'},
 {t:'part',kicker:'Part three',h2:'What the scaled week looks like',lede:'Fewer private hours. More groups and programs running with or without you on the court. A pipeline of beginners who already know your name before they book.'},
 {t:'content',kicker:'Part three',h2:'From instructor to owner',sub:'The goal was never to coach more. It was to own something that pays you whether you are on court that morning or not. The same skill, organised as a business instead of a job.'},
 {t:'credibility',kicker:'Why me',h2:'I did this before pickleball',sub:'I spent over a decade helping personal trainers turn a full calendar into a real business. Pickleball found me while I was recovering from Guillain-Barre syndrome, and I built Picklepreneurs to bring that same business system to the people making a living on these courts.'},
 {t:'content',kicker:'The quiet blocker',h2:'The ceiling is often in your head',sub:'Most coaches do not fail on tactics. They self-sabotage, undercharge, and burn out running on hours. Scaling sustainably means getting your own thinking out of the way as much as it means getting the system in place.'},
 {t:'content',kicker:'Recap',h2:'The whole thing in one line',sub:'Group your beginners, build the ladder, multiply with an assistant, attract on purpose, and let your members market for you. That is how a court job becomes a business.'},
 {t:'cta',kicker:'Your next step',h2:'Build yours with me',lede:'If you want the full 5-Step Beginner Ascension System mapped to your courts and your market, this is what I do inside Pickleball Coach Business Mastery and the Picklepreneurs Mastermind.',brand:'picklepreneurs.com',disc:'Educational only. This masterclass teaches a business approach; it is not a guarantee of income or results. Outcomes vary with your market, effort, and execution.'}
];
const el=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t==='cta'?'cta':'');
  let html='';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) html+='<h1>'+s.h1+'</h1>';
  if(s.h2) html+='<h2>'+s.h2+'</h2>';
  if(s.lede) html+='<p class="lede">'+s.lede+'</p>';
  if(s.sub) html+='<p class="sub">'+s.sub+'</p>';
  if(s.extra) html+='<p class="sub" style="color:var(--accent);margin-top:14px">'+s.extra+'</p>';
  if(s.brand) html+='<p class="brandline" style="margin-top:22px">'+s.brand+'</p>';
  if(s.disc) html+='<p class="disc">'+s.disc+'</p>';
  html+='<div class="foot">Picklepreneurs</div><div class="pg">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;
  el.appendChild(d);
});
</script>
</body>
</html>
