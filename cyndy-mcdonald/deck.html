<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Four Journeys &middot; Cyndy McDonald</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf7f1; --panel:#201e46; --rule:#e3ddd0;
    --ink:#201e1d; --inkp:#f7f4ec; --accent:#282462; --gold:#b8890f;
    --grey:#55504a; --greyp:#c9c4dd; --dim:#8a847c;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Source Sans 3',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%;background:var(--bg);color:var(--ink)}
  .slide.active{opacity:1;visibility:visible}
  .slide.t-dark,.slide.t-cta{background:var(--panel);color:var(--inkp)}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  .t-dark .kicker,.t-cta .kicker{color:var(--gold)}
  h1{font-family:'Oswald',sans-serif;font-weight:600;line-height:1.18;letter-spacing:-.005em}
  .t-title h1{font-size:3.4vw;max-width:88%}
  .t-normal h1{font-size:2.5vw;max-width:84%;color:var(--ink)}
  .t-normal .body{font-family:'Source Sans 3',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.58;font-weight:400}
  .sub{font-family:'Source Sans 3',sans-serif;font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Source Sans 3',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.6vw;max-width:88%;color:var(--ink)}
  .t-section .rule{width:16vw;height:3px;background:var(--gold);margin-top:3.4vh}
  .t-dark{align-items:center;text-align:center}
  .t-dark h1{font-size:2.65vw;max-width:82%;font-style:italic;color:var(--inkp)}
  .t-cta{align-items:center;text-align:center}
  .t-cta h1{font-size:2.9vw;max-width:80%;color:var(--inkp)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--gold);color:var(--inkp);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:var(--greyp)}
  .t-title .disc,.t-normal .disc{text-align:left}
  .journey-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-journey{right:5%;bottom:6%;width:22vw}
  .corner-journey{right:6%;bottom:7%;width:9vw;opacity:.55}
  .brandline{font-family:'Source Sans 3',sans-serif;font-size:1.2vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#fff;z-index:20;font-weight:500;font-family:'Source Sans 3',sans-serif;opacity:.55}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#fff;z-index:20;font-weight:600;font-family:'Source Sans 3',sans-serif;opacity:.55}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff;opacity:.55;z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Source Sans 3',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.4vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">The College Counselor's Coach</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- journey motif: a dotted path connecting four waypoints, echoing "The Four Journeys" literally
     (prospect -> client -> consultant -> organization) over a generic growth-arrow or dial -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="journey" viewBox="0 0 320 120">
  <g fill="none" stroke="#282462" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round">
    <path d="M20,95 C70,20 110,105 160,45 C200,3 240,80 300,25"/>
  </g>
  <g fill="#b8890f" stroke="none">
    <circle cx="20" cy="95" r="6"/>
    <circle cx="127" cy="65" r="6"/>
    <circle cx="205" cy="30" r="6"/>
    <circle cx="300" cy="25" r="6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Four Journeys',sub:"A masterclass for independent educational consultants on growing a practice by understanding the four journeys inside it: the prospect's, the client's, the consultant's, and the organization's.",brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:"You built a practice because you're good with families. Nobody taught you how to run the business around it.",body:'Most IECs come from counseling, teaching, or admissions, not from running a company. The skills that make you great with a student in a session are not the skills that fill your calendar, price your services, or turn a solo practice into something sustainable long term.'},
 {t:'dark',title:'The work with families was never the part that was missing. The system that brings new families to you is.'},

 {t:'section',idx:'Part One',title:'Why Growth Stalls at Referral-Only'},
 {t:'normal',k:'The referral ceiling',title:'A practice built entirely on word of mouth grows only as fast as the people already inside your circle can talk about you.',body:'Referrals are real, but they cap out. Families who have never heard of you, in your own market, never find their way in, because there is no path built for them to.'},
 {t:'normal',k:'Pricing without a system',title:"Fees get set once, early, and then rarely revisited, because there's no framework for when or how to raise them.",body:'Client acquisition and fee-setting are two of the business mistakes you\'ve identified IECs make most often, by your own account, across 30 years of watching this field.'},
 {t:'dark',title:'You do not need a bigger referral network. You need a system for the families you have never met.'},

 {t:'section',idx:'Part Two',title:'The Four Journeys'},
 {t:'normal',k:"The Prospect's Journey",title:'How a family finds you, evaluates you, and decides to become a client, long before the first session.',body:"Most IEC marketing stops at \"have a website.\" The Prospect's Journey treats discovery and evaluation as its own system: what a family sees, in what order, before they ever pick up the phone."},
 {t:'normal',k:"The Client's Journey",title:"The experience a family has once they've signed on, session to session, through the whole admissions cycle.",body:'This is where retention, satisfaction, and referrals actually get built or lost, not in the first meeting, but in the structure of every meeting after it.'},
 {t:'normal',k:"The Consultant's Journey",title:'Your own growth as a business owner: pricing, positioning, and how much of yourself the practice is allowed to take.',body:"The consultant's own journey gets ignored in most business advice built for this field. Yours puts it back at the center: what you charge, what you say yes to, and what a sustainable practice actually looks like."},
 {t:'normal',k:"The Organization's Journey",title:'The practice as a business with its own direction, not just a service you personally deliver one family at a time.',body:'Goals, structure, and where the practice is headed as an operation, separate from any one client relationship.'},
 {t:'dark',title:'Built from a coaching practice, not written as generic business theory.'},

 {t:'section',idx:'Part Three',title:'Proof It Works'},
 {t:'normal',k:'Real client outcomes',title:'Consultants who have coached through the Four Journeys describe it as more than a business fix.',body:'"Best thing I have done for myself!" "I wish I had done this sooner." "I learned as much about myself as I did business." Real feedback from IECs who have coached with Cyndy.'},
 {t:'normal',k:'Why Cyndy McDonald',title:'She spent 30 years as a school counselor before becoming the coach IECs turn to for the business side of the practice.',body:'She now teaches in the UCLA Extension online college counseling certificate program and runs Friday Forums, a free, recurring peer discussion series for IECs on exactly these topics.'},

 {t:'section',idx:'Your Next Step',title:'Start With a Conversation'},
 {t:'normal',k:'How it works',title:'A free consultation call finds where your practice needs the Four Journeys most. Coaching sessions build the system that makes it stick.',body:'Sessions run 45-60 minutes, minimum four recommended, with goal-setting, accountability, and support between sessions built in.'},
 {t:'cta',title:'Ready to build the journeys your next clients are already walking through?',chips:['Book Your Free Consultation'],disc:'Educational content for independent educational consultants. No income, growth, or business result is guaranteed. Results vary by practice, market, and effort.'},
];

const deck=document.getElementById('deck');
function journeySvg(kind){return `<svg class="journey-motif ${kind==='title'?'title-journey':'corner-journey'}"><use href="#journey"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The College Counselor's <b>Coach</b> &middot; Cyndy McDonald</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=journeySvg(s.arc);
  else if(s.t==='title') h+=journeySvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
