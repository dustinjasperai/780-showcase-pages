<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is AI Recommending Your Business Yet? — Kylie Pengelly Linke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f4;        /* warm off-white ground (brand.json light scheme, #f6f6f6) */
    --panel:#ffffff;
    --ink:#334259;       /* site body color rgb(51,66,89) */
    --muted:#6b7585;
    --rule:#e3e1dd;
    --accent:#d0002d;    /* site H1/H2/button red rgb(208,0,45) */
    --head:'Cabin', sans-serif;
    --body:'Poppins', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(51,66,89,.04)}
  .eyebrow{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.12;color:var(--ink);margin-bottom:14px}
  h1 .em,h2 .em{color:var(--accent)}
  p{font-size:19px;line-height:1.6;color:var(--ink);margin-top:14px;max-width:62ch}
  p.lead{font-size:22px;color:var(--muted)}
  .promise{margin-top:26px;font-family:var(--head);font-weight:600;font-size:20px;color:var(--accent)}
  ul{margin:18px 0 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  li b{font-family:var(--head);font-weight:600}
  .steps{display:flex;gap:16px;margin-top:26px;flex-wrap:wrap}
  .step{flex:1;min-width:190px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .step .n{font-family:var(--head);font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
  .step h3{font-family:var(--head);font-weight:600;font-size:20px;margin:8px 0 6px}
  .step p{font-size:16px;margin-top:0;color:var(--muted)}
  .kicker{font-family:var(--head);font-weight:600;color:var(--accent);font-size:18px;margin-bottom:8px}
  .foot{font-size:14px;color:var(--muted);margin-top:28px;max-width:70ch}
  .count{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:14px}
  .cta h1{font-size:40px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:30px;border-top:1px solid var(--rule);padding-top:16px;max-width:72ch}
  @media(max-width:620px){.slide{padding:34px 24px}h1{font-size:32px}h2{font-size:25px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass for hospitality & tourism owners',
   h:'Is AI Recommending <span class="em">Your Business</span> Yet?',
   lead:'How to become the venue AI tools and loyal customers keep sending people to.',
   promise:'In the next hour: the exact clarity that gets you found, chosen and remembered.'},

  {t:'who', eyebrow:'Who this is for',
   h:'You run the floor. Not a marketing department.',
   p:'This is for pub, restaurant, bar, cafe and tourism owners who deliver genuinely good service, but are still relying on being busy today to be busy next month. You do not need to be tech-savvy. You need the right clarity and a simple structure you can actually use.'},

  {t:'trap', eyebrow:'The trap',
   h:'Great service that <span class="em">nobody can find</span> is a quiet Tuesday.',
   p:'Your customers have changed how they search. They are not only Googling "restaurant near me" or scrolling socials. They are asking AI tools for a specific recommendation based on where they are going, who they are with and the experience they want. If your message is unclear, inconsistent or generic, AI cannot tell who you are for, and your ideal customers may never find you.'},

  {t:'reframe', eyebrow:'The reframe',
   h:'It is how you make them <span class="em">feel</span> that gets you recommended.',
   p:'A packed Friday does not fix an empty Tuesday. Repeat business does. Regulars, referrals and the customers who tell the AI, the group chat and their friends where to go. That loyalty is built on purpose, with an experience clear enough to deliver every single time, by your team and by the tools working on your behalf.'},

  {t:'part', kicker:'Part One', h:'The real problem is <span class="em">clarity</span>, not effort.',
   p:'Most hospitality and tourism businesses are not overlooked because they are not good enough. They are overlooked because their message is unclear. Before you can be recommended, four things have to be obvious: who you are for, how you sound, the experience you promise, and whether your tools actually know any of it.'},

  {t:'part', kicker:'Part Two', h:'The Repeat Business Foundation',
   p:'Four pieces of clarity that turn good service into repeatable profit. This is the method I rebuilt from running my own pub and working with owners on the floor.'},

  {t:'pillar', eyebrow:'Pillar one', h:'Customer DNA',
   p:'A clear picture of the customers you want more of: who values your experience, spends well and returns often. What matters to them, what gets in their way, and what makes them come back, drawn from real customer feedback rather than guesswork.'},

  {t:'pillar', eyebrow:'Pillar two', h:'Brand Voice',
   p:'Define your personality, messaging style and tone so your website, socials, emails and in-venue language all sound like the same business. When you sound consistent, you become recognisable, and recognisable is what gets remembered and recommended.'},

  {t:'pillar', eyebrow:'Pillar three', h:'Customer Experience DNA',
   p:'The experience you promise, captured so your team and your tools can deliver it every time, including how you recover when something goes wrong. Three moments carry the whole relationship:',
   steps:[
     {n:'Moment 1', h:'The Invitation', p:'How people first meet you, online and at the door.'},
     {n:'Moment 2', h:'The Experience', p:'What it actually feels like to be looked after by you.'},
     {n:'Moment 3', h:'The Relationship', p:'What brings them back, and back again.'}
   ]},

  {t:'pillar', eyebrow:'Pillar four', h:'Your Business Brain',
   p:'Your AI employee induction kit: one source of truth with your business facts and your AI Rules of Engagement, connected step by step to Claude or ChatGPT. So your AI knows your business before it starts working for it, and answers customers in your real voice.'},

  {t:'bonus', eyebrow:'The outside check', h:'Your Digital First Impression',
   p:'Finally, audit what customers see before they choose you: your website, social profiles, booking links and calls to action. Your digital presence should match the promise, so it is easy for both customers and AI to choose and recommend you.'},

  {t:'part', kicker:'Part Three', h:'A room that stays full past Friday.',
   p:'Your message is clear. Your voice is consistent. Your experience promise is written down and delivered the same way on a Tuesday as on a Friday. Your Business Brain means your tools recommend you accurately. First-timers become regulars, and regulars become the people who send everyone else.'},

  {t:'why', eyebrow:'Why me', h:'I have stood where you are standing.',
   p:'I left a corporate career, chased a twenty-year dream and opened an authentic Australian pub in Stockholm, through a pandemic, in a country that was not mine. I know the long days, the quiet Tuesdays and the magic of a room full of people who feel looked after. Now I help hospitality and tourism owners turn that feeling into a system that brings people back.'},

  {t:'cta', eyebrow:'Your next step',
   h:'Let us build your <span class="em">Repeat Business Foundation</span>.',
   p:'If you want the clarity that gets you found, chosen and remembered, the next step is a short conversation about your business. We will look at your Customer DNA, your experience promise and the one change that would bring the most repeat business.',
   disclaimer:'This masterclass is educational. Every business is different and results vary depending on your market, your offer and your own effort. Nothing here is a promise or guarantee of specific income or outcomes.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t === 'cta' ? 'cta' : '');
  let html = '';
  html += '<div class="count">' + (i+1) + ' / ' + S.length + '</div>';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.eyebrow) html += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if (s.h) html += (s.t === 'title' || s.t === 'cta') ? '<h1>' + s.h + '</h1>' : '<h2>' + s.h + '</h2>';
  if (s.lead) html += '<p class="lead">' + s.lead + '</p>';
  if (s.p) html += '<p>' + s.p + '</p>';
  if (s.steps){
    html += '<div class="steps">';
    s.steps.forEach(st => { html += '<div class="step"><div class="n">' + st.n + '</div><h3>' + st.h + '</h3><p>' + st.p + '</p></div>'; });
    html += '</div>';
  }
  if (s.promise) html += '<div class="promise">' + s.promise + '</div>';
  if (s.disclaimer) html += '<div class="disclaimer">' + s.disclaimer + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
