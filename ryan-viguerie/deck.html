<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Vig — How to Finally Speak English in 15 Minutes a Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#eef4fb; --rule:#d4e1f0;
    --accent:#0056a7; --deep:#003a70; --ink:#1b2733; --muted:#5a6b7b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 8vw;border-bottom:1px solid var(--rule);position:relative}
  .k{font-family:"Lato",system-ui,sans-serif;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:"Lato",system-ui,sans-serif;font-weight:900;font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:"Lato",system-ui,sans-serif;font-weight:900;font-size:clamp(1.8rem,4.4vw,3rem);line-height:1.08}
  .big{font-family:"Lato",system-ui,sans-serif;font-weight:900;font-size:clamp(2rem,5.4vw,3.8rem);line-height:1.05;color:var(--accent);margin:.5rem 0}
  .sub{font-size:clamp(1.1rem,2.1vw,1.5rem);color:var(--muted);margin-top:1.6rem;max-width:30ch}
  .body{font-size:clamp(1.1rem,2vw,1.45rem);margin-top:1.6rem;max-width:40ch}
  ul{list-style:none;margin-top:2rem;max-width:44ch}
  li{position:relative;padding-left:2.2rem;margin:1rem 0;font-size:clamp(1.05rem,1.9vw,1.35rem)}
  li::before{content:"";position:absolute;left:0;top:.55em;width:.8rem;height:.8rem;background:var(--accent);border-radius:2px}
  .part h1{color:var(--ink)}
  .part .num{font-family:"Lato",sans-serif;font-weight:900;font-size:clamp(3rem,10vw,7rem);color:var(--panel);line-height:.8;margin-bottom:-.2em}
  .slide.part{background:var(--panel)}
  .cover{background:linear-gradient(160deg,#ffffff 0%,#eef4fb 100%)}
  .credibility{background:var(--panel)}
  .cta{background:var(--deep);color:#fff}
  .cta .k{color:#9ec3ea}
  .cta h1{color:#fff}
  .cta .body{color:#dce8f5}
  .disc{font-family:"Lato",sans-serif;font-size:.86rem;color:#9ec3ea;margin-top:2.4rem;max-width:52ch;line-height:1.5}
  .foot{position:absolute;bottom:3vh;left:8vw;font-family:"Lato",sans-serif;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .cta .foot{color:#6f93b8}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:.12em;color:var(--muted)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:"cover", cls:"cover", k:"A free live class with Mr. Vig", h:"How to Finally Speak English in 15 Minutes a Day", sub:"Without studying grammar, sitting in classes, or memorizing another textbook."},

  {t:"list", k:"Who this is for", h:"This class is for you if...", list:["You can read and understand English well","But when it is time to SPEAK, you freeze","You have taken classes for years and still do not feel fluent","You are tired of grammar drills that never reach your mouth"]},

  {t:"statement", k:"The real diagnosis", h:"You do not have a grammar problem.", big:"You have a speaking problem.", sub:"More study has never once made you a confident speaker. Speaking is a different skill."},

  {t:"statement", k:"The uncomfortable truth", h:"Every year you study harder", big:"is another year you practice NOT speaking.", sub:"The classroom trained you to analyze English. It never trained you to use it."},

  {t:"part", cls:"part", num:"01", h:"Why studying keeps you stuck"},

  {t:"list", k:"Part one", h:"Studying and doing are opposite skills", list:["Studying is input you analyze: rules, lists, exercises","Doing is output under real pressure: speaking, now","You have done thousands of hours of the first","And almost none of the second"]},

  {t:"statement", k:"The shift", h:"The fix is not more. It is different.", big:"Stop studying English. Start doing it.", sub:"15 minutes of DOING beats 2 hours of studying. Every time."},

  {t:"part", cls:"part", num:"02", h:"The Atomic Homework method"},

  {t:"text", k:"The method", h:"Atomic Homework", body:"A small, 15-minute daily routine. Not a course. Not a class. A habit small enough that you actually do it every single day, which is the only reason it works."},

  {t:"list", k:"The core routine", h:"The 3-step homework plan", list:["Step 1: Take in real English you enjoy (watch, read, listen)","Step 2: Steal the words and phrases you will actually use","Step 3: Say them out loud, today, before you forget them"]},

  {t:"list", k:"Do these, avoid the rest", h:"The 4 rules of atomic learning", list:["Rule 1: Small and daily beats big and rare","Rule 2: Real English beats textbook English","Rule 3: Use it the same day you learn it","Rule 4: Speaking is the practice, not the exam"]},

  {t:"text", k:"Atomic words", h:"A handful of small words, used daily", body:"Fluency is not a bigger dictionary. It is a small set of everyday words you can actually reach for in the middle of a sentence. That is what we drill, and why it sticks."},

  {t:"text", k:"Why it survives real life", h:"Why 15 minutes is the secret", body:"A routine you keep for a year beats a plan you quit in a week. Small is not a compromise. Small is the thing that makes the habit survive your real, busy life."},

  {t:"part", cls:"part", num:"03", h:"What changes when you do English daily"},

  {t:"list", k:"After 30 days of doing", h:"What starts to change", list:["You speak first instead of waiting to be asked","You reach for words without translating in your head","You stop rehearsing sentences you never actually say","Speaking starts to feel normal, not scary"]},

  {t:"text", k:"You do not do it alone", h:"The fastest version happens in a room", body:"The quickest progress comes from a place where people speak English every day, with native speakers, with no fear of mistakes. That daily conversation habit is the whole idea behind the community."},

  {t:"credibility", cls:"credibility", k:"Who is teaching this", h:"I am Mr. Vig.", body:"My real name is Ryan Viguerie. I am an American English teacher. I have lived in Europe and taught adults to actually speak since 2004. I am not a school. I am a real person who does English with you."},

  {t:"list", k:"Recap", h:"What we covered", list:["Studying is why you are stuck","Doing is the way out","Atomic Homework: the 3-step plan plus the 4 rules","15 minutes a day, every day"]},

  {t:"cta", cls:"cta", k:"Your next 15 minutes", h:"Start the daily habit with me", body:"Do English every day in the conversation club, or apply for 1-on-1 coaching if you want to move faster. Either way, start today while it is fresh.", disc:"This class is educational. No specific score, level, or result is guaranteed; your results vary with the consistency and effort you put in."}
];

const deck = document.getElementById("deck");
S.forEach(s => {
  const sec = document.createElement("section");
  sec.className = "slide " + (s.cls || "");
  let h = "";
  if (s.t === "part") {
    h += `<div class="num">${s.num}</div><h1>${s.h}</h1>`;
  } else {
    if (s.k) h += `<div class="k">${s.k}</div>`;
    if (s.h) h += `<h1>${s.h}</h1>`;
    if (s.big) h += `<div class="big">${s.big}</div>`;
    if (s.body) h += `<p class="body">${s.body}</p>`;
    if (s.list) h += "<ul>" + s.list.map(i => `<li>${i}</li>`).join("") + "</ul>";
    if (s.sub) h += `<p class="sub">${s.sub}</p>`;
    if (s.disc) h += `<p class="disc">${s.disc}</p>`;
  }
  h += `<div class="foot">Mr. Vig &middot; mrvig.com</div>`;
  sec.innerHTML = h;
  deck.appendChild(sec);
});
</script>
</body>
</html>
