<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift to Gold · Grid + Glam Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;600;700&family=Spartan:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f4;
    --panel:#f0e7e3;
    --ink:#231f20;
    --accent:#c08b84;
    --muted:#6f6360;
    --serif:'Abhaya Libre',Georgia,serif;
    --sans:'Spartan','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(960px,96vw);aspect-ratio:16/10;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .slide{position:absolute;inset:0;padding:7% 8%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:.72rem;color:var(--accent);margin-bottom:1.1rem}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.6rem,3.8vw,2.5rem);line-height:1.1;margin-bottom:1.1rem}
  p{font-family:var(--sans);font-weight:300;font-size:clamp(1rem,1.7vw,1.2rem);line-height:1.6;color:var(--muted);max-width:42ch}
  p.lead{color:var(--ink);font-weight:400}
  .rule{width:54px;height:3px;background:var(--accent);margin:1.3rem 0}
  .brandline{font-family:var(--sans);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--ink);margin-top:2rem}
  ul{list-style:none;margin-top:.6rem}
  li{font-family:var(--sans);font-weight:300;font-size:clamp(.98rem,1.6vw,1.15rem);line-height:1.5;color:var(--ink);padding:.5rem 0 .5rem 1.6rem;position:relative;max-width:46ch}
  li:before{content:"";position:absolute;left:0;top:1.05rem;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .step{display:flex;align-items:baseline;gap:1rem}
  .num{font-family:var(--serif);font-weight:700;font-size:clamp(2.4rem,6vw,4rem);color:var(--accent);line-height:1}
  .panel{background:var(--panel);padding:6% 8%;position:absolute;inset:0;display:none;flex-direction:column;justify-content:center}
  .panel.on{display:flex}
  .big{font-family:var(--serif);font-weight:700;font-size:clamp(2rem,5vw,3.3rem);line-height:1.08;max-width:20ch}
  .disc{font-family:var(--sans);font-weight:300;font-size:.72rem;color:var(--muted);margin-top:1.8rem;max-width:56ch;line-height:1.5}
  .cta-line{font-family:var(--sans);font-weight:500;font-size:clamp(1rem,1.8vw,1.25rem);color:var(--ink);margin-top:.4rem}
  #nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;color:#d8cfca;font-family:var(--sans);font-size:.8rem}
  #nav button{background:transparent;border:1px solid #6f6360;color:#e9e1dc;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem}
  #count{min-width:48px;text-align:center}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">&#8249;</button><span id="count"></span><button id="next">&#8250;</button></div>
<script>
const S=[
 {t:"title",eyebrow:"A Grid + Glam masterclass",h:"Gift to Gold",sub:"How to build a premium organizing brand that commands high-ticket fees, and scales past trading hours for dollars.",brand:"Corinne Morahan · Grid + Glam"},
 {t:"body",eyebrow:"Who this is for",h2:"You are brilliant at the work. The business is the part that feels messy.",p:"This is for the professional organizer who is booked out, respected, and still capped by the hours in a week. You do not need to be better at organizing. You need a model that grows without you."},
 {t:"panel",big:"Your organizing superpower is also your kryptonite."},
 {t:"body",eyebrow:"The trap",h2:"One look at a room and you know exactly what to do.",p:"But building a business is the opposite of a tidy closet. There is no single right answer, no finished state, and no client telling you where it goes. So the skill that makes you great at the work can keep you stuck in it."},
 {t:"panel",big:"More clients will not fix it. A bigger model will."},
 {t:"body",eyebrow:"Part one · the real problem",h2:"Why most organizers stall at the ceiling",list:["You are building a business instead of a brand","You have not mastered your marketing","You are doing it all yourself","You are running everything by hand, with no systems","You do not yet see yourself as the CEO"]},
 {t:"body",eyebrow:"Part two · the method",h2:"The G+G 6-Step Approach",p:"The same path I used to grow Grid + Glam from one organizer with a van into a team-run, multi-six-figure brand. Six steps, six months, in order.",brand:"Steps 1 to 6"},
 {t:"step",num:"01",eyebrow:"Earn more right away",h2:"Raise your rates and build offers that sell",p:"We reorganize your packages so you can charge what the work is worth, then add a digital course or group program so income stops being capped by your calendar."},
 {t:"step",num:"02",eyebrow:"Attract high-ticket clients",h2:"Build a brand worth its weight in gold",p:"A premium brand is more than a logo. It is visuals, client experience, and your authentic personality, built so the right clients self-select and refer before you ever pitch."},
 {t:"step",num:"03",eyebrow:"Take back your time",h2:"Set up systems that run on autopilot",p:"Anything you do more than once gets a process and a tool: onboarding, content, newsletters, launches, and team management, so the business stops living only in your head."},
 {t:"step",num:"04",eyebrow:"Build your audience",h2:"Master your market to attract buyers",p:"Put the pieces together. Build an audience on social, draw them onto your email list, and nurture them until enrolling with you is the obvious next step."},
 {t:"step",num:"05",eyebrow:"Turn subscribers into clients",h2:"Grow a glossy email list",p:"Most organizers do not know what to say in email. We turn a dull newsletter into a magazine-style glossy your future clients cannot wait to open, so you book discovery calls every time you hit send."},
 {t:"step",num:"06",eyebrow:"Reflect, scale, uplevel",h2:"Lead like a CEO",p:"The next-level work: money management, hiring, and leading a team with confidence, so you can grow the business without compromising the life you built it for."},
 {t:"body",eyebrow:"Part three · your next six months",h2:"Six months, from booked-out to a business that runs without you.",list:["Higher rates and a pipeline of high-ticket clients","A premium brand people seek out by name","A digital offer earning while you are off the clock","A team and systems carrying the day-to-day"]},
 {t:"body",eyebrow:"Why me",h2:"I built this the hard way first.",p:"Fifteen years on Wall Street and a Master's from Harvard, then I started Grid + Glam near my fortieth birthday with no following. Today it is a team-run, multi-six-figure brand with a luxury clientele and a minimum project fee of $2,500. I teach the exact steps I took.",brand:"Corinne Morahan"},
 {t:"panel",big:"Your gift is real. Let us turn it into gold."},
 {t:"cta",eyebrow:"Your next step",h:"Build your organizing empire.",cta:"Apply to Organizers Academy, or book a call to see if it is the right fit.",brand:"gridandglam.com · Grid + Glam",disc:"This masterclass is for educational purposes only. Results vary and depend on your own effort, market, and circumstances. Nothing here is a guarantee of income or any specific result."}
];
const stage=document.getElementById("stage");
let i=0;
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function render(){
 stage.innerHTML="";
 const s=S[i];
 let el;
 if(s.t==="panel"){
   el=document.createElement("div");el.className="panel on";
   el.innerHTML=`<div class="big">${esc(s.big)}</div>`;
 } else {
   el=document.createElement("div");el.className="slide on";
   let h="";
   if(s.eyebrow) h+=`<div class="eyebrow">${esc(s.eyebrow)}</div>`;
   if(s.t==="title"){
     h+=`<h1>${esc(s.h)}</h1><div class="rule"></div><p class="lead">${esc(s.sub)}</p>`;
     if(s.brand) h+=`<div class="brandline">${esc(s.brand)}</div>`;
   } else if(s.t==="step"){
     h+=`<div class="step"><div class="num">${esc(s.num)}</div><div><h2>${esc(s.h2)}</h2><p>${esc(s.p)}</p></div></div>`;
   } else if(s.t==="cta"){
     h+=`<h1>${esc(s.h)}</h1><div class="rule"></div><div class="cta-line">${esc(s.cta)}</div>`;
     if(s.brand) h+=`<div class="brandline">${esc(s.brand)}</div>`;
     if(s.disc) h+=`<div class="disc">${esc(s.disc)}</div>`;
   } else {
     if(s.h2) h+=`<h2>${esc(s.h2)}</h2>`;
     if(s.p) h+=`<p>${esc(s.p)}</p>`;
     if(s.list){h+="<ul>"+s.list.map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>";}
     if(s.brand) h+=`<div class="brandline">${esc(s.brand)}</div>`;
   }
   el.innerHTML=h;
 }
 stage.appendChild(el);
 document.getElementById("count").textContent=(i+1)+" / "+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.getElementById("next").onclick=()=>go(1);
document.getElementById("prev").onclick=()=>go(-1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);});
render();
</script>
</body>
</html>
