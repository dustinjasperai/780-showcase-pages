<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Neuro-Faith Pathway · Renée Booe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f8f4; --panel:#eef1ea; --rule:#e2e6dd;
    --acc:#075a3b; --ink:#12261c; --body:#3a4a40; --dim:#7c887f; --cream:#f4f6f1;
  }
  html,body{height:100%}
  body{background:#e9ede5;font-family:'Raleway',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9ede5}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Raleway',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Raleway',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:75%;line-height:1.62;font-weight:400}
  .sub{font-family:'Playfair Display',serif;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:500;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#163124 0%,#0c1b14 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#163124 0%,#0c1b14 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Raleway',sans-serif;color:#dfe7df;font-size:1.4vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #8fd4b2;color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .pw-motif{position:absolute;pointer-events:none}
  .title-pw{right:7%;bottom:8%;width:19vw;opacity:.92}
  .corner-pw{right:6.5%;bottom:7.5%;width:9vw;opacity:.5}
  .brandline{font-family:'Raleway',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(18,38,28,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Personal Growth for Christians</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a rerouted pathway of nodes, the old faint branch giving way to a new branch that lands on a filled node, drawn in evergreen -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="pw" viewBox="0 0 140 120">
  <g fill="none" stroke="#075a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 92 C 40 92, 46 66, 70 64" opacity="0.85"/>
    <path d="M70 64 C 96 62, 104 34, 126 30" opacity="0.9"/>
    <path d="M70 64 C 92 70, 96 96, 116 100" opacity="0.28" stroke-dasharray="3 6"/>
    <circle cx="14" cy="92" r="5" fill="#075a3b" stroke="none" opacity="0.85"/>
    <circle cx="70" cy="64" r="6" fill="none" opacity="0.9"/>
    <circle cx="126" cy="30" r="7" fill="#075a3b" stroke="none" opacity="0.92"/>
    <circle cx="116" cy="100" r="4" fill="none" opacity="0.3"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Neuro-Faith Pathway',sub:'Why high-capacity Christian women keep starting over, and the brain-and-Scripture way to finally follow through.',brand:true,pw:'title'},
 {t:'normal',k:'Who this is for',title:'You already know what to do. Doing it consistently is the part that keeps slipping.',body:'You love God, you are capable, and you have the plans, the books, and the good intentions. You start strong. Then a few weeks in, the old pattern quietly reasserts itself and you are back where you began, wondering why someone who cares this much cannot seem to stay the course.'},
 {t:'dark',title:'A shelf full of plans is not the same as a life you are actually living.'},

 {t:'section',idx:'Part One',title:'Why Knowing More Never Fixed It'},
 {t:'normal',k:'It was never a knowledge problem',title:'You do not need more information. You need to close the gap between knowing and doing.',body:'Another book, another podcast, another planner. Each one felt like the missing piece, and each one changed things for about a week. That is the tell. When more knowledge keeps not working, the problem was never a shortage of knowledge. It is the gap between what you know and what you actually do.'},
 {t:'normal',k:'The start-stop cycle',title:'Willpower gets you started. It was never built to keep you going.',body:'Your brain runs on well-worn pathways, the patterns it has repeated for years. Willpower can override them for a while, but it is a small and tiring muscle. The moment motivation fades or life gets loud, the old pathway takes back over. That is not a character flaw. That is how an un-rewired brain works.'},
 {t:'dark',title:'The problem was never your faith or your effort. It was the pattern running underneath both.'},

 {t:'section',idx:'Part Two',title:'The Neuro-Faith Pathway'},
 {t:'normal',k:'The idea',title:'Neuroscience meets Scripture meets strategy.',body:'Neuroscience says the brain can be rewired, that repeated thought and action carve new pathways. Scripture said it first: be transformed by the renewing of your mind. These are not two competing stories. They are one pathway, and when you walk it on purpose, consistency stops depending on how you feel that day.'},
 {t:'normal',k:'Step one, Rewire',title:'Rewire: name the hidden pattern that keeps stalling you.',body:'Before you can change a pattern you have to see it. Rewire is where you catch the specific thought loop that fires right before you quit, the old wiring that has been running the show under your awareness. You cannot renew a pattern you have never named.'},
 {t:'normal',k:'Step two, Renew',title:'Renew: anchor the new pattern in truth, not just positive thinking.',body:'Renewing the mind is not repeating nice phrases you do not believe. It is replacing the old loop with what God actually says is true about you, reinforced through the brain-based repetition that makes a new pathway stick. Truth is what the new wiring is built on, so it holds under pressure.'},
 {t:'normal',k:'Step three, Activate',title:'Activate: one consistent, doable action, held until it becomes who you are.',body:'Transformation does not arrive in one heroic push. It is one small action, repeated, until your brain treats the new way as the default and your identity catches up to it. Activate is where the pathway stops being an idea you understand and becomes the life you are living.'},
 {t:'dark',title:'Transformation is not trying harder. It is a mind renewed until the new way is the natural way.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Stop Starting Over'},
 {t:'normal',k:'The woman this builds',title:'Steady where you used to stall, and moving where you used to circle.',body:'You still have hard days, but they no longer send you back to the beginning. The goal you kept restarting finally gets built, because the pattern underneath is holding instead of your willpower. Discernment gets quieter and clearer, and the calling you have been circling for years starts to actually take shape.'},
 {t:'dark',title:'You were never lacking discipline. You were waiting for a pattern that could hold.'},
 {t:'normal',k:'Why Renée',title:'A Certified Biblical Brain-Based Coach who found she had a consistency problem, not a knowledge problem.',body:'Renée Booe is a Certified Biblical Brain-Based Coach and Behavior Change Specialist. She spent years assuming she needed more discipline, then went looking into neuroscience and behavior change and found it kept validating what Scripture already taught about the renewing of the mind. She built the Neuro-Faith Pathway out of that, and she teaches it through the Personal Growth for Christians podcast and her coaching.'},

 {t:'section',idx:'Your Next Step',title:'Walk the Pathway'},
 {t:'cta',title:'Ready to stop starting over?',body:'Keep going with Renée and start walking the pathway.',chips:['Join The Discernment Room','Apply for Activated'],disc:'Educational content for personal and spiritual growth. No specific result or outcome is guaranteed. Growth varies by person, season, and circumstance.'},
];

const deck=document.getElementById('deck');
function pw(kind){return `<svg class="pw-motif ${kind==='title'?'title-pw':'corner-pw'}" viewBox="0 0 140 120"><use href="#pw"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Personal Growth for <b>Christians</b> · Renée Booe</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.pw) h+=pw(s.pw);
  else if(s.t==='title') h+=pw('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
