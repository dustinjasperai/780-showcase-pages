<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Real Estate Business That Runs Without You — Investor Fuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d;        /* Investor Fuel near-black ground (brand.json) */
    --panel:#12181c;     /* raised dark panel */
    --rule:#26332a;      /* green-black rule */
    --accent:#6dbe45;    /* Investor Fuel fuel-green (brand.json, 14 uses) */
    --ink:#f6f7f8;        /* near-white text (brand.json, 115 uses) */
    --mut:#9aa3a0;       /* muted grey-green */
    --head:'Barlow Condensed',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto}
  .slide{min-height:88vh;display:flex;flex-direction:column;justify-content:center;
    padding:72px 64px;border-bottom:1px solid var(--rule);position:relative}
  .ey{font-family:var(--head);text-transform:uppercase;letter-spacing:.22em;
    font-weight:600;font-size:15px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(44px,7vw,86px);
    line-height:1.02;letter-spacing:-.01em;text-transform:uppercase}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(32px,4.6vw,56px);
    line-height:1.06;letter-spacing:-.005em;text-transform:uppercase}
  p{font-size:clamp(18px,2.1vw,23px);color:#d9dedb;max-width:40ch;margin-top:20px}
  p.lead{font-size:clamp(20px,2.4vw,27px);color:var(--ink);max-width:42ch}
  ul{margin:26px 0 0 0;list-style:none;max-width:46ch}
  li{font-size:clamp(17px,2vw,22px);color:#d9dedb;padding:14px 0 14px 30px;
    border-top:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;
    background:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px}
  .card{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    padding:26px 28px}
  .card h3{font-family:var(--head);font-weight:600;font-size:26px;text-transform:uppercase;
    letter-spacing:.02em;margin-bottom:8px}
  .card p{margin-top:6px;font-size:17px;max-width:none;color:var(--mut)}
  .num{font-family:var(--head);color:var(--accent);font-weight:700;font-size:20px;
    letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
  .seq{display:flex;gap:16px;flex-wrap:wrap;margin-top:30px}
  .step{background:var(--panel);border:1px solid var(--rule);padding:20px 24px;flex:1;min-width:190px}
  .step .s{font-family:var(--head);color:var(--accent);font-size:15px;letter-spacing:.12em;
    text-transform:uppercase}
  .step h4{font-family:var(--head);font-weight:600;font-size:23px;text-transform:uppercase;margin-top:6px}
  .fork{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:32px;border:1px solid var(--rule)}
  .fork>div{padding:30px 30px}
  .fork .a{background:#121316;border-right:1px solid var(--rule)}
  .fork .b{background:#101a12}
  .fork .t{font-family:var(--head);text-transform:uppercase;letter-spacing:.1em;font-size:15px;margin-bottom:12px}
  .fork .a .t{color:var(--mut)}
  .fork .b .t{color:var(--accent)}
  .fork h4{font-family:var(--head);font-weight:600;font-size:27px;text-transform:uppercase;line-height:1.05}
  .fork p{font-size:16px;margin-top:12px;max-width:none;color:var(--mut)}
  .cta{background:linear-gradient(160deg,#101a12,#0a0b0d)}
  .cta .btn{display:inline-block;margin-top:30px;font-family:var(--head);font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;font-size:24px;color:#07120a;
    background:var(--accent);padding:18px 40px;text-decoration:none}
  .disc{margin-top:40px;font-size:13px;color:#6f7873;max-width:62ch;line-height:1.6}
  .brand{position:absolute;top:30px;left:64px;font-family:var(--head);font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--mut)}
  .brand b{color:var(--accent)}
  .foot{position:absolute;bottom:26px;left:64px;font-size:12px;color:#565e59;
    font-family:var(--head);letter-spacing:.14em;text-transform:uppercase}
  @media(max-width:720px){.slide{padding:56px 26px}.grid,.fork{grid-template-columns:1fr}
    .brand,.foot{left:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',ey:'A free live masterclass for professional investors',
  h:'Build a Real Estate Business That Runs Without You',
  lead:'You hit the ceiling running everything yourself. The next level is not more hustle. It is ownership.'},

 {t:'list',ey:'Who this is for',h:"You already win. You just can't step away.",
  items:['You are doing real volume, 30, 50, 80 deals a year.',
         'Every deal still runs through you. Nothing closes without you in it.',
         'You started this for freedom and ended up with the busiest job you have ever had.']},

 {t:'statement',ey:'The hard truth',h:"You didn't buy a business. You bought a job with inventory.",
  lead:'And a job does not run without the person doing it. That is the whole problem, and it has a name.'},

 {t:'part',num:'Part One',h:'The Execution Gap',lead:'Why doing more deals stopped working.'},

 {t:'statement',ey:'The ceiling',h:'Most investors plateau at 30 to 50 deals a year.',
  lead:'Not because the market ran out. Because you hustled your way here, and hustle does not scale. The thing that got you to the ceiling is the thing holding you under it.'},

 {t:'statement',ey:'The quiet switch',h:'You wanted financial freedom. What you actually need is time freedom.',
  lead:'More money inside a job you cannot leave is just a bigger cage. Time freedom only comes from people, systems, and the willingness to let go of the wheel.'},

 {t:'part',num:'Part Two',h:'Self-Employed, or Business Owner',lead:'The fork every serious investor reaches.'},

 {t:'fork',ey:'The fork',h:'Two investors. Same deal count. Different life.',
  a_t:'Self-employed',a_h:'The operator',
  a_p:'10 to 50 deals a year. You are the acquisitions manager, the dispo lead, the project manager, and the boss. Growth means more of your hours. There are no more hours.',
  b_t:'Business owner',b_h:'The owner',
  b_p:'50+ deals a year with a team that runs them. You work on the machine, not inside it. Growth means a better machine, not a longer day.'},

 {t:'statement',ey:'The operations imperative',h:'Before you pour in more leads, fix the holes in the boat.',
  lead:'More volume into a leaky operation just loses money faster. Scaling is not a marketing problem first. It is an operations problem first.'},

 {t:'sequence',ey:'The order matters',h:"Don't hire a CEO. Build it in sequence.",
  steps:[['First','An assistant'],['Then','An operations lead'],['Only then','Leadership above you']],
  p:'Buy back your time at the bottom first. Each hire frees you to install the next. Skip the order and you hire expensive people to run chaos.'},

 {t:'list',ey:'How owners decide',h:'Measure return, not price.',
  items:['Judge your marketing on profit per deal and return on the dollar, not on the price of a lead.',
         'Commit to a channel for at least six months before you judge it. Sellers take time to move.',
         'Inbound sellers cost more to reach and convert far better. Owners pay for the better deal, not the cheaper click.']},

 {t:'statement',ey:'Abundance over scarcity',h:'Become a magnet in your market.',
  lead:'Transactional investors chase one deal at a time. Owners build a reputation and a network, and the deals, the partners, and the talent start coming to them. Sharing what works multiplies it. It all comes down to execution anyway.'},

 {t:'statement',ey:'The fastest way across',h:'You cross the gap fastest in a room of people who already did.',
  lead:'Surround yourself with operators who have scaled, seen a full market cycle, and know where the next opportunity sits. The ceiling you are stuck under is a Tuesday to someone two steps ahead.'},

 {t:'part',num:'Part Three',h:'The Owner Week',lead:'What the other side of the gap looks like.'},

 {t:'list',ey:'The other side',h:"What the owner's week looks like.",
  items:['Deals close while you are not in the room.',
         'Your calendar is decisions and strategy, not status calls and showings.',
         'A down market is a chance to buy, not a reason to panic, because the machine keeps running.']},

 {t:'statement',ey:'Why listen to this',h:'I built the job first. Then I built my way out.',
  lead:'I started in the 2008 downturn and flipped around 65 houses in my first year in Dallas. Then I made the same mistake you might be making now, scaling the hustle instead of building the business. Fixing that is what led to FlipNerd and to Investor Fuel, a network of investors who together move more than a thousand houses a year.'},

 {t:'cards',ey:'The room',h:'Investor Fuel is where owners get built.',
  cards:[['The self-employed room','Investors doing 10 to 50 deals a year, building the systems and the first hires that turn a hustle into a business.'],
         ['The business-owner room','Investors doing 50+ a year with a team, working on the machine and the next level with peers who are already there.']]},

 {t:'cta',ey:'Your next step',h:'Come build the business, not the job.',
  lead:'Investor Fuel is application-only, and that is on purpose. If you are a serious operator ready to cross from deal-doer to owner, start with a short application and a call.',
  btn:'Apply to Investor Fuel',href:'https://investorfuel.com/#apply',
  disc:'This masterclass is educational. It is not financial, investment, legal, or tax advice. No specific income or result is guaranteed. Results vary with your market, capital, effort, and experience, and real estate investing carries real risk.'}
];
function esc(x){return (x==null?'':String(x))}
function slide(s){
 const brand='<div class="brand"><b>Investor</b> Fuel</div>';
 const foot='<div class="foot">Investor Fuel Masterclass</div>';
 const ey=s.ey?`<div class="ey">${esc(s.ey)}</div>`:'';
 let body='';
 if(s.t==='title'){body=`${ey}<h1>${esc(s.h)}</h1><p class="lead">${esc(s.lead)}</p>`;}
 else if(s.t==='part'){body=`<div class="num">${esc(s.num)}</div><h1>${esc(s.h)}</h1><p class="lead">${esc(s.lead)}</p>`;}
 else if(s.t==='statement'){body=`${ey}<h2>${esc(s.h)}</h2><p class="lead">${esc(s.lead)}</p>`;}
 else if(s.t==='list'){body=`${ey}<h2>${esc(s.h)}</h2><ul>${s.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;}
 else if(s.t==='fork'){body=`${ey}<h2>${esc(s.h)}</h2><div class="fork">
   <div class="a"><div class="t">${esc(s.a_t)}</div><h4>${esc(s.a_h)}</h4><p>${esc(s.a_p)}</p></div>
   <div class="b"><div class="t">${esc(s.b_t)}</div><h4>${esc(s.b_h)}</h4><p>${esc(s.b_p)}</p></div></div>`;}
 else if(s.t==='sequence'){body=`${ey}<h2>${esc(s.h)}</h2><div class="seq">${s.steps.map(st=>`<div class="step"><div class="s">${esc(st[0])}</div><h4>${esc(st[1])}</h4></div>`).join('')}</div><p>${esc(s.p)}</p>`;}
 else if(s.t==='cards'){body=`${ey}<h2>${esc(s.h)}</h2><div class="grid">${s.cards.map(c=>`<div class="card"><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p></div>`).join('')}</div>`;}
 else if(s.t==='cta'){body=`${ey}<h1>${esc(s.h)}</h1><p class="lead">${esc(s.lead)}</p><a class="btn" href="${esc(s.href)}">${esc(s.btn)}</a><div class="disc">${esc(s.disc)}</div>`;}
 const cls=(s.t==='cta')?'slide cta':'slide';
 return `<section class="${cls}">${brand}${body}${foot}</section>`;
}
document.getElementById('deck').innerHTML=S.map(slide).join('');
</script>
</body>
</html>
