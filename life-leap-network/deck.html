<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Many Passions, One Brand — a Life Leap masterclass by Glo Atanmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf4f6;        /* soft blush ground, from her #fcf5f7 / #fbebee section pinks */
    --panel:#ffffff;
    --rule:#e9d7dc;      /* muted blush border */
    --ink:#1c1c1c;       /* her body text */
    --muted:#6b5b60;
    --accent:#073127;    /* deep forest green, her most-used brand color (14 uses) */
    --pop:#7b4df4;       /* violet pop, used sparingly */
    --display:'Fraunces',Georgia,serif;
    --body:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);
    display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
  #stage{width:min(960px,94vw);aspect-ratio:16/10;background:var(--panel);
    border:1px solid var(--rule);border-radius:18px;box-shadow:0 24px 60px rgba(7,49,39,.10);
    position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;padding:60px 70px;display:none;flex-direction:column}
  .slide.on{display:flex}
  .kicker{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:20px}
  .kicker.pop{color:var(--pop)}
  h1{font-family:var(--display);font-weight:600;font-size:56px;line-height:1.02;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:39px;line-height:1.06;letter-spacing:-.01em;margin-bottom:16px;max-width:22ch}
  .sub{font-size:22px;color:var(--muted);margin-top:22px;max-width:34ch;line-height:1.4}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:46ch}
  p.big{font-family:var(--display);font-size:33px;line-height:1.2;max-width:26ch;color:var(--ink)}
  .lead{font-size:23px;color:var(--muted);max-width:44ch;line-height:1.44;margin-top:20px}
  ul{list-style:none;margin-top:6px}
  li{font-size:20px;line-height:1.45;padding-left:30px;position:relative;margin:13px 0;max-width:46ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:11px;height:11px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;margin-top:6px}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:20px}
  .card h3{font-weight:700;font-size:17px;color:var(--accent);margin-bottom:7px}
  .card p{font-size:16px;color:var(--ink)}
  .spacer{flex:1}
  .foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:500;border-top:1px solid var(--rule);padding-top:15px}
  .foot b{color:var(--accent);font-weight:700}
  .big-num{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--pop)}
  .stat-row{display:flex;gap:38px;margin-top:24px;flex-wrap:wrap}
  .stat b{display:block;font-family:var(--display);font-size:36px;color:var(--accent);font-weight:700}
  .stat span{font-size:15px;color:var(--muted)}
  .center{justify-content:center}
  .pill{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;border-radius:999px}
  .contrast{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
  .contrast .col{padding:22px;border-radius:12px}
  .contrast .a{background:#f6ecef;border:1px solid var(--rule)}
  .contrast .b{background:#eaf1ee;border:1px solid #cfe0d8}
  .contrast h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:11px}
  .contrast .a h3{color:var(--muted)} .contrast .b h3{color:var(--accent)}
  .contrast p{font-size:17px;line-height:1.4}
  .cta-box{background:var(--accent);color:#fff;border-radius:14px;padding:28px 32px;max-width:40ch}
  .cta-box h2{color:#fff;margin-bottom:10px}
  .cta-box p{color:#dfeae5;font-size:19px}
  .cta-line{font-family:var(--display);font-weight:600;font-size:22px;color:#fff;margin-top:16px}
  .disc{font-size:13px;color:var(--muted);margin-top:18px;max-width:64ch;line-height:1.45}
  nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center}
  nav button{background:var(--panel);border:1px solid var(--rule);color:var(--accent);font-weight:700;font-size:14px;border-radius:999px;padding:9px 18px;cursor:pointer}
  #count{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div id="stage"></div>
<nav><button onclick="go(-1)">Prev</button><span id="count"></span><button onclick="go(1)">Next</button></nav>
<script>
const S=[
 {t:'title', pill:'A live Life Leap masterclass', h:'Many Passions,<br>One Brand.',
  sub:'How multi-passionate and ADHD creatives build one profitable brand, without being told to pick just one thing.',
  by:'with Glo Atanmo', site:'thelifeleap.com'},

 {t:'bullets', kicker:'Who this is for', h:'You have five ideas and a dozen open tabs.',
  bullets:['You are the friend with a new venture every season, and real talent behind each one.',
           'You have started offers, courses, and channels, and finished few of them.',
           'Every coach tells you to niche down, and every time you do, the spark dies.']},

 {t:'statement', kicker:'The trap', h:'Being multi-passionate feels like a flaw.',
  big:'So you keep restarting. A new logo, a new niche, a new promise, and an audience that still cannot say what you actually do.',
  lead:'The scattering is not a character problem. It is a structure problem.'},

 {t:'hook', kicker:'The reframe', kpop:true,
  big:'Niching down was never your problem. A scattered brand was.',
  lead:'The advice to just pick one thing is the exact reason you keep quitting the thing.'},

 {t:'part', n:'Part One', h:'Why multi-passionate people stall'},

 {t:'statement', kicker:'The core problem', h:'Focus is not the same as choosing one thing.',
  big:'Creative and ADHD minds run on novelty and connection.',
  lead:'Told to amputate every passion but one, they lose the energy that made them good, then blame themselves when the motivation goes. The shame cycle, not the ambition, is what stalls the business.'},

 {t:'contrast', kicker:'What it costs', h:'Scattered energy has a price.',
  aH:'What people see', aP:'A different offer every quarter. No clear name for what you do. No reason to buy today.',
  bH:'What it costs you', bP:'No cohesive brand, no repeatable income, and a growing belief that you are the problem.'},

 {t:'part', n:'Part Two', h:'The L.E.A.P path: many passions, one brand'},

 {t:'cards', kicker:'The L.E.A.P Curriculum', h:'One path from idea to aligned income.',
  cards:[['1. Foundations and Focus','Set the base and the mindset so the work survives a low-motivation week.'],
         ['2. Personal Branding','Turn your mix of passions into one recognizable identity people can name.'],
         ['3. Product Creation','Shape one offer that draws on several of your skills at once.'],
         ['4. Monetization and Marketing','Sell it in a voice that is yours, on the channels you already enjoy.']]},

 {t:'statement', kicker:'The Multi-Passionate Approach', kpop:true, h:'Integrate, do not amputate.',
  big:'Your passions are not competing businesses. They are ingredients in one brand.',
  lead:'The writer who codes and coaches is not three people. She is one voice with an unfair range. We build the brand around the range.'},

 {t:'bullets', kicker:'From brand to income', h:'One aligned offer, sold on purpose.',
  bullets:['Package the outcome your mix of skills creates, not each skill on its own.',
           'Price it so a handful of the right people can fund the whole thing.',
           'Market it in your natural register, so selling stops feeling like pretending.']},

 {t:'statement', kicker:'ADHD-friendly by design', h:'Structure a creative brain can actually keep.',
  big:'Deadlines you did not set alone, and other people in the room for the lonely middle of a project.',
  lead:'Small, finishable steps instead of one heroic push. The system does the remembering, so your energy goes to the work.'},

 {t:'part', n:'Part Three', h:'The year your brand stops resetting'},

 {t:'contrast', kicker:'What changes', h:'Same passions. Very different year.',
  aH:'Before', aP:'Five half-built projects, a bio nobody understands, income that resets every launch.',
  bH:'After', bP:'One brand that holds all of you, a clear promise, and income that repeats because people know what to come back for.'},

 {t:'why', kicker:'Why listen to me', h:'I built one brand from a lot of passions.',
  body:'I booked a one-way ticket to Europe with $500, wrote my way across more than 100 countries, and turned a scatter of creative skills into one multi-six-figure brand.',
  stats:[['100+','countries, one voice'],['22 yrs','creating online'],['Forbes','Oprah Mag, BBC']]},

 {t:'cards', kicker:'Inside Life Leap', h:'The room where the leap happens.',
  cards:[['The curriculum','The full L.E.A.P path in video, on demand, at your pace.'],
         ['Live coaching','Group calls to unstick the exact thing you are stuck on this week.'],
         ['The community','Other multi-passionate builders, so the middle of the project is not lonely.'],
         ['The tools','Templates and challenges that turn someday into a shipped thing.']]},

 {t:'hook', kicker:'If you take one thing', kpop:true,
  big:'You do not have to choose between your passions. You have to integrate them.'},

 {t:'bullets', kicker:'The leap, in one line', h:'Many passions in, one aligned brand out.',
  bullets:['Stop restarting. Build one identity that holds all of you.',
           'Use structure a creative brain can keep, not willpower you run out of.',
           'Sell one offer that pays for the life you actually want.']},

 {t:'cta', kicker:'Your next step', h:'Ready to build one brand from all of it?',
  body:'Life Leap is where multi-passionate creatives stop scattering and start shipping, together.',
  cta:'Apply to join at thelifeleap.com',
  disc:'This masterclass is for education only. It is not financial advice and no income claim is made. No specific result is guaranteed. Results vary and depend on your own work, market, and circumstances.'}
];
const stage=document.getElementById('stage');
const FOOT='<div class="spacer"></div><div class="foot"><span>Glo Atanmo <b>Life Leap</b></span><span>Aligned living. Passionate business. Lasting impact.</span></div>';
function kick(s){return s.kicker?`<div class="kicker${s.kpop?' pop':''}">${s.kicker}</div>`:'';}
function html(s){
  switch(s.t){
    case 'title': return `<div class="slide center"><div class="pill">${s.pill}</div>
      <h1 style="margin-top:24px">${s.h}</h1><p class="sub">${s.sub}</p>
      <div class="spacer"></div><div class="foot"><span>${s.by}</span><span>${s.site}</span></div></div>`;
    case 'bullets': return `<div class="slide">${kick(s)}<h2>${s.h}</h2>
      <ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>${FOOT}</div>`;
    case 'statement': return `<div class="slide">${kick(s)}<h2>${s.h}</h2>
      <p class="big">${s.big}</p><p class="lead">${s.lead}</p>${FOOT}</div>`;
    case 'hook': return `<div class="slide center">${kick(s)}<p class="big" style="font-size:35px;line-height:1.16;max-width:25ch">${s.big}</p>
      ${s.lead?`<p class="lead">${s.lead}</p>`:''}${FOOT}</div>`;
    case 'part': return `<div class="slide center"><div class="big-num">${s.n}</div>
      <h1 style="margin-top:12px;font-size:46px;max-width:20ch">${s.h}</h1>${FOOT}</div>`;
    case 'contrast': return `<div class="slide">${kick(s)}<h2>${s.h}</h2>
      <div class="contrast"><div class="col a"><h3>${s.aH}</h3><p>${s.aP}</p></div>
      <div class="col b"><h3>${s.bH}</h3><p>${s.bP}</p></div></div>${FOOT}</div>`;
    case 'cards': return `<div class="slide">${kick(s)}<h2>${s.h}</h2>
      <div class="grid">${s.cards.map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>${FOOT}</div>`;
    case 'why': return `<div class="slide">${kick(s)}<h2>${s.h}</h2><p>${s.body}</p>
      <div class="stat-row">${s.stats.map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>${FOOT}</div>`;
    case 'cta': return `<div class="slide">${kick(s)}
      <div class="cta-box"><h2>${s.h}</h2><p>${s.body}</p><div class="cta-line">${s.cta}</div></div>
      <p class="disc">${s.disc}</p>${FOOT}</div>`;
  }
}
let i=0;
function render(){stage.innerHTML=html(S[i]);const sl=stage.querySelector('.slide');if(sl)sl.classList.add('on');
  document.getElementById('count').textContent=(i+1)+' / '+S.length;}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
