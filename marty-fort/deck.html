<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Trust System That Keeps Families Enrolled &middot; Music Academy Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf8f7; --panel:#f0e9e8; --rule:#e0d5d3;
    --accent:#d8242b;
    --chalk:#2b2827; --grey:#5c5654; --dim:#8c8280;
  }
  html,body{height:100%}
  body{background:#e9e2e0;font-family:'Roboto',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9e2e0}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .38s ease;
    display:flex;flex-direction:column;justify-content:flex-end;padding:8% 9% 13% 9%}
  .slide.active{opacity:1;visibility:visible}
  .t-normal::after{content:'';position:absolute;left:0;right:0;bottom:0;height:.9vh;background:var(--accent);opacity:.9}
  .kicker{font-family:'Roboto Condensed',sans-serif;font-size:.92vw;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'Roboto Condensed',Georgia,sans-serif;font-weight:700;color:var(--chalk);line-height:1.1;letter-spacing:-.005em}
  .t-title{justify-content:center}
  .t-title h1{font-size:4.6vw;max-width:82%;color:var(--chalk)}
  .t-title .sub{font-family:'Roboto',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:3.4vh;max-width:66%;line-height:1.6;font-weight:300}
  .t-normal h1{font-size:2.85vw;max-width:82%;font-weight:600}
  .t-normal .body{font-family:'Roboto',sans-serif;font-size:1.34vw;color:var(--grey);margin-top:2.8vh;max-width:72%;line-height:1.62;font-weight:300}
  .t-section{background:var(--panel);justify-content:center;border-left:1.6vw solid var(--accent)}
  .t-section .idx{font-family:'Roboto Condensed',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  .t-section h1{font-size:3.9vw;max-width:78%;font-weight:700}
  .t-hit{background:var(--bg);justify-content:center;align-items:flex-start}
  .t-hit h1{font-size:2.95vw;max-width:78%;color:var(--accent);line-height:1.16;font-weight:600}
  .t-hit .body{font-family:'Roboto',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3vh;max-width:64%;font-weight:300}
  .t-cta{background:var(--panel);justify-content:center;align-items:center;text-align:center;border-top:1.1vh solid var(--accent)}
  .t-cta h1{font-size:3.5vw;max-width:80%;color:var(--chalk);font-weight:700}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Roboto',sans-serif;border:1.5px solid var(--accent);color:var(--accent);padding:1.2vh 1.8vw;font-size:1.05vw;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .brandline{font-family:'Roboto Condensed',sans-serif;font-size:1vw;color:var(--grey);margin-top:3.6vh;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:700}
  .disc{position:absolute;left:9%;right:9%;bottom:4.6vh;font-family:'Roboto',sans-serif;font-size:.8vw;color:var(--dim);line-height:1.45;font-weight:300}
  .t-cta .disc{text-align:center;bottom:3.4vh}
  .shield{position:absolute;pointer-events:none}
  .shield.big{right:5%;top:9%;width:14vw;opacity:.9}
  .shield.small{right:6%;top:11%;width:6.2vw;opacity:.5}
  .hud{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(43,40,39,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:12px;right:18px;font-family:'Roboto',sans-serif;font-size:11px;letter-spacing:.2em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Roboto',sans-serif;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:11px;left:50%;transform:translateX(-50%);font-family:'Roboto',sans-serif;font-size:10px;color:var(--dim);z-index:20;letter-spacing:.14em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.5vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:2.9vw}
    .t-title .sub{font-size:3.1vw}.t-section h1{font-size:7vw}.t-hit h1{font-size:5.6vw}.t-cta h1{font-size:6.6vw}.chip{font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Music Academy Success</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- a shield with a checkmark, one stroke, echoing the Safe Music Schools Pledge -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="shield" viewBox="0 0 160 190">
  <g fill="none" stroke="#d8242b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 6 L150 34 V92 C150 138 118 168 80 184 C42 168 10 138 10 92 V34 Z" stroke-width="4"/>
    <path d="M48 96 L70 118 L114 66" stroke-width="6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Trust System That Keeps Families Enrolled',sub:'Why enrollment marketing alone leaks students out the back door, the published safety commitment that closes it, and how it holds up running at 1,600 students and 80 teachers.',brand:true,line:'big'},

 {t:'normal',k:'Who this is for',title:'Owners who already market well and still lose families they worked hard to win.',body:'Your enrollment numbers look fine on paper. The problem shows up later, at renewal time, when a family you never saw coming quietly does not come back.'},
 {t:'normal',k:'What you will walk away with',title:'A published safety commitment and the operational plan behind it.',body:'What actually earns a parent\'s trust before anything goes wrong, how to publish that commitment so it is visible, and what has to be true operationally for the promise to hold.'},
 {t:'normal',k:'An honest note',title:'This is education, not a promise.',body:'Every market and every school is different. What matters is the version of this system that fits your community and your size.',disc:'Educational content. Nothing here is a promise of income, retention, or business results. No outcome is guaranteed and results vary by school and market.'},
 {t:'normal',k:'Who is teaching this',title:'Marty Fort. Founder of Music Academy Success.',body:'He has coached music school owners for 18 years, on six continents. He also still owns and runs 3 schools himself today, 1,600 students, 80 teachers, so what he teaches is what he currently runs on, not something he used to do.'},

 {t:'section',idx:'Part One',title:'Why Marketing Alone Leaks Students'},
 {t:'normal',k:'It is rarely a marketing problem',title:'The families who leave were not lost to a better ad. They were lost to doubt.',body:'A parent who is not sure their child is safe, seen, or valued does not always say so. They just do not re-enroll next term.'},
 {t:'hit',title:'A pledge you publish is worth more than a discount you offer.',body:'One of those earns trust before anything goes wrong. The other one only shows up after a parent was already thinking about leaving.',line:'small'},
 {t:'normal',k:'The quiet cost',title:'A family that leaves quietly does not tell you why.',body:'No complaint, no exit interview, just an empty spot next term and a new lead cost to fill it. Marketing spend keeps climbing while the actual leak stays invisible.'},
 {t:'normal',k:'What most owners try',title:'Adding a loyalty discount or a referral bonus.',body:'It moves the number for a season. It does not touch the actual reason a parent stopped trusting the school, because trust was never the thing being discounted.'},

 {t:'section',idx:'Part Two',title:'The Trust System'},
 {t:'normal',k:'The pledge',title:'A public, named safety commitment parents can see before they enroll.',body:'Not a policy buried in a handbook. A visible pledge, adopted the same way hundreds of other schools have adopted it, that tells a parent exactly what the school stands for.'},
 {t:'normal',k:'The plan behind it',title:'The operational guidelines that make the pledge real, not just marketing copy.',body:'How teachers and parents communicate, what transparency actually looks like day to day, and what has to be true for the published commitment to survive contact with a real school year.'},
 {t:'hit',title:'A promise a parent can see is worth more than a promise they have to take on faith.',line:'small'},
 {t:'normal',k:'What changes',title:'Retention stops being a mystery and starts being a system you can point to.',body:'Parents who trust the school talk about it. Referrals start arriving from families who were never marketed to at all, because someone told them.'},

 {t:'section',idx:'Part Three',title:'1,600 Students Later'},
 {t:'normal',k:'The proof',title:'3 schools. 1,600 students. 80 teachers. Run on this system, right now.',body:'Not a case study from someone else. The same pledge and plan taught in this class are the ones running at Columbia Arts Academy, Lexington School of Music, and Irmo Music Academy today.'},
 {t:'normal',k:'Where to take it next',title:'The pledge, the plan, and the full growth system already exist inside Music Academy Success.',body:'Membership includes the complete system, monthly coaching, and a community of owners running the same playbook across 44 states and six continents.'},
 {t:'hit',title:'The goal is not one great enrollment season. It is a school families do not want to leave.',line:'small'},

 {t:'normal',k:'One more thing',title:'Marketing still matters. It just is not the whole system.',body:'Music Academy Success also covers enrollment growth, year-round scheduling, and teacher retention. This class starts with the piece almost nobody else in this space teaches.'},
 {t:'cta',title:'Publish the promise. Keep the family.',chips:['Music Academy Success','Book a membership call'],brand:true,disc:'Educational content only. No income, retention, or business result is guaranteed. Results vary by school, team, and market.'},
];

const deck=document.getElementById('deck');
function shieldMark(kind){return `<svg class="shield ${kind==='big'?'big':'small'}" viewBox="0 0 160 190"><use href="#shield"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1>`;
  } else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Music Academy <b>Success</b> &middot; Marty Fort</div>`;
  }
  if(s.line) h+=shieldMark(s.line);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
