<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Break Into Instructional Design the Messy Way | IDOL Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#222d47;
    --panel:#1a2338;
    --rule:#33406a;
    --accent:#42ba78;
    --ink:#eef1f7;
    --muted:#9aa6c4;
  }
  html,body{height:100%;}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    background:var(--panel);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .deck{max-width:960px;margin:0 auto;}
  .slide{
    min-height:100vh;
    display:flex;flex-direction:column;justify-content:center;
    padding:9vh 7vw;
    border-bottom:1px solid var(--rule);
    background:var(--bg);
  }
  .slide:nth-child(even){background:var(--panel);}
  .eyebrow{
    font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin-bottom:22px;
  }
  h1{font-family:'DM Serif Display',Georgia,serif;font-size:60px;line-height:1.05;font-weight:400;letter-spacing:-.01em;}
  h2{font-family:'DM Serif Display',Georgia,serif;font-size:42px;line-height:1.1;font-weight:400;margin-bottom:24px;}
  .lede{font-size:23px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:46ch;}
  p.body{font-size:21px;line-height:1.6;color:var(--ink);max-width:52ch;margin-top:14px;}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px;max-width:60ch;}
  li{position:relative;padding-left:34px;font-size:21px;line-height:1.45;color:var(--ink);}
  li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:3px;background:var(--accent);}
  .milestones{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 28px;margin-top:28px;}
  .ms{display:flex;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule);}
  .ms .n{font-family:'DM Serif Display',serif;font-size:30px;color:var(--accent);min-width:46px;}
  .ms .t{font-size:19px;line-height:1.3;}
  .stat-row{display:flex;flex-wrap:wrap;gap:40px;margin-top:34px;}
  .stat .big{font-family:'DM Serif Display',serif;font-size:52px;color:var(--accent);line-height:1;}
  .stat .lab{font-size:16px;color:var(--muted);margin-top:8px;max-width:20ch;}
  .cta-box{margin-top:30px;padding:26px 30px;border:1px solid var(--accent);border-radius:12px;background:rgba(66,186,120,0.07);max-width:54ch;}
  .cta-box .step{font-size:21px;line-height:1.5;}
  .cta-box .step strong{color:var(--accent);}
  .disclaimer{margin-top:30px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5;}
  .nav{position:fixed;bottom:18px;right:22px;font-size:13px;color:var(--muted);background:rgba(26,35,56,.85);padding:7px 12px;border-radius:20px;border:1px solid var(--rule);}
  .brandmark{position:fixed;top:18px;left:22px;font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
  @media(max-width:640px){h1{font-size:38px;}h2{font-size:30px;}.milestones{grid-template-columns:1fr;}.slide{padding:7vh 8vw;}}
</style>
</head>
<body>
<div class="brandmark">IDOL Academy</div>
<div class="deck" id="deck"></div>
<div class="nav" id="nav"></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A free class with Dr. Robin Sargent',
    h:'Break Into Instructional Design the Messy Way',
    sub:'How career changers go from zero experience to a hired, certified instructional designer in 24 weeks, without a $20k master’s degree.' },

  {t:'point',
    eyebrow:'Who this is for',
    h:'You can teach. You just can’t prove it yet.',
    body:'Teachers leaving the classroom. Career changers who are done waiting. People with real-world skills that keep getting lost in a stack of applications. You already know how to help people learn. What you don’t have is a way to show an employer you can do it on the job.' },

  {t:'point',
    eyebrow:'The trap',
    h:'Waiting until you are “qualified enough.”',
    body:'So you sign up for another certificate. You read another theory book. You tell yourself you’ll apply once the portfolio is perfect. Months pass and the portfolio still isn’t perfect, because it never will be. The waiting is the thing keeping you out of the field.' },

  {t:'reframe',
    eyebrow:'The reframe',
    h:'Nobody hires a perfect portfolio. They hire proof you can do the work.',
    sub:'Hiring managers in learning and development do not ask for your GPA. They ask to see something you built. The fastest way in is not more study. It is finished, real, imperfect work you can point to.' },

  {t:'section', eyebrow:'Part one', h:'Why the degree path is the slow path' },

  {t:'point',
    eyebrow:'The core problem',
    h:'A master’s teaches you about instructional design. It doesn’t make you employable.',
    body:'A university program runs $20k to $60k and two years, and you still graduate without a single piece of client-ready work in a tool a company actually uses. The gap between “I studied this” and “I can be handed a project on Monday” is exactly the gap that keeps good people out of the field.' },

  {t:'section', eyebrow:'Part two', h:'The Do It Messy Approach' },

  {t:'point',
    eyebrow:'The idea',
    h:'Ship it messy, then make it better.',
    body:'Do It Messy is a working method for building real instruction fast. You stop designing in your head and start building in the open. The first version is allowed to be rough, because a rough finished project teaches you more, and shows an employer more, than a perfect plan that never ships.' },

  {t:'framework',
    eyebrow:'How the method works',
    h:'Three moves, every single build',
    bullets:[
      'Backwards design: start from the one outcome the learner needs, then build only what gets them there.',
      'Scenario-first: teach through real situations the learner will actually face, not a wall of content.',
      'Gradual release: model it, practice it together, then let them do it on their own.'
    ] },

  {t:'point',
    eyebrow:'The foundation',
    h:'Built on the First Principles of Instruction.',
    body:'Problem-centered. Grounded in a real-world context. Shown with a full demonstration before the learner tries it. These are the principles that hold across every serious learning model, and they are baked into the formula so you don’t have to reinvent the design for every new course.' },

  {t:'point',
    eyebrow:'The payoff of the method',
    h:'A finished course blueprint in under 30 days.',
    body:'Follow the formula and you don’t stare at a blank screen. You move from outcome, to scenarios, to a built blueprint you can put in a portfolio. One real artifact beats a year of notes.' },

  {t:'section', eyebrow:'Part three', h:'The path from where you are to hired' },

  {t:'milestones',
    eyebrow:'The 8-milestone path',
    h:'A sequential, skills-based build, not theory lectures',
    items:[
      'Instructional design foundations',
      'Learning architecture',
      'Experience design',
      'Visual design',
      'Prototyping',
      'Instructor-led training',
      'eLearning development',
      'A capstone internship'
    ] },

  {t:'point',
    eyebrow:'Proof you can point to',
    h:'16 badges, a portfolio, and a designation.',
    body:'Each milestone earns a Credly-verified badge you can share the day you earn it, with hands-on training in the tools companies ask for by name. You finish with a real portfolio and the CPTP designation, so you apply with proof instead of promises.' },

  {t:'why',
    eyebrow:'Why learn it this way',
    h:'This is the path the founder wished existed',
    stats:[
      { big:'2012', lab:'designing instruction, including as a Director of L&D' },
      { big:'3,300+', lab:'people guided into the field through IDOL Academy' },
      { big:'GNPEC', lab:'state-authorized, award-winning training' }
    ],
    body:'Dr. Robin Sargent made this exact transition herself, has designed learning for teams like Amazon, IBM, and the International Baccalaureate Organization, holds a PhD in instructional design, and wrote The Do It Messy Approach. She built the program she wished she’d had.' },

  {t:'point',
    eyebrow:'What it looks like',
    h:'You build in public, finish with proof, and apply like a professional.',
    body:'No waiting for perfect. You ship a real project in week one, stack the badges as you go, and walk into interviews with work to show. That is the whole difference between studying instructional design and getting hired to do it.' },

  {t:'cta',
    eyebrow:'Your next step',
    h:'Start messy. Start this week.',
    steps:[
      'Take the free Career Fit Quiz to see how your background maps to the field.',
      'Try Milestone 1 free, or join the next free live class, Break Into Instructional Design.',
      'When you’re ready, enroll in IDOL Academy and build your portfolio.'
    ],
    disclaimer:'This class is for education only. It is not a promise or guarantee of employment, income, or any specific career outcome. Results depend on your own effort, background, and the job market.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.eyebrow) inner += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.t === 'title') { inner += `<h1>${s.h}</h1>`; if (s.sub) inner += `<p class="lede">${s.sub}</p>`; }
  else if (s.t === 'section') { inner += `<h1>${s.h}</h1>`; }
  else if (s.t === 'reframe') { inner += `<h2>${s.h}</h2>`; if (s.sub) inner += `<p class="lede">${s.sub}</p>`; }
  else { if (s.h) inner += `<h2>${s.h}</h2>`; }
  if (s.body) inner += `<p class="body">${s.body}</p>`;
  if (s.bullets) inner += '<ul>' + s.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
  if (s.items) inner += '<div class="milestones">' + s.items.map((t, n) => `<div class="ms"><span class="n">${n+1}</span><span class="t">${t}</span></div>`).join('') + '</div>';
  if (s.stats) inner += '<div class="stat-row">' + s.stats.map(st => `<div class="stat"><div class="big">${st.big}</div><div class="lab">${st.lab}</div></div>`).join('') + '</div>';
  if (s.steps) inner += '<div class="cta-box">' + s.steps.map((st, n) => `<p class="step"><strong>${n+1}.</strong> ${st}</p>`).join('') + '</div>';
  if (s.disclaimer) inner += `<p class="disclaimer">${s.disclaimer}</p>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});

const slides = document.querySelectorAll('.slide');
const nav = document.getElementById('nav');
function updateNav(){
  let idx = 0;
  slides.forEach((sl, i) => { if (sl.getBoundingClientRect().top <= window.innerHeight/2) idx = i; });
  nav.textContent = (idx+1) + ' / ' + slides.length;
}
updateNav();
window.addEventListener('scroll', updateNav, {passive:true});
document.addEventListener('keydown', e => {
  let idx = 0;
  slides.forEach((sl, i) => { if (sl.getBoundingClientRect().top <= window.innerHeight/2) idx = i; });
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); if (slides[idx+1]) slides[idx+1].scrollIntoView({behavior:'smooth'}); }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); if (slides[idx-1]) slides[idx-1].scrollIntoView({behavior:'smooth'}); }
});
</script>
</body>
</html>
