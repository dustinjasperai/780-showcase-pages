<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Art of Slink, Indi Pole Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffaf3;        /* their cream ground */
    --panel:#fffdf9;
    --ink:#050404;       /* their near-black */
    --muted:#33373d;     /* their charcoal */
    --rule:#e7ddd0;
    --accent:#ed1338;    /* their crimson */
    --accent2:#ffc2ed;   /* their soft pink */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--muted);color:var(--ink);font-family:'Jost',sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{
    position:relative;background:var(--bg);border-radius:14px;overflow:hidden;
    aspect-ratio:16/9;margin:0 0 26px;padding:60px 66px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 18px 50px rgba(5,4,4,.16)
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:40px;line-height:1.08;margin-bottom:20px}
  .lede{font-size:22px;line-height:1.5;color:var(--muted);font-weight:300;max-width:38ch;margin-top:24px}
  p.body{font-size:19px;line-height:1.6;color:var(--muted);font-weight:300;max-width:46ch;margin-top:14px}
  .kicker{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:var(--ink);margin-top:10px}
  ul{list-style:none;margin-top:18px}
  ul li{font-size:20px;line-height:1.45;color:var(--muted);font-weight:400;padding:14px 0 14px 34px;position:relative;border-top:1px solid var(--rule)}
  ul li:first-child{border-top:none}
  ul li::before{content:"";position:absolute;left:0;top:22px;width:16px;height:2px;background:var(--accent)}
  ul li b{color:var(--ink);font-weight:600}
  .num{font-family:'Cormorant Garamond',serif;font-size:72px;color:var(--accent2);line-height:1;margin-bottom:6px}
  .foot{position:absolute;bottom:26px;left:66px;right:66px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.7}
  .title-slide h1{font-size:72px;max-width:16ch}
  .title-slide .lede{font-size:24px}
  .cta-slide{background:var(--ink)}
  .cta-slide::before{background:var(--accent)}
  .cta-slide .eyebrow{color:var(--accent2)}
  .cta-slide h2,.cta-slide .kicker{color:var(--bg)}
  .cta-slide p.body{color:#cdc7c0}
  .cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-weight:600;font-size:18px;padding:16px 30px;border-radius:40px;letter-spacing:.02em}
  .disclaimer{margin-top:22px;font-size:12px;line-height:1.5;color:#9a938b;max-width:60ch;font-weight:300}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
  .quotemark{font-family:'Cormorant Garamond',serif;font-size:90px;color:var(--accent2);line-height:.6}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND="Indi Pole";
const S=[
 {t:'title',eyebrow:'A free live masterclass with Indi',h1:'The Art of Slink',lede:'How to move like water in heels, when right now you feel stiff, blocky and stuck on tricks.'},

 {t:'who',eyebrow:'Who this is for',h2:'If you love heels but feel robotic in them',body:'You can hit the moves. You have taken the classes. But when you film yourself, it looks effortful and choppy instead of fluid and sensual. This hour is for the dancer who wants to stop performing tricks and start moving like water.'},

 {t:'list',eyebrow:'In the next hour',h2:'What you will leave with',items:['Why your heels dance reads as stiff, even when the moves are correct.','The three pillars of the Slink Method, in the order they have to go.','One legwork drill you can film tonight and feel the difference.']},

 {t:'trap',eyebrow:'The trap',h2:'You have been told to learn more tricks',body:'So you chase the next invert, the next spin, the next combo. More tricks pile up and the flow never comes, because flow was never a trick. It is a separate skill, and almost nobody teaches it on purpose.'},

 {t:'reframe',eyebrow:'Before we begin',kicker:'"Stiff is not a talent ceiling. It is a set of habits, and habits can be swapped."',body:'Nothing in this hour asks you to be more flexible or more experienced than you are today. It asks you to move differently, starting from the floor up.'},

 {t:'reframe',eyebrow:'The reframe',kicker:'"Slink is not something you add on top of the moves. It is what happens between them."',body:'The fluidity you are chasing lives in the transitions and the legwork, not in the headline trick. Once you see that, heels dance stops being a checklist and starts being a language.'},

 {t:'part',num:'01',eyebrow:'Part one',h2:'Why stiff happens',body:'Stiffness is not a talent problem. It is three habits stacked on top of each other.'},
 {t:'list',eyebrow:'Part one',h2:'The three stiffness habits',items:['<b>Trick-first training</b> teaches the shape but never the approach or the exit, so every move arrives and leaves abruptly.','<b>Dead legs</b>: the legwork is treated as a way to get somewhere instead of as the dance itself.','<b>Holding the breath</b> and the core, which locks the hips and kills the slink before it starts.']},

 {t:'part',num:'02',eyebrow:'Part two',h2:'The Slink Method',body:'The method I have built and taught since 2014. Three pillars, in order, because the order is the whole secret.'},
 {t:'list',eyebrow:'Pillar one',h2:'Legwork as the foundation',items:['Slink starts at the floor and the legs, not the arms. We train the legwork first so the fluidity has a root.','<b>Low flow</b>: slow, grounded, weight-led movement that reads as control, not effort.','This is the pillar most heels training skips entirely, and it is why their students plateau.']},
 {t:'list',eyebrow:'Pillar two',h2:'Transitions that hide the effort',items:['Every trick gets an approach and an exit so nothing arrives or leaves abruptly.','We drill the in-between on purpose until the hard parts disappear into the flow.','This is where "choppy" turns into "liquid" on camera.']},
 {t:'list',eyebrow:'Pillar three',h2:'Sensual intention',items:['Slink is a feeling before it is a move. We train where the eyes, the breath and the weight go.','Intention is what makes the same choreography read as ethereal instead of mechanical.','You keep your own style; the method just removes what is blocking it.']},

 {t:'reframe',eyebrow:'Why the order matters',kicker:'"Legwork first, transitions second, intention last. Reverse it and you get a pretty pose that still looks stiff."',body:'Most training reaches for intention and tricks before the legwork is there to carry them. The order is the part almost nobody teaches, and it is the part that makes slink repeatable.'},

 {t:'part',num:'03',eyebrow:'Part three',h2:'The same combo, run through the method',body:'We take one combination you probably already know and run it through the three pillars live, so you can see the shift rather than take my word for it.'},
 {t:'list',eyebrow:'The legwork drill',h2:'Try this one tonight',items:['Start grounded, weight in the heels, knees soft and unlocked.','Move the slowest part first and let the legs lead the arms, not the other way around.','Film it once before and once after; the difference is the slink.']},
 {t:'list',eyebrow:'The shift',h2:'What changes in one session',items:['The same moves you already know, suddenly connected.','Legwork that reads as fluid, not forced.','A combo that looks like water instead of a checklist.']},

 {t:'why',eyebrow:'Why learn this from Indi',h2:'A decade in the slink lane',body:'I founded Indi Pole in 2014 and have spent the last decade crafting and teaching this ethereal, sensual, slinky heels style, with a special devotion to legwork and fluidity. Heels Goddess is the signature curriculum, and The Pole Institute certifies instructors in the Low Flow Heels method.'},

 {t:'cta',eyebrow:'Your next step',h2:'Keep going with the Slink Method',body:'If this hour changed how you see heels dance, the full method lives inside the Indi Pole online studio and the Heels Goddess program, with live classes every week and a growing library to practise with.',cta:'Join the Indi Pole studio',disclaimer:'This masterclass is educational. Pole dance carries physical risk, so train within your ability and warm up fully. No specific result is guaranteed. Results vary with your practice, body and effort.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='title'?' title-slide':'')+(s.t==='cta'?' cta-slide':'');
  let inner='';
  if(s.eyebrow) inner+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num) inner+=`<div class="num">${s.num}</div>`;
  if(s.h1) inner+=`<h1>${s.h1}</h1>`;
  if(s.h2) inner+=`<h2>${s.h2}</h2>`;
  if(s.kicker) inner+=`<div class="kicker">${s.kicker}</div>`;
  if(s.lede) inner+=`<div class="lede">${s.lede}</div>`;
  if(s.items){inner+='<ul>';s.items.forEach(it=>inner+=`<li>${it}</li>`);inner+='</ul>';}
  if(s.body) inner+=`<p class="body">${s.body}</p>`;
  if(s.cta) inner+=`<a class="cta-btn">${s.cta}</a>`;
  if(s.disclaimer) inner+=`<div class="disclaimer">${s.disclaimer}</div>`;
  if(s.t!=='title'&&s.t!=='cta') inner+=`<div class="foot"><span>${BRAND}</span><span>The Art of Slink</span></div>`;
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
