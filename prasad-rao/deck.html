<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Story Bank — a Big Tech Careers masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#222423;       /* darkened from brand dominant #363737 */
    --panel:#2e302f;
    --rule:#41433f;
    --ink:#ededeb;       /* brand light-on-dark text #eeeeee/#f0f0f0 */
    --muted:#9a9c98;
    --accent:#3f8f57;    /* derived from brand green #003f0d, lightened for contrast */
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --serif:'Lora', Georgia, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{width:100%}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .slide::before{content:"";position:absolute;left:9vw;top:9vh;width:34px;height:3px;background:var(--accent)}
  .num{position:absolute;right:9vw;top:9vh;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em}
  .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--mono);font-weight:600;font-size:clamp(32px,5.2vw,60px);line-height:1.06;letter-spacing:-.02em}
  h2{font-family:var(--mono);font-weight:500;font-size:clamp(24px,3.4vw,40px);line-height:1.12;letter-spacing:-.015em}
  .sub{font-family:var(--serif);font-weight:400;font-size:clamp(19px,2.3vw,27px);color:var(--ink);max-width:24ch;margin-top:26px;line-height:1.35}
  .big{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,46px);line-height:1.16;max-width:19ch}
  .body{font-size:clamp(17px,1.5vw,21px);color:var(--ink);max-width:42ch;margin-top:22px;line-height:1.55}
  .foot{position:absolute;left:9vw;bottom:8vh;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.02em}
  .partn{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  ul{list-style:none;margin-top:30px;max-width:48ch}
  ul li{position:relative;padding-left:26px;margin:16px 0;font-size:clamp(17px,1.6vw,22px)}
  ul li::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:9px;background:var(--accent)}
  .themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 40px;margin-top:34px;max-width:54ch}
  .themes div{border-left:2px solid var(--accent);padding:8px 0 8px 16px;font-size:clamp(16px,1.5vw,20px)}
  .badge{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);
    background:var(--accent);padding:6px 12px;margin-bottom:22px;font-weight:600}
  .trap{margin-top:30px;border-left:3px solid var(--accent);padding:14px 0 14px 20px;color:var(--muted);
    max-width:46ch;font-size:clamp(16px,1.5vw,20px)}
  .step{margin-top:28px;font-family:var(--mono);font-size:clamp(17px,1.7vw,22px);color:var(--accent);line-height:1.4}
  .disc{position:absolute;left:9vw;right:9vw;bottom:6vh;font-size:12.5px;color:var(--muted);max-width:72ch;line-height:1.45}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A Big Tech Careers masterclass',h:'The Story Bank',sub:'How to walk into any Big Tech behavioral interview with 8 to 12 stories that get you hired at the right level',foot:'Prasad Rao · Principal Solutions Architect, 18+ years in big tech'},
 {t:'audience',h:'Who this is for',items:['Tech ICs and leaders targeting their first Big Tech role','Strong performers who freeze or ramble on "tell me about a time when..."','Senior ICs and managers who want the $300K+ role at the right level, not a down level offer'],trap:'You already clear the coding rounds. The offer still comes in a level too low, or not at all. The behavioral round is where that gets decided, and almost nobody prepares for it the way the bar raisers actually score it.'},
 {t:'hook',big:'The behavioral interview is not a personality test. It is a leveling exercise.',body:'Every answer you give is mapped to a level and a set of competencies. Interesting stories lose to leveled ones.'},
 {t:'part',n:'Part one',h:'Why strong engineers blank'},
 {t:'point',h:'The gap is not experience',body:'You have done the work. Under pressure it comes out as a flat recap instead of a structured story with a decision, a tradeoff, and a measurable result. An interviewer cannot score a recap.'},
 {t:'point',h:'Freezing is a retrieval problem',body:'When you try to invent the right example on the spot, you stall. The fix is not more confidence. It is having the stories already built and rehearsed before you walk in, so recall is instant.'},
 {t:'point',h:'The eight themes are predictable',body:'Across MAANG+, behavioral questions draw from the same eight themes. Map your experience to all eight ahead of time and there is no question that can catch you empty.'},
 {t:'part',n:'Part two',h:'The Story Bank method'},
 {t:'framework',badge:'The method',h:'Build the bank, not the answer',body:'Instead of prepping answers to a list of questions, you build a bank of 8 to 12 stories that cover every theme an interviewer can draw from. One strong story often answers five different questions.'},
 {t:'themes',h:'The eight behavioral themes',items:['Customer focus','Success','Failure','Conflict','Problem solving','Learning and growth','Leadership','Time management']},
 {t:'point',h:'STAR, with senior level depth',body:'Situation and Task stay short. Action and Result carry the weight, and the Result is quantified. The difference between a mid and a senior answer is depth of ownership and impact, not a more impressive situation.'},
 {t:'framework',badge:'Leveling',h:'The Three Pillars of Senior-Level Responses',body:'Calibrate the story to the level you are targeting, not the one you are at. Show ownership and influence beyond your immediate scope. Turn technical wins into business impact the panel can repeat back.'},
 {t:'point',h:'Tell a technical win as business impact',body:'"I optimized the pipeline" is an IC line. "I cut the nightly batch from six hours to forty minutes, which unblocked the launch and saved the on-call rotation" is a leadership line. Same work, different level.'},
 {t:'point',h:'Handle the gap honestly',body:'When a question lands on something you have not done, you do not freeze or bluff. You name the gap and pivot to how you have learned something new quickly. That pivot is itself a senior signal.'},
 {t:'part',n:'Part three',h:'When the bank is built'},
 {t:'point',h:'A rehearsed delivery',body:'A practised answer to "tell me about yourself," then stories delivered with control over voice, pacing, and body language. You are not reading. You are recalling something you own.'},
 {t:'point',h:'A resume that matches the stories',body:'The resume clears ATS and the recruiter screen and sets up the exact stories you are about to tell, so the whole loop points in one direction.'},
 {t:'credibility',h:'Why learn this from me',body:'I am a Principal Solutions Architect with 18+ years in big tech, co-founder of BeSA, co-author of Cloud Career Journeys, and I write the weekly Big Tech Careers newsletter. I have sat on the other side of these interviews. The Story Bank is the method I use with my own clients and in my live cohort.'},
 {t:'recap',h:'The through line',items:['Build the bank, not the answer','Cover all eight themes before you walk in','STAR with senior level depth and quantified results','Calibrate every story to the level you want']},
 {t:'cta',h:'Build your Story Bank',body:'If you want to build your bank with me and pressure-test it in live mock interviews, the next step is the Big Tech Interviews cohort, or a free discovery call for one-on-one coaching.',step:'Join the next cohort or book a discovery call at bigtechcareers.com',disc:'Educational content only. Outcomes depend on your own effort, experience, and the job market. No hiring, leveling, salary, or income outcome is promised or guaranteed. Results vary.'}
];
const el=document.getElementById('deck');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
S.forEach((s,i)=>{
  const n=String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  let inner='';
  if(s.t==='title'){inner=`<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.h)}</h1><div class="sub">${esc(s.sub)}</div><div class="foot">${esc(s.foot)}</div>`}
  else if(s.t==='audience'){inner=`<h2>${esc(s.h)}</h2><ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="trap">${esc(s.trap)}</div>`}
  else if(s.t==='hook'){inner=`<div class="big">${esc(s.big)}</div><div class="body">${esc(s.body)}</div>`}
  else if(s.t==='part'){inner=`<div class="partn">${esc(s.n)}</div><h1>${esc(s.h)}</h1>`}
  else if(s.t==='point'){inner=`<h2>${esc(s.h)}</h2><div class="body">${esc(s.body)}</div>`}
  else if(s.t==='framework'){inner=`<div class="badge">${esc(s.badge)}</div><h2>${esc(s.h)}</h2><div class="body">${esc(s.body)}</div>`}
  else if(s.t==='themes'){inner=`<h2>${esc(s.h)}</h2><div class="themes">${s.items.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`}
  else if(s.t==='credibility'){inner=`<h2>${esc(s.h)}</h2><div class="body">${esc(s.body)}</div>`}
  else if(s.t==='recap'){inner=`<h2>${esc(s.h)}</h2><ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
  else if(s.t==='cta'){inner=`<h1>${esc(s.h)}</h1><div class="body">${esc(s.body)}</div><div class="step">${esc(s.step)}</div><div class="disc">${esc(s.disc)}</div>`}
  el.insertAdjacentHTML('beforeend',`<section class="slide"><div class="num">${n}</div>${inner}</section>`);
});
</script>
</body>
</html>
