<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix the Right Thing First — A UBSG Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e4;      /* warm cream, tinted from their gold accent #bc8e1a */
    --panel:#fdfbf5;   /* lightest gold-tinted paper */
    --ink:#141414;     /* their dominant ink (rank 2, 63 uses) */
    --muted:#6b6b6b;   /* their #666666 */
    --rule:#e0e0e0;    /* their #e0e0e0 (rank 1) */
    --accent:#bc8e1a;  /* their gold (rank 4, 10 uses) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deckwrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:700;line-height:1.08;letter-spacing:-.01em}
  h1{font-size:52px}
  h2{font-size:38px}
  .sub{font-size:19px;color:var(--muted);margin-top:18px;max-width:30em;line-height:1.5}
  .lead{font-size:23px;line-height:1.5;margin-top:10px;max-width:33em}
  .big{font-size:40px;font-family:"Playfair Display",Georgia,serif;line-height:1.14;max-width:22em}
  .big .a{color:var(--accent)}
  .num{font-family:"Playfair Display",Georgia,serif;font-size:15px;color:var(--accent);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  .ft{font-size:14px;color:var(--muted);margin-top:30px}
  .fromto{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
  .ft-col{flex:1;min-width:240px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
  .ft-col .lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
  .ft-col.from .lab{color:var(--muted)}
  .ft-col.to .lab{color:var(--accent)}
  .ft-col p{font-size:16.5px;line-height:1.45;color:var(--ink)}
  .pills{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:26px}
  .pill{background:var(--bg);border:1px solid var(--rule);border-radius:9px;padding:14px 16px;font-size:16px}
  .pill.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .pill.on b{color:var(--accent)}
  .steps{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
  .step{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:18px}
  .step .n{font-family:"Playfair Display",serif;font-size:26px;color:var(--accent)}
  .step .t{font-weight:600;margin-top:6px}
  .step .d{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
  .creds{margin-top:22px;font-size:17px;line-height:1.7;color:var(--ink);list-style:none}
  .creds li::before{content:"";display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;margin-right:12px;vertical-align:middle}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:40em}
  .cta-btn{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;font-weight:600;
    padding:14px 26px;border-radius:8px;font-size:17px}
  .pager{position:fixed;right:16px;bottom:14px;font-size:12px;color:var(--muted);background:var(--panel);
    border:1px solid var(--rule);border-radius:20px;padding:5px 12px}
  @media(max-width:720px){.slide{padding:34px 26px}h1{font-size:36px}h2{font-size:28px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deckwrap" id="deck"></div>
<div class="pager" id="pager"></div>
<script>
const S=[
 {t:'title', k:'A UBSG Masterclass', h:'Fix the Right Thing First', s:'Why the same fires keep coming back in a growing business, and the one pillar to fix before all the others.'},
 {t:'who', k:'Who this is for', h:'Founders and operators doing real revenue', s:'$500k to $10M and up, a real team and a real P&L, a business that is growing and somehow costing you more of your life every quarter.'},
 {t:'hook', k:'The trap', big:'Record month. Three new hires. And you still have not been home before 9 in weeks.'},
 {t:'hook', k:'The reframe', big:'You do not have a marketing problem. You have a <span class="a">constraint</span> problem.'},
 {t:'section', num:'Part One', h:'Why the same fires keep coming back'},
 {t:'lead', k:'Symptom vs root', h:'You are treating the mask, not the problem', lead:'Most owners assume they have a marketing, hiring, or sales problem. The real issue is usually a leadership and systems problem wearing a different mask. Treat the symptom and the same fire returns next quarter.'},
 {t:'lead', k:'The real cost', h:'Growth should not cost you your health', lead:'No leader should have to destroy their health, family, or sanity just to keep a business alive. There is a better way to operate, and you do not have to do it alone.'},
 {t:'section', num:'Part Two', h:'The Six Pillars'},
 {t:'pillar', k:'Pillar 1', h:'Leadership', from:'Reactive, always in the weeds, pulled into everything.', to:'A calm leader with standards and boundaries others can follow under pressure.'},
 {t:'pillar', k:'Pillar 2', h:'Teams & Hiring', from:'Good people in fuzzy seats, too much ask-the-founder.', to:'Clear roles, owner-level accountability, a team that knows what winning looks like.'},
 {t:'pillar', k:'Pillar 3', h:'Sales', from:'Revenue rollercoaster and hero closes.', to:'A simple, trackable pipeline and follow-up that does not live in your head.'},
 {t:'pillar', k:'Pillar 4', h:'Marketing & Brand', from:'Random campaigns, post and pray, undercharging.', to:'A focused message and a narrative that supports premium pricing.'},
 {t:'pillar', k:'Pillar 5', h:'AI & Technology', from:'Throwing tools at problems with no strategy.', to:'A clear adoption plan that automates low-value work and gives your team leverage.'},
 {t:'pillar', k:'Pillar 6', h:'Execution & Systems', from:'Firefighting, context switching, we will get to it later.', to:'Simple weekly rhythms, scorecards, rocks, and issues lists that keep the company moving.'},
 {t:'diagnostic', k:'The diagnostic', h:'Two or three pillars are dragging you. Most owners fix the wrong one.', on:4},
 {t:'section', num:'Part Three', h:'What changes when you fix the root'},
 {t:'lead', k:'The outcome', h:'A business that runs without running you', lead:'Fix the constraint first and the fires stop returning. The team moves when you step away. Growth stops depending on your constant involvement, and you get your sanity back.'},
 {t:'creds', k:'Why me', h:'Michael Anthony', items:['3,000+ clients coached','$30M+ in revenue built across member companies','Grant Cardone Speak-Off Winner','30,000+ books sold; 4M+ podcast downloads']},
 {t:'path', k:'How UBSG works', h:'Diagnose, commit, execute, scale', steps:[['01','Diagnose','Find the pillars creating the most drag.'],['02','Commit','Apply and be vetted into the community.'],['03','Execute','Weekly calls, deep dives, in-person intensives.'],['04','Scale','Build a business that no longer runs you.']]},
 {t:'cta', k:'Your next step', h:'Find your drag pillar first', s:'Take the Six Pillars Diagnostic, then apply to join UBSG.', btn:'Take the Six Pillars Diagnostic', disc:'This masterclass is educational. It is not financial advice and makes no guarantee of income or results. Outcomes vary by business, market, and execution.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
 const d=document.createElement('section');d.className='slide';
 let h='';
 if(s.k) h+=`<div class="kick">${s.k}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="sub">${s.s}</p>`;}
 else if(s.t==='who'){h+=`<h2>${s.h}</h2><p class="sub">${s.s}</p>`;}
 else if(s.t==='hook'){h+=`<div class="big">${s.big}</div>`;}
 else if(s.t==='section'){h=`<div class="num">${s.num}</div><h1>${s.h}</h1>`;}
 else if(s.t==='lead'){h+=`<h2>${s.h}</h2><p class="lead">${s.lead}</p>`;}
 else if(s.t==='pillar'){h+=`<h2>${s.h}</h2><div class="fromto"><div class="ft-col from"><div class="lab">From</div><p>${s.from}</p></div><div class="ft-col to"><div class="lab">To</div><p>${s.to}</p></div></div>`;}
 else if(s.t==='diagnostic'){h+=`<h2>${s.h}</h2><div class="pills">`+
    ['Leadership','Teams & Hiring','Sales','Marketing & Brand','AI & Technology','Execution & Systems']
    .map((p,idx)=>`<div class="pill${idx===s.on?' on':''}"><b>${p}</b></div>`).join('')+`</div>`;}
 else if(s.t==='creds'){h+=`<h2>${s.h}</h2><ul class="creds">`+s.items.map(x=>`<li>${x}</li>`).join('')+`</ul>`;}
 else if(s.t==='path'){h+=`<h2>${s.h}</h2><div class="steps">`+s.steps.map(x=>`<div class="step"><div class="n">${x[0]}</div><div class="t">${x[1]}</div><div class="d">${x[2]}</div></div>`).join('')+`</div>`;}
 else if(s.t==='cta'){h+=`<h1>${s.h}</h1><p class="sub">${s.s}</p><span class="cta-btn">${s.btn}</span><p class="disc">${s.disc}</p>`;}
 d.innerHTML=h;deck.appendChild(d);
});
document.getElementById('pager').textContent=S.length+' slides';
</script>
</body>
</html>
