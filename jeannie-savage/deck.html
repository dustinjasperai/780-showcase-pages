<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Bookkeeper to Strategic Bookkeeper — a masterclass with Jeannie Savage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f4ee; --panel:#fffdf8; --panel2:#efe6db;
    --ink:#2b2622; --muted:#8a7c76; --rule:#e7ddd4; --accent:#a75a68;
    --serif:'Caudex',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:26px 20px 90px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 64px 58px;margin:0 0 22px;min-height:560px;display:flex;flex-direction:column;
    justify-content:center;position:relative;box-shadow:0 14px 40px rgba(43,38,34,.06)}
  .kick{font-size:14px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--serif);font-weight:700;font-size:64px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:43px;line-height:1.12}
  .lead{font-size:24px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:42ch}
  .num{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--accent);font-weight:500;letter-spacing:.02em}
  .partno{font-family:var(--serif);font-size:150px;line-height:.9;color:var(--panel2);font-weight:700;position:absolute;top:34px;right:52px}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px}
  li{font-size:24px;line-height:1.4;padding-left:40px;position:relative;max-width:50ch}
  li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:5px;
    border:2.5px solid var(--accent)}
  .steps li::before{content:counter(s);counter-increment:s;border:none;width:34px;height:34px;top:-2px;left:0;
    background:var(--accent);color:#fff;border-radius:9px;font-weight:700;font-size:18px;display:flex;
    align-items:center;justify-content:center;font-family:var(--sans)}
  .steps{counter-reset:s}
  .steps li{padding-left:52px}
  .quote{font-family:var(--serif);font-style:italic;font-size:41px;line-height:1.28;max-width:22ch}
  .quote .a{color:var(--accent)}
  .attrib{margin-top:26px;font-size:17px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:600}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
  .card{background:var(--panel2);border-radius:14px;padding:30px 32px}
  .card h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:12px;color:var(--accent)}
  .card p{font-size:19px;line-height:1.42;color:var(--ink)}
  .facts{margin-top:28px;display:flex;flex-direction:column;gap:14px}
  .facts div{font-size:22px;line-height:1.35}
  .facts b{font-family:var(--serif);font-weight:600}
  .disc{margin-top:34px;font-size:15px;line-height:1.5;color:var(--muted);max-width:60ch}
  .foot{position:absolute;bottom:26px;left:64px;right:64px;display:flex;justify-content:space-between;
    font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px}
  .cta h1{font-size:56px}
  .cta .go{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;font-weight:700;
    font-size:22px;padding:18px 34px;border-radius:100px;letter-spacing:.01em}
  .site{margin-top:20px;font-size:20px;color:var(--muted);font-weight:600}
  @media(max-width:720px){.slide{padding:40px 30px}h1{font-size:44px}.cols{grid-template-columns:1fr}.partno{font-size:96px;right:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A free live masterclass for bookkeepers', h:'From Bookkeeper to Strategic Bookkeeper',
   lead:'How to grow a thriving practice by being paid for your insight, not your data entry, without drowning in more hours or more clients.'},

  {t:'agenda', kick:'Who this is for', h:'You are busy, capable, and still stuck doing the low paid work.',
   lead:'For bookkeepers who are good at the craft but feel overwhelmed, undercharged, and treated like a cost, not a trusted advisor.'},

  {t:'quote', q:'More clients on the old model does not buy you freedom. It buys you <span class="a">more overwhelm</span>.',
   attrib:'The reframe we start with'},

  {t:'part', no:'01', kick:'Part one', h:'The real trap is the role, not the workload.',
   lead:'Most bookkeepers are hired as record-keepers, priced as record-keepers, and then buried in compliance work that will never pay what their judgement is worth.'},

  {t:'point', kick:'What that costs you', h:'Two quiet things happen when you stay the record-keeper.',
   items:['You compete on price and hours, so the only way to earn more is to work more, until the work you loved starts to drain you.',
          'Your best thinking, the insight that could change a client business, is given away for free between the data entry.']},

  {t:'quote', q:'The money was never in the data entry. It is in being the person the owner <span class="a">asks first</span>.',
   attrib:'Where a practice actually grows'},

  {t:'part', no:'02', kick:'Part two', h:'The Strategic Bookkeeper method.',
   lead:'The whole approach rests on one move: stop selling the hours of a record-keeper and start selling the judgement of a strategic advisor.'},

  {t:'steps', kick:'The shape of the method', h:'Five moves that reposition the practice.',
   items:['See yourself as the strategic advisor first. The role you hold in your own head is the one clients end up paying for.',
          'Build the practice around the right clients and a clear offer, instead of taking whatever walks in the door.',
          'Shift how clients perceive the value, so the work reads as a wise investment, not another cost to trim.',
          'Price for the insight and the outcome, not the hours on the timesheet.',
          'Put systems and boundaries in place so the practice runs on your terms, not the other way around.']},

  {t:'point', kick:'Move one', h:'The reposition starts in your own head.',
   items:['If you introduce yourself as the person who keeps the books, that is the value the client prices.',
          'Introduce yourself as the person who tells them what the numbers mean, and the whole conversation changes.']},

  {t:'point', kick:'Moves two and three', h:'The right clients, and how they see the work.',
   items:['A clear offer to a defined client is what lets you stop competing on being the cheapest option in town.',
          'When a client sees the work as intelligence that protects and grows their business, the price stops being the argument.']},

  {t:'point', kick:'Move four', h:'Price for insight, not for hours.',
   items:['An hourly rate caps you at the clock and rewards you for being slow.',
          'Pricing on the value of the decision you unlock is what lets the practice grow without you working more nights.']},

  {t:'card2', kick:'A worked example', h:'The same bookkeeper, two ways to be hired.',
   a:{h:'Hired as a record-keeper', p:'Paid by the hour to reconcile and file. Valued at the cost of the task, replaceable by the next cheaper quote.'},
   b:{h:'Hired as a strategic advisor', p:'Paid for the read on the numbers and the decisions it drives. Valued at the outcome, and hard to replace.'}},

  {t:'part', no:'03', kick:'Part three', h:'What changes when you make the shift.',
   lead:'This is not about working with more clients. It is about the same practice, repositioned, so it finally pays you for your judgement and gives you your time back.'},

  {t:'point', kick:'The other side', h:'A practice that runs without the overwhelm.',
   items:['You raise your rate and keep the clients who value the thinking, because the price now has a reason behind it.',
          'The compliance work stops being the whole job and becomes the entry point to the advisory work.',
          'The practice sustains your life instead of consuming it, which was the point of going out on your own.']},

  {t:'quote', q:'A thriving practice is not the busiest one. It is the one that pays you well and <span class="a">still gives you your evenings back</span>.',
   attrib:'What we are really after'},

  {t:'bio', kick:'Who is teaching this', h:'Jeannie Savage',
   facts:['Launched her own bookkeeping practice in <b>2009</b> and scaled it into a lifestyle business in about <b>five years</b>.',
          'Named <b>Bookkeeper of the Year</b> at the 2022 Women in Finance Awards, and <b>Innovator of the Year</b> in 2023.',
          'Author of <b>The Strategic Bookkeeper</b> and <b>The Bookkeeping Practice BluePrint</b>, and host of the podcast.',
          'Creator of the <b>7-Step Method</b> taught inside the TSB Transformation Program.']},

  {t:'point', kick:'Where this fits', h:'This class is the first step of a bigger method.',
   items:['The masterclass gives you the reposition and the five moves in one live hour.',
          'The 7-Step Method and the TSB Transformation Program are where you build the whole thing out and keep it in place.']},

  {t:'recap', kick:'To recap', h:'Reposition, then price for it.',
   items:['See yourself as the advisor, not the record-keeper.',
          'Build the practice around the right clients and a clear offer.',
          'Change how the value is perceived, then price for the insight.',
          'Add systems and boundaries so it runs on your terms.']},

  {t:'cta', kick:'Where to take this next', h:'Come build the whole method with me.',
   lead:'If the reposition is the first step, the TSB Transformation Program is the rest of it: the 7-Step Method, the community, and the structure that keep a thriving practice in place.',
   go:'Apply for the next round of the TSB Transformation Program', site:'thestrategicbookkeeper.global',
   disc:'This class is educational. No specific income or business result is guaranteed. Results vary with your market, your clients, your effort, and your own numbers.'}
];

const deck = document.getElementById('deck');
function foot(i){return `<div class="foot"><span>From Bookkeeper to Strategic Bookkeeper</span><span>Jeannie Savage</span></div>`}
function render(s,i){
  let inner='';
  if(s.t==='title') inner=`<div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p>`;
  else if(s.t==='agenda') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><p class="lead">${s.lead}</p>`;
  else if(s.t==='part') inner=`<div class="partno">${s.no}</div><div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p>`;
  else if(s.t==='quote') inner=`<div class="quote">${s.q}</div><div class="attrib">${s.attrib}</div>`;
  else if(s.t==='point') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='steps') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul class="steps">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='recap') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul class="steps">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='card2') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="cols"><div class="card"><h3>${s.a.h}</h3><p>${s.a.p}</p></div><div class="card"><h3>${s.b.h}</h3><p>${s.b.p}</p></div></div>`;
  else if(s.t==='bio') inner=`<div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="facts">${s.facts.map(x=>`<div>${x}</div>`).join('')}</div>`;
  else if(s.t==='cta') inner=`<div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p><div class="go">${s.go}</div><div class="site">${s.site}</div><p class="disc">${s.disc}</p>`;
  return `<section class="slide ${s.t==='cta'?'cta':''}">${inner}${foot(i)}</section>`;
}
deck.innerHTML = S.map(render).join('');
</script>
</body>
</html>
