<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Feminine Leadership Masterclass — Amanda Marit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alike&family=Alata&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f9;        /* warm near-white ground (brand light scheme) */
    --panel:#ffffff;     /* panel */
    --ink:#42364a;       /* dominant brand plum (brand.json, 115 uses) */
    --accent:#f2bfe0;    /* brand pink (brand.json) */
    --cyan:#66dbea;      /* brand cyan, used sparingly */
    --soft:rgba(66,54,74,.08);
    --line:rgba(66,54,74,.16);
    --muted:rgba(66,54,74,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Alata',system-ui,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;width:100%;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;position:relative;border-bottom:1px solid var(--line);overflow:hidden}
  .slide .num{position:absolute;top:4vh;right:6vw;font-size:13px;letter-spacing:.28em;color:var(--muted)}
  .eyebrow{font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);
    margin-bottom:26px;display:flex;align-items:center;gap:14px}
  .eyebrow::before{content:"";width:34px;height:2px;background:var(--ink);display:inline-block}
  h1,h2{font-family:'Alike',Georgia,serif;font-weight:400;line-height:1.08;letter-spacing:-.01em}
  h1{font-size:clamp(40px,7.4vw,86px)}
  h2{font-size:clamp(30px,4.8vw,56px)}
  .lede{font-size:clamp(18px,2.1vw,25px);max-width:60ch;color:var(--ink);margin-top:24px}
  .muted{color:var(--muted)}
  .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0}
  .g-pink{background:var(--accent)}
  .g-cyan{background:var(--cyan);opacity:.33}
  .slide > *{position:relative;z-index:1}
  /* title */
  .title h1{font-size:clamp(46px,9vw,112px);max-width:16ch}
  .title .promise{margin-top:30px;font-size:clamp(18px,2.2vw,26px);max-width:52ch}
  .diamond{width:16px;height:16px;background:var(--ink);transform:rotate(45deg);
    display:inline-block;margin-right:8px}
  .kicker{font-family:'Alike',serif;font-style:normal;color:var(--muted);font-size:20px;margin-bottom:30px}
  /* lists */
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;margin-top:40px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 28px}
  .card .cn{font-family:'Alike',serif;font-size:34px;color:var(--accent);
    -webkit-text-stroke:1px var(--ink);margin-bottom:12px}
  .card h3{font-family:'Alike',serif;font-weight:400;font-size:23px;margin-bottom:10px}
  .card p{font-size:16px;color:var(--muted)}
  .big-list{margin-top:34px;max-width:64ch}
  .big-list li{list-style:none;padding:20px 0;border-top:1px solid var(--line);font-size:clamp(18px,2vw,23px);
    display:flex;gap:18px;align-items:baseline}
  .big-list li:last-child{border-bottom:1px solid var(--line)}
  .big-list .mk{font-family:'Alike',serif;color:var(--accent);-webkit-text-stroke:.8px var(--ink);font-size:22px;flex:none;width:34px}
  .pillar{display:grid;grid-template-columns:1.1fr 1fr;gap:6vw;align-items:center}
  @media(max-width:820px){.pillar{grid-template-columns:1fr}}
  .pillar .tag{font-family:'Alike',serif;font-size:clamp(56px,10vw,120px);line-height:.9;color:var(--ink)}
  .pillar .tag em{font-style:normal;color:var(--accent);-webkit-text-stroke:2px var(--ink)}
  .reframe h2{max-width:20ch}
  .reframe .lede{margin-top:34px}
  .me{display:grid;grid-template-columns:1fr 1.3fr;gap:5vw;align-items:center}
  @media(max-width:820px){.me{grid-template-columns:1fr}}
  .me .portrait{aspect-ratio:4/5;background:
     radial-gradient(120% 90% at 30% 20%,var(--accent),transparent 60%),
     linear-gradient(160deg,#efe2ec,#fff);border:1px solid var(--line);border-radius:22px;
     display:flex;align-items:flex-end;padding:26px}
  .me .portrait span{font-family:'Alike',serif;font-size:26px}
  .cta{text-align:center;align-items:center}
  .cta h2{max-width:18ch;margin:0 auto}
  .btn{display:inline-block;margin-top:38px;background:var(--ink);color:#fff;font-size:18px;
    letter-spacing:.04em;padding:18px 44px;border-radius:999px;text-decoration:none}
  .disclaimer{margin-top:46px;font-size:12.5px;color:var(--muted);max-width:60ch;line-height:1.6}
  .quotemark{font-family:'Alike',serif;font-size:90px;color:var(--accent);
    -webkit-text-stroke:1.5px var(--ink);line-height:.6;display:block;margin-bottom:10px}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass', h1:'The Feminine Leadership Masterclass',
    promise:'How high-achieving women are building wealth and magnetism through intuition, not more hustle.' },

  {t:'intro', eyebrow:'Who this is for',
    h2:'You have built something real, and it still feels like effort.',
    lede:'You are a leader, a founder, a woman people already trust. You have done the strategy, the funnels, the launches. And somewhere underneath the wins, you can feel that doing more of the same is not what takes you to the next level.' },

  {t:'list', eyebrow:'The trap', h2:'The quiet ceiling most successful women hit',
    items:[
      'You keep adding tactics, but the real shift never comes from another tactic.',
      'You lead from logic all day and wonder why it feels heavy and masculine.',
      'You attract good clients, not always your soulmate clients.',
      'You sell from a little bit of pressure, and it costs you energy every time.' ] },

  {t:'reframe', eyebrow:'The real reason',
    h2:'You do not need another strategy. You turned your intuition off.',
    lede:'Logic got you here. But the women who break through are the ones who turn their intuition back on and lead from it, on purpose, as a skill. That is a method, not a personality trait.' },

  {t:'part', kicker:'Part One', h2:'The cost of leading from logic alone' },

  {t:'list', eyebrow:'The daily reality', h2:'When the feminine is switched off',
    items:[
      'Decisions take forever because every answer has to be justified first.',
      'Marketing sounds like everyone else because it is written from the head.',
      'Receiving feels unsafe, so you over-give and under-charge.',
      'Growth means more hours, because effort is the only lever you trust.' ] },

  {t:'part', kicker:'Part Two', h2:'The method: Money, Men, and Magic' },

  {t:'intro', eyebrow:'The framework',
    h2:'Three pillars, worked at the same time.',
    lede:'Most coaching upgrades one area and leaves the others behind. This method moves wealth, receiving, and manifestation together, because in a woman they are the same system. Here is how each pillar works.' },

  {t:'pillar', tagHtml:'<em>Money</em>', eyebrow:'Pillar one',
    h2:'Attract soulmate clients through energetic alignment',
    lede:'My Client Attraction Framework is about becoming the energetic match for the clients you actually want, then letting your marketing carry that signal. High-end clients are drawn to alignment, not to louder offers.' },

  {t:'pillar', tagHtml:'<em>Men</em>', eyebrow:'Pillar two',
    h2:'Reopen your capacity to receive',
    lede:'Receiving is a muscle most high-achieving women have trained out of themselves. When you widen your capacity to receive, from your work, from support, from the masculine, your standards and your prices rise with you.' },

  {t:'pillar', tagHtml:'<em>Magic</em>', eyebrow:'Pillar three',
    h2:'Activate your Future Self and jump timelines',
    lede:'Future Self Activation and Timeline Jumping are how you stop making decisions from the woman you were and start leading as the woman you are becoming. You recode the identity first, and the results follow the identity.' },

  {t:'intro', eyebrow:'How you enroll people',
    h2:'Sales from the Soul.',
    lede:'Selling is not pressure. The Sales from the Soul method is how you hold an enrollment conversation intuitively, so the right woman says yes because it is true for her, not because she was pushed. It is the most feminine part of the whole method, and the most profitable.' },

  {t:'part', kicker:'Part Three', h2:'What feminine leadership actually feels like' },

  {t:'list', eyebrow:'The other side', h2:'Leading from a turned-on intuition',
    items:[
      'You make faster decisions because you trust the knowing underneath the logic.',
      'Your marketing sounds like only you, so your soulmate clients recognise it.',
      'You receive without guilt, so you charge what the work is worth.',
      'Scaling stops meaning more hours and starts meaning more alignment.' ] },

  {t:'me', eyebrow:'Why me',
    h2:'I built this the long way first.',
    lede:'I spent years in corporate leading entirely from logic before my own awakening. I became a certified coach, then built the Illuminated Coaching Certification and have trained and certified coaches in more than twelve countries. Everything in this masterclass is the method I use with my own private clients and in Hot Girl Summer.',
    portrait:'Amanda Marit' },

  {t:'list', eyebrow:'Recap', h2:'The method, in one view',
    items:[
      'Money: become the energetic match for your soulmate clients.',
      'Men: reopen your capacity to receive, then raise your standards and prices.',
      'Magic: activate your Future Self and lead from who you are becoming.',
      'Sales from the Soul: enroll the right women without pressure.' ] },

  {t:'cta', eyebrow:'Your next step',
    h2:'Ready to lead and sell from your intuition?',
    body:'If this is the way you want to build, the next room is Hot Girl Summer, my group activation for women leaders ready to receive at a greater capacity. Come find out if it is your season.',
    btn:'Apply for Hot Girl Summer',
    disclaimer:'This masterclass is for educational purposes only. No income or result is guaranteed. Results vary from person to person and depend on many factors outside any program.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide '+ (s.t||'');
  const num=String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  let inner='';
  const eyebrow = s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:'';
  if(s.t==='title'){
    inner=`<span class="glow g-pink" style="width:420px;height:420px;top:-120px;right:-80px"></span>
      <span class="glow g-cyan" style="width:360px;height:360px;bottom:-140px;left:-100px"></span>
      ${eyebrow}<h1>${s.h1}</h1><p class="promise">${s.promise}</p>`;
  } else if(s.t==='part'){
    inner=`<span class="glow g-pink" style="width:340px;height:340px;top:40%;left:-120px"></span>
      <p class="kicker"><span class="diamond"></span>${s.kicker}</p><h2>${s.h2}</h2>`;
  } else if(s.t==='list'){
    const lis=s.items.map(x=>`<li><span class="mk">&#9830;</span><span>${x}</span></li>`).join('');
    inner=`${eyebrow}<h2>${s.h2}</h2><ul class="big-list">${lis}</ul>`;
  } else if(s.t==='reframe'){
    inner=`<span class="glow g-pink" style="width:380px;height:380px;bottom:-120px;right:-80px"></span>
      ${eyebrow}<h2>${s.h2}</h2><p class="lede">${s.lede}</p>`;
  } else if(s.t==='pillar'){
    inner=`${eyebrow}<div class="pillar"><div class="tag">${s.tagHtml}</div>
      <div><h2>${s.h2}</h2><p class="lede">${s.lede}</p></div></div>`;
  } else if(s.t==='me'){
    inner=`${eyebrow}<div class="me"><div class="portrait"><span>${s.portrait}</span></div>
      <div><h2>${s.h2}</h2><p class="lede">${s.lede}</p></div></div>`;
  } else if(s.t==='cta'){
    inner=`<span class="glow g-pink" style="width:460px;height:460px;top:-120px;left:50%;transform:translateX(-50%)"></span>
      ${eyebrow}<span class="quotemark">&#9830;</span><h2>${s.h2}</h2>
      <p class="lede" style="margin-left:auto;margin-right:auto">${s.body}</p>
      <a class="btn" href="#">${s.btn}</a>
      <p class="disclaimer">${s.disclaimer}</p>`;
  } else { // intro
    inner=`${eyebrow}<h2>${s.h2}</h2><p class="lede">${s.lede}</p>`;
  }
  sec.innerHTML=`<span class="num">${num}</span>`+inner;
  deck.appendChild(sec);
});
</script>
</body>
</html>
