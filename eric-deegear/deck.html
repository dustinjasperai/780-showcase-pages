<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Happy, Successful Massage Therapist - Eric Deegear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#faf7f4;
    --panel:#f0e9e4;
    --ink:#2a1f1d;
    --accent:#5d1919;
    --muted:#6b5d58;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .deck{width:100%;}
  section.slide{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:9vh 8vw;
    border-bottom:1px solid rgba(93,25,25,0.08);
    position:relative;
  }
  section.slide:nth-child(even){background:var(--panel);}
  .eyebrow{
    font-family:"Inter",sans-serif;
    text-transform:uppercase;
    letter-spacing:0.22em;
    font-size:0.72rem;
    font-weight:600;
    color:var(--accent);
    margin-bottom:1.4rem;
  }
  h1{
    font-family:"Spectral",serif;
    font-weight:600;
    font-size:clamp(2.6rem,6vw,5rem);
    line-height:1.04;
    letter-spacing:-0.01em;
    max-width:16ch;
  }
  h2{
    font-family:"Spectral",serif;
    font-weight:600;
    font-size:clamp(1.9rem,4.2vw,3.2rem);
    line-height:1.1;
    letter-spacing:-0.01em;
    max-width:20ch;
  }
  .sub{
    font-size:clamp(1.05rem,1.9vw,1.4rem);
    color:var(--muted);
    margin-top:1.5rem;
    max-width:46ch;
    font-weight:400;
  }
  .body{
    font-size:clamp(1rem,1.5vw,1.2rem);
    margin-top:2rem;
    max-width:54ch;
  }
  .body p{margin-top:1.1rem;}
  ul.body{list-style:none;padding:0;}
  ul.body li{
    position:relative;
    padding-left:1.8rem;
    margin-top:1.1rem;
    max-width:56ch;
  }
  ul.body li::before{
    content:"";
    position:absolute;
    left:0;
    top:0.72em;
    width:0.7rem;
    height:0.7rem;
    background:var(--accent);
    clip-path:polygon(50% 0,100% 100%,0 100%);
  }
  ul.body li strong{color:var(--accent);font-weight:600;}
  .rule{
    width:160px;
    height:2px;
    background:var(--accent);
    margin:0 0 2.2rem 0;
  }
  .num{
    font-family:"Spectral",serif;
    font-size:0.95rem;
    color:var(--muted);
    position:absolute;
    bottom:4vh;
    right:8vw;
    letter-spacing:0.05em;
  }
  .brand{
    position:absolute;
    bottom:4vh;
    left:8vw;
    font-size:0.78rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:500;
  }
  /* mountains motif */
  .mtns{display:block;width:220px;max-width:60vw;height:auto;margin-top:2.6rem;opacity:0.9;}
  .mtns.center{margin:2.6rem auto 0;}
  .slide.title{justify-content:center;align-items:flex-start;}
  .slide.cta{background:var(--accent);color:var(--ground);}
  .slide.cta .eyebrow{color:#e8c9c9;}
  .slide.cta h2{color:var(--ground);}
  .slide.cta .sub{color:#ecd9d6;}
  .slide.cta a{color:var(--ground);font-weight:600;text-decoration:underline;}
  .slide.cta .rule{background:#e8c9c9;}
  .disclaimer{
    margin-top:3rem;
    font-size:0.85rem;
    color:#e3cac7;
    max-width:48ch;
    line-height:1.5;
  }
  .kicker{
    font-family:"Spectral",serif;
    font-style:italic;
    font-size:clamp(1.3rem,2.6vw,2rem);
    color:var(--accent);
    margin-top:1.8rem;
    max-width:30ch;
  }
  @media (max-width:640px){
    section.slide{padding:8vh 7vw;}
  }
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const MTN = '<svg class="mtns" viewBox="0 0 240 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M0 38 L34 14 L58 26 L92 6 L122 24 L150 12 L186 30 L214 16 L240 38" stroke="#5d1919" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="0" y1="38" x2="240" y2="38" stroke="#5d1919" stroke-width="1" opacity="0.5"/></svg>';

const S=[
  {t:'title',
    eyebrow:'A Masterclass with Eric Deegear',
    h:'The Happy, Successful Massage Therapist',
    sub:'How to build a massage practice that pays you well and still feels good, using the 5 Mountains.',
    motif:true
  },
  {t:'content',
    eyebrow:'Who this is for',
    h:'You are good with your hands. That was never the problem.',
    body:[
      'You are a working therapist or bodyworker. Your table stays busy. Clients love you.',
      'And yet the month ends and there is almost nothing left. Your hands ache before noon. Someone no-shows and you eat the hour.',
      'You keep your rates low because raising them feels greedy, and you tell yourself the next season will be easier.'
    ]
  },
  {t:'content',
    eyebrow:'The reframe',
    h:'Fully booked is not the same as thriving.',
    body:'<p>Being booked solid can be the most convincing disguise a struggling practice ever wears.</p><p>Busy and broke is still broke. A packed calendar can hide low pay, worn-out hands, and a quiet resentment of the work you used to love.</p>',
    kicker:'The goal was never more hours. It was a life.'
  },
  {t:'content',
    eyebrow:'Part One - The core problem',
    h:'Skill alone does not make a practice sustainable.',
    body:[
      'Nobody taught you the business while you were learning the body. So the practice runs on effort, and effort runs out.',
      'Great technique with no structure means you trade your body for income until the body says no.',
      'A sustainable practice is built on purpose, not just talent. That is a skill set too, and it can be learned.'
    ]
  },
  {t:'content',
    eyebrow:'Where it goes wrong',
    h:'The Six Most Common Pitfalls',
    body:[
      '<strong>Pricing from fear.</strong> Charging what feels safe instead of what the work is worth.',
      '<strong>No boundaries.</strong> Late cancels, favors, and overbooking that drain the week.',
      '<strong>Running on the body only.</strong> No plan for the day the hands need rest.',
      '<strong>Hiding the business.</strong> Avoiding the numbers until the numbers force the issue.',
      '<strong>Working alone.</strong> No peers, no mentor, no room to grow into.',
      '<strong>Forgetting the why.</strong> Losing the joy that put you on this path.'
    ]
  },
  {t:'section',
    eyebrow:'Part Two - The framework',
    h:'The 5 Mountains',
    sub:'A practice is a whole life. I teach it across five sectors you climb together, never one at the expense of the rest.',
    body:'<p>Physical. Mental. Financial. Relational. Spiritual.</p><p>Neglect one mountain and the others start to slide. Tend all five and the practice holds its own weight.</p>',
    motif:true
  },
  {t:'content',
    eyebrow:'Mountain 1 of 5',
    h:'Physical',
    sub:'Your body is the instrument and the business. Protect it on purpose.',
    body:[
      '<strong>What it means:</strong> Longevity. You cannot serve from an injured, exhausted body, and no rate is high enough to replace your hands.',
      '<strong>Practice:</strong> Cap your hands-on hours per day and defend that cap in your booking rules.',
      '<strong>Practice:</strong> Build body mechanics and recovery into the workday, not just the weekend. Treat your own maintenance like a client you never cancel.'
    ]
  },
  {t:'content',
    eyebrow:'Mountain 2 of 5',
    h:'Mental',
    sub:'The quiet stories you carry about money, worth, and asking.',
    body:[
      '<strong>What it means:</strong> Clarity and confidence. Burnout often starts in the head long before the hands.',
      '<strong>Practice:</strong> Name the belief under your pricing. Write down the exact sentence that makes raising a rate feel wrong, then question whether it is true.',
      '<strong>Practice:</strong> Keep a short end-of-day note on what drained you and what filled you. Patterns show up fast once you watch for them.'
    ]
  },
  {t:'content',
    eyebrow:'Mountain 3 of 5',
    h:'Financial',
    sub:'The work of service and the work of being paid well are not enemies.',
    body:[
      '<strong>What it means:</strong> A practice that funds your life, not one that quietly asks you to subsidize it.',
      '<strong>Practice:</strong> Know your true cost per hour, including the hours you are not on the table. Price from that floor, not from fear.',
      '<strong>Practice:</strong> Set a cancellation and deposit policy and hold it kindly and consistently. Protecting your time is how you keep serving.'
    ]
  },
  {t:'content',
    eyebrow:'Mountain 4 of 5',
    h:'Relational',
    sub:'Clients, peers, and the people who hold you up off the table.',
    body:[
      '<strong>What it means:</strong> A practice grows through relationships, not just transactions. Isolation is expensive.',
      '<strong>Practice:</strong> Build real rebooking into the close of every session so care continues instead of restarting from zero.',
      '<strong>Practice:</strong> Find at least one peer or mentor further up the path. You climb faster with a rope than alone.'
    ]
  },
  {t:'content',
    eyebrow:'Mountain 5 of 5',
    h:'Spiritual',
    sub:'The reason you chose healing work in the first place.',
    body:[
      '<strong>What it means:</strong> Meaning and presence. When the why goes quiet, the work turns into a grind no rate can fix.',
      '<strong>Practice:</strong> Begin the day with a short grounding ritual before the first client. Two minutes of breath changes the whole room.',
      '<strong>Practice:</strong> Protect the kind of work that feeds you, not only the work that pays, and let both have a place on the calendar.'
    ]
  },
  {t:'content',
    eyebrow:'The path',
    h:'Levels of Mastery',
    body:[
      '<strong>Student.</strong> Learning the hands and the heart of the work. Everything is technique.',
      '<strong>Practitioner.</strong> Competent and busy, often right where the busy-and-broke trap lives.',
      '<strong>Mastery.</strong> The craft and the business climb together. The practice serves the life, not the other way around.'
    ],
    sub:'Most therapists get stuck at Practitioner. The 5 Mountains are how you keep climbing.'
  },
  {t:'content',
    eyebrow:'What keeps therapists stuck',
    h:'The Seven Deadly Realities',
    body:'<p>These are the hard truths I name plainly, because pretending they are not there is what keeps good therapists exhausted and underpaid for years.</p><p>Undercharging. Over-giving. No rest built in. Avoiding the numbers. Growing alone. Confusing busy with successful. And slowly losing the joy. You can face all seven, one mountain at a time.</p>'
  },
  {t:'content',
    eyebrow:'Part Three - The destination',
    h:'What a thriving practice actually looks like',
    body:[
      'Fewer sessions, better paid, with hands that still work in twenty years.',
      'A calendar you chose, with boundaries that hold and clients who respect them.',
      'Numbers you understand and are not afraid to look at.',
      'And the joy back. The reason you picked up this work in the first place, still here.'
    ]
  },
  {t:'content',
    eyebrow:'Why listen to me',
    h:'I teach from a practice I still run.',
    body:[
      'I am Eric Deegear, a Licensed Massage Therapist since 2010, a Reiki Master, and the creator of Na\'masaje, my signature Thai Bodywork style.',
      'I own a multi-location studio with an in-house apprenticeship, and I am still on the table. I am a practitioner who practices, not an info-coach selling theory.',
      'Everything in the 5 Mountains is something I have had to live and build myself, through The Happy, Successful Massage Therapist.'
    ]
  },
  {t:'content',
    eyebrow:'The recap',
    h:'Climb all five. Not one at the cost of the rest.',
    body:[
      '<strong>Physical:</strong> protect the instrument.',
      '<strong>Mental:</strong> clear the stories under your pricing.',
      '<strong>Financial:</strong> get paid for the whole of your work.',
      '<strong>Relational:</strong> stop climbing alone.',
      '<strong>Spiritual:</strong> keep the why alive.'
    ],
    sub:'Happy and successful is not a trade-off. It is the whole mountain range, tended together.'
  },
  {t:'content',
    eyebrow:'Your next step',
    h:'You do not have to map this alone.',
    body:'<p>If you saw your own practice in any of this, that is the starting point, not the verdict. The busy-and-broke trap is a structure, and structures can be rebuilt.</p><p>The next step is a conversation about where your five mountains stand today.</p>',
    motif:true
  },
  {t:'cta',
    eyebrow:'Work with Deegear Coaching',
    h:'Book a free discovery call with me.',
    sub:'We will walk your 5 Mountains together, find the one that is costing you the most right now, and map a clearer path to a practice that pays you well and still feels good.',
    body:'<p>Bring your real questions. This is a conversation, not a pitch.</p>',
    disclaimer:'This masterclass is for educational purposes only. Individual results vary and are not guaranteed.'
  }
];

function esc(x){return x;}

function renderBody(b){
  if(Array.isArray(b)){
    return '<ul class="body">'+b.map(function(li){return '<li>'+li+'</li>';}).join('')+'</ul>';
  }
  return '<div class="body">'+b+'</div>';
}

function build(){
  var deck=document.getElementById('deck');
  var html='';
  S.forEach(function(s,i){
    var cls='slide'+(s.t==='title'?' title':'')+(s.t==='cta'?' cta':'');
    html+='<section class="'+cls+'">';
    if(s.eyebrow){html+='<div class="eyebrow">'+s.eyebrow+'</div>';}
    if(s.t!=='title' && s.t!=='cta'){html+='<div class="rule"></div>';}
    if(s.h){html+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');}
    if(s.sub){html+='<div class="sub">'+s.sub+'</div>';}
    if(s.body){html+=renderBody(s.body);}
    if(s.kicker){html+='<div class="kicker">'+s.kicker+'</div>';}
    if(s.motif){html+=MTN.replace('class="mtns"', s.t==='title'?'class="mtns"':'class="mtns center"');}
    if(s.disclaimer){html+='<div class="disclaimer">'+s.disclaimer+'</div>';}
    html+='<div class="brand">The Happy, Successful Massage Therapist</div>';
    html+='<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
    html+='</section>';
  });
  deck.innerHTML=html;
}
build();

// minimal arrow-key navigation between slides
document.addEventListener('keydown',function(e){
  var slides=document.querySelectorAll('section.slide');
  if(!slides.length)return;
  var y=window.scrollY, h=window.innerHeight, cur=Math.round(y/h), next=cur;
  if(e.key==='ArrowDown'||e.key==='PageDown'){next=Math.min(cur+1,slides.length-1);}
  else if(e.key==='ArrowUp'||e.key==='PageUp'){next=Math.max(cur-1,0);}
  else{return;}
  e.preventDefault();
  slides[next].scrollIntoView({behavior:'smooth'});
});
</script>
</body>
</html>
