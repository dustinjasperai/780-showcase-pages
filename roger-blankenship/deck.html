<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your First Profitable Flip - A Flipping America Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5e8e3; --panel:#fffbf8; --rule:#ebd6ce; --ink:#2a2622;
    --muted:#6b6258; --accent:#b72d26;
    --head:'Oswald',sans-serif; --body:'Lato',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:10px;
    padding:56px 56px 48px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .eyebrow{font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;
    font-size:14px;font-weight:600;color:var(--accent);margin-bottom:18px}
  .rule{width:64px;height:4px;background:var(--accent);border:0;margin:0 0 22px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,6vw,62px);line-height:1.04;
    letter-spacing:.005em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(28px,4.4vw,44px);line-height:1.08}
  .sub{font-size:clamp(18px,2.2vw,24px);color:var(--muted);margin-top:18px;max-width:40ch}
  .lead{font-size:clamp(20px,2.4vw,26px);margin-top:10px;max-width:46ch}
  p.body{font-size:18px;color:var(--ink);margin-top:14px;max-width:52ch}
  .num{font-family:var(--head);font-weight:700;font-size:72px;color:var(--accent);line-height:1}
  ul{list-style:none;margin-top:22px}
  ul li{font-size:19px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  ul li:last-child{border-bottom:0}
  ul li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;
    background:var(--accent);border-radius:2px}
  .ff{display:flex;align-items:baseline;gap:22px}
  .ff .num{font-size:88px}
  .kick{font-family:var(--head);text-transform:uppercase;letter-spacing:.12em;
    font-size:13px;color:var(--muted);margin-top:28px}
  .cover h1{font-size:clamp(40px,7.4vw,78px)}
  .section-tag{font-family:var(--head);font-weight:600;color:var(--accent);
    text-transform:uppercase;letter-spacing:.1em;font-size:16px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.45}
  .cta-line{font-family:var(--head);font-weight:600;font-size:22px;color:var(--accent);margin-top:20px}
  .foot{font-family:var(--head);text-transform:uppercase;letter-spacing:.12em;
    font-size:12px;color:var(--muted);margin-top:34px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'cover', eyebrow:'Flipping America - A Live Masterclass',
   h1:'Your First Profitable Flip',
   sub:'The Find, Fund, Fix, Flip system. No hype, no pressure, no $30,000 guru tuition.'},

  {t:'point', eyebrow:'Who this is for',
   h2:'You see undervalued houses everywhere.',
   body:'They are in every market, on every street. You know there is money in them. What you do not have yet is a clear, repeatable path to turn one into your first profitable deal.'},

  {t:'point', eyebrow:'The trap',
   h2:'So you wait for the perfect deal.',
   body:'And you keep waiting, because deep down you cannot tell a good deal from a money pit. One wrong number on one wrong house is the story everybody is afraid of. So nothing gets bought.'},

  {t:'reframe', eyebrow:'The real problem',
   h1:'The houses were never the problem.',
   lead:'Nobody taught you the numbers, or the system that sits behind them. That is all this is. It is not rocket surgery.'},

  {t:'section', tag:'Part One', h2:'What a good deal looks like'},

  {t:'point', eyebrow:'The numbers first',
   h2:'Learn the offer price, and the walk-away line.',
   body:'Before you find, fund, or fix anything, you learn exactly what to offer on a house and the number where you walk away. Get this one skill and the fear goes away, because now you can see the money pit coming.'},

  {t:'section', tag:'Part Two', h2:'The system: Find, Fund, Fix, Flip'},

  {t:'ff', num:'1', h2:'Find them',
   body:'Where the best flips actually hide, and how to build a pipeline that feeds itself so you are never short of deals to look at.'},

  {t:'ff', num:'2', h2:'Fund them',
   body:'How to close with creative financing and partners, even if you do not have deep pockets. You do not need your own cash to do your first deal.'},

  {t:'ff', num:'3', h2:'Fix them',
   body:'Manage the rehab like a pro: hiring the right contractors, holding the timeline, and keeping the budget from running away from you.'},

  {t:'ff', num:'4', h2:'Flip them',
   body:'Sell for maximum profit using simple systems that keep the deal moving, so your capital comes back and goes to work on the next one.'},

  {t:'point', eyebrow:'Then you repeat it',
   h2:'Grow and scale.',
   body:'Once the four steps are a system instead of a scramble, flipping stops being a side hustle and becomes a business. The same process works on deal one and deal fifty.'},

  {t:'section', tag:'Part Three', h2:'Your first 90 days'},

  {t:'list', eyebrow:'Deal one, step by step',
   h2:'A clear path, in order.',
   items:['Weeks 1 to 3: learn the numbers and build your deal pipeline',
          'Weeks 4 to 6: analyze real deals and line up your funding',
          'Weeks 7 to 12: get one under contract, manage the rehab, and sell']},

  {t:'reframe', eyebrow:'The honest part',
   h1:'You do not need a hotel-room guru.',
   lead:'And you do not need to spend $30,000 to get started. You need the right information and a clear path. That is the whole promise.'},

  {t:'cred', eyebrow:'Why listen to me',
   h2:'Roger Blankenship',
   items:['More than 2,000 real estate deals, including 1,700 plus fix and flips',
          '25 years doing this, not talking about it',
          'Author of the international number one bestseller Flipping Houses in Ten Days',
          'Host of the nationally syndicated Flipping America show']},

  {t:'point', eyebrow:'My whole approach',
   h2:'Practical tools, built on real experience.',
   body:'I do not promise overnight wealth and no effort like some of the other real estate gurus. I give you detailed, step-by-step resources that work in any market, so you can work toward your goals and build real wealth.'},

  {t:'recap', eyebrow:'The system, one more time',
   h2:'Find. Fund. Fix. Flip.',
   body:'Know the numbers, find the deal, fund it, fix it, and sell it. Then do it again.'},

  {t:'cta', eyebrow:'Your next step',
   h2:'Start your first flip with Flipping America.',
   body:'If you are ready to find, fund, fix, and flip your first house, begin with FlipStarter and step into the coaching when you want a person in your corner.',
   cta:'Join us at flippingamerica.net',
   disc:'Educational only. This presentation is for information and education. It is not financial, legal, or investment advice. Real estate investing involves risk, including the possible loss of principal. No income or results are guaranteed, and individual results vary based on effort, market, and many factors outside your control.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}

const deck = document.getElementById('deck');
S.forEach(s=>{
  const d = el('section','slide'+(s.t==='cover'?' cover':''));
  if(s.eyebrow) d.appendChild(el('div','eyebrow',s.eyebrow));
  if(s.tag){ d.appendChild(el('div','section-tag',s.tag)); d.appendChild(el('hr','rule')); }
  else if(s.t!=='cover' && s.t!=='section'){ d.appendChild(el('hr','rule')); }
  if(s.t==='ff'){
    const row = el('div','ff');
    row.appendChild(el('div','num',s.num));
    const col = el('div');
    col.appendChild(el('h2',null,s.h2));
    if(s.body) col.appendChild(el('p','body',s.body));
    row.appendChild(col);
    d.appendChild(row);
  } else {
    if(s.h1) d.appendChild(el('h1',null,s.h1));
    if(s.h2) d.appendChild(el('h2',null,s.h2));
    if(s.sub) d.appendChild(el('div','sub',s.sub));
    if(s.lead) d.appendChild(el('div','lead',s.lead));
    if(s.body) d.appendChild(el('p','body',s.body));
    if(s.items){ const ul=el('ul'); s.items.forEach(i=>ul.appendChild(el('li',null,i))); d.appendChild(ul); }
    if(s.cta) d.appendChild(el('div','cta-line',s.cta));
    if(s.disc) d.appendChild(el('div','disc',s.disc));
  }
  if(s.t==='cover') d.appendChild(el('div','foot','Flipping America'));
  deck.appendChild(d);
});
</script>
</body>
</html>
