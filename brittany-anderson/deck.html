<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Identity Shift, a MOMentum masterclass with Brittany Anderson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f4;        /* warm off-white, from her #f0e5e3 blush ground */
    --panel:#f0e5e3;     /* her exact blush, 2nd-ranked brand hex */
    --ink:#3a3a3a;       /* charcoal ink */
    --muted:#595959;     /* her top-ranked brand hex */
    --accent:#b08478;    /* dusty rose, deepened from the blush family */
    --rule:#d9c9c4;
    --display:"Cormorant Garamond",Georgia,serif;
    --body:"Open Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--muted);font-family:var(--body);color:var(--ink);}
  .deck{max-width:1040px;margin:0 auto;}
  .slide{
    position:relative;background:var(--bg);min-height:92vh;margin:28px auto;
    padding:72px 80px;border:1px solid var(--rule);
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 40px rgba(0,0,0,.12);
  }
  .slide::after{content:"";position:absolute;left:80px;right:80px;bottom:52px;height:1px;background:var(--rule);}
  .eyebrow{font-family:var(--body);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px;}
  h1{font-family:var(--display);font-weight:600;font-size:68px;line-height:1.02;letter-spacing:-.01em;color:var(--ink);}
  h2{font-family:var(--display);font-weight:600;font-size:46px;line-height:1.08;color:var(--ink);}
  .lead{font-family:var(--display);font-style:italic;font-size:30px;line-height:1.3;color:var(--muted);margin-top:18px;max-width:30ch;}
  p.body{font-size:20px;line-height:1.6;color:var(--muted);margin-top:18px;max-width:46ch;}
  .big{font-family:var(--display);font-weight:500;font-size:52px;line-height:1.12;color:var(--ink);max-width:22ch;}
  ul{margin-top:26px;list-style:none;}
  li{font-size:21px;line-height:1.5;color:var(--ink);padding:14px 0 14px 30px;position:relative;border-top:1px solid var(--rule);max-width:42ch;}
  li:first-child{border-top:none;}
  li::before{content:"";position:absolute;left:0;top:23px;width:12px;height:12px;background:var(--accent);border-radius:50%;}
  .stepgrid{display:flex;gap:0;margin-top:34px;border:1px solid var(--rule);}
  .step{flex:1;padding:26px 22px;border-right:1px solid var(--rule);}
  .step:last-child{border-right:none;}
  .step .n{font-family:var(--display);font-size:30px;color:var(--accent);}
  .step .t{font-weight:600;margin-top:8px;font-size:17px;}
  .step .d{color:var(--muted);font-size:15px;margin-top:6px;line-height:1.45;}
  .panel{background:var(--panel);padding:30px 34px;margin-top:26px;max-width:52ch;}
  .foot{position:absolute;left:80px;bottom:30px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .pageno{position:absolute;right:80px;bottom:30px;font-size:12px;color:var(--muted);}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.5;}
  .cta-line{font-family:var(--display);font-size:26px;color:var(--accent);margin-top:20px;}
  @media (max-width:720px){.slide{padding:48px 30px}h1{font-size:44px}h2{font-size:34px}.big{font-size:34px}.stepgrid{flex-direction:column}.step{border-right:none;border-bottom:1px solid var(--rule)}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:"A live MOMentum masterclass", h1:"The Identity Shift",
    lead:"Why accountability, not motivation, is how ambitious women actually follow through." },

  {t:'promise', eyebrow:"What this hour gives you", h2:"By the end of today you'll stop chasing motivation and start building momentum.",
    body:"You'll see exactly why your goals stall, and the identity-first way to make the next version of you inevitable, not optional." },

  {t:'audience', eyebrow:"Who this is for", h2:"The ambitious woman who knows she's made for more.",
    bullets:["You set the goal, start strong, then quietly drift","You're tired of waiting for the right time","You don't need another planner, you need follow-through","You love growth and want it to finally stick"] },

  {t:'hook', eyebrow:"The reframe", big:"You don't have a motivation problem. You have an action problem.",
    body:"Motivation fades. It was never going to carry you to the finish. Something steadier has to." },

  {t:'section', eyebrow:"Part One", h1:"The Motivation Trap" },

  {t:'point', eyebrow:"Why it keeps happening", h2:"Motivation is a feeling, and feelings are weather.",
    body:"You wait to feel ready. Ready is a mood, not a strategy. So the start date keeps moving: Monday, the first of the month, next quarter." },

  {t:'point', eyebrow:"The planning loop", h2:"Planning feels like progress. It isn't.",
    body:"A new plan gives you a hit of relief, so you plan again instead of moving. The cycle looks productive and goes nowhere." },

  {t:'point', eyebrow:"The real variable", h2:"Willpower isn't the lever. Identity is.",
    body:"You don't rise to your goals. You fall to who you believe you are. Change that first and the actions stop requiring a fight." },

  {t:'section', eyebrow:"Part Two", h1:"The MOMentum Method" },

  {t:'framework', eyebrow:"The method, in four moves", h2:"Identity first. Then standards. Then accountability. Then momentum.",
    steps:[
      {n:"01",st:"Identity",d:"Decide who you're becoming before you touch the plan."},
      {n:"02",st:"Standards",d:"Set the non-negotiables that version of you already keeps."},
      {n:"03",st:"Accountability",d:"Put someone in your corner who won't let you quit."},
      {n:"04",st:"Momentum",d:"Repeat the standard until motion becomes who you are."}
    ] },

  {t:'pillar', eyebrow:"Move one, Identity", h2:"Become her first.",
    body:"We name the woman you're becoming in specific terms, so every decision has a clear owner. You stop asking what to do and start asking what she would do." },

  {t:'pillar', eyebrow:"Move two, Standards", h2:"Standards, not goals, run your day.",
    body:"Goals are a destination. Standards are how she behaves on an ordinary Tuesday. We set three you can keep when motivation is nowhere in the room." },

  {t:'pillar', eyebrow:"Move three, The Vision Map", h2:"The identity-first roadmap.",
    bullets:["A crystal-clear next-level identity","The 3 to 5 goals that actually matter","A simple quarterly plan that feels doable","A mantra and momentum intention to anchor it"] },

  {t:'pillar', eyebrow:"Move four, Accountability", h2:"The part everyone skips, and the part that works.",
    body:"Named, claimed, and actually happening. Accountability that keeps you moving no matter what life brings is the difference between another list and a year you're proud of." },

  {t:'section', eyebrow:"Part Three", h1:"A Year In Momentum" },

  {t:'point', eyebrow:"A week in momentum", h2:"Not harder. Clearer.",
    body:"You wake up knowing the two things that matter and the standard that makes them non-negotiable. The noise loses its vote." },

  {t:'point', eyebrow:"Ninety days in", h2:"The compound starts to show.",
    body:"Real, sustainable growth doesn't happen in 30 days. It happens when a standard you kept quietly for a season becomes simply who you are." },

  {t:'credibility', eyebrow:"Why listen to me", h2:"I'm Brittany Anderson.",
    body:"I'm the accountability coach women come to for clarity, momentum, and deep follow-through. I've helped hundreds of women step into their next identity and build the habits that match it, with community and real standards, not fluff." },

  {t:'recap', eyebrow:"The one thing to take with you", big:"Decide who you're becoming. Then refuse to let her quit.",
    body:"That's the whole method. Identity first, standards next, accountability always." },

  {t:'cta', eyebrow:"Your next step", h2:"Come build the year in a room that holds you to it.",
    ctaLine:"Step into MOMentum, the room sized to your season of becoming.",
    disclaimer:"This masterclass is for education and inspiration only. It is not a guarantee of any specific result. Outcomes depend on your own effort, circumstances, and consistency, and individual results vary." }
];

const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide " + s.t;
  let inner = "";
  if (s.eyebrow) inner += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.h1) inner += `<h1>${s.h1}</h1>`;
  if (s.h2) inner += `<h2>${s.h2}</h2>`;
  if (s.big) inner += `<div class="big">${s.big}</div>`;
  if (s.lead) inner += `<div class="lead">${s.lead}</div>`;
  if (s.steps) {
    inner += `<div class="stepgrid">` + s.steps.map(x =>
      `<div class="step"><div class="n">${x.n}</div><div class="t">${x.st}</div><div class="d">${x.d}</div></div>`).join("") + `</div>`;
  }
  if (s.bullets) inner += `<ul>` + s.bullets.map(b => `<li>${b}</li>`).join("") + `</ul>`;
  if (s.body) inner += `<p class="body">${s.body}</p>`;
  if (s.ctaLine) inner += `<div class="cta-line">${s.ctaLine}</div>`;
  if (s.disclaimer) inner += `<div class="disclaimer">${s.disclaimer}</div>`;
  inner += `<div class="foot">MOMentum &middot; Brittany Anderson</div>`;
  inner += `<div class="pageno">${i + 1} / ${S.length}</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
