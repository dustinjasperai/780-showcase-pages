<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sustainable Interpreter | A Live Masterclass with Carly Flagg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#fbf9ff;
    --panel:#ffffff;
    --rule:#ece6fb;
    --ink:#241a3a;
    --ink-soft:#4a4066;
    --ink-muted:#7a7391;
    --accent:#6f3dce;
    --accent-deep:#3d0cb1;
  }
  html,body{height:100%;}
  body{
    font-family:'Outfit',-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #stage{ width:100vw; height:100vh; position:relative; }
  .slide{
    position:absolute; inset:0; display:none;
    flex-direction:column; justify-content:center;
    padding:9vh 11vw; gap:22px;
  }
  .slide.active{ display:flex; }
  .kicker{ font-size:13px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); }
  .eyebrow{ font-size:14px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-muted); }
  h1{ font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:clamp(34px,6vw,68px); line-height:1.08; letter-spacing:-.01em; }
  h2{ font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; font-size:clamp(28px,4.4vw,48px); line-height:1.14; }
  .sub{ font-size:clamp(17px,2vw,23px); color:var(--ink-soft); max-width:30ch; line-height:1.5; }
  .big{ font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:clamp(26px,3.6vw,42px); line-height:1.25; max-width:24ch; }
  ul{ list-style:none; display:flex; flex-direction:column; gap:16px; max-width:30ch; }
  li{ font-size:clamp(16px,1.9vw,22px); color:var(--ink-soft); padding-left:26px; position:relative; line-height:1.4; }
  li::before{ content:""; position:absolute; left:0; top:.62em; width:11px; height:11px; border-radius:50%; background:var(--accent); }
  .pillars{ display:flex; gap:22px; flex-wrap:wrap; }
  .pill{ background:var(--panel); border:1px solid var(--rule); border-radius:16px; padding:26px 28px; flex:1 1 220px; min-width:200px; }
  .pill .n{ font-family:'Cormorant Garamond',serif; color:var(--accent); font-size:30px; font-weight:700; }
  .pill h3{ font-family:'Cormorant Garamond',serif; font-size:23px; margin:8px 0 10px; }
  .pill p{ font-size:15px; color:var(--ink-muted); line-height:1.5; }
  .whoami{ display:flex; flex-direction:column; gap:14px; max-width:40ch; }
  .whoami .sub{ max-width:40ch; }
  .cta-box{ background:var(--panel); border:1px solid var(--rule); border-left:5px solid var(--accent); border-radius:14px; padding:26px 30px; max-width:40ch; }
  .cta-box .step{ font-weight:600; color:var(--accent-deep); font-size:18px; }
  .disclaimer{ font-size:12px; color:var(--ink-muted); max-width:46ch; line-height:1.5; margin-top:8px; }
  .brandmark{ position:absolute; bottom:4.5vh; left:11vw; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-muted); }
  .nav{ position:absolute; bottom:4.5vh; right:11vw; font-size:13px; color:var(--ink-muted); font-variant-numeric:tabular-nums; }
  .dot{ color:var(--accent); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S=[
  {t:'title', eyebrow:'A live masterclass for sign language interpreters',
   h:'The Sustainable Interpreter',
   sub:'How to stay in the booth for the long haul, without burning out.'},

  {t:'points', kicker:'In the next hour', h:'What you will leave with',
   points:[
     'A clear way to tell stress, burnout, and compassion fatigue apart.',
     'Three creativity-based tools you can use between assignments.',
     'A realistic picture of what a long, healthy interpreting career asks of you.'
   ]},

  {t:'who', kicker:'Who this is for',
   h:'You still love the work.',
   sub:'You just notice you are more tired, more flat, and more quietly resentful than you used to be. And you wonder if that means something is wrong with you.'},

  {t:'statement', kicker:'The trap',
   big:'The profession rewards you for absorbing everything and showing nothing. That is exactly the habit that makes it unsustainable.'},

  {t:'statement', kicker:'The reframe',
   big:'It is not a character flaw. It is compassion fatigue, and it is an occupational injury, not a personal failing.'},

  {t:'section', kicker:'Part one', h:'Stress, burnout, and compassion fatigue are three different things.',
   sub:'Most interpreters treat all three as "I just need a day off." They are not the same, and they do not respond to the same tools.'},

  {t:'points', kicker:'Part one', h:'What is actually happening in your body',
   points:[
     'Stress spikes and recovers. You bounce back after the assignment.',
     'Burnout is depletion. The recovery stops happening.',
     'Compassion fatigue is the cost of absorbing other people’s content, hour after hour, in first person.'
   ]},

  {t:'statement', kicker:'Part one',
   big:'You carry the message in first person all day. Of course it leaves a mark. The job is to metabolize it, not to pretend it isn’t there.'},

  {t:'section', kicker:'Part two', h:'The three pillars',
   sub:'Everything in this work rests on three things. They are simple. They are also the first things that disappear when you are running on empty.'},

  {t:'pillars', kicker:'Part two', h:'Compassion, creativity, presence',
   pills:[
     {n:'01', title:'Compassion', body:'Turned inward first. You cannot pour understanding into a room all day and keep none for yourself and expect it to last.'},
     {n:'02', title:'Creativity', body:'Not talk-only self-care. Creative expression regulates the nervous system in a way that processing out loud often cannot.'},
     {n:'03', title:'Presence', body:'The capacity to be in the assignment without being consumed by it. The skill that makes a long career possible.'}
   ]},

  {t:'points', kicker:'Part two', h:'Three creativity-based tools you can use this week',
   points:[
     'A two-minute reset you can do in the car between assignments.',
     'A body-mapping practice for naming where the week is sitting in you.',
     'A simple ritual to close the work day so it stops following you home.'
   ]},

  {t:'statement', kicker:'Part two',
   big:'The goal is not to feel less. It is to move what you feel through you, so it does not quietly accumulate into leaving the profession.'},

  {t:'section', kicker:'Part three', h:'What a sustainable career actually looks like',
   sub:'Not heroic endurance. A practice that lets you keep doing meaningful work for decades, with your health and your love of the craft intact.'},

  {t:'points', kicker:'Part three', h:'Interpreters who do this work report',
   points:[
     'Catching compassion fatigue early, before it costs them the work.',
     'Reconnecting with why they chose interpreting in the first place.',
     'Setting boundaries without guilt, as a professional skill.'
   ]},

  {t:'statement', kicker:'Part three',
   big:'Longevity is not an accident of temperament. It is a practice, and it can be learned at any point in your career.'},

  {t:'who', kicker:'A note for students',
   h:'If you are still certifying, start now.',
   sub:'The habits that protect a 25-year career are far easier to build before the pattern sets in than to unlearn a decade later.'},

  {t:'whoami', kicker:'Why me', h:'I have been in the booth for 25 years.',
   sub:'I am Carly Flagg, a working sign language interpreter and interpreter educator, and an ICF-certified coach trained in compassion-fatigue education and creativity-based coaching. I am not teaching this from the outside. I built these tools because I needed them.'},

  {t:'cta', kicker:'Your next step',
   h:'Keep going with Interpreter Oasis',
   step:'Interpreter Oasis',
   sub:'Tailored coaching, mentoring, support groups, and continuing education for sign language interpreters, built around everything in this session.',
   disclaimer:'This masterclass is educational in nature. No specific result, income, or professional outcome is guaranteed, and results vary. It is not therapy or mental-health treatment, and it is not a substitute for care from a licensed professional.'}
];

const stage=document.getElementById('stage');
function esc(s){return s;}
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='slide'+(i===0?' active':''); d.dataset.i=i;
    let h='';
    if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
    if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
    if(s.h) h+=`<h1 style="${s.t!=='title'?'font-size:clamp(28px,4.4vw,48px);':''}">${s.h}</h1>`;
    if(s.big) h+=`<div class="big">${s.big}</div>`;
    if(s.sub) h+=`<p class="sub">${s.sub}</p>`;
    if(s.points){ h+='<ul>'+s.points.map(p=>`<li>${p}</li>`).join('')+'</ul>'; }
    if(s.pills){ h+='<div class="pillars">'+s.pills.map(p=>`<div class="pill"><div class="n">${p.n}</div><h3>${p.title}</h3><p>${p.body}</p></div>`).join('')+'</div>'; }
    if(s.t==='cta'){ h+=`<div class="cta-box"><div class="step">${s.step}</div></div>`; if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`; }
    h+=`<div class="brandmark">Hands at Heart &middot; Carly Flagg</div>`;
    h+=`<div class="nav"><span class="dot">${String(i+1).padStart(2,'0')}</span> / ${String(S.length).padStart(2,'0')}</div>`;
    d.innerHTML=h; stage.appendChild(d);
  });
}
let cur=0;
function show(n){ const sl=stage.children; if(n<0||n>=sl.length)return; sl[cur].classList.remove('active'); sl[n].classList.add('active'); cur=n; }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')show(cur+1); if(e.key==='ArrowLeft')show(cur-1); });
document.addEventListener('click',()=>show(cur+1));
render();
</script>
</body>
</html>
