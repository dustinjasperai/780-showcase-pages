<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Micro Brand Method — Moe Hayek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c0e;        /* near-black ground, from his pure-black newsletter body */
    --panel:#15171a;
    --rule:#2a2a2a;      /* from harvested #222222 */
    --ink:#f4f5f7;
    --muted:#cfd2d6;     /* from harvested #e5e7eb */
    --accent:#cccccc;    /* his newsletter button silver (dominant harvested hex) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:44px 22px 120px}
  .slide{
    min-height:78vh;border:1px solid var(--rule);border-radius:14px;background:
      linear-gradient(180deg,#0d0f12,#0b0c0e);
    padding:56px 54px;margin:0 0 30px;display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:54px;right:54px;top:30px;height:1px;background:var(--rule)}
  .num{position:absolute;top:22px;right:34px;font-family:'Poppins';font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--accent);opacity:.75}
  .kick{font-family:'Poppins';font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  h1{font-family:'Poppins';font-weight:800;font-size:clamp(34px,5.4vw,62px);line-height:1.02;letter-spacing:-.02em}
  h2{font-family:'Poppins';font-weight:700;font-size:clamp(26px,3.6vw,42px);line-height:1.08;letter-spacing:-.01em}
  .lead{font-size:clamp(17px,2vw,22px);color:var(--muted);margin-top:20px;max-width:30ch;line-height:1.5}
  .big{font-family:'Poppins';font-weight:800;font-size:clamp(70px,15vw,180px);line-height:.9;letter-spacing:-.03em}
  p.body{font-size:clamp(16px,1.7vw,19px);color:var(--muted);margin-top:16px;max-width:60ch;line-height:1.6}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:62ch}
  li{position:relative;padding-left:30px;font-size:clamp(16px,1.7vw,19px);color:var(--ink);line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:2px;background:var(--accent)}
  li b{font-family:'Poppins';font-weight:600}
  .pillar{font-family:'Poppins';font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.14em;margin-bottom:10px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
  .foot{position:absolute;bottom:22px;left:54px;font-family:'Poppins';font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--muted);opacity:.7}
  .disc{font-size:12px;color:var(--muted);opacity:.65;margin-top:26px;max-width:70ch;line-height:1.5}
  .cta-step{font-family:'Poppins';font-weight:700;font-size:clamp(18px,2.2vw,24px);color:var(--ink);margin-top:22px}
  @media(max-width:720px){.slide{padding:40px 26px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "MOEMENTUM  ·  THE MICRO BRAND METHOD";
const S = [
  {t:'title', kick:'A LIVE MASTERCLASS WITH MOE HAYEK',
   h:'The Micro Brand Method',
   lead:'How to launch one viral, high-ticket product into a real brand.'},

  {t:'who', kick:'Who this is for',
   h:'You want your first profitable ecom brand.',
   body:'Not a side project that fizzles. A real brand with real margin that can actually grow. This hour is for the person starting from zero or close to it, who is tired of advice that only works if you already have money and an audience.'},

  {t:'trap', kick:'The trap',
   h:'You were sold the wrong version of ecom.',
   body:'Open a general store. Fill it with cheap trending products. Run a few ads. The problem is that this is the exact playbook that buries most new sellers, and almost nobody tells you why.'},

  {t:'reframe', kick:'The hard truth',
   h:'Cheap products are why most stores die.',
   body:'A $20 impulse product leaves you a few dollars of margin. That margin cannot cover the cost of getting your product seen, cannot absorb a refund, and cannot build a brand. You are not running a business. You are running a treadmill.'},

  {t:'p1', kick:'Part one · the core problem',
   h:'Margin is the whole game.',
   body:'Everything downstream, your ability to get your product seen, to test, to survive a bad week, comes from margin per sale. Fix the margin and the rest of ecom gets dramatically easier. Ignore it and nothing else you do matters.'},

  {t:'math', kick:'The math nobody shows you',
   big:'$800', sub:'one high-ticket sale',
   body:'One $800 sale can carry the margin of forty $20 sales, with one customer to serve instead of forty. High-ticket is not greedy. It is what makes a one-person brand affordable to run and to scale.'},

  {t:'p2intro', kick:'Part two · the method',
   h:'The Micro Brand.',
   body:'Not a sprawling general store. One focused, branded store built around a single validated high-ticket category, presented like a real brand. Four pillars make it work.'},

  {t:'pillar', pillar:'PILLAR 01', h:'Demand-first product selection.',
   body:'Do not invent a product and hope. Find what people are already talking about and already buying, then make it easy to buy from you. Start from demand that exists, not demand you wish existed.'},

  {t:'pillar', pillar:'PILLAR 02', h:'One high-ticket winner.',
   body:'Pick a single premium, higher-margin product to build around. One winner you understand deeply beats ten cheap listings you cannot afford to market. The margin on that one product is your fuel.'},

  {t:'pillar', pillar:'PILLAR 03', h:'Build it like a real brand.',
   body:'Branding, story, and presentation are what separate a micro brand from a dropshipper. Buyers pay premium prices to brands they trust, not to a generic store with a stock photo and a markup.'},

  {t:'pillar', pillar:'PILLAR 04', h:'Content multiplication.',
   body:'Manufacture attention before you spend on ads. A high volume of short-form content around your product is how a brand-new store gets seen with little or no budget. Volume is the strategy.'},

  {t:'connect', kick:'How the pillars connect',
   h:'Demand in, content out, margin to scale.',
   list:['<b>Validate</b> demand before you build anything.','<b>Choose</b> one high-ticket winner with room for margin.','<b>Brand</b> it so people trust it at a premium price.','<b>Multiply</b> content to get seen, then reinvest your margin into more reach.']},

  {t:'p3', kick:'Part three · the brand that results',
   h:'From unknown to a brand people buy.',
   body:'A focused store. One product people already want. A stream of short-form content pulling in attention for free. And enough margin per sale that every customer you win is genuinely profitable.'},

  {t:'ramp', kick:'How it compounds',
   h:'Content keeps working.',
   body:'Every piece of short-form content keeps earning attention after you post it, attention you own instead of rent. The more you publish, the more the method proves itself, and the margin from each high-ticket sale lets you reinvest in more of what is already working.'},

  {t:'why', kick:'Why listen to me',
   h:'I built the brands before I taught them.',
   body:'Over $20,000,000 in total ecommerce revenue across my own brands, and hundreds of students taken through launching their first ecom micro brand. This method is what I actually did, not theory.'},

  {t:'myth', kick:'The myths to drop',
   h:'What is actually holding you back.',
   list:['You do not need a huge budget. You need margin and content.','You do not need a hundred products. You need one winner.','You do not need to go viral by luck. You need volume on purpose.']},

  {t:'picture', kick:'The 30-day picture',
   h:'A real brand, not a gamble.',
   body:'In your first weeks the goal is not a lucky hit. It is a validated high-ticket product, a brand people trust, and a content engine that keeps bringing in attention you own.'},

  {t:'recap', kick:'Recap',
   h:'The Micro Brand Method.',
   list:['<b>Margin</b> is the whole game, so start high-ticket.','<b>One</b> validated winner, built like a real brand.','<b>Content</b> multiplication to get seen for free.','<b>Reinvest</b> the margin into more reach once it works.']},

  {t:'cta', kick:'Your next step',
   h:'Build your micro brand with me.',
   step:'Apply to join Moementum University and build your first high-ticket micro brand with weekly coaching and the full method.',
   disc:'This masterclass is educational only. It is not a guarantee of income or results. Building an ecommerce business involves risk and individual results vary widely based on effort, market, and many factors outside anyone’s control.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section'); el.className='slide';
  let inner = `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  if(s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if(s.pillar) inner += `<div class="pillar">${s.pillar}</div>`;
  if(s.t==='title'){ inner += `<h1>${s.h}</h1>`; if(s.lead) inner += `<div class="lead">${s.lead}</div>`; }
  else if(s.t==='math'){ inner += `<div class="two"><div><div class="big">${s.big}</div><div class="lead">${s.sub}</div></div><div><p class="body">${s.body}</p></div></div>`; }
  else { if(s.h) inner += (s.t==='title'?'':`<h2>${s.h}</h2>`); }
  if(s.body && s.t!=='math') inner += `<p class="body">${s.body}</p>`;
  if(s.list){ inner += '<ul>'; s.list.forEach(x=>inner+=`<li>${x}</li>`); inner += '</ul>'; }
  if(s.step) inner += `<div class="cta-step">${s.step}</div>`;
  if(s.disc) inner += `<div class="disc">${s.disc}</div>`;
  inner += `<div class="foot">${BRAND}</div>`;
  el.innerHTML = inner; deck.appendChild(el);
});
</script>
</body>
</html>
