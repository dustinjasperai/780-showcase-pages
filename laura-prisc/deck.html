<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Are Your Leaders Wide Awake? | Conscious Leadership with Laura Prisc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#13161F;
    --panel:#1D2230;
    --rule:#3A4256;
    --accent:#C8A24B;
    --ink:#ECEBE6;
    --ink-muted:#9AA3B2;
  }
  html,body{ height:100%; }
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    overflow:hidden;
  }
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .slide{
    display:none; width:100%; height:100%;
    padding:8vh 9vw; flex-direction:column; justify-content:center;
    background:
      radial-gradient(120% 90% at 15% 8%, rgba(200,162,75,0.08), transparent 55%),
      var(--bg);
  }
  .slide.active{ display:flex; animation:fade .5s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .eyebrow{ font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:22px; }
  h1{ font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:58px; line-height:1.08; letter-spacing:-.01em; margin-bottom:22px; }
  h2{ font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:40px; line-height:1.15; margin-bottom:20px; }
  .sub{ font-size:22px; color:var(--ink-muted); max-width:46ch; line-height:1.5; }
  .lead{ font-size:24px; line-height:1.55; max-width:52ch; }
  .lead .em{ color:var(--accent); font-style:normal; }
  p.body{ font-size:20px; line-height:1.6; color:var(--ink); max-width:54ch; margin-bottom:14px; }
  .muted{ color:var(--ink-muted); }
  .presenter{ margin-top:40px; padding-top:22px; border-top:1px solid var(--rule); font-size:16px; color:var(--ink-muted); }
  .presenter strong{ color:var(--ink); font-weight:600; }
  .horizon{ display:flex; gap:10px; align-items:flex-end; margin-bottom:30px; height:54px; }
  .horizon span{ width:34px; background:var(--rule); border-radius:3px 3px 0 0; }
  .horizon span:nth-child(1){ height:26%; } .horizon span:nth-child(2){ height:50%; }
  .horizon span:nth-child(3){ height:74%; } .horizon span:nth-child(4){ height:100%; background:var(--accent); }
  .partno{ font-family:'Newsreader',Georgia,serif; font-size:20px; color:var(--accent); margin-bottom:10px; }
  ul.found{ list-style:none; margin-top:10px; }
  ul.found li{ font-size:20px; line-height:1.5; padding:14px 0 14px 22px; border-left:2px solid var(--rule); margin-bottom:12px; max-width:56ch; }
  ul.found li.on{ border-left-color:var(--accent); }
  ul.found li b{ font-family:'Newsreader',Georgia,serif; font-weight:600; color:var(--ink); }
  ul.cred{ list-style:none; font-size:18px; line-height:1.7; color:var(--ink); max-width:52ch; }
  ul.cred li{ padding:6px 0; border-bottom:1px solid var(--rule); }
  .cta-line{ font-size:26px; line-height:1.4; max-width:48ch; margin-bottom:18px; font-family:'Newsreader',Georgia,serif; }
  .disclaimer{ margin-top:44px; font-size:13px; color:var(--ink-muted); max-width:60ch; line-height:1.5; }
  .nav{ position:fixed; bottom:18px; right:26px; font-size:13px; color:var(--ink-muted); display:flex; gap:16px; align-items:center; z-index:10; }
  .nav button{ background:var(--panel); color:var(--ink); border:1px solid var(--rule); border-radius:6px; padding:6px 12px; font-size:14px; cursor:pointer; }
  .nav button:hover{ border-color:var(--accent); }
  .brandmark{ position:fixed; bottom:18px; left:26px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-muted); z-index:10; }
  @media (max-width:760px){ h1{font-size:38px;} h2{font-size:30px;} .lead,.cta-line{font-size:20px;} .slide{padding:7vh 8vw;} }
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandmark">Conscious Leadership</div>
<div class="nav"><span id="counter"></span><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S=[
  {t:'title',
    eyebrow:'A Live Masterclass',
    h1:'Are Your Leaders<br>Wide Awake?',
    sub:'The Four Foundations of Conscious Leadership, and why your best people are leading on autopilot without knowing it.',
    presenter:'With <strong>Laura Prisc</strong> &nbsp;&middot;&nbsp; Conscious Leadership for high-performance organizations'},
  {t:'content', eyebrow:'What this session is', h:'In the next 45 minutes',
    b:['We name why capable leaders get stuck in reaction, and we walk the four shifts that move a leader from autopilot to present, intentional, and awake.',
       'No tactics stacked on top. We start where leadership actually changes, on the inside.']},
  {t:'content', eyebrow:'Who this is for', h:'Accomplished, and quietly stuck',
    b:['You lead a team or an organization. On paper it works. In practice you are managing the same tensions on repeat, carrying too much, and wondering why good people keep hitting the same ceiling.',
       'If that is familiar, you are not short on effort. You are leading on reflex.']},
  {t:'hook', eyebrow:'The reframe',
    lead:'The problem was never that your leaders need more to do. It is that <span class="em">you cannot see outside of you what you fail to see inside.</span>',
    note:'Reactivity is not a skills gap. It is an awareness gap, and awareness is trainable.'},
  {t:'section', no:'Part One', title:'The Autopilot Trap'},
  {t:'content', h:'Most leaders are running on reflex',
    b:['Accomplished, busy, responsible for everyone else. And quietly reacting all day: firefighting, managing symptoms, repeating the same patterns with the same people.',
       'Autopilot feels like productivity. It is actually the thing keeping the team stuck.']},
  {t:'content', h:'More skills will not fix it',
    b:['The usual answer is another framework, another tactic, another communication course stacked on top of a leader who has never looked inward.',
       'Skills sit on the surface. The patterns that stall a team live underneath, in what the leader cannot yet see.']},
  {t:'section', no:'Part Two', title:'The Four Foundations of Conscious Leadership'},
  {t:'foundations', eyebrow:'The framework', h:'Four foundations, in order',
    items:[['Self-Awareness','see your own patterns first'],
           ['Other-Awareness','attune to the people you lead'],
           ['Vision-Focus','lead toward a clear, intentional direction'],
           ['Living and Leading with Intention','close the gap between values and daily action']]},
  {t:'content', h:'One: Self-Awareness',
    b:['You cannot see outside of you what you fail to see inside. The leader\'s own inner work comes first, before any attempt to change the team.',
       'Wide-awake leadership starts here, with honest sight of your own patterns, triggers, and blind spots.']},
  {t:'content', h:'Two: Other-Awareness',
    b:['Reading and attuning to the people you actually lead, not the people you assume you lead.',
       'This is where Making Space for Conversations That Matter lives: real dialogue instead of surface talk, which is what builds trust.']},
  {t:'content', h:'Three: Vision-Focus',
    b:['Leading toward a clear, intentional vision, so the team is pulled forward by direction rather than pushed by pressure.',
       'Awareness without direction is just insight. Vision gives the awareness somewhere to go.']},
  {t:'content', h:'Four: Living and Leading with Intention',
    b:['Closing the gap between the values you name and the way you actually behave on an ordinary Tuesday.',
       'Intention is the daily discipline that turns the first three foundations into how your team experiences you.']},
  {t:'content', h:'The foundations build in order',
    b:['Self-awareness makes other-awareness possible. Other-awareness makes a shared vision real. Vision makes intention specific.',
       'Skip the first and the rest become performance. Start awake and the whole thing holds.']},
  {t:'section', no:'Part Three', title:'What It Looks Like, Wide Awake'},
  {t:'content', h:'A team led by someone who is present',
    b:['Fewer reactive decisions. Harder conversations happen earlier and cleaner. People feel seen, so they bring their real thinking instead of the safe version.',
       'That is not a soft outcome. It is retention, clarity, and momentum that compounds.']},
  {t:'cred', eyebrow:'Why me', h:'Laura Prisc',
    items:['Author of Conscious Leadership: Are Your Leaders Wide Awake?',
           'Gallup-Certified CliftonStrengths Coach since 2014',
           'Certified John Maxwell Team Coach, Trainer and Speaker',
           'Certified LEGO Serious Play Facilitator',
           '25 years developing leaders and teams, including at organizations like Toyota']},
  {t:'content', eyebrow:'In one view', h:'Leading wide awake',
    b:['Self-Awareness, then Other-Awareness, then Vision-Focus, then Living and Leading with Intention. The same four foundations your team already feels the absence of.',
       'The question is not whether your leaders are capable. It is whether they are awake.']},
  {t:'cta', eyebrow:'The conversation',
    line:'If this is the conversation your leadership team needs, let\'s have it.',
    body:'Book a conversation about bringing Conscious Leadership to your organization, and we will map what waking up your leaders would actually look like.',
    disclaimer:'This masterclass is for educational purposes only. No specific result is guaranteed. Results vary based on the individual, the team, and the organization.'}
];

const stage=document.getElementById('stage');
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='slide'+(i===cur?' active':'');
    let html='';
    if(s.t==='title'){
      html=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.h1}</h1><div class="sub">${s.sub}</div><div class="presenter">${s.presenter}</div>`;
    } else if(s.t==='hook'){
      html=`<div class="eyebrow">${s.eyebrow}</div><p class="lead">${s.lead}</p><p class="body muted" style="margin-top:22px;">${s.note}</p>`;
    } else if(s.t==='section'){
      html=`<div class="horizon"><span></span><span></span><span></span><span></span></div><div class="partno">${s.no}</div><h1>${s.title}</h1>`;
    } else if(s.t==='foundations'){
      html=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><ul class="found">`+
        s.items.map((it,ix)=>`<li class="${ix===0?'on':''}"><b>${it[0]}</b>: ${it[1]}</li>`).join('')+`</ul>`;
    } else if(s.t==='cred'){
      html=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><ul class="cred">`+
        s.items.map(x=>`<li>${x}</li>`).join('')+`</ul>`;
    } else if(s.t==='content'){
      html=(s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:'')+`<h2>${s.h}</h2>`+s.b.map(x=>`<p class="body">${x}</p>`).join('');
    } else if(s.t==='cta'){
      html=`<div class="eyebrow">${s.eyebrow}</div><p class="cta-line">${s.line}</p><p class="body">${s.body}</p><p class="disclaimer">${s.disclaimer}</p>`;
    }
    d.innerHTML=html; stage.appendChild(d);
  });
  document.getElementById('counter').textContent=(cur+1)+' / '+S.length;
}
let cur=0;
function go(n){ cur=Math.max(0,Math.min(S.length-1,cur+n)); render(); }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); });
render();
</script>
</body>
</html>
