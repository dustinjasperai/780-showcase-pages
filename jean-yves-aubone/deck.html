<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Empowered Tennis Parent: A Masterclass with Jean-Yves Aubone</title>
<style>
  :root{
    --bg:#f0ece5;        /* harvested dominant cream */
    --panel:#eeeae2;     /* harvested second cream */
    --ink:#1b1a18;       /* harvested near-black */
    --rule:#8b908a;      /* harvested muted sage-grey (hairlines) */
    --accent:#8b908a;    /* accent = harvested sage-grey */
    --muted:#5d5c58;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:4px;
    padding:54px 52px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:.5}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    margin:0 0 20px;font-weight:600}
  h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;line-height:1.08;margin:0}
  h1{font-size:46px;letter-spacing:-.01em}
  h2{font-size:33px;letter-spacing:-.005em}
  .sub{font-size:19px;color:var(--muted);margin:22px 0 0;line-height:1.5;max-width:40em}
  p.body{font-size:19px;line-height:1.6;margin:16px 0 0;max-width:42em}
  .lead{font-family:Georgia,serif;font-size:30px;line-height:1.25;margin:0;max-width:24em}
  ul{margin:20px 0 0;padding:0 0 0 2px;list-style:none;max-width:42em}
  li{font-size:18px;line-height:1.5;margin:0 0 14px;padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:1.5px;background:var(--accent)}
  .pill{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:5px 13px;margin:0 0 20px}
  .section h2{font-size:40px}
  .brandline{position:absolute;bottom:20px;left:52px;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted)}
  .pagen{position:absolute;bottom:20px;right:52px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ledger{border-top:1px solid var(--rule);margin-top:26px;padding-top:14px;display:flex;gap:40px;flex-wrap:wrap}
  .ledger div{font-size:15px;color:var(--muted)}
  .ledger b{display:block;font-family:Georgia,serif;font-size:26px;color:var(--ink);font-weight:600;margin-bottom:2px}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:44em}
  .cta .lead{font-size:34px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   eyebrow:'A live masterclass for tennis parents',
   h1:'The Empowered Tennis Parent',
   sub:'Why your junior’s talent was never the thing holding them back. The three structural decisions that are.',
   brand:'Aubone Tennis'},

  {t:'content',
   pill:'Who this is for',
   h2:'If your child lives on a tennis court, this hour is for you.',
   body:'Parents of competitive junior players, from the first UTR match to the national draws. You are driving to tournaments, paying for lessons, and quietly wondering whether you are doing the right things in the right order.',
   bullets:['You believe your child has real ability','You can feel the journey is bigger than any one lesson','Nobody ever handed you the playbook for the parent’s side of it']},

  {t:'content',
   pill:'The trap',
   h2:'You were sold a simple equation: talent plus hours equals results.',
   body:'So you added more hours. More private lessons, more drilling, more tournaments. And some weeks it looks like progress, and some weeks it looks like guessing. The equation left out the one variable only you control.'},

  {t:'reframe',
   lead:'The gap between your child’s potential and their performance is not talent. It is structure. And the person who owns that structure is not the coach. It is you.'},

  {t:'section', eyebrow:'Part one', h2:'The real problem'},

  {t:'content',
   h2:'Talent is common. Structure is rare.',
   body:'Thousands of genuinely talented kids never reach what they were capable of. Not because the ability was missing, but because the structure around it was. The coach captains the ship for a few hours a week. You own the journey the other hundred.'},

  {t:'content',
   h2:'A busy practice is not a high-performance environment.',
   body:'There is a real difference between passive drilling (feeding balls, grooving strokes) and true competitive preparation that teaches a player to solve a match. Most families cannot yet tell the two apart, so they buy more of the first and wonder why match results stall.'},

  {t:'content',
   h2:'What you say in the car after a loss is part of the training.',
   body:'The parent-child relationship is the hidden variable in every junior career. The same tough loss can build resilience or add pressure, depending entirely on the conversation that follows it. That conversation is a skill, and it can be learned.'},

  {t:'section', eyebrow:'Part two', h2:'The Empowered Tennis Parent framework'},

  {t:'content',
   pill:'Pillar one',
   h2:'Own the journey.',
   body:'The coach captains the ship, but you own it. The first shift is deciding to run your child’s development like the person in charge of it, setting the standards, the environment, and the long view, instead of outsourcing the whole thing and hoping.'},

  {t:'content',
   pill:'Pillar two',
   h2:'Build the environment.',
   body:'Learn to walk into a session and read it: is this competitive preparation, or is it comfortable drilling? Knowing the difference tells you where your money and your hours should actually go, and what to ask of the people around your player.'},

  {t:'content',
   pill:'Pillar three',
   h2:'Protect the relationship.',
   body:'Build the way you communicate after wins and losses so the court never costs you the relationship. This is how resilience is grown. Not by lowering the standard, but by making your child feel safe enough to compete at the top of it.'},

  {t:'content',
   pill:'Pillar four',
   h2:'Coach the player, not just the game.',
   body:'You are not coaching a forehand. You are coaching a person: their personality, the moment, the day, the energy. Reading when your child is ready to hear feedback, asking what they intended before correcting, and knowing when the right move is to say nothing at all.'},

  {t:'section', eyebrow:'Part three', h2:'Turning matches into development'},

  {t:'content',
   h2:'Every match is data, not just a result.',
   body:'The Match Journal method turns a win-or-loss into a development loop: a plan before the match, an honest review after, repeated across up to forty matches. It is an assistant coach on every changeover, and it is how a player learns to compete with a plan instead of a mood.'},

  {t:'content',
   pill:'Ninety days in',
   h2:'A player with a plan. A parent in the chair.',
   body:'A player who walks on court with a plan and comes off it able to say what happened and why. A parent who is calm in the chair, clear on their role, and no longer guessing. The talent was always there. Now it has a structure to show up inside of.'},

  {t:'why',
   pill:'Why listen to me',
   h2:'Jean-Yves Aubone',
   body:'Former ATP Tour player and coach to Reilly Opelka through his climb to World No. 17. USTA Player Development, junior programs at Cherokee Town &amp; Country Club, GPTCA Level-A certified, Florida State Athletics Hall of Fame, and author of The Empowered Tennis Parent.',
   ledger:[['No. 17','player I coached reached'],['40','matches per journal cycle'],['Level-A','GPTCA certification']]},

  {t:'content',
   pill:'An honest filter',
   h2:'Who this is for, and who it is not.',
   bullets:['For: parents who want a role in the journey, not a seat on the sideline','For: families treating tennis as a long-term development project','Not for: anyone looking for a shortcut that skips the work','Not for: parents who want to hand it all off and never look again']},

  {t:'cta',
   eyebrow:'The next step',
   lead:'If you want help building the structure around your junior’s game, start a conversation with Aubone Tennis.',
   body:'Tell me about your player and where you are in the journey, and we will map what the next season should actually look like.',
   disclaimer:'This masterclass is for educational purposes only. Junior development outcomes vary with the player, the effort, and many factors outside any coach’s control. Nothing here is a guarantee of rankings, results, or scholarships.',
   brand:'Aubone Tennis · aubonetennis.com'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t==='section'?'section ':'') + (s.t==='cta'?'cta ':'');
  let h = '';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.pill) h += '<span class="pill">'+s.pill+'</span>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if(s.sub) h += '<p class="sub">'+s.sub+'</p>';
  if(s.body) h += '<p class="body">'+s.body+'</p>';
  if(s.bullets){ h += '<ul>'; s.bullets.forEach(b=>h+='<li>'+b+'</li>'); h += '</ul>'; }
  if(s.ledger){ h += '<div class="ledger">'; s.ledger.forEach(r=>h+='<div><b>'+r[0]+'</b>'+r[1]+'</div>'); h += '</div>'; }
  if(s.disclaimer) h += '<p class="disc">'+s.disclaimer+'</p>';
  if(s.brand) h += '<div class="brandline">'+s.brand+'</div>';
  h += '<div class="pagen">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
