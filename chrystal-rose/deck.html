<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet Your Protectors — A Live Masterclass with Chrystal Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f2ed;        /* her dominant cream */
    --panel:#efe1d8;     /* warm tint of the cream */
    --rule:#d2a6a3;      /* her dusty rose */
    --accent:#9b1f60;    /* her deep berry/magenta */
    --ink:#4a3c3c;       /* deepened mauve-brown */
    --muted:#8a7a76;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Archivo",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 72px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:54px;bottom:26px;width:46px;height:3px;
    background:var(--accent);opacity:.9;border-radius:2px}
  .slide.title,.slide.section,.slide.cta{background:var(--panel)}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin:0 0 18px}
  h1{font-family:"Libre Baskerville",Georgia,serif;font-weight:700;font-size:46px;line-height:1.08;
    margin:0 0 18px;color:var(--ink)}
  h2{font-family:"Libre Baskerville",Georgia,serif;font-weight:700;font-size:33px;line-height:1.14;
    margin:0 0 16px;color:var(--ink)}
  h3{font-family:"Libre Baskerville",Georgia,serif;font-weight:700;font-size:22px;margin:0 0 6px;color:var(--accent)}
  p{font-size:18px;margin:0 0 14px;max-width:62ch}
  p.lead{font-size:21px}
  .promise{font-family:"Libre Baskerville",Georgia,serif;font-style:italic;font-size:22px;color:var(--accent)}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:18px;margin:0 0 12px;padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:50%;
    background:var(--rule)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;margin-top:10px}
  .prot h3{font-size:19px;margin-bottom:2px}
  .prot p{font-size:15.5px;color:var(--muted);margin:0}
  .kicker{color:var(--muted);font-size:15px}
  .byline{font-family:"Libre Baskerville",Georgia,serif;font-size:16px;color:var(--muted);margin-top:22px}
  .rare{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin-top:6px}
  .rare .l{font-family:"Libre Baskerville",Georgia,serif;font-weight:700;color:var(--accent);font-size:20px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;max-width:60ch}
  .page{position:absolute;right:54px;bottom:24px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .cta-note{font-size:17px;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
    eyebrow:'A Live Masterclass for Established Retail Owners',
    h1:'Meet Your Protectors',
    promise:'Why the patterns that built your business are now the ones running it, and how to take back the wheel.',
    byline:'with Chrystal Rose, somatic coach and seven-figure retail owner'},

  {t:'content',
    eyebrow:'Who this is for',
    h2:'You built something real. It just owns you back.',
    body:[
      'You run an established retail business. From the outside it looks like the dream: the revenue, the team, the name people know.',
      'From the inside, you cannot step away for a weekend without the whole thing wobbling. The to-do list never empties. The success is real and so is the exhaustion.'],
    lead:true},

  {t:'content',
    eyebrow:'The trap',
    h2:'You have tried to fix this with more.',
    body:[
      'More systems. More SOPs. Another hire. Another course on delegation.',
      'And it helps for a week, until you quietly take all of it back. Because the thing in the way was never the system. It was the part of you that cannot let go of the system.']},

  {t:'section',
    eyebrow:'The reframe',
    h2:'The way you run your business is the way you have learned to move through the world.',
    body:['Your business did not invent your control, your over-giving, or your need to be the one who holds it all. It inherited them. They are protectors, and they have been with you far longer than your store.']},

  {t:'section', eyebrow:'Part One', h2:'The real problem is not operational. It is somatic.'},

  {t:'content',
    h2:'Your nervous system runs the business you cannot see.',
    body:[
      'Every time you jump in, override a decision, or stay late "just this once," that is not strategy. It is a nervous system doing what kept you safe a long time ago.',
      'You cannot out-system a survival pattern. You can only meet it, and give it a new job.']},

  {t:'content',
    h2:'This is why the hustle never ends.',
    body:[
      'The pattern that got you here does not switch off at a revenue number. It just finds a bigger thing to protect.',
      'So the question is not "what is my next move." It is "which part of me is making the moves."']},

  {t:'section', eyebrow:'Part Two', h2:'Meet Your Protectors',
    body:['Six patterns run most retail owners I work with. You will recognise yours in about four seconds.']},

  {t:'protectors',
    h2:'The six protectors',
    items:[
      ['The Controller','If I hold all of it, nothing can fall. The one who cannot delegate.'],
      ['The Giver','I earn safety by over-serving. The one who says yes until empty.'],
      ['The Achiever','I am worth what I produce. The one who cannot stop.'],
      ['The Avoider','If I do not look, it is not real. The one who buries the hard call.'],
      ['The Performer','Everyone needs to see me handling it. The one who never looks tired.'],
      ['The Critic','Nothing is ever quite good enough. The voice that moves the goalpost.']]},

  {t:'content',
    h2:'Each one is a superpower with a survival strategy attached.',
    body:[
      'The Controller built your standards. The Giver built your loyalty. The Achiever built your growth.',
      'We are not killing them off. We are keeping the gift and retiring the part that runs quietly in the background, costing you your evenings and your presence.']},

  {t:'content',
    eyebrow:'The work',
    h2:'Naming it is the first time it loses its grip.',
    body:[
      'When you can feel the Controller tighten in your chest before you take a task back, you get a choice you did not have a second earlier.',
      'That half-second of choice, repeated, is how an owner finally steps away without the business noticing.']},

  {t:'section', eyebrow:'Part Three', h2:'The path back to the wheel: R.A.R.E.'},

  {t:'rare',
    h2:'Four moves, in order.',
    rows:[
      ['Reconnect','Get back into your body and unhook from the mental loop that has been driving.'],
      ['Align','Decide what you actually want this business and this life to feel like.'],
      ['Renovate','Rewire the emotional patterns under the overwork and the self-sabotage.'],
      ['Expand','Lead from capacity instead of adrenaline, and let the business grow into the space.']]},

  {t:'content',
    eyebrow:'What changes',
    h2:'Ninety days in, here is what shifts.',
    body:[
      'You delegate a decision and do not take it back. You take a real day off and the store is fine.',
      'You make the hard call without three sleepless nights first. The revenue keeps climbing, with less of you white-knuckling it.']},

  {t:'content',
    eyebrow:'Why me',
    h2:'I have run the business and done the work.',
    body:[
      'I built a seven-figure retail business while privately dealing with burnout, anxiety and insomnia. The success was real. So was the cost.',
      'In 2019 I trained in embodiment work expecting a business tool. It changed how I run everything. My store made more with less force, and I got my life back. I teach the exact shift.'],
    byline:'Chrystal Rose, host of The Embodied Baddie Podcast'},

  {t:'content',
    h2:'What we will do together, live.',
    body:[
      'In this live masterclass you will find your lead protector, feel where it lives in your body, and practice the first somatic move that gives you the choice back.',
      'You leave with your protector named and one practice you can use the next time you want to take a task back.']},

  {t:'cta',
    eyebrow:'Your next step',
    h2:'Come do this work with me.',
    body:[
      'If this is landing, the Time of your LIFE Collective is where retail owners do this live, together, over the months it actually takes to make it stick.',
      'Reserve your seat for the live masterclass, and bring the one part of your business you cannot seem to put down.'],
    cta:'Save your seat for the live masterclass',
    disclaimer:'This masterclass is educational. It is not therapy and it is not a guarantee of any financial or personal result. Experiences vary from owner to owner.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='title'?'title':s.t==='section'?'section':s.t==='cta'?'cta':'content');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.promise) h+='<p class="promise">'+s.promise+'</p>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.body) s.body.forEach(p=>h+='<p'+(s.lead?' class="lead"':'')+'>'+p+'</p>');
  if(s.items){
    h+='<div class="grid">';
    s.items.forEach(it=>h+='<div class="prot"><h3>'+it[0]+'</h3><p>'+it[1]+'</p></div>');
    h+='</div>';
  }
  if(s.rows){
    h+='<div class="rare">';
    s.rows.forEach(r=>h+='<div class="l">'+r[0]+'</div><div>'+r[1]+'</div>');
    h+='</div>';
  }
  if(s.cta) h+='<p class="cta-note"><strong>'+s.cta+'</strong></p>';
  if(s.byline) h+='<div class="byline">'+s.byline+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  h+='<div class="page">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
