<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inner-World Operating System — a live masterclass with David McEwen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f8;
    --panel:#ffffff;
    --rule:#d3dde7;
    --ink:#1c2838;
    --accent:#2980b9;
    --sage:#9cb1a9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:40px 24px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 52px;margin:0 0 26px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(28,40,56,.04)}
  .kicker{font-family:"Newsreader",Georgia,serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Newsreader",Georgia,serif;font-weight:700;font-size:44px;line-height:1.1;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"Newsreader",Georgia,serif;font-weight:700;font-size:32px;line-height:1.15;
    margin-bottom:16px}
  .lead{font-size:20px;color:var(--ink)}
  p{font-size:17px;margin-bottom:14px;max-width:62ch}
  p.big{font-size:21px;line-height:1.5}
  .accentbar{width:64px;height:5px;background:var(--accent);border-radius:3px;margin:0 0 24px}
  ul{list-style:none;margin:8px 0 4px}
  li{position:relative;padding-left:30px;font-size:17px;margin-bottom:12px;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:3px;
    background:var(--accent)}
  .frame{border-left:4px solid var(--sage);padding:6px 0 6px 20px;margin:10px 0 6px;color:var(--ink)}
  .num{font-family:"Newsreader",Georgia,serif;font-weight:700;font-size:15px;color:var(--sage);
    letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  .foot{font-size:13px;color:#5a6b7a;margin-top:22px;max-width:70ch}
  .title-slide{background:var(--ink);color:#fff;border-color:var(--ink)}
  .title-slide .kicker{color:var(--sage)}
  .title-slide h1{color:#fff}
  .title-slide .lead{color:#dfe7ee}
  .cta-slide{border:2px solid var(--accent)}
  .cta-slide h2{color:var(--accent)}
  .seat{font-size:13px;color:#5a6b7a;margin-top:6px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with David McEwen', title:'The Inner-World Operating System',
   lead:'Why your income grows when you stop pushing harder, and start running the system underneath the results.'},

  {t:'who', kicker:'Who this is for', title:'The entrepreneur who is already working hard',
   body:['You have built something real. You show up, you grind, you push. And still, growth feels capped, like there is a ceiling you keep bumping into no matter how many more hours you throw at it.',
         'This hour is for the founder who senses the next level is not another tactic. It is something underneath the tactics.']},

  {t:'trap', kicker:'The trap', title:'More effort is the wrong lever',
   body:['Most of us were taught one equation: more hustle equals more results. So when results stall, we reach for the only lever we know and push harder.',
         'The push works for a while. Then it stops working, and burnout arrives right where breakthrough was supposed to be.']},

  {t:'reframe', kicker:'The reframe', title:'Your outer results are capped by your inner system',
   body:['Here is the shift this masterclass is built on. Your outer world, the income, the clients, the freedom, is an output. The inner world is the operating system producing it.',
         'When you put more focus on the inner-world systems, the outer-world results move 5 to 10 times more than grinding ever moved them.']},

  {t:'part1', kicker:'Part one', title:'Why the hustle ceiling is real',
   body:['A business cannot outperform the beliefs, goals and focus of the person running it for very long. You can force a quarter. You cannot force a decade.',
         'The ceiling you keep hitting is not in the market. It is in the system that sets your goals, tracks your progress and decides what you believe is possible.']},

  {t:'part1b', kicker:'Part one', title:'Visiting transformation vs living from it',
   body:['Most people visit transformation. A good seminar, a motivated Monday, a burst of clarity, and then back to the old pattern by Thursday.',
         'Lasting change means living FROM the new place instead of visiting it. That is a systems problem, not a willpower problem, and systems can be taught.']},

  {t:'part2', kicker:'Part two', title:'The three inner-world systems',
   body:['Inside MaxIt, the inner world is not left vague. It is broken into three practical systems you run on repeat. Over the next few slides, here is what each one does.']},

  {t:'framework', num:'System one', title:'The Quantum Goals Setting System',
   body:['Before a single live call, we reset how you set goals. Most goals fail because they were the wrong goals, set the old way.',
         'This system uses proven, natural principles to make sure you are aiming at the right goals, with the structure in place to actually reach them, not just name them.']},

  {t:'framework', num:'System two', title:'The Month to MaxIt Tracking System',
   body:['A goal you do not track quietly dies. This is the measurement layer that keeps the inner work compounding week over week.',
         'It applies one very powerful universal law so that what you are working toward starts to materialize as quickly as possible, instead of staying a someday wish.']},

  {t:'framework', num:'System three', title:'The Advanced Manifestation Principles',
   body:['This is the heart of it: how manifestation actually works, taught as a practice rather than a mood.',
         'Paired with a system that holds your hand to apply the principles practically, so the inner shifts show up as real results in your business, not just better feelings.']},

  {t:'how', kicker:'How they fit together', title:'Set it, track it, apply it',
   body:['The three systems are a loop, not a list.'],
   points:['Quantum Goals points you at the right target.',
           'The Month to MaxIt tracking keeps the target materializing on a cadence.',
           'The Advanced Manifestation practice is the engine that moves it.']},

  {t:'part3', kicker:'Part three', title:'What 90 days can look like',
   body:['Run the loop for a quarter and the change is not a mood, it is a pattern. Clearer goals, a tracked path, and an inner state that stops fighting the outcome you want.',
         'This is the difference between a motivated month and a reordered year.']},

  {t:'shift', kicker:'The real outcome', title:'Freedom is the by-product',
   body:['Clients come for income. What they describe afterward is broader: more clarity, steadier relationships, and the time and location freedom that a corporate path rarely gives.',
         'The income grows because the operator changed, not because they finally found a harder way to push.']},

  {t:'objection', kicker:'The honest objection', title:'Is this just woo?',
   body:['Fair question. The reason manifestation gets dismissed is that it is usually taught as a vibe with no structure behind it.',
         'The whole point here is structure: named systems, a tracking cadence, and a practice you can repeat. The inner world, made orderly.']},

  {t:'whyme', kicker:'Why David', title:'A systems person who went inward',
   body:['I came to this work from the outside world of emergency response, where systems under pressure are everything. I found a formula for the inner world that had been passed down quietly for a long time.',
         'Heart Path exists to make that formula a system anyone serious can run, so transformation becomes something you live from instead of visit.']},

  {t:'firststep', kicker:'Your first move', title:'Start with the right goal',
   body:['You do not need a new burst of motivation. You need to aim at the right goal and build the structure to reach it.',
         'That is exactly where the Quantum Goals Setting System starts, and it is the first thing we do together.']},

  {t:'recap', kicker:'Recap', title:'The operating system, in one screen',
   points:['The inner world drives the outer world, so focus there first.',
           'Quantum Goals: aim at the right target, the right way.',
           'Month to MaxIt: track it so it materializes on a cadence.',
           'Advanced Manifestation: the applied practice that moves it.']},

  {t:'invite', kicker:'Where this goes', title:'If this resonated',
   body:['MaxIt is the 90-day live program where we install all three systems together: five modules, weekly live coaching calls, and a community running the same loop beside you.',
         'It is built for the entrepreneur ready to work the inner system, not just push the outer one harder.']},

  {t:'cta', kicker:'Your next step', title:'Apply to MaxIt',
   body:['If you want to run this operating system with me, apply for MaxIt and book a short fit conversation. We will look at where your inner system is capping your outer results, and whether the program is a fit.'],
   note:'No specific income or financial result is guaranteed. Results vary and depend on your own effort, situation and the work you put in. This masterclass is educational and is not financial advice.',
   seat:'David McEwen, Heart Path, heartpath.co'},
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta-slide':'');
  let h = '';
  if (s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if (s.num) h += '<div class="num">'+s.num+'</div>';
  if (s.title){
    h += (s.t==='title') ? '<h1>'+s.title+'</h1>' : '<h2>'+s.title+'</h2>';
  }
  if (s.t!=='title') h += '<div class="accentbar"></div>';
  if (s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if (s.body) for (const p of s.body) h += '<p class="big">'+p+'</p>';
  if (s.points){ h += '<ul>'; for (const p of s.points) h += '<li>'+p+'</li>'; h += '</ul>'; }
  if (s.note) h += '<p class="foot">'+s.note+'</p>';
  if (s.seat) h += '<p class="seat">'+s.seat+'</p>';
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
