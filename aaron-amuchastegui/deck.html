<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Investor's Edge for Agents — a live masterclass with Aaron Amuchastegui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1522; --panel:#16202e; --rule:#27344a; --ink:#eef2f8; --mut:#9fb0c4;
    --accent:#1f86f4; --gold:#f4b63f; --head:'Sora',sans-serif; --body:'Roboto',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#070b12;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:60px 64px;margin:22px 0;min-height:560px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden}
  .slide::before{content:"";position:absolute;inset:0;
    background:radial-gradient(900px 420px at 88% -8%, rgba(31,134,244,.16), transparent 60%);pointer-events:none}
  .slide > *{position:relative;z-index:1}
  .kick{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-.01em}
  .big{font-family:var(--head);font-weight:800;font-size:60px;line-height:1.02;letter-spacing:-.02em}
  p{font-size:20px;line-height:1.55;color:var(--mut);margin-top:18px;max-width:40ch}
  p.lead{color:var(--ink);font-size:23px;max-width:46ch}
  .a{color:var(--accent)} .g{color:var(--gold)}
  .num{font-family:var(--head);font-weight:800;color:var(--accent);font-size:18px}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
  li{display:flex;gap:16px;align-items:flex-start;font-size:20px;line-height:1.45}
  li .mk{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--panel);
    border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;
    font-family:var(--head);font-weight:700;color:var(--accent);font-size:14px;margin-top:2px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
  .tile{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:24px}
  .tile .t{font-family:var(--head);font-weight:700;font-size:24px}
  .tile .s{color:var(--mut);font-size:15px;margin-top:8px}
  .tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .foot{position:absolute;left:64px;bottom:26px;font-size:12.5px;color:#64768c;
    font-family:var(--head);letter-spacing:.08em;text-transform:uppercase;z-index:1}
  .pg{position:absolute;right:28px;bottom:24px;color:#4a5a70;font-size:12px;font-family:var(--head)}
  .disc{font-size:14px;color:#7e8ea2;max-width:62ch;margin-top:22px;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:28px;background:var(--accent);color:#061020;
    font-family:var(--head);font-weight:700;font-size:19px;padding:15px 26px;border-radius:12px;text-decoration:none}
  @media(max-width:720px){.slide{padding:40px 28px;min-height:460px}h1,.big{font-size:38px}h2{font-size:28px}.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'cover', kick:'A live masterclass with Aaron Amuchastegui',
    title:'The Investor’s Edge for Agents',
    lead:'How top agents turn commissions into lasting wealth, instead of chasing the next deal forever.'},

  {t:'point', kick:'Who this is for', title:'You close deals. But does the money stay?',
    lead:'This is for the agent who has a good year, pays taxes, buys the nicer car, and starts the next year back at zero. The treadmill is real, and almost nobody teaches the way off it.'},

  {t:'reframe', kick:'The hard truth', ghost:'More leads.',
    big:'The gap isn’t leads. It’s <span class="a">wealth</span>.',
    lead:'Your feed is full of coaches selling you more leads and more listings. Volume is not the problem. What happens to the money after the closing is the problem.'},

  {t:'section', num:'Part One', title:'Why a commission business quietly keeps you poor'},

  {t:'point', kick:'The core problem', title:'Income is not wealth.',
    lead:'A commission is income: it shows up, and it leaves. Wealth is what you own that pays you whether or not you sell a house this month. Most agents build income their whole career and never build the second thing.'},

  {t:'list', kick:'The pattern', title:'The three traps',
    items:[
      ['1','The feast-and-famine year: a huge month, then three slow ones, and the savings are gone.'],
      ['2','The identity trap: you are only as good as this quarter’s production, so you can never stop.'],
      ['3','No exit: there is no version of the business that runs, or pays, without you showing up to sell.']
    ]},

  {t:'section', num:'Part Two', title:'The investor’s playbook, in three moves'},

  {t:'tiles', kick:'The framework', title:'Close. Reinvest. Compound.',
    tiles:[
      ['Close','Earn the commission, the skill you already have.',false],
      ['Reinvest','Route a fixed share of every check into an asset.',false],
      ['Compound','Let the assets pay you, then buy the next one.',true]
    ],
    lead:'This is the same sequence behind a portfolio of 1,000+ homes and 250 rentals. It is boring on purpose. Boring is what compounds.'},

  {t:'point', kick:'Move one', title:'Close, with intent',
    lead:'You are already good at earning. The shift is deciding, before the check clears, exactly what share of it is not yours to spend. The number is small enough to be painless and consistent enough to matter.'},

  {t:'point', kick:'Move two', title:'Reinvest into something that pays rent',
    lead:'An agent sees more deals than any investor alive. The edge is using that deal flow for yourself, turning one of the houses you would have simply sold into one you hold. You already have the access. Most agents never use it on their own behalf.'},

  {t:'point', kick:'Move three', title:'Compound, and let the portfolio carry you',
    lead:'Rents pay down the debt. Equity grows while you sleep. Within a few cycles the portfolio, not the next closing, becomes the thing that funds your life. That is the day the treadmill stops.'},

  {t:'point', kick:'The lens', title:'Think like an investor, not just a closer',
    lead:'An investor asks a different question at every deal: not only "can I sell this" but "would I want to own this." That one question, asked for a few years, is the entire difference between a big income and real wealth.'},

  {t:'point', kick:'The unfair advantage', title:'You already have the thing investors pay for',
    lead:'Deal flow, local knowledge, and relationships. Outside investors spend fortunes to get what crosses your desk for free. The playbook is just pointing that advantage at your own balance sheet.'},

  {t:'section', num:'Part Three', title:'The year the treadmill stops'},

  {t:'point', kick:'A few years in', title:'The quiet version of success',
    lead:'You still list and sell, because you are good at it and you enjoy it. But a growing share of your income now arrives whether or not you work. You take the slow month off instead of panicking through it.'},

  {t:'story', kick:'Why me', title:'From a prison cell to 1,000+ homes',
    lead:'I made a serious mistake young and spent time in federal prison. That failure, not some natural talent, is where this started. I came out and learned to buy foreclosures on the courthouse steps, bought and sold more than a thousand homes, and today manage funds holding 250 single family rentals. I host the Real Estate Rockstars podcast because I get to ask the best agents in the country what is actually working. This is the pattern underneath almost all of them.'},

  {t:'point', kick:'The community', title:'It is not a conference. It is a community.',
    lead:'The agents who make this shift almost never do it alone. They do it in a room of people with different skillsets, trading what is working right now. That room is the Real Estate Rockstars Mastermind, and it is where this playbook goes from idea to your actual balance sheet.'},

  {t:'list', kick:'Recap', title:'Three moves, that is the whole game',
    items:[
      ['C','Close with intent. Decide what is not yours to spend before it arrives.'],
      ['R','Reinvest your own deal flow into an asset that pays rent.'],
      ['K','Compound, until the portfolio, not the next deal, funds your life.']
    ]},

  {t:'cta', kick:'Your next step', title:'Come build the playbook with us',
    lead:'Join the Real Estate Rockstars Mastermind and turn the next good year into the first year that actually stays.',
    btn:'Join the Real Estate Rockstars Mastermind',
    disc:'This masterclass is educational. Nothing here is a promise or guarantee of income, returns, or results, and no specific outcome is guaranteed. Real estate and investing carry risk. Results vary and depend on your own effort, market, and decisions.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if(s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if(s.t==='cover'){ inner += `<h1>${s.title}</h1>`; if(s.lead) inner += `<p class="lead">${s.lead}</p>`; }
  else if(s.t==='section'){ if(s.num) inner += `<div class="num">${s.num}</div>`; inner += `<h1>${s.title}</h1>`; }
  else if(s.t==='reframe'){ if(s.ghost) inner += `<p class="lead" style="text-decoration:line-through;opacity:.5;max-width:20ch">${s.ghost}</p>`; inner += `<div class="big">${s.big}</div>`; if(s.lead) inner += `<p class="lead">${s.lead}</p>`; }
  else if(s.t==='tiles'){ inner += `<h2>${s.title}</h2><div class="tiles">`+s.tiles.map(t=>`<div class="tile ${t[2]?'on':''}"><div class="t">${t[0]}</div><div class="s">${t[1]}</div></div>`).join('')+`</div>`; if(s.lead) inner += `<p class="lead">${s.lead}</p>`; }
  else if(s.t==='list'||s.t==='story'){ inner += `<h2>${s.title}</h2>`; if(s.lead) inner += `<p class="lead">${s.lead}</p>`; if(s.items) inner += `<ul>`+s.items.map(it=>`<li><span class="mk">${it[0]}</span><span>${it[1]}</span></li>`).join('')+`</ul>`; }
  else if(s.t==='cta'){ inner += `<h1>${s.title}</h1>`; if(s.lead) inner += `<p class="lead">${s.lead}</p>`; if(s.btn) inner += `<a class="cta-btn" href="https://realestaterockstarsmastermind.com">${s.btn}</a>`; if(s.disc) inner += `<div class="disc">${s.disc}</div>`; }
  else { inner += `<h2>${s.title}</h2>`; if(s.lead) inner += `<p class="lead">${s.lead}</p>`; }
  inner += `<div class="foot">Real Estate Rockstars</div><div class="pg">${i+1} / ${S.length}</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
