<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Evidence-Based Lead Generation System · Daryl Urbanski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;500;600&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f9fb; --panel:#eaf0f5; --rule:#d7e1ea;
    --acc:#ed751c; --ink:#072f47; --body:#3f4a57; --dim:#8a97a3;
    --blue:#008fff; --cream:#f4f8fb; --navy:#061f30;
  }
  html,body{height:100%}
  body{background:#e6edf3;font-family:'Mulish',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e6edf3}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Mulish',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Literata',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.16;letter-spacing:.002em}
  .t-title h1{font-size:4.9vw;max-width:94%}
  .t-normal h1{font-size:3.2vw;max-width:90%}
  .t-normal .body{font-family:'Mulish',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Literata',serif;font-size:1.9vw;color:var(--acc);margin-top:3.6vh;max-width:84%;line-height:1.44;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Mulish',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),var(--blue) 60%,transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#0c3550 0%,#061f30 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#0c3550 0%,#061f30 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Mulish',sans-serif;color:#cfe0ec;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mo{position:absolute;pointer-events:none}
  .title-mo{right:7.2%;bottom:8.5%;width:21vw;opacity:.95}
  .corner-mo{right:6.5%;bottom:8%;width:10vw;opacity:.5}
  .brandline{font-family:'Mulish',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.04em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(7,47,71,.08);z-index:20}
  .hud > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--blue));width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.5vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:6.9vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Best Business Podcast</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: scattered data points resolving into a fitted, rising trend line (a system derived from evidence) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 140 90">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="74" x2="132" y2="74" stroke="#008fff" stroke-width="1.6" opacity="0.55"/>
    <line x1="12" y1="12" x2="12" y2="74" stroke="#008fff" stroke-width="1.6" opacity="0.4"/>
    <g fill="#072f47" opacity="0.45">
      <circle cx="26" cy="62" r="2.4"/><circle cx="42" cy="56" r="2.4"/><circle cx="52" cy="60" r="2.4"/>
      <circle cx="66" cy="46" r="2.4"/><circle cx="80" cy="42" r="2.4"/><circle cx="92" cy="34" r="2.4"/>
      <circle cx="104" cy="30" r="2.4"/><circle cx="120" cy="22" r="2.4"/>
    </g>
    <path d="M22 64 L124 22" stroke="#ed751c" stroke-width="2.6" opacity="0.95"/>
    <circle cx="124" cy="22" r="4" fill="#ed751c" stroke="none" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Evidence-Based Lead Generation System',sub:'How founders get better leads with less effort by choosing their lead-gen from data, not fashion, then converting and keeping more of what they win.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You can deliver. A predictable flow of the right leads is the part no one handed you a system for.',body:'You run a real business and you are good at the work. But the flow of new leads rises and falls, referrals are unpredictable, and every few months the pipeline feels like it is starting from zero. You have tried channels because someone said they worked, not because you had proof they would work for you.'},
 {t:'dark',title:'A good month of referrals is not the same as a lead engine you can count on next quarter.'},

 {t:'section',idx:'Part One',title:'Why Guessing at Lead Generation Keeps You Stuck'},
 {t:'normal',k:'Fashion, not evidence',title:'Most lead-gen advice is a trend, and trends age out fast.',body:'Every year a new channel gets loud, and owners pour time and money into it because it is what everyone is doing. The tactic that fits one business quietly fails in another, and by the time you can feel it working or not, the budget is spent. Chasing the fashionable channel is how good businesses stay busy and still run short on leads.'},
 {t:'normal',k:'The numbers gap',title:'When you do not know your own numbers, every channel looks equally risky.',body:'Without a clear read on what a lead is worth, how many you need, and where the good ones already come from, you cannot tell a real opportunity from an expensive distraction. So the decision defaults to guesswork or to whoever is selling the loudest, and the same money buys a fraction of the result it should.'},
 {t:'dark',title:'You do not have a lead problem. You have an evidence problem.'},

 {t:'section',idx:'Part Two',title:'The System, Built From the Research'},
 {t:'normal',k:'Pick the method from evidence',title:'The best lead-gen method for your business is usually not the one you assume.',body:'This is the heart of Ancient Secrets of Lead Generation: choose the channel from evidence about what already works for this exact audience, not from what is popular. When the method is chosen on proof, the same effort returns far more, because you stop paying to learn what a little research would have told you first.'},
 {t:'normal',k:'Know your market cold',title:'Understand the buyer and the market until the offer becomes obvious.',body:'Two of the eight critical success factors are Marketing Strategy and Market Intelligence, and they come before spend for a reason. When you know who you serve, what they already want, and the words they use for it, the message writes itself and the right leads recognize themselves in it. Most weak results are an intelligence gap wearing a channel costume.'},
 {t:'normal',k:'Convert on purpose',title:'A lead is only worth what your process does with it.',body:'The middle layer of the growth system is lead generation and conversion, paired with real sales skill. Attention is easy to waste, so you build a repeatable path from first contact to booked call to customer, and you watch where it leaks. Doubling conversion is almost always cheaper and faster than doubling traffic.'},
 {t:'normal',k:'Grow the value you already won',title:'The cheapest growth is the customer you already have.',body:'The last layer is retention and lifetime value. Using RFM, you sort customers by how recently and how often they buy and how much they spend, then you serve the best ones deliberately. Lifting repeat revenue compounds quietly under everything else, and it is the part most owners ignore while they chase the next cold lead.'},
 {t:'dark',title:'More leads is not the goal. A system that reliably turns strangers into customers is.'},

 {t:'section',idx:'Part Three',title:'What Changes When Lead Gen Is a System'},
 {t:'normal',k:'The business this builds',title:'A predictable pipeline, clients you chose, and decisions you can defend with data.',body:'When lead generation runs on evidence instead of hope, you can forecast the quarter instead of bracing for it. You spend on what the numbers earn, you attract the buyers you actually want, and marketing stops feeling like a gamble and starts feeling like a lever you can pull on purpose.'},
 {t:'dark',title:'The goal was never louder marketing. It was marketing that pays.'},
 {t:'normal',k:'Why Daryl Urbanski',title:'A system built from $50,000 in research, 400+ founder interviews, and proven in the field.',body:'Daryl spent more than $50,000 and interviewed 400+ operators to identify the eight critical success factors behind seven-figure businesses. He then ran the playbook himself: as a marketing director he built the single strategy that generated $1.6 million for one company in months. The Best Business Podcast and his coaching are where he teaches founders to do the same. This class is that method.'},

 {t:'section',idx:'Your Next Step',title:'Build Your Lead Engine'},
 {t:'normal',k:'Keep going with Daryl',title:'From one reliable channel to a full system for leads, conversion and lifetime value.',body:'Daryl works with founders through The Best Business Podcast, the 8 Critical Success Factors, and his mastermind and coaching: the frameworks, the accountability, and a room of operators building the same way. Start with the podcast, and book a free consultation when you are ready to build the whole engine.'},
 {t:'cta',title:'Ready to build a lead system you can count on?',body:'Take the next step with Daryl Urbanski and The Best Business Podcast.',chips:['Listen to the Best Business Podcast','Book a free consultation'],disc:'Educational content for founders and business owners. No income or business result is guaranteed. Any figures describe past outcomes and are not a promise of your results, which vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Best Business <b>Podcast</b> · Daryl Urbanski</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='title') h+=mo('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
