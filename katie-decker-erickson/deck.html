<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Business Health Diagnostic Masterclass &middot; Success by Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#12211f; --panel:#0b1615; --rule:#2c3f3c;
    --ink:#ece6dd; --coral:#df4357; --teal:#458487; --dim:#9aa6a2;
  }
  html,body{height:100%}
  body{background:#080f0e;font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080f0e}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
    display:flex;flex-direction:column;justify-content:center;padding:9.5% 12% 8% 12%}
  .slide.active{opacity:1;visibility:visible}
  .hairline{position:absolute;left:12%;right:12%;top:7.2%;height:1px;background:var(--rule)}
  .runhead{position:absolute;left:12%;top:4.4%;font-size:.86vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .runfoot{position:absolute;right:12%;top:4.4%;font-size:.86vw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--coral)}
  .kicker{font-size:.98vw;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);margin-bottom:2.4vh}
  h1{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.24;letter-spacing:-.004em}
  .t-title h1{font-size:3.9vw;max-width:92%}
  .t-normal h1{font-size:2.5vw;max-width:86%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.32vw;color:#c7cec9;margin-top:2.8vh;max-width:80%;line-height:1.68;font-weight:300}
  .sub{font-family:'Montserrat',sans-serif;font-size:1.5vw;color:#c7cec9;margin-top:3.2vh;max-width:78%;line-height:1.56;font-weight:300}
  .t-section{background:var(--panel);justify-content:center}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1vw;font-weight:600;color:var(--teal);margin-bottom:2.2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:3.4vw;max-width:88%;font-style:italic}
  .t-section .bar{width:9vw;height:3px;background:var(--coral);margin-top:3.6vh}
  .t-section .hairline{background:rgba(255,255,255,.1)}
  .t-section .runhead{color:#8b968f}.t-section .runfoot{color:#e58a97}
  .t-dark{background:var(--panel);align-items:flex-start}
  .t-dark h1{font-size:2.85vw;max-width:86%;color:#f5f3ee}
  .t-dark .hairline{background:rgba(255,255,255,.12)}
  .t-dark .runhead{color:#8b968f}.t-dark .runfoot{color:#e58a97}
  .t-dark .attr{font-family:'Montserrat',sans-serif;font-size:1.05vw;color:#b7bfba;margin-top:3vh;letter-spacing:.02em;font-style:italic}
  .t-cta{background:var(--panel)}
  .t-cta h1{font-size:3.2vw;max-width:86%;color:#f5f3ee}
  .t-cta .hairline{background:rgba(255,255,255,.12)}
  .t-cta .runhead{color:#8b968f}.t-cta .runfoot{color:#e58a97}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap}
  .chip{border:1px solid rgba(255,255,255,.35);color:#eef0ec;padding:1.2vh 1.5vw;font-size:1.1vw;font-weight:500;font-family:'Montserrat',sans-serif}
  .disc{position:absolute;left:12%;right:12%;bottom:4vh;font-size:.8vw;color:#93a09a;line-height:1.5;max-width:76%;font-family:'Montserrat',sans-serif}
  .t-normal .disc,.t-title .disc{color:var(--dim)}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.12vw;color:#c7cec9;margin-top:3.6vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--coral);font-weight:600}
  .motif{position:absolute;pointer-events:none;opacity:.9}
  .motif-title{right:8%;bottom:8%;width:22vw}
  .motif-corner{right:9%;bottom:7%;width:9vw;opacity:.5}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--coral);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:13px;right:18px;font-size:12px;letter-spacing:.14em;color:#7c8681;z-index:20;font-weight:500;font-family:'Montserrat',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7c8681;z-index:20;font-weight:600;font-family:'Montserrat',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#7c8681;z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Montserrat',sans-serif}
  @media(max-width:640px){
    .slide{padding:13% 8% 11% 8%}.hairline{left:8%;right:8%}.runhead{left:8%}.runfoot{right:8%}
    .kicker{font-size:2.4vw}.runhead,.runfoot{font-size:2vw}
    .t-title h1{font-size:7vw}.t-normal h1{font-size:4.8vw}.t-normal .body{font-size:2.9vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.5vw}.disc{left:8%;right:8%;font-size:1.9vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Success by Design</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- the pulse line: finding the one constraint, plus a paint-swatch nod to color consulting -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="pulse" viewBox="0 0 260 90">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 46 H54 L70 18 L88 74 L104 46 H150" stroke="#df4357" opacity="0.85"/>
    <circle cx="150" cy="46" r="6" fill="#df4357" stroke="none"/>
    <path d="M150 46 H196" stroke="#458487" opacity="0.7"/>
  </g>
  <g opacity="0.55">
    <rect x="200" y="16" width="20" height="20" rx="3" fill="#458487"/>
    <rect x="218" y="30" width="20" height="20" rx="3" fill="#458487" opacity="0.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',rh:'Success by Design',rf:'Masterclass',title:'The Business Health Diagnostic Masterclass',sub:'How to find the one constraint that is actually holding your design firm back, before you spend another dollar guessing at the fix.',brand:true,motif:'title'},
 {t:'normal',rh:'Start here',rf:'01',k:'Who this is for',title:'You have tried the obvious fixes. The firm still feels stuck.',body:'New pricing. A new hire. More posting. Each one helps for a month, then the same ceiling shows back up. That is usually a sign the fix landed on a symptom, not the actual constraint underneath it.'},
 {t:'dark',rh:'Reframe',rf:'02',title:'Advice assumes you already know what is wrong. A diagnosis finds out.',attr:'Katie Decker-Erickson'},

 {t:'section',rh:'Part one',rf:'03',idx:'Part one',title:'The Trap: Treating Symptoms, Not the Problem'},
 {t:'normal',rh:'Part one',rf:'04',k:'The obvious fixes',title:'Raise your prices. Hire faster. Post more. None of it moves the needle.',body:'Every one of those is a reasonable move in isolation. None of them is aimed at anything specific. Without knowing the real constraint first, a firm just cycles through tactics and calls it strategy.'},
 {t:'normal',rh:'Part one',rf:'05',k:'Why the obvious fixes stall',title:'A tactic aimed at the wrong constraint just wastes a quarter.',body:'A firm that is actually capacity-constrained does not get fixed by a marketing push. A firm that is actually process-constrained does not get fixed by a new hire. The fix has to match the real bottleneck, not the loudest symptom.'},
 {t:'normal',rh:'Part one',rf:'06',k:'The Lonely Work',title:'Most firms skip the unglamorous prep, then wonder why scaling breaks.',body:'Choosing the right software. Building a real onboarding sequence. Writing contracts that hold up. Establishing vendor relationships. Getting the marketing message right. It is not exciting work, but skipping it is exactly why scaling feels like chaos later.'},
 {t:'dark',rh:'Reframe',rf:'07',title:'Take care of the lonely work first, and your clients and leads start driving the scaling. Not you.'},

 {t:'section',rh:'Part two',rf:'08',idx:'Part two',title:'The Business Health Diagnostic'},
 {t:'normal',rh:'Part two',rf:'09',k:'One, Understand',title:'Before any advice, get the real picture.',body:'The business, the goals, and the challenges actually in front of it right now, not a generic intake form. A diagnosis that skips this step is just advice wearing a different outfit.'},
 {t:'normal',rh:'Part two',rf:'10',k:'Two, Diagnose',title:'Find the one constraint actually holding growth back.',body:'Not a list of ten things to fix. The one that is actually load-bearing, the thing that, once addressed, makes half the other symptoms quiet down on their own.'},
 {t:'normal',rh:'Part two',rf:'11',k:'Three, Prescribe',title:'Leave with a Business Health Prescription, not generic advice.',body:'The biggest opportunity, the immediate next steps, and the long-term recommendations, all specific to the diagnosis, not a template handed to every firm regardless of where it actually stands.'},
 {t:'normal',rh:'Part two',rf:'12',k:'The Power of Process',title:'Process runs in the background so creativity does not have to fight for room.',body:'A good process works correctly about 80% of the time. The other 20% is exactly where a firm owner earns their keep. Agility is one of the real gifts of running your own firm, once the background process frees up the bandwidth to use it.'},
 {t:'dark',rh:'Reframe',rf:'13',title:'A system that only works 80% of the time is not broken. That is exactly the room your judgment is supposed to fill.'},

 {t:'section',rh:'Part three',rf:'14',idx:'Part three',title:'What Changes Once You Know the Real Constraint'},
 {t:'normal',rh:'Part three',rf:'15',k:'Why listen to her',title:'She still runs the firm she is diagnosing from.',body:'Katie Decker-Erickson founded Color Works in 2007 and built it into a fully remote, multimillion-dollar design firm serving clients across 20+ states. She holds an MBA, has 18-20 years of teaching experience at the graduate and undergraduate level, and serves as a 2025 IDS Designer of the Year Awards judge.'},
 {t:'normal',rh:'Part three',rf:'16',k:'What the prescription gives you',title:'A clear next step, not a stack of tactics to sort through alone.',body:'A plan sized to where the firm actually stands today, not a one-size playbook. That is the difference between a diagnosis and advice: one is built around your firm specifically, the other is built to apply to everyone and therefore fits no one exactly.'},
 {t:'dark',rh:'Reframe',rf:'17',title:'The firm that runs on a diagnosis outgrows the firm that is still guessing.'},

 {t:'section',rh:'Next',rf:'18',idx:'Your next step',title:'Find the Real Constraint in Your Firm'},
 {t:'cta',rh:'Next',rf:'19',title:'Ready to find out what is actually holding your firm back?',chips:['Success by Design','1:1 Coaching','Book a Business Health Diagnostic Call'],disc:'Educational content for interior design firm owners. Nothing here is a guarantee of income, revenue, growth or business results. Results vary by firm, market and effort.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'motif-title':'motif-corner'}" viewBox="0 0 260 90"><use href="#pulse"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h=`<div class="runhead">${s.rh||''}</div><div class="runfoot">${s.rf||''}</div><div class="hairline"></div>`;
  if(s.t==='section'){ h+=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="bar"></div>`; }
  else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.attr) h+=`<div class="attr">${s.attr}</div>`;
    if(s.brand) h+=`<div class="brandline">Success by <b>Design</b> &middot; Katie Decker-Erickson</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  else if(s.t==='section') h+=motif('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
