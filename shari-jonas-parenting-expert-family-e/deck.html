<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The LAUNCH Method, a live masterclass with Shari Jonas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1e2a; --panel:#14283a; --rule:#223548;
    --accent:#5a9aa8; --ink:#eef3f5; --muted:#9fb4bd;
    --head:'Montserrat',system-ui,sans-serif; --body:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 44px;margin:0 0 20px;min-height:360px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .eyebrow{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:14px}
  h1{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.08;margin-bottom:16px}
  h2{font-family:var(--head);font-weight:700;font-size:28px;line-height:1.14;margin-bottom:14px}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin-bottom:12px;max-width:60ch}
  p.sub{color:var(--muted)}
  ul{margin:8px 0 0 20px} li{font-size:18px;line-height:1.5;margin-bottom:10px}
  .big{font-size:52px;font-family:var(--head);font-weight:800;line-height:1.05}
  .rule{height:3px;width:68px;background:var(--accent);border-radius:3px;margin:6px 0 20px}
  .road{display:flex;align-items:center;gap:0;margin-top:22px;flex-wrap:wrap}
  .road .node{flex:1;min-width:120px;text-align:center;position:relative;padding:0 6px}
  .road .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);margin:0 auto 10px;
    box-shadow:0 0 0 4px rgba(90,154,168,.18)}
  .road .lbl{font-family:var(--head);font-weight:700;font-size:14px;color:var(--ink)}
  .road .line{height:2px;background:var(--rule);flex:0 0 100%;order:-1;margin-bottom:-18px}
  .num{font-family:var(--head);font-weight:800;color:var(--accent);font-size:15px;margin-bottom:8px}
  .foot{position:absolute;right:20px;bottom:14px;font-family:var(--head);font-size:11px;
    letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .cta p{font-size:21px}
  .disc{font-size:14px;color:var(--muted);max-width:66ch;margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Shari Jonas', h:'The LAUNCH Method',
   p:'How to move your adult child from stuck to independent, without wrecking the relationship.'},

  {t:'who', eyebrow:'Who this is for', h:'If your capable kid has stalled',
   bullets:['Your adult child is living at home in their 20s or 30s.',
     'They are bright and kind, but not working, not moving, not launching.',
     'You have tried talking, helping, waiting. Nothing has shifted.',
     'You love them, and you are quietly exhausted.']},

  {t:'trap', eyebrow:'The trap', h:'You are doing everything right, and it is making it worse',
   p:'Every instinct says help more. Cover the bill, make the call, smooth the path. The more you carry, the less they have to. The stall is not a character flaw. It is a pattern, and patterns can change.'},

  {t:'reframe', eyebrow:'The hard truth', big:'The harder you help, the longer they stay stuck.',
   p:'This is the reframe most parents never hear. It is not about loving less. It is about helping differently.'},

  {t:'part', num:'Part One', h:'Why capable kids get stuck',
   p:'Launch is a skill, not a switch. When a young adult never has to carry the weight of their own decisions, the skill never develops. Comfort at home quietly competes with the discomfort of growing up, and comfort usually wins.'},

  {t:'point', num:'The rescue reflex', h:'The pattern that keeps them home',
   bullets:['They hit friction. You step in. The friction disappears.',
     'They learn, without anyone meaning it, that waiting works.',
     'You feel responsible, so you carry more, so they carry less.',
     'The cycle is comfortable for everyone, and it goes nowhere.']},

  {t:'point', num:'What research says', h:'This is developmental, not defiance',
   p:'Two psychology degrees and years with these families taught me the same thing: a stalled launch is almost never laziness. It is a nervous system that has learned the world is safer when someone else drives. The work is teaching them to take the wheel.'},

  {t:'part', num:'Part Two', h:'The LAUNCH roadmap',
   p:'There is a path from dependent to independent, and you can see exactly where your young adult is on it. Each stage has one next move for you. This is the method.'},

  {t:'road', eyebrow:'The roadmap', h:'From dependent to independent',
   nodes:['Dependent','Learning','Launching','Independent'],
   p:'Most stuck young adults are parked between Dependent and Learning. The job is not to leap to Independent. It is to make the next stage the only easy option.'},

  {t:'point', num:'Shift 1', h:'From rescuer to coach',
   p:'A rescuer removes the problem. A coach hands it back with support. You stop solving and start asking: what is your plan, and how can I back you while you run it?'},

  {t:'point', num:'Shift 2', h:'The Living Together Agreement',
   bullets:['Past agreements failed because they were rules, not a relationship.',
     'A real agreement names responsibilities, a timeline, and what changes this month.',
     'It is built with them, not handed to them.',
     'It holds because both of you signed it, and both of you keep it.']},

  {t:'point', num:'Shift 3', h:'Let natural consequences teach',
   p:'When you stop absorbing every consequence, the world becomes the teacher, and you get to be the warm, steady person in their corner instead of the enforcer. That is how the relationship survives the launch.'},

  {t:'point', num:'Shift 4', h:'Expect capability, out loud',
   p:'Young adults rise or sink to the expectation they feel. When you speak to the capable adult you know is in there, instead of the stuck one in front of you, you give them something to grow into.'},

  {t:'part', num:'Part Three', h:'A real launch, at your kitchen table',
   p:'Not a blowup. Not an ultimatum. A series of small, steady moves: one honest conversation, one agreement, one consequence you did not rush to fix, one win they earned themselves.'},

  {t:'point', num:'The shift you will feel first', h:'Calm returns before independence does',
   p:'Parents tell me the house gets quieter before the launch happens, because the pressure to fix everything lifts off your shoulders. You are no longer the whole plan. You are the coach.'},

  {t:'whyme', eyebrow:'Why me', h:'I have lived both sides of this',
   p:'I am Shari Jonas, a Family Life Educator with two psychology degrees from McGill and my own family story of a launch that did not go to plan. I built the LAUNCH method, the podcast, and the LAUNCH Program so parents would have a roadmap I wish I had had.'},

  {t:'cta', eyebrow:'Your next step', h:'Ready to find your young adult on the map?',
   p:'If you want help turning the roadmap into your family’s plan, book a call with me and we will find the next move for your young adult together.',
   disc:'This masterclass is educational. Every family and young adult is different, results vary, and no specific outcome is promised or guaranteed. It is not therapy or a substitute for care where serious mental health or substance concerns are present.'}
];

const deck = document.getElementById('deck');
function esc(s){return s}
S.forEach((s)=>{
  const d=document.createElement('section'); d.className='slide';
  let html='';
  if(s.eyebrow) html+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num) html+=`<div class="num">${s.num}</div>`;
  if(s.h) html+=`<h1>${s.h}</h1>`;
  if(s.h && (s.num||s.t==='point')) html=html.replace('<h1>','<h2>').replace('</h1>','</h2>');
  html+='<div class="rule"></div>';
  if(s.big) html+=`<div class="big">${s.big}</div>`;
  if(s.p) html+=`<p${s.t==='title'||s.t==='reframe'?' class="sub"':''}>${s.p}</p>`;
  if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+=`<li>${b}</li>`);html+='</ul>';}
  if(s.nodes){
    html+='<div class="road"><div class="line"></div>';
    s.nodes.forEach(n=>{html+=`<div class="node"><div class="dot"></div><div class="lbl">${n}</div></div>`});
    html+='</div>';
  }
  if(s.disc) html+=`<p class="disc">${s.disc}</p>`;
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
