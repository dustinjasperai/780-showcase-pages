<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Ironman Mindset: Building a Landscape Company That Runs Without You · Robert Clinkenbeard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#eef3ee; --panel:#ffffff; --rule:#cdd9cd;
    --acc:#2f8d7c; --idx:#4a6b5f; --ink:#22302a; --grey:#4f5f57; --dim:#8aa096;
  }
  html,body{height:100%}
  body{background:#dbe4dc;font-family:'Rubik',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dbe4dc}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Josefin Sans',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Josefin Sans',sans-serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:4.2vw;max-width:90%}
  .t-normal h1{font-size:3.2vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:75%;line-height:1.58;font-weight:300}
  .sub{font-size:1.72vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Josefin Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:linear-gradient(135% 120% at 50% 0%,#274b42 0%,#16302a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:#f3f8f4;font-weight:500}
  .t-cta{background:linear-gradient(135% 120% at 50% 100%,#274b42 0%,#16302a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:#f3f8f4}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #7fc0b2;color:#dff3ee;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.2vw;font-weight:400}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-cta .disc{color:#9fbcb0}
  .t-title .disc,.t-normal .disc{text-align:left}
  .horizon{position:absolute;pointer-events:none;opacity:.95}
  .title-horizon{right:7%;bottom:8%;width:24vw}
  .corner-horizon{right:6%;bottom:7.5%;width:11vw;opacity:.5}
  .brandline{font-family:'Josefin Sans',sans-serif;font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.03em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(34,48,42,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The Commercial Landscaper</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- horizon motif: a level ground line with a rising route to a finish marker on the horizon -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="horizon" viewBox="0 0 280 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="16" y1="126" x2="264" y2="126" stroke="#4a6b5f" opacity="0.35"/>
    <path d="M40 126 C110 118 150 70 244 42" stroke="#2f8d7c" opacity="0.9"/>
    <circle cx="40" cy="126" r="5" fill="none" stroke="#2f8d7c" stroke-width="2.6"/>
    <path d="M244 42 l0 -26 22 9 -22 9" stroke="#2f8d7c" stroke-width="2.6" fill="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Ironman Mindset: Building a Landscape Company That Runs Without You',sub:'A live masterclass for commercial landscape and green industry owners who want the business to scale past them.',brand:true,horizon:'title'},
 {t:'normal',k:'Who this is for',title:'You built the company. Now it needs you every single day.',body:'You own a growing landscape or maintenance operation. Crews, clients, bids, and problems all still route back to you, and the busier the company gets, the more of it lands on your desk.'},
 {t:'dark',title:'You can out-work a start-up. You cannot out-work a company that depends on you for every decision.'},

 {t:'section',idx:'Part One',title:'Why Growth Stalls At The Owner'},
 {t:'normal',k:'The owner bottleneck',title:'The company grew as far as one person can carry it.',body:'When every estimate, every hire, and every unhappy client comes back to the owner, the owner becomes the ceiling. Revenue climbs, but the hours climb faster, and the quality of the work depends on whether you were in the room.'},
 {t:'normal',k:'The endurance parallel',title:'An Ironman is not won by trying harder on race day.',body:'It is won in the months of training, the plan, and the systems that carry you when willpower runs out. A landscape company is the same. Effort got you here. What takes you further is a business built to perform when you step back.'},
 {t:'dark',title:'A business built on the owner’s stamina has a finish line the owner can never move.'},

 {t:'section',idx:'Part Two',title:'The Ironman Mindset'},
 {t:'normal',k:'Pillar one · Northern Light',title:'Set a target far enough out that the whole team can steer by it.',body:'A clear five, ten, or twenty five year vision, then broken down to the year and the quarter. When everyone knows where the company is heading, thousands of small daily decisions start pointing the same way without you in the middle of them.'},
 {t:'normal',k:'Pillar two · The Right People',title:'The people who got you here are not always the ones who take it further.',body:'Building the next stage means evaluating your team continuously, not once a year, and developing crew leads and managers who can own a branch. Hiring people better than you at their job is how the work outgrows your hands.'},
 {t:'normal',k:'Pillar three · Tools For Success',title:'Give the team the systems, numbers, and processes to run their own patch.',body:'Real metrics, real processes, and software that replaces the spreadsheets, so a branch manager can read their own results and act on them. People run a company well when they can see the scoreboard, not just the boss.'},
 {t:'normal',k:'Pillar four · Coaching Leadership',title:'Stop being the answer to every question.',body:'When a problem lands on your desk, the reflex becomes asking how they would solve it. That one shift turns a team of order takers into a bench of leaders, and it takes you off the critical path for the day to day.'},
 {t:'normal',k:'Pillar five · Preparation And Discipline',title:'Every night, you lay out tomorrow’s gear.',body:'An athlete preps the kit the night before so nothing is decided under pressure. A well run company works the same way, with agendas set, outcomes defined, and the right people in the room before the meeting starts. Repeatable preparation is what makes performance boring, in the best way.'},
 {t:'normal',k:'Pillar six · Mindset Through The Miles',title:'The plan holds when the day tries to break it.',body:'Weather, turnover, a lost account, a bad month. The owners who scale are the ones who keep the long target in view and keep the team moving through the rough stretch instead of reacting to every mile marker.'},
 {t:'dark',title:'Train the company the way an athlete trains. Vision, the right people, the reps, every single day.'},

 {t:'section',idx:'Part Three',title:'The Company You Get Back'},
 {t:'normal',k:'The company this builds',title:'A business worth more, that needs you less.',body:'Key people move into senior roles, the culture carries the vision as if it were their own, and you get time back to work on the company instead of inside it. A company that runs without you is also the one that is worth the most when you decide to sell.'},
 {t:'normal',k:'Why Robert',title:'Built it, scaled it, sold it, and coaches it now.',body:'Robert Clinkenbeard co-founded Integrated Landscape Management and grew it to more than twenty million in revenue, three hundred and fifty people, and five branches before it was acquired in 2016. A four time Ironman, a certified Scaling Up and EOS coach, and author of Ironman Mindset for Entrepreneurs, he now leads CEO peer groups for green industry owners through Wilson360.'},

 {t:'section',idx:'Your Next Step',title:'Build Your Roadmap'},
 {t:'normal',k:'Work with Robert',title:'Turn the mindset into a twelve month plan for your company.',body:'The work becomes a customized road map for you and your leadership team, supported by the Wilson360 CEO peer groups where green industry owners scale alongside people who have already done it. You bring the company. The method turns it into one that runs without you.'},
 {t:'cta',title:'Ready to build a company that scales past you?',chips:['Explore the Wilson360 peer groups','Book a strategy conversation with Robert'],disc:'Educational content for landscape and green industry business owners. No income, valuation, or business result is guaranteed. Outcomes vary by company, market, and execution.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="horizon ${kind==='title'?'title-horizon':'corner-horizon'}"><use href="#horizon"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Commercial <b>Landscaper</b> · Robert Clinkenbeard</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.horizon) h+=motif(s.horizon);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
