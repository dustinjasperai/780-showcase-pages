<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead, Don't Boss — a live masterclass with Scott McCarthy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9edf0; --panel:#ffffff; --rule:#d4dbe1;
    --ink:#2a2d33; --muted:#5d636d; --slate:#3d424f; --accent:#cc3366;
    --head:'Nunito',system-ui,sans-serif; --body:'PT Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--slate);font-family:var(--body);color:var(--ink);}
  .deck{max-width:960px;margin:0 auto;}
  .slide{background:var(--bg);min-height:62vh;padding:58px 64px;margin:22px 0;
    border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.28);display:flex;
    flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
  .kick{font-family:var(--head);font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px;}
  h1{font-family:var(--head);font-weight:900;font-size:52px;line-height:1.05;color:var(--ink);letter-spacing:-.01em;}
  h2{font-family:var(--head);font-weight:900;font-size:34px;line-height:1.12;color:var(--ink);margin-bottom:14px;}
  .lead{font-size:20px;color:var(--muted);margin-top:18px;max-width:52ch;line-height:1.5;}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:60ch;margin-top:12px;}
  .big{font-family:var(--head);font-weight:900;font-size:40px;line-height:1.12;max-width:20ch;}
  .accent{color:var(--accent);}
  ul{margin:20px 0 0 0;list-style:none;}
  li{font-size:18px;line-height:1.5;color:var(--ink);padding:10px 0 10px 26px;position:relative;border-top:1px solid var(--rule);}
  li:first-child{border-top:none;}
  li:before{content:"";position:absolute;left:0;top:18px;width:11px;height:11px;background:var(--accent);border-radius:2px;}
  .rings{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;}
  .ring{flex:1;min-width:210px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:20px;}
  .ring .n{font-family:var(--head);font-weight:900;color:var(--accent);font-size:13px;letter-spacing:.1em;}
  .ring h3{font-family:var(--head);font-weight:700;font-size:20px;margin:6px 0 8px;}
  .ring span{color:var(--muted);font-size:15px;line-height:1.45;}
  .foot{position:absolute;bottom:20px;left:64px;right:64px;display:flex;justify-content:space-between;
    font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px;font-family:var(--head);}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5;}
  .cta-line{display:inline-block;margin-top:22px;font-family:var(--head);font-weight:700;
    font-size:18px;color:var(--panel);background:var(--accent);padding:14px 26px;border-radius:6px;}
  .num{font-family:var(--head);font-weight:900;font-size:120px;color:var(--rule);position:absolute;top:24px;right:40px;line-height:1;}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass for leaders', h:"Lead, Don't Boss",
   lead:"How to get more from your team without burning them out, from an officer who learned it leading people he could not simply command."},

  {t:'who', kick:'Who this is for', h:"You are delivering, but it is costing you or your team too much.",
   lead:"Experienced managers and senior leaders carrying real responsibility, who want honest challenge, not reassurance. If you were promoted for being the best doer and nobody taught you to lead the doers, this is for you."},

  {t:'trap', kick:'The trap', h:"By the time your best person asks for 'a chat', you have already been bossing too long.",
   lead:"The quiet exit starts long before the resignation. Good people do not leave over pay as often as they leave over how they are led."},

  {t:'reframe', kick:'The reframe', big:"The harder you boss, the <span class='accent'>faster your best people leave.</span>",
   lead:"Command gets you compliance. It does not get you ownership. And compliance is fragile the moment you are not in the room."},

  {t:'part', kick:'Part one', h:"The core problem: command was built for a different job.",
   lead:"Most management habits are inherited from a world that rewarded control. Real teams, remote teams, and volunteers do not run on control. They run on trust."},

  {t:'content', kick:'Part one', h:"Bossing scales effort. Mentoring scales judgment.",
   items:["A boss makes every decision the bottleneck.","A mentor builds people who make good decisions without them.","The first feels productive. The second compounds.","#LeadDontBoss is the deliberate shift from the first to the second."]},

  {t:'part', kick:'Part two', h:"The Three Domains of Leadership",
   lead:"My framework walks three domains, in order. Most managers skip to the outer ring and wonder why nothing holds."},

  {t:'rings', kick:'Part two', h:"Lead in order, not all at once.",
   rings:[
     {n:'01', title:'Lead Yourself', body:'Self-command: discipline, mindset, and the self-awareness to know how you land on people.'},
     {n:'02', title:'Lead Your Team', body:'Trust, mentorship, and accountability. This is where #LeadDontBoss actually lives.'},
     {n:'03', title:'Lead Your Organization', body:'Systems, strategy, and reading organizational dynamics so the whole moves, not just you.'}
   ]},

  {t:'content', kick:'Part two, domain one', h:"Lead Yourself first.",
   items:["You cannot ask for a standard you do not hold.","Most leadership failures are self-management failures wearing a strategy costume.","Know your defaults under pressure, because your team already does."]},

  {t:'content', kick:'Part two, domain two', h:"Lead Your Team by mentoring it.",
   items:["Replace 'do this' with 'here is how I would think about this'.","Teach the reasoning, not just the task. Teaching is the fastest way to solidify it for both of you.","Protect the team's wellbeing instead of trading it for this quarter's number."]},

  {t:'content', kick:'Part two, domain three', h:"Lead Your Organization by reading it.",
   items:["Learn the organization before you try to change it.","The best mentoring I ever did was with commanders I could not order around.","Influence, not authority, is what moves a system you do not fully control."]},

  {t:'part', kick:'Part three', h:"A mentoring week, in concrete terms.",
   lead:"Not a personality transplant. A handful of concrete changes to how you spend your attention."},

  {t:'content', kick:'Part three', h:"The mentorship shift, in practice.",
   items:["One real 1:1 that is about the person, not the status update.","Decisions handed down one level, with the reasoning attached.","A standard held in private before it is ever enforced in public.","A review that asks 'what did we learn' before 'who missed'."]},

  {t:'why', kick:'Why me', h:"I had to learn this the hard way.",
   items:["Royal Military College of Canada, 2006. Army Logistics Officer.","At 24, responsible for a transport platoon of 80+ soldiers.","Kandahar, 2009: embedded to mentor Afghan Army commanders I could not command.","300+ leaders interviewed on the Peak Performance Leadership Podcast.","Author of 'You Don't Know Sh*t About Leadership: And Neither Do I'."]},

  {t:'recap', kick:'Recap', h:"Lead yourself. Mentor your team. Read your organization.",
   lead:"That is the whole of #LeadDontBoss. The order is the point: the inner rings are what make the outer one hold."},

  {t:'cta', kick:'Start the conversation', h:"Book a Leadership Clarity Session.",
   lead:"A confidential 30-minute conversation to look at what is costing you or your team the most, and whether coaching is the right next step. No pressure, no obligation.",
   disc:"This masterclass is educational. It shares frameworks and experience, not promises. Leadership outcomes depend on your context and effort. Results are not guaranteed and results vary from leader to leader."}
];

const deck = document.getElementById('deck');
function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
S.forEach((s, i)=>{
  const sl = el('div','slide');
  if(s.kick) sl.appendChild(el('div','kick', s.kick));
  if(s.t==='reframe' && s.big){ sl.appendChild(el('div','big', s.big)); }
  else if(s.h){ sl.appendChild(el('h1', null, s.h)); }
  if(s.lead) sl.appendChild(el('div','lead', s.lead));
  if(s.big && s.t!=='reframe') sl.appendChild(el('div','big', s.big));
  if(s.items){ const ul=el('ul'); s.items.forEach(it=>ul.appendChild(el('li',null,it))); sl.appendChild(ul); }
  if(s.rings){ const w=el('div','rings'); s.rings.forEach(r=>{ const c=el('div','ring'); c.appendChild(el('div','n',r.n)); c.appendChild(el('h3',null,r.title)); c.appendChild(el('span',null,r.body)); w.appendChild(c); }); sl.appendChild(w); }
  if(s.t==='cta'){ sl.appendChild(el('div','cta-line','Book a Leadership Clarity Session')); }
  if(s.disc) sl.appendChild(el('div','disc', s.disc));
  sl.appendChild(el('div','num', String(i+1)));
  const f = el('div','foot'); f.appendChild(el('span',null,'Moving Forward Leadership')); f.appendChild(el('span',null,'Scott McCarthy  ·  #LeadDontBoss')); sl.appendChild(f);
  deck.appendChild(sl);
});
</script>
</body>
</html>
