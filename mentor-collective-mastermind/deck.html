<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Money Story — A Live Masterclass with Chris Harder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f4;        /* warm off-white ground (his cream/white) */
    --panel:#ffffff;
    --ink:#231f1c;       /* near-black text */
    --muted:#6d645c;
    --accent:#f38249;    /* his dominant coral (brand.json uses 60) */
    --gold:#daa64f;      /* his button gold, subordinate */
    --rule:#e7ded4;
    --display:'Poppins',system-ui,sans-serif;
    --body:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:940px;margin:0 auto;padding:48px 22px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 52px;margin:0 0 26px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(35,31,28,.03)}
  .kick{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.16em;
    font-size:12.5px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:33px;line-height:1.1;letter-spacing:-.01em}
  .promise{font-size:21px;color:var(--muted);margin-top:22px;max-width:30em;line-height:1.4}
  .lede{font-size:20px;line-height:1.5;color:var(--ink);max-width:34em;margin-top:8px}
  p+p{margin-top:15px}
  .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.08;letter-spacing:-.01em;max-width:20em}
  ul{list-style:none;margin-top:14px;max-width:36em}
  li{font-size:19px;line-height:1.45;padding:13px 0 13px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:2px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .story{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px}
  .story > div{flex:1;min-width:240px;border:1px solid var(--rule);border-radius:14px;padding:22px 24px;background:var(--bg)}
  .story .lie{color:var(--muted);text-decoration:line-through;font-size:19px;line-height:1.4}
  .story .truth{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.3;margin-top:8px;color:var(--ink)}
  .tag{font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  .tag.lie{color:var(--gold)}
  .tag.truth{color:var(--accent)}
  .num{font-family:var(--display);font-weight:700;color:var(--gold);font-size:15px;letter-spacing:.14em}
  .pillar h2{margin-top:6px}
  .foot{margin-top:26px;font-size:14px;color:var(--muted);max-width:40em;line-height:1.5}
  .cta h1{font-size:44px}
  .step{font-family:var(--display);font-weight:600;font-size:22px;color:var(--accent);margin-top:20px}
  .pagenum{position:absolute;right:26px;bottom:18px;font-size:12px;color:#c9bdae;font-family:var(--display)}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kick:'A Live Masterclass with Chris Harder',
  h:'The Money Story',
  promise:'Why your revenue is stuck at the ceiling of what you believe you deserve, and how to move it.'},

 {t:'who',kick:'Who this is for',
  h:'The owner who is working hard and still stuck',
  body:['You are doing real revenue, past twenty five thousand and climbing, but the number keeps hitting the same ceiling.','You are busy, a little isolated in the big decisions, and quietly wondering if you are just not built for bigger.','This hour is for you.']},

 {t:'trap',kick:'The trap',
  h:'You keep reaching for another tactic',
  body:['Another funnel. Another offer. Another launch. A new hire, a new tool, a longer week.','Each one moves the needle for a month and then the ceiling comes back.','So you assume the fix is one more tactic you have not tried yet.']},

 {t:'hook',
  big:'The ceiling is not your strategy. It is your money story.'},

 {t:'part',kick:'Part One',
  h:'The problem underneath the problem',
  body:['Every one of us was handed a story about money before we were old enough to question it.','That money is scarce. That wanting more is greedy. That people who have it must have done something wrong to get it.','You can run the best strategy in the world on top of that story and it will quietly cap what you let yourself earn.']},

 {t:'story',kick:'The money lies, rewritten',
  h:'What the story tells you, and what is actually true',
  pairs:[
    {lie:'There is only so much to go around.',truth:'Value you create is not subtracted from someone else.'},
    {lie:'Wanting more makes me greedy.',truth:'Earning more is what lets you give and build more.'},
    {lie:'This is probably my level.',truth:'Your level is a belief, not a fact, and beliefs can be rewritten.'}
  ]},

 {t:'cost',kick:'What it costs you',
  h:'How the story shows up in the business',
  body:['You underprice, because charging your worth feels uncomfortable.','You hesitate to invest in growth, because spending money triggers the scarcity story.','You cap the goal before you start, so the plateau was decided long before the quarter began.']},

 {t:'part',kick:'Part Two',
  h:'The Money Principles',
  body:['The work is not another tactic. It is rewriting the story so the tactics finally have room to work.','Five principles, in the order I teach them.']},

 {t:'pillar',kick:'Principle One',num:'01',
  h:'Name the lies you were taught',
  lede:'You cannot change a story you cannot see. We surface the exact beliefs about money you inherited and say them out loud, because naming them is what breaks their grip.'},

 {t:'pillar',kick:'Principle Two',num:'02',
  h:'Trade scarcity for abundance',
  lede:'Scarcity thinking makes every decision defensive. We replace it with a working belief in abundance, not as a slogan, but as the lens you run pricing, spending and goals through.'},

 {t:'pillar',kick:'Principle Three',num:'03',
  h:'Money is a tool, not a scoreboard',
  lede:'Make good money so you can do great things. When money becomes the mechanism for the impact you want, the guilt that quietly held you back turns into fuel.'},

 {t:'pillar',kick:'Principle Four',num:'04',
  h:'Build the rituals of wealth',
  lede:'Belief without practice fades. We install the daily and weekly habits, around money, attention and energy, that keep the new story running when the pressure comes back.'},

 {t:'pillar',kick:'Principle Five',num:'05',
  h:'Give as you grow',
  lede:'Generosity is not what you do once you have made it. It is the practice that proves the new story to yourself, and it compounds, in your life and in the lives you touch.'},

 {t:'part',kick:'Part Three',
  h:'What changes when the story changes',
  body:['You price with confidence, because your worth stopped being up for debate.','You invest in growth without the flinch, because spending is no longer a threat.','You give generously, and the number you were stuck under starts to move, because nothing is holding it down anymore.']},

 {t:'why',kick:'Why me',
  h:'Chris Harder',
  body:['I am an entrepreneur and philanthropist, and I host The Chris Harder Show, more than eleven hundred episodes on money, business and generosity.','I built my life around one line: when good people make good money, they do great things.','I teach this with my wife Lori, and I have watched the money story be the real lever again and again.']},

 {t:'room',kick:'Where the work gets done',
  h:'The Mentor Collective Method',
  body:['A masterclass can start the shift. Holding it takes a room.','Clarify what matters most. Execute with expert coaching. Build accountability that actually works.','That is the method behind the Mentor Collective Mastermind, and it is where owners keep this going long after today.']},

 {t:'cta',kick:'Your next step',
  h:'Come do the work in the room',
  step:'Get on the Mentor Collective Mastermind waitlist',
  foot:'This masterclass is for educational purposes only. It is not a promise or guarantee of income or results, and individual results vary. Nothing here is financial advice.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='cta'?'cta ':'')+(s.t==='pillar'?'pillar ':'');
  let html='';
  if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
  if(s.num) html+='<div class="num">'+s.num+'</div>';
  if(s.big){ html+='<div class="big">'+s.big+'</div>'; }
  if(s.h){ html+='<h1'+(s.t!=='title'&&s.t!=='hook'&&s.t!=='cta'?' style="font-size:38px"':'')+'>'+s.h+'</h1>'; }
  if(s.promise) html+='<p class="promise">'+s.promise+'</p>';
  if(s.lede) html+='<p class="lede">'+s.lede+'</p>';
  if(s.body) html+=s.body.map(p=>'<p class="lede">'+p+'</p>').join('');
  if(s.pairs){
    html+='<div class="story">';
    s.pairs.forEach(p=>{ html+='<div><div class="tag lie">The story</div><div class="lie">'+p.lie+'</div><div class="tag truth" style="margin-top:16px">The truth</div><div class="truth">'+p.truth+'</div></div>'; });
    html+='</div>';
  }
  if(s.step) html+='<div class="step">'+s.step+'</div>';
  if(s.foot) html+='<div class="foot">'+s.foot+'</div>';
  html+='<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
