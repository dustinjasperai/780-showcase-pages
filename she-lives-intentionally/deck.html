<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start With the Give-Me Shots: a masterclass with Marney Andes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5eee4;        /* warm cream, brand.json ranked #2 */
    --ink:#22203d;       /* deep indigo, brand.json ranked #1 (dominant) */
    --accent:#a03466;    /* plum/rose, brand.json ranked #4 */
    --panel:#efe6d8;
    --rule:#ded0bb;
    --muted:#5b5872;
    --serif:'Newsreader',Georgia,serif;
    --sans:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{width:100%}
  .slide{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 10vw;background:var(--bg);border-bottom:1px solid var(--rule);
    position:relative;
  }
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,4.2vw,3.1rem);line-height:1.1;letter-spacing:-.01em}
  .sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,2.1vw,1.55rem);color:var(--muted);margin-top:1.4rem;max-width:30ch}
  .lead{font-size:clamp(1.05rem,1.9vw,1.4rem);line-height:1.5;max-width:46ch;margin-top:1.3rem;color:var(--ink)}
  .big{font-family:var(--serif);font-size:clamp(1.8rem,3.6vw,2.7rem);line-height:1.18;max-width:24ch;letter-spacing:-.01em}
  ul{list-style:none;margin-top:1.8rem;max-width:48ch}
  li{position:relative;padding-left:1.7rem;margin:.95rem 0;font-size:clamp(1rem,1.7vw,1.25rem);line-height:1.45}
  li::before{content:"";position:absolute;left:0;top:.55em;width:.6rem;height:.6rem;background:var(--accent);border-radius:50%}
  .num{font-family:var(--serif);font-size:clamp(3rem,7vw,5.5rem);color:var(--accent);line-height:1;font-weight:700}
  .part{display:flex;align-items:baseline;gap:1.4rem}
  .fw-name{font-family:var(--serif);font-weight:700;font-size:clamp(1.7rem,3.4vw,2.6rem);letter-spacing:-.01em}
  .fw-body{font-size:clamp(1.02rem,1.8vw,1.3rem);line-height:1.5;max-width:52ch;margin-top:1.1rem;color:var(--ink)}
  .cred{max-width:52ch}
  .cred .lead{margin-top:1rem}
  .recap li{margin:.7rem 0}
  .cta-card{background:var(--ink);color:var(--bg);padding:7vh 9vw;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
  .cta-card .kicker{color:#e4b8cd}
  .cta-card h2{color:var(--bg)}
  .cta-card .lead{color:#e9e1d4}
  .cta-btn{display:inline-block;margin-top:2.2rem;align-self:flex-start;background:var(--accent);color:#fff;
    font-family:var(--sans);font-weight:600;padding:.95rem 1.8rem;border-radius:999px;font-size:1.05rem;text-decoration:none}
  .disclaimer{margin-top:2.6rem;font-size:.82rem;color:#b9b0c6;max-width:60ch;line-height:1.5}
  .footer-mark{position:absolute;bottom:3.2vh;left:10vw;font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .pageno{position:absolute;bottom:3.2vh;right:10vw;font-family:var(--sans);font-size:.72rem;color:var(--muted)}
  @media(max-width:640px){.slide{padding:8vh 8vw}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
/* Masterclass deck for She Lives Intentionally (Marney Andes). Coach's own sample deliverable. */
const BRAND = "She Lives Intentionally®";
const S = [
  {t:'title',
   kicker:'A live masterclass with Marney Andes',
   h1:'Start With the Give-Me Shots',
   sub:'The executive playbook for living intentionally when you’ve outgrown the life that once fit.'},

  {t:'who',
   kicker:'Who this is for',
   h2:'For the woman who is done performing',
   items:[
     'You hit the goals, and the version of life that once fit does not fit anymore.',
     'You are self-aware and emotionally intelligent. You are not lost, you are between chapters.',
     'You do not want another affirmation. You want a way to actually choose.']},

  {t:'hook',
   kicker:'The trap',
   big:'You are so good at performing the role that you keep running it long after it stopped being yours.',
   lead:'Nothing is obviously wrong. That is exactly why nothing changes.'},

  {t:'hook',
   kicker:'The reframe',
   big:'Intentional living is not a reinvention. It is a decision you get to make again tomorrow.',
   lead:'You do not need to blow up your life. You need a repeatable way to choose it.'},

  {t:'section', num:'01', h2:'Why willpower and vision boards fail high achievers'},

  {t:'point',
   kicker:'Part one',
   big:'You already know what you want.',
   lead:'The gap is the decision, not the dream. Executives rarely lack vision. What they lack is a system for choosing well under pressure.'},

  {t:'point',
   kicker:'Part one',
   big:'Performing is a skill. So is choosing.',
   lead:'You just spent twenty years practicing one of them. The good news: the other one is learnable, and it is faster than you think.'},

  {t:'section', num:'02', h2:'The Give-Me Shots method'},

  {t:'framework', kicker:'Pillar one', name:'Start with the give-me',
   body:'A give-me, in my father’s golf language, is the short putt you are simply granted. You pick it up. Begin your next chapter the same way: with the wins already within reach and the gifts already in front of you. Momentum is built from easy, honest starts, not summoned by willpower.'},

  {t:'framework', kicker:'Pillar two', name:'Name the version you have outgrown',
   body:'You cannot choose forward while you are still performing a role you quietly left. Say it plainly: which circle, which title, which identity no longer fits. Naming it is not a crisis. It is the first honest move of an intentional life.'},

  {t:'framework', kicker:'Pillar three', name:'Make it a daily choice, not a someday project',
   body:'Big reinventions collapse under their own weight. One theme at a time, one deliberate move a day, is a practice you can actually keep. Intentional living that survives a busy week is the only kind that counts.'},

  {t:'framework', kicker:'Pillar four', name:'Choose in community, not in isolation',
   body:'Women change faster in rooms where the conversation actually goes somewhere. Structure and honest company beat motivation every time. The point of a community is not accountability theatre. It is having witnesses to the person you are becoming.'},

  {t:'section', num:'03', h2:'What a month of intentional living looks like'},

  {t:'point',
   kicker:'Part three',
   big:'One theme. Three give-me shots. One conversation that moves it.',
   lead:'Pick the month’s theme. Take three small, within-reach moves you cannot talk yourself out of. Bring the hard part to a room of women doing the same work. Repeat.'},

  {t:'point',
   kicker:'The difference in thirty days',
   big:'Fewer performances. Cleaner decisions.',
   lead:'A life that sounds like you when you describe it out loud. Not a new you. The one you quietly became while you were busy being who they expected.'},

  {t:'cred',
   kicker:'Why me',
   h2:'Marney Andes',
   lead:'Former HR and learning-and-development executive, executive coach, and former collegiate athlete. Bestselling author of Start With the Give-Me Shots and host of the She Lives Intentionally® podcast. I coach the way I wish someone had coached me: no nonsense, all the way practical, and always aimed at the next real decision in front of you.'},

  {t:'recap',
   kicker:'The method, in four lines',
   h2:'Start With the Give-Me Shots',
   items:[
     'Start with the give-me: begin from the wins within reach.',
     'Name the version you have outgrown.',
     'Make it a daily choice, not a someday project.',
     'Choose in community, not in isolation.']},

  {t:'cta',
   kicker:'Your next give-me shot',
   h2:'Live it intentionally, with a room that gets it',
   lead:'Join the She Lives Intentionally® community: curated monthly themes, live conversations that actually go somewhere, and women doing the exact same work alongside you.',
   btn:'Join She Lives Intentionally®',
   disclaimer:'This masterclass is for educational purposes only. No result is guaranteed. Results vary and depend on your own effort and circumstances. Nothing here is financial, medical, or professional advice.'}
];

function el(tag, cls, html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('div', s.t==='cta'?'cta-card':'slide');
  if(s.kicker) sl.appendChild(el('div','kicker',s.kicker));
  if(s.t==='title'){ sl.appendChild(el('h1',null,s.h1)); if(s.sub) sl.appendChild(el('div','sub',s.sub)); }
  else if(s.t==='section'){ const p=el('div','part'); p.appendChild(el('div','num',s.num)); p.appendChild(el('h2',null,s.h2)); sl.appendChild(p); }
  else if(s.t==='framework'){ sl.appendChild(el('div','fw-name',s.name)); sl.appendChild(el('div','fw-body',s.body)); }
  else if(s.t==='who'||s.t==='recap'){ if(s.h2) sl.appendChild(el('h2',null,s.h2)); const ul=el('ul',s.t==='recap'?'recap':null); (s.items||[]).forEach(it=>ul.appendChild(el('li',null,it))); sl.appendChild(ul); }
  else if(s.t==='hook'||s.t==='point'){ if(s.big) sl.appendChild(el('div','big',s.big)); if(s.lead) sl.appendChild(el('div','lead',s.lead)); }
  else if(s.t==='cred'){ sl.appendChild(el('h2',null,s.h2)); sl.appendChild(el('div','lead cred',s.lead)); }
  else if(s.t==='cta'){ sl.appendChild(el('h2',null,s.h2)); sl.appendChild(el('div','lead',s.lead)); const a=el('a','cta-btn',s.btn); a.href='https://shelivesintentionally.com'; sl.appendChild(a); if(s.disclaimer) sl.appendChild(el('div','disclaimer',s.disclaimer)); }
  if(s.t!=='cta'){ sl.appendChild(el('div','footer-mark',BRAND)); sl.appendChild(el('div','pageno',(i+1)+' / '+S.length)); }
  deck.appendChild(sl);
});
</script>
</body>
</html>
