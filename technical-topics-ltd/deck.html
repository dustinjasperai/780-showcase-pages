<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Core Diagnostic Process — Technical Topics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef4fb;
    --panel:#f9fcff;
    --rule:#d4e2f0;
    --ink:#0f1b2a;
    --accent:#2EA3F2;
    --dim:#5a6b7d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Open Sans",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100%;
  }
  .stage{
    width:min(960px,94vw);
    aspect-ratio:16/10;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    box-shadow:0 12px 40px rgba(15,27,42,.08);
    position:relative;
    overflow:hidden;
  }
  .slide{
    position:absolute;inset:0;
    padding:7% 8%;
    display:none;
    flex-direction:column;
    justify-content:center;
  }
  .slide.on{display:flex}
  /* the diagnostic trace motif: a thin ordered-step waveform rule */
  .trace{
    position:absolute;left:8%;right:8%;top:50%;height:2px;
    background:linear-gradient(90deg,var(--accent) 0,var(--accent) 60%,var(--rule) 60%,var(--rule) 100%);
    opacity:.18;
  }
  .kick{
    font-family:"Poppins",sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.14em;
    font-size:clamp(11px,1.4vw,14px);color:var(--accent);margin-bottom:14px;
  }
  h1{font-family:"Poppins",sans-serif;font-weight:700;line-height:1.05;
     font-size:clamp(28px,5.2vw,52px);letter-spacing:-.01em;}
  h2{font-family:"Poppins",sans-serif;font-weight:700;line-height:1.08;
     font-size:clamp(24px,4.2vw,42px);letter-spacing:-.01em;}
  .sub{font-family:"Poppins",sans-serif;font-weight:500;color:var(--dim);
       font-size:clamp(16px,2.3vw,24px);margin-top:16px;line-height:1.3;}
  .body{font-size:clamp(15px,1.9vw,20px);line-height:1.5;margin-top:20px;max-width:62ch;color:var(--ink);}
  .note{font-size:clamp(12px,1.5vw,15px);color:var(--dim);margin-top:22px;line-height:1.45;max-width:66ch;}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:12px;max-width:60ch;}
  li{position:relative;padding-left:30px;font-size:clamp(15px,1.9vw,20px);line-height:1.4;}
  li:before{content:"";position:absolute;left:0;top:.55em;width:14px;height:2px;background:var(--accent);}
  .part-num{font-family:"Poppins",sans-serif;font-weight:700;color:var(--accent);
            font-size:clamp(14px,2vw,20px);letter-spacing:.12em;text-transform:uppercase;}
  .mantra{font-family:"Poppins",sans-serif;font-weight:600;line-height:1.18;
          font-size:clamp(24px,4vw,44px);max-width:20ch;}
  .cols{display:flex;gap:40px;margin-top:26px;flex-wrap:wrap;}
  .col{flex:1;min-width:220px;}
  .col h3{font-family:"Poppins",sans-serif;font-size:clamp(15px,1.9vw,20px);margin-bottom:10px;}
  .col.bad h3{color:var(--dim);}
  .col.good h3{color:var(--accent);}
  .col p{font-size:clamp(13px,1.7vw,17px);line-height:1.45;color:var(--ink);}
  .hud{position:absolute;bottom:18px;left:8%;right:8%;display:flex;justify-content:space-between;
       align-items:center;font-size:12px;color:var(--dim);font-family:"Poppins",sans-serif;}
  .brandline{letter-spacing:.06em;}
  .dots{display:flex;gap:6px;flex-wrap:wrap;max-width:60%;justify-content:flex-end;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--rule);}
  .dot.on{background:var(--accent);}
  .nav{position:absolute;inset:0;display:flex;}
  .nav button{flex:1;background:transparent;border:0;cursor:pointer;}
  .disc{font-size:clamp(11px,1.4vw,13px);color:var(--dim);margin-top:24px;max-width:70ch;line-height:1.45;}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="trace"></div>
  <div class="hud">
    <span class="brandline">Technical Topics · James Dillon</span>
    <span class="dots" id="dots"></span>
  </div>
  <div class="nav"><button id="prev" aria-label="previous"></button><button id="next" aria-label="next"></button></div>
</div>
<script>
const S=[
 {t:'title',k:'A live masterclass with James Dillon, Technical Topics',
  h:'The Core Diagnostic Process',
  sub:'How to find the real cause before you reach for a single part.'},

 {t:'audience',k:'Who this is for',
  h:'For the technician who is tired of guessing',
  body:'If you have ever fitted a part, handed the keys back, and watched the same fault roll in a week later, this is for you. Mechanics, diagnostic technicians, and workshop owners who want to be right the first time.'},

 {t:'trap',k:'The trap',
  h:'The loop you are stuck in',
  body:'Plug in the scan tool. Read the code. Order the part the code points at. Fit it. Hope. If it is still broken, read the next code and do it again. It feels like progress, but it is guessing with extra steps.'},

 {t:'reframe',k:'The reframe',
  h:'You do not have a tools problem',
  sub:'You have a process problem. A better scope will not save you if the thinking underneath it is still a parts lottery.'},

 {t:'part',k:'',num:'Part One',
  h:'Why good technicians still misdiagnose'},

 {t:'point',k:'The real cost',
  h:'Parts-swapping is the most expensive habit in the trade',
  body:'Every comeback burns the part, the labour, the bay time, and the one thing you cannot re-order: the customer trusting you got it right. The fault was never the sensor. It was the method that chose the sensor.'},

 {t:'point',k:'What the code really is',
  h:'A fault code tells you where to look, not what is wrong',
  body:'A stored code is a symptom with a postcode. It narrows the area. It does not name the cause. Treat it as the start of the investigation, never the verdict.'},

 {t:'part',k:'',num:'Part Two',
  h:'The Core Diagnostic Process'},

 {t:'point',k:'The method',
  h:'A series of ordered tests, driven by logic',
  body:'The Core Diagnostic Process is a scientific, repeatable fault-finding method: correctly ordered testing, data to support each decision, and a clear path that lands you on the correct cause instead of a probable one.',
  note:'Logical. Repeatable. Effective. Systematic thinking, thorough documentation, sound decisions.'},

 {t:'point',k:'Evidence over opinion',
  h:'Let the data decide, not the dashboard',
  body:'Every step produces a measurement, and every measurement either confirms or kills your hypothesis. You stop when the evidence names the cause, not when a part looks guilty.'},

 {t:'mantra',k:'The diagnostic mantra',
  mantra:'Measure the right thing, in the right way, at the right time, with the right tool.'},

 {t:'point',k:'Rules of engagement',
  h:'Hypothesis first, then test',
  body:'Form a hypothesis about the cause before you pick up a probe, then design the test that proves or disproves it. This is the rule set that breaks the scan, swap, repeat loop for good.'},

 {t:'point',k:'The Golden Hour',
  h:'Build the routine that works the early window',
  body:'The first part of any job decides how long the rest takes. Repeatable routines in that window keep you efficient, and the better your hypothesis, the shorter the whole diagnostic process gets.'},

 {t:'part',k:'',num:'Part Three',
  h:'On the ramp, one fault at a time'},

 {t:'point',k:'A worked approach',
  h:'One fault, start to finish',
  body:'Read the symptom. Form the hypothesis. Choose the right test for that hypothesis. Take the measurement in the right way, at the right time. Read the data. Confirm the cause before a single part comes off the shelf.'},

 {t:'mindset',k:'The difference',
  h:'Parts-swapper or diagnostician',
  cols:[
    {cls:'bad',head:'Parts-swapper',txt:'Reacts to the code. Buys parts on probability. Measures confidence by how many fixes it took.'},
    {cls:'good',head:'Diagnostician',txt:'Reasons from a hypothesis. Tests before buying. Measures confidence by getting it right the first time.'}
  ]},

 {t:'whyme',k:'Why learn it here',
  h:'Taught by a diagnostician, in a real workshop',
  body:'James Dillon has spent his career on this method: a long-running technical column in autotechnician magazine, hands-on IMI-approved training at the Technical Topics centre in Bridgwater, and a reputation across the UK aftermarket built on diagnostic thinking, not kit sales.'},

 {t:'point',k:'It travels',
  h:'The process outlasts the technology',
  body:'Petrol, EV, hybrid, ADAS. The vehicles keep changing and the tools keep changing. A sound diagnostic process is the one skill that works across all of them, because it is a way of thinking, not a memorised fix.'},

 {t:'recap',k:'In one page',
  h:'The process, start to finish',
  bullets:[
    'The Core Diagnostic Process: ordered tests, driven by logic, confirmed by data.',
    'The mantra: measure the right thing, the right way, at the right time, with the right tool.',
    'Rules of engagement: hypothesis first, then the test that proves it.',
    'The Golden Hour: repeatable routines where the better hypothesis wins the day.'
  ]},

 {t:'cta',k:'Your next step',
  h:'Learn the process. Stop the comebacks.',
  body:'Join the live masterclass and then go deeper in the hands-on Diagnostic Bootcamp, or commit to the full Master Technician Programme. Bring the method back to your bay and be the technician the hard jobs get handed to.',
  disc:'Educational only. No specific result, income, or outcome is guaranteed. Results vary by technician, effort, and the vehicles you work on.'}
];

const stage=document.getElementById('stage');
const dotsEl=document.getElementById('dots');
let i=0;
S.forEach((s,idx)=>{
  const d=document.createElement('span');d.className='dot'+(idx===0?' on':'');dotsEl.appendChild(d);
  const el=document.createElement('div');el.className='slide'+(idx===0?' on':'');
  let html='';
  if(s.k) html+='<div class="kick">'+s.k+'</div>';
  if(s.num) html+='<div class="part-num">'+s.num+'</div>';
  if(s.h) html+=(s.t==='part'||s.t==='audience'||s.t==='mindset'||s.t==='whyme'||s.t==='recap')?'<h2>'+s.h+'</h2>':(s.t==='title'?'<h1>'+s.h+'</h1>':'<h2>'+s.h+'</h2>');
  if(s.mantra) html+='<div class="mantra">'+s.mantra+'</div>';
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.body) html+='<div class="body">'+s.body+'</div>';
  if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul>';}
  if(s.cols){html+='<div class="cols">';s.cols.forEach(c=>html+='<div class="col '+c.cls+'"><h3>'+c.head+'</h3><p>'+c.txt+'</p></div>');html+='</div>';}
  if(s.note) html+='<div class="note">'+s.note+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=html;
  stage.insertBefore(el,stage.querySelector('.hud'));
});
const slides=[...document.querySelectorAll('.slide')];
const dots=[...document.querySelectorAll('.dot')];
function show(n){i=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,x)=>s.classList.toggle('on',x===i));dots.forEach((d,x)=>d.classList.toggle('on',x===i));}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
</script>
</body>
</html>
