<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How To Be The Obvious Choice | AYCI Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#182e87;      /* brand dominant (ranked_colors 115 uses) */
    --indigo:#4457b6;    /* brand link indigo */
    --amber:#feb870;     /* brand warm accent (the one focal pop) */
    --panel:#eef0f9;     /* brand pale periwinkle */
    --bg:#fbfbfe;        /* near-white ground (light scheme) */
    --ink:#182e87;
    --muted:#5b6690;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--panel);font-family:"Outfit",system-ui,sans-serif;color:var(--ink);}
  .deck{max-width:960px;margin:0 auto;}
  .slide{background:var(--bg);min-height:92vh;margin:28px 18px;border-radius:18px;
    padding:64px 72px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 40px rgba(24,46,135,.08);border:1px solid #e3e7f6;position:relative;}
  .eyebrow{font-family:"Syne";font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:14px;color:var(--indigo);margin-bottom:22px;}
  h1{font-family:"Syne";font-weight:800;font-size:52px;line-height:1.05;color:var(--navy);letter-spacing:-.01em;}
  h2{font-family:"Syne";font-weight:700;font-size:38px;line-height:1.12;color:var(--navy);margin-bottom:18px;}
  p{font-size:21px;line-height:1.55;color:#2c3566;max-width:46ch;margin-top:14px;}
  .lede{font-size:25px;color:var(--muted);max-width:40ch;}
  .tag{display:inline-block;margin-top:30px;font-family:"Syne";font-weight:700;color:var(--navy);
    background:var(--amber);padding:9px 18px;border-radius:999px;font-size:15px;}
  ul{margin:22px 0 0 0;padding:0;list-style:none;}
  li{font-size:20px;line-height:1.5;color:#2c3566;padding:12px 0 12px 40px;position:relative;border-top:1px solid #e3e7f6;}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:16px;height:16px;border-radius:5px;background:var(--amber);}
  .num{font-family:"Syne";font-weight:800;font-size:17px;color:var(--navy);background:var(--panel);
    width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
  .foot{position:absolute;bottom:26px;left:72px;right:72px;display:flex;justify-content:space-between;
    font-family:"Syne";font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#aab2d6;}
  .disclaimer{margin-top:26px;font-size:14px;color:#8690bb;max-width:52ch;line-height:1.5;}
  .big{font-size:60px}
  @media(max-width:640px){.slide{padding:40px 28px}h1{font-size:34px}h2{font-size:27px}p{font-size:18px}.foot{left:28px;right:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "Ace Your Consultant Interview";
const S = [
  {t:'title', eyebrow:'A live masterclass with Dr Tessa Davis',
    h:'How To Be The Obvious Choice At Your NHS Consultant Interview',
    lede:'Why the strongest clinician in the room still has to win the interview, and the structure that lets you do it.',
    tag:'Live. 60 minutes. Bring your real interview.'},

  {t:'content', eyebrow:'Who this is for',
    h:'You are ready for the job. The interview is the last thing in the way.',
    p:'Final-year trainees and locum consultants with a substantive post in their sights. You know the medicine. You have done the work. This hour is about proving it in the room.'},

  {t:'content', eyebrow:'The trap',
    h:'You know your stuff. So why does it fall apart when they ask?',
    p:'Most doctors prepare by collecting answers. Then the panel asks the question a slightly different way, and the rehearsed answer will not come. Knowing the medicine was never the thing being tested.'},

  {t:'content', eyebrow:'The reframe',
    h:'The interview is not a test of whether you can do the job.',
    p:'It is a test of whether you can show, in a few minutes and under pressure, that you are the obvious choice. That is a different skill from being a good doctor. The good news: it can be coached.'},

  {t:'num', eyebrow:'Part one', n:'01',
    h:'Why strong doctors fail interviews',
    p:'Rehearsed scripts collapse under a reworded question. Nerves eat the structure. And nobody has helped you name what actually makes you more appointable than the candidate before you. Three fixable problems, not a talent problem.'},

  {t:'content', eyebrow:'From the other side of the table',
    h:'What the panel is really scoring',
    p:'I have sat as the candidate and as the consultant on the panel. They are not marking who knows the most. They are marking who is clear, who thinks like a senior, and who wants THIS job, not just any job.'},

  {t:'num', eyebrow:'Part two', n:'02',
    h:'The 3 Milestones',
    p:'The system my doctors use to go from rabbit-in-the-headlights to offer. Three milestones, in order. We will walk each one today.'},

  {t:'list', eyebrow:'Milestone one', h:'Keep composure under pressure',
    items:['A structure for answering any question so you never ramble or go blank',
           'Nerve management that holds when the question is reworded',
           'The pause-think-deliver habit that buys you a clear first sentence']},

  {t:'list', eyebrow:'Milestone two', h:'Become the obvious choice',
    items:['Surface your five USPs, the things only you bring to this department',
           'Think and speak at consultant level, not senior-registrar level',
           'Show them you want this job, with evidence, not enthusiasm']},

  {t:'content', eyebrow:'The exercise that changes everything', h:'Your five USPs',
    p:'When doctors stop sounding like every other candidate, it is almost always because they did this work. We find the five things that are true only of you, and build them into your answers so the panel remembers you.'},

  {t:'list', eyebrow:'Milestone three', h:'Have answers that convince',
    items:['Authentic responses that sound like you, not a memorised script',
           'Departmental knowledge and NHS governance woven in naturally',
           'Curveball and ethics questions handled with the same structure']},

  {t:'num', eyebrow:'Part three', n:'03',
    h:'Interview day, when you are the obvious choice',
    p:'Calm instead of cramming. A framework no question can shake. Five USPs you can land without notes. You walk in sure of why they should appoint you, and it shows.'},

  {t:'content', eyebrow:'The shift', h:'From unprepared to the obvious choice',
    p:'Doctors describe the same arc: knowing the answers but not being able to express them, then a clear structured path, then walking in composed and getting the job on a role they had one real shot at.'},

  {t:'content', eyebrow:'Why me', h:'Dr Tessa Davis',
    p:'Consultant in Paediatric Emergency Medicine at the Royal London Hospital. Twenty years in medicine, nine as an NHS consultant. I failed interviews before I worked this out, then built the system that landed my post. I have now coached 2,800+ doctors through their consultant interviews.'},

  {t:'content', eyebrow:'Where this goes next', h:'The AYCI Academy',
    p:'Today is the map. The Academy is four weeks of coaching on it: the Fast Track course, live practice and feedback on your real answers, guest experts, and a community of doctors who get it. We stay with you until you get the job.'},

  {t:'cta', eyebrow:'Your next step', h:'Come and get coached.',
    p:'Join the AYCI Academy and prepare with structure, feedback, and support until you secure your substantive consultant post.',
    cta:'Join the AYCI Academy',
    disclaimer:'Educational content only. Interview outcomes depend on many factors including your own preparation and the specific panel and post; individual results vary and no outcome is guaranteed.'}
];

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('section','slide');
  if(s.eyebrow) sl.appendChild(el('div','eyebrow',s.eyebrow));
  if(s.n) sl.appendChild(el('div','num',s.n));
  if(s.t==='title'){const h=el('h1',null,s.h);sl.appendChild(h);}
  else {const h=el('h2',null,s.h);sl.appendChild(h);}
  if(s.lede) sl.appendChild(el('p','lede',s.lede));
  if(s.p) sl.appendChild(el('p',null,s.p));
  if(s.items){const ul=el('ul');s.items.forEach(it=>ul.appendChild(el('li',null,it)));sl.appendChild(ul);}
  if(s.tag) sl.appendChild(el('span','tag',s.tag));
  if(s.cta) sl.appendChild(el('span','tag',s.cta));
  if(s.disclaimer) sl.appendChild(el('div','disclaimer',s.disclaimer));
  const f=el('div','foot');f.appendChild(el('span',null,BRAND));f.appendChild(el('span',null,(i+1)+' / '+S.length));
  sl.appendChild(f);
  deck.appendChild(sl);
});
</script>
</body>
</html>
