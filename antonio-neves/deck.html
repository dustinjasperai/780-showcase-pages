<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 1-Day Method — A Masterclass with Antonio Neves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;        /* his light scheme ground */
    --paper:#f4f4f2;     /* panel */
    --ink:#111111;       /* near-black text (ranked #111111) */
    --ink2:#020002;      /* secondary ink */
    --accent:#ffef12;    /* his signal yellow (#ffef12, ranked) */
    --muted:#5b5b57;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);
    border:1px solid #e4e4e0;
    border-radius:14px;
    padding:64px 56px;
    margin:0 0 22px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--ink2);margin-bottom:20px}
  .eyebrow .mark{background:var(--accent);padding:2px 8px;border-radius:3px}
  h1{font-family:'Anton',sans-serif;font-weight:400;font-size:72px;line-height:.98;letter-spacing:.01em;text-transform:uppercase;margin-bottom:18px}
  h2{font-family:'Anton',sans-serif;font-weight:400;font-size:46px;line-height:1.03;text-transform:uppercase;margin-bottom:16px}
  .lead{font-size:23px;line-height:1.5;color:var(--ink);max-width:40ch}
  .body{font-size:19px;line-height:1.6;color:var(--ink);max-width:48ch;margin-top:6px}
  .big-q{font-family:'Anton',sans-serif;font-size:54px;line-height:1.05;text-transform:uppercase}
  .big-q .hl{background:var(--accent);padding:0 10px}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid #ececea}
  li:before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;background:var(--accent);border:2px solid var(--ink)}
  li b{font-weight:700}
  .pillar{font-family:'Anton',sans-serif;font-size:30px;text-transform:uppercase;margin-bottom:6px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:26px;max-width:560px}
  .cal div{background:var(--paper);border:1px solid #e4e4e0;border-radius:8px;height:62px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--muted)}
  .cal div.on{background:var(--accent);color:var(--ink);border-color:var(--ink);font-family:'Anton',sans-serif;font-size:15px}
  .foot{font-size:19px;color:var(--muted);margin-top:18px}
  .credit{font-size:17px;color:var(--muted);margin-top:16px;line-height:1.5}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:60ch}
  .cta-line{font-family:'Anton',sans-serif;font-size:30px;text-transform:uppercase;background:var(--accent);display:inline-block;padding:10px 18px;margin-top:8px}
  .brandrow{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:28px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'THE 1-DAY METHOD', h1:'Win Today On Your Terms',
   lead:'A live masterclass on getting off autopilot and making today matter, with Antonio Neves.',
   brand:'Antonio Neves · Bestselling Author & Success Coach'},

  {t:'promise', eyebrow:'What you will leave with',
   lead:'One question you can ask every morning, a simple way to own your day, and the start of a circle that keeps you honest.',
   body:'No five-year plan required. Just the next 24 hours, done on purpose.'},

  {t:'who', eyebrow:'Who this is for',
   lead:'High performers and leaders who look successful on paper and still feel like the days are running them.',
   body:'You have the goals, the calendar, the plans. What you are missing is a way to make any single day actually count.'},

  {t:'trap', eyebrow:'The trap',
   h2:'The Five-Year Plan Lie',
   body:'We are told clarity comes from the long horizon, so we keep building bigger plans and vaguer visions. Meanwhile the one thing we can control, today, slides by on autopilot.'},

  {t:'hook', eyebrow:'An uncomfortable question',
   q:'Are you living the life you actually want, or the one that just happened to you?'},

  {t:'section', eyebrow:'Part One', h2:'The Autopilot Problem'},

  {t:'content', eyebrow:'How autopilot hides',
   lead:'Autopilot does not feel like failure. It feels like being busy.',
   list:['<b>Intentions</b> stay loud while your <b>recent actions</b> quietly tell the truth.',
         'Good days and wasted days blur together because nothing marks them.',
         'You judge your life by the plan on paper, not the day you actually lived.']},

  {t:'content', eyebrow:'The real cost',
   lead:'A year is just 365 of these days. Lose the day and you lose the year, one invisible slice at a time.',
   body:'The fix is not a better plan. It is a better relationship with today.'},

  {t:'section', eyebrow:'Part Two', h2:'The 1-Day Method'},

  {t:'calendar', eyebrow:'The whole method fits in one day',
   lead:'Stop managing five years you cannot see. Manage the one day in front of you, and let the days compound.'},

  {t:'pillar', eyebrow:'Pillar One', pillar:'The Morning Question',
   body:'Before the inbox, before the noise, you ask one thing: what will make today matter? One honest answer sets the day on purpose instead of on reaction.'},

  {t:'pillar', eyebrow:'Pillar Two', pillar:'Own Your Recent Actions',
   body:'At day end you measure the day you actually lived, not the one you meant to. Three honest questions on your work, your relationships, and the people you lead keep intentions and actions in the same room.'},

  {t:'pillar', eyebrow:'Pillar Three', pillar:'Build A Culture Of Allies',
   body:'Who you surround yourself with sets your trajectory. You stop drifting alone and deliberately build a small circle of allies who expect your best and call you on your worst.'},

  {t:'content', eyebrow:'How a day compounds',
   lead:'One mattered day is a good day. Seven in a row is a different person.',
   list:['The question aims the day.',
         'The scorecard keeps it honest.',
         'The allies keep you going when motivation runs out.']},

  {t:'section', eyebrow:'Part Three', h2:'A Week That Counts'},

  {t:'content', eyebrow:'A week on the method',
   lead:'You wake up with a target instead of a to-do list. You end the day knowing whether it counted. You stop negotiating with yourself at 6am.',
   body:'The goals do not change. Your grip on the days that reach them does.'},

  {t:'credit', eyebrow:'Why listen to me',
   lead:'I lost my home in the 2025 Los Angeles wildfire and got out with four backpacks.',
   credit:'What carried our family through was one question every morning: what will make today matter? I am a former NBC, PBS and MTV correspondent, author of five books including Stop Living on Autopilot, and I have delivered 400+ keynotes for teams at Google, Visa, Booking.com and Lincoln Financial. The 1-Day Method is what I come back to when everything else is on fire.'},

  {t:'recap', eyebrow:'The method, in one breath',
   list:['Ask the morning question.',
         'Own your recent actions at night.',
         'Build the allies who keep you honest.']},

  {t:'cta', eyebrow:'Your next step',
   lead:'If you want help making this your default, here is how we keep going together.',
   ctaLine:'Start with one day',
   body:'Join me inside Allies of Glory or book a time to work together one on one, and we turn one good day into the way you operate.',
   disclaimer:'This masterclass is for educational purposes only. No specific result is guaranteed. Results vary and depend on your own effort and circumstances. Nothing here is financial, medical, or mental-health advice.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className='slide';
  let h = `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  if(s.eyebrow) h += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.h1) h += `<h1>${s.h1}</h1>`;
  if(s.h2) h += `<h2>${s.h2}</h2>`;
  if(s.pillar) h += `<div class="pillar">${s.pillar}</div>`;
  if(s.q) h += `<div class="big-q"><span class="hl">${s.q}</span></div>`;
  if(s.lead) h += `<p class="lead">${s.lead}</p>`;
  if(s.t==='calendar') h += `<div class="cal">${['MON','TUE','WED','TODAY','FRI','SAT','SUN'].map(d=>`<div class="${d==='TODAY'?'on':''}">${d}</div>`).join('')}</div>`;
  if(s.list) h += `<ul>${s.list.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(s.body) h += `<p class="body">${s.body}</p>`;
  if(s.credit) h += `<p class="credit">${s.credit}</p>`;
  if(s.ctaLine) h += `<div class="cta-line">${s.ctaLine}</div>`;
  if(s.disclaimer) h += `<p class="disclaimer">${s.disclaimer}</p>`;
  if(s.brand) h += `<div class="brandrow">${s.brand}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
