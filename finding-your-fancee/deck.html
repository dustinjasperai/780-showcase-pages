<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Your Home Won't Stay Organized — Finding Your Fancee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5;      /* warm off-white ground (brand light scheme) */
    --panel:#efe7df;   /* lighter beige (brand #d7c8be family) */
    --rule:#d7c8be;    /* brand footer beige */
    --accent:#aba091;  /* brand dominant taupe */
    --ink:#2e2a26;     /* warm near-black */
    --muted:#6f675e;
    --serif:'Marcellus',Georgia,serif;
    --sans:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:64px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:60px;right:60px;bottom:34px;height:1px;background:var(--rule);opacity:.6}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:600;font-size:60px;line-height:1.03;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1.08;margin-bottom:20px}
  .sub{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--muted);margin-top:20px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:40ch}
  p.wide{max-width:52ch}
  .lead{font-size:23px;line-height:1.5}
  ul{list-style:none;margin-top:18px}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:50ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:23px;width:12px;height:2px;background:var(--accent)}
  .part{font-family:var(--sans);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:16px}
  .big{font-family:var(--serif);font-size:52px;font-weight:600;line-height:1.05}
  .kicker{font-size:17px;color:var(--muted);margin-top:16px;max-width:46ch}
  .num{font-family:var(--serif);font-size:30px;color:var(--accent);font-weight:600}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .cta-step{font-family:var(--serif);font-size:30px;font-weight:600;margin-top:10px}
  .brandline{position:absolute;top:28px;right:60px;font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A free live masterclass with Jancee Wright',h1:"Why Your Home Won't Stay Organized",sub:'And the coaching shift that finally makes it stick.'},
  {t:'agenda',part:'What we will cover',h2:'In the next hour',items:[
    'Why the same drawer keeps refilling, no matter how many bins you buy',
    'The mental clutter sitting underneath the physical clutter',
    'Simplify + Systemize: the method that keeps a home organized without you re-doing it']},
  {t:'body',part:'Who this is for',h2:'You have organized this before',lead:"You have organized that pantry, that closet, that paper pile. More than once. It looked beautiful for about a week, and then it quietly slid back to where it started.",kicker:'If you have ever thought "why can I not just keep it nice," this hour is for you.'},
  {t:'body',part:'The trap',h2:'It is not a discipline problem',lead:"The world sells organizing as a shopping trip. Buy the matching bins, follow the trend, make it pretty. So when it falls apart you assume the problem is you.",kicker:'It is not you. It is the approach.'},
  {t:'reframe',big:'You have been organizing the stuff.',sub:'The clutter starts upstream of the stuff.'},
  {t:'part',part:'Part One',big:'The real reason it refills'},
  {t:'body',part:'Part One',h2:'Physical clutter is a symptom',lead:'The piles on the counter are the last step in a chain, not the first. Underneath them sit the decisions you keep postponing and the habits that never got a system.',kicker:'As a certified coach, this is the layer I work on first. Organize the thinking, and the space follows.'},
  {t:'body',part:'Part One',h2:'A project ends. A system runs.',lead:'A big organizing weekend is a project. Projects have an end date, and the mess comes back the moment the project is over.',kicker:'What keeps a home organized is not a harder weekend. It is a system that runs on its own.'},
  {t:'part',part:'Part Two',big:'Simplify + Systemize'},
  {t:'body',part:'Part Two, step one',h2:'Simplify',lead:'Before anything gets a home, it has to earn one. We decide what belongs in the home you are becoming, not the home a catalogue told you to want.',kicker:'Your style, your life, your season. Not Pinterest, and not someone else’s tidy.'},
  {t:'body',part:'Part Two, step two',h2:'Systemize',lead:'Then we build the reusable systems. Not a one-time layout, but a rhythm the whole household can follow without you standing over it.',kicker:'Three systems carry almost everything.'},
  {t:'list',part:'The three systems',h2:'What every home needs',items:[
    'A home for everything, so putting things away takes seconds, not decisions',
    'A time and calendar system, so the week runs on a rhythm instead of reaction',
    'A simple maintenance loop, so small resets replace the giant overwhelm weekend']},
  {t:'body',part:'Why a coached model',h2:'Why this is coaching, not a haul',lead:'A one-time organizer leaves and the systems leave with them. A coached shift teaches you to run it yourself, so the change holds long after the first room is done.',kicker:'That is why I built a membership instead of only booking sessions. Lasting change is a practice, not a purchase.'},
  {t:'part',part:'Part Three',big:'When it finally holds'},
  {t:'list',part:'Part Three',h2:'The home that keeps itself',items:[
    'Spaces you maintain in minutes, because the systems do the remembering',
    'Room, mental and physical, for the things that actually matter to you',
    'A home that looks and feels like you, and stays that way through a busy season']},
  {t:'body',part:'Who is teaching this',h2:'Hi, I am Jancee',lead:'I am a certified life coach and professional organizer, and the founder of Finding Your Fancee. In 2021 I created the first organizing and certified-coaching membership of its kind.',kicker:'I teach women to simplify and systemize so their homes, and their time, finally stay the way they want them.'},
  {t:'recap',part:'In one line',big:'Organize the thinking, systemize the space, and keep it for good.'},
  {t:'cta',eyebrow:'Your next step',h2:'Ready to make it stick?',step:'Join the Finding Simplicity Membership, or book a complimentary consult to build your plan.',disclaimer:'This masterclass is educational. It shares the method and systems I teach; it is not a guarantee of any specific result. Every home and schedule is different, and outcomes vary with the work you put in.'}
];
const deck=document.getElementById('deck');
function esc(x){return x}
S.forEach(s=>{
  const d=document.createElement('section');d.className='slide';
  let h='';
  h+='<span class="brandline">Finding Your Fancee</span>';
  if(s.t==='title'){h+=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.h1}</h1><div class="sub">${s.sub}</div>`}
  else if(s.t==='agenda'||s.t==='list'){h+=`<div class="part">${s.part}</div><h2>${s.h2}</h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`}
  else if(s.t==='body'){h+=`<div class="part">${s.part}</div><h2>${s.h2}</h2><p class="lead wide">${s.lead}</p><p class="kicker">${s.kicker}</p>`}
  else if(s.t==='reframe'||s.t==='recap'){h+=`<div class="big">${s.big}</div>`+(s.sub?`<div class="sub">${s.sub}</div>`:'')}
  else if(s.t==='part'){h+=`<div class="part">${s.part}</div><div class="big">${s.big}</div>`}
  else if(s.t==='cta'){h+=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><div class="cta-step">${s.step}</div><p class="disclaimer">${s.disclaimer}</p>`}
  d.innerHTML=h;deck.appendChild(d);
});
</script>
</body>
</html>
