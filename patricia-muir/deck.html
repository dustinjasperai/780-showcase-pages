<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Executive Encore - A Masterclass with Patricia Muir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f8;        /* warm white ground, honoring the light live site */
    --panel:#ffffff;
    --ink:#2b2630;       /* near-black plum ink */
    --muted:#5b5566;
    --rule:#34495e;      /* their secondary slate blue, 14 uses */
    --accent:#5e566a;    /* their dominant brand plum, 33 uses - single accent */
    --hair:#e4e0e8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--rule);font-family:'Karla',system-ui,sans-serif;color:var(--ink);padding:32px 16px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .slide{background:var(--bg);border-radius:14px;padding:64px 60px;min-height:540px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 10px 40px rgba(20,14,30,.18);overflow:hidden}
  .slide.panel{background:var(--panel)}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:22px}
  h1{font-family:'Newsreader',serif;font-weight:700;font-size:58px;line-height:1.05;
    letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:'Newsreader',serif;font-weight:600;font-size:40px;line-height:1.12;
    margin-bottom:18px}
  h3{font-family:'Newsreader',serif;font-weight:600;font-size:27px;margin-bottom:8px;color:var(--accent);font-style:italic}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:42ch}
  p.lead{font-size:22px;color:var(--ink)}
  .num{position:absolute;top:30px;right:40px;font-size:13px;color:var(--muted);letter-spacing:.1em}
  .tag{position:absolute;top:30px;left:60px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .rule{width:64px;height:3px;background:var(--accent);margin:0 0 26px}
  ul{list-style:none;display:flex;flex-direction:column;gap:16px;margin-top:10px}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding-left:30px;position:relative;max-width:54ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .stairs{display:flex;gap:14px;margin-top:24px;align-items:flex-end}
  .step{flex:1;background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:20px 16px;text-align:center}
  .step .k{font-family:'Newsreader',serif;font-size:24px;color:var(--accent);font-weight:700}
  .step .d{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
  .step.s1{min-height:150px}.step.s2{min-height:190px}.step.s3{min-height:230px}.step.s4{min-height:270px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
  .card{background:var(--panel);border:1px solid var(--hair);border-left:4px solid var(--accent);border-radius:10px;padding:24px}
  .cta{background:var(--accent);color:#fff}
  .cta .eyebrow,.cta h1{color:#fff}
  .cta p{color:#efeaf1}
  .disc{font-size:13px;color:#d9d2de;margin-top:30px;max-width:62ch;line-height:1.5}
  .btn{display:inline-block;margin-top:24px;background:#fff;color:var(--accent);font-weight:700;
    padding:14px 28px;border-radius:30px;font-size:16px}
  .foot{margin-top:28px;font-size:14px;color:var(--muted)}
  .cta .foot{color:#e4ddea}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',cls:'',eyebrow:'A Live Masterclass with Patricia Muir',h1:'The Executive Encore',
  lead:'How accomplished women architect a bold, purposeful next chapter after corporate life, on their own terms.',
  foot:'Remastering Life and Work'},
 {t:'who',cls:'panel',tag:'Who this is for',h:'You led for decades. Now the room is quiet.',
  lead:'This is for women in their 50s, 60s, 70s and beyond who ran teams, built companies and carried the weight, and are now stepping out of corporate life.',
  p2:'You are not finished. You are between chapters. And nobody handed you a map for this one.'},
 {t:'trap',cls:'',tag:'The trap',h:'The word "retirement" is the problem.',
  lead:'It was built for a world that expected you to slow down and disappear. It frames the most experienced season of your life as an ending.',
  p2:'So capable women drift, wait, and quietly wonder if the best part is behind them. It is not.'},
 {t:'reframe',cls:'panel',tag:'The real stakes',rule:true,h:'The loss was never the title. It is the drift.',
  lead:'Losing the role is survivable. Losing your sense of what you are for is what hollows out a retirement.',
  p2:'An encore is not about staying busy. It is about building a chapter that makes you say, "Yes, I am all in."'},
 {t:'p1a',cls:'',tag:'Part one, the core problem',h:'Your identity was fused to the job.',
  bullets:['For years, the honest answer to "who are you" was your title.','When the title goes, the question comes back, and it is louder than you expected.','Rebuilding identity is the first real work of the encore, before any plan or pursuit.']},
 {t:'p1b',cls:'panel',tag:'Part one, the core problem',h:'And you were taught not to ask for help.',
  lead:'The executive who had every answer now believes "I should not need help with this." That belief is the quiet trap.',
  p2:'Women thrive through connection. The transition that is done alone is the one that stalls.'},
 {t:'framework',cls:'',tag:'Part two, the method',eyebrow:'The Executive Encore Framework',
  h:'Four moves from "what now" to "all in."',
  steps:[['Redefine','Reimagine what this chapter is for'],['Restore','Heal from the corporate pace'],['Reset','Inventory strengths, experiment boldly'],['Rise','Step into an empowered new identity']]},
 {t:'redefine',cls:'panel',tag:'The method, 1 of 4',h3:'Redefine',h:'Rewrite the word before you rewrite the plan.',
  lead:'This chapter is not the end of your contribution. It is a deliberate decision about what you want your experience to serve now.',
  p2:'We start here because every plan built on the old definition of "retirement" quietly aims too low.'},
 {t:'restore',cls:'panel',tag:'The method, 2 of 4',h3:'Restore',h:'Permission to catch your breath.',
  lead:'After decades at corporate intensity, rest is not indulgence, it is the condition for clear thinking.',
  p2:'You give yourself the space to adjust and heal, so the next decisions come from fullness, not depletion.'},
 {t:'reset',cls:'',tag:'The method, 3 of 4',h3:'Reset',h:'A four-step remaster.',
  bullets:['Reflect on the passions and values you set aside to lead.','Inventory the strengths you built over a career, they do not expire.','Experiment boldly with new pursuits before committing.','Break the transformation into manageable steps that integrate your past, never erase it.']},
 {t:'rise',cls:'panel',tag:'The method, 4 of 4',h3:'Rise',h:'Step into who you are becoming.',
  lead:'You build an empowered new identity by trusting yourself, realizing your potential through aligned opportunities, and cultivating community.',
  p2:'This is where momentum turns unstoppable, not because you hurried, but because you rebuilt on purpose.'},
 {t:'pillars',cls:'',tag:'What holds it together',h:'Two pillars underneath the four moves.',
  cards:[['Identity Reconstruction','Move beyond the job title to who you are and what you stand for now.'],['Purpose and Fulfillment','Shift from "it is all about the money" to designing a legacy through meaningful work.']]},
 {t:'community',cls:'panel',tag:'The third pillar',h3:'Community-Centered Transition',h:'You were never meant to do this alone.',
  lead:'The most durable encores are built inside a circle of women doing the same work, not in isolation.',
  p2:'Connection is not the soft part of this. It is the mechanism.'},
 {t:'look',cls:'',tag:'Part three, the encore in motion',h:'An encore in motion.',
  bullets:['You wake with a chapter that is yours, not a calendar someone else emptied.','Your decades of judgment finally serve what matters most to you.','You are surrounded by women who get it, and who expect the best of you.','The question "who am I now" has a confident, growing answer.']},
 {t:'whyme',cls:'panel',tag:'Why learn this from me',h:'I spent three decades inside it before I taught it.',
  lead:'Thirty years of Fortune 500 leadership, a certified practice in emotional intelligence assessment, and a community built entirely for women writing their encore.',
  p2:'Executive Encore exists to validate your choices and amplify your voice in this exact season.'},
 {t:'cta',cls:'cta',eyebrow:'Executive Encore',h1:'Ready to architect your encore?',
  lead:'Book a complimentary 45-minute session and we will map your Redefine, Reset, Restore, Rise plan together.',
  btn:'Book your complimentary session',
  disc:'Educational content only. No specific income, career, health, or life result is guaranteed. Results vary and depend on your own circumstances, choices, and effort.',
  foot:'Patricia Muir, Executive Encore, Remastering Life and Work'}
];
const N=S.length;
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const H=(s,i)=>{
 const num=`<div class="num">${i+1} / ${N}</div>`;
 const tag=s.tag?`<div class="tag">${esc(s.tag)}</div>`:'';
 const eb=s.eyebrow?`<div class="eyebrow">${esc(s.eyebrow)}</div>`:'';
 const rl=s.rule?`<div class="rule"></div>`:'';
 const h1=s.h1?`<h1>${esc(s.h1)}</h1>`:'';
 const h3=s.h3?`<h3>${esc(s.h3)}</h3>`:'';
 const h=s.h?`<h2>${esc(s.h)}</h2>`:'';
 const lead=s.lead?`<p class="lead">${esc(s.lead)}</p>`:'';
 const p2=s.p2?`<p style="margin-top:16px">${esc(s.p2)}</p>`:'';
 let bul='';
 if(s.bullets){bul='<ul>'+s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')+'</ul>';}
 let stairs='';
 if(s.steps){stairs='<div class="stairs">'+s.steps.map((st,k)=>`<div class="step s${k+1}"><div class="k">${esc(st[0])}</div><div class="d">${esc(st[1])}</div></div>`).join('')+'</div>';}
 let grid='';
 if(s.cards){grid='<div class="grid">'+s.cards.map(c=>`<div class="card"><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p></div>`).join('')+'</div>';}
 const btn=s.btn?`<a class="btn" href="#">${esc(s.btn)}</a>`:'';
 const disc=s.disc?`<p class="disc">${esc(s.disc)}</p>`:'';
 const foot=s.foot?`<div class="foot">${esc(s.foot)}</div>`:'';
 return `<div class="slide ${s.cls}">${num}${tag}${rl}${eb}${h1}${h3}${h}${lead}${p2}${bul}${stairs}${grid}${btn}${disc}${foot}</div>`;
};
document.getElementById('deck').innerHTML=S.map((s,i)=>H(s,i)).join('');
</script>
</body>
</html>
