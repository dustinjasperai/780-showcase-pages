<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the Doer's Trap: Agency Uplift Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Bitter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f9f4;        /* faint green-tinted off-white, from brand white + green */
    --panel:#ffffff;
    --rule:#e4e8dc;
    --ink:#16261b;       /* deep green-black */
    --muted:#5c6b60;
    --accent:#7ed957;    /* Agency Uplift brand green (brand.json ranked_colors) */
    --accent-deep:#3f7a2b;
    --serif:'Young Serif', Georgia, serif;
    --sans:'Bitter', 'Iowan Old Style', serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(22,38,27,.03)}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent-deep);margin-bottom:18px}
  h1{font-family:var(--serif);font-size:52px;line-height:1.05;font-weight:400;margin-bottom:20px}
  h2{font-family:var(--serif);font-size:36px;line-height:1.1;font-weight:400;margin-bottom:18px}
  h3{font-family:var(--serif);font-size:24px;font-weight:400;margin-bottom:10px}
  p{font-size:19px;color:var(--ink);margin-bottom:14px;max-width:46ch}
  p.lead{font-size:22px}
  .muted{color:var(--muted)}
  .big{font-size:40px;font-family:var(--serif);line-height:1.12;max-width:40ch}
  ul{list-style:none;margin:10px 0}
  li{font-size:19px;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:52ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:4px;background:var(--accent)}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
  .bucket{border:1px solid var(--rule);border-radius:10px;padding:20px 22px;background:var(--bg)}
  .bucket .n{font-family:var(--serif);font-size:30px;color:var(--accent-deep)}
  .bucket h3{margin:6px 0 6px}
  .bucket p{font-size:16px;margin:0;color:var(--muted)}
  .tag{display:inline-block;background:var(--accent);color:#13220f;font-weight:600;
    font-size:13px;padding:5px 12px;border-radius:999px;margin-bottom:22px;align-self:flex-start}
  .rule{height:4px;width:68px;background:var(--accent);border-radius:3px;margin:8px 0 22px}
  .step{display:flex;gap:18px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule)}
  .step:last-child{border-bottom:none}
  .step .k{font-family:var(--serif);font-size:26px;color:var(--accent-deep);min-width:52px}
  .foot{font-size:14px;color:var(--muted);margin-top:26px;max-width:62ch}
  .page{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', tag:'Live masterclass', eyebrow:'Agency Uplift',
   h:"Escape the Doer's Trap",
   p:"The one bottleneck keeping your agency dependent on you, and how to find it before you hire, fire, or build another system.",
   foot:'Agency Uplift with Sean Lang'},

  {t:'content', eyebrow:'Who this is for', h:"You built a team. You still can't step away.",
   body:["This is for agency founders running a real team, somewhere between thirty thousand and a hundred and fifty thousand a month, who are still in every important room.",
         "If the business stalls the week you take off, you are in the right place."]},

  {t:'statement', eyebrow:'The trap', h:"You don't own an agency. You own a job with more hours.",
   p:"More stress, more hours, fewer days off. The agency works when you work, and only when you work. That is the Doer's Trap, and hiring more people usually makes it tighter, not looser."},

  {t:'content', eyebrow:'The reframe', h:"The problem is almost never the person you want to blame.",
   body:["When delivery slips or a client churns, the reflex is to blame a team member. Replace them and the same problem comes back wearing a different face."],
   big:"The real cause sits in one of four places. Most owners never check which."},

  {t:'statement', eyebrow:'Part one, the core idea', h:"Find the root cause before you spend a dollar fixing it.",
   p:"Growth problems feel loud and urgent, so owners fix what is loudest. The fix that actually moves the agency is usually quiet. You have to diagnose before you prescribe."},

  {t:'buckets', eyebrow:'Part two, the framework', h:"The Four-Bucket Diagnostic",
   buckets:[
     {n:'01', h:'Process', p:'Is the work itself undefined, so quality depends on who happens to touch it?'},
     {n:'02', h:'Leadership Clarity', p:'Does the team actually know the direction, the priorities, and what good looks like?'},
     {n:'03', h:'People', p:'Is this the right person in the right seat, or a values and capability mismatch?'},
     {n:'04', h:'Client Fit', p:'Is a wrong-fit client manufacturing chaos the whole team keeps absorbing?'}
   ]},

  {t:'content', eyebrow:'How to read it', h:"Run the symptom through all four buckets.",
   body:["Take the thing frustrating you this week. Ask which bucket it truly lives in. The answer is rarely the first one you reach for, and naming it correctly is most of the fix.",
         "Fix what matters most, not just what is loud."]},

  {t:'statement', eyebrow:'Part two, the operating system', h:"Diagnosis without a rhythm fades in a fortnight.",
   p:"Finding the bucket is the start. Keeping the agency out of the trap takes an operating rhythm that runs whether or not you are in the room."},

  {t:'steps', eyebrow:'The rhythm', h:"Clarity, Visibility, Follow-through",
   steps:[
     {k:'01', h:'Clarity', p:'Every role gets a mission and the few numbers that prove it. No ambiguity about who owns what.'},
     {k:'02', h:'Visibility', p:'Those numbers live on a dashboard everyone can see, so performance is a fact, not a feeling.'},
     {k:'03', h:'Follow-through', p:'A weekly beat where each owner reports their own numbers. Accountability stops running through you.'}
   ]},

  {t:'statement', eyebrow:'Why it works', h:"Accountability that doesn't route through the founder.",
   p:"When people report their own numbers against a clear mission, you stop being the person who chases, reminds, and double-checks. The rhythm does the chasing."},

  {t:'list', eyebrow:'The people question', h:"The Team Member Audit",
   p:"Ambiguity kills growth. Before you hire again, get clarity on the team you have.",
   items:["Who is actually doing what, written down honestly",
          "Who fits the values the agency runs on",
          "Who drives leverage, and who only adds motion"],
   foot:"Clarity here is what unlocks scale, stability, and sanity."},

  {t:'list', eyebrow:'Part three, what changes', h:"Three shifts an agency makes when it leaves the trap.",
   items:["Systematized accountability, so the numbers are owned, not nagged",
          "A strong culture that holds the standard when you are not watching",
          "A founder identity shift, from doer to the person who leads the doers"]},

  {t:'statement', eyebrow:'The identity shift', h:"From being the bottleneck to being the CEO.",
   p:"The hardest change is not a system. It is deciding to stop being the best technician in your own company and start being the person who builds the people who do the work."},

  {t:'list', eyebrow:'The week off test', h:"A business that keeps running after you leave the room.",
   items:["A team that owns outcomes, not just tasks",
          "A delivery system that scales with quality instead of heroics",
          "Financial clarity that ends the feast or famine cycle",
          "A week off that does not cost you the month"]},

  {t:'content', eyebrow:'Why me', h:"I built the trap, then built my way out of it.",
   body:["I scaled my own agency past a hundred and fifty thousand a month with a team of fifty plus, learned the Doer's Trap the hard way, and then sold the business. Everything here is the methodology I used, and now use with the founders I coach.",
         "Over a hundred and sixty episodes of the Agency Uplift Podcast come from the same place."]},

  {t:'statement', eyebrow:'Your first move', h:"Diagnose your agency across the four buckets.",
   p:"You can run the Four-Bucket Diagnostic on your own agency this week. Take your loudest problem, find its real bucket, and fix that one thing first."},

  {t:'cta', eyebrow:'Next step', h:"Get your Strategic Unlock Diagnostic",
   p:"If you want the full picture, I will map your agency across the whole methodology, show you the strengths and the gaps on a framework radar chart, and give you a sequence to fix what matters most. From there you can execute solo, or move faster inside the Agency Uplift Accelerator.",
   disclaimer:"Educational content only. No specific result is guaranteed. Results vary with your market, team, and execution.",
   foot:"Agency Uplift, agencyuplift.co"}
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  const deck=document.getElementById('deck');
  deck.innerHTML=S.map(function(s){
    let inner='';
    if(s.tag) inner+='<span class="tag">'+esc(s.tag)+'</span>';
    if(s.eyebrow) inner+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
    if(s.t==='title'||s.t==='cta'){ inner+='<h1>'+esc(s.h)+'</h1>'; }
    else { inner+='<h2>'+esc(s.h)+'</h2>'; }
    if(s.t==='buckets'){
      inner+='<div class="rule"></div><div class="buckets">'+s.buckets.map(function(b){
        return '<div class="bucket"><div class="n">'+esc(b.n)+'</div><h3>'+esc(b.h)+'</h3><p>'+esc(b.p)+'</p></div>';
      }).join('')+'</div>';
    }
    if(s.t==='steps'){
      inner+='<div class="rule"></div>'+s.steps.map(function(st){
        return '<div class="step"><div class="k">'+esc(st.k)+'</div><div><h3>'+esc(st.h)+'</h3><p>'+esc(st.p)+'</p></div></div>';
      }).join('');
    }
    if(s.p && s.t!=='buckets' && s.t!=='steps') inner+='<p class="lead'+(s.t==='title'||s.t==='cta'?' muted':'')+'">'+esc(s.p)+'</p>';
    if(s.body) inner+=s.body.map(function(b){return '<p>'+esc(b)+'</p>';}).join('');
    if(s.big) inner+='<p class="big">'+esc(s.big)+'</p>';
    if(s.items) inner+='<ul>'+s.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';
    if(s.foot && s.t!=='cta') inner+='<p class="muted" style="margin-top:8px">'+esc(s.foot)+'</p>';
    if(s.disclaimer) inner+='<p class="foot">'+esc(s.disclaimer)+'</p>';
    if(s.t==='cta'&&s.foot) inner+='<div class="page">'+esc(s.foot)+'</div>';
    if(s.t==='title'&&s.foot) inner+='<div class="page">'+esc(s.foot)+'</div>';
    return '<section class="slide'+(s.t==='cta'?' cta':'')+'">'+inner+'</section>';
  }).join('');
}
render();
</script>
</body>
</html>
