<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sell Beyond Social, a Modern Direct Seller Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcf8f4;        /* warm ivory ground (brand/social assets) */
    --panel:#f5ece3;     /* soft panel */
    --ink:#20343b;       /* charcoal-teal ink */
    --accent:#e8637d;    /* coral-pink, Modern Direct Seller signature */
    --teal:#2a9d8f;      /* teal counterpoint */
    --rule:#e3d6c8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;padding:52px 48px;margin:0 0 22px;
    min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:20px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--teal);font-weight:600}
  .kick{font-family:"Poppins";font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Poppins";font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:"Poppins";font-weight:600;font-size:34px;line-height:1.12;letter-spacing:-.01em}
  p{font-size:19px;line-height:1.6;max-width:62ch;margin-top:16px;color:#33474e}
  .lead{font-size:22px}
  ul{margin:20px 0 0 0;list-style:none;display:grid;gap:12px}
  li{font-size:19px;line-height:1.45;padding-left:30px;position:relative;color:#2b3f46}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
  .pill{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px}
  .pill .t{font-family:"Poppins";font-weight:600;font-size:21px;color:var(--teal)}
  .pill p{font-size:16px;margin-top:8px}
  .big{font-family:"Poppins";font-weight:700;font-size:72px;color:var(--accent);line-height:1}
  .title-slide{background:linear-gradient(160deg,var(--panel),var(--bg));border-color:var(--accent)}
  .by{margin-top:30px;font-family:"Poppins";font-weight:600;color:var(--ink)}
  .by span{display:block;font-family:"Inter";font-weight:400;color:var(--teal);font-size:16px;margin-top:4px}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);color:#9aa7ab}
  .cta-slide{background:linear-gradient(160deg,var(--teal),#20343b);border:none;color:#fdf6ef}
  .cta-slide h2,.cta-slide h1{color:#fdf6ef}
  .cta-slide p{color:#eadfce}
  .cta-slide .kick{color:#ffd9c2}
  .cta-btn{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;font-family:"Poppins";font-weight:600;
    padding:15px 30px;border-radius:40px;font-size:18px}
  .disclaimer{margin-top:26px;font-size:13px;color:#cdbfab;max-width:70ch;line-height:1.5}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A free live masterclass', h:'Sell Beyond Social',
    p:'The modern direct seller’s system to build an audience you actually own.',
    by:'Becky Launder', sub:'Founder, Modern Direct Seller'},

  {t:'promise', kick:'What you’ll walk away with',
    h:'A daily plan, and a way to turn followers into customers you own',
    p:'In the next hour you’ll see exactly how to stop depending on the feed and the company page, and start building a business that keeps growing even when the algorithm changes.'},

  {t:'who', kick:'Who this is for',
    h:'The seller who is busy, but stuck',
    bullets:['You post every day and still feel like you’re starting from zero each month',
      'Your Facebook group and online parties don’t pull the way they used to',
      'Your results live and die on reach you don’t control',
      'You know you’re good at this, but there’s no system underneath it']},

  {t:'reframe', kick:'The hard truth',
    h:'You don’t own your business. You’re renting it.',
    p:'Your audience lives on a platform that can change the rules overnight, and your brand is borrowed from the company. The sellers who last are the ones who quietly moved their people onto ground they own.'},

  {t:'part', kick:'Part one', h:'The problem: rented land',
    p:'Every follower on social is a lead you can’t reliably reach again. When the feed decides who sees your post, your income becomes a lottery. The fix isn’t more posting. It’s ownership.'},

  {t:'part', kick:'Part one', h:'Sell beyond social',
    p:'Selling beyond social means two things: a personal brand that is yours, not the company’s, and channels you own, email, text, and a simple way to capture and keep the people who raise their hand.'},

  {t:'framework', kick:'Part two, the system', h:'Content, Capture, Convert',
    pillars:[
      {t:'Content', p:'Show up with content that builds real relationships, not just product drops. You become the person worth following.'},
      {t:'Capture', p:'Move the people who engage off the feed and onto a list you own, with a simple reason to join.'},
      {t:'Convert', p:'Nurture that owned audience so they buy again and again, on your timing, not the algorithm’s.'}
    ]},

  {t:'detail', kick:'Part two', h:'Capture is the step everyone skips',
    p:'A like is not a lead. A comment is not a customer. The whole game is turning attention you don’t control into contacts you do, before the feed buries you. That one habit changes everything downstream.'},

  {t:'number', kick:'Part two, the daily plan', h:'3 + 3 + 3 = 3000',
    big:'3+3+3',
    p:'Three new connections, three follow-ups, and three relationship touches a day. Nine small actions, about nine minutes, and over a year it compounds into more than three thousand new people in your world.'},

  {t:'detail', kick:'Part two', h:'The 300 Club',
    p:'Run it as a quarter-long challenge: three hundred meaningful new connections every ninety days. Pipeline stops being something you hope for and becomes something you build on purpose.'},

  {t:'part', kick:'Part three', h:'Your business, 90 days from here',
    bullets:['A list of people you can reach any time, without paying for reach',
      'A personal brand that would survive you switching companies',
      'A daily rhythm you can actually keep, even on a full day',
      'Sales that come from relationships, not from chasing or spamming']},

  {t:'why', kick:'Why listen to me',
    h:'I built this the modern way, after doing it the old way',
    p:'A master’s in leadership, ten years training leaders in the corporate world, and a run as a multi-million-dollar direct sales team leader. Now I train tens of thousands of sellers across more than a hundred companies on exactly this system.'},

  {t:'cta', kick:'Your next step', h:'Come build this with me',
    p:'Inside the Modern Direct Seller Academy you get the full Content, Capture, Convert system, the toolkits, and coaching to put it to work in your business this month.',
    btn:'Join the Modern Direct Seller Academy',
    disc:'This masterclass is educational. No income or result is guaranteed. Results vary and depend on your own effort, market, and consistency.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='title'?' title-slide':'')+(s.t==='cta'?' cta-slide':'');
  let inner='<div class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</div>';
  if(s.kick) inner+='<div class="kick">'+s.kick+'</div>';
  if(s.h) inner+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) inner+='<div class="big">'+s.big+'</div>';
  if(s.p) inner+='<p'+(s.t==='promise'||s.t==='title'?' class="lead"':'')+'>'+s.p+'</p>';
  if(s.pillars){inner+='<div class="pillars">';s.pillars.forEach(x=>{inner+='<div class="pill"><div class="t">'+x.t+'</div><p>'+x.p+'</p></div>';});inner+='</div>';}
  if(s.bullets){inner+='<ul>';s.bullets.forEach(b=>inner+='<li>'+b+'</li>');inner+='</ul>';}
  if(s.by) inner+='<div class="by">'+s.by+'<span>'+s.sub+'</span></div>';
  if(s.btn) inner+='<div><span class="cta-btn">'+s.btn+'</span></div>';
  if(s.disc) inner+='<div class="disclaimer">'+s.disc+'</div>';
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
