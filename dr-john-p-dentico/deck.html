<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leadership Is a Practice You Rehearse | Dr. John P. Dentico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#17191c; --panel:#212429; --rule:#363b41;
    --accent:#ffa500; --ink:#f5f5f5; --ink-soft:#c3c7cc; --ink-mute:#8a9099;
  }
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:'Lato',system-ui,sans-serif;line-height:1.6;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;}
  .slide{display:none;width:100%;max-width:960px;}
  .slide.on{display:block;animation:f .4s ease;}
  @keyframes f{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kicker{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(30px,5.4vw,58px);line-height:1.08;letter-spacing:-.01em;margin-bottom:20px;}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(24px,3.8vw,40px);line-height:1.15;margin-bottom:18px;}
  p.lead{font-size:clamp(17px,2.1vw,22px);color:var(--ink-soft);max-width:44ch;}
  p.sub{font-size:15px;color:var(--ink-mute);margin-top:18px;}
  ul{list-style:none;margin-top:10px;}
  ul li{position:relative;padding-left:30px;margin-bottom:16px;font-size:clamp(16px,2vw,20px);color:var(--ink-soft);max-width:52ch;}
  ul li::before{content:"";position:absolute;left:0;top:.62em;width:14px;height:3px;background:var(--accent);}
  .big{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(44px,9vw,104px);color:var(--accent);line-height:1;}
  .frame-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:24px;}
  .frame{flex:1;min-width:210px;background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--accent);padding:22px;}
  .frame h3{font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;margin-bottom:8px;}
  .frame p{font-size:15px;color:var(--ink-mute);}
  .disc{font-size:13px;color:var(--ink-mute);margin-top:26px;max-width:60ch;}
  .credit{font-size:15px;color:var(--ink-soft);margin-top:6px;}
  .cta-line{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(18px,2.4vw,24px);color:var(--accent);margin-top:20px;}
  #nav{position:fixed;bottom:22px;right:26px;font-family:'Montserrat',sans-serif;font-size:13px;color:var(--ink-mute);display:flex;gap:14px;align-items:center;}
  #nav button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);font:inherit;padding:7px 13px;cursor:pointer;}
  #nav button:hover{border-color:var(--accent);color:var(--accent);}
  #bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;transition:width .3s;}
  .wm{position:fixed;bottom:22px;left:26px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div class="wm">Throttle Up Leadership</div>
<div id="nav"><button onclick="go(-1)">Prev</button><span id="count"></span><button onclick="go(1)">Next</button></div>
<script>
const S=[
 {t:'title', kicker:'A Throttle Up Leadership Masterclass', h:"Leadership Is a Practice You Rehearse", lead:"Why the best leaders are not born with it, and what a flight crew knows that most training rooms forget.", sub:"With Dr. John P. Dentico, Throttle Up Leadership"},

 {t:'who', kicker:'Who this is for', h:"If you lead people, and it still feels like guesswork", list:["You run a team, a division, or a whole organization.","You have sat through leadership training that felt true in the room and evaporated by Monday.","You suspect your best people are quietly checked out, and you are right."]},

 {t:'stat', kicker:'The trap', h:"We keep studying leadership instead of practicing it", big:"68%", lead:"of the workforce is disengaged. We respond with more books, more frameworks, more content. None of it is reps."},

 {t:'hook', kicker:'The reframe', h:"Leadership does not live inside a person. It lives in what you do under pressure.", lead:"It is not a trait you were handed. It is an intended action, repeated, until it holds when the room gets hard. That changes how you build it."},

 {t:'section', kicker:'Part One', h:"Why the training does not stick"},

 {t:'list', kicker:'The core problem', h:"Knowing is not the same as doing", list:["A pilot does not read about the engine failure. They fly it in the simulator until the response is automatic.","Leadership is the same. The moment that matters is live, fast, and emotional.","You cannot lecture your way to a reflex. You have to rehearse it."]},

 {t:'list', kicker:'The cost of getting it wrong', h:"What disengagement is really telling you", list:["47% of people have considered leaving over a mismatch in values.","Trust in managers fell from 46% to 29% in two years.","This is not a pay problem. Meaning is the new money."]},

 {t:'section', kicker:'Part Two', h:"The LeadSimm practice field"},

 {t:'list', kicker:'The method', h:"A practice field for leadership, no computer required", list:["LeadSimm is a live simulation built over 25 years of real-world use.","Leaders rehearse hard calls in a controlled space, then debrief what actually happened.","It has been used on counter-terrorism, airport security, emergency response, and crisis command."]},

 {t:'frames', kicker:'The diagnostic', h:"Before you fix anything, read the three frames", frames:[["Belonging","Do people experience values alignment, or are they quietly misaligned?"],["Personal agency","Can they act, decide, and own outcomes, or are they waiting for permission?"],["Growth trajectory","Can they see a future here, or have they already left in their mind?"]]},

 {t:'list', kicker:'The operating system', h:"Throttle Up OS turns the reads into moves", list:["Mission clarity, so the team knows what they are actually for.","Strategic thinking capacity, built deliberately instead of hoped for.","A development infrastructure, so leadership keeps compounding after you leave the room."]},

 {t:'hook', kicker:'The shift', h:"Stop asking who is a leader. Start asking what leadership is being practiced here.", lead:"The question moves leadership out of personality and into something you can build, measure, and improve on purpose."},

 {t:'section', kicker:'Part Three', h:"Inside an organization that practices leadership"},

 {t:'list', kicker:'The arc', h:"From a disengaged team to a practiced one", list:["Diagnose the three frames honestly, with language your people will actually use.","Run the simulation. Let leaders fail safely, then rebuild the response.","Install the operating system so the practice outlives the workshop."]},

 {t:'credit', kicker:'Why me', h:"This has been tested where the stakes were real", credit:"Dr. John P. Dentico holds a Doctorate in Leadership Studies, is a certified AI Management Professional, and is a retired U.S. Navy Reserve Commander. He spent twelve years with the LEEDA program at the FBI Academy and ten years with the Division of Public Safety Leadership at Johns Hopkins University. His work has reached the FBI Academy, the Defense Intelligence Agency, IBM, and public safety leaders across the country."},

 {t:'cta', kicker:'Your next step', h:"Lead it, do not just learn it", lead:"If this is the conversation your organization needs to have, start with a free discovery call and we will read your three frames together.", cta:"Book your free discovery call at throttleupleadership.com", disc:"This masterclass is educational. No income or result is guaranteed. Results vary with your organization, your people, and your own practice."}
];

const stage=document.getElementById('stage');
const bar=document.getElementById('bar');
const count=document.getElementById('count');
let i=0;
function render(){
 const s=S[i];
 let h='';
 if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
 if(s.h) h+= (s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
 if(s.big) h+='<div class="big">'+s.big+'</div>';
 if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
 if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
 if(s.frames){h+='<div class="frame-row">';s.frames.forEach(f=>h+='<div class="frame"><h3>'+f[0]+'</h3><p>'+f[1]+'</p></div>');h+='</div>';}
 if(s.credit) h+='<p class="credit">'+s.credit+'</p>';
 if(s.cta) h+='<div class="cta-line">'+s.cta+'</div>';
 if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
 if(s.disc) h+='<p class="disc">'+s.disc+'</p>';
 stage.innerHTML='<div class="slide on">'+h+'</div>';
 bar.style.width=((i+1)/S.length*100)+'%';
 count.textContent=(i+1)+' / '+S.length;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
