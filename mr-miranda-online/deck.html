<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Fear to Confidence - The GHOST BUST Method for Cambridge Maths &amp; Physics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfdfb;        /* brand light ground */
    --panel:#f3f8f3;     /* brand near-white panel (#f3f8f3, 4 uses) */
    --ink:#2d2d2d;       /* brand dominant ink (#2d2d2d, 11 uses) */
    --muted:#696969;     /* brand gray */
    --accent:#94bbe4;    /* brand signature sky blue (10 uses) */
    --accent-deep:#3f72af;/* readable darkened sky blue for text accents */
    --gold:#fbd453;      /* brand gold spark (8 uses) */
    --rule:#d8e4f0;      /* tint of sky blue */
    --display:"Quicksand",system-ui,sans-serif;
    --body:"Open Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:1040px;animation:fade .4s ease}
  .slide.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent-deep);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.4vw,60px);line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.6vw,42px);line-height:1.12;margin-bottom:16px}
  p,li{font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:var(--ink);max-width:46ch}
  .sub{color:var(--muted);margin-top:18px;max-width:52ch}
  .lead{font-size:clamp(20px,2vw,27px);line-height:1.4}
  ul{margin-top:18px;padding-left:0;list-style:none}
  ul li{position:relative;padding-left:30px;margin:12px 0;max-width:50ch}
  ul li::before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .rungs{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .rung{display:flex;align-items:center;gap:16px;background:var(--panel);border-left:5px solid var(--accent);padding:14px 20px;border-radius:10px}
  .rung b{font-family:var(--display);font-size:clamp(18px,1.7vw,23px);color:var(--accent-deep);min-width:118px}
  .rung span{color:var(--ink);font-size:clamp(15px,1.4vw,19px)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:20px}
  .card{background:var(--panel);border-radius:14px;padding:26px 28px;border-top:5px solid var(--gold)}
  .card.sky{border-top-color:var(--accent)}
  .card h3{font-family:var(--display);font-weight:700;font-size:22px;margin-bottom:10px;color:var(--accent-deep)}
  .card p{font-size:16px;color:var(--ink)}
  .big{font-family:var(--display);font-weight:700;font-size:clamp(46px,7vw,84px);color:var(--accent-deep);line-height:1}
  .quote{font-family:var(--display);font-weight:500;font-size:clamp(20px,2.2vw,30px);line-height:1.35;max-width:40ch}
  .quote .who{display:block;font-family:var(--body);font-size:16px;color:var(--muted);margin-top:16px;font-weight:500}
  .steps{columns:2;column-gap:40px;margin-top:18px}
  .steps li{margin:8px 0;break-inside:avoid}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:24px;font-family:var(--display);font-weight:600;font-size:18px;background:var(--accent-deep);color:#fff;padding:15px 30px;border-radius:10px}
  .cta-btn.ghost{background:transparent;color:var(--accent-deep);border:2px solid var(--accent);margin-left:12px}
  .brand{font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px;margin-top:30px;letter-spacing:.02em}
  .nav{position:fixed;bottom:18px;right:22px;font-family:var(--body);font-size:13px;color:var(--muted);display:flex;gap:14px;align-items:center}
  .nav button{font:inherit;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer}
  .count{position:fixed;bottom:20px;left:22px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .bar{height:4px;background:var(--rule);border-radius:2px;margin-top:22px;max-width:360px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:60%}
</style>
</head>
<body>
<main id="stage"></main>
<div class="count" id="count"></div>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S = [
  {t:'title',
   eyebrow:'A Cambridge Maths &amp; Physics Masterclass',
   h:'From Fear to Confidence',
   lead:'How the GHOST BUST Method takes a self-studying student from first contact with a concept to mastering Cambridge&rsquo;s hardest questions.',
   brand:'S&eacute;rgio Miranda &middot; Mr. Miranda Online'},

  {t:'content',
   eyebrow:'Who this is for',
   h:'If you are learning Cambridge on your own',
   bullets:['Homeschoolers sitting CAIE A-Level Maths or Physics',
            'Private candidates with no school behind them',
            'Driven learners aiming for top universities',
            'Parents guiding a capable student who feels stuck'],
   sub:'You do not need to be a genius to succeed in Cambridge Maths or Physics. You need a map.'},

  {t:'content',
   eyebrow:'The trap',
   h:'More resources did not fix it',
   bullets:['Scattered videos, textbooks and past papers, none joined up',
            'Hours of study that never quite become a grade',
            'Second-guessing whether you are even revising the right things',
            'Doing it alone, so every doubt feels like proof you cannot do it'],
   sub:'Isolation from online study leaves capable students questioning their own ability.'},

  {t:'statement',
   eyebrow:'The reframe',
   big:'It is not ability.',
   lead:'It is that nobody gave you a method. Cambridge is a game with rules, and the rules can be taught, step by step.'},

  {t:'content',
   eyebrow:'Part one &middot; the real problem',
   h:'Information is not understanding',
   bullets:['A pile of resources teaches facts, not how to think with them',
            'Exams reward applying, analysing and evaluating, not memorising',
            'Without a ladder from one skill to the next, hard questions feel random',
            'Panic in the exam room is almost always a method gap, not a knowledge gap'],
   sub:'So we teach the thinking itself, in a fixed order, until the hard questions stop being a surprise.'},

  {t:'statement',
   eyebrow:'What it is costing',
   big:'Months of effort, graded below your real level.',
   lead:'Capable students lose whole exam cycles to guesswork. The method is what converts the effort into the grade.'},

  {t:'content',
   eyebrow:'Part two &middot; the method',
   h:'The GHOST BUST Framework',
   lead:'Built on Bloom&rsquo;s Taxonomy. It walks you up the two halves of real mastery, in order, so confidence is built and not hoped for.',
   bullets:['GHOST handles the foundational skills: remembering, understanding, applying',
            'BUST handles the advanced skills: analysing, evaluating, creating']},

  {t:'rungs',
   eyebrow:'GHOST &middot; from first contact to solid ground',
   h:'Build the foundation',
   rungs:[['Grab','Meet the concept clearly, with no clutter'],
          ['Hold','Keep it through worked examples and notes'],
          ['Own','Make it yours with guided practice'],
          ['Settle','Steady it until it stops feeling shaky'],
          ['Triumph','Apply it to real exam-style questions']],
   sub:'Direct instruction and guided practice, moving from first contact to thorough application.'},

  {t:'rungs',
   eyebrow:'BUST &middot; become a master of Cambridge&rsquo;s game',
   h:'Climb to mastery',
   rungs:[['Brainstorm','Open the problem up from every angle'],
          ['Unravel','Break the hard question into parts you know'],
          ['Simplify','Strip it back to the principle underneath'],
          ['Teach','Explain it so clearly you could teach it back']],
   sub:'Peer interaction and open-ended challenge, until the toughest questions are yours.'},

  {t:'content',
   eyebrow:'Part two &middot; your plan',
   h:'A plan that adapts to you',
   lead:'No generic timetable will do the job. Yours is built from three honest questions.',
   bullets:['Where you are now, topic by topic',
            'Where you want to be, your real target grade',
            'How much time you have, counting back from the exam date'],
   sub:'Then time is given to your weakest topics first, with the final two weeks reserved for past papers only.'},

  {t:'steps',
   eyebrow:'The study-plan build',
   h:'Nine steps, once',
   steps:['Choose subjects and set exam dates',
          'Count the weeks you actually have',
          'Reserve the last two weeks for past papers',
          'List every chapter',
          'Rate your understanding, one to ten',
          'Enter the study hours you can give each week',
          'Give the most time to the lowest ratings',
          'Fit all subjects into one schedule',
          'Print it and follow it with discipline']},

  {t:'two',
   eyebrow:'Part three &middot; how it feels',
   h:'What a week looks like',
   cards:[['Structure, not scramble','A clear route through the syllabus with lessons, notes and solved questions in one place.'],
          ['Practice that counts','Progressive exercises and end-of-chapter assessments that show you what is really sticking.'],
          ['Live support','Weekly timetabled sessions, marked work and small-group guidance when you want a person beside you.'],
          ['A mock that matters','A fully marked mock exam and progress reports, so exam day is a repeat, not a shock.']]},

  {t:'two',
   eyebrow:'How we teach',
   h:'Three principles behind every lesson',
   cards:[['Simplicity and focus','Simplify the complex and master the essentials first, so the foundation is solid.'],
          ['Connecting the dots','Link ideas together so you see the bigger picture, not isolated facts.'],
          ['Empathy','Teaching shaped around how you actually feel and where you actually are.']]},

  {t:'statement',
   eyebrow:'Why me',
   big:'23 years, one subject I love.',
   lead:'I am S&eacute;rgio Miranda. I have taught Physics, Maths and Chemistry since 2001, in Portugal, the Azores, the United States, London and at an international school in Braga, and guided many students into top universities.'},

  {t:'quote',
   eyebrow:'In their words',
   quote:'&ldquo;Your teaching was instrumental in helping me achieve the grades I needed to get into the University of Manchester for my Engineering studies.&rdquo;',
   who:'Pratik Panthee, Mechanical Engineer'},

  {t:'quote',
   eyebrow:'In their words',
   quote:'&ldquo;Just trust Mr. Miranda like I did and, believe me, you will be getting that acceptance letter to your dream university.&rdquo;',
   who:'Margarida Martins, Medicine Student'},

  {t:'cta',
   eyebrow:'Your next step',
   h:'Start where you are',
   lead:'Begin free with ACCESS and follow a clear Cambridge pathway today. When you want structure, live support or close personal guidance, the ACCESS pathway and Private Mentorship are there.',
   bullets:['Free ACCESS: lessons, notes and solved questions in one place',
            'ACCESS PRO and ULTRA: the full GHOST BUST pathway with support',
            'Private Mentorship: apply for one-to-one guidance to exam day'],
   cta:'Start learning for free',
   cta2:'Apply for mentorship',
   brand:'mrmiranda.online',
   disc:'Educational content only. Outcomes depend on each student&rsquo;s effort, starting point and circumstances; no specific grade or university result is guaranteed.'}
];

const stage=document.getElementById('stage');
const count=document.getElementById('count');
let i=0;
function slideHTML(s){
  const eb = s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:'';
  const brand = s.brand?`<div class="brand">${s.brand}</div>`:'';
  if(s.t==='title') return `${eb}<h1>${s.h}</h1><p class="sub lead">${s.lead}</p><div class="bar"><i></i></div>${brand}`;
  if(s.t==='statement') return `${eb}<div class="big">${s.big}</div><p class="lead" style="margin-top:22px">${s.lead}</p>`;
  if(s.t==='quote') return `${eb}<p class="quote">${s.quote}<span class="who">${s.who}</span></p>`;
  if(s.t==='rungs'){
    const r=s.rungs.map(x=>`<div class="rung"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
    const lead=s.lead?`<p class="lead" style="margin-bottom:6px">${s.lead}</p>`:'';
    return `${eb}<h2>${s.h}</h2>${lead}<div class="rungs">${r}</div>${s.sub?`<p class="sub">${s.sub}</p>`:''}`;
  }
  if(s.t==='two'){
    const c=s.cards.map((x,n)=>`<div class="card ${n%2?'sky':''}"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('');
    return `${eb}<h2>${s.h}</h2><div class="two">${c}</div>`;
  }
  if(s.t==='steps'){
    const l=s.steps.map(x=>`<li>${x}</li>`).join('');
    return `${eb}<h2>${s.h}</h2><ul class="steps">${l}</ul>`;
  }
  if(s.t==='cta'){
    const l=(s.bullets||[]).map(x=>`<li>${x}</li>`).join('');
    return `${eb}<h2>${s.h}</h2><p class="lead">${s.lead}</p><ul>${l}</ul>`+
      `<div><span class="cta-btn">${s.cta}</span><span class="cta-btn ghost">${s.cta2}</span></div>`+
      `<div class="brand">${s.brand}</div><p class="disc">${s.disc}</p>`;
  }
  // content
  const lead=s.lead?`<p class="lead" style="margin-bottom:6px">${s.lead}</p>`:'';
  const l=(s.bullets||[]).map(x=>`<li>${x}</li>`).join('');
  const ul=l?`<ul>${l}</ul>`:'';
  return `${eb}<h2>${s.h}</h2>${lead}${ul}${s.sub?`<p class="sub">${s.sub}</p>`:''}`;
}
function render(){
  stage.innerHTML=`<section class="slide on">${slideHTML(S[i])}</section>`;
  count.textContent=`${i+1} / ${S.length}`;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render()}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(1);
  if(e.key==='ArrowLeft')go(-1);
});
render();
</script>
</body>
</html>
