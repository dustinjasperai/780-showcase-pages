<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create. Serve. Build. A Masterclass with Kathi Lipp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffbf4; --panel:#ffffff; --ink:#282e46; --accent:#be3837; --amber:#f0a94f;
    --muted:#6b6f80; --rule:#e8e0d2;
    --head:"Merriweather",Georgia,serif; --body:"Open Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto}
  .slide{min-height:94vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 7vw;border-bottom:1px solid var(--rule);position:relative}
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:900;font-size:clamp(34px,6vw,62px);line-height:1.08;
    letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(26px,4.4vw,42px);line-height:1.14}
  .sub{font-size:clamp(17px,2.2vw,22px);color:var(--muted);margin-top:22px;max-width:30ch}
  .lead{font-size:clamp(19px,2.4vw,24px);margin-top:20px;max-width:34ch}
  .big{font-family:var(--head);font-weight:900;font-size:clamp(30px,5.2vw,54px);line-height:1.1}
  .accent{color:var(--accent)}
  .amber{color:#b9791f}
  ul{margin-top:26px;list-style:none;display:grid;gap:16px}
  li{font-size:clamp(16px,2vw,20px);padding-left:28px;position:relative}
  li:before{content:"";position:absolute;left:0;top:.6em;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .pillar{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-top:10px}
  .pnum{font-family:var(--head);font-weight:900;font-size:clamp(40px,7vw,86px);color:var(--amber);
    line-height:.9}
  .foot{position:absolute;bottom:28px;left:7vw;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 34px;
    margin-top:24px;box-shadow:0 10px 30px rgba(40,46,70,.05)}
  .disc{font-size:13px;color:var(--muted);margin-top:30px;max-width:52ch;line-height:1.5}
  .cta{font-family:var(--head);font-weight:700;font-size:clamp(20px,2.6vw,26px);margin-top:14px}
  .step{font-size:clamp(16px,2vw,19px);margin-top:14px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:"A live masterclass with Kathi Lipp",
    h:'Create. <span class="accent">Serve.</span> Build.',
    sub:"How to grow a readership around the book you are writing. Writing at the Red House." },

  {t:'lead', kick:"The promise",
    h:"By the end of this hour",
    lead:"you will know the three moves that turn a finished manuscript into a book people actually read, and the simplest order to run them in." },

  {t:'lead', kick:"Who this is for",
    h:"You have a true story. The world has never heard it.",
    lead:"You are a writer with a message, maybe a finished draft, and a quiet, growing worry that nobody is waiting to read it." },

  {t:'lead', kick:"The trap",
    h:"You were told one thing: just finish the book.",
    lead:"So you wrote in the quiet, hit publish, and heard silence. The advice was not wrong. It was only half the job." },

  {t:'hook', kick:"The reframe",
    big:'A finished book with no readers is a <span class="accent">drawer</span>, not a career.',
    sub:"Finishing was never the hard part. Being found is." },

  {t:'part', kick:"Part One", h:"Why good books go unread" },

  {t:'body', kick:"The backwards order",
    h:"Most writers build in the wrong sequence.",
    items:[
      "Book first. Audience, somehow, later.",
      "Launch to the same few friends, every time.",
      "Blame the writing when the problem was the readership." ] },

  {t:'body', kick:"The real shape",
    h:"An author needs three things running at once.",
    items:[
      "The writing itself, mapped so it gets finished.",
      "A reader you actually show up for, before you sell.",
      "A platform that keeps bringing new readers in." ] },

  {t:'part', kick:"Part Two",
    h:'The Compass: <span class="accent">Create. Serve. Build.</span>' },

  {t:'pillar', kick:"Pillar one", n:"1", h:"Create",
    lead:"Write the true story, mapped. Book Mapping turns the idea rambling in your head into a plan you can finish, chapter by chapter, instead of staring at a blank page." },

  {t:'pillar', kick:"Pillar two", n:"2", h:"Serve",
    lead:"Show up for the one reader you are for. Give value before you ask for anything, through the podcast, the posts, the free plan. Service is how strangers become readers." },

  {t:'pillar', kick:"Pillar three", n:"3", h:"Build",
    lead:"Build the platform around the book. An email list, a simple rhythm, a way for people who have never heard of you to find you. This is the part the drawer is missing." },

  {t:'body', kick:"Create, in practice",
    h:"Book Mapping",
    items:[
      "Start with structure, not a blank first page.",
      "A proven plan and trusted guides, so overwhelm stops stopping you.",
      "The draft gets finished because the map was drawn first." ] },

  {t:'body', kick:"Build, in practice",
    h:"The 7-Day Platform Plan",
    items:[
      "You do not need ten thousand followers. You need seven days and a plan.",
      "Build the first real version of an author platform from zero.",
      "Then keep it fed, a little, every week." ] },

  {t:'part', kick:"Part Three", h:"Inside the Red House" },

  {t:'body', kick:"The Red House rhythm",
    h:"Craft as hospitality, not hustle.",
    items:[
      "Write-Along sessions where the pages actually get written.",
      "Coaching and check-ins, so you are never guessing alone.",
      "A warm community, and retreats in the mountains when you are ready." ] },

  {t:'lead', kick:"Why me",
    h:"I have walked this exact path.",
    lead:"I am Kathi Lipp, a Publishers Weekly bestselling author of 17 books. I built a readership around my own true stories, and the Red House is where I teach writers to do the same." },

  {t:'lead', kick:"A note for memoir writers",
    h:"The hard story is worth telling well.",
    lead:"If your book is a true story, the Everything Memoir path helps you shape it with care, so it lands for a reader instead of getting lost in the telling." },

  {t:'body', kick:"The whole thing, in one line",
    h:"Create the work. Serve the reader. Build the platform.",
    items:[
      "Run all three, in that order, on a rhythm you can keep.",
      "That is how a manuscript becomes a book people read.",
      "That is Writing at the Red House." ] },

  {t:'cta', kick:"Your next step",
    h:"Come write at the Red House.",
    cta:"Create. Serve. Build.",
    step:"Join the Red House Writers Collective, come to a retreat, or book a call to find the right starting point for your book.",
    disc:"Educational content only. Writing and publishing results vary and depend on your own work, market, and circumstances. No income or outcome is guaranteed." }
];

const deck = document.getElementById("deck");
for (const s of S){
  const sec = document.createElement("section");
  sec.className = "slide";
  let html = "";
  if (s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if (s.t === "title"){
    html += '<h1>'+s.h+'</h1>';
    if (s.sub) html += '<div class="sub">'+s.sub+'</div>';
  } else if (s.t === "hook"){
    html += '<div class="big">'+s.big+'</div>';
    if (s.sub) html += '<div class="sub">'+s.sub+'</div>';
  } else if (s.t === "part"){
    html += '<h1>'+s.h+'</h1>';
  } else if (s.t === "pillar"){
    html += '<div class="pillar"><div class="pnum">'+s.n+'</div><div><h2>'+s.h+'</h2>'+
            '<div class="lead">'+s.lead+'</div></div></div>';
  } else if (s.t === "lead"){
    html += '<h2>'+s.h+'</h2>';
    if (s.lead) html += '<div class="lead">'+s.lead+'</div>';
  } else if (s.t === "body"){
    html += '<h2>'+s.h+'</h2><ul>';
    for (const it of (s.items||[])) html += '<li>'+it+'</li>';
    html += '</ul>';
  } else if (s.t === "cta"){
    html += '<h1>'+s.h+'</h1>';
    if (s.cta) html += '<div class="cta accent">'+s.cta+'</div>';
    if (s.step) html += '<div class="step">'+s.step+'</div>';
    if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  }
  html += '<div class="foot">Writing at the Red House · Kathi Lipp</div>';
  sec.innerHTML = html;
  deck.appendChild(sec);
}
</script>
</body>
</html>
