<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chasing Perfection — A Masterclass with Sue Hawkes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Volkhov:ital,wght@0,400;0,700;1,400&family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbf9;        /* warm off-white (brand light scheme) */
    --panel:#f1f2ec;     /* soft panel */
    --rule:#d9dcd0;      /* hairline */
    --accent:#37b494;    /* YESS! signature teal (brand.json ranked #3) */
    --ink2:#3c0942;      /* brand plum, for kickers */
    --text:#333333;      /* body ink */
    --muted:#6b6b6b;
    --serif:'Volkhov', Georgia, serif;
    --sans:'Cabin', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--rule);font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:64px 64px;margin:22px 0;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .slide.center{align-items:center;text-align:center}
  .kicker{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--ink2);margin-bottom:20px}
  .star{color:var(--accent);font-size:13px;letter-spacing:.3em;margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.08;color:#222;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:36px;line-height:1.14;color:#222;margin-bottom:22px}
  h3{font-family:var(--sans);font-weight:600;font-size:19px;color:var(--accent);margin:0 0 6px}
  p.lead{font-family:var(--serif);font-size:23px;line-height:1.5;color:#444;max-width:44ch}
  p.body{font-size:18px;line-height:1.65;color:var(--text);max-width:60ch;margin-top:14px}
  .sub{font-size:19px;color:var(--muted);margin-top:18px;max-width:52ch}
  ul{list-style:none;margin-top:24px;max-width:62ch}
  ul li{position:relative;padding-left:30px;margin:16px 0;font-size:18px;line-height:1.5}
  ul li:before{content:"\2605";position:absolute;left:0;top:1px;color:var(--accent);font-size:14px}
  .pillar{background:var(--panel);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
    padding:20px 24px;margin:14px 0}
  .pillar h3{color:var(--ink2)}
  .pillar p{font-size:16.5px;line-height:1.55;color:#4a4a4a;margin-top:4px}
  .cta h2{color:var(--ink2)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:30px;max-width:62ch;line-height:1.5}
  .page{font-size:12px;color:#b7b7af;margin-top:30px;letter-spacing:.08em}
  .quote{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1.35;color:#333;max-width:46ch}
  .cite{margin-top:20px;font-weight:600;color:var(--ink2);font-size:15px;font-style:normal;font-family:var(--sans)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', star:true,
  kicker:'A YESS! Masterclass with Sue Hawkes',
  h1:'Chasing Perfection',
  lead:"Why your best people's self-doubt is quietly capping your culture, and the work that frees it."},

 {t:'promise', kicker:'In the next hour', h:'What you will walk away with',
  bullets:[
   'Why high achievers who look the most confident are often the most stuck',
   'The three alignments every leader needs before a team can truly thrive',
   'A way to name and work through the tough stuff instead of managing around it',
   'The first move to build a winning culture where accountable people stay']},

 {t:'who', kicker:'Who this is for', h:'You lead, and you carry more than you let on',
  body:'You are a CEO, a founder, or you sit on a leadership team. On paper the business is working. Privately you wonder if you are the one holding it back, whether anyone would respect you if they saw how much you second-guess yourself.',
  sub:'You are not looking for another operating manual. You are looking for the thing underneath it.'},

 {t:'stakes', kicker:'The stakes', h:"Your ceiling becomes the company's ceiling",
  body:'However far you have worked through your own doubt is exactly as far as your culture can go. The business will not out-grow the leader’s relationship with being imperfect, because the team takes its cues from you long before it reads the mission statement.',
  sub:'This is good news. It means the highest-leverage work is the most personal.'},

 {t:'trap', kicker:'The trap', h:'Perfectionism wears the mask of high standards',
  body:'So it never gets questioned. It looks like diligence. It feels like responsibility. And it quietly teaches your team that nothing is ever quite good enough, that mistakes are dangerous, and that the safest move is to wait for you to decide.',
  sub:'A team that is waiting on you is not a team that is thriving.'},

 {t:'reframe', star:true, h:'The illusion is that confidence comes first',
  lead:'It does not. Confidence is what you earn on the other side of doing the tough stuff while the self-doubt is still loud. Chasing perfect keeps you from ever starting.'},

 {t:'part', kicker:'Part One', h:'The problem is not your system. It is the self-doubt sitting behind it.'},

 {t:'p1a', h3:'The cost is cultural, not personal', h:'Self-doubt does not stay in your head',
  body:'It shows up as the decision you delayed, the feedback you softened, the delegation you took back. Every one of those is a small signal to your people about what is safe here. Over a year, those signals become your culture.'},

 {t:'p1b', h3:'Accountability needs safety', h:'People cannot be accountable in a room that is not safe',
  body:'Real accountability asks people to own a miss out loud. They will only do that if they have watched you do it first. The leader’s relationship with their own imperfection sets the ceiling for the whole team’s.'},

 {t:'p1c', h3:'The quiet tax', h:'What it costs before anyone notices',
  body:'Your best people do not quit in a meeting. They quit slowly, in the moments they stop raising their hand, because raising it never felt safe. By the time it shows up in retention or results, the culture has been teaching the lesson for a long while.'},

 {t:'part', kicker:'Part Two', h:'Intentional Greatness: the three places a leader has to be aligned.'},

 {t:'ig', h3:'Intentional Greatness®', h:'Three alignments',
  pillars:[
   {h:'With your business', p:'Is the business running you, or are you running it? Alignment here is clarity on the handful of things only you can do, and the discipline to let the rest go.'},
   {h:'With the people you lead', p:'Do you lead with confidence, or with control? Alignment here is trust: the team knows where they stand and what winning looks like.'},
   {h:'With your own life', p:'Are you living by design or by default? A leader who is depleted cannot catalyze anyone. Alignment here is the permission to be whole.'}]},

 {t:'cp', h3:'From Chasing Perfection', h:'Shatter the illusion, minimize self-doubt, maximize success',
  bullets:[
   'Name the inner critic out loud, because what gets named loses its grip',
   'Trade perfect for done, then let done teach you what perfect never could',
   'Separate the mistake from the meaning you attach to it',
   'Build the daily practice that makes resilience a habit, not a hope']},

 {t:'comm', h3:'Communication Catalyzer™', h:'The same work, now across the table',
  body:'Once you can sit with your own imperfection, you can finally hear other styles without flinching. The Catalyzer maps four communication styles so your leadership team can name friction as a difference in wiring, not a failure of character.'},

 {t:'part', kicker:'Part Three', h:'When the leader stops chasing perfect, the whole room changes.'},

 {t:'picture', kicker:'The picture', h:'What changes in ninety days',
  bullets:[
   'You make the call you were sitting on, and the team sees you do it imperfectly',
   'Mistakes get surfaced earlier because surfacing them is finally safe',
   'Your leadership team owns their numbers without being chased',
   'You spend your week on the few things only you can do']},

 {t:'whyme', kicker:'Why listen to me', h:'Sue Hawkes',
  body:'I am an Expert EOS Implementer, a Certified Executive Business Coach, and the best-selling author of Chasing Perfection. For more than thirty years I have sat with leaders of companies from startup to over one hundred million in revenue, gracefully working through the tough stuff so their people can thrive.',
  sub:'I built YESS! and the 5 Star Success System to do exactly this work, out loud, with you.'},

 {t:'quote', center:true,
  quote:'I have never felt as aligned with this group of people as I do right now. I am excited to see how it manifests throughout the rest of the company.',
  cite:'Tracey Halvorsen, Fastspot'},

 {t:'recap', kicker:'In one line', h:'Free the leader, and the culture follows',
  bullets:[
   'Chasing perfect is not high standards, it is the thing keeping you stuck',
   'Intentional Greatness aligns you with your business, your people, and your life',
   'Accountability grows in a room where imperfection is finally safe']},

 {t:'cta', kicker:'Your next step', h:"Let's do the work together",
  body:'If this hour named something true, the next step is a conversation. Explore the Intentional Greatness coaching path and the Leading U program, or reach the YESS! team to talk about what thriving could look like for your company.',
  sub:'sayyess.com  ·  Intentional Greatness® · Leading U · EOS Implementation',
  disclaimer:'This masterclass is educational. No specific business, financial, or personal result is guaranteed. Results vary from leader to leader and company to company, and depend on many factors including your own effort and circumstances.'}
];

function slideHTML(s){
  let h='';
  if(s.star) h+='<div class="star">★ ★ ★ ★ ★</div>';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h3) h+='<h3>'+s.h3+'</h3>';
  if(s.h) h+='<h2>'+s.h+'</h2>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.quote) h+='<p class="quote">“'+s.quote+'”</p>';
  if(s.cite) h+='<div class="cite">'+s.cite+'</div>';
  if(s.body) h+='<p class="body">'+s.body+'</p>';
  if(s.pillars) s.pillars.forEach(p=>{h+='<div class="pillar"><h3>'+p.h+'</h3><p>'+p.p+'</p></div>';});
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li>'+b+'</li>');h+='</ul>';}
  if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
  if(s.disclaimer) h+='<p class="disclaimer">'+s.disclaimer+'</p>';
  return h;
}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  const center=s.center||['title','reframe','quote'].includes(s.t);
  el.className='slide'+(center?' center':'')+(s.t==='cta'?' cta':'');
  el.innerHTML=slideHTML(s)+'<div class="page">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  deck.appendChild(el);
});
</script>
</body>
</html>
