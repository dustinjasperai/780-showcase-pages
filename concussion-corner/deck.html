<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concussion: The Patient Rehabilitation Journey — a masterclass with Dr. Jessica Schwartz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Palette derived from concussioncorner.org (brand.json, site_scheme: light):
     dominant navy #143f6f (172 uses), deep navy #0d243d (102), slate #67686b (88),
     single accent = their own CTA green #8bc34a (13). Type = Roboto (their h1/h2 face)
     + PT Serif (stands in for their Times New Roman body). Light academic ground. */
  :root{
    --bg:#f6f7f9; --ink:#0d243d; --navy:#143f6f; --slate:#67686b;
    --line:#d6dae1; --accent:#8bc34a; --panel:#ffffff; --deep:#0d243d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--slate);color:var(--ink);font-family:"PT Serif",Georgia,serif}
  #deck{max-width:960px;margin:0 auto}
  .slide{background:var(--bg);min-height:540px;padding:64px 72px;display:flex;flex-direction:column;
    justify-content:center;border-bottom:6px solid var(--navy);position:relative}
  .kicker{font-family:"Roboto",sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--navy);margin-bottom:18px}
  .kicker .dot{color:var(--accent)}
  h1{font-family:"Roboto",sans-serif;font-weight:900;font-size:46px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:"Roboto",sans-serif;font-weight:700;font-size:34px;line-height:1.12;color:var(--ink)}
  h3{font-family:"Roboto",sans-serif;font-weight:700;font-size:20px;color:var(--navy)}
  p{font-size:20px;line-height:1.5;color:#22303f;margin-top:16px;max-width:44ch}
  .lede{font-size:23px;color:var(--navy)}
  .big{font-size:56px;font-family:"Roboto",sans-serif;font-weight:900;color:var(--navy);line-height:1.02}
  ul{margin-top:20px;list-style:none}
  li{font-size:19px;line-height:1.45;padding-left:26px;position:relative;margin-bottom:12px;max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:11px;height:11px;background:var(--accent);border-radius:2px}
  .rule{width:64px;height:5px;background:var(--accent);margin:22px 0 4px}
  .foot{position:absolute;bottom:22px;left:72px;right:72px;display:flex;justify-content:space-between;
    font-family:"Roboto",sans-serif;font-size:12px;letter-spacing:.06em;color:var(--slate);text-transform:uppercase}
  .title{background:linear-gradient(160deg,#0d243d 0%,#143f6f 100%);border-bottom:6px solid var(--accent)}
  .title .kicker{color:#a7c7ff}
  .title h1{color:#fff;font-size:52px}
  .title p{color:#d9e2ee}
  .title .rule{background:var(--accent)}
  .title .foot{color:#8ea6c2}
  .dark{background:var(--deep);border-bottom:6px solid var(--accent)}
  .dark h2,.dark h1{color:#fff}
  .dark p{color:#cdd8e6}
  .dark .kicker{color:#a7c7ff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;margin-top:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--navy);
    padding:16px 18px;border-radius:4px}
  .card h3{font-size:15px;margin-bottom:5px}
  .card span{font-family:"Roboto",sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--slate)}
  .card p{font-size:15px;margin-top:6px;max-width:none;color:#33414f}
  .weeks{font-family:"Roboto",sans-serif;font-weight:900;color:var(--accent);font-size:13px}
  .disc{font-family:"Roboto",sans-serif;font-size:13px;color:var(--slate);line-height:1.5;margin-top:26px;max-width:58ch}
  .cta-btn{display:inline-block;font-family:"Roboto",sans-serif;font-weight:700;background:var(--accent);
    color:#0d243d;padding:14px 26px;border-radius:6px;margin-top:26px;font-size:17px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
 {t:'title', kicker:'Concussion Corner Academy&reg;', h:'Concussion: The Patient Rehabilitation Journey',
  p:'A masterclass for the direct-access clinician who wants to treat concussion with confidence, across the whole lifespan. With Dr. Jessica B. Schwartz, PT, DPT.'},

 {t:'std', kicker:'The promise', h:'Leave able to walk any concussion patient through recovery.',
  p:'Not a certificate to hang on the wall. The clinical judgment to look at the patient in front of you, at their age and their phase, and know the next right move.'},

 {t:'std', kicker:'Who this is for', h:'You are the first door a concussed patient walks through.',
  p:'Physical therapists, athletic trainers, occupational therapists, physicians. Direct-access clinicians who see concussion and want to do more than hand out a rest sheet and a referral.'},

 {t:'std', kicker:'The trap', h:'You took the weekend course. The patient still improved slowly.',
  list:['You learned the checklist, then forgot most of it by the next busy Monday.',
        'The pediatric case, the adult case, and the athlete on your table all need different things, and the course taught one.',
        'You can name the systems. Turning that into a week-by-week plan is another thing entirely.']},

 {t:'dark', kicker:'The reframe', h:'The gap in concussion care is not knowledge. It is the journey.',
  p:'Anyone can list the vestibular system. Almost no one is taught to walk a real patient, at a real age, through the whole arc of recovery. That arc is the skill. That is what this is.'},

 {t:'std', kicker:'Part one: the core problem', h:'Concussion is taught in fragments. Recovery happens in sequence.',
  p:'A patient is not a symptom cluster. They are pediatric or geriatric, acute or persisting, athlete or office worker. The care changes at every one of those forks, and fragmented training leaves you guessing at the forks.'},

 {t:'std', kicker:'Part one: the forks', h:'Every fork is a decision most training never taught you to make.',
  list:['Acute or persisting: when do you rest, and when do you load?',
        'Pediatric or adult: the same protocol can help one and stall the other.',
        'Athlete or everyday patient: return-to-play and return-to-life are not the same road.']},

 {t:'std', kicker:'Part two: the framework', h:'The Patient Rehabilitation Journey',
  p:'Six sequential modules, each taught by the clinician-scientist who actually publishes and treats in that area. Not a lecture series. A path you can follow with a patient in front of you.'},

 {t:'grid', kicker:'The journey: weeks 1 to 9', h:'From the sideline to the exam table',
  cards:[
   {s:'Weeks 1-2', h:'Pediatrics', p:'History, physical, visual and vestibular exam, and active rehab across acute to persisting symptoms. Taught by Christina L. Master, MD.'},
   {s:'Weeks 3-4', h:'Adult & Adolescent', p:'Physiology, differential diagnosis, and the University of Buffalo treadmill and bike exertion testing. Taught by John J. Leddy, MD.'},
   {s:'Weeks 5-6', h:'PT Examination', p:'Functional assessment of the ocularmotor, vestibular, and cervical spine systems, plus exercise testing. Taught by Lenore Herget, PT, DPT.'},
   {s:'Weeks 7-9', h:'PT Intervention', p:'Rehabilitation planning, tapering, and pacing, with six case reviews across the age spectrum. Taught by Becky Bliss, PT, DPT.'}
  ]},

 {t:'grid', kicker:'The journey: weeks 10 to 12', h:'Closing the loop back to clinic',
  cards:[
   {s:'Weeks 10-11', h:'Athletic Training 101', p:'Sideline screening, acute evaluation, communication, and return progression for the student-athlete. Taught by D. J. Fink, MS, ATC.'},
   {s:'Week 12', h:'From Classroom to Clinic', p:'International consensus guidelines reviewed and turned into what you do Monday morning. Taught by Dr. Jessica Schwartz.'},
   {s:'Every week', h:'Multi-system, by design', p:'Ocular, vestibular, cervical, autonomic, exertion. You leave able to treat the whole patient, not one system.'},
   {s:'Every week', h:'Across the lifespan', p:'Pediatric to geriatric, acute to chronic. The forks are taught, so you stop guessing at them.'}
  ]},

 {t:'std', kicker:'Inside the method', h:'You will test exertion, not just talk about it.',
  p:'The Buffalo treadmill and bike protocols give you an objective way to set the exact intensity a recovering brain can tolerate, then progress it safely. This is the difference between telling a patient to rest and giving them a dose.'},

 {t:'std', kicker:'Inside the method', h:'Four systems, one patient, one plan.',
  p:'Ocularmotor, vestibular, cervical, and autonomic findings rarely arrive one at a time. You will learn to assess them together and build a single rehabilitation plan that respects how they interact, not four plans that fight each other.'},

 {t:'std', kicker:'Part three: the philosophy', h:'Teach One. Serve Many.',
  p:'World-class, actively-publishing clinician-scientists teach the direct-access clinician. Each clinician then serves the many patients who never reach a specialist. That is the multiplier, and it is why this is a community, not a video library.'},

 {t:'std', kicker:'How it sticks', h:'From Classroom to Clinic: next-day knowledge translation',
  list:['Spaced repetition across a manageable two to three hours a week, so it holds.',
        'Live faculty office hours twice a week, so your real patient gets a real answer.',
        '1:1 mentorship and coaching with the founder, so you are never left alone with a hard case.']},

 {t:'std', kicker:'Who teaches you', h:'Physicians, physical therapists, and athletic trainers who publish and treat.',
  p:'The faculty are not generalists reading slides. They are the pediatric physician, the exertion-testing researcher, the vestibular examiner, and the sideline clinician, each teaching the piece they built their careers on.'},

 {t:'dark', kicker:'Why this, why me', h:'I have been the doctor. I have also been the patient.',
  p:'I am an orthopedic residency-trained DPT and a national spokeswoman for the APTA. In 2013 a brain injury put me through a year of my own concussion rehabilitation. I saw exactly where care breaks down, from both sides of the table. Concussion Corner is what I built to fix it.'},

 {t:'std', kicker:'What changes in your clinic', h:'Twelve weeks. Thirty CE hours. A patient you can actually help.',
  list:['A cohort of clinicians moving through the journey together, internationally and across disciplines.',
        'Case reviews you can map onto the patient sitting in your clinic this week.',
        'CE credit for PT, OT, and ATC in all 50 states, so the learning counts twice.']},

 {t:'cta', kicker:'Your next step', h:'Join the next Patient Rehabilitation Journey cohort.',
  p:'Enroll in Concussion: The Patient Rehabilitation Journey, or book a discovery call and we will find the right starting point for you or your team. Pay-over-time is available.',
  btn:'Enroll or book a discovery call at concussioncorner.org',
  disc:'This masterclass is for professional education only. It does not guarantee any clinical or financial outcome; results vary by clinician, patient, and setting. Nothing here replaces your own clinical judgment or applicable standards of care.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='title'?'title':s.t==='dark'?'dark':s.t==='cta'?'':'');
  let inner='';
  if(s.kicker) inner+='<div class="kicker">'+s.kicker.replace('.','<span class="dot">.</span>')+'</div>';
  if(s.h) inner+= (s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  inner+='<div class="rule"></div>';
  if(s.p) inner+='<p'+(s.t==='title'?' class="lede"':'')+'>'+s.p+'</p>';
  if(s.list){inner+='<ul>';s.list.forEach(x=>inner+='<li>'+x+'</li>');inner+='</ul>';}
  if(s.cards){inner+='<div class="grid">';s.cards.forEach(c=>{
    inner+='<div class="card"><span>'+c.s+'</span><h3>'+c.h+'</h3><p>'+c.p+'</p></div>';});inner+='</div>';}
  if(s.btn) inner+='<div class="cta-btn">'+s.btn+'</div>';
  if(s.disc) inner+='<div class="disc">'+s.disc+'</div>';
  inner+='<div class="foot"><span>Concussion Corner Academy&reg;</span><span>'+(i+1)+' / '+S.length+'</span></div>';
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
