<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Early Masterclass: The Startup Offer System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f1;
    --panel:#f1eadf;
    --accent:#e14b20;
    --navy:#001d4f;
    --ink:#222222;
    --rule:#e3d9c8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Spectral",Georgia,serif}
  .wrap{max-width:900px;margin:0 auto;padding:34px 20px 80px}
  .slide{background:#fffdf9;border:1px solid var(--rule);border-radius:14px;
    padding:46px 46px;margin:22px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .kicker{font-family:"Archivo",system-ui,sans-serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin:0 0 14px}
  h1{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:40px;line-height:1.08;
    margin:0 0 16px;color:var(--navy)}
  h2{font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:28px;line-height:1.14;
    margin:0 0 14px;color:var(--navy)}
  p{font-size:19px;line-height:1.55;margin:0 0 14px}
  .lead{font-size:22px}
  ul{margin:8px 0 0;padding-left:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:10px 0 10px 30px;position:relative;
    border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:4px;top:19px;width:10px;height:10px;
    background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .big{font-family:"Archivo",system-ui,sans-serif;font-weight:800;color:var(--accent);
    font-size:60px;line-height:1}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:10px}
  .cell{background:var(--panel);border-radius:10px;padding:16px;font-family:"Archivo",sans-serif;
    font-weight:600;font-size:15px;color:var(--navy);text-align:center}
  .stat{display:flex;gap:28px;flex-wrap:wrap;margin-top:8px}
  .stat div{flex:1;min-width:150px;background:var(--panel);border-radius:10px;padding:20px}
  .stat .n{font-family:"Archivo",sans-serif;font-weight:800;font-size:34px;color:var(--accent)}
  .stat .l{font-size:16px;color:var(--navy);margin-top:4px}
  .disc{font-size:14px;color:#6b6252;line-height:1.5;margin-top:18px;
    border-top:1px solid var(--rule);padding-top:14px}
  .cta h1{font-size:44px}
  .step{font-family:"Archivo",sans-serif;font-weight:800;color:var(--accent);font-size:15px;
    letter-spacing:.1em}
  em{font-style:italic;color:var(--navy)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Free Live Masterclass with Kyle Thomas',
    h:'The Startup Offer System',
    p:'How ambitious operators land, and negotiate, a high-equity startup role in about 90 days, without sending another application into the void.'},

  {t:'who', kicker:'Who this is for',
    h:'You are too experienced to be ignored, and you are being ignored',
    list:['Mid-level, senior and executive leaders eyeing a high-growth startup',
      'People with real wins who freeze at "tell me about yourself"',
      'Operators who know they are worth more cash and equity than the last offer',
      'Anyone tired of the apply-and-pray job portal']},

  {t:'trap', kicker:'The trap',
    h:'The résumé pile is a lottery you keep losing',
    p:'You polish the résumé, you apply to the posting, you wait. A recruiter screens on keywords, a portal auto-rejects, and your decade of operating experience gets flattened into a PDF nobody reads.',
    p2:'The harder you lean on the front door everyone else uses, the more invisible you become.'},

  {t:'reframe', kicker:'The reframe',
    h:'Startups do not hire from the pile',
    p:'The best startup roles are filled through warm intros, founder conversations and reputation long before a job post ever goes live. The question is not "how do I apply harder." It is "how do I get in the room before the role is a post."',
    p2:'That is a system. It is learnable. And it is the whole of this masterclass.'},

  {t:'map', kicker:'The four moves',
    h:'What we will walk through tonight',
    grid:['1. Know what you want','2. Brand yourself','3. Get in the room','4. Win the offer']},

  {t:'part', step:'MOVE ONE', h:'Know what you actually want',
    p:'Most searches stall because they start with "any role will do." We start with a no-fluff self-audit of your skills, your past roles and what you actually want next.'},

  {t:'content', kicker:'Move one, in practice',
    h:'From "open to anything" to a target list',
    list:['Set clear personal and professional goals, on paper',
      'Self-assess your real strengths honestly, with none of the usual sugar-coating',
      'Pinpoint what you want, and what you do not, from past roles',
      'Leave with a laser-focused description of your ideal role and a map of the companies that fit']},

  {t:'part', step:'MOVE TWO', h:'Become the obvious candidate',
    p:'Once you know the target, you have to become legible to it. A startup hiring manager should read you in ten seconds and think "this is the person."'},

  {t:'content', kicker:'Move two, in practice',
    h:'A personal brand that does the selling for you',
    list:['Tell your story in a way that grabs attention fast',
      'Build a presence on LinkedIn and X that stands out in your niche',
      'Use language that shows a hiring manager you are the solution they need',
      'Walk away with a rock solid brand and the confidence to pitch your value to anyone']},

  {t:'part', step:'MOVE THREE', h:'Get in the room',
    p:'This is where most people quit, and where the real offers live. You do not need a bigger network. You need to activate the one you have and reach the right people the right way.'},

  {t:'content', kicker:'Move three, in practice',
    h:'Warm intros, on purpose',
    list:['Put the network you already have to work, and open doors you forgot were there',
      'Find the right people at your target companies, the ones who actually respond',
      'Run proven outreach that lifts your response rate instead of getting ignored',
      'A step-by-step plan to 10x your network and your interviews']},

  {t:'part', step:'MOVE FOUR', h:'Win the offer',
    p:'Interviews and negotiation are a learnable skill. You can prep without burning out, and you can ask for more without blowing up the offer.'},

  {t:'content', kicker:'Move four, in practice',
    h:'Prep that holds up, and the ask that pays',
    list:['Properly prep for any interview without burning out the week before',
      'Leave a lasting impression with everyone in the loop',
      'Eliminate the doubt that you are the right candidate',
      'Use a data-driven framework to compare competing offers and maximize both cash and equity']},

  {t:'motive', kicker:'The unfair advantage',
    h:'Negotiate like you have seen the other side of the table',
    p:'Equity is where startup money is really made, and it is where most candidates leave the most behind. We use investor-grade company research and real benchmarks so you can read an offer the way the founder reading it does.',
    p2:'That is how members routinely restructure an offer into a materially better package, on both salary and equity.'},

  {t:'why', kicker:'Why listen to me',
    h:'I did this from the inside',
    p:'A decade ago I went from an unfulfilled data-entry job to Uber employee 250. I spent the next ten years launching multiple $100M+ ARR Uber markets and building teams of 100-plus people.',
    p2:'In 2022 I left to teach people how to build their own extraordinary careers, with the network and the playbook I wish I had had.'},

  {t:'proof', kicker:'What the system does',
    h:'The numbers members see',
    stat:[['~90 days','Average time to an offer'],['+24% / 9x','Average salary and equity lift'],['$1.18M+','Total member comp gains']]},

  {t:'content', kicker:'How we work together',
    h:'This is live coaching, with a room right beside you',
    list:['Live group coaching every week, so you are never stuck for long',
      'A private network of thousands of startup leaders, operators and investors',
      'Investor-grade company research and curated target lists',
      'Resume reviews, interview reps and negotiation benchmarks when you need them']},

  {t:'recap', kicker:'The whole system, on one slide',
    h:'Clarity, brand, access, offer',
    grid:['Know what you want','Become obvious','Get in the room','Win the offer']},

  {t:'cta', kicker:'Your next step',
    h:'Ready to stop chasing jobs and start choosing offers?',
    p:'If tonight resonated, the next step is simple: apply to join the Early Accelerator and bring your real search to the weekly coaching room. We keep it intentionally small, so every member gets hands-on help.',
    disc:'Educational content only. Nothing here is a guarantee of any job, salary, offer, or outcome. Results vary and depend on your effort, experience, and market conditions.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  const big = (s.t==='title' || s.t==='cta');
  el.className = 'slide';
  if (s.t==='cta') el.className = 'slide cta';
  let h = '';
  if (s.kicker) h += '<p class="kicker">'+s.kicker+'</p>';
  if (s.step) h += '<p class="step">'+s.step+'</p>';
  if (s.h){ let tag = 'h2'; if (big) tag = 'h1'; h += '<'+tag+'>'+s.h+'</'+tag+'>'; }
  if (s.p) h += '<p class="lead">'+s.p+'</p>';
  if (s.p2) h += '<p>'+s.p2+'</p>';
  if (s.list){ h += '<ul>'; for(const i of s.list) h += '<li>'+i+'</li>'; h += '</ul>'; }
  if (s.grid){ h += '<div class="grid">'; for(const c of s.grid) h += '<div class="cell">'+c+'</div>'; h += '</div>'; }
  if (s.stat){ h += '<div class="stat">'; for(const x of s.stat) h += '<div><div class="n">'+x[0]+'</div><div class="l">'+x[1]+'</div></div>'; h += '</div>'; }
  if (s.disc) h += '<p class="disc">'+s.disc+'</p>';
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
