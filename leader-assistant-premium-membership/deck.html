<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Four Pillars of a Game-Changing Assistant | A Live Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2e9;
    --panel:#fffdf7;
    --ink:#38404d;
    --accent:#ffa027;
    --rule:#e2d7c6;
    --muted:#6b7180;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:'Mulish',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1120px;margin:0 auto;padding:40px 24px 90px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:18px;
    padding:76px 72px;
    margin:0 0 26px;
    min-height:560px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 18px 44px rgba(90,74,45,.07);
    position:relative;overflow:hidden;
    scroll-margin-top:20px;
  }
  .kicker{font-size:14px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:60px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:44px;line-height:1.1;letter-spacing:-.01em}
  .lead{font-size:25px;line-height:1.5;color:var(--muted);margin-top:28px;max-width:40ch}
  .big{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:40px;line-height:1.22;max-width:24ch}
  .body{font-size:23px;line-height:1.55;color:var(--muted);margin-top:22px;max-width:46ch}
  .num{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:500;font-size:30px;color:var(--accent)}
  .cols{display:flex;gap:14px;margin-top:40px}
  .col{width:34px;height:120px;border-radius:7px 7px 3px 3px;background:#efe7d6;position:relative}
  .col::before{content:'';position:absolute;top:0;left:0;right:0;height:12px;background:var(--accent);border-radius:7px 7px 0 0}
  .foot{position:absolute;left:72px;right:72px;bottom:30px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);letter-spacing:.04em}
  .foot .brand{font-weight:700;color:var(--ink)}
  .pill{display:inline-flex;align-items:baseline;gap:18px}
  .pwrap{display:flex;flex-direction:column;gap:16px;margin-top:30px}
  .prow{display:flex;gap:20px;align-items:flex-start}
  .pdot{flex:0 0 auto;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:12px}
  .prow .pt{font-family:'Newsreader',serif;font-size:26px;color:var(--ink)}
  .prow .ps{font-size:18px;color:var(--muted);margin-top:4px}
  .disc{font-size:15px;color:var(--muted);margin-top:30px;max-width:54ch;line-height:1.5}
  .cta-line{font-size:23px;color:var(--ink);margin-top:18px;font-weight:700}
  .tag{font-size:17px;color:var(--muted);margin-top:14px}
  @media(max-width:720px){.slide{padding:48px 30px;min-height:460px}h1{font-size:40px}h2{font-size:32px}.foot{left:30px;right:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', h:'The Four Pillars of a Game-Changing Assistant', sub:'How to become indispensable without burning out. A live masterclass for executive assistants.', cols:true},
 {t:'point', k:'Who this is for', big:'For the executive assistant, EBP, or chief of staff who is done being treated like "just the admin."', body:'If you run the day and still get overlooked, this hour is for you.'},
 {t:'point', k:'The trap', big:'You are the most reliable person in the building.', body:'And somehow still the most invisible. Reliable keeps you employed. It does not get you a seat.'},
 {t:'point', k:'The trap', big:'The better you are at the tasks, the more you get buried in them.', body:'Competence becomes a ceiling. The work expands to fill every hour you free up.'},
 {t:'point', k:'The reframe', big:'Here is the uncomfortable part. Being excellent at tasks is exactly what keeps you stuck doing tasks.', body:'A game-changing assistant is not a faster order-taker. They lead.'},
 {t:'section', h:'Part One', sub:'Why great assistants plateau'},
 {t:'point', k:'The plateau', big:'Most assistants top out as "trusted help."', body:'Help waits to be told. A partner anticipates, decides, and owns the outcome. That gap is the whole career.'},
 {t:'point', k:'The warning', big:'Neglect one area and you drift toward burnout, stagnation, and anonymity.', body:'That is not motivation. It is the pattern behind every assistant who quietly checks out.'},
 {t:'section', h:'Part Two', sub:'The Four Pillars', cols:true},
 {t:'pillar', n:'01', h:'Embody the characteristics', body:'The mindset of a leader, not support staff. Confidence, ownership, and the proactivity that make you a true partner instead of a pair of hands.'},
 {t:'pillar', n:'02', h:'Employ the tactics', body:'The craft done at an elite standard. Calendar, inbox, meetings, travel, projects, and the tools and automation that turn chaos into a system.'},
 {t:'pillar', n:'03', h:'Engage in relationships', body:'Managing up and building trust. The communication that makes the executive unable, and unwilling, to operate without you.'},
 {t:'pillar', n:'04', h:'Exercise self-care', body:'The pillar everyone drops first. Boundaries and sustainability, because a burned-out assistant cannot lead anyone, least of all themselves.'},
 {t:'point', k:'The system', big:'The pillars are a system, not a menu.', body:'Drop one and the others wobble. Strong tactics with no self-care is just a faster road to burnout.'},
 {t:'section', h:'Part Three', sub:'What a Leader Assistant looks like'},
 {t:'point', k:'A day in the life', big:'They protect the executive’s focus instead of reacting to it.', body:'The 2pm gets moved before it is asked. Thursday is already cleared for the board. The pre-read is already sent.'},
 {t:'point', k:'Future-proof', big:'They use AI to do more of the strategic work, not less.', body:'Automation handles the repeatable. That frees the leader assistant for judgment, which is the part no tool replaces.'},
 {t:'point', k:'The relationship', big:'From order-taker to right hand.', body:'When you lead from the pillars, you stop being a cost to manage and become the advantage the executive protects.'},
 {t:'bio', k:'Why listen to me', h:'Jeremy Burrows', body:'Longtime senior executive assistant to CEOs, athletes, authors, and billionaires. Author of the number one bestselling book on the role, and host of the top podcast for assistants with more than a million downloads.'},
 {t:'point', k:'The path', big:'You do not build this in an hour. You start it.', body:'The pillars give you the map. The next step is practicing them with other assistants who are doing the same.'},
 {t:'recap', k:'In one line', h:'Embody. Employ. Engage. And look after yourself while you do it.', body:'That is the difference between an assistant and a Leader Assistant.'},
 {t:'cta', k:'Keep going', h:'Become a confident, game-changing assistant.', line:'Join the Leader Assistant community and keep building the four pillars.', tag:'Resources, training, and a global network of executive assistants at leaderassistant.com', disc:'This masterclass is educational. No specific job, promotion, salary, or result is guaranteed. Results vary and depend on your own effort and circumstances.'}
];

function colsHTML(){return '<div class="cols">'+Array(4).fill('<div class="col"></div>').join('')+'</div>';}
function foot(i){return '<div class="foot"><span class="brand">The Leader Assistant</span><span>'+(i+1)+' / '+S.length+'</span></div>';}

function render(){
  const deck=document.getElementById('deck');
  deck.innerHTML=S.map((s,i)=>{
    let inner='';
    if(s.t==='title'){
      inner='<div class="kicker">A live masterclass</div><h1>'+s.h+'</h1><div class="lead">'+s.sub+'</div>'+(s.cols?colsHTML():'');
    }else if(s.t==='section'){
      inner='<div class="kicker">'+s.h+'</div><h2>'+s.sub+'</h2>'+(s.cols?colsHTML():'');
    }else if(s.t==='pillar'){
      inner='<div class="pill"><span class="num">'+s.n+'</span><div><h2>'+s.h+'</h2><div class="body">'+s.body+'</div></div></div>';
    }else if(s.t==='bio'){
      inner='<div class="kicker">'+s.k+'</div><h2>'+s.h+'</h2><div class="body">'+s.body+'</div>';
    }else if(s.t==='recap'){
      inner='<div class="kicker">'+s.k+'</div><h2>'+s.h+'</h2><div class="body">'+s.body+'</div>';
    }else if(s.t==='cta'){
      inner='<div class="kicker">'+s.k+'</div><h1>'+s.h+'</h1><div class="cta-line">'+s.line+'</div><div class="tag">'+s.tag+'</div><div class="disc">'+s.disc+'</div>';
    }else{
      inner='<div class="kicker">'+(s.k||'')+'</div><div class="big">'+s.big+'</div>'+(s.body?'<div class="body">'+s.body+'</div>':'');
    }
    return '<section class="slide">'+inner+foot(i)+'</section>';
  }).join('');
}
render();
</script>
</body>
</html>
