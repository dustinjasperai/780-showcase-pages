<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Buyer's-Eye Diagnostic · Aesthetic Brokers Growth Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#101823; --panel:#16202E; --rule:#232E3D;
    --brass:#C9A24B; --steel:#9AA7B5; --chalk:#F0EDE4; --grey:#CBD2DA; --dim:#7C8794;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Onest',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-bottom:2.4vh}
  h1{font-family:'Crimson Pro',Georgia,serif;font-weight:500;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.6vw}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-size:1.46vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Onest',sans-serif;font-size:1.4vw;font-weight:600;color:var(--steel);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--brass),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1B2634 0%,#080C11 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:86%;font-style:italic;color:#EFE9DD}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1B2634 0%,#080C11 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--brass);color:#EAD9AE;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .gauge-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-gauge{right:6.5%;bottom:9%;width:16vw}
  .corner-gauge{right:6%;bottom:7.5%;width:8vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--brass);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--brass);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Aesthetic Brokers Growth Consulting</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- diagnostic-gauge motif: four concentric rings, innermost solid, outward progressively lighter -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gauge" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="20" fill="#C9A24B"/>
  <circle cx="100" cy="100" r="46" fill="none" stroke="#C9A24B" stroke-width="3" opacity="0.72"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#C9A24B" stroke-width="3" opacity="0.46"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="#C9A24B" stroke-width="3" opacity="0.24"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Buyer’s-Eye Diagnostic',sub:'What a private-equity buyer would see in your dermatology practice right now, and how to fix it before they do, in one hour.',brand:true,climb:'title'},
 {t:'normal',k:'Who this is for',title:'You built a real practice. You do not know which numbers actually move its value.',body:'You are busy, growing, and doing well by most measures you can see. The catch is nobody has ever graded your practice on the specific metrics that determine whether it is actually building value or just staying busy.'},
 {t:'normal',k:'The trap',title:'More patients will not fix a growth ceiling you cannot see.',body:'Every practice eventually hits a ceiling that patient volume alone cannot break. Working harder does not find that ceiling. A cold, outside diagnostic does.'},
 {t:'dark',title:'You do not have a marketing problem. You have blind spots in exactly the numbers a buyer would grade first.'},

 {t:'section',idx:'Part One',title:'The Practice With Hidden Ceilings'},
 {t:'normal',k:'The real cost',title:'Growth stalls quietly, in places nobody is measuring.',body:'Financial performance, operational workflow, service-offering mix, patient retention, and staff productivity all move a practice’s real value. Most owners can describe how busy they are. Few can say, with numbers, which of these five is actually holding them back.'},
 {t:'normal',k:'The shift',title:'Stop guessing at growth. Get graded the way a buyer grades.',body:'The owners who break through do not try more marketing tactics first. They bring in someone who has spent a career evaluating practices from the buy side, and let that lens find the real gaps before spending a dollar closing them.'},
 {t:'dark',title:'A diagnosis is not a report. It is a sequence of things measured, fixed, and checked, in order.'},

 {t:'section',idx:'Part Two',title:'The Growth Consulting Methodology'},
 {t:'normal',k:'Stage one',title:'Diagnose Symptoms.',body:'A comprehensive assessment of financial metrics, operational workflows, service offerings and pricing, patient acquisition and retention, and staff productivity and compensation, surfacing both obvious and hidden barriers to growth.'},
 {t:'normal',k:'Stage two',title:'Create Solutions.',body:'Customized strategies built directly from the diagnosis: revenue growth strategies, operational efficiency improvements, financial restructuring, and service-offering alignment with market trends and patient demand.'},
 {t:'normal',k:'Stage three',title:'Implement Initiatives.',body:'Hands-on execution alongside your staff: clear action steps and accountability measures, staff training and development, process documentation, and regular check-ins to keep momentum.'},
 {t:'normal',k:'Stage four',title:'Monitor Optimization.',body:'Growth consulting does not stop at a plan. Ongoing tracking of the key metrics, with strategy adjusted as your practice and the market change.'},
 {t:'dark',title:'Four stages, run in sequence, turn blind spots into a plan you can actually execute.'},

 {t:'section',idx:'Part Three',title:'What This Looks Like'},
 {t:'normal',k:'The result',title:'The same practice you built, minus the blind spots.',body:'You keep the clinical vision and the brand you have built. What changes is a clear, numbers-backed view of what is actually driving or capping your growth, and a plan to close the gap.'},
 {t:'normal',k:'Why me',title:'A career spent on the buy side of healthcare M&A.',body:'I am Bill Walker, Founder and CEO of Aesthetic Brokers. Before this, I led mergers and acquisitions for a large private-equity-backed healthcare organization, evaluating practices from the buyer’s side of the table. Our Growth Consulting team was built on that same lens, on purpose, so we diagnose growth the way a buyer diagnoses value.'},

 {t:'section',idx:'Your next step',title:'A Conversation About Your Practice’s Growth'},
 {t:'normal',k:'How we begin',title:'A conversation about where your real ceiling actually is.',body:'We look at which of the four stages your practice needs first, whether that is a full diagnostic, help turning findings into an action plan, or support keeping a plan on track once it starts.'},
 {t:'cta',title:'Reach out by phone, text, or the contact form.',chips:['Call or text 619.742.0310','aestheticbrokers.com/contact'],disc:'Educational content for dermatology practice owners only. No income, revenue, or business result is guaranteed. Results vary by owner, practice, and market.'},
];

const deck=document.getElementById('deck');
function gauge(kind){return `<svg class="gauge-motif ${kind==='title'?'title-gauge':'corner-gauge'}"><use href="#gauge"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Aesthetic Brokers Growth Consulting &middot; <b>Bill Walker</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.climb) h+=gauge(s.climb);
  else if(s.t==='title') h+=gauge('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
