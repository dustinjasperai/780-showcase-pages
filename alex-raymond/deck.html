<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Growth Department, a masterclass with Alex Raymond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f2ee;
    --panel:#ffffff;
    --panel2:#faf8f4;
    --rule:#d7d7d7;
    --ink:#152133;
    --muted:#535353;
    --accent:#ff7575;
    --head:'Host Grotesk','Helvetica Neue',sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(21,33,51,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* ledger motif: a thin financial baseline rule, bottom-left */
  .slide::after{content:'';position:absolute;bottom:0;left:0;height:6px;width:38%;
    background:var(--accent);border-radius:0 6px 0 0}
  .kick{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.01em;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:600;font-size:41px;line-height:1.09;letter-spacing:-.01em;margin:0 0 20px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:46ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:15px;height:15px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px}
  .big{font-family:var(--head);font-size:112px;line-height:1;font-weight:700;letter-spacing:-.02em}
  .strike{color:transparent;-webkit-text-stroke:2px #15213355;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--rule);border-radius:14px;padding:24px 26px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:25px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:18px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:56px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.45}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:62ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:10px;max-width:58ch;line-height:1.4}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:38px}h2{font-size:29px}.big{font-size:66px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">AMplify · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Growth Department',p:'How account managers turn post-sale into the company’s real growth engine.',pres:'With <b>Alex Raymond</b>, Founder of AMplify'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['See the revenue you already own','70 to 80% of it is sitting in your book, post-sale.'],['A way to grow an account, not just keep it','The shift from protecting a relationship to growing a portfolio.'],['The first move you can make on Monday','One account, one expansion question, one plan.']]},
 {t:'audience',kick:'Who this is for',h:'You own the accounts. And you get treated like support.',p:'Account managers and customer success leaders who carry a book of business and a retention number, inside a company that still funds post-sale as a cost center.',who:'<b>The trap:</b> you keep every account green, get no credit for revenue, and watch the healthy ones churn anyway.'},
 {t:'reframe',kick:'The reframe',big1:'Recurring.',big2:'<span class="em">Re-earned.</span>',p:'There is no such thing as recurring revenue. Every renewal is re-earned, every single year. The teams that grow are the ones that act like it.'},
 {t:'part',kick:'Part one',h:'Why post-sale is starved.'},
 {t:'point',kick:'The core problem',h:'Most of the revenue lives here. Almost none of the strategy does.',p:'70 to 80% of B2B revenue comes from existing customers, yet post-sale is funded and run as service, not as a revenue operation. The growth engine is the part nobody invests in.'},
 {t:'framework',kick:'The core problem',h:'Protection is not growth.',row:[['Protection','Reduce risk. Keep the account green. Clear the tickets.'],['Growth','Create new value. Expand the account. Earn the next dollar.']],p:'A real post-sale model has to do both. Most teams only do the first, and call it success.'},
 {t:'point',kick:'The core problem',h:'Green to gone.',p:'The account that looks healthy on every dashboard is often the one about to leave. Health metrics measure comfort, not growth, so they stay quiet right up until the notice arrives.'},
 {t:'part',kick:'Part two',h:'The Growth Department method.'},
 {t:'point',kick:'The method',h:'Act like an owner, not a caretaker.',p:'Top account managers treat their book like a portfolio to grow, not a set of relationships to maintain. The owner asks a different question: where is the next dollar of value, and how do we build it together?'},
 {t:'lenses',kick:'The four competencies',h:'What a growth-minded account manager actually does.',li:[['Solve bigger problems','Move from the request in front of you to the outcome behind it.'],['Relentless curiosity','Understand the customer’s business well enough to see what they cannot.'],['Act like an owner','Run the account as a portfolio with a plan, not a queue of tickets.'],['Protect your energy','Reclaim time from internal noise so the strategic work gets done.']]},
 {t:'point',kick:'The instrument',h:'The QBR is where you grow the account or lose it.',p:'A quarterly business review is not a status update. Run right, it is the one recurring moment where you surface the next outcome, agree the plan, and re-earn the next year of revenue.'},
 {t:'cycle',kick:'The expansion move',h:'A10X: from one account to a portfolio.',steps:['Ask where they want to be in five years','Map the outcomes only you can move','Turn the QBR into a growth plan, not a status update','Price and propose the next stage of value','Re-earn the renewal by growing the account'],p:'This is how an account compounds instead of merely surviving.',who:'<b>From Alex’s work:</b> a single $50,000 account grown to $10 million, 200x, by asking where the customer wanted to be in five years.'},
 {t:'point',kick:'The prerequisite',h:'You cannot grow accounts in the time you have left over.',p:'The strategic work only happens when you reclaim capacity from internal noise: the status meetings, the manual reporting, the firefighting. Capacity is the prerequisite, not the reward.'},
 {t:'part',kick:'Part three',h:'What a growth quarter looks like.'},
 {t:'looks',kick:'The outcome',h:'Post-sale, running as the growth engine.',li:[['Revenue you can see','You know which accounts will grow, and by how much.'],['Expansion has an owner','The account manager runs a plan, not a queue.'],['Renewals get re-earned early','Growth conversations happen long before a notice ever would.']]},
 {t:'whyme',kick:'Why Alex',h:'The person who wrote the book on this.',li:[['Founder of AMplify','The home and community for account managers: the book, six programs and the workshops.'],['Author of The Growth Department','The playbook for turning post-sale into a revenue engine.'],['Ten years, hundreds of companies','Host of the Account Management Secrets podcast.']]},
 {t:'cta',kick:'Your next step',h:'Ready to build your growth department?',ctas:['<b>Join AMplify</b> for the programs, templates and community that turn this into your daily practice.','<b>Bring it to your team</b> with a corporate workshop that installs the operating standard.'],disc:'This masterclass is educational. It shares frameworks and approaches for growing accounts; it is not advice for your specific situation and not a guarantee of any particular result. Outcomes vary by company and by account.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
