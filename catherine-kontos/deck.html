<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Profitable Retreat, Catherine Kontos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#f7f4ef;   /* warm off-white background */
    --ink:#2b2b2b;    /* ink */
    --accent:#5f7a5c; /* sage accent */
    --paper:#fffdf9;
    --mute:#6f6a62;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f7f4ef;color:#2b2b2b}
  body{
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:48px 20px 80px;
  }
  .deck{max-width:960px;margin:0 auto}
  .slide{
    background:var(--paper);
    border:1px solid #e7e1d6;
    border-radius:4px;
    padding:64px 64px 56px;
    margin:0 auto 34px;
    position:relative;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .horizon{
    height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    opacity:.6;
    margin:22px 0;
    border:0;
  }
  .kicker{
    font-family:'Inter',sans-serif;
    text-transform:uppercase;
    letter-spacing:.22em;
    font-size:12px;
    font-weight:600;
    color:var(--accent);
    margin-bottom:18px;
  }
  h1{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;
    font-size:58px;
    line-height:1.05;
    letter-spacing:-.01em;
  }
  h2{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;
    font-size:40px;
    line-height:1.12;
    margin-bottom:10px;
  }
  .lede{font-size:20px;color:var(--mute);font-weight:300;margin-top:16px;max-width:44ch}
  p.body{font-size:17px;color:var(--ink);margin-top:14px;max-width:60ch}
  ul{margin:20px 0 0 0;list-style:none;max-width:62ch}
  ul li{
    position:relative;
    padding:10px 0 10px 28px;
    font-size:17px;
    border-bottom:1px solid #efe9df;
  }
  ul li:last-child{border-bottom:0}
  ul li:before{
    content:"";
    position:absolute;left:0;top:19px;
    width:10px;height:1px;background:var(--accent);
  }
  .big-num{
    font-family:'Cormorant Garamond',serif;
    font-size:22px;color:var(--accent);font-weight:600;
    margin-right:10px;
  }
  .slide .foot{
    position:absolute;bottom:18px;right:26px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b9b2a6;
  }
  .title-slide{background:var(--paper);padding-top:90px;padding-bottom:90px}
  .title-slide h1{font-size:72px}
  .reframe{background:var(--base)}
  .reframe h2{font-size:52px}
  .pill{
    display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);border:1px solid var(--accent);border-radius:999px;
    padding:5px 14px;margin-bottom:18px;font-weight:600;
  }
  .cta-slide{background:var(--base);text-align:left}
  .disc{font-size:13px;color:var(--mute);margin-top:30px;max-width:60ch;line-height:1.5}
  .cta-step{
    display:inline-block;margin-top:24px;padding:14px 26px;
    background:var(--accent);color:var(--paper);font-weight:600;font-size:15px;
    border-radius:3px;letter-spacing:.02em;
  }
  .byline{font-size:15px;color:var(--mute);margin-top:28px;letter-spacing:.02em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A live masterclass with Catherine Kontos',
   h:'The Profitable Retreat',
   lede:'Why a sold-out retreat still does not pay you, and the pricing and recurring-revenue system that fixes it.'},

  {t:'content',
   kicker:'The promise',
   h:'What you will leave with',
   body:'In the next 60 minutes, live, we rebuild the one part of your retreat almost no one optimizes: the money model. You will see where the margin leaks, how to price for profit, and how to turn a single weekend into a revenue stream that pays you long after everyone goes home.',
   list:['The real reason full retreats still barely clear costs','A pricing method built for profit, not just for a full room','How one retreat becomes recurring revenue']},

  {t:'content',
   kicker:'Who this is for',
   h:'You fill the room. It just does not pay.',
   body:'This is for retreat leaders, coaches and facilitators who are good at the work. Your people love the experience, your seats sell out, the testimonials are real. And then you run the numbers and the profit is almost nothing.',
   list:['You sell out and still feel broke afterward','You price from what feels fair, not from what the business needs','You pour months into an event that ends the day it ends']},

  {t:'reframe',
   kicker:'The hook',
   h:'Full does not equal profitable.',
   lede:'A sold-out retreat is a marketing win. It is not a business model. Those are two different problems, and almost every retreat leader only ever solves the first one.'},

  {t:'content',
   kicker:'Part One',
   h:'The money model nobody optimizes',
   body:'You optimize the room, the venue, the agenda, the vibe. You rarely touch the economics underneath. So the retreat can be beautiful, transformational and completely full, and still return you a few hundred dollars for a year of work. Profit is not what is left over. It is something you design in from the start.'},

  {t:'content',
   kicker:'Part One',
   h:'Where the margin actually leaks',
   body:'Three leaks quietly drain a sold-out retreat. Fix these and the same number of seats pays you a different number entirely.',
   list:['Price set by comparison and fear, not by the margin you need','Costs committed before the price is ever decided','The retreat treated as a one-off, so revenue stops the day it ends']},

  {t:'content',
   kicker:'Part One',
   h:'A retreat is not an event',
   body:'The most expensive belief in this industry is that a retreat is a thing that happens on a weekend. Treat it as an event and you get paid once. Treat it as the opening chapter of a relationship and the same guests keep paying you for years. That shift is the whole game.'},

  {t:'reframe',
   kicker:'Part Two',
   h:'The four pillars of a retreat that pays.',
   lede:'This is the method I teach inside the Mastering Retreats Certification, built over 14 years of owning and running real venues. We will walk each pillar.'},

  {t:'content',
   kicker:'Pillar one',
   h:'Pricing for Profit',
   body:'A retreat is planned from its conception all the way through to the post-retreat revenue stream. You start with the margin you need and design the offer to deliver it, instead of guessing a price and hoping something is left over.',
   list:['Set the profit target first, then build the experience to fit','Price the transformation, not the nights and the meals','Know your number before you sign a single venue contract']},

  {t:'content',
   kicker:'Pillar one',
   h:'Turn one retreat into recurring revenue',
   body:'The weekend is the beginning, not the invoice. A profitable retreat is engineered to open a longer relationship: continuation programs, memberships, next-level experiences and a path your guests want to keep walking with you.',
   list:['Design the next step before the current retreat ends','Build a post-retreat offer your best guests expect','Measure success by the year of revenue, not the weekend']},

  {t:'content',
   kicker:'Pillar two',
   h:'Intentional Design',
   body:'Before anything is booked, you set clear intentions and define the outcomes you want your guests to walk away with. You identify the exact growth areas to target, and then every element of the retreat, from the room to the schedule to the price, is built to serve those outcomes. Intention is what makes a retreat worth a premium.'},

  {t:'content',
   kicker:'Pillar three',
   h:'Transformative experiences',
   body:'Transformation is designed, not hoped for. You build experiential moments that move people out of their comfort zone and into real change.',
   list:['Workshops and group work that create genuine shifts','Outdoor and mindfulness practice that resets the nervous system','Experiences people cannot get from a course or a call']},

  {t:'content',
   kicker:'Pillar three',
   h:'The Mastermind opening',
   body:'I open every retreat with a Mastermind technique in the first session. It surfaces each person core mindset blocks on day one, so the rest of the retreat can actually dismantle them. It also tells guests, within the first hour, that this room is different. That is what earns the price and the referral.'},

  {t:'content',
   kicker:'Pillar four',
   h:'Impactful destination and corporate retreats',
   body:'Corporate and destination retreats are the high-ticket channel most wellness leaders never touch. Organizations have budgets individuals do not, and a single corporate engagement can be a six to seven figure channel. The same skills you already have, aimed at a buyer who can pay.',
   list:['One corporate client can outweigh a year of individual seats','Destination events command premium pricing and prestige','You already have the facilitation skill the market is paying for']},

  {t:'reframe',
   kicker:'Part Three',
   h:'What a profitable retreat business looks like.',
   lede:'Not a heroic weekend you recover from. A repeatable system: intentional design, priced for profit, feeding a recurring-revenue relationship, with a high-ticket corporate channel on top.'},

  {t:'content',
   kicker:'Part Three',
   h:'From sold out to sustainable',
   body:'When all four pillars are working, the retreat stops being a gamble. You know your margin before you launch. The weekend opens a relationship instead of closing a transaction. And you build a business that funds the life you started this work to live.',
   list:['Predictable profit per retreat, known in advance','Revenue that continues long after the guests go home','A credible, premium position in a crowded market']},

  {t:'content',
   kicker:'Why me',
   h:'Why learn this from Catherine',
   body:'I am Catherine Kontos, founder of RetreatBoss, RetreatMatch and RetreatBoss Magazine. I have spent 14 years in the retreat industry, owning, operating and managing retreat properties, and I have bought and sold more than 100 businesses and properties, including retreat venues. I launched my retreat business while going through cancer treatment, so I have no patience for retreats that look beautiful and pay nothing.',
   list:['14+ years owning and running real retreat venues','Bought and sold 100+ businesses and properties','Creator of the ICF-approved Mastering Retreats Certification']},

  {t:'content',
   kicker:'The credential',
   h:'The Mastering Retreats Certification',
   body:'Everything in this masterclass is one layer of a complete, ICF-approved program. The certification carries 37.5 CCE points and the Certified Preferred Retreat Leader designation, and it takes the pricing, design and recurring-revenue system far deeper than a single live session can.'},

  {t:'cta',
   kicker:'Your next step',
   h:'Build the retreat that finally pays you.',
   body:'If you are ready to stop confusing a full room with a profitable business, here is your next step with me.',
   steps:['Explore the Mastering Retreats Certification','Book a call with Catherine'],
   disc:'This masterclass is educational. Results are educational and not guaranteed, and no income or earnings guarantee is made or implied. Results vary based on your market, your work and many factors outside this session.'}
];

const deck = document.getElementById('deck');

function renderList(items){
  if(!items) return '';
  return '<ul>' + items.map(function(i){return '<li>'+i+'</li>';}).join('') + '</ul>';
}

S.forEach(function(s, idx){
  const el = document.createElement('section');
  const n = (idx+1) + ' / ' + S.length;
  if(s.t === 'title'){
    el.className = 'slide title-slide';
    el.innerHTML =
      '<div class="kicker">'+s.kicker+'</div>'+
      '<h1>'+s.h+'</h1>'+
      '<hr class="horizon">'+
      '<p class="lede">'+s.lede+'</p>'+
      '<div class="foot">'+n+'</div>';
  } else if(s.t === 'reframe'){
    el.className = 'slide reframe';
    el.innerHTML =
      '<div class="kicker">'+s.kicker+'</div>'+
      '<h2>'+s.h+'</h2>'+
      '<hr class="horizon">'+
      (s.lede ? '<p class="lede">'+s.lede+'</p>' : '')+
      '<div class="foot">'+n+'</div>';
  } else if(s.t === 'cta'){
    el.className = 'slide cta-slide';
    el.innerHTML =
      '<span class="pill">'+s.kicker+'</span>'+
      '<h2>'+s.h+'</h2>'+
      '<hr class="horizon">'+
      '<p class="body">'+s.body+'</p>'+
      s.steps.map(function(st){return '<div><span class="cta-step">'+st+'</span></div>';}).join('')+
      '<p class="disc">'+s.disc+'</p>'+
      '<div class="byline">Catherine Kontos · RetreatBoss</div>'+
      '<div class="foot">'+n+'</div>';
  } else {
    el.className = 'slide';
    el.innerHTML =
      '<div class="kicker">'+s.kicker+'</div>'+
      '<h2>'+s.h+'</h2>'+
      '<hr class="horizon">'+
      (s.body ? '<p class="body">'+s.body+'</p>' : '')+
      renderList(s.list)+
      '<div class="foot">'+n+'</div>';
  }
  deck.appendChild(el);
});
</script>
</body>
</html>
