<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch &amp; Refine Your Signature Program - Wit &amp; Wire Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#f2f1ee;
    --ink:#1d1e1f;
    --muted:#5b5f61;
    --accent:#347180;
    --accent-soft:#e4eef0;
    --display:'Cabin',system-ui,sans-serif;
    --body:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#dcdad4;font-family:var(--body);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(96vw,1120px);aspect-ratio:16/9;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.18);border-radius:6px}
  .slide{position:absolute;inset:0;padding:64px 72px;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kicker{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h3{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15;color:var(--accent)}
  p{font-size:21px;line-height:1.5;color:var(--muted);max-width:44ch}
  p.lead{font-size:24px;color:var(--ink)}
  .sub{font-size:23px;color:var(--muted);margin-top:20px;max-width:46ch}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px}
  li{font-size:21px;line-height:1.4;color:var(--ink);padding-left:30px;position:relative;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .presenter{margin-top:34px;font-size:18px;color:var(--muted)}
  .presenter strong{color:var(--ink);font-weight:600}
  .phase-row{display:flex;gap:18px;margin-top:26px}
  .phase{flex:1;background:var(--panel);border-radius:10px;padding:22px 20px;border-top:4px solid var(--accent)}
  .phase .n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.1em;text-transform:uppercase}
  .phase h4{font-family:var(--display);font-size:22px;margin:6px 0 8px}
  .phase p{font-size:16px;line-height:1.4;max-width:none}
  .big{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.06;letter-spacing:-.01em;color:var(--ink);max-width:20ch}
  .accentword{color:var(--accent)}
  .panelbox{background:var(--panel);border-radius:12px;padding:30px 34px;margin-top:24px;border-left:5px solid var(--accent);max-width:52ch}
  .panelbox p{color:var(--ink)}
  .stat{font-family:var(--display);font-weight:700;color:var(--accent);font-size:22px}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.4}
  .cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-family:var(--display);font-weight:600;font-size:20px;padding:15px 30px;border-radius:8px;text-decoration:none}
  .num{position:absolute;bottom:22px;right:28px;font-size:13px;color:var(--muted);letter-spacing:.08em}
  .brandmark{position:absolute;top:26px;left:72px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  .nav button{font-family:var(--body);border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S=[
 {t:'title',kicker:'A Wit & Wire Masterclass',h:'Launch &amp; Refine Your Signature Program',sub:'How to build an online program that gets stronger as it grows, without a huge audience or complicated tech.',presenter:'Melissa Guller &middot; Founder, Wit &amp; Wire'},

 {t:'body',kicker:'What you will walk away with',h2:'Three things by the end of this hour',list:['A way to know your program will sell before you build the whole thing','A launch you can run with a small list and almost no tech','A simple system that keeps enrolling students after the launch ends']},

 {t:'body',kicker:'Who this is for',h2:'You already know your topic',lead:'You are an established solo expert with real knowledge to teach. You have an audience, even a small one, and people who trust you.',sub:'What you do not have yet is a repeatable way to turn that expertise into a program that sells on its own.'},

 {t:'body',kicker:'The trap',h2:'The launch-and-pray playbook',lead:'The advice everywhere assumes you have a big email list, a paid ads budget, and weeks to build funnels.',sub:'So you spend months building a course in the dark, launch to a small audience, and hear crickets. Then you blame yourself instead of the playbook.'},

 {t:'statement',big:'You do not need a bigger audience. You need a <span class="accentword">stronger program</span>.'},

 {t:'body',kicker:'Part one',h2:'Why most programs stall',lead:'The problem is almost never the teaching. It is the order of operations.',list:['You build the entire program before a single person has paid for it','Your launch depends on volume you do not have yet','After launch week, enrollment goes quiet because nothing is running']},

 {t:'body',kicker:'The reframe',h2:'A program has a lifecycle',lead:'A program is not a one-time launch. It grows through stages, and each stage needs a different move.',sub:'Use the wrong move at the wrong stage and it feels like the whole thing is broken. Match the move to the stage and it compounds.'},

 {t:'phases',kicker:'Part two: the method',h2:'The Program Lifecycle Method',phases:[
   {n:'Phase 1',t:'Validate',p:'Build a minimum viable version and enroll your first paying Founding Students. Prove real demand before you build the whole thing.'},
   {n:'Phase 2',t:'Elevate',p:'Expand your students, fold in their feedback, solidify the experience, and gather proof that makes the next round easier to sell.'},
   {n:'Phase 3',t:'Automate',p:'Layer in a personalized mix of organic, paid, and partnership channels so students enroll year-round without you carrying every launch by hand.'}
 ]},

 {t:'body',kicker:'Phase one, up close',h2:'Validate before you build',lead:'Founding Students pay a real price for an early version. Their money is the only proof that matters.',list:['A minimum viable course, not the finished product','A small founding cohort who paid to be there','Their questions become your real curriculum']},

 {t:'body',kicker:'The launch mechanic',h2:'The Low-Tech Launch Strategy',lead:'You can earn your first sales in 30 days or less without a massive list or prior digital-product experience.',sub:'No complicated funnel stack, no ads budget required. Simple, human, and repeatable, so first-time creators actually finish.'},

 {t:'body',kicker:'Phase two, up close',h2:'Elevate what already works',lead:'Once the concept is proven, you refine instead of guess.',list:['Improve the parts students got stuck on','Automate delivery so you stop repeating yourself','Collect the student results that shorten every future sale']},

 {t:'body',kicker:'Phase three, up close',h2:'The Magnetic Mini Funnel',lead:'A small, evergreen offer that attracts buyers long-term and earns consistently, with or without social media.',sub:'It turns your program from a launch you dread into a steady stream, independent of any one platform.'},

 {t:'body',kicker:'Part three',h2:'Running the lifecycle in real life',lead:'Students who follow the lifecycle in order tend to start small and compound.',list:['Founding rounds that fund the build instead of a leap of faith','First launches run from a small, engaged list','Cohorts that grow each round as the program gets stronger']},

 {t:'panel',kicker:'The shift',h2:'From one big launch to a system',text:'A single launch is an event you have to survive. The Program Lifecycle Method turns your signature program into an asset that gets stronger, and easier to sell, every single round.'},

 {t:'body',kicker:'Why me',h2:'Where this comes from',lead:'I have spent a decade inside the course world so you do not have to learn it the hard way.',list:['Built my own online business past $1M in revenue','Former Director of Marketing at Teachable','Senior Course Launch Manager for Ramit Sethi','Top-rated instructor at General Assembly and on Skillshare']},

 {t:'body',kicker:'Recap',h2:'The three moves, in order',list:['Validate: prove demand with paying Founding Students','Elevate: refine, automate delivery, gather proof','Automate: steady enrollment with the Magnetic Mini Funnel']},

 {t:'cta',kicker:'Your next step',h2:'Let us map your program lifecycle',text:'If you want help turning your expertise into a signature program that gets stronger as it grows, book a discovery call with me and we will look at where your program is now and the next right move.',cta:'Book a discovery call at witandwire.com',disc:'This masterclass is educational. No income or result is guaranteed. Results vary based on your work, your market, and your audience, and nothing here is a promise of specific earnings.'}
];
let i=0;const stage=document.getElementById('stage');
function slideHTML(s,idx){
 let inner='';
 const brand='<div class="brandmark">Wit &amp; Wire</div>';
 if(s.t==='title'){
   inner=`<div class="kicker">${s.kicker}</div><h1>${s.h}</h1><p class="sub">${s.sub}</p><div class="presenter">${s.presenter}</div>`;
 }else if(s.t==='statement'){
   inner=`<div class="big">${s.big}</div>`;
 }else if(s.t==='phases'){
   let cards=s.phases.map(p=>`<div class="phase"><div class="n">${p.n}</div><h4>${p.t}</h4><p>${p.p}</p></div>`).join('');
   inner=`<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><div class="phase-row">${cards}</div>`;
 }else if(s.t==='panel'){
   inner=`<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><div class="panelbox"><p class="lead">${s.text}</p></div>`;
 }else if(s.t==='cta'){
   inner=`<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><p class="lead">${s.text}</p><span class="cta-btn">${s.cta}</span><p class="disclaimer">${s.disc}</p>`;
 }else{
   inner=`<div class="kicker">${s.kicker||''}</div>`;
   if(s.h2)inner+=`<h2>${s.h2}</h2>`;
   if(s.lead)inner+=`<p class="lead">${s.lead}</p>`;
   if(s.list)inner+='<ul>'+s.list.map(x=>`<li>${x}</li>`).join('')+'</ul>';
   if(s.sub)inner+=`<p class="sub">${s.sub}</p>`;
 }
 return `<div class="slide${idx===i?' on':''}">${brand}${inner}<div class="num">${idx+1} / ${S.length}</div></div>`;
}
function render(){stage.innerHTML=S.map(slideHTML).join('');}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
