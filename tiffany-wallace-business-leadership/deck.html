<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Money-Making Genius Zone — Well Integrated Woman with Tiffany Wallace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b1716;
    --panel:#272727;
    --ink:#f3ece6;
    --rule:#3a3330;
    --accent:#b08d57;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Montserrat',sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 8vw;
  }
  .slide{
    display:none;
    width:100%;
    max-width:960px;
    animation:fade .5s ease;
  }
  .slide.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  .eyebrow{
    font-family:'Montserrat',sans-serif;
    font-weight:500;
    font-size:.72rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:1.4rem;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(2.6rem,6vw,4.8rem);
    line-height:1.04;
    letter-spacing:.01em;
  }
  h2{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(2rem,4.6vw,3.4rem);
    line-height:1.08;
    margin-bottom:1.2rem;
  }
  .sub{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.2rem,2.4vw,1.7rem);
    color:var(--ink);
    opacity:.85;
    margin-top:1.4rem;
    max-width:40ch;
  }
  .body{
    font-size:clamp(1rem,1.5vw,1.18rem);
    line-height:1.7;
    font-weight:300;
    max-width:48ch;
    color:var(--ink);
    opacity:.92;
  }
  .brand{
    margin-top:2.6rem;
    font-size:.78rem;
    letter-spacing:.26em;
    text-transform:uppercase;
    font-weight:500;
    color:var(--ink);
    opacity:.7;
  }
  /* integration seam motif */
  .seam{
    width:120px;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    margin:1.6rem 0;
  }
  .seam.center{margin-left:auto;margin-right:auto;}

  ul.points{list-style:none;margin-top:1.6rem;}
  ul.points li{
    position:relative;
    padding-left:1.8rem;
    margin-bottom:1rem;
    font-size:clamp(1rem,1.5vw,1.18rem);
    line-height:1.6;
    font-weight:300;
    max-width:52ch;
  }
  ul.points li::before{
    content:"";
    position:absolute;
    left:0;top:.65em;
    width:10px;height:1px;
    background:var(--accent);
  }

  .section-num{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1.3rem;
    color:var(--accent);
    margin-bottom:.6rem;
    letter-spacing:.04em;
  }

  .quote{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(1.8rem,4vw,3rem);
    line-height:1.18;
    max-width:24ch;
  }
  .quote .hl{color:var(--accent);}

  /* three-input overlap cards */
  .inputs{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.8rem;}
  .inputs .card{
    flex:1 1 180px;
    background:var(--panel);
    border:1px solid var(--rule);
    border-top:2px solid var(--accent);
    padding:1.4rem 1.2rem;
  }
  .inputs .card .lbl{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    color:var(--accent);
    font-size:1.1rem;
    margin-bottom:.5rem;
  }
  .inputs .card p{font-size:.95rem;line-height:1.5;font-weight:300;opacity:.9;}

  .pillars{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.6rem;}
  .pillars .p{
    flex:1 1 140px;
    background:var(--panel);
    border:1px solid var(--rule);
    padding:1.1rem;
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:1.15rem;
    color:var(--ink);
  }
  .pillars .p span{display:block;color:var(--accent);font-size:.7rem;letter-spacing:.2em;font-family:'Montserrat';text-transform:uppercase;margin-bottom:.5rem;opacity:.9;}

  .ladder{margin-top:1.6rem;}
  .ladder .rung{
    background:var(--panel);
    border-left:2px solid var(--accent);
    padding:.9rem 1.2rem;
    margin-bottom:.7rem;
    font-size:1.05rem;
    font-weight:300;
  }
  .ladder .rung b{font-family:'Cormorant Garamond';font-weight:600;font-style:italic;color:var(--accent);}

  .cta-box{
    background:var(--panel);
    border:1px solid var(--rule);
    border-top:2px solid var(--accent);
    padding:1.3rem 1.6rem;
    display:inline-block;
    margin-top:1.8rem;
    font-family:'Cormorant Garamond',serif;
    font-size:1.5rem;
    color:var(--ink);
  }
  .cta-box .step{display:block;font-family:'Montserrat';font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:.6rem;}
  .disclaimer{
    margin-top:2.4rem;
    font-size:.72rem;
    line-height:1.5;
    opacity:.55;
    max-width:52ch;
    font-weight:300;
  }

  .tm{font-size:.55em;vertical-align:super;opacity:.8;}

  #nav{
    position:fixed;
    bottom:3vh;right:4vw;
    display:flex;align-items:center;gap:1rem;
    z-index:10;
  }
  #nav button{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--ink);
    width:40px;height:40px;
    cursor:pointer;
    font-size:1rem;
    transition:.2s;
  }
  #nav button:hover{border-color:var(--accent);color:var(--accent);}
  #counter{
    font-size:.75rem;letter-spacing:.2em;opacity:.6;
    min-width:54px;text-align:center;
  }
  .prog{position:fixed;top:0;left:0;height:2px;background:var(--accent);z-index:20;transition:width .3s;}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div id="stage"></div>
<div id="nav">
  <button id="prev" aria-label="Previous">&larr;</button>
  <span id="counter"></span>
  <button id="next" aria-label="Next">&rarr;</button>
</div>

<script>
const S = [
  {t:'title',
    eyebrow:'A Sample Masterclass',
    headline:'Your Money-Making Genius Zone',
    sub:'How to turn what you already know into income that fits your life.',
    brand:'Well Integrated Woman with Tiffany Wallace'
  },
  {t:'content',
    eyebrow:'Who this is for',
    title:'For the woman who knows she has more to give',
    body:'This is for women entrepreneurs, leaders and online business owners who have real knowledge to share. You are the expert. You have the experience. Yet your offers are not converting the way you know they should.'
  },
  {t:'content',
    eyebrow:'The trap',
    title:'More offers than ever, less clarity than ever',
    body:'You keep stacking. Another course. Another freebie. Another funnel. Each one promised to be the answer, and each one left you busier and more scattered than before.'
  },
  {t:'quote',
    eyebrow:'The reframe',
    quote:['More offers will not fix it. The problem is not your marketing. It is that you are building from ','tactics',' instead of from your ','genius zone','.']
  },
  {t:'section',
    num:'Part One',
    title:'The scattered-offer trap',
    body:'Knowledge does not convert when it is not rooted in one clear zone. Six offers, and not one of them truly lands. The issue was never effort. It was the absence of a center.'
  },
  {t:'content',
    eyebrow:'The hidden cost',
    title:'Growth that costs you your life is not success',
    body:'Hustle. Burnout. Self-abandonment. This is the Well Integrated Woman thesis: who you are and how you earn must be aligned. When they are not, every win quietly takes something from you.'
  },
  {t:'section',
    num:'Part Two',
    title:'The Money-Making Genius Zone',
    tm:true,
    body:'There is a single zone where three things overlap. Find it, and your knowledge finally has somewhere to land. This is the heart of the work.'
  },
  {t:'content',
    eyebrow:'Input one',
    title:'What you know deeply',
    body:'Your real expertise. The knowledge you have earned through years of doing the work, the understanding that feels obvious to you and rare to everyone else.'
  },
  {t:'content',
    eyebrow:'Input two',
    title:'What you love to teach',
    body:'Your passion. The work you would do anyway, whether or not anyone paid you. The conversations you never get tired of having.'
  },
  {t:'content',
    eyebrow:'Input three',
    title:'What women will pay for',
    body:'Real market demand. The outcome women are already searching for, already investing in, already ready to say yes to.'
  },
  {t:'inputs',
    eyebrow:'Where they meet',
    title:'Your Money-Making Genius Zone',
    tm:true,
    body:'Where those three meet is where the money is.',
    cards:[
      {lbl:'What you know deeply',p:'Your real expertise.'},
      {lbl:'What you love to teach',p:'The work you would do anyway.'},
      {lbl:'What women will pay for',p:'Real market demand.'}
    ]
  },
  {t:'pillars',
    eyebrow:'The framework',
    title:'The ICON Framework',
    tm:true,
    body:'Once you know your zone, the ICON Framework gets you clear on four things, so one clear offer finally emerges.',
    pillars:[
      {span:'Pillar',t:'Your genius zone'},
      {span:'Pillar',t:'Your personal brand'},
      {span:'Pillar',t:'Your messaging'},
      {span:'Pillar',t:'Your vision'}
    ]
  },
  {t:'ladder',
    eyebrow:'The structure',
    title:'The Monetization Mastery Matrix',
    tm:true,
    body:'One genius zone becomes a coherent ladder of money pathways, instead of six disconnected offers.',
    rungs:[
      {b:'First',x:'A digital product that opens the door.'},
      {b:'Then',x:'A course that teaches the method in depth.'},
      {b:'Then',x:'Coaching that delivers the transformation.'}
    ]
  },
  {t:'content',
    eyebrow:'The alignment',
    title:'The Live-Your-Brand Strategy',
    tm:true,
    body:'Your brand and messaging become an extension of your leadership and identity, not a mask you perform. You stop selling a version of yourself and start leading as yourself.'
  },
  {t:'section',
    num:'Part Three',
    title:'The integrated business',
    body:'Life and work, aligned. A business that markets as an extension of who you are. This is what it looks like on the other side: not a bigger hustle, but a quieter, truer one.'
  },
  {t:'content',
    eyebrow:'Why me',
    title:'Why I teach this',
    body:'I am a former school teacher with a Master’s and an Education Specialist degree in Leadership. I built a self-made multi-six-figure online business, and I host the top-ranking Well Integrated Woman podcast. I teach integration because I built my business on it.'
  },
  {t:'pillars',
    eyebrow:'The recap',
    title:'Four moves to an integrated business',
    pillars:[
      {span:'One',t:'Find your genius zone'},
      {span:'Two',t:'Clarify with ICON'},
      {span:'Three',t:'Build the ladder'},
      {span:'Four',t:'Let your brand lead'}
    ]
  },
  {t:'cta',
    eyebrow:'Your next step',
    headline:'Ready to find and monetize your genius zone?',
    body:'Join the ICON Program and work with Tiffany inside Well Integrated Woman, where who you are and how you earn finally become one.',
    step:'Join the ICON Program',
    stepLine:'Work with Tiffany inside Well Integrated Woman',
    brand:'Well Integrated Woman with Tiffany Wallace',
    disclaimer:'This masterclass is for educational purposes only. Results vary and are not guaranteed. Nothing here is a promise of income or earnings.'
  }
];

const stage = document.getElementById('stage');
const tm = '<span class="tm">TM</span>';

function render(){
  stage.innerHTML = '';
  S.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'slide' + (i===cur?' active':'');
    let h = '';
    if(s.eyebrow) h += `<div class="eyebrow">${s.eyebrow}</div>`;

    if(s.t==='title'){
      h += `<h1>${s.headline}</h1><div class="seam"></div><div class="sub">${s.sub}</div><div class="brand">${s.brand}</div>`;
    }
    else if(s.t==='section'){
      h += `<div class="section-num">${s.num}</div><h2>${s.title}${s.tm?tm:''}</h2><div class="seam"></div><div class="body">${s.body}</div>`;
    }
    else if(s.t==='content'){
      h += `<h2>${s.title}${s.tm?tm:''}</h2><div class="seam"></div><div class="body">${s.body}</div>`;
    }
    else if(s.t==='quote'){
      const q = s.quote.map(part=> (part==='tactics'||part==='genius zone')?`<span class="hl">${part}</span>`:part).join('');
      h += `<div class="quote">${q}</div>`;
    }
    else if(s.t==='inputs'){
      h += `<h2>${s.title}${s.tm?tm:''}</h2><div class="seam"></div><div class="body">${s.body}</div><div class="inputs">`;
      s.cards.forEach(c=>{ h += `<div class="card"><div class="lbl">${c.lbl}</div><p>${c.p}</p></div>`; });
      h += `</div>`;
    }
    else if(s.t==='pillars'){
      h += `<h2>${s.title}${s.tm?tm:''}</h2><div class="seam"></div>`;
      if(s.body) h += `<div class="body">${s.body}</div>`;
      h += `<div class="pillars">`;
      s.pillars.forEach(p=>{ h += `<div class="p"><span>${p.span}</span>${p.t}</div>`; });
      h += `</div>`;
    }
    else if(s.t==='ladder'){
      h += `<h2>${s.title}${s.tm?tm:''}</h2><div class="seam"></div><div class="body">${s.body}</div><div class="ladder">`;
      s.rungs.forEach(r=>{ h += `<div class="rung"><b>${r.b}:</b> ${r.x}</div>`; });
      h += `</div>`;
    }
    else if(s.t==='cta'){
      h += `<h1>${s.headline}</h1><div class="seam"></div><div class="body">${s.body}</div>`;
      h += `<div class="cta-box"><span class="step">${s.step}</span>${s.stepLine}</div>`;
      h += `<div class="brand">${s.brand}</div>`;
      h += `<div class="disclaimer">${s.disclaimer}</div>`;
    }
    d.innerHTML = h;
    stage.appendChild(d);
  });
  document.getElementById('counter').textContent = (cur+1)+' / '+S.length;
  document.getElementById('prog').style.width = ((cur+1)/S.length*100)+'%';
}

let cur = 0;
function go(n){ cur = Math.max(0,Math.min(S.length-1,n)); render(); }
document.getElementById('next').onclick = ()=>go(cur+1);
document.getElementById('prev').onclick = ()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});
render();
</script>
</body>
</html>
