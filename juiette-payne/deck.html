<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Is a Language — Starving Artists Courses Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fb;
    --panel:#ffffff;
    --ink:#272d34;
    --muted:#55636f;
    --rule:#dbe2ea;
    --accent:#2e91fc;
    --display:'Rubik',system-ui,sans-serif;
    --text:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--text)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 3px rgba(39,45,52,.05)}
  .kick{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  .kick::after{content:"";display:block;width:52px;height:3px;background:var(--accent);margin-top:12px;border-radius:2px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.12;margin-bottom:18px}
  p{font-size:19px;line-height:1.6;color:var(--muted);margin-bottom:14px;max-width:62ch}
  p.lead{font-size:22px;color:var(--ink)}
  .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.1;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:3px}
  li b{font-family:var(--display);font-weight:600}
  .presenter{margin-top:26px;font-size:17px;color:var(--muted)}
  .presenter b{color:var(--ink);font-family:var(--display);font-weight:600}
  .slide.title{background:linear-gradient(180deg,#ffffff 0%,#eef3fa 100%)}
  .slide.cta{background:var(--ink);color:#fff;border-color:var(--ink)}
  .slide.cta h2,.slide.cta .big{color:#fff}
  .slide.cta p{color:#c7d0da}
  .slide.cta .kick{color:#8fc4ff}
  .slide.cta .kick::after{background:#8fc4ff}
  .cta-step{font-family:var(--display);font-weight:600;font-size:24px;color:#fff;margin:18px 0 8px}
  .disclaimer{margin-top:28px;font-size:14px;line-height:1.5;color:#9aa6b2;max-width:70ch}
  .num{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:'title',k:'A Live Masterclass',h:'Music Is a Language',
   s:'How to play real songs from day one, without drowning in theory first.',
   presenter:'With Juiette Payne, Founder & Music Director, Starving Artists Courses'},

  {t:'who',k:'Who this is for',h:'For anyone who has always wanted to play.',
   s:'Adult beginners picking up an instrument for the first time, parents who want their kids to actually stick with it, and returning players who stalled out years ago. Eight instruments, one idea.'},

  {t:'trap',k:'The trap',h:'You keep starting over.',
   s:'You download the app. You buy the book. You learn where middle C is and what a quarter note means. And three weeks later you still have not played a single song you love. So you stop, and you decide you are just not musical.'},

  {t:'reframe',k:'The reframe',h:'You were taught backwards.',
   s:'Nobody learns to speak a language by studying grammar first. A child hears it, feels it, copies it, and plays with it for years before they ever read a word. Music is a language too. And it should be learned the same way.'},

  {t:'part',k:'Part One',h:'The real reason beginners quit.',
   s:'It is almost never talent. It is that reading-first instruction puts the boring part before the fun part, so the joy that is supposed to keep you practicing never arrives. The gap between "learning music" and "making music" is where most people give up.'},

  {t:'cost',k:'The real cost',h:'Every restart teaches the wrong lesson.',
   s:'Each time you quit, the lesson you actually learn is "I cannot do this." That belief is the only thing most beginner methods reliably teach. It is also completely false, and it is fixable the moment the order of learning changes.'},

  {t:'part',k:'Part Two',h:'Music Is a Language: the method.',
   s:'Before you get consumed with reading music, you get to do the five things a musician actually does. Each one comes before notation, not after it.'},

  {t:'pillars',k:'The five moves',h:'How the method works.',
   bullets:[
     '<b>Hear it.</b> Train your ear on real music before a single symbol.',
     '<b>Feel it.</b> Rhythm and groove live in the body first.',
     '<b>Play it.</b> A real song in your hands in the first weeks, not months.',
     '<b>Create it.</b> Start making your own sound early, not just copying.',
     '<b>Communicate through it.</b> Music is expression, so you use it to say something.']},

  {t:'deep',k:'Hear it first',h:'Your ear leads, the page follows.',
   s:'Before a single symbol, you spend time hearing how real music is built: the melody, the groove, the way parts fit together. When you can hear it, reading it later becomes labeling something you already understand, instead of decoding a language you have never spoken.'},

  {t:'deep',k:'Play it early',h:'A real song in your hands in the first weeks.',
   s:'You do not wait months for permission to make music. You start on a song you actually chose, at a level you can handle, and you build technique as the song demands it. That early win is what turns a beginner into someone who keeps showing up.'},

  {t:'system',k:'The Foundations System',h:'Built for eight instruments.',
   s:'Guitar, bass, electric guitar, piano, drums, voice, violin, and music theory. Each Foundations track is a structured, step-by-step path that builds the real fundamentals and the building blocks of music, taught by a working professional musician who still performs.'},

  {t:'songs',k:'One song at a time',h:'Learn the songs you actually want to play.',
   s:'Instead of open-ended drills, you learn one real song at a time, step by step, with a new one to work toward every month. Technique shows up in service of the music you are making, which is exactly why you keep going.'},

  {t:'part',k:'Part Three',h:'From first notes to the stage.',
   s:'Private coaching adds a personalized development plan built around your goals, one on one with a working musician, in person or online. Distance does not decide the quality of your musical education. The plan grows with you from your first notes to performing in front of a room.'},

  {t:'coach',k:'One on one',h:'A plan built around you.',
   s:'Private coaching pairs you with a working musician for weekly sessions and a development plan shaped to your goals, your instrument, and the music you want to play. Thirty or sixty minutes a week, in person or online, with someone who adjusts the path as you grow.'},

  {t:'why',k:'Why learn here',h:'Talent is everywhere. Opportunity is not.',
   s:'Starving Artists began in 2013 as an after-school nonprofit arts program in Chicago, built on a simple belief: talent is everywhere, but the chance to develop it is not. That mission now runs online, taught by a roster of professional, performing musicians, so real music education reaches anyone who wants it.'},

  {t:'teachers',k:'Who teaches you',h:'Musicians who still perform.',
   s:'Every track is led by a professional, performing musician, not a generic lesson library on autopilot. You learn the craft from people who use it on stage, which is why the teaching stays practical and the music stays the point.'},

  {t:'recap',k:'Recap',h:'Play first. Read later. Keep going.',
   bullets:[
     'Reading-first instruction is why most beginners quit.',
     'Music is a language: hear it, feel it, play it, create it, communicate through it.',
     'Foundations across eight instruments, taught by working musicians.',
     'A real song in your hands early, one new song every month.']},

  {t:'cta',k:'Your next step',h:'Start playing real music.',
   step:'Begin a Foundations course, or book private coaching, at starvingartistscourses.com',
   s:'Pick your instrument, start with a song you love, and let the reading come later.',
   disclaimer:'This masterclass is educational. No specific result is guaranteed. Results vary and depend on your own practice and consistency.'}
];

const deck=document.getElementById('deck');
S.forEach((sl,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(sl.t==='title'?'title':sl.t==='cta'?'cta':'');
  let html='';
  if(sl.k) html+='<div class="kick">'+sl.k+'</div>';
  if(sl.h) html+=(sl.t==='title'?'<h1>'+sl.h+'</h1>':'<h2>'+sl.h+'</h2>');
  if(sl.step) html+='<div class="cta-step">'+sl.step+'</div>';
  if(sl.s) html+='<p'+(sl.t==='title'||sl.t==='trap'||sl.t==='reframe'?' class="lead"':'')+'>'+sl.s+'</p>';
  if(sl.bullets){html+='<ul>';sl.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul>';}
  if(sl.presenter) html+='<div class="presenter"><b>'+sl.presenter+'</b></div>';
  if(sl.disclaimer) html+='<div class="disclaimer">'+sl.disclaimer+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
