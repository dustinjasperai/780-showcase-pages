<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>From Call to Client · Jay Ruane, The Criminal Mastermind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f8fc; --panel:#e7ecf4; --rule:#d3dced;
    --acc:#2b63f0; --ink:#0f1b2d; --body:#3c4a61; --dim:#8494ab; --light:#eef3fb;
  }
  html,body{height:100%}
  body{background:#dbe3ef;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dbe3ef}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Archivo',Arial,sans-serif;font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:-.01em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.25vw;max-width:90%;font-weight:600}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.64;font-weight:400}
  .sub{font-family:'Inter',sans-serif;font-size:1.7vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.45;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.05vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#16273f 0%,#0f1b2d 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--light);font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#16273f 0%,#0f1b2d 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--light);font-weight:700}
  .t-cta .body{font-family:'Inter',sans-serif;color:#c6d4ea;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--light);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.84vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .call-motif{position:absolute;pointer-events:none}
  .title-call{right:7.5%;bottom:8%;width:15vw;opacity:.92}
  .corner-call{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Inter',sans-serif;font-size:1.12vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.04em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(15,27,45,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.6vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Criminal Mastermind</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: the intake call, a handset with signal waves, drawn in brand blue #2b63f0 -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="call" viewBox="0 0 120 120">
  <path d="M42 76c-9-9-14-20-14-31a7 7 0 017-7h11l6 15-9 6c3 6 7 11 13 15l6-9 15 6v11a7 7 0 01-7 7c-13 0-25-6-35-15z"
        fill="rgba(43,99,240,0.10)" stroke="#2b63f0" stroke-width="2" stroke-linejoin="round"/>
  <g fill="none" stroke="#2b63f0" stroke-width="2" stroke-linecap="round" opacity="0.72">
    <path d="M80 30a28 28 0 0114 15"/>
    <path d="M76 41a15 15 0 018 8"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'From Call to Client',sub:'How criminal defense firms turn more of the calls they already get into signed clients.',brand:true,call:'title'},
 {t:'normal',k:'Who this is for',title:'You are a great lawyer. Nobody taught you what to do when the phone rings.',body:'You run a criminal defense firm, and the phone does ring, because an arrest is an emergency. But too many of those callers never become clients. It is easy to decide you need more leads. Most of the time the caller who was going to hire you was already on the line, and the firm let them go.'},
 {t:'dark',title:'A phone that rings all day is not the same as a calendar full of signed clients.'},

 {t:'section',idx:'Part One',title:'Why Good Firms Lose the Caller'},
 {t:'normal',k:'This is not a normal buyer',title:'The person on the phone was just arrested. They are in crisis, not shopping.',body:'Often it is a terrified spouse or parent calling at the worst moment of their life. Treat them like a normal consumer, run the usual sales moves, and it backfires. They are not comparing features and price yet. They need to feel that someone has handled exactly this before and that they are going to be okay.'},
 {t:'normal',k:'Intake by accident',title:'Most firms let whoever answers wing it.',body:'The call that decides thousands of dollars in fees gets handled a different way every time, depending on who picks up and what kind of day they are having. With no system, the same firm converts a great call on Monday and loses an identical one on Tuesday, and never knows why the month came up short.'},
 {t:'dark',title:'You do not have a marketing problem. You have an intake problem.'},

 {t:'section',idx:'Part Two',title:'The From Call to Client Method'},
 {t:'normal',k:'One system, every call',title:'A repeatable intake, so conversion does not depend on who answers.',body:'The B.U.I.L.D. method gives every call the same structure, so a brand new intake person and a veteran attorney handle the crisis caller the same proven way. Consistency is the whole point. The firm stops leaving money on the table on random Tuesdays and starts converting the calls it already pays to generate.'},
 {t:'normal',k:'Pre-sell before you sell',title:'Handle the fear first, and price stops being the first objection.',body:'A caller in crisis cannot hear a fee while the panic is still running. Pre-selling calms them down, shows them you have handled this exact charge many times, and makes the consultation feel like relief instead of a sales call. Anxiety down and trust up, before a single number is ever said out loud.'},
 {t:'normal',k:'Protection over price',title:'Build the value so the fee is measured against what is at stake.',body:'When the conversation is about their freedom, their record, and their family, price becomes secondary to protection. You are not the expensive option, you are the one who understands what they stand to lose. The fee gets weighed against the consequence, not against the cheaper lawyer down the street.'},
 {t:'normal',k:'Close without pressure',title:'Let them choose you, then follow up with the ones who wait.',body:'High pressure repels a frightened buyer. A consultative close walks them to the decision, answers the real fear underneath their questions, and lets them hire you because it feels right. Then a simple follow-up system keeps the ones who are not ready today from vanishing for good.'},
 {t:'dark',title:'The client was already on the phone. The job is to not lose them.'},

 {t:'section',idx:'Part Three',title:'What Changes When Intake Is a System'},
 {t:'normal',k:'The firm this builds',title:'Same number of calls, more signed clients, and fees you actually hold.',body:'When every call runs the same proven way, your conversion rate stops swinging month to month. Your average fee holds, because you are no longer discounting to win a scared caller. And the marketing you already pay for finally pays off, because the leads it sends now turn into clients instead of missed calls.'},
 {t:'dark',title:'You cannot always get more calls. You can sign more of the ones you get.'},
 {t:'normal',k:'Why Jay Ruane',title:'The intake system behind a firm that grew from one lawyer to eight figures.',body:'Jay built Ruane Attorneys from a 2001 solo practice into a statewide Connecticut criminal defense firm with a team spread across three continents. He wrote From Call to Client to hand other owners the exact intake and sales system that did it. This masterclass is that method, built specifically for criminal defense.'},

 {t:'section',idx:'Your Next Step',title:'Turn More Calls Into Clients'},
 {t:'normal',k:'Keep going with Jay',title:'The full system, and a room of criminal defense owners running it.',body:'The Criminal Mastermind is where criminal defense firm owners put this to work with Jay, twice a month live, with the intake training, the systems library, and a community solving the same problems you are. Start with the intake and sales training, and join the room when you are ready to build the whole firm.'},
 {t:'cta',title:'Ready to turn more of your calls into clients?',body:'Take the next step with Jay Ruane and The Criminal Mastermind.',chips:['Get the intake and sales training','Join The Criminal Mastermind'],disc:'Educational content for criminal defense law firm owners. No income, case, or revenue result is guaranteed. Results vary by firm, market, and effort.'},
];

const deck=document.getElementById('deck');
function callmotif(kind){return `<svg class="call-motif ${kind==='title'?'title-call':'corner-call'}"><use href="#call"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Criminal <b>Mastermind</b> · Jay Ruane</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.call) h+=callmotif(s.call);
  else if(s.t==='title') h+=callmotif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
