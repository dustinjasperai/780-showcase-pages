<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewrite Your 'Enough' - A Masterclass with Susan A Sutherland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;800&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16140f;        /* her site ground, near-black */
    --panel:#211d15;     /* lifted warm charcoal */
    --rule:#5a7084;      /* her slate */
    --accent:#f4a736;    /* her amber/gold button color */
    --ink:#f7f3ea;       /* warm off-white */
    --muted:#b6ad9c;     /* dimmed warm grey */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
  #deck{max-width:1040px;margin:0 auto;padding:40px 22px 90px}
  .slide{background:var(--panel);border:1px solid rgba(90,112,132,.35);border-radius:18px;padding:60px 56px;margin:26px 0;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .k{font-family:"Poppins";font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:20px}
  h1{font-family:"Libre Franklin";font-weight:800;font-size:54px;line-height:1.05;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:"Libre Franklin";font-weight:800;font-size:38px;line-height:1.12;margin-bottom:18px}
  h3{font-family:"Libre Franklin";font-weight:600;font-size:24px;line-height:1.2;color:var(--accent);margin-bottom:12px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:62ch;margin-bottom:14px;font-weight:300}
  p.lead{font-size:22px;color:var(--ink)}
  .muted{color:var(--muted)}
  ul{list-style:none;margin:14px 0}
  li{font-size:19px;line-height:1.5;padding-left:30px;position:relative;margin-bottom:14px;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .num{font-family:"Libre Franklin";font-weight:800;font-size:22px;color:var(--bg);background:var(--accent);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .by{margin-top:26px;font-family:"Poppins";font-weight:400;font-size:17px;color:var(--muted)}
  .by b{color:var(--ink);font-weight:500}
  .cta h2{color:var(--accent)}
  .disc{margin-top:26px;font-family:"Poppins";font-size:13px;line-height:1.5;color:var(--muted);max-width:60ch}
  .big{font-family:"Libre Franklin";font-weight:800;font-size:46px;line-height:1.1}
  .pageno{position:absolute;right:26px;bottom:18px;font-family:"Poppins";font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', k:"A live masterclass", h:"Rewrite Your 'Enough'", p:"The Meant-for-More hour for leaders who already made it, and still feel the gap.", by:"with <b>Susan A Sutherland</b> &middot; Clear-Eyed Coaching &amp; Consulting"},

  {t:'promise', k:"What this hour gives you", h:"A definition of success you actually chose", items:["See the scorecard you have been running on, and where it came from","Name the 'more' you genuinely want in your role, your career and your life","Leave with one clear-eyed next decision, made from your gut and not the paper"]},

  {t:'for', k:"Who this is for", h:"You did everything right", p:"You reached the C-suite or the senior seat. The title, the compensation, the respect are all here. And a quiet question will not leave you alone: is this really it?", p2:"If that lands, you are exactly who this hour is for."},

  {t:'trap', k:"The trap", h:"The feeling shows up at the top, not the bottom", p:"Nobody warns you that 'arriving' can feel hollow. So most leaders assume something is wrong with them, push the thought down, and reach for more of the same, harder.", p2:"The feeling is not a flaw. It is information."},

  {t:'reframe', k:"The reframe", h:"'Enough' is a borrowed scorecard", p:"Almost every high achiever is winning a game somebody else set. More title. More revenue. More proof. You inherited that definition of enough early, and you have never once stopped to ask whether it is yours.", p2:"You cannot feel fulfilled hitting targets you did not choose."},

  {t:'part', k:"Part one", h:"Winning someone else's game", p:"Before we build anything new, we name the game you are actually playing, and what it has been costing you."},

  {t:'body', k:"The fulfillment gap", h:"Performance is not the problem", p:"You are not here because you underperform. You are here because performance stopped answering the question. More efficiency, more hustle, more optimization will not close a gap that was never about output.", p2:"This is why a regular executive performance coach cannot help with this. It is a different kind of work."},

  {t:'part', k:"Part two", h:"The Meant-for-More method", p:"Three shifts move you from a borrowed 'enough' to one you chose, on purpose."},

  {t:'pillar', n:"1", h:"Meant for More", p:"Instead of defaulting to 'more of the same, harder,' you name the specific more you actually want. More meaning, more freedom, more range, more aliveness. Vague restlessness becomes a concrete target you can move toward."},

  {t:'pillar', n:"2", h:"Decisions from the gut, not the paper", p:"The big calls get made on what is defensible on paper. The comp, the optics, the logical next rung. We flip that. You learn to make the decision that feels right in your gut, and then let the paper catch up, so your professional life matches who you actually are."},

  {t:'pillar', n:"3", h:"Joyful and burnout-free", p:"Fulfillment is not a reward you earn after one more sprint. It is how you lead now. Confident, contributive, and joyful, with your energy protected on purpose, because a leader running on fumes cannot lead anyone toward 'more.'"},

  {t:'part', k:"Part three", h:"A clear-eyed year, not a blow-up", p:"Not a dramatic exit. A series of congruent decisions that quietly compound into a life that fits."},

  {t:'body', k:"The shift", h:"From 'is this it' to 'this is mine'", items:["The restless question becomes a named direction you are moving toward","The next big decision gets made from congruence, not from sunk cost or optics","You stop proving and start leading, with room to actually enjoy the seat you earned"]},

  {t:'why', k:"Why me", h:"I have sat in that seat", p:"Nearly three decades in corporate, including the C-suite and years of board-level service. I burned out. Twice. I know the weight of the responsibility you carry, and the specific loneliness of having everything look right and still feel off.", p2:"I am not here to tell you to pack it in and become a yoga teacher. I am here to help you decide what 'enough' means for you, clearly."},

  {t:'quote', h:"Make decisions that feel right to you in your gut, not just on paper.", by:"The whole of this work, in one line."},

  {t:'recap', k:"The hour in one slide", h:"Three shifts", items:["Meant for More: name the 'more' you actually want","Gut, not paper: decide from congruence","Joyful and burnout-free: lead with your energy intact"]},

  {t:'cta', k:"Your next step", h:"Let's rewrite your 'enough' together", p:"If this is the work you have been circling, the next step is a conversation. Book an intro call, or step into the Meant for More Mastermind with a small pod of senior leaders doing exactly this.", by:"<b>Susan A Sutherland</b> &middot; SusanASutherland.com", disc:"This masterclass is for education and reflection. It is not advice for your specific situation, and nothing in it is a promise or guarantee of any particular result. Outcomes vary from leader to leader."}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide' + (s.t==='cta'?' cta':'');
  let html = '';
  if(s.k) html += '<div class="k">'+s.k+'</div>';
  if(s.n) html += '<div class="num">'+s.n+'</div>';
  if(s.t==='title'){ html += '<h1>'+s.h+'</h1>'; }
  else if(s.t==='quote'){ html += '<h2 class="big">&ldquo;'+s.h+'&rdquo;</h2>'; }
  else { html += '<h2>'+s.h+'</h2>'; }
  if(s.p) html += '<p class="lead">'+s.p+'</p>';
  if(s.p2) html += '<p>'+s.p2+'</p>';
  if(s.items){ html += '<ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(s.by) html += '<div class="by">'+s.by+'</div>';
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  html += '<div class="pageno">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
