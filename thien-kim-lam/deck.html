<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write the Story Only You Can Tell — a live masterclass with Thien-Kim Lam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2b1721;        /* dark wine, from her brand romance-red #b11b34 darkened */
    --panel:#3a2430;
    --rule:#80dbd5;      /* her site button teal */
    --accent:#80dbd5;    /* teal pop */
    --emph:#e07a8f;      /* soft rose, lightened from brand red for contrast on wine */
    --ink:#f4ece9;       /* warm off-white */
    --muted:#c9b4bc;
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Lato",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#170d13;color:var(--ink);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--bg);border:1px solid rgba(128,219,213,.22);border-radius:14px;
    padding:52px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rule)}
  .kicker{font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:800;font-size:46px;line-height:1.08;margin-bottom:16px}
  h2{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.14;margin-bottom:14px}
  .sub{font-size:19px;color:var(--muted);max-width:60ch}
  .presenter{margin-top:30px;font-size:15px;color:var(--ink);font-weight:700}
  .presenter span{color:var(--muted);font-weight:400}
  ul{list-style:none;margin-top:10px}
  li{position:relative;padding-left:30px;margin:14px 0;font-size:19px;max-width:66ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .body{font-size:19px;color:var(--ink);max-width:64ch;margin-top:6px}
  .big{font-family:var(--serif);font-style:italic;font-size:32px;line-height:1.25;max-width:24ch;color:var(--ink)}
  .label{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--emph);margin-bottom:10px}
  .pillarname{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--accent);margin-bottom:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:8px}
  .card{background:var(--panel);border-radius:10px;padding:22px 24px}
  .card h3{font-family:var(--serif);font-size:20px;margin-bottom:8px;color:var(--emph)}
  .card p{font-size:17px;color:var(--ink)}
  .foot{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .disc{margin-top:22px;font-size:14px;color:var(--muted);max-width:70ch}
  .num{position:absolute;left:26px;bottom:18px;font-size:12px;color:var(--muted)}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:0}h1{font-size:34px}h2{font-size:27px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:"A live masterclass",
    h:"Write the Story Only You Can Tell",
    sub:"Authentic, inclusive fiction for queer writers and writers of color who are done waiting for permission.",
    presenter:"Thien-Kim Lam"},

  {t:'promise',
    kicker:"What this hour gives you",
    h:"By the end, you'll have three concrete moves",
    list:[
      "A way to build relationships between characters that feel dynamic and earned, not tropey.",
      "A craft for writing intimacy and emotion that is inclusive and true to who your characters are.",
      "The confidence to write representation that smashes the stereotype and still lands a happy ending."]},

  {t:'who',
    kicker:"Who this is for",
    h:"You, if any of this sounds familiar",
    list:[
      "You are Black, Asian, Latinx, Indigenous, or LGBTQ+ and you have a story only you can tell.",
      "You keep stalling on story structure, and the imposter voice gets loud when you do.",
      "You are tired of writing the trauma everyone expects and want to write joy too.",
      "You are juggling the writing around family and a full life, and need a plan that fits it."]},

  {t:'trap',
    kicker:"The trap",
    big:"You were told to write what sells. So the story that is actually yours keeps waiting its turn."},

  {t:'reframe',
    kicker:"The reframe",
    big:"The shelf does not need another safer version of a story it is already comfortable with. It needs yours."},

  {t:'part',label:"Part one",h:"The real block is not your discipline"},

  {t:'list',
    kicker:"What actually stops the draft",
    h:"Three blocks, and none of them are laziness",
    list:[
      "The imposter voice that says your story is too niche, too much, or not for the market.",
      "The quiet pull to flatten your own characters into the stereotype a reader will recognize fast.",
      "A structure you were handed that fights the story you are actually trying to tell."]},

  {t:'insight',
    kicker:"The insight",
    big:"The blank page is not the enemy. The borrowed template is."},

  {t:'part',label:"Part two",h:"The method: three moves that make a story unmistakably yours"},

  {t:'pillar',
    label:"Move one",
    name:"The Modern Love Languages framework",
    body:"Most character relationships read flat because they run on tropes. We map how each character actually gives and receives love, so the relationship arc drives the story and the chemistry feels earned instead of assigned. This is how you get past the archetype and into two people a reader believes."},

  {t:'pillar',
    label:"Move two",
    name:"Emotional and inclusive intimacy",
    body:"As an EDSE-certified educator, I teach intimacy that is motivated and inclusive across identity and body, so a scene moves character and consent forward instead of reading as gratuitous. Whether the moment is a first glance or a closed door, it should mean something and belong to your people."},

  {t:'pillar',
    label:"Move three",
    name:"Smash the stereotype",
    body:"Representation is not a checkbox and it is not a trauma quota. We write your Vietnamese, Black, queer, and immigrant characters as full people with desire, humor, and a future, so the book resists the stereotype and still lands the happy ending your reader came for."},

  {t:'bridge',
    kicker:"How they combine",
    big:"Dynamic relationships, honest intimacy, and full characters are the same skill aimed three ways: writing people, not symbols."},

  {t:'part',label:"Part three",h:"On the page, the difference is unmissable"},

  {t:'contrast',
    kicker:"The shift",
    h:"From a scene that performs to a scene that lives",
    left:{title:"Trope-first",body:"The character hits the beat the genre expects. The reader nods and forgets. Nothing is risked, so nothing is felt."},
    right:{title:"Inner-life-first",body:"The character wants something specific, in their own voice and culture. The beat still lands, but now it costs something and the reader stays."}},

  {t:'plan',
    kicker:"The sustainable plan",
    h:"A writing plan built around a real life",
    list:[
      "We start with story strategy, so you know the shape of the book before you drown in the draft.",
      "We build a schedule that fits your family and your work, not a fantasy of eight free hours.",
      "We get you unstuck at the structural seams, the places most drafts quietly die."]},

  {t:'whyme',
    kicker:"Why me",
    h:"I have done this with my own books and other writers",
    list:[
      "My debut, Happy Endings, was named a Washington Post Romance Novel of the Year.",
      "I am an EDSE-certified sex educator and teach intimacy writing with an inclusivity focus.",
      "I have taught at Sarah Lawrence, GrubStreet, Writing the Other, and Romance Writers of America.",
      "My work has been featured on NPR, BBC America, and NBC."]},

  {t:'recap',
    kicker:"The three moves",
    h:"Carry these out of the room",
    list:[
      "Map the love languages so relationships feel dynamic, not tropey.",
      "Write intimacy and emotion that is inclusive and earned.",
      "Build full characters who smash the stereotype and keep the happy ending."]},

  {t:'cta',
    kicker:"Your next step",
    h:"Ready to write the book only you can write?",
    body:"If you want a coach in your corner for the whole draft, applications for my one-on-one Book Coaching are open to a small number of BIPOC and queer writers. Apply, and we will book a free 20-minute call to see if it is a fit.",
    disc:"This masterclass is educational. No income, publication, or result is guaranteed. Results vary and depend on your own work and circumstances."}
];

function esc(x){return x;}
function render(){
  const deck=document.getElementById('deck');
  S.forEach((s,i)=>{
    const d=document.createElement('section');
    d.className='slide';
    let h='';
    if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
    if(s.label) h+='<div class="label">'+s.label+'</div>';
    if(s.t==='title'){
      h+='<h1>'+s.h+'</h1><div class="sub">'+s.sub+'</div>';
      h+='<div class="presenter">'+s.presenter+' <span>author and book coach</span></div>';
    } else if(s.t==='part'){
      h+='<h2>'+s.h+'</h2>';
    } else if(s.t==='pillar'){
      h+='<div class="pillarname">'+s.name+'</div><div class="body">'+s.body+'</div>';
    } else if(s.t==='trap'||s.t==='reframe'||s.t==='insight'||s.t==='bridge'){
      h+='<div class="big">'+s.big+'</div>';
    } else if(s.t==='contrast'){
      h+='<h2>'+s.h+'</h2><div class="two">'
        +'<div class="card"><h3>'+s.left.title+'</h3><p>'+s.left.body+'</p></div>'
        +'<div class="card"><h3>'+s.right.title+'</h3><p>'+s.right.body+'</p></div></div>';
    } else if(s.t==='cta'){
      h+='<h2>'+s.h+'</h2><div class="body">'+s.body+'</div><div class="disc">'+s.disc+'</div>';
    } else {
      if(s.h) h+='<h2>'+s.h+'</h2>';
      if(s.body) h+='<div class="body">'+s.body+'</div>';
      if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
    }
    h+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
    h+='<div class="foot">Thien-Kim Lam</div>';
    d.innerHTML=h;
    deck.appendChild(d);
  });
}
render();
</script>
</body>
</html>
