<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Words That Sell, Minus the Ick — a live masterclass with Kim Argetsinger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6F0;
    --panel:#F2E7DB;
    --rule:#E3D3C2;
    --ink:#2A211C;
    --muted:#6A5B4F;
    --accent:#9E2B4E;
    --display:'Cormorant Garamond',Georgia,serif;
    --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .slide{
    min-height:100vh;width:100%;padding:8vh 9vw;display:flex;flex-direction:column;
    justify-content:center;border-bottom:1px solid var(--rule);scroll-snap-align:start;
  }
  .k{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
     font-size:13px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,76px);line-height:1.04;margin:0}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,4.4vw,52px);line-height:1.08;margin:0}
  p.lead{font-size:clamp(18px,2.1vw,26px);line-height:1.5;max-width:46ch;color:var(--ink);margin:22px 0 0}
  p.sub{font-size:clamp(16px,1.7vw,20px);line-height:1.6;max-width:52ch;color:var(--muted);margin:16px 0 0}
  .big{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,60px);line-height:1.12;max-width:20ch}
  ul{margin:26px 0 0;padding:0;list-style:none;max-width:52ch}
  li{position:relative;padding:14px 0 14px 34px;font-size:clamp(16px,1.8vw,21px);line-height:1.45;border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:22px;width:14px;height:14px;background:var(--accent);border-radius:50%}
  .pill{display:inline-block;background:var(--panel);border:1px solid var(--rule);border-radius:999px;
        padding:8px 16px;font-weight:600;font-size:14px;color:var(--accent);margin-bottom:22px}
  .num{font-family:var(--display);font-size:clamp(44px,8vw,110px);font-weight:700;color:var(--accent);line-height:1;margin:0 0 10px}
  .quote{font-family:var(--display);font-weight:500;font-style:italic;font-size:clamp(26px,4.2vw,50px);line-height:1.2;max-width:22ch}
  .disc{font-size:13px;color:var(--muted);max-width:60ch;margin:26px 0 0;line-height:1.6}
  .cta h2{margin-bottom:8px}
  .stat{display:flex;gap:40px;flex-wrap:wrap;margin-top:28px}
  .stat div{min-width:150px}
  .stat b{font-family:var(--display);font-size:clamp(26px,3.4vw,40px);color:var(--accent);display:block}
  .stat span{font-size:14px;color:var(--muted)}
  .brand{margin-top:30px;font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:"title", cls:"", k:"A live masterclass with Kim Argetsinger",
   h:"Words That Sell, Minus the Ick",
   sub:"How to get fully booked in your own voice and build consistent $10k to $20k months, without performing, posturing, or chasing a bigger audience."},

  {t:"audience", k:"Who this is for",
   big:"For the coaches, therapists, and service providers who are brilliant at the work and freeze the second it is time to sell it.",
   sub:"You know your clients get real results. You just hate how salesy you feel the moment you have to talk about money, pitch on a call, or write the sales page."},

  {t:"trap", k:"The trap",
   big:"Being a best kept secret feels humble. It is actually a pricing problem.",
   sub:"The people who need you cannot say yes to an offer they never clearly heard. Staying quiet is not integrity. It is lost income, and it is fixable."},

  {t:"reframe", k:"The reframe",
   quote:"The ick is not you. It is borrowed scripts.",
   sub:"Nobody books a coach by copying someone else's launch formula in a voice that is not theirs. The fix is not more tactics. It is your own words."},

  {t:"problem", k:"Part one, the real problem",
   h:"You do not need a bigger audience.",
   sub:"Most advice sends you to grow followers, build the list, run the launch. But reach without words that sell just means more people who scroll past. You need to sell to the audience you already have."},

  {t:"premise", k:"The premise everything rests on",
   quote:"Business success is an inside out job.",
   sub:"The numbers follow the inner game. How you think about selling, money, and your own worth shows up in every word a buyer reads. We start there, then build the strategy on top."},

  {t:"method", k:"Part two, the method",
   h:"The Unapologetic Results Method",
   sub:"Four moves that take you from best kept secret to consistently booked, in a voice that is unmistakably yours."},

  {t:"pillar", k:"Move 01", num:"1", h:"Clarity",
   sub:"Get ruthlessly clear on the one offer, the one buyer, and the one result you sell. Confused buyers never buy. Clarity is what makes the words land before you have written a single one."},

  {t:"pillar", k:"Move 02", num:"2", h:"Mindset, the inner game",
   sub:"Clean up the beliefs that make selling feel icky, pushy, or desperate. When you are no longer afraid of your own offer, the pressure drops out of the room and the sale gets easy."},

  {t:"pillar", k:"Move 03", num:"3", h:"Words that sell",
   sub:"Say what you actually do in language your buyer already uses, in your real voice. This is the skill that turns a page, an email, or a live room into enrollments, minus the ick."},

  {t:"pillar", k:"Move 04", num:"4", h:"One simple, repeatable process",
   sub:"Not a new funnel every month. One clear path from attention to offer that you can run again and again, so the $10k and $20k months stop being a surprise and start being a pattern."},

  {t:"deep", k:"A closer look at move 03",
   big:"Stop performing. Start saying it plainly.",
   list:["Lead with the result your buyer wants, not your process",
         "Write the way you talk, then cut the parts that sound like a brochure",
         "Name the real objection out loud before they do",
         "Make the ask once, clearly, and stop apologizing for it"]},

  {t:"deep", k:"A closer look at live selling",
   big:"The live room is where quiet experts finally get heard.",
   sub:"A single live masterclass lets the right people experience how you think for an hour. By the time the invitation comes, they are not being sold. They already decided.",
   list:["Teach one real idea they can use that day",
         "Show the gap between where they are and the result",
         "Invite, do not pressure. The teaching did the selling"]},

  {t:"picture", k:"Part three, the result in real life",
   h:"A booked calendar you did not have to hustle for.",
   sub:"Right clients, saying yes to the right offer, at prices that reflect the work. Cash months you can plan around instead of pray for. And selling that finally feels like you."},

  {t:"why", k:"Why learn this from Kim",
   h:"An ex-actress who learned to sell without the mask.",
   sub:"Kim Argetsinger has spent years helping heart-centered entrepreneurs sell in their own voice. Her own clients' reported results:",
   stats:[["$1.5M","made in 5.5 years of 1:1 work"],["30","clients to $10k months"],["16","clients to six figures"],["3","clients to seven figures"]]},

  {t:"recap", k:"The method, in one breath",
   big:"Clarity. Mindset. Words that sell. One repeatable process.",
   sub:"That is the whole path from best kept secret to unapologetically booked."},

  {t:"cta", cls:"cta", k:"Your next step",
   h:"Ready to sell in your own words?",
   sub:"Book a free consultation with Kim and map the one path that fits your offer, your voice, and your next cash goal.",
   brand:"kimargetsinger.com",
   disc:"Educational only. No income, role, or result is guaranteed. Any figures reflect specific clients' reported experiences and are not typical or promised. Results vary with effort, market, and circumstances."}
];

const deck = document.getElementById('deck');
for(const s of S){
  const sec = document.createElement('section');
  sec.className = 'slide ' + (s.cls||'');
  let h = '';
  if(s.k) h += '<p class="k">'+s.k+'</p>';
  if(s.pill) h += '<span class="pill">'+s.pill+'</span>';
  if(s.num) h += '<p class="num">'+s.num+'</p>';
  if(s.h) h += '<h1>'+s.h+'</h1>';
  if(s.quote) h += '<p class="quote">'+s.quote+'</p>';
  if(s.big) h += '<p class="big">'+s.big+'</p>';
  if(s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if(s.sub) h += '<p class="sub">'+s.sub+'</p>';
  if(s.list){ h += '<ul>'; for(const li of s.list){ h += '<li>'+li+'</li>'; } h += '</ul>'; }
  if(s.stats){ h += '<div class="stat">'; for(const st of s.stats){ h += '<div><b>'+st[0]+'</b><span>'+st[1]+'</span></div>'; } h += '</div>'; }
  if(s.brand) h += '<p class="brand">'+s.brand+'</p>';
  if(s.disc) h += '<p class="disc">'+s.disc+'</p>';
  sec.innerHTML = h;
  deck.appendChild(sec);
}
</script>
</body>
</html>
