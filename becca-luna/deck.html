<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The VIP Day Method · Wealthy Web Designer® Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1512;        /* warm espresso-black, from her near-black #212121 ground warmed toward her cream/red brand */
    --panel:#271c17;
    --rule:#3b2f28;
    --ink:#f4ecd8;       /* warm cream text */
    --cream:#faefc2;     /* her H1 cream accent */
    --red:#b9151c;       /* her deep-red accent, used sparingly */
    --muted:#b7ad97;
    --display:"Prata",Georgia,serif;
    --body:"Archivo",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0f0f0f;color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 18px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:56px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden;
  }
  .slide::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red);opacity:.0}
  .slide.accent::after{opacity:1}
  .eyebrow{font-family:var(--body);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--cream);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.02;color:var(--cream);margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.06;color:var(--cream);margin-bottom:16px}
  .promise{font-family:var(--display);font-style:italic;font-size:26px;color:var(--ink);line-height:1.3;max-width:34ch}
  p.lead{font-size:20px;line-height:1.55;max-width:60ch;color:var(--ink)}
  p.body{font-size:18px;line-height:1.6;max-width:62ch;color:var(--ink);margin-top:8px}
  .kick{font-family:var(--display);font-style:italic;font-size:30px;color:var(--red);line-height:1.25;max-width:40ch}
  ul{list-style:none;margin-top:14px}
  li{font-size:19px;line-height:1.5;padding:10px 0 10px 26px;position:relative;border-bottom:1px solid var(--rule);max-width:62ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:9px;height:9px;background:var(--red);border-radius:50%}
  .phase{display:flex;gap:18px;align-items:baseline}
  .pnum{font-family:var(--display);font-size:50px;color:var(--red);font-weight:600;line-height:1;min-width:84px}
  .pbody h2{font-size:34px;margin-bottom:8px}
  .stat{font-family:var(--display);font-size:72px;color:var(--cream);font-weight:600;line-height:1}
  .statrow{display:flex;gap:46px;flex-wrap:wrap;margin-top:10px}
  .statrow .lbl{font-size:16px;color:var(--muted);margin-top:8px;max-width:20ch}
  .foot{position:absolute;bottom:20px;right:28px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .cta-steps li::before{background:var(--cream)}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:26px;max-width:66ch}
  .brandmark{font-family:var(--display);font-style:italic;color:var(--cream);font-size:22px}
  @media(max-width:620px){.slide{padding:38px 26px}h1{font-size:40px}h2{font-size:30px}.stat{font-size:52px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title'},
  {t:'who'},
  {t:'trap'},
  {t:'reframe'},
  {t:'part', n:'Part One', h:'Project pricing punishes the thing you are best at', b:'The faster you get, the less a project pays you for it. Price by the project and every hour you save is money you hand back. That is the trap. It is not a discipline problem and it is not a confidence problem, it is a pricing-unit problem.'},
  {t:'mathgrind'},
  {t:'part', n:'Part Two', h:'The VIP Day Method', b:'Stop selling weeks of your calendar. Sell one finished website, delivered in a single focused day, at a premium day rate. Five phases turn that promise into a repeatable offer.'},
  {t:'phase', n:'01', h:'Creation', b:'Map the offer first. Your timeline, your day rate, the dream-client profile, and the exact structure of the day. The offer is designed before a single client books.'},
  {t:'phase', n:'02', h:'Pre-booking', b:'Build the surface that sells it for you: a sales page, a short application, an acceptance workflow, and a checkout. Clients qualify themselves and pay before the day is held.'},
  {t:'phase', n:'03', h:'Onboarding', b:'Booking logistics, a welcome sequence, and the prep that means your client arrives ready. Everything the design day needs is gathered before the design day starts.'},
  {t:'phase', n:'04', h:'VIP Day Execution', b:'Kickoff call, branding, and the full build inside one compressed day, using templates and your design library so the work moves at the speed the day rate requires.'},
  {t:'phase', n:'05', h:'Off-boarding', b:'Site checks, migration, and a clean close. The client leaves with a finished site and a reason to refer you, which is how the next VIP Day books itself.'},
  {t:'speedup'},
  {t:'part', n:'Part Three', h:'What two days a week actually looks like', b:'You do not need a full calendar of clients. You need a few of the right ones at the right rate. The whole point of the day rate is that a little booked time is enough.'},
  {t:'daymath'},
  {t:'objections'},
  {t:'whyme'},
  {t:'recap'},
  {t:'cta', disc:'Educational only. No income or result is guaranteed. Any figures shown are examples from my own business and from students, not a promise of your results. Income depends on your effort, skill, market, and many factors outside any course. Results vary.'}
];

function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function render(s){
  if(s.t==='title') return `
    <div class="slide accent">
      <div class="eyebrow">Wealthy Web Designer® Masterclass</div>
      <h1>The VIP Day Method</h1>
      <div class="promise">Book out $3,000 days instead of chasing weeks of project work.</div>
      <div class="foot">Live Masterclass</div>
    </div>`;
  if(s.t==='who') return `
    <div class="slide">
      <div class="eyebrow">Who this is for</div>
      <h2>You can design. You just can't seem to get paid what the work is worth.</h2>
      <p class="body">This is for the web designer who is good, who is booked enough, and who is still trading multi-week projects, endless revision rounds, and quiet resentment for an income that never quite matches the effort.</p>
    </div>`;
  if(s.t==='trap') return `
    <div class="slide">
      <div class="eyebrow">The trap</div>
      <p class="lead">A project that should take you a week drags into a month. The client goes quiet, then urgent, then quiet again. You absorb every delay because the price was fixed and the timeline was not.</p>
      <p class="body">More skill did not fix it. More clients did not fix it. The grind just got busier.</p>
    </div>`;
  if(s.t==='reframe') return `
    <div class="slide accent">
      <div class="eyebrow">The reframe</div>
      <div class="kick">You are not underpriced. You are selling the wrong unit.</div>
      <p class="body">Sell hours and speed works against you. Sell projects and scope creep works against you. Sell a finished website in a day and both finally work for you.</p>
    </div>`;
  if(s.t==='part') return `
    <div class="slide accent">
      <div class="eyebrow">${esc(s.n)}</div>
      <h2>${esc(s.h)}</h2>
      <p class="body">${esc(s.b)}</p>
    </div>`;
  if(s.t==='mathgrind') return `
    <div class="slide">
      <div class="eyebrow">Why the grind never pays</div>
      <ul>
        <li>A fixed project price divided by an unfixed number of hours is an hourly rate that falls every time the client stalls.</li>
        <li>Revisions are free to the client and expensive to you.</li>
        <li>Your best skill, speed, is invisible on a project invoice.</li>
      </ul>
    </div>`;
  if(s.t==='phase') return `
    <div class="slide">
      <div class="eyebrow">The Method · Phase ${esc(s.n)} of 05</div>
      <div class="phase">
        <div class="pnum">${esc(s.n)}</div>
        <div class="pbody"><h2>${esc(s.h)}</h2><p class="body">${esc(s.b)}</p></div>
      </div>
    </div>`;
  if(s.t==='speedup') return `
    <div class="slide accent">
      <div class="eyebrow">Inside the day</div>
      <h2>The Speedup Method</h2>
      <p class="body">The day rate only works if the build moves. Systematic templating is how a full brand comes together in minutes and a home page takes shape in a single pass, so one focused day is genuinely enough to ship a finished site.</p>
    </div>`;
  if(s.t==='daymath') return `
    <div class="slide">
      <div class="eyebrow">The day-rate math</div>
      <div class="statrow">
        <div><div class="stat">$2,100</div><div class="lbl">A conservative starting day rate</div></div>
        <div><div class="stat">x2</div><div class="lbl">VIP Days a week</div></div>
        <div><div class="stat">$16,800</div><div class="lbl">A month, on two booked days a week</div></div>
      </div>
      <p class="body">These are the numbers from my own business when I made the switch. Yours start wherever you are comfortable and climb as the offer proves itself.</p>
    </div>`;
  if(s.t==='objections') return `
    <div class="slide">
      <div class="eyebrow">The honest objections</div>
      <ul>
        <li>"I am not fast enough." You are not supposed to be yet. Speed is the system, not a talent.</li>
        <li>"My clients want hand-holding." The application and onboarding filter for the ones who are ready.</li>
        <li>"My niche is different." The unit is a finished website. Almost every niche buys that.</li>
      </ul>
    </div>`;
  if(s.t==='whyme') return `
    <div class="slide accent">
      <div class="eyebrow">Why I teach this</div>
      <p class="lead">Six years ago I was waitressing for eleven dollars an hour and twenty thousand dollars in debt. I taught myself web design on an old laptop and turned one creative skill into a business that changed my life.</p>
      <p class="body">Since then the Wealthy Web Designer® work has helped over 13,000 women learn web design, book clients, and build real income. The VIP Day is the piece that moved me out of the grind, so it is the piece I teach first.</p>
    </div>`;
  if(s.t==='recap') return `
    <div class="slide">
      <div class="eyebrow">What you walked away with</div>
      <ul>
        <li>Why project pricing quietly caps your income.</li>
        <li>The five phases that turn web design into a one-day premium offer.</li>
        <li>The Speedup Method that makes a single day enough.</li>
        <li>The math of two booked days a week.</li>
      </ul>
    </div>`;
  if(s.t==='cta') return `
    <div class="slide accent">
      <div class="eyebrow">Your next step</div>
      <h2>Build the whole offer with me</h2>
      <p class="body">Design Your Day Rate is the full course behind this method: the sales page, the application and acceptance workflow, the onboarding, the Speedup templates, and the exact day structure, step by step.</p>
      <ul class="cta-steps">
        <li>Enroll in Design Your Day Rate and set up your VIP Day offer.</li>
        <li>Book your first day at a rate that respects your speed.</li>
      </ul>
      <div class="brandmark">Becca Luna · Wealthy Web Designer®</div>
      <p class="disc">${esc(s.disc)}</p>
    </div>`;
  return '<div class="slide"></div>';
}
document.getElementById('deck').innerHTML = S.map(render).join('');
</script>
</body>
</html>
