<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Stop Chasing, Start Attracting · Frederick Dudek · Business Superfans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#180f29; --panel:#241640; --rule:#3a2b5c;
    --acc:#37ca37; --chalk:#f4f0fa; --ink:#f4f0fa; --grey:#cbc3dc; --dim:#8b81a6;
  }
  html,body{height:100%}
  body{background:#100a1c;font-family:'Poppins',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#100a1c}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.05vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--chalk);line-height:1.1;letter-spacing:.005em}
  .t-title h1{font-size:4.4vw;max-width:94%;text-transform:uppercase;letter-spacing:.01em}
  .t-normal h1{font-size:3.0vw;max-width:88%;font-weight:600}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.7vh;max-width:78%;line-height:1.56;font-weight:400}
  .sub{font-family:'Poppins',sans-serif;font-size:1.6vw;color:var(--grey);margin-top:3.2vh;max-width:82%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.3vw;font-weight:700;color:var(--acc);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:93%;text-transform:uppercase}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#2a1a4a 0%,#120b21 100%);align-items:center;text-align:center}
  .t-dark h1{font-family:'Poppins',sans-serif;font-weight:400;font-style:italic;font-size:3.1vw;max-width:88%;color:var(--chalk)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2a1a4a 0%,#120b21 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:88%;text-transform:uppercase}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Montserrat',sans-serif;border:1.5px solid var(--acc);color:var(--chalk);border-radius:100px;padding:1.3vh 1.9vw;font-size:1.16vw;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
  .chip.solid{background:var(--acc);border-color:var(--acc);color:#0d2a0d}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Poppins',sans-serif;font-size:.9vw;color:var(--dim);text-align:center;line-height:1.42}
  .t-title .disc,.t-normal .disc{text-align:left}
  .stat-row{display:flex;gap:3.4vw;margin-top:4.2vh}
  .stat .n{font-family:'Montserrat',sans-serif;font-size:2.9vw;font-weight:700;color:var(--acc);line-height:1}
  .stat .l{font-family:'Poppins',sans-serif;font-size:1.0vw;color:var(--grey);margin-top:1vh;letter-spacing:.02em;max-width:13vw}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1vw 2vw;margin-top:3.6vh;max-width:84%}
  .pillars .p{font-family:'Poppins',sans-serif;font-size:1.16vw;color:var(--grey);line-height:1.3}
  .pillars .p b{color:var(--chalk);font-weight:600}
  .pillars .p b span{color:var(--acc)}
  .arch{position:absolute;pointer-events:none;right:7%;bottom:8.5%;width:20vw;opacity:.95}
  .corner-arch{position:absolute;pointer-events:none;right:6%;bottom:7.5%;width:9vw;opacity:.4}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.26vw;color:var(--grey);margin-top:3.4vh;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(244,240,250,.09);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Montserrat',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}.stat .n{font-size:6vw}.stat .l{font-size:2.4vw;max-width:26vw}
    .pillars{grid-template-columns:repeat(2,1fr)}.pillars .p{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Business Superfans</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- compounding-relationship motif: connected nodes that link and grow, one lit gold (the advocate) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arch" viewBox="0 0 240 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 116 L120 40 L180 92 L120 40 L96 118" stroke="#f4f0fa" opacity="0.35"/>
    <circle cx="60" cy="116" r="9" stroke="#f4f0fa" opacity="0.5"/>
    <circle cx="180" cy="92" r="9" stroke="#f4f0fa" opacity="0.5"/>
    <circle cx="96" cy="118" r="8" stroke="#f4f0fa" opacity="0.4"/>
    <circle cx="120" cy="40" r="13" fill="#37ca37" stroke="#37ca37"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Stop Chasing Growth. Start Attracting It.',sub:'A live masterclass for service-business owners on turning the customers, team, and partners you already have into superfans who refer, so your growth compounds instead of costing you more every month. With Frederick "Freddy D" Dudek, Business Prosperity Advisor.',brand:true,arch:true},
 {t:'normal',k:'Who this is for',title:'You are great at the work. Growth still feels like a grind.',body:'You run a real service business, your clients are happy, your team shows up, and yet growth means buying more leads, chasing more strangers, and starting each month back at zero. You are not bad at growth. You were just never shown the part that compounds.'},
 {t:'dark',title:'More cold leads is the most expensive way to grow a service business. Most owners are never shown the cheaper one.'},

 {t:'section',idx:'Part One',title:'Why Chasing Never Ends'},
 {t:'normal',k:'The leaky bucket',title:'You keep pouring leads into a bucket that leaks out the bottom.',body:'When every new customer is a one-time transaction, growth is just replacement. You spend to win them, deliver, and then go spend again to win the next one. The harder you pour, the more you have to keep pouring.'},
 {t:'normal',k:'The channel you leave to chance',title:'Your best growth channel is the one you never actually run.',body:'The customers, employees, partners, and suppliers who already trust you are the cheapest, warmest source of new business you have. Most owners leave every referral, review, and reintroduction to luck instead of running it on purpose.'},
 {t:'dark',title:'Your next growth is not hiding inside a stranger. It is sitting in the relationships you already have.'},

 {t:'section',idx:'Part Two',title:'The Superfans System'},
 {t:'normal',k:'What a superfan is',title:'A superfan does your growth for you.',body:'A superfan is any customer, employee, partner, supplier, or advocate who actively strengthens your business through trust, loyalty, referrals, and word of mouth. Turn enough of the people around you into superfans and attraction replaces chasing.'},
 {t:'normal',k:'The S.U.P.E.R.F.A.N.S. Framework',title:'Nine growth pillars that align the whole business around momentum.',pillars:[['S','Strategize'],['U','Unite'],['P','Propel'],['E','Elevate'],['R','Rally'],['F','Finance'],['A','Automate'],['N','Nurture'],['S','Sustain']],body:''},
 {t:'normal',k:'Revenue Reaction, the seven stages',title:'Relationship equity turns into revenue in a sequence, not by accident.',body:'Reach, Recognition, Retention, Reputation, Reviews, Referrals, and Revenue compound as connected stages. Each one feeds the next, so the work you do to earn trust today keeps paying you long after the first sale.'},
 {t:'normal',k:'Why it compounds',title:'Cold spend resets every month. Relationship equity keeps stacking.',body:'A lead you buy is gone once it converts or does not. A customer you turn into an advocate refers the next one, and that one refers again. Same business, same team, a growth curve that finally bends in your favor.'},
 {t:'dark',title:'Trust, loyalty, and referrals are not soft. They are the cheapest and most durable revenue a service business will ever have.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Run It'},
 {t:'normal',k:'The shift, in practice',title:'Same customers, same team, a very different growth curve.',body:'The work does not change. What changes is how much of your growth comes from the relationships you already earned, how predictable it gets, and how it feels to run the business when attraction is doing the heavy lifting instead of ad after ad.'},
 {t:'normal',k:'Why Frederick Dudek',title:'Four decades on the front line of building businesses that thrive.',body:'A 360-degree operator with front-line leadership across startups and Fortune-level companies in more than 30 countries, host of the Business Superfans Advantage podcast, and the bestselling author behind the Superfans method. He built these frameworks because attraction beats chasing every time.',stats:[['40+','years helping founders build businesses that thrive'],['200+','business leaders interviewed on the podcast'],['9','growth pillars in the S.U.P.E.R.F.A.N.S. Framework']]},
 {t:'dark',title:'The most profitable marketing you will ever do is making the customers you already have unable to stop talking about you.'},

 {t:'section',idx:'Your Next Step',title:'Turn Customers Into Superfans'},
 {t:'normal',k:'Where to start',title:'See where your own superfan growth is leaking today.',body:'The first step is a clear look at where trust, referrals, and repeat revenue are slipping through the cracks in your business right now, and which of the nine pillars would move the needle first. That is a straight conversation, not a pitch.'},
 {t:'cta',title:'Ready to stop chasing and start attracting?',chips:['Book your free strategy session','Take the free Revenue Reactor assessment'],disc:'Educational content for service-business owners. No income or business result is guaranteed. Outcomes vary by business, market, offer, and starting conditions.'},
];

const deck=document.getElementById('deck');
function arch(){return `<svg class="arch"><use href="#arch"/></svg>`}
function cornerArch(){return `<svg class="corner-arch"><use href="#arch"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.pillars) h+=`<div class="pillars">`+s.pillars.map(p=>`<div class="p"><b><span>${p[0]}</span></b> ${p[1]}</div>`).join('')+`</div>`;
    if(s.stats) h+=`<div class="stat-row">`+s.stats.map(st=>`<div class="stat"><div class="n">${st[0]}</div><div class="l">${st[1]}</div></div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Business <b>Superfans</b> · Frederick Dudek</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map((c,ci)=>`<div class="chip ${ci===0?'solid':''}">${c}</div>`).join('')+`</div>`;
  }
  if(s.arch) h+=arch();
  else if(s.t==='title') h+=arch();
  else if(s.t==='normal') h+=cornerArch();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
