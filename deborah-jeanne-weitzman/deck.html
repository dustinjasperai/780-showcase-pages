<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Your Voice Free — a live masterclass with Deborah Jeanne Weitzman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0;        /* warm ivory paper ground (## Palette) */
    --panel:#F3ECE0;     /* panel */
    --rule:#E3D8C6;      /* hairline rule */
    --ink:#2B2A28;       /* deep ink text */
    --accent:#B5502F;    /* warm terracotta accent (## Palette) */
    --sage:#5E6B52;      /* muted sage secondary */
    --head:"Spectral", Georgia, serif;
    --body:"Karla", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:56px 60px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:20px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--sage);font-weight:500}
  .kicker{font-family:var(--body);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:62px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:42px;line-height:1.1}
  .lead{font-family:var(--head);font-weight:500;font-size:30px;line-height:1.25;color:var(--ink)}
  p.body{font-size:19px;line-height:1.6;max-width:62ch;color:#3f3d3a;margin-top:16px}
  .rule{width:64px;height:3px;background:var(--accent);border:0;margin:22px 0 4px;border-radius:2px}
  ul.points{margin-top:22px;list-style:none}
  ul.points li{font-size:20px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:64ch}
  ul.points li:last-child{border-bottom:0}
  ul.points li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:50%}
  .part .big{font-family:var(--head);font-size:120px;font-weight:700;color:var(--accent);line-height:.9}
  .part h2{margin-top:8px}
  .pillar .pn{font-family:var(--head);font-size:22px;color:var(--accent);font-weight:600;letter-spacing:.04em}
  .title .promise{font-size:21px;color:var(--sage);margin-top:28px;max-width:54ch;font-weight:500}
  .why .cred{margin-top:22px}
  .why .cred li{font-size:19px;line-height:1.5;padding:9px 0;border-bottom:1px solid var(--rule);list-style:none;max-width:62ch}
  .cta{background:var(--panel)}
  .cta .step{display:inline-block;margin-top:24px;font-family:var(--head);font-size:30px;font-weight:600;color:var(--accent);border:2px solid var(--accent);border-radius:999px;padding:14px 34px}
  .disclaimer{margin-top:38px;font-size:13px;line-height:1.5;color:var(--sage);max-width:60ch}
  .solid{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Deborah Jeanne Weitzman',
    h:'Set Your Voice <span class="solid">Free</span>',
    lead:'Why you can’t sing freely by trying harder.',
    promise:'One live hour on releasing the tension, habit, and perfectionism that hold your real voice in, so the sound you were born with can come through.'},

  {t:'who', kicker:'Who this is for',
    lead:'For the singer who has done the work and still feels held back.',
    body:'Singers, actors, performers, and writers, from first-timers to professionals, who have taken the lessons and drilled the technique, and still feel their throat tighten, their breath shorten, and their true voice stay just out of reach.'},

  {t:'trap', kicker:'The trap',
    lead:'You were told the answer was more.',
    body:'More exercises. More control. More range. So you push harder, and the harder you push, the more you tense, and the more you tense, the smaller and more careful the voice becomes. You start to believe the problem is your talent.'},

  {t:'point', kicker:'What it costs',
    lead:'A held voice is a half-told truth.',
    body:'When the instrument stays guarded, the performance stays small. The feeling you wanted to give the room leaks out somewhere between your body and the first note, and the joy of singing turns into the job of managing it.'},

  {t:'hook', kicker:'The reframe',
    h:'Trying <span class="solid">is</span> the block.',
    body:'The free voice is not something you add. It is already there, underneath the effort. The work is not to build it. The work is to stop blocking it.'},

  {t:'part', kicker:'Part one', big:'01', h2:'The real problem is not talent'},

  {t:'point', kicker:'The real problem',
    lead:'It is tension, habit, and fear, not a lack of ability.',
    points:[
      'Excessive tension turns effort into strain and closes the instrument.',
      'Old habits of use repeat themselves the moment you perform.',
      'Perfectionism and the fear of being heard quietly run the whole show.']},

  {t:'point', kicker:'The real problem',
    lead:'The voice is free by nature. We learn to hold it.',
    body:'A child sings without a second thought. Somewhere along the way we learn to monitor, judge, and control the sound. Freeing the voice is less about learning something new and more about unlearning the holding.'},

  {t:'point', kicker:'The quiet master',
    lead:'Perfectionism runs the room you cannot see.',
    body:'Most of the holding is not in the throat at all. It is the inner critic deciding, before you open your mouth, which sounds are allowed. Let that go and the body already knows what to do.'},

  {t:'part', kicker:'Part two', big:'02', h2:'Vocal Activation: the four releases'},

  {t:'pillar', kicker:'Vocal Activation', pn:'Release 1',
    lead:'Release, don’t add.',
    body:'Using the Alexander Technique, we transform excessive tension into useful energy. Instead of building more control on top of strain, we take the strain away and let the breath and the sound open on their own.'},

  {t:'pillar', kicker:'Vocal Activation', pn:'Release 2',
    lead:'From doing to being.',
    body:'Singing stops being a thing you force and becomes a thing you allow. We shift out of effortful doing and into a state of being, where the body sings without you trying to make it.'},

  {t:'pillar', kicker:'Vocal Activation', pn:'Release 3',
    lead:'Move to free the voice.',
    body:'Conscious movement and gentle dancing invite the whole body into the sound. When the body is free and moving, the voice follows. The music helps the body sing before the mind can interfere.'},

  {t:'pillar', kicker:'Vocal Activation', pn:'Release 4',
    lead:'Find your own unique song.',
    body:'Through improvisation and play, you meet the voice that is only yours, without the fear of getting it wrong. Spontaneity replaces performance anxiety, and expression replaces perfection.'},

  {t:'part', kicker:'Part three', big:'03', h2:'What changes when you stop forcing'},

  {t:'point', kicker:'What it looks like',
    lead:'Ease first. Everything else follows.',
    points:[
      'Breath drops and lengthens without you managing it.',
      'Range and resonance arrive as by-products of release, not drills.',
      'The inner critic quiets, and being heard stops feeling dangerous.',
      'You sound like yourself, and that is the whole point.']},

  {t:'point', kicker:'What a session feels like',
    lead:'Playful, physical, and surprisingly simple.',
    body:'We move, we breathe, we make sound without judging it, and we notice the habits that get in the way. There is nothing to achieve and no wrong note, only your voice, coming home.'},

  {t:'point', kicker:'Who this helps most',
    lead:'Anyone whose voice is bigger than their fear of it.',
    body:'Trained singers stuck at a ceiling, actors who go tight on stage, instrumentalists who never sing out loud, and writers who want their own voice on the page as much as in the room. The block is the same, and so is the release.'},

  {t:'why', kicker:'Why learn this from Deborah',
    lead:'Thirty years of freeing voices, across three disciplines.',
    cred:[
      'Certified teacher of the Alexander Technique and Bel-Canto singing.',
      'Degrees in Music, Music Therapy, and Theatre.',
      'Over thirty years teaching voice, movement, and the Alexander Technique worldwide.',
      'Author, performer, and writer of the Set Your Voice Free newsletter.']},

  {t:'cta', kicker:'Your next step',
    h2:'Ready to let your voice come through?',
    body:'If something in this hour rang true, the next step is a Vocal Activation session, in person or over Zoom, where we start releasing the hold on your own voice.',
    step:'Book your Vocal Activation session',
    disclaimer:'No specific result is guaranteed. Results vary from person to person, and this masterclass is educational in nature. Set Your Voice Free, Deborah Jeanne Weitzman.'}
];

function slideHTML(s, i){
  const num = String(i+1).padStart(2,'0');
  let inner = '';
  if(s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if(s.t==='part'){
    inner += `<div class="big">${s.big}</div><h2>${s.h2}</h2>`;
    return `<section class="slide part"><span class="num">${num}</span>${inner}</section>`;
  }
  if(s.t==='title'){
    inner += `<h1>${s.h}</h1><hr class="rule"><div class="lead">${s.lead}</div><div class="promise">${s.promise}</div>`;
    return `<section class="slide title"><span class="num">${num}</span>${inner}</section>`;
  }
  if(s.h) inner += `<h1>${s.h}</h1>`;
  if(s.h2) inner += `<h2>${s.h2}</h2>`;
  if(s.pn) inner += `<div class="pn">${s.pn}</div>`;
  if(s.lead) inner += `<div class="lead">${s.lead}</div>`;
  inner += `<hr class="rule">`;
  if(s.body) inner += `<p class="body">${s.body}</p>`;
  if(s.points){ inner += '<ul class="points">'; s.points.forEach(p=> inner += `<li>${p}</li>`); inner += '</ul>'; }
  if(s.cred){ inner += '<ul class="cred">'; s.cred.forEach(p=> inner += `<li>${p}</li>`); inner += '</ul>'; }
  if(s.step) inner += `<div class="step">${s.step}</div>`;
  if(s.disclaimer) inner += `<div class="disclaimer">${s.disclaimer}</div>`;
  return `<section class="slide ${s.t}"><span class="num">${num}</span>${inner}</section>`;
}
document.getElementById('deck').innerHTML = S.map(slideHTML).join('');
</script>
</body>
</html>
