<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The L.O.V.E. Method — A Masterclass with Gloria Grace Rand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcf5f4;        /* her blush-cream ground */
    --panel:#ffffff;
    --wash:#f3e7e4;
    --ink:#2c2420;       /* warm near-black */
    --muted:#6f6058;
    --green:#05504b;     /* her brand deep teal-green (primary accent) */
    --green-deep:#102b23;
    --gold:#af7d41;      /* her brand gold (secondary accent) */
    --pink:#ca4580;      /* her link color (single spark) */
    --serif:'Butler','Playfair Display',Georgia,serif;
    --sans:'Red Hat Display',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px;}
  .slide{
    background:var(--panel);
    border:1px solid #efe2de;
    border-radius:18px;
    padding:60px 56px;
    margin:0 0 26px;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 30px rgba(44,36,32,.05);
    position:relative;
  }
  .slide::before{content:"";position:absolute;left:56px;top:34px;width:46px;height:2px;background:var(--gold);}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--green);margin-bottom:18px;}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.05;color:var(--green-deep);margin-bottom:20px;}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;color:var(--green-deep);margin-bottom:18px;}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:46ch;}
  .sub{font-size:18px;line-height:1.55;color:var(--muted);max-width:52ch;margin-top:14px;}
  .big{font-family:var(--serif);font-size:30px;line-height:1.25;color:var(--green-deep);max-width:40ch;}
  ul{list-style:none;margin-top:10px;}
  li{font-size:19px;line-height:1.5;padding:10px 0 10px 30px;position:relative;max-width:50ch;}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border:2px solid var(--gold);border-radius:50%;}
  .step{font-family:var(--serif);font-size:62px;color:var(--gold);line-height:1;margin-bottom:8px;}
  .title-slide{background:linear-gradient(160deg,#ffffff 0%,#fcf5f4 60%,#f6e9e6 100%);}
  .title-slide h1{font-size:60px;}
  .present{margin-top:28px;font-size:17px;color:var(--green);font-weight:500;}
  .cta-slide{background:var(--green-deep);border-color:var(--green-deep);}
  .cta-slide .eyebrow{color:#e7c893;}
  .cta-slide h2{color:#fff;}
  .cta-slide .lead,.cta-slide .sub{color:#e9eeec;}
  .cta-box{margin-top:22px;display:inline-block;background:var(--gold);color:#241a09;font-weight:700;font-family:var(--sans);padding:15px 26px;border-radius:10px;font-size:18px;}
  .disclaimer{margin-top:26px;font-size:12.5px;color:#9fb3ae;max-width:60ch;line-height:1.5;}
  .spark{color:var(--pink);}
  .nums{font-family:var(--serif);color:var(--gold);font-size:15px;position:absolute;right:56px;top:34px;letter-spacing:.1em;}
  @media(max-width:640px){.slide{padding:40px 26px}h1{font-size:40px}.title-slide h1{font-size:44px}h2{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A Live Masterclass', h1:'The L.O.V.E. Method',
   lead:'How midlife women entrepreneurs release self-doubt and finally get paid what they are worth, without doing more.',
   present:'with Gloria Grace Rand, The Light Messenger and Spiritual Alignment Coach'},

  {t:'for', eyebrow:'Who this is for',
   big:'You built something real. And somewhere after 50, you noticed you were quietly shrinking inside your own business.',
   sub:'You over-deliver. You undercharge. You keep waiting to feel ready. This hour is for the woman who knows she is capable of more and is done pushing harder to get there.'},

  {t:'trap', eyebrow:'The trap',
   h2:'You have been told the answer is to do more.',
   sub:'More hours. More funnels. More hustle. So you did, and the ceiling did not move. The exhaustion is real, and so is the quiet voice that says maybe this is just how it is now. It is not.'},

  {t:'reframe', eyebrow:'The real problem',
   big:'The problem was never your strategy. It is that you have been running your business from self-doubt.',
   sub:'When you lead from the fear of not being enough, you price from it, you sell from it, and you hide from it. Your audience feels it before they ever read your offer.'},

  {t:'part', eyebrow:'Part One', h2:'Why doing more stopped working'},

  {t:'cost', eyebrow:'The hidden cost',
   h2:'Self-doubt is expensive.',
   bullets:['It shows up as undercharging and over-giving.','It shows up as burnout and declining energy.','It shows up as the clients and income that never quite arrive.'],
   sub:'None of that is a marketing problem. It is an alignment problem, and alignment can be taught.'},

  {t:'critic', eyebrow:'The inner critic',
   big:'Your inner critic does not want you to know one thing: your value was never in question.',
   sub:'What the critic calls humility is often just old fear wearing a polite face. Owning your value is a skill, and like any skill, there is a method.'},

  {t:'part', eyebrow:'Part Two', h2:'The L.O.V.E. Method'},

  {t:'step', step:'L', h2:'Let Go and Let God',
   sub:'Release the past, the roles you outgrew, and the inner critic you have carried for decades. You cannot step into what is next while you are gripping what already happened.'},

  {t:'step', step:'O', h2:'Open Your Heart to Receive',
   sub:'Most women in midlife are world-class givers and reluctant receivers. Receiving, support, money, recognition, is a practice. We build it on purpose.'},

  {t:'step', step:'V', h2:'Value Your Uniqueness',
   sub:'The thing you discount because it comes easily to you is usually the thing people most want to pay for. We find it, name it, and price from it.'},

  {t:'step', step:'E', h2:'Embrace Your Divinity',
   sub:'Step into the full identity of the woman your work is here to serve. When you lead from that, your marketing stops being a performance and starts being an invitation.'},

  {t:'together', eyebrow:'How it works together',
   big:'This is how you do less and get paid more.',
   sub:'You are not adding tactics. You are removing the fear underneath them. Aligned pricing, aligned offers, and an aligned voice do the heavy lifting the hustle never could.'},

  {t:'part', eyebrow:'Part Three', h2:'When the doubt stops running the show'},

  {t:'picture', eyebrow:'The shift',
   h2:'A business that runs on your own light.',
   bullets:['You charge what your work is worth, calmly.','You speak to the women you are meant to serve, and they feel it.','You grow without trading more of your life for it.']},

  {t:'why', eyebrow:'Why me',
   h2:'I have lived both halves of this.',
   sub:'For more than a decade I was an online marketer and SEO copywriter, helping over 150 companies, including AAA and Scholastic Book Fairs, attract and convert customers. Then losing my sister to cancer sent me on a journey that became my Amazon best-selling book, Live Love Engage. Today I am an energy healer and the author of the L.O.V.E. Method. I teach the strategy and the inner work together, because one without the other never held.'},

  {t:'light', eyebrow:'The quiet differentiator',
   big:'This work is practical and energetic at the same time.',
   sub:'The L.O.V.E. Method pairs real business decisions with the alignment and energetic clarity that let you actually make them. That combination is the whole point.'},

  {t:'recap', eyebrow:'The recap',
   h2:'Release the doubt. Own the value. Get paid for it.',
   bullets:['Let Go and Let God','Open Your Heart to Receive','Value Your Uniqueness','Embrace Your Divinity']},

  {t:'cta', eyebrow:'Your next step',
   h2:'Ready to align to shine?',
   lead:'If this method resonated, the next step is a conversation.',
   sub:'Book a free Strategic Clarity Session with me and we will map the one shift that would change the most in your business right now.',
   cta:'Book your Strategic Clarity Session at gloriarand.com',
   disclaimer:'This masterclass is offered for educational purposes only. It is not financial, medical, or professional advice. Individual results vary and are not guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta-slide':'');
  let h = '';
  h += '<div class="nums">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.step) h += '<div class="step">'+s.step+'</div>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if(s.big) h += '<p class="big">'+s.big+'</p>';
  if(s.bullets){ h += '<ul>'; s.bullets.forEach(b=> h += '<li>'+b+'</li>'); h += '</ul>'; }
  if(s.sub) h += '<p class="sub">'+s.sub+'</p>';
  if(s.present) h += '<p class="present">'+s.present+'</p>';
  if(s.cta) h += '<div class="cta-box">'+s.cta+'</div>';
  if(s.disclaimer) h += '<p class="disclaimer">'+s.disclaimer+'</p>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
