<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Funny — a masterclass with Manny Garavito</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6ec;
  --panel:#fffdf9;
  --ink:#1b1424;
  --rule:#e7d7c4;
  --accent:#ff5a3c;
  --accent2:#ffb43d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:40px 22px 80px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:20px;padding:56px 56px;margin:22px 0;
  box-shadow:0 18px 44px rgba(90,64,40,.10);position:relative;overflow:hidden;min-height:360px;display:flex;flex-direction:column;justify-content:center}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kick{font-family:'Sora',sans-serif;font-size:14px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
h1{font-family:'Sora',sans-serif;font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
h2{font-family:'Sora',sans-serif;font-weight:700;font-size:38px;line-height:1.08;letter-spacing:-.01em}
.sub{font-size:23px;line-height:1.45;color:#5a5168;margin-top:20px;max-width:46ch}
.body{font-size:22px;line-height:1.55;color:#413a4f;margin-top:16px;max-width:54ch}
ul{list-style:none;margin-top:24px}
li{font-size:22px;line-height:1.4;color:#2e2740;padding:14px 0 14px 40px;border-bottom:1px solid var(--rule);position:relative}
li:last-child{border-bottom:none}
li::before{content:'';position:absolute;left:4px;top:22px;width:16px;height:16px;border-radius:5px;background:var(--accent)}
.num{font-family:'Sora',sans-serif;font-size:19px;font-weight:700;color:#fff;background:var(--accent);border-radius:10px;
  width:54px;height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.note{font-size:18px;color:#6a6076;margin-top:18px;font-style:italic;max-width:50ch}
.part h2{font-size:46px}
.cta-slide{background:linear-gradient(135deg,#2a1420,#1b1424);color:#fff6ec;border:none}
.cta-slide::before{background:var(--accent2)}
.cta-slide h2{color:#fff6ec}
.cta-slide .body{color:#f4e6d6}
.disc{font-size:14px;line-height:1.5;color:#c9b8ab;margin-top:28px;max-width:60ch}
.foot{text-align:center;font-family:'Sora',sans-serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#a99884;margin-top:36px}
.pill{display:inline-block;background:var(--accent);color:#fff;font-family:'Sora',sans-serif;font-weight:600;font-size:17px;padding:12px 22px;border-radius:100px;margin-top:26px}
@media(max-width:640px){.slide{padding:38px 28px}h1{font-size:38px}h2{font-size:30px}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<div class="foot">Find Your Funny &middot; a masterclass with Manny Garavito</div>
<script>
const S=[
 {t:'title', kick:'A live masterclass with Manny Garavito', h:'Find Your Funny', sub:'Discover your natural sense of humor and turn it into an audience online.'},
 {t:'promise', h:'By the end of this class', items:['Why you are already funnier than you think','The step-by-step way to find the funny fast','How to turn your humor into content people follow']},
 {t:'audience', h:'This is for you if...', items:['You are an entrepreneur, creator, or performer','You freeze the second a camera turns on','You have tried to "be funny" and it felt forced']},
 {t:'trap', h:'The trap', body:'You were told funny people are born, not made. So you copy other people’s jokes, borrow a schtick, and it never quite fits. The camera turns on and you go blank.'},
 {t:'reframe', kick:'The reframe', h:'Here is the truth', body:'You laugh dozens of times a day. That means you already have a sense of humor. You do not need to write funny. You need to find YOURS.'},
 {t:'part', kick:'Part One', h:'Why "writing jokes" keeps you stuck'},
 {t:'problem', h:'Funny is not a formula', body:'Joke templates and someone else’s style make you sound like everyone else. The internet is full of borrowed bits. Your own humor is the one thing nobody else can post.'},
 {t:'part', kick:'Part Two', h:'The Find Your Sense of Humor method'},
 {t:'pillar', n:'01', h:'Define your funny', body:'Look at what already makes YOU laugh, through a few simple lenses. Your taste in funny is the map. We start there, not with a joke book.'},
 {t:'pillar', n:'02', h:'Find the funny fast', body:'Build the mindset to spot the funny in a normal moment, without the anxiety about whether other people will approve. Speed comes from permission, not pressure.'},
 {t:'pillar', n:'03', h:'Collect, Connect, Select', body:'My creativity system. Collect raw moments from your life, connect the unlikely ones, and select only what lands. That is how you create on command without overthinking.'},
 {t:'pillar', n:'04', h:'Take it somewhere', body:'Once you can find the funny, you point it somewhere: a stage, a feed, a following, a business built around your personality.'},
 {t:'part', kick:'Part Three', h:'How to be funny online'},
 {t:'online', h:'Four moves', items:['Discover your comedy style','Work your creativity muscles','Create content consistently','Magnetize your online audience']},
 {t:'online', h:'Pick your medium', items:['Podcasting','One-liners','Livestreaming','Sketches'], note:'Same funny, different stage. You do not need all four. You need one you will actually show up for.'},
 {t:'flaw', kick:'The flip', h:'Your flaws are the material', body:'The thing you are self-conscious about is usually the most human, most repeatable part of your comedy. We flip it from a weakness into your signature.'},
 {t:'credibility', kick:'Why me', h:'I have helped people who swore they were not funny', body:'I have run the Miami comedy scene through MiamiComedy.com for over a decade, host the Comedy Coach Podcast, and was named Best Miami Comedian by Miami New Times.'},
 {t:'recap', h:'What you walk away with', items:['A sense of humor you can find on command','A system to create without overthinking','A plan to turn it into an audience online']},
 {t:'cta', h:'Ready to find your funny?', body:'If you want help doing this in your own voice, book a 1-on-1 comedy discovery call and we will map your style together.', disclaimer:'This class is educational. No specific result or income is guaranteed. Results vary based on your own effort and circumstances.'}
];
const el=document.getElementById('deck');
S.forEach(function(s){
 const d=document.createElement('section');
 d.className='slide'+(s.t==='cta'?' cta-slide':'')+(s.t==='part'?' part':'');
 let html='';
 if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
 if(s.n) html+='<div class="num">'+s.n+'</div>';
 const tag=(s.t==='title')?'h1':'h2';
 if(s.h) html+='<'+tag+'>'+s.h+'</'+tag+'>';
 if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
 if(s.body) html+='<div class="body">'+s.body+'</div>';
 if(s.items){html+='<ul>';s.items.forEach(function(i){html+='<li>'+i+'</li>';});html+='</ul>';}
 if(s.note) html+='<div class="note">'+s.note+'</div>';
 if(s.t==='cta') html+='<div class="pill">Book your discovery call</div>';
 if(s.disclaimer) html+='<div class="disc">'+s.disclaimer+'</div>';
 d.innerHTML=html;
 el.appendChild(d);
});
</script>
</body>
</html>
