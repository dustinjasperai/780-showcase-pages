<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gentle Power: Add Six Figures to Your Offer Without Playing Hardball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fefef1; --panel:#f5f2e4; --rule:#e2ddcb;
    --ink:#000e1f; --muted:#4b5163; --accent:#664e8e; --slate:#33384d;
    --head:'Playfair Display',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--slate);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .deck{max-width:960px;margin:0 auto}
  .slide{background:var(--bg);min-height:76vh;display:flex;flex-direction:column;
    justify-content:center;padding:72px 72px;position:relative;
    border-bottom:1px solid var(--rule)}
  .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.08;
    letter-spacing:-.01em;max-width:18ch}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.12;
    letter-spacing:-.01em;max-width:20ch}
  .promise{font-size:20px;color:var(--muted);margin-top:26px;max-width:46ch}
  .lede{font-size:21px;line-height:1.55;max-width:50ch;margin-top:10px}
  .lede+.lede{margin-top:18px}
  .big{font-family:var(--head);font-weight:600;font-size:44px;line-height:1.12;
    max-width:22ch}
  .big .a{color:var(--accent);font-style:italic}
  .part-num{font-family:var(--head);font-style:italic;font-size:22px;color:var(--accent)}
  ul{list-style:none;margin-top:28px;max-width:52ch}
  li{position:relative;padding-left:30px;font-size:19px;margin:16px 0;color:var(--ink)}
  li:before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;
    background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .pillar-tag{font-family:var(--head);font-style:italic;font-size:26px;color:var(--accent);
    margin-bottom:12px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:30px 34px;margin-top:26px;max-width:54ch}
  .card h3{font-family:var(--head);font-weight:600;font-size:22px;margin-bottom:6px}
  .card p{color:var(--muted);font-size:18px}
  .steps{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
  .step{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--rule);
    border-radius:12px;padding:20px}
  .step .n{font-family:var(--head);font-size:30px;color:var(--accent);font-style:italic}
  .step .l{font-weight:600;font-size:17px;margin:8px 0 4px}
  .step .s{color:var(--muted);font-size:15px}
  .stat{display:flex;gap:40px;margin-top:30px;flex-wrap:wrap}
  .stat .v{font-family:var(--head);font-weight:700;font-size:40px;color:var(--accent)}
  .stat .k{color:var(--muted);font-size:15px;max-width:16ch;margin-top:4px}
  .foot{position:absolute;left:72px;bottom:30px;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .disclaim{font-size:14px;color:var(--muted);margin-top:26px;max-width:52ch;line-height:1.5}
  .ctaline{font-family:var(--head);font-size:24px;margin-top:20px;color:var(--ink)}
  .ctaline b{color:var(--accent)}
  @media(max-width:720px){.slide{padding:48px 30px}h1{font-size:36px}h2{font-size:28px}
    .big{font-size:30px}.foot{left:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'cover', kick:'A YourNegotiations.com Masterclass',
   h:'Gentle Power: How to Add Six Figures to Your Offer Without Playing Hardball',
   promise:'The calm, prepared way senior professionals move a job offer up by a meaningful amount, without burning the relationship they are about to join.'},

  {t:'who', kick:'Who this is for',
   h:'You have an offer coming. Or one sitting in your inbox right now.',
   lede:['You are a senior professional or executive. The role is right. The number is fine, maybe even good.',
         'And a quiet voice says: if I push, do I risk the whole thing? So most people say yes to the first number. That decision is the single most expensive one in your career.']},

  {t:'trap', kick:'The trap',
   h:'The belief that negotiating puts the offer at risk.',
   lede:['It almost never does. A written offer is a company telling you they already chose you.',
         'The real risk is the opposite: leaving a life-changing amount on the table because asking felt impolite.']},

  {t:'reframe', kick:'The reframe',
   big:'The number in your offer letter is the <span class="a">floor</span>, not the ceiling.'},

  {t:'part', part:'Part One', h:'Why good people under-negotiate'},

  {t:'point', kick:'The hidden negotiations',
   h:'You are negotiating at points you cannot even see.',
   lede:['Title, start date, scope, the review cycle, equity refresh, the sign-on, the band your base sits in. Each one is a negotiation.',
         'When you only see salary, you concede the other eight by default.']},

  {t:'point', kick:'The leverage window',
   h:'The most powerful moment is the one most people rush past.',
   lede:['Between the verbal yes and the written offer, you hold more leverage than at any other point. They have committed emotionally and have not papered it yet.',
         'Wait for the letter. Say thank you. Then begin.']},

  {t:'part', part:'Part Two', h:'The method: Discover, Plan, Execute'},

  {t:'pillar', tag:'Discover',
   h:'Find every negotiation before it finds you.',
   lede:['Map the full offer, not just base. List every lever that is actually on the table so none of them get conceded silently.']},

  {t:'pillar', tag:'Plan',
   h:'Your priorities become your strategy.',
   lede:['Get clear on what actually matters to you, money, time, title, growth, and rank it. That ranking is your custom plan. You never improvise a number again.']},

  {t:'pillar', tag:'Execute',
   h:'Walk in with the game plan already written.',
   lede:['Decide your asks, your order, and your words before the call. The calm comes from preparation, not nerve. The game plan is in place before the negotiation begins.']},

  {t:'tactics', kick:'The Gentle Power playbook',
   h:'Firm on the number. Warm with the person.',
   items:['Do not name your number first, and do not give a range.',
          'Wait for the official written offer before you counter.',
          'Treat "best and final" as a question, not a wall.',
          'Anchor on the full package, not just base salary.']},

  {t:'part', part:'Part Three', h:'Your offer, renegotiated calmly'},

  {t:'walk', kick:'A calm negotiation, start to finish',
   h:'No hardball. Just a prepared plan, run gently.',
   steps:[{n:'1',l:'Hold',s:'Thank them, ask for the written offer first.'},
          {n:'2',l:'Plan',s:'Rank your priorities against the full package.'},
          {n:'3',l:'Counter',s:'One calm, specific ask at a time.'},
          {n:'4',l:'Close',s:'Agree, and start the job on good terms.'}]},

  {t:'why', kick:'Why Gerta and Alex',
   h:'This is the room we have been in for a decade.',
   lede:['Gerta Malaj, trained by MIT and Harvard Law School negotiators, built at LinkedIn and Salary.com. Alex Choi, Wharton MBA and Harvard MPA, negotiated defense contracts in the Air Force and built at Meta.'],
   stat:[{v:'$90K+',k:'average added to clients’ offers (2023)'},
         {v:'Hundreds',k:'of clients coached through the method'}]},

  {t:'cta', kick:'Your next step',
   h:'Bring us your offer. Let us build your plan.',
   ctaline:'Book a free call at <b>yournegotiations.com</b>',
   disclaim:'This masterclass is educational and reflects the methods we teach. It is not legal, financial, or career advice, and no specific outcome is promised or guaranteed. Results vary by person, role, employer, and market.'}
];

const deck = document.getElementById('deck');
function esc(x){return x;}
S.forEach(function(s){
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.part) html += '<div class="part-num">'+s.part+'</div>';
  if(s.tag) html += '<div class="pillar-tag">'+s.tag+'</div>';
  if(s.t==='cover' && s.h) html += '<h1>'+s.h+'</h1>';
  else if(s.big) html += '<div class="big">'+s.big+'</div>';
  else if(s.h) html += '<h2>'+s.h+'</h2>';
  if(s.promise) html += '<p class="promise">'+s.promise+'</p>';
  if(s.lede) s.lede.forEach(function(p){ html += '<p class="lede">'+p+'</p>'; });
  if(s.items){ html += '<ul>'; s.items.forEach(function(i){ html += '<li>'+i+'</li>'; }); html += '</ul>'; }
  if(s.steps){ html += '<div class="steps">'; s.steps.forEach(function(st){
    html += '<div class="step"><div class="n">'+st.n+'</div><div class="l">'+st.l+'</div><div class="s">'+st.s+'</div></div>'; }); html += '</div>'; }
  if(s.stat){ html += '<div class="stat">'; s.stat.forEach(function(q){
    html += '<div><div class="v">'+q.v+'</div><div class="k">'+q.k+'</div></div>'; }); html += '</div>'; }
  if(s.ctaline) html += '<div class="ctaline">'+s.ctaline+'</div>';
  if(s.disclaim) html += '<div class="disclaim">'+s.disclaim+'</div>';
  html += '<div class="foot">YourNegotiations.com &middot; Gentle Power</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
