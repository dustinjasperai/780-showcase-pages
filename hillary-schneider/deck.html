<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Horse Was Never a Tool — A Horse Medicine Leadership Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alice&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1ebe2;        /* warm bone, from site */
    --panel:#efe6d8;     /* soft sand */
    --ink:#2b2019;       /* deep warm brown */
    --muted:#6f6052;
    --accent:#aa4725;    /* terracotta, from site */
    --rule:#d9ccba;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:"Work Sans",system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:56px 56px;margin:22px 0;min-height:480px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .slide::before{content:"";position:absolute;left:56px;top:40px;width:46px;height:3px;background:var(--accent)}
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:"Alice",Georgia,serif;font-size:46px;line-height:1.12;font-weight:400;margin:6px 0 14px}
  h2{font-family:"Alice",Georgia,serif;font-size:34px;line-height:1.16;font-weight:400;margin:4px 0 16px}
  p{font-size:19px;line-height:1.62;color:var(--ink);max-width:62ch;margin:0 0 14px}
  p.lead{font-size:22px;color:var(--muted)}
  .num{position:absolute;right:30px;bottom:22px;font-size:13px;color:var(--muted);letter-spacing:.08em}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 26px;border-top:1px solid var(--rule);position:relative;max-width:64ch}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:23px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  li b{font-family:"Alice",serif;font-weight:400}
  .cover{background:var(--panel)}
  .cover h1{font-size:56px}
  .pill{display:inline-block;background:var(--accent);color:var(--bg);font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:999px;font-weight:600;margin-bottom:22px;width:max-content}
  .cta{background:var(--panel)}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:66ch;line-height:1.5}
  .by{font-size:16px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', html:`<div class="slide cover">
      <span class="pill">A live Horse Medicine Leadership masterclass</span>
      <h1>The Horse Was Never a Tool</h1>
      <p class="lead">Equine-guided facilitation, co-created with the herd. Learning to listen before you lead.</p>
      <div class="by">With Hillary Schneider &middot; Epona Rise</div>
    </div>`},
  {t:'promise', html:`<div class="slide"><div class="eyebrow">What this hour is for</div>
      <h2>By the end, you will see the work differently</h2>
      <p>Most training teaches you to use a horse to produce an outcome. This hour is about the opposite: how the horse becomes an equal teacher, and why that single shift changes everything about how you facilitate.</p>
      <p>We will walk through the first steps of The Medicine of Self, the authentic and false self, and the path that turns a calling into a practice.</p></div>`},
  {t:'forwho', html:`<div class="slide"><div class="eyebrow">Who this is for</div>
      <h2>You feel the pull toward this work</h2>
      <ul>
        <li>You have felt something real in the presence of horses and suspect it is meant to be your work.</li>
        <li>You may already work with horses, or people, and want to bring the two together with integrity.</li>
        <li>You are done with methods that treat the horse as a prop for a human result.</li>
      </ul></div>`},
  {t:'trap', html:`<div class="slide"><div class="eyebrow">The trap</div>
      <h2>The calling is clear. The how is not.</h2>
      <p>You feel the energy of the calling. Then you step onto the path and get lost in the weeds: how do I receive clients, how do I language this, what do I charge, who do I welcome.</p>
      <p>Boundaries blur, the connection to purpose gets quiet, and the vision you felt so clearly starts to feel far away.</p></div>`},
  {t:'reframe', html:`<div class="slide"><div class="eyebrow">The reframe</div>
      <h1>Horses respond to energy, not ego.</h1>
      <p class="lead">The problem was never your technique. It is that you were taught to manage the horse instead of meeting it. The work begins the moment you stop performing and start listening.</p></div>`},
  {t:'p1head', html:`<div class="slide cover"><div class="eyebrow">Part one</div>
      <h1>The core problem</h1>
      <p class="lead">Why most equine work stalls, and where the real leverage is.</p></div>`},
  {t:'p1a', html:`<div class="slide"><div class="eyebrow">Part one</div>
      <h2>Using the horse is a ceiling</h2>
      <p>When the horse is a tool, your facilitation can only go as deep as your agenda. The horse mirrors the agenda back, people get a nice experience, and nothing lasting moves.</p>
      <p>When the horse is a partner, it shows people the one thing they came to avoid. That is where the transformation lives, and it cannot be scripted.</p></div>`},
  {t:'p1b', html:`<div class="slide"><div class="eyebrow">Part one</div>
      <h2>You cannot hold a space you have not walked</h2>
      <p>The depth you can hold for a client is set by the depth you have met in yourself. This is why the method starts with the facilitator, not with exercises for the horse.</p></div>`},
  {t:'p2head', html:`<div class="slide cover"><div class="eyebrow">Part two</div>
      <h1>The method</h1>
      <p class="lead">The Medicine of Self, and the pillars it rests on.</p></div>`},
  {t:'medicine', html:`<div class="slide"><div class="eyebrow">Pillar one</div>
      <h2>The Medicine of Self</h2>
      <p>The knowing and claiming of your own personal medicine: the specific gift you carry that no technique can give you. Before you facilitate for anyone, you learn to recognise and trust it.</p></div>`},
  {t:'selves', html:`<div class="slide"><div class="eyebrow">Pillar two</div>
      <h2>The authentic self and the false self</h2>
      <p>Learning to tell the difference, in yourself and in the room, and to tend to each part of the self rather than fight it. The horses make this visible in seconds, because they answer the authentic self and ignore the performance.</p></div>`},
  {t:'archetypes', html:`<div class="slide"><div class="eyebrow">Pillar three</div>
      <h2>Archetypes, journeyed with the herd</h2>
      <p>Working the archetype at liberty with the horses, so the symbol stops being an idea and becomes something you feel. It is how a client meets the pattern that has been running their life.</p></div>`},
  {t:'rituals', html:`<div class="slide"><div class="eyebrow">Pillar four</div>
      <h2>Practices and rituals</h2>
      <p>The grounding practices that keep the facilitator rooted, so you can hold a big space without being depleted by it. Mastery is not intensity. It is the capacity to stay.</p></div>`},
  {t:'p3head', html:`<div class="slide cover"><div class="eyebrow">Part three</div>
      <h1>In the Pasture</h1>
      <p class="lead">From calling to practice.</p></div>`},
  {t:'equus', html:`<div class="slide"><div class="eyebrow">The path</div>
      <h2>The Journey of Equus</h2>
      <p>The training arc where you learn to partner with horses at liberty and to facilitate this for others. It is the difference between having felt something once and being able to offer it, on purpose, again and again.</p></div>`},
  {t:'look', html:`<div class="slide"><div class="eyebrow">In practice</div>
      <h2>A session, done this way</h2>
      <ul>
        <li>The herd is at liberty. Nothing is staged, and nothing is forced.</li>
        <li>The facilitator holds the space from a grounded, authentic place, not a method script.</li>
        <li>The horse brings the client to the exact edge they came to find.</li>
        <li>The client leaves with something they felt in the body, not just understood in the head.</li>
      </ul></div>`},
  {t:'whyme', html:`<div class="slide"><div class="eyebrow">Why learn this here</div>
      <h2>Co-created with the horses, over two decades</h2>
      <p>I have spent more than twenty years with horses and over a decade facilitating this work, on an 80-acre retreat center with a herd of wise equine teachers. Since 2013 I have trained facilitators who now run their own practices around the world.</p>
      <p>This method was not built from a textbook. It was co-created with the herd.</p></div>`},
  {t:'cta', html:`<div class="slide cta"><div class="eyebrow">Your next step</div>
      <h1>Walk the path with us</h1>
      <p>If this is the work you are called to, the Horse Medicine Leadership certification is how you learn to hold it with depth and integrity, and to build a practice that sustains you.</p>
      <p><b>Explore the certification and the Journey of Equus at horsemedicineleadership.com.</b></p>
      <div class="disc">This masterclass is educational and shares a philosophy and method of practice, not therapy or financial advice. No result is guaranteed. Results vary from person to person.</div></div>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const wrap = document.createElement('div');
  wrap.innerHTML = s.html;
  const el = wrap.firstElementChild;
  const n = document.createElement('div');
  n.className = 'num';
  n.textContent = (i+1) + ' / ' + S.length;
  el.appendChild(n);
  deck.appendChild(el);
});
</script>
</body>
</html>
