<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Three-Day-a-Month Studio — Paula Brennan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#262320;
    --panel:#302c27;
    --rule:#4a443c;
    --accent:#ece7db;
    --chalk:#f3eee4;
    --dim:#b8b0a2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--chalk);font-family:'Lato',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:4px;
    padding:54px 56px;margin:0 0 20px;min-height:360px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .eyebrow{font-family:'Lato',sans-serif;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:56px;line-height:1.05;color:var(--chalk);margin-bottom:18px}
  h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;line-height:1.1;color:var(--chalk);margin-bottom:16px}
  p{font-size:19px;line-height:1.65;color:var(--dim);max-width:62ch;margin-bottom:14px}
  p.lead{font-size:22px;color:var(--chalk)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.6;color:var(--chalk);padding-left:26px;position:relative;margin-bottom:12px;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:12px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .big{font-family:'Cormorant Garamond',serif;font-size:72px;font-weight:600;color:var(--accent);line-height:1}
  .num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:28px;color:var(--accent);margin-bottom:10px}
  .rule{height:1px;background:var(--rule);margin:26px 0;width:80px}
  .foot{position:absolute;bottom:20px;left:56px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .disc{font-size:14px;color:var(--dim);margin-top:20px;max-width:60ch}
  .cta h1{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Paula Brennan',h:'The Three-Day-a-Month Studio',p:'How to build a personal brand photography business that stays fully booked on about three shoot days a month, without a studio, a sales room, or another Saturday wedding.'},
  {t:'promise',eyebrow:'What you will leave with',h:'A different model, not more hustle',p:'By the end of this session you will understand the exact business model that let me go from weddings every weekend to a calendar I actually control, and the three moves that make it run.'},
  {t:'who',eyebrow:'Who this is for',h:'The photographer who is good, and tired',list:['You can shoot. The work is not the problem.','You are stuck in feast or famine, chasing low-budget leads.','Your best weekends go to other people’s big days.','You want business-friendly hours and more creative control.']},
  {t:'trap',eyebrow:'The weekend you cannot get back',h:'Weddings, late nights, rinse and repeat',p:'For years my whole year was booked around other people’s Saturdays. More bookings just meant more weekends gone. The ceiling was not my skill. It was the model.'},
  {t:'reframe',eyebrow:'The uncomfortable part',h:'Booking more weddings is the wrong goal',p:'Every educator in the feed is teaching photographers to book more of the same work. That keeps you on the treadmill. The real move is to change what you sell and who you sell it to.'},
  {t:'part',eyebrow:'Part One',h:'Why effort stops paying',p:'In a shoot-for-time business, your income is capped by the number of days you can physically work. You cannot out-hustle a model that trades hours for money.'},
  {t:'detail',eyebrow:'The real cost',h:'Three ways the old model leaks',list:['You compete on price because you look like everyone else.','You rebuild your flow of work from zero after every busy season.','You are the bottleneck, so the business cannot grow without you shooting more.']},
  {t:'part',eyebrow:'Part Two',h:'The studio-free personal brand model',p:'Personal brand photography serves business owners who need a steady stream of images to market themselves. It is high-value, repeatable, and it does not need a studio or a weekend.'},
  {t:'who-buys',eyebrow:'Who actually pays for this',h:'Business owners, not just brides',list:['Consultants, coaches, founders and professionals marketing themselves.','They need fresh images every quarter, not once in a lifetime.','They value the outcome, so they do not haggle over the hour.']},
  {t:'why-pays',eyebrow:'Why it pays more',h:'From pretty to powerful',p:'When your work is positioned as a marketing asset instead of a nice-to-have, the conversation stops being about price. One half-day can produce a client’s whole year of content.'},
  {t:'framework',eyebrow:'Part Three',h:'Market, Sell and Automate',p:'This is the framework I take photographers through. Three moves, in order, that turn a talent into a business that runs on fewer hours.'},
  {t:'market',eyebrow:'Move One · Market',h:'50 Dream Clients',p:'Stop shouting at everyone. Identify the specific industries and owners who happily pay premium rates for personal brand work, and go to them directly. The right fifty names change everything.'},
  {t:'sell',eyebrow:'Move Two · Sell',h:'Build offers clients actually book',p:'Package the work so it is an easy yes: clear outcomes, repeat sessions, and a price that reflects the value. This is where undercharging ends.'},
  {t:'automate',eyebrow:'Move Three · Automate',h:'Systems that carry the load',p:'Put your enquiries, bookings, follow-up and delivery into one system so repeat work books itself. The business should not live inside your head, or only move when you are behind the camera.'},
  {t:'practice',eyebrow:'Putting it together',h:'A month in the new model',p:'A handful of planned shoot days. Clients who rebook on a schedule. Evenings and weekends that belong to you again. The same camera, a completely different business.'},
  {t:'why-me',eyebrow:'Why listen to me',h:'I built the exit I am describing',p:'About twenty-five years behind the camera: roughly fifteen in weddings, ten in studio portraiture, and the last eight building this. I made the pivot myself before I ever taught it.'},
  {t:'shift',eyebrow:'The shift in one line',h:'Change the model, not the effort',p:'You do not need to work more weekends or drop your prices. You need a model built for fewer, higher-value shoot days, and a system behind it.'},
  {t:'recap',eyebrow:'What we covered',h:'The three moves',list:['Market: go to your 50 dream clients on purpose.','Sell: offers that are an easy, premium yes.','Automate: systems so the work repeats without you chasing it.']},
  {t:'cta',eyebrow:'Where to take this next',h:'Come build it with me',p:'If you want to put this to work in your own business, join me inside the PBE Academy, where we implement Market, Sell and Automate together, step by step, with live support.',disc:'This masterclass is educational. It shares a business model and a framework, not a promise of income. No specific result is guaranteed and results vary with your market, effort and execution.'}
];
const root=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'||s.t==='cta') h+='<h1>'+s.h+'</h1>'; else h+='<h2>'+s.h+'</h2>';
  if(s.p) h+='<p class="lead">'+s.p+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.disc) h+='<p class="disc">'+s.disc+'</p>';
  h+='<div class="foot">Paula Brennan Education · '+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=h;
  root.appendChild(d);
});
</script>
</body>
</html>
