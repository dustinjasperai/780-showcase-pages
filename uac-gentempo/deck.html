<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Increase Your Net Worth by Upgrading Your Network · UAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f2ea; --panel:#002554; --rule:#e3dccf;
    --ink:#1c1c1c; --accent:#002554; --accent2:#9bb8d3; --grey:#5a5852; --dim:#9a978f;
  }
  html,body{height:100%}
  body{background:#0a1526;font-family:'Quicksand',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a1526}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:3.7vw;max-width:92%}
  .t-normal h1{font-size:2.5vw;max-width:84%}
  .t-normal .body{font-size:1.36vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-size:1.5vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.52;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-size:1.3vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:2.7vw;max-width:84%;color:#ffffff}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:2.9vw;max-width:82%;color:#ffffff}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent2);color:#ffffff;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:700}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#c6cfe0}
  .t-title .disc,.t-normal .disc{text-align:left}
  .room-motif{position:absolute;pointer-events:none}
  .title-room{right:6.5%;bottom:10%;width:18vw;opacity:.96}
  .brandline{font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,37,84,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.8vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Ultimate Achievers Club</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="room" viewBox="0 0 260 160">
  <g fill="none" stroke="#002554" stroke-width="3">
    <line x1="60" y1="44" x2="130" y2="86"/>
    <line x1="200" y1="40" x2="130" y2="86"/>
    <line x1="40" y1="120" x2="130" y2="86"/>
    <line x1="220" y1="126" x2="130" y2="86"/>
    <line x1="60" y1="44" x2="200" y2="40"/>
    <line x1="40" y1="120" x2="220" y2="126"/>
  </g>
  <g fill="#002554">
    <circle cx="60" cy="44" r="9"/>
    <circle cx="200" cy="40" r="9"/>
    <circle cx="40" cy="120" r="9"/>
    <circle cx="220" cy="126" r="9"/>
  </g>
  <circle cx="130" cy="86" r="13" fill="none" stroke="#002554" stroke-width="4"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Increase Your Net Worth by Upgrading Your Network',sub:'A live masterclass for chiropractic business owners on how the profession’s most successful owners scale, built from the Ultimate Achievers Club method.',brand:true},
 {t:'normal',k:'Who this is for',title:'You built a practice that works. The next level is not another technique.',body:'This is for the chiropractic owner who has already proven they can run a business and now wants to scale it. Past a certain point the constraint is rarely one more marketing tactic or one more certification. It is who you spend your time around, and what they know that you do not.'},
 {t:'dark',title:'You are the average of the rooms you spend your time in. Most owners never change the room.'},

 {t:'section',idx:'Part One',title:'Why Good Owners Plateau'},
 {t:'normal',k:'The ceiling of your own network',title:'You can only learn what the people around you already know.',body:'Every owner reaches a level where their peers stop being ahead of them. Advice starts to repeat, the same problems circle back, and everyone in the room solves them the same way. Growth slows not from a lack of effort but from a lack of new information.'},
 {t:'normal',k:'Isolation at the top',title:'The higher you climb, the fewer people can actually help you.',body:'The problems of a multi million dollar practice are not the problems of a startup. Staffing, acquisitions, multiple locations, and one day an exit are lonely calls when nobody around you has made them. Most owners face these decisions with no one to ask who has been there.'},
 {t:'dark',title:'The plateau is an information problem before it is a strategy problem.'},

 {t:'section',idx:'Part Two',title:'The Right Room'},
 {t:'normal',k:'Access',title:'Proximity to people ahead of you is the fastest way to learn.',body:'The idea is simple. Put yourself in a room of owners who have already built what you are building, and lessons that would take years to earn on your own arrive in a single conversation. Access to the right people is the rarest and most valuable asset an owner can hold.'},
 {t:'normal',k:'Connection',title:'The right relationships outlast every trend and tactic.',body:'Techniques change, algorithms change, the market changes. The one asset that compounds is a network of owners you trust and who trust you. Those relationships become referral partners, sounding boards, and sometimes the reason a hard year does not sink you.'},
 {t:'normal',k:'Inside information',title:'The best moves are shared in private, long before they go public.',body:'What actually works this year, which vendors deliver, how a deal was really structured. None of it shows up in a course. It moves between trusted owners in the room. Inside information yields a competitive advantage that no amount of public content can match.'},
 {t:'normal',k:'Accountability',title:'These are relationships, not coaching calls.',body:'Real accountability is not a monthly check in with a coach. It is a long term relationship with peers who know your business, expect you to follow through, and tell you the truth. That is what turns a good operator into a great one, over years, not weeks.'},
 {t:'dark',title:'You do not scale by working harder inside your own four walls. You scale by changing the room.'},

 {t:'section',idx:'Part Three',title:'What Changing the Room Looks Like'},
 {t:'normal',k:'Contribute your genius',title:'The room only works when everyone brings something to it.',body:'A real peer group is not an audience. Each owner arrives with hard won answers and leaves with the ones they were missing. You give your best thinking to the room, and the room hands you back a decade of other people’s experience in return.'},
 {t:'normal',k:'Upgrade your network, upgrade your net worth',title:'Change who you learn from and the numbers follow.',body:'When your peers are the owners running the largest and best run practices in the profession, their standard becomes your baseline. The quality of your decisions rises to meet the room, and a business built on better decisions is a more valuable business.'},

 {t:'section',idx:'Where This Comes From',title:'The Room, Already Built'},
 {t:'normal',k:'A vetted room, not a seminar',title:'The Ultimate Achievers Club was built to be the right room for chiropractic.',body:'It is an invitation based community of established chiropractic business owners who gather through the year to mastermind, trade inside information, and hold each other to a higher standard. Not a course to complete. A room to belong to.'},
 {t:'normal',k:'How it works',title:'This hour is the idea. The room is where you live it.',body:'This masterclass lays out why your network sets your ceiling and how the most successful owners break through it. From there, the Ultimate Achievers Club is where you step into the room and build alongside owners who have already done it.'},
 {t:'cta',title:'Ready to upgrade the room you scale in?',chips:['Apply to the Ultimate Achievers Club'],disc:'Educational content for established chiropractic business owners. No income, revenue, or business result is guaranteed. Results vary by owner, market, and effort.'},
];

const deck=document.getElementById('deck');
function roomSvg(){return `<svg class="room-motif title-room"><use href="#room"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Ultimate Achievers Club &middot; <b>The Right Room</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=roomSvg();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
