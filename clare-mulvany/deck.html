<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live a New Story, a masterclass with Clare Mulvany</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe8d7;        /* warm cream ground, from brand #eee7d6 */
    --panel:#f7f2e8;
    --card:#fffdf8;
    --ink:#2b2a26;       /* warm near-black */
    --accent:#2f5d57;    /* deep seasonal teal, deepened from brand #aad6d2 */
    --tint:#aad6d2;      /* brand teal */
    --rule:#d9cfb8;
    --display:'Playfair Display',Georgia,serif;
    --body:'Figtree',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:64px;line-height:1.02;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.08;margin-bottom:16px}
  .sub{font-family:var(--display);font-weight:500;font-size:30px;color:var(--accent);margin-top:14px}
  p.body{font-size:20px;line-height:1.5;max-width:60ch;color:#403d36}
  ul{list-style:none;margin:22px 0 0}
  li{font-size:19px;line-height:1.45;padding:12px 0 12px 30px;position:relative;max-width:62ch;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:50%;
    background:var(--tint);border:2px solid var(--accent)}
  .foot{position:absolute;right:30px;bottom:22px;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:#8c8470}
  .num{position:absolute;left:30px;bottom:22px;font-size:12px;color:#b4ab93;font-weight:700}
  .wheel{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px;max-width:640px}
  .thr{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
  .thr b{font-family:var(--display);font-size:26px;display:block;color:var(--accent)}
  .thr span{font-size:15px;color:#5e5848}
  .cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#f7f2e8;
    font-weight:700;font-size:18px;padding:15px 30px;border-radius:999px;letter-spacing:.02em}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:#7a7360;max-width:64ch;font-style:italic}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:42px}h2{font-size:30px}.sub{font-size:22px}.wheel{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Clare Mulvany',
   title:'Live a New Story',
   sub:'Writing the Book That Has Been Waiting in You',
   foot:'Creativity, Place & Story'},

  {t:'promise', kicker:'In the next hour',
   title:'What you will leave with',
   points:[
     'Why the book keeps stalling, and the one shift that changes it.',
     'A way to map your book so it stops feeling like too much.',
     'A writing rhythm, built on the seasons, that you can start this week.']},

  {t:'who', kicker:'Who this is for',
   title:'You have a book in you',
   body:'A memoir, a work of nonfiction, a story only you can tell. You have carried it for years.',
   points:[
     'You start, then you stall.',
     'You tell yourself you lack the discipline.',
     'The blank page keeps winning.']},

  {t:'trap', kicker:'The trap',
   title:'You were told writing is a sprint',
   body:'Block out the weekend. Push through. Hit the word count. And when the sprint fails, you decide the problem is you.'},

  {t:'trap2', kicker:'The trap',
   title:'The weekend that never comes',
   body:'So the book waits for the free weekend, the quiet month, the version of you with more willpower. That weekend never arrives, and another year passes with the story still inside you.'},

  {t:'reframe', kicker:'A reframe',
   title:'It was never discipline',
   body:'A book is not forced. It is grown. In season, in place, in rhythm with your own life. The writers who finish are not the most disciplined. They are the ones who found a rhythm they could keep.'},

  {t:'part', kicker:'Part One',
   title:'Why the book really stalls',
   body:'Three obstacles stop more books than a lack of talent ever will.',
   points:[
     'Overwhelm: the whole book at once, instead of the next true page.',
     'The inner critic: the voice that asks who am I to write this.',
     'No rhythm: writing only when inspiration happens to visit.']},

  {t:'idea', kicker:'Part One',
   title:'The page you can write today',
   body:'You do not need to see the whole path. You need the next threshold, and a rhythm that brings you back to the desk after the mood has gone.'},

  {t:'part', kicker:'Part Two',
   title:'Creativity, Place and Story',
   body:'My method weaves three strands together. Each one answers one of the three obstacles.',
   points:[
     'Creativity: ideation and visioning tools to map the book before you get lost inside it.',
     'Place: writing rooted where you are, so the work has ground under it.',
     'Story: your own narrative as the spine the whole book is built on.']},

  {t:'wheel', kicker:'The rhythm',
   title:'The wheel of the writing year',
   body:'We borrow the oldest calendar there is. Eight seasonal thresholds, each with its own creative work. These four carry the arc of a book.',
   tiles:[
     {b:'Samhain', s:'Begin in the dark. Gather what wants to be written.'},
     {b:'Imbolc', s:'First pages stir. Protect the fragile start.'},
     {b:'Bealtaine', s:'The draft opens. Write into momentum.'},
     {b:'Lúnasa', s:'Gather the harvest. Shape it and finish.'}]},

  {t:'idea', kicker:'The rhythm',
   title:'Why the seasons work',
   body:'A year is long enough to write a book and short enough to feel real. The wheel gives you return without pressure. You are never starting over. You are coming round again.'},

  {t:'practice', kicker:'The practice',
   title:'Small, repeatable, yours to keep',
   body:'Owl hours of quiet writing. Creative prompts tuned to the season. Visioning and future writing. Narrative mapping. None of it depends on a burst of willpower.'},

  {t:'belief', kicker:'The inner critic',
   title:'Who am I to write this',
   body:'That voice is not the truth. It is the first chapter. Every writer meets it. The work is learning to write beside it, rather than waiting for it to leave.'},

  {t:'part', kicker:'Part Three',
   title:'What a year of writing looks like',
   body:'Not a sprint. A practice you can keep.',
   points:[
     'A regular writing rhythm that survives a busy life.',
     'Your ideas mapped, so you always know the next page.',
     'The inner critic named and set gently to one side.',
     'A finished manuscript, grown in season.']},

  {t:'imagine', kicker:'A year from now',
   title:'The draft is done',
   body:'Imagine next Samhain, returning to the dark with a finished manuscript in your hands. Not because you finally found more discipline, but because you kept a rhythm you could live with.'},

  {t:'whyme', kicker:'Why me',
   title:'Clare Mulvany',
   body:'Writer and author of One Wild Life. Twenty years in education for transformation. An EMCC accredited mentor. Founder of Thrive School and The Wild Edge, a community of writers working in rhythm with the Celtic seasons.'},

  {t:'story', kicker:'How I work',
   title:'I read your pages and walk the year with you',
   body:'One year, one project. I help you map the book, find a rhythm you can keep, and keep returning, from the first stirring to a finished draft.'},

  {t:'invite', kicker:'The invitation',
   title:'If this is your year, let us begin',
   body:'The story has waited long enough. You do not have to write it in one heroic sprint. You have to begin, in season, and keep coming round.'},

  {t:'cta', kicker:'Next step',
   title:'Write the book that has been waiting',
   body:'Book a discovery call and we will map your project and your writing rhythm together.',
   cta:'Book a discovery call',
   foot:'claremulvany.ie',
   disclaimer:'This masterclass is offered for educational purposes only. Writing outcomes vary and depend on your own practice and circumstances. No specific result is promised or guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '';
  if(s.kicker) h += `<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){
    h += `<h1>${s.title}</h1>`;
    if(s.sub) h += `<div class="sub">${s.sub}</div>`;
  } else {
    h += `<h2>${s.title}</h2>`;
  }
  if(s.body) h += `<p class="body">${s.body}</p>`;
  if(s.points){ h += '<ul>'; s.points.forEach(p=> h += `<li>${p}</li>`); h += '</ul>'; }
  if(s.tiles){ h += '<div class="wheel">'; s.tiles.forEach(t=> h += `<div class="thr"><b>${t.b}</b><span>${t.s}</span></div>`); h += '</div>'; }
  if(s.cta) h += `<div class="cta-btn">${s.cta}</div>`;
  if(s.disclaimer) h += `<div class="disc">${s.disclaimer}</div>`;
  if(s.foot) h += `<div class="foot">${s.foot}</div>`;
  h += `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
