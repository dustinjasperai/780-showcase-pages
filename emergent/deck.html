<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Leader as Coach — Emergent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#f4f2ef;
    --rule:#e2ddd6;
    --ink:#2c2c2c;
    --structure:#274d5b;
    --accent:#b54f48;
    --deep:#883b36;
    --display:'Raleway',system-ui,sans-serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:64px 60px;
    margin:0 0 26px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.05;color:var(--structure);margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.12;color:var(--structure);margin-bottom:16px}
  p{font-size:19px;line-height:1.6;margin-bottom:14px;max-width:62ch}
  .lead{font-size:26px;line-height:1.45;color:var(--ink);max-width:40ch}
  .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.1;color:var(--deep);max-width:20ch}
  .muted{color:#6a6560}
  ul{margin:8px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 20px;border-left:3px solid var(--accent);margin-bottom:12px}
  li b{font-family:var(--display);color:var(--structure)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
  .cstep{background:var(--panel);border-radius:10px;padding:22px 24px;border-top:4px solid var(--accent)}
  .cstep h3{font-family:var(--display);font-weight:700;color:var(--structure);font-size:22px;margin-bottom:6px}
  .cstep p{font-size:16px;margin:0}
  .arc{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px}
  .arc span{font-family:var(--display);font-weight:700;color:var(--structure);font-size:22px;background:var(--panel);padding:14px 18px;border-radius:10px}
  .arc em{color:var(--accent);font-style:normal;font-weight:800;font-size:22px}
  .foot{position:absolute;bottom:22px;left:60px;right:60px;display:flex;justify-content:space-between;font-size:12px;color:#9a948d;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
  .pair .box{background:var(--panel);border-radius:10px;padding:20px 22px}
  .pair .box .tag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
  .pair .was .tag{color:#9a948d}
  .pair .now .tag{color:var(--accent)}
  .cta h2{font-size:40px}
  .disclaimer{margin-top:22px;font-size:13px;color:#9a948d;max-width:60ch}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title'},
  {t:'promise', k:'The promise',
    h:'What you will leave with.',
    items:['A simple read on when to coach and when to just answer.',
           'The 4 Cs you can use in your very next one-on-one.',
           'Three questions that hand ownership back to your team.']},
  {t:'lead', k:'Who this is for',
    h:'For the leaders everyone brings their problems to.',
    p:'Managers, directors, and executives whose teams are good, busy, and just a little too dependent on them for the next answer.'},
  {t:'point', k:'The trap',
    h:'The most helpful manager is often the bottleneck.',
    body:['Every time you hand over the answer, you teach the team one thing: bring the next question back to me.',
          'It feels like leadership. It feels fast. And it quietly caps how big your people, and your team, can get.']},
  {t:'point', k:'The real cost',
    h:'What the bottleneck quietly costs.',
    body:['Your best people stay a notch smaller than they could be, because the hardest thinking keeps routing through you.',
          'And the work only you can do, the strategy and the big calls, keeps getting pushed to after hours.']},
  {t:'hook', big:'Your calendar is full of decisions that were never yours to make.'},
  {t:'point', k:'Part one: the core problem',
    h:'The answer habit.',
    body:['Answers solve today. They do not build the person. The team learns to wait for you instead of thinking it through.',
          'The goal is not a smarter boss. It is people who bring you better thinking, not just more questions.']},
  {t:'point', k:'Why training alone fades',
    h:'A workshop changes Monday for about a week.',
    body:['Insight on its own does not stick. What sticks is a new habit, practiced in real conversations, with feedback.',
          'This is our whole thesis: transformation happens when insight becomes practice.']},
  {t:'section', k:'Part two: the method', h:'The 4 Cs of the Leader as Coach.'},
  {t:'cgrid'},
  {t:'arc'},
  {t:'point', k:'The honest objection',
    h:'"I do not have time to coach in the moment."',
    body:['Coaching is not a longer conversation. It is often one question instead of one answer, and it takes the same thirty seconds.',
          'You spend the time either way. The only difference is whether it builds the person or just moves the task.']},
  {t:'point', k:'Part three: in the room',
    h:'Three questions that replace three answers.',
    body:['"What do you think the options are?" instead of "here is what to do."',
          '"What would you need to feel ready?" instead of "I will handle it."',
          '"What did you learn?" instead of moving straight to the next fire.']},
  {t:'pair'},
  {t:'point', k:'Why it holds',
    h:'Insight, then practice, then momentum.',
    body:['When a leader coaches instead of rescues, ownership moves to the team, problems get solved closer to the work, and the leader gets their calendar back.',
          'That is a culture change, not a course. It compounds.']},
  {t:'hook', big:'The best leaders are not the ones with the best answers. They are the ones who grow the best people.'},
  {t:'lead', k:'Is this you',
    h:'If your team is good but a little too dependent on you, this was built for that.',
    p:'Not a personality fix. A repeatable way to lead so your people grow.'},
  {t:'point', k:'Why Emergent',
    h:'This is the method we teach every day.',
    body:['The 4 Cs and the Leader as Coach arc are the spine of our six-month cohort: live workshops, one-on-one coaching, peer practice, and real-world application.',
          'We raise the consciousness and performance of leaders and teams so they realize their full potential.']},
  {t:'cta', disclaimer:'This masterclass is educational. No specific result is guaranteed. Results vary by leader and by organization.'}
];

function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function foot(){return '<div class="foot"><span>Emergent</span><span>The Leader as Coach</span></div>'}
const CS = [
  ['Consciousness','Self- and other-awareness. See your own reaction and read what the other person actually needs before you move.'],
  ['Context','Understand the situation before you guide it. The right question depends on what is really going on.'],
  ['Connection','Trust built through presence and deep listening. People only grow with someone they feel heard by.'],
  ['Content','Share your perspective only when it serves them, not to prove you know. The answer is the last resort, not the first.']
];
const deck = document.getElementById('deck');
S.forEach(s=>{
  let html='';
  if(s.t==='title'){
    html = '<div class="kicker">A live masterclass from Emergent</div>'+
      '<h1>The Leader as Coach</h1>'+
      '<p class="lead">How to grow your people without giving them the answer.</p>'+foot();
  } else if(s.t==='lead'){
    html = '<div class="kicker">'+esc(s.k)+'</div><h2>'+esc(s.h)+'</h2><p class="lead muted">'+esc(s.p)+'</p>'+foot();
  } else if(s.t==='point'){
    html = '<div class="kicker">'+esc(s.k)+'</div><h2>'+esc(s.h)+'</h2>'+
      s.body.map(b=>'<p>'+esc(b)+'</p>').join('')+foot();
  } else if(s.t==='promise'){
    html = '<div class="kicker">'+esc(s.k)+'</div><h2>'+esc(s.h)+'</h2><ul>'+
      s.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>'+foot();
  } else if(s.t==='hook'){
    html = '<div class="big">'+esc(s.big)+'</div>'+foot();
  } else if(s.t==='section'){
    html = '<div class="kicker">'+esc(s.k)+'</div><h1>'+esc(s.h)+'</h1>'+foot();
  } else if(s.t==='cgrid'){
    html = '<div class="kicker">The 4 Cs</div><h2>A mindset, in four moves.</h2><div class="grid">'+
      CS.map(c=>'<div class="cstep"><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p></div>').join('')+'</div>'+foot();
  } else if(s.t==='arc'){
    html = '<div class="kicker">The arc of change</div><h2>Why the habit sticks.</h2>'+
      '<div class="arc"><span>Awareness</span><em>&rarr;</em><span>Intentional Action</span><em>&rarr;</em><span>Sustainable Growth</span></div>'+
      '<p class="muted" style="margin-top:22px">Insight into how you lead, turned into specific daily practice, repeated until it holds on its own.</p>'+foot();
  } else if(s.t==='pair'){
    html = '<div class="kicker">The shift</div><h2>From rescuer to coach.</h2>'+
      '<div class="pair"><div class="box was"><div class="tag">Before</div><p>"The client is upset, what do I say?" "Send them to me, I will handle it."</p></div>'+
      '<div class="box now"><div class="tag">After</div><p>"The client is upset, what do I say?" "What do you think the options are? Pick one and tell me how it lands."</p></div></div>'+foot();
  } else if(s.t==='cta'){
    html = '<div class="cta"><div class="kicker">Your next step</div><h2>Build a coaching culture, on purpose.</h2>'+
      '<p>If you want your leaders coaching their people instead of carrying them, the next Leader as Coach cohort is where it starts. Book a conversation with the Emergent team and we will map it to your organization.</p>'+
      '<div class="disclaimer">'+esc(s.disclaimer)+'</div></div>'+foot();
  }
  const el = document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
