<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pre-Tender Advantage - Moonshot Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4;        /* warm white ground, from moonshotmedia.com.au site_scheme:light */
    --panel:#1c2b3a;     /* navy, their link color */
    --ink:#1c2b3a;       /* navy ink */
    --body:#333333;      /* their body text color */
    --accent:#f6a623;    /* their amber brand accent (8 uses, ranked #2) */
    --rule:#e7e0d4;      /* warm hairline from the taupe family */
    --muted:#6b6256;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:4px;
    padding:56px 56px;margin:0 0 22px;min-height:460px;position:relative;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:'Space Grotesk',sans-serif;font-weight:500;letter-spacing:.18em;
    text-transform:uppercase;font-size:12px;color:var(--muted);margin-bottom:18px}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--ink);
    font-size:54px;line-height:1.02;letter-spacing:-.01em}
  h2{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--ink);
    font-size:38px;line-height:1.08;margin-bottom:20px;letter-spacing:-.01em}
  p{font-size:20px;line-height:1.5;color:var(--body);max-width:46ch;margin-bottom:14px}
  .lead{font-size:26px;line-height:1.35;color:var(--ink);max-width:40ch}
  .sub{font-size:22px;color:var(--muted);margin-top:14px;font-family:'Space Grotesk',sans-serif;font-weight:500}
  .dark{background:var(--panel)}
  .dark::before{background:var(--accent)}
  .dark .eyebrow{color:#c9b998}
  .dark h1,.dark h2{color:#fff}
  .dark p{color:#d8dde3}
  .dark .lead{color:#fff}
  .num{position:absolute;top:22px;right:28px;font-family:'Space Grotesk',sans-serif;
    font-size:13px;color:var(--muted)}
  .dark .num{color:#7f8a97}
  ul{list-style:none;margin-top:8px}
  li{font-size:20px;line-height:1.45;color:var(--body);padding:10px 0 10px 28px;position:relative;max-width:50ch}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:2px;background:var(--accent)}
  .dark li{color:#d8dde3}
  .peak{display:flex;gap:10px;margin-top:10px}
  .peak span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;
    padding:8px 14px;border:1px solid var(--rule);border-radius:3px;color:var(--muted)}
  .peak span.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:120px;color:var(--accent);line-height:.9}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.5}
  .brandline{font-family:'Space Grotesk',sans-serif;font-weight:500;color:var(--muted);
    font-size:16px;margin-top:30px;letter-spacing:.04em}
  .cta-btn{display:inline-block;margin-top:22px;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:18px;color:#1c2b3a;background:var(--accent);
    padding:16px 30px;border-radius:3px;letter-spacing:.02em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title'},
 {t:'who'},
 {t:'trap'},
 {t:'hook'},
 {t:'part',eyebrow:'Part One',h:'Why capable contractors still get compared on price',p:"It is rarely about the price. It is about when the client first hears from you. If the only time you show up is after a project is already out to tender, you have arrived at the one moment where everyone looks the same on paper. So the client does the only thing left to do. They compare numbers."},
 {t:'list',eyebrow:'The core problem',h:'Three reasons the best builder still loses',items:["Reactive: you turn up when the work is already being priced, not before.","Invisible: the people who award the work do not know what you stand for.","Interchangeable: with nothing else to judge, the decision collapses to cost."]},
 {t:'shift',eyebrow:'The shift',h:'Get engaged earlier',p:"The whole game moves the moment you are known and trusted before the tender exists. You stop being a quote and start being the builder they already wanted. That is the Pre-Tender Advantage."},
 {t:'framework'},
 {t:'pillar',eyebrow:'Pillar 1',on:0,h:'Position',p:"Decide what you want to be known for. The specific lane, the type of client, the reputation you are choosing to own, instead of being a capable generalist who competes with everyone."},
 {t:'pillar',eyebrow:'Pillar 2',on:1,h:'Express',p:"Take the experience, standards, opinions and lessons already sitting inside your business and turn them into clear, trustworthy ideas. You are not inventing anything. You are putting language to what you already know."},
 {t:'pillar',eyebrow:'Pillar 3',on:2,h:'Amplify',p:"Put those ideas deliberately in front of the people who actually award and influence commercial work. Not everyone. The right contacts, consistently, at scale."},
 {t:'pillar',eyebrow:'Pillar 4',on:3,h:'Known',p:"Do it long enough and credibility compounds. The right clients know you, trust you and call you first, well before anything formally goes to market."},
 {t:'compound',eyebrow:'How it compounds',h:'Position plus Express plus Amplify plus Known',p:"Each pillar feeds the next. Clear positioning makes your ideas sharper. Sharper ideas travel further. The further they travel, the more known you become. Known is where price stops being the question."},
 {t:'looks',eyebrow:'A deliberate rhythm',h:'About four hours a month',p:"This is not a second job. It is a deliberate rhythm: decide the position, express one or two ideas, get them in front of the right people, and keep showing up. Done for a few hours a month, it changes who calls you and why."},
 {t:'whyme'},
 {t:'fit',eyebrow:'Who this is for',h:'And who it is not',items:["For commercial builders who are genuinely good and tired of proving it on price.","For owners ready to be deliberate about reputation, not leave it to chance.","Not for anyone looking for a quick fix, a magic bullet, or a shortcut.","Not for builders whose only strategy is being the cheapest."]},
 {t:'outcome',eyebrow:'The outcome',h:'Be the one they call first',p:"When you are known and trusted before the tender, you are no longer a line on a spreadsheet. You are the builder the right clients already wanted. That is the advantage this whole method is built to create."},
 {t:'cta',eyebrow:'Your next step',h:'Build your Pre-Tender Advantage',p:"If you want to be the builder the right clients already know and trust, this is the work. Join the waitlist for the next intake and we will map your Position, Express, Amplify and Known together.",cta:'Join the waitlist',disc:"This session is educational. No result is guaranteed. Results vary and depend on your business, your market and the work you put in. No income or contract-win guarantee is made or implied."}
];

const D=document.getElementById('deck');
function slide(inner,cls,n){return '<section class="slide '+(cls||'')+'"><span class="num">'+n+' / '+S.length+'</span>'+inner+'</section>';}
let html='';
S.forEach((s,i)=>{
 const n=i+1; let inner='';
 if(s.t==='title'){
   inner='<div class="eyebrow">A live masterclass</div><h1>The Pre-Tender Advantage</h1><p class="sub">How commercial builders get chosen before the job goes to tender.</p><div class="brandline">Jordan Skinner &middot; Moonshot Media</div>';
   html+=slide(inner,'dark',n);
 } else if(s.t==='who'){
   inner='<div class="eyebrow">Who this is for</div><p class="lead">For commercial construction founders doing roughly $5M to $200M who are done winning work on price alone, and ready to win it on trust.</p>';
   html+=slide(inner,'',n);
 } else if(s.t==='trap'){
   inner='<div class="eyebrow">The trap</div><p class="lead">You are the most capable builder in the room. And you are still being compared on a spreadsheet next to the cheapest one.</p>';
   html+=slide(inner,'',n);
 } else if(s.t==='hook'){
   inner='<div class="eyebrow">The hard truth</div><h1>By the time it is a tender, the advantage is already gone.</h1>';
   html+=slide(inner,'dark',n);
 } else if(s.t==='part'||s.t==='shift'||s.t==='compound'||s.t==='looks'||s.t==='outcome'){
   inner='<div class="eyebrow">'+(s.eyebrow||'')+'</div><h2>'+s.h+'</h2><p>'+s.p+'</p>';
   html+=slide(inner,'',n);
 } else if(s.t==='list'||s.t==='fit'){
   let li=s.items.map(x=>'<li>'+x+'</li>').join('');
   inner='<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.h+'</h2><ul>'+li+'</ul>';
   html+=slide(inner,'',n);
 } else if(s.t==='framework'){
   inner='<div class="eyebrow">Part Two</div><h1>The PEAK framework</h1><p class="sub">Position. Express. Amplify. Known.</p><p>Four moves that turn the knowledge already inside your business into the reason the right clients choose you first.</p>';
   html+=slide(inner,'dark',n);
 } else if(s.t==='pillar'){
   const names=['Position','Express','Amplify','Known'];
   let chips=names.map((nm,k)=>'<span class="'+(k===s.on?'on':'')+'">'+nm+'</span>').join('');
   inner='<div class="eyebrow">'+s.eyebrow+'</div><div class="peak">'+chips+'</div><h2 style="margin-top:22px">'+s.h+'</h2><p>'+s.p+'</p>';
   html+=slide(inner,'',n);
 } else if(s.t==='whyme'){
   inner='<div class="eyebrow">Why me</div><h2>I grew up in this industry</h2><p>My family has been in civil contracting since 1980. I have spent my working life around commercial construction, and I host the Crushing It In Construction podcast, where I sit down with the people who have built real construction businesses. This method comes from how commercial work actually gets awarded, not from a marketing textbook.</p><div class="brandline">Jordan Skinner &middot; Moonshot Media</div>';
   html+=slide(inner,'',n);
 } else if(s.t==='cta'){
   inner='<div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.h+'</h1><p>'+s.p+'</p><a class="cta-btn">'+s.cta+'</a><p class="disclaimer">'+s.disc+'</p><div class="brandline">Jordan Skinner &middot; Moonshot Media</div>';
   html+=slide(inner,'dark',n);
 }
});
D.innerHTML=html;
</script>
</body>
</html>
