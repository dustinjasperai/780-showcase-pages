<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick Your Practice — The Cash-Pay Model Masterclass | The Elite Nurse Practitioner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1c1f;        /* ground: derived from their dominant charcoal #404040 */
    --panel:#23262b;     /* panel */
    --rule:#3a3e44;      /* hairline */
    --accent:#0051c3;    /* their measured link/button blue (brand.json) */
    --ink:#eef1f4;       /* off-white text */
    --muted:#9aa3ad;     /* muted */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Mulish',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:1040px}
  .slide.active{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:'Archivo';font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:.78rem;color:var(--accent)}
  h1{font-family:'Archivo';font-weight:800;font-size:clamp(2rem,5.2vw,3.5rem);line-height:1.05;
    margin:.5rem 0}
  h2{font-family:'Archivo';font-weight:700;font-size:clamp(1.5rem,3.6vw,2.4rem);line-height:1.1;
    margin:.4rem 0}
  p{font-size:clamp(1rem,1.7vw,1.22rem);line-height:1.55;color:var(--ink);max-width:40ch}
  p.lead{color:var(--muted);max-width:52ch}
  .big{font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.2;font-weight:600;max-width:24ch}
  ul{list-style:none;margin-top:1.2rem;display:grid;gap:.7rem;max-width:46ch}
  li{position:relative;padding-left:1.6rem;font-size:clamp(1rem,1.7vw,1.2rem);line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:.55em;width:.7rem;height:.7rem;
    background:var(--accent);border-radius:2px}
  .menu{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin-top:1.4rem;max-width:620px}
  .mcard{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--accent);
    border-radius:10px;padding:1rem 1.1rem}
  .mcard b{font-family:'Archivo';font-weight:700;display:block;font-size:1.05rem}
  .mcard span{color:var(--muted);font-size:.92rem}
  .num{font-family:'Archivo';font-weight:800;color:var(--accent);font-size:1.1rem}
  .pillar{display:flex;gap:1rem;align-items:flex-start;margin-top:1rem;max-width:52ch}
  .pillar .n{font-family:'Archivo';font-weight:800;font-size:1.6rem;color:var(--accent);min-width:2.2rem}
  .disclaimer{color:var(--muted);font-size:.8rem;margin-top:1.6rem;max-width:56ch;line-height:1.4}
  .cta-btn{display:inline-block;margin-top:1.3rem;background:var(--accent);color:#fff;
    font-family:'Archivo';font-weight:700;padding:.8rem 1.4rem;border-radius:8px;text-decoration:none}
  .foot{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 28px;color:var(--muted);font-size:.78rem;font-family:'Archivo';letter-spacing:.04em}
  .kicker{color:var(--accent)}
  .nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  .nav button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);
    width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1rem}
</style>
</head>
<body>
<div id="stage"></div>
<p class="disclaimer" style="position:fixed;bottom:4px;left:28px;right:28px;text-align:center;font-size:.68rem;opacity:.55;margin:0">Educational only. No income or clinical result is guaranteed. Results vary with your market, effort, and state regulations.</p>
<div class="foot"><span>The Elite Nurse Practitioner</span><span id="pg"></span></div>
<div class="nav"><button onclick="go(-1)">‹</button><button onclick="go(1)">›</button></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass',h:'Pick Your Practice',
   sub:'How to choose the cash-pay practice model you will actually own, and the first moves to build it.',
   foot:'With Justin Allan, FNP'},

  {t:'who',eyebrow:'Who this is for',h:'You are a great clinician. You are also tired.',
   lead:'This is for the nurse practitioner who is done trading hours for a paycheck and ready to own the practice, but keeps stalling on one question: which kind?'},

  {t:'trap',eyebrow:'The trap',h:'The problem was never your ability.',
   lead:'You can run the clinic. What stops most NPs is the menu itself. Telehealth? HRT? Aesthetics? Weight loss? Functional medicine? With no map, the safe choice is to stay employed one more year.'},

  {t:'reframe',big:'Owning a practice is not one giant leap. It is picking one model and building it on purpose.'},

  {t:'part',eyebrow:'Part one',h:'Why most NPs never start'},
  {t:'bullets',h:'Three things keep you on the clinic floor',items:[
     'Too many options, no way to compare them to your license, your market, and your life.',
     'Every course teaches the clinical side and skips the business: pricing, margins, compliance.',
     'No first-ninety-days plan, so "someday" never gets a date.']},

  {t:'part',eyebrow:'Part two',h:'The Cash-Pay Model Menu'},
  {t:'lead2',h:'A model is a clinical service plus a business behind it.',
   lead:'The skill is not picking the trendiest service. It is matching a model to your state authority, your clinical comfort, and a market that pays cash. Here is the menu we choose from.'},
  {t:'menu',h:'Four proven cash-pay models',cards:[
     {b:'Telemedicine',s:'Low overhead, recurring, scalable from home.'},
     {b:'HRT & hormones',s:'High-demand, high-margin, loyal patient base.'},
     {b:'Aesthetics & Botox',s:'Cash-only, premium, repeat visits.'},
     {b:'Medical weight loss',s:'The most motivated patient market right now.'}]},
  {t:'pillars',eyebrow:'How to choose',h:'Three filters, in order',pill:[
     ['1','Authority. What can you own and prescribe in your state, solo or with a collaborator?'],
     ['2','Fit. Which model matches the medicine you actually like practicing?'],
     ['3','Market. Who near you already pays cash for this, and what will they pay?']]},
  {t:'bullets',eyebrow:'The build order',h:'Once you have picked, build in this order',items:[
     'The offer and the price, set for margin, not for comparison to insurance.',
     'Compliance and structure, done once and done right.',
     'Your first patients, from a simple repeatable channel, not from luck.']},

  {t:'part',eyebrow:'Part three',h:'What the first year can look like'},
  {t:'lead2',h:'One model, run well, replaces a salary.',
   lead:'You are not building a hospital. You are building one focused cash-pay service, priced for margin, that you can run on your terms and step back from as it grows.'},
  {t:'why',eyebrow:'Why learn this from me',h:'I built these practices before I taught them.',
   lead:'I am a practicing FNP who opened cash-pay practices of my own, then built The Elite Nurse Practitioner so other NPs would not have to guess. The whole library and the Practice Accelerator exist to take you from picking a model to running it.'},

  {t:'recap',eyebrow:'The takeaway',h:'Pick one model. Build it on purpose.',items:[
     'Stop collecting certifications and pick a model that fits your license and market.',
     'Learn the business behind the medicine, not just the medicine.',
     'Give the first ninety days a plan and a date.']},

  {t:'cta',eyebrow:'Your next step',h:'Ready to pick your model?',
   lead:'Join the Elite NP community and start with the model that fits you, backed by the course and the Practice Accelerator built for it.',
   btn:'Explore the Elite NP programs',
   disc:'Educational only. No income or clinical result is guaranteed. Results vary with your market, effort, and state regulations. Always follow your board of nursing and local laws.'}
];

const stage=document.getElementById('stage');
let i=0;
function slideHTML(s){
  if(s.t==='title')return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h1>${s.h}</h1><p class="lead">${s.sub}</p><p style="margin-top:1.4rem;color:var(--accent);font-family:Archivo;font-weight:700">${s.foot}</p></div>`;
  if(s.t==='reframe')return `<div class="slide"><p class="big">${s.big}</p></div>`;
  if(s.t==='part')return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h1>${s.h}</h1></div>`;
  if(s.t==='who'||s.t==='trap'||s.t==='why'||s.t==='lead2')return `<div class="slide"><div class="eyebrow">${s.eyebrow||''}</div><h2>${s.h}</h2><p class="lead">${s.lead}</p></div>`;
  if(s.t==='bullets'||s.t==='recap')return `<div class="slide"><div class="eyebrow">${s.eyebrow||''}</div><h2>${s.h}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  if(s.t==='menu')return `<div class="slide"><div class="eyebrow">Part two</div><h2>${s.h}</h2><div class="menu">${s.cards.map((c,n)=>`<div class="mcard"><span class="num">0${n+1}</span><b>${c.b}</b><span>${c.s}</span></div>`).join('')}</div></div>`;
  if(s.t==='pillars')return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2>${s.pill.map(p=>`<div class="pillar"><div class="n">${p[0]}</div><p>${p[1]}</p></div>`).join('')}</div>`;
  if(s.t==='cta')return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p><a class="cta-btn" href="https://elitenp.com/">${s.btn}</a><p class="disclaimer">${s.disc}</p></div>`;
  return `<div class="slide"><h2>${s.h||''}</h2></div>`;
}
function render(){
  stage.innerHTML=slideHTML(S[i]);
  stage.firstChild.classList.add('active');
  document.getElementById('pg').textContent=(i+1)+' / '+S.length;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
render();
</script>
</body>
</html>
