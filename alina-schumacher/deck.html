<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 4-Stage Market Domination Plan - Alina Schumacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcf3f2;        /* light paper carrying a whisper of her brand red, on her light site scheme */
    --panel:#fffafa;     /* snow-white panel, faint red-white (derived from #f82726 over white) */
    --ink:#1a1a1a;
    --muted:#5d574e;
    --rule:#f0dfdd;      /* red-tinted hairline */
    --accent:#f82726;    /* her signature red, 20 uses in brand.json */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 28px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .eyebrow{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:46px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:34px;line-height:1.14;
    margin-bottom:18px}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:62ch;margin-bottom:14px}
  p.lead{font-size:22px;color:var(--ink)}
  .big{font-family:'Montserrat',sans-serif;font-weight:800;font-size:68px;color:var(--accent);
    line-height:1;margin-bottom:16px}
  ul{list-style:none;margin:14px 0 0}
  li{position:relative;padding-left:34px;font-size:19px;line-height:1.5;margin-bottom:15px;
    color:var(--ink)}
  li:before{content:"";position:absolute;left:0;top:9px;width:14px;height:14px;
    background:var(--accent);border-radius:3px}
  .stage{display:flex;gap:20px;align-items:flex-start;margin-bottom:18px}
  .stage .num{font-family:'Montserrat',sans-serif;font-weight:800;font-size:30px;color:#fff;
    background:var(--accent);min-width:56px;height:56px;border-radius:12px;display:flex;
    align-items:center;justify-content:center}
  .stage .body h3{font-family:'Montserrat',sans-serif;font-size:22px;margin-bottom:4px}
  .stage .body p{margin:0;font-size:17px}
  .rulebar{height:4px;width:68px;background:var(--accent);border-radius:2px;margin-top:8px}
  .disclaimer{font-size:14px;color:#8a837a;margin-top:26px;max-width:70ch}
  .cta-note{font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;color:var(--ink);
    margin-top:10px}
  .num-slide{font-size:14px;color:#b7afa4;font-family:'Montserrat',sans-serif;margin-top:28px;
    letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'Free Live Masterclass', h1:'Become the #1 Listing Agent in Your Market',
   lead:'Even if nobody has ever heard of you yet.',
   p:'The 4-Stage Market Domination Plan that took an unknown immigrant and homeschooling mom of three to the top 1% of 1,600+ agents. Hosted live by Alina Schumacher.'},

  {t:'who', eyebrow:'Who this is for', h2:'You are a good agent. You are still invisible.',
   p:'You know the market. You work hard. But the listings keep going to the same few names everyone already knows, and you are left chasing buyer leads and praying for referrals.',
   lead:'The average North American agent sells about five homes a year. That is not a skill problem. It is a visibility and positioning problem.'},

  {t:'trap', eyebrow:'The trap', h2:'More hustle is not the answer.',
   p:'Most agents respond by cold calling harder, buying more buyer leads, and discounting their commission to compete. It burns you out and trains your market to see you as a commodity.',
   lead:'You do not need to shout louder. You need to become the obvious choice.'},

  {t:'cost', eyebrow:'The real cost', h2:'Every month invisible is listings handed to someone else.',
   p:'While you chase buyers, the listings in your area keep going to the three or four names sellers already recognize. Listings are the compounding asset in this business: they bring more buyers, more signs, more referrals, and more listings.',
   lead:'The gap between a five-homes-a-year agent and a market leader is rarely talent. It is who the market already trusts.'},

  {t:'twokinds', eyebrow:'Two kinds of agents', h2:'Chasers and the chosen.',
   p:'A chaser works outward: more calls, more leads, more follow-up, hoping volume makes up for anonymity. The chosen work on being known and trusted first, so the business comes to them.',
   lead:'This masterclass is about moving from the first group to the second, on purpose and on a plan.'},

  {t:'reframe', eyebrow:'The reframe', big:'Irrelevant.',
   h2:'Get so good at what you do that your competition becomes irrelevant.',
   p:'Domination is not about beating the other agents. It is about building a reputation and a system so strong that, in your market, there is really only one choice. This masterclass shows you exactly how that is built from zero.'},

  {t:'part', eyebrow:'Part One', h2:'The core problem: nobody can choose an agent they cannot see.',
   p:'Listings go to the agent the seller already trusts. When you are new or unknown, you have no trust bank to draw on, so you compete on price and luck.',
   p2:'The fix is not personality or a bigger ad budget. It is a repeatable plan for becoming known, trusted, and sought out, stage by stage.'},

  {t:'overview', eyebrow:'Part Two', h2:'The 4-Stage Market Domination Plan',
   p:'The same four stages I used to go from an immigrant with a language barrier and no network to the #1 local listing agent, and then taught inside the World-Class Agent Academy.'},

  {t:'stage', num:'1', h3:'Market-knowledge bootcamp', eyebrow:'Stage One',
   body:'Before you can dominate a market, you have to understand it better than anyone in it. You become the agent who can answer any question about the area, the inventory, and the numbers without hesitating.'},

  {t:'stage', num:'2', h3:'Branding that gets you noticed', eyebrow:'Stage Two',
   body:'You build a brand and a presence that makes homeowners recognize you before you ever meet. This is where an unknown agent starts becoming a familiar name, using DISC-based, personality-driven communication.'},

  {t:'stage', num:'3', h3:'The #1 Listing-Getting strategy', eyebrow:'Stage Three',
   body:'A direct, repeatable system for getting in front of homeowners, winning the CMA appointment, and taking the listing. This is the engine that turns visibility into signed listings month after month.'},

  {t:'cma', eyebrow:'Inside Stage Three', h2:'The listing is won before the appointment ends.',
   p:'Most agents treat the CMA as a price presentation. I teach it as the moment the seller decides you are the one competent, prepared person they have met. The preparation, the questions, and the way you handle objections are a system, not a personality trait.',
   lead:'Win the appointment on purpose and you stop competing on commission.'},

  {t:'stage', num:'4', h3:'Systems so it runs without burnout', eyebrow:'Stage Four',
   body:'You systematize the business, generate referrals on purpose, and build a team so growth does not cost you your life. Domination you cannot sustain is not domination.'},

  {t:'skills', eyebrow:'Underneath the plan', h2:'The 10 Skills of World-Class Agents',
   p:'Each stage is built on specific, teachable skills, not talent you are born with:',
   items:['Market mastery and pricing confidence','Branding and visibility as an unknown',
     'The CMA appointment that wins the listing','Personality-based (DISC) communication',
     'Homeowner outreach that actually gets answered','Referral generation on purpose',
     'Business systematization','Hiring and building a team','Protecting your time and energy',
     'Finishing what you start - "Driven to Finish"']},

  {t:'proof', eyebrow:'Why this works', h2:'This is not theory. It is the exact path I walked.',
   p:'I arrived in Canada from Germany with a language barrier and no sphere of influence. By my second full year I was the #1 local agent in my marketplace and in the top 1% of more than 1,600 agents on my board, a position I held for years and later earned ICON status at eXp.',
   lead:'If it worked starting from nothing, it can work for you starting from wherever you are now.'},

  {t:'ethos', eyebrow:'The one trait that decides it', h2:'Driven to Finish.',
   p:'Every agent I have mentored who dominated their market had this in common: they finished what they started. Most agents start a farming plan, a brand, a system, and quit three weeks in. The plan works when you work it all the way through, stage by stage.',
   lead:'This is why the fourth stage matters as much as the first. Momentum you abandon is worth nothing.'},

  {t:'picture', eyebrow:'The agent you become', h2:'An extra 3 to 4 deals a month, as the obvious choice.',
   p:'Imagine being the most competent and connected agent in your market. Sellers call you first. You win listings without discounting. And the business runs on systems instead of running you into the ground.',
   lead:'That is what the Market Domination Plan is built to produce.'},

  {t:'cta', eyebrow:'Your next step', h1:'Join me live.',
   p:'On the masterclass I will walk you through all four stages of the Market Domination Plan and the first moves to make this month, whatever market you are in.',
   note:'Register for the live masterclass with Alina Schumacher.',
   disclaimer:'This training is for educational purposes only. Results depend on your market, your effort, and many factors outside any program's control. Nothing here is a guarantee of income, listings, or specific results. Real estate is regulated differently by region; follow the rules of your own board and jurisdiction.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '';
  if(s.eyebrow) h += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.big) h += `<div class="big">${s.big}</div>`;
  if(s.h1) h += `<h1>${s.h1}</h1>`;
  if(s.h2) h += `<h2>${s.h2}</h2>`;
  if(s.t==='stage'){
    h += `<div class="stage"><div class="num">${s.num}</div><div class="body"><h3>${s.h3}</h3><p>${s.body}</p></div></div>`;
  }
  if(s.lead) h += `<p class="lead">${s.lead}</p>`;
  if(s.p) h += `<p>${s.p}</p>`;
  if(s.p2) h += `<p>${s.p2}</p>`;
  if(s.items){ h += '<ul>' + s.items.map(x=>`<li>${x}</li>`).join('') + '</ul>'; }
  if(s.note) h += `<div class="cta-note">${s.note}</div>`;
  if(s.t==='title'||s.t==='reframe') h += `<div class="rulebar"></div>`;
  if(s.disclaimer) h += `<div class="disclaimer">${s.disclaimer}</div>`;
  h += `<div class="num-slide">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
