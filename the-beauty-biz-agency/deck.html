<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price for Profit — A Masterclass with The Beauty Biz Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b1b1b; --panel:#232323; --rule:#3a3a3a;
    --accent:#8f6e6e; --ink:#f7f7f7; --body:#c7c2c2; --dim:#8a8480; --dark:#141414;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111111;font-family:'Cormorant Garamond',Georgia,serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.6%;background:var(--bg)}
  .slide.active{opacity:1}
  .kicker{font-family:'Quicksand',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  .kicker::before{content:'';display:inline-block;width:2.2vw;height:2px;background:var(--accent);vertical-align:middle;margin-right:.9vw;margin-bottom:.35vh}
  h1{font-family:'Quicksand',sans-serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:.002em}
  .t-title h1{font-size:6.6vw;max-width:82%;font-weight:700;line-height:1.02}
  .t-title h1 .hl{color:var(--accent)}
  .t-normal h1{font-size:3.4vw;max-width:90%;line-height:1.14}
  .t-normal .body{font-family:'Cormorant Garamond',serif;font-size:1.7vw;color:var(--body);margin-top:2.8vh;max-width:80%;line-height:1.5;font-weight:500}
  .t-normal .body b{color:var(--ink);font-weight:600}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.0vw;color:var(--body);margin-top:3.0vh;max-width:82%;line-height:1.36;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Quicksand',sans-serif;font-size:1.05vw;font-weight:600;color:var(--body);margin-bottom:1.8vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section .idx b{color:var(--accent)}
  .t-section h1{font-size:4.9vw;max-width:88%}
  .t-section .rule{width:15vw;height:4px;background:var(--accent);margin-top:3.2vh}
  .t-dark{background:var(--dark)}
  .t-dark h1{color:var(--ink);font-size:4.1vw;max-width:90%;font-weight:500}
  .t-dark h1 .hl{color:var(--accent)}
  .t-cta{background:var(--dark)}
  .t-cta h1{color:var(--ink);font-size:4.3vw;max-width:88%}
  .t-cta h1 .hl{color:var(--accent)}
  .t-cta .body{font-family:'Cormorant Garamond',serif;color:#d9d2d2;font-size:1.7vw;margin-top:2.6vh;max-width:76%;line-height:1.44;font-weight:500}
  .chips{display:flex;gap:1.2vw;margin-top:4.2vh;flex-wrap:wrap}
  .chip{border:1.4px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.2vh 1.9vw;font-size:1.15vw;font-weight:600;font-family:'Quicksand',sans-serif}
  .brandline{font-family:'Quicksand',sans-serif;font-size:1.08vw;color:var(--body);margin-top:4.0vh;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:700}
  /* profit-sliver motif: revenue is the full bar, profit is the thin mauve slice */
  .split{margin-top:4.2vh;width:52vw;max-width:70%}
  .split .track{height:2.6vh;background:#2f2b2b;border:1px solid var(--rule);border-radius:3px;display:flex;overflow:hidden}
  .split .track i{display:block;height:100%}
  .split .track i.rev{background:#3a3535;flex:1}
  .split .track i.pro{background:var(--accent);width:11%}
  .split .lbl{display:flex;justify-content:space-between;margin-top:1.3vh;font-family:'Quicksand',sans-serif;font-size:1.0vw;letter-spacing:.05em;color:var(--dim);text-transform:uppercase;font-weight:500}
  .split .lbl b{color:var(--accent);font-weight:700}
  /* benchmark ladder motif: four rungs, the top one hit */
  .rungs{display:flex;gap:.9vw;margin-top:4.2vh;align-items:flex-end;height:12vh}
  .rungs i{width:3.4vw;background:#2f2b2b;border:1px solid var(--rule);border-radius:2px 2px 0 0;display:block}
  .rungs i.hit{background:var(--accent);border-color:var(--accent)}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:5.0vh;font-family:'Quicksand',sans-serif;font-size:.82vw;color:var(--dim);line-height:1.5;max-width:84%;font-weight:400}
  .hud{position:fixed;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:7%;top:50%;transform:translateY(-50%);width:19vw;height:19vw;opacity:.9}
  .corner-mo{right:6%;bottom:8%;width:6.5vw;height:6.5vw;opacity:.42}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600;font-family:'Quicksand',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Quicksand',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s;font-family:'Quicksand',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.8vw}.t-title h1{font-size:12vw}.t-normal h1{font-size:7vw}.t-normal .body{font-size:3.8vw}
    .sub{font-size:4.4vw}.t-section h1{font-size:9vw}.t-dark h1{font-size:7.6vw}
    .t-cta h1{font-size:8.2vw}.chip{font-size:3vw}.t-cta .body{font-size:3.8vw}.disc{font-size:2vw}
    .split{width:80vw;max-width:84%}.split .lbl{font-size:2.6vw}.rungs i{width:9vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The Beauty Biz Agency</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a benchmark target, the profit ring closing on the mark -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <g fill="none" stroke-linecap="round">
    <circle cx="60" cy="60" r="46" stroke="#3a3a37" stroke-width="9"/>
    <path d="M60 14 a46 46 0 0 1 40 69" stroke="#8f6e6e" stroke-width="9" fill="none"/>
    <text x="60" y="56" text-anchor="middle" font-family="Quicksand,sans-serif" font-size="20" font-weight="700" fill="#f7f7f7" stroke="none">PROFIT</text>
    <text x="60" y="76" text-anchor="middle" font-family="Quicksand,sans-serif" font-size="10" letter-spacing="1" fill="#8a8480" stroke="none">ON PLAN</text>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Price for <span class="hl">Profit</span>.',sub:'The masterclass on running a commission salon by the numbers: the benchmarks, the commission structure, and the pricing that finally pay you as well as the team.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'The salon is busier than ever. So why is there nothing left at the end of the month?',body:'You are booked out. The team is full, the chairs are working, the revenue looks healthy on paper. And yet when the pay runs clear and the products are bought and the rent is paid, there is almost nothing left for you. It feels like the harder the salon works, the less the owner keeps. That is not a talent problem and it is not a busyness problem. It is a numbers problem hiding under a full column.'},
 {t:'dark',title:'You do not have a revenue problem. You have a <span class="hl">profit</span> problem, and it is built into your numbers.'},

 {t:'section',idx:'Part One',title:'Why More Revenue Is Not The Same As More Profit'},
 {t:'normal',k:'The number nobody runs',title:'Most commission owners have never worked out what a service actually earns them.',body:'Revenue is the number everyone watches. Profit is the number that pays the owner, and almost no salon owner can tell you theirs by service, by stylist, or by the month. So the commission split gets set by what feels fair, prices get raised by a few dollars when it gets scary, and the salon grows top line while the owner quietly funds the difference. A busy salon with no benchmarks is just a bigger version of the same leak.',split:true},
 {t:'normal',k:'Why hustle cannot fix it',title:'When the structure is wrong, more clients only makes the hole deeper.',body:'If a full column already leaves you thin, adding another stylist or another twenty clients a week does not rescue the month, it scales the problem. The commission you pay, the price you charge, and the targets you set either work together or they quietly fight each other. You cannot out hustle a compensation structure that was never built to leave the owner a profit. The owners who get paid are not the busiest. They are the ones whose numbers are set up to pay them.'},
 {t:'dark',title:'The commission structure you inherited was built to feel fair. It was never built to leave <span class="hl">you</span> a profit.'},

 {t:'section',idx:'Part Two',title:'The Performance Accelerator: A Commission Salon Run On Its Numbers'},
 {t:'normal',k:'The whole method in one line',title:'Set the benchmarks. Build the commission around them. Price so profit is on plan, not on luck.',body:'Profit in a commission salon is not a personality trait and it is not a good month. It is a structure you build on purpose, and it starts by telling yourself the truth about your numbers, then designing the commission, the targets, and the pricing so the owner is paid by design. Everything below is the system we take owners through, held together as one repeatable process you can adjust as the business and the world change.'},
 {t:'normal',k:'Pillar one, know your numbers',title:'You cannot price for profit while you are guessing at your costs.',body:'Start with the truth: your real profit by service, your product and wage cost as a share of every ticket, your average bill and how often clients return. Most owners have never calculated a single one of them. When you do, you can set a real benchmark for what each chair needs to produce, and you can finally see the money hiding in the gap between revenue and take home. This is the numbers discipline the whole system stands on.',rungs:true},
 {t:'normal',k:'Pillar two, the commission structure',title:'A commission structure should reward the team and protect the owner at the same time.',body:'Most splits pay out on revenue and ignore whether that revenue was ever profitable. We rebuild the structure around benchmarks, so a stylist earns more as they hit the numbers that actually make the salon money, and the owner is not left paying premium commission on services that lose money. Done right, the team is motivated by the same numbers that pay you, instead of by a split that quietly works against you.'},
 {t:'normal',k:'Pillar three, price for profit',title:'Your price is not what the salon down the road charges. It is what your numbers require.',body:'Pricing set by looking sideways at competitors is how owners end up busy and broke. We price from your real costs and your target profit, service by service, so every ticket carries the team, the overhead, and a margin for the owner. It is the single fastest lever most salons have, and almost none of them are pulling it on purpose. Price for profit, and the same column of clients starts paying you what it always should have.'},
 {t:'normal',k:'Pillar four, systems that hold',title:'A number you fix once and never track again drifts straight back to broke.',body:'The last piece is making it stick without you standing over it. Simple, repeatable systems, the benchmark reviews, the numbers everyone can see, the commission and pricing you revisit on a schedule instead of in a panic. That is what lets you step back from the chair and trust the salon to hold its profit, and it is what makes the whole thing adjustable when costs, staff, or the market shift underneath you.'},
 {t:'dark',title:'You cannot out work a broken structure. Fix the numbers, and the profit stops being a <span class="hl">surprise</span>.'},

 {t:'section',idx:'Part Three',title:'What Changes When The Numbers Are Built To Pay You'},
 {t:'normal',k:'The business this builds',title:'The same salon, the same team, the same column, and now it pays the owner too.',body:'Nothing about the work changes. The stylists still love their clients, the diary still fills. What changes is that the commission, the pricing, and the benchmarks now point in the same direction, so growth adds profit instead of leaking it. The owner can finally step off the floor without the profit walking out with them, and the business becomes something that runs to a standard and holds its margin. That is what growth was supposed to feel like.'},
 {t:'dark',title:'The goal was never a busier salon. It was a salon that <span class="hl">pays its owner</span>.'},
 {t:'normal',k:'Why Brie and Chandra',title:'Two owners who did this in their own salons before they taught it to anyone else.',body:'Brie Holt scaled her own salon from three hundred and fifty thousand dollars to over two and a half million, and her partner Chandra Chriswisser has spent more than twenty five years running a multi million dollar commission salon that no longer depends on her behind the chair. Between them they have more than forty five years in the industry. Everything in this masterclass is drawn from that real work with real commission salons, not from theory, and it is built to hand the owner their numbers and then step back.'},

 {t:'section',idx:'Your Next Step',title:'Build A Salon That Finally Pays You'},
 {t:'normal',k:'Keep going with The Beauty Biz Agency',title:'From knowing your real numbers to a commission salon that runs on profit, not luck.',body:'The Beauty Biz Agency coaches commission salon and spa owners through the whole system, the benchmarks, the commission structure, the pricing, and the habits that hold them, so the salon grows its profit and not just its revenue. Whether you start in the membership or work with Brie and Chandra directly, the goal is the same, a business built to pay its owner and then keep doing it without you standing over it.'},
 {t:'cta',title:'Ready to finally get <span class="hl">paid</span> for how busy you already are?',body:'Take the next step with Brie and Chandra at The Beauty Biz Agency.',chips:['Book a strategy call','Join the membership','Work with Brie and Chandra'],disc:'Educational content for salon and spa owners. No income or business result is guaranteed. Results vary by individual, salon, market, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.split) h+=`<div class="split"><div class="track"><i class="rev"></i><i class="pro"></i></div><div class="lbl"><span>Revenue, the number everyone watches</span><span><b>Profit</b>, the number that pays you</span></div></div>`;
    if(s.rungs) h+=`<div class="rungs">`+[5,7.5,10,13].map((hh,i)=>`<i class="${i===3?'hit':''}" style="height:${hh}vh"></i>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">The Beauty Biz <b>Agency</b> · Brie Holt and Chandra Chriswisser</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
