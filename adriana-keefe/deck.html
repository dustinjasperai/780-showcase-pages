<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Magnetic Rebellion - A Live Masterclass with Adriana Keefe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1216; --panel:#241a20; --rule:#5e4750; --accent:#9c6169;
    --ink:#f3e9ec; --muted:#c7b2b9;
    --head:'Cormorant Garamond',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{width:100vw;height:100vh;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;
    justify-content:center;padding:8vh 10vw;opacity:0;transition:opacity .4s}
  .slide.on{display:flex;opacity:1}
  .kicker{font-family:var(--body);font-size:.8rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--accent);margin-bottom:1.6rem}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(2.6rem,6.4vw,5.2rem);
    line-height:1.02;letter-spacing:.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(2rem,4.6vw,3.6rem);
    line-height:1.08}
  .lead{font-family:var(--head);font-style:italic;color:var(--muted);
    font-size:clamp(1.3rem,2.4vw,2rem);margin-top:1.4rem;max-width:30ch}
  p.body{font-size:clamp(1.05rem,1.5vw,1.35rem);line-height:1.5;color:var(--ink);
    margin-top:1.4rem;max-width:40ch}
  .section-num{font-family:var(--head);font-size:clamp(3rem,8vw,7rem);
    color:var(--rule);line-height:1}
  ul.pillars{list-style:none;margin-top:1.8rem;max-width:46ch}
  ul.pillars li{font-size:clamp(1rem,1.5vw,1.3rem);line-height:1.45;padding-left:1.4rem;
    position:relative;margin:.7rem 0;color:var(--ink)}
  ul.pillars li::before{content:"";position:absolute;left:0;top:.6em;width:.6rem;height:.6rem;
    background:var(--accent);border-radius:50%}
  .accent{color:var(--accent)}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
  .disc{font-size:.95rem;color:var(--muted);line-height:1.5;max-width:52ch;margin-top:1rem}
  .cta-step{font-family:var(--body);font-size:clamp(1.1rem,1.8vw,1.5rem);
    color:var(--ink);margin-top:1.6rem;border-left:3px solid var(--accent);padding-left:1.2rem}
  .nav{position:fixed;bottom:2.2vh;right:2.6vw;font-size:.8rem;color:var(--muted);
    letter-spacing:.1em;z-index:5}
  .progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
    transition:width .3s;z-index:5}
  .hint{position:fixed;bottom:2.2vh;left:2.6vw;font-size:.72rem;color:var(--rule);
    letter-spacing:.14em;text-transform:uppercase;z-index:5}
</style>
</head>
<body>
<div id="stage"></div>
<div class="progress" id="progress"></div>
<div class="nav" id="nav"></div>
<div class="hint">arrow keys or tap</div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Adriana Keefe',
   h:'The Magnetic Rebellion',
   lead:'How to embody your Human Design, not just learn it.'},

  {t:'content', kicker:'The promise',
   h:'Where power meets pleasure.',
   body:'In the next hour you will see why your chart never changed your life, and the body-first way to make it finally land.'},

  {t:'content', kicker:'Who this is for',
   h:'Successful on paper. Quietly disconnected underneath.',
   body:'You have done the work, read the books, and built the life. And some part of you still feels like you are performing someone else\'s.'},

  {t:'content', kicker:'The trap',
   h:'You know you are a Manifesting Generator. Nothing actually changed.',
   body:'You learned your Type, your Strategy, your Authority. It sits in your head as information. Your days still run the old way.'},

  {t:'content', kicker:'The reframe',
   h:'Human Design did not fail you.',
   lead:'You were taught to learn it with your mind. It only works when your body runs it.'},

  {t:'section', num:'One', h:'Why the chart never stuck'},

  {t:'content', kicker:'The not-self',
   h:'Years of overriding your own signals.',
   body:'To meet everyone else\'s expectations you learned to talk yourself out of your yes and into your no. Human Design has a name for that pattern. It is conditioning.'},

  {t:'content', kicker:'The cost',
   h:'Decisions from the head are expensive.',
   body:'They leak your energy, breed second-guessing, and end in the quiet burnout of a life that looks right and feels wrong.'},

  {t:'section', num:'Two', h:'The Energetic Soul Map'},

  {t:'content', kicker:'Pillar one',
   h:'Energetic Soul Mapping',
   body:'We read your chart as a map of exactly where you are living out of alignment, so the work is specific to you and not generic Human Design theory.'},

  {t:'content', kicker:'Pillar two',
   h:'Emotional Embodiment and Integration',
   body:'We fuse your design with Emotional Freedom Technique and nervous-system work, so the shift lands in your body instead of staying an idea you understand.'},

  {t:'content', kicker:'Pillar three',
   h:'Revive Your Sacral',
   body:'You relearn your body\'s yes and no. The sacral answers before the mind writes its list, and once you can feel it, decisions get fast and clean.'},

  {t:'content', kicker:'Pillar four',
   h:'The Rebirth Journey of De-Conditioning',
   body:'We shed the not-self you were trained into and return you to your actual design, one conditioned belief at a time.'},

  {t:'section', num:'Three', h:'What magnetic actually looks like'},

  {t:'content', kicker:'The shift',
   h:'You stop trying to be magnetic. You just stop leaking.',
   body:'Choices come faster. Energy stops draining into what was never yours. You become magnetic by being unmistakably yourself.'},

  {t:'content', kicker:'A practice you can feel now',
   h:'Ask out loud. Feel the answer.',
   body:'Say a real question you are sitting with out loud. Notice if your body opens or closes before your mind speaks. That flicker is the sacral. That is where we start.'},

  {t:'content', kicker:'Why me',
   h:'I teach No BS Human Design because I lived it.',
   body:'I came to this work transcending my own trauma, and I host the No BS Human Design Podcast and lead The Magnetic Rebellion community. This is not theory I read. It is the path I walked.'},

  {t:'content', kicker:'The map, in one line',
   h:'The chart is the map. Your body is the territory.',
   lead:'Learn it with your mind and it stays an idea. Embody it and it becomes your life.'},

  {t:'disclaimer', kicker:'Before we go',
   h:'A note.',
   disc:'This masterclass is educational. Nothing here is a promise of a specific outcome, and no result is guaranteed. Human Design is a tool for self-understanding, not medical, psychological, or financial advice. Results vary from woman to woman.'},

  {t:'cta', kicker:'Your next step',
   h:'Come home to yourself.',
   step:'Join The Magnetic Rebellion, or book a Sacred Connection call with me to explore private mentorship.',
   foot:'adrianakeefe.com'}
];

const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'; d.dataset.i=i;
  let html='';
  if(s.kicker) html+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='section'){
    html+=`<div class="section-num">${s.num}</div><h2>${s.h}</h2>`;
  } else if(s.t==='title'){
    html+=`<h1>${s.h}</h1>`;
    if(s.lead) html+=`<div class="lead">${s.lead}</div>`;
  } else if(s.t==='cta'){
    html+=`<h2>${s.h}</h2>`;
    if(s.step) html+=`<div class="cta-step">${s.step}</div>`;
    if(s.foot) html+=`<p class="body accent">${s.foot}</p>`;
  } else if(s.t==='disclaimer'){
    html+=`<h2>${s.h}</h2><div class="disc">${s.disc}</div>`;
  } else {
    html+=`<h2>${s.h}</h2>`;
    if(s.lead) html+=`<div class="lead">${s.lead}</div>`;
    if(s.body) html+=`<p class="body">${s.body}</p>`;
  }
  d.innerHTML=html;
  stage.appendChild(d);
});

let cur=0;
const slides=[...document.querySelectorAll('.slide')];
const nav=document.getElementById('nav');
const prog=document.getElementById('progress');
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach(s=>s.classList.remove('on'));
  slides[cur].classList.add('on');
  nav.textContent=`${cur+1} / ${slides.length}`;
  prog.style.width=`${((cur+1)/slides.length)*100}%`;
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') show(cur-1);
});
document.addEventListener('click',e=>{
  const x=e.clientX/window.innerWidth; show(x<0.3?cur-1:cur+1);
});
show(0);
</script>
</body>
</html>
