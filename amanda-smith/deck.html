<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You Can Sit With Us — a masterclass with Amanda Smith</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b14; --panel:#15162a; --rule:#2a2c45;
    --accent:#7c8aff; --ink:#ededf5; --muted:#b8b8c4;
    --head:'Sora',system-ui,sans-serif; --body:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;line-height:1.5}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .slide::after{content:attr(data-n) " / " attr(data-total);position:absolute;bottom:3.2vh;right:9vw;
    font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:400}
  .k{font-family:var(--head);font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    font-size:14px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:800;font-size:clamp(34px,6vw,76px);line-height:1.04;letter-spacing:-.02em}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(28px,4.6vw,56px);line-height:1.08;letter-spacing:-.01em}
  .sub{margin-top:26px;font-size:clamp(17px,2vw,24px);color:var(--muted);max-width:30ch;font-weight:300}
  .accent{color:var(--accent)}
  ul{list-style:none;margin-top:34px;display:grid;gap:18px;max-width:40ch}
  li{position:relative;padding-left:40px;font-size:clamp(17px,2vw,23px);color:var(--ink);font-weight:400}
  li::before{content:"";position:absolute;left:0;top:.6em;width:20px;height:2px;background:var(--accent)}
  .quote{font-family:var(--head);font-weight:700;font-size:clamp(28px,4.4vw,52px);line-height:1.15;max-width:22ch}
  .pill{display:inline-block;margin-top:30px;padding:12px 22px;border:1px solid var(--rule);
    border-radius:999px;color:var(--muted);font-size:15px;letter-spacing:.04em}
  .title-wrap h1{max-width:16ch}
  .part h2{color:var(--accent)}
  .disc{margin-top:40px;font-size:13px;color:var(--muted);max-width:52ch;line-height:1.6;font-weight:400}
  .dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);display:grid;
    place-items:center;color:var(--accent);font-family:var(--head);font-weight:700;margin-bottom:24px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title-wrap', k:"A live masterclass with Amanda Smith",
    h:"You Can Sit With Us", sub:"How to build a business on a community that actually buys."},

  {t:'big', h:"A bigger audience is not a business.",
    sub:"If reach paid the bills, every influencer would be rich. Most of them are not."},

  {t:'list', k:"Who this room is for", h:"The woman building something real",
    list:["You have an audience, or you are building one","You are tired of selling harder every single launch","You want customers who stay, refer, and come back"]},

  {t:'list', k:"The myth", h:"What the feed keeps telling women to do",
    list:["Post every single day","Chase whatever the algorithm wants this week","Launch a little louder than you did last time"]},

  {t:'big', h:"The trap is chasing reach.",
    sub:"More posts, more followers, more noise, and still no way to predict next month's revenue."},

  {t:'big', h:"You do not have a marketing problem. You have a belonging problem.",
    sub:"People do not buy from accounts. They buy from rooms they feel part of."},

  {t:'part', cls:'part', k:"Part one", h:"Why community beats reach"},

  {t:'list', h:"What a real community does that an audience cannot",
    list:["It refers: members bring members","It retains: belonging is stickier than any piece of content","It compounds: the room gets more valuable every month"]},

  {t:'part', cls:'part', k:"Part two", h:"The Momentum method",
    sub:"The three pillars I use with the women inside Dallas Girl Gang."},

  {t:'pillar', k:"Pillar one", h:"Clarity",
    sub:"A growth plan you can actually see, so you stop guessing what to do next."},

  {t:'pillar', k:"Pillar two", h:"Courage",
    sub:"Sell by gathering, not by shouting. Make the ask without the ick."},

  {t:'pillar', k:"Pillar three", h:"Connection",
    sub:"A room that holds you accountable and sends you clients while you sleep."},

  {t:'part', cls:'part', k:"Part three", h:"Turning a community into revenue"},

  {t:'list', h:"The community-to-revenue model",
    list:["Memberships: recurring income from the room itself","Events: gatherings people happily pay to be in","Partnerships: brands pay to reach the community you built"]},

  {t:'big', h:"From a free group to 50,000 women.",
    sub:"I started Dallas Girl Gang with 600 dollars and zero strategy. The community came first. The business followed."},

  {t:'quote', quote:"“You can sit with us” was never a tagline. It was the whole strategy."},

  {t:'list', k:"Why listen to me", h:"Amanda Smith",
    list:["Founder and CEO of Dallas Girl Gang, 50,000+ women","Host of The Girl Gang Podcast","Built six figures on memberships, events, and partnerships"]},

  {t:'list', h:"What you will leave with today",
    list:["The one shift from audience to community","The three pillars to grow with less hustle","The first partnership you could pitch this month"]},

  {t:'big', h:"Start with one room, not one more post.",
    sub:"You do not need a bigger audience. You need a place people want to stay."},

  {t:'cta', cls:'cta', k:"Your next step", h:"Come build with us",
    sub:"Join The Momentum Network, or apply for 1:1 consulting to map your own community-to-revenue plan.",
    disc:"No income, role, or result is guaranteed. Results vary and depend on your own effort, market, and execution. This masterclass is educational and not financial or business advice."}
];

const deck = document.getElementById('deck');
const total = S.length;
S.forEach((s, i) => {
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  sec.setAttribute('data-n', i + 1);
  sec.setAttribute('data-total', total);
  let html = '';
  if (s.k) html += '<div class="k">' + s.k + '</div>';
  if (s.t === 'pillar') html += '<div class="dot">' + (i) + '</div>';
  if (s.t === 'quote') {
    html += '<div class="quote">' + s.quote + '</div>';
  } else if (s.t === 'title') {
    html += '<h1>' + s.h + '</h1>';
  } else {
    html += '<h2>' + (s.h || '') + '</h2>';
  }
  if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  if (s.list) {
    html += '<ul>';
    s.list.forEach(x => { html += '<li>' + x + '</li>'; });
    html += '</ul>';
  }
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  sec.innerHTML = html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
