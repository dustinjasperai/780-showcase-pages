<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earn The Right: a live masterclass with Trevor Young</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f3;        /* warm paper, from brand.json light scheme */
    --panel:#ffffff;
    --rule:#e4ddd4;
    --ink:#2a2a2a;       /* from brand #474747, deepened */
    --muted:#6b645c;
    --accent:#fd493e;    /* brand dominant hex, verbatim */
    --display:'Archivo',system-ui,sans-serif;
    --body:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .flag{display:inline-block;width:46px;height:6px;background:var(--accent);border-radius:3px;margin-bottom:22px}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:16px}
  h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.04;letter-spacing:-.02em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.01em;margin-bottom:16px}
  .lead{font-size:21px;color:var(--ink)}
  .sub{font-size:19px;color:var(--muted);margin-top:10px}
  .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.08;letter-spacing:-.01em}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;padding:12px 0 12px 26px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:21px;width:14px;height:5px;background:var(--accent);border-radius:3px}
  .num{font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase}
  .e-word{font-family:var(--display);font-weight:800;color:var(--accent)}
  .foot{font-size:14px;color:var(--muted);margin-top:26px;border-top:1px solid var(--rule);padding-top:16px}
  .cta-line{font-size:22px;margin-top:8px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;line-height:1.45}
  .slideno{font-family:var(--display);font-size:12px;color:#b9b0a5;text-align:right;margin-top:18px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'Live masterclass',h:'Earn The Right',lead:'How under-known experts become the obvious choice in their field.',sub:'A live session with Trevor Young, The PR Warrior.'},
  {t:'promise',eyebrow:'What you will walk away with',h:'A plan to be known for what you are already good at.',bullets:['Why the market keeps choosing the best-known, not the best-qualified','The four moves that turn quiet expertise into trusted authority','A simple content engine you own, instead of renting reach on one platform','A 90-day way to start, without becoming a full-time content creator']},
  {t:'who',eyebrow:'Who this is for',h:'You are great at the work. Not enough people know it.',lead:'Founders, expert professionals and solo practice owners who have earned real credibility, and watch louder, less-qualified voices get the opportunities.'},
  {t:'trap',eyebrow:'The trap',h:'Getting better and waiting to be noticed.',lead:'The quiet promise most experts make themselves: do excellent work, keep your head down, and recognition will follow.',sub:'It rarely does. Quality is assumed. Reputation is what gets you in the room.'},
  {t:'reframe',eyebrow:'The hard truth',h:'The best-qualified person rarely wins. The best-known one does.',lead:'In a noisy, low-trust market, reputation is the real currency. It is an asset you can build on purpose, or leave to chance.'},
  {t:'part',num:'Part one',h:'The reputation gap.'},
  {t:'body',eyebrow:'The core problem',h:'The market cannot choose what it cannot see.',lead:'Your expertise is invisible until it is visible, credible and easy to find. Talent with no reputation behind it stays a well-kept secret.'},
  {t:'body',eyebrow:'The wrong fix',h:'Chasing followers is not building authority.',lead:'Vanity metrics feel like progress and buy you almost nothing. Being visible is not the same as being trusted.',sub:'The goal is not a bigger audience. It is a stronger reputation with the right people.'},
  {t:'part',num:'Part two',h:'The method: the four E&#39;s.'},
  {t:'e',num:'E1',word:'Establish',h:'Establish your voice.',lead:'Decide what you want to be known for, and claim a clear point of view the market can actually repeat back.'},
  {t:'e',num:'E2',word:'Enhance',h:'Enhance your credibility.',lead:'Back the voice with proof: the ideas, stories and earned attention that make people trust you before they ever meet you.'},
  {t:'e',num:'E3',word:'Extend',h:'Extend your reach.',lead:'Put that voice in front of new audiences through owned, earned and social media working together, not one lucky post.'},
  {t:'e',num:'E4',word:'Extract',h:'Extract the opportunities.',lead:'Turn the reputation you build into the inbound: the speaking, the clients, the partnerships and the premium work that find you.'},
  {t:'body',eyebrow:'The engine',h:'Owned, earned and social, working as one.',lead:'This is the micro-domination idea: a content ecosystem you control, amplified by earned attention and social reach, compounding month after month instead of resetting with every algorithm.'},
  {t:'part',num:'Part three',h:'Reputation, built on purpose.'},
  {t:'body',eyebrow:'Your first 90 days',h:'Start small, build the asset.',bullets:['Weeks 1 to 2: name the point of view you want to own','Weeks 3 to 6: build the credibility content behind it','Weeks 7 to 10: extend it through earned and social channels','Weeks 11 to 12: turn the attention into conversations that matter']},
  {t:'why',eyebrow:'Why listen to me',h:'I am Trevor Young, The PR Warrior.',lead:'A career PR and communications strategist. Author of microDOMINATION (Wiley) and Content Marketing for PR, host of the Reputation Revolution podcast, and twice named among the global 50 Marketing Thought Leaders Over 50.',sub:'I help credible experts build authority the PR way: earned, not bought.'},
  {t:'recap',eyebrow:'The whole method on one slide',h:'Establish. Enhance. Extend. Extract.',lead:'Four moves that turn quiet expertise into a reputation that opens doors.'},
  {t:'cta',eyebrow:'Your next step',h:'Ready to earn the right?',ctaline:'If you want help building this for your own expertise, book a call with me and we will map your reputation plan together.',disclaimer:'This masterclass is educational. It shares a method and a point of view, not a promise. Results vary by person, market and effort, and nothing here is a guarantee of income, opportunities or outcomes.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let html='<span class="flag"></span>';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.num) html+='<div class="num">'+s.num+'</div>';
  if(s.t==='title'){html+='<h1>'+s.h+'</h1>';}
  else if(s.t==='part'){html+='<h1>'+s.h+'</h1>';}
  else if(s.t==='reframe'){html+='<h2 class="big">'+s.h+'</h2>';}
  else if(s.t==='e'){html+='<h2><span class="e-word">'+s.word+'.</span></h2><div class="lead">'+s.lead+'</div>';}
  else {html+='<h2>'+s.h+'</h2>';}
  if(s.lead && s.t!=='e') html+='<div class="lead">'+s.lead+'</div>';
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul>';}
  if(s.ctaline) html+='<div class="cta-line">'+s.ctaline+'</div>';
  if(s.disclaimer) html+='<div class="disclaimer">'+s.disclaimer+'</div>';
  html+='<div class="slideno">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;deck.appendChild(d);
});
</script>
</body>
</html>
