<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Discovery Conversation · Russ Bourque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f1e8; --panel:#ece6d6; --rule:#c9c5b8;
    --ink:#061229; --gold:#9a7d34; --brass:#dcbb6b; --slate:#3a4256; --dim:#8b8778;
  }
  html,body{height:100%}
  body{background:#0b0d12;font-family:'Lato',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0d12}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .42s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.8%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Lato',sans-serif;font-size:1vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:2.4vh}
  h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.15;letter-spacing:-.008em}
  .t-title h1{font-size:4.8vw}
  .t-normal h1{font-size:3.2vw;max-width:86%}
  .t-normal .body{font-size:1.48vw;color:var(--slate);margin-top:2.6vh;max-width:74%;line-height:1.6;font-weight:400}
  .sub{font-size:1.82vw;color:var(--slate);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Lato',sans-serif;font-size:1.3vw;font-weight:700;color:var(--gold);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:18vw;height:3px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:3.4vh}
  .t-dark{background:var(--ink);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:88%;color:#F7F3E9;font-weight:400;font-style:italic}
  .t-cta{background:var(--ink);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:82%;color:#F7F3E9}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--brass);color:var(--brass);border-radius:2px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:700;letter-spacing:.04em}
  .disc{position:absolute;left:8.8%;right:8.8%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-cta .disc{color:#9C9483}
  .t-title .disc,.t-normal .disc{text-align:left}
  .waterline{position:absolute;pointer-events:none;opacity:.95}
  .title-waterline{right:7%;bottom:9%;width:25vw}
  .corner-waterline{right:6%;bottom:7%;width:10vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--slate);margin-top:3.4vh;font-weight:400;letter-spacing:.03em}
  .brandline b{color:var(--gold);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#7d7a6d;z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Lato',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7d7a6d;z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#7d7a6d;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.8vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">Swimming in Sales</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- the surface line and what sits under it -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="waterline" viewBox="0 0 280 120">
  <g fill="none" stroke-linecap="round">
    <path d="M12 44 C52 30 92 58 132 44 C172 30 212 58 268 44" stroke="#9a7d34" stroke-width="2.6"/>
    <path d="M12 62 C52 48 92 76 132 62 C172 48 212 76 268 62" stroke="#9a7d34" stroke-width="1.6" opacity="0.42"/>
    <path d="M12 80 C52 66 92 94 132 80 C172 66 212 94 268 80" stroke="#061229" stroke-width="1.2" opacity="0.16"/>
    <circle cx="268" cy="44" r="4" fill="none" stroke="#dcbb6b" stroke-width="2.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Discovery Conversation',sub:'How pools actually get sold, long before anyone says a number.',brand:true,waterline:'title'},
 {t:'normal',k:'Who this is for',title:'You know the product. You still lost that one.',body:'The appointment felt good. They liked you. Then the quote went out and the thread went quiet, and you never found out what they were really deciding between. That is not a price problem.'},
 {t:'dark',title:'They had already decided. You just never learned what they decided about.'},

 {t:'section',idx:'Part One',title:'Why The Quote Loses'},
 {t:'normal',k:'The modern buyer',title:'They arrived knowing more than the last generation of buyers ever did.',body:'They watched twenty videos before you pulled into the driveway. If your appointment is an information delivery, you are repeating what they already have, and the only new thing in the room becomes your price.'},
 {t:'normal',k:'Two people, one backyard',title:'You are selling to a disagreement.',body:'One of them wants the pool. The other is doing the math. If you only sell to the one who is excited, the quiet one kills it later and you never hear the real reason.'},
 {t:'normal',k:'The number said too early',title:'Say a number before they have a picture and you become a comparison.',body:'A price with no scope attached is a number to shop. The moment it leaves your mouth with nothing built around it, you have handed them a reason to call the next builder.'},
 {t:'dark',title:'A price without context is just a reason to shop you.'},

 {t:'section',idx:'Part Two',title:'The Discovery Conversation'},
 {t:'normal',k:'Open on the summer',title:'Ask about the summer they want, not the pool they want.',body:'Who is in the water. How old the kids are. Whether this is for parties or for six in the morning alone. Every one of those answers is a specification, and they will tell you all of it if you stop selling for ten minutes.'},
 {t:'normal',k:'Find the second voice',title:'Sell to the one who is not talking.',body:'The quiet one has the objection that decides this. Get it out loud in the backyard, where you can answer it, instead of in a kitchen conversation you will never be part of.'},
 {t:'normal',k:'Product knowledge as a sales asset',title:'What you know about the product is a closing tool, not homework.',body:'A buyer who has already researched can tell within two minutes whether you actually know equipment, finishes, and what goes wrong in year seven. That is the moment they stop shopping and start relying on you.'},
 {t:'normal',k:'Present with authority',title:'Present the build you heard them describe, in their words.',body:'Authority is not volume. It is showing them their own summer, priced with the scope attached, so the number arrives as a consequence of the picture instead of as a shock.'},
 {t:'normal',k:'Handle the objection',title:'Most objections are just questions you did not answer yet.',body:'Price, timing, the neighbour who had a bad experience. Each one is information. Answer the objection you actually created, and close by asking, plainly, with confidence.'},
 {t:'dark',title:'Discovery is not the small talk before the sale. It is the sale.'},

 {t:'section',idx:'Part Three',title:'The Career, Not The Month'},
 {t:'normal',k:'Disciplined follow-up',title:'The follow-up is where most of the year is hiding.',body:'Pools are a long decision. The rep who follows up on a schedule, with something useful each time, wins jobs that the rep with a better appointment already gave up on.'},
 {t:'normal',k:'Build a referral engine',title:'Every finished pool is a backyard full of your next appointments.',body:'A pool is the most visible purchase a family makes. Handled deliberately, one build feeds the next two, and your calendar stops depending on whatever leads the company hands you.'},
 {t:'normal',k:'Why listen to me',title:'I am still in the showroom.',body:'Twenty-six years selling pools and over $40 million in career sales volume, and I am still selling this season. Everything here was written by someone who ran the appointment this month, not by a sales trainer who found the pool industry.'},
 {t:'dark',title:'This is a career. Treat it like one and it pays like one.'},

 {t:'section',idx:'Your next step',title:'Train. Sell. Dominate.'},
 {t:'normal',k:'How the training works',title:'Twelve modules, then ninety days of holding you to it.',body:'Swimming in Sales runs in three phases. Foundation is the industry, the product, and the modern buyer. Execution is qualification, presentation, objections, and closing. Mastery is the referral engine, your reputation, and the disciplines that compound. The Rescue Squad is 90 days of live group coaching for people already out there selling.'},
 {t:'cta',title:'Ready to sell pools like a professional?',chips:['Get the 7 Secrets guide','Start the curriculum','Join The Rescue Squad'],disc:'Educational content for pool sales professionals and pool companies. No income, commission, or sales result is guaranteed. Results vary by person, company, market, and season.'},
];

const deck=document.getElementById('deck');
function waterline(kind){return `<svg class="waterline ${kind==='title'?'title-waterline':'corner-waterline'}"><use href="#waterline"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Swimming in Sales &middot; <b>Russ Bourque</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.waterline) h+=waterline(s.waterline);
  else if(s.t==='title') h+=waterline('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
