<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Listening Leader — a masterclass with Kym Dakin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf7; --panel:#eef4f4; --rule:#d8e3e3; --ink:#1f2a2b;
    --muted:#55656a; --accent:#0297a6; --gold:#f8ac2d;
    --display:'Epilogue',sans-serif; --text:'Barlow',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--text);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:54px 52px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:20px;right:26px;font-size:12px;color:var(--muted);
    letter-spacing:.12em}
  .kicker{font-family:var(--display);font-weight:600;color:var(--accent);
    letter-spacing:.16em;text-transform:uppercase;font-size:13px;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:48px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.14;
    margin-bottom:16px}
  p{font-size:19px;color:var(--ink);max-width:62ch}
  p.lead{font-size:22px}
  p.muted{color:var(--muted)}
  .horizon{height:2px;width:120px;background:var(--accent);margin:22px 0;border:0}
  .big{font-size:60px;font-weight:700;font-family:var(--display);line-height:1.05;
    letter-spacing:-.02em}
  .strike{text-decoration:line-through;color:var(--muted);text-decoration-thickness:3px}
  .on{color:var(--accent)}
  ul{list-style:none;margin:18px 0 0}
  li{font-size:19px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);
    position:relative}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;
    border-radius:3px;background:var(--accent)}
  .lenses{display:flex;gap:16px;margin-top:24px;flex-wrap:wrap}
  .lens{flex:1;min-width:200px;background:var(--panel);border-radius:12px;padding:22px 20px}
  .lens .h{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);
    margin-bottom:8px}
  .lens.gold .h{color:#b9791a}
  .tag{display:inline-block;background:var(--panel);color:var(--muted);font-size:13px;
    padding:6px 12px;border-radius:999px;margin-top:20px}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:70ch}
  .cta h1{font-size:44px}
  .cta .step{font-family:var(--display);font-weight:600;font-size:22px;color:var(--accent);
    margin-top:12px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kicker">A live masterclass with Kym Dakin</div>
    <h1>The Listening Leader</h1>
    <hr class="horizon">
    <p class="lead">How Head, Heart &amp; Hands listening builds a team that finally owns the work, so you get the space to vision, create, and breathe.</p>
  `},
  {t:'who', cls:'', html:`
    <div class="kicker">Who this is for</div>
    <h2>Your team is good. You still can't put it down.</h2>
    <p>You lead people you trust. And somehow every decision still routes back through you, every deliverable still gets your second pass, and the week fills before it starts.</p>
    <p class="muted" style="margin-top:14px">If that's you, this hour is for you.</p>
  `},
  {t:'reframe', cls:'', html:`
    <div class="kicker">The reframe</div>
    <h2>You don't have a delegation problem.</h2>
    <p class="big" style="margin-top:8px">You have a <span class="on">listening</span> problem.</p>
    <p style="margin-top:20px">Teams don't take ownership when they don't feel fully heard. The fix isn't managing harder. It's listening on more than one level.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="kicker">Part one</div>
    <h1>The over-functioning trap</h1>
    <hr class="horizon">
    <p>Why capable leaders quietly become the bottleneck, and why trying harder makes it worse.</p>
  `},
  {t:'problem', cls:'', html:`
    <h2>"Just delegate" keeps failing</h2>
    <p>You hand it off. It comes back not-quite-right. You fix it yourself, because that's faster. Your team learns to check with you first. Now you own all of it again.</p>
    <ul>
      <li>They bring you questions, not decisions</li>
      <li>You redo the work instead of growing the person</li>
      <li>The quiet voice says it's easier to just do it yourself</li>
    </ul>
  `},
  {t:'part', cls:'', html:`
    <div class="kicker">Part two</div>
    <h1>Head, Heart &amp; Hands</h1>
    <hr class="horizon">
    <p>The listening model from the award-winning book. Most leaders default to one lens. Accountable teams are built on all three.</p>
  `},
  {t:'pillars', cls:'', html:`
    <h2>Three ways we listen</h2>
    <div class="lenses">
      <div class="lens"><div class="h">Head</div><p>Hear the information accurately, not just the words you expected to hear.</p></div>
      <div class="lens"><div class="h">Heart</div><p>Hear what the person actually means, and what they feel but haven't said.</p></div>
      <div class="lens gold"><div class="h">Hands</div><p>Hear what they need to do next, so the conversation ends in ownership.</p></div>
    </div>
  `},
  {t:'pillar', cls:'', html:`
    <div class="kicker">Lens one</div>
    <h2>Head: listen for the real information</h2>
    <p>Most leaders listen to confirm what they already decided. Head listening slows that reflex down: you take in the whole message before you reach for the answer, so your team stops editing themselves to fit your expectation.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="kicker">Lens two</div>
    <h2>Heart: listen for what they mean</h2>
    <p>Under every status update is a person deciding how safe it is to be honest with you. Heart listening is how you hear the hesitation, the stuck point, the thing they're testing before they say it out loud. That's where trust and ownership start.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="kicker">Lens three</div>
    <h2>Hands: listen toward the next move</h2>
    <p>A conversation that ends in agreement but no action was never finished. Hands listening lands every exchange on a clear owned next step, held by them, not quietly absorbed back onto your plate.</p>
  `},
  {t:'cost', cls:'', html:`
    <h2>The cost of one-lens listening</h2>
    <p>Lead on Head alone and you get compliance, not ownership. Lead on Heart alone and nothing ships. Skip to Hands and people feel managed, not heard.</p>
    <p class="muted" style="margin-top:14px">The over-functioning leader is usually a brilliant one-lens listener. The spacious one listens on all three on purpose.</p>
  `},
  {t:'silence', cls:'', html:`
    <div class="kicker">The underrated tool</div>
    <h2>Strategic sound and silence</h2>
    <p>Listening isn't passive. The deliberate pause, the slower pace, the question you don't rush to fill, these are how you make room for a team to step into. The leaders who talk least often hold the most authority in the room.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="kicker">Part three</div>
    <h1>The Spacious Leader</h1>
    <hr class="horizon">
    <p>When the listening becomes a system, the team starts carrying the weight with you.</p>
  `},
  {t:'levers', cls:'', html:`
    <h2>Three shifts, in order</h2>
    <ul>
      <li><b>Build an accountable team:</b> three-lens listening turns hand-offs into owned outcomes</li>
      <li><b>Quiet the inner impostor:</b> the self-doubt that makes you redo their work, named and managed</li>
      <li><b>Reignite the fire that drew you to lead:</b> the part of the job you actually came for</li>
    </ul>
    <p class="muted" style="margin-top:16px">Less anxiety. Real ownership from your team. Space to vision, create, and breathe.</p>
  `},
  {t:'week', cls:'', html:`
    <h2>What a spacious week feels like</h2>
    <p>Fewer decisions routed to you. Meetings that end in owned actions instead of open loops. A team that brings you choices, not questions. And an evening that's actually yours, because the 11pm approval thread finally went quiet.</p>
  `},
  {t:'credibility', cls:'', html:`
    <div class="kicker">Why learn this from me</div>
    <h2>Kym Dakin</h2>
    <p>Author of the award-winning <i>Head, Heart, and Hands Listening</i> (Routledge, 2023 North American Book Award), used at the Olympia Snowe Women's Leadership Institute. I train physicians in productive listening at Tufts and Kaiser Permanente, and I've spent thirty years using voice, theatre, and sound to help people actually hear each other.</p>
    <span class="tag">M.Ed. · Certified coach · Audie Award narrator</span>
  `},
  {t:'recap', cls:'', html:`
    <h2>What you take with you</h2>
    <ul>
      <li>Your default listening lens, named, and the two you skip</li>
      <li>The three-lens habit that turns hand-offs into ownership</li>
      <li>The first Spacious Leader shift to make this week</li>
    </ul>
  `},
  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next step</div>
    <h1>Stop <span class="strike">managing</span> harder.<br>Start <span class="on">listening</span> on purpose.</h1>
    <p>If you want help turning this into how your team actually runs, that's what The Spacious Leader coaching is for.</p>
    <div class="step">Book a Spacious Leader conversation at kymdakin.com</div>
    <p class="disc">Educational session only. No income, role, outcome, or result is guaranteed; results vary with your context and effort. Shared to teach the method, not to promise a specific result.</p>
  `}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls||'');
  el.innerHTML = '<span class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</span>' + s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
