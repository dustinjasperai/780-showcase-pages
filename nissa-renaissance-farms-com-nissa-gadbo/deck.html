<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design the Homestead You Already Have — a permaculture masterclass with Nissa Gadbois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f0e6;      /* warm paper ground */
    --panel:#fbf8f1;   /* lighter card */
    --ink:#2f3a2c;     /* deep bark / forest */
    --accent:#6e5c97;  /* lavender, her signature crop */
    --green:#586b45;   /* herb green */
    --rule:#d9d2bf;    /* muted rule */
    --dim:#6d6a5c;     /* muted text */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Karla',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 7vw;position:relative;border-bottom:1px solid var(--rule)}
  .kick{font-size:.82rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:1.4rem}
  h1{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.05;letter-spacing:-.01em}
  h2{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.1}
  h2 .a,h1 .a{color:var(--accent);font-style:italic}
  p.lead{font-size:clamp(1.15rem,2.2vw,1.5rem);line-height:1.5;color:var(--dim);margin-top:1.5rem;max-width:40ch}
  p.body{font-size:clamp(1.05rem,1.8vw,1.28rem);line-height:1.6;margin-top:1.2rem;max-width:46ch}
  .sub{font-family:'Spectral',serif;font-style:italic;color:var(--green);font-size:clamp(1.1rem,2vw,1.5rem);margin-top:1.4rem}
  ul{margin-top:1.6rem;list-style:none;max-width:44ch}
  li{font-size:clamp(1.02rem,1.7vw,1.24rem);line-height:1.5;padding-left:1.7rem;position:relative;margin-bottom:1rem}
  li::before{content:'';position:absolute;left:0;top:.55em;width:.7rem;height:.7rem;border:2px solid var(--accent);border-radius:50% 50% 50% 0;transform:rotate(45deg)}
  .divider{background:var(--ink);color:var(--bg);text-align:center;align-items:center}
  .divider .kick{color:#c9bfe0}
  .divider h2{color:var(--bg);max-width:20ch}
  .divider .part{font-family:'Spectral',serif;font-size:5rem;color:var(--accent);opacity:.55;font-weight:600}
  .pillar{border-left:4px solid var(--accent);padding-left:2rem}
  .num{position:absolute;top:6vh;right:7vw;font-family:'Spectral',serif;font-size:.95rem;color:var(--dim);letter-spacing:.1em}
  .paths{display:flex;gap:2rem;flex-wrap:wrap;margin-top:2rem}
  .path{flex:1;min-width:240px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:1.8rem 1.7rem}
  .path h3{font-family:'Spectral',serif;font-size:1.4rem;margin-bottom:.7rem}
  .path.hi{border-color:var(--accent);box-shadow:0 14px 40px rgba(110,92,151,.14)}
  .path p{color:var(--dim);font-size:1.05rem;line-height:1.5}
  .cta{background:var(--panel)}
  .cta .box{background:var(--ink);color:var(--bg);border-radius:18px;padding:clamp(2rem,4vw,3.2rem);max-width:34ch}
  .cta h2{color:var(--bg)}
  .cta .step{display:inline-block;margin-top:1.6rem;background:var(--accent);color:#fff;font-weight:700;padding:.85rem 1.6rem;border-radius:100px;font-size:1.05rem}
  .disc{font-size:.86rem;color:var(--dim);margin-top:2rem;max-width:52ch;line-height:1.5}
  .sprig{margin-top:2.2rem}
  .foot{position:absolute;bottom:5vh;left:7vw;font-family:'Spectral',serif;font-style:italic;color:var(--dim);font-size:.95rem}
  .prog{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:9}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div class="deck" id="deck"></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <g id="lav"><path d="M20 60 V22" stroke="#6e5c97" stroke-width="2.4" fill="none"/><g fill="#6e5c97"><circle cx="20" cy="18" r="3.2"/><circle cx="14" cy="24" r="3"/><circle cx="26" cy="24" r="3"/><circle cx="15" cy="32" r="2.8"/><circle cx="25" cy="32" r="2.8"/></g><path d="M20 46 C12 44 10 38 9 34 M20 50 C28 48 30 42 31 38" stroke="#586b45" stroke-width="2" fill="none"/></g>
</defs></svg>
<script>
const S = [
  {t:'title', kick:'A permaculture masterclass · Renaissance Farms',
   h:'Design the Homestead <span class="a">You Already Have</span>',
   sub:'How to turn your land, or your ordinary yard, into a self-reliant homestead that works with nature instead of against it.',
   foot:'With Nissa Gadbois · Barre, Massachusetts'},

  {t:'promise', kick:'What this hour is for',
   h:'You do not need more acres. You need a design.',
   body:'By the end of this masterclass you will see your own land the way a permaculture designer does, and you will know the order to build in so each piece feeds the next.'},

  {t:'who', kick:'Who this is for',
   h:'For the person who is <span class="a">done collecting pieces.</span>',
   body:'You have raised beds, maybe chickens, a shelf of homesteading books. You want food, medicine, and a home that mostly runs itself. This is for you, whether you have a suburban lot or a hundred acres.'},

  {t:'trap', kick:'The trap',
   h:'More projects is not more self-reliance.',
   body:'Most people homestead by addition. A garden here, a coop there, a rain barrel because someone said so. Each project is fine on its own. Together they fight each other, and they wear you out.'},

  {t:'reframe', kick:'The reframe', class:'divider',
   part:'',
   h:'The problem was never your effort. It is that nothing was <span class="a">designed to work together.</span>'},

  {t:'divider', class:'divider', part:'I',
   kick:'Part one', h:'Why hard work on the wrong layout stalls'},

  {t:'problem', kick:'The core problem',
   h:'A homestead is a system, not a to-do list.',
   body:'When elements are placed at random, you carry water uphill, you walk too far to the things you use daily, and waste from one part becomes a chore instead of a gift to another. The land is not the limit. The layout is.'},

  {t:'problem2', kick:'What it costs you',
   h:'The three quiet leaks',
   list:['Time: steps and chores that a better layout would have deleted.','Water: rain that runs off your site instead of soaking into it.','Energy: fighting your slope, your sun, and your soil instead of using them.']},

  {t:'divider', class:'divider', part:'II',
   kick:'Part two', h:'The method: whole-system permaculture design'},

  {t:'pillar', kick:'Pillar one', class:'pillar',
   h:'Read the land first.',
   body:'Before you plant anything, you map how sun, water, wind, and your own daily paths already move across the site. Zones and sectors. You observe for a season so the design fits the land you actually have.'},

  {t:'pillar', kick:'Pillar two', class:'pillar',
   h:'Water is the <span class="a">first design decision.</span>',
   body:'Slow it, spread it, sink it. Where water goes decides where everything else can live. Get this layer right and half of your future problems never appear.'},

  {t:'pillar', kick:'Pillar three', class:'pillar',
   h:'Make every element earn its keep.',
   body:'Stack functions. A hedge is a windbreak, a food crop, and habitat. A pond waters, cools, and feeds. When each piece does three jobs, the whole system needs less of you.'},

  {t:'pillar', kick:'Pillar four', class:'pillar',
   h:'Retrofit what you already own.',
   body:'You do not start over. We take the home and yard in front of you and redesign it layer by layer, so an ordinary property becomes a working homestead without a move or a fortune.'},

  {t:'pillar', kick:'Pillar five', class:'pillar',
   h:'Grow your own apothecary.',
   body:'Medicinal and culinary herbs are a designed layer of the homestead, not a separate hobby. The right herbs in the right zone give you food, medicine, and pollinators from the same ground.'},

  {t:'pillar', kick:'Pillar six', class:'pillar',
   h:'Keep the old skills alive.',
   body:'Heritage breeds, heirloom seed, preserving, fiber, the folk skills that make a homestead truly self-reliant. Design gives them a place to live on your land, and you learn them by doing.'},

  {t:'divider', class:'divider', part:'III',
   kick:'Part three', h:'What a designed homestead actually feels like'},

  {t:'looks', kick:'A year on a designed homestead',
   h:'Less running. More harvest.',
   list:['Water arrives where it is needed without a hose in your hand.','The things you use daily are steps from the door, not across the property.','Each season hands off to the next, so the work spreads out instead of piling up.']},

  {t:'why', kick:'Why learn this here',
   h:'Taught from a real working farm.',
   body:'Nissa Gadbois completed her permaculture training at Oregon State University and her herbal training through the Chestnut School of Herbal Medicine. Renaissance Farms is a 286 acre working demonstration farm in Barre, Massachusetts, so what you learn has been designed, built, and lived.'},

  {t:'paths', kick:'Two ways forward',
   h:'You already know how this goes.',
   paths:[
     {h:'Keep adding pieces', p:'Another bed, another book, another spring of hard work on a layout that fights you. It can work. It is just slower and heavier than it needs to be.'},
     {h:'Design the whole', p:'Learn to read your land once, build in the right order, and let the system carry more of the load every year.', hi:true}
   ]},

  {t:'cta', class:'cta', kick:'Where to begin',
   h:'Learn to design your own homestead.',
   step:'Join the next Permaculture Design Certification at Renaissance Farms',
   body:'The full method, taught hands-on and in accessible formats, including a night-school schedule for people who work. Start with a FarmSchool course if you want a smaller first step.',
   disc:'This masterclass is educational. No specific yield, income, or result is guaranteed. Results vary with your land, climate, season, and the effort you put in.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.class || '');
  let inner = '';
  if (s.part !== undefined && s.class === 'divider') inner += `<div class="part">${s.part}</div>`;
  if (s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if (s.h) inner += (s.t === 'title') ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`;
  if (s.sub) inner += `<div class="sub">${s.sub}</div>`;
  if (s.lead) inner += `<p class="lead">${s.lead}</p>`;
  if (s.body && s.t !== 'cta') inner += `<p class="body">${s.body}</p>`;
  if (s.list) inner += '<ul>' + s.list.map(x => `<li>${x}</li>`).join('') + '</ul>';
  if (s.paths) inner += '<div class="paths">' + s.paths.map(p => `<div class="path ${p.hi ? 'hi' : ''}"><h3>${p.h}</h3><p>${p.p}</p></div>`).join('') + '</div>';
  if (s.t === 'cta') {
    inner += `<div class="box"><h2>${s.h}</h2><p class="body" style="color:#d9d2c4">${s.body}</p><span class="step">${s.step}</span></div>`;
    inner += `<p class="disc">${s.disc}</p>`;
    inner = `<div class="kick">${s.kick}</div>` + inner.replace(/^<div class="kick">.*?<\/div>/, '');
  }
  if (s.t === 'title') inner += `<svg class="sprig" width="44" height="70" viewBox="0 0 40 70"><use href="#lav"/></svg>`;
  if (s.foot) inner += `<div class="foot">${s.foot}</div>`;
  if (s.t !== 'title' && s.class !== 'divider') inner += `<div class="num">${String(i + 1).padStart(2, '0')} / ${String(S.length).padStart(2, '0')}</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
const prog = document.getElementById('prog');
addEventListener('scroll', () => {
  const h = document.documentElement;
  prog.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
});
</script>
</body>
</html>
