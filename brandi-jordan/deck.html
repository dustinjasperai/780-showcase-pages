<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Branded Birthworker Method - A Masterclass with Brandi Jordan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f7f1;        /* her dominant ivory */
    --panel:#f1ede1;     /* her beige button fill */
    --ink:#38342a;       /* her dominant text color */
    --muted:#a89f88;     /* her sand/greige */
    --accent:#6b5e42;    /* her deepest bronze-olive, the single accent */
    --display:'Cinzel', serif;
    --body:'Cormorant Garamond', serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.5}
  .deck{max-width:960px;margin:0 auto}
  .slide{
    min-height:92vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 7vw;border-bottom:1px solid rgba(107,94,66,.16);position:relative;
  }
  .eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--accent);margin-bottom:28px}
  h1{font-family:var(--display);font-weight:600;font-size:46px;line-height:1.14;letter-spacing:.01em;margin-bottom:22px}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.18;margin-bottom:20px}
  .lead{font-size:27px;line-height:1.42;color:var(--ink)}
  .sub{font-size:23px;color:#5a523f;max-width:40ch}
  p{font-size:22px;margin-bottom:16px;max-width:46ch}
  .hair{width:64px;height:2px;background:var(--accent);margin:0 0 30px}
  ul{list-style:none;margin-top:10px}
  li{font-size:22px;padding:13px 0;border-bottom:1px solid rgba(107,94,66,.14);max-width:52ch}
  li b{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--accent);display:block;margin-bottom:4px;text-transform:uppercase}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:38px;margin-top:14px}
  .card{background:var(--panel);border:1px solid rgba(107,94,66,.18);padding:30px 28px}
  .card h3{font-family:var(--display);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
  .card p{font-size:20px;max-width:none}
  .big{font-family:var(--display);font-size:60px;color:var(--accent);line-height:1;margin-bottom:18px}
  .pagenum{position:absolute;bottom:26px;right:7vw;font-family:var(--display);font-size:12px;letter-spacing:.2em;color:var(--muted)}
  .part{font-family:var(--display);font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .cta .lead{max-width:34ch}
  .disclaimer{margin-top:34px;font-size:15px;line-height:1.5;color:#7a7161;max-width:62ch;font-style:italic}
  .brandline{font-family:var(--display);letter-spacing:.24em;text-transform:uppercase;font-size:13px;color:var(--muted);margin-top:40px}
  @media (max-width:680px){
    h1{font-size:34px}.two{grid-template-columns:1fr}.slide{padding:7vh 8vw}.lead{font-size:23px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A Live Masterclass with Brandi Jordan',
    h1:'The Branded Birthworker Method',
    lead:'How doulas, newborn care specialists, lactation pros and sleep consultants build a premium, soul-led brand that brings high-caliber clients to them, instead of chasing every booking.' },

  {t:'audience',
    eyebrow:'Who this is for',
    h2:'You are already good at the work.',
    sub:'This is for the birth worker who is booked, respected, and quietly exhausted. Doulas, NCS, lactation consultants, sleep consultants, nannies. You do not need another certification. You need to be seen and paid like the expert you already are.' },

  {t:'trap',
    eyebrow:'The trap',
    h2:'The field trains you to be affordable and available.',
    body:['From your first training, the message is the same: keep your rates gentle, say yes to everyone, and hope the referrals keep coming.',
          'So you cap yourself at hourly work and word of mouth, and your income rises and falls with other people remembering to mention your name.'] },

  {t:'reframe',
    eyebrow:'The real problem',
    h2:'You do not have a pricing-nerve problem.',
    lead:'You have a positioning problem. The market cannot tell you apart from every other "doula for everyone," so it shops you on price and availability. Change the position, and the price objection quietly disappears.' },

  {t:'part', part:'Part One', h2:'The Hyper-Niching Framework' },

  {t:'content',
    eyebrow:'Hyper-niching',
    h2:'Become the only logical choice.',
    body:['A generalist competes with everyone and gets chosen on price. A hyper-niched birth worker competes with almost no one and gets chosen on fit.',
          'You pick one narrow niche you are genuinely built for, and you become the obvious hire for the families who need exactly that. Narrower market, higher price, easier yes.'] },

  {t:'twocol',
    eyebrow:'The shift',
    h2:'Generalist vs. the obvious choice',
    cards:[
      { h:'The generalist', p:'"I support all families through birth and postpartum." Compared on price. Competes with everyone in the city.' },
      { h:'The hyper-niche', p:'"I am the one people come to for this specific family, this specific need." Compared on fit. Priced as the specialist.' } ] },

  {t:'part', part:'Part Two', h2:'Luxury Brand Positioning and The Expert Framework' },

  {t:'content',
    eyebrow:'Luxury brand positioning',
    h2:'Build a brand clients come to.',
    body:['Premium clients do not respond to cold outreach and discount energy. They respond to a brand that looks and feels like the level of care they want.',
          'Luxury positioning is not louder marketing. It is a calmer, more deliberate brand that signals expertise, so the right families arrive already wanting to work with you.'] },

  {t:'content',
    eyebrow:'The Expert Framework',
    h2:'Be seen as the go-to voice.',
    body:['There is a difference between being one of many skilled birth workers and being the name your niche already trusts.',
          'The Expert Framework is how you build that authority on purpose: the few things you say, show, and stand for consistently, until you are the obvious expert in your corner of the field.'] },

  {t:'part', part:'Part Three', h2:'The $10K Client Formula and The Visibility Framework' },

  {t:'twocol',
    eyebrow:'The $10K Client Formula',
    h2:'Stop trading time for money.',
    cards:[
      { h:'Where you are', p:'Hourly 1:1 work, priced to stay booked, income you cannot predict from month to month.' },
      { h:'Where this goes', p:'Signature packaged offers, premium pricing that holds, and consistent high-ticket months by design.' } ] },

  {t:'content',
    eyebrow:'The Visibility Framework',
    h2:'Attract, instead of chase.',
    body:['Chasing is cold DMs, constant posting, and hoping someone refers you. It is exhausting and it does not compound.',
          'The Visibility Framework is strategic, repeatable visibility that works while you sleep, so high-caliber clients find you already warm, rather than you hunting for the next one.'] },

  {t:'content',
    eyebrow:'Growth Guide Coaching',
    h2:'A plan that adjusts to you.',
    body:['Frameworks only matter if they meet your real business. Growth Guide Coaching is the monthly, personalized growth-report mechanic that keeps the method pointed at your next move.',
          'You are never guessing what to work on. You are working the one thing that moves your brand forward this month.'] },

  {t:'content',
    eyebrow:'The branded birthworker, in practice',
    h2:'The premium, soul-led practice.',
    body:['Fewer clients, paid well. A niche you are known for. A calendar you control, and rest built in rather than apologized for.',
          'This is the whole point of branding yourself: the business finally fits the life you got into this work to live.'] },

  {t:'twocol',
    eyebrow:'Why me',
    h2:'I built this inside the field.',
    cards:[
      { h:'The work', p:'Founder of The Cradle Company, host of the Dear Doula podcast, founder of the National Association of Birth Workers of Color. IBCLC, Pediatric Sleep Specialist, Newborn Care Specialist, Postpartum Doula.' },
      { h:'The brand', p:'I built a multi-six-figure brand inside one of the lowest-paid corners of family care, and the Branded Birthworker Method is how I now teach birth workers to do the same.' } ] },

  {t:'content',
    eyebrow:'The method, in one view',
    h2:'Six pieces, one premium brand.',
    body:['Hyper-niching for the only-logical-choice position. Luxury positioning and the Expert Framework for authority. The $10K Client Formula and the Visibility Framework for the money and the reach.',
          'Together they move you from affordable-and-available to sought-after and soul-led.'] },

  {t:'cta',
    eyebrow:'Your next step',
    h1:'Ready to become the Branded Birthworker in your city?',
    lead:'The Branded Birthworker program is the 12 months of coaching and curriculum where we build all of this into your business, together.',
    note:'Educational content only. No income, revenue, or client-results are promised or guaranteed. Individual outcomes vary based on your niche, effort, and market.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t === 'cta' ? 'cta' : s.t);
  let html = '';
  if (s.eyebrow) html += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.t === 'part') {
    html = `<div class="part">${s.part}</div><div class="hair"></div><h1>${s.h2}</h1>`;
  } else {
    if (s.h1) html += `<h1>${s.h1}</h1>`;
    if (s.h2) html += `<h2>${s.h2}</h2>`;
    html += `<div class="hair"></div>`;
    if (s.lead) html += `<p class="lead">${s.lead}</p>`;
    if (s.sub) html += `<p class="sub">${s.sub}</p>`;
    if (s.body) s.body.forEach(p => html += `<p>${p}</p>`);
    if (s.cards) {
      html += `<div class="two">`;
      s.cards.forEach(c => html += `<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`);
      html += `</div>`;
    }
    if (s.note) html += `<div class="disclaimer">${s.note}</div><div class="brandline">Branded Birthworker &middot; Brandi Jordan</div>`;
  }
  html += `<div class="pagenum">${String(i + 1).padStart(2, '0')} / ${String(S.length).padStart(2, '0')}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
