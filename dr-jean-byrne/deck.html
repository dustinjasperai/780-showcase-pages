<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>How to Teach Yoga That Holds Up | The Yoga Space Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#faf8f3; --panel:#e9f2ed; --ink:#2b2b2b; --ink-soft:#54585a;
    --rule:#dcdcd2; --accent:#f29100;
  }
  html,body{height:100%;}
  body{
    font-family:'Libre Franklin',-apple-system,sans-serif;
    background:var(--ink); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .deck{width:100vw;height:100vh;position:relative;background:var(--bg);}
  .slide{
    position:absolute;inset:0;opacity:0;visibility:hidden;
    transition:opacity .4s ease;
    display:flex;flex-direction:column;justify-content:center;
    padding:7vh 9vw;
  }
  .slide.on{opacity:1;visibility:visible;}
  .eyebrow{font-size:0.78rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);margin-bottom:1.6rem;}
  h1{font-family:'Lora',Georgia,serif;font-weight:600;font-size:clamp(2rem,5.2vw,4rem);line-height:1.1;color:var(--ink);letter-spacing:-0.01em;}
  h2{font-family:'Lora',Georgia,serif;font-weight:600;font-size:clamp(1.6rem,3.8vw,2.8rem);line-height:1.15;color:var(--ink);margin-bottom:1.4rem;}
  p{font-size:clamp(1.05rem,1.8vw,1.45rem);line-height:1.6;color:var(--ink-soft);max-width:48ch;margin-bottom:1rem;}
  .lead{font-size:clamp(1.2rem,2.3vw,1.7rem);color:var(--ink);max-width:46ch;}
  .sub{font-size:clamp(1rem,1.7vw,1.3rem);color:var(--ink-soft);max-width:44ch;margin-top:1.4rem;}
  ul{list-style:none;margin-top:1rem;max-width:50ch;}
  li{font-size:clamp(1rem,1.7vw,1.35rem);line-height:1.5;color:var(--ink-soft);padding-left:1.6rem;position:relative;margin-bottom:0.9rem;}
  li::before{content:"";position:absolute;left:0;top:0.6em;width:0.6rem;height:0.6rem;background:var(--accent);border-radius:50%;}
  .part{font-family:'Lora',Georgia,serif;font-size:clamp(2.4rem,6vw,4.4rem);color:var(--ink);font-weight:600;}
  .part .num{display:block;font-size:0.9rem;font-family:'Libre Franklin',sans-serif;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:1.2rem;}
  .panel{background:var(--panel);border-left:4px solid var(--accent);padding:1.6rem 1.8rem;border-radius:4px;max-width:52ch;margin-top:1rem;}
  .panel p{margin:0;color:var(--ink);}
  .reframe h1{max-width:20ch;}
  .reframe .accent{color:var(--accent);}
  .cta h1{max-width:24ch;}
  .disclaimer{font-size:0.8rem;color:var(--ink-soft);margin-top:2.4rem;max-width:50ch;line-height:1.5;}
  .who{font-size:clamp(1.05rem,1.8vw,1.4rem);color:var(--ink);font-family:'Lora',serif;}
  .credit{margin-top:2rem;font-size:0.95rem;color:var(--ink-soft);}
  .nav{position:fixed;bottom:18px;right:24px;font-size:0.8rem;color:var(--ink-soft);font-weight:500;letter-spacing:0.05em;z-index:10;}
  .progress{position:fixed;bottom:0;left:0;height:3px;background:var(--accent);transition:width .3s ease;z-index:10;}
  .hint{position:fixed;bottom:18px;left:24px;font-size:0.75rem;color:var(--ink-soft);z-index:10;}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="progress" id="progress"></div>
<div class="nav" id="nav"></div>
<div class="hint">Use arrow keys or click to advance</div>
<script>
const S=[
 {t:'title',eyebrow:'The Yoga Space · Perth &amp; Online',h:'How to Teach Yoga That Holds Up',sub:'The science and the apprenticeship behind a teacher people actually trust.',credit:'A masterclass with Dr Jean Byrne (PhD) and Dr Rob Sch&uuml;tze (PhD)'},
 {t:'lead',eyebrow:'The promise',lead:'By the end of the next hour you will know exactly what separates a teacher people trust from someone who just holds a certificate, and what it takes to become the first kind.'},
 {t:'who',eyebrow:'Who this is for',h:'This is for you if',list:['You love yoga and you want to teach it for real','You are newly certified, or about to train, and quietly unsure you are ready','You want depth and credibility, not a fast-track certificate you have to apologise for']},
 {t:'lead',eyebrow:'The trap',lead:'Most teacher trainings hand you a manual, a weekend or two, and a certificate. Then you stand in front of a real class, with real bodies and real histories, and realise nobody actually taught you to hold the room.'},
 {t:'reframe',eyebrow:'The reframe',h:'The poses were never the job. <span class="accent">Holding the room</span> is the job.',sub:'Anyone can learn the shapes from a video. Teaching a nervous, injured, grieving human safely is a craft, and a craft is learned by apprenticeship, not by download.'},
 {t:'part',num:'Part One',part:'Why most certificates fail the teacher'},
 {t:'std',eyebrow:'The real problem',h:'A certificate is not a competence',list:['Cookie-cutter curricula teach one sequence for every body','Little or no mentoring, so mistakes go uncorrected','Almost no real teaching hours before you are turned loose','No framework for safety when someone brings trauma to the mat']},
 {t:'std',eyebrow:'The cost',h:'What that gap costs you',lead:'You freeze. You teach defensively. You avoid the students who need you most. And you spend years rebuilding the confidence a proper training would have given you from the start.'},
 {t:'part',num:'Part Two',part:'The method: apprenticeship meets evidence'},
 {t:'std',eyebrow:'Pillar 1',h:'Old-school apprenticeship',lead:'You are mentored, not processed. Self-directed study, group mentoring, and one-to-one mentoring with experienced teachers, over twelve months, so your teaching is corrected and shaped as it grows.'},
 {t:'std',eyebrow:'Pillar 2',h:'Person-centred, not cookie-cutter',lead:'You learn to teach the human in front of you, adapting to their body, history and context, instead of running one fixed sequence at everyone and hoping it fits.'},
 {t:'std',eyebrow:'Pillar 3',h:'Grounded in real evidence',lead:'The practices you learn are drawn from our own clinical trials of yoga for mental health, run through Curtin and Murdoch Universities. You will be able to explain not just what to teach, but why it works.'},
 {t:'std',eyebrow:'Pillar 4',h:'Real teaching, in the real world',list:['Supervised teaching placements, not role-play','Experience in demanding settings: prisons, domestic-violence shelters, aged care','You graduate having actually taught, in front of real people']},
 {t:'std',eyebrow:'Pillar 5',h:'A nervous-system lens',lead:'You learn to teach trauma-informed, polyvagal-aware yoga, so your classes regulate the nervous system and stay safe for the people who carry the most.'},
 {t:'part',num:'Part Three',part:'What a trusted teacher looks like'},
 {t:'std',eyebrow:'The path',h:'Twelve months, mostly from home',lead:'The training begins online and is built for regional, interstate or overseas students, with just one in-person week at our West Perth school. You earn your 200-hour letter midway, so you can start teaching before you finish.'},
 {t:'std',eyebrow:'Why learn it here',h:'Who is teaching you',list:['Dr Jean Byrne: 27 years of study, Research Fellow at Curtin, Yoga Australia Council of Advisors','Dr Rob Sch&uuml;tze: senior clinical psychologist and Research Fellow at Curtin','Perth&rsquo;s longest-running Ashtanga program, teaching since 2004']},
 {t:'lead',eyebrow:'The outcome',lead:'You walk out able to hold any room: confident, credible, and able to explain the why behind every practice. A teacher people trust, and come back to.'},
 {t:'cta',eyebrow:'Your next step',h:'Enquire about the next 350-hour intake',sub:'The 350-hour Yoga Australia Level 1 teacher training at The Yoga Space. Apprenticeship-style, evidence-based, mostly online. Speak with Jean about whether it is the right fit for you.',disclaimer:'This masterclass is educational. It is not a guarantee of income, employment, or any specific outcome. Yoga teaching results depend on your own practice, effort and circumstances.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(i===0?' on':'')+(s.t==='reframe'?' reframe':'')+(s.t==='cta'?' cta':'');
  let html='';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){html+='<h1>'+s.h+'</h1><p class="sub">'+s.sub+'</p><div class="credit">'+s.credit+'</div>';}
  else if(s.t==='lead'){html+='<p class="lead">'+s.lead+'</p>';}
  else if(s.t==='part'){html+='<div class="part"><span class="num">'+s.num+'</span>'+s.part+'</div>';}
  else if(s.t==='reframe'){html+='<h1>'+s.h+'</h1><p class="sub">'+s.sub+'</p>';}
  else if(s.t==='who'){html+='<h2>'+s.h+'</h2><ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  else if(s.t==='cta'){html+='<h1>'+s.h+'</h1><p class="sub">'+s.sub+'</p><div class="disclaimer">'+s.disclaimer+'</div>';}
  else {html+='<h2>'+s.h+'</h2>';if(s.lead)html+='<p class="lead">'+s.lead+'</p>';if(s.list)html+='<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  d.innerHTML=html;
  deck.appendChild(d);
});
let cur=0;const slides=document.querySelectorAll('.slide');
const nav=document.getElementById('nav');const prog=document.getElementById('progress');
function show(n){slides[cur].classList.remove('on');cur=Math.max(0,Math.min(slides.length-1,n));slides[cur].classList.add('on');nav.textContent=(cur+1)+' / '+slides.length;prog.style.width=((cur+1)/slides.length*100)+'%';}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);else if(e.key==='ArrowLeft')show(cur-1);});
document.addEventListener('click',e=>{show(cur+(e.clientX<window.innerWidth*0.3?-1:1));});
show(0);
</script>
</body>
</html>
