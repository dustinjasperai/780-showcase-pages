<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Executive Ceiling - A Live Masterclass with Tom Cox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f9fd; --panel:#ffffff; --rule:#dfe7ec;
    --ink:#0a3a52; --muted:#5a7183; --accent:#057bb5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(10,58,82,.03)}
  .slide.dark{background:var(--ink);color:#eaf4fb;border-color:#0a3a52}
  .slide.dark .k,.slide.dark .muted{color:#9ec6dd}
  .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;line-height:1.04;
    font-size:54px;letter-spacing:-.01em}
  h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;line-height:1.08;
    font-size:40px;letter-spacing:-.01em}
  p{font-size:20px;line-height:1.55;color:var(--ink);margin-top:20px;max-width:46ch}
  .slide.dark p{color:#dbeaf4}
  .muted{color:var(--muted)}
  .lead{font-size:23px}
  .big{font-size:60px}
  ul{margin:26px 0 0 0;padding:0;list-style:none}
  li{font-size:20px;line-height:1.5;padding:14px 0 14px 30px;position:relative;border-top:1px solid var(--rule)}
  .slide.dark li{border-top-color:#17465f}
  li:before{content:"";position:absolute;left:0;top:23px;width:12px;height:2px;background:var(--accent)}
  .climb{display:flex;flex-direction:column;gap:2px;margin-top:24px}
  .step{display:flex;align-items:baseline;gap:16px;padding:14px 18px;border-left:3px solid var(--rule)}
  .step .lv{font-family:"DM Serif Display",serif;font-size:24px;min-width:150px;color:var(--accent)}
  .step.on{border-left-color:var(--accent);background:rgba(5,123,181,.05)}
  .eq{font-family:"DM Serif Display",serif;font-size:40px;margin-top:10px;line-height:1.2}
  .eq .x{color:var(--accent)}
  .pg{font-size:13px;color:var(--muted);text-align:right;margin-top:26px;letter-spacing:.04em}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;margin-top:26px;max-width:60ch}
  .accent{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', cls:'', html:`
    <div class="k">A live masterclass with Tom Cox · Vertical Motion</div>
    <h1>The Executive Ceiling</h1>
    <p class="lead">Why being great at your job stops getting you promoted, and the three shifts that move you to VP and the C-suite.</p>
    <p class="muted">For mid-career leaders who keep delivering and keep getting passed over.</p>
  `},
  {t:'who', cls:'', html:`
    <div class="k">Who this is for</div>
    <h2>You are very good at what you do. That stopped being enough.</h2>
    <p>You have ten, fifteen, twenty years in. You are the person colleagues come to for answers. And somewhere around director, the promotions slowed down or stopped.</p>
    <p class="muted">You were told you are "not quite executive-ready yet," and nobody explained what that means.</p>
  `},
  {t:'trap', cls:'', html:`
    <div class="k">The trap</div>
    <h2>So you do the three things that feel right, and none of them work.</h2>
    <ul>
      <li>You work harder and take on more, and become too valuable to move.</li>
      <li>You wait to be noticed, assuming good work speaks for itself.</li>
      <li>You polish the resume and the LinkedIn, and treat a leadership problem like a marketing one.</li>
    </ul>
  `},
  {t:'hook', cls:'dark', html:`
    <div class="k">The hard truth</div>
    <h2>The skills that got you here are not the skills that get you promoted out of here.</h2>
    <p>Above director, nobody gets the seat for doing more or better work. They get it for something else entirely. Most people never find out what.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="k">Part one</div>
    <h1>The mismatch</h1>
    <p class="muted">Why your hardest effort is the wrong lever now.</p>
  `},
  {t:'content', cls:'', html:`
    <div class="k">The core problem</div>
    <h2>You are solving the wrong gap.</h2>
    <p>Early on, the gap between you and the next level was competence. So you closed it with effort, and it worked every time.</p>
    <p>The gap to VP is not competence. It is evidence: whether the people who decide can see you operating at that level already. Effort does not close that gap. It can even hide it.</p>
  `},
  {t:'contrast', cls:'', html:`
    <div class="k">Two different games</div>
    <h2>What got you here vs. what gets you up.</h2>
    <ul>
      <li>Here: be the most reliable, most capable person in the room.</li>
      <li>Up: be the person they trust to decide when nobody has the answer.</li>
      <li>Here: deliver the plan. Up: be the reason there is a plan.</li>
    </ul>
    <p class="muted">You are still playing the first game brilliantly. The seat is scored on the second.</p>
  `},
  {t:'content', cls:'', html:`
    <div class="k">What the panel actually reads</div>
    <h2>Three things, in this order.</h2>
    <ul>
      <li>How you show up in the room, before you say anything.</li>
      <li>How you actually operate, the judgment behind your calls.</li>
      <li>Who already vouches for you when you are not in the room.</li>
    </ul>
    <p class="muted">None of these is on your performance review. All of them decide the promotion.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="k">Part two</div>
    <h1>The three shifts</h1>
    <p class="muted">The framework I used to land five executive roles, and that has moved hundreds of mid-career leaders into Director, VP, and C-suite seats.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="k">Shift one</div>
    <h2>Executive Presence</h2>
    <p>How decision-makers experience you as a leader, before a word is spoken. This is not about being louder. It is about closing the gap between how you work and what the next level is actually paying for.</p>
    <p class="muted">We name that gap precisely, using your own leadership data, not a personality label.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="k">Shift two</div>
    <h2>Executive Style</h2>
    <p>Your operating method as a leader: how you make the call, run the room, and carry judgment when the answer is not obvious. Competence is table stakes at this level. Trusted judgment is the currency.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="k">Shift three</div>
    <h2>Executive Network</h2>
    <p>Executive opportunities do not move through applications. They move through sponsors, people with a seat at the table who will say your name when it counts. Most leaders build this by accident and far too late.</p>
    <p class="muted">We make it deliberate.</p>
  `},
  {t:'method', cls:'dark', html:`
    <div class="k">The method underneath all three</div>
    <div class="eq">Analytics <span class="x">+</span> Intuition <span class="x">=</span> Clarity</div>
    <p>We read your behavioral data, the Leadership Drivers and Natural Aptitudes assessment, alongside seasoned executive judgment. First you find yourself clearly. Then you decide the next move. Clarity comes before strategy, never after.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="k">Part three</div>
    <h1>What the climb looks like</h1>
  `},
  {t:'climb', cls:'', html:`
    <div class="k">One test at each level</div>
    <h2>It was never about working harder.</h2>
    <div class="climb">
      <div class="step"><span class="lv">Manager</span><span>Can you own the outcome, not just the task.</span></div>
      <div class="step"><span class="lv">Director</span><span>Can you own outcomes you do not personally control.</span></div>
      <div class="step on"><span class="lv">VP</span><span>Do they trust your judgment with ambiguity and money.</span></div>
      <div class="step"><span class="lv">C-suite</span><span>Can you set the direction others organize around.</span></div>
    </div>
  `},
  {t:'content', cls:'', html:`
    <div class="k">What changes when you get this right</div>
    <h2>The move stops being luck.</h2>
    <ul>
      <li>You walk into the review already read as the next level.</li>
      <li>Your name comes up in rooms you are not in.</li>
      <li>You choose the next role instead of waiting to be chosen.</li>
    </ul>
  `},
  {t:'whyme', cls:'dark', html:`
    <div class="k">Why listen to me</div>
    <h2>I sat in the chair that makes the call.</h2>
    <p>I spent thirty years in aerospace and defense, fifteen of them in executive leadership, and closed about 1.5 billion dollars in business before I coached full time. I am a three-time CEO and an Army veteran, and I am the author of The Executive Career Handbook.</p>
    <p class="muted">I have made the promotion and hiring decisions your panel is making. I will show you the inside of that room.</p>
  `},
  {t:'cta', cls:'', html:`
    <div class="k">Your next step</div>
    <h1>Find out where you actually stand.</h1>
    <p>Start with the free LDNA assessment, about six minutes, to see your own leadership data. Then book a free forty-five minute strategy call. The call is for clarity. You cannot buy anything on it.</p>
    <p class="accent" style="font-weight:600">Take the LDNA, then book your call at vmleader.com.</p>
    <p class="disc">Educational content only. Nothing here is a promise of a promotion, a role, a salary, or any financial result. No income, role, or outcome is guaranteed. Results vary and depend on your own situation, effort, and circumstances.</p>
  `}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.cls||'');
  d.innerHTML=s.html+'<div class="pg">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(d);
});
</script>
</body>
</html>
