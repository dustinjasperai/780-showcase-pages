<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Successful, and Still Searching - a masterclass with Marisa Mann</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f2341;      /* deep brand navy ground (her H2 + footer color) */
    --panel:#15294a;   /* lighter navy panel */
    --rule:#f7f5f21f;  /* cream at low alpha for hairlines */
    --ink:#f7f5f2;     /* warm cream text (her H1 is cream-on-navy) */
    --muted:#a9b4c6;   /* light navy-gray for secondary text */
    --accent:#f1d7a8;  /* soft gold (brand button color) */
    --pop:#e84c7d;     /* rose focal, used sparingly */
    --head:"Petrona",Georgia,serif;
    --body:"Mulish",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#091831;color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:64px 64px;margin:0 0 26px;min-height:540px;position:relative;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 1px 0 #f7f5f21a inset, 0 14px 34px #00000030;
  }
  .num{position:absolute;top:26px;right:30px;font-size:12px;letter-spacing:.18em;
    color:var(--muted);font-weight:600}
  .kick{font-size:13px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--pop);font-weight:700;margin-bottom:20px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.06;
    letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.1;
    letter-spacing:-.01em;margin-bottom:18px}
  .lead{font-size:21px;line-height:1.5;color:var(--muted);max-width:40ch;margin-top:22px}
  p{font-size:19px;line-height:1.6;max-width:56ch;margin-top:14px}
  .big{font-family:var(--head);font-size:46px;line-height:1.12;font-weight:600;
    letter-spacing:-.01em;max-width:24ch}
  .big .g{color:var(--pop)}
  .sect h1{font-size:60px}
  .sect .bar{width:72px;height:6px;background:var(--accent);border-radius:3px;margin:28px 0 0}
  ul{margin-top:22px;list-style:none}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 26px;position:relative;
    border-top:1px solid var(--rule);max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;
    border-radius:50%;background:var(--accent)}
  .pillar .no{font-family:var(--head);font-size:84px;font-weight:700;color:var(--accent);
    line-height:1}
  .pillar h2{margin-top:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:26px}
  .card h3{font-family:var(--head);font-size:22px;font-weight:600;margin-bottom:8px}
  .card p{font-size:16px;color:var(--muted);margin-top:0}
  .who strong{color:var(--ink)}
  .cta h1{font-size:50px}
  .cta .step{background:var(--ink);color:var(--bg);border-radius:12px;padding:22px 26px;
    margin-top:26px;max-width:52ch}
  .cta .step b{color:var(--pop)}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:var(--muted);max-width:62ch}
  .foot{position:absolute;bottom:24px;left:64px;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);font-weight:600}
  .map{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
  .map span{font-size:13px;font-weight:600;color:var(--ink);background:var(--panel);
    border:1px solid var(--rule);border-radius:999px;padding:8px 16px}
  .map span.on{background:var(--accent);border-color:var(--accent);color:#0f2341}
  @media(max-width:700px){.slide{padding:40px 26px;min-height:auto}h1{font-size:36px}
    .sect h1{font-size:42px}.two{grid-template-columns:1fr}.big{font-size:32px}.foot{left:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", cls:"", html:`
    <div class="kick">A live masterclass with Marisa Mann</div>
    <h1>Successful,<br>and Still Searching</h1>
    <p class="lead">The Whole Life Navigation masterclass, for accomplished professionals who reached the top of the ladder and found the question still waiting.</p>
    <div class="foot">UpLift All</div>`},

  {t:"who", cls:"who", html:`
    <div class="kick">Who this is for</div>
    <h2>You made it. On paper.</h2>
    <p>You are the person others call successful. <strong>The title, the income, the respect, all real.</strong> And still, more often than you say out loud, you wonder whether this is it, and what a next chapter that actually fits you would even look like.</p>
    <p>If that is you, you are in the right room.</p>`},

  {t:"trap", cls:"", html:`
    <div class="kick">The trap</div>
    <h2>The promotion that was supposed to fix it</h2>
    <p>So you did what has always worked. You set a bigger goal. A new role, a board seat, another raise, a move. You hit it. And the relief lasted a few weeks before the same quiet flatness came back, right on schedule.</p>
    <p>The ladder ran out of answers, because the problem was never that you needed a higher rung.</p>`},

  {t:"hook", cls:"", html:`
    <div class="kick">The reframe</div>
    <div class="big">You are not burned out.<br>You are <span class="g">mid-transformation, without a map.</span></div>
    <p class="lead">Every reinvention worth the name goes through a stretch that feels like being lost. The difference between the people who come out the other side and the people who stall is not grit. It is having a method.</p>`},

  {t:"sect", cls:"sect", html:`
    <div class="kick">Part One</div><h1>Why the promotion didn't fix it</h1><div class="bar"></div>`},

  {t:"p", cls:"", html:`
    <div class="kick">The core problem</div>
    <h2>Success you can measure, a question you can't</h2>
    <p>For years the ladder gave you the next thing to want. A title, a number, a team. Each rung quieted the question for a while. Then one day you reach the rung you were climbing for, and the question is still there, only now there is nothing above it to chase.</p>`},

  {t:"p", cls:"", html:`
    <div class="kick">The core problem</div>
    <h2>This is not burnout, and it is not ingratitude</h2>
    <p>You are not broken and you are not failing. You built an identity around the climb, and the climb is done. What feels like restlessness is a signal, the gap between the life you built and the one you actually want has grown too loud to ignore.</p>`},

  {t:"sect", cls:"sect", html:`
    <div class="kick">Part Two</div><h1>Whole Life Navigation</h1><div class="bar"></div>`},

  {t:"framework", cls:"", html:`
    <div class="kick">The method</div>
    <h2>Reinvention, run as a navigation</h2>
    <p>Whole Life Navigation treats "what's next" the way you would treat any serious change, as a structured path with four stages, not a leap of faith.</p>
    <div class="map">
      <span class="on">Who you are</span>
      <span class="on">How you live</span>
      <span class="on">Where it breaks</span>
      <span class="on">What changes</span>
    </div>`},

  {t:"pillar", cls:"pillar", html:`
    <div class="kick">Pillar one</div><div class="no">01</div>
    <h2>Who you are</h2>
    <p>Underneath the title, your real values, needs and strengths. Not the ones your resume rewards, the ones that actually set the terms for a life that fits.</p>`},

  {t:"pillar", cls:"pillar", html:`
    <div class="kick">Pillar two</div><div class="no">02</div>
    <h2>How you live</h2>
    <p>An honest audit of where your time, your decisions and your relationships actually go. The calendar, not the intention, tells the truth about the life you are living now.</p>`},

  {t:"pillar", cls:"pillar", html:`
    <div class="kick">Pillar three</div><div class="no">03</div>
    <h2>Where it breaks</h2>
    <p>The gap analysis. We name precisely where the current life and the wanted life diverge. Once the gap has a name, it stops being a vague unease and becomes something you can close.</p>`},

  {t:"pillar", cls:"pillar", html:`
    <div class="kick">Pillar four</div><div class="no">04</div>
    <h2>What changes</h2>
    <p>Clarity is not the finish line, a plan is. We turn the gap into a small set of intentional choices, sequenced, so the next chapter is designed rather than stumbled into.</p>`},

  {t:"edge", cls:"", html:`
    <div class="kick">Why a navigation, not a vision board</div>
    <h2>You have already led changes worth millions</h2>
    <p>For thirty years I led digital and organizational transformations for large enterprises. The discipline is always the same, understand the current state, find where it breaks, design the redesign, sequence the rollout.</p>
    <p>Whole Life Navigation is that discipline, turned on the one transformation nobody hands you a plan for, your own.</p>`},

  {t:"sect", cls:"sect", html:`
    <div class="kick">Part Three</div><h1>A next chapter, designed on purpose</h1><div class="bar"></div>`},

  {t:"p", cls:"", html:`
    <div class="kick">In practice</div>
    <h2>A Monday, rebuilt</h2>
    <p>It rarely starts with quitting. It starts with one decision run through the four pillars, a role reshaped, a boundary drawn, a side of your work you had written off brought back to the center. Small, intentional, and pointed at the life you named instead of the one you drifted into.</p>`},

  {t:"why", cls:"", html:`
    <div class="kick">Who is guiding you</div>
    <h2>Marisa Mann</h2>
    <p>Founder of UpLift All and host of the UpLift UnLeashed podcast. Thirty-plus years leading AI strategy and transformation across Gartner, Kin and Carta, JPMorgan and Accenture, before turning the same method toward people.</p>
    <ul>
      <li>Built on work with 500+ professionals navigating their next chapter</li>
      <li>A structured method, not motivation, that you can run again and again</li>
      <li>For people who trust a system over a slogan</li>
    </ul>`},

  {t:"recap", cls:"", html:`
    <div class="kick">The path, in one view</div>
    <h2>From drift to design</h2>
    <div class="two">
      <div class="card"><h3>Who you are</h3><p>The values and strengths underneath the title.</p></div>
      <div class="card"><h3>How you live</h3><p>The honest audit of time and decisions.</p></div>
      <div class="card"><h3>Where it breaks</h3><p>The gap, named precisely.</p></div>
      <div class="card"><h3>What changes</h3><p>Clarity, turned into a sequenced plan.</p></div>
    </div>`},

  {t:"cta", cls:"cta", html:`
    <div class="kick">Your next step</div>
    <h1>Run the full navigation</h1>
    <p>Today was the map. The 90-day UpLift Unleashed cohort is where you walk the whole path with guidance and a small group moving through the same chapter alongside you.</p>
    <div class="step">Join the next <b>UpLift Unleashed</b> cohort at <b>uplift-all.vip</b>, and design what's next instead of waiting for it.</div>
    <div class="disc">This masterclass is educational. No income, role, or result is guaranteed. Results vary with each person's situation, choices, and effort.</div>
    <div class="foot">UpLift All</div>`}
];

const D = document.getElementById("deck");
const n = S.length;
S.forEach((s,i)=>{
  const el = document.createElement("section");
  el.className = "slide " + (s.cls || "");
  el.innerHTML = `<div class="num">${String(i+1).padStart(2,"0")} / ${n}</div>` + s.html;
  D.appendChild(el);
});
</script>
</body>
</html>
