<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Foreign-Trained Nurse to Thriving U.S. Nurse Practitioner — a masterclass with Miki Miura, DNP, APRN, FNP-C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#faf6f3; --panel:#ffffff; --rule:#ece3dd;
    --ink:#2f3c45; --ink-soft:#55606a; --ink-muted:#8a8078;
    --accent:#e5796e; --gold:#d8b73a;
  }
  html,body{height:100%;}
  body{ font-family:'Source Serif 4',Georgia,serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; display:flex; align-items:center; justify-content:center; padding:20px; }
  #stage{ width:100%; max-width:960px; aspect-ratio:16/9; margin:0 auto; position:relative; }
  .slide{ position:absolute; inset:0; padding:60px 72px; display:none; flex-direction:column;
    background:var(--panel); border:1px solid var(--rule); border-radius:6px;
    box-shadow:0 24px 60px -30px rgba(47,60,69,.35); overflow:hidden; }
  .slide.on{ display:flex; }
  .slide::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--accent); }
  .center{ justify-content:center; }
  .kicker{ font-family:'Jost',sans-serif; font-size:13px; font-weight:600; letter-spacing:.18em;
    text-transform:uppercase; color:var(--accent); margin-bottom:20px; }
  .pillar-num{ font-family:'Jost',sans-serif; font-size:14px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
  h1{ font-family:'Jost',sans-serif; font-weight:700; font-size:44px; line-height:1.1; letter-spacing:-.01em; }
  h2{ font-family:'Jost',sans-serif; font-weight:600; font-size:33px; line-height:1.16; margin-bottom:18px; }
  p{ font-size:21px; line-height:1.55; color:var(--ink-soft); margin-bottom:14px; max-width:44ch; }
  .lead{ font-size:23px; color:var(--ink); }
  .sub{ font-family:'Jost',sans-serif; font-size:19px; color:var(--ink-muted); margin-top:16px; max-width:52ch; }
  ul{ list-style:none; margin-top:6px; }
  li{ font-size:20px; line-height:1.5; color:var(--ink-soft); padding-left:30px; position:relative; margin-bottom:13px; max-width:46ch; }
  li::before{ content:""; position:absolute; left:0; top:11px; width:12px; height:12px; border-radius:50%; background:var(--accent); }
  li.g::before{ background:var(--gold); }
  .roadmap{ display:flex; gap:14px; margin-top:24px; flex-wrap:wrap; }
  .step{ font-family:'Jost',sans-serif; font-weight:600; font-size:16px; color:var(--ink);
    background:var(--bg); border:1px solid var(--rule); border-radius:40px; padding:10px 20px; }
  .step .n{ color:var(--accent); margin-right:8px; }
  .disclaimer{ font-family:'Jost',sans-serif; font-size:13px; color:var(--ink-muted); margin-top:24px; line-height:1.5; max-width:62ch; }
  .cta-note{ font-family:'Jost',sans-serif; font-size:20px; color:var(--ink); font-weight:500; margin-top:12px; }
  .foot{ margin-top:auto; font-family:'Jost',sans-serif; font-size:14px; color:var(--ink-muted); }
  .pageno{ position:absolute; bottom:20px; right:26px; font-family:'Jost',sans-serif; font-size:13px; color:var(--ink-muted); }
  #nav{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); font-family:'Jost',sans-serif; font-size:13px;
    color:var(--ink-muted); display:flex; gap:12px; align-items:center; }
  #nav button{ font-family:'Jost',sans-serif; border:1px solid var(--rule); background:var(--panel);
    color:var(--ink); border-radius:5px; padding:6px 14px; cursor:pointer; font-size:13px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button onclick="go(-1)">Prev</button><span id="count"></span><button onclick="go(1)">Next</button></div>
<script>
const S = [
  {t:'title',
    h:'From Foreign-Trained Nurse to Thriving U.S. Nurse Practitioner',
    sub:'The roadmap for NP students, new grads, and internationally-trained nurses building a real U.S. career.',
    foot:'With Miki Miura, DNP, APRN, FNP-C · JANP Project' },
  {t:'bio', k:'Your mentor', h:'Miki Miura, DNP, APRN, FNP-C',
    p:['Family nurse practitioner in Hawai’i. Trained as a nurse in Japan, moved across an ocean, graduated valedictorian of her NP program, and built a U.S. NP career from scratch.',
       '2024 AANP State Award for Excellence. Ten years in practice, and now a mentor to the nurses walking the same road.'] },
  {t:'point', k:'Who this is for', h:'You did the hard part already.',
    li:['You are an NP student, a new grad, or an internationally-trained nurse aiming for U.S. practice.',
        'You have studied for the boards, or you have already passed them.',
        'And somehow the finish line keeps moving.'] },
  {t:'statement', k:'The trap', h:'Passing the boards feels like the summit.',
    p:['So every course, every ad, every study group points at one thing: pass the exam.'],
    lead:'Then you pass. And nobody handed you the map for what comes next.' },
  {t:'statement', k:'The reframe', h:'The exam was the easy part.',
    p:['The exam had a syllabus. Getting licensed, landing the first job, and surviving your first ninety days as an NP do not.'],
    lead:'That is where good clinicians stall out. Not for lack of knowledge, for lack of a path.' },
  {t:'section', k:'Part one', h:'The barriers nobody warns you about.' },
  {t:'point', k:'The real problem', h:'Why smart nurses get stuck.',
    li:['The credentialing maze: which certification exam, which state, which order.',
        'The first job that will not look at a resume with no NP experience on it.',
        'For internationally-trained nurses: visa timing, eligibility, and starting a network from zero.'] },
  {t:'statement', k:'The cost', h:'Talent is not the bottleneck.',
    p:['The nurses who make it are rarely the smartest in the cohort. They are the ones who had someone show them the sequence.'],
    lead:'A path you can see is the difference between a year of drift and a career that compounds.' },
  {t:'roadmap', k:'Part two', h:'The roadmap: three pillars.',
    road:['Get certified & licensed','Land the first NP job','Thrive in the role'] },
  {t:'pillar', pn:'Pillar 1', h:'Get certified and licensed.',
    li:['Choose your exam on purpose: AANP vs ANCC, and what each one signals.',
        'Move through state licensure in the right order so nothing stalls you.',
        'For international nurses: the extra eligibility and credentialing steps, mapped.'] },
  {t:'pillar', pn:'Pillar 1', h:'This is where the international path is won or lost.',
    p:['Employment can anchor permanent residency. Sequencing the exam, the license, and the offer in the right order is what turns a visa into a career.'],
    sub:'It is the exact sequence I walked myself.' },
  {t:'pillar', pn:'Pillar 2', h:'Land the first NP job.',
    li:['A resume and CV that read like a clinician, not a new grad apology.',
        'Cover letters that make a hiring manager want the interview.',
        'Interview preparation for the questions NPs actually get asked.',
        'When a residency or fellowship is the smarter first move.'] },
  {t:'pillar', pn:'Pillar 2', h:'The offer is a negotiation, not a gift.',
    p:['New NPs accept the first number because nobody told them they could ask. Knowing your worth and how to name it changes the first paycheck and every one after it.'] },
  {t:'pillar', pn:'Pillar 3', h:'Thrive in the role.',
    li:['Prepare for day one so your first week builds trust instead of doubt.',
        'Transition into the NP identity: from following orders to owning decisions.',
        'Build a patient panel that stays with you.',
        'Earn the respect of the staff and providers around you.'] },
  {t:'pillar', pn:'Pillar 3', h:'The first ninety days set the next ten years.',
    p:['A strong start compounds into referrals, autonomy, and the kind of practice you actually want. A shaky one quietly teaches you to shrink.'] },
  {t:'section', k:'Part three', h:'When the roadmap is walked in order.' },
  {t:'statement', k:'Proof of the path', h:'I am not teaching theory.',
    p:['I came from a hospital ward in Japan to a valedictorian NP program in Hawai’i, earned residency through my practice, and now precept the students coming up behind me.'],
    sub:'Every step in this roadmap is one I have taken, not one I read about.' },
  {t:'statement', k:'The mindset', h:'A fulfilling life makes you a better clinician.',
    p:['This work is not about grinding yourself flat to prove you belong. The nurses who last build a career and a life at the same time. That is the whole point of a plan.'] },
  {t:'roadmap', k:'The roadmap, once more', h:'RN today, thriving NP on purpose.',
    road:['Get certified & licensed','Land the first NP job','Thrive in the role'],
    sub:'One sequence, walked in order, with someone who has been where you are going.' },
  {t:'cta', k:'Your next step', h:'Ready to walk the roadmap with me?',
    p:['The NP Career Starter Kit and my coaching take you through all three pillars, step by step, with the international path built in.'],
    cta:'Start with the NP Career Starter Kit, or book a coaching call at usa.janpproject.com.',
    disc:'For education only. This masterclass is not medical, legal, or immigration advice. No job, salary, licensure, or immigration result is guaranteed. Results vary with your circumstances and effort.',
    foot:'Miki Miura, DNP, APRN, FNP-C · JANP Project' }
];

function render(s, i, n){
  const centered = (s.t==='title'||s.t==='section'||s.t==='roadmap'||s.t==='cta') ? ' center' : '';
  let b = '';
  if(s.pn) b += `<div class="pillar-num">${s.pn}</div>`;
  if(s.k)  b += `<div class="kicker">${s.k}</div>`;
  if(s.t==='title') b += `<h1>${s.h}</h1>`; else if(s.h) b += `<h2>${s.h}</h2>`;
  if(s.lead) b += `<p class="lead">${s.lead}</p>`;
  if(s.p) b += s.p.map(x=>`<p>${x}</p>`).join('');
  if(s.li) b += '<ul>'+s.li.map((x,ix)=>`<li class="${ix===s.li.length-1?'g':''}">${x}</li>`).join('')+'</ul>';
  if(s.road) b += '<div class="roadmap">'+s.road.map((x,ix)=>`<div class="step"><span class="n">${ix+1}</span>${x}</div>`).join('')+'</div>';
  if(s.cta) b += `<div class="cta-note">${s.cta}</div>`;
  if(s.sub) b += `<div class="sub">${s.sub}</div>`;
  if(s.disc) b += `<p class="disclaimer">${s.disc}</p>`;
  if(s.foot) b += `<div class="foot">${s.foot}</div>`;
  b += `<div class="pageno">${i+1} / ${n}</div>`;
  return `<section class="slide${centered}">${b}</section>`;
}
const stage=document.getElementById('stage');
stage.innerHTML = S.map((s,i)=>render(s,i,S.length)).join('');
const slides=[...document.querySelectorAll('.slide')]; let cur=0;
function show(i){ slides.forEach((el,ix)=>el.classList.toggle('on',ix===i));
  document.getElementById('count').textContent=(i+1)+' / '+S.length; }
function go(d){ cur=Math.max(0,Math.min(S.length-1,cur+d)); show(cur); }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); });
show(0);
</script>
</body>
</html>
