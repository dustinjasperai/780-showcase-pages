<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Ready for Any Call · Ross Orpet, MD · Loud &amp; Clear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f2f7f6; --panel:#fcfcfc; --rule:#cdebe7;
    --ink:#1d2939; --accent:#0cb8a5; --accent2:#097a6a; --muted:#5b6b78;
  }
  html,body{height:100%}
  body{background:#dbe6e4;font-family:'Manrope',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dbe6e4}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);margin-bottom:2.4vh}
  h1{font-family:'Manrope',Helvetica,sans-serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:-.012em}
  .t-title h1{font-size:4.5vw;max-width:92%}
  .t-normal h1{font-size:3.2vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--muted);margin-top:2.6vh;max-width:78%;line-height:1.56;font-weight:400}
  .sub{font-size:1.62vw;color:var(--muted);margin-top:3.2vh;max-width:82%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.32vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:92%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh;border-radius:3px}
  .t-dark{background:var(--ink);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:88%;font-weight:600;color:#eef7f5}
  .t-dark .accenttext{color:#38d9c6}
  .t-cta{background:radial-gradient(130% 130% at 50% 0%,#0f6b60 0%,#0a4a43 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:#f2fbf9}
  .t-cta .sub{color:#c3e7e1}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #38d9c6;color:#e6fbf7;border-radius:100px;padding:1.3vh 1.7vw;font-family:'Inter',sans-serif;font-size:1.2vw;font-weight:600}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3vw 1.6vw;margin-top:3.6vh;max-width:92%}
  .pillar{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:1.8vh 1.4vw}
  .pillar .pt{font-family:'Manrope',sans-serif;font-size:1.28vw;font-weight:700;color:var(--accent2)}
  .pillar .pd{font-family:'Inter',sans-serif;font-size:1.02vw;color:var(--muted);margin-top:.7vh;line-height:1.42}
  .steps{display:flex;align-items:center;margin-top:3.6vh;flex-wrap:wrap;max-width:94%}
  .step{display:flex;align-items:center;font-family:'Inter',sans-serif;font-size:1.12vw;font-weight:600;color:var(--ink)}
  .step .n{display:inline-flex;align-items:center;justify-content:center;width:2.2vw;height:2.2vw;border-radius:50%;background:var(--accent2);color:#fff;font-size:1.02vw;margin-right:.7vw}
  .step .arw{color:var(--accent);margin:0 .9vw;font-weight:700}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Inter',sans-serif;font-size:.92vw;color:#8aa39c;font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#a7ccc5}
  .ecg-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-ecg{right:6.5%;bottom:9%;width:26vw}
  .corner-ecg{right:6%;bottom:7.5%;width:11vw;opacity:.55}
  .brandline{font-family:'Inter',sans-serif;font-size:1.28vw;color:var(--muted);margin-top:3.4vh;font-weight:400;letter-spacing:.01em}
  .brandline b{color:var(--accent2);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(29,41,57,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--muted);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}.step{font-size:2.6vw}.step .n{width:5vw;height:5vw;font-size:2.4vw}
    .pillars{grid-template-columns:1fr}.pillar .pt{font-size:3.4vw}.pillar .pd{font-size:2.7vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Loud &amp; Clear</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: an ECG trace that steadies into a calm baseline, over a levels ladder -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ecg" viewBox="0 0 300 120">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="72" x2="290" y2="72" stroke="#097a6a" opacity="0.22"/>
    <path d="M12 72 L60 72 L74 40 L86 100 L100 20 L112 72 L150 72 L168 60 L186 72 L290 72"
          stroke="#0cb8a5" opacity="0.95"/>
    <circle cx="290" cy="72" r="4.5" fill="#0cb8a5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Ready for Any Call',sub:'A live masterclass for early-career paramedics and EMTs: how to stay clear, calm, and decisive on the calls you cannot rehearse, so you become the provider your crew looks to in a crisis.',brand:true,ecg:'title'},
 {t:'normal',k:'Who this is for',title:'You know the protocols cold. The tones still make your stomach drop.',body:'You passed the exams, you have the cards memorized, and you have run the drills. Then the real call comes in, the one that does not read like the textbook, and the doubt shows up before the truck does.'},
 {t:'dark',title:'Confidence does not come from running more calls. It comes from <span class="accenttext">how you think before, during, and after them</span>.'},

 {t:'section',idx:'Part One',title:'Why Good Medics Freeze'},
 {t:'normal',k:'The volume myth',title:'You cannot run enough calls to feel ready for all of them.',body:'Every medic is told confidence is just a matter of time and reps. So the ones who still feel shaky after a year assume something is wrong with them. Nothing is wrong with them. Volume alone was never going to build the skill they are missing.'},
 {t:'normal',k:'The real failure point',title:'When a call goes sideways, it is rarely the medicine that fails first.',body:'It is the mind. Under real stress the body runs a predictable sequence, and if you cannot recognize it, it runs you. Naming that sequence is the first thing that gives you back control.'},
 {t:'normal',k:'The 5 Levels of EMS Mental Breakdown',title:'Panic is not random. It escalates in stages, each with warning signs.',body:'It starts with an amygdala hijack, the flood of adrenaline that narrows your focus. Left unchecked it slides into a crisis of confidence, then into analysis paralysis where every option feels wrong. Each level in the framework has its own tell and its own way out, once you know what you are looking at.',steps:['Amygdala hijack','Crisis of confidence','Analysis paralysis']},
 {t:'dark',title:'You cannot prepare for every call. But you can be <span class="accenttext">ready for all of them</span>.'},

 {t:'section',idx:'Part Two',title:'The Confidence Method'},
 {t:'normal',k:'The perspective shift',title:'Stop chasing the checklist. Start understanding the why underneath it.',body:'A protocol tells you the steps. It does not tell you which step matters most for the patient in front of you right now. Confidence comes from understanding the reasoning behind the actions, so that when a call does not fit the algorithm, you still know what to do.'},
 {t:'normal',k:'The six outcomes',title:'Six skills separate a calm provider from an anxious one.',body:'This is what the program is built to develop. Not more facts, but the human skills that hold up when the facts run out.',pillars:[
   ['Emotional Skills','Recovering after the calls that stay with you.'],
   ['Communication','Staying clear under stress and high emotion.'],
   ['Purpose','Reconnecting to why you do this when burnout creeps in.'],
   ['Mastery','Structured clinical knowledge for complex calls.'],
   ['Composure','Science-backed tools for pre-shift and on-scene anxiety.'],
   ['Critical Thinking','Deciding under uncertainty, past the checklist.']]},
 {t:'normal',k:'Composure on demand',title:'Elite performers rehearse the moment before they live it. So can you.',body:'Mental simulation, borrowed from how the Blue Angels prepare, lets you run a hard call in your head until it feels familiar. Paired with tactical breathing and a focus phrase, it gives you a way to bring your heart rate down and your thinking back the moment a scene starts to spin.'},
 {t:'normal',k:'Thinking, not compliance',title:'Judgment is deciding what matters now, not remembering what the card said.',body:'Checklist compliance keeps you safe on the calls that read like the book. Genuine clinical reasoning is what carries you through the ones that do not. The method trains the second skill on purpose, because that is the one nobody hands you in class.'},
 {t:'dark',title:'A protocol tells you what to do. <span class="accenttext">Judgment tells you what matters now.</span>'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The medic this builds',title:'Calm, decisive, and the one your crew turns to when it gets loud.',body:'When you have a way to read your own stress response and a method to think through the call, you stop bracing for the next bad one. You walk in steady, you make the call, and afterward you have the tools to process it instead of carrying it home.'},
 {t:'normal',k:'Why Ross and Will',title:'Taught by people who have stood exactly where you are standing.',body:'Ross Orpet started as a paramedic with the Denver Health Paramedic Division before becoming a dual-boarded EMS and emergency physician. Will Berry is a 13-year critical-care paramedic. Between the podcast and the program they have taught thousands of providers to think their way through the job instead of white-knuckling it.'},

 {t:'section',idx:'Your Next Step',title:'Build the Confidence to Match the Training'},
 {t:'normal',k:'Paramedic Confidence Builder',title:'The full method, with coaches in your corner until it sticks.',body:'On-demand lectures on the perspective shift, the five levels, and the composure tools, plus weekly live group coaching, one-to-one time with Ross and Will, and a private community of medics working on the same thing you are.'},
 {t:'cta',title:'Ready to be the calm one in the room?',sub:'Start with the Paramedic Confidence Builder, or book a free intro call with Ross and Will to see if it is the right fit for where you are.',chips:['Explore the Confidence Builder','Book a free intro call'],disc:'Educational content for paramedics, EMTs, and prehospital providers. No clinical, career, or performance outcome is guaranteed. Results vary by provider, effort, and practice.'},
];

const deck=document.getElementById('deck');
function ecg(kind){return `<svg class="ecg-motif ${kind==='title'?'title-ecg':'corner-ecg'}"><use href="#ecg"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.steps) h+=`<div class="steps">`+s.steps.map((c,j)=>`<div class="step"><span class="n">${j+1}</span>${c}</div>`+(j<s.steps.length-1?`<span class="arw">&rarr;</span>`:``)).join('')+`</div>`;
    if(s.pillars) h+=`<div class="pillars">`+s.pillars.map(p=>`<div class="pillar"><div class="pt">${p[0]}</div><div class="pd">${p[1]}</div></div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Loud &amp; Clear &middot; <b>Ross Orpet, MD &amp; Will Berry, FP-C</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.ecg) h+=ecg(s.ecg);
  else if(s.t==='title') h+=ecg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
