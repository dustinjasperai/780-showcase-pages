<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change People Choose - changecapable Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ee;      /* warm paper ground, from brand light scheme */
    --panel:#ece7df;
    --rule:#d8d0c4;
    --ink:#262b30;     /* from dominant near-black #313131 */
    --muted:#5b6670;
    --accent:#13626b;  /* deep teal-slate, behavioral-science composure */
    --ember:#b4531f;   /* courage beat only */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:38px;line-height:1.14;margin-bottom:18px}
  h3{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:25px;line-height:1.2;margin-bottom:10px}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:46ch;margin-bottom:14px}
  p.lead{font-size:23px;color:var(--muted)}
  .big{font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:46px;line-height:1.12;letter-spacing:-.01em;max-width:20ch}
  .kicker{font-size:17px;color:var(--muted);margin-top:8px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule);max-width:52ch}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:20px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
  .rung{display:flex;align-items:flex-start;gap:18px;padding:18px 22px;background:var(--panel);border-left:4px solid var(--accent);border-radius:8px}
  .rung .r-n{font-family:'Newsreader',serif;font-weight:700;font-size:22px;color:var(--accent);min-width:28px}
  .rung .r-t{font-weight:600;font-size:20px;margin-bottom:3px}
  .rung .r-d{font-size:17px;color:var(--muted)}
  .rung.r1{border-left-color:#8bb3b8}
  .rung.r2{border-left-color:#3d808a}
  .rung.r3{border-left-color:var(--accent)}
  .foot{position:absolute;bottom:22px;left:56px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .center{align-items:center;text-align:center}
  .center p,.center .big{max-width:34ch;margin-left:auto;margin-right:auto}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .cta-line{font-size:22px;color:var(--ink);font-weight:500;margin-top:10px}
  .ember{color:var(--ember)}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:auto}h1{font-size:36px}h2{font-size:28px}.big{font-size:32px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "changecapable with Kris Jennings";
const S = [
  {t:'title', eyebrow:'A live masterclass', h:'Change People Choose',
   lead:'Leading transformation with behavioral science, so the people in the change adopt it themselves.'},

  {t:'promise', eyebrow:'In the next hour',
   h:'You will leave with a different way to lead change.',
   bullets:['Why the people side, not the plan, decides whether a change holds',
            'The three behavioral levers behind the changecapable method',
            'The Influence Stack, and the rung you are probably stuck on',
            'What to do differently in the change you are leading this quarter']},

  {t:'who', eyebrow:'Who this is for',
   h:'You own the outcome of a change you cannot mandate.',
   lead:'VPs, directors, initiative leads, program managers, and HR and OD partners driving a real transformation right now.',
   bullets:['You have the plan, the budget, and the deadline',
            'What you do not control is whether people actually adopt it',
            'Authority gets you compliance. It does not get you belief']},

  {t:'trap', eyebrow:'The trap',
   h:'You built a flawless plan and still hit a wall.',
   lead:'The rollout shipped on time. Then the quiet resistance started: the workarounds, the "we tried that," the tool nobody opens. The plan was never the problem.'},

  {t:'reframe', center:true,
   big:'People do not resist change. They resist being changed.',
   kicker:'Every mandate buys you compliance. None of them buys you adoption.'},

  {t:'part', eyebrow:'Part one', h:'The people side is where change is won or lost.',
   lead:'Most organizations spend five percent or less of a transformation budget on the people side. That five percent is where the entire return is decided.',
   bullets:['The methodology tells you what to do',
            'Behavioral science tells you why people do or do not follow',
            'Change sticks when people choose it, not when they are told']},

  {t:'part', eyebrow:'Part one', h:'Why top-down change models stall.',
   lead:'Step frameworks assume that if the leader follows the stages, the people will follow the leader. They skip the one thing that moves a human being: the conditions around the choice.'},

  {t:'part', eyebrow:'Part one', h:'Compliance has a hidden cost.',
   lead:'When people comply instead of commit, the change looks done on the dashboard and quietly erodes in the hallway. You pay for it later in rework, attrition, and the next change people trust even less.'},

  {t:'method', eyebrow:'Part two: the method',
   h:'The changecapable method.',
   lead:'A behavioral-science approach to transformation, learned on the job during a real change. It rests on three levers.',
   bullets:['Choice architecture: structure the options so the better choice is the easy one',
            'Stakeholder influence: move people through emotion and relationship, not mandate',
            'Adoption acceleration: help the change stick and spread faster than it would on its own']},

  {t:'stack', eyebrow:'Part two: the framework',
   h:'The Influence Stack.',
   lead:'How change-leadership skill actually grows. Most leaders live on the bottom rung and wonder why the change does not hold.',
   rungs:[
     {n:'1', t:'Deciding', d:'Help people make good decisions.', c:'r1'},
     {n:'2', t:'Influencing', d:'Move people through emotions and relationships.', c:'r2'},
     {n:'3', t:'Architecting', d:'Design the conditions so the right behavior happens on its own.', c:'r3'}
   ]},

  {t:'part', eyebrow:'Part two: deciding',
   h:'Start where every leader starts.',
   lead:'Deciding is helping people make good decisions under pressure and uncertainty. It is necessary, and it is the rung most leaders never climb past.'},

  {t:'part', eyebrow:'Part two: influencing',
   h:'Influence is emotional before it is logical.',
   lead:'People move through what they feel and who they trust, long before they move through the business case. Influencing is working with that, not around it.'},

  {t:'part', eyebrow:'Part two: architecting',
   h:'The highest skill is invisible.',
   lead:'Architecting is designing the environment so the right behavior is the natural one. When you do this well, adoption stops feeling like a fight because the choice is already easy.'},

  {t:'part', eyebrow:'Part two: in action',
   h:'Choice architecture, in one example.',
   lead:'Picture a new system you want adopted. You can mandate it and chase compliance, or you can make the old path a little harder, the new path the default, and the first win visible to everyone. Same goal. Only one of them lasts.'},

  {t:'courage', center:true, ember:true,
   big:'Courage is not the absence of fear.',
   kicker:'It is leading the change while you are afraid too. That is what inspired by fear means.'},

  {t:'part', eyebrow:'Part three: in practice',
   h:'Inside a change that actually holds.',
   bullets:['You map the choices your people are actually facing, not the ones on the slide',
            'You design the conditions that make the new behavior the path of least resistance',
            'You measure adoption as behavior, not as attendance in a training room',
            'You lead the change people choose, instead of the one they endure']},

  {t:'part', eyebrow:'Part three: the measure',
   h:'Count behavior, not attendance.',
   lead:'Training numbers tell you who showed up. Adoption tells you who changed what they do on Monday. The changecapable method keeps your eye on the second one, because that is the only one that moves the outcome.'},

  {t:'why', eyebrow:'Why learn this from me',
   h:'Three decades inside real transformations.',
   lead:'I have spent thirty years advising leaders in large organizations on change, launched four behavior-change programs, and wrote Inspired by Fear: Becoming a Courageous Change Leader. The changecapable method is what I teach leaders to do on the job, during a change that is already underway.'},

  {t:'cta', center:true, eyebrow:'Your next step',
   h:'Lead the change people choose.',
   cta:'Join the next changecapable cohort and learn the method on a real change you are leading now.',
   disclaimer:'This masterclass is educational. It shares frameworks and approaches from decades of change-leadership practice. Outcomes depend on your organization, your context, and the work you put in. No specific result is promised or guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.center?' center':'');
  let html = '<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.big) html += '<div class="big'+(s.ember?' ember':'')+'">'+s.big+'</div>';
  if(s.h) html += '<h1 style="font-size:'+(s.t==='title'?'':'42px')+'">'+s.h+'</h1>';
  if(s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if(s.kicker) html += '<p class="kicker">'+s.kicker+'</p>';
  if(s.bullets){ html += '<ul>'; s.bullets.forEach(b=> html += '<li>'+b+'</li>'); html += '</ul>'; }
  if(s.rungs){ html += '<div class="stack">'; s.rungs.forEach(r=> html += '<div class="rung '+r.c+'"><span class="r-n">'+r.n+'</span><div><div class="r-t">'+r.t+'</div><div class="r-d">'+r.d+'</div></div></div>'); html += '</div>'; }
  if(s.cta) html += '<p class="cta-line">'+s.cta+'</p>';
  if(s.disclaimer) html += '<p class="disclaimer">'+s.disclaimer+'</p>';
  if(s.t==='title' || s.t==='cta') html += '<div class="foot">'+BRAND+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
