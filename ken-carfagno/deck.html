<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Shrink the Week · Ken Carfagno, Smart Cleaning School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#161616; --panel:#272727; --rule:#3a3a3a;
    --acc:#ff541e; --ink:#f4f2ef; --body:#c9c6c1; --dim:#8f8a83; --cream:#f7f2ea;
  }
  html,body{height:100%}
  body{background:#0f0f0f;font-family:'Montserrat',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f0f0f}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:-.01em}
  .t-title h1{font-size:5.2vw;max-width:92%}
  .t-normal h1{font-size:3.3vw;max-width:90%;font-weight:700}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Montserrat',sans-serif;font-size:1.9vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.4;font-weight:600}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#211d1a 0%,#0d0b0a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:88%;color:var(--cream);font-weight:700}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#241a14 0%,#0d0b0a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:var(--cream)}
  .t-cta .body{font-family:'Montserrat',sans-serif;color:#e7ded2;font-size:1.42vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .clk-motif{position:absolute;pointer-events:none}
  .title-clk{right:7.5%;bottom:8%;width:15vw;opacity:.92}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Smart Cleaning School</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a clock face with an arrow winding back, drawn in the brand orange (hours reclaimed) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="clk" viewBox="0 0 120 120">
  <g fill="none" stroke="#ff541e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="62" r="34" opacity="0.9"/>
    <path d="M60 44 V62 L74 70" opacity="0.9"/>
    <path d="M60 16 A44 44 0 0 0 24 34" opacity="0.7"/>
    <path d="M24 34 L20 20 M24 34 L38 30" opacity="0.7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Shrink the Week',sub:'How a solo cleaning owner earns more per hour and works fewer days, without hiring a big team or giving up the income.',brand:true,clk:'title'},
 {t:'normal',k:'Who this is for',title:'You can do the cleaning. Getting your time back is the part no one taught you.',body:'You own the business and you are also the one on the job. The work gets done, the clients are happy, and the calendar keeps filling. But the only way you have found to earn more is to add another day, and you are running out of days.'},
 {t:'dark',title:'A calendar full of jobs is not the same as a business that pays you well.'},

 {t:'section',idx:'Part One',title:'Why Adding More Jobs Stops Working'},
 {t:'normal',k:'The solo trap',title:'When you are the business, growth just means more hours.',body:'A solo owner-operator has one lever for more income: take on more work and do more of it yourself. That works until the week is full. After that, every new client costs you an evening, a weekend, or the quality of the jobs you already have.'},
 {t:'normal',k:'The busy-and-broke squeeze',title:'Overworked, overwhelmed, and still underpaid.',body:'This is the stage where most owners quit or burn out. The schedule is packed, the phone keeps ringing, and the money still does not match the hours. Working harder raised the income once, then quietly capped your life around it.'},
 {t:'dark',title:'You did not start working for yourself to end up with a worse boss.'},

 {t:'section',idx:'Part Two',title:'The ISO Model'},
 {t:'normal',k:'START',title:'Get booked, and priced so the work is worth it.',body:'The first stage is getting clients in the door at a rate that actually pays. Most owners undercharge to win the job, then resent it. START is about pricing for profit instead of pricing to stay busy, so the foundation holds weight later.'},
 {t:'normal',k:'STUCK',title:'When a full calendar becomes the real problem.',body:'STUCK is the trap from Part One: you won the clients, and now the calendar owns you. The fix is not more hustle. It is deciding which work to keep, what to charge, and which systems buy back the hours you are pouring in for free.'},
 {t:'normal',k:'SCALE',title:'Grow the income without growing the headcount.',body:'SCALE is the part almost no one teaches. You do not have to build a large employee company to earn more. You raise the rate, tighten the routes and the systems, and let a lean setup carry a bigger take-home, on fewer days.'},
 {t:'normal',k:'The four fundamentals',title:'Four things hold every stage together.',body:'Underneath START, STUCK, and SCALE sit four fundamentals you work on at every stage. Financial: price for profit, not for busy. Strategic: the right next move for where you are. Mindset: charge what the work is worth. People: build systems before you build a payroll.'},
 {t:'dark',title:'Fewer days on the job. The same money, or more.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Week Shrinks'},
 {t:'normal',k:'The owner this builds',title:'Fewer hours, a higher rate, and income that stops swinging.',body:'When you price for profit and let systems carry the load, a slow week stops being a crisis. You keep the clients who value the work, the rate holds, and the time you win back is yours. The business finally fits around the life instead of eating it.'},
 {t:'dark',title:'The goal was never a bigger company. It was a better life around a good one.'},
 {t:'normal',k:'Why Ken Carfagno',title:'A former engineer who built the solo path he now teaches.',body:'Ken left a corporate engineering job to start a cleaning business and ran it as a solo owner-operator. He built the system to shrink his own work week without cutting his income, then turned it into the ISO Model. Today he teaches it through Smart Cleaning School: the podcast, the community, and the Solo Cleaning School book.'},

 {t:'section',idx:'Your Next Step',title:'Get Your Week Back'},
 {t:'normal',k:'Keep going with Ken',title:'The full path, from priced-right to a week that fits your life.',body:'Solo Elite is the membership that houses the ISO Model course and the community of owners working the same plan. Start there, or book a free call with Ken to map your own START, STUCK, or SCALE step and the fastest way to buy back time.'},
 {t:'cta',title:'Ready to shrink the week without shrinking the income?',body:'Take the next step with Smart Cleaning School.',chips:['Join Solo Elite','Book a free call with Ken'],disc:'Educational content for cleaning business owners. No income or business result is guaranteed. Results vary by owner, market, and effort.'},
];

const deck=document.getElementById('deck');
function clk(kind){return `<svg class="clk-motif ${kind==='title'?'title-clk':''}"><use href="#clk"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Smart Cleaning <b>School</b> · Ken Carfagno</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.clk) h+=clk(s.clk);
  else if(s.t==='title') h+=clk('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
