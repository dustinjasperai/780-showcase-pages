<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Million Dollar Hiring Funnel — Dr. Mary Frances Duncan · Million Dollar Chiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#14141f; --panel:#1e1e2e; --rule:#34344a;
    --peri:#758bfd; --red:#ea0a2a; --gold:#d9a441; --chalk:#f8f6f1; --grey:#a9adc4; --dim:#63677f;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Jost',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .disp{font-family:'Playfair Display',Georgia,serif}
  .kicker{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.24vw;font-weight:600;letter-spacing:.06em;color:var(--gold);margin-bottom:2.4vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;color:var(--chalk);line-height:1.12;letter-spacing:-.01em}
  .t-title h1{font-size:4.9vw}
  .t-normal h1{font-size:3.3vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Playfair Display',Georgia,serif;font-size:3vw;font-weight:700;color:var(--red);margin-bottom:2vh;letter-spacing:.02em;text-shadow:.22vw .22vw 0 var(--peri)}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--peri),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#22223a 0%,#0c0c16 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:86%;font-weight:600;color:#eef0fa}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:2.9vw;text-align:center;margin-bottom:4.2vh}
  .flowrow{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;row-gap:1.6vh}
  .flowcard{background:var(--panel);border:1px solid var(--rule);border-radius:0;padding:2vh 1.1vw;width:12.4vw;min-height:12.5vh;display:flex;flex-direction:column;gap:.9vh}
  .flowcard .n{font-family:'Playfair Display',Georgia,serif;font-size:1.9vw;font-weight:700;color:var(--red);line-height:1;text-shadow:.14vw .14vw 0 var(--peri)}
  .flowcard .l{font-size:1.08vw;font-weight:500;color:var(--chalk);line-height:1.25}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#232338 0%,#0c0c16 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.1vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--peri);color:#cdd6ff;border-radius:0;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .frames{position:absolute;pointer-events:none;opacity:.9}
  .title-frames{right:7%;bottom:8%;width:25vw}
  .corner-frames{right:6%;bottom:7.5%;width:11vw;opacity:.5}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--peri);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--red);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.8vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-section .idx{font-size:5.4vw}.t-dark h1{font-size:6vw}.t-flow h1{font-size:5vw}
    .flowcard{width:26vw}.flowcard .n{font-size:4vw}.flowcard .l{font-size:2.3vw}.t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 38</div>
<div class="brand-foot">Million Dollar Chiro</div>
<div class="hint" id="hint">→ click or arrow keys</div>

<!-- hiring-funnel motif: applicants entering wide, one purposeful hire dropping out -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="frames" viewBox="0 0 260 150">
  <g fill="none" stroke-linecap="round">
    <!-- funnel walls -->
    <line x1="40" y1="26" x2="118" y2="128" stroke="#a9adc4" stroke-width="1.8" opacity="0.45"/>
    <line x1="220" y1="26" x2="142" y2="128" stroke="#a9adc4" stroke-width="1.8" opacity="0.45"/>
    <!-- applicants entering wide top -->
    <circle cx="66" cy="24" r="3.6" fill="#f8f6f1" opacity="0.5"/>
    <circle cx="104" cy="20" r="3" fill="#f8f6f1" opacity="0.4"/>
    <circle cx="150" cy="22" r="3.4" fill="#758bfd" opacity="0.8"/>
    <circle cx="192" cy="24" r="3" fill="#f8f6f1" opacity="0.45"/>
    <!-- the 11 marker at the throat, red on periwinkle offset -->
    <text x="122" y="92" font-family="Georgia,serif" font-weight="700" font-size="34" fill="#758bfd" stroke="none">11</text>
    <text x="119" y="89" font-family="Georgia,serif" font-weight="700" font-size="34" fill="#ea0a2a" stroke="none">11</text>
    <!-- the purposeful hire dropping out the bottom -->
    <circle cx="130" cy="136" r="6.4" fill="#ea0a2a" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Million Dollar Hiring Funnel',sub:'The 11-step hiring system behind two seven-figure chiropractic practices, live. How practice owners stop hiring with panic and start hiring with purpose.',brand:true,frames:'title'},
 {t:'normal',k:'Who this is for',title:'Practice owners who keep losing weeks, patients, and sleep to the wrong hire.'},
 {t:'normal',k:'What you’ll walk away with',title:'The 11-step Hiring Funnel, from job posting to job offer.',body:'A systematic process perfected in two real clinics over the last ten years. Systems and trial and error, not theory.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'The million dollar numbers you’ll hear are from my own two clinics. Yours will be your own. What matters is the system that produced them.',disc:'Educational content only. The results described are Dr. Duncan’s own and are not a guarantee of business results. Outcomes vary by practice.'},
 {t:'normal',k:'Who’s teaching this',title:'Dr. Mary Frances Duncan. Still in the clinic, every week.',body:'Founder of Simply Southern Chiropractic Center: Greenville in 2015, straight out of school, and Greer in 2020. 20+ employees. She still treats patients in the practices her coaching is drawn from.'},

 {t:'section',idx:'Part One',title:'Why Practices Stall'},
 {t:'normal',k:'Panic hiring',title:'Most hires happen the week someone quits.',body:'The schedule buckles, the front desk drowns, and the next warm body gets the job. That is hiring with panic.'},
 {t:'normal',k:'The double cost',title:'The wrong hire costs you twice.',body:'Once in payroll, and again in the patients who feel the difference the moment they walk in.'},
 {t:'normal',k:'No man’s land',title:'The owner becomes the bottleneck in their own business.',body:'Involved in every decision, every patient interaction, and every problem. That stuck phase has a name, and most practices never leave it.'},
 {t:'dark',title:'Your practice cannot outgrow a team you hired in a hurry.'},

 {t:'section',idx:'Part Two',title:'Hire With Purpose'},
 {t:'flow',k:'The Million Dollar Hiring Funnel',title:'Eleven steps, job posting to job offer',items:[
   {n:'01',l:'The job posting'},{n:'02',l:'Application filter'},{n:'03',l:'Phone screen'},
   {n:'04',l:'In-person interview'},{n:'05',l:'Working interview'},{n:'06',l:'Personality test'},
   {n:'07',l:'Reference checks'},{n:'08',l:'Background check'},{n:'09',l:'Drug screen'},
   {n:'10',l:'The job offer'},{n:'11',l:'Day-one onboarding'}],
   disc:'Stage names anchored to Dr. Duncan’s Chiropractic Hiring Funnel guide and Episodes 2–3 and 34–36; she presents her full framework live.'},
 {t:'normal',k:'The posting',title:'The job posting is marketing, not paperwork.',body:'Written to attract the right applicant and quietly repel the wrong one, before you spend a single hour interviewing.'},
 {t:'normal',k:'The filters',title:'Let the funnel do the filtering before you do.',body:'Personality tests, reference checks, background checks and drug screens. Each step removes a bad fit before they ever reach your clinic floor.'},
 {t:'normal',k:'The interview',title:'By the in-person interview, you’re choosing between good options.',body:'The funnel’s job is to make sure whoever sits across the table has already earned the seat.'},
 {t:'normal',k:'The offer',title:'A job offer built like a system, not a handshake.',body:'Clear expectations on day one beat awkward corrections in month three.'},
 {t:'dark',title:'Don’t hire with panic. Hire with purpose.'},

 {t:'section',idx:'Part Three',title:'Trimming the Fat'},
 {t:'normal',k:'Leaner, smarter',title:'A leaner, smarter team beats a bigger one.',body:'More payroll is not more capacity when the wrong people are absorbing it.'},
 {t:'normal',k:'The hard call',title:'Keeping the wrong person is a decision too.',body:'Every month you delay, the rest of the team pays for it. So does the patient experience.'},
 {t:'dark',title:'Strong teams are built by subtraction as much as addition.'},

 {t:'section',idx:'Part Four',title:'Delegate to Elevate'},
 {t:'normal',k:'The skill',title:'Delegation is the scaling skill.',body:'You cannot open a second location while personally approving everything at the first one.'},
 {t:'normal',k:'The exit',title:'The way out of no man’s land is a team you trust.',body:'Hiring well is what makes delegation safe. The funnel is what makes hiring well repeatable.'},
 {t:'dark',title:'The practice grows when the owner stops being the ceiling.'},

 {t:'section',idx:'Part Five',title:'The Patient Experience Payoff'},
 {t:'normal',k:'The Disney standard',title:'Give your patients the Walt Disney World experience.',body:'Patients rarely remember the adjustment technique. They always remember how your team made them feel.'},
 {t:'normal',k:'Retention',title:'Great hires keep patients. The Maintenance Auto-Draft keeps them longer.',body:'Recurring wellness care turns a great patient experience into predictable monthly revenue.'},
 {t:'dark',title:'The team you hire is the experience your patients feel.'},

 {t:'section',idx:'Part Six',title:'The Million Dollar Picture'},
 {t:'normal',k:'The proof',title:'Two clinics. Each over a million dollars a year.',body:'Greenville, founded 2015. Greer, opened 2020. Same hiring funnel, same systems, both locations.',disc:'These are Dr. Duncan’s own results from her own clinics, shared as proof of the system, never as a promise of yours.'},
 {t:'normal',k:'The method',title:'Identical systems, both locations.',body:'Sustained growth over months and years, built on systems and trial and error. No shortcuts, no quick fixes.'},
 {t:'dark',title:'Real coaching for real chiropractors, from a coach who still practices.'},

 {t:'section',idx:'Part Seven',title:'Where to Go Next'},
 {t:'normal',k:'Homework',title:'Take the Chiropractic Hiring Funnel guide with you.',body:'The written version of tonight’s system, free, yours to keep after the session.'},
 {t:'normal',k:'Keep learning',title:'The podcast is free, every week.',body:'Million Dollar Chiro: 67 episodes for chiropractic practice owners, on Apple, Spotify and YouTube.'},
 {t:'normal',k:'The next step',title:'If you want it installed with you, coaching is one on one.',body:'Two 90-minute calls a month with Dr. Duncan, recorded, with action items after every call. By application, not checkout.'},
 {t:'cta',title:'Stop hiring with panic. Start hiring with purpose.',chips:['Download the Hiring Funnel guide','Apply for 1:1 coaching'],disc:'Educational content, not a guarantee of results. Dr. Duncan’s figures are her own. Outcomes vary by practice.'},
];

const deck=document.getElementById('deck');
function frames(kind){return `<svg class="frames ${kind==='title'?'title-frames':'corner-frames'}"><use href="#frames"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx disp">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Million <b>Dollar</b> Chiro · Dr. Mary Frances Duncan</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.frames) h+=frames(s.frames);
  else if(s.t==='title') h+=frames('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
