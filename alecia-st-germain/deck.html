<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Capacity Ceiling — A Masterclass with Alecia St. Germain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f1;        /* warm paper, from her #f1f3f3 mist */
    --ink:#203b61;       /* deep navy, her dominant */
    --ink2:#4a4a44;      /* warm gray body, near her #666 */
    --accent:#be9142;    /* gold, her signature H1/button color */
    --panel:#eceae2;     /* paper panel */
    --rule:#d8d4c7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:54px 56px;margin:22px 0;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .kick{font-family:'Raleway',sans-serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Raleway',sans-serif;font-weight:800;font-size:46px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:'Raleway',sans-serif;font-weight:700;font-size:33px;line-height:1.14;color:var(--ink);margin-bottom:14px}
  p{font-size:19px;line-height:1.6;color:var(--ink2);max-width:60ch}
  p.lead{font-size:22px;color:var(--ink)}
  .big{font-family:'Raleway',sans-serif;font-weight:800;font-size:40px;color:var(--ink);line-height:1.1}
  .accentword{color:var(--accent)}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;color:var(--ink2);padding:11px 0 11px 30px;position:relative;max-width:62ch}
  li::before{content:'';position:absolute;left:0;top:19px;width:12px;height:12px;border:2px solid var(--accent);border-radius:50%}
  li b{color:var(--ink);font-weight:700}
  .num{font-family:'Raleway',sans-serif;font-weight:800;font-size:15px;color:var(--bg);background:var(--ink);width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-right:12px}
  .foot{position:absolute;bottom:20px;left:56px;right:56px;display:flex;justify-content:space-between;font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a79f88}
  /* capacity-gauge motif */
  .gauge{display:flex;gap:16px;margin-top:26px}
  .col{flex:1}
  .col .lab{font-family:'Raleway',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}
  .bar{height:12px;background:var(--panel);border-radius:7px;overflow:hidden;border:1px solid var(--rule)}
  .bar span{display:block;height:100%;background:var(--accent)}
  .quote{font-family:'Raleway',sans-serif;font-weight:700;font-size:30px;line-height:1.3;color:var(--ink);max-width:22ch}
  .disc{font-size:14px;color:#8a836e;line-height:1.5;max-width:64ch;margin-top:18px}
  .cta-step{font-family:'Raleway',sans-serif;font-weight:700;font-size:20px;color:var(--ink);background:var(--panel);border-left:4px solid var(--accent);padding:16px 20px;border-radius:0 10px 10px 0;margin-top:8px;max-width:52ch}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass for women entrepreneurs',
   h:'The Capacity Ceiling',
   p:'Why your business keeps stalling at the same level, and the inner work that lifts the ceiling for good.',
   by:'With Alecia St. Germain, The Conscious Edge'},

  {t:'promise', kick:'What you will leave with',
   h:'The real reason growth stalls, and how to move the line',
   bullets:[
     'Why effort and strategy stop working past a certain point in your business.',
     'The three kinds of capacity every founder has to grow: emotional, energetic, and financial.',
     'A simple way to see the hidden commitment that keeps pulling you back to overwork.']},

  {t:'who', kick:'Who this is for',
   h:'The established woman who has already done the hard part',
   p:'You built a real business. You serve clients well, you know how to bring in leads, and you have tried the courses and the tactics. And still, something caps the next level, and it usually costs you your evenings, your health, or your peace.'},

  {t:'trap', kick:'The trap',
   h:'You were told the answer was one more tactic',
   p:'More funnels. A new offer. Another system to run. So you add, and you push, and the number moves for a quarter, then settles right back where it was, with you more tired than before. The tactics were never the thing holding you.'},

  {t:'reframe', kick:'The reframe',
   quote:'Your business will never grow beyond where your unconscious brain decides you are safe.',
   p:'Growth is not only a strategy problem. It is a safety problem. Part of you is quietly protecting the version of your life that already feels survivable, and it will undo the very growth you are working for.'},

  {t:'part', kick:'Part one', h:'The problem is a ceiling you cannot see',
   p:'The mind builds self-protection systems early, long before the business existed. They kept you safe once. Now they run in the background as overworking, over-delivering, avoiding the bigger ask, staying small enough to stay safe.'},

  {t:'content', kick:'Part one', h:'The hidden commitment',
   p:'Underneath the goal you say out loud, there is usually a competing commitment you never chose on purpose, a commitment to not being seen, to not outgrowing the people around you, to not risking the identity you know. Until it is named, it wins every time.',
   bullets:[
     'The visible goal: scale the business, serve more people, earn more.',
     'The competing commitment: stay safe, stay small, stay in control.',
     'The result: you self-sabotage right at the edge of the next level.']},

  {t:'framework', kick:'Part two', h:'Conscious Capacity Coaching',
   p:'Strategy alone cannot lift the ceiling, because the ceiling is not made of strategy. The work grows your capacity across three dimensions at once, so the business can finally grow into the room you have made.',
   gauge:[['Emotional',68],['Energetic',55],['Financial',80]]},

  {t:'pillar', kick:'Part two, capacity one', h:'Emotional capacity',
   p:'Learning to sit with the discomfort of being more visible, charging more, and being wrong in public, without retreating to the old safe behaviors. This is the capacity that lets you make the braver decision and stay in it.'},

  {t:'pillar', kick:'Part two, capacity two', h:'Energetic capacity',
   p:'Protecting the energy the growth actually requires, so you stop paying for every gain with your health and your relationships. Sustainable scaling is not a time-management trick, it is an energy decision made on purpose.'},

  {t:'pillar', kick:'Part two, capacity three', h:'Financial capacity',
   p:'Raising the amount of money you can receive, hold, and direct without the old anxiety flaring up and sabotaging it. Your income rises to meet the level of money your nervous system believes is safe, and that level can be grown.'},

  {t:'content', kick:'Part two, the method', h:'Seeing the map',
   p:'Using a psychology-based process, we map the connection between what you want, the behaviors working against it, and the belief underneath. Once the hidden commitment is on the page in front of you, it stops running the show, and you can choose differently on purpose.',
   bullets:[
     'Name the real goal, in your numbers and your life.',
     'Surface the behaviors quietly protecting the old safe level.',
     'Find the belief underneath, and test it against who you are now.']},

  {t:'content', kick:'Part two, your decisions', h:'The SURE Decision-Making Method',
   p:'Most stuck decisions are not a lack of information, they are a fear wearing the mask of logic. This is a simple way to make aligned, conscious decisions instead of fear-driven ones, so momentum stops leaking out of every hard call.'},

  {t:'content', kick:'Part two, your story', h:'The Strong Story Framework',
   p:'The story you tell yourself about what is possible sets the ceiling before any tactic ever runs. We rebuild that story on purpose, grounded in evidence from your own track record, so your actions have somewhere bigger to aim.'},

  {t:'part', kick:'Part three', h:'When the ceiling finally lifts',
   p:'Not a louder version of the grind. A quieter, steadier business where the next level stops feeling like a wall you throw yourself at, and starts feeling like a room you have already made space for.'},

  {t:'content', kick:'Part three', h:'The shift you can feel',
   bullets:[
     '<b>Before:</b> pushing harder for gains that slide back, paid for in burnout.',
     '<b>After:</b> growth that holds, because the person running the business grew with it.',
     '<b>Before:</b> decisions stalled by a fear you could not name.',
     '<b>After:</b> aligned calls made fast, because the hidden commitment is off the wheel.']},

  {t:'proof', kick:'Why me', h:'I hit this ceiling myself',
   p:'I was a real estate investor and trainer running hard, until the work no longer fit my life and I burned out while raising my daughter. Rebuilding meant doing the inner work first. As a Certified Immunity to Change Coach, I now bring that same work, plus business strategy, to women building something that is meant to last.'},

  {t:'cta', kick:'Your move, when you are ready', h:'Grow the room, then grow the business',
   step:'Book a Capacity Assessment Call, or apply for The Exponential Entrepreneur, and we will map the ceiling that is holding your next level, and the capacity work that lifts it.',
   disc:'This masterclass is educational. It shares a coaching methodology, not financial, legal, or medical advice. Results vary from person to person and are not guaranteed; nothing here promises a specific income or business outcome.',
   by:'Alecia St. Germain, The Conscious Edge'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if (s.t === 'title') {
    inner += `<h1>${s.h}</h1>`;
    if (s.p) inner += `<p class="lead" style="margin-top:20px">${s.p}</p>`;
  } else if (s.t === 'reframe') {
    inner += `<div class="quote">&ldquo;${s.quote}&rdquo;</div>`;
    if (s.p) inner += `<p style="margin-top:22px">${s.p}</p>`;
  } else {
    if (s.h) inner += `<h2>${s.h}</h2>`;
    if (s.p) inner += `<p>${s.p}</p>`;
  }
  if (s.gauge) {
    inner += '<div class="gauge">' + s.gauge.map(g =>
      `<div class="col"><div class="lab">${g[0]}</div><div class="bar"><span style="width:${g[1]}%"></span></div></div>`).join('') + '</div>';
  }
  if (s.bullets) inner += '<ul>' + s.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
  if (s.step) inner += `<div class="cta-step">${s.step}</div>`;
  if (s.disc) inner += `<p class="disc">${s.disc}</p>`;
  inner += `<div class="foot"><span>The Conscious Edge</span><span>${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span></div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
