<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Running Your Business Like a Man — A THRIVE Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17110E;        /* deep warm espresso ground (site_scheme: dark) */
    --panel:#221913;     /* raised panel */
    --rule:#3A2C22;      /* hairline rule */
    --accent:#FFBD59;    /* exact brand amber-gold from extract_brand.js site probe */
    --accent-soft:#E0A33C;
    --ink:#F3EBDF;        /* warm ivory */
    --muted:#B8A590;      /* muted sand */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Lato',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{
    position:relative;background:var(--panel);border:1px solid var(--rule);
    border-radius:18px;padding:72px 64px;margin:0 0 26px;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::after{ /* cyclical motif: a quiet arc of the two energies */
    content:"";position:absolute;right:-120px;bottom:-120px;width:320px;height:320px;
    border-radius:50%;border:1.5px solid var(--rule);
    background:radial-gradient(circle at 30% 30%, rgba(255,189,89,0.07), transparent 60%);
  }
  .eyebrow{font-family:'Lato';font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px;position:relative;z-index:1}
  h1{font-family:'Sorts Mill Goudy',serif;font-weight:400;font-size:52px;line-height:1.08;color:var(--ink);position:relative;z-index:1}
  h2{font-family:'Sorts Mill Goudy',serif;font-weight:400;font-size:38px;line-height:1.12;color:var(--ink);position:relative;z-index:1}
  .sub{font-size:21px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:40em;position:relative;z-index:1}
  .lead{font-family:'Sorts Mill Goudy',serif;font-style:italic;font-size:30px;line-height:1.35;color:var(--accent);position:relative;z-index:1}
  ul{margin-top:26px;list-style:none;position:relative;z-index:1}
  li{font-size:20px;line-height:1.5;color:var(--ink);padding-left:30px;position:relative;margin-bottom:16px;max-width:42em}
  li::before{content:"";position:absolute;left:0;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .num{font-family:'Sorts Mill Goudy',serif;font-size:20px;color:var(--accent);letter-spacing:.1em;margin-bottom:14px;position:relative;z-index:1}
  .pillar-tag{font-family:'Lato';font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft);margin-top:18px;position:relative;z-index:1}
  .cta-box{text-align:center}
  .cta-btn{display:inline-block;margin-top:30px;background:var(--accent);color:#1a1208;
    font-family:'Lato';font-weight:700;font-size:18px;letter-spacing:.04em;padding:16px 38px;border-radius:40px;position:relative;z-index:1}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:34px;max-width:46em;line-height:1.5;position:relative;z-index:1}
  .kicker{font-size:17px;color:var(--muted);margin-top:18px;position:relative;z-index:1}
  .brandline{font-family:'Lato';font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--muted);margin-top:34px;position:relative;z-index:1}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass with Cristina Pop',
   h:'Stop Running Your Business Like a Man',
   sub:'The three shifts high-achieving women make to lead and grow from the feminine, without sacrificing their body, their creativity, or their joy.'},

  {t:'who', eyebrow:'Who this is for',
   h:'You built something real. And it is quietly costing you everything.',
   bullets:['You are an ambitious woman entrepreneur or leader who has already achieved extraordinary success.',
            'You hit your numbers, and you are still running on empty.',
            'You suspect that doing more is not the path to the next level, but every playbook you have been handed says it is.']},

  {t:'lead', eyebrow:'The reframe',
   lead:'You do not have a productivity problem. You have an energy problem.',
   kicker:'The model most of us were handed is masculine by default: more hours, more push, more force. It works, right up until it runs you into the ground.'},

  {t:'part', num:'Part One', h:'The masculine-default operating system',
   sub:'Hustle culture is not a personality. It is an operating system you inherited, and it only knows one gear: push harder.'},

  {t:'points', eyebrow:'What it costs you',
   h:'The push has a ceiling',
   bullets:['Revenue is capped by your hours, because the whole machine runs on your output.',
            'Decisions get slower and heavier, because an exhausted nervous system second-guesses everything.',
            'The joy that made you start this gets rationed away, one 60-hour week at a time.']},

  {t:'lead', eyebrow:'There is another way',
   lead:'Feminine and masculine are not a choice. They are two energies you run on.',
   kicker:'Yin is intuition, cyclical wisdom, magnetism, receiving, presence. Yang is strategy, structure, clarity, execution, boundaries, momentum. Burnout is what happens when you run only on Yang.'},

  {t:'part', num:'Part Two', h:'The THRIVE Formula',
   sub:'My signature method blends ancient five-elements wisdom with neuroscience and somatic healing. It moves through three shifts, in this order, every time.'},

  {t:'pillar', num:'Shift One', tag:'Regulation and stabilization',
   h:'Reclaim your power',
   sub:'Before any strategy can work, your nervous system has to feel safe enough to stop overworking and second-guessing. This shift is where the overwhelm actually breaks.'},

  {t:'points', eyebrow:'Shift One in practice',
   h:'What reclaiming your power looks like',
   bullets:['You learn to regulate the stress response instead of being run by it.',
            'You make powerful decisions from a steady place, not from adrenaline.',
            'You stop confusing busy with effective.']},

  {t:'pillar', num:'Shift Two', tag:'Feminine energy, Yin',
   h:'Embody sovereignty',
   sub:'This is where you reconnect with your feminine power in grounded, tangible ways: intuition, magnetism, and presence become real tools in how you lead, sell, and create.'},

  {t:'points', eyebrow:'Shift Two in practice',
   h:'What sovereignty looks like',
   bullets:['You walk into client meetings confident and magnetic, not performing.',
            'You attract the right clients instead of chasing every lead.',
            'You trust your read on a room again.']},

  {t:'pillar', num:'Shift Three', tag:'Healthy masculine energy, Yang',
   h:'Align and activate',
   sub:'Now the structure. Healthy Yang gives your business the strategy, boundaries, and momentum to hold everything you just reclaimed, so growth becomes repeatable instead of heroic.'},

  {t:'points', eyebrow:'Shift Three in practice',
   h:'What alignment looks like',
   bullets:['Your calendar is built around your energy, not against it.',
            'Your offers and boundaries are clear, so the business stops leaking your time.',
            'Revenue grows without the hours growing with it.']},

  {t:'lead', eyebrow:'The engine underneath',
   lead:'The Feminine Creative Cycle',
   kicker:'A business does not run in a straight line, and neither do you. When you build on your natural cycles instead of a flat line of constant output, you get more done with far less force.'},

  {t:'part', num:'Part Three', h:'The sovereign business, in motion',
   sub:'Not a softer business. A stronger one, run by a woman who is no longer at war with herself.'},

  {t:'points', eyebrow:'The after',
   h:'The same ambition, a different cost',
   bullets:['You expand revenue, impact, influence, and legacy.',
            'You do it in fewer hours, because the growth is no longer glued to your exhaustion.',
            'You are still ambitious. You are just no longer sacrificing yourself to prove it.']},

  {t:'credibility', eyebrow:'Why me',
   h:'I built my business like a man first. Then I rebuilt it.',
   bullets:['Fourteen years coaching ambitious women, since 2012.',
            'Thousands of hours of training in coaching, embodiment, somatic trauma therapy, neuroscience, traditional Chinese medicine, and human design.',
            'I doubled my own revenue while dramatically reducing my hours. The THRIVE Formula is the method I used to do it.']},

  {t:'lead', eyebrow:'One myth to retire',
   lead:'Leading from the feminine is not soft. It is sovereign.',
   kicker:'This is not about lowering your ambition. It is about reaching it without the burnout tax you have been told is the price of success.'},

  {t:'cta', eyebrow:'Your next step',
   h:'Let us map your three shifts',
   sub:'If this is the way you want to build, the next step is a complimentary 20-minute Clarity Call with me. We will look at where you are running on Yang, and what your first shift would be.',
   btn:'Book your Clarity Call',
   disclaimer:'This masterclass is for educational purposes only. It shares a coaching methodology and is not a guarantee of any specific business, revenue, or income result. Outcomes vary and depend on your own circumstances, effort, and decisions.'}
];

const deck = document.getElementById('deck');
function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
S.forEach(s=>{
  const d = el('div','slide');
  if(s.eyebrow) d.appendChild(el('div','eyebrow',s.eyebrow));
  if(s.num) d.appendChild(el('div','num',s.num));
  if(s.t==='title'){ d.appendChild(el('h1',null,s.h)); if(s.sub)d.appendChild(el('div','sub',s.sub)); d.appendChild(el('div','brandline','THRIVE · Cristina Pop')); }
  else if(s.t==='lead'){ d.appendChild(el('div','lead',s.lead)); if(s.kicker)d.appendChild(el('div','kicker',s.kicker)); }
  else if(s.t==='part'){ d.appendChild(el('h2',null,s.h)); if(s.sub)d.appendChild(el('div','sub',s.sub)); }
  else if(s.t==='pillar'){ d.appendChild(el('h2',null,s.h)); if(s.tag)d.appendChild(el('div','pillar-tag',s.tag)); if(s.sub)d.appendChild(el('div','sub',s.sub)); }
  else if(s.t==='cta'){ d.className='slide cta-box'; d.appendChild(el('h2',null,s.h)); if(s.sub)d.appendChild(el('div','sub',s.sub)); d.appendChild(el('div','cta-btn',s.btn)); if(s.disclaimer)d.appendChild(el('div','disclaimer',s.disclaimer)); }
  else { if(s.h)d.appendChild(el(s.t==='who'?'h2':'h2',null,s.h)); }
  if(s.bullets){ const ul=el('ul'); s.bullets.forEach(b=>ul.appendChild(el('li',null,b))); d.appendChild(ul); }
  deck.appendChild(d);
});
</script>
</body>
</html>
