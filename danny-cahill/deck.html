<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Cold Calling Isn't Dead, It's Dominating · Danny Cahill, AccordingToDanny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Piazzolla:opsz,wght@8..30,400;8..30,500;8..30,600&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1E1B16; --panel:#2A251D; --rule:#423A2C;
    --amber:#E0A24E; --sand:#C9B896; --chalk:#F8F5EE; --grey:#B9AF9C; --dim:#857B68;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Hanken Grotesk',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-bottom:2.4vh}
  h1{font-family:'Piazzolla',Georgia,serif;font-weight:500;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:5vw}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.85vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Hanken Grotesk',sans-serif;font-size:1.4vw;font-weight:600;color:var(--sand);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--amber),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#2E281E 0%,#12100C 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:86%;font-style:italic;color:#F4EEE2}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:3vw;text-align:center;margin-bottom:4.6vh}
  .flowrow{display:flex;gap:1.1vw;justify-content:center;flex-wrap:wrap}
  .flowcard{background:var(--panel);border:1px solid var(--rule);border-radius:.7vw;padding:2.4vh 1.3vw;width:13vw;min-height:15vh;display:flex;flex-direction:column;gap:1vh}
  .flowcard .n{font-family:'Hanken Grotesk',sans-serif;font-size:2vw;font-weight:700;color:var(--amber);line-height:1}
  .flowcard .l{font-size:1.16vw;font-weight:600;color:var(--chalk);line-height:1.25}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#2F2819 0%,#13110C 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.1vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--amber);color:#F1DDBE;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .lock-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-lock{right:7.5%;bottom:8%;width:22vw}
  .corner-lock{right:6%;bottom:7.5%;width:10vw;opacity:.4}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--amber);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--amber);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}.t-flow h1{font-size:5vw}
    .flowcard{width:26vw}.flowcard .n{font-size:4vw}.flowcard .l{font-size:2.3vw}.t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 38</div>
<div class="brand-foot">AccordingToDanny</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- telephone handset / open-line motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lock" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M60 60 Q60 40 84 40 Q104 40 104 60 L104 74 Q104 84 92 84 L82 84 Q74 84 72 94 Q66 116 88 130 Q118 148 150 130 Q160 124 158 116 Q156 104 166 102 L176 100 Q188 98 188 86 L188 72 Q188 50 164 50" stroke="#E0A24E" opacity="0.9"/>
    <path d="M118 44 Q140 30 168 40" stroke="#C9B896" opacity="0.7"/>
    <path d="M112 34 Q142 16 178 30" stroke="#C9B896" opacity="0.45"/>
    <circle cx="196" cy="60" r="3.6" fill="#E0A24E" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Cold Calling Isn’t Dead, It’s Dominating',sub:'How recruiting firm owners rebuild the phone-first desk that turns rookies into top producers, from the operator who still runs a search firm every day.',brand:true,lock:'title'},
 {t:'normal',k:'Who this is for',title:'Owners and managers watching the desk get quieter every quarter.',body:'Recruiting and staffing firm owners whose team learned to place in an easy market and never learned to dial in a hard one.'},
 {t:'normal',k:'What you’ll walk away with',title:'The phone-first playbook Danny teaches at the retreats, in one hour.',body:'The essence of the job, why the phone is winning again, and how an owner manufactures the skill on the desk instead of hoping for it.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'Every firm, niche, and market is different. What matters is the version of this that fits your desk.',disc:'Educational content. Nothing here is a promise of billings, income, or business results. Results vary.'},
 {t:'normal',k:'Who’s teaching this',title:'Danny Cahill. He does what you do.',body:'Rookie of the Year to owner of Hobson Associates, one of the country’s largest search firms, and founder of AccordingToDanny. NAPS Hall of Fame, a Lifetime Achievement Award, and the author of Harper’s Rules. He still runs a desk every day.'},

 {t:'section',idx:'Part One',title:'The Open Line'},
 {t:'normal',k:'The oldest method',title:'Picking up the phone is outperforming the modern stack by a wide margin.',body:'It is the oldest recruiting method in the book, and in recent years it has quietly become the one that works best.'},
 {t:'normal',k:'Why now',title:'Everyone chased tools. The lines nobody wanted are wide open.',body:'The phone lines that used to be crowded are now empty, which makes the phone the ultimate differentiator instead of the thing everyone avoids.'},
 {t:'dark',title:'“Cold calling might be the oldest recruiting method in the book. It has been outperforming modern strategies by a massive margin.”'},
 {t:'normal',k:'The atrophy',title:'The good years hid a skill the desk quietly lost.',body:'When the market was hot, almost any recruiter could place without really talking to people. The skill did not disappear on purpose. It just stopped being practiced.'},

 {t:'section',idx:'Part Two',title:'The Essence of the Job'},
 {t:'normal',k:'What the job actually is',title:'You interrupt people to introduce them to life-changing opportunities.',body:'Strip away the software and the sourcing and that is the entire job, and it is not something a template or a scheduled message can do for you.'},
 {t:'normal',k:'Why automation can’t',title:'Email and social get the message out. They do not do the job.',body:'The interruption, the human moment where a career changes, only happens on a call. Everything else is logistics around it.'},
 {t:'dark',title:'“The essence of this job is simple: we interrupt people to introduce them to life-changing opportunities. That is impossible to do with email or social media.”'},
 {t:'normal',k:'The reframe',title:'The dial is not an interruption to the work. The dial is the work.',body:'When the team believes that, the number of calls stops being a metric you enforce and starts being a thing they want.'},

 {t:'section',idx:'Part Three',title:'The World’s Only Job Security'},
 {t:'normal',k:'Danny’s core belief',title:'A recruiter who owns the phone is never unemployed.',body:'Markets turn, clients leave, tools change. The one thing that travels through all of it is the ability to pick up the phone and open a relationship.'},
 {t:'normal',k:'The spirit, not just the skill',title:'The good ones are hard to knock down.',body:'Rejection is the tax on the job. Resilience is the asset. AccordingToDanny exists to jumpstart the spirit as much as sharpen the skill.'},
 {t:'normal',k:'What it means for owners',title:'You are not managing headcount. You are building people who cannot fail.',body:'Every recruiter you turn into a caller is a producer who stays productive when the market stops doing the work for them.'},
 {t:'dark',title:'“Salespeople enjoy the world’s only job security.”'},

 {t:'section',idx:'Part Four',title:'Coach the Tenured'},
 {t:'normal',k:'The counterintuitive move',title:'Your rebuild does not start with the rookies.',body:'It starts with the tenured recruiters who were great when the market was easy and never had to rebuild the phone muscle.'},
 {t:'normal',k:'Why they resist',title:'Experience is the hardest thing to re-coach.',body:'A veteran who used to dominate does not think they need the call reps. That belief, not the skill gap, is the real thing an owner has to move.'},
 {t:'normal',k:'The owner’s leverage',title:'Fix the veterans and the whole desk lifts.',body:'Rookies copy the room they walk into. When the seniors are dialing again, the standard resets itself without a memo.'},
 {t:'dark',title:'The owner’s job is not to make the calls. It is to build the people who will.'},

 {t:'section',idx:'Part Five',title:'Build the Firm'},
 {t:'normal',k:'The Manager’s Retreat theme',title:'Techniques for owners to build their firms and create top producers.',body:'A firm is not a pile of desks. It is a system that turns a rookie into a producer on purpose, and turns a producer into someone who can run without you.'},
 {t:'normal',k:'The whole placement process',title:'Rookies do not need to be polished. They need to know exactly what to do.',body:'What to do, how to do it, and why. That is the entire contemporary placement process, taught in an order a new recruiter can actually follow.'},
 {t:'dark',title:'You already built the largest online coaching system in the staffing industry. The desk is a system too.'},

 {t:'section',idx:'Part Six',title:'The Relationship Rules'},
 {t:'flow',k:'The path',title:'Six steps from quiet desk to full pipeline',items:[
   {n:'01',l:'Reclaim the Phone'},{n:'02',l:'Interrupt With Purpose'},{n:'03',l:'Build the Reps'},
   {n:'04',l:'Coach the Tenured'},{n:'05',l:'Create Top Producers'},{n:'06',l:'Scale the Firm'}]},
 {t:'normal',k:'Steps 1 and 2',title:'Put the phone back at the center, then teach why it matters.',body:'Reclaim the dial as the job, not a chore, and give the desk the reframe that makes them want the call instead of dreading it.'},
 {t:'normal',k:'Steps 3 and 4',title:'Bank the reps, then rebuild the veterans.',body:'Volume first for the rookies, belief first for the tenured. The two together are how a desk gets loud again.'},
 {t:'normal',k:'Steps 5 and 6',title:'Manufacture producers, then let the firm outgrow you.',body:'The last step is not a leap. It is the desk you already rebuilt, running on people who cannot fail and a system that does not need your hands on every call.'},
 {t:'dark',title:'An interview is a date. Leaving a job is a breakup. Recruiting was always relationship work.'},

 {t:'section',idx:'Where to go next',title:'Do What Danny Does'},
 {t:'normal',k:'Free, then live',title:'Start with the class. Go deeper at a live retreat.',body:'Then, for owners who want it hands-on: the Manager’s Retreat, in-house training on your own desk, and the AccordingToDanny library, from the coach who still runs a search firm every day.'},
 {t:'cta',title:'He does what you do.',chips:['Apply for a live Retreat','Talk through your desk'],disc:'Educational content only. No billings, income, or business result is guaranteed. Results vary by firm and market.'},
];

const deck=document.getElementById('deck');
function lock(kind){return `<svg class="lock-motif ${kind==='title'?'title-lock':'corner-lock'}"><use href="#lock"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">According To <b>Danny</b> · Danny Cahill</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.lock) h+=lock(s.lock);
  else if(s.t==='title') h+=lock('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
