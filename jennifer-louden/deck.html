<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Big Idea - A Masterclass with Jennifer Louden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFE7D6;      /* warm golden paper ground, derived from her book-cover world */
    --panel:#FBF6EC;
    --ink:#2A2622;     /* warm near-charcoal, derived from probe #313131 */
    --muted:#6B5F54;
    --rule:#E0D4BC;
    --accent:#B4603A;  /* clay terracotta, her warm brand palette */
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Karla",system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:"Lora",Georgia,serif;font-weight:600;font-size:54px;line-height:1.05;
    margin:0 0 16px}
  h2{font-family:"Lora",Georgia,serif;font-weight:600;font-size:38px;line-height:1.1;
    margin:0 0 18px}
  .big{font-family:"Lora",Georgia,serif;font-weight:500;font-size:42px;line-height:1.12;
    margin:6px 0 18px}
  .sub{font-size:20px;line-height:1.5;color:var(--muted);max-width:62ch}
  .lead{font-size:20px;line-height:1.5;margin:0 0 18px;max-width:62ch}
  ul{margin:8px 0 0;padding:0;list-style:none;max-width:64ch}
  li{position:relative;padding:12px 0 12px 30px;font-size:19px;line-height:1.5;
    border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:4px;top:21px;width:9px;height:9px;
    border-radius:50%;background:var(--accent)}
  .section h2{font-size:46px}
  .section .kicker{color:var(--muted)}
  blockquote{font-family:"Lora",Georgia,serif;font-style:italic;font-weight:400;
    font-size:30px;line-height:1.35;margin:0;max-width:60ch}
  .by{margin-top:22px;font-size:15px;letter-spacing:.04em;color:var(--accent);font-weight:600;
    font-style:normal;font-family:"Karla",sans-serif}
  .foot{margin-top:28px;font-size:15px;color:var(--muted)}
  .ctabtn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;
    font-weight:600;font-size:18px;padding:16px 26px;border-radius:10px;width:fit-content}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:var(--muted);max-width:66ch}
  .num{position:absolute;top:18px;right:24px;font-size:12px;color:var(--muted);letter-spacing:.1em}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:"A Live Masterclass", h:"The Big Idea", sub:"Why your nonfiction book isn't getting written, and what actually gets it done.", foot:"with Jennifer Louden, author of nine books"},
  {t:'big', kicker:"The promise", big:"One live hour.", sub:"Your Big Idea, a hook your reader recognizes, and a real path to a finished book. Built on twenty years of coaching women writers."},
  {t:'list', h:"Who this is for", lead:"You are a woman with a nonfiction book in you.", list:["You have started and stopped more times than you want to admit","You tell yourself it is time, or discipline, or that you are not enough of an expert","The book still is not written, and the not-writing is starting to cost you"]},
  {t:'big', kicker:"The quiet truth", big:"It is almost never time or discipline.", sub:"The real reason most writers do not finish is simpler, and far more fixable than you think."},
  {t:'big', kicker:"The real reason", big:"No one ever showed you how.", sub:"So you flounder, while believing you should already know. That belief is the thing that stops you, not your calendar."},
  {t:'section', kicker:"Part One", h:"The problem is not you"},
  {t:'list', h:"Writing from force burns out before the book is done", list:["Grind and willpower work for a week, then collapse","Your Itty-Bitty-Shitty-Committee, the inner critic, gets louder, not quieter","You confuse not knowing how with not being good enough"]},
  {t:'quote', quote:"Feeling like you cannot write your book means nothing, and need never stop you again.", by:"The Write Now method"},
  {t:'section', kicker:"Part Two", h:"The method"},
  {t:'list', h:"The Big Idea", lead:"The one core idea that gives your reader an aha just by hearing it.", list:["If you are struggling, your Big Idea is usually not as clear as you believe","Getting it clear is the fuel that carries you through the months of writing"]},
  {t:'list', h:"The Hook", lead:"How your just-right reader instantly knows this book is for them.", list:["It helps your book stand out on a crowded shelf","It lets you start marketing before the book is finished"]},
  {t:'list', h:"Your Just-Right Reader", lead:"Not a reader avatar. We throw those out.", list:["Name the one person who most urgently needs your Big Idea","Map that reader's route to transformation into a working table of contents"]},
  {t:'list', h:"The Four Conditions of Enoughness", lead:"The antidote to perfection paralysis.", list:["Write from enough, not from never-good-enough","Stop in the gaps of life instead of pushing to empty","Satisfaction, not perfection, is what finishes a draft"]},
  {t:'section', kicker:"Part Three", h:"Joy over grind, in practice"},
  {t:'list', h:"Writing from desire", list:["Joy and ease in place of grind and shame","Human-scaled routines that fit a real life","A finished book, and a self you can trust on the page"]},
  {t:'quote', kicker:"Why me", quote:"For twenty years I have coached writers, and written nine books with close to a million copies sold in nine languages. I also spent four years lost in a memoir that never came together, so I know both sides of this.", by:"Jennifer Louden"},
  {t:'cta', h:"Write the book only you can write", sub:"If you want a clear Big Idea, a hook your reader recognizes, and a way to finish without burning out, the next step is to work with me.", cta:"Apply for the Non-Fiction Book Mastermind", disc:"Educational only. No income, role, or result is guaranteed. Results vary with your work, your book, and your circumstances."}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t==='section'?'section':'');
  let h='<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){ h+='<h1>'+s.h+'</h1>'; if(s.sub)h+='<div class="sub">'+s.sub+'</div>'; if(s.foot)h+='<div class="foot">'+s.foot+'</div>'; }
  else if(s.t==='big'){ h+='<div class="big">'+s.big+'</div>'; if(s.sub)h+='<div class="sub">'+s.sub+'</div>'; }
  else if(s.t==='section'){ h+='<h2>'+s.h+'</h2>'; if(s.sub)h+='<div class="sub">'+s.sub+'</div>'; }
  else if(s.t==='quote'){ h+='<blockquote>'+s.quote+'</blockquote>'; if(s.by)h+='<div class="by">'+s.by+'</div>'; }
  else if(s.t==='cta'){ h+='<h2>'+s.h+'</h2>'; if(s.sub)h+='<div class="sub">'+s.sub+'</div>'; h+='<div class="ctabtn">'+s.cta+'</div>'; h+='<div class="disc">'+s.disc+'</div>'; }
  else { if(s.h)h+='<h2>'+s.h+'</h2>'; if(s.lead)h+='<div class="lead">'+s.lead+'</div>'; if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';} }
  d.innerHTML=h; deck.appendChild(d);
});
</script>
</body>
</html>
