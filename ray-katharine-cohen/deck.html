<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regulation Is Connection, Not Calm · Ray Katharine Cohen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Petrona:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4;      /* warm paper, her light scheme */
    --panel:#f1ece4;
    --rule:#e2dad0;
    --ink:#1a1a1a;     /* harvested h1 ink */
    --muted:#5d564e;
    --accent:#9c5a3c;  /* one clay accent (see ## Palette) */
    --head:'Petrona', Georgia, serif;
    --body:'DM Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;
    justify-content:center;padding:9vh 8vw;position:relative;border-bottom:1px solid var(--rule)}
  .k{font-family:var(--body);font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:600;font-size:clamp(34px,6vw,68px);line-height:1.08;
    letter-spacing:-.01em;max-width:18ch}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(28px,4.4vw,48px);line-height:1.14;
    max-width:20ch;margin-bottom:26px}
  p{font-size:clamp(17px,2vw,22px);color:var(--muted);max-width:42ch;margin-top:18px}
  .big{font-family:var(--head);font-size:clamp(30px,5vw,54px);color:var(--ink);max-width:24ch;line-height:1.14}
  .accent{color:var(--accent)}
  ul{list-style:none;margin-top:30px;max-width:40ch}
  li{font-size:clamp(17px,2vw,22px);padding:16px 0;border-top:1px solid var(--rule);color:var(--ink)}
  li:last-child{border-bottom:1px solid var(--rule)}
  .step{font-family:var(--head);font-size:clamp(48px,10vw,120px);color:var(--accent);line-height:1}
  .num{font-family:var(--body);font-size:14px;color:var(--muted);position:absolute;top:7vh;right:8vw;letter-spacing:.1em}
  .foot{position:absolute;bottom:5vh;left:8vw;font-size:13px;color:var(--muted);letter-spacing:.04em}
  .disc{font-size:14px;color:var(--muted);max-width:56ch;margin-top:30px;line-height:1.55}
  .cta h1{max-width:22ch}
  .lead{font-family:var(--head);font-size:clamp(22px,3vw,30px);color:var(--ink);max-width:30ch;margin-bottom:10px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title',
    k:'A live masterclass with Ray Katharine Cohen',
    h:"Regulation Is Connection, Not Calm",
    b:"How neurodivergent couples find their way back to each other, without either of you having to become someone you are not."},

  {t:'who',
    k:'Who this is for',
    h:"You love each other. You keep missing each other anyway.",
    b:"This is for couples where one of you is autistic or ADHD, and the two of you keep landing in the same painful loop. One reads silence as not caring. The other is already overwhelmed and goes quiet."},

  {t:'trap',
    k:'The trap',
    h:"You have been told to just communicate better.",
    b:"So you have tried the scripts, the check-ins, the calmer voice. And the same fight still finds you on a different Tuesday. It is not that you are bad at this. You have been handed the wrong tool."},

  {t:'hook',
    k:'A harder truth',
    html:"<div class='big'>Trying to stay <span class='accent'>calm</span> is part of why you keep losing each other.</div>",
    b:"Regulation got sold to you as being chill. That is not regulation. That is performance, and performance cannot hold a real relationship."},

  {t:'part',
    k:'Part one',
    h:"What is actually happening",
    b:"Before we fix anything, we have to name the real problem, because it is not the dishes and it is not the tone of voice."},

  {t:'problem',
    k:'The loop',
    h:"Dysregulation is losing connection with yourself.",
    b:"In a hard moment your system snaps into fight, flight, or freeze. You lose the thread of what you actually feel and need, and from there you create drama with the person in front of you. The fight is downstream of that."},

  {t:'problem',
    k:'The cost',
    h:"Two dysregulated nervous systems cannot find each other.",
    b:"When you are both flooded, no amount of good communication technique will reach across the gap. The skill that matters comes first, and it is quieter than you think."},

  {t:'part',
    k:'Part two',
    h:"The practice",
    b:"This is the core of the work. It is small, portable, and you can do it in the middle of the hard moment, not in a journal three days later."},

  {t:'step',
    k:'Step one',
    step:"Breathe",
    b:"One real breath, on purpose. Not to calm down. To come back to yourself and interrupt the snap into protection."},

  {t:'step',
    k:'Step two',
    step:"Feel your feet",
    b:"Drop out of the story in your head and into your body. Your feet on the floor are the fastest way back into the present moment."},

  {t:'step',
    k:'Step three',
    step:"Stay",
    b:"Stay in connection with yourself while it is still hard. From here you can say the true thing, set the boundary, and not spin it into days of tension."},

  {t:'idea',
    k:'Part three, the bridge',
    h:"Across neurotypes, explicit is love.",
    b:"Unspoken expectations fail between different nervous systems. An autistic partner often needs the request said out loud, not hinted. Being explicit is not a failure of romance. It is how you stop reading each other wrong."},

  {t:'idea',
    k:'Reframe',
    h:"Your anger is information, not a crisis.",
    b:"Anger, grief, and rage are not the enemy of a good relationship. Anger tells you a boundary got crossed. The work is to feel it and stay, not to manage it away and disappear."},

  {t:'idea',
    k:'The stance',
    h:"Being with what is, and saying what feels true.",
    b:"Most couples spend their energy avoiding the present reality of the relationship. Connection comes from the opposite move: the courage to be with what is actually here, together, and to speak honestly from it."},

  {t:'picture',
    k:'In real time',
    h:"The same moment, done differently.",
    b:"The old loop: a trigger, a flood, silence or escalation, days of distance. The new one: a trigger, a breath, feet on the floor, a true sentence, and the two of you still in the room with each other."},

  {t:'why',
    k:'Why me',
    h:"I live this, I do not just teach it.",
    b:"I am married to an autistic partner and I have spent over ten years helping people find the courage to be with what is and say what feels true. This is the work of my own home and my writing in This Is Human, not a theory I read."},

  {t:'cta',
    cls:'cta',
    k:'Your next step',
    h:"Let us find your way back to each other.",
    b:"If this is the way you want to work on your relationship, I would love to support you and your partner through it together.",
    disc:"Educational content only. No income, role, relationship outcome, or result is guaranteed. Results vary and depend on your own circumstances and effort."}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide'+(s.cls?(' '+s.cls):'');
  let inner='<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if(s.k) inner+='<div class="k">'+s.k+'</div>';
  if(s.step) inner+='<div class="step">'+s.step+'</div>';
  if(s.html) inner+=s.html;
  if(s.h) inner+='<h1>'+s.h+'</h1>';
  if(s.b) inner+='<p>'+s.b+'</p>';
  if(s.list){ let u='<ul>'; s.list.forEach(x=>u+='<li>'+x+'</li>'); u+='</ul>'; inner+=u; }
  if(s.disc) inner+='<div class="disc">'+s.disc+'</div>';
  inner+='<div class="foot">Ray Katharine Cohen &middot; Couples Connection Facilitation</div>';
  sec.innerHTML=inner;
  deck.appendChild(sec);
});
</script>
</body>
</html>
