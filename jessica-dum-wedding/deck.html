<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Game Day Playbook &middot; Jessica Dum Wedding Coordination</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf8f4; --panel:#f1efe7; --rule:#ddd9cc;
    --accent:#4e5b4a; --deep:#3b3c36;
    --ink:#2c2c28; --grey:#6b6b5f; --dim:#8a8a7e;
  }
  html,body{height:100%}
  body{background:#e9e6dd;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9e6dd}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .38s ease;
    display:flex;flex-direction:column;justify-content:flex-end;padding:8% 9% 13% 9%}
  .slide.active{opacity:1;visibility:visible}
  .t-normal::after{content:'';position:absolute;left:0;right:0;bottom:0;height:.55vh;background:var(--accent);opacity:.5}
  .kicker{font-family:'Inter',sans-serif;font-size:.92vw;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.08}
  .t-title{justify-content:center;align-items:flex-start}
  .t-title h1{font-size:5vw;max-width:80%;color:var(--deep)}
  .t-title .sub{font-family:'Inter',sans-serif;font-size:1.36vw;color:var(--grey);margin-top:3.4vh;max-width:64%;line-height:1.6;font-weight:300}
  .t-normal h1{font-size:2.85vw;max-width:82%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.3vw;color:var(--grey);margin-top:2.8vh;max-width:72%;line-height:1.62;font-weight:300}
  .t-section{background:var(--panel);justify-content:center;border-left:1.6vw solid var(--accent)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  .t-section h1{font-size:4vw;max-width:76%;color:var(--deep)}
  .t-hit{background:var(--bg);justify-content:center;align-items:flex-start}
  .t-hit h1{font-size:3vw;max-width:78%;color:var(--accent);line-height:1.14;font-style:italic}
  .t-hit .body{font-family:'Inter',sans-serif;font-size:1.24vw;color:var(--grey);margin-top:3vh;max-width:64%;font-weight:300}
  .t-cta{background:var(--panel);justify-content:center;align-items:center;text-align:center;border-top:.9vh solid var(--accent)}
  .t-cta h1{font-size:3.6vw;max-width:80%;color:var(--deep)}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Inter',sans-serif;border:1.5px solid var(--accent);color:var(--accent);padding:1.2vh 1.8vw;font-size:1.02vw;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--bg)}
  .brandline{font-family:'Inter',sans-serif;font-size:.98vw;color:var(--grey);margin-top:3.6vh;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:600}
  .disc{position:absolute;left:9%;right:9%;bottom:4.6vh;font-family:'Inter',sans-serif;font-size:.8vw;color:var(--dim);line-height:1.45;font-weight:300}
  .t-cta .disc{text-align:center;bottom:3.4vh}
  .line{position:absolute;pointer-events:none;opacity:.55}
  .line.big{right:5%;top:9%;width:15vw}
  .line.small{right:6%;top:10%;width:6.6vw}
  .hud{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(44,44,40,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:12px;right:18px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.2em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:11px;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:10px;color:var(--dim);z-index:20;letter-spacing:.14em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.5vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:2.9vw}
    .t-title .sub{font-size:3.1vw}.t-section h1{font-size:7vw}.t-hit h1{font-size:5.6vw}.t-cta h1{font-size:6.6vw}.chip{font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Jessica Dum Wedding Coordination</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- a simple checklist / checkmark line motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="line" viewBox="0 0 160 220">
  <g fill="none" stroke="#4e5b4a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 30 H90" stroke-width="3"/>
    <path d="M20 30 L28 38 L38 22" stroke-width="4"/>
    <path d="M20 84 H90" stroke-width="3" opacity="0.75"/>
    <path d="M20 84 L28 92 L38 76" stroke-width="4" opacity="0.75"/>
    <path d="M20 138 H90" stroke-width="3" opacity="0.5"/>
    <path d="M20 138 L28 146 L38 130" stroke-width="4" opacity="0.5"/>
    <path d="M20 192 H70" stroke-width="3" opacity="0.28" stroke-dasharray="2 7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Game Day Playbook',sub:'How a written, repeatable run-of-show turns a wedding coordinator who has to be everywhere into a team that can execute without her standing on-site.',brand:true,line:'big'},

 {t:'normal',k:'Who this is for',title:'Planners in their first 0 to 5 years, still holding every wedding-day detail in their own head.',body:'You are good at this. Clients love you. And every wedding still runs through you personally, from the first vendor call to the last box loaded into the car.'},
 {t:'normal',k:'What you will walk away with',title:'The structure of a written Game Day Playbook you can actually hand to someone else.',body:'What goes in a run-of-show, how a team executes off it without checking with you every ten minutes, and how the same document becomes the backbone of pricing and hiring.'},
 {t:'normal',k:'An honest note',title:'This is education, not a promise.',body:'Every market and every business is different. What matters is building the version of this system that fits your team and your weddings.',disc:'Educational content. Nothing here is a promise of income, growth, or business results. No outcome is guaranteed and results vary by business and market.'},
 {t:'normal',k:'Who is teaching this',title:'Jessica Dum. Owner and Lead Coordinator, Jessica Dum Wedding Coordination.',body:'She runs a six-person coordination team in Indianapolis, stepping in on weddings 3 to 6 months out to execute plans other people made. Everything in this class comes from the documents her own team runs weddings on.'},

 {t:'section',idx:'Part One',title:'Why "It\\'s All In My Head" Caps Your Business'},
 {t:'normal',k:'The real ceiling',title:'You cannot book more weddings than you can personally attend.',body:'Not because you lack clients. Because the run-of-show, the vendor contacts, the timeline, the contingency plan for when the flowers show up late all live in one place: you.'},
 {t:'hit',title:'A wedding day that only runs because you are standing there is not a business. It is a very good job.',body:'One of those scales. The other one caps at exactly what you can personally carry.'},
 {t:'normal',k:'The quiet cost',title:'Every wedding you cannot delegate is a wedding you cannot take on.',body:'Turn down the date, or work it yourself and burn a weekend you needed back. Either way, the business stops growing right where your calendar does.'},
 {t:'normal',k:'What most planners try',title:'Hiring an assistant and explaining everything out loud, one wedding at a time.',body:'It works for a season. Then a detail gets missed because it was never written down anywhere, and you are back to doing it yourself to be safe.'},

 {t:'section',idx:'Part Two',title:'The Game Day Playbook Framework'},
 {t:'normal',k:'Start with the run-of-show',title:'Every role, every hour, every contingency, written down before the day starts.',body:'Not a checklist in your head. A document someone who has never met your client could pick up and execute the timeline from.'},
 {t:'normal',k:'Then the handoff test',title:'If a coordinator could not run the wedding from the document alone, the document is not finished.',body:'This is the line between a playbook and a to-do list. A playbook survives you being unreachable for an hour.'},
 {t:'hit',title:'You are not writing instructions for yourself. You are writing them for the version of your team that runs weddings without you.'},
 {t:'normal',k:'Where it goes next',title:'The same discipline that builds a run-of-show builds your pricing and your consultation process.',body:'Once client experience is written down instead of improvised, it gets easier to price consistently and to run a consultation that books the right client with confidence.'},

 {t:'section',idx:'Part Three',title:'The Playbook In Motion'},
 {t:'normal',k:'The handover',title:'A coordinator can only run a wedding day if the standard lives somewhere other than your head.',body:'Written once, it is teachable to the next hire. Held in your head, it is another reason you have to be the one standing there.'},
 {t:'normal',k:'What changes',title:'You can say yes to more weddings without personally attending all of them.',body:'The business grows past what one person can physically carry through a single Saturday.'},
 {t:'hit',title:'The goal is not doing everything yourself better. It is building the version of your business that does not need you to.'},
 {t:'normal',k:'Where to take it next',title:'The playbook, the consultation workflow, and the coaching to build both already exist.',body:'The VIP Day and the 90-Day Business Coaching are the paths to build this out in your own business, with the same structure Jessica Dum Wedding Coordination runs on.'},
 {t:'cta',title:'Write it down. Hand it off. Keep growing.',chips:['VIP Day','90-Day Business Coaching'],brand:true,disc:'Educational content only. No income, growth, or business result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function lineMark(kind){return `<svg class="line ${kind==='big'?'big':'small'}" viewBox="0 0 160 220"><use href="#line"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1>`;
  } else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Jessica <b>Dum</b> &middot; Wedding Coordination</div>`;
  }
  if(s.line) h+=lineMark(s.line);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
