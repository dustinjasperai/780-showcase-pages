<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Through Play — a masterclass with Em Stroud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FDF4E7; --panel:#FFFCF6; --ink:#191528; --accent:#E23A45;
    --accent2:#F6B21B; --rule:#E7DECF; --muted:#6a6475;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 48px;margin:22px 0;min-height:340px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(25,21,40,.03)}
  .k{font-family:"Inter";font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:"Fredoka";font-weight:700;font-size:52px;line-height:1.05;margin:0 0 16px}
  h2{font-family:"Fredoka";font-weight:600;font-size:34px;line-height:1.1;margin:0 0 14px}
  .sub{font-size:20px;color:var(--muted);margin:0 0 6px;max-width:46ch}
  p.body{font-size:19px;margin:10px 0 0;max-width:52ch}
  ul{font-size:19px;margin:14px 0 0;padding-left:0;list-style:none;max-width:54ch}
  li{margin:0 0 12px;padding-left:26px;position:relative}
  li:before{content:"";position:absolute;left:0;top:11px;width:11px;height:11px;
    border-radius:50%;background:var(--accent)}
  .big{font-family:"Fredoka";font-weight:600;font-size:30px;line-height:1.18;max-width:40ch}
  .big .a{color:var(--accent)}
  .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--accent);
    margin-bottom:22px}
  .lesson h2{font-size:40px}
  .num{font-family:"Fredoka";font-weight:700;color:var(--accent2);font-size:22px;margin:0 0 10px}
  .cta{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cta .k{color:var(--accent2)}
  .cta h2{color:#fff}
  .cta .sub,.cta p.body{color:#d9d4e0}
  .disc{font-size:13px;color:#9a93a6;margin-top:26px;max-width:60ch}
  .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Em Stroud, the Comic Coach',
   h:'Lead Through Play',
   sub:'The five things a clown knows that your leadership training forgot.'},

  {t:'who', k:'Who this is for',
   h:'Respected. Effective. And a little bit tired.',
   body:'You are senior enough that people watch how you show up. Somewhere on the way here you learned to lead with more control and less of yourself. It works, until it quietly costs you the truth from your team, their best thinking, and your own energy.'},

  {t:'reframe', k:'The reframe',
   big:'You did not climb this high by playing it safe. You got here by <span class="a">playing</span>. Then somewhere, you were told to grow up and stop.'},

  {t:'part', k:'Part one', h:'The mask you lead in'},

  {t:'idea', k:'The core problem',
   h:'The mask keeps you safe and keeps everyone out.',
   body:'A leader performing a part gets performed back at. People manage you instead of trusting you. The room stays polite, careful, and a little bit dead. Play is how you take the mask off on purpose, so your people can finally be honest and creative in front of you.'},

  {t:'part', k:'Part two', h:'Lessons From a Clown'},

  {t:'lesson', cls:'lesson', num:'Lesson one', h:'Be Seen',
   body:'Your people do not need a flawless leader. They need a real one. The moment you let them see the actual you, they stop managing the version of you they imagined.'},

  {t:'lesson', cls:'lesson', num:'Lesson two', h:'Be Kind',
   body:'Kindness is not softness. It is the thing that makes a room safe enough for the truth. A kind room tells you what is wrong while you can still fix it.'},

  {t:'lesson', cls:'lesson', num:'Lesson three', h:'Be Present',
   body:'You cannot lead a moment you are not in. Presence is a skill a clown drills every day, reading the room in front of them instead of the script in their head.'},

  {t:'lesson', cls:'lesson', num:'Lesson four', h:'Be Accepting',
   body:'Accept what is actually in the room, the awkward idea, the failure, the thing nobody wanted to say. Acceptance is where creativity and courage finally have somewhere to go.'},

  {t:'lesson', cls:'lesson', num:'Lesson five', h:'Be Playful',
   body:'Play is not a party trick. It is a leadership capability. Play is how a team learns faster, connects deeper, and remembers why working together can be brilliant.'},

  {t:'part', k:'The operating system', h:'Laugh, Think, Play'},

  {t:'pillar', k:'Pillar one', h:'Laugh',
   body:'Laughter is the fastest route to connection and to a room that feels safe. It is the opening move, not the reward at the end.'},

  {t:'pillar', k:'Pillar two', h:'Think',
   body:'Think about yourself and your people with kindness. You set the weather in every room you walk into, so set it on purpose.'},

  {t:'pillar', k:'Pillar three', h:'Play',
   body:'Play is not frivolous, it is fundamental. Invest far more of your time in it and watch creativity, resilience and real results follow.'},

  {t:'part', k:'Part three', h:'Monday morning, with the mask off'},

  {t:'proof', k:'What changes',
   h:'The same team, finally switched on.',
   list:['The meeting where someone actually says the hard thing',
         'Ideas that used to stay in people heads out on the table',
         'An all-hands your team does not dread',
         'And you, leading as yourself, with energy left at the end of the day']},

  {t:'whyme', k:'Why me',
   h:'Twenty years in business and in comedy.',
   body:'I am Em Stroud, the Comic Coach. I am a classically trained clown, a two time TEDx speaker and the author of the number one bestseller Lessons From a Clown. I have worked with leaders and teams at Bloomberg, Airbus and Barclays, and I run the Leadership Impact School. Play is the most serious work I do.'},

  {t:'cta', cls:'cta', k:'Your next step',
   h:'Come and lead through play.',
   body:'If this is the way you want to lead, come and work with me. Join the Leadership Impact School or find out more at emstroud.com.',
   disc:'No income, role, or result is guaranteed. Results vary and depend on your own work and context. This masterclass is educational.'}
];

const app = document.getElementById('app');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let html = '';
  if (s.k) html += '<p class="k">' + s.k + '</p>';
  if (s.dot) html += '<span class="dot"></span>';
  if (s.num) html += '<p class="num">' + s.num + '</p>';
  if (s.h && s.t === 'title') html += '<h1>' + s.h + '</h1>';
  else if (s.h) html += '<h2>' + s.h + '</h2>';
  if (s.sub) html += '<p class="sub">' + s.sub + '</p>';
  if (s.big) html += '<p class="big">' + s.big + '</p>';
  if (s.body) html += '<p class="body">' + s.body + '</p>';
  if (s.list) html += '<ul>' + s.list.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  if (s.disc) html += '<p class="disc">' + s.disc + '</p>';
  el.innerHTML = html;
  app.appendChild(el);
});
const f = document.createElement('p');
f.className = 'foot';
f.textContent = 'Em Stroud · The Comic Coach · emstroud.com';
app.appendChild(f);
</script>
</body>
</html>
