<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Albert+Sans:wght@400;500;600&display=swap');
:root{--bg:#06201d;--panel:#0c2e2a;--line:#17463f;--accent:#00a89d;--accent2:#f84729;--ink:#eafaf7;--muted:#8fb3ad;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'Albert Sans',system-ui,sans-serif;}
.slide{width:1280px;min-height:720px;margin:0 auto;padding:72px 84px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;}
.eyebrow{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:17px;}
h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:60px;line-height:1.03;letter-spacing:-.01em;}
h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:42px;line-height:1.08;}
p{font-size:25px;line-height:1.5;color:var(--ink);max-width:62ch;}
.muted{color:var(--muted);}
.big{font-size:30px;}
ul{list-style:none;display:flex;flex-direction:column;gap:16px;margin-top:8px;}
li{font-size:24px;line-height:1.4;padding-left:34px;position:relative;max-width:64ch;}
li:before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:4px;background:var(--accent);}
.tag{display:inline-block;font-family:'Archivo',sans-serif;font-weight:700;font-size:20px;color:#06201d;background:var(--accent);padding:6px 16px;border-radius:999px;}
.num{font-family:'Archivo',sans-serif;font-weight:800;font-size:150px;color:var(--line);line-height:.8;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 38px;}
.check{border-left:4px solid var(--accent2);padding-left:26px;}
.foot{position:absolute;bottom:34px;left:84px;right:84px;display:flex;justify-content:space-between;font-size:15px;color:var(--muted);letter-spacing:.04em;}
.center{text-align:center;align-items:center;}
.center p{margin-left:auto;margin-right:auto;}
.disc{font-size:18px;color:var(--muted);max-width:80ch;line-height:1.5;}
.kick{font-size:27px;color:var(--accent);font-weight:600;}
</style></head>
<body><section class="slide"><div class="eyebrow">Self-check</div><div class="card check"><p class="big">Do you have return-to-sport criteria you can defend, and words the athlete trusts?</p></div><p class="muted">Clear criteria plus clear communication is what turns a good outcome into a confident one.</p><div class="foot"><span>ClinicalAthlete &nbsp;|&nbsp; Exercise Prescription For a Complex System</span><span>16 / 25</span></div></section></body></html>
