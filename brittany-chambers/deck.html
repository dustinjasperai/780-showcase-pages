<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Integrative Infant Sleep Method — A Masterclass with Brittany Chambers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F2EA;        /* warm cream, light scheme (derived from site white + bronze warmth) */
    --panel:#EFE7D7;     /* soft sand panel */
    --rule:#E7DDCB;      /* sand rule */
    --accent:#816435;    /* exact brand bronze, brand.json dominant hex (36 uses) */
    --ink:#231d14;       /* warm near-black text */
    --muted:#6c6150;     /* muted warm brown */
    --head:'Quicksand', sans-serif;  /* her rounded display face */
    --body:'Montserrat', sans-serif; /* her body face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:18px;
    padding:54px 52px;
    margin:22px 0;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;top:-70px;right:-60px;width:220px;height:220px;
    border:2px solid var(--rule);border-radius:50%;
    box-shadow:inset 30px 10px 0 -2px var(--bg);
    opacity:.6;
  }
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(30px,5vw,52px);line-height:1.08;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(24px,3.6vw,38px);line-height:1.12;color:var(--ink);margin-bottom:16px}
  .lead{font-size:clamp(17px,2vw,21px);color:var(--muted);margin-top:18px;max-width:40ch}
  p{font-size:17px;color:var(--ink);max-width:56ch;margin-top:12px}
  ul{list-style:none;margin-top:18px;max-width:58ch}
  li{position:relative;padding-left:26px;margin:12px 0;font-size:17px}
  li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border:2px solid var(--accent);border-radius:50%}
  .pillar{font-family:var(--head);font-weight:600;color:var(--accent)}
  .big{font-family:var(--head);font-weight:700;font-size:clamp(26px,4vw,40px);color:var(--accent);line-height:1.1}
  .meta{display:flex;gap:10px;align-items:center;margin-top:28px;font-family:var(--head);font-weight:600;color:var(--accent);font-size:15px}
  .meta span{width:34px;height:1px;background:var(--accent);display:inline-block}
  .num{position:absolute;bottom:20px;right:26px;font-family:var(--head);font-size:13px;color:var(--muted)}
  .cta .btn{display:inline-block;margin-top:24px;font-family:var(--head);font-weight:600;background:var(--accent);color:#fff;padding:15px 30px;border-radius:999px;font-size:17px;text-decoration:none}
  .disc{margin-top:26px;font-size:12.5px;color:var(--muted);max-width:60ch;line-height:1.5}
  .credit li::before{border-color:var(--accent)}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title',
   kicker:'A Live Masterclass with Brittany Chambers, MS, IFSS',
   h1:'The Integrative Infant Sleep Method',
   lead:'How to guide families to real, lasting sleep without sleep training, cry it out, or going against a parent’s instincts.'},

  {t:'promise',
   kicker:'What you will leave with',
   h2:'By the end of this hour',
   list:[
     'Why sleep training works on paper and fails in real homes.',
     'The three principles that let you guide any family with confidence.',
     'How to read a baby instead of forcing a schedule onto one.',
     'What it actually takes to make this gentle work your practice.'
   ]},

  {t:'for',
   kicker:'Who this is for',
   h2:'If you feel called to this work',
   body:'You are a doula, a coach, a therapist, a birthworker, or a mother who walked the hard path herself. You want to help exhausted families. And every program you find teaches the same thing: schedules, timers, and letting the baby cry.',
   lead:'Something in you knows there is a gentler, more honest way. This hour is the method behind it.'},

  {t:'trap',
   kicker:'The trap',
   h2:'The whole field trains sleep',
   body:'Parents are handed a protocol and told to be consistent. When it does not work, they are told they were not consistent enough. The baby is treated as a problem to fix, and the mother is left doubting the one instinct that was right all along.',
   lead:'The families you want to serve are not failing. The model they were given is.'},

  {t:'trap',
   kicker:'The hidden cost',
   h2:'What the timer really teaches',
   body:'When a family finally gets quiet nights through extinction, they often trade them for a parent who no longer trusts herself and a baby who learned that signaling does not bring help. The silence is real. So is the price, and most families feel it long after the chart says it worked.'},

  {t:'hook',
   kicker:'The reframe',
   h2:'Sleep is not a skill. It is a relationship.',
   body:'An infant brain cannot self regulate until somewhere around ages three to five. So sleep training does not teach a baby to sleep. It teaches a baby to stop signaling for help. Those are not the same thing, and families can feel the difference.'},

  {t:'hook',
   kicker:'The science',
   h2:'The brain that cannot soothe itself yet',
   body:'Regulation is borrowed before it is owned. A baby calms by borrowing a calm adult nervous system, over and over, until the wiring to do it alone slowly grows. Leaving a baby to settle solo does not build that wiring faster. It just removes the person it was supposed to be built with.'},

  {t:'part',
   kicker:'Part One',
   h2:'Why sleep training fails families',
   body:'Once you see sleep as a biological and relational process instead of a behavior, everything changes. The goal was never a baby who sleeps through the night on command. It is a baby and a parent who are both getting what they need.'},

  {t:'part',
   kicker:'Part One',
   h2:'Wakefulness was never the problem',
   body:'Babies are carry mammals. They expect closeness day and night: warmth, touch, and responsive care. Night waking is not a defect to extinguish, it is the design. When you teach a family that, the shame they have been carrying starts to lift in a single conversation.'},

  {t:'part',
   kicker:'Part One',
   h2:'The outcome we are actually after',
   body:'Not a quiet house bought with tears. A family where the parent is rested enough to keep responding, the baby is held through the hard parts, and both of them are thriving together. That is the standard this method holds you to.'},

  {t:'part',
   kicker:'Part Two, the method',
   h2:'Integrative Infant Sleep rests on three I’s',
   body:'The whole method comes down to three principles. Hold all three at once and you can guide a family through almost anything the night throws at them.',
   lead:'Integrative. Informed. Intuitive.'},

  {t:'part',
   kicker:'Part Two, the first I',
   h2:'Integrative',
   body:'You protect everyone’s mental health at once. You treat the mother and baby as one dyad, not two problems. And you support the whole family’s sleep, because a plan that fixes the baby and breaks the parent has not fixed anything.'},

  {t:'part',
   kicker:'Part Two, the second I',
   h2:'Informed',
   body:'Your guidance is grounded in real science: neuroscience, developmental psychology, anthropology, and evolutionary biology. That is what lets you answer the hard question a worried parent asks at 2am without reaching for a slogan.'},

  {t:'part',
   kicker:'Part Two, the third I',
   h2:'Intuitive',
   body:'You never ask a parent to ignore their baby’s attempts to communicate or to act against their own instincts. The instinct to respond is not the thing to override. It is data, and often it is right.'},

  {t:'part',
   kicker:'Part Two, the lens',
   h2:'The Body Based Baby Sleep lens',
   body:'Instead of one schedule for every child, you read the actual child. You assess temperament, routine, environment, and sensory preferences, then build a sleep approach around who this baby is and what this family can sustain.',
   lead:'Results last when they fit the real family in front of you.'},

  {t:'part',
   kicker:'Part Three',
   h2:'Guiding a family, night by night',
   body:'You walk a family from survival to steadiness. You name what is biologically normal so the guilt lifts. You repair the nervous system of the home, parent and baby together. You hold the hard nights with them instead of timing them from another room.'},

  {t:'part',
   kicker:'Part Three',
   h2:'What changes for the family you serve',
   body:'They do not just sleep better. They stop apologizing for their baby. They trust themselves again. And a parent who trusts herself tells every other tired parent she knows exactly who helped her.',
   lead:'This is how a practice grows without ever running on fear.'},

  {t:'why',
   kicker:'Why learn it from me',
   h2:'I was the baby they let cry',
   body:'I left a decade in nonprofit leadership after my first child, pulled toward infant sleep and the science of the parental brain. I trained under neuroscientists and built Good Night Moon Child into a method, a 500 plus member community, and a certification for practitioners around the world.',
   credit:[
     'MS, Infant and Family Sleep Specialist, Nurture Neuroscience Practitioner',
     'Parental Brain Educator, Mindfulness for Parents, UCSD',
     'Board Member, Children’s Sleep Foundation'
   ]},

  {t:'cta',
   kicker:'Where to go from here',
   h2:'Step into the work',
   body:'If this is the way you have always wanted to help families, there is a path to carry it forward and make it your practice. I will show you exactly how I guide families and how you can learn to do it too.',
   btn:'Begin with Brittany',
   disc:'Educational content only. This masterclass teaches an approach to infant sleep and the practice of supporting families. It is not medical advice and makes no guarantee of any specific sleep, health, income, or business result. Outcomes vary with each family and each practitioner.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t === 'cta' ? 'cta' : '');
  let html = '';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.h1) html += '<h1>' + s.h1 + '</h1>';
  if (s.h2) html += '<h2>' + s.h2 + '</h2>';
  if (s.big) html += '<div class="big">' + s.big + '</div>';
  if (s.body) html += '<p>' + s.body + '</p>';
  if (s.list) html += '<ul>' + s.list.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  if (s.credit) html += '<ul class="credit">' + s.credit.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  if (s.lead) html += '<div class="lead">' + s.lead + '</div>';
  if (s.btn) html += '<a class="btn">' + s.btn + '</a>';
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  html += '<div class="num">' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
