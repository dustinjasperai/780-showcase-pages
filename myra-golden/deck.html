<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 3R Method — Masterclass by Myra Golden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1family=Playfair+Display:wght@500;700;900&family=Open+Sans:wght@400;500;600family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110c; --panel:#1f1a12; --rule:#3a3020;
    --accent:#c5a253; --ink:#f5f2ea; --muted:#b9ad95;
    --display:'DM Serif Display',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0c0a07;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto}
  .slide{
    position:relative;background:var(--bg);min-height:540px;padding:64px 68px;
    border-bottom:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;
    scroll-snap-align:start;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:68px;top:0;width:46px;height:4px;background:var(--accent)}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--display);font-weight:900;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.1;margin-bottom:20px}
  h3{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);margin-bottom:8px}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:40ch;margin-bottom:16px}
  p.lead{font-size:23px;color:var(--muted)}
  .big{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.12;max-width:20ch}
  .kicker{font-size:17px;color:var(--muted);margin-top:28px;max-width:46ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;line-height:1.5;padding:14px 0;border-top:1px solid var(--rule);display:flex;gap:16px;max-width:44ch}
  li:last-child{border-bottom:1px solid var(--rule)}
  li .n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:20px;min-width:28px}
  .pillars{display:grid;grid-template-columns:1fr;gap:18px;margin-top:14px}
  .pillar{background:var(--panel);border-left:3px solid var(--accent);padding:22px 26px;max-width:52ch}
  .pillar p{color:var(--muted);font-size:18px;margin:6px 0 0}
  .foot{position:absolute;bottom:26px;left:68px;right:68px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .foot .brand{color:var(--accent);font-weight:600}
  .cta-box{background:var(--panel);border:1px solid var(--rule);padding:30px 34px;max-width:52ch;margin-top:18px}
  .cta-box .step{font-size:19px;color:var(--ink);padding:9px 0}
  .disc{font-size:13px;color:#8a7f6b;margin-top:24px;max-width:56ch;line-height:1.5}
  .quote{font-family:var(--display);font-style:italic;font-size:30px;line-height:1.3;max-width:26ch;color:var(--ink)}
  @media(max-width:700px){.slide{padding:44px 30px;min-height:460px}h1{font-size:40px}h2{font-size:30px}.big{font-size:32px}.slide::before{left:30px}.foot{left:30px;right:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',eyebrow:'A Live Masterclass with Myra Golden',h:'The 3R Method',sub:'How to de-escalate any customer in under a minute, without empty empathy.'},

  {t:'promise',eyebrow:'What you will leave with',h2:'By the end of this hour',body:'You will have a repeatable structure you can hand a brand-new rep on Monday and hear on the floor by Friday. Not a script they abandon at the first pushback. A structure that holds when the customer is yelling, when the policy says no, and when the call has already been transferred twice.'},

  {t:'who',eyebrow:'Who this is for',h2:'The leader standing on the floor',body:'Contact center directors, customer care and consumer affairs leaders, QA and workforce leaders, and the supervisors who own escalations and handle time. If your newest rep takes your hardest call, this hour is built for you.'},

  {t:'trap',eyebrow:'The trap',h2:'More patience is not a plan',body:'The usual fix for hard calls is a reminder to "be more empathetic" and a fresh script. Then the first refusal of the day lands on a rep who started last week, the conversation spirals, and the supervisor queue fills. Empathy phrases without structure are just nicer words on the way to the same escalation.'},

  {t:'reframe',eyebrow:'The reframe',big:'People do not rise to their training. They sink to their structure.',kicker:'Under pressure, nobody remembers the course. They fall back to whatever structure they have, or to none. The job is not more training hours. It is installing a structure small enough to hold on a live call.'},

  {t:'part',eyebrow:'Part One',h2:'Why calls escalate',body:'An escalation is not random and it is not really about the refund. It begins at three predictable moments, and a rep who knows them in advance can intercept the spiral before it starts.'},

  {t:'spiral',eyebrow:'Part One',h2:'The Three Spiral Moments',list:[
    {n:'01',txt:'The moment the customer feels unheard, before you have said anything wrong.'},
    {n:'02',txt:'The moment you deliver the limit, the no, the policy, the wait.'},
    {n:'03',txt:'The moment the customer decides you are not on their side.'}
  ],kick:'Miss these and you are de-escalating a fire. Catch them and there is no fire to fight.'},

  {t:'part',eyebrow:'Part Two',h2:'The structure itself',body:'Three moves, always in this order. You do not resolve first and reassure later. You Regulate, then Redirect, then Resolve. The order is the method.'},

  {t:'pillars',eyebrow:'Part Two',h2:'The 3R Conversation Control Method',pillars:[
    {h:'Regulate',p:'Before redirecting and before resolving, stabilize the emotional state of the call. Not with empty empathy phrases, with language that lands.'},
    {h:'Redirect',p:'Once the call is stable, take back control. Quietly, without a fight. The customer does not notice the redirection happening.'},
    {h:'Resolve',p:'Resolve the call cleanly, even when you cannot give the customer what they want. The answer can be no, and the close can still be clean.'}
  ]},

  {t:'quote',eyebrow:'The principle',quote:'Structure creates confidence. Not the other way around.',kicker:'A rep is not confident because they are calm. They are calm because they have a structure to stand on.'},

  {t:'part',eyebrow:'Part Three',h2:'Watch a refusal become a clean close',body:'Take a return refusal, the hardest version, the customer who has already decided they are owed. Policy says no. Watch the no go from policy-speak to a close the customer accepts, in under a minute, with the structure underneath it so your team can do it on purpose, every time.'},

  {t:'contrast',eyebrow:'Part Two',h2:'Empathy phrases are not regulation',body:'"I understand how you feel" lands as a script and the customer knows it. Regulation is language that proves you heard the specific thing they said and moves the call forward. One performs caring. The other changes the temperature. The 3R language is the second kind, every time.'},

  {t:'dayone',eyebrow:'Part Two',h2:'Ready a new hire in one shift',body:'You cannot train a seasonal rep to ready in three weeks, and the floor will not wait. So you do not try. You hand them a smaller, ordered, triggered structure they can hold on the first call, and a way to rehearse it before the customer is real. Structure installs in a shift. Instinct takes years.'},

  {t:'desk',eyebrow:'Part Three',h2:'The return desk is a retention desk',body:'Every refused return and delayed order is a conversation worth the customer’s lifetime value. The alternative to a clean no is a dispute filed from the customer’s phone. The rep is the only thing standing between a complaint and a chargeback. The 3R close is how they hold it.'},

  {t:'why',eyebrow:'Why me',h2:'Twenty-five years on the frontline',body:'Eleven years on a retail sales floor, then running contact centers, then global head of consumer affairs for a Fortune 500 company. Twenty-five years since training the frontlines at Walmart, Coca-Cola, McDonald’s, Frito-Lay, Amazon, and three NFL franchises. I have watched peak season from all three chairs.'},

  {t:'trust',eyebrow:'Where it has held',h2:'Installed on real floors',body:'The frontline teams at Walmart, Coca-Cola, McDonald’s, Frito-Lay, Amazon, Fabletics, Lincoln Financial, and the Jacksonville Jaguars have run this structure. 3.2 million professionals trained. 4.8 of 5 across more than 6,700 reviews. The structure travels because it does not depend on the person, it depends on the order of the moves.'},

  {t:'result',eyebrow:'What the structure does',big:'19 minutes to 4.',kicker:'Up to a 75 percent reduction in average handle time at one utility client, with The 3R Conversation Control Method. Shorter conversations, fewer escalations, calmer reps.'},

  {t:'cta',eyebrow:'Your next step',h2:'Install it with your team',steps:[
    'Start free: try Module One of the De-escalation Academy, no credit card.',
    'License the full 3R Conversation Control System for your whole team, perpetual, unlimited internal use.',
    'Or bring me in for a live onsite or virtual session built around your floor.'
  ],cta:'Confidence in Every Conversation. Even the ones in December.',disc:'Educational content only. Results described reflect specific client outcomes and are not a guarantee; your results will vary with your team, your volume, and your implementation.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead" style="margin-top:22px">${s.sub}</p>`;}
  else if(s.big){h+=`<div class="big">${s.big}</div>`+(s.kicker?`<div class="kicker">${s.kicker}</div>`:'');}
  else if(s.quote){h+=`<div class="quote">“${s.quote}”</div>`+(s.kicker?`<div class="kicker">${s.kicker}</div>`:'');}
  else{
    if(s.h2) h+=`<h2>${s.h2}</h2>`;
    if(s.body) h+=`<p>${s.body}</p>`;
    if(s.list){h+='<ul>';s.list.forEach(x=>h+=`<li><span class="n">${x.n}</span><span>${x.txt}</span></li>`);h+='</ul>';if(s.kick)h+=`<div class="kicker">${s.kick}</div>`;}
    if(s.pillars){h+='<div class="pillars">';s.pillars.forEach(x=>h+=`<div class="pillar"><h3>${x.h}</h3><p>${x.p}</p></div>`);h+='</div>';}
    if(s.steps){h+='<div class="cta-box">';s.steps.forEach(x=>h+=`<div class="step">${x}</div>`);h+='</div>';}
    if(s.cta) h+=`<p class="lead" style="margin-top:20px;color:var(--accent);font-family:var(--display)">${s.cta}</p>`;
    if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  }
  h+=`<div class="foot"><span class="brand">Myra Golden &middot; The 3R Conversation Control Method</span><span>${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span></div>`;
  el.innerHTML=h;deck.appendChild(el);
});
</script>
</body>
</html>
