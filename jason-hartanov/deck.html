<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Right-Fit Advisor — Jason Hartanov</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Vollkorn:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1b2a;
  --panel:#13263b;
  --rule:#2b3e54;
  --accent:#778da9;
  --ink:#fcfcfc;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Oswald',sans-serif;-webkit-font-smoothing:antialiased}
.deck{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:60px 56px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.kick{font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
h1{font-family:'Vollkorn',Georgia,serif;font-weight:700;font-size:58px;line-height:1.08;letter-spacing:-.01em}
h2{font-family:'Vollkorn',Georgia,serif;font-weight:700;font-size:42px;line-height:1.12;margin-bottom:10px}
.sub{font-size:25px;font-weight:400;color:#c3cdda;margin-top:26px;line-height:1.5;max-width:90%}
.lead{font-size:30px;font-weight:400;line-height:1.46;color:#eef2f7;max-width:92%}
.big{font-family:'Vollkorn',Georgia,serif;font-weight:700;font-size:50px;line-height:1.14}
.big .a{color:var(--accent)}
.pres{margin-top:40px;font-size:20px;letter-spacing:.04em;color:var(--accent);font-weight:600}
.part-no{font-family:'Vollkorn',Georgia,serif;font-size:22px;color:var(--accent);letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
ul{list-style:none;margin-top:30px}
li{font-size:24px;line-height:1.4;padding:16px 0 16px 42px;position:relative;border-top:1px solid var(--rule);color:#dde4ec}
li:first-child{border-top:none}
li::before{content:'';position:absolute;left:0;top:26px;width:20px;height:20px;border:2px solid var(--accent);border-radius:6px}
.pillar{display:inline-block;font-size:17px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--bg);background:var(--accent);border-radius:100px;padding:9px 20px;margin-bottom:22px}
.name{font-family:'Vollkorn',Georgia,serif;font-size:30px;font-weight:700;color:var(--accent)}
.stat{font-size:23px;line-height:1.5;color:#dde4ec;padding:14px 0;border-top:1px solid var(--rule)}
.stat:first-child{border-top:none}
.stat b{color:var(--ink);font-weight:600}
.disc{margin-top:34px;font-size:16px;color:#90a0b2;line-height:1.5;max-width:88%}
.cta-step{font-size:27px;color:#eef2f7;margin-top:22px;line-height:1.5}
.num{font-family:'Vollkorn',Georgia,serif;font-size:116px;font-weight:700;color:var(--accent);opacity:.18;position:absolute;right:40px;top:20px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
 {t:'title', kick:'A live masterclass for financial advisors', h:'The Right-Fit Advisor', sub:'How to Attract and Qualify High-Value Clients Without Chasing', pres:'Jason Hartanov · Elite Advisor Academy'},
 {t:'whofor', kick:'Who this is for', h:'You are good at the work. Growth is the grind.', sub:'For the advisor who is producing, somewhere around a steady book, and who has hit a ceiling that more hours are not lifting.'},
 {t:'trap', kick:'The trap', h:'More leads has not fixed it.', lead:'So you do more. More calls, more coffees, more introductions you chase down. The calendar fills with people who were never going to say yes, and the plateau stays exactly where it was.'},
 {t:'reframe', big:'You do not have a lead problem. You have a <span class="a">qualification problem.</span>'},
 {t:'part', no:'Part One', h:'Why chasing fails'},
 {t:'cost', kick:'The real cost', h:'Every unqualified prospect costs you twice.', sub:'Once in the hour you will never get back, and again in the discount or the over-service you offer to rescue a fit that was wrong from the start. Volume does not scale a practice. It drains one.'},
 {t:'shift', kick:'The shift', h:'Attract fewer. Attract better.', lead:'The advisors who break the ceiling stop trying to be chosen by everyone. They build a front end that makes the right prospect lean in and lets the wrong one quietly move on.'},
 {t:'part', no:'Part Two', h:'The Client Attraction System'},
 {t:'framework', kick:'The system', h:'Three pillars, in order.', sub:'Attract, Invite, Qualify. Each one does a job the next one depends on, so by the time a prospect reaches your calendar they are already most of the way sold.'},
 {t:'pillar', p:'Pillar One: Attract', name:'The Signature Statement', lead:'One sharp line that says exactly who you serve and the outcome you create. The right prospect reads it and thinks that is me. The wrong one reads it and self-selects out, before either of you spends a minute.'},
 {t:'pillar', p:'Pillar Two: Invite', name:'The Enticing Invite Formula', lead:'How you invite a qualified prospect into a first conversation without pitching, without discounting, and without chasing. The invitation does the positioning so you do not have to.'},
 {t:'pillar', p:'Pillar Three: Qualify', name:'The QualCall System', lead:'A short, structured fit call that screens for the right client before you invest the real hour. You protect your time, and the prospect feels the standard, which is exactly what a high-value client is looking for.'},
 {t:'compound', kick:'Why it compounds', h:'A pipeline that pre-qualifies itself.', sub:'When the front end is doing its job, the people who reach you are already the right people. Close rates climb, discounting stops, and your capacity goes only to clients worth serving.'},
 {t:'part', no:'Part Three', h:'Inside a right-fit practice'},
 {t:'week', kick:'A week in a right-fit practice', h:'Fewer calls. Better ones.', lead:'You are not working a longer week. You are working a cleaner one: a handful of fit calls with people who already understand what you do and why it is worth it.'},
 {t:'proof', kick:'What advisors have done', h:'Their own numbers.', stats:['<b>Danielle Barak</b> added 97 qualified prospects and doubled her premium in a year.','<b>Daniel Shahmoradian</b> doubled his premium from $400k to $800k in under a year.','<b>David Miller</b> grew from $260k to $2.8M over six years.']},
 {t:'credibility', kick:'Why me', h:'Jason Hartanov', lead:'Twenty-five years in personal and professional development, named Most Innovative Speaker in 2015, and founder of the Elite Advisor Academy. A recovering burned-out executive who built the system he wishes he had, then taught it to the advisors who needed it.'},
 {t:'path', kick:'The path', h:'Where this goes next.', sub:'The LaunchPad walks you through the full Client Attraction System over twelve weeks, with live coaching and the scripts and templates to put it in place. The Elite Advisor Academy is the private, one-to-one version for advisors who want it built with them.'},
 {t:'recap', kick:'In one line', big:'Attract the right one. Invite them in. <span class="a">Qualify before you spend the hour.</span>'},
 {t:'cta', kick:'Your next step', h:'Build your right-fit practice.', step:'If this is the way you want to grow, the next step is a conversation about which program fits where you are. Bring your book, your ceiling, and the kind of client you actually want more of.', disc:'This masterclass is educational. No income or result is guaranteed. Results vary and depend on your market, your effort, and the work you put in.'}
];

const el = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'slide';
  let inner = '';
  if (s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if (s.no) inner += `<div class="part-no">${s.no}</div>`;
  if (s.p) inner += `<div class="pillar">${s.p}</div>`;
  if (s.big) inner += `<div class="big">${s.big}</div>`;
  if (s.h) inner += `<h1>${s.h}</h1>`;
  if (s.name) inner += `<div class="name">${s.name}</div>`;
  if (s.lead) inner += `<p class="lead">${s.lead}</p>`;
  if (s.sub) inner += `<p class="sub">${s.sub}</p>`;
  if (s.pres) inner += `<div class="pres">${s.pres}</div>`;
  if (s.stats) inner += s.stats.map(x => `<div class="stat">${x}</div>`).join('');
  if (s.step) inner += `<p class="cta-step">${s.step}</p>`;
  if (s.disc) inner += `<p class="disc">${s.disc}</p>`;
  if (s.t === 'part' || s.t === 'reframe' || s.t === 'recap') inner += `<div class="num">${String(i+1).padStart(2,'0')}</div>`;
  d.innerHTML = inner;
  el.appendChild(d);
});
</script>
</body>
</html>
