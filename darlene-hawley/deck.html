<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Say It Better | A Masterclass with Darlene Hawley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f3f6f5; --panel:#fdfefe; --rule:#dce7e7;
    --ink:#2d2d2d; --ink-soft:#4f4f4f; --ink-muted:#7d7a74;
    --accent:#5eacb5; --accent-deep:#2b6b73; --hot:#ec008c;
    --head:'Raleway',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
  }
  html{-webkit-font-smoothing:antialiased}
  body{background:#edece7;color:var(--ink);font-family:var(--body);line-height:1.6}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:64px 64px;margin:0 auto 26px;min-height:540px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:28px;font-family:var(--head);font-size:12px;
    letter-spacing:.14em;color:var(--ink-muted)}
  .kick{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent-deep);margin-bottom:20px}
  h1{font-family:var(--head);font-weight:800;font-size:54px;line-height:1.08;
    letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.14;
    letter-spacing:-.01em;color:var(--ink);margin-bottom:20px}
  h3{font-family:var(--head);font-weight:700;font-size:26px;color:var(--ink);margin-bottom:12px}
  p{font-size:20px;color:var(--ink-soft);margin-bottom:14px;max-width:46ch}
  p.lead{font-size:23px;color:var(--ink);max-width:40ch}
  .big{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.12;
    letter-spacing:-.01em;color:var(--ink);max-width:22ch}
  .big .a{color:var(--accent-deep)}
  .big .strike{color:var(--ink-muted);text-decoration:line-through;text-decoration-color:var(--hot);
    text-decoration-thickness:3px}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;color:var(--ink-soft);padding:12px 0 12px 34px;position:relative;
    border-bottom:1px solid var(--rule);max-width:52ch}
  li:last-child{border-bottom:none}
  li::before{content:'';position:absolute;left:0;top:20px;width:16px;height:3px;
    border-radius:3px;background:var(--accent)}
  .part-label{font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--accent-deep);margin-bottom:14px}
  .steps{display:flex;gap:18px;margin-top:22px;flex-wrap:wrap}
  .step{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--rule);
    border-radius:12px;padding:24px}
  .step .n{font-family:var(--head);font-weight:800;font-size:28px;color:var(--accent)}
  .step h3{font-size:21px;margin:8px 0 8px}
  .step p{font-size:16px;margin:0}
  .wave{display:flex;align-items:flex-end;gap:6px;height:70px;margin-bottom:28px}
  .wave span{width:8px;border-radius:4px;background:var(--accent);opacity:.9}
  .cred{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
  .chip{font-family:var(--head);font-weight:600;font-size:14px;color:var(--accent-deep);
    background:#eaf5f6;border:1px solid #d3e9eb;border-radius:999px;padding:8px 16px}
  .foot{font-family:var(--head);font-size:13px;letter-spacing:.06em;color:var(--ink-muted);
    margin-top:30px}
  .disc{font-size:13px;color:var(--ink-muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .cta-slide{background:linear-gradient(160deg,#f4fafb 0%,#fbfbf9 60%)}
  .cta-slide h1{font-size:46px}
  .ctabtn{display:inline-block;font-family:var(--head);font-weight:700;font-size:18px;
    color:#fff;background:var(--accent-deep);padding:16px 30px;border-radius:10px;margin-top:10px}
  @media(max-width:720px){.slide{padding:40px 28px;min-height:auto}h1{font-size:36px}
    h2{font-size:28px}.big{font-size:32px}.cta-slide h1{font-size:34px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
  const ACCENT = '#5eacb5';
  const S = [
    {t:'title', kick:'A live masterclass with Darlene Hawley',
     h:'Say It Better', lead:'How to trust your voice when the stakes are high.',
     foot:'Executive communication & leadership · darlenehawley.com'},

    {t:'who', kick:'Who this is for',
     h:'You know your stuff. The room still gets the better of you.',
     items:['The board presentation where your mind goes blank',
            'The client pitch where you over-rehearse and still freeze',
            'The meeting where you stay quiet, then replay it for hours']},

    {t:'hook', big:'Knowing what to say was <span class="strike">never</span> <span class="a">your problem.</span>',
     p:'Trusting yourself to say it, in the moment, when it counts, is.'},

    {t:'part', label:'Part One', h:'Why practicing harder has not fixed it'},

    {t:'body', kick:'The trap', h:'Expertise is not the same as execution.',
     p:'You are great at what you do. But being great at what you do is not enough if the people in the room never see it clearly. The gap is not knowledge. It is what happens to you under pressure.'},

    {t:'body', kick:'The real mechanism', h:'This is a nervous-system problem, not a script problem.',
     p:'When the stakes spike, your body does too. The heart races, the breath gets shallow, the mind goes quiet. No amount of extra rehearsal reaches that, because rehearsal lives in your head and the freeze lives in your body.'},

    {t:'body', kick:'The voice in the room', h:'Meet the inner critic.',
     p:'There is a second voice that shows up right before you speak. Do not mess this up. They will see through you. It is loud, it is fast, and it is the reason the words you prepared do not come out the way you meant them.'},

    {t:'part', label:'Part Two', h:'The Say It Better method'},

    {t:'steps', kick:'Inner game and outer game, together',
     h:'Three moves, in order',
     steps:[
       {n:'01', h:'Settle', p:'Regulate the nervous system first so your mind stays clear when the pressure hits.'},
       {n:'02', h:'Quiet the critic', p:'Turn the volume down on the inner voice so it stops hijacking the moment.'},
       {n:'03', h:'Say it like you', p:'Find the words that feel like you, not a borrowed script, so you sound like yourself.'}]},

    {t:'body', kick:'Why this order matters', h:'You cannot think your way out of a body response.',
     p:'Most communication training starts at move three, the words, and skips the two that actually decide whether you can deliver them. Settle first, quiet the critic second, and the words you already have finally have room to land.'},

    {t:'body', kick:'Not scripts', h:'Rehearsal of the moment, not memorization of lines.',
     p:'Knowing what to do is one thing. Trusting yourself enough to do it when the moment comes is another. So we practice the real moment, the actual meeting, the actual pitch, until your body believes it before you walk in.'},

    {t:'part', label:'Part Three', h:'When it counts: the room, handled'},

    {t:'who', kick:'The same you, in the room',
     h:'Confidence that shows up when it counts.',
     items:['You present to the board and stay clear, even when a question lands sideways',
            'You pitch the client and sound like yourself, not a rehearsed version of you',
            'You speak up in the meeting, once, cleanly, and do not replay it that night']},

    {t:'cred', kick:'Why me', h:'Twenty years helping leaders find their voice.',
     p:'I am Darlene Hawley. I coach executives, leaders, and entrepreneurs on the conversations that matter most, from leading and presenting to selling, pitching, and speaking up when the stakes are high.',
     chips:['20 years in business & communication','Past President, ICF Nevada','Host, Attract & Stand Out podcast','Spoken for CVS, Bank of America, UNLV']},

    {t:'recap', kick:'The through-line', h:'Say it better.',
     items:['Settle the nervous system so your mind stays clear',
            'Quiet the inner critic that hijacks the moment',
            'Find the words that actually feel like you']},

    {t:'cta', kick:'Your next step', h:'Ready to trust your voice in the room?',
     p:'If this is the work you want to do, let us talk. We will look at the moments that matter most to you right now and map what it would take to walk in settled, clear, and sounding like yourself.',
     btn:'Book a strategy call with Darlene',
     disc:'Educational content only. No outcome is guaranteed and results vary by individual, effort, and circumstance. Nothing here is a promise of specific results, income, or career outcomes.'}
  ];

  function waveHTML(){
    const h=[18,34,52,70,48,30,58,40,22,36,60,44,26];
    return '<div class="wave">'+h.map(v=>`<span style="height:${v}px"></span>`).join('')+'</div>';
  }
  const deck=document.getElementById('deck');
  S.forEach((s,i)=>{
    const d=document.createElement('section');
    d.className='slide'+(s.t==='cta'?' cta-slide':'');
    let inner='<span class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</span>';
    if(s.kick) inner+='<div class="kick">'+s.kick+'</div>';
    if(s.t==='title'){ inner=waveHTML()+inner+'<h1>'+s.h+'</h1><p class="lead">'+s.lead+'</p><div class="foot">'+s.foot+'</div>'; }
    else if(s.t==='hook'){ inner+='<p class="big">'+s.big+'</p><p class="lead" style="margin-top:20px">'+s.p+'</p>'; }
    else if(s.t==='part'){ inner+='<div class="part-label">'+s.label+'</div><h2>'+s.h+'</h2>'; }
    else if(s.t==='who'||s.t==='recap'){ inner+='<h2>'+s.h+'</h2><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
    else if(s.t==='steps'){ inner+='<h2>'+s.h+'</h2><div class="steps">'+s.steps.map(st=>'<div class="step"><div class="n">'+st.n+'</div><h3>'+st.h+'</h3><p>'+st.p+'</p></div>').join('')+'</div>'; }
    else if(s.t==='cred'){ inner+='<h2>'+s.h+'</h2><p>'+s.p+'</p><div class="cred">'+s.chips.map(c=>'<span class="chip">'+c+'</span>').join('')+'</div>'; }
    else if(s.t==='cta'){ inner+='<h1>'+s.h+'</h1><p>'+s.p+'</p><div class="ctabtn">'+s.btn+'</div><p class="disc">'+s.disc+'</p>'; }
    else { inner+='<h2>'+s.h+'</h2><p>'+s.p+'</p>'; }
    d.innerHTML=inner;
    deck.appendChild(d);
  });
</script>
</body>
</html>
