<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The 15-Minute Marketing Plan · Lauren Tilden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fdfbf6; --panel:#fff5f1; --rule:#f0d9d1;
    --acc:#ff746d; --pop:#c9dd4f; --ink:#1f1b18; --body:#544d47; --dim:#9a8f86;
  }
  html,body{height:100%}
  body{background:#e9e4dc;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9e4dc}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Poppins',sans-serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:-.01em}
  .t-title h1{font-size:4.3vw;max-width:90%}
  .t-title h1 .a{color:var(--acc)}
  .t-normal h1{font-size:3.2vw;max-width:86%}
  .t-normal h1 .a{color:var(--acc)}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.5vw;color:var(--body);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-family:'Inter',sans-serif;font-size:1.8vw;color:var(--body);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.3vw;font-weight:600;color:var(--acc);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:15vw;height:6px;border-radius:6px;background:var(--acc);margin-top:3.4vh}
  .t-section .rule i{display:block;width:5vw;height:6px;border-radius:6px;background:var(--pop)}
  .t-dark{background:var(--acc);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:#fff8f5}
  .t-dark h1 .a{color:var(--pop)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%}
  .t-cta h1 .a{color:var(--acc)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Poppins',sans-serif;background:var(--acc);color:#fff8f5;border-radius:100px;padding:1.5vh 1.9vw;font-size:1.22vw;font-weight:600}
  .chip.ghost{background:transparent;border:2px solid var(--acc);color:var(--acc)}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .heart-motif{position:absolute;pointer-events:none}
  .title-heart{right:8%;bottom:9%;width:20vw;opacity:.95}
  .corner-heart{right:6.5%;bottom:8%;width:8vw;opacity:.5}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.32vw;color:var(--body);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Making Good</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- heart + spark motif: a soft hand-drawn heart with a small spark, from the Making Good / Marketing With Heart world -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="heart" viewBox="0 0 240 200">
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 176 C40 122 34 66 70 44 C98 27 120 52 120 68 C120 52 142 27 170 44 C206 66 200 122 120 176 Z" stroke="#ff746d"/>
    <path d="M196 40 l10 -22 M212 52 l20 -8 M204 74 l22 4" stroke="#c9dd4f" stroke-width="5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The 15-Minute <span class="a">Marketing Plan</span>',sub:'How to market a small business without the overwhelm, so more of the right people find the good work you already make.',brand:true,heart:'title'},
 {t:'normal',k:'Who this is for',title:'You make good things. Marketing is the part that never gets done.',body:'You run a small creative or product business. You are the maker, the shipper, the bookkeeper, and the marketer, all at once. So marketing slides to the bottom of the list, week after week.'},
 {t:'dark',title:'Marketing does not fail because you did too little. It fails because there was no plan to <span class="a">repeat</span>.'},

 {t:'section',idx:'Part One',title:'Why Marketing Feels Impossible'},
 {t:'normal',k:'More is not a strategy',title:'Another platform, another trend, another thing to keep up with.',body:'Every week there is a new format you are supposed to master. Chasing all of it is not a marketing strategy. It is just a faster way to burn out and still feel behind.'},
 {t:'normal',k:'The guilt loop',title:'Posting from guilt drains you and rarely sells.',body:'When there is no plan, marketing becomes a nagging feeling instead of a decision. You post something to quiet the guilt, it does little, and the whole thing feels pointless.'},
 {t:'dark',title:'You do not need to do more. You need a plan you can actually <span class="a">keep</span>.'},

 {t:'section',idx:'Part Two',title:'The 15-Minute Marketing Plan'},
 {t:'normal',k:'Step one',title:'Start with one clear goal, not ten.',body:'Pick the single result that matters most this season, more email subscribers, more repeat customers, one product launched well. One goal makes every other decision simpler.'},
 {t:'normal',k:'Step two',title:'Choose the few actions that actually move it.',body:'You do not need to be everywhere. You need the two or three things that reach your people and fit your life. Everything else is optional, and most of it you can drop.'},
 {t:'normal',k:'Step three',title:'Build a weekly routine you can run in 15 minutes.',body:'A short, repeatable rhythm beats a heroic burst you cannot sustain. When the plan fits inside a real week, you keep it, and consistency is what compounds.'},
 {t:'normal',k:'Marketing with heart',title:'Market with heart, and selling stops feeling salesy.',body:'Your marketing can share what you stand for, not just what you sell. A handful of honest, values-first prompts give you content that sounds like you and builds the kind of trust that lasts.'},
 {t:'dark',title:'Marketing can do more than make sales. It can stand for <span class="a">something</span>.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The business this builds',title:'Consistent beats clever, every single time.',body:'When marketing is a simple routine instead of a scramble, the right people start finding you on purpose. Not from one viral moment, but from showing up in a way you can keep up.'},
 {t:'normal',k:'Why Lauren',title:'A marketer who has actually run the businesses.',body:'Lauren Tilden spent eight years in corporate marketing, then left to build her own product businesses and run a retail shop for five years. She now teaches thousands of small business owners on the Making Good podcast, five years and hundreds of episodes in.'},
 {t:'dark',title:'The businesses that get known are the ones that show up on <span class="a">purpose</span>.'},

 {t:'section',idx:'Your Next Step',title:'Keep Going'},
 {t:'normal',k:'Making Good Happen',title:'A membership that keeps the plan going with you.',body:'Making Good Happen is a monthly membership and community for small business owners: a guided marketing plan, work sessions, expert trainings, and a room full of owners doing the dang thing alongside you. It is where the 15-minute plan becomes a habit.'},
 {t:'cta',title:'Ready to make marketing feel simple?',chips:['Join Making Good Happen','Start with the free workshop'],disc:'Educational content for small business owners. No income or business result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function heart(kind){return `<svg class="heart-motif ${kind==='title'?'title-heart':'corner-heart'}"><use href="#heart"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"><i></i></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Making <b>Good</b> · Lauren Tilden</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map((c,ci)=>`<div class="chip${ci?' ghost':''}">${c}</div>`).join('')+`</div>`;
  }
  if(s.heart) h+=heart(s.heart);
  else if(s.t==='title') h+=heart('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
