<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healthy Leaders, Thriving Teams | Forward Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;      /* brand.json body bg rgb(255,255,255) */
    --ink:#141414;     /* brand.json text, near-black */
    --panel:#f5f4ef;   /* soft off-white */
    --rule:#e4e2da;
    --accent:#fddb00;  /* brand.json ranked accent, 12 uses (footer) */
    --muted:#5c5a52;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:"Source Serif 4",Georgia,serif}
  .deck{max-width:1040px;margin:0 auto;padding:48px 20px 96px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:64px 60px;margin:0 0 28px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .eyebrow{font-family:"Montserrat",sans-serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--muted);margin-bottom:22px}
  .accentbar{width:64px;height:8px;background:var(--accent);border-radius:4px;margin-bottom:26px}
  h1{font-family:"Montserrat",sans-serif;font-weight:800;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:"Montserrat",sans-serif;font-weight:800;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  .lead{font-size:24px;line-height:1.5;margin-top:22px;max-width:40ch}
  .big{font-family:"Montserrat",sans-serif;font-weight:800;font-size:46px;line-height:1.14;max-width:22ch}
  p{font-size:21px;line-height:1.6;margin-top:16px;max-width:54ch;color:var(--ink)}
  .muted{color:var(--muted)}
  ul{margin-top:26px;list-style:none}
  li{font-size:22px;line-height:1.5;padding:16px 0 16px 42px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:26px;width:18px;height:18px;
    background:var(--accent);border-radius:3px;transform:rotate(45deg)}
  li b{font-family:"Montserrat",sans-serif;font-weight:700}
  .part-num{font-family:"Montserrat",sans-serif;font-weight:800;font-size:150px;color:var(--accent);
    line-height:.8;letter-spacing:-.04em}
  .quote{font-family:"Montserrat",sans-serif;font-weight:700;font-size:46px;line-height:1.18;max-width:20ch}
  .quote .accent{color:var(--accent)}
  .foot{position:absolute;left:60px;bottom:26px;font-family:"Montserrat",sans-serif;
    font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted)}
  .pagen{position:absolute;right:60px;bottom:26px;font-family:"Montserrat",sans-serif;font-size:12px;color:var(--muted)}
  .cta .lead{max-width:44ch}
  .disc{margin-top:30px;font-size:14px;line-height:1.5;color:var(--muted);max-width:60ch}
  .kick{font-family:"Montserrat",sans-serif;font-weight:700;color:var(--accent);font-size:18px;letter-spacing:.04em;margin-bottom:10px}
  @media(max-width:720px){.slide{padding:40px 26px;min-height:auto}h1{font-size:38px}h2{font-size:30px}.big{font-size:32px}.part-num{font-size:96px}.quote{font-size:32px}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const BRAND = "Forward Partners";
const S = [
  {t:'title', eyebrow:'A live masterclass with Forward Partners',
    h:'Healthy Leaders, Thriving Teams',
    lead:'How to lead a team that thrives, without burning yourself out in the process.'},

  {t:'agenda', eyebrow:'Who this is for',
    h:'This hour is for the leader who feels it',
    items:[
      'You were promoted to lead, and expected to figure the people part out on your own.',
      'The calendar is full, the tank is empty, and you can feel the team starting to fray.',
      'You keep pushing harder, and it keeps costing more than it gives back.']},

  {t:'statement', eyebrow:'The trap',
    kick:'Here is the quiet problem',
    big:'You are trying to pour energy into your team from a cup that is already empty.',
    p:'Almost every leadership resource points outward: hit the goal, manage the team, drive the result. Almost none of them ask the question underneath it. Are we okay burning people out to get there?'},

  {t:'quote', eyebrow:'The reframe',
    q:['You cannot lead a healthy team', 'from an ', 'unhealthy place.'],
    accentIndex:2,
    p:'Leadership health cascades. A burned-out leader, no matter how skilled, slowly produces a burned-out team. The good news hides in the same sentence: health cascades too.'},

  {t:'part', num:'1', eyebrow:'Part one', h:'Burnout is a leadership problem, not a wellness afterthought'},

  {t:'list', eyebrow:'Part one', h:'The two signs you learn to catch early',
    items:[
      '<b>Hopelessness.</b> The sense that effort no longer changes the outcome. Burnout is, underneath it all, a lack of hope.',
      '<b>Overwhelm.</b> Too much coming at you, nowhere to put it down, no edge to the day.',
      'Caught early in yourself, both are reversible. Ignored, they quietly set the ceiling for your whole team.']},

  {t:'statement', eyebrow:'Part one',
    kick:'Why it spreads',
    big:'Your team reads your state long before they read your strategy.',
    p:'Culture is created in daily practice, not declared in a mission statement. The pace you keep, the way you show up under pressure, the honesty you allow when someone asks how you are doing. That is what your people copy.'},

  {t:'part', num:'2', eyebrow:'Part two', h:'The Healthy Leadership method: look inward before you lead outward'},

  {t:'list', eyebrow:'Part two',
    h:'Four moves, practiced daily, not steps on a ladder',
    items:[
      '<b>Self-awareness.</b> Notice how you are actually showing up, before the meeting turns or the crisis hits.',
      '<b>Self-reflection.</b> A short, honest, recurring look at your week. Answer "how am I doing?" truthfully.',
      '<b>Pause and rest.</b> Recover hope on purpose. Rest is not the reward for the work, it is part of the work.',
      '<b>Lead outward from health.</b> Only now do you take that steadiness to the team, and unite them around it.']},

  {t:'statement', eyebrow:'Part two',
    kick:'The daily discipline',
    big:'Self-reflection is the one habit that keeps every other one honest.',
    p:'A few minutes, on a rhythm. What drained me this week, and why? Where did I lead from fear instead of purpose? Who on my team is running on empty and copying my pace? The questions are simple. Asking them consistently is the whole skill.'},

  {t:'statement', eyebrow:'Part two',
    kick:'The engine behind it',
    big:'Strategy, purpose, and coaching, pointed first at the leader.',
    p:'Most development narrows in on tactics. This narrows in on your values and your mission first, so the tactics finally have something solid to stand on. Narrow in on what matters, name the mission, then lead it with minimal burnout.'},

  {t:'part', num:'3', eyebrow:'Part three', h:'What a healthy leader, and a healthy team, actually look like'},

  {t:'list', eyebrow:'Part three', h:'The shift you can expect to see',
    items:[
      'You end most weeks with something left in the tank, instead of nothing.',
      'Hard conversations happen earlier, because you are not too depleted to have them.',
      'The team stops absorbing your stress and starts absorbing your clarity.',
      'People stay, because thriving is contagious in exactly the way burnout is.']},

  {t:'why', eyebrow:'Who is teaching this',
    h:'Chad Wright',
    p:'Founder of Forward Partners, author of <b>Win the Battle Against Burnout</b>, and host of <b>The Leader Lab</b>. Forward Partners exists for one belief: healthy leaders build thriving organizations, and that work starts inward. This masterclass is a short version of what the Healthy Leadership Foundation Course and our coaching partnerships go deep on.'},

  {t:'statement', eyebrow:'The one line to keep',
    kick:'If you remember nothing else',
    big:'Lead yourself first. The thriving team follows the healthy leader.',
    p:'Everything in this hour comes back to the same circle: awareness of others is incomplete without awareness of self.'},

  {t:'cta', eyebrow:'Your next step',
    h:'Start the inward work this week',
    lead:'Begin with the free Self-Reflection and Leadership Health Course, then go deeper with the Healthy Leadership Foundation Course or a coaching conversation about your team.',
    where:'forwardpartners.net',
    disc:'This masterclass is educational. It shares frameworks and principles for healthy leadership and is not a guarantee of any specific result, outcome, income, or business performance. Leadership outcomes vary with your own situation, effort, and context.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const sl = el('section','slide '+(s.t==='cta'?'cta':''));
  if(s.eyebrow) sl.appendChild(el('div','eyebrow',s.eyebrow));
  if(s.t==='title'){ sl.appendChild(el('div','accentbar')); sl.appendChild(el('h1',null,s.h)); sl.appendChild(el('div','lead',s.lead)); }
  else if(s.t==='agenda'){ sl.appendChild(el('h2',null,s.h)); const u=el('ul'); s.items.forEach(x=>u.appendChild(el('li',null,x))); sl.appendChild(u); }
  else if(s.t==='statement'){ if(s.kick) sl.appendChild(el('div','kick',s.kick)); sl.appendChild(el('div','big',s.big)); if(s.p) sl.appendChild(el('p',null,s.p)); }
  else if(s.t==='quote'){ const q=el('div','quote'); s.q.forEach((part,qi)=>{ const sp=el('span',qi===s.accentIndex?'accent':null,part); q.appendChild(sp); }); sl.appendChild(q); if(s.p) sl.appendChild(el('p',null,s.p)); }
  else if(s.t==='part'){ sl.appendChild(el('div','part-num',s.num)); sl.appendChild(el('h2',null,s.h)); }
  else if(s.t==='list'){ sl.appendChild(el('h2',null,s.h)); const u=el('ul'); s.items.forEach(x=>u.appendChild(el('li',null,x))); sl.appendChild(u); }
  else if(s.t==='why'){ sl.appendChild(el('div','accentbar')); sl.appendChild(el('h2',null,s.h)); sl.appendChild(el('p',null,s.p)); }
  else if(s.t==='cta'){ sl.appendChild(el('div','accentbar')); sl.appendChild(el('h2',null,s.h)); sl.appendChild(el('div','lead',s.lead)); if(s.where) sl.appendChild(el('p','muted',s.where)); if(s.disc) sl.appendChild(el('div','disc',s.disc)); }
  sl.appendChild(el('div','foot',BRAND));
  sl.appendChild(el('div','pagen',(i+1)+' / '+S.length));
  deck.appendChild(sl);
});
</script>
</body>
</html>
