<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's Important to Me Now? — a masterclass with Sue Maitland</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f4;        /* warm off-white ground (brand light scheme) */
  --panel:#f1ede5;     /* tint of her tan */
  --rule:#e2dccf;      /* tan rule */
  --ink:#1f2a24;       /* her heading color */
  --body:#4f4a43;      /* her body color */
  --accent:#344235;    /* her forest green */
  --tan:#8a7a68;       /* secondary warm tan */
  --head:'Lora',Georgia,serif;
  --text:'Figtree',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--text);-webkit-font-smoothing:antialiased}
.deck{max-width:960px;margin:0 auto;padding:40px 20px}
.slide{background:var(--bg);border:1px solid var(--rule);border-radius:16px;padding:64px 60px;margin:0 0 28px;
  min-height:540px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  box-shadow:0 10px 30px rgba(52,66,53,.06)}
.slide .num{position:absolute;top:26px;right:30px;font-size:13px;letter-spacing:.14em;color:var(--tan);font-weight:700}
.kick{font-family:var(--text);font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
h1{font-family:var(--head);font-weight:700;font-size:54px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
h2{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.12;color:var(--ink)}
.sub{font-size:23px;line-height:1.5;color:var(--body);margin-top:24px;max-width:88%}
.lead{font-size:27px;line-height:1.45;color:var(--ink);font-weight:400;max-width:90%}
.big{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.15;color:var(--ink);max-width:92%}
.big .a{color:var(--accent)}
.present{margin-top:40px;font-size:19px;color:var(--tan);font-weight:700;letter-spacing:.02em}
.part{font-family:var(--head);font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
.parth{font-family:var(--head);font-weight:700;font-size:50px;color:var(--ink);margin-top:16px}
ul{list-style:none;margin-top:28px}
li{font-size:22px;line-height:1.4;color:var(--body);padding:16px 0 16px 40px;position:relative;border-bottom:1px solid var(--rule)}
li:last-child{border-bottom:none}
li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:16px;border-radius:50%;border:3px solid var(--accent)}
.cols{display:flex;gap:20px;margin-top:34px;flex-wrap:wrap}
.col{flex:1;min-width:210px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 26px}
.col .n{font-family:var(--head);font-weight:700;font-size:21px;color:var(--accent);letter-spacing:.04em}
.col .d{font-size:18px;line-height:1.45;color:var(--body);margin-top:12px}
.wheel{display:flex;align-items:center;justify-content:center;margin-top:10px}
.ctaBox{background:var(--accent);color:#fff;border-radius:16px;padding:54px 50px}
.ctaBox h2{color:#fff}
.ctaBox .sub{color:#eef1ec}
.step{font-family:var(--head);font-weight:700;color:var(--accent);font-size:19px;letter-spacing:.06em}
.disc{margin-top:30px;font-size:14px;line-height:1.5;color:var(--tan);max-width:90%}
.ctaBox .disc{color:#cdd4cc}
.cta-next{display:inline-block;margin-top:30px;background:#fff;color:var(--accent);font-family:var(--head);font-weight:700;
  font-size:20px;padding:16px 30px;border-radius:100px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A free live masterclass', h:"What's Important to Me Now?", sub:"The clarity method for professionals who are successful on paper, and quietly at a crossroads.", present:"with Sue Maitland, PCC · Life & Career Transitions Coach"},
  {t:'who', kick:'Who this is for', big:"You hit the goals. The <span class='a'>feeling</span> didn't follow.", sub:"If you are accomplished, respected, and still a little lost about what is next, you are exactly who this hour is for."},
  {t:'trap', kick:'The trap', lead:"You did everything right. The promotion, the title, the life that looks good from the outside. And somewhere in there, the compass stopped pointing anywhere."},
  {t:'hook', big:"The problem was never <span class='a'>your next step.</span>", sub:"It is that no one taught you how to ask what matters to you now, as the person you have become, not the one who set those goals years ago."},
  {t:'part', part:'Part One', parth:"Why clarity keeps slipping"},
  {t:'list', h:"Three reasons smart people stay stuck", items:["You are deciding from other people's expectations, not your own values","You are optimizing a life you chose a long time ago","You keep waiting for certainty before you will let yourself move"]},
  {t:'cost', kick:'The cost', big:"Another year of <span class='a'>\"fine.\"</span>", sub:"Fine is comfortable, and it is expensive. It quietly spends the years you could have spent aligned."},
  {t:'part', part:'Part Two', parth:"What's Important to Me Now"},
  {t:'three', h:"Everything maps to three things", cols:[{n:"Clarity",d:"Define what matters now, so decisions get easier."},{n:"Confidence",d:"Quiet the self doubt and take bold, aligned action."},{n:"Connection",d:"Build relationships that open the right doors."}]},
  {t:'list', kick:'The method', h:"Start with your Life Wheel, honestly", items:["Map the areas of your life as they really are, not as they should look","Notice the gap between busy and fulfilled","See, on one page, where the energy is leaking"]},
  {t:'list', h:"Prioritize for who you are now", items:["Separate what you value from what you inherited","Name the two or three things that actually matter this season","Give yourself permission to let the rest be smaller"]},
  {t:'lead', kick:'Visualization', lead:"Before you can choose a path, you have to be able to picture aligned. We make it concrete, so your next step stops being a guess and starts being obvious."},
  {t:'part', part:'The arc', parth:"The 3 Steps to an Inspired Life"},
  {t:'three', h:"Not one leap. Three moves, in order.", cols:[{n:"1 · Discover",d:"what fuels you, the values and strengths under the surface"},{n:"2 · Grow",d:"what moves you, building the confidence to act on it"},{n:"3 · Do",d:"what inspires you, taking aligned action in the real world"}]},
  {t:'list', step:'Step 1', h:"Discover what fuels you", items:["Your values, named plainly","Your strengths, the ones you discount","The thread that has always been there"]},
  {t:'list', step:'Step 2', h:"Grow what moves you", items:["Meet the inner critic without obeying it","Build evidence that you can trust yourself","Replace hustle with sustainable momentum"]},
  {t:'list', step:'Step 3', h:"Do what inspires you", items:["One aligned next step, not a hundred","A way to keep going when it gets hard","A life that feels like yours again"]},
  {t:'part', part:'Part Three', parth:"Deciding from solid ground"},
  {t:'lead', kick:'The shift', lead:"You stop auditioning for a life and start living one. Decisions come from a grounded place. The question stops being what should I do, and becomes what is true for me now."},
  {t:'why', kick:'Why me', h:"I have sat in your chair", sub:"ICF PCC certified coach, 13 years guiding transitions, after 20 plus years leading in tech. I built Connect & Thrive because I had the career that looked right and still had to ask myself this exact question. Clients have come from Nike, Microsoft, Nestlé and Remax."},
  {t:'cta', h:"Ready to find out what's important to you now?", sub:"If this hour gave you one honest answer, imagine what a focused conversation could do. Start with a Clarity Call, and we will map your next right step together.", next:"Book your Clarity Call at suemaitland.com", disc:"This masterclass is offered for educational purposes only. Every person's path is different; nothing here is a promise or guarantee of any particular result. Coaching supports your own decisions, it does not replace professional, medical, or financial advice."}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' ctaWrap':'');
  let inner = '<div class="num">'+String(i+1).padStart(2,'0')+' / '+S.length+'</div>';
  if(s.kick) inner += '<div class="kick">'+s.kick+'</div>';
  if(s.step) inner += '<div class="step">'+s.step+'</div>';
  if(s.part){ inner += '<div class="part">'+s.part+'</div><div class="parth">'+s.parth+'</div>'; }
  if(s.h) inner += (s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) inner += '<div class="big">'+s.big+'</div>';
  if(s.lead) inner += '<div class="lead">'+s.lead+'</div>';
  if(s.sub) inner += '<div class="sub">'+s.sub+'</div>';
  if(s.present) inner += '<div class="present">'+s.present+'</div>';
  if(s.items){ inner += '<ul>'; s.items.forEach(x=> inner += '<li>'+x+'</li>'); inner += '</ul>'; }
  if(s.cols){ inner += '<div class="cols">'; s.cols.forEach(c=> inner += '<div class="col"><div class="n">'+c.n+'</div><div class="d">'+c.d+'</div></div>'); inner += '</div>'; }
  if(s.next) inner += '<div class="cta-next">'+s.next+'</div>';
  if(s.disc) inner += '<div class="disc">'+s.disc+'</div>';
  if(s.t==='cta'){ el.innerHTML = '<div class="ctaBox">'+inner+'</div>'; }
  else el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
