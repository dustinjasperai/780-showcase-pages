<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Raise Six-Figure Donations for Your Mission - Emma Lewzey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef7fc;        /* sky-family ground, from brand.json #e2f8ff/#e8f7ff */
    --panel:#ffffff;
    --rule:#cfe6f2;
    --ink:#0f3d57;       /* deep ocean blue */
    --muted:#50708a;     /* muted slate-blue */
    --accent:#1677ae;    /* brand blue link color */
    --pop:#fbdc4c;       /* brand warm yellow focal pop */
    --display:"Libre Baskerville", Georgia, serif;
    --body:"Lato", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--body);
    font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw}
  .slide{
    display:none;width:100%;max-width:980px;background:var(--panel);
    border:1px solid var(--rule);border-radius:18px;padding:6vh 6vw;
    box-shadow:0 18px 50px rgba(15,61,87,.08);min-height:68vh;
    flex-direction:column;justify-content:center;
  }
  .slide.active{display:flex}
  .eyebrow{font-family:var(--body);font-weight:900;letter-spacing:.16em;
    text-transform:uppercase;font-size:.72rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4.6vw,3.3rem);
    line-height:1.12;letter-spacing:-.01em;margin-bottom:1.2rem}
  h2{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3.2vw,2.3rem);
    line-height:1.18;margin-bottom:1rem}
  p{font-size:clamp(1.05rem,1.7vw,1.3rem);color:var(--ink);max-width:62ch;margin-bottom:.9rem}
  p.lead{font-size:clamp(1.2rem,2vw,1.5rem);color:var(--muted)}
  .sub{color:var(--muted);font-size:clamp(1rem,1.6vw,1.2rem)}
  ul{list-style:none;margin:.6rem 0 0}
  li{position:relative;padding-left:1.9rem;margin-bottom:.85rem;font-size:clamp(1.02rem,1.6vw,1.22rem)}
  li::before{content:"";position:absolute;left:0;top:.55em;width:.7rem;height:.7rem;
    border-radius:50%;background:var(--accent)}
  .stages{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:.8rem}
  .stage{border:1px solid var(--rule);border-radius:12px;padding:1.1rem 1.2rem;background:#f7fbfe}
  .stage .n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.5rem}
  .stage .l{font-weight:700;margin:.2rem 0 .3rem}
  .stage .d{color:var(--muted);font-size:.98rem}
  .big{font-family:var(--display);font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.1}
  .hl{background:linear-gradient(transparent 62%,var(--pop) 62%);padding:0 .1em}
  .credit{display:flex;gap:1.6rem;align-items:baseline;flex-wrap:wrap;margin-top:1rem}
  .credit .stat{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,2.6vw,2rem);color:var(--accent)}
  .credit .lbl{color:var(--muted);font-size:.95rem;display:block}
  .cta-box{border-top:3px solid var(--pop);padding-top:1.4rem;margin-top:.4rem}
  .brandline{font-family:var(--body);font-weight:900;letter-spacing:.04em;color:var(--accent);
    text-transform:uppercase;font-size:.8rem;margin-top:2.2rem}
  .disclaimer{color:var(--muted);font-size:.82rem;margin-top:1.4rem;max-width:70ch;line-height:1.45}
  footer{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 26px;font-size:.78rem;color:var(--muted);font-family:var(--body)}
  .nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  .nav button{border:1px solid var(--rule);background:var(--panel);color:var(--ink);
    border-radius:999px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
  .nav button:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<footer><span id="brand">Blue Sky Philanthropy</span><span id="pager"></span></footer>
<div class="nav"><button onclick="go(-1)" aria-label="Previous">&#8249;</button><button onclick="go(1)" aria-label="Next">&#8250;</button></div>
<script>
const S = [
  {t:'title',
   eyebrow:'Live Masterclass',
   h1:'How to Raise Six-Figure Donations for Your Mission',
   sub:'A live masterclass with Emma Lewzey, CFRE, founder of Blue Sky Philanthropy. The 6-stage system for landing major gifts without fear, intimidation or overwhelm.'},

  {t:'point',
   eyebrow:'Who this is for',
   h2:'For fundraisers and nonprofit leaders at small and growing shops',
   bullets:['Development staff who know major gifts matter but feel stuck on where to start',
            'Executive Directors asked to find six-figure gifts without a big team',
            'Anyone who finds the "big ask" intimidating and wants a calmer, proven way']},

  {t:'point',
   eyebrow:'The trap',
   h2:'You have been told major gifts are all about relationships',
   lead:'So you keep networking, keep chasing the next tactic, and keep hoping the right donor appears. Relationships matter, but hope is not a plan, and the next shiny tactic is not a system.'},

  {t:'statement',
   eyebrow:'The real reason gifts stall',
   big:'Major gifts rarely stall for lack of <span class="hl">effort</span>. They stall for lack of a <span class="hl">system</span>.'},

  {t:'point',
   eyebrow:'The promise',
   h2:'One repeatable journey, from first look to transformational gift',
   lead:'In this masterclass you will learn the 6-stage journey I teach, whether you are brand new to fundraising or a seasoned pro, so you always know the next right move.'},

  {t:'point',
   eyebrow:'Part one: the core problem',
   h2:'Chasing the Fundraising Shiny Object (the FSO)',
   bullets:['A new event here, a new platform there, a new appeal every quarter',
            'Each one starts from scratch and nothing compounds',
            'Your best prospects sit untouched in your own database the whole time']},

  {t:'point',
   eyebrow:'The cost',
   h2:'Reactive fundraising burns out small shops',
   bullets:['Revenue stays flat because effort resets every campaign',
            'There is no pipeline, so every year feels like starting over',
            'The team is busy, tired, and still short of the goal']},

  {t:'statement',
   eyebrow:'Part two: the framework',
   big:'The <span class="hl">6-Stage Journey</span> to transformational major gifts'},

  {t:'stages',
   eyebrow:'The journey at a glance',
   h2:'Six stages, in order, every time',
   stages:[
     {n:'1',l:'Prepare',d:'Get your plan, goals and case for support ready before you reach out.'},
     {n:'2',l:'Identify',d:'Surface the major-gift prospects already in your data.'},
     {n:'3',l:'Qualify',d:'Confirm capacity and interest so you focus on the right people.'},
     {n:'4',l:'Cultivate',d:'Build the relationship with intentional, planned moves.'},
     {n:'5',l:'Solicit',d:'Make the ask clearly and confidently, matched to the donor.'},
     {n:'6',l:'Steward',d:'Thank, report and deepen, so this gift leads to the next.'}]},

  {t:'point',
   eyebrow:'Find',
   h2:'Stages 1 to 3: you already have your next major donors',
   lead:'Most small shops assume they need a brand new prospect list. You do not. Prepare, Identify and Qualify pull your best major-gift prospects out of the donors and data you already hold.'},

  {t:'point',
   eyebrow:'Grow and ask',
   h2:'Stages 4 and 5: cultivation and the confident ask',
   bullets:['Cultivation is a planned sequence of moves, not random coffees',
            'The ask is simply the next step when the relationship is ready',
            'Matched to the donor, so it feels natural instead of intimidating']},

  {t:'point',
   eyebrow:'Keep',
   h2:'Stage 6: stewardship is where the next gift begins',
   lead:'Thanking and reporting well is not the end of the journey. Done with intention, stewardship turns a one-time major gift into a lasting, growing relationship.'},

  {t:'point',
   eyebrow:'The 3 shifts',
   h2:'3 shifts for bigger gifts',
   bullets:['Shift from chasing tactics to running one repeatable system',
            'Shift from "we need new prospects" to "we already have them"',
            'Shift from fear of the ask to confidence built by the journey']},

  {t:'point',
   eyebrow:'Your small-shop superpower',
   h2:'Being small is an advantage, not a handicap',
   lead:'A small shop is closer to its donors than any big institution. That closeness, pointed through a clear system, is exactly what turns mid-level donors into major and transformational givers.'},

  {t:'statement',
   eyebrow:'Part three: your major-gift program, running',
   big:'A calm, predictable major-gift program, run by a <span class="hl">small team</span>'},

  {t:'point',
   eyebrow:'What changes for you',
   h2:'From scramble to system',
   bullets:['A living prospect pipeline instead of a yearly cold start',
            'Every week, a clear next move for every major-gift relationship',
            'Revenue that compounds because the work no longer resets']},

  {t:'credit',
   eyebrow:'Why learn this from me',
   h2:'Emma Lewzey, CFRE',
   lead:'Award-winning fundraiser, certified since 2009, helping nonprofits raise 5, 6 and 7-figure gifts.',
   stats:[['20+ years','in nonprofit fundraising'],
          ['$5M to $210M','capital campaigns led'],
          ['Arts, education, health','sectors served']]},

  {t:'point',
   eyebrow:'A note on expectations',
   h2:'This is a method, not a magic number',
   lead:'The journey is road-tested across decades of campaigns. What you raise depends on your mission, your donors and your follow-through. The system gives you the next right move; the work is still yours to do.'},

  {t:'cta',
   eyebrow:'Your next step',
   h1:'Ready to build your major-gift system?',
   lead:'If you want help putting the 6-stage journey to work at your organization, the next step is a strategy call with Blue Sky Philanthropy, or join the Major Gift Master Plan waitlist.',
   ctaNote:'Work with Emma: book a strategy call or join the waitlist at blueskyphilanthropy.com',
   disclaimer:'This masterclass is educational and is not a guarantee of fundraising results. Outcomes vary by organization, mission, donor base and effort. Nothing here is financial, legal or tax advice.'}
];

let i = 0;
const stage = document.getElementById('stage');
function render(){
  const s = S[i];
  let html = '<div class="slide active">';
  if(s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) html += '<h1>'+s.h1+'</h1>';
  if(s.h2) html += '<h2>'+s.h2+'</h2>';
  if(s.big) html += '<div class="big">'+s.big+'</div>';
  if(s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if(s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if(s.bullets){ html += '<ul>'; s.bullets.forEach(b=>html+='<li>'+b+'</li>'); html += '</ul>'; }
  if(s.stages){ html += '<div class="stages">'; s.stages.forEach(st=>{
    html += '<div class="stage"><div class="n">'+st.n+'</div><div class="l">'+st.l+'</div><div class="d">'+st.d+'</div></div>';
  }); html += '</div>'; }
  if(s.stats){ html += '<div class="credit">'; s.stats.forEach(a=>{
    html += '<div><span class="stat">'+a[0]+'</span><span class="lbl">'+a[1]+'</span></div>';
  }); html += '</div>'; }
  if(s.ctaNote) html += '<div class="cta-box"><p>'+s.ctaNote+'</p></div>';
  if(s.disclaimer) html += '<div class="disclaimer">'+s.disclaimer+'</div>';
  if(s.t==='title'||s.t==='cta') html += '<div class="brandline">Blue Sky Philanthropy</div>';
  html += '</div>';
  stage.innerHTML = html;
  document.getElementById('pager').textContent = (i+1)+' / '+S.length;
}
function go(d){ i = Math.max(0, Math.min(S.length-1, i+d)); render(); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
render();
</script>
</body>
</html>
