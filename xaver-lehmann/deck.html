<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Honest Founder Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:wght@400;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f2a1e;
    --panel:#16382a;
    --rule:#2c5542;
    --accent:#cda96b;
    --chalk:#f5f1e8;
    --dim:#b9c7bd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--chalk);font-family:"Mulish",-apple-system,sans-serif;line-height:1.5}
  #deck{max-width:960px;margin:0 auto;padding:24px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 52px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:"Vollkorn",Georgia,serif;font-weight:700;font-size:52px;line-height:1.08;margin-bottom:18px}
  h2{font-family:"Vollkorn",Georgia,serif;font-weight:600;font-size:36px;line-height:1.15;margin-bottom:16px}
  p{font-size:20px;color:var(--chalk);margin-bottom:12px;max-width:62ch}
  p.sub{color:var(--dim);font-size:22px}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;padding:10px 0 10px 28px;position:relative;border-bottom:1px solid var(--rule);max-width:62ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .brand{margin-top:26px;color:var(--accent);font-weight:600;letter-spacing:.04em}
  .big{font-family:"Vollkorn",Georgia,serif;font-size:30px;color:var(--chalk);max-width:58ch}
  .part-num{font-family:"Vollkorn",Georgia,serif;font-size:22px;color:var(--accent);margin-bottom:10px}
  .disc{color:var(--dim);font-size:15px;margin-top:22px;max-width:60ch}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass for founders', h:'Scale Without Losing Yourself', sub:'The Honest Founder’s path to building an exceptional company, and still having a life.', brand:'The Honest Founder' },
  {t:'promise', eyebrow:'What you will leave with', h:'An honest plan for the next stage', bullets:['A weekly operating system that stops you being the bottleneck','The one question most founders avoid, and how to ask it','A way to grow revenue without growing your hours'] },
  {t:'who', eyebrow:'Who this is for', h:'Founders in the thick of it', p:'You are building something real. The numbers are moving. And quietly, the company has started to cost you your energy, your relationships, and your sense of who you are outside of it.', sub:'If you are scaling, raising, or stuck at a plateau, this hour is for you.' },
  {t:'trap', eyebrow:'The trap', h:'The 80-hour week feels like the job', p:'Somewhere along the way, being busy became the proof that you care. More hours, more firefighting, more of the business running through you.', sub:'It works, until it doesn’t.' },
  {t:'hook', eyebrow:'An honest reframe', h:'You can win on every metric and still burn out', big:'I took a company from a student apartment to a large exit, with a team across Europe. I also burned out twice getting there. Nobody warns you that the scoreboard can be green while you are running on empty.' },
  {t:'part', part:'Part One', h:'The real problem', p:'It is not time management. It is that growth and identity get fused, so the company quietly consumes the founder.' },
  {t:'content', eyebrow:'Problem, part one', h:'Your identity gets wired to the company', p:'When every win and every scare lands on you personally, the business stops being something you run and becomes the thing that runs you.' },
  {t:'content', eyebrow:'Problem, part two', h:'The cost nobody puts on the dashboard', p:'Lost sleep, strained relationships, decisions made from fear instead of clarity. These never show up in the metrics, but they decide whether you last.' },
  {t:'part', part:'Part Two', h:'The Honest Founder method', p:'Three disciplines that let you keep scaling without losing yourself.' },
  {t:'content', eyebrow:'Discipline one', h:'A founder’s weekly operating system', p:'A simple, repeatable cadence for your week: what you decide, what you delegate, what you protect. The company keeps moving when you are not the one pushing every piece.' },
  {t:'content', eyebrow:'Discipline two', h:'Ask the honest question', p:'Most founders avoid the one conversation they need most. The method is built on honest feedback with no sugarcoating, so you face the real bottleneck instead of the comfortable one.' },
  {t:'content', eyebrow:'Discipline three', h:'Treat your energy as the constraint', p:'Capital and headcount are not the limit at this stage. You are. Protecting your energy and clarity is a growth strategy, not a reward you get after the exit.' },
  {t:'content', eyebrow:'The shift', h:'Redefine the scoreboard', p:'Valuation and exit size are one measure, not the only one. Deciding what enough looks like, on purpose, is how you build a company and a life at the same time.' },
  {t:'part', part:'Part Three', h:'What changes', p:'What the next quarter looks like when the method is running.' },
  {t:'content', eyebrow:'Change one', h:'A week that runs without you in every room', p:'Clear priorities, real delegation, and decisions made once. You move from firefighter to founder.' },
  {t:'content', eyebrow:'Change two', h:'Growth you can actually sustain', p:'Revenue climbs because the company compounds, not because you added more hours you do not have.' },
  {t:'whyme', eyebrow:'Why me', h:'I have lived both sides of this', bullets:['Built an AI company from a dorm room to a large exit, 130+ people across Europe','Burned out twice, and rebuilt on purpose','Mentored 200+ founders through the parts nobody talks about publicly'] },
  {t:'recap', eyebrow:'The honest version', h:'Build the company. Keep yourself.', p:'A weekly operating system, the honest question, and energy as the constraint. That is how you scale without disappearing into the work.' },
  {t:'cta', eyebrow:'Your next step', h:'Work with me on your next stage', p:'If this is the way you want to build, apply to work with me one to one. I take a small number of founders each month so the work stays real.', brand:'Apply at The Honest Founder', disc:'This masterclass is educational. No income or specific result is guaranteed, and results vary by founder and business.' }
];
const el = document.getElementById('deck');
S.forEach(s => {
  const d = document.createElement('section');
  d.className = 'slide';
  let h = '';
  if (s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if (s.part) h += '<div class="part-num">'+s.part+'</div>';
  if (s.t === 'title') { h += '<h1>'+s.h+'</h1>'; } else { h += '<h2>'+s.h+'</h2>'; }
  if (s.sub) h += '<p class="sub">'+s.sub+'</p>';
  if (s.big) h += '<p class="big">'+s.big+'</p>';
  if (s.p) h += '<p>'+s.p+'</p>';
  if (s.bullets) { h += '<ul>'; s.bullets.forEach(b => h += '<li>'+b+'</li>'); h += '</ul>'; }
  if (s.brand) h += '<div class="brand">'+s.brand+'</div>';
  if (s.disc) h += '<div class="disc">'+s.disc+'</div>';
  d.innerHTML = h;
  el.appendChild(d);
});
</script>
</body>
</html>
