<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Artists Get Seen Without Selling Out — Shoebox Arts</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f6; --panel:#ffffff; --ink:#1f1d22; --muted:#6b6670;
    --accent:#ed008c; --accent-deep:#a1005f; --teal:#417586; --rule:#e7e0e3;
    --head:"Cormorant Garamond",Georgia,serif; --body:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 54px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.1;margin-bottom:16px}
  .lead{font-size:20px;color:var(--ink)}
  .sub{font-size:18px;color:var(--muted);margin-top:14px;max-width:62ch}
  p{font-size:18px;margin-top:14px;max-width:64ch;color:#2c2930}
  ul{margin:18px 0 0 0;padding:0;list-style:none}
  li{font-size:18px;padding:10px 0 10px 28px;position:relative;border-bottom:1px solid var(--rule);max-width:62ch}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .big{font-family:var(--head);font-size:44px;line-height:1.12;font-weight:600;max-width:20ch}
  .part{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--teal)}
  .partnum{font-family:var(--head);font-size:88px;font-weight:700;color:var(--accent);line-height:1}
  .quote{font-family:var(--head);font-size:40px;font-weight:600;line-height:1.2;max-width:22ch}
  .by{margin-top:26px;font-size:16px;color:var(--muted)}
  .title-slide{min-height:520px}
  .title-slide h1{font-size:60px}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
  .pill{border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
  .pill b{font-family:var(--head);font-size:22px;font-weight:600;display:block;margin-bottom:6px}
  .pill span{font-size:15px;color:var(--muted)}
  .cta{background:var(--ink);color:#f6f2f4}
  .cta::before{background:var(--accent)}
  .cta h2,.cta .big{color:#fff}
  .cta .step{font-size:19px;margin-top:10px;color:#e9e4e7}
  .cta .step b{color:var(--accent)}
  .disc{margin-top:26px;font-size:13px;color:#b9b2b8;max-width:70ch;line-height:1.5}
  .num{color:var(--teal);font-weight:600}
  @media(max-width:640px){.slide{padding:36px 26px}h1{font-size:38px}.title-slide h1{font-size:42px}h2{font-size:30px}.pillars{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title-slide', html:`
    <div class="kick">A live masterclass with Shoebox Arts</div>
    <h1>How Artists Get Seen Without Selling Out</h1>
    <p class="sub">The community path to shows, sales, and a career on your own terms. One hour, live, with real feedback.</p>
    <div class="by">Kristine Schomaker, artist, curator, and founder of Shoebox Arts. 11 years and 500+ artists at the Brewery, Los Angeles.</div>`},

  {t:'who', html:`
    <div class="kick">Who this is for</div>
    <h2>You can make the work. Nobody taught you the rest.</h2>
    <p>You are an emerging or working artist with real talent and real questions: how to price, how to get into shows, how to talk about your work, how to be seen without turning into a salesperson you don't recognize.</p>
    <p>You are not short on ability. You are short on a map, and on people doing this alongside you.</p>`},

  {t:'trap', html:`
    <div class="kick">The trap</div>
    <div class="big">Talent was never the problem. Isolation is.</div>
    <p class="sub">Art school taught you to make the work. It never taught you how to find your place in the art world, so you try to figure it out alone, in the quiet of the studio, at midnight, with no one to ask.</p>`},

  {t:'reframe', html:`
    <div class="kick">A harder truth</div>
    <h2>The ones who make it are rarely the most talented.</h2>
    <p>They are the ones who stopped navigating alone. Who found a circle. Who learned the practical side from people a few steps ahead, and gave it back to the people a few steps behind.</p>
    <p class="lead" style="margin-top:22px;color:var(--accent-deep);font-weight:600">Support begets support. Community is the strategy.</p>`},

  {t:'part', html:`
    <div class="part">Part One</div>
    <div class="partnum">01</div>
    <h2 style="margin-top:14px">The solo hustle is quietly ending careers</h2>`},

  {t:'problem', html:`
    <div class="kick">The core problem</div>
    <h2>Grinding alone has a predictable arc.</h2>
    <ul>
      <li>You compare your chapter one to everyone else's highlight reel.</li>
      <li>You wait for permission from institutions that were never the point.</li>
      <li>You guess at pricing, proposals, and PR, and mostly avoid them.</li>
      <li>You burn out, and you call it a lack of discipline. It isn't.</li>
    </ul>`},

  {t:'cost', html:`
    <div class="kick">What it costs</div>
    <div class="big">The artists who quit almost never quit for lack of talent.</div>
    <p class="sub">They quit because it got lonely, and because the business side felt like a wall with no door. The work was never the issue. The missing piece was a room full of people who had been through it.</p>`},

  {t:'part', html:`
    <div class="part">Part Two</div>
    <div class="partnum">02</div>
    <h2 style="margin-top:14px">The Shoebox method</h2>`},

  {t:'pillars', html:`
    <div class="kick">Four things that change everything</div>
    <h2>Built over 11 years, with 500+ artists.</h2>
    <div class="pillars">
      <div class="pill"><b>Community over competition</b><span>A circle of peers is the strategy, not a nice extra.</span></div>
      <div class="pill"><b>There is no one right way</b><span>Many art worlds. The job is finding the one that fits you.</span></div>
      <div class="pill"><b>The career curriculum</b><span>Pricing, shows, proposals, and PR, in plain language.</span></div>
      <div class="pill"><b>Practice getting seen</b><span>The Studio Visit Exchange: rehearse the real skills.</span></div>
    </div>`},

  {t:'pillar1', html:`
    <div class="kick">Pillar one</div>
    <h2>Community over competition</h2>
    <p>The feed tells you other artists are rivals for a fixed number of spots. That story keeps you small and alone. The truth we have watched for over a decade: artists who invest in each other get more shows, more sales, and longer careers.</p>
    <p>A studio visit you host. A proposal a peer reads before you send it. A speaker who becomes a collaborator. Support comes back around.</p>`},

  {t:'pillar2', html:`
    <div class="kick">Pillar two</div>
    <h2>There is no one right way</h2>
    <p>There are many art worlds: galleries, public art, licensing, teaching, grants, direct collectors. Somewhere in that landscape is one that fits your work, your life, and your values.</p>
    <p>The goal is not to copy someone else's path or chase institutional approval. It is to figure out what you actually want, where you actually fit, and what you are actually building.</p>`},

  {t:'pillar3', html:`
    <div class="kick">Pillar three</div>
    <h2>The career curriculum art school skipped</h2>
    <ul>
      <li>Pricing your work without flinching, or apologizing.</li>
      <li>Getting invited to shows, and writing proposals that don't get ignored.</li>
      <li>PR and marketing that doesn't feel gross, even if you are shy.</li>
      <li>Artists and money: grants, taxes, rates, and the honest numbers.</li>
    </ul>`},

  {t:'pillar4', html:`
    <div class="kick">Pillar four</div>
    <h2>Practice getting seen, safely</h2>
    <p>Being seen is a skill, and most artists never get to rehearse it. The Studio Visit Exchange pairs you with another artist or an art professional so you can practice the things that actually move a career forward.</p>
    <ul>
      <li>Give a compelling five minute overview of your practice.</li>
      <li>Talk about your process without getting lost.</li>
      <li>Handle hard questions about your work with ease.</li>
    </ul>`},

  {t:'shows', html:`
    <div class="kick">A closer look</div>
    <h2>Getting invited to shows</h2>
    <p>Shows rarely come from a cold application. They come from relationships, a clear body of work, and a proposal that respects the curator's time. You can build all three on purpose, in community, instead of waiting to be discovered.</p>`},

  {t:'pricing', html:`
    <div class="kick">A closer look</div>
    <h2>Pricing your work</h2>
    <p>Most artists price from fear: too low to be taken seriously, or frozen and unable to name a number at all. With honest comparisons from peers and a simple method, a price becomes a decision you can defend, not a confession.</p>`},

  {t:'pr', html:`
    <div class="kick">A closer look</div>
    <h2>PR that doesn't feel gross</h2>
    <p>Getting written about is not about hype or pretending to be someone you are not. It is about telling the truth of your work clearly, to the right people, at the right moment. Quiet and introverted artists can do this well. Often better.</p>`},

  {t:'part', html:`
    <div class="part">Part Three</div>
    <div class="partnum">03</div>
    <h2 style="margin-top:14px">A week inside the Shoebox circle</h2>`},

  {t:'rhythm', html:`
    <div class="kick">The weekly rhythm</div>
    <h2>Something to show up to, every week.</h2>
    <ul>
      <li>Monday Masterclass on a rotating theme: pricing, studio visits, getting into shows.</li>
      <li>Tuesday Community Conversations: open, honest talk about the real questions.</li>
      <li>Monthly critiques and guest speakers: curators, gallerists, working artists.</li>
      <li>A private community that invests in each other, all week long.</li>
    </ul>`},

  {t:'whyme', html:`
    <div class="kick">Why listen to me</div>
    <h2>I have been in the trenches long enough to know how it works.</h2>
    <p>I am Kristine Schomaker, an artist, curator, and writer. For over a decade I have built community at the Brewery in Los Angeles, supported more than 500 artists, and helped them reach audiences far beyond what they could reach alone.</p>
    <p class="sub">I am not here to sell you a formula. I am here to help you find your art world, and a circle to walk into it with.</p>`},

  {t:'ethos', html:`
    <div class="quote">"Artists are stronger together. That's not a slogan. That's what we have watched happen for over a decade."</div>
    <div class="by">Kristine Schomaker, Shoebox Arts</div>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Where to start</div>
    <h2>You don't have to figure out the art world alone.</h2>
    <div class="step"><b>Step 1.</b> Join a free Community Conversation, every Tuesday at 11am PST on Zoom. Just show up.</div>
    <div class="step"><b>Step 2.</b> When you are ready for more, join the Artist Support Membership for weekly development, critique, speakers, and direct mentorship.</div>
    <div class="step" style="margin-top:16px">Find your people at <b>shoeboxarts.com</b>.</div>
    <div class="disc">For educational purposes only. Shoebox Arts offers mentorship, community, and professional development for artists. No income, sale, exhibition, representation, or career result is guaranteed. Every artist's path and results vary.</div>`}
];
const deck = document.getElementById('deck');
S.forEach(function(s){
  var d = document.createElement('section');
  d.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  d.innerHTML = s.html;
  deck.appendChild(d);
});
</script>
</body>
</html>
