<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Your AI Dream Team, a masterclass with Natalie MacNeil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efea;
    --panel:#f3e8de;
    --rule:#e3d3c4;
    --ink:#4c2744;
    --muted:#7c5f70;
    --accent:#c47955;
    --accent2:#818e6e;
    --head:'Rozha One',Georgia,serif;
    --body:'Jost',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:980px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    padding:64px 76px 64px 84px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 18px 50px rgba(76,39,68,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* motif: "the future thread" — a single fine vertical line down the left edge */
  .slide::before{content:'';position:absolute;top:44px;bottom:44px;left:44px;width:2px;
    background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:.65}
  .slide::after{content:'';position:absolute;top:40px;left:39px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .kick{font-size:14px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:400;font-size:62px;line-height:1.05;margin:0 0 20px;letter-spacing:.005em}
  h2{font-family:var(--head);font-weight:400;font-size:44px;line-height:1.1;margin:0 0 20px}
  h3{font-family:var(--head);font-weight:400;font-size:30px;line-height:1.16;margin:0 0 12px}
  p{font-size:22px;line-height:1.55;color:var(--muted);margin:0 0 14px;max-width:46ch}
  .lead{font-size:26px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:16px 0 0;padding:0;list-style:none}
  li{font-size:21px;line-height:1.4;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:23px;width:15px;height:15px;border-radius:50%;
    border:2px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:17px;margin-top:4px}
  .big{font-family:var(--head);font-size:104px;line-height:1;font-weight:400}
  .strike{color:transparent;-webkit-text-stroke:1.5px #4c274455;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:54%;height:4px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:18px;margin-top:22px;flex-wrap:wrap}
  .cell{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:24px;font-weight:400;margin-bottom:8px}
  .cell p{font-size:16px;margin:0}
  .team{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
  .card{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:18px 18px}
  .card .role{font-weight:600;font-size:17px;color:var(--ink);margin-bottom:4px}
  .card .task{font-size:14px;color:var(--muted);line-height:1.35}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:56px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:15px;top:15px;left:5px}
  .who{font-size:18px;color:var(--muted);margin-top:auto;padding-top:22px}
  .who b{color:var(--ink)}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;max-width:62ch;line-height:1.45}
  .ctaline{font-size:23px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent);font-weight:600}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 26px 40px 40px}h1{font-size:38px}h2{font-size:29px}.big{font-size:64px}p,li{font-size:18px}}
</style>
</head>
<body>
<div class="hint">Natalie MacNeil · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'Lead Your AI Dream Team',p:'How heart-led founders build a team of AI teammates that gives back 10 to 20 hours a week, without losing the voice that makes the work theirs.',pres:'With <b>Natalie MacNeil</b>, futurist and creator of the AI Dream Team'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why AI is not saving you time yet','The reason a smarter tool still leaves you doing the work.'],['The shift from tool to team','How to give AI real roles instead of one-off prompts.'],['Your first three teammates','The exact roles to build first, and how to brief them.']]},
 {t:'audience',kick:'Who this is for',h:'You have tried the tools. You are still the bottleneck.',p:'Founders and small teams who know AI matters, have opened the apps, and still find themselves buried in the same work at the end of the week.',who:'<b>The trap:</b> you collect more tools and better prompts, the tab count goes up, and none of it ever actually runs a part of your business for you.'},
 {t:'reframe',kick:'The reframe',big1:'A better tool.',big2:'A team you <span class="em">lead</span>.',p:'A tool waits for you to use it. A team knows its role and does the work. The founders getting their week back stopped prompting a chatbot and started leading a set of teammates, each with a job.'},
 {t:'part',kick:'Part one',h:'Why the tools are not enough.'},
 {t:'point',kick:'The core problem',h:'A blank box is not a teammate.',p:'Every new session starts from zero. You re-explain who you are, what you sell, and how you sound, over and over. Genius that has no memory and no role is not help, it is one more thing to manage.'},
 {t:'framework',kick:'The core problem',h:'Prompting vs. delegating.',row:[['Prompting','You ask, you wait, you rewrite. The output is generic because the context lived only in your head.'],['Delegating','You brief a teammate that already knows the role, the brand and the standard, and it runs.']],p:'The difference is not a cleverer prompt. It is whether the AI has a defined role to step into.'},
 {t:'point',kick:'The core problem',h:'Speed without your voice is worthless.',p:'Faster output that does not sound like you just makes more to fix. The point was never to sound like everyone else with a chatbot. It was to sound more like you, in less time.'},
 {t:'part',kick:'Part two',h:'The AI Dream Team method.'},
 {t:'point',kick:'The method',h:'Stop hiring a tool. Build a team.',p:'Treat AI the way you would a real team: give each teammate one clear role, the context to do it well, and a standard to hit. You stop being the operator and start being the one who leads.'},
 {t:'teamgrid',kick:'The method',h:'Give every teammate a real role.',cards:[['The Strategist','Turns your goals into a plan and pressure-tests decisions.'],['The Writer','Drafts in your voice, from your frameworks, not a generic one.'],['The Researcher','Scans your market and brings back what actually matters.'],['The Operator','Runs the repeatable work so you never touch it twice.']],p:'These are roles you define once and lead every day. This is what a Dream Team is: an org chart, not a tab full of prompts.'},
 {t:'cycle',kick:'The framework',h:'The 3 Cs of a brief that works.',steps:['Clarity: say exactly what done looks like, not just the task','Context: give the situation, the brand and the standard up front','Cues: show the shape you want, the format, the length, the tone'],p:'Clarity, Context, Cues. It is how you brief a person well, and it is how you get usable, on-voice work from a teammate the first time.'},
 {t:'point',kick:'The method',h:'Keep yourself in the loop.',p:'The mechanical work goes to the team. The judgment stays with you: the analytical, the intuitive, the strategic, the somatic and the spiritual reads that no model has. That is the part of you that no teammate replaces, and the part this frees you to use.'},
 {t:'part',kick:'Part three',h:'Your week, once the team runs.'},
 {t:'looks',kick:'The outcome',h:'Ten to twenty hours, back.',li:[['The busywork runs itself','The drafting, sorting and first passes happen without you in the chair.'],['You lead instead of operate','Your day is decisions and vision, not doing every task by hand.'],['Your work still sounds like you','Everything ships in your voice, because your voice is built into the team.']],who:'<b>Principle:</b> build from the future you can already see, instead of scrambling to keep up with it.'},
 {t:'whyme',kick:'Why Natalie',h:'A futurist who has done this in the open.',li:[['Emmy-winning media entrepreneur','Co-produced the world's first full-length 360° interactive documentary.'],['Built She Takes on the World','A community and body of work for women entrepreneurs, over a decade deep.'],['On a mission to teach 10,000 founders','Guiding entrepreneurs to work with AI in an ethical and embodied way.']]},
 {t:'cta',kick:'Your next step',h:'Ready to build your AI Dream Team?',ctas:['<b>Join AI Dream Team</b> for the full system: the roles, the 3 Cs, the guidebooks and the community.','<b>Apply for 1:1 mentorship</b> if you want this built around your business with Natalie directly.'],disc:'This masterclass is educational. It shares frameworks and approaches for working with AI in your business; it is not advice for your specific situation and not a guarantee of any particular result. Outcomes vary by founder.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.cards){h+=`<h2>${s.h}</h2><div class="team">`+s.cards.map(c=>`<div class="card"><div class="role">${c[0]}</div><div class="task">${c[1]}</div></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`+(s.who?`<div class="who">${s.who}</div>`:'')}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
