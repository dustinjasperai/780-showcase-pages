<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Without Burnout: The 20/20 Vision Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f2;
    --panel:#f3efe6;
    --card:#ffffff;
    --rule:#e4ddcd;
    --ink:#1a1a1a;
    --muted:#69727d;
    --accent:#f2ca51;
    --red:#d82027;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:56px 56px 52px;
    margin:0 0 36px;
    min-height:62vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    box-shadow:0 1px 0 rgba(26,26,26,.02);
  }
  .slide.alt{background:var(--panel)}
  .kicker{
    font-family:"DM Sans",sans-serif;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--muted);
    margin-bottom:18px;
  }
  /* vision rule: thin gold horizon underline */
  .kicker::after{
    content:"";
    display:block;
    width:52px;
    height:3px;
    background:var(--accent);
    margin-top:12px;
  }
  h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.08;letter-spacing:-.01em}
  .title h1{font-size:60px}
  h2{font-size:42px;margin-bottom:20px}
  .sub{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:26px;color:var(--muted);font-style:italic;margin-top:18px;max-width:44ch}
  .body{font-size:19px;color:#2a2a2a;max-width:56ch;margin-top:6px}
  .body strong{color:var(--ink)}
  .lead{font-size:21px}
  ul.points{list-style:none;margin-top:22px;max-width:58ch}
  ul.points li{position:relative;padding-left:26px;margin:14px 0;font-size:18px;color:#2a2a2a}
  ul.points li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:3px;background:var(--accent)}
  .move{font-family:"Cormorant Garamond",serif;font-size:72px;font-weight:600;color:var(--ink);line-height:1}
  .move .n{color:var(--accent)}
  .foot{position:absolute;left:56px;bottom:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .pageno{position:absolute;right:56px;bottom:26px;font-size:12px;color:var(--muted)}
  .alarm{color:var(--red);font-weight:700}
  .big{font-family:"Cormorant Garamond",serif;font-size:64px;font-weight:600;line-height:1.02}
  .cta .body{font-size:20px}
  .btn{
    display:inline-block;margin-top:26px;
    background:var(--accent);color:#1a1a1a;
    font-family:"DM Sans",sans-serif;font-weight:700;
    text-decoration:none;font-size:18px;
    padding:15px 30px;border-radius:7px;
    letter-spacing:.01em;
  }
  .url{margin-top:16px;font-size:15px;color:var(--muted);letter-spacing:.04em}
  .disclaimer{margin-top:34px;padding-top:18px;border-top:1px solid var(--rule);font-size:13px;line-height:1.6;color:var(--muted);max-width:66ch}
  @media(max-width:640px){
    .slide{padding:38px 26px 46px}
    .title h1{font-size:40px}
    h2{font-size:30px}
    .move{font-size:52px}
    .foot,.pageno{position:static;margin-top:22px;display:inline-block}
  }
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S=[
 {t:'title',
  h:'Momentum Without Burnout',
  sub:'The 20/20 Vision Method: sustainable high performance instead of grind culture.'},

 {t:'content',
  k:'Who this is for',
  h:'For leaders who are working hard and still feel stuck.',
  body:'You run a team or a business. You are putting in the hours. And yet the week ends and you cannot point to anything that actually moved. This hour is for driven people who are tired of confusing effort with progress.'},

 {t:'content',
  k:'The honest problem',
  h:'Running fast is not the same as moving forward.',
  body:'Grind culture rewards motion. It applauds the full calendar, the late nights, the inbox at zero. But motion is not direction. You can sprint for a year and arrive somewhere you never chose to go.'},

 {t:'content',
  k:'The reframe',
  h:'More hours is not the answer.',
  body:'The fix for feeling stuck is almost never <strong>work harder</strong>. Most driven leaders are not lazy. They are busy without being in motion toward anything they actually picked on purpose.'},

 {t:'content',
  k:'Part One',
  h:'Motion versus momentum.',
  lead:true,
  body:'<strong>Motion</strong> is activity: tasks done, boxes checked, a day that felt full. <strong>Momentum</strong> is activity that compounds in one chosen direction. The whole game is converting the first into the second.'},

 {t:'content',
  k:'Part One',
  h:'The cost of unaligned effort.',
  body:'When effort does not line up with a direction, three things quietly drain away:',
  points:['Your energy, spent on work that does not add up to anything','Your team, pulled in directions that change every week','Your time, the one input you can never earn back']},

 {t:'content',
  k:'Part One',
  h:'Why willpower and more hustle fail.',
  body:'Willpower is a battery, not a strategy. Piling on more hustle without a direction just burns the battery faster. <span class="alarm">Burnout is not weakness.</span> It is the predictable result of high output with no aim.'},

 {t:'content',
  k:'Part Two',
  h:'The 20/20 Vision Guide.',
  lead:true,
  body:'Here is our framework for turning motion into momentum. Three moves, in order: Vision, Alignment, Action. Clear sight first, honest audit second, designed systems third.'},

 {t:'move',
  k:'Move one',
  move:'01',
  h:'Vision.',
  body:'Define the ideal future that is actually worth the work. Not a vague wish, a clear five-year picture you could describe to a stranger. If you cannot see the destination, every road looks equally good, and that is exactly why you feel stuck.'},

 {t:'move',
  k:'Move two',
  move:'02',
  h:'Alignment.',
  body:'Audit whether today\'s routines genuinely serve that five-year picture. This is the honest gut-check. Hold each recurring commitment up to the vision and ask, plainly, does this move me toward it or just keep me busy.'},

 {t:'move',
  k:'Move three',
  move:'03',
  h:'Action.',
  body:'Design the daily systems that compound toward the vision. Build the ideal day on purpose so progress does not depend on motivation. Good systems make the right work the easy default instead of a daily act of willpower.'},

 {t:'content',
  k:'Part Two',
  h:'The three moves, together.',
  body:'Vision tells you where. Alignment tells you the truth about where your days actually point. Action rebuilds those days so they carry you forward on their own. Skip one and the other two stall.'},

 {t:'content',
  k:'Part Two',
  h:'An operating system for hustle without burnout.',
  body:'The HUSTLE Framework extends the 20/20 Vision Guide across every domain of your life, not just work. The point is simple: honest growth you can sustain, in the words we live by, <strong>no-fluff leadership</strong>.'},

 {t:'content',
  k:'Part Three',
  h:'A designed week versus a busy week.',
  body:'A busy week is whatever lands in the inbox, reacted to in order of volume. A designed week starts from the vision and works backward into the calendar. Same hours. One of them compounds.'},

 {t:'content',
  k:'Part Three',
  h:'The Hustle Ideal Day Habit Planner.',
  body:'This is where the method gets concrete. You map the ideal day block by block so your default schedule already points at the five-year picture, before the week has a chance to hijack it.'},

 {t:'content',
  k:'Why listen to us',
  h:'Chris Burns and D. McClone.',
  body:'We host the <strong>Hustle Nation Podcast</strong>, where we have had the no-fluff conversations about leadership and honest growth that are now past <strong>100,000 downloads</strong>. The 20/20 Vision Method is what came out of them.'},

 {t:'content',
  k:'The shift',
  h:'Pick your direction before you pick up speed.',
  body:'Momentum is not about doing more. It is about making sure the hours you are already giving point at a future you actually chose. Vision, then alignment, then action.'},

 {t:'content',
  k:'Your next 30 days',
  h:'Hustle Academy.',
  body:'Hustle Academy is our 30-day program for installing the 20/20 Vision Method into your real calendar, with the Ideal Day Habit Planner and the HUSTLE Framework as your operating system. Coaching alongside it through Hustle Leaders.'},

 {t:'cta',
  k:'Start here',
  h:'Build momentum you can sustain.',
  body:'Join Hustle Academy and start the 30-day method with us at <strong>hustleleaders.com</strong>. Bring one vision worth the work, and we will help you design the days that get you there.',
  url:'hustleleaders.com',
  disc:'This masterclass is educational and reflects our own experience and opinions as hosts of the Hustle Nation Podcast. No specific outcome or result is guaranteed. Results vary based on your situation, effort, and many factors outside anyone\'s control.'}
];

const deck=document.getElementById('deck');
S.forEach(function(s,i){
  const el=document.createElement('section');
  el.className='slide '+s.t+((i%2===1)?' alt':'');
  let html='';
  if(s.k){html+='<div class="kicker">'+s.k+'</div>';}
  if(s.t==='title'){
    html+='<h1>'+s.h+'</h1>';
    if(s.sub){html+='<div class="sub">'+s.sub+'</div>';}
  }else if(s.t==='move'){
    html+='<div class="move"><span class="n">'+s.move+'</span></div>';
    html+='<h2 style="margin-top:14px">'+s.h+'</h2>';
    if(s.body){html+='<p class="body lead">'+s.body+'</p>';}
  }else if(s.t==='cta'){
    html+='<h2>'+s.h+'</h2>';
    if(s.body){html+='<p class="body">'+s.body+'</p>';}
    if(s.url){html+='<a class="btn" href="https://'+s.url+'">Join at '+s.url+'</a>';}
    if(s.disc){html+='<p class="disclaimer">'+s.disc+'</p>';}
  }else{
    html+='<h2>'+s.h+'</h2>';
    if(s.body){html+='<p class="body'+(s.lead?' lead':'')+'">'+s.body+'</p>';}
    if(s.points){
      html+='<ul class="points">';
      s.points.forEach(function(p){html+='<li>'+p+'</li>';});
      html+='</ul>';
    }
  }
  html+='<div class="foot">Hustle Leaders</div>';
  html+='<div class="pageno">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
