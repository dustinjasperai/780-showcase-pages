<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Pivot Brief · Erica + Jon, Brand Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1e1d1d; --panel:#272626; --rule:#454e40;
    --acc:#cfac87; --ink:#f4f0eb; --body:#d8d3c8; --dim:#929083; --cream:#f7f2ea;
  }
  html,body{height:100%}
  body{background:#141313;font-family:'Open Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#141313}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Open Sans',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:.002em}
  .t-title h1{font-size:5.2vw;max-width:92%}
  .t-normal h1{font-size:3.4vw;max-width:90%}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.62;font-weight:400}
  .sub{font-family:'Playfair Display',serif;font-style:italic;font-size:2.1vw;color:var(--acc);margin-top:3.4vh;max-width:82%;line-height:1.4;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.0vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#262b20 0%,#10120b 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#262b20 0%,#10120b 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.0vw;max-width:84%;color:var(--cream)}
  .t-cta .body{font-family:'Open Sans',sans-serif;color:#e7ded2;font-size:1.42vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.5%;bottom:8%;width:15vw;opacity:.92}
  .corner-vf{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Open Sans',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(244,240,235,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Erica + Jon · Brand Photography</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- styling motif: a mood-board frame with three brand swatch chips, drawn in warm gold -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#cfac87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="20" width="88" height="66" rx="6" opacity="0.85"/>
    <rect x="26" y="30" width="30" height="46" rx="4" opacity="0.55"/>
    <rect x="64" y="30" width="30" height="20" rx="4" opacity="0.7"/>
    <rect x="64" y="56" width="30" height="20" rx="4" opacity="0.7"/>
    <circle cx="60" cy="99" r="3.2" fill="#cfac87" stroke="none" opacity="0.9"/>
    <circle cx="72" cy="99" r="3.2" fill="#929083" stroke="none" opacity="0.8"/>
    <circle cx="48" cy="99" r="3.2" fill="#f4f0eb" stroke="none" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Pivot Brief',sub:'How wedding and portrait photographers break into brand photography, and build a business that runs Monday to Friday.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You can already make beautiful images. Turning that into a weekday business is the part nobody taught you.',body:'You are a wedding or portrait photographer, and the work is genuinely good. But the calendar lives on weekends, the money follows the season, and every booking starts again from zero. Brand photography is how a lot of us finally got our weeks, and our weekends, back.'},
 {t:'dark',title:'A full Saturday is not the same as a business that pays you Monday to Friday.'},

 {t:'section',idx:'Part One',title:'Why "Just Shoot Brands" Usually Stalls'},
 {t:'normal',k:'The genre is not the business',title:'Brand photography is a different business, not just a different subject in front of the lens.',body:'Pointing the camera at a product instead of a couple does not make you a brand photographer. Brands buy differently, plan differently, and expect you to lead the shoot. Photographers who try to bolt it onto the wedding workflow usually take a few pretty photos and never book the second client.'},
 {t:'normal',k:'The confidence gap',title:'Most photographers freeze at the part before the shutter ever clicks.',body:'The intimidating part was never the photography. It is sitting across from a business owner, understanding what their brand actually is, and planning a shoot that sells it. Without a process for that, you undercharge, over-deliver, and quietly go back to weddings.'},
 {t:'dark',title:'The camera was never the hard part. Booking, planning, and styling like a brand photographer is.'},

 {t:'section',idx:'Part Two',title:'How the Pivot Actually Works'},
 {t:'normal',k:'Start with the shift, not the gear',title:'Brand work is weekday, repeatable, and built on relationships.',body:'Before the styling and the pricing, there is a mindset shift. Brand clients rebook, refer, and go on retainer, which is what turns a weekend hustle into a Monday-to-Friday business. You stop chasing the next wedding season and start building a roster.'},
 {t:'normal',k:'Read the brand first, the Brand Questionnaire',title:'You cannot shoot a brand you have not taken the time to understand.',body:'Every strong brand shoot starts before the camera comes out. Our Brand Questionnaire is how we pull out what a brand is, and just as important what it is not, so the shoot is planned around the client's real story instead of a generic set of pretty pictures.'},
 {t:'normal',k:'The 4 Core Styling Principles',title:'Styling is what separates a branded image from a nice photo.',body:'This is the craft most photographers are missing. Our 4 Core Styling Principles, anchoring the frame, layering complementary elements, and holding the focus, are how a set reads as intentional and on-brand. It is the difference a client can feel even when they cannot name it.'},
 {t:'normal',k:'Plan it like a pro, the Planning Template',title:'A great brand shoot is planned on paper long before the shoot day.',body:'Location, shot list, mood board, composition notes, and props all get decided up front. Our Brand Photoshoot Planning Template turns that into a repeatable process, with worked examples for personal, product, and food brands, so every shoot shows up organized instead of improvised.'},
 {t:'dark',title:'A brand shoot is won in the planning, not on the shoot day.'},

 {t:'section',idx:'Part Three',title:'What the Pivot Looks Like'},
 {t:'normal',k:'The business this builds',title:'Weekday clients, repeat retainers, and pricing that finally fits the value.',body:'When you can read a brand, plan the shoot, and style it well, you stop competing with every weekend photographer in town. The work reruns, the clients come back, and the calendar fills Monday to Friday at rates that reflect what the images are worth to the business.'},
 {t:'dark',title:'The goal was never to shoot more. It was to build a business you are not exhausted by.'},
 {t:'normal',k:'Why Erica + Jon',title:'We made this exact pivot, from weddings to a commercial brand studio.',body:'We are Erica and Jon, a husband-and-wife team based in Phoenix and 30A. We left the wedding and lifestyle world to build a commercial brand photography business, and we now teach photographers to do the same, using the questionnaire, the styling principles, and the planning system we run on real client shoots.'},

 {t:'section',idx:'Your Next Step',title:'Make the Pivot Real'},
 {t:'normal',k:'Keep going with the Bootcamp',title:'The full step-by-step, from your first brand client to a brand business that supports you.',body:'The Brand Photography Bootcamp is the complete path: how to find and consult brand clients, plan and style the shoot, and price it so the pivot pays. It is the same system we use in our own studio, built for photographers ready to make brand work their main thing.'},
 {t:'cta',title:'Ready to build a brand photography business?',body:'Take the next step with the Brand Photography Bootcamp.',chips:['Watch the free class','Join the Brand Photography Bootcamp'],disc:'Educational content for working and aspiring photographers. No income or business result is guaranteed. Results vary by photographer, market, and effort.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Erica + <b>Jon</b> · Brand Photography</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
