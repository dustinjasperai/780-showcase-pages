<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Be the Change: A Masterclass for Parents of Teens | Ben Pugh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ec; --panel:#ffffff; --panel2:#eee6d9; --ink:#0f2a3a;
    --muted:#4a5c66; --rule:#2f7f95; --accent:#2f8da6; --pop:#c0392b;
    --head:'Poppins',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--panel2);border-radius:18px;
    padding:54px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 2px 20px rgba(15,42,58,.05)}
  .slide.hero{background:linear-gradient(160deg,#0f2a3a,#13405a);color:#f7f3ec;border:none}
  .slide.accent{background:var(--panel2)}
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  .hero .kicker{color:#7fd0df}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:32px;line-height:1.14;margin-bottom:16px}
  p{font-size:19px;color:var(--muted);max-width:62ch;margin-bottom:14px}
  .hero p{color:#cfe3ea}
  .lead{font-size:22px;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--panel2)}
  li:before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:50%;
    background:var(--accent)}
  li:last-child{border-bottom:none}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.1}
  .big .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--pop)}
  .big .on{color:var(--accent)}
  .pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:14px;
    color:var(--accent);background:rgba(47,141,166,.12);border-radius:999px;padding:6px 14px;margin-bottom:18px}
  .num{font-family:var(--head);font-weight:700;font-size:20px;color:var(--pop);margin-bottom:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .two .box{background:var(--bg);border:1px solid var(--panel2);border-radius:14px;padding:22px}
  .two h3{font-family:var(--head);font-size:18px;margin-bottom:8px}
  .disclaimer{font-size:14px;color:var(--muted);max-width:70ch;margin-top:18px;line-height:1.5}
  .cta-btn{display:inline-block;font-family:var(--head);font-weight:600;background:var(--accent);
    color:#fff;padding:14px 28px;border-radius:12px;font-size:18px;margin-top:10px}
  .foot{font-family:var(--head);font-size:14px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'hero', kicker:'A live masterclass for parents of teens', h1:'Be the Change',
   p:'How to reconnect with your teenager without trying to fix, control, or change them. 60 minutes, live, with Ben Pugh.'},

  {t:'who', kicker:'Who this is for', h2:'You love your teen. You just keep ending up at war.',
   p:'This is for the parent whose every conversation seems to turn into an argument, a slammed door, or silence. You are not a bad parent. You are stuck in a loop that almost every parent of a teen falls into.'},

  {t:'promise', kicker:'The promise', h2:'By the end of this hour you will have',
   items:['A way to end the daily fights without caving on what matters','One shift that lowers the tension in your home this week','A clear picture of why connection, not control, changes behavior']},

  {t:'trap', kicker:'The trap', h2:'The harder you push to fix them, the further they pull away.',
   p:'When we are scared for our kids, we try to control them: more rules, more lectures, more fixing. With a teen, control is the one thing that guarantees disconnection. The pushing is the problem, not the solution.'},

  {t:'myth', kicker:'The myth to drop', h2:'Good parenting is not the same as being in control',
   p:'We were taught that a good parent keeps their teen in line. So when a teen pushes back, we read it as failure and squeeze harder. But a teen pulling away is not a discipline problem to solve. It is a bid for a different kind of relationship with you.'},

  {t:'reframe', big:true, lead:'Here is the shift this whole hour is built on:',
   html:'You can’t <span class="strike">change</span> your teen. You can <span class="on">connect</span> with them.'},

  {t:'io', kicker:'Part one', h2:'Inside-out, not outside-in',
   p:'Outside-in parenting tries to fix the teen’s behavior from the outside. It fails, because you cannot control another human being. Inside-out parenting changes the one person you can control, you, and lets that ripple outward. Influence flows from your presence, not your pressure.'},

  {t:'pillars', kicker:'The method', h2:'Three pillars of Parenting with Perspective',
   items:['Be the change, not the enforcer','Master what you can actually control','Connect with the teen you have, not the one you wish for']},

  {t:'p1', pill:'Pillar 1', h2:'Be the change',
   p:'Stop trying to change, fix, or control your teen, and become the calm, grounded, connected person you want them to become. Teens absorb who you ARE far more than what you say. You go first.'},

  {t:'p2', pill:'Pillar 2', h2:'Master what you can control',
   p:'Almost all of a parent’s stress comes from gripping things they cannot control: a teen’s mood, grades, friends, choices. Peace, and influence, start the moment you move your energy to the only thing that is actually yours: your own responses, presence, and values.'},

  {t:'list2', kicker:'The control list', h2:'Two columns that change everything',
   two:[{h:'You can’t control',items:['Their mood','Their grades','Their friends','Their timeline']},
        {h:'You can control',items:['Your reaction','Your presence','Your tone','Who you are in the room']}]},

  {t:'p3', pill:'Pillar 3', h2:'Connect with the teen you have',
   p:'Not the fixed, imaginary version you wish existed, the real one in front of you. Your teenager wants you to connect with them, exactly as they are right now. Connection is not a reward for good behavior; it is the thing that makes change possible.'},

  {t:'exercise', kicker:'The practice', h2:'The Two-Scenario Exercise',
   p:'Name your worst fear for your teen. Then name your best-case hope. Then ask: who do I want to BE in each one? You will find the same answer both times, calm, present, compassionate. That posture is available to you today, no matter the outcome, and it is the posture that actually changes things.'},

  {t:'teenview', kicker:'From their side of the door', h2:'What your teen is actually asking',
   p:'Underneath the eye-rolls and the "leave me alone" is the same thing you want: to feel known, safe, and like they belong with you. Teens fear being inadequate just like we do. The attitude is armor, not rejection.'},

  {t:'week', kicker:'A real week with your teen', h2:'A real week, not a personality transplant',
   p:'This is not about becoming a different parent overnight. It is small: one pause before a reaction, one "I’m here when you want me," one conversation you don’t try to fix. Those moments compound into a relationship your teen trusts again.'},

  {t:'story', kicker:'Why me', h2:'I was the knucklehead',
   p:'At 13 I was the kid everyone had written off, behavior problems, failing, alone. A few adults chose connection over control, and it changed the trajectory of my life. I went on to spend ten years in education, five as a high school principal, and ten years as a foster parent. I have been the struggling teen and the adult who had to reach one. This is what works.'},

  {t:'recap', kicker:'Pulling it together', h2:'From fixing to connecting',
   items:['Drop the outside-in control','Be the change you want to see','Master what is actually yours','Connect with the teen you have']},

  {t:'cta', kicker:'Your next step', h2:'Keep going with IMPACT',
   p:'If today gave you a new way to see your teen, the IMPACT membership is where parents of teens go deeper, with ongoing coaching, tools, and a community walking the same road. Come build the relationship you want with your teen.',
   button:'Join IMPACT',
   disclaimer:'This masterclass is educational. Every family and teen is different; specific outcomes are not guaranteed and results vary. Nothing here is a substitute for professional mental-health or medical care.',
   foot:'Ben Pugh | benpughcoaching.com | IMPACT: Parenting with Perspective'}
];

const d = document.getElementById('deck');
for (const s of S){
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.t==='hero'?' hero':'') + (s.t==='reframe'||s.t==='list2'?' accent':'');
  let h = '';
  if (s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if (s.pill) h += '<div class="pill">'+s.pill+'</div>';
  if (s.h1) h += '<h1>'+s.h1+'</h1>';
  if (s.h2) h += '<h2>'+s.h2+'</h2>';
  if (s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if (s.html) h += '<div class="big">'+s.html+'</div>';
  if (s.p) h += '<p>'+s.p+'</p>';
  if (s.items){ h += '<ul>'; s.items.forEach(i=> h += '<li>'+i+'</li>'); h += '</ul>'; }
  if (s.two){ h += '<div class="two">'; s.two.forEach(b=>{ h += '<div class="box"><h3>'+b.h+'</h3><ul>'; b.items.forEach(i=> h += '<li>'+i+'</li>'); h += '</ul></div>'; }); h += '</div>'; }
  if (s.button) h += '<div><span class="cta-btn">'+s.button+'</span></div>';
  if (s.disclaimer) h += '<p class="disclaimer">'+s.disclaimer+'</p>';
  if (s.foot) h += '<div class="foot">'+s.foot+'</div>';
  sec.innerHTML = h;
  d.appendChild(sec);
}
</script>
</body>
</html>
