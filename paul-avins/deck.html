<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale Past £1m Without Being the Bottleneck — Paul Avins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111827; --panel:#1b2435; --rule:#2d3850;
    --accent:#8f35ef; --accent-soft:#d6bcfa; --ink:#f4f1f8; --muted:#9aa6b8;
    --display:'Montserrat',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:48px 44px;margin:20px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent-soft);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.08;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.12;margin-bottom:16px}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin-bottom:14px;max-width:62ch}
  p.muted{color:var(--muted);font-size:17px}
  .big{font-size:30px;font-weight:600;line-height:1.3}
  ul{list-style:none;margin:10px 0}
  li{font-size:19px;line-height:1.5;padding:10px 0 10px 30px;position:relative;max-width:62ch}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .pillar{font-family:var(--display);font-weight:800;color:var(--accent-soft);font-size:15px;
    letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
  .kicker{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent-soft);margin-bottom:8px}
  .stat{font-family:var(--display);font-weight:800;font-size:40px;color:var(--ink)}
  .grid{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
  .cell{flex:1 1 220px;background:#141d2e;border:1px solid var(--rule);border-radius:12px;padding:20px}
  .num{font-family:var(--display);font-weight:800;color:var(--accent);font-size:28px}
  .foot{font-size:13px;color:var(--muted);margin-top:8px}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:18px;max-width:70ch}
  .cta-btn{display:inline-block;background:var(--accent);color:#fff;font-family:var(--display);
    font-weight:700;font-size:18px;padding:14px 28px;border-radius:10px;margin-top:14px}
  .page{position:absolute;right:20px;bottom:16px;font-size:12px;color:var(--muted);font-family:var(--display)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Paul Avins',h:'Scale Past £1m Without Being the Bottleneck',
  p:'The Grown Up Business System for founders ready to stop being the engine and become the scale-up CEO.'},

 {t:'point',eyebrow:'Who this is for',h:'You built a real business. Now you are its ceiling.',
  bullets:['You run a £1m+ company you created from nothing.',
           'Growth has stalled because every decision still routes through you.',
           'You want to scale to £5m, £10m and beyond, and one day sell for real value.']},

 {t:'point',eyebrow:'The trap',h:'Everything you built now needs you to keep running.',
  p:'You took two days off and sales dipped. The team waited for answers only you had. The business is not independent of you yet. It is you, with staff.'},

 {t:'reframe',eyebrow:'The hard truth',h:'More leads will not fix this.',
  p:'A business that depends on the founder is capped at the founder. You cannot out-hustle a structural ceiling. The fix is not more effort. It is a different operating system.'},

 {t:'point',eyebrow:'Part one: the core problem',h:'The Operator Trap',
  bullets:['You are paid for what gets done, so you keep doing it.',
           'Your team escalates everything because you have always caught it.',
           'There is no system, so there is no business without you in the room.']},

 {t:'point',eyebrow:'Part one',h:'Why hustle makes it worse',
  p:'Every hour you spend working IN the business is an hour the business learns to need you more. The harder you work, the deeper the dependency. That is why the answer is counter-intuitive.'},

 {t:'framework',eyebrow:'Part two: the system',h:'The Grown Up Business System',
  p:'Three moves, in order, turn a founder-dependent company into one that scales without you. Mindset first, then people, then systems.',
  cells:[['01','Level UP'],['02','Team UP'],['03','Scale UP']]},

 {t:'pillar',eyebrow:'Part two',pillar:'Level UP',h:'The identity shift',
  p:'The first change is not in the business, it is in you. You move from operator and technician to scale-up CEO: the person who builds the machine instead of being the machine. Until that identity shifts, every system you install quietly collapses back onto you.'},

 {t:'pillar',eyebrow:'Part two',pillar:'Team UP',h:'A team that carries the load',
  p:'Scale is a team sport. You build a world-class team and put the right people in the right seats using behavioural profiling, so decisions happen without you and standards hold when you are not there.',
  foot:'This is where we use Team Purple profiling to align people to roles.'},

 {t:'pillar',eyebrow:'Part two',pillar:'Scale UP',h:'Systems that run the growth',
  p:'With the right mindset and team in place, you install the scale-up systems: repeatable sales, clean operations, cash flow and new customer channels. The business now grows through structure, not through your presence.'},

 {t:'point',eyebrow:'Part two',h:'Why the order matters',
  bullets:['Systems without the identity shift collapse back onto the founder.',
           'A team without systems just moves the chaos around.',
           'Level UP, then Team UP, then Scale UP. In that sequence.']},

 {t:'point',eyebrow:'Part three: the payoff',h:'A business that scales, and one day sells',
  p:'When the three moves hold together, the company grows past £1m, £5m, £10m without the founder as the bottleneck. And a business that runs without you is the one that is actually worth buying.'},

 {t:'point',eyebrow:'Part three',h:'Your first 90 days',
  bullets:['Name the five decisions only you make, and hand two of them away.',
           'Profile your team and fix the biggest seat that is wrong.',
           'Install one repeatable system in the function that breaks most often.']},

 {t:'proof',eyebrow:'Why listen to me',h:'21 years inside this exact problem',
  cells:[['550+','UK companies coached past £1m'],['21 yrs','coaching founders and CEOs'],['£27m','client exits in 2024 alone'],['79+','industries scaled']],
  foot:'Founder of the Grown Up Business System and host of The Grown UP Business Podcast.'},

 {t:'point',eyebrow:'The choice',h:'Stay the operator, or build the Grown Up Business.',
  p:'You can keep being the hardest working person in a business that cannot grow past you. Or you can become the CEO of a business that grows, and is worth something, without you in every room.'},

 {t:'cta',eyebrow:'Your next step',h:'Let us build your scale-up plan together.',
  p:'If you want help applying Level UP, Team UP and Scale UP to your business, the next step is a conversation about where you are and where you want to take it.',
  btn:'Book a call with Paul',
  disc:'Educational content only. No income or specific result is guaranteed. Results vary and depend on your market, your team and your own execution. Examples and figures shown are real client outcomes and are not a promise that you will achieve the same.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section'); d.className='slide';
  let html='';
  if(s.eyebrow) html+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.pillar) html+=`<div class="pillar">${s.pillar}</div>`;
  if(s.t==='title'){ html+=`<h1>${s.h}</h1>`; if(s.p) html+=`<p class="big">${s.p}</p>`; }
  else { if(s.h) html+=`<h2>${s.h}</h2>`; }
  if(s.p && s.t!=='title') html+=`<p>${s.p}</p>`;
  if(s.bullets){ html+='<ul>'; s.bullets.forEach(b=>html+=`<li>${b}</li>`); html+='</ul>'; }
  if(s.cells && s.t==='framework'){ html+='<div class="grid">'; s.cells.forEach(c=>html+=`<div class="cell"><div class="num">${c[0]}</div><div class="kicker">${c[1]}</div></div>`); html+='</div>'; }
  if(s.cells && s.t==='proof'){ html+='<div class="grid">'; s.cells.forEach(c=>html+=`<div class="cell"><div class="stat">${c[0]}</div><div class="foot">${c[1]}</div></div>`); html+='</div>'; }
  if(s.foot) html+=`<div class="foot">${s.foot}</div>`;
  if(s.btn) html+=`<div><span class="cta-btn">${s.btn}</span></div>`;
  if(s.disc) html+=`<div class="disc">${s.disc}</div>`;
  html+=`<div class="page">${i+1} / ${S.length}</div>`;
  d.innerHTML=html; deck.appendChild(d);
});
</script>
</body>
</html>
