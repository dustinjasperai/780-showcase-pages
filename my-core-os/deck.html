<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Sell at Your Peak · Jordan Benjamin, Peak Performance Selling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#2d3439; --deep:#23282c; --panel:#322a44; --rule:#3f4a52;
    --acc:#27c299; --ink:#eef2f3; --body:#b3bcc2; --dim:#7c868d; --cream:#eef2f3;
  }
  html,body{height:100%}
  body{background:#20252a;font-family:'Nunito Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#20252a}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Space Grotesk',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:-.01em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Nunito Sans',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Nunito Sans',sans-serif;font-size:1.9vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.4;font-weight:600}
  .t-section{align-items:flex-start;background:linear-gradient(120deg,var(--panel) 0%,#2b2740 100%)}
  .t-section .idx{font-family:'Space Grotesk',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#262b30 0%,#14181b 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2b2740 0%,#14181b 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Nunito Sans',sans-serif;color:#d4dade;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .core-motif{position:absolute;pointer-events:none}
  .title-core{right:7%;bottom:7.5%;width:17vw;opacity:.92}
  .corner-core{right:6.5%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-family:'Space Grotesk',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Peak Performance Selling</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- core motif: concentric rings around a center point (a steady core), drawn in teal -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="core" viewBox="0 0 120 120">
  <g fill="none" stroke="#27c299" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="60" r="7" fill="#27c299" stroke="none" opacity="0.9"/>
    <circle cx="60" cy="60" r="20" stroke-width="2" opacity="0.8"/>
    <circle cx="60" cy="60" r="34" stroke-width="1.6" opacity="0.5"/>
    <circle cx="60" cy="60" r="48" stroke-width="1.2" opacity="0.28"/>
    <path d="M60 6 V16 M60 104 V114 M6 60 H16 M104 60 H114" stroke-width="1.6" opacity="0.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Sell at Your Peak',sub:'How top performers sustain a high level of sales without burning out, by upgrading the operator, not just the tactics.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You can hit the number. Hitting it again next quarter without burning out is the part no one taught you.',body:'You are a seller or a sales leader who is good at this. You hit quota, you push through the slow weeks, you find another gear when the month is on the line. But every quarter resets to zero, the gear costs more each time you reach for it, and some Mondays the tank is just empty before the day even starts.'},
 {t:'dark',title:'A great quarter you cannot repeat is not performance. It is borrowed energy, and the interest comes due.'},

 {t:'section',idx:'Part One',title:'Why Grinding Harder Stops Working'},
 {t:'normal',k:'The effort ceiling',title:'More hours and more activity eventually stop moving the number.',body:'Most of us are taught that sales is an input game: more calls, more emails, more pipeline. It works, right up until it does not. At some point you are already doing the activity and the results flatten anyway, because the constraint is no longer how much you do. It is the state you are in while you do it.'},
 {t:'normal',k:'The burnout loop',title:'Push, hit the number, crash, scramble, repeat.',body:'The pattern is familiar: sprint to the quota, run on adrenaline, and pay for it with a flat, foggy stretch afterward where the pipeline quietly thins. Then the next target lands and you sprint again from a lower baseline. Motivation gets treated like it is infinite, and your nervous system keeps a very different set of books.'},
 {t:'dark',title:'You do not have a skills problem. You have an operating-system problem.'},

 {t:'section',idx:'Part Two',title:'The Personal Operating System'},
 {t:'normal',k:'Upgrade the operator',title:'Before any script or framework runs, something decides how you show up. That is your operating system.',body:'Your Personal Operating System is the internal setup, the mindset, the energy, and the habits, that governs how you sell before a single technique comes into play. Two reps can run the exact same playbook and get opposite results, because one is operating from a steady core and the other is white-knuckling it. Peak Performance Selling works on that layer first.'},
 {t:'normal',k:'Mindset',title:'How you take a no decides how many more you will go get.',body:'The inner narrative is trainable. A growth mindset, a quieter relationship with imposter syndrome, and real resilience under rejection are what let you stay in the game on the days it is not going your way. This is not positive thinking. It is deciding, on purpose, what a hard call gets to mean before the next one.'},
 {t:'normal',k:'Energy',title:'Manage energy, not just time, because energy is the thing you actually sell from.',body:'A full calendar with an empty operator is just busy. Treating energy as the real constraint, protecting the state you sell from, and building recovery into the week instead of apologizing for it, is what keeps performance available when you need it. You cannot pour presence and conviction into a call you showed up to depleted.'},
 {t:'normal',k:'Habits and practice',title:'Small, repeatable systems beat occasional heroics.',body:'Sustainable performance is built through intentional, deliberate practice and habits that hold on a normal Tuesday, not just under pressure. When the system carries the routine, harmony between work and life stops being a reward you never claim and becomes the thing that lets the performance compound instead of combust.'},
 {t:'dark',title:'Peak performance is not the day you go all out. It is the system that lets you do it again next week.'},

 {t:'section',idx:'Part Three',title:'What Changes When the System Runs You'},
 {t:'normal',k:'The seller this builds',title:'A steadier pipeline, a calmer operator, and a number that holds through a slow month.',body:'When the operating system is doing the work, you stop white-knuckling the quarter. The pipeline stays fuller because you are consistent instead of streaky, pressure lands softer because your baseline is higher, and a quiet week stops feeling like an identity crisis. You perform at a high level and you still have a life on the other side of it.'},
 {t:'dark',title:'The goal was never to sell harder. It was to sell at your peak and still have something left over.'},
 {t:'normal',k:'Why Jordan Benjamin',title:'Years in sales, then years spent studying what actually lets top performers sustain it.',body:'After years carrying a number himself and working alongside sellers, Jordan built My Core OS and the Peak Performance Selling podcast to explore the mental side of sustainable performance, the part the usual sales training skips. This masterclass is the operating-system approach he coaches, drawn straight from that work.'},

 {t:'section',idx:'Your Next Step',title:'Build Your Operating System'},
 {t:'normal',k:'Keep going with Jordan',title:'The full path, from the first upgrade to a system that runs on its own.',body:'The 8-week Peak Performance Selling program and 1:1 coaching are where you actually install the operating system, mindset, energy, and habits, with support the whole way. The masterclass shows you the map. The program is where you build it for real.'},
 {t:'cta',title:'Ready to sell at your peak without burning out?',body:'Take the next step with Peak Performance Selling.',chips:['The 8-week Peak Performance Selling program','Book a 15-minute call'],disc:'Educational content for sellers and sales leaders. No income, quota, or result is guaranteed. Individual results vary by person, role, and market.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="core-motif ${kind==='title'?'title-core':'corner-core'}"><use href="#core"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Peak Performance <b>Selling</b> · Jordan Benjamin</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
