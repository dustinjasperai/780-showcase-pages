<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wisdom Transfer Method | Life Letters Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f4ec;
    --panel:#fffdf8;
    --rule:#d8d0c0;
    --ink:#09346f;
    --accent:#0b83c4;
    --grey:#4a4a4a;
    --dim:#7a7a7a;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--grey);font-family:'Raleway',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:1000px;animation:fade .35s ease}
  .slide.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;color:var(--ink);font-size:60px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--ink);font-size:42px;line-height:1.12;margin-bottom:20px}
  .lede{font-size:23px;color:var(--grey);line-height:1.5;margin-top:22px;max-width:760px}
  .promise{font-size:20px;color:var(--dim);margin-top:26px;max-width:720px}
  ul{list-style:none;margin-top:14px;max-width:800px}
  li{position:relative;padding-left:34px;margin-bottom:16px;font-size:20px;color:var(--grey);line-height:1.5}
  li::before{content:'';position:absolute;left:0;top:12px;width:16px;height:2px;background:var(--accent)}
  li b{color:var(--ink);font-weight:700}
  .big{font-size:30px;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.3;max-width:820px}
  .letter{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border:2px solid var(--accent);color:var(--ink);font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;border-radius:6px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:30px 34px;margin-top:8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
  .grid .card p:first-child{color:var(--ink);font-weight:700;font-size:19px;margin-bottom:6px}
  .grid .card p:last-child{font-size:17px;color:var(--grey);line-height:1.45}
  .disc{font-size:15px;color:var(--dim);margin-top:24px;max-width:760px;line-height:1.5}
  .foot{position:fixed;left:7vw;bottom:3.4vh;font-size:13px;color:var(--dim);letter-spacing:.04em}
  .prog{position:fixed;right:7vw;bottom:3.4vh;font-size:13px;color:var(--dim);letter-spacing:.06em}
  .nav{position:fixed;inset:0;display:flex;justify-content:space-between;pointer-events:none}
  .nav div{width:20%;pointer-events:auto;cursor:pointer}
  @media(max-width:640px){h1{font-size:38px}h2{font-size:30px}.lede{font-size:19px}.big{font-size:23px}li{font-size:17px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><div onclick="go(-1)"></div><div onclick="go(1)"></div></div>
<div class="foot">Life Letters &nbsp;&middot;&nbsp; The Wisdom Transfer Method</div>
<div class="prog" id="prog"></div>
<script>
const S=[
  {t:'title',k:'A Live Life Letters Masterclass',h:'The Wisdom Transfer Method',lede:'How to turn a lifetime of hard-won lessons into a system that compounds into wealth, wisdom, and happiness.',promise:'The next 45 minutes, live with Ed McCarthy. No hacks, no hype. The five decisions that actually change a life, and how to hand them forward.'},

  {t:'who',k:'Who this is for',h:'You are further along than you admit',bullets:['You have built something real, and you still feel a quiet gap between success and meaning.','You want your kids, your team, or your future self to inherit more than money.','You are done with motivation that fades by Monday and want a system that holds.']},

  {t:'trap',k:'The trap',h:'Advice is everywhere. Wisdom is not.',lede:'You can read a hundred books this year and change nothing. Information is free and endless. What almost nobody has is a way to convert their own experience into decisions they actually live by, and then pass on.',promise:'Most people reach the end of a hard-won decade with the lesson still trapped in their head, never written, never transferred.'},

  {t:'reframe',k:'The reframe',h:'It took a near-death experience to see it',big:'Stripped down to what actually mattered, I did not think about my portfolio. I thought about the letters I had never written to the people I loved. Wealth without transferred wisdom is just a number that dies with you.'},

  {t:'part',k:'Part one',h:'The core problem',lede:'Why smart, successful people stay stuck at the same inner level for years, even as the outer numbers grow.'},

  {t:'content',k:'Part one',h:'You are living by default decisions',bullets:['Most of your life is running on decisions you never consciously made, inherited from family, fear, or habit.','A default life can still look impressive from the outside and feel hollow from the inside.','Nothing compounds, because there is no deliberate structure underneath the effort.']},

  {t:'content',k:'Part one',h:'Wisdom is an asset you are letting rot',bullets:['Every hard season taught you something specific and expensive. Almost none of it is captured.','What is not written is not transferable, and what is not transferable dies with you.','The highest-leverage move is not learning more. It is converting what you already lived into a durable form.']},

  {t:'part',k:'Part two',h:'The Wisdom Transfer Method',lede:'The system behind Life Letters: five decisions, twenty-six letters, one designed life.'},

  {t:'framework',k:'Part two',h:'Five Decisions to Wealth, Wisdom and Happiness',lede:'The spine of the method. Five decisions, made on purpose, that quietly govern every outcome downstream.',grid:[['1. Clarity','Decide what a life well lived actually means for you, in concrete terms, before chasing anyone else’s version.'],['2. Ownership','Decide to author your choices instead of inheriting them by default.'],['3. Compounding','Decide which few things you will let stack for decades instead of restarting every year.'],['4. Transfer','Decide to capture and hand forward what you learn, so it outlives you.'],['5. Alignment','Decide to close the gap between what you value and how you spend a Tuesday.']]},

  {t:'pillar',k:'Part two',h:'A is for the first letter you never wrote',letter:'A',lede:'The A-to-Z Wisdom Transfer Letters are the capture engine. Twenty-six short letters, each one a single hard-won lesson written to the person who needs it, starting with the one you keep putting off.'},

  {t:'content',k:'Part two',h:'Why letters, and not another course',bullets:['A letter forces a decision into plain words a real person can use. Vagueness cannot survive it.','Twenty-six is small enough to start today and deep enough to map a whole life.','Written down, a lesson becomes an asset: re-readable, shareable, and impossible to lose.']},

  {t:'pillar',k:'Part two',h:'Lifestyle Design, on purpose',letter:'L',lede:'Once the decisions are named and the letters are written, you design the days around them. Lifestyle Design is choosing your default settings deliberately instead of drifting into whatever the calendar and the culture hand you.'},

  {t:'content',k:'Part two',h:'From transfer to Highest Self',bullets:['Wisdom transferred to yourself becomes identity. Wisdom transferred to others becomes legacy.','The Highest Self is not a peak you visit. It is the version of you that your own decisions make inevitable.','This is the difference between a good quarter and a life that keeps getting truer.']},

  {t:'part',k:'Part three',h:'The method, in one ordinary week',lede:'This is not a retreat you attend once. It is a small set of moves you repeat.'},

  {t:'content',k:'Part three',h:'The weekly rhythm',bullets:['One decision reviewed: is a default still running your calendar, your money, or your relationships?','One letter drafted: fifteen minutes, one lesson, one named reader.','One alignment check: where did this week match your five decisions, and where did it not?']},

  {t:'content',k:'Part three',h:'What changes in ninety days',bullets:['A written body of your own wisdom you can hand to your family, your team, or your future self.','Fewer default reactions, more decisions you actually chose.','A felt sense that the outer numbers and the inner life are finally pointing the same direction.']},

  {t:'proof',k:'Why me',h:'I did not start with the answers',lede:'Technology founder, entrepreneur, and father. A near-death experience in the Colorado Rockies forced the question that became Life Letters, a book and a community built to transfer wisdom to a million people. I teach this because I needed it first.'},

  {t:'content',k:'The invitation',h:'What we build together',bullets:['Your own version of the Five Decisions, written in your words, not borrowed from mine.','Your first letters, so the transfer starts this week and does not wait for a someday that never comes.','A designed life that compounds wealth, wisdom, and happiness on purpose.']},

  {t:'cta',k:'Your next step',h:'Start your first Life Letter',lede:'If today named a gap you have felt for years, the next step is simple. Take the free first step inside the Life Letters community, write the letter you keep putting off, and begin designing the life your own decisions make inevitable.',disc:'This masterclass is educational. No specific financial, health, or life result is guaranteed. Results vary and depend on your own effort and circumstances.'},
];

const stage=document.getElementById('stage'),prog=document.getElementById('prog');let i=0;
function render(){
  stage.innerHTML='';
  const s=S[i],d=document.createElement('div');d.className='slide on';
  let html='';
  if(s.k)html+='<div class="kicker">'+s.k+'</div>';
  if(s.letter)html+='<div class="letter">'+s.letter+'</div>';
  if(s.t==='title'){html+='<h1>'+s.h+'</h1>';}else{html+='<h2>'+s.h+'</h2>';}
  if(s.lede)html+='<p class="lede">'+s.lede+'</p>';
  if(s.big)html+='<p class="big">'+s.big+'</p>';
  if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul>';}
  if(s.grid){html+='<div class="grid">';s.grid.forEach(g=>html+='<div class="card"><p>'+g[0]+'</p><p>'+g[1]+'</p></div>');html+='</div>';}
  if(s.promise)html+='<p class="promise">'+s.promise+'</p>';
  if(s.disc)html+='<p class="disc">'+s.disc+'</p>';
  d.innerHTML=html;stage.appendChild(d);
  prog.textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.min(S.length-1,Math.max(0,i+n));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
