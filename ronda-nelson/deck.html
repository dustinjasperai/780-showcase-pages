<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Clinical Entrepreneur: A Masterclass with Ronda Nelson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ea; --panel:#fffdf7; --rule:#e4e0d8; --ink:#4b4847;
    --muted:#827d77; --accent:#0056a7; --gold:#f3c736;
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'Quicksand',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#efeae2;color:var(--ink);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:56px 60px;margin:20px 0;min-height:480px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .slide.cover{background:var(--panel)}
  .slide.dark{background:var(--accent);color:#fff;border-color:var(--accent)}
  .slide.dark .eyebrow{color:var(--gold)}
  .slide.dark .muted{color:#d6e2f2}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.12;margin-bottom:18px}
  .lede{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--muted);margin-top:18px}
  p{font-size:19px;margin-top:14px;max-width:62ch}
  .muted{color:var(--muted)}
  .gold-underline{display:inline-block;border-bottom:3px solid var(--gold);padding-bottom:2px}
  ul{margin:18px 0 0 0;list-style:none}
  li{font-size:19px;padding:12px 0 12px 26px;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;
    background:var(--gold);border-radius:50%}
  li b{font-family:var(--sans);font-weight:600;color:var(--ink)}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
  .pillar{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:22px}
  .pillar .n{font-family:var(--serif);font-size:30px;color:var(--accent)}
  .pillar h3{font-family:var(--sans);font-size:17px;font-weight:600;margin:8px 0 6px}
  .pillar p{font-size:15px;margin:0;color:var(--muted)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:24px}
  .card h3{font-family:var(--serif);font-size:24px;color:var(--accent);margin-bottom:6px}
  .card p{font-size:16px;margin-top:8px}
  .step{font-size:18px;padding:10px 0;border-bottom:1px solid var(--rule)}
  .step b{color:var(--accent)}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:70ch;line-height:1.6}
  .pg{font-size:13px;color:var(--muted);margin-top:30px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'cover',eyebrow:'A free live masterclass with Ronda Nelson',
    title:'The Clinical Entrepreneur',
    lede:'How to build a practice that pays you like the expert you are, without grinding through more patients.'},

  {t:'agenda',eyebrow:'What we will cover',
    title:'The next hour, in three parts.',
    items:[
      '<b>Why a full calendar still leaves you stuck.</b> The ceiling built into how most practices charge.',
      '<b>The 3 Big Things.</b> The exact places a practice leaks, and the one shift that changes the math.',
      '<b>The path from here.</b> How to fill the practice first, then scale it, without burning out.'
    ]},

  {t:'who',eyebrow:'Who this is for',
    title:'You are great in the treatment room.',
    body:'You trained for years to get real clinical results. What nobody trained you for is everything behind the scenes: the pricing, the systems, the marketing, the part that decides whether the practice actually supports you. If you are confident with patients and unsure about the business, this hour is for you.'},

  {t:'who2',eyebrow:'Who this is for',
    title:'Three questions you cannot quite shake.',
    items:[
      '<b>Why am I this busy and still not getting ahead?</b>',
      '<b>Why does charging what I am worth feel so hard?</b>',
      '<b>How do new patients find me without me chasing them?</b>'
    ]},

  {t:'trap',dark:true,eyebrow:'The trap',
    title:'A full calendar is not the same as a thriving practice.',
    body:'Most wellness practitioners solve a slow month by adding more patients. More hours, more visits, same ceiling. The calendar fills up and the income still flattens out. The problem was never your clinical skill. It is the model underneath it.'},

  {t:'symptom',eyebrow:'The tells',
    title:'You can feel it before you can name it.',
    items:[
      '<b>Busy and broke.</b> The schedule is packed and the numbers do not reflect it.',
      '<b>Quietly discounting.</b> You soften your prices because asking feels uncomfortable.',
      '<b>Dreading the business side.</b> The clinical work energizes you; everything around it drains you.'
    ]},

  {t:'part',eyebrow:'Part one',
    title:'Why the fee-for-service model caps you.',
    body:'When you sell visits, you sell your time, and time runs out. Every dollar is tied to another hour in the room. You cannot out-work a ceiling that is built into how you charge. The way out is not working harder inside the model. It is changing the model.'},

  {t:'cost',dark:true,eyebrow:'Part one',
    title:'The ceiling has a real cost.',
    body:'It is not only income. It is the raise you keep postponing, the time away from your own family, the good ideas you never build because every hour is already spoken for. A practice that only pays you when you are in the room is a job you gave yourself, not a business.'},

  {t:'reframe',eyebrow:'The reframe',
    title:'A thriving practice is three skills, not one.',
    body:'Clinical excellence is one skill. Running a profitable business is a second. Getting new people to find you is a third. You were trained in the first and left to guess at the other two. Once you see them as separate, learnable skills, the practice stops feeling stuck.'},

  {t:'pillars',eyebrow:'Part two · the method',
    title:'The 3 Big Things',
    sub:'The diagnostic I use to find where a practice is actually leaking.',
    pillars:[
      {n:'01',h:'Clinical',p:'The results you already get. The foundation everything else is built on, and the part you have handled.'},
      {n:'02',h:'Business',p:'Pricing, policies, systems, and the numbers. The engine that decides whether the work pays you properly.'},
      {n:'03',h:'Marketing',p:'How new people who have never heard of you find you, trust you, and say yes.'}
    ]},

  {t:'mastered',dark:true,eyebrow:'Part two · the method',
    title:'You have mastered one. Let us build the other two.',
    body:'Almost every practitioner I work with has the clinical pillar handled. The income stays flat because the business and marketing pillars were never taught anywhere, not in school and not in your certifications. That gap is not a character flaw. It is a curriculum nobody gave you.'},

  {t:'proc',eyebrow:'Part two · the method',
    title:'Build your own proprietary process.',
    body:'The single biggest shift is packaging your care into a signature, branded process instead of selling one visit at a time. When patients enroll in an outcome rather than an appointment, you charge for the transformation, not the hour, and you finally step off the fee-for-service treadmill.'},

  {t:'procab',eyebrow:'Part two · the shift',
    title:'From appointment to outcome.',
    cards:[
      {h:'Selling appointments',p:'Each visit is priced on its own. The patient decides week to week. Your income resets to zero every Monday and your time is the only thing for sale.'},
      {h:'Selling an outcome',p:'Patients enroll in a defined path to a result they want. They commit up front, they stay longer, and your price reflects the transformation instead of the hour.'}
    ]},

  {t:'two',eyebrow:'Part two · the path',
    title:'Doer first, then Master.',
    cards:[
      {h:'The Doer stage',p:'Fill the practice. Get clear on your ideal patient, build simple marketing and content systems, and put referral and retention mechanisms in place so new patients arrive on purpose, not by luck.'},
      {h:'The Master stage',p:'Scale the practice. Hire and onboard support, get your financial strategy in order, add new revenue streams, and build the operating systems so the practice runs without living on your shoulders.'}
    ]},

  {t:'mistake',eyebrow:'Part two · a warning',
    title:'The most common mistake.',
    body:'Practitioners try to scale before the practice is full, or chase more marketing before the business behind it can hold the weight. Order matters. Fill the practice with a repeatable path in, get the systems and pricing right, and only then add team and new revenue. Skip a step and the growth creates the chaos.'},

  {t:'look',eyebrow:'Part three',
    title:'When the model changes, this is what shifts.',
    items:[
      '<b>Your income is no longer capped by your calendar.</b> Revenue stops being one-for-one with hours.',
      '<b>You charge for outcomes.</b> A signature program patients value, instead of a stack of single visits.',
      '<b>New patients find you on purpose.</b> A repeatable path in, not word-of-mouth and hope.',
      '<b>The practice supports your life.</b> Systems and a team carry the weight you used to carry alone.'
    ]},

  {t:'whyme',eyebrow:'Why me',
    title:'I have been exactly where you are.',
    body:'I spent 20+ years building and running a thriving wellness practice of my own, and I have spent years since teaching practitioners all over the country how to do the same. I know the treatment room and I know the spreadsheet, and I have made every one of these mistakes so you do not have to.'},

  {t:'whatis',eyebrow:'Where this goes deeper',
    title:'The Clinical Entrepreneur, in two places.',
    cards:[
      {h:'The podcast',p:'The Clinical Entrepreneur is my show for practitioners who are confident in the treatment room and unsure behind the scenes. Straight business advice, every week, built for how a practice actually works.'},
      {h:'Clinical Business Academy',p:'My coaching program where practitioners get the roadmap, the systems, and the accountability to fill, streamline, and scale a practice they genuinely love.'}
    ]},

  {t:'cta',eyebrow:'Your next step',
    title:'Let us map your practice.',
    steps:[
      ['Book a Practice Strategy Call','A short, focused conversation about where your practice is now and where you want it to go.'],
      ['Get a clear plan','We pinpoint which of the 3 Big Things is holding you back and what to do next.'],
      ['Decide if the Academy is a fit','If the Clinical Business Academy is right for you, we will talk about it. If not, you still leave with a plan.']
    ],
    disc:'Educational only. Nothing here is a promise of income, revenue, or specific results. Practice outcomes vary and depend on your market, your effort, and many factors outside any program. Member stories are individual experiences, not typical results or guarantees.'}
];

const deck=document.getElementById('deck');
function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
S.forEach(s=>{
  let inner='';
  const eb=s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:'';
  if(s.t==='cover'){
    inner=`${eb}<h1>${s.title}</h1><div class="lede">${s.lede}</div><div class="pg">Presented by Ronda Nelson · The Clinical Entrepreneur</div>`;
    deck.appendChild(el(`<section class="slide cover">${inner}</section>`));return;
  }
  if(s.pillars){
    inner=`${eb}<h2><span class="gold-underline">${s.title}</span></h2><p class="muted">${s.sub}</p>
      <div class="pillars">${s.pillars.map(p=>`<div class="pillar"><div class="n">${p.n}</div><h3>${p.h}</h3><p>${p.p}</p></div>`).join('')}</div>`;
    deck.appendChild(el(`<section class="slide">${inner}</section>`));return;
  }
  if(s.cards){
    inner=`${eb}<h2><span class="gold-underline">${s.title}</span></h2>
      <div class="two">${s.cards.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')}</div>`;
    deck.appendChild(el(`<section class="slide">${inner}</section>`));return;
  }
  if(s.items){
    const cls=s.dark?'slide dark':'slide';
    inner=`${eb}<h2><span class="gold-underline">${s.title}</span></h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    deck.appendChild(el(`<section class="${cls}">${inner}</section>`));return;
  }
  if(s.t==='cta'){
    inner=`${eb}<h2><span class="gold-underline">${s.title}</span></h2>
      ${s.steps.map(st=>`<div class="step"><b>${st[0]}.</b> ${st[1]}</div>`).join('')}
      <div class="disc">${s.disc}</div>`;
    deck.appendChild(el(`<section class="slide">${inner}</section>`));return;
  }
  // generic content / trap / reframe / part / who / proc / whyme
  const cls=s.dark?'slide dark':'slide';
  inner=`${eb}<h2>${s.title}</h2><p>${s.body}</p>`;
  deck.appendChild(el(`<section class="${cls}">${inner}</section>`));
});
</script>
</body>
</html>
