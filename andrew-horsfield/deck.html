<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Messy Middle, a Masterclass with Andrew Horsfield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f6f0;      /* their warm site background */
    --panel:#ffffff;      /* their footer panel */
    --ink:#231847;        /* their deep indigo (2nd-ranked brand hex) */
    --muted:#7f829a;      /* their dominant body slate */
    --accent:#ffcc66;     /* their warm gold accent */
    --rule:#e3e1d8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:64px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:28px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;font-weight:600}
  h1{font-family:"Zilla Slab",serif;font-weight:700;font-size:56px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:"Zilla Slab",serif;font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-.01em}
  h3{font-family:"Zilla Slab",serif;font-weight:600;font-size:26px;line-height:1.15}
  p{font-size:20px;line-height:1.5;color:#31304a;max-width:62ch}
  p.lead{font-size:24px;color:var(--ink)}
  .sub{color:var(--muted);font-size:20px;margin-top:16px}
  .accentbar{height:6px;width:72px;background:var(--accent);border-radius:4px;margin:0 0 26px}
  .path{display:flex;align-items:center;gap:10px;margin-top:30px;flex-wrap:wrap}
  .path .dot{width:13px;height:13px;border-radius:50%;background:var(--accent)}
  .path .line{flex:1;height:2px;background:var(--rule);min-width:30px}
  .path .end{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink)}
  ul{margin:22px 0 0 0;padding:0;list-style:none}
  li{font-size:20px;line-height:1.5;color:#31304a;padding:10px 0 10px 30px;position:relative;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .step{display:flex;gap:22px;align-items:flex-start}
  .step .mark{font-family:"Zilla Slab",serif;font-weight:700;font-size:40px;color:var(--accent);line-height:1;min-width:64px}
  .quote{font-family:"Zilla Slab",serif;font-size:30px;line-height:1.25;color:var(--ink);font-weight:500}
  .disclaimer{margin-top:26px;font-size:14px;color:var(--muted);line-height:1.5;max-width:70ch}
  .cta-line{display:inline-block;margin-top:24px;font-family:"Zilla Slab",serif;font-weight:600;font-size:22px;color:var(--ink);border-bottom:3px solid var(--accent);padding-bottom:4px}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:14px 34px;margin-top:24px}
  .who div{font-size:19px;color:#31304a;padding-left:26px;position:relative}
  .who div:before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;border-radius:2px;background:var(--accent)}
  @media(max-width:680px){.slide{padding:40px 26px}h1{font-size:38px}h2{font-size:28px}.who{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Andrew Horsfield',
   h1:'The Messy Middle',
   sub:'How ambitious leaders turn stuckness into strength.'},

  {t:'who', eyebrow:'Who this is for',
   h2:'If you are stuck in the gap',
   p:'This hour is for the people I have spent eighteen years working with: founders, executives and team leaders who are driven, capable, and quietly stuck.',
   items:['You hit the goals and still feel flat','You know life could be better','Progress feels out of your control','You are ready to do things differently']},

  {t:'content', eyebrow:'The trap',
   h2:'You do not have an effort problem',
   p:'You have already tried harder. You have read the books, made the plans, pushed through. When the usual advice stops working, it is tempting to believe the problem is you.',
   lead:'It is not. You are simply in the messy middle, and nobody taught you how to work it.'},

  {t:'hook', eyebrow:'The reframe',
   quote:'The messy middle is not the problem. It is the proof you are doing something that matters.',
   sub:'Most people try to escape it. The leaders who grow learn to move through it.'},

  {t:'part', eyebrow:'Part one', h2:'Why you get stuck'},

  {t:'content', eyebrow:'Part one',
   h2:'Stuckness is a story, not a dead end',
   p:'Being stuck is rarely about capability. It is about an obstacle you have not named and a story you keep telling yourself about what is possible.',
   items:['The messy middle: the space between where you are and where you want to be, when progress feels out of your control','Under pressure, the story hardens and the obstacle hides','Name both, and the stuckness starts to move']},

  {t:'content', eyebrow:'Part one',
   h2:'Empathy, not ego',
   p:'Real change does not come from pushing harder or from recycled frameworks. It comes from wisdom you earn by living these ideas every single day.',
   lead:'Life gets messy. When you manage the mess, you master your life.'},

  {t:'part', eyebrow:'Part two', h2:'The method: five steps to get unstuck'},

  {t:'step', eyebrow:'Step one', mark:'01', h3:'Identify',
   p:'Recognise the signs of stuckness and get honest about your real reason for change. Clarity on the why comes before any plan.'},

  {t:'step', eyebrow:'Step two', mark:'02', h3:'Unlock',
   p:'Surface the hidden obstacle and the underlying story keeping you in place. You cannot move what you refuse to name.'},

  {t:'step', eyebrow:'Step three', mark:'03', h3:'Commit',
   p:'Make the decision and take the smallest next step. Momentum is built from small, deliberate moves, not grand gestures.'},

  {t:'step', eyebrow:'Step four', mark:'04', h3:'Execute',
   p:'Schedule it and manage the difficulties that will show up. Progress survives contact with a messy week only when it has a place to live.'},

  {t:'step', eyebrow:'Step five', mark:'05', h3:'Evolve',
   p:'Reflect, track what is working, and build the change into how you lead and live. This is how a breakthrough becomes a habit.'},

  {t:'content', eyebrow:'Part two',
   h2:'Build good allies',
   p:'You are not meant to do this alone. The leaders who move fastest surround themselves with truth-tellers and robust supporters, not just cheerleaders.',
   items:['People who tell you the truth','People who have your back when it gets hard','People who hold you to who you said you wanted to be']},

  {t:'part', eyebrow:'Part three', h2:'Life on the other side of stuck'},

  {t:'content', eyebrow:'Part three',
   h2:'From stuck to strength',
   p:'When you work the middle instead of fighting it, the shift is practical and it sticks:',
   items:['Clarity on what actually matters next','Momentum you can see in your results and feel in your chest','A way to meet the next messy stretch without unravelling']},

  {t:'why', eyebrow:'Why me',
   h2:'I have lived in this middle for eighteen years',
   p:'I facilitate transformational events, programs and workshops for founders, Fortune 500 leaders, educators and elite-sport performers. I am the author of Better and the host of The Messy Middle podcast.',
   sub:'I prefer to lead with empathy, not ego, using tools I use myself every day.'},

  {t:'content', eyebrow:'Recap',
   h2:'The whole method in one breath',
   items:['The messy middle is where real change happens','Name the obstacle and the story that keep you stuck','Identify, Unlock, Commit, Execute, Evolve','Build allies who tell you the truth','Manage the mess, master your life']},

  {t:'cta', eyebrow:'Your next step',
   h2:'Ready to get unstuck?',
   p:'If this is the work you want to do, the next step is a short exploration call. We get to the heart of what matters, find what is keeping you stuck, and map a path forward. If it is a fit, we keep going together.',
   cta:'Book an exploration call with Andrew',
   disclaimer:'This masterclass is for educational purposes only. It shares tools and principles, not promises. Results depend on your own circumstances, effort and follow-through; no specific outcome is guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '<div class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</div>';
  if(s.eyebrow) inner += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){
    inner += '<div class="accentbar"></div><h1>'+s.h1+'</h1>';
    if(s.sub) inner += '<p class="sub">'+s.sub+'</p>';
    inner += '<div class="path"><span class="dot"></span><span class="line"></span><span class="dot"></span><span class="line"></span><span class="end"></span></div>';
  } else if(s.t==='part'){
    inner += '<div class="accentbar"></div><h2>'+s.h2+'</h2>';
  } else if(s.t==='hook'){
    inner += '<p class="quote">'+s.quote+'</p>';
    if(s.sub) inner += '<p class="sub">'+s.sub+'</p>';
  } else if(s.t==='step'){
    inner += '<div class="step"><div class="mark">'+s.mark+'</div><div><h3>'+s.h3+'</h3><p style="margin-top:12px">'+s.p+'</p></div></div>';
  } else if(s.t==='who'){
    inner += '<h2>'+s.h2+'</h2>';
    if(s.p) inner += '<p style="margin-top:16px">'+s.p+'</p>';
    if(s.items){ inner += '<div class="who">'; s.items.forEach(x=>inner+='<div>'+x+'</div>'); inner += '</div>'; }
  } else if(s.t==='cta'){
    inner += '<div class="accentbar"></div><h2>'+s.h2+'</h2>';
    if(s.p) inner += '<p style="margin-top:16px">'+s.p+'</p>';
    if(s.cta) inner += '<span class="cta-line">'+s.cta+'</span>';
    if(s.disclaimer) inner += '<p class="disclaimer">'+s.disclaimer+'</p>';
  } else {
    if(s.h2) inner += '<h2>'+s.h2+'</h2>';
    if(s.h3) inner += '<h3>'+s.h3+'</h3>';
    if(s.p) inner += '<p style="margin-top:16px">'+s.p+'</p>';
    if(s.lead) inner += '<p class="lead" style="margin-top:18px">'+s.lead+'</p>';
    if(s.items){ inner += '<ul>'; s.items.forEach(x=>inner+='<li>'+x+'</li>'); inner += '</ul>'; }
  }
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
