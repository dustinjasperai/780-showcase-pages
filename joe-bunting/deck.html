<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finish Your Book in 100 Days, a masterclass with Joe Bunting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4ecdd;
    --panel:#fbf8f0;
    --rule:#ddd0ba;
    --ink:#241f18;
    --muted:#6f6553;
    --accent:#8c2f22;
    --accent2:#3a5a54;
    --head:'Spectral',Georgia,serif;
    --body:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 20px 48px rgba(52,38,20,.16);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* manuscript motif: a red editor's rule down the left margin, like a marked-up page */
  .slide::before{content:'';position:absolute;top:44px;bottom:44px;left:40px;width:2px;
    background:linear-gradient(180deg,rgba(140,47,34,0),var(--accent) 18%,var(--accent) 82%,rgba(140,47,34,0));pointer-events:none;opacity:.5}
  .slide::after{content:'';position:absolute;top:58px;left:34px;width:14px;height:14px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 5px rgba(140,47,34,.12)}
  .kick{font-family:var(--body);font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:62px;line-height:1.04;margin:0 0 18px;letter-spacing:-.01em;color:var(--ink)}
  h2{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.10;margin:0 0 20px;letter-spacing:-.005em;color:var(--ink)}
  h3{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.52;color:var(--muted);margin:0 0 14px;max-width:47ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  .em2{color:var(--accent2)}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 42px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:6px;top:22px;width:12px;height:12px;border-radius:2px;
    background:var(--accent);transform:rotate(45deg)}
  li b{font-weight:700}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:88px;line-height:1.02;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
  .strike{color:transparent;-webkit-text-stroke:1.6px rgba(36,31,24,.42);position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:50%;height:5px;background:var(--accent);transform:rotate(-2deg);border-radius:3px}
  .row{display:flex;gap:16px;margin-top:22px;flex-wrap:wrap}
  .cell{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:20px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:16px;margin:0}
  .who{font-size:19px;color:var(--muted);margin-top:auto;padding-top:22px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:66ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:38px}h2{font-size:29px}.big{font-size:50px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">The Write Practice · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'Finish Your Book in 100 Days',p:'The structure great stories share, and the 100 day cadence that turns it into a finished draft. For writers who keep starting books and never finishing them.',pres:'With <b>Joe Bunting</b>, founder of The Write Practice'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why your drafts keep dying','The real reason books stall at chapter three, and it is not a talent problem.'],['The structure under every story','The elements great stories share, and how to build them into yours before you write.'],['A 100 day path to a finished draft','A cadence you can actually keep, so the book gets written instead of restarted.']]},
 {t:'audience',kick:'Who this is for',h:'You have started three books. You finished none.',p:'Capable writers with a drawer full of first chapters, a folder of abandoned ideas, and the quiet fear that you are just not the kind of person who finishes. You do not need more inspiration. You need a map and a deadline.',who:'<b>The trap:</b> you treat finishing as a discipline problem, so you wait to feel ready, buy another notebook, and start something new. The blank page wins again.'},
 {t:'reframe',kick:'The reframe',big1:'Start another book.',big2:'<span class="em">Finish</span> this one.',p:'You do not have a talent problem. You have a structure and finishing problem. The writers who finish are rarely the most gifted. They are the ones working a proven structure against a real deadline.'},
 {t:'stakes',kick:'The stakes',h:'An unfinished book costs more than time.',p:'Every abandoned draft chips away at the belief that you can do this at all, until the dream shrinks to a someday that never comes. Structure and a deadline are what turn a capable-but-stalled writer into a finished author, and both can be learned.'},
 {t:'part',kick:'Part one',h:'Why willpower alone never finishes a book.'},
 {t:'point',kick:'The core problem',h:'Waiting for inspiration is the trap.',p:'Inspiration starts books. It does not finish them. When the only fuel is motivation, the draft dies the first week the feeling does not show up, which is every week around chapter three. Practice and a plan carry you when the mood will not.'},
 {t:'point',kick:'The core problem',h:'Without a map, the middle collapses.',p:'Most books do not fail at the blank page. They fail in the murky middle, where you lose the thread of what the story is actually about. A writer with no structure is navigating a novel by feel, and the fog wins almost every time.'},
 {t:'signs',kick:'The core problem',h:'The signs you have a finishing problem.',li:[['You start strong, then stall','The first chapters flow, then chapter three turns into a wall you never get past.'],['You keep restarting','A new idea always feels easier than finishing the hard middle of the old one.'],['You edit instead of advancing','You polish chapter one for the tenth time because moving forward has no map.']]},
 {t:'part',kick:'Part two',h:'The structure great stories share.'},
 {t:'framework',kick:'The method',h:'A story is built, not summoned.',row:[['Core idea','The one story only you can tell.'],['The reader','Who you are really writing for.'],['The elements','The plot beats every story shares.'],['The arc','How the story\'s value changes.']],p:'This is The Write Structure, the framework our book coaches are trained in. It gives you simple, universal terms for what makes a story work, so you can build one on purpose instead of hoping one appears.'},
 {t:'point',kick:'The elements of plot',h:'Every story shares the same skeleton.',p:'Underneath genre and voice, the stories readers love move through the same handful of plot elements in the same recognizable order. Learn to see them and you can find what is missing in your own draft, and add it, instead of staring at a stalled chapter wondering why it feels flat.'},
 {t:'point',kick:'The changing value',h:'Structure is a value that shifts.',p:'A story is not a list of events, it is a value moving from one state to its opposite and back, scene by scene. When you can name the value at stake and track how it turns, the murky middle stops being murky. You always know what the next scene has to do.'},
 {t:'point',kick:'Outline before you draft',h:'Ninety minutes of structure saves ninety days.',p:'A short structural outline, your core idea, your reader, and the shape of the arc, is what keeps the draft on the rails once the excitement wears off. It is the difference between writing toward an ending and wandering until you quit.'},
 {t:'part',kick:'Part three',h:'The 100 day cadence that finishes it.'},
 {t:'framework',kick:'The cadence',h:'How a book actually gets done.',row:[['One idea','Committed to, not kept in a drawer of maybes.'],['One reader','Chosen, so every scene has a target.'],['One chapter','A week, workshopped, not waited on.'],['One deadline','100 days, the pressure that ships a draft.']],p:'Not more hours. A rhythm you can keep: a clear structure, a weekly chapter, real feedback, and a deadline close enough to be real. That is what carries a book from idea to finished draft in 100 days.'},
 {t:'looks',kick:'The outcome',h:'What changes when you finish.',li:[['You have a finished draft','A complete manuscript in your hands, not another abandoned chapter one.'],['You trust yourself again','Finishing once proves you can, and the next book starts from belief instead of doubt.'],['You have something to publish','A real draft is the only thing an editor, an agent, or a reader can ever say yes to.']]},
 {t:'whyme',kick:'Why Joe',h:'Coached from the finished side of the page.',li:[['I write for a living','A Wall Street Journal bestselling ghostwriter and author of more than a dozen books, so this is how finished books actually get made.'],['I built the structure and the system','The Write Structure and the 100 Day Book method, the same path our coaches use to take a writer from blank page to draft.'],['I have coached thousands to finish','Since 2011 The Write Practice has helped millions of writers, and thousands of them have finished the book they were sure they never would.']]},
 {t:'cta',kick:'Your next step',h:'Ready to finally finish your book?',ctas:['<b>Start 100 Day Book</b> and write your draft in 100 days, with the structure and the weekly workshop that keep you going.','<b>Apply for 1 Year to Publish</b> if you want a dedicated mentor and editor to take you all the way to a published book.'],disc:'This masterclass is educational. It shares writing craft, story structure, and finishing principles; it is not a guarantee of a finished book, a publishing deal, sales, income, or any other outcome, and results vary from writer to writer. Your results depend on your own effort and the work you put in.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
