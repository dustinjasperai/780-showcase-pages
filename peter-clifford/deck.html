<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Whole Athlete - High Performance Tri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F8;        /* light ground, matches their light minimalist site */
    --panel:#FFFFFF;
    --ink:#16202A;
    --muted:#55616C;
    --rule:#808080;      /* graphite, from site probe (brand.json) */
    --accent:#0E4C6E;    /* endurance blue, from the logo */
    --accent2:#E8622A;   /* orange, from the logo */
    --disp:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:48px 28px 120px}
  .slide{background:var(--panel);border:1px solid #E7EAED;border-radius:14px;
    padding:56px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(22,32,42,.03),0 18px 40px -30px rgba(22,32,42,.25)}
  .kicker{font-family:var(--disp);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  .kicker.o{color:var(--accent2)}
  h1{font-family:var(--disp);font-weight:700;letter-spacing:-.01em;font-size:58px;line-height:1.02}
  h2{font-family:var(--disp);font-weight:600;letter-spacing:-.01em;font-size:38px;line-height:1.08}
  h3{font-family:var(--disp);font-weight:600;font-size:24px;line-height:1.15;margin-bottom:10px}
  p{font-size:20px;line-height:1.5;color:var(--muted);max-width:46ch}
  p.lead{font-size:23px;color:var(--ink)}
  .sub{margin-top:20px;font-size:22px;color:var(--ink);max-width:48ch}
  .brandline{margin-top:40px;font-family:var(--disp);font-weight:500;letter-spacing:.04em;
    font-size:15px;color:var(--ink)}
  .brandline span{color:var(--rule)}
  .big{font-family:var(--disp);font-weight:700;font-size:46px;line-height:1.05;color:var(--ink);max-width:20ch}
  .rulebar{width:60px;height:4px;background:var(--accent2);border-radius:3px;margin:0 0 26px}
  ul{list-style:none;margin-top:12px}
  ul li{position:relative;padding-left:30px;font-size:20px;line-height:1.5;color:var(--ink);margin:14px 0;max-width:50ch}
  ul li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;
    border:3px solid var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}
  .cell{border:1px solid #E7EAED;border-radius:10px;padding:18px 20px;background:#FBFCFD}
  .cell .t{font-family:var(--disp);font-weight:600;font-size:17px;color:var(--accent)}
  .cell .d{font-size:16px;color:var(--muted);margin-top:6px;line-height:1.42}
  .num{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--rule);letter-spacing:.14em}
  .quote{font-family:var(--disp);font-weight:600;font-size:34px;line-height:1.14;color:var(--ink);max-width:22ch}
  .disc{margin-top:28px;font-size:13px;color:var(--rule);line-height:1.45;max-width:60ch}
  .foot{position:fixed;bottom:0;left:0;right:0;background:rgba(246,247,248,.9);backdrop-filter:blur(6px);
    border-top:1px solid #E7EAED;display:flex;justify-content:space-between;align-items:center;
    padding:12px 22px;font-size:12px;color:var(--rule);font-family:var(--disp);letter-spacing:.06em}
  .foot b{color:var(--ink);font-weight:600}
  .cta h2{font-size:44px}
  .cta .step{margin-top:26px;display:inline-block;font-family:var(--disp);font-weight:600;font-size:19px;
    color:#fff;background:var(--accent);padding:15px 26px;border-radius:10px}
  @media(max-width:720px){.slide{padding:38px 26px;min-height:380px}h1{font-size:40px}h2{font-size:30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot"><span><b>High Performance Tri</b> &nbsp;·&nbsp; The Whole Athlete</span><span id="pg"></span></div>
<script>
const S=[
 {t:'title',html:`
   <div class="kicker">A High Performance Tri masterclass</div>
   <h1>The Whole Athlete</h1>
   <p class="sub">Why your next personal best is not hiding in more volume, and the model that takes age-group triathletes to the pro level.</p>
   <div class="brandline">Presented by Peter Clifford <span>· Head Coach, High Performance Tri</span></div>`},
 {t:'who',html:`
   <div class="kicker">Who this is for</div>
   <div class="rulebar"></div>
   <p class="lead">You are a committed age-group triathlete. You train hard, you log the sessions, you take it seriously.</p>
   <p class="sub">And lately the improvement has slowed, even though the effort has not.</p>`},
 {t:'trap',html:`
   <div class="kicker o">The trap</div>
   <h2>You added the hours. The clock did not move.</h2>
   <p class="sub">So the instinct is to train harder still: more volume, more intensity, more fatigue. For a lot of athletes that is exactly where the progress stalls and the injuries start.</p>`},
 {t:'reframe',html:`
   <div class="kicker o">The reframe</div>
   <div class="quote">"It isn't all about the TSS."</div>
   <p class="sub">Training stress score tells you how much you did. It does not tell you what is actually holding your race back. At the elite level, the small details decide everything.</p>`},
 {t:'part',html:`
   <div class="num">Part One</div>
   <div class="rulebar"></div>
   <h1>Why training harder stops working</h1>`},
 {t:'ceiling',html:`
   <div class="kicker">Part One</div>
   <h3>Volume has a ceiling</h3>
   <p>More training only helps until your recovery, your fuelling, or your schedule can no longer absorb it. Past that point, extra hours do not become fitness. They become fatigue, flat sessions, and the same race times.</p>
   <p class="sub">The athletes who break through are rarely the ones doing the most. They are the ones doing the right things consistently.</p>`},
 {t:'bonnet',html:`
   <div class="kicker">Part One</div>
   <h3>What is under the bonnet</h3>
   <p>Most athletes only ever adjust the training load. But a race is won or lost across a much wider set of levers, and most of them sit outside the training file.</p>
   <ul>
     <li>Fuelling you can actually execute on race day</li>
     <li>Pacing and tactical decisions when it hurts</li>
     <li>The consistency your week really allows</li>
     <li>Recovery, equipment, and the way you manage yourself</li>
   </ul>`},
 {t:'part',html:`
   <div class="num">Part Two</div>
   <div class="rulebar"></div>
   <h1>The Athlete Development Model</h1>`},
 {t:'model',html:`
   <div class="kicker">Part Two</div>
   <h3>The Athlete Development Model</h3>
   <p>Instead of chasing one number, we develop the whole athlete. We find the gaps across every dimension of performance, then close the ones that are actually costing you time.</p>
   <div class="grid">
     <div class="cell"><div class="t">Nutrition execution</div><div class="d">Fuelling that is simple enough to hold under pressure.</div></div>
     <div class="cell"><div class="t">Race pacing</div><div class="d">Tactical decisions that protect the back half.</div></div>
     <div class="cell"><div class="t">Time management</div><div class="d">Consistency that fits a real life.</div></div>
     <div class="cell"><div class="t">Recovery and equipment</div><div class="d">The gains made between the sessions.</div></div>
     <div class="cell"><div class="t">Mindset</div><div class="d">Ownership of every decision and standard.</div></div>
     <div class="cell"><div class="t">Athlete management</div><div class="d">Running yourself like the pro you want to be.</div></div>
   </div>`},
 {t:'fuel',html:`
   <div class="kicker">The model, up close</div>
   <h3>Fuelling: ridiculously simple</h3>
   <p>Nutrition can make or wreck a long race. So we build a plan simple enough to execute on the day under pressure, then prove it in training before you ever race it.</p>
   <ul>
     <li>0.8 to 1.2 grams of carbohydrate per kilo of body weight, per hour</li>
     <li>One bidon of hydration an hour, around 500 to 700mg of electrolytes</li>
     <li>Then individualised through testing, and rehearsed until it is automatic</li>
   </ul>`},
 {t:'pacing',html:`
   <div class="kicker">The model, up close</div>
   <h3>Pacing is a decision, not a hope</h3>
   <p>The clock does not reward the athlete who is fastest in the first hour. It rewards the one who still has a plan in the last one. Pacing and fuel logistics are rehearsed so that on race day there is nothing left to figure out.</p>
   <p class="sub">Know what you will be doing, so it is settled in your mind and it has been proven to work.</p>`},
 {t:'recovery',html:`
   <div class="kicker">The model, up close</div>
   <h3>The work between the work</h3>
   <p>Recovery, sleep, and how you manage your own week are not the soft edges of training. They are where the adaptation actually happens, and they are the first thing most athletes cut when life gets busy.</p>
   <p class="sub">Not many athletes are willing to do the small, unglamorous things. That is exactly why they separate the field.</p>`},
 {t:'ownership',html:`
   <div class="kicker o">The philosophy</div>
   <h2>Athlete-Led, Coach-Driven</h2>
   <p class="sub">The coach builds the plan and holds the standard. But the program is not truly yours until you take ownership of it: every session, every decision, every day.</p>
   <p>Drop the story that you are not a winner. That is a narrative, not a fact. The athletes who go furthest are the ones who stop blaming the plan and start owning the execution.</p>`},
 {t:'part',html:`
   <div class="num">Part Three</div>
   <div class="rulebar"></div>
   <h1>Building a season around the gaps</h1>`},
 {t:'season',html:`
   <div class="kicker">Part Three</div>
   <h3>A season, built on purpose</h3>
   <p>We do not just hand you a training plan. We map the whole season backwards from your key races, then build each block around the dimension that will move you most right now.</p>
   <ul>
     <li>Individualised programming delivered and reviewed every week</li>
     <li>Testing and deep analysis so decisions are made on evidence, not feel</li>
     <li>Fuelling, pacing, and race execution rehearsed well before race week</li>
   </ul>`},
 {t:'testing',html:`
   <div class="kicker">Part Three</div>
   <h3>Decisions made on evidence</h3>
   <p>Regular testing and post-session review turn a year of training into a feedback loop. We can see what is responding, what is not, and change the plan while there is still time to matter.</p>
   <p class="sub">That is the difference between hoping you are fitter and knowing where the next gain is coming from.</p>`},
 {t:'whyme',html:`
   <div class="kicker">Why work with us</div>
   <h3>Fifteen years at the pointy end</h3>
   <p>High Performance Tri has spent fifteen years taking age-group athletes toward professional licenses, and supporting pros at the sharp end of the sport. Athletes we coach have podiumed at Ironman New Zealand, Challenge races, and multiple 70.3 events.</p>
   <p class="sub">A complete coaching system for endurance athletes: high-level coaching, camps, testing, and deep analysis.</p>`},
 {t:'recap',html:`
   <div class="kicker">The whole athlete</div>
   <div class="rulebar"></div>
   <p class="lead">Your next breakthrough is probably not another block of volume.</p>
   <p class="sub">It is the dimension you have been ignoring: the fuelling, the pacing, the recovery, the ownership. Develop the whole athlete and the race times follow.</p>`},
 {t:'cta',html:`
   <div class="kicker">Your next step</div>
   <h2>Work with High Performance Tri</h2>
   <p class="sub">If you are ready to stop guessing and start developing the whole athlete, let us build your season around the gaps that are actually costing you time.</p>
   <span class="step">Start with a coaching enquiry at highperformancetri.com</span>
   <p class="disc">Educational content only. No result is guaranteed. Results vary by athlete and depend on training history, health, and consistency. Always train within your medical guidance.</p>`}
];

const deck=document.getElementById('deck');
S.forEach((s)=>{
 const el=document.createElement('section');
 el.className='slide'+(s.t==='cta'?' cta':'');
 el.innerHTML=s.html;
 deck.appendChild(el);
});
document.getElementById('pg').textContent=S.length+' slides';
</script>
</body>
</html>
