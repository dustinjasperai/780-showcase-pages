<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Western Way — A Masterclass with Connor Western</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#22272b;      /* deepened from brand slate #373f45 (thewstnway.com) */
    --panel:#2c3238;
    --rule:#3a4249;
    --ink:#f4efe6;
    --muted:#b8b0a2;
    --accent:#f2d279;  /* dominant brand gold, thewstnway.com ranked_colors */
    --accent2:#ec7071; /* brand coral, used sparingly */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 90px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:52px 48px;margin:22px 0;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;height:5px;width:100%;background:linear-gradient(90deg,var(--accent),transparent 72%)}
  .slide::after{content:"";position:absolute;left:48px;right:48px;bottom:34px;height:1px;background:var(--rule)}
  .kicker{font-family:"Anton",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:14px;margin-bottom:18px}
  h1{font-family:"Anton",sans-serif;font-weight:400;line-height:1.02;letter-spacing:.005em;font-size:64px;text-transform:uppercase}
  h2{font-family:"Anton",sans-serif;font-weight:400;line-height:1.06;letter-spacing:.01em;font-size:40px;text-transform:uppercase}
  .sub{color:var(--accent);font-size:22px;font-weight:600;margin-top:14px}
  .titlesub{color:var(--muted);font-size:23px;margin-top:18px;max-width:30ch}
  p.body{color:var(--ink);font-size:19px;line-height:1.55;margin-top:20px;max-width:64ch}
  ul{margin:22px 0 0 0;list-style:none;max-width:64ch}
  li{position:relative;padding-left:26px;margin:12px 0;font-size:18px;line-height:1.45;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:10px;width:11px;height:11px;background:var(--accent);transform:rotate(45deg)}
  .part h1{font-size:76px}
  .part .kicker{font-size:16px}
  .note{margin-top:22px;color:var(--muted);font-size:14px;line-height:1.5;max-width:70ch;border-top:1px solid var(--rule);padding-top:16px}
  .cta h2{color:var(--accent)}
  .pagenum{position:absolute;right:26px;bottom:30px;color:var(--muted);font-size:13px;font-family:"Anton",sans-serif;letter-spacing:.1em}
  .brandline{position:absolute;left:48px;bottom:30px;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
  @media(max-width:640px){.slide{padding:38px 26px;min-height:auto}h1{font-size:40px}.part h1{font-size:46px}h2{font-size:28px}.titlesub{font-size:18px}p.body{font-size:17px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Connor Western', h:'The Western Way', titlesub:'How to become a remote closer who never has to chase a lead again'},
  {t:'forwho', kicker:'Who this is for', h:'You want out. A phone and a real skill are the way through.', body:'If you are stuck trading hours for a salary and you have watched the remote closing world from the outside, this hour is for you. No experience needed. Just the willingness to learn one real skill and use it.', list:['You want location freedom, not another desk','You are willing to practice, not just buy a course','You would rather earn on results than clock in']},
  {t:'trap', kicker:'The trap', h:'The hype is selling you the wrong game', body:'Cold messages at 200 a day. Borrowed scripts that make you sound like everyone else. Commission-only gigs that churn you out in a month. Most people who try remote closing quit before they ever close, because they were handed the hardest possible version of the job.', list:['Chasing strangers instead of attracting buyers','Reading a script instead of running a conversation','Betting on volume instead of skill']},
  {t:'reframe', kicker:'The reframe', h:'The problem was never your work ethic', sub:'You were taught to hunt when you should have been taught to attract.', body:'Closing is a skill you can build. Content is the leverage that makes the phone ring. Get those two right and the freedom takes care of itself.'},
  {t:'part', kicker:'Part One', h:'Why most remote closers stay broke'},
  {t:'problem', kicker:'The real problem', h:'Volume hides the fact that you never learned to sell', body:'When leads are cold and endless, you never have to get good. You just dial more. The day the list dries up, so does the income. A hunter with no skill and no audience is one bad month from being back at the day job.', list:['No skill means low close rates and constant rejection','No audience means you start from zero every single day','No positioning means you compete on being cheap and available']},
  {t:'problem', kicker:'The cost', h:'What the grind actually costs you', body:'Burnout, churn, and the quiet belief that remote income is a scam. It is not a scam. It is a skill problem wearing a motivation costume.', list:['Months lost to gigs that were never going to last','Confidence eroded by scripts that were not yours','Freedom postponed one more quarter, again']},
  {t:'part', kicker:'Part Two', h:'The WESTERN Method'},
  {t:'pillar', kicker:'Pillar One', h:'Sales is the skill', sub:'Calm mind. Sharp words.', body:'Modern, confidence-based selling with no outdated hard-sell scripts. You learn to run the conversation, diagnose the real problem, and hold your frame so the close feels like a decision, not a squeeze. This is how you get to consistent 30 to 40 percent close rates.', list:['Lead the call, do not perform a pitch','Detach from the outcome to raise the close rate','Precision over noise in every sentence']},
  {t:'pillar', kicker:'Pillar One, in practice', h:'The calm operator closes more', body:'The loudest person on the call almost never wins. Composure reads as competence. When you stop needing the sale, the buyer starts trusting you with it. That temperament is trainable, and it is the fastest lever you have on your numbers.'},
  {t:'pillar', kicker:'Pillar Two', h:'Content is the leverage', body:'A closer with an audience never runs out of leads. When you publish, buyers come to you already warm, already sold on you, already halfway to yes. This is the piece the scripts-and-dials crowd skips entirely, and it is the whole difference between hunting and attracting.', list:['Publish simple content that builds authority','Turn attention into inbound conversations','Let the audience pre-sell you before the call']},
  {t:'pillar', kicker:'Pillar Two, in practice', h:'From invisible to in demand', body:'You do not need to go viral. You need a steady signal that says who you help and how you think. Do that consistently and the inbound compounds, so your calendar fills without you chasing a single stranger.'},
  {t:'pillar', kicker:'Pillar Three', h:'Freedom is the outcome', body:'When the skill is real and the leverage is working, freedom stops being a slogan. You choose your hours, your clients, and where you wake up. Freedom over conformity is not the pitch. It is what is left once the first two pillars are handled.', list:['Position yourself so you set the terms','Earn on results, from anywhere','Build a life on your schedule, not a manager one']},
  {t:'path', kicker:'The Remote Closer Path', h:'From zero to placed and producing', body:'This is the arc we walk together: build the skill, build the signal, and get in the room. Daily reps, honest feedback on your delivery, and a room of people going fully remote right alongside you.', list:['Learn the WESTERN Method and drill it live','Build the content signal that brings leads in','Land the role and close with a calm frame']},
  {t:'part', kicker:'Part Three', h:'The Western Way, lived out'},
  {t:'week', kicker:'A week on the path', h:'Three to five focused hours a day', body:'This is not hustle theatre. It is a small number of high-quality reps done consistently. A few hours of skill work and content, then the calls that actually pay.', list:['Morning: sharpen the skill and publish','Midday: take the calls that came inbound','The rest of the day is yours']},
  {t:'why', kicker:'Why listen to me', h:'I built this the way I am teaching it', body:'I went from ski-season work to running a remote sales business from Bali. Over 210 million content views in 2025, my first fifty thousand pound month, and a business built on the same two pillars I just showed you. Two years sober, a few hours a day, on my own terms.', list:['210M plus content views in 2025','From zero to a 47k month','Living and working remotely from Bali']},
  {t:'recap', kicker:'The whole thing in one line', h:'Sales is the skill. Content is the leverage. Freedom is the outcome.', body:'Learn to close with a calm frame. Build an audience that brings the leads. The freedom is the result of getting those two right, in that order.'},
  {t:'cta', kicker:'Your next step', h:'Come build the Western Way with me', body:'If you want the skill, the leverage, and a room of people going remote alongside you, apply to work with me and come inside Cowboy Closers. Bring the willingness to practice. I will bring the method.', note:'Educational only. No income, placement, or specific result is guaranteed. Results vary and depend on your effort, your skill, and your market.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + s.t + (s.t === 'cta' ? ' cta' : '') + (s.t === 'part' ? ' part' : '');
  let html = '';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.t === 'title') {
    html += '<h1>' + s.h + '</h1>';
    if (s.titlesub) html += '<div class="titlesub">' + s.titlesub + '</div>';
  } else {
    html += '<h2>' + s.h + '</h2>';
  }
  if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  if (s.body) html += '<p class="body">' + s.body + '</p>';
  if (s.list) {
    html += '<ul>';
    s.list.forEach(li => html += '<li>' + li + '</li>');
    html += '</ul>';
  }
  if (s.note) html += '<div class="note">' + s.note + '</div>';
  html += '<div class="brandline">The Western Way</div>';
  html += '<div class="pagenum">' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
