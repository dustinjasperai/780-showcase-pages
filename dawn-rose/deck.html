<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bride Magnet Masterclass — Dawn Rose</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6f4;
  --panel:#f4e7e8;
  --rule:#d6b9bc;
  --ink:#2a2026;
  --accent:#db006a;
  --dim:#8a8177;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Mulish',sans-serif;-webkit-font-smoothing:antialiased}
.deck{max-width:1040px;margin:0 auto;padding:32px 20px 72px}
.slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;padding:68px 64px;margin:22px 0;min-height:520px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.slide .no{position:absolute;top:26px;right:30px;font-size:13px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.kick{font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:64px;line-height:1.06;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--accent)}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:46px;line-height:1.1}
.sub{font-size:24px;line-height:1.5;color:#4a4047;margin-top:26px;max-width:40ch}
.lead{font-size:27px;line-height:1.45;color:var(--ink);max-width:34ch}
ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px}
li{font-size:22px;line-height:1.4;color:#4a4047;padding-left:34px;position:relative;max-width:46ch}
li::before{content:'';position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.part{background:var(--panel);border-color:var(--rule)}
.part .big{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:var(--accent);font-weight:700;letter-spacing:.02em}
.part h1{margin-top:12px}
.framework{display:flex;flex-direction:column;gap:20px;margin-top:34px}
.step{display:flex;gap:24px;align-items:baseline;border-top:1px solid var(--rule);padding-top:20px}
.step .n{font-family:'Cormorant Garamond',serif;font-size:40px;color:var(--accent);font-weight:700;min-width:54px}
.step .t{font-size:23px;font-weight:700}
.step .d{font-size:19px;color:var(--dim);margin-top:4px}
.chips{display:flex;gap:16px;margin-top:34px;flex-wrap:wrap}
.chip{border:1.5px solid var(--rule);border-radius:100px;padding:12px 24px;font-size:20px;font-weight:600}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.disc{font-size:15px;color:var(--dim);margin-top:30px;max-width:56ch;line-height:1.5}
.cta-step{font-size:26px;font-weight:700;color:var(--accent);margin-top:22px}
.motif{position:absolute;right:-40px;bottom:-40px;width:220px;height:220px;border:2px solid var(--rule);border-radius:50%;opacity:.5}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A free live masterclass with Dawn Rose',
   h:'The Bride Magnet <em>Masterclass</em>',
   sub:'How wedding hair and makeup stylists book dream brides twelve months out, at premium prices, without ever competing on price.'},

  {t:'who', kick:'Who this is for',
   h:'You are brilliant with a brush. Your calendar does not agree.',
   bullets:['You are a wedding hair or makeup stylist who loves the work','Your bookings swing from fully packed to worryingly quiet','You quietly drop your price to win a bride, then resent the booking','You know you are good, but the right brides keep booking someone else']},

  {t:'trap', kick:'The honest problem',
   h:'Talent was never the thing standing between you and a full year.',
   lead:'Every stylist in your area is talented. So brides cannot choose on talent. They choose on price and on who they can actually find. That is why great stylists stay quiet and cheap.'},

  {t:'reframe', kick:'The reframe',
   h:'Being <em>fully booked</em> is not the goal. Being booked with the <em>right</em> brides is.',
   sub:'A calendar full of bargain brides who haggle is not a business. A calendar of dream brides who booked you a year ago is.'},

  {t:'part', kick:'Part one', big:'Why talented stylists stay invisible',
   h:'The three reasons dream brides never find you.'},

  {t:'point', kick:'Reason one',
   h:'You look like every other stylist.',
   lead:'Soft florals, a pretty logo, and the words every bridal page uses. Beautiful, and completely forgettable. Nothing tells a bride that you are HER stylist.'},

  {t:'point', kick:'Reason two',
   h:'You speak to every bride, so you move none of them.',
   lead:'When you try to be the stylist for all brides, no single bride feels like you were made for her. The boho bride and the glam bride need to hear different things.'},

  {t:'point', kick:'Reason three',
   h:'You are a secret.',
   lead:'If a bride cannot find you early, she books whoever is available later. So you end up taking last minute brides on price, instead of dream brides on purpose.'},

  {t:'part', kick:'Part two', big:'The Bride Magnet Method',
   h:'Three moves that turn your skill into a booked out brand.'},

  {t:'framework', kick:'The method, in three steps',
   h:'How a Bride Magnet is built.',
   steps:[
     {n:'01', tt:'An amazing guest experience', dd:'A brand and a client journey so the right bride feels chosen the moment she lands on your page.'},
     {n:'02', tt:'A solid email system', dd:'Simple follow up that turns a quiet enquiry into a paid, held date instead of a ghosted DM.'},
     {n:'03', tt:'Standing out online', dd:'Show up where your bride is already looking, so she finds you first and books early.'}]},

  {t:'pillar', kick:'Step one, up close',
   h:'Pick your bride.',
   lead:'Quirky, glam, boho, or modern. When you build your brand around one bride type, she stops scrolling because it finally feels made for her.',
   chips:['Quirky','Glam','Boho','Modern']},

  {t:'pillar', kick:'Step one, continued',
   h:'Become unmissable to her.',
   lead:'Your photos, your words, and your offer all speak to one bride. She does not compare you to five other stylists, because none of them sound like you.'},

  {t:'pillar', kick:'Step two, up close',
   h:'Let your emails do the booking.',
   lead:'Most stylists lose brides in the gap between enquiry and booking. A short, warm email sequence holds her attention and makes saying yes the easy next step.'},

  {t:'pillar', kick:'Step three, up close',
   h:'Be the stylist she finds first.',
   lead:'When your brand is clear and consistent online, the right bride discovers you early, while there is still a whole calendar to choose from.'},

  {t:'part', kick:'Part three', big:'Your booked out year',
   h:'What changes when you become a Bride Magnet.'},

  {t:'outcome', kick:'The shift',
   h:'Brides book you a year ahead.',
   bullets:['Dream brides book twelve months out, not last minute','You charge a premium and the right bride pays it happily','The haggling stops, because she chose YOU, not a price','You style the brides you actually love working with']},

  {t:'outcome', kick:'The feeling',
   h:'A calendar you are proud of, not one you are chasing.',
   lead:'You wake up to enquiries from brides who already feel like yours. The quiet season gets quieter for everyone else, and busier for you.'},

  {t:'why', kick:'Why listen to me',
   h:'I built this from behind the chair.',
   lead:'I spent thirteen years as a bridal stylist. My studio, Bridal Perfection, was named a top fifteen supplier in hair, makeup, and floral by the Australian Bridal Industry Academy. The Bride Magnet Method is the exact system I used to fill my own year.'},

  {t:'recap', kick:'The whole method, once more',
   h:'Pick your bride. Become unmissable. Let the system book her.',
   steps:[
     {n:'01', tt:'Pick your bride', dd:'One archetype, built into your whole brand.'},
     {n:'02', tt:'Become unmissable', dd:'Photos, words, and offer that speak to her.'},
     {n:'03', tt:'Let the system book', dd:'Emails and presence that turn attention into held dates.'}]},

  {t:'cta', kick:'Your next step',
   h:'Come build your Bride Magnet brand with me.',
   ctastep:'Join the Become A Bride Magnet program',
   sub:'If this is the year you stop competing on price and start booking the brides you love, this is where we do it together.',
   disc:'Educational only. No specific booking, pricing, or income result is guaranteed. Results vary based on your market, your effort, and many factors outside anyone’s control.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'part' ? ' part' : '');
  let html = '<div class="no">' + (i+1) + ' / ' + S.length + '</div>';
  if (s.kick) html += '<div class="kick">' + s.kick + '</div>';
  if (s.big) html += '<div class="big">' + s.big + '</div>';
  if (s.h) html += (s.t === 'part' ? '<h1>' : '<h1>') + s.h + '</h1>';
  if (s.lead) html += '<div class="lead">' + s.lead + '</div>';
  if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  if (s.bullets) html += '<ul>' + s.bullets.map(b => '<li>' + b + '</li>').join('') + '</ul>';
  if (s.chips) html += '<div class="chips">' + s.chips.map((c, j) => '<div class="chip' + (j===2?' on':'') + '">' + c + '</div>').join('') + '</div>';
  if (s.steps) html += '<div class="framework">' + s.steps.map(st => '<div class="step"><div class="n">' + st.n + '</div><div><div class="t">' + st.tt + '</div><div class="d">' + st.dd + '</div></div></div>').join('') + '</div>';
  if (s.ctastep) html += '<div class="cta-step">' + s.ctastep + '</div>';
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  html += '<div class="motif"></div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
