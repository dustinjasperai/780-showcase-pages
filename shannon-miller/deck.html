<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go Mop-Free: The Systems That Run a Cleaning Business Without You — Shannon Miller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --panel2:#eef1f8; --rule:#d7dcea;
    --ink:#232b4c; --muted:#5a6378; --accent:#48538e;
    --head:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:20px 0;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:26px;font-family:var(--head);font-size:13px;
    letter-spacing:.14em;color:var(--rule)}
  .kick{font-family:var(--head);font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:36px;line-height:1.1;letter-spacing:-.01em}
  .lead{font-size:21px;line-height:1.5;color:var(--muted);margin-top:18px;max-width:40ch}
  .big{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.08;letter-spacing:-.01em}
  .big .a{color:var(--accent)}
  .byline{margin-top:30px;font-size:16px;color:var(--muted)}
  .byline b{color:var(--ink);font-weight:600}
  .blocks{display:grid;gap:14px;margin-top:26px}
  .block{background:var(--panel2);border:1px solid var(--rule);border-radius:12px;padding:20px 22px}
  .block .t{font-family:var(--head);font-weight:600;font-size:20px;color:var(--accent)}
  .block .d{font-size:16px;line-height:1.5;color:var(--muted);margin-top:6px}
  .pill{display:inline-block;font-family:var(--head);font-weight:700;font-size:15px;
    letter-spacing:.14em;color:var(--panel);background:var(--accent);padding:7px 16px;border-radius:999px}
  ul.clean{margin-top:22px;list-style:none;display:grid;gap:12px}
  ul.clean li{font-size:19px;line-height:1.45;padding-left:30px;position:relative;color:var(--ink)}
  ul.clean li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;
    border-radius:3px;background:var(--accent)}
  .recap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
  .recap .c{background:var(--panel2);border:1px solid var(--rule);border-radius:12px;padding:24px}
  .recap .n{font-family:var(--head);font-weight:700;font-size:34px;color:var(--accent)}
  .recap .l{font-family:var(--head);font-weight:600;font-size:19px;margin-top:8px}
  .recap .s{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.45}
  .cta-note{margin-top:26px;font-size:16px;line-height:1.5;color:var(--muted)}
  .disclaimer{margin-top:30px;font-size:12px;line-height:1.5;color:var(--muted);
    border-top:1px solid var(--rule);padding-top:16px;max-width:62ch}
  .title-slide{background:linear-gradient(160deg,#eef1f8 0%,#ffffff 70%)}
  @media(max-width:720px){.slide{padding:34px 26px}h1{font-size:36px}.big{font-size:30px}
    h2{font-size:27px}.recap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kick:'A free live masterclass',h:'Go Mop-Free',lead:'The 3 systems that run a cleaning business without you.',by:'With <b>Shannon Miller</b> &middot; Klean Freaks University'},
 {t:'who',kick:'Who this is for',h:'You are booked solid. And still on every job.',lead:'This is for residential cleaning business owners who are the business: cleaning, quoting, hiring, fixing. If the work stops when you stop, this is for you.'},
 {t:'trap',kick:'The trap',big:'You added clients. You added hours. You never added <span class="a">freedom</span>.',lead:'More jobs did not get you off the tools. It just made you the bottleneck in a bigger business.'},
 {t:'reframe',kick:'The real problem',big:'You don\'t have a growth problem. You have a <span class="a">back-end problem</span>.',lead:'Growth without a back end just means more of you. The fix is not more marketing. It is the operating system underneath.'},
 {t:'part',pill:'Part One',h:'Why more clients will not save you',lead:'Three things quietly keep owners stuck on the mop, no matter how many jobs they book.'},
 {t:'blocks',kick:'What is actually costing you',h:'The three leaks',blocks:[
   {t:'Underpricing',d:'You are charging what the market trained you to charge, not what protects your profit. Every job runs thinner than it should.'},
   {t:'No hiring system',d:'You cannot hand off the work because there is no repeatable way to find, train, and trust someone to do it the way you do.'},
   {t:'No structure',d:'The business lives in your head. Nothing is documented, so nothing runs without you in the room.'}]},
 {t:'part',pill:'Part Two',h:'The system: Structure, Scale, Profit',lead:'This is the SSPCBA framework I teach inside Klean Freaks University. Built in order, it takes the owner out of the day-to-day.'},
 {t:'blocks',kick:'Pillar One',h:'Structure',lead:'Get the business out of your head and onto paper.',blocks:[
   {t:'Document the work',d:'Turn how you clean, quote, and onboard into simple SOPs anyone on your team can follow.'},
   {t:'Make it repeatable',d:'When the standard lives in a system instead of in you, the quality stops depending on who shows up.'}]},
 {t:'blocks',kick:'Pillar Two',h:'Scale',lead:'Build the hiring engine so it is not always you.',blocks:[
   {t:'A real hiring system',d:'A repeatable way to attract, screen, and onboard cleaners you can actually trust with your clients.'},
   {t:'Hand off and inspect',d:'Delegate the job, then inspect the result against the standard you documented. That is how you step back without quality slipping.'}]},
 {t:'blocks',kick:'Pillar Three',h:'Profit',lead:'Price like a CEO, not like a cleaner who is afraid to lose the job.',blocks:[
   {t:'Protect the margin',d:'Price so every job funds the business you want, including the team that replaces you on the tools.'},
   {t:'Raise rates without losing clients',d:'There is a way to reprice your work, especially luxury homes, that keeps the right clients and lets the wrong ones go.'}]},
 {t:'reframe',kick:'The part almost no one teaches',big:'How you structure labor decides <span class="a">what your business is worth</span>.',lead:'A W-2 company sells for more than a 1099 referral model. Structure is not just operations. It is the value you are building toward an eventual exit.'},
 {t:'part',pill:'Part Three',h:'What it looks like when it works',lead:'The business still runs. You are just not the one running every piece of it.'},
 {t:'list',kick:'A week on the other side',h:'The business runs without you',items:[
   'Jobs get quoted at prices that actually protect your profit.',
   'Your team handles the work to a standard you documented, not one you hover over.',
   'A client reschedules and it gets solved without a single text to you.',
   'You spend the week working on the business, or not working at all.']},
 {t:'why',kick:'Why me',h:'I built this from the mop up',lead:'I ran a residential cleaning company in Arizona for over a decade, got myself off the tools, and built Klean Freaks University to teach the back end I had to learn the hard way.',by:'55+ courses &middot; the Cleaning Business Life podcast &middot; hundreds of owners coached through Structure, Scale &amp; Profit'},
 {t:'recap',kick:'The whole system',h:'Structure. Scale. Profit.',recap:[
   {n:'01',l:'Structure',s:'Document the work so it runs without you.'},
   {n:'02',l:'Scale',s:'A hiring system so it is not always you doing it.'},
   {n:'03',l:'Profit',s:'Pricing that protects the margin that funds your freedom.'}]},
 {t:'cta',kick:'Your next step',h:'Build the back end with me',lead:'If you want the full system, the SOPs, the hiring engine, and the pricing, that is what we do inside the Structure, Scale &amp; Profit Cleaning Business Academy.',note:'Bring your real numbers. We build your plan to go mop-free from where you actually are today.',disclaimer:'This masterclass is for education only. It is not a guarantee of income or results. Your results depend on your market, your effort, and your execution. Nothing here is financial, legal, or tax advice.'}
];
const deck=document.getElementById('deck');
function esc(x){return x||''}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='title'?' title-slide':'');
  let h='<div class="num">'+String(i+1).padStart(2,'0')+' / '+S.length+'</div>';
  if(s.kick) h+='<div class="kick">'+esc(s.kick)+'</div>';
  if(s.pill) h+='<div style="margin-bottom:18px"><span class="pill">'+esc(s.pill)+'</span></div>';
  if(s.h) h+=(s.t==='title'?'<h1>'+esc(s.h)+'</h1>':'<h2>'+esc(s.h)+'</h2>');
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.blocks){h+='<div class="blocks">';s.blocks.forEach(b=>{h+='<div class="block"><div class="t">'+esc(b.t)+'</div><div class="d">'+esc(b.d)+'</div></div>'});h+='</div>'}
  if(s.items){h+='<ul class="clean">';s.items.forEach(it=>{h+='<li>'+esc(it)+'</li>'});h+='</ul>'}
  if(s.recap){h+='<div class="recap">';s.recap.forEach(c=>{h+='<div class="c"><div class="n">'+esc(c.n)+'</div><div class="l">'+esc(c.l)+'</div><div class="s">'+esc(c.s)+'</div></div>'});h+='</div>'}
  if(s.note) h+='<p class="cta-note">'+s.note+'</p>';
  if(s.by) h+='<div class="byline">'+s.by+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
