<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Situational &amp; Conceptual Thinking · Dr. Fred Schofield · Schofield Chiropractic Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FAFAF8; --panel:#F0EDE8; --rule:#E3DFD6;
    --accent:#D8232F; --accent2:#1F1F1F; --ink:#222222; --grey:#5C5F63; --dim:#8A8D91;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Source Sans Pro',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .disp{font-family:'Open Sans Condensed',sans-serif;text-transform:uppercase}
  .kicker{font-family:'Source Sans Pro',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Open Sans Condensed',sans-serif;font-weight:700;color:var(--accent2);line-height:1.1;letter-spacing:-.005em}
  .t-title h1{font-size:5vw}
  .t-normal h1{font-size:3.2vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.5;font-weight:400}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.44;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Source Sans Pro',sans-serif;font-size:1.4vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#2A2A2A 0%,#151515 100%);align-items:center;text-align:center}
  .t-dark h1{font-family:'Open Sans Condensed',sans-serif;font-size:3.6vw;max-width:82%;font-weight:700;color:#FAFAF8;text-transform:none;line-height:1.22}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:2.9vw;text-align:center;margin-bottom:4.6vh}
  .flowrow{display:flex;gap:1.1vw;justify-content:center;flex-wrap:wrap}
  .flowcard{background:var(--panel);border:1px solid var(--rule);border-radius:.5vw;padding:2.4vh 1.3vw;width:13vw;min-height:15vh;display:flex;flex-direction:column;gap:1vh}
  .flowcard .n{font-family:'Open Sans Condensed',sans-serif;font-size:2.1vw;font-weight:700;color:var(--accent);line-height:1}
  .flowcard .l{font-size:1.16vw;font-weight:600;color:var(--ink);line-height:1.25}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#2A2A2A 0%,#151515 100%);align-items:center;text-align:center}
  .t-cta h1{font-family:'Open Sans Condensed',sans-serif;font-size:4vw;max-width:84%;color:#FAFAF8;text-transform:none}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent);color:#F3C9CC;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .t-dark .disc,.t-cta .disc{color:#9a9a9a}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:600;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .rule-motif{width:14vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#8A8D91;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8A8D91;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#8A8D91;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}.t-flow h1{font-size:5vw}
    .flowcard{width:26vw}.flowcard .n{font-size:4vw}.flowcard .l{font-size:2.3vw}.t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 24</div>
<div class="brand-foot">Rhino Tribe &middot; Schofield Chiropractic Training</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'Situational &amp; Conceptual Thinking',sub:'An ethical case acceptance class, built from Dr. Fred and Dr. FJ Schofield’s own method. A live online class for chiropractors.',brand:true,disc:'Educational content only; no income or patient-volume promises.'},
 {t:'normal',k:'Who this is for',title:'Chiropractors who want more case acceptance without becoming the pushy version of themselves.'},
 {t:'normal',k:'The trap',title:'Most case-acceptance training is a pressure script.',body:'Trial closes, urgency lines, fear-based framing. It works until the patient feels it, and then it costs you the relationship along with the sale.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'The frameworks here come from over three decades of Dr. Fred and Dr. FJ Schofield’s own practice and coaching work. What your practice does with them is up to you.',disc:'Educational content only. Results vary by practice; nothing here is a promise of income or patient volume.'},
 {t:'normal',k:'Who’s teaching this',title:'Dr. Fred Schofield. Coaching chiropractors since 1987.',body:'Built his own practice from startup to roughly 1,500 visits a week alongside his wife Susan. Together with son Dr. FJ Schofield, they’ve coached over 20,000 doctors, spouses, and teams.'},

 {t:'section',idx:'Part One',title:'The Old Way Still Runs the Room'},
 {t:'normal',k:'The old script',title:'Scaring, slimy, pushy, pressure.',body:'That is how the Schofields describe the old-school case-acceptance playbook, in those exact words. It is still what trains a lot of chiropractors today.'},
 {t:'normal',k:'Why it fails now',title:'Patients recognize a script the moment it starts.',body:'Trust breaks before the plan is even presented, and the doctor is left wondering why a good treatment plan didn’t land.'},
 {t:'dark',title:'You don’t need a harder close. You need patients who already trust the room.'},

 {t:'section',idx:'Part Two',title:'Situational &amp; Conceptual Thinking'},
 {t:'normal',k:'The frame',title:'Chiropractic philosophy applied directly to the conversation.',body:'Dr. Fred’s approach ties the philosophy of chiropractic straight to what gets said in the room, instead of bolting a separate “business mindset” on top of the clinical work.'},
 {t:'normal',k:'The FJ layer',title:'Ethical influence, built from social psychology.',body:'Dr. FJ studied communication, marketing, and psychology to find how to ethically attract and influence people, without pressure schemes.'},
 {t:'flow',k:'The Four Pillars',title:'What the full curriculum covers',items:[
   {n:'01',l:'Communication'},{n:'02',l:'Marketing'},{n:'03',l:'Leadership &amp; Business'},{n:'04',l:'Mindset'}]},
 {t:'normal',k:'The sequence',title:'Communication and marketing come first.',body:'Patient-facing skills before owner-facing ones. The curriculum is deliberately sequenced that way, because case acceptance is upstream of everything else.'},
 {t:'dark',title:'Ethical isn’t the slow way. It’s the way that still works after the patient goes home.'},

 {t:'section',idx:'Part Three',title:'What Ethical Case Acceptance Looks Like'},
 {t:'normal',k:'First impressions',title:'The first 90 seconds decide more than the exam.',body:'Susan Schofield’s CA training runs a named unit on this exact moment: Million Dollar First Impressions.'},
 {t:'normal',k:'The accountability layer',title:'A plan without a check-in is just a wish.',body:'The coaching side runs on two named touchpoints: a standing check-in every two weeks, and direct texting for the questions that can’t wait.'},
 {t:'normal',k:'The proof',title:'20,000+ doctors, spouses, and teams coached.',body:'Built from a practice the Schofields grew themselves to roughly 1,500 visits a week, not theory borrowed from outside the profession.'},
 {t:'dark',title:'The goal isn’t a better pitch. It’s a practice patients refer because nothing about it felt like a pitch.'},

 {t:'section',idx:'Part Four',title:'Where This Goes Next'},
 {t:'normal',k:'Homework',title:'The core communication and marketing pillars, live.',body:'Everything above is pulled from the Communication and Marketing pillars of the Rhino curriculum, the same sequence Rhino Digital Training opens with.'},
 {t:'normal',k:'Go deeper',title:'Live Seminars and the Rhino Tribe.',body:'Multi-city live training running through the year, plus Rhino Digital Training for the curriculum in between events.'},
 {t:'cta',title:'Stay ethical. Take the next step.',chips:['See the Live Seminar schedule','Learn about 1-on-1 Coaching'],disc:'Educational content, not a guarantee of results. Outcomes vary by practice.'},
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx disp">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Rhino <b>Tribe</b> &middot; Schofield Chiropractic Training</div><div class="rule-motif"></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
