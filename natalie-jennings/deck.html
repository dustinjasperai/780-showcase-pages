<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Greenhouse Method — a live masterclass with Natalie Jennings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ed; --panel:#eceee6; --rule:#d6ddcc; --ink:#27302a;
    --muted:#5c6660; --accent:#35563f; --deep:#27402f;
    --display:"Cormorant Garamond",Georgia,serif; --body:"Mulish",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 90px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:62px 60px;margin:0 0 26px;position:relative;overflow:hidden;
    min-height:470px;display:flex;flex-direction:column;justify-content:center}
  .slide::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(var(--rule) 1px,transparent 1px) 0 0/100% 66px,
      linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/66px 100%;
    opacity:.14}
  .slide>*{position:relative;z-index:1}
  .kicker{font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:62px;line-height:1.02;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.06;
    margin-bottom:16px}
  .sub{font-size:20px;color:var(--muted);max-width:30em}
  .big{font-family:var(--display);font-weight:600;font-size:48px;line-height:1.08;
    max-width:18em}
  .lead{font-size:21px;max-width:33em;color:var(--ink)}
  ul{list-style:none;margin-top:8px}
  li{font-size:20px;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:32em}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;
    border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg)}
  .pillar{display:flex;gap:20px;align-items:flex-start;margin:16px 0;max-width:34em}
  .pnum{font-family:var(--display);font-size:46px;line-height:1;color:var(--accent);font-weight:700;min-width:54px}
  .pbody h3{font-family:var(--display);font-size:28px;font-weight:600;margin-bottom:4px}
  .pbody p{font-size:18px;color:var(--muted)}
  .panel{background:var(--panel);border-radius:14px;padding:26px 30px;margin-top:18px;max-width:34em}
  .panel p{font-size:19px}
  .num{font-family:var(--display);color:var(--accent);font-weight:700}
  .foot{margin-top:26px;font-size:15px;color:var(--muted)}
  .tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--deep);background:var(--panel);
    border:1px solid var(--rule);border-radius:999px;padding:7px 14px;margin-bottom:22px}
  .cta h2{font-size:48px}
  .disc{margin-top:28px;font-size:13px;color:var(--muted);max-width:40em;line-height:1.55}
  .sprout{width:40px;height:40px;margin-bottom:20px}
  .idx{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--muted);z-index:2}
  @media(max-width:640px){
    .slide{padding:40px 26px;min-height:380px}
    h1{font-size:40px}h2{font-size:30px}.big{font-size:32px}.cta h2{font-size:34px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const SPROUT='<svg class="sprout" viewBox="0 0 24 24" fill="none" stroke="#35563f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V11"/><path d="M12 13C12 9 9 7 5 7c0 4 3 6 7 6Z"/><path d="M12 11c0-4 3-6 7-6 0 4-3 6-7 6Z"/></svg>';
const S=[
 {t:'title',kicker:'A free live masterclass',h:'The Greenhouse Method',
  sub:'How to grow a photography business from the inside out.',
  foot:'with Natalie Jennings · Photo Business Help'},

 {t:'hook',tag:'Before we start',
  big:'Business growth and personal growth are the same project.',
  sub:'That is the whole premise of the next hour. If it is new to you, good. It is the thing almost nobody in this industry says out loud.'},

 {t:'who',tag:'Who this is for',h:'You love the work. The business is the hard part.',
  items:[
   'You take beautiful photos, but the running-a-business side leaves you disorganized and overwhelmed.',
   'You have tried the pricing scripts and the marketing hacks, and they never quite fit you.',
   'You want to grow, and you want it to feel like yours, not like someone else’s playbook.']},

 {t:'lead',tag:'The trap',h:'The advice all sounds the same',
  lead:'Charge more. Post more. Build a funnel. Niche down. None of it is wrong, exactly. But it is all bolted onto the outside of your business, and it assumes the inside is already sorted. For most photographers it is not, which is why doing more of it just makes the days heavier.'},

 {t:'hook',tag:'The reframe',
  big:'You do not have a marketing problem. You have an alignment problem.',
  sub:'Most photographers add more tactics on top of a business that was never built around them. So the harder you push, the heavier it feels.'},

 {t:'lead',tag:'Part one',h:'Why more tactics stop working',
  lead:'A strategy that fits another photographer will not fit you. When the business is misaligned with who you are and who you serve, every new tactic is just more weight to carry. Growth that lasts starts one layer down, with your truth, not with your to-do list.'},

 {t:'panel',tag:'Part one',h:'The cost of the copycat path',
  panel:'When you run someone else’s playbook, three things happen: you second-guess every decision, you burn out keeping up appearances, and your work starts to look like everyone else’s. The market does not need another version of what already exists. It needs you.'},

 {t:'lead',tag:'Part one',h:'The overwhelm is a symptom, not a flaw',
  lead:'The disorganization and the overwhelm are not proof that you are bad at business. They are what it feels like to run a business that was never designed around you. Fix the design and the overwhelm has nowhere to live. That is what the rest of this hour is about.'},

 {t:'hook',tag:'The method',
  big:'Grow deeper to grow faster.',
  sub:'The Greenhouse Method is the opposite of bolting on more tactics. You build the business from the inside out, in three shifts.'},

 {t:'pillars',tag:'The Greenhouse Method',h:'Three shifts',
  pillars:[
   {n:'01',h:'Discover your truth',p:'Get honest about who you are, the work you want to make, and the clients you are here to serve. This becomes your compass.'},
   {n:'02',h:'Uncover your methods',p:'Build the strategy that fits that truth: your pricing, your offers, your way of being found. The one that is sustainable for you.'},
   {n:'03',h:'Right your mind to thrive',p:'Clear the overwhelm and the second-guessing so you can act. Alignment before action is how things get done.'}]},

 {t:'pillar-deep',tag:'Shift one',h:'Discover your truth',
  lead:'Before any strategy, we get clear on your truthmagic: the thing only you bring. We name who you serve best, the stories you are drawn to tell, and the kind of business that would feel like a relief to run. Everything else gets built on this.'},

 {t:'panel',tag:'Shift one',h:'What we actually map',
  panel:'Your ideal client, in real detail. The three or four kinds of work you want more of, and the kinds you are ready to let go. The version of your week that feels sustainable. When this is clear, nine out of ten business decisions make themselves.'},

 {t:'pillar-deep',tag:'Shift two',h:'Uncover your methods',
  lead:'Now the strategy, built to fit. We make you easy to find by your ideal local clients, we price in a way you can stand behind, and we choose the few marketing moves you will actually keep doing. Simple, repeatable, and yours, not a borrowed template.'},

 {t:'panel',tag:'Shift two',h:'Being found, the simple way',
  panel:'Most photographers are invisible to the people already searching for them locally. A little clear, consistent attention to how you show up on Google does more than another month of chasing the algorithm. You do not need an agency for this. You need a system you can keep.'},

 {t:'pillar-deep',tag:'Shift three',h:'Right your mind to thrive',
  lead:'The plan only works if you work it. We clear the mental clutter, the comparison, and the quiet overwhelm that keeps good photographers stuck, so taking the next step feels light instead of heavy. This is where real momentum comes from.'},

 {t:'panel',tag:'Shift three',h:'Alignment before action',
  panel:'Action taken from overwhelm is frantic and it rarely sticks. Action taken from alignment is calm, and it compounds. Same photographer, same hours, completely different result. The order matters: get aligned first, then move.'},

 {t:'lead',tag:'Part three',h:'What changes when you grow this way',
  lead:'A photographer who was disorganized and overwhelmed ends up with a business that fits: a clear sense of who they serve, pricing they are not apologetic about, a simple way to be found, and the headspace to keep going. Not a louder business. A truer one, and usually a more profitable one.'},

 {t:'lead',tag:'Why me',h:'I have lived both sides of this',
  lead:'I run Jennings Photo, my own portrait studio, and I have spent 400-plus episodes of Photo Business Help learning alongside photographers at every stage. I built the Greenhouse because the advice I kept hearing treated the business like a machine, when the photographer is the whole point. Growth paired with personal growth is not a slogan to me. It is how I work.'},

 {t:'hook',tag:'The invitation',
  big:'The Greenhouse',
  sub:'A supportive community and coaching intensive where we put the Greenhouse Method to work on your business, together, so you grow deeper in order to grow faster.'},

 {t:'cta',tag:'Your next step',h:'Come grow in the Greenhouse',
  sub:'If today resonated, this is where we go further, together and at your pace.',
  foot:'Join the Greenhouse at photobusinesshelp.com · Natalie Jennings, Photo Business Help',
  disc:'This masterclass is for education only. It shares approaches and frameworks, not promises. Results depend on your own work, market, and circumstances, and no specific income or business outcome is guaranteed.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide '+ (s.t==='cta'?'cta':'');
  let h='';
  if(s.tag) h+='<span class="tag">'+s.tag+'</span>';
  if(s.t==='title'){h=SPROUT+(s.kicker?'<div class="kicker">'+s.kicker+'</div>':'')+'<h1>'+s.h+'</h1><p class="sub">'+s.sub+'</p>'+(s.foot?'<div class="foot">'+s.foot+'</div>':'');}
  else if(s.t==='who'){h+='<h2>'+s.h+'</h2><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  else if(s.t==='hook'){h+='<p class="big">'+s.big+'</p>'+(s.sub?'<p class="sub" style="margin-top:20px">'+s.sub+'</p>':'');}
  else if(s.t==='lead'){h+='<h2>'+s.h+'</h2><p class="lead">'+s.lead+'</p>';}
  else if(s.t==='panel'){h+='<h2>'+s.h+'</h2><div class="panel"><p>'+s.panel+'</p></div>';}
  else if(s.t==='pillars'){h+='<h2>'+s.h+'</h2>'+s.pillars.map(p=>'<div class="pillar"><div class="pnum">'+p.n+'</div><div class="pbody"><h3>'+p.h+'</h3><p>'+p.p+'</p></div></div>').join('');}
  else if(s.t==='pillar-deep'){h+='<h2>'+s.h+'</h2><p class="lead">'+s.lead+'</p>';}
  else if(s.t==='cta'){h+='<h2>'+s.h+'</h2><p class="sub">'+s.sub+'</p>'+(s.foot?'<div class="foot">'+s.foot+'</div>':'')+'<p class="disc">'+s.disc+'</p>';}
  el.innerHTML=h+'<span class="idx">'+(i+1)+' / '+S.length+'</span>';
  deck.appendChild(el);
});
</script>
</body>
</html>
