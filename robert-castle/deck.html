<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Operator to Executive Shift — Robert Castle, Tech Leadership Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060d2e;        /* site ground (brand.json) */
    --panel:#0c1740;     /* one step up for cards */
    --rule:#2a3a66;      /* muted navy hairline */
    --accent:#4184f4;    /* brand electric blue (brand.json, 10 uses) */
    --ink:#eaf0ff;       /* near-white body (brand.json) */
    --muted:#b7c2e0;     /* periwinkle secondary (brand.json, 40 uses) */
    --head:'Space Grotesk', system-ui, sans-serif;
    --body:'Inter', system-ui, sans-serif;
    --mono:'Space Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:linear-gradient(180deg,var(--panel),#09123a);border:1px solid var(--rule);border-radius:16px;padding:54px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.02em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:33px;line-height:1.14;letter-spacing:-.01em;margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:62ch;margin-bottom:12px}
  p strong{color:var(--ink);font-weight:600}
  .big{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.25;color:var(--ink);max-width:58ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;color:var(--muted);padding-left:28px;position:relative;margin-bottom:12px;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .num{font-family:var(--mono);color:var(--accent);font-size:15px;margin-right:10px}
  .foot{margin-top:26px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
  .pill{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:7px 13px;border-radius:999px;margin-bottom:20px;align-self:flex-start}
  .credit{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:8px}
  .disc{font-size:13px;color:var(--muted);max-width:70ch;margin-top:22px;line-height:1.5;border-top:1px solid var(--rule);padding-top:16px}
  .quote{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.22;color:var(--ink);max-width:56ch}
  #stage{counter-reset:s}
  .tag{position:absolute;right:22px;top:20px;font-family:var(--mono);font-size:12px;color:var(--rule)}
</style>
</head>
<body>
<div class="deck" id="stage"></div>
<script>
const S=[
  {t:'title',pill:'A live masterclass',h1:'The Operator to Executive Shift',p:'Why shipping more stops getting you promoted at the senior level, and the five skills that make the board see you as a peer.',credit:'Robert Castle · Tech Leadership Solutions'},
  {t:'who',eyebrow:'Who this is for',h2:'If you want the next role and the authority to land it',list:['Senior individual contributors stepping into leadership','New directors, VPs and CTOs finding the altitude','Established tech executives who want the strategic seat'],foot:'Tech leaders who want the next role.'},
  {t:'trap',eyebrow:'The trap',h2:'You shipped every project. You still did not get the nod.',p:'So you do more. More delivery, more firefighting, more owning the detail. And the promotion still goes to someone who ships less than you do. The harder you operate, the more stuck you get.'},
  {t:'reframe',eyebrow:'The reframe',quote:'"At senior levels, technical skill plateaus. What moves you up is judgment, presence, and self-awareness."',credit:'The thing that got you here is not the thing that gets you up.'},
  {t:'part',pill:'Part one',h2:'The board sees an operator, not a peer',p:'Promotion at the top is not handed to the best operator. It is handed to the person the room already treats as an executive. The gap is not effort. It is how you are read.'},
  {t:'content',eyebrow:'What reads as operator',h2:'The signals that keep you where you are',list:['Over-functioning: you hold the detail so nothing slips','Firefighting: your value shows up in the crisis','Output as identity: more shipped equals more worth']},
  {t:'content',eyebrow:'What reads as executive',h2:'The signals that move you up',list:['Judgment: you are trusted with the ambiguous call','Presence: the room settles when you speak','Narrative: you frame the work, not just deliver it','Leverage: you create through others, on purpose']},
  {t:'part',pill:'Part two',h2:'The five skills that move you manager to executive',p:'This is the diagnostic underneath the Tech Leadership Assessment. Most leaders are strong on three and quietly blocked by one. Naming the one is the whole game.'},
  {t:'content',eyebrow:'Skill one',h2:'Judgment over output',p:'Being trusted with the calls that have no clean answer. The move from "I delivered it" to "I decided it, and I was right enough, often enough."'},
  {t:'content',eyebrow:'Skill two',h2:'Executive presence',p:'How you are experienced in the room, under pressure, on the days it matters. Not performance. Composure that makes people hand you scope.'},
  {t:'content',eyebrow:'Skill three',h2:'Self-awareness',p:'Seeing your own default under stress before it costs you. The operator reflex is to take the work back. The executive catches the reflex.'},
  {t:'content',eyebrow:'Skill four',h2:'Influence without authority',p:'Moving peers and the layer above you when none of them report to you. The real currency at the director-to-VP line.'},
  {t:'content',eyebrow:'Skill five',h2:'Decision-making clarity',p:'Making the call legible: what you decided, why, and what you chose not to do. Clarity is what gets delegated to you next.'},
  {t:'content',eyebrow:'Anchor the shift',h2:'The Values Compass: Clarify. Align. Lead.',p:'A shift that is not anchored in your own values does not hold under pressure. Get explicit about what you actually stand for, so your decisions and your presence line up with it. That alignment is the base layer of credible authority.'},
  {t:'part',pill:'Part three',h2:'Then make the case, in numbers you can defend',p:'Executives win the next role with a defensible argument, not a hopeful one. This is the ROI Model.'},
  {t:'content',eyebrow:'Personal ROI',h2:'What the promotion is worth to you',list:['Salary at the next level','A larger bonus tied to bigger scope','A refreshed equity grant'],foot:'Then discount every number for the realistic chance you hit it.'},
  {t:'content',eyebrow:'Company ROI',h2:'What it is worth to them',list:['Retention: the senior people who stay because you lead well','Productivity: a sharper org, not a busier one','Faster execution: fewer stalled initiatives and less rework']},
  {t:'reframe',eyebrow:'The discipline',quote:'"Quantify only what you can defend, list the rest plainly, then discount for reality."',credit:'A case that survives scrutiny beats a bigger case that does not.'},
  {t:'whyme',eyebrow:'Why me',h2:'Robert Castle',p:'Thirty years in technology leadership. Seventeen years at Accenture. Former CIO. Two startup exits. Now a certified executive coach who works one to one with senior tech leaders on exactly this shift.',foot:'No theory, no fluff. Specific tools and patterns for the situations tech leaders actually face.'},
  {t:'cta',pill:'The next step',h2:'Ready to make the shift deliberate?',p:'If you want your next role to be a decision instead of a hope, the next step is a strategy call. We map which of the five skills is blocking you and what the next ninety days should hold.',cta:'Book your strategy call at Tech Leadership Solutions',disc:'Educational content only. This masterclass shares frameworks and patterns from executive coaching practice. It is not a guarantee of promotion, compensation, or any specific career outcome. Results vary with each leader and situation.'}
];
const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let h='<span class="tag">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</span>';
  if(s.pill)h+='<span class="pill">'+s.pill+'</span>';
  if(s.eyebrow)h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1)h+='<h1>'+s.h1+'</h1>';
  if(s.quote)h+='<div class="quote">'+s.quote+'</div>';
  if(s.h2)h+='<h2>'+s.h2+'</h2>';
  if(s.p)h+='<p>'+s.p+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.cta)h+='<p><strong>'+s.cta+'</strong></p>';
  if(s.foot)h+='<div class="foot">'+s.foot+'</div>';
  if(s.credit)h+='<div class="credit">'+s.credit+'</div>';
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  d.innerHTML=h;stage.appendChild(d);
});
</script>
</body>
</html>
