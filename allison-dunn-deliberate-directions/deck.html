<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Deliberate Owner — a masterclass with Allison Dunn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfcfd;
    --panel:#eef3f8;
    --rule:#d4dde7;
    --ink:#001c38;
    --muted:#3a4f66;
    --accent:#3271b4;
    --head:"Spectral",Georgia,serif;
    --body:"Work Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:#ffffff;border:1px solid var(--rule);border-radius:14px;padding:54px 56px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 2px rgba(0,28,56,.04)}
  .slide.title{background:var(--ink);color:#fff;border-color:var(--ink)}
  .slide.section{background:var(--panel)}
  .eyebrow{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .slide.title .eyebrow{color:#9ec3ea}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:36px;line-height:1.12;letter-spacing:-.01em}
  .kicker{font-family:var(--head);font-weight:600;font-size:15px;color:var(--accent);letter-spacing:.04em;margin-bottom:14px}
  .lead{font-size:20px;color:var(--muted);margin-top:18px;max-width:40ch}
  .slide.title .lead{color:#cfe0f1}
  p.body{font-size:18px;color:var(--muted);margin-top:16px;max-width:52ch}
  ul{margin-top:22px;list-style:none;display:grid;gap:14px}
  li{position:relative;padding-left:30px;font-size:18px;color:var(--ink)}
  li:before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border:2px solid var(--accent);border-radius:3px;transform:rotate(45deg)}
  li b{font-weight:600}
  .pillars{grid-template-columns:1fr 1fr;gap:12px 28px}
  .big{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.1;max-width:20ch}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:24px}
  .col{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px 24px}
  .col h3{font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .col p{font-size:16px;color:var(--muted)}
  .num{font-family:var(--head);font-weight:700;font-size:15px;color:var(--accent);margin-bottom:12px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.5}
  .cta-line{font-size:20px;color:var(--ink);margin-top:14px;font-weight:500}
  .foot{font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:28px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Allison Dunn', h:'The Deliberate Owner', lead:'How to stop running your business on reaction and start leading it on purpose.'},

  {t:'content', kicker:'Who this is for', h:'You built the business. Now it runs on you.', body:'For founders and owners who are past the startup scramble but still the person every decision routes through. The revenue is real. The dependence on you is the ceiling.'},

  {t:'content', kicker:'The trap', h:'Another 70-hour week that moved nothing.', body:'You answered every question, put out every fire, and the business is exactly where it was Monday. Working harder has stopped buying growth. It only buys you one more week of being needed.'},

  {t:'section', eyebrow:'The reframe', big:'You do not have a time problem. You have a decision problem.'},

  {t:'section', eyebrow:'Part one', h:'The owner becomes the system.'},

  {t:'content', kicker:'Why it happens', h:'Every answer lives in your head.', body:'When the business grew, it grew around you. Priorities, standards, the next right move, all of it is decided in the moment, by you. That is fast at ten people and fatal at fifty. The bottleneck is not your hours. It is that nothing is decided in advance.'},

  {t:'content', kicker:'The cost', h:'Reactive beats deliberate, every time, until it breaks.', body:'Reacting feels productive because it is urgent. But a business run on reaction cannot be handed off, cannot be scaled, and cannot run a day without you. The team waits. Good people leave. You stay stuck at the center.'},

  {t:'section', eyebrow:'Part two', h:'Think first. Then lead.'},

  {t:'content', kicker:'The discipline', h:'Deciding on purpose, before the moment.', body:'Think First is the practice at the center of everything I teach: slow down the decision so you make it once, write it down, and let the business run on it. Deliberate leaders are not calmer by personality. They are calmer because the decisions are already made.'},

  {t:'content', kicker:'The framework', h:'The 12-Pillar Business Framework.', body:'One lens across the whole business, so you are deciding on purpose in every area, not just the one that is on fire today. We work the pillars that are holding you back first.', pillars:['<b>Vision</b> and goal setting','<b>KPIs</b> and dashboards','<b>Process</b> and SOPs','<b>High-performance</b> teams','<b>Scaling</b> and exit planning','<b>Financial</b> mastery','<b>Time</b> and productivity','<b>Customer</b> experience']},

  {t:'content', kicker:'Pillar in focus', h:'Vision and KPIs: decide what winning means.', body:'Most owners cannot delegate because they never defined the target. We set the vision, then the three or four numbers that tell you, without you watching, whether the business is on track. The dashboard decides, so you do not have to.'},

  {t:'content', kicker:'Pillar in focus', h:'Process and team: decide it once, write it down.', body:'Every decision you make twice is a process you have not written yet. We turn your repeated judgment calls into SOPs your team can run, so the standard lives on the page instead of in your head.'},

  {t:'content', kicker:'Pillar in focus', h:'Time: get your calendar back.', body:'When the decisions are made in advance and the standards are written, the owner stops being the escalation point for everything. The deliberate week has room in it. The reactive week never does.'},

  {t:'section', eyebrow:'Part three', h:'What a deliberate business feels like.'},

  {t:'cols', kicker:'The shift', h:'From reaction to intention.', cols:[
    {head:'The reactive owner', text:'Every call comes to you. The plan is in your head. The week is whatever walks in the door. Growth means more of your hours.'},
    {head:'The deliberate owner', text:'The decisions are made and written. The numbers tell the truth without you. The team runs the standard. Growth no longer costs you your life.'}
  ]},

  {t:'content', kicker:'Why me', h:'Allison Dunn, Deliberate Directions.', body:'Thirty years as an owner and executive across engineering, manufacturing, and architecture before I founded Deliberate Directions, now Idaho’s top-ranked business coaching firm. Named a Top Executive Coach by Real Leaders in 2024, host of the Deliberate Leaders Podcast, and author of Think First. More than a thousand owners have used these tools.'},

  {t:'content', kicker:'The recap', h:'The business will run on whatever you decide in advance.', body:'The owner who thinks first builds a business that does not depend on them being in the room. That is the whole game: fewer decisions made in the moment, more decided on purpose.'},

  {t:'cta', eyebrow:'Your next step', h:'Lead your business deliberately.', ctaLine:'Book your free Strategy Session with Deliberate Directions, and we will find the first pillar to fix.', disclaimer:'This masterclass is for educational purposes only. It is not financial, legal, or business-outcome advice. Results vary by business and are not guaranteed.', foot:'Deliberate Directions · Boise, Idaho'}
];

function esc(s){return s==null?'':s;}
function render(){
  const deck=document.getElementById('deck');
  S.forEach(s=>{
    const d=document.createElement('section');
    d.className='slide '+(s.t==='title'?'title':(s.t==='section'?'section':''));
    let h='';
    if(s.eyebrow) h+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
    if(s.kicker) h+='<div class="kicker">'+esc(s.kicker)+'</div>';
    if(s.big) h+='<div class="big">'+esc(s.big)+'</div>';
    if(s.h && s.t==='title') h+='<h1>'+esc(s.h)+'</h1>';
    else if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    if(s.lead) h+='<div class="lead">'+esc(s.lead)+'</div>';
    if(s.body) h+='<p class="body">'+esc(s.body)+'</p>';
    if(s.pillars){h+='<ul class="pillars">';s.pillars.forEach(p=>h+='<li>'+p+'</li>');h+='</ul>';}
    if(s.cols){h+='<div class="cols">';s.cols.forEach(c=>h+='<div class="col"><h3>'+esc(c.head)+'</h3><p>'+esc(c.text)+'</p></div>');h+='</div>';}
    if(s.ctaLine) h+='<div class="cta-line">'+esc(s.ctaLine)+'</div>';
    if(s.disclaimer) h+='<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
    if(s.foot) h+='<div class="foot">'+esc(s.foot)+'</div>';
    d.innerHTML=h;
    deck.appendChild(d);
  });
}
render();
</script>
</body>
</html>
