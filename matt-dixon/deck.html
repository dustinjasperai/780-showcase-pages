<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Time-Starved Triathlete, a masterclass with Matt Dixon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --panel:#1a1916;
    --rule:#33302a;
    --ink:#f2efe6;
    --muted:#a89f8b;
    --accent:#867650;
    --accent2:#1dbccd;
    --head:'Montserrat',system-ui,sans-serif;
    --body:'Barlow',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(0,0,0,.40);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* load-line motif: a thin bronze rule sweeping the top edge, and one lit bronze mark */
  .slide::before{content:'';position:absolute;top:54px;left:-6%;right:34%;height:2px;
    background:linear-gradient(90deg,rgba(134,118,80,0),var(--accent) 70%,var(--accent));pointer-events:none}
  .slide::after{content:'';position:absolute;top:47px;right:32%;width:14px;height:14px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 6px rgba(134,118,80,.16)}
  .kick{font-family:var(--head);font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:800;font-size:60px;line-height:1.05;margin:0 0 18px;letter-spacing:-.015em;color:var(--ink)}
  h2{font-family:var(--head);font-weight:700;font-size:43px;line-height:1.10;margin:0 0 20px;letter-spacing:-.01em;color:var(--ink)}
  h3{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:47ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  .em2{color:var(--accent2)}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 42px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:4px;top:23px;width:13px;height:13px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(134,118,80,.16)}
  li b{font-weight:700}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:96px;line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .strike{color:transparent;-webkit-text-stroke:2px #f2efe666;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:6px;background:var(--accent);transform:rotate(-2deg);border-radius:3px}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:23px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .who{font-size:19px;color:var(--muted);margin-top:auto;padding-top:22px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:66ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:38px}h2{font-size:29px}.big{font-size:54px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Purple Patch · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Time-Starved Triathlete',p:'How a busy athlete reaches a big race performance without sacrificing family, work, sleep, or sanity.',pres:'With <b>Matt Dixon</b>, founder of Purple Patch Fitness'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why more hours is the wrong goal','The real driver of endurance performance, and it is not raw volume.'],['A structure that fits your life','How to build a training week that survives work, family and travel.'],['The recovery that turns work into fitness','Why the athletes who improve fastest recover on purpose.']]},
 {t:'audience',kick:'Who this is for',h:'You have the drive. You do not have the time.',p:'Working parents, founders and professionals chasing a real goal, an Ironman, a 70.3, a first marathon, on top of a demanding life, who are tired of training plans that assume you have nothing else going on.',who:'<b>The trap:</b> you try to solve a time problem by finding more hours, so the training keeps eating the parts of life you were doing it for.'},
 {t:'reframe',kick:'The reframe',big1:'Find more hours.',big2:'Build a sharper <span class="em">structure</span>.',p:'You do not need more time to train. You need a structure that turns the time you have into fitness. The athletes who break through are not the ones who train the most, they are the ones whose weeks are built to repeat.'},
 {t:'stakes',kick:'The stakes',h:'A life bent around training does not last.',p:'When every plan asks you to steal one more hour from sleep or family, you can hold it for a block, then it breaks, and the fitness leaks out with it. Consistency you can sustain beats a heroic month you pay for later.'},
 {t:'part',kick:'Part one',h:'Why more hours is the wrong goal.'},
 {t:'point',kick:'The core problem',h:'You are chasing volume you cannot repeat.',p:'The default advice is to add sessions until something gives. Without a deliberate structure, every big week is followed by a lost one, and the training never compounds into race-day fitness.'},
 {t:'point',kick:'The core problem',h:'The plan assumes a life you do not have.',p:'Most plans are built for an athlete with open afternoons and no travel. Dropped into a real calendar, they generate guilt on the weeks you miss and fatigue on the weeks you do not, and neither one makes you faster.'},
 {t:'signs',kick:'The core problem',h:'The signs the structure is wrong.',li:[['You train hard and plateau','The work goes in and the race times stop moving.'],['Every good block ends in a cold or a crash','Fitness you build in three weeks you give back in one.'],['The training costs you the life','The family, the sleep and the work all quietly pay for the miles.']]},
 {t:'part',kick:'Part two',h:'The Four Pillars of Performance.'},
 {t:'framework',kick:'The method',h:'Four pillars, held together by consistency.',row:[['Endurance','The specific load that actually triggers adaptation.'],['Strength','Move efficiently, stay healthy, hold your form late.'],['Fuel and Nutrition','Two different jobs, not one.'],['Recovery','Where the fitness is actually built.']],p:'The right load, supported and repeatable. Consistency of specific load is the thread that runs through all four.'},
 {t:'point',kick:'Pillar one: endurance',h:'The load that adapts, not the load that impresses.',p:'Endurance is the sport-specific demand that triggers adaptation in the swim, bike and run. The goal is the necessary load delivered consistently, not the biggest week you can survive once.'},
 {t:'point',kick:'Pillar two: strength',h:'Functional strength keeps you in the race.',p:'Resistance work that targets mobility, stability and the movement your sport actually demands. It buys biomechanical efficiency and keeps you healthy, so the endurance work can keep going in.'},
 {t:'point',kick:'Pillar three: fuel and nutrition',h:'Two jobs most athletes blur into one.',p:'Fueling is the calories that let you complete the session. Nutrition is the everyday diet that supports the whole training life. They are distinct, yet synergistic, and treating them as one is where energy and recovery quietly leak away.'},
 {t:'point',kick:'Pillar four: recovery',h:'Recovery is where the fitness is built.',p:'Training is only the stimulus. Recovery is the physiological process that compensates for the load and turns it into adaptation. Build recovery into the week on purpose and the same training finally produces the race you wanted.'},
 {t:'point',kick:'The thread',h:'Consistency of load beats heroics.',p:'Optimal endurance performance rises out of a journey that delivers consistency of specific load. A repeatable, sustainable rhythm produces more than the occasional monster block, because it is the weeks you actually complete that make you fast.'},
 {t:'part',kick:'Part three',h:'What changes when the structure leads.'},
 {t:'looks',kick:'The outcome',h:'The same life, and finally the race.',li:[['The week repeats','A structure you can hold through work, travel and family, month after month.'],['The training compounds','Consistent load turns into real race-day fitness instead of leaking away.'],['You arrive whole','You reach the start line fit and recovered, with the rest of your life still intact.']]},
 {t:'whyme',kick:'Why Matt',h:'A physiologist and coach, not a volume machine.',li:[['Former pro triathlete and physiologist','I coach from how the body actually adapts, not from how hard a week looks.'],['The time-starved method','I built Purple Patch and wrote Fast-Track Triathlete around integrating big performance into a big life.'],['A track record at the top','Athletes I have coached have taken 350 plus pro IRONMAN and 70.3 wins and podiums.']]},
 {t:'cta',kick:'Your next step',h:'Ready to build a structure that fits your life?',ctas:['<b>Book a free needs assessment</b> and we will map a week that fits your real calendar.','<b>Start with Tri Squad</b>, year-round coached training built on the Four Pillars.'],disc:'This masterclass is educational. It shares training principles and frameworks for endurance performance; it is not medical, nutrition or individual coaching advice for your specific situation, and it is not a guarantee of any race result, time or outcome. Consult a qualified physician before starting or changing a training program. Results vary.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
