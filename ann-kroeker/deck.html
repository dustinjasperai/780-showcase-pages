<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book-Ready: The 4 Ps That Make Agents Say Yes — Ann Kroeker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --paper:#f7f3ea; --panel:#efe9db; --rule:#d8cfbb;
    --ink:#272019; --ink-soft:#4b4036; --ink-muted:#8a7c6b;
    --accent:#7a2e2e;
  }
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  body{font-family:'EB Garamond',Georgia,serif;background:#241d17;color:var(--ink);}
  .stage{max-width:1040px;margin:0 auto;padding:28px 20px 80px;}
  .slide{background:var(--paper);border:1px solid var(--rule);border-radius:4px;
    aspect-ratio:16/9;margin:0 auto 26px;padding:58px 64px;display:none;
    flex-direction:column;position:relative;overflow:hidden;
    box-shadow:0 16px 40px rgba(0,0,0,.28);}
  .slide.show{display:flex;}
  .pel{position:absolute;left:0;top:64px;bottom:64px;width:3px;background:var(--accent);}
  .num{position:absolute;right:30px;bottom:22px;font-family:'Hanken Grotesk',sans-serif;
    font-size:12px;color:var(--ink-muted);letter-spacing:.08em;}
  .k{font-family:'Hanken Grotesk',sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;
    letter-spacing:.18em;color:var(--accent);margin-bottom:20px;}
  h1{font-size:52px;font-weight:700;line-height:1.08;letter-spacing:-.01em;color:var(--ink);margin-bottom:22px;}
  h2{font-size:36px;font-weight:600;line-height:1.16;color:var(--ink);margin-bottom:20px;}
  .lede{font-size:23px;color:var(--ink-soft);line-height:1.5;max-width:30ch;}
  p.body{font-size:21px;color:var(--ink-soft);line-height:1.55;margin-bottom:16px;max-width:40ch;}
  .sign{margin-top:auto;font-family:'Hanken Grotesk',sans-serif;font-size:14px;color:var(--ink-muted);letter-spacing:.04em;}
  ul{list-style:none;margin-top:8px;}
  li{font-size:21px;color:var(--ink-soft);line-height:1.4;padding:13px 0 13px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:44ch;}
  li:last-child{border-bottom:none;}
  li::before{content:"";position:absolute;left:0;top:22px;width:11px;height:11px;background:var(--accent);border-radius:1px;}
  li b{color:var(--ink);font-weight:600;}
  .big{font-size:120px;font-weight:700;color:var(--accent);line-height:1;opacity:.9;}
  .cta-h{font-size:46px;font-weight:700;color:var(--ink);margin-bottom:18px;line-height:1.1;}
  .disc{font-family:'Hanken Grotesk',sans-serif;font-size:13px;color:var(--ink-muted);line-height:1.5;margin-top:22px;max-width:56ch;}
  .title-slide{background:#241d17;border-color:#3a2f26;}
  .title-slide h1{color:#f7f3ea;} .title-slide .lede{color:#cbbeae;}
  .title-slide .k{color:#c98a6a;} .title-slide .sign{color:#9a8b78;}
  .title-slide .pel{background:#c98a6a;}
  .nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;
    font-family:'Hanken Grotesk',sans-serif;z-index:10;}
  .nav button{background:#f7f3ea;border:1px solid var(--rule);color:var(--ink);
    padding:9px 18px;border-radius:3px;font-size:14px;cursor:pointer;font-weight:500;}
  .nav button:hover{background:#fff;}
  @media(max-width:720px){.slide{padding:34px 30px;}h1{font-size:34px;}h2{font-size:26px;}
    .lede{font-size:19px;}p.body,li{font-size:17px;}.big{font-size:80px;}.cta-h{font-size:32px;}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="nav"><button onclick="go(-1)">&larr; Prev</button><button onclick="go(1)">Next &rarr;</button></div>
<script>
const S=[
  {t:"title",cls:"title-slide",k:"A masterclass with Ann Kroeker, Writing Coach",
   h:"Book-Ready: The 4 Ps That Make Agents Say Yes",
   lede:"How to see your book the way a literary agent sees it, and close the gaps before you ever hit send.",
   sign:"Ann Kroeker &nbsp;&middot;&nbsp; 30+ years in the writing and publishing world"},

  {t:"body",k:"What you will leave with",
   h:"A clear read on whether your book is ready, and what to fix first.",
   p:"By the end of this hour you will know the four things a publishing professional checks, where your book is strong, and the one P to work on next. Not a vague pep talk. A short, honest checklist you can act on this week."},

  {t:"body",k:"Who this is for",
   h:"You have a book in you. You are not sure it is ready.",
   p:"You have pages, maybe a full manuscript. You have been told you are a strong writer. And yet every time you picture sending it to an agent, something in you hesitates. This hour is for the writer who is close, and wants to know what close actually takes."},

  {t:"body",k:"The trap",
   h:"Most writers polish the one thing agents weigh the least.",
   p:"We pour months into the prose, because the prose is the part we can see. Then we attach it to a pitch nobody can repeat and a platform nobody can find, and we wonder why the answer is no. The manuscript was never the whole test."},

  {t:"quote",k:"The reframe",
   h:"An agent is not rejecting your writing. They are rejecting a book that is not yet ready to sell.",
   p:"Ready is not a feeling. It is a short list of things a publishing professional checks in the first five minutes, and all of them can be built on purpose."},

  {t:"list",k:"The framework",
   h:"The 4 Ps of a book-ready writer",
   list:["<b>Pitch.</b> Your book in a sentence or two that an agent can repeat in a meeting.",
         "<b>Prose.</b> Craft strong enough to make a reader turn the page, not just admire it.",
         "<b>Platform.</b> The readers you can already reach, large enough to justify a yes.",
         "<b>Practice.</b> The writing habit that makes the other three repeatable, not a one-time push."]},

  {t:"body",k:"Part one · Pitch",
   h:"If you cannot say it in two sentences, you cannot sell it in two hundred pages.",
   p:"The pitch is the first thing read and the first thing forwarded. We define the one idea your book is actually about, the reader it is for, and the promise it makes, until it survives being said out loud to a stranger."},

  {t:"list",k:"Part one · Pitch",
   h:"A pitch that travels does three things",
   list:["Names the one big idea without a list of also-rans.",
         "Makes a promise a specific reader is already looking for.",
         "Fits in the sentence an agent repeats when you are not in the room."]},

  {t:"body",k:"Part two · Prose",
   h:"Turning pages, not turning heads.",
   p:"Beautiful sentences lose readers who are not already in love with you. Book-ready prose earns the next page from a stranger. We look at the few craft moves that keep a cold reader moving, and the habits that quietly stall them."},

  {t:"list",k:"Part two · Prose",
   h:"The craft moves that keep a cold reader moving",
   list:["A first page that raises a question instead of clearing its throat.",
         "Scenes that earn the idea, instead of explaining it.",
         "Cutting the lines you love most when they stall the reader."]},

  {t:"body",k:"Part three · Platform",
   h:"Platform is not followers. It is the readers you can reach on purpose.",
   p:"A publisher is doing math: can this writer put the book in front of enough of the right people? Platform is every honest way you reach readers, an email list, a podcast, a community, and we size it to the book you are actually pitching."},

  {t:"list",k:"Part three · Platform",
   h:"Three questions a publisher is really asking",
   list:["Who is already listening to you, and how many?",
         "Can you reach them again next week, on purpose?",
         "Does that audience match the book on the page?"]},

  {t:"body",k:"Part four · Practice",
   h:"The habit is the quiet P that holds the loud three up.",
   p:"Pitch, prose, and platform all decay without a practice. You do not need more hours; you need a plan that fits the hours you have, in pockets of time, so the work moves forward whether the week is kind or not."},

  {t:"quote",k:"Why this order",
   h:"Ready is built in the order an agent reads: pitch first, then prose, then platform, held together by practice.",
   p:"Work them out of order and you spend your best energy on the part that moves the decision the least."},

  {t:"body",k:"The objection",
   h:"But I do not have a platform yet.",
   p:"Almost no one does when they start, and that is exactly why we size it to your book instead of chasing a number. A right-sized, reachable audience beats a big, indifferent one, and it is built in pockets of time, the same way the pages were."},

  {t:"body",k:"The cost of waiting",
   h:"An unready book does not fail loudly. It just keeps waiting.",
   p:"It sits in a drawer, or collects quiet passes you never fully understand. The writers who get read are rarely the most gifted in the room; they are the ones who got ready on purpose, in the order that moves the decision."},

  {t:"body",k:"The shift",
   h:"From a hopeful manuscript to a proposal a professional takes seriously.",
   p:"When the 4 Ps line up, the book stops being a private wish and becomes a project an agent can say yes to. That is the shift this work is for, and it is the shift my writers have made on the way to agents, contracts, and shelves."},

  {t:"body",k:"Why me",
   h:"I have spent three decades inside the writing and publishing world.",
   p:"I am a writing coach, author, and host of the podcast Ann Kroeker, Writing Coach, named to The Write Life's 100 Best Websites for Writers every year since 2016. My clients have landed agents and book contracts, hit bestseller lists, and been accepted into competitive MFA programs. I help writers get ready, then get read."},

  {t:"cta",cls:"cta",k:"Your next step",
   h:"Become a book-ready writer, with me in your corner.",
   p:"Book-Ready Writers is my 12-month group program where we build all four Ps together: a quality book proposal, a real platform, stronger craft, and a practice that lasts. Join the waitlist, then apply for the next cohort.",
   disc:"Educational content only. No income, publishing outcome, agent, or result is guaranteed; results vary by writer, effort, and market. Nothing here is a promise of a book deal.",
   sign:"Ann Kroeker, Writing Coach &nbsp;&middot;&nbsp; annkroeker.com/bookreadywriters"}
];
const stage=document.getElementById('stage');
let i=0;
S.forEach((s,idx)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.cls||'')+(idx===0?' show':'');
  let inner='<div class="pel"></div>';
  if(s.k)inner+='<div class="k">'+s.k+'</div>';
  if(s.t==='title'){inner+='<h1>'+s.h+'</h1><div class="lede">'+s.lede+'</div><div class="sign">'+s.sign+'</div>';}
  else if(s.t==='list'){inner+='<h2>'+s.h+'</h2><ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  else if(s.t==='quote'){inner+='<h2>'+s.h+'</h2><p class="body">'+s.p+'</p>';}
  else if(s.t==='cta'){inner+='<div class="cta-h">'+s.h+'</div><p class="body">'+s.p+'</p><div class="disc">'+s.disc+'</div><div class="sign">'+s.sign+'</div>';}
  else{inner+='<h2>'+s.h+'</h2><p class="body">'+s.p+'</p>';}
  inner+='<div class="num">'+(idx+1)+' / '+S.length+'</div>';
  d.innerHTML=inner;
  stage.appendChild(d);
});
const slides=[...document.querySelectorAll('.slide')];
function show(n){slides[i].classList.remove('show');i=(n+slides.length)%slides.length;slides[i].classList.add('show');window.scrollTo(0,0);}
function go(d){show(i+d);}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
</script>
</body>
</html>
