<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlock Your Executive Presence, a live masterclass with Joe Kwon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f2;      /* their warm off-white ground (brand.json, 7 uses) */
  --panel:#ffffff;   /* clean paper lift */
  --rule:#d9d3c9;    /* muted tint of the ground */
  --accent:#102942;  /* their deep navy (brand.json, 28 uses) */
  --accent2:#8ea088; /* their sage green (brand.json, 15 uses) */
  --ink:#1c1c1c;     /* their body color (brand.json, 48 uses) */
  --muted:#5c6470;
  --head:'Libre Baskerville',Georgia,serif;
  --body:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
.deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
  padding:64px 60px;margin:26px 0;min-height:460px;display:flex;flex-direction:column;
  justify-content:center;box-shadow:0 18px 50px rgba(16,41,66,.06)}
.slide.dark{background:var(--accent);color:#f4f6f8;border-color:var(--accent)}
.slide.dark .kick,.slide.dark .num{color:var(--accent2)}
.slide.dark h1,.slide.dark h2{color:#fff}
.kick{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin-bottom:22px}
.num{font-family:var(--head);font-size:15px;letter-spacing:.14em;color:var(--accent2);
  text-transform:uppercase;margin-bottom:18px;font-weight:700}
h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.12;margin:0 0 20px}
h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.16;margin:0 0 18px}
p{font-size:22px;line-height:1.55;color:var(--muted);margin:0 0 16px;max-width:42em}
.slide.dark p{color:#d6dde4}
.lead{font-size:26px;color:var(--ink)}
.slide.dark .lead{color:#eef2f5}
.promise{font-size:24px;color:var(--accent);font-weight:600;font-family:var(--head);margin-top:10px}
ul{margin:14px 0 0;padding:0;list-style:none}
li{font-size:22px;line-height:1.5;color:var(--ink);padding:14px 0;border-top:1px solid var(--rule);
  display:flex;gap:18px;align-items:flex-start}
li:first-child{border-top:none}
.st{font-family:var(--head);font-weight:700;color:var(--accent);min-width:26px}
.state-name{font-family:var(--head);font-size:30px;color:var(--accent);font-weight:700;margin-bottom:10px}
.kata{font-size:19px;color:var(--accent2);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:14px}
.bio{font-size:21px;color:var(--ink)}
.disc{font-size:15px;color:var(--muted);margin-top:28px;border-top:1px solid var(--rule);padding-top:18px;max-width:46em}
.cta-step{font-size:24px;color:var(--accent);font-weight:600;margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:14px;padding:20px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<footer>Joe Kwon · The Connection Counselor · a live masterclass</footer>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Joe Kwon', h:'Unlock Your Executive Presence', lead:'The six states that make a room decide you are a leader, before you say a word.', promise:'Presence you can enter on purpose, in any room.'},
  {t:'who', kick:'Who this is for', h:'You do great work, and you still get overlooked in the room.', p:'You are competent, prepared, and respected on paper. But in the meeting that matters, the credit, the airtime, and the promotion keep going to someone with less substance and more presence. This hour is for you.'},
  {t:'trap', kick:'The trap', h:'You were told to perform your way to presence.', p:'Speak up more. Take up space. Sound more senior. So you tried to perform confidence you did not feel, and the room felt the effort. Performed presence always reads as trying, and trying reads as junior.'},
  {t:'reframe', dark:true, kick:'The reframe', h:'Presence was never a performance.', lead:'It is a state of being, and the room feels which one you are in. You do not fake presence. You enter it. And a state can be practiced.'},
  {t:'part', num:'Part one · the real problem', h:'The harder you push for authority, the less the room gives you.', p:'Pushing for status signals you do not have it. The room tightens, people get guarded, and you get less of the exact thing you were reaching for. Authority you grab evaporates. Authority the room hands you sticks.'},
  {t:'part', num:'Part one · the real problem', h:'People decide your seniority from the safety you create.', p:'Before anyone weighs your ideas, they read whether they are safe around you. Psychological safety is not soft. It is the fastest signal of a leader, because only secure people can afford to make others feel secure. Connection comes first, command follows.'},
  {t:'part', dark:true, num:'Part two · the framework', h:'The six states of executive presence.', lead:'You do not perform presence, you enter it. Six inner states, each one trainable with a small daily practice, a kata, until it becomes who you are in the room.'},
  {t:'state', num:'State one of six', name:'Proactive', lead:'Presence starts before the room does. You set the tone on purpose instead of reacting to whoever spoke loudest.', kata:'Kata: decide your one intention before you walk in.'},
  {t:'state', num:'State two of six', name:'Resolute', lead:'Steady conviction people can feel. Not louder, clearer. You hold a position without gripping it.', kata:'Kata: say the hard sentence in twelve words, then stop.'},
  {t:'state', num:'State three of six', name:'Equanimity', lead:'The room reads your nervous system first. When you stay level under pressure, they borrow your calm.', kata:'Kata: one slow breath before you respond, every time.'},
  {t:'state', num:'State four of six', name:'Stillness', lead:'Presence is often what you do not do. Fewer words, no fidget, no rush to fill silence. Stillness reads as authority.', kata:'Kata: let the pause sit two seconds longer than is comfortable.'},
  {t:'state', num:'State five of six', name:'Engaged', lead:'Connection is the engine. People decide how senior you are from the safety you create, so you get curious about them first.', kata:'Kata: ask one real question before you make your point.'},
  {t:'state', num:'State six of six', name:'Confidence', lead:'The output of the other five, not the starting point. Confidence is what steadiness, stillness and connection produce.', kata:'Kata: name one thing you did well today, out loud.'},
  {t:'part', kick:'How a state becomes a habit', h:'Presence is trained, not summoned.', p:'A kata is a small, repeatable rep. You do not wait to feel presence before the big room. You practice one state at a time in the ordinary rooms, so the state is already yours when the stakes are high. Theory changes nothing. Reps change you.'},
  {t:'part', num:'Part three · presence in the room', h:'Presence you can enter on purpose.', p:'You walk into the hard conversation already steady. You hold the silence instead of filling it. You make the room safe, ask the real question, and say the clear sentence. Nothing performed. People start treating you like the leader before the title arrives.'},
  {t:'whyme', kick:'Why me', h:'Joe Kwon, The Connection Counselor.', p:'Twenty years in Corporate America, a psychology degree from the University of Virginia and a law degree from Georgetown. I spent those years watching brilliant people get passed over and confident-looking people get promoted, and I mapped the difference. It is these six states. I wrote the Unlock Your series and host the No More Illusions podcast to teach them.'},
  {t:'recap', kick:'The six states', h:'What you take with you.', items:['Proactive, you set the tone before the room does.','Resolute, steady conviction people can feel.','Equanimity, the calm the room borrows.','Stillness, authority in what you do not do.','Engaged, connection first, command follows.','Confidence, the output of the other five.']},
  {t:'cta', kick:'Train the six states with Joe', h:'Build your presence from the inside out.', p:'If you want to train these six states with me, start with the free psychological-safety guide, then let us map which state is your leverage point and work it together in coaching.', step:'Start at joekwonjoe.com', disc:'Educational content only. Results vary from person to person. No specific result is guaranteed, and no promotion or income is promised. Executive presence and career outcomes depend on many factors outside any single method.'}
];

function render(s){
  const cls = 'slide' + (s.dark ? ' dark' : '');
  let h = `<div class="${cls}">`;
  if(s.num) h += `<div class="num">${s.num}</div>`;
  if(s.kick) h += `<div class="kick">${s.kick}</div>`;
  if(s.name) h += `<div class="state-name">${s.name}</div>`;
  if(s.h) h += `<h2>${s.h}</h2>`;
  if(s.lead) h += `<p class="lead">${s.lead}</p>`;
  if(s.p) h += `<p>${s.p}</p>`;
  if(s.promise) h += `<div class="promise">${s.promise}</div>`;
  if(s.kata) h += `<div class="kata">${s.kata}</div>`;
  if(s.items){ h += '<ul>' + s.items.map((it,i)=>`<li><span class="st">${i+1}</span>${it}</li>`).join('') + '</ul>'; }
  if(s.step) h += `<div class="cta-step">${s.step}</div>`;
  if(s.disc) h += `<div class="disc">${s.disc}</div>`;
  return h + '</div>';
}
document.getElementById('deck').innerHTML = S.map(render).join('');
</script>
</body>
</html>
