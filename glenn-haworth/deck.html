<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 4 Growth Levers — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFCFC; --panel:#FFFFFF; --rule:#d7e6ea;
    --ink:#073241; --muted:#436571; --accent:#4ebfd6; --deep:#073241;
    --head:'Archivo',system-ui,sans-serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  #deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:52px 48px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(7,50,65,.03)}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;color:var(--deep);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.14;color:var(--deep)}
  .promise{font-size:20px;color:var(--muted);margin-top:20px;max-width:30em}
  .lead{font-size:19px;color:var(--ink);margin-top:16px;max-width:34em}
  .big{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.12;color:var(--deep);max-width:20em}
  .big .a{color:var(--accent)}
  ul{margin:22px 0 0 0;list-style:none;max-width:40em}
  li{position:relative;padding:12px 0 12px 30px;font-size:18px;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .num{font-family:var(--head);font-weight:800;font-size:15px;color:var(--accent);margin-bottom:10px;letter-spacing:.08em}
  .foot{margin-top:28px;font-size:14px;color:var(--muted)}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:40em;border-top:1px solid var(--rule);padding-top:16px}
  .cta{font-family:var(--head);font-weight:700;font-size:21px;color:var(--deep);margin-top:22px}
  .step{display:inline-block;margin-top:14px;font-size:16px;color:var(--accent);font-weight:600}
  .tag{font-size:16px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Glenn Haworth', h:'The 4 Growth Levers', promise:'How retail and multi-channel owners build more revenue, more freedom, and more fun, without chasing one more tactic.'},
  {t:'who', kick:'Who this is for', h:'You run a real business, and it is running you', lead:'You own a retail or multi-channel business. Sales look okay on the surface. But you are working more hours than ever, the bank balance never matches the revenue, and every week is a new fire. This hour is for you.'},
  {t:'reframe', kick:'The honest reframe', big:'You are not <span class="a">broken</span>. You just do not have a growth system.', tag:'Most owners are great operators with no system underneath the work. That is fixable.'},
  {t:'part', num:'PART ONE', h:'Why another tactic will not fix this'},
  {t:'list', kick:'The tactic treadmill', h:'More tactics, same stress', items:['A new promotion lifts this month, then fades','A new channel adds revenue and even more work','Social gets busier, the bank balance does not move','You are the only reason anything holds together']},
  {t:'list', kick:'The real gap', h:'Revenue is not profit, and profit is not freedom', items:['Revenue hides where the business actually leaks','Growth without a system just scales the chaos','The goal is a business that grows when you step back','A system tells you which lever to pull, and when']},
  {t:'part', num:'PART TWO', h:'The 4 Growth Levers'},
  {t:'lever', num:'LEVER ONE', h:'Leads & Awareness', lead:'The right prospects discover you on purpose, not by luck. A repeatable way for people who have never heard of you to find you and raise their hand.'},
  {t:'lever', num:'LEVER TWO', h:'Sales & Conversion', lead:'Turn interest into customers. The offer, the conversation, and the follow-up that move a browser to a buyer, so more of the traffic you already have converts.'},
  {t:'lever', num:'LEVER THREE', h:'Average Sale Value', lead:'Raise the value of every transaction through packaging, bundling, and the natural next purchase, so the same number of customers is worth far more.'},
  {t:'lever', num:'LEVER FOUR', h:'Retention & Referrals', lead:'Repeat business and word of mouth. The least expensive growth you will ever buy, because you already earned the first sale.'},
  {t:'list', kick:'How they work together', h:'The levers compound', items:['Each lever multiplies the ones around it','Fix conversion and every lead is worth more','Lift average sale and retention pays you twice','Small gains on four levers beat a big win on one']},
  {t:'list', kick:'Where to start', h:'Find the leaking lever first', items:['Most businesses are strong on one or two levers','The stuck growth is almost always one weak lever','Diagnose before you spend a dollar or an hour','This masterclass shows you how to spot yours']},
  {t:'part', num:'PART THREE', h:'Your store, 90 days after you fix the system'},
  {t:'list', kick:'The 90-day picture', h:'From busy to built', items:['A clear view of which lever is costing you most','One focused change per lever, in order','Hours back because the system carries the load','Growth you can see in the numbers, not just the diary']},
  {t:'why', kick:'Why me', h:'I did this before I taught it', lead:'I scaled a family retail business into a multi-location, multi-channel operation with a real team, an online store, and music schools, then packaged what worked into a system. I wrote Retail Domination and I teach it every week on The Business Breakthrough Podcast. This is operator experience, not theory.'},
  {t:'list', kick:'Why it travels', h:'The system is repeatable', items:['The four levers apply to any product business','It works in-store, online, and across both','It is built for owners, not marketing departments','You keep the system long after any one tactic dies']},
  {t:'recap', kick:'Recap', h:'Four levers, one system', items:['Leads & Awareness','Sales & Conversion','Average Sale Value','Retention & Referrals']},
  {t:'cta', kick:'Your next step', h:'Build your growth system with me', cta:'Book your Growth Strategy call, or join the Resolve Business Club.', step:'resolvecoaching.com.au', disc:'This masterclass is educational. No income or result is guaranteed. Results vary and depend on your market, your offer, and the work you put in.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if (s.num) html += '<div class="num">'+s.num+'</div>';
  if (s.t === 'title'){ html += '<h1>'+s.h+'</h1>'; if(s.promise) html += '<p class="promise">'+s.promise+'</p>'; }
  else if (s.t === 'reframe'){ html += '<p class="big">'+s.big+'</p>'; if(s.tag) html += '<p class="tag">'+s.tag+'</p>'; }
  else { if(s.h) html += '<h2>'+s.h+'</h2>'; }
  if (s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if (s.items){ html += '<ul>'; for(const i of s.items) html += '<li>'+i+'</li>'; html += '</ul>'; }
  if (s.cta) html += '<p class="cta">'+s.cta+'</p>';
  if (s.step) html += '<span class="step">'+s.step+'</span>';
  if (s.disc) html += '<p class="disc">'+s.disc+'</p>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
