<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Million Dollar Micro Business · Tina Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf9f6; --panel:#ffffff; --rule:#e6e1d6;
    --ink:#244d79; --accent:#34b7c4;
    --grey:#4c5566; --dim:#9aa2ad; --chalk:#f2f6f7;
  }
  html,body{height:100%}
  body{background:#eceae4;font-family:'Lora',Georgia,serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dfdcd4}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.04vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'Poppins',sans-serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:-.012em}
  .t-title h1{font-size:4.2vw;max-width:90%}
  .t-normal h1{font-size:3.15vw;max-width:86%}
  .t-normal .body{font-family:'Lora',serif;font-size:1.52vw;color:var(--grey);margin-top:2.8vh;max-width:76%;line-height:1.6;font-weight:400}
  .sub{font-family:'Lora',serif;font-size:1.72vw;color:var(--grey);margin-top:3.4vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.32vw;font-weight:600;color:var(--accent);margin-bottom:2.2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:90%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#2b578a 0%,#173456 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:88%;font-family:'Lora',serif;font-weight:500;font-style:italic;color:#f4f8f9;line-height:1.24}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2b578a 0%,#173456 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:84%;color:#ffffff}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Poppins',sans-serif;border:1.5px solid var(--accent);color:#d7f0f3;border-radius:100px;padding:1.35vh 1.7vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.6vh;font-family:'Poppins',sans-serif;font-size:.94vw;color:rgba(255,255,255,.72);font-style:normal;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .crown{position:absolute;pointer-events:none;opacity:.92}
  .title-crown{right:7.5%;bottom:8.5%;width:21vw}
  .corner-crown{right:6.2%;bottom:7.8%;width:9.5vw;opacity:.5}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3.6vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(36,77,121,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Poppins',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Poppins',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Poppins',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.7vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.3vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Her Empire Builder</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- single-line crown motif: three lean peaks on a baseline, small nodes at the points -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="crown" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 118 L44 52 L86 96 L130 40 L174 96 L216 52 L232 118 Z" stroke="#34b7c4" opacity="0.92"/>
    <line x1="28" y1="132" x2="232" y2="132" stroke="#244d79" opacity="0.35"/>
    <circle cx="44" cy="52" r="4.4" fill="none" stroke="#34b7c4" stroke-width="2.6"/>
    <circle cx="130" cy="40" r="5.2" fill="none" stroke="#34b7c4" stroke-width="2.6"/>
    <circle cx="216" cy="52" r="4.4" fill="none" stroke="#34b7c4" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Million Dollar Micro Business',sub:'How to build a lean, seven-figure online-education business without a big team, a big overhead, or a return to burnout. A masterclass for women turning their expertise into a business.',brand:true,crown:'title'},
 {t:'normal',k:'Who this is for',title:'You are the business. Right now that is both the freedom and the ceiling.',body:'You have turned real expertise into a course, a membership, or coaching, and it works. But every new stage of growth seems to ask for more. More launches, more content, more team, more hours. And the more you add, the further away the freedom you started for begins to feel.'},
 {t:'normal',k:'The quiet trade',title:'Most course businesses buy their growth with the founder&rsquo;s life.',body:'Almost all of the advice on offer is the same word: add. Hire faster, launch harder, post daily, bolt on the next tool. It can grow the revenue. It can also quietly rebuild the exact 60-hour job you left, except now you own it and you cannot clock off.'},
 {t:'dark',title:'A seven-figure business does not have to be a big business. It has to be a lean one.'},

 {t:'section',idx:'Part One',title:'Why Bigger Is Not the Answer'},
 {t:'normal',k:'The scale trap',title:'Adding revenue by adding headcount adds fragility, not freedom.',body:'Every hire, tool, and channel you bolt on to reach the next tier also adds cost, management, and risk. Margin thins, your calendar fills, and slowly the business needs more and more of you just to stand still. That is a bigger job, not a better business.'},
 {t:'normal',k:'What actually compounds',title:'Margin and focus compound. Complexity only accumulates.',body:'A lean business keeps its profit, its attention, and its options open. The women who reach seven figures and still own their weekends are almost never the ones with the biggest teams. They are the ones who refused to add what the business did not truly need.'},
 {t:'dark',title:'The goal was never a bigger business. It was a freer one.'},

 {t:'section',idx:'Part Two',title:'The Million Dollar Micro Business Method'},
 {t:'normal',k:'Start from expertise',title:'One clear audience, one teachable transformation.',body:'A micro business does not sell everything to everyone. It takes the expertise you already have, names the exact person it serves, and builds one compelling offer around the change that person wants most. Narrow is not a limit here. Narrow is what makes it profitable.'},
 {t:'normal',k:'Build the lean offer ladder',title:'A course, a membership, and a mastermind that feed each other.',body:'You do not need a dozen products. You need a small, deliberate ladder. A way in, a place to stay, and a room for the ones ready to go all in. One audience grows with you over years, instead of being sold to once and then lost.'},
 {t:'normal',k:'Launch, then automate',title:'Sell it live to learn it, then let systems carry the weight.',body:'Launch to a real audience so the offer has to earn its keep. Then move the delivery, the onboarding, and the follow-up onto systems and a small, trusted team, so your revenue stops being chained to how many hours you personally spend in the room.'},
 {t:'normal',k:'The Eight Crucial Elements',title:'Eight parts of the business, kept lean and working as one.',body:'Brand, live events, your courses, content and credibility, systems and automations, people, money, and mindset. Most owners over-invest in one of these and starve the rest. The micro business keeps all eight lean and in balance, and that balance is where the profit actually lives.'},
 {t:'normal',k:'The Momentum Path',title:'Grow by stage, not by hustle.',body:'From your first hundred thousand through Macro, Mega, Elite, and Empress at seven figures and beyond, each stage has one right next move. Knowing which stage you are actually in tells you what to build next, and just as importantly, what to leave alone for now.'},
 {t:'dark',title:'Keep the business small on purpose, and the profit, and the life, get big.'},

 {t:'section',idx:'Part Three',title:'The Lean Empire You Keep'},
 {t:'normal',k:'The business this builds',title:'High margin, a small team, and a calendar you actually own.',body:'A lean seven-figure course business keeps most of what it earns, runs on a handful of people and the right systems, and grows because the model is sound. Not because the founder is running faster and sleeping less every single quarter.'},
 {t:'normal',k:'Why Tina Tower',title:'She built the big version first, then chose the lean one.',body:'Tina Tower scaled a 33-centre, 120-staff education franchise across Australia and sold it, then deliberately rebuilt as a lean seven-figure online business. She is a Telstra Australian Young Business Woman of the Year, author of Million Dollar Micro Business, and host of the Her Empire Builder Show. She teaches this exact method inside her community.'},
 {t:'normal',k:'Her Empire Builder',title:'The room where women build the micro business version.',body:'Her Empire Builder is the membership and community where women course creators build lean, profitable businesses with this method. The frameworks, the templates, and the support to grow by stage, so the next level of revenue does not have to cost you the next level of your life.'},
 {t:'cta',title:'Ready to build the lean version of your business?',chips:['Join Her Empire Builder','Explore the Empress Circle mastermind'],disc:'Educational content for women building online-education businesses. No income or business result is guaranteed. Results vary by person, market, offer, and effort.'},
];

const deck=document.getElementById('deck');
function crown(kind){return `<svg class="crown ${kind==='title'?'title-crown':'corner-crown'}"><use href="#crown"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Her <b>Empire Builder</b> &middot; Tina Tower</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.crown) h+=crown(s.crown);
  else if(s.t==='title') h+=crown('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
