<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shadow Behind the Success - Hearts Unleashed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#201f24;        /* darkened from her dominant charcoal #2a2a2a */
    --panel:#2a2a2a;     /* her charcoal, verbatim */
    --rule:#3a3a42;      /* hairline */
    --ink:#f2f0ec;       /* warm off-white */
    --muted:#a9a6b0;     /* muted lavender-grey */
    --accent:#2e91fc;    /* her exact site button blue (brand.json) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:44px 24px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:52px 54px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:54px;top:40px;width:46px;height:2px;background:var(--accent);opacity:.9}
  .num{position:absolute;right:30px;top:28px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:26px 0 18px;font-weight:600}
  h1{font-family:'Bitter',Georgia,serif;font-weight:700;font-size:52px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:'Bitter',Georgia,serif;font-weight:600;font-size:38px;line-height:1.12;margin-bottom:18px}
  h3{font-family:'Bitter',Georgia,serif;font-weight:600;font-size:26px;margin-bottom:10px}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:40ch}
  p.lead{font-size:23px;color:var(--ink)}
  p.sub{color:var(--muted);font-size:19px;margin-top:16px}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 26px;border-bottom:1px solid var(--rule);position:relative;max-width:46ch}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:22px;width:10px;height:2px;background:var(--accent)}
  .big{font-family:'Bitter',Georgia,serif;font-size:60px;line-height:1.04;letter-spacing:-.015em}
  .quote{font-family:'Bitter',Georgia,serif;font-style:italic;font-size:40px;line-height:1.2}
  .kick{color:var(--accent)}
  .foot{color:var(--muted);font-size:14px;margin-top:30px;max-width:60ch;line-height:1.5}
  .cta-row{margin-top:26px}
  .btn{display:inline-block;background:var(--accent);color:#06121f;font-weight:600;font-size:18px;padding:15px 30px;border-radius:9px;text-decoration:none}
  .brandline{position:absolute;left:54px;bottom:30px;font-size:13px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A Live Masterclass with Abigail Gazda', h:'The Shadow Behind the Success', sub:'Why high achievers who have done all the inner work still feel stuck, and the integration that finally frees them.'},

  {t:'who', eyebrow:'Who this is for', h:'You are not starting from zero.', lead:'You have built the career, the clarity, the vocabulary. You have read the books and done the courses.', sub:'And still there is a quiet distance between the life you have and the life you can feel is possible. This hour is for that gap.'},

  {t:'point', eyebrow:'The trap', h:'More mindset work is not the answer.', body:'You keep reaching for another framework, another morning routine, another affirmation. It helps for a week. Then the same pattern returns, right on schedule. The problem was never that you did not know enough.'},

  {t:'reframe', eyebrow:'The reframe', big:'You are not sabotaging your success. A disowned part of you is protecting you.', sub:'The thing you call self-sabotage is a strategy that once kept you safe. It is still running. Fighting it harder only makes it louder.'},

  {t:'section', eyebrow:'Part One', h:'The core problem', sub:'As within, so without.'},

  {t:'point', eyebrow:'Part One', h:'The surface and the source.', body:'Every external result sits on top of an internal agreement about who you are allowed to be. Change the behavior without changing the agreement and the old self quietly pulls it back. This is why willpower expires.'},

  {t:'list', eyebrow:'Part One', h:'Where the agreements hide', items:['Fears you have learned to call realism','Insecurities you have learned to call standards','Resentments you have filed away as moving on','Desires you have talked yourself out of wanting']},

  {t:'point', eyebrow:'Part One', h:'The emotional prison.', body:'When those parts stay disowned, your energy goes into managing them instead of living. That is the ceiling. Not your strategy, not your market, not your discipline. The unfelt, unintegrated material underneath.'},

  {t:'section', eyebrow:'Part Two', h:'The 8 Pillars of Empowerment', sub:'The shadow integration path from surviving to thriving.'},

  {t:'point', eyebrow:'Part Two', h:'Integration, not elimination.', body:'You do not conquer the shadow. You meet it, understand what it protects, and bring it back into the whole. An integrated part stops running the show from the dark and starts adding its power to yours.'},

  {t:'list', eyebrow:'Part Two', h:'What the work moves through', items:['Awareness: see the pattern without judging it','Ownership: claim the part instead of exiling it','Understanding: learn what it was protecting','Release: let the old agreement expire','Re-agreement: write who you are now']},

  {t:'point', eyebrow:'Part Two', h:'A new agreement reality.', body:'Once the old agreement expires you are free to make a new one on purpose. Not a goal you chase, a reality you decide is true and then live from. External change stops being a fight because the source has already moved.'},

  {t:'point', eyebrow:'Part Two', h:'From dreaming to doing.', body:'This is where clarity turns into action. Not because you forced yourself, but because there is no longer a hidden part voting against you. Doing gets quiet and consistent when the inside is no longer at war.'},

  {t:'section', eyebrow:'Part Three', h:'What changes when the parts are whole', sub:'Empowered leadership, inside out.'},

  {t:'list', eyebrow:'Part Three', h:'When the parts are whole', items:['You lead from wholeness instead of performance','The same triggers lose their grip','You stop leaking energy into self-management','What you want and what you do finally agree']},

  {t:'credibility', eyebrow:'Why me', h:'Abigail Gazda', body:'Clarity coach, author, and shadow integration specialist. Founder of Hearts Unleashed, a personal and professional development company, and host of the Hearts Unleashed podcast with over 450 episodes since 2018.', sub:'My work exists to help self-development seekers operate with full freedom, power, and self-expression in every area of life.'},

  {t:'point', eyebrow:'The invitation', h:'This hour was the map. UNLEASHED is the terrain.', body:'In UNLEASHED we walk the 8 Pillars together over twelve weeks, one on one, so the integration actually lands in your real life and not just your notes. The masterclass showed you the what. The program is the how, with me beside you.'},

  {t:'cta', eyebrow:'Your next step', h:'Come do the work that lasts.', body:'If today named something true, take the next step while it is still alive in you.', btn:'Explore UNLEASHED with Abigail', brand:'Hearts Unleashed', disc:'Educational content only. No result is guaranteed and no income is implied. Results vary and depend on your own effort and circumstances.'},
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.eyebrow) inner += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if (s.t === 'title') {
    inner += '<h1>'+s.h+'</h1>';
    if (s.sub) inner += '<p class="sub" style="font-size:22px;max-width:54ch">'+s.sub+'</p>';
  } else if (s.t === 'reframe') {
    inner += '<div class="big">'+s.big+'</div>';
    if (s.sub) inner += '<p class="sub">'+s.sub+'</p>';
  } else if (s.t === 'section') {
    inner += '<h2 style="font-size:46px">'+s.h+'</h2>';
    if (s.sub) inner += '<p class="quote kick">'+s.sub+'</p>';
  } else if (s.t === 'list') {
    inner += '<h2>'+s.h+'</h2><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  } else if (s.t === 'who') {
    inner += '<h2>'+s.h+'</h2>';
    if (s.lead) inner += '<p class="lead">'+s.lead+'</p>';
    if (s.sub) inner += '<p class="sub">'+s.sub+'</p>';
  } else if (s.t === 'credibility') {
    inner += '<h2>'+s.h+'</h2><p>'+s.body+'</p>';
    if (s.sub) inner += '<p class="sub">'+s.sub+'</p>';
  } else if (s.t === 'cta') {
    inner += '<h2 style="font-size:44px">'+s.h+'</h2><p class="lead">'+s.body+'</p>';
    inner += '<div class="cta-row"><a class="btn" href="#">'+s.btn+'</a></div>';
    inner += '<p class="foot">'+s.disc+'</p>';
    if (s.brand) inner += '<div class="brandline">'+s.brand+'</div>';
  } else {
    if (s.h) inner += '<h2>'+s.h+'</h2>';
    if (s.body) inner += '<p>'+s.body+'</p>';
    if (s.sub) inner += '<p class="sub">'+s.sub+'</p>';
  }
  inner += '<div class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</div>';
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
