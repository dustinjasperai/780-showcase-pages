<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Modern Mystic's Path | Emily the Mystic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241f18;        /* deep warm brown-black, from brand dominant #2b241c */
    --panel:#2f2a22;     /* lifted brown panel */
    --rule:#b09777;      /* warm tan, brand 3rd-ranked hex */
    --accent:#9e804e;    /* antique gold, brand 4th-ranked hex */
    --text:#f3efe8;      /* warm cream, from brand #f9f7f4 */
    --muted:#c9bfae;
    --display:"Cinzel",Georgia,serif;
    --body:"Raleway",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-weight:300;line-height:1.5}
  .deck{max-width:960px;margin:0 auto}
  .slide{min-height:88vh;padding:72px 64px;display:flex;flex-direction:column;justify-content:center;
    border-bottom:1px solid rgba(176,151,119,.18);position:relative}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.28em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:600;font-size:54px;line-height:1.08;letter-spacing:.02em}
  h2{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.14;margin-bottom:22px;letter-spacing:.01em}
  .sub{font-family:var(--body);font-style:italic;font-weight:400;font-size:24px;color:var(--muted);margin-top:24px;max-width:42ch}
  p{font-size:19px;color:var(--text);max-width:46ch;margin-top:16px}
  p.lead{font-size:22px;color:var(--muted);max-width:44ch}
  .portal{width:64px;height:1px;background:var(--rule);margin:30px 0}
  ul{list-style:none;margin-top:24px;max-width:52ch}
  li{position:relative;padding-left:30px;margin:16px 0;font-size:19px;color:var(--text)}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border:1px solid var(--accent);
    transform:rotate(45deg)}
  .big{font-family:var(--display);font-weight:500;font-size:34px;line-height:1.22;max-width:30ch;color:var(--text);letter-spacing:.01em}
  .frame{border:1px solid var(--rule);padding:44px 40px;max-width:40ch}
  .lvl{font-family:var(--display);font-size:30px;color:var(--accent);letter-spacing:.06em;margin-bottom:10px}
  .disc{font-size:13px;color:#9a8f7d;max-width:60ch;margin-top:28px;line-height:1.6}
  .step{font-family:var(--body);font-weight:600;letter-spacing:.04em;color:var(--accent);
    font-size:17px;margin-top:26px;border:1px solid var(--accent);display:inline-block;padding:14px 26px}
  .brandline{font-family:var(--body);font-style:italic;font-size:20px;color:var(--muted);margin-top:18px;max-width:42ch}
  .idx{position:absolute;top:30px;right:40px;font-size:12px;letter-spacing:.2em;color:#6f6553}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* The coach's masterclass. Built entirely from Emily the Mystic's own IP:
   the Emily the Mystic Methodology and her 3-level Akashic Records certification path. */
const S = [
  {t:'title', k:'A Live Masterclass with Emily the Mystic',
   h:"The Modern Mystic's Path",
   sub:'How to read the Akashic Records with clarity, confidence, and without the heaviness.',
   lead:'For old souls who already feel the gift, and are ready to finally trust it.'},

  {t:'promise', k:'What you will walk away with', h:'By the end of this hour',
   bullets:[
     'A clear picture of what the Akashic Records actually are, in plain language.',
     'Why your intuition keeps stalling, and the one shift that frees it.',
     'The modern, nervous-system-aware way to open the Records safely.',
     'What it really takes to read for yourself, and one day for others.']},

  {t:'content', k:'Who this is for', h:'You are not a beginner',
   lead:'You have felt the pull your whole life. The downloads, the knowing, the sense that there is more to you than this one timeline.',
   body:'This is for the initiated and the mission led. The ones who are done dabbling and ready to embody the gift they came here with.'},

  {t:'content', k:'The quiet trap', h:'You second-guess every message',
   lead:'You receive something clear, and a breath later your mind asks, "did I make that up?"',
   body:'You have taken the courses. You have the prayers and the protocols. And you still do not fully trust what comes through. So the gift stays a hobby instead of a calling.'},

  {t:'reframe', k:'The reframe',
   big:'The problem was never your gift. It is the heavy, fear-based way the Records have been taught.'},

  {t:'content', k:'Part One, the real problem', h:'The old model keeps you a student',
   lead:'Rigid gatekeeping. One correct prayer. Years of "you are not ready yet."',
   body:'That model treats the Records as something outside you, earned through struggle. It is designed to keep you dependent on the teacher, not to make you sovereign.'},

  {t:'content', k:'Part One', h:'Self-trust is the actual skill',
   lead:'Every tool in the world is useless if you flinch away from what you receive.',
   body:'The work is not collecting more modalities. It is building a steady, discerning channel you can rely on under pressure. That is a learnable skill, not a lucky gift.'},

  {t:'content', k:'Part Two, the method', h:'The Emily the Mystic Methodology',
   lead:'A modern method that weaves spiritual insight with psychology and neuroscience.',
   body:'I believe healing does not have to be heavy. It can be expansive, empowering, and even luxurious. The Records open cleanest in a settled nervous system, so that is where we begin.'},

  {t:'level', k:'The path, level one', lvl:'Level I', h:'The Records for the Self',
   body:'Soul history, past-life patterns, clearing the contracts and loops that keep repeating, and manifestation from alignment rather than force. You cannot guide anyone through a door you have not walked yourself.'},

  {t:'level', k:'The path, level two', lvl:'Level II', h:'The Records for Others',
   body:'How to enter another person’s Records with consent and care, the questions that unlock real guidance, and the energy work that turns a reading into a healing.'},

  {t:'level', k:'The path, level three', lvl:'Level III', h:'Advanced Akashic Knowledge',
   body:'Starseed origins and galactic connections, plus specialized sessions for relationships, health, career, and family.'},

  {t:'content', k:'The difference', h:'The layer most teachers skip',
   lead:'Galactic channeling and starseed origins are not fringe. For many old souls they are the missing piece of the story.',
   body:'When you can read the cosmic thread alongside the earthly one, the guidance finally makes sense of a life that never fit the standard mold.'},

  {t:'frame', k:'The difference',
   big:'A settled body is a clear channel. We open the Records the way a nervous system can actually hold.',
   body:'This is the trauma-informed, PSYCH-K layer. Light instead of heavy. Empowering instead of fearful.'},

  {t:'content', k:'Part Three, in practice', h:'What a reading feels like',
   lead:'You settle. You open. You ask a real question and the answer arrives, clean enough that you stop asking "did I make that up?"',
   body:'That moment of unshakable self-trust is the whole point. Everything in the method is built to get you there and keep you there.'},

  {t:'content', k:'Your guide', h:'I am Emily the Mystic',
   lead:'Akashic Records specialist, PSYCH-K practitioner, galactic channel, and spiritual mentor.',
   body:'Across thousands of hours of readings I have watched clients awaken their gifts, clear what was never theirs to carry, and step into lives of joy, freedom, and alignment. My work bridges cosmic wisdom with grounded transformation.'},

  {t:'content', k:'Proof of possibility', h:'What opens on the other side',
   lead:'Students describe the same arc again and again: clarity around their soul purpose, healing of patterns they could not name, and a quiet, steady confidence in their own knowing.',
   body:'The gift was always there. The method simply gives it a reliable door.'},

  {t:'content', k:'The path forward', h:'From intuitive to practitioner',
   lead:'For some of you this is a personal homecoming. For others it is the beginning of a calling, reading the Records for clients of your own.',
   body:'Either way, the next step is the same: learn the modern method in full, in a container built for the already-awakened.'},

  {t:'cta', k:'Step through the portal', h:'Ready to go deeper?',
   lead:'If this hour stirred something, that is the invitation. The Akashic Records Certification is the full 12-week initiation into the method: self, others, and the cosmic layer.',
   step:'Explore the Akashic Records Certification',
   brand:"Sometimes the only way out is through. Let's step through together.",
   disc:'This masterclass is for educational and spiritual-development purposes only. It is not medical, psychological, financial, or professional advice, and it is not a substitute for care from a qualified professional. Spiritual practice is personal; individual experiences and outcomes vary and are not guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'cta' ? ' cta' : '');
  let h = '<div class="idx">' + String(i+1).padStart(2,'0') + '</div>';
  if (s.k) h += '<div class="kicker">' + s.k + '</div>';
  if (s.t === 'title') { h += '<h1>' + s.h + '</h1>'; if (s.sub) h += '<div class="sub">' + s.sub + '</div>'; h += '<div class="portal"></div>'; if (s.lead) h += '<p class="lead">' + s.lead + '</p>'; }
  else if (s.t === 'reframe') { h += '<div class="big">' + s.big + '</div>'; }
  else if (s.t === 'frame') { h += '<div class="frame big">' + s.big + '</div>'; if (s.body) h += '<p>' + s.body + '</p>'; }
  else if (s.t === 'level') { if (s.lvl) h += '<div class="lvl">' + s.lvl + '</div>'; h += '<h2>' + s.h + '</h2>'; if (s.body) h += '<p class="lead">' + s.body + '</p>'; }
  else if (s.t === 'promise') { h += '<h2>' + s.h + '</h2>'; if (s.bullets){ h += '<ul>'; s.bullets.forEach(b => h += '<li>' + b + '</li>'); h += '</ul>'; } }
  else if (s.t === 'cta') { h += '<h2>' + s.h + '</h2>'; if (s.lead) h += '<p class="lead">' + s.lead + '</p>'; if (s.step) h += '<div class="step">' + s.step + '</div>'; if (s.brand) h += '<div class="brandline">' + s.brand + '</div>'; if (s.disc) h += '<p class="disc">' + s.disc + '</p>'; }
  else { if (s.h) h += '<h2>' + s.h + '</h2>'; if (s.lead) h += '<p class="lead">' + s.lead + '</p>'; if (s.body) h += '<p>' + s.body + '</p>'; }
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
