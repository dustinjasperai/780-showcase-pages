<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Present Clinician · Parish Rawlins, OT · Passion Occupational Therapy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f9f3ed; --panel:#f1e6d9; --rule:#e2d3c2;
    --acc:#987e61; --ink:#730114; --body:#574239; --dim:#a89a8c; --cream:#f6efe6;
  }
  html,body{height:100%}
  body{background:#efe4d5;font-family:'Montserrat',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe4d5}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:.004em}
  .t-title h1{font-size:6.4vw;max-width:95%;font-weight:700}
  .t-normal h1{font-size:3.9vw;max-width:92%;font-weight:600}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.36vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Cormorant Garamond',serif;font-size:2.4vw;color:var(--acc);margin-top:3.2vh;max-width:86%;line-height:1.34;font-weight:600;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.4vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#5c0410 0%,#33020a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.4vw;max-width:88%;color:var(--cream);font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#5c0410 0%,#33020a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.6vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Montserrat',sans-serif;color:#e9d8cf;font-size:1.36vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:7.5%;bottom:9%;width:17vw;opacity:.92}
  .corner-mo{right:6.5%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(115,1,20,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:10vw}.t-normal h1{font-size:6.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:5vw}.t-section h1{font-size:8.4vw}.t-dark h1{font-size:7vw}
    .t-cta h1{font-size:7.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Passion Occupational Therapy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a grounded still-point, a settling breath arc over a horizon with a fixed point, drawn in bronze -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <g fill="none" stroke="#987e61" stroke-width="2" stroke-linecap="round">
    <path d="M20 78 Q60 30 100 78" opacity="0.55"/>
    <path d="M30 78 Q60 46 90 78" opacity="0.35"/>
    <line x1="18" y1="86" x2="102" y2="86" opacity="0.7"/>
    <circle cx="60" cy="86" r="7" fill="#987e61" stroke="none" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Present Clinician',sub:'How occupational therapists deepen their clinical reasoning by learning to practise with presence, not just push harder.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You spend your days helping people reconnect with what matters. The hard part is staying fully present while you do it.',body:'You trained for years to read a person, not just a chart, and to notice the small things that change a plan. Then the caseload grew, the notes stacked up, and more of your day started running on autopilot. This hour is about pointing that same clinical attention back at how you practise.'},
 {t:'dark',title:'Your sharpest clinical reasoning does not come from doing more. It comes from being present enough to notice what the case is telling you.'},

 {t:'section',idx:'Part One',title:'How Good Clinicians Slip Into Autopilot'},
 {t:'normal',k:'The quiet drift',title:'Under a full caseload, careful reasoning slowly gives way to reflex and protocol.',body:'Every rushed handover, every back-to-back visit, every late round of notes feels unavoidable in the moment. Added together over months, they pull you toward the fastest safe answer instead of the right one for this person. The drift is rarely a decision. It accumulates.'},
 {t:'normal',k:'The first thing to go',title:'Reflection is the first casualty, and it is the very thing that made you good.',body:'When there is no space to ask what a difficult session was really telling you, each case leaves residue instead of insight. The skill that separates an experienced clinician from a great one is not seeing more clients. It is reflecting more deeply on the ones you see.'},
 {t:'dark',title:'A rushed clinician and a present clinician can see the same client and notice completely different things.'},

 {t:'section',idx:'Part Two',title:'The Elevate Approach'},
 {t:'normal',k:'Pillar one, clinical reasoning',title:'Transformative clinical reasoning for the cases that do not fit the textbook.',body:'Complex presentations, funding systems, competing priorities. Elevate builds a way to think through the hard cases with structure and confidence, so you trust your own judgment in the room rather than defaulting to whatever is quickest to justify.'},
 {t:'normal',k:'Pillar two, reflective practice',title:'Reflective practice that turns every difficult case into growth instead of residue.',body:'A repeatable way to debrief your own work, name what happened and why, and carry the lesson into the next session. Reflection stops being a form you fill in for supervision and becomes the engine that keeps your reasoning sharp year after year.'},
 {t:'normal',k:'Pillar three, mind and body',title:'Presence you can actually train, through breath, grounding, and attention.',body:'This is the part most professional development skips. Drawing on meditation, breathwork, and yoga, Elevate treats a steady mind and body as clinical equipment, not self-care on the side. When your attention is settled, you notice more, and you reason better.'},
 {t:'normal',k:'Pillar four, confidence',title:'The confidence to own your decisions and lead, not just cope.',body:'As your reasoning and reflection deepen, so does your professional confidence. You stop second-guessing sound calls, you advocate clearly for your clients, and you become the clinician colleagues quietly come to for a second opinion.'},
 {t:'dark',title:'Presence is a clinical skill. It can be trained like any other.'},

 {t:'section',idx:'Part Three',title:'What Elevated Practice Looks Like'},
 {t:'normal',k:'In the room',title:'You notice more, you reason more clearly, and the person in front of you feels it.',body:'A present clinician catches the hesitation, the offhand comment, the thing that was not on the referral. That is where the best plans come from. The work does not take longer. It simply lands, because your full attention is actually in the room.'},
 {t:'normal',k:'Beyond the caseload',title:'From carrying a caseload to leading, mentoring, and shaping a career you chose.',body:'Elevated practice does not stop at your own sessions. It shows up in how you supervise, how you mentor newer OTs, and how deliberately you build the career you want, rather than the one your roster happened to hand you.'},
 {t:'normal',k:'Why Parish Rawlins',title:'An occupational therapist since 2015, and a certified yoga teacher who treats presence as part of the craft.',body:'Parish has worked in community occupational therapy across the UK and Australia, led teams, and mentored fellow clinicians. As a Yoga Alliance certified teacher and the host of the Passion Occupational Therapy Podcast, she built Elevate to bring clinical reasoning and mind-body presence together, because she practises both.'},

 {t:'section',idx:'Your Next Step',title:'Elevate the Way You Practise'},
 {t:'cta',title:'Ready to practise with more presence?',body:'Book a free discovery call with Parish, or join the Elevate mentoring waitlist, to see whether it is the right next step for how you want to practise. No pressure, no obligation.',chips:['Book a discovery call','Join the Elevate waitlist'],disc:'Educational content for occupational therapists and allied health clinicians. No clinical, career, or wellbeing outcome is guaranteed. Results vary by practitioner and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Passion Occupational Therapy · <b>Elevate</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='title') h+=mo('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
