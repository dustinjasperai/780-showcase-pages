<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Founder-to-CEO Transition — Mark Josephson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7;
    --panel:#f0ebe3;
    --ink:#2c2c2c;
    --muted:#6b6b6b;
    --accent:#2b4a6f;
    --head:'Libre Caslon Display',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid #e4ded5;border-radius:14px;padding:64px 60px;margin:0 0 26px;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide.title{background:var(--panel)}
  .slide.part{background:var(--panel)}
  .slide.cta{background:var(--panel)}
  .rule{width:54px;height:3px;background:var(--accent);margin:0 0 26px;border-radius:2px}
  .k{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:20px}
  h1{font-family:var(--head);font-weight:600;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;margin-bottom:18px}
  .sub{font-size:19px;line-height:1.5;color:var(--muted);max-width:40ch}
  .big{font-family:var(--head);font-weight:500;font-size:30px;line-height:1.3;max-width:28ch}
  .big .a{color:var(--accent)}
  p.body{font-size:18px;line-height:1.62;color:var(--ink);max-width:54ch;margin-bottom:14px}
  ul{list-style:none;margin-top:10px}
  li{font-size:18px;line-height:1.5;color:var(--ink);padding:12px 0 12px 26px;border-top:1px solid #e4ded5;position:relative}
  li:before{content:"";position:absolute;left:0;top:19px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .quote{font-family:var(--head);font-style:italic;font-size:26px;line-height:1.4;color:var(--ink);max-width:30ch}
  .pillar{font-family:var(--head);font-size:60px;font-weight:600;color:var(--accent);line-height:1;margin-bottom:22px}
  .foot{position:absolute;bottom:22px;left:60px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .page{position:absolute;bottom:22px;right:60px;font-size:12px;color:var(--muted)}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);max-width:60ch;margin-top:22px}
  .name{font-family:var(--head);font-size:20px;color:var(--ink);margin-top:8px}
  @media(max-width:640px){.slide{padding:40px 28px;min-height:360px}h1{font-size:34px}h2{font-size:26px}.pillar{font-size:44px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', k:'A live masterclass with Mark Josephson',
   h:'The Founder-to-CEO Transition',
   sub:'How to lead with clarity, focus, and urgency through the critical moments of a venture and PE-backed scale.',
   foot:'Clarity · Focus · Urgency'},

  {t:'who', k:'Who this is for',
   h:'You scaled the company. Now it has to scale past you.',
   body:'This hour is for founders and CEOs of high-growth, venture and PE-backed companies who are moving from doing the work to leading the people who do it. If the business still routes every real decision through you, this is the room.'},

  {t:'trap', k:'The trap',
   h:'The skills that got you here are the ones slowing you down.',
   body:'You built this by being the fastest, most involved person in every room. At scale that same instinct becomes the bottleneck. The team waits on you, decisions pile up, and you confuse being busy with being in charge.'},

  {t:'reframe', k:'The hard truth',
   big:'You do not have a strategy problem. You have a <span class="a">clarity, focus, and urgency</span> problem, and they compound every week you ignore them.'},

  {t:'part', cls:'part', k:'Part one', h:'The real job changed, and nobody told you.',
   sub:'The founder does the work. The CEO makes sure the right work gets done, by the right people, at the right speed. That handoff is the whole transition.'},

  {t:'problem', k:'The core problem',
   h:'Scaling breaks on the moments, not the plan.',
   body:'Every founder has a plan. What separates the companies that make it is how the CEO leads through the critical moments: the first real layoff, the co-founder conversation, the board that has lost confidence, the fundraise, the pivot. Those moments are where clarity, focus, and urgency are won or lost.'},

  {t:'part', cls:'part', k:'Part two', h:'The operating system: Clarity, Focus, Urgency.',
   sub:'Three questions a CEO should be able to answer about the company on any given Monday. Most cannot. This is the framework I coach.'},

  {t:'pillar', k:'Pillar one', pill:'Clarity',
   quote:'Does everyone know exactly what is expected, what success looks like, who owns it, and why it matters?'},

  {t:'clarity2', k:'Clarity',
   h:'It is not what you say. It is what they hear.',
   body:'Most CEOs write a clearer prompt for ChatGPT than they do for their own team. Your job is not to communicate. Your job is to remove all doubt. If three people on your team would describe the goal three different ways, the problem is upstream of them.'},

  {t:'pillar', k:'Pillar two', pill:'Focus',
   quote:'Are you doing only the things that matter most? Every wasted second is lost forever.'},

  {t:'focus2', k:'Focus',
   h:'Leadership at scale is subtraction.',
   body:'The failure mode of a smart, capable founder is doing twelve things adequately instead of the three that matter superbly. Focus is the discipline of deciding what you will not do, and protecting the team from the rest. What you tolerate, you teach.'},

  {t:'pillar', k:'Pillar three', pill:'Urgency',
   quote:'Speed is a strategy, and time is not our friend. Are you moving as fast as possible with true urgency?'},

  {t:'urgency2', k:'Urgency',
   h:'Speed is a choice you make on purpose.',
   body:'Urgency is not working more hours or thrashing the team. It is a rhythm: decide fast on the reversible calls, protect the time for the few that are not, and never let a hard decision sit because it is uncomfortable. The companies that win move while others deliberate.'},

  {t:'part', cls:'part', k:'Part three', h:'The work when it actually counts.',
   sub:'Theory is cheap in a critical moment. Here is the shape of the coaching when the decision is real and the clock is running.'},

  {t:'moment', k:'A critical moment',
   h:'The decision you are avoiding is the one that matters.',
   body:'Take the co-founder conversation every founder puts off. Clarity names the real issue instead of talking around it. Focus decides what the relationship needs to be, not what is comfortable. Urgency has the conversation this week, not next quarter. Same three questions, every time.'},

  {t:'whyme', k:'Why me',
   h:'I have sat in your chair. Three times.',
   list:['Three companies built and led to exit: Bitly, Outside.in, and Castiron',
         'Thirty years inside venture and PE-backed companies, through the raises, the transitions, the hiring and the firing',
         'A 91% CEO approval rating, and the Critical Moments podcast on the decisions that define leaders'],
   foot:'Mark Josephson'},

  {t:'diff', k:'How I coach',
   h:'Three things you should expect from me.',
   list:['I care deeply. I am unconditionally in your corner.',
         'I have done the job, so you get lived experience, not theory.',
         'I will tell you what I actually think, not ask you another question.']},

  {t:'recap', k:'The operating system',
   h:'Clarity. Focus. Urgency.',
   body:'Remove all doubt. Do only what matters most. Move with true urgency. Run the company through those three questions, especially in the moments that scare you, and the founder-to-CEO transition stops being a crisis and starts being a practice.'},

  {t:'cta', cls:'cta', k:'Start the conversation',
   h:'Let us talk about where you are, and where you want to go.',
   sub:'If you are a founder or CEO scaling a venture or PE-backed company and this is the work in front of you, start a conversation with me. We will look at the critical moment you are in and what leading through it would take.',
   name:'Mark Josephson · Executive Coach for Founders & CEOs · markjosephson.net',
   disc:'This masterclass is educational. No income, outcome, role, or business result is guaranteed, and results vary by company and leader. Nothing here is investment, legal, or financial advice.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  let h = '';
  if (s.k) h += '<div class="k">' + s.k + '</div>';
  if (s.cls === 'title' || s.cls === 'part' || s.cls === 'cta') h += '<div class="rule"></div>';
  if (s.pill) h += '<div class="pillar">' + s.pill + '</div>';
  if (s.h) h += '<h1>' + s.h + '</h1>';
  if (s.big) h += '<div class="big">' + s.big + '</div>';
  if (s.quote) h += '<div class="quote">' + s.quote + '</div>';
  if (s.sub) h += '<div class="sub">' + s.sub + '</div>';
  if (s.body) h += '<p class="body">' + s.body + '</p>';
  if (s.list) { h += '<ul>'; s.list.forEach(x => h += '<li>' + x + '</li>'); h += '</ul>'; }
  if (s.name) h += '<div class="name">' + s.name + '</div>';
  if (s.disc) h += '<div class="disc">' + s.disc + '</div>';
  if (s.foot) h += '<div class="foot">' + s.foot + '</div>';
  h += '<div class="page">' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
