<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Friends, Get Clients - A Live Masterclass with Rob Riker</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ed;      /* their warm cream ground (brand.json dominant bg) */
    --panel:#ffffff;
    --panel2:#efe9dc;  /* deeper cream from the same family */
    --ink:#17241f;     /* their forest-green ink (brand.json #17241f) */
    --muted:#55615a;
    --accent:#ff7a00;  /* their orange CTA/button (brand.json #ff7a00) */
    --rule:#17241f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel2);color:var(--ink);font-family:'Sora',system-ui,sans-serif;line-height:1.5}
  .deckwrap{max-width:960px;margin:0 auto;padding:28px 18px 60px}
  .slide{background:var(--bg);border:1px solid rgba(23,36,31,.12);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(23,36,31,.04)}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:'Crimson Pro',Georgia,serif;font-weight:700;font-size:46px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:34px;line-height:1.14;
    margin-bottom:16px}
  .promise{font-size:20px;color:var(--muted);max-width:40ch}
  .body{font-size:19px;color:var(--ink);max-width:56ch;margin-top:6px}
  .body + .body{margin-top:14px}
  ul{list-style:none;margin-top:18px;max-width:58ch}
  li{position:relative;padding-left:30px;font-size:19px;margin-bottom:14px}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .big{font-family:'Crimson Pro',Georgia,serif;font-size:40px;font-weight:600;line-height:1.1;
    max-width:24ch}
  .part-num{font-family:'Crimson Pro',Georgia,serif;font-size:72px;font-weight:700;color:var(--accent);
    line-height:1;margin-bottom:10px}
  .pillrow{display:flex;gap:16px;margin-top:22px;flex-wrap:wrap}
  .pill{flex:1 1 180px;background:var(--panel);border:1px solid rgba(23,36,31,.12);border-radius:10px;
    padding:20px}
  .pill .n{font-family:'Crimson Pro',serif;font-size:22px;color:var(--accent);font-weight:700}
  .pill .t{font-weight:600;margin:6px 0 4px;font-size:17px}
  .pill .d{color:var(--muted);font-size:15px}
  .foot{margin-top:auto;padding-top:26px;font-size:14px;color:var(--muted);
    border-top:1px solid rgba(23,36,31,.12);display:flex;justify-content:space-between}
  .disc{font-size:14px;color:var(--muted);max-width:60ch;margin-top:18px}
  .cta-line{font-size:22px;font-weight:600;color:var(--ink);margin-top:12px}
  .accent{color:var(--accent)}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);color:var(--muted)}
</style>
</head>
<body>
<div class="deckwrap" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:"A live masterclass with Rob Riker",
    h:"Make Friends, Get Clients",
    promise:"How to turn genuine Substack relationships into paying clients, without growth hacks."},

  {t:'who', kicker:"Who this is for",
    h:"You are a serious Substack creator",
    body:"You write, coach, or consult, and you want your publication to bring you real clients and income.",
    body2:"And you are tired of being told the answer is another hook, another hack, or another posting schedule."},

  {t:'reframe', kicker:"The uncomfortable part",
    big:"Substack rewards relationships. Most creators are growing it with tactics borrowed from a platform that rewarded hooks."},

  {t:'part', num:"1", h:"The core problem",
    body:"Why growth hacks stall, and why the real lever feels so hard to pull."},

  {t:'point', kicker:"Part one",
    h:"Hacks give you reach you cannot keep",
    body:"A clever hook can spike a note. It does not build the trust that makes someone hire you.",
    body2:"On a personal platform, people follow and buy from creators they feel they actually know."},

  {t:'point', kicker:"Part one",
    h:"Adults are bad at making friends",
    body:"As kids, friendship came with built-in structure: the same faces, in the same room, again and again.",
    body2:"As adults that structure disappears, so we meet someone once, have a good chat, and never follow up. The same thing happens in your comments section."},

  {t:'part', num:"2", h:"The system",
    body:"The three pillars I take every client through, plus the frameworks underneath them."},

  {t:'framework', kicker:"The three-pillar system",
    h:"From stranger to client, in three moves",
    pills:[
      {n:"01", t:"A reason to follow", d:"Clear positioning and real personality, so the right people choose you."},
      {n:"02", t:"A growth engine", d:"A repeatable daily relationship process that compounds trust over time."},
      {n:"03", t:"Clients coming to you", d:"Enough warm touchpoints that the right readers raise their hand."}
    ]},

  {t:'list', kicker:"Pillar one",
    h:"Give the right people a reason to follow you",
    list:[
      "Position around one clear promise, not everything you could write about.",
      "Let your personality show, so the right readers feel they know you.",
      "Attract the people you can actually help, not the biggest possible crowd."
    ]},

  {t:'list', kicker:"Pillar two",
    h:"Build your relationship-driven growth engine",
    list:[
      "A simple daily process you can actually follow, run from one spreadsheet.",
      "Meet new people, deepen the ones who respond, maintain the ones who matter.",
      "Growth that compounds because trust compounds, not because a post went viral."
    ]},

  {t:'list', kicker:"Pillar three",
    h:"Get clients coming to you",
    list:[
      "Create enough real touchpoints that interested readers reach out first.",
      "Make the next step obvious for the people who are ready.",
      "Turn conversations, not cold pitches, into clients."
    ]},

  {t:'framework', kicker:"The content framework",
    h:"ONP: write to three jobs",
    pills:[
      {n:"O", t:"Offer", d:"Content that shows what you help people do and who it is for."},
      {n:"N", t:"Niche", d:"Content that attracts exactly the readers you want to serve."},
      {n:"P", t:"Personal", d:"Content that builds the trust that turns a follower into a client."}
    ]},

  {t:'framework', kicker:"The three keys",
    h:"Meet, Deepen, Maintain",
    pills:[
      {n:"1", t:"Meet", d:"Add five to ten new people every single week, on purpose."},
      {n:"2", t:"Deepen", d:"Turn comments into DMs, calls, and lives. One real talk beats months of replies."},
      {n:"3", t:"Maintain", d:"Keep showing up for the readers and members you already have."}
    ]},

  {t:'point', kicker:"The counterintuitive move",
    h:"Go small on purpose",
    body:"When a creator with ten subscribers gets one comment every few notes, and you comment on all of them, you become over half their engagement.",
    body2:"They notice. They come back. Do that with twenty or thirty creators you genuinely like, and your notes stop sitting in silence."},

  {t:'point', kicker:"The habit behind it all",
    h:"Be in the same room",
    body:"You do not win by being brilliant at small talk. You win by being a familiar face.",
    body2:"Show up in the same handful of people's comments for weeks, not days, and the relationships build themselves."},

  {t:'part', num:"3", h:"The daily practice",
    body:"The daily practice, and why this is the way I built my own business."},

  {t:'point', kicker:"Part three",
    h:"A process, not a personality trait",
    body:"This is not about being an extrovert. It is a short daily routine: meet a few new people, deepen a few relationships, maintain the ones that matter.",
    body2:"When a publication's growth stalls, one of those three has almost always quietly dropped off."},

  {t:'why', kicker:"Why me",
    h:"I rebuilt everything on this",
    body:"I built coaching businesses on Twitter, watched the platform change under my feet, and rebuilt on Substack around the one skill I care about most: building real relationships.",
    body2:"It is what let me leave my nine to five, and it is the whole of what I teach in Make Friends Get Clients."},

  {t:'cta', kicker:"Your next step",
    h:"Let's build your relationship engine",
    ctaline:"Book a Make Friends Get Clients fit call and we will map your path to clients together.",
    disc:"Educational only. No income, role, or result is guaranteed. Results vary and depend on your own effort, audience, and market."}
];

const wrap = document.getElementById('deck');
function esc(x){return x||""}
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide';
  let h="";
  if(s.kicker) h+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.t==='title'){ h+=`<h1>${esc(s.h)}</h1><p class="promise">${esc(s.promise)}</p>`; }
  else if(s.t==='reframe'){ h+=`<p class="big">${esc(s.big)}</p>`; }
  else if(s.t==='part'){ h+=`<div class="part-num">${esc(s.num)}</div><h2>${esc(s.h)}</h2><p class="body">${esc(s.body)}</p>`; }
  else if(s.t==='framework'){
    h+=`<h2>${esc(s.h)}</h2><div class="pillrow">`;
    (s.pills||[]).forEach(p=>{h+=`<div class="pill"><div class="n">${esc(p.n)}</div><div class="t">${esc(p.t)}</div><div class="d">${esc(p.d)}</div></div>`;});
    h+=`</div>`;
  }
  else if(s.t==='list'){
    h+=`<h2>${esc(s.h)}</h2><ul>`;
    (s.list||[]).forEach(li=>{h+=`<li>${esc(li)}</li>`;});
    h+=`</ul>`;
  }
  else if(s.t==='cta'){
    h+=`<h2>${esc(s.h)}</h2><p class="cta-line">${esc(s.ctaline)}</p><p class="disc">${esc(s.disc)}</p>`;
  }
  else { /* who, point, why */
    h+=`<h2>${esc(s.h)}</h2>`;
    if(s.body) h+=`<p class="body">${esc(s.body)}</p>`;
    if(s.body2) h+=`<p class="body">${esc(s.body2)}</p>`;
  }
  h+=`<div class="foot"><span>The Creator's Edge</span><span>Rob Riker</span></div>`;
  d.innerHTML=h;
  wrap.appendChild(d);
});
</script>
</body>
</html>
