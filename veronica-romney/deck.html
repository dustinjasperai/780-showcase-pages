<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rainmaker Method — Veronica Romney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7;        /* cream ground, from her book cover */
    --panel:#16233f;     /* deep navy ink/panel */
    --rule:#bd9a4e;      /* warm gold accent */
    --ink:#1b2436;
    --muted:#5c5a52;
    --cream:#f6f1e7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--cream);border:1px solid rgba(22,35,63,.12);border-radius:10px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(22,35,63,.04)}
  .slide.dark{background:var(--panel);color:var(--cream);border-color:transparent}
  .slide.dark .muted{color:#c9c4b4}
  .kicker{font-family:'Barlow';font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--rule);margin-bottom:18px}
  h1{font-family:'Libre Baskerville',serif;font-weight:700;font-size:46px;line-height:1.12;letter-spacing:-.01em}
  h2{font-family:'Libre Baskerville',serif;font-weight:700;font-size:34px;line-height:1.16;margin-bottom:8px}
  .lead{font-size:22px;line-height:1.5;margin-top:18px;max-width:40ch}
  p{font-size:19px;line-height:1.6;margin-top:14px;color:var(--ink)}
  .slide.dark p{color:#e9e4d6}
  .goldrule{height:3px;width:72px;background:var(--rule);margin:22px 0 4px;border-radius:2px}
  ul{margin:20px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-top:1px solid rgba(22,35,63,.1)}
  .slide.dark li{border-top-color:rgba(255,255,255,.14)}
  li:before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;background:var(--rule);border-radius:50%}
  .pillar-num{font-family:'Libre Baskerville',serif;font-size:15px;color:var(--rule);font-weight:700;letter-spacing:.12em}
  .big{font-size:30px;line-height:1.3;font-family:'Libre Baskerville',serif}
  .cols{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap}
  .col{flex:1;min-width:220px;background:rgba(22,35,63,.04);border-radius:8px;padding:22px 22px}
  .slide.dark .col{background:rgba(255,255,255,.06)}
  .col h3{font-family:'Libre Baskerville',serif;font-size:21px;margin-bottom:6px}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;margin-top:26px;max-width:62ch}
  .slide.dark .disc{color:#b9b3a2}
  .cta-steps{font-size:20px;line-height:1.5;margin-top:18px}
  .pg{font-size:12px;color:var(--rule);letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;font-weight:600}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'dark', html:`
    <div class="pg">The Rainmaker Method</div>
    <h1>Turn Your Top Marketer Into a Rainmaker</h1>
    <p class="lead">How visionary founders build a marketing leader who owns revenue, so the company grows without the CEO stuck in the weeds.</p>
    <div class="goldrule"></div>
    <p class="muted">A masterclass with Veronica Romney, creator of the Rainmaker Residency.</p>
  `},
  {t:'who', html:`
    <div class="kicker">Who this is for</div>
    <h2>The 7-figure founder who is still the only rainmaker</h2>
    <p>You are the face, the vision, and the talent. You are also the only person in the building who wakes up thinking about where the next dollar comes from.</p>
    <p>You have a team of capable people. You still feel like everyone is waiting to be told what to do next.</p>
  `},
  {t:'trap', html:`
    <div class="kicker">The trap</div>
    <h2>An org chart full of doers</h2>
    <p>Your employees, contractors, and vendors are excellent in their zone of genius. But at the end of the week they are looking at their task board, not your bottom line.</p>
    <p>That is not their fault. It was never in their job description to own growth. So the mantle of revenue stays exactly where it has always been. On you.</p>
  `},
  {t:'reframe', cls:'dark', html:`
    <div class="kicker">The reframe</div>
    <h1>If everyone on the team is a doer, who is the rainmaker?</h1>
    <p class="lead">Until someone other than you is accountable for generating revenue, you do not have a company that scales. You have a job you cannot leave.</p>
  `},
  {t:'part', html:`
    <div class="pillar-num">PART ONE</div>
    <h2>The core problem: doers versus rainmakers</h2>
    <div class="goldrule"></div>
    <p>Most founders try to fix a revenue problem by hiring more doers. More hands on more tasks. The real gap is a layer of leadership that nobody hired for.</p>
  `},
  {t:'contrast', html:`
    <div class="kicker">The distinction</div>
    <h2>A doer executes. A rainmaker leads.</h2>
    <div class="cols">
      <div class="col"><h3>The Doer</h3><p>Runs the ads, posts the content, ships the task on the board. Measures the day by what got done.</p></div>
      <div class="col"><h3>The Rainmaker</h3><p>The strategic mother hen. Directs the execution team, holds vendors accountable, and owns prospect growth and revenue.</p></div>
    </div>
  `},
  {t:'cost', html:`
    <div class="kicker">The cost of staying stuck</div>
    <h2>Reactive, month to month, and always on you</h2>
    <p>With no rainmaker, marketing runs on whatever felt urgent this month. The founder gets pulled back into the content factory. Burnout follows, and growth stays capped at the founder's personal bandwidth.</p>
  `},
  {t:'part', cls:'dark', html:`
    <div class="pillar-num">PART TWO</div>
    <h2>The Fortune 5: five pillars of a rainmaking marketing leader</h2>
    <div class="goldrule"></div>
    <p class="lead">These are the five places friction shows up between a CEO and the marketer who is ready to lead. Fix all five and the handoff holds.</p>
  `},
  {t:'pillar', html:`
    <div class="pillar-num">PILLAR ONE</div>
    <h2>The Marketing Leadership Role</h2>
    <div class="goldrule"></div>
    <p>Define what marketing leadership actually means in your company, so the role is a seat with authority and ownership, not a senior to-do list.</p>
  `},
  {t:'pillar', html:`
    <div class="pillar-num">PILLAR TWO</div>
    <h2>Team Management</h2>
    <div class="goldrule"></div>
    <p>The rainmaker learns to manage the doers, so you do not have to. Vendors, contractors, and specialists report to a leader who is not you.</p>
  `},
  {t:'pillar', html:`
    <div class="pillar-num">PILLAR THREE</div>
    <h2>The Content Factory</h2>
    <div class="goldrule"></div>
    <p>Hand off the relentless content machine. The visionary stays the face and the voice without personally feeding every channel every week.</p>
  `},
  {t:'pillar', html:`
    <div class="pillar-num">PILLAR FOUR</div>
    <h2>Revenue-Generating Activities</h2>
    <div class="goldrule"></div>
    <p>A rainmaker does not just make noise. They orchestrate the launches, promotions, and events that produce actual sales, and they own the number.</p>
  `},
  {t:'pillar', html:`
    <div class="pillar-num">PILLAR FIVE</div>
    <h2>The Strategic Roadmap</h2>
    <div class="goldrule"></div>
    <p>Trade reactive monthly scrambling for a 12-month marketing vision. The rainmaker plans forward so the business is building, not just reacting.</p>
  `},
  {t:'handoff', cls:'dark', html:`
    <div class="kicker">The dual handoff</div>
    <h2>Two people have to change at once</h2>
    <p>The CEO has to let it go, Elsa style, releasing decisions they have owned for years. The rainmaker has to receive that handoff without triggering the founder, honoring the spontaneous ideas while protecting the team's bandwidth.</p>
    <p>Train only one side and the handoff snaps back. That is why the method trains both.</p>
  `},
  {t:'picture', html:`
    <div class="kicker">After the handoff</div>
    <h2>A company that grows when you step back</h2>
    <ul>
      <li>Revenue has an owner who is not the founder.</li>
      <li>The team runs to a 12-month plan, not this week's fire.</li>
      <li>The founder leads from the front as the face and the vision.</li>
      <li>Marketing becomes a system, not a personality.</li>
    </ul>
  `},
  {t:'whyme', html:`
    <div class="kicker">Why listen to me</div>
    <h2>I have built the rainmaker seat from every angle</h2>
    <p>Nearly 20 years in marketing: corporate marketer, founder of my own agency, Speaker and Trainer for Tony Robbins and Dean Graziosi, Chief of Staff at bossbabe, and Director of Marketing Suite Products for a software company valued near 2 billion dollars.</p>
    <p>I have been the doer, the rainmaker, and the person teaching both. The Rainmaker Residency is where I put all of it.</p>
  `},
  {t:'program', cls:'dark', html:`
    <div class="kicker">Where this goes next</div>
    <h2>The Rainmaker Residency</h2>
    <p>A leadership-development container for visionary CEOs and the marketing leaders they want to elevate. MBA-level curriculum, mastermind peer support, individual coaching, and in-person retreats where isolated rainmakers finally find their people.</p>
    <p class="big">Marketing leaders that stick are not just hired. They are trained.</p>
  `},
  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next step</div>
    <h1>Ready to build your rainmaker?</h1>
    <p class="cta-steps">If you are ready to stop being the only person responsible for revenue, take the Scale Factor Assessment and explore the Rainmaker Residency at rainmakerresidency.com.</p>
    <div class="goldrule"></div>
    <p class="disc">Educational content only. Nothing here is a promise of income, revenue, hiring, or business results, and no outcome is guaranteed. Results vary and depend on your own business, market, team, and effort.</p>
  `}
];
const deck = document.getElementById('deck');
S.forEach(s => {
  const d = document.createElement('section');
  d.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  d.innerHTML = s.html;
  deck.appendChild(d);
});
</script>
</body>
</html>
