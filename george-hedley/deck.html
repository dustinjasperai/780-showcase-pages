<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The BIZ-BUILDER BLUEPRINT Masterclass · George Hedley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f3e9; --panel:#ffffff; --rule:#ddd3ba;
    --acc:#ff5c26; --idx:#0c4da2; --chalk:#262320; --grey:#55503f; --dim:#8a8370;
  }
  html,body{height:100%}
  body{background:#2a261f;font-family:'Open Sans',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2a261f}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',Georgia,serif;font-weight:600;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.9vw;max-width:88%}
  .t-normal h1{font-size:3.1vw;max-width:84%}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-family:'Open Sans',sans-serif;font-size:1.75vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:linear-gradient(160deg,#332b1f 0%,#1c1811 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:86%;font-style:italic;color:#f7f3e9}
  .t-cta{background:linear-gradient(160deg,#332b1f 0%,#1c1811 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:82%;color:#f7f3e9}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#ffcba8;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .t-dark .disc,.t-cta .disc{color:#a49c86}
  .blueprint-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-blueprint{right:6.5%;bottom:7%;width:21vw}
  .corner-blueprint{right:5.5%;bottom:6.5%;width:9.5vw;opacity:.4}
  .brandline{font-family:'Open Sans',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#c9c2a8;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c9c2a8;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#c9c2a8;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">HardHat BIZCOACH</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- blueprint motif: a plan-view corner mark, crosshair + dimension ticks, echoing a construction drawing's title block -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="blueprint" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="232" height="122" stroke="#0c4da2" opacity="0.28"/>
    <line x1="14" y1="75" x2="246" y2="75" stroke="#0c4da2" opacity="0.18"/>
    <line x1="130" y1="14" x2="130" y2="136" stroke="#0c4da2" opacity="0.18"/>
    <line x1="34" y1="118" x2="120" y2="118" stroke="#ff5c26" opacity="0.75"/>
    <line x1="34" y1="112" x2="34" y2="124" stroke="#ff5c26" opacity="0.75"/>
    <line x1="120" y1="112" x2="120" y2="124" stroke="#ff5c26" opacity="0.75"/>
    <circle cx="184" cy="46" r="16" stroke="#ff5c26" opacity="0.9"/>
    <line x1="168" y1="46" x2="200" y2="46" stroke="#ff5c26" opacity="0.9"/>
    <line x1="184" y1="30" x2="184" y2="62" stroke="#ff5c26" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The BIZ-BUILDER BLUEPRINT Masterclass',sub:'A masterclass for owners of general contracting, remodeling, and custom home-building firms.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You can build almost anything. The business side is a different trade.',body:'Bidding, crews, schedules, punch lists. None of that teaches you how to run the numbers behind the jobs, or turn a good year into a plan for the next one.'},
 {t:'dark',title:'Being great at building does not make you great at running the business.'},

 {t:'section',idx:'Part One',title:'The Trap'},
 {t:'normal',k:'The gut-feel trap',title:'Most contracting businesses run on instinct instead of a written plan.',body:'Nobody hands a contractor a business plan template on day one. Most owners run the business the way they run a job: react to what is in front of them, and hope the numbers work out at the end of the year.'},
 {t:'normal',k:'The cost of no plan',title:'Every job without a real number behind it quietly eats your margin.',body:'A busy schedule can hide a business that is losing money on half its jobs. Without a plan and the numbers to run it against, busy and profitable are two different things.'},
 {t:'dark',title:'A full schedule does not protect you from a business that is quietly losing money.'},

 {t:'section',idx:'Part Two',title:'The BIZ-BUILDER BLUEPRINT'},
 {t:'normal',k:'Know the numbers',title:'The 12-Step Formula: the specific numbers that always make a profit.',body:'A step-by-step formula for the numbers a contracting business has to track, job by job, to protect margin before it disappears. Not theory. The same numbers, checked the same way, every time.'},
 {t:'normal',k:'Write the plan',title:'The BIZ-BUILDER BLUEPRINT: a business plan you actually fill in.',body:'A business plan template with a built-in Excel spreadsheet. You put in your numbers, your goals, and your systems, and the Blueprint turns them into a real, written plan instead of an idea in your head.'},
 {t:'normal',k:'Keep the accountability',title:'BIZGroup: a peer mastermind that keeps the plan on track.',body:'A recurring, structured mastermind of contracting-business owners working the same plan, comparing notes, and holding each other to it, separate from 1:1 coaching.'},
 {t:'dark',title:'A plan you write once and never open again is not a plan. It is a document.'},

 {t:'section',idx:'Part Three',title:'A Business Run On A Plan'},
 {t:'normal',k:'The business this builds',title:'A contracting business that runs on a plan, not a gut feeling.',body:'Every job checked against the same 12 numbers. A written Blueprint that gets opened and updated, not filed away. A business that knows its numbers as well as it knows its trade.'},
 {t:'dark',title:'The contractors who last are not the ones who work the hardest. They are the ones who know their numbers.'},
 {t:'normal',k:'Why George Hedley',title:'Built his own construction company from $0 to $50 million, then taught it.',body:'George Hedley built his own commercial construction company from $0 to $50 million in sales in seven years before becoming a coach. Named Business Coach of the Year by the Professional Business Coaches Alliance, author of 6+ books including Turn Your Construction Business Into A Profit-Making Machine!, and has delivered 500+ speaking programs to 10,000+ contractors.'},

 {t:'section',idx:'Your Next Step',title:'Turn Your Construction Business Into A Profit-Making Machine'},
 {t:'normal',k:'Start with the consultation',title:'The free complimentary coaching consultation.',body:'A conversation about where your business stands today and what the BIZ-BUILDER BLUEPRINT and the 12-Step Formula would look like applied to it.'},
 {t:'normal',k:'Go deeper',title:'BIZSCHOOL and BIZGroup.',body:'Five workbook-backed BIZSCHOOL courses on profit, growth, sales, field systems, and team leadership, plus the BIZGroup mastermind for ongoing accountability.'},
 {t:'cta',title:'Ready to turn the business you have into a profit-making machine?',chips:['Take the free consultation','Explore BIZSCHOOL'],disc:'Educational content for general contracting, remodeling, and custom home-building business owners. No income, growth, or result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function blueprint(kind){return `<svg class="blueprint-motif ${kind==='title'?'title-blueprint':'corner-blueprint'}"><use href="#blueprint"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">HardHat BIZCOACH <b>&middot; BIZ-BUILDER BLUEPRINT</b> &middot; George Hedley</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=blueprint(s.arc);
  else if(s.t==='title') h+=blueprint('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
