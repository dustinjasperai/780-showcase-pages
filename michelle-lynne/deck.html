<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Profit Recipe — a masterclass with Michelle Lynne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2ea;        /* warm ivory ground, from brand #f2ece4 */
    --panel:#efe6d8;     /* soft oat */
    --rule:#d7c4b4;      /* taupe rule, brand #d7c4b4 */
    --ink:#363636;       /* charcoal, brand dominant */
    --accent:#c49030;    /* gold, brand H2 hex */
    --slate:#6a768a;     /* slate-blue, brand button hex */
    --muted:#7a7066;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Lato',sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 72px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:52px 56px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(54,54,54,.03)}
  .slide.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.oat{background:var(--panel)}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  .slide.dark .eyebrow{color:var(--accent)}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Playfair Display',serif;font-weight:600;font-size:38px;line-height:1.12}
  h3{font-family:'Playfair Display',serif;font-weight:600;font-size:25px;margin-bottom:6px}
  p{font-size:19px;color:var(--ink);margin-top:14px;max-width:44ch}
  .slide.dark p{color:#efe6d8}
  .lede{font-size:22px;color:var(--muted)}
  .slide.dark .lede{color:#cdbfae}
  .kicker{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:var(--slate);margin-top:10px}
  .rule{width:64px;height:3px;background:var(--accent);border:0;margin:22px 0}
  ul{margin:18px 0 0 0;list-style:none}
  li{font-size:19px;padding:12px 0 12px 42px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:0}
  li .n{position:absolute;left:0;top:11px;font-family:'Playfair Display',serif;color:var(--accent);font-weight:700;font-size:22px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:26px}
  .slide.dark .card{background:#42413f;border-color:#55524e}
  .big{font-family:'Playfair Display',serif;font-size:60px;color:var(--accent);line-height:1}
  .foot{font-size:14px;color:var(--muted);margin-top:26px;max-width:60ch}
  .tag{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700}
  .cta-btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-weight:700;padding:14px 26px;border-radius:999px;font-size:17px;letter-spacing:.02em}
  .num{font-family:'Playfair Display',serif;font-size:15px;color:var(--muted);position:absolute;top:18px;right:24px}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title'},
 {t:'promise'},
 {t:'who'},
 {t:'trap'},
 {t:'reframe'},
 {t:'part',k:'Part One',h:'The Core Problem',s:'Why talented firms stay broke.'},
 {t:'markup'},
 {t:'cost'},
 {t:'part',k:'Part Two',h:'The Recipe',s:'Three ingredients for a profitable design firm.'},
 {t:'ing1'},
 {t:'ing2'},
 {t:'ing3'},
 {t:'together'},
 {t:'part',k:'Part Three',h:'Profit, Baked In',s:'A firm that runs on a recipe, not on hope.'},
 {t:'after'},
 {t:'whyme'},
 {t:'path'},
 {t:'recap'},
 {t:'cta',disc:'Educational content only. No specific income or revenue result is guaranteed. Results vary by designer, market, effort, and execution.'}
];

const H=(o)=>{
 switch(o.t){
 case 'title': return `<div class="slide">
   <div class="eyebrow">A live masterclass &middot; The Design Bakehouse</div>
   <h1>The Profit Recipe</h1>
   <div class="kicker">How talented interior designers charge premium fees, profit on product, and keep more of every project.</div>
   <hr class="rule">
   <p class="tag">With Michelle Lynne &middot; Founder, ML Interiors Group</p></div>`;
 case 'promise': return `<div class="slide oat"><div class="eyebrow">What you'll leave with</div>
   <h2>Three shifts, one recipe.</h2>
   <ul><li><span class="n">1</span>A way to attract clients who value premium work, so you stop competing on price.</li>
   <li><span class="n">2</span>The design-fee math that ends the markup myth and pays you properly.</li>
   <li><span class="n">3</span>A project system that stops the endless-revision time drain.</li></ul></div>`;
 case 'who': return `<div class="slide"><div class="eyebrow">Who this is for</div>
   <h2>The talented designer who is booked, but not profitable.</h2>
   <p>You do beautiful work. The projects keep coming. And yet the bank account never seems to reflect the talent or the hours. This is for you.</p></div>`;
 case 'trap': return `<div class="slide"><div class="eyebrow">The trap</div>
   <h2>You can book a $40,000 project and still be broke at month-end.</h2>
   <p>Most designers respond by taking on more work. More projects, more revisions, more hours, and the same thin margin. The treadmill speeds up. The profit doesn't.</p></div>`;
 case 'reframe': return `<div class="slide dark"><div class="eyebrow">The real problem</div>
   <h2>It isn't your talent. It isn't your pipeline. It's your money model.</h2>
   <p>Profit in a design firm isn't an accident, and it isn't a volume problem. It's a pricing-and-process problem. Fix the model and the same projects pay very differently.</p></div>`;
 case 'part': return `<div class="slide oat"><div class="eyebrow">${o.k}</div><h1>${o.h}</h1><div class="kicker">${o.s}</div></div>`;
 case 'markup': return `<div class="slide"><div class="eyebrow">The markup myth</div>
   <div class="two"><div><h2>A 30% markup is not a 30% profit margin.</h2>
   <p>"Cost plus 30%" feels like profit. It isn't. On a $10,000 purchase, a 30% markup is $3,000 added, but as a share of the $13,000 the client pays, your margin is only about 23%, before your time, your team, and your overhead come out of it.</p></div>
   <div class="card"><div class="big">23%</div><p>The real margin hiding inside a "30% markup," before costs.</p></div></div></div>`;
 case 'cost': return `<div class="slide"><div class="eyebrow">What it costs you</div>
   <h2>Underpricing compounds.</h2>
   <p>Every project priced on the markup myth sets the ceiling for the next one. Undercharge once and you've trained the client, and yourself, to expect it. The fix is structural, not a one-time discount you make up later.</p></div>`;
 case 'ing1': return `<div class="slide"><div class="eyebrow">Ingredient One</div>
   <h2>Attract the right client.</h2>
   <p>Define a signature style and position so you draw clients who value premium design, instead of price-shoppers you have to convince. The right client makes every other ingredient easier.</p></div>`;
 case 'ing2': return `<div class="slide"><div class="eyebrow">Ingredient Two</div>
   <h2>Charge premium design fees, and profit on product.</h2>
   <p>A design-fee structure that pays you for your expertise, plus a product model that profits instead of giving the margin away. This is where the markup myth gets replaced with real numbers.</p></div>`;
 case 'ing3': return `<div class="slide"><div class="eyebrow">Ingredient Three</div>
   <h2>Run projects with precision.</h2>
   <p>Clear scope, written policies, and revision boundaries so projects stop bleeding time and margin. Streamlined projects are how a higher fee actually stays in your pocket.</p></div>`;
 case 'together': return `<div class="slide oat"><div class="eyebrow">The recipe</div>
   <h2>The three ingredients work together.</h2>
   <ul><li><span class="n">1</span>Right client makes premium pricing possible.</li>
   <li><span class="n">2</span>Premium fees and product profit set the margin.</li>
   <li><span class="n">3</span>Precise projects protect that margin to the end.</li></ul>
   <p>Pull one out and the recipe collapses. Together, the same calendar produces a very different profit.</p></div>`;
 case 'after': return `<div class="slide"><div class="eyebrow">On the other side</div>
   <h2>A firm that runs on a recipe, not on hope.</h2>
   <p>Predictable margin on every project. Clients who respect the fee. Projects that close on scope instead of dragging through revisions. The move from the five-figure cycle toward multiple six figures, without more hours.</p></div>`;
 case 'whyme': return `<div class="slide"><div class="eyebrow">Why listen to me</div>
   <div class="two"><div><h2>I still run the firm I teach from.</h2>
   <p>I'm the founder of ML Interiors Group, a seven-figure design firm in Dallas. I started it the year the market crashed. Everything in this recipe is what we actually do, not theory, and it's what I've taught hundreds of designers.</p></div>
   <div class="card"><div class="tag">ML Interiors Group</div><h3>Dallas, TX</h3><p>A working seven-figure design firm.</p></div></div></div>`;
 case 'path': return `<div class="slide oat"><div class="eyebrow">Where this goes next</div>
   <h2>The Interior Design Business Bakery.</h2>
   <p>The full recipe lives inside a twelve-month mentorship: the pricing structure, the sales process, the project system, the templates, and the specialist Master Coaches, with a community of designers doing the same work alongside you.</p></div>`;
 case 'recap': return `<div class="slide"><div class="eyebrow">Recap</div>
   <h2>Your profit recipe.</h2>
   <ul><li><span class="n">1</span>Attract the right client.</li>
   <li><span class="n">2</span>Charge premium design fees, profit on product.</li>
   <li><span class="n">3</span>Run projects with precision.</li></ul></div>`;
 case 'cta': return `<div class="slide dark"><div class="eyebrow">Your next step</div>
   <h1>Ready to bake profit in?</h1>
   <p>Join the Interior Design Business Bakery and build the recipe into your firm, with the pricing, process, and support to make it stick.</p>
   <span class="cta-btn">Join the Interior Design Business Bakery</span>
   <p class="foot">${o.disc}</p></div>`;
 }
};
document.getElementById('deck').innerHTML = S.map((o,i)=>H(o).replace('<div class="slide','<div data-n="'+(i+1)+'" class="slide')).join('');
document.querySelectorAll('.slide').forEach((el,i)=>{const s=document.createElement('div');s.className='num';s.textContent=(i+1)+' / '+S.length;el.appendChild(s);});
</script>
</body>
</html>
