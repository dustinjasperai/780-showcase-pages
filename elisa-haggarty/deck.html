<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why the problem isn't the problem — a live masterclass with Elisa Haggarty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Pontano+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f1ec; --panel:#fbf6f1; --rule:#d8cfc4; --ink:#3f3a34;
    --accent:#497579; --earth:#735b3a; --sage:#b2c3bc; --muted:#8a8178;
    --head:'Playfair Display',Georgia,serif; --body:'Pontano Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e9e0d7;color:var(--ink);font-family:var(--body);}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 18px 80px;}
  .slide{position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:64px 64px 56px;margin:0 0 22px;min-height:560px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.02);}
  .slide:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);}
  .kick{font-family:var(--body);text-transform:uppercase;letter-spacing:.22em;font-size:12px;
    font-weight:600;color:var(--accent);margin-bottom:22px;}
  h1{font-family:var(--head);font-weight:800;font-size:54px;line-height:1.04;color:var(--ink);letter-spacing:-.01em;}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.1;color:var(--ink);}
  .lead{font-size:21px;line-height:1.55;color:var(--ink);max-width:40ch;margin-top:22px;}
  .sub{font-size:17px;line-height:1.6;color:var(--muted);margin-top:16px;max-width:52ch;}
  .partnum{font-family:var(--head);font-size:19px;color:var(--earth);letter-spacing:.04em;margin-bottom:10px;}
  ul{margin:26px 0 0;padding:0;list-style:none;max-width:60ch;}
  li{position:relative;padding-left:30px;margin:0 0 18px;font-size:19px;line-height:1.5;}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;
    border:2px solid var(--accent);}
  li b{color:var(--accent);font-weight:600;}
  .big{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.12;max-width:20ch;}
  .strike{text-decoration:line-through;text-decoration-color:var(--earth);color:var(--muted);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px;}
  .cell{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:22px 24px;}
  .cell h3{font-family:var(--head);font-size:21px;color:var(--accent);margin-bottom:8px;}
  .cell p{font-size:16px;line-height:1.5;color:var(--ink);}
  .cred{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--sage);
    border-radius:8px;padding:24px 26px;margin-top:26px;}
  .cred-list{columns:2;column-gap:30px;margin-top:8px;}
  .cred-list span{display:block;font-size:15px;line-height:1.5;color:var(--ink);margin-bottom:8px;break-inside:avoid;}
  .cta-box{margin-top:30px;}
  .cta-box .line{font-size:20px;color:var(--ink);line-height:1.6;max-width:46ch;}
  .btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-weight:600;
    font-size:18px;padding:15px 30px;border-radius:999px;}
  .disc{margin-top:28px;font-size:13px;line-height:1.55;color:var(--muted);max-width:60ch;}
  .foot{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted);letter-spacing:.04em;}
  .n{position:absolute;left:64px;bottom:18px;font-size:12px;color:var(--muted);}
  @media(max-width:720px){.slide{padding:40px 28px}h1{font-size:38px}h2{font-size:28px}.grid,.cred-list{grid-template-columns:1fr;columns:1}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="kick">A live masterclass with Elisa Haggarty</div>
    <h1>Why the problem isn't the problem</h1>
    <p class="lead">A live hour on leading the consciousness beneath the issues you keep re-solving, for executives and founders ready for a different kind of work.</p>
    <p class="sub">Context over content. The School of Unlearning.</p>`},

  {t:'who', cls:'who', html:`
    <div class="kick">Who this hour is for</div>
    <h2>You are successful, and quietly sensing the old way can't take you where you need to go next.</h2>
    <ul>
      <li>You lead smart people and still watch the <b>same conflict</b> come back in a new costume.</li>
      <li>You are busy every hour and yet the real thing barely moves.</li>
      <li>You have done the frameworks, the offsites, the 360s. Something underneath is still running the show.</li>
    </ul>`},

  {t:'hook', cls:'hook', html:`
    <div class="kick">The uncomfortable reframe</div>
    <p class="big">You keep solving the <span class="strike">problem</span>. The problem was never the point.</p>
    <p class="sub">Every problem you bring to the table is content. What decides the outcome is the context underneath it: the state, the story, and the pattern you are leading from.</p>`},

  {t:'part', cls:'part', html:`
    <div class="partnum">Part One</div>
    <h2>The trap of coaching the content</h2>
    <p class="sub">Why your best problem-solving quietly keeps the problem alive.</p>`},

  {t:'body', cls:'body', html:`
    <div class="kick">Content level</div>
    <h2>The level most leaders live on</h2>
    <ul>
      <li>The proposal, the missed deadline, the tense one-on-one, the reorg. Real, visible, urgent.</li>
      <li>So you solve it. Cleanly. And you are good at it, which is exactly the trap.</li>
      <li>The content changes. The <b>pattern that produced it</b> does not, so it returns.</li>
    </ul>`},

  {t:'body', cls:'body', html:`
    <div class="kick">The hidden cost</div>
    <h2>A team can only operate at the level of its leader's consciousness</h2>
    <p class="lead">When you lead from reactivity, your team organizes around your reactivity. When you lead from curiosity, the whole room gets more oxygen. Nothing you install on top changes that.</p>`},

  {t:'part', cls:'part', html:`
    <div class="partnum">Part Two</div>
    <h2>Coaching the context beneath it</h2>
    <p class="sub">The move I make with every leader I work with. I don't coach the problem. I coach the consciousness beneath it.</p>`},

  {t:'body', cls:'body', html:`
    <div class="kick">Distinction 1</div>
    <h2>Content vs context</h2>
    <div class="grid">
      <div class="cell"><h3>Content</h3><p>What is happening: the issue, the decision, the conflict on the table.</p></div>
      <div class="cell"><h3>Context</h3><p>Who you are being while it happens: the state, the belief, the pattern driving the response.</p></div>
    </div>
    <p class="sub">Shift the context and the same content resolves differently, often on its own.</p>`},

  {t:'body', cls:'body', html:`
    <div class="kick">Distinction 2</div>
    <h2>The drama triangle running the room</h2>
    <ul>
      <li>Most workplace friction is three roles on a loop: victim, villain, hero.</li>
      <li>Leaders rescue, blame, or collapse, and call it management.</li>
      <li>Naming the triangle out loud is the first exit. From reaction to <b>radical responsibility</b>.</li>
    </ul>`},

  {t:'body', cls:'body', html:`
    <div class="kick">Distinction 3</div>
    <h2>Emotions are data, not noise</h2>
    <p class="lead">The feeling in the room is information about what is true and not yet said. Conscious leaders read it instead of managing around it, and make the undiscussable discussable.</p>`},

  {t:'body', cls:'body', html:`
    <div class="kick">Distinction 4</div>
    <h2>Above the line, or below it</h2>
    <div class="grid">
      <div class="cell"><h3>Below the line</h3><p>Closed, defensive, needing to be right. Scarcity of time, trust, and air.</p></div>
      <div class="cell"><h3>Above the line</h3><p>Open, curious, willing to be wrong. The state where real decisions get made.</p></div>
    </div>
    <p class="sub">You cannot always stay above the line. You can learn to notice the moment you drop, and choose again.</p>`},

  {t:'body', cls:'body', html:`
    <div class="kick">The core move</div>
    <h2>Leadership growth is subtractive</h2>
    <p class="lead">The old ways will not solve the new problems. The work is not another framework to add. It is unlearning the inherited belief that is quietly running you. That is The School of Unlearning.</p>`},

  {t:'part', cls:'part', html:`
    <div class="partnum">Part Three</div>
    <h2>The same week, led from context</h2>`},

  {t:'body', cls:'body', html:`
    <div class="kick">In practice</div>
    <h2>The same meeting, led from context</h2>
    <ul>
      <li>You feel the drop before you speak, and name it instead of acting from it.</li>
      <li>You ask the question under the question: what am I not seeing here?</li>
      <li>The team stops performing for you and starts telling you the truth.</li>
    </ul>`},

  {t:'body', cls:'body', html:`
    <div class="kick">What changes</div>
    <h2>Fewer fires, because fewer are being lit</h2>
    <p class="lead">When the pattern underneath shifts, the recurring problem stops regenerating. That is the difference between a leader who is busy and a leader whose presence creates room for everyone else to think.</p>`},

  {t:'why', cls:'why', html:`
    <div class="kick">Why me</div>
    <h2>Two decades coaching the inner work of leadership</h2>
    <p class="sub">I coach visionary leaders globally, from founders to the C-suite, and host The School of Unlearning. I have scaled Learning and Development inside a venture-backed startup and worked with leaders from elite athletes to executives.</p>
    <div class="cred-list">
      <span>15 Commitments Coach, Conscious Leadership Group (Level 1 and 2)</span>
      <span>Somatic Coaching, Strozzi Institute</span>
      <span>Certified Enneagram Practitioner</span>
      <span>Somatic Experiencing Practitioner (in progress)</span>
    </div>`},

  {t:'recap', cls:'recap', html:`
    <div class="kick">The one idea to keep</div>
    <p class="big">Stop coaching the problem. Coach the consciousness beneath it, and the problem changes shape.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">The invitation</div>
    <h2>If this is the kind of work you want to do next</h2>
    <div class="cta-box">
      <p class="line">The next step is a conversation. A 45 minute call, no pitch and no pressure, to explore whether this way of leading is a fit for you and your team.</p>
      <a class="btn" href="https://www.elisamaryhaggarty.com/conscious">Book a conversation with Elisa</a>
    </div>
    <p class="disc">This masterclass is educational. It shares a way of thinking about leadership, not advice for your specific situation. No income, role, or result is guaranteed. Results vary with the person, the team, and the work they put in.</p>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls||'');
  el.innerHTML = s.html + '<div class="n">'+(i+1)+' / '+S.length+'</div><div class="foot">The School of Unlearning</div>';
  deck.appendChild(el);
});
</script>
</body>
</html>
