<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Out of Your Own Way — a Modern Leadership masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d10;
    --panel:#292f36;
    --rule:#2b3a52;
    --accent:#004aad;
    --ink:#f4f7fb;
    --dim:#aab3bf;
    --head:'Raleway',system-ui,sans-serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:linear-gradient(180deg,#0e1218,var(--bg));border:1px solid #1b2129;
    border-radius:14px;padding:44px 40px;margin:0 0 22px;min-height:360px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .kick{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 14px}
  h1{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.08;margin:0 0 14px}
  h2{font-family:var(--head);font-weight:800;font-size:30px;line-height:1.12;margin:0 0 14px}
  p{font-size:18px;line-height:1.55;color:var(--ink);margin:0 0 12px;max-width:62ch}
  p.dim{color:var(--dim)}
  .layer{margin:18px 0;border-top:1px solid var(--rule);padding-top:14px}
  .layer .top{color:var(--dim);font-size:15px}
  .layer .bot{color:var(--ink);font-weight:600;font-size:20px;font-family:var(--head)}
  ul{margin:8px 0 0;padding:0 0 0 20px}
  li{font-size:18px;line-height:1.5;margin:0 0 10px}
  .accent{color:var(--accent)}
  .foot{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--dim);letter-spacing:.04em}
  .num{position:absolute;left:22px;bottom:16px;font-size:12px;color:#55606d}
  .disc{font-size:13px;color:var(--dim);border-top:1px solid var(--rule);margin-top:18px;padding-top:12px;max-width:70ch}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kick:'A Modern Leadership masterclass',h:'Get Out of Your Own Way',p:'The self-leadership method driven leaders use to stop being their own bottleneck, without burning out.',sub:'Live with Marc Hildebrand'},
 {t:'agenda',kick:'What we will cover',h:'Sixty minutes, one method',p:'By the end you will know exactly why your old fixes keep failing and the repeatable path to change that actually holds.',li:['Why effort alone keeps you stuck','The difference between a technical and an adaptive problem','The Growth Model, step by step','What it looks like when you lead yourself first']},
 {t:'who',kick:'Who this is for',h:'You are already doing the work',p:'You are a driven leader or founder. You read the books, you put in the hours, you push your team. And yet you keep hitting the same wall.',li:['You are working harder than ever and still feel stuck','You can lead everyone but yourself','Every fix you try seems to fade in a few weeks']},
 {t:'reframe',kick:'The uncomfortable part',h:'It is not your strategy. It is not your hours.',p:'The reason you stay stuck is almost never the thing you are attacking. It is a belief running quietly underneath the behavior, and no amount of effort on the surface changes it.'},
 {t:'reframe2',kick:'The quiet cost',h:'This is what burnout actually is',p:'Burnout is rarely too much work. It is too much work aimed at the wrong level, over and over, while the real driver never moves. You can out-hour it for a while. Not forever.'},
 {t:'part',kick:'Part one',h:'Technical problems vs adaptive problems',p:'A technical problem has a known fix: apply the right tool and it is solved. An adaptive problem needs you to change a belief or a behavior. Most stuck leaders are treating an adaptive problem like a technical one.'},
 {t:'part2',kick:'Part one',h:'Why your fixes keep failing',p:'New app, new morning routine, new framework. They are technical fixes bolted onto an adaptive problem, so the old pattern wins back every time.',li:['The surface tactic changes','The belief driving it does not','So the behavior quietly returns']},
 {t:'part',kick:'Part two',h:'The Growth Model',p:'This is the method at the center of everything we teach. Not a philosophy to go figure out alone, a repeatable path you can run on any pattern you are stuck in.'},
 {t:'layers',kick:'Part two',h:'One layer down',p:'The Growth Model works underneath the symptom:',layers:[['The symptom you see','The behavior you keep repeating'],['The belief driving it','The quiet rule underneath the behavior'],['Change the belief','Work at the level where change actually holds'],['The behavior changes with it','And it holds, because the root moved']]},
 {t:'part2',kick:'Part two',h:'Control the inputs, not the outcomes',p:'You cannot directly control the outcome you want. You can control the inputs: what you feed yourself, how you respond, the reps you take daily.',li:['Stop white-knuckling results you cannot control','Govern the inputs you can','Let the outcome follow the method']},
 {t:'part2',kick:'Part two',h:'Method, not motivation',p:'Motivation is a good feeling that fades by Thursday. A method is a repeatable path with follow-through so you do not slide back into the old pattern.',li:['Name the pattern','Find the belief under it','Run the Growth Model','Keep the follow-through so it sticks']},
 {t:'part',kick:'Part three',h:'When you lead yourself first',p:'When you lead yourself first, the change is quiet but total: the decisions get cleaner, the team feels it, and the hours stop being the only lever you have.'},
 {t:'part2',kick:'Part three',h:'The shift',p:'From the leader who is the bottleneck to the leader who has gotten out of the way.',li:['You respond instead of react','You lead from a steadier place','Your people get the best version of you, and so does your family']},
 {t:'why',kick:'Why me',h:'Twenty years, one hard lesson',p:'I spent twenty years as an LAPD sergeant. The hardest person I ever had to lead was the one in the mirror. I lost a hundred pounds not with a new diet but by changing the belief underneath the behavior. That is the whole method, and it is what we teach now.',sub:'Marc Hildebrand, Modern Leadership Coaching'},
 {t:'part2',kick:'The method, in one line',h:'Lead yourself first',p:'Everyone else is teaching you to lead your team. This is the part nobody runs: lead yourself first, and the rest follows.'},
 {t:'recap',kick:'The recap',h:'What you came away with',p:'One method you can run on any pattern that has you stuck:',li:['Name the pattern you keep repeating','Find the belief driving it one layer down','Change the belief with the Growth Model','Hold it with the follow-through']},
 {t:'next',kick:'Where this goes',h:'This is where the real work starts',p:'A masterclass can show you the method. Changing the pattern that has run you for years is work you do not have to do alone, and that is exactly what we do together next.'},
 {t:'cta',kick:'Your next step',h:'Come do the work with us',p:'If this is the method you have been missing, the next step is a free call. We will find the belief that is keeping you stuck and map the path out.',cta:'Book your free call at modernleadership.us',disc:'Educational content only. No outcome, income, or result is guaranteed. Results vary and depend on your own effort and circumstances.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  h+='<'+(s.t==='title'?'h1':'h2')+'>'+s.h+'</'+(s.t==='title'?'h1':'h2')+'>';
  if(s.p) h+='<p>'+s.p+'</p>';
  if(s.layers){s.layers.forEach(L=>{h+='<div class="layer"><div class="top">'+L[0]+'</div><div class="bot">'+L[1]+'</div></div>';});}
  if(s.li){h+='<ul>'+s.li.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  if(s.sub) h+='<p class="dim">'+s.sub+'</p>';
  if(s.cta) h+='<p class="accent" style="font-family:var(--head);font-weight:800;font-size:22px;margin-top:10px">'+s.cta+'</p>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="num">'+(i+1)+' / '+S.length+'</div><div class="foot">Modern Leadership Coaching</div>';
  el.innerHTML=h;deck.appendChild(el);
});
</script>
</body>
</html>
