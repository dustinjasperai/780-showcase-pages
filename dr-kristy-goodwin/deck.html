<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powered-Up, Not Burned Out — Dr Kristy Goodwin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F2EC;        /* dominant warm cream, from brand.json #F3F2EE */
    --panel:#EAE4D8;     /* soft warm sand */
    --ink:#23201C;       /* near-black heading ink, from brand.json */
    --muted:#595959;     /* body grey, from brand.json rgb(89,89,89) */
    --accent:#6A5D52;    /* taupe, from brand.json footer rgb(106,93,82) */
    --rule:#D8CFBE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:'Archivo',system-ui,sans-serif}
  .deck{max-width:1000px;margin:0 auto}
  .slide{background:var(--bg);min-height:92vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;border-bottom:1px solid var(--rule);position:relative}
  .eyebrow{font-family:'Archivo';font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:'Cormorant';font-weight:700;font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.02;letter-spacing:-.01em}
  h2{font-family:'Cormorant';font-weight:600;font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.08}
  p.lead{font-size:clamp(1.05rem,1.8vw,1.4rem);color:var(--muted);max-width:40ch;margin-top:1.6rem;line-height:1.5}
  p.body{font-size:1.1rem;color:var(--muted);max-width:52ch;margin-top:1.1rem;line-height:1.6}
  .big{font-family:'Cormorant';font-weight:600;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.1;max-width:20ch}
  .num{font-family:'Cormorant';font-weight:600;color:var(--accent);font-size:1.3rem;margin-bottom:.6rem}
  .rule{width:64px;height:2px;background:var(--accent);margin:1.8rem 0}
  ul{margin-top:1.6rem;list-style:none;max-width:48ch}
  li{font-size:1.1rem;color:var(--ink);padding:.7rem 0;border-top:1px solid var(--rule);line-height:1.45}
  li:first-child{border-top:none}
  li b{font-family:'Cormorant';font-weight:600}
  .present{margin-top:2.4rem;font-size:1rem;color:var(--ink);font-weight:600}
  .present span{color:var(--muted);font-weight:400}
  .pillarcard{background:var(--panel);border-left:3px solid var(--accent);padding:1.4rem 1.6rem;margin-top:1.4rem;max-width:46ch}
  .cta h1{margin-bottom:1rem}
  .step{display:inline-block;margin-top:1.4rem;font-family:'Archivo';font-weight:600;font-size:1.1rem;
    color:var(--bg);background:var(--accent);padding:.9rem 1.6rem;border-radius:2px}
  .disclaimer{margin-top:2.6rem;font-size:.82rem;color:var(--muted);max-width:52ch;line-height:1.5}
  .tag{position:absolute;top:4vh;right:8vw;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<footer style="max-width:1000px;margin:0 auto;padding:2.4rem 8vw;background:var(--panel);color:var(--muted);font-size:.82rem;line-height:1.5;font-family:'Archivo',sans-serif">
This masterclass is educational. It shares evidence-based strategies for performance and wellbeing. No specific result is guaranteed. Results vary from person to person and depend on individual circumstances and effort.
</footer>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass', h:'Powered-Up, Not Burned Out',
   lead:'The neuroscience of sustaining elite performance without the hidden cost.',
   present:'Dr Kristy Goodwin', presentSub:'Neuro-Performance Scientist'},

  {t:'who', eyebrow:'Who this is for', h:'You are hitting every target. And quietly running on empty.',
   body:'For leaders, founders and high-achievers who are always switched on but rarely powered up. You have the output. What you do not have is a way to sustain it that does not borrow from your sleep, your focus and the people you love.'},

  {t:'hook', eyebrow:'The uncomfortable part', big:'Switched on is not the same as powered up.',
   body:'Most high performers have never been taught the difference. So they push harder, and the bill still comes.'},

  {t:'part', num:'Part One', h:'The Success Tax'},

  {t:'point', eyebrow:'The core problem', h:'Every win is being charged to an account you cannot see.',
   body:'The success tax is what high achievers pay when performance is funded by cortisol, caffeine and borrowed recovery. It shows up as 3pm crashes, blunted focus, shortened fuses and a body that stops bouncing back.'},

  {t:'list', eyebrow:'What it quietly costs', h:'The bill, itemised',
   items:['<b>Sleep</b> traded for one more hour of output','<b>Focus</b> fractured by an always-on inbox','<b>Health</b> deferred until the next quieter quarter','<b>Relationships</b> getting your leftovers, not your best']},

  {t:'point', eyebrow:'Why trying harder fails', h:'You cannot willpower your way out of biology.',
   body:'High performers are handed productivity hacks and corporate dogma built for an average brain on an average day. None of it accounts for how your nervous system actually produces energy, focus and recovery. So it works for a fortnight, then stops.'},

  {t:'part', num:'Part Two', h:'Your Human Operating System'},

  {t:'point', eyebrow:'The reframe', h:'You are not lazy or undisciplined. You are mis-configured.',
   body:'Your Human Operating System is your biological blueprint: the rhythms and limits your brain and body run on. When your behaviour is congruent with your hOS, performance compounds. When you fight it, the success tax rises.'},

  {t:'pillars', eyebrow:'The four signals', h:'What your operating system is always telling you',
   cards:[
     ['Energy rhythms','When your brain is wired for deep work, and when it is wired for recovery. Most people schedule against both.'],
     ['Focus capacity','Attention is a finite daily budget. Notifications and task-switching spend it before lunch.'],
     ['Recovery load','Strain without recovery is not resilience, it is debt. Recovery is where performance is actually built.'],
     ['Resilience','The capacity to meet pressure without tipping into depletion. It is trainable, not fixed.']
   ]},

  {t:'point', eyebrow:'Make it visible', h:'Reading your own signals, not guessing.',
   body:'Wearable and biometric data turns these four signals from a vague feeling into something you can see and act on. The Neuro-Performance Profile maps where you are leaking energy and focus, so the plan is built for your biology, not a generic template.'},

  {t:'part', num:'Part Three', h:'The Power-Up Plan'},

  {t:'point', eyebrow:'In practice', h:'A small set of brain-based protocols, run on purpose.',
   body:'Not another routine to white-knuckle. A handful of precise, evidence-based protocols that protect focus, defend recovery and align your hardest work with your sharpest hours. Congruent with your operating system, so they hold.'},

  {t:'list', eyebrow:'The shift', h:'From paying the tax to compounding',
   items:['Focus protected in blocks your brain is actually built for','Recovery treated as production, not indulgence','Energy spent where it returns the most, drained less by digital noise','Performance that lasts quarters, not until the next crash']},

  {t:'point', eyebrow:'Why me', h:'A scientist, not a slogan.',
   body:'I am a neuro-performance scientist and Certified Speaking Professional, author of two award-winning books on digital wellbeing, and I work with senior leaders across some of the most demanding organisations in the country. This is the evidence-based method behind that work, built for high performers who refuse to choose between success and their health.'},

  {t:'cta', eyebrow:'Your next step', h:'Find out what your operating system is costing you.',
   body:'Take the Neuro-Performance Profile and book a conversation about building your Power-Up Plan. We map your signals, then design the protocols around your biology.',
   step:'Start with the Neuro-Performance Profile',
   disclaimer:'This masterclass is educational. No specific result is guaranteed. Results vary from person to person and depend on individual circumstances and effort.'}
];

const deck = document.getElementById('deck');
function esc(s){return s}
S.forEach(function(s){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'');
  let h = '';
  if(s.t==='part'){ h = '<div class="num">'+s.num+'</div><h1>'+s.h+'</h1><div class="rule"></div>'; }
  else if(s.t==='title'){ h = '<div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.h+'</h1><p class="lead">'+s.lead+'</p><div class="present">'+s.present+'<br><span>'+s.presentSub+'</span></div>'; }
  else if(s.t==='hook'){ h = '<div class="eyebrow">'+s.eyebrow+'</div><div class="big">'+s.big+'</div><p class="body">'+s.body+'</p>'; }
  else if(s.t==='list'){ h = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.h+'</h2><ul>'+s.items.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul>'; }
  else if(s.t==='pillars'){ h = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'+s.cards.map(function(c){return '<div class="pillarcard"><b style="font-family:Cormorant;font-size:1.3rem">'+c[0]+'</b><p class="body" style="margin-top:.5rem">'+c[1]+'</p></div>'}).join(''); }
  else if(s.t==='cta'){ h = '<div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.h+'</h1><p class="body">'+s.body+'</p><div class="step">'+s.step+'</div><p class="disclaimer">'+s.disclaimer+'</p>'; }
  else { h = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.h+'</h2><p class="body">'+s.body+'</p>'; }
  el.innerHTML = '<div class="tag">Dr Kristy Goodwin</div>' + h;
  deck.appendChild(el);
});
</script>
</body>
</html>
