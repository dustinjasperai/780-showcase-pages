<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hidden Profit, a live masterclass with Virgil Brewster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ec;      /* his cream ground (light scheme) */
    --panel:#f3ecdd;   /* deeper warm paper derived from the cream */
    --ink:#232221;     /* his H1/H2 ink */
    --muted:#6c6968;   /* his body color */
    --rule:#e3d8c2;    /* hairline from the paper family */
    --accent:#db6a2c;  /* his terracotta, the one brand accent */
    --deep:#b4521f;    /* darker terracotta for emphasis fills */
    --head:"Newsreader",Georgia,serif;
    --body:"Hanken Grotesk",system-ui,sans-serif;
    --note:"Caveat",cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--panel);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto}
  .slide{
    position:relative;background:var(--bg);min-height:94vh;margin:3vh 0;
    padding:7vh 7vw;display:flex;flex-direction:column;justify-content:center;
    border:1px solid var(--rule);border-radius:6px;overflow:hidden;
  }
  .kick{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:1.4rem}
  h1{font-family:var(--head);font-weight:600;font-size:clamp(2.4rem,6vw,4.2rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;letter-spacing:-.01em}
  .lead{font-size:clamp(1.15rem,2.1vw,1.5rem);color:var(--muted);margin-top:1.4rem;max-width:40ch;line-height:1.5}
  .big{font-family:var(--head);font-weight:500;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.12;max-width:20ch}
  .big .hl{color:var(--accent)}
  .note{font-family:var(--note);font-size:clamp(1.3rem,2.4vw,1.8rem);color:var(--deep);margin-top:2rem}
  .meta{margin-top:auto;padding-top:3rem;font-size:.95rem;color:var(--muted);display:flex;gap:.6rem;align-items:center}
  .meta .dot{color:var(--accent)}
  .partnum{font-family:var(--head);font-size:clamp(3rem,9vw,6rem);color:var(--rule);font-weight:600;line-height:.9}
  ul.pts{list-style:none;margin-top:2rem;max-width:46ch}
  ul.pts li{position:relative;padding-left:1.6rem;margin:1rem 0;font-size:clamp(1.05rem,1.8vw,1.3rem);color:var(--ink);line-height:1.45}
  ul.pts li::before{content:"";position:absolute;left:0;top:.6em;width:.55rem;height:.55rem;background:var(--accent);border-radius:2px}
  ul.pts li span{color:var(--muted);font-size:.95em}
  .stagerow{display:flex;align-items:baseline;gap:1.2rem;margin-top:1.2rem}
  .stageno{font-family:var(--head);font-size:clamp(2.2rem,5vw,3.4rem);color:var(--accent);font-weight:600;min-width:2.4ch}
  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:2.4rem;max-width:720px}
  .day{border:1px solid var(--rule);border-radius:6px;padding:1.4rem 1rem;background:var(--panel)}
  .day .d{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .day .w{font-family:var(--head);font-size:1.5rem;margin-top:.5rem}
  .day.hot{background:var(--accent);border-color:var(--accent)}
  .day.hot .d,.day.hot .w{color:#fff}
  .recap{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;margin-top:2.6rem}
  .recap div{border-top:3px solid var(--accent);padding-top:.8rem;font-size:.95rem;color:var(--ink)}
  .recap div b{display:block;font-family:var(--head);font-size:1.1rem;margin-bottom:.2rem}
  .stat{display:flex;gap:2.6rem;flex-wrap:wrap;margin-top:2.4rem}
  .stat div{min-width:9ch}
  .stat .n{font-family:var(--head);font-size:clamp(2rem,4vw,2.8rem);color:var(--accent);font-weight:600}
  .stat .l{color:var(--muted);font-size:.95rem;margin-top:.3rem;max-width:16ch}
  .cta h1{max-width:18ch}
  .disc{margin-top:2.4rem;font-size:.8rem;color:var(--muted);max-width:52ch;line-height:1.5}
  .pill{display:inline-block;margin-top:2rem;background:var(--accent);color:#fff;font-weight:600;padding:.9rem 1.6rem;border-radius:999px;font-size:1.05rem}
  .foot{position:absolute;bottom:2.2rem;left:7vw;font-size:.78rem;color:var(--muted);letter-spacing:.04em}
  .pg{position:absolute;bottom:2.2rem;right:7vw;font-size:.78rem;color:var(--muted)}
  del{color:var(--muted);text-decoration-color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title'},
  {t:'promise'},
  {t:'who'},
  {t:'hook'},
  {t:'part',n:'01',h:'The launch you already run'},
  {t:'problem'},
  {t:'leak'},
  {t:'part',n:'02',h:'The 5-Stage Launch Revenue Map'},
  {t:'stage',no:'1',h:'Lead Generation',s:'Get the right people into the room. Not more people, the right ones. Your newsletter and your free checklist already do this. Most launches stop improving here and wonder why the rest leaks.'},
  {t:'stage',no:'2',h:'Lead Nurture',s:'The money is in the sequence, not the list. A warm, well-sequenced email relationship is where a quiet subscriber becomes a buyer. This is the single most under-built stage.'},
  {t:'stage',no:'3',h:'Conversion',s:'The offer, the page, the open, the FOMO close. A converting landing page and a real reason to act now. Small lifts here compound across every launch you ever run.'},
  {t:'stage',no:'4',h:'Delivery Experience',s:'What happens after the card is charged decides whether they buy again. A launch that over-delivers in week one funds the next launch for free.'},
  {t:'stage',no:'5',h:'Cross-sell and Upsell',s:'The buyer who just said yes is the most likely person to say yes again. The highest-margin dollars in a launch almost always sit in the offer you did not make.'},
  {t:'fourday'},
  {t:'part',n:'03',h:'The launch that keeps its money'},
  {t:'results'},
  {t:'whyme'},
  {t:'shift'},
  {t:'recap'},
  {t:'cta',disc:'This masterclass is educational. It shares systems and ranges from real launches, but your results depend on your offer, your audience, and your execution. No income or result is guaranteed. Results vary from one founder to the next.'}
];

function slideHTML(d,i,total){
  const foot='<div class="foot">The Hidden Profit · Virgil Brewster · The Launch Room</div><div class="pg">'+(i+1)+' / '+total+'</div>';
  let inner='';
  switch(d.t){
    case 'title':
      inner='<div class="kick">A live masterclass</div>'+
        '<h1>The Hidden Profit</h1>'+
        '<p class="lead">Why your best launch still left $30k to $75k on the table, and how to go get it back.</p>'+
        '<div class="meta"><span class="dot">●</span> Presented live by Virgil Brewster · The Launch Room</div>';
      break;
    case 'promise':
      inner='<div class="kick">What this hour is</div>'+
        '<h2>One hour. Five places your launch quietly leaks. A plan to close them before the next one.</h2>'+
        '<div class="note">Bring your last launch. We will find the money in it.</div>';
      break;
    case 'who':
      inner='<div class="kick">Who this is for</div>'+
        '<h2>You already sell courses, cohorts, or coaching. You have launched at least once.</h2>'+
        '<p class="lead">So here is the trap: you think the next level is a bigger audience. It almost never is.</p>';
      break;
    case 'hook':
      inner='<div class="kick">The reframe</div>'+
        '<p class="big">You don\'t have a <del>traffic</del> problem.<br>You have a <span class="hl">leak</span> problem.</p>'+
        '<div class="note">More people pouring into a leaky launch just loses you more money, faster.</div>';
      break;
    case 'part':
      inner='<div class="partnum">'+d.n+'</div><h1 style="margin-top:1.4rem">'+d.h+'</h1>';
      break;
    case 'problem':
      inner='<div class="kick">The core problem</div>'+
        '<h2>A launch is a system, and every system leaks at the seams.</h2>'+
        '<ul class="pts">'+
        '<li>You can run a flawless open and still lose money in the nurture before it.</li>'+
        '<li>You can have a great offer and lose it at a page that does not convert.</li>'+
        '<li>You can sell out and never make the one more offer that doubles the margin.</li>'+
        '</ul>';
      break;
    case 'leak':
      inner='<div class="kick">Where it hides</div>'+
        '<h2>Thirty to seventy-five thousand dollars. Per launch.</h2>'+
        '<p class="lead">That is the range I keep finding when I audit a launch that already works. It is not hiding in the parts you obsess over. It is hiding in the parts you skip.</p>'+
        '<div class="note">It is already yours. You just have not collected it yet.</div>';
      break;
    case 'stage':
      inner='<div class="kick">Stage '+d.no+' of 5</div>'+
        '<div class="stagerow"><span class="stageno">'+d.no+'</span><h2>'+d.h+'</h2></div>'+
        '<p class="lead" style="max-width:52ch">'+d.s+'</p>';
      break;
    case 'fourday':
      inner='<div class="kick">The choreography</div>'+
        '<h2>The 4-Day Launch</h2>'+
        '<div class="days">'+
        '<div class="day hot"><div class="d">Day 1</div><div class="w">Open</div></div>'+
        '<div class="day"><div class="d">Day 2</div><div class="w">Build</div></div>'+
        '<div class="day"><div class="d">Day 3</div><div class="w">FOMO</div></div>'+
        '<div class="day hot"><div class="d">Day 4</div><div class="w">Close</div></div>'+
        '</div>'+
        '<p class="lead" style="max-width:52ch">Four days of planned momentum, then a scale plan for the day after the cart closes. The hype is engineered, not hoped for.</p>';
      break;
    case 'results':
      inner='<div class="kick">What closing the leaks looks like</div>'+
        '<h2>Same audience. Same offer. A launch that finally keeps its money.</h2>'+
        '<ul class="pts">'+
        '<li>A cohort that sold out in 50 minutes once the nurture and the open were built right. <span>(from my own work with founders)</span></li>'+
        '<li>A first course launch that cleared $126k because the offer and the sequence matched. <span>(from my own work with founders)</span></li>'+
        '<li>The point is not the number. It is that the number was already in the launch.</li>'+
        '</ul>';
      break;
    case 'whyme':
      inner='<div class="kick">Why listen to me</div>'+
        '<h2>I built this the hard way.</h2>'+
        '<div class="stat">'+
        '<div><div class="n">$10M</div><div class="l">education business built over four years</div></div>'+
        '<div><div class="n">2CCX</div><div class="l">2 Comma Club X award</div></div>'+
        '<div><div class="n">2,000+</div><div class="l">founders reading The Launch Room</div></div>'+
        '</div>'+
        '<p class="lead" style="max-width:54ch">I went from burnt-out personal trainer to an eight-figure course business, and then spent years finding where launches leak so founders would not have to learn it the slow way I did.</p>';
      break;
    case 'shift':
      inner='<div class="kick">The one shift</div>'+
        '<p class="big">Fix the launch you <span class="hl">have</span> before you chase a bigger audience.</p>'+
        '<div class="note">The cheapest growth you will ever buy is the money you are already leaving behind.</div>';
      break;
    case 'recap':
      inner='<div class="kick">The map, in one view</div>'+
        '<h2>Five stages. Find your leak. Close it.</h2>'+
        '<div class="recap">'+
        '<div><b>1</b>Lead Generation</div>'+
        '<div><b>2</b>Lead Nurture</div>'+
        '<div><b>3</b>Conversion</div>'+
        '<div><b>4</b>Delivery</div>'+
        '<div><b>5</b>Cross-sell / Upsell</div>'+
        '</div>'+
        '<p class="lead" style="max-width:52ch;margin-top:2.4rem">Pick the one stage you have never really built. That is where your hidden profit is.</p>';
      break;
    case 'cta':
      inner='<div class="kick">Your next launch</div>'+
        '<h1>Ready to find your hidden profit?</h1>'+
        '<p class="lead">If you want me in your corner for your next launch, come find where your $30k to $75k is hiding with me directly.</p>'+
        '<span class="pill">Work with Virgil · The Launch Room</span>'+
        '<p class="disc">'+d.disc+'</p>';
      break;
  }
  return '<section class="slide'+(d.t==='cta'?' cta':'')+'">'+inner+foot+'</section>';
}

const deck=document.getElementById('deck');
deck.innerHTML=S.map((d,i)=>slideHTML(d,i,S.length)).join('');
</script>
</body>
</html>
