<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Alchemy of Your Hardest Placements — Jocelyn Star Feather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241536;      /* night aubergine, darkened from site probe #35214a */
    --panel:#2f1d47;   /* panel plum */
    --accent:#a06bd0;  /* orchid, brightened from probe #35214a */
    --ink:#f3ecff;     /* starlight ink */
    --muted:#c6b6e0;
    --rule:#0a3743;    /* teal, site probe */
    --gold:#d9b36a;    /* starlight gold hairline */
    --head:"Cormorant Garamond", Georgia, serif;
    --body:"Raleway", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:54px 50px;margin:0 0 26px;position:relative;overflow:hidden}
  .slide:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold))}
  .k{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 18px}
  h1{font-family:var(--head);font-weight:700;font-size:48px;line-height:1.05;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.1;margin:0 0 16px}
  p{font-size:19px;line-height:1.55;color:var(--muted);margin:0 0 14px;max-width:62ch}
  .big{font-family:var(--head);font-weight:600;font-size:30px;color:var(--ink);line-height:1.2}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;color:var(--muted);padding:12px 0 12px 26px;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"✦";position:absolute;left:0;color:var(--gold);font-size:13px;top:15px}
  .lead{color:var(--accent);font-weight:600}
  .part{font-family:var(--head);font-size:26px;color:var(--gold);letter-spacing:.04em}
  .cta h2{color:var(--ink)}
  .disc{font-size:13px;color:var(--muted);opacity:.75;margin-top:22px;max-width:70ch;line-height:1.5}
  .by{font-size:15px;color:var(--muted);margin-top:10px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    k:"A live Alchemical Astrology masterclass",
    h:"The Alchemy of Your Hardest Placements",
    sub:"Read Saturn, Pluto and the outer planets as the map of your initiation, not a forecast of your doom. Leave with one alchemical move to make with the transit you are in right now.",
    by:"with Jocelyn Star Feather, Sacred Planet"},

  {t:'list',
    k:"Who this is for",
    h:"For the visionary who keeps being told her chart is challenging",
    body:"If you are an empath, a healer, or a teacher who feels the energy moving fast and the old structures falling away, and you have been handed a chart reading that left you more afraid than free, this hour is for you.",
    list:["You sense you are here for something and cannot yet name it",
          "You have been through a Saturn return, a Pluto transit, or a loss that reorganized your life",
          "You want depth and real practice, not another daily horoscope"]},

  {t:'trap',
    k:"The trap",
    h:"You have been reading your chart for prediction",
    body:"Prediction asks one question: what is going to happen to me? It keeps you a spectator of your own life, waiting to see whether the transit is good or bad. So the hardest placements become something to brace against, and their whole purpose is missed.",
    big:"A forecast tells you the weather. It never teaches you to sail."},

  {t:'reframe',
    k:"The reframe",
    h:"Your malefics are not your punishment. They are your initiation.",
    body:"In Alchemical Astrology the placements most people fear are read as operations, the pressure that turns raw material into gold. Saturn, Pluto and the outer planets are not sentences passed on you. They are the exact initiation your soul set up for this life."},

  {t:'part', part:"Part One", h:"Why prediction keeps you stuck"},

  {t:'body',
    k:"Part One",
    h:"The chart is a map, not a verdict",
    body:"Every placement describes a potential for transformation and initiation. When you read it as fixed fate, you hand your power to the sky. When you read it as a map of operations, the same placement becomes a set of instructions you can actually work with."},

  {t:'body',
    k:"Part One",
    h:"The hardest placement is the doorway",
    body:"The thing in your chart you most want to avoid is almost always the doorway to your mission. Alchemy does not remove the lead. It works with the lead until it becomes gold. Your fear has been pointing at your gold the whole time."},

  {t:'part', part:"Part Two", h:"Alchemical Astrology, the method"},

  {t:'pillar',
    k:"Alchemical Astrology",
    h:"Saturn: the structure your mission needs",
    body:"Saturn is read not as restriction but as architecture. It shows where you are being asked to build slowly, commit, and become the authority your work requires. The weight is the shape of the discipline your calling is waiting on."},

  {t:'pillar',
    k:"Alchemical Astrology",
    h:"Pluto: what has to end so you can begin",
    body:"Pluto is the operation of death and rebirth. It reveals what must be released, composted and transmuted so the next version of you can live. Read alchemically, a Pluto transit is not destruction for its own sake. It is clearing the ground."},

  {t:'pillar',
    k:"Alchemical Astrology",
    h:"The outer planets: your Cosmic Timeline",
    body:"Uranus, Neptune and Pluto move slowly and mark the large initiations of a life. Together they trace what I call your Cosmic Timeline, the sequence of awakenings your chart is initiating you through. Knowing the timeline turns a crisis into a chapter."},

  {t:'body',
    k:"The operation",
    h:"How you actually transmute a placement",
    body:"Each hard placement gets the same alchemical move: name the fear it carries, find the gift folded inside it, and take one concrete ritual action that meets the energy instead of resisting it. That is the whole practice, repeated for every transit.",
    big:"Name the fear. Find the gift. Make the move."},

  {t:'part', part:"Part Three", h:"When your chart becomes a commission"},

  {t:'body',
    k:"Part Three",
    h:"From bracing to building",
    body:"When you stop fearing your chart, the transit you are in stops being something happening to you and becomes something you are doing. The same placements that felt like a sentence start to feel like a commission. That shift is the entire point of the work."},

  {t:'list',
    k:"Part Three",
    h:"What changes when you read alchemically",
    body:"This is not about becoming someone new. It is about reading the map you were handed correctly.",
    list:["You meet your hardest transit with a practice, not a panic",
          "Your gifts and your mission come into focus together",
          "You stop outsourcing your chart to someone else to interpret"]},

  {t:'why',
    k:"Why me",
    h:"I spent fifteen years in corporate finance",
    body:"Then my daughter was born, an existential crisis cracked me open, and a shamanic journey in Taos showed me an exact location I later stood in, in waking life. That was my proof of magic. I am not asking you to believe without evidence. I am teaching you to read the evidence already written in your chart.",
    by:"Jocelyn Star Feather, founder of Sacred Planet"},

  {t:'body',
    k:"Recap",
    h:"The one idea to keep",
    big:"The placements you fear are the map of your initiation. Read them as operations, and your hardest chapter becomes your mission.",
    body:"Prediction makes you a spectator. Alchemy makes you the one doing the work."},

  {t:'cta', cls:"cta",
    k:"Where to go from here",
    h:"Come deeper into the work",
    body:"If this reframe landed, the next step is to read your own chart this way with guidance. Begin with the free Alchemical Astrology Chart Reading Guide, then step into the Astrological Mystery School, where we activate your Cosmic Timeline and build your ritual practice together.",
    by:"Sacred Planet, with Jocelyn Star Feather",
    disc:"Educational only. No income, role, or result is guaranteed. Results vary and depend on many factors including your own effort and circumstances. This masterclass is for personal and spiritual growth and is not a substitute for medical, psychological, legal, or financial advice."}
];

const d = document.getElementById('deck');
d.innerHTML = S.map(s => {
  let inner = '';
  if (s.k) inner += '<p class="k">'+s.k+'</p>';
  if (s.t==='title' || s.t==='cta') inner += '<h1>'+s.h+'</h1>';
  else if (s.t==='part') inner += '<p class="part">'+s.part+'</p><h2>'+s.h+'</h2>';
  else inner += '<h2>'+s.h+'</h2>';
  if (s.body) inner += '<p>'+s.body+'</p>';
  if (s.big) inner += '<p class="big">'+s.big+'</p>';
  if (s.list) inner += '<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  if (s.sub) inner += '<p>'+s.sub+'</p>';
  if (s.by) inner += '<p class="by">'+s.by+'</p>';
  if (s.disc) inner += '<p class="disc">'+s.disc+'</p>';
  return '<section class="slide '+(s.cls||'')+'">'+inner+'</section>';
}).join('');
</script>
</body>
</html>
