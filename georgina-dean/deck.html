<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw It Out — a masterclass with Georgina Dean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F3ECDD;        /* warm oat / kraft sketchbook paper */
    --panel:#FBF8F1;     /* lighter paper panel */
    --ink:#26221C;       /* pen ink */
    --ink-soft:#4b443a;
    --ink-muted:#8a7f6e;
    --rule:#E3D6BF;
    --accent:#C8553D;    /* hand-mixed terracotta — her sketchbook signature */
  }
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    width:min(960px,94vw);aspect-ratio:16/9;background:var(--panel);
    border:1px solid var(--rule);border-radius:10px;position:relative;overflow:hidden;
    box-shadow:0 18px 50px rgba(38,34,28,.12);
  }
  .slide{position:absolute;inset:0;padding:60px 70px;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kicker{font-family:'Inter';font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
  h1{font-family:'Bricolage Grotesque';font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Bricolage Grotesque';font-weight:600;font-size:36px;line-height:1.12;margin-bottom:14px}
  h3{font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;margin-bottom:8px}
  p{font-size:19px;line-height:1.5;color:var(--ink-soft);max-width:46ch}
  p.lead{font-size:23px;color:var(--ink)}
  .big{font-size:25px;line-height:1.4;color:var(--ink);max-width:42ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.45;color:var(--ink-soft);padding-left:30px;position:relative;margin-bottom:13px;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:13px;width:16px;height:2px;background:var(--accent);transform:rotate(-4deg)}
  .num{font-family:'Bricolage Grotesque';font-weight:700;color:var(--accent);font-size:19px;letter-spacing:.04em;margin-bottom:6px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px 38px;margin-top:8px}
  .card{border:1px solid var(--rule);border-radius:8px;padding:18px 20px;background:var(--bg)}
  .card h3{font-size:20px;margin-bottom:6px}
  .card p{font-size:16px;line-height:1.4}
  .cover-rule{width:64px;height:3px;background:var(--accent);margin:22px 0;transform:rotate(-2deg)}
  .disclaimer{font-size:13px;color:var(--ink-muted);margin-top:22px;max-width:56ch;line-height:1.45}
  .cta-line{font-size:22px;color:var(--ink);margin-top:6px;max-width:44ch}
  .foot{position:absolute;left:70px;bottom:26px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
  .page{position:absolute;right:28px;bottom:24px;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
  .nav{position:absolute;inset:0;display:flex;justify-content:space-between;z-index:2}
  .nav button{flex:1;background:transparent;border:0;cursor:pointer}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink-muted);letter-spacing:.08em}
  @media(max-width:640px){.slide{padding:32px 28px}h1{font-size:34px}h2{font-size:25px}p,li,.big{font-size:16px}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="stage"><div class="nav"><button id="prev" aria-label="previous"></button><button id="next" aria-label="next"></button></div></div>
<div class="hint">left / right or click to move through the slides</div>
<script>
const S=[
 {t:'cover'},
 {t:'promise',k:'The promise',h:'What if a cold stranger could feel how you lead in 60 minutes?',p:'Visual, creative leadership for aspiring female leaders who refuse to lead on autopilot. In the next hour I will show you the practice, not just the pep talk.'},
 {t:'who',k:'Who this is for',h:'You, if any of this lands',ul:['You are stepping into leadership, and the title arrived faster than the confidence.','You are drowning in information and decisions, and almost none of it is sticking.','You are surrounded by AI shortcuts and quietly wondering what is still actually yours.']},
 {t:'trap',k:'The trap',h:'The pace is winning, and you can feel it',big:'You read the book, sit the course, screenshot the framework. The moment you close the cover the knowledge evaporates, and you lead from a half-remembered version of your own best thinking.'},
 {t:'myth',k:'Before we start',h:'This is not an art class',p:'You do not need to draw well. You need a pen, paper, and a willingness to play. Every technique today works with stick figures and boxes. The skill is thinking on paper, not making it pretty.'},
 {t:'reframe',k:'The reframe',h:'This is not a return to analog. It is a return to being human.',p:'Faster is not the edge any more. Everyone has faster. The edge is a leader who can slow down, see the whole picture, and think an original thought on purpose.'},
 {t:'problem',k:'Part one · the problem',h:'Consuming is not the same as leading',p:'Most leadership training hands you more to consume. But leadership is a thinking act, not a reading act. If the ideas never move from the page into your own hand, they never become yours to lead with.',ul:['Information in, almost nothing retained.','Borrowed frameworks, no personal conviction.','AI drafts the thought before you have had it.']},
 {t:'problem2',k:'Part one · the cost',h:'What that quietly costs you',big:'Decisions get slower. Meetings feel like fog. You default to the loudest voice or the fastest tool, because your own thinking never got anchored anywhere you can reach it under pressure.'},
 {t:'method',k:'Part two · the method',h:'Draw It Out: the visual thinking practice',p:'When you visually translate an idea instead of speed-reading past it, you anchor it, and you make it yours. Here are the three gentle ways in that I teach, and that you can use this week.'},
 {t:'pillar',k:'Part two · pillar 01',num:'01',h:'The Chapter Mapper',big:'Take one idea, one decision, one chapter of a problem, and sketch it into a single map. Not to make it pretty. To make it clear enough to lead from.'},
 {t:'pillar',k:'Part two · pillar 02',num:'02',h:'The Quote Collector',big:'Capture the few lines that genuinely change how you think, and illustrate them. What you draw, you remember. What you remember, you can use under pressure.'},
 {t:'pillar',k:'Part two · pillar 03',num:'03',h:'The Character Catcher',big:'Draw the people and forces in play: your team, your stakeholders, the real problem behind the stated one. Leadership is reading the room. This is how you see it.'},
 {t:'stance',k:'Part two · the stance',h:'Creative struggle before the shortcut',big:'Wrestle with the idea by hand first, then let AI assist. The leaders who think before they prompt are the ones who still own their judgment a year from now.'},
 {t:'ritual',k:'Part two · the ritual',h:'Ten quiet minutes, on purpose',p:'Innovation starts with intention. The practice is not another thing on your list, it is a short, deliberate pause: one page, one pen, one idea mapped before the day swallows it. That pause is where original thinking lives.'},
 {t:'looks',k:'Part three · the shift',h:'From a flat spark to Creatively Wondering',cols:[{h:'Before',p:'Reactive. Overloaded. Leading from borrowed words. The spark is flat.'},{h:'After',p:'You see the whole board. You retain what matters. You lead from a thought that is unmistakably yours.'}]},
 {t:'shift',k:'Part three · the mindset',h:'Curiosity is a leadership skill, not a nice-to-have',p:'A leader who stays curious on purpose makes braver calls, builds teams that think out loud, and does not hand their best thinking to a machine by default. That is what this practice is really training.'},
 {t:'recap',k:'Part three · the practice',h:'Three tracks you leave with today',cols:[{h:'Map it',p:'Chapter Mapper for the decision in front of you.'},{h:'Keep it',p:'Quote Collector for the ideas worth remembering.'},{h:'See it',p:'Character Catcher for the people and the politics.'},{h:'Hold the line',p:'Think by hand first, then reach for AI.'}]},
 {t:'whyme',k:'Why me',h:'A decade teaching people to learn differently',p:'Senior education leader across three continents, keynote speaker, Adobe Express Ambassador and sketchnote artist. Through Wonder with Georgina I help readers in 21 countries unlock their creative superpowers. This practice is what I use, and what I teach.'},
 {t:'cta',k:'The invitation',h:'Let us draw out how you lead',cta:'If this is the kind of leader you want to become, the next step is a conversation about executive coaching with me, built around your real situation and this exact practice.',disc:'For educational purposes only. No specific result is guaranteed. Results vary and depend on your own effort and circumstances.'}
];
const stage=document.getElementById('stage');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
 stage.querySelectorAll('.slide').forEach(e=>e.remove());
 S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='slide'+(i===cur?' on':'');
  let html='';
  if(s.t==='cover'){
   html='<div class="kicker">A live masterclass with Georgina Dean</div>'+
        '<h1>Draw It Out</h1><div class="cover-rule"></div>'+
        '<p class="lead">Visual, creative leadership in the age of AI, for aspiring female leaders.</p>'+
        '<div class="foot">Redefine Training &amp; Education</div>';
  }else{
   if(s.k)html+='<div class="kicker">'+esc(s.k)+'</div>';
   if(s.num)html+='<div class="num">'+esc(s.num)+'</div>';
   if(s.h)html+='<h2>'+esc(s.h)+'</h2>';
   if(s.p)html+='<p>'+esc(s.p)+'</p>';
   if(s.big)html+='<p class="big">'+esc(s.big)+'</p>';
   if(s.ul){html+='<ul>';s.ul.forEach(x=>html+='<li>'+esc(x)+'</li>');html+='</ul>';}
   if(s.cols){html+='<div class="cols">';s.cols.forEach(c=>html+='<div class="card"><h3>'+esc(c.h)+'</h3><p>'+esc(c.p)+'</p></div>');html+='</div>';}
   if(s.cta)html+='<p class="cta-line">'+esc(s.cta)+'</p>';
   if(s.disc)html+='<div class="disclaimer">'+esc(s.disc)+'</div>';
   html+='<div class="page">'+(i+1)+' / '+S.length+'</div>';
  }
  d.innerHTML=html;stage.appendChild(d);
 });
}
let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,n));render();}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
render();
</script>
</body>
</html>
