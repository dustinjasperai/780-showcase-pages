<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Work-Life Harmony Blueprint — iLLIMITABLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17141b; --panel:#221c29; --rule:#352c3f;
    --ink:#f4eef7; --muted:#b9adc4; --accent:#ff69b4;
    --head:'Poppins',sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0d0b10;color:var(--ink);font-family:var(--body)}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 20px 120px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:460px;display:flex;
    flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:56px;top:46px;width:54px;height:4px;
    background:var(--accent);border-radius:3px}
  .slide.title,.slide.cta{align-items:flex-start}
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin:26px 0 18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.06;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.12;margin-bottom:16px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:70ch;margin-bottom:14px}
  p.muted{color:var(--muted)}
  .big{font-size:30px;line-height:1.3}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;line-height:1.45;padding:12px 0 12px 30px;position:relative;
    border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:21px;width:14px;height:3px;
    background:var(--accent);border-radius:2px}
  li b{font-family:var(--head);font-weight:600}
  .pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:15px;
    color:var(--accent);border:1px solid var(--accent);border-radius:999px;
    padding:6px 14px;margin-bottom:22px}
  .foot{position:absolute;right:28px;bottom:20px;font-size:12px;color:var(--muted);
    letter-spacing:.04em}
  .num{position:absolute;left:28px;bottom:20px;font-size:12px;color:var(--muted)}
  .disc{font-size:15px;color:var(--muted);max-width:66ch;margin-top:18px}
  .cta .big{color:var(--accent)}
  @media(max-width:640px){.slide{padding:40px 26px}h1{font-size:34px}h2{font-size:27px}p{font-size:17px}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const S=[
 {t:'title', cls:'title', html:`
   <span class="pill">iLLIMITABLE</span>
   <h1>The Work-Life Harmony Blueprint</h1>
   <p class="big">How business owner dads stop treading water, without the business stalling.</p>
   <p class="muted">A live session with Andy Casey</p>`},

 {t:'who', html:`
   <div class="kicker">Who this is for</div>
   <h2>You built it to give them a better life</h2>
   <p>You are self-employed. The business is doing well. From the outside it looks like you have it handled.</p>
   <p>Inside, you are watching the family connection and the business pull against each other, and family keeps losing. You tell yourself you will be present at the weekend. The weekend comes and you are still half at the desk.</p>`},

 {t:'trap', html:`
   <div class="kicker">The trap</div>
   <h2>It is not a time problem</h2>
   <p>Most dads reach for another system. A new planner, an earlier alarm, a tighter calendar. It holds for a week, then the old pattern wins again.</p>
   <p class="big">The calendar was never the thing running the show.</p>`},

 {t:'reframe', html:`
   <div class="kicker">The reframe</div>
   <h2>Something else is running the show</h2>
   <p>Underneath the long hours are the automatic thoughts, the hidden beliefs, and the patterns you have never questioned. "If I stop, it falls apart." "They are fine." "This is just what providing looks like."</p>
   <p class="big">Change those and the hours take care of themselves.</p>`},

 {t:'part', cls:'title', html:`<div class="kicker">Part one</div><h1>The core problem</h1>`},

 {t:'p1a', html:`
   <h2>The high-functioning imposter</h2>
   <p>You can be thriving on paper and quietly drowning underneath. The self-doubt does not show up as panic. It shows up as never switching off, as proving, as one more email when everyone is asleep.</p>
   <p>Left alone, that voice sets your hours for you.</p>`},

 {t:'p1b', html:`
   <h2>The operating system</h2>
   <p>You run your life on an operating system you did not choose on purpose. It was built from old rules about work, worth, and what a good provider does.</p>
   <p>You cannot out-plan an operating system. You have to open it up and rebuild it.</p>`},

 {t:'part2', cls:'title', html:`<div class="kicker">Part two</div><h1>The Blueprint</h1><p class="big">Six pillars I take every client through.</p>`},

 {t:'pillar1', html:`
   <div class="kicker">Pillar one, Foundation</div>
   <h2>The Work-Life Harmony Blueprint</h2>
   <p>Start with an honest map of where you actually are, then build the frame where work and home can both hold their ground instead of one always losing.</p>`},

 {t:'pillar2', html:`
   <div class="kicker">Pillar two, Mindset</div>
   <h2>De-weed the garden of your mind</h2>
   <p>Find the automatic thoughts, hidden beliefs, and patterns that keep you stuck, and pull them out at the root. This is the pillar that changes everything above it.</p>`},

 {t:'pillar3', html:`
   <div class="kicker">Pillar three, Vision</div>
   <h2>Creating your vision of the future</h2>
   <p>Get specific about the life you are actually building toward, so your days point somewhere on purpose instead of just answering whatever is loudest.</p>`},

 {t:'pillar4', html:`
   <div class="kicker">Pillar four, Action</div>
   <h2>The reality of change</h2>
   <p>Turn insight into three deliberate priorities, not another endless list. Small, chosen actions, done repeatedly, are what move a life.</p>`},

 {t:'pillar5', html:`
   <div class="kicker">Pillar five, Strengths</div>
   <h2>Intuitive powered passion</h2>
   <p>Build momentum from your real strengths and natural energy rather than willpower alone. Willpower runs out. The right fuel does not.</p>`},

 {t:'pillar6', html:`
   <div class="kicker">Pillar six, Intention</div>
   <h2>Using intention to create a life you love</h2>
   <p>Make the shift a daily practice and part of who you are, not a habit you have to keep topping up. This is where boundaries finally hold.</p>`},

 {t:'part3', cls:'title', html:`<div class="kicker">Part three</div><h1>When the lines hold</h1>`},

 {t:'lines', html:`
   <h2>You draw your lines, and you keep them</h2>
   <ul>
     <li><b>Evenings come home.</b> You are present when you are present, not half at the inbox.</li>
     <li><b>The business serves the life.</b> It runs around the life you chose, not the other way round.</li>
     <li><b>The quiet gets quieter.</b> The proving voice loses its grip on your hours.</li>
   </ul>`},

 {t:'why', html:`
   <div class="kicker">Why me</div>
   <h2>I have been the dad treading water</h2>
   <p>Thriving business, loving family, and underneath it all, drowning in self-doubt. I rebuilt my own operating system first. Now, as an NLP Master Practitioner, I take business owner dads through the same work, tailored fully to their setup.</p>`},

 {t:'cta', cls:'cta', html:`
   <span class="pill">Your next step</span>
   <h1>Ready to draw your lines?</h1>
   <p class="big">Start with the free 3-Minute Life Audit, then let's talk about your next twelve weeks.</p>
   <p class="muted">illimitable.co.uk</p>
   <p class="disc">This session is educational. No income, role, or outcome is guaranteed. Results vary from person to person and depend on your own effort and circumstances.</p>`}
];

const wrap=document.getElementById('wrap');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.cls||'');
  d.innerHTML=s.html+`<span class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span><span class="foot">iLLIMITABLE</span>`;
  wrap.appendChild(d);
});
</script>
</body>
</html>
