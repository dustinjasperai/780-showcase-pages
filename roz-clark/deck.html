<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fulfillment Gap — A Masterclass with Roz Clark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17111f;        /* deep aubergine, from her brand purple family (brand.json) */
    --panel:#211830;
    --rule:#3d2d52;
    --accent:#b06fd6;    /* lilac, brightened from #8e44ad / #dcb3e6 */
    --ink:#f4ecfa;
    --muted:#b9a9c9;
    --serif:'Prata',Georgia,serif;
    --sans:'Nunito Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0912;color:var(--ink);font-family:var(--sans);font-weight:300;
    line-height:1.5;padding:40px 16px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:60px 58px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;
    border:1px solid var(--rule);border-radius:50%;opacity:.5}
  .slide::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
    border:1px solid var(--accent);border-radius:50%;opacity:.35}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px;position:relative;z-index:1}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.08;
    letter-spacing:-.01em;position:relative;z-index:1}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.14;
    position:relative;z-index:1}
  .lede{font-size:21px;color:var(--muted);margin-top:22px;max-width:40ch;position:relative;z-index:1}
  .big{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.22;
    max-width:24ch;position:relative;z-index:1}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:18px;
    position:relative;z-index:1}
  li{font-size:20px;padding-left:30px;position:relative;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;
    background:var(--accent);border-radius:50%}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:16px;margin-top:4px}
  .num{font-family:var(--serif);font-size:16px;color:var(--accent);font-weight:600;
    position:relative;z-index:1;margin-bottom:14px}
  .note{font-size:14px;color:var(--muted);margin-top:30px;position:relative;z-index:1;
    border-top:1px solid var(--rule);padding-top:16px;max-width:60ch}
  .cta h1{font-size:46px}
  .step{display:flex;gap:22px;align-items:flex-start;position:relative;z-index:1}
  .step .k{font-family:var(--serif);font-size:30px;color:var(--accent);min-width:54px}
  .foot{position:absolute;bottom:26px;left:58px;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);z-index:1}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A Live Masterclass with Roz Clark',h:'The Fulfillment Gap',lede:'Why high-achieving women can have everything they worked for and still feel trapped, and the inside-out work that closes the gap.'},
 {t:'who',eyebrow:'Who this is for',h:'You did the hard part already.',lede:'The career. The business. The recognition. The life that looks, from the outside, like the one you always wanted.'},
 {t:'trap',eyebrow:'The quiet trap',big:'And somewhere in the middle of it, a question you do not say out loud: is this really it?'},
 {t:'reframe',eyebrow:'The reframe',h:'Achievement is not the same as fulfillment.',lede:'They feel like they should arrive together. They almost never do. One is what you build. The other is what you have to come home to.'},
 {t:'part',num:'Part One',h:'Why the next win never fixes it'},
 {t:'body',eyebrow:'The achievement treadmill',big:'Every goal you reach resets the finish line. The win fades in a week and the striving starts again.',note:'High achievers are trained to chase the external marker. The marker is not the problem. Mistaking it for fulfillment is.'},
 {t:'body',eyebrow:'What actually got buried',h:'Freedom. Fulfillment. Connection. Purpose.',lede:'These are not rewards you earn after the next launch. They are the things the striving quietly crowded out, and they are the real work.'},
 {t:'part',num:'Part Two',h:'The Awaken Method: finding your way back from the inside out'},
 {t:'steps',eyebrow:'Three moves',h:'Realign. Reconnect. Refocus.',steps:[
   {k:'01',b:'Realign',d:'Name what you actually want now, not what you wanted at twenty five. Most of the trapped feeling is living out an old definition of success.'},
   {k:'02',b:'Reconnect',d:'Come back to purpose and to the people who matter. Fulfillment is relational and meaning-driven, never just performance.'},
   {k:'03',b:'Refocus',d:'Rebuild the calendar and the commitments around fulfillment, not only the next win. This is where freedom becomes real.'}
 ]},
 {t:'body',eyebrow:'The 12-Step Transformation Journey',big:'A structured path from stuck to aligned.',note:'The three moves are not a mood. They become a step-by-step journey: limiting beliefs named, old stories retired, and a clear next chapter defined and acted on.'},
 {t:'body',eyebrow:'Healthy Selfish',h:'Prioritizing yourself is not the betrayal you were taught it was.',lede:'The over-giving high achiever has to learn that filling her own cup is the responsible move, not the indulgent one. Nothing changes until this does.'},
 {t:'part',num:'Part Three',h:'When the fulfillment gap finally closes'},
 {t:'body',eyebrow:'From the inside out',big:'Same ambition. Entirely different relationship to it.',note:'You keep the drive. You lose the dread. The work still matters, and for the first time it is pointed at a life you actually want to be inside of.'},
 {t:'who',eyebrow:'Why me',h:'Transforming lives and businesses from the inside out.',lede:'Thirty years across the arts, corporate, and community, a published author on conquering fear with faith, and a coach whose whole practice is this one gap between achievement and fulfillment.'},
 {t:'body',eyebrow:'Name your next',h:'The question is no longer whether you have arrived.',lede:'It is what you want the next chapter to be for, now that you get to choose it on purpose.'},
 {t:'cta',eyebrow:'Your next step',h:'Come do the inside-out work with me.',lede:'If the fulfillment gap is yours, the Awaken path is built to close it. Let us name your next, together.',
   note:'Educational content only. Coaching supports personal growth and is not therapy, medical, or financial advice. Individual results vary and are not guaranteed.'}
];
const deck=document.getElementById('deck');
for(const s of S){
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num) h+=`<div class="num">${s.num}</div>`;
  if(s.h) h+= (s.t==='title'||s.t==='reframe'||s.t==='cta') ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`;
  if(s.big) h+=`<div class="big">${s.big}</div>`;
  if(s.lede) h+=`<p class="lede">${s.lede}</p>`;
  if(s.steps){h+='<ul>';for(const st of s.steps){h+=`<li><div class="step"><div class="k">${st.k}</div><div><b>${st.b}</b><span>${st.d}</span></div></div></li>`}h+='</ul>';}
  if(s.note) h+=`<div class="note">${s.note}</div>`;
  h+=`<div class="foot">Roz Clark</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
}
</script>
</body>
</html>
