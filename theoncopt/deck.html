<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Finish Your Oncology Case Report, and Actually Pass the Boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8fafc; --panel:#eef3f8; --ink:#2d3340; --muted:#5b6673;
    --accent:#0170b9; --accent2:#23bfcb; --rule:#d6e1ec;
    --display:"Cormorant Garamond",Georgia,serif; --body:"Montserrat",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #deck{height:100vh;width:100vw;position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7vmin 9vmin;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:1.5vmin;color:var(--accent);margin-bottom:2.4vmin}
  h1{font-family:var(--display);font-weight:700;font-size:7.2vmin;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:5vmin;line-height:1.08}
  .sub{font-size:2.2vmin;color:var(--muted);margin-top:3vmin;max-width:46ch;line-height:1.5}
  .big{font-family:var(--display);font-weight:600;font-size:5.4vmin;line-height:1.12;max-width:20ch}
  .lead{font-size:2.3vmin;line-height:1.55;max-width:50ch;color:var(--ink)}
  .lead strong{color:var(--accent)}
  .part-label{font-family:var(--body);font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--accent2);font-size:1.7vmin;margin-bottom:2vmin}
  .pill{display:inline-flex;align-items:center;gap:1.2vmin;background:var(--panel);
    border:1px solid var(--rule);border-radius:999px;padding:1vmin 2.2vmin;font-weight:600;
    font-size:1.7vmin;color:var(--accent);margin-bottom:3vmin}
  .dot{width:1.3vmin;height:1.3vmin;border-radius:50%;background:var(--accent2)}
  ul{list-style:none;margin-top:3vmin;display:flex;flex-direction:column;gap:1.8vmin}
  li{display:flex;gap:1.8vmin;align-items:flex-start;font-size:2.1vmin;line-height:1.45;max-width:52ch}
  li .n{flex:0 0 auto;width:3.4vmin;height:3.4vmin;border-radius:50%;background:var(--accent);
    color:#fff;font-weight:700;font-size:1.7vmin;display:flex;align-items:center;justify-content:center;
    font-family:var(--body)}
  .pillar-no{font-family:var(--display);font-weight:700;font-size:3vmin;color:var(--accent2)}
  .why li .n{background:var(--accent2)}
  .disc{margin-top:4vmin;font-size:1.5vmin;color:var(--muted);max-width:60ch;line-height:1.5}
  .cta-line{font-size:2.3vmin;color:var(--ink);margin-top:3vmin}
  .cta-line strong{color:var(--accent)}
  .spine{position:absolute;left:9vmin;top:7vmin;bottom:7vmin;width:2px;background:var(--rule)}
  .nums{position:absolute;right:5vmin;bottom:4vmin;font-size:1.5vmin;color:var(--muted);font-weight:600}
  .brandmark{position:absolute;left:9vmin;bottom:4vmin;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;font-size:1.4vmin;color:var(--accent)}
  .nav{position:absolute;right:5vmin;top:4vmin;display:flex;gap:1.2vmin;z-index:5}
  .nav button{background:var(--panel);border:1px solid var(--rule);color:var(--accent);
    border-radius:8px;width:4.2vmin;height:4.2vmin;font-size:2vmin;cursor:pointer}
  .accentbar{height:.8vmin;width:12vmin;background:linear-gradient(90deg,var(--accent),var(--accent2));
    border-radius:4px;margin-top:4vmin}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav"><button id="prev">&larr;</button><button id="next">&rarr;</button></div>
<script>
const S = [
  {t:'title', html:`<div class="kick">A TheOncoPT Masterclass &middot; Dr. Elise Cantu, PT, DPT</div>
    <h1>How to Finish Your Oncology Case Report,<br>and Actually Pass the Boards</h1>
    <div class="accentbar"></div>
    <div class="sub">The certification path for physical therapists who already treat people with cancer, and are done waiting to feel ready.</div>`},

  {t:'who', html:`<div class="part-label">Who this is for</div>
    <h2>The PT who keeps meaning to get certified</h2>
    <div class="sub">You already see oncology patients, or you know you will. You want the board certification. And the application has been sitting on your someday list for a year or more.</div>`},

  {t:'reframe', html:`<div class="kick">The honest part</div>
    <div class="big">You will never feel ready enough to start. That is exactly why so few PTs ever finish.</div>`},

  {t:'part', html:`<div class="part-label">Part One</div>
    <h2>Why the case report is where everyone stalls</h2>
    <div class="sub">It is the one requirement with no fixed template and no deadline pushing you. So it waits.</div>`},

  {t:'body', html:`<div class="pill"><span class="dot"></span>The real bottleneck</div>
    <p class="lead">Most PTs do not stall on the exam content. They stall on the <strong>case report</strong>, the open ended piece where you have to pick a patient, map it to a rubric you have never seen, and write it with nobody checking in on you.</p>`},

  {t:'body', html:`<div class="pill"><span class="dot"></span>The mastery myth</div>
    <p class="lead">The trap is telling yourself you will start <strong>once you know enough</strong>. Oncology never stops evolving, so that day never arrives, and the certification keeps slipping another year.</p>`},

  {t:'part', html:`<div class="part-label">Part Two</div>
    <h2>The system: finish by layering, not by cramming</h2>
    <div class="sub">Four pillars that turn an overwhelming requirement into a plan you can actually keep.</div>`},

  {t:'pillar', html:`<div class="pillar-no">Pillar 01</div>
    <h2>The Developmental Spiral</h2>
    <p class="lead">You become the specialist by going <strong>through</strong> the process, not before it. You meet the material in passes, through the podcast, the lectures, the textbooks, and real patients, and each pass goes deeper. Mastery is the output, not the entry fee.</p>`},

  {t:'pillar', html:`<div class="pillar-no">Pillar 02</div>
    <h2>Strategic Resource Use</h2>
    <p class="lead">The 35 plus page resource list is a <strong>toolbox for your weak areas</strong>, not a reading list to finish. You pull the tool you need, when you need it, instead of trying to read everything and drowning.</p>`},

  {t:'pillar', html:`<div class="pillar-no">Pillar 03</div>
    <h2>Organizational Scaffolding</h2>
    <p class="lead">Roughly fifty short lectures, chunked by cancer type and by function like mobility and exercise safety, with <strong>checkpoints</strong> so the volume stops paralyzing you. You always know the next small thing to do.</p>`},

  {t:'pillar', html:`<div class="pillar-no">Pillar 04</div>
    <h2>The 3-Step Finished Case Report</h2>
    <ul>
      <li><span class="n">1</span><span>Start from the patient you already have, not the perfect one you are waiting for.</span></li>
      <li><span class="n">2</span><span>Map that case to the ABPTS rubric so every required element has a home.</span></li>
      <li><span class="n">3</span><span>Write to the checklist, not to perfection, and submit.</span></li>
    </ul>`},

  {t:'part', html:`<div class="part-label">Part Three</div>
    <h2>The quarter you finally get certified</h2>`},

  {t:'body', html:`<div class="pill"><span class="dot"></span>On paper</div>
    <p class="lead">A finished, ABPTS standard case report. A study plan you can actually keep around a real career and family. And a <strong>date on the calendar</strong> instead of a someday.</p>`},

  {t:'body', html:`<div class="pill"><span class="dot"></span>In your practice</div>
    <p class="lead">You stop being the PT who <strong>does some oncology</strong> and become the board certified specialist the hospital, the surgeons, and the survivors get referred to.</p>`},

  {t:'why', html:`<div class="part-label">Why learn this from me</div>
    <h2>Dr. Elise Cantu, PT, DPT</h2>
    <ul class="why">
      <li><span class="n">&#10003;</span><span>Board certified oncologic clinical specialist and LANA certified lymphedema therapist.</span></li>
      <li><span class="n">&#10003;</span><span>Host of TheOncoPT Podcast and founder of Fort Worth Cancer Care.</span></li>
      <li><span class="n">&#10003;</span><span>Courses CEU approved in 40 plus states, built specifically for the certification path.</span></li>
    </ul>`},

  {t:'recap', html:`<div class="kick">The path, in one slide</div>
    <h2>Layer it. Target your gaps. Scaffold the study. Finish the report.</h2>
    <div class="sub">That is how a busy clinician actually becomes a board certified oncology specialist, this year rather than someday.</div>`},

  {t:'cta', html:`<div class="kick">Your next step</div>
    <h1>Start your certification</h1>
    <div class="cta-line">Join the free live masterclass, then begin the <strong>Case Report Writing Workshop</strong> at <strong>theoncopt.com</strong>.</div>
    <div class="disc">Educational content for licensed rehabilitation clinicians. No income, role, referral, exam, or certification result is guaranteed, and results vary by individual effort, caseload, and board requirements. Always follow current ABPTS application standards and your own clinical judgment.</div>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{const d=document.createElement('section');d.className='slide'+(s.cls?' '+s.cls:'');
  d.innerHTML=s.html+'<div class="spine"></div><div class="brandmark">TheOncoPT</div>'+
  '<div class="nums">'+(i+1)+' / '+S.length+'</div>';deck.appendChild(d);});
let i=0;const slides=[...document.querySelectorAll('.slide')];
function show(n){i=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
show(0);
</script>
</body>
</html>
