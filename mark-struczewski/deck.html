<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Build the Day, Not the To-Do List · Mark Struczewski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f3efe7; --panel:#e9e3d7; --rule:#d6cfc0;
    --acc:#1a1a1a; --ink:#1a1a1a; --ink-soft:#45423b; --ink-muted:#8a8478; --paper:#faf8f3;
  }
  html,body{height:100%}
  body{background:#20201d;font-family:'DM Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#20201d}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.14;letter-spacing:-.008em}
  .t-title h1{font-size:4.3vw;max-width:90%}
  .t-normal h1{font-size:3.25vw;max-width:84%}
  .t-normal .body{font-size:1.48vw;color:var(--ink-soft);margin-top:2.6vh;max-width:72%;line-height:1.56;font-weight:400}
  .sub{font-size:1.72vw;color:var(--ink-soft);margin-top:3.2vh;max-width:74%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'DM Sans',sans-serif;font-size:1.34vw;font-weight:600;color:var(--ink-muted);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:var(--ink);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:86%;font-style:italic;color:var(--ink)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--ink);color:var(--ink);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--ink-muted);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .rhythm{position:absolute;pointer-events:none}
  .title-rhythm{right:8.4%;left:8.4%;bottom:11%;height:2px;background:var(--rule)}
  .title-rhythm i{position:absolute;top:50%;width:9px;height:9px;background:var(--ink);border-radius:50%;transform:translate(-50%,-50%)}
  .corner-rhythm{right:8.4%;width:11vw;bottom:8%;height:2px;background:var(--rule)}
  .corner-rhythm i{position:absolute;top:50%;width:7px;height:7px;background:var(--ink);border-radius:50%;transform:translate(-50%,-50%)}
  .brandline{font-size:1.28vw;color:var(--ink-soft);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--ink);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--ink);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--ink-muted);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink-muted);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count"></div>
<div class="brand-foot">Mister Productivity</div>
<div class="hint" id="hint">Click or press &rarr;</div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<script>
const S=[
 {t:'title',title:'Build the Day, Not the To-Do List',sub:'A live masterclass on running a focused, calm workday on purpose, for busy entrepreneurs and leaders who are tired of ending the day behind.',brand:true,rhythm:'title'},
 {t:'normal',k:'Who this is for',title:'You are busy. You are also behind.',body:'You run the business, or a big piece of it. The days are full from the first message to the last, and yet the work that actually matters keeps sliding to tomorrow. More hours have stopped helping.'},
 {t:'dark',title:'A longer to-do list has never once bought you a calmer day.'},
 {t:'section',idx:'Part One',title:'Why the List Keeps Winning'},
 {t:'normal',k:'The list is bottomless',title:'A to-do list is a place tasks go to multiply.',body:'It captures everything and prioritizes nothing. So the loudest, newest, and easiest items get done, and the few that would actually move things forward wait at the bottom where they are safe from you.'},
 {t:'normal',k:'Motivation is unreliable',title:'You cannot schedule the mood to do hard work.',body:'Motivation shows up late and leaves early. Anything you can only do when you feel like it is a task you will mostly not do. Willpower is not a plan, it is the thing you run out of by 2pm.'},
 {t:'normal',k:'Busy is not the same as productive',title:'Motion feels like progress. Often it is the opposite.',body:'A day packed with small, urgent things can leave every important thing exactly where it started. Being busy is easy. Being clear about what deserves the hour is the hard, valuable part.'},
 {t:'dark',title:'You do not have a time problem. You have a decisions problem.'},
 {t:'section',idx:'Part Two',title:'A Day You Design'},
 {t:'normal',k:'Clarity over busyness',title:'Decide what matters before the day decides for you.',body:'Most of the leak is invisible: reactive work, half-finished switches, tasks that were never yours to do. Naming the few outcomes that actually count is the first move, and it is the one almost nobody makes.'},
 {t:'normal',k:'The ODAE Method',title:'Most of your list should not be done by you.',body:'Run every recurring task through four filters. Outsource it, delegate it, automate it, or eliminate it. What survives all four is the short list of work only you can do. That is where your hours belong.'},
 {t:'normal',k:'Discipline over motivation',title:'Build the routine so the day does not need a hero.',body:'A morning that sets the priorities and an end-of-day ritual that closes the loops mean the right work happens because the system carries it, not because today you happened to feel sharp.'},
 {t:'normal',k:'Guard the focused block',title:'Protect one block the way you protect a meeting.',body:'One defended stretch of deep focus, same time, same rules, beats a whole day of fractured attention. You would not cancel a client call for a notification. Treat the work that matters the same way.'},
 {t:'dark',title:'A good system makes the right thing the easy thing.'},
 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The week this builds',title:'Fewer open loops, and an evening that is actually yours.',body:'You still work hard. You just stop carrying the whole list in your head. The important work moves every day, the busywork has somewhere else to go, and you leave the desk knowing the day was spent on purpose.'},
 {t:'dark',title:'Time is a gift. The point of a system is to stop wasting it.'},
 {t:'normal',k:'Why Mark Struczewski',title:'Simple systems, real results, no fluff.',body:'Mark Struczewski, Mister Productivity, has coached professionals since 2011 and helped hundreds of them take back their days. He is not a hack collector. He teaches the disciplined routines and clear priorities he runs himself, starting at 4am.'},
 {t:'section',idx:'Your Next Step',title:'Design Your Day With Mark'},
 {t:'cta',title:'Ready to run the day instead of chasing it?',chips:['Apply for a free Clarity Call','Start with one focused block tomorrow'],disc:'Educational content for busy professionals and business owners. No specific income, output, or result is guaranteed. Results vary by person, role, and how consistently the systems are applied.'},
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='slide t-'+s.t;
  let h='';
  if(s.k) h+='<div class="kicker">'+s.k+'</div>';
  if(s.idx) h+='<div class="idx">'+s.idx+'</div>';
  h+='<h1>'+s.title+'</h1>';
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.body) h+='<div class="body">'+s.body+'</div>';
  if(s.brand) h+='<div class="brandline"><b>Mister Productivity</b> &middot; Mark Struczewski</div>';
  if(s.t==='section') h+='<div class="rule"></div>';
  if(s.chips){h+='<div class="chips">';s.chips.forEach(c=>h+='<div class="chip">'+c+'</div>');h+='</div>';}
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  if(s.rhythm==='title') h+='<div class="rhythm title-rhythm"><i style="left:12%"></i><i style="left:50%"></i><i style="left:88%"></i></div>';
  else if(s.t==='normal') h+='<div class="rhythm corner-rhythm"><i style="left:18%"></i><i style="left:50%"></i><i style="left:82%"></i></div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
let cur=0;const slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('bar'),count=document.getElementById('count'),hint=document.getElementById('hint');
function show(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/S.length*100)+'%';count.textContent=(cur+1)+' / '+S.length;if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
show(0);
</script>
</body>
</html>
