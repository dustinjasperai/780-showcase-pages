<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winning the International Show Floor | A Global Exhibitor Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7;
    --panel:#2c3338;
    --rule:#d9d7d2;
    --ink:#26292d;
    --muted:#5c6066;
    --accent:#fc3f1e;
    --display:'Open Sans',system-ui,sans-serif;
    --text:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:none}
  .slide{
    min-height:100vh;width:100%;padding:8vh 9vw;display:flex;flex-direction:column;justify-content:center;
    border-bottom:1px solid var(--rule);position:relative;scroll-snap-align:start;
  }
  .deck{scroll-snap-type:y proximity}
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,5.6vw,4.6rem);line-height:1.04;letter-spacing:-.01em;color:var(--ink)}
  h2{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.8vw,3rem);line-height:1.08;letter-spacing:-.01em;color:var(--ink)}
  .sub{font-size:clamp(1.05rem,1.7vw,1.4rem);color:var(--muted);max-width:44ch;margin-top:1.6rem;font-weight:400}
  .body{font-size:clamp(1.05rem,1.5vw,1.28rem);max-width:52ch;margin-top:1.4rem;color:var(--ink)}
  .body p+p{margin-top:1rem}
  .foot{font-family:var(--display);font-weight:600;font-size:.86rem;color:var(--muted);position:absolute;bottom:5vh;left:9vw;letter-spacing:.02em}
  .num{position:absolute;top:6vh;right:9vw;font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--rule)}
  .tick{display:inline-block;width:2.4rem;height:.32rem;background:var(--accent);margin-bottom:1.8rem;border-radius:2px}
  ul{list-style:none;margin-top:1.6rem;max-width:54ch}
  li{position:relative;padding-left:1.7rem;margin-bottom:1rem;font-size:clamp(1.02rem,1.4vw,1.22rem)}
  li:before{content:"";position:absolute;left:0;top:.55em;width:.62rem;height:.62rem;background:var(--accent);border-radius:1px;transform:rotate(45deg)}
  li b{font-weight:700}
  .lede{font-size:clamp(1.3rem,2.3vw,1.9rem);line-height:1.25;max-width:40ch;font-family:var(--display);font-weight:600}
  .slide.dark{background:var(--panel);color:#f3f2ef;border-bottom-color:#3a4148}
  .slide.dark h1,.slide.dark h2{color:#fff}
  .slide.dark .sub,.slide.dark .foot,.slide.dark .num{color:#aeb3b8}
  .slide.dark .body{color:#e7e6e3}
  .dims{display:grid;grid-template-columns:1fr;gap:.9rem;margin-top:1.6rem;max-width:60ch}
  .disc{margin-top:2.4rem;font-size:.82rem;color:var(--muted);max-width:52ch;line-height:1.5}
  .cta-step{font-family:var(--display);font-weight:700;color:var(--accent);font-size:clamp(1.1rem,1.7vw,1.4rem);margin-top:1.6rem}
  @media(max-width:640px){.slide{padding:7vh 8vw}.foot{left:8vw}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A Global Exhibitor Masterclass',
   h:'Winning the International Show Floor',
   sub:'Why the booth that fills your pipeline in Dallas can quietly stall in Düsseldorf, Dubai, or Tokyo, and how to read a market before the crates ship.',
   foot:'Presented by Jeff Hannah, Founder of Global Exhibitor'},

  {t:'who',
   kicker:'Who this is for',
   h:'You already know how to run a great show at home.',
   body:['Corporate exhibit and event managers, exhibit houses, and the marketing and design teams behind them. People who have staffed a booth, hit a lead target, and know what a strong domestic program feels like.',
         'This session is about the moment that program crosses a border, and the assumptions that quietly stop working when it does.']},

  {t:'trap',
   kicker:'The trap',
   h:'You export the booth. You forget to export the behavior.',
   body:['The graphics get translated. The stand gets shipped. The staff fly out with the same playbook that has always worked.',
         'Then the floor goes quiet. Fewer conversations, slower ones, a lead count that does not match the spend, and no obvious reason why. The booth looks right. The results do not.']},

  {t:'hook', dark:true,
   kicker:'A harder truth',
   lede:'On an international floor, your booth is not being read the way you designed it. It is being read the way the local culture reads a stranger who wants their time.'},

  {t:'part',
   kicker:'Part One',
   h:'The core problem',
   body:['All business is conducted inside a culture. A trade show is the most compressed version of that fact there is: thousands of strangers, seconds to earn attention, every unwritten rule of the host country in full force.',
         'The domestic playbook is not wrong. It is just local. It encodes one culture’s answers to who approaches whom, how fast to get to the point, and what makes a stranger trustworthy. Change the country and those answers change.']},

  {t:'part2intro',
   kicker:'Part One, continued',
   h:'What actually breaks abroad',
   items:['<b>The open.</b> A hard, direct greeting that reads as confident at home can read as pushy, or as skipping a step, somewhere else.',
          '<b>The staffing.</b> A flat, everyone-sells booth crew can confuse a visitor who expects to be received by someone of matching seniority.',
          '<b>The pace.</b> Rushing to the ask can end a conversation that was meant to build for two or three visits before any business is discussed.',
          '<b>The design.</b> Layout, hierarchy, even how much empty space signals status, all carry meaning that shifts by market.']},

  {t:'part',
   kicker:'Part Two',
   h:'The Global Exhibitor approach: read the room before you build it',
   body:['I use a small set of cultural dimensions, drawn from decades of cross-cultural research and sharpened on real show floors in more than fifty countries, and I apply them to one narrow question:',
         'How must this booth, this crew, and this conversation change for the market we are walking into? Five dimensions do most of the work.']},

  {t:'dim',
   kicker:'Dimension 1',
   h:'Power distance',
   body:['How much a culture expects and respects hierarchy. In high power-distance markets, a decision-maker will not engage a junior booth-staffer, and a peer-to-peer approach can stall before it starts.'],
   items:['Match seniority to the visitor. Have the right person visible and reachable.',
          'Signal rank in how the booth is staffed and how introductions are made.']},

  {t:'dim',
   kicker:'Dimension 2',
   h:'Individualism and collectivism',
   body:['Whether people present as individuals or as a group. In collectivist markets, buyers arrive as delegations, decisions are shared, and the relationship is with the company, not one contact.'],
   items:['Design for groups, not solo prospects. Give a delegation room to confer.',
          'Do not force a single name onto a decision that the group will make together.']},

  {t:'dim',
   kicker:'Dimension 3',
   h:'Communication: direct, indirect, and unspoken',
   body:['How much meaning lives in the words versus the context. Direct cultures want the point fast. High-context cultures carry the real message in tone, silence, and what is politely left unsaid.'],
   items:['Read the non-verbal signals, not just the answers you are given.',
          'Adjust how hard, and how soon, you make the ask.']},

  {t:'dim',
   kicker:'Dimension 4',
   h:'Uncertainty avoidance',
   body:['How comfortable a culture is with ambiguity and risk. In high uncertainty-avoidance markets, a loose pitch and a vague next step read as unserious, and trust comes from structure and proof.'],
   items:['Bring detail, process, and credentials to the booth, not just a promise.',
          'Offer a clear, low-risk next step rather than an open-ended one.']},

  {t:'dim',
   kicker:'Dimension 5',
   h:'Relationship and time',
   body:['How a culture treats age, seniority, and the pace of trust. In many markets business follows relationship, not the reverse, and the first meeting is meant to earn the second, not to close.'],
   items:['Plan for a multi-touch arc across the show, not a one-visit close.',
          'Let respect for age and standing shape who opens the conversation.']},

  {t:'synth',
   kicker:'Putting it together',
   h:'Cultural intelligence is a preparation, not an improvisation',
   body:['The teams that win abroad do not read the room on the fly. They study the market before the show, brief the crew on these dimensions, and design the booth and the conversation around them.',
         'That preparation is the skill. It is learnable, it is repeatable, and it is the difference between a booth that travels and a booth that only works at home.']},

  {t:'part',
   kicker:'Part Three',
   h:'A booth that behaves like it belongs there',
   body:['A team that has done this walks in already knowing who should greet whom, how fast to move, what the layout is saying, and what a good first conversation is actually for in that market.',
         'The stand is the same quality it always was. What changes is that it now behaves like it belongs there.']},

  {t:'contrast',
   kicker:'The shift',
   h:'Same booth. Different behavior.',
   items:['<b>Before:</b> one playbook, flown everywhere, judged only by the lead count it used to hit at home.',
          '<b>After:</b> a booth briefed to the market, a crew that reads the room on purpose, and conversations that go the way that market expects them to go.']},

  {t:'why',
   kicker:'Why me',
   h:'I have built these environments in more than fifty countries.',
   body:['I am an industrial designer by training, a past VP of international, creative, and strategy at a major exhibit house, and a former president of an international exhibitions company. I have produced branded experiences across the US, UK, UAE, and beyond, and I have lectured on this in the industry.'],
   items:['Global Exhibitor: coaching, the Trade Show Basics course, and the industry podcast.',
          'Cultural Intelligence development, built specifically for exhibit and event teams.']},

  {t:'recap',
   kicker:'The takeaway',
   h:'The floor is culture, compressed.',
   body:['Translate the behavior, not just the graphics. Match seniority, design for how the market decides, read what is unspoken, bring structure where it earns trust, and let relationship set the pace.',
         'Do that before the crates ship, and the booth that wins at home starts winning abroad too.']},

  {t:'cta',
   kicker:'Your next step',
   h:'Take your exhibit program international, on purpose.',
   body:['If your team is exhibiting in new markets, or wants to, this is exactly what I coach. We map the markets you are walking into, brief your crew on the dimensions that matter, and design the booth and the conversation to fit.'],
   step:'Book a coaching conversation with Global Exhibitor, or join the next Trade Show Basics course.',
   disc:'This masterclass is educational. It describes an approach to cross-cultural exhibiting and does not promise or guarantee any specific business, sales, or financial result. Outcomes depend on your markets, team, and execution.',
   foot:'Jeff Hannah · Global Exhibitor · globalexhibitor.com'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.dark ? ' dark' : '');
  let html = '';
  html += '<span class="num">' + String(i+1).padStart(2,'0') + ' / ' + String(S.length).padStart(2,'0') + '</span>';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.t === 'title' || s.t === 'hook') html += '<span class="tick"></span>';
  if (s.lede) html += '<p class="lede">' + s.lede + '</p>';
  if (s.h) html += (s.t === 'title' ? '<h1>' : '<h2>') + s.h + (s.t === 'title' ? '</h1>' : '</h2>');
  if (s.sub) html += '<p class="sub">' + s.sub + '</p>';
  if (s.body) { html += '<div class="body">'; s.body.forEach(p => html += '<p>' + p + '</p>'); html += '</div>'; }
  if (s.items) { html += '<ul>'; s.items.forEach(it => html += '<li>' + it + '</li>'); html += '</ul>'; }
  if (s.step) html += '<p class="cta-step">' + s.step + '</p>';
  if (s.disc) html += '<p class="disc">' + s.disc + '</p>';
  if (s.foot) html += '<div class="foot">' + s.foot + '</div>';
  sec.innerHTML = html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
