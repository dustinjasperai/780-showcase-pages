<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Licensing-Ready Portfolio — Creative Studio Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f1;        /* cream, paper tint of the dominant clay */
    --panel:#f2e9e0;     /* soft clay wash, from #c7a086 */
    --ink:#333333;       /* their body text hex */
    --muted:#666666;     /* their gray */
    --rule:#4f5148;      /* their muted olive-gray */
    --accent:#c7a086;    /* their dominant warm clay */
    --accent2:#96aca7;   /* their dusty sage */
    --head:'Prata',Georgia,serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--bg);border:1px solid #e7ddd1;border-radius:14px;padding:52px 54px;margin:0 0 26px;
    min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--panel), transparent 70%);opacity:.7}
  .kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 18px}
  h1{font-family:var(--head);font-weight:400;font-size:52px;line-height:1.08;margin:0 0 16px;color:var(--rule)}
  h2{font-family:var(--head);font-weight:400;font-size:34px;line-height:1.14;margin:0 0 14px;color:var(--rule)}
  .sub{font-size:20px;color:var(--muted);margin:0 0 8px;max-width:40ch}
  .lead{font-size:22px;max-width:44ch}
  ul{margin:14px 0 0;padding:0 0 0 2px;list-style:none}
  li{position:relative;padding:8px 0 8px 30px;font-size:18px;max-width:52ch}
  li::before{content:"";position:absolute;left:0;top:16px;width:12px;height:12px;border-radius:3px;
    background:var(--accent);transform:rotate(45deg)}
  .swatches{display:flex;gap:10px;margin-top:22px}
  .swatch{width:54px;height:54px;border-radius:8px;border:1px solid #e0d4c6}
  .brief-card{margin-top:22px;background:var(--panel);border:1px solid #e6d8c8;border-radius:12px;padding:18px 20px;max-width:60ch}
  .brief-card b{font-family:var(--head)}
  .num{font-family:var(--head);font-size:20px;color:var(--accent2);margin-right:8px}
  .foot{position:absolute;bottom:16px;left:54px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .disclaimer{margin-top:20px;font-size:13px;color:var(--muted);max-width:60ch;font-style:italic}
  .cta .btn{display:inline-block;margin-top:20px;background:var(--accent);color:#fff;font-weight:700;
    padding:14px 26px;border-radius:30px;font-size:17px}
  .credits{font-size:15px;color:var(--muted);margin-top:26px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass with Creative Studio Collective',
  h:'The Licensing-Ready Portfolio',
  sub:'How surface pattern designers turn monthly briefs into collections that brands actually license.',
  swatch:true,
  credits:'With Ryann Scrafford (Charlie Rowan Designs) and Fleur Crawford (Hufton Studio)'},

 {t:'who',kicker:'Who this is for',
  h:'You can draw. The work just is not getting picked up.',
  lead:'This is for surface pattern designers and illustrators sitting on a folder of art they love, who keep waiting for a brand, a fabric house, or a print-on-demand company to find it.'},

 {t:'trap',kicker:'The trap',
  h:'"Post more and hope a brand finds you."',
  body:['Make a pretty pattern, put it on Instagram, wait.','Enter a few art calls, hear nothing back.','Watch other designers land licenses and assume they simply got lucky.'],
  sub:'Organic reach is not a licensing strategy. It is a slot machine.'},

 {t:'reframe',kicker:'The real reason',
  h:'Talent was never the gap.',
  lead:'A directed, on-trend body of work is. Art directors do not license single pretty tiles. They license cohesive collections that fit what they are buying this season.'},

 {t:'part',kicker:'Part one',
  h:'Why a beautiful sketchbook does not sell',
  body:['A hundred one-off patterns is not a collection.','Nothing is aimed at what brands are actually sourcing right now.','There is no repeatable way to go from blank page to pitch-ready.']},

 {t:'part',kicker:'Part two, the method',
  h:'The Creative Brief',
  sub:'The system at the heart of Creative Studio Collective. You work the way an in-house studio designer works: to a brief, on a cadence.',
  briefcard:'<b>Each monthly brief carries:</b> a trend-aligned mood board, design prompts, and a pitching timeline, so the collection you make is already shaped to what the market wants.'},

 {t:'pillar',kicker:'The Creative Brief, pillar one',
  h:'A trend-aligned prompt, every month',
  lead:'Instead of guessing, you start from a brief built around real industry trends and demand. Direction replaces the blank page.'},

 {t:'pillar',kicker:'The Creative Brief, pillar two',
  h:'Work to the brief, not to your mood',
  lead:'You design the way a studio does: to a defined direction and a deadline. That single shift is what turns scattered art into a marketable, submission-ready collection.'},

 {t:'pillar',kicker:'The Creative Brief, pillar three',
  h:'A cohesive collection, on repeat',
  lead:'Coordinated colours, motifs, and scale that read as one story. That is what a fabric house or print-on-demand brand can actually license.'},

 {t:'part',kicker:'Part two, continued',
  h:'The Art of Pitching',
  sub:'A finished collection sitting on your drive earns nothing. Pitching is a learnable skill, not a personality trait.',
  body:['Ready-to-use pitch emails that get opened and answered.','A clean presentation that shows a collection the way a buyer wants to see it.','Knowing exactly what an art director is deciding when they look.']},

 {t:'pillar',kicker:'Part two, continued',
  h:'Mastering print-on-demand and licensing',
  body:['What print-on-demand brands look for in a submission.','How to differentiate a collection in a crowded catalogue.','How one accepted design becomes an ongoing partnership, not a one-off.']},

 {t:'part',kicker:'Part three',
  h:'What a month actually looks like',
  body:['Week 1: the new brief lands. Mood board and direction set.','Week 2 to 3: build the collection to the brief.','Week 4: package it and pitch, using the templates.','Then the next brief. A body of work that compounds.']},

 {t:'compound',kicker:'The compounding portfolio',
  h:'One brief a month becomes a year of licensable work',
  lead:'Twelve directed collections beat a hundred random tiles. That is the difference between hoping to be found and having a portfolio built to be bought.',
  swatch:true},

 {t:'why',kicker:'Why learn this from us',
  h:'We license our own work, and we teach it in the open',
  credits:'Ryann Scrafford and Fleur Crawford have over 18 years each in surface design and have jointly released 45+ collections to print-on-demand companies worldwide. Creative Studio Collective is where that knowledge is shared: community, education, conversation.'},

 {t:'fit',kicker:'Who this is and is not for',
  h:'An honest fit check',
  body:['For you if you have the skill and want a system that turns it into licensed work.','For you if you will do the monthly work, not just watch.','Not for you if you are looking for a shortcut with no craft behind it.']},

 {t:'cta',kicker:'Your next step',
  h:'Build your licensing-ready portfolio with us',
  sub:'Join the Creative Brief Membership and get a new trend-aligned brief every month, plus the community, the pitch templates, and the print-on-demand roadmap.',
  btn:'Join the Creative Brief Membership',
  disclaimer:'This masterclass is educational. It teaches a portfolio and licensing method and is not a promise or guarantee of income, licensing deals, or any specific result. Outcomes vary with your work, your market, and your craft.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t||'');
  let html='';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){ html+='<h1>'+s.h+'</h1>'; } else { html+='<h2>'+s.h+'</h2>'; }
  if(s.sub) html+='<p class="sub">'+s.sub+'</p>';
  if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
  if(s.briefcard) html+='<div class="brief-card">'+s.briefcard+'</div>';
  if(s.body){ html+='<ul>'+s.body.map(b=>'<li>'+b+'</li>').join('')+'</ul>'; }
  if(s.swatch){ html+='<div class="swatches"><span class="swatch" style="background:#c7a086"></span><span class="swatch" style="background:#96aca7"></span><span class="swatch" style="background:#f2e9e0"></span><span class="swatch" style="background:#4f5148"></span><span class="swatch" style="background:#faf6f1"></span></div>'; }
  if(s.credits) html+='<p class="credits">'+s.credits+'</p>';
  if(s.btn) html+='<div><span class="btn">'+s.btn+'</span></div>';
  if(s.disclaimer) html+='<p class="disclaimer">'+s.disclaimer+'</p>';
  html+='<div class="foot">Creative Studio Collective &middot; The Licensing-Ready Portfolio</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
