<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Identity Gap: Who You Become in Your Third Act · Cara Gray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#001435; --panel:#002463; --rule:rgba(0,112,224,.24);
    --accent:#0070e0; --ink:#eaf1fb; --muted:#8fa6c8; --tint:#7fb0ff;
  }
  html,body{height:100%}
  body{background:#000b1f;font-family:'Plus Jakarta Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000b1f}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:radial-gradient(130% 95% at 80% 4%, #013 0%, #001435 48%, #000b1f 100%);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .42s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.9vw;max-width:94%}
  .t-title h1 b{color:var(--tint);font-weight:700}
  .t-normal h1{font-size:2.7vw;max-width:88%}
  .t-normal .body{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.5vw;color:#b9c8de;margin-top:2.6vh;max-width:80%;line-height:1.62;font-weight:400}
  .sub{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.55vw;color:var(--muted);margin-top:3.2vh;max-width:82%;line-height:1.55;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.2vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.3vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--accent),var(--tint));margin-top:3.6vh}
  .t-dark{background:linear-gradient(160deg,#00317f 0%,#001022 100%);align-items:flex-start;justify-content:center}
  .t-dark h1{font-size:3.2vw;max-width:92%;color:#f3f8ff}
  .t-dark h1 b{color:var(--tint);font-weight:700}
  .t-cta{background:linear-gradient(160deg,#00317f 0%,#001022 100%);align-items:flex-start}
  .t-cta h1{font-size:3.5vw;max-width:88%;color:#f3f8ff}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap}
  .chip{border:1.5px solid var(--tint);color:#cfe2ff;border-radius:100px;padding:1.3vh 1.7vw;font-family:'Plus Jakarta Sans',sans-serif;font-size:1.15vw;font-weight:600}
  .list{margin-top:2.8vh;max-width:82%}
  .list .row{display:flex;align-items:baseline;gap:1vw;font-family:'Plus Jakarta Sans',sans-serif;font-size:1.42vw;color:#b9c8de;line-height:1.5;margin-bottom:1.5vh}
  .list .row b{color:var(--accent);font-weight:700;min-width:2.1vw}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Plus Jakarta Sans',sans-serif;font-size:.9vw;color:var(--muted);font-style:italic;line-height:1.45}
  .brandline{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.25vw;color:var(--muted);margin-top:3.6vh;font-weight:600;letter-spacing:.02em}
  .brandline b{color:var(--tint);font-weight:700}
  .dawn{position:absolute;left:0;right:0;bottom:0;height:38%;pointer-events:none;opacity:.8;
    background:linear-gradient(0deg,rgba(0,112,224,.28) 0%,rgba(0,112,224,0) 100%)}
  .sun{position:absolute;right:9%;bottom:10%;width:13vw;height:13vw;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(127,176,255,.34) 0%,rgba(127,176,255,0) 70%)}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,112,224,.14);z-index:20}
  .hud > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--tint));width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--muted);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.6vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.6vw}.list .row{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Good Morning Freedom</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'The Identity Gap: Who You Become in Your <b>Third Act</b>',sub:'A live masterclass for accomplished professionals and business owners approaching retirement or an exit, who have the money side handled and an open question about everything after.',brand:true,dawn:true},
 {t:'normal',k:'Who this is for',title:'You spent decades becoming very good at who you were.',body:'The title, the company, the calendar that told you where to be and why you mattered. It worked. And now the thing that gave your days their shape is winding down, and the plan everyone helped you build is almost entirely about money.'},
 {t:'dark',title:'You planned the portfolio. <b>Nobody planned the you.</b>'},

 {t:'section',idx:'Part One',title:'The Gap No Financial Plan Closes'},
 {t:'normal',k:'Two gaps, not one',title:'There is a Wealth Gap. There is also an Identity Gap.',body:'Exit planning and retirement planning are built to close the Wealth Gap, and they do it well. But a wealth gap left unaddressed costs money. An identity gap left unaddressed over the next thirty years costs meaning, relationships, health, and purpose.'},
 {t:'normal',k:'What it actually costs',title:'The hard part was never the spreadsheet.',body:'My father owned shoe stores that closed abruptly in the eighties, and I watched how little the money mattered when the identity underneath it disappeared overnight. Money alone does not prepare us for change. Who you are becoming does.'},
 {t:'dark',title:'A wealth gap costs money. An <b>identity gap costs meaning.</b>'},

 {t:'section',idx:'Part Two',title:'The Future Identity Method'},
 {t:'normal',k:'A mirror, not a test',title:'You do not need a diagnosis. You need to see yourself clearly.',body:'The Future Identity read is not a score you pass or fail. It is a mirror held up to where you actually are right now, and where the pull of the next chapter is already taking you, named plainly enough that you can do something with it.'},
 {t:'normal',k:'The five signals',title:'Five dimensions that show who you are becoming next.',list:[
   {n:'1',t:'Direction clarity: how clear the next chapter actually is to you.'},
   {n:'2',t:'Identity shifts: who you are when the title is gone.'},
   {n:'3',t:'Energy foundation: what your days are built to run on now.'},
   {n:'4',t:'Connection quality: the relationships that carry the next thirty years.'},
   {n:'5',t:'Life alignment: whether your days match what you now value most.'}
 ]},
 {t:'normal',k:'Your archetype',title:'One honest, concrete thing worth considering next.',body:'The five signals compose into an archetype that reflects your stage of transition in your own language, and it ends on a single next step. Not a checklist of twenty things. The one that matters now, for the person you are actually becoming.'},
 {t:'dark',title:'Clarity is not a feeling you wait for. <b>It is a thing you can see.</b>'},

 {t:'section',idx:'Part Three',title:'Designing the Third Act'},
 {t:'normal',k:'Third-Act Planning',title:'A structure for the life, the way you had one for the career.',list:[
   {n:'1',t:'Joint Benchmarking: an honest read of where you both stand today.'},
   {n:'2',t:'Vision Mapping: the next chapter made specific instead of vague.'},
   {n:'3',t:'Rhythm and Roles: who does what, and what each day is built around.'},
   {n:'4',t:'Location and Lifestyle: where and how this life is actually lived.'},
   {n:'5',t:'Action Sprints and Check-ins: small moves and the follow-through that keeps them.'}
 ]},
 {t:'normal',k:'For couples too',title:'Two people retiring into the same house, not the same plan.',body:'Most couples basically get along and still have no shared picture of the next chapter. This is practical planning to align that picture, not therapy, run as two focused half-days together with a follow-up so the plan survives contact with real life.'},
 {t:'normal',k:'Why me',title:'I am a Future Identity Strategist and a Third Act Consultant.',body:'Certified in exit planning and professional retirement coaching, I work only on the non-financial side, the part your advisor is not trained to touch. The Act Three podcast and the Good Morning Freedom newsletter are where I think out loud about aging as an upgrade, not a decline.'},

 {t:'section',idx:'Your Next Step',title:'Start by Seeing Who You Are Becoming'},
 {t:'normal',k:'Good Morning Freedom',title:'Take the Snapshot, then we go deeper.',body:'The Future Identity Snapshot gives you your five signals and your one next step as a personalized report within a few hours. From there, the Blueprint turns it into a plan, and the Couples Intensives do the same for two. The best first move is simply to look.'},
 {t:'cta',title:'Ready to meet who you are becoming next?',chips:['Take the Future Identity Snapshot','Book an intro call'],disc:'Educational content for people navigating retirement and life transitions. No specific financial, health, or life outcome is guaranteed. Results vary by person, circumstances, and effort.'},
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.list){ h+=`<div class="list">`+s.list.map(r=>`<div class="row"><b>${r.n}</b><span>${r.t}</span></div>`).join('')+`</div>`; }
    if(s.brand) h+=`<div class="brandline">Good Morning <b>Freedom</b> · Cara Gray</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.dawn) h+=`<div class="dawn"></div><div class="sun"></div>`;
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
