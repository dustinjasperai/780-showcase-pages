<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>How to Build a Real Equine Photography Business · Cassidy Brooke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf8f3; --panel:#f0ece2; --rule:#e2dccf;
    --chalk:#1c1c1a; --grey:#4a4a44; --dim:#8a8a80;
    --accent:#ff5f3d; --lime:#d4e635;
  }
  html,body{height:100%}
  body{background:#e7e2d7;font-family:'Poppins',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e7e2d7}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--chalk);line-height:1.1;letter-spacing:0}
  .t-title h1{font-size:5vw;max-width:90%}
  .t-normal h1{font-size:3.7vw;max-width:86%}
  .t-normal .body{font-size:1.42vw;color:var(--grey);margin-top:2.6vh;max-width:72%;line-height:1.6;font-weight:300}
  .sub{font-size:1.7vw;color:var(--grey);margin-top:3.4vh;max-width:74%;line-height:1.5;font-weight:300}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.05vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:5vw;max-width:90%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#2a2a26 0%,#1c1c1a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4vw;max-width:88%;font-style:italic;font-weight:400;color:#faf8f3}
  .t-dark .accent-bar{width:9vw;height:3px;background:var(--lime);margin:3.6vh auto 0}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2a2a26 0%,#1c1c1a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.2vw;max-width:84%;color:#faf8f3}
  .chips{display:flex;gap:1.2vw;margin-top:4.4vh;flex-wrap:wrap;justify-content:center}
  .chip{background:var(--lime);color:#1c1c1a;border-radius:100px;padding:1.5vh 1.9vw;font-size:1.16vw;font-weight:600;font-family:'Poppins',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-cta .disc{color:#a49f92}
  .t-title .disc,.t-normal .disc{text-align:left}
  .mane{position:absolute;pointer-events:none}
  .title-mane{right:6%;bottom:6%;width:26vw;opacity:.85}
  .corner-mane{right:5%;bottom:6.5%;width:11vw;opacity:.5}
  .brandline{font-size:1.24vw;color:var(--grey);margin-top:3.6vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(28,28,26,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:13px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:8vw}.t-section .idx{font-size:2.8vw}
    .t-dark h1{font-size:6.4vw}.t-cta h1{font-size:7vw}.chip{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The Equine Photography Academy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- mane motif: one flowing rein/mane line, horse-and-hand, drawn once -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mane" viewBox="0 0 300 200">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 168 C90 150 150 150 176 120 C196 96 190 60 214 44 C232 32 262 34 280 22" stroke="#ff5f3d" opacity="0.9"/>
    <path d="M44 176 C108 160 162 158 188 128 C206 106 202 72 224 56" stroke="#1c1c1a" opacity="0.16"/>
    <path d="M214 44 C224 52 236 58 252 58" stroke="#ff5f3d" opacity="0.7"/>
    <circle cx="280" cy="22" r="4.4" fill="none" stroke="#ff5f3d" stroke-width="2.6"/>
    <circle cx="30" cy="168" r="4.4" fill="none" stroke="#ff5f3d" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'How to Build a Real Equine Photography Business',sub:'A live masterclass for photographers who love horses and want to make a real living behind the lens.',brand:true,mane:'title'},
 {t:'normal',k:'Who this is for',title:'You can already make a horse look incredible. You just cannot make a living at it yet.',body:'You shoot horses because you love them. Friends ask you to photograph theirs, you post the results, and everyone tells you that you should be charging for this. But turning beautiful images into steady income is a different skill than making the images.'},
 {t:'dark',title:'A camera does not build a business. A way of working you can repeat does.'},

 {t:'section',idx:'Part One',title:'Why Talented Equine Photographers Stay Broke'},
 {t:'normal',k:'The auto-mode ceiling',title:'Auto mode makes nice photos. It cannot make signature ones.',body:'Horses move in unpredictable light, dark coats swallow detail, and auto mode guesses. Until you own your settings, every shoot is a gamble, and owners pay premium prices for work they can count on, not work that happened to come out.'},
 {t:'normal',k:'The hobby trap',title:'Charging like a hobbyist keeps you a hobbyist.',body:'When you price by the hour or hand over a folder of files for a couple hundred dollars, you cap what the work can ever earn. The photographers who build real businesses sell an experience and a finished product, not a memory card.'},
 {t:'normal',k:'The invisible photographer',title:'Being good is not the same as being found.',body:'Horse owners who would happily pay you do not know you exist. Without a way for strangers to discover you and say yes, you stay dependent on the same small circle of referrals, hoping the next one comes.'},
 {t:'dark',title:'The gap is never talent. It is craft you can repeat and an offer people can buy.'},

 {t:'section',idx:'Part Two',title:'The Equine Photography Academy Method'},
 {t:'normal',k:'Master manual mode',title:'Own your camera so the horse can do anything.',body:'Manual mode is where consistency starts. When you control exposure yourself, a grey sky, a black stallion, and a backlit paddock stop being problems and start being choices. This is the foundation the Accelerator is built on.'},
 {t:'normal',k:'The black background',title:'The signature look owners will pay to hang on a wall.',body:'A horse lifted out of a clean black background reads as fine art, not a snapshot. It is a repeatable technique any owner recognises and wants, and it is exactly the kind of image that lets you raise your prices without apology.'},
 {t:'normal',k:'Pose horses and people',title:'A horse and its person, made to look their best.',body:'Posing a 1,200 pound animal and a nervous owner at the same time is its own craft. Angles that flatter the horse, moments that feel natural, and direction that keeps everyone calm and safe, so the gallery almost sells itself.'},
 {t:'normal',k:'Content that converts',title:'Show the work so the right owners come to you.',body:'The photographers who stay booked are the ones whose feed does the selling before a call ever happens. Sharing the right images with the right words turns followers into enquiries, and enquiries into paid sessions.'},
 {t:'dark',title:'Craft you can repeat, a signature product, and content that finds buyers. That is a business.'},

 {t:'section',idx:'Part Three',title:'A Business Built Around Horses'},
 {t:'normal',k:'The photographer this builds',title:'Booked sessions, premium prices, work you are proud of.',body:'You walk into a shoot knowing exactly how you will handle the light and the horse. You sell wall art and finished galleries instead of raw files. And new owners find you every month, because your content keeps working while you are out shooting.'},
 {t:'dark',title:'The goal was never more photos. It was a life built around horses that actually pays.'},
 {t:'normal',k:'Why Cassidy Brooke',title:'I built this business with a $400 camera and a lot of horses.',body:'I am Cassidy Brooke, founder of The Equine Photography Academy. I grew an equine photography business from a starter camera into a full-time living, and I now teach photographers the craft and the business through the Accelerator, Master Manual Mode, the Black Background Masterclass, and The Equine Photography Podcast.'},

 {t:'section',idx:'Your Next Step',title:'Learn the Whole Method'},
 {t:'normal',k:'The Equine Photography Accelerator',title:'The full craft-and-business path, in one program.',body:'The Accelerator brings manual mode, the black background look, posing horses and people, and content that converts into one path, so you stop guessing on shoots and start running an equine photography business on purpose.'},
 {t:'cta',title:'Ready to build a real business around the horses you love?',chips:['Explore the Equine Photography Accelerator','Apply to work with Cassidy 1:1'],disc:'Educational content for equine photographers. No income or business result is guaranteed. Results vary by photographer, market, and effort.'},
];

const deck=document.getElementById('deck');
function mane(kind){return `<svg class="mane ${kind==='title'?'title-mane':'corner-mane'}" viewBox="0 0 300 200"><use href="#mane"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Equine Photography <b>Academy</b> · Cassidy Brooke</div>`;
    if(s.t==='dark') h+=`<div class="accent-bar"></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mane) h+=mane(s.mane);
  else if(s.t==='title') h+=mane('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
