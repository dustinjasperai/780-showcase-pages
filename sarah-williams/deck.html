<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Months of Boxes, Planned in an Hour — a masterclass with Sarah Williams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffdfb; --panel:#fdeef7; --ink:#161e2a; --muted:#5a5560;
    --accent:#e23fa0; --bright:#ff66c4; --rule:#f3cfe4;
    --head:'Oswald',sans-serif; --body:'Poppins',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#efe7ee;font-family:var(--body);color:var(--ink)}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
  .slide{display:none;width:min(1000px,94vw);aspect-ratio:16/9;background:var(--bg);
    border:1px solid var(--rule);border-radius:18px;padding:7% 8%;box-shadow:0 18px 50px rgba(226,63,160,.12);
    position:relative;overflow:hidden}
  .slide.on{display:flex;flex-direction:column;justify-content:center}
  .kicker{font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;color:var(--accent);
    font-size:clamp(11px,1.5vw,15px);font-weight:600;margin-bottom:14px}
  h1{font-family:var(--head);font-weight:700;line-height:1.02;font-size:clamp(28px,5.4vw,60px);margin:0 0 14px}
  h2{font-family:var(--head);font-weight:600;line-height:1.06;font-size:clamp(23px,4vw,44px);margin:0 0 16px}
  p{font-size:clamp(15px,2vw,22px);line-height:1.5;margin:0 0 12px;max-width:40ch}
  .lead{color:var(--muted)}
  .big{font-family:var(--head);font-weight:700;font-size:clamp(26px,4.6vw,50px);line-height:1.05;color:var(--ink)}
  .accent{color:var(--accent)}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:clamp(15px,2vw,22px);line-height:1.4;padding:10px 0 10px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:18px;width:16px;height:16px;border-radius:5px;background:var(--bright)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
  .tile{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px;text-align:center}
  .tile b{font-family:var(--head);display:block;font-size:clamp(18px,2.4vw,26px);color:var(--accent)}
  .tile span{font-size:13px;color:var(--muted)}
  .foot{position:absolute;left:8%;bottom:5%;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .disc{font-size:13px;color:var(--muted);max-width:52ch;margin-top:14px}
  #nav{position:fixed;bottom:16px;right:20px;font-size:13px;color:#8a8690;font-family:var(--head);letter-spacing:.1em}
  .cta-line{font-family:var(--head);font-weight:600;color:var(--accent);font-size:clamp(18px,2.6vw,28px);margin-top:8px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title', html:`<div class="kicker">Launch Your Box &middot; a live masterclass</div>
   <h1>Six months of boxes,<br>planned in an hour.</h1>
   <p class="lead">How to curate, launch, and grow a subscription box that people keep paying for, with Sarah Williams.</p>`},
 {t:'who', html:`<div class="kicker">Who this is for</div>
   <h2>You have the idea. You just don't know what goes in box one.</h2>
   <p class="lead">For product lovers and small business owners who want recurring, predictable revenue, but keep stalling before the first box ships.</p>`},
 {t:'trap', html:`<div class="kicker">The trap</div>
   <h2>You think the problem is your audience size.</h2>
   <p class="lead">So you chase more followers, more reach, more someday. Meanwhile the box itself never gets built.</p>`},
 {t:'hook', html:`<div class="kicker">The reframe</div>
   <p class="big">A subscription box rarely fails at marketing.<br><span class="accent">It fails at the box.</span></p>
   <p class="lead">No clear buyer, no repeatable way to decide what goes inside, no plan past month one.</p>`},
 {t:'p1title', html:`<div class="kicker">Part one</div><h1>Why first boxes stall.</h1>`},
 {t:'p1a', html:`<h2>Forty tabs, no decision.</h2>
   <p class="lead">Most first-time owners curate box by box, in a panic, the week before they ship. It is exhausting and it never compounds.</p>`},
 {t:'p1b', html:`<h2>The missing piece is a curation system.</h2>
   <p class="lead">Not more inspiration. A repeatable way to decide who the box is for and what goes in it, month after month.</p>`},
 {t:'p2title', html:`<div class="kicker">Part two &middot; the method</div><h1>The Subscription Box Blueprint.</h1>`},
 {t:'blueprint', html:`<div class="kicker">The four layers</div>
   <h2>What a box that sells actually needs.</h2>
   <ul><li>Who it is for, your niche</li><li>What goes in the box, curated on a system</li><li>Packaging they want to open twice</li><li>Shipping that does not eat your margin</li></ul>`},
 {t:'layer_niche', html:`<div class="kicker">Layer one</div>
   <h2>Pick the person, not the product.</h2>
   <p class="lead">The box gets easy to curate the moment you know exactly who opens it and what it does for them.</p>`},
 {t:'layer_contents', html:`<div class="kicker">Layer two</div>
   <h2>Curate on a system, not a whim.</h2>
   <p class="lead">Once the buyer is clear, choosing contents stops being guesswork. You plan ahead instead of scrambling.</p>`},
 {t:'method_grid', html:`<div class="kicker">Sarah's method</div>
   <h2>Six boxes in sixty minutes.</h2>
   <div class="grid">
     <div class="tile"><b>Box 1</b><span>Month one</span></div>
     <div class="tile"><b>Box 2</b><span>Month two</span></div>
     <div class="tile"><b>Box 3</b><span>Month three</span></div>
     <div class="tile"><b>Box 4</b><span>Month four</span></div>
     <div class="tile"><b>Box 5</b><span>Month five</span></div>
     <div class="tile"><b>Box 6</b><span>Month six</span></div>
   </div>
   <p class="lead">Plan half a year in one sitting. Spend less time guessing, more time growing.</p>`},
 {t:'layer_packaging', html:`<div class="kicker">Layer three</div>
   <h2>Packaging is part of the product.</h2>
   <p class="lead">The unboxing is why people post, stay subscribed, and tell a friend. It is design you can make simple.</p>`},
 {t:'layer_shipping', html:`<div class="kicker">Layer four</div>
   <h2>Ship it without losing the margin.</h2>
   <p class="lead">The operational backbone, logistics, fulfilment, and shipping, is learnable. It is where recurring revenue actually lives.</p>`},
 {t:'p3title', html:`<div class="kicker">Part three</div><h1>A box they re-subscribe to.</h1>`},
 {t:'recurring', html:`<h2>Revenue that shows up every month.</h2>
   <p class="lead">A subscription turns one-time buyers into members. Instead of selling again every day, you keep the people you already won.</p>`},
 {t:'path', html:`<div class="kicker">The path</div>
   <h2>Launch it, then scale it.</h2>
   <p class="lead">First you get the box launched and the first subscribers in. Then you grow it past the plateau. One roadmap, two stages.</p>`},
 {t:'whyme', html:`<div class="kicker">Why listen to me</div>
   <h2>I built this the slow way so you don't have to.</h2>
   <p class="lead">I started my own subscription box in 2017 and grew it into a seven-figure business. I wrote One Box at a Time and host the Launch Your Box Podcast. People call me the Subscription Box Queen. It took me eighteen months to figure out. This masterclass is the shortcut I wish I had.</p>`},
 {t:'recap', html:`<div class="kicker">The whole thing in one line</div>
   <p class="big">Pick the person. Curate on a system.<br>Package it, ship it, <span class="accent">keep them.</span></p>`},
 {t:'cta', html:`<div class="kicker">Your next step</div>
   <h2>Come build your box with me.</h2>
   <p class="cta-line">Join Launch Your Box</p>
   <p class="lead">Inside the membership I walk you through the Blueprint, the curation method, and everything from tech to packaging to shipping, step by step.</p>
   <p class="disc">Educational content only. No income or result is guaranteed. Results vary and depend on your own effort, niche, and execution.</p>`}
];
const stage=document.getElementById('stage'), nav=document.getElementById('nav');
let i=0;
function render(){
  stage.innerHTML='';
  const d=document.createElement('div');
  d.className='slide on';
  d.innerHTML=(S[i].html||'')+'<div class="foot">Launch Your Box &middot; Sarah Williams</div>';
  stage.appendChild(d);
  nav.textContent=(i+1)+' / '+S.length;
}
function go(n){ i=Math.max(0,Math.min(S.length-1,i+n)); render(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(1);
  if(e.key==='ArrowLeft')go(-1);
});
document.addEventListener('click',e=>{ go(e.clientX < innerWidth/2 ? -1 : 1); });
render();
</script>
</body>
</html>
