<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become an AI-Fluent PM by Shipping Real Product Work — ProductHood School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfd;        /* brand.json near-white ground, light scheme */
    --panel:#ffffff;
    --rule:#e7e7ef;
    --ink:#303d48;       /* brand.json H1 slate */
    --body:#454b54;      /* darkened neighbour of brand body #555555 */
    --muted:#8b90a0;
    --accent:#6c63ff;    /* brand.json H2 indigo-violet, the ProductHood accent */
    --accent-soft:#efeefe;
    --head:'Poppins',system-ui,sans-serif;
    --text:'Ubuntu',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#dcdce4;font-family:var(--text);color:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:16px;
    aspect-ratio:16/9;margin:22px 0;padding:64px 72px;overflow:hidden;
    box-shadow:0 10px 30px rgba(48,61,72,.08);display:flex;flex-direction:column;justify-content:center;
  }
  .slide .no{position:absolute;top:22px;right:28px;font-family:var(--head);font-size:13px;color:var(--muted);letter-spacing:.04em}
  .kick{font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--head);font-weight:800;color:var(--ink);font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;color:var(--ink);font-size:40px;line-height:1.1;letter-spacing:-.01em}
  .lead{font-size:23px;line-height:1.5;color:var(--body);margin-top:22px;max-width:44ch}
  .big{font-family:var(--head);font-weight:700;color:var(--ink);font-size:44px;line-height:1.15;letter-spacing:-.01em}
  .big .a{color:var(--accent)}
  ul{list-style:none;margin-top:26px;display:grid;gap:16px}
  li{position:relative;padding-left:38px;font-size:22px;line-height:1.4;color:var(--body)}
  li:before{content:"";position:absolute;left:0;top:9px;width:16px;height:16px;border-radius:5px;background:var(--accent-soft);border:2px solid var(--accent)}
  .pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:14px;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:7px 14px;border-radius:999px;margin-bottom:22px;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:24px 26px}
  .card .n{font-family:var(--head);font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.06em}
  .card h3{font-family:var(--head);font-weight:700;color:var(--ink);font-size:22px;margin:8px 0 6px}
  .card p{font-size:16px;line-height:1.45;color:var(--body)}
  .step{display:flex;gap:16px;align-items:flex-start;margin-top:18px}
  .step .s{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;font-family:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
  .step div p{font-size:20px;line-height:1.4;color:var(--body)}
  .step div b{font-family:var(--head);color:var(--ink);font-weight:700;font-size:21px}
  .center{text-align:center;align-items:center;height:100%;display:flex;flex-direction:column;justify-content:center}
  .center .lead{margin-left:auto;margin-right:auto}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px;margin-top:26px}
  .who p{font-size:20px;line-height:1.4;padding-left:34px;position:relative}
  .who p:before{content:"\\2192";position:absolute;left:0;color:var(--accent);font-weight:700}
  .quote{font-family:var(--head);font-weight:700;color:var(--ink);font-size:34px;line-height:1.25;letter-spacing:-.01em}
  .foot{position:absolute;left:72px;bottom:30px;font-family:var(--head);font-size:13px;color:var(--muted);letter-spacing:.05em}
  .cta-box{background:var(--ink);border-radius:16px;padding:40px 44px;margin-top:8px}
  .cta-box .kick{color:#a99cff}
  .cta-box h2{color:#fff}
  .cta-box p{color:#d7dae2;font-size:20px;line-height:1.5;margin-top:16px;max-width:48ch}
  .cta-btn{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;font-family:var(--head);font-weight:700;font-size:19px;padding:15px 30px;border-radius:12px}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:62ch}
  .why-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
  .stat{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .stat b{display:block;font-family:var(--head);font-weight:800;color:var(--accent);font-size:30px}
  .stat span{font-size:16px;color:var(--body);line-height:1.4;display:block;margin-top:4px}
  @media(max-width:760px){.slide{padding:34px 30px;aspect-ratio:auto;min-height:70vh}h1{font-size:34px}h2{font-size:28px}.big{font-size:30px}.grid,.who,.why-grid{grid-template-columns:1fr}.foot{left:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', html:`<div class="kick">A live masterclass with Lokesh Gupta · ProductHood School</div>
   <h1>Become an AI-Fluent PM by Shipping Real Product Work</h1>
   <p class="lead">The applied path into product management: the skills and the proof recruiters actually hire for, taught live.</p>
   <div class="foot">ProductHood School · School of Product Management</div>`},

 {t:'agenda', html:`<div class="kick">What we cover today</div>
   <h2>One hour, four things you can use tomorrow</h2>
   <ul>
     <li>Why more courses and certificates are not moving your career</li>
     <li>What hiring managers actually screen for in 2026</li>
     <li>The four skills of an AI-fluent product manager</li>
     <li>How to build proof you can ship, starting this week</li>
   </ul>`},

 {t:'who', html:`<div class="kick">Who this is for</div>
   <h2>You are in the right room if</h2>
   <div class="who">
     <p>You want to break into product management and keep hitting the "no experience" wall</p>
     <p>You are an engineer, analyst, or founder moving toward a product role</p>
     <p>You are already a PM and want to grow into senior or lead</p>
     <p>You keep hearing you need to be "AI fluent" and nobody has shown you what that means</p>
   </div>`},

 {t:'trap', html:`<div class="pill">The trap</div>
   <h2>You have done the courses. You still cannot get the interview.</h2>
   <p class="lead">Another certificate, another framework, another reading list. The credential pile grows and the callback rate does not. It feels like you are one more course away. You are not.</p>`},

 {t:'reframe', html:`<div class="center">
   <div class="kick">The reframe</div>
   <p class="big">Recruiters do not buy certificates.<br>They buy <span class="a">proof you can ship</span>.</p>
   <p class="lead">The candidates who get hired are not the ones with the most training. They are the ones who can show a real product decision and use AI like a professional.</p></div>`},

 {t:'problem1', html:`<div class="kick">Part one · the real gap</div>
   <h2>You can describe product management. You cannot yet show it.</h2>
   <p class="lead">Most programs teach you to talk about frameworks. Hiring is a test of judgment under real constraints: what to build, what to cut, how to decide with incomplete data. That is a doing skill, and it only shows up in work you have actually shipped.</p>`},

 {t:'problem2', html:`<div class="kick">Part one · and now the bar moved</div>
   <h2>AI just widened the gap between talkers and shippers</h2>
   <ul>
     <li>Teams now expect PMs to use AI to research, prototype, and decide faster</li>
     <li>"I took an AI course" is not fluency. Using AI inside a real product decision is</li>
     <li>The PMs who pair judgment with AI fluency are pulling away from everyone else</li>
   </ul>`},

 {t:'method', html:`<div class="kick">Part two · the method</div>
   <h2>Think like an AI-fluent PM, then prove it</h2>
   <p class="lead">This is the expert-generalist method ProductHood is built on: breadth with depth. Four skills, each one taught to be demonstrated in real work, not memorised for a quiz.</p>`},

 {t:'pillar1', html:`<div class="kick">Part two · skill 1</div>
   <h2>Evals: the core AI PM skill</h2>
   <div class="grid">
     <div class="card"><div class="n">WHAT</div><h3>Judge the output, not the demo</h3><p>Offline and online evals, golden datasets, and a repeatable way to tell whether an AI feature is actually good.</p></div>
     <div class="card"><div class="n">WHY</div><h3>It is what separates AI PMs</h3><p>Anyone can prompt. The PM who can measure quality is the one teams trust with AI decisions.</p></div>
   </div>`},

 {t:'pillar2', html:`<div class="kick">Part two · skill 2</div>
   <h2>The AI-native workflow</h2>
   <ul>
     <li>Prompting and tool fluency as a daily working habit, not a party trick</li>
     <li>Data and context engineering: when to use retrieval, when to fine-tune</li>
     <li>Architecture and agentic thinking: orchestration, and build versus buy</li>
   </ul>`},

 {t:'pillar3', html:`<div class="kick">Part two · skill 3</div>
   <h2>Product judgment that holds up</h2>
   <ul>
     <li>Strategy, cost, and the business model: the unit economics of an AI feature</li>
     <li>Metrics, GTM, and launch: how you will know it worked before you ship</li>
     <li>Responsible AI: planning for bias, fairness, and hallucination up front</li>
   </ul>`},

 {t:'pillar4', html:`<div class="kick">Part two · skill 4</div>
   <h2>Ship it, then show it</h2>
   <p class="lead">The Residency model in miniature: you make a real product decision on a real initiative, get it reviewed, and turn it into portfolio proof. This is the artifact a recruiter can actually check, and the one certificates never give you.</p>`},

 {t:'generalist', html:`<div class="center">
   <div class="kick">The throughline</div>
   <p class="quote">"Breadth with depth. The expert generalist thrives in complexity, and that is exactly the PM the best teams are hiring for."</p>
   <p class="lead">Every skill above stacks into one profile: a PM who can go wide across a problem and deep where it counts.</p></div>`},

 {t:'looks', html:`<div class="kick">Part three · from stuck to shipped</div>
   <h2>From course-collector to callback</h2>
   <div class="step"><div class="s">1</div><div><b>Pick a real product problem</b><p>Not a case study. Something a real team would actually face.</p></div></div>
   <div class="step"><div class="s">2</div><div><b>Make the decision the AI-fluent way</b><p>Use evals and the AI-native workflow to reach and defend a call.</p></div></div>
   <div class="step"><div class="s">3</div><div><b>Ship the artifact and show it</b><p>Now you walk into the interview with proof, not promises.</p></div></div>`},

 {t:'recap', html:`<div class="kick">Recap</div>
   <h2>What you take from today</h2>
   <ul>
     <li>Certificates do not get you hired. Shipped work and AI fluency do</li>
     <li>Evals are the core AI PM skill, and they are learnable</li>
     <li>The fastest way in is one real, reviewed product decision</li>
   </ul>`},

 {t:'why', html:`<div class="kick">Who is teaching this</div>
   <h2>Lokesh Gupta, Founder, ProductHood School</h2>
   <div class="why-grid">
     <div class="stat"><b>21+ yrs</b><span>Across product and technology management, including senior roles at funded startups</span></div>
     <div class="stat"><b>Thousands</b><span>Of professionals taught through ProductHood's live cohorts and workshops</span></div>
     <div class="stat"><b>IIT Delhi</b><span>Double-degree engineer, MBA, and the founder who reviews Residency work personally</span></div>
     <div class="stat"><b>Applied</b><span>A school built on real product work, not lectures, under the expert-generalist method</span></div>
   </div>`},

 {t:'cta', html:`<div class="cta-box">
     <div class="kick">Your next step</div>
     <h2>Do this for real, with a cohort</h2>
     <p>If today made sense, the AI Product Management program is where you build the shipped work and the AI fluency in a live cohort, with the Residency track when you want real product work reviewed by the founder.</p>
     <span class="cta-btn">Join the next live cohort at producthood.com</span>
   </div>
   <p class="disc">Educational content for aspiring product managers. No income, job, or career result is guaranteed. Results vary by background, market, and the work you put in. ProductHood does not offer job guarantees or placement promises.</p>`}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide';
  d.innerHTML=(s.html||'')+'<div class="no">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(d);
});
</script>
</body>
</html>
