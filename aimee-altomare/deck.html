<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surviving Is Not Leading: A Masterclass with Aimee Altomare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec;        /* warm ivory ground (her page ground is light) */
    --panel:#013927;     /* deep forest green (her H1/H2 + footer color) */
    --rule:#013927;
    --accent:#af9062;    /* warm gold (her button color) */
    --ink:#131313;       /* near-black (her body text) */
    --muted:#5b5a53;
    --serif:'Spectral',Georgia,serif;
    --sans:'Figtree',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--bg);border:1px solid rgba(1,57,39,.16);border-radius:4px;
    padding:64px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(1,57,39,.025) 1px,transparent 1px);
    background-size:5px 5px;pointer-events:none}
  .kicker{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:600;font-size:64px;line-height:1.02;
    color:var(--panel);letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.06;
    color:var(--panel);letter-spacing:-.01em;margin-bottom:18px}
  .lead{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1.25;
    color:var(--ink);max-width:40ch}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:62ch;margin-top:14px}
  .big{font-family:var(--serif);font-size:40px;line-height:1.1;color:var(--panel);max-width:24ch}
  ul{margin:22px 0 0 0;list-style:none;max-width:60ch}
  li{position:relative;padding-left:30px;margin:14px 0;font-size:18px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:10px;width:10px;height:10px;
    background:var(--accent);border-radius:1px}
  .steps{counter-reset:s;margin-top:24px}
  .steps li{padding-left:52px;margin:18px 0;font-size:20px}
  .steps li::before{counter-increment:s;content:counter(s);background:var(--panel);
    color:var(--bg);width:34px;height:34px;border-radius:50%;left:0;top:-2px;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);
    font-size:18px;font-weight:600}
  .title-slide{background:var(--panel)}
  .title-slide::before{background-image:radial-gradient(rgba(246,243,236,.05) 1px,transparent 1px)}
  .title-slide h1{color:var(--bg)}
  .title-slide .kicker{color:var(--accent)}
  .title-slide .sub{font-family:var(--serif);font-style:italic;font-size:26px;
    color:rgba(246,243,236,.86);margin-top:22px;max-width:40ch}
  .title-slide .by{margin-top:40px;font-family:var(--sans);font-size:14px;
    letter-spacing:.04em;color:rgba(246,243,236,.7)}
  .rule{width:64px;height:3px;background:var(--accent);margin:0 0 28px}
  .cta-slide{background:var(--panel)}
  .cta-slide h2,.cta-slide .big{color:var(--bg)}
  .cta-slide p{color:rgba(246,243,236,.85)}
  .cta-btn{display:inline-block;margin-top:28px;background:var(--accent);color:#1b1205;
    font-family:var(--sans);font-weight:600;font-size:17px;padding:15px 30px;
    border-radius:3px;text-decoration:none;letter-spacing:.01em}
  .disclaimer{margin-top:34px;font-size:12.5px;line-height:1.5;color:rgba(246,243,236,.6);
    max-width:64ch;font-family:var(--sans)}
  .n{font-family:var(--serif);color:var(--accent);font-size:20px}
  @media(max-width:640px){
    .slide{padding:40px 26px;min-height:340px}
    h1{font-size:40px}h2{font-size:30px}.lead{font-size:23px}.big{font-size:28px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass',h1:'Surviving Is Not Leading',
  sub:'For high performers who are successful by every measure and still only getting through the day.',
  by:'With Aimee Altomare, Corporate Mom Coach · Former corporate Vice President'},

 {t:'who',kicker:'Who this is for',h2:'You are the one who holds it together.',
  p:'Capable. Deeply committed. Successful by traditional standards. And quietly stretched thin, carrying a demanding role and a full life at the same time, and wondering how long this version of you is sustainable.'},

 {t:'trap',kicker:'The trap',big:'Doing more has stopped working.',
  p:'The playbook that got you here (absorb more, respond faster, say yes) is the exact thing draining you now. And the exhaustion does not announce itself. It just arrives.'},

 {t:'reframe',kicker:'The reframe',lead:'Surviving and leading are not the same thing.',
  p:'Navigating hard moments alone builds coping mechanisms. It does not build leadership. You can be coping beautifully and still never be bringing your clearest, most grounded self to the moments that matter most.'},

 {t:'part',kicker:'Part one',h2:'The moments that define your career do not arrive on a calendar.'},

 {t:'body',kicker:'The core problem',big:'They happen on a Tuesday at 8am.',
  p:'The high-stakes conversation. The decision under pressure. The Thursday night when the kids are finally in bed and your mind will not switch off. These are the moments leadership is actually decided, and they never line up with your next scheduled session.'},

 {t:'body',kicker:'Why the usual advice fails',h2:'Generic time management treats the symptom.',
  p:'More systems and tighter calendars assume the problem is your schedule. It is not. The problem is that you are meeting pressure with reaction instead of intention. Until that shifts, a better calendar just helps you survive faster.'},

 {t:'part',kicker:'Part two',h2:'The Corporate Professional Mindset Method'},

 {t:'body',kicker:'The method',h2:'From reactive patterns to intentional leadership.',
  p:'The method pairs executive coaching with mindset and emotional-intelligence tools. The aim is not motivation. It is a durable shift in how you meet the moment, so that composure becomes your default instead of your exception.'},

 {t:'list',kicker:'What it changes',h2:'Four shifts.',
  items:['Reduce the mental and emotional overload you carry by default',
         'Sharpen communication and decision-making under real pressure',
         'Strengthen the confidence and professional presence people already sense in you',
         'Replace reactive patterns with intentional, self-directed leadership']},

 {t:'steps',kicker:'A worked example',h2:'Redirect, don\'t refuse.',
  p:'A boundary is a leadership skill, not a selfish act. The social cost of not setting one is almost always higher than the cost of setting it. Here is how to set it without losing ground:',
  steps:['Acknowledge the request, so the person feels heard',
         'Name your constraint, without over-explaining or apologising',
         'Offer an alternative: lead with what you can, not what you can\'t']},

 {t:'body',kicker:'Coaching that meets the moment',h2:'Support in real time, not on a schedule.',
  p:'The coaching that meets you in the hard moment is the coaching that actually changes things. The work is designed to reach you between sessions, when the pressure is live, so you walk in grounded instead of processing it alone afterward.'},

 {t:'part',kicker:'Part three',h2:'What sustainable leadership looks like'},

 {t:'body',kicker:'The outcome',big:'Impact in your career. Harmony at home.',
  p:'Leadership should be sustainable and self-directed. The next chapter of your career should be chosen, not endured. You keep the ambition and the standards. You just stop paying for them with yourself.'},

 {t:'who',kicker:'Why me',h2:'I have led from inside the pressure.',
  p:'I am a former corporate Vice President and a certified life and mindset coach who has trained with coaches since 2016 in mindset, leadership, and wellness. I coach the exact pressure I lived: leading at a high level while a full life keeps running alongside it.'},

 {t:'cta',kicker:'Your next step',big:'Choose the next chapter.',
  p:'If this is the shift you have been circling, the next step is a complimentary clarity call. We will look honestly at where the overload is coming from, and whether the Corporate Professional Mindset Method is the right path for you.',
  btn:'Book a complimentary clarity call',
  disclaimer:'This masterclass is educational. It shares frameworks and perspective, not guaranteed outcomes; individual results vary and depend on your own circumstances and effort. Nothing here is a promise of any specific professional, financial, or personal result.'}
];

const deck=document.getElementById('deck');
for(const s of S){
  const d=document.createElement('section');
  d.className='slide'+(s.t==='title'?' title-slide':'')+(s.t==='cta'?' cta-slide':'');
  let h='';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t!=='title'&&s.t!=='cta') h+='<div class="rule"></div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.by) h+='<div class="by">'+s.by+'</div>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.lead) h+='<div class="lead">'+s.lead+'</div>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.p) h+='<p>'+s.p+'</p>';
  if(s.items){h+='<ul>';for(const it of s.items)h+='<li>'+it+'</li>';h+='</ul>';}
  if(s.steps){h+='<ul class="steps">';for(const it of s.steps)h+='<li>'+it+'</li>';h+='</ul>';}
  if(s.btn) h+='<a class="cta-btn" href="#">'+s.btn+'</a>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  d.innerHTML=h;
  deck.appendChild(d);
}
</script>
</body>
</html>
