<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Sellable Event Business, a Kershaw Partners masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111112; --panel:#1b1b1d; --rule:#2c2c2f; --accent:#42d3aa;
    --ink:#f4f5f3; --muted:#a7a9a6;
    --display:"Cabinet Grotesk","DM Sans",system-ui,sans-serif;
    --body:"DM Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#050506;color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:14px;padding:64px 60px;min-height:538px;margin:0 0 22px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:60px;top:54px;width:46px;height:3px;background:var(--accent);opacity:.9}
  .kick{font-family:var(--display);text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.08;letter-spacing:-.01em;margin-bottom:16px}
  .sub{font-size:21px;line-height:1.5;color:var(--muted);max-width:62ch}
  .big{font-family:var(--display);font-weight:700;font-size:62px;line-height:1.05;letter-spacing:-.015em}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;padding:14px 0 14px 26px;border-top:1px solid var(--rule);position:relative;color:var(--ink)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:23px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  li b{font-family:var(--display);font-weight:700}
  li span{display:block;color:var(--muted);font-size:17px;margin-top:3px}
  .note{margin-top:20px;font-size:16px;color:var(--muted)}
  .foot{position:absolute;right:30px;bottom:22px;font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#56584f}
  .pg{position:absolute;left:60px;bottom:22px;font-size:12px;color:#44453f}
  .cta h2{font-size:46px}
  .disc{margin-top:26px;font-size:14px;line-height:1.5;color:#7d7f79;max-width:70ch;border-top:1px solid var(--rule);padding-top:16px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    k:"A Kershaw Partners masterclass",
    h:"The Sellable Event Business",
    s:"How to build an event company a buyer actually wants, so the business you poured years into becomes an asset you can one day sell, not a job you can never leave."},

  {t:'list',
    k:"What you will leave with",
    h:"One hour, three things",
    list:[
      {b:"A buyer's view of your business",x:"What raises value, and what quietly discounts it, in event companies specifically."},
      {b:"The order of operations",x:"Which of the five frameworks to work on first, given where you are now."},
      {b:"A plainer definition of done",x:"What 'sellable' actually means, so you can tell whether you are getting closer."}
    ]},

  {t:'who',
    k:"Who this is for",
    h:"You built the events. Now build the value.",
    s:"For founders and owners of agencies, venues, caterers and event suppliers doing real revenue, who are proud of the work but quietly unsure the company is worth anything without them in the room.",
    list:[
      {b:"The trap",x:"The calendar is full, the clients are happy, and every important decision still runs through you."},
      {b:"The quiet question",x:"If you stepped back for a season, or wanted to sell, what would actually be left?"}
    ]},

  {t:'hook',
    k:"The uncomfortable part",
    h:"You don't own a business. You own a job.",
    s:"A company that cannot run, grow, or be valued without the founder is not an asset. It is a very demanding job with your name on the door. Buyers know this, which is why so many event businesses never sell."},

  {t:'part',
    k:"Part one",
    h:"Why most event businesses can't be sold",
    s:"Three things make an event company un-sellable, and all three are fixable on purpose."},

  {t:'list',
    k:"Part one",
    h:"The value leaks",
    list:[
      {b:"It runs on you",x:"Relationships, pricing, judgement and quality all live in the founder's head."},
      {b:"The revenue is a story, not a system",x:"Great years and thin years, with no predictable pipeline a buyer can underwrite."},
      {b:"There is no second line",x:"No leadership team that can hold the standard when you are not there."}
    ]},

  {t:'hook',
    k:"Part one",
    h:"The founder test",
    s:"Here is the only test that matters. If you disappeared for ninety days, would the business grow, hold, or quietly fall apart? Your honest answer is also your current valuation."},

  {t:'part',
    k:"Part two",
    h:"The Club Altura frameworks",
    s:"The same frameworks we teach event leaders inside Club Altura, in the order they move a business from founder-dependent to sellable."},

  {t:'list',
    k:"Framework 01",
    h:"Vision and Business Planning",
    s:"Decide what the business is being built to become, and work backwards.",
    list:[
      {b:"The destination first",x:"A clear picture of the business you want to own, or hand over, in three to five years."},
      {b:"The roadmap",x:"The handful of moves that actually raise enterprise value, not just this quarter's revenue."}
    ]},

  {t:'list',
    k:"Framework 02",
    h:"Franchise Thinking: run on rails",
    s:"Build the company as if you were going to franchise it, even if you never will.",
    list:[
      {b:"Documented, repeatable delivery",x:"The way you win and run events written down so it survives any one person leaving."},
      {b:"Systems a buyer can trust",x:"When the business runs on rails, it keeps running after the founder steps back. That is what value looks like."}
    ]},

  {t:'list',
    k:"Framework 03",
    h:"The Sales Accelerator",
    s:"Replace feast and famine with a pipeline you can forecast.",
    list:[
      {b:"A predictable process",x:"A repeatable way new business comes in, not just referrals and luck."},
      {b:"Revenue a buyer underwrites",x:"Forecastable, recurring and relationship-proof income is worth a higher multiple."}
    ]},

  {t:'list',
    k:"Framework 04",
    h:"Culture and Leadership",
    s:"A team that holds the standard when you are not in the room.",
    list:[
      {b:"Attract and keep talent",x:"The people who let the founder step out of the day to day."},
      {b:"A real second line",x:"Leaders who own outcomes, so the business is not one resignation away from a crisis."}
    ]},

  {t:'list',
    k:"Framework 05",
    h:"Exit Planning",
    s:"Build value now, so the choice to sell is yours to make later.",
    list:[
      {b:"Think like the buyer",x:"Understand what an acquirer pays for, and what they discount, long before you ever talk to one."},
      {b:"Ready, not rushed",x:"A business prepared for a strategic exit is also simply a better business to own in the meantime."}
    ]},

  {t:'part',
    k:"Part three",
    h:"What a sellable event business looks like",
    s:"The same company, a year or two into the work."},

  {t:'list',
    k:"Part three",
    h:"The difference you can feel",
    list:[
      {b:"It runs without you in every meeting",x:"You choose what you work on, because the business no longer needs you in the room for everything."},
      {b:"The numbers are forecastable",x:"You can tell a buyer, or a bank, what next year looks like and be believed."},
      {b:"You have options",x:"Keep it, scale it, or sell it. All three are now on the table, which is the whole point."}
    ]},

  {t:'list',
    k:"Part three",
    h:"What a buyer pays more for",
    s:"The same revenue is worth a different multiple depending on how it is built.",
    list:[
      {b:"Recurring over one-off",x:"Retainers, memberships and repeat contracts beat a calendar of unrepeatable wins."},
      {b:"Transferable over personal",x:"Relationships owned by the company, not by the founder's phone."},
      {b:"Documented over heroic",x:"A business that works because of its systems, not because everyone works late."}
    ]},

  {t:'hook',
    k:"Why now",
    h:"The best time to build value is before you need it",
    s:"Owners who wait until they are tired, or until an offer lands, negotiate from weakness. The work in this masterclass takes time, which is exactly why the right moment to start is now, while the choice is still yours."},

  {t:'why',
    k:"Why learn this from us",
    h:"Advisors who built it and sold it",
    s:"Kershaw Partners is the No 1 Advisors to the Event Industry, and the people teaching this have sat where you sit.",
    list:[
      {b:"Mike Kershaw",x:"Co-founded and chaired The Concerto Group, a multi-million-pound events enterprise, and is a past President of ILEA."},
      {b:"The team",x:"Principals who have built, bought and sold event businesses, and who advise on real growth, funding and M&A every week."}
    ]},

  {t:'cta',
    k:"Your next step",
    h:"Start with a Diagnostic Business Review",
    s:"We will look at your business the way a buyer would, show you where the value leaks, and map the few moves that make it sellable. Explore the frameworks further inside Club Altura.",
    disc:"Educational content only. No income, sale, valuation or result is guaranteed. Results vary and depend on your market, your team and your own execution."}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let html='';
  if(s.k) html+='<div class="kick">'+s.k+'</div>';
  if(s.t==='title'){ html+='<h1>'+s.h+'</h1>'; if(s.s) html+='<p class="sub">'+s.s+'</p>'; }
  else if(s.t==='hook'){ html+='<div class="big">'+s.h+'</div>'; if(s.s) html+='<p class="sub" style="margin-top:20px">'+s.s+'</p>'; }
  else { html+='<h2>'+s.h+'</h2>'; if(s.s) html+='<p class="sub">'+s.s+'</p>'; }
  if(s.list){ html+='<ul>'; s.list.forEach(it=>{ html+='<li><b>'+it.b+'</b><span>'+it.x+'</span></li>'; }); html+='</ul>'; }
  if(s.note) html+='<p class="note">'+s.note+'</p>';
  if(s.disc) html+='<p class="disc">'+s.disc+'</p>';
  html+='<div class="foot">Kershaw Partners</div>';
  html+='<div class="pg">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
