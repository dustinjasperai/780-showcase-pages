<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cleared Channel — a masterclass with Chelsea Bieker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f5; --panel:#ffffff; --ink:#213f58; --muted:#5a6b7a;
    --rule:#dfe4e9; --accent:#d9ac55; --deep:#16304a;
    --head:'Newsreader', Georgia, serif; --body:'Poppins', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--deep);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--bg);border-radius:14px;margin:0 0 26px;padding:64px 60px;
    min-height:520px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(0,0,0,.04);position:relative;overflow:hidden;
  }
  .slide::after{content:"";position:absolute;left:60px;bottom:30px;width:46px;height:3px;background:var(--accent);border-radius:2px;opacity:.9}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:500;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:500;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  .sub{font-family:var(--head);font-style:italic;font-size:26px;color:var(--muted);margin-top:18px;line-height:1.3}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);margin-top:20px;max-width:40em}
  ul{margin:26px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule);max-width:42em}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .big{font-family:var(--head);font-size:44px;line-height:1.14;font-weight:400;max-width:20em}
  .big em{font-style:italic;color:var(--accent)}
  .part{color:var(--accent);font-family:var(--head);font-size:22px;font-weight:500;margin-bottom:10px}
  .cta h2{font-size:46px}
  .step{font-size:19px;line-height:1.5;padding:10px 0 10px 30px;position:relative;max-width:42em}
  .step::before{content:"";position:absolute;left:0;top:17px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .disc{margin-top:30px;font-size:13px;color:var(--muted);line-height:1.5;max-width:44em;font-family:var(--body)}
  .by{margin-top:24px;font-size:16px;color:var(--muted)}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:420px}h1{font-size:40px}h2{font-size:30px}.big{font-size:32px}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Chelsea Bieker · The Fountain',
   h:'The Cleared Channel',
   sub:'How to write your book from flow, not force'},

  {t:'promise', kicker:'What this hour gives you',
   h:'You already know craft. This is the part no one teaches.',
   list:[
     'Why you can know exactly how to write and still not be able to start',
     'The real reason the blank page triggers avoidance, and what to do about it',
     'The Clearing: a short practice that moves you from freeze to flow before you write',
     'How to turn writing from a willpower fight into a daily practice you actually keep'
   ]},

  {t:'who', kicker:'Who this is for',
   h:'The writer who keeps circling the same first chapter',
   body:'You have read the craft books. You have taken the workshops. You have the idea, maybe even the outline. And still, most days, you open the document, stare at it, and close it again. This is for you. Not for someone who needs to learn what a scene is.'},

  {t:'trap', kicker:'The trap',
   h:'More craft was never the missing piece',
   body:'So you buy another course on structure. Another on character. You collect technique the way some people collect gym memberships. The craft stacks up. The pages do not. And quietly you start to wonder if the problem is you.'},

  {t:'hook',
   big:'The block is not a discipline problem. It is not a craft problem. It is a <em>nervous-system</em> problem. And nervous systems can be trained.'},

  {t:'part1', kicker:'Part one', part:'Part One', h:'Why you freeze'},

  {t:'problem', kicker:'The real problem',
   h:'Your body reads the blank page as a threat',
   body:'When the stakes feel high, the body does what it is built to do: it protects you by pulling you away from the thing that feels dangerous. The page starts to feel dangerous. So you tidy, you scroll, you research one more thing. That is not laziness. That is a protective state, and you cannot think your way out of a protective state. You have to settle it first.'},

  {t:'problem2', kicker:'What forcing it costs',
   h:'Willpower works, until it does not',
   list:[
     'You push through on adrenaline and deadline, then crash for weeks',
     'The writing you force is tight and self-conscious, so revision is brutal',
     'Each stalled session teaches your body that the page equals dread',
     'Eventually the avoidance gets stronger than the wanting'
   ]},

  {t:'part2', kicker:'Part two', part:'Part Two', h:'The Clearing'},

  {t:'clearing', kicker:'The practice',
   h:'Clear the channel, then write',
   body:'The Clearing is a short guided audio visualization you listen to before a writing session. It settles the nervous system, moves you out of the protective state, and signals to your body that the page is safe. Done before you write, not after you stall, it is the difference between sitting down braced and sitting down open. Over time it builds a neural pathway: open the document, drop into flow.'},

  {t:'frequency', kicker:'The tools',
   h:'Everything is built to make flow repeatable',
   list:[
     'The Clearing: regulate the nervous system and clear creative resistance',
     'The Writing Frequency: custom audio that helps you drop into flow faster',
     'The Revision Deck: a calm, card by card way through a full draft',
     'Daily prompts that ask for devotion, not word-count heroics'
   ]},

  {t:'practice', kicker:'The shape of it',
   h:'Devotion over discipline, one hundred days',
   body:'A sustainable practice is not about writing more. It is about showing up, day after day, so the page stops being a threat and starts being a place you know how to enter. Small and daily beats large and rare. That is how a blank document becomes a full draft without the crash.'},

  {t:'part3', kicker:'Part three', part:'Part Three', h:'Inside the daily practice'},

  {t:'looks', kicker:'In practice',
   h:'From blank page to full draft',
   list:[
     'A daily curriculum, so you always know what today asks of you',
     'A Clearing before each session, so you enter from flow instead of fear',
     'Live Listening Rooms, where the work is heard and held, not torn apart',
     'A community walking the same path, so devotion is not a solo act'
   ]},

  {t:'why', kicker:'Why trust this',
   h:'Built by writers who have done it and taught it',
   body:'The Fountain was created by Chelsea Bieker and Kimberly King Parsons, bestselling and award-winning fiction writers with a combined thirty years of teaching across universities and programs like Tin House and Catapult. This is not theory borrowed from a self-help book. It is the practice they use on their own books and have taught to thousands of writers.'},

  {t:'cta', cls:'cta', kicker:'Your next step',
   h:'Start with the free Clearing',
   steps:[
     'Try the free Clearing and feel the shift for yourself',
     'Keep the daily practice going inside The Fountain',
     'Go deep in the Writing Intensive: one hundred days to a full draft'
   ],
   by:'With Chelsea Bieker and Kimberly King Parsons · The Fountain',
   disc:'Educational only. No income, publication, or result is guaranteed. Writing outcomes vary with effort, time, and circumstance.'}
];

function render(){
  const wrap = document.getElementById('wrap');
  S.forEach(s=>{
    const d = document.createElement('section');
    d.className = 'slide' + (s.cls ? ' ' + s.cls : '');
    let html = '';
    if(s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
    if(s.part) html += '<div class="part">'+s.part+'</div>';
    if(s.big){ html += '<div class="big">'+s.big+'</div>'; }
    if(s.h) html += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
    if(s.sub) html += '<div class="sub">'+s.sub+'</div>';
    if(s.body) html += '<p class="body">'+s.body+'</p>';
    if(s.list){ html += '<ul>'; s.list.forEach(i=> html += '<li>'+i+'</li>'); html += '</ul>'; }
    if(s.steps){ s.steps.forEach(i=> html += '<div class="step">'+i+'</div>'); }
    if(s.by) html += '<div class="by">'+s.by+'</div>';
    if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
    d.innerHTML = html;
    wrap.appendChild(d);
  });
}
render();
</script>
</body>
</html>
