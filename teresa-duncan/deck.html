<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Running Dental Insurance In-House — a masterclass with Teresa Duncan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1d2b38;        /* deeper shade of her dominant slate #2c3e50 */
    --panel:#243546;
    --rule:#36506a;
    --ink:#eef3f7;
    --muted:#a9bccd;
    --accent:#549db7;    /* her teal blue, from brand.json ranked palette */
    --head:'Playfair Display',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .slide{min-height:88vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;border-bottom:1px solid var(--rule)}
  .kicker{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:1.4rem}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(2.2rem,5.4vw,4rem);line-height:1.05;margin:0 0 1.2rem}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(1.7rem,3.8vw,2.7rem);line-height:1.1;margin:0 0 1rem}
  p.lead{font-size:clamp(1.1rem,1.7vw,1.35rem);color:var(--muted);max-width:46ch}
  p.big{font-size:clamp(1.3rem,2.4vw,1.9rem);max-width:30ch;line-height:1.3}
  .sub{color:var(--muted);font-size:1.15rem;margin-top:.4rem}
  ul{list-style:none;padding:0;margin:1.2rem 0 0;max-width:52ch}
  li{padding:.75rem 0 .75rem 2.1rem;position:relative;border-top:1px solid var(--rule);font-size:1.12rem}
  li:before{content:"";position:absolute;left:0;top:1.15rem;width:.7rem;height:.7rem;
    background:var(--accent);border-radius:2px}
  .pill{display:inline-block;font-family:var(--head);font-size:1rem;color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;padding:.25rem .9rem;margin-bottom:1.2rem}
  .note{color:var(--muted);font-size:1.05rem;max-width:48ch;margin-top:1rem}
  .why li:before{background:var(--accent)}
  .cta-box{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:2.2rem 2.4rem;max-width:40ch}
  .cta-box .btn{display:inline-block;margin-top:1.2rem;background:var(--accent);color:#0f1a24;
    font-weight:600;padding:.8rem 1.6rem;border-radius:8px;text-decoration:none}
  .disc{color:var(--muted);font-size:.82rem;margin-top:1.6rem;max-width:52ch;line-height:1.45}
  .mark{color:var(--accent);font-family:var(--head)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title',
   kicker:"A live masterclass with Teresa Duncan, Odyssey Management",
   h:"Running Dental Insurance In-House",
   sub:"Recover the revenue your practice is already owed."},

  {t:'whofor',
   kicker:"Who this is for",
   h:"If the numbers look fine but something feels off",
   items:["Office managers carrying the insurance load alone",
          "Insurance coordinators who want a real system, not guesswork",
          "Dentists who sense collections should be higher",
          "DSO and multi-location teams standardizing the front office"]},

  {t:'trap',
   kicker:"The trap",
   h:"You were told the software would handle it",
   lead:"Billing software and a clearinghouse move claims. They do not verify a plan, work a secondary, read an EOB, or write an appeal. That part is still human, and it is where the money quietly leaves."},

  {t:'reframe',
   kicker:"The uncomfortable part",
   big:"Every denied, underpaid, or never-appealed claim is revenue you already earned and handed back."},

  {t:'part', pill:"Part One", h:"Where the money actually leaks"},

  {t:'list',
   kicker:"Four quiet leaks",
   h:"It is rarely one big thing",
   items:["Coverage not verified before the visit",
          "Secondary benefits never coordinated",
          "EOBs filed without being read",
          "Denials accepted instead of appealed"]},

  {t:'point',
   kicker:"Why it stays hidden",
   h:"The payer is counting on a tired front desk",
   lead:"Most practices never appeal. A downgrade or a bundle slips through, the claim closes, and the pattern repeats every single week until someone decides to run insurance on purpose."},

  {t:'part', pill:"Part Two", h:"The system you will learn"},

  {t:'point', kicker:"Pillar 1", h:"Verify before the visit",
   lead:"Know the plan design before the patient sits down. Frequencies, downgrades, waiting periods, and the real out-of-pocket, so the conversation at the desk is calm and accurate."},

  {t:'point', kicker:"Pillar 2", h:"Coordination of Benefits",
   lead:"Work the secondary plan on purpose. The birthday rule, dual coverage, and self-funded or employer-direct plans, so you collect what both plans actually owe."},

  {t:'point', kicker:"Pillar 3", h:"Say This, Not That",
   lead:"The coverage-conversation scripts from Moving Your Patients to Yes. Language that replaces we will check and call you back with a clear next step the patient says yes to."},

  {t:'point', kicker:"Pillar 4", h:"Read the EOB line by line",
   lead:"Catch the downgrade, the bundle, and the write-off you never agreed to. The EOB is a map of where your money went, once you know how to read it."},

  {t:'point', kicker:"Pillar 5", h:"The Appeals Process",
   lead:"Documentation plus the appeal script that gets claims paid. Intraoral images, clinical notes, and the exact wording that turns a denial into a payment."},

  {t:'part', pill:"Part Three", h:"What it looks like in your practice"},

  {t:'list', kicker:"After a few weeks",
   h:"The front desk sounds different",
   items:["Fewer we will check and call you back moments",
          "More same-visit yeses to treatment",
          "Cleaner accounts receivable and fewer surprises",
          "A team that runs insurance, instead of fearing it"]},

  {t:'why', kicker:"Why Teresa",
   h:"The person teaching this has done it for 20 years",
   items:["20+ years in dental insurance and office management",
          "Lifetime Achievement Award, American Association of Dental Office Management",
          "Contributor to the ADA CDT Companion Guide",
          "Author of Moving Your Patients to Yes",
          "Host of the Nobody Told Me That! dental podcast"]},

  {t:'point', kicker:"The recap", h:"Run insurance on purpose",
   lead:"Verify, coordinate, script the conversation, read the EOB, and appeal. Five moves, one system, and revenue you are already owed starts staying in the practice."},

  {t:'cta',
   kicker:"Your next step",
   h:"Join the live masterclass",
   lead:"Bring your office manager and your insurance coordinator. We will walk the system live and leave you with the checklist and the scripts.",
   btn:"Save your seat with Odyssey Management",
   disc:"Educational session only. No income or financial result is guaranteed. Results vary by practice, team, and payer mix. Nothing here is legal, coding, or compliance advice."}
];

function esc(s){return s;}
function renderList(items,cls){return "<ul class='"+(cls||"")+"'>"+items.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ul>";}
function slideHTML(s){
  var k=s.kicker?"<div class='kicker'>"+s.kicker+"</div>":"";
  switch(s.t){
    case 'title':
      return k+"<h1>"+s.h+"</h1><p class='lead'>"+s.sub+"</p>";
    case 'whofor':
      return k+"<h2>"+s.h+"</h2>"+renderList(s.items);
    case 'trap':
      return k+"<h2>"+s.h+"</h2><p class='lead'>"+s.lead+"</p>";
    case 'reframe':
      return k+"<p class='big'>"+s.big+"</p>";
    case 'part':
      return "<div class='pill'>"+s.pill+"</div><h2>"+s.h+"</h2>";
    case 'list':
      return k+"<h2>"+s.h+"</h2>"+renderList(s.items);
    case 'point':
      return k+"<h2>"+s.h+"</h2><p class='lead'>"+s.lead+"</p>";
    case 'why':
      return k+"<h2>"+s.h+"</h2>"+renderList(s.items,"why");
    case 'cta':
      return k+"<h2>"+s.h+"</h2><div class='cta-box'><p class='lead'>"+s.lead+"</p>"+
             "<a class='btn' href='https://www.odysseymgmt.com/'>"+s.btn+"</a></div>"+
             "<p class='disc'>"+s.disc+"</p>";
  }
  return "";
}
document.getElementById('deck').innerHTML=S.map(function(s){
  return "<section class='slide'>"+slideHTML(s)+"</section>";
}).join("");
</script>
</body>
</html>
