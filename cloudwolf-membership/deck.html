<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 30-Day AWS Certification Sprint — CloudWolf Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9fafd;        /* cloudwolf.com light panel */
    --panel:#ffffff;
    --rule:#e5e5e5;      /* cloudwolf hairline */
    --ink:#1c244b;       /* cloudwolf deep navy */
    --ink-soft:#33373d;  /* cloudwolf slate */
    --accent:#ff9900;    /* cloudwolf AWS-orange button color */
    --head:'Poppins',system-ui,sans-serif;
    --body:'Instrument Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:52px 54px;margin:0 0 26px;min-height:460px;position:relative;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 2px rgba(28,36,75,.04);
  }
  .kick{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.12;letter-spacing:-.01em}
  h3{font-family:var(--head);font-weight:600;font-size:20px;color:var(--ink)}
  p,li{font-size:19px;line-height:1.5;color:var(--ink-soft)}
  .lead{font-size:23px;color:var(--ink);margin-top:16px;max-width:44ch}
  .sub{font-size:22px;color:var(--ink-soft);margin-top:20px;max-width:52ch}
  ul{margin:22px 0 0;padding-left:0;list-style:none}
  li{position:relative;padding-left:30px;margin-bottom:15px}
  li::before{content:"";position:absolute;left:0;top:10px;width:11px;height:11px;
    border-radius:50%;background:var(--accent)}
  .big{font-family:var(--head);font-weight:700;font-size:80px;color:var(--accent);line-height:1}
  .cover{background:linear-gradient(160deg,#ffffff 0%,#f3f5f8 100%)}
  .cover h1{max-width:20ch}
  .foot{position:absolute;left:54px;bottom:26px;font-family:var(--head);font-weight:600;
    font-size:14px;letter-spacing:.03em;color:var(--ink)}
  .foot .wolf{color:var(--accent)}
  .pageno{position:absolute;right:54px;bottom:26px;font-size:13px;color:#9aa1b4}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:22px 24px}
  .card h3{margin-bottom:8px}
  .card p{font-size:17px}
  .stat-row{display:flex;gap:40px;margin-top:30px;flex-wrap:wrap}
  .stat .n{font-family:var(--head);font-weight:700;font-size:46px;color:var(--accent);line-height:1}
  .stat .l{font-size:16px;color:var(--ink-soft);margin-top:6px;max-width:20ch}
  .rule{height:3px;width:56px;background:var(--accent);border-radius:2px;margin:22px 0 4px}
  .disc{font-size:14px;color:#9aa1b4;line-height:1.5;margin-top:22px;max-width:70ch}
  .week{display:flex;align-items:baseline;gap:16px;margin-bottom:14px}
  .week .w{font-family:var(--head);font-weight:700;color:var(--accent);font-size:17px;
    min-width:66px;letter-spacing:.02em}
  .week .d{font-size:18px;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'cover', kick:'A CloudWolf Masterclass', h:'The 30-Day AWS Certification Sprint',
   sub:'How busy professionals earn their first AWS certification in 30 minutes a day, with the Wolf Pack behind them.'},

  {t:'statement', kick:'Who this is for', h:'You do not need a tech background. You need a finish line.',
   bullets:['Career switchers moving into cloud roles, with no prior AWS experience',
            'Developers and engineers who want the credential to stay competitive',
            'Working practitioners who keep meaning to certify and never quite start']},

  {t:'statement', kick:'Why now', h:'Cloud is the credential the market keeps asking for.',
   sub:'AWS runs a large share of the internet, and hiring managers use the certification as a fast filter for who can be trusted with it. In a cloud-first job market, the letters after your name open the first door. The only question is how fast you get them.'},

  {t:'statement', kick:'The trap', h:'The problem was never the material.',
   lead:'You have started before. A 40-hour video course, a stack of PDFs, the best intentions on a Sunday night. Then work happens, the tab stays open, and week three never comes.'},

  {t:'reframe', kick:'The reframe', h:'Most AWS study is built for people with unlimited time.',
   sub:'Long lectures, no checkpoints, no one waiting on you. That format quietly assumes you can disappear for a weekend. Real professionals cannot. So the format, not your ability, is what keeps failing you.'},

  {t:'statement', kick:'Part one', h:'Why smart people stall on the exam.',
   bullets:['Boil-the-ocean scope: trying to learn all of AWS instead of one exam blueprint',
            'The motivation cliff: energy is high on day one and gone by day ten',
            'No feedback loop: you cannot tell if you are actually exam-ready until test day',
            'Studying alone: nobody notices when you quit, so quitting is easy']},

  {t:'reframe', kick:'Part one', h:'The exam rewards finishers, not geniuses.',
   sub:'The Cloud Practitioner and Solutions Architect exams are passable by anyone who covers the blueprint and practices under real conditions. They are a filter for follow-through, not raw talent. That is good news, because follow-through can be engineered.'},

  {t:'statement', kick:'The method', h:'Four things change when study is built for a busy life.',
   lead:'CloudWolf is built on four pillars. None of them is "study harder." Each one removes a specific reason people quit.'},

  {t:'grid', kick:'The four pillars', h:'A system for finishing, not just starting.',
   cards:[['Bite-sized reps','269 short lessons, 30 minutes a day'],['The Wolf Pack','A community that keeps you moving'],['Real practice','Labs and full exams that tell the truth'],['A completion protocol','Pass-or-We-Pay discipline']]},

  {t:'pillar', kick:'Pillar one', h:'Bite-sized daily reps.',
   sub:'The exam blueprint is broken into 269 short lessons, most around four minutes, across 20 chapters. Thirty minutes a day compounds into a certification in about a month, because a lesson you can finish on a lunch break is a lesson you actually finish.'},

  {t:'pillar', kick:'Pillar two', h:'The Wolf Pack carries you across.',
   sub:'You study inside a community of ambitious professionals from around the world. Questions get answered by people who have passed. Live events and mentorship keep you moving. Accountability is the difference between week three and the finish line.'},

  {t:'pillar', kick:'Pillar three', h:'Practice like it is the real exam.',
   sub:'Hands-on labs and walkthroughs put you inside the console, not just the slides. Full-length practice exams, 65 questions with detailed explanations, tell you the truth about whether you are ready before AWS does.'},

  {t:'pillar', kick:'Pillar four', h:'A completion protocol, not a hope.',
   sub:'The Pass-or-We-Pay standard sets the discipline: finish 100 percent of the course and materials in 30 days, then sit the exam within two weeks. Complete the work and do not pass, and your second attempt is covered. The rule is what turns intention into a booked exam.'},

  {t:'statement', kick:'How it fits', h:'Each pillar props up the next.',
   bullets:['Bite-sized lessons make daily study survivable',
            'The Wolf Pack makes daily study social, so you keep showing up',
            'Practice exams make progress measurable, so momentum stays visible',
            'The completion protocol makes the finish date real, so you book the exam']},

  {t:'timeline', kick:'What 30 days looks like', h:'One month, one certification.',
   weeks:[['Week 1','Cloud foundations and core services, one 30-minute session a day. First lab in the console.'],
          ['Week 2','Compute, storage, networking. Chapter quizzes confirm each block before you move on.'],
          ['Week 3','Security, pricing, the exam-heavy domains. First full practice exam to find the gaps.'],
          ['Week 4','Practice exams to a confident score, targeted review, then book and sit the real thing.']]},

  {t:'proof', kick:'What happens when people finish', h:'The numbers CloudWolf students report.',
   stats:[['98%','pass on first attempt'],['600+','professionals trained'],['4.97 / 5','average program rating']],
   note:'Figures reported by CloudWolf across trained students. Individual results depend on the work you put in.'},

  {t:'credibility', kick:'Who is teaching you', h:'A decade of getting people certified.',
   sub:'CloudWolf is led by Kirill Eremenko and Hadelin de Ponteves, instructors with ten years in online education and more than two million students taught. CloudWolf is where that teaching craft is pointed entirely at AWS certification.'},

  {t:'statement', kick:'The outcome', h:'What you walk away with in a month.',
   bullets:['An AWS certification on your profile and your resume',
            'Console-tested, exam-tested confidence, not just theory',
            'A pack of peers who are moving where you are moving']},

  {t:'statement', kick:'The shift', h:'Stop collecting courses. Book an exam.',
   bullets:['A single exam blueprint, not all of AWS at once',
            'Thirty minutes a day you can actually protect',
            'A pack that notices whether you show up',
            'A real practice score before you spend the exam fee']},

  {t:'cta', kick:'Start the sprint', h:'Your first AWS certification is 30 days away.',
   sub:'Start your free trial, meet the Wolf Pack, and take your first 30-minute lesson today.',
   cta:'Start your free trial at cloudwolf.com',
   disc:'Educational information only. CloudWolf does not guarantee certification, exam scores, employment, or income; outcomes depend on individual effort and eligibility. The Pass-or-We-Pay guarantee covers the cost of a second exam attempt under its stated completion terms. AWS and AWS Certification are trademarks of Amazon Web Services, Inc.; CloudWolf is an independent training provider and is not affiliated with or endorsed by Amazon Web Services.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cover' ? ' cover' : '');
  let h = '';
  if(s.kick) h += `<div class="kick">${s.kick}</div>`;
  if(s.t==='cover'){
    h += `<h1>${s.h}</h1>`;
    if(s.sub) h += `<p class="sub">${s.sub}</p>`;
  } else {
    h += `<h2>${s.h}</h2>`;
  }
  if(s.lead) h += `<p class="lead">${s.lead}</p>`;
  if(s.sub && s.t!=='cover') h += `<p class="sub">${s.sub}</p>`;
  if(s.bullets){ h += '<ul>' + s.bullets.map(b=>`<li>${b}</li>`).join('') + '</ul>'; }
  if(s.cards){ h += '<div class="grid">' + s.cards.map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('') + '</div>'; }
  if(s.weeks){ h += '<div style="margin-top:26px">' + s.weeks.map(w=>`<div class="week"><div class="w">${w[0]}</div><div class="d">${w[1]}</div></div>`).join('') + '</div>'; }
  if(s.stats){ h += '<div class="stat-row">' + s.stats.map(t=>`<div class="stat"><div class="n">${t[0]}</div><div class="l">${t[1]}</div></div>`).join('') + '</div>'; }
  if(s.note) h += `<p class="disc">${s.note}</p>`;
  if(s.cta){ h += `<div class="rule"></div><h3 style="margin-top:16px;color:var(--accent)">${s.cta}</h3>`; }
  if(s.disc) h += `<p class="disc">${s.disc}</p>`;
  if(s.t!=='cover' && s.t!=='cta') h += `<div class="foot">Cloud<span class="wolf">Wolf</span></div><div class="pageno">${i+1} / ${S.length}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
