<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Four Categories of Consulting Value, a masterclass with Erin Halper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f5;
    --panel:#ffffff;
    --rule:#e0e3ea;
    --ink:#112337;
    --muted:#5b6472;
    --accent:#204ce5;
    --accent2:#527eff;
    --head:'Playfair Display',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:64px 74px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 22px 56px rgba(17,35,55,.09);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* four-quadrant motif: a quiet value map, top-left mark + faint corner cross */
  .slide::before{content:'';position:absolute;top:34px;left:74px;width:26px;height:26px;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/11px 11px no-repeat,
      linear-gradient(var(--accent2),var(--accent2)) right top/11px 11px no-repeat,
      linear-gradient(var(--accent2),var(--accent2)) left bottom/11px 11px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/11px 11px no-repeat}
  .slide::after{content:'';position:absolute;right:-90px;bottom:-90px;width:280px;height:280px;
    background:
      linear-gradient(var(--rule),var(--rule)) center/2px 100% no-repeat,
      linear-gradient(var(--rule),var(--rule)) center/100% 2px no-repeat;
    opacity:.6;border-radius:50%;transform:rotate(8deg)}
  .kick{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:14px 0 22px}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.05;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:41px;line-height:1.1;margin:0 0 20px;letter-spacing:-.005em}
  h3{font-family:var(--head);font-weight:600;font-size:29px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:46ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none;position:relative;z-index:1}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 42px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:16px;border-radius:4px;
    border:3px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:112px;line-height:1;font-weight:700;letter-spacing:-.02em}
  .strike{color:transparent;-webkit-text-stroke:2px #11233755;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap;position:relative;z-index:1}
  .cell{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:24px 26px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:25px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:58px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:26px;max-width:60ch;position:relative;z-index:1}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:62ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px;position:relative;z-index:1}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:38px}h2{font-size:29px}.big{font-size:68px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">The Upside · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Four Categories of Consulting Value',p:'Why the best-paid consultants never sell by the hour.',pres:'With <b>Erin Halper</b>, Founder & CEO, The Upside'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['The four ways your work actually creates value','A simple map you can hold in your head on any call.'],['A way to price on the outcome, not the deliverable','So the fee follows the result, not the clock.'],['The first repricing move you can make this week','One service, reframed, requoted.']]},
 {t:'audience',kick:'Who this is for',h:'You are good at the work. The pricing is the hard part.',p:'Independent consultants, advisors and fractional experts who are winning clients but still quoting hours, packages and day rates that never quite reflect the value delivered.',who:'<b>The trap:</b> you raise your rate and hold your breath, because you are still defending a number instead of a result.'},
 {t:'reframe',kick:'The reframe',big1:'The deliverable.',big2:'Only the <span class="em">surface</span>.',p:'A client asks for a website, a strategy, a campaign or a process fix. That is the surface. What they are actually buying is the business result sitting underneath it.'},
 {t:'part',kick:'Part one',h:'Why the hour caps your income.'},
 {t:'point',kick:'The core problem',h:'Hourly trained your clients to compare you on a number.',p:'When you charge by the hour, the client evaluates the rate, not the result. Every conversation turns into a debate about the number, and a number always has a ceiling.'},
 {t:'point',kick:'The core problem',h:'Your speed works against you.',p:'The better you get, the faster you finish. Hourly quietly punishes you for it, so ten years of expertise delivered in two hours reads as too expensive on an invoice that only counts time.'},
 {t:'framework',kick:'The core problem',h:'Two ways to be paid.',row:[['Paid for hours','You sell your time. The invoice counts inputs. Getting faster lowers the bill.'],['Paid for outcomes','You sell the result. The fee reflects value. Getting faster raises your margin.']],p:'This masterclass is about moving from the first to the second, on purpose.'},
 {t:'part',kick:'Part two',h:'The four categories of value.'},
 {t:'lenses',kick:'The framework',h:'Every engagement does one of four things.',li:[['Grow revenue','The work that helps them make more money.'],['Cut costs','The work that helps them save money.'],['Create access','The doors, deals, relationships and markets you open for them.'],['Remove the headache','The problem blocking their growth that you make disappear.']]},
 {t:'point',kick:'The framework',h:'"Build me a website" is never about the website.',p:'A site that books demos is revenue. A site that deflects support tickets is cost. Same deliverable, different category, different price. Name the category before you quote.'},
 {t:'point',kick:'The framework',h:'Find the number underneath the ask.',p:'Before you price, decide which of the four this engagement drives and roughly what it is worth to the client. That number, not your hours, is where the fee should anchor.'},
 {t:'point',kick:'The multiplier',h:'The narrower you position, the higher the value.',p:'Strip your resume down to the 5 to 10 percent only you do well. One consultant repackaged that slice into a $10k-a-month engagement for a few hours a week. Same person, different price logic.'},
 {t:'cycle',kick:'The pricing playbook',h:'How to reprice a service.',steps:['Set a floor from what you would want to earn full-time','Move off hourly to a project, retainer or scoped fee','Tie the fee to the category of value it creates','Watch your close rate; a very high one means test higher','Discount only for a defined return: a name, a testimonial, future work'],p:'Five moves. The last one keeps a discount honest instead of a habit.'},
 {t:'part',kick:'Part three',h:'What a value-priced practice looks like.'},
 {t:'looks',kick:'The outcome',h:'The rate stops being the conversation.',li:[['Your proposal names the outcome','Not the hours, not the deliverable list.'],['Your best work earns more, not less','Speed and skill raise your margin instead of shrinking the bill.'],['You choose the clients','A respected practice that brings consistent work on your terms.']]},
 {t:'whyme',kick:'Why Erin',h:'A career spent on the business of consulting.',li:[['Founder & CEO, The Upside','The award-winning community and accelerator for independent consultants.'],['A 7-year consulting career of her own','Marketing work tied to more than $3 billion in client funding and deal sourcing.'],['Advised more than 1,000 consultants','Helping them build respected, freedom-first practices.']]},
 {t:'cta',kick:'Your next step',h:'Ready to price on your value?',ctas:['<b>Apply to join The Upside</b> and build your practice with a room of senior independent consultants.','<b>Start with the Upside Accelerator</b>, the step-by-step course for building a consultancy that pays.'],disc:'This masterclass is educational. It shares frameworks and approaches for pricing and positioning a consulting practice; it is not advice for your specific situation and not a guarantee of any particular income or result. Outcomes vary.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
