<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leading From Presence | A Masterclass with Joyce Chen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Halant:wght@400;500;600;700&family=Lexend+Deca:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#f7f4f3;        /* brand warm off-white (103 uses) */
    --ink:#131314;       /* brand near-black ink (34) */
    --ink-soft:#44413f;
    --ink-muted:#857f7b;
    --panel:#1a3742;     /* brand deep teal (21) */
    --accent:#7a150d;    /* brand oxblood, dominant non-neutral (80) */
    --rule:#e4ded9;
  }
  html,body{height:100%;}
  body{
    font-family:'Lexend Deca',system-ui,sans-serif;
    background:var(--panel);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .stage{max-width:1040px;margin:0 auto;padding:40px 20px 80px;}
  .slide{
    background:var(--bg);
    border-radius:4px;
    padding:64px 64px 58px;
    margin:22px 0;
    min-height:540px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,0.04);
  }
  /* the "line" motif: above the line / below the line */
  .slide::before{
    content:"";position:absolute;left:64px;right:64px;top:50%;
    height:1px;background:var(--rule);opacity:0;
  }
  .slide.line::before{opacity:1;}
  .kicker{
    font-family:'Lexend Deca',sans-serif;font-weight:600;font-size:12px;
    letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);
    margin-bottom:22px;
  }
  h1{font-family:'Halant',Georgia,serif;font-weight:600;font-size:58px;line-height:1.08;letter-spacing:-0.01em;color:var(--ink);}
  h2{font-family:'Halant',Georgia,serif;font-weight:600;font-size:40px;line-height:1.15;color:var(--ink);margin-bottom:22px;}
  .promise{font-family:'Halant',serif;font-size:26px;color:var(--panel);margin-top:26px;line-height:1.3;}
  p{font-size:20px;line-height:1.6;color:var(--ink-soft);margin-bottom:16px;max-width:42ch;}
  p.lead{font-size:23px;color:var(--ink);}
  ul{list-style:none;margin-top:10px;}
  li{font-size:20px;line-height:1.5;color:var(--ink-soft);padding-left:26px;position:relative;margin-bottom:16px;max-width:46ch;}
  li::before{content:"";position:absolute;left:0;top:13px;width:12px;height:1.5px;background:var(--accent);}
  .big{font-family:'Halant',serif;font-size:34px;color:var(--panel);line-height:1.25;max-width:30ch;}
  .meta{margin-top:40px;font-size:14px;color:var(--ink-muted);letter-spacing:0.04em;}
  .pill{display:inline-block;font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:5px 12px;border-radius:2px;margin-bottom:24px;}
  .above{color:var(--panel);font-weight:600;}
  .below{color:var(--accent);font-weight:600;}
  .disclaimer{margin-top:30px;font-size:13px;line-height:1.5;color:var(--ink-muted);max-width:60ch;}
  .num{font-family:'Halant',serif;font-size:15px;color:var(--ink-muted);position:absolute;right:30px;bottom:22px;}
  .cta h2{font-size:46px;}
  @media(max-width:720px){
    .slide{padding:40px 28px;min-height:auto;}
    h1{font-size:38px;} h2{font-size:30px;} .cta h2{font-size:34px;}
    p,li{font-size:18px;} .big{font-size:26px;}
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const S = [
  {t:'title',
    k:'A live masterclass with Joyce Chen',
    h:'Leading From Presence',
    promise:'Why your clearest thinking disappears in the moments that matter most, and the shift that brings it back.',
    meta:'For executives, founders and creative leaders who lead under real pressure.' },

  {t:'audience',
    k:'Who this is for',
    h:'You lead at the edge.',
    p:'You run teams, raise money, ship under deadline, make calls no one else will make. On paper you have the tools. You have read the books. You have done the work.',
    lead:'And still, in the moment that counts, you watch yourself react instead of lead.' },

  {t:'trap', line:true,
    k:'The trap',
    h:'The harder it gets, the smaller you lead.',
    p:'The email that lands wrong. The board member who pushes. The co-founder conversation you keep avoiding. Pressure rises and your range narrows: you defend, you control, you go quiet, you push harder.',
    p2:'Everyone can see it except you, because in that moment you are certain you are being reasonable.' },

  {t:'reframe',
    k:'The reframe',
    big:'Leadership does not break down in your calendar. It breaks down in your body, about ninety seconds before you say the thing you regret.' },

  {t:'ninety',
    k:'The window',
    h:'It all turns on ninety seconds.',
    p:'A trigger fires. For about ninety seconds a wave of chemistry moves through your body. If you can feel that wave and let it pass, you stay yourself.',
    lead:'Miss it, and the wave makes the decision for you. Most leaders have never been taught to feel it at all.' },

  {t:'part',
    pill:'Part One',
    h:'Above the line, below the line.',
    p:'Every moment of leadership happens in one of two states. Not good or bad. Open or closed.',
    pts:[
      'Below the line: threatened, defensive, needing to be right, needing to look good, needing to be in control.',
      'Above the line: open, curious, willing to learn, able to see the whole board instead of just the threat.',
      'The skill is not staying above the line forever. No one does that. The skill is noticing, in real time, which side you are on.'
    ] },

  {t:'cost',
    k:'What below the line costs',
    h:'Reactivity is expensive.',
    pts:[
      'Decisions made to relieve your own discomfort, not to serve the outcome.',
      'A team that manages your mood instead of doing their best work.',
      'The same conflict, the same bottleneck, the same hire-and-regret, on repeat.',
      'Drama. The meetings about the meetings. The energy that never reaches the actual work.'
    ] },

  {t:'triangle',
    k:'The shape it takes',
    h:'Victim, villain, hero.',
    p:'Below the line, every story collapses into three roles. Something is being done to you. Someone is to blame. And you have to swoop in and fix it.',
    lead:'It feels like leadership. It is the opposite. It keeps you busy inside a drama instead of present to what is actually needed.' },

  {t:'part', line:true,
    pill:'Part Two',
    h:'Why willpower will not fix this.',
    p:'You cannot think your way out of a reaction that starts faster than thought. By the time the smart part of your brain comes online, the moment is already gone.',
    lead:'This is why more frameworks, more mindset, more discipline keep failing you here. The reaction is not in your mind. It is in your nervous system.' },

  {t:'framework',
    k:'The method, piece one',
    h:'Start in the body.',
    p:'Somatic work is how you catch the reaction while it is still a sensation, before it becomes a behaviour. The tight chest. The held breath. The heat in the face.',
    lead:'Those are not noise. They are the earliest, most honest signal that you have dropped below the line, and they arrive seconds before the words do.' },

  {t:'framework',
    k:'The method, piece two',
    h:'Know your pattern.',
    p:'Through the Enneagram we map the specific story that runs you under pressure. The one that says you have to hold it all, or prove them wrong, or keep the peace at any cost.',
    lead:'When you can see your pattern coming, it stops being who you are and starts being something you can choose to set down.' },

  {t:'framework',
    k:'The method, piece three',
    h:'Shift, then speak.',
    pts:[
      'Feel the signal in the body and name it, silently, to yourself.',
      'Take the one breath that moves you from threat back to presence.',
      'Choose the response from above the line, with the whole situation in view.',
      'Say the true thing, cleanly, instead of the defended thing.'
    ] },

  {t:'practice',
    k:'The practice',
    h:'One breath is the whole technique.',
    p:'Not a retreat. Not an hour of meditation. One conscious breath, taken in the exact moment the chest tightens, is enough to move you from reaction back to choice.',
    lead:'Everything else in this work is training yourself to notice the moment that breath is needed, and to take it before you speak.' },

  {t:'demo', line:true,
    k:'Two leaders, one moment',
    h:'Same trigger, two nervous systems.',
    p:'Below the line: the feedback lands, your jaw tightens, you explain why they are wrong, the room closes, nothing changes.',
    p2:'Above the line: the feedback lands, you feel the tighten, you breathe, you get curious, you ask the question that actually moves the work forward. Same trigger. Different nervous system.' },

  {t:'who',
    k:'Why me',
    h:'I have led from both sides of the line.',
    p:'I spent years as Global Head of Production at Meta, leading large teams through high stakes and short deadlines. I know the pressure from the inside, not from a textbook.',
    p2:'I am a certified coach in The 15 Commitments of Conscious Leadership, a Somatic Experiencing Practitioner, and an accredited Enneagram teacher. I have coached leaders at Adobe, Apple, Airbnb, Anthropic, Google, Microsoft, Salesforce and Sony.' },

  {t:'learnable',
    k:'The good news',
    h:'This is trainable, not fixed.',
    p:'Presence under pressure is not a personality you were born with or without. It is a capacity, and like any capacity it grows with the right practice and the right attention.',
    lead:'The leaders who seem unshakeable are not calmer by nature. They have simply trained the skill you are about to start.' },

  {t:'takeaway',
    k:'What you leave with',
    h:'Three things you can use tomorrow.',
    pts:[
      'The body signal that tells you, before anyone else can see it, that you have dropped below the line.',
      'Your own pressure pattern named, so you can catch it instead of being run by it.',
      'The one-breath reset that buys you back the choice between reacting and leading.'
    ] },

  {t:'belief',
    k:'What changes',
    big:'When you can stay present under pressure, you stop managing your reactions and start leading your life. The work gets better. So does everything around it.' },

  {t:'cta',
    k:'Your next step',
    h:'Lead from presence, on purpose.',
    p:'If this is the work you want to do, the next step is a short conversation to see if we are a fit. We map where pressure takes you below the line, and what it would take to change it.',
    disclaimer:'This masterclass is educational. It is about leadership practice, not therapy, and it is not a substitute for mental health care. No specific outcome or result is promised or guaranteed; what you get from the work depends on the work you do.' }
];

const stage = document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'+(s.line?' line':'')+(s.t==='cta'?' cta':'');
  let html='';
  if(s.pill) html+='<div class="pill">'+s.pill+'</div>';
  if(s.k) html+='<div class="kicker">'+s.k+'</div>';
  if(s.h && s.t==='title') html+='<h1>'+s.h+'</h1>';
  else if(s.h) html+='<h2>'+s.h+'</h2>';
  if(s.promise) html+='<div class="promise">'+s.promise+'</div>';
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.lead && !s.p) html+='<p class="lead">'+s.lead+'</p>';
  if(s.p) html+='<p>'+s.p+'</p>';
  if(s.p2) html+='<p>'+s.p2+'</p>';
  if(s.lead && s.p) html+='<p class="lead">'+s.lead+'</p>';
  if(s.pts){ html+='<ul>'; s.pts.forEach(x=>html+='<li>'+x+'</li>'); html+='</ul>'; }
  if(s.meta) html+='<div class="meta">'+s.meta+'</div>';
  if(s.disclaimer) html+='<div class="disclaimer">'+s.disclaimer+'</div>';
  html+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;
  stage.appendChild(d);
});
</script>
</body>
</html>
