<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Spanish Way — Chris Lewit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ee;
    --panel:#fcfcfc;
    --ink:#1d1c1e;
    --soft:#55514c;
    --accent:#b4431f;
    --rule:#e2dcd1;
    --display:'Montserrat',system-ui,sans-serif;
    --serif:'Spectral',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 50px;margin:0 0 26px;box-shadow:0 1px 0 rgba(29,28,30,.03)}
  .kick{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.05;margin:0 0 16px}
  h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.12;margin:0 0 14px}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin:0 0 14px}
  .lede{font-size:22px;color:var(--soft)}
  .sub{font-size:17px;color:var(--soft);font-style:italic}
  ul{margin:8px 0 0;padding:0 0 0 2px;list-style:none}
  li{font-size:19px;line-height:1.5;padding:10px 0 10px 30px;position:relative;border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .pill{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;
    color:var(--panel);background:var(--accent);padding:5px 12px;border-radius:999px;margin:0 0 16px}
  .big{font-size:30px;line-height:1.3;font-weight:500}
  .arc{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .arc span{font-family:var(--display);font-weight:700;font-size:15px;background:var(--bg);
    border:1px solid var(--rule);border-radius:10px;padding:12px 16px}
  .cta{background:var(--ink);color:var(--panel)}
  .cta h1,.cta h2{color:var(--panel)}
  .cta p{color:#d9d4cc}
  .cta .kick{color:#e8a98f}
  .disc{font-size:14px;color:#b9b2a8;margin-top:22px;font-style:italic}
  .court{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent),#d98a5f);margin:22px 0 0}
  .n{font-family:var(--display);font-weight:800;color:var(--accent);font-size:15px;margin-right:8px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <p class="kick">A masterclass for tennis parents</p>
    <h1>The Spanish Way</h1>
    <p class="lede">How to build a junior who wins pretty, and keeps winning long after the fast starters stall.</p>
    <div class="court"></div>
    <p class="sub" style="margin-top:22px">With Chris Lewit, author of The Secrets of Spanish Tennis</p>`},

  {t:'agenda', cls:'', html:`
    <p class="kick">Who this is for</p>
    <h2>If your child lives for this game, this hour is for you.</h2>
    <p>Parents of a serious junior who want more than a trophy this season. You want a player with a real foundation, a game that holds up at 16, and strokes that look as good as they are effective.</p>
    <p class="sub">By the end you will know what the Spanish system builds, in what order, and why it lasts.</p>`},

  {t:'trap', cls:'', html:`
    <p class="kick">The trap</p>
    <h2>You were told talent shows up early.</h2>
    <p>So every season feels like a race you might already be losing. A faster kid wins the 12s. A coach pushes results now. The pressure is to chase the next tournament instead of building the next player.</p>
    <p class="big">The race rewards the wrong things, and the bill comes due later.</p>`},

  {t:'reframe', cls:'', html:`
    <p class="kick">The hard truth</p>
    <h2>Most juniors are built backwards.</h2>
    <p>Results first. Foundation never. They win early on raw speed and a flat ball, then hit a wall the moment opponents stop missing. The talent was real. The build was rushed.</p>
    <p class="big">A champion is not found. A champion is built, in a specific order.</p>`},

  {t:'part', cls:'', html:`
    <p class="pill">Part One</p>
    <h1>Why the American path stalls</h1>
    <p class="lede">Three habits that produce a fast 12-year-old and a stuck 16-year-old.</p>`},

  {t:'problem', cls:'', html:`
    <p class="kick">The pattern</p>
    <h2>Results worship, campus worship, rushed strokes.</h2>
    <ul>
      <li>The calendar is built around the next tournament, not the next skill.</li>
      <li>Families buy a facility and a logo, and assume development comes with it.</li>
      <li>Technique is taught for this week's match, so footwork and balance never get built.</li>
    </ul>`},

  {t:'problem2', cls:'', html:`
    <p class="kick">The plateau</p>
    <h2>The 14-to-16 wall.</h2>
    <p>This is where the rushed build shows. The flat ball has no margin. The feet are late. There is no defense to fall back on, and no engine to grind a third set. The player is not lazy. The player was never given a foundation to scale.</p>`},

  {t:'part', cls:'', html:`
    <p class="pill">Part Two</p>
    <h1>The Spanish Method</h1>
    <p class="lede">Six pillars, learned at Spain's top academies, built in order from the ground up.</p>`},

  {t:'pillar', cls:'', html:`
    <p class="kick"><span class="n">01</span>The weapon</p>
    <h2>A heavy topspin forehand.</h2>
    <p>Not a flat ball that lives on the line. A forehand with weight and shape that pushes opponents back, buys time, and gets heavier the longer the rally goes. The weapon every Spanish junior builds first.</p>`},

  {t:'pillar', cls:'', html:`
    <p class="kick"><span class="n">02</span>The standard</p>
    <h2>Relentless consistency.</h2>
    <p>Shot tolerance is a skill, and it is trained on purpose. Win the long rally. Make one more ball than feels comfortable. Low unforced errors are not caution, they are pressure applied to the other side of the net.</p>`},

  {t:'pillar', cls:'', html:`
    <p class="kick"><span class="n">03</span>The engine</p>
    <h2>Footwork and balance.</h2>
    <p>Spain leads the world here for a reason. Reception, positioning, and recovery are drilled until they are automatic. A player who arrives early and balanced can hit the right ball. A player who arrives late can only react.</p>`},

  {t:'pillar', cls:'', html:`
    <p class="kick"><span class="n">04</span>The safety net</p>
    <h2>Defense into offense.</h2>
    <p>Retrieve, reset, and flip the point. A Spanish-trained junior does not panic when pushed off the court. They buy a ball, re-center, and turn a scramble back into an attack. That is how matches are stolen.</p>`},

  {t:'pillar', cls:'', html:`
    <p class="kick"><span class="n">05</span>The mind</p>
    <h2>The warrior mindset.</h2>
    <p>The Spanish word for it is sufrir, to suffer well. Embrace the hard rally, the long practice, the uncomfortable set. A player who is trained to compete when it hurts does not fold when the match gets heavy.</p>`},

  {t:'pillar', cls:'', html:`
    <p class="kick"><span class="n">06</span>The base</p>
    <h2>Fitness superiority.</h2>
    <p>Endurance, strength, and recovery are built in from the start, not bolted on at 17. The third set belongs to the player who still has legs. Fitness is the pillar that lets all the others keep working under fatigue.</p>`},

  {t:'synthesis', cls:'', html:`
    <p class="kick">Where it leads</p>
    <h2>Winning pretty.</h2>
    <p>Put the six pillars together and you get what my book calls winning pretty. Strokes that are rhythmic, fluid, and elastic because they are built on modern biomechanics, not guesswork. A game that is beautiful because it is efficient, and efficient because it wins.</p>
    <div class="court"></div>`},

  {t:'part', cls:'', html:`
    <p class="pill">Part Three</p>
    <h1>What the build looks like</h1>
    <p class="lede">The same long-term arc I use to develop prodigies, stage by stage.</p>`},

  {t:'arc', cls:'', html:`
    <p class="kick">The Prodigy Maker arc</p>
    <h2>Foundation, then weapon, then competitor.</h2>
    <p>Each stage has its own job, and no stage is skipped to chase a result. The foundation is movement and the heavy ball. The weapon is the forehand and the patterns. The competitor is the mind and the fitness that carry it into real matches.</p>
    <div class="arc"><span>1. Foundation</span><span>2. Weapon</span><span>3. Competitor</span></div>`},

  {t:'proof', cls:'', html:`
    <p class="kick">Why me</p>
    <h2>I went to the source and brought it back.</h2>
    <p>I spent years studying inside Spain's top academies, including with the Bruguera family, and wrote The Secrets of Spanish Tennis and The Tennis Technique Bible so the system would not stay a secret. I coach a boutique group, two to three players a court, so the method is actually taught, not just announced.</p>`},

  {t:'cta', cls:'cta', html:`
    <p class="kick">Your next step</p>
    <h1>Build the player, the right way.</h1>
    <p>If you want your junior built on a foundation that lasts, let's talk about whether the academy is the right fit. I take a small group on purpose, so I meet every family first.</p>
    <p class="big" style="color:#fff">Book an evaluation with Chris Lewit Tennis Academy.</p>
    <p class="disc">Educational content only. Player development varies by individual, effort, and circumstance. No ranking, recruitment, scholarship, or competitive result is promised or guaranteed. Results vary.</p>`}
];
const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  el.innerHTML = s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
