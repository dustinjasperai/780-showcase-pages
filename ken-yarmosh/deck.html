<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Scalable Service Offer, with Ken Yarmosh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#00212b;        /* his dominant ground (brand.json) */
    --panel:#06313d;     /* lifted teal of the same family */
    --rule:#17596b;      /* hairline */
    --accent:#2cb0da;    /* his cyan (brand.json) */
    --ink:#eaf4f7;
    --muted:#9fc2cd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:16px;
    padding:52px 48px;
    margin:22px 0;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;width:5px;height:100%;background:var(--accent)}
  .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:34px;line-height:1.14;margin-bottom:8px}
  .sub{font-size:20px;color:var(--muted);margin-top:16px;max-width:40ch}
  .lead{font-size:22px;line-height:1.5;max-width:52ch}
  .big{font-family:"IBM Plex Serif",Georgia,serif;font-weight:700;font-size:40px;line-height:1.16;max-width:24ch}
  ul{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:14px;max-width:60ch}
  li{position:relative;padding-left:30px;font-size:19px}
  li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .num{font-family:"IBM Plex Serif",serif;color:var(--accent);font-size:17px;font-weight:700;margin-bottom:10px;letter-spacing:.04em}
  .ladder{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  .rung{background:rgba(44,176,218,.10);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;font-weight:600;font-size:18px}
  .rung span{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:4px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px}
  .card{background:rgba(255,255,255,.03);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .card h3{font-family:"IBM Plex Serif",serif;font-size:18px;color:var(--accent);margin-bottom:10px}
  .card p{color:var(--muted);font-size:16px}
  .cred{display:flex;flex-wrap:wrap;gap:16px;margin-top:22px}
  .stat{flex:1 1 200px;border-top:2px solid var(--accent);padding-top:12px}
  .stat b{font-family:"IBM Plex Serif",serif;font-size:30px;display:block}
  .stat small{color:var(--muted);font-size:15px}
  .foot{position:absolute;bottom:18px;right:28px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .cta-step{font-family:"IBM Plex Serif",serif;font-size:24px;color:var(--accent);margin-top:14px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:"A live masterclass with Ken Yarmosh",
    h1:"The Scalable Service Offer",
    sub:"How to grow service revenue without adding headcount." },

  {t:'promise',
    eyebrow:"What you'll leave with",
    h2:"One reworked offer that changes the math",
    lead:"By the end you'll have a clear way to charge premium rates, serve fewer clients, and stop being the person every deal runs through. No new hires required." },

  {t:'who',
    eyebrow:"Who this is for",
    h2:"Founders who are the business",
    bullets:["Consultants, agency owners, and service founders doing good work",
             "Revenue is capped by your hours, not your market",
             "Every proposal, every delivery, every decision still runs through you",
             "You've been told to 'just hire' or 'just productize' and it hasn't worked"] },

  {t:'trap',
    eyebrow:"The trap",
    big:"Your calendar is full, your revenue is flat, and a week off would break everything." },

  {t:'reframe',
    eyebrow:"The reframe",
    big:"You don't have a time problem. You have an offer problem.",
    sub:"Trading time and money for deliverables, milestones, and projects is a recipe for burnout." },

  {t:'part', num:"Part one", h2:"Why scaling 'harder' doesn't work" },

  {t:'body',
    eyebrow:"The ceiling",
    h2:"More hours and more hires just move the bottleneck",
    bullets:["Selling deliverables ties your income to your time, so growth means more time",
             "Hiring to do the delivery often moves the bottleneck onto you as the manager",
             "The real constraint is how the offer is built, not how hard you work"] },

  {t:'body',
    eyebrow:"Why the usual tools fall short",
    h2:"Canvases built for teams, not for you",
    lead:"The Value Proposition Canvas and Business Model Canvas assume team-based scaling and reward deliverables over transformations. For a service founder they describe the wrong business." },

  {t:'part', num:"Part two", h2:"The Scalable Service Offer method" },

  {t:'pillar', num:"Pillar 1", h2:"Lighthouse Clients",
    lead:"Define the one premium ideal client: the right problem, values outcomes, real budget, and respect for your expertise. Then filter everyone else out, so you attract buyers who pay premium rates instead of chasing everyone." },

  {t:'pillar', num:"Pillar 2", h2:"Blue Ocean Service",
    lead:"Design an offer that can't be price-compared. A signature method and a distinctive way of delivering it means you compete on value, not on being the cheapest proposal in the inbox." },

  {t:'pillar', num:"Pillar 3", h2:"Optimize your channels",
    lead:"Pick the one to three places your Lighthouse Clients already gather and go deep, with messaging and relationships built for them, instead of spreading thin across every platform at once." },

  {t:'pillar', num:"Pillar 4", h2:"Offer Portfolio",
    ladder:[["Intro","a low-risk first yes"],["Core","your signature engagement"],["Premium","the high-touch tier"],["Expansion","the next outcome"]],
    lead:"A deliberate ladder of offers creates more entry points and raises the lifetime value of every client you win." },

  {t:'pillar', num:"Pillar 5", h2:"Repeatable Closing System",
    lead:"Structured qualification, value-based pricing conversations, and templated proposals so you close premium engagements consistently, without reinventing the sale every single time." },

  {t:'part', num:"Part three", h2:"From one advisory offer to a business" },

  {t:'ladder',
    eyebrow:"The four C's",
    h2:"One advisory offer, grown into a business",
    ladder:[["Consulting","validate real demand, paid"],["Courses","package what clients keep asking for"],["Cohorts","deliver it to many at once"],["Community","compound the lifetime value"]],
    lead:"Start with paid consulting. When three clients ask for the same thing, that's your signal to package it. Validate before you scale." },

  {t:'cols',
    eyebrow:"The shift",
    h2:"From tasks to outcomes",
    cards:[["Task-based","Paid for hours and deliverables. Income capped by your calendar. You are the bottleneck."],
           ["Outcome-based","Paid for the result. Priced on value. Fewer clients, higher revenue, and room to breathe."]] },

  {t:'cred',
    eyebrow:"Why listen to me",
    h2:"I've built this, not just taught it",
    stats:[["$5M","bootstrapped a remote agency to this in annual revenue"],
           ["$50M+","in service revenue personally closed over 10+ years"],
           ["500+","founders and solopreneurs mentored"],
           ["O'Reilly","published author on building products customers want"]] },

  {t:'recap',
    eyebrow:"Recap",
    h2:"The Scalable Service Offer",
    bullets:["Lighthouse Clients","Blue Ocean Service","Optimize your channels","Offer Portfolio","Repeatable Closing System"] },

  {t:'cta',
    eyebrow:"Your next step",
    h2:"Let's install this in your business",
    step:"Book a call to map your Scalable Service Offer and the ladder around it.",
    disclaimer:"This masterclass is for educational purposes only. Every business is different, results vary, and nothing here is a promise or guarantee of income, revenue, or any specific outcome." }
];

const deck = document.getElementById('deck');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
S.forEach((s,i)=>{
  const el=document.createElement('section'); el.className='slide';
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.num) h+=`<div class="num">${esc(s.num)}</div>`;
  if(s.h1) h+=`<h1>${esc(s.h1)}</h1>`;
  if(s.h2) h+=`<h2>${esc(s.h2)}</h2>`;
  if(s.big) h+=`<div class="big">${esc(s.big)}</div>`;
  if(s.lead) h+=`<p class="lead">${esc(s.lead)}</p>`;
  if(s.bullets){h+='<ul>'+s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')+'</ul>';}
  if(s.ladder){h+='<div class="ladder">'+s.ladder.map(r=>`<div class="rung">${esc(r[0])}<span>${esc(r[1])}</span></div>`).join('')+'</div>';}
  if(s.cards){h+='<div class="cols">'+s.cards.map(c=>`<div class="card"><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p></div>`).join('')+'</div>';}
  if(s.stats){h+='<div class="cred">'+s.stats.map(c=>`<div class="stat"><b>${esc(c[0])}</b><small>${esc(c[1])}</small></div>`).join('')+'</div>';}
  if(s.step) h+=`<div class="cta-step">${esc(s.step)}</div>`;
  if(s.sub) h+=`<p class="sub">${esc(s.sub)}</p>`;
  if(s.disclaimer) h+=`<p class="disclaimer">${esc(s.disclaimer)}</p>`;
  h+=`<div class="foot">Ken Yarmosh &middot; ${i+1}/${S.length}</div>`;
  el.innerHTML=h; deck.appendChild(el);
});
</script>
</body>
</html>
