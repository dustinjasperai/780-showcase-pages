<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Peaceful Discipline Masterclass · Sarah Rosensweet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#edf1ec; --panel:#f8faf7; --rule:#d7e0d6;
    --accent:#6a9588; --accent-deep:#4f7265; --ink:#171515; --ink-soft:#44413f; --dim:#8d968c;
  }
  html,body{height:100%}
  body{background:#dde4db;font-family:'Raleway',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dde4db}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:2.4vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.9vw}
  .t-normal h1{font-size:3.35vw;max-width:85%}
  .t-normal .body{font-size:1.48vw;color:var(--ink-soft);margin-top:2.6vh;max-width:74%;line-height:1.56;font-weight:400}
  .sub{font-size:1.8vw;color:var(--ink-soft);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.35vw;font-weight:600;color:var(--accent-deep);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#5e8679 0%,#3c574c 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;font-style:italic;color:#f7f4ee;font-weight:400}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#5e8679 0%,#3c574c 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:84%;color:#f7f4ee}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid #cfe0d8;color:#eef5f1;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:#d6e3dc;font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#cdddd4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .hold-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-hold{right:7%;bottom:8%;width:23vw}
  .corner-hold{right:6%;bottom:7.5%;width:10vw;opacity:.5}
  .brandline{font-size:1.3vw;color:var(--ink-soft);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent-deep);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(23,21,21,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Peaceful Parenting</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- two gentle arcs meeting: limits and empathy held together (kind AND firm) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="hold" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.6" stroke-linecap="round">
    <path d="M26 118 C70 54, 190 54, 234 118" stroke="#6a9588" opacity="0.9"/>
    <path d="M52 124 C96 78, 164 78, 208 124" stroke="#171515" opacity="0.12"/>
    <circle cx="130" cy="70" r="6" fill="#6a9588" stroke="none" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Peaceful Discipline Masterclass',sub:'How to get your kids to cooperate without yelling, threats, bribes, or punishments.',brand:true,hold:'title'},
 {t:'normal',k:'Who this is for',title:'You have become the parent you swore you would never be.',body:'You start the day calm and promise yourself today will be different. Then the same battles start, your voice rises, and by bedtime you feel guilty and worn out. You love your kids. You just want them to listen.'},
 {t:'dark',title:'You do not have a bad kid. You have a discipline toolkit built on fear.'},

 {t:'section',idx:'Part One',title:'Why the old tools stop working'},
 {t:'normal',k:'The short-term trap',title:'Yelling, threats, and bribes buy you minutes, not change.',body:'Fear and rewards work for a moment because a child complies to avoid the storm or earn the prize. The behavior comes right back, because nothing underneath it actually changed.'},
 {t:'normal',k:'The hidden cost',title:'Punishment teaches kids to behave only when someone is watching.',body:'Consequences and sticker charts put you in charge of the outcome instead of building the child’s own judgment. Over time they also chip away at the one thing cooperation is built on: your connection.'},
 {t:'dark',title:'Kids cooperate when they feel connected, not when they feel controlled.'},

 {t:'section',idx:'Part Two',title:'Kind AND firm, held together'},
 {t:'normal',k:'Connection first',title:'A connected child is a cooperative child.',body:'Before a limit will hold, the relationship has to feel safe. When you fill your child’s connection cup first, you are no longer fighting them to get heard. You are working from the same side.'},
 {t:'normal',k:'Peaceful discipline',title:'Hold the limit with empathy, not anger.',body:'Kind and firm are not opposites. You can be completely warm and completely clear at the same time: the limit stays, and so does the understanding. That is the whole method, and it is neither permissive nor punitive.'},
 {t:'normal',k:'Big feelings',title:'The meltdown is the moment, not the enemy.',body:'When you have a simple, repeatable way to walk a child through a big feeling instead of punishing it or rushing to fix it, the storms get shorter and your child learns to handle hard emotions for life.'},
 {t:'dark',title:'Limits keep everyone safe. Empathy keeps the connection intact. You need both.'},

 {t:'section',idx:'Part Three',title:'What changes at home'},
 {t:'normal',k:'The calmer house',title:'Cooperation without the countdown, the threat, or the chart.',body:'Mornings and bedtimes stop being battles. Your kids start to listen because they want to, not because they are scared of what happens if they do not. And you get to be the calm, steady parent you always meant to be.'},
 {t:'normal',k:'The part most parents skip',title:'You cannot stay calm on an empty tank.',body:'Staying kind and firm in the hard moment takes noticing your own triggers, the ones you inherited from how you were raised. Doing that quiet work is what finally lets you respond instead of react.'},
 {t:'dark',title:'This is not about being a perfect parent. It is about repair, not perfection.'},

 {t:'section',idx:'Your next step',title:'Transform Your Family Life'},
 {t:'normal',k:'How I can help',title:'I have walked this road, as a parent and with thousands of families.',body:'I am Sarah Rosensweet, a peaceful parenting coach and mom of three. Transform Your Family Life is my step-by-step program: the course, weekly live coaching, and a community that teaches you exactly how to get cooperation without yelling, threats, bribes, or punishments.'},
 {t:'cta',title:'Ready to stop yelling and start connecting?',chips:['Start the free How to Stop Yelling course','Join Transform Your Family Life'],disc:'Educational content for parents. Every family and child is different, and no specific result is guaranteed. Results vary by family, child, and circumstance.'},
];

const deck=document.getElementById('deck');
function hold(kind){return `<svg class="hold-motif ${kind==='title'?'title-hold':'corner-hold'}"><use href="#hold"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Reimagine <b>Peaceful Parenting</b> · Sarah Rosensweet</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.hold) h+=hold(s.hold);
  else if(s.t==='title') h+=hold('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
