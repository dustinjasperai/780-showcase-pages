<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wounded Identity Running Your Business — a masterclass with Ashu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Mukta:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#1a1510;        /* warm obsidian — site_scheme dark, warmed toward brand gold */
    --panel:#241f17;
    --rule:#3a3020;
    --accent:#eeba2b;    /* brand gold, brand.json uses=10 */
    --cream:#ebe5d6;     /* brand warm cream */
    --cream-soft:#b8b09c;
  }
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--cream);
    font-family:'Mukta',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .slide{
    display:none; width:100%; height:100%;
    padding:7vh 9vw; flex-direction:column; justify-content:center;
    max-width:1100px; margin:0 auto;
  }
  .slide.on{ display:flex; animation:fade .5s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .kicker{ font-size:14px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:500; margin-bottom:22px; }
  .kicker::before{ content:""; display:inline-block; width:26px; height:2px; background:var(--accent); vertical-align:middle; margin-right:12px; }
  h1{ font-family:'Playfair Display',Georgia,serif; font-weight:600; font-size:clamp(30px,5.4vw,60px); line-height:1.08; color:#fff; letter-spacing:-.01em; }
  h2{ font-family:'Playfair Display',Georgia,serif; font-weight:600; font-size:clamp(26px,4.2vw,44px); line-height:1.14; color:#fff; margin-bottom:22px; }
  .lede{ font-size:clamp(18px,2.2vw,24px); color:var(--cream); max-width:40ch; line-height:1.5; }
  .promise{ margin-top:26px; font-size:clamp(17px,2vw,21px); color:var(--accent); font-family:'Playfair Display',serif; font-style:italic; }
  p.body{ font-size:clamp(16px,1.9vw,20px); color:var(--cream); line-height:1.6; max-width:46ch; margin-bottom:16px; }
  .byline{ margin-top:40px; font-size:15px; letter-spacing:.04em; color:var(--cream-soft); }
  .byline b{ color:var(--cream); font-weight:500; }
  ul{ list-style:none; margin-top:10px; }
  li{ font-size:clamp(16px,1.9vw,21px); color:var(--cream); line-height:1.5; padding-left:26px; position:relative; margin-bottom:16px; max-width:48ch; }
  li::before{ content:""; position:absolute; left:0; top:.6em; width:9px; height:9px; border-radius:50%; background:var(--accent); }
  .stage-row{ display:flex; gap:28px; margin-top:18px; flex-wrap:wrap; }
  .stage-card{ flex:1 1 240px; background:var(--panel); border:1px solid var(--rule); border-top:3px solid var(--accent); padding:26px 24px; }
  .stage-card .n{ font-family:'Playfair Display',serif; color:var(--accent); font-size:15px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:12px; }
  .stage-card h3{ font-family:'Playfair Display',serif; font-weight:600; font-size:23px; color:#fff; margin-bottom:10px; }
  .stage-card p{ font-size:16px; color:var(--cream-soft); line-height:1.5; }
  .split{ font-family:'Playfair Display',serif; font-size:clamp(20px,2.6vw,30px); line-height:1.4; color:var(--cream); max-width:34ch; }
  .split b{ color:var(--accent); font-style:italic; font-weight:600; }
  .cta-box{ margin-top:30px; padding:26px 28px; background:var(--panel); border:1px solid var(--rule); border-left:3px solid var(--accent); font-size:clamp(17px,2vw,22px); color:#fff; max-width:44ch; }
  .cta-box .step{ color:var(--accent); font-family:'Playfair Display',serif; font-style:italic; }
  .disclaimer{ margin-top:30px; font-size:12.5px; color:var(--cream-soft); max-width:62ch; line-height:1.5; letter-spacing:.01em; }
  #nav{ position:fixed; bottom:22px; right:28px; font-size:13px; color:var(--cream-soft); letter-spacing:.08em; z-index:10; }
  #nav b{ color:var(--accent); }
  .hint{ position:fixed; bottom:22px; left:28px; font-size:12px; color:var(--cream-soft); letter-spacing:.04em; z-index:10; }
  .progress{ position:fixed; top:0; left:0; height:3px; background:var(--accent); width:0; transition:width .3s ease; z-index:10; }
  @media (max-width:640px){ .slide{ padding:6vh 7vw; } .stage-row{ gap:16px; } }
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<div id="stage"></div>
<div class="hint">Use arrow keys to move</div>
<div id="nav"><b id="cur">1</b> / <span id="tot">1</span></div>
<script>
const S=[
 {t:'title', kicker:'A live masterclass with Ashu',
  h1:'The Wounded Identity Running Your Business',
  promise:'Why your next income level is an identity to install, not a strategy to learn.'},

 {t:'for', kicker:'Who this is for',
  h2:'You are already successful. It just does not feel like it.',
  body:['You are making the kind of money you could not imagine a few years ago.',
        'But you hit the goal and immediately move the goalpost. You check your bank account three times a day on consistent revenue. You overdeliver to prove you are worth the price.',
        'You built something real, and you still feel like you are performing instead of resting in it.']},

 {t:'hook', kicker:'The reframe',
  h2:'You did not build this from your highest self. You built it from your wounded one.',
  body:['No amount of outside success will feel like enough while a wounded inner child, inherited scarcity, and voices that were never yours are the ones making decisions.',
        'You have done the trauma work. You know better. And she is still running the show.']},

 {t:'part', kicker:'Part one', h1:'The core problem'},

 {t:'content', kicker:'The core problem',
  h2:'Your wounded identity is making business decisions right now',
  body:['Every unclaimed day, she undercharges for transformation that changes lives.',
        'She overdelivers to prove worth instead of claiming it. She moves the goalpost instead of celebrating the win.',
        'She builds success that feels empty instead of full.']},

 {t:'list', kicker:'Name her',
  h2:'She has a face',
  lead:'Before you can release an identity, you have to see her clearly:',
  items:['The perfectionist who will not post until it is flawless',
         'The good girl proving her worth so no one can judge her',
         'The scared little girl who keeps the prices small so she stays safe']},

 {t:'list', kicker:'The core problem',
  h2:'Where she shows up in the business',
  lead:'The wounded identity does not stay in your head. She sets:',
  items:['Your pricing, and what you believe you are allowed to charge',
         'Your content, and the watered-down version that keeps you "professional"',
         'Your sales, the over-giving, the discount, the flinch before the number']},

 {t:'split', kicker:'The gap nobody closes',
  splitHtml:'Most business coaches say <b>raise your prices and set boundaries.</b> Most energy healers say <b>clear your blocks and raise your vibe.</b> Neither one moves you, because you cannot think your way out of a pattern that lives in your nervous system, and you cannot meditate away a business built from scarcity.'},

 {t:'part', kicker:'Part two', h1:'Remembrance, Reclamation and Activation'},

 {t:'stages', kicker:'The method',
  h2:'The process I take every client through',
  stages:[
   {n:'One', h:'Remembrance', p:'You receive your real vision from your guides and your ancestors, and name the immediate next level, not someday, this month.'},
   {n:'Two', h:'Reclamation', p:'You name the exact identity running the business, map how she sabotages your pricing and sales, and physically release her.'},
   {n:'Three', h:'Activation', p:'You install the new identity with colour, feeling and embodiment, and leave with one action to take in the next 24 hours.'}]},

 {t:'content', kicker:'Remembrance',
  h2:'First you remember what you actually came for',
  body:['Clear the throat-chakra block that keeps you from claiming the desire out loud.',
        'See the four core blocks keeping you where you are, and the one next step that is yours to take now.',
        'Most women skip this and build toward a goal their wounded self chose. We start by letting the real vision come through.']},

 {t:'content', kicker:'Reclamation',
  h2:'Then you release the one who has been deciding',
  body:['You name her out loud: the perfectionist, the good girl, the overachiever.',
        'You see, line by line, how she is priced into your offers and written into your content.',
        'And you release her through the body, through breath, not through another affidavit of positive thoughts.']},

 {t:'content', kicker:'Activation',
  h2:'Then you install the one who is already abundant',
  body:['You install the new identity with a colour, a felt sense, an embodiment you can return to.',
        'From that place, the pricing decision, the content, and the sales conversation are made by a different woman.',
        'This is the part strategy alone can never give you: permission that is real because it lives in the body.']},

 {t:'split', kicker:'Why it works',
  splitHtml:'The energetic work gives you <b>permission.</b> The strategic work gives you <b>proof.</b> We do both in the same room, at the same time. That is embodiment, and it is the whole method.'},

 {t:'part', kicker:'Part three', h1:'What changes'},

 {t:'list', kicker:'What changes',
  h2:'From the women on the other side of it',
  lead:'What tends to shift once the wounded identity is integrated:',
  items:['The content you have procrastinated on for years finally goes out',
         'The price you were afraid to name becomes the price you hold',
         'The win you could not feel becomes a win you can actually rest inside']},

 {t:'content', kicker:'Why me',
  h2:'Why I can take you through this',
  body:['I hold a Master’s in Counselling and train as a practicing counsellor, alongside Human Design, somatic and ancestral work.',
        'Over five years I have taken 500+ women through this identity work.',
        'I am an initiator, not a teacher. You do not need more information. You need the woman who no longer needs the strategy because she operates from alignment.']},

 {t:'cta', kicker:'Your next step',
  h2:'If she is calling you, that is the old identity getting nervous',
  ctaHtml:'The fastest way in is the free two-day activation, <span class="step">Installing Abundance Codes in Your DNA.</span> When you are ready for the full identity work, you apply for the 1:1 Activation Container and we map the plan together.',
  disclaimer:'This masterclass is for education and personal development only. It is not therapy, medical, or financial advice, and it is not a guarantee of income or business results. Outcomes vary and depend on your own work and circumstances.'}
];

const stage=document.getElementById('stage');
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='slide'+(i===0?' on':''); d.dataset.i=i;
    let h='';
    if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
    if(s.h1) h+=`<h1>${s.h1}</h1>`;
    if(s.promise) h+=`<div class="promise">${s.promise}</div>`;
    if(s.h2) h+=`<h2>${s.h2}</h2>`;
    if(s.lead) h+=`<p class="body">${s.lead}</p>`;
    if(s.body) s.body.forEach(p=>h+=`<p class="body">${p}</p>`);
    if(s.items){ h+='<ul>'; s.items.forEach(it=>h+=`<li>${it}</li>`); h+='</ul>'; }
    if(s.splitHtml) h+=`<div class="split">${s.splitHtml}</div>`;
    if(s.stages){ h+='<div class="stage-row">'; s.stages.forEach(st=>h+=`<div class="stage-card"><div class="n">${st.n}</div><h3>${st.h}</h3><p>${st.p}</p></div>`); h+='</div>'; }
    if(s.ctaHtml) h+=`<div class="cta-box">${s.ctaHtml}</div>`;
    if(s.byline) h+=`<div class="byline">${s.byline}</div>`;
    if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`;
    d.innerHTML=h; stage.appendChild(d);
  });
  document.getElementById('tot').textContent=S.length;
}
render();
let cur=0;
function show(n){
  cur=Math.max(0,Math.min(S.length-1,n));
  document.querySelectorAll('.slide').forEach(el=>el.classList.remove('on'));
  const el=document.querySelector('.slide[data-i="'+cur+'"]'); if(el) el.classList.add('on');
  document.getElementById('cur').textContent=cur+1;
  document.getElementById('prog').style.width=((cur+1)/S.length*100)+'%';
}
show(0);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') show(cur-1);
});
document.addEventListener('click',e=>{ if(e.clientX < window.innerWidth*0.25) show(cur-1); else show(cur+1); });
</script>
</body>
</html>
