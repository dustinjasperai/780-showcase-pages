<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Build a Cast-Iron Business Case for Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe9f9; --panel:#fbfaff; --ink:#001c34; --slate:#5e6272;
    --rule:#dfe4ea; --accent:#713edb; --teal:#69bca5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Roboto",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(0,28,52,.04)}
  .num{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:22px}
  .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-family:"Lora",Georgia,serif;font-weight:600;font-size:46px;line-height:1.1;letter-spacing:-.01em}
  h2{font-family:"Lora",Georgia,serif;font-weight:600;font-size:34px;line-height:1.15;letter-spacing:-.005em}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);margin-top:22px;max-width:40ch}
  .sub{font-size:18px;line-height:1.55;color:var(--slate);margin-top:18px;max-width:52ch}
  .part{font-family:"Lora",Georgia,serif;font-style:italic;font-weight:500;font-size:40px;color:var(--accent)}
  .part small{display:block;font-style:normal;font-family:"Roboto";font-size:14px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--slate);margin-bottom:14px;font-weight:700}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px}
  ul.cols{grid-template-columns:1fr 1fr}
  li{position:relative;padding:18px 20px 18px 22px;background:var(--bg);border:1px solid var(--rule);
    border-left:4px solid var(--teal);border-radius:8px;font-size:17px;line-height:1.4}
  li .k{display:block;font-weight:700;color:var(--ink);margin-bottom:4px}
  li .d{color:var(--slate);font-size:15px}
  .big{font-family:"Lora",Georgia,serif;font-weight:600;font-size:40px;line-height:1.18;max-width:20ch}
  .quietline{font-size:16px;color:var(--slate);margin-top:28px}
  .title h1{font-size:54px}
  .title .by{margin-top:30px;font-size:16px;color:var(--slate);letter-spacing:.04em}
  .title .by b{color:var(--ink)}
  .cta{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cta h2{color:#fff}
  .cta .sub{color:#c7d0da}
  .cta .btn{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;
    font-weight:700;font-size:17px;padding:16px 30px;border-radius:9px;letter-spacing:.01em}
  .disclaimer{margin-top:34px;font-size:12px;line-height:1.5;color:#7d8794;max-width:60ch}
  .cta .disclaimer{color:#8795a3}
  .rule{height:3px;width:56px;background:var(--accent);border-radius:2px;margin-top:4px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'Free live masterclass', h1:'How to Build a Cast-Iron Business Case for Partner',
   lead:'The step that gets a senior associate seen as partner material, and still leaves you a life outside work.',
   by:'with <b>Heather Townsend</b>, How to Make Partner'},

  {t:'std', eyebrow:'Who this is for', h2:'You are two steps from partner, and the step keeps moving.',
   sub:'A senior lawyer, accountant or consultant. You bill well. You are trusted with the hard work. And every year the partnership conversation ends the same way: not yet, no one quite able to tell you why.'},

  {t:'big', eyebrow:'The trap', big:'You are brilliant at the work. That is exactly why you are stuck.',
   quiet:'The thing that made you indispensable as a fee earner is now the thing keeping you out of the partnership.'},

  {t:'big', eyebrow:'The reframe', big:'Partners are not promoted for their chargeable hours. They are chosen for the future they can prove.',
   quiet:'What your partners are really looking for has very little to do with your time figures.'},

  {t:'part', kicker:'Part One', part:'Why talented people get stuck'},

  {t:'std', h2:'You have been rewarded for being a safe pair of hands.',
   sub:'Your whole career you were praised for being reliable, for catching the detail, for never dropping the ball. So you did more of it. And you became the person the firm cannot afford to promote, because who would do your work?'},

  {t:'std', h2:'To make partner you have to be seen as one to watch.',
   sub:'That is a different job from being excellent at the work, and nobody sits you down and teaches it. It is built on evidence, not hope, and the evidence has a name: your business case.'},

  {t:'part', kicker:'Part Two', part:'The Cast-Iron Business Case'},

  {t:'std', h2:'Every partner is made on a business case. Most people write a weak one, or wait to be asked.',
   sub:'By the time you are invited to put yourself forward, the real decision has usually already been made in the room you were not in. A cast-iron case is how you get into that room early.'},

  {t:'list', eyebrow:'The structure', h2:'The 4 sections every business case needs',
   items:[
     {k:'1. The case for you', d:'Why you, and why now, in the language partners actually use.'},
     {k:'2. Your business development plan', d:'Where the work will come from, and your part in winning it.'},
     {k:'3. The numbers that matter', d:'The figures that prove it, beyond your chargeable time.'},
     {k:'4. Your first 100 days', d:'What you do once you are through the door, so the yes feels safe.'}
   ]},

  {t:'std', h2:'There are 7 different types of business case.',
   sub:'The one you need depends on your firm, your practice area and your route to partner. Building the wrong type, however well, is one of the most common reasons strong candidates get a no.'},

  {t:'list', eyebrow:'Avoid these', h2:'The mistakes that sink strong candidates',
   items:[
     {k:'Leading with billable hours', d:'It is the one thing partners discount.'},
     {k:'No evidence you can win work', d:'Trusted to do it is not trusted to bring it in.'},
     {k:'Waiting to be invited', d:'The quiet candidate is the forgotten candidate.'},
     {k:'A plan with no numbers', d:'Ambition without arithmetic reads as a wish.'}
   ]},

  {t:'list', eyebrow:'What they actually want', h2:'What partners are really looking for',
   items:[
     {k:'Can you win work', d:'A visible, credible ability to bring clients in.'},
     {k:'Will clients follow you', d:'Relationships that belong to you, not only the firm.'},
     {k:'Can you lead', d:'People who will do their best work for you.'},
     {k:'Do you think like an owner', d:'Decisions made as if the firm were yours.'}
   ]},

  {t:'part', kicker:'Part Three', part:'Promoted on purpose, not by luck'},

  {t:'big', eyebrow:'Twelve months from now', big:'You are not hoping to be noticed. Your sponsoring partner is already making your case for you.',
   quiet:'Because you handed them a case they could not argue with.'},

  {t:'big', eyebrow:'The promise', big:'Make partner. And still have a life.',
   quiet:'You do not have to choose between the promotion and everything else that matters.'},

  {t:'std', eyebrow:'Why listen to me', h2:'I have spent over 20 years on this one question.',
   sub:'I have helped thousands of lawyers, accountants and consultants make the step up to partner, and written six books on how it is really done, including How to Make Partner and Still Have a Life. One belief runs through all of it: you can get there without burning out.'},

  {t:'cta', eyebrow:'Your next step', h2:'Build your cast-iron business case with me.',
   sub:'Join the Progress to Partner Academy and turn everything in this masterclass into the case that gets you promoted, with the courses, templates and coaching to back it up.',
   btn:'Join Progress to Partner',
   disclaimer:'This masterclass is educational. It shares frameworks and experience from working with professionals pursuing partnership. It is not a guarantee of promotion or any particular outcome. Partnership decisions rest with your firm, and individual results vary.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'') + (s.t==='title'?' title':'');
  const n = String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  let h = '<div class="num">'+n+'</div>';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){
    h += '<h1>'+s.h1+'</h1><div class="rule"></div><div class="lead">'+s.lead+'</div><div class="by">'+s.by+'</div>';
  } else if(s.t==='part'){
    h += '<div class="part"><small>'+s.kicker+'</small>'+s.part+'</div>';
  } else if(s.t==='big'){
    h += '<div class="big">'+s.big+'</div>'+(s.quiet?'<div class="quietline">'+s.quiet+'</div>':'');
  } else if(s.t==='list'){
    h += '<h2>'+s.h2+'</h2><ul class="cols">';
    s.items.forEach(it=>{ h += '<li><span class="k">'+it.k+'</span><span class="d">'+it.d+'</span></li>'; });
    h += '</ul>';
  } else if(s.t==='cta'){
    h += '<h2>'+s.h2+'</h2><div class="sub">'+s.sub+'</div><span class="btn">'+s.btn+'</span><div class="disclaimer">'+s.disclaimer+'</div>';
  } else {
    h += '<h2>'+s.h2+'</h2>'+(s.sub?'<div class="sub">'+s.sub+'</div>':'');
  }
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
