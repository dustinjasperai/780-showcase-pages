<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Five-Step Offer — The Salary Negotiator</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#f4f8fe; --rule:#dbe6f5;
    --ink:#0b1f3a; --muted:#4a5a72; --accent:#156fe5; --deep:#091c35;
    --head:'Sora',sans-serif; --body:'Figtree',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--deep);font-family:var(--body);color:var(--ink);padding:32px 16px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 14px 40px rgba(9,28,53,.18)}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.06;color:var(--deep);
    letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.1;color:var(--deep)}
  .lead{font-size:20px;line-height:1.5;color:var(--muted);margin-top:18px;max-width:46ch}
  .promise{font-size:22px;line-height:1.45;color:var(--ink);margin-top:20px;max-width:48ch}
  .uline{display:inline-block;height:5px;width:88px;background:var(--accent);border-radius:3px;margin-top:26px}
  .big{font-family:var(--head);font-weight:800;font-size:72px;color:var(--accent);line-height:1}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:14px}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.45;color:var(--ink)}
  li:before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .stepno{font-family:var(--head);font-weight:800;font-size:15px;color:#fff;background:var(--accent);
    width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:26px 28px;margin-top:22px}
  .muted{color:var(--muted)}
  .foot{font-family:var(--head);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    font-size:11px;color:var(--muted);margin-top:30px}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:60ch}
  .cta-btn{display:inline-block;margin-top:22px;font-family:var(--head);font-weight:700;font-size:17px;
    color:#fff;background:var(--accent);padding:14px 26px;border-radius:10px}
  .ghost{color:var(--rule);text-decoration:line-through}
  .snum{font-family:var(--head);font-size:12px;color:var(--muted);text-align:right;margin-top:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'The Salary Negotiator',h:'The Five-Step Offer',
   promise:'How to negotiate $10,000 to $20,000 more on your next job offer without risking the relationship.',
   foot:'A live masterclass with Brandon Bramley'},
  {t:'audience',kicker:'Who this is for',h:'You have an offer. Or you are about to.',
   lead:'Salaried professionals earning $130k and up, from individual contributors to the C-suite. If you are weighing a live or upcoming offer, this is built for you.'},
  {t:'trap',kicker:'The trap',h:'You were great in the interviews.',
   lead:'Then the offer lands, and you freeze. The one conversation that pays the most is the one almost nobody prepares for.'},
  {t:'reframe',kicker:'The hard truth',h:'You do not lack leverage. You lack a plan.',
   lead:'Most professionals do not lose the negotiation. They skip it, or they wing it at the exact moment it matters most.'},
  {t:'cost',kicker:'What it costs',big:'$5k to $20k+',
   lead:'The range commonly left on the table when an offer is accepted without a strategy. Over a career, that first number compounds into every raise after it.'},
  {t:'part',kicker:'Part one',h:'Why negotiation feels impossible',
   lead:'It feels adversarial, so people avoid it. The fix is not more confidence. It is treating the offer as a process, not a personality test.'},
  {t:'reframe2',kicker:'The shift',h:'Negotiation is a process, not a trait.',
   lead:'You do not have to become a different person. You have to run the same five steps, in order, every time.'},
  {t:'part',kicker:'Part two',h:'The Five-Step Process',
   lead:'The exact sequence I run with clients on real offers, with real timelines.'},
  {t:'step',n:'1',h:'Offer Review',
   lead:'We complete a full review of your job offer and benefits package, so every lever is on the table, not just base salary.'},
  {t:'step',n:'2',h:'Strategic Questioning',
   lead:'We develop strategic questions for the hiring team to create leverage. This is the step most people miss. Leverage is made through the right questions, not only a competing offer.'},
  {t:'step',n:'3',h:'Market Research',
   lead:'We research compensation to identify the correct pay range, so your ask is anchored in defensible data instead of a gut number.'},
  {t:'step',n:'4',h:'Counteroffer Development',
   lead:'We build the counteroffer strategy to fit the negotiation: the number, the framing, and the timing for your specific role and company.'},
  {t:'step',n:'5',h:'Handling Objections',
   lead:'We coach you to handle any pushback from the hiring team, with the words ready for the live moment the offer is defended.'},
  {t:'through',kicker:'The through-line',h:'Confidential, and done with you.',
   lead:'This is hands-on support through every counteroffer, not a single consultation. And it stays private. The company never knows you are working with a salary negotiator.'},
  {t:'part',kicker:'Part three',h:'From first number to final number',
   lead:'A real offer moves from the number you were handed to the number you chose in a handful of days. Here is the shape of it.'},
  {t:'timeline',kicker:'The 48-hour window',h:'The days right after the offer',
   items:['Day 0: offer lands, you buy time with the right questions','Day 1: comps and counter are built','Day 2 to 3: counter goes out, objections are handled','Close: a number you chose, not the one you were handed']},
  {t:'cred',kicker:'Why me',h:'I have sat on the other side of the table.',
   lead:'I founded The Salary Negotiator in 2018 after more than a decade in strategic negotiations at companies like Amazon and American Airlines, where I saw exactly how compensation decisions get made inside a company.'},
  {t:'outcome',kicker:'The point',h:'A plan beats a pep talk.',
   lead:'In my experience I have never seen these techniques cost someone a job opportunity. You walk in with a strategy, strong positioning, and the confidence to secure competitive pay.'},
  {t:'cta',kicker:'Your next step',h:'Negotiate your next offer with a plan.',
   lead:'If you want the five-step process run with you on your live offer, here is where to start.',
   btn:'Work with The Salary Negotiator',
   disc:'Educational content only. Outcomes depend on your offer, market, and circumstances. Results vary and are not guaranteed; nothing here promises a specific salary increase or outcome.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let html='';
  if(s.kicker) html+=`<div class="kicker">${s.kicker}</div>`;
  if(s.big) html+=`<div class="big">${s.big}</div>`;
  if(s.h && s.t==='title') html+=`<h1>${s.h}</h1>`;
  else if(s.h) html+=`<h2>${s.h}</h2>`;
  if(s.t==='step') html=`<div class="stepno">${s.n}</div>`+html;
  if(s.promise) html+=`<div class="promise">${s.promise}</div><span class="uline"></span>`;
  if(s.lead) html+=`<div class="lead">${s.lead}</div>`;
  if(s.items){html+='<ul>';s.items.forEach(x=>html+=`<li>${x}</li>`);html+='</ul>';}
  if(s.btn) html+=`<div><span class="cta-btn">${s.btn}</span></div>`;
  if(s.disc) html+=`<div class="disc">${s.disc}</div>`;
  if(s.foot) html+=`<div class="foot">${s.foot}</div>`;
  html+=`<div class="snum">${i+1} / ${S.length}</div>`;
  d.innerHTML=html;deck.appendChild(d);
});
</script>
</body>
</html>
