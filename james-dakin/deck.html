<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turning the Tables - A Live Masterclass with James Dakin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf2e9;        /* pale green-tinted paper, derived from brand green #1b4d22 */
    --panel:#dde7d7;     /* soft green panel */
    --rule:#c4d3bc;      /* green hairline rule */
    --accent:#1b4d22;    /* his dominant brand green (extract_brand.js) */
    --ink:#1f2a22;       /* deep green-ink text */
    --muted:#5c6b60;     /* muted label */
    --serif:'EB Garamond',Georgia,serif;
    --sans:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:64px 60px;
    margin:0 0 28px;
    min-height:560px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  /* the turning-table motif: a quarter-turn mark, never stock imagery */
  .slide::after{
    content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;
    border:2px solid var(--rule);border-radius:50% 50% 50% 0;transform:rotate(12deg);opacity:.5;
  }
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:600;font-size:60px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1.1;margin-bottom:20px}
  .lede{font-family:var(--serif);font-size:26px;line-height:1.45;color:var(--ink);max-width:42ch}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);max-width:56ch;margin-top:14px}
  .big{font-family:var(--serif);font-size:40px;line-height:1.2;max-width:24ch}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;padding:14px 0 14px 40px;border-bottom:1px solid var(--rule);position:relative;max-width:60ch}
  li:last-child{border-bottom:none}
  li .n{position:absolute;left:0;top:14px;font-family:var(--serif);font-weight:600;color:var(--accent);font-size:20px}
  .steps li{border:1px solid var(--rule);border-radius:10px;margin-bottom:12px;padding:16px 18px 16px 54px;background:var(--panel)}
  .steps li .n{left:18px;top:16px}
  .kicker{font-family:var(--sans);font-weight:600;color:var(--accent);font-size:15px;letter-spacing:.04em;margin-top:10px}
  .flow{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .flow span{font-family:var(--sans);font-weight:600;font-size:15px;background:var(--panel);border:1px solid var(--rule);
    border-radius:999px;padding:10px 16px;color:var(--ink)}
  .flow span.arrow{border:none;background:none;color:var(--accent);padding:10px 2px}
  blockquote{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1.4;max-width:34ch}
  .attrib{font-family:var(--sans);font-size:15px;color:var(--muted);margin-top:18px;font-style:normal}
  .cta h2{font-size:48px}
  .disclaimer{margin-top:28px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .pg{position:absolute;top:22px;right:28px;font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.08em}
  .brand{position:absolute;top:22px;left:28px;font-family:var(--serif);font-weight:600;font-size:15px;color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with James Dakin',
    title:'Turning the Tables',
    lede:'How a woman who has spent a lifetime managing everyone else’s needs stops settling and starts choosing herself.' },

  {t:'point', eyebrow:'Who this is for',
    h:'You are the one everyone leans on.',
    body:'You hold it together at work and at home. You read the room before you speak. You have become so good at managing everyone else that you have lost sight of what you actually want. If that is you, you are in the right room.' },

  {t:'point', eyebrow:'The trap',
    h:'Adapting feels like strength. It is quietly costing you.',
    body:'Every time you shrink to keep the peace, over-give to feel safe, or wait for someone else to change, the pattern gets a little deeper. Confidence does not come first. Clarity does. And clarity starts with seeing the pattern for what it is.' },

  {t:'big', eyebrow:'The reframe',
    big:'The problem was never that you are too much. It is that you were taught to make yourself smaller.' },

  {t:'point', eyebrow:'Part one - the real problem',
    h:'Old conditioning, running on autopilot.',
    body:'Most of what keeps a capable woman stuck is not a lack of ability. It is inherited expectation and years of adapting that now run without you noticing. Naming it is the first act of power, and it is where everything turns.' },

  {t:'flow', eyebrow:'Part two - the method',
    h:'The Turning the Tables framework',
    steps:['Awareness','Clarity','Choice','Action','Transformation'],
    kicker:'Clarity before confidence. Accountability without shame.' },

  {t:'steps', eyebrow:'Part two - the journey',
    h:'Six shifts, in order',
    items:[
      'Spot the Patterns - name the adapting and over-giving you run on autopilot.',
      'Reclaim Your Power - separate what is yours from what was handed to you.',
      'From Invisible to Irresistible - your voice, your presence, on your terms.',
      'Thrive at Work - lead and be seen without shrinking or over-proving.',
      'Create a Life You Love - choose by what you want, not by what keeps the peace.',
      'Support That Gets You There - the structure that makes the change last.'
    ] },

  {t:'point', eyebrow:'Shift one',
    h:'Spot the patterns.',
    body:'Before you can change anything, you have to see it. We map the specific moments you shrink, over-give, or wait, and we name the belief underneath each one. You cannot interrupt a pattern you have not yet made conscious.' },

  {t:'point', eyebrow:'Shift two',
    h:'Reclaim your power.',
    body:'So much of what you carry was never yours to begin with. We separate your own standards from the expectations you absorbed, so the choices you make next come from you and not from old conditioning.' },

  {t:'point', eyebrow:'Shift three',
    h:'From invisible to irresistible.',
    body:'This is the work on voice and presence. How you ask, how you hold a boundary, how you take up the room that is already yours. Not louder. Clearer. Impossible to quietly diminish.' },

  {t:'point', eyebrow:'Shifts four and five',
    h:'Thrive at work. Create a life you love.',
    body:'The same clarity that changes your relationships changes how you lead and how you choose. You stop over-proving for permission and start building a life measured by what you actually want.' },

  {t:'point', eyebrow:'Shift six',
    h:'Support that gets you there.',
    body:'Insight fades without structure. The final shift is the scaffolding, the people and the practice, that turns a good week into a durable change you do not slide back from.' },

  {t:'quote', eyebrow:'What changes',
    quote:'James has the ability to help people believe in themselves far more than they ever did.',
    attrib:'Denise F, Change Director, UK' },

  {t:'point', eyebrow:'Why me',
    h:'I learned this from the inside.',
    body:'I spent thirty-five years working with people and organisations in more than twenty countries. I also grew up watching charm used to hide insecurity, and I became that for a while myself. I know exactly how it works, which is why I can help you become impossible for it to diminish.' },

  {t:'big', eyebrow:'The promise',
    big:'Depth over performance. Truth over comfort. That is how the table turns.' },

  {t:'cta', eyebrow:'Your next step',
    h:'Start with a conversation.',
    body:'If this is the chapter you are ready for, the next move is simple. We talk, we look at where you are stuck, and we map what choosing yourself would actually look like.',
    note:'This masterclass is educational. It shares a method and a way of thinking; it is not a guarantee of any particular result, and outcomes vary from person to person.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide' + (s.t==='cta'?' cta':'');
  let inner = '<div class="brand">James Dakin</div><div class="pg">'+(i+1)+' / '+S.length+'</div>';
  if(s.eyebrow) inner += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){ inner += '<h1>'+s.title+'</h1><p class="lede" style="margin-top:22px">'+s.lede+'</p>'; }
  else if(s.t==='big'){ inner += '<div class="big">'+s.big+'</div>'; }
  else if(s.t==='quote'){ inner += '<blockquote>“'+s.quote+'”</blockquote><div class="attrib">'+s.attrib+'</div>'; }
  else if(s.t==='flow'){
    inner += '<h2>'+s.h+'</h2><div class="flow">';
    s.steps.forEach((st,j)=>{ inner += '<span>'+st+'</span>'; if(j<s.steps.length-1) inner += '<span class="arrow">→</span>'; });
    inner += '</div><div class="kicker">'+s.kicker+'</div>';
  }
  else if(s.t==='steps'){
    inner += '<h2>'+s.h+'</h2><ul class="steps">';
    s.items.forEach((it,j)=>{ inner += '<li><span class="n">'+(j+1)+'</span>'+it+'</li>'; });
    inner += '</ul>';
  }
  else { inner += '<h2>'+s.h+'</h2>'; if(s.body) inner += '<p class="body">'+s.body+'</p>'; }
  if(s.note) inner += '<div class="disclaimer">'+s.note+'</div>';
  d.innerHTML = inner;
  deck.appendChild(d);
});
</script>
</body>
</html>
