<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rest &amp; Recovery Reset — Scott Shortmeyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161616; --panel:#1e1e1e; --ink:#f7f7f7; --muted:#b9bdbb;
    --accent:#01b38b; --rule:#2a2a2a;
    --head:'League Spartan',sans-serif; --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 52px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .k{font-family:var(--head);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:900;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.1}
  .sub{font-size:20px;color:var(--muted);margin-top:16px;max-width:60ch}
  .body p{font-size:19px;color:var(--ink);margin-top:14px;max-width:62ch}
  ul{list-style:none;margin-top:22px}
  ul li{font-size:19px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  ul li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;
    border-radius:3px;background:var(--accent)}
  .foot{margin-top:28px;font-family:var(--head);font-weight:600;color:var(--muted);font-size:15px;letter-spacing:.04em}
  .title-slide{text-align:left}
  .title-slide h1{font-size:64px}
  .section-slide{min-height:300px}
  .section-slide h2{font-size:44px}
  .disc{margin-top:26px;font-size:13px;color:#8a8f8d;max-width:66ch;line-height:1.5}
  .num{position:absolute;right:26px;bottom:18px;font-family:var(--head);font-size:12px;color:#5a5e5c;letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', k:'A Live Masterclass', h:'The Rest &amp; Recovery Reset', sub:'Why high performers burn out, and the recovery-first path back.', foot:'With Scott Shortmeyer · Causeway Health'},
 {t:'who', h:'Who this is for', body:['You train, you work, you parent, and you push.','You have tried more sleep, more discipline, and more supplements.','And you are still running on empty.']},
 {t:'trap', h:'The trap', body:['High performers optimize everything except the one system that lets the rest work.','You cannot out-train, out-eat, or out-will poor recovery.']},
 {t:'hook', h:'Burnout is not a mindset problem', sub:'It is an autonomic one.', body:['Your nervous system is stuck in go. Rest is the skill nobody taught you.']},
 {t:'section', k:'Part One', h:'Why more sleep stopped working'},
 {t:'content', h:'Hours in bed is not recovery', body:['You can spend eight hours in bed and barely recover.','Sleep architecture and autonomic balance decide how much of that time actually repairs you.']},
 {t:'content', h:'The depletion spiral', items:['Chronic stress keeps the nervous system switched on','Poor recovery blunts sleep quality','Low energy gets masked with more training or caffeine','The spiral quietly deepens for years']},
 {t:'section', k:'Part Two', h:'The Health Roadmap: a recovery-first method'},
 {t:'framework', h:'Four pillars, recovery first', items:['Sleep architecture, not just hours in bed','Autonomic recovery: training the nervous system to adapt','Nutrition dosed for repair','Fitness matched to your recovery capacity']},
 {t:'content', h:'Pillar 1: Sleep architecture', body:['Improve the stages of sleep that actually restore you, using simple wearable data instead of guesswork.']},
 {t:'content', h:'Pillar 2: Autonomic recovery', body:['This is the core of my autonomic rehabilitation work: teaching your nervous system to adapt to stress instead of storing it.']},
 {t:'content', h:'Pillar 3: Repair nutrition', body:['Food timed and chosen to support recovery and hormones, not another restrictive diet you cannot keep.']},
 {t:'content', h:'Pillar 4: Recovery-matched fitness', body:['Dose training to what your body can recover from this week, so effort compounds instead of breaking you down.']},
 {t:'section', k:'Part Three', h:'Recovered, not just rested'},
 {t:'content', h:'From depleted to durable', body:['Energy that holds through the day.','Sleep that genuinely restores.','Training that builds you up instead of grinding you down.']},
 {t:'why', h:'Why me', body:['Functional health practitioner, certified nutritionist and coach, endurance athlete, and a father of three.','I built this after my own burnout, then refined it into the Health Roadmap my clients use at Causeway Health.']},
 {t:'recap', h:'The reset, in one line', body:['Stop optimizing the wrong lever. Recover first, and everything else finally starts to work.']},
 {t:'cta', h:'Your next step', body:['If you want your own Health Roadmap, book a discovery call with Causeway Health and we will map your recovery-first plan together.'], disc:'Educational content only. This is not medical advice and does not replace care from your physician. Nothing here is a promise of a specific outcome. Results vary and are not guaranteed.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  let cls='slide';
  if(s.t==='title')cls+=' title-slide';
  if(s.t==='section')cls+=' section-slide';
  el.className=cls;
  let html='';
  if(s.k)html+='<div class="k">'+s.k+'</div>';
  if(s.t==='title'||s.t==='section'){
    html+= s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>';
  } else {
    html+='<h2>'+s.h+'</h2>';
  }
  if(s.sub)html+='<div class="sub">'+s.sub+'</div>';
  if(s.body){html+='<div class="body">';s.body.forEach(p=>html+='<p>'+p+'</p>');html+='</div>';}
  if(s.items){html+='<ul>';s.items.forEach(it=>html+='<li>'+it+'</li>');html+='</ul>';}
  if(s.foot)html+='<div class="foot">'+s.foot+'</div>';
  if(s.disc)html+='<div class="disc">'+s.disc+'</div>';
  html+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
