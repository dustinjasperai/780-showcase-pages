<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Investor Agent — Live Masterclass with Gary Wilson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f9fb;      /* light ground, brand site_scheme=light */
    --panel:#eef3f7;   /* light panel */
    --rule:#d6e2ec;
    --ink:#1a2b3a;     /* deep slate ink */
    --muted:#55697a;
    --accent:#036da7;  /* brand.json deep blue */
    --accent2:#2ea3f2; /* brand.json bright blue */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#223040;font-family:'Open Sans',sans-serif;color:var(--ink)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 22px;min-height:470px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 30px rgba(20,40,60,.18);
  }
  .eyebrow{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:46px;line-height:1.08;
    color:var(--ink);margin-bottom:18px}
  h2{font-family:'Montserrat',sans-serif;font-weight:800;font-size:33px;line-height:1.14;
    color:var(--ink);margin-bottom:16px}
  h3{font-family:'Montserrat',sans-serif;font-weight:700;font-size:21px;color:var(--accent);margin:18px 0 6px}
  p{font-size:19px;line-height:1.55;color:var(--muted);margin-bottom:12px;max-width:40em}
  .lede{font-size:22px;color:var(--ink)}
  .big{font-size:40px;font-family:'Montserrat',sans-serif;font-weight:800;color:var(--accent);line-height:1.1}
  ul{margin:10px 0 4px 2px;list-style:none}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:9px 0 9px 30px;position:relative;max-width:40em}
  li:before{content:"";position:absolute;left:0;top:17px;width:11px;height:11px;border-radius:3px;background:var(--accent2)}
  .tag{display:inline-block;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);
    padding:5px 12px;border-radius:20px;margin-bottom:22px;align-self:flex-start}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
  .box{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px 24px}
  .box h3{margin-top:0}
  .box p{font-size:17px;margin-bottom:0}
  .foot{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--muted);font-size:14px;margin-top:26px;letter-spacing:.04em}
  .cta h1{color:var(--accent)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;max-width:46em;line-height:1.5}
  .title-slide{background:linear-gradient(140deg,#f7f9fb 0%,#e7f1f8 100%)}
  .num{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;color:var(--accent2);margin-bottom:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A free live masterclass with Gary Wilson',h1:'The Investor Agent',lede:'How to earn repeat commissions serving investor clients instead of chasing one-time buyers.',foot:'Make more money, not more work.'},

  {t:'std',tag:'Who this is for',h2:'You are a licensed agent who is tired of starting from zero every month.',ul:['You already know how to run a transaction.','You are done living deal to deal, chasing the next listing.','You want clients who come back, not leads you re-earn every weekend.']},

  {t:'std',tag:'The trap',h2:'The retail treadmill.',p:['Most agents build their whole business on one-time buyers and sellers. Every closing resets the counter to zero. You market, you chase, you convert, you celebrate, and then you start all over the following Monday.','The harder you work, the more the treadmill speeds up.']},

  {t:'reframe',num:'THE REFRAME',h2:'Your license is an income-producing asset. Most agents use it like a commission lottery ticket.',p:['The same license that closes one retail family can serve an investor who transacts again and again. Same skills. Completely different economics.']},

  {t:'std',tag:'Part one',h2:'The core problem: you are paid once per relationship.',p:['A retail client buys a home and disappears for seven to ten years. You spent real money and real time to earn a single commission.','An investor client is in the market on purpose, over and over. That is the difference between a job and an asset.']},

  {t:'two',tag:'The cost of one-time clients',h2:'What the treadmill actually costs.',boxes:[
    {h3:'Retail agent',p:'New lead for every deal. Marketing spend resets each month. Income swings with the season.'},
    {h3:'Investor agent',p:'A small roster of repeat clients. Each relationship transacts many times. Income compounds.'}]},

  {t:'std',tag:'Part two',h2:'The Investor Agent model.',p:['Instead of farming for one-time buyers, you build a book of investor clients and become the agent they run every deal through.','One relationship. Many transactions. Multiple commissions. This is the whole model, and it rests on three pillars.']},

  {t:'std',tag:'Pillar one',h2:'Know who the right investor client is.',p:['Not every investor is worth your time. The model starts by defining the investor who has capital, strong credit, and a reason to keep buying, so your effort lands on relationships that actually repeat.']},

  {t:'std',tag:'Pillar two',h2:'Attract them on purpose, in the right towns.',p:['Most agents farm the neighborhood they live in. Investor commissions live where investors actually transact.','You target the right towns and neighborhoods, and you put a system in front of quality investors instead of hoping they find you.']},

  {t:'bigstat',tag:'Pillar three',h2:'One client. Multiple commissions.',big:'Buys. Sells. Refers. Repeats.',p:['A single investor relationship can pay you on the purchase, the eventual sale, the next purchase, and every referral in between. You stop re-earning clients and start stacking commissions on the ones you already have.']},

  {t:'std',tag:'The positioning',h2:'Scarcity is a strategy, not an accident.',p:['Early on, Gary took only two students per class. Limiting availability created demand and let him command premium commissions.','The Investor Agent does not compete on being the cheapest or the busiest. They compete on being the one investors want.']},

  {t:'std',tag:'Part three',h2:'What a week actually looks like.',ul:['Fewer clients, deeper relationships.','Conversations about the next deal, not the next lead.','A pipeline that repeats instead of resetting.','Weekends that belong to you again.']},

  {t:'bigstat',tag:'Proof it holds',h2:'Built to survive the worst market in 80 years.',big:'110 clients. No team.',p:['In 2008, while agents built on retail buyers watched their business disappear, Gary single-handedly serviced 110 clients. Investor clients keep transacting when retail freezes. The model is counter-cyclical by design.']},

  {t:'std',tag:'Why Gary',h2:'Taught by someone who lived it.',p:['Gary Wilson retired at 40 as a corporate vice-president in banking mergers and acquisitions, then built a real estate enterprise spanning brokerage, rental management, investment, settlement, and appraisal.','Eight books. Over 100 media features. Thirty years of doing exactly what this masterclass teaches.']},

  {t:'std',tag:'The system',h2:'The Investor-Agent Best Practices System.',p:['Everything above is drawn from the IABPS, a ten-module system that turns the model into a repeatable business: finding the right investor, targeting the right towns, running the analysis, and stacking the commissions.'],foot:'The masterclass is the first look. The system is the full build.'},

  {t:'std',tag:'You are not alone in it',h2:'The Global Investor Agent community.',p:['Agents running this model are not doing it in isolation. The GIA team gives you strategy support, the full training library, and a community of agents building the same way, so you have a path once the masterclass ends.']},

  {t:'std',tag:'The recap',h2:'Make more money, not more work.',ul:['Stop re-earning one-time clients.','Build a roster of investors who transact again and again.','Turn your license into an income-producing asset.']},

  {t:'cta',eyebrow:'Your next step',h1:'Join the live masterclass.',lede:'Register for the next live Investor Agent training with Gary Wilson and see the model in full, step by step.',cta:'Register for the free live session',disclaimer:'This masterclass is educational. No income or result is guaranteed. Results vary with market conditions, effort, and individual circumstances. Nothing here is financial, legal, or investment advice.'}
];

const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='title'?' title-slide':'')+(s.t==='cta'?' cta':'');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.tag) h+='<span class="tag">'+s.tag+'</span>';
  if(s.num) h+='<div class="num">'+s.num+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.p) s.p.forEach(x=>h+='<p>'+x+'</p>');
  if(s.ul){h+='<ul>';s.ul.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.boxes){h+='<div class="two">';s.boxes.forEach(b=>h+='<div class="box"><h3>'+b.h3+'</h3><p>'+b.p+'</p></div>');h+='</div>';}
  if(s.cta) h+='<p class="lede" style="color:var(--accent);font-weight:600;margin-top:10px">'+s.cta+'</p>';
  if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
