<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Board Seat Playbook | European Women on Boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6fb;        /* cool ivory ground - EWOB light scheme */
    --panel:#ffffff;
    --ink:#211450;       /* EWOB deep indigo */
    --deep:#2c256f;      /* EWOB secondary indigo */
    --accent:#4855bf;    /* EWOB periwinkle accent */
    --muted:#5b5580;
    --rule:#d7d3ea;
    --disp:'Playfair Display',Georgia,serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 22px;min-height:78vh;display:flex;flex-direction:column;
    justify-content:center;position:relative;box-shadow:0 1px 0 rgba(33,20,80,.03)}
  .slide .no{position:absolute;top:20px;right:26px;font-size:12px;letter-spacing:.14em;
    color:var(--muted);text-transform:uppercase}
  .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:20px}
  h1{font-family:var(--disp);font-weight:700;font-size:56px;line-height:1.04;color:var(--ink);
    letter-spacing:-.01em}
  h2{font-family:var(--disp);font-weight:600;font-size:40px;line-height:1.1;color:var(--ink);
    margin-bottom:18px}
  .lead{font-size:20px;line-height:1.55;color:var(--deep);max-width:42ch;margin-top:18px}
  .sub{font-size:17px;line-height:1.6;color:var(--muted);max-width:52ch;margin-top:14px}
  ul{margin:22px 0 0;padding:0;list-style:none;max-width:52ch}
  li{position:relative;padding:12px 0 12px 30px;border-top:1px solid var(--rule);
    font-size:18px;line-height:1.5;color:var(--deep)}
  li:before{content:"";position:absolute;left:0;top:20px;width:10px;height:10px;
    background:var(--accent);border-radius:2px}
  .big{font-family:var(--disp);font-size:120px;line-height:1;color:var(--accent);font-weight:700}
  .part-k{font-family:var(--disp);font-size:22px;color:var(--accent);font-weight:600;margin-bottom:10px}
  .quote{font-family:var(--disp);font-size:34px;line-height:1.3;color:var(--ink);max-width:20ch}
  .foot{margin-top:28px;font-size:14px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
  .cta h1{font-size:48px}
  .disc{font-size:13px;line-height:1.6;color:var(--muted);max-width:60ch;margin-top:24px}
  .brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:82vh}h1{font-size:38px}h2{font-size:30px}.big{font-size:80px}}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass from European Women on Boards',
    h:'The Board Seat Playbook',
    lead:'How senior women land their first European board seat, from the organization that measures every boardroom.' },

  {t:'who', kick:'Who this is for',
    h:'You already run the company.',
    sub:'You are a senior executive with real P&L scars. You have thought about a non-executive director seat for years. You are not sure who to tell, or how the seat actually gets filled.',
    items:['Senior women executives eyeing a first NED seat','Leaders who keep being told to "network more"','Women who suspect the process is a black box'] },

  {t:'trap', kick:'The trap',
    h:'"Just get on more boards’ radar."',
    sub:'It is the advice everyone gives and no one can execute. Board seats are not applied for like jobs. They are nominated, sponsored, and quietly filled long before any list is published.',
    foot:'So the strongest operators wait, assuming the tap will come. Usually it does not.' },

  {t:'framework', k:'The myth', h:'Waiting is not a strategy',
    sub:'The seat does not arrive because you were patient. It arrives because someone could nominate you and knew exactly why.',
    items:['"Someone will notice me" is not a plan','Visibility without a governance case is just noise','The women who get seats made themselves easy to nominate'] },

  {t:'hook', kick:'The uncomfortable part',
    quote:'A board does not hire the best executive. It nominates the person it already trusts to govern.',
    sub:'Governing is a different job than operating, and it is judged on a different CV. That gap, not your track record, is what keeps capable women off boards.' },

  {t:'stat', kick:'The scale of it',
    big:'34%',
    sub:'of board seats across 668 of Europe’s largest listed companies are held by women. We publish that number every year in the Gender Diversity Index. It tells you exactly where the seats are, and are not, opening.' },

  {t:'part', k:'Part one', h:'Why the seat does not come to you',
    items:['Operating credibility does not translate into governance credibility on its own','Nomination committees look for oversight, risk and strategy fluency','Your executive CV argues you can run it, not oversee it','The people who nominate you must be able to describe why in one sentence'] },

  {t:'framework', k:'Part one, continued', h:'The three gaps that stall capable women',
    items:['The credibility gap: you are judged on governing, not operating','The visibility gap: the right people cannot describe you in one sentence','The access gap: you are aiming at lists that are already closed'] },

  {t:'part', k:'Part two', h:'The Board Readiness path',
    sub:'The method we teach over three months and five sessions, previewed here.',
    items:['Build the board CV: governance, oversight, and the one-sentence case for you','Map the boardrooms actually opening, using the Index data','Position for the nomination: sponsors, committees, and search firms','Rehearse the interview a board actually runs','Say yes to the right first seat, not the first seat'] },

  {t:'framework', k:'The board CV', h:'A board CV is not an executive CV',
    sub:'Same person, different room. The board CV proves you can govern, not that you can deliver.',
    items:['Governance and oversight, not operations','Risk and strategy fluency, stated plainly','Independence and judgment','Why THIS board needs you specifically'] },

  {t:'framework', k:'The interview', h:'A board interview is not a job interview',
    sub:'A board is testing judgment under ambiguity, not your list of achievements. You prepare for it differently.',
    items:['How you reason about risk out loud','The questions that reveal governance instinct','What a chair is actually listening for'] },

  {t:'framework', k:'Targeting', h:'Know which boardrooms are open',
    sub:'Most searches never reach women because women are aiming at the wrong list. The Index shows which sectors and companies are moving, and which are stuck.',
    items:['Sectors closing the gap fastest','Companies with a stated balance commitment','Where a first-time NED is genuinely wanted'] },

  {t:'framework', k:'The nomination', h:'Seats are nominated, not applied for',
    sub:'This is the part no one explains. You build a small set of people who can put your name forward, and you make it effortless for them to do it.',
    items:['Who nominates, and how to reach them','Sponsors versus mentors, and why you need both','Making your one-sentence case impossible to forget'] },

  {t:'framework', k:'Sponsorship', h:'You need sponsors, not just mentors',
    sub:'A mentor advises you. A sponsor spends their own credibility to put your name in the room. Our cross-border network is built to create the second kind.',
    items:['Mentors talk to you; sponsors talk about you','How to earn a sponsor without asking for a favor','Why cross-border sponsors widen the boards open to you'] },

  {t:'part', k:'Part three', h:'From operator to board candidate',
    sub:'A capable operator becomes a credible board candidate in a single cohort, then converts a real conversation into a real seat.',
    items:['A board CV a committee can act on','A shortlist of boards that fit you','Named people ready to nominate you','The confidence to run the interview, not survive it'] },

  {t:'part', k:'The room you join', h:'500 women who have already done this',
    sub:'The path does not end at a seat. You join a European community of senior women who compare notes on the boards they now sit on.',
    items:['A network across markets and sectors','Board-level peers, not only aspirants','The second seat is easier than the first'] },

  {t:'cred', kick:'Why us',
    h:'The organization that measures the boardroom.',
    sub:'European Women on Boards has, since 2013, grown a community of 500+ senior women and published the Gender Diversity Index across 668 of Europe’s largest companies, with European Commission support. We do not guess where the seats are. We count them.',
    brand:'European Women on Boards · since 2013' },

  {t:'cta', kick:'Your next step',
    h:'Become board-ready in one cohort.',
    sub:'The Board Readiness Program is three months, five live sessions, and the people to nominate you. Apply for the next cohort and bring one board you want to sit on.',
    disc:'Educational content only. European Women on Boards makes no guarantee of a board appointment or any specific outcome; results depend on your background, effort, and circumstances.' }
];

const stage = document.getElementById('stage');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide' + (s.t==='cta'?' cta':'');
  let html = '<span class="no">'+(i+1)+' / '+S.length+'</span>';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.k) html += '<div class="part-k">'+s.k+'</div>';
  if(s.h) html += (s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) html += '<div class="big">'+s.big+'</div>';
  if(s.quote) html += '<div class="quote">'+s.quote+'</div>';
  if(s.lead) html += '<div class="lead">'+s.lead+'</div>';
  if(s.sub) html += '<div class="sub">'+s.sub+'</div>';
  if(s.items){ html += '<ul>'; s.items.forEach(it=> html += '<li>'+it+'</li>'); html += '</ul>'; }
  if(s.foot) html += '<div class="foot">'+s.foot+'</div>';
  if(s.brand) html += '<div class="brand">'+s.brand+'</div>';
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  d.innerHTML = html;
  stage.appendChild(d);
});
</script>
</body>
</html>
