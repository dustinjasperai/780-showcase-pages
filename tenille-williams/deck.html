<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profitable Dog Trainer · Tenille Williams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FBF8F4; --panel:#EFE9F6; --rule:#E4DEF0;
    --ink:#1F2440; --accent:#4A2E8F; --grey:#5A5568; --dim:#8A86A0;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Mulish',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--ink);line-height:1.18;letter-spacing:-.01em}
  .t-title h1{font-size:3.9vw;max-width:90%}
  .t-normal h1{font-size:2.85vw;max-width:85%;font-weight:600}
  .t-normal .body{font-family:'Mulish',sans-serif;font-size:1.42vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.6;font-weight:400}
  .sub{font-family:'Mulish',sans-serif;font-size:1.62vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.52;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.28vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.1vw;max-width:88%}
  .t-section .rule{width:15vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:3.05vw;max-width:84%;font-weight:600;color:var(--ink)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.35vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Montserrat',sans-serif;border:1.5px solid var(--accent);color:var(--accent);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.12vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .mark{position:absolute;pointer-events:none;opacity:.85}
  .title-mark{right:7%;bottom:9%;width:13vw}
  .brandline{font-family:'Mulish',sans-serif;font-size:1.2vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(31,36,64,.07);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600;font-family:'Montserrat',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Montserrat',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Mulish',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5.1vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:6.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Dog Matters PRO</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- mark: a simple offer "tag" outline with a knot, echoing a priced, packaged program rather than a growth chart -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="tag" viewBox="0 0 200 120">
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92,20 L176,20 L176,84 L108,84 L92,20 Z" stroke="#E4DEF0"/>
    <path d="M40,60 L112,60 L128,100 L56,100 Z" stroke="#4A2E8F"/>
    <circle cx="150" cy="40" r="6" fill="#4A2E8F" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Price, Package and Sell Your Training',sub:'A live masterclass for professional dog trainers on turning real skill with dogs into a business that pays you what that skill is worth.',brand:true,mark:true},

 {t:'normal',k:'Who this is for',title:'You are excellent with dogs. The business side is the part no one taught you.',body:'You can read a nervous dog across a room and turn a family around in a few weeks. Then you sit down to set a price, or explain your fees, and it all goes shaky. That gap is not a skill problem. It is a business problem, and it is fixable.'},
 {t:'normal',k:'The honest starting point',title:'Booked out and still broke is a common place for trainers to get stuck.',body:'From the outside it looks like success: a waitlist, good reviews, dogs getting better. Inside, the money does not match the effort, there is little left at the end of the month, and taking a week off means taking a pay cut. Busy was never the goal.'},
 {t:'dark',title:'You are not underpaid because your training is not good enough. You are underpaid because it is being sold wrong.'},

 {t:'section',idx:'Part One',title:'Why Great Trainers Stay Broke'},
 {t:'normal',k:'The pricing trap',title:'Most trainers price on what feels fair to charge, not on what the result is worth.',body:'A dog that stops lunging on lead. A family that can finally have people over. A rescue that gets to keep its home. Priced by the hour, all of that shrinks to a number that has nothing to do with the change you create, and owners feel that mismatch too.'},
 {t:'normal',k:'The time-for-money ceiling',title:'Selling single sessions caps your income at the number of hours in your week.',body:'One session, one payment, then Monday you start again from zero. There is a hard ceiling on that, and you tend to hit it exhausted. The trainers who break through are not working more hours. They changed what they sell.'},
 {t:'dark',title:'A full calendar is not a business. It is a job you built for yourself, with no room left to grow it.'},

 {t:'section',idx:'Part Two',title:'The Four Shifts'},
 {t:'normal',k:'Four shifts',title:'Four shifts turn a booked-out trainer into a profitable one.',body:'None of them ask you to train differently or to become a salesperson. They change what you sell, how you price it, how you talk about it, and the systems underneath. Price on the outcome, package into programs, sell like a trainer, and protect your time.'},
 {t:'normal',k:'Pillar 1 · Price on the outcome',title:'Set the price against the transformation, not the clock.',body:'Start from what the result is worth to the owner and what it truly costs you to deliver it well, then build the number up from there. A simple, repeatable pricing formula means you never again pull a figure out of the air or discount because you felt awkward asking.'},
 {t:'normal',k:'Pillar 2 · Package into programs',title:'Sell a result delivered as a program, not a stack of loose sessions.',body:'Package your training into a clear outcome with a beginning and an end: the reactive-dog program, the new-puppy program, the board-and-train. Owners buy the finish line, not an hour. Programs can lift your average sale and tend to get dogs better results, because now the plan is complete.'},
 {t:'normal',k:'Pillar 3 · Sell like a trainer',title:'The enrollment conversation is a consult, not a pitch.',body:'You already know how to ask good questions and read what is really going on. The same skill runs the sales conversation: understand the owner, show them the path, make the next step obvious. No pressure and no script that is not you. Just clarity about how you can help.'},
 {t:'normal',k:'Pillar 4 · Protect your time',title:'Agreements, intake questionnaires and homework, built once and used with every client.',body:'Clear training agreements, a behaviour questionnaire that does the intake for you, and homework booklets clients actually follow. The systems that make you look professional are the same ones that hand back the hours you were losing to admin and back-and-forth.'},
 {t:'dark',title:'When the offer is built right, selling stops feeling like convincing and starts feeling like helping.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Run It This Way'},
 {t:'normal',k:'The shift',title:'Same skill, same hours, a business that finally holds together.',body:'Nothing about how you train has to change. What changes is the shape of the offer around it: fewer, better clients on clear programs, priced on the result, sold in a conversation that feels like you. The work you love, on terms you can actually sustain.'},
 {t:'normal',k:'Why Tenille Williams',title:'A working dog trainer who learned the business the hard way, then drew the map.',body:'Tenille has trained dogs since 2010 through Dog Matters, and since 2016 has coached professional dog trainers on the business side through Dog Matters PRO, The Profitable Dog Trainer. This is not theory borrowed from another industry. It is the business of dog training, taught by someone who runs one.'},

 {t:'section',idx:'Your Next Step',title:'Build the Business Your Training Deserves'},
 {t:'normal',k:'How to go deeper',title:'Two ways to keep building this with Tenille.',body:'One-on-one coaching works through your pricing, your offers and your next decisions, with accountability between calls. The Profitable Dog Trainer Masterclass is the full self-paced program: pricing, packaging, selling and the systems, in order, with every template you need.'},
 {t:'cta',title:'Ready to make your training a business that pays you back?',chips:['Book a Coaching Call with Tenille','Join the Profitable Dog Trainer Masterclass'],disc:'Educational content for professional dog trainers. No income, revenue, or business result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function markSvg(){return `<svg class="mark title-mark"><use href="#tag"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Dog Matters <b>PRO</b> &middot; Tenille Williams</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mark) h+=markSvg();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
