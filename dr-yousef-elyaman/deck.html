<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Beyond the Panel · Dr. Yousef Elyaman, FMP Essentials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f2f6fc; --panel:#ffffff; --rule:#dbe3ef;
    --acc:#162b75; --acc2:#2980b9; --ink:#1a2230; --body:#595959;
    --dim:#8a93a8; --chalk:#ffffff; --grey:#e7eefa;
  }
  html,body{height:100%}
  body{background:#e4ecf8;font-family:'Open Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e4ecf8}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Open Sans',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc2);margin-bottom:2.6vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:-.006em}
  .t-title h1{font-size:5.0vw;max-width:93%;color:var(--acc)}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.66;font-weight:400}
  .sub{font-family:'Newsreader',serif;font-size:2.0vw;color:var(--acc2);margin-top:3.4vh;max-width:86%;line-height:1.36;font-weight:500}
  .t-section{align-items:flex-start;background:var(--acc)}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.1vw;font-weight:600;color:#9ec4f0;margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:92%;color:var(--chalk)}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,#9ec4f0,transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#1d357f 0%,#101f52 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:90%;color:var(--chalk)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#1d357f 0%,#101f52 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:88%;color:var(--chalk)}
  .t-cta .body{font-family:'Open Sans',sans-serif;color:#d7e1f2;font-size:1.4vw;margin-top:3vh;max-width:74%;line-height:1.62}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #9ec4f0;color:var(--chalk);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:#aeb9df;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .pl-motif{position:absolute;pointer-events:none}
  .title-pl{right:7.0%;bottom:7.5%;width:20vw;opacity:.9}
  .corner-pl{right:6.0%;bottom:7.0%;width:10vw;opacity:.5}
  .brandline{font-family:'Open Sans',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.03em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(22,43,117,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:5.9vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">FMP Essentials</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- lab-panel motif: a stack of marker rows with one value read deeper, in navy -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="panel" viewBox="0 0 120 120">
  <g fill="none" stroke="#162b75" stroke-width="2.2" stroke-linecap="round">
    <path d="M14 30 H86" opacity="0.30"/>
    <path d="M14 48 H74" opacity="0.30"/>
    <path d="M14 66 H92" opacity="0.85"/>
    <path d="M14 84 H66" opacity="0.30"/>
    <circle cx="100" cy="66" r="6" fill="#2980b9" stroke="none"/>
    <path d="M100 66 V16" opacity="0.85"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Beyond the Panel',sub:'How to read what standard labs miss, and build the clinical judgment your patients feel.',brand:true,cl:'title'},
 {t:'normal',k:'Who this is for',title:'The labs come back "normal," and your gut says the story is not finished.',body:'You are the clinician who senses there is more going on than the reference ranges explain. The patient is tired, the risk feels real, and yet every value sits inside the green. You were trained to rule out disease. What you want now is a way to read the whole picture and act on it with confidence.'},
 {t:'dark',title:'A result inside the reference range is not the same as a patient out of risk.'},

 {t:'section',idx:'Part One',title:'Why "Normal" Keeps Missing the Patient in Front of You'},
 {t:'normal',k:'The reference-range trap',title:'A reference range describes a population, not the person on your table.',body:'Standard ranges are built from a broad sample and tuned to catch overt disease late. They are good at saying "not yet sick." They are quiet about the years of drift before that, which is exactly the window functional medicine is built to work in. Normal is a starting line, not an all-clear.'},
 {t:'normal',k:'The single-marker habit',title:'One flagged value gets the attention. The pattern underneath gets missed.',body:'We are taught to chase the one number that is out of range and move on. But the drivers of chronic risk move together, and the signal lives in the relationship between markers, not in any single flag. When you read one value at a time, you are reading letters instead of the sentence.'},
 {t:'dark',title:'You were trained to rule out disease. Functional medicine asks what is driving it.'},

 {t:'section',idx:'Part Two',title:'The Beyond the Panel Read'},
 {t:'normal',k:'Layer one, read past the panel',title:'Start where the standard panel stops.',body:'A basic lipid panel gives you LDL cholesterol and calls it a day. The risk lives one layer deeper, in the particles. ApoB tells you how many atherogenic particles are actually there, Lp(a) flags an inherited risk a standard panel never shows, and particle size fills in the rest. Same blood draw, a far more honest picture.'},
 {t:'normal',k:'Layer two, find the drivers',title:'Ask what is pushing the numbers, not only what they are.',body:'Behind the lipids sit the forces that move them. Insulin resistance shows up in the triglyceride to HDL ratio long before glucose does. Oxidative stress and inflammation quietly raise the risk a clean panel hides. Homocysteine and methylation round it out. Read the drivers and the plan almost writes itself.'},
 {t:'normal',k:'Layer three, one root-cause picture',title:'Assemble the markers into one story, not seven separate flags.',body:'This is the skill that takes years on your own and an afternoon with a framework. You layer the particles, the drivers, and the history into a single root-cause read, so you can say what is actually happening for this patient and why. That is the difference between managing numbers and treating a person.'},
 {t:'normal',k:'Layer four, from read to plan',title:'Turn the read into a plan the patient can follow on Monday.',body:'A root-cause read is only useful if it becomes action. You match targeted lifestyle and nutrition to the drivers you found, decide honestly when medication earns its place, and set the follow-up markers that prove the plan is working. Precise, individualized, and defensible to any colleague who asks.'},
 {t:'dark',title:'Good functional medicine is not more tests. It is a better read of the ones you already have.'},

 {t:'section',idx:'Part Three',title:'Real Cases, Real Decisions'},
 {t:'normal',k:'How the judgment sharpens',title:'Clinical judgment grows fastest when you work real cases with people who practice like you.',body:'Reading a framework is one thing. Deciding on a live, messy patient is another. The judgment gets built in the room where you bring the actual case, hear how an experienced clinician reasons through it, and leave with a decision you can defend. That is what turns new information into instinct.'},
 {t:'normal',k:'What changes for you',title:'You stop guessing at the edges and start deciding with a method.',body:'When you have a repeatable way to read past the panel, the hard cases stop being intimidating and start being interesting. You order with intent, you explain risk in plain language your patients trust, and you make the call with a reason behind it. Your patients feel the difference, and so does your practice.'},
 {t:'normal',k:'Why Dr. Yousef Elyaman',title:'Board-certified, still in practice, and teaching this every week.',body:'I am board certified in Internal Medicine and Pediatrics and in Integrative Medicine, an early graduate of the Institute for Functional Medicine, and now on its teaching faculty. I still see patients at my own clinic. My whole approach is functional medicine practiced as good medicine: evidence first, root cause always, and a read you can stand behind.'},
 {t:'dark',title:'Functional medicine that reads like good medicine. That is the whole point.'},

 {t:'section',idx:'Your Next Step',title:'Keep Reading Deeper'},
 {t:'cta',title:'Ready to practice with this kind of judgment?',body:'Take the next step with FMP Essentials, where clinicians read past the panel together every month.',chips:['Join the FMP Mastermind','Explore the Beyond the Panel courses'],disc:'Educational content for licensed clinicians and is not individual medical advice. No clinical or financial result is guaranteed. Results vary by practitioner, patient, and practice.'},
];

const deck=document.getElementById('deck');
function cl(kind){return `<svg class="pl-motif ${kind==='title'?'title-pl':'corner-pl'}"><use href="#panel"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">FMP <b>Essentials</b> · Dr. Yousef Elyaman</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.cl) h+=cl(s.cl);
  else if(s.t==='title') h+=cl('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
