<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Idea - A Masterclass with Erik Bork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f1ea;        /* warm paper, tinted from their #95958b gray-green */
    --panel:#fbfaf6;
    --rule:#e2ded3;
    --ink:#171717;       /* their dominant text hex */
    --muted:#5b5b53;     /* derived from their #95958b warm gray-green */
    --accent:#3f03a0;    /* their one saturated site accent, verbatim */
    --accent-soft:#efe8fb;
    --serif:"Frank Ruhl Libre",Georgia,serif;   /* their H1 face */
    --sans:"Archivo",system-ui,sans-serif;        /* their body face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 58px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(23,23,23,.02)}
  .kicker{font-family:var(--sans);font-weight:600;font-size:12.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  .num{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--accent);
    letter-spacing:.14em;margin-bottom:14px}
  h1{font-family:var(--serif);font-weight:900;font-size:58px;line-height:1.04;
    letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.1;
    letter-spacing:-.01em;margin-bottom:18px}
  h3{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.15;margin-bottom:12px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:40em;margin-bottom:14px}
  p.sub{font-size:21px;color:var(--muted)}
  p.lead{font-size:23px;line-height:1.55}
  .big{font-family:var(--serif);font-size:34px;line-height:1.25;font-weight:500;max-width:22em}
  ul{list-style:none;margin:10px 0 0;max-width:42em}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:12px 0 12px 30px;position:relative;
    border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:21px;width:9px;height:9px;border-radius:2px;
    background:var(--accent)}
  .eltag{display:inline-block;font-family:var(--sans);font-weight:700;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:6px 12px;border-radius:999px;margin-bottom:18px}
  .ask{font-family:var(--sans);font-size:17px;color:var(--muted);font-style:italic;margin-top:18px;
    padding-top:16px;border-top:1px solid var(--rule);max-width:40em}
  .foot{font-family:var(--sans);font-size:13px;color:var(--muted);letter-spacing:.03em}
  .acrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
  .accard{flex:1 1 150px;border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
  .accard b{font-family:var(--serif);font-size:22px;color:var(--accent);display:block;margin-bottom:4px}
  .accard span{font-size:14px;color:var(--muted)}
  .disc{font-family:var(--sans);font-size:14px;color:var(--muted);line-height:1.5;margin-top:26px;
    padding-top:18px;border-top:1px solid var(--rule);max-width:44em}
  .cta-step{font-family:var(--serif);font-size:24px;color:var(--ink);margin:6px 0 2px}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:380px}h1{font-size:40px}h2{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
   kick:'A Masterclass with Erik Bork',
   h:'The Idea',
   sub:'The seven-element test that tells you whether a story will work, before you spend a year writing it.',
   foot:'Erik Bork  ·  Writer, Band of Brothers  ·  Author of The Idea'},

  {t:'who',
   kick:'Who this is for',
   h:'For writers who keep finishing drafts that do not land.',
   p:'Screenwriters, novelists, and playwrights, new or working, who have poured months into a script or manuscript and watched it stall out with readers, contests, or the market, and are not sure why.',
   sub:'If you are about to start something new, this is the hour that saves you the year.'},

  {t:'trap',
   kick:'The trap',
   h:'You can master the craft and still write something nobody wants.',
   p:'You learn structure. You learn beats, formatting, dialogue, the hero’s journey. You apply all of it, carefully, to the page.',
   lead:'And the script still does not work. Because in most cases the craft was never the thing that was broken.'},

  {t:'reframe',
   kick:'The hard truth',
   big:'Most stories do not fail in the writing. They fail at the idea, and the writer only finds out after a year of drafts.',
   sub:'The weakness was there on page one of the outline. It just stayed invisible until it was expensive.'},

  {t:'part',num:'PART ONE',
   h:'A weak idea cannot be rescued by good writing.',
   sub:'Why the concept, not the execution, decides the outcome.'},

  {t:'list',
   kick:'Part One',
   h:'What actually happens',
   list:[
     'The fatal weakness is baked into the concept, so every rewrite polishes a foundation that was cracked from the start.',
     'Gatekeepers decide on the logline and the first ten pages, long before they reach your best scene.',
     'You confuse "I worked hard on this" with "this is working," and the two are not related.',
     'The fix is not another pass. The fix is testing the idea itself, before you commit.']},

  {t:'bridge',
   kick:'The shift',
   big:'So you stop asking "is my writing good enough?" and start asking "was this idea ever strong enough to work?"',
   sub:'That question has an answer. There are seven parts to it.'},

  {t:'part',num:'PART TWO',
   h:'The Seven Elements of a Viable Story',
   sub:'Run your concept through each one. The elements spell PROBLEM, which is exactly what a story needs.'},

  {t:'el',tag:'P  ·  Punishing',h:'Does the main character suffer, continuously?',
   p:'A viable story puts its lead through truly escalating complications and conflict. The trouble compounds. It does not resolve and reset.',
   ask:'Ask: does my situation force relentless, rising difficulty, or does it run out of problems by the midpoint?'},

  {t:'el',tag:'R  ·  Relatable',h:'Can the audience live inside it?',
   p:'The audience emotionally identifies with the lead and experiences the story through a truly subjective point of view, not from a safe distance.',
   ask:'Ask: is there one person whose wanting I feel in my body, or am I watching events happen to strangers?'},

  {t:'el',tag:'O  ·  Original',h:'Is the hook genuinely fresh?',
   p:'A strong concept builds off its genre predecessors and then adds a memorably fresh conceptual hook. It is familiar enough to sell and new enough to matter.',
   ask:'Ask: can I say what this is like, and then say the one twist that makes it unlike anything else?'},

  {t:'el',tag:'B  ·  Believable',h:'Does it feel true, not convenient?',
   p:'The world, the events, and the characters feel grounded in vivid authenticity. Nothing happens because the plot needed it to.',
   ask:'Ask: would these specific people really do this, or are they doing it because I need them to?'},

  {t:'el',tag:'L  ·  Life-Altering',h:'Do the stakes feel like life and death?',
   p:'Reaching the main goal has to feel life-and-death to the characters, and therefore to the audience. The cost of failing has to be unbearable.',
   ask:'Ask: if my lead walked away right now, would anything truly be lost, or could they just go home?'},

  {t:'el',tag:'E  ·  Entertaining',h:'Is it a compelling ride?',
   p:'The situation and the storytelling deliver on the promise of the genre. Whatever the reader came for, tension, laughter, wonder, dread, it is there in full.',
   ask:'Ask: does my concept promise a specific experience, and does every scene actually pay it off?'},

  {t:'el',tag:'M  ·  Meaningful',h:'Is there something only you could say?',
   p:'Your individual voice and thematic exploration lead to a genuinely rich take-away. Underneath the plot, the story is about something.',
   ask:'Ask: when it is over, what does the audience carry out of the room, and is it worth carrying?'},

  {t:'use',
   kick:'How to use the seven',
   h:'The weakest element is your next move.',
   p:'Score your concept honestly against all seven before you outline. You are not looking for a perfect seven out of seven. You are looking for the one or two elements that are soft, because that is precisely where the story will break.',
   lead:'Strengthen those at the idea stage, on a single page, instead of discovering them in draft eleven.'},

  {t:'part',num:'PART THREE',
   h:'When the idea holds, you can feel it.',
   sub:'The difference the moment the concept stops fighting you.'},

  {t:'list',
   kick:'Part Three',
   h:'When the seven are in place',
   list:[
     'Clarity: you can say what the story is in a sentence, and people lean in.',
     'Cohesion: character, structure, genre, and theme all point the same direction, because they were built around one idea.',
     'Narrative drive: the draft comes faster and truer, because you are no longer writing to find the story.',
     'The pitch lands, because the strength was in the concept the reader heard first.']},

  {t:'why',
   kick:'Why listen to me on this',
   h:'Erik Bork',
   p:'I wrote for HBO’s Band of Brothers and From the Earth to the Moon, work that earned two Emmy and two Golden Globe awards. I have sold pitches to the networks, written features for the studios, and in 2025 directed my first feature.',
   p2:'For fifteen years I have also sat on the other side of the desk as a story consultant, and the same thing sinks most projects: a good writer, working hard, on an idea that was never viable. The Idea is how I teach people to catch that first.'},

  {t:'cta',
   kick:'Your next step',
   h:'Test your idea before you write it.',
   step1:'Start free: download the Ten Key Principles Successful Writers Understand.',
   step2:'Go deeper: The Idea course walks all seven elements with worksheets and lessons.',
   step3:'Work with me directly: a script consultation or ongoing mentoring on your own project.',
   foot:'ErikBork  ·  flyingwrestler.com',
   disc:'Educational content only. No specific outcome, sale, representation, award, or result is guaranteed. Every writer’s path and results vary.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var deck=document.getElementById('deck');
S.forEach(function(s){
  var d=el('div','slide');
  if(s.kick)d.appendChild(el('div','kicker',s.kick));
  if(s.num)d.appendChild(el('div','num',s.num));
  if(s.tag)d.appendChild(el('span','eltag',s.tag));
  if(s.h)d.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));
  if(s.sub)d.appendChild(el('p','sub',s.sub));
  if(s.big)d.appendChild(el('div','big',s.big));
  if(s.lead)d.appendChild(el('p','lead',s.lead));
  if(s.p)d.appendChild(el('p',null,s.p));
  if(s.p2)d.appendChild(el('p',null,s.p2));
  if(s.list){var ul=el('ul');s.list.forEach(function(li){ul.appendChild(el('li',null,li));});d.appendChild(ul);}
  if(s.ask)d.appendChild(el('div','ask',s.ask));
  if(s.step1){d.appendChild(el('div','cta-step',s.step1));d.appendChild(el('div','cta-step',s.step2));d.appendChild(el('div','cta-step',s.step3));}
  if(s.disc)d.appendChild(el('div','disc',s.disc));
  if(s.foot)d.appendChild(el('div','foot',s.foot));
  deck.appendChild(d);
});
</script>
</body>
</html>
