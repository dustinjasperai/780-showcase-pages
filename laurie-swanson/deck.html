<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Alchemy, a masterclass by Laurie Swanson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf7fa; --panel:#ffffff; --rule:#e7d6df; --accent:#c8187d; --ink:#2b2230; --muted:#6b5d66;
    --head:'Montserrat',system-ui,sans-serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;position:relative}
  .slide{display:none;width:100%;max-width:960px}
  .slide.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:800;font-size:clamp(34px,6vw,62px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(26px,4.4vw,44px);line-height:1.1;letter-spacing:-.01em}
  .sub{font-size:clamp(17px,2.2vw,22px);color:var(--muted);margin-top:22px;max-width:46ch;line-height:1.5}
  .rule{width:68px;height:4px;background:var(--accent);border-radius:3px;margin:30px 0}
  ul{list-style:none;margin-top:30px;display:grid;gap:16px}
  li{position:relative;padding-left:34px;font-size:clamp(16px,2vw,20px);line-height:1.45;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:.5em;width:12px;height:12px;border:2px solid var(--accent);border-radius:50%}
  .pillar{display:grid;gap:10px}
  .pillar .num{font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.2em;color:var(--accent)}
  .p{font-size:clamp(17px,2.2vw,21px);line-height:1.55;color:var(--ink);max-width:52ch;margin-top:24px}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:40px 44px;box-shadow:0 18px 44px -32px rgba(43,34,48,.5)}
  .cta-steps{display:grid;gap:14px;margin-top:28px}
  .cta-steps div{font-size:clamp(16px,2vw,20px);padding-left:34px;position:relative}
  .cta-steps div::before{content:"";position:absolute;left:0;top:.45em;width:12px;height:12px;background:var(--accent);border-radius:50%}
  .disc{margin-top:34px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .brandline{font-family:var(--head);font-weight:700;letter-spacing:.04em;margin-top:30px;font-size:16px}
  #nav{position:fixed;bottom:22px;right:28px;display:flex;align-items:center;gap:14px;font-family:var(--head);font-size:13px;color:var(--muted)}
  #nav button{font-family:var(--head);font-weight:700;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
  #nav button:hover{border-color:var(--accent);color:var(--accent)}
  #count{min-width:52px;text-align:center}
  .compass{position:fixed;top:26px;left:30px;font-family:var(--head);font-weight:800;letter-spacing:.16em;font-size:13px;color:var(--ink);text-transform:uppercase}
  .compass span{color:var(--accent)}
</style>
</head>
<body>
<div class="compass">Inspi<span>HER</span> Tech</div>
<div id="stage"></div>
<div id="nav"><button id="prev">Prev</button><span id="count"></span><button id="next">Next</button></div>
<script>
const S=[
  {t:'title',k:'A live masterclass with Laurie Swanson',h:'Career Alchemy',s:'How differently ambitious women in tech align who they are with how careers actually get built.'},
  {t:'promise',k:'The promise',h:'Stop optimizing to someone else’s ladder.',s:'In the next hour you will see how to align your real self with the way hiring and promotion actually work, from someone who sat in both the engineer’s chair and the recruiter’s chair.'},
  {t:'list',k:'Who this is for',h:'You, if you are a woman in tech who is…',b:["Burned out, overlooked, or quietly done with climb-at-all-costs","At a crossroads and not sure which way is actually yours","Doing everything right on paper and still feeling misaligned","Ready for a career that fits who you are, not just your resume"]},
  {t:'list',k:'The trap',h:'The quick-fix career loop.',b:["More applications, more hustle, more networking hacks","A louder resume and a shinier LinkedIn","A new title that feels like the old one in a new building","And six months later, the same stuck feeling"]},
  {t:'reframe',k:'A reframe',h:'People don’t hate work.',s:'They hate being misaligned with it. The problem was never your effort. It was that nobody showed you how to align who you are with where you are going.'},
  {t:'part',k:'Part one',h:'The core problem',s:'You have been handed tactics without a compass. Tactics move you faster in whatever direction you are already pointed, even if it is the wrong one.'},
  {t:'part',k:'Part two',h:'The Career Alchemy method',s:'Three pillars that turn a stalled, burned-out career into aligned momentum.'},
  {t:'pillar',k:'Pillar one',h:'Your Alchemist Career Vision',num:'01',p:"Build real self-belief, get clear on your values and mission, and design the ideal role on purpose, then map the strategic plan to reach it. Vision first, so every later move points the right way."},
  {t:'pillar',k:'Pillar two',h:'Your Alchemist Path',num:'02',p:"Align that vision with your real priorities, build visibility so the right people see you, activate the alignment in how you work, and deliver on the goals that actually matter."},
  {t:'pillar',k:'Pillar three',h:'Your Alchemist Tools',num:'03',p:"Mindset management, a career-retrospective practice, structured decision-making, and spiritual intelligence at work. The tools that keep you aligned when the pressure is on."},
  {t:'reframe',k:'The through-line',h:'The Inner Compass',s:'Instead of optimizing to someone else’s ladder, you learn to read and use your own inner signal. That is the instrument every pillar is tuning.'},
  {t:'part',k:'An exercise',h:'Connect the Dots',s:'We surface the passions that are genuinely yours and reveal where past choices pulled you off course, so the next move is one you actually want.'},
  {t:'list',k:'Part three',h:'The recruiter’s-eye view.',b:["What a recruiter actually screens for, and it is not what your resume thinks","How searches really run, and where candidates get filtered out","What an ideal candidate profile looks like from the other side","How to be found, understood, and chosen for who you really are"]},
  {t:'reframe',k:'Why me',h:'I have sat in both chairs.',s:'Software engineer, then more than twenty years in tech recruiting, and founder of a multi-million-dollar IT search firm. A certified Wayfinder and Energy Leadership coach, and a TEDx speaker on why people hate their jobs. I coach you from both sides of the table.'},
  {t:'list',k:'What it looks like',h:'Six months, burned out to aligned.',b:["Month one, you name where you actually are","Then Vision, a role you design instead of settle for","Then Path, visibility and momentum with the right people","By month six, aligned and moving, on your own terms"]},
  {t:'cta',k:'Your next step',h:'Let’s find your alignment.',steps:["Book a conversation with Laurie and we will map where you are and where you are going","Or join the Career Alchemy Academy, a community of differently ambitious women in tech","Either way, you leave with a clearer compass than you walked in with"],brand:'InspiHER Tech · Career Alchemy with Laurie Swanson',disc:'This masterclass is educational. No income or specific career result is guaranteed. Results vary by person, effort, and circumstances.'}
];
const stage=document.getElementById('stage');
function esc(x){return x;}
function render(s){
  if(s.t==='cta'){
    let steps=s.steps.map(function(x){return '<div>'+x+'</div>'}).join('');
    return '<div class="slide on"><div class="panel"><div class="kicker">'+s.k+'</div><h2>'+s.h+'</h2><div class="cta-steps">'+steps+'</div><div class="brandline">'+s.brand+'</div></div><div class="disc">'+s.disc+'</div></div>';
  }
  if(s.t==='pillar'){
    return '<div class="slide on"><div class="kicker">'+s.k+'</div><div class="pillar"><div class="num">'+s.num+'</div><h2>'+s.h+'</h2></div><div class="rule"></div><div class="p">'+s.p+'</div></div>';
  }
  if(s.t==='list'){
    let items=s.b.map(function(x){return '<li>'+x+'</li>'}).join('');
    return '<div class="slide on"><div class="kicker">'+s.k+'</div><h2>'+s.h+'</h2><ul>'+items+'</ul></div>';
  }
  if(s.t==='title'){
    return '<div class="slide on"><div class="kicker">'+s.k+'</div><h1>'+s.h+'</h1><div class="rule"></div><div class="sub">'+s.s+'</div></div>';
  }
  // promise, reframe, part
  return '<div class="slide on"><div class="kicker">'+s.k+'</div><h2>'+s.h+'</h2><div class="rule"></div><div class="sub">'+s.s+'</div></div>';
}
let i=0;
function show(){stage.innerHTML=render(S[i]);document.getElementById('count').textContent=(i+1)+' / '+S.length;}
document.getElementById('next').onclick=function(){i=Math.min(S.length-1,i+1);show();};
document.getElementById('prev').onclick=function(){i=Math.max(0,i-1);show();};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '){i=Math.min(S.length-1,i+1);show();}if(e.key==='ArrowLeft'){i=Math.max(0,i-1);show();}});
show();
</script>
</body>
</html>
