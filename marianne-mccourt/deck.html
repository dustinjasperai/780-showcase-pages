<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Eulogy Effect — a masterclass by Marianne McCourt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf7;
    --panel:#f6eef3;
    --rule:#d9c4d2;
    --accent:#68175e;
    --ink:#0d0d0f;
    --display:"Cormorant Garamond",Georgia,serif;
    --body:"Open Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:32px 24px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 52px;
    margin:0 0 22px;
    min-height:62vh;
    display:flex;flex-direction:column;justify-content:center;
  }
  .slide.accent{background:var(--accent);color:#fdf6fb;border-color:var(--accent)}
  .slide.panel{background:var(--panel);border-color:var(--rule)}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  .slide.accent .kick{color:#f0c7e6}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,4.5vw,44px);line-height:1.1;margin-bottom:16px}
  p{font-size:clamp(16px,2.1vw,20px);line-height:1.6;max-width:62ch;margin-bottom:14px}
  .lede{font-family:var(--display);font-style:italic;font-size:clamp(20px,3vw,28px);line-height:1.35;color:var(--accent)}
  .slide.accent .lede{color:#fde9f6}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:clamp(16px,2.1vw,20px);line-height:1.5;padding:12px 0 12px 26px;border-top:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:21px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .slide.accent li{border-color:rgba(255,255,255,.22)}
  .slide.accent li:before{background:#f0c7e6}
  .num{font-family:var(--display);font-size:clamp(44px,8vw,86px);font-weight:600;color:var(--accent);line-height:1}
  .slide.accent .num{color:#f6d4ec}
  .pillar{font-family:var(--display);font-size:clamp(30px,5vw,48px);font-weight:600;margin:6px 0 10px}
  .foot{font-family:var(--body);font-size:12px;color:var(--accent);letter-spacing:.04em;margin-top:28px}
  .disc{font-size:13px;color:#6b6168;line-height:1.5;max-width:60ch;margin-top:22px}
  .pagenum{font-family:var(--body);font-size:11px;color:var(--rule);text-align:right;margin-top:18px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'accent', html:`
    <div class="kick">A masterclass with Marianne McCourt</div>
    <h1>The Eulogy Effect</h1>
    <p class="lede">How to stop waiting for someday, and start living the second half of your life on purpose.</p>
    <div class="foot">For women over 50 who are done living someone else's version of their life.</div>
  `},
  {t:'who', cls:'panel', html:`
    <div class="kick">Who this is for</div>
    <h2>You have built a good life. It just does not feel like yours.</h2>
    <p>You are successful on paper. Capable. The one everyone leans on. And somewhere in the quiet, you have started to notice a gap between the life you say you want and the life you are actually living.</p>
    <p>You are not broken. You are not behind. You have just been running someone else's script for a long time.</p>
  `},
  {t:'trap', html:`
    <div class="kick">The trap</div>
    <h2>"I'll do it when things finally calm down."</h2>
    <p>So you wait. For the kids, the job, the house, the year to settle. You keep the real life filed under someday.</p>
    <p class="lede">Here is the thing nobody says out loud: things never calm down. That is the whole point.</p>
  `},
  {t:'hook', cls:'accent', html:`
    <div class="kick">A harder question</div>
    <h2>Picture the people you love at your funeral.</h2>
    <p>Listen to what they say about how you lived. Not your job title. How you actually showed up. Whether you were here for it.</p>
    <p class="lede">Now compare that to this week. That distance is the only thing worth working on.</p>
  `},
  {t:'part', html:`<div class="num">Part One</div><h2>The real problem is not time. It is honesty.</h2>`},
  {t:'problem', html:`
    <div class="kick">The core problem</div>
    <h2>You keep arguing with reality.</h2>
    <p>We spend enormous energy wishing things were different than they are. The marriage, the body, the career, the years that went by. As long as we argue with what is, we cannot act on it.</p>
    <p>Nothing changes until you stop fighting the facts and start working from them.</p>
  `},
  {t:'cost', cls:'panel', html:`
    <div class="kick">The cost of waiting</div>
    <h2>Someday is not a plan. It is a quiet way of saying no.</h2>
    <p>Every year the gap stays open, it costs a little more. Not in drama. In ordinary mornings you do not get back.</p>
    <p>You do not need to burn your life down. You need to stop abandoning yourself inside it.</p>
  `},
  {t:'part', html:`<div class="num">Part Two</div><h2>The method: Stoicism with Sass.</h2>`},
  {t:'method', html:`
    <div class="kick">The Eulogy Effect</div>
    <h2>Classical acceptance, delivered without the solemnity.</h2>
    <p>The old Stoics had one useful idea: start from what is true, not from what you wish were true. I add the part they left out, which is that you are allowed to be funny, furious and fully yourself while you do it.</p>
    <p class="lede">Three pillars carry the whole thing.</p>
  `},
  {t:'pillar', cls:'accent', html:`
    <div class="kick">Pillar one</div>
    <div class="pillar">Accept what is.</div>
    <p>Stop arguing with reality. Name the life you actually have, honestly and without flinching. This is not giving up. It is the only solid ground to build on.</p>
  `},
  {t:'pillar', cls:'accent', html:`
    <div class="kick">Pillar two</div>
    <div class="pillar">Own who you are.</div>
    <p>Take an honest inventory of what you have already built and survived before you decide what to change. Not self-criticism. An accurate account. Most women over 50 have badly underpriced their own life.</p>
  `},
  {t:'pillar', cls:'accent', html:`
    <div class="kick">Pillar three</div>
    <div class="pillar">Live while you're here.</div>
    <p>Let your own mortality do its best work, which is to make the small, true choices obvious again. Not dread. Direction. The eulogy is the brief; this week is where you write it.</p>
  `},
  {t:'exercise', cls:'panel', html:`
    <div class="kick">The core exercise</div>
    <h2>Work backward from the end.</h2>
    <p>Write the eulogy you would want to be true. Then look at your calendar. The places they disagree are not failures. They are your instructions.</p>
    <p>We do this together, line by line, until the next right step is obvious and small enough to actually take.</p>
  `},
  {t:'questions', html:`
    <div class="kick">Where we start</div>
    <h2>Four honest questions.</h2>
    <ul>
      <li>What do you say you want?</li>
      <li>What are you actually building with your days?</li>
      <li>Where is the gap between the two?</li>
      <li>What changes the moment you get honest about it?</li>
    </ul>
  `},
  {t:'part', html:`<div class="num">Part Three</div><h2>The second half, lived on purpose.</h2>`},
  {t:'after', html:`
    <div class="kick">The other side</div>
    <h2>Not a new you. The one who was there all along.</h2>
    <p>You stop performing a life and start living one. The decisions get quieter and clearer. You spend less time waiting and more time here. People notice, though they cannot always say why.</p>
  `},
  {t:'whyme', cls:'panel', html:`
    <div class="kick">Why me</div>
    <h2>I have run the experiment on myself.</h2>
    <p>I am 61. I have run restaurants, renovated houses, worked as a photographer, and spent years caring for my mother until she died. Grief is what finally made my own priorities impossible to ignore.</p>
    <p>I am certified by The Life Coach School and Heroic Coach, and I have spent fifteen years helping women over 50 get brutally and lovingly honest about the life they want.</p>
  `},
  {t:'recap', cls:'accent', html:`
    <div class="kick">The whole method, in one breath</div>
    <h2>Accept what is. Own who you are. Live while you're here.</h2>
    <p class="lede">That is the Eulogy Effect. The rest is practice.</p>
  `},
  {t:'cta', cls:'panel', html:`
    <div class="kick">The next step</div>
    <h2>Let's close your gap together.</h2>
    <p>If this is the honest conversation you have been putting off, come and have it. Book a conversation with me and we will look at your eulogy, your calendar, and the first small step between them.</p>
    <p class="lede">Accept what is. Own who you are. Live while you're here.</p>
    <p class="disc">This masterclass is educational. It is not therapy, medical, legal, or financial advice. No specific outcome or result is guaranteed; every woman's path is her own and results vary.</p>
  `}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.cls?' '+s.cls:'');
  el.innerHTML=s.html+'<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(el);
});
</script>
</body>
</html>
