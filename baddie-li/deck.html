<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Good Girl to Bad Bitch — A Masterclass with Lisa Carmen Wang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1e9ef;        /* lilac cream — a pale tint of the dominant royal purple #451153 */
    --panel:#fbf7fb;     /* near-white with a purple hint */
    --tint:#e7d9ea;      /* pale wash of the royal purple */
    --rule:#e3d7e4;      /* light purple-grey (from brand #e7e7e7, warmed toward purple) */
    --ink:#241226;       /* deep aubergine ink */
    --muted:#6a5c6e;
    --accent:#451153;    /* ROYAL PURPLE — dominant brand color (24 uses) */
    --accent2:#c51a3d;   /* crimson — brand secondary, emphasis only */
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Manrope', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;position:relative}
  .slide{display:none;width:100%;max-width:960px}
  .slide.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  .kicker.crim{color:var(--accent2)}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(36px,6.4vw,72px);line-height:1.03;
    letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.6vw,50px);line-height:1.08;
    margin-bottom:20px}
  .lede{font-family:var(--serif);font-size:clamp(21px,2.7vw,32px);line-height:1.38;color:var(--ink);
    max-width:40ch}
  .sub{font-size:clamp(16px,1.9vw,20px);color:var(--muted);margin-top:22px;max-width:52ch;line-height:1.55}
  .by{margin-top:40px;font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--ink)}
  .by span{color:var(--muted);font-weight:400}
  ul{list-style:none;margin-top:12px}
  li{font-size:clamp(17px,2.1vw,22px);line-height:1.5;padding:12px 0 12px 34px;position:relative;
    border-bottom:1px solid var(--rule);max-width:48ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:22px;width:12px;height:12px;border-radius:2px;
    background:var(--accent);transform:rotate(45deg)}
  li.crim::before{background:var(--accent2)}
  .big{font-family:var(--serif);font-size:clamp(28px,4.6vw,48px);line-height:1.16;max-width:22ch}
  .big em{font-style:italic;color:var(--accent)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:24px}
  .card{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    border-radius:4px;padding:22px 24px}
  .card h3{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .card p{font-size:17px;line-height:1.5;color:var(--ink)}
  .card.crim{border-left-color:var(--accent2)}
  .card.crim h3{color:var(--accent2)}
  .rule{width:64px;height:3px;background:var(--accent);margin:26px 0}
  .quote{font-family:var(--serif);font-style:italic;font-size:clamp(26px,3.8vw,44px);line-height:1.22;
    max-width:24ch}
  .quote .mark{color:var(--accent2)}
  .disc{margin-top:28px;font-size:12.5px;color:var(--muted);line-height:1.5;max-width:60ch}
  .cta-btn{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;font-family:var(--sans);
    font-weight:700;letter-spacing:.03em;font-size:17px;padding:16px 30px;border-radius:3px;text-decoration:none}
  .step{display:flex;gap:18px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule);max-width:52ch}
  .step:last-child{border-bottom:none}
  .step .n{font-family:var(--serif);font-size:32px;color:var(--accent);line-height:1;min-width:40px}
  .step p{font-size:17px;line-height:1.45}
  .nav{position:fixed;bottom:18px;right:26px;font-family:var(--sans);font-size:13px;color:var(--muted);
    letter-spacing:.06em}
  .brandbar{position:fixed;top:0;left:0;height:5px;width:100%;z-index:5;
    background:linear-gradient(90deg,var(--accent) 0 70%,var(--accent2) 70% 100%)}
  .hint{position:fixed;bottom:18px;left:26px;font-size:12px;color:var(--muted)}
  @media(max-width:720px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="brandbar"></div>
<div id="stage"></div>
<div class="nav"><span id="pos">1</span> / <span id="tot"></span></div>
<div class="hint">&larr; &rarr; to move</div>
<script>
const S=[
 {t:'title', k:'A Live Masterclass',
  h:'From Good Girl<br>to Bad Bitch',
  sub:'Build an unapologetic brand that commands the room, and the bank account.',
  by:'Lisa Carmen Wang', bySpan:'Founder, Bad Bitch Empire &middot; Author, The Bad Bitch Business Bible'},

 {t:'list', k:"What you'll leave with", h2:'In the next 60 minutes',
  bullets:[
   {x:'The exact "Good Girl Brainwashing" that is quietly costing you clients, money, and rooms.'},
   {x:'The feminine-power brand identity that makes ambitious women magnetic instead of invisible.'},
   {x:'The first three moves to command your worth and charge like you mean it.', crim:true}]},

 {t:'lede', k:'Who this is for',
  lede:"You've already achieved more than most. Founder, executive, creator. To the world you're thriving.",
  sub:"And still there's a nagging feeling: that you're an imposter, that you're not fully yourself, that you have so much more to offer than anyone is seeing."},

 {t:'list', k:'The trap', kc:true, h2:'You know the pattern',
  bullets:[
   {x:'You say "yes" when you want to say "no."'},
   {x:'You undervalue and undersell yourself in negotiations.'},
   {x:'You overdeliver, undercharge, and quietly wait for permission.'},
   {x:'You hold back your boldest work for fear of being "too much."', crim:true}]},

 {t:'hook', k:'The reframe', kc:true,
  big:'You were not born this way.<br>You were <em>Good Girl Brainwashed.</em>',
  sub:'Perfectionism, people-pleasing, and permission-asking were trained into you. The good news: what was trained in can be trained out.'},

 {t:'cards', k:'The real cost', h2:'This is not a confidence problem',
  lede:"It's a conditioning problem. And it has a price tag.",
  cards:[
   {h3:'What it costs you', p:'The revenue left on the table. The premium offer never launched. The brand that never got built.'},
   {h3:"Once it's handled", p:'You take up space, name your price, and let the right people find you, on purpose.', crim:true}]},

 {t:'part', k:'Part One', h:'Imitating a man only gets you as far as a man.'},

 {t:'lede', k:'The old playbook',
  h2:'Be more "professional." Strip the feminine out.',
  sub:'The advice women get is to be more aggressive, more linear, more like the men in the room. It works, up to a ceiling, because a copy can only ever rank below the original.',
  lede2:"The move isn't to imitate harder. It's to lead from the power they told you to hide."},

 {t:'quote', q:'A woman who imitates a man can only go as far as a man. A woman who embraces her full feminine power is unstoppable.', by:'Lisa Carmen Wang'},

 {t:'part', k:'Part Two', h:'The Method: the 10 Commandments of the Bad Bitch.'},

 {t:'cards', k:'Commandments I &middot; II', h2:'Reclaim your body &amp; your presence',
  cards:[
   {h3:'Be Unbreakable', p:"Stop outsourcing your worth to outcomes. Build the inner steadiness that fear can't move."},
   {h3:'Take Up Space', p:'Presence is a decision. Walk in, settle, and let the room adjust to you, not the other way around.'}]},

 {t:'list', k:'Commandments III to VI', h2:'Reclaim your voice &amp; your boundaries',
  bullets:[
   {x:'Assert your voice: speak first, speak plainly, stop qualifying.'},
   {x:'Own your wins out loud, with no apology attached.'},
   {x:"Call out what's wrong instead of smoothing it over."},
   {x:"Curate your crew: the room you're in sets the ceiling you'll hit.", crim:true}]},

 {t:'cards', k:'Commandments VII to IX', kc:true, h2:'Reclaim your bank account',
  cards:[
   {h3:'Love Money', p:"Money is not unladylike. It's the fuel for the impact you say you want to make.", crim:true},
   {h3:'Command Your Worth', p:'Name the real number and hold it. The flinch is the conditioning, not the truth.', crim:true}],
  sub:'Then invest your assets, time, money, reputation, like a woman building something that outlasts her.'},

 {t:'list', k:'The brand layer', h2:'Turn the identity into a magnetic brand',
  sub:'Once the conditioning is gone, we build the brand that does the selling for you:',
  bullets:[
   {x:'A clear voice, story, and mission people repeat for you.'},
   {x:'A premium, scalable offer that fits who you actually are.'},
   {x:'Content and press that attract clients and cash while you sleep.', crim:true}]},

 {t:'part', k:'Part Three', h:'The woman on the other side of this.'},

 {t:'cards', k:'The transformation', h2:'From playing small to powerhouse',
  cards:[
   {h3:'Month One &middot; Confidence', p:'Release the limiting beliefs, the self-doubt, and the perfectionism. Build your Bad Bitch alter-ego and brand.'},
   {h3:'Month Two &middot; The Boardroom', p:'Master authentic self-promotion, command respect in any room, and align your passion with real profit.'}]},

 {t:'steps', k:'Where it goes', h2:'Your Big Bad Bitch Vision',
  steps:[
   "Name the brainwashing that's been running the show, and retire it.",
   'Rebuild an identity that can self-promote, negotiate, and set boundaries.',
   'Package it into a premium brand and a five-year roadmap you actually want.']},

 {t:'lede', k:'Why me', h2:'I was the ultimate good girl',
  sub:'4x USA National Champion gymnast and Hall of Famer. Yale graduate. Three companies built, one exit. Angel investor and VC. Forbes 30 Under 30. Author of The Bad Bitch Business Bible.',
  lede2:'I spent a decade earning my worth in the most male-dominated rooms there are, then I taught hundreds of women to stop asking permission and build empires of their own.'},

 {t:'cta', k:'Your next step', h:'Ready to be unleashed?',
  sub:'The Bad Bitch Empire Mastermind is a year of mentorship, strategy, and a vetted sisterhood of ambitious women building their empires together. Applications are reviewed on a rolling basis.',
  cta:'Apply to the Bad Bitch Empire Mastermind', href:'https://lisawang.co/mastermind/#application',
  disc:'This masterclass is for education only and is not financial, legal, or business advice. No income or result is guaranteed. Results vary and depend on your own effort, experience, and market.'}
];

function kick(s){return s.k?`<div class="kicker${s.kc?' crim':''}">${s.k}</div>`:''}
function render(s){
 let h=kick(s);
 if(s.t==='title'){
  h+=`<h1>${s.h}</h1><p class="sub">${s.sub}</p><p class="by">${s.by} <span>&nbsp;/&nbsp; ${s.bySpan}</span></p>`;
 } else if(s.t==='part'){
  h+=`<h1>${s.h}</h1><div class="rule"></div>`;
 } else if(s.t==='quote'){
  h=`<p class="quote"><span class="mark">"</span>${s.q}<span class="mark">"</span></p><p class="by" style="margin-top:34px">${s.by}</p>`;
 } else if(s.t==='hook'){
  h+=`<p class="big">${s.big}</p><p class="sub">${s.sub}</p>`;
 } else if(s.t==='lede'){
  if(s.h2)h+=`<h2>${s.h2}</h2>`;
  if(s.lede)h+=`<p class="lede">${s.lede}</p>`;
  if(s.sub)h+=`<p class="sub">${s.sub}</p>`;
  if(s.lede2)h+=`<p class="lede" style="margin-top:22px">${s.lede2}</p>`;
 } else if(s.t==='list'){
  h+=`<h2>${s.h2}</h2>`;
  if(s.sub)h+=`<p class="sub" style="margin-top:0">${s.sub}</p>`;
  h+='<ul>'+s.bullets.map(b=>`<li${b.crim?' class="crim"':''}>${b.x}</li>`).join('')+'</ul>';
 } else if(s.t==='cards'){
  h+=`<h2>${s.h2}</h2>`;
  if(s.lede)h+=`<p class="lede">${s.lede}</p>`;
  h+='<div class="cols">'+s.cards.map(c=>`<div class="card${c.crim?' crim':''}"><h3>${c.h3}</h3><p>${c.p}</p></div>`).join('')+'</div>';
  if(s.sub)h+=`<p class="sub">${s.sub}</p>`;
 } else if(s.t==='steps'){
  h+=`<h2>${s.h2}</h2>`+s.steps.map((p,n)=>`<div class="step"><div class="n">${n+1}</div><p>${p}</p></div>`).join('');
 } else if(s.t==='cta'){
  h+=`<h1>${s.h}</h1><p class="sub">${s.sub}</p><a class="cta-btn" href="${s.href}">${s.cta}</a><p class="disc">${s.disc}</p>`;
 }
 return h;
}

const stage=document.getElementById('stage');
stage.innerHTML=S.map((s,k)=>`<section class="slide${k===0?' on':''}">${render(s)}</section>`).join('');
const slides=[...document.querySelectorAll('.slide')];
let i=0;
document.getElementById('tot').textContent=slides.length;
function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));document.getElementById('pos').textContent=i+1;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
stage.addEventListener('click',()=>show(i+1));
show(0);
</script>
</body>
</html>
