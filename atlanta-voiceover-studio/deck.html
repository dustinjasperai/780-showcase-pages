<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Working Voice Actor — Atlanta Voiceover Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf2ea;      /* warm peach-tinted ground, light tint of their #ea9a72/#e68936, honors site_scheme:light */
    --panel:#fffbf7;   /* warm white panel */
    --rule:#eaddce;    /* warm hairline */
    --ink:#232222;     /* their near-black */
    --muted:#6f6660;
    --accent:#e68936;  /* their dominant orange (ranked #1, 278 uses) */
    --accent-soft:#ea9a72;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Roboto',system-ui,Arial,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:46px 48px;margin:0 0 26px;box-shadow:0 1px 0 rgba(35,34,34,.03)}
  .kicker{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--accent)}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:46px;line-height:1.04;
    letter-spacing:.005em;margin:14px 0 10px}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:31px;line-height:1.1;margin:10px 0 14px}
  p{font-size:18px;line-height:1.6;color:#36302c;margin:0 0 12px;max-width:62ch}
  .lead{font-size:20px}
  .sub{color:var(--muted);font-size:17px}
  ul{list-style:none;margin:10px 0 0}
  li{position:relative;padding:11px 0 11px 30px;font-size:18px;line-height:1.5;
    border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:10px;height:10px;
    border-radius:2px;background:var(--accent)}
  .big{font-family:'Oswald',sans-serif;font-weight:700;font-size:40px;color:var(--accent);line-height:1.05}
  .wave{display:flex;align-items:flex-end;gap:5px;height:40px;margin:4px 0 18px}
  .wave span{width:6px;background:var(--accent-soft);border-radius:3px;opacity:.9}
  .present{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule);
    font-size:16px;color:var(--muted)}
  .cta{background:#2a211c;border-color:#2a211c}
  .cta h1,.cta h2{color:#fff}
  .cta p{color:#e9ded3}
  .cta .kicker{color:var(--accent-soft)}
  .step{font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;color:#fff;
    background:var(--accent);display:inline-block;padding:12px 22px;border-radius:9px;margin:8px 0 18px}
  .disc{font-size:13px;color:#b9ada2;margin-top:18px;line-height:1.5;max-width:70ch}
  .n{font-family:'Oswald',sans-serif;color:var(--accent);font-weight:600;font-size:15px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',
  kicker:'A live masterclass with Atlanta Voiceover Studio',
  h:'The Working Voice Actor',
  sub:'How voice actors go from auditioning to booked, represented, and full-time. The business side nobody teaches first.',
  present:'Presented live by Heidi Rew, co-owner, Atlanta Voiceover Studio. Full-time VO talent and actress; voice of national brands including AutoNation, Redfin, GE, Hallmark, Subway and Belk.'},

 {t:'list',
  kicker:'Who this is for',
  h:'You can read. You are not booking.',
  p:"This hour is for the voice actor who has taken a class or two, maybe cut a demo, and is sitting in front of casting sites wondering why the work is not coming in.",
  list:["You sound good in the booth but the auditions go quiet",
        "You are working part-time and want this to be the whole income",
        "You are not sure what actually moves you from hobby to career"]},

 {t:'quote',
  kicker:'The trap',
  h:'Most people think a great voice is the job.',
  p:"It is the ticket in. It is not the job. The job is a business: auditioning every day, running your own studio, marketing yourself, and being someone an agent and a client want to work with again."},

 {t:'quote',
  kicker:'The reframe',
  h:'The people booking national work are not the best voices in the room.',
  p:"They are the best-run businesses in the room. They train before they sell, they sound like themselves, and they show up like professionals. That is learnable, and it is what this masterclass is about."},

 {t:'part', n:'Part One', h:'Why talent alone stalls'},

 {t:'list',
  kicker:'Part One',
  h:'The road is longer and more honest than anyone tells you.',
  p:"We made a pact when we started: always keep it real and never sugar-coat it. So here is the real version.",
  list:["It took me nearly four years of auditioning before my first booking",
        "The competition is now global and remote, which raises the bar on craft",
        "A good voice with no craft and no business behind it stays a hobby"]},

 {t:'quote',
  kicker:'Part One',
  h:'The most expensive mistake is rushing to a demo.',
  p:"A demo you cut before you are ready just proves you are not ready, to every agent and casting director who hears it. Train first. Produce a demo when a coach tells you you are ready, not before."},

 {t:'part', n:'Part Two', h:'The method we teach'},

 {t:'list',
  kicker:'Pillar 1',
  h:'Train first, demo when ready',
  p:"Craft is a lifetime skill, like acting. We build it in order: foundation intensive, then focused coaching, then a produced demo once the read is actually there.",
  list:["Beginner Voiceover Intensive to build the fundamentals",
        "Private coaching on the genres you are chasing",
        "A fully produced demo only when a coach confirms you are ready"]},

 {t:'list',
  kicker:'Pillar 2',
  h:'Sound like you, not an announcer',
  p:"Modern commercial, e-learning and conversational casting wants a real person, not a voice performing at them. The whole skill is finding your own authentic read and repeating it on cue.",
  list:["Drop the announcer habit most beginners lean on",
        "Find the conversational read clients actually book",
        "Make it repeatable so you can deliver it under direction"]},

 {t:'list',
  kicker:'Pillar 3',
  h:'Build the business behind the voice',
  p:"This is the part that separates part-time from full-time, and the part almost no class covers. You are running a one-person company.",
  list:["A clear personal brand and a website that books you",
        "A presence on the casting sites where the work lives",
        "A marketing habit that keeps auditions and clients coming in"]},

 {t:'list',
  kicker:'Pillar 4',
  h:'Get represented',
  p:"An agent is a business partner, not a lottery ticket. They need to see craft and professionalism before they put their name behind yours.",
  list:["What agents actually listen for on a demo and an audition",
        "How to approach representation without burning the relationship",
        "Being the talent an agent wants to send out again"]},

 {t:'quote',
  kicker:'Pillar 5',
  h:'Keep it real, and keep going',
  p:"The honest road is the one that works. Train, show up every day, treat it like the business it is, and let the bookings compound. That discipline is the whole difference between the people who quit and the people who go full-time."},

 {t:'part', n:'Part Three', h:'Inside the working week'},

 {t:'list',
  kicker:'Part Three',
  h:'A week in the life of a working voice actor',
  p:"When the craft and the business are both in place, the week has a rhythm to it.",
  list:["Auditions recorded and sent from your own home studio, daily",
        "Booked sessions produced to broadcast standard",
        "Marketing and relationships that refill the pipeline while you work"]},

 {t:'list',
  kicker:'Why learn this from us',
  h:'We made this exact jump',
  p:"Heidi and Mike Stoudt both left on-air radio careers to go full-time in voiceover and acting, then opened Atlanta Voiceover Studio because talent kept asking us how.",
  list:["Full-time working VO talent, not retired teachers",
        "National-brand credits: AutoNation, Redfin, GE, Hallmark, Subway, Belk",
        "A real training school, a VO podcast, and a working recording studio in Atlanta"]},

 {t:'list',
  kicker:'The path',
  h:'From here to full-time, in order',
  p:"You do not have to figure out the sequence alone. This is the path we walk students down.",
  list:["Start with the foundations and your authentic read",
        "Add the business: brand, website, casting-site presence, marketing",
        "Produce a demo when you are ready, then pursue representation"]},

 {t:'quote',
  kicker:'Recap',
  h:'Talent gets you in. Craft plus business gets you booked.',
  p:"Train first. Sound like yourself. Run it like the business it is. Get represented. Keep it real and keep going. That is how a voice becomes a career."},

 {t:'cta',
  kicker:'Your next step',
  h:'Let us build your plan',
  p:"One path does not fit all. The next step is a One-on-One VO Business Coaching session: we identify where you are, where you want to be, and the actionable plan to get there.",
  step:'Book a One-on-One VO Business Coaching session at atlantavoiceoverstudio.com',
  disc:'Educational content only. No income, booking, or career result is guaranteed. Results vary and depend on your own effort, practice, and market conditions. Atlanta Voiceover Studio, Atlanta GA.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function wave(){var w=el('div','wave');var hs=[14,26,38,22,32,18,40,24,30,16,36,20];for(var i=0;i<hs.length;i++){var s=document.createElement('span');s.style.height=hs[i]+'px';w.appendChild(s);}return w;}
function render(){
  var d=document.getElementById('deck');
  S.forEach(function(s){
    var slide=el('div','slide'+(s.t==='cta'?' cta':''));
    if(s.t==='part'){
      slide.appendChild(el('div','n',s.n));
      slide.appendChild(wave());
      slide.appendChild(el('h1',null,s.h));
      d.appendChild(slide);return;
    }
    if(s.kicker)slide.appendChild(el('div','kicker',s.kicker));
    if(s.t==='title'){slide.appendChild(el('h1',null,s.h));slide.appendChild(wave());}
    else if(s.t==='cta'){slide.appendChild(el('h1',null,s.h));}
    else {slide.appendChild(el('h2',null,s.h));}
    if(s.sub)slide.appendChild(el('p','lead sub',s.sub));
    if(s.p)slide.appendChild(el('p','lead',s.p));
    if(s.list){var ul=el('ul');s.list.forEach(function(li){ul.appendChild(el('li',null,li));});slide.appendChild(ul);}
    if(s.step)slide.appendChild(el('div','step',s.step));
    if(s.present)slide.appendChild(el('div','present',s.present));
    if(s.disc)slide.appendChild(el('div','disc',s.disc));
    d.appendChild(slide);
  });
}
render();
</script>
</body>
</html>
