<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How HR Becomes the Business: a masterclass by Anna Golovchenko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#232323;
    --panel:#313131;
    --rule:#3d3d3d;
    --accent:#ffed00;
    --ink:#f4f4f2;
    --muted:#b7b7b2;
    --display:'Open Sans', system-ui, sans-serif;
    --serif:'Lora', Georgia, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--serif)}
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 56px;
    margin:0 0 26px;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide::before{
    content:attr(data-n);
    position:absolute;top:20px;right:26px;
    font-family:var(--display);font-weight:700;font-size:13px;
    color:var(--muted);letter-spacing:.14em;
  }
  .kicker{
    font-family:var(--display);font-weight:700;
    text-transform:uppercase;letter-spacing:.18em;font-size:13px;
    color:var(--accent);margin-bottom:18px;
  }
  h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:800;font-size:36px;line-height:1.1;letter-spacing:-.01em}
  h3{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.2;margin-bottom:10px}
  p{font-size:21px;line-height:1.5;color:var(--ink);max-width:44ch}
  p.lead{font-size:24px;color:var(--ink)}
  p.muted{color:var(--muted)}
  .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.12;letter-spacing:-.01em}
  .sub{margin-top:18px;font-size:20px;color:var(--muted);max-width:52ch}
  ul{list-style:none;margin-top:22px;display:grid;gap:16px}
  li{position:relative;padding-left:30px;font-size:21px;line-height:1.45;max-width:52ch}
  li::before{content:'';position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:3px}
  .pillar{border-left:4px solid var(--accent);padding-left:22px}
  .quote{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.4;max-width:40ch}
  .cite{margin-top:20px;font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);letter-spacing:.04em}
  .stat{font-family:var(--display);font-weight:800;font-size:58px;color:var(--accent);line-height:1}
  .row{display:flex;gap:40px;flex-wrap:wrap;margin-top:26px}
  .row>div{flex:1;min-width:180px}
  .foot{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);letter-spacing:.06em;margin-top:28px}
  .disc{margin-top:26px;font-family:var(--display);font-size:13px;line-height:1.5;color:var(--muted);max-width:60ch}
  .cta{font-family:var(--display);font-weight:800;font-size:22px;color:var(--bg);background:var(--accent);display:inline-block;padding:16px 30px;border-radius:10px;margin-top:26px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A live masterclass for HR leaders',
   h1:'How HR Becomes the Business',
   sub:'The practitioner’s path from support function to the room where decisions get made.',
   foot:'Anna Golovchenko · Founder, People First Club'},

  {t:'audience',
   kicker:'Who this is for',
   h2:'HR people who are done being invited last',
   body:'People Partners, HR managers, recruiters, sourcers and L&D leads who carry the culture of the company and still have to fight to be in the strategy conversation.',
   list:['You own hiring, retention and culture','You can feel the business decisions happening without you','You want the seat, not just the workload']},

  {t:'trap',
   kicker:'The trap',
   big:'You do the work that keeps the company human, and you are still the last to hear about the pivot.',
   sub:'It is not that leadership does not value people. It is that HR is spoken about, not spoken with.'},

  {t:'reframe',
   kicker:'The real problem',
   big:'HR is taught as a checklist. The business is run in a different language.',
   sub:'Policies, onboarding flows and engagement surveys are real work. They are also invisible to a CFO who thinks in cost, risk and growth. The gap is not effort. It is fluency.'},

  {t:'part',
   kicker:'Part one',
   h2:'Why capable HR stays invisible'},

  {t:'content',
   h3:'Three walls that keep good HR people stuck',
   list:[
     'Reactive by default: the day fills with tickets, fires and requests, so the strategic work never gets a calendar slot.',
     'No shared language: you talk in engagement and culture, the board talks in margin and headcount cost.',
     'Learning in isolation: a certificate teaches the theory, but nobody shows you how it actually landed in a real company last quarter.']},

  {t:'part',
   kicker:'Part two',
   h2:'The practitioner’s path'},

  {t:'pillar',
   kicker:'Pillar 1',
   h3:'Speak the language of money',
   body:'Total rewards, compensation logic and salary benchmarks so you can defend a number, model a raise budget and talk cost the way finance does. When HR can price a decision, HR gets consulted before it is made.'},

  {t:'pillar',
   kicker:'Pillar 2',
   h3:'Own the culture as a lever',
   body:'Employer brand and culture treated as a growth and retention instrument, not a poster in the kitchen. What you signal in hiring and onboarding becomes what the company can actually deliver.'},

  {t:'pillar',
   kicker:'Pillar 3',
   h3:'Decide with data',
   body:'People analytics and HR data so your recommendations arrive with evidence attached. Attrition, time to hire and performance stop being anecdotes and start being a case.'},

  {t:'pillar',
   kicker:'Pillar 4',
   h3:'Handle the hard rooms',
   body:'Conflict, feedback and performance conversations done with a real method, so the moments that usually cost you trust become the ones that build it. This is where HR is either respected or quietly worked around.'},

  {t:'accel',
   kicker:'The accelerator',
   big:'You do not learn this from a PDF. You learn it from people who did it last week.',
   sub:'Every pillar moves faster when you watch a working practitioner walk through the real version, then ask them what broke and how they fixed it.'},

  {t:'content',
   h3:'Live practitioner learning beats a self-paced certificate',
   list:[
     'The example is current, not a case study from five years ago.',
     'You can ask the awkward follow-up in the room.',
     'You build a network of peers who answer your Monday-morning question by Monday afternoon.']},

  {t:'part',
   kicker:'Part three',
   h2:'Your first 90 days as a business-fluent HR lead'},

  {t:'content',
   h3:'A practitioner’s first quarter on the path',
   list:[
     'Weeks 1 to 4: you can put a defensible number and a business reason behind one people decision.',
     'Weeks 5 to 8: you bring data, not opinion, to a leadership conversation and it changes the call.',
     'Weeks 9 to 12: you are consulted before a reorg or a hire, not after. The seat is yours.']},

  {t:'why',
   kicker:'Why learn it here',
   h2:'Built by practitioners, for practitioners',
   row:[
     {stat:'570+', label:'HR, recruiting and L&D members'},
     {stat:'450+', label:'recorded live practitioner sessions'},
     {stat:'10+', label:'live events every month'}],
   body:'People First Club is the largest professional community of HR, recruiters, sourcers, L&D and leaders in the region. The path above is not theory here. It is what members practise together every week.'},

  {t:'proof',
   quote:'After three months in People First Club I can say this was a very successful professional decision. Lots of truly valuable information, great webinars with practitioners from different companies, and new professional connections.',
   cite:'People First Club member'},

  {t:'recap',
   kicker:'The path, in one line',
   big:'Speak the money. Own the culture. Decide with data. Handle the hard rooms. And learn it live, next to people who already have.',
   sub:'That is how HR stops being a support function and becomes the business.'},

  {t:'cta',
   kicker:'Your next step',
   h2:'Join the practitioners',
   body:'Come practise the path with 570+ HR leaders inside People First Club. Live events, a full practitioner library, and the peers who make you better every week.',
   cta:'Join People First Club',
   disc:'This masterclass is for educational purposes only. It shares professional development approaches, not guaranteed outcomes. Career and business results vary by person, company and context.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  el.setAttribute('data-n', String(i+1).padStart(2,'0') + ' / ' + S.length);
  let h = '';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.h3) h += '<h3>'+s.h3+'</h3>';
  if(s.big) h += '<p class="big">'+s.big+'</p>';
  if(s.quote) h += '<p class="quote">“'+s.quote+'”</p>';
  if(s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if(s.body) h += '<p>'+s.body+'</p>';
  if(s.row){h += '<div class="row">'+s.row.map(r=>'<div><div class="stat">'+r.stat+'</div><p class="muted">'+r.label+'</p></div>').join('')+'</div>';}
  if(s.list){h += '<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  if(s.sub) h += '<p class="sub">'+s.sub+'</p>';
  if(s.cta) h += '<a class="cta" href="https://peoplefirst.club/">'+s.cta+'</a>';
  if(s.cite) h += '<div class="cite">'+s.cite+'</div>';
  if(s.foot) h += '<div class="foot">'+s.foot+'</div>';
  if(s.disc) h += '<div class="disc">'+s.disc+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
