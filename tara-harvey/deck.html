<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facilitating Intercultural Learning — A Masterclass with Tara Harvey, Ph.D.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8edf4;
    --panel: #fcfdff;
    --ink: #1b2430;
    --muted: #5a6472;
    --rule: #ccd6e2;
    --accent: #002e5e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #stage { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 5vh 4vw; }
  .slide {
    width: 100%; max-width: 1000px; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 14px;
    box-shadow: 0 30px 70px rgba(0,46,94,.10), 0 4px 14px rgba(0,46,94,.06);
    padding: 64px 72px; min-height: 60vh; position: relative;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kicker { font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .20em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  h1 { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 46px; line-height: 1.12; letter-spacing: -.01em; color: var(--ink); }
  h2 { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 34px; line-height: 1.16; color: var(--ink); }
  .lede { font-size: 22px; line-height: 1.5; color: var(--muted); margin-top: 22px; max-width: 42ch; }
  .big { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 40px; line-height: 1.22; color: var(--ink); }
  .big .hl { color: var(--accent); }
  ul { list-style: none; margin-top: 30px; display: flex; flex-direction: column; gap: 18px; }
  li { font-size: 21px; line-height: 1.45; color: var(--ink); padding-left: 38px; position: relative; max-width: 54ch; }
  li::before { content: ''; position: absolute; left: 0; top: 11px; width: 16px; height: 16px; border-radius: 4px; border: 2.5px solid var(--accent); }
  li.plain::before { display: none; }
  li.plain { padding-left: 0; color: var(--muted); font-size: 19px; }
  .phasenum { font-family: 'Poppins', sans-serif; font-size: 72px; font-weight: 700; color: var(--accent); opacity: .18; line-height: 1; }
  .pathrow { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
  .pill { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 100px; padding: 9px 18px; }
  .pill.on { background: var(--accent); color: #fff; }
  .who { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
  .credit { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 600; color: var(--accent); margin-top: 30px; }
  .sub { font-size: 18px; color: var(--muted); margin-top: 8px; }
  .disclaimer { font-size: 14px; line-height: 1.5; color: var(--muted); margin-top: 28px; max-width: 60ch; }
  .cta-step { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 600; color: var(--accent); margin-top: 22px; }
  .foot { position: absolute; bottom: 26px; left: 72px; right: 72px; display: flex; justify-content: space-between; font-family: 'Poppins', sans-serif; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
  #nav { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; font-family: 'Poppins', sans-serif; font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--rule); border-radius: 100px; padding: 8px 18px; }
  #nav button { font: inherit; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 600; }
  @media (max-width: 640px) { .slide { padding: 40px 28px; } h1 { font-size: 32px; } h2 { font-size: 26px; } .big { font-size: 28px; } .foot { left: 28px; right: 28px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">Prev</button><span id="count"></span><button id="next">Next</button></div>
<script>
const S = [
  {t:'title', kicker:'A Live Masterclass for Higher-Ed Educators',
    headline:'Facilitating Intercultural Learning',
    lede:'The Four-Phase Path for building intercultural competence on your campus.',
    credit:'With Tara Harvey, Ph.D. · True North Intercultural' },

  {t:'promise', kicker:'What you will leave with',
    headline:'One hour, three things you can use Monday',
    bullets:[
      'A clear way to explain what intercultural competence is, and is not.',
      'A framework for fostering it in yourself, your students, and your colleagues.',
      'The one thing your institution should focus on first.'] },

  {t:'who', kicker:'Who this is for',
    headline:'Educators carrying the intercultural mandate',
    bullets:[
      'Faculty and staff working with students at home or abroad.',
      'International-education and study-abroad professionals.',
      'Anyone asked to deliver on a diversity, inclusion, or global-citizenship mission.'] },

  {t:'trap', kicker:'The trap',
    big:'You were handed the <span class="hl">intercultural mandate</span>, and no map.',
    sub:'A mission statement says build global citizens. Nobody shows you how a person actually gets there.' },

  {t:'reframe', kicker:'The reframe',
    big:'Intercultural competence is not content to deliver. It is a <span class="hl">developmental process</span> to facilitate.',
    sub:'This single shift is why most one-off trainings fade by the next term.' },

  {t:'part', kicker:'Part One', headline:'Why information alone does not change anyone' },

  {t:'problem', kicker:'The core problem',
    headline:'We teach about cultures. Growth happens somewhere else.',
    bullets:[
      'Facts about customs do not move someone along a developmental path.',
      'Development is staged: you cannot skip to bridging before self-awareness.',
      'The educator has to know how to facilitate the process, not just present it.'] },

  {t:'part', kicker:'Part Two', headline:'The Four-Phase Framework for Intercultural Learning' },

  {t:'phase', kicker:'Phase I', num:'I', headline:'Meaning-Making and Self-Awareness',
    lede:'It starts with the educator and the learner seeing their own cultural lens before judging anyone else’s.' },

  {t:'phase', kicker:'Phase II', num:'II', headline:'Cultural Differences that Make a Difference',
    lede:'Not every difference matters equally. You learn to find the ones that actually shape interaction.' },

  {t:'phase', kicker:'Phase III', num:'III', headline:'Engaging Mindfully Across Difference',
    lede:'Noticing judgment, managing emotion, and staying present so you respond from your values, not reflex.' },

  {t:'phase', kicker:'Phase IV', num:'IV', headline:'Bridging Across Differences',
    lede:'Adapting behavior to connect, without losing yourself. This is where competence becomes visible.' },

  {t:'recap', kicker:'The path at a glance',
    headline:'A sequence, not a single session',
    pills:['I Self-Awareness','II Differences that Matter','III Engaging Mindfully','IV Bridging'] },

  {t:'principle', kicker:'The educator-first principle',
    big:'You cannot guide a process you have not <span class="hl">walked yourself</span>.',
    sub:'The Transformative Intercultural Educator starts with their own development, then facilitates others.' },

  {t:'mindful', kicker:'The engine underneath',
    headline:'Personal Leadership: two principles, six practices',
    bullets:[
      'A mindfulness-based practice for staying grounded across difference.',
      'It is how Phase III stops being a slogan and becomes a habit.',
      'You practice it on yourself first, then model it for students.'] },

  {t:'challenge', kicker:'The facilitation dial',
    headline:'Challenge and Support',
    bullets:[
      'Too much challenge and a learner shuts down.',
      'Too much comfort and nothing grows.',
      'Facilitation is calibrating that dial on purpose, person by person.'] },

  {t:'part', kicker:'Part Three', headline:'Putting the phases to work on your campus' },

  {t:'apply', kicker:'Where to start',
    headline:'Begin with your own people, not a new program',
    bullets:[
      'Build a small group of educators who have walked the phases themselves.',
      'Give them a shared language and the framework, not just a workshop.',
      'Let intercultural work spread through modeling, not mandates.'] },

  {t:'whyme', kicker:'Why learn this from me',
    headline:'Tara Harvey, Ph.D.',
    bullets:[
      'Ph.D. in Comparative and International Development Education.',
      'Former Academic Director of Intercultural Learning at CIEE, across 20+ study-abroad centers.',
      'Qualified Administrator for the IDI and Senior Facilitator of Personal Leadership.',
      '20+ years helping educators facilitate intercultural learning.'] },

  {t:'cta', kicker:'Your next step',
    headline:'Go deeper in the cohort',
    step:'Join the next Facilitating Intercultural Learning cohort at True North Intercultural.',
    sub:'A guided program with the framework, the IDI assessment, coaching, and a community of educators.',
    disclaimer:'This masterclass is educational. No specific outcome or result is guaranteed. Results vary by individual, institution, and effort.' }
];

const stage = document.getElementById('stage');
let i = 0;
function foot(idx){ return '<div class="foot"><span>True North Intercultural</span><span>'+(idx+1)+' / '+S.length+'</span></div>'; }
function render(){
  const s = S[i];
  let inner = '';
  if (s.kicker) inner += '<div class="kicker">'+s.kicker+'</div>';
  if (s.t === 'title') {
    inner += '<h1>'+s.headline+'</h1>'+(s.lede?'<p class="lede">'+s.lede+'</p>':'')+(s.credit?'<div class="credit">'+s.credit+'</div>':'');
  } else if (s.t === 'trap' || s.t === 'reframe' || s.t === 'principle') {
    inner += '<p class="big">'+s.big+'</p>'+(s.sub?'<p class="sub">'+s.sub+'</p>':'');
  } else if (s.t === 'phase') {
    inner += '<div class="phasenum">'+s.num+'</div><h2>'+s.headline+'</h2>'+(s.lede?'<p class="lede">'+s.lede+'</p>':'');
  } else if (s.t === 'recap') {
    inner += '<h2>'+s.headline+'</h2><div class="pathrow">'+s.pills.map((p,n)=>'<span class="pill'+(n===0?' on':'')+'">'+p+'</span>').join('')+'</div>';
  } else if (s.t === 'part') {
    inner += '<h1>'+s.headline+'</h1>';
  } else if (s.t === 'cta') {
    inner += '<h1>'+s.headline+'</h1><div class="cta-step">'+s.step+'</div>'+(s.sub?'<p class="sub">'+s.sub+'</p>':'')+'<p class="disclaimer">'+s.disclaimer+'</p>';
  } else {
    inner += '<h2>'+s.headline+'</h2>';
    if (s.lede) inner += '<p class="lede">'+s.lede+'</p>';
    if (s.bullets) inner += '<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>';
  }
  inner += foot(i);
  stage.innerHTML = '<div class="slide">'+inner+'</div>';
  document.getElementById('count').textContent = (i+1)+' / '+S.length;
}
function go(d){ i = Math.max(0, Math.min(S.length-1, i+d)); render(); }
document.getElementById('prev').onclick = ()=>go(-1);
document.getElementById('next').onclick = ()=>go(1);
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); });
render();
</script>
</body>
</html>
