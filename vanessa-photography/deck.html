<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Profit Architecture - Vanessa Joy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#231f20;        /* Breathe Your Passion dominant ground */
    --panel:#2b2726;     /* lifted warm charcoal */
    --rule:#8a8480;      /* warm neutral gray */
    --ink:#f4f1ec;       /* warm off-white text */
    --muted:#c3bdb4;     /* muted warm gray text */
    --accent:#549bb5;    /* Breathe Your Passion brand accent, slate-teal */
    --serif:'Newsreader',Georgia,serif;
    --sans:'Manrope',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid rgba(138,132,128,.22);border-radius:14px;
    padding:60px 64px;margin:0 0 26px;min-height:470px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);opacity:.9}
  .kicker{font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:500;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.12;margin-bottom:18px}
  .sub{font-family:var(--serif);font-style:italic;font-size:23px;color:var(--muted);margin-top:22px;line-height:1.4}
  p.body{font-size:19px;line-height:1.6;color:var(--muted);margin-top:16px;max-width:42em}
  ul{margin:22px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:14px 0 14px 34px;position:relative;
    border-top:1px solid rgba(138,132,128,.18)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  li b{font-weight:700;color:var(--ink)}
  .big{font-family:var(--serif);font-size:72px;font-weight:600;color:var(--accent);line-height:1}
  .lever{font-family:var(--sans);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.04em}
  .foot{position:absolute;right:28px;bottom:22px;font-size:12px;color:var(--rule);letter-spacing:.08em}
  .disclaimer{font-size:13px;color:var(--rule);margin-top:26px;line-height:1.5;max-width:46em;font-family:var(--sans)}
  .cta-line{font-size:22px;color:var(--ink);margin-top:18px;line-height:1.5}
  .brandline{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:18px;margin-top:14px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'A Masterclass with Vanessa Joy',h:'The Profit Architecture',
   sub:'How already-booked wedding photographers earn $1,000 to $6,000+ more per wedding, without adding a single new lead.'},

  {t:'who',kicker:'Who this is for',h:'You already book. That was never the problem.',
   body:'This is for the established wedding photographer who is booking consistently, delivering work couples love, and still looking at the bank account thinking this cannot be it. You do not need more weddings on the calendar. You need more income from the ones already on it.'},

  {t:'trap',kicker:'The trap',h:'You were taught photography. You were never taught business.',
   body:'So when income feels tight, the instinct is to chase more: more inquiries, more posting, more weddings, more hours. You add water to a bucket that is leaking out the bottom. You get busier and no richer.'},

  {t:'reframe',kicker:'The reframe',h:'You do not have a booking problem. You have a margin problem.',
   sub:'Talent is not what determines your income. Structure determines your income.'},

  {t:'part',kicker:'Part One',h:'The leaky bucket',
   body:'Before we talk about getting a single new lead, we fix where the money is leaking out of the weddings you already have. There are three leaks, and they are all in the same room: the consultation and what happens after it.'},

  {t:'list',kicker:'The three leaks',h:'Where the money actually goes',
   bullets:[
    '<b>The pricing leak.</b> You raised your prices last year and still feel weird saying the number out loud, so you discount, bundle, or flinch in the room.',
    '<b>The consult leak.</b> Great inquiry calls that end in "we will get back to you," because nobody taught you how to lead a consultation.',
    '<b>The album leak.</b> You deliver beautiful galleries and leave $1,000 to $6,000 per wedding on the table because there was never a sales system behind them.']},

  {t:'part',kicker:'Part Two',h:'Profit Architecture',
   body:'When five things are engineered correctly, profit expands. And when profit expands, capacity expands: capacity to work fewer weddings, to stop panicking when inquiries dip, to lead. These are the five levers.'},

  {t:'levers',kicker:'The five levers',h:'The structure that sets your income',
   bullets:[
    '<span class="lever">01 POSITIONING</span> &nbsp;Why couples choose you before price ever comes up.',
    '<span class="lever">02 PRICING</span> &nbsp;A structure that makes the higher package the obvious, natural choice.',
    '<span class="lever">03 CONSULTING LEADERSHIP</span> &nbsp;Leading the room so couples upgrade themselves.',
    '<span class="lever">04 BACKEND SYSTEMS</span> &nbsp;Albums and add-ons that run after the wedding, every time.',
    '<span class="lever">05 EXPANSION</span> &nbsp;Growing profit per client instead of hours on the calendar.']},

  {t:'lever',kicker:'Lever 02 - Pricing',h:'Price so the upgrade is the easy yes',
   body:'The pricing psychology that makes couples naturally choose higher packages, without you pushing, justifying, or feeling salesy. Add-ons stop feeling like an ask and start feeling like the obvious next step, so clients suggest the upgrade before you ever bring it up.'},

  {t:'lever',kicker:'Lever 03 - Consulting Leadership',h:'Lead the consult. Close the upgrade.',
   body:'A word-for-word consultation framework so you walk into every meeting knowing exactly what to say. You stop improvising and start leading, positioned as the guide to the couples best photography outcome, not a vendor pushing extras. Confidence is a side effect, not the goal.'},

  {t:'lever',kicker:'Lever 04 - Backend Systems',h:'The album design session',
   body:'The after-the-wedding sales system that adds $1,000 to $6,000+ in revenue per wedding, from clients you already have, even if you have never run a proper album session before. One sale using this can be worth more than a whole new booking.'},

  {t:'stat',kicker:'The math nobody shows you',big:'$7,597',
   sub:'the difference, per wedding, between photographers charging the same and earning $30K to $50K more a year.',
   body:'It is not talent. It is the single difference in how they run the room where revenue is decided.'},

  {t:'part',kicker:'Part Three',h:'What changes',
   body:'When the bucket stops leaking, the pressure comes off the calendar. You raise prices and still book. You earn more from the weddings you already have. You build a business that pays you, not one that just keeps you busy.'},

  {t:'list',kicker:'Life on the other side',h:'Capacity expands',
   bullets:[
    '<b>Fewer weddings, more profit.</b> Margin per client replaces volume as the growth engine.',
    '<b>No panic when inquiries dip.</b> Your income is built on structure, not on a full calendar.',
    '<b>You lead the room.</b> Pricing conversations feel like guidance, not a pitch.']},

  {t:'why',kicker:'Why listen to me',h:'Vanessa Joy',
   bullets:[
    '25+ years actively shooting weddings, portraits, and commercial work.',
    'One of only five wedding photographers in the country named a Canon Explorer of Light.',
    'Four-time published author and a PPA Grand Imaging Award winner.',
    'Taught 5,500+ photographers how to run businesses that pay them.'],
   brand:'I am not here to motivate you. I am here to upgrade how you operate.'},

  {t:'recap',kicker:'The whole idea in one line',h:'Structure determines income.',
   sub:'Fix the margin in the weddings you already have, before you chase a single new lead.'},

  {t:'cta',kicker:'Your next step',h:'Build your Profit Architecture',
   ctaline:'The Photo Insiders Mastermind is where photographers engineer all five levers with Vanessa and her coaches. It is a complete business overhaul for established wedding photographers who are booking but burning out.',
   sub:'Apply at breatheyourpassion.com to see if it is the right fit.',
   disclaimer:'Educational content only. Examples and figures shared are illustrations of what is possible, not a promise of results. Individual outcomes vary and depend on your market, pricing, and effort. Nothing here is a guarantee of income.'}
];

const d=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.h) h+= (s.t==='title'?`<h1>${s.h}</h1>`:`<h2>${s.h}</h2>`);
  if(s.big) h+=`<div class="big">${s.big}</div>`;
  if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
  if(s.body) h+=`<p class="body">${s.body}</p>`;
  if(s.ctaline) h+=`<div class="cta-line">${s.ctaline}</div>`;
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+=`<li>${b}</li>`);h+='</ul>';}
  if(s.brand) h+=`<div class="brandline">${s.brand}</div>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  h+=`<div class="foot">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=h;d.appendChild(el);
});
</script>
</body>
</html>
