<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy or Build | Blake Dailey · Hotel Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#161e2a; --panel:#202b3a; --rule:#313e50;
    --ink:#f3f1ea; --ink-soft:#c7ccd4; --ink-muted:#8b94a2;
    --accent:#a8fff0; --blue:#529bd1;
  }
  html,body{height:100%;}
  body{font-family:'Raleway',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .deck{max-width:960px;margin:0 auto;padding:40px 24px 120px;}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 54px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,0.12);}
  .slide.title{background:linear-gradient(135deg,#1b2635,#121a26);border-color:var(--accent);}
  .slide.title .sub{color:var(--accent);}
  .slide.cta{background:linear-gradient(135deg,#1b2635,#121a26);border-color:var(--accent);}
  .k{font-family:'Karla',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
  h1{font-family:'Karla',sans-serif;font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-0.01em;margin-bottom:18px;}
  h2{font-family:'Karla',sans-serif;font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-0.01em;margin-bottom:18px;}
  .sub{font-size:21px;color:var(--ink-muted);line-height:1.5;}
  p{font-size:20px;line-height:1.6;color:var(--ink-soft);margin-bottom:14px;max-width:46ch;}
  ul{list-style:none;margin:10px 0 0;}
  li{font-size:19px;line-height:1.5;color:var(--ink-soft);padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:52ch;}
  li:last-child{border-bottom:none;}
  li::before{content:"";position:absolute;left:0;top:21px;width:12px;height:2px;background:var(--accent);}
  .big{font-size:30px;line-height:1.3;color:var(--ink);font-family:'Karla',sans-serif;font-weight:600;max-width:40ch;}
  .stat-row{display:flex;flex-wrap:wrap;gap:34px;margin-top:10px;}
  .stat .n{font-family:'Karla',sans-serif;font-weight:700;font-size:40px;color:var(--accent);}
  .stat .l{font-size:15px;color:var(--ink-muted);margin-top:4px;max-width:18ch;}
  .cta .big{color:#f6f4ef;}
  .disc{font-size:13px;color:var(--ink-muted);margin-top:28px;max-width:60ch;line-height:1.5;}
  .cta .disc{color:#9fb0c4;}
  .num{font-family:'Karla',sans-serif;font-size:12px;color:var(--ink-muted);text-align:right;margin-top:26px;letter-spacing:0.08em;}
  .cta .num{color:#9fb0c4;}
  @media(max-width:640px){.slide{padding:38px 26px;min-height:0;}h1{font-size:36px;}h2{font-size:26px;}p,.sub{font-size:17px;}.big{font-size:22px;}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:"title", cls:"title", k:"A live masterclass · Hotel Launch", h:"Buy or Build", sub:"The operator's path to your first boutique hotel. With Blake Dailey."},
  {t:"promise", k:"What you'll leave with", h:"A decision, not more notes.", p:["By the end of this hour you'll know whether your next move is to buy an existing boutique hotel or build one, and you'll have the start of a 90-day plan for your own situation."]},
  {t:"who", k:"Who this is for", h:"The operator who feels the ceiling.", p:["You already run 10 or more short-term rentals, or more than half a million in revenue. You're good at this. And it's taking more of your life every month, not less."]},
  {t:"trap", k:"The trap", h:"More doors is not more freedom.", big:"Every new Airbnb is another cleaner, another listing, another set of fires. Scaling the model you have just scales the chaos."},
  {t:"reframe", k:"The reframe", h:"The problem was never the count.", p:["It was the model. Ten scattered doors ask for ten of everything. One roof asks for one. That single shift is what this hour is about."]},
  {t:"p1", k:"Part one · the core problem", h:"Scattered doors vs one roof.", list:["Ten units: ten P&Ls, ten turnovers, ten relationships","One boutique hotel: one team, one system, one set of books","Same guest demand, a fraction of the moving parts","The asset is bigger, so the systems finally pay for themselves"]},
  {t:"math", k:"The boutique-hotel math", h:"One roof changes the economics.", big:"A single property with rooms, events, food and beverage earns in ways a scattered portfolio can't, and it's financeable as one deal."},
  {t:"fork", k:"Part two · the fork", h:"Every scaling operator hits it.", p:["There are two real paths into your first hotel. Most coaching only teaches one. We'll walk both, because the right answer depends on your capital, your market, and your timeline."]},
  {t:"buy", k:"The buy side", h:"Crystal Clear Criteria.", list:["Your target market and the ADR floor that makes it work","The unit count that actually pencils for you","Zoning research that tells you what's even allowed","Capital or partners lined up before you offer","A deal funnel that brings you deals to analyze"]},
  {t:"underwrite", k:"The buy side", h:"Underwrite it like an operator.", p:["Take a broker's offering memorandum into a spreadsheet and underwrite it line by line. Find real ADR and occupancy projections from actual data, not the broker's story, and build a pro forma you'd defend to a lender."]},
  {t:"build1", k:"The build side", h:"What nobody shows you.", list:["Site plans, permits, and what a general-contractor bid really looks like","How the build gets sequenced so several things move at once","Where the budget goes when the site plan changes","Taught from a property going up right now, not a slideshow"]},
  {t:"build2", k:"The build side", h:"Opening the books.", p:["The real build costs, what a finished property earns, what it costs to run, and where the money comes from beyond renting rooms, which is the part most operators never see in public."]},
  {t:"choose", k:"Choosing your path", h:"Buy or build, side by side.", big:"We hold both paths against your capital, your market, and your timeline, and you build the buy-box that fits your situation."},
  {t:"finance", k:"Funding the deal", h:"When the bank says no.", list:["Seller carry and how to structure it","Bringing in capital partners the right way","Creative structures that close deals banks pass on","How operators have closed deals with little of their own cash in"]},
  {t:"ops", k:"Operations at scale", h:"The Boutique Hotel Blueprint.", p:["The standard operating procedures, systems, and team structure that let one operator run a multi-property portfolio without living on site. The point of scale is to get your time back, so the systems come first, not last."]},
  {t:"why", k:"Why listen to me", h:"Everything here, I'm doing now.", stats:[{n:"$30M+",l:"portfolio operated today"},{n:"8",l:"boutique hotels"},{n:"200+",l:"units across markets"},{n:"40+",l:"deals closed by our operators"}], p:["It started with one Airbnb bought while I was still active-duty Air Force. The build side I teach is happening on my own sites right now."]},
  {t:"look", k:"What you walk out with", h:"You leave with a plan.", list:["Your buy-box, written down","A shortlist of markets that fit it","A funding path you can actually run","A 90-day set of next steps on your own situation"]},
  {t:"recap", k:"The recap", h:"The model, then the deal.", p:["Change the model from scattered doors to one roof. Pick your path, buy or build. Underwrite it like an operator, fund it creatively, and run it on systems. That's the whole arc."]},
  {t:"cta", cls:"cta", k:"Your next step", h:"Ready to go deeper?", big:"If you're an operator ready to act, apply to join Hotel Launch Altitude and get the coaching, the systems, and the room of people already doing this.", disc:"This masterclass is educational. Nothing here is investment, legal, tax, or financial advice. Real estate and hotel investing carry risk, including the risk of loss. No income, role, or result is guaranteed, and results vary by operator, market, and effort."}
];
const deck=document.getElementById("deck");
S.forEach(function(s,i){
  const el=document.createElement("section");
  el.className="slide"+(s.cls?" "+s.cls:"");
  let h="";
  if(s.k)h+='<div class="k">'+s.k+'</div>';
  if(s.t==="title"){h+='<h1>'+s.h+'</h1>';}else{h+='<h2>'+s.h+'</h2>';}
  if(s.sub)h+='<div class="sub">'+s.sub+'</div>';
  if(s.big)h+='<div class="big">'+s.big+'</div>';
  if(s.p)s.p.forEach(function(x){h+='<p>'+x+'</p>';});
  if(s.stats){h+='<div class="stat-row">';s.stats.forEach(function(st){h+='<div class="stat"><div class="n">'+st.n+'</div><div class="l">'+st.l+'</div></div>';});h+='</div>';}
  if(s.list){h+='<ul>';s.list.forEach(function(x){h+='<li>'+x+'</li>';});h+='</ul>';}
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
