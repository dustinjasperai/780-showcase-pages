<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Multidimensional Success Masterclass — Lisa Michaud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f5;        /* warm off-white ground, from brand light surfaces */
    --panel:#ffffff;
    --panel2:#f4eeec;
    --rule:#e7dcd8;
    --ink:#1f1f1f;        /* her near-black text */
    --muted:#808184;      /* her dominant steel grey */
    --accent:#f48a94;     /* her signature coral-pink H1 color */
    --accent-deep:#d96b78;
    --display:'Jost', system-ui, sans-serif;     /* futura-pt analog */
    --body:'Zilla Slab', Georgia, serif;         /* clarendon-text-pro analog */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 52px;margin:22px 0;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 30px rgba(31,31,31,0.04);position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent-deep);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,56px);line-height:1.04;letter-spacing:-0.01em}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.6vw,40px);line-height:1.1;letter-spacing:-0.01em}
  .lead{font-size:clamp(19px,2.3vw,24px);color:var(--ink);margin-top:20px;max-width:34ch}
  .sub{font-size:18px;color:var(--muted);margin-top:16px;max-width:46ch}
  .big{font-family:var(--display);font-weight:700;font-size:clamp(40px,6vw,72px);line-height:1.0;letter-spacing:-0.02em}
  .accent{color:var(--accent-deep)}
  .part-label{font-family:var(--display);font-weight:500;color:var(--muted);font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
  .grid8{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:26px}
  .ing{background:var(--panel2);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
  .ing .n{font-family:var(--display);font-weight:700;color:var(--accent-deep);font-size:14px;letter-spacing:.08em}
  .ing .t{font-family:var(--display);font-weight:500;font-size:18px;margin-top:4px}
  .steps{display:grid;gap:16px;margin-top:24px}
  .step{display:flex;gap:18px;align-items:flex-start}
  .step .dot{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;
    font-family:var(--display);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
  .step .b{font-size:19px}
  .step .b b{font-family:var(--display);font-weight:600}
  .meta{font-family:var(--display);font-size:14px;color:var(--muted);margin-top:18px;letter-spacing:.04em}
  .cta-card{background:linear-gradient(160deg,#fff 0%,var(--panel2) 100%)}
  .cta-steps{display:grid;gap:10px;margin-top:20px}
  .cta-steps div{font-size:19px}
  .quietnum{font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent-deep);letter-spacing:.1em}
  .disclaimer{font-family:var(--display);font-size:12.5px;color:var(--muted);margin-top:30px;max-width:60ch;line-height:1.55}
  .kicker{font-size:20px;color:var(--ink);margin-top:18px;max-width:42ch}
  @media(max-width:620px){.slide{padding:38px 26px}.grid8{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'Goalden Girls presents a live masterclass',
    h:'The Multidimensional Success Masterclass',
    lead:'The 8 ingredients of a life you actually love.',
    meta:'Live, 60 minutes, with Lisa Michaud'},
  {t:'who', eyebrow:'Who this is for', h:'For the woman who did everything right.',
    sub:'You got the grades, the degree, the good job. You worked hard and you moved up. You are capable, respected, and quietly wondering if this is really it.'},
  {t:'text', eyebrow:'The trap', h:'You hit the goals. The feeling never came.',
    sub:'Every milestone was supposed to be the one that finally felt like enough. You reached it, looked around, and started chasing the next one. The finish line keeps moving.'},
  {t:'big', eyebrow:'The reframe', big:'Success you can’t feel isn’t your success.',
    kicker:'It is someone else’s definition, wearing your name. And you are allowed to trade it in.'},
  {t:'part', part:'Part One', h:'Why "success" stopped working'},
  {t:'text', eyebrow:'The old definition', h:'Money. Title. The impressed nod.',
    sub:'Society hands us one definition of success as we grow up, and it is almost always about money and power. We spend decades earning it before anyone asks whether it was ever ours to want.'},
  {t:'text', eyebrow:'Why it fails ambitious women', h:'One-dimensional success, in a multidimensional life.',
    sub:'A single-track definition of success can only ever fill a single part of you. The rest of your life, the parts that actually make a day feel good, get starved while you win the one game you were told mattered.'},
  {t:'big', eyebrow:'The cost', big:'"Is this really it?"',
    kicker:'That question is not ingratitude. It is the signal that your life has outgrown the definition you were handed. This masterclass is about building the next one on purpose.'},
  {t:'part', part:'Part Two', h:'The 8 ingredients of Multidimensional Success'},
  {t:'ingredients', eyebrow:'The framework', h:'Multidimensional Success has 8 ingredients.',
    items:['Work you care about','Relationships that fill you','Health and energy','Growth and learning','Contribution and causes','Joy and play','Purpose and meaning','Money and freedom']},
  {t:'steps', eyebrow:'The method', h:'Score your eight. Honestly.',
    steps:[
      ['Score each ingredient','from one to ten. Where is your life full, and where is it running on empty?'],
      ['Find the two numbers','you have been ignoring. They are usually the ones nobody around you can see.'],
      ['Define your own ten.','What would a ten actually look like for you, in your words, not the inherited ones?']
    ]},
  {t:'text', eyebrow:'The pattern', h:'You are not behind. You are over-invested.',
    sub:'Most high-achieving women score a nine on work and a three on the things that make work worth it. The fix is rarely more effort. It is moving a little energy from the ingredient you have maxed out to the one you have been starving.'},
  {t:'part', part:'Part Three', h:'A life you can actually feel'},
  {t:'text', eyebrow:'What changes', h:'A week that feels like yours.',
    sub:'Not a different job or a dramatic exit. The same ambitious life, re-weighted, so your calendar finally reflects all eight ingredients instead of the one you were graded on.'},
  {t:'text', eyebrow:'How you build it', h:'Your biggest goal, in 100 days.',
    sub:'Pick the one ingredient with the widest gap and make it a 100-day goal. Not a vague resolution, a Goal-Getter goal: specific, scheduled, and small enough at the start that you actually begin.',
    meta:'Day 1: name it. Day 30: the reset. Day 100: the thing you said you never could.'},
  {t:'text', eyebrow:'Why listen to me', h:'I chased the one-track version. It worked, and it wasn’t enough.',
    sub:'I built a high-paying corporate leadership career and then left it. I host the Goalden Girls Podcast and I coach ambitious women to redefine success on their own terms. I teach this because I had to live my way out of the inherited definition first.'},
  {t:'text', eyebrow:'In one slide', h:'Eight ingredients. One honest score. One 100-day move.',
    sub:'Success you can feel is not luck and it is not a personality type. It is a definition you choose, measured across your whole life, and rebuilt one ingredient at a time.'},
  {t:'cta', eyebrow:'Your next step', h:'Let’s build your version together.',
    cta:[
      'Join the Goalden Girls Mastermind waitlist. Enrolment opens once a year.',
      'Prefer to go one-on-one? Apply for private coaching with me.',
      'Want a taste first? Grab the 100 Day Goal Getter and start today.'
    ],
    disclaimer:'This masterclass is for educational purposes only. No specific outcome, income, or result is guaranteed. Results vary based on your own effort, choices, and circumstances.'}
];

function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(s){
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta-card':'');
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.t==='part') h=`<div class="part-label">${esc(s.part)}</div><h1>${esc(s.h)}</h1>`;
  else if(s.t==='title'){
    h+=`<h1>${esc(s.h)}</h1><p class="lead">${esc(s.lead)}</p><p class="meta">${esc(s.meta)}</p>`;
  } else if(s.t==='big'){
    h+=`<p class="big">${esc(s.big)}</p><p class="kicker">${esc(s.kicker)}</p>`;
  } else if(s.t==='ingredients'){
    h+=`<h2>${esc(s.h)}</h2><div class="grid8">`+
      s.items.map((it,i)=>`<div class="ing"><div class="n">${String(i+1).padStart(2,'0')}</div><div class="t">${esc(it)}</div></div>`).join('')+`</div>`;
  } else if(s.t==='steps'){
    h+=`<h2>${esc(s.h)}</h2><div class="steps">`+
      s.steps.map((st,i)=>`<div class="step"><div class="dot">${i+1}</div><div class="b"><b>${esc(st[0])}</b> ${esc(st[1])}</div></div>`).join('')+`</div>`;
  } else if(s.t==='cta'){
    h+=`<h2>${esc(s.h)}</h2><div class="cta-steps">`+
      s.cta.map((c,i)=>`<div><span class="quietnum">${String(i+1).padStart(2,'0')}</span>&nbsp;&nbsp;${esc(c)}</div>`).join('')+`</div>`+
      `<p class="disclaimer">${esc(s.disclaimer)}</p>`;
  } else {
    if(s.h) h+=`<h2>${esc(s.h)}</h2>`;
    if(s.sub) h+=`<p class="sub">${esc(s.sub)}</p>`;
    if(s.meta) h+=`<p class="meta">${esc(s.meta)}</p>`;
  }
  d.innerHTML=h;
  return d;
}

const deck=document.getElementById('deck');
S.forEach(s=>deck.appendChild(render(s)));
</script>
</body>
</html>
