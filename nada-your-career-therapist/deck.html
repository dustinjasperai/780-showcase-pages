<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Clarity Masterclass — Career Happiness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#182c32;      /* her deepest teal ground (brand.json) */
    --panel:#28424f;   /* her 2nd dominant teal-slate */
    --rule:#3c5663;    /* hairline between the two */
    --ink:#ecf0f1;     /* her light grey text */
    --muted:#9db3bc;   /* muted teal-grey */
    --accent:#91a200;  /* her signature olive-green CTA (12 uses) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0e1a1f;color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 64px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:54px 52px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide.title{min-height:520px}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:20px}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Playfair Display',serif;font-weight:600;font-size:34px;line-height:1.14;margin-bottom:18px}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:62ch}
  p.lede{font-size:21px;color:var(--muted)}
  .kicker{font-size:14px;color:var(--muted);margin-top:26px}
  .rulebar{width:52px;height:4px;background:var(--accent);border-radius:3px;margin:22px 0}
  ul{list-style:none;margin-top:10px}
  li{font-size:18px;line-height:1.55;padding:11px 0 11px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:64ch}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .step{display:flex;align-items:baseline;gap:18px}
  .num{font-family:'Playfair Display',serif;font-size:30px;color:var(--accent);font-weight:700;min-width:48px}
  .pagefoot{position:absolute;bottom:18px;right:26px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .brandfoot{position:absolute;bottom:18px;left:26px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .cta .btn{display:inline-block;margin-top:24px;background:var(--accent);color:#172a0f;font-weight:600;padding:15px 30px;border-radius:9px;font-size:17px;letter-spacing:.01em}
  .disclaimer{margin-top:30px;font-size:12.5px;color:var(--muted);max-width:66ch;line-height:1.5}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px}
  .card h3{font-family:'Playfair Display',serif;font-weight:600;font-size:19px;margin-bottom:8px;color:var(--ink)}
  .card p{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Nada, your career therapist',h1:'The Career Clarity Masterclass',lede:'Find the 1 to 3 careers that actually fit who you are.',kicker:'Career Happiness Coaching and Consulting · Nada Habib, CCDP, MBA, PMP, ACC'},

 {t:'lead',eyebrow:'Who this is for',h2:'You look fine on paper, and you dread Monday anyway.',body:'You are capable, experienced, and quietly stuck. Something in your work stopped fitting a while ago, and the question that keeps you up is not how to update a resume. It is what would actually fit you now.'},

 {t:'list',eyebrow:'The trap',h2:'How smart people stay stuck for years',items:['You wait for certainty to arrive before you move, and it never does','You collect more options, which makes the fog worse, not better','You treat it as a job-search problem when it is a clarity problem','You get insight on a good day, then nothing changes by Monday']},

 {t:'hook',eyebrow:'The reframe',h1:'Your career problem was never your resume.',lede:'It is clarity. Until you know what genuinely fits who you are now, every tactic is just a faster way to the wrong place.'},

 {t:'lead',eyebrow:'Part one · the real problem',h2:'Career decisions are identity work first.',body:'They are rarely just about the job. They are about values, confidence, ambition, and change. That is why resume tweaks and LinkedIn hacks leave you exactly where you started. The work underneath has to come first.'},

 {t:'two',eyebrow:'Why this approach is different',h2:'Two lenses, held at once',cards:[{h:'The human lens',p:'Identity, values, confidence, and the mindset patterns that keep you circling the same decision.'},{h:'The organizational lens',p:'How careers and organizations actually work, so clarity turns into a move you can really make.'}]},

 {t:'lead',eyebrow:'Part two · the method',h2:'The Career Clarity and Transformation method',body:'A six-step path from fog to a short list of genuinely-fitting careers. Today we walk the spine of it together, live.'},

 {t:'step',eyebrow:'Step 1',num:'01',h2:'Foundation',body:'Get underneath the noise to your core values and what you actually need from work. Everything later is measured against this.'},

 {t:'step',eyebrow:'Step 2',num:'02',h2:'Your Superpowers',body:'Name the strengths and the activities that genuinely energize you, not just the skills on your resume. Energy is the signal most people ignore.'},

 {t:'step',eyebrow:'Step 3',num:'03',h2:'Explore and Dream',body:'Mind-map your skills, your background, and what pulls at you into a written career vision. Possibility before judgement.'},

 {t:'step',eyebrow:'Step 4',num:'04',h2:'Self-Awareness and Mindset',body:'Reframe past disappointment and clear the self-doubt and fear that have been quietly making the decision for you.'},

 {t:'step',eyebrow:'Step 5',num:'05',h2:'Evaluating Career Options',body:'Research and narrow the field to the paths that are genuinely viable for you, with real information instead of guesses.'},

 {t:'step',eyebrow:'Step 6',num:'06',h2:'Decision and Clarity',body:'Use a simple decision matrix of your non-negotiables and expected fulfillment to land on your top three fitting paths, with confidence.'},

 {t:'list',eyebrow:'Part three · what clarity looks like',h2:'What you walk out with',items:['One to three career directions that genuinely fit who you are now','A clear sense of why they fit, so the choice holds under pressure','A first concrete step instead of another month of circling','Fewer 3am questions, because the decision finally feels like yours']},

 {t:'lead',eyebrow:'Why me',h2:'A career therapist and strategist, not a resume service.',body:'Nada Habib brings 25 years at the intersection of people, careers, and organizations: HR leadership, organizational strategy, and career development, with the CCDP, MBA, PMP, and ACC credentials behind it. The work blends the clarity of a therapist with the strategy of an HR leader.'},

 {t:'lead',eyebrow:'Where this goes next',h2:'Clarity is the start. Then you build the move.',body:'The masterclass gives you the short list and the confidence. The Clarity Roadmap is where you turn that into a plan and a redesigned career, step by step, with guidance the whole way.'},

 {t:'cta',eyebrow:'Your next step',h2:'Ready to redesign your career around who you actually are?',body:'Book a discovery call with Nada and take the first step toward a career that fits.',btn:'Book your discovery call',disclaimer:'This masterclass is for educational purposes only. No specific career, job, salary, or income result is guaranteed. Results vary by individual, effort, and circumstances.',brand:'Career Happiness Coaching and Consulting · career-happiness.ca'}
];

const d=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='title'?'title':s.t==='cta'?'cta':'');
  let h='';
  if(s.t==='step'){
    h='<div class="eyebrow">'+s.eyebrow+'</div><div class="step"><div class="num">'+s.num+'</div><div><h2>'+s.h2+'</h2><p>'+s.body+'</p></div></div>';
  } else {
    if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
    if(s.h1) h+='<h1>'+s.h1+'</h1>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
    if(s.h2) h+='<h2>'+s.h2+'</h2>';
    if(s.body) h+='<div class="rulebar"></div><p>'+s.body+'</p>';
    if(s.items) h+='<ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
    if(s.cards) h+='<div class="two">'+s.cards.map(c=>'<div class="card"><h3>'+c.h+'</h3><p>'+c.p+'</p></div>').join('')+'</div>';
    if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
    if(s.btn) h+='<div><span class="btn">'+s.btn+'</span></div>';
    if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  }
  h+='<div class="brandfoot">Career Happiness</div><div class="pagefoot">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
  d.appendChild(el);
});
</script>
</body>
</html>
