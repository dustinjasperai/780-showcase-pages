<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills, Not Drills — A Masterclass with Lee Taft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0f;        /* ground, from brand #000000 */
    --panel:#17171a;
    --rule:#2a2a30;
    --accent:#ed1c24;    /* harvested brand red (leetaft.com, 76 uses) */
    --ink:#f4f4f2;
    --muted:#9a9aa2;
    --head:'Oswald',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .kick{font-family:var(--head);text-transform:uppercase;letter-spacing:.18em;font-weight:600;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,5vw,58px);line-height:1.02;
    text-transform:uppercase;letter-spacing:.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(26px,3.4vw,40px);line-height:1.08;
    text-transform:uppercase;letter-spacing:.01em}
  .lead{font-size:20px;color:var(--muted);margin-top:18px;max-width:64ch;line-height:1.5}
  .big{font-size:clamp(24px,3vw,34px);line-height:1.3;max-width:62ch;margin-top:10px}
  ul{margin:22px 0 0 0;list-style:none;display:grid;gap:14px;max-width:66ch}
  li{font-size:19px;line-height:1.45;padding-left:26px;position:relative;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:11px;width:11px;height:11px;
    background:var(--accent);transform:skewX(-18deg)}
  .num{font-family:var(--head);font-weight:700;color:var(--accent);font-size:15px;
    letter-spacing:.14em;text-transform:uppercase}
  .tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
  .tier{border:1px solid var(--rule);border-radius:10px;padding:18px 16px}
  .tier .t{font-family:var(--head);font-weight:700;text-transform:uppercase;font-size:19px}
  .tier .d{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.4}
  .tier.hot{border-color:var(--accent)}
  .who{font-family:var(--head);text-transform:uppercase;letter-spacing:.02em;font-size:22px;margin-top:8px}
  .foot{position:absolute;bottom:20px;left:54px;color:var(--muted);font-size:12px;
    font-family:var(--head);letter-spacing:.16em;text-transform:uppercase}
  .disc{color:var(--muted);font-size:13px;margin-top:22px;line-height:1.5;max-width:70ch}
  .cta-step{font-size:22px;margin-top:16px;color:var(--ink)}
  .em{color:var(--accent)}
  strong{color:var(--ink)}
  .slash{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kick:'A live masterclass with Lee Taft, The Speed Guy',
   h:'Skills, Not Drills',
   lead:'How to coach multi-directional speed that actually transfers to the game.'},

  {t:'who',kick:'Who this is for',
   h:'If you coach athletes to move, this is for you',
   who:'Strength coaches. Skills trainers. Sport coaches. PE teachers.',
   lead:'You already put in the work. The question is whether the work is teaching speed, or just tiring kids out.'},

  {t:'hook',kick:'The trap',
   h:'Sharp in warmups. Beat on the first step.',
   big:'You have run every ladder, every cone circuit, every agility series. Your athletes look crisp on the lines and still get beaten the moment the game asks them to read and react.'},

  {t:'hook',kick:'The reframe',
   h:'Agility is not a fitness problem',
   big:'It is a <span class="em">skill</span> problem. And skills have to be taught, not just drilled. A faster engine does not help an athlete who cannot change direction efficiently when the play is live.'},

  {t:'part',kick:'Part one',num:'The core problem',
   h:'Closed drills build closed athletes',
   lead:'Pre-planned footwork, run to a whistle, rehearses movement the game never asks for. The athlete gets good at the drill, not at the read. That is the gap between your practice tape and your game tape.'},

  {t:'point',kick:'Part one',
   h:'What it costs you',
   items:['Athletes who look trained but hesitate when the play opens up',
     'Coaches blaming effort or conditioning for what is really a mechanics gap',
     'Off-seasons spent on speed that game film cannot see']},

  {t:'part',kick:'Part two',num:'The method',
   h:'Teach the movement, then add the read',
   lead:'Multi-directional speed is a set of teachable skills with real mechanics. Name them, teach them, then layer in reaction. That is the whole method.'},

  {t:'point',kick:'Part two, the skills',
   h:'The Plyo Step',
   big:'The repositioning step that resets the body to drive the opposite direction. Most athletes throw a false step and lose a beat. Taught well, it is the fastest way to redirect force.'},

  {t:'point',kick:'Part two, the skills',
   h:'The Hip Turn',
   big:'How an athlete opens the hips to change direction without braking the whole body. Get beaten on the first step and it is almost always a hip-turn problem, not a conditioning one.'},

  {t:'point',kick:'Part two, the skills',
   h:'The Lateral Run and the athletic stance',
   big:'Covering ground sideways without crossing up, from a stance that lets an athlete move in any direction on demand. The building blocks every sport borrows.'},

  {t:'tiers',kick:'Part two, the system',
   h:'The Reactive Tier System',
   lead:'You do not throw an athlete into chaos on day one. You progress the reaction, not the reps.',
   tiers:[
     {t:'Tier 1',d:'Closed. Teach the clean mechanic with no decision.',hot:false},
     {t:'Tier 2',d:'Cued. Add a simple cue so the skill answers a signal.',hot:false},
     {t:'Tier 3',d:'Reactive. Live stimulus, read and respond.',hot:true},
     {t:'Tier 4',d:'Game. The skill under real, open constraints.',hot:false}]},

  {t:'hook',kick:'The principle',
   h:'Marry natural movement with control',
   big:'Speed and agility done right are about marrying the natural movements athletes already have with the efficient body control that lets them express it at game speed.'},

  {t:'part',kick:'Part three',num:'In the room',
   h:'What a skills-first session looks like',
   lead:'Not a circuit for its own sake. A progression: assess the movement, teach the skill, add the read, then let the game test it.'},

  {t:'point',kick:'Part three',
   h:'Program it, do not just fill time',
   items:['Assess how the athlete actually redirects force, both sides',
     'Teach the missing skill in a closed setting until it is clean',
     'Add reaction one tier at a time toward game speed',
     'Build sessions that get athletes faster while lowering injury risk']},

  {t:'point',kick:'Why me',
   h:'Lee Taft, The Speed Guy',
   big:'35 years coaching athletes and the coaches who train them. Ground Breaking Athletic Movement (2003) helped change how the industry teaches change of direction. A coach of coaches, teaching performance pros worldwide.'},

  {t:'point',kick:'The takeaway',
   h:'Be a teacher of skills, not drills',
   items:['Agility is a skill, and skills are taught with real mechanics',
     'Name the movements: Plyo Step, Hip Turn, Lateral Run',
     'Progress the reaction with the Reactive Tier System',
     'Then the speed shows up where it counts, on game film']},

  {t:'cta',kick:'Your next step',
   h:'Learn to coach it with me',
   step:'Go deeper on the full method inside Speed Insiders Academy, my coach-education course on multi-directional speed. Join the next intake and start coaching the read.',
   disc:'Educational content only. This masterclass teaches coaching methods. Athlete and business outcomes depend on many factors outside any course. Results vary and are never guaranteed.'}
];

const d=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');el.className='slide';
  let html='';
  if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
  if(s.num) html+='<div class="num">'+s.num+'</div>';
  if(s.t==='title'){html+='<h1>'+s.h+'</h1>';}
  else {html+='<h2>'+s.h+'</h2>';}
  if(s.who) html+='<div class="who">'+s.who+'</div>';
  if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
  if(s.big) html+='<p class="big">'+s.big+'</p>';
  if(s.items){html+='<ul>';s.items.forEach(i=>html+='<li>'+i+'</li>');html+='</ul>';}
  if(s.tiers){html+='<div class="tiers">';s.tiers.forEach(t=>{
    html+='<div class="tier'+(t.hot?' hot':'')+'"><div class="t">'+t.t+'</div><div class="d">'+t.d+'</div></div>';});
    html+='</div>';}
  if(s.step) html+='<p class="cta-step">'+s.step+'</p>';
  if(s.disc) html+='<p class="disc">'+s.disc+'</p>';
  html+='<div class="foot">Lee Taft, The Speed Guy</div>';
  el.innerHTML=html;d.appendChild(el);
});
</script>
</body>
</html>
