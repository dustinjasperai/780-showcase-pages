<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Accelerated Path to MD - A Masterclass with Dr. Ruwaa Samarrai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ECF1EF; --panel:#FBFDFC; --rule:#CDD8D3; --ink:#16242A;
    --muted:#536069; --accent:#0E6E66; --accent-soft:#DCEBE8;
    --serif:'Newsreader',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);font-family:var(--sans);color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  .deck{width:100%;max-width:960px}
  .slide{position:relative;background:var(--bg);border:1px solid var(--rule);
    aspect-ratio:16/9;padding:62px 70px;display:none;flex-direction:column;
    justify-content:center;overflow:hidden}
  .slide.on{display:flex}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:700;font-size:54px;line-height:1.05;
    letter-spacing:-.01em;max-width:18ch}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;
    max-width:21ch;margin-bottom:6px}
  p{font-size:20px;line-height:1.5;color:var(--muted);max-width:42ch;margin-top:14px}
  .lead{font-size:23px;color:var(--ink)}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:14px}
  li{position:relative;padding-left:30px;font-size:21px;line-height:1.4;color:var(--ink);
    max-width:44ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;
    border:2px solid var(--accent);border-radius:50%}
  li b{font-weight:600}
  .routes{margin-top:22px;display:flex;flex-direction:column;gap:9px}
  .route{display:flex;gap:16px;align-items:baseline;padding:11px 16px;background:var(--panel);
    border:1px solid var(--rule);border-left:3px solid var(--accent)}
  .route .k{font-family:var(--serif);font-weight:700;color:var(--accent);font-size:19px;
    min-width:84px}
  .route .v{font-size:18px;color:var(--ink);line-height:1.35}
  .timeline{margin-top:26px;display:flex}
  .tstep{flex:1;padding:16px 14px;background:var(--panel);border:1px solid var(--rule);
    border-right:none}
  .tstep:last-child{border-right:1px solid var(--rule)}
  .tstep .g{font-family:var(--serif);font-weight:700;color:var(--accent);font-size:16px}
  .tstep .d{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.35}
  .kpi{display:flex;gap:48px;margin-top:28px}
  .kpi div .n{font-family:var(--serif);font-weight:700;font-size:46px;color:var(--accent)}
  .kpi div .l{font-size:16px;color:var(--muted);margin-top:4px;max-width:16ch}
  .credit{font-size:16px;color:var(--muted);margin-top:26px;max-width:46ch}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:24px;max-width:54ch;line-height:1.45}
  .cta-line{font-family:var(--serif);font-size:26px;color:var(--ink);margin-top:12px;max-width:30ch}
  .nav{position:fixed;bottom:18px;right:22px;font-size:13px;color:#aeb8bd;letter-spacing:.04em}
  .motif{position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;
    background:var(--accent-soft);opacity:.7;z-index:0}
  .slide>*{position:relative;z-index:1}
  @media(max-width:700px){.slide{padding:34px 28px}h1{font-size:33px}h2{font-size:25px}
    .timeline{flex-direction:column}.tstep{border-right:1px solid var(--rule)}
    .kpi{gap:22px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav" id="nav"></div>
<script>
const S=[
 {t:'title', motif:true, eyebrow:'Fast Track to MD - Live Masterclass',
  h:'The Accelerated Path to MD',
  sub:'How high-achieving students map their fastest viable route to the white coat, taught by a surgeon who ran it.',
  credit:'With Dr. Ruwaa Samarrai, MD - Otolaryngologist and Head and Neck Surgeon'},

 {t:'bullets', eyebrow:'Who this is for',
  h:'If any of this is you, you are in the right room',
  items:['A high schooler or early undergrad who already knows medicine is the goal',
         'A parent trying to help without guessing at a process you never ran',
         'Strong grades, strong drive, and a sense the clock is already running']},

 {t:'statement', eyebrow:'The trap',
  h:'Everyone says to "just do well and apply later"',
  sub:'So most families wait. They treat the fastest, most selective routes into medicine as a college problem. By then the windows that mattered most have usually already closed.'},

 {t:'statement', motif:true, eyebrow:'The reframe', big:true,
  h:'The fast track is not luck. It is timing.',
  sub:'Acceleration into medicine is decided by a handful of windows, most of them before you ever write a med-school essay. Miss them and the door quietly shuts. Hit them and you can finish years ahead.'},

 {t:'kpi', eyebrow:'Part one - the real problem',
  h:'The path is longer than it has to be by default',
  stats:[['~75%','of med students take gap years'],['84%','of premeds never reach medical school at all']],
  sub:'The standard timeline is built for the average applicant. High-achievers who plan early do not have to follow it.'},

 {t:'kpi', eyebrow:'Part one - the real problem',
  h:'Speed is not just prestige. It is years and dollars.',
  stats:[['$60-70k','tuition per year you can compress'],['$300k+','lifetime advantage from finishing early']],
  sub:'Every year you shave off the path is a year earlier into a physician career and income.'},

 {t:'statement', eyebrow:'Part two - the system',
  h:'The Fast Track Intensive System: Plans A through E',
  sub:'Acceleration is a portfolio of routes, not a single lottery ticket. Most families only know Plan A. The other routes are where the real leverage is.'},

 {t:'routes', eyebrow:'Part two - the routes',
  h:'The five accelerated routes',
  routes:[['Plan A','BS/MD, BA/MD and BS/DO programs direct from high school'],
          ['Plan B','Early Assurance programs that lock in a seat early in college'],
          ['Plan C','"Second-chance" BA/MD pathways from undergraduate schools'],
          ['Plan D','3-year US medical schools with streamlined residency tracks'],
          ['Plan E','The beyond: strategic combinations most advisors never map']]},

 {t:'bullets', eyebrow:'Part two - pillar one',
  h:'Early acceleration options',
  items:['<b>Grade acceleration and early graduation</b> where it genuinely helps, not for its own sake',
         'Reading which programs reward a younger, accelerated applicant and which penalize it',
         'Building a profile that looks deliberate, not rushed']},

 {t:'bullets', eyebrow:'Part two - pillar two',
  h:'Priming for efficiency',
  items:['Using <b>AP and dual enrollment strategically</b> to cut wasted time',
         'Avoiding the credit choices that quietly damage an accelerated application',
         'Sequencing prerequisites so no window is wasted waiting']},

 {t:'timeline', eyebrow:'Part two - pillar three',
  h:'The timing windows by grade',
  steps:[['9th - 11th','Build a competitive, intentional profile. Awareness, not panic.'],
         ['12th / freshman','Prioritize BS/MD and Early Assurance while the door is open.'],
         ['Sophomore +','Consider 3-year tracks once the intended specialty is clear.']],
  sub:'The right move at the wrong time is still the wrong move. The map tells you when.'},

 {t:'bullets', eyebrow:'Part two - the insider rules',
  h:'What the committees actually do',
  items:['Many 3-year tracks <b>admit internally</b> after year one or two, not at first application',
         'Residency placement varies: some guarantee affiliated seats, others use conditional matching',
         'Accelerated is not primary-care-only anymore - surgery, EM, derm and ENT qualify']},

 {t:'bullets', eyebrow:'Part three - the shift',
  h:'From scattered advice to one clear map',
  items:['You know your Plan A and your Plans B through E before you commit to anything',
         'You act inside each window instead of discovering it after it closed',
         'You stop collecting generic premed content and start executing a route built for you']},

 {t:'whyme', eyebrow:'Part three - why me',
  h:'I did not study this path. I ran it.',
  sub:'I completed a 7-year BA/MD program and earned my MD at 23. I am a practicing head and neck surgeon, and I have served on admissions, ranking and selection committees. I have seen the same avoidable mistakes come up again and again.',
  credit:'Dr. Ruwaa Samarrai, MD - founder, Fast Track to MD'},

 {t:'bullets', eyebrow:'Part three - the method in practice',
  h:'This is what we do together',
  items:['Map your personal Plan A through E against 112+ accelerated programs',
         'Fix your timing windows to your actual grade and goals',
         'Build the profile and application strategy the committees respond to']},

 {t:'bullets', eyebrow:'Recap',
  h:'Three things to take with you',
  items:['The fast track is decided by <b>timing windows</b>, most of them early',
         'There are <b>five accelerated routes</b>, not one - know all of them',
         'A map built by someone who ran the path beats generic advice built for the average']},

 {t:'cta', motif:true, eyebrow:'Your next step',
  h:'Let us map your route to MD',
  cta:'Apply for 1-on-1 consulting with Dr. Samarrai, or start with the Fast Track Intensive at fasttracktomd.com.',
  disclaimer:'Educational content only. Fast Track to MD does not guarantee admission, acceptance, scholarships, or any specific academic or financial outcome. Results vary by student, program, and circumstance. Admissions decisions rest entirely with the programs and institutions.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function render(s){
  var sl=el('section','slide');
  if(s.motif)sl.appendChild(el('div','motif'));
  if(s.eyebrow)sl.appendChild(el('div','eyebrow',s.eyebrow));
  sl.appendChild(el(s.t==='title'||s.big?'h1':'h2',null,s.h));
  if(s.sub)sl.appendChild(el('p','lead',s.sub));
  if(s.items){var ul=el('ul');s.items.forEach(function(x){ul.appendChild(el('li',null,x));});sl.appendChild(ul);}
  if(s.routes){var w=el('div','routes');s.routes.forEach(function(r){var row=el('div','route');row.appendChild(el('span','k',r[0]));row.appendChild(el('span','v',r[1]));w.appendChild(row);});sl.appendChild(w);}
  if(s.steps){var tl=el('div','timeline');s.steps.forEach(function(r){var st=el('div','tstep');st.appendChild(el('div','g',r[0]));st.appendChild(el('div','d',r[1]));tl.appendChild(st);});sl.appendChild(tl);if(s.sub2)sl.appendChild(el('p',null,s.sub2));}
  if(s.stats){var k=el('div','kpi');s.stats.forEach(function(r){var d=el('div');d.appendChild(el('div','n',r[0]));d.appendChild(el('div','l',r[1]));k.appendChild(d);});sl.appendChild(k);}
  if(s.t==='kpi'&&s.sub){/* sub already added above as lead? no */}
  if(s.cta)sl.appendChild(el('p','cta-line',s.cta));
  if(s.credit)sl.appendChild(el('p','credit',s.credit));
  if(s.disclaimer)sl.appendChild(el('p','disclaimer',s.disclaimer));
  return sl;
}
var deck=document.getElementById('deck');
S.forEach(function(s){deck.appendChild(render(s));});
var slides=[].slice.call(document.querySelectorAll('.slide'));
var i=0, nav=document.getElementById('nav');
function show(n){i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach(function(s,k){s.classList.toggle('on',k===i);});
  nav.textContent=(i+1)+' / '+slides.length;}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){show(i+1);e.preventDefault();}
  if(e.key==='ArrowLeft'){show(i-1);}});
document.addEventListener('click',function(e){
  if(e.clientX<window.innerWidth/2){show(i-1);}else{show(i+1);}});
show(0);
</script>
</body>
</html>
