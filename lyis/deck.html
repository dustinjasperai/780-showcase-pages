<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The First-Year Principal Trap: Leading Your International School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f8;        /* warm near-white, from brand #f6f1f4 */
    --panel:#f1e9ee;     /* muted plum tint */
    --ink:#2a0c23;       /* deep plum ink */
    --muted:#6b5663;     /* muted plum-grey */
    --accent:#3e1234;    /* LYIS dominant brand hex (brand.json) */
    --rule:#d8c7d1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--accent);font-family:"Lora",Georgia,serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  .deck{width:min(960px,96vw)}
  .slide{background:var(--bg);border-radius:14px;padding:64px 64px 56px;
    min-height:540px;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(42,12,35,.28);position:relative}
  .slide.on{display:flex}
  .eyebrow{font-family:"Montserrat",sans-serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:"Montserrat",sans-serif;font-weight:800;font-size:46px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:"Montserrat",sans-serif;font-weight:700;font-size:34px;line-height:1.14;
    margin-bottom:18px}
  p{font-size:21px;line-height:1.55;color:#3c2a35;margin-bottom:14px;max-width:62ch}
  .lead{font-size:24px}
  .big{font-family:"Montserrat",sans-serif;font-weight:800;font-size:40px;line-height:1.12;
    color:var(--accent)}
  ul{list-style:none;margin-top:8px}
  li{font-size:21px;line-height:1.5;padding-left:30px;position:relative;margin-bottom:14px}
  li:before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;
    background:var(--accent);border-radius:3px}
  .num{font-family:"Montserrat",sans-serif;font-weight:800;color:var(--accent);
    font-size:15px;letter-spacing:.12em}
  .frame{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px}
  .card h3{font-family:"Montserrat",sans-serif;font-weight:700;font-size:19px;
    color:var(--accent);margin-bottom:8px}
  .card p{font-size:16px;line-height:1.45;margin:0}
  .foot{position:absolute;left:64px;right:64px;bottom:26px;display:flex;
    justify-content:space-between;font-family:"Montserrat",sans-serif;font-size:12px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    border-top:1px solid var(--rule);padding-top:12px}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .cta-line{font-family:"Montserrat",sans-serif;font-weight:700;font-size:22px;
    color:var(--accent);margin-top:10px}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    font-family:"Montserrat",sans-serif;font-size:13px;color:#f1e3ea;
    letter-spacing:.1em;opacity:.85}
  .nav b{color:#fff}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav"><b id="idx">1</b> / <span id="tot"></span> &nbsp; use arrow keys</div>
<script>
const S=[
 {t:"title",eyebrow:"A live masterclass from Leading Your International School",
  h:"The First-Year Principal Trap",
  p:"Leading an international school without burning out, taught by people who have actually done the job."},

 {t:"who",eyebrow:"Who this is for",
  h:"If you are about to lead, or have just started",
  p:"Deputies and senior leaders preparing for headship. New heads in their first two years. Experienced principals who want to lead in a way that lasts.",
  p2:"You know the curriculum, the staffroom, the parents. Headship is a different job, and almost nobody hands you the manual."},

 {t:"trap",eyebrow:"The trap",
  h:"Your first year runs you, instead of the other way around",
  p:"The emails never stop. Every decision escalates to your desk. You are busy from the first bell to long after the last, and still the important work keeps slipping to next term.",
  p2:"Most new international school heads do not fail on knowledge. They drown in reaction."},

 {t:"reframe",eyebrow:"The reframe",
  h:"Leading a school is not doing more. It is deciding what only you can decide.",
  p:"The heads who thrive are not working longer hours than you. They have a framework for the few decisions that actually move a school, and the discipline to leave the rest to the people they trust."},

 {t:"section",num:"PART ONE",h:"The core problem: three decisions year one gets wrong"},

 {t:"content",eyebrow:"The three year-one mistakes",
  h:"Where new heads quietly lose the year",
  list:[
   "Trying to be across everything, so you lead nothing deeply.",
   "Inheriting a staff culture instead of shaping one on purpose.",
   "Running on instinct with no strategic plan you can actually defend."]},

 {t:"section",num:"PART TWO",h:"The LYIS Leadership Framework"},

 {t:"framework",eyebrow:"The three values behind the framework",
  h:"Lead on purpose, not on adrenaline",
  cards:[
   {h:"Ethical leadership",p:"Values-based practice that builds trust and integrity, so your decisions are predictable and your people know where they stand."},
   {h:"Opportunity",p:"Building a school where every educator can grow, so you are developing leaders instead of carrying the whole load yourself."},
   {h:"Sustainability",p:"Leading in a way that lasts, so the school does not depend on you being superhuman."}]},

 {t:"content",eyebrow:"Module focus: the role",
  h:"The international school principal",
  p:"Headship lives in three rooms at once: the boardroom, the staffroom and the community. The job is holding all three without being pulled apart by any one of them.",
  p2:"Year one is learning which room a problem actually belongs in."},

 {t:"content",eyebrow:"Module focus: strategy and operations",
  h:"Strategic and operational leadership",
  p:"Strategy, operations, finance and governance, and the judgement to balance them. Most new heads are strong on one and exposed on the rest.",
  p2:"A plan you can cost and defend is what turns a busy year into a chosen one."},

 {t:"content",eyebrow:"Module focus: people",
  h:"People leadership",
  p:"Fair recruitment, honest development, real retention, and a culture built on purpose rather than inherited by accident.",
  p2:"In a global staffing market, the leaders who keep good people win the decade, not just the year."},

 {t:"content",eyebrow:"Module focus: learning and the future",
  h:"Innovation that lasts",
  p:"Leading international curriculum and evaluating its real impact, and sustainable leadership practice through ethical, social and governance decisions.",
  p2:"Leadership that lasts is the point. A school that only works while you are in the building is not finished yet."},

 {t:"section",num:"PART THREE",h:"From framework to your own costed plan"},

 {t:"content",eyebrow:"The capstone",
  h:"Your Personal Strategic Leadership Plan",
  p:"Not a reflection document that sits in a drawer. A costed strategic leadership plan for your own school, developed over the year and defended out loud in front of a panel of leaders who have done the job.",
  p2:"You walk out with the plan you lead by, not a certificate you file away."},

 {t:"quote",eyebrow:"The method",
  big:"Leadership is better together.",
  p:"This is designed and led by serving and former international school leaders. You learn it alongside heads who have faced the decisions you are facing now, from more than forty countries. You do not lead alone, and you do not learn alone."},

 {t:"why",eyebrow:"Why learn it here",
  h:"Practitioners, not a generic headship course",
  list:[
   "Built and taught by people who have actually led international schools.",
   "Specific to the international context: boards, visas, global staff, community.",
   "A community that stays with you after the session, not a one-off webinar."]},

 {t:"cta",eyebrow:"Your next step",
  h:"Come to the live masterclass",
  p:"We run this as a live session for aspiring and serving international school leaders. Bring your first-year questions. Leave with the framework and the first draft of your own plan.",
  cta:"Register for the next live session at leadingyourinternationalschool.com",
  disclaimer:"Educational content only. Leadership outcomes depend on your own context, school and effort; no specific result or career outcome is promised or guaranteed. Leading Your International School Ltd."}
];

const deck=document.getElementById('deck');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(i===0?' on':'');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.t==='section'){ h+='<div class="num">'+esc(s.num)+'</div><h1>'+esc(s.h)+'</h1>'; }
  else if(s.t==='title'){ h+='<h1>'+esc(s.h)+'</h1><p class="lead">'+esc(s.p)+'</p>'; }
  else if(s.t==='quote'){ h+='<div class="big">'+esc(s.big)+'</div><p style="margin-top:18px">'+esc(s.p)+'</p>'; }
  else if(s.t==='framework'){
    h+='<h2>'+esc(s.h)+'</h2><div class="frame">';
    s.cards.forEach(c=>h+='<div class="card"><h3>'+esc(c.h)+'</h3><p>'+esc(c.p)+'</p></div>');
    h+='</div>';
  } else {
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    if(s.p) h+='<p>'+esc(s.p)+'</p>';
    if(s.list){ h+='<ul>'; s.list.forEach(x=>h+='<li>'+esc(x)+'</li>'); h+='</ul>'; }
    if(s.p2) h+='<p>'+esc(s.p2)+'</p>';
    if(s.cta) h+='<div class="cta-line">'+esc(s.cta)+'</div>';
    if(s.disclaimer) h+='<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
  }
  h+='<div class="foot"><span>Leading Your International School</span><span>'+(i+1)+'</span></div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
document.getElementById('tot').textContent=S.length;
let cur=0;
function show(n){
  cur=Math.max(0,Math.min(S.length-1,n));
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('on',i===cur));
  document.getElementById('idx').textContent=cur+1;
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') show(cur-1);
});
document.addEventListener('click',()=>show(cur+1));
</script>
</body>
</html>
