<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Full-Column Method · Salon Punk, Alan Forrest Smith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Bitter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4f1ea; --panel:#eae5da; --rule:#ddd6c8;
    --acc:#ba0303; --ink:#191919; --body:#3a3733; --dim:#8a857c; --cream:#f4f1ea;
  }
  html,body{height:100%}
  body{background:#e7e1d6;font-family:'Bitter',Georgia,serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e7e1d6}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Oswald',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ink);line-height:1.05;letter-spacing:.004em}
  .t-title h1{font-size:6.0vw;max-width:94%;text-transform:uppercase}
  .t-normal h1{font-size:3.5vw;max-width:90%}
  .t-normal .body{font-family:'Bitter',serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.64;font-weight:400}
  .sub{font-family:'Bitter',serif;font-size:1.9vw;color:var(--body);margin-top:3.4vh;max-width:84%;line-height:1.45;font-weight:400;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Oswald',sans-serif;font-size:1.15vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:5.2vw;max-width:94%;text-transform:uppercase}
  .t-section .rule{width:16vw;height:4px;background:var(--acc);margin-top:3.6vh}
  .t-dark{background:#191818;align-items:center;text-align:center}
  .t-dark h1{font-size:4.0vw;max-width:88%;color:var(--cream)}
  .t-cta{background:#191818;align-items:center;text-align:center}
  .t-cta h1{font-size:4.2vw;max-width:86%;color:var(--cream);text-transform:uppercase}
  .t-cta .body{font-family:'Bitter',serif;color:#d9d3c7;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:2px solid var(--acc);color:var(--cream);border-radius:6px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500;font-family:'Oswald',sans-serif;letter-spacing:.04em}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .cut-motif{position:absolute;pointer-events:none}
  .title-cut{right:7%;bottom:8%;width:17vw;opacity:.95}
  .corner-cut{right:6.5%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-family:'Oswald',sans-serif;font-size:1.2vw;color:var(--ink);margin-top:3.8vh;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(25,25,25,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600;font-family:'Oswald',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700;font-family:'Oswald',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s;font-family:'Oswald',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9.6vw}.t-normal h1{font-size:6.0vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.8vw}.t-section h1{font-size:8.0vw}.t-dark h1{font-size:6.4vw}
    .t-cta h1{font-size:7.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Salon Punk</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- cut motif: open scissors + a red snip line, drawn in the brand red -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="cut" viewBox="0 0 120 120">
  <g fill="none" stroke="#ba0303" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="26" cy="30" r="11"/>
    <circle cx="26" cy="90" r="11"/>
    <path d="M36 37 L104 76"/>
    <path d="M36 83 L104 44"/>
    <path d="M60 60 L112 60" stroke-dasharray="2 9" opacity="0.7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Full-Column Method',sub:'How to pack a salon with new clients in weeks, not years, without discounting your way to a full diary.',brand:true,cut:'title'},
 {t:'normal',k:'Who this is for',title:'You built a salon people love. Some weeks the chairs still sit half empty.',body:'Your stylists are good, your regulars are loyal, and the work coming out of the salon is worth every penny. But the diary runs hot then cold, a slow week arrives with no warning, and filling it still leans on walk-ins, word of mouth, and the odd discount. Growth feels like luck, not a lever you can pull.'},
 {t:'dark',title:'A great stylist sat behind an empty chair still earns the salon nothing.'},

 {t:'section',idx:'Part One',title:'Why Word Of Mouth Stopped Filling The Chairs'},
 {t:'normal',k:'The walk-by economy is gone',title:'Your next client is on their phone, not walking past your window.',body:'People find and book a salon online now. They scroll, they compare, they tap. If the only thing carrying your salon is footfall and referrals, you are invisible in the exact place your town is choosing where to spend. Meanwhile a booking app is happily selling that same person a chair down the road.'},
 {t:'normal',k:'The discount reflex',title:'A quiet week, so you run a deal. That is how you train a town to wait.',body:'Every time the diary dips and you post an offer, you teach the people around you that your price is a moving target. The next quiet week needs a bigger discount, then a bigger one, and your best work quietly becomes your cheapest. Cutting price fills a chair once and costs you the next booking.'},
 {t:'dark',title:'A discount fills a chair once. A system fills it every week.'},

 {t:'section',idx:'Part Two',title:'The Full-Column Method'},
 {t:'normal',k:'Column building, the foundation',title:'The number that matters is not the salon average. It is each column.',body:'A salon does not get busy in the abstract. Each stylist has a column, their own book of hours, and the salon lives or dies on how full those columns run. Column building is the deliberate work of filling every column on purpose, so a new stylist is not left waiting and a strong one is not the only reason you make rent.'},
 {t:'normal',k:'The referrals engine',title:'Your happiest client is your cheapest marketing. Most salons never ask.',body:'The person who just left thrilled with their hair will tell someone if you make it easy and you actually ask. Referrals stop being a lucky accident when they become a system, a repeatable moment built into every visit rather than a poster nobody reads. It is the highest-trust client you will ever get, and it costs nothing.'},
 {t:'normal',k:'Zero-budget promotions',title:'You can pack a diary without spending a penny on ads.',body:'Before you pay for a single click, there are dozens of ways to fill quiet days using what the salon already has: the client list, the chair time, the reason to come back in. Fast, cheeky, direct promotions that give people a real reason to book this week, not someday. This is the fast track that fills the gaps in the diary.'},
 {t:'normal',k:'The 21-day push',title:'When the diary is thin, you do not need a plan for next year. You need 21 days.',body:'A short, sharp campaign beats a vague intention every time. The 21-day push is a focused sprint that stacks the right moves in the right order to jump takings fast and prove to yourself the diary is something you control, not something you wait on. Momentum first, then you build the machine behind it.'},
 {t:'dark',title:'You do not need more talent behind the chairs. You need more people in them.'},

 {t:'section',idx:'Part Three',title:'What A Packed Salon Actually Looks Like'},
 {t:'normal',k:'The owner this builds',title:'Full columns, less discounting, and a quiet week that stops being a crisis.',body:'When the columns fill on purpose and the referrals and promotions run without you crossing your fingers, the diary holds its own weight. You stop cutting price to survive, new stylists get busy fast enough to keep, and a slow patch becomes a lever you pull rather than a panic you sit in. The salon runs on a system, not on hope.'},
 {t:'dark',title:'The goal was never a busier you. It was a fuller salon.'},
 {t:'normal',k:'Why Alan, the Salon Punk',title:'Three-times salon owner. Number one in a town of 35 salons. Zero fluff.',body:'Alan Forrest Smith owned and ran salons for the better part of two decades and took one from a standing start to the number one spot in a town with 35 salons. For more than 25 years since he has mentored salon owners around the world and wrote Salon Extreme 21, the manual this method comes from. Straight-talking, tested behind real chairs, no industry fluff.'},

 {t:'section',idx:'Your Next Step',title:'Fill Every Chair'},
 {t:'normal',k:'Keep going with Alan',title:'The method is yours to run. When you want it built with you, there is a path.',body:'Everything here is drawn from Salon Extreme 21 and Alan’s Column Building work, and you can start applying it this week. When you want it installed properly, Salon Mentor Extreme is the one to one build where Alan works it into your salon directly. Start where it makes sense for you.'},
 {t:'cta',title:'Ready to fill every chair?',body:'Take the next step with Salon Punk.',chips:['Book a call with Alan','Start with Salon Extreme 21'],disc:'Educational content for salon owners, managers, and stylists. No income or result is guaranteed. Results vary by salon, market, team, and effort.'},
];

const deck=document.getElementById('deck');
function cut(kind){return `<svg class="cut-motif ${kind==='title'?'title-cut':'corner-cut'}"><use href="#cut"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Salon <b>Punk</b> · Alan Forrest Smith</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.cut) h+=cut(s.cut);
  else if(s.t==='title') h+=cut('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
