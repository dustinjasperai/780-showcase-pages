<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Leading When Your Business Feels Like Freefall · Pull the Chute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a2e5a; --panel:#0c3566; --rule:#2b5d8f;
    --ink:#eaf2f8; --grey:#b7cde0; --dim:#7f9dbb;
    --accent:#51afc0;
  }
  html,body{height:100%}
  body{background:#061f3d;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#061f3d}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Archivo',sans-serif;font-size:1vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Archivo',sans-serif;font-weight:700;color:var(--ink);line-height:1.08;letter-spacing:-0.01em}
  .t-title h1{font-size:4.9vw;max-width:92%}
  .t-normal h1{font-size:3.6vw;max-width:88%}
  .t-normal .body{font-size:1.42vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.6;font-weight:300}
  .sub{font-size:1.65vw;color:var(--grey);margin-top:3.4vh;max-width:76%;line-height:1.5;font-weight:300}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Archivo',sans-serif;font-size:1.05vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:92%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#0c3566 0%,#061f3d 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:90%;font-weight:600;color:var(--ink)}
  .t-dark .accent-bar{width:9vw;height:3px;background:var(--accent);margin:3.6vh auto 0}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#0c3566 0%,#061f3d 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.1vw;max-width:86%;color:var(--ink)}
  .chips{display:flex;gap:1.2vw;margin-top:4.4vh;flex-wrap:wrap;justify-content:center}
  .chip{background:var(--accent);color:#06243f;border-radius:100px;padding:1.5vh 1.9vw;font-size:1.16vw;font-weight:600;font-family:'Archivo',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .chute{position:absolute;pointer-events:none}
  .title-chute{right:7%;bottom:8%;width:22vw;opacity:.9}
  .corner-chute{right:5.5%;bottom:7%;width:9vw;opacity:.42}
  .brandline{font-size:1.24vw;color:var(--grey);margin-top:3.6vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(234,242,248,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:13px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:8vw}.t-section .idx{font-size:2.8vw}
    .t-dark h1{font-size:6.2vw}.t-cta h1{font-size:7vw}.chip{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">Pull the Chute</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- chute motif: a parachute canopy and descent line, drawn once -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="chute" viewBox="0 0 300 220">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 78 C70 20 230 20 260 78" stroke="#51afc0" opacity="0.92"/>
    <path d="M40 78 C70 46 230 46 260 78" stroke="#51afc0" opacity="0.3"/>
    <path d="M40 78 L150 150 M110 78 L150 150 M150 78 L150 150 M190 78 L150 150 M260 78 L150 150" stroke="#51afc0" opacity="0.55"/>
    <rect x="138" y="150" width="24" height="18" rx="3" stroke="#51afc0" opacity="0.85"/>
    <path d="M150 168 L150 200" stroke="#51afc0" opacity="0.4" stroke-dasharray="3 7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Leading When Your Business Feels Like Freefall',sub:'A live masterclass for founders and executives who built something real and want it to climb again. Grow your people, grow your company.',brand:true,chute:'title'},
 {t:'normal',k:'Who this is for',title:'You built something real. Lately it feels like it is dropping out of the sky.',body:'Revenue stalls, the team waits on you for everything, and the days blur into firefighting. You are smart, you work hard, and none of it is catching the fall. That is not a sign you are failing. It is a sign you have outgrown the way you have been leading.'},
 {t:'dark',title:'A new strategy will not catch a falling company. A different grip will.'},

 {t:'section',idx:'Part One',title:'Why Good Founders Freeze in Freefall'},
 {t:'normal',k:'The control reflex',title:'When it feels like freefall, you grab the controls harder.',body:'More meetings, more approvals, more of everything running through you. It feels responsible. It is actually the thing tightening the spin. The harder you grip, the less room your people have to catch anything, and the more the whole thing depends on you alone.'},
 {t:'normal',k:'The 14 percent problem',title:'You were promoted for being smart, not for being taught to lead.',body:'Only 14 percent of CEOs have the leadership skills to grow their business. Most of us spent our careers building the intelligence for the role and almost none of the leadership that the role actually needs. The gap is not effort or intelligence. It is a skill nobody handed you.'},
 {t:'normal',k:'The hero trap',title:'You became the bottleneck you are trying to fix.',body:'When every decision needs you, every decision waits for you. Your team learns to bring problems instead of solving them, and you mistake that dependence for being needed. A company that cannot move without you is not a strong company. It is a fragile one.'},
 {t:'dark',title:'The problem was never the market. It was the grip.'},

 {t:'section',idx:'Part Two',title:'The Pull the Chute Method'},
 {t:'normal',k:'Pull the chute',title:'Pause, reflect, and regain altitude before the next move.',body:'A parachute does not stop the fall by force. It changes the shape of it, slows it, and lets you steer. Pulling the chute is the deliberate pause when everything in you wants to grab harder. You step back, see the whole picture, and choose the next move instead of reacting to the last one.'},
 {t:'normal',k:'Trust over control',title:'You cannot delegate what you refuse to trust.',body:'Delegation is not handing out tasks. It is handing over ownership and meaning it. When you trust your people with real decisions, they rise to them, and you get back the hours and the headspace that the business has been starving you of. Control feels safe. Trust is what actually scales.'},
 {t:'normal',k:'Grow your people',title:'Grow your people and the company grows with them.',body:'When leaders invest in their people, businesses grow. Not as a slogan, as a mechanism. People who feel trusted, valued, and developed solve more, own more, and stay longer. Your growth ceiling is your team’s growth ceiling, and the fastest way to raise one is to raise the other.'},
 {t:'normal',k:'Build heroes',title:'Leadership is not about being the hero. It is about building heroes.',body:'The job stops being to have every answer and starts being to develop people who do. Lead with why, lead by example, communicate so everyone understands you, and hold yourself to the higher standard first. You win by how good your people become, not by how indispensable you stay.'},
 {t:'dark',title:'Set goals. Implement ideas. Focus with accountability.'},

 {t:'section',idx:'Part Three',title:'When a People-First Company Climbs Again'},
 {t:'normal',k:'The company that runs',title:'You work on the company, not trapped inside it.',body:'Decisions happen without you in the room. The team brings answers and owns outcomes. You spend your best hours on the few things only you can do, and the business keeps climbing while you do, because it is carried by people you built, not by a grip you cannot loosen.'},
 {t:'normal',k:'The leader you become',title:'Clarity, empathy, communication, and trust, on purpose.',body:'Resilience in the hard moments, the emotional intelligence to engage conflict honestly, and the habit of celebrating success in a way that deepens connection. These are not personality traits you were born with or without. They are competencies you can build, and they are what separate a boss from a leader people follow.'},
 {t:'dark',title:'The goal was never to work more. It was to lead well enough to work on what matters.'},

 {t:'normal',k:'Why Pull the Chute',title:'I have spent my career helping leaders grow the people who grow the company.',body:'I am Jeff Sesol, author of Pull the Chute and The New Leadership Landscape, and founder of Pull the Chute with Janna Landry. I was honored with the Outstanding Leadership Award at the CXO 2.0 Conference, and I teach this method through one on one coaching, group programs, team coaching, and the Pull the Chute podcast.'},

 {t:'section',idx:'Your Next Step',title:'Lead Through the Freefall'},
 {t:'normal',k:'The path',title:'A clear way to learn and live the whole method.',body:'From the free PTC Challenge to one on one coaching for founders and executives, group leadership coaching for your team, and team coaching for the whole company, there is a path that meets you where you are and builds the leadership your next stage of growth will demand.'},
 {t:'cta',title:'Ready to pull the chute in your own business?',chips:['Schedule a discovery call with Pull the Chute','Explore the leadership coaching programs'],disc:'Educational content for founders and executives. No leadership or business result is guaranteed. Results vary by leader, team, market, and effort.'},
];

const deck=document.getElementById('deck');
function chute(kind){return `<svg class="chute ${kind==='title'?'title-chute':'corner-chute'}" viewBox="0 0 300 220"><use href="#chute"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Pull the <b>Chute</b> · Jeff Sesol and Janna Landry</div>`;
    if(s.t==='dark') h+=`<div class="accent-bar"></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.chute) h+=chute(s.chute);
  else if(s.t==='title') h+=chute('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
