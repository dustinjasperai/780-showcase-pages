<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Say It So It Can't Be Missed — The TrueYou Speaking Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  /* ## Palette (brand-derived, see 01-deep-research.md):
     ground #f7f4ee warm paper (from site neutral #f7f7f7/#fff panels),
     ink #1c1c1c (from site #323232/black body), rule #e4ddd0,
     accent #b8842b warm brass (Joel's aluminum "success can" + stage warmth).
     Type: Poppins (display, from his site) + Source Serif 4 (body). */
  :root{
    --bg:#f7f4ee;
    --panel:#fffdf8;
    --rule:#e4ddd0;
    --ink:#1c1c1c;
    --muted:#5c5750;
    --accent:#b8842b;
    --accent-soft:#f0e2c8;
    --display:'Poppins',system-ui,sans-serif;
    --body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 8vw;position:relative}
  .slide{max-width:900px;width:100%;display:none;animation:fade .4s ease}
  .slide.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.4vw,62px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.6vw,40px);line-height:1.12;letter-spacing:-.01em}
  p{font-size:clamp(18px,2.1vw,23px);line-height:1.5;color:var(--muted);margin-top:20px;max-width:42ch}
  p.lead{color:var(--ink);font-size:clamp(20px,2.4vw,27px)}
  .big{font-family:var(--display);font-weight:300;font-size:clamp(40px,7vw,86px);line-height:1.02;letter-spacing:-.02em}
  .accent{color:var(--accent)}
  ul{list-style:none;margin-top:30px}
  li{font-size:clamp(18px,2.1vw,23px);line-height:1.45;padding:16px 0 16px 40px;border-top:1px solid var(--rule);position:relative;color:var(--ink)}
  li:last-child{border-bottom:1px solid var(--rule)}
  li::before{content:"";position:absolute;left:6px;top:24px;width:14px;height:14px;background:var(--accent);border-radius:3px;transform:rotate(45deg)}
  li small{display:block;font-family:var(--body);color:var(--muted);font-size:16px;margin-top:5px;padding:0}
  .num{font-family:var(--display);font-weight:700;color:var(--accent-soft);font-size:clamp(60px,12vw,150px);line-height:.8;position:absolute;top:5vh;right:8vw;z-index:0}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:clamp(28px,4vw,46px);box-shadow:0 20px 50px -30px rgba(28,28,28,.4)}
  .pillar{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  .disclaimer{margin-top:34px;font-size:14px;color:var(--muted);max-width:56ch;line-height:1.5}
  .quotebar{border-left:4px solid var(--accent);padding-left:26px}
  footer{position:fixed;bottom:20px;left:8vw;right:8vw;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .dots{display:flex;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--rule)}
  .dot.on{background:var(--accent)}
  .nav{position:fixed;bottom:14px;right:8vw;display:flex;gap:10px;z-index:5}
  .nav button{font-family:var(--display);font-weight:600;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 15px;cursor:pointer;font-size:14px}
  .nav button:hover{border-color:var(--accent);color:var(--accent)}
  .brandline{font-family:var(--display);font-weight:600;letter-spacing:.08em}
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <footer><span class="brandline">Empower Your Platform &middot; Joel Weldon</span><span class="dots" id="dots"></span></footer>
</div>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S=[
 {t:'title', html:`<div class="kicker">A live masterclass with Joel Weldon</div>
   <h1>Say It So It <span class="accent">Can't Be Missed</span></h1>
   <p class="lead">The TrueYou Speaking Method: how to speak as your real self and make your message impossible to be misunderstood.</p>`},
 {t:'promise', html:`<div class="kicker">The promise</div>
   <h2>In one hour, you will walk out with a way to speak that people believe and remember.</h2>
   <p>Not more tips. A system. Because speaking is simple, when you have a system.</p>`},
 {t:'audience', html:`<div class="kicker">Who this is for</div>
   <h2>For anyone handed a microphone and expected to move people.</h2>
   <ul>
    <li>Pastors and ministry leaders<small>Every week, in front of the people who count on you</small></li>
    <li>Executives, attorneys, and leaders<small>The room where the decision gets made</small></li>
    <li>Voice actors and professional speakers<small>Where your voice is the whole product</small></li>
   </ul>`},
 {t:'trap', html:`<div class="kicker">The trap</div>
   <h2>You were told to be more polished. So you got more careful.</h2>
   <p>More slides. More script. More rehearsed. And somewhere in all that polish, the one thing that actually connects, you, went quiet.</p>`},
 {t:'reframe', html:`<div class="quotebar"><div class="big">People don't remember your <span class="accent">performance.</span></div>
   <div class="big">They remember whether they <span class="accent">believed</span> you.</div></div>
   <p>The goal was never to sound impressive. It was to be impossible to misunderstand, and impossible to doubt.</p>`},
 {t:'p1_head', html:`<div class="num">1</div><div class="kicker">Part one</div>
   <h1>The real problem isn't nerves.</h1>
   <p class="lead">It's that you are hiding the most persuasive thing in the room.</p>`},
 {t:'p1_body', html:`<h2>Under pressure, most speakers reach for a mask.</h2>
   <p>A bigger voice. A borrowed style. A script to hide behind. The audience feels the gap between the person and the presentation, and the gap is where attention leaks out.</p>`},
 {t:'p1_cost', html:`<div class="kicker">What it costs</div>
   <h2>A misunderstood message doesn't just fall flat. It gets decided against.</h2>
   <p>The sermon that didn't move anyone. The pitch that lost the room. The talk people clapped for and forgot by lunch. Same cause, every time.</p>`},
 {t:'p2_intro', html:`<div class="kicker">Part two &middot; The method</div>
   <h1>The TrueYou Speaking Method</h1>
   <p class="lead">Four moves that turn a nervous presenter into a speaker people believe.</p>`},
 {t:'pillar', html:`<div class="num">01</div><div class="pillar">Pillar 01</div>
   <h1 style="margin-top:10px">Be TrueYou</h1>
   <p class="lead" style="margin-top:16px">Speak as your real self, not a performance</p>
   <p>The fastest way to lose a room is to sound like someone giving a speech. TrueYou strips off the borrowed voice and the memorized script so what people hear is the actual you. Real is what they trust, and trust is what they act on.</p>`},
 {t:'pillar', html:`<div class="num">02</div><div class="pillar">Pillar 02</div>
   <h1 style="margin-top:10px">Impossible To Misunderstand</h1>
   <p class="lead" style="margin-top:16px">Clarity before charisma</p>
   <p>A great delivery of a fuzzy point still leaves people unsure. We build the message so one idea lands, cleanly, every time. When your point cannot be missed, you do not need to be loud. You need to be clear.</p>`},
 {t:'pillar', html:`<div class="num">03</div><div class="pillar">Pillar 03</div>
   <h1 style="margin-top:10px">Speak From Belief</h1>
   <p class="lead" style="margin-top:16px">Success comes in cans, not in cannots</p>
   <p>How you talk to yourself before you stand up decides how you sound when you do. The belief that you have something worth saying is not a warm-up trick, it is the engine. We set it first, so the nerves work for you instead of against you.</p>`},
 {t:'pillar', html:`<div class="num">04</div><div class="pillar">Pillar 04</div>
   <h1 style="margin-top:10px">Own The Voice</h1>
   <p class="lead" style="margin-top:16px">Delivery a listener leans into</p>
   <p>Forty years behind the microphone taught me that voice is a skill, not a gift. Pace, pause, and weight are learnable moves. You will use the same tools a professional voice actor uses, on your own words, in your own room.</p>`},
 {t:'system', html:`<div class="kicker">How they fit</div>
   <h2>Belief sets the tone. TrueYou sets the voice. Clarity sets the message. Delivery lands it.</h2>
   <p>Run in order, they stop being tips and start being a system you can repeat for any room, any week.</p>`},
 {t:'p3_head', html:`<div class="num">3</div><div class="kicker">Part three</div>
   <h1>When the room can't look away.</h1>`},
 {t:'p3_body', html:`<div class="card">
   <p class="lead" style="margin:0">You stand up as yourself. You say one clear thing. The room goes still, not because you were loud, but because they could not misunderstand you and did not want to look away.</p></div>
   <p>That is a repeatable outcome, not a lucky day. That is the whole point of a system.</p>`},
 {t:'proof', html:`<div class="kicker">Proven in the hardest rooms</div>
   <h2>Built over 48 years and more than 3,000 paid talks.</h2>
   <ul>
    <li>Over 10,000 speakers personally coached</li>
    <li>A voice trusted by Ford, Caterpillar, FOX Sports, and NASCAR</li>
    <li>The 8-ounce success can, in the hands of more than 500,000 people</li>
   </ul>`},
 {t:'whyme', html:`<div class="kicker">Why me</div>
   <h2>I bombed my first talk at 28. Then I spent a lifetime making sure you won't.</h2>
   <p>Hall of Fame speaker, professional voice actor, and founder of the TrueYou Speaking Method. I don't teach theory. I teach the moves I have used on stage and behind the microphone for four decades.</p>`},
 {t:'recap', html:`<div class="kicker">The one thing to keep</div>
   <div class="big">Be <span class="accent">TrueYou.</span> Be <span class="accent">clear.</span></div>
   <div class="big">Be impossible to <span class="accent">miss.</span></div>`},
 {t:'cta', html:`<div class="kicker">Your next step</div>
   <h1>Ready to sound like the person they already trust?</h1>
   <p class="lead">If you lead, preach, pitch, or speak for a living, let's build your voice into a system. Explore the courses and coaching at empoweryourplatform.com, or bring TrueYou to your whole team.</p>
   <p class="disclaimer">This masterclass is educational. It offers no income or result guarantees. No result is guaranteed. Results vary and depend on your own effort and practice.</p>`}
];

const wrap=document.getElementById('slides');
wrap.innerHTML=S.map((s,i)=>`<section class="slide${i===0?' active':''}">${s.html}</section>`).join('');
const dots=document.getElementById('dots');
dots.innerHTML=S.map((_,i)=>`<span class="dot${i===0?' on':''}"></span>`).join('');
let cur=0;
const slides=[...document.querySelectorAll('.slide')];
const dd=[...document.querySelectorAll('.dot')];
function show(i){slides[cur].classList.remove('active');dd[cur].classList.remove('on');cur=(i+S.length)%S.length;slides[cur].classList.add('active');dd[cur].classList.add('on');window.scrollTo(0,0);}
function go(d){show(cur+d);}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
</script>
</body>
</html>
