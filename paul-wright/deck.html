<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The One Minute Practice, a Masterclass by Paul Wright</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8f8;        /* clinical paper, light site scheme */
    --panel:#ffffff;
    --rule:#d8e0e0;
    --ink:#13252b;       /* near-black teal ink */
    --muted:#52666c;
    --accent:#0f7b7b;    /* deep teal, clinical and trust */
    --highlight:#d98a2b; /* amber, the one-minute key-number spotlight */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(19,37,43,.04)}
  .kicker{font-family:'Inter';font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Spectral';font-weight:700;font-size:46px;line-height:1.1;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Spectral';font-weight:700;font-size:34px;line-height:1.15;margin-bottom:16px}
  h3{font-family:'Spectral';font-weight:600;font-size:23px;line-height:1.2;margin-bottom:10px}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin-bottom:14px;max-width:62ch}
  p.sub{color:var(--muted);font-size:18px}
  .lead{font-size:23px;line-height:1.5}
  ul{list-style:none;margin:8px 0 6px}
  li{font-size:19px;line-height:1.5;padding-left:30px;position:relative;margin-bottom:14px;max-width:60ch}
  li::before{content:"";position:absolute;left:4px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .pillar li::before{background:var(--highlight)}
  .dial{display:inline-flex;align-items:center;justify-content:center;width:120px;height:120px;
    border-radius:50%;border:4px solid var(--accent);position:relative;margin-bottom:22px}
  .dial span{font-family:'Spectral';font-weight:700;font-size:30px;color:var(--accent)}
  .big{font-family:'Spectral';font-weight:700;font-size:72px;color:var(--highlight);line-height:1;margin-bottom:10px}
  .tag{display:inline-block;font-weight:600;font-size:13px;color:var(--accent);
    border:1px solid var(--accent);border-radius:20px;padding:5px 14px;margin-bottom:22px}
  .rulebar{width:54px;height:4px;background:var(--highlight);border-radius:2px;margin:0 0 22px}
  .note{font-size:14px;color:var(--muted);margin-top:26px;border-top:1px solid var(--rule);padding-top:16px;max-width:70ch}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:22px 24px}
  .card h3{color:var(--accent)}
  .quote{font-family:'Spectral';font-style:italic;font-size:26px;line-height:1.4;color:var(--ink)}
  .pagefoot{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', html:`
    <div class="tag">A live masterclass with Paul Wright</div>
    <div class="dial"><span>1:00</span></div>
    <h1>The One Minute Practice</h1>
    <p class="lead">How to run a profitable, systemised health business you can monitor in one minute, instead of being chained to it.</p>
    <p class="sub">For physiotherapy, chiro, osteo, podiatry and allied-health practice owners.</p>`},

  {t:'promise', html:`
    <div class="kicker">What you will walk away with</div>
    <h2>By the end of the hour you will know how to see your whole business in one minute</h2>
    <ul>
      <li>The handful of numbers that tell you everything, so you stop drowning in reports and gut feel.</li>
      <li>How to move the day to day off your shoulders and onto systems your team actually follows.</li>
      <li>Where the profit really leaks in a health practice, and the fixes that pay for themselves fast.</li>
    </ul>`},

  {t:'who', html:`
    <div class="kicker">Who this is for</div>
    <h2>The owner who became the bottleneck</h2>
    <p>You are a great clinician. You built a practice that works. The problem is that it only works when you are in the building.</p>
    <p>Every decision routes back to you. The numbers live in your head. A day off costs you money, and a holiday feels impossible.</p>
    <p class="sub">If the practice would wobble the week you stepped away, this hour is for you.</p>`},

  {t:'trap', html:`
    <div class="kicker">The trap</div>
    <h2>You did not buy a business. You bought yourself a job.</h2>
    <p>Most health practice owners add more hours, more patients and more rooms, and quietly build a machine that needs them in it every single day.</p>
    <p>More revenue just means more to manage. The busier it gets, the less free you are. That is not a growth problem. It is a design problem.</p>`},

  {t:'reframe', html:`
    <div class="rulebar"></div>
    <p class="quote">A good business is not one you work harder inside. It is one you can watch run, in about a minute, from anywhere.</p>
    <p class="sub">I ran six clinics at once while living in a different city to five of them, visiting each only a few hours a week. The difference was never effort. It was the system underneath.</p>`},

  {t:'part', html:`
    <div class="kicker">Part One</div>
    <h2>Why your practice cannot run without you</h2>
    <p>A health practice is built around the clinician. That is fine at the start. It becomes the ceiling the moment you want to grow, step back or sell.</p>
    <ul>
      <li>The business depends on your hours, your memory and your judgement being present.</li>
      <li>So scaling just means more of you, until there is no more of you to give.</li>
    </ul>`},

  {t:'costs', html:`
    <div class="kicker">What owner dependence costs</div>
    <h2>The leaks you cannot see while you are on the floor</h2>
    <ul>
      <li>A front desk that quotes timidly, lets cancellations slide and forgets to rebook, bleeding revenue every week.</li>
      <li>One wrong hire that can cost a practice more than one hundred thousand dollars by the time it is unwound.</li>
      <li>No live view of your numbers, so problems only surface in the accountant report months too late.</li>
    </ul>`},

  {t:'part', html:`
    <div class="kicker">Part Two</div>
    <h2>The One Minute Practice System</h2>
    <p>The fix is not working harder or hiring one more person and hoping. It is four pieces that, together, let the practice run on systems and numbers instead of on you.</p>
    <p class="sub">Vital numbers. Systems over presence. A front desk engine. The right team, kept.</p>`},

  {t:'pillar', html:`
    <div class="kicker">Pillar One</div>
    <h3>The Vital Numbers</h3>
    <p>You do not need a hundred reports. You need the small set of statistics that actually predict the health of the business, in front of you daily.</p>
    <ul class="pillar">
      <li>New patients, rebookings, cancellations, average visits and collections, the numbers that move profit.</li>
      <li>Tracked on one simple dashboard so a glance tells you whether today is on track or off.</li>
      <li>Visible to you and your team, so the practice self corrects before you have to step in.</li>
    </ul>`},

  {t:'pillar', html:`
    <div class="kicker">Pillar Two</div>
    <h3>Systems over presence</h3>
    <p>Everything that currently lives in your head becomes a documented, repeatable system your team runs without you.</p>
    <ul class="pillar">
      <li>The patient and client experience, start to finish, so quality does not depend on who is rostered.</li>
      <li>Referrals and reactivation built into the process, not left to whoever remembers.</li>
      <li>Simple checklists and protocols that make the right thing the default thing.</li>
    </ul>`},

  {t:'pillar', html:`
    <div class="kicker">Pillar Three</div>
    <h3>The front desk engine</h3>
    <p>Your admin team is not an overhead. One well trained front desk member can add more than two hundred thousand dollars a year to a health business.</p>
    <ul class="pillar">
      <li>A short, specific script for the handful of moments that decide whether a caller books.</li>
      <li>A simple front desk checklist that lifts rebookings and referrals and cuts cancellations.</li>
      <li>The one question in the waiting room that can quietly multiply your referrals.</li>
    </ul>`},

  {t:'pillar', html:`
    <div class="kicker">Pillar Four</div>
    <h3>The right team, kept</h3>
    <p>The freedom only holds if the people hold. Recruitment and retention are systems too, not a gamble you run each time someone leaves.</p>
    <ul class="pillar">
      <li>A hiring process that screens for the traits a great practice team actually needs.</li>
      <li>The interview questions that catch the costly mistakes before they are on your payroll.</li>
      <li>Retention built in, so your best people stay and the system keeps running.</li>
    </ul>`},

  {t:'part', html:`
    <div class="kicker">Part Three</div>
    <h2>A Tuesday you are not in the building</h2>
    <p>Picture a normal Tuesday. You are not in the clinic. You open one screen, read it in under a minute, and everything is on track.</p>
    <ul>
      <li>The team is running the systems. The numbers are green. Patients are cared for.</li>
      <li>You are free to work on the business, take the day, or build the next one.</li>
    </ul>`},

  {t:'oneminute', html:`
    <div class="kicker">The payoff</div>
    <div class="big">1:00</div>
    <h2>The whole business, in one minute</h2>
    <p>When the numbers are chosen, the systems are documented and the team runs them, you no longer have to be in the building to know the business is healthy.</p>
    <p class="sub">Open the dashboard. One minute. On track, or needs attention. That is the One Minute Practice.</p>`},

  {t:'whyme', html:`
    <div class="kicker">Why listen to me</div>
    <h2>Paul Wright</h2>
    <div class="two">
      <div class="card"><h3>The operator</h3><p class="sub">Physiotherapist who built and ran six Get Active clinics in Australia at once, visiting most only a few hours a week, then sold them.</p></div>
      <div class="card"><h3>The educator</h3><p class="sub">Author of the best selling book How to Run a One Minute Practice, host of the Practiceology podcast, and mentor to health business owners in 57 countries.</p></div>
    </div>`},

  {t:'recap', html:`
    <div class="kicker">What we covered</div>
    <h2>From chained to the chair, to one minute a day</h2>
    <ul>
      <li>The Vital Numbers that let you see the business at a glance.</li>
      <li>Systems over presence, so the practice runs without you in it.</li>
      <li>A front desk engine and the right, retained team to drive it.</li>
    </ul>
    <p class="sub">None of this is theory. It is the exact design that let me step back from six practices at once.</p>`},

  {t:'cta', html:`
    <div class="kicker">Your next minute</div>
    <h2>Build your One Minute Practice with me</h2>
    <p>If you want help putting these systems into your own practice, the next step is the Practiceology mentor program, where we build your Vital Numbers, your systems and your team around you.</p>
    <p class="lead">Come and have a conversation with my team at <strong>healthbusinessprofits.com</strong> and we will map out what your One Minute Practice would look like.</p>
    <p class="note">This masterclass is educational only. No income or specific result is guaranteed. Results vary with your market, your team and your effort, and every practice is different.</p>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = s.html;
  deck.appendChild(el);
  const f = document.createElement('div');
  f.className = 'pagefoot';
  f.textContent = 'The One Minute Practice  ·  Paul Wright  ·  ' + (i+1) + ' / ' + S.length;
  deck.appendChild(f);
});
</script>
</body>
</html>
