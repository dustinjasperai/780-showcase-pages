<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priced to Win: a masterclass with Victor Antonio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sintony:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6faf6; --panel:#ffffff; --rule:#d7e6da;
    --ink:#121312; --muted:#44524a;
    --accent:#07612b; --accent2:#2ecc71;
    --head:'Sintony',sans-serif; --body:'Roboto',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:18px 0;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(7,97,43,.04)}
  .slide .kick{font-family:var(--head);font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.04;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:36px;line-height:1.1;
    margin-bottom:16px}
  p{font-size:20px;line-height:1.55;color:var(--muted);max-width:60ch;margin-bottom:12px}
  .lead{font-size:24px;color:var(--ink)}
  .big{font-family:var(--head);font-size:40px;line-height:1.12;color:var(--ink);
    font-weight:700;max-width:22ch}
  .accent{color:var(--accent)}
  .rulebar{width:64px;height:5px;background:var(--accent);border-radius:3px;margin:8px 0 26px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:21px;line-height:1.5;color:var(--ink);padding:14px 0 14px 34px;
    position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:0;top:22px;width:14px;height:14px;
    border-radius:4px;background:var(--accent2)}
  .num{font-family:var(--head);font-weight:700;color:var(--accent);font-size:17px;
    letter-spacing:.12em;text-transform:uppercase}
  .cred li:before{background:var(--accent)}
  .foot{font-size:14px;color:var(--muted);margin-top:28px}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;border-top:1px solid var(--rule);
    padding-top:16px;max-width:66ch}
  .cta h1{color:var(--accent)}
  .split{display:flex;gap:34px;flex-wrap:wrap}
  .split > div{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--rule);
    border-radius:10px;padding:22px}
  .split h3{font-family:var(--head);font-size:18px;margin-bottom:8px}
  .split p{font-size:17px;margin:0}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:'A live masterclass with Victor Antonio',
    h1:'Priced to Win',
    lead:'How to close at full margin without discounting.',
    foot:'Live, 60 minutes. For salespeople and sales teams.' },

  {t:'who',
    kick:'Who this is for',
    h2:'If you keep hearing "can you do better on price?"',
    p:['This is for reps, teams, and sales leaders who are winning deals but giving away margin to do it. If every close ends in a discount, the problem is not your price. It is that the buyer cannot see your value.'] },

  {t:'trap',
    kick:'The trap',
    h2:'The discount reflex',
    p:['The moment a buyer pushes back, the easiest lever to pull is price. It feels like progress. It closes the deal today.',
       'But it trains every future buyer to push, and it quietly tells them your first number was never real.'] },

  {t:'hook',
    kick:'The reframe',
    big:'Every dollar you discount comes straight off the bottom line. And off your credibility.',
    foot:'Discounting is the most expensive habit in sales, and the easiest to break.' },

  {t:'part', kick:'Part one', h1:'You are selling price, not value' },

  {t:'problem',
    kick:'The core problem',
    h2:'Cognitive load',
    p:['When a buyer cannot quickly understand what your offer returns, the decision feels risky. Price is the one number they do understand, so they default to it.',
       'The fix is not a better pitch. It is reducing the load, making the value so clear that price stops being the conversation.'] },

  {t:'problem2',
    kick:'What it costs you',
    h2:'The race to the bottom',
    p:['Once you compete on price, you have handed the buyer the only metric that matters to them. The next vendor just quotes lower.',
       'You win the deal and lose the margin, the relationship, and the next negotiation.'] },

  {t:'part', kick:'Part two', h1:'The system: Value-Centric Selling' },

  {t:'pillar',
    kick:'Pillar 1',
    h2:'The Value Trinity',
    p:['Every business buyer cares about exactly three things. Tie every pitch to one of them and the value becomes undeniable, even to the CFO.'],
    ul:['Increase revenue','Reduce costs','Expand or protect market share'] },

  {t:'pillar2',
    kick:'Pillar 1, in the room',
    h2:'Anchor on the outcome',
    p:['Before you ever name a number, name which of the three you move and by how much. Now your price is measured against a return, not against the competitor on the next call.'] },

  {t:'pillar',
    kick:'Pillar 2',
    h2:'The 8 Discount Countermeasures',
    p:['Eight concrete moves to hold your price when the buyer pushes, so you protect margin without walking away from the deal.'],
    ul:['Trade, never give: concede only for something back','Reframe to total value, not unit price','Shrink the scope before you shrink the price','Make the buyer justify the discount out loud'] },

  {t:'pillar2',
    kick:'Pillar 2, the mindset',
    h2:'A discount is a negotiation, not a reflex',
    p:['The rep who holds price is not being difficult. They are protecting the value the buyer is about to receive. Countermeasures give you a calm, repeatable answer instead of a flinch.'] },

  {t:'pillar',
    kick:'Pillar 3',
    h2:'Story-Selling',
    p:['Use insight-led narratives to pre-handle objections before they are ever raised. Three devices do most of the work:'],
    ul:['Anchoring: set the reference point first','Framing: shape how the number is read','Reciprocation: give insight, earn trust'] },

  {t:'pillar',
    kick:'Pillar 4',
    h2:'The Sales Velocity Formula',
    p:['Selling is not one skill, it is a set of dimensions from prospecting to pricing. Measure where velocity is lost and fix the specific lever instead of telling the team to work harder.'],
    foot:'In my own programs, teams applying the formula have seen roughly a 47% lift in sales productivity within 90 days.' },

  {t:'part', kick:'Part three', h1:'Inside a value-led call' },

  {t:'beforeafter',
    kick:'The fork in the road',
    h2:'Two versions of the same call',
    split:[
      {h3:'Price-led',p:'"It is $X." "Can you do better?" "...okay, $X minus 15%." Margin gone, trust dented.'},
      {h3:'Value-led',p:'"Here is the revenue this returns. Here is what it costs you to wait. The price is $X." The number is now cheap.'}] },

  {t:'why',
    kick:'Why listen to me',
    h2:'Victor Antonio',
    ul:['25+ years in corporate and executive sales, Fortune 500 background','Founder of Sales Velocity Academy, 500+ training videos','Keynote speaker and sales trainer worldwide','Author, "Priced to Win" (Wiley, 2026)'],
    cls:'cred' },

  {t:'recap',
    kick:'The three moves',
    h2:'Leave with this',
    ul:['Anchor every pitch to the Value Trinity','Answer the discount ask with a countermeasure, not a cut','Build the narrative so the objection never lands'] },

  {t:'cta',
    kick:'Put it to work',
    h1:'Go deeper',
    lead:'Everything in this session lives inside Sales Velocity Academy: the full Value-Centric Selling system, the 8 Discount Countermeasures, and the Sales Velocity Formula, step by step.',
    foot:'Join Sales Velocity Academy to put it to work with your team.',
    disc:'This masterclass is educational only. It shares a sales methodology, not a promise of income or results. Outcomes vary by person, team, market, and effort, and are not guaranteed.' }
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' '+s.cls : '') + (s.t==='cta' ? ' cta' : '');
  let html = '';
  if (s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if (s.t==='title' || s.t==='part' || s.t==='cta'){ html += '<div class="rulebar"></div>'; }
  if (s.h1) html += '<h1>'+s.h1+'</h1>';
  if (s.h2) html += '<h2>'+s.h2+'</h2>';
  if (s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if (s.big) html += '<div class="big">'+s.big+'</div>';
  if (s.p) for (const para of s.p) html += '<p>'+para+'</p>';
  if (s.ul){ html += '<ul>'; for (const li of s.ul) html += '<li>'+li+'</li>'; html += '</ul>'; }
  if (s.split){ html += '<div class="split">'; for (const c of s.split) html += '<div><h3>'+c.h3+'</h3><p>'+c.p+'</p></div>'; html += '</div>'; }
  if (s.foot) html += '<div class="foot">'+s.foot+'</div>';
  if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
