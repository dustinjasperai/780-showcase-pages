<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Six Focuses of a Tattoo Business · Matt Hodel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#232c1c; --panel:#2e3823; --rule:#4a5738;
    --ink:#f2f1ea; --accent:#ffcd05; --grey:#c7cbb9; --dim:#8f9581; --data:#ffdb52;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--ink);line-height:1.18;letter-spacing:-.01em}
  .t-title h1{font-size:3.4vw;max-width:88%}
  .t-normal h1{font-size:2.5vw;max-width:84%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.35vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.58;font-weight:400}
  .sub{font-family:'Montserrat',sans-serif;font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.3vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:2.7vw;max-width:82%;font-style:italic;color:var(--ink);font-weight:600}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:2.9vw;max-width:80%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .ledger-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-ledger{right:6%;bottom:8%;width:16vw}
  .corner-ledger{right:6%;bottom:7%;width:6.6vw;opacity:.55}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.2vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600;font-family:'Montserrat',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700;font-family:'Montserrat',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Montserrat',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.6vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Jackpot Coaching</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ledger motif: a ruled appointment-book line with tick marks, echoing a shop's own
     booking ledger and the six-focuses list structure, over a generic growth-arrow or dial -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ledger" viewBox="0 0 260 140">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M14,26 H246" stroke="#4a5738" opacity="0.9"/>
    <path d="M14,58 H246" stroke="#4a5738" opacity="0.9"/>
    <path d="M14,90 H190" stroke="#4a5738" opacity="0.9"/>
    <path d="M14,122 H150" stroke="#ffcd05" opacity="0.95"/>
    <circle cx="150" cy="122" r="6" fill="#ffcd05" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Six Focuses of a Tattoo Business',sub:'A masterclass for tattoo shop owners and artists on running the business side well enough to protect the creative side, not the other way around.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You went into tattooing to make art, and now half your week disappears into client chaos, money stress, and scheduling nobody taught you how to run.',body:'Most shop owners never trained to run a business. You learned to tattoo, then one day you were also the bookkeeper, the marketer, the HR department, and the person who has to say no to a client you need the money from. Nobody handed you a system for any of it.'},
 {t:'dark',title:'More talent in the chair does not fix a business you never learned to run.'},

 {t:'section',idx:'Part One',title:'Why the Business Side Keeps Eating the Creative Side'},
 {t:'normal',k:'Clientele you cannot predict',title:'Bookings swing between overbooked and empty because there is no real system for who you are trying to reach or how they find you.',body:'Without a clear read on your ideal client and a way to turn their networks into referrals, every week starts from zero. Feast or famine is not a personality trait of the tattoo industry, it is what happens when clientele is left to chance.'},
 {t:'normal',k:'Money treated as a mystery instead of a system',title:'No cash reserve means every slow month turns into a client you take on because you need the money, not because you want the work.',body:'A healthier relationship with money is not about making more of it, it is about understanding your own value and building enough of a reserve that a bad week does not force a bad decision.'},
 {t:'dark',title:'You do not need another apprenticeship. You need a business that runs like one.'},

 {t:'section',idx:'Part Two',title:'The Six Focuses of Business'},
 {t:'normal',k:'Focus 1: Clientele Management',title:'Design the business around the client you actually want, then let their own network bring you more of them.',body:'Understanding your target client well enough to build around them, and treating every great client relationship as a source of the next one, replaces guesswork with a repeatable pipeline.'},
 {t:'normal',k:'Focus 2: Online Management',title:'Build a digital footprint that carries a stranger from first seeing your work to booking the consult.',body:'A claimed and complete Google Business Profile with managed reviews, a website built around FAQs and booking, a social presence focused on where your audience already is, and visibility through podcasts and press, mapped to Awareness, Consideration, and Commitment.'},
 {t:'normal',k:'Focus 3: Time Management',title:'Structure the week, month, and year with real boundaries instead of whatever is loudest that day.',body:'Separating urgent from important turns a schedule that runs you into one you run, with room left over for the creative work that got you into this in the first place.'},
 {t:'normal',k:'Focus 4: Money Management',title:'Build a healthier relationship with money and a real reserve, so no client decision is made out of desperation.',body:'Understanding your own value as an artist changes what you charge and who you say yes to, and a cash reserve is what makes that possible in practice, not just in theory.'},
 {t:'normal',k:'Focus 5: Career Management',title:'Set real direction with goals and benchmarks instead of just staying busy.',body:'A growth mindset paired with actual management systems is what turns "I own a shop" into "I am running a business with a direction," on purpose instead of by accident.'},
 {t:'normal',k:'Focus 6: People Management',title:'Communication, boundaries, and mutual respect across clients, coworkers, and employees.',body:'A shop is a room full of relationships before it is anything else. The sixth focus is what keeps clients, artists, and staff working with you instead of around you.'},
 {t:'dark',title:'Proven inside a shop that is still open, still tattooing, every single day.'},

 {t:'section',idx:'Part Three',title:'Why Matt Hodel'},
 {t:'normal',k:'A working shop owner, not a theory coach',title:'28 years tattooing, and still the owner of Ragtime Tattoo, a real, currently operating shop.',body:'He built Ragtime after getting sober, specifically so artists could have their own business. Everything in the Six Focuses gets tested against his own shop before it ever becomes something he teaches.'},
 {t:'normal',k:'A licensed coaching credential behind it',title:'A Certified Coach, trained and licensed by Business Made Simple to coach clients through running and growing their business.',body:'That license adds a real methodology, resource library, and coaching community on top of the operator experience, so the Six Focuses is not just personal opinion, it is a working shop owner applying a licensed framework to his own industry.'},

 {t:'section',idx:'Your Next Step',title:'Protect the Creative Side'},
 {t:'normal',k:'How it works',title:'A quick conversation to assess your business, then a coaching relationship built around whichever of the Six Focuses is costing you the most right now.',body:'Every shop is different, so the starting point gets discussed directly rather than assumed. The goal from the first call is the same one behind everything above: less time lost to the business side, more of it protected for the creative side.'},
 {t:'cta',title:'Ready to run the business side like you already run the chair?',chips:['Call Matt to assess your business'],disc:'Educational content for tattoo shop owners and artists. No income, growth, or business result is guaranteed. Results vary by shop, market, and effort.'},
];

const deck=document.getElementById('deck');
function ledgerSvg(kind){return `<svg class="ledger-motif ${kind==='title'?'title-ledger':'corner-ledger'}"><use href="#ledger"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Jackpot <b>Coaching</b> &middot; Matt Hodel</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=ledgerSvg(s.arc);
  else if(s.t==='title') h+=ledgerSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
