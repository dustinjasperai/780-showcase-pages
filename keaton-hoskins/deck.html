<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Attracted Life — Keaton Hoskins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6efeb; --panel:#fffdfb; --rule:#e6ddd7;
    --ink:#1a1714; --muted:#6b6058; --accent:#ed2530;
    --head:"Fira Sans",sans-serif; --body:"Nunito Sans",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:52px 48px;margin:0 0 22px;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--head);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:16px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:30px;line-height:1.12;margin-bottom:16px}
  p{font-size:18px;color:var(--ink);margin-bottom:14px;max-width:62ch}
  p.muted{color:var(--muted)}
  .big{font-size:26px;font-weight:600;line-height:1.3}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:18px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;background:var(--accent);border-radius:3px}
  .pillars{display:flex;gap:10px;align-items:flex-end;margin-top:22px}
  .pillar{flex:1;background:var(--bg);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:6px 6px 0 0;padding:16px 10px;text-align:center;font-family:var(--head);font-weight:600;font-size:14px}
  .tag{display:inline-block;font-family:var(--head);font-weight:600;font-size:13px;color:var(--muted);border:1px solid var(--rule);border-radius:20px;padding:5px 14px;margin:0 6px 8px 0}
  .cta h1{color:var(--ink)}
  .step{font-family:var(--head);font-weight:800;font-size:22px;color:var(--accent);margin:18px 0 8px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;border-top:1px solid var(--rule);padding-top:16px;max-width:70ch}
  .num{position:absolute;right:30px;top:26px;font-family:var(--head);font-weight:800;font-size:13px;color:var(--rule)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:'title', kick:'A Live Masterclass with Keaton Hoskins', h:'The Attracted Life', sub:'Why the success you want comes to who you become, not to who you chase. The inner game behind twenty businesses, built for entrepreneurs who are tired of grinding for a finish line that keeps moving.'},
  {t:'who', kick:'Who this is for', h:'You have already done the hard part.', body:['You have built something real. You work harder than almost anyone you know. You have read the books and run the playbooks.','And quietly, a lot of nights still end the same way: more revenue, more to manage, and the same hollow feeling that the win was supposed to fix.'], big:'This room is for the entrepreneur who is successful on paper and still feels behind.'},
  {t:'hook', kick:'The reframe', h:'You do not have a strategy problem.', body:['You have a pursuit problem.','Every tactic you add is aimed at catching something. But the thing you are chasing moves the moment you reach it. That is not a work-rate issue. It is a direction issue, and no amount of hustle fixes a direction.']},
  {t:'part', kick:'Part One', h:'The pursuit trap', body:['I spent my first decade in full pursuit. More companies, more muscle, more proof. I caught a lot of it, and it changed almost nothing about how I felt.','Pursuit makes you faster at running toward a line that is painted on the ground in front of you. You never cross it, because you are the one holding the brush.']},
  {t:'big', kick:'The shift', big:'Success is not pursued. It is attracted.', body:['You do not become worthy of the result by chasing it harder. You become the kind of person the result is drawn to. The work moves from out there to in here, and everything downstream changes.']},
  {t:'part', kick:'Part Two', h:'The frameworks', body:['Attraction is not a mood. It is a set of things you build on purpose, in an order that holds up under pressure.','Here is the structure I teach inside Limitless Society.']},
  {t:'pillars', kick:'Framework 1', h:'The Five Pillars of Success', body:['Most people chase the fifth pillar and neglect the first four. So the fifth never holds.','Tend these four and financial health stops being something you hunt. It becomes something your life produces.']},
  {t:'list', kick:'Framework 1, continued', h:'Why the order matters', list:['Physical health is the engine. Nothing else runs well on an empty one.','Mental health is the steering. It decides where the engine points.','Emotional health is the fuel line. Resentment and fear clog it quietly.','Spiritual health is the map. It is the sense of why, under the what.','Financial health is the destination you reach by driving the other four well.']},
  {t:'big', kick:'Framework 2', h:'The Younger Self', big:'Become the adult your six-year-old self needed.', body:['The gaps that sabotage a grown business almost always started small. An absence of boundaries. Money fear learned at a kitchen table. Affirmation that never came.','You do not scale past those by working more. You resolve them, and the business stops leaking through the cracks they left.']},
  {t:'list', kick:'Framework 2, continued', h:'What the inner work actually clears', list:['The leadership gap that makes you avoid the hard conversation.','The scarcity reflex that makes you underprice and overwork.','The permission problem that keeps you shrinking the vision.','The approval hunger that lets other people set your pace.']},
  {t:'big', kick:'Framework 3', h:'Dream vs Daydream', big:'A dream creates a vision. A daydream just passes the time.', body:['My father kept a clear vision while he was dying, and executed on it daily, walking with an oxygen tank to keep a promise.','A real dream shows up in your calendar. If it never touches today, it was a daydream, and daydreams are where ambitious people hide from execution.']},
  {t:'part', kick:'Part Three', h:'A real week, run on attraction', body:['This is not a mindset you feel once at a seminar and lose by Friday.','It is a cadence. Pillars tended on a schedule. The younger-self work done in the open with people who will not let you perform. A vision small enough to act on this week and big enough to be worth it.']},
  {t:'list', kick:'The shift, concretely', h:'From chasing to attracting', list:['You stop setting goals that punish you and start building a self that makes them natural.','You make decisions from a full tank instead of a fear reflex.','You lead people instead of managing your own anxiety through them.','You let the result catch up to who you have quietly become.']},
  {t:'why', kick:'Why me', h:'The Muscle, and the twenty businesses behind him', body:['You may know me as The Muscle from Diesel Brothers. Most people do not know the twenty-plus companies, or the decade of pursuit it took to learn that the grind was the wrong teacher.','I am not selling you the version where I always had it figured out. I am handing you the version I wish someone had handed me a decade earlier.']},
  {t:'big', kick:'The promise', big:'Build the person. The success is attracted to the person.', body:['That is the whole game, and it is the opposite of what the feed keeps selling you.']},
  {t:'cta', kick:'Your door in', h:'Come build the attracted life inside Limitless Society.', step:'Your next step: join the Limitless Society community.', body:['Weekly live training, the Five Pillars and Younger Self work in practice, and a room of entrepreneurs who will hold you to the vision instead of the grind.','If this landed, that is the door.'], disc:'This masterclass is educational. No income, revenue, or result is guaranteed. Results vary and depend on your own effort, market, and circumstances.'}
];
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const PILLARS=['Physical','Mental','Emotional','Spiritual','Financial'];
function render(){
  const root=document.getElementById('deck');
  S.forEach(function(s,i){
    let h='<div class="slide '+(s.t==='cta'?'cta':'')+'"><span class="num">'+(i+1)+' / '+S.length+'</span>';
    if(s.kick) h+='<div class="kick">'+esc(s.kick)+'</div>';
    if(s.h) h+='<h1>'+esc(s.h)+'</h1>';
    if(s.big) h+='<p class="big">'+esc(s.big)+'</p>';
    if(s.step) h+='<div class="step">'+esc(s.step)+'</div>';
    if(s.body) s.body.forEach(function(b){h+='<p>'+esc(b)+'</p>'});
    if(s.t==='pillars'){h+='<div class="pillars">';PILLARS.forEach(function(p){h+='<div class="pillar">'+p+'</div>'});h+='</div>';}
    if(s.list){h+='<ul>';s.list.forEach(function(li){h+='<li>'+esc(li)+'</li>'});h+='</ul>';}
    if(s.disc) h+='<div class="disc">'+esc(s.disc)+'</div>';
    h+='</div>';
    root.insertAdjacentHTML('beforeend',h);
  });
}
render();
</script>
</body>
</html>
