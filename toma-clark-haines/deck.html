<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profit Is in the Buy — a masterclass with The Antiques Diva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fcf9f4;
    --panel:#f3ece0;
    --rule:#e4dccf;
    --ink:#39352d;
    --muted:#817f79;
    --accent:#9f8752;
  }
  html,body{height:100%}
  body{background:var(--panel);font-family:'DM Sans',-apple-system,sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{position:relative;width:min(96vw,1180px);aspect-ratio:16/9;background:var(--bg);
    box-shadow:0 30px 80px rgba(57,53,45,.16);border:1px solid var(--rule);overflow:hidden}
  .slide{position:absolute;inset:0;padding:6.2% 7.4%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Marcellus',Georgia,serif;font-weight:400;font-size:56px;line-height:1.08;color:var(--ink);letter-spacing:.005em}
  h2{font-family:'Marcellus',Georgia,serif;font-weight:400;font-size:42px;line-height:1.12;color:var(--ink)}
  .sub{font-size:24px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:82%}
  .body{font-size:22px;line-height:1.6;color:var(--ink);margin-top:20px;max-width:80%}
  .lead{font-family:'Marcellus',Georgia,serif;font-size:120px;line-height:1;color:var(--accent)}
  ul{list-style:none;margin-top:26px;max-width:84%}
  li{font-size:22px;line-height:1.45;color:var(--ink);padding:14px 0 14px 40px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:2px;background:var(--accent)}
  .note{font-size:16px;color:var(--muted);margin-top:26px;font-style:italic;max-width:80%}
  .tag{display:inline-block;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;padding:7px 16px;margin-bottom:26px;font-weight:600}
  .part .lbl{font-size:17px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:16px}
  .dark{background:var(--ink)}
  .dark h1,.dark h2{color:#f6efe3}
  .dark .sub{color:#cfc4b2}
  .dark .kick{color:#c2a15e}
  .pillar .pn{font-family:'Marcellus',Georgia,serif;font-size:22px;color:var(--accent);letter-spacing:.02em;margin-bottom:10px}
  .cta-box{border-top:2px solid var(--accent);padding-top:28px;margin-top:8px}
  .cta-do{font-family:'Marcellus',Georgia,serif;font-size:30px;color:var(--ink);margin-top:14px}
  .disc{font-size:14px;color:var(--muted);margin-top:30px;max-width:82%;line-height:1.5}
  .foot{position:absolute;left:7.4%;right:7.4%;bottom:4%;display:flex;justify-content:space-between;
    align-items:center;font-size:13px;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
  .dark .foot{color:#b2afa8;border-top-color:rgba(246,239,227,.18)}
  #nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;
    font-size:13px;color:var(--muted);font-weight:500}
  #nav button{background:var(--bg);border:1px solid var(--rule);color:var(--ink);border-radius:999px;
    width:34px;height:34px;cursor:pointer;font-size:16px}
  #count{min-width:52px;text-align:center;letter-spacing:.1em}
  @media(max-width:760px){h1{font-size:34px}h2{font-size:27px}.sub,.body,li{font-size:17px}.lead{font-size:74px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev" aria-label="Previous">&#8249;</button><span id="count"></span><button id="next" aria-label="Next">&#8250;</button></div>
<script>
const BRAND = "The Antiques Diva &middot; Toma Clark Haines";
const S = [
  {t:'title', kick:'A live masterclass for antique dealers', h:'The Profit Is in the Buy', sub:'Why the dealers who last make their money the day they buy, not the day they sell, and the sourcing to sale system behind it.'},
  {t:'who', h:'Who this hour is for', sub:'You already love the pieces. This is for the dealer who wants the business to love them back.', list:['The new dealer who is unsure what to stock and what to pay','The working dealer whose floor is full but slow to move','Anyone sitting on capital tied up in the wrong inventory']},
  {t:'trap', kick:'The trap', h:'Most dealers price by hope', body:'You find something beautiful, you pay what feels fair, and you set a price you wish it would fetch. Then it sits. The love is real. The margin is an accident.'},
  {t:'reframe', dark:true, kick:'The reframe', h:'A piece earns its profit the day you buy it', sub:'The sale only collects it. If the buy is wrong, no shop window, no story and no discount can fix the math later.'},
  {t:'part', lbl:'Part One', h:'Why good taste is not enough'},
  {t:'point', h:'Taste tells you what is lovely', body:'It does not tell you what is scarce, what is rising, what will move in your market this season, or what you can source again if it sells. A collection grows on taste. A business grows on all four.'},
  {t:'point', h:'The money is made in three quiet decisions', list:['Where you source and who you buy from','What you are willing to pay for a given piece','How fast you can turn it once it lands']},
  {t:'part', lbl:'Part Two', h:'The Antiques Diva method'},
  {t:'pillar', pn:'Pillar 1', h:'Source it right', body:'The right inventory rarely comes from the obvious places. Build a handful of reliable sources, learn a market before you buy in it, and treat sourcing as the skill that sets everything else.'},
  {t:'pillar', pn:'Pillar 2', h:'Read the piece', body:'Before you pay, know its condition, its story, its comparable prices, and whether restoration adds value or eats it. A piece you can describe with authority is a piece you can sell with confidence.'},
  {t:'pillar', pn:'Pillar 3', h:'Buy to a number', body:'Sourced well, quality pieces carry room for a healthy markup. Decide your target margin before you buy, not after. If the number does not work at the buy, you walk. That discipline is the whole game.'},
  {t:'pillar', pn:'Pillar 4', h:'Move it, do not store it', body:'A system that follows a piece from purchase, through your inventory, to the moment it sells. Turnover is oxygen. Storage is a slow leak. Know what each piece costs you every month it stays.'},
  {t:'pillar', pn:'Pillar 5', h:'Sell the worth, not the tag', body:'Buyers pay for understanding. When you can tell a buyer why a piece is worth its price, in the shop and in writing, you stop competing on the number alone and start being remembered.'},
  {t:'part', lbl:'Part Three', h:'What the method looks like'},
  {t:'point', h:'One good buy, worked all the way through', body:'You source a piece you can describe and defend. You buy it to a number that already holds your margin. You position it with a real story, place it in the right channel, and it moves while it is still fresh. Then you do it again.'},
  {t:'point', kick:'The shift', h:'From a floor of favourites to a floor that works', sub:'Same eye. Same love of the trade. A buying discipline underneath it that turns beautiful things into a business that pays.'},
  {t:'recap', kick:'If you remember one thing', h:'Make your margin at the buy', sub:'Everything today points back to that. Source with intent, buy to a number, move it while it is fresh, and sell the worth.'},
  {t:'cred', kick:'Why listen to me on this', h:'The Antiques Diva', body:'I built The Antiques Diva and Co into the world’s largest antiques sourcing company, with local guides across fourteen countries and two continents. I have spent that time watching what separates a dealer who lasts from one who burns out, and it almost always starts at the buy.'},
  {t:'cta', kick:'Where to take this next', h:'Let us look at your buying', cta:'Book your complimentary consultation with The Antiques Diva and we will walk through your sourcing, your margins, and the pieces sitting too long.', disc:'This masterclass is educational. No income or sales result is guaranteed. Results vary with the pieces you source, your market, and the work you put in.'}
];

const stage = document.getElementById('stage');
function esc(s){return s;}
function render(s){
  let inner = '';
  const kick = s.kick ? `<div class="kick">${s.kick}</div>` : '';
  if(s.t==='title'){
    inner = `<div class="tag">The Antiques Diva</div>${kick}<h1>${s.h}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:''}`;
  } else if(s.t==='part'){
    inner = `<div class="part"><div class="lbl">${s.lbl}</div><h1>${s.h}</h1></div>`;
  } else if(s.t==='reframe'){
    inner = `${kick}<h1>${s.h}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:''}`;
  } else if(s.t==='pillar'){
    inner = `<div class="pillar"><div class="pn">${s.pn}</div><h2>${s.h}</h2>${s.body?`<div class="body">${s.body}</div>`:''}</div>`;
  } else if(s.t==='cta'){
    inner = `${kick}<h1>${s.h}</h1><div class="cta-box"><div class="cta-do">${s.cta}</div></div><div class="disc">${s.disc}</div>`;
  } else if(s.t==='recap'||s.t==='cred'){
    inner = `${kick}<h1>${s.h}</h1>${s.body?`<div class="body">${s.body}</div>`:''}${s.sub?`<div class="sub">${s.sub}</div>`:''}`;
  } else {
    inner = `${kick}<h2>${s.h}</h2>`;
    if(s.body) inner += `<div class="body">${s.body}</div>`;
    if(s.sub) inner += `<div class="sub">${s.sub}</div>`;
    if(s.list) inner += `<ul>${s.list.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    if(s.note) inner += `<div class="note">${s.note}</div>`;
  }
  const foot = s.t==='title' ? '' : `<div class="foot"><span>${BRAND}</span><span>The Profit Is in the Buy</span></div>`;
  return `<div class="slide${s.dark?' dark':''}" data-i>${inner}${foot}</div>`;
}
stage.innerHTML = S.map(render).join('');
const slides = [...stage.querySelectorAll('.slide')];
let i = 0;
function show(n){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((el,x)=>el.classList.toggle('on', x===i));
  document.getElementById('count').textContent = (i+1)+' / '+slides.length;
}
document.getElementById('next').onclick = ()=>show(i+1);
document.getElementById('prev').onclick = ()=>show(i-1);
stage.onclick = (e)=>{ if(e.clientX < window.innerWidth/2) show(i-1); else show(i+1); };
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight'||e.key===' ') show(i+1);
  else if(e.key==='ArrowLeft') show(i-1);
});
show(0);
</script>
</body>
</html>
