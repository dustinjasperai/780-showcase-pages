<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Creative Life Is Your Real Life &middot; A live masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f4;
    --panel:#f3ece2;
    --rule:#8a9a7b;
    --accent:#e24c8f;
    --ink:#2b2622;
    --deep:#7a2448;
    --dim:#4d4d4d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"EB Garamond",Georgia,serif;
    font-size:clamp(18px,2.4vw,26px);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:960px}
  .slide.on{display:block;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:"EB Garamond",serif;font-style:italic;letter-spacing:.04em;color:var(--deep);font-size:.74em;margin-bottom:1.1em}
  .kicker .mark{color:var(--accent);font-style:normal;margin-right:.4em}
  h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(2.4em,6vw,3.5em);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(1.7em,4.2vw,2.5em);line-height:1.1}
  .sub{font-family:"EB Garamond",serif;font-style:italic;color:var(--dim);font-size:1.15em;margin-top:.8em;max-width:36ch}
  .body p{margin-top:.85em;max-width:44ch}
  .em{color:var(--deep)}
  .accent{color:var(--accent)}
  .rule{height:2px;width:72px;background:var(--rule);margin:1.3em 0;border-radius:2px}
  ul{list-style:none;margin-top:1em}
  ul li{position:relative;padding-left:1.6em;margin-top:.7em;max-width:46ch}
  ul li::before{content:"\21A0";position:absolute;left:0;color:var(--accent)}
  .pill{display:inline-block;font-style:italic;color:var(--deep);border:1px solid var(--rule);border-radius:999px;padding:.15em .9em;font-size:.72em;margin-bottom:1em}
  .card{background:var(--panel);border-left:3px solid var(--accent);padding:1.1em 1.3em;border-radius:4px;margin-top:1.1em;max-width:48ch}
  .card h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.25em;color:var(--deep)}
  .card p{font-size:.92em;color:var(--dim);margin-top:.25em}
  .note{font-style:italic;color:var(--dim);font-size:.9em;margin-top:1.4em;max-width:46ch}
  .cta-line{font-family:"Cormorant Garamond",serif;font-size:1.2em;color:var(--deep);margin-top:.9em}
  .disc{font-size:.68em;color:var(--dim);margin-top:2.2em;max-width:52ch;line-height:1.45}
  #nav{position:fixed;bottom:18px;right:24px;font-size:13px;color:var(--dim);font-family:"EB Garamond",serif}
  #nav b{color:var(--accent)}
  .foot{position:fixed;bottom:18px;left:24px;font-size:12px;color:var(--rule);font-family:"EB Garamond",serif;font-style:italic}
</style>
</head>
<body>
<div id="stage"></div>
<div class="foot">For the Birds &middot; a live masterclass</div>
<div id="nav"><b id="cur">1</b> / <span id="tot"></span></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Sarah Teresa Cook', h:'Your Creative Life <span class="accent">Is</span> Your Real Life', sub:'A gentle, sustainable way to make your work, built for sensitive and neurodivergent writers.'},
  {t:'promise', kicker:'What you will leave with', h:'A creative life you can actually keep', body:['Not another system that works for two weeks and then quietly breaks you.', 'A way of making that is built around your real energy, your sensitivity, and the way your mind actually works.']},
  {t:'who', kicker:'Who this is for', h:'If this sounds like you', bullets:['You have real creative dreams and a stack of half-finished starts.','You are tenderhearted, highly sensitive, or neurodivergent, and most advice seems written for someone else.','You are tired of pushing through, then crashing, then calling yourself lazy.']},
  {t:'trap', kicker:'The trap', h:'The problem was never your discipline', body:['You were handed one story: if you just wanted it badly enough, you would show up every day and grind it out.', 'So when the grind breaks you, you decide the problem is you.']},
  {t:'reframe', kicker:'A harder truth', h:'The advice was built for a different nervous system', body:['Hustle creativity assumes a steady, bottomless tank of energy and a mind that runs in straight lines.', 'Yours does not. That is not a flaw to fix. It is information about how you are built to make.']},
  {t:'part', pill:'Part one', h:'Why willpower keeps failing you', body:['Masking all day leaves little left for the page.', 'Shame is a terrible creative fuel. It gets a burst, then a shutdown.', 'When the only tool is force, a sensitive system learns to brace against its own creativity.']},
  {t:'part', pill:'Part one', h:'So the real question changes', body:['Not "how do I force myself to produce more."', 'But "what does my creativity actually need from me so it can stay alive."'], note:'That question has an answer, and it has three parts.'},
  {t:'framework', kicker:'The framework', h:'The creative ecosystem', sub:'Your creativity is a living system with three needs, not a machine with one switch.', body:['When one need goes unmet, the whole thing stalls. Most advice only ever touches the first.']},
  {t:'pillar', pill:'Need one', h:'Practical', card:{title:'Habits, skills, and your real energy', body:'A rhythm sized to the energy you actually have, not the energy you wish you had. Small, repeatable, forgiving.'}},
  {t:'pillar', pill:'Need two', h:'Emotional', card:{title:'Honoring the tender and the wounded', body:'Trauma-informed care for the doubt, the imposter feeling, and the old stories. We work with the fear instead of bulldozing it.'}},
  {t:'pillar', pill:'Need three', h:'Spiritual', card:{title:'Ritual, wonder, and the more-than-human world', body:'Purpose, play, and attention. The part that makes the work feel like nourishment instead of another task.'}},
  {t:'part', pill:'Part two', h:'Decolonizing the calendar', body:['Not every month is a harvest month.', 'A seasonal pace of fruitfulness means some seasons are for rest, some for root, and some for bloom.'], note:'Permission replaces pressure. Internal cues replace external mandates.'},
  {t:'signature', kicker:'A practice you can try', h:'Becoming your own oracular guide', body:['The objects and creatures you already notice, birds, weather, overheard words, can become a resource for inspiration and decision-making.', 'Part channeling, part poetry. A way to pay attention that gives something back.']},
  {t:'part', pill:'Part three', h:'What a sustainable practice looks like', body:['A week with room in it. A season you can plan around your energy, not against it.', 'Work that moves forward in small, steady, honest increments, and a self-trust that survives the slow stretches.']},
  {t:'looks', kicker:'In practice', h:'From forcing to tending', bullets:['You stop measuring yourself against someone else’s output.','You build one small ritual you can keep on a low-energy day.','You learn to read your own seasons and plan with them.','You make things that feel true, without masking to do it.']},
  {t:'whyme', kicker:'Why me', h:'I built this from my own life', body:['I am a lifelong writer and poet, a trauma-informed creative coach, and late-diagnosed autistic.', 'I built For the Birds as a home for tenderhearted, divergent creative humans, and this is the work I do with them every month.']},
  {t:'recap', kicker:'The whole thing, in one breath', h:'Your creativity has three needs', body:['Practical, emotional, spiritual.', 'Tend all three, at a pace that honors how you are wired, and the work stops breaking you and starts sustaining you.']},
  {t:'invite', kicker:'If you want to go deeper', h:'You do not have to do this alone', body:['My one-on-one Creative Coaching and Mentorship is where we build your version of this ecosystem together, slowly and sustainably.']},
  {t:'cta', kicker:'Your next step', h:'Book an intro call', body:['If the way I think resonates, come find me. We will talk about where your creative life actually is and whether working together makes sense.'], ctaLine:'Start at sarahteresacook.com, or begin inside For the Birds.', disc:'This masterclass is educational. No specific creative, publishing, or financial result is guaranteed. Results vary and depend on your own practice, circumstances, and effort.'},
];

const stage = document.getElementById('stage');
document.getElementById('tot').textContent = S.length;
let i = 0;
function esc(x){return x;}
function render(){
  const s = S[i];
  let h = '<div class="slide on">';
  if(s.pill){ h += '<span class="pill">'+s.pill+'</span>'; }
  if(s.kicker){ h += '<div class="kicker"><span class="mark">&#8608;</span>'+s.kicker+'</div>'; }
  if(s.h){ h += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>'); }
  if(s.sub){ h += '<div class="sub">'+s.sub+'</div>'; }
  if(s.t!=='title'){ h += '<div class="rule"></div>'; }
  if(s.body){ h += '<div class="body">'+s.body.map(p=>'<p>'+p+'</p>').join('')+'</div>'; }
  if(s.bullets){ h += '<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>'; }
  if(s.card){ h += '<div class="card"><h3>'+s.card.title+'</h3><p>'+s.card.body+'</p></div>'; }
  if(s.note){ h += '<div class="note">'+s.note+'</div>'; }
  if(s.ctaLine){ h += '<div class="cta-line">'+s.ctaLine+'</div>'; }
  if(s.disc){ h += '<div class="disc">'+s.disc+'</div>'; }
  h += '</div>';
  stage.innerHTML = h;
  document.getElementById('cur').textContent = (i+1);
}
function go(n){ i = Math.max(0, Math.min(S.length-1, n)); render(); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '){ go(i+1); }
  else if(e.key==='ArrowLeft'){ go(i-1); }
});
stage.addEventListener('click', ()=>go(i+1));
render();
</script>
</body>
</html>
