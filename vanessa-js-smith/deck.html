<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confident Hand &amp; Wrist Care at First Contact — OrthoRefresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7faf9;        /* paper-white ground, from site light scheme #ecf0f1 */
    --panel:#ffffff;
    --ink:#161e2a;       /* their navy */
    --muted:#4a5560;
    --rule:#dfe6e5;
    --accent:#039988;    /* their dominant brand teal (brand.json, 12 uses) */
    --head:'Zilla Slab',Georgia,serif;
    --body:'Public Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 60px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(22,30,42,.03);
    background-image:radial-gradient(rgba(22,30,42,.018) 1px,transparent 1px);
    background-size:5px 5px;
  }
  .slide::before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:4px;
    background:var(--accent);border-radius:4px}
  .k{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:16px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:33px;line-height:1.12;margin-bottom:16px}
  p{font-size:19px;color:var(--muted);margin-bottom:12px;max-width:62ch}
  p.lead{font-size:21px;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;color:var(--ink);padding:11px 0 11px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;
    background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .big{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.1;color:var(--ink)}
  .big span{color:var(--accent)}
  .foot{position:absolute;right:30px;bottom:20px;font-family:var(--head);font-weight:700;
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.45}
  .disc{font-size:14px;color:var(--muted);margin-top:18px;max-width:66ch}
  .cta{font-family:var(--head);font-weight:700;color:var(--accent);font-size:20px;margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',k:'A live masterclass for frontline clinicians',
   h:'Confident Hand &amp; Wrist Care at First Contact',
   p:'What to splint, what to refer, and how to know the difference. Taught by a PA who has spent 15 years in orthopedic hand surgery.'},

  {t:'who',k:'Who this is for',
   h:'You see the injury first',
   p:'Family medicine, urgent and acute care, emergency medicine, occupational medicine. PAs, NPs, physicians, athletic trainers and students who meet the hand and wrist complaint before any specialist does.'},

  {t:'trap',k:'The moment',
   h:'A wrist comes in at 2pm and the clock starts',
   p:'You have a swollen wrist, an X-ray you are not certain about, and a patient watching your face. The safe move feels like "refer it out." So most of them get referred out.'},

  {t:'reframe',k:'The hard truth',
   big:'Most hand and wrist cases do not need a specialist. <span>They need you to be sure.</span>'},

  {t:'part',k:'Part one',h:'Why first-contact ortho goes sideways',
   p:'It is almost never knowledge. It is that nobody taught you the first-contact sequence in a way that holds up when the room is busy.'},

  {t:'cols',k:'The core problem',h:'Three gaps that turn into a referral',
   li:['The exam blurs together, so findings do not localize','The X-ray gets a glance, not a read','The splint feels like a guess, so you avoid committing to one']},

  {t:'part',k:'Part two',h:'The first-contact workup',
   p:'A repeatable sequence you can run on any hand or wrist complaint, in order, every time. This is the spine of everything that follows.'},

  {t:'cols',k:'Pillar one',h:'History that points somewhere',
   p:'Mechanism, timing, and the few red flags that change the plan.',
   li:['What actually happened, in their words','When it happened and what they have done since','The handful of answers that mean "do not splint this, send it"']},

  {t:'cols',k:'Pillar two',h:'The focused exam',
   p:'A small set of moves that localize the problem instead of a general poke.',
   li:['Inspect, then palpate the landmarks that matter','The provocative moves for the common culprits','Document the positive and the telling negative']},

  {t:'cols',k:'Pillar three',h:'Read the image with confidence',
   p:'Interpret the hand and wrist film well enough to make the call yourself.',
   li:['The views you actually need','A reading order so nothing gets skipped','What is "splint and follow" versus what is "refer today"']},

  {t:'cols',k:'Pillar four',h:'Splint it right the first time',
   p:'Choose the splint, apply it well, and stop deferring the one thing the patient came for.',
   li:['Match the splint to the injury','Apply it so it holds and does not harm','Set the follow-up and the return precautions']},

  {t:'part',k:'Part three',h:'The same 2pm wrist, handled',
   p:'Same busy clinic, same wrist at 2pm. This time you run the sequence, read the film, splint it, document it in one pass, and the patient leaves cared for.'},

  {t:'cols',k:'The payoff',h:'Refer smarter, not more',
   li:['More managed in-house, with less second-guessing','Fewer unnecessary referrals clogging the specialist','Cleaner documentation that protects you','A patient who got treated at the first visit']},

  {t:'why',k:'Why me',h:'A hand-surgery PA who does this every day',
   p:'15 years as a PA in orthopedic hand surgery, with a background in athletic training. OrthoRefresh exists to equip the clinicians who see these injuries first, because that is where patient care is really decided.'},

  {t:'recap',k:'The method, in one line',
   big:'History. Exam. Image. <span>Splint.</span> Then document it once.'},

  {t:'cta',k:'Your next step',h:'Go deeper with OrthoRefresh',
   p:'If you want the full first-contact system with hands-on guidance, the private coaching program is where we work it into your real cases, with a members portal, EMR templates, and ongoing support.',
   cta:'Apply for the OrthoRefresh private coaching program',
   disc:'Educational content for licensed clinicians only. It supports your clinical judgment and does not replace it. No clinical or financial result is guaranteed. Results vary by clinician and practice setting.'}
];

const deck=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide';
  let html='';
  if(s.k) html+='<div class="k">'+s.k+'</div>';
  if(s.h) html+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.p) html+='<p class="'+(s.t==='title'?'lead':'')+'">'+s.p+'</p>';
  if(s.li){html+='<ul>';s.li.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  if(s.cta) html+='<div class="cta">'+s.cta+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  html+='<div class="foot">OrthoRefresh</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
