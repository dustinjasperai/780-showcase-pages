<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Healthy Growth Masterclass · Alex Judd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fffef5; --panel:#f2ede3; --rule:#e4ddd0;
    --acc:#96764f; --acc2:#b79468; --ink:#343432; --body:#575550; --dim:#9a938a; --cream:#fffef5;
  }
  html,body{height:100%}
  body{background:#efe9dc;font-family:'Lora',Georgia,serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe9dc}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Oswald',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:.004em}
  .t-title h1{font-size:5.2vw;max-width:94%;text-transform:uppercase}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Lora',serif;font-size:1.44vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.66;font-weight:400}
  .sub{font-family:'Lora',serif;font-style:italic;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:86%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Oswald',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:92%;text-transform:uppercase}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#3c3a34 0%,#2a2a27 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:90%;color:var(--cream);text-transform:none}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#3c3a34 0%,#2a2a27 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:88%;color:var(--cream);text-transform:none}
  .t-cta .body{font-family:'Lora',serif;color:#e6ddcb;font-size:1.44vw;margin-top:3vh;max-width:74%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Oswald',sans-serif;border:1.5px solid var(--acc2);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:500;letter-spacing:.04em}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-family:'Lora',serif;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:8%;bottom:9%;width:16vw;opacity:.95}
  .corner-vf{right:6.5%;bottom:7.5%;width:8vw;opacity:.45}
  .brandline{font-family:'Oswald',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(52,52,50,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Oswald',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.5vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Path for Growth</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: an ascending path drawn in bronze, a rising route with steps -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#96764f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 96 L44 96 L44 74 L68 74 L68 52 L92 52 L92 30" opacity="0.92"/>
    <path d="M78 30 L92 30 L92 44" opacity="0.9"/>
    <circle cx="20" cy="96" r="3.4" fill="#96764f" stroke="none" opacity="0.85"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Healthy Growth Masterclass',sub:'How to grow a business that does not end up depending on you.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'Your business grew. It just did not get any lighter.',body:'The numbers went up. The team got bigger. And somehow you are more tangled in it than you were two years ago. Every important decision still routes through you, the good days feel like managing and the bad days feel like rescuing, and a quiet thought keeps showing up: if I stepped away for two weeks, would this hold? You did not set out to build a job you cannot leave. But that is what fast, reactive growth quietly builds.'},
 {t:'dark',title:'Growth that is built on you was never freedom. It is a heavier version of the same trap.'},

 {t:'section',idx:'Part One',title:'Why More Growth Keeps Arriving As More Weight'},
 {t:'normal',k:'The owner-dependence trap',title:'The faster it grows, the more of it runs straight through you.',body:'When a business grows without a deliberate design, the owner becomes the glue. More customers, more staff, more moving parts, and every one of them eventually needs you to decide, approve, or fix it. So the reward for growing is that you are needed more, not less. That is the trap, and almost nobody names it, because from the outside it just looks like success.'},
 {t:'normal',k:'The hustle default',title:'The advice you are handed is scale faster. It rarely asks what the growth is costing you.',body:'Most of what gets sold to leaders is about speed. Scale faster, add another channel, buy back your time with one more hire. Speed is not the enemy, but speed with no design underneath it just gets you to the ceiling sooner. The real question is not how fast can we grow. It is what kind of business, and what kind of leader, is the growth actually building.'},
 {t:'dark',title:'A business that cannot run a week without you is not an asset yet. It is a job you cannot quit.'},

 {t:'section',idx:'Part Two',title:'The Path to Healthy Growth'},
 {t:'normal',k:'Move one, grow yourself first',title:'If you are not growing, you cannot lead people who are.',body:'Everything downstream is capped by the leader. Your business will not outgrow your own capacity to think, decide, and stay steady under pressure for very long. Healthy growth starts with the least glamorous move there is: the leader deciding to grow on purpose, every day, before asking the business or the team to. When you grow, the ceiling lifts. When you stall, so does everything under you.'},
 {t:'normal',k:'Move two, know your phase',title:'The skills that start a business are not the skills that scale it.',body:'Leadership comes in phases, and each one asks for a different version of you. The instincts that got the business off the ground, doing everything yourself, deciding fast, being in every detail, are the exact instincts that choke it later. Most stuck owners are not failing. They are running phase-one habits at a phase-two problem. Naming which phase you are in is half the work.'},
 {t:'normal',k:'Move three, build it to run without you',title:'Design the business so the right things happen when you are not in the room.',body:'A healthy business has its fundamentals built in on purpose: clear ownership, decisions that do not all need you, standards that hold when you are away. This is the shift from being the operator to being the owner. It is not about caring less. It is about building something strong enough to carry its own weight, so growth stops meaning more hours from you.'},
 {t:'normal',k:'Move four, build the team',title:'Build the team on culture, character, and chemistry, not just skill.',body:'You cannot delegate your way out of the trap by hiring for resumes alone. The leaders who lift weight off you are the ones who fit the culture, have the character to be trusted with real decisions, and have the chemistry to work with the people already there. Skill you can teach. Get culture, character, and chemistry right, and you finally get to build leaders instead of just filling seats.'},
 {t:'dark',title:'Healthy growth is not slower growth. It is growth the business can actually carry.'},

 {t:'section',idx:'Part Three',title:'What Changes When Growth Is Healthy'},
 {t:'normal',k:'The business this builds',title:'Steadier growth, a team that owns it, and a business you could actually step away from.',body:'The decisions stop stacking on your desk. The team catches things before they reach you. Growth stops feeling like more to hold and starts feeling like more that holds itself. And the freedom you were chasing when you started, the reason for all of it, finally shows up, because the business was built to run without you being the thing that keeps it standing.'},
 {t:'dark',title:'You stop being the ceiling your own business keeps hitting.'},
 {t:'normal',k:'Why Alex',title:'Six years, three hundred plus conversations, and a lot of leaders who were quietly stuck.',body:'Alex Judd started Path for Growth after leading at one of the best known names in business coaching, and has spent the years since in the details of healthy growth: three hundred plus podcast episodes, the 12 Fundamentals for Healthy Growth, and coaching impact-driven leaders through this exact shift, from holding the business up to building one that stands on its own. This masterclass is a piece of that work.'},

 {t:'section',idx:'Your Next Step',title:'Walk the Path'},
 {t:'normal',k:'Keep going with Path for Growth',title:'This masterclass is the map. The coaching is walking it in your own business.',body:'What you just went through is the shift from growth that leans on you to growth that does not. Making it real, in your business, with your team and your numbers and someone in your corner, is what the coaching and the community are for. If any of this named something you have been carrying, that is the place to start.'},
 {t:'cta',title:'Ready to grow in a way you can actually carry?',body:'Take the next step with Alex and Path for Growth.',chips:['Take the 12 Fundamentals assessment','Book a call'],disc:'Educational content for business leaders. No income or business result is guaranteed. Results vary by person, business, and effort.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">PATH FOR <b>GROWTH</b> · ALEX JUDD</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
