<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The JOY Codes: A Live Masterclass with Adele Good</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#06273c;        /* deep sacred-site twilight blue, from brand #053a5d/#094973 */
    --panel:#0d3a59;
    --rule:#1c5076;
    --accent:#aa7339;    /* her dominant warm gold, from brand.json */
    --accent-soft:#c79257;
    --ink:#f3ede3;
    --ink-soft:#cdd6de;
    --ink-muted:#8ba3b5;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  #stage{width:100vw;height:100vh;position:relative;}
  .slide{
    position:absolute;inset:0;display:none;
    flex-direction:column;justify-content:center;
    padding:8vh 10vw;
  }
  .slide.active{display:flex;}
  .kicker{font-family:'Josefin Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent-soft);margin-bottom:22px;}
  h1{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:clamp(34px,6vw,76px);line-height:1.04;letter-spacing:-.01em;}
  h2{font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:clamp(26px,4.2vw,50px);line-height:1.12;margin-bottom:26px;}
  .promise{font-size:clamp(18px,2.2vw,26px);color:var(--ink-soft);margin-top:28px;max-width:28ch;font-weight:300;}
  p.lead{font-size:clamp(17px,2vw,23px);color:var(--ink-soft);line-height:1.6;max-width:40ch;}
  p.lead+p.lead{margin-top:18px;}
  .big{font-size:clamp(24px,3.4vw,40px);font-family:'Josefin Sans',sans-serif;font-weight:600;line-height:1.2;color:var(--ink);max-width:24ch;}
  .accent{color:var(--accent-soft);}
  ul{list-style:none;margin-top:10px;max-width:46ch;}
  ul li{position:relative;padding-left:30px;margin-bottom:18px;font-size:clamp(16px,1.9vw,22px);color:var(--ink-soft);line-height:1.5;}
  ul li::before{content:"";position:absolute;left:0;top:.5em;width:12px;height:12px;border:2px solid var(--accent);transform:rotate(45deg);}
  .els{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 40px;margin-top:14px;max-width:60ch;}
  .el{border-left:3px solid var(--accent);padding-left:18px;}
  .el h3{font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:clamp(18px,2vw,24px);color:var(--ink);margin-bottom:6px;}
  .el p{font-size:clamp(14px,1.5vw,17px);color:var(--ink-muted);line-height:1.45;}
  .num{font-family:'Josefin Sans',sans-serif;font-size:clamp(40px,7vw,96px);font-weight:300;color:var(--accent);line-height:1;}
  .footer{position:absolute;left:10vw;bottom:5vh;font-family:'Josefin Sans',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted);}
  .cta-box{margin-top:30px;border:1px solid var(--rule);background:var(--panel);padding:26px 32px;max-width:40ch;}
  .cta-box .step{font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:clamp(20px,2.4vw,28px);color:var(--accent-soft);}
  .disclaimer{margin-top:22px;font-size:12px;color:var(--ink-muted);max-width:52ch;line-height:1.5;font-style:italic;}
  .chakana{width:54px;height:54px;margin-bottom:26px;}
  .chakana rect{fill:none;stroke:var(--accent);stroke-width:4;}
  nav{position:fixed;bottom:22px;right:28px;display:flex;gap:10px;align-items:center;z-index:10;}
  nav button{font-family:'Inter',sans-serif;background:var(--panel);color:var(--ink-soft);border:1px solid var(--rule);width:40px;height:40px;cursor:pointer;font-size:18px;}
  nav button:hover{border-color:var(--accent);color:var(--accent-soft);}
  #count{font-size:12px;color:var(--ink-muted);letter-spacing:.1em;min-width:48px;text-align:center;}
  .progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);transition:width .25s;z-index:10;}
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<div id="stage"></div>
<nav>
  <button id="prev" aria-label="Previous">&#8249;</button>
  <span id="count"></span>
  <button id="next" aria-label="Next">&#8250;</button>
</nav>
<script>
const CH='<svg class="chakana" viewBox="0 0 100 100"><rect x="38" y="4" width="24" height="24"/><rect x="38" y="72" width="24" height="24"/><rect x="4" y="38" width="24" height="24"/><rect x="72" y="38" width="24" height="24"/><rect x="38" y="38" width="24" height="24"/></svg>';
const S=[
  {t:'title',html:'<div class="kicker">A Live Masterclass with Adele Good</div><h1>The JOY <span class="accent">Codes</span></h1><div class="promise">How joy becomes the fastest path back to energy, health and abundance, taught through four elements and the body\'s own healing field.</div>'},

  {t:'who',html:'<div class="kicker">Who this is for</div><h2>You did everything right. The joy still leaked out.</h2><p class="lead">You chased the goals, held the roles, kept everyone else well. And somewhere along the way the aliveness quietly drained off.</p><p class="lead">This hour is for the seeker who senses there is more energy, more health and more abundance available, and wants a real path back to it.</p>'},

  {t:'trap',html:'<div class="kicker">The trap</div><div class="big">We are taught that joy is the <span class="accent">reward</span> you get once the health, the money and the healing finally arrive.</div><p class="lead" style="margin-top:28px;">So we postpone it. We grind first and promise ourselves joy later. Later keeps moving.</p>'},

  {t:'reframe',html:'<div class="kicker">The reframe</div><div class="big">Joy is not the reward. Joy is the <span class="accent">mechanism</span>.</div><p class="lead" style="margin-top:28px;">In the body, joy is a state your energy, your repair systems and your decisions all run better inside. Restore the joy first, and the health, the clarity and the abundance follow it, not the other way around.</p>'},

  {t:'part',html:'<div class="num">Part One</div><h2 style="margin-top:18px;">Why the energy leaves</h2><p class="lead">Before the codes, the honest picture of what actually drains a person.</p>'},

  {t:'body',html:'<div class="kicker">Part One</div><h2>Three leaks nobody names</h2><ul><li><strong>Stored survival.</strong> Years of pushing through get held in the body as tension, fatigue and pain that no schedule change touches.</li><li><strong>Borrowed purpose.</strong> Living someone else\'s version of a good life quietly costs you your own energy.</li><li><strong>Disconnection from source.</strong> Cut off from nature, ritual and stillness, the system runs on fumes.</li></ul>'},

  {t:'story',html:'<div class="kicker">Part One</div><h2>I know these leaks from the inside</h2><p class="lead">I carried obesity, asthma, diabetes, depression and thyroid disease, on a stack of medication, until I rebuilt from the ground up: 100-plus pounds released naturally and off all medication since 2006.</p><p class="lead">What brought me back was not another diet. It was joy, energy and a connection to something far older than me.</p>'},

  {t:'part',html:'<div class="num">Part Two</div><h2 style="margin-top:18px;">The JOY Codes</h2><p class="lead">The method I rebuilt myself with, and now teach, taught through the elements and the body\'s own healing field.</p>'},

  {t:'journey',html:'<div class="kicker">Part Two · The Journey of YOU</div><h2>The codes are not a mindset. They are a return.</h2><p class="lead">The JOY Codes walk you back to the version of you that was alive before the leaks started, using the oldest technology we have: the four elements, sacred sites, and energy that moves without force.</p>'},

  {t:'elements',html:'<div class="kicker">Part Two · Elements to the Power of 4</div><h2>Four forces, one system</h2><div class="els"><div class="el"><h3>Earth</h3><p>Ground the body and the nervous system so repair can even begin.</p></div><div class="el"><h3>Water</h3><p>Move what is stored: grief, held tension, the emotion under the fatigue.</p></div><div class="el"><h3>Air</h3><p>Clear the mind and reconnect to breath, inspiration and higher perspective.</p></div><div class="el"><h3>Fire</h3><p>Reignite the drive, the purpose and the joy that actually powers the rest.</p></div></div>'},

  {t:'geometry',html:CH+'<div class="kicker">Part Two · Sacred geometry</div><h2>The Chakana holds the four together</h2><p class="lead">In the Andean tradition the four elements are not separate practices to juggle. The sacred geometry of the Chakana shows how Earth, Water, Air and Fire balance into one living center. That balance is exactly how joy, health and abundance are meant to sit in a person.</p>'},

  {t:'healing',html:'<div class="kicker">Part Two · All Good Energy Healing</div><h2>Healing without force</h2><p class="lead">The elements give you the map. All Good Energy Healing is the hands-off practice that moves stuck energy out of the body, so the aches, the heaviness and the static quiet down and the system can run clean again.</p><p class="lead">No pushing. No more medication to white-knuckle. Just the field doing what it already knows how to do.</p>'},

  {t:'body',html:'<div class="kicker">Part Two · The codes in practice</div><h2>What you actually do with this</h2><ul><li>A daily elemental practice that takes minutes, not hours.</li><li>Simple energy-clearing you can run on yourself the moment you feel the leak start.</li><li>Rituals that reconnect you to nature and source without needing a plane ticket.</li></ul>'},

  {t:'part',html:'<div class="num">Part Three</div><h2 style="margin-top:18px;">What changes</h2><p class="lead">What the first weeks inside the codes tend to look like.</p>'},

  {t:'body',html:'<div class="kicker">Part Three</div><h2>The order it comes back in</h2><ul><li><strong>First, the energy.</strong> You wake up with more of it and spend less of it on things that drain you.</li><li><strong>Then, the body.</strong> The aches soften, sleep deepens, the static clears.</li><li><strong>Then, the abundance.</strong> Decisions get cleaner and opportunities you were too tired to see start to land.</li></ul>'},

  {t:'why',html:'<div class="kicker">Why me</div><h2>Twenty years, five continents, one method</h2><p class="lead">I am a John of God Casa guide, a certified health and energy-healing practitioner with 20-plus certifications, and I have spent the last decade studying sacred sites across Europe, South America, Asia and Africa to bring their teaching home.</p><p class="lead">Everything in the JOY Codes was tested on me first.</p>'},

  {t:'cta',html:'<div class="kicker">Begin the return</div><h2>Walk the codes with me</h2><p class="lead">If this hour moved something, the full journey lives inside the JOY Codes Founders Circle: a VIP session, weekly live group coaching, the Elements to the Power of 4 program, a private community, and a sacred-site journey option.</p><div class="cta-box"><div class="step">Your next step</div><p class="lead" style="margin-top:8px;">Join the JOY Codes Founders Circle at adelegood.com and begin the return.</p></div><div class="disclaimer">This masterclass is educational. It is not medical, psychological or financial advice and does not diagnose or treat any condition. It offers no guarantee of any health or financial outcome; individual results vary.</div>'}
];
let i=0;const stage=document.getElementById('stage');
S.forEach((s,idx)=>{const d=document.createElement('div');d.className='slide';d.innerHTML=s.html+'<div class="footer">The JOY Codes · Adele Good</div>';stage.appendChild(d);});
const slides=stage.querySelectorAll('.slide');
function show(n){i=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,idx)=>s.classList.toggle('active',idx===i));document.getElementById('count').textContent=(i+1)+' / '+S.length;document.getElementById('prog').style.width=((i+1)/S.length*100)+'%';}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
stage.addEventListener('click',e=>{if(!e.target.closest('nav'))show(i+1);});
show(0);
</script>
</body>
</html>
