<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breaking The CEO Code - a masterclass with Craig Johns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f7;
  --panel:#ffffff;
  --rule:#d7dde3;
  --ink:#14232e;
  --accent:#005da4;
  --accent2:#c4d600;
  --head:'Space Grotesk',system-ui,sans-serif;
  --body:'Karla',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 80px}
.slide{
  background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:48px 52px;margin:0 0 20px;min-height:430px;
  display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
}
.kick{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  font-size:12.5px;color:var(--accent);margin-bottom:18px}
h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.04;letter-spacing:-.01em}
h2{font-family:var(--head);font-weight:600;font-size:33px;line-height:1.1;letter-spacing:-.01em}
p{font-size:18.5px;line-height:1.55;margin-top:16px;max-width:40em;color:#2b3a45}
.lead{font-size:22px;color:var(--ink)}
.big{font-size:60px;font-family:var(--head);font-weight:700;letter-spacing:-.02em;line-height:1}
.muted{color:#5a6b76}
ul{margin:20px 0 0 0;list-style:none}
li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
li:last-child{border-bottom:0}
li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
.pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:6px 14px}
.part .num{font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--accent2-text,var(--accent))}
.wave{display:flex;gap:7px;margin-top:28px;align-items:flex-end;height:96px}
.wave span{flex:1;border-radius:5px 5px 0 0;background:var(--rule)}
.wave .load{background:var(--accent)}
.wave .peak{background:var(--accent2)}
.wave .rec{background:var(--rule)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
.card{border:1px solid var(--rule);border-radius:10px;padding:20px}
.card .p{font-family:var(--head);font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.04em}
.card h3{font-family:var(--head);font-size:21px;margin:8px 0 6px}
.card p{font-size:15.5px;margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:26px}
.day{border:1px solid var(--rule);border-radius:9px;padding:14px 8px;text-align:center}
.day b{display:block;font-family:var(--head);font-size:13px;color:var(--muted,#5a6b76)}
.day.load{background:var(--accent);color:#fff;border-color:var(--accent)}
.day.peak{background:var(--accent2);color:var(--ink);border-color:var(--accent2)}
.day .t{font-family:var(--head);font-weight:700;font-size:13px;margin-top:8px}
.strike{text-decoration:line-through;color:#9fb0ba}
.on{color:var(--accent)}
.foot{position:absolute;right:26px;bottom:20px;font-family:var(--head);font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:#9fb0ba}
.disc{font-size:14px;color:#6a7882;margin-top:22px;max-width:46em}
.num-badge{font-family:var(--head);font-weight:700;color:var(--accent2);font-size:14px;letter-spacing:.2em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Craig Johns', h:'Breaking The CEO Code',
   p:'How high performing leaders lead at their peak for years, without the burnout that takes most of them out.'},

  {t:'who', kick:'Who this is for', h:'For the CEO who is already all in.',
   p:'Founders, chief executives and C-suite leaders carrying the whole organisation. You are not short on effort or drive. You are running flat out, and some part of you knows the pace you are using to win is the same pace that eventually breaks.'},

  {t:'trap', kick:'The trap', h:'The busier you get, the harder you manage time.',
   p:'More hours. Tighter calendar. Earlier starts. It works for a while, so you do more of it. And slowly the thing that is actually running the business, your own energy, gets spent down with nothing put back.'},

  {t:'hook', kick:'The reframe', h:'You do not have a time problem. You have an energy problem.',
   p:'I learned this the hard way. I spent 25 years in elite sport, coaching Olympians and world champions, then led organisations the way I had been taught to lead, flat out. It ended in three stress hospitalisations and a cardiac arrest. The operating system most leaders run on does not have an off ramp. It has a wall.'},

  {t:'part', num:'Part One', h:'Leaders are trained to run like machines. The best performers run like athletes.'},

  {t:'point', kick:'The core problem', h:'A machine is measured by hours. An athlete is measured by output when it counts.',
   p:'A machine runs until it fails. An athlete trains, recovers, and peaks on purpose, because performance on the day is the only thing that is scored. The CEO is scored the same way, on the decisions and the presence that only show up when the leader has something left in the tank.'},

  {t:'point', kick:'What grinding costs', h:'Flat out is not the same as high performance.',
   p:'Run every week at maximum and the quality of your thinking, your patience and your presence quietly erodes. The team feels it first. Nobody schedules the recovery that would protect all of it, because recovery looks like doing nothing, and doing nothing feels like losing.'},

  {t:'point', kick:'The athlete\'s secret', h:'Peak performance is built, then it is recovered for.',
   p:'No athlete trains hard every single day. They periodize: heavy load, deliberate recovery, then a peak timed for the event that matters. The recovery is not the reward for the work. It is part of the work. That is the one idea most leaders have never been given permission to use.'},

  {t:'part', num:'Part Two', h:'The active CEO operating system.'},

  {t:'framework', kick:'The framework', h:'The 3 P\'s Leadership Performance Formula.',
   cards:[
     {p:'P1',h:'Periodization',d:'Cycle load and recovery across the week and the year, the way a season is built.'},
     {p:'P2',h:'Presence',d:'How you show up sets the state of the whole room. Presence is a trainable output of energy.'},
     {p:'P3',h:'Performance',d:'Sustainable peak output, as the result of the first two, not of simply working longer.'}
   ]},

  {t:'pillar', kick:'P1 - Periodization', h:'Program your week like a season.',
   p:'Some blocks are for heavy load, where you push and decide and create. Some blocks are protected recovery, where the tank refills on purpose. One block is your peak, reserved for the work only you can do. The calendar stops being a list of demands and becomes a plan for performance.',
   wave:true},

  {t:'pillar', kick:'P2 - Presence', h:'Your state is contagious. Lead it on purpose.',
   p:'A depleted leader leaks stress into every meeting without saying a word. A present leader steadies the room. Presence is not a personality trait you either have or do not. It is downstream of your energy, and energy is something you can manage.'},

  {t:'pillar', kick:'P3 - Performance', h:'Peak is an outcome, not an effort level.',
   p:'When load and recovery are programmed and presence is protected, performance stops being something you squeeze out by force. It becomes the natural result of a leader who is actually resourced for the role. The output goes up while the cost comes down.'},

  {t:'point', kick:'The retitle', h:'You are the Chief Energy Officer.',
   p:'Before you manage the company\'s time, the market or the money, you manage its energy, starting with your own. Every leader the organisation watches is reading your state for the signal on how hard to push and when it is safe to recover. That signal is the real job.'},

  {t:'part', num:'Part Three', h:'A real week, programmed.'},

  {t:'week', kick:'A periodised CEO week', h:'Load. Recover. Peak.',
   p:'Not harder. Programmed. The same number of hours, spent so the important ones land when you have the most to give them.'},

  {t:'point', kick:'How you know it is working', h:'The signs show up fast.',
   p:'You finish the week with something left rather than nothing. The hard conversations get your best self instead of your most tired one. The team mirrors a leader who is steady instead of stretched. And the results hold, month after month, without the crash that used to follow every sprint.'},

  {t:'why', kick:'Why me', h:'I coached peak performance for a living before I had to learn to live it.',
   p:'25 years in elite sport, as a national head coach to Olympians, national and world champions, and as a competitor at the Hawaii Ironman and four World Triathlon Championships. Then senior executive and CEO roles, a stress-driven cardiac arrest, and the rebuild that became this work. I have taken these ideas into Nestle, P&G, JP Morgan, AIG and Nike, and into the active CEO podcast with leaders who live this question every day.'},

  {t:'recap', kick:'The shift', h:'Stop leading like a machine. Start leading like an athlete.',
   p:'Manage energy before time. Program recovery like it matters, because it does. Peak on purpose, for years, not until the wall.'},

  {t:'cta', kick:'Work with me', h:'Bring the active CEO system into your own leadership.',
   p:'If this is the way you want to lead, the next step is a conversation. We map your week, your load and your recovery, and build the operating system around how you actually perform at your best. Start at nrg2perform.com.',
   disc:'This masterclass is educational. No specific business or health result is guaranteed. Results vary with each leader and each organisation. Nothing here is medical advice.'}
];

function wave(){
  const seq=['load','load','rec','load','peak','rec','rec'];
  return '<div class="wave">'+seq.map(k=>{
    const h = k==='peak'?96:k==='load'?72:34;
    return '<span class="'+k+'" style="height:'+h+'px"></span>';
  }).join('')+'</div>';
}
function week(){
  const d=[['Mon','Load','load'],['Tue','Load','load'],['Wed','Recover','rec'],
           ['Thu','Load','load'],['Fri','Peak','peak'],['Sat','Recover','rec'],['Sun','Rest','rec']];
  return '<div class="week">'+d.map(x=>
    '<div class="day '+(x[2]==='load'?'load':x[2]==='peak'?'peak':'')+'"><b>'+x[0]+'</b><div class="t">'+x[1]+'</div></div>'
  ).join('')+'</div>';
}
function cards(cs){
  return '<div class="grid3">'+cs.map(c=>
    '<div class="card"><div class="p">'+c.p+'</div><h3>'+c.h+'</h3><p>'+c.d+'</p></div>'
  ).join('')+'</div>';
}
const app=document.getElementById('app');
S.forEach((s,i)=>{
  let inner='';
  if(s.kick) inner+='<div class="kick">'+s.kick+'</div>';
  if(s.num) inner+='<div class="num-badge">'+s.num+'</div>';
  if(s.t==='title'){ inner+='<h1>'+s.h+'</h1>'; }
  else if(s.t==='part'){ inner+='<h2>'+s.h+'</h2>'; }
  else { inner+='<h2>'+s.h+'</h2>'; }
  if(s.p) inner+='<p>'+s.p+'</p>';
  if(s.cards) inner+=cards(s.cards);
  if(s.wave) inner+=wave();
  if(s.t==='week') inner+=week();
  if(s.disc) inner+='<div class="disc">'+s.disc+'</div>';
  inner+='<div class="foot">NRG2Perform</div>';
  const el=document.createElement('div');
  el.className='slide '+s.t;
  el.innerHTML=inner;
  app.appendChild(el);
});
</script>
</body>
</html>
