<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run the Business Without Running Yourself Ragged, a Business on Purpose masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f6f2;        /* brand warm off-white ground (brand.json) */
    --panel:#ffffff;
    --panel-2:#e7e2da;   /* brand warm sand */
    --rule:#e2ddd3;
    --ink:#16202e;       /* brand navy, used as TEXT on light ground */
    --muted:#5b6472;
    --accent:#f08a24;    /* brand signature orange (their button bg) */
    --deep:#14253b;      /* brand footer navy */
    --head:'Montserrat',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:52px 54px;margin:22px 0;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(22,32,46,.04),0 18px 40px -28px rgba(22,32,46,.22);
  }
  .num{position:absolute;top:22px;right:26px;font-family:var(--head);font-weight:700;
    font-size:13px;color:var(--muted);letter-spacing:.04em}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:800;font-size:33px;line-height:1.1;letter-spacing:-.01em}
  .sub{font-size:19px;color:var(--muted);margin-top:18px;max-width:60ch;line-height:1.5}
  .body{font-size:18px;line-height:1.6;margin-top:16px;max-width:62ch}
  .accent{color:var(--accent)}
  .lead{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.12;max-width:20ch}
  .lead .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
  ul{margin:22px 0 0 0;list-style:none;display:grid;gap:14px;max-width:62ch}
  li{position:relative;padding-left:30px;font-size:18px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px}
  .corner{background:var(--panel-2);border-radius:12px;padding:22px 24px}
  .corner .t{font-family:var(--head);font-weight:800;font-size:20px}
  .corner .d{font-size:15.5px;color:var(--muted);margin-top:7px;line-height:1.45}
  .steps{display:grid;gap:12px;margin-top:24px}
  .step{display:flex;gap:16px;align-items:flex-start;background:var(--panel-2);border-radius:10px;padding:16px 20px}
  .step .n{font-family:var(--head);font-weight:800;color:var(--accent);font-size:22px;min-width:28px}
  .step .x .t{font-family:var(--head);font-weight:700;font-size:17px}
  .step .x .d{font-size:15px;color:var(--muted);margin-top:3px}
  .stat{display:flex;gap:40px;margin-top:28px;flex-wrap:wrap}
  .stat .s .big{font-family:var(--head);font-weight:800;font-size:40px;color:var(--accent)}
  .stat .s .lab{font-size:14.5px;color:var(--muted);margin-top:4px;max-width:18ch}
  .anchor-row{display:flex;gap:7px;margin-top:26px;flex-wrap:wrap}
  .wk{width:30px;height:30px;border-radius:7px;background:var(--panel-2);border:1px solid var(--rule)}
  .wk.on{background:var(--accent);border-color:var(--accent)}
  .cta-box{background:var(--deep);color:#fff;border-radius:14px;padding:24px 28px;margin-top:26px;display:inline-block}
  .cta-box .t{font-family:var(--head);font-weight:800;font-size:22px}
  .cta-box .d{opacity:.82;margin-top:6px;font-size:16px}
  .disclaimer{font-size:12.5px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .brandline{position:absolute;bottom:20px;left:54px;font-family:var(--head);font-weight:700;
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:'Business on Purpose · live masterclass',
    h:'Run the Business Without Running Yourself&nbsp;Ragged',
    sub:'The week-by-week rhythm that finally gets your systems built, so the business runs and grows with or without you.' },

  {t:'who',
    kick:'Who this is for',
    h:'You built it. Now it needs you for everything.',
    body:'This is for the small business owner whose crew still texts them every answer at night. You are good at the work. The problem was never the work. It is that nothing runs unless it runs through you.' },

  {t:'trap',
    kick:'The trap',
    h:'The busier you get, the more trapped you are.',
    body:'Every new client, every new hire, every new job adds one more thing only you can decide. Growth should feel like freedom. Right now it feels like a heavier set of keys you cannot hand to anyone.' },

  {t:'reframe',
    kick:'The hard truth',
    lead:true,
    a:'Vision without implementation is',
    strike:'a dream.',
    solid:'a hallucination.' },

  {t:'part',
    kick:'Part one',
    h:'Chaos is not a people problem. It is a systems problem.',
    body:'You do not have bad people. You have good people with nothing written down to follow. When the only operating system is inside your head, the business cannot work without your head in it.' },

  {t:'point',
    kick:'The three signs',
    h:'You are the bottleneck if...',
    items:['You approve every quote, invoice, or decision before it goes out.','The crew texts you on your day off and the day stops until you answer.','Nothing important is written down, so nothing can happen without you.'] },

  {t:'point',
    kick:'Why the quick fixes fail',
    h:'One good week does not change the business.',
    body:'You have fixed it before. A burst of energy, a weekend of cleanup, a new tool. Two weeks later you are back in the fire. A one-time fix with no rhythm behind it always drifts back to chaos.' },

  {t:'part',
    kick:'Part two',
    h:'The Business on Purpose Operating System',
    sub:'Four cornerstones that move a business from "it depends on me" to "it runs on purpose."' },

  {t:'corners',
    kick:'The four cornerstones',
    h:'Purpose · People · Process · Profit',
    corners:[
      {nm:'Purpose',d:'A clear vision, mission, and values that act as the guardrails for every decision your team makes without you.'},
      {nm:'People',d:'The right people in the right roles with expectations clear enough that they stop needing you to referee.'},
      {nm:'Process',d:'The work documented so it outlives you, repeatable, teachable, and handed off without it falling apart.'},
      {nm:'Profit',d:'Financial clarity and a rolling cash picture, so the freedom you build is also a business that pays you.'} ] },

  {t:'framework',
    kick:'The path',
    h:'The Four Steps to Business Freedom',
    steps:[
      {n:'1',t:'Vision',d:'Write the destination down: the story, the mission, the values that keep you on the road.'},
      {n:'2',t:'Clarity',d:'Name the roles and the expectations so people know what good looks like.'},
      {n:'3',t:'Process',d:'Document the handful of processes that run the business day to day.'},
      {n:'4',t:'Rhythm',d:'Install them week by week until the systems, not you, carry the load.'} ] },

  {t:'anchor',
    kick:'The ANCHOR',
    h:'One system a week. Fifty-two weeks.',
    body:'You do not fix everything in a weekend. You install one rhythm at a time. Most owners feel the weight lift long before week fifty-two, because every system you hand off is one more thing the business no longer needs you for.' },

  {t:'part',
    kick:'Part three',
    h:'What a business that runs without you looks like',
    sub:'Not an absent owner. A free one.' },

  {t:'point',
    kick:'A week on the other side',
    h:'The quotes go out without you.',
    items:['The crew solves the Johnson-job problem from the written process, and never texts you.','You take a real day off and the shop still opens, closes, and bills correctly.','You spend your hours on the next move, not on being the switchboard.'] },

  {t:'why',
    kick:'Why listen to this',
    h:'This has been done, out loud, many times.',
    stat:[
      {big:'500+',lab:'owners coached out of chaos'},
      {big:'8+ hrs',lab:'a week reclaimed, on average'},
      {big:'10%',lab:'average rolling cash increase after 12 months'} ],
    body:'Two books, Let Your Business Burn and The Chaos Free Contractor, plus a long-running podcast, all built on the same operating system you just walked through.' },

  {t:'recap',
    kick:'What you leave with',
    h:'Three things, today.',
    items:['Your vision on one page.','Your first three processes named and ready to document.','The weekly rhythm to install the rest.'] },

  {t:'cta',
    kick:'Your next step',
    h:'Let us build your first rhythm together.',
    sub:'Book a free strategy call. We will look at where the business depends on you most, and the first system to hand off.',
    ctaT:'Book a Free Strategy Call',
    ctaD:'mybusinessonpurpose.com · no card, no obligation',
    disclaimer:'Educational only. This masterclass teaches a method; it is not a promise of financial results. No specific income or outcome is guaranteed. Results vary by business, effort, and circumstance.' }
];

function esc(x){return x==null?'':x}
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let inner = `<div class="num">${String(i+1).padStart(2,'0')} / ${S.length}</div>`;
  if(s.kick) inner += `<div class="kick">${esc(s.kick)}</div>`;
  if(s.t==='reframe'){
    inner += `<div class="lead">${esc(s.a)} <span class="strike">${esc(s.strike)}</span> <span class="accent">${esc(s.solid)}</span></div>`;
  } else {
    if(s.h) inner += (s.t==='title' ? `<h1>${esc(s.h)}</h1>` : `<h2>${esc(s.h)}</h2>`);
    if(s.sub) inner += `<div class="sub">${esc(s.sub)}</div>`;
    if(s.body) inner += `<div class="body">${esc(s.body)}</div>`;
    if(s.items){ inner += '<ul>'+s.items.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'; }
    if(s.corners){ inner += '<div class="grid4">'+s.corners.map(c=>`<div class="corner"><div class="t accent">${esc(c.nm)}</div><div class="d">${esc(c.d)}</div></div>`).join('')+'</div>'; }
    if(s.steps){ inner += '<div class="steps">'+s.steps.map(st=>`<div class="step"><div class="n">${esc(st.n)}</div><div class="x"><div class="t">${esc(st.t)}</div><div class="d">${esc(st.d)}</div></div></div>`).join('')+'</div>'; }
    if(s.t==='anchor'){ let row=''; for(let k=0;k<52;k++){ row += `<div class="wk${k%7===2||k%7===4?' on':''}"></div>`;} inner += `<div class="anchor-row">${row}</div>`; }
    if(s.stat){ inner += '<div class="stat">'+s.stat.map(x=>`<div class="s"><div class="big">${esc(x.big)}</div><div class="lab">${esc(x.lab)}</div></div>`).join('')+'</div>'; }
    if(s.t==='cta'){ inner += `<div class="cta-box"><div class="t">${esc(s.ctaT)}</div><div class="d">${esc(s.ctaD)}</div></div>`; }
    if(s.disclaimer) inner += `<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  }
  inner += `<div class="brandline">Business on Purpose</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
