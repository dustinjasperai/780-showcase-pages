<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ethical Operator — a CRE career that compounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10151d;        /* deep charcoal-slate, darker sibling of the site #324158 */
    --panel:#1b2431;
    --rule:#324158;      /* site slate, verbatim */
    --accent:#c79a52;    /* muted gold from site warm family #fabd71/#fcd29d */
    --ink:#f2ece0;       /* warm off-white from site cream #fef6ed */
    --muted:#9aa6b4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 96px}
  .slide{background:linear-gradient(180deg,#121823,#0d121a);border:1px solid var(--rule);
    border-radius:14px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;
    flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:56px;top:46px;width:46px;height:2px;background:var(--accent)}
  .eyebrow{font-family:"Inter";font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin-bottom:22px;font-weight:600}
  h1{font-family:"EB Garamond",serif;font-weight:600;font-size:52px;line-height:1.08;margin-bottom:18px;letter-spacing:-.01em}
  h2{font-family:"EB Garamond",serif;font-weight:600;font-size:38px;line-height:1.12;margin-bottom:16px}
  .sub{font-size:19px;line-height:1.5;color:var(--muted);max-width:40ch}
  .lead{font-family:"EB Garamond",serif;font-size:27px;line-height:1.4;color:var(--ink);max-width:34ch}
  ul{list-style:none;margin-top:18px}
  li{font-size:18px;line-height:1.5;padding:13px 0 13px 26px;border-top:1px solid var(--rule);position:relative;color:var(--ink)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .k{color:var(--accent);font-weight:600}
  .big{font-family:"EB Garamond",serif;font-size:64px;color:var(--accent);line-height:1;margin-bottom:10px}
  .foot{position:absolute;right:30px;bottom:22px;font-size:12px;color:#5f6b78;letter-spacing:.04em}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;line-height:1.5;max-width:52ch}
  .cta-row{margin-top:26px;display:inline-block;border:1px solid var(--accent);color:var(--accent);
    padding:13px 24px;border-radius:999px;font-weight:600;font-size:15px}
  .quote{font-family:"EB Garamond",serif;font-style:italic;font-size:34px;line-height:1.35;max-width:30ch}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'Coe Enterprises · The Iconic Journey',h:'The Ethical Operator',sub:'Building a commercial real estate career that compounds. A live masterclass with John Coe.'},
 {t:'lead',eyebrow:'The promise',lead:'By the end of this session you will have a plan for a CRE career that still grows when the market does not.'},
 {t:'bullets',eyebrow:'Who this is for',h:'The rising operator',items:['You are early or mid-career in commercial real estate','You are good at the work but unsure of the next decade','You want to build something that lasts, not just the next close']},
 {t:'bullets',eyebrow:'The trap',h:'The industry rewards the quick close',items:['Every incentive points at this quarter','Leverage and shortcuts look like speed','Nobody hands you a compass for the next twenty years']},
 {t:'lead',eyebrow:'The reframe',lead:'The brokers who burned out chased leverage and ruthlessness. The ones who are still here compounded character.'},
 {t:'bullets',eyebrow:'Part one · the core problem',h:'A career with no compass',items:['Deals come and go; a direction does not appear on its own','Market cycles reset the board every few years','Without a plan, you react instead of choosing']},
 {t:'stat',eyebrow:'Why the long view',big:'3 cycles',sub:'A career is tested across 9/11, 2008, and the pandemic. Perspective is the asset that survives all three.'},
 {t:'lead',eyebrow:'Part two · the framework',lead:'The Iconic Journey is four disciplines that turn four decades of lessons into a plan you can run.'},
 {t:'bullets',eyebrow:'Discipline one',h:'The rolling three-year plan',items:['A living plan you revisit, not a resolution you forget','You steer by long-term direction, not the next transaction','Every cycle becomes a course correction, not a crisis']},
 {t:'bullets',eyebrow:'Discipline two',h:'The inversion discipline',items:['Borrowed from Charlie Munger: invert the question','Ask first what would guarantee career ruin, then remove it','Protecting the downside is how the upside compounds']},
 {t:'bullets',eyebrow:'Discipline three',h:'Strengths-based positioning',items:['Build the career around your real strengths','Stop forcing yourself into a generic broker mold','The right seat beats the prestigious one']},
 {t:'bullets',eyebrow:'Discipline four',h:'Ethical compounding',items:['Integrity, generosity, and disciplined action, repeated','Reputation is the one asset that compounds for decades','Real success is ethical, enduring, and grounded in character']},
 {t:'quote',eyebrow:'Lessons from the Icons',quote:'Real success is ethical, enduring, and grounded in character.',sub:'Distilled from 130-plus conversations with the leaders who built DC real estate.'},
 {t:'bullets',eyebrow:'Part three · the compounding years',h:'A career that compounds',items:['You choose your next move instead of reacting to it','Your name opens doors before you do','You are still standing, and still growing, after the next downturn']},
 {t:'bullets',eyebrow:'Why learn this from me',h:'John Coe',items:['Four decades in CRE lending, brokerage, and mortgage banking','Host of Icons of DC Area Real Estate, 130-plus interviews','Now mentoring the next generation through the Iconic Journey']},
 {t:'bullets',eyebrow:'What you leave with',h:'Your first draft',items:['The start of your own rolling three-year plan','One downside you will design out this quarter','A clearer read on the strengths your career should be built on']},
 {t:'cta',eyebrow:'Your next step',h:'Start the Iconic Journey',sub:'Book a one-on-one coaching call with John Coe and turn today into a plan.',cta:'Book a coaching call at coeenterprises.com'}
];
const d=document.getElementById('deck');
S.forEach((s,i)=>{
 let inner='';
 const eb=s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:'';
 if(s.t==='title'){inner=`${eb}<h1>${s.h}</h1><div class="sub">${s.sub}</div>`}
 else if(s.t==='lead'){inner=`${eb}<div class="lead">${s.lead}</div>`}
 else if(s.t==='quote'){inner=`${eb}<div class="quote">${s.quote}</div><div class="sub" style="margin-top:18px">${s.sub}</div>`}
 else if(s.t==='stat'){inner=`${eb}<div class="big">${s.big}</div><div class="sub">${s.sub}</div>`}
 else if(s.t==='bullets'){inner=`${eb}<h2>${s.h}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`}
 else if(s.t==='cta'){inner=`${eb}<h2>${s.h}</h2><div class="sub">${s.sub}</div><div class="cta-row">${s.cta}</div><div class="disc">This masterclass is educational. It shares frameworks and perspective, not financial, legal, or investment advice, and makes no guarantee of income or results. Outcomes vary with your market, effort, and circumstances.</div>`}
 d.insertAdjacentHTML('beforeend',`<section class="slide">${inner}<div class="foot">The Iconic Journey · ${String(i+1).padStart(2,'0')}</div></section>`);
});
</script>
</body>
</html>
