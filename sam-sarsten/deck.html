<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Recurring Revenue Play for Web Designers, a masterclass with Sam Sarsten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f4ea;
    --panel:#fffdf8;
    --rule:#e7dcc9;
    --ink:#1d2c3b;
    --muted:#5c6773;
    --accent:#d75f40;
    --accent2:#c4ced9;
    --head:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(29,44,59,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* 3-phase motif: three stepped phase marks along the top edge, the last lit in terracotta */
  .slide::before{content:'';position:absolute;top:54px;left:72px;width:150px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent2) 0 30%,transparent 30% 36%,var(--accent2) 36% 66%,transparent 66% 72%,var(--accent) 72% 100%);pointer-events:none}
  .slide::after{content:'';position:absolute;top:50px;left:210px;width:11px;height:11px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 5px rgba(215,95,64,.14)}
  .kick{font-family:var(--head);font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px;margin-top:26px}
  h1{font-family:var(--head);font-weight:800;font-size:58px;line-height:1.05;margin:0 0 18px;letter-spacing:-.02em;color:var(--ink)}
  h2{font-family:var(--head);font-weight:700;font-size:42px;line-height:1.10;margin:0 0 20px;letter-spacing:-.01em;color:var(--ink)}
  h3{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:48ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 42px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:4px;top:23px;width:13px;height:13px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(215,95,64,.14)}
  li b{font-weight:700}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:88px;line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .strike{color:transparent;-webkit-text-stroke:2px rgba(29,44,59,.34);position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:6px;background:var(--accent);transform:rotate(-2deg);border-radius:3px}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:21px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0;color:var(--muted)}
  .who{font-size:19px;color:var(--muted);margin-top:auto;padding-top:22px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:66ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:36px}h2{font-size:28px}.big{font-size:50px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Local SEO Academy · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Recurring Revenue Play for Web Designers',p:'How to turn every website you build into a recurring monthly local-SEO retainer, without becoming a technical SEO or a natural salesperson.',pres:'With <b>Sam Sarsten</b>, founder of Local SEO Academy'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['The one service to add to what you already sell','Why the way off the project treadmill is not more projects.'],['A delivery system that is not guesswork','The 3-Phase System that turns SEO into a repeatable monthly service.'],['How to sell it without being technical','Language that makes a monthly retainer feel obvious to a local client.']]},
 {t:'audience',kick:'Who this is for',h:'You can build the site. You cannot get off the treadmill.',p:'Web designers and freelancers who deliver great work, then start every single month back at zero, hunting the next project to keep the lights on.',who:'<b>The trap:</b> you try to fix a feast-and-famine income by finding more projects, so you stay on the exact treadmill you were trying to get off.'},
 {t:'reframe',kick:'The reframe',big1:'Find more projects.',big2:'Add one recurring <span class="em">service</span>.',p:'You do not need more clients. You need more revenue from the clients you already win. One recurring service, added to the website you were going to build anyway, changes the whole business.'},
 {t:'stakes',kick:'The stakes',h:'Feast and famine does not fix itself with volume.',p:'Every project ends, and the search for the next one starts over. However good the last month was, the income never compounds, and the best month you ever had is still followed by an empty one.'},
 {t:'part',kick:'Part one',h:'Why more projects is the wrong goal.'},
 {t:'point',kick:'The core problem',h:'Your income resets to zero every month.',p:'A project business is only ever as good as its next signed contract. However much you delivered last month, you begin this one hunting again, and nothing you already built is paying you now.'},
 {t:'point',kick:'The core problem',h:'You have the clients. You do not have the second offer.',p:'The hard part is done. You won the trust and you built the site. What is missing is one more thing to sell them that they pay for every month, so the relationship keeps earning long after launch day.'},
 {t:'signs',kick:'The core problem',h:'The signs you are stuck on the treadmill.',li:[['Every month starts at zero','However good last month was, this one opens with an empty pipeline.'],['You compete on price for the next build','With nothing recurring, each project has to carry the whole month by itself.'],['Old clients quietly drift away','Once the site is live, they have no reason left to keep paying you.']]},
 {t:'part',kick:'Part two',h:'The recurring service, delivered and sold.'},
 {t:'framework',kick:'The method',h:'The 3-Phase System.',row:[['Phase 1: Audit','Find what is holding the client back in local search, and the fastest wins.'],['Phase 2: Keywords and content','Rank for the searches that bring in local customers, on the site and on Google Business Profile.'],['Phase 3: Authority and upkeep','Backlinks and steady maintenance so the rankings hold, month after month.']],p:'It removes the guesswork. Each phase is a repeatable month of work a client pays for, so a one-off build becomes a monthly retainer.'},
 {t:'point',kick:'Phase one: the audit',h:'Start by finding what is holding them back.',p:'Before you touch anything, you map where the client stands in local search, what is broken, and where the quick wins are. The audit is also the first thing they pay you for, and it sets up everything that follows.'},
 {t:'point',kick:'Phase two: keywords and content',h:'Rank for the searches that bring in customers.',p:'The keywords a local business should own, and the pages and Google Business Profile posts that go after them. This is the visible work: the client watches their business start showing up right where their customers are already looking.'},
 {t:'point',kick:'Phase three: authority and upkeep',h:'The rankings that hold, month after month.',p:'Backlinks and steady maintenance build the authority that keeps a local business ranking. It is ongoing by nature, which is exactly why it is a recurring service and not a one-time fix.'},
 {t:'point',kick:'The other half',h:'The Local SEO Sales Engine.',p:'Doing the work is only half of it. Most designers can learn the delivery and still freeze at the pitch. The Sales Engine is the pricing and the plain language that make a monthly SEO retainer feel obvious and valuable to a small-business owner, so you can actually sell what you now know how to deliver.'},
 {t:'point',kick:'Where this is going',h:'Local search is becoming AI search.',p:'Customers are starting to ask AI assistants for the best local business, not only Google. The same skills extend into getting your clients found inside those answers, a service you can package and offer now while it is still new.'},
 {t:'part',kick:'Part three',h:'What changes when you add the service.'},
 {t:'looks',kick:'The outcome',h:'The same clients, and finally recurring revenue.',li:[['The income compounds','Every retainer you add stacks on top of the last one, instead of resetting to zero.'],['The work is repeatable','The 3-Phase System means you know what to do each month, so you deliver instead of guess.'],['Clients stay','There is now a real reason for them to keep paying you long after the site ships.']]},
 {t:'whyme',kick:'Why Sam',h:'A practitioner who still does the work.',li:[['Built an agency from scratch','I grew Thencan Designs from zero and still run real client work today.'],['I teach from the trenches','Everything in the Academy is what I actually do for clients, not theory from the sidelines.'],['A community of 100 plus designers','Designers using this to add recurring revenue, with members reaching 5K MRR in under a year.']]},
 {t:'cta',kick:'Your next step',h:'Ready to add recurring revenue to what you already do?',ctas:['<b>Join Local SEO Academy</b> for the courses, the community, and the exact workflows.','<b>Get started with the courses</b> and run the 3-Phase System on your very next client.'],disc:'This masterclass is educational. It shares frameworks and workflows for offering local-SEO services; it is not business, financial, or legal advice for your specific situation, and it is not a guarantee of any revenue, ranking, or client result. Individual results vary and depend on your own effort, market, and clients.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
