<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale From Your Design | A Human Design Masterclass with Emma Dunwoody</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#2a3b4d;        /* deepened form of her dominant slate #34495e */
    --panel:#34495e;     /* her dominant slate, verbatim */
    --rule:#8da38a;      /* her sage, verbatim */
    --accent:#c1a57d;    /* her warm gold, verbatim */
    --ink:#f4efe6;       /* warm ivory */
    --ink-soft:#d8d3c7;
    --ink-muted:#9fb0a2;
  }
  body{ font-family:'Open Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .deck{max-width:1040px;margin:0 auto;padding:40px 24px 80px;}
  .slide{ background:var(--panel); border:1px solid rgba(141,163,138,0.28); border-radius:14px; padding:54px 56px; margin:0 0 26px; min-height:420px; display:flex;flex-direction:column;justify-content:center; box-shadow:0 10px 40px rgba(0,0,0,0.22); }
  .kicker{font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
  .step{font-family:'Poppins',sans-serif;color:var(--rule);font-weight:700;font-size:15px;letter-spacing:0.14em;margin-bottom:10px;}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:48px;line-height:1.1;letter-spacing:-0.01em;margin-bottom:20px;}
  h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:31px;line-height:1.2;margin-bottom:18px;}
  h3{font-family:'Poppins',sans-serif;font-weight:600;font-size:21px;margin-bottom:10px;color:var(--accent);}
  p{font-size:18px;line-height:1.6;color:var(--ink-soft);margin-bottom:14px;max-width:62ch;}
  .lead{font-size:21px;color:var(--ink);}
  ul{list-style:none;margin:10px 0 0;}
  li{font-size:18px;line-height:1.5;color:var(--ink-soft);padding-left:30px;position:relative;margin-bottom:14px;max-width:60ch;}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border:2px solid var(--accent);transform:rotate(45deg);}
  .divider{width:56px;height:3px;background:var(--rule);margin:18px 0 20px;border-radius:2px;}
  .pill{display:inline-block;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.04em;color:var(--bg);background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:22px;}
  .muted{color:var(--ink-muted);font-size:15px;}
  .disclaimer{font-size:13px;color:var(--ink-muted);line-height:1.5;max-width:70ch;margin-top:10px;}
  @media (max-width:720px){ .slide{padding:38px 26px;min-height:0;} h1{font-size:34px;} h2{font-size:24px;} }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', html:`
    <div class="kicker">A Live Masterclass with Emma Dunwoody</div>
    <h1>Scale From Your Design</h1>
    <p class="lead">How high-performing women build more income and impact by aligning their business to their Human Design, not by adding more output, more hires, or more hustle.</p>
    <div class="divider"></div>
    <p class="muted">Transformational Human Design&trade; &middot; The Human Design Podcast</p>`},

  {t:'roadmap', html:`
    <div class="kicker">What we will cover</div>
    <h2>Three shifts, one hour.</h2>
    <ul>
      <li>Why the generic playbook keeps misfiring for women who are already successful.</li>
      <li>The difference between knowing your Human Design and actually running your business from it.</li>
      <li>The three pieces that let you grow income and reach without growing your hours.</li>
    </ul>`},

  {t:'audience', html:`
    <div class="kicker">Who this is for</div>
    <h2>You have already proven you can succeed. It is starting to cost you more than it gives.</h2>
    <ul>
      <li>You are getting results, but every step feels forced and one notch closer to burnout.</li>
      <li>You have tried other people's strategies, and what works for them does not seem to work the same way for you.</li>
      <li>Your mind never switches off. You keep questioning decisions you already know the answer to.</li>
      <li>You know you are meant for more, and you want it without scaling your effort to get there.</li>
    </ul>`},

  {t:'trap', html:`
    <div class="kicker">The trap</div>
    <h2>You were handed a strategy that was never built for you.</h2>
    <p class="lead">Most business advice is one shape. More funnels. More launches. More posting. Push harder, hire faster, out-produce everyone.</p>
    <p>So you push. And it works, for a while, until the pushing becomes the job. The exhaustion is not a mindset problem and it is not a sign you are doing it wrong. It is a sign you are running a business that does not match how you are actually built to operate.</p>`},

  {t:'cost', html:`
    <div class="kicker">What it is really costing</div>
    <h2>The bill for running on the wrong blueprint shows up everywhere.</h2>
    <p>It is not only revenue that plateaus. It is the Sunday-night dread, the decisions you sit on for weeks, the launches that drain you even when they work, and the quiet sense that the business you built is slowly running you.</p>
    <p class="lead">You do not need to want it more. You need it to fit better.</p>`},

  {t:'reframe', html:`
    <div class="kicker">The reframe</div>
    <h2>The next level is not more effort. It is better alignment.</h2>
    <p class="lead">There is a version of your business that runs on your energy instead of against it, where income flows without forcing and the right clients find you before you post.</p>
    <p>The gap between where you are and that version is not another course or another 5-step method. It is a map of how you were designed to make decisions, use your energy, and sell, and the structure to build around it.</p>`},

  {t:'part1', html:`
    <div class="step">PART ONE</div>
    <h2>Why generic strategy keeps misfiring for you</h2>
    <p>Human Design is the blueprint of how your energy is wired: how you are built to make decisions, where your momentum comes from, and how you are meant to be seen. When you run a business on someone else's blueprint, every result costs you double.</p>
    <ul>
      <li>Decisions made from pressure and overthinking instead of your own authority.</li>
      <li>Marketing built on urgency when your design converts through magnetism.</li>
      <li>An offer suite shaped like your mentor's, not like you.</li>
    </ul>`},

  {t:'blueprint', html:`
    <div class="kicker">The blueprint, simply</div>
    <h2>Your design is really three questions answered for you.</h2>
    <ul>
      <li>How are you built to make decisions, so you can stop outsourcing them to logic or other people?</li>
      <li>Where does your energy actually come from, so you can work with your momentum instead of forcing it?</li>
      <li>How are you meant to be seen, so your marketing attracts instead of chases?</li>
    </ul>
    <p class="muted">When those three are clear, most of the overthinking simply has nothing left to feed on.</p>`},

  {t:'part2', html:`
    <div class="step">PART TWO</div>
    <h2>Transformational Human Design&trade;: the shift from knowing your design to living it</h2>
    <p class="lead">Most people read their chart once and file it away. The whole result is in the embodiment, not the information.</p>
    <p>This is the difference between knowing you are a particular type and actually running your business, your calendar, and your offers from it. That is the work almost no one is teaching.</p>`},

  {t:'pillar1', html:`
    <div class="kicker">The method, part 1 of 3</div>
    <h3>HD Business Pathways</h3>
    <h2>Build the business around your design, not the template.</h2>
    <p>Your structure, your income streams, and the way you make decisions mapped to your specific type and authority, so the business stops fighting you. The same revenue, built on a shape you can actually sustain.</p>`},

  {t:'pillar1b', html:`
    <div class="kicker">HD Business Pathways in practice</div>
    <h2>Same goal, a route that fits you.</h2>
    <p>Two women can both want to scale to the next revenue level. One is built to grow through deep one-to-one work and selective launches; the other through volume, visibility, and fast iteration. Run the wrong route and it feels like dragging a boulder uphill. Run yours and the same target feels obvious.</p>`},

  {t:'pillar2', html:`
    <div class="kicker">The method, part 2 of 3</div>
    <h3>Energetic Infrastructure</h3>
    <h2>Systems that let you scale reach and revenue without scaling effort.</h2>
    <p>Your sales, marketing, offers, and operations rebuilt to run on your energy instead of draining it. This is how capacity grows: not more hours and more hires, but infrastructure that holds more without asking more of you.</p>`},

  {t:'pillar3', html:`
    <div class="kicker">The method, part 3 of 3</div>
    <h3>The 3 Feminine Success Codes</h3>
    <h2>Magnetism over urgency. Receiving over forcing. Aligned decisions over second-guessing.</h2>
    <p>The inner shifts that make the structure actually hold: trusting your own timing, selling from magnetism, and making decisions from clarity instead of capacity. This is where income starts to flow without the grind.</p>`},

  {t:'myth', html:`
    <div class="kicker">The myth to drop</div>
    <h2>You do not need another strategy. You need the one that is yours.</h2>
    <p class="lead">More information has never been the thing standing between you and the next level.</p>
    <p>You already know how to work hard and follow a plan. What you have not had is a plan written for how you are actually wired. That is the shift this method makes, and it is why it tends to feel less like learning something new and more like finally being allowed to stop performing.</p>`},

  {t:'part3', html:`
    <div class="step">PART THREE</div>
    <h2>When the business finally matches the woman running it</h2>
    <ul>
      <li>You make decisions quickly, from your authority, and stop second-guessing.</li>
      <li>Your marketing attracts the right clients before you post, because it finally sounds like you.</li>
      <li>Revenue and reach grow while your hours and your team stay the same.</li>
      <li>Success stops costing you your health, your relationships, and your joy.</li>
    </ul>`},

  {t:'whyme', html:`
    <div class="kicker">Why learn this from me</div>
    <h2>I spent 14 years studying human behaviour before Human Design changed how I run everything.</h2>
    <p>I host one of the leading global Human Design podcasts, I built a seven-figure business while travelling with my family and working less, and I teach from what I actually run, not theory. I am not here to read you your chart. I am here to show you how to live it inside a business that finally fits.</p>`},

  {t:'cta', html:`
    <div class="pill">Your next step</div>
    <h2>Come scale from your design inside the HDx Collective.</h2>
    <p class="lead">If today landed, the HDx Collective is where we build your HD Business Pathways, your energetic infrastructure, and your feminine success codes into a business that grows without costing you more than it gives.</p>
    <p class="muted">Align your business and identity to your Human Design. Join at emmadunwoody.com/collective, or book a call to see if it is your next move.</p>
    <p class="disclaimer">For education only. No income, role, or result is guaranteed. Results vary with the person, the market, and the work you put in. Human Design is a framework for self-understanding and decision-making, not a promise of financial outcomes.</p>`}
];

const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  el.innerHTML = s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
