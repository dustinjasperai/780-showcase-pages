<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond High Performance - a live masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f1f3; --panel:#ffffff; --ink:#0d2f3f; --muted:#4a6472;
    --accent:#7fd9e8; --rule:#d7dde0; --deep:#0a2430;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:48px 44px;margin:0 0 20px;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;height:4px;width:100%;background:linear-gradient(90deg,var(--accent),transparent 70%)}
  .kicker{font-family:"Poppins";font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:"Poppins";font-weight:700;font-size:clamp(30px,5vw,48px);line-height:1.08;margin:14px 0 10px;letter-spacing:-.01em}
  h2{font-family:"Poppins";font-weight:600;font-size:clamp(23px,3.4vw,32px);line-height:1.14;margin:10px 0 8px}
  .sub{font-size:clamp(16px,2vw,19px);color:var(--muted);max-width:60ch}
  .body{font-size:17px;margin-top:14px;max-width:62ch}
  .big{font-family:"Poppins";font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.01em}
  .accentword{color:var(--deep);background:linear-gradient(180deg,transparent 62%,var(--accent) 62%);padding:0 2px}
  ul{list-style:none;margin-top:18px;display:grid;gap:12px}
  li{position:relative;padding-left:30px;font-size:17px}
  li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .tools{display:grid;gap:14px;margin-top:20px}
  .tool{border:1px solid var(--rule);border-radius:12px;padding:18px 20px}
  .tool .n{font-family:"Poppins";font-weight:600;font-size:18px}
  .tool .d{color:var(--muted);font-size:15px;margin-top:4px}
  .title-slide{padding:72px 44px}
  .title-slide h1{font-size:clamp(34px,6vw,60px)}
  .horizon{height:2px;background:var(--rule);margin:22px 0;position:relative}
  .horizon::after{content:"";position:absolute;left:0;top:-1px;height:4px;width:38%;background:var(--accent);border-radius:2px}
  .cta{background:var(--deep);color:#eaf6f9;border-color:var(--deep)}
  .cta::before{background:linear-gradient(90deg,var(--accent),transparent 60%)}
  .cta h2,.cta h1{color:#ffffff}
  .cta .sub{color:#b9d6de}
  .step{font-family:"Poppins";font-weight:600;color:var(--deep)}
  .disc{font-size:13px;color:#9db3bc;margin-top:22px;max-width:70ch}
  .n-of{position:absolute;right:20px;bottom:14px;font-size:12px;color:#aebfc7;font-family:"Poppins"}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:"A live masterclass for coaches", h:"Beyond High Performance", sub:"The coaching method that takes clients twice as far in half the time, with more satisfaction and less burnout."},
  {t:'who', k:"Who this is for", h:"Coaches who want results that last", list:["New coaches building real skill, not just a certificate","Practicing coaches whose clients have plateaued","Anyone who senses there is a better way than push harder"]},
  {t:'trap', k:"The trap", h:"You were trained to coach effort", body:"Accountability. Goal-setting. Keep them moving. It works for a while, then the client stalls, and the only tool left is to tell them to try harder."},
  {t:'reframe', k:"The reframe", h:"The grind is the ceiling", big:"Pushing <span class='accentword'>harder</span> is not the path through a plateau. It is usually what built the plateau."},
  {t:'cost', k:"What it costs", h:"Push-harder has a bill", list:["Burnout the client blames on themselves","Churn when the same wall shows up again","A coach whose only lever is more pressure"]},
  {t:'part', k:"Part one", h:"The core problem", body:"Most coaching optimizes a person's effort. It rarely touches what is actually capping them. So more strategy lands on an unchanged mindset and nothing moves."},
  {t:'point', k:"Why plateaus happen", h:"The cap is rarely effort", body:"An unexamined belief sets a quiet ceiling on what a client will attempt. Add more tactics on top of that ceiling and you get activity, not growth."},
  {t:'part', k:"Part two", h:"The MetaPerformance method", sub:"Three categories of tools that work together, not in isolation."},
  {t:'tools', k:"The toolkit", h:"Vision, Mindset, Strategy", tools:[["Vision Tools","Build a future the client is pulled toward, not pushed at."],["Mindset Tools","Surface and dismantle the beliefs that quietly cap them."],["Strategy Tools","Turn insight into concrete action and real-world results."]]},
  {t:'sequence', k:"How they work together", h:"A path, not three tactics", body:"Vision sets the direction worth moving toward. Mindset clears the block in the way. Strategy makes it real. Run out of order and you get motion without change."},
  {t:'how', k:"How it is taught", h:"You learn it by living it", body:"Introduce a tool. Practice it with a peer. Experience it as the client. Then get expert feedback. The method sticks because you have felt it from both chairs."},
  {t:'foundation', k:"The foundation", h:"Know what drives you first", body:"The 5i foundation helps a coach name what actually fuels them as a coach, before they build a single client plan. Your practice is only as steady as that clarity."},
  {t:'inquiry', k:"The posture", h:"Inquiry over advice", body:"Powerful questions let a client reach their own resources and see their own patterns. That is what develops character, integrity, and leadership, not another download of your opinion."},
  {t:'part', k:"Part three", h:"The method in a real session", sub:"The same client, coached on the method instead of the grind."},
  {t:'outcome', k:"The outcome", h:"Twice as far, half the time", big:"Clients move <span class='accentword'>deeper</span>, faster, and sustain it, because the ceiling moved, not just the effort."},
  {t:'sustain', k:"Why it holds", h:"Results they can keep", body:"Because the shift happens in how the client sees and chooses, not in how hard you push them, the gains stay after the session ends and after the engagement ends."},
  {t:'why', k:"Why this method", h:"Proven in demanding rooms", body:"This is the approach behind coaching inside organizations like Netflix, Pixar, and Red Bull. The standard is high, and the method holds up to it."},
  {t:'who-we-are', k:"The institute", h:"Built by coaches, for coaches", body:"The Meta Performance Institute was founded by Jason and Amanda Jaggard, author of Beyond High Performance, and trains a community of coaches to build thriving practices on this method."},
  {t:'cta', k:"Your next step", h:"See if this is your path", sub:"If this is how you want to coach, the next step is a short discovery call to see whether the Foundations program is the right fit for you.", disc:"This masterclass is educational. No income or result is guaranteed. Results vary and depend on the individual coach and their clients."}
];
function esc(x){return x==null?"":x}
function render(){
  const deck=document.getElementById('deck');
  S.forEach((s,i)=>{
    const el=document.createElement('section');
    el.className='slide'+(s.t==='title'?' title-slide':'')+(s.t==='cta'?' cta':'');
    let html='';
    if(s.k) html+='<div class="kicker">'+esc(s.k)+'</div>';
    if(s.t==='title'){ html+='<h1>'+esc(s.h)+'</h1><div class="horizon"></div><p class="sub">'+esc(s.sub)+'</p>'; }
    else { html+='<h2>'+esc(s.h)+'</h2>'; }
    if(s.sub && s.t!=='title') html+='<p class="sub">'+esc(s.sub)+'</p>';
    if(s.big) html+='<p class="big" style="margin-top:18px">'+s.big+'</p>';
    if(s.body) html+='<p class="body">'+esc(s.body)+'</p>';
    if(s.list){ html+='<ul>'+s.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'; }
    if(s.tools){ html+='<div class="tools">'+s.tools.map(x=>'<div class="tool"><div class="n">'+esc(x[0])+'</div><div class="d">'+esc(x[1])+'</div></div>').join('')+'</div>'; }
    if(s.disc) html+='<p class="disc">'+esc(s.disc)+'</p>';
    html+='<span class="n-of">'+(i+1)+' / '+S.length+'</span>';
    el.innerHTML=html;
    deck.appendChild(el);
  });
}
render();
</script>
</body>
</html>
