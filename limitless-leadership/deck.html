<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People + Process = Profit - Limitless Leadership Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111213;        /* brand dark ground (oklch 0.18 0.004 270) */
    --panel:#1a1c22;     /* lifted panel */
    --rule:#2b2f38;      /* hairline rule */
    --ink:#f1ede1;       /* brand warm ivory (oklch 0.946 0.016 89) */
    --body:#d7d4cd;      /* brand warm grey (oklch 0.87 0.01 85) */
    --accent:#2f3ccb;    /* royal blue, lightened from brand deep navy #010b6b */
    --display:'Anton', sans-serif;
    --text:'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:var(--text);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:4px;
    padding:64px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent)}
  .eyebrow{font-family:var(--text);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);color:var(--ink);font-size:72px;line-height:.98;
    text-transform:uppercase;letter-spacing:.005em;margin-bottom:22px}
  h2{font-family:var(--display);color:var(--ink);font-size:48px;line-height:1.02;
    text-transform:uppercase;margin-bottom:20px}
  h3{font-family:var(--display);color:var(--ink);font-size:30px;line-height:1.05;
    text-transform:uppercase;margin-bottom:14px}
  p{font-size:21px;color:var(--body);margin-bottom:16px;max-width:40ch}
  p.lead{font-size:25px;color:var(--ink);max-width:34ch}
  .big{font-family:var(--display);color:var(--ink);font-size:56px;line-height:1.02;
    text-transform:uppercase;max-width:20ch}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:21px;color:var(--body);padding-left:30px;position:relative;margin-bottom:14px;max-width:44ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent)}
  .steps{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px}
  .step{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:22px}
  .step .n{font-family:var(--display);color:var(--accent);font-size:34px}
  .step .k{font-family:var(--display);color:var(--ink);font-size:22px;text-transform:uppercase;margin:4px 0 6px}
  .step .d{font-size:16px;color:var(--body)}
  .brandline{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink);font-size:20px;margin-top:30px}
  .disc{margin-top:26px;font-size:14px;color:#8d8a84;max-width:70ch;line-height:1.5}
  .kicker{font-size:19px;color:var(--body);max-width:42ch;margin-top:8px}
  .pagefoot{font-size:12px;color:#6f6c67;letter-spacing:.14em;text-transform:uppercase;
    position:absolute;bottom:20px;right:28px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A live masterclass for auto repair & blue-collar shop owners',
    h1:'People + Process = Profit',
    kicker:'How to build a shop that runs on your people and your process, not on you being in the bay.',
    brand:'Limitless Leadership' },

  {t:'content',
    eyebrow:'The promise',
    h2:'One hour. One shift.',
    lead:'By the end of this session you will know exactly how to turn your team into leaders so the shop keeps running at a high level when you are not standing in it.',
    body:'Not more hustle. Not another pay plan. A repeatable way to lead the people who already work for you.' },

  {t:'content',
    eyebrow:'Who this is for',
    h2:'You became the owner because you were the best tech',
    body:'You can out-diagnose, out-work and out-care anyone in the building. That is exactly why the shop leans on you for everything.',
    lead:'The thing that made you great on the tools is the thing holding the business back.' },

  {t:'hook',
    eyebrow:'The reframe',
    big:'Your shop does not have a profit problem. It has a leadership problem wearing a profit problem's clothes.' },

  {t:'section', eyebrow:'Part one', h2:'The real problem', kicker:'Why profit is the output, never the starting point.' },

  {t:'content',
    eyebrow:'People + Process = Profit',
    h2:'Profit is the scoreboard, not the game',
    body:'When owners chase profit directly they squeeze pay, cut corners and burn people out. Profit is what happens after you develop people and give them process.',
    lead:'Fix the people and the process, and the number takes care of itself.' },

  {t:'list',
    eyebrow:'What is quietly costing you',
    h2:'Four things killing your culture',
    items:['Mindset: the owner is the ceiling, and everyone feels it',
           'Disengagement: good techs who have quietly checked out',
           'Poor communication: the same issue re-explained every week',
           'Lack of accountability: standards that only hold when you are watching'] },

  {t:'content',
    eyebrow:'Why hustle will not fix it',
    h2:'You cannot out-work a leadership gap',
    body:'Another sixty-hour week from you buys a little time and raises the ceiling by zero. The only real leverage is other people who can lead.',
    lead:'More hours from the owner is the most expensive duct tape in the shop.' },

  {t:'section', eyebrow:'Part two', h2:'How you build leaders', kicker:'The system: lead yourself, develop your team, lead your team.' },

  {t:'content',
    eyebrow:'Step one - lead yourself',
    h2:'It starts with the person in the mirror',
    body:'Self-awareness, emotional regulation and mindset. You cannot hand a team a standard you do not hold yourself. This is the quiet work most owners skip.' },

  {t:'hook',
    eyebrow:'The transition nobody teaches',
    big:'Your best technician is not automatically your best leader.' },

  {t:'content',
    eyebrow:'',
    h3:'The move: from individual contributor to coach',
    body:'The skills that make someone great in the bay are not the skills that make them great leading the bay. Promoting a top tech without building the leader underneath is how shops lose their best people.',
    lead:'You have to build the leader on purpose.' },

  {t:'list',
    eyebrow:'Step two - develop your team',
    h2:'The daily reps of leadership',
    items:['Clear, direct communication and strategic questions',
           'Crucial conversations held early, not avoided',
           'Real one-on-ones and a daily huddle that actually runs',
           'Delegation that hands off ownership, not just tasks'] },

  {t:'steps',
    eyebrow:'The MAWL method',
    h2:'How to hand off without it falling apart',
    steps:[
      {n:'M',k:'Model',d:'You do it, out loud, so they see the standard.'},
      {n:'A',k:'Assist',d:'They do it, you work alongside and correct in real time.'},
      {n:'W',k:'Watch',d:'They do it, you observe and give feedback after.'},
      {n:'L',k:'Lead',d:'They own it, and they teach the next person.'} ] },

  {t:'list',
    eyebrow:'Step three - lead your team',
    h2:'Build the machine around the people',
    items:['Hire and onboard for standards, not just skills',
           'Cast a vision your team can actually repeat back',
           'Train on purpose instead of hoping it rubs off',
           'Make the culture survive a day without you in it'] },

  {t:'steps',
    eyebrow:'Roots to Results',
    h2:'How the work actually goes',
    steps:[
      {n:'1',k:'Discovery',d:'Understand who you are, how you lead, and where you want to grow.'},
      {n:'2',k:'Action',d:'Customized work around your development as a leader.'},
      {n:'3',k:'Results',d:'You coach people better, and you know when to lead.'} ] },

  {t:'section', eyebrow:'Part three', h2:'On the shop floor', kicker:'A shop that runs on people and process.' },

  {t:'content',
    eyebrow:'The picture',
    h2:'The morning you take off and nothing breaks',
    body:'The huddle runs without you. The hard conversation gets handled by the manager you built. A rising tech is being coached by the one you promoted last year.',
    lead:'That is People + Process = Profit, running on its own.' },

  {t:'content',
    eyebrow:'Why this, why me',
    h2:'Built in the bay, not a boardroom',
    body:'Twenty-five-plus years in leadership, including years as a corporate trainer with Christian Brothers Automotive, now leading the Limitless Leadership team and the Limitless Leadership Podcast.',
    lead:'This is leadership for the skilled trades, from someone who has stood where you stand.',
    brand:'Josh Parnell, Limitless Leadership' },

  {t:'content',
    eyebrow:'Do this week',
    h2:'Start one rep',
    body:'Pick one person and run one real one-on-one this week. Not about cars. About them, their growth, and one thing they will own next.',
    lead:'Leadership is a habit before it is a result.' },

  {t:'list',
    eyebrow:'Recap',
    h2:'People + Process = Profit',
    items:['Lead yourself first',
           'Develop your team with the daily reps and MAWL',
           'Lead your team so the shop runs without you',
           'Profit follows the people, every time'] },

  {t:'cta',
    eyebrow:'Your next step',
    h2:'Ready to build the leaders your shop needs?',
    body:'Book a discovery call with the Limitless Leadership team and we will map the leadership plan for your shop.',
    brand:'People + Process = Profit · Limitless Leadership',
    disc:'This masterclass is for educational purposes only. Results vary and depend on your own effort, team and circumstances. Nothing presented here is a guarantee of income or business results.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '';
  if(s.eyebrow) h += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.h1) h += `<h1>${s.h1}</h1>`;
  if(s.h2) h += `<h2>${s.h2}</h2>`;
  if(s.h3) h += `<h3>${s.h3}</h3>`;
  if(s.big) h += `<div class="big">${s.big}</div>`;
  if(s.lead) h += `<p class="lead">${s.lead}</p>`;
  if(s.body) h += `<p>${s.body}</p>`;
  if(s.kicker) h += `<div class="kicker">${s.kicker}</div>`;
  if(s.items){ h += '<ul>'; s.items.forEach(it=> h += `<li>${it}</li>`); h += '</ul>'; }
  if(s.steps){ h += '<div class="steps">'; s.steps.forEach(st=> h += `<div class="step"><div class="n">${st.n}</div><div class="k">${st.k}</div><div class="d">${st.d}</div></div>`); h += '</div>'; }
  if(s.brand) h += `<div class="brandline">${s.brand}</div>`;
  if(s.disc) h += `<div class="disc">${s.disc}</div>`;
  h += `<div class="pagefoot">Limitless Leadership · ${i+1} / ${S.length}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
