<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mental Fitness Method — Prime Mind Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181F; --panel:#1E232D; --rule:#333B49;
    --accent:#E6A42B; --ink:#ECEFF3; --muted:#9AA4B2; --deep:#0E1218;
    --head:'Sora',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--deep);color:var(--ink);font-family:var(--body);}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 64px;}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:46px 48px;margin:0 0 20px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden;}
  .slide .tag{position:absolute;top:20px;right:26px;font-family:var(--head);
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .kick{font-family:var(--head);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin:0 0 16px;font-weight:600;}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.04;margin:0 0 14px;}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.1;margin:0 0 14px;}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin:0 0 12px;max-width:62ch;}
  p.sub{color:var(--muted);font-size:18px;}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.12;}
  .big .a{color:var(--accent);}
  ul{margin:14px 0 0;padding:0;list-style:none;max-width:64ch;}
  li{position:relative;padding:12px 0 12px 30px;border-top:1px solid var(--rule);
    font-size:18px;line-height:1.45;}
  li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;
    background:var(--accent);border-radius:3px;}
  li b{font-family:var(--head);font-weight:600;}
  .part .no{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.2em;
    color:var(--accent);text-transform:uppercase;margin:0 0 10px;}
  .rep{display:flex;gap:8px;margin:0 0 18px;}
  .rep i{width:34px;height:8px;border-radius:4px;background:var(--rule);display:block;}
  .rep i.on{background:var(--accent);}
  .foot{position:absolute;bottom:18px;left:48px;font-family:var(--head);font-size:12px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .disc{color:var(--muted);font-size:14px;line-height:1.5;margin-top:18px;max-width:70ch;}
  .cta-step{font-family:var(--head);font-weight:600;font-size:22px;color:var(--ink);margin-top:8px;}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
   kick:"Prime Mind Coaching",
   h:"The Mental Fitness Method",
   sub:"Perform under pressure like an elite athlete. In business."},

  {t:'promise',
   kick:"What you'll leave with",
   h2:"A way to train composure, not just hope for it",
   sub:"The same mental training elite athletes use, rebuilt for owners, leaders and teams who carry real pressure every week."},

  {t:'who',
   kick:"Who this is for",
   h2:"High performers who've hit a ceiling that isn't about skill",
   list:["You already know your craft, yet big moments still shrink you",
         "You overthink, freeze, or push until you burn out",
         "You lead a team and want them steadier under pressure, not just busier"]},

  {t:'trap',
   kick:"The trap",
   h2:"You were taught to work harder, never to train your mind",
   sub:"So when pressure spikes, you reach for more effort and more hours. It works for a while, then it stops working, and nobody taught you what to do instead."},

  {t:'reframe',
   kick:"The reframe",
   big:'Your ceiling isn’t <span class="a">talent</span>. It’s mental fitness.',
   sub:"Talent and effort get you in the room. What you do with your mind under pressure decides what happens next. That part is trainable."},

  {t:'part',
   no:"Part One",
   h2:"Why the untrained mind breaks first"},

  {t:'teach',
   kick:"The core problem",
   h2:"Under pressure, the mind goes before the skill does",
   list:["Attention narrows and you miss what you normally see",
         "The body floods and your hands, voice and timing slip",
         "You start managing your nerves instead of the moment"]},

  {t:'teach',
   kick:"Why effort alone plateaus",
   h2:"You can't out-train a mind you never trained",
   sub:"Physical work, preparation and skill are the body of performance. Without the mental side, you plateau, and the hardest moments are exactly where the gap shows."},

  {t:'part',
   no:"Part Two",
   h2:"The Mental Fitness Method"},

  {t:'pillar',
   kick:"Pillar one",
   reps:1,
   h2:"Train the mind like the body",
   sub:"Reps, recovery and pressure sets. Small repeatable practices done daily, not a pep talk summoned on the big day. Fitness, not motivation."},

  {t:'pillar',
   kick:"Pillar two",
   reps:2,
   h2:"Set goals by identity, not just by target",
   sub:"Chasing a number pulls you toward the finish line and away from the person who gets there. Aim at who you're becoming, and the behaviour follows."},

  {t:'pillar',
   kick:"Pillar three",
   reps:3,
   h2:"Composure on command",
   list:["A breath reset that drops the noise fast",
         "A pressure cue you've rehearsed, so it fires without thinking",
         "A simple decision routine for the moment that counts"]},

  {t:'pillar',
   kick:"Pillar four",
   reps:4,
   h2:"Train the whole person",
   sub:"Mind, body and emotion are one system. Integrate them and performance holds under load instead of cracking. Treat them separately and the weakest link decides the day."},

  {t:'part',
   no:"Part Three",
   h2:"What a trained mind looks like"},

  {t:'look',
   kick:"A hard week, handled",
   h2:"Same pressure, different person inside it",
   list:["The high-stakes moment arrives and you're clear, not flooded",
         "You make the call instead of spiralling around it",
         "You finish the week with fuel left, not running on empty"]},

  {t:'look',
   kick:"The compounding effect",
   h2:"Reps add up the way training always has",
   sub:"One session changes a day. A season of mental reps changes who shows up to the pressure. That is the whole point of fitness: it stays with you."},

  {t:'why',
   kick:"Why learn this from me",
   h2:"Twenty years inside high performance",
   list:["Former elite athlete with 20+ years in high-performance sport",
         "Mindskills coach for Cricket NSW: decisions and nerve under real pressure",
         "17 years teaching, so this is built to be learned, not just admired"]},

  {t:'recap',
   kick:"The method, in one line",
   big:'You don’t rise to the occasion. You fall to your <span class="a">training</span>.',
   sub:"Train the mind like the body, aim by identity, build composure, integrate the whole person. That is mental fitness."},

  {t:'cta',
   kick:"Your next step",
   h2:"Train your mind the way you train everything else",
   step:"Book a conversation with Prime Mind Coaching to start.",
   disc:"This session is educational. No income or result is guaranteed. Results vary and depend on your own effort, situation and consistency."}
];

const d=document.getElementById('deck');
function esc(x){return x;}
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide '+s.t;
  let h='';
  h+='<span class="tag">Prime Mind</span>';
  if(s.no) h+='<div class="no">'+s.no+'</div>';
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  if(typeof s.reps==='number'){let r='<div class="rep">';for(let i=1;i<=4;i++){r+='<i class="'+(i<=s.reps?'on':'')+'"></i>';}r+='</div>';h+=r;}
  if(s.h) h+='<h1>'+s.h+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.big) h+='<p class="big">'+s.big+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(it=>h+='<li>'+it+'</li>');h+='</ul>';}
  if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
  if(s.step) h+='<p class="cta-step">'+s.step+'</p>';
  if(s.disc) h+='<p class="disc">'+s.disc+'</p>';
  h+='<div class="foot">primemindcoaching.com.au</div>';
  el.innerHTML=h;
  d.appendChild(el);
});
</script>
</body>
</html>
