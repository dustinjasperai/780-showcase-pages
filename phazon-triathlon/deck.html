<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your First IRONMAN on a Busy-Life Schedule — Phazon Triathlon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f9fc;        /* near-white cool ground (brand site is light) */
    --panel:#ffffff;
    --ink:#13242e;       /* deep slate (from brand #222222 + water world) */
    --muted:#5a6b76;
    --rule:#dce6ec;
    --accent:#42b4e5;    /* dominant brand blue, brand.json 47 uses */
    --accent-deep:#2a7fa8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:48px 52px;margin:0 0 20px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .tag{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--accent-deep)}
  .splitrow{display:flex;gap:18px;margin-top:6px}
  .splitrow span{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--muted)}
  .splitrow span b{color:var(--accent-deep);font-weight:700}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:62px;line-height:1.02;letter-spacing:-.01em;margin:16px 0 14px}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;line-height:1.05;margin:14px 0 18px}
  p{font-size:19px;line-height:1.55;color:#243743;max-width:62ch;margin:0 0 14px}
  p.lead{font-size:22px;color:var(--ink)}
  .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1.15}
  ul{list-style:none;margin:10px 0 0}
  li{position:relative;padding:12px 0 12px 30px;border-top:1px solid var(--rule);font-size:18px;color:#243743}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:3px;background:var(--accent);border-radius:2px}
  .pill{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:#fff;background:var(--accent-deep);padding:5px 12px;border-radius:999px;margin-bottom:8px}
  .framework{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px}
  .fw{border:1px solid var(--rule);border-radius:10px;padding:16px 18px;background:#fbfdfe}
  .fw .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--accent-deep);font-size:15px;letter-spacing:.1em;text-transform:uppercase}
  .fw .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;margin:2px 0 4px}
  .fw p{font-size:16px;margin:0;color:#3a4b56}
  .credit{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .credit span{font-size:13px;font-weight:500;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:5px 11px;background:#fbfdfe}
  .cta h2{font-size:46px}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .brand{position:absolute;right:28px;top:26px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted)}
  .num{position:absolute;right:28px;bottom:22px;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#9fb3bf;letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title'},
  {t:'content', tag:'The promise', h:'By the end of the next hour',
   lead:'You will know exactly what it takes to get an ordinary, busy athlete to an IRONMAN finish line.',
   body:'Not a generic training plan. The real decisions: how many hours you actually need, which sessions matter, how to stay healthy, and how to hold it all together around a job and a family.'},
  {t:'content', tag:'Who this is for', h:'You have a full life and a big race on the calendar',
   lead:'Work, family, a social life, and somewhere in the diary: your first IRONMAN, or the step up from 70.3 to 140.6.',
   body:'You are not chasing a podium. You want to get to that finish line in one piece, proud of how you trained, without your training taking over everything else that matters.'},
  {t:'content', tag:'The trap', h:'The plan you downloaded was written for someone else',
   body:'Free and generic plans assume a life you do not have. They pile on volume because more always looks better on paper. Miss a week to a work trip or a sick kid and the whole thing falls apart, so you either burn out trying to catch up, or quietly give up on the number you circled.'},
  {t:'content', tag:'The cost', h:'What getting it wrong actually costs',
   body:'An IRONMAN is not a cheap day out. By the time you have paid the entry fee, bought the bike, the wetsuit and the shoes, and given up hundreds of hours of family time, you are a long way in. The last thing you want is to arrive at the start line injured, undertrained, or so burnt out you cannot enjoy it.'},
  {t:'content', tag:'The reframe', h:'Finishing an IRONMAN is not a volume problem',
   lead:'It is a consistency and a decision problem.',
   body:'The athletes who cross the line are rarely the ones who trained the most hours. They are the ones who trained the right hours, stayed healthy, and made good calls on the handful of sessions that actually move the needle. That is coachable. That is the whole point of today.'},
  {t:'part', pill:'Part One', h:'Why busy athletes break down',
   body:'Three quiet failure points that end most first IRONMAN attempts long before race day.'},
  {t:'list', tag:'Part One', h:'The three things that end a campaign early',
   items:[
     'Ramping volume faster than your body can absorb it, so a niggle becomes an injury in week nine.',
     'Training every discipline hard and none of them smart, so you are tired everywhere and strong nowhere.',
     'No plan for the real week: the missed session, the bad night of sleep, the 60-hour work stretch.']},
  {t:'content', tag:'Part One', h:'More hours is the wrong first answer',
   body:'When progress stalls, the instinct is to add training. For a busy athlete that is usually the exact wrong move. The ceiling is rarely your fitness; it is your recovery, your time, and how well the hard and easy days are spaced. Fix those and the same hours do far more work.'},
  {t:'part', pill:'Part Two', h:'The whole-athlete method',
   body:'Not just swim, bike and run. The full picture that actually gets an age-grouper to the line.'},
  {t:'framework', tag:'Part Two', h:'What we coach, and why each one matters',
   fws:[
     {n:'Pillar 1', t:'The whole athlete', p:'Swim, bike and run plus strength, nutrition, race planning and the mental side, coached as one system instead of four disconnected ones.'},
     {n:'Pillar 2', t:'Train on your data, not a template', p:'Sessions set to your current ability and reviewed with the numbers after every workout, so the plan adapts to you week by week.'},
     {n:'Pillar 3', t:'Minimum effective training', p:'The fewest right sessions for the life you actually have. How many per week, how long the key ride and run get, and how to spread the hard efforts so you stay healthy.'}]},
  {t:'content', tag:'Part Two', h:'Strength and fuel are not optional extras',
   body:'The two things age-groupers skip first are the two that keep them on the start line. A little strength work protects the joints that break down over big weeks. A rehearsed fuelling plan is the difference between running the marathon and walking it. Neither takes much time; both change the outcome.'},
  {t:'list', tag:'Part Two, in practice', h:'The IRONMAN broken into solvable pieces',
   items:[
     'Swim: building to 3.8km of calm, repeatable open-water endurance.',
     'Bike: a setup and pacing plan for 180km that leaves your legs something for the run.',
     'Run: how to run a marathon on tired legs without blowing up in the first 10km.',
     'Fuel: a race-day nutrition plan you have rehearsed, not guessed.']},
  {t:'content', tag:'The honest bit', h:'A human coach beats a smarter spreadsheet',
   body:'AI and off-the-shelf plans do not know you skipped a session because your child was ill, or that your left knee only likes certain workloads. They escalate volume because that is the safe default, and the safe default is how busy athletes get hurt. The judgement about when to push and when to pull back is the part that actually keeps you on the start line.'},
  {t:'part', pill:'Part Three', h:'Your season, mapped backwards from race day',
   body:'From the race you circled to the finish line, on the hours you really have.'},
  {t:'list', tag:'Part Three', h:'A season that fits around your life',
   items:[
     'We start from your race date and your real weekly hours, then work backwards.',
     'Each week is set to your ability and adjusted from the data after your sessions.',
     'When life gets in the way, the plan bends instead of breaking, and you stay healthy.',
     'You arrive at race day trained, not fried, knowing you have done the work.']},
  {t:'content', tag:'Part Three', h:'What the finish line actually feels like',
   body:'The reason I coach is that moment: an ordinary person with a job and a family, who was told an IRONMAN was for other people, hearing their name and the word "IRONMAN" on the same sentence. It is not reserved for the top 1 percent. It is reserved for the people who train smart and stay consistent.'},
  {t:'why', tag:'Why me', h:'Who is coaching you',
   body:'I am Simon Olney. I started coaching not to work with the top 1 percent, but to help people with busy lives achieve big dreams. I am a pragmatist, focused on the help you actually need rather than obsessing over the details.',
   credits:['IRONMAN Certified Coach','British Triathlon High Performance Coach','Certified Nutrition Coach','Level 4 Personal Trainer','Strength Coach','Athletes qualified for Kona']},
  {t:'cta', h:'Let us plan your first IRONMAN',
   body:'If you want a season built around your life and your race, book a free 15-minute chat and we will map the first steps together.',
   disc:'Educational content only. Triathlon training carries inherent physical risk; consult a qualified medical professional before starting any new program. Individual results vary and no specific outcome, finishing time, or qualification is guaranteed.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
const splits='<div class="splitrow"><span><b>SWIM</b></span><span><b>BIKE</b></span><span><b>RUN</b></span></div>';
S.forEach((s,i)=>{
  const sl=el('div','slide'+(s.t==='cta'?' cta':''));
  sl.appendChild(el('div','brand','Phazon Triathlon'));
  if(s.t==='title'){
    sl.appendChild(el('div','tag','A Phazon Triathlon Masterclass'));
    sl.appendChild(el('h1','','Your First IRONMAN on a Busy-Life Schedule'));
    sl.appendChild(el('p','lead','The whole-athlete, data-driven way for an age-grouper with a full life to reach the hardest finish line in endurance sport, healthy and proud.'));
    sl.insertAdjacentHTML('beforeend',splits);
  } else if(s.t==='part'){
    sl.appendChild(el('span','pill',s.pill));
    sl.appendChild(el('h2','',s.h));
    sl.appendChild(el('p','lead',s.body));
  } else if(s.t==='list'){
    if(s.tag)sl.appendChild(el('div','tag',s.tag));
    sl.appendChild(el('h2','',s.h));
    const ul=el('ul');s.items.forEach(it=>ul.appendChild(el('li',null,it)));sl.appendChild(ul);
  } else if(s.t==='framework'){
    if(s.tag)sl.appendChild(el('div','tag',s.tag));
    sl.appendChild(el('h2','',s.h));
    const g=el('div','framework');
    s.fws.forEach(f=>{const c=el('div','fw');c.appendChild(el('div','n',f.n));c.appendChild(el('div','t',f.t));c.appendChild(el('p',null,f.p));g.appendChild(c);});
    sl.appendChild(g);
  } else if(s.t==='why'){
    if(s.tag)sl.appendChild(el('div','tag',s.tag));
    sl.appendChild(el('h2','',s.h));
    sl.appendChild(el('p',null,s.body));
    const cr=el('div','credit');s.credits.forEach(c=>cr.appendChild(el('span',null,c)));sl.appendChild(cr);
  } else if(s.t==='cta'){
    sl.appendChild(el('div','tag','Your next step'));
    sl.appendChild(el('h2','',s.h));
    sl.appendChild(el('p','lead',s.body));
    sl.appendChild(el('div','disc',s.disc));
  } else {
    if(s.tag)sl.appendChild(el('div','tag',s.tag));
    sl.appendChild(el('h2','',s.h));
    if(s.lead)sl.appendChild(el('p','lead',s.lead));
    if(s.body)sl.appendChild(el('p',null,s.body));
  }
  sl.appendChild(el('div','num',String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')));
  deck.appendChild(sl);
});
</script>
</body>
</html>
