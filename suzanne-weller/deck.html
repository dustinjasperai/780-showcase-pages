<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outsight &lt;&gt; Insight — A Masterclass with Suzanne Weller</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1113; --panel:#13201f; --rule:#126a7b; --accent:#c4e9ef;
    --ink:#f3f8f9; --muted:#9db6bb;
    --display:'Poppins',system-ui,sans-serif; --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05090a;color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:32px 18px}
  .slide{background:var(--bg);border:1px solid #1c2c2c;border-radius:18px;
    padding:60px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"<>";position:absolute;right:30px;bottom:18px;font-family:var(--display);
    font-weight:700;font-size:34px;color:#16343a;letter-spacing:-2px}
  .kick{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-1px}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.12;margin-bottom:18px}
  .lead{font-size:20px;color:var(--muted);margin-top:18px;max-width:30ch}
  p{font-size:19px;margin-top:14px;max-width:62ch;color:#d7e6e8}
  .big{font-size:30px;font-weight:600;font-family:var(--display);line-height:1.2;color:var(--ink)}
  ul{margin-top:18px;padding-left:0;list-style:none;max-width:60ch}
  li{font-size:19px;margin:12px 0;padding-left:28px;position:relative;color:#d7e6e8}
  li::before{content:"<>";position:absolute;left:0;top:1px;color:var(--rule);font-family:var(--display);
    font-weight:700;font-size:15px}
  .duo{display:flex;gap:22px;margin-top:24px;flex-wrap:wrap}
  .duo .col{flex:1;min-width:230px;background:var(--panel);border:1px solid #244040;border-radius:14px;padding:26px}
  .duo h3{font-family:var(--display);font-size:22px;color:var(--accent);margin-bottom:10px}
  .duo p{font-size:17px;margin-top:0}
  .accent{color:var(--accent)}
  .rulebar{width:64px;height:4px;background:var(--rule);border-radius:3px;margin:22px 0}
  .title h1{font-size:62px}
  .byline{margin-top:26px;font-family:var(--display);font-weight:600;font-size:18px;color:var(--ink)}
  .byline span{color:var(--muted);font-weight:400}
  .cta{background:linear-gradient(160deg,#102227,#0b1113);border-color:#2a4a4f}
  .cta h2{font-size:40px}
  .step{font-size:21px;margin-top:18px;color:var(--ink)}
  .disc{margin-top:28px;font-size:13px;color:#7fa0a5;max-width:60ch;line-height:1.5}
  .num{font-family:var(--display);font-weight:700;color:#1f3c42;font-size:70px;line-height:1;margin-bottom:6px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="kick">A live masterclass with Suzanne Weller</div>
    <h1>Outsight <span class="accent">&lt;&gt;</span> Insight</h1>
    <div class="rulebar"></div>
    <p class="lead">Why you can't see your own leadership from where you're standing, and the practice that fixes it.</p>
    <div class="byline">Suzanne Weller <span>/ Weller Collaboration / host of The Courage Effect</span></div>`},

  {t:'promise', html:`
    <div class="kick">What you'll leave with</div>
    <h2>One hour. A different vantage point.</h2>
    <ul>
      <li>Why senior leaders go blind to their own leadership, and how to tell when it's happening to you</li>
      <li>The Outsight <span class="accent">&lt;&gt;</span> Insight practice: how to borrow outside perspective and pair it with inner clarity</li>
      <li>How to choose courage over comfort on the decisions you keep postponing</li>
    </ul>`},

  {t:'who', html:`
    <div class="kick">Who this is for</div>
    <h2>Senior leaders carrying real weight.</h2>
    <p>You have high stakes and little room to think out loud. People look to you for the answer, which means you rarely get honest perspective on your own leadership.</p>
    <p class="big">This is for the leader who is ready to be a learner again.</p>`},

  {t:'trap', html:`
    <div class="kick">The trap</div>
    <h2>You've optimized everything and still feel stuck.</h2>
    <p>More frameworks. More feedback forms. More effort. And yet the hardest problems keep coming back in a slightly different shape.</p>
    <p>That isn't a discipline problem. You're working hard on the part of the picture you can already see.</p>`},

  {t:'reframe', html:`
    <div class="kick">The reframe</div>
    <h2 class="accent">The problem isn't effort. It's vantage point.</h2>
    <p>You cannot see your own leadership from inside your own head. The blind spots are, by definition, the ones you can't see on your own.</p>`},

  {t:'part', html:`<div class="num">01</div><div class="kick">Part one</div><h2>The single vantage point.</h2>
    <p>Every leader builds a view of themselves from one position: their own. It feels complete because it's all you have. It is also exactly where the blind spots live.</p>`},

  {t:'cost', html:`
    <div class="kick">The cost</div>
    <h2>Performed leadership is expensive.</h2>
    <p>When you can only see one side, you start performing the role instead of practicing it: looking certain, protecting the image, avoiding the conversation that would actually move things.</p>
    <p class="big accent">Leadership isn't a title. It's a practice, built from everything you've actually lived through.</p>`},

  {t:'part', html:`<div class="num">02</div><div class="kick">Part two</div><h2>The three C's.</h2>
    <p>Everything in this practice ladders up to three things. They are simple to name and hard to do under pressure.</p>
    <ul><li><b class="accent">Communication</b>, saying the true thing clearly</li><li><b class="accent">Connection</b>, real trust, not performed rapport</li><li><b class="accent">Courage</b>, acting before you feel ready</li></ul>`},

  {t:'outsight', html:`
    <div class="kick">The method, part one</div>
    <h2>Outsight.</h2>
    <p>Outsight is the perspective you can only get from outside your own head, your team, and your industry. It's the view of your leadership you cannot reach alone.</p>
    <p>You borrow it on purpose: from honest peers, from a coach, from people who are not invested in protecting your image.</p>`},

  {t:'insight', html:`
    <div class="kick">The method, part two</div>
    <h2>Insight.</h2>
    <p>Insight is what you find by looking inward: your patterns, your real motives, the story you're telling yourself about the situation.</p>
    <p>Outside perspective without inner clarity is just advice you won't use. Inner clarity without outside perspective is just your blind spots, polished.</p>`},

  {t:'duo', html:`
    <div class="kick">Why both</div>
    <h2>Outsight <span class="accent">&lt;&gt;</span> Insight</h2>
    <div class="duo">
      <div class="col"><h3>Outsight</h3><p>Sees what you can't. Widens the picture. Names the thing nobody told you.</p></div>
      <div class="col"><h3>Insight</h3><p>Makes it yours. Turns the outside view into a decision only you can make.</p></div>
    </div>
    <p>You need both, and they feed each other. That loop is the whole method.</p>`},

  {t:'courage', html:`
    <div class="kick">The bridge</div>
    <h2>Courage over comfort.</h2>
    <p>Seeing clearly changes nothing until you act on it. The gap between what you now see and what you actually do is closed by one thing: courage.</p>
    <p>Comfort keeps the picture the way it was. Courage is choosing the harder, truer move while the comfortable one is still available.</p>`},

  {t:'practice', html:`
    <div class="kick">The shift</div>
    <h2>From performing to practicing.</h2>
    <p>A practice is something you return to, not something you perform once and protect. You get outside perspective on a regular rhythm, you get honest with yourself, and you make the courageous move while it still matters.</p>`},

  {t:'hotseat', html:`
    <div class="kick">In the room</div>
    <h2>The hot seat.</h2>
    <p>The fastest version of this is sitting in a room of peers and bringing the problem you can't say out loud. You get candid, outside perspective in an hour, on the exact thing you've been circling for months.</p>
    <p class="big">Isolation at the top is a solvable problem.</p>`},

  {t:'part', html:`<div class="num">03</div><div class="kick">Part three</div><h2>The practice, once it's yours.</h2>
    <ul>
      <li>A standing source of outside perspective, not a once-a-year review</li>
      <li>A habit of inner clarity before big decisions, not after them</li>
      <li>The courageous conversation had on time, not avoided</li>
      <li>A leadership others can actually trust, because it's practiced, not performed</li>
    </ul>`},

  {t:'whyme', html:`
    <div class="kick">Who's teaching this</div>
    <h2>Suzanne Weller.</h2>
    <p>Founder of Weller Collaboration, with more than 20 years coaching leaders and teams, and a member of the Forbes Coaches Council. She has partnered with leaders and teams at Google, Microsoft, Amazon, Salesforce, Bristol Myers Squibb and Stanford University.</p>
    <p>She is the creator and host of The Courage Effect, a show about what becomes possible when you stop waiting to feel ready.</p>`},

  {t:'notfor', html:`
    <div class="kick">Who this isn't for</div>
    <h2>A quick word of honesty.</h2>
    <p>This isn't for the leader looking for a quick fix, who prefers to be the smartest person in the room, or who isn't facing a real challenge right now. The practice only works if you're willing to be a learner again.</p>`},

  {t:'recap', html:`
    <div class="kick">The whole thing in one breath</div>
    <h2>Outside in, then act.</h2>
    <ul>
      <li>You can't see your own leadership alone</li>
      <li>Outsight <span class="accent">&lt;&gt;</span> Insight gives you the full picture</li>
      <li>Courage over comfort turns the picture into a decision</li>
      <li>Done on a rhythm, it becomes a practice, not a performance</li>
    </ul>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next move</div>
    <h2>Keep practicing this with me.</h2>
    <p>If this was useful and you want to take it further, the next step is a short conversation about where you are and what you're working through.</p>
    <div class="step accent">Book a 15-minute fit call with Suzanne at wellercollaboration.com, or apply for the Outsight &lt;&gt; Insight executive mastermind.</div>
    <div class="disc">Educational content only. No income, role, outcome or result is guaranteed; leadership results vary by person and situation. Nothing here is professional, legal, or psychological advice.</div>`}
];
const deck = document.getElementById('deck');
S.forEach(s=>{
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls||'');
  d.innerHTML = s.html;
  deck.appendChild(d);
});
</script>
</body>
</html>
