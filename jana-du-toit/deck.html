<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Founder Freedom Method — Jana du Toit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3ece7;        /* warm cream ground, from brand #302427 family / light scheme */
    --panel:#fbf7f3;     /* lighter warm panel */
    --ink:#302427;       /* deep warm plum-brown, her dominant */
    --muted:#6f5f61;     /* softened ink */
    --accent:#d5848a;    /* dusty rose, her button color */
    --rule:#e4cfcf;      /* muted rose rule */
    --head:'Gentium Book Plus', Georgia, serif;
    --body:'Plus Jakarta Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(48,36,39,.03)}
  .kick{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.12}
  .sub{font-size:20px;color:var(--muted);margin-top:18px;line-height:1.5;max-width:40ch}
  .big{font-family:var(--head);font-size:40px;line-height:1.18;max-width:24ch}
  .big .st{text-decoration:line-through;text-decoration-color:var(--accent);color:var(--muted)}
  .big .hl{color:var(--accent)}
  ul{list-style:none;margin-top:24px;display:grid;gap:16px}
  li{font-size:20px;line-height:1.45;padding-left:26px;position:relative;max-width:46ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .note{font-size:17px;color:var(--muted);margin-top:22px;line-height:1.55;max-width:52ch}
  .part{font-family:var(--head);font-size:22px;color:var(--accent);font-weight:700;
    letter-spacing:.02em;margin-bottom:10px}
  .num{font-family:var(--head);font-size:88px;color:var(--rule);line-height:1;margin-bottom:8px}
  .disc{font-size:13px;color:var(--muted);margin-top:30px;border-top:1px solid var(--rule);
    padding-top:18px;max-width:60ch;line-height:1.5}
  .foot{font-size:13px;color:var(--muted);text-align:center;margin:30px 0 6px}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:380px}h1{font-size:36px}h2{font-size:28px}.big{font-size:28px}.num{font-size:60px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Jana du Toit &middot; Unstoppable Faithpreneur &middot; janadutoit.com</div>
<script>
const S = [
  {t:'title', k:'A live masterclass for Christian female founders',
   h:'The Founder Freedom Method',
   sub:'How to build a faith-aligned business that runs without you at the center of everything.'},

  {t:'who', k:'Who this is for',
   h:'You have clients. You have revenue. You are also the bottleneck.',
   sub:'For the Christian founder whose business works, but only because she is in every seat of it.'},

  {t:'trap', k:'The trap',
   h:'More clients just means more of you.',
   note:'Every new client is another thing only you can deliver. So growth does not buy you freedom. It buys you a bigger job, more hours away from your family, and a calling that quietly turns into a burden.'},

  {t:'reframe', k:'The reframe',
   big:'You do not have a <span class="st">growth</span> problem. You have a <span class="hl">founder-dependence</span> problem.'},

  {t:'part', part:'Part One', h:'Why the business cannot run without you'},

  {t:'problem', k:'The real cause',
   h:'Nothing is written down. It all lives in your head.',
   note:'The way you win clients, deliver the work, and keep the standard high is stored in one place: you. That is not a discipline problem. It is a design problem, and design is something you can change.'},

  {t:'cost', k:'What it costs',
   h:'Freedom, family, and calling pay the bill.',
   list:['You cannot step back without the business dipping.',
         'Rest feels irresponsible, so it never really comes.',
         'The work God gave you starts to feel like it owns you.']},

  {t:'part', part:'Part Two', h:'The Founder Freedom Method'},

  {t:'intro', k:'Three pillars',
   h:'Freedom is built on three things, in order.',
   sub:'Authority brings the right people in. Systems let the work happen without you. AI carries the repeatable load you should never touch again.'},

  {t:'pillar', num:'01', part:'Pillar one', h:'Authority',
   note:'Become the name your market already trusts before the first call. When people arrive believing you are the one, you stop convincing and start choosing. Authority is what makes everything downstream easier.'},

  {t:'pillar', num:'02', part:'Pillar two', h:'Systems',
   note:'Take what lives in your head and make it documented, repeatable, and handed off. A system is simply the business doing on purpose what you have been doing from memory. This is where the founder steps out of the center.'},

  {t:'pillar', num:'03', part:'Pillar three', h:'AI-Assisted Operations',
   note:'The repeatable work, the follow-ups, the admin, the drafts, carried by AI you have set up on purpose. You keep the judgment and the relationships. You give away the parts that never needed you in the first place.'},

  {t:'together', k:'How they work',
   h:'Each pillar removes you from one more seat.',
   list:['Authority removes you from chasing.',
         'Systems remove you from delivering every piece by hand.',
         'AI removes you from the repeatable work entirely.']},

  {t:'part', part:'Part Three', h:'What freedom actually looks like'},

  {t:'after', k:'A week on the other side',
   h:'The business holds while you are not in it.',
   list:['Leads arrive and are handled without you starting the conversation.',
         'Delivery runs to your standard because the standard is written down.',
         'You take the Sabbath, the trip, the slow morning, and nothing breaks.']},

  {t:'faith', k:'The foundation',
   h:'Business was never meant to steal your freedom.',
   note:'Faith is not an add-on to this work. It is the foundation. God never intended the business He gave you to cost you your family, your rest, or your purpose. Freedom is the point, not a reward for enough hustle.'},

  {t:'why', k:'Why me',
   h:'I have spent 18 years making businesses run without their founders.',
   list:['18+ years of founder and operations experience.',
         'Served 600+ clients across 11+ countries.',
         'Operational Excellence and Lean Six Sigma trained.',
         'Certified AI Workforce Specialist.']},

  {t:'cta', k:'Your next step',
   h:'Find the one thing keeping the business tied to you.',
   sub:'In the free Founder Freedom Audit, we map your client acquisition, your systems, your AI readiness, and your founder-dependence risk, and leave you with your 90-day priorities.',
   cta:'Apply for your free Founder Freedom Audit at janadutoit.com',
   disc:'Educational only. No specific income, revenue, or result is guaranteed. Results vary based on your business, your market, and the work you put in.'}
];

function el(tag, cls, html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
var deck = document.getElementById('deck');
S.forEach(function(s){
  var sl = el('div','slide');
  if(s.part && s.t==='part'){ sl.appendChild(el('div','part',s.part)); sl.appendChild(el('h2',null,s.h)); }
  else{
    if(s.num) sl.appendChild(el('div','num',s.num));
    if(s.part && s.t==='pillar') sl.appendChild(el('div','part',s.part));
    if(s.k) sl.appendChild(el('div','kick',s.k));
    if(s.big) sl.appendChild(el('div','big',s.big));
    else if(s.t==='title') sl.appendChild(el('h1',null,s.h));
    else if(s.h) sl.appendChild(el('h2',null,s.h));
    if(s.sub) sl.appendChild(el('div','sub',s.sub));
    if(s.list){ var ul=el('ul'); s.list.forEach(function(i){ul.appendChild(el('li',null,i));}); sl.appendChild(ul); }
    if(s.note) sl.appendChild(el('div','note',s.note));
    if(s.cta) sl.appendChild(el('div','sub','<strong>'+s.cta+'</strong>'));
    if(s.disc) sl.appendChild(el('div','disc',s.disc));
  }
  deck.appendChild(sl);
});
</script>
</body>
</html>
