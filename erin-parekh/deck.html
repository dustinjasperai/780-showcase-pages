<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Connected Body, a Masterclass with Erin Parekh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf9;        /* brand warm white, 82 uses */
    --panel:#ece7e4;     /* brand warm stone, 29 uses */
    --ink:#461624;       /* brand deep plum, 48 uses */
    --accent:#804d28;    /* brand warm brown, dominant 113 uses */
    --gold:#eace62;      /* brand muted gold, 3 uses */
    --muted:#7a5f52;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--bg);border:1px solid rgba(70,22,36,.12);border-radius:14px;
    padding:60px 58px;margin:0 0 30px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:58px;right:58px;bottom:34px;height:1px;
    background:linear-gradient(90deg,var(--gold),transparent)}
  .eyebrow{font-family:'Noto Sans';font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Playfair Display';font-weight:600;font-size:60px;line-height:1.05;
    color:var(--ink);letter-spacing:-.01em}
  h2{font-family:'Playfair Display';font-weight:600;font-size:42px;line-height:1.08;
    color:var(--ink);margin-bottom:18px}
  .sub{font-family:'Playfair Display';font-style:italic;font-size:26px;color:var(--accent);
    margin-top:22px;line-height:1.3}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:62ch;margin-top:14px}
  p.lead{font-size:21px;color:var(--muted)}
  ul{list-style:none;margin-top:22px}
  li{font-size:18px;line-height:1.5;padding:12px 0 12px 30px;position:relative;
    border-top:1px solid rgba(70,22,36,.1);max-width:64ch}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:20px;width:9px;height:9px;
    border-radius:50%;background:var(--accent)}
  li b{font-weight:600;color:var(--accent)}
  .part{font-family:'Playfair Display';font-size:19px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);font-weight:500}
  .phase-no{font-family:'Playfair Display';font-size:120px;line-height:.8;color:var(--gold);
    opacity:.9;position:absolute;right:46px;top:34px;font-weight:600}
  .quote{font-family:'Playfair Display';font-style:italic;font-size:40px;line-height:1.25;
    color:var(--ink);max-width:22ch}
  .quote span{color:var(--accent)}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:66ch;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:26px;font-family:'Noto Sans';font-weight:600;
    font-size:16px;color:var(--bg);background:var(--accent);padding:15px 30px;border-radius:40px}
  .foot{position:absolute;left:58px;bottom:14px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:0}h1{font-size:40px}h2{font-size:30px}.quote{font-size:28px}.phase-no{font-size:72px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title',
    eyebrow:'A live masterclass with Erin Parekh, MS, CNS, LDN',
    h:'The Connected Body',
    sub:'Why your energy, digestion, and hormones stopped responding, and the order that finally brings them back'},

  {t:'who', eyebrow:'Who this is for',
    h:'You are not starting from zero.',
    lead:'This hour is for the woman who has already done the work and still feels let down by her body.',
    list:[
      'You eat well, move, and sleep, yet energy, hunger, and digestion have quietly changed.',
      'Your labs come back "normal," but you know something is off.',
      'Perimenopause, thyroid, gut, or metabolism shifts have moved the goalposts.',
      'You have tried plans and protocols, and you are tired of guessing which one is for you.']},

  {t:'trap', eyebrow:'The trap',
    h:'Doing everything right, and still stuck.',
    p:'When one thing feels off, the instinct is to fix that one thing. Bloated? Cut a food. Tired? Add a supplement. Each fix is reasonable on its own. Together they become a full-time job that never quite adds up, because the real issue was never one thing.'},

  {t:'reframe', cls:'reframe',
    quote:'Most practitioners look for what is wrong. The faster path is looking for what is <span>connected</span>.'},

  {t:'part', part:'Part One', h:'The real problem is isolation.'},

  {t:'problem', eyebrow:'Symptom roulette',
    h:'Isolated fixes stall.',
    p:'Blood sugar, digestion, stress physiology, sleep, and hormones are one system talking to itself. Treat a single symptom and the system routes around it. That is why the next protocol works for a week, then fades, and why the list of things you cannot eat keeps growing while the needle does not move.'},

  {t:'cost', eyebrow:'The hidden cost',
    h:'Wellness was never meant to be a second job.',
    p:'Somewhere along the way, getting healthy started to cost you the very life you were trying to feel good enough to live. More rules, more tracking, more mornings built around a protocol. That is a sign the plan is fighting your life instead of fitting it.'},

  {t:'principle', cls:'reframe',
    quote:'Wellness should support your life. It should not <span>become</span> your life.'},

  {t:'part', part:'Part Two', h:'The Nourish to Thrive Method.'},

  {t:'logic', eyebrow:'How every plan is built',
    h:'Connect. Decide. Adjust.',
    lead:'Before a single change, three questions in order:',
    list:[
      '<b>Connect the information.</b> Labs, symptoms, food patterns, and your real life read as one picture, not a pile of parts.',
      '<b>Decide what matters first.</b> Sequence beats intensity. We change the thing that unlocks the next thing.',
      '<b>Adjust as responses emerge.</b> Your body answers, and the plan answers back. Nothing is set in stone.']},

  {t:'phase', no:'01', part:'Phase One', h:'Reset',
    p:'Stabilize the core systems before touching anything deeper: blood sugar regulation, protein adequacy and meal structure, digestive support, and nervous-system and stress physiology. We simplify inputs first. Safety and stability come before strategy.'},

  {t:'phase', no:'02', part:'Phase Two', h:'Replenish',
    p:'Close the gaps that quiet symptoms hide: macronutrient balance across protein, carbohydrate, and fat, micronutrient sufficiency and nutrient density, supplement refinement, and food timing. Two women can eat the same meal and get opposite results, so this phase is built for yours.'},

  {t:'phase', no:'03', part:'Phase Three', h:'Recalibrate',
    p:'Now the deeper work: hormone balance across cortisol, estrogen, progesterone, and thyroid, metabolic flexibility and body composition, gut health and inflammation, and liver and lymphatic support. This is where most women feel energy and digestion shift for real.'},

  {t:'phase', no:'04', part:'Phase Four', h:'Refine',
    p:'Make it last without it running your life: simpler routines, flexibility around food and travel, durable hormone and metabolic support, and the confidence to trust your own read of your body. You leave able to steer, not just follow.'},

  {t:'part', part:'Part Three', h:'The Essential 8 Pillars.'},

  {t:'pillars', eyebrow:'The foundation, 1 through 4',
    h:'Where the work stands.',
    list:[
      '<b>Personalize to You.</b> No one-size-fits-all. Your history, data, and intuition shape every choice.',
      '<b>Eat for Balance.</b> Food as a tool to restore function, not a list of restrictions.',
      '<b>Love Your Guts.</b> Gut health is the foundation of total-body wellness.',
      '<b>Create Calm.</b> The body cannot heal in fight-or-flight, so we regulate the nervous system.']},

  {t:'pillars', eyebrow:'The foundation, 5 through 8',
    h:'Where the work holds.',
    list:[
      '<b>Sleep Smarter.</b> Sleep is when the body repairs, detoxifies, and recalibrates.',
      '<b>Move with Intention.</b> Movement that is functional, enjoyable, and consistent.',
      '<b>Clean House.</b> Support natural detox and lower the daily chemical load.',
      '<b>Master Your Mindset.</b> The way we think shapes the way we feel, so we build resilience.']},

  {t:'why', eyebrow:'Why me',
    h:'I have lived the questions I ask you.',
    p:'I am Erin Parekh, a board-certified clinical and functional nutritionist with a Master of Science in Clinical Human Nutrition. Before nutrition, I spent a decade directing complex exhibitions in the New York art world, which is where I learned to read many moving parts as one picture. I have also lived digestive disease, autoimmune thyroid disease, and infertility, so the questions I ask you are the ones I had to answer for myself.'},

  {t:'look', eyebrow:'What working together looks like',
    h:'A five-month partnership, not a handout.',
    p:'Nourish to Thrive is personalized and phased, guided by your labs and your life, with steady one-to-one support between sessions. It is built so that by the end you are not dependent on me. You understand your own body well enough to keep steering it.'},

  {t:'cta', cls:'cta', eyebrow:'Your next step',
    h:'Ready to connect the picture?',
    p:'If you are done chasing symptoms one at a time, let us look at the whole system together and decide what to change first. Book a complimentary discovery call and we will see whether Nourish to Thrive is the right fit for where you are.',
    cta:'Book a discovery call',
    disc:'Educational only. This masterclass does not provide medical advice, diagnosis, or treatment, and is not a substitute for care from your physician. No specific health, weight, or clinical result is guaranteed. Individual results vary.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let h = '';
  if (s.no) h += '<div class="phase-no">' + s.no + '</div>';
  if (s.part) h += '<div class="part">' + s.part + '</div>';
  if (s.eyebrow) h += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if (s.quote) h += '<div class="quote">' + s.quote + '</div>';
  if (s.h) h += (s.t === 'title' ? '<h1>' + s.h + '</h1>' : '<h2>' + s.h + '</h2>');
  if (s.sub) h += '<div class="sub">' + s.sub + '</div>';
  if (s.lead) h += '<p class="lead">' + s.lead + '</p>';
  if (s.p) h += '<p>' + s.p + '</p>';
  if (s.list) { h += '<ul>'; s.list.forEach(x => h += '<li>' + x + '</li>'); h += '</ul>'; }
  if (s.cta) h += '<div class="cta-btn">' + s.cta + '</div>';
  if (s.disc) h += '<div class="disc">' + s.disc + '</div>';
  h += '<div class="foot">Nourish to Thrive &middot; Erin Parekh Nutrition</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
