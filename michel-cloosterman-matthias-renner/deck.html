<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Running Your First Paid LEGO Serious Play Workshop</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAFC; --panel:#F3E9F1; --rule:#E3CBDC; --accent:#851162; --deep:#5E0D46;
    --ink:#2A2230; --mut:#6E5E68;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 90px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:54px 52px;margin:22px 0;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(94,13,70,.03)}
  .kick{font-family:"Poppins";font-weight:600;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Poppins";font-weight:700;font-size:44px;line-height:1.08;color:var(--deep)}
  h2{font-family:"Poppins";font-weight:600;font-size:33px;line-height:1.12;color:var(--deep)}
  .sub{font-size:20px;line-height:1.5;color:var(--ink);margin-top:18px;max-width:40em}
  .foot{margin-top:26px;font-size:15px;color:var(--mut);font-weight:500}
  ul{margin:26px 0 0;padding:0;list-style:none}
  li{position:relative;font-size:19px;line-height:1.45;color:var(--ink);
    padding:12px 0 12px 34px;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;
    border-radius:3px;background:var(--accent)}
  .title .brick{display:flex;gap:7px;margin-bottom:26px}
  .title .brick i{width:26px;height:26px;border-radius:5px;display:block}
  .title .brick i:nth-child(1){background:var(--accent)}
  .title .brick i:nth-child(2){background:var(--deep)}
  .title .brick i:nth-child(3){background:var(--rule)}
  .part{background:var(--panel);border-color:var(--rule)}
  .part h2{font-size:38px}
  .pillar{border-left:6px solid var(--accent)}
  .disc{margin-top:28px;font-size:13px;line-height:1.5;color:var(--mut);max-width:44em}
  .n{position:fixed;right:16px;bottom:14px;font-size:12px;color:var(--mut);
    font-family:"Poppins";background:var(--panel);border:1px solid var(--rule);
    border-radius:20px;padding:5px 12px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="n" id="n"></div>
<script>
const S=[
  {t:'title', h:"Running Your First Paid LEGO Serious Play Workshop",
    sub:"How to walk out of certification able to run a real room, not just explain the method.",
    foot:"A masterclass with Michel Cloosterman & Matthias Renner"},
  {t:'who', h:"The promise",
    sub:"By the end of this session you will know the difference between knowing the method and running the room, and the first three moves that get a group building and talking."},
  {t:'who', h:"Who this is for", list:[
    "You are certified in the method, or about to be",
    "You can explain build, share, reflect",
    "But you have never run a paid room full of strangers",
    "And the thought of the very first question makes you freeze"]},
  {t:'trap', h:"The trap", sub:"You were trained on the theory. The theory is not the job. The job is the room: the first question, the quiet, the person who will not build."},
  {t:'reframe', h:"The bricks are the easy part", sub:"Anyone can hand out bricks. Facilitation is what happens in the ninety seconds after. That craft is the thing nobody sells you, and it is the whole job."},
  {t:'part', h:"Part One", sub:"Why most newly certified facilitators stall."},
  {t:'list', h:"Theory-first training leaves a gap", list:[
    "You learn the model in order, slide by slide",
    "You practice once, in a safe room of peers",
    "Then you face a real client and the model goes abstract",
    "The room does not behave like the slides did"]},
  {t:'part', h:"Part Two", sub:"The practice-before-theory method."},
  {t:'pillar', h:"Pillar 1: Practice before theory", sub:"Every unit starts with a build you actually run, and the theory follows to explain what just happened. You learn the move by making it, not by watching it."},
  {t:'pillar', h:"Pillar 2: The core process, seven techniques", sub:"Build, share, reflect is the spine. The seven application techniques are how you chain single builds into a workshop that actually goes somewhere."},
  {t:'pillar', h:"Pillar 3: Two ready-to-run blueprints", sub:"You leave with a Strategy workshop and a Team workshop, built in your own hands during the training, ready to sell and run on Monday."},
  {t:'pillar', h:"Pillar 4: Running the room", sub:"The questions that open people up, the move when someone will not build, the silence you let sit. This is the part theory cannot hand you, so we practice it live."},
  {t:'part', h:"Part Three", sub:"What your first paid workshop looks like."},
  {t:'steps', h:"From certified to booked", list:[
    "Pick the blueprint that fits the client's question",
    "Open with a build, never with an agenda",
    "Let the models do the talking, not you",
    "Close on a decision the whole room can see"]},
  {t:'who', h:"A common worry, handled", list:[
    "They will not take bricks seriously, until the first build lands",
    "I will run out of things to say, the models carry it",
    "Someone will dominate, the method gives everyone a model",
    "I froze in practice, so we run a real round together first"]},
  {t:'why', h:"Why learn this from us", list:[
    "Certified Master Trainers in the LEGO SERIOUS PLAY Method",
    "Trained in the method by its co-developers",
    "Facilitators certified across more than a dozen cities",
    "Hosts of the LEGO SERIOUS PLAY podcast for pros and LSP Magazine"]},
  {t:'cta', h:"Your next step",
    sub:"Join the 4-day LEGO SERIOUS PLAY Facilitator Certification and walk out able to run a real room, with two workshops you can sell.",
    disc:"Educational content only. No income or result is guaranteed. Results vary with your effort, your market, and your clients."}
];
function esc(x){return x}
function slide(s){
  const d=document.createElement('section');
  d.className='slide '+(s.t==='part'?'part ':'')+(s.t==='pillar'?'pillar ':'')+(s.t==='title'?'title ':'');
  let html='';
  if(s.t==='title'){html+='<div class="brick"><i></i><i></i><i></i></div>';}
  if(s.t==='part'){html+='<div class="kick">'+s.h+'</div>';}
  if(s.t==='title'){html+='<h1>'+s.h+'</h1>';}
  else if(s.t==='part'){html+='<h2>'+s.sub+'</h2>';}
  else{html+='<h2>'+s.h+'</h2>';}
  if(s.sub && s.t!=='part'){html+='<p class="sub">'+s.sub+'</p>';}
  if(s.list){html+='<ul>'+s.list.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';}
  if(s.foot){html+='<p class="foot">'+s.foot+'</p>';}
  if(s.disc){html+='<p class="disc">'+s.disc+'</p>';}
  d.innerHTML=html;
  return d;
}
const deck=document.getElementById('deck');
S.forEach(function(s){deck.appendChild(slide(s))});
document.getElementById('n').textContent=S.length+' slides';
</script>
</body>
</html>
