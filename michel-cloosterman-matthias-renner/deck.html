<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Facilitate a Breakthrough Workshop with LEGO SERIOUS PLAY, a masterclass with Michel Cloosterman & Matthias Renner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f1e7;
    --panel:#fffcf7;
    --rule:#e6ddcf;
    --ink:#2a2724;
    --muted:#6b6259;
    --accent:#a82400;
    --head:'Poppins',system-ui,sans-serif;
    --body:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:60px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 22px 54px rgba(42,39,36,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* brick motif: two studs top-left, drawn from their world (LEGO SERIOUS PLAY) */
  .brick{position:absolute;top:26px;left:72px;display:flex;gap:6px}
  .brick i{width:20px;height:14px;border-radius:3px;background:var(--accent);position:relative;opacity:.9}
  .brick i::after{content:'';position:absolute;top:-5px;left:5px;width:10px;height:6px;border-radius:3px 3px 0 0;background:var(--accent)}
  .kick{font-family:var(--head);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 20px}
  h1{font-family:var(--head);font-weight:700;font-size:54px;line-height:1.06;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.1;margin:0 0 18px;letter-spacing:-.005em}
  h3{font-family:var(--head);font-weight:600;font-size:27px;line-height:1.18;margin:0 0 12px}
  p{font-size:22px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:46ch}
  .lead{font-size:26px;color:var(--ink)}
  .em{color:var(--accent)}
  .pres{font-family:var(--head);font-size:19px;color:var(--ink);font-weight:500;margin-top:14px}
  ul{margin:16px 0 0;padding:0;list-style:none}
  li{font-size:21px;line-height:1.4;color:var(--ink);padding:15px 0 15px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:22px;width:15px;height:15px;border-radius:3px;background:var(--accent)}
  li b{font-weight:600;font-family:var(--head);font-size:19px}
  li span{display:block;color:var(--muted);font-size:17px;margin-top:3px;font-family:var(--body)}
  .big{font-family:var(--head);font-size:104px;line-height:.98;font-weight:700;letter-spacing:-.02em}
  .row{display:flex;gap:20px;margin-top:22px;flex-wrap:wrap}
  .cell{flex:1;min-width:230px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:.02em}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:58px}
  .steps li::before{counter-increment:s;content:counter(s);border-radius:6px;background:var(--accent);color:#fff;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    font-family:var(--head);font-weight:700;font-size:16px;top:14px;left:4px}
  .who{font-size:18px;color:var(--muted);margin-top:26px;padding-top:16px;border-top:1px solid var(--rule)}
  .who b{color:var(--ink);font-family:var(--head);font-weight:600}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);max-width:64ch;line-height:1.5}
  .ctas{margin-top:8px}
  .ctas li::before{border-radius:3px}
  .nav{position:fixed;bottom:22px;right:26px;font-family:var(--head);font-size:13px;color:var(--muted);letter-spacing:.04em}
  .nav b{color:var(--accent)}
  .hint{position:fixed;bottom:22px;left:26px;font-family:var(--head);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:34px}h2{font-size:28px}.big{font-size:64px}p{font-size:19px}.brick{left:30px}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hint">← → to move</div>
<div class="nav"><b id="cur">1</b> / <span id="tot">1</span></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'How to Facilitate a Breakthrough Workshop with LEGO&reg; SERIOUS PLAY&reg;',p:'The Master Trainer method that turns a table of bricks into a decision the whole room owns.',pres:'With <b>Michel Cloosterman</b> &amp; <b>Matthias Renner</b>, AOMT Master Trainers'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why building beats discussing','The reason a hand-built model unlocks what a conversation cannot.'],['The shape of a real session','The core process, held live, from question to shared model.'],['The first move you can make','One technique you can bring to your very next workshop.']]},
 {t:'audience',kick:'Who this is for',h:'You run rooms. And the good thinking stays stuck in a few voices.',p:'Consultants, trainers, coaches and facilitators who guide teams through strategy, alignment and change, and want a method that gets every person in the room actually building the answer.',who:'<b>The trap:</b> you buy the bricks, run an icebreaker, and it feels like play instead of progress. The kit is not the method.'},
 {t:'reframe',kick:'The reframe',big1:'Bricks.',big2:'Not a <span class="em">breakthrough</span>.',p:'Handing out LEGO makes a room smile. Facilitating the build is what makes a room decide. That craft is the whole difference, and it is learnable.'},
 {t:'part',kick:'Part one',h:'Why the workshop stalls.'},
 {t:'point',kick:'The core problem',h:'A talking room protects the loudest voice.',p:'In a normal workshop the confident few fill the air and the quiet expertise never lands on the table. You leave with the same three opinions you walked in with, only louder.'},
 {t:'point',kick:'The core problem',h:'The method is simple to hold, hard to facilitate well.',p:'Anyone can read the instructions and hand out bricks. Holding the questions, the pace, and the reflection so a room reaches a real decision is a skill, and it is the skill nobody hands you in the box.'},
 {t:'point',kick:'The core problem',h:'The cost is the decision you never reach.',p:'A stalled workshop does not just waste an afternoon. The team walks out without the alignment they came for, so the real work stalls with it, and the next meeting starts from the same blank page.'},
 {t:'framework',kick:'The science',h:'Thinking with your hands.',row:[['Hand knowledge','Building a model forces a thought to become concrete, so half-formed ideas turn into something you can point at.'],['Shared model','Once it is on the table, the room debates the model, not the person, and every voice has already spoken through their build.']],p:'This is why the method works. It is not a game. It is a way of making thinking visible.'},
 {t:'part',kick:'Part two',h:'How to facilitate the build.'},
 {t:'steps',kick:'The core process',h:'Every session runs the same four beats.',steps:['Pose the question, so the challenge is sharp before a brick is touched','Build, so each person answers with their hands','Share, so every model is told as a story to the room','Reflect, so the room draws the meaning and the decision out of what was built'],p:'Master the loop and you can run it on any question, from strategy to team trust.'},
 {t:'lenses',kick:'The seven application techniques',h:'One process, seven ways to apply it.',li:[['Individual and shared models','Start with each person, then build one model the whole room owns.'],['Landscapes and connections','Lay models in a system, then draw the links and the tensions between them.'],['Playing emergence and scenarios','Pressure-test the system against the futures it has to survive.']],who:'<b>The craft is the combination.</b> Knowing which technique a room needs next is what a facilitator learns, and what a kit can never tell you.'},
 {t:'point',kick:'The facilitator\'s tool',h:'The question does the heavy lifting.',p:'A sharp building question is most of the work. Ask a vague one and you get vague models. The craft starts before the bricks, in framing a question the room cannot answer with an easy opinion.'},
 {t:'framework',kick:'What you can run',h:'Two workshops you could hold this month.',row:[['A strategy workshop','Build the current landscape, the guiding principles, and the simple guidelines a team will actually follow.'],['A team workshop','Build shared identity and working agreements, so a group leaves aligned instead of merely informed.']],p:'These are the two blueprints every certified facilitator leaves with, ready to deliver.'},
 {t:'point',kick:'The facilitation craft',h:'Read the model, not just the room.',p:'The breakthrough is usually sitting in a small detail of someone\'s build that they have not said out loud yet. The facilitator\'s real job is to see it, ask about it, and let the room discover what it means.'},
 {t:'part',kick:'Part three',h:'The room, once the building starts.'},
 {t:'point',kick:'In the room',h:'Everyone builds, then the room reads it together.',p:'You will see people who had not spoken all quarter put a model on the table and explain it. That is not a personality change. It is what happens when the method gives everyone the same way in.'},
 {t:'looks',kick:'The outcome',h:'A decision the whole room owns.',li:[['Every voice has built','The quiet expert has already spoken, in bricks, before anyone spoke over them.'],['The debate is about the model','Disagreement lands on the table, not on a person, so it stays useful.'],['The room leaves aligned','They do not just agree, they can see and point to what they agreed.']],},
 {t:'whyme',kick:'Who is teaching this',h:'Two Master Trainers, one method.',li:[['AOMT Master Trainers','Trained to Master Trainer level by Robert Rasmussen and Per Kristiansen, the method\'s own developers.'],['Live, in more than a dozen cities','Certifying facilitators across Europe and beyond, in person, every month.'],['The Podcast for Pros and LSP Magazine','The home Michel and Matthias built for the LEGO SERIOUS PLAY profession.']]},
 {t:'cta',kick:'Your next step',h:'Ready to facilitate the build yourself?',ctas:['<b>Join the Certified Facilitator Training</b>, four days, live and in person, and leave able to run both workshops above.','<b>Bring a real challenge</b> from your own work, and build your first session on it during the training.'],disc:'This masterclass is educational. It shares the LEGO SERIOUS PLAY method and facilitation approaches; it is not advice for your specific situation and not a guarantee of any particular result. LEGO and LEGO SERIOUS PLAY are trademarks of the LEGO Group, which does not sponsor or endorse this session. Outcomes vary by facilitator and group.'}
];
const stage=document.getElementById('stage');
function esc(x){return x||''}
function render(s){
 const brick='<div class="brick"><i></i><i></i></div>';
 let b='';
 if(s.t==='title'){b=`${brick}<div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){b=`${brick}<div class="kick">${s.kick}</div><div class="big">${s.big1}<br>${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){b=`${brick}<div class="kick">${s.kick}</div><h1>${s.h}</h1>`}
 else if(s.t==='promise'||s.t==='lenses'||s.t==='looks'||s.t==='whyme'){
   const items=s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('');
   b=`${brick}<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul>${items}</ul>${s.who?`<div class="who">${s.who}</div>`:''}`}
 else if(s.t==='audience'||s.t==='point'){
   b=`${brick}<div class="kick">${s.kick}</div><h2>${s.h}</h2><p>${s.p}</p>${s.who?`<div class="who">${s.who}</div>`:''}`}
 else if(s.t==='framework'){
   const cells=s.row.map(x=>`<div class="cell"><div class="n">${x[0]}</div><p>${x[1]}</p></div>`).join('');
   b=`${brick}<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="row">${cells}</div>${s.p?`<p style="margin-top:20px">${s.p}</p>`:''}`}
 else if(s.t==='steps'){
   const items=s.steps.map(x=>`<li>${x}</li>`).join('');
   b=`${brick}<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul class="steps">${items}</ul>${s.p?`<p style="margin-top:20px">${s.p}</p>`:''}`}
 else if(s.t==='cta'){
   const items=s.ctas.map(x=>`<li>${x}</li>`).join('');
   b=`${brick}<div class="kick">${s.kick}</div><h1>${s.h}</h1><ul class="ctas">${items}</ul><div class="disc">${s.disc}</div>`}
 return `<div class="slide on">${b}</div>`;
}
let i=0;
function show(){stage.innerHTML=render(S[i]);document.getElementById('cur').textContent=i+1;}
document.getElementById('tot').textContent=S.length;
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));show();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')go(1);else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(-1);});
stage.addEventListener('click',()=>go(1));
show();
</script>
</body>
</html>
