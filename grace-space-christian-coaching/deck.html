<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth Without Burnout — Grace Space Christian Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fefefd;        /* brand warm near-white ground */
    --panel:#f2f1ec;     /* warm off-white panel */
    --ink:#24262b;       /* brand charcoal ink */
    --muted:#6d7382;     /* brand muted slate */
    --accent:#3d4759;    /* brand deep slate accent */
    --accent2:#a7bccf;   /* brand soft slate-blue secondary */
    --rule:#dcdad2;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto}
  .slide{
    background:var(--bg);
    min-height:100vh;
    display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;
    border-bottom:1px solid var(--ink);
    position:relative;
  }
  .num{position:absolute;top:4vh;right:8vw;font-size:13px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .kicker{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;font-weight:600}
  .rule{width:64px;height:2px;background:var(--accent);margin:22px 0}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(46px,7vw,82px);line-height:1.02;letter-spacing:-.005em}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(36px,5vw,56px);line-height:1.08;letter-spacing:-.005em}
  .lede{font-family:var(--serif);font-size:clamp(20px,2.6vw,27px);line-height:1.4;color:var(--ink);max-width:26ch}
  p,li{font-size:clamp(16px,1.7vw,19px);line-height:1.65;color:var(--ink);max-width:62ch}
  .sub{color:var(--muted)}
  .promise{margin-top:26px;font-family:var(--serif);font-style:italic;font-size:clamp(19px,2.3vw,25px);color:var(--accent)}
  ul{margin-top:18px;padding-left:0;list-style:none}
  ul li{position:relative;padding-left:30px;margin-bottom:14px}
  ul li:before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent2);border-radius:50%}
  .step{font-family:var(--serif);font-size:clamp(54px,9vw,120px);line-height:.9;color:var(--accent2);font-weight:600}
  .big{font-family:var(--serif);font-size:clamp(26px,3.6vw,40px);line-height:1.18;max-width:20ch}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:26px}
  .who div{background:var(--panel);padding:26px 28px;border-left:3px solid var(--accent2)}
  .who h3{font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:8px}
  .cta .btn{display:inline-block;margin-top:30px;background:var(--accent);color:var(--bg);font-weight:600;
    padding:16px 30px;font-size:17px;letter-spacing:.02em;text-decoration:none;border-radius:2px}
  .disclaimer{margin-top:40px;font-size:13px;line-height:1.55;color:var(--muted);max-width:60ch}
  .verse{font-family:var(--serif);font-style:italic;color:var(--accent);font-size:clamp(18px,2.2vw,23px);max-width:34ch}
  .credit{margin-top:28px;color:var(--muted);font-size:15px}
  @media(max-width:640px){.who{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A live masterclass with Alexandra Kaval',
   h1:'Growth Without Burnout',
   promise:'How high-capacity women grow their calling without running themselves into the ground.',
   sub:'Grace Space Christian Coaching'},

  {t:'part',
   kicker:'The promise',
   h2:'By the end of this hour',
   p:'You will see why doing more has stopped working, where the real bottleneck actually sits, and the three-step path that takes a driven woman from stretched thin to Spirit led. Not another productivity hack. A different foundation.'},

  {t:'who',
   kicker:'Who this is for',
   h2:'You love God, and you are tired.',
   who:[
     {h:'The driven woman',b:'Six and seven figure business owners, creators, executives, doctors, lawyers, coaches. Capable of anything, carrying everything.'},
     {h:'The quiet cost',b:'Stretched thin, stuck in negative thoughts, uncertain which decisions are yours to make and which are God’s to lead.'}
   ]},

  {t:'part',
   kicker:'The trap',
   h2:'Three lies the capable woman believes',
   p:'If I slow down, it all falls apart. My worth is measured in what I produce. Rest is what I get after everything is finished, which is never. Each one feels responsible. Together they build a life that looks faithful and feels frantic.'},

  {t:'hook',
   kicker:'The reframe',
   big:'Burnout is not a time problem. It is a belief problem.',
   p:'More hustle, a better calendar, one more system: none of it holds, because the engine underneath is a set of beliefs about worth, control, and enough. Change the beliefs and the pace changes with them.'},

  {t:'part',
   kicker:'Part one',
   h2:'The pattern that keeps repeating',
   p:'The driven woman proves her worth by doing. Rest feels like falling behind. Negative narratives run quietly in the background: if I slow down it falls apart, if I say no I disappoint. That loop is faithful to fear, not to God, and it is exhausting to run.'},

  {t:'verse',
   verse:'“Come to me, all you who are weary and burdened, and I will give you rest.”',
   sub:'Matthew 11:28'},

  {t:'part',
   kicker:'Part two: the method',
   h2:'A three-step path from stretched thin to Spirit led.',
   p:'This is the work we do together in Growth Without Burnout. Three steps, in order, because action built on unexamined beliefs just rebuilds the same loop faster. We start underneath, with what you believe.'},

  {t:'step',
   n:'01',
   kicker:'Build biblical beliefs',
   h2:'A faith fueled focus',
   p:'We surface the foundational beliefs you are actually operating from, name the ones to release and the ones to receive, and ground your thinking in scripture truth instead of the story fear has been telling.'},

  {t:'step',
   n:'02',
   kicker:'Transform your thoughts',
   h2:'A faith filter for the noise',
   p:'We cleanse the thought life: catch the negative narratives as they start, run them through a faith filter, and release the unrealistic expectations you have been holding yourself to. Quieter mind, clearer decisions.'},

  {t:'step',
   n:'03',
   kicker:'Take aligned action',
   h2:'Spirit led strategy',
   p:'Now strategy. We execute on God-given goals through rhythms and routines that reflect your values, so your days move you toward the calling instead of away from your limits.'},

  {t:'who',
   kicker:'Why the order matters',
   h2:'Most advice starts at step three.',
   who:[
     {h:'Strategy first',b:'A new system laid over old beliefs just helps you run the fear loop more efficiently. It works for a season, then the burnout returns louder.'},
     {h:'Beliefs first',b:'When the foundation is scripture instead of fear, the strategy finally holds, because it is no longer carrying the weight the beliefs were meant to carry.'}
   ]},

  {t:'hook',
   kicker:'The shift',
   big:'Rest is not a reward. It is a rhythm.',
   p:'God built the week with rest inside it, not bolted on at the end. When rest becomes a rhythm you obey instead of a prize you earn, the striving loses its grip and the capacity you were missing comes back.'},

  {t:'part',
   kicker:'Part three',
   h2:'What a week starts to look like',
   p:'You decide faster because you trust the filter you built. You say no without the guilt tax. Work still matters, but it stops costing you the person doing it. You can feel the difference between striving and stewardship.'},

  {t:'part',
   kicker:'The outcome',
   h2:'From driven to purposeful',
   p:'Prioritized instead of scattered. Secure in who you are in Christ instead of seeking your worth in the next result. Living in the freedom of who God is calling you to be, at a pace you can actually sustain.'},

  {t:'who',
   kicker:'Why me',
   h2:'Alexandra Kaval',
   who:[
     {h:'Certified Master Coach',b:'Professional Certified Master Christian Life and Business Coach, walking high-capacity women from overwhelmed to secure in who they are in Christ.'},
     {h:'Fruitful Faith: Women on Mission',b:'Host of the podcast for women who want their faith and their work to grow together, not at each other’s expense.'}
   ]},

  {t:'verse',
   verse:'“She is clothed with strength and dignity, and she laughs without fear of the future.”',
   sub:'Proverbs 31:25'},

  {t:'cta',
   kicker:'Your next right step',
   h2:'Book a complimentary clarity call',
   p:'A 90-minute strategy session to map where you are, where God is calling you, and the next right step to get there without burning out.',
   btn:'Apply for your clarity call',
   disclaimer:'This masterclass is for education and encouragement only. Coaching is not therapy, medical, or financial advice, and it is not a substitute for care from a licensed professional. Results vary from person to person; no specific outcome, income, or result is promised or guaranteed.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=el('section','slide '+s.t);
  sec.appendChild(el('div','num',(i+1)+' / '+S.length));
  if(s.kicker) sec.appendChild(el('div','kicker',s.kicker));
  if(s.t==='title'){
    sec.appendChild(el('h1',null,s.h1));
    sec.appendChild(el('div','rule'));
    if(s.promise) sec.appendChild(el('div','promise',s.promise));
    if(s.sub) sec.appendChild(el('div','credit',s.sub));
  } else if(s.t==='hook'){
    sec.appendChild(el('div','big',s.big));
    sec.appendChild(el('div','rule'));
    if(s.p) sec.appendChild(el('p',null,s.p));
  } else if(s.t==='verse'){
    sec.appendChild(el('div','verse',s.verse));
    if(s.sub) sec.appendChild(el('div','credit',s.sub));
  } else if(s.t==='step'){
    sec.appendChild(el('div','step',s.n));
    if(s.h2) sec.appendChild(el('h2',null,s.h2));
    sec.appendChild(el('div','rule'));
    if(s.p) sec.appendChild(el('p',null,s.p));
  } else if(s.t==='who'){
    if(s.h2) sec.appendChild(el('h2',null,s.h2));
    const g=el('div','who');
    s.who.forEach(w=>{const d=el('div');d.appendChild(el('h3',null,w.h));d.appendChild(el('p',null,w.b));g.appendChild(d);});
    sec.appendChild(g);
  } else if(s.t==='cta'){
    sec.appendChild(el('h2',null,s.h2));
    sec.appendChild(el('div','rule'));
    if(s.p) sec.appendChild(el('p',null,s.p));
    if(s.btn) sec.appendChild(el('a','btn',s.btn)).setAttribute('href','#');
    if(s.disclaimer) sec.appendChild(el('div','disclaimer',s.disclaimer));
  } else {
    if(s.h2) sec.appendChild(el('h2',null,s.h2));
    sec.appendChild(el('div','rule'));
    if(s.lede) sec.appendChild(el('div','lede',s.lede));
    if(s.p) sec.appendChild(el('p',null,s.p));
  }
  deck.appendChild(sec);
});
</script>
</body>
</html>
</content>
