<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision to Venture — Idea to First Customer in 12 Weeks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffaee;        /* their warm cream ground */
    --panel:#ffffff;
    --panel2:#f5efe0;
    --rule:#d6dad5;      /* their sage grey */
    --ink:#1f2434;       /* their True-North navy */
    --muted:#55596a;
    --accent:#e93828;    /* their compass-red mark */
    --serif:'EB Garamond',Georgia,serif;
    --sans:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--panel2);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 64px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;top:22px;right:26px;width:34px;height:34px;border:2px solid var(--accent);border-radius:50%;opacity:.5}
  .slide::after{content:"N";position:absolute;top:28px;right:38px;font-family:var(--serif);font-weight:600;color:var(--accent);font-size:15px;opacity:.7}
  .eyebrow{font-family:var(--sans);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:600;font-size:48px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.14;margin-bottom:16px}
  .lead{font-size:20px;color:var(--muted);max-width:40ch}
  .big{font-family:var(--serif);font-size:40px;line-height:1.16;font-weight:500;max-width:22ch}
  .big .hot{color:var(--accent)}
  ul{list-style:none;margin-top:10px}
  li{position:relative;padding-left:30px;margin:14px 0;font-size:18px;max-width:52ch}
  li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .part{font-family:var(--sans);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
  .partnum{font-family:var(--serif);font-size:64px;color:var(--accent);font-weight:600;line-height:1;margin-bottom:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:8px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .card h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:8px}
  .card p{font-size:16px;color:var(--muted)}
  .weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}
  .wk{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 12px;font-size:15px}
  .wk b{display:block;font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .wk.hot{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .wk.hot b{color:var(--accent)}
  .foot{position:absolute;left:56px;bottom:22px;font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .page{position:absolute;right:56px;bottom:22px;font-size:12px;color:var(--muted)}
  .disclaimer{margin-top:22px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .cta-box{background:var(--ink);color:var(--bg);border-radius:12px;padding:26px 30px;margin-top:20px;display:inline-block}
  .cta-box b{font-family:var(--serif);font-size:24px;font-weight:600}
  @media(max-width:680px){.slide{padding:34px 26px}h1{font-size:34px}.big{font-size:28px}.grid2,.weeks{grid-template-columns:1fr 1fr}.foot,.page{position:static;margin-top:18px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<footer style="max-width:960px;margin:0 auto;padding:0 72px 48px;font-family:'Mulish',system-ui,sans-serif;font-size:13px;color:#55596a;line-height:1.5">
This masterclass is educational. No income or result is guaranteed. Results vary from founder to founder and depend on the work you put in and your own market.
</footer>
<script>
const S=[
  {t:'title',eyebrow:'Vision to Venture · Go True North',h:'Idea to First Customer in 12 Weeks',lead:'The Lean way to prove your business is real before you spend months building it.'},
  {t:'who',eyebrow:'Who this is for',h:'You, if any of these sound familiar',b:['You have an early idea and you are not sure anyone will pay for it','You are side-hustling and want real launch clarity, not another course','You are a founder who wants paying customers, not more theory']},
  {t:'trap',eyebrow:'The trap',big:'You were told to write the business plan first. So you planned for months, and still no customer has said yes.'},
  {t:'reframe',eyebrow:'The reframe',big:'Most ideas do not die in the market. They die in the <span class="hot">building</span>, long before a real customer is ever asked.'},
  {t:'part',num:'01',part:'Part One',h:'Why first-time founders stall'},
  {t:'bullets',eyebrow:'Part One',h:'Three quiet killers',b:['Perfecting the product before a single customer has seen it','Waiting for certainty that only a real buyer can give you','Building in the dark, then hoping the market shows up']},
  {t:'bullets',eyebrow:'Part One',h:'What it costs',b:['Months of work poured into something nobody asked for','Savings spent proving the idea to yourself, not the market','Momentum lost, and the confidence that goes with it']},
  {t:'part',num:'02',part:'Part Two',h:'The Lean Path, the Vision to Venture method'},
  {t:'cards',eyebrow:'Part Two · the four moves',h:'Prove it before you build it',cards:[
    {h:'1. Map the Lean Canvas',p:'Put the whole business on one page. A living tool you change as you learn, not a 40-page plan you never open.'},
    {h:'2. Find the real problem',p:'Talk to the people who would actually buy. Learn the problem that matters enough to pay for.'},
    {h:'3. Test the demand',p:'Read real buying signals, not politeness. Validate that people want this before you build it.'},
    {h:'4. Land the first customer',p:'Launch lean, make the offer, and get the one thing that changes everything: a paying customer.'}
  ]},
  {t:'weeks',eyebrow:'Part Two · the shape',h:'One right action at a time',weeks:[
    {k:'Weeks 1-2',v:'Lean Canvas and the real problem'},
    {k:'Weeks 3-4',v:'Customer interviews and demand tests'},
    {k:'Weeks 5-8',v:'Shape the offer, build only what is proven'},
    {k:'Weeks 9-12',v:'Launch lean, first paying customer',hot:true}
  ]},
  {t:'part',num:'03',part:'Part Three',h:'From a validated idea to a real customer'},
  {t:'cards',eyebrow:'Part Three',h:'Two ways to spend the next 12 weeks',cards:[
    {h:'The old way',p:'Plan, perfect, and build quietly for months. Launch to silence, and only then find out what the market thinks.'},
    {h:'The Lean way',p:'Validate in weeks, build only what is wanted, and reach week twelve with a real customer and a reason to keep going.'}
  ]},
  {t:'why',eyebrow:'Why learn this from Neil',h:'Lean validation for idea-stage founders',b:['A career in hands-on engineering, Lean process improvement, and senior leadership','Go True North: a Lean business-growth practice serving founders locally, nationally, and internationally','UK StartUp Awards 2026 regional finalist, and business-education content with over two million views']},
  {t:'bullets',eyebrow:'What changes',h:'By the end of twelve weeks',b:['Clarity: you know who you serve and the problem worth solving','Momentum: one right action at a time, no overwhelm','Proof: a first paying customer, not a hopeful guess']},
  {t:'recap',eyebrow:'In one line',big:'Do not build and hope. <span class="hot">Validate</span>, then build the thing a customer already wants.'},
  {t:'cta',eyebrow:'Your next step',h:'Start your 12-week journey',lead:'Vision to Venture walks you from a raw idea to your first paying customer, with live workshops and the Lean method, step by step.',box:'Begin with the Founders Framework at Go True North',disc:'This masterclass is educational. No income or result is guaranteed. Results vary from founder to founder and depend on the work you put in and your own market.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let inner='';
  if(s.eyebrow) inner+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='title'){inner+=`<h1>${s.h}</h1><p class="lead">${s.lead}</p>`;}
  else if(s.t==='part'){inner=`<div class="partnum">${s.num}</div><div class="part">${s.part}</div><h2>${s.h}</h2>`;}
  else if(s.t==='trap'||s.t==='reframe'||s.t==='recap'){inner+=`<p class="big">${s.big}</p>`;}
  else if(s.t==='cards'){inner+=`<h2>${s.h}</h2><div class="grid2">`+s.cards.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')+`</div>`;}
  else if(s.t==='weeks'){inner+=`<h2>${s.h}</h2><div class="weeks">`+s.weeks.map(w=>`<div class="wk${w.hot?' hot':''}"><b>${w.k}</b>${w.v}</div>`).join('')+`</div>`;}
  else if(s.t==='cta'){inner+=`<h1>${s.h}</h1><p class="lead">${s.lead}</p><div class="cta-box"><b>${s.box}</b></div><p class="disclaimer">${s.disc}</p>`;}
  else {inner+=`<h2>${s.h}</h2>`+(s.b?`<ul>`+s.b.map(x=>`<li>${x}</li>`).join('')+`</ul>`:'');}
  inner+=`<div class="foot">Vision to Venture</div><div class="page">${i+1} / ${S.length}</div>`;
  el.innerHTML=inner;deck.appendChild(el);
});
</script>
</body>
</html>
