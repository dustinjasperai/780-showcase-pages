<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Well-Led Life - Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF6;        /* warm off-white - brand page is light (extract_brand) */
    --ink:#181818;       /* brand dominant ink (#181818, 35 uses) */
    --accent:#ffde59;    /* brand yellow (#ffde59, 20 uses) - fills/rules only */
    --accent-ink:#8A6A00;/* legible deep amber for accent text on light */
    --emphasis:#c6302c;  /* brand red (#c6302c) - single sparing emphasis */
    --panel:#F2EFE6;     /* soft warm panel */
    --rule:#E3DECF;      /* hairline */
    --muted:#5b574e;
    --head:'Bitter',Georgia,serif;
    --body:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:54px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent-ink);margin:0 0 18px}
  .slide h1{font-family:var(--head);font-weight:600;font-size:46px;line-height:1.08;margin:0 0 18px}
  .slide h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;margin:0 0 16px}
  .slide p{font-size:20px;line-height:1.55;margin:0 0 14px;max-width:46ch}
  .slide p.lead{font-size:23px}
  .slide ul{font-size:20px;line-height:1.5;margin:8px 0 0;padding-left:0;list-style:none}
  .slide li{margin:0 0 12px;padding-left:30px;position:relative}
  .slide li:before{content:"";position:absolute;left:0;top:10px;width:14px;height:14px;background:var(--accent);border-radius:3px}
  .num{position:absolute;top:22px;right:28px;font-size:13px;color:var(--muted);font-weight:700}
  .bar{height:8px;width:72px;background:var(--accent);border-radius:4px;margin:0 0 26px}
  .title-slide{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .title-slide .kicker{color:var(--accent)}
  .title-slide h1{font-size:54px}
  .title-slide p{color:#E9E6DE}
  .steps{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .steps span{font-family:var(--body);font-weight:700;font-size:16px;background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:9px 16px}
  .steps span.on{background:var(--accent);border-color:var(--accent)}
  .yr{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}
  .yr div{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:20px}
  .yr h3{font-family:var(--head);font-size:22px;margin:0 0 8px}
  .yr p{font-size:16px;margin:0}
  .emph{color:var(--emphasis);font-weight:700}
  .cta-slide{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .cta-slide .kicker{color:var(--accent)}
  .cta-slide p{color:#E9E6DE;max-width:52ch}
  .disclaimer{font-size:13px;color:#B9B4A8;margin-top:22px;max-width:60ch;line-height:1.5}
  .quote{font-family:var(--head);font-style:italic;font-size:30px;line-height:1.3;max-width:40ch}
</style>
</head>
<body>
<div class="deck" id="deck"></div><script>
const S = [
  {t:'title', kicker:'A Masterclass for Parents of Teens',
   h:'The Well-Led Life',
   sub:'How a teen builds real leadership from the inside out, starting with who they are, not what they can do.'},

  {t:'who', kicker:'Who this is for',
   h:'For the parent raising a leader, not just a resume.',
   body:'You want your pre-teen or teen (grades 5 to 12) to grow into someone with character, confidence, and a sense of purpose. You have seen the camps, the titles, and the skills lists. Something still feels like it is missing.'},

  {t:'trap', kicker:'The trap',
   h:'We tell teens to "be a leader." Then we hand them the wrong tools.',
   body:'Most youth leadership starts with skills: public speaking, running a meeting, building a resume. Useful. But skills sit on top of something deeper, and if that foundation is shaky, the skills do not hold.'},

  {t:'hook', kicker:'The reframe',
   h:'A teen who leads to prove their worth is leading from fear.',
   body:'When a young person believes their value comes from their performance, approval, or achievement, leadership becomes anxious. They play it safe. They fear failure and rejection. They lead to get, not to give.'},

  {t:'bullets2', kicker:'You have probably seen it',
   h:'What leading from performance looks like at 14.',
   bullets:['The high-achiever who freezes the moment they might get something wrong','The capable kid who never raises their hand in case it sounds dumb','The teen whose mood rises and falls with the group chat','Effort that only shows up where someone is keeping score']},

  {t:'section', kicker:'Part One',
   h:'The real problem is identity, not ability.',
   body:'Confidence that depends on the next win collapses the moment the win does not come. You cannot build a steady leader on an unsteady sense of self. This is where most teen leadership programs never go.'},

  {t:'bullets2', kicker:'The cost of skipping it',
   h:'Skills built on a shaky foundation do not last.',
   bullets:['Public-speaking polish that cracks under real pressure','A resume of titles with no sense of why any of it matters','Burnout by senior year from performing for approval','Good kids who are quietly terrified of failing']},

  {t:'quote',
   q:'"From fear to faith. From timidity to bravery. From getting to giving."',
   sub:'The shift every young leader needs first.'},

  {t:'section', kicker:'Part Two - the framework',
   h:'Build the teen on a foundation that does not move.',
   body:'In The Well-Led Life, a teen learns that their worth is received, not earned. Identity comes first. Only then do mission and character have something solid to stand on.'},

  {t:'years', kicker:'The three-year arc',
   h:'Identity, then Mission, then Character.',
   years:[
     {y:'Year 1 - Identity', d:'Build yourself on Christ. A growth mindset, Christ-centered confidence, and freedom from the fear of failure and rejection.'},
     {y:'Year 2 - Mission', d:'Discover or confirm your life’s mission. Write a personal mission statement, name your core values, and define what success means to you.'},
     {y:'Year 3 - Character', d:'Become the leader to fulfill your mission. Grow the core qualities: character, commitment, communication, focus, initiative, and problem-solving.'}
   ]},

  {t:'bullets2', kicker:'Year 2 in practice',
   h:'A mission a teen can actually say out loud.',
   body:'The centerpiece of the Mission year is a personal mission statement the teen writes and owns.',
   bullets:['Name the core values that will guide real decisions','Define what success means to them, not to the feed','Turn a vague goal into a plan they can act on this month']},

  {t:'quote',
   q:'"Failure is not the opposite of leadership. Learning to fail well is part of it."',
   sub:'Teens who are free from the fear of failure take braver, better risks.'},

  {t:'progression', kicker:'The model',
   h:'You lead others only as far as you can lead yourself.',
   body:'Leadership expands outward from the inside. Self-leadership is the non-negotiable first step, and every stage after it rests on the one before.',
   steps:['Lead yourself','Lead one person','Lead a group','Lead an organization','Lead a community']},

  {t:'method', kicker:'How it is taught',
   h:'Discussion, not lecture.',
   body:'Teens do not grow by being talked at. In the Mastermind, they learn a principle, discuss it with peers through focused questions, apply it with real goals, and come back to it again.',
   bullets:['Facilitated roundtable discussion that draws out each teen’s own thinking','Consistent peer accountability over the school year','Learn, discuss, apply, repeat, bi-monthly, live']},

  {t:'section', kicker:'Part Three - the well-led teen',
   h:'A teen who knows who they are, where they are going, and how to get there.',
   body:'Not a teen performing leadership for an application. A teen who leads themselves well first, so they can lead others without fear.'},

  {t:'bullets2', kicker:'The outcome',
   h:'What steady, identity-first leadership produces.',
   bullets:['Confidence that does not depend on the next win or the next like','A written sense of mission and the values behind their choices','Character practiced in the small moments, not just claimed','The courage to take initiative and to fail well']},

  {t:'why', kicker:'Why learn this here',
   h:'Taught by someone who has spent years in this with teens.',
   body:'Brenda Jung founded The Well-Led Life to teach personal leadership to pre-teens and teens. She is a Youth-Certified Coach on the John Maxwell Leadership Team and holds an M.A. in Biblical Studies from Westminster Seminary California. The whole program is built on one conviction: a teen’s worth comes from Christ, so they are free to lead with courage.'},

  {t:'cta', kicker:'Your next step',
   h:'Help your teen build a well-led life.',
   body:'If this is the kind of leadership you want for your teen, the next step is a short conversation to see whether the Well-Led Life Mastermind is the right fit for them this year.',
   disc:'No specific academic, personal, or life result is guaranteed. Results vary from student to student. This masterclass is educational and makes no income or outcome promises.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const n = i+1;
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta-slide':'');
  let h = '';
  if(s.t!=='title' && s.t!=='cta' && s.t!=='quote') h += '<div class="num">'+n+' / '+S.length+'</div>';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.t!=='title' && s.t!=='cta' && s.t!=='quote' && s.h) h += '<div class="bar"></div>';
  if(s.h) h += (s.t==='title'||s.t==='cta' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if(s.sub && s.t==='title') h += '<p class="lead">'+s.sub+'</p>';
  if(s.body) h += '<p'+(s.t==='who'||s.t==='hook'?' class="lead"':'')+'>'+s.body+'</p>';
  if(s.q){ h += '<div class="num">'+n+' / '+S.length+'</div><p class="quote">'+s.q+'</p>'; if(s.sub) h += '<p>'+s.sub+'</p>'; }
  if(s.years){ h += '<div class="yr">'; s.years.forEach(y=>{ h += '<div><h3>'+y.y+'</h3><p>'+y.d+'</p></div>'; }); h += '</div>'; }
  if(s.steps){ h += '<div class="steps">'; s.steps.forEach((st,si)=>{ h += '<span'+(si===0?' class="on"':'')+'>'+st+'</span>'; }); h += '</div>'; }
  if(s.bullets){ h += '<ul>'; s.bullets.forEach(b=>{ h += '<li>'+b+'</li>'; }); h += '</ul>'; }
  if(s.t==='bullets2' && s.bullets2){}
  if(s.sub && s.t==='cta') h += '<p>'+s.sub+'</p>';
  if(s.t==='cta' && s.disc) h += '<p class="disclaimer">'+s.disc+'</p>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
