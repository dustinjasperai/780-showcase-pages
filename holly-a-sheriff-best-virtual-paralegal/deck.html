<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paralegal to Paralegal CEO — A Live Masterclass with Holly A. Sheriff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8ece8;        /* pale blush paper — a light tint of their dominant brand red #d71b15 on their light scheme */
    --panel:#ffffff;
    --rule:#ecdbd7;      /* faint red-gray hairline off the same brand red */
    --ink:#1a1a1a;       /* from their #111111/#333333 */
    --muted:#5c5650;
    --accent:#d71b15;    /* their own brand red, ranked_colors #d71b15 (52 uses) */
    --display:'Poppins', sans-serif;
    --body:'Source Sans Pro', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:10px;
    padding:52px 56px;margin:0 0 26px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;position:relative}
  .slide::before{content:"";position:absolute;left:0;top:28px;bottom:28px;width:4px;
    background:var(--accent);border-radius:4px}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.14;margin-bottom:18px}
  .sub{font-size:21px;color:var(--muted);margin-bottom:10px}
  p{font-size:19px;margin-bottom:14px;max-width:46em}
  ul{margin:8px 0 8px 22px}
  li{font-size:19px;margin-bottom:12px;max-width:44em}
  li b,p b{font-family:var(--display);font-weight:600}
  .big{font-size:30px;font-family:var(--display);font-weight:600;line-height:1.2;max-width:40em}
  .meta{margin-top:26px;font-size:16px;color:var(--muted)}
  .tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:13px;
    color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 12px;margin-bottom:18px}
  .cta h2{color:var(--accent)}
  .disclaimer{margin-top:28px;font-size:13px;color:var(--muted);max-width:50em;line-height:1.45}
  .pagenum{position:absolute;right:26px;bottom:18px;font-size:13px;color:var(--muted);font-family:var(--display)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',
  eyebrow:'A Live Masterclass with Holly A. Sheriff, MSLS, MCC',
  h1:'Paralegal to Paralegal CEO',
  sub:'How experienced paralegals build a freelance practice that pays like ownership, not a salary.',
  meta:'Live, on Zoom. Bring the practice you already run every day. Leave with the path to run your own.'},

 {t:'who',
  eyebrow:'Who this is for',
  h2:'You are the one who actually runs the cases.',
  bullets:['You are an experienced paralegal, and you are good, really good, at the work.',
    'You have wondered, quietly, whether you could do this on your own terms.',
    'You are tired of a salary that is capped no matter how much value you create.',
    'If that is you, the next 45 minutes are built for you.']},

 {t:'trap',
  eyebrow:'The trap',
  h2:'The ceiling is real, and more hours is the only lever you have.',
  p:['Inside a firm, your pay is set by a title, not by the results you deliver. The only way up is more hours, more cases, more nights.',
     'So the best paralegals burn out doing the work that keeps the whole firm standing. That is not a mindset problem. It is a structure problem.']},

 {t:'hook',
  tag:'A harder truth',
  h2:'The risk is not going out on your own. The risk is staying.',
  big:'The paycheck feels like the safe choice. It is also the exact thing holding your income, your schedule, and your future flat.'},

 {t:'part',
  eyebrow:'Part One',
  h2:'Why great paralegals stay stuck.'},

 {t:'content',
  eyebrow:'Part One',
  h2:'The hard part was never the legal skill.',
  p:['You already have the skill. You draft, you research, you manage cases that would sink most people. That is not what keeps you employed instead of self-employed.',
     'What keeps you stuck is an identity: you were trained to be the person behind the attorney, never the owner in front of the client. The shift from employee to owner is the real work, and almost no one teaches it.']},

 {t:'content',
  eyebrow:'Part One',
  h2:'Three things nobody taught you.',
  bullets:['<b>Positioning.</b> What you actually sell, and to which attorneys, when you are no longer "the firm’s paralegal."',
    '<b>Pricing.</b> How to charge for the value of the outcome instead of an hourly wage you inherited from a job.',
    '<b>Finding clients.</b> A repeatable way to bring in attorney-clients that does not depend on luck or one referral.']},

 {t:'part',
  eyebrow:'Part Two',
  h2:'The Paralegal CEO path.'},

 {t:'content',
  eyebrow:'Part Two • Launch',
  h2:'Pillar 1: Paralegal Launchpad™.',
  p:['The launch half of the path: position your practice, choose the first services you will offer, set your rates, and stand up a compliant virtual paralegal practice you can actually run.',
     'This is the employee-to-owner bridge, built by someone who crossed it first.']},

 {t:'content',
  eyebrow:'Part Two • Price',
  h2:'Pillar 2: Price like an owner.',
  p:['Most paralegals leave a firm and quietly recreate their old hourly wage as a freelance rate. That is a job with extra steps.',
     'An owner prices the outcome: the backlog cleared, the trial ready, the panic gone before it starts. We set rates that reflect what the work is worth to the attorney, not what a payroll line used to pay you.']},

 {t:'content',
  eyebrow:'Part Two • Clients',
  h2:'Pillar 3: Build a client engine.',
  p:['Referrals are wonderful and completely unreliable as a business plan. A practice needs a steady way to put the right attorneys in front of you.',
     'You will build a simple, repeatable client engine: a clear pitch for what you do, and a handful of channels that bring attorney-clients to you on purpose.']},

 {t:'content',
  eyebrow:'Part Two • Systems',
  h2:'Pillar 4: Systems that diminish panic.',
  p:['The reason paralegals burn out is not the volume. It is the chaos: no process, everything urgent, every file a fire.',
     'Work-Life Balance & Professional Excellence™ is the method: simplify the workflow, build the checklists and rhythms that make flawless, panic-free work the default, and protect your own time while you do it.']},

 {t:'content',
  eyebrow:'Part Two • Scale',
  h2:'Pillar 5: The CEO mindset.',
  p:['The Accelerator Paralegal CEO™ is the scale half: you stop thinking like a very busy freelancer and start thinking like the owner of a growing practice.',
     'That means accountability, a real business plan, and the decisions that let the practice grow past your own two hands into a team or an agency when you are ready.']},

 {t:'part',
  eyebrow:'Part Three',
  h2:'Your practice, on your terms.'},

 {t:'content',
  eyebrow:'Part Three',
  h2:'A week in a Paralegal CEO’s practice.',
  bullets:['You choose the attorneys you work with, instead of taking whatever the firm assigned.',
    'Your rates are set once, on purpose, and they hold.',
    'Your hours are yours. The chaos lives in a system, not in your head.',
    'Your income is tied to the value you create, with no title capping it.']},

 {t:'content',
  eyebrow:'Why me',
  h2:'I built the thing I am teaching you to build.',
  p:['I am Holly A. Sheriff, MSLS, MCC. I have spent over three decades in the legal field, and I built one of the first nationwide virtual paralegal practices in the country, before "virtual paralegal" was a phrase anyone used.',
     'I am also a Master Certified Coach, and I have helped paralegals simplify their workflow, diminish their panic, and build practices that last, with a 98% client success rate. I am not teaching you theory. I am handing you the map I drew by walking it.']},

 {t:'content',
  eyebrow:'The choice',
  h2:'Two roads from here.',
  p:['One road: another year inside the firm, doing the work that holds everything up, for a number someone else decided.',
     'The other road: your own practice, your own clients, your own rates, built on the skill you already have. The only difference between the two is a path, and you just saw it.']},

 {t:'cta',
  eyebrow:'Your next step',
  h2:'Ready to build your Paralegal CEO practice?',
  p:['If you want help making the move, the next step is a conversation. Schedule a chat with me and we will map your launch together, and see whether The Accelerator Paralegal CEO™ is the right path for where you are.'],
  meta:'Schedule a chat at bestvirtualparalegal.com • The Paralegal View podcast',
  disclaimer:'Educational content only. Best Virtual Paralegal LLC is not a law firm and does not provide legal advice; all paralegal work should be supervised by a licensed attorney. Results vary by individual effort, market, and circumstances. Nothing here is a guarantee of income or specific business results.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.tag) h+='<div class="tag">'+s.tag+'</div>';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.big) h+='<p class="big">'+s.big+'</p>';
  if(s.p) s.p.forEach(x=>h+='<p>'+x+'</p>');
  if(s.bullets){h+='<ul>';s.bullets.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.meta) h+='<div class="meta">'+s.meta+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  h+='<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
