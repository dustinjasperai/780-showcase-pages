<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Trusted Advisor Shift — Betsy Jordyn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf8;        /* warm near-white ground <- her #f3f3f3 light UI */
    --panel:#161e2a;     /* deep navy <- her h2 color #161e2a */
    --rule:#e7e1da;      /* warm neutral off the ground */
    --accent:#e10489;    /* her signature magenta, 24 uses */
    --ink:#20242c;       /* her body grays #2d2d2d / #20242c */
    --muted:#5c6168;
    --paper:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:54px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide.dark{background:var(--panel);color:#f3f3f3;border-color:#243247}
  .slide.dark .eyebrow{color:#ffb4e2}
  .slide.dark .muted{color:#b9c2d0}
  .eyebrow{font-family:"Gabarito";font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Gabarito";font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"Gabarito";font-weight:700;font-size:33px;line-height:1.12;letter-spacing:-.01em;margin-bottom:14px}
  .lead{font-size:20px;color:var(--muted);margin-top:16px;max-width:42ch}
  .slide.dark .lead{color:#c7cedb}
  p.body{font-size:18px;margin-top:12px;max-width:54ch}
  ul{margin:18px 0 0 0;list-style:none;max-width:56ch}
  li{position:relative;padding-left:30px;font-size:18px;margin:12px 0}
  li:before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .num{font-family:"Gabarito";font-weight:800;font-size:15px;color:var(--accent);border:2px solid var(--accent);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
  .foot{position:absolute;bottom:18px;left:56px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .brand{font-family:"Gabarito";font-weight:700;font-size:15px;letter-spacing:.02em}
  .kicker{font-family:"Gabarito";font-weight:700;font-size:16px;color:var(--accent);margin-bottom:10px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch}
  .slide.dark .disclaimer{color:#9aa5b4}
  .cta-line{font-size:22px;font-weight:600;margin-top:18px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Betsy Jordyn',h:'The Trusted Advisor Shift',lead:'How to land and influence executive clients without a seat on the org chart.',brand:'Betsy Jordyn'},
  {t:'promise',eyebrow:'What you will walk away with',h:'A proven way to be seen, trusted, and paid as an advisor.',bullets:['A clear reason executives say yes to some consultants and ignore others','The five-stage path a corporate buyer actually travels before they hire you','The messaging that moves you from confused to confident about your value']},
  {t:'who',eyebrow:'Who this is for',h:'The purpose-driven consultant and coach.',lead:'You have real expertise and you want to make money and a difference, especially with larger organizations. You just need a process you can trust for landing executive clients.'},
  {t:'trap',eyebrow:'The trap',h:'Being treated as an extra pair of hands.',body:'You get hired for tasks, paid by the hour or the day, and kept away from the decisions that matter. The ceiling is not your skill. It is how you are positioned.'},
  {t:'reframe',dark:true,eyebrow:'The reframe',h:'It is not your expertise they question. It is your positioning.',lead:'You do not need positional authority to deliver exceptional value. You need to be seen as the advisor, not the vendor.'},
  {t:'part',kicker:'Part One',h:'The credibility myth.',body:'Most consultants think credibility comes from more certifications, a bigger title, or louder self-promotion. It does not. Credibility comes from how clearly you understand the buyer and the problem.'},
  {t:'point',eyebrow:'Why good consultants get ignored',h:'You are answering a question the executive has not asked yet.',body:'When you lead with your methodology instead of their problem, you sound like every other vendor. The buyer cannot tell that you are the one who can actually help.'},
  {t:'point',eyebrow:'The real cost',h:'Trading time for money caps your impact and your income.',body:'Hourly and day rates reward you for effort, not outcomes. The larger organizations with the larger budgets are buying results and judgment, not hours.'},
  {t:'framework',dark:true,eyebrow:'Part Two, the framework',h:'The Buyer’s Journey Model.',lead:'A corporate buyer moves through five stages before they hire. Meet them at each one and the decision to work with you becomes obvious.'},
  {t:'stage',num:'1',eyebrow:'Stage one',h:'Problem Recognition.',body:'Something is wrong, but the buyer has not even named it yet. Your job is to help them see and name it clearly.'},
  {t:'stage',num:'2',eyebrow:'Stage two',h:'Problem Validation.',body:'They realize the issue is real and that it is costing them. This is where the problem becomes worth solving.'},
  {t:'stage',num:'3',eyebrow:'Stage three',h:'Solution Exploration.',body:'They decide the problem matters enough to act, and that they may need outside help to solve it well.'},
  {t:'stage',num:'4',eyebrow:'Stage four',h:'Option Evaluation.',body:'They compare their options, traditional consulting, programs, advisors. This is where positioning as a trusted advisor wins.'},
  {t:'stage',num:'5',eyebrow:'Stage five',h:'Decision.',body:'They choose a trusted advisor relationship. If you have guided the earlier stages, you are the obvious choice.'},
  {t:'framework',eyebrow:'Strategic Brand Messaging',h:'Four questions that move you from confused to confident.',body:'Clarity about who you serve, the specific problem you solve, why it matters, and why you. Get these right and your messaging stops sounding generic and starts sounding like the advisor they have been looking for.'},
  {t:'framework',eyebrow:'The positioning hierarchy',h:'Clarity has to come before content.',bullets:['Start from your own design and calling','Name the specific problem you solve, not a generic outcome','Define your ideal client as an earlier version of yourself','Position as the trusted advisor, then write messaging that is authentically you']},
  {t:'point',eyebrow:'Part Three, the advisor engagement',h:'Priced and positioned as an advisor.',bullets:['You are brought into the decisions, not just the tasks','You price around outcomes and raise your per-contract fees','You structure engagements so you can stand behind the results']},
  {t:'why',dark:true,eyebrow:'Why learn this from me',h:'Twenty years of transformation work, made learnable.',lead:'I started as an internal organizational development consultant at Walt Disney World and applied those same principles inside companies like Wyndham and AAA. I grew my own practice to multiple six figures. The success was never the Disney name. It was principles and practices you can learn.'},
  {t:'point',eyebrow:'How to grow without burning out',h:'Go slow to go fast.',body:'Sustainable growth respects how people actually change. Single paced steps build momentum through habit, instead of an overwhelm that stalls you out.'},
  {t:'cta',eyebrow:'Your next step',h:'Ready to be seen, trusted, and paid as an advisor?',cta:'Join the next live masterclass, then book your Strategic Clarity Call to map your path into the Strategic Brand Building Partnership.',brand:'Betsy Jordyn',disclaimer:'This masterclass is educational and is intended to share principles and practices for building a consulting or coaching practice. It is not a guarantee of income or results. Your outcomes depend on many factors, including your own effort and market.'}
];
const deck=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.dark?' dark':'');
  let html='';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.num) html+='<div class="num">'+s.num+'</div>';
  if(s.h) html+=(s.t==='title'?'<h1>'+s.h+'</h1>':'<h2>'+s.h+'</h2>');
  if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
  if(s.body) html+='<p class="body">'+s.body+'</p>';
  if(s.cta) html+='<p class="cta-line">'+s.cta+'</p>';
  if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul>';}
  if(s.disclaimer) html+='<p class="disclaimer">'+s.disclaimer+'</p>';
  if(s.brand) html+='<div class="foot"><span class="brand">'+s.brand+'</span></div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
