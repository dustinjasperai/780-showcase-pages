<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX Growth Academy — Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rethink+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#f8f8f9; --ink:#1d1d26; --muted:#5a5a66;
    --rule:#cdcccf; --accent:#7f5fd7;
    --display:'Rethink Sans',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:60px 56px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .kick{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.06;letter-spacing:-.02em}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.01em}
  p{font-size:20px;line-height:1.55;color:var(--muted);margin-top:18px;max-width:62ch}
  p.big{font-size:26px;color:var(--ink);font-weight:500}
  ul{margin:22px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:3px}
  li b{font-family:var(--display);font-weight:700;color:var(--ink)}
  .num{position:absolute;top:22px;right:28px;font-family:var(--display);font-weight:700;
    font-size:13px;color:var(--rule)}
  .part{background:var(--ink);color:var(--bg)}
  .part .kick{color:var(--accent)}
  .part h1{color:var(--bg)}
  .part p{color:#c9c9d2}
  .map{margin-top:26px;border:1px solid var(--rule);border-radius:10px;padding:26px;background:var(--panel);
    display:grid;grid-template-columns:1fr 1fr;gap:1px;max-width:460px}
  .map div{background:var(--bg);padding:20px;font-size:15px;color:var(--muted);font-weight:500}
  .axislabel{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin-top:14px}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;max-width:66ch;line-height:1.5}
  .cta h1{font-size:42px}
  .quote h1{font-size:40px;line-height:1.12}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const S=[
 {t:'title',kick:'A UX Growth Academy masterclass',h:'Why Your Best UX Work Keeps Getting Ignored',p:'And the soft skills that get an experienced designer’s work shipped. A live, practical session for designers who are done watching strong work stall.'},
 {t:'std',kick:'Who this is for',h:'You do good work. It keeps stalling.',p:'You are an experienced UX designer. Your flows test clean, your research is solid, your craft is not the issue. And yet the decisions keep getting made somewhere you are not in the room.'},
 {t:'std',kick:'The trap',h:'So you reach for more craft.',p:'A sharper portfolio. A new tool. Another framework for the work itself. It feels like the answer because craft is what got you here. It is not what moves you up from here.'},
 {t:'quote',kick:'The reframe',h:'You are not being out-designed. You are being out-influenced.',p:'The work does not die on the screen. It dies in the room, in the words "let’s circle back."'},
 {t:'part',kick:'Part one',h:'The real problem',p:'Why great work gets ignored, and where the decision actually happens.'},
 {t:'std',kick:'The ceiling',h:'Hard skills got you hired.',p:'They no longer differentiate you. Every senior designer in the building can run the research and ship the flow. The craft is table stakes now, not the edge.'},
 {t:'std',kick:'Where it dies',h:'The decision is a conversation, not a file.',p:'By the time your work reaches the people who decide, it is competing with budgets, roadmaps and louder voices. If you cannot carry it into that conversation, the quality of the file does not save it.'},
 {t:'std',kick:'The cost',h:'The plateau is quiet.',p:'Strong designers stall for years without a single bad review. The work is fine. The influence is missing. And influence, not output, is what the next level is actually made of.'},
 {t:'part',kick:'Part two',h:'The UX Growth Academy approach',p:'Locate where you are, then build the three skills that move you up.'},
 {t:'map',kick:'The UX Role Map',h:'First, find yourself on the map.',p:'Our role map places you between making and shaping, between reacting and deciding. You cannot grow a role you have not honestly located.',
   cells:['Maker: you execute the work handed to you','Strategist: you shape what the work should be','React: you respond to the roadmap','Shape: you influence the roadmap'],ax1:'Maker to strategist',ax2:'React to shape'},
 {t:'std',kick:'The spine',h:'Three skills, not thirty tactics.',p:'We teach the soft skills that decide a designer’s career, in the order they compound:'},
 {t:'list',kick:'Skill one',h:'Communication',p:'Get heard. Position your work in the language of the people who decide, so what you made is understood before it is judged.',
   items:['<b>Frame before you present</b> so the work lands in context','<b>Say the one thing</b> that makes the decision obvious','<b>Make the invisible visible</b>: the reasoning, not just the screens']},
 {t:'list',kick:'Skill two',h:'Stakeholder management and leadership',p:'Win buy-in. Manage the people around the work, not just the work, and turn a "circle back" into a yes.',
   items:['<b>Map the stakeholders</b> and what each one actually needs','<b>Build the alliance</b> before the meeting, not during it','<b>Lead without the title</b>: set the direction others follow']},
 {t:'list',kick:'Skill three',h:'Growth mindset',p:'Level past the craft ceiling. Keep developing the parts of the role no tool will ever automate.',
   items:['<b>Treat influence as a skill</b> you practise, not a personality you lack','<b>Seek the hard feedback</b> that craft praise never gives you','<b>Design your own trajectory</b>, deliberately, year on year']},
 {t:'quote',kick:'The principle',h:'Going forward, you no longer design interfaces. You design relationships.',p:'The screens are the easy part. The lasting work is the trust and the clarity that get them built.'},
 {t:'part',kick:'Part three',h:'The room, changed',p:'The same designer, the same proposal, a different outcome.'},
 {t:'std',kick:'A week later',h:'The proposal that stalled, now approved.',p:'Nothing about the work changed. What changed is that the right people understood it, wanted it, and felt ownership of it before the meeting even started. That is influence doing its job.'},
 {t:'std',kick:'Why UX Growth Academy',h:'The first soft skills academy for UX designers.',p:'Built by the team behind New Monday, one of Germany’s leading B2B UX agencies, from real enterprise work. Practical methods and honest reflection, not buzzword bingo or dry theory.'},
 {t:'std',kick:'In one line',h:'Your next level is not more craft. It is influence.',p:'Communication, stakeholder management, and a growth mindset are the skills that make an experienced designer indispensable.'},
 {t:'cta',kick:'Your next step',h:'Join the next live masterclass.',p:'Spend a focused session building the soft skills that get your work shipped, and leave with the UX Role Map applied to your own role.',
   disc:'Educational session only. No specific career, salary, promotion, or business result is guaranteed. Outcomes vary with each designer’s situation and effort.'}
];
function esc(x){return x;}
const wrap=document.getElementById('wrap');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  let cls='slide';
  if(s.t==='part')cls+=' part';
  if(s.t==='cta')cls+=' cta';
  if(s.t==='quote')cls+=' quote';
  d.className=cls;
  let html='';
  if(s.kick)html+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='title'||s.t==='cta'||s.t==='quote'||s.t==='part'){html+='<h1>'+s.h+'</h1>';}
  else{html+='<h2>'+s.h+'</h2>';}
  if(s.p)html+='<p'+(s.t==='quote'?' class="big"':'')+'>'+s.p+'</p>';
  if(s.items){html+='<ul>';s.items.forEach(it=>html+='<li>'+it+'</li>');html+='</ul>';}
  if(s.t==='map'&&s.cells){
    html+='<div class="map">';s.cells.forEach(c=>html+='<div>'+c+'</div>');html+='</div>';
    html+='<div class="axislabel">'+s.ax1+' &nbsp;/&nbsp; '+s.ax2+'</div>';
  }
  if(s.disc)html+='<div class="disc">'+s.disc+'</div>';
  html+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;
  wrap.appendChild(d);
});
</script>
</body>
</html>
