<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train By Your Numbers — a masterclass with Dr Will &amp; Dr Matt</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f4; --panel:#ffffff; --ink:#2b2b2b; --muted:#6b6b6b;
    --rule:#e3e3df; --accent:#00c0f4; --accent2:#f47f6b; --deep:#0a5a7a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;
    font-weight:600;font-size:15px;color:var(--deep);margin-bottom:18px}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:62px;line-height:1.02;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:44px;line-height:1.05;
    margin-bottom:16px}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:46ch}
  .muted{color:var(--muted)}
  .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:72px;line-height:1.0}
  .big .a{color:var(--accent)}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent2)}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:16px;height:4px;border-radius:2px;background:var(--accent)}
  .zones{display:flex;gap:6px;margin-top:22px}
  .zones span{height:28px;border-radius:4px;flex:1}
  .z1{background:#d7f3fb}.z2{background:#97e2f6}.z3{background:#4fcdf1}.z4{background:#00c0f4}.z5{background:#0a5a7a}
  .pageno{position:absolute;right:20px;bottom:14px;font-family:'Barlow Condensed',sans-serif;
    color:var(--muted);font-size:14px;letter-spacing:.1em}
  .cta h1{color:var(--ink)}
  .ctabtn{display:inline-block;margin-top:22px;background:var(--ink);color:#fff;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;padding:16px 28px;border-radius:8px;font-size:18px}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;max-width:60ch;margin-top:18px}
  .by{font-size:17px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A LIVE MASTERCLASS', h:'Train By Your Numbers',
   lead:'How endurance athletes get faster by reading their own data, not by training harder or running more.',
   by:'With Dr Will O’Connor and Dr Matt Miller, Performance Advantage Podcast'},

  {t:'who', kick:'WHO THIS IS FOR', h:'You train hard. You have stalled.',
   lead:'You are a runner, triathlete or cyclist putting in real work. The volume keeps going up, the results have flattened, and your watch gives you a hundred numbers nobody taught you to use.'},

  {t:'reframe', kick:'THE REFRAME', big:'More miles isn’t the answer. Your <span class="a">data</span> is.',
   lead:'The athletes who break through are not the ones training the most. They are the ones training the right system at the right intensity, measured.'},

  {t:'section', kick:'PART ONE', h:'Why training by feel stops working'},

  {t:'point', kick:'THE CORE PROBLEM', h:'Feel is a liar on the days that matter',
   items:['Pace drifts on a windy day or a hot one, so it hides your real fitness',
          'Heart rate lags intensity and spikes with stress, caffeine and sleep',
          'Effort feels the same at two very different physiological loads',
          'So you push easy days too hard and hard days too easy, and plateau']},

  {t:'point', kick:'THE CORE PROBLEM', h:'You already own the data. You were never taught to read it',
   items:['Your device captures power, heart rate, pace and load every session',
          'Most athletes glance at it, then train the way they always have',
          'The gap is not more data. It is a system for acting on it']},

  {t:'section', kick:'PART TWO', h:'The Faster With Data method'},

  {t:'pillar', kick:'PILLAR ONE', h:'Read your own zones',
   lead:'Find your real threshold, then train power, heart rate and pace against your zones, not a generic chart. The right intensity is personal and measurable.',
   zones:true},

  {t:'pillar', kick:'PILLAR TWO', h:'The six-phase season',
   lead:'Structure the year so you actually peak on race day.',
   items:['Base One, Two and Three build the engine',
          'Build sharpens race-specific fitness',
          'Preparation and Taper deliver you fresh to the start line',
          'Every workout has a purpose in the phase it sits in']},

  {t:'pillar', kick:'PILLAR THREE', h:'Fuel for the race, not a diet',
   lead:'Match fuel to the zone you are training in. Build metabolic flexibility, then dial in a race-day fuel plan you have actually practiced. This is race nutrition, not another diet.'},

  {t:'point', kick:'PUTTING IT TOGETHER', h:'One readout, one decision per session',
   items:['Open the session and read the number that matters for the phase',
          'Hold the zone the plan calls for, not the one your legs want',
          'Review the load, then let the data pick tomorrow’s session',
          'Repeat for a season and the plateau becomes a trend line that climbs']},

  {t:'section', kick:'PART THREE', h:'From guesswork to a measured season'},

  {t:'point', kick:'WHAT CHANGES', h:'From guessing to a system',
   items:['You stop chasing volume and start training with intent',
          'Easy stays easy, hard is genuinely hard, and recovery is earned',
          'Race day stops being a gamble because you have rehearsed it in the data']},

  {t:'credibility', kick:'WHY LEARN THIS FROM US', h:'Two sports scientists, not two influencers',
   items:['Dr Will O’Connor, PhD, endurance coach and the Faster With Data training library',
          'Dr Matt Miller, PhD, performance researcher and inventor of the BrakeAce sensor',
          '120+ episodes of the Performance Advantage Podcast turning the science into practice']},

  {t:'recap', kick:'THE RECAP', h:'Train by your numbers',
   items:['Read your own zones instead of training by feel',
          'Run the six-phase season so you peak when it counts',
          'Fuel for the zone and rehearse the race']},

  {t:'cta', kick:'YOUR NEXT STEP', h:'Keep going with us',
   lead:'If you want the system applied to your season, start a Race Coaching block with Dr Will, or get the full Training Unlimited library and work through it yourself.',
   btn:'Work with Dr Will & Dr Matt',
   disc:'This masterclass is educational. It shares training and nutrition principles, not medical or individualized advice. Results vary between athletes and are not guaranteed. Consult a qualified professional before changing how you train or fuel.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'slide' + (s.t === 'cta' ? ' cta' : '');
  let html = '';
  if (s.kick) html += '<div class="kick">' + s.kick + '</div>';
  if (s.t === 'reframe') {
    html += '<div class="big">' + s.big + '</div>';
    if (s.lead) html += '<p class="lead" style="margin-top:22px">' + s.lead + '</p>';
  } else {
    if (s.h) html += (s.t === 'title' ? '<h1>' : '<h2>') + s.h + (s.t === 'title' ? '</h1>' : '</h2>');
    if (s.lead) html += '<p class="lead">' + s.lead + '</p>';
  }
  if (s.zones) html += '<div class="zones"><span class="z1"></span><span class="z2"></span><span class="z3"></span><span class="z4"></span><span class="z5"></span></div>';
  if (s.items) { html += '<ul>'; s.items.forEach(it => html += '<li>' + it + '</li>'); html += '</ul>'; }
  if (s.by) html += '<div class="by">' + s.by + '</div>';
  if (s.btn) html += '<div><span class="ctabtn">' + s.btn + '</span></div>';
  if (s.disc) html += '<p class="disc">' + s.disc + '</p>';
  html += '<div class="pageno">' + (i + 1) + ' / ' + S.length + '</div>';
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
