<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Problem-Fixer to Influential Leader — Intentional Leader Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ecf1e8;        /* pale Renogize-green-tinted ground (light scheme, green brand) */
    --panel:#f7faf4;     /* lighter green-white panel */
    --ink:#16243d;       /* their dominant navy */
    --muted:#48566c;
    --rule:#d4ddcf;
    --accent:#0b5b3a;    /* Renogize deep green */
    --accent2:#80c240;   /* Renogize bright green, sparing */
    --display:'Archivo',system-ui,sans-serif;
    --text:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#dfe5da;color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .slide.dark{background:var(--ink)}
  .slide.dark .big,.slide.dark .kicker,.slide.dark .eyebrow{color:#fff}
  .slide.dark .eyebrow{color:var(--accent2)}
  .slide.dark::before{background:var(--accent2)}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.1;margin-bottom:10px}
  .lead{font-size:20px;color:var(--muted);margin-top:20px;max-width:42ch;line-height:1.45}
  p.body{font-size:18px;line-height:1.55;color:var(--ink);margin-top:14px;max-width:52ch}
  .kicker{font-size:17px;color:var(--muted);margin-top:8px;max-width:46ch}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px}
  li{position:relative;padding-left:30px;font-size:18px;line-height:1.45;max-width:54ch}
  li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:3px;
    background:var(--accent2)}
  .step{display:flex;gap:18px;align-items:flex-start;margin-top:18px}
  .step .n{font-family:var(--display);font-weight:800;font-size:22px;color:#fff;background:var(--accent);
    min-width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .step .t{font-size:18px;line-height:1.45}
  .step .t b{font-family:var(--display)}
  .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.1;max-width:20ch}
  .stat{font-family:var(--display);font-weight:800;font-size:72px;color:var(--accent);line-height:1}
  .foot{position:absolute;right:26px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .brandline{position:absolute;left:56px;bottom:20px;font-size:12.5px;color:var(--muted);letter-spacing:.06em;
    font-family:var(--display);font-weight:600}
  .slide.dark .brandline,.slide.dark .foot{color:#9fb0c6}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .cta-row{margin-top:26px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent)}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:380px}h1{font-size:33px}h2{font-size:26px}.stat{font-size:54px}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Sean Olson · Renogize',
   h1:'From Problem-Fixer to Influential Leader',
   lead:'Why the manager who got promoted for solving everything is the one most likely to stall, and the four moves that change it.'},

  {t:'agenda', eyebrow:'The next 60 minutes', h2:'What we will cover',
   list:[
     'Why your best skill quietly became your ceiling',
     'The identity shift under every stalled leader',
     'The Intentional Leader Blueprint, four moves in order',
     'How influence replaces firefighting, day to day'
   ]},

  {t:'who', eyebrow:'Who this is for',
   h2:'If you got promoted because you were the best at fixing things',
   body:'First-time managers, directors, and senior leaders who are great at solving problems and are quietly drowning in them. You keep saying yes, keep untangling, keep being the one who knows. And the higher you go, the less that works.'},

  {t:'trap', eyebrow:'The trap',
   h2:'The skill that got you here is the one holding you back',
   body:'Fixing is addictive. It feels productive, it is visible, and it is how you earned the title. So you keep doing it. But a leader who fixes everything builds a team that brings everything to be fixed. The bottleneck is not your calendar. It is the reflex.'},

  {t:'cost', eyebrow:'The cost of staying a fixer',
   h2:'A team of people waiting for you to decide',
   body:'When you are the answer, your people stop building their own judgment. Work stacks behind your attention. Your best performers leave to go somewhere they get to think. None of it looks like a leadership problem day to day. All of it is one.'},

  {t:'reframe', dark:true, eyebrow:'The reframe',
   big:'You were promoted for fixing. You will be remembered for influence.',
   kicker:'Leadership is not a harder version of your old job. It is a different job.'},

  {t:'section', eyebrow:'Part one', h2:'The real problem is not time. It is identity.',
   body:'You do not have a productivity problem, you have an identity problem. As long as the person who solves it is who you are, delegation feels like losing yourself. Intentional leadership starts by separating your worth from your usefulness as a fixer.'},

  {t:'section', eyebrow:'Part two', h2:'The Intentional Leader Blueprint',
   body:'Four moves, in order. Each one takes you further from the desk you were promoted off of and closer to the leader your team actually needs. We will walk all four.'},

  {t:'steps', eyebrow:'The Blueprint', h2:'Four moves',
   steps:[
     {n:'1', t:'<b>Looking In.</b> See your real strengths and the blind spots your success has hidden. Most leaders run off a flattering, outdated self-image.'},
     {n:'2', t:'<b>Looking Out.</b> Learn how your team actually experiences you, not how you intend to land. The gap between the two is where trust leaks.'},
     {n:'3', t:'<b>Building Up.</b> Practice the behaviors that build trust and make people want to follow you, so problems stop routing through you by default.'},
     {n:'4', t:'<b>Maximizing Influence.</b> Lead beyond your own desk: sideways, upward, and across the organization, where authority runs out and influence takes over.'}
   ]},

  {t:'detail', eyebrow:'Move one · Looking In',
   h2:'You cannot lead from a self-image that is three promotions old',
   body:'The behaviors that made you promotable are not the ones that make you effective now. Looking In is an honest inventory: what you are genuinely great at, what you have been getting away with, and the one fix-it habit that is quietly costing you influence.'},

  {t:'detail', eyebrow:'Move two · Looking Out',
   h2:'How you are read is the only version of you that leads',
   body:'Your intentions are invisible. Your team only has your behavior. Looking Out closes the distance between the leader you believe you are and the leader they describe when you leave the room. That distance is almost always bigger than it feels.'},

  {t:'detail', eyebrow:'Move three · Building Up',
   h2:'Trust is built in the small, repeatable moments',
   body:'Not in the offsite. In how you handle the delegated thing that comes back wrong, the hard conversation you have been avoiding, the credit you give in public. Building Up is the set of behaviors that make people bring you decisions, not just problems.'},

  {t:'detail', eyebrow:'Move four · Maximizing Influence',
   h2:'At the top, you lead people you do not manage',
   body:'Peers, executives, other departments. No title helps you here. Maximizing Influence is how you move things through an organization on credibility and relationship instead of authority, which is the actual job of every senior leader.'},

  {t:'contrast', eyebrow:'Two leaders, same role', h2:'The difference is where the problems go',
   list:[
     'The fixer: every decision routes back to them, and the team gets smaller in their shadow',
     'The intentional leader: decisions route to the person closest to them, and the team gets bigger',
     'Same title. Same hours. Completely different ceiling.'
   ]},

  {t:'proof', eyebrow:'The result in the work',
   stat:'42%',
   body:'of the leaders we coach are promoted during or within a year of the work. Not because they got better at fixing. Because they stopped leading like a fixer and started building influence that compounds.'},

  {t:'why', eyebrow:'Why me',
   h2:'This is the whole of what Renogize does',
   body:'I am Sean Olson. I coach first-time managers through C-suite executives in healthcare, higher education, corporate, and government, using a structured process: Match, Launch, Listen, Plan, Prove. The Intentional Leader Blueprint is the backbone of all of it, and it is the reason this work shows up in promotions, not just in better meetings.'},

  {t:'recap', eyebrow:'The one thing', h2:'Lead on purpose, not on reflex',
   body:'Intentional leadership is simply choosing influence over the fixing reflex, again and again, until it becomes how you lead. Looking In. Looking Out. Building Up. Maximizing Influence. In that order.'},

  {t:'cta', eyebrow:'Your next step',
   h2:'Keep going with the Intentional Leader work',
   body:'If this is the leader you want to become, the next step is a conversation. Book a Coaching Diagnostic with Renogize, or join the next Intentional Leadership Academy cohort, and we will map the specific moves for you.',
   cta:'Book your Coaching Diagnostic at renogize.com',
   disc:'This masterclass is for educational purposes only. It describes leadership development approaches and does not guarantee any specific promotion, income, or business outcome; results vary by individual and organization.'}
];

const deck = document.getElementById('deck');
function esc(x){return x||''}
S.forEach((s, i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.dark ? ' dark':'');
  let inner = '';
  if(s.eyebrow) inner += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.h1) inner += `<h1>${esc(s.h1)}</h1>`;
  if(s.h2) inner += `<h2>${esc(s.h2)}</h2>`;
  if(s.big) inner += `<div class="big">${esc(s.big)}</div>`;
  if(s.stat) inner += `<div class="stat">${esc(s.stat)}</div>`;
  if(s.lead) inner += `<p class="lead">${esc(s.lead)}</p>`;
  if(s.body) inner += `<p class="body">${esc(s.body)}</p>`;
  if(s.kicker) inner += `<p class="kicker">${esc(s.kicker)}</p>`;
  if(s.list){ inner += '<ul>' + s.list.map(x=>`<li>${esc(x)}</li>`).join('') + '</ul>'; }
  if(s.steps){ inner += s.steps.map(st=>`<div class="step"><div class="n">${esc(st.n)}</div><div class="t">${st.t}</div></div>`).join(''); }
  if(s.cta) inner += `<div class="cta-row">${esc(s.cta)}</div>`;
  if(s.disc) inner += `<div class="disc">${esc(s.disc)}</div>`;
  inner += `<div class="brandline">Intentional Leader · Renogize</div>`;
  inner += `<div class="foot">${i+1} / ${S.length}</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
