<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The THRIVE Practice — a masterclass by The THRIVE Dentists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0c0c0e;
    --panel:#17171a;
    --rule:#2a2a2f;
    --ink:#f4f2ec;
    --ink-soft:#c7c4bc;
    --ink-muted:#8d8a83;
    --accent:#ffc800;
    --punch:#ff1385;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;line-height:1.5;overflow:hidden}
  #stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center}
  .slide{display:none;width:min(1040px,92vw);max-height:92vh;overflow:auto;padding:56px 60px;background:var(--panel);border:1px solid var(--rule);border-radius:4px}
  .slide.on{display:block}
  .kicker{font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(34px,5.2vw,64px);line-height:1.02;letter-spacing:-.015em;color:var(--ink)}
  h2{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(26px,3.4vw,40px);line-height:1.08;letter-spacing:-.01em;color:var(--ink);margin-bottom:18px}
  .lede{font-size:clamp(17px,2vw,22px);color:var(--ink-soft);margin-top:18px;max-width:42ch}
  p{font-size:clamp(16px,1.6vw,19px);color:var(--ink-soft);margin-top:14px;max-width:62ch}
  .big{font-size:clamp(22px,2.6vw,30px);color:var(--ink);font-weight:500;line-height:1.3;max-width:40ch}
  ul{list-style:none;margin-top:22px}
  li{position:relative;padding-left:30px;margin:14px 0;font-size:clamp(16px,1.7vw,20px);color:var(--ink-soft);max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:3px;background:var(--accent)}
  .pillarnum{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(44px,7vw,92px);color:var(--punch);line-height:.9;letter-spacing:-.03em}
  .pillarword{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(24px,3vw,38px);color:var(--accent);text-transform:uppercase;letter-spacing:.02em;margin-top:6px}
  .present{margin-top:46px;font-size:15px;color:var(--ink-muted)}
  .present strong{color:var(--ink);font-weight:600}
  .rule{height:3px;width:60px;background:var(--accent);margin:26px 0}
  .disc{margin-top:30px;font-size:13px;color:var(--ink-muted);max-width:66ch;line-height:1.5}
  .cta h1{color:var(--accent)}
  .nav{position:fixed;bottom:18px;right:24px;font-family:'Archivo',sans-serif;font-size:12px;letter-spacing:.1em;color:var(--ink-muted)}
  .brandline{position:fixed;bottom:18px;left:24px;font-family:'Archivo',sans-serif;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
  .brandline b{color:var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandline">THE <b>THRIVE</b> DENTISTS</div>
<div class="nav"><span id="pos">1</span> / <span id="tot">1</span> &nbsp;·&nbsp; use arrow keys</div>
<script>
const S=[
  {t:'title', cls:'', html:`
    <div class="kicker">A Masterclass for Dentists</div>
    <h1>The THRIVE Practice</h1>
    <p class="lede">How to build a seven-figure dental practice that funds the life you actually want, instead of one that owns your calendar.</p>
    <div class="present">Presented by <strong>Dr. Galen &amp; Dr. Davina Detrik</strong> · The THRIVE Dentists · hosts of The Dental &amp; Mental Podcast</div>
  `},
  {t:'audience', cls:'', html:`
    <div class="kicker">Who this is for</div>
    <h2>You are booked solid and still not free</h2>
    <p>You are a good dentist. The schedule is full, the team is busy, the numbers look fine on paper. And yet the practice feels like it owns you, not the other way around.</p>
    <ul>
      <li>You trade clinical hours for income, so the only way up is more chairs, more days, more fatigue.</li>
      <li>You got into dentistry for the craft, but most of your week is production you do not love.</li>
      <li>You keep buying courses and systems, and the life you pictured still has not shown up.</li>
    </ul>
  `},
  {t:'trap', cls:'', html:`
    <div class="kicker">The treadmill</div>
    <h2>"Just do more production"</h2>
    <p class="big">Every default answer in dentistry is a volume answer. See more patients. Add an op. Open Saturdays. Hire an associate to run harder.</p>
    <p>More volume buys you a bigger version of the same trap. The practice grows, and so does the weight it puts on you. That is not freedom. That is a heavier chair.</p>
  `},
  {t:'reframe', cls:'', html:`
    <div class="kicker">The reframe</div>
    <h1>The problem is not your schedule</h1>
    <div class="rule"></div>
    <p class="big">It is that nobody ever designed the practice around your life. It was designed around production, and you have been living inside someone else's blueprint.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="kicker">Part One</div>
    <h2>The "good enough" practice</h2>
    <p>Most practices drift into "good enough." We pander to the crowd, take the cases that pay, and slowly forget the values that put us in the chair in the first place.</p>
    <p class="big">Good enough is the most expensive place in dentistry. It costs you the one thing you cannot buy back: the years.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="kicker">Part Two · The Framework</div>
    <h1>THRIVE</h1>
    <p class="lede">Six pillars we use to redesign a practice around the dentist, not the production target. Build on all six and the practice starts funding the life.</p>
    <ul>
      <li><b style="color:var(--ink)">T</b>ime · <b style="color:var(--ink)">H</b>appiness · <b style="color:var(--ink)">R</b>elevance · <b style="color:var(--ink)">I</b>ncome · <b style="color:var(--ink)">V</b>alue · <b style="color:var(--ink)">E</b>xperiences</li>
    </ul>
  `},
  {t:'pillar', cls:'', html:`
    <div class="pillarnum">01</div><div class="pillarword">Time</div>
    <h2 style="margin-top:14px">Design the week before patients fill it</h2>
    <p>Freedom is a calendar decision, not a revenue decision. We block the life first, the family, the training, the recovery, and let the practice fill what is left. Fewer, higher-value days beat a full week of low-value ones every time.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="pillarnum">02</div><div class="pillarword">Happiness</div>
    <h2 style="margin-top:14px">Stop pandering to the crowd</h2>
    <p>Build the practice around the dentistry you actually love and route away the work that drains you. A dentist who loves the cases in front of them does better work, and patients feel the difference before they ever sit down.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="pillarnum">03</div><div class="pillarword">Relevance</div>
    <h2 style="margin-top:14px">Be sought out, not shopped around</h2>
    <p>Commodity dentists compete on price and proximity. Relevant dentists have a point of view people follow. A voice, a signature, a reason patients drive past three other offices to reach yours. This is why we built The Dental &amp; Mental Podcast.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="pillarnum">04</div><div class="pillarword">Income</div>
    <h2 style="margin-top:14px">Earn on value delivered, not hours logged</h2>
    <p>The ceiling on hourly dentistry is your own stamina. The NVTRO RevGen system rebuilds revenue around the value you create and the cases only you can do, so the practice can reach seven figures without you adding a single extra chair-hour.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="pillarnum">05</div><div class="pillarword">Value</div>
    <h2 style="margin-top:14px">Raise the clinical bar on purpose</h2>
    <p>Better dentistry is worth more and gets referred more. Mastering invisible Class IV and anterior resin artistry, the work we teach inside FRKTR, turns routine restorative into signature cases patients talk about. CE that blows your mind, not your paycheck.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="pillarnum">06</div><div class="pillarword">Experiences</div>
    <h2 style="margin-top:14px">Reinvest in staying in love with it</h2>
    <p>Burnout is what happens when all the reinvestment goes back into overhead and none goes into you. Hands-on residencies, mentorship, and the experiences that remind you why you chose this craft are not a reward for later. They are part of the system.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="kicker">Part Three · The THRIVE week</div>
    <h2>A practice built around your life</h2>
    <ul>
      <li>A week built around your life, with a schedule of fewer, higher-value days.</li>
      <li>A case mix weighted toward the dentistry you love and are known for.</li>
      <li>Revenue that climbs on value and reputation, not on added hours.</li>
      <li>A clear voice in your market, so new patients arrive already sold on you.</li>
    </ul>
  `},
  {t:'why', cls:'', html:`
    <div class="kicker">Why us</div>
    <h2>We built this on ourselves first</h2>
    <p>Drs. Galen &amp; Davina Detrik have been building against the grain in dentistry since 2014. We teach the clinical craft through FRKTR and the WOLFPACK full-arch residency, the business through NVTRO RevGen, and talk about all of it, candidly, every week on The Dental &amp; Mental Podcast.</p>
    <p class="big">The goal was never a bigger practice. It was a practice worth having.</p>
  `},
  {t:'recap', cls:'', html:`
    <div class="kicker">The three shifts</div>
    <h2>If you remember nothing else</h2>
    <ul>
      <li>Design the practice around your life, not your production target.</li>
      <li>Earn on value and relevance, so growth stops costing you hours.</li>
      <li>Keep raising the craft, because better dentistry is the most durable moat you have.</li>
    </ul>
  `},
  {t:'cta', cls:'cta', html:`
    <div class="kicker">Where to start</div>
    <h1>Start Here: NVTRO RevGen</h1>
    <p class="lede">If you want the revenue half of the THRIVE Practice mapped out step by step, NVTRO RevGen, The Revenue Generator, is the on-ramp. Come find it at thethrivedentists.com and start designing a practice that funds your life.</p>
    <div class="present">The THRIVE Dentists · thethrivedentists.com · The Dental &amp; Mental Podcast</div>
    <div class="disc">Educational only. No income, role, or result is guaranteed. Outcomes vary and depend on your market, your effort, your clinical and business execution, and factors outside anyone's control. Nothing here is financial, legal, or clinical advice.</div>
  `}
];
const stage=document.getElementById('stage');
stage.innerHTML=S.map((s,i)=>`<section class="slide ${s.cls} ${i===0?'on':''}" data-i="${i}">${s.html}</section>`).join('');
let cur=0;const slides=[...document.querySelectorAll('.slide')];
document.getElementById('tot').textContent=S.length;
function go(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((el,i)=>el.classList.toggle('on',i===cur));document.getElementById('pos').textContent=cur+1}
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}if(e.key==='Home')go(0);if(e.key==='End')go(S.length-1)});
stage.addEventListener('click',()=>go(cur+1));
</script>
</body>
</html>
