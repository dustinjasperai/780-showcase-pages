<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do Less, Achieve More — a masterclass with Krzysztof Litwiński</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcf5e6;        /* soft amber-cream ground, derived from his signature amber #ffb629 */
    --panel:#fffdf8;      /* warm white panel */
    --accent:#ffb629;    /* his dominant brand amber (## Palette top-ranked) */
    --ink:#3c3837;        /* his dominant warm near-black */
    --muted:#6f6a67;
    --blue:#009ad7;       /* his H1/button sky blue, used sparingly */
    --display:'Comfortaa',sans-serif;
    --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border-radius:14px;padding:56px 56px;margin:0 0 26px;
    box-shadow:0 1px 2px rgba(60,56,55,.06),0 10px 30px rgba(60,56,55,.05);min-height:420px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.12;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.18;margin-bottom:16px}
  .lead{font-size:20px;color:var(--muted);max-width:60ch}
  p{font-size:18px;margin-bottom:12px;max-width:62ch}
  .big{font-size:26px;line-height:1.35;font-weight:400}
  ul{list-style:none;margin-top:10px}
  li{font-size:18px;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid #efe9df;max-width:62ch}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:3px;background:var(--accent);border-radius:2px}
  li b{font-family:var(--display);font-weight:700}
  .mark{color:var(--ink);box-shadow:inset 0 -12px 0 rgba(255,182,41,.35)}
  .part{min-height:300px;justify-content:center}
  .part h2{font-size:40px}
  .part .num{font-family:var(--display);font-weight:700;font-size:15px;color:var(--blue);letter-spacing:.14em;margin-bottom:10px}
  .credit{display:grid;grid-template-columns:1fr 1fr;gap:14px 34px;margin-top:8px}
  .credit div{font-size:17px;padding:10px 0 10px 32px;position:relative;border-bottom:1px solid #efe9df}
  .credit div::before{content:"";position:absolute;left:0;top:17px;width:14px;height:3px;background:var(--accent);border-radius:2px}
  .cta h1{font-size:40px}
  .cta .step{font-size:22px;margin:8px 0 22px}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:66ch;line-height:1.5}
  .foot{position:absolute;right:26px;bottom:18px;font-family:var(--display);font-size:12px;color:#c9c0b2;letter-spacing:.08em}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:32px}h2{font-size:26px}.credit{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    k:'Masterclass z Krzysztofem Litwińskim',
    h:'Do Less, Achieve More',
    lead:'How ambitious professionals produce their best work in fewer hours, with less stress and more life. Jak robiąc mniej osiągać więcej.'},

  {t:'for', k:'Who this is for',
    h:'You are winning on paper. And paying for it.',
    lead:'For entrepreneurs, leaders and managers who are good at what they do, carrying more every quarter, and quietly wondering when the life they are working for actually starts.'},

  {t:'bullets', k:'The trap', h:'The hustle lie',
    lead:'Everything around you says the answer to being stretched is to push harder.',
    items:[
      '<b>More hours.</b> So the calendar fills until there is nothing left of the day for you.',
      '<b>More effort.</b> So you end up exhausted and still behind on the things that matter.',
      '<b>More willpower.</b> So when it runs out, you blame yourself instead of the method.']},

  {t:'bullets', k:'The reframe', h:'Doing more is why you are stuck',
    lead:'Your problem was never that you do too little. It is that nobody taught you to perform.',
    items:[
      'Effort is not a strategy. Volume hides the few things that actually move your life.',
      'High performers are not the busiest people in the room. They are the clearest.',
      'Subtraction comes before addition. You get your life back by removing, not adding.']},

  {t:'part', num:'Part One', h:'Performance is a method, not a volume'},

  {t:'bullets', k:'The core problem', h:'Three traps that keep good people busy and stuck',
    items:[
      '<b>The thinking trap.</b> You keep planning, reading and preparing, and never quite cross into action.',
      '<b>The proving trap.</b> You say yes to everything because your worth is tied to output.',
      '<b>The autopilot trap.</b> You run an outdated version of yourself that fit a life you have already outgrown.']},

  {t:'bullets', k:'Why motivation fails', h:'Motivation is not the lever',
    lead:'Waiting to feel ready is the most expensive habit there is.',
    items:[
      'Motivation shows up after you move, not before. The method creates the movement.',
      'Clarity on what you actually want does more than any productivity hack.',
      'When the priorities are right, discipline stops feeling like a fight.']},

  {t:'part', num:'Part Two', h:'The method: 1-1 Discovery and the areas of your life'},

  {t:'bullets', k:'Step one', h:'1-1 Discovery: find what actually matters',
    lead:'Before you optimise anything, you diagnose. This is the work that normally takes people years on their own.',
    items:[
      '<b>Diagnose your real priorities</b> so your days stop being driven by other people’s urgencies.',
      '<b>Surface the hidden opportunities</b> already sitting inside your work and your relationships.',
      '<b>Make the life corrections</b> that change the trajectory, not just the week.']},

  {t:'bullets', k:'The shift', h:'From thinking to action',
    lead:'The gap between the person you are and the person you want to be is almost always a gap of action, not knowledge.',
    items:[
      'Decide once, at the level of identity, so you are not re-deciding every morning.',
      'Shrink the first step until it is too small to avoid.',
      'Protect the few hours that carry the week, and let the rest be ordinary.']},

  {t:'bullets', k:'The whole picture', h:'The seven areas of a developed life',
    lead:'High performance is not one heroic area carrying all the others. It is balance across the areas that make a life.',
    items:[
      'Energy and health, so you have something to perform with.',
      'Focus and work, so your best hours go to your best work.',
      'Relationships and meaning, so success is not something you enjoy alone.']},

  {t:'bullets', k:'The confidence engine', h:'Confidence is built, not born',
    lead:'Confidence is a skill with concrete steps, not a personality you were or were not given.',
    items:[
      '<b>Quick wins</b> that strengthen confidence in the moment when you need it.',
      '<b>Ten concrete steps</b> that build the kind of confidence that lasts.',
      '<b>A daily question sheet</b> at the start and end of the day, so the method becomes a habit.']},

  {t:'statement', k:'The core idea',
    big:'You do not get your life back by managing time better. You get it back by <span class="mark">doing less of what never mattered</span>, so your best energy goes to what does.'},

  {t:'part', num:'Part Three', h:'The best period of your life'},

  {t:'bullets', k:'The arc', h:'Where this takes you',
    items:[
      'You understand what you truly want, then move from thinking to doing.',
      'You find a steadier inner calm, and change starts to accelerate.',
      'You reclaim your life and your relationships, and begin the best period of your life.']},

  {t:'bullets', k:'A week on the method', h:'An ordinary week, run differently',
    lead:'Not a louder life. A clearer one.',
    items:[
      'Monday starts from priorities you chose, not an inbox that chose for you.',
      'The hard thing gets your first hour, while you still have the energy for it.',
      'You finish the week with proof you moved, and an evening that is actually yours.']},

  {t:'credit', k:'Why me', h:'Who is teaching this',
    items:[
      'Poland’s first Certified High Performance Coach™',
      'Former interpreter for US presidents and UK prime ministers',
      'A working partnership with Brian Tracy',
      'Founder of a 30-school teaching network',
      'The 1-1 Discovery™ mentoring process',
      'Akademia Osobistego Mistrzostwa: 170+ hours of training']},

  {t:'bullets', k:'Honest fit', h:'Who this is and is not for',
    items:[
      '<b>For you</b> if you are already capable and simply done paying for success with your life.',
      '<b>For you</b> if you want a method and a mentor, not another motivational high.',
      '<b>Not for you</b> if you are looking for a shortcut that skips the honest diagnosis.']},

  {t:'statement', k:'The promise',
    big:'Fewer hours. Less noise. More of the output and the life you have been working this hard for. That is what <span class="mark">doing less, better</span> is for.'},

  {t:'cta', h:'Start with a 1-1 Discovery session',
    step:'Book a private strategic mentoring session with Krzysztof, or join the Akademia Osobistego Mistrzostwa to go deeper at your own pace.',
    disc:'Educational content only. This masterclass shares a method and a point of view; it is not advice for your specific situation. No specific result is guaranteed. Results vary from person to person and depend on your own circumstances and effort.'}
];

const deck = document.getElementById('deck');
function esc(s){return s;}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='part'?'part ':'')+(s.t==='cta'?'cta ':'');
  let html='';
  if(s.k) html+='<div class="kicker">'+esc(s.k)+'</div>';
  if(s.t==='title'){ html+='<h1>'+esc(s.h)+'</h1>'; if(s.lead)html+='<p class="lead">'+esc(s.lead)+'</p>'; }
  else if(s.t==='part'){ html='<div class="num">'+esc(s.num)+'</div><h2>'+esc(s.h)+'</h2>'; }
  else if(s.t==='statement'){ html+='<p class="big">'+s.big+'</p>'; }
  else if(s.t==='credit'){ html+='<h2>'+esc(s.h)+'</h2><div class="credit">'+s.items.map(x=>'<div>'+x+'</div>').join('')+'</div>'; }
  else if(s.t==='cta'){ html+='<h1>'+esc(s.h)+'</h1><p class="step">'+esc(s.step)+'</p><p class="disc">'+esc(s.disc)+'</p>'; }
  else { html+='<h2>'+esc(s.h)+'</h2>'; if(s.lead)html+='<p class="lead">'+esc(s.lead)+'</p>'; if(s.items)html+='<ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  html+='<div class="foot">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
