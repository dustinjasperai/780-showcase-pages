<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Success Is a SYSTEM · Dr. Mark Sanna · Breakthrough Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;600;700;800&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#145665; --panel:#1D6472; --rule:#2E7381;
    --orange:#dc5637; --teal:#7FC6CF; --chalk:#F8F4EC; --grey:#BCD3D6; --dim:#7FA6AD;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Hanken Grotesk',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .disp{font-family:'Alegreya',Georgia,serif}
  .kicker{font-family:'Hanken Grotesk',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);margin-bottom:2.4vh}
  h1{font-family:'Alegreya',Georgia,serif;font-weight:700;color:var(--chalk);line-height:1.12;letter-spacing:-.01em}
  .t-title h1{font-size:5.2vw}
  .t-normal h1{font-size:3.4vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.5;font-weight:300}
  .sub{font-size:1.85vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.44;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Hanken Grotesk',sans-serif;font-size:1.4vw;font-weight:600;color:var(--teal);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--orange),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1D6472 0%,#0A3540 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:86%;font-weight:600;color:#EFF6F5}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:3vw;text-align:center;margin-bottom:4.6vh}
  .flowrow{display:flex;gap:1.1vw;justify-content:center;flex-wrap:wrap}
  .flowcard{background:var(--panel);border:1px solid var(--rule);border-radius:.7vw;padding:2.4vh 1.3vw;width:13vw;min-height:15vh;display:flex;flex-direction:column;gap:1vh}
  .flowcard .n{font-family:'Alegreya',serif;font-size:2vw;font-weight:700;color:var(--orange);line-height:1}
  .flowcard .l{font-size:1.16vw;font-weight:500;color:var(--chalk);line-height:1.25}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#20707F 0%,#0A3540 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.2vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--orange);color:#F6C8B9;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .frames{position:absolute;pointer-events:none;opacity:.9}
  .title-frames{right:7%;bottom:8%;width:25vw}
  .corner-frames{right:6%;bottom:7.5%;width:11vw;opacity:.5}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--orange);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--orange);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}.t-flow h1{font-size:5vw}
    .flowcard{width:26vw}.flowcard .n{font-size:4vw}.flowcard .l{font-size:2.3vw}.t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 24</div>
<div class="brand-foot">Breakthrough Coaching</div>
<div class="hint" id="hint">→ click or arrow keys</div>

<!-- System Blueprint motif: eight pillars filling in, one by one -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="frames" viewBox="0 0 260 150">
  <g fill="none" stroke-linecap="round">
    <!-- blueprint baseline -->
    <line x1="26" y1="128" x2="234" y2="128" stroke="#BCD3D6" stroke-width="1.8" opacity="0.5"/>
    <!-- faint blueprint grid -->
    <line x1="26" y1="96" x2="234" y2="96" stroke="#BCD3D6" stroke-width="0.8" opacity="0.18"/>
    <line x1="26" y1="64" x2="234" y2="64" stroke="#BCD3D6" stroke-width="0.8" opacity="0.18"/>
    <!-- eight pillars: three filled (built systems), five outlined (waiting) -->
    <rect x="30"  y="72" width="18" height="56" fill="#dc5637" stroke="none"/>
    <rect x="56"  y="56" width="18" height="72" fill="#dc5637" stroke="none" opacity="0.85"/>
    <rect x="82"  y="84" width="18" height="44" fill="none" stroke="#BCD3D6" stroke-width="1.6" opacity="0.55"/>
    <rect x="108" y="48" width="18" height="80" fill="#dc5637" stroke="none" opacity="0.7"/>
    <rect x="134" y="76" width="18" height="52" fill="none" stroke="#BCD3D6" stroke-width="1.6" opacity="0.55"/>
    <rect x="160" y="60" width="18" height="68" fill="none" stroke="#BCD3D6" stroke-width="1.6" opacity="0.55"/>
    <rect x="186" y="88" width="18" height="40" fill="none" stroke="#BCD3D6" stroke-width="1.6" opacity="0.55"/>
    <rect x="212" y="40" width="18" height="88" fill="none" stroke="#7FC6CF" stroke-width="1.6" opacity="0.7"/>
    <!-- roofline the pillars carry -->
    <line x1="26" y1="34" x2="234" y2="34" stroke="#7FC6CF" stroke-width="1.4" opacity="0.4" stroke-dasharray="5 5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Success Is a SYSTEM',sub:'The Breakthrough Method behind high-performing chiropractic and multidisciplinary practices. Twenty years of coaching, distilled into the eight systems your practice runs on.',brand:true,frames:'title'},
 {t:'normal',k:'Who this is for',title:'Practice owners who are the busiest person in their own building.',body:'Chiropractors and multidisciplinary owners whose numbers still depend on their personal energy, memory, and hours.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'These systems come from twenty years of coaching real practices. What they produce in yours depends on how you run them.',disc:'Educational content only. Nothing in this session is a promise of income or practice results. Outcomes vary by practice.'},
 {t:'normal',k:'Who’s teaching this',title:'Dr. Mark Sanna, the coach who bought the company he believed in.',body:'President and CEO of Breakthrough Coaching for about twenty years. Member of the ACA Governor’s Advisory Board. Author of Cracking the Code: Marketing Chiropractic. He joined BTC as a member first.'},

 {t:'section',idx:'Part One',title:'Why Success Is a System'},
 {t:'dark',title:'We believe success is a SYSTEM. Not a personality, not luck, and not more hours.'},
 {t:'normal',k:'The plateau',title:'Most practices grow to the edge of the doctor’s energy, then stop.',body:'Not because the care got worse. Because everything important still lives in one person’s head.'},
 {t:'normal',k:'The shift',title:'High-performing practices run on procedures, not heroics.',body:'The owner’s job moves from doing everything to owning a set of systems any trained team member can run.'},
 {t:'flow',k:'The blueprint',title:'The eight systems every practice stands on',items:[
   {n:'01',l:'Case Management'},{n:'02',l:'Documentation'},{n:'03',l:'Coding'},{n:'04',l:'Compliance'},
   {n:'05',l:'Financial Procedures'},{n:'06',l:'Marketing'},{n:'07',l:'Office Communication'},{n:'08',l:'Efficiency'}]},

 {t:'section',idx:'Part Two',title:'The Eight Systems, Up Close'},
 {t:'normal',k:'System 01 · Case management',title:'A patient journey that is planned, not improvised.',body:'From the day-one report to reactivation: every visit has a purpose the whole team can explain in one sentence.'},
 {t:'normal',k:'System 02 · Documentation',title:'If it is not documented, it did not happen.',body:'Notes that support the care you actually gave, protect the practice, and stand up to any review.'},
 {t:'normal',k:'System 03 · Coding',title:'Code what you did. All of it, correctly.',body:'Most practices lose earned revenue by guessing. A coding system removes the guessing, in both directions.'},
 {t:'normal',k:'System 04 · Compliance',title:'Compliance is a foundation, not a fear tactic.',body:'Run it right, legally and ethically, and the practice stops flinching every time the rules change.'},
 {t:'normal',k:'System 05 · Financial procedures',title:'Money follows procedure.',body:'Fee systems, collections handled at the desk, and reporting the owner actually reads. Every week, the same way.'},
 {t:'normal',k:'System 06 · Marketing',title:'Marketing as an implementation packet, not an inspiration.',body:'Turnkey campaigns the team executes on a calendar, instead of ideas the doctor gets around to.'},
 {t:'normal',k:'System 07 · Office communication',title:'The daily huddle is where systems become culture.',body:'Templates for team huddles, scripts for the front desk, one language for the whole office.'},
 {t:'normal',k:'System 08 · Efficiency',title:'Job descriptions, daily routines, and a practice that runs on time.',body:'When every role is written down, hiring, training, and even vacations stop being emergencies.'},
 {t:'normal',k:'The payoff',title:'You deserve balance: passionate AND profitable.',body:'The point of the systems is not more work. It is a practice that performs without consuming its owner.'},

 {t:'section',idx:'Part Three',title:'How Deep It Goes, and What Comes Next'},
 {t:'normal',k:'The curriculum',title:'A proprietary 150 Module Curriculum, built over twenty years.',body:'Every system in this session goes deeper: modules, downloadable forms, and turnkey procedures for the whole team.'},
 {t:'normal',k:'The coaching and the room',title:'Coaches are resource multipliers, and the right room raises your ceiling.',body:'Every Breakthrough coach ran these systems as a member first, like a board of advisors for your practice. Bi-annual BTC Elite Retreats add peer Forums, because the fastest fix is often another owner who already solved it.'},
 {t:'normal',k:'Your practice, diagnosed',title:'The Practice Analysis Survey scores you against all eight systems.',body:'A short, structured look at where your numbers say the weakest system is hiding, then a free coaching call where a coach walks your results and names the first system worth fixing.'},
 {t:'cta',title:'Take the Practice Analysis Survey.',chips:['Take the Practice Analysis Survey','Book your free coaching call'],disc:'Educational session. No income claims, no pricing discussed. Results vary by practice.'},
];

const deck=document.getElementById('deck');
function frames(kind){return `<svg class="frames ${kind==='title'?'title-frames':'corner-frames'}"><use href="#frames"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx disp">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Breakthrough <b>Coaching</b> · Dr. Mark Sanna</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.frames) h+=frames(s.frames);
  else if(s.t==='title') h+=frames('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
