<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Anti-Social Scale — Holly Marie Haynes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf3f1;        /* blush off-white, derived from her dominant coral #e08d9f */
    --panel:#fffdfc;
    --rule:#eaddd9;
    --ink:#2a2320;
    --muted:#6f655e;
    --accent:#e08d9f;    /* her dominant brand coral (brand.json, 43 uses) */
    --teal:#0fb5b9;      /* her secondary brand teal, used sparingly */
    --serif:"Fraunces",Georgia,serif;
    --sans:"Montserrat",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:60px 58px;margin:0 0 26px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  .sub{font-family:var(--serif);font-weight:400;font-size:26px;color:var(--muted);margin-top:18px;line-height:1.3}
  p.lead{font-size:19px;line-height:1.6;color:var(--ink);margin-top:20px;max-width:40em}
  p.note{font-size:16px;line-height:1.6;color:var(--muted);margin-top:16px;max-width:42em}
  .divider h2{font-size:46px}
  .divider .num{font-family:var(--serif);font-size:20px;color:var(--accent);font-weight:600;margin-bottom:10px}
  ul{margin-top:22px;list-style:none}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pillar .tag{display:inline-block;font-family:var(--sans);font-weight:600;font-size:14px;color:#fff;
    background:var(--accent);border-radius:999px;padding:6px 14px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:28px}
  .cell{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:16px 12px;text-align:center}
  .cell .d{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--teal);letter-spacing:.08em;text-transform:uppercase}
  .cell .w{font-family:var(--serif);font-size:18px;margin-top:8px}
  .cred{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px}
  .cred div{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:20px}
  .cred .k{font-family:var(--serif);font-size:30px;color:var(--accent);font-weight:700}
  .cred .v{font-size:15px;color:var(--muted);margin-top:6px}
  .cta{background:var(--accent);color:#fff;border:none}
  .cta .eyebrow{color:rgba(255,255,255,.85)}
  .cta h2{color:#fff}
  .cta p.lead{color:rgba(255,255,255,.95)}
  .cta .btn{display:inline-block;margin-top:26px;background:#fff;color:var(--ink);font-weight:600;
    font-family:var(--sans);padding:16px 30px;border-radius:999px;font-size:17px}
  .disclaimer{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:26px;max-width:44em;line-height:1.5}
  .pgnum{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:30px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND="Anti-Social School";
const S=[
  {t:'title',eyebrow:'A live masterclass with Holly Marie Haynes',
    h1:'The Anti-Social Scale',
    sub:'How to grow a profitable business without living on social media.'},

  {t:'promise',eyebrow:'What you will walk away with',
    h2:'One hour from now',
    lead:'A clear picture of the system that brings new clients to your door through email, search, and AI, so your business sells whether or not you ever open the app again.',
    bullets:['Why posting more quietly caps your growth','The four shifts that replace the algorithm','What a week looks like when the business runs on systems, not scrolling']},

  {t:'who',eyebrow:'Who this is for',
    h2:'You already have a real business',
    lead:'Revenue is coming in. Clients are happy. But growth still feels tied to how often you show up on an app you are tired of.',
    bullets:['You are past the startup scramble','You want more clients without more posting','You suspect there is a calmer way to scale, and you are right']},

  {t:'trap',eyebrow:'The trap',
    h2:'You were handed the wrong blueprint',
    lead:'Show up daily. Feed the feed. Chase the trend. It was never built for a woman running a business and a life at the same time, and it quietly turns your growth into a second full-time job.'},

  {t:'hook',eyebrow:'The reframe',
    h2:'The algorithm rents you an audience you will never own',
    lead:'Stop paying rent for one day and the reach disappears. The businesses that scale calmly do the opposite: they build assets they own, that keep working while they sleep.'},

  {t:'divider',num:'Part One',h2:'Why social-dependent growth keeps you stuck'},

  {t:'problem',eyebrow:'The real cost',
    h2:'Three things daily posting quietly takes',
    bullets:['Your time: hours a day that never compound','Your stability: one algorithm change and the pipeline dries up','Your energy: the burnout that makes you want to quit the thing you love']},

  {t:'turn',eyebrow:'The question',
    h2:'What if the business sold without you posting',
    lead:'Not less marketing. Different marketing. Channels you control, that find the people already searching for what you do, and warm them up on autopilot.'},

  {t:'divider',num:'Part Two',h2:'The Anti-Social Shift: the four pillars'},

  {t:'pillar',tag:'Pillar One',h2:'Email over algorithm',
    lead:'Your list is the one audience no platform can take from you. We build a simple nurture that turns a new subscriber into a buyer, on your schedule, not the feed’s.'},

  {t:'pillar',tag:'Pillar Two',h2:'Search over scrolling',
    lead:'People do not scroll to find a solution, they search for one. Positioning your offers for search and AI answers puts you in front of buyers at the exact moment they want you.'},

  {t:'pillar',tag:'Pillar Three',h2:'AI as leverage, you as the human',
    lead:'AI does the heavy lifting on content and systems so you do not have to. Your voice and your judgment stay yours. The robot drafts, you decide.'},

  {t:'pillar',tag:'Pillar Four',h2:'Offers over output',
    lead:'More posts is not the answer. The right offers, stacked so each one leads to the next, is. We map the income you can build from the knowledge you already have.'},

  {t:'system',eyebrow:'How they fit together',
    h2:'A business you can run in about 8 hours a week',
    lead:'The four pillars become one repeatable weekly rhythm. Here is the shape of a CEO week when the systems carry the load.',
    grid:[['Mon','Offers'],['Tue','Email'],['Wed','Search'],['Thu','AI content'],['Fri','Off']]},

  {t:'divider',num:'Part Three',h2:'The anti-social week in practice'},

  {t:'picture',eyebrow:'The shift in practice',
    h2:'From content machine to calm CEO',
    bullets:['New clients arrive through email and search, not a viral reel','Your week has a plan you repeat, not a feed you chase','The business keeps selling on the weeks you log off entirely']},

  {t:'cred',eyebrow:'Why learn this from me',
    h2:'I built my business the anti-social way',
    cred:[['22 yrs','in corporate strategy before 2020'],['7 figures','on fewer than 5,000 email subscribers'],['1,000+','women entrepreneurs helped'],['< 1 hr','a week of my own time on social']]},

  {t:'recap',eyebrow:'The whole method on one page',
    h2:'The Anti-Social Shift',
    bullets:['Email over algorithm','Search over scrolling','AI as leverage, you as the human','Offers over output']},

  {t:'cta',eyebrow:'Your next step',
    h2:'Ready to scale the anti-social way?',
    lead:'If this is the way you want to grow, come work with me. I will help you build the system, custom to your business, so your marketing works when you are not working.',
    btn:'Work with Holly',
    disclaimer:'This masterclass is for educational purposes only. It is not a guarantee of income or results. Every business is different and your results will depend on your own effort, market, and offers. Nothing here should be taken as financial advice.'}
];

function slideHTML(s,i){
  const pg='<div class="pgnum">'+(i+1)+' / '+S.length+'</div>';
  if(s.t==='title')
    return '<section class="slide"><div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.h1+'</h1><div class="sub">'+s.sub+'</div>'+pg+'</section>';
  if(s.t==='divider')
    return '<section class="slide divider"><div class="num">'+s.num+'</div><h2>'+s.h2+'</h2>'+pg+'</section>';
  if(s.t==='pillar')
    return '<section class="slide pillar"><span class="tag">'+s.tag+'</span><h2>'+s.h2+'</h2><p class="lead">'+s.lead+'</p>'+pg+'</section>';
  if(s.t==='system'){
    let g='<div class="grid">'+s.grid.map(c=>'<div class="cell"><div class="d">'+c[0]+'</div><div class="w">'+c[1]+'</div></div>').join('')+'</div>';
    return '<section class="slide"><div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.h2+'</h2><p class="lead">'+s.lead+'</p>'+g+pg+'</section>';
  }
  if(s.t==='cred'){
    let c='<div class="cred">'+s.cred.map(x=>'<div><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>').join('')+'</div>';
    return '<section class="slide"><div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.h2+'</h2>'+c+pg+'</section>';
  }
  if(s.t==='cta')
    return '<section class="slide cta"><div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.h2+'</h2><p class="lead">'+s.lead+'</p><span class="btn">'+s.btn+'</span><div class="disclaimer">'+s.disclaimer+'</div>'+pg+'</section>';
  // generic: eyebrow + h2 + optional lead + optional bullets
  let html='<section class="slide"><div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.h2+'</h2>';
  if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
  if(s.bullets) html+='<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>';
  html+=pg+'</section>';
  return html;
}
document.getElementById('deck').innerHTML=S.map(slideHTML).join('');
</script>
</body>
</html>
