<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Business of Web Design — a masterclass with Josh Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f9fb; --panel:#ffffff; --ink:#21252f; --ink2:#414e60;
    --rule:#e4e7ec; --accent:#90c922;
    --head:'Poppins',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:8vh 7vw;position:relative;border-bottom:1px solid var(--rule)}
  .kicker{font-family:var(--head);font-weight:700;font-size:14px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(38px,6vw,72px);line-height:1.05;
    letter-spacing:-.015em;color:var(--ink)}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(30px,4.4vw,50px);line-height:1.1;
    letter-spacing:-.01em;color:var(--ink)}
  .accent{color:var(--accent)}
  .sub{font-size:clamp(19px,2.2vw,26px);line-height:1.5;color:var(--ink2);margin-top:26px;max-width:40ch}
  .lead{font-size:clamp(20px,2.4vw,30px);line-height:1.5;color:var(--ink2);margin-top:22px;max-width:34ch}
  .rulebar{width:74px;height:5px;border-radius:3px;background:var(--accent);margin:34px 0 0}
  ul{margin-top:30px;list-style:none;max-width:42ch}
  li{font-size:clamp(18px,2vw,23px);line-height:1.45;color:var(--ink2);padding-left:34px;
    position:relative;margin-bottom:20px}
  li::before{content:"";position:absolute;left:0;top:.55em;width:14px;height:14px;border-radius:4px;
    border:2.5px solid var(--accent)}
  .big{font-family:var(--head);font-weight:700;font-size:clamp(60px,12vw,150px);line-height:1;color:var(--ink)}
  .ghost{color:transparent;-webkit-text-stroke:2px #c3c8d0}
  .part-no{font-family:var(--head);font-weight:700;font-size:clamp(60px,12vw,140px);color:var(--accent);line-height:.9}
  .cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
  .c{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:30px 26px}
  .c h3{font-family:var(--head);font-weight:600;font-size:24px;color:var(--ink);margin-bottom:10px}
  .c p{font-size:17px;line-height:1.45;color:var(--ink2)}
  .c .n{font-family:var(--head);font-weight:700;color:var(--accent);font-size:18px;letter-spacing:.14em}
  .foot{position:absolute;left:7vw;bottom:4vh;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:#98a0ad;font-family:var(--head);font-weight:600}
  .pg{position:absolute;right:7vw;bottom:4vh;font-size:13px;color:#98a0ad;font-family:var(--head);font-weight:600}
  .present{margin-top:40px;font-family:var(--head);font-weight:600;font-size:19px;color:var(--ink)}
  .present span{color:var(--ink2);font-weight:500}
  .disc{margin-top:34px;font-size:14px;line-height:1.5;color:#98a0ad;max-width:52ch}
  .cta-note{margin-top:26px;font-size:clamp(19px,2.1vw,25px);color:var(--ink2);max-width:40ch;line-height:1.5}
  @media (max-width:720px){.cardgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass · Web Designer Pro®',
   h:'The Business of <span class="accent">Web Design</span>',
   lead:'How to turn design skills into a business that pays you every month, not just when the next project lands.',
   present:'Josh Hall <span>· Web Designer Pro®</span>'},

  {t:'who', k:'Who this is for',
   h:'You can build almost anything.',
   sub:'Custom sites, redesigns, whole brands. The craft is not the problem. This hour is for the designer who does great work and still wonders why every month starts back at zero.'},

  {t:'trap', k:'The trap',
   h:'Great work, quiet months.',
   sub:'You finish a project, you get paid, and then the pipeline is empty again. The better you get at designing, the more time the work takes, and the ceiling never moves.'},

  {t:'reframe', k:'The real problem',
   h:'It was never your <span class="accent">design skill</span>.',
   sub:'You have been running a freelance hustle, one project at a time. What you have not built yet is a business, something that keeps paying you between projects.'},

  {t:'part', no:'01', h:'Why talent is not the bottleneck',
   sub:'Three things quietly cap a talented designer, and none of them are about design.'},

  {t:'content', k:'Bottleneck one', h:'Project income resets to zero.',
   sub:'One-off projects mean you are only ever as stable as your last invoice. Feast, then famine, then feast again. The work is real, the income is not durable.'},

  {t:'content', k:'Bottleneck two', h:'Hourly pricing caps you at your calendar.',
   sub:'When you sell hours, your income is limited by the number of hours in a week. You can raise your rate, but you cannot add days, so growth quietly stalls.'},

  {t:'part', no:'02', h:'The three C\'s',
   sub:'The model I built Web Designer Pro on. Skills, people, and guidance, working together instead of one at a time.'},

  {t:'content', k:'The three C\'s',
   h:'One business, three engines.',
   grid:[
     {n:'C 1',h:'Courses',p:'Skills that compound. Learn the pieces once and reuse them on every client, so your time is worth more each year.'},
     {n:'C 2',h:'Community',p:'Recurring revenue and retention. A membership keeps paying you every month and keeps people learning long after a course ends.'},
     {n:'C 3',h:'Coaching',p:'The accountability that actually moves you. Direct guidance turns knowing what to do into doing it.'}
   ]},

  {t:'content', k:'The shift', h:'From one-off projects to <span class="accent">recurring income</span>.',
   sub:'Care plans, retainers, memberships. The same skills, arranged so clients pay you every month for ongoing value instead of once for a finished file.'},

  {t:'content', k:'Pricing', h:'Sell the outcome, not the hours.',
   sub:'A website is worth what it does for the client\'s business, not how long it took you. When you price the result, one project can be worth what five used to be.'},

  {t:'content', k:'The plan', h:'A goal you can actually hit.',
   sub:'Set a real revenue number. Separate net from gross. Break it into rocks, stones, and boulders. Price to match the goal, then measure at set points so you know if you are on track.'},

  {t:'part', no:'03', h:'What a real web design business looks like',
   sub:'Not busier. Steadier. The month is predictable before it starts.'},

  {t:'content', k:'A week in it', h:'Predictable, not frantic.',
   sub:'Monthly income arrives before you take on a single new project. New work stacks on top of a base that is already covering the bills, so you choose clients instead of chasing them.'},

  {t:'why', k:'Why listen to me',
   h:'I did the hustle first.',
   sub:'I built a web design studio over about a decade and sold it in 2020. Since then I have coached web designers full time and grown Web Designer Pro into a community of hundreds of members, all working on the exact shift in this class.'},

  {t:'content', k:'How it compounds', h:'You do not have to do it alone.',
   sub:'Inside the community, designers share what is working, guest experts teach the parts I do not, and momentum becomes normal because everyone around you is moving too.'},

  {t:'content', k:'The recap', h:'Three C\'s, one shift.',
   ul:['Stop selling hours, start selling outcomes','Turn projects into recurring monthly income','Let courses, community, and coaching carry you together','Run to a revenue goal you can measure']},

  {t:'content', k:'Your first step', h:'Pick one thing and change it this week.',
   sub:'Reprice your next proposal around the outcome. Offer one client a monthly care plan. Small moves, made on purpose, are how the freelance hustle becomes a business.'},

  {t:'cta', k:'Come build with us',
   h:'Build the business, not just the sites.',
   note:'If you want the full path, the courses, the community, and coaching with me, that is exactly what Web Designer Pro is built for. Come join us and let\'s build your web design business together.',
   present:'Josh Hall <span>· webdesignerpro.com</span>',
   disc:'For education only. No specific result or income is guaranteed. Results vary and depend on your own work, skills, offers, and market.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.k) inner += `<div class="kicker">${s.k}</div>`;
  if (s.no) inner += `<div class="part-no">${s.no}</div>`;
  if (s.h) inner += (s.t === 'part' || s.t === 'title' || s.t === 'reframe' || s.t === 'cta')
    ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`;
  if (s.lead) inner += `<div class="lead">${s.lead}</div>`;
  if (s.sub) inner += `<div class="sub">${s.sub}</div>`;
  if (s.grid){
    inner += '<div class="cardgrid">' + s.grid.map(c =>
      `<div class="c"><div class="n">${c.n}</div><h3>${c.h}</h3><p>${c.p}</p></div>`).join('') + '</div>';
  }
  if (s.ul){ inner += '<ul>' + s.ul.map(x => `<li>${x}</li>`).join('') + '</ul>'; }
  if (s.note) inner += `<div class="cta-note">${s.note}</div>`;
  if (s.t === 'title' || s.t === 'part' || s.t === 'reframe') inner += `<div class="rulebar"></div>`;
  if (s.present) inner += `<div class="present">${s.present}</div>`;
  if (s.disc) inner += `<div class="disc">${s.disc}</div>`;
  inner += `<div class="foot">The Business of Web Design</div><div class="pg">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
