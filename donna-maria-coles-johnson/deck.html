<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Maker to Lifestyle CEO — a masterclass with Donna Maria Coles Johnson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4f8; --panel:#ffffff; --panel2:#efe8f0;
    --ink:#342f69; --muted:#6f6a86; --rule:#e4dced; --accent:#a31470;
    --display:'Montserrat',system-ui,sans-serif; --body:'PT Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:26px 20px 90px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 64px 58px;margin:0 0 22px;min-height:560px;display:flex;flex-direction:column;
    justify-content:center;position:relative;box-shadow:0 14px 40px rgba(52,47,105,.07)}
  .kick{font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--display);font-weight:800;font-size:64px;line-height:1.05;letter-spacing:-.015em}
  h2{font-family:var(--display);font-weight:700;font-size:42px;line-height:1.12;letter-spacing:-.01em}
  .lead{font-size:23px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:42ch}
  .num{font-family:var(--display);font-size:26px;color:var(--accent);font-weight:700;letter-spacing:.02em}
  .partno{font-family:var(--display);font-size:150px;line-height:.9;color:var(--panel2);font-weight:800;position:absolute;top:34px;right:52px}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px}
  li{font-size:23px;line-height:1.42;padding-left:40px;position:relative;max-width:50ch}
  li::before{content:'';position:absolute;left:0;top:11px;width:15px;height:15px;border-radius:5px;
    border:2.5px solid var(--accent)}
  .steps li::before{content:counter(s);counter-increment:s;border:none;width:34px;height:34px;top:-2px;left:0;
    background:var(--accent);color:#fff;border-radius:9px;font-weight:700;font-size:18px;display:flex;
    align-items:center;justify-content:center;font-family:var(--display)}
  .steps{counter-reset:s}
  .steps li{padding-left:52px}
  .quote{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.28;max-width:22ch;letter-spacing:-.01em}
  .quote .a{color:var(--accent)}
  .attrib{margin-top:26px;font-size:16px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:700;font-family:var(--display)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
  .card{background:var(--panel2);border-radius:14px;padding:30px 32px}
  .card h3{font-family:var(--display);font-size:21px;font-weight:700;margin-bottom:12px;color:var(--accent)}
  .card p{font-size:19px;line-height:1.44;color:var(--ink)}
  .facts{margin-top:28px;display:flex;flex-direction:column;gap:14px}
  .facts div{font-size:22px;line-height:1.35}
  .facts b{font-weight:700}
  .disc{margin-top:34px;font-size:15px;line-height:1.5;color:var(--muted);max-width:60ch}
  .foot{position:absolute;bottom:26px;left:64px;right:64px;display:flex;justify-content:space-between;
    font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px}
  .cta h1{font-size:54px}
  .cta .go{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;font-weight:700;
    font-family:var(--display);font-size:21px;padding:18px 34px;border-radius:100px;letter-spacing:.01em}
  .site{margin-top:20px;font-size:20px;color:var(--muted);font-weight:700;font-family:var(--display)}
  @media(max-width:720px){.slide{padding:40px 30px}h1{font-size:42px}h2{font-size:32px}.cols{grid-template-columns:1fr}.partno{font-size:96px;right:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A free live masterclass for makers', h:'From Maker to Lifestyle CEO',
   lead:'How to turn the thing you make by hand into a real, protected business that funds the life you want, without losing the craft you love.'},

  {t:'agenda', kick:'Who this is for', h:'You make something people love. You are still running it like a hobby.',
   lead:'For makers and handmade entrepreneurs who know the product is good, but who are stuck working nights, underpricing, and unsure the business is even built to last.'},

  {t:'quote', q:'Your business is not just about your money. It is about <span class="a">your life</span>.',
   attrib:'The reframe we start with'},

  {t:'part', no:'01', kick:'Part one', h:'Why so many maker businesses stay a hobby.',
   lead:'Great product, real customers, and still no foundation under it: priced off the cost of materials, run off whatever hours are left, and never structured like a business that could give something back.'},

  {t:'point', kick:'The real problem', h:'Two things keep a maker stuck.',
   items:['Pricing that covers your supplies but never your time, so the busier you get, the more tired and less paid you feel.',
          'No real foundation under it, no structure, no protection, no plan, so growing feels risky instead of exciting.']},

  {t:'quote', q:'Undercharging and no foundation will quietly cap a business that the <span class="a">product</span> never would.',
   attrib:'Why the craft alone is not enough'},

  {t:'part', no:'02', kick:'Part two', h:'The path from maker to CEO.',
   lead:'The whole method rests on four moves most makers never separate: create, launch, lead, and grow, done in that order.'},

  {t:'steps', kick:'The Indie Method', h:'Four moves that build a real business.',
   items:['Create a real offer, priced for your life and not just your materials.',
          'Launch it on a foundation you can stand on: structure, protection, and the confidence to sell.',
          'Lead it like a CEO, with a plan for the quarter instead of a scramble for the week.',
          'Grow it in a way that adds freedom, not just hours.']},

  {t:'point', kick:'Move one', h:'Create: price it for the life you want.',
   items:['Start from what the business needs to give you, then build the offer and the price back from there.',
          'A price tied to your life, not to the cheapest maker on the marketplace, is the first thing that separates a business from a hobby.']},

  {t:'point', kick:'Move two', h:'Launch: build the foundation makers skip.',
   items:['Structure it, protect it, and cover it, so one bad order or one honest mistake can never take the whole thing down.',
          'When the foundation is solid you sell with confidence, instead of quietly hoping nothing goes wrong.']},

  {t:'point', kick:'Moves three and four', h:'Lead, then grow, on purpose.',
   items:['Lead the quarter: set specific goals and work a plan, instead of reacting to whatever landed in the inbox.',
          'Grow deliberately, so more revenue buys back your time rather than eating more of it.']},

  {t:'card2', kick:'A worked comparison', h:'The same craft, two ways to run it.',
   a:{h:'Run as a hobby', p:'Priced off materials, worked in the margins, no foundation under it. Busy, tired, and never sure the business would survive a bad month.'},
   b:{h:'Run as a Lifestyle CEO', p:'Priced for your life, protected, and planned. The craft stays exactly the same; the business behind it finally holds you up.'}},

  {t:'part', no:'03', kick:'Part three', h:'What changes when you run it like a CEO.',
   lead:'This is not about caring less for the craft. It is about the craft finally sitting inside a business that pays you and protects you.'},

  {t:'point', kick:'The other side', h:'When the business is finally built.',
   items:['You price without apologizing, because the number is tied to the life you are building.',
          'You sell without fear, because the foundation underneath you is real.',
          'The work funds your life, instead of quietly draining it.']},

  {t:'quote', q:'A Lifestyle CEO runs the business for the money and for the <span class="a">freedom, flexibility and fun</span>.',
   attrib:'What we are really after'},

  {t:'bio', kick:'Who is teaching this', h:'Donna Maria Coles Johnson',
   facts:['<b>Former attorney</b> who left law to build a handmade-products business.',
          '<b>SBA Home-Based Business Advocate of the Year</b> and a Forbes Top 20 voice for small business.',
          'Founder and CEO of the <b>Indie Business Network</b>, serving makers since 2000.',
          'Host of <b>The Indie Business Podcast</b> and creator of the <b>Indie Method</b>.']},

  {t:'point', kick:'Where this fits', h:'This class is one room of a bigger house.',
   items:['The Indie Business Network is the rest of it: coverage, community, coaching, and the Blueprint that keep the foundation in place.',
          'The Quarterly Strategic Planning Intensives keep the leading and growing on track long after the class ends.']},

  {t:'recap', kick:'To recap', h:'From maker to Lifestyle CEO.',
   items:['Create an offer priced for your life.',
          'Launch on a foundation you can stand on.',
          'Lead the quarter like a CEO.',
          'Grow in a way that adds freedom.']},

  {t:'cta', kick:'Where to take this next', h:'Come build the whole business with us.',
   lead:'If this class is the first room, the Indie Business Network is the rest of the house: the coverage, the coaching, the community, and the plan that keep it standing.',
   go:'Join the Indie Business Network', site:'indiebusinessnetwork.com',
   disc:'This class is educational. No specific income or business result is guaranteed. Results vary with your market, your effort, and your own numbers.'}
];

const deck = document.getElementById('deck');
function foot(i){return `<div class="foot"><span>From Maker to Lifestyle CEO</span><span>Donna Maria Coles Johnson</span></div>`}
function render(s,i){
  let inner='';
  if(s.t==='title') inner=`<div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p>`;
  else if(s.t==='agenda') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><p class="lead">${s.lead}</p>`;
  else if(s.t==='part') inner=`<div class="partno">${s.no}</div><div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p>`;
  else if(s.t==='quote') inner=`<div class="quote">${s.q}</div><div class="attrib">${s.attrib}</div>`;
  else if(s.t==='point') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='steps') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul class="steps">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='recap') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul class="steps">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='card2') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="cols"><div class="card"><h3>${s.a.h}</h3><p>${s.a.p}</p></div><div class="card"><h3>${s.b.h}</h3><p>${s.b.p}</p></div></div>`;
  else if(s.t==='bio') inner=`<div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="facts">${s.facts.map(x=>`<div>${x}</div>`).join('')}</div>`;
  else if(s.t==='cta') inner=`<div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p><div class="go">${s.go}</div><div class="site">${s.site}</div><p class="disc">${s.disc}</p>`;
  return `<section class="slide ${s.t==='cta'?'cta':''}">${inner}${foot(i)}</section>`;
}
deck.innerHTML = S.map(render).join('');
</script>
</body>
</html>
