<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healthy Friction: Leading Through Tension in the AI Era</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2ea;
  --panel:#fffdf9;
  --rule:#e0d6c6;
  --ink:#211d18;
  --accent:#ca9042;
  --dim:#777777;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;line-height:1.5}
.deck{max-width:960px;margin:0 auto}
.slide{min-height:94vh;display:flex;flex-direction:column;justify-content:center;padding:7vh 8vw;border-bottom:1px solid var(--rule);position:relative}
.num{font-family:"Public Sans";font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px;display:flex;align-items:center;gap:12px}
.num::after{content:"";height:1px;width:46px;background:var(--accent);display:inline-block;opacity:.6}
h1{font-family:"Newsreader";font-weight:700;font-size:clamp(34px,6.4vw,66px);line-height:1.04;letter-spacing:-.01em}
h2{font-family:"Newsreader";font-weight:700;font-size:clamp(28px,4.6vw,46px);line-height:1.1}
.promise{font-family:"Newsreader";font-style:italic;font-size:clamp(18px,2.4vw,26px);color:var(--dim);margin-top:26px;max-width:40ch}
.lead{font-size:clamp(17px,2vw,22px);max-width:52ch;margin-top:20px}
.lead.big{font-family:"Newsreader";font-size:clamp(22px,3.2vw,34px);line-height:1.28;color:var(--ink)}
.kick{font-family:"Newsreader";font-style:italic;color:var(--accent);font-size:clamp(20px,2.6vw,28px);margin-bottom:14px}
ul{margin-top:24px;max-width:54ch;list-style:none}
li{font-size:clamp(16px,1.9vw,20px);padding:14px 0 14px 26px;border-top:1px solid var(--rule);position:relative}
li:first-child{border-top:none}
li::before{content:"";position:absolute;left:0;top:22px;width:10px;height:2px;background:var(--accent)}
.pillar{font-family:"Newsreader";font-weight:700;color:var(--accent)}
.part{background:var(--ink);color:var(--bg)}
.part .num{color:var(--accent)}
.part h2{color:var(--bg)}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 32px;margin-top:26px;max-width:56ch;box-shadow:0 1px 0 var(--rule)}
.card .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--rule);font-size:15px}
.card .row:first-of-type{border-top:none}
.bar{height:7px;width:120px;background:var(--rule);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.cta{background:var(--ink);color:var(--bg)}
.cta h2{color:var(--bg)}
.cta .lead{color:#e9e1d4}
.btn{display:inline-block;margin-top:30px;font-family:"Public Sans";font-weight:600;font-size:17px;color:var(--ink);background:var(--accent);padding:15px 30px;border-radius:999px;text-decoration:none}
.disc{margin-top:30px;font-size:13px;color:#b9ad97;max-width:50ch;line-height:1.5}
.sig{margin-top:18px;font-family:"Newsreader";font-style:italic;color:var(--accent);font-size:19px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',n:'A live masterclass with Jenny Fernandez',h:'Healthy Friction',p:'Leading through tension in the AI era, without smoothing over the one thing that actually moves your team.'},
 {t:'who',n:'Who this is for',h:'Senior leaders whose teams just got handed AI',l:'You run a team, a function, or a company. The mandate came down to "adopt AI." You said yes. And somewhere between the all-hands and the Tuesday standup, it quietly stalled.'},
 {t:'trap',n:'The trap',h:'You pushed. They nodded. Nothing changed.',l:'So you push harder. More tools, more training, more urgency. The friction goes underground instead of away, and now you cannot even see where it lives.'},
 {t:'reframe',n:'The reframe',k:'Here is what almost nobody says out loud.',h:'The friction isn\'t resistance to AI. It\'s resistance to becoming someone new at work.',l:'Your best people built an identity around being the one who knows. AI threatens that story before it threatens their job. That is the real tension, and it is not a problem to remove. It is the turning point.'},
 {t:'part',n:'Part one',h:'Why smoothing it over keeps failing'},
 {t:'body',n:'Part one',h:'Avoidance feels like leadership. It isn\'t.',l:'Every time you resolve the tension fast, so the meeting stays comfortable, you teach the team that the discomfort was the danger. The adoption dies in the comfort, not the conflict.'},
 {t:'body',n:'Part one',h:'The cost shows up late',l:'A team that never surfaces its real doubts about AI will look aligned for a quarter. Then the usage numbers tell the truth, and by then the window to lead the change has closed.'},
 {t:'part',n:'Part two',h:'The Healthy Friction method'},
 {t:'pillar',n:'Pillar one',h:'<span class="pillar">Unlearn.</span> Name the habit the tool threatens.',l:'Before anyone adopts anything, surface the professional-identity habit AI is quietly making obsolete. You cannot build on top of a threat nobody has named. This is the conversation leaders skip and the one that unlocks the rest.'},
 {t:'pillar',n:'Pillar two',h:'<span class="pillar">Build.</span> Run one safe-to-fail test.',l:'Not a rollout. A small, visible experiment the team can run without betting their reputation on it. Safe-to-fail turns an abstract threat into a concrete thing people can poke at, and curiosity does what pressure never could.'},
 {t:'pillar',n:'Pillar three',h:'<span class="pillar">Communicate.</span> Make the new value visible.',l:'When the work changes, people lose track of what they are now valued for. Your job is to say it plainly and often, so judgment, taste, and decisions become the thing that is seen, not the task the machine absorbed.'},
 {t:'body',n:'The move',h:'Tension becomes direction',l:'Unlearn surfaces it. Build tests it in the open. Communicate re-anchors what matters. The same friction that used to stall the team is now the thing pointing it forward.'},
 {t:'part',n:'Part three',h:'What changes on your team'},
 {t:'body',n:'Part three',h:'The doubts move to the surface',l:'People say the quiet part in the room instead of the hallway. You get to lead the real conversation while it still bends, not after it has set.'},
 {t:'body',n:'Part three',h:'Adoption stops being a mandate',l:'It becomes something the team is testing on purpose, because the identity threat got named and the experiment felt safe. Usage follows belief, in that order.'},
 {t:'index',n:'A place to start',h:'How AI-ready is your leadership, really?',l:'The Personal AI Leadership Readiness Index scores the four dimensions most leaders never stop to check. It is the diagnostic I use before any work begins.',card:true},
 {t:'why',n:'Why listen to me on this',h:'I have sat on both sides of the table',l:'Former CMO inside global brands. Faculty at Columbia Business School and NYU. Member of the Marshall Goldsmith 100 Coaches. Named to the Thinkers50 Radar of management thinkers to watch, and a contributor to Harvard Business Review, Fast Company, and Forbes.'},
 {t:'recap',n:'The whole thing in one line',h:'Don\'t remove the friction. Lead through it.',l:'Unlearn the habit the tool threatens. Build one safe-to-fail test. Communicate the new value out loud. That is how a team actually crosses into the AI era with you.'},
 {t:'cta',n:'Keep going',h:'Work through your team\'s friction with me',l:'If this is the conversation your leadership needs to have, start with the readiness index and let\'s talk about what leading through your team\'s specific tension would look like.',btn:'Start at jennyfernandez.com',sig:'Jenny Fernandez',disc:'This masterclass is educational. No specific result or outcome is guaranteed. Results vary by leader and organization.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
 const sec=document.createElement('section');
 const cls=['slide'];
 if(s.t==='part') cls.push('part');
 if(s.t==='cta') cls.push('cta');
 sec.className=cls.join(' ');
 let html='';
 html+='<div class="num">'+(s.n||('Slide '+(i+1)))+'</div>';
 if(s.k) html+='<div class="kick">'+s.k+'</div>';
 if(s.t==='title'){html+='<h1>'+s.h+'</h1>';}
 else {html+='<h2>'+s.h+'</h2>';}
 if(s.p) html+='<div class="promise">'+s.p+'</div>';
 if(s.l) html+='<div class="lead'+(s.t==='reframe'||s.t==='recap'?' big':'')+'">'+s.l+'</div>';
 if(s.card){
   html+='<div class="card">'
    +'<div class="row"><span>Mindset readiness</span><span class="bar"><i style="width:62%"></i></span></div>'
    +'<div class="row"><span>Skill fluency</span><span class="bar"><i style="width:48%"></i></span></div>'
    +'<div class="row"><span>Team adoption</span><span class="bar"><i style="width:55%"></i></span></div>'
    +'<div class="row"><span>Value visibility</span><span class="bar"><i style="width:40%"></i></span></div>'
    +'</div>';
 }
 if(s.btn) html+='<a class="btn" href="https://jennyfernandez.com">'+s.btn+'</a>';
 if(s.sig) html+='<div class="sig">'+s.sig+'</div>';
 if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
 sec.innerHTML=html;
 deck.appendChild(sec);
});
</script>
</body>
</html>
