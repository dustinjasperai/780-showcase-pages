<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stuck to a Plan You Believe In - a live masterclass with Catherine Durkin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display:ital@0;1&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f0;
    --panel:#f1ebe1;
    --rule:#d9cfc0;
    --ink:#22262e;
    --deep:#4a5160;
    --accent:#e95e6f;
    --head:"Libre Caslon Display",Georgia,serif;
    --body:"Public Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--deep);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:32px 16px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:64px 64px;
    margin:0 0 26px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .num{position:absolute;top:22px;right:28px;font-size:12px;letter-spacing:.14em;color:var(--deep);opacity:.6}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:400;font-size:60px;line-height:1.04;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--head);font-weight:400;font-size:42px;line-height:1.1;margin-bottom:18px}
  .sub{font-size:21px;line-height:1.5;color:var(--deep);max-width:30ch}
  .statement{font-family:var(--head);font-weight:400;font-size:48px;line-height:1.16;max-width:20ch}
  .statement .a{color:var(--accent)}
  ul{list-style:none;margin-top:10px}
  li{font-size:21px;line-height:1.45;padding:14px 0 14px 34px;border-top:1px solid var(--rule);position:relative;color:var(--ink)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:22px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
  .pillar-no{font-family:var(--head);font-size:24px;color:var(--accent);font-weight:400;margin-bottom:10px}
  .lead{font-size:20px;line-height:1.5;color:var(--deep);max-width:42ch;margin-top:8px}
  .section-tag{font-family:var(--head);font-style:italic;font-size:24px;color:var(--deep)}
  .quote{font-family:var(--head);font-weight:400;font-style:italic;font-size:40px;line-height:1.2;max-width:22ch}
  .by{margin-top:26px;font-size:16px;color:var(--deep);letter-spacing:.02em}
  .cta-step{font-size:24px;line-height:1.5;color:var(--ink);max-width:34ch;margin-top:6px}
  .cta-link{display:inline-block;margin-top:26px;font-size:22px;color:var(--accent);font-weight:700}
  .disclaimer{margin-top:40px;font-size:13px;line-height:1.5;color:var(--deep);opacity:.75;max-width:60ch}
  .cap{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--deep);margin-bottom:14px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:"A live masterclass with Catherine Durkin",
    title:"Stuck to a Plan You Believe In",
    sub:"How to navigate a career transition without guessing."},

  {t:'points', kicker:"Who this is for",
    head:"You are in the right room if",
    items:[
      "You feel stuck, and just applying for things has not helped",
      "You are facing redundancy, a relocation, or a pivot",
      "You keep weighing a bigger change and talking yourself out of it",
      "You are coming back from a break and unsure how to step up again"
    ]},

  {t:'statement', cap:"The trap",
    html:"The usual advice is update your CV and start applying.<br>That is motion. It is not a <span class=\"a\">plan</span>."},

  {t:'statement', cap:"The reframe",
    html:"A move made in a panic is just the old problem<br>in a <span class=\"a\">new building</span>."},

  {t:'section', tag:"Part One", head:"Why capable people stay stuck"},

  {t:'points', kicker:"Part One",
    head:"It is rarely a lack of options",
    items:[
      "No clear criteria, so every option looks equally risky",
      "A fear of wasting the years already invested",
      "Mistaking being busy for actually moving forward"
    ]},

  {t:'statement', cap:"The idea",
    html:"Stuck is not a <span class=\"a\">feeling</span>.<br>It is a missing plan."},

  {t:'section', tag:"Part Two", head:"The path through"},

  {t:'pillar', no:"01", head:"Get honest about what matters",
    lead:"Name what you actually want more of, and less of, before you touch a job board. Clarity on your values is what makes every later decision faster."},

  {t:'pillar', no:"02", head:"Build the plan",
    lead:"Turn vague wanting into real criteria, a short list of options, and a decision you can defend to yourself. This is the part most people skip."},

  {t:'pillar', no:"03", head:"Move with confidence",
    lead:"The conversations, the positioning, and the momentum to act, so the plan leaves the page. A good plan you never run changes nothing."},

  {t:'points', kicker:"Works across the moment you are in",
    head:"The same path fits whether you are",
    items:[
      "Making a career transition into something new",
      "Stepping up into managing people for the first time",
      "Returning to work after leave, without going back smaller"
    ]},

  {t:'section', tag:"Part Three", head:"The other side of stuck"},

  {t:'points', kicker:"Part Three",
    head:"Where this leaves you",
    items:[
      "Clarity on what you are moving toward, not just away from",
      "A plan you actually believe in, not a guess",
      "Confidence in the conversations that make it real"
    ]},

  {t:'credibility', kicker:"Why me",
    head:"I made this move on purpose",
    lead:"I spent nearly twelve years leading teams at Meta across Ireland, the UK and EMEA. I left deliberately, retrained as an executive coach at UCD Smurfit, and earned my EMCC accreditation. I have sat in the seat you are in, and I coach the way through it."},

  {t:'quote',
    quote:"People often come to me feeling stuck or uncertain. They leave with clarity, confidence, and a plan they actually believe in.",
    by:"Catherine Durkin, CareerCoaching.ie"},

  {t:'cta', kicker:"Your next step",
    head:"Ready to build your plan?",
    step:"If this is the moment, the next step is a short discovery call. We look at where you are, where you want to go, and whether coaching is the right fit.",
    link:"careercoaching.ie",
    disclaimer:"This masterclass is educational and reflects one coach's approach. It does not guarantee any particular job, promotion, or income outcome; results vary by individual and circumstance."}
];

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

const deck = document.getElementById("deck");
S.forEach(function(s, i){
  const d = el("div","slide");
  d.appendChild(el("div","num", String(i+1).padStart(2,"0")+" / "+String(S.length).padStart(2,"0")));
  if(s.t==="title"){
    d.appendChild(el("div","kicker", s.kicker));
    d.appendChild(el("h1", null, s.title));
    d.appendChild(el("div","sub", s.sub));
  } else if(s.t==="statement"){
    if(s.cap) d.appendChild(el("div","cap", s.cap));
    d.appendChild(el("div","statement", s.html));
  } else if(s.t==="section"){
    d.appendChild(el("div","section-tag", s.tag));
    d.appendChild(el("h2", null, s.head));
  } else if(s.t==="points"){
    if(s.kicker) d.appendChild(el("div","kicker", s.kicker));
    d.appendChild(el("h2", null, s.head));
    const ul=el("ul");
    s.items.forEach(function(it){ ul.appendChild(el("li", null, it)); });
    d.appendChild(ul);
  } else if(s.t==="pillar"){
    d.appendChild(el("div","pillar-no", s.no));
    d.appendChild(el("h2", null, s.head));
    d.appendChild(el("div","lead", s.lead));
  } else if(s.t==="credibility"){
    d.appendChild(el("div","kicker", s.kicker));
    d.appendChild(el("h2", null, s.head));
    d.appendChild(el("div","lead", s.lead));
  } else if(s.t==="quote"){
    d.appendChild(el("div","quote", '"'+s.quote+'"'));
    d.appendChild(el("div","by", s.by));
  } else if(s.t==="cta"){
    d.appendChild(el("div","kicker", s.kicker));
    d.appendChild(el("h2", null, s.head));
    d.appendChild(el("div","cta-step", s.step));
    d.appendChild(el("div","cta-link", s.link));
    d.appendChild(el("div","disclaimer", s.disclaimer));
  }
  deck.appendChild(d);
});
</script>
</body>
</html>
