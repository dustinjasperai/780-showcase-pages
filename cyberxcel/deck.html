<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Blue Team Fast-Track — CyberXcel Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ebedf1;        /* light ground: #1a1a1a ink lifted toward white, slight cool cast (console-on-light) */
    --panel:#ffffff;     /* brand body bg, harvested rgb(255,255,255) */
    --ink:#1a1a1a;       /* sole harvested brand colour */
    --accent:#1a1a1a;    /* one accent role = the brand ink */
    --muted:#5b6470;     /* neutral derived within the ink->white greyscale */
    --rule:#e2e5ea;
    --sans:'DM Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:4px;
    padding:56px 56px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
  }
  .slide.dark{background:var(--ink);color:#f3f4f6;border-color:var(--ink)}
  .slide.dark .kick,.slide.dark .muted{color:#9aa3af}
  .snum{position:absolute;top:20px;right:24px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
  .slide.dark .snum{color:#6b7280}
  .kick{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
  h1{font-size:52px;line-height:1.04;font-weight:700;letter-spacing:-.02em;margin-bottom:22px}
  h2{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.015em;margin-bottom:18px}
  .sub{font-size:21px;line-height:1.45;color:var(--muted);max-width:40ch}
  .slide.dark .sub{color:#c7ccd4}
  .lead{font-size:23px;line-height:1.5;max-width:46ch}
  p.body{font-size:19px;line-height:1.55;color:#33363c;max-width:52ch;margin-top:6px}
  .slide.dark p.body{color:#d2d6dd}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.4;padding:12px 0 12px 30px;border-top:1px solid var(--rule);position:relative;max-width:54ch}
  li:before{content:'';position:absolute;left:0;top:19px;width:10px;height:2px;background:var(--accent)}
  .slide.dark li{border-color:#2d2f35}
  .slide.dark li:before{background:#f3f4f6}
  .meta{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.02em;margin-top:28px}
  .brandrow{display:flex;align-items:baseline;gap:12px;margin-top:34px;font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--muted)}
  .term{font-family:var(--mono);font-size:15px;line-height:1.9;background:#0f1012;color:#e6e8ec;border-radius:4px;padding:22px 24px;margin-top:14px;max-width:60ch}
  .term .pr{color:#8b93a1}
  .term .ok{color:#cdd3db}
  .pill{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;color:var(--muted);margin-top:18px}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:62ch}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .cell{border:1px solid var(--rule);border-radius:4px;padding:18px 18px}
  .cell h3{font-size:16px;font-weight:700;margin-bottom:6px}
  .cell p{font-size:15px;line-height:1.45;color:var(--muted)}
  .big{font-size:120px;line-height:1;font-weight:700;letter-spacing:-.03em}
  @media(max-width:640px){.slide{padding:34px 24px;min-height:0}h1{font-size:36px}h2{font-size:26px}.big{font-size:72px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kick:'CyberXcel Masterclass',
   h:`The Blue Team Fast-Track`,
   sub:`How to land a job-ready SOC analyst role in six months. No degree. No cert-stacking.`,
   brand:`CyberXcel  /  Sohail Ershadi`},

  {t:'audience',
   kick:'Who this is for',
   h:`If you are already near the door`,
   body:`This is for people in IT who want into security. Help desk, service desk, network and support folks. Career switchers with a technical streak. People who keep hearing "cybersecurity is hiring" and cannot find the on-ramp.`},

  {t:'trap',
   kick:'The trap',
   h:`You have been told the way in is more certs`,
   body:`So you stack them. Security+, then the next one, then the next. Each one costs money and months, and at the end of it you still cannot answer the one question every interviewer asks: can you actually do the work?`},

  {t:'reframe', dark:true,
   kick:'The uncomfortable part',
   h:`Certificates do not make you employable. Being able to do the job does.`,
   sub:`A hiring manager is not buying your badge. They are buying whether you can sit at a console on day one and triage an alert without being walked through it.`},

  {t:'part',
   kick:'Part one',
   h:`Why most people stall`,
   sub:`Two gaps quietly keep capable people out of the field. Neither is about intelligence.`},

  {t:'point',
   kick:'Gap one',
   h:`Tools without foundations`,
   body:`People jump straight to the shiny tools before they understand networking and the fundamentals underneath them. So they can click around a dashboard but cannot explain what they are looking at. The understanding has to come first, or the tools are just buttons.`},

  {t:'point',
   kick:'Gap two',
   h:`No proof you can do it`,
   body:`Courses hand you videos. They do not hand you evidence. With nothing you have actually done, there is nothing to show an employer and nothing to talk about in an interview. The wall is not knowledge. It is proof.`},

  {t:'part',
   kick:'Part two',
   h:`The method`,
   sub:`Four pillars, in order. This is how the Applied Cybersecurity Analyst program is built, and it is what this masterclass teaches.`},

  {t:'pillar',
   kick:'Pillar one',
   h:`Fundamentals first`,
   body:`Start with the essentials of networking and security, so you have a solid base before any professional tool. When the fundamentals are real, everything above them makes sense instead of being memorised.`},

  {t:'pillar-term',
   kick:'Pillar two',
   h:`Hands-on Blue Team labs`,
   body:`You work the real defender toolset in labs, not slideware. The same stack a SOC uses:`,
   log:[['splunk','&gt; search index=main sourcetype=auth status=failed'],
        ['crowdstrike','&gt; falcon: isolate host WIN-SOC-04  [contained]'],
        ['sentinel','&gt; KQL: SecurityAlert | where Severity == "High"'],
        ['nessus','&gt; scan complete: 3 critical, 11 high  [triage]']]},

  {t:'pillar',
   kick:'Pillar three',
   h:`Mentorship from working analysts`,
   body:`Live group coaching plus personalised one-on-one mentorship from instructors who are currently employed in cybersecurity. You get feedback on real work from people who do this job now, not a recording you watch alone.`},

  {t:'pillar',
   kick:'Pillar four',
   h:`The job-landing system`,
   body:`Mock interviews, resume and LinkedIn work, and active job-hunting support. Skill gets you ready. This is the part that turns ready into hired.`},

  {t:'part',
   kick:'Part three',
   h:`What it actually looks like`,
   sub:`The job you are training for is more concrete than most people imagine.`},

  {t:'day',
   kick:'A day in the SOC',
   h:`What a Blue Team analyst does`,
   grid:[['Triage','Work the alert queue. Decide what is noise and what is real.'],
         ['Investigate','Pull logs in the SIEM. Follow the signal across hosts.'],
         ['Respond','Contain a host in EDR. Escalate what needs a human.'],
         ['Harden','Review scan findings. Close the gaps before they are used.']]},

  {t:'timeline',
   kick:'The timeline',
   h:`Roughly six months, from an IT starting point`,
   body:`This is not an overnight promise and it is not a four-year degree either. With a technical base and the work put in, the path to a first analyst role is measured in months, not years. The pace is yours.`,
   pill:'Fundamentals, then labs, then interviews'},

  {t:'why', dark:true,
   kick:'Why listen to this',
   h:`Taught by people who walked the path`,
   sub:`Sohail Ershadi went help desk, to network engineering, to a cybersecurity engineering role, over ten-plus years in the field. The instructors are practitioners working in the industry today.`,
   meta:`4.7 / 5 across 28 public reviews. "Landed a job as a security analyst in six months with the help of the team."`},

  {t:'recap',
   kick:'The method, together',
   h:`Four pillars, one path`,
   bullets:[`Fundamentals first, so the tools make sense`,
            `Hands-on Blue Team labs, so you have proof`,
            `Mentorship from working analysts, so you improve fast`,
            `A job-landing system, so ready becomes hired`]},

  {t:'objection',
   kick:'The question everyone asks',
   h:`Do I need a degree?`,
   body:`No. What you need is the ability to do the work and the proof that you can. A degree is one path. Applied skill, labs you can speak to, and support getting in front of employers is another, and it is faster.`},

  {t:'cta',
   kick:'Your next step',
   h:`Ready to start the fast-track?`,
   body:`If this is the path you want, the next step is a conversation with the CyberXcel team about the Applied Cybersecurity Analyst program and whether it fits where you are starting from.`,
   brand:`Book a call with the CyberXcel team  /  cyberxcel.com.au`,
   disc:`This masterclass is educational. Nothing here is guaranteed, including a job, a salary, or any specific outcome. Results vary based on your background, the effort you put in, and the job market. No earnings or hiring outcome is promised.`}
];

function esc(x){return x;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.dark?' dark':'');
  let html=`<div class="snum">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  if(s.kick) html+=`<div class="kick">${s.kick}</div>`;
  if(s.t==='title'){html+=`<h1>${s.h}</h1><div class="sub">${s.sub}</div><div class="brandrow">${s.brand}</div>`;}
  else if(s.t==='cta'){html+=`<h2>${s.h}</h2><p class="body">${s.body}</p><div class="brandrow">${s.brand}</div><div class="disc">${s.disc}</div>`;}
  else {
    if(s.h) html+=`<h2>${s.h}</h2>`;
    if(s.sub) html+=`<div class="sub">${s.sub}</div>`;
    if(s.body) html+=`<p class="body">${s.body}</p>`;
    if(s.log){let t=`<div class="term">`;s.log.forEach(r=>{t+=`<div><span class="pr">[${r[0]}]</span> <span class="ok">${r[1]}</span></div>`;});t+=`</div>`;html+=t;}
    if(s.grid){let g=`<div class="grid">`;s.grid.forEach(c=>{g+=`<div class="cell"><h3>${c[0]}</h3><p>${c[1]}</p></div>`;});g+=`</div>`;html+=g;}
    if(s.bullets){let u=`<ul>`;s.bullets.forEach(b=>{u+=`<li>${b}</li>`;});u+=`</ul>`;html+=u;}
    if(s.pill) html+=`<span class="pill">${s.pill}</span>`;
    if(s.meta) html+=`<div class="meta">${s.meta}</div>`;
  }
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
