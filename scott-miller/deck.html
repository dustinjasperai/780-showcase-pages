<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Five Building Blocks &middot; Scott Miller, The Growth League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#16283f; --panel:#1d3654; --rule:#2f4f74;
    --ink:#eef4fa; --accent:#a2d44c; --blue:#366490;
    --soft:#b9c8dc; --dim:#7e93ac;
  }
  html,body{height:100%}
  body{background:#0c1826;font-family:'Manrope',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0c1826}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .38s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.8%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Manrope',sans-serif;font-size:1vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Raleway',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.16;letter-spacing:-.006em}
  .t-title h1{font-size:4.2vw;max-width:88%}
  .t-normal h1{font-size:2.92vw;max-width:84%}
  .t-normal .body{font-size:1.44vw;color:var(--soft);margin-top:2.6vh;max-width:74%;line-height:1.6;font-weight:400}
  .sub{font-size:1.7vw;color:var(--soft);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Manrope',sans-serif;font-size:1.2vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4vw;max-width:88%}
  .t-section .rule{width:20vw;height:4px;background:linear-gradient(90deg,var(--accent),rgba(162,212,76,0));margin-top:3.6vh}
  .t-quiet{background:#0f2136;align-items:center;text-align:center}
  .t-quiet h1{font-size:3.2vw;max-width:88%;color:#eef4fa;font-weight:600}
  .t-quiet .body{color:var(--soft);text-align:center;max-width:70%;margin-left:auto;margin-right:auto}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:2.5vw;text-align:center;margin-bottom:4.2vh}
  .flowrow{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
  .flowcard{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:.2vw;padding:2.3vh 1.2vw;width:17.6vw;min-height:15vh;display:flex;flex-direction:column;gap:1vh}
  .flowcard .n{font-family:'Raleway',Georgia,serif;font-size:1.9vw;font-weight:800;color:var(--accent);line-height:1}
  .flowcard .l{font-size:1.02vw;font-weight:700;color:var(--ink);line-height:1.3}
  .flowcard .d{font-size:.92vw;font-weight:400;color:var(--soft);line-height:1.45}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.5vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:2px solid var(--accent);color:var(--accent);border-radius:.2vw;padding:1.3vh 1.7vw;font-size:1.14vw;font-weight:700;letter-spacing:.03em}
  .disc{position:absolute;left:8.8%;right:8.8%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .t-quiet .disc{color:#6c8098}
  .ledger{position:absolute;pointer-events:none}
  .title-ledger{right:7.2%;bottom:10.5%;width:20vw}
  .corner-ledger{right:6.2%;bottom:8%;width:9.5vw;opacity:.6}
  .brandline{font-size:1.22vw;color:var(--soft);margin-top:3.6vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(238,244,250,.09);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#5c7590;z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#5c7590;z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#5c7590;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.8vw}.t-normal h1{font-size:4.9vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.2vw}.t-quiet h1{font-size:5.2vw}.t-flow h1{font-size:4.4vw}
    .flowcard{width:38vw}.flowcard .n{font-size:3.8vw}.flowcard .l{font-size:2.2vw}.flowcard .d{font-size:1.9vw}
    .t-cta h1{font-size:6.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 23</div>
<div class="brand-foot">The Growth League</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ledger" viewBox="0 0 320 90">
  <g>
    <line x1="10" y1="45" x2="310" y2="45" stroke="#366490" stroke-width="3" opacity="0.35"/>
    <line x1="10" y1="45" x2="170" y2="45" stroke="#366490" stroke-width="3"/>
    <line x1="170" y1="45" x2="310" y2="45" stroke="#a2d44c" stroke-width="3"/>
    <circle cx="170" cy="45" r="6" fill="#a2d44c"/>
    <circle cx="310" cy="45" r="6" fill="#a2d44c"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Five Building Blocks',sub:'The financial-clarity system that turns a busy restoration company into one you can actually read, taught by an owner who used it to sell his own company in 2017.',brand:true,motif:'title'},

 {t:'normal',k:'Who this is for',title:'Owners of independent restoration companies who cannot explain last month’s numbers.',body:'You are busy. Jobs are closing. And you still cannot say, in plain numbers, what last month actually made you. This class is for the owner who suspects the problem is not effort, it is the bookkeeping underneath it.'},
 {t:'normal',k:'What you will walk away with',title:'A five-part map for turning your books into decisions.',body:'The same five blocks used to build a company clean enough to run with confidence, and clean enough to sell. One sitting, no slides about marketing.'},
 {t:'normal',k:'An honest note',title:'This is education, not a promise.',body:'Every company, market and set of books is different. Nothing here is a guarantee of any specific financial result. Take the map and test it against your own numbers.',disc:'Educational content. Nothing here is a guarantee of income, revenue, profit, or any business result. Results vary.'},
 {t:'normal',k:'Who is teaching this',title:'Scott Miller. The Growth League.',body:'I built a restoration franchise into an independent company and sold it for seven figures in 2017. I sold a second business, in insurance, in 2021. I coach restoration owners on the same financial discipline that got both of mine sale ready.'},

 {t:'section',idx:'Part One',title:'Revenue Is Not Profit. Most Owners Cannot Tell The Difference.'},
 {t:'normal',k:'The version you live',title:'The company looks busy. The bank account does not agree.',body:'Trucks are out. Jobs are closing. And at the end of the month you are still guessing what it actually made you, because the number you are looking at is revenue, not profit, and nobody ever showed you the difference inside your own books.'},
 {t:'normal',k:'What most owners try first',title:'Work harder. Close more jobs. Hope the number fixes itself.',body:'None of it works, because more revenue running through a chart of accounts you cannot read just produces a bigger number you still cannot explain.'},
 {t:'quiet',title:'Foundation. Understanding your own Chart of Accounts through restoration-specific job costing and WIP reports, so the numbers mean something before anyone tries to act on them.'},
 {t:'normal',k:'The real starting point',title:'Foundation: the books have to speak your language first.',body:'A restoration company’s chart of accounts is not a generic contractor’s. Job costing and work-in-progress reporting have to reflect how claims, mitigation and reconstruction actually move through your business, or every report built on top of it is wrong before you even read it.'},

 {t:'section',idx:'Part Two',title:'Building The Rest Of The System'},
 {t:'flow',k:'The five blocks, in order',title:'Foundation. Structure. Routine. Strategize. Protect.',items:[
   {n:'01',l:'Foundation',d:'Financial literacy through your own restoration-specific chart of accounts and WIP reports.'},
   {n:'02',l:'Structure',d:'Set up the accounting system to report by income type and by job profitability.'},
   {n:'03',l:'Routine',d:'Bookkeeping discipline on a schedule: transactions, receivables, payroll.'},
   {n:'04',l:'Strategize',d:'Review the data and use it to decide, with job-level P&Ls and real metrics.'},
   {n:'05',l:'Protect',d:'Payment systems, fraud prevention, and a quarterly CPA review.'}]},
 {t:'normal',k:'Block two',title:'Structure: build reporting that separates job from job.',body:'A single lump revenue number hides everything. Structure means the system reports by income type and by individual job profitability, so a strong water-damage month cannot quietly cover for a reconstruction job that lost money.'},
 {t:'normal',k:'Block three',title:'Routine: discipline on a schedule, not in a pile.',body:'Transaction categorization, accounts-receivable procedure, and payroll run on a routine. The books stop being a year-end scramble and start being something you can trust in the middle of a normal week.'},
 {t:'normal',k:'Block four',title:'Strategize: use the data, do not just collect it.',body:'Revenue, gross profit, expenses and net profit get tracked as real metrics, with job-level P&Ls behind them, so decisions get made from numbers instead of from gut feel and a bank balance.'},
 {t:'quiet',title:'Four blocks build a company you can finally read. The fifth is what keeps you from losing it.'},

 {t:'section',idx:'Part Three',title:'Protect What The First Four Blocks Built'},
 {t:'normal',k:'Block five',title:'Protect: controls, fraud prevention, and a second set of eyes.',body:'Payment systems, fraud prevention, and a quarterly CPA review. A company that finally has clean numbers is worth protecting, and the fifth block is the one most owners skip because nothing has gone wrong yet.'},
 {t:'normal',k:'Why I teach it this way',title:'Because I’ve been the owner a buyer was actually evaluating.',body:'I built a restoration franchise, took it independent, and sold it for seven figures in 2017. Buyers do not pay for a business that looks busy. They pay for a business whose numbers they can trust, fast.'},
 {t:'normal',k:'And this is not just a restoration idea',title:'A clean set of books is worth the same thing in any business.',body:'I sold a second company, in insurance, in 2021. Different industry, same question from any buyer: can I trust these numbers fast. The five blocks are not a restoration trick. They are what any buyer, or any owner who finally wants to see the truth, is asking for.'},
 {t:'quiet',title:'A company you can read is a different asset than a company you can only run.'},

 {t:'normal',k:'Your next step',title:'Find out which block is actually missing in your own books.',body:'For most owners it is Foundation or Routine, and both are fixable this quarter with the right structure. The other blocks get easier once the numbers underneath them are finally true.'},
 {t:'cta',title:'Find out which of the five blocks your company is missing.',chips:['Book a strategy call with Scott'],disc:'Educational content only. No income, revenue, profit, or business outcome is guaranteed. Results vary by company, market, and execution.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="ledger ${kind==='title'?'title-ledger':'corner-ledger'}" viewBox="0 0 320 90"><use href="#ledger"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div><div class="d">${it.d}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Scott Miller &middot; <b>The Growth League</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
