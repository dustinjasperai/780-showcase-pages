<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grow Without Burning Out - Honeycomb Coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Pontano+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#fbfaf6; --panel:#f3f0e7; --ink:#3f404a; --muted:#6c6d77;
    --rule:#e4dfd0; --accent:#efe54f; --deep:#caa227;
    --head:'Spectral',Georgia,serif; --body:'Pontano Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d9d6cc;color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 14px 80px}
  .slide{position:relative;background:var(--ground);border:1px solid var(--rule);
    border-radius:14px;padding:64px 68px;margin:0 0 22px;min-height:480px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .slide::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
    background:
      radial-gradient(circle at 50% 50%, transparent 58%, var(--accent) 59% 66%, transparent 67%);
    opacity:.5;transform:rotate(8deg)}
  .kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--deep);
    font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.12;margin-bottom:18px}
  .promise{font-size:21px;color:var(--muted);margin-top:22px;max-width:30ch;font-family:var(--head);font-style:italic}
  p{font-size:19px;line-height:1.5;color:var(--ink);max-width:46ch}
  p.lead{font-size:23px}
  .big{font-family:var(--head);font-size:40px;line-height:1.16;font-weight:500;max-width:22ch}
  .big .hl{background:linear-gradient(transparent 62%, var(--accent) 62% 92%, transparent 92%)}
  ul{list-style:none;margin-top:14px}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:52ch}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;
    background:var(--accent);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  li b{font-weight:600}
  .num{font-family:var(--head);font-size:15px;color:var(--deep);font-weight:600;margin-bottom:10px;letter-spacing:.04em}
  .foot{position:absolute;left:68px;bottom:30px;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .cta{background:var(--panel)}
  .cta .btn{display:inline-block;margin-top:24px;background:var(--ink);color:var(--ground);
    font-weight:600;padding:15px 30px;border-radius:999px;font-size:17px}
  .disc{margin-top:30px;font-size:12.5px;color:var(--muted);max-width:60ch;line-height:1.5}
  .pager{position:absolute;right:66px;bottom:28px;font-size:12px;color:var(--muted)}
  @media(max-width:700px){.slide{padding:40px 30px}h1{font-size:36px}h2{font-size:28px}.foot{left:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Meah Arakaki',
    h:'Grow Without Burning Out',
    promise:'The regulated nervous system behind a business that lasts.'},

  {t:'for', kicker:'Who this is for',
    h:'For the woman building something while running on empty',
    p:'You love what you built. You also hit the goal and feel nothing but tired. You keep reaching for the next funnel, the next hire, the next 5am routine, and the exhaustion stays. This hour is for you.'},

  {t:'trap', kicker:'The trap',
    h:'You have been told the fix is more',
    p:'More output. More discipline. More strategy. So you add, and the depletion grows with the business. The quiet fear is that the only way to keep it running is to keep emptying yourself into it.'},

  {t:'body', kicker:'The things that did not fix it',
    h:'You have probably already tried',
    list:['A new funnel, a new offer, a fresh launch',
          'A VA, a hire, a system to take things off your plate',
          'The 5am routine, the discipline reset, the productivity app']},

  {t:'reframe', kicker:'The reframe',
    big:'Burnout is not a <span class="hl">time management</span> problem. It is a nervous system running the business from survival.'},

  {t:'part', num:'Part One', h:'The real problem',
    p:'When your nervous system is stuck in fight-or-flight, every decision comes from panic. You overwork, you people-please, you cannot rest even when there is time. No strategy installs on a dysregulated system. That is why the next tactic never holds.'},

  {t:'body', kicker:'What this actually costs',
    h:'The cost shows up everywhere',
    list:['<b>In the work</b> - reactive decisions, scattered focus, launches that drain you',
          '<b>In your people</b> - thinner patience, connection that feels like one more task',
          '<b>In your body</b> - tired-but-wired, poor sleep, the low hum of dread']},

  {t:'part', num:'Part Two', h:'The Honeycomb path',
    p:'Honeycomb coaching integrates four parts so growth stems from a calm and centered place, not depletion. These are the pillars we work through together over six months.'},

  {t:'pillar', num:'Pillar one', h:'Embodied Living',
    p:'We regulate the body first. You build awareness of your triggers and learn tools to settle your nervous system in real time, so you lead from steadiness instead of adrenaline.'},

  {t:'pillar', num:'Pillar two', h:'Inter-dynamic Connections',
    p:'Healthy relationship strategies and real support systems. The leaders who last are held by their relationships, not isolated by their ambition. We build that scaffolding on purpose.'},

  {t:'pillar', num:'Pillar three', h:'Connecting to Source and Purpose',
    p:'We clarify your passions and deeper purpose so your direction comes from values, not fear. When the why is clear and calm, the business stops being a treadmill and starts being an expression.'},

  {t:'pillar', num:'Pillar four', h:'Apply it to your focus',
    p:'The inner work is useless if it stays inside. Each part is applied to your specific business focus, week by week, so the regulation shows up as better decisions and real-world progress.'},

  {t:'concept', kicker:'The bigger picture',
    h:'Strengthening Hives',
    p:'Healthy women leaders create community-wide impact. When you grow from a regulated, centered place, you become a change-maker in your own community. Your health is not separate from your reach. It is the root of it.'},

  {t:'part', num:'Part Three', h:'What six months looks like',
    p:'Up to two sessions a month, remote or in person, each one meeting you where you are. We move from surviving to a steadier rhythm, and the growth that follows is growth you can actually hold.'},

  {t:'body', kicker:'The shift',
    h:'From running on empty to running on purpose',
    list:['Decisions made from a settled system, not a spike of panic',
          'Rest treated as the strategy that makes the work possible',
          'A business that expands without quietly costing you your health']},

  {t:'why', kicker:'Why Meah',
    h:'A therapist turned entrepreneur turned coach',
    p:'I spent years as a therapist learning how the nervous system actually works, then built and ran my own business and felt the depletion firsthand. Honeycomb is where those two things meet: real inner-work depth, applied to the reality of building something of your own.'},

  {t:'body', kicker:'In short',
    h:'The four parts, one calm center',
    list:['<b>Embodied Living</b> - regulate the body first',
          '<b>Inter-dynamic Connections</b> - relationships that hold you',
          '<b>Connecting to Source and Purpose</b> - direction from values, not fear',
          '<b>Apply it</b> - the inner work, lived out in your business']},

  {t:'promisekeep', kicker:'The promise',
    big:'You can experience a <span class="hl">new vitality</span> that never seemed possible, and keep growing from it.'},

  {t:'cta', kicker:'Your next step',
    h:'Book a call with Honeycomb Coaching',
    p:'If this is the way you want to grow, the next step is a short conversation. We will look at where you are, what is depleting you, and whether the six-month path is the right fit.',
    btn:'Book a call with Meah',
    disc:'This masterclass is educational. Nothing here is a promise of income, revenue, or any specific business or health result, and no outcome is guaranteed. Results vary with each person and their circumstances. Coaching is not therapy or medical care.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('div','slide'+(s.t==='cta'?' cta':''));
  if(s.kicker) sl.appendChild(el('div','kicker',s.kicker));
  if(s.num) sl.appendChild(el('div','num',s.num));
  if(s.h) sl.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));
  if(s.promise) sl.appendChild(el('div','promise',s.promise));
  if(s.big) sl.appendChild(el('div','big',s.big));
  if(s.p) sl.appendChild(el('p', s.t==='title'||s.t==='for'?'lead':null, s.p));
  if(s.list){const u=el('ul'); s.list.forEach(x=>u.appendChild(el('li',null,x))); sl.appendChild(u);}
  if(s.btn) sl.appendChild(el('span','btn',s.btn));
  if(s.disc) sl.appendChild(el('div','disc',s.disc));
  sl.appendChild(el('div','foot','Honeycomb Coaching'));
  sl.appendChild(el('div','pager',(i+1)+' / '+S.length));
  deck.appendChild(sl);
});
</script>
</body>
</html>
