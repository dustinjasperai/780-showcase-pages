<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AUDIT Principle — Jane Ann Craig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f0;
    --panel:#f1e8d8;
    --ink:#1f2733;
    --muted:#5b5a52;
    --rule:#ddd2bf;
    --accent:#9c7a3c;
    --serif:'Libre Baskerville',Georgia,serif;
    --sans:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 64px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:52px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .slide.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.dark .muted{color:#c9c6bd}
  .slide.panel{background:var(--panel)}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1.12;margin:0 0 18px}
  h2{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.18;margin:0 0 16px}
  h3{font-family:var(--serif);font-weight:700;font-size:23px;margin:0 0 10px}
  p{font-size:19px;line-height:1.55;margin:0 0 14px;max-width:62ch}
  .muted{color:var(--muted)}
  .big{font-size:25px;line-height:1.42}
  .step{display:flex;gap:20px;align-items:flex-start}
  .step .letter{font-family:var(--serif);font-weight:700;font-size:44px;color:var(--accent);line-height:1;width:54px;flex:none}
  ul{margin:8px 0 0;padding-left:0;list-style:none}
  ul li{font-size:19px;line-height:1.5;padding:9px 0 9px 26px;position:relative;border-top:1px solid var(--rule)}
  ul li:before{content:"";position:absolute;left:0;top:18px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .kicker{font-family:var(--sans);font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
  .foot{position:absolute;bottom:20px;left:56px;right:56px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px}
  .disclaimer{font-size:13px;color:var(--muted);line-height:1.5;max-width:70ch;margin-top:14px}
  .brandline{font-family:var(--serif);font-style:italic;color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',tone:'',eyebrow:'A live masterclass with Jane Ann Craig',h:'The AUDIT Principle',big:'Five steps to build a business you could actually sell, from someone who did it four times.'},
 {t:'promise',kicker:'What you will leave with',h:'A plan, not another to-do list',list:['The five-step method for turning effort into a business that holds its value','A clear read on where you are and the one gap between you and the next level','A simple way to decide what to build next, and what to stop doing']},
 {t:'who',kicker:'Who this is for',h:'Entrepreneurs and executives building on their own terms',p:['You have a real business and real customers. You are capable and you work hard. And still, some quiet part of you is not sure the thing you are building would be worth anything without you inside it every day.']},
 {t:'trap',kicker:'The trap',h:'Busy is not the same as going somewhere',p:['A teacher once told me I was floating down a river with no rudder and no sail. I was moving. I was just not choosing where. Most hardworking owners are on that same river, mistaking motion for direction.']},
 {t:'reframe',tone:'dark',eyebrow:'The reframe',h:'Hustle is a current. A plan is a rudder.',big:'The current will carry you somewhere either way. The only question is whether you picked the destination.'},
 {t:'part',tone:'panel',eyebrow:'Part One',h:'Why effort is not a plan'},
 {t:'problem',kicker:'The core problem',h:'No plan means no asset',p:['A business with no written plan is a job that depends on you. It cannot be handed off, scaled, or sold, because the whole operating system lives in your head.','The fix is not more effort. It is a plan clear enough that other people can run it, and clear enough that a buyer can see what they are buying.']},
 {t:'part',tone:'panel',eyebrow:'Part Two',h:'The AUDIT Principle'},
 {t:'step',kicker:'The AUDIT Principle',L:'A',h:'Assess',body:'Tell the truth about where you are right now. Revenue, time, energy, the parts you keep avoiding. You cannot plan a route without an honest starting point.'},
 {t:'step',kicker:'The AUDIT Principle',L:'U',h:'Understand',body:'Name the target and where you actually want to go, not where you think you should. Your real non-negotiables: autonomy, security, creativity, impact.'},
 {t:'step',kicker:'The AUDIT Principle',L:'D',h:'Decide',body:'Choose the vehicle that can get you there. The right offer, the right model, the right people. Most businesses stall because the vehicle was never chosen on purpose.'},
 {t:'step',kicker:'The AUDIT Principle',L:'I',h:'Imagine',body:'Map the plan with guideposts, so abstract ambition becomes a route you can follow. Once you have a plan you can follow it, and hand pieces to people better at them than you.'},
 {t:'step',kicker:'The AUDIT Principle',L:'T',h:'Tenacity',body:'The determination to see it through to the end. The plan carries you on the days motivation does not.'},
 {t:'delegate',kicker:'Why the plan is everything',h:'As long as you have a plan, you can follow it',p:['You do not have to be the expert at every part. Once the plan exists, you can hire the people who are, point them at the right guidepost, and keep moving. The plan is what makes delegation safe.']},
 {t:'part',tone:'panel',eyebrow:'Part Three',h:'A business that can stand without you'},
 {t:'looks',kicker:'When the plan is in place',h:'A business that runs on a plan, not on you',list:['You know the destination and the next three guideposts toward it','Work you are not the best at is handed to people who are','The business has value on paper, not just in your calendar']},
 {t:'why',kicker:'Why listen to me',h:'I built four companies from nothing, then sold all four',p:['I left a sixteen-year corporate career as a widow and single mother and built a portfolio of four healthcare and service companies, all of which were acquired by Blue Cross Blue Shield of South Carolina and Companion Life. I ran each as President and CEO.','The AUDIT Principle is the method underneath all of it.']},
 {t:'recap',kicker:'The five steps',h:'The AUDIT Principle, in one view',list:['Assess where you are, honestly','Understand your real target','Decide the vehicle to get there','Imagine the plan, with guideposts','Tenacity to see it through']},
 {t:'cta',tone:'',eyebrow:'Your next step',h:'Let us build your plan together',big:'If you want help running the AUDIT Principle on your own business, work with me directly. One-on-one, we build the plan and the guideposts, and keep you accountable to them.',brand:'Book a meeting at janeanncraig.com',disclaimer:'This masterclass is educational. No specific result is guaranteed. Results vary and depend on your own work, market, and decisions.'}
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function foot(i){return '<div class="foot"><span>The AUDIT Principle</span><span>Jane Ann Craig</span><span>'+(i+1)+' / '+S.length+'</span></div>'}
function paras(a){return (a||[]).map(function(x){return '<p>'+esc(x)+'</p>'}).join('')}
function items(a){return a&&a.length?('<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'):''}

function render(s,i){
 let c='';
 if(s.eyebrow) c+='<p class="eyebrow">'+esc(s.eyebrow)+'</p>';
 if(s.kicker) c+='<p class="kicker">'+esc(s.kicker)+'</p>';
 if(s.t==='step'){
   c+='<div class="step"><div class="letter">'+esc(s.L)+'</div><div><h3>'+esc(s.h)+'</h3><p>'+esc(s.body)+'</p></div></div>';
 } else {
   if(s.t==='part'){ c+='<h1>'+esc(s.h)+'</h1>'; }
   else if(s.t==='title'){ c+='<h1>'+esc(s.h)+'</h1>'; }
   else { c+='<h2>'+esc(s.h)+'</h2>'; }
   if(s.big) c+='<p class="big">'+esc(s.big)+'</p>';
   c+=paras(s.p);
   c+=items(s.list);
   if(s.brand) c+='<p class="brandline">'+esc(s.brand)+'</p>';
   if(s.disclaimer) c+='<p class="disclaimer">'+esc(s.disclaimer)+'</p>';
 }
 const cls=s.tone==='dark'?' dark':(s.tone==='panel'?' panel':'');
 return '<section class="slide'+cls+'">'+c+foot(i)+'</section>';
}
document.getElementById('deck').innerHTML=S.map(render).join('');
</script>
</body>
</html>
