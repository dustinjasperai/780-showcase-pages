<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Growth Continuum Masterclass · George Kingman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4f4f2; --panel:#e8e7e3; --rule:#d8d6d1;
    --accent:#de4343; --accent2:#463939; --ink:#2b2b2b; --grey:#4c4e56; --dim:#8a8a86;
  }
  html,body{height:100%}
  body{background:#141414;font-family:'Source Sans Pro',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#141414}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Poppins',sans-serif;font-weight:700;color:var(--ink);line-height:1.18;letter-spacing:-.005em}
  .t-title h1{font-size:4.3vw}
  .t-normal h1{font-size:2.9vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-size:1.7vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Source Sans Pro',sans-serif;font-size:1.4vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.1vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent2),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#3a2323 0%,#1c1414 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:2.9vw;max-width:80%;font-style:italic;color:#f3ece9;font-weight:400;font-family:'Poppins',sans-serif}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#2a1c1c 0%,#141414 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.5vw;max-width:82%;color:#f6f2ef}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent);color:#f0d3d3;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#a89f9c}
  .t-title .disc,.t-normal .disc{text-align:left}
  .step-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-step{right:7.5%;bottom:9%;width:17vw}
  .corner-step{right:6%;bottom:7.5%;width:7.5vw;opacity:.35}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#b8b4b0;z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#b8b4b0;z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#b8b4b0;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.3vw}.t-section h1{font-size:6.4vw}.t-dark h1{font-size:5vw}.t-cta h1{font-size:6.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">The Growth Continuum</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ascending tier-step motif: five rising bars, reflecting the Growth Continuum's staged placement -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="step" viewBox="0 0 260 130">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <rect x="18" y="98" width="26" height="20" fill="#de4343" opacity="0.55"/>
    <rect x="60" y="82" width="26" height="36" fill="#de4343" opacity="0.65"/>
    <rect x="102" y="64" width="26" height="54" fill="#de4343" opacity="0.75"/>
    <rect x="144" y="42" width="26" height="76" fill="#de4343" opacity="0.85"/>
    <rect x="186" y="18" width="26" height="100" fill="#de4343" opacity="1"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Growth Continuum Masterclass',sub:'Where your shop actually is right now, and the next real step from there, not someone else\'s system dropped onto your business.',brand:true,step:'title'},
 {t:'normal',k:'Who this is for',title:'Independent tire and automotive service shop owners running the day-to-day themselves.',body:'Owners who have already tried a generic playbook, a franchise manual, or a coach\'s one-size system, and watched it fit their shop about as well as it fits everyone else\'s.'},
 {t:'normal',k:'What you\'ll walk away with',title:'A clear, honest read on where your shop sits on the continuum, and what the next stage actually looks like.',body:'Three real practices for growing an independent shop on your own terms: matching your next move to where you actually are, giving yourself permission to experiment without fear, and building leadership instead of staying the shop\'s best technician forever.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'Every shop, market, and owner is different. What matters is the version of this that fits yours.',disc:'Educational content. Nothing here is a promise of income, hours, or business results. Results vary and no outcome is guaranteed.'},
 {t:'normal',k:'Who\'s teaching this',title:'George Kingman. Started as a teenage tire tech, now runs a multi-location group.',body:'Swept floors and changed oil before he ever coached anyone. Built BlueSky Tire and Auto Service to five locations in under five years, led the original 20 Group organization, and is CEO of Ted Wiens Tire today. Advanced Shop Leadership is what he built after seeing that program\'s one-size model up close.'},

 {t:'section',idx:'Part One',title:'Why One System Doesn\'t Fit Every Shop'},
 {t:'normal',k:'The standard pitch',title:'Most shop coaching sells the same promise: install this system, run your shop like everyone else\'s.',body:'It sounds simple in a sales call. It survives contact with a real shop a lot less often, because your team, your market, and your culture were never the ones the system was built around.'},
 {t:'normal',k:'A different starting point',title:'"I don\'t love systems. I find that everybody is unique."',body:'That is George\'s own line about why he builds coaching around the owner, not a fixed manual. A shop three years in and a shop twenty years in with five locations are not the same business with different furniture. They need different things.'},
 {t:'dark',title:'A system built for someone else\'s shop is a system built to fail in yours.'},
 {t:'normal',k:'The real cost',title:'Forcing a generic system onto a shop that does not fit it usually just adds a new problem on top of the old one.',body:'The manual gets filed away, the team goes back to how they actually work, and the owner is left thinking the problem was them, not the fit.'},

 {t:'section',idx:'Part Two',title:'The Growth Continuum'},
 {t:'normal',k:'Placement, not a fixed curriculum',title:'Coaching matched to where your shop actually is, from a newer owner finding their footing to an advanced multi-unit operator.',body:'George places owners on a continuum rather than running one curriculum for everyone in the room, so the work in front of you is the work that actually applies at your stage.'},
 {t:'normal',k:'Permission to experiment',title:'Blue Sky Thinking: named after his own shops, built on one simple permission.',body:'Try a change. If it does not work, you just change it back. That single idea removes most of the fear that keeps owners running their shop exactly the way they always have.'},
 {t:'dark',title:'"If you change it and you don\'t like it, you just change it back."'},
 {t:'normal',k:'Working ON the shop, not just in it',title:'Building the leadership capacity to step out of the bay, not just tolerating time away from it.',body:'The shift from being the best technician in the building to being the person who develops the team that runs it without you standing over every job.'},

 {t:'section',idx:'Part Three',title:'Proof From Real Independent Shops'},
 {t:'normal',k:'Owners already doing this',title:'Hogan Tire and Auto, Ralph\'s Tire Pros, and Steve Bass Tire are named examples on George\'s own site.',body:'Independent, tire-branded operators, the same kind of shop this continuum was built around, not a franchise template or a big-box chain.'},
 {t:'normal',k:'Why it holds up',title:'The coaching team is second and third-generation tire shop owners, not outside consultants.',body:'People who have actually stood behind a service counter, working alongside owners on the floor of their own stores, not just reviewing numbers from a spreadsheet.'},
 {t:'dark',title:'The goal was never to run someone else\'s shop better. It was to build yours on purpose.'},

 {t:'section',idx:'Where to start',title:'Find Your Place on the Continuum'},
 {t:'normal',k:'The next step',title:'20 Group+, 1-on-1 consulting, or teammate coaching, matched to your shop\'s stage.',body:'Advanced Shop Leadership places owners into the format that fits where they are right now, not a fixed package sold the same way to every shop.'},
 {t:'cta',title:'Build the shop that fits you, not the other way around.',chips:['Talk to Advanced Shop Leadership','advancedshopleadership.com'],disc:'Educational content only. No income, hours, or business result is guaranteed. Results vary by shop and market.'},
];

const deck=document.getElementById('deck');
function stepMotif(kind){return `<svg class="step-motif ${kind==='title'?'title-step':'corner-step'}"><use href="#step"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The <b>Growth Continuum</b> &middot; George Kingman</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.step) h+=stepMotif(s.step);
  else if(s.t==='title') h+=stepMotif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
