<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearing From God: Clarity Before Strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Chivo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7;      /* warm near-white, from her light site bg */
    --panel:#f0eeea;   /* quiet tint of the ground */
    --accent:#2c3e50;  /* her one saturated brand color (slate blue) */
    --ink:#2b2b2b;     /* near her #474747 heading gray */
    --muted:#6c6c6c;   /* her dominant body gray */
    --rule:#d8d4cc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Chivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:64px 56px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .kick{font-family:'Spectral',Georgia,serif;font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:48px;line-height:1.08;color:var(--ink);margin-bottom:18px}
  h2{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:34px;line-height:1.14;color:var(--ink);margin-bottom:18px}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:60ch;margin-bottom:14px}
  p.lead{font-size:22px;color:var(--ink)}
  .sub{font-family:'Spectral',Georgia,serif;font-weight:500;font-size:20px;color:var(--accent)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:12px 0 12px 26px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:21px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  li b{font-family:'Spectral',Georgia,serif;font-weight:700}
  .big{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:40px;line-height:1.12;color:var(--ink);max-width:22ch}
  .panel{background:var(--panel);border-radius:10px;padding:26px 30px;margin-top:18px}
  .num{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:14px;color:var(--accent);letter-spacing:.1em}
  .cta-steps{font-size:19px;color:var(--ink);line-height:1.7;margin-top:8px}
  .disc{font-size:13px;color:var(--muted);margin-top:28px;max-width:70ch;line-height:1.5}
  .foot{position:absolute;right:28px;bottom:20px;font-family:'Spectral',Georgia,serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--rule)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kick:'A Live Masterclass with Cherlyn Decker',h:'Hearing From God',sub:'Clarity Before Strategy'},
 {t:'promise',kick:'The Promise',h:'In the next hour',p:'You will learn a repeatable way to hear God’s direction on the decision in front of you, before you reach for a plan. Not a feeling. A practice you can run every time.'},
 {t:'who',kick:'Who This Is For',h:'The capable, prayerful, and still stuck',p:'Christian women leading in the marketplace:',li:['Corporate leaders and entrepreneurs','Real estate pros, doctors, nurses, teachers','Authors, artists, nonprofit and ministry leaders']},
 {t:'trap',kick:'The Trap',h:'You already do the work',p:'You make the pros and cons list. You ask the smart people. You pray about it. And you still do not have peace about the decision.'},
 {t:'hook',kick:'The Reframe',big:'The problem was never your strategy. It is that you strategize before you have heard.'},
 {t:'part',kick:'Part One',h:'Why confidence keeps running out',p:'Confidence built on competence, credentials, or applause holds up fine until the decision gets big. Then it borrows against things that can be taken away.'},
 {t:'identity',kick:'The Root',big:'True confidence is knowing who God says you are.',p:'Identity first. Everything you build on top of a borrowed identity wobbles under weight.'},
 {t:'part',kick:'Part Two',h:'The Kingdom Confidence framework',p:'Four shifts that move you from borrowed confidence to God-given certainty. We will name all four, then go deep on the one that unlocks the rest.'},
 {t:'pillar',num:'PILLAR 01',h:'Faith',p:'Stand on who God says you are, not on the last result or the loudest critic. Faith is the ground the other three pillars are built on.'},
 {t:'pillar',num:'PILLAR 02',h:'Clarity',p:'Hear His direction for your actual next step. Clarity is not a vague sense of calling, it is specific guidance for the decision you are holding today.'},
 {t:'pillar',num:'PILLAR 03',h:'Purpose',p:'Lead from calling, not comparison. When you know what you are for, you stop running someone else’s race in your own business.'},
 {t:'pillar',num:'PILLAR 04',h:'Confidence',p:'Show up certain, not striving. Confidence is the overflow of the first three, not a performance you have to keep up.'},
 {t:'part',kick:'Part Three',h:'How to actually hear Him',p:'Clarity is the pillar most women skip, so here is the method, four moves you can run on any decision.'},
 {t:'step',num:'STEP 01',h:'Get quiet',p:'Clear the noise first. Most of what feels like God’s silence is our own stinking thinking crowding Him out. Take out the trash of the mind before you listen.'},
 {t:'step',num:'STEP 02',h:'Ask',p:'Bring the real decision, not a tidy version of it. Name the fear and the deadline out loud, then ask Him plainly.'},
 {t:'step',num:'STEP 03',h:'Confirm',p:'Test what you hear against His Word and His character. Real guidance agrees with Scripture and brings peace, not pressure.'},
 {t:'step',num:'STEP 04',h:'Act',p:'Take the Spirit-led next step while it is still a little scary. Clarity you do not obey quietly fades. Obedience is how you learn His voice faster next time.'},
 {t:'example',kick:'When The Decision Is Due',h:'The Friday decision',p:'A leader paralyzed by a deadline runs the four moves. She gets quiet, brings the real fear, tests the answer against the Word, and acts. The decision does not get easier. She stops making it alone.'},
 {t:'why',kick:'Your Guide',h:'Cherlyn Decker',p:'JD, PCC, CPLC. For about fifteen years Cherlyn has helped women hear, experience, and lead from the Voice of clarity, grounding everything in Jesus and the Word of God. Prophetic and Spirit-led, honest about the hard parts.'},
 {t:'cta',kick:'Your Next Step',h:'Ready to lead from clarity?',steps:['Apply for Coaching with Cherlyn, one on one and Spirit-led.','Book your complimentary fit call to see if it is right.','Start making the next big decision with Him, not alone.'],disc:'This masterclass is for education and encouragement. It is not financial, legal, medical, or mental-health advice, and no specific outcome or result is guaranteed. Results vary.'}
];
const deck=document.getElementById('deck');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let h='';
  if(s.kick)h+=`<div class="kick">${esc(s.kick)}</div>`;
  if(s.num)h+=`<div class="num">${esc(s.num)}</div>`;
  if(s.t==='title'){h+=`<h1>${esc(s.h)}</h1><div class="sub">${esc(s.sub)}</div>`}
  else if(s.big||s.t==='hook'||s.t==='identity'){h+=`<div class="big">${esc(s.big)}</div>`}
  if(s.h && s.t!=='title'){h+=`<h2>${esc(s.h)}</h2>`}
  if(s.p)h+=`<p class="lead">${esc(s.p)}</p>`;
  if(s.li){h+='<ul>'+s.li.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'}
  if(s.steps){h+='<div class="panel"><div class="cta-steps">'+s.steps.map((x,n)=>`${n+1}. ${esc(x)}`).join('<br>')+'</div></div>'}
  if(s.disc)h+=`<div class="disc">${esc(s.disc)}</div>`;
  h+=`<div class="foot">Kingdom Life Coach</div>`;
  d.innerHTML=h;deck.appendChild(d);
});
</script>
</body>
</html>
