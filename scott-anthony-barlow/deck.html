<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happen To Your Career — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f2337;        /* deeper shade of brand navy #1b3454 */
    --panel:#1b3454;     /* brand dominant navy */
    --rule:#2c4a6b;      /* lifted navy hairline */
    --accent:#22b4ab;    /* brand teal */
    --ink:#eef4f9;
    --muted:#9fb2c4;
    --display:'Space Grotesk',system-ui,sans-serif;  /* echoes brand niveau-grotesk */
    --body:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 56px;margin:0 0 26px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:attr(data-n);position:absolute;top:22px;right:28px;
    font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.14em}
  .kicker{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-.01em}
  h3{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.15;color:var(--accent)}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:44ch}
  p.lead{font-size:23px;color:var(--muted);margin-top:22px;max-width:46ch}
  .sub{font-size:19px;color:var(--muted);margin-top:16px;max-width:48ch}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
  li{font-size:20px;line-height:1.4;padding-left:30px;position:relative;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;
    border:2px solid var(--accent);border-radius:50%}
  .big{font-family:var(--display);font-weight:700;font-size:64px;color:var(--accent);line-height:1}
  .title-slide{align-items:flex-start}
  .title-slide h1{font-size:60px;max-width:16ch}
  .byline{margin-top:auto;padding-top:34px;font-family:var(--display);font-size:16px;color:var(--muted);letter-spacing:.04em}
  .byline b{color:var(--ink);font-weight:600}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:32px}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:24px}
  .card .num{font-family:var(--display);color:var(--accent);font-weight:700;font-size:22px;margin-bottom:10px}
  .card p{font-size:16px;color:var(--muted);max-width:none}
  .path{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
  .path span{font-family:var(--display);font-size:17px;background:var(--bg);border:1px solid var(--rule);
    border-radius:999px;padding:12px 18px;color:var(--ink)}
  .path span.on{border-color:var(--accent);color:var(--accent)}
  .cta-slide{background:linear-gradient(160deg,#12395a,#0f2337)}
  .cta-slide h2{font-size:44px;max-width:18ch}
  .cta-btn{margin-top:30px;display:inline-block;font-family:var(--display);font-weight:600;
    background:var(--accent);color:#06202a;padding:16px 30px;border-radius:12px;font-size:19px;width:fit-content}
  .disclaimer{margin-top:34px;font-size:13px;color:var(--muted);max-width:58ch;line-height:1.5}
  @media(max-width:640px){.slide{padding:34px 24px;min-height:auto}h1{font-size:38px}.title-slide h1{font-size:40px}h2{font-size:29px}.three{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Happen To Your Career Masterclass',
   h1:'Stop Settling: How Happy High Achievers Change Careers Without Starting Over',
   by:'Scott Anthony Barlow &middot; <b>Happen To Your Career</b>'},

  {t:'promise', kicker:'What this hour gives you', h2:'A different starting point than "fix your resume and apply to more jobs."',
   lead:'By the end you will know the three things fulfilled high performers do differently, and the first two steps to build a career around your actual strengths.'},

  {t:'who', kicker:'Who this is for', h2:'You are good at what you do. You are also quietly done with it.',
   list:['Experienced professionals, usually a few years in, who are respected and well paid',
         'People who feel the pull toward more meaningful work but will not blow up their income to get it',
         'High performers who are unwilling to settle, and unwilling to gamble']},

  {t:'trap', kicker:'The trap', h2:'Being good at your job is exactly what keeps you stuck in it.',
   lead:'The better you perform, the more the role rewards you for staying. Competence becomes a comfortable cage, and the exit keeps getting more expensive to imagine.'},

  {t:'reframe', kicker:'The reframe', h2:'The traditional job search runs backwards.',
   lead:'It starts with what is posted, then asks you to bend yourself to fit it. That is why it feels like settling. We are going to start from the other end: you first, roles second.'},

  {t:'part', kicker:'Part One', h2:'The core problem', sub:'Why "update the resume and apply to more openings" fails people like you.'},

  {t:'content', kicker:'Part One', h3:'You are optimizing the wrong thing',
   p:'A resume and a stack of applications answer the question "what jobs exist?" They never answer "what work actually fits me?" So high performers land the next title, feel the same emptiness in eight months, and conclude that meaningful work is a fantasy. It is not. They just never defined the target.'},

  {t:'part', kicker:'Part Two', h2:'The unconventional approach', sub:'The method behind Happy High Achievers, in four moves.'},

  {t:'pillar', kicker:'Move 1', h3:'Signature Strengths',
   p:'After more than ten years of studying strengths, one thing holds every time: there is no one who does not have signature strengths. Before we talk roles, we find yours and learn to name them plainly. You build the career around what you already do best, not around a job title someone else wrote.'},

  {t:'pillar', kicker:'Move 2', h3:'Your Ideal Career Profile',
   p:'Next you write it down: the values you will not trade, the purpose that pulls you, the environment you do your best work in. Now you have a profile. From here you evaluate roles against your profile, instead of contorting yourself to fit whatever happens to be open.'},

  {t:'three-up', kicker:'Move 3', h3:'Happy High Achievers know three things you do not',
   cards:[{num:'01', h:'What they want', p:'They got specific about what they actually want from work and life, on paper, before searching.'},
          {num:'02', h:'How to bring it to market', p:'They know how to translate their strengths into something an employer sees as clearly valuable.'},
          {num:'03', h:'Unconventional wins', p:'They stopped relying on the traditional search, because the unconventional path consistently works better.'}]},

  {t:'pillar', kicker:'Move 4', h3:'Test Driving Your Career',
   p:'You do not guess a career from the outside. You test drive it: real conversations, informational interviews, small experiments with people already doing the work. You gather evidence before you commit, so the change feels like a calculated step, not a leap in the dark.'},

  {t:'part', kicker:'Part Three', h2:'From your strengths to an offer that fits', sub:'The throughline, from where you are now to work you are enamored with.'},

  {t:'path', kicker:'The path', h2:'Profile first. Opening last.',
   steps:['Signature Strengths','Ideal Career Profile','Test Drive','Leverage Relationships','Interview & Negotiate','An offer that fits'],
   on:1},

  {t:'reframe', kicker:'Without starting over', h2:'You are not throwing away your experience. You are pointing it somewhere it counts.',
   lead:'Career change without starting over means the years you have already invested become leverage. The goal is not a reset. It is alignment.'},

  {t:'why', kicker:'Why listen to this', h2:'This is not theory.',
   list:['Happen To Your Career podcast, 750+ episodes of real career changers and experts',
         'A team that has worked with 25,000+ people to find meaningful, well paid work',
         'Featured in CNBC, Forbes, Fast Company, HuffPost and Glassdoor']},

  {t:'shift', kicker:'The shift', h2:'From "what is open?" to "what fits me, and how do I get there?"',
   lead:'That one change in the question is the difference between another job and work you are genuinely enamored with.'},

  {t:'cta', kicker:'Your next step', h2:'Ready to build a career around your strengths?',
   lead:'If this is the direction you want, the next move is a conversation. We will look at where you are, where you want to go, and whether a structured path makes sense for you.',
   btn:'Schedule a 45-minute conversation',
   disclaimer:'This masterclass is for educational purposes only. It shares an approach to career change and does not guarantee any specific job, salary, or outcome. Results vary by individual, effort, and circumstances.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta-slide':'');
  el.setAttribute('data-n', String(i+1).padStart(2,'0'));
  let h = '';
  if(s.kicker) h += `<div class="kicker">${s.kicker}</div>`;
  if(s.h1) h += `<h1>${s.h1}</h1>`;
  if(s.h2) h += `<h2>${s.h2}</h2>`;
  if(s.h3) h += `<h3>${s.h3}</h3>`;
  if(s.p) h += `<p>${s.p}</p>`;
  if(s.lead) h += `<p class="lead">${s.lead}</p>`;
  if(s.sub) h += `<p class="sub">${s.sub}</p>`;
  if(s.list){ h += '<ul>'; s.list.forEach(x=> h += `<li>${x}</li>`); h += '</ul>'; }
  if(s.cards){ h += '<div class="three">'; s.cards.forEach(c=> h += `<div class="card"><div class="num">${c.num}</div><h3 style="font-size:19px;color:var(--ink)">${c.h}</h3><p>${c.p}</p></div>`); h += '</div>'; }
  if(s.steps){ h += '<div class="path">'; s.steps.forEach((x,ix)=> h += `<span class="${ix===s.on?'on':''}">${x}</span>`); h += '</div>'; }
  if(s.btn) h += `<span class="cta-btn">${s.btn}</span>`;
  if(s.disclaimer) h += `<div class="disclaimer">${s.disclaimer}</div>`;
  if(s.by) h += `<div class="byline">${s.by}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
