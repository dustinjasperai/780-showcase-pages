<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break the Conflict Cycle - A Thriving Kingdom Marriage Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec; --panel:#efe8d8; --ink:#212121; --olive:#4e5935; --gold:#fbc401;
    --muted:#5c5a4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Open Sans',sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid #e3dcc8;border-radius:14px;padding:56px 52px;
    margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 #fff inset, 0 10px 30px rgba(78,89,53,.06)}
  .kicker{font-family:'Open Sans';font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--olive);margin-bottom:18px}
  h1{font-family:'Cardo',serif;font-weight:700;font-size:52px;line-height:1.06;color:var(--olive)}
  h2{font-family:'Cardo',serif;font-weight:700;font-size:38px;line-height:1.12;color:var(--olive)}
  .promise{font-family:'Cardo',serif;font-style:italic;font-size:24px;color:var(--ink);margin-top:20px}
  p.body{font-size:20px;line-height:1.5;color:var(--ink);margin-top:16px;max-width:40em}
  .rule{height:4px;width:64px;background:var(--gold);border-radius:3px;margin:22px 0}
  ul{margin:18px 0 0 0;list-style:none}
  li{font-size:20px;line-height:1.45;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid #e7e0cd}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;background:var(--gold);
    border-radius:3px;transform:rotate(45deg)}
  li b{font-family:'Cardo',serif;color:var(--olive);font-weight:700}
  .quote{font-family:'Cardo',serif;font-style:italic;font-size:34px;line-height:1.25;color:var(--olive)}
  .phase{font-family:'Cardo',serif;font-size:72px;color:var(--gold);font-weight:700;opacity:.9}
  .foot{margin-top:28px;font-size:14px;color:var(--muted)}
  .disc{margin-top:22px;font-size:14px;color:var(--muted);max-width:44em;line-height:1.5}
  .cta-step{display:inline-block;margin-top:22px;font-family:'Cardo',serif;font-size:22px;
    color:var(--ink);border-left:4px solid var(--gold);padding:6px 0 6px 16px}
  .num{font-family:'Open Sans';font-size:13px;color:var(--muted);letter-spacing:.1em;margin-top:30px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title',
    kicker:'A Thriving Kingdom Marriage Masterclass',
    h:'Break the Conflict Cycle',
    promise:'Why the same fight keeps coming back in a Christian marriage, and the first move that breaks it.'},

  {t:'who',
    kicker:'Who this is for',
    h:'The couple having the same fight on repeat',
    body:'You love God. You love each other. And yet you keep landing in the exact same argument, worded a little differently each time. This hour is for you.'},

  {t:'list',
    kicker:'You have already tried',
    h:'The usual fixes, and they keep sliding back',
    items:[
      '<b>Communication tips.</b> Use I-statements, listen better. It helps for a week.',
      '<b>Date nights.</b> A good night, then the old pattern returns by the weekend.',
      '<b>Another marriage book.</b> Highlighted, underlined, and still stuck.',
      '<b>Praying it away.</b> Real and good, and still the fight comes back.'],
    foot:'None of these are wrong. They just treat the surface, not what is underneath.'},

  {t:'quote',
    kicker:'The reframe',
    quote:'The problem was never the argument. It is the cycle underneath it.'},

  {t:'section', phase:'01', kicker:'Part One', h:'The core problem: a predictable loop'},

  {t:'list',
    kicker:'The conflict cycle',
    h:'Every repeat fight runs the same four steps',
    items:[
      '<b>A trigger</b> touches an old wound, often from long before you met.',
      '<b>A reaction</b> fires before you choose it. Raise your voice, or go quiet.',
      '<b>A withdrawal</b> as one pursues and the other pulls away.',
      '<b>Resentment settles,</b> and the next trigger lands harder. Then it repeats.'],
    foot:'It feels personal. It is actually predictable. That is the good news.'},

  {t:'list',
    kicker:'Why the tips fail',
    h:'You cannot out-technique a cycle you have not named',
    items:[
      '<b>Surface tools</b> change the words. The cycle changes the words right back.',
      '<b>The real driver</b> is the wound and the pattern, not the sentence you chose.',
      '<b>Name the loop first.</b> Then the communication tools finally hold.'],
    foot:'This is the shift most couples never get taught.'},

  {t:'section', phase:'02', kicker:'Part Two', h:'The Thriving Marriage Blueprint'},

  {t:'who', kicker:'The framework', h:'Five phases, in order',
    body:'This is the path we walk couples through. Each phase builds on the last, which is why it holds when the next hard week comes.'},

  {t:'phasecard', phase:'01', kicker:'Phase One', h:'Build a Strong Foundation',
    body:'Understand God’s design for marriage, strengthen your spiritual foundation, and break from the worldly scripts you absorbed about what marriage should be.'},

  {t:'phasecard', phase:'02', kicker:'Phase Two', h:'Heal Your Heart',
    body:'Name the past wounds that keep getting triggered, learn to process emotion in a healthy way, and bring your own heart into alignment with God’s truth before you work on the couple.'},

  {t:'phasecard', phase:'03', kicker:'Phase Three', h:'Master Godly Communication',
    body:'Build clarity in how you speak, learn to move through conflict with maturity instead of escalation, and create intentional rhythms of connection you actually keep.'},

  {t:'phasecard', phase:'04', kicker:'Phase Four', h:'Embrace Your Differences',
    body:'You are not incompatible. You are complementary. Understand the strengths God built into each of you and learn to complete one another instead of competing.'},

  {t:'phasecard', phase:'05', kicker:'Phase Five', h:'Flourish As A Team',
    body:'Recognize the fruit of the work, set rhythms that are sustainable, and step into a shared mission and kingdom purpose that is bigger than the two of you.'},

  {t:'quote', kicker:'How the blueprint breaks the loop',
    quote:'When you heal the wound and name the pattern, the trigger stops running the house.'},

  {t:'section', phase:'03', kicker:'Part Three', h:'What a thriving marriage looks like'},

  {t:'list', kicker:'On the other side of the cycle',
    h:'Not a perfect marriage. A thriving one.',
    items:[
      '<b>The same trigger lands</b> and you both see the pattern instead of falling into it.',
      '<b>Repair is faster,</b> because you are fighting the cycle, not each other.',
      '<b>Connection is a rhythm,</b> not a rescue mission after every blow-up.',
      '<b>Your marriage has a mission,</b> and your kids are watching you live it.'],
    foot:'This is what we built our own marriage back into. It is why we teach it.'},

  {t:'who', kicker:'Why us', h:'Nick and Haley Teixeira',
    body:'We hit the same wall. Shared faith, and still disconnected by triggers, miscommunication, and unspoken expectations. We invited God into the deepest parts of our marriage, did the work in this order, and rebuilt it. Now we coach couples internationally and host the Thriving Kingdom Marriage podcast, ranked in the top 1.5 percent of shows worldwide.'},

  {t:'cta', kicker:'Your next step',
    h:'Ready to name your cycle and break it?',
    step:'Register for the live masterclass, then apply for the Thriving Kingdom Marriage Mastery program.',
    disc:'This masterclass is educational. No income, outcome, or specific marriage result is guaranteed. Results vary and depend on your own circumstances, effort, and the work you put in together.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const app=document.getElementById('app');
S.forEach((s,i)=>{
  const d=el('div','slide');
  if(s.kicker) d.appendChild(el('div','kicker',s.kicker));
  if(s.t==='title'){d.appendChild(el('h1',null,s.h)); d.appendChild(el('div','rule')); d.appendChild(el('div','promise',s.promise));}
  else if(s.t==='section'){ if(s.phase) d.appendChild(el('div','phase',s.phase)); d.appendChild(el('h2',null,s.h)); d.appendChild(el('div','rule'));}
  else if(s.t==='phasecard'){ d.appendChild(el('div','phase',s.phase)); d.appendChild(el('h2',null,s.h)); d.appendChild(el('div','rule')); d.appendChild(el('p','body',s.body));}
  else if(s.t==='who'){d.appendChild(el('h2',null,s.h)); d.appendChild(el('div','rule')); d.appendChild(el('p','body',s.body));}
  else if(s.t==='quote'){d.appendChild(el('div','quote',s.quote));}
  else if(s.t==='list'){ d.appendChild(el('h2',null,s.h)); const ul=el('ul'); s.items.forEach(it=>ul.appendChild(el('li',null,it))); d.appendChild(ul); if(s.foot) d.appendChild(el('div','foot',s.foot));}
  else if(s.t==='cta'){d.appendChild(el('h2',null,s.h)); d.appendChild(el('div','rule')); d.appendChild(el('div','cta-step',s.step)); d.appendChild(el('div','disc',s.disc));}
  d.appendChild(el('div','num','Slide '+(i+1)+' of '+S.length));
  app.appendChild(d);
});
</script>
</body>
</html>
