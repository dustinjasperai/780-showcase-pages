<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wade Well — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbf9;
    --panel:#f3f1ec;
    --rule:#e4e0d8;
    --ink:#1a1a1a;
    --grey:#6b6b6b;
    --accent:#36b3a8;
    --deep:#1f5e59;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:#ffffff;border:1px solid var(--rule);border-radius:14px;
    padding:46px 46px;margin:18px 0;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .slide.feature{background:var(--panel)}
  .kick{font-family:"Inter";font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin:0 0 14px}
  h1{font-family:"EB Garamond",Georgia,serif;font-weight:600;font-size:46px;line-height:1.08;
    margin:0 0 14px;letter-spacing:-.01em}
  h2{font-family:"EB Garamond",Georgia,serif;font-weight:600;font-size:32px;line-height:1.12;
    margin:0 0 12px}
  p{font-size:18px;line-height:1.6;color:#2a2a2a;margin:0 0 12px;max-width:62ch}
  .lead{font-size:21px;color:#222}
  .rule{height:2px;width:64px;background:var(--accent);border:0;margin:18px 0}
  ul{margin:8px 0 0;padding:0 0 0 2px;list-style:none}
  li{font-size:18px;line-height:1.5;padding:10px 0 10px 26px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .big{font-family:"EB Garamond",Georgia,serif;font-style:italic;font-size:30px;line-height:1.25;color:var(--deep)}
  .cta{background:var(--deep);color:#f4fbfa;border-color:var(--deep)}
  .cta .kick{color:#8fded4}
  .cta h2{color:#ffffff}
  .cta p{color:#dcefec}
  .btn{display:inline-block;margin-top:10px;background:var(--accent);color:#06251f;font-weight:600;
    padding:12px 22px;border-radius:999px;text-decoration:none}
  .disc{font-size:13px;color:#bcd9d4;margin-top:22px;max-width:60ch}
  .meta{font-size:13px;color:var(--grey);margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'Wade Well · A Live Masterclass',
   h:'Train Your Body for the Best Fishing Years of Your Life',
   p:'The best angling of your life is still in front of you, if your body is prepared to meet it.'},

  {t:'promise',
   h:'One hour, one promise',
   p:'By the end of this session you will understand why fly fishing is an athletic act, the three things that quietly cut a day on the water short, and a simple, neuro-informed way to train for the river so you fish longer and hurt less.'},

  {t:'who',
   h:'Who this is for',
   p:'The angler who still wants the two-mile hike to the far bank. The guide whose body is their job. Anyone who has felt a good day end early because their back, knees, or balance gave out before the fish did.'},

  {t:'trap',
   h:'You think it is your cast. It is your body.',
   p:'We obsess over gear, flies, and mending. Meanwhile the thing that decides how long and how well you fish is the body holding the rod, standing in current, carrying the pack, hour after hour.'},

  {t:'reframe', feature:true,
   h:'Fly fishing is athletic movement.',
   big:'Whether you call it that or not, wading moving water, holding a stance, and casting all day are athletic demands. Train for them and the river stops winning.'},

  {t:'part', kick:'Part One',
   h:'Why the river wins',
   p:'Three demands quietly stack up over a day on the water, and almost no angler trains for any of them.'},

  {t:'list',
   h:'The three things that cut a day short',
   items:['Balance under load, in current, on uneven rock','Joint durability in the hips, knees, back, and feet','Recovery, so day two feels like day one']},

  {t:'detail',
   h:'What the water actually asks',
   p:'Wading a current is a constant balance task. An athletic casting stance loads the hips and spine. A loaded pack changes your posture for miles. Hours of it is endurance. None of that is trained by a generic gym workout.'},

  {t:'reframe',
   h:'Clumsy is not a personality trait',
   big:'Losing your footing is not who you are. It is a balance system that was never trained. Balance and proprioception respond to practice like any other skill.'},

  {t:'part', kick:'Part Two',
   h:'The Wade Well Method',
   p:'A neuro-informed system built for how anglers move, fatigue, and recover, not a fitness plan borrowed from somewhere else.'},

  {t:'list', feature:true,
   h:'The four pillars',
   items:['Casting biomechanics, so the stroke stops costing your shoulder and back','Wading stability and balance, trained with real sensory and vestibular drills','Nervous-system regulation, so you stay calm and steady under load','Joint durability, foot restoration, and recovery for the long game']},

  {t:'pillar',
   h:'Pillar one: casting biomechanics',
   p:'How you organize the hips, trunk, and shoulder across a day of casting decides whether the stroke builds your body or wears it down. We train the pattern, not just the muscle.'},

  {t:'pillar',
   h:'Pillar two: balance that holds in current',
   p:'Standing in moving water on loose rock is a sensory problem before it is a strength problem. Applied balance and vestibular work retrain the system that keeps you upright and confident.'},

  {t:'pillar',
   h:'Pillar three: the neuro-informed lens',
   p:'This is the part most mobility programs skip. Nervous-system regulation changes how you fatigue and how fast you recover, which is why the method goes deeper than stretch-and-strengthen.'},

  {t:'pillar',
   h:'Pillar four: durability and recovery',
   p:'Foot restoration, joint strength, sleep and recovery practices. The unglamorous work that turns a handful of good seasons into decades on the water.'},

  {t:'part', kick:'Part Three',
   h:'What it takes',
   p:'Less than you think, done consistently, with no gym required.'},

  {t:'detail',
   h:'Ten minutes, no gym, by the water',
   p:'The work fits in short daily sessions you can do at home, at the lodge, or on the bank. A mat and a band are enough. Consistency beats intensity, and the method is built around that reality.'},

  {t:'why',
   h:'Why trust this method',
   p:'Fifteen-plus years training outdoor and competitive athletes, a Functional Range Conditioning mobility specialist, MovNat and Yoga Medicine certified, a certified fly fishing guide, and an angler who has consulted for Patagonia, Arc'teryx, and lululemon. This is built from the water up.'},

  {t:'shift',
   h:'Fish longer. Hurt less. The best years ahead.',
   big:'When the body is prepared to meet the river, the day stops ending early, and the best angling of your life really is still in front of you.'},

  {t:'cta', kick:'Your next step',
   h:'Start training for the water',
   p:'Join the Wade Well Studio and start with the foundations, or reach out about 1:1 and destination-trip coaching. Begin with a free trial and your first balance session this week.',
   btn:'Join the Wade Well Studio',
   disc:'No specific fishing, fitness, or health result is guaranteed. Results vary by individual, effort, and starting point. This masterclass is educational and is not medical advice; consult a professional before beginning any new movement program.'}
];

const deck = document.getElementById('deck');
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.feature?' feature':'') + (s.t==='cta'?' cta':'');
  let html = '';
  if(s.kick) html += '<p class="kick">'+s.kick+'</p>';
  if(s.h) html += (s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.t==='title' || s.t==='reframe' || s.t==='shift') html += '<hr class="rule">';
  if(s.big) html += '<p class="big">'+s.big+'</p>';
  if(s.p) html += '<p'+((s.t==='title'||s.t==='promise')?' class="lead"':'')+'>'+s.p+'</p>';
  if(s.items){ html += '<ul>'; for(const it of s.items) html += '<li>'+it+'</li>'; html += '</ul>'; }
  if(s.btn) html += '<a class="btn" href="https://lindsaykocka.com">'+s.btn+'</a>';
  if(s.disc) html += '<p class="disc">'+s.disc+'</p>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
