<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Launch Your Interior Design Business the Right Way - Rebecca Ward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5EFE6;        /* warm cream ground - everyday-luxury neutral */
    --panel:#EADFCF;     /* deeper warm sand */
    --ink:#2B2724;       /* warm espresso near-black */
    --rule:#C9B79C;      /* warm sand rule */
    --accent:#A6613F;    /* muted terracotta - her color-as-personality signature */
    --muted:#6B6258;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto}
  .slide{min-height:88vh;display:flex;flex-direction:column;justify-content:center;
    padding:7vh 7vw;border-bottom:1px solid var(--rule);position:relative}
  h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.08;color:var(--ink)}
  h1{font-size:clamp(2.4rem,6vw,4.4rem)}
  h2{font-size:clamp(2rem,4.5vw,3.2rem)}
  h3{font-size:clamp(1.4rem,3vw,2rem)}
  .kicker{font-family:"Mulish";font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:.78rem;color:var(--accent);margin-bottom:1.4rem}
  .lead{font-size:clamp(1.05rem,2vw,1.35rem);color:var(--muted);max-width:40ch;margin-top:1.4rem}
  .num{font-family:"Cormorant Garamond";font-size:clamp(3rem,8vw,6rem);color:var(--accent);opacity:.9;line-height:1}
  ul{list-style:none;margin-top:1.8rem;display:grid;gap:1rem;max-width:46ch}
  li{position:relative;padding-left:1.6rem;font-size:1.1rem}
  li:before{content:"";position:absolute;left:0;top:.6em;width:.55rem;height:.55rem;background:var(--accent);border-radius:50%}
  .pillars{display:grid;gap:1.2rem;margin-top:2rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .pillar{background:var(--panel);border-radius:14px;padding:1.6rem}
  .pillar h3{color:var(--accent);margin-bottom:.5rem}
  .pillar p{color:var(--muted);font-size:1rem}
  .tag{display:inline-block;background:var(--panel);color:var(--muted);border-radius:999px;
    padding:.35rem .9rem;font-size:.82rem;font-weight:600;margin:.3rem .3rem 0 0}
  .cta-box{background:var(--ink);color:var(--bg);border-radius:18px;padding:3rem;margin-top:1rem}
  .cta-box h2{color:var(--bg)}
  .cta-box .lead{color:#D8CBB8}
  .btn{display:inline-block;margin-top:1.6rem;background:var(--accent);color:#fff;
    padding:.9rem 1.8rem;border-radius:999px;font-weight:700;text-decoration:none}
  .disc{font-size:.8rem;color:var(--muted);margin-top:2rem;max-width:52ch}
  .cta-box .disc{color:#C0B4A2}
  .pg{position:absolute;bottom:1.4rem;right:7vw;font-size:.72rem;color:var(--muted);letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'A free live masterclass with Rebecca Ward',h:'How to Launch Your Interior Design Business the Right Way',lead:'The business and money foundations that design school never teaches.'},
  {t:'lead',kicker:'Who this is for',h:'You are talented. You are also stuck at the starting line.',lead:'Maybe you are mid-career and want out. Maybe you finished a program and nobody told you what comes next. You can see the work you want to make. You just cannot see the path to doing it for a living.'},
  {t:'lead',kicker:'Who this is not for',h:'This is not a shortcut.',lead:'If you want a magic client-getting trick, this is not it. This is for people who are ready to treat design as a real business and do the unglamorous foundational work first.'},
  {t:'lead',kicker:'The trap',h:'You keep waiting to feel ready.',lead:'For the right credential. For permission. For the fear to go away. So another year passes and the business you want to run still only exists in your head.'},
  {t:'reframe',kicker:'The reframe',h:'Talent was never the thing stopping you.',lead:'Design school teaches you to design. It does not teach you how to charge, how to work with trades, or how to turn a skill into a business. That gap is why so many gifted people never launch. It is learnable, and it is what this hour is about.'},
  {t:'part',num:'01',h:'The core problem',lead:'Nobody handed you the business side.'},
  {t:'point',kicker:'Part one',h:'The two questions underneath every stuck designer',pts:['Am I meant to work for someone, or build my own thing? Most people never decide on purpose, so they drift.','What is my work actually worth, and can I say that number out loud without flinching?']},
  {t:'point',kicker:'Part one',h:'Why "just be good" is not a plan',pts:['Clients do not buy talent. They buy clarity, confidence, and a process they can trust.','The designers who launch are rarely the most gifted. They are the ones who treated it like a business from day one.']},
  {t:'part',num:'02',h:'The path',lead:'My Design Mentor: the foundations, in order.'},
  {t:'pillars',kicker:'Part two',h:'The three foundations',pillars:[
    {h:'Employee or entrepreneur',p:'Choose your route on purpose. The decision shapes your pricing, your hours, and your first year.'},
    {h:'Money mindset and pricing',p:'Build the confidence to charge what the work is worth, and the simple math behind a price you can defend.'},
    {h:'Business practices and trades',p:'Contracts, scope, and the working relationships with trades that keep a project, and your reputation, intact.'}
  ]},
  {t:'point',kicker:'Part two',h:'The 12 things design school skips',pts:['Employee vs. entrepreneur, money mindset, pricing, working with trades, business setup, finding your first clients, a portfolio that sells, contracts and scope.','Each one is a decision you can make now. Together they are the difference between a hobby and a practice.']},
  {t:'tags',kicker:'The curriculum',h:'Inside the 12 modules',tags:['Employee vs. entrepreneur','Money mindset','Pricing','Working with trades','Business setup','First clients','Portfolio','Contracts and scope','Systems','Confidence']},
  {t:'part',num:'03',h:'From curious to launched',lead:'What the first eight weeks actually look like.'},
  {t:'point',kicker:'Part three',h:'Eight weeks, not eight years',pts:['Decide your route, build your money mindset, set your pricing, put the basics of a business in place.','Land and deliver a first client, then a portfolio piece that brings the next one. The waiting ends when the plan starts.']},
  {t:'point',kicker:'What changes',h:'What it feels like on the other side',pts:['You quote a price and hold it, because you understand the math behind it.','You call a trade, run a project, and sign a client as the designer you always were, now with a business under you.']},
  {t:'why',kicker:'Why learn this from me',h:'I have done both halves of this.',lead:'I am Rebecca Ward, a California Certified Interior Designer and NCIDQ certificate holder with more than twenty years running my own studio. I built Rebecca Ward Design on everyday luxury, and for the last few years I have mentored aspiring designers through My Design Mentor and the Design Curious podcast, more than two hundred episodes on exactly this question.'},
  {t:'lead',kicker:'The point',h:'You do not need permission to start.',lead:'You need a path, the business foundations, and someone who has walked it. That is what the next step gives you.'},
  {t:'cta',kicker:'Your next step',h:'Come learn the path with me.',lead:'Join My Design Mentor or get on the Launch Your Business Bootcamp waitlist, and turn the career you keep picturing into the one you actually run.',btn:'Start with My Design Mentor',disc:'This masterclass is educational. No income or result is guaranteed. Results vary with effort, market, and circumstances.'}
];
const deck=document.getElementById('deck');
function esc(x){return x}
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide';
  let html='';
  if(s.kicker)html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.num)html+='<div class="num">'+s.num+'</div>';
  if(s.t==='cta'){
    html='<div class="cta-box">'+(s.kicker?'<div class="kicker">'+s.kicker+'</div>':'')+
      '<h2>'+s.h+'</h2><p class="lead">'+s.lead+'</p>'+
      '<a class="btn" href="#">'+s.btn+'</a>'+
      '<p class="disc">'+s.disc+'</p></div>';
    sec.innerHTML=html;deck.appendChild(sec);return;
  }
  if(s.h)html+=(s.num||s.t==='title'?'<h1>':'<h2>')+s.h+(s.num||s.t==='title'?'</h1>':'</h2>');
  if(s.lead)html+='<p class="lead">'+s.lead+'</p>';
  if(s.pts){html+='<ul>';s.pts.forEach(p=>html+='<li>'+p+'</li>');html+='</ul>';}
  if(s.pillars){html+='<div class="pillars">';s.pillars.forEach(p=>html+='<div class="pillar"><h3>'+p.h+'</h3><p>'+p.p+'</p></div>');html+='</div>';}
  if(s.tags){html+='<div style="margin-top:1.6rem">';s.tags.forEach(t=>html+='<span class="tag">'+t+'</span>');html+='</div>';}
  html+='<div class="pg">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  sec.innerHTML=html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
