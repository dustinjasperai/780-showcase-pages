<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>My Design Mentor · Rebecca Ward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@500;600;700&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#232a2c; --panel:#2c3436; --rule:#3d4548;
    --acc:#c97a44; --idx:#c9bfab; --chalk:#f5f1e8; --grey:#d6d1c6; --dim:#8a8f8e;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Karla',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Domine',Georgia,serif;font-weight:600;color:var(--chalk);line-height:1.14;letter-spacing:0}
  .t-title h1{font-size:5.4vw;max-width:90%}
  .t-normal h1{font-size:4vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.85vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Karla',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:5.8vw;max-width:90%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#2f3538 0%,#14181a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.6vw;max-width:88%;font-style:italic;color:#f2ede2}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#2f3538 0%,#14181a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.8vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#f0e2d6;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .arc-motif{position:absolute;pointer-events:none;opacity:.92}
  .title-arc{right:7%;bottom:9%;width:18vw}
  .corner-arc{right:6%;bottom:7.5%;width:8vw;opacity:.4}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.8vw}.t-normal h1{font-size:6.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:8.2vw}.t-dark h1{font-size:6.8vw}
    .t-cta h1{font-size:7.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">My Design Mentor</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- tally motif: a simple ascending checklist mark resolving into a filled dot, standing in for "the decision made" -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arc" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="132" x2="242" y2="132" stroke="#c9bfab" opacity="0.3"/>
    <path d="M40 110 L60 128 L98 78" stroke="#c97a44" opacity="0.9"/>
    <path d="M118 110 L138 128 L176 78" stroke="#c97a44" opacity="0.55"/>
    <circle cx="214" cy="96" r="9" fill="#c97a44" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'My Design Mentor',sub:'A masterclass for designers deciding whether they can actually charge for this work, and what happens after they do.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You can design a room. You cannot say your price out loud.',body:'You have the eye, the training, maybe even the first few clients. What you were never taught is how to charge for it, whether to go out on your own or work for a firm, or how to hold your ground with a contractor. Nobody covers that in school.'},
 {t:'dark',title:'Talent gets you in the room. It does not get you paid.'},

 {t:'section',idx:'Part One',title:'Why New Designers Stay Underpaid'},
 {t:'normal',k:'The mindset trap',title:'You feel guilty naming a real number.',body:'Most new designers quote low, discount fast, or work for "exposure" because charging what the work is worth feels like asking too much. That guilt is not a personality flaw. It is a skill nobody taught you.'},
 {t:'normal',k:'The direction trap',title:'Nobody told you employee and entrepreneur are different jobs.',body:'Working for a firm and running your own are two different skill sets with two different payoffs. Picking one without understanding both is how designers end up stuck in the wrong role for years.'},
 {t:'dark',title:'The gap is not talent. It is everything school leaves out.'},

 {t:'section',idx:'Part Two',title:'The My Design Mentor Method'},
 {t:'normal',k:'Money mindset',title:'Get comfortable saying your price out loud.',body:'A direct look at the guilt and self-doubt that keep new designers underpriced, and the practice it takes to quote a fee without flinching or apologizing for it.'},
 {t:'normal',k:'Employee vs. entrepreneur',title:'Choose your path with your eyes open.',body:'A clear walk through what each path actually pays, demands, and rewards, so the decision to freelance or join a firm is made on evidence instead of guesswork.'},
 {t:'normal',k:'Working with trades',title:'Hold your ground with the people building the room.',body:'How to build real working relationships with contractors and vendors, the professional skill design school never covers and every practicing designer needs.'},
 {t:'normal',k:'Business practices',title:'Run the business side like you mean it.',body:'Contracts, workflow, and the practical mechanics of a design career, so the business does not quietly undo the good design work.'},
 {t:'dark',title:'Get the money mindset right, and the rest of the career gets easier to build.'},

 {t:'section',idx:'Part Three',title:'The Designer This Builds'},
 {t:'normal',k:'The designer this builds',title:'Confident pricing, a clear path, real trade relationships.',body:'A designer who names a fee without apologizing for it, who chose employee or entrepreneur on purpose, and who can hold a real conversation with a contractor instead of hoping it goes fine.'},
 {t:'dark',title:'Every designer who gets this right stops leaving money on the table by accident.'},
 {t:'normal',k:'Why Rebecca Ward',title:'A working designer, mentoring the next ones.',body:'Rebecca Ward is a California Certified Interior Designer and NCIDQ certificate holder with 20-plus years running Rebecca Ward Design in Sacramento. She launched My Design Mentor in 2021 and hosts the Design Curious Podcast, teaching the money mindset and business practices she uses in her own studio every day.'},

 {t:'section',idx:'Your Next Step',title:'Join My Design Mentor'},
 {t:'normal',k:'The mentorship',title:'Twelve modules, live coaching calls, a community that gets it.',body:'My Design Mentor pairs the modules above with live 1-on-1 coaching calls with Rebecca, a quarterly book club, a members community, and portfolio and resume review twice a year.'},
 {t:'cta',title:'Ready to name your price?',chips:['Join My Design Mentor'],disc:'Educational content for interior designers and design-career changers. No income, revenue, or business result is guaranteed. Results vary by designer, market, and effort.'},
];

const deck=document.getElementById('deck');
function arc(kind){return `<svg class="arc-motif ${kind==='title'?'title-arc':'corner-arc'}"><use href="#arc"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">My <b>Design Mentor</b> · Rebecca Ward</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=arc(s.arc);
  else if(s.t==='title') h+=arc('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
