<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 1</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Verdana,Geneva,sans-serif;background:linear-gradient(135deg, #1a1a1a 0%, #2b2621 100%);color:#ffffff;
    display:flex;align-items:center;justify-content:center}
  .slide{width:100%;max-width:1120px;aspect-ratio:16/9;padding:72px 88px;position:relative;
    display:flex;flex-direction:column;justify-content:center}
  .bar{position:absolute;top:0;left:0;height:10px;width:100%;
    background:linear-gradient(90deg, #ceaa61 0%, #e6af27 100%)}
  .kicker{font-size:17px;letter-spacing:.18em;text-transform:uppercase;color:#ceaa61;
    font-weight:bold;margin-bottom:22px}
  .title{font-family:Georgia,'Times New Roman',serif;font-size:52px;line-height:1.12;
    color:#fff;margin-bottom:26px;font-weight:700}
  .title.cover{font-size:66px}
  .line{font-size:26px;line-height:1.5;color:#efe6d6;margin:8px 0;max-width:900px}
  .big{font-family:Georgia,serif;font-size:40px;color:#e6af27;font-weight:700;margin:14px 0 22px}
  .score{margin-top:30px;font-size:20px;color:#6b6257;display:flex;align-items:center;gap:16px}
  .score .box{display:inline-block;width:120px;height:44px;border:2px solid #ceaa61;border-radius:8px}
  .disc{margin-top:40px;font-size:15px;color:#8a8275;max-width:860px;line-height:1.5}
  .pg{position:absolute;bottom:34px;right:88px;font-size:14px;color:#9c9488}
  .brand{position:absolute;bottom:34px;left:88px;font-size:14px;letter-spacing:.1em;
    text-transform:uppercase;color:#9c9488}
</style></head>
<body><div class="slide"><div class="bar"></div>
<div class="kicker">A live training with Cate Stillman</div><h1 class="title cover">The 5 Revenue Leaks</h1><p class="line">Keeping wellness pros stuck in the time for money trap,</p><p class="line">and the Annual Club that closes them</p>
<div class="brand">Wellness Pro Academy</div><div class="pg">1 / 25</div>
</div></body></html>
