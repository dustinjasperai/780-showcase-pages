<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Webinar deck</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#2b2621;font-family:Verdana,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column}
.frame{flex:1;border:0;width:100%;background:#fff}
.nav{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px;background:#1a1a1a;color:#efe6d6}
.nav button{background:#ceaa61;color:#1a1a1a;border:0;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;font-family:inherit}
.nav button:disabled{opacity:.4;cursor:default}
.count{font-size:15px;letter-spacing:.1em}</style></head>
<body><div class="wrap">
<iframe class="frame" id="f" src="01.html"></iframe>
<div class="nav"><button id="prev">Prev</button><span class="count" id="c"></span><button id="next">Next</button></div>
</div><script>
var S=["01.html","02.html","03.html","04.html","05.html","06.html","07.html","08.html","09.html","10.html","11.html","12.html","13.html","14.html","15.html","16.html","17.html","18.html","19.html","20.html","21.html","22.html","23.html","24.html","25.html"];var i=0;var f=document.getElementById('f');var c=document.getElementById('c');
var p=document.getElementById('prev');var n=document.getElementById('next');
function go(){f.src=S[i];c.textContent=(i+1)+' / '+S.length;p.disabled=(i===0);n.disabled=(i===S.length-1);}
p.onclick=function(){if(i>0){i--;go();}};n.onclick=function(){if(i<S.length-1){i++;go();}};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')n.onclick();if(e.key==='ArrowLeft')p.onclick();});
go();
</script></body></html>
