<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Money in Your List - a masterclass with Kay Peacey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f5; --panel:#f3ece6; --rule:#e6dcd3; --ink:#211c1a;
    --muted:#6b625c; --accent:#e55757; --blush:#f7d8d0;
    --display:'Cormorant Garamond', Georgia, serif;
    --body:'Nunito', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--panel);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 60px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:52px 56px;margin:0 0 22px;min-height:430px;position:relative;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(33,28,26,.03);
  }
  .kicker{font-family:var(--body);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--display);font-weight:600;font-size:52px;line-height:1.04;margin:0 0 18px}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.08;margin:0 0 16px}
  .sub{font-size:20px;line-height:1.5;color:var(--muted);max-width:60ch;margin:0 0 8px}
  p{font-size:18px;line-height:1.62;max-width:62ch;margin:0 0 14px}
  .lead{font-size:22px;line-height:1.5;max-width:60ch}
  ul{margin:8px 0 0;padding:0;list-style:none;max-width:64ch}
  li{position:relative;padding:0 0 0 30px;margin:0 0 15px;font-size:18px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:2px;background:var(--accent)}
  li b{font-weight:800}
  .num{font-family:var(--display);font-size:30px;color:var(--accent);font-weight:600}
  .rule{height:2px;width:64px;background:var(--accent);margin:0 0 22px;border:0}
  .foot{position:absolute;bottom:20px;left:56px;right:56px;display:flex;justify-content:space-between;
    font-size:12px;color:var(--muted);letter-spacing:.03em}
  .foot .brand{font-weight:800;color:var(--ink)}
  .title-slide{background:linear-gradient(180deg,#fff 0%,var(--bg) 100%)}
  .title-slide h1{font-size:60px}
  .cta{background:var(--ink);color:#fbf8f5;border-color:var(--ink)}
  .cta .kicker{color:var(--blush)}
  .cta h2{color:#fff}
  .cta p{color:#e9e1db}
  .cta .rule{background:var(--blush)}
  .btn{display:inline-block;margin-top:14px;background:var(--accent);color:#fff;font-weight:800;
    padding:14px 26px;border-radius:9px;font-size:17px;text-decoration:none}
  .disclaimer{font-size:12px;color:#b9aea6;margin-top:22px;max-width:70ch;line-height:1.5}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
  .card h3{font-family:var(--display);font-size:23px;margin:0 0 8px;font-weight:600}
  .card p{font-size:15.5px;margin:0;color:var(--muted)}
  .tag{display:inline-block;background:var(--blush);color:#7a2f2f;font-weight:800;font-size:12px;
    letter-spacing:.05em;padding:5px 11px;border-radius:20px;margin-bottom:16px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
    kicker:'A live masterclass with Kay Peacey',
    h:'The Money in Your List',
    sub:'How small business owners turn their email platform from an expensive address book into an automated revenue engine, without ever sounding like a robot.' },

  {t:'content', k:'Who this is for',
    h:'You already have a list. It just isn’t paying you back.',
    lead:'You have subscribers. You send the odd email. People even open them. But the list sits there like a room full of interested people that nobody is talking to, and the revenue you were promised never quite shows up.',
    pts:['You built the list the hard way, one opt-in at a time.',
         'You pay every month for a powerful platform.',
         'And most of what it can do is switched off.'] },

  {t:'content', k:'The trap',
    h:'The platform gave you a tour. It never gave you the map.',
    lead:'When you signed up, they showed you the buttons: how to send a broadcast, how to add a tag, how to build an automation. What nobody showed you was which automations actually make money, and in what order to build them.',
    pts:['So you learned the features but not the possibilities.',
         'You automated the busywork, not the selling.',
         'The tool works. The strategy behind it was never handed over.'] },

  {t:'content', k:'The uncomfortable truth',
    h:'A bigger list is not the answer. A working list is.',
    lead:'Most business owners chase more subscribers to fix flat revenue. But if the emails you already send don’t convert, more subscribers just means a bigger silent room. The leverage was never in the size of the list. It was always in what happens automatically once someone joins it.' },

  {t:'content', k:'Part one',
    h:'Why good lists go quiet',
    lead:'In practice, underperforming email almost always comes down to the same three things. Fix these and the list starts working while you sleep.',
    pts:['<b>A shaky foundation</b> that was set up in a rush and never revisited.',
         '<b>Powerful features left switched off</b> because no one showed you what they unlock.',
         '<b>Messy contacts and automations</b> that fight each other instead of working together.'] },

  {t:'content', k:'Problem one', tag:'The foundation',
    h:'You built the house on sand',
    lead:'Sending settings, authentication, and a clean sender reputation are the plumbing nobody sees until it leaks. Get the foundation wrong and even a brilliant email lands in spam, so the whole list looks dead when it is really just unheard.',
    pts:['Emails quietly landing in Promotions or spam.',
         'Open rates that keep sliding for no obvious reason.',
         'A sender reputation you have never actually checked.'] },

  {t:'content', k:'Problem two', tag:'The features',
    h:'You are paying for a Ferrari and driving it to the shops',
    lead:'Tags, conditional logic, goals, and automations are the difference between a newsletter tool and a revenue engine. Most owners use a fraction of them, so the platform costs the same and delivers a tenth of what it could.',
    pts:['Every subscriber gets the same email, no matter who they are.',
         'No automation catches the person who was about to buy and hesitated.',
         'The clever features sit unused because nobody mapped them to your business.'] },

  {t:'content', k:'Problem three', tag:'The organisation',
    h:'Your automations are working against each other',
    lead:'When tags, lists, and automations grow without a system, they collide. People get double-emailed, or fall through the cracks, or get the wrong message at the wrong moment. The fix is not more automation. It is order.',
    pts:['Contacts tagged five different ways for the same thing.',
         'Automations nobody remembers building, still running.',
         'No single map of what fires, when, and why.'] },

  {t:'content', k:'Part two',
    h:'The three automations that actually sell',
    lead:'You do not need forty automations. You need three, built in the right order, each one earning its place before you add the next. This is the spine of a list that pays you back.' },

  {t:'content', k:'Automation one', tag:'Ultimate welcome sequence',
    h:'Turn a new subscriber into a buyer in the first week',
    lead:'The moment someone joins is the moment they care most and trust you least. A welcome sequence built on purpose does the introducing, the proving, and the first invitation to buy, automatically, while the interest is hot.',
    pts:['Greet, deliver on the promise, and set expectations fast.',
         'Tell the one story that makes them trust you.',
         'Make a clear, low-friction first offer before the attention fades.'] },

  {t:'content', k:'Automation two', tag:'Easy email newsletter',
    h:'A regular email you can actually keep sending',
    lead:'Consistency beats brilliance. A newsletter system that is simple enough to sustain keeps you in the inbox, keeps the list warm, and keeps buyers buying, without the weekly dread of a blank page.',
    pts:['A repeatable format so you are never starting from zero.',
         'A rhythm the list learns to expect and open.',
         'Every send quietly pointing back to something you sell.'] },

  {t:'content', k:'Automation three', tag:'Better engagement & deliverability',
    h:'Stay out of spam, stay in the money',
    lead:'None of this matters if the email never arrives. A deliverability system protects everything upstream of it: it keeps your best subscribers engaged, prunes the ones dragging you down, and keeps you landing in the inbox where sales happen.',
    pts:['Segment by real engagement, not just by who signed up.',
         'Re-engage the quiet ones, retire the dead weight.',
         'Protect the sender reputation the whole list depends on.'] },

  {t:'content', k:'The principle that ties it together',
    h:'Automated does not mean robotic',
    lead:'The reason most automated email feels cold is that it was written to be efficient, not human. Done properly, automation buys you the time to sound MORE like yourself, not less. The machine handles the timing. You keep the voice.' },

  {t:'content', k:'Part three',
    h:'The quiet shift owners describe',
    lead:'This is the quiet shift owners describe once the three automations are in place and talking to each other.',
    two:[
      {h:'Before', p:'A big list, occasional broadcasts, flat revenue, and a nagging sense the platform is wasted.'},
      {h:'After', p:'New subscribers welcomed and sold to automatically, a newsletter that runs on rails, and email that earns while you work on the business.'}
    ] },

  {t:'content', k:'Why learn this from me',
    h:'I have spent years inside this one platform so you do not have to',
    lead:'I am an ActiveCampaign Certified Consultant and a member of ActiveCampaign’s Customer Advisory Board, and I have helped thousands of small business owners make their email and automation actually work. I trained as a teacher first, which means I care less about impressing you and more about you leaving able to do this yourself.',
    pts:['Certified Consultant and Customer Advisory Board member.',
         'A teacher by training, so the steps are clear and doable.',
         'Focused on small business owners, not enterprise theory.'] },

  {t:'cta',
    kicker:'Your next step',
    h:'Come build these three automations with me',
    p:'Inside the ActiveCampaign Academy you get the exact steps, the templates, and live drop-in calls with me whenever you get stuck, so you can build a list that pays you back and keep your human voice while you do it.',
    btn:'Join the ActiveCampaign Academy',
    disclaimer:'This masterclass is for education only. No income or result is guaranteed. Results vary and depend on your offer, your audience, and the work you put in.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta':'');
  let html = '';
  if (s.kicker) html += `<p class="kicker">${s.kicker}</p>`;
  if (s.k) html += `<p class="kicker">${s.k}</p>`;
  if (s.tag) html += `<span class="tag">${s.tag}</span><br>`;
  if (s.t==='title'){ html += `<h1>${s.h}</h1>`; }
  else if (s.t==='cta'){ html += `<hr class="rule"><h2>${s.h}</h2>`; }
  else { html += `<hr class="rule"><h2>${s.h}</h2>`; }
  if (s.sub) html += `<p class="sub">${s.sub}</p>`;
  if (s.lead) html += `<p class="lead">${s.lead}</p>`;
  if (s.p) html += `<p>${s.p}</p>`;
  if (s.two){ html += '<div class="two">' + s.two.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('') + '</div>'; }
  if (s.pts){ html += '<ul>' + s.pts.map(p=>`<li>${p}</li>`).join('') + '</ul>'; }
  if (s.btn) html += `<a class="btn" href="https://slickbusiness.co/academy/">${s.btn}</a>`;
  if (s.disclaimer) html += `<p class="disclaimer">${s.disclaimer}</p>`;
  if (s.t!=='title'){ html += `<div class="foot"><span class="brand">Slick Business &middot; The ActiveCampaign Academy</span><span>${i+1} / ${S.length}</span></div>`; }
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
