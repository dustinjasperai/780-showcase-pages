<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profitable Studio · Raphael Bender, Breathe Education</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#171a26; --panel:#232739; --rule:#2f3446;
    --acc:#bc0f45; --ink:#f4f2ee; --body:#c3c7d4; --dim:#767c92; --cream:#f4f2ee;
  }
  html,body{height:100%}
  body{background:#0f111a;font-family:'Poppins',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f111a}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Spectral',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.16;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.2vw;max-width:90%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:78%;line-height:1.66;font-weight:400}
  .sub{font-family:'Spectral',serif;font-style:italic;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:86%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#bc0f45 0%,#6f0a2a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:90%;color:#fff}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#bc0f45 0%,#6f0a2a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:88%;color:#fff}
  .t-cta .body{font-family:'Poppins',sans-serif;color:#fbe6ec;font-size:1.4vw;margin-top:3vh;max-width:74%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #fff;color:#fff;border-radius:100px;padding:1.4vh 1.9vw;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.86vw;color:#f6d3dd;text-align:center;line-height:1.45}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.1vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(188,15,69,.14);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Breathe Education</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'The Profitable Studio',sub:'How to earn more from fewer classes, and grow through the five stages every studio owner moves through.',brand:true},
 {t:'normal',k:'Who this is for',title:'Your timetable is full. Your bank account does not agree.',body:'You own a studio your clients love and your teachers are good at what they do. The schedule is packed, you are teaching most of the hours yourself, and at the end of the month the profit still does not match the effort. You are busy in a way that is not paying you back.'},
 {t:'dark',title:'A busier timetable is not the same as a more profitable studio.'},
 {t:'section',idx:'Part One',title:'Why full studios stay broke.'},
 {t:'normal',k:'The instinct',title:'When money is tight, the instinct is to add.',body:'Add another class format. Add reformer, then mat, then barre, then a workshop series. It feels productive, because more options should mean more clients and more revenue. Most studio owners reach for exactly this move, and it is the one that quietly keeps them stuck.'},
 {t:'normal',k:'What it actually costs',title:'Every format you add lowers your margin and blurs what you are known for.',body:'More formats mean more equipment, more training, more scheduling, and more teachers to cover it all. Your costs rise faster than your revenue, so your margin falls. Worse, a studio that does everything is easy to compare on price with the cheap option down the road, because nobody can tell what you are actually best at.'},
 {t:'dark',title:'You do not have a demand problem. You have a focus problem.'},
 {t:'section',idx:'Part Two',title:'The five stages of a profitable studio.'},
 {t:'normal',k:'Stage one · Dreamer',title:'Stop perfecting the plan and start teaching.',body:'In the beginning the trap is planning. The logo, the fit-out, the perfect launch. What breaks you out of this stage is not more preparation, it is revenue. You get one clear offer in front of real clients and you let what they pay for tell you what the studio should be.'},
 {t:'normal',k:'Stage two · Overwhelmed',title:'One offer, higher prices, boundaries that hold.',body:'Now you are teaching, cleaning, and selling all at once, and drowning. The fix is not another format. It is the opposite. Narrow to the one offer that works, raise your prices so each hour is worth teaching, set boundaries on your time, and hand off the admin. Fewer things, done properly, priced correctly.'},
 {t:'normal',k:'Stage three · People',title:'Lead with values, standards, and numbers.',body:'Your first hires arrive and suddenly the problems are human ones. This stage is won by getting clear on the values you actually hire and fire on, holding a real standard, letting the wrong people go, and tracking the few numbers that tell you the truth about the business. A team without those three drifts.'},
 {t:'normal',k:'Stage four · The second studio',title:'Document what you did the first time on instinct.',body:'The first studio works, so you open a second, and it struggles in ways the first never did. The reason is that the first ran on you being there. This stage is about nailing your positioning and writing down the systems and standards, so quality travels to a room you are not standing in.'},
 {t:'normal',k:'Stage five · Multi-location',title:'Lead the leaders. Do not micromanage the rooms.',body:'Across several sites the enemy is communication breakdown and a founder trying to touch everything. What carries you through is leadership: clear roles, managers you actually trust, a real marketing function, and a growth model that stays cash positive as you scale. You lead the people who lead the studios.'},
 {t:'dark',title:'Every stage is the same lesson in disguise: do fewer things, on purpose, better.'},
 {t:'section',idx:'Part Three',title:'What a focused studio feels like.'},
 {t:'normal',k:'In practice',title:'Fewer classes, stronger prices, a team that knows the plan.',body:'You still grow. The difference is where the growth comes from. Instead of a wider timetable at thinner margins, you have a clear offer people will pay a real price for, a brand clients can describe in one sentence, and a team running the rooms to a standard you set. The studio makes more and demands less of you.'},
 {t:'normal',k:'The shift',title:'From the busiest teacher in the building to the owner of a business.',body:'The old version of you filled every gap and took every class because the studio could not run otherwise. The focused version sets the direction, prices the work to sustain it, and trusts a team to deliver it. Same studio, a very different life, and a profit line that finally reflects the work.'},
 {t:'normal',k:'Why listen to me',title:'I have built the studio, sold it, and taught the science behind it.',body:'I am an exercise physiologist who opened one of Australia\'s largest specialist Pilates studios, sold my share, and founded Breathe Education, where we have certified more than two and a half thousand instructors worldwide. I host the Pilates Elephants podcast, where I work through the real economics of this profession, and my whole approach is to turn the research into simple decisions a studio owner can act on.'},
 {t:'cta',title:'Let us find your next stage.',body:'If this is the studio you want to build, the next step is a conversation. Book a call with our team and we will look at which of the five stages your studio is in and the single move that raises your profit from where you are now. This masterclass is educational. No specific business or income result is guaranteed, and results vary with your studio, your market, and the work you put in.',brand:true}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide t-' + s.t + (i === 0 ? ' active' : '');
  let html = '';
  if (s.k) html += '<div class="kicker">' + s.k + '</div>';
  if (s.idx) html += '<div class="idx">' + s.idx + '</div>';
  if (s.title) html += '<h1>' + s.title + '</h1>';
  if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  if (s.body) html += '<div class="body">' + s.body + '</div>';
  if (s.t === 'section') html += '<div class="rule"></div>';
  if (s.brand) html += '<div class="brandline">Raphael Bender &middot; <b>Breathe Education</b></div>';
  if (s.t === 'cta') html += '<div class="disc">Educational content. No specific business or income result is guaranteed. Results vary.</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
const bar = document.getElementById('bar');
const count = document.getElementById('count');
const hint = document.getElementById('hint');
const pad = n => String(n).padStart(2, '0');
function show(n){
  cur = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle('active', i === cur));
  bar.style.width = ((cur + 1) / slides.length * 100) + '%';
  count.textContent = pad(cur + 1) + ' / ' + pad(slides.length);
  if (cur > 0 && hint) hint.style.opacity = 0;
}
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('prev').onclick = () => show(cur - 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
show(0);
</script>
</body>
</html>
