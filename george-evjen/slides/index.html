<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built Like a Basketball Program — A Live Masterclass with George Evjen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060f26;        /* brand near-black navy (brand.json, 17 uses) */
    --panel:#0d1c40;     /* lift of dominant royal navy #012169 (46 uses) */
    --rule:#9aa7b6;      /* brand slate (30 uses) */
    --accent:#ff8200;    /* brand orange (18 uses) */
    --ink:#eef2f7;
    --muted:#9aa7b6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    position:relative;background:linear-gradient(160deg,var(--panel),#071127);
    border:1px solid rgba(154,167,182,.16);border-radius:18px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:480px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
  .eyebrow{font-family:"DM Sans";font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:12.5px;color:var(--accent)}
  .num{position:absolute;right:28px;top:24px;font-family:"Anton";font-size:16px;color:rgba(154,167,182,.45);letter-spacing:.05em}
  h1{font-family:"Anton";font-weight:400;font-size:60px;line-height:.98;letter-spacing:.005em;text-transform:uppercase;margin:16px 0 8px}
  h2{font-family:"Anton";font-weight:400;font-size:42px;line-height:1.02;text-transform:uppercase;letter-spacing:.01em;margin:14px 0 10px}
  h3{font-family:"Anton";font-weight:400;font-size:26px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin:0 0 6px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:42ch;margin:8px 0}
  p.lead{font-size:23px;color:var(--ink)}
  p.muted{color:var(--muted);font-size:18px}
  .big{font-family:"Anton";font-weight:400;font-size:82px;line-height:.92;text-transform:uppercase;letter-spacing:.01em}
  ul{list-style:none;margin:14px 0 0}
  li{font-size:19px;line-height:1.45;padding:9px 0 9px 26px;position:relative;max-width:48ch;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:17px;width:11px;height:11px;background:var(--accent);border-radius:2px}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
  .pillar{background:rgba(1,33,105,.42);border:1px solid rgba(154,167,182,.18);border-radius:12px;padding:20px}
  .pillar .k{font-family:"Anton";font-size:30px;color:var(--accent)}
  .pillar .t{font-size:16px;color:var(--muted);margin-top:4px}
  .pillar .d{font-size:15.5px;color:var(--ink);margin-top:10px;line-height:1.4}
  .grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
  .cell{background:rgba(1,33,105,.35);border:1px solid rgba(154,167,182,.16);border-radius:10px;padding:14px 15px}
  .cell b{font-family:"Anton";font-weight:400;font-size:17px;letter-spacing:.04em;color:var(--accent);display:block}
  .cell span{font-size:14.5px;color:var(--ink);line-height:1.38;display:block;margin-top:5px}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
  .score{background:rgba(1,33,105,.42);border:1px solid rgba(154,167,182,.2);border-radius:12px;padding:22px 18px;text-align:center}
  .score .n{font-family:"Anton";font-size:48px;color:var(--accent);line-height:1}
  .score .l{font-size:14.5px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.08em}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;border-top:1px solid rgba(154,167,182,.2);margin-top:26px;padding-top:16px;max-width:64ch}
  .foot{margin-top:18px;font-size:15px;color:var(--muted);letter-spacing:.04em}
  .two{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
  @media(max-width:720px){
    .slide{padding:38px 28px}h1{font-size:44px}.big{font-size:54px}h2{font-size:32px}
    .pillars,.grid9,.board,.two{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title', eyebrow:'A Live Masterclass with George Evjen · DeadThree Coaching',
   h:'Built Like a<br>Basketball Program',
   sub:'The operating system for a team that runs without you.',
   note:'Standards. Discipline. Execution.'},

  {t:'point', eyebrow:'The promise', h:'By the end of this hour',
   body:'The standard lives on your team, not in your head. You will leave with the three pillars your team runs on and the first move to put them in place.'},

  {t:'point', eyebrow:'Who this is for', h:'Leaders of teams<br>from 5 to 200',
   body:'IT and software. Construction. Fitness. Athletic programs. The talent is there. The consistency is not, and the last motivational training did not stick.'},

  {t:'point', eyebrow:'Sound familiar?', h:'The training day was great.<br>By Friday, nothing changed.',
   bullets:[
     'Nobody is sure what good actually looks like, so the team is guessing.',
     'The standard lives in your head, not on the wall.',
     'You are the only one holding the line, so it disappears the minute you leave the room.']},

  {t:'statement', eyebrow:'The reframe', big:'Talent doesn’t win.<br>A standard does.',
   sub:'A speech gives your team a good day. A system gives them a good season.'},

  {t:'point', eyebrow:'Part one · the real problem', h:'You’re running on effort,<br>not a system',
   body:'Talented teams do not fall short on effort. They fall short on clarity, consistency and leadership. That is fixable, and it is not fixed with a bigger push. It is fixed with a system the team can run on its own.'},

  {t:'title', eyebrow:'The system', h:'S · D · E',
   sub:'Standards, Discipline and Execution. How your team operates, sustains it, and proves it. Every workshop and program runs on these three pillars.'},

  {t:'pillar', eyebrow:'Part two · the pillars', kicker:'Standards', h:'The bar we set',
   body:'Define what elite looks like before the work starts. Written down, observable, known by everyone. When the standard is on the wall, the team stops guessing.',
   cards:[{k:'01',t:'Encouragement',d:'Specific and out loud.'},
          {k:'02',t:'Mindset',d:'Shows up when things go wrong.'},
          {k:'03',t:'Purpose',d:'Everyone can say what we are here to do in one sentence.'}]},

  {t:'pillar', eyebrow:'Part two · the pillars', kicker:'Discipline', h:'The behaviors we sustain',
   body:'Habits and a weekly operating rhythm that hold the standard when it gets busy, hard or boring. The 3-part 1:1, run with every direct report, is where discipline is kept.',
   cards:[{k:'04',t:'Ownership',d:'If you see it, you own it.'},
          {k:'05',t:'Empathy',d:'We understand before we respond.'},
          {k:'06',t:'Decision-Making',d:'Decisions get made, owned and backed.'}]},

  {t:'pillar', eyebrow:'Part two · the pillars', kicker:'Execution', h:'The results we prove',
   body:'Clear outcomes, clear owners, and a scoreboard everyone can read. Every week, every quarter, every season. Effort turned into results you can point at.',
   cards:[{k:'07',t:'Winning',d:'Defined before the week starts.'},
          {k:'08',t:'Results',d:'Effort turned into measurable results.'},
          {k:'09',t:'Execution',d:'Commitments into actions, actions into results.'}]},

  {t:'nine', eyebrow:'The nine principles', h:'EMPOWERED', sub:'Not words on a wall. Lines your team lives by.',
   cells:[
     {b:'E · Encouragement', s:'On our team, encouragement is specific and out loud.'},
     {b:'M · Mindset', s:'On our team, mindset shows up when things go wrong.'},
     {b:'P · Purpose', s:'Everyone can say what we are here to do in one sentence.'},
     {b:'O · Ownership', s:'If you see it, you own it.'},
     {b:'W · Winning', s:'Winning is defined before the week starts.'},
     {b:'E · Empathy', s:'We understand before we respond.'},
     {b:'R · Results', s:'We turn effort into measurable results.'},
     {b:'E · Execution', s:'Commitments into actions, actions into results.'},
     {b:'D · Decision-Making', s:'Decisions get made, owned and backed.'}]},

  {t:'point', eyebrow:'Diagnose before you decide', h:'Fix the right problem first',
   body:'Most leaders fix the wrong pillar. Score your team on all three, honestly, and work the weakest one first. Standards without Discipline fades. Discipline without Execution spins.'},

  {t:'board', eyebrow:'Part three · the scoreboard', h:'The scoreboard<br>nobody can argue with',
   scores:[{n:'3',l:'Weekly outcomes, one owner each'},
           {n:'3-5',l:'Metrics everyone can see'},
           {n:'90',l:'Day plan, then retake the score'}]},

  {t:'point', eyebrow:'The week 9 test', h:'You’ve got it when',
   bullets:[
     'Every team member can name the standards without prompting.',
     'The weekly rhythm runs without the leader pushing it.',
     'The team can state the score in real time.']},

  {t:'why', eyebrow:'Why me', h:'Two locker rooms,<br>one lesson',
   body:'I spent my life in the basketball gym and on the software floor. Both taught me the same thing: championship teams do not happen by accident. They happen by design.',
   bullets:[
     '16-plus years coaching college basketball.',
     '18-plus years leading delivery in software and IT as an Agile Coach and Release Train Engineer.',
     'We start with the person, then the team, then the process. We do not drop content and disappear.']},

  {t:'statement', eyebrow:'One line to remember', big:'Your team needs<br>a system,<br>not a speech.', sub:''},

  {t:'cta', eyebrow:'Your next move', h:'Find your<br>weakest pillar',
   sub:'Take the free SDE Assessment and see where your team stands on Standards, Discipline and Execution. When you are ready to put the system in, book a call about the SDE 9-Week Program.',
   foot:'DeadThree Coaching · deadthreecoaching.com · St. Charles, MO',
   disc:'Educational content only. Every team and situation is different; outcomes depend on your team, your effort and your leadership. No specific result, performance or income improvement is promised or guaranteed.'}
];

const pad = n => String(n+1).padStart(2,'0');
function render(){
  const deck = document.getElementById('deck');
  deck.innerHTML = S.map((s,i)=>{
    const num = '<span class="num">'+pad(i)+'</span>';
    const eb = s.eyebrow ? '<div class="eyebrow">'+s.eyebrow+'</div>' : '';
    let body = '';
    if(s.t==='title'){
      body = '<h1>'+s.h+'</h1>'+(s.sub?'<p class="lead">'+s.sub+'</p>':'')+(s.note?'<p class="muted">'+s.note+'</p>':'');
    } else if(s.t==='statement'){
      body = '<p class="big">'+s.big+'</p>'+(s.sub?'<p class="muted">'+s.sub+'</p>':'');
    } else if(s.t==='point'){
      body = '<h2>'+s.h+'</h2>'+(s.body?'<p>'+s.body+'</p>':'')+(s.bullets?'<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>':'');
    } else if(s.t==='pillar'){
      body = '<h3>'+s.kicker+'</h3><h2>'+s.h+'</h2><p>'+s.body+'</p><div class="pillars">'+
        s.cards.map(c=>'<div class="pillar"><div class="k">'+c.k+'</div><div class="t">'+c.t+'</div><div class="d">'+c.d+'</div></div>').join('')+'</div>';
    } else if(s.t==='nine'){
      body = '<h2>'+s.h+'</h2><p class="muted">'+s.sub+'</p><div class="grid9">'+
        s.cells.map(c=>'<div class="cell"><b>'+c.b+'</b><span>'+c.s+'</span></div>').join('')+'</div>';
    } else if(s.t==='board'){
      body = '<h2>'+s.h+'</h2><div class="board">'+
        s.scores.map(c=>'<div class="score"><div class="n">'+c.n+'</div><div class="l">'+c.l+'</div></div>').join('')+'</div>';
    } else if(s.t==='why'){
      body = '<div class="two"><div><h2>'+s.h+'</h2><p>'+s.body+'</p></div><div><ul>'+
        s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul></div></div>';
    } else if(s.t==='cta'){
      body = '<h1>'+s.h+'</h1><p class="lead">'+s.sub+'</p><p class="foot">'+s.foot+'</p><p class="disc">'+s.disc+'</p>';
    }
    const cls = 'slide'+(s.t==='cta'?' cta':'');
    return '<section class="'+cls+'">'+num+eb+body+'</section>';
  }).join('');
}
render();
</script>
</body>
</html>
