<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Technical Expert to Strategic Partner — Leila Singh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111a2d;        /* her deep navy #132649, deepened for slide ground */
    --panel:#182540;     /* lighter navy step */
    --rule:#2d3a57;      /* muted navy line */
    --accent:#d7b548;    /* her dominant brand gold, from brand.json */
    --ink:#f4f6fb;
    --muted:#9fb0c9;
    --head:'Quicksand',system-ui,sans-serif;  /* her own site face */
    --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#070c16;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:62px 64px;margin:0 0 26px;min-height:520px;position:relative;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.08;margin-bottom:20px}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.12;margin-bottom:20px}
  h3{font-family:var(--head);font-weight:600;font-size:23px;margin-bottom:10px;color:var(--accent)}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:40ch;margin-bottom:14px}
  p.lead{font-size:23px;color:var(--muted);max-width:46ch}
  .sub{font-size:19px;color:var(--muted);max-width:46ch}
  ul{list-style:none;margin:14px 0 0}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:52ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px 24px}
  .card h3{font-size:19px;margin-bottom:6px}
  .card p{font-size:16px;color:var(--muted);margin:0;max-width:34ch}
  .big{font-size:88px;font-family:var(--head);font-weight:700;color:var(--accent);line-height:1}
  .foot{position:absolute;right:28px;bottom:22px;font-size:12px;color:var(--muted);font-family:var(--head);letter-spacing:.08em}
  .title-slide{align-items:flex-start}
  .title-slide h1{font-size:62px;max-width:18ch}
  .brandline{font-family:var(--head);font-weight:600;color:var(--muted);font-size:17px;letter-spacing:.04em;margin-top:26px}
  .disc{font-size:14px;color:var(--muted);max-width:60ch;margin-top:18px;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:18px;background:var(--accent);color:#111a2d;font-family:var(--head);
    font-weight:700;font-size:19px;padding:15px 30px;border-radius:10px}
  @media(max-width:720px){.slide{padding:40px 28px;min-height:auto}h1{font-size:38px}.title-slide h1{font-size:42px}h2{font-size:30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Leila Singh', h1:'From Technical Expert to Strategic Partner', sub:'How ambitious finance and tech professionals build the executive presence to get recognised, promoted, and paid what they are worth.', brand:'Leila Singh FCCA · Leadership & Career Coach · TEDx Speaker'},

  {t:'who', kick:'Who this is for', h2:'You are brilliant at the work. You are still being overlooked.', bullets:['Mid to senior finance and tech professionals ready for the next level','Technically excellent, yet passed over when the big roles open up','Doing more, saying yes to everything, and still invisible at the senior table','Ready to be seen as a leader, not just a safe pair of hands']},

  {t:'trap', kick:'The trap', h2:'The skill that got you here is quietly holding you back.', lead:'You were rewarded for being the expert. For having the answer, closing the gap, getting it right. So you doubled down on the work. But the roles you now want are not won on technical depth. They are won on presence, influence and how senior people experience you in the room.'},

  {t:'reframe', kick:'The hard truth', h2:'No one gets promoted for being the hardest worker in a job they have already outgrown.', lead:'Promotions are not a reward for effort already spent. They are a bet on how you will show up at the next level, made by people who need to feel certain about you before the seat is open. If they cannot picture you there, the work will not change their mind.'},

  {t:'reframe', kick:'The cost', h2:'Another quiet year is not neutral. It is expensive.', lead:'Every cycle you wait to be noticed, someone less able and more visible takes the seat, the budget and the sponsor. The gap compounds. The longer you lead with output alone, the more fixed your reputation becomes as the dependable expert, not the next leader.'},

  {t:'part', kick:'Part One', h2:'The real problem is not your competence. It is your visibility.', lead:'Three things quietly keep high performers stuck.'},
  {t:'list', kick:'Part One', h2:'Why the best technician rarely wins the seat', bullets:['Invisible by default: the decision makers do not actually know what you do or the value you carry','Expert, not leader: you are trusted with the detail, not the direction','Reactive brand: your reputation is being written by other people, in rooms you are not in']},
  {t:'deep', kick:'Part One · In focus', h3:'Invisible by default', h2:'Good work does not announce itself. You have to.', lead:'The people who decide your next role are busy, and they fill the gaps in what they know about you with assumptions. If you are not deliberately shaping how your value is understood at the top, silence is doing it for you, and silence always undersells.'},

  {t:'part', kick:'Part Two', h2:'The IMPACT Code', lead:'My six-pillar system for turning a technical expert into the obvious choice for the next role. It is the core curriculum inside my Leadership Launchpad.'},
  {t:'grid', kick:'Part Two · The IMPACT Code', h2:'Six pillars', cards:[
    {h:'Clarity on your why','p':'Get decisive about the career you actually want, so every move has a direction.'},
    {h:'Vision and personal brand','p':'Build a brand that walks into the room before you do, on purpose.'},
    {h:'Mindset and confidence','p':'Replace the quiet self-doubt of the high achiever with earned, visible conviction.'},
    {h:'Commanding presence','p':'Carry gravitas and executive presence that senior leaders recognise instantly.'},
    {h:'Upgraded communication','p':'Speak so your ideas land with influence, not just accuracy.'},
    {h:'Strategic relationships','p':'Be known, backed and sponsored by the people who decide who rises.'}
  ]},
  {t:'deep', kick:'Part Two · Pillar in focus', h3:'Commanding presence', h2:'Gravitas is not volume. It is how certain the room feels about you.', lead:'Presence is the one thing a promotion panel reads in seconds and trusts for years. It is learnable, specific and built from the inside out, not performed. This is where the shift from expert to leader actually happens.'},
  {t:'deep', kick:'Part Two · Pillar in focus', h3:'Mindset and confidence', h2:'The self-doubt of a high achiever is loudest right before the level up.', lead:'The quiet voice that says you are not ready gets louder exactly when you are. We work on the inside game first, because no personal brand holds up if you do not believe you belong at the table you are walking toward.'},
  {t:'deep', kick:'Part Two · Pillar in focus', h3:'Strategic relationships', h2:'The people who sponsor you are not in the room by accident.', lead:'A sponsor spends their own credibility arguing for you when you are not there. You do not get that by working harder in silence. You build it deliberately, which is exactly what this pillar maps out.'},

  {t:'part', kick:'Part Three', h2:'What changes when you lead this way', lead:'Not a new job. A new way of being seen in the one you have.'},
  {t:'list', kick:'Part Three', h2:'How your working week actually changes', bullets:['You are in the conversations about the roles before they are advertised','Senior leaders describe you as ready, not promising','You ask for the promotion and the raise from a position of visible value','Your reputation works for you in rooms you will never sit in']},
  {t:'list', kick:'Part Three', h2:'What you walk away able to do', bullets:['Say what you do, and the value you carry, in one clear sentence that lands','Hold the room in a senior meeting without over-explaining','Build the sponsor relationships that put your name forward','Ask for more, with evidence, without apology']},

  {t:'proof', kick:'Why me', h2:'I have lived both sides of this table.', lead:'FCCA qualified accountant. 16 years at Hewlett Packard Enterprise across corporate finance, treasury and sales. Twenty-five years inside the rooms where these decisions get made, now a Master Coach, Master Coach Trainer, TEDx speaker and author who helps finance and tech professionals do what I had to learn the hard way.', stat:'47%', statlabel:'average income increase for clients, with each securing at least one promotion'},

  {t:'reframe', kick:'The shift', h2:'Same talent. Seen clearly for the first time.', lead:'Nothing about your ability needs to change. What changes is whether the people who decide actually see it, trust it and bet on it. That is a skill. It can be built in months, not left to luck over years.'},

  {t:'cta', kick:'Your next step', h2:'Ready to be seen as the leader you already are?', lead:'If this is the shift you are ready to make, the Leadership Launchpad is where we do the work together: the full IMPACT Code, weekly live coaching, and a room of ambitious professionals making the same move.', btn:'Join the Leadership Launchpad', disc:'This masterclass is for educational purposes only. It shares a coaching methodology and does not guarantee any specific promotion, income, or career outcome. Results vary and depend on individual circumstances and effort.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'');
  let h = '';
  if(s.kick) h += `<div class="kick">${s.kick}</div>`;
  if(s.h1) h += `<h1>${s.h1}</h1>`;
  if(s.h3) h += `<h3>${s.h3}</h3>`;
  if(s.h2) h += `<h2>${s.h2}</h2>`;
  if(s.lead) h += `<p class="lead">${s.lead}</p>`;
  if(s.sub) h += `<p class="sub">${s.sub}</p>`;
  if(s.bullets){ h += '<ul>'; s.bullets.forEach(b=> h += `<li>${b}</li>`); h += '</ul>'; }
  if(s.cards){ h += '<div class="grid">'; s.cards.forEach(c=> h += `<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`); h += '</div>'; }
  if(s.stat){ h += `<div style="margin-top:22px"><span class="big">${s.stat}</span><p class="sub" style="margin-top:8px">${s.statlabel}</p></div>`; }
  if(s.btn){ h += `<span class="cta-btn">${s.btn}</span>`; }
  if(s.disc){ h += `<p class="disc">${s.disc}</p>`; }
  if(s.brand){ h += `<div class="brandline">${s.brand}</div>`; }
  h += `<div class="foot">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
