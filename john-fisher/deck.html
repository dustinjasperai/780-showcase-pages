<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Power of a System &middot; John Fisher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#ffffff; --panel:#eaf2f7; --rule:#d7e2ea;
    --accent:#166599; --gold:#b8860b;
    --ink:#14181b; --grey:#5a636b; --dim:#999999;
  }
  html,body{height:100%}
  body{background:#e9edf0;font-family:'IBM Plex Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9edf0}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .38s ease;
    display:flex;flex-direction:column;justify-content:flex-end;padding:8% 9% 13% 9%}
  .slide.active{opacity:1;visibility:visible}
  /* ledger rule under the headline on every content slide, the "manual page" register */
  .t-normal h1, .t-hit h1{position:relative;padding-bottom:2.2vh}
  .t-normal h1::after, .t-hit h1::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:5.6vw;background:var(--accent)}
  .kicker{font-family:'IBM Plex Mono',monospace;font-size:.82vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'IBM Plex Sans',-apple-system,sans-serif;font-weight:600;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title{justify-content:center}
  .t-title h1{font-size:4.4vw;max-width:78%;color:var(--ink);font-weight:700}
  .t-title .sub{font-family:'IBM Plex Sans',sans-serif;font-size:1.3vw;color:var(--grey);margin-top:3.2vh;max-width:64%;line-height:1.62;font-weight:300}
  .t-normal h1{font-size:2.7vw;max-width:82%}
  .t-normal .body{font-family:'IBM Plex Sans',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:2.8vh;max-width:70%;line-height:1.62;font-weight:300}
  .t-section{background:var(--panel);justify-content:center;border-left:1.6vw solid var(--accent)}
  .t-section .idx{font-family:'IBM Plex Mono',monospace;font-size:.95vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  .t-section h1{font-size:3.8vw;max-width:74%;font-weight:700}
  .t-hit{background:var(--panel);justify-content:center;align-items:flex-start}
  .t-hit h1{font-size:2.9vw;max-width:76%;color:var(--ink);line-height:1.2;font-weight:600}
  .t-hit .body{font-family:'IBM Plex Sans',sans-serif;font-size:1.22vw;color:var(--grey);margin-top:3vh;max-width:62%;font-weight:300}
  .t-cta{background:var(--ink);justify-content:center;align-items:center;text-align:center;border-top:1.1vh solid var(--gold)}
  .t-cta h1{font-size:3.4vw;max-width:78%;color:#ffffff}
  .t-cta h1::after{display:none}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'IBM Plex Mono',monospace;border:1.5px solid var(--gold);color:var(--gold);padding:1.2vh 1.8vw;font-size:.98vw;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .brandline{font-family:'IBM Plex Mono',sans-serif;font-size:.9vw;color:#c7d0d6;margin-top:3.6vh;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
  .brandline b{color:var(--gold);font-weight:600}
  .disc{position:absolute;left:9%;right:9%;bottom:4.6vh;font-family:'IBM Plex Sans',sans-serif;font-size:.78vw;color:var(--dim);line-height:1.45;font-weight:300}
  .t-cta .disc{text-align:center;bottom:3.4vh;color:#8a97a0}
  .idxmark{position:absolute;pointer-events:none;font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:.2em}
  .idxmark.big{right:6%;top:9%;font-size:6vw;color:var(--rule)}
  .idxmark.small{right:7%;top:11%;font-size:2.4vw;color:var(--rule)}
  .hud{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(20,24,27,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:12px;right:18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:11px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Sans',sans-serif;font-size:10px;color:var(--dim);z-index:20;letter-spacing:.12em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.4vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:2.9vw}
    .t-title .sub{font-size:3.1vw}.t-section h1{font-size:6.8vw}.t-hit h1{font-size:5.6vw}.t-cta h1{font-size:6.4vw}.chip{font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">The Power of a System</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'The Power of a System',sub:'How to turn what only you know into a firm anyone on your team can run, taught from the same operating manual behind Fisherpedia and the Mastermind Experience.',brand:true,idx:'01'},

 {t:'normal',k:'Who this is for',title:'PI and med-mal owners who are still the bottleneck of their own firm.',body:'Every hard file still gets routed to you. Every new hire needs six months before they stop asking you where things are. You built a firm, and somehow you are still the only one who can run it.',idx:'02'},
 {t:'normal',k:'What you will walk away with',title:'A way to write your own knowledge down so someone else can actually run on it.',body:'Not a philosophy. A method for turning intake, case management and trial prep into documents your team can follow without you standing over them, the way a franchise writes down how the burger gets made.',idx:'03'},
 {t:'normal',k:'An honest note',title:'This is education, not a promise.',body:'Every firm carries a different caseload and a different team. What matters is applying the version of this system that fits your practice.',disc:'Educational content. Nothing here is a promise of income, growth, or business results. No outcome is guaranteed and results vary by firm.',idx:'04'},
 {t:'normal',k:'Who is teaching this',title:'John Fisher. Founder of Ultimate Injury Law, author of The Power of a System.',body:'Eighteen-plus years running a catastrophic injury and medical malpractice practice in New York. His book is an Amazon best-seller used in law school practice-management courses. In 2013, Great Legal Marketing named him Marketer of the Year for referral marketing.',idx:'05'},

 {t:'section',idx:'Part One',title:'Why Growth Breaks At Your Desk'},
 {t:'normal',k:'The bottleneck, named',title:'A firm that only runs when you are in the room is not a firm. It is a job.',body:'Hiring does not fix this by itself. A new associate does not inherit your judgment, only your caseload, and every shortcut you know stays exactly where it has always lived: in your head.',idx:'07'},
 {t:'hit',title:'You did not build a law firm. You built a very expensive job.',body:'Nothing about that changes until the knowledge leaves your head and lands somewhere your team can reach it without you.',idx:'HIT'},
 {t:'normal',k:'The hidden cost',title:'Every associate who leaves takes what you taught them and teaches it to nobody.',body:'The next hire starts from zero. Files stall while you are in trial. Referral sources notice when service slips, because they are the ones who feel it first.',idx:'09'},
 {t:'normal',k:'What most owners try instead',title:'Hiring a rockstar and hoping they figure it out by watching you.',body:'It works until that person leaves, and then the firm is exactly as dependent on the next rockstar as it was on you. Osmosis is not a system. It is a hope.',idx:'10'},

 {t:'section',idx:'Part Two',title:'The Power of a System'},
 {t:'normal',k:'Run it like a franchise, not a family business',title:'Document every repeatable process, the way a chain restaurant documents how a burger gets made.',body:'Intake, sign-up, file build, negotiation, trial prep, hiring. Written down once, quality stops depending on who is on shift and starts depending on the document.',idx:'12'},
 {t:'hit',title:'If it only works because you are in the room, it is not a system yet. It is a habit only you have.',idx:'HIT'},
 {t:'normal',k:'Fisherpedia, the proof it works',title:'His own firm runs on a free, public wiki: video, screenshots and text for every task.',body:'How to e-file a federal complaint. How to schedule a deposition. Every task his firm performs is documented somewhere his own team, and anyone else, can go look it up.',idx:'14'},
 {t:'normal',k:'KPIs that tell the truth early',title:'A handful of numbers that show whether the system is working before the P&L does.',body:'Case-selection criteria, intake conversion, file-aging benchmarks: the same categories his book walks through chapter by chapter, not vague advice about "tracking metrics."',idx:'15'},

 {t:'section',idx:'Part Three',title:'The Referral Engine You Already Have'},
 {t:'normal',k:'His actual words',title:'"When you give away everything that you know, it comes back to you in spades."',body:'Publishing the system in public, the book, the free chapter, Fisherpedia, does not hand your practice to competitors. It turns former competitors into referral sources, because they now know exactly what kind of case, and what kind of lawyer, they are sending.',idx:'17'},
 {t:'hit',title:'The firm that guards its playbook stays small on purpose.',idx:'HIT'},
 {t:'normal',k:'Proof, not theory',title:'The Mastermind Experience: fifteen owners, twice a year, built on trust instead of a funnel.',body:'No ongoing fees. A 100% refund guarantee. Members call it a tribe because they trade referrals and best practices with each other, not just with him. The structure is the teaching.',idx:'19'},
 {t:'normal',k:'What changes',title:'Fewer fires only you can put out, and a referral network that grows because you gave first.',body:'A team that can onboard from documents instead of your calendar. A book, a wiki and a mastermind that keep bringing other owners to you, because you published rather than protected.',idx:'20'},

 {t:'normal',k:'Where to take it next',title:'The same system his own firm runs on, and the fifteen-seat table twice a year.',body:'The Power of a System lays out the doctrine chapter by chapter. Fisherpedia shows it running live. The Mastermind Experience is where fifteen owners compare notes on it in person.',idx:'21'},
 {t:'cta',title:'Write it down. Give it away. Watch what comes back.',chips:['The Power of a System','Apply to the Mastermind Experience'],brand:true,disc:'Educational content only. No income, growth, or business result is guaranteed. Results vary by firm.'},
];

const deck=document.getElementById('deck');
function idxMark(kind,label){return `<div class="idxmark ${kind==='big'?'big':'small'}">${label||''}</div>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1>`;
  } else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">The Power of a <b>System</b> &middot; John Fisher</div>`;
  }
  if(s.idx && s.t!=='section') h+=idxMark(s.idx==='HIT'?'small':'big', s.idx==='HIT'?'':('SEC.'+s.idx));
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
