<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Listings From YouTube, a masterclass with Karin Carr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f7;
    --panel:#ffffff;
    --rule:#d7dfe9;
    --ink:#17253f;
    --muted:#5a6a80;
    --accent:#2f6bd6;
    --accent2:#e8734a;
    --head:'Libre Baskerville',Georgia,serif;
    --body:'Libre Franklin',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(23,37,63,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* search / inbound motif: a query underline sweeping in from top-left */
  .slide::before{content:'';position:absolute;top:0;left:0;height:5px;width:46%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 0 6px 0}
  .kick{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px;font-family:var(--body)}
  h1{font-family:var(--head);font-weight:700;font-size:54px;line-height:1.06;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.12;margin:0 0 20px}
  h3{font-family:var(--head);font-weight:700;font-size:28px;line-height:1.18;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:44ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:16px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-family:var(--body)}
  .big{font-family:var(--head);font-size:96px;line-height:1.02;font-weight:700}
  .strike{color:transparent;-webkit-text-stroke:2px #17253f55;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent2);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:210px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:24px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:56px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:auto;font-family:var(--body)}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.45;font-family:var(--body)}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px;font-family:var(--body)}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:38px}h2{font-size:28px}.big{font-size:60px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Video Boss Agent · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'Get Listings From YouTube',p:'How to turn simple videos into inbound come-list-me calls, without cold calling and without buying leads.',pres:'With <b>Karin Carr</b>, Video Boss Agent'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why your phone stays quiet','It is almost never that you need to make more calls.'],['A video buyers and sellers actually find','How to be the result when they search, not the ad they skip.'],['Your first inbound come-list-me call','The small library of videos that brings clients to you.']]},
 {t:'audience',kick:'Who this is for',h:'You are a great agent. The phone still is not ringing.',p:'Agents who are tired of cold calling, door knocking, and paying more every year for leads that go nowhere.',who:'<b>The trap:</b> you chase harder, buy more leads, and still start every month back at zero, hunting for the next deal.'},
 {t:'reframe',kick:'The reframe',big1:'Chasing leads.',big2:'Getting <span class="em">found</span>.',p:'A cold call interrupts someone who never asked for you. A ranked video answers someone who is already searching for exactly what you do. One drains you. The other compounds.'},
 {t:'part',kick:'Part one',h:'Why the phone stays quiet.'},
 {t:'point',kick:'The core problem',h:'More cold calls is not the answer.',p:'When the pipeline dries up, most agents respond by dialing more, knocking more, spending more. The effort goes up, the burnout goes up, and next month still starts at zero. Volume was never the lever.'},
 {t:'framework',kick:'The core problem',h:'Outbound vs. being found.',row:[['Outbound','You interrupt strangers who did not ask. It stops the moment you stop.'],['Inbound','You get found by people already searching. It keeps working after you hit publish.']],p:'Real estate is a search-first business now. Buyers and sellers type their question into YouTube and Google long before they call anyone.'},
 {t:'point',kick:'The core problem',h:'They are already searching for you.',p:'Someone typing moving to your city, or is now a good time to sell, is a client raising their hand. The only question is whether they find you or the agent who showed up in the results first.'},
 {t:'part',kick:'Part two',h:'The system: get found on YouTube.'},
 {t:'framework',kick:'The method',h:'The Video Boss Agent method.',row:[['Pick a searchable niche','One clear audience and the questions only they ask.'],['Video SEO','Topics chosen by real search demand, not by what feels clever.'],['Value first','Answer the question, do not pitch, and let them self-select.']],p:'Not more content. The right videos, built to be found by ready buyers and sellers.'},
 {t:'cycle',kick:'The workflow',h:'Four steps to a video that gets found.',steps:['Research: find a topic your buyers and sellers are actually searching','Title and keyword: write the exact phrase they type into the box','Film: a simple, helpful video, no fancy gear, no hard sell','Publish and rank: post on a rhythm so it climbs and keeps producing'],p:'One repeatable workflow, batch four in a session. This is how videos get made on purpose instead of by luck.'},
 {t:'point',kick:'The craft',h:'Pick topics by demand, not by clever.',p:'The whole game is choosing questions with real search volume and low competition. Rank for one of those and a single video can bring in calls for years, long after the day you filmed it.'},
 {t:'point',kick:'The craft',h:'Do not ask for the business.',p:'The counterintuitive part: never pitch on camera. Answer the question, be genuinely helpful, and be a normal likeable person. By the time they call, they already trust you and they are ready to move.'},
 {t:'skills',kick:'The craft',h:'What any agent can learn.',li:[['Topic and keyword research','Finding the searches that turn into listings, in minutes a month.'],['Filming through the fear','Simple gear, no script, and getting comfortable on camera.'],['Publishing on a rhythm','The weekly cadence that tells the algorithm you are here to stay.']]},
 {t:'part',kick:'Part three',h:'What this builds for you.'},
 {t:'looks',kick:'The outcome',h:'Come-list-me calls, on repeat.',li:[['Come-list-me calls','People who found you, trust you, and are ready to sign.'],['A library that keeps working','Videos that bring in clients months and years after you post them.'],['A business that is not cold calling','Leads that come to you, so you stop starting every month at zero.']]},
 {t:'truefans',kick:'The thesis',h:'One video can work for years.',p:'You do not need to go viral and you do not need to post every day. You need a small library of searchable videos that keep getting found. A handful of the right ones can carry your whole pipeline.',who:'<b>Principle:</b> build the videos that get found, not the ones that just get likes.'},
 {t:'whyme',kick:'Why Karin',h:'An agent who rebuilt from zero this way.',li:[['Moved to a new city with no clients','Rebuilt the whole business on organic YouTube, no cold calling.'],['A $70M business, one video at a time','Grew it from searchable videos that brought clients to her.'],['Now teaching agents everywhere','Through the bestselling book and Video Boss Agent.']]},
 {t:'cta',kick:'Your next step',h:'Ready to get found instead of chasing?',ctas:['<b>Join Video Boss Agent</b> and get the full system, the community, and coaching.','<b>Start with the course</b> if you want the core video workflow first.'],disc:'This masterclass is educational. It shares frameworks and approaches for building a YouTube channel and getting found; it is not advice for your specific situation and not a guarantee of any particular result. Outcomes vary by agent and market.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`+(s.who?`<div class="who">${s.who}</div>`:'')}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
