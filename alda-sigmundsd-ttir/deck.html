<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Going Indie — a live masterclass with Alda Sigmundsdóttir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ee;        /* warm paper white (light scheme per brand probe) */
    --ink:#1a1a1a;       /* probed dominant color, deck ground ink */
    --rule:#d8d2c6;      /* hairline, tint of the paper ground */
    --accent:#24506b;    /* deep North-Atlantic slate, sourced from her book-world motif */
    --muted:#5a564e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Mulish',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:64px 64px;
    margin:0 0 28px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .num{position:absolute;top:28px;right:34px;font-family:'Besley',serif;font-size:13px;letter-spacing:.14em;color:var(--muted)}
  .eyebrow{font-family:'Besley',serif;font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Besley',serif;font-weight:700;font-size:52px;line-height:1.06;letter-spacing:-.015em;margin-bottom:24px}
  h2{font-family:'Besley',serif;font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-.01em;margin-bottom:20px}
  .lead{font-size:23px;line-height:1.5;color:var(--ink);max-width:40ch}
  .body{font-size:20px;line-height:1.6;color:var(--ink);max-width:52ch;margin-top:8px}
  .body + .body{margin-top:18px}
  .part .kicker{font-family:'Besley',serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .part h2{font-size:46px}
  .hr{height:1px;background:var(--rule);border:0;margin:26px 0;max-width:120px}
  .hr.acc{background:var(--accent);height:3px}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;line-height:1.5;padding:16px 0;border-top:1px solid var(--rule);display:flex;gap:18px;max-width:56ch}
  li:last-child{border-bottom:1px solid var(--rule)}
  li .mk{font-family:'Besley',serif;font-weight:700;color:var(--accent);font-size:17px;min-width:26px}
  .big{font-family:'Besley',serif;font-weight:700;font-size:70px;color:var(--accent);line-height:1;letter-spacing:-.02em}
  .cap{font-family:'Besley',serif;font-size:15px;letter-spacing:.04em;color:var(--muted);margin-top:22px}
  .presenter{font-family:'Besley',serif;font-size:17px;color:var(--ink);margin-top:40px;font-weight:500}
  .presenter span{color:var(--muted);font-weight:400}
  .cta h1{color:var(--ink)}
  .cta .btn{display:inline-block;font-family:'Besley',serif;font-weight:700;font-size:19px;color:var(--bg);background:var(--accent);padding:16px 30px;border-radius:3px;margin-top:8px}
  .disclaimer{font-family:'Besley',serif;font-size:13px;line-height:1.5;color:var(--muted);margin-top:34px;max-width:60ch}
  .emph{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass',
   h:'Keep the Rights, the Royalties, and the Readers',
   lead:'The case for publishing your next book independently, from an author who has done it eleven times.',
   presenter:'Alda Sigmundsdóttir', presenterSub:'Author and founder of Little Books Publishing, Reykjavik'},

  {t:'content', eyebrow:'What you will leave with',
   h:'An honest look at both paths',
   body:['By the end of this hour you will know what a traditional deal really takes from you, what going indie really gives back, and the three things every independent author gets to keep.',
         'No hype. Just the math and the method I have used across eleven books.']},

  {t:'content', eyebrow:'Who this is for',
   h:'You have a book in you',
   body:['Maybe it is written. Maybe it is still in your head. Either way, you have been told the same thing I was: the goal is a traditional publishing deal.',
         'So you query agents, you wait, and you hope someone says yes.']},

  {t:'reframe', eyebrow:'The reframe',
   h:'Here is what that deal actually costs',
   lead:'Your rights. Most of your income. And any direct relationship with the people who read you. You spend years earning a yes, and the yes is where you hand almost all of it away.'},

  {t:'part', kicker:'Part One', h:'The math nobody shows you'},

  {t:'content', eyebrow:'Traditional publishing',
   h:'The numbers behind the dream',
   body:['A traditional contract typically pays the author between 10 and 25 percent of a book’s sales. The publisher owns the rights, sets the price, chooses the cover, and decides how hard to market it.',
         'You wait a year or two for release, and you do most of your own promotion anyway.']},

  {t:'stat', eyebrow:'The same book, two ways',
   big:'10-25%', cap:'What a traditional contract typically pays the author. An indie author keeps up to 70 percent of the same book’s sales.'},

  {t:'content', eyebrow:'And I know the trade firsthand',
   h:'I had the deal',
   body:['My book The Little Book of the Icelanders was picked up by a traditional publisher and became an instant bestseller in print in 2012.',
         'I had the thing most writers are chasing. And after seeing how it worked from the inside, I still chose to publish everything since on my own.']},

  {t:'part', kicker:'Part Two', h:'The three things you keep when you go indie'},

  {t:'pillars', eyebrow:'Pillar one', h:'The economics',
   body:['You keep up to 70 percent of each sale instead of a slice. And because the book never goes out of print, every title becomes a long-term asset that keeps earning, a catalog you own outright.']},

  {t:'pillars', eyebrow:'Pillar two', h:'Creative control',
   body:['Every decision is yours, from the idea to the cover to the price to how it is marketed and sold. No committee waters down the book you meant to write, and nothing is published that you did not approve.']},

  {t:'pillars', eyebrow:'Pillar three', h:'Audience ownership',
   body:['You build a direct line to your readers instead of renting one from a publisher’s marketing department. My Letter from Iceland is exactly that line. When you own the relationship, every new book launches to people who already want it.']},

  {t:'part', kicker:'Part Three', h:'Running it, book after book'},

  {t:'steps', eyebrow:'The indie workflow',
   h:'Simpler than it sounds',
   items:['Write the book you actually want to write',
          'Produce it well, at a cost that can be minimal or even zero',
          'Publish on your own schedule, direct and on the major platforms',
          'Sell to readers you own, then do it again and build a catalog']},

  {t:'content', eyebrow:'The compounding effect',
   h:'Eleven books, fifteen years',
   body:['One book is a project. A catalog is a business. Each title I publish makes the next one easier, because the readers, the method, and the backlist are all already mine.',
         'That is the part a single advance can never buy you.']},

  {t:'credibility', eyebrow:'Why listen to me',
   h:'I have run the whole thing myself',
   items:['Author of eleven books over fifteen years',
          'Former Associated Press correspondent and Guardian contributor',
          'Nearly 800,000 words published through my own blog and newsletter',
          'Founder of my own press, Little Books Publishing, in Reykjavik']},

  {t:'content', eyebrow:'The honest objection',
   h:'"Isn’t indie lower quality, or harder?"',
   body:['It is only lower quality if you let it be, and you are the one in control of that. The work is real, but none of it requires a publisher’s permission, and much of it costs little or nothing to do well.',
         'What you trade that effort for is everything on the last few slides.']},

  {t:'cta', eyebrow:'Your next step',
   h:'Going Indie',
   lead:'If you want the full system, step by step, that is exactly what my course Going Indie walks you through, built on everything I have learned publishing eleven books.',
   btn:'Start with Going Indie',
   disclaimer:'This masterclass is for education only. It is not a guarantee of sales, income, or publishing outcomes. Results depend on your own work, your market, and your book. Royalty and revenue figures describe typical industry ranges, not a promise of what any individual author will earn.'}
];

function el(tag, cls, html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('div','slide '+s.t);
  sl.appendChild(el('div','num', String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')));
  if(s.eyebrow) sl.appendChild(el('div','eyebrow', s.eyebrow));

  if(s.t==='title'){
    sl.appendChild(el('h1',null,s.h));
    sl.appendChild(el('div','lead',s.lead));
    const p=el('div','presenter', s.presenter+' <span>/ '+s.presenterSub+'</span>');
    sl.appendChild(el('hr','hr acc'));
    sl.appendChild(p);
  } else if(s.t==='part'){
    sl.classList.add('part');
    sl.appendChild(el('div','kicker',s.kicker));
    sl.appendChild(el('h2',null,s.h));
    sl.appendChild(el('hr','hr acc'));
  } else if(s.t==='reframe'){
    sl.appendChild(el('h2',null,s.h));
    sl.appendChild(el('div','lead',s.lead));
  } else if(s.t==='stat'){
    sl.appendChild(el('div','big',s.big));
    sl.appendChild(el('div','cap',s.cap));
  } else if(s.t==='pillars'){
    sl.appendChild(el('h2',null,s.h));
    sl.appendChild(el('hr','hr'));
    (s.body||[]).forEach(b=>sl.appendChild(el('div','body',b)));
  } else if(s.t==='steps' || s.t==='credibility'){
    if(s.h) sl.appendChild(el('h2',null,s.h));
    const ul=el('ul');
    (s.items||[]).forEach((it,n)=>{
      const li=el('li');
      li.appendChild(el('span','mk', s.t==='steps'? String(n+1) : '·'));
      li.appendChild(el('span',null,it));
      ul.appendChild(li);
    });
    sl.appendChild(ul);
  } else if(s.t==='cta'){
    sl.classList.add('cta');
    sl.appendChild(el('h1',null,s.h));
    sl.appendChild(el('div','lead',s.lead));
    sl.appendChild(el('div',null,'<span class="btn">'+s.btn+'</span>'));
    sl.appendChild(el('div','disclaimer',s.disclaimer));
  } else {
    if(s.h) sl.appendChild(el('h2',null,s.h));
    (s.body||[]).forEach(b=>sl.appendChild(el('div','body',b)));
  }
  deck.appendChild(sl);
});
</script>
</body>
</html>
