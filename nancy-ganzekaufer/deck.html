<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Respond With Confidence · Nancy Ganzekaufer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F8F2E7; --panel:#EFE2CC; --rule:#E2D2B4;
    --ink:#333333; --soft:#5b4f42; --acc:#CA8956; --acc2:#EDB480; --idx:#8a6a45; --dim:#a79a88;
  }
  html,body{height:100%}
  body{background:#EDE2CE;font-family:'Lato',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#EDE2CE}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.3vw;max-width:90%}
  .t-normal h1{font-size:3.2vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--soft);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.75vw;color:var(--soft);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Lato',sans-serif;font-size:1.4vw;font-weight:700;color:var(--idx);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:90%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#5b3d24 0%,#2c1d12 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;font-style:italic;color:#faf1e4}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#6b4a2c 0%,#2c1d12 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:84%;color:#faf1e4}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid #e0b077;color:#f7e3c8;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:#e2c8a6;font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .key-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-key{right:7.5%;bottom:8%;width:16vw}
  .corner-key{right:6%;bottom:7.5%;width:8vw;opacity:.48}
  .brandline{font-size:1.32vw;color:var(--soft);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(51,51,51,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Profit Insiders Coaching</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- key motif: a single line-art key, echoing "The KEY" pricing tool -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="keyshape" viewBox="0 0 220 140">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="42" cy="70" r="30" stroke="#CA8956" opacity="0.9"/>
    <circle cx="42" cy="70" r="12" stroke="#EDB480" opacity="0.6"/>
    <path d="M70 70 H198" stroke="#CA8956" opacity="0.9"/>
    <path d="M150 70 V96" stroke="#CA8956" opacity="0.75"/>
    <path d="M176 70 V88" stroke="#CA8956" opacity="0.75"/>
    <path d="M198 70 V100" stroke="#CA8956" opacity="0.75"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Respond With Confidence',sub:'A masterclass for practicing interior designers who freeze, over-explain, or cave the moment a client conversation turns hard.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You can design a room in your sleep. It is the conversation that throws you.',body:'You know the floor plan, the specs, the sourcing cold. Then a client pushes back on the invoice or asks for one more thing "real quick," and the composure you carry everywhere else in the job disappears.'},
 {t:'dark',title:'The client is not testing your taste. They are testing your composure.'},

 {t:'section',idx:'Part One',title:'Where Confidence Leaks Out of a Design Business'},
 {t:'normal',k:'The freeze',title:'A hard question lands, and the good answer arrives an hour too late.',body:'In the room, in the moment, the mind goes blank and the mouth fills the silence with an apology instead of an answer. The good response shows up in the car, on the way home.'},
 {t:'normal',k:'The over-explain',title:'You justify the price instead of stating it.',body:'A confident number needs one sentence. A nervous one needs five, and every extra sentence is an invitation for the client to negotiate.'},
 {t:'normal',k:'The scope-creep cave',title:'"Can you just" turns into hours you never billed.',body:'One small ask is reasonable. Ten small asks, each agreed to in the moment to avoid an awkward pause, is a project that quietly stopped paying you for your time.'},
 {t:'dark',title:'Every hard conversation you avoid gets more expensive the next time it comes up.'},

 {t:'section',idx:'Part Two',title:'Respond With Confidence'},
 {t:'normal',k:'Read the room first',title:'Tone and posture arrive before the words do.',body:'A body-language-trained response starts before you speak: what the client’s crossed arms or quick tone are actually telling you, so you answer the real objection instead of only the one said out loud.'},
 {t:'normal',k:'Know the number before you are in the room',title:'The KEY™ prices the project before the conversation starts.',body:'The KEY calculates what a new build, a renovation, a full-service project, or a design-only project should cost, so the number on the table is math you already trust, not a figure you are defending on the spot.'},
 {t:'normal',k:'The scripted response',title:'A blueprint for the five conversations that repeat every month.',body:'Respond with Confidence gives a designer the actual words for the recurring hard moments: the price pushback, the "can you just," the scope change, the complaint, the client who goes quiet. Practiced language instead of an improvised apology.'},
 {t:'normal',k:'Composure is a skill, not a personality trait',title:'You can build the nerve the same way you built the design eye.',body:'Nobody is born comfortable saying a number out loud. It is trained, the same way an eye for proportion is trained, and it gets easier every time the script gets used instead of invented on the spot.'},
 {t:'dark',title:'Confidence is not the absence of a hard question. It is knowing your answer before it is asked.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The designer this builds',title:'You hold the price, keep the scope, and the client still refers you.',body:'A designer who responds with confidence is not the designer clients like less. She is the one they trust more, because a professional who can hold a boundary calmly is exactly who they hired a professional to be.'},
 {t:'dark',title:'The designers who last are not the ones who avoid hard conversations. They are the ones who are ready for them.'},
 {t:'normal',k:'Why Nancy Ganzekaufer',title:'A certified body-language trainer who also does the math.',body:'Nancy Ganzekaufer is a Business Coach, certified Body Language Trainer, and author of Respond with Confidence: A Business Owner’s Blueprint for Handling Difficult Situations. A regular guest on LuAnn Nigara’s Power Talk Friday, she has spent years coaching interior designers on the pricing and the composure that go together.'},

 {t:'section',idx:'Your Next Step',title:'Profit Insiders Academy'},
 {t:'normal',k:'Profit Insiders Academy',title:'A year of coaching built around both halves of the number.',body:'Twice-monthly group coaching, a 1:1 strategy session with Nancy, daily Voxer access for the moment you need the words, and The KEY pricing tool, so you walk into every hard conversation knowing the number and knowing what to say.'},
 {t:'cta',title:'Ready to respond with confidence?',chips:['Take the Coaching Fit Quiz','Book a free clarity call'],disc:'Educational content for interior designers. No income, revenue, or business result is guaranteed. Results vary by designer, market, and how the method is applied.'},
];

const deck=document.getElementById('deck');
function arc(kind){return `<svg class="key-motif ${kind==='title'?'title-key':'corner-key'}"><use href="#keyshape"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Profit Insiders <b>Coaching</b> · Nancy Ganzekaufer</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=arc(s.arc);
  else if(s.t==='title') h+=arc('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
