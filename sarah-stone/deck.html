<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading as a Writer — a masterclass with Sarah Stone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2ebdd;        /* warm paper, derived from brand light scheme + warm #150a0a ink */
    --panel:#fdfbf6;
    --rule:#e0d8c8;
    --ink:#150a0a;       /* harvested near-black ink */
    --muted:#5c5149;
    --accent:#3571e9;    /* harvested accent (brand.json, 16 uses) */
    --serif:"Literata",Georgia,serif;
    --sans:"Montserrat",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d9d2c3;color:var(--ink);font-family:var(--serif)}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:4px;padding:64px 72px;margin:0 0 26px;min-height:540px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(21,10,10,.04);overflow:hidden;
  }
  /* the close-reader's margin: a thin plumb line down the page */
  .slide::before{content:"";position:absolute;top:56px;bottom:56px;left:40px;width:2px;background:var(--accent);opacity:.5}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-weight:600;font-size:54px;line-height:1.05;letter-spacing:-.01em;max-width:18ch}
  h2{font-weight:600;font-size:38px;line-height:1.12;letter-spacing:-.01em;max-width:20ch}
  .lede{font-size:23px;line-height:1.5;color:var(--muted);max-width:34ch;margin-top:22px}
  .big{font-size:40px;line-height:1.22;font-weight:500;max-width:24ch}
  p.body{font-size:21px;line-height:1.55;max-width:40ch;margin-top:18px;color:var(--ink)}
  .part{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .partnum{font-size:88px;font-weight:600;color:var(--accent);line-height:1;margin-bottom:10px}
  ul.lenses{list-style:none;margin-top:26px;max-width:40ch}
  ul.lenses li{font-size:21px;line-height:1.3;padding:14px 0 14px 26px;border-bottom:1px solid var(--rule);position:relative}
  ul.lenses li::before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;background:var(--accent);border-radius:1px}
  .steps{display:flex;flex-direction:column;gap:20px;margin-top:28px;max-width:42ch}
  .step{display:flex;gap:18px;align-items:baseline}
  .step .n{font-family:var(--sans);font-weight:700;color:var(--accent);font-size:18px;min-width:28px}
  .step .t{font-size:21px;line-height:1.4}
  .credit{font-size:20px;line-height:1.5;max-width:40ch;color:var(--ink);margin-top:14px}
  .credit b{font-weight:600}
  .quoteblock{font-style:italic;font-size:26px;line-height:1.5;max-width:34ch}
  .cta h2{max-width:22ch}
  .next{font-family:var(--sans);font-weight:600;font-size:20px;color:var(--accent);margin-top:26px}
  .disc{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--muted);margin-top:40px;max-width:54ch;border-top:1px solid var(--rule);padding-top:16px}
  .foot{position:absolute;bottom:22px;left:72px;font-family:var(--sans);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .pageno{position:absolute;bottom:22px;right:72px;font-family:var(--sans);font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A live masterclass with Sarah Stone',
    h1:'Reading as a Writer',
    lede:'How close-reading a marvelous paragraph deepens the novel you already have.'},

  {t:'who',
    eyebrow:'Who this hour is for',
    h2:'For the writer whose draft is finished, competent, and quietly flat.',
    body:'You are not a beginner. You have a complete or nearly complete manuscript. You have done the hard thing almost no one does. And something about it still sits on the page, polite and a little lifeless.'},

  {t:'trap',
    eyebrow:'The trap',
    big:'You have read the craft books. You know the vocabulary. The draft still will not deepen.',
    body:'Point of view, subtext, pacing, interiority. You can name all of it. Naming it has not changed what the prose actually does to a reader.'},

  {t:'hook',
    eyebrow:'The reframe',
    big:'The problem was never your writing. It is that no one taught you to read like a writer.',
    body:'Depth is not a thing you add. It is a thing you learn to see, first on another writer’s page, then on your own.'},

  {t:'part', partnum:'I', part:'Why competent is not the same as deep'},

  {t:'content',
    eyebrow:'Part One',
    h2:'Flat prose is prose that is only doing one thing at a time.',
    body:'A sentence reports an action. The next reports another. It is clean, correct, and inert. Deep prose carries action, emotion, image, and meaning in the same breath, so the reader feels more than they are told.'},

  {t:'content',
    eyebrow:'Part One',
    h2:'Craft books tell you what. They cannot make you see.',
    body:'A rule you have memorized sits in the front of your mind. A pattern you have watched a great writer build, sentence by sentence, goes into your hand. That is the gap this method closes.'},

  {t:'part', partnum:'II', part:'The method: reading as a writer'},

  {t:'steps',
    eyebrow:'Part Two',
    h2:'Three passes through a marvelous paragraph.',
    steps:[
      ['1','Read it once for pleasure. Let it work on you the way it works on any reader, before you take it apart.'],
      ['2','Fillet it, sentence by sentence, paragraph by paragraph. What is each sentence actually doing, and how.'],
      ['3','Dismantle the architecture until the structure and the foundation become clear, then rebuild it in your own work.']]},

  {t:'content',
    eyebrow:'Part Two',
    h2:'A marvelous paragraph is the smallest unit that teaches everything.',
    body:'Short enough to hold in your head whole. Rich enough to contain character, image, structure, and feeling at once. We read for the splendid paragraph, the stanza, the occasional page or two, and we read closely.'},

  {t:'lenses',
    eyebrow:'Part Two',
    h2:'What we look for when we fillet it:',
    lenses:[
      'Plot and structure, and how they carry meaning',
      'Character, relationship, and point of view',
      'Patterns of language and imagery',
      'Dialogue and the subtext beneath it',
      'World, backstory, tension, and pacing']},

  {t:'quote',
    eyebrow:'What it feels like',
    quote:'You stop asking "is this good" and start asking "what is this doing, and could I do it too."',
    body:'That single shift, from judging to seeing, is the whole hour.'},

  {t:'part', partnum:'III', part:'Back at your own manuscript'},

  {t:'content',
    eyebrow:'Part Three',
    h2:'Character embodiment.',
    body:'People who live authentically in their bodies on the page, not heads narrating from nowhere. Once you can see how a writer puts a character in a body, you can put yours there too.'},

  {t:'content',
    eyebrow:'Part Three',
    h2:'Plumb lines into the depths.',
    body:'The depth under an apparently light moment. The best paragraphs drop a line straight down from a small surface into something that matters, without ever announcing it.'},

  {t:'content',
    eyebrow:'Part Three',
    h2:'Narrative architecture.',
    body:'How structure holds and releases meaning. When you can read the architecture of a paragraph, you can diagnose why a scene of your own feels loose, and you can fix it by design rather than by guesswork.'},

  {t:'content',
    eyebrow:'Part Three',
    h2:'The organizing principle of the self.',
    body:'A writer’s real obsessions shape the work across every genre they touch. Finding yours is what turns a competent draft into a book only you could have written.'},

  {t:'credit',
    eyebrow:'Who is teaching this',
    h2:'Sarah Stone',
    credit:'Novelist and fiction-writing instructor. Author of <b>Deepening Fiction: A Practical Guide for Intermediate and Advanced Writers</b> (with Ron Nyren), and of the novels <b>Marriage to the Sea</b>, <b>Hungry Ghost Theater</b>, and <b>The True Sources of the Nile</b>. Her fiction has appeared in Ploughshares, Image, and The Believer, and in The Best American Short Stories. She has taught at UC Berkeley, the Warren Wilson MFA Program for Writers, and Stanford Continuing Studies.'},

  {t:'content',
    eyebrow:'The shift',
    h2:'Leave with a method, not a pep talk.',
    body:'You will have a repeatable way to read any paragraph you love, pull the craft out of it, and carry that craft back to your own manuscript. The draft you already finished is the one that gets deeper.'},

  {t:'cta',
    eyebrow:'Your next step',
    h2:'Bring a paragraph you love and a page of your own.',
    next:'Join the live masterclass, then work with Sarah on your manuscript.',
    disc:'Educational only. This masterclass teaches craft. No publication, representation, sale, income, or other result is guaranteed. Results vary with the writer and the work.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'');
  let h = '';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){ h += '<h1>'+s.h1+'</h1>'; if(s.lede) h+='<p class="lede">'+s.lede+'</p>'; }
  else if(s.t==='part'){ h = '<div class="partnum">'+s.partnum+'</div><div class="part">'+s.part+'</div>'; }
  else if(s.t==='trap'||s.t==='hook'){ h += '<p class="big">'+s.big+'</p>'; if(s.body) h+='<p class="body">'+s.body+'</p>'; }
  else if(s.t==='steps'){ h += '<h2>'+s.h2+'</h2><div class="steps">'+s.steps.map(x=>'<div class="step"><span class="n">'+x[0]+'</span><span class="t">'+x[1]+'</span></div>').join('')+'</div>'; }
  else if(s.t==='lenses'){ h += '<h2>'+s.h2+'</h2><ul class="lenses">'+s.lenses.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  else if(s.t==='quote'){ h += '<p class="quoteblock">'+s.quote+'</p>'; if(s.body) h+='<p class="body">'+s.body+'</p>'; }
  else if(s.t==='credit'){ h += '<h2>'+s.h2+'</h2><p class="credit">'+s.credit+'</p>'; }
  else if(s.t==='cta'){ h += '<h2>'+s.h2+'</h2><div class="next">'+s.next+'</div><div class="disc">'+s.disc+'</div>'; }
  else { if(s.h2) h += '<h2>'+s.h2+'</h2>'; if(s.body) h+='<p class="body">'+s.body+'</p>'; }
  el.innerHTML = h + '<div class="foot">Reading as a Writer</div><div class="pageno">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(el);
});
</script>
</body>
</html>
