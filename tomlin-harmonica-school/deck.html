<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From First Clean Note to Real Blues | Tomlin Harmonica School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16121C;
  --panel:#241A2E;
  --rule:#3B2C44;
  --accent:#D99A3E;
  --accent2:#B23A2E;
  --ink:#F3ECE3;
  --muted:#B7A9B8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
.deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
.slide{
  position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:52px 56px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;
  justify-content:center;overflow:hidden;
}
.slide::before{
  content:"";position:absolute;top:0;right:0;width:180px;height:100%;
  background:radial-gradient(120px 300px at 100% 0%, rgba(217,154,62,.16), transparent 70%);
  pointer-events:none;
}
.reed{position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--accent),var(--accent2))}
.kicker{font-family:'Inter';font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  font-size:12px;color:var(--accent);margin-bottom:18px}
h1{font-family:'Zilla Slab';font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
h2{font-family:'Zilla Slab';font-weight:600;font-size:38px;line-height:1.1;margin-bottom:14px}
h3{font-family:'Zilla Slab';font-weight:600;font-size:26px;color:var(--accent);margin-bottom:6px}
p{font-size:20px;line-height:1.5;color:var(--ink);max-width:44ch}
p.sub{font-size:23px;color:var(--muted);margin-top:18px;max-width:48ch}
ul{list-style:none;margin-top:18px}
li{font-size:20px;line-height:1.45;padding:10px 0 10px 30px;position:relative;color:var(--ink);max-width:52ch}
li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:3px;background:var(--accent);border-radius:2px}
.big{font-size:34px;line-height:1.25;font-family:'Zilla Slab';font-weight:500;max-width:24ch}
.present{margin-top:36px;color:var(--muted);font-size:17px}
.present b{color:var(--ink);font-weight:600}
.num{font-family:'Zilla Slab';font-weight:700;font-size:20px;color:var(--accent2);
  border:1px solid var(--rule);border-radius:50%;width:44px;height:44px;display:flex;
  align-items:center;justify-content:center;margin-bottom:16px}
.disc{margin-top:26px;font-size:14px;color:var(--muted);max-width:60ch;line-height:1.5}
.cover h1{font-size:60px}
.tag{display:inline-block;font-size:13px;color:var(--muted);border:1px solid var(--rule);
  border-radius:999px;padding:6px 14px;margin-top:22px}
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);
  background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:6px 16px}
.foot{position:absolute;bottom:20px;left:56px;font-size:12px;color:var(--muted);letter-spacing:.04em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav" id="nav"></div>
<script>
const S=[
  {t:'title', k:'Live Masterclass', h:'From First Clean Note to Real Blues',
   sub:'The ordered path to playing 12-bar blues harmonica you are actually proud of.',
   present:'Presented by Tomlin Leckie, Tomlin Harmonica School'},

  {t:'promise', k:'What this is', h:'In the next 60 minutes',
   body:'I am going to show you the exact order to learn blues harmonica in, so you stop collecting random licks and start playing real tunes that sound like the blues. No talent required. Just the right steps in the right sequence.'},

  {t:'who', k:'Who this is for', h:'This is for you if',
   items:['You bought a harmonica, got excited, and then quietly stalled.',
          'You have watched a hundred free videos and still cannot play a whole song.',
          'You want the blues sound, not just isolated notes and drills.',
          'You are an adult who learns best with a clear plan, not guesswork.']},

  {t:'trap', k:'The honest truth', h:'It is not you, and it is not the harp',
   body:'Almost everyone who quits the harmonica quits for the same reason. They were never given an order. They jumped from a bending tutorial to a fast lick to a scale chart, practiced a bit of everything, and got good at nothing. The instrument is the easiest one in the world to start. It is one of the hardest to learn well without a path.'},

  {t:'reframe', k:'The reframe', big:'Progress on harmonica is not about talent. It is about sequence. Learn the right things in the right order and the blues shows up faster than you think.'},

  {t:'section', k:'Part One', h:'Why self-teaching stalls'},

  {t:'point', n:'1', h:'No clean foundation',
   body:'Most beginners never lock in clean single notes and steady breathing first. Everything built on a shaky foundation stays shaky. This is the step people skip because it feels too simple, and it is exactly why they plateau.'},

  {t:'point', n:'2', h:'Licks before rhythm',
   body:'People chase flashy licks before they can hold a groove. But blues lives in the rhythm. A simple lick played in time sounds great. A fancy one played out of time sounds like practice.'},

  {t:'point', n:'3', h:'Drills, never real music',
   body:'Endless dry exercises with no song at the end kill motivation. You should be playing real music almost immediately, over a backing track, so every practice session sounds and feels like the blues.'},

  {t:'section', k:'Part Two', h:'The method: the right order'},

  {t:'pillar', n:'01', h:'Getting Started',
   body:'The clean foundation first. Which harmonica to get, how to hold it, how to breathe, and how to play clean single notes on demand. Boring to hear, thrilling to feel, and the thing that makes everything after it possible.'},

  {t:'pillar', n:'02', h:'Foundations of Blues Playing',
   body:'Now the fun. Simple chugging and your first blues licks, then the 12-bar blues structure and how to follow it with confidence. From here you are playing real music, not dry exercises, over real backing tracks.'},

  {t:'pillar', n:'03', h:'Building Your Blues Sound',
   body:'This is where it starts to sound like you. Locking into shuffle rhythms, adding triplets to open up your phrasing, and learning playable 12-bar tunes that genuinely sound good when you play them for someone.'},

  {t:'method', k:'How each lesson works', h:'You are never left guessing',
   items:['A short teaching video that shows the move clearly.',
          'A phrase breakdown, clip by clip, so nothing is too fast.',
          'Standard notation and tabs, so you can read it either way.',
          'A slow playthrough track, then a full backing track to play along to.']},

  {t:'journey', k:'The path', h:'A full 13-month journey',
   body:'It is not a pile of videos. It is a month-by-month curriculum with a practice guide for each month, so you always know what to work on next. From your first clean note to solid advanced-beginner blues, in a logical order that keeps you moving.'},

  {t:'whyme', k:'Why learn this from me', h:'Tomlin Leckie',
   items:['Fifteen years teaching harmonica, from total beginners to gigging players.',
          'A school built around blues, with live seminars and a real community.',
          'A long-running podcast and channel where I answer the questions beginners actually have.',
          'On the PLUS path, personal weekly feedback on the recordings you send in.']},

  {t:'recap', k:'The one idea', big:'You do not need more talent or a better harmonica. You need the steps in the right order, and real music to play from day one.'},

  {t:'cta', k:'Your next step', h:'Start your blues journey',
   body:'If you want the whole ordered path, the backing tracks, the live seminars and the community, come and try the school. Start with the beginner curriculum and play your first real 12-bar blues sooner than you would expect.',
   disc:'This masterclass is educational. No specific result or level of playing is guaranteed. Results vary with the time and practice you put in.'}
];

const deck=document.getElementById('deck');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='title'?'cover':'');
  let inner='<span class="reed"></span>';
  if(s.k) inner+='<div class="kicker">'+esc(s.k)+'</div>';
  if(s.n) inner+='<div class="num">'+esc(s.n)+'</div>';
  if(s.h && s.t==='title') inner+='<h1>'+esc(s.h)+'</h1>';
  else if(s.h && (s.t==='section')) inner+='<h1>'+esc(s.h)+'</h1>';
  else if(s.h) inner+='<h2>'+esc(s.h)+'</h2>';
  if(s.sub) inner+='<p class="sub">'+esc(s.sub)+'</p>';
  if(s.big) inner+='<p class="big">'+esc(s.big)+'</p>';
  if(s.body) inner+='<p>'+esc(s.body)+'</p>';
  if(s.items){inner+='<ul>';s.items.forEach(it=>inner+='<li>'+esc(it)+'</li>');inner+='</ul>';}
  if(s.present) inner+='<div class="present"><b>'+esc(s.present)+'</b></div>';
  if(s.disc) inner+='<div class="disc">'+esc(s.disc)+'</div>';
  inner+='<div class="foot">Tomlin Harmonica School</div>';
  el.innerHTML=inner;
  deck.appendChild(el);
});
document.getElementById('nav').textContent=S.length+' slides';
</script>
</body>
</html>
