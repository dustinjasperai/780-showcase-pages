<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>The Luxury Gap — masterclass concept</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1d1b17;font-family:sans-serif;display:flex;flex-direction:column;
 align-items:center;min-height:100vh;padding:28px 16px}
.stage{position:relative;width:100%;max-width:1040px;aspect-ratio:16/9;background:#000;
 box-shadow:0 24px 60px rgba(0,0,0,.5)}
.pg{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
.pg.on{display:block}
.bar{display:flex;align-items:center;gap:20px;margin-top:20px;color:#cfc9ba;
 font-family:'Jost',sans-serif;font-size:15px;letter-spacing:.15em}
button{background:#bcaf6b;color:#1d1b17;border:0;padding:10px 20px;font-size:14px;
 letter-spacing:.1em;cursor:pointer;font-weight:600;text-transform:uppercase}
button:disabled{opacity:.35;cursor:default}
#c{min-width:72px;text-align:center}
</style></head><body>
<div class='stage'><iframe src='01.html' class='pg' data-i='1'></iframe><iframe src='02.html' class='pg' data-i='2'></iframe><iframe src='03.html' class='pg' data-i='3'></iframe><iframe src='04.html' class='pg' data-i='4'></iframe><iframe src='05.html' class='pg' data-i='5'></iframe><iframe src='06.html' class='pg' data-i='6'></iframe><iframe src='07.html' class='pg' data-i='7'></iframe><iframe src='08.html' class='pg' data-i='8'></iframe><iframe src='09.html' class='pg' data-i='9'></iframe><iframe src='10.html' class='pg' data-i='10'></iframe><iframe src='11.html' class='pg' data-i='11'></iframe><iframe src='12.html' class='pg' data-i='12'></iframe><iframe src='13.html' class='pg' data-i='13'></iframe><iframe src='14.html' class='pg' data-i='14'></iframe><iframe src='15.html' class='pg' data-i='15'></iframe><iframe src='16.html' class='pg' data-i='16'></iframe><iframe src='17.html' class='pg' data-i='17'></iframe><iframe src='18.html' class='pg' data-i='18'></iframe><iframe src='19.html' class='pg' data-i='19'></iframe><iframe src='20.html' class='pg' data-i='20'></iframe><iframe src='21.html' class='pg' data-i='21'></iframe><iframe src='22.html' class='pg' data-i='22'></iframe></div>
<div class='bar'><button id='p'>Prev</button><span id='c'></span><button id='n'>Next</button></div>
<script>
var pg=[].slice.call(document.querySelectorAll('.pg')),i=0;
function show(k){pg[i].classList.remove('on');i=Math.max(0,Math.min(pg.length-1,k));
 pg[i].classList.add('on');document.getElementById('c').textContent=(i+1)+' / '+pg.length;
 document.getElementById('p').disabled=i==0;document.getElementById('n').disabled=i==pg.length-1;}
document.getElementById('p').onclick=function(){show(i-1)};
document.getElementById('n').onclick=function(){show(i+1)};
document.addEventListener('keydown',function(e){if(e.key=='ArrowRight')show(i+1);if(e.key=='ArrowLeft')show(i-1);});
show(0);
</script></body></html>
