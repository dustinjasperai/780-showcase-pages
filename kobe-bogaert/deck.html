<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Conversations That Turn a Group Into a Team - Kobe Bogaert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eceff5; --panel:#fbfcfe; --ink:#1e293b; --body:#334155;
    --muted:#64748b; --rule:#d8dde6; --accent:#595e90; --accent2:#bf474b;
    --serif:"DM Serif Display",Georgia,serif; --sans:"Montserrat",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 48px;margin:0 0 26px;min-height:440px;display:flex;flex-direction:column;
    box-shadow:0 1px 2px rgba(30,41,59,.04),0 10px 30px rgba(30,41,59,.05)}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:34px;line-height:1.14}
  .lede{font-size:20px;line-height:1.5;color:var(--body);margin-top:18px;max-width:40em}
  p{font-size:17px;line-height:1.62;color:var(--body);margin-top:14px;max-width:42em}
  .big{font-family:var(--serif);font-size:38px;line-height:1.16;color:var(--ink);max-width:20em}
  .mark{box-shadow:inset 0 -.28em 0 rgba(191,71,75,.22)}
  .sub{color:var(--muted);font-size:16px;margin-top:14px}
  ul{margin:20px 0 0 0;list-style:none}
  li{position:relative;padding-left:26px;font-size:17px;line-height:1.5;color:var(--body);margin-top:14px;max-width:40em}
  li:before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;border-radius:2px;background:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:26px}
  .card{border:1px solid var(--rule);border-radius:10px;padding:22px 22px 20px;background:#ffffff}
  .card h3{font-family:var(--sans);font-weight:700;color:var(--ink);font-size:15px;letter-spacing:.02em;margin-bottom:8px}
  .card.a{border-top:3px solid var(--accent2)}
  .card.b{border-top:3px solid var(--accent)}
  .card p{font-size:15px;margin-top:6px}
  .spacer{flex:1}
  .foot{margin-top:26px;color:var(--muted);font-size:13px;border-top:1px solid var(--rule);padding-top:16px}
  .cta-step{font-family:var(--serif);font-size:30px;color:var(--ink);margin-top:10px}
  .disc{color:var(--muted);font-size:13px;line-height:1.5;margin-top:18px;max-width:44em}
  @media(max-width:640px){.slide{padding:34px 26px}.two{grid-template-columns:1fr}h1{font-size:34px}.big{font-size:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass', h:'The Conversations That Turn a Group Into a Team',
   lede:'How the two promises, and the one conversation most leaders avoid, move a team from a mood of resignation to a mood of ambition.',
   foot:'Kobe Bogaert &middot; Altus Growth Partners &middot; Co-author, Growing Groups Into Teams'},
  {t:'content', k:'Who this is for', h:'For the leader whose people are good, but not yet a team',
   p:'Smart people. Full calendars. Results that are fine. And still it runs like a group of talented individuals who happen to share a boss, not a team that moves as one. If that is the gap you feel, this hour is for you.'},
  {t:'big', k:'The reframe',
   big:'Your team is not stuck because of a skills gap. It is stuck because of a <span class="mark">conversation you have not had</span>.',
   sub:'That is the whole premise of the next hour.'},
  {t:'content', k:'The idea behind everything', h:'Teams live in one of two moods',
   p:'A team works in a mood of ambition or a mood of resignation. That mood is not personality and it is not luck. It is produced by the conversations a leader has had, and by the ones they have quietly avoided. Change the conversation and you change the mood the work gets done in.'},
  {t:'content', k:'Part one, the core problem', h:'A group shares a calendar. A team shares a promise.',
   p:'Most groups are organized by reporting lines and recurring meetings. That makes a group, not a team. A team is a set of people who have made a shared promise with observable outcomes, who navigate hard things together, and who hold each other, not just the org chart.'},
  {t:'bullets', k:'Part one', h:'What staying a group actually costs',
   list:['Decisions get made in the meeting, then unmade in the hallway.','Disagreement goes silent instead of getting resolved, so it shows up later as rework.','People protect their lane instead of the shared outcome.','Everyone is busy, and no one is sure the group is winning.']},
  {t:'two', k:'Part two, the method', h:'Two promises turn a group into a team',
   p:'The move from group to team is not a retreat or a personality test. It runs on two promises people make out loud and then keep.',
   two:[['Promise one','A promise to a shared outcome with observable results, so the team knows what winning looks like and when it has happened.'],['Promise two','A promise to each other, to raise the hard thing early, to ask for help, and to back the team member who is carrying the weight.']]},
  {t:'bullets', k:'Part two', h:'The ten essential elements, sorted for your team',
   p:'Across teams in many industries and cultures, the same building blocks show up. We sort them into the four that move the needle fastest for your team.',
   list:['Shared purpose and a promise with observable outcomes.','Trust and accountability that people extend to each other.','Difference used on purpose, so more perspectives reach the decision.','Candor and self-awareness, where every voice and every blind spot is in the room.']},
  {t:'content', k:'Element in focus', h:'Trust is built, and rebuilt',
   p:'Trust is not a vibe you either have or you do not. It is built in small kept promises and rebuilt deliberately after it breaks. We look at what rebuilds it, and the one leader habit that quietly erodes it.'},
  {t:'content', k:'Element in focus', h:'Candor, where all the voices are actually in the room',
   p:'Most teams are quietly running on the opinions of the two loudest people. We cover how to make it safe and normal for the quiet expertise to reach the table, so the decision is made with everything the team knows, not just what is comfortable to say.'},
  {t:'content', k:'Element in focus', h:'The leader has strengths, and blind spots',
   p:'The single highest-leverage move is a leader who can name their own blind spots in front of the team. It gives everyone else permission to do the same. We make that concrete, not aspirational.'},
  {t:'big', k:'The turn',
   big:'The team you want is on the other side of <span class="mark">the conversation you keep postponing</span>.',
   sub:'Naming the missing conversation is where the real work starts.'},
  {t:'content', k:'The method', h:'Leading with care through the hard conversation',
   p:'High-stakes conversations are avoided because they feel like conflict. They do not have to. We walk through how to open the conversation your team needs, with care and without flinching, so ambition replaces resignation as the mood the work happens in.'},
  {t:'two', k:'Part three, the team in the room', h:'From group behaviors to team behaviors',
   two:[['A group','Alignment ends at the meeting door. Problems surface late. People defend their function.'],['A team','The promise is shared and visible. Hard things are raised early. People back the outcome and each other.']]},
  {t:'bullets', k:'Part three', h:'What you walk out with',
   list:['The two promises your team is missing, named out loud.','The one conversation you have been postponing, and a way to open it with care.',"A read on which essential element is your team's real constraint right now."]},
  {t:'why', k:'Why this, why us', h:'Where this comes from',
   p:'Kobe Bogaert is co-founder and Managing Director of Altus Growth Partners and co-author of Growing Groups Into Teams. He co-hosts the Missing Conversations podcast and has spent 25 years helping executive teams work together, drawing on the practice of Generative Leadership. Altus has worked with leadership teams at organizations including Illumina and Viasat.',
   foot:'Facts stated here are from public sources. Nothing in this session guarantees a result.'},
  {t:'content', k:'Is this you', h:'Who gets the most from this',
   p:'Leaders of a team that is good on paper and not yet a team in the room. Founders and executives scaling past the point where talent alone carries the work. If the missing conversation is costing you more than you would like to admit, start there.'},
  {t:'cta', k:'Your next step', h:'Have the conversation about your team',
   step:'Book a working conversation with Altus Growth Partners.',
   p:'We name the two promises your team is missing and the one conversation worth having first. You leave with something you can use whether or not we ever work together.',
   disc:'Educational content only. This masterclass does not provide and does not guarantee any specific business, financial, or performance outcome. Results vary by team and leader.'}
];
function render(s){
  let x = `<div class="kicker">${s.k||''}</div>`;
  if(s.t==='title'){ x += `<h1>${s.h}</h1><p class="lede">${s.lede}</p>`; }
  else if(s.t==='big'){ x += `<div class="big">${s.big}</div><div class="sub">${s.sub}</div>`; }
  else { if(s.h) x += `<h2>${s.h}</h2>`; }
  if(s.step) x += `<p class="cta-step">${s.step}</p>`;
  if(s.p && s.t!=='title') x += `<p>${s.p}</p>`;
  if(s.list){ x += '<ul>'; s.list.forEach(i=> x += `<li>${i}</li>`); x += '</ul>'; }
  if(s.two){ x += '<div class="two">'; s.two.forEach((c,i)=> x += `<div class="card ${i===0?'a':'b'}"><h3>${c[0]}</h3><p>${c[1]}</p></div>`); x += '</div>'; }
  x += '<div class="spacer"></div>';
  if(s.disc) x += `<p class="disc">${s.disc}</p>`;
  if(s.foot) x += `<div class="foot">${s.foot}</div>`;
  return `<div class="slide">${x}</div>`;
}
document.getElementById('deck').innerHTML = S.map(render).join('');
</script>
</body>
</html>
