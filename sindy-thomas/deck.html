<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hired From the Inside — Insider's Career Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141a4a;        /* ground: darkened from brand #2b2e83 */
    --panel:#1d2560;     /* panel: brand indigo family */
    --rule:#2b2e83;      /* rule: brand dominant hex */
    --accent:#00b9e8;    /* accent: brand cyan from brand.json */
    --ink:#eef1fb;
    --muted:#aab2d8;
    --head:'Archivo',system-ui,sans-serif;
    --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0c1030;color:var(--ink);font-family:var(--body)}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:56px 60px;margin:0 0 26px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;margin-bottom:16px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:40ch;margin-bottom:14px}
  p.sub{color:var(--muted);font-size:19px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;line-height:1.45;padding:12px 0 12px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:3px;background:var(--accent)}
  li b{font-family:var(--head);font-weight:700}
  .num{font-family:var(--head);font-weight:800;font-size:66px;color:var(--panel);
    -webkit-text-stroke:1.5px var(--accent);line-height:1;margin-bottom:10px}
  .big{font-size:26px;line-height:1.4;max-width:34ch;font-family:var(--head);font-weight:600}
  .foot{position:absolute;right:24px;bottom:18px;font-size:12px;color:var(--muted);letter-spacing:.05em}
  .brand{position:absolute;left:30px;bottom:18px;font-family:var(--head);font-weight:700;font-size:12px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .disc{font-size:14px;color:var(--muted);max-width:60ch;margin-top:18px}
  .cta-box{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:22px 26px;margin-top:18px;max-width:44ch}
  .cta-box p{margin:0;font-family:var(--head);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:"The Insider's Career Club · Live Class",
   h1:"Hired From the Inside",
   p:"What recruiters really look for when they shortlist, and how to give it to them before you ever apply.",
   sub:"With Sindy Thomas, 25 years in corporate talent acquisition."},

  {t:'agenda', kicker:"What you'll leave with",
   h2:"Three things, in the next hour",
   bullets:[
     "How a recruiter actually decides in the first seven seconds.",
     "The three moves that put you on the inside of that decision.",
     "A clear first step you can take this week, on your own search."]},

  {t:'audience', kicker:"Who this is for",
   h2:"You're good at your work. The hiring process still doesn't reward it.",
   bullets:[
     "You apply, tailor, and wait, and the replies don't match the effort.",
     "You get interviews, then silence, and no one tells you what actually happened.",
     "You watch less-qualified people move up while your contribution stays invisible."],
   p:"None of that is because you aren't good enough. It's because you're guessing at a process that was built to screen you out fast."},

  {t:'hook', kicker:"The reframe",
   big:"A job search isn't an application contest. It's a screening system, and the person reading your resume spends about seven seconds deciding.",
   p:"I know, because deciding was my job for 25 years."},

  {t:'part', kicker:"Part One", num:"01",
   h2:"The core problem: you're being read by a recruiter, not an algorithm",
   p:"Before a hiring manager ever sees you, someone like me has already sorted you into yes, maybe, or no. Most advice teaches you to impress the manager. Almost none of it teaches you to survive the recruiter."},

  {t:'bullets', kicker:"Part One",
   h2:"What the seven-second read is actually checking",
   bullets:[
     "<b>Fit, fast:</b> can I tell in one glance what role you're for?",
     "<b>Proof, not adjectives:</b> numbers and outcomes beat responsibilities.",
     "<b>Risk:</b> gaps, hops, and vague titles make me hesitate, so I move on.",
     "<b>Signal:</b> does your language match how the team talks about the work?"]},

  {t:'bullets', kicker:"Part One",
   h2:"Why the usual advice backfires",
   bullets:[
     "\"Just network more\" skips the screen that happens before any intro helps.",
     "\"Apply to everything\" trains recruiters to read you as a mismatch.",
     "\"Be confident\" is useless when you don't know what's being measured."],
   p:"Good people follow this advice and still get filtered. The advice isn't built from the hiring side. Mine is."},

  {t:'part', kicker:"Part Two", num:"02",
   h2:"The method: three moves that put you on the inside",
   p:"This is the Insider's Career Club approach. Not more applications, better positioning, drawn from how the screening really works."},

  {t:'framework', kicker:"Move One · Resume Rx",
   h2:"Get read like a recruiter reads",
   bullets:[
     "Rebuild the top third of the resume around the one role you want next.",
     "Translate duties into proof: scope, numbers, and the result you drove.",
     "Cut the lines that create hesitation before they cost you the shortlist."],
   p:"You stop writing for a human who has all day. You write for one who has seven seconds."},

  {t:'framework', kicker:"Move Two · The 6 Step Recognition Strategy",
   h2:"Be seen, heard, and credited for the work",
   bullets:[
     "Make your contribution visible on purpose, not by luck.",
     "Build the language that gets you remembered in the rooms you're not in.",
     "Turn quiet competence into the story a decision-maker can repeat for you."],
   p:"Recognition is a strategy, not a personality. It can be built, step by step."},

  {t:'framework', kicker:"Move Three · The 5 Step Career Elevator",
   h2:"Aim a level up, not just a lateral move",
   bullets:[
     "Map where you actually want to be, then reverse-engineer the next rung.",
     "Prepare for the interview the way the employer prepares to screen you.",
     "Negotiate the offer like the person who used to sit across the table."],
   p:"Landing a job is the floor. Climbing on purpose is the point."},

  {t:'bullets', kicker:"The mindset underneath it",
   h2:"Get your groove back first",
   bullets:[
     "Self-doubt reads on the page and in the room, and recruiters feel it.",
     "Confidence isn't a mood, it's preparation you can see.",
     "You rebuild it by knowing exactly what the other side is looking for."],
   p:"I lost my health, my job, my home, and my marriage inside eighteen months, then rebuilt from nothing. The method on these slides is the one I used."},

  {t:'bullets', kicker:"Before you build",
   h2:"The habits that get you screened out",
   bullets:[
     "One resume sent to twenty different kinds of roles.",
     "A profile that lists tasks instead of the results you drove.",
     "Waiting to be noticed instead of making the contribution visible.",
     "Treating the interview as a test to pass, not a decision to shape."]},

  {t:'part', kicker:"Part Three", num:"03",
   h2:"When the inside view takes hold",
   p:"Not a frantic spray of applications. A short list of the right roles, a resume that clears the screen, and interviews where you already know what they're measuring."},

  {t:'bullets', kicker:"The shift",
   h2:"From outside the glass to inside the room",
   bullets:[
     "You apply to fewer roles and hear back from more of them.",
     "You walk into interviews prepared for how the decision gets made.",
     "You ask for the offer you want, because you know what it's worth."]},

  {t:'bullets', kicker:"A realistic picture",
   h2:"What the next ninety days can look like",
   bullets:[
     "Weeks 1-2: one role defined, resume rebuilt to clear the screen.",
     "Weeks 3-6: recognition and visibility moves, interviews start landing.",
     "Weeks 7-12: interview and negotiation prep, aimed a level up."],
   p:"A sequence, not a scramble. That's the whole difference."},

  {t:'credibility', kicker:"Why me",
   h2:"I spent 25 years on the hiring side of the desk",
   bullets:[
     "Recruiter, Recruiting Manager, and Director of Talent Acquisition.",
     "Hired across Clorox, Amgen, and Pfizer-backed biotech and pharma.",
     "Host of the Insider's Career Club podcast, now coaching women full time."],
   p:"Everything here is what I actually did when I was the one shortlisting."},

  {t:'quote', kicker:"In a client's words",
   big:"\"I find it very beneficial to prepare yourself and practice before interviewing. Sindy is an expert.\"",
   sub:"Insider's Career Club client, insiderscareerclub.com"},

  {t:'cta', kicker:"Your next step",
   h2:"Let's map your path from the inside",
   p:"Book a free 15-minute assessment call with me. We'll look at where you are, where you want to be, and the first move that gets you read like a recruiter reads.",
   cta:"Book your free assessment call at insiderscareerclub.com",
   disc:"Educational content only. Every career is different; results vary and are not guaranteed. Nothing here is a promise of a job, an offer, or a specific outcome."}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if(s.num) html += `<div class="num">${s.num}</div>`;
  if(s.h1) html += `<h1>${s.h1}</h1>`;
  if(s.h2) html += `<h2>${s.h2}</h2>`;
  if(s.big) html += `<p class="big">${s.big}</p>`;
  if(s.bullets){ html += '<ul>'; s.bullets.forEach(b=>html+=`<li>${b}</li>`); html += '</ul>'; }
  if(s.p) html += `<p>${s.p}</p>`;
  if(s.sub) html += `<p class="sub">${s.sub}</p>`;
  if(s.cta) html += `<div class="cta-box"><p>${s.cta}</p></div>`;
  if(s.disc) html += `<div class="disc">${s.disc}</div>`;
  html += `<div class="brand">Insider's Career Club</div>`;
  html += `<div class="foot">${i+1} / ${S.length}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
