<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flying Lead Change, a masterclass with Kelly Wendorf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ee;      /* harvested dominant paper cream */
    --panel:#efe8dc;   /* lightened sand (#cebda8 family) */
    --ink:#483623;     /* harvested dominant saddle brown */
    --rule:#d8ccba;    /* sand rule */
    --accent:#253321;  /* harvested forest green */
    --deep:#68453a;    /* harvested saddle brown */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink)}
  body{font-family:"Inter",system-ui,sans-serif;line-height:1.5}
  .slide{
    min-height:100vh;width:100%;background:var(--bg);
    display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;border-bottom:1px solid var(--rule);position:relative;
  }
  .k{font-family:"Inter";font-weight:600;letter-spacing:.22em;text-transform:uppercase;
     font-size:.72rem;color:var(--deep);margin-bottom:1.4rem}
  h1{font-family:"Marcellus",serif;font-weight:400;font-size:clamp(2.4rem,6.4vw,5rem);
     line-height:1.04;letter-spacing:.01em}
  h2{font-family:"Marcellus",serif;font-weight:400;font-size:clamp(1.9rem,4.4vw,3.3rem);
     line-height:1.1;margin-bottom:1.1rem}
  p{font-size:clamp(1.05rem,1.7vw,1.4rem);max-width:46ch;color:var(--ink)}
  p + p{margin-top:1rem}
  .lede{font-size:clamp(1.3rem,2.3vw,1.8rem);max-width:40ch}
  .accent{color:var(--accent)}
  .horizon{height:1px;width:42%;background:var(--accent);margin:2.2rem 0;opacity:.8}
  ul{list-style:none;margin-top:1.6rem;max-width:40ch}
  li{position:relative;padding-left:1.7rem;margin:.85rem 0;font-size:clamp(1.02rem,1.6vw,1.3rem)}
  li::before{content:"";position:absolute;left:0;top:.62em;width:.7rem;height:1px;background:var(--accent)}
  .dim{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem;margin-top:1.8rem;max-width:52ch}
  .dim span{border:1px solid var(--rule);background:var(--panel);border-radius:10px;
     padding:.9rem .8rem;text-align:center;font-family:"Marcellus";font-size:1.05rem}
  .dim span.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .cta{background:var(--ink);color:var(--bg)}
  .cta .k{color:var(--rule)}
  .cta h1,.cta h2{color:var(--bg)}
  .cta p{color:var(--rule)}
  .step{font-family:"Marcellus";font-size:clamp(1.3rem,2.2vw,1.9rem);margin-top:1.4rem;color:var(--bg)}
  .disc{margin-top:2.4rem;font-size:.82rem;color:#cebda8;max-width:60ch;line-height:1.5}
  .num{position:absolute;right:9vw;bottom:5vh;font-family:"Marcellus";color:var(--deep);opacity:.5}
  .ghost{text-decoration:line-through;text-decoration-color:var(--deep);opacity:.55}
  .big{font-family:"Marcellus";font-size:clamp(2rem,5vw,3.8rem);line-height:1.08}
</style>
</head>
<body>
<main id="app"></main>
<script>
const S = [
  {t:"title", cls:"",
    k:"A live masterclass with Kelly Wendorf · EQUUS",
    h:`Flying Lead Change`,
    p:`How the best leaders change direction at full speed, without forcing it and without losing the people following them.` },

  {t:"who", k:"Who this is for",
    h:`You lead well. And something still feels like effort.`,
    p:`Senior leaders, founders, and executives who have optimized the strategy, the team, and the calendar, and can feel there is one more layer the spreadsheet never shows.`,
    list:["You carry the room, and it costs you.","You push for alignment and get compliance.","Change lands, but people brace for it."] },

  {t:"trap", k:"The trap",
    h:`We were taught to lead by adding force.`,
    p:`More drive. More conviction. More pressure applied to the same direction. It works until the turn comes, and then the harder you push, the more the stride breaks.` },

  {t:"reframe", k:"A harder truth",
    h:`People do not follow your plan. They follow your state.`,
    p:`Long before anyone reads your strategy, they read your nervous system. Calm or braced, congruent or performing. You are always broadcasting, and they are always receiving.` },

  {t:"cost", k:"The cost", h:`Force is expensive.`,
    p:`Leading by pressure buys you compliance and charges you trust, energy, and the quiet attrition of people who stop bringing you the truth. It is the most expensive way to get a turn.` },

  {t:"section", cls:"", k:"Part one", h:`The problem is the pivot, not the person.`,
    p:`Every leader can hold a straight line. What separates the rare ones is how they change direction when the ground shifts, under pressure, in front of everyone.` },

  {t:"idea", k:"From the herd",
    h:`What a horse does at the canter.`,
    p:`A flying lead change is a horse changing its leading leg mid-canter, switching direction without breaking stride. It is not done by force. It is done from balance, timing, and a clear intention the body already believes.` },

  {t:"idea", k:"The move, translated",
    h:`Great leaders don't push harder. They <span class="accent">change lead.</span>`,
    p:`The pivot is clean because the inner state is settled first. The direction changes, the momentum does not, and the people stay with you because nothing in you is bracing.` },

  {t:"statement", k:"The whole idea in one line",
    h:`<span class="big">You do not force the turn.<br>You settle, then the turn is easy to follow.</span>` },

  {t:"section", cls:"", k:"Part two", h:`Flying Lead Change, the method.`,
    p:`Three moments turn a white-knuckle pivot into a clean lead change. This is the spine of the work, and of The Wisdom of Thriving.` },

  {t:"list", k:"The three moments",
    h:`How a clean change actually happens.`,
    list:[
      "Gather. Settle your own state before you ask anyone to move. The horse feels the gather before the turn.",
      "Signal. Make the new direction unmistakable and congruent, so your words and your body say the same thing.",
      "Release. Stop pushing the instant the turn is taken. Trust carries the stride."] },

  {t:"idea", k:"The EQUUS Experience",
    h:`Why we learn this with horses.`,
    p:`A 1,200-pound animal responds only to your actual internal state, never your title or your talking points. It is honest feedback that cannot be charmed, and it shows a leader the exact gap between the authority they perform and the presence people truly read.` },

  {t:"idea", k:"Congruence",
    h:`The authority people follow lands before you speak.`,
    p:`Congruence is simply your inner state and your outer action telling the same story. It is quiet, it is felt, and it is the single thing that makes a change of direction feel safe to follow.` },

  {t:"dims", k:"The seven dimensions of thriving", h:`The ground a clean change stands on.`,
    p:`Thriving leaders are not pushing on empty. Seven dimensions hold the capacity a lead change draws from. Notice which one is running low.`,
    on:"Presence",
    items:["Safety","Connection","Peace","Freedom","Joy","Care","Presence"] },

  {t:"section", cls:"", k:"Part three", h:`Steadier, when the turn comes.`,
    p:`Not softer leadership. Steadier leadership. The same decisions, made from balance instead of brace, and followed instead of merely obeyed.` },

  {t:"list", k:"What changes",
    h:`The felt difference.`,
    list:[
      "You call a hard turn and the team leans in instead of flinching.",
      "You stop managing your image and start trusting your presence.",
      "Hard conversations get shorter, because nothing in you is fighting the moment.",
      "Change stops being a crisis and becomes a cadence."] },

  {t:"take", k:"Take one thing now",
    h:`Gather before you ask.`,
    p:`Before the next hard turn you call, take ten seconds to settle your own state first. Notice the difference in how the room receives it. That ten seconds is the entire method in miniature.` },

  {t:"why", k:"Why me",
    h:`Thirty years, and a herd.`,
    p:`I am Kelly Wendorf, founder of EQUUS and a Master Certified Coach. I have spent three decades coaching leaders, from Amazon and Microsoft to founders and boards, alongside horses who tell the truth. I wrote Flying Lead Change to put 56 million years of herd wisdom to work for the way we lead and live.` },

  {t:"cta", cls:"cta", k:"Where to begin",
    h:`Learn the change at The Wisdom of Thriving.`,
    p:`If today named something you have been feeling, the full work lives in my live programs and coaching.`,
    step:"Begin with The Wisdom of Thriving, or a complimentary conversation at equusinspired.com.",
    disc:`Educational content only. Nothing here is advice for your specific situation, and no outcome, income, or result is promised or guaranteed. Results vary by person and circumstance.` }
];

const app = document.getElementById("app");
S.forEach((s, i) => {
  const sec = document.createElement("section");
  sec.className = "slide " + (s.cls || "");
  let html = "";
  if (s.k) html += `<div class="k">${s.k}</div>`;
  if (s.t === "title") html += `<h1>${s.h}</h1>`;
  else if (s.h) html += `<h2>${s.h}</h2>`;
  if (s.lede) html += `<p class="lede">${s.lede}</p>`;
  if (s.p) html += `<p>${s.p}</p>`;
  if (s.list) { html += "<ul>"; s.list.forEach(x => html += `<li>${x}</li>`); html += "</ul>"; }
  if (s.items) {
    html += `<div class="dim">`;
    s.items.forEach(x => html += `<span class="${x === s.on ? "on" : ""}">${x}</span>`);
    html += `</div>`;
  }
  if (s.step) html += `<div class="step">${s.step}</div>`;
  if (s.disc) html += `<div class="disc">${s.disc}</div>`;
  html += `<div class="num">${String(i + 1).padStart(2, "0")} / ${String(S.length).padStart(2, "0")}</div>`;
  sec.innerHTML = html;
  app.appendChild(sec);
});
</script>
</body>
</html>
