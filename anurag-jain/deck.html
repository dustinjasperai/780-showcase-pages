<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From No Idea to a Launched, AI-Run Business in 30 Days — Anurag Jain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f1f8;
    --panel:#ffffff;
    --rule:#cfdbe6;
    --ink:#1a1a1a;
    --muted:#55606b;
    --accent:#1577b5;
    --font:"DM Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 46px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(26,26,26,.04)}
  .slide.title{background:var(--ink);color:#f6f8fb;border-color:var(--ink)}
  .slide.title .kicker{color:#9fc7e4}
  .slide.cta{border-color:var(--accent);border-width:2px}
  .kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  .label{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:40px;
    padding:5px 14px;margin-bottom:22px}
  h1{font-size:46px;line-height:1.05;font-weight:700;letter-spacing:-.02em;margin-bottom:20px}
  h2{font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.01em;margin-bottom:18px}
  .sub{font-size:20px;line-height:1.45;color:var(--muted);max-width:62ch}
  .title .sub{color:#c9d8e6}
  p.body{font-size:18px;line-height:1.55;color:var(--ink);max-width:64ch;margin-top:6px}
  ul{list-style:none;margin-top:10px;max-width:66ch}
  ul li{font-size:18px;line-height:1.5;padding:12px 0 12px 34px;border-bottom:1px solid var(--rule);position:relative}
  ul li:last-child{border-bottom:0}
  ul li:before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;
    border-radius:3px;background:var(--accent)}
  .stages{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:10px}
  .stage{border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
  .stage .n{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em}
  .stage .t{font-size:17px;font-weight:500;margin-top:4px}
  .disc{font-size:14px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:68ch}
  .foot{max-width:960px;margin:0 auto;padding:0 22px 60px;color:var(--muted);font-size:13px}
  @media(max-width:640px){.slide{padding:34px 24px;min-height:auto}h1{font-size:34px}h2{font-size:26px}.stages{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">AI for Business Masterclass · Anurag Jain · Digicrusader</div>
<script>
const S=[
 {t:'title',
  kicker:'AI for Business Masterclass with Anurag Jain',
  h:"From No Idea to a Launched, AI-Run Business in 30 Days",
  sub:"The 10x AI Domination Framework for founders with zero tech skills. How to use AI, not why to use it."},

 {t:'who',
  kicker:'Who this is for',
  h:"You have the drive. You do not have a tech team.",
  body:"This is for entrepreneurs, aspiring founders and small business owners who know AI is the moment, but keep hitting the same wall: a hundred tools, a thousand opinions, and no clear path from where you are to a business that actually runs.",
  list:["You have an idea and no idea how to build it",
        "Or no idea yet, just the will to start",
        "You are not a developer and do not want to become one",
        "You are tired of courses that explain AI but never hand you a business"]},

 {t:'reframe',
  kicker:'The uncomfortable truth',
  h:"The problem was never the tools. It is the sequence.",
  body:"Most people collect AI tools the way they collect browser tabs. Every tool is a tactic with no order behind it. A launched business is not a pile of tools. It is the right moves in the right order, built once, running on their own. That order is the whole game."},

 {t:'part',label:'Part One',
  h:"Why most founders stall at the starting line",
  body:"Not because AI is hard. Because they try to answer the wrong question first."},

 {t:'plain',
  kicker:'The wrong question',
  h:"‘Why AI?’ keeps you reading. ‘How AI?’ gets you building.",
  body:"The internet is drowning in Why AI. Webinars, threads, hot takes. None of it ships a product. We throw the whole Why conversation out on day one and spend 30 days on How: what to build, in what order, with which prompt, pointed at your real business.",
  list:["Why AI keeps you a spectator",
        "How AI makes you an operator",
        "Every session ends with something built, not something noted"]},

 {t:'plain',
  kicker:'The trap',
  h:"Tool overwhelm is a mindset problem wearing a tech costume.",
  body:"The fear underneath tool overwhelm is simple: what if I pick wrong, what if I am too late, what if I am not technical enough. Left alone, that fear makes you buy another course instead of launching. We handle the mindset first, on purpose, so the tactics actually land."},

 {t:'part',label:'Part Two',
  h:"The 10x AI Domination Framework",
  body:"One ordered system that takes you across every function of a business, with AI doing the heavy lifting and you making the calls."},

 {t:'plain',
  kicker:'Mindset first',
  h:"Clear the fear before you touch a tool.",
  body:"Using a personalized SWOT and SMART goals plus simple NLP reframing, you trade fear of AI for a growth-oriented, resilient operator mindset. This is not a pep talk. It is the reason the next 30 days stick when a hundred saved tutorials did not."},

 {t:'grid',
  kicker:'Eight functions, one AI-run business',
  h:"What you build across the framework",
  stages:[["01","Sales"],["02","Operations"],["03","Analytics"],["04","Customer service"],
          ["05","Website creation"],["06","E-commerce store"],["07","App development"],["08","AI marketing campaigns"]]},

 {t:'plain',
  kicker:'No code, plug and play',
  h:"Ten ready-to-use AI launch templates do the setup.",
  body:"You do not start from a blank screen. Plug-and-play, no-code templates carry you from market research to marketing to supply chain to finance to project management, so day one is building on a foundation, not staring at one.",
  list:["Market research and validation",
        "Marketing and content engine",
        "Operations, supply chain and finance",
        "Project management and delivery"]},

 {t:'plain',
  kicker:'Three operating pillars',
  h:"How the framework thinks, so your business keeps thinking after",
  list:["Customer-centricity, using AI to predict what your buyer does next",
        "Technological integration, AI woven across the whole stack",
        "Diverse approaches, cross-industry plays most founders never see"]},

 {t:'part',label:'Part Three',
  h:"What 30 days actually looks like",
  body:"A guided build, one week at a time, ending with a business that runs."},

 {t:'stageline',
  kicker:'The 30-day path',
  h:"From idea to launched, in four moves",
  stages:[["Week 1","Mindset, idea and validation"],
          ["Week 2","Build the core: site, store, offer"],
          ["Week 3","Automate: ops, service, analytics"],
          ["Week 4","Launch: AI marketing and first customers"]]},

 {t:'plain',
  kicker:'What you walk away with',
  h:"Not notes. A running business.",
  list:["A validated offer and a live presence",
        "AI handling the repetitive work across eight functions",
        "A marketing engine bringing people in",
        "The confidence to keep building without a tech team"]},

 {t:'why',
  kicker:'Why learn this from me',
  h:"20+ years building businesses, now handed to you as a system",
  body:"I am Anurag Jain, founder of Digicrusader and author of Powerhouse, an AI playbook. Twenty-plus years in business development and consulting across FMCG, healthcare, fashion, e-commerce, hospitality and technology, and leadership roles at global companies. I have made the expensive mistakes already. The 10x AI Domination Framework is that operator experience turned into a 30-day path you can follow."},

 {t:'cta',
  kicker:'Your next step',
  h:"Join the AI for Business Masterclass",
  body:"Reserve your seat in the next cohort and go from idea, or no idea, to a launched, AI-run business in 30 days. Bring the drive. The system and the templates are waiting.",
  disc:"Educational content only. No income, revenue or business result is guaranteed; outcomes vary with effort, market and starting point. Nothing here is financial, legal or professional advice."}
];

function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  const d=document.getElementById('deck');
  d.innerHTML=S.map(function(s){
    let cls='slide '+(s.t==='title'?'title':(s.t==='cta'?'cta':''));
    let h='';
    if(s.label) h+='<span class="label">'+esc(s.label)+'</span>';
    else if(s.kicker) h+='<div class="kicker">'+esc(s.kicker)+'</div>';
    h+= (s.t==='title'?'<h1>':'<h2>')+esc(s.h)+(s.t==='title'?'</h1>':'</h2>');
    if(s.sub) h+='<p class="sub">'+esc(s.sub)+'</p>';
    if(s.body) h+='<p class="body">'+esc(s.body)+'</p>';
    if(s.list) h+='<ul>'+s.list.map(function(li){return '<li>'+esc(li)+'</li>';}).join('')+'</ul>';
    if(s.stages && s.t==='grid') h+='<div class="stages">'+s.stages.map(function(x){return '<div class="stage"><div class="n">'+esc(x[0])+'</div><div class="t">'+esc(x[1])+'</div></div>';}).join('')+'</div>';
    if(s.stages && s.t==='stageline') h+='<div class="stages">'+s.stages.map(function(x){return '<div class="stage"><div class="n">'+esc(x[0])+'</div><div class="t">'+esc(x[1])+'</div></div>';}).join('')+'</div>';
    if(s.disc) h+='<p class="disc">'+esc(s.disc)+'</p>';
    return '<section class="'+cls+'">'+h+'</section>';
  }).join('');
}
render();
</script>
</body>
</html>
