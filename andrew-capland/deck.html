<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Growth Team That Doesn't Depend on You - Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf1f6; --panel:#fdfdfb; --rule:#d3dfe8;
    --ink:#1a2e3b; --body:#272727; --accent:#00507b; --muted:#4c5a70;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--body);font-family:"Figtree",system-ui,sans-serif;line-height:1.5}
  .deckwrap{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(26,46,59,.04)}
  .k{font-family:"Sora",sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Sora",sans-serif;font-weight:700;color:var(--ink);font-size:46px;line-height:1.1;letter-spacing:-.01em}
  h2{font-family:"Sora",sans-serif;font-weight:600;color:var(--ink);font-size:34px;line-height:1.15;letter-spacing:-.01em}
  .sub{font-size:19px;color:var(--muted);margin-top:22px;max-width:40em}
  .body{font-size:21px;color:var(--body);margin-top:20px;max-width:40em}
  ul{margin-top:24px;list-style:none;max-width:42em}
  li{position:relative;padding-left:30px;margin:0 0 16px;font-size:19px;color:var(--body)}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  li b{font-family:"Sora",sans-serif;font-weight:600;color:var(--ink)}
  .title-slide{border-top:6px solid var(--accent)}
  .cta-slide{background:var(--ink);border-color:var(--ink)}
  .cta-slide .k{color:#7ececa}
  .cta-slide h2,.cta-slide h1{color:#ffffff}
  .cta-slide .body{color:#e6e6e6}
  .disc{font-size:13px;color:#9fb0bd;margin-top:30px;max-width:44em}
  .foot{font-family:"Sora",sans-serif;font-size:13px;color:var(--muted);margin-top:28px;letter-spacing:.02em}
</style>
</head>
<body>
<div class="deckwrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title-slide', k:'A Live Masterclass', h:"The Growth Team That Doesn't Depend on You",
    sub:"How Heads, VPs and Directors of Growth build a growth function that runs on systems, not on them. With Andrew Capland, Delivering Value."},

  {t:'list', k:'Who this is for', h:'You lead growth, and it all runs through you',
    list:["You are a Director, VP or Head of Growth at a scaling company","Your team got smaller and your scope got bigger","Good work stalls when you step away for a week","You want to lead the function, not just do the work"]},

  {t:'body', k:'The trap', h:'You became the bottleneck by being good',
    body:"Every priority, every review, every decision waits for you. The team is busy, but nothing final happens without your attention. On paper you lead a team. In practice you are still the person doing the growth."},

  {t:'body', k:'The hard truth', h:"More hours will not fix this",
    body:"You cannot out-work a design problem. A function that depends on one person is capped at that person's calendar. The fix is not another late night. It is a system the team can run without you in the room."},

  {t:'part', k:'Part One', h:'Why everything routes through you'},

  {t:'body', k:'The root', h:'You were promoted for being the best operator',
    body:"The skills that earned you the title, speed, taste, getting it done yourself, are the exact skills that keep the team dependent on you. Nobody taught you the next job, which is building the operating system, not running the plays."},

  {t:'list', k:'The symptoms', h:'What dependence looks like day to day',
    list:["Decisions queue in your DMs","The roadmap lives in your head, not in a doc","Hires wait to be told what to do","You are the single point of failure for growth"]},

  {t:'part', k:'Part Two', h:'The Influence and Impact Map'},

  {t:'list', k:'The framework', h:'Three pillars of a growth leader',
    list:["<b>Strategy.</b> A north star metric and a plan the team believes in","<b>Execution.</b> Operating systems, clear KPIs, real delegation","<b>Influence.</b> Visibility and trust so senior stakeholders say yes"]},

  {t:'body', k:'Pillar 1 of 3', h:'Strategy',
    body:"Pick the one metric that matters and the handful of bets behind it. When the team knows what wins, they stop waiting for you to prioritise. Strategy you believe in is strategy you can hand off."},

  {t:'body', k:'Pillar 2 of 3', h:'Execution',
    body:"Turn the plan into systems. A documented way the team plans, ships and reviews, with KPIs that make progress visible without you checking. Delegation is not letting go, it is building the rails that make letting go safe."},

  {t:'body', k:'Pillar 3 of 3', h:'Influence',
    body:"The best growth plan dies without buy-in. Influence is the work of being seen, being trusted, and getting the right people to back the bet before the meeting, not during it. This is the pillar most growth leaders skip, and it is the one that gets you funded."},

  {t:'part', k:'The arc', h:'From operator to leader in four phases'},

  {t:'list', k:'The 4-phase arc', h:'How the function stops depending on you',
    list:["<b>Phase 1.</b> Build a growth strategy you believe in","<b>Phase 2.</b> Build a function that does not depend on you","<b>Phase 3.</b> Become a more effective growth leader","<b>Phase 4.</b> Grow as fast as your company does"]},

  {t:'body', k:'The centrepiece', h:'Your Growth Operating System',
    body:"Phase 2 is the whole game. You write the operations manual for the team: how work gets chosen, run and reviewed. Once the system is documented, the function runs on the system, not on your memory. That is the week you finally take off."},

  {t:'part', k:'Part Three', h:'When the system carries the team'},

  {t:'list', k:'After', h:'The signs you have built it right',
    list:["The team ships good work while you are out","New hires ramp on the doc, not on your time","You spend your hours on strategy and influence","Growth keeps pace with the company, not with your calendar"]},

  {t:'body', k:'Why me', h:'Andrew Capland',
    body:"Former Head of Growth at Wistia and Postscript. Over five years coaching growth leaders, 100+ of them across more than 1,000 calls. I have sat in your chair, and this is the system I wish I had been handed."},

  {t:'list', k:'Recap', h:'What we covered',
    list:["Why being the best operator made you the bottleneck","The Influence and Impact Map: Strategy, Execution, Influence","The 4-phase arc to a function that runs without you","Your Growth Operating System as the centrepiece"]},

  {t:'cta', cls:'cta-slide', k:'Your next step', h:'Build the system with me',
    body:"If you want help building the operating system for your growth function, apply to work with me 1:1 or join the next Growth Council cohort at deliveringvalue.co.",
    disc:"Educational content only. No income, role, or result is guaranteed. Results vary based on your situation, your company, and the work you put in."}
];

const wrap = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let h = '';
  if (s.k) h += '<div class="k">' + s.k + '</div>';
  if (s.t === 'title') h += '<h1>' + s.h + '</h1>';
  else h += '<h2>' + s.h + '</h2>';
  if (s.sub) h += '<div class="sub">' + s.sub + '</div>';
  if (s.body) h += '<div class="body">' + s.body + '</div>';
  if (s.list){ h += '<ul>'; for (const it of s.list) h += '<li>' + it + '</li>'; h += '</ul>'; }
  if (s.disc) h += '<div class="disc">' + s.disc + '</div>';
  if (s.t === 'cta') h += '<div class="foot">deliveringvalue.co</div>';
  el.innerHTML = h;
  wrap.appendChild(el);
}
</script>
</body>
</html>
