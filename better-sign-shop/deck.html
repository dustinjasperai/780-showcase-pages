<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 10 Numbers That Decide Whether Your Sign Shop Makes Money</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7fa;        /* near-white ground (brand site_scheme: light) */
    --panel:#ffffff;
    --tint:#f6eef4;
    --ink:#23263a;       /* dark-slate body color from brand.json */
    --muted:#9aa0b2;
    --rule:#e7dfe8;
    --accent:#f21bb9;    /* their signature magenta CTA color (brand.json, 8 uses) */
    --deep:#490838;      /* their plum */
    --head:"DM Serif Display",Georgia,serif;
    --body:"DM Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(35,38,58,.03)}
  .slide.hero{background:linear-gradient(170deg,#ffffff 0%,var(--tint) 100%)}
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:400;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:400;font-size:34px;line-height:1.12}
  .lead{font-size:20px;line-height:1.5;color:#45495e;margin-top:18px;max-width:40ch}
  .sub{font-size:16px;color:var(--muted);margin-top:22px;font-weight:500}
  .big{font-family:var(--head);font-size:96px;line-height:1;color:var(--accent)}
  .statement h2{font-size:40px;max-width:20ch}
  .accent{color:var(--accent)}
  .deepc{color:var(--deep)}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px}
  li{position:relative;padding-left:34px;font-size:18px;line-height:1.45;color:#3a3e52}
  li::before{content:"";position:absolute;left:0;top:9px;width:14px;height:14px;border-radius:4px;
    background:var(--accent)}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:28px}
  .tile{background:var(--tint);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .tile .n{font-family:var(--head);font-size:30px;color:var(--deep)}
  .tile .l{font-size:15px;color:#45495e;margin-top:6px;font-weight:500}
  .cmd{display:flex;align-items:baseline;gap:22px}
  .cmd .num{font-family:var(--head);font-size:84px;color:var(--accent);line-height:.9;min-width:110px}
  .cmd .body h2{font-size:30px}
  .cmd .body p{font-size:17px;color:#45495e;margin-top:10px;max-width:46ch;line-height:1.45}
  .foot{margin-top:30px;font-size:14px;color:var(--muted)}
  .disc{font-size:15px;color:var(--muted);line-height:1.5;max-width:60ch}
  .btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-weight:700;
    padding:15px 28px;border-radius:999px;font-size:16px}
  .num-pill{display:inline-block;font-weight:700;color:var(--deep);background:var(--tint);
    border-radius:999px;padding:4px 14px;font-size:14px;margin-bottom:16px}
  @media(max-width:620px){.slide{padding:34px 26px}h1{font-size:34px}.tiles{grid-template-columns:1fr}.cmd{flex-direction:column;gap:8px}.cmd .num{font-size:60px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title'},
 {t:'statement', kick:'Who this is for', h:'You make great signs. You just never know if the month was actually profitable.'},
 {t:'statement', kick:'The trap', h:'The orders keep coming in. So why is the bank account always tight?'},
 {t:'hook', kick:'The reframe', big:'', h:'You do not have a sales problem. You have a <span class="accent">numbers</span> problem.'},
 {t:'section', pill:'Part One', h:'Busy but broke'},
 {t:'lead', kick:'Run by feel', h:'Most sign shops are run on gut and gut alone.', p:'Pricing is a guess. Labor creeps. Materials get marked up by habit, not math. The shop stays busy, the owner stays tired, and the profit is whatever is left over by accident.'},
 {t:'lead', kick:'The hidden truth', h:'Every dollar in your shop has a target.', p:'There is a right number for your gross profit, your labor, your materials, your overhead and your advertising. Most owners have never once seen theirs. You cannot fix a number you have never measured.'},
 {t:'section', pill:'Part Two', h:'The 10 Sign Shop Commandments'},
 {t:'lead', kick:'The system', h:'Ten target ratios. In order.', p:'Each commandment is a percentage your shop should hit. Together they tell you, in minutes, whether your shop is built to make money or built to keep you busy. We work them in order: stabilize, then optimize, then scale.'},
 {t:'cmd', num:'1', h:'Gross profit margin', p:'The master number. Get this wrong and nothing downstream can save you. We set the target and find where yours actually sits today.'},
 {t:'cmd', num:'2', h:'Direct labor percentage', p:'What your production team should cost as a share of revenue. The number that quietly decides whether growth makes you richer or just busier.'},
 {t:'cmd', num:'3', h:'Material cost percentage', p:'Where margin leaks fastest in a sign shop. A target you can price against instead of guessing job by job.'},
 {t:'cmd', num:'4', h:'Operating expense percentage', p:'The overhead ceiling. What rent, software, vehicles and the rest should total before they start eating the shop.'},
 {t:'cmd', num:'5', h:'Advertising budget percentage', p:'How much to reinvest in getting the next customer, on purpose, as a planned share of revenue instead of a panic buy.'},
 {t:'lead', kick:'Commandments 6 through 10', h:'From numbers to habits.', p:'The back half turns the targets into a running system: cash reserves, owner pay, pricing discipline, review cadence and the one metric you check every single week. The full set is what the live session walks through.'},
 {t:'section', pill:'Part Three', h:'Your shop, run by the numbers'},
 {t:'tiles', kick:'The 4-step engine', h:'The numbers ride on a simple loop.',
   tiles:[{n:'1',l:'Marketing'},{n:'2',l:'Execution of leads'},{n:'3',l:'Sales'},{n:'4',l:'Execution of jobs'}],
   foot:'Each of the four steps has a target ratio sitting on top of it. That is how the shop starts running without depending on you for every decision.'},
 {t:'lead', kick:'Why Peter', h:'Built it, not just taught it.', p:'Peter Kourounis grew his own shop, Sign Me Up Signs and Advertising, into a multi-location operation before selling the rights to FastSigns International. He now coaches sign and print shop owners full time on the exact numbers in this session.'},
 {t:'cta', h:'Want these numbers run for your shop?', p:'Book a free consult with Peter and walk through where your shop sits against the Commandments, one number at a time.', btn:'Book your free shop consult', disc:'This masterclass is educational. No specific result is guaranteed. Results vary from shop to shop and depend on your own market, work and execution.'}
];

function esc(x){return x||''}
const D=document.getElementById('deck');
S.forEach(s=>{
 const d=document.createElement('section');d.className='slide';
 if(s.t==='title'){d.className+=' hero';d.innerHTML=
   '<div class="kick">Better Sign Shop, a live masterclass</div>'+
   '<h1>The 10 Numbers That Decide Whether Your Sign Shop Makes Money</h1>'+
   '<div class="sub">With Peter Kourounis, the Sign Shop Yoda</div>';}
 else if(s.t==='statement'){d.className+=' statement';d.innerHTML=
   '<div class="kick">'+esc(s.kick)+'</div><h2>'+esc(s.h)+'</h2>';}
 else if(s.t==='hook'){d.className+=' hero statement';d.innerHTML=
   '<div class="kick">'+esc(s.kick)+'</div><h1>'+esc(s.h)+'</h1>';}
 else if(s.t==='section'){d.className+=' hero';d.innerHTML=
   '<div class="num-pill">'+esc(s.pill)+'</div><h1>'+esc(s.h)+'</h1>';}
 else if(s.t==='lead'){d.innerHTML=
   '<div class="kick">'+esc(s.kick)+'</div><h2>'+esc(s.h)+'</h2><p class="lead">'+esc(s.p)+'</p>';}
 else if(s.t==='cmd'){d.innerHTML=
   '<div class="kick">Commandment</div><div class="cmd"><div class="num">'+esc(s.num)+'</div>'+
   '<div class="body"><h2>'+esc(s.h)+'</h2><p>'+esc(s.p)+'</p></div></div>';}
 else if(s.t==='tiles'){let t=s.tiles.map(x=>'<div class="tile"><div class="n">'+x.n+'</div><div class="l">'+x.l+'</div></div>').join('');
   d.innerHTML='<div class="kick">'+esc(s.kick)+'</div><h2>'+esc(s.h)+'</h2><div class="tiles">'+t+'</div><p class="foot">'+esc(s.foot)+'</p>';}
 else if(s.t==='cta'){d.className+=' hero';d.innerHTML=
   '<div class="kick">Your next step</div><h1>'+esc(s.h)+'</h1><p class="lead">'+esc(s.p)+'</p><span class="btn">'+esc(s.btn)+'</span><p class="disc" style="margin-top:28px">'+esc(s.disc)+'</p>';}
 D.appendChild(d);
});
</script>
</body>
</html>
