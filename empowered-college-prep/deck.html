<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Smart Students Freeze on the SAT - Empowered College Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8f9;        /* ground: echoes brand light blue-grey #d8dfe4 */
    --panel:#ffffff;
    --rule:#d8dfe4;      /* brand light blue-grey */
    --ink:#132a30;       /* deep teal-ink */
    --muted:#4c5f64;
    --accent:#005e73;    /* brand dominant teal (brand.json) */
    --serif:'PT Serif', Georgia, serif;
    --sans:'Quattrocento Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{width:100vw;height:100vh;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7vmin 10vmin;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .ramp{position:absolute;left:10vmin;top:6vmin;width:64px;height:4px;background:var(--accent);border-radius:2px}
  .kicker{font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:2.1vmin;color:var(--accent);margin-bottom:2.4vmin}
  .eyebrow{font-size:2.2vmin;color:var(--muted);letter-spacing:.04em;margin-bottom:3vmin}
  h1{font-family:var(--serif);font-weight:700;font-size:8.2vmin;line-height:1.04;letter-spacing:-.01em;max-width:20ch}
  h2{font-family:var(--serif);font-weight:700;font-size:6vmin;line-height:1.08;max-width:22ch}
  .big{font-family:var(--serif);font-weight:700;font-size:6.4vmin;line-height:1.12;max-width:20ch}
  .sub{font-size:3vmin;color:var(--muted);margin-top:3vmin;max-width:40ch;line-height:1.45}
  .body{font-size:3.1vmin;color:var(--ink);margin-top:3.4vmin;max-width:38ch;line-height:1.5}
  ul{list-style:none;margin-top:4vmin;max-width:40ch}
  li{font-size:3vmin;line-height:1.35;padding:1.5vmin 0 1.5vmin 4.4vmin;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:2.6vmin;width:1.9vmin;height:1.9vmin;border-radius:50%;
    border:2px solid var(--accent)}
  .quote{font-family:var(--serif);font-style:italic;font-weight:400;font-size:6vmin;line-height:1.25;max-width:24ch}
  .quote:before{content:"\201C";color:var(--accent)}
  .quote:after{content:"\201D";color:var(--accent)}
  .cta-card{background:var(--panel);border:1px solid var(--rule);border-left:6px solid var(--accent);
    padding:6vmin;max-width:52ch;border-radius:8px}
  .cta-link{display:inline-block;margin-top:3.4vmin;font-weight:700;color:var(--accent);font-size:3.2vmin;letter-spacing:.02em}
  .disc{margin-top:4vmin;font-size:1.9vmin;color:var(--muted);max-width:52ch;line-height:1.5}
  .brandfoot{position:absolute;right:10vmin;bottom:6vmin;font-size:2vmin;color:var(--muted);letter-spacing:.05em}
  .num{position:absolute;left:10vmin;bottom:6vmin;font-size:2vmin;color:var(--muted)}
  .nav{position:absolute;bottom:0;left:0;right:0;height:6px;background:transparent}
  .bar{height:6px;background:var(--accent);width:0;transition:width .3s ease}
  .section h2{color:var(--accent)}
  @media(max-width:700px){h1{font-size:9vmin}h2{font-size:7vmin}.big{font-size:7vmin}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><div class="bar" id="bar"></div></div>
<script>
const S=[
 {t:'title', eyebrow:'A live masterclass with Empowered College Prep',
  h:'Why Smart Students Freeze on the SAT',
  sub:'And the brain-first fix that turns capable kids into confident test-takers.'},

 {t:'list', kicker:'In the next hour', h:'Here is the plan',
  items:['Why capable students underperform on test day',
         'The method that fixes it, step by step',
         'How to build prep around how your kid actually learns',
         'What the path from here looks like']},

 {t:'list', h:'If this is your family',
  items:['Your kid is bright, but the scores do not show it',
         'Test day brings panic, blanking, or careless mistakes',
         'More practice has only added stress',
         'You want a real plan, not another stack of worksheets']},

 {t:'reframe', h:'The uncomfortable truth',
  big:'More drilling does not fix a test-day brain. It usually makes it worse.'},

 {t:'section', kicker:'Part One', h:'The real problem is not the material'},

 {t:'point', h:'Capable students lose points to the wrong thing',
  body:'Timing, second-guessing, anxiety and trap answers cost more points than content gaps for most students who are already doing fine in class.'},

 {t:'point', h:'Pressure shrinks working memory',
  body:'When a student feels threatened, the brain narrows. A kid who knows the material can freeze on a question they would answer calmly at home. That is psychology, not ability.'},

 {t:'section', kicker:'Part Two', h:'The Empowered Method'},

 {t:'list', h:'A plan built around one student',
  items:['Diagnostic, not guesswork: find the real gaps',
         'A game plan built for your kid: timeline and score goals',
         'High-impact lessons: we learn in the session, together',
         'Targeted homework: everything has a purpose, zero busywork',
         'Ongoing adjustments: the plan changes as the scores climb']},

 {t:'point', h:'Active engagement, not silent drilling',
  body:'Each session is spent actually learning the material, not having a student answer questions alone while someone watches. Instruction adapts live to timing, strategy, content gaps and test-day decisions.'},

 {t:'point', h:'Built for every kind of learner',
  body:'Pacing, structure and strategy adjust for students with ADHD, anxiety, autism, dyslexia and dyscalculia, so they can succeed without overwhelm.'},

 {t:'point', h:'Confidence is a trainable skill',
  body:'We train the nerves alongside the content: how to stay calm, how to decide fast, how to walk in trusting the plan. Progress over perfection, every session.'},

 {t:'section', kicker:'Part Three', h:'What a calm test day looks like'},

 {t:'point', h:'From panic to plan',
  body:'A student who used to blank starts finishing sections with time to spare, because they trust the method and their own preparation. The score follows the calm.'},

 {t:'list', h:'And beyond the test',
  items:['Class selection that balances rigor and wellness',
         'A balanced college list built to strengths and budget',
         'Essays and applications that still sound like your kid',
         'Clarity and steady support through every phase']},

 {t:'cred', h:'Who is teaching this',
  body:'Bonnie Treece has spent 15+ years tutoring and advising students one-on-one. Psychology degree, graduated summa cum laude, with neurology research at Baylor College of Medicine and contributions to published, peer-reviewed studies. The approach: customization over cookie-cutter, and the belief that students thrive when someone believes in them sincerely.'},

 {t:'quote', big:'The college process should be empowering, not overwhelming.'},

 {t:'cta', h:'Your next step',
  body:'Book a complimentary consultation with Empowered College Prep. We will map your student’s starting point and the plan to get where they want to go.',
  link:'empoweredcollegeprep.com',
  disc:'This masterclass is for educational purposes only. Every student is different and no specific score or admissions outcome is guaranteed. Results vary.'}
];

const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='section'?' section':'');
  let html='<div class="ramp"></div>';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){html+='<h1>'+s.h+'</h1>';}
  else if(s.t==='reframe'){html+='<div class="kicker">'+(s.h)+'</div><div class="big">'+s.big+'</div>';}
  else if(s.t==='quote'){html+='<div class="quote">'+s.big+'</div>';}
  else if(s.t==='section'){html+='<h2>'+s.h+'</h2>';}
  else if(s.h){html+='<h2>'+s.h+'</h2>';}
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.body) html+='<div class="body">'+s.body+'</div>';
  if(s.items){html+='<ul>';s.items.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  if(s.t==='cta'){
    html='<div class="ramp"></div><h2>'+s.h+'</h2><div class="cta-card"><div class="body" style="margin-top:0">'+s.body+'</div><span class="cta-link">'+s.link+'</span></div><div class="disc">'+s.disc+'</div>';
  }
  html+='<div class="brandfoot">Empowered College Prep</div>';
  html+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;
  stage.appendChild(d);
});
let cur=0;const slides=document.querySelectorAll('.slide');const bar=document.getElementById('bar');
function show(n){slides[cur].classList.remove('on');cur=Math.max(0,Math.min(S.length-1,n));
  slides[cur].classList.add('on');bar.style.width=((cur+1)/S.length*100)+'%';}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')show(cur+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')show(cur-1);});
stage.addEventListener('click',()=>show(cur+1));
show(0);
</script>
</body>
</html>
