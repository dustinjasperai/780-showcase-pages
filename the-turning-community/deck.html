<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Thirties, Authored On Purpose — a live masterclass with Emma Wilson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f2ea;        /* warm ivory ground (brand-derived light scheme) */
    --panel:#efe8dc;     /* soft panel */
    --ink:#383b38;       /* charcoal (brand h1 color) */
    --muted:#6f726d;     /* muted charcoal */
    --accent:#828f85;    /* sage green — the brand's only real accent hex */
    --rule:#d8cfbf;      /* hairline on ivory */
    --display:'Marcellus', Georgia, serif;
    --body:'Mulish', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1080px;margin:0 auto}
  .slide{
    position:relative;background:var(--bg);min-height:62vw;max-height:720px;height:607px;
    margin:26px auto;padding:72px 84px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 var(--rule),0 24px 60px rgba(56,59,56,.08);overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:84px;top:64px;width:54px;height:2px;background:var(--accent)}
  .eyebrow{font-family:var(--body);font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--display);font-weight:400;font-size:58px;line-height:1.06;letter-spacing:.3px}
  h2{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.12;margin-bottom:22px}
  .lede{font-size:21px;line-height:1.55;color:var(--muted);max-width:40ch;margin-top:20px}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);max-width:52ch;margin-top:14px}
  ul{list-style:none;margin-top:18px}
  ul li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;max-width:54ch;border-bottom:1px solid var(--rule)}
  ul li:last-child{border-bottom:0}
  ul li::before{content:"";position:absolute;left:0;top:22px;width:14px;height:2px;background:var(--accent)}
  .step-n{font-family:var(--display);font-size:16px;color:var(--accent);letter-spacing:.1em}
  .big-quote{font-family:var(--display);font-size:46px;line-height:1.15;max-width:22ch}
  .sub{font-size:18px;color:var(--muted);margin-top:28px}
  .foot{position:absolute;left:84px;right:84px;bottom:46px;display:flex;justify-content:space-between;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .foot .brand{color:var(--ink)}
  .cta-box{margin-top:26px;padding:26px 30px;background:var(--panel);border-left:3px solid var(--accent);max-width:50ch}
  .cta-box .step{font-family:var(--display);font-size:24px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:30px;max-width:56ch;line-height:1.5}
  .title-slide h1{font-size:66px;max-width:18ch}
  .grid6{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;margin-top:20px}
  .grid6 div{font-size:18px;padding:10px 0;border-bottom:1px solid var(--rule)}
  .grid6 .step-n{display:block;margin-bottom:4px}
  @media(max-width:760px){.slide{padding:48px 36px;height:auto;min-height:520px}.slide::before{left:36px}.foot{left:36px;right:36px}h1{font-size:40px}.title-slide h1{font-size:44px}h2{font-size:30px}.big-quote{font-size:32px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass', h1:'Your Thirties, Authored On Purpose',
   sub:'How to stop feeling behind and design your next chapter. Live with Emma Wilson, Turning 30 Coach.'},

  {t:'content', eyebrow:'Who this is for',
   h2:'The woman who quietly feels behind',
   body:"You are smart, capable, and doing fine on paper. And still, somewhere around 30, a thought shows up: everyone else seems further along, and you are running out of time.",
   lede:'If that is you, you are exactly who this hour is for.'},

  {t:'content', eyebrow:'The trap',
   h2:'The timeline you never agreed to',
   list:['By 30 you should have the career, the partner, the home, the plan.',
         'Scrolling turns other people into a scoreboard you never signed up for.',
         'So you wait to feel ready, and ready never quite arrives.']},

  {t:'quote', eyebrow:'A reframe',
   quote:'You are not behind. Ageing is a privilege, and your thirties are the start of your next chapter, not the deadline for your last one.'},

  {t:'content', eyebrow:'Part one: the real problem',
   h2:'The problem was never your timeline',
   body:'The panic is not about where you are in life. It is about the story you are telling yourself about where you should be.',
   lede:'Change the story and the whole decade changes with it.'},

  {t:'content', eyebrow:'Part one',
   h2:'Emotional childhood keeps you stuck',
   body:'When life feels like something happening to you, you hand your thirties to comparison, other people, and circumstance.',
   list:['Blaming the timeline for how you feel.',
         'Waiting for confidence to arrive before you act.',
         'Letting other people set the pace of your life.']},

  {t:'content', eyebrow:'Part two: the method',
   h2:'The Next Chapter Method',
   body:'A simple, repeatable process to move from stuck to self-authored. Three moves, in order.',
   lede:'Reflect. Accept. Take action.'},

  {t:'step', n:'Move one', h2:'Reflect',
   body:'Get honest about what you actually want, underneath what you were told to want. Your values, not the timeline.'},

  {t:'step', n:'Move two', h2:'Accept',
   body:'Meet your life exactly where it is today, without the victim story. Acceptance is not giving up. It is the ground you build from.'},

  {t:'step', n:'Move three', h2:'Take action',
   body:'Make the next aligned decision, then the next. Small, consistent, on purpose. This is how a new chapter actually gets written.'},

  {t:'content', eyebrow:'The full map',
   h2:'The Turning Curriculum',
   body:'Once the method clicks, these are the six turns of the work we move through together.',
   grid:[['Turn out','See the bigger picture'],['Turn in','Do the deep inner work'],
         ['Turn it up','Reclaim your confidence'],['Turn it on','Activate your love life'],
         ['Turn it around','Reframe your story'],['Turn toward','Choose connection']]},

  {t:'step', n:'Turn out', h2:'See the bigger picture',
   body:'Zoom out from the panic. Your thirties are one chapter in a long, unfinished story you get to keep writing.'},

  {t:'step', n:'Turn in', h2:'Do the deep inner work',
   body:'Notice the thoughts and feelings driving your behaviour. The work starts on the inside, because the big change is always how it feels on the inside.'},

  {t:'step', n:'Turn it up', h2:'Reclaim your confidence',
   body:'Confidence is not something you find. It is something you build, by keeping small promises to yourself.'},

  {t:'step', n:'Turn it on', h2:'Activate your love life',
   body:'Date and connect from fullness, not fear of being left behind. Your relationships stop being a race and start being a choice.'},

  {t:'step', n:'Turn it around', h2:'Reframe your story',
   body:'The same facts, a new meaning. You are not the woman who is behind. You are the woman who woke up and chose on purpose.'},

  {t:'step', n:'Turn toward', h2:'Choose connection',
   body:'Build a life, and a community, where you are seen and supported. No one authors a next chapter entirely alone.'},

  {t:'content', eyebrow:'Part three: the turn, lived',
   h2:'A thirties you actually chose',
   list:['The comparison spiral loses its grip.',
         'Decisions get made from values, not fear.',
         'The decade starts to feel like yours again.']},

  {t:'content', eyebrow:'Why me',
   h2:'I have lived this one',
   body:'I had my own turning 30 crisis at 29: comparison, low confidence, no clear direction. I coached myself out of it, and for the last decade I have walked thousands of women through the same turn, inside The Turning Community.',
   lede:'This is not theory. It is the map I wish I had.'},

  {t:'cta', eyebrow:'Your next step',
   h2:'Ready to author your next chapter?',
   step:'Join Reclaim Your Thirties, or apply to work with me one to one.',
   sub:'Everything we walked through today is the first part of the work we do together inside my programs.',
   disclaimer:'This masterclass is for education and inspiration only. Every woman and every chapter is different; nothing here is a promise or guarantee of any specific result.'}
];

function foot(n){return '<div class="foot"><span class="brand">Turning 30 Coach</span><span>'+n+' / '+S.length+'</span></div>';}
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const n=i+1; let html='';
  const eb = s.eyebrow? '<div class="eyebrow">'+s.eyebrow+'</div>':'';
  if(s.t==='title'){
    html='<div class="slide title-slide">'+eb+'<h1>'+s.h1+'</h1><p class="lede">'+s.sub+'</p>'+foot(n)+'</div>';
  } else if(s.t==='quote'){
    html='<div class="slide">'+eb+'<p class="big-quote">'+s.quote+'</p>'+foot(n)+'</div>';
  } else if(s.t==='step'){
    html='<div class="slide">'+eb+'<div class="step-n">'+s.n+'</div><h2>'+s.h2+'</h2><p class="body">'+s.body+'</p>'+foot(n)+'</div>';
  } else if(s.t==='cta'){
    html='<div class="slide">'+eb+'<h2>'+s.h2+'</h2><div class="cta-box"><div class="step">'+s.step+'</div></div><p class="sub">'+s.sub+'</p><p class="disclaimer">'+s.disclaimer+'</p>'+foot(n)+'</div>';
  } else {
    let mid='';
    if(s.body) mid+='<p class="body">'+s.body+'</p>';
    if(s.list){ mid+='<ul>'; s.list.forEach(x=>mid+='<li>'+x+'</li>'); mid+='</ul>'; }
    if(s.grid){ mid+='<div class="grid6">'; s.grid.forEach(x=>mid+='<div><span class="step-n">'+x[0]+'</span>'+x[1]+'</div>'); mid+='</div>'; }
    if(s.lede) mid+='<p class="lede">'+s.lede+'</p>';
    html='<div class="slide">'+eb+'<h2>'+s.h2+'</h2>'+mid+foot(n)+'</div>';
  }
  deck.insertAdjacentHTML('beforeend', html);
});
</script>
</body>
</html>
