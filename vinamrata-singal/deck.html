<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pivot Into Product Without Burning Out - Vinamrata Singal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Esteban&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf6ee; --panel:#ffffff; --rule:#ece2d4;
    --ink:#2a2420; --muted:#6f655b; --accent:#db423d;
    --head:'Esteban', Georgia, serif; --body:'Poppins', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin:0 0 18px}
  h1{font-family:var(--head);font-weight:400;font-size:46px;line-height:1.1;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:400;font-size:34px;line-height:1.15;margin:0 0 16px}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin:0 0 14px;max-width:62ch}
  p.sub{color:var(--muted);font-size:20px}
  .rule{height:3px;width:64px;background:var(--accent);border-radius:3px;margin:8px 0 24px}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;
    border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:20px;width:9px;height:9px;
    background:var(--accent);border-radius:50%}
  li b{font-weight:600}
  .big{font-size:40px;font-family:var(--head);line-height:1.15}
  .num{font-family:var(--head);color:var(--accent);font-size:15px;letter-spacing:.12em;
    text-transform:uppercase;margin:0 0 10px;font-weight:400}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:60ch}
  .foot{max-width:960px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Vinamrata Singal &middot; The Next Chapter &middot; use arrow keys to move</div>
<script>
const S = [
  {t:'title', k:'A live masterclass for product managers',
    h:'Pivot Into Product Without Burning Out',
    s:'The calm, step by step way to make your next product move, with your skills and your nervous system both on your side.'},

  {t:'who', k:'Who this is for',
    h:'The capable PM who feels stuck',
    list:[
      "You can do the work, but the next role, the promotion, or the pivot keeps slipping.",
      "You are in a chaotic or low mentorship team and no one is actually guiding you.",
      "You are a high achiever who is quietly running on empty.",
      "You want a move that fits your life, not just a bigger title."]},

  {t:'trap', k:'The trap',
    h:'More PM content is not the problem',
    s:'You have read the frameworks and watched the interview breakdowns. The information is everywhere and free. If information were the fix, you would already be unstuck.',
    p2:'The thing that actually moves people is a plan built for them, and the inner steadiness to carry it out.'},

  {t:'reframe', k:'The reframe',
    h:'A pivot is two problems, not one',
    big:'It is a skills problem and a nervous system problem. Everyone treats it as only the first.'},

  {t:'num', n:'Part One', h:'Why smart product managers stall',
    s:'Two quiet reasons, almost always together.'},

  {t:'list', k:'Reason one', h:'No roadmap, only noise',
    list:[
      "A pile of generic advice is not a plan.",
      "Without a sequence, every week feels busy and nothing compounds.",
      "You end up optimizing the wrong things and calling it progress."]},

  {t:'list', k:'Reason two', h:'A dysregulated nervous system',
    list:[
      "You know your answer, then you freeze in the room.",
      "The fear of the wrong move keeps you in the role you have outgrown.",
      "Burnout makes every decision feel heavier than it is."]},

  {t:'num', n:'Part Two', h:'The method',
    s:'How I coach product managers through the pivot. Five pillars, human first.'},

  {t:'pillar', n:'Pillar 1', h:'Personalized roadmaps',
    s:'A step by step action plan built around your goal, your starting point, and your timeline, so effort finally compounds instead of scattering.'},

  {t:'pillar', n:'Pillar 2', h:'Structured learning',
    s:'Pre vetted resources matched to how you actually learn, so you stop drowning in generic PM content and study only what moves your case.'},

  {t:'pillar', n:'Pillar 3', h:'Mentor coach style',
    s:'A balance of coaching, asking the questions that surface your own answers, and mentorship, giving you direct advice as an equal partner who has done the pivot.'},

  {t:'pillar', n:'Pillar 4', h:'Human first methodology',
    s:'The piece most programs skip. Using Nervous System Mastery and related tools to work with the fear, the freeze, and the identity shift, not just the resume.'},

  {t:'pillar', n:'Pillar 5', h:'A safe space',
    s:'Real emotional support for a vulnerable season, so you can be honest about where you are and move anyway.'},

  {t:'num', n:'Part Three', h:'What the pivot looks like',
    s:'A simple shape over your first stretch of work together.'},

  {t:'list', k:'The shape', h:'From stuck to moving',
    list:[
      "<b>Clarity.</b> Name the real goal and the values behind it.",
      "<b>Roadmap.</b> Turn it into a sequence you can actually run.",
      "<b>Reps.</b> Portfolio, strategy, and mock interviews, with nervous system prep.",
      "<b>The move.</b> Step into the role, the promotion, or the new track on purpose."]},

  {t:'why', k:'Why me',
    h:'I have made this pivot, and I help PMs make theirs',
    list:[
      "Stanford CS, then Google's APM program.",
      "Product across Thumbtack, Match Group, and venture backed startups, in consumer, growth, and monetization.",
      "A writer and coach who treats the career and the human as one thing.",
      "Clients have seen meaningful salary increases after their move."]},

  {t:'cta', k:'Your next step',
    h:'Ready for your next chapter?',
    s:'If this is the season you stop drifting and make the move, let us map it together. Book a free consultation and we will look at where you are and the path forward.',
    cta:'Book a free consultation',
    disc:'This masterclass is educational and reflects one coach\'s approach. No income, role, or result is guaranteed. Results vary by person, effort, and circumstance.'}
];

const deck = document.getElementById('deck');
function esc(x){return x==null?'':x}
S.forEach(s=>{
  const d=document.createElement('section'); d.className='slide';
  let h='';
  if(s.n) h+=`<div class="num">${esc(s.n)}</div>`;
  if(s.k) h+=`<div class="kick">${esc(s.k)}</div>`;
  if(s.t==='title'){ h+=`<h1>${esc(s.h)}</h1><div class="rule"></div><p class="sub">${esc(s.s)}</p>`; }
  else if(s.t==='reframe'){ h+=`<h2>${esc(s.h)}</h2><div class="rule"></div><p class="big">${esc(s.big)}</p>`; }
  else { h+=`<h2>${esc(s.h)}</h2><div class="rule"></div>`;
    if(s.s) h+=`<p>${esc(s.s)}</p>`;
    if(s.p2) h+=`<p>${esc(s.p2)}</p>`;
    if(s.big) h+=`<p class="big">${esc(s.big)}</p>`;
    if(s.list){ h+='<ul>'; s.list.forEach(i=>h+=`<li>${i}</li>`); h+='</ul>'; }
  }
  if(s.cta) h+=`<p style="margin-top:24px;font-family:var(--head);font-size:24px;color:var(--accent)">${esc(s.cta)}</p>`;
  if(s.disc) h+=`<p class="disc">${esc(s.disc)}</p>`;
  d.innerHTML=h; deck.appendChild(d);
});
let i=0; const slides=[...document.querySelectorAll('.slide')];
function go(n){ i=Math.max(0,Math.min(slides.length-1,n)); slides[i].scrollIntoView({behavior:'smooth',block:'center'}); }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();go(i+1);} if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();go(i-1);} });
</script>
</body>
</html>
