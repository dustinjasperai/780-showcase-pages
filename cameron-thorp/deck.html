<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Signature Frame · Cameron Thorp · LENSEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0B0D14; --panel:#05070E; --rule:#242730;
    --acc:#CBB489; --chalk:#ECEDEF; --grey:#AAB0BA; --dim:#6B7079;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Inter Tight',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter Tight',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:600;color:var(--chalk);line-height:1.12;letter-spacing:-.012em}
  .t-title h1{font-size:5.0vw;max-width:90%;font-weight:700}
  .t-normal h1{font-size:3.25vw;max-width:84%}
  .t-normal .body{font-family:'Inter Tight',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-family:'Inter Tight',sans-serif;font-size:1.75vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Inter Tight',sans-serif;font-size:1.32vw;font-weight:600;color:var(--acc);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:88%}
  .t-section .rule{width:15vw;height:1px;background:var(--acc);opacity:.7;margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:84%;font-weight:400;color:#F3F1EC;letter-spacing:-.006em}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:var(--chalk);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.2vw;font-weight:500;letter-spacing:.01em}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Inter Tight',sans-serif;font-size:.9vw;color:var(--dim);font-style:normal;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .frame-motif{position:absolute;pointer-events:none}
  .title-frame{right:7%;bottom:7.5%;width:20vw;opacity:.85}
  .corner-frame{right:6%;bottom:7%;width:9vw;opacity:.5}
  .brandline{font-family:'Inter Tight',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3.6vh;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Inter Tight',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Inter Tight',sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Inter Tight',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}.brandline{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">LENSEL</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- signature-frame motif: four corner brackets = the frame made literal -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="frame" viewBox="0 0 200 140">
  <g fill="none" stroke="#CBB489" stroke-width="2.2" stroke-linecap="round">
    <path d="M12 34 V12 H34"/>
    <path d="M166 12 H188 V34"/>
    <path d="M188 106 V128 H166"/>
    <path d="M34 128 H12 V106"/>
    <circle cx="100" cy="70" r="2.6" fill="#CBB489" stroke="none" opacity=".8"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Signature Frame',sub:'How to build a wedding photography style couples recognize as yours, and book you for.',brand:true,frame:'title'},
 {t:'normal',k:'Who this is for',title:'You shoot beautiful weddings. So do a thousand other photographers.',body:'Your work is genuinely good. The problem is that a lot of genuinely good work looks like everyone else’s genuinely good work, and couples scrolling a feed cannot tell one from the next.'},
 {t:'dark',title:'Couples do not book the best photographer. They book the one whose work they cannot forget.'},

 {t:'section',idx:'Part One',title:'Why Good Work Disappears'},
 {t:'normal',k:'The sameness trap',title:'The feed rewards looking like the moment, not like yourself.',body:'The same presets, the same trending poses, the same golden-hour edit. It is competent, and it is invisible, because a couple has already seen forty galleries that look exactly like it.'},
 {t:'normal',k:'The naming test',title:'A style you cannot name is a style a couple cannot choose.',body:'If you cannot say in one sentence what your photos do that no one else’s do, neither can the couple deciding between you and three other photographers in their price range.'},
 {t:'dark',title:'If your photos could carry anyone’s logo, you do not have a signature yet.'},

 {t:'section',idx:'Part Two',title:'The Signature Frame Method'},
 {t:'normal',k:'The Signature Frame',title:'A signature is a choice you repeat until it becomes recognisable.',body:'Deliberate compositional choices, made the same way across every gallery, until the frame itself reads as yours. Not one hero shot. A way of seeing that shows up in all of them.'},
 {t:'normal',k:'Peak Moments',title:'Peak moments, not more moments.',body:'A wedding gallery is carried by a handful of decisive frames, not by volume. Learn to anticipate the few beats that actually matter and be ready for them, and the rest of the day gets quieter and better.'},
 {t:'normal',k:'Actually edit',title:'The edit is where the identity lives.',body:'White balance, skin tone, tonal depth, clean frames, done by hand. Presets and one-click AI flatten everyone toward the same look. The photographers who still do the real editing are the ones whose work you can pick out of a lineup.'},
 {t:'normal',k:'Consistency is the brand',title:'The look has to repeat before it can be remembered.',body:'When the same frame, the same light, and the same edit show up wedding after wedding, a couple can recognise your work before they ever see your name on it. That recognition is the whole asset.'},
 {t:'dark',title:'Style is not what you shoot once. It is what you do every single time.'},

 {t:'section',idx:'Part Three',title:'What This Builds'},
 {t:'normal',k:'The photographer this builds',title:'You stop competing on price and start being chosen on purpose.',body:'A photographer with a signature attracts the couples who want that exact thing, charges for a point of view instead of an hourly rate, and spends less time chasing leads who were only ever comparing numbers.'},
 {t:'dark',title:'The market does not pay for photos. It pays for a photographer it remembers.'},
 {t:'normal',k:'Why Cameron, why LENSEL',title:'Taught by someone still shooting the weddings.',body:'Cameron Thorp shoots weddings around the world through Chasewild, has spoken on stages across Europe, the US, Australia and New Zealand, and built LENSEL into the research and community that 350+ serious wedding photographers use to get better every month.'},

 {t:'section',idx:'Your Next Step',title:'Keep Getting Better'},
 {t:'normal',k:'Inside LENSEL PRO',title:'A private room for serious wedding photographers.',body:'Twelve live workshops a year with photographers whose work you already admire, weekly Q&A calls, twenty-plus replays to start on, the PRO research newsletter, and a community of 350+ photographers pushing each other forward.'},
 {t:'cta',title:'Ready to build a look that is unmistakably yours?',chips:['Join LENSEL PRO','Start with the free newsletter'],disc:'Educational content for wedding photographers. No income, booking, or business result is guaranteed. Results vary by photographer, market, and effort.'},
];

const deck=document.getElementById('deck');
function frame(kind){return `<svg class="frame-motif ${kind==='title'?'title-frame':'corner-frame'}" viewBox="0 0 200 140"><use href="#frame"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">LENSEL &middot; <b>Cameron Thorp</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.frame) h+=frame(s.frame);
  else if(s.t==='title') h+=frame('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
