<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Power to Prospect · Gary O'Sullivan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spinnaker&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#2E2F33; --panel:#3A3B40; --rule:#54565C;
    --blue:#13AFDF; --amber:#FFA500; --chalk:#EEEEEE; --grey:#959595; --dim:#6B6D72;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Open Sans',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);margin-bottom:2.4vh}
  h1{font-family:'Spinnaker',Arial,sans-serif;font-weight:400;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:5vw}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.58;font-weight:300}
  .sub{font-family:'Open Sans',sans-serif;font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.3vw;font-weight:600;color:var(--amber);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--blue),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#3A424C 0%,#17181B 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:84%;color:#F5F6F7}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#3A424C 0%,#17181B 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--amber);color:#FFD699;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500;font-family:'Open Sans',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4;font-family:'Open Sans',sans-serif}
  .t-title .disc,.t-normal .disc{text-align:left}
  .gauge-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-gauge{right:7%;bottom:8%;width:16vw}
  .corner-gauge{right:6%;bottom:7.5%;width:8vw;opacity:.4}
  .brandline{font-family:'Open Sans',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--blue);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--blue);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500;font-family:'Open Sans',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Open Sans',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Open Sans',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">The Gary O'Sullivan Company</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- gauge / dial motif, drawn from the Climate Control framework (thermostat and thermometer) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gauge" viewBox="0 0 200 140">
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 120 A80 80 0 0 1 180 120" stroke="#54565C" opacity="0.6"/>
    <path d="M20 120 A80 80 0 0 1 120 44" stroke="#13AFDF" opacity="0.9"/>
    <line x1="100" y1="120" x2="140" y2="58" stroke="#FFA500" stroke-width="3.4"/>
    <circle cx="100" cy="120" r="7" fill="#FFA500" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Power to Prospect',sub:'A masterclass on the psychology of consistent prospecting, for cemetery and funeral pre-need sales teams and the leaders who run them.',brand:true,gauge:'title'},
 {t:'normal',k:'Who this is for',title:'Your team is good at the close. Prospecting is the part that goes quiet.',body:'When calls fall off or pre-need volume dips, the usual fix is a new script or a new incentive. The real problem sits earlier than that: the habit of picking up the phone and making the call before anyone is ever asked to buy anything.'},
 {t:'dark',title:'You do not have a leads problem. You have a psychology problem.'},

 {t:'section',idx:'Part One',title:'Why Prospecting Stalls'},
 {t:'normal',k:'The real obstacle',title:'Destructive emotions do the damage, not a bad list.',body:'When a rep quietly avoids the phone, the cause is rarely the list of names in front of them. It is the emotion sitting underneath it: the sting of the last rejection, the story they told themselves about it, and a routine that stopped without anyone deciding to stop it.'},
 {t:'normal',k:'The hidden cost',title:'A team that avoids prospecting can only sell to who walks in.',body:'Revenue plateaus at whatever volume shows up on its own, and every slow month gets blamed on the market instead of the habit that actually slipped. Closing skill was never the problem. Nobody was in the room to close.'},
 {t:'dark',title:'If you do not have people to see, then nothing else really matters.'},

 {t:'section',idx:'Part Two',title:'The Power to Prospect'},
 {t:'normal',k:'Obstacle identification',title:'Name the real barrier before you try to fix it.',body:'Most teams treat prospecting as a numbers problem and hand out a bigger list. The actual barrier is almost always emotional: fear of rejection, discomfort with the ask, or a story about who is allowed to say yes. Fix the barrier and the numbers follow.'},
 {t:'normal',k:'Reframing rejection',title:'A no is information, not a verdict.',body:'Reps who treat every no as a personal verdict stop making calls long before their manager notices. The reframe: a no is data about timing, fit, or approach, nothing more, and the next call is a fresh one.'},
 {t:'normal',k:'Resilience',title:'The strength to keep going when you feel like stopping.',body:'Prospecting rewards the rep who is still dialing after the third no of the morning. Resilience here is not a personality trait. It is a skill that gets built call by call, and it can be taught.'},
 {t:'normal',k:'Daily discipline',title:'Prospecting is a routine, not a mood.',body:'The reps who stay consistent do not wait to feel like prospecting. They protect a block of time every day and treat it the way they treat any other non-negotiable part of the job.'},
 {t:'dark',title:'Four pillars. One habit rebuilt a call at a time.'},

 {t:'section',idx:'Part Three',title:'Leading a Team That Prospects'},
 {t:'normal',k:'Climate Control',title:'You are the thermostat and the thermometer.',body:'A leader reads the temperature of the team, then decides whether to warm it up or cool it down. Every organization runs somewhere between a flaming inferno, a deep freezer, and a comfortable place to work, and the leader is the one person with the authority to move it.'},
 {t:'normal',k:'The Three Cs',title:'Character. Consistency. Competence.',body:'Three foundations decide whether a leader can actually move that climate: who they are when no one is watching, whether they show up the same way every day, and whether they are good enough at the job to be believed when they ask for more.'},
 {t:'dark',title:'A team prospects the way its leader manages the climate around it.'},

 {t:'section',idx:'Why listen to me',title:'50 Years on the Sales Floor'},
 {t:'normal',k:'The operator behind this',title:'Started selling cemetery property door to door in 1971.',body:'Sales rep, sales manager, regional manager, and Senior VP of Sales for a public company, across more than fifty years in the cemetery and funeral profession. Recognized by the ICCFA as Speaker of the Decade in 2000 and again in 2010, and co-creator of The System University, the profession’s own pre-need sales training program.'},

 {t:'section',idx:'Your next step',title:'Build It With Me'},
 {t:'normal',k:'How I can help',title:'Coaching, consulting, and training for sales teams and the leaders who run them.',body:'Through The Gary O’Sullivan Company I work one on one with leaders, run consulting engagements, and deliver seminars and workshops built around Power to Prospect, Climate Control, and the Three Cs of Effective Leadership.'},
 {t:'cta',title:'Ready to build a team that prospects on its own?',chips:['Talk to Gary','Explore coaching'],disc:'Educational content for cemetery and funeral pre-need sales professionals and leaders. No income, sales, or business result is guaranteed. Results vary by individual, team, and market.'},
];

const deck=document.getElementById('deck');
function gauge(kind){return `<svg class="gauge-motif ${kind==='title'?'title-gauge':'corner-gauge'}"><use href="#gauge"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The <b>Gary O'Sullivan</b> Company</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.gauge) h+=gauge(s.gauge);
  else if(s.t==='title') h+=gauge('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
