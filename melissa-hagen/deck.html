<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Run It Like You're Selling It &middot; Melissa Hagen, Gorilla Garage Door Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;500;600;700&family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F6F4EF; --panel:#FFFFFF; --rule:#E2E0D8;
    --green:#1F6B4A; --rust:#8A4A1F; --ink:#292723; --grey:#5D5A54; --dim:#918D85;
  }
  html,body{height:100%}
  body{background:#171410;font-family:'Nunito Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#171410}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--green);margin-bottom:2.4vh}
  h1{font-family:'Bitter',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.5vw}
  .t-normal h1{font-size:3vw;max-width:84%}
  .t-normal .body{font-family:'Nunito Sans',sans-serif;font-size:1.46vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.58;font-weight:400}
  .sub{font-family:'Nunito Sans',sans-serif;font-size:1.65vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Nunito Sans',sans-serif;font-size:1.28vw;font-weight:700;color:var(--rust);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.2vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--green),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#332C22 0%,#171410 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.3vw;max-width:84%;color:#F6F4EF;font-family:'Bitter',Georgia,serif}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#163526 0%,#111311 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:82%;color:#F6F4EF;font-family:'Bitter',Georgia,serif}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--green);color:#8FCBA8;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500;font-family:'Nunito Sans',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4;font-family:'Nunito Sans',sans-serif}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .ledger-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-ledger{right:7%;bottom:9%;width:14vw}
  .corner-ledger{right:6%;bottom:7.5%;width:6.6vw;opacity:.5}
  .brandline{font-family:'Nunito Sans',sans-serif;font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--green);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--green);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#a39d92;z-index:20;font-weight:500;font-family:'Nunito Sans',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a39d92;z-index:20;font-weight:700;font-family:'Nunito Sans',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#a39d92;z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Nunito Sans',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.1vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.7vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Gorilla Garage Door Training</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ascending ledger-line motif, drawn from the P&L / financial-operations coaching content -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ledger" viewBox="0 0 200 160">
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 138 L14 20" stroke="#E2E0D8" opacity="0.7"/>
    <path d="M14 138 L186 138" stroke="#E2E0D8" opacity="0.7"/>
  </g>
  <g fill="#8A4A1F" opacity="0.9">
    <rect x="34" y="104" width="22" height="34"/>
    <rect x="74" y="80" width="22" height="58"/>
    <rect x="114" y="58" width="22" height="80"/>
  </g>
  <g fill="#1F6B4A">
    <rect x="154" y="30" width="22" height="108"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:"Run It Like You're Selling It",sub:"A masterclass for garage door company owners, from someone who built one, sold it to the industry's biggest buyer, and is showing you what actually made it worth buying.",brand:true,ledger:'title'},
 {t:'normal',k:'Who this is for',title:'You started this to build something. Most days it just runs you.',body:'You know the trade. You can fix anything on a truck. But margins slip, good techs leave, and the calendar runs your day instead of the other way around. That is not a you problem. It is a systems problem.'},
 {t:'dark',title:'You do not have a garage door problem. You have an operator problem.'},

 {t:'section',idx:'Part One',title:'Why Owners Stay Stuck'},
 {t:'normal',k:'The real obstacle',title:'Revenue without profit is just busy.',body:'Plenty of shops book more jobs every year and still cannot answer what they actually made. Growth without a real handle on cash flow and margin just means the owner works harder to stand still.'},
 {t:'normal',k:'The hidden cost',title:'A team without a real pay plan runs on guesswork.',body:'When commission, piece rate, and hybrid pay are never really decided, good techs leave for whoever pays clearer, and the owner keeps re-hiring the same role every year.'},
 {t:'dark',title:'A bigger truck fleet does not fix a business that cannot tell you if it made money this month.'},

 {t:'section',idx:'Part Two',title:"The Owner's Ledger"},
 {t:'normal',k:'Know your numbers',title:'Read the numbers before you make the next call.',body:'Cash flow and profitability get tracked on a real cadence, not guessed at tax season. Every pricing and hiring decision gets made from what the numbers actually say, not what the calendar feels like.'},
 {t:'normal',k:'Price the ticket right',title:'Grow revenue per job, not just job count.',body:'Quoting and service structure get rebuilt so the average ticket goes up on the same number of trucks, instead of chasing more leads to cover thin margins.'},
 {t:'normal',k:'Build a pay plan people stay for',title:'Commission, piece rate, or hybrid: pick one on purpose.',body:'Compensation gets structured deliberately, so technicians and sales staff know exactly how they win, and hiring stops being a yearly fire drill.'},
 {t:'normal',k:'Run on systems, not memory',title:'The right software, used the same way every day.',body:'A CRM and scheduling system get chosen and actually used consistently, so nothing depends on one person remembering everything.'},
 {t:'normal',k:'Lead like an owner, not a technician',title:'The shift from doing the work to running the company.',body:'The biggest block for most garage door owners is not skill. It is still thinking like the best technician instead of the person building the business around them.'},
 {t:'dark',title:"Every one of those five is a lever A1 Garage Door Service looked at before they bought Legends."},

 {t:'section',idx:'Part Three',title:'Proof, Not a Pitch'},
 {t:'normal',k:'The proof',title:'Built it. Ran it. Sold it.',body:'Melissa built Legends Garage Door from 2006 to 2022 into a multi-location company serving all of Arizona. In 2023, A1 Garage Door Service, the largest platform in the industry, acquired it.'},
 {t:'normal',k:'Why that matters here',title:'She is not teaching theory. She lived the exit.',body:'Every lever in this masterclass, margins, pay plans, systems, leadership, is the same ground she had to get right before her own company was worth buying.'},

 {t:'section',idx:'Your next step',title:'Build Your Own Ledger'},
 {t:'normal',k:'How I can help',title:'Weekly 1:1 coaching for garage door company owners.',body:'Through Gorilla Garage Door Training, Melissa runs structured, one-on-one coaching built around your numbers, your team, and your systems, starting with a free 15-minute consultation call.'},
 {t:'cta',title:'Ready to run it like you are selling it?',chips:['Book your free consultation','See how coaching works'],disc:'Educational content for garage door company owners. No income, growth, or business result is guaranteed. Results vary by market, team, and execution.'},
];

const deck=document.getElementById('deck');
function ledger(kind){return `<svg class="ledger-motif ${kind==='title'?'title-ledger':'corner-ledger'}"><use href="#ledger"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Gorilla Garage Door <b>Training</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.ledger) h+=ledger(s.ledger);
  else if(s.t==='title') h+=ledger('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
