<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Career Change Map - A Live Masterclass with Rikke Hansen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf7;        /* warm paper (her LIGHT scheme) */
    --panel:#eef2f3;     /* faint cool wash */
    --rule:#d4dadd;      /* light cool hairline */
    --ink:#222222;       /* her charcoal body */
    --muted:#5b6569;
    --accent:#006699;    /* her brand teal-blue */
    --accent2:#24765e;   /* her deep green */
    --head:'Spectral',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:56px 60px;margin:0 0 26px;min-height:482px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:33px;line-height:1.14;margin-bottom:14px}
  .sub{font-size:20px;color:var(--muted);margin-top:18px;max-width:42ch;line-height:1.45}
  p.body{font-size:18px;line-height:1.6;max-width:52ch;margin-top:8px;color:var(--ink)}
  ul{margin:18px 0 0;padding:0;list-style:none;max-width:54ch}
  li{position:relative;padding-left:30px;margin:0 0 14px;font-size:18px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(0,102,153,.14)}
  .section h1{font-size:52px}
  .section .num{font-family:var(--head);font-size:17px;color:var(--accent2);font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
  .route{display:flex;align-items:center;gap:0;margin-top:30px}
  .wp{display:flex;flex-direction:column;align-items:center;flex:1;text-align:center}
  .wp .dot{width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
  .wp.on .dot{background:var(--accent)}
  .wp small{display:block;margin-top:8px;color:var(--muted);font-size:13px;max-width:12ch}
  .line{height:3px;background:var(--rule);flex:1;margin-top:-22px}
  .cta h1{font-size:40px}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .credit .big{font-family:var(--head);font-size:40px;color:var(--accent);font-weight:700}
  .pagefoot{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted)}
  .strike{text-decoration:line-through;color:var(--muted)}
  .em{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Rikke Hansen',
    h:'The Career Change Map',
    sub:'How smart, stuck professionals find the right next move without gambling their income.'},

  {t:'content', k:'Who this is for',
    h:'You are good at what you do. You are also done with it.',
    body:'You are a smart professional somewhere in your mid-30s to mid-50s. On paper the career works. In reality you dread Monday, and the idea of starting over feels both overdue and terrifying.',
    list:['You keep telling yourself you should be grateful.','You have a shortlist of "sensible" next jobs, and none of them excite you.','You are afraid that changing now wastes everything you have built.']},

  {t:'content', k:'The real trap', deep:true,
    h:'The problem was never that you lack options.',
    body:'It is that you have been choosing from the wrong 10%. Most smart people only consider the narrow band of roles they feel formally qualified for, and quietly ignore the other 90% their skills actually reach.'},

  {t:'section', num:'Part One', h:'Why smart people stay stuck'},

  {t:'content', k:'The overthinker loop',
    h:'More thinking will not get you unstuck.',
    body:'The smarter you are, the better you are at talking yourself out of every option. Two traps run the loop, and the map defuses both.',
    list:['The negativity trap: analysis paralysis dressed up as being "realistic".','The sunk cost trap: "15 years in is a reason to stay." It is not. It is a reason to choose the next step well.']},

  {t:'framework', k:'Framework 1',
    h:'Work Subject vs Context',
    body:'Before you quit anything, diagnose what is actually wrong. People change the wrong variable all the time, and burn a year doing it.',
    list:['Subject problem: you are in the wrong field. The work itself is not for you.','Context problem: right field, wrong setup. Wrong company, boss, hours or structure.','Fix the right one. The leap you think you need is often a change of context, not career.']},

  {t:'framework', k:'Framework 2',
    h:'The 10% Professional Silo',
    body:'Your title has quietly narrowed your sense of what you are allowed to do. The map widens it back out.',
    list:['List the roles you feel "qualified" for. That is your 10%.','Now map the skills underneath, not the job titles on top.','Those skills open the other 90%: adjacent fields, hybrid roles, and your first business step.']},

  {t:'section', num:'Part Two', h:'The map'},

  {t:'content', k:'Step one',
    h:'Choose an idea, do not wait for the idea.',
    body:'There is no single destined path waiting to be discovered. There are several good directions. The skill is choosing one to explore on purpose, using clear criteria instead of a gut feeling at 2am.'},

  {t:'content', k:'Step two',
    h:'Test-drive it before you leap.',
    body:'You do not quit to find out. You run small, real experiments while the salary is still coming in, so the decision is made on evidence, not hope. This is what treating your career like a startup actually means.'},

  {t:'content', k:'Step three',
    h:'Combine, do not amputate.',
    body:'Smart people usually have several interests and feel they must pick one and kill the rest. You do not. An umbrella concept lets two or three threads become a single coherent next move.'},

  {t:'framework', k:'Framework 3',
    h:'The Emotional Weather Forecast',
    body:'Every real transition has predictable weather. When you know the forecast, the storm stops reading as proof you made a mistake.',
    list:['Early: excitement and relief that you are finally moving.','Middle: fog and doubt, right on schedule. Most people quit here.','Through it: clarity, because you kept moving instead of turning back.']},

  {t:'route', k:'The map, in one view',
    h:'Diagnose. Widen. Test. Decide.',
    waypoints:[['Diagnose','subject vs context'],['Widen','out of the 10% silo'],['Test','drive it for real'],['Decide','on evidence']]},

  {t:'section', num:'Part Three', h:'A change you can test-drive'},

  {t:'content', k:'A de-risked change',
    h:'The slow version is the fast version.',
    body:'Done this way, a career change is not a cliff jump. It is a series of small, reversible steps, each one giving you more information than the last, until the right move is obvious and the fear is mostly gone.'},

  {t:'credit', k:'Why listen to me',
    h:'Two decades of doing exactly this.',
    big:'700+',
    body:'I have advised more than 700 private clients one to one since 2005, and thousands more through my programmes, videos and The Career Change Podcast. I am frank, not fluffy, because the people I work with are smart and do not need another motivational quote.'},

  {t:'content', k:'The cost of waiting',
    h:'Another year of "I should be grateful."',
    body:'Staying stuck is a choice too, it just does not feel like one. The question is not whether you can afford to explore a change. It is how many more Mondays you want to spend pretending this is fine.'},

  {t:'cta', k:'Your next step',
    h:'Map your right next move.',
    body:'If you want the full, structured version of this, that is exactly what my programme Your Career Change Map walks you through, step by step, with live support from me along the way.',
    disc:'This masterclass is educational. No income or specific result is guaranteed. Outcomes vary and depend on your own circumstances, effort and decisions.'}
];

function esc(s){return s==null?'':String(s);}
function slideHTML(s,i){
  const foot='<div class="pagefoot">'+(i+1)+' / '+S.length+'</div>';
  if(s.t==='title'){
    return '<div class="slide title">'+ (s.k?'<div class="kicker">'+esc(s.k)+'</div>':'')
      +'<h1>'+esc(s.h)+'</h1>'+ (s.sub?'<p class="sub">'+esc(s.sub)+'</p>':'') + foot +'</div>';
  }
  if(s.t==='section'){
    return '<div class="slide section">'+ (s.num?'<div class="num">'+esc(s.num)+'</div>':'')
      +'<h1>'+esc(s.h)+'</h1>'+ foot +'</div>';
  }
  if(s.t==='route'){
    let wp=(s.waypoints||[]).map((w,j)=>'<div class="wp on"><div class="dot"></div><small>'
      +esc(w[0])+'<br>'+esc(w[1])+'</small></div>'
      +(j<s.waypoints.length-1?'<div class="line"></div>':'')).join('');
    return '<div class="slide">'+ (s.k?'<div class="kicker">'+esc(s.k)+'</div>':'')
      +'<h2>'+esc(s.h)+'</h2><div class="route">'+wp+'</div>'+ foot +'</div>';
  }
  if(s.t==='credit'){
    return '<div class="slide credit">'+ (s.k?'<div class="kicker">'+esc(s.k)+'</div>':'')
      +'<h2>'+esc(s.h)+'</h2>'+ (s.big?'<div class="big">'+esc(s.big)+' clients</div>':'')
      +(s.body?'<p class="body">'+esc(s.body)+'</p>':'') + foot +'</div>';
  }
  if(s.t==='cta'){
    return '<div class="slide cta">'+ (s.k?'<div class="kicker">'+esc(s.k)+'</div>':'')
      +'<h1>'+esc(s.h)+'</h1>'+ (s.body?'<p class="body">'+esc(s.body)+'</p>':'')
      +(s.disc?'<div class="disc">'+esc(s.disc)+'</div>':'') + foot +'</div>';
  }
  // content / framework
  let li=(s.list||[]).map(x=>'<li>'+esc(x)+'</li>').join('');
  return '<div class="slide'+(s.deep?' deep':'')+'">'+ (s.k?'<div class="kicker">'+esc(s.k)+'</div>':'')
    +'<h2>'+esc(s.h)+'</h2>'+ (s.body?'<p class="body">'+esc(s.body)+'</p>':'')
    +(li?'<ul>'+li+'</ul>':'') + foot +'</div>';
}
document.getElementById('deck').innerHTML = S.map(slideHTML).join('');
</script>
</body>
</html>
