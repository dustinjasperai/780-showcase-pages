<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Yoga of Sound — A Masterclass with Anandra George</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f0ec;        /* pale sage, lightened from their brand accent #9cc0b5 */
    --panel:#ffffff;     /* their page background */
    --rule:#e5ddcf;
    --accent:#9cc0b5;    /* their exact brand sage green (footer bg) */
    --ink:#2f4f49;       /* deep teal, darkened from sage + slate */
    --body:#43474a;      /* from their #5f6364 slate */
    --display:'Cormorant Garamond',Georgia,serif;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:32px 18px 80px}
  .slide{
    position:relative;background:var(--panel);border:1px solid var(--rule);
    border-radius:18px;padding:60px 56px;margin:0 0 26px;overflow:hidden;
    min-height:420px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(47,79,73,.03);
  }
  .slide::after{
    content:"";position:absolute;right:-140px;top:-140px;width:360px;height:360px;
    border-radius:50%;pointer-events:none;opacity:.5;
    background:
      radial-gradient(circle, transparent 46%, var(--accent) 47%, transparent 49%),
      radial-gradient(circle, transparent 62%, var(--accent) 63%, transparent 65%),
      radial-gradient(circle, transparent 78%, var(--accent) 79%, transparent 81%);
  }
  .eyebrow{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:600;color:var(--ink);line-height:1.04;
    font-size:68px;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;color:var(--ink);line-height:1.08;
    font-size:46px;margin-bottom:20px}
  .lede{font-family:var(--display);font-style:italic;font-size:28px;color:var(--ink);
    line-height:1.3;margin-top:18px;max-width:40ch}
  p{font-size:19px;line-height:1.6;max-width:56ch;margin-top:14px}
  .big{font-family:var(--display);font-size:40px;line-height:1.18;color:var(--ink);
    max-width:24ch}
  ul{list-style:none;margin-top:22px;max-width:60ch}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.5;margin-bottom:16px}
  li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;
    border-radius:50%;border:2px solid var(--accent)}
  li b{color:var(--ink);font-weight:600}
  .num{font-family:var(--display);font-size:22px;color:var(--accent);font-weight:600}
  .meta{margin-top:30px;font-size:16px;color:var(--body)}
  .meta strong{color:var(--ink)}
  .kicker{font-size:17px;color:var(--body);margin-top:10px}
  .cta h2{font-size:52px}
  .steps{margin-top:26px}
  .steps li{font-size:20px}
  .disclaimer{margin-top:34px;font-size:13px;color:#8a8a84;max-width:64ch;line-height:1.5}
  .pagefoot{font-size:12px;color:#a7a79f;letter-spacing:.14em;text-transform:uppercase;
    position:absolute;bottom:22px;left:56px}
  .brandtag{position:absolute;bottom:22px;right:56px;font-size:12px;color:#a7a79f;
    letter-spacing:.14em;text-transform:uppercase}
  @media(max-width:640px){
    .slide{padding:40px 26px;min-height:340px}
    h1{font-size:44px}h2{font-size:32px}.cta h2{font-size:36px}.lede{font-size:22px}
    .big{font-size:28px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Anandra George',
    h1:'The Yoga<br>of Sound',
    lede:'How to lead mantra and sound sessions that actually transform the people in the room.',
    meta:'Anandra George &nbsp;·&nbsp; Heart of Sound &nbsp;·&nbsp; Naada yoga and Sanskrit mantra'},

  {t:'who', eyebrow:'Who this is for', h:'If you love sound and you want it to land',
    items:[
      '<b>Sound healers</b> whose sessions feel pleasant, but you sense they could go deeper.',
      '<b>Chant and kirtan leaders</b> who want communion, not performance.',
      '<b>Yoga teachers</b> ready to lead mantra and sound with real foundations under it.'],
    kicker:'No musical background required. Only a willingness to listen.'},

  {t:'trap', eyebrow:'The trap',
    big:'"That was lovely," they say. And then nothing in their life is different.',
    p:'You poured your heart into the session. The feedback was warm. But you have a quiet feeling the sound could have done so much more than feel nice for an hour.'},

  {t:'reframe', eyebrow:'The reframe',
    big:'Beautiful sound is not the same as transformation.',
    lede:'Transformation has a craft. It can be learned, and most of it is simpler than you think.'},

  {t:'part', eyebrow:'Part One', h:'Why most sessions stop at "that was nice"'},

  {t:'reason', num:'01', h:'You are performing, not communing',
    p:'When the focus is on sounding good, the room watches you. When the focus is on shared resonance, the room drops in with you. Most leaders never learn the difference.'},

  {t:'reason', num:'02', h:'The Sanskrit is almost right',
    p:'A mantra is vibration before it is meaning. When the pronunciation is loose, the medicine is diluted, and nobody can say why the chant felt flat. Precision is not pedantry, it is the point.'},

  {t:'reason', num:'03', h:'There is no container of safety',
    p:'People only open their voice when they feel held. Without a deliberate container, participants stay polite, guarded, and on the surface, and a surface chant can only ever be nice.'},

  {t:'part', eyebrow:'Part Two', h:'The Heart of Sound: the craft of leading'},

  {t:'pillar', num:'01', k:'Naada yoga', h:'Deep listening',
    p:'Before you lead a sound, you learn to truly hear it. Classical naada yoga trains the ear and the attention so you can feel what the room needs moment to moment.'},

  {t:'pillar', num:'02', k:'Voice exploration', h:'Your authentic voice',
    p:'Not a trained performer voice. Your voice, freed of tension and fear, is the instrument people actually resonate with. Resonance is contagious.'},

  {t:'pillar', num:'03', k:'Tantrik approach', h:'Accurate Sanskrit mantra',
    p:'A clear, lineage-rooted way into the vibrations of the Sanskrit alphabet, so the mantra does what it is designed to do instead of approximately that.'},

  {t:'pillar', num:'04', k:'Empathetic listening', h:'Holding the room',
    p:'The quiet skills, pacing, safety, and genuine presence, that turn a group of strangers into one voice. This is where "nice" becomes "that touched my soul."'},

  {t:'lineage', eyebrow:'The foundation', h:'A living lineage, not a Spotify playlist',
    p:'The vocal training at the heart of this method comes from classical Indian naada yoga, shaped by three generations of Hindustani musicians. That is what makes the craft repeatable, teachable, and real, rather than a lucky good night.'},

  {t:'part', eyebrow:'Part Three', h:'What a trained chant leader creates'},

  {t:'picture', eyebrow:'Inside a real session',
    big:'The room goes quiet in a different way.',
    p:'Voices that were guarded open up. People stop performing their own chanting and start listening to each other. Someone cries and does not know why. That is the difference between a sound bath and a sound journey, and it is entirely within your reach.'},

  {t:'whyme', eyebrow:'Why learn this from me', h:'Anandra George',
    items:[
      '27 years teaching sound and 37 years of music, studying in India since 1997.',
      'Created the Heart of Sound, the world\'s first yoga teacher training built entirely on the power of sound.',
      'Founded the Sacred Sound Stage at the International Yoga Festival in Rishikesh, with a global community across 65 countries.']},

  {t:'path', eyebrow:'The journey', h:'From chanting along to leading the room',
    steps:[
      '<b>Chant along.</b> You already love this. Start where you are.',
      '<b>Learn the craft.</b> Listening, voice, accurate mantra, and holding a room.',
      '<b>Lead and teach.</b> Guide sessions, and if you choose, train to teach others.']},

  {t:'recap', eyebrow:'The one idea',
    big:'The difference between "nice" and "transformational" is a craft, and the craft is learnable.'},

  {t:'cta', eyebrow:'Your next step', h:'Come learn the Yoga of Sound',
    p:'If something in you has been waiting to lead sound with real depth, this is your invitation. Start with the free prep course, or book a discovery call to find the right path into the Heart of Sound training for you.',
    steps:[
      '<b>Begin free:</b> the Heart of Sound prep course.',
      '<b>Go deeper:</b> book a free discovery call about the 200 and 500 hour trainings.'],
    disclaimer:'This masterclass is educational. No specific outcome, income, or healing result is guaranteed. Results vary from person to person.'}
];

function foot(){return '<div class="pagefoot">The Yoga of Sound</div><div class="brandtag">Heart of Sound</div>';}
function list(items,cls){return '<ul'+(cls?(' class="'+cls+'"'):'')+'>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}

function slideHTML(s){
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.num) h+='<div class="num">'+s.num+'</div>';
  if(s.k) h=('<div class="eyebrow">'+s.k+'</div>')+h.replace('<div class="eyebrow">'+s.eyebrow+'</div>','');
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h) h+='<h2>'+s.h+'</h2>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.lede) h+='<div class="lede">'+s.lede+'</div>';
  if(s.p) h+='<p>'+s.p+'</p>';
  if(s.items) h+=list(s.items);
  if(s.steps) h+=list(s.steps,'steps');
  if(s.kicker) h+='<p class="kicker">'+s.kicker+'</p>';
  if(s.meta) h+='<div class="meta">'+s.meta+'</div>';
  if(s.disclaimer) h+='<p class="disclaimer">'+s.disclaimer+'</p>';
  return h+foot();
}

const deck = document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  el.innerHTML=slideHTML(s);
  deck.appendChild(el);
});
</script>
</body>
</html>
