<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Predictable Referral System | A Masterclass with John Pyron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f5f1;
    --panel:#ffffff;
    --ink:#26292f;
    --grey:#69727d;
    --rule:#e4ded6;
    --accent:#cc3366;
  }
  html,body{height:100%}
  body{font-family:'Open Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #deck{width:100vw;height:100vh;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:9vh 9vw;background:var(--bg)}
  .slide.active{display:flex}
  h1{font-family:'Zilla Slab',Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em;color:var(--ink)}
  .kicker{font-family:'Open Sans',sans-serif;font-size:1.1vw;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  .t-title{background:var(--panel)}
  .t-title h1{font-size:5vw;max-width:90%}
  .t-title .sub{font-family:'Open Sans',sans-serif;font-size:1.7vw;color:var(--grey);margin-top:3vh;max-width:70%;line-height:1.5;font-weight:400}
  .t-title .brandline{margin-top:5vh;font-size:1.2vw;color:var(--ink);letter-spacing:.02em}
  .t-title .brandline b{color:var(--accent)}
  .t-normal h1{font-size:3.3vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.8vh;max-width:74%;line-height:1.6;font-weight:400}
  .t-section{background:var(--panel);align-items:flex-start}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.2vw;font-weight:700;color:var(--accent);
    margin-bottom:2.2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:14vw;height:3px;background:var(--accent);margin-top:3.4vh;border-radius:2px}
  .t-dark{background:var(--ink);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:84%;color:#f6f2ec}
  .t-dark .accentbar{width:6vw;height:4px;background:var(--accent);margin-bottom:4vh;border-radius:2px}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:82%}
  .chips{display:flex;gap:1.4vw;margin-top:5vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Open Sans',sans-serif;font-size:1.25vw;font-weight:600;color:#fff;background:var(--accent);
    padding:1.4vh 2.2vw;border-radius:40px}
  .disc{position:absolute;bottom:4vh;left:9vw;right:9vw;font-size:.95vw;color:var(--grey);
    line-height:1.5;text-align:center;font-weight:400}
  .rx{position:absolute;top:6vh;right:8vw;font-family:'Zilla Slab',serif;font-size:2vw;font-weight:700;color:var(--accent);opacity:.9}
  .rx::after{content:"";display:block;width:100%;height:2px;background:var(--accent);margin-top:.4vh;opacity:.5}
  #chrome{position:fixed;bottom:0;left:0;right:0;height:5px;background:var(--rule);z-index:20}
  #bar{height:100%;width:0;background:var(--accent);transition:width .3s ease}
  #nav{position:fixed;bottom:2.4vh;right:2.4vw;display:flex;gap:10px;align-items:center;z-index:21}
  #count{font-family:'Open Sans',sans-serif;font-size:13px;color:var(--grey);letter-spacing:.04em}
  .navbtn{width:34px;height:34px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);
    border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
  .navbtn:hover{border-color:var(--accent);color:var(--accent)}
  #hint{position:fixed;bottom:2.6vh;left:2.4vw;font-family:'Open Sans',sans-serif;font-size:12px;color:var(--grey);z-index:21;transition:opacity .4s}
  @media(max-width:760px){
    .slide{padding:8vh 8vw}
    .kicker{font-size:3vw}
    .t-title h1{font-size:8.5vw}.t-title .sub{font-size:4vw;max-width:92%}.t-title .brandline{font-size:3.4vw}
    .t-normal h1{font-size:6.2vw;max-width:96%}.t-normal .body{font-size:3.6vw;max-width:96%}
    .t-section h1{font-size:8vw}.t-section .idx{font-size:3.2vw}
    .t-dark h1{font-size:6.6vw}.t-cta h1{font-size:7vw}.chip{font-size:3.4vw;padding:1.2vh 5vw}
    .disc{font-size:2.6vw}.rx{font-size:5vw}
  }
</style>
</head>
<body>

<div id="deck"></div>
<div id="chrome"><div id="bar"></div></div>
<div id="hint">Use arrow keys or click to navigate</div>
<div id="nav"><span id="count">01 / 20</span>
  <button class="navbtn" id="prev" aria-label="Previous">&#8249;</button>
  <button class="navbtn" id="next" aria-label="Next">&#8250;</button>
</div>

<script>
const S=[
 {t:'title',title:'The Predictable Referral System',sub:'How to turn word of mouth into a system that brings you high quality referrals every single month, instead of hoping they show up.',brand:true},
 {t:'normal',k:'Who this is for',title:'Your best clients came from referrals. You just cannot predict when the next one arrives.',body:'You do great work, people say kind things, and every so often a warm introduction lands in your inbox. Then it goes quiet for weeks. Your pipeline rides a wave you do not control.'},
 {t:'dark',title:'You do not have a referral luck problem. You have a referral system problem.'},
 {t:'section',idx:'Part One',title:'Why referrals stay unpredictable'},
 {t:'normal',k:'The quiet leak',title:'Happy clients refer you when it happens to cross their mind, and most of the time it never does.',body:'Referrals feel free, so most owners leave them to chance. But leaving your best growth channel to chance is the same as leaving money on the table every month you stay quiet.'},
 {t:'normal',k:'The real cost',title:'Feast and famine is a symptom, not the disease.',body:'When new business arrives in unpredictable bursts, you cannot plan, hire, or invest with any confidence. The root cause is almost always the same: no repeatable way to ask, and no reason for people to remember you between conversations.'},
 {t:'normal',k:'The diagnosis',title:'Before you push for more leads, find the constraint that is actually holding you back.',body:'As the Business Doctor, I start every engagement the same way a physician does, by diagnosing before prescribing. Nine times out of ten the constraint is not visibility. It is that your referral engine was never built on purpose.'},
 {t:'dark',title:'Predictable revenue is not about working harder. It is about building the system once.'},
 {t:'section',idx:'Part Two',title:'The three parts of a referral system'},
 {t:'normal',k:'Part one of three',title:'Deliver a result worth talking about, then make it easy to describe.',body:'People refer what they can explain in one sentence. We sharpen the outcome you deliver into words a happy client can repeat, so the referral does the selling before the prospect ever reaches you.'},
 {t:'normal',k:'Part two of three',title:'Ask by design, not by accident.',body:'A referral system replaces the awkward one off ask with a simple, repeatable moment built into how you already work. When the ask is planned and comfortable, it happens every time instead of once in a while.'},
 {t:'normal',k:'Part three of three',title:'Multiply through recurring relationships.',body:'One referral from one client is a transaction. A relationship that keeps sending you clients is an asset. We turn your best sources into an ongoing loop, so the same handful of people keep introducing you month after month.'},
 {t:'dark',title:'Do this on purpose and referrals stop being a surprise. They become a number you can count on.'},
 {t:'section',idx:'Part Three',title:'Your referral engine, running every month'},
 {t:'normal',k:'The first 90 days',title:'A short list of moves, run in order, that turn a good month into a repeatable one.',body:'We diagnose where your referrals actually come from today, sharpen your one sentence result, install the ask into your existing workflow, and set up the follow through that keeps your best sources active. Simple to run, and built to keep running without you.'},
 {t:'normal',k:'The shift',title:'From chasing new leads to harvesting relationships you already have.',body:'Most owners try to fix a slow month by finding brand new strangers. The faster path is the trust you have already earned. A referral system compounds that trust into steady, higher quality clients who arrive pre sold.'},
 {t:'normal',k:'Why me',title:'I built and sold a company on these systems before I ever taught them.',body:'I am John Pyron, the Business Doctor. I grew Intelligent Business Network Solutions to seven figures through the 2008 recession, was named to the Sacramento Business Journal fastest growing list, and sold the company in 2013 to coach full time. Thirty years in, I teach owners the same systems I ran myself.'},
 {t:'section',idx:'Your next step',title:'Let us diagnose your referral engine'},
 {t:'normal',k:'How I can help',title:'Bring your business to the doctor.',body:'In my coaching and the weekly 10x Mastermind, I help owners build the predictable referral system step by step, alongside the sales, pricing, and recurring revenue work that makes the whole business healthier. We start by finding your real constraint, then we prescribe the fix.'},
 {t:'cta',title:'Ready to make referrals predictable?',chips:['Book a free consultation','Join the 10x Mastermind'],disc:'Educational content for business owners. No income, revenue, or business result is guaranteed. Results vary by owner, business, and market.'},
];

const deck=document.getElementById('deck');
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='dark'){ h=`<div class="accentbar"></div><h1>${s.title}</h1>`; }
  else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The <b>Business Doctor</b> &middot; John Pyron</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='normal'||s.t==='cta') h+=`<div class="rx">Rx</div>`;
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
