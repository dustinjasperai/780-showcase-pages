<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Realignment: A Masterclass with April Roberts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f2;      /* warm cream, from brand cream #fffcf8 */
    --panel:#f3e9e2;   /* soft blush panel */
    --ink:#321932;     /* deep plum, dominant brand hex */
    --muted:#6f5667;   /* muted plum for secondary text */
    --accent:#9c6b4f;  /* warm bronze, muted complement to the plum */
    --rule:#321932;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);font-family:'Jost',sans-serif;color:var(--ink);}
  .deck{max-width:960px;margin:0 auto;}
  .slide{
    position:relative;background:var(--bg);min-height:62vh;
    padding:84px 76px;margin:26px 0;border-radius:3px;overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,.06);
  }
  /* thin plum hairline + quarter-circle "vision book" corner mark (motif) */
  .slide::before{content:"";position:absolute;top:34px;left:76px;width:46px;height:1px;background:var(--rule);opacity:.8}
  .slide::after{content:"";position:absolute;right:-70px;bottom:-70px;width:150px;height:150px;border:1px solid var(--accent);border-radius:50%;opacity:.35}
  .kicker{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:'Italiana',serif;font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-family:'Italiana',serif;font-weight:600;font-size:40px;line-height:1.1;margin-bottom:20px}
  h3{font-family:'Italiana',serif;font-weight:600;font-size:26px;margin-bottom:10px}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:46ch;font-weight:300}
  p.lead{font-size:22px;color:var(--ink);font-weight:400}
  .sub{font-size:20px;color:var(--muted);font-weight:300;margin-top:6px}
  .by{position:absolute;left:76px;bottom:60px;font-size:15px;color:var(--ink);letter-spacing:.02em}
  .by span{color:var(--accent)}
  ul{list-style:none;margin-top:12px}
  li{font-size:19px;line-height:1.5;color:var(--muted);padding-left:24px;position:relative;margin-bottom:12px;max-width:48ch;font-weight:300}
  li::before{content:"";position:absolute;left:0;top:12px;width:9px;height:9px;border:1px solid var(--accent);border-radius:50%}
  .pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:26px}
  .pillar{background:var(--panel);border-radius:3px;padding:24px 26px}
  .pillar h3{font-size:22px;margin-bottom:6px}
  .pillar p{font-size:16px;max-width:38ch}
  .step{font-family:'Italiana',serif;font-size:64px;color:var(--accent);opacity:.9;line-height:1}
  .big{font-size:44px;line-height:1.14;max-width:22ch;color:var(--ink);font-family:'Italiana',serif;font-weight:600}
  .cta-box{margin-top:30px;padding:28px 30px;background:var(--panel);border-left:3px solid var(--accent);border-radius:2px}
  .disclaimer{position:absolute;left:76px;right:76px;bottom:30px;font-size:12px;color:var(--muted);line-height:1.5;font-weight:300}
  .pagenum{position:absolute;right:40px;top:34px;font-size:12px;color:var(--muted);letter-spacing:.1em}
  @media(max-width:700px){.slide{padding:54px 32px}h1{font-size:40px}h2{font-size:30px}.pillars{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass with April Roberts',h:'The Realignment',sub:'Scaling past six figures without burning out',by:'April Roberts &middot; <span>Vixen Gathering</span>'},
 {t:'promise',kicker:'What you will leave with',h:'A business that feels as good as it looks',body:'In the next hour you will see why the next level is not on the other side of working harder, and the exact reset I use to realign a company to the founder running it.'},
 {t:'who',kicker:'Who this is for',h:'Accomplished women founders, 40 and up',list:['Attorneys, advisors, consultants, and physicians who built the thing','Executives who left to found their own','Founders already past six figures, scaling toward seven','Women who are successful on paper and quietly running on empty']},
 {t:'trap',kicker:'The trap',h:'Another record month, still empty',body:'The revenue is up and the calendar is full, and somehow there is less of you in your own life. You keep adding, because adding is what got you here. It will not be what gets you to the next version.'},
 {t:'reframe',kicker:'The reframe',big:'The next level is not on the other side of pushing harder. It is on the other side of realigning.'},
 {t:'part',kicker:'Part one',h:'The core problem: scaling by addition',body:'Most growth advice is addition. More offers, more funnels, more hours. Every addition routes back through you, so the more you scale, the more you become the bottleneck, and the further the business drifts from the life it was supposed to build.'},
 {t:'body',kicker:'The hidden cost',h:'The misalignment tax',body:'When the company stops fitting the founder, you feel it before the numbers do: the dread before a launch, the offer you resent delivering, the team you cannot let near the real work. That tax compounds quietly until a record month feels like nothing.'},
 {t:'part',kicker:'Part two, the method',h:'Pause, Reflect, and Realign',body:'The reset I run with every founder. Three moves, in order, before you touch the business.'},
 {t:'step',n:'01',h:'Pause',body:'Stop reacting. You cannot realign a company at the speed you built it. The pause is not rest for its own sake, it is the only place clear decisions get made.'},
 {t:'step',n:'02',h:'Reflect',body:'Separate what is actually yours to carry from what you picked up along the way. Most founders are buried under commitments that were never theirs, made by an earlier version of them.'},
 {t:'step',n:'03',h:'Realign',body:'Rebuild the business around the founder you are now, not the one who started it. Offers, calendar, team, and energy all point the same direction again.'},
 {t:'part',kicker:'Part two, the structure',h:'The four pillars that hold it',body:'Realignment is not a mood. It stands on four things, and when one is missing the whole thing wobbles.'},
 {t:'pillars',kicker:'High performance, the four pillars',h:'What the next version stands on',pillars:[
   {h:'Alignment',p:'The business, the calendar, and the founder all point the same way.'},
   {h:'Feminine Essence',p:'Leading from alignment and rest, not hustle, so capacity grows instead of burns.'},
   {h:'Self Love',p:'You stop being the first resource the company spends and the last it protects.'},
   {h:'Boundaries',p:'Clear lines that let you delegate the real work and keep your energy whole.'}]},
 {t:'part',kicker:'Part three',h:'Life on your own timeline',body:'When the four pillars hold, the quarter gets planned differently.'},
 {t:'body',kicker:'The Iconic Quarter',h:'A calendar with white space in it',body:'You map the next ninety days from legacy down to the week, not from your inbox up. The business runs on your timeline. There is room in the calendar on purpose, and it stays there.'},
 {t:'body',kicker:'Why me',h:'I built it, then I rebuilt myself',body:'I scaled and exited my own self-funded, multi-seven-figure firm over fifteen years. I host The Vixen Voice podcast and guide the Legacy Vixen Collective, a year-long room of founders doing exactly this work. The method is not theory, it is the path I walked out on.'},
 {t:'cta',kicker:'Your next right step',h:'Start with a Whisper Call',body:'A quiet conversation about what you are being called toward and your next right step. If it is a fit, we map your realignment inside High Performance Coaching.',cta:'Begin at vixengathering.com',disclaimer:'This masterclass is educational. It is not financial, legal, or medical advice, and it is not a guarantee of income or results. Outcomes vary and depend on your own business, effort, and circumstances.'}
];
const deck=document.getElementById('deck');
function esc(x){return x||''}
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let inner='';
  if(s.kicker)inner+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){inner+=`<h1>${s.h}</h1><div class="sub">${s.sub}</div><div class="by">${s.by}</div>`;}
  else if(s.t==='reframe'){inner+=`<div class="big">${s.big}</div>`;}
  else if(s.t==='step'){inner+=`<div class="step">${s.n}</div><h2>${s.h}</h2><p class="lead">${s.body}</p>`;}
  else if(s.t==='pillars'){inner+=`<h2>${s.h}</h2><div class="pillars">`+s.pillars.map(p=>`<div class="pillar"><h3>${p.h}</h3><p>${p.p}</p></div>`).join('')+`</div>`;}
  else if(s.t==='who'){inner+=`<h2>${s.h}</h2><ul>`+s.list.map(x=>`<li>${x}</li>`).join('')+`</ul>`;}
  else if(s.t==='cta'){inner+=`<h2>${s.h}</h2><p class="lead">${s.body}</p><div class="cta-box"><p class="lead" style="color:var(--ink)">${s.cta}</p></div><div class="disclaimer">${s.disclaimer}</div>`;}
  else{inner+=`${s.h?`<h2>${s.h}</h2>`:''}${s.body?`<p class="lead">${s.body}</p>`:''}`;}
  inner+=`<div class="pagenum">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=inner;deck.appendChild(el);
});
</script>
</body>
</html>
