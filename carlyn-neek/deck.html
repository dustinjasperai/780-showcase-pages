<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Thrive Without the Hustle · Carlyn Neek, OT · Balance Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f0e8; --panel:#ece3d6; --rule:#dccfc0;
    --acc:#fe6060; --ink:#0a425a; --body:#45535d; --dim:#8a94a0; --cream:#eef4f6;
  }
  html,body{height:100%}
  body{background:#e7ddcd;font-family:'Montserrat',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e7ddcd}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Raleway',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:94%;font-weight:700}
  .t-normal h1{font-size:3.25vw;max-width:90%;font-weight:600}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Raleway',serif;font-size:1.95vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:600}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#0a2e3d 0%,#06202c 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream);font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#0a2e3d 0%,#06202c 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Montserrat',sans-serif;color:#cfe0e6;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:7.5%;bottom:9%;width:16vw;opacity:.9}
  .corner-mo{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(10,66,90,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Balance Works</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- breath motif: concentric calming rings, drawn in coral -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <g fill="none" stroke="#fe6060" stroke-width="2" stroke-linecap="round">
    <circle cx="60" cy="60" r="10" fill="#fe6060" stroke="none" opacity="0.85"/>
    <circle cx="60" cy="60" r="24" opacity="0.6"/>
    <circle cx="60" cy="60" r="38" opacity="0.4"/>
    <circle cx="60" cy="60" r="52" opacity="0.22"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Thrive Without the Hustle',sub:'How occupational therapy practice owners use the tools they already know to build a practice that serves their life, instead of the other way around.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You spend your days helping people regulate. You have just never turned any of it on yourself.',body:'You trained for years to help clients find balance, calm a nervous system, and reconnect with what matters. Then you built a practice, and somewhere along the way you stopped applying a single bit of it to your own days. This hour is about pointing your own expertise back at you.'},
 {t:'dark',title:'An empty tank is not a character flaw. It is a stage you can name and move out of.'},

 {t:'section',idx:'Part One',title:'How Caring OTs Burn Out Without Noticing'},
 {t:'normal',k:'The default to yes',title:'You said yes for years, and the practice quietly filled with everyone else&#39;s priorities.',body:'Every extra client, every after-hours note, every favour felt like the right thing in the moment. Added together over years, they became a practice shaped entirely around other people, with no room left for the person running it. Overwork rarely arrives as a decision. It accumulates.'},
 {t:'normal',k:'The 12 phases of burnout',title:'Burnout is not one bad week. It moves through phases, and most owners treat phase nine with phase two advice.',body:'When you can see the actual progression, from over-committing and neglecting your own needs all the way to exhaustion and disconnection, you stop reaching for a generic fix. You locate where you truly are first. The right next move is completely different at the start of the slide than it is near the bottom.'},
 {t:'dark',title:'You cannot out-hustle a nervous system that is asking you to stop.'},

 {t:'section',idx:'Part Two',title:'The ACTivate Vitality Method'},
 {t:'normal',k:'Pillar one, evidence-based methods',title:'The same ACT you use with clients, pointed at your own practice.',body:'Acceptance and Commitment Therapy is already in your toolkit. Turned inward, it becomes the way you regulate your own nervous system and work with perfectionism, fear, and overwhelm, using frameworks you already trust because you teach them every day.'},
 {t:'normal',k:'The six moves you already teach',title:'Mindfulness, defusion, acceptance, values, committed action, and self-compassion.',body:'Present-moment awareness to quiet the rumination. Unhooking from the thought that says you are behind. Making room for hard feelings instead of white-knuckling them. Naming what you actually value, then taking deliberate action toward it, and meeting yourself with the same kindness you offer every client.'},
 {t:'normal',k:'Pillar two, co-regulation',title:'You were never meant to regulate alone, and neither is your business.',body:'Guided support inside a safe container does something willpower cannot. Working through the hard parts alongside people who understand the exact pressures of owning a practice is how the change actually holds, rather than becoming one more thing you were supposed to fix by yourself.'},
 {t:'normal',k:'Pillar three, connected community',title:'A room of OT owners who genuinely get it changes what feels possible.',body:'Isolation convinces you that the strain is yours alone and probably your fault. A community of fellow owners sharing honest experience and collective wisdom replaces that story with perspective, and with the quiet relief of realising you are not the only one.'},
 {t:'dark',title:'You do not need to work more. You need to work in line with what you actually value.'},

 {t:'section',idx:'Part Three',title:'What a Values-Aligned Practice Looks Like'},
 {t:'normal',k:'Boundaries that hold',title:'Boundaries built from your values hold in a way that boundaries built from guilt never do.',body:'When a limit is anchored to something you genuinely care about, keeping it stops feeling like letting people down and starts feeling like integrity. That is the difference between a boundary you announce and abandon and one you can actually live inside, even after decades of defaulting to yes.'},
 {t:'normal',k:'A caseload that fits your life',title:'The goal was never a bigger practice. It was a practice that fits the life you want.',body:'When your days are built around what you value, the practice stops competing with your life and starts supporting it. You can still be excellent for your clients. You simply stop paying for it with the parts of your life you never meant to trade away.'},
 {t:'dark',title:'Thriving without the hustle is not doing less. It is doing what matters, on purpose.'},

 {t:'normal',k:'Why Carlyn Neek',title:'An OT since 2003, in private practice since 2007, now guiding fellow owners.',body:'Carlyn is a mental-health occupational therapist and Certified Coach Practitioner who has run her own private practice in Alberta for well over a decade. She built ACTivate Vitality and hosts the BRAVE OT Podcast because she lived the pattern first, and found her way back out through the very methods she now teaches.'},

 {t:'section',idx:'Your Next Step',title:'Build a Practice That Gives Back'},
 {t:'normal',k:'Keep going with Carlyn',title:'ACTivate Vitality walks you through the whole method, at your own pace, with people who get it.',body:'Self-paced modules, live mastermind calls, a private community of OT owners, and the tools to apply occupational balance to your own days. Start with the free Banish Burnout mini book and the BRAVE OT Podcast, and go deeper when you are ready.'},
 {t:'cta',title:'Ready to thrive without the hustle?',body:'Book a clarity call with Carlyn to see whether ACTivate Vitality is your next step. No pressure, no obligation.',chips:['Book a clarity call','Start with the free mini book'],disc:'Educational content for occupational therapists and practice owners. No income, caseload, or wellbeing result is guaranteed. Results vary by practitioner, practice, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Balance Works · ACTivate <b>Vitality</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='title') h+=mo('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
