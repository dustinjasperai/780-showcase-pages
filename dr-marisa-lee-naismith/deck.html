<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Take Centre Stage | A masterclass with Dr Marisa Lee Naismith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fcfcfb;
    --panel:#111131;
    --accent:#25afb4;
    --ink:#1c2230;
    --ink-soft:#44506a;
    --rule:#e4e6ea;
    --head:'Roboto Slab',Georgia,serif;
    --body:'Libre Franklin',-apple-system,sans-serif;
  }
  html,body{height:100%}
  body{background:var(--panel);font-family:var(--body);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(960px,94vw);aspect-ratio:16/9;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);border-radius:6px}
  .slide{position:absolute;inset:0;padding:64px 72px;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:54px;line-height:1.08;color:var(--panel);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.14;color:var(--panel)}
  .sub{font-size:21px;color:var(--ink-soft);margin-top:20px;max-width:40ch}
  .lead{font-size:26px;color:var(--ink);margin-top:14px;max-width:44ch;line-height:1.4}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:14px;max-width:46ch}
  li{font-size:20px;color:var(--ink-soft);padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:2px;background:var(--accent)}
  .big{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.12;color:var(--panel);max-width:22ch}
  .part .n{font-family:var(--head);font-size:120px;font-weight:700;color:var(--accent);opacity:.18;line-height:1}
  .part h2{margin-top:-30px}
  .pill{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;border:1px solid var(--accent);border-radius:999px;padding:5px 14px;margin-bottom:20px;width:max-content}
  .dark{background:var(--panel)}
  .dark .kick{color:var(--accent)}
  .dark h1,.dark h2,.dark .big{color:#fff}
  .dark .sub,.dark .lead,.dark li{color:#c9cfdd}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:22px}
  .two .box{border-top:2px solid var(--accent);padding-top:14px}
  .two .box h3{font-family:var(--head);font-size:17px;color:var(--panel);margin-bottom:8px;letter-spacing:.02em}
  .two .box p{font-size:17px;color:var(--ink-soft);line-height:1.45}
  .disc{font-size:14px;color:var(--ink-soft);margin-top:22px;max-width:52ch;font-style:italic}
  .cta .big{color:var(--panel)}
  #nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;font-family:var(--body);font-size:13px;color:#aab2c4}
  #nav button{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:6px;width:38px;height:34px;font-size:16px;cursor:pointer}
  #nav button:hover{background:var(--accent)}
  .foot{position:absolute;bottom:26px;left:72px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9aa3b5}
  .dark .foot{color:#6f7a90}
  @media(max-width:640px){.slide{padding:34px 30px}h1{font-size:32px}h2{font-size:26px}.big{font-size:30px}.sub{font-size:16px}.lead{font-size:18px}li{font-size:15px}.part .n{font-size:70px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev" aria-label="previous">&#8249;</button><span id="count"></span><button id="next" aria-label="next">&#8250;</button></div>
<script>
const S = [
  {t:'title', dark:true, kick:'A live masterclass with Dr Marisa Lee Naismith',
    h:'Take Centre Stage', sub:'The whole-person method for performers who freeze, doubt, and play small.'},
  {t:'who', kick:'Who this is for',
    h:'You can do the work. Until people are watching.',
    bullets:['Singers who sound free in the practice room and tighten up the moment it matters','Performers and creatives who talk themselves out of the audition, the release, the stage','Anyone who has been told to just drill more technique, and knows that is not the real problem']},
  {t:'hook', dark:true, kick:'The reframe',
    big:'Your technique is not the thing holding you back.'},
  {t:'part', n:'01', h:'The real problem'},
  {t:'content', kick:'What actually keeps performers small',
    h:'It lives above the neck, not in the voice',
    bullets:['Self-doubt that reads every room as a verdict','The imposter feeling that says you have not earned the stage','Procrastination dressed up as getting ready','Playing small so you never risk being seen']},
  {t:'content', kick:'The cost of staying there',
    h:'The quiet price of waiting to feel ready',
    bullets:['The audition you did not take','The song that never left the voice memo','The career that stalled while the talent kept growing']},
  {t:'hook', dark:true, kick:'A different starting point',
    big:'Your whole body is your instrument. It echoes how you feel physically, mentally, and emotionally.'},
  {t:'part', n:'02', h:'The method'},
  {t:'content', kick:'A Voice and Beyond',
    h:'The whole-person performance method',
    sub:'Not a pep talk and not pure vocal drill. Six shifts that train the performer, not just the voice.'},
  {t:'pillar', pill:'Shift one', h:'The body as instrument',
    lead:'Regulate the nervous system first. A calm body is what lets the trained voice actually show up under pressure.'},
  {t:'pillar', pill:'Shift two', h:'Quiet the inner critic',
    lead:'Separate the fear from the fact. The critic is loud, but it is not information about your talent.'},
  {t:'pillar', pill:'Shift three', h:'Perform from truth',
    lead:'Audiences connect to honesty, not perfection. Authentic expression beats a flawless, guarded performance every time.'},
  {t:'pillar', pill:'Shift four', h:'Clarity of purpose',
    lead:'Know what you are building and why. Direction turns scattered effort into a career that compounds.'},
  {t:'pillar', pill:'Shift five', h:'Sustainable energy',
    lead:'Pace the voice and the self. A performing life is a long game, and burnout is not a badge.'},
  {t:'pillar', pill:'Shift six', h:'Be seen',
    lead:'Visibility is a skill, not luck. Put the work in front of the people who are looking for it.'},
  {t:'part', n:'03', h:'The twelve-week arc'},
  {t:'content', kick:'The arc over twelve weeks',
    h:'From playing small to centre stage',
    bullets:['Weeks 1 to 4: steady the body, name and quiet the critic','Weeks 5 to 8: find the truthful voice and the clear purpose','Weeks 9 to 12: pace the energy and step into the room on purpose']},
  {t:'change', kick:'The shift this creates',
    h:'What changes',
    before:'Freezes when watched. Waits to feel ready. Measures every room as a verdict and shrinks.',
    after:'Walks on prepared, not fearless. Performs from truth. Takes the stage, the audition, the release.'},
  {t:'why', dark:true, kick:'Why learn this from Marisa',
    h:'A voice researcher who has lived the stage',
    bullets:['PhD in the training of singers across contemporary commercial music styles','45 years in the industry; teaches on the Bachelor of Music at Queensland Conservatorium','Author of Singing Contemporary Commercial Music Styles: A Pedagogical Framework','Host of A Voice and Beyond, 1,000,000+ downloads across 100+ countries']},
  {t:'cta', kick:'Your next step',
    big:'Ready to take centre stage?',
    sub:'Book a discovery call for Creative Edge Coaching and map your next twelve weeks with Dr Marisa Lee Naismith.',
    disc:'This masterclass is educational. No specific result is guaranteed. Results vary with each performer, their effort, and their circumstances.'}
];

const stage = document.getElementById('stage');
function esc(x){return (x||'')}
function render(sl){
  let c = '';
  const foot = '<div class="foot">Take Centre Stage</div>';
  if(sl.t==='title'){
    c = `<div class="kick">${esc(sl.kick)}</div><h1>${esc(sl.h)}</h1><div class="sub">${esc(sl.sub)}</div>`;
  } else if(sl.t==='hook'){
    c = `<div class="kick">${esc(sl.kick)}</div><div class="big">${esc(sl.big)}</div>`;
  } else if(sl.t==='part'){
    c = `<div class="part"><div class="n">${esc(sl.n)}</div><h2>${esc(sl.h)}</h2></div>`;
  } else if(sl.t==='pillar'){
    c = `<div class="pill">${esc(sl.pill)}</div><h2>${esc(sl.h)}</h2><div class="lead">${esc(sl.lead)}</div>`;
  } else if(sl.t==='change'){
    c = `<div class="kick">${esc(sl.kick)}</div><h2>${esc(sl.h)}</h2><div class="two"><div class="box"><h3>Before</h3><p>${esc(sl.before)}</p></div><div class="box"><h3>After</h3><p>${esc(sl.after)}</p></div></div>`;
  } else if(sl.t==='cta'){
    c = `<div class="kick">${esc(sl.kick)}</div><div class="big">${esc(sl.big)}</div><div class="sub">${esc(sl.sub)}</div><div class="disc">${esc(sl.disc)}</div>`;
  } else {
    c = `<div class="kick">${esc(sl.kick)}</div><h2>${esc(sl.h)}</h2>`;
    if(sl.sub) c += `<div class="sub">${esc(sl.sub)}</div>`;
    if(sl.bullets) c += '<ul>'+sl.bullets.map(b=>`<li>${esc(b)}</li>`).join('')+'</ul>';
  }
  return `<div class="slide ${sl.dark?'dark':''} ${sl.t}">${c}${foot}</div>`;
}
stage.innerHTML = S.map(render).join('');
const slides = [...document.querySelectorAll('.slide')];
let i = 0;
const count = document.getElementById('count');
function show(n){ i = Math.max(0, Math.min(slides.length-1, n)); slides.forEach((s,k)=>s.classList.toggle('on', k===i)); count.textContent = (i+1)+' / '+slides.length; }
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
show(0);
</script>
</body>
</html>
