<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Paid Diagnostic Review | Ask A Bookkeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7f3;        /* light ground - brand site_scheme is light (#f4f4f4) */
    --panel:#ffffff;
    --rule:#e4e4dd;
    --ink:#222222;        /* brand text #222/#333 */
    --muted:#555555;
    --accent:#2227f0;     /* brand primary button blue rgba(34,39,240) */
    --teal:#37eccb;       /* brand teal, used sparingly */
    --display:'Outfit','Inter',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 26px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:22px}
  .kicker.teal{color:#13a88f}
  h1{font-family:var(--display);font-weight:600;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.08;letter-spacing:-.01em}
  .lede{font-size:22px;line-height:1.5;color:var(--muted);margin-top:24px;max-width:44ch}
  .big{font-family:var(--display);font-weight:500;font-size:34px;line-height:1.22;max-width:30ch}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);margin-top:18px;max-width:54ch}
  .rows{margin-top:30px;border-top:2px solid var(--ink)}
  .row{display:flex;gap:22px;align-items:baseline;padding:16px 2px;border-bottom:1px solid var(--rule)}
  .row .n{font-family:var(--display);font-weight:600;font-size:20px;color:var(--accent);min-width:38px}
  .row .rt{font-size:19px;line-height:1.5}
  .row .rt b{font-weight:600}
  .row .rt span{color:var(--muted);display:block;font-size:16px;margin-top:3px}
  .pillar .num{font-family:var(--display);font-size:22px;color:var(--accent);font-weight:600;letter-spacing:.04em}
  .pillar h2{margin-top:10px}
  .pillar p{font-size:20px;line-height:1.58;color:var(--ink);margin-top:20px;max-width:50ch}
  .pillar .tag{display:inline-block;margin-top:26px;font-size:14px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);
    border-radius:999px;padding:7px 14px}
  .accentbar{height:5px;width:64px;background:var(--accent);border-radius:3px;margin-bottom:28px}
  .accentbar.teal{background:var(--teal)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}
  .card{border:1px solid var(--rule);border-radius:10px;padding:22px 24px;background:#fbfbf8}
  .card .ct{font-weight:600;font-size:18px}
  .card .cb{color:var(--muted);font-size:16px;line-height:1.5;margin-top:8px}
  .why li{list-style:none;font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;max-width:52ch}
  .why li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;
    background:var(--teal);border-radius:3px}
  .cta h1{font-size:50px}
  .cta .step{font-size:22px;line-height:1.5;color:var(--ink);margin-top:24px;max-width:46ch}
  .cta .join{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;
    font-weight:600;font-size:19px;padding:16px 30px;border-radius:10px;text-decoration:none}
  .disclaimer{font-size:13px;color:var(--muted);line-height:1.5;margin-top:34px;max-width:62ch;border-top:1px solid var(--rule);padding-top:18px}
  .foot{position:absolute;bottom:22px;left:60px;font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;color:#9a9a92}
  .pagenum{position:absolute;bottom:22px;right:60px;font-size:13px;color:#b7b7af;font-family:var(--display)}
  @media(max-width:640px){.slide{padding:38px 26px}h1{font-size:40px}h2{font-size:30px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:'A live masterclass from Ask A Bookkeeper',
    h1:'The Paid Diagnostic Review',
    lede:'How to charge to look at a prospect’s books, then turn what you find into a right-priced proposal they say yes to.' },

  {t:'agenda',
    kicker:'Who this is for',
    h2:'If you quote before you’ve seen the books, this is for you',
    rows:[
      { n:'01', b:'Bookkeepers who win work, then discover the mess', s:'The cleanup you did not price for eats the whole engagement.' },
      { n:'02', b:'Anyone quoting a monthly rate off a 20-minute call', s:'You are guessing, and the guess is usually too low.' },
      { n:'03', b:'Firm owners tired of racing competitors to the cheapest number', s:'Price should follow the books, not the other way around.' } ] },

  {t:'statement',
    kicker:'The trap',
    big:'You give away the hardest part of your job for free: the assessment. Then you price what you have not actually looked at.' },

  {t:'statement',
    kicker:'The reframe',
    big:'Your rates are not the problem. You are pricing blind. The fix is to get paid to look first.',
    body:'Every underpriced, scope-creeping client starts the same way: a number quoted before anyone opened the file. Change the order and you change the outcome.' },

  {t:'part', num:'Part One', h2:'Why the free quote loses money', sub:'The real cost of pricing before you look.' },

  {t:'rows2',
    kicker:'What blind quoting hides',
    h2:'The books you have not seen are full of surprises',
    rows:[
      { n:'·', b:'Hidden cleanup', s:'Months of uncategorized transactions and unreconciled accounts you now own at the quoted rate.' },
      { n:'·', b:'Scope you never agreed to', s:'Payroll, sales tax, multiple entities, catch-up years. None of it was in the number.' },
      { n:'·', b:'Scope creep with no anchor', s:'Nothing in writing says where the work ends, so it never does.' },
      { n:'·', b:'The race to the bottom', s:'With no diagnosis to point to, the only thing left to compete on is price.' } ] },

  {t:'statement',
    kicker:'The core problem',
    big:'A quote is a promise about work nobody has inspected. The diagnostic review is the inspection that makes the promise honest.' },

  {t:'part', num:'Part Two', h2:'The Diagnostic Review and Proposal Method', sub:'The four moves, in order.' },

  {t:'pillar', num:'Move One', tag:'Get paid to look',
    h2:'Charge for the diagnostic review',
    p:'Before any proposal, you run a paid review of the prospect’s actual books. Charging for it does two things at once: it filters out tire-kickers, and it means the deep work of assessing the file is already compensated instead of given away.' },

  {t:'pillar', num:'Move Two', tag:'Read the file',
    h2:'Turn the books into findings',
    p:'The review is where you see what is really there: the state of the accounts, the cleanup required, the volume, the complexity, the risk. You come out with a concrete list of findings, not an impression. Those findings are the evidence your proposal is built on.' },

  {t:'pillar', num:'Move Three', tag:'Findings become scope',
    h2:'Convert findings into a proposal',
    p:'Each finding maps to a service and a boundary. Catch-up work, ongoing monthly, the one-time cleanup, what is included and what is not. The proposal writes itself from the review, which is why it reads as a diagnosis the prospect trusts rather than a number they haggle.' },

  {t:'pillar', num:'Move Four', tag:'Price it the same way every time',
    h2:'Price consistently with the calculator',
    p:'The Diagnostic Review Calculator turns the findings into a repeatable price for both one-off projects and recurring monthly services. Same inputs, same logic, every time. No more quoting one client high and the next one low because you were tired or eager.' },

  {t:'part', num:'Part Three', h2:'A week with the review out front', sub:'From first call to signed proposal.' },

  {t:'rows2',
    kicker:'The new order of operations',
    h2:'One week, start to signed',
    rows:[
      { n:'01', b:'Discovery call, then book the paid review', s:'You are not quoting on this call. You are scoping the review.' },
      { n:'02', b:'Run the diagnostic on the real books', s:'Document every finding as you go.' },
      { n:'03', b:'Build the proposal straight from the findings', s:'Scope, boundaries, and price all trace back to something you saw.' },
      { n:'04', b:'Present it as a diagnosis', s:'You are explaining what the books told you, not defending a guess.' } ] },

  {t:'statement',
    kicker:'The shift',
    big:'You stop being a bookkeeper who quotes. You become the one who diagnoses. That is the person clients stop price-shopping.' },

  {t:'why',
    kicker:'Why learn it here',
    h2:'Built by bookkeepers, for bookkeepers',
    items:[
      'Ask A Bookkeeper was started by Corry, who began bookkeeping at 14 and knows how overwhelming it is without support.',
      'Weekly live Zoom calls that work through the real questions members bring, all recorded and catalogued.',
      'Discounted one-on-one access to experienced bookkeeping accountants when a file has you stuck.',
      'A room where you can ask anything, without judgement, whether you are years in or just starting out.' ] },

  {t:'agenda',
    kicker:'Who thrives with this',
    h2:'This is for the bookkeeper ready to lead the engagement',
    rows:[
      { n:'01', b:'You want to stop under-quoting and owning the cleanup', s:'The review prices the mess before you agree to it.' },
      { n:'02', b:'You want proposals that close without haggling', s:'A diagnosis is harder to argue with than a number.' },
      { n:'03', b:'You want one pricing method you trust', s:'The calculator makes every quote consistent.' } ] },

  {t:'statement',
    kicker:'In one line',
    big:'Get paid to look. Turn the books into findings. Turn findings into a proposal. Price it the same way every time.' },

  {t:'cta',
    kicker:'Your next step',
    h1:'Keep learning the method with us',
    step:'The full Diagnostic Review and Proposal walk-through, the calculator, and the weekly live calls all live inside the Ask A Bookkeeper community. Come ask anything, without judgement.',
    btn:'Join the community for $20/month',
    disclaimer:'This masterclass is for educational purposes only. No specific income or result is guaranteed. Results vary based on your own market, clients, experience, and effort. Nothing here is accounting, tax, or legal advice for your specific situation.' }
];

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const sl = el('div','slide '+(s.t==='cta'?'cta':''));
  if(s.kicker) sl.appendChild(el('div','kicker'+(s.t==='why'?' teal':''), s.kicker));
  if(s.t==='title'){ sl.appendChild(el('div','accentbar')); sl.appendChild(el('h1',null,s.h1)); if(s.lede)sl.appendChild(el('p','lede',s.lede)); }
  else if(s.t==='statement'){ sl.appendChild(el('div','big',s.big)); if(s.body)sl.appendChild(el('p','body',s.body)); }
  else if(s.t==='part'){ sl.appendChild(el('div','accentbar teal')); sl.appendChild(el('div','kicker teal', s.num)); sl.appendChild(el('h2',null,s.h2)); if(s.sub)sl.appendChild(el('p','lede',s.sub)); }
  else if(s.t==='agenda' || s.t==='rows2'){
    sl.appendChild(el('h2',null,s.h2));
    const rs=el('div','rows');
    s.rows.forEach(r=>{ const row=el('div','row'); row.appendChild(el('div','n',r.n)); const rt=el('div','rt','<b>'+r.b+'</b>'+(r.s?'<span>'+r.s+'</span>':'')); row.appendChild(rt); rs.appendChild(row); });
    sl.appendChild(rs);
  }
  else if(s.t==='pillar'){ const p=el('div','pillar'); p.appendChild(el('div','num',s.num)); p.appendChild(el('h2',null,s.h2)); p.appendChild(el('p',null,s.p)); if(s.tag)p.appendChild(el('span','tag',s.tag)); sl.appendChild(p); }
  else if(s.t==='why'){ sl.appendChild(el('h2',null,s.h2)); const ul=el('ul','why'); s.items.forEach(it=>ul.appendChild(el('li',null,it))); sl.appendChild(ul); }
  else if(s.t==='cta'){ sl.appendChild(el('div','accentbar')); sl.appendChild(el('h1',null,s.h1)); sl.appendChild(el('p','step',s.step)); sl.appendChild(el('a','join','#')).textContent=s.btn; sl.appendChild(el('div','disclaimer',s.disclaimer)); }
  sl.appendChild(el('div','foot','Ask A Bookkeeper'));
  sl.appendChild(el('div','pagenum', String(i+1).padStart(2,'0')));
  deck.appendChild(sl);
});
</script>
</body>
</html>
