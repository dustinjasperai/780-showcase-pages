<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Become a Fractional CMO — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f8;
    --panel:#ffffff;
    --ink:#141922;
    --muted:#5a6572;
    --accent:#00416b;
    --accent2:#1e73be;
    --rule:#d3dce6;
    --sans:'DM Sans',system-ui,sans-serif;
    --serif:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif)}
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:26px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(20,25,34,.04)}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent2);margin:0 0 18px}
  h1{font-family:var(--sans);font-weight:700;font-size:46px;line-height:1.08;margin:0 0 20px;color:var(--ink)}
  h2{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1.12;margin:0 0 18px;color:var(--ink)}
  .lead{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 10px}
  p{font-size:20px;line-height:1.6;margin:0 0 14px}
  .num{font-family:var(--sans);font-weight:700;font-size:15px;color:var(--accent);
    border:2px solid var(--accent);border-radius:999px;width:40px;height:40px;display:flex;
    align-items:center;justify-content:center;margin-bottom:18px}
  .rule{height:3px;width:64px;background:var(--accent);border:0;margin:0 0 22px}
  ul{margin:8px 0 0;padding-left:0;list-style:none}
  li{font-size:20px;line-height:1.5;padding:12px 0;border-top:1px solid var(--rule)}
  li:first-child{border-top:0}
  li b{font-family:var(--sans)}
  .title-slide{background:var(--accent);color:#fff;border-color:var(--accent)}
  .title-slide h1,.title-slide .lead{color:#fff}
  .title-slide .eyebrow{color:#aaccea}
  .cta-slide{border:2px solid var(--accent)}
  .disclaimer{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:26px;line-height:1.5}
  .who{font-family:var(--sans);font-size:16px;color:var(--accent);font-weight:500}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass with Casey Stanton', h:'How to Become a Fractional CMO',
   lead:'Attract, convert and serve high-paying clients on your terms, without becoming the highest-paid doer in the room.'},

  {t:'who', eyebrow:'Who this is for',
   h:'You can already do the work. The question is who pays you like a leader.',
   body:'This is for experienced marketers, consultants and agency owners who are ready to trade billable hours and someone else’s roadmap for an independent practice built on strategy.'},

  {t:'point', eyebrow:'The trap', num:'1',
   h:'Going independent is easy. Staying out of execution is not.',
   body:'Most marketers who go solo recreate their old job at a higher hourly rate. They write the copy, build the funnels and become the “everything person.” The income has a ceiling and so does the calendar.'},

  {t:'reframe', eyebrow:'The reframe',
   h:'Clients do not pay an executive to do tasks. They pay for judgment.',
   body:'A fractional CMO is hired for strategy and leadership. The moment you are valued for your thinking instead of your hours, the price goes up and the hours come down.'},

  {t:'point', eyebrow:'Part one: the core problem', num:'2',
   h:'Tactics are a commodity. Strategy is not.',
   body:'When you sell tactics, you compete with every freelancer and every tool. When you sell a repeatable way to decide what a business should do next, you are the only one in the room who can do it.'},

  {t:'section', eyebrow:'Part two: the method',
   h:'The Functional Marketing® Framework',
   lead:'The one deliverable that makes a fractional CMO worth an executive retainer. A systematized, predictable way to lead marketing instead of guessing at it.'},

  {t:'point', eyebrow:'Functional Marketing, step one', num:'3',
   h:'Diagnose the past before you touch the future.',
   body:'What happened in this business already? What campaigns worked, what did not, and why? You abandon tactic-chasing by starting from evidence, not opinions.'},

  {t:'point', eyebrow:'Functional Marketing, step two', num:'4',
   h:'Inventory the assets they already own.',
   body:'The list, the offers, the reputation, the team. Most businesses are sitting on leverage they never use. Naming it is half the strategy.'},

  {t:'point', eyebrow:'Functional Marketing, step three', num:'5',
   h:'Build the strategy, then assign the tactics.',
   body:'Strategy first, execution second, and never the two confused. This is what turns a marketer into a marketing leader a company will pay monthly to keep.'},

  {t:'section', eyebrow:'The practice system',
   h:'Attract. Convert. Serve.',
   lead:'The Fractional CMO Method: how you build the practice around the framework.'},

  {t:'point', eyebrow:'Attract', num:'A',
   h:'Attract clients with big problems you can solve.',
   body:'You do not chase cheap work. You build a reputation for solving the expensive problems, so the right businesses come to you already pre-sold on paying for leadership.'},

  {t:'point', eyebrow:'Convert', num:'C',
   h:'Convert as a trusted advisor, not a pushy seller.',
   body:'No icky tactics. You diagnose the real need, show you can solve it, and let the strategy sell itself. The sale is just the first act of the engagement.'},

  {t:'point', eyebrow:'Serve', num:'S',
   h:'Serve at the strategic level and stay elevated.',
   body:'You lead. You do not become the copywriter, the funnel builder and the everything-person all over again. Staying elevated is what lets you hold several clients at once.'},

  {t:'point', eyebrow:'The mechanism', num:'6',
   h:'The Delegation Filter keeps you out of the weeds.',
   body:'A simple filter for what you delegate and how, so a client’s team does the execution and gets better at solving problems while you stay on strategy. This is what protects the 30-hour week.'},

  {t:'who', eyebrow:'Part three: what it looks like',
   h:'A full practice is a surprisingly small number of clients.',
   body:'The model behind the method is three to five clients at executive retainers. One strong engagement can cover a meaningful part of your year. This is the model, not a promise. What you earn depends on you.'},

  {t:'who', eyebrow:'Why listen to me',
   h:'I built this the hard way, then wrote the system down.',
   body:'I am Casey Stanton, founder of CMOx and author of the Wall Street Journal number one bestseller The Fractional CMO Method. I have helped train hundreds of fractional CMOs using the exact framework in this session.'},

  {t:'who', eyebrow:'Is this you?',
   h:'Who this works for, and who it does not.',
   body:'It works for marketers with real experience who want to lead and are ready to build a practice. It is not a get-rich scheme and it is not for people who want to stay in pure execution.'},

  {t:'cta', eyebrow:'Your next step',
   h:'Ready to build your fractional CMO practice?',
   body:'If today was useful, the next step is to apply to the CMOx Accelerator and build this with a community of fractional CMOs and the full framework behind you.',
   action:'Apply to the CMOx Accelerator at cmox.co',
   disclaimer:'This masterclass is educational and is not financial, legal or business advice. No income or result is guaranteed. Results vary and depend on your own effort, experience and market.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta-slide':'');
  let html = '';
  if (s.eyebrow) html += '<p class="eyebrow">'+s.eyebrow+'</p>';
  if (s.num) html += '<div class="num">'+s.num+'</div>';
  if (s.t!=='title' && s.t!=='section' && s.rule!==false && !s.num) html += '<hr class="rule">';
  if (s.h) html += (s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if (s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if (s.body) html += '<p>'+s.body+'</p>';
  if (s.action) html += '<p class="who">'+s.action+'</p>';
  if (s.disclaimer) html += '<p class="disclaimer">'+s.disclaimer+'</p>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
