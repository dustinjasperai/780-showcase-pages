<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Two-Person Agency | Agency Launch | Matt Dietz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&family=Roboto+Slab:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9eff7; --panel:#fdfeff; --rule:#d2dcea;
    --ink:#1b2a3f; --muted:#5a6b82;
    --brand:#00468c; --accent:#e01832;
    --display:'Raleway',system-ui,sans-serif;
    --slab:'Roboto Slab',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--slab);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .eyebrow{font-family:var(--slab);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--brand);margin-bottom:18px}
  .slide h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:18px}
  .slide h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.14;
    margin-bottom:16px}
  .slide p{font-size:19px;color:var(--ink);max-width:40ch;margin-bottom:12px}
  .slide p.lead{font-size:22px;color:var(--muted);max-width:46ch}
  .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.12;max-width:22ch}
  .part{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent)}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative;max-width:48ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:3px;background:var(--brand)}
  .num{font-family:var(--display);font-weight:800;color:var(--brand);font-size:17px;margin-right:10px}
  .tag{display:inline-block;font-family:var(--slab);font-weight:600;font-size:13px;color:var(--brand);
    border:1px solid var(--rule);border-radius:999px;padding:5px 14px;margin-bottom:22px}
  .rule{width:64px;height:4px;background:var(--accent);border-radius:3px;margin:8px 0 22px}
  .cta{background:var(--brand);color:#fff;border-color:var(--brand)}
  .cta .eyebrow,.cta h1{color:#fff}
  .cta p{color:#e8eef6}
  .btn{display:inline-block;background:var(--accent);color:#fff;font-family:var(--display);
    font-weight:700;font-size:18px;padding:14px 26px;border-radius:10px;margin-top:18px}
  .foot{font-size:13px;color:var(--muted);margin-top:30px;max-width:60ch;line-height:1.45}
  .cta .foot{color:#b9c6d8}
  .brandmark{position:absolute;top:26px;right:34px;font-family:var(--display);font-weight:800;
    font-size:15px;letter-spacing:.04em;color:var(--brand)}
  .cta .brandmark{color:#fff}
  .quote{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.15;max-width:24ch}
  .kpi{font-family:var(--display);font-weight:800;font-size:72px;color:var(--brand);line-height:1}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', brand:'AGENCY LAUNCH', eyebrow:'A live masterclass with Matt Dietz',
   h1:'The Two-Person Agency',
   lead:'How to write more policies every month without buying a single lead.'},

  {t:'who', brand:'AGENCY LAUNCH', eyebrow:'Who this is for',
   h2:'Agency owners and independent agents who are done with the lead treadmill',
   p:'You can write business. You are good at it. What is draining you is paying more every month to rent leads that stop the moment the card stops.'},

  {t:'trap', brand:'AGENCY LAUNCH', part:'Part One', eyebrow:'The core problem',
   h2:'You were told growth means more leads, which means a bigger bill every month',
   p:'So production becomes a meter. The bill climbs, the close rate does not, and the agency never actually gets lighter.'},

  {t:'reframe', brand:'AGENCY LAUNCH', eyebrow:'The reframe',
   quote:'You do not rise to the level of your goals. You fall to the level of your systems.',
   p:'Goals do not write policies. Systems do. This masterclass is about the systems.'},

  {t:'prob', brand:'AGENCY LAUNCH', part:'Part One', eyebrow:'Why the treadmill never ends',
   h2:'Rented pipeline is a cost, not an asset',
   items:['You never own the lead source, so you can never switch it off',
          'The price of a lead climbs every year while close rates stay flat',
          'The day you stop paying, production stops with it']},

  {t:'turn', brand:'AGENCY LAUNCH', eyebrow:'The turn',
   big:'What if your marketing kept producing after you stopped paying for it?',
   p:'That is the difference between renting pipeline and owning a system.'},

  {t:'part2', brand:'AGENCY LAUNCH', part:'Part Two', eyebrow:'The system',
   h2:'Momentum Mastery',
   p:'Three systems that compound: owned production, owned marketing, and a lean team that runs without you in every seat.'},

  {t:'pillar', brand:'AGENCY LAUNCH', eyebrow:'System one', num:'01',
   h2:'Momentum: ten more policies a month, indefinitely',
   p:'Production is a momentum game. Small, repeatable monthly gains compound into a transformed book, because you are stacking on top of what is already there instead of starting over.'},

  {t:'pillar', brand:'AGENCY LAUNCH', eyebrow:'System two', num:'02',
   h2:'Marketing you actually own',
   p:'Replace renting internet leads with low-cost marketing you control: a podcast, content, referrals, and a community. It costs less, and it keeps producing long after a rented lead would have gone cold.'},

  {t:'pillar', brand:'AGENCY LAUNCH', eyebrow:'System three', num:'03',
   h2:'A lean team that holds',
   p:'Onboard and train productive staff on a repeatable system, then hold them with a culture people do not leave. A small, well-run team out-produces a big one that is always churning.'},

  {t:'math', brand:'AGENCY LAUNCH', eyebrow:'Why momentum wins',
   kpi:'+10',
   h2:'policies a month, held, not chased',
   p:'Ten more a month is not a heroic quarter. It is a system you can run every month. Held long enough, that is the whole difference between a stuck agency and a scaling one.'},

  {t:'part3', brand:'AGENCY LAUNCH', part:'Part Three', eyebrow:'How it runs in the real world',
   h2:'The proof is a quiet office, not a louder one'},

  {t:'proof', brand:'AGENCY LAUNCH', eyebrow:'The operating model',
   kpi:'4,000',
   h2:'policies. Two people.',
   p:'That is the agency these systems were built in and are still run in. Not a big team spending big on leads. A lean one running an owned, repeatable engine.'},

  {t:'belief', brand:'AGENCY LAUNCH', eyebrow:'The objection',
   h2:'"I do not have time to build systems"',
   p:'The systems are what buy the time back. The same operating model that writes more is what takes an owner from sixty-plus hours a week down toward a schedule they actually chose.'},

  {t:'whyme', brand:'AGENCY LAUNCH', eyebrow:'Why listen to me',
   h2:'Matt Dietz',
   p:'I launched my own agency in 2004 with no industry experience, failed my way into a system that worked, and built an award-winning book of over 4,000 policies with two people. I teach the exact systems I still run.'},

  {t:'recap', brand:'AGENCY LAUNCH', eyebrow:'What to take with you',
   h2:'Systems over goals',
   items:['Own your production with momentum, not one-off pushes',
          'Own your marketing instead of renting leads',
          'Build a lean team the agency does not depend on you to carry']},

  {t:'cta', brand:'AGENCY LAUNCH', eyebrow:'Install it in your agency',
   h1:'Build your own system',
   p:'If you want help installing Momentum Mastery in your agency, the next step is a short conversation about where you are and what to build first.',
   btn:'Book a discovery call',
   foot:'Educational content only. No earnings, income, or production results are guaranteed. Individual results vary and depend on your market, effort, and execution.'}
];

const deck = document.getElementById('deck');
S.forEach(s=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'');
  let h = '';
  if(s.brand) h += '<div class="brandmark">'+s.brand+'</div>';
  if(s.part) h += '<div class="part">'+s.part+'</div>';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='reframe'||s.t==='turn'){ h += '<div class="rule"></div>'; }
  if(s.quote) h += '<div class="quote">'+s.quote+'</div>';
  if(s.big) h += '<div class="big">'+s.big+'</div>';
  if(s.kpi) h += '<div class="kpi">'+s.kpi+'</div>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.h2) h += '<h2>'+(s.num?'<span class="num">'+s.num+'</span>':'')+s.h2+'</h2>';
  if(s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if(s.p) h += '<p>'+s.p+'</p>';
  if(s.items){ h += '<ul>'; s.items.forEach(i=>h+='<li>'+i+'</li>'); h += '</ul>'; }
  if(s.btn) h += '<div><span class="btn">'+s.btn+'</span></div>';
  if(s.foot) h += '<div class="foot">'+s.foot+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
