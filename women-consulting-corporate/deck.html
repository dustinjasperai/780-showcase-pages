<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Corporate Client Breakthrough - A Masterclass with Liz J. Simpson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161e2a;        /* her dominant navy (brand evidence, 147 uses) */
    --panel:#1d2a33;     /* her funnel body background */
    --rule:#2c3a45;      /* hairline, one step up from panel */
    --accent:#9e0b0f;    /* her deep corporate red */
    --gold:#face1c;      /* her gold, numbers only */
    --ink:#f3f1ec;       /* warm off-white text on navy */
    --muted:#aeb6bf;     /* muted slate */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .kicker,h1,h2,.stat,.quote{font-family:'Sora',system-ui,sans-serif}
  #stage{width:100vw;height:100vh;position:relative}
  .slide{
    position:absolute;inset:0;display:none;
    flex-direction:column;justify-content:center;
    padding:8vh 10vw;
  }
  .slide.on{display:flex}
  .kicker{font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:1.4rem}
  .gold{color:var(--gold)}
  h1{font-size:clamp(2.1rem,5.4vw,4.2rem);font-weight:800;line-height:1.04;
    letter-spacing:-.01em}
  h2{font-size:clamp(1.7rem,4vw,3rem);font-weight:800;line-height:1.08;
    letter-spacing:-.01em}
  .lede{font-size:clamp(1.05rem,1.9vw,1.5rem);color:var(--muted);
    font-weight:400;margin-top:1.6rem;max-width:40ch;line-height:1.5}
  .body{font-size:clamp(1.05rem,1.8vw,1.45rem);font-weight:400;
    margin-top:1.4rem;max-width:46ch;line-height:1.55}
  ul{list-style:none;margin-top:1.8rem;max-width:48ch}
  li{font-size:clamp(1rem,1.7vw,1.35rem);font-weight:400;line-height:1.4;
    padding:.55rem 0 .55rem 1.6rem;position:relative;border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:1.15rem;width:.6rem;height:.6rem;
    background:var(--accent);border-radius:2px}
  li b{font-weight:600}
  .stat{font-size:clamp(2.6rem,7vw,5rem);font-weight:800;color:var(--gold);line-height:1}
  .statrow{display:flex;gap:4vw;flex-wrap:wrap;margin-top:2rem}
  .statrow .s{min-width:8rem}
  .statrow .s small{display:block;color:var(--muted);font-size:.95rem;margin-top:.5rem;font-weight:400}
  .quote{font-size:clamp(1.5rem,3.2vw,2.6rem);font-weight:600;line-height:1.2;max-width:24ch}
  .who{font-weight:600;color:var(--ink)}
  .foot{position:absolute;left:10vw;bottom:5vh;color:var(--muted);font-size:.8rem;letter-spacing:.04em}
  .num{position:absolute;right:10vw;bottom:5vh;color:var(--rule);font-size:.8rem;font-weight:600}
  .cta-steps{margin-top:1.8rem;max-width:44ch}
  .disclaimer{margin-top:2.4rem;color:var(--muted);font-size:.82rem;line-height:1.5;max-width:52ch;font-weight:400}
  .bar{width:3.2rem;height:.3rem;background:var(--accent);margin-bottom:1.6rem}
  @media (max-width:640px){.slide{padding:7vh 7vw}}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title',
   kicker:'A Live Masterclass with Liz J. Simpson',
   h:'The Corporate Client Breakthrough',
   lede:'How independent women experts win 5- and 6-figure corporate contracts, without chasing referrals or waiting to be discovered.'},

  {t:'who',
   kicker:'Who this is for',
   h:'You are already the expert.',
   body:'You are a consultant, coach, or service-based expert. Your work is excellent and your clients get real results. You know your expertise belongs in bigger rooms and bigger budgets. What you want now is a repeatable way to win corporate clients.'},

  {t:'trap',
   kicker:'The trap',
   h:'But the pipeline runs on luck.',
   body:'Referrals, a warm introduction, the occasional inbound. Feast one quarter, famine the next. You are the best-kept secret in your field, and the corporate deals keep going to firms that are not better than you. They are just easier to buy from.'},

  {t:'reframe',
   kicker:'The reframe',
   h:'It was never about being good enough.',
   lede:'Corporations do not buy expertise the way individuals do. They buy from people who are positioned, packaged, and present the way a procurement team expects. That is a system you can build, not a talent you are born with.'},

  {t:'section',
   kicker:'Part One',
   h:'Why expertise does not convert to corporate revenue.'},

  {t:'list',
   kicker:'The two gaps',
   h:'Two things stand between you and the contract.',
   items:[
    '<b>The identity gap.</b> You still show up as a freelancer for hire, not as a firm a company signs a six-figure agreement with.',
    '<b>The system gap.</b> You have no repeatable path from stranger, to conversation, to signed corporate contract.',
    'Close both and the deals stop feeling like luck.']},

  {t:'section',
   kicker:'Part Two',
   h:'The Stimulyst Growth Architecture.',
   lede:'Two connected operating systems that move you from expertise to corporate revenue.'},

  {t:'list',
   kicker:'System 1 - The Internal Operating System',
   h:'Identity comes before strategy.',
   items:[
    'How you see yourself. How you show up. What you believe is available to you.',
    '<b>Self-perception, belief, behavior, embodiment.</b> The internal foundation everything else is built on.',
    'You cannot sell a six-figure engagement from a story that says you charge by the hour.']},

  {t:'list',
   kicker:'System 2 - The Revenue Operating System',
   h:'A structured path from positioning to scale.',
   items:[
    '<b>Positioning</b> so organizations take you seriously.',
    '<b>Market ecosystem</b> - mapping who actually buys and who signs.',
    '<b>Marketing engine</b> that generates intentional demand every month.',
    '<b>Pipeline, conversations, proposals, pricing, closing.</b>']},

  {t:'point',
   kicker:'Revenue OS - Positioning',
   h:'Position for the buyer, not the peer.',
   body:'Your website speaks to other experts. The corporate buyer needs to see outcomes, risk removed, and a category they already have budget for. Positioning is the difference between interesting and fundable.'},

  {t:'point',
   kicker:'Revenue OS - Market ecosystem',
   h:'Know the room before you enter it.',
   body:'A corporate decision is made by a committee, not a person. Map the economic buyer, the champion, and the gatekeeper. When you know who signs and who blocks, your outreach stops guessing.'},

  {t:'point',
   kicker:'Revenue OS - Marketing engine',
   h:'Demand you create on purpose.',
   body:'Content, authority, and a live teaching event that fills the top of your pipeline every month, so you are never one lost referral away from a quiet quarter.'},

  {t:'point',
   kicker:'Revenue OS - Conversations and proposals',
   h:'Sell the way corporate buys.',
   body:'Discovery that qualifies the budget. A proposal built around their outcome and their procurement process. You stop sending quotes and start presenting agreements.'},

  {t:'point',
   kicker:'Revenue OS - Pricing and closing',
   h:'Price to a corporate budget.',
   body:'A corporate line item is not a personal credit card. Price to the value and the budget that already exists, then close the kind of multi-year engagement that changes your whole year with one signature.'},

  {t:'section',
   kicker:'Part Three',
   h:'What a corporate-ready practice looks like.'},

  {t:'point',
   kicker:'The shift',
   h:'From best-kept secret to signed contracts.',
   body:'Predictable demand instead of hoping for referrals. Conversations with buyers who have budget. Fewer, larger engagements. Work that compounds, because one corporate client introduces you to the next.'},

  {t:'stats',
   kicker:'Why learn this from Liz',
   h:'This is the work, measured.',
   stats:[
    {n:'20,000+',l:'professionals trained'},
    {n:'$250M+',l:'in corporate contracts closed by clients'},
    {n:'219+',l:'women through the 12% Accelerator'}],
   note:'Figures are Liz J. Simpson and Stimulyst client results, shared as track record.'},

  {t:'quote',
   kicker:'The 12%',
   q:'The goal is simple: move women experts into the rooms where the real contracts get signed.',
   by:'Liz J. Simpson, Founder, Stimulyst and the 12% Accelerator'},

  {t:'list',
   kicker:'The path, in one view',
   h:'Build the identity. Build the system. Win the contract.',
   items:[
    'Shift the identity so you show up as a firm, not a freelancer.',
    'Install the Revenue Operating System from positioning to closing.',
    'Fill the pipeline with corporate buyers on purpose, every month.']},

  {t:'cta',
   kicker:'Your next step',
   h:'Ready to build your corporate client system?',
   steps:[
    'Join the next live Corporate Client Challenge to see the system in action.',
    'When you are ready to build it with support, apply to the 12% Accelerator.',
    'Start at womenconsultingcorporate.com.'],
   disclaimer:'This masterclass is educational. Outcomes depend on your effort, your market, and your execution. Results are not guaranteed and results vary. Nothing here is a promise of income or a specific contract.'}
];

const stage=document.getElementById('stage');
let i=0;
function esc(x){return x==null?'':x}
function render(){
  stage.innerHTML='';
  const s=S[i];
  const d=document.createElement('section');
  d.className='slide on';
  let html='';
  if(s.kicker) html+='<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.t==='title'){html+='<div class="bar"></div><h1>'+esc(s.h)+'</h1>';
    if(s.lede)html+='<div class="lede">'+esc(s.lede)+'</div>';}
  else if(s.t==='section'){html+='<div class="bar"></div><h2>'+esc(s.h)+'</h2>';
    if(s.lede)html+='<div class="lede">'+esc(s.lede)+'</div>';}
  else if(s.t==='quote'){html+='<div class="quote">'+esc(s.q)+'</div>'+
    '<div class="lede">'+esc(s.by)+'</div>';}
  else if(s.t==='stats'){html+='<h2>'+esc(s.h)+'</h2><div class="statrow">'+
    s.stats.map(x=>'<div class="s"><div class="stat">'+esc(x.n)+'</div><small>'+esc(x.l)+'</small></div>').join('')+
    '</div>'+(s.note?'<div class="disclaimer">'+esc(s.note)+'</div>':'');}
  else if(s.t==='list'){html+='<h2>'+esc(s.h)+'</h2><ul>'+
    s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  else if(s.t==='cta'){html+='<div class="bar"></div><h2>'+esc(s.h)+'</h2><ul class="cta-steps">'+
    s.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
    '<div class="disclaimer">'+esc(s.disclaimer)+'</div>';}
  else {html+='<h2>'+esc(s.h)+'</h2>';
    if(s.body)html+='<div class="body">'+esc(s.body)+'</div>';
    if(s.lede)html+='<div class="lede">'+esc(s.lede)+'</div>';}
  d.innerHTML=html+'<div class="foot">The Corporate Client Breakthrough</div>'+
    '<div class="num">'+(i+1)+' / '+S.length+'</div>';
  stage.appendChild(d);
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(1);
  if(e.key==='ArrowLeft')go(-1);
});
stage.addEventListener('click',()=>go(1));
render();
</script>
</body>
</html>
