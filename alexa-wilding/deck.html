<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take Your Seat — a masterclass with Alexa Wilding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7; --panel:#ece2cf; --ink:#2b2621; --muted:#6f6353;
    --rule:#d7c9ac; --accent:#b5622f;
    --head:'Newsreader',Georgia,serif; --body:'Figtree',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#161310;color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:10px;padding:64px 60px;margin:0 0 22px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .slide:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);opacity:.9}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  .label{font-family:var(--body);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    font-size:12px;color:var(--muted);margin-bottom:16px}
  h1{font-family:var(--head);font-weight:600;font-size:60px;line-height:1.02;letter-spacing:-.5px}
  h2{font-family:var(--head);font-weight:600;font-size:44px;line-height:1.06}
  .sub{font-family:var(--head);font-style:italic;font-size:26px;color:var(--muted);margin-top:20px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:62ch;margin-top:18px}
  .muted{color:var(--muted)}
  ul{margin-top:22px;list-style:none;max-width:60ch}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.5;margin:14px 0}
  li:before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .pill{display:flex;align-items:baseline;gap:22px}
  .pnum{font-family:var(--head);font-size:72px;color:var(--accent);line-height:1}
  .quote{font-family:var(--head);font-style:italic;font-size:40px;line-height:1.18;letter-spacing:-.3px}
  .cite{margin-top:26px;font-weight:700;letter-spacing:.06em;font-size:15px;color:var(--muted)}
  .cta-box{margin-top:30px;padding:22px 26px;background:var(--panel);border:1px solid var(--rule);border-radius:8px}
  .cta-box a{color:var(--accent);font-weight:700;text-decoration:none}
  .disc{margin-top:28px;font-size:13px;line-height:1.5;color:var(--muted);max-width:66ch}
  .n{position:absolute;right:26px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:.1em}
  .accent{color:var(--accent)}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:420px}h1{font-size:40px}h2{font-size:32px}.quote{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', kicker:'A live masterclass with Alexa Wilding',
    h:'Take Your Seat',
    sub:'How to write the book that life keeps interrupting.'},

  {t:'who', label:'Who this is for',
    h:'You have a book in you. You just can’t get to it.',
    list:['A memoir, an essay collection, poems, or a Substack you keep meaning to begin',
      'A decade of starts and stops, and a folder of notes that never became a draft',
      'Enough craft to know better, and never enough quiet to actually write']},

  {t:'point', label:'The trap',
    h:'You keep waiting for the quiet to come.',
    p:'Work, caregiving, grief, the noise of a life being lived. You tell yourself you’ll write when it settles down. It never settles down. So the writing waits, and waiting becomes the habit.'},

  {t:'point', label:'What it costs',
    h:'The waiting has a price.',
    p:'Every season you don’t write, the story gets heavier to carry and harder to start. The problem was never your talent and it was never the perfect room. It is that nothing was protecting the writing when life came for the time.'},

  {t:'reframe', label:'The reframe',
    h:'Forget the room of your own. You need a fortress.',
    p:'A room is a nice idea you lose the moment the day gets loud. A fortress is a practice built to hold, walls that keep the writing safe no matter what is happening on the other side of them. That is what we build together.'},

  {t:'part', label:'Part One',
    h:'Why the writing keeps losing'},

  {t:'point',
    h:'It’s a practice problem, not a talent problem.',
    p:'Most writing advice hands you more craft. But you don’t stall because you lack technique. You stall because there is no ritual that gets you back to the page after every interruption, and no one holding the space while you do the hard, tender work of showing up.'},

  {t:'part', label:'Part Two',
    h:'The FORTRESS method'},

  {t:'point',
    h:'Three steps that get the writing moving again.',
    p:'Not a content calendar and not a productivity system. A durable, mindful practice you can keep up through any season. Here is the whole of it.'},

  {t:'pill', n:'01', h:'Take your seat',
    p:'As the Buddhists say. Before the outline, before the word count, you sit down and become present to the page. We build the small, repeatable ritual that returns you to the chair when everything in your life is asking you not to.'},

  {t:'pill', n:'02', h:'Gather and assemble',
    p:'The scattered notes, the voice memos, the half-scenes. We gather what is already there and shape it, so the work stops being a vague someday and becomes a thing with edges you can actually hold and move.'},

  {t:'pill', n:'03', h:'Send it into the world',
    p:'Writing wants a reader. We find the form and the courage to send the offering out, whether that is a Substack post, an essay, or the first real pages of the book. Finished and shared beats perfect and hidden.'},

  {t:'part', label:'Part Three',
    h:'The season of being guided'},

  {t:'who', label:'The rhythm',
    h:'You are held the whole way through.',
    list:['A weekly hour together, one to one, on the work in front of you',
      'Daily messages through the week, so you are never stuck alone between sessions',
      'Monthly letters with prompts, readings, and a short meditation to steady the practice']},

  {t:'quote',
    q:'I believe we can harness whatever the hell we have going on into our best writing yet.',
    cite:'Alexa Wilding'},

  {t:'who', label:'Why me',
    h:'Alexa Wilding',
    list:['A decade as a singer-songwriter the New York Times called a neo-Stevie Nicks, before I came to the page',
      'MFA from The Writer’s Foundry; my newsletter Resilience reached the Top 100 in Rising Culture on Substack',
      'I work one to one with writers around the world as a writing doula, blending real craft with mindfulness']},

  {t:'point', label:'What you’ll leave with',
    h:'Today you take your seat.',
    p:'You will leave this hour with the ritual that returns you to the page, a clear sense of what you are gathering, and the first honest step toward sending it into the world.'},

  {t:'cta', kicker:'Your next step',
    h:'Write the thing. Get on with it already.',
    p:'If you want a season of being guided, one to one, I keep a small number of writers in Private Study, my three-month immersive. The first step is a complimentary call so we can explore the work together.',
    cta:'Book your complimentary call at stan.store/alexawilding',
    disc:'Educational only. No income, role, or publishing result is guaranteed. Results vary with the writer, the work, and the effort you bring to the practice.'}
];

function render(){
  const d=document.getElementById('deck');
  S.forEach((s,i)=>{
    const el=document.createElement('section');
    el.className='slide';
    let h='';
    if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
    if(s.label) h+='<div class="label">'+s.label+'</div>';
    if(s.t==='title'){ h+='<h1>'+s.h+'</h1>'; if(s.sub) h+='<div class="sub">'+s.sub+'</div>'; }
    else if(s.t==='part'){ h+='<h1>'+s.h+'</h1>'; }
    else if(s.t==='quote'){ h+='<div class="quote">“'+s.q+'”</div><div class="cite">'+s.cite+'</div>'; }
    else if(s.t==='pill'){ h+='<div class="pill"><div class="pnum">'+s.n+'</div><div><h2>'+s.h+'</h2>'+(s.p?'<p>'+s.p+'</p>':'')+'</div></div>'; }
    else if(s.t==='cta'){ h+='<h2>'+s.h+'</h2>'+(s.p?'<p>'+s.p+'</p>':'')+'<div class="cta-box"><a href="https://stan.store/alexawilding">'+s.cta+'</a></div><div class="disc">'+s.disc+'</div>'; }
    else { h+='<h2>'+s.h+'</h2>';
      if(s.p) h+='<p>'+s.p+'</p>';
      if(s.list){ h+='<ul>'; s.list.forEach(x=>h+='<li>'+x+'</li>'); h+='</ul>'; } }
    h+='<div class="n">'+(i+1)+' / '+S.length+'</div>';
    el.innerHTML=h;
    d.appendChild(el);
  });
}
render();
</script>
</body>
</html>
