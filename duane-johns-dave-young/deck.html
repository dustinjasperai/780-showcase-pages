<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Valuable Builder · Builder Nuggets, Duane Johns & Dave Young</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b0c10; --panel:#14161c; --rule:#292f36;
    --acc:#38b1f4; --ink:#f7fbfe; --body:#c7ccd6; --dim:#7f8794; --cream:#f7fbfe;
  }
  html,body{height:100%}
  body{background:#050609;font-family:'DM Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050609}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'DM Sans',sans-serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:-.012em}
  .t-title h1{font-size:5.0vw;max-width:94%;font-weight:700}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.4;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%;font-weight:700}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#12233a 0%,#080b11 62%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream);font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#12233a 0%,#080b11 62%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream);font-weight:700}
  .t-cta .body{color:#cfd6e2;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .bp-motif{position:absolute;pointer-events:none}
  .title-bp{right:7.2%;bottom:8%;width:17vw;opacity:.85}
  .corner-bp{right:6.5%;bottom:7.5%;width:8.5vw;opacity:.5}
  .brandline{font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Builder Nuggets</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- blueprint motif: drafting corner with dimension ticks, drawn in builder-blue -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="bp" viewBox="0 0 120 120">
  <g fill="none" stroke="#38b1f4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 14 H80 M14 14 V80" opacity="0.9"/>
    <path d="M14 22 H8 M22 14 V8" opacity="0.55"/>
    <path d="M40 14 V9 M66 14 V9" opacity="0.4"/>
    <path d="M14 40 H9 M14 66 H9" opacity="0.4"/>
    <circle cx="80" cy="80" r="11" opacity="0.85"/>
    <path d="M80 62 V72 M80 88 V98 M62 80 H72 M88 80 H98" opacity="0.5"/>
    <path d="M96 24 L106 24 L106 34" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Valuable Builder',sub:'How to turn a construction company into an asset that runs without you, and is worth something when you want out.',brand:true,bp:'title'},
 {t:'normal',k:'Who this is for',title:'You can build the house. Building the company is the part nobody handed you a plan for.',body:'You run a real construction or remodeling business, the work is good and the phone rings. But most of it still runs through you. The estimates, the fires, the final call on everything. Take two weeks off and you already know what you would come back to.'},
 {t:'dark',title:'A busy calendar and a business worth selling are not the same thing.'},

 {t:'section',idx:'Part One',title:'Why a Busy Builder Owns a Job, Not a Business'},
 {t:'normal',k:'The owner-dependence trap',title:'If the company cannot run a week without you, you own the hardest job in it.',body:'Most builders scale by doing more themselves, so growth just buys a heavier version of the same week. The revenue looks like a business, but every decision, relationship and system lives in one head. That is a job with employees, not a company with value.'},
 {t:'normal',k:'What that costs you',title:'A company that depends on the owner is worth far less than the owner thinks.',body:'A buyer, a partner or a successor is not buying your revenue. They are buying what keeps running when you step back. When the answer is not much, the value walks out the door with you, and the exit you assumed was there quietly is not.'},
 {t:'dark',title:'You did not put in twenty years to end up owning the one job you can never leave.'},

 {t:'section',idx:'Part Two',title:'The Four Things That Make a Company Valuable'},
 {t:'normal',k:'The lens we run every business through',title:'Reduce the risk, increase the value, generate the opportunity, eliminate the noise.',body:'Every healthy builder scores well on four things. Reduce your risk so the business is not one key person or one bad job from trouble. Increase your value so it is worth more to a buyer or a successor. Generate opportunity so growth is a choice, not luck. Eliminate the noise so you and your team focus on what you are actually good at.'},
 {t:'normal',k:'Work on it, not in it',title:'The shift is moving from the person who does the work to the person who owns the system.',body:'A valuable company runs on documented process, clear numbers and a team that makes the day to day calls without you. Your job changes from doing the work to owning the machine that does it. That is the difference between a builder who is busy and a builder who is free.'},
 {t:'normal',k:'Financial clarity and the right client',title:'You cannot increase the value of a number you cannot see, or a client who erodes it.',body:'Two levers move fastest. Real financial reporting, so you price and decide on facts instead of the bank balance. And intentional client selection, so you take the work that builds the company and turn away the work that quietly bleeds it. Both are learnable, and both raise the score.'},
 {t:'dark',title:'Value is not a feeling about your company. It is a set of things you can measure and move.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Business Can Stand on Its Own'},
 {t:'normal',k:'The company this builds',title:'A business that runs without you, grows on purpose, and is genuinely worth something.',body:'When the systems and the team hold, a slow week stops being a crisis and a two week trip stops being a gamble. Growth becomes a decision you make on the numbers. And when you are ready, you have a real asset to sell or hand down, with a plan and an income stream, not just a truck and a phone.'},
 {t:'dark',title:'The goal was never to build more houses. It was to build something worth handing over.'},
 {t:'normal',k:'Why Duane and Dave',title:'Two builders who did the work, then built the assessment other builders use to do the same.',body:'Duane Johns has spent more than twenty five years elevating professionalism in construction as a builder, remodeler and coach. Dave Young is a regional partner and business coach across five Alair Homes regions. Together they built the Builder Nuggets Assessment, a structured deep dive across more than twenty facets of a building company, and the podcast thousands of builders listen to. This is the method behind it.'},

 {t:'section',idx:'Your Next Step',title:'See Where Your Company Actually Stands'},
 {t:'normal',k:'Keep going with Builder Nuggets',title:'The full assessment maps your twenty plus facets and the plan to raise them.',body:'The Builder Nuggets Assessment is a collaborative deep dive into how your business runs today, where you want it to go, and a written plan to get there. It starts with a short intake call, no obligation, so you can see exactly where your value is and what to move first.'},
 {t:'cta',title:'Ready to build a company that runs without you?',body:'Book a Builder Nuggets Assessment intake call and see where your business stands.',chips:['Book your intake call','Take the Builder Nuggets Assessment'],disc:'Educational content for builders and remodelers. No income, valuation or business result is guaranteed. Results vary by company, market and how the work is applied.'},
];

const deck=document.getElementById('deck');
function bp(kind){return `<svg class="bp-motif ${kind==='title'?'title-bp':'corner-bp'}"><use href="#bp"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Builder <b>Nuggets</b> · Duane Johns & Dave Young</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.bp) h+=bp(s.bp);
  else if(s.t==='title') h+=bp('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
