<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Invisible to Invaluable | Authority Personal Branding Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#06182b;      /* ground, deepened from brand #032b44 */
    --panel:#0e2740;   /* slate panel */
    --rule:#334155;    /* brand slate */
    --accent:#045cb4;  /* brand signature authority blue (25 uses) */
    --ink:#eef3f8;
    --ink-soft:#b8c6d6;
    --ink-muted:#7d8ea1;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }
  #stage{width:100%;max-width:960px;aspect-ratio:16/9;position:relative;}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:64px 72px;background:var(--bg);}
  .slide.on{display:flex;}
  .kicker{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin-bottom:20px;}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:54px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:18px;}
  h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:38px;line-height:1.14;
    margin-bottom:22px;}
  p.lede{font-size:21px;color:var(--ink-soft);line-height:1.55;max-width:44ch;}
  p.body{font-size:18px;color:var(--ink-soft);line-height:1.6;max-width:50ch;margin-bottom:12px;}
  ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  li{font-size:19px;color:var(--ink-soft);padding-left:26px;position:relative;line-height:1.45;}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;
    background:var(--accent);border-radius:2px;}
  li b{color:var(--ink);font-weight:600;}
  .pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:10px;}
  .pill{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px 24px;}
  .pill .n{font-family:'Playfair Display',serif;font-size:15px;color:var(--accent);font-weight:600;}
  .pill h3{font-size:19px;color:var(--ink);margin:6px 0 8px;font-weight:600;}
  .pill p{font-size:15px;color:var(--ink-muted);line-height:1.5;}
  .big{font-family:'Playfair Display',serif;font-size:72px;font-weight:700;color:var(--accent);
    line-height:1;margin-bottom:10px;}
  .reframe h2 span{color:var(--accent);}
  .cred{display:flex;flex-direction:column;gap:14px;margin-top:6px;}
  .cred .row{font-size:18px;color:var(--ink-soft);}
  .cred .row b{color:var(--ink);}
  .cta-card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
    padding:30px 34px;max-width:52ch;}
  .cta-card .step{font-size:20px;color:var(--ink);font-weight:600;margin-bottom:10px;}
  .disclaimer{font-size:12px;color:var(--ink-muted);line-height:1.5;margin-top:22px;max-width:60ch;}
  .foot{position:absolute;left:72px;bottom:30px;font-size:12px;color:var(--ink-muted);letter-spacing:.04em;}
  .pg{position:absolute;right:72px;bottom:30px;font-size:12px;color:var(--ink-muted);}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;}
  .nav button{background:var(--panel);color:var(--ink-soft);border:1px solid var(--rule);
    border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
  .nav button:hover{color:var(--ink);border-color:var(--accent);}
  @media (max-width:720px){.slide{padding:36px 30px;}h1{font-size:34px;}h2{font-size:26px;}
    .pillars{grid-template-columns:1fr;}.big{font-size:50px;}.foot,.pg{left:30px;}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S=[
  {t:'title',kicker:'A live masterclass with Jon Michail',h:'From Invisible to Invaluable',lede:'Why the most capable leader in the room is often not the one who gets chosen, and the system that changes it.'},
  {t:'agenda',kicker:'The next 60 minutes',h:'What we will cover together',items:['<b>The perception gap.</b> Why competence alone keeps you invisible.','<b>The system.</b> The four moves of Authority Personal Branding.','<b>Reputation Capital.</b> Treating your reputation as a built asset.','<b>Your first move.</b> What to do this week to close the gap.']},
  {t:'forwho',kicker:'Who this is for',h:'The successful and the under-recognised',body:'You are a CEO, founder or senior leader. You have the track record. And still the board seat, the media, the mandate keep going to people you out-perform. This hour is about why, and what to do about it.'},
  {t:'trap',kicker:'The trap',h:'You were told competence would speak for itself',body:'It does not. In rooms where everyone is competent, perception is the tiebreaker. Leaders who assume the work alone will be seen are the ones who stay invisible.'},
  {t:'cost',kicker:'What it costs',h:'The quiet price of the gap',body:'The gap does not announce itself. It shows up as the mandate that went elsewhere, the raise that stalled, the keynote that went to someone louder and less proven. You rarely hear why. You only feel the ceiling.'},
  {t:'reframe',kicker:'The reframe',h:'They do not choose the best leader. They choose the one they can <span>read</span>.',lede:'Reputation is not luck and it is not vanity. It is an asset you either build on purpose or leave to chance.'},
  {t:'part',kicker:'Part one',h:'The perception gap',body:'The distance between how good you actually are and how you are read. Three places leaders quietly leak authority:'},
  {t:'list',kicker:'Part one',h:'Where authority leaks',items:['<b>Positioning.</b> You are a category of one in your head and a generalist in theirs.','<b>Presence.</b> How you show up in the room contradicts the level you operate at.','<b>Visibility.</b> The right people have simply never been given a reason to know you.']},
  {t:'point',kicker:'Part one',h:'The real problem is not ability',body:'By the time you are in these rooms, ability is assumed. The problem is that nobody has engineered how you are interpreted. Left alone, perception defaults to whatever is loudest, not whatever is best.'},
  {t:'part',kicker:'Part two',h:'The Authority Personal Branding System',body:'The method I have built over 36 years at Image Group International. Four moves that turn perception into recognised authority.'},
  {t:'pillars',kicker:'Part two',h:'The four moves',pills:[
    {n:'01',h:'Perception Diagnosis',p:'An honest read of how you are interpreted today, by the people whose opinion decides your next move.'},
    {n:'02',h:'Authority Positioning',p:'Define the distinct point of view and the lane only you can own. Stop competing as a generalist.'},
    {n:'03',h:'Authentic Image Management (AIM)',p:'Align presence, communication and image with the authority you already hold.'},
    {n:'04',h:'Reputation Architecture (Reputrak360)',p:'Engineer and protect your reputation across media and stakeholders, before a crisis tests it.'}
  ]},
  {t:'concept',kicker:'The idea underneath it',h:'Reputation Capital',body:'Treat reputation the way you treat any serious asset. It compounds. It opens capital raises, board appointments and media that a resume never will. And like any asset, it can be built on purpose.'},
  {t:'list',kicker:'The idea underneath it',h:'What Reputation Capital unlocks',items:['Boardroom and advisory invitations you did not have to chase.','Media and speaking that position you as the category authority.','Premium pricing, because the market already trusts the name.','A reputation that holds its value when it is tested.']},
  {t:'part',kicker:'Part three',h:'When the system is working',body:'You stop explaining your credibility and start being chosen for it. The shift from invisible to invaluable is not louder self-promotion. It is a built, protected reputation doing the work for you.'},
  {t:'list',kicker:'Part three',h:'What changes for you',items:['The opportunities start arriving instead of being chased.','Your name enters rooms before you do.','Premium mandates stop feeling like a fight to justify.']},
  {t:'proof',kicker:'The ceiling, illustrated',h:'What built authority has made possible',body:'Leaders inside this work have gone on to national honours, major business awards and public-company listings. These are illustrations of what a built reputation can open, not a promise of any specific result for you.'},
  {t:'firstmove',kicker:'Your first move',h:'Start with the diagnosis',body:'Before you change anything, get an honest read of how you are perceived right now by the three people who most influence your next move. You cannot close a gap you have not measured.'},
  {t:'cred',kicker:'Why me',h:'Jon Michail',rows:['Founder and Group CEO, Image Group International, established 1989.','Pioneer of Authority Personal Branding. Best-selling author and Forbes Councils member.','36 years advising CEOs, founders and leaders across four continents.','Host of Jon Michail’s Personal Branding Masterclass.']},
  {t:'recap',kicker:'In one line',h:'Perception is engineered, not left to chance',body:'Diagnose how you are read. Position the authority only you can own. Align your presence. Build and protect your Reputation Capital. That is the path from invisible to invaluable.'},
  {t:'cta',kicker:'Your next step',h:'Request your private session',step:'A one-to-one conversation to map your perception gap and the first moves to close it.',body:'If this hour resonated, the next step is a private session with me. We look at how you are read today and what Authority Personal Branding would change for you specifically.',disclaimer:'Educational content only. No income, outcome or result is guaranteed. Results vary by individual, effort and circumstance. Any client outcomes referenced are illustrative and not a guarantee of your results.'}
];
const stage=document.getElementById('stage');
let i=0;
function render(){
  stage.innerHTML='';
  const s=S[i];
  const el=document.createElement('div');el.className='slide on';
  let h='';
  if(s.kicker)h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='reframe'){h+=`<div class="reframe"><h2>${s.h}</h2></div>`;}
  else if(s.t==='title'){h+=`<h1>${s.h}</h1>`;}
  else{h+=`<h2>${s.h}</h2>`;}
  if(s.lede)h+=`<p class="lede">${s.lede}</p>`;
  if(s.body)h+=`<p class="body">${s.body}</p>`;
  if(s.items){h+='<ul>'+s.items.map(x=>`<li>${x}</li>`).join('')+'</ul>';}
  if(s.pills){h+='<div class="pillars">'+s.pills.map(p=>`<div class="pill"><div class="n">${p.n}</div><h3>${p.h}</h3><p>${p.p}</p></div>`).join('')+'</div>';}
  if(s.rows){h+='<div class="cred">'+s.rows.map(r=>`<div class="row">${r}</div>`).join('')+'</div>';}
  if(s.t==='cta'){
    h+=`<div class="cta-card"><div class="step">${s.step}</div><p class="body">${s.body}</p></div>`;
    h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  }
  h+=`<div class="foot">Image Group International &middot; Authority Personal Branding</div>`;
  h+=`<div class="pg">${i+1} / ${S.length}</div>`;
  el.innerHTML=h;
  stage.appendChild(el);
}
function go(d){i=(i+d+S.length)%S.length;render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
