<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand, Speak, Shine: A Masterclass with Cherie Burton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Theano+Didot&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#190a10;      /* deep wine-black, from site #000 warmed to Soul Rose */
    --panel:#241017;       /* raised wine */
    --rule:#3a1b24;
    --accent:#9d3535;      /* her dominant brand rose (extract_brand.js) */
    --gold:#c9a26b;        /* soft rose-gold, small marks only */
    --text:#ecf0f1;        /* her near-white */
    --muted:#b89aa2;
    --display:'Theano Didot', Georgia, serif;
    --body:'Lato', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ground);color:var(--text);font-family:var(--body);line-height:1.6}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    padding:56px 52px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;top:0;left:0;width:5px;height:100%;background:var(--accent)}
  .kicker{font-family:var(--body);text-transform:uppercase;letter-spacing:.22em;font-size:12px;
    color:var(--gold);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:400;font-size:52px;line-height:1.12;margin-bottom:22px}
  h2{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.16;margin-bottom:18px}
  h3{font-family:var(--display);font-weight:400;font-size:27px;color:var(--gold);margin-bottom:10px}
  p{font-size:19px;margin-bottom:14px;max-width:62ch}
  p.lead{font-size:22px;color:var(--text)}
  .sub{color:var(--muted);font-size:18px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:64ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:21px;width:12px;height:12px;border-radius:50%;
    border:2px solid var(--accent)}
  .stage{display:flex;gap:22px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--rule)}
  .stage:last-child{border-bottom:none}
  .stage .word{font-family:var(--display);font-size:30px;color:var(--accent);min-width:150px}
  .stage .desc{font-size:18px;color:var(--text)}
  .big{font-family:var(--display);font-size:120px;color:var(--accent);line-height:1}
  .cta h2{color:var(--text)}
  .btn{display:inline-block;margin-top:18px;background:var(--accent);color:#fff;font-weight:700;
    letter-spacing:.04em;padding:15px 32px;border-radius:4px;text-decoration:none;font-size:17px}
  .disclaimer{margin-top:26px;color:var(--muted);font-size:13px;max-width:64ch;line-height:1.5}
  .num{color:var(--gold);font-family:var(--display);font-size:20px;margin-bottom:12px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 40px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<footer>Cherie Burton &middot; Stand Speak Shine</footer>
<script>
const S=[
  {t:'title',kicker:'A Live Masterclass with Cherie Burton',h:'Stand, Speak, Shine',
   p:'The path from silent knowing to sacred visibility, for the women who are quietly meant to lead.'},

  {t:'who',kicker:'Who this is for',h:'You already feel the calling',
   p:'You are a soul-led woman who senses there is more you are here to do. You have done the inner work. You read, you journal, you heal. And still, when it is time to be seen and heard, you go quiet.',
   sub:'If you have ever felt the pull to lead and then watched yourself shrink from it, this hour is for you.'},

  {t:'trap',kicker:'The trap',h:'Waiting to feel ready',
   p:'Most women are told the answer is more confidence, more clarity, one more certification, one more year of healing. So they wait. The calling stays a private ache instead of a public gift.',
   sub:'Readiness is not the thing you are missing.'},

  {t:'reframe',kicker:'A harder truth',h:'You were trained out of your own voice',
   p:'This is not a confidence problem. From girlhood, many of us were rewarded for being agreeable, small, and quiet, and corrected when we were loud, angry, or too much. The voice did not disappear. It was buried.',
   sub:'What looks like self-doubt is often old obedience.'},

  {t:'part',num:'Part One',h:'The cost of the buried voice'},

  {t:'body',kicker:'Part One',h:'Spiritual, and still silent',
   p:'A lot of feminine spiritual work stays in the inner world, where you meditate, manifest, and raise your vibration, and never crosses into expression. It can become a beautiful way to stay hidden.',
   list:['The healing happens in private and never becomes a message','Sacred rage gets labeled unspiritual and swallowed','The body stays braced, so the truth never makes it to the throat','The gift stays a hobby instead of a calling you answer']},

  {t:'body',kicker:'Part One',h:'A soul calling is not a hobby',
   p:'A mission is something you choose. A soul calling is something you have to do. It calls to you at a soul level and will not leave you alone. You do not need more proof that it is real. You need a way to say yes to it out loud.',
   sub:'The question is no longer whether. It is how.'},

  {t:'part',num:'Part Two',h:'Stand, Speak, Shine'},

  {t:'framework',kicker:'Part Two, the method',h:'Three moves, in order',
   p:'Over 20 years as a spiritual psychologist I built Stand Speak Shine to take a woman from buried knowing to visible leadership. It is sequential on purpose. You cannot shine from a body that does not feel safe to stand.',
   stages:[
     ['STAND','Come home to your body and your ground. Nervous-system safety, boundaries, and sovereignty first, using somatic and Essential Emotions clearing, so you are rooted enough to be seen.'],
     ['SPEAK','Reclaim the voice you buried, including your sacred rage. Tell the truth, name what is yours, and express your soul’s unique gift so you are finally heard.'],
     ['SHINE','Step out as a wayshower. Let your outer expression match your inner power through your Sacred Style Archetype, and lead where your calling has been pointing all along.']]},

  {t:'body',kicker:'Part Two, Stand',h:'Stand: safety before courage',
   p:'Courage is not a mindset you force. It is what becomes available when your body stops bracing. We settle the nervous system first, clear the old charge, and set the boundaries that make room for you.',
   sub:'A grounded woman does not have to be brave. She is simply hard to move.'},

  {t:'body',kicker:'Part Two, Speak',h:'Speak: sacred rage is information',
   p:'The anger you were told to swallow is not a flaw. It marks the line where something true was crossed. When you stop pathologizing it and start listening to it, it becomes the clearest guide to what you are here to say.',
   sub:'Your voice returns the moment it is allowed to.'},

  {t:'body',kicker:'Part Two, Shine',h:'Shine: visible on purpose',
   p:'Shining is not performing. It is letting the women who need you actually find you. Your Sacred Style Archetype aligns how you show up on the outside with the leader you already are on the inside, so being seen feels like truth, not exposure.',
   sub:'You were never meant to lead in private.'},

  {t:'part',num:'Part Three',h:'When she answers the call'},

  {t:'body',kicker:'Part Three',h:'From private ache to answered call',
   p:'When a woman moves through all three, the change is not louder affirmations. It is structural.',
   list:['She can stay in her body in the moment she used to freeze','She says the true thing without rehearsing it ten times','Her work finds its people instead of waiting to be discovered','The calling becomes something she lives, not something she defers']},

  {t:'body',kicker:'Why me',h:'Where this comes from',
   p:'I am a spiritual psychologist with 20 years in the science and spirituality of healing and consciousness. I have apprenticed through Sacred Feminine wisdom traditions and mystery schools and trained as an Essential Emotions Master Coach.',
   sub:'Across 241 episodes of the Stand Speak Shine podcast and the Women’s Wisdom Circle, I have watched this same path return women to their voice again and again.'},

  {t:'body',kicker:'The work, held',h:'You are not meant to do this alone',
   p:'This path is not a download you consume by yourself. It is held for you, in a sister tribe, in witnessed practice, and in guidance that stays with you while the old patterns come up and clear. That is what makes it stick.',
   sub:'A witness changes what is possible.'},

  {t:'cta',kicker:'Your next step',h:'Walk the path with me',
   p:'If Stand, Speak, Shine named something you have carried for years, there is a place for you. The Women’s Wisdom Circle is a six-month sacred circle for women stepping into their soul calling, and the Soul Calling mentorship is the one-to-one version of this journey.',
   btn:'Begin with a free exploratory call',
   disclaimer:'This masterclass is for educational and personal-growth purposes. It is not therapy or medical or psychological treatment, and it is not a promise of any specific outcome. No specific result is guaranteed and results vary from woman to woman. Your results depend on you.'}
];

const deck=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.num) h+=`<div class="num">${s.num}</div>`;
  if(s.t==='title'||s.t==='part') h+=`<h1>${s.h}</h1>`;
  else if(s.h) h+=`<h2>${s.h}</h2>`;
  if(s.p) h+=`<p class="lead">${s.p}</p>`;
  if(s.stages){h+='<div>';s.stages.forEach(x=>{h+=`<div class="stage"><div class="word">${x[0]}</div><div class="desc">${x[1]}</div></div>`;});h+='</div>';}
  if(s.list){h+='<ul>';s.list.forEach(x=>h+=`<li>${x}</li>`);h+='</ul>';}
  if(s.sub) h+=`<p class="sub">${s.sub}</p>`;
  if(s.btn) h+=`<a class="btn" href="#">${s.btn}</a>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
