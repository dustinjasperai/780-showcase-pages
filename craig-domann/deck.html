<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Pro Mindset · Craig Domann</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d0b0e; --panel:#17141a; --rule:#2c2731;
    --accent:#c8202a; --ink:#f3f4f6; --soft:#b8b2bb; --dim:#847c86;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Oswald',sans-serif;font-size:1.06vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:.005em}
  .t-title h1{font-size:5.4vw;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
  .t-title h1 b{color:var(--accent);font-weight:700}
  .t-normal h1{font-size:3.35vw;max-width:88%;font-weight:600}
  .t-normal h1 b{color:var(--accent);font-weight:700}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.46vw;color:var(--soft);margin-top:2.6vh;max-width:78%;line-height:1.58;font-weight:400}
  .sub{font-family:'Inter',sans-serif;font-size:1.78vw;color:var(--soft);margin-top:3.2vh;max-width:80%;line-height:1.5;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Oswald',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:90%;text-transform:uppercase;font-weight:700}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(125% 125% at 50% 0%,#1c0f12 0%,#070506 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:90%;color:var(--ink);font-weight:600}
  .t-dark h1 b{color:var(--accent)}
  .t-cta{background:radial-gradient(125% 125% at 50% 100%,#1c0f12 0%,#070506 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.1vw;max-width:86%;text-transform:uppercase;font-weight:700}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Oswald',sans-serif;border:1.5px solid var(--accent);color:var(--accent);border-radius:100px;padding:1.3vh 1.8vw;font-size:1.2vw;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .bubble-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-bubble{right:6.5%;bottom:7%;width:26vw}
  .corner-bubble{right:6%;bottom:7.2%;width:11vw;opacity:.42}
  .brandline{font-family:'Oswald',sans-serif;font-size:1.32vw;color:var(--soft);margin-top:3.4vh;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.7vw}.t-title h1{font-size:8.8vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:7.4vw}.chip{font-size:2.7vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The Pro Mindset</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: the Performance Bubble. concentric rings of protection with an upward mark rising, safe, inside -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="bubble" viewBox="0 0 280 200">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="140" cy="104" r="82" stroke="#c8202a" opacity="0.20"/>
    <circle cx="140" cy="104" r="60" stroke="#c8202a" opacity="0.40"/>
    <circle cx="140" cy="104" r="38" stroke="#c8202a" opacity="0.78"/>
    <path d="M140 128 L140 82" stroke="#c8202a" opacity="0.95"/>
    <path d="M122 100 L140 82 L158 100" stroke="#c8202a" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Pro <b>Mindset</b>',sub:'A live masterclass on the mental game the best pros run when the moment is biggest, and how any high performer can train the same thing.',brand:true,bubble:'title'},
 {t:'normal',k:'Who this is for',title:'You have the talent. The moment still <b>shrinks</b> you.',body:'The skill is there. The reps are there. But when it counts most the head gets loud, the doubt creeps in, and you play a size smaller than you actually are. If your ceiling is mental and not physical, this hour is for you.'},
 {t:'dark',title:'You do not have a talent problem. You have a <b>mind</b> problem.'},

 {t:'section',idx:'Part One',title:'The Loudest Voice In The Room Is Yours'},
 {t:'normal',k:'Why it happens',title:'Nobody ever coached the <b>mind</b>.',body:'You were coached on technique, on reps, on strategy, for years. The one thing that actually decides the biggest moments, what happens between your ears, you were left to figure out alone. So the pressure arrives and you have no system for it, only nerves.'},
 {t:'normal',k:'The hidden cost',title:'Pressure does not build character. It <b>reveals</b> it.',body:'Under pressure you do not rise to your goals, you fall to your training. If the mind was never trained, the big moment exposes it: the tight throat, the replayed mistake, the race you keep running against everyone but yourself. Talent gets you to the moment. The mind decides what happens once you are in it.'},
 {t:'dark',title:'The pros are not fearless. They are <b>trained</b> for the fear.'},

 {t:'section',idx:'Part Two',title:'The Pro Mindset'},
 {t:'normal',k:'The system',title:'Three dimensions the pros run <b>on repeat</b>.',body:'Pro Mindset is not motivation. It is a system I watched the best run for thirty years: craft a new narrative, elevate your standards, and build an environment that protects your performance. Motivation is gone by Tuesday. A system holds up when the moment gets big.'},
 {t:'normal',k:'Dimension one',title:'Rewrite the <b>story</b> you tell yourself.',body:'Every performer runs an inner narrative, and the story you repeat becomes the ceiling you accept. Rewrite Your Story means authoring it on purpose: rejection is redirection, a setback is a pivot, and the last bad rep does not get to write the next one.'},
 {t:'normal',k:'Dimension two',title:'Break out of the <b>mental prison</b>.',body:'Fear, doubt, and comparison are the bars. Break Free from a Mental Prison and Run Your Own Race are the same move: you raise your own standards and stop handing your confidence to a scoreboard you do not control. Their race is not your race.'},
 {t:'normal',k:'Dimension three',title:'Adopt a <b>next play</b> mentality.',body:'The best in football never carry the last snap into the next one. The mistake is information, not identity. Next play. It is the single most repeatable habit that separates the pros who last from the ones who quietly come apart under the lights.'},
 {t:'normal',k:'The capstone',title:'Master your invincible <b>Performance Bubble</b>.',body:'The Performance Bubble is the environment you build around yourself so the noise, the doubt, and the crowd cannot get in when it matters. Inside it you are calm, present, and hard to rattle. This is where the three dimensions come together into one repeatable state you can step into on command.'},
 {t:'dark',title:'Story, standards, environment. Build the <b>bubble</b> and the moment gets small.'},

 {t:'section',idx:'Part Three',title:'When The Performance Bubble Holds'},
 {t:'normal',k:'The shift',title:'The moment gets bigger. You stay the <b>same size</b>.',body:'Nothing about the pressure changes. The stakes are still the stakes and the lights are still bright. What changes is you: the head goes quiet, the next play comes automatically, and you perform at your ceiling in exactly the moment most people shrink below theirs.'},
 {t:'normal',k:'Why me',title:'I spent thirty years inside the <b>room</b>.',body:'I have been an NFL agent since 1990 and negotiated over a billion dollars in contracts for more than three hundred pros. I watched, up close, who cracked when it counted and who owned it, and it was almost never about talent. Pro Mindset is what I learned from the ones who owned it. This is lived, not theory.'},
 {t:'dark',title:'The mindset that makes pros is <b>trainable</b>. That is the whole point.'},

 {t:'section',idx:'Your next step',title:'Train The Pro Mindset With Me'},
 {t:'normal',k:'Where this goes',title:'Pro Mindset Coaching.',body:'This masterclass is the map. The coaching is where you build the bubble for your own sport, your own stage, or your own business, with the story, the standards, and the next-play habit trained until they hold under real pressure. That is where the shift stops being an idea and becomes yours.'},
 {t:'cta',title:'Ready to train the mind the way you trained the skill?',chips:['Book a call with Craig','Start with the Pro Mindset Playbook'],disc:'Educational content for performers, athletes, and business owners. No specific result, ranking, or outcome is guaranteed. Results vary by person, effort, and circumstance.'},
];

const deck=document.getElementById('deck');
function bubble(kind){return `<svg class="bubble-motif ${kind==='title'?'title-bubble':'corner-bubble'}"><use href="#bubble"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Craig Domann · <b>Pro Mindset</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.bubble) h+=bubble(s.bubble);
  else if(s.t==='title') h+=bubble('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
