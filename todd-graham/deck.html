<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Win the Room — a masterclass with Dr. Todd Graham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Mulish:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4f0;
  --panel:#fffdfb;
  --rule:#e7e2db;
  --ink:#2b2b2b;
  --accent:#e37263;
  --dim:#6f6a66;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;line-height:1.5}
.slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;
  padding:8vh 8vw;position:relative;border-bottom:1px solid var(--rule)}
.k{font-family:"Mulish";font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:.72rem;
  color:var(--accent);margin-bottom:1.1rem}
h1{font-family:"Newsreader";font-weight:700;font-size:clamp(2.6rem,7vw,5.2rem);line-height:1.02;letter-spacing:-.01em}
h2{font-family:"Newsreader";font-weight:600;font-size:clamp(1.9rem,4.6vw,3.2rem);line-height:1.08}
.s{font-family:"Newsreader";font-weight:400;font-size:clamp(1.1rem,2.1vw,1.5rem);color:var(--ink);
  max-width:48ch;margin-top:1.4rem;line-height:1.5}
.sub{font-family:"Mulish";font-weight:600;font-size:clamp(1rem,2vw,1.35rem);color:var(--dim);
  max-width:46ch;margin-top:1.1rem}
ul{list-style:none;margin-top:1.8rem;max-width:50ch}
li{font-family:"Mulish";font-weight:600;font-size:clamp(1.05rem,2vw,1.35rem);padding:.6rem 0 .6rem 1.6rem;
  position:relative;border-top:1px solid var(--rule)}
li:first-child{border-top:none}
li:before{content:"";position:absolute;left:0;top:1.15rem;width:.7rem;height:.7rem;background:var(--accent);
  border-radius:2px;transform:rotate(45deg)}
.grade{font-family:"Newsreader";font-weight:700;font-size:clamp(3rem,9vw,7rem);color:var(--accent);line-height:.9}
.title .grade{margin-bottom:1.6rem}
.num{font-family:"Newsreader";font-weight:700;font-size:1.2rem;color:var(--accent);
  border:2px solid var(--accent);width:2.4rem;height:2.4rem;border-radius:50%;display:flex;
  align-items:center;justify-content:center;margin-bottom:1.2rem}
.part h2{font-size:clamp(2.2rem,6vw,4rem)}
.disc{font-family:"Mulish";font-weight:400;font-size:.9rem;color:var(--dim);max-width:52ch;margin-top:2.4rem;
  padding-top:1.2rem;border-top:1px solid var(--rule)}
.foot{position:absolute;bottom:3vh;left:8vw;font-family:"Mulish";font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;font-size:.62rem;color:var(--dim)}
.cta h2{color:var(--ink)}
.cta .accentbar{width:3.2rem;height:4px;background:var(--accent);margin-bottom:1.8rem}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', grade:"A+", k:"A live masterclass with Dr. Todd Graham", h:"How to Win the Room", s:"The debate coach's scorecard for persuading anyone, under pressure."},
  {t:'promise', h:"What you'll walk out with", pts:["The five things a championship coach looks for the moment you speak","A simple scorecard you can run on yourself before any high-stakes moment","Why presence, not more prep, decides who the room believes"]},
  {t:'audience', k:"Who this is for", h:"People who are judged the moment they open their mouth", pts:["Executives who have to carry a room","Attorneys and advocates who argue for a living","Leaders and spokespeople in front of cameras, boards, and juries"]},
  {t:'trap', k:"The trap", h:"The mistake smart people make", s:"You assume the most prepared, most detailed argument wins. In a real room it almost never does. The person with command wins, and all that preparation goes invisible the second you start talking."},
  {t:'reframe', k:"The reframe", h:"You are not graded on your content", s:"After twenty years grading debates, the pattern is clear. A room decides who is winning long before it weighs the facts. It is scoring presence, clarity, and nerve, and it is doing it fast."},
  {t:'part', k:"Part one", h:"Why the room decides early"},
  {t:'point', h:"Little airtime, big judgments", s:"In a crowded moment you get seconds, not minutes. People form a verdict quickly and then spend the rest of the time confirming it. Your open is most of your grade."},
  {t:'point', h:"Depth is not the differentiator", s:"Everyone in a serious room is prepared. Piling on more detail does not set you apart. How you carry the detail does."},
  {t:'part', k:"Part two", h:"The scorecard: five things I grade"},
  {t:'pillar', k:"Criterion one", h:"Presence", s:"Smile. Appear energetic. Control the room with verbal and nonverbal assertiveness. Look and act like you belong on this stage with these people. Command reads as credibility."},
  {t:'pillar', k:"Criterion two", h:"Authenticity over canned", s:"Forced humor, rehearsed zingers, and awkward aggression all cost you. A room can feel manufactured from a mile away. Real beats polished every time."},
  {t:'pillar', k:"Criterion three", h:"The 'don't do that' rule", s:"The fastest way to look good is to not look bad. Study the mistakes people make under pressure, then build the discipline to never repeat them yourself."},
  {t:'pillar', k:"Criterion four", h:"Own your story", s:"Share your own positions, answers, and stories instead of drowning the room in analysis. Get noticed, but never in a bad way."},
  {t:'pillar', k:"Criterion five", h:"Composure under fire", s:"Pressure is where grades are won or lost. A steady pace, a steady breath, and one clear line to return to keep you in control when the room heats up."},
  {t:'part', k:"Part three", h:"Running the scorecard on yourself"},
  {t:'point', h:"Before the moment", s:"Score your opening on presence and story. If either is weak, fix that first. No amount of extra data rescues a flat open."},
  {t:'point', h:"In the moment", s:"Watch for the 'don't do that' moves creeping in. When they do, slow down and return to your line. Composure resets the room."},
  {t:'whyme', k:"Why me", h:"I have graded the biggest rooms there are", s:"Five national championship teams coached. Three-time national coach of the year. The debate expert CNN has called on since 2011 to grade presidential debates. This is the same scorecard I use on the highest-stakes stages in the country."},
  {t:'recap', k:"The scorecard", h:"The five, in one line", pts:["Presence","Authenticity over canned","The 'don't do that' rule","Own your story","Composure under fire"]},
  {t:'cta', h:"Work with Dr. Todd Graham", s:"If you want this scorecard applied to your real rooms, let's talk. Bring a high-stakes moment that is coming up and we will build your plan to win it.", disc:"Educational content only. No specific result or outcome is guaranteed. Results vary by individual, preparation, and effort."}
];

function esc(x){return (x||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  const root = document.getElementById('deck');
  root.innerHTML = S.map((sl,i)=>{
    let inner = "";
    if(sl.grade) inner += `<div class="grade">${esc(sl.grade)}</div>`;
    if(sl.k) inner += `<div class="k">${esc(sl.k)}</div>`;
    if(sl.t==='cta') inner += `<div class="accentbar"></div>`;
    if(sl.t==='title' && sl.h) inner += `<h1>${esc(sl.h)}</h1>`;
    else if(sl.h) inner += `<h2>${esc(sl.h)}</h2>`;
    if(sl.s) inner += `<p class="s">${esc(sl.s)}</p>`;
    if(sl.pts) inner += `<ul>${sl.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
    if(sl.disc) inner += `<p class="disc">${esc(sl.disc)}</p>`;
    inner += `<div class="foot">Dr. Todd Graham &middot; America's Debate Coach &middot; ${i+1} / ${S.length}</div>`;
    return `<section class="slide ${sl.t}">${inner}</section>`;
  }).join('');
}
render();
</script>
</body>
</html>
