<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Only Option Method - a live masterclass with Megan Yelaney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#4f0020; --panel:#5e0a2b; --rule:rgba(186,55,99,.42);
    --accent:#ba3763; --spark:#e0d23e; --ink:#ecebe8; --mut:rgba(236,235,232,.66);
    --display:"Fraunces",Georgia,serif; --body:"Space Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#2c0012;color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 18px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:60px 58px;margin:0 0 26px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:attr(data-n);position:absolute;right:26px;bottom:20px;
    font-size:13px;letter-spacing:.14em;color:var(--mut)}
  .kick{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:22px}
  h1{font-family:var(--display);font-weight:600;font-size:58px;line-height:1.04;
    letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;
    letter-spacing:-.01em;margin-bottom:10px}
  .promise{font-size:22px;color:var(--mut);margin-top:26px;max-width:40ch;line-height:1.45}
  p.lead{font-size:21px;line-height:1.5;max-width:52ch;color:var(--ink)}
  p.body{font-size:19px;line-height:1.55;max-width:54ch;color:var(--mut);margin-top:16px}
  .big{font-family:var(--display);font-size:46px;line-height:1.1;letter-spacing:-.01em;max-width:22ch}
  .big .a{color:var(--spark)}
  .accent{color:var(--accent)}
  ul.list{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
  ul.list li{font-size:20px;line-height:1.4;padding-left:34px;position:relative;max-width:50ch}
  ul.list li::before{content:"";position:absolute;left:0;top:9px;width:14px;height:14px;
    border-radius:50%;background:var(--accent)}
  ul.list li.spark::before{background:var(--spark)}
  .num{font-family:var(--display);font-size:20px;color:var(--spark);font-weight:700;
    letter-spacing:.06em;margin-bottom:14px}
  .tri{display:flex;gap:18px;margin-top:30px;flex-wrap:wrap}
  .tri .c{flex:1;min-width:210px;background:var(--panel);border:1px solid var(--rule);
    border-radius:14px;padding:26px}
  .tri .c h3{font-family:var(--display);font-size:24px;margin-bottom:10px}
  .tri .c p{font-size:16px;color:var(--mut);line-height:1.45}
  .cta h1{font-size:52px}
  .disc{font-size:14px;color:var(--mut);margin-top:30px;max-width:60ch;line-height:1.5}
  .step{font-size:21px;margin-top:22px;color:var(--ink)}
  .step b{color:var(--spark)}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:420px}h1{font-size:40px}
    h2{font-size:30px}.big{font-size:32px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:'A live masterclass with Megan Yelaney',
    h:'The Only Option Method',
    promise:'How to name the coaching method you already use, so the right clients see you as the only option, not a better version of everyone else.' },

  {t:'who',
    kick:'Who this is for',
    h:'You are good at what you do. You are also invisible.',
    lead:'You have real clients and real results. But online, you sound like every other coach in your niche, and the ones winning the attention are not better than you. They are just clearer.',
    body:'This is for the established coach who is done blending in and ready to be impossible to ignore.' },

  {t:'reframe',
    kick:'The uncomfortable part',
    big:'The problem is not your <span class="a">offer</span>. It is that your method has no name.' },

  {t:'part', num:'Part One', h:'Why "better" does not sell',
    lead:'Buyers cannot compare "better." It is invisible to them.',
    body:'When every coach promises the same transformation, a prospect has no way to tell you apart, so they default to price, or they wait. "Better than them" is a claim they cannot verify in three seconds of scrolling.' },

  {t:'point',
    kick:'What buyers actually do',
    h:'They buy "different," because different they can see.',
    body:'A named method turns your process into something a stranger can read in three seconds and go, oh, THAT is what they do, and that is exactly what I need. Different is legible. Better is not.' },

  {t:'point',
    kick:'The cost of staying unnamed',
    h:'Unnamed work is easy to delay.',
    body:'When people cannot quite describe what makes you you, they say "let me think about it." Clarity around your process is what kills that delay, in any season, in any algorithm.' },

  {t:'part', num:'Part Two', h:'The Unique Coaching Method',
    lead:'Three moves take the thing you already do naturally with clients and turn it into the reason they choose you.',
    body:'You are not inventing anything new. You are naming what is already working.' },

  {t:'point',
    kick:'Move one',
    h:'Name the method you already use.',
    body:'Surface the framework that already lives inside your work, even if you have never named it, even if you make it custom for every client. Put words to what you do on instinct. That name is the start of being the only option.' },

  {t:'point',
    kick:'Move two',
    h:'Put guardrails on your process.',
    body:'Give your method simple, repeatable steps so it is easy to understand and easy to trust. Guardrails make your work look like a system, not a vibe, and a system is something a buyer can say yes to.' },

  {t:'point',
    kick:'Move three',
    h:'Write your brand positioning statement.',
    body:'Turn the method into a single line built on what you do and why it gets results. One sentence that lets you write content without starting from scratch, and sell with the price on the page.' },

  {t:'part', num:'The engine', h:'Story, positioning, proof',
    lead:'Once the method has a name, three things make the right clients say "I am in."',
    tri:[
      {h:'Story', p:'The parts of your story that create demand, not the parts that are just noise.'},
      {h:'Positioning', p:'The method, said so clearly its value is understood immediately.'},
      {h:'Proof', p:'Results framed so a hesitant buyer moves from "interesting" to "I am in."'} ] },

  {t:'point',
    kick:'What changes',
    h:'You stop convincing and start being recognized.',
    body:'When story, positioning, and proof are aligned, the right people recognize why working with you makes sense for them right now. You explain what you do in a way that feels confident, natural, and actually lands.' },

  {t:'part', num:'Part Three', h:'When your method has a name',
    list:[
      'Content you can write quickly, because it all points back to one method.',
      'A message that stays consistent across your offers and your lead generation.',
      'Fewer "let me think about it" replies, because the value is obvious.',
      'Buyers who come in already sold on the method, not needing to be sold on you.' ] },

  {t:'why',
    kick:'Why me',
    h:'I built a multi-million-dollar brand on this exact idea.',
    body:'I am Meg Yelaney. I coach online coaches who are done sounding like everyone else, I host the Business Not As Usual podcast, and naming my own method is the thing that took me from a lost year in business to closing launches with the price on the page.' },

  {t:'recap',
    kick:'The whole thing in one line',
    big:'Name the method you already run, and you become the <span class="a">only option</span>.' },

  {t:'cta',
    kick:'Become the only option',
    h:'Ready to name yours?',
    step:'If you want help turning the method you already use into the reason clients choose you, the next step is to <b>apply for private coaching with me</b>.',
    disc:'This masterclass is educational. No specific income or result is guaranteed; results vary based on your work, your market, and your offer.' }
];

function esc(x){return x==null?'':x;}
function render(){
  const deck = document.getElementById('deck');
  S.forEach((s,i)=>{
    const el = document.createElement('section');
    el.className = 'slide' + (s.t==='cta'?' cta':'');
    el.setAttribute('data-n', (i+1)+' / '+S.length);
    let h = '';
    if(s.kick) h += '<div class="kick">'+esc(s.kick)+'</div>';
    if(s.num) h += '<div class="num">'+esc(s.num)+'</div>';
    if(s.t==='title'){ h += '<h1>'+esc(s.h)+'</h1><div class="promise">'+esc(s.promise)+'</div>'; }
    else if(s.t==='reframe' || s.t==='recap'){ h += '<div class="big">'+esc(s.big)+'</div>'; }
    else {
      if(s.h) h += '<h2>'+esc(s.h)+'</h2>';
      if(s.lead) h += '<p class="lead">'+esc(s.lead)+'</p>';
      if(s.body) h += '<p class="body">'+esc(s.body)+'</p>';
      if(s.list){ h += '<ul class="list">'; s.list.forEach((li,j)=>{ h += '<li'+(j%2?' class="spark"':'')+'>'+esc(li)+'</li>'; }); h += '</ul>'; }
      if(s.tri){ h += '<div class="tri">'; s.tri.forEach(c=>{ h += '<div class="c"><h3>'+esc(c.h)+'</h3><p>'+esc(c.p)+'</p></div>'; }); h += '</div>'; }
      if(s.step) h += '<div class="step">'+s.step+'</div>';
      if(s.disc) h += '<div class="disc">'+esc(s.disc)+'</div>';
    }
    el.innerHTML = h;
    deck.appendChild(el);
  });
}
render();
</script>
</body>
</html>
