<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 to 50 — The Operating System Behind a 50-Deal Year</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EFE6; --panel:#FFFFFF; --rule:#D8D0BE; --ink:#24231F;
    --accent:#1E5A46; --accent-2:#B9823B; --muted:#6B675E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 52px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(0,0,0,0.02)}
  .slide.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.green{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  .slide.dark .kick,.slide.green .kick{color:var(--accent-2)}
  h1{font-family:"Spectral",serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"Spectral",serif;font-weight:600;font-size:36px;line-height:1.14;margin-bottom:16px}
  p.lead{font-size:20px;color:var(--muted);margin-top:18px;max-width:40ch}
  .slide.dark p.lead,.slide.green p.lead{color:rgba(243,239,230,.82)}
  p.body{font-size:18px;margin-top:14px;max-width:52ch}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:19px;padding:12px 0 12px 26px;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:2px;background:var(--accent)}
  .slide.dark li,.slide.green li{border-color:rgba(255,255,255,.14)}
  .slide.dark li:before,.slide.green li:before{background:var(--accent-2)}
  li b{font-weight:600}
  .lever{font-family:"Spectral",serif;font-size:30px;color:var(--accent);font-weight:600}
  .big{font-family:"Spectral",serif;font-size:72px;font-weight:700;color:var(--accent)}
  .slide.dark .big{color:var(--accent-2)}
  .foot{font-size:14px;color:var(--muted);margin-top:28px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.45}
  .num{font-family:"Spectral",serif;color:var(--accent-2);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:'title', kick:"A live masterclass with Josh Lavik", h:"5 to 50", sub:"The operating system behind a 50-deal year, without buying your way there."},
  {t:'promise', kick:"The promise", h:"Fifty closings is a system, not a sprint.", body:"In the next 60 minutes you'll see the exact levers that take a solo agent from 5 deals a year to 50, and the daily discipline that keeps them running."},
  {t:'whofor', kick:"Who this is for", h:"The agent who is capped, not lazy.", list:["You're closing 5 to 15 deals and working plenty hard for it","You've tried buying more leads and the ceiling didn't move","You want a business that grows without adding hours"]},
  {t:'trap', kick:"The trap", h:"“I just need more leads.”", body:"It's the first thing every agent reaches for, and it's why most stall. More leads on top of a broken system just means more dropped balls and more burnout.", dark:true},
  {t:'reframe', kick:"The reframe", h:"Volume is an output, not an input.", body:"You don't get to 50 by pouring in more leads. You get there by building the system that turns the leads you already touch into closings, on repeat.", green:true},
  {t:'part', kick:"Part one", h:"Why good agents plateau", body:"The plateau is almost never a lead problem. It's three things leaking at once: inconsistent activity, no leverage, and a client experience that doesn't come back."},
  {t:'part', kick:"Part two", h:"The 5-to-50 operating system", body:"Three levers. Pull all three and volume compounds instead of resetting every January."},
  {t:'lever', kick:"Lever one", lever:"Production", h:"Consistent activity, every day.", body:"The agents who scale aren't the most talented, they're the most consistent. Production is the daily lead activity that never stops, in good markets and bad."},
  {t:'lever', kick:"Lever two", lever:"Operations", h:"Leverage so it runs without you.", body:"Fifty deals can't live in your head. Operations is the systems, checklists, and support that let the business produce without depending on your hours."},
  {t:'lever', kick:"Lever three", lever:"Client Experience", h:"An experience that comes back.", body:"The cheapest deal you'll ever close is the next one from a client you already have. A repeatable client experience turns one closing into the next three."},
  {t:'engine', kick:"The engine", h:"The 21-Day Challenge", body:"Levers don't pull themselves. The daily disciplines, lead follow-up, database touches, pipeline work, done for 21 straight days, are what separate a top producer from everyone with the same tools.", dark:true},
  {t:'mastermind', kick:"Accountability", h:"The weekly top agent brain-share", body:"Everyone brings their best working idea and leaves with one to implement. Volume is a team sport, even for a solo agent."},
  {t:'math', kick:"What compounds", h:"How 50 actually stacks up", list:["Steady Production fills the top of the pipeline","Operations keeps deals from falling through","Client Experience sends them back and refers the next"], body:"Three levers, each feeding the next. That loop is a 50-deal year."},
  {t:'part', kick:"Part three", h:"What a 50-deal year feels like", body:"Predictable pipeline. Fewer fires. A calendar you control instead of one that controls you. The volume is the byproduct of the system being in place."},
  {t:'whyme', kick:"Why Josh", h:"He built this on his own book first.", list:["21 years in real estate, CRS, SRS, and LUXE designations","Took his own business from 5 transactions a year to 50","Broker-owner in Wisconsin; his company acquired RE/MAX Affiliates","Hosts The Better Agent Podcast and a weekly top agent mastermind"]},
  {t:'recap', kick:"The recap", h:"Three levers. One discipline.", list:["Production, consistent daily activity","Operations, leverage so it scales","Client Experience, referrals that compound","The 21-Day Challenge keeps all three running"], green:true},
  {t:'cta', kick:"Your next step", h:"Build your 50-deal year.", body:"If you want the operating system mapped to your market, grab a time with the Lavik team and we'll build your plan together.", disc:"This masterclass is educational. No income or result is guaranteed. Results vary and depend on your market, your effort, and your execution."}
];
function esc(x){return x==null?"":String(x)}
function render(){
  const deck=document.getElementById('deck');
  S.forEach(function(s){
    const d=document.createElement('section');
    d.className='slide'+(s.dark?' dark':'')+(s.green?' green':'');
    let html='';
    if(s.kick) html+='<div class="kick">'+esc(s.kick)+'</div>';
    if(s.t==='title'){ html+='<h1>'+esc(s.h)+'</h1>'; if(s.sub) html+='<p class="lead">'+esc(s.sub)+'</p>'; }
    else { html+='<h2>'+esc(s.h)+'</h2>'; }
    if(s.lever) html+='<div class="lever">'+esc(s.lever)+'</div>';
    if(s.body) html+='<p class="body">'+esc(s.body)+'</p>';
    if(s.list){ html+='<ul>'; s.list.forEach(function(it){ html+='<li>'+esc(it)+'</li>'; }); html+='</ul>'; }
    if(s.disc) html+='<div class="disc">'+esc(s.disc)+'</div>';
    d.innerHTML=html;
    deck.appendChild(d);
  });
}
render();
</script>
</body>
</html>
