<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fierce Freedom Inside Medicine, with Dr. Yashika Dooley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#232619;
    --panel:#2f3324;
    --rule:#4d5536;
    --accent:#e4bdbb;
    --ink:#e5e4e0;
    --muted:#b9bcae;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:54px 48px;margin:0 0 20px;min-height:460px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-family:"DM Serif Display",Georgia,serif;text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"DM Serif Display",Georgia,serif;font-weight:700;font-size:52px;line-height:1.05;letter-spacing:.01em}
  h2{font-family:"DM Serif Display",Georgia,serif;font-weight:600;font-size:36px;line-height:1.1;margin-bottom:16px}
  .lede{font-size:21px;color:var(--muted);margin-top:20px;max-width:40ch}
  p.body{font-size:19px;margin-top:14px;max-width:52ch}
  ul{margin:18px 0 0 22px;max-width:52ch}
  li{font-size:19px;margin:10px 0}
  .big{font-family:"DM Serif Display",Georgia,serif;font-weight:700;font-size:40px;color:var(--accent);line-height:1.05}
  .mark{color:var(--accent)}
  .foot{font-size:14px;color:var(--muted);margin-top:26px;max-width:56ch}
  .n{font-family:"DM Serif Display",Georgia,serif;color:var(--rule);font-size:15px;letter-spacing:.2em;margin-bottom:10px}
  .cta h1{font-size:46px}
  .pill{display:inline-block;font-family:"DM Serif Display",Georgia,serif;text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--bg);background:var(--accent);padding:12px 22px;border-radius:999px;margin-top:26px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A free masterclass for physician women', h:'Fierce Freedom Inside Medicine', lede:'How high-achieving doctors take back control of their mind and their time, without leaving the career they earned.'},
  {t:'whofor', k:'Who this is for', h:'You are good at the job. The job is eating the life.', body:'You trained hard, you are respected, and you still feel behind by 9am. This hour is for the physician who loves medicine and is quietly running on empty, especially the women holding it all together.'},
  {t:'trap', k:'The trap', h:'You have tried to fix it with the calendar.', body:'Time-blocking apps. A new planner. Waking up earlier. Each one works for a week, then the overwhelm floods back in. You start to wonder if the only exit is leaving medicine.'},
  {t:'reframe', k:'The reframe', h:'It was never a time problem first.', lede:'The hours are real. But the thing that eats them is upstream of the schedule. Until you fix that, no system holds.'},
  {t:'part', n:'Part One', h:'The hidden tax on your day', body:'Before we touch a calendar, we name what is actually draining you.'},
  {t:'point', k:'The real cost', h:'Overthinking is the tax.', body:'The chart you re-read at 11pm. The decision you replayed in the car. The guilt that follows you home. None of it shows on the schedule, and all of it spends the hour you were trying to protect.'},
  {t:'point', k:'The loop', h:'Perfectionism keeps the meter running.', body:'The same standard that made you a strong physician turns on you off the clock. More effort stops buying more peace. That is the signal that the lever you are pulling is the wrong one.'},
  {t:'part', n:'Part Two', h:'The three levers', body:'Mind, Time, Effort. Pulled in that order, on purpose.'},
  {t:'lever', k:'Lever one', h:'Mind', body:'Quiet the overthinking first. When the spiral slows, you get the hour back before you have changed a single thing on the calendar. This is where the real time lives.'},
  {t:'lever', k:'Lever two', h:'Time', body:'Now the calendar holds, because it is no longer carrying the weight of a busy mind. We place the hours against what actually matters to you, not what guilt demands.'},
  {t:'lever', k:'Lever three', h:'Effort', body:'Spend your energy where it compounds and stop spending it where it only soothes. Less heroics, more leverage. The career gets lighter without getting smaller.'},
  {t:'part', n:'The method', h:'Assess, Identify, Develop', body:'A clinician can follow this, because it works like clinical reasoning.'},
  {t:'step', k:'Step one', h:'Assess', body:'Map where the time and the energy honestly go for one ordinary week. No judgment, just data, the same way you would work up a case.'},
  {t:'step', k:'Step two', h:'Identify', body:'Name the specific stress points. Not "I am busy," but the exact three moments that set the spiral off. Precision is what makes this fixable.'},
  {t:'step', k:'Step three', h:'Develop', body:'Build the clear path out of each one. Small, concrete, yours. Then we protect it so the next hard week does not wash it away.'},
  {t:'part', n:'Part Three', h:'The week you actually want', body:'Not a different job. The same job, carried differently.'},
  {t:'picture', k:'The week, reclaimed', h:'Home for dinner, and still a surgeon.', body:'The spiral is shorter. The evening belongs to you again. You are not choosing between the career and the life, you are finally holding both, on your terms.'},
  {t:'whyme', k:'Why me', h:'I have done the hard version of this.', body:'I am Dr. Yashika Dooley, a board certified OBGYN and surgeon, an Air Force Colonel, and an academic leader and assistant professor. I trained at Harvard Medical School. For over ten years I have coached physicians, and I built the Thrive Together Conference for physician women of color. I teach this because I needed it first.'},
  {t:'recap', k:'The one idea', h:'Start with the mind, and the hours follow.', body:'Overthinking is the tax. Quiet it, place your time with intention, spend your effort where it compounds. That is how you get fierce freedom without walking away from medicine.'},
  {t:'cta', k:'Your next step', h:'Ready to take the hour back?', body:'If this is the version of your career you want, the next step is to work with me directly. Come join the coaching, and we will build your path together.', disc:'This masterclass is educational. No specific result, income, or outcome is guaranteed. Results vary by individual.'}
];

const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'cta' ? ' cta' : '');
  let html = '';
  if (s.n) html += '<div class="n">' + s.n + '</div>';
  if (s.k) html += '<div class="kicker">' + s.k + '</div>';
  if (s.t === 'title') { html += '<h1>' + s.h + '</h1>'; if (s.lede) html += '<p class="lede">' + s.lede + '</p>'; }
  else if (s.t === 'lever' || s.t === 'step') { html += '<div class="big">' + s.h + '</div>'; if (s.body) html += '<p class="body">' + s.body + '</p>'; }
  else { html += '<h2>' + s.h + '</h2>'; if (s.lede) html += '<p class="lede">' + s.lede + '</p>'; if (s.body) html += '<p class="body">' + s.body + '</p>'; }
  if (s.disc) { html += '<div class="pill">Join the coaching</div>'; html += '<p class="foot">' + s.disc + '</p>'; }
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
