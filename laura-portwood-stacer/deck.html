<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Book Proposal That Gets a Yes: Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f2e36;
    --panel:#184754;
    --ink:#f3efe6;
    --rule:#5f9aa4;
    --accent:#9ad2db;
    --head:'Montserrat', system-ui, sans-serif;
    --body:'Newsreader', Georgia, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid #21596a;border-radius:10px;padding:56px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.1;letter-spacing:-.01em;margin-bottom:18px;color:#ffffff}
  h2{font-family:var(--head);font-weight:700;font-size:30px;line-height:1.14;margin-bottom:16px;color:#ffffff}
  .lead{font-size:20px;color:#e7efee}
  .big{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.16;color:var(--accent)}
  p{font-size:19px;margin-bottom:12px;color:#e2ebea}
  .sub{font-size:17px;color:var(--rule)}
  ul{list-style:none;margin-top:8px}
  li{font-size:19px;padding:12px 0 12px 34px;border-bottom:1px solid #27606f;position:relative;color:#e9f0ef}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:20px;width:12px;height:2px;background:var(--accent)}
  .part{background:#0c272e}
  .part .kick{color:var(--rule)}
  .part h1{color:var(--accent)}
  .cta{background:#0a2127;border:none}
  .cta::before{background:var(--accent)}
  .disc{font-size:13px;color:#8fb6bd;margin-top:22px;font-family:var(--head);font-weight:600;line-height:1.5}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">A live masterclass</div>
    <h1>The Book Proposal That Gets a Yes</h1>
    <p class="lead">How to write an academic book proposal university presses actually say yes to.</p>
    <p class="sub">With Laura Portwood-Stacer, PhD. Author of The Book Proposal Book and Make Your Manuscript Work (Princeton University Press).</p>
  `},
  {t:'list', cls:'', html:`
    <div class="kick">Who this is for</div>
    <h2>This is for you if</h2>
    <ul>
      <li>You have a finished or nearly finished manuscript, or a dissertation you want to turn into a book.</li>
      <li>You want a contract with a university press, not just a pile of pages.</li>
      <li>Your proposal keeps getting rewritten, or quietly passed over.</li>
      <li>Nobody ever actually taught you what a book proposal is supposed to contain.</li>
    </ul>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">The trap</div>
    <h2>You were trained to write for your committee.</h2>
    <p class="big">Not for an acquisitions editor.</p>
    <p class="sub">Those two readers want very different things, and almost no graduate program ever tells you that.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">The hard truth</div>
    <h2>A brilliant manuscript with a weak proposal never gets read.</h2>
    <p>The proposal is the gate. It decides whether an editor ever opens your chapters. Get the proposal right and the years of research finally get the reading they earned.</p>
  `},
  {t:'part', cls:'part', html:`
    <div class="kick">Part One</div>
    <h1>Why good scholars get passed over</h1>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">The real reason</div>
    <h2>It is almost never the research.</h2>
    <p>It is that the proposal does not answer the three questions an editor asks first:</p>
    <p class="big">Who is this book for? How is it different? Will anyone buy it?</p>
  `},
  {t:'part', cls:'part', html:`
    <div class="kick">Part Two</div>
    <h1>The proposal, demystified</h1>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">The distinction that changes everything</div>
    <h2>A prospectus is not a proposal.</h2>
    <p>The prospectus is the single document that pitches your book. The proposal is the larger package: the prospectus plus your CV and sample material. Most authors confuse the two and stall before they start.</p>
  `},
  {t:'list', cls:'', html:`
    <div class="kick">The package</div>
    <h2>What a proposal actually contains</h2>
    <ul>
      <li>A project description that sells the idea, not just summarizes it.</li>
      <li>Comparable titles and a clear sense of market fit.</li>
      <li>An annotated table of contents with chapter summaries.</li>
      <li>An author biography that earns an editor's trust.</li>
      <li>Manuscript specifications and current status.</li>
    </ul>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">The lens</div>
    <h2>Write for the acquisitions editor, on purpose.</h2>
    <p>Editors do not acquire on scholarly merit alone. They acquire on audience, on fit with their list, and on a clear sense of who will actually buy the book. Once you can see the decision through their eyes, the proposal almost writes itself.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">Comps</div>
    <h2>Comparable titles are not a formality.</h2>
    <p>They are how you tell an editor exactly where your book sits on the shelf, who it stands beside, and why there is still room for it. Done well, the comps section is the most persuasive page in the whole proposal.</p>
  `},
  {t:'part', cls:'part', html:`
    <div class="kick">Part Three</div>
    <h1>From blank page to sent proposal</h1>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">The path</div>
    <h2>One proposal. Twenty small steps.</h2>
    <p>The whole proposal, broken into twenty completable steps. You are never staring down the entire thing at once. You finish one step, then the next, and a finished proposal is the result.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">The mindset</div>
    <h2>The good-enough manuscript.</h2>
    <p>Finished and submitted beats perfect and unsent, every single time. Confidence comes from shipping the proposal, not from one more revision nobody asked for.</p>
  `},
  {t:'list', cls:'', html:`
    <div class="kick">The outcome</div>
    <h2>In six weeks you will have</h2>
    <ul>
      <li>A project description that sells the idea.</li>
      <li>A comparable-titles section an editor respects.</li>
      <li>An annotated table of contents.</li>
      <li>A short author bio that earns trust.</li>
      <li>A proposal that is ready to send.</li>
    </ul>
  `},
  {t:'credible', cls:'credible', html:`
    <div class="kick">Why listen to me</div>
    <h2>Laura Portwood-Stacer, PhD</h2>
    <ul>
      <li>PhD in Communication from USC Annenberg. Taught at NYU for three years.</li>
      <li>Author of The Book Proposal Book and Make Your Manuscript Work, both from Princeton University Press.</li>
      <li>Thousands of scholars guided through the proposal, to contracts with university presses.</li>
      <li>Former associate editor of a peer-reviewed journal. I have read the pile from the other side.</li>
    </ul>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">What changes</div>
    <h2>You stop guessing what editors want.</h2>
    <p>You start writing to it, on purpose. The book you spent years on finally gets the serious reading it deserves, and the contract conversation becomes possible.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">One last thing</div>
    <p class="big">Your research earned its place.</p>
    <p>Let us make sure the proposal does too.</p>
  `},
  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h1>Join the live masterclass</h1>
    <p>Bring your project. Leave knowing exactly what your proposal needs and how to write each piece. When you are ready to build the full proposal with feedback, the Book Proposal Accelerator is the next step.</p>
    <p class="disc">This masterclass is educational. No book contract, income, or result is guaranteed. Results vary based on your work, your manuscript, and each publisher's own decisions.</p>
  `}
];
const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  el.innerHTML = s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
