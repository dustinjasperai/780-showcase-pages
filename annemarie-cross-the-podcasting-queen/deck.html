<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Invisible to Influential | A Masterclass with Annemarie Cross</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf8fc;       /* near-white, faint purple tint from her ground */
    --panel:#f2ecf7;    /* pale purple panel */
    --rule:#e3d6ef;     /* hairline */
    --ink:#241033;      /* deep aubergine, from her #3a015c darkened for body */
    --ink-soft:#5a4a6c; /* muted */
    --accent:#3a015c;   /* her exact H1/link purple */
    --gold:#d89622;     /* her exact secondary gold */
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:8vmin 11vmin;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  /* soft glow */
  .slide::before{content:'';position:absolute;top:-18%;right:-8%;width:60vmin;height:60vmin;
    background:radial-gradient(circle,rgba(216,150,34,.12),transparent 62%);pointer-events:none;z-index:0}
  .spine{position:absolute;left:11vmin;top:8vmin;bottom:8vmin;width:2px;
    background:linear-gradient(var(--accent),rgba(58,1,92,0));opacity:.5}
  .inner{position:relative;z-index:1;max-width:1040px}
  .kicker{font-family:'Oswald',sans-serif;font-size:1.1rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:2.4vmin}
  h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:8vmin;line-height:1.04;letter-spacing:.005em;text-transform:uppercase}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:5.6vmin;line-height:1.08;margin-bottom:2.4vmin;letter-spacing:.005em}
  .lead{font-size:2.5vmin;line-height:1.5;color:var(--ink-soft);margin-top:3vmin;max-width:60ch}
  .accent{color:var(--accent)}
  .gold{color:var(--gold)}
  .em{font-family:'Oswald',sans-serif;font-style:normal;color:var(--gold)}
  ul{list-style:none;margin-top:3.4vmin;display:flex;flex-direction:column;gap:2.1vmin}
  li{font-size:2.5vmin;line-height:1.4;padding-left:3.4vmin;position:relative;color:var(--ink);max-width:64ch}
  li::before{content:'';position:absolute;left:0;top:1.05vmin;width:1.3vmin;height:1.3vmin;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(58,1,92,.12)}
  li b{color:var(--ink);font-weight:700}
  li span{color:var(--ink-soft)}
  .part-no{font-family:'Oswald',sans-serif;font-size:3vmin;color:var(--gold);margin-bottom:1.2vmin;letter-spacing:.06em;text-transform:uppercase}
  .big{font-family:'Oswald',sans-serif;font-size:6.6vmin;line-height:1.1;font-weight:600;text-transform:uppercase}
  .note{margin-top:4vmin;font-size:1.7vmin;color:var(--ink-soft);max-width:70ch;line-height:1.5}
  .cta-actions{margin-top:4vmin;display:flex;flex-direction:column;gap:1.4vmin}
  .cta-actions .step{font-size:2.6vmin;color:var(--ink)}
  .cta-actions .step b{color:var(--accent)}
  .pill{display:inline-block;margin-top:3vmin;background:var(--accent);color:#fff;font-weight:600;
    font-size:2.2vmin;padding:1.6vmin 3.4vmin;border-radius:100px;font-family:'Montserrat',sans-serif}
  .who-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.4vmin;margin-top:3.4vmin}
  .who-grid .cell{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:3vmin 3.2vmin}
  .who-grid .cell .t{font-family:'Oswald',sans-serif;font-size:2.6vmin;color:var(--accent);margin-bottom:1vmin;text-transform:uppercase;letter-spacing:.02em}
  .who-grid .cell p{font-size:2vmin;color:var(--ink-soft);line-height:1.42}
  #nav{position:fixed;bottom:3.2vmin;right:4vmin;z-index:5;display:flex;align-items:center;gap:2.2vmin;
    font-family:'Montserrat',sans-serif;font-size:1.7vmin;color:var(--ink-soft)}
  #nav button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);width:4.6vmin;height:4.6vmin;
    border-radius:50%;font-size:2.2vmin;cursor:pointer;transition:.2s}
  #nav button:hover{border-color:var(--accent);color:var(--accent)}
  .brandfoot{position:fixed;bottom:3.6vmin;left:4vmin;z-index:5;font-family:'Oswald',sans-serif;
    font-size:1.9vmin;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
  .progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:6;transition:width .3s}
  @media(max-width:760px){h1{font-size:10vmin}.lead,li,.cta-actions .step{font-size:3.4vmin}.who-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<div id="stage"></div>
<div class="brandfoot">Annemarie Cross &middot; Industry Thought Leader Academy</div>
<div id="nav"><span id="count"></span><button onclick="go(-1)" aria-label="Previous">&#8249;</button><button onclick="go(1)" aria-label="Next">&#8250;</button></div>
<script>
const S=[
 {t:'title', kicker:'A Live Masterclass with Annemarie Cross',
  h:'Invisible to Influential', lead:'How to become the recognized, sought-after authority in your niche, and enroll dream clients with ease, using the expertise you already have and a podcast as your platform.'},

 {t:'promise', kicker:'What this hour is for',
  h2:'You are the best expert your ideal clients have never heard of.',
  lead:'In the next hour I want to show you the method I have taught coaches and consultants for years: how to build a brand that is distinguishable and uncopyable, turn your voice into a platform, and move from being a quiet expert to the name people in your field already trust.'},

 {t:'audience', kicker:'Who this is for',
  h2:'If any of these is you, you are in the right room.',
  who:[['The quiet expert','You are genuinely good at what you do, and the right people still have no idea you exist.'],
       ['The busy coach','You are trading hours for dollars and cannot see how to become known without adding more work.'],
       ['The consultant ready to lead','You want to be seen as the go-to voice in your field, not one more option in a crowded market.'],
       ['The would-be podcaster','You know you should have a platform of your own, and you have never had a system that turns it into clients.']]},

 {t:'trap', kicker:'The trap',
  h2:'The advice you were handed.',
  bullets:['Post more, show up everywhere, and hope the algorithm eventually notices you.',
           '<b>Chase visibility for its own sake</b>, so a good week of content still brings no aligned clients.',
           'Sound like every other coach in your niche, because you never built a brand that is unmistakably yours.',
           'And treat a podcast, if you start one at all, as <span>a hobby that never connects to enrollment.</span>']},

 {t:'reframe', kicker:'The real problem',
  big:'The problem is not that you are <span class="accent">not good enough.</span><br>It is that the expertise you were <span class="gold">entrusted with</span> is still invisible.',
  lead:'Every gap above has the same root. You have real depth, and no system that carries it to the people who need it and turns it into enrolled clients.'},

 {t:'part', partno:'Part One', h2:'Why good experts stay invisible'},

 {t:'problem', kicker:'Part One',
  h2:'Being excellent is not the same as being known.',
  bullets:['The market does not reward the most skilled coach. It rewards the one it recognizes and trusts first.',
           'Expertise that lives only in sessions and DMs never compounds. Nobody new ever meets it.',
           'Two things are missing between your depth and your recognition, and closing that gap is the whole of this work.']},

 {t:'problem2', kicker:'Part One',
  h2:'The two things standing in the way.',
  bullets:['<b>No distinctive brand.</b> <span>When you sound like every other coach, buyers have no reason to choose you over the cheaper or louder option.</span>',
           '<b>No platform of your own.</b> <span>Without a place where new people can experience your thinking at length, you stay a well-kept secret.</span>']},

 {t:'part', partno:'Part Two', h2:'The Industry Thought Leader method'},

 {t:'pillar', partno:'Pillar One', kicker:'Part Two',
  h2:'Build visibility as THE choice.',
  lead:'Not a choice, THE choice. Before any tactic, you build a signature brand that is distinguishable, uncopyable, and irresistible, so the right clients know at a glance that you are the one for them.'},

 {t:'detail', kicker:'Pillar One, in practice',
  h2:'A brand that is unmistakably yours.',
  bullets:['<b>Own a clear position.</b> <span>One audience, one promise, stated so plainly that the right person feels it was written for them.</span>',
           '<b>Name what you know.</b> <span>Turn your way of working into a signature framework, so your method has a shape people can follow and refer.</span>',
           '<b>Sound like no one else.</b> <span>A point of view and a voice that separate you from every other coach in your niche.</span>']},

 {t:'pillar', partno:'Pillar Two', kicker:'Part Two',
  h2:'Turn your podcast into your platform.',
  lead:'This is the mechanism I am known for. A show is the fastest way for someone who has never heard of you to spend real time with your thinking, and to leave already trusting you.'},

 {t:'detail', kicker:'Pillar Two, in practice',
  h2:'The credibility engine, done on purpose.',
  bullets:['<b>Lead with purpose, not vanity.</b> <span>Every episode built to serve a specific listener and move them one honest step closer.</span>',
           '<b>Borrow trust deliberately.</b> <span>The right guests and conversations put you beside the names your audience already respects.</span>',
           '<b>Compound your authority.</b> <span>A back catalogue that keeps working, so your best thinking reaches new people long after you record it.</span>',
           '<b>Connect it to the offer.</b> <span>A path from listener to lead, so the show grows the business and not just the download count.</span>']},

 {t:'pillar', partno:'Pillar Three', kicker:'Part Two',
  h2:'Generate leads and enroll with ease.',
  lead:'Visibility without a path to enrollment is just noise. The Core Business Foundations turn attention into aligned clients, without pressure and without chasing.'},

 {t:'detail', kicker:'Pillar Three, in practice',
  h2:'From new listener to dream client.',
  bullets:['<b>One irresistible opt-in.</b> <span>A single, genuinely useful offer that captures the right people and starts the relationship.</span>',
           '<b>Know, like, and trust, on purpose.</b> <span>A simple sequence of touchpoints that deepens trust before any ask.</span>',
           '<b>Enrollment conversations, not sales pressure.</b> <span>By the time you speak, they already believe in your method, so the call is a fit check, not a pitch.</span>']},

 {t:'part', partno:'Part Three', h2:'When the method is working'},

 {t:'looks', kicker:'Part Three',
  h2:'The go-to voice in your niche.',
  bullets:['A steady stream of aligned clients who found <b>you</b>, because your brand is unmistakably yours.',
           'A show people binge, share, and quote, that quietly does your selling before you ever speak.',
           'Enrollment that feels like a natural next step, because trust was built long before the call.',
           'And the freedom of being known for the work you were meant to do, on your own terms.']},

 {t:'why', kicker:'Why learn this from me',
  h2:'Fifteen years of turning experts into authorities.',
  lead:'I am Annemarie Cross, a brand and podcast strategist people call the Podcasting Queen. I have spent over fifteen years in podcasting and two decades in personal branding, helping coaches and consultants around the world become recognized industry thought leaders. I believe your job is to steward the expertise you were entrusted with, name it clearly, and put it where it can serve.'},

 {t:'recap', kicker:'The method, in one breath',
  h2:'Invisible to influential.',
  bullets:['<b>Build</b> visibility as THE choice.',
           '<b>Turn</b> your podcast into your platform.',
           '<b>Generate</b> leads and enroll with ease.']},

 {t:'cta', kicker:'Where to begin',
  h2:'Come and build the whole of it.',
  steps:[['Start free','Take the free Core Business Foundations quiz and get my 3-part series on becoming an Industry Thought Leader.'],
         ['Go all in','Join the Industry Thought Leader Academy and build your distinctive brand and podcast platform with guidance.']],
  pill:'Begin with the free quiz',
  note:'This masterclass is educational. No specific income or result is guaranteed. Outcomes vary with your effort, experience, and circumstances.'}
];

const stage=document.getElementById('stage');
function esc(x){return x==null?'':x}
function render(){
 stage.innerHTML=S.map((s,i)=>{
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.partno && s.t==='part') inner+=`<div class="part-no">${esc(s.partno)}</div>`;
  if(s.h) inner+=`<h1>${esc(s.h)}</h1>`;
  if(s.h2) inner+=`<h2>${esc(s.h2)}</h2>`;
  if(s.big) inner+=`<div class="big">${esc(s.big)}</div>`;
  if(s.lead) inner+=`<p class="lead">${esc(s.lead)}</p>`;
  if(s.who) inner+=`<div class="who-grid">${s.who.map(c=>`<div class="cell"><div class="t">${c[0]}</div><p>${c[1]}</p></div>`).join('')}</div>`;
  if(s.bullets) inner+=`<ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
  if(s.steps) inner+=`<div class="cta-actions">${s.steps.map(st=>`<div class="step"><b>${st[0]}.</b> ${st[1]}</div>`).join('')}</div>`;
  if(s.pill) inner+=`<div class="pill">${esc(s.pill)}</div>`;
  if(s.note) inner+=`<div class="note">${esc(s.note)}</div>`;
  const spine = s.t==='title'||s.t==='part' ? '' : '<div class="spine"></div>';
  return `<div class="slide" data-i="${i}">${spine}<div class="inner">${inner}</div></div>`;
 }).join('');
}
let cur=0;
function show(n){
 cur=Math.max(0,Math.min(S.length-1,n));
 document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('on',i===cur));
 document.getElementById('count').textContent=(cur+1)+' / '+S.length;
 document.getElementById('prog').style.width=((cur+1)/S.length*100)+'%';
}
function go(d){show(cur+d)}
render();show(0);
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(1);
 if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
});
document.getElementById('stage').addEventListener('click',e=>{if(!e.target.closest('#nav'))go(1)});
</script>
</body>
</html>
