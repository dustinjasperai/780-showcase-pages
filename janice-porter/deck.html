<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The R.E.A.L. Connection System: a masterclass with Janice Porter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf6f2;
    --panel:#f3e9e3;
    --rule:#ecdcd3;
    --ink:#2b2422;
    --muted:#8a7d77;
    --accent:#ea7867;
  }
  html,body{height:100%}
  body{background:var(--panel);font-family:'DM Sans',-apple-system,sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{position:relative;width:min(96vw,1180px);aspect-ratio:16/9;background:var(--bg);
    box-shadow:0 30px 80px rgba(43,36,34,.16);border:1px solid var(--rule);overflow:hidden}
  .slide{position:absolute;inset:0;padding:6.2% 7.4%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:56px;line-height:1.08;color:var(--ink);letter-spacing:.005em}
  h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:42px;line-height:1.12;color:var(--ink)}
  .sub{font-size:24px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:82%}
  .body{font-size:22px;line-height:1.6;color:var(--ink);margin-top:20px;max-width:80%}
  .lead{font-family:'DM Serif Display',Georgia,serif;font-size:120px;line-height:1;color:var(--accent)}
  ul{list-style:none;margin-top:26px;max-width:84%}
  li{font-size:22px;line-height:1.45;color:var(--ink);padding:14px 0 14px 40px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:2px;background:var(--accent)}
  .note{font-size:16px;color:var(--muted);margin-top:26px;font-style:italic;max-width:80%}
  .tag{display:inline-block;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;padding:7px 16px;margin-bottom:26px;font-weight:600}
  .part .lbl{font-size:17px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:16px}
  .dark{background:var(--ink)}
  .dark h1,.dark h2{color:#f6efe9}
  .dark .sub{color:#d8ccc4}
  .dark .kick{color:var(--accent)}
  .pillar .pn{font-family:'DM Serif Display',Georgia,serif;font-size:22px;color:var(--accent);letter-spacing:.02em;margin-bottom:10px}
  .cta-box{border-top:2px solid var(--accent);padding-top:28px;margin-top:8px}
  .cta-do{font-family:'DM Serif Display',Georgia,serif;font-size:30px;color:var(--ink);margin-top:14px}
  .disc{font-size:14px;color:var(--muted);margin-top:30px;max-width:82%;line-height:1.5}
  .foot{position:absolute;left:7.4%;right:7.4%;bottom:4%;display:flex;justify-content:space-between;
    align-items:center;font-size:13px;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
  .dark .foot{color:#c3b8b1;border-top-color:rgba(246,239,233,.18)}
  #nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;
    font-size:13px;color:var(--muted);font-weight:500}
  #nav button{background:var(--bg);border:1px solid var(--rule);color:var(--ink);border-radius:999px;
    width:34px;height:34px;cursor:pointer;font-size:16px}
  #count{min-width:52px;text-align:center;letter-spacing:.1em}
  @media(max-width:760px){h1{font-size:34px}h2{font-size:27px}.sub,.body,li{font-size:17px}.lead{font-size:74px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev" aria-label="Previous">&#8249;</button><span id="count"></span><button id="next" aria-label="Next">&#8250;</button></div>
<script>
const BRAND = "Janice Porter &middot; Relationships Rule";
const S = [
  {t:'title', kick:'A live masterclass for business owners who network on LinkedIn', h:'The R.E.A.L. Connection System', sub:'The people who win clients on LinkedIn are not the ones with the most connections. They are the ones who get remembered. Here is the system behind it.'},
  {t:'who', h:'Who this hour is for', sub:'You are already on LinkedIn. This is for the owner who wants those connections to turn into clients.', list:['The owner with a growing list of connections and no real conversations','The owner whose inbox is full of pitches and short on relationships','Anyone whose best clients came from a relationship, who wants to make that repeatable']},
  {t:'trap', kick:'The trap', h:'Most people collect and pitch', body:'You connect, you send the pitch, and you wonder why it goes quiet. The connection was never the hard part. What you do after it is.'},
  {t:'reframe', dark:true, kick:'The reframe', h:'A connection is a door, not a client', sub:'Someone accepting your request is permission to build a relationship. It is not a sale. Treat the door like the deal and it closes on you.'},
  {t:'part', lbl:'Part One', h:'Why connect and pitch fails'},
  {t:'point', h:'Nobody buys from a stranger who pitched them', body:'The people who win on LinkedIn earn a little trust before they ever ask for anything. They show up, they add something useful, and they are the first name that comes to mind when the need finally shows up.'},
  {t:'point', h:'Relationships break in three quiet places', list:['No follow-up, so the connection quietly goes cold','No value, so there is never a reason to reply','No memory, so when they are ready to buy, they think of someone else']},
  {t:'part', lbl:'Part Two', h:'The R.E.A.L. Connection System'},
  {t:'pillar', pn:'R · Refresh', h:'A profile that earns trust in ten seconds', body:'Before you reach out, your profile does the vouching. Refresh it so a stranger can tell in seconds who you help, what you are known for, and why you are worth a reply.'},
  {t:'pillar', pn:'E · Engage', h:'Start conversations, not pitches', body:'Engage with purpose. Comment with something useful, message like a human, and open a real conversation instead of leading with the ask. This is where the relationship actually begins.'},
  {t:'pillar', pn:'A · Appreciate', h:'Be the one they remember', body:'The step almost everyone skips. Appreciate people meaningfully, online and offline, with a genuine thank-you, a note, a small gift. It costs very little, and it is the whole reason you are remembered when it matters.'},
  {t:'pillar', pn:'L · Leverage', h:'Turn relationships into clients and referrals', body:'Once the trust is real, leverage it. The conversation becomes a call, the client becomes a referral source, the connection becomes a partner. Growth compounds because the relationship came first.'},
  {t:'part', lbl:'Part Three', h:'What the system looks like'},
  {t:'point', kick:'The offline half', h:'Online gets you connected. Offline gets you remembered.', body:'Anyone can send a message. Very few send a card. The small offline gesture, at the right moment, is what separates the one person they remember from the hundred they scrolled past. This is the edge most LinkedIn advice never mentions.'},
  {t:'point', h:'One connection, worked all the way through', body:'You refresh so you look worth knowing. You engage until it is a real conversation. You appreciate so you stay top of mind. Then, when the need is there, you are the obvious call. Then you do it again.'},
  {t:'recap', kick:'If you remember one thing', h:'Be remembered, not just connected', sub:'Every step today points back to that. Refresh, engage, appreciate, and the leverage takes care of itself.'},
  {t:'cred', kick:'Why listen to me on this', h:'Janice Porter', body:'I started as a teacher, spent years as a corporate trainer, and have built my business on one idea: relationships rule. I host the Relationships Rule podcast and I help business owners stay connected and be remembered. This system is how I do it, and how my clients do it.'},
  {t:'cta', kick:'Where to take this next', h:'Let us look at your connections', cta:'Book a call with me and we will look at your LinkedIn, your follow-up, and where relationships are slipping through, so we can turn more of them into clients.', disc:'This masterclass is educational. No income or sales result is guaranteed. Results vary with your market, your audience, and the work you put in.'}
];

const stage = document.getElementById('stage');
function render(s){
  let inner = '';
  const kick = s.kick ? `<div class="kick">${s.kick}</div>` : '';
  if(s.t==='title'){
    inner = `<div class="tag">Janice Porter</div>${kick}<h1>${s.h}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:''}`;
  } else if(s.t==='part'){
    inner = `<div class="part"><div class="lbl">${s.lbl}</div><h1>${s.h}</h1></div>`;
  } else if(s.t==='reframe'){
    inner = `${kick}<h1>${s.h}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:''}`;
  } else if(s.t==='pillar'){
    inner = `<div class="pillar"><div class="pn">${s.pn}</div><h2>${s.h}</h2>${s.body?`<div class="body">${s.body}</div>`:''}</div>`;
  } else if(s.t==='cta'){
    inner = `${kick}<h1>${s.h}</h1><div class="cta-box"><div class="cta-do">${s.cta}</div></div><div class="disc">${s.disc}</div>`;
  } else if(s.t==='recap'||s.t==='cred'){
    inner = `${kick}<h1>${s.h}</h1>${s.body?`<div class="body">${s.body}</div>`:''}${s.sub?`<div class="sub">${s.sub}</div>`:''}`;
  } else {
    inner = `${kick}<h2>${s.h}</h2>`;
    if(s.body) inner += `<div class="body">${s.body}</div>`;
    if(s.sub) inner += `<div class="sub">${s.sub}</div>`;
    if(s.list) inner += `<ul>${s.list.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    if(s.note) inner += `<div class="note">${s.note}</div>`;
  }
  const foot = s.t==='title' ? '' : `<div class="foot"><span>${BRAND}</span><span>The R.E.A.L. Connection System</span></div>`;
  return `<div class="slide${s.dark?' dark':''}">${inner}${foot}</div>`;
}
stage.innerHTML = S.map(render).join('');
const slides = [...stage.querySelectorAll('.slide')];
let i = 0;
function show(n){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((el,x)=>el.classList.toggle('on', x===i));
  document.getElementById('count').textContent = (i+1)+' / '+slides.length;
}
document.getElementById('next').onclick = ()=>show(i+1);
document.getElementById('prev').onclick = ()=>show(i-1);
stage.onclick = (e)=>{ if(e.clientX < window.innerWidth/2) show(i-1); else show(i+1); };
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight'||e.key===' ') show(i+1);
  else if(e.key==='ArrowLeft') show(i-1);
});
show(0);
</script>
</body>
</html>
