<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confidence Is a Strategy — Julie DeLucca-Collins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500;1,16..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F1;        /* harvested light scheme, warmed to Casa cream */
    --panel:#F3ECE4;
    --card:#FFFFFF;
    --ink:#1A1A1A;       /* harvested text color */
    --muted:#8A8178;
    --accent:#C0563B;    /* Casa de Confidence warm terracotta */
    --head:'DM Sans',sans-serif;   /* her own site face */
    --body:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--card);border:1px solid #e7ddd2;border-radius:14px;
    padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .slide.title{background:var(--bg);border:none;text-align:left}
  .slide.part{background:var(--panel);border:none}
  .slide.cta{background:var(--ink);color:var(--bg);border:none}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:20px}
  .slide.cta .kick{color:#E7A892}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-.01em}
  .lead{font-size:23px;line-height:1.5;margin-top:22px;max-width:40ch;color:var(--ink)}
  .slide.cta .lead{color:var(--bg)}
  .sub{font-size:19px;color:var(--muted);margin-top:18px;max-width:46ch}
  .big{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.12;max-width:20ch}
  .big .a{color:var(--accent)}
  .pillars{display:flex;flex-direction:column;gap:16px;margin-top:26px}
  .pillar{border-left:3px solid var(--accent);padding:6px 0 6px 20px}
  .pillar b{font-family:var(--head);font-size:21px}
  .pillar span{display:block;color:var(--muted);font-size:17px;margin-top:5px;max-width:52ch}
  .steps{counter-reset:s;margin-top:24px;display:flex;flex-direction:column;gap:18px}
  .step{display:flex;gap:18px;align-items:flex-start}
  .step .n{font-family:var(--head);font-weight:700;color:var(--accent);font-size:22px;min-width:38px}
  .step b{font-family:var(--head);font-size:20px}
  .step span{display:block;color:var(--muted);font-size:16px;margin-top:4px;max-width:50ch}
  .me{font-size:18px;line-height:1.6;color:var(--ink);margin-top:10px;max-width:52ch}
  .melist{margin-top:18px;list-style:none;display:flex;flex-direction:column;gap:10px}
  .melist li{font-family:var(--head);font-size:18px;padding-left:22px;position:relative}
  .melist li:before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;
    background:var(--accent);border-radius:50%}
  .disc{font-size:13px;color:#C9BBAC;margin-top:30px;max-width:60ch;font-family:var(--head)}
  .pres{font-family:var(--head);font-size:16px;color:var(--muted);margin-top:34px}
  .slide.title .pres{color:var(--muted)}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:auto}h1{font-size:34px}h2{font-size:27px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'Confidence Is a Strategy',
  lead:'How women entrepreneurs turn visibility into revenue, without burning out.',
  pres:'With Julie DeLucca-Collins · Casa de Confidence'},

 {t:'content',kick:'Who this is for',h:'You, if this sounds familiar',
  sub:'You are a woman building a business in midlife. You know your work is good. You show up, you post, you guest on podcasts. And you are still waiting to be consistently booked.'},

 {t:'content',kick:'The trap',h:'Being seen is not the same as being chosen',
  sub:'You have done the visible things. But visibility without a strategy behind it is just noise, and it quietly runs you into the ground.'},

 {t:'content',kick:'The cost',h:'What the scattered season costs',
  sub:'Months of effort that never quite turn into booked clients. The slow belief that maybe you are the problem. And the exhaustion of chasing one more tactic that someone louder told you to try.'},

 {t:'content',kick:'The reframe',big:'Visibility without a strategy is noise. And confidence you <span class="a">wait to feel</span> never arrives.'},

 {t:'part',kick:'Part one',h:'The real problem',
  sub:'It was never that you lack confidence or hustle. It is that nobody taught you confidence as a system you can run on purpose, instead of a feeling you hope shows up.'},

 {t:'content',kick:'The core idea',big:'Confidence is not a trait. It is a <span class="a">strategy</span>.'},

 {t:'content',kick:'Why it matters',h:'A trait you are born with. A strategy you can build.',
  sub:'When confidence is a strategy, it stops depending on a good day. You build it the same way you build anything that lasts, with small repeatable habits.'},

 {t:'content',kick:'In practice',h:'Confidence you can schedule',
  sub:'It stops being a feeling you wait for and becomes a set of small moves on your calendar. You act first, and the feeling catches up, every single week.'},

 {t:'part',kick:'Part two',h:'The Confident You framework',
  sub:'The operating spine I use with women entrepreneurs so a scattered business becomes a calm, repeatable one. Four moves, remembered as C.O.O.P.'},

 {t:'content',kick:'The framework',h:'C.O.O.P.',
  pillars:[
   ['Collaborate','Stop doing it all alone. Build the relationships, guest spots and communities that put your voice in front of the right rooms.'],
   ['Organize','Give the business a simple structure, so you always know the next right thing instead of drowning in every thing.'],
   ['Operate','Run on habits, not willpower. The small daily actions that compound into visibility and trust.'],
   ['Prioritize','Decide what actually moves revenue, and give yourself permission to let the rest wait.']
  ]},

 {t:'content',kick:'The engine underneath',h:'Tiny habits, not willpower',
  sub:'Confidence and consistency are built one small habit at a time, anchored to things you already do. Tiny enough that a hard week cannot knock them over.'},

 {t:'part',kick:'Part three',h:'From visibility to revenue',
  sub:'Being seen is step one. Here is the path that turns attention into booked clients, without more posting and more hours.'},

 {t:'content',kick:'The common mistake',h:'More posting is not the answer',
  sub:'When the clients do not come, the loud advice is always do more, post more, launch again. That is how burnout starts. The fix is a path, not more volume.'},

 {t:'content',kick:'The path',h:'Four steps',
  steps:[
   ['1','Message','Get clear and brave about the one thing you help women do, so your work is easy to repeat and refer.'],
   ['2','Platform','Use the channels you already love, podcast guesting and content, as a repeatable visibility engine.'],
   ['3','Consistency','Show up on a cadence you can actually sustain, built on the tiny habits, not on motivation.'],
   ['4','Conversion','Invite the people who are ready, with a simple, warm path from listener to client.']
  ]},

 {t:'content',kick:'What changes',h:'A calm, repeatable week',
  sub:'No more waiting to feel ready. You run the same small moves every week, your visibility compounds, and booked clients become a pattern instead of a surprise.'},

 {t:'content',kick:'The compounding effect',h:'Why this keeps paying off',
  sub:'Each guest spot, each consistent week, each warm invitation stacks on the last. Visibility built on a strategy is an asset that grows, not a treadmill you have to keep sprinting.'},

 {t:'content',kick:'Why me',h:'Julie DeLucca-Collins',
  me:'I am a business strategist, TEDx speaker, and the bestselling author of Confident You. I host the Casa de Confidence podcast, 300 plus episodes of real conversations with women about resilience and reinvention.',
  melist:['Bestselling author, Confident You','TEDx speaker','Host, Casa de Confidence podcast','Certified in Tiny Habits']},

 {t:'cta',kick:'Your next step',h:'Build your confidence as a strategy',
  lead:'If this is the way you want to grow, let us map your visibility-to-revenue path together.',
  melist:['Book a Power Collab conversation with me','Or join the Confident You Co-Op'],
  disc:'This masterclass is educational. It is not a guarantee of income or results, and outcomes vary by person, effort, and market.'}
];

const deck=document.getElementById('deck');
S.forEach(s=>{
 const d=document.createElement('section');
 d.className='slide '+(s.t||'content');
 let html='';
 if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
 if(s.h && (s.t==='title')) html+='<h1>'+s.h+'</h1>';
 else if(s.h) html+='<h2>'+s.h+'</h2>';
 if(s.big) html+='<div class="big">'+s.big+'</div>';
 if(s.lead) html+='<div class="lead">'+s.lead+'</div>';
 if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
 if(s.pillars){html+='<div class="pillars">';s.pillars.forEach(p=>{html+='<div class="pillar"><b>'+p[0]+'</b><span>'+p[1]+'</span></div>';});html+='</div>';}
 if(s.steps){html+='<div class="steps">';s.steps.forEach(p=>{html+='<div class="step"><div class="n">'+p[0]+'</div><div><b>'+p[1]+'</b><span>'+p[2]+'</span></div></div>';});html+='</div>';}
 if(s.me) html+='<div class="me">'+s.me+'</div>';
 if(s.melist){html+='<ul class="melist">';s.melist.forEach(x=>{html+='<li>'+x+'</li>';});html+='</ul>';}
 if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
 if(s.pres) html+='<div class="pres">'+s.pres+'</div>';
 d.innerHTML=html;
 deck.appendChild(d);
});
</script>
</body>
</html>
