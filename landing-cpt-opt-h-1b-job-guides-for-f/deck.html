<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cross-Cultural Job Search — ICAway Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8eff7; --panel:#ffffff; --rule:#d2deea;
    --ink:#0c2340; --muted:#4a5a6e;
    --accent:#0e559d; --pop:#f59b33;
    --head:'Plus Jakarta Sans',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);font-family:var(--body);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(960px,94vw);aspect-ratio:16/9;background:var(--panel);border:1px solid var(--rule);border-radius:16px;box-shadow:0 18px 50px rgba(12,35,64,.10);position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;padding:56px 64px;display:none;flex-direction:column;justify-content:center;gap:18px}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent)}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.02em}
  h2{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.1;letter-spacing:-.01em}
  p{font-size:19px;line-height:1.5;color:var(--muted);max-width:40ch}
  p.big{font-size:23px;color:var(--ink)}
  .lede{font-size:21px;color:var(--ink);max-width:46ch}
  ul{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:6px}
  li{font-size:19px;line-height:1.4;display:flex;gap:12px;align-items:flex-start;max-width:48ch}
  li b{font-family:var(--head)}
  .num{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;font-family:var(--head);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .num.pop{background:var(--pop)}
  .tag{display:inline-block;font-family:var(--head);font-weight:700;font-size:13px;color:var(--accent);background:#eaf1f9;border:1px solid #cfe0f1;border-radius:999px;padding:6px 14px;width:max-content}
  .tag.pop{color:#8a4e06;background:#fdf1e2;border-color:#f6d9b0}
  .rail{display:flex;gap:8px;margin-top:10px}
  .rail span{height:6px;flex:1;border-radius:4px;background:var(--rule)}
  .rail span.fill{background:var(--accent)}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:22px 24px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .kicker{font-family:var(--head);font-weight:700;color:var(--ink);font-size:18px}
  .foot{position:absolute;left:64px;bottom:22px;font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
  .pg{position:absolute;right:28px;bottom:20px;font-size:12px;color:#9aa8b8;font-family:var(--head)}
  .disc{font-size:13px;color:#8595a6;max-width:60ch;margin-top:10px}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
  .nav button{font-family:var(--head);font-weight:700;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px}
  .nav button:hover{border-color:var(--accent);color:var(--accent)}
  .cta-box{background:var(--accent);color:#fff;border-radius:14px;padding:20px 26px;width:max-content;font-family:var(--head);font-weight:700;font-size:20px}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button onclick="go(-1)">Prev</button><span id="count" style="font-family:var(--head);font-size:13px;color:#7c8a9a"></span><button onclick="go(1)">Next</button></div>
<script>
const S = [
  {t:'title', eyebrow:'A live ICAway masterclass', h:1, head:'The Cross-Cultural Job Search',
   lede:'How international students land US jobs that sponsor them, without waiting for OPT to run out.', rail:[1,3], foot:'ICAway'},
  {t:'for', eyebrow:'Who this is for', h:2, head:'If you are an F-1 student chasing a US offer, this is for you.',
   items:[
     {n:'1', text:'STEM and non-STEM students who need a CPT internship, an OPT role, or H-1B sponsorship.'},
     {n:'2', text:'You have done everything right on paper, and the applications still go quiet.'},
     {n:'3', pop:true, text:'The clock on your work authorization is already running.'}
   ]},
  {t:'agenda', eyebrow:'What we will cover', h:2, head:'The next 45 minutes',
   items:[
     {n:'1', text:'Why strong candidates still get passed over, and what actually decides it.'},
     {n:'2', text:'The 7-step Career Success Roadmap, pillar by pillar.'},
     {n:'3', text:'The cross-cultural networking method you can use this week.'}
   ]},
  {t:'hook', tag:'The uncomfortable truth', tagpop:true, h:1, head:'Your resume is not the problem.',
   big:'You are not losing offers because you are underqualified. You are losing them because the US job market runs on relationships and cultural signals nobody taught you to read.'},
  {t:'p1', eyebrow:'Part one', h:2, head:'The real gap is cultural, not technical.',
   lede:'US hiring rewards warmth, small talk, referrals, and the quiet confidence of someone who belongs in the room. For an international student, those are learnable skills, not personality traits you were born with.'},
  {t:'clock', tag:'The OPT clock', tagpop:true, h:2, head:'Waiting is the most expensive mistake.',
   lede:'Most students start the real search once OPT is approved. By then the runway is short and the panic is high. The students who get sponsored start early and work the market like insiders.'},
  {t:'mistakes', eyebrow:'Before the fix', h:2, head:'Three mistakes that quietly cost offers',
   items:[
     {n:'1', b:'Applying, not connecting.', text:'Relying on the portal when referrals are how the roles actually get filled.'},
     {n:'2', b:'A home-market resume.', text:'Telling your story the way your country reads value, not the way a US manager does.'},
     {n:'3', pop:true, b:'Starting late.', text:'Waiting for OPT approval instead of working the market a year out.'}
   ]},
  {t:'p2', eyebrow:'Part two', h:2, head:'The Career Success Roadmap',
   lede:'A 7-step system that has taken international students across disciplines from overlooked to sponsored. Here are the three pillars it stands on.', rail:[2,3]},
  {t:'pillar1', eyebrow:'Pillar one', h:2, head:'Relationship networking that works across cultures',
   lede:'Not collecting business cards. Building a handful of genuine relationships, the way US professionals actually open doors for the people they like and remember.'},
  {t:'pillar2', eyebrow:'Pillar two', h:2, head:"Career branding for the US employer's lens",
   lede:'Your resume, your LinkedIn, and the way you tell your story, rebuilt for how a US hiring manager reads value, not how your home market would.'},
  {t:'pillar3', eyebrow:'Pillar three', h:2, head:'Sequencing the search to your visa timeline',
   lede:'Targeting employers with a sponsorship history and mapping your moves to the CPT, OPT, STEM-OPT, and H-1B calendar, so timing works for you instead of against you.'},
  {t:'roadmap', eyebrow:'The roadmap at a glance', h:2, head:'Seven steps, one game plan',
   items:[
     {n:'1', text:'Assessment and a personalized game plan.'},
     {n:'2', text:'Career brand materials, resume and LinkedIn, for the US lens.'},
     {n:'3', text:'A target list of employers with a sponsorship history.'},
     {n:'4', text:'A networking game plan and relationship-based outreach.'},
     {n:'5', text:'Interview preparation and offer strategy through to sponsorship.'}
   ]},
  {t:'net', eyebrow:'Inside pillar one', h:2, head:'Networking, reframed as relationships',
   items:[
     {n:'1', b:'Quality over quantity.', text:'Three real conversations beat twenty handshakes.'},
     {n:'2', b:'Become the one they remember.', text:'Thoughtful gestures and a specific, easy ask.'},
     {n:'3', b:'Lead with a clear question.', text:'General requests get ignored; focused ones get answered.'}
   ]},
  {t:'bridges', eyebrow:'The cultural bridge', h:2, head:'Four ways into any American conversation',
   cards:[
     {title:'Sports', text:'A game, a team, the season everyone is already talking about.'},
     {title:'Music and shows', text:'What people are watching and listening to right now.'},
     {title:'Travel', text:'Weekend plans, the next trip, where they grew up.'},
     {title:'Food', text:'The place down the street, the cuisine they love.'}
   ]},
  {t:'p3', eyebrow:'Part three', h:2, head:'The month your search stops feeling like luck', rail:[3,3],
   lede:'A student who was invisible on job boards becomes someone with warm introductions, a brand a US manager understands, and a search timed to the visa calendar. The offers stop being luck.'},
  {t:'look', tag:'The shift', h:2, head:'From applicant to candidate they are chasing.',
   big:'You stop firing resumes into the void and start walking in through relationships, with a brand and a plan built for the US market.'},
  {t:'whyme', eyebrow:'Who is teaching this', h:2, head:'Coach Kwan Segal, ICAway',
   lede:'Founder and CEO of International Career Advisory (ICAway), a former international student and former university career coach. Since 2017, ICAway has worked with students across 50+ US universities as a cross-cultural advisor and human-capital consultant.'},
  {t:'cta', eyebrow:'Your next step', h:2, head:'Build your game plan with ICAway.',
   lede:'Start with the ICAway Talent Platform, or book a 1:1 Assessment and Game Plan session with Coach Kwan to map your personal roadmap to a sponsored US job.',
   ctaBox:'Join ICAway and start your roadmap',
   disc:'Educational only. No result is guaranteed. Results vary by individual, field, employer, and immigration conditions. ICAway shares strategies and frameworks, not promises of employment, sponsorship, or any visa outcome.'}
];

function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function slideHTML(s){
  let h = '';
  if(s.eyebrow) h += `<span class="eyebrow">${esc(s.eyebrow)}</span>`;
  if(s.tag) h += `<span class="tag${s.tagpop?' pop':''}">${esc(s.tag)}</span>`;
  if(s.head) h += (s.h===1?`<h1>${esc(s.head)}</h1>`:`<h2>${esc(s.head)}</h2>`);
  if(s.lede) h += `<p class="lede">${esc(s.lede)}</p>`;
  if(s.big) h += `<p class="big">${esc(s.big)}</p>`;
  if(s.rail){let r='';for(let k=0;k<s.rail[1];k++)r+=`<span class="${k<s.rail[0]?'fill':''}"></span>`;h+=`<div class="rail">${r}</div>`;}
  if(s.items){h+='<ul>'+s.items.map(it=>`<li><span class="num${it.pop?' pop':''}">${esc(it.n)}</span><div>${it.b?`<b>${esc(it.b)}</b> `:''}${esc(it.text)}</div></li>`).join('')+'</ul>';}
  if(s.cards){h+='<div class="grid2">'+s.cards.map(c=>`<div class="card"><div class="kicker">${esc(c.title)}</div><p>${esc(c.text)}</p></div>`).join('')+'</div>';}
  if(s.ctaBox) h += `<div class="cta-box">${esc(s.ctaBox)}</div>`;
  if(s.disc) h += `<p class="disc">${esc(s.disc)}</p>`;
  if(s.foot) h += `<div class="foot">${esc(s.foot)}</div>`;
  return h;
}

const stage = document.getElementById('stage');
let i = 0;
function draw(){
  stage.innerHTML = '';
  const s = S[i];
  const d = document.createElement('div');
  d.className = 'slide on';
  d.innerHTML = slideHTML(s);
  const pg = document.createElement('div');
  pg.className = 'pg';
  pg.textContent = (i+1)+' / '+S.length;
  d.appendChild(pg);
  stage.appendChild(d);
  document.getElementById('count').textContent = (i+1)+' / '+S.length;
}
function go(n){ i = Math.max(0, Math.min(S.length-1, i+n)); draw(); }
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
draw();
</script>
</body>
</html>
