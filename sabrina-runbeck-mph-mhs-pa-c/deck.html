<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Become the Recognized Leader in Your Healthcare Niche · Sabrina Runbeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f9fb; --panel:#e9f1f7; --rule:#d3e2ee;
    --ink:#12323f; --accent:#007bc2; --deep:#094560; --warm:#db7c26;
    --grey:#4b5f6a; --dim:#8aa0ab;
  }
  html,body{height:100%}
  body{background:#c3d0d9;font-family:'Open Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#c3d0d9}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--ink);line-height:1.12;letter-spacing:-.01em}
  .t-title h1{font-size:4.1vw;max-width:90%;font-weight:800}
  .t-normal h1{font-size:3.1vw;max-width:84%}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:75%;line-height:1.6;font-weight:400}
  .sub{font-family:'Open Sans',sans-serif;font-size:1.75vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .pulse{width:15vw;height:0;border:none;border-top:3px solid var(--warm);margin-top:3.2vh;opacity:.95}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.32vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:90%}
  .t-section .rule{width:16vw;height:0;border-top:3px solid var(--warm);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#0e5578 0%,var(--deep) 70%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:88%;color:#eef6fb;font-weight:600}
  .t-dark .kicker{color:#8ecbe8}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#0e5578 0%,var(--deep) 70%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:84%;color:#f4fafd}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #7fc0e4;color:#eaf5fb;border-radius:100px;padding:1.3vh 1.7vw;font-family:'Montserrat',sans-serif;font-size:1.18vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:#bcd7e6;font-style:italic;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3.6vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(9,69,96,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Provider's Edge</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'Become the Recognized Leader in Your Healthcare Niche',sub:'A live masterclass for healthcare founders, practice owners, and executives who are the best in the room and the best-kept secret in their field.',brand:true},
 {t:'normal',k:'Who this is for',title:'You are excellent. You are also unknown.',body:'You have the training, the outcomes, and the track record. Yet the referrals, the invitations, and the right-fit patients still go to names that are louder, not better. Being the best is not the same as being the obvious choice.'},
 {t:'dark',k:'The hard truth',title:'The best clinician rarely wins the referral. The best-known one does.'},

 {t:'section',idx:'Part One',title:'Why Expertise Alone Stalls'},
 {t:'normal',k:'The best-kept secret',title:'Quiet excellence is expensive.',body:'When the people who refer, hire, and partner do not know your name, your growth depends on whoever happens to find you. That is a fragile way to run a practice you have spent a career earning.'},
 {t:'normal',k:'The cost of waiting',title:'Every quarter you stay invisible is a quarter someone else gets chosen.',body:'The opportunities do not disappear. They go to the founder who was already top of mind when the moment arrived. Visibility is not vanity. It is who gets the call.'},
 {t:'dark',k:'The reframe',title:'You can be discovered by accident, or you can become the name people already trust.'},

 {t:'section',idx:'Part Two',title:'The Virtual Edge'},
 {t:'normal',k:'Pillar one · Relationships first',title:'Authority is built through the right relationships, not a bigger budget.',body:'Millionaire marketing on a bootstrap budget starts with mapping the handful of people who already open doors in your field, then earning a place in those rooms. A warm introduction outperforms any amount of cold reach.'},
 {t:'normal',k:'Pillar two · Borrowed audiences',title:'Stand on stages and shows your audience already trusts.',body:'Speaking engagements and podcast conversations put you in front of gathered, warmed audiences you did not have to build. One good appearance can seed months of the right conversations.'},
 {t:'normal',k:'Pillar three · The visible expert',title:'Say the one thing only you can say, and say it where it counts.',body:'Positioning is not posting more. It is a clear point of view, delivered in the sales presentations, talks, and content that make you the obvious answer to the question your ideal patient is already asking.'},
 {t:'normal',k:'Pillar four · Compounding network',title:'Every relationship should introduce the next.',body:'Partnerships and a well-tended network turn one connection into a referral engine that keeps working. Attention can be rented. Trust, once earned, compounds and stays yours.'},
 {t:'dark',k:'The whole idea',title:'When you are the name people already trust, growth stops depending on luck.'},

 {t:'section',idx:'Part Three',title:'When You Become the Name'},
 {t:'normal',k:'The founder this builds',title:'Fewer cold pitches. More of the right people coming to you.',body:'A recognized founder takes better-fit clients, commands their pricing without apology, and spends less energy chasing, because the reputation does the first conversation for them.'},
 {t:'dark',k:'The shift',title:'You stop asking for attention. The market starts bringing it to you.'},
 {t:'normal',k:'Why Sabrina Runbeck',title:'A clinician who built the visibility playbook she teaches.',body:'Sabrina Runbeck, MPH, MHS, PA-C, spent more than two decades in clinical medicine and public health, and hosts the Provider\'s Edge, ranked among the top five percent of podcasts globally. She teaches healthcare founders the exact relationship-first method she used to become a recognized voice in her field.'},

 {t:'section',idx:'Your Next Step',title:'Build Your Own Edge'},
 {t:'normal',k:'Go deeper with the method',title:'Where the work continues.',body:'The Provider\'s Edge helps healthcare founders put this method to work, from a private conversation about your goals to the Healthcare Disruptors Think Tank, a small room of healthcare leaders growing their visibility and impact together.'},
 {t:'cta',title:'Ready to become the recognized name in your field?',chips:['Book a call with Sabrina','Join the Healthcare Disruptors Think Tank'],disc:'Educational content for healthcare founders, practice owners, and executives. No income, growth, or referral result is guaranteed. Results vary by practice, market, and effort.'},
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.t==='normal') h+=`<hr class="pulse">`;
    if(s.brand) h+=`<div class="brandline">The Provider\'s Edge · <b>Sabrina Runbeck, PA-C</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
