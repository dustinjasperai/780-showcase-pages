<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond Loan Signings — A Masterclass with Bill Soroka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#eef1f3;
    --ink:#2c3e50;
    --accent:#0272ef;
    --seal:#e67e22;
    --rule:#2c3e50;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{width:100%;max-width:960px;aspect-ratio:16/9;position:relative;
    background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;padding:7% 9%;display:none;
    flex-direction:column;justify-content:center;gap:2.2vh}
  .slide.on{display:flex}
  h1,h2,h3{font-family:"Libre Franklin",system-ui,sans-serif;line-height:1.08;color:var(--ink)}
  h1{font-size:clamp(28px,5.4vw,56px);font-weight:800;letter-spacing:-.01em}
  h2{font-size:clamp(22px,3.8vw,40px);font-weight:800;letter-spacing:-.01em}
  h3{font-size:clamp(16px,2.1vw,22px);font-weight:700;color:var(--accent)}
  p,li{font-size:clamp(14px,1.9vw,21px);line-height:1.5;max-width:40ch}
  .lead{font-size:clamp(16px,2.3vw,25px)}
  .kicker{font-family:"Libre Franklin";font-weight:700;text-transform:uppercase;
    letter-spacing:.14em;font-size:clamp(11px,1.3vw,14px);color:var(--accent)}
  .seal{display:inline-block;width:.6em;height:.6em;border-radius:50%;
    background:var(--seal);margin-right:.5em;vertical-align:middle}
  .rule{width:64px;height:4px;background:var(--seal);border:0;margin:.3em 0}
  ul{list-style:none;display:flex;flex-direction:column;gap:1.1vh}
  li{padding-left:1.4em;position:relative}
  li::before{content:"";position:absolute;left:0;top:.55em;width:.5em;height:.5em;
    border-radius:50%;background:var(--accent)}
  .panel{background:var(--panel);border-left:5px solid var(--seal);
    padding:3.5% 4.5%;border-radius:6px}
  .big{font-size:clamp(34px,8vw,88px);font-weight:800;font-family:"Libre Franklin";color:var(--accent);line-height:1}
  .muted{color:#5b6b7a}
  .foot{position:absolute;bottom:3.5%;left:9%;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;font-family:"Libre Franklin";font-weight:600;color:#8795a1}
  .disc{font-size:clamp(11px,1.3vw,13px);color:#6a7987;max-width:52ch;line-height:1.45}
  #nav{position:fixed;bottom:14px;right:18px;display:flex;gap:8px;align-items:center;
    font-family:"Libre Franklin";font-size:13px;color:#8795a1}
  #nav button{font:inherit;color:var(--bg);background:var(--accent);border:0;
    width:30px;height:30px;border-radius:6px;cursor:pointer}
  #count{min-width:48px;text-align:center}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev" aria-label="Previous">&larr;</button>
<span id="count"></span><button id="next" aria-label="Next">&rarr;</button></div>
<script>
const S=[
  {t:'title', k:'A live masterclass with Bill Soroka',
   h:'Beyond Loan Signings',
   p:'How to build a notary business that does not restart from zero every Monday morning.'},

  {t:'promise',
   h:'By the end of this hour',
   b:['You will see the four or five revenue streams your commission already qualifies you for.',
      'You will know which one to add first for the fastest paycheck.',
      'You will have a simple way to stop trading every signing for the next one.']},

  {t:'who', k:'Who this is for',
   h:'The notary who is busy but not building',
   p:'You passed the exam, got certified, maybe stacked a few more credentials. You take the signings that come. And every week still starts at zero.'},

  {t:'trap', k:'The single-stream trap',
   h:'One income stream is a job, not a business',
   b:['Loan signings rise and fall with interest rates you do not control.',
      'A $75 to $100 signing pays once, then you go find the next one.',
      'When the refinance wave dries up, so does the calendar.']},

  {t:'reframe', k:'The uncomfortable truth',
   h:'More training will not fix a one-stream business',
   p:'Most struggling notaries are not failing because they do not know enough. They are stuck on a single service in a market that moves without them.'},

  {t:'part', k:'Part One',
   h:'Your commission is a platform, not a job title',
   p:'The same commission that lets you notarize a loan package opens doors to work that most notaries never touch, and that very few competitors offer.'},

  {t:'idea',
   h:'The riches are in the niches',
   p:'Specialized services are harder to find, so they pay more and compete less. Depth in a niche beats chasing the cheapest, most crowded work in town.'},

  {t:'part', k:'Part Two',
   h:'The revenue streams hiding in plain sight',
   p:'Here are the specialties a notary can add, some with your commission and some built right beside it. Pick by your market, not by what everyone else is already doing.'},

  {t:'stream', k:'Stream 01',
   h:'Apostille agent work',
   p:'Millions of documents a year need authentication for use overseas. You help the public navigate a confusing process and earn far more than a standard signing fee.'},

  {t:'stream', k:'Stream 02',
   h:'Mobile fingerprinting',
   p:'Background-check demand keeps growing, and fingerprinting can be built in any state, ink or electronic. A mobile service fee starts well above a basic notarization.'},

  {t:'stream', k:'Stream 03',
   h:'Estate and trust signings',
   p:'Trust delivery is detailed, relationship-driven work with estate planning attorneys. It rewards the careful professional and almost nobody is positioned to serve it well.'},

  {t:'stream', k:'Stream 04',
   h:'Legacy and life-planning advisory',
   p:'You already hold a trusted place in your clients lives. A legacy-vault offering turns a single appointment into an ongoing service your clients actually thank you for.'},

  {t:'stream', k:'Stream 05',
   h:'Facility and specialty work',
   p:'Medical and assisted-living facilities, correctional settings, and more all need notaries who know how to show up prepared. These are steady, repeatable relationships.'},

  {t:'part', k:'Part Three',
   h:'The engine under all of it: relationships',
   p:'Your network is your net worth. A handful of strong direct relationships with escrow, title, and attorneys will out-earn chasing a hundred one-off low-fee jobs.'},

  {t:'four',
   h:'Four clients, not four hundred leads',
   p:'In my highest year as a signing agent I did nearly four hundred thousand dollars in revenue. Do you know how many clients that took? Four. Depth, not volume.'},

  {t:'structure', k:'Why most of this never happens',
   h:'Notaries do not fail. They drift.',
   b:['A capable, motivated person stays busy without ever building momentum.',
      'The fix is not another course. It is structure: one revenue goal, a weekly rhythm, and accountability.',
      'Pick one new stream. Give it ninety days of focused, consistent effort.']},

  {t:'picture', k:'Picture the week',
   h:'A week that builds on itself',
   p:'A couple of loan signings, an apostille package, a fingerprinting appointment, and one relationship call that turns into next month work. Different streams, one calendar.'},

  {t:'whyme', k:'Why listen to me',
   h:'I built this the hard way',
   p:'I went from a thousand dollars a month to over twenty thousand a month in signing revenue, wrote Sign and Thrive, and now help thousands of notaries do the same inside High Performance Notary.'},

  {t:'recap',
   h:'The whole idea in one line',
   p:'Stop selling one service into a market you do not control. Build two or three specialized streams on top of real relationships, and the business stops starting over.'},

  {t:'cta', k:'Your next step',
   h:'Build your beyond-loan-signings plan with me',
   p:'Join the High Performance Notary community and we will choose your first new revenue stream and the ninety-day plan to launch it.',
   d:'Educational only. No specific income or result is guaranteed. Results vary and depend on your market, effort, and many factors outside any training.'}
];

const stage=document.getElementById('stage');
stage.innerHTML=S.map((s,i)=>{
  let inner='';
  if(s.k) inner+=`<span class="kicker"><span class="seal"></span>${s.k}</span>`;
  if(s.t==='title'){
    inner+=`<h1>${s.h}</h1><hr class="rule"><p class="lead">${s.p}</p>`;
  }else if(s.t==='four'){
    inner+=`<h2>${s.h}</h2><div class="panel"><p class="lead">${s.p}</p></div>`;
  }else if(s.t==='cta'){
    inner+=`<h2>${s.h}</h2><hr class="rule"><p class="lead">${s.p}</p><p class="disc">${s.d}</p>`;
  }else{
    inner+=`<h2>${s.h}</h2><hr class="rule">`;
    if(s.p) inner+=`<p class="lead">${s.p}</p>`;
    if(s.b) inner+=`<ul>${s.b.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  }
  inner+=`<span class="foot">Beyond Loan Signings &middot; Bill Soroka</span>`;
  return `<section class="slide${i===0?' on':''}">${inner}</section>`;
}).join('');

let cur=0;const slides=[...document.querySelectorAll('.slide')];
const count=document.getElementById('count');
function show(n){cur=(n+slides.length)%slides.length;
  slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
  count.textContent=`${cur+1} / ${slides.length}`;}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
  if(e.key==='ArrowLeft')show(cur-1);});
show(0);
</script>
</body>
</html>
