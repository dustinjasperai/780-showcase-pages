<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The De-Risk Method — a live masterclass with Venkat</title>
<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f6f4;
  --panel:#efeae3;
  --ink:#3a3b44;
  --muted:#6f6a63;
  --accent:#f99d2a;
  --blue:#3a5dae;
  --rule:rgba(58,59,68,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
#deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
.slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;padding:64px 60px;margin:0 0 26px;min-height:560px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.slide.title,.slide.cta{background:var(--panel)}
.kicker{font-size:14px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
h1{font-family:'Abhaya Libre',Georgia,serif;font-weight:800;font-size:60px;line-height:1.05;letter-spacing:-.01em;color:var(--ink)}
h2{font-family:'Abhaya Libre',Georgia,serif;font-weight:700;font-size:42px;line-height:1.1;color:var(--ink)}
.sub{font-size:23px;line-height:1.5;color:var(--muted);margin-top:24px;max-width:48ch}
.lead{font-size:26px;line-height:1.5;color:var(--ink);margin-top:20px;max-width:52ch}
.points{list-style:none;margin-top:28px;display:flex;flex-direction:column;gap:16px;max-width:60ch}
.points li{font-size:21px;line-height:1.45;color:var(--ink);padding-left:34px;position:relative}
.points li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:5px;border:2.4px solid var(--accent)}
.points li.q::before{background:var(--accent)}
.note{font-size:18px;color:var(--muted);margin-top:26px;max-width:56ch;line-height:1.5}
.quote{font-family:'Abhaya Libre',Georgia,serif;font-size:34px;line-height:1.3;color:var(--ink);margin-top:18px;max-width:48ch}
.cite{font-size:16px;letter-spacing:.04em;color:var(--accent);font-weight:600;margin-top:18px;text-transform:uppercase}
.big{font-family:'Abhaya Libre',Georgia,serif;font-weight:800;font-size:92px;color:var(--accent);line-height:1}
.statrow{display:flex;gap:40px;flex-wrap:wrap;margin-top:30px}
.stat .n{font-family:'Abhaya Libre',Georgia,serif;font-weight:800;font-size:54px;color:var(--accent);line-height:1}
.stat .l{font-size:16px;color:var(--muted);margin-top:8px;max-width:20ch}
.foot{margin-top:40px;font-size:16px;color:var(--muted);letter-spacing:.02em}
.ghost{font-family:'Abhaya Libre',Georgia,serif;font-weight:800;font-size:72px;color:transparent;-webkit-text-stroke:2px rgba(58,59,68,.4);display:inline-block;position:relative}
.ghost::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg);border-radius:3px}
.solid{font-family:'Abhaya Libre',Georgia,serif;font-weight:800;font-size:80px;color:var(--ink);margin-top:14px}
.solid em{color:var(--accent);font-style:italic}
.disc{font-size:14px;color:var(--muted);margin-top:30px;max-width:60ch;line-height:1.5;border-top:1px solid var(--rule);padding-top:18px}
.step{font-size:22px;color:var(--ink);margin-top:22px;font-weight:600}
.sitelink{color:var(--blue);font-weight:600}
@media(max-width:720px){.slide{padding:44px 28px}h1{font-size:42px}h2{font-size:32px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass with Venkat',h:'The De-Risk Method',sub:'Why your biggest deals slip, and the review that catches it first.',foot:'Venkataraman Subramanyan, Founder and Director, Tripura Multinational'},
 {t:'who',kicker:'Who this is for',h:'Sales leaders carrying the number.',lead:'If you run a sales team and a few large deals decide your quarter, this hour is built for you.',note:'VPs of sales, sales managers, and the reps working the biggest, most complex opportunities.'},
 {t:'trap',kicker:'The trap',h:'The deal looked committed. Then it slipped.',lead:'It was in the forecast. The champion loved you. Procurement went quiet, a new name appeared on the last call, and the quarter closed without it.',note:'Every leader has lived this. Most treat it as bad luck. It almost never is.'},
 {t:'reframe',kicker:'The reframe',ghost:'Close harder',solid:'Qualify <em>better.</em>',note:'Coaching a rep to push harder on a deal that was never real just burns the quarter faster. The leverage is not effort. It is seeing the risk early enough to act on it.'},
 {t:'problem',kicker:'Part one: the core problem',h:'Risk hides where no one is looking.',lead:'Big deals do not fall apart at the close. They fall apart quietly, weeks earlier, in the gaps nobody inspected.',points:['The real economic buyer was never in the room','A silent competitor was shaping the requirements','There was no cost to the customer of doing nothing']},
 {t:'problem2',kicker:'Part one',h:'A healthy-looking pipeline can be lying to you.',lead:'Stage and probability on a dashboard measure activity, not truth. A pipeline can look full and still be hollow.',note:'If revenue keeps surprising you on the downside, the pipeline is not the problem. The way it is inspected is.'},
 {t:'cost',kicker:'Part one',h:'What one slipped deal really costs.',lead:'It is not just the number. It is the forecast you defended, the hiring you planned against it, and the rep who stops trusting the pipeline.',note:'Qualification is the cheapest insurance in sales. It just rarely gets coached.'},
 {t:'framework',kicker:'Part two: the system',h:'VICTORY, on a foundation called SASTRA.',lead:'VICTORY is the deal-qualification framework we use to surface risk and build a mitigation plan for your largest opportunities. SASTRA is the operating foundation beneath every engagement.',note:'It is simple on purpose. A framework only works when a busy team will actually run it.'},
 {t:'pillar',kicker:'Plan better',h:'Plan the account before you work the deal.',lead:'Account, territory, and organization planning, validated against what the customer actually believes, not what the CRM says.',points:['Where the real growth sits in the account','Who you need, and who you are missing','The three-year view, not just this quarter']},
 {t:'pillar',kicker:'Qualify better',h:'Run the review that separates real from hopeful.',lead:'This is the heart of VICTORY: a short, repeatable deal review that forces the hidden risk into the open before it decides the forecast for you.',points:['Who actually signs the check','What breaks this deal in the last mile','The mitigation plan for each named risk']},
 {t:'pillar',kicker:'Orchestrate better',h:'Run the complex deal as a team sport.',lead:'The biggest deals are won by orchestration across the customer, your team, and your partners, not by a single hero rep.',points:['Map every stakeholder and their stake','Sequence the moves across the account','Bring partners in where they add weight']},
 {t:'pillar',kicker:'Expand better',h:'The best new pipeline is often already yours.',lead:'A qualified, well-run account keeps giving. Expansion is where account planning pays off a second and third time.',note:'Plan. Qualify. Orchestrate. Expand. One loop, run again and again.'},
 {t:'dealreview',kicker:'The artifact',h:'The four questions, before you call it committed.',points:['Who actually signs the check, and have you met them','What breaks this deal in the last mile','The mitigation plan for each risk you just named','The one next move that genuinely moves it forward'],note:'If a deal cannot answer these, it is not committed. It is hopeful. Now you know, while there is still time to act.'},
 {t:'example',kicker:'Part three: the live walkthrough',h:'A worked deal, live.',lead:'In the masterclass we take one real stalled opportunity and run it through the review together, out loud, so you see exactly how the risk surfaces and what the next move becomes.',note:'You leave able to run the same review on your own largest open deal this week.'},
 {t:'manager',kicker:'Part three',h:'Build a team that does not need you in the room.',lead:'The goal is not that you qualify every deal. It is that your managers coach the review until it becomes a habit the team runs without you.',note:'Business dynamics meet people dynamics. We coach the method and the fears, uncertainty, and skepticism that stop people using it.'},
 {t:'habit',kicker:'Part three',h:'A system, not a pep talk.',lead:'A coaching habit is built, not announced. Our engagements run as a cadence so the review sticks after the applause fades.',statrow:[{n:'15',l:'live coaching sessions'},{n:'9',l:'months to build the habit'},{n:'4',l:'pillars, one repeatable loop'}]},
 {t:'credibility',kicker:'Why learn this from Venkat',h:'Thirty years of coaching the deals that matter most.',lead:'Venkataraman Subramanyan has spent his career coaching sales leaders and their teams through their largest, most complex opportunities across Asia and worldwide.',points:['Over 7,500 hours of coaching','Member, Forbes Coaches Council','VICTORY licensed worldwide by organizations']},
 {t:'proof',kicker:'The track record',h:'The method, measured.',statrow:[{n:'$3B',l:'opportunities filtered through VICTORY each year'},{n:'$4B',l:'net-new revenue found through account planning'},{n:'$5B',l:'combined pipeline coached globally'}],quote:'Venkat is the father of modern sales.',cite:'Yellow.ai'},
 {t:'recap',kicker:'In one line',h:'Stop coaching your team to close harder. Coach them to qualify better.',note:'See the risk early. Build the mitigation plan. Make the review a habit. The biggest deals stop slipping by accident.'},
 {t:'cta',kicker:'Your next step',h:'Bring this to your team.',step:'Book a VICTORY deal review with the Tripura team, and we will run it on one of your real open deals.',note:'Start at tripuramultinational.com.',disclaimer:'This masterclass is educational. No specific sales or revenue result is guaranteed. Results vary and depend on your market, your team, and your execution.'}
];
const deck=document.getElementById('deck');
function esc(x){return x==null?'':x;}
S.forEach(function(s){
  var el=document.createElement('section');
  el.className='slide '+s.t;
  var html='';
  if(s.kicker){html+='<div class="kicker">'+esc(s.kicker)+'</div>';}
  if(s.t==='reframe'){
    html+='<div><span class="ghost">'+esc(s.ghost)+'</span></div>';
    html+='<div class="solid">'+esc(s.solid)+'</div>';
    if(s.note){html+='<div class="note">'+esc(s.note)+'</div>';}
    el.innerHTML=html; deck.appendChild(el); return;
  }
  if(s.t==='title'){html+='<h1>'+esc(s.h)+'</h1>';}
  else{html+='<h2>'+esc(s.h)+'</h2>';}
  if(s.sub){html+='<div class="sub">'+esc(s.sub)+'</div>';}
  if(s.lead){html+='<div class="lead">'+esc(s.lead)+'</div>';}
  if(s.points){var li=s.points.map(function(p,idx){return '<li class="'+(s.t==='dealreview'?'q':'')+'">'+esc(p)+'</li>';}).join('');html+='<ul class="points">'+li+'</ul>';}
  if(s.statrow){var sr=s.statrow.map(function(x){return '<div class="stat"><div class="n">'+esc(x.n)+'</div><div class="l">'+esc(x.l)+'</div></div>';}).join('');html+='<div class="statrow">'+sr+'</div>';}
  if(s.quote){html+='<div class="quote">&ldquo;'+esc(s.quote)+'&rdquo;</div>';}
  if(s.cite){html+='<div class="cite">'+esc(s.cite)+'</div>';}
  if(s.step){html+='<div class="step">'+esc(s.step)+'</div>';}
  if(s.note){html+='<div class="note">'+esc(s.note)+'</div>';}
  if(s.foot){html+='<div class="foot">'+esc(s.foot)+'</div>';}
  if(s.disclaimer){html+='<div class="disc">'+esc(s.disclaimer)+'</div>';}
  el.innerHTML=html; deck.appendChild(el);
});
</script>
</body>
</html>
