<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Listing-First Agent — Real Estate Sales Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f8f7;        /* light ground, from site white scheme */
    --panel:#eef1f1;     /* pale panel */
    --rule:#d5dbe7;      /* brand pale blue-grey, verbatim */
    --ink:#1f2224;       /* brand body charcoal, verbatim */
    --muted:#5a6566;
    --accent:#1a4a4f;    /* brand signature teal, verbatim */
    --secondary:#1e3130; /* brand heading deep-green, verbatim */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Literata',Georgia,serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px}
  .slide{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:54px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(26,74,79,.04)}
  .slide.title{background:var(--secondary);color:#fff;border-color:var(--secondary)}
  .slide.part{background:var(--accent);color:#fff;border-color:var(--accent)}
  .eyebrow{font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  .slide.title .eyebrow,.slide.part .eyebrow{color:rgba(255,255,255,.75)}
  h1{font-family:'Outfit',sans-serif;font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Outfit',sans-serif;font-weight:600;font-size:33px;line-height:1.12;letter-spacing:-.01em;margin-bottom:20px;color:var(--secondary)}
  .slide.part h2{color:#fff;font-size:40px}
  .lead{font-size:20px;color:var(--muted);max-width:44ch}
  .slide.title .lead{color:rgba(255,255,255,.88);max-width:52ch}
  p.body{font-size:18px;margin-bottom:14px;max-width:60ch}
  ul{list-style:none;margin-top:8px}
  li{font-size:18px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative;max-width:62ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .pillar-no{font-family:'Outfit',sans-serif;font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.08em}
  .big{font-family:'Outfit',sans-serif;font-weight:700;font-size:72px;color:var(--accent);line-height:1}
  .statline{display:flex;gap:40px;flex-wrap:wrap;margin-top:12px}
  .stat .n{font-family:'Outfit',sans-serif;font-weight:700;font-size:42px;color:var(--accent)}
  .stat .l{font-size:15px;color:var(--muted);max-width:20ch}
  .quote{font-family:'Outfit',sans-serif;font-weight:600;font-size:30px;line-height:1.2;color:var(--secondary);max-width:28ch}
  .foot{margin-top:26px;font-size:14px;color:var(--muted)}
  .presenter{margin-top:26px;font-size:16px;color:rgba(255,255,255,.9)}
  .cta-steps li::before{background:#fff}
  .slide.part.cta{background:var(--secondary);border-color:var(--secondary)}
  .disclaimer{margin-top:28px;font-size:12.5px;color:rgba(255,255,255,.72);max-width:60ch;line-height:1.5}
  .kicker{font-size:16px;color:var(--muted);margin-top:14px;max-width:58ch}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live training for real estate agents',
   h:'The Listing-First Agent',
   lead:'How to manufacture listing inventory in any market, instead of living and dying by buyer leads.',
   presenter:'Presented live by Abe Safa and Greg Harrelson, Real Estate Sales Solutions. Active agents, still taking listings every month.'},

  {t:'std', eyebrow:'Who this is for',
   h:'If you are tired of renting your income',
   body:'This is for the solo agent or small team who closes deals but never feels in control of the next one.',
   bullets:['You buy buyer leads and chase them at all hours','Your pipeline swings with the market and the season','You work hard, but your income resets to zero every January','You want a business that produces listings on purpose, not by luck']},

  {t:'std', eyebrow:'The trap', h:'You were told the answer was more leads',
   body:'So you bought more buyer leads. Then faster follow-up tools. Then a bigger ad budget. And the treadmill only sped up.',
   kicker:'More buyer leads does not fix a lead-dependent business. It deepens it. The problem was never the number of leads. It was what you were chasing.'},

  {t:'part', eyebrow:'The reframe', h:'Buyers give you chaos. Listings give you control.'},

  {t:'std', eyebrow:'Part one, the core problem', h:'A buyer-led business is a business you do not own',
   bullets:['Buyer leads are a rental. You pay again every month or the pipeline stops','Conversion is brutal, and the market decides your pace, not you','You compete on speed and availability, which has no ceiling of effort','A listing is an asset. It markets you, attracts buyers, and creates the next listing']},

  {t:'std', eyebrow:'Part one', h:'The agent with inventory sets the terms',
   body:'When you control listings, you control exposure, you control your calendar, and you stop bidding against every other agent for the same buyer.',
   kicker:'Every listing you take is a billboard that generates calls, buyers, and seller referrals. Inventory compounds. Bought leads do not.'},

  {t:'part', eyebrow:'Part two', h:'The Listing-First System'},

  {t:'std', eyebrow:'Pillar one', h:'Circle Prospecting',
   body:'Manufacture sellers instead of waiting for them.',
   bullets:['Work the circle of homeowners around every listing, sale, and open house','A simple, repeatable conversation that surfaces the next seller','Turn one listing into the reason three neighbors call you first','Inventory you create, not inventory you hope shows up']},

  {t:'std', eyebrow:'Pillar two', h:'Fanatical Follow-Up',
   body:'The money is in the follow-up almost nobody actually does.',
   bullets:['Most agents quit after two touches. The seller lists on touch eight','A long-horizon cadence that stays in front of future sellers for months','Systematized so it runs whether or not you feel like it that day','You convert the sellers the rest of the market has already abandoned']},

  {t:'std', eyebrow:'Pillar three', h:'Conversion discipline',
   body:'Leads do not convert. Conversations do.',
   bullets:['Scripts and speed that turn online buyer leads into appointments','The objection-handling that holds commission and wins the listing','A repeatable standard for every call, not a different approach each time','This is how a solo agent reaches a double-digit conversion ratio on online buyers']},

  {t:'std', eyebrow:'Pillar four', h:'Systematize, then leverage',
   body:'A listing-first business is built to run without burning you out.',
   bullets:['A tracked daily number, so you always know if you are on pace','A virtual assistant handling the tasks that do not need you','A technology stack that captures and nurtures without you babysitting it','Quarterly planning that resets the plan before the market forces you to']},

  {t:'std', eyebrow:'The cadence', h:'What a listing-first week looks like',
   body:'The system is simple to follow and simple to execute. That is the point.',
   bullets:['Prospect the circle first, every morning, before the day takes over','Follow up fanatically with every future seller already in motion','Convert the conversations in front of you with a standard, not a mood','Review the number, adjust, repeat. Listings become the predictable result']},

  {t:'part', eyebrow:'Part three', h:'Inventory on purpose, every single month'},

  {t:'stat', eyebrow:'The outcome', h:'A solo agent with inventory, not a team with overhead',
   stats:[['10 to 20','listings a month as a systematized solo agent'],['Every month','not a spring spike and a winter drought'],['Your terms','your calendar, your pace, your business']]},

  {t:'std', eyebrow:'Why learn this here', h:'Taught by agents who are still doing it',
   body:'This is not theory from someone who left the business a decade ago.',
   bullets:['Abe Safa and Greg Harrelson still sell real estate today','170 to 200-plus transactions a year, each, in a live market','Every method here is pressure-tested in the current market, not the last one','You learn what is working now, adjusted as the market moves']},

  {t:'std', eyebrow:'The objection', h:'"My market is different"',
   body:'Markets differ. The behavior of sellers does not.',
   kicker:'Homeowners everywhere respond to an agent who shows up around their neighborhood, follows up longer than anyone else, and knows how to have the conversation. The listing-first model travels, because it is built on people, not on a hot market.'},

  {t:'std', eyebrow:'The path', h:'How agents install this with us',
   body:'Inside Agent Success Academy you get the system coached live, every week.',
   bullets:['Weekly live group coaching on listings, buyers, technology, and team','Scripts, trackers, and the follow-up framework ready to use','A community of agents running the same listing-first model','Coaching from agents who are still in the market with you']},

  {t:'std', eyebrow:'In one picture', h:'Stop renting leads. Start building inventory.',
   quote:'Listings are the asset. Everything else is a result of them.'},

  {t:'cta', eyebrow:'Your next step', h:'Join us live inside Agent Success Academy',
   bullets:['Come to the next weekly live coaching session','Get the circle prospecting and follow-up frameworks','Build a listing-first business that produces on purpose'],
   disclaimer:'This training is educational. Real estate results vary and depend on your market, your effort, and your execution. Nothing here is a promise or guarantee of income, listings, or specific results.'}
];

const deck = document.getElementById('deck');
S.forEach(s=>{
  const sec=document.createElement('section');
  sec.className='slide '+(s.t==='title'?'title':s.t==='part'?'part':s.t==='cta'?'part cta':'');
  let html='';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){ html+='<h1>'+s.h+'</h1>'; if(s.lead)html+='<p class="lead">'+s.lead+'</p>'; if(s.presenter)html+='<p class="presenter">'+s.presenter+'</p>'; }
  else if(s.t==='part'){ html+='<h2>'+s.h+'</h2>'; }
  else { html+='<h2>'+s.h+'</h2>'; }
  if(s.body) html+='<p class="body">'+s.body+'</p>';
  if(s.quote) html+='<p class="quote">'+s.quote+'</p>';
  if(s.bullets){ html+='<ul'+(s.t==='cta'?' class="cta-steps"':'')+'>'; s.bullets.forEach(b=>html+='<li>'+b+'</li>'); html+='</ul>'; }
  if(s.stats){ html+='<div class="statline">'; s.stats.forEach(st=>html+='<div class="stat"><div class="n">'+st[0]+'</div><div class="l">'+st[1]+'</div></div>'); html+='</div>'; }
  if(s.kicker) html+='<p class="kicker">'+s.kicker+'</p>';
  if(s.disclaimer) html+='<p class="disclaimer">'+s.disclaimer+'</p>';
  sec.innerHTML=html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
