<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The 90-Day Law Firm Makeover · Million Dollar Attorney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#17211C; --panel:#1E2A24; --rule:#2B3A32;
    --clay:#D98A4A; --sage:#9FB0A3; --cream:#F5F1E8; --grey:#CBD2CA; --dim:#7E8B82;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Manrope',-apple-system,sans-serif;color:var(--cream);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--clay);margin-bottom:2.4vh}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;color:var(--cream);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.4vw}
  .t-normal h1{font-size:3.2vw;max-width:86%}
  .t-normal .body{font-size:1.46vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Manrope',sans-serif;font-size:1.4vw;font-weight:600;color:var(--sage);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--clay),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#243228 0%,#0D1310 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:86%;font-style:italic;color:#F1E9D8}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#243228 0%,#0D1310 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--clay);color:#F0D9BE;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .motif{position:absolute;pointer-events:none;opacity:.92}
  .title-motif{right:6.5%;bottom:9%;width:15vw}
  .corner-motif{right:6%;bottom:7.5%;width:7.4vw;opacity:.42}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--clay);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--clay);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Million Dollar Attorney</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- sunrise motif: three ascending bars with a small rising sun disc -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="sunrise" viewBox="0 0 200 160">
  <rect x="18" y="118" width="26" height="30" rx="2" fill="#D98A4A" opacity="0.5"/>
  <rect x="60" y="92" width="26" height="56" rx="2" fill="#D98A4A" opacity="0.72"/>
  <rect x="102" y="60" width="26" height="88" rx="2" fill="#D98A4A" opacity="0.9"/>
  <circle cx="160" cy="42" r="24" fill="none" stroke="#D98A4A" stroke-width="3.4"/>
  <circle cx="160" cy="42" r="10" fill="#D98A4A"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The 90-Day Law Firm Makeover',sub:'Design the life you actually want. Then build the firm that pays for it, in 90 days.',brand:true,climb:'title'},
 {t:'normal',k:'Who this is for',title:'You built a real law firm. It runs your life instead of the other way around.',body:'You are busy, capable, and doing well by most measures anyone else can see. But the calendar, not you, decides most of your days, and it has for a while.'},
 {t:'normal',k:'The trap',title:'More clients will not fix a firm built around your calendar.',body:'Adding volume to a firm that already runs you just produces a busier version of the same problem. The firm gets bigger. Your life does not get any bigger with it.'},
 {t:'dark',title:'Most firm-growth advice starts with the business and treats your life as whatever is left over. That order is backwards.'},

 {t:'section',idx:'Part One',title:'The Firm That Runs You'},
 {t:'normal',k:'The real cost',title:'Revenue can climb while your life gets smaller.',body:'A firm can hit every growth number that matters on paper, more cases, more revenue, a bigger team, while the owner behind it works longer hours and sees less of the people they built it for in the first place.'},
 {t:'normal',k:'The shift',title:'One formula changes how you respond to everything the firm throws at you.',body:'Before any pillar of the firm gets touched, the Makeover starts with the mental model underneath all of it. Every difficult week starts with an event you did not choose.'},
 {t:'dark',title:'Event plus Response equals Outcome. You cannot control the event. You control the response, and the response decides the outcome.'},

 {t:'section',idx:'Part Two',title:'The Nine Pillars of the Makeover'},
 {t:'normal',k:'Pillar one, Vision',title:'A real plan for the firm, not autopilot.',body:'Clarifying where the firm is actually headed and building a realistic plan around that direction, instead of reacting to whatever the week brings.'},
 {t:'normal',k:'Pillar two, Joy',title:'Energizing work gets built in, not left to chance.',body:'Deliberately designing more of the work you actually enjoy into your daily practice, instead of hoping it shows up on its own.'},
 {t:'normal',k:'Pillar three, Family',title:'A practice designed to support a life outside the office.',body:'The firm gets built to make room for the people and time you actually want, not squeezed in around whatever the firm leaves over.'},
 {t:'normal',k:'The other six, same triage',title:'Marketing, Processes, Money, Sales, Client Glide Path, and Team.',body:'Once Vision, Joy, and Family are set, the practical pillars get built around them: referral-driven marketing, systems that run without you touching every file, financial clarity, selling without pressure, a client experience that generates its own referrals, and a team that actually delegates.'},
 {t:'dark',title:'There is no generic playbook. Every Makeover is built around your actual numbers, your actual team, your actual client experience.'},

 {t:'section',idx:'Part Three',title:'What It Looks Like'},
 {t:'normal',k:'The daily tool',title:'A Power Hour, built for you specifically.',body:'A short, customized morning routine, meditation, reading, movement, whatever fits, run before the day\'s decisions start, so the response to the day is chosen, not reactive.'},
 {t:'normal',k:'The mindset',title:'Success is mostly mindset, not just hours worked.',body:'The belief underneath the whole Makeover: success runs closer to 80, even 90, percent mindset, and the rest is the hard work everyone already knows how to do.'},
 {t:'normal',k:'The delegation lens',title:'Find the lowest-paid, competent person for every task.',body:'A plain breakdown of service delivery into its real steps, used to see exactly where hiring gaps, pricing gaps, and misallocated work are quietly costing you your own time.'},
 {t:'normal',k:'Why Wendy',title:'16 years turning law firm strategy into an actual life.',body:'I am Wendy Witt, a licensed attorney in Pennsylvania and Florida. I built my own estate-planning practice and doubled its revenue in the first year, then led a 4,500-member national attorney association and served as a senior executive at WealthCounsel before founding Million Dollar Attorney.'},

 {t:'section',idx:'Your next step',title:'A Free 90-Day Makeover Strategy Session'},
 {t:'cta',title:'Schedule your free strategy session.',chips:['milliondollarattorney.as.me/StrategySession90Day'],disc:'Educational content for law firm owners only. No income, revenue, or business result is guaranteed. Results vary by firm, owner, and market.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#sunrise"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Million Dollar Attorney &middot; <b>Wendy Witt</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.climb) h+=motif(s.climb);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
