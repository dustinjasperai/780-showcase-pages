<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experience Being a Professional Coach, Empower World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9fc;        /* off-white with faint purple warmth (from brand.json light scheme) */
    --panel:#ecf0f1;     /* their grey panel */
    --rule:#395775;      /* their dominant steel blue */
    --accent:#9661b0;    /* their brand purple (H2/links/body) */
    --ink:#2a2440;       /* deep plum-ink text */
    --muted:#6b647e;
    --disp:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Spectral',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--rule);font-family:var(--body);color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  .stage{width:100%;max-width:960px;margin:0 auto;padding:24px}
  .slide{background:var(--bg);border-radius:14px;padding:64px 66px;min-height:540px;
    display:none;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 18px 50px rgba(41,36,64,.28);border-top:5px solid var(--accent)}
  .slide.on{display:flex}
  .eyebrow{font-family:var(--disp);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--disp);font-weight:700;font-size:44px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.12;color:var(--ink)}
  .kicker{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--rule);margin-bottom:14px}
  .sub{font-size:21px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:34em}
  p.body{font-size:21px;line-height:1.55;color:var(--ink);margin-top:20px;max-width:34em}
  ul{margin-top:24px;list-style:none;max-width:36em}
  li{font-size:20px;line-height:1.4;color:var(--ink);padding:12px 0 12px 30px;position:relative;
    border-bottom:1px solid rgba(57,87,117,.14)}
  li:before{content:"";position:absolute;left:0;top:21px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .big{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1.1;color:var(--ink);max-width:16em}
  .lead-k{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent)}
  .lead-h{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1.12;margin-top:16px}
  .cta-box{background:var(--panel);border-left:5px solid var(--accent);border-radius:10px;
    padding:28px 30px;margin-top:26px;max-width:36em}
  .disc{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:30px;max-width:40em}
  .num{position:absolute;bottom:22px;right:28px;font-family:var(--disp);font-size:12px;
    letter-spacing:.1em;color:var(--muted)}
  .brandmark{position:absolute;bottom:22px;left:30px;font-family:var(--disp);font-weight:600;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rule)}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:9}
  .nav button{font-family:var(--disp);font-size:13px;border:none;background:rgba(255,255,255,.9);
    color:var(--ink);border-radius:20px;padding:8px 16px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="stage"><div id="slide" class="slide on"></div></div>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S=[
  {t:'title',eyebrow:'Experience Being a Professional Coach',h:'What a Real Coaching Conversation Actually Feels Like',sub:'A live experience with Empower World, led by two ICF Master Certified Coaches.'},
  {t:'list',k:'Who this is for',h:'This session is for you if',items:[
    'People already turn to you, and you want to go deeper than advice',
    'You are considering a career shift into coaching',
    'You lead people and want to empower them, not just direct them',
    'You are curious whether professional coach training is for you']},
  {t:'point',k:'The trap',h:'You think you need all the answers first.',b:'Most people who feel called to coach wait on the sidelines, convinced they are not qualified until they know more than the person in front of them. That belief is the single biggest thing standing between you and this work.'},
  {t:'big',k:'A reframe',big:'The best coaches give no advice at all.'},
  {t:'lead',k:'Part One',h:'Why knowing the model is not enough'},
  {t:'point',h:'A certificate proves you studied. It does not prove you can hold the room.',b:'You can learn every competency on paper and still freeze the first time a real person brings you something real. Coaching is a felt skill. It is learned by doing it, with guidance, until it becomes natural.'},
  {t:'list',k:'The boundary',h:'Coaching is NOT',items:[
    'Giving advice or having all the answers',
    'Consulting or doing the work for someone',
    'Therapy',
    'A pep talk']},
  {t:'lead',k:'Part Two',h:'The Coach Approach'},
  {t:'point',h:'Listen deeply, beyond the words.',b:'Not just hearing what someone says, but taking in what they mean, what they need, and what they are not yet saying. People feel the difference, and they remember it.'},
  {t:'point',h:'Ask powerful, transformative questions.',b:'The right question does what no answer can. It creates awareness about who someone is, what they truly want, and the next step only they can choose. That is the craft at the centre of coaching.'},
  {t:'point',h:'Stay present. Trust the person.',b:'You are not there to fix, solve, or carry it for them. You hold the space so they can think clearly and reconnect to their own wisdom, creativity, and resourcefulness.'},
  {t:'lead',k:'Part Three',h:'The Coach’s Chair'},
  {t:'point',h:'You will not watch coaching. You will do it.',b:'In this live, experiential session you step into the coach’s chair and coach a real person through a real topic, with our teaching and guidance in the moment. You arrive curious. You leave having actually coached someone.'},
  {t:'list',k:'What shifts, even from a taste',h:'After one guided experience',items:[
    'You become a noticeably better listener',
    'You become more present, and people feel it',
    'Your questions start to open rooms instead of closing them',
    'Your relationships deepen, personally and professionally']},
  {t:'point',k:'Why Empower World',h:'Taught by two Master Certified Coaches.',b:'Empower World was founded in 2012 by Jeanine Bailey and Marie Quigley, both MCC, the highest credential the International Coaching Federation awards, and both certified Coaching Supervisors. Thirteen years training professional coaches across Qatar and internationally, trusted by organisations including Ooredoo, Siemens, Qatar Museums, and Sidra.'},
  {t:'list',k:'The whole of it',h:'Three things you will leave with',items:[
    'The Coach Approach: listen deeply, ask powerful questions',
    'The boundary: what coaching is, and what it is not',
    'The felt experience of holding a transformational conversation']},
  {t:'cta',k:'Your next step',h:'Ready to sit in the coach’s chair?',b:'If this stirred something, the ICF-Approved Professional Coach Training and Leadership Programme is where it goes deeper, toward an internationally recognised credential and a coaching practice of your own. Book a discovery call with us to explore whether it is your next chapter. No pressure, just clarity.',
    disc:'This session is educational. Coaching outcomes vary from person to person, and nothing here is a promise or guarantee of income, results, employment, or any particular credential outcome. Credentialing is governed by the International Coaching Federation.'}
];
let i=0;
function render(){
  const s=S[i];const el=document.getElementById('slide');let h='';
  if(s.eyebrow)h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){h+='<h1>'+s.h+'</h1>';if(s.sub)h+='<div class="sub">'+s.sub+'</div>';}
  else if(s.t==='lead'){h+='<div class="lead-k">'+s.k+'</div><div class="lead-h">'+s.h+'</div>';}
  else if(s.t==='big'){if(s.k)h+='<div class="kicker">'+s.k+'</div>';h+='<div class="big">'+s.big+'</div>';}
  else if(s.t==='list'){if(s.k)h+='<div class="kicker">'+s.k+'</div>';h+='<h2>'+s.h+'</h2><ul>';s.items.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  else if(s.t==='point'){if(s.k)h+='<div class="kicker">'+s.k+'</div>';h+='<h2>'+s.h+'</h2>';if(s.b)h+='<p class="body">'+s.b+'</p>';}
  else if(s.t==='cta'){if(s.k)h+='<div class="kicker">'+s.k+'</div>';h+='<h2>'+s.h+'</h2><div class="cta-box"><p class="body" style="margin-top:0">'+s.b+'</p></div>';if(s.disc)h+='<div class="disc">'+s.disc+'</div>';}
  h+='<div class="brandmark">Empower World</div><div class="num">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
