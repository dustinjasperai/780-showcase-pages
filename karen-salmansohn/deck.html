<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Make a Profitable Course Without the Overwhelm - Karen Salmansohn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF5EF; --panel:#FFFFFF; --rule:#E7DCD1;
    --ink:#17110F; --muted:#6B5F57;
    --accent:#F0576B; --accent2:#1EA896;
    --head:'Bricolage Grotesque',system-ui,sans-serif; --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:60px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .kicker{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  .tag{display:inline-block;font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-bottom:16px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.015em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.01em;margin-bottom:16px}
  .sub{font-size:20px;color:var(--muted);max-width:30ch}
  .big{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.1;letter-spacing:-.015em;max-width:20ch}
  .body{font-size:20px;color:var(--ink);max-width:40ch}
  .foot{font-family:var(--head);font-weight:600;font-size:17px;color:var(--muted);margin-top:26px}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:4px;top:21px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .pill{position:absolute;top:44px;right:52px;font-family:var(--head);font-weight:800;font-size:60px;color:var(--rule)}
  .cta-slide{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .cta-slide .kicker{color:var(--accent)}
  .cta-slide h1{color:var(--bg)}
  .cta-btn{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;font-family:var(--head);font-weight:700;font-size:19px;padding:16px 30px;border-radius:12px;align-self:flex-start}
  .disc{font-size:13px;color:#A99C92;margin-top:30px;max-width:55ch;line-height:1.5}
  .accent-rule{width:72px;height:6px;border-radius:3px;background:var(--accent);margin-bottom:26px}
  .num{color:var(--accent)}
  @media(max-width:640px){.slide{padding:40px 28px;min-height:340px}h1{font-size:34px}h2{font-size:27px}.big{font-size:30px}.pill{font-size:40px;top:28px;right:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A free live masterclass', h:'How to Make a Profitable Course Without the Overwhelm', sub:'Turn what you already know into one simple course that sells. No big launch, no complicated tech.', foot:'with Karen Salmansohn'},

  {t:'who', h:'This is for you if', list:['You have real knowledge or a skill people would pay to learn','You have been meaning to build a course for months, maybe years','The thought of a big launch makes you want to lie down','You do not have a huge audience yet, and you are tired of being told you need one']},

  {t:'hook', big:'You are one simple course away from income you do not trade hour for hour.', body:'The only thing standing in the way is the way you were told to build it.'},

  {t:'reframe', big:'The overwhelm is not the price of a course.', body:'It is the price of the complicated way you were told to make one.'},

  {t:'part', tag:'Part one', h:'Why most courses never get finished', body:'It is almost never the teaching. You can already teach the thing. What stops people is the production, the launch theatre, and the tech stack they were told they need. Take those away and the course actually gets built.'},

  {t:'part', tag:'Part two', h:'The Without-The-Overwhelm method', sub:'Five plain moving parts. That is the whole system.'},

  {t:'pillar', n:'01', h:'Short video lessons', body:'Record the entire course as 2 to 10 minute videos, on the same laptop you already own. Short lessons are easier to make, easier to watch, and far easier to actually finish.'},

  {t:'pillar', n:'02', h:'One high-converting sales page', body:'Not a maze of pages. One page, built to turn a reader into a buyer, using the same design eye that put two million books into readers hands.'},

  {t:'pillar', n:'03', h:'Subscriber-to-sales emails', body:'A simple sequence that turns free subscribers into paying students, without a launch event and without a countdown timer manufacturing fake urgency.'},

  {t:'pillar', n:'04', h:'A lead magnet that does the feeding', body:'One free, genuinely useful asset that brings exactly the right people to your sales page, already warm and ready to buy.'},

  {t:'pillar', n:'05', h:'The small-audience playbook', body:'You do not need a hundred thousand followers. You need the right hundred. An entire part of the method is built for people who do not have a big list yet.'},

  {t:'part', tag:'Part three', h:'What it looks like when it works', body:'A finished course of short, watchable videos. One page that sells it while you sleep. Income that is no longer capped by the hours in your day. Built once, and sold for years.'},

  {t:'proof', h:'Why me', body:'I have sold about two million books, built NotSalmon into a community of 1.5 million people, and written for Oprah and Psychology Today. I am an award-winning designer who has turned expertise into products for a living. Now I will show you how to do it with yours.'},

  {t:'cta', kicker:'Your next step', h:'Build the course you have been putting off', body:'If you want the whole method, lesson by lesson, come build it with me.', cta:'Join Make Profitable Courses', disc:'This masterclass is educational only. No income, role, or specific result is guaranteed. Outcomes vary with your effort, your audience, and your market.'}
];

function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const deck = document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta-slide':'');
  let h='';
  if(s.kicker) h+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.tag) h+=`<span class="tag">${esc(s.tag)}</span>`;
  if(s.n) h+=`<div class="pill">${esc(s.n)}</div>`;
  if(s.t==='hook'||s.t==='reframe'){
    h+=`<div class="accent-rule"></div><div class="big">${esc(s.big)}</div>`;
    if(s.body) h+=`<p class="body" style="margin-top:22px">${esc(s.body)}</p>`;
  } else {
    if(s.h) h+= (s.t==='title'||s.t==='cta') ? `<h1>${esc(s.h)}</h1>` : `<h2>${esc(s.h)}</h2>`;
    if(s.sub) h+=`<p class="sub">${esc(s.sub)}</p>`;
    if(s.body) h+=`<p class="body" style="margin-top:14px">${esc(s.body)}</p>`;
    if(s.list){h+='<ul>';s.list.forEach(i=>h+=`<li>${esc(i)}</li>`);h+='</ul>';}
    if(s.cta) h+=`<span class="cta-btn">${esc(s.cta)}</span>`;
    if(s.foot) h+=`<div class="foot">${esc(s.foot)}</div>`;
    if(s.disc) h+=`<p class="disc">${esc(s.disc)}</p>`;
  }
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
