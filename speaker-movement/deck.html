<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Speaker Tours on Repeat | A Masterclass with Steph Wharton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbf9f4;
    --panel:#f2ede3;
    --ink:#292929;
    --ink-soft:#4a463f;
    --ink-muted:#8a8177;
    --rule:#ddd5c7;
    --accent:#292929;
  }
  html,body{height:100%}
  body{background:#e7e1d5;font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{display:none;width:100vw;height:100vh;padding:8vh 9vw;background:var(--bg);flex-direction:column;justify-content:center;position:relative}
  .slide.on{display:flex}
  .kicker{font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:62px;line-height:1.08;letter-spacing:-.01em;color:var(--ink);max-width:16ch}
  h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:44px;line-height:1.14;letter-spacing:-.005em;color:var(--ink);max-width:20ch}
  .lede{font-size:24px;line-height:1.5;color:var(--ink-soft);margin-top:28px;max-width:46ch;font-weight:400}
  .promise{font-family:'Newsreader',Georgia,serif;font-size:27px;line-height:1.45;color:var(--ink-soft);margin-top:30px;max-width:40ch;font-weight:400;font-style:italic}
  .big{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:72px;line-height:1.06;letter-spacing:-.015em;max-width:15ch}
  .big em{font-style:italic;color:var(--accent);border-bottom:4px solid var(--accent);padding-bottom:2px}
  .partnum{font-family:'Newsreader',Georgia,serif;font-size:120px;font-weight:600;color:var(--rule);line-height:1;margin-bottom:10px}
  ul.pts{list-style:none;margin-top:34px;max-width:44ch}
  ul.pts li{font-size:23px;line-height:1.4;color:var(--ink-soft);padding:18px 0 18px 40px;border-top:1px solid var(--rule);position:relative}
  ul.pts li:last-child{border-bottom:1px solid var(--rule)}
  ul.pts li::before{content:'';position:absolute;left:0;top:26px;width:16px;height:16px;border:2.5px solid var(--accent);border-radius:50%}
  .eras{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px;max-width:1000px}
  .era{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:30px 28px}
  .era .n{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
  .era .t{font-family:'Newsreader',Georgia,serif;font-size:27px;font-weight:600;margin-bottom:12px;line-height:1.15}
  .era .d{font-size:17px;line-height:1.45;color:var(--ink-soft)}
  .ways{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;margin-top:36px;max-width:900px}
  .way{display:flex;gap:18px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule)}
  .way .num{font-family:'Newsreader',serif;font-size:26px;font-weight:600;color:var(--accent);min-width:38px}
  .way .wt{font-size:20px;line-height:1.35;color:var(--ink-soft)}
  .way .wt b{color:var(--ink);font-weight:600}
  .credit{display:flex;gap:56px;margin-top:38px;flex-wrap:wrap}
  .stat .v{font-family:'Newsreader',serif;font-size:52px;font-weight:600;color:var(--ink);line-height:1}
  .stat .l{font-size:15px;color:var(--ink-muted);margin-top:8px;letter-spacing:.02em;max-width:16ch}
  .cta-line{font-size:24px;line-height:1.5;color:var(--ink-soft);margin-top:26px;max-width:42ch}
  .cta-btn{display:inline-block;margin-top:34px;background:var(--accent);color:var(--bg);font-weight:600;font-size:20px;padding:18px 38px;border-radius:100px;letter-spacing:.01em}
  .disclaimer{font-size:13px;line-height:1.5;color:var(--ink-muted);margin-top:44px;max-width:60ch;font-weight:400}
  .foot{position:absolute;left:9vw;right:9vw;bottom:5vh;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-muted);letter-spacing:.04em;border-top:1px solid var(--rule);padding-top:16px}
  .foot .b{font-weight:600;color:var(--ink-soft)}
  .nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;z-index:20;font-family:'Montserrat',sans-serif}
  .nav button{background:var(--bg);border:1px solid var(--rule);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
  .nav .count{font-size:13px;color:#6b6b6b}
  @media(max-width:820px){h1{font-size:40px}.big{font-size:46px}h2{font-size:32px}.eras{grid-template-columns:1fr}.ways{grid-template-columns:1fr}.partnum{font-size:80px}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button id="prev">&#8592;</button><span class="count" id="count"></span><button id="next">&#8594;</button></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Steph Wharton', h1:'Book Speaker Tours on Repeat',
   promise:'How underrepresented speakers turn one talk into a booked season, without leaving their culture at the door.'},
  {t:'lede', kicker:'Who this is for', h2:'You know you have something worth saying.',
   lede:'You have the message, the lived experience, the story that a room needs to hear. What you do not have yet is a reliable way to keep getting in front of those rooms.'},
  {t:'list', kicker:'The trap', h2:'Waiting to be discovered is not a strategy.',
   pts:['You apply to speak, then hear nothing back.','You land one great gig, and then silence.','You watch people with a smaller message get the stage you wanted.']},
  {t:'big', kicker:'The shift', big:'Talent gets you on one stage. A <em>system</em> keeps you booked.',
   lede:'The speakers who stay booked are not more gifted. They run a repeatable way to fill their calendar. That is a skill, and it can be learned.'},
  {t:'part', num:'One', label:'Why great speakers stay invisible'},
  {t:'lede', kicker:'The real problem', h2:'It is not your talk. It is that visibility is left to luck.',
   lede:'Most speakers polish the same keynote for a year and hope the right person is in the audience. There is no repeatable process, no follow-up, no plan for the next room. So the calendar stays empty between wins.'},
  {t:'lede', kicker:'What it costs you', h2:'A message that does not travel does not change anything.',
   lede:'Every quiet month is a room that never heard you, a client who never found you, and a movement that stalls before it starts. The stage is how the work spreads.'},
  {t:'part', num:'Two', label:'The Speaker Tours system'},
  {t:'eras', kicker:'The path', h2:'Three Eras, in order.',
   eras:[
     {n:'Era One', t:'Foundations', d:'Build the speaker brand: your identity, your message, your signature talk, and your assets.'},
     {n:'Era Two', t:'Visibility', d:'Book Speaker Tours on Repeat with an inbound and outbound booking system you actually run.'},
     {n:'Era Three', t:'Expansion', d:'Turn a booked calendar into more reach, more revenue, and more rest.'}
   ]},
  {t:'list', kicker:'Era One, Foundations', h2:'Before you pitch a single stage.',
   pts:['A speaker identity that sounds like you, not a polished stranger.','One core message you can carry into any room.','A signature talk that travels across audiences.','A one-page speaker kit that makes the yes easy.']},
  {t:'lede', kicker:'Era Two, Visibility', h2:'Book Speaker Tours on Repeat.',
   lede:'A tour is not one stage. It is a route you run again and again: inbound offers that come to you, and outbound pitches you send on a cadence, so the next booking is already in motion before the last one ends.'},
  {t:'ways', kicker:'Era Two, the booking engine', h2:'Five ways to fill the calendar.',
   ways:[
     {n:'1', b:'Inbound offers.', d:'Make it obvious you speak, and easy to book you.'},
     {n:'2', b:'Outbound pitches.', d:'A repeatable pitch you send to the right rooms.'},
     {n:'3', b:'Warm referrals.', d:'Turn one booked room into an introduction to the next.'},
     {n:'4', b:'Content that travels.', d:'Show the talk so organizers can picture you on stage.'},
     {n:'5', b:'Community and directories.', d:'Be findable where bookers are already looking.'}
   ]},
  {t:'lede', kicker:'Era Three, Expansion', h2:'More reach, more revenue, more rest.',
   lede:'A full calendar is not the finish line. Era Three turns bookings into paid work, offers, and a body of work that grows, while you protect the pace that keeps you in it for the long run.'},
  {t:'big', kicker:'The whole idea', big:'A tour, not a <em>one-off.</em>',
   lede:'One yes should point to the next. When booking is a route you run on repeat, a single stage becomes a booked season, and a booked season becomes a career.'},
  {t:'part', num:'Three', label:'The booked calendar'},
  {t:'list', kicker:'What changes for you', h2:'A calendar that fills itself, on purpose.',
   pts:['A steady flow of rooms, not one lucky win a year.','A speaker brand that organizers recognize.','A pitch you can send in ten minutes, whenever you want the next stage.']},
  {t:'lede', kicker:'On your terms', h2:'Without leaving your culture at the door.',
   lede:'You do not have to shrink your voice to be booked. The whole point is to be seen as you are, in your language and your story, and to build the career without the burnout that made you doubt it was possible.'},
  {t:'why', kicker:'Who is teaching this', h2:'Steph Wharton, founder of The Speaker Movement.',
   lede:'A Latina speaker and coach who built a booked speaking career on her own terms and now helps underrepresented speakers do the same.',
   stats:[{v:'150+', l:'speakers featured in the movement'},{v:'The Speaker Directory', l:'making underrepresented speakers findable'}]},
  {t:'cta', kicker:'Your next step', h1:'Ready to build your Speaker Era?',
   ctaLine:'If you are ready to stop waiting to be picked and start booking on repeat, this is the room where it begins.',
   btn:'Join Speaker Era with Steph',
   disclaimer:'This masterclass is for education only. No booking, result, or income is guaranteed. Results vary and depend on your own effort and circumstances.'}
];

function render(s){
  const F = '<div class="foot"><span class="b">The Speaker Movement</span><span>Book Speaker Tours on Repeat</span></div>';
  const K = s.kicker ? `<div class="kicker">${s.kicker}</div>` : '';
  switch(s.t){
    case 'title': return `${K}<h1>${s.h1}</h1><div class="promise">${s.promise}</div>${F}`;
    case 'lede': return `${K}<h2>${s.h2}</h2><div class="lede">${s.lede}</div>${F}`;
    case 'list': return `${K}<h2>${s.h2}</h2><ul class="pts">${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>${F}`;
    case 'big': return `${K}<div class="big">${s.big}</div><div class="lede">${s.lede}</div>${F}`;
    case 'part': return `<div class="partnum">${s.num}</div><div class="kicker">Part ${s.num}</div><h1>${s.label}</h1>${F}`;
    case 'eras': return `${K}<h2>${s.h2}</h2><div class="eras">${s.eras.map(e=>`<div class="era"><div class="n">${e.n}</div><div class="t">${e.t}</div><div class="d">${e.d}</div></div>`).join('')}</div>${F}`;
    case 'ways': return `${K}<h2>${s.h2}</h2><div class="ways">${s.ways.map(w=>`<div class="way"><span class="num">${w.n}</span><span class="wt"><b>${w.b}</b> ${w.d}</span></div>`).join('')}</div>${F}`;
    case 'why': return `${K}<h2>${s.h2}</h2><div class="lede">${s.lede}</div><div class="credit">${s.stats.map(st=>`<div class="stat"><div class="v">${st.v}</div><div class="l">${st.l}</div></div>`).join('')}</div>${F}`;
    case 'cta': return `${K}<h1>${s.h1}</h1><div class="cta-line">${s.ctaLine}</div><a class="cta-btn">${s.btn}</a><div class="disclaimer">${s.disclaimer}</div>${F}`;
  }
  return '';
}

let i = 0;
const stage = document.getElementById('stage');
const count = document.getElementById('count');
function show(n){
  i = Math.max(0, Math.min(S.length-1, n));
  stage.innerHTML = `<div class="slide on">${render(S[i])}</div>`;
  count.textContent = (i+1) + ' / ' + S.length;
}
document.getElementById('next').onclick = ()=>show(i+1);
document.getElementById('prev').onclick = ()=>show(i-1);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(i+1);
  if(e.key==='ArrowLeft') show(i-1);
});
stage.addEventListener('click', e=>{ if(!e.target.closest('.nav')) show(i+1); });
show(0);
</script>
</body>
</html>
