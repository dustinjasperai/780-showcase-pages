<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Woman Behind the Brand - a masterclass with Lynne Taggart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4;      /* warm cream ground - her light scheme */
    --panel:#f1ebe3;   /* lighter taupe tint */
    --rule:#d8ccbb;    /* desaturated tint of the brand hex */
    --accent:#896b50;  /* brand dominant from brand.json */
    --ink:#2b241d;     /* warm near-black */
    --muted:#6f6353;
    --display:'Playfair Display',Georgia,serif;
    --body:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--rule);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{max-width:1040px;margin:0 auto;padding:28px 18px 70px}
  .slide{
    position:relative;background:var(--bg);border-radius:4px;
    aspect-ratio:16/9;margin:0 0 26px;padding:64px 72px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 44px rgba(43,36,29,.09);
  }
  .slide::after{content:"";position:absolute;left:72px;bottom:40px;width:64px;height:2px;background:var(--accent);opacity:.9}
  .eyebrow{font-family:var(--body);text-transform:uppercase;letter-spacing:.32em;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.04;letter-spacing:-.01em;max-width:18ch}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.12;max-width:20ch;margin-bottom:20px}
  p{font-size:21px;line-height:1.55;max-width:40ch;color:var(--ink)}
  p.lede{font-size:24px;color:var(--muted);max-width:42ch}
  .sub{margin-top:18px;color:var(--muted)}
  .kicker{font-family:var(--display);font-style:italic;font-size:26px;color:var(--accent);margin-bottom:14px}
  ul{list-style:none;margin-top:10px}
  li{font-size:21px;line-height:1.5;padding-left:30px;position:relative;margin-bottom:16px;max-width:42ch}
  li::before{content:"";position:absolute;left:0;top:12px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .big{font-family:var(--display);font-size:46px;line-height:1.14;font-weight:600;max-width:24ch}
  .pill{display:inline-block;font-family:var(--body);font-size:14px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;margin-bottom:24px}
  .num{font-family:var(--display);font-style:italic;color:var(--accent);font-size:30px;margin-bottom:8px}
  .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;margin-top:22px}
  .cols h3{font-family:var(--display);font-weight:600;font-size:24px;margin-bottom:8px}
  .cols p{font-size:17px;line-height:1.45}
  .title-slide{background:linear-gradient(180deg,#faf8f4 0%,#f1ebe3 100%)}
  .title-slide h1{font-size:66px}
  .presenter{margin-top:30px;font-family:var(--body);font-size:18px;color:var(--muted);letter-spacing:.02em}
  .disc{font-size:14px;color:var(--muted);max-width:60ch;margin-top:22px;line-height:1.5}
  .pagewrap{position:absolute;right:26px;bottom:26px;font-size:13px;color:var(--muted);font-family:var(--body)}
  @media(max-width:720px){
    .slide{padding:34px 30px;aspect-ratio:auto;min-height:72vh}
    h1{font-size:40px}.title-slide h1{font-size:42px}h2{font-size:30px}.big{font-size:30px}
    .cols{grid-template-columns:1fr;gap:16px}
    .slide::after{left:30px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S=[
 {t:'title',eyebrow:'A FREE LIVE MASTERCLASS',h:'The Woman Behind the Brand',sub:'Why your content converts when you do - feminine-led selling for founders who are ready to be met at the next level.',presenter:'with Lynne Taggart - Identity &amp; Wealth Mentor'},

 {t:'lede',eyebrow:'What this hour gives you',h:'By the end of this masterclass',bullets:['A clear read on why more content has stopped moving the needle for you','The three things that have to align before a single post sells','A way to sell from who you are becoming, not who you have outgrown']},

 {t:'who',eyebrow:'Who this is for',h:'You are already building something real',p:'You are a founder with a brand, an audience and offers you believe in. Six, seven, maybe eight figures in. You are not short on effort or ideas. You are short on the feeling that your content lands the way you know it could.'},

 {t:'trap',eyebrow:'The loop you are in',h:'So you keep changing the wrong thing',p:'New branding. A new offer. Another funnel. Another content system. Each one works for a moment and then goes quiet again, and the quiet makes you reach for the next tactic.',sub:'The tactics are not the problem. They never were.'},

 {t:'hook',eyebrow:'The reframe',h:'The market is not tired of your content. It is reading you.',p:'Buyers feel the woman behind the words long before they read them. When you are in lack, in proving, in hustle, your content carries that frequency - and premium buyers quietly move on.'},

 {t:'part',pill:'Part One',kicker:'The core problem',h:'Your content is only as powerful as the woman creating it',p:'Content strategy treats the post as the product. But the post is a mirror. It can only sell at the level of identity and energy the woman behind it is holding.'},

 {t:'why',eyebrow:'Why tactics stop working',h:'A louder tactic amplifies whatever you are already transmitting',p:'If the signal underneath is doubt, discounting and over-giving, better hooks just broadcast it further. This is why two founders can run the identical strategy and only one of them sells.'},

 {t:'framework',eyebrow:'Part Two - the method',h:'Three things that must align',p:'Everything I teach lives in the space between these three. When they are aligned, content creates desire. When they are not, it creates reach and nothing else.',cols:[['The Woman','Your identity and your energy around money, visibility and receiving.'],['The Message','What you say, and the feminine buyer psychology underneath why it lands.'],['The Buyer Experience','How it feels to move toward you - presence, visuals, energy, the whole brand as an experience.']]},

 {t:'pillar',num:'The first alignment',h:'The Woman',p:'This is the inner work most strategy skips. If your energy is stuck in lack, you unconsciously price, pitch and post from scarcity. The shift is becoming an energetic match for the wealth and the clients you say you want.',sub:'This is the ground my Genesis work is built on.'},

 {t:'pillar',num:'The second alignment',h:'The Message',p:'Feminine buyer psychology is not softer marketing. It is understanding that women buy the transformation and the felt safety of the person offering it. Your message either creates that trust and desire, or it informs and is forgotten.'},

 {t:'pillar',num:'The third alignment',h:'The Buyer Experience',p:'Your brand is not your logo. It is the experience of moving toward you - your presence, your visuals, your energy, the way it feels to be in your world. That experience is what turns attention into desire.'},

 {t:'compound',eyebrow:'How they compound',h:'Aligned, they do the selling for you',p:'When the woman, the message and the buyer experience line up, you stop chasing. The right people feel the congruence, trust it fast, and arrive ready. The content gets easier and the sales get quieter and bigger.'},

 {t:'practice',eyebrow:'A practice you can use today',h:'Clear Your Field',p:'Before you create or sell, you can clear the fear in seconds. A simple three-step practice to come back to courage and higher standards, so you create from presence instead of protection.'},

 {t:'part',pill:'Part Three',kicker:'Alive and rich inside',h:'What changes when the woman changes',p:'Rates rise without flinching. The over-explaining stops. You attract all-in clients instead of convincing hesitant ones. The business starts to feel alive and rich on the inside, not just busy.'},

 {t:'shift',eyebrow:'The real before and after',h:'From proving to being met',cols:[['Before','Posting daily, adjusting the offer, hoping the next tactic is the one. Selling from who you have outgrown.'],['The shift','Aligning the woman, the message and the experience. Selling from who you are becoming.'],['After','Content that creates desire, buyers who arrive ready, a brand that feels like you at the next level.']]},

 {t:'whyme',eyebrow:'Why me',h:'I have spent a career on what makes people buy',p:'I started in retail at seventeen and spent decades in buying, selling and ownership before building a global mentorship business. For over a decade I have worked with women building six, seven and eight figure brands, including work alongside Gabby Bernstein, and the work has been featured in Tatler and the Irish Times.',sub:'Commercial instinct and inner work are not opposites. The founders who sell hold both.'},

 {t:'invite',eyebrow:'Where this goes next',h:'The woman you are becoming already sells differently',p:'If this hour named something true, the next step is simple: do this work with support, in a room built for founders holding a bigger vision of themselves.'},

 {t:'cta',eyebrow:'Your next step',h:'Come and be met',p:'If you are ready to align the woman, the message and the buyer experience and sell from your next level, come and work with me inside Woman Awake and the Expand mentorship.',cta:'Apply to work with Lynne at lynnetaggart.com',disc:'This masterclass is for education only. Nothing here is a promise or guarantee of income or results. Your results depend on your own work, market and circumstances.'}
];

const stage=document.getElementById('stage');
function esc(x){return x==null?'':x}
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='title'?' title-slide':'');
  let h='';
  if(s.pill) h+='<span class="pill">'+esc(s.pill)+'</span>';
  if(s.num) h+='<div class="num">'+esc(s.num)+'</div>';
  if(s.kicker) h+='<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.eyebrow) h+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.t==='title'){
    h+='<h1>'+esc(s.h)+'</h1>';
    if(s.sub) h+='<p class="lede sub">'+esc(s.sub)+'</p>';
    if(s.presenter) h+='<div class="presenter">'+esc(s.presenter)+'</div>';
  } else {
    h+='<h2>'+esc(s.h)+'</h2>';
  }
  if(s.p) h+='<p>'+esc(s.p)+'</p>';
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li>'+esc(b)+'</li>');h+='</ul>';}
  if(s.cols){h+='<div class="cols">';s.cols.forEach(c=>h+='<div><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p></div>');h+='</div>';}
  if(s.sub && s.t!=='title') h+='<p class="sub">'+esc(s.sub)+'</p>';
  if(s.cta) h+='<p class="sub" style="color:var(--accent);font-family:var(--display);font-style:italic;font-size:24px">'+esc(s.cta)+'</p>';
  if(s.disc) h+='<p class="disc">'+esc(s.disc)+'</p>';
  h+='<div class="pagewrap">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=h;
  stage.appendChild(d);
});
</script>
</body>
</html>
