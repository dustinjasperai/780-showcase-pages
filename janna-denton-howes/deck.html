<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanting It More — a live masterclass with Janna Denton-Howes</title>
<link href="https://fonts.googleapis.com/css2?family=Unna:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b2530;        /* from brand #232f3b navy */
    --panel:#243040;     /* raised panel */
    --rule:#37485c;      /* from brand slate #465e79 */
    --ink:#f3ede6;       /* warm off-white */
    --muted:#aeb9c6;
    --accent:#ff5757;    /* brand coral */
    --accent2:#f6a294;   /* brand soft coral */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Josefin Sans',sans-serif;font-weight:300;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{width:100vw;height:100vh;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:9vh 11vw;opacity:0;transition:opacity .4s ease}
  .slide.on{display:flex;opacity:1}
  .kick{font-size:.82rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:1.4rem}
  h1{font-family:'Unna',serif;font-weight:700;font-size:clamp(2.6rem,6vw,5rem);line-height:1.02;
    letter-spacing:-.01em}
  h2{font-family:'Unna',serif;font-weight:700;font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.08;
    margin-bottom:1.6rem}
  .sub{font-family:'Unna',serif;font-style:italic;font-size:clamp(1.2rem,2.4vw,1.9rem);
    color:var(--accent2);margin-top:1.6rem;max-width:30ch}
  p{font-size:clamp(1.05rem,1.7vw,1.4rem);line-height:1.6;max-width:44ch;color:var(--ink)}
  p+p{margin-top:1rem}
  .big{font-family:'Unna',serif;font-size:clamp(2.1rem,4.6vw,3.6rem);line-height:1.12;max-width:20ch}
  ul{list-style:none;margin-top:1.4rem;max-width:46ch}
  li{position:relative;padding-left:1.8rem;margin:.95rem 0;font-size:clamp(1.05rem,1.7vw,1.35rem);
    line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:.55em;width:.7rem;height:.7rem;border-radius:50%;
    background:var(--accent)}
  .num{font-family:'Unna',serif;color:var(--rule);font-size:clamp(3rem,7vw,6rem);line-height:1;
    margin-bottom:.4rem}
  .presenter{margin-top:2.6rem;color:var(--muted);font-size:1rem;letter-spacing:.04em}
  .disc{color:var(--muted);font-size:.86rem;margin-top:2rem;max-width:52ch;line-height:1.5}
  .cta-line{font-family:'Unna',serif;font-size:clamp(1.3rem,2.4vw,2rem);color:var(--accent);margin-top:1.4rem}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:2.2rem 2.4rem;
    max-width:48ch}
  .em{color:var(--accent)}
  .foot{position:absolute;bottom:3.4vh;left:11vw;right:11vw;display:flex;justify-content:space-between;
    color:var(--muted);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
  .nav{position:absolute;bottom:3vh;right:11vw;color:var(--muted);font-size:.8rem}
  .brandline{height:3px;width:68px;background:var(--accent);margin-bottom:2rem}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title',
    kick:'A live masterclass',
    h:'Wanting It More',
    sub:'Why wanting it less, for a little while, is how desire comes back.',
    presenter:'with Janna Denton-Howes, Marriage Coach'},

  {t:'promise',
    kick:'What this hour gives you',
    h:'You will leave knowing',
    items:[
      'The real reason desire disappeared (it is probably not what you were told)',
      'Why trying harder has been making it worse',
      'The first move to get wanting back, without pressure or guilt']},

  {t:'who',
    kick:'Who this is for',
    h:'If any of this is you',
    items:[
      'Sex feels like one more chore on the list',
      'You love your husband and still dread the bedroom',
      'You have felt the guilt, the obligation, the quiet resentment',
      'You have tried to fix it and quietly decided something is wrong with you']},

  {t:'trap',
    kick:'The trap',
    big:'You have already tried everything the internet sold you.',
    p:'Lingerie. Date nights. Scheduling it. New positions. A glass of wine. And after all of it, the wanting still is not there, and now you are tired and blaming yourself.'},

  {t:'hook',
    kick:'A different take',
    big:'What if the problem was never your body?'},

  {t:'part', num:'Part One', h:'How wanting actually disappears',
    p:'When sex is always on offer and always a little expected, your body learns to brace. Being perpetually available does not grow desire. It grows aversion, the way your favorite food turns your stomach if you are made to eat it every single day.',
    sub:'This is learned. Which means it can be unlearned.'},

  {t:'part', num:'The root', h:'It is a safety problem, not a skills problem',
    p:'Underneath low desire is almost never broken plumbing. It is a nervous system that does not feel safe enough to want anything. No technique works on top of a body that is braced. Safety is the ingredient everyone skips.'},

  {t:'section', kick:'Part Two', h:'The Wanting It More method',
    sub:'Four moves, in order. The order is the whole point.'},

  {t:'pillar', num:'01', h:'Find your voice',
    p:'The first step is permission to say no, and to mean it. The pattern that built the aversion is pushing through sex you do not want. It stops the day you can say "not right now" and be heard.'},

  {t:'pillar', num:'02', h:'Make space to want it',
    p:'Take sex off the table on purpose, for a set stretch of time. Not as punishment, as space. When the pressure and the mental gymnastics lift, there is finally room for desire to show up on its own.'},

  {t:'pillar', num:'03', h:'Safety begets pleasure',
    p:'Rebuild felt safety before you rebuild touch. A body that trusts it will be heard, and that nothing is owed, is a body that can start to want. Pleasure follows safety. It never leads it.'},

  {t:'pillar', num:'04', h:'Women lead, men respond',
    p:'Flip the script that said the higher-desire partner initiates and you react. When the wife gets to lead the pace and the yes, trust comes back. And men, it turns out, make fantastic responders.'},

  {t:'part', num:'Part Three', h:'On the other side of safety',
    p:'It does not look like fireworks on a schedule. It looks like a wife who is not bracing, a husband who is not keeping score, and a yes that is actually a yes. Wanting that comes from safety, not from obligation.',
    sub:'It is OK to never be "in the mood" again. Responsive desire is the real thing.'},

  {t:'why',
    kick:'Why me',
    h:'I built this out of my own marriage',
    p:'I married at 17 with almost no sexual education. For years I lived with low desire, pain, and no connection, and we fought about it on a loop. The traditional advice did not help, it made it worse.',
    p2:'So I built the method that actually worked for me, and have since walked over 700 women from avoidance to actually wanting it.'},

  {t:'path',
    kick:'Where this goes next',
    h:'Doing It Together',
    p:'The full method is an 8-week program for couples: video lessons, live group coaching, and a private community, for both of you.',
    sub:'Education + Support + Community = Results'},

  {t:'cta',
    kick:'Your next step',
    h:'Let us talk about your marriage',
    cta:'Book a free call with Janna',
    where:'jannadentonhowes.com/doingittogether',
    disc:'This masterclass is educational and reflects one coach’s approach. Results vary from couple to couple and are not guaranteed. This is not therapy or medical advice.'}
];

const stage = document.getElementById('stage');
function render(){
  stage.innerHTML = '';
  S.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'slide' + (i===cur?' on':'');
    let h = '';
    if (s.kick) h += `<div class="kick">${s.kick}</div>`;
    if (s.t==='title'){ h = `<div class="brandline"></div><div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="sub">${s.sub}</div><div class="presenter">${s.presenter}</div>`; }
    else if (s.t==='section'){ h += `<h1>${s.h}</h1>` + (s.sub?`<div class="sub">${s.sub}</div>`:''); }
    else if (s.t==='part'){ h += (s.num?`<div class="num">${s.num}</div>`:'') + `<h2>${s.h}</h2>` + (s.p?`<p>${s.p}</p>`:'') + (s.sub?`<div class="sub">${s.sub}</div>`:''); }
    else if (s.t==='pillar'){ h += `<div class="num">${s.num}</div><h2>${s.h}</h2><p>${s.p}</p>`; }
    else if (s.t==='promise' || s.t==='who'){ h += `<h2>${s.h}</h2><ul>` + s.items.map(x=>`<li>${x}</li>`).join('') + `</ul>`; }
    else if (s.t==='trap'){ h += `<div class="big">${s.big}</div><p style="margin-top:1.6rem">${s.p}</p>`; }
    else if (s.t==='hook'){ h += `<div class="big em">${s.big}</div>`; }
    else if (s.t==='why'){ h += `<h2>${s.h}</h2><p>${s.p}</p>` + (s.p2?`<p>${s.p2}</p>`:''); }
    else if (s.t==='path'){ h += `<h2>${s.h}</h2><p>${s.p}</p>` + (s.sub?`<div class="sub">${s.sub}</div>`:''); }
    else if (s.t==='cta'){ h += `<h1>${s.h}</h1><div class="cta-line">${s.cta}</div><p style="margin-top:.6rem;color:var(--muted)">${s.where}</p><div class="disc">${s.disc}</div>`; }
    d.innerHTML = h + `<div class="nav">${i+1} / ${S.length}</div>`;
    stage.appendChild(d);
  });
}
let cur = 0;
function go(n){ cur = Math.max(0, Math.min(S.length-1, n)); render(); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});
stage.addEventListener('click', ()=>go(cur+1));
render();
</script>
</body>
</html>
