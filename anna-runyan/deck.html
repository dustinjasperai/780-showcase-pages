<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Career You Were Born To Do — a masterclass with Anna Runyan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7efec;        /* warm cream ground, from classycareergirl.com */
    --panel:#ffffff;
    --ink:#0a0a3e;       /* deep navy, her dominant heading hex */
    --muted:#4a4a63;
    --rule:#0a0a3e;
    --accent:#944b22;    /* bronze/terracotta, her dominant brand hex */
    --head:'Oswald',system-ui,sans-serif;
    --body:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;
    justify-content:center;padding:8vh 9vw;position:relative;border-bottom:1px solid rgba(10,10,62,.08)}
  .kicker{font-family:var(--head);text-transform:uppercase;letter-spacing:.22em;
    font-weight:600;font-size:.82rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(2.4rem,6vw,4.6rem);
    line-height:1.04;letter-spacing:-.01em;max-width:16ch}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(1.9rem,4.2vw,3.1rem);
    line-height:1.08;max-width:18ch}
  p.lead{font-size:clamp(1.1rem,1.7vw,1.4rem);color:var(--muted);max-width:42ch;margin-top:1.6rem}
  .num{font-family:var(--head);font-weight:700;font-size:clamp(3rem,9vw,6rem);
    color:var(--accent);line-height:1}
  ul.pts{list-style:none;margin-top:2rem;max-width:44ch}
  ul.pts li{font-size:clamp(1.05rem,1.5vw,1.25rem);padding:.75rem 0 .75rem 1.5rem;
    border-top:1px solid rgba(10,10,62,.12);position:relative}
  ul.pts li:before{content:"";position:absolute;left:0;top:1.15rem;width:.55rem;height:.55rem;
    background:var(--accent);border-radius:50%}
  .phase{display:flex;align-items:baseline;gap:1.4rem}
  .phase .pn{font-family:var(--head);font-weight:700;color:var(--accent);font-size:clamp(1.6rem,3vw,2.4rem)}
  .foot{position:absolute;bottom:3.2vh;left:9vw;right:9vw;display:flex;justify-content:space-between;
    font-family:var(--head);text-transform:uppercase;letter-spacing:.18em;font-size:.68rem;color:var(--muted)}
  .disc{margin-top:2rem;font-size:.9rem;color:var(--muted);max-width:52ch;border-top:2px solid var(--accent);padding-top:1rem}
  .ctaline{font-family:var(--head);font-weight:600;color:var(--accent);margin-top:1.8rem;font-size:1.3rem}
  .panel{background:var(--panel);border-radius:14px;padding:clamp(1.6rem,3vw,2.6rem);max-width:52ch;
    box-shadow:0 1px 0 rgba(10,10,62,.06)}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', k:'A masterclass for ambitious women', h:'Find the career you were born to do', s:'How to stop drifting in a job that fits someone else, and build a deliberate path to the work you are actually meant for.'},
  {t:'who', k:'Who this is for', h:'You are good at your job. It still is not the one.', pts:['You have the title, the salary, the resume everyone says is impressive.','You quietly dread Monday and cannot say exactly why.','You have thought about leaving for years and talked yourself out of it just as long.']},
  {t:'trap', k:'The trap', h:'So you do what everyone tells you to do', s:'You rewrite the resume. You scroll the job boards at midnight. You apply to twelve openings that look a little better than the one you have, and you wait.'},
  {t:'reframe', k:'The hard truth', h:'A better resume sent in the wrong direction just gets you hired into the wrong job faster.', s:'The problem was never your resume. It is that nobody taught you how to choose the direction first.'},
  {t:'part', k:'Part one', num:'01', h:'Why smart women stay stuck', s:'Not for lack of effort. For lack of a method.'},
  {t:'problem', k:'The real reason', h:'You are starting in the middle', pts:['Job searching before you know what you want is guessing with a nicer font.','Passion alone is not a plan, and burnout is not a signal to pick randomly.','Fear dressed up as practicality keeps you optimizing a career you never chose.']},
  {t:'problem', k:'The cost of waiting', h:'Another year, same question', s:'The women who break out are not braver. They traded a vague wish for a sequence they could actually follow.'},
  {t:'part', k:'Part two', num:'02', h:'The Love Your Career Formula', s:'Three phases, in order. You do not skip ahead, and that is the whole point.'},
  {t:'phase', k:'Phase one', pn:'01', h:'Explorer', pts:['Clear the mindset and name the fears that have been making the decisions for you.','Determine direction: your calling, your purpose, the career you were born to do.','Research it in the real world through informational interviews, then write your ideal career outline and a 90-day plan.']},
  {t:'phase', k:'Phase two', pn:'02', h:'Job Searcher', pts:['Now the resume and the LinkedIn profile matter, because they are pointed somewhere real.','Land the job you actually chose, not the one that was merely available.','Prepare to win the first 90 days so the new role sticks.']},
  {t:'phase', k:'Phase three', pn:'03', h:'Leader', pts:['Make an impact and be seen as the expert in your field.','Mentor others, manage a team, keep learning and growing.','Become the one they come to, not just the one who got hired.']},
  {t:'framework', k:'Why the order matters', h:'Most advice lives in Phase two and calls it the whole journey', s:'Resume tips, interview scripts, salary negotiation. All useful, all useless if you never did Phase one. Direction first is the difference.'},
  {t:'part', k:'Part three', num:'03', h:'A deliberate path, one decided step at a time', s:'Not a leap. A sequence of small, decided steps.'},
  {t:'example', k:'The shift', h:'From "I should probably stay" to "here is my 90-day plan"', pts:['She stops applying blind and spends two weeks on direction.','She runs five conversations with people already in the work she wants.','She writes the outline, sets the plan, and for the first time the search has a target.']},
  {t:'example', k:'The result', h:'A career chosen on purpose', s:'The goal was never just a new job. It was work that fits the woman you actually are, with room to grow into a leader.'},
  {t:'credibility', k:'Why me', h:'I built this because I needed it first', s:'I am Anna Runyan, founder of Classy Career Girl. I left a career that looked right on paper to build one I was born to do, and I turned the path I found into the Love Your Career Formula, the CLASS community, and the Classy Career Girl Podcast.', pts:['Thousands of women have walked the three phases.','An author and podcast host on career happiness.','A full community of coaches walking it with you.']},
  {t:'recap', k:'The whole masterclass in one slide', h:'Direction, then the search, then leadership', pts:['Phase one, Explorer: choose the career you were born to do.','Phase two, Job Searcher: land it and win the first 90 days.','Phase three, Leader: grow into the one they come to.']},
  {t:'belief', k:'What I want you to leave with', h:'It is not too late to want more from your work', s:'Wanting a career you love is not naive. It is the most practical thing you can do with the next decade of your life.'},
  {t:'cta', k:'Your next step', h:'Start with Phase one', s:'If this is the path you want to walk with me, here is where it begins.', ctaline:'Join the Love Your Career Formula at classycareergirl.com', disc:'Educational content only. This masterclass shares a method, not a promise of any specific job, salary, or outcome. Results vary and depend on your own effort, circumstances, and choices. Nothing here is a guarantee of income or employment.'}
];

const deck = document.getElementById('deck');
S.forEach((sl, i) => {
  const sec = document.createElement('section');
  sec.className = 'slide';
  let html = '';
  if (sl.k) html += '<div class="kicker">' + sl.k + '</div>';
  if (sl.num) html += '<div class="num">' + sl.num + '</div>';
  if (sl.pn) {
    html += '<div class="phase"><span class="pn">Phase ' + sl.pn + '</span><h1>' + sl.h + '</h1></div>';
  } else if (sl.t === 'title') {
    html += '<h1>' + sl.h + '</h1>';
  } else {
    html += '<h2>' + sl.h + '</h2>';
  }
  if (sl.s) html += '<p class="lead">' + sl.s + '</p>';
  if (sl.pts) {
    html += '<ul class="pts">';
    sl.pts.forEach(p => { html += '<li>' + p + '</li>'; });
    html += '</ul>';
  }
  if (sl.ctaline) html += '<div class="ctaline">' + sl.ctaline + '</div>';
  if (sl.disc) html += '<div class="disc">' + sl.disc + '</div>';
  html += '<div class="foot"><span>Classy Career Girl</span><span>' + (i + 1) + ' / ' + S.length + '</span></div>';
  sec.innerHTML = html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
