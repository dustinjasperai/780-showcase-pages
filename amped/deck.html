<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Principled, Insurance-Independent Practice — AMPED Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --panel:#1a1a1a;
    --rule:#2a2a2a;
    --ink:#f4f1ec;
    --muted:#a7a29b;
    --accent:#c06626;
    --head:'Archivo',system-ui,sans-serif;
    --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #deck{position:relative;height:100vh;width:100vw;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:8vh 9vw;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:.82rem;color:var(--accent);margin-bottom:1.6rem}
  h1{font-family:var(--head);font-weight:800;font-size:clamp(2.2rem,5.2vw,4.2rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(1.7rem,3.6vw,2.7rem);line-height:1.1;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:clamp(1.05rem,1.8vw,1.4rem);margin-top:1.4rem;max-width:46ch;line-height:1.5}
  .lead{font-size:clamp(1.2rem,2.2vw,1.7rem);margin-top:1.6rem;max-width:44ch;line-height:1.45}
  ul{list-style:none;margin-top:2rem;display:grid;gap:1rem;max-width:52ch}
  li{position:relative;padding-left:1.6rem;font-size:clamp(1.02rem,1.7vw,1.3rem);line-height:1.4;color:var(--ink)}
  li:before{content:"";position:absolute;left:0;top:.55em;width:.6rem;height:.6rem;background:var(--accent);border-radius:2px}
  .num{font-family:var(--head);font-weight:800;color:var(--accent);font-size:1.1rem;letter-spacing:.1em}
  .rule{height:2px;width:64px;background:var(--accent);margin:1.8rem 0}
  .credit{color:var(--muted);margin-top:2.4rem;font-size:1rem;line-height:1.5}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:2.2rem 2.4rem;margin-top:1.8rem;max-width:56ch}
  .disc{color:var(--muted);font-size:.82rem;margin-top:2.4rem;max-width:60ch;line-height:1.5}
  .big{font-size:clamp(2.6rem,6vw,5rem);font-family:var(--head);font-weight:800;color:var(--accent);letter-spacing:-.02em}
  .nav{position:fixed;bottom:18px;right:22px;color:var(--muted);font-size:.8rem;font-family:var(--head);letter-spacing:.08em;z-index:10}
  .accent{color:var(--accent)}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav"><span id="pg">1</span> / <span id="tot">1</span></div>
<script>
const S = [
  {t:'title', kick:'A free live masterclass',
   h:'The Principled, Insurance-Independent Practice',
   sub:'How to build a high-volume chiropractic practice your patients choose to pay for.',
   credit:'Live with Drs. Jeremy & Amanda Hess and Drs. Michael & Tara Viscarelli · AMPED'},

  {t:'point', kick:'Who this is for',
   h:'If you feel this, you are in the right room',
   bullets:['New graduates about to open and unsure how to do it in today\'s market',
            'Owners who are busier than ever but run their schedule around insurance',
            'Doctors who got into this on principle and feel the drift away from it',
            'Students who want a model worth building a career on']},

  {t:'point', kick:'The trap',
   h:'You did everything right, and it still feels backwards',
   bullets:['Your calendar is full, but collections are a moving target',
            'Payers decide what your care is worth, and when you get paid',
            'Volume goes up and the stress goes up with it',
            'The mission that brought you in is buried under codes and claims']},

  {t:'reframe', kick:'The reframe',
   big:'More patients will not fix an insurance-run practice.',
   lead:'The ceiling is not your volume. It is the model underneath it.'},

  {t:'point', kick:'Part one · the core problem',
   h:'Insurance-dependence caps your value and your principle',
   bullets:['When a payer sets the price, you cannot lead on value',
            'Code-driven care pulls you away from principled, outcome-based practice',
            'Your growth is tied to reimbursement, not to the people you serve',
            'And it is fragile: one policy change moves your whole business']},

  {t:'section', kick:'Part two', h:'The AMPED model', sub:'A principled, subluxation-based, insurance-independent practice, built on systems that scale. Here are the five pillars.'},

  {t:'pillar', num:'Pillar 1', h:'Open or transition on principle',
   lead:'JumpStart for a new practice, KickStart to move an existing one onto the model: demographic study, location, build-out, and the pre-open push, all the way to the doors opening on your terms.'},

  {t:'pillar', num:'Pillar 2', h:'Educate every patient to retain them',
   lead:'The table talk and report of findings are your real growth engine. When patients understand principled care, they stay, they refer, and they pay for outcomes rather than for a claim.'},

  {t:'pillar', num:'Pillar 3', h:'Build insurance-independent economics',
   lead:'A cash and direct-value model that lets you price on the outcome you deliver, own your schedule, and stop letting a payer decide what your work is worth.'},

  {t:'pillar', num:'Pillar 4', h:'Grow a team that runs it',
   lead:'Associate JumpStart brings on and develops associate doctors with the same standard operating procedures, so the practice grows past what one set of hands can do.'},

  {t:'pillar', num:'Pillar 5', h:'Serve a community, leave a legacy',
   lead:'A high-volume practice is a community asset. Build reputation through real service, create critical mass in principled chiropractic, and leave a proper legacy where you practice.'},

  {t:'point', kick:'Part three · inside the practice',
   h:'A week in a principled, high-volume practice',
   bullets:['A schedule you own, built around care, not around claims',
            'Patients who understand why they are here and keep coming',
            'A team that runs the systems without you touching every step',
            'Revenue tied to the value you deliver, not to a reimbursement table']},

  {t:'credibility', kick:'Why this model',
   h:'It is the practice we actually built',
   bullets:['Discover Chiropractic averaged more than 1,200 patient visits a week for over a decade',
            'AMPED now mentors 800-plus doctors and students on this exact model',
            '10 active college clubs mentoring the next generation before they graduate',
            'Founded in 2013 on one idea: timeless principle, run with modern systems']},

  {t:'point', kick:'The honest question',
   h:'Will patients pay without insurance?',
   bullets:['Yes, when they understand the outcome and trust the care',
            'That is exactly what the education systems in pillar two are for',
            'People pay for principled care they believe in, every day',
            'The model is proven across hundreds of practices, not one lucky office']},

  {t:'point', kick:'The path',
   h:'How doctors walk into this model',
   bullets:['Start where you are: JumpStart to open, KickStart to transition',
            'Learn the systems in the virtual classroom and on mentorship calls',
            'Put the five pillars in one at a time, with a mentor beside you',
            'Grow the team and the community around a practice built on principle']},

  {t:'recap', kick:'Recap', h:'The five pillars, in one line',
   bullets:['Open or transition on principle',
            'Educate every patient to retain them',
            'Build insurance-independent economics',
            'Grow a team that runs it',
            'Serve a community and leave a legacy']},

  {t:'cta', kick:'Your next step',
   h:'Come build the principled practice',
   lead:'If you want the systems, the mentorship, and a community walking the same path, the next step is to join us inside AMPED. Start a conversation with our team and we will help you find the right on-ramp, whether you are opening, transitioning, or scaling.',
   cta:'Join AMPED · ampednow.com',
   disc:'This presentation is for educational purposes only. It is not financial, legal, or medical advice, and it makes no guarantee of income, revenue, or practice results. Individual results vary and depend on many factors including effort, market, and execution.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (i===0?' on':'');
  let html = '';
  if(s.kick) html += `<div class="kick">${s.kick}</div>`;
  if(s.t==='title'){
    html += `<h1>${s.h}</h1>`;
    if(s.sub) html += `<div class="sub">${s.sub}</div>`;
    if(s.credit) html += `<div class="credit">${s.credit}</div>`;
  } else if(s.t==='reframe'){
    html += `<div class="big">${s.big}</div><div class="rule"></div>`;
    if(s.lead) html += `<div class="lead">${s.lead}</div>`;
  } else if(s.t==='section'){
    html += `<h1>${s.h}</h1>`;
    if(s.sub) html += `<div class="sub">${s.sub}</div>`;
  } else if(s.t==='pillar'){
    if(s.num) html += `<div class="num">${s.num}</div>`;
    html += `<h2 style="margin-top:.7rem">${s.h}</h2>`;
    if(s.lead) html += `<div class="panel">${s.lead}</div>`;
  } else if(s.t==='cta'){
    html += `<h1>${s.h}</h1>`;
    if(s.lead) html += `<div class="lead">${s.lead}</div>`;
    if(s.cta) html += `<div class="rule"></div><div class="num" style="font-size:1.3rem">${s.cta}</div>`;
    if(s.disc) html += `<div class="disc">${s.disc}</div>`;
  } else {
    html += `<h2>${s.h}</h2>`;
    if(s.lead) html += `<div class="lead">${s.lead}</div>`;
    if(s.bullets){ html += '<ul>' + s.bullets.map(b=>`<li>${b}</li>`).join('') + '</ul>'; }
  }
  el.innerHTML = html;
  deck.appendChild(el);
});

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
document.getElementById('tot').textContent = slides.length;
function show(n){
  cur = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((el,i)=>el.classList.toggle('on', i===cur));
  document.getElementById('pg').textContent = cur+1;
}
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ show(cur+1); e.preventDefault(); }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ show(cur-1); e.preventDefault(); }
});
document.getElementById('deck').addEventListener('click', ()=>show(cur+1));
</script>
</body>
</html>
