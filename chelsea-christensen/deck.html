<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Dance of Growth · Chelsea Christensen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f2ee; --panel:#efe4e6; --rule:#e7dce2;
    --acc:#8e5a86; --ink:#3a2436; --body:#5c4a56; --dim:#9a8a92; --cream:#f7eff1;
  }
  html,body{height:100%}
  body{background:#ece2e2;font-family:'Poppins',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ece2e2}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:75%;line-height:1.62;font-weight:400}
  .sub{font-family:'Playfair Display',serif;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.4;font-weight:500;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#4a2f45 0%,#2c1c29 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#4a2f45 0%,#2c1c29 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Poppins',sans-serif;color:#ecdfe6;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:8%;bottom:9%;width:15vw;opacity:.92}
  .corner-vf{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(58,36,54,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Dance of Growth</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- dance motif: two intertwined arcs stepping around a center, drawn in plum -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#8e5a86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 92 C30 52 54 40 60 60 C66 80 90 68 90 28" opacity="0.9"/>
    <path d="M90 92 C90 52 66 40 60 60 C54 80 30 68 30 28" opacity="0.5"/>
    <circle cx="30" cy="92" r="4.5" fill="#8e5a86" stroke="none" opacity="0.85"/>
    <circle cx="90" cy="28" r="4.5" fill="#8e5a86" stroke="none" opacity="0.85"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Dance of Growth',sub:'How a woman grows the business without losing herself in it.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You have built something real. It just quietly started running you.',body:'You are a woman who built a business from nothing, and it works. But somewhere in the building the work started asking for all of you, and the fear of it slipping keeps you saying yes to everything. You are growing on paper and shrinking on the inside, and you are not sure when that trade got made.'},
 {t:'dark',title:'Growth that costs you the person who built it is not the win it looks like.'},

 {t:'section',idx:'Part One',title:'Why More Rarely Feels Like Enough'},
 {t:'normal',k:'The overwhelm loop',title:'Fear and overwhelm are not a season. They became the operating system.',body:'When everything feels urgent, you handle it all yourself, which makes more of it land on you, which makes everything feel urgent. Most women in business are not short on effort. They are stuck inside a loop that rewards doing more and punishes stepping back, and no amount of hustle spends its way out of it.'},
 {t:'normal',k:'The self you traded',title:'Somewhere you decided who you had to be to keep it all running.',body:'To hold it together you picked up a version of yourself who is always on, always available, always fine. She is competent and exhausted, and she has been driving for so long that you have half forgotten what you actually wanted when you started. The business grew. The distance from yourself grew with it.'},
 {t:'dark',title:'You cannot build a life you love out of a self you keep abandoning.'},

 {t:'section',idx:'Part Two',title:'The Dance: Fire and Peace, Held Together'},
 {t:'normal',k:'The reframe',title:'Growth is a dance, not a climb.',body:'A climb says grind now and rest at some finish line that keeps moving. A dance says the ambition and the peace move together, in the same body, at the same time. The fire in your heart and the peace in your soul are not a trade you make later. They are the two feet you learn to move on now, which is the whole practice.'},
 {t:'normal',k:'Movement one, growth from struggle',title:'The hard seasons are teaching you the step, if you stop bracing against them.',body:'Struggle is not proof you are failing. It is where you learn what you will and will not carry, where you find the edge of the old self who took on everything. When you stop treating a hard season as an emergency to survive, it becomes the place the real change actually happens.'},
 {t:'normal',k:'Movement two, unexpected growth',title:'The path was never going to be a straight line, and that is not a problem to fix.',body:'The plan bends, the season surprises you, the thing you feared becomes the thing that opens the door. Growth that arrives sideways is still growth. Learning to move with the unexpected instead of white-knuckling the plan is how you stop losing yourself every time the ground shifts.'},
 {t:'normal',k:'Movement three, the aligned self',title:'You choose who you are being before you choose what you are doing.',body:'Under the fear is a woman who already knows who she truly is and what she actually wants. The work is to lead from her, on purpose, so the next decision comes from alignment rather than panic. Fire in your heart, peace in your soul, is not a slogan. It is a way of standing that changes what you say yes to.'},
 {t:'dark',title:'When you lead from who you are, the business stops being the thing you sacrifice yourself to.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Learn the Dance'},
 {t:'normal',k:'The woman this builds',title:'Still ambitious. No longer at war with your own life.',body:'You keep the fire. What leaves is the sense that peace is something you get to only after everyone else is handled. Decisions get quieter and clearer, the business fits inside a life you actually want to live, and growth stops feeling like something you have to survive on the way to a rest that never comes.'},
 {t:'dark',title:'A life you are in love with is not a reward for growing. It is the way you grow.'},
 {t:'normal',k:'Why Chelsea',title:'Eighteen years building, four kids, and a lot of finding herself in the middle of it.',body:'Chelsea has spent 18-plus years as a multi-passionate entrepreneur, raising four children and building her own path while learning, the hard way, how to grow without disappearing. The Dance of Growth is the work she now does alongside women in business, and the podcast behind it has grown into a top-ranked show. This masterclass is a piece of that work.'},

 {t:'section',idx:'Your Next Step',title:'Come Learn the Dance With Me'},
 {t:'normal',k:'Keep going with Chelsea',title:'This masterclass is the opening. The coaching is the whole practice.',body:'What you just walked through is the reframe. Doing it in your own life, in your own business, with someone in your corner, is what the coaching is for. If any of this named something you have been feeling, that is the place to start.'},
 {t:'cta',title:'Ready to grow without losing yourself in it?',body:'Take the next step with Chelsea and The Dance of Growth.',chips:['Listen to the podcast','Book a consultation'],disc:'Educational content for women in business. No income or business result is guaranteed. Results vary by person, business, and season.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Dance of <b>Growth</b> · Chelsea Christensen</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
