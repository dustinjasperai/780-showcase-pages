<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Silent Business Killers — SimpleBiz360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161616;      /* warm near-black ground (brand ranked #161616, site_scheme dark) */
    --panel:#201d1d;   /* lifted panel derived from brand #1d1b1b */
    --rule:#434040;    /* brand ranked #434040 */
    --ink:#f3f1ef;     /* near-white ink (brand white H1) */
    --muted:#a4a4a4;   /* brand dominant #a4a4a4 */
    --accent:#75696f;  /* brand h2 color #75696f */
    --head:'Cabin',system-ui,sans-serif;
    --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    padding:56px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center}
  .slide.title{background:#0e0d0d;color:var(--ink);border-color:#0e0d0d}
  .slide.part{background:var(--accent);color:#fff;border-color:var(--accent)}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--muted);margin-bottom:18px}
  .slide.part .kicker{color:rgba(255,255,255,.82)}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;margin-bottom:16px}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;margin-bottom:16px}
  .sub{font-size:20px;color:var(--muted);line-height:1.5;max-width:52ch}
  .slide.title .sub,.slide.part .sub{color:rgba(255,255,255,.85)}
  ul{list-style:none;margin-top:10px}
  li{font-size:21px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"\203A";position:absolute;left:0;top:10px;font-family:var(--head);font-weight:700;
    font-size:20px;color:var(--accent)}
  .big{font-family:var(--head);font-weight:700;font-size:60px;line-height:1.02;color:var(--accent)}
  .note{margin-top:22px;font-size:14px;color:var(--muted);line-height:1.5}
  .pres{margin-top:26px;font-family:var(--head);font-weight:600;font-size:17px}
  .n{font-family:var(--head);color:var(--accent);font-weight:700;margin-right:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A SimpleBiz360 Masterclass', h:'The Silent Business Killers',
   sub:'The small, human habits quietly costing you repeat and referral customers.',
   pres:'Presented by Jeff Mason, SimpleBiz360'},

  {t:'who', k:'Who this is for', h:'Small business owners who already do good work',
   sub:'Solopreneurs and small teams who deliver a fair product at a fair price, and still watch customers quietly drift away.'},

  {t:'trap', k:'The trap', h:'You blamed the wrong thing',
   sub:'When a customer does not come back, most owners assume it was price, or the economy, or a competitor. So they discount, or they chase new leads. The real cause is usually somewhere else entirely.'},

  {t:'reframe', k:'The reframe', h:'It is rarely the price',
   sub:'Customers leave over the little things you never saw. A message that never got answered. A promise that was half kept. These are the Silent Business Killers, and they are invisible until the customer is gone.'},

  {t:'part', k:'Part One', h:'The real problem',
   sub:'Experience is not the product. It is how a customer feels before, during, and after the transaction.'},

  {t:'body', k:'Before, during, after', h:'Most owners manage one third of the experience',
   sub:'You pour everything into the product or the service itself, the "during." The "before" and the "after" run on autopilot, and that is exactly where repeat business is won or lost.'},

  {t:'body', k:'The compounding cost', h:'A lost customer is also lost referrals',
   sub:'When someone does not come back, you do not just lose their next purchase. You lose everyone they would have told. One Silent Business Killer quietly costs you a whole chain of customers.'},

  {t:'part', k:'Part Two', h:'The method: the 3Y Challenge',
   sub:'Three habits that turn one sale into three. Say YES to all three, consistently.'},

  {t:'list', k:'The 3Y Challenge', h:'Three YES behaviors',
   items:['Respond. Answer every customer, quickly, like a human.',
          'Follow Up. Reach out after the sale, before they have to.',
          'Follow Through. Do the small thing you said you would do.']},

  {t:'body', k:'Why it works', h:'Almost nobody does all three',
   sub:'Each one is simple. Doing all three, every time, is rare, and customers feel the difference immediately. That difference is what they remember, and what they tell other people about.'},

  {t:'body', k:'The engine', h:'255 one-percent tools',
   sub:'The 3Y habits sit on top of 255 small, practical tools across eight operational groups. Tiny, human, low-cost improvements, not big expensive systems. One percent at a time, compounding.'},

  {t:'body', k:'An example', h:'The follow-up almost no one sends',
   sub:'A short note after the sale: "Just checking your order arrived and you are happy with it." It costs nothing. It takes a minute. And it is the kind of moment that makes a customer come back and bring a friend.'},

  {t:'part', k:'Part Three', h:'Where this shows up: repeat, referral, reviews',
   sub:'Repeat customers, referrals, and reviews that are earned, not bought.'},

  {t:'body', k:'The shift', h:'From chasing new to keeping and multiplying',
   sub:'When the before and after are handled with the 3Y habits, your repeat rate rises, referrals start arriving on their own, and good reviews follow. The same customers, worth far more.'},

  {t:'body', k:'Why me', h:'Simple, timeless, tested',
   sub:'I am Jeff Mason. After a 30-year career in sales and small business I wrote SimpleBiz360: Timeless Business Tools and host the One Minute One Question podcast, teaching one simple idea at a time to owners like you.'},

  {t:'body', k:'The recap', h:'Three habits, one percent at a time',
   sub:'Stop the Silent Business Killers. Say YES across Respond, Follow Up, and Follow Through. Improve one small thing at a time. That is how a small business earns repeat and referral customers.'},

  {t:'cta', k:'Where to start', h:'Put the method to work',
   items:['Read SimpleBiz360: Timeless Business Tools and pick your first one-percent fix.',
          'Join a SimpleBiz360 workshop to build the 3Y habits with your team.',
          'Go deeper with Experience Economy consulting to install it end to end.'],
   note:'Educational only. Results vary and depend on your business, market, and execution. Nothing here is a guarantee of income or results.',
   pres:'SimpleBiz360 with Jeff Mason'}
];

const d = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t || 'body');
  let html = '';
  if (s.k) html += '<div class="kicker">' + s.k + '</div>';
  if (s.h) html += (s.t === 'reframe' ? '<div class="big">' + s.h + '</div>' : '<h' + (s.t==='title'?'1':'2') + '>' + s.h + '</h' + (s.t==='title'?'1':'2') + '>');
  if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  if (s.items){ html += '<ul>'; s.items.forEach(it => html += '<li>' + it + '</li>'); html += '</ul>'; }
  if (s.note) html += '<div class="note">' + s.note + '</div>';
  if (s.pres) html += '<div class="pres">' + s.pres + '</div>';
  el.innerHTML = html;
  d.appendChild(el);
});
</script>
</body>
</html>
