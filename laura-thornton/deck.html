<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profit-Proof Fee Structure &middot; The Profit Academy for Interior Designers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1a1513; --panel:#100d0c; --rule:#3a2f2b;
    --ink:#ece7e2; --rose:#8f6e6e; --rose2:#c9b3ac; --dim:#a89a94;
  }
  html,body{height:100%}
  body{background:#0b0908;font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0908}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
    display:flex;flex-direction:column;justify-content:center;padding:9.5% 12% 8% 12%}
  .slide.active{opacity:1;visibility:visible}
  .hairline{position:absolute;left:12%;right:12%;top:7.2%;height:1px;background:var(--rule)}
  .runhead{position:absolute;left:12%;top:4.4%;font-size:.86vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .runfoot{position:absolute;right:12%;top:4.4%;font-size:.86vw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--rose)}
  .kicker{font-size:.98vw;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--rose);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.24;letter-spacing:-.004em}
  .t-title h1{font-size:3.9vw;max-width:92%}
  .t-normal h1{font-size:2.5vw;max-width:86%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.32vw;color:#cfc7c1;margin-top:2.8vh;max-width:80%;line-height:1.68;font-weight:300}
  .sub{font-family:'Montserrat',sans-serif;font-size:1.5vw;color:#cfc7c1;margin-top:3.2vh;max-width:78%;line-height:1.56;font-weight:300}
  .t-section{background:var(--panel);justify-content:center}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1vw;font-weight:600;color:var(--rose2);margin-bottom:2.2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:3.4vw;max-width:88%;font-style:italic}
  .t-section .bar{width:9vw;height:3px;background:var(--rose);margin-top:3.6vh}
  .t-section .hairline{background:rgba(255,255,255,.1)}
  .t-section .runhead{color:#8c7f79}.t-section .runfoot{color:#dcbdb6}
  .t-dark{background:var(--panel);align-items:flex-start}
  .t-dark h1{font-size:2.85vw;max-width:86%;color:#f5f1ec}
  .t-dark .hairline{background:rgba(255,255,255,.12)}
  .t-dark .runhead{color:#8c7f79}.t-dark .runfoot{color:#dcbdb6}
  .t-dark .attr{font-family:'Montserrat',sans-serif;font-size:1.05vw;color:#c2b6b0;margin-top:3vh;letter-spacing:.02em;font-style:italic}
  .t-cta{background:var(--panel)}
  .t-cta h1{font-size:3.2vw;max-width:86%;color:#f5f1ec}
  .t-cta .hairline{background:rgba(255,255,255,.12)}
  .t-cta .runhead{color:#8c7f79}.t-cta .runfoot{color:#dcbdb6}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap}
  .chip{border:1px solid rgba(255,255,255,.35);color:#f1ede8;padding:1.2vh 1.5vw;font-size:1.1vw;font-weight:500;font-family:'Montserrat',sans-serif}
  .disc{position:absolute;left:12%;right:12%;bottom:4vh;font-size:.8vw;color:#9c8f89;line-height:1.5;max-width:76%;font-family:'Montserrat',sans-serif}
  .t-normal .disc,.t-title .disc{color:var(--dim)}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.12vw;color:#cfc7c1;margin-top:3.6vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--rose);font-weight:600}
  .motif{position:absolute;pointer-events:none;opacity:.9}
  .motif-title{right:8%;bottom:8%;width:22vw}
  .motif-corner{right:9%;bottom:7%;width:9vw;opacity:.5}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--rose);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:13px;right:18px;font-size:12px;letter-spacing:.14em;color:#867a74;z-index:20;font-weight:500;font-family:'Montserrat',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#867a74;z-index:20;font-weight:600;font-family:'Montserrat',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#867a74;z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Montserrat',sans-serif}
  @media(max-width:640px){
    .slide{padding:13% 8% 11% 8%}.hairline{left:8%;right:8%}.runhead{left:8%}.runfoot{right:8%}
    .kicker{font-size:2.4vw}.runhead,.runfoot{font-size:2vw}
    .t-title h1{font-size:7vw}.t-normal h1{font-size:4.8vw}.t-normal .body{font-size:2.9vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.5vw}.disc{left:8%;right:8%;font-size:1.9vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">The Profit Academy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- the tally line: turning a quote into a kept margin -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="tally" viewBox="0 0 260 90">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 74 V54 M28 74 V44 M48 74 V30 M68 74 V16" stroke="#8f6e6e" opacity="0.85"/>
    <path d="M92 46 L108 62 L140 22" stroke="#8f6e6e" opacity="0.9"/>
    <rect x="86" y="10" width="60" height="60" rx="8" fill="none" stroke="#c9b3ac" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',rh:'The Profit Academy',rf:'Masterclass',title:'The Profit-Proof Fee Structure',sub:'How to build a fee structure that actually protects your profit, from the first quote to the final invoice, without leaving money on the table on every project.',brand:true,motif:'title'},
 {t:'normal',rh:'Start here',rf:'01',k:'Who this is for',title:'Fully booked. Still not actually profitable.',body:'The calendar is full. The portfolio is strong. And somehow the number left at the end of a project is smaller than it should be. That gap is rarely a sales problem. It is almost always a structure problem.'},
 {t:'dark',rh:'Reframe',rf:'02',title:'You are not underpaid. You are under-structured.',attr:'Laura Thornton'},

 {t:'section',rh:'Part one',rf:'03',idx:'Part one',title:'The Trap: Booked Out, Barely Profitable'},
 {t:'normal',rh:'Part one',rf:'04',k:'The obvious fix',title:'Raise your rates. It helps for a season, then the gap comes back.',body:'A higher rate is a reasonable move. It is not a structure. Without a real system underneath it, the same leaks that ate the old rate start eating the new one within a year.'},
 {t:'normal',rh:'Part one',rf:'05',k:'Why it stalls',title:'A rate set against a competitor is not a rate set against your goals.',body:'Pricing has to start from your ideal client and your actual financial target, not a guess at what the market will bear. A number borrowed from someone else\'s business rarely survives contact with your own overhead.'},
 {t:'normal',rh:'Part one',rf:'06',k:'Where the money actually leaks',title:'Scope creep with no fee attached to it.',body:'A client adds a room. A finish gets swapped twice. A timeline stretches. None of it is unreasonable on its own, and none of it is priced, so it comes straight out of the margin that was supposed to be the profit.'},
 {t:'dark',rh:'Reframe',rf:'07',title:'A fee structure is not a rate card. It is what protects the number you already quoted.'},

 {t:'section',rh:'Part two',rf:'08',idx:'Part two',title:'The Profit-Proof Fee Structure'},
 {t:'normal',rh:'Part two',rf:'09',k:'Profit Optimization',title:'Know your real margin before you quote the next project.',body:'Accounting fundamentals and profit-margin math built for a design practice specifically, not generic small-business bookkeeping. You cannot protect a number you have never actually calculated.'},
 {t:'normal',rh:'Part two',rf:'10',k:'Fiscal: Stages and Fees',title:'Room-by-room templates, and a fee for when the scope moves.',body:'A pricing structure broken out by project stage and by room, plus an explicit implementation reset fee for when a client changes direction mid-project. The fee exists before the scope creep does, not after.'},
 {t:'normal',rh:'Part two',rf:'11',k:'Implementation Triumph',title:'Turn the design plan into a quote that actually holds.',body:'Product pricing and quote development: the mechanical step between a beautiful plan and an accurate, profitable number a client signs off on.'},
 {t:'dark',rh:'Reframe',rf:'12',title:'Build the reset fee in before you need it. Not after the scope has already changed.'},

 {t:'section',rh:'Part three',rf:'13',idx:'Part three',title:'What Changes Once the Structure Holds'},
 {t:'normal',rh:'Part three',rf:'14',k:'Protecting Profits',title:'A signed quote should not quietly erode once the project starts.',body:'Contracts and business safeguards that keep the number from section two protected once work is actually underway, so profit is not something you find out about at the very end.'},
 {t:'normal',rh:'Part three',rf:'15',k:'Why listen to her',title:'She has run the P&L, not just taught it.',body:'Laura Thornton founded Thornton Design in 1999 and has run the boutique full-service studio for 25+ years, growing it into a seven-figure practice, while hosting The Business of Beautiful Spaces podcast for interior designers.'},
 {t:'normal',rh:'Part three',rf:'16',k:'What the Academy gives you',title:'35+ lessons across six modules, not a single mindset talk.',body:'Pricing for Results, Profit Optimization, Fiscal: Stages and Fees, Implementation Triumph, Protecting Profits, and a closing review, each one a working piece of the same fee structure, not six separate ideas.'},
 {t:'dark',rh:'Reframe',rf:'17',title:'The firm running on a real fee structure keeps what it earns. The firm without one just earns more to leak.'},

 {t:'section',rh:'Next',rf:'18',idx:'Your next step',title:'Build a Fee Structure That Actually Holds'},
 {t:'cta',rh:'Next',rf:'19',title:'Ready to stop leaving money on the table on every project?',chips:['The Profit Academy for Interior Designers','1:1 Mentorship','Join the Waitlist or Book a Call'],disc:'Educational content for interior design firm owners. Nothing here is a guarantee of income, revenue, growth or business results. Results vary by firm, market and effort.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'motif-title':'motif-corner'}" viewBox="0 0 260 90"><use href="#tally"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h=`<div class="runhead">${s.rh||''}</div><div class="runfoot">${s.rf||''}</div><div class="hairline"></div>`;
  if(s.t==='section'){ h+=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="bar"></div>`; }
  else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.attr) h+=`<div class="attr">${s.attr}</div>`;
    if(s.brand) h+=`<div class="brandline">The Profit <b>Academy</b> &middot; Laura Thornton</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  else if(s.t==='section') h+=motif('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
