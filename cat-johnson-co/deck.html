<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Full-House Coworking Space — a live masterclass with Cat Johnson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f0ea;
    --panel:#faf8f3;
    --rule:#e2ddd2;
    --ink:#23120b;
    --accent:#fdb827;
    --body:#333333;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:"Newsreader",Georgia,serif}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(35,18,11,.04)}
  .eyebrow{font-family:"Poppins",system-ui,sans-serif;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  .eyebrow b{color:var(--ink)}
  h1{font-family:"Poppins",system-ui,sans-serif;font-weight:700;color:var(--ink);
    font-size:46px;line-height:1.06;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:"Poppins",system-ui,sans-serif;font-weight:600;color:var(--ink);
    font-size:33px;line-height:1.12;margin-bottom:18px}
  p{font-size:21px;line-height:1.5;max-width:62ch;margin-bottom:14px}
  p.lead{font-size:24px;color:var(--ink)}
  .big{font-family:"Poppins",system-ui,sans-serif;font-weight:700;color:var(--ink);
    font-size:40px;line-height:1.12;letter-spacing:-.01em}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:21px;line-height:1.45;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:50%;
    background:var(--accent)}
  li.open:before{background:transparent;border:2px solid var(--rule);top:17px}
  .accentbar{width:64px;height:6px;background:var(--accent);border-radius:3px;margin-bottom:26px}
  .seats{display:flex;gap:9px;margin:8px 0 24px}
  .seats i{width:18px;height:18px;border-radius:4px;background:var(--accent);display:inline-block}
  .seats i.empty{background:transparent;border:2px solid var(--rule)}
  .num{font-family:"Poppins",sans-serif;font-weight:700;color:var(--accent);font-size:15px;
    letter-spacing:.14em;margin-bottom:12px;text-transform:uppercase}
  .cta{background:var(--ink)}
  .cta .eyebrow{color:var(--accent)}
  .cta h2,.cta .big{color:var(--panel)}
  .cta p{color:#e9e2d7}
  .cta .step{font-family:"Poppins",sans-serif;font-weight:600;color:var(--ink);background:var(--accent);
    display:inline-block;padding:12px 22px;border-radius:999px;font-size:18px;margin-top:10px}
  .fine{font-size:14px;color:#b9ab97;margin-top:26px;max-width:66ch;line-height:1.5}
  .foot{font-family:"Poppins",sans-serif;font-size:12px;color:#a99a86;text-align:center;
    letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:34px}h2{font-size:26px}.big{font-size:30px}p{font-size:19px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Cat Johnson Co &middot; a live masterclass for coworking operators</div>
<script>
const S=[
  {t:'title', eyebrow:'A live masterclass with Cat Johnson', h1:'The Full-House Coworking Space', lead:'How to fill seats with community and story, not discounts and amenities lists.'},
  {t:'who', eyebrow:'Who this is for', h2:'Built for the people who run the room', body:['Coworking space owners and operators.','Community managers and the marketing pro wearing ten hats.','Anyone growing a space who is tired of competing on price and square footage.']},
  {t:'trap', num:'The trap', h2:'You added more desks. The room still feels empty.', body:['Most spaces market the way a gym markets a treadmill: features, square footage, a discount for signing today.','So every space in town sounds the same, and the only lever left is price. That is a race nobody running a community wants to win.']},
  {t:'reframe', eyebrow:'The reframe', big:'Community isn’t a nice-to-have. It’s the whole point.', body:['A coworking space is not a real-estate business with a coffee machine. It is a community business that happens to have desks.','Once you run it that way, growth stops being about price.']},
  {t:'part', num:'Part one', h2:'The real problem', lead:'People don’t join a space. They join a room full of people they want to be around.'},
  {t:'point', h2:'Why the discount never sticks', body:['A member who joins for a deal leaves for a better deal. A member who joins for the people stays and brings a friend.','Discounting trains your market to wait for the next sale. Story and community train them to want in.']},
  {t:'part', num:'Part two', h2:'The community-story method', lead:'Four moves that turn a space into the obvious choice in its city. These are the pillars we’ll build today.'},
  {t:'pillar', num:'Pillar 1', h2:'Community first, by design', body:['Decide what kind of room you are building and who it is for, then design everything, from the layout to the welcome, around genuine connection.','Retention and referrals are the growth engine. They only show up when the community is real.']},
  {t:'pillar', num:'Pillar 2', h2:'Brand storytelling and positioning', body:['Find the one true thing that makes your space different, and say it in a story instead of an amenities list.','When your positioning is clear, people self-select in before they ever ask the price.']},
  {t:'pillar', num:'Pillar 3', h2:'Thought leadership', body:['You and your team become the recognized coworking voice in your area.','A quick thought-leadership audit shows where your expertise should be showing up, so inbound interest compounds instead of restarting every month.']},
  {t:'pillar', num:'Pillar 4', h2:'Content as a lead-gen channel', body:['One story, one strategy, on a steady cadence, is how a quiet space becomes the one everyone has heard of.','Your content turns your neighborhood into a channel that fills seats long before a tour.']},
  {t:'example', num:'On the ground', h2:'Find your real point of difference', body:['Not "great wifi and free coffee." The specific community you serve and the transformation members feel being part of it.','We’ll draft yours live, in one sentence you can use everywhere.']},
  {t:'example', num:'On the ground', h2:'Turn your neighborhood into a channel', body:['Local partnerships, member stories, and events that make your space the default answer when someone nearby needs a place to work.','This is reach you own, not reach you rent.']},
  {t:'example', num:'On the ground', h2:'Become the voice in your city', body:['Show up consistently with a point of view, and you stop chasing members. They start arriving already sold.']},
  {t:'part', num:'Part three', h2:'Putting it together', lead:'Community, story, authority, and content are one system. Each one makes the next easier.'},
  {t:'plan', h2:'Three moves for this week', body:['Write the one sentence that says who your space is really for.','Tell one member story publicly, in your own voice.','Pick the single cadence you can keep, and start.']},
  {t:'seats', h2:'This is how a space fills', seats:true, body:['Not with a louder discount. One real story and one real connection at a time, until the open seats are taken seats.']},
  {t:'credibility', eyebrow:'Why learn this from me', h2:'Thirteen years inside the industry', body:['I’ve worked in coworking since 2012, as a member of seven spaces and an advisor to operators worldwide.','I’ve spoken on the main stages at GCUC, GWA and Peers, and more than 9,000 coworking pros have joined my Coworking Convos.','Community, brand and story is the lane I live in.']},
  {t:'recap', eyebrow:'The takeaway', big:'Fill the room, and the business takes care of itself.', body:['Stop selling desks. Start building the community people can’t get anywhere else, and tell that story on repeat.']},
  {t:'cta', eyebrow:'Your next step', h2:'Keep building this with me', body:['If today was useful, come build it out inside the Coworking Creators Lab, where operators work on exactly this together, or book a Clarity Call to map your space’s story one on one.'], step:'Join the Coworking Creators Lab', fine:'Educational only. No specific business result is guaranteed. Results vary and depend on your market, your space, and the work you put in.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.num) h+='<div class="num">'+s.num+'</div>';
  if(s.t==='title'||s.t==='reframe'||s.t==='recap') h+='<div class="accentbar"></div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.seats) h+='<div class="seats"><i></i><i></i><i></i><i class="empty"></i><i></i><i class="empty"></i><i></i><i></i></div>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.body) s.body.forEach(b=>h+='<p>'+b+'</p>');
  if(s.step) h+='<div><span class="step">'+s.step+'</span></div>';
  if(s.fine) h+='<div class="fine">'+s.fine+'</div>';
  deck.appendChild(el).innerHTML=h;
});
</script>
</body>
</html>
