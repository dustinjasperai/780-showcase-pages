<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The STEEP Call · Mike Porter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Wix+Madefor+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0A150B; --panel:#142A18; --rule:#24402A;
    --acc:#2ED98F; --idx:#8FE0BB; --chalk:#F4FAF6; --grey:#C6DBCC; --dim:#6E8A76;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Wix Madefor Text',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Space Grotesk',Arial,sans-serif;font-weight:500;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4vw;max-width:88%}
  .t-normal h1{font-size:3vw;max-width:84%}
  .t-normal .body{font-size:1.44vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.66vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Wix Madefor Text',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1B3D24 0%,#050B06 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:86%;font-style:italic;color:#EEF7F1}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1B3D24 0%,#050B06 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#D6F5E4;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .signal-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-signal{right:6%;bottom:6%;width:20vw}
  .corner-signal{right:5%;bottom:6.5%;width:9vw;opacity:.4}
  .brandline{font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">TDR Way LLC</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- signal motif: a radiating dispatch-call waveform, concentric dashed arcs -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="signal" viewBox="0 0 260 260">
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <circle cx="130" cy="130" r="108" stroke="#2ED98F" opacity="0.85" stroke-dasharray="14 10"/>
    <circle cx="130" cy="130" r="78" stroke="#8FE0BB" opacity="0.4" stroke-dasharray="10 8"/>
    <circle cx="130" cy="130" r="48" stroke="#F4FAF6" opacity="0.15" stroke-dasharray="6 6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The STEEP Call',sub:'A live dispatch training masterclass for towing company owners, built from Mike Porter\'s STEEP method.',brand:true,signal:'title'},
 {t:'normal',k:'Who this is for',title:'Your trucks matter. The call that comes before them matters more.',body:'A stranded customer has usually called more than one number before yours picks up. Whoever answers first with a quote wins nothing. Whoever answers first with trust wins the job.'},
 {t:'dark',title:'A caller who feels handled hangs up and books elsewhere. A caller who feels heard books before the call ends.'},

 {t:'section',idx:'Part One',title:'Why Order-Taking Loses The Job'},
 {t:'normal',k:'The trap',title:'Taking an order is not the same as building a relationship.',body:'Most dispatch training stops at how to log the details: location, vehicle, destination. That gets the ticket started. It does nothing to make a stressed caller believe this is the company that will take care of them.'},
 {t:'normal',k:'The caller\'s actual state',title:'Nobody calls a tow truck on a good day.',body:'A breakdown call comes with real stress: a side of the road, a schedule blown up, a bill nobody planned for. How the phone gets answered in that moment decides more than the price does.'},
 {t:'dark',title:'Every call is an audition for the next one, and the one after that.'},

 {t:'section',idx:'Part Two',title:'The STEEP Method'},
 {t:'normal',k:'S : Smile',title:'Tone starts before the first word.',body:'A caller can hear whether the person on the other end is glad to help or just getting through the shift. Smile is the starting posture the rest of STEEP is built on.'},
 {t:'normal',k:'T : Tone',title:'How you sound decides whether they trust the price.',body:'The same words land differently depending on how they\'re said. Tone is what tells a stressed caller they\'ve reached someone steady, before a single detail is discussed.'},
 {t:'normal',k:'E : Engagement',title:'Stay on the line long enough to build rapport.',body:'Rushing to the quote skips the part where trust actually forms. Engagement means asking a real question and listening to the answer before moving to price.'},
 {t:'normal',k:'E : Empathy',title:'Name the bad day before you solve it.',body:'Acknowledging what the caller is actually going through, stranded, late, frustrated, does more to keep them on the phone than any feature of the service itself.'},
 {t:'normal',k:'P : Price',title:'Price lands differently once trust is already there.',body:'By the time STEEP reaches price, the caller has already decided they\'re talking to someone who gets it. The number gets heard instead of shopped.'},
 {t:'dark',title:'STEEP took two years to build, out of a dispatch team that knew how to take an order but not how to build a relationship.'},

 {t:'section',idx:'Part Three',title:'Where STEEP Lands, Every Shift'},
 {t:'normal',k:'The dispatcher this builds',title:'A team that turns calls into trusted jobs, not just tickets.',body:'A dispatcher who can run all five parts of STEEP on a real call, under real pressure, without sounding scripted.'},
 {t:'normal',k:'Why Mike Porter',title:'Thirty-plus years running the trucks, not consulting from outside them.',body:'Mike Porter has run Newhouse Towing for over 30 years, and built STEEP himself out of his own dispatch operation\'s real problem. He is billed as a business coach at the Towing & Recovery Management Summit, and leads the Profitowable 20 Group and a Weekly Mastermind for towing company owners.'},

 {t:'section',idx:'Your Next Step',title:'Bring STEEP To Your Dispatch Desk'},
 {t:'normal',k:'How it\'s delivered',title:'STEEP training, the Profitowable 20 Group, or the Weekly Mastermind.',body:'TDR Way runs STEEP dispatch-sales training directly with your team, alongside the Profitowable 20 Group\'s financial-analysis session, two on-site business reviews a year, and monthly accountability calls, plus a standing Weekly Mastermind for towing owners.'},
 {t:'cta',title:'Ready to build a dispatch team that wins the call?',chips:['Book a Time','TDR Way Training'],disc:'Educational content for towing company owners and their teams. No income or sales result is guaranteed. Results vary by company, market, and team.'},
];

const deck=document.getElementById('deck');
function signal(kind){return `<svg class="signal-motif ${kind==='title'?'title-signal':'corner-signal'}"><use href="#signal"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">TDR <b>Way</b> &middot; Mike Porter</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.signal) h+=signal(s.signal);
  else if(s.t==='title') h+=signal('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
