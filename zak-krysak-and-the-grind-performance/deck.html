<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Confident Athlete — Masterclass — The Grind Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c;
    --panel:#16130d;
    --rule:#2a2620;
    --ink:#faf8f6;
    --accent:#ff9d00;
    --dim:#9a938a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Barlow',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  #stage{
    width:min(100vw,1120px);height:min(100vh,700px);
    position:relative;padding:64px 72px;display:flex;flex-direction:column;
    justify-content:center;
  }
  .pillar{position:absolute;left:72px;top:64px;bottom:64px;width:3px;background:linear-gradient(var(--accent),rgba(255,157,0,0));opacity:.85}
  .inner{padding-left:44px}
  .kicker{font-family:'Montserrat';font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Montserrat';font-weight:800;font-size:66px;line-height:1.02;letter-spacing:-.01em}
  h2{font-family:'Montserrat';font-weight:700;font-size:40px;line-height:1.08;letter-spacing:-.01em}
  h3{font-family:'Montserrat';font-weight:700;font-size:26px;line-height:1.15}
  .sub{font-size:22px;color:var(--dim);margin-top:22px;max-width:40ch;line-height:1.4}
  .body{font-size:20px;line-height:1.5;margin-top:20px;max-width:46ch;color:var(--ink)}
  .big{font-family:'Montserrat';font-weight:700;font-size:34px;line-height:1.22;max-width:26ch}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px;max-width:44ch}
  li{position:relative;padding-left:30px;font-size:20px;line-height:1.4}
  li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;background:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 40px;margin-top:26px;max-width:56ch}
  .cell h3{color:var(--accent);font-size:22px;margin-bottom:6px}
  .cell p{font-size:17px;color:var(--dim);line-height:1.4}
  .foot{position:absolute;left:116px;bottom:40px;font-size:14px;color:var(--dim);letter-spacing:.03em}
  .num{position:absolute;right:40px;bottom:40px;font-family:'Montserrat';font-weight:700;font-size:14px;color:var(--dim)}
  .brand{position:absolute;right:44px;top:40px;font-family:'Montserrat';font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .brand b{color:var(--accent)}
  .disc{font-size:14px;color:var(--dim);margin-top:28px;max-width:56ch;line-height:1.5}
  .cta-line{font-family:'Montserrat';font-weight:700;font-size:24px;color:var(--accent);margin-top:24px}
  .nav{position:absolute;left:0;right:0;bottom:0;top:0;display:flex;justify-content:space-between;pointer-events:none}
  .nav button{pointer-events:auto;background:none;border:none;color:transparent;width:20%;cursor:pointer}
  @media (max-width:720px){
    #stage{padding:36px}h1{font-size:40px}h2{font-size:28px}.sub{font-size:18px}.body{font-size:17px}
    .grid{grid-template-columns:1fr}.pillar{left:36px;top:36px;bottom:36px}.brand{display:none}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button id="prev" aria-label="previous"></button><button id="next" aria-label="next"></button></div>
<script>
const S = [
  {t:'title', kicker:'A Live Masterclass with Zak Krysak', h:'The Confident Athlete',
   sub:'How elite performers build unshakeable confidence, one mental rep at a time.', foot:'The Grind Performance'},

  {t:'promise', kicker:'What you will walk away with', h2:'Confidence is a skill. You can train it.',
   list:['Why talent is rarely the thing holding an athlete back','The three mental tools every performer needs under pressure','A daily practice you can start the moment this ends']},

  {t:'who', kicker:'Who this is for', h2:'For the athlete, and the people behind them.',
   list:['Athletes at any age, sport, and level','The parents who want to help and are not sure how','Coaches and teams who know the mental game decides games']},

  {t:'trap', kicker:'The trap', h2:'You trained the body. Nobody trained the mind.',
   body:'Most athletes spend years on reps, drills, and conditioning, and almost no time on the mental game. So when the pressure is real, the doubt, the nerves, and the inconsistency show up, and it looks like a talent problem. It is not.'},

  {t:'reframe', kicker:'The reframe', h:'Confidence is not who you are.',
   sub:'It is what you practice. It is built by reps, and it fades without them, exactly like a physical skill.'},

  {t:'part', kicker:'Part One', h2:'Why talented athletes crumble.',
   body:'Performance goes far beyond the physical. Without the right mental tools or daily support, even the most talented can struggle to perform consistently. The gap between practice-you and game-day-you is a mental gap, and it is trainable.'},

  {t:'cost', kicker:'The cost of leaving it untrained', big:'The most talented athlete in the gym, undone by the six inches between the ears.',
   body:'Missed opportunities, big-game nerves, streaky play, and a quiet belief that this is just how it is. It is not a ceiling. It is an untrained skill.'},

  {t:'framework', kicker:'Part Two', h:'The 15 Pillars of Elite Performance.',
   sub:'The mental game, broken into trainable pillars, so it stops being a mystery and becomes a curriculum.'},

  {t:'pillar', kicker:'Pillar cluster one', h2:'Unshakeable Confidence',
   body:'Confidence built on evidence and reps, not on how the last game went. You learn to walk in believing in your preparation, so a bad start or a bad call does not take the belief with it.'},

  {t:'pillar', kicker:'Pillar cluster two', h2:'Focus Under Pressure',
   body:'The ability to lock in on the one thing that matters in the moment, and to reset fast when your attention gets pulled to the scoreboard, the crowd, or the mistake you just made.'},

  {t:'pillar', kicker:'Pillar cluster three', h2:'Mental Resilience',
   body:'Bouncing back from setbacks, failures, and roadblocks without spiraling. Adversity stops being the thing that ends the performance and becomes the thing you have rehearsed for.'},

  {t:'pillar', kicker:'Pillar cluster four', h2:'Lasting Habits and Routines',
   body:'Routines that make the right response automatic, so confidence and focus do not depend on feeling good that day. When it is a habit, it holds up when the moment is biggest.'},

  {t:'engine', kicker:'The method', h2:'Trained daily, not talked about once.',
   body:'This blends sports psychology, neurobiology, motivation, and growth. But the real lever is consistency. The mental game is built the same way the physical one is: small reps, most days, over time.'},

  {t:'pocket', kicker:'The daily practice', h:'A coach in your pocket.',
   sub:'The athletes who improve fastest are not the ones who train hardest once. They are the ones who do a little, daily, with support that is always there.'},

  {t:'part', kicker:'Part Three', h2:'When the mental game is trained.',
   list:['The same athlete, calmer and clearer when the moment is big','Bad games get shorter, and stop bleeding into the next one','Belief that survives a loss, a slump, or a hard coach']},

  {t:'parents', kicker:'For the parents', h2:'Support the athlete, do not add to the pressure.',
   body:'The sideline matters. Parents who understand the mental game learn how to be a steady presence instead of one more source of pressure, and it changes the drive home as much as the game.'},

  {t:'why', kicker:'Why I teach this', h2:'I needed it before I taught it.',
   body:'I was a multi-sport athlete who worked hard and still struggled with confidence and adversity, with no support system for the mental side. When I finally invested in my mental game I had one of my best seasons. Then I lost a close friend and teammate to suicide, and helping athletes with the inner game became the work.'},

  {t:'cred', kicker:'The Grind Performance', h2:'Built over years, with athletes worldwide.',
   grid:[
     {h:'Since 2020',p:'The Grind Performance, mental training for athletes, parents, coaches, and teams.'},
     {h:'6,000+ served',p:'Athletes, parents, and coaches across many sports, on a global scale.'},
     {h:'18+ years',p:'Coaching experience, and collaboration with coaches like Brian Cain and Rod Brind Amour.'},
     {h:'Every level',p:'From the young athlete finding their game to the competitor chasing the next level.'}
   ]},

  {t:'start', kicker:'Where to begin', h2:'You do not fix it all today. You take one rep.',
   body:'Confidence compounds. A short daily practice, done consistently, is what separates the athlete who talks about the mental game from the one who owns it. Start small, start today, and keep the streak.'},

  {t:'cta', kicker:'Your next rep', h:'Start training the mental game.',
   ctaLine:'Take the free 3-Day Mindset and Confidence Masterclass, then come train with us inside The Grind Performance.',
   sub:'Bring the confidence, focus, and resilience you build here to your next game.',
   disc:'Educational only. No specific result, outcome, or performance is guaranteed. Results vary based on effort, consistency, and individual circumstances.'}
];

const stage = document.getElementById('stage');
let i = 0;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  const s = S[i];
  let h = '<div class="pillar"></div><div class="brand">The <b>Grind</b> Performance</div><div class="inner">';
  if(s.kicker) h += '<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.h) h += '<h1>'+esc(s.h)+'</h1>';
  if(s.h2) h += '<h2>'+esc(s.h2)+'</h2>';
  if(s.big) h += '<div class="big">'+esc(s.big)+'</div>';
  if(s.sub) h += '<div class="sub">'+esc(s.sub)+'</div>';
  if(s.body) h += '<div class="body">'+esc(s.body)+'</div>';
  if(s.list){ h += '<ul>'; s.list.forEach(x=>h+='<li>'+esc(x)+'</li>'); h += '</ul>'; }
  if(s.grid){ h += '<div class="grid">'; s.grid.forEach(c=>h+='<div class="cell"><h3>'+esc(c.h)+'</h3><p>'+esc(c.p)+'</p></div>'); h += '</div>'; }
  if(s.ctaLine) h += '<div class="cta-line">'+esc(s.ctaLine)+'</div>';
  if(s.disc) h += '<div class="disc">'+esc(s.disc)+'</div>';
  h += '</div>';
  h += '<div class="foot">'+esc(s.foot||'The Confident Athlete')+'</div>';
  h += '<div class="num">'+(i+1)+' / '+S.length+'</div>';
  stage.innerHTML = h;
}
function go(n){ i = Math.max(0, Math.min(S.length-1, i+n)); render(); }
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown') go(1);
  if(e.key==='ArrowLeft'||e.key==='PageUp') go(-1);
});
render();
</script>
</body>
</html>
