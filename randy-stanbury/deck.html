<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Exit Is a Level, Not an Accident &middot; Randy Stanbury</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf8f5; --panel:#ffffff; --rule:#d9d3c5;
    --acc:#bba284; --ink:#2d394a; --body:#5a6270; --dim:#9a9284;
  }
  html,body{height:100%}
  body{background:#20272f;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#20272f}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .slide::before,.slide::after{content:'';position:absolute;width:1.1vw;height:1.1vw;border:1.5px solid var(--rule);opacity:.8}
  .slide::before{top:4%;left:4%;border-right:none;border-bottom:none}
  .slide::after{bottom:4%;right:4%;border-left:none;border-top:none}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Oswald',Arial,sans-serif;font-weight:500;color:var(--ink);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:3.7vw;max-width:82%}
  .t-normal h1{font-size:2.9vw;max-width:82%}
  .t-normal .body{font-size:1.4vw;color:var(--body);margin-top:2.6vh;max-width:72%;line-height:1.58;font-weight:300}
  .sub{font-size:1.5vw;color:var(--body);margin-top:3.2vh;max-width:72%;line-height:1.48;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.32vw;font-weight:600;color:var(--acc);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4vw;max-width:86%;color:var(--ink)}
  .t-section .rule{width:14vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:var(--ink);align-items:center;text-align:center}
  .t-dark::before,.t-dark::after{border-color:rgba(250,248,245,.28)}
  .t-dark h1{font-size:3vw;max-width:80%;color:var(--bg);font-style:italic}
  .t-cta{background:var(--ink);align-items:center;text-align:center}
  .t-cta::before,.t-cta::after{border-color:rgba(250,248,245,.28)}
  .t-cta h1{font-size:3.3vw;max-width:78%;color:var(--bg)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:var(--bg);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.14vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:#c7c1b3;font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .badge{display:inline-flex;align-items:center;justify-content:center;width:2.4vw;height:2.4vw;border:1.5px solid var(--acc);border-radius:50%;
    font-family:'Oswald',sans-serif;font-size:1.2vw;color:var(--ink);margin-bottom:1.6vh}
  .brandline{font-size:1.2vw;color:var(--body);margin-top:3.2vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .plan-rule{position:absolute;right:8%;top:0;bottom:0;width:1px;background:var(--rule);opacity:.6}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(45,57,74,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.6vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:6vw}.chip{font-size:2.6vw}.badge{width:7vw;height:7vw;font-size:3.2vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">4 Level Coach</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'The Exit Is a Level, Not an Accident',sub:'A live masterclass for custom home builders, built from Randy Stanbury\'s 4 Level System.',brand:true},

 {t:'normal',k:'Who this is for',title:'You didn\'t get into building to run a job site forever.',body:'Most custom home builders running two to ten million a year are still the person every subcontractor calls first, every change order gets approved by, and every closing depends on. That was fine at year three. By year twelve it\'s the whole business sitting on one set of shoulders.'},

 {t:'dark',title:'You can build forty homes and still not own a business anyone could buy.'},

 {t:'section',idx:'Part One',title:'Why Growth Alone Never Gets You Out'},
 {t:'normal',k:'The trap',title:'Revenue goes up. The owner\'s hours don\'t go down.',body:'More projects usually means more decisions only the owner can make, more pricing only the owner trusts, and more relationships only the owner holds. Growth without a plan just builds a bigger version of the same dependency.'},
 {t:'normal',k:'What it costs',title:'A business that depends on you is a business you can\'t leave.',body:'Whether the goal is stepping back, bringing on a partner, or eventually selling, none of it is possible while the business only runs correctly with the owner physically in it.'},

 {t:'dark',title:'Most builders find this out the hard way, usually during a burnout year, a health scare, or a buyer who walks after a look under the hood.'},

 {t:'section',idx:'Part Two',title:'The 4 Level System'},
 {t:'normal',k:'Level 1, Build the Foundation',title:'Get control. Remove chaos. Fix what\'s broken.',body:'Clean up the numbers, fix pricing so jobs actually make money, organize the team, and put the baseline systems in place that most builders never had time to build.'},
 {t:'normal',k:'Level 2, Scale & Optimize',title:'Turn the business into a predictable, repeatable operation.',body:'Team scoreboards, leadership rhythms, refined systems, and the partnership ecosystems that make growth predictable instead of feast-or-famine.'},
 {t:'normal',k:'Level 3, Leadership',title:'Build leaders who take ownership, not just employees who take direction.',body:'This is the stage where the business stops needing the owner\'s daily judgment on every job, because the people running it have started making that judgment themselves.'},
 {t:'normal',k:'Level 4, Custom Exit',title:'A fully customized final stage, built around what you actually want.',body:'New markets. A sale. Stepping back and staying an owner without staying an operator. Level 4 is built around your specific goal, not a generic playbook ending.'},

 {t:'dark',title:'The difference between an accidental exit and a designed one is whether you built toward it on purpose.'},

 {t:'section',idx:'Part Three',title:'How The System Actually Runs'},
 {t:'normal',k:'The shift',title:'Each phase runs four to twelve weeks. A full level, six to nine months.',body:'This isn\'t a weekend framework. It\'s a paced system: quarterly and weekly rhythms, a Success Coach and Coordinator, and hands-on implementation support at every level past Foundation.'},
 {t:'normal',k:'Why Randy Stanbury',title:'Built, scaled, and exited two businesses, then built the system that got him there into a program.',body:'29 years as a serial entrepreneur. Randy removed himself from his core business for roughly a decade, sold it at an industry-high multiple, then repeated the same formula with a second organization. 2x number-one Amazon bestselling author, and host of the Building Freedom Podcast for custom homebuilders, contractors, and trades.'},

 {t:'section',idx:'Your Next Step',title:'Find Out Which Level Fits Your Business'},
 {t:'normal',k:'How it works',title:'A short discovery call, not a sales pitch.',body:'The call is built to figure out where your business actually is today, foundation, optimization, leadership, or already thinking about exit, and which level of the system matches that.'},

 {t:'cta',title:'Ready to build toward an exit on purpose?',chips:['Book a Discovery Call','4 Level Coach'],disc:'Educational content for custom home builder owners. No income or business result is guaranteed. Results vary by market, business, and operator.'},
];

const deck=document.getElementById('deck');
const LEVELS={'Level 1, Build the Foundation':'1','Level 2, Scale & Optimize':'2','Level 3, Leadership':'3','Level 4, Custom Exit':'4'};
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    if(s.k){
      if(LEVELS[s.k]) h+=`<div class="badge">${LEVELS[s.k]}</div><br>`;
      h+=`<div class="kicker">${s.k}</div>`;
    }
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Randy <b>Stanbury</b> &middot; 4 Level Coach</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
