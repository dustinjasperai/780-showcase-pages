<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Learn the Method, Not the Machine · Angelika Sadar, Sadar Psychological</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f9fc; --panel:#eaf1f8; --rule:#d4e2ee;
    --acc:#14507d; --acc2:#ee7f35; --ink:#14283a; --body:#3a4a58; --dim:#7d8b98; --chalk:#eef4fa;
  }
  html,body{height:100%}
  body{background:#e4edf4;font-family:'Montserrat',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e4edf4}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc2);margin-bottom:2.6vh}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--ink);line-height:1.04;letter-spacing:.004em}
  .t-title h1{font-size:6.0vw;max-width:94%}
  .t-normal h1{font-size:4.0vw;max-width:92%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.36vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.66;font-weight:400}
  .sub{font-family:'Barlow Condensed',sans-serif;font-size:2.4vw;color:var(--acc);margin-top:3.0vh;max-width:84%;line-height:1.2;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc2);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.6vw;max-width:94%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc2),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(135% 135% at 50% 12%,#14507d 0%,#0e3556 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.4vw;max-width:88%;color:var(--chalk)}
  .t-cta{background:radial-gradient(135% 135% at 50% 100%,#14507d 0%,#0e3556 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.4vw;max-width:86%;color:var(--chalk)}
  .t-cta .body{font-family:'Montserrat',sans-serif;color:#d6e4f0;font-size:1.36vw;margin-top:3vh;max-width:72%;line-height:1.62}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc2);color:var(--chalk);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .wave-motif{position:absolute;pointer-events:none}
  .title-wave{right:7.0%;bottom:7.5%;width:22vw;opacity:.9}
  .corner-wave{right:6.5%;bottom:7.0%;width:11vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(20,80,125,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc2);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9.6vw}.t-normal h1{font-size:6.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.6vw}.t-section h1{font-size:8.4vw}.t-dark h1{font-size:6.8vw}
    .t-cta h1{font-size:7.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Sadar Psychological</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a clean EEG / brain-wave line trace, drawn in the brand navy + orange -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="wave" viewBox="0 0 240 80">
  <path d="M2 40 H40 l8 -26 l10 52 l9 -40 l8 22 H120" fill="none" stroke="#14507d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M120 40 l10 -18 l9 36 l8 -30 l9 22 l7 -10 H240" fill="none" stroke="#ee7f35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="120" cy="40" r="4" fill="#14507d" opacity="0.9"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Learn the Method, Not the Machine',sub:'How a clinician adds neurofeedback the right way, by reading the brain and choosing on the evidence, so your skill drives the results and not a vendor’s box.',brand:true,wave:'title'},
 {t:'normal',k:'Who this is for',title:'You want to add neurofeedback. The part no one hands you is the judgment.',body:'You are a licensed clinician, your clients would benefit, and the field is clearly growing. But most training points you at a piece of equipment and teaches you the buttons on it. What you actually need is the judgment underneath: how to read a brain, choose a protocol, and know why.'},
 {t:'dark',title:'Owning the hardware is not the same as understanding the brain in front of you.'},

 {t:'section',idx:'Part One',title:'Why the Equipment Ends Up Running the Clinic'},
 {t:'normal',k:'The vendor trap',title:'Most training teaches you the box you were sold.',body:'A lot of neurofeedback education is built around one company’s equipment, because the training and the hardware come from the same place. So you learn that system’s defaults, its protocols, and its way of doing things. The equipment quietly becomes the thing making clinical decisions, instead of you.'},
 {t:'normal',k:'Locked in',title:'When the machine chooses the protocol, you cannot see past it.',body:'If your whole method is one vendor’s presets, every client gets routed through the same handful of options. The cases that do not fit those presets are the ones that stall, and you have no framework to reach for, because the framework was never yours. It belonged to the box.'},
 {t:'dark',title:'You did not train for years to hand your clinical judgment to a piece of hardware.'},

 {t:'section',idx:'Part Two',title:'The Clinician’s Method'},
 {t:'normal',k:'Read the brain first',title:'Assessment comes before any protocol.',body:'Before a single session, you learn to read the brain: quantitative EEG, functional EEG, and evoked response potentials. That assessment is what turns neurofeedback from guesswork into a decision you can explain. You are looking at what this brain is actually doing, not reaching for a default.'},
 {t:'normal',k:'Choose on the evidence',title:'The protocol follows the brain, not the brand.',body:'Once you can read the assessment, protocol selection becomes a reasoned choice instead of a menu pick. You match the plan to the person, and you can say exactly why. That is the skill that survives when you change equipment, add a modality, or meet a case the presets never anticipated.'},
 {t:'normal',k:'Run a full session',title:'Instrumentation, setup, and what actually happens in the chair.',body:'The didactic core walks through neurophysiology, neuroanatomy, instrumentation, and treatment implementation, so a session is something you run with intent from electrode to feedback. You understand the signal, the artifact, and the change you are training toward, rather than trusting a screen to handle it.'},
 {t:'normal',k:'Make it clinical',title:'The part most courses skip: using it with real clients.',body:'A didactic course can leave you certified and still unsure on your first real case. The case study groups close that gap, small-group work on integrating neurofeedback into an actual practice, satisfying the case requirement and building the reps. Paired with mentoring, you finish able to use the method, not just pass it.'},
 {t:'dark',title:'When you own the method, the equipment becomes a choice, not a cage.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Method Leads'},
 {t:'normal',k:'The clinician this builds',title:'You can take on the case in front of you, whatever equipment is in the room.',body:'When your skill is reading the brain and choosing on the evidence, you are not dependent on one vendor’s ecosystem or its presets. You can assess, explain your plan, integrate neurofeedback with the work you already do, and keep learning as the field moves. The judgment is yours, and it travels with you.'},
 {t:'dark',title:'The goal was never to run a machine. It was to help the brain in front of you.'},
 {t:'normal',k:'Why learn it here',title:'Board-certified educators, and training that is not tied to any equipment vendor.',body:'Angelika and Mitchell Sadar are board certified in neurofeedback and heart rate variability and received the Joel F. Lubar Award for advancing neurotherapy. Their program is BCIA accredited and, unusually, not paired with an equipment vendor, so you learn the method independent of any one company’s hardware and choose your own.'},

 {t:'section',idx:'Your Next Step',title:'Add Neurofeedback the Right Way'},
 {t:'normal',k:'The path to certified',title:'Didactic, practicum, mentoring, and case studies, in one accredited path.',body:'The certification brings the pieces together: the accredited didactic course, live practicum, the BCIA mentoring hours, and the case study groups that make it clinical. You move from interested to board certified with the assessment-first method underneath the whole way, so what you earn is judgment you can use.'},
 {t:'cta',title:'Ready to add neurofeedback on the method, not the machine?',body:'Take the next step with Sadar Psychological.',chips:['Explore the certification program','Book a mentoring session'],disc:'Educational content for licensed and training clinicians. Neurofeedback outcomes vary by client, presentation, and practice. No clinical or income result is guaranteed.'},
];

const deck=document.getElementById('deck');
function wave(kind){return `<svg class="wave-motif ${kind==='title'?'title-wave':'corner-wave'}" viewBox="0 0 240 80"><use href="#wave"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Sadar <b>Psychological</b> · Angelika Sadar</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.wave) h+=wave(s.wave);
  else if(s.t==='title') h+=wave('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
