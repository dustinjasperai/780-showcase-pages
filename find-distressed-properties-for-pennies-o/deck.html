<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Conversation That Finds the Deal - Wholesaling Inc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe6;      /* warm sand, derived from Wholesaling Inc light neutrals */
    --ink:#16163f;     /* deep indigo, their ranked brand color */
    --accent:#ef722f;  /* their dominant orange */
    --muted:#6a6a6a;
    --panel:#ece9f4;   /* pale indigo tint of their brand indigo */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);}
  .slide{
    width:100%;max-width:1120px;margin:0 auto 26px;background:var(--bg);
    min-height:600px;padding:72px 84px;display:flex;flex-direction:column;justify-content:center;
    position:relative;border-radius:4px;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--accent);}
  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    font-size:16px;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:66px;line-height:1.0;
    text-transform:uppercase;letter-spacing:.01em;margin-bottom:22px;}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:48px;line-height:1.04;
    text-transform:uppercase;margin-bottom:20px;}
  p{font-size:21px;line-height:1.55;color:#262445;max-width:52ch;}
  p.lead{font-size:24px;}
  .big{font-size:30px;line-height:1.35;font-weight:500;color:var(--ink);max-width:40ch;}
  .promise{font-size:23px;color:var(--muted);margin-top:8px;}
  ul{list-style:none;margin-top:14px;}
  li{font-size:21px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid #e1d8c9;max-width:48ch;}
  li:last-child{border-bottom:none;}
  li::before{content:"";position:absolute;left:0;top:20px;width:14px;height:14px;background:var(--accent);border-radius:2px;}
  .pillar-num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:130px;color:var(--accent);line-height:.85;}
  .pillar-k{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:38px;margin:6px 0 16px;}
  .tag{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:14px;
    color:var(--muted);position:absolute;right:40px;top:34px;}
  .brandline{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:16px;color:var(--ink);margin-top:22px;}
  .cta h1{color:var(--accent);}
  .disc{font-size:14px;color:var(--muted);margin-top:28px;max-width:60ch;line-height:1.5;}
  @media(max-width:640px){.slide{padding:48px 32px;min-height:auto}h1{font-size:44px}h2{font-size:32px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
// Masterclass deck for Wholesaling Inc (Brent Daniels). The coach's own session, built from
// his IP: TTP (Talk To People), the Four Pillars, Progress Not Perfection. No ad/strategy content.
const S = [
  {t:'title', tag:'Wholesaling Inc', eyebrow:'A live masterclass with Brent Daniels',
   h:'The Conversation<br>That Finds the Deal',
   promise:'How to find off-market motivated sellers by talking to people, and know a real deal in one call.'},

  {t:'point', eyebrow:'Who this is for', h:"You want deals. You're waiting for them to show up.",
   lead:"You've sent the postcards. You've run the pay-per-click. You refresh the lead inbox and mostly it's quiet, or it's tire-kickers who were never going to sell.",
   foot:'So you wait. And waiting feels like working, right up until the month ends and there is no deal.'},

  {t:'statement', eyebrow:'The reframe', h:'The deal was never in the mailbox.',
   big:"The sellers who will say yes this week are already out there. The only thing standing between you and them is a conversation you haven't had yet."},

  {t:'point', tag:'Part One', eyebrow:'The core problem', h:'Passive marketing is a lottery.',
   bullets:['Mailers and ads put you in a pile and hope the right person calls back.',
            'You pay whether or not a motivated seller is on the other end.',
            'And the owner who needs to sell today has no idea you exist.']},

  {t:'point', eyebrow:'The real cost', h:"You're invisible to the people ready to deal.",
   lead:'Every distressed property has an owner with a story: a tired landlord, an inherited house nobody wants, a payment that got away from them. They are not searching for you. Somebody has to reach out first.'},

  {t:'title', tag:'Part Two', eyebrow:'The method', h:'TTP:<br>Talk To People',
   promise:'The fastest, lowest-cost, most reliable way to find a motivated seller is a direct conversation. Not a postcard. Not a click. A person talking to a person.'},

  {t:'point', eyebrow:'Why conversation wins', h:'You learn in two minutes what a mailer never tells you.',
   bullets:['Whether they actually want to sell, or are just curious.',
            'What the house really needs, in their words.',
            'How fast they need it gone, and why.',
            'And whether there is a number that works for both of you.']},

  {t:'title', tag:'Part Two', eyebrow:'The framework', h:'The Four Pillars<br>of a Deal',
   promise:'Every seller conversation comes down to four things. Read all four and you know, fast, whether this is a real deal or a time-waster.'},

  {t:'pillar', num:'01', k:'Condition',
   body:'What shape is the property really in? The roof, the systems, the work it needs. Their answer sets the whole deal and tells you how motivated they already are.'},
  {t:'pillar', num:'02', k:'Timeline',
   body:'How soon do they need to be done with it? A seller on a clock is a seller with a reason. Timeline is where urgency lives.'},
  {t:'pillar', num:'03', k:'Motivation',
   body:'Why sell, and why now? The story underneath the sale. Motivation is the pillar that turns a maybe into a yes, and it only comes out when you listen.'},
  {t:'pillar', num:'04', k:'Price',
   body:'What number actually works for them? Not the number you hoped for, the one they can live with. Nail the first three pillars and price becomes a conversation, not a fight.'},

  {t:'statement', eyebrow:'The payoff', h:'Qualify any seller in one call.',
   big:'Condition. Timeline. Motivation. Price. When you can hear all four, you stop chasing dead leads and spend your hours only on the ones that close.'},

  {t:'title', tag:'Part Three', eyebrow:'The mindset', h:'Progress,<br>Not Perfection',
   promise:'The system only works if you work it. You do not need the perfect script or the perfect list. You need to pick up the phone today and have the next conversation.'},

  {t:'point', eyebrow:'What the first 30 days look like', h:'Reps, not luck.',
   bullets:['A simple daily number of conversations, held no matter what.',
            "The same four pillars in every call until they're second nature.",
            'Progress you can see, because talking to people is something you control.'],
   foot:"Charge forward. That's the whole game."},

  {t:'point', eyebrow:'Why learn this here', h:'Brent Daniels, Wholesaling Inc.',
   lead:'Brent built the TTP method and has taught it to the Rhino Tribe community through the daily Wholesaling Inc podcast and a mentorship built entirely around proactive outreach. This masterclass is the front door to that same system.'},

  {t:'statement', eyebrow:'In one line', h:'Stop waiting for deals. Go talk to people.',
   big:'The deal is in the conversation. Learn to start it, qualify it against the Four Pillars, and do it every single day.'},

  {t:'cta', tag:'Wholesaling Inc', eyebrow:'Your next step', h:'Ready to run<br>the TTP system?',
   lead:'Book a free call with the Wholesaling Inc team to see if the TTP mentorship is the right fit, and get the scripts, the coaching, and the Rhino Tribe behind you.',
   brand:'Work 1-on-1 with Brent &middot; wholesalinginc.com',
   disc:'Educational only. Real estate wholesaling involves risk and results vary with effort, market, and experience. Nothing here is a promise or guarantee of income or specific results.'}
];

function esc(x){return x||''}
const deck = document.getElementById('deck');
S.forEach(s=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'');
  let h = '';
  if(s.tag) h += '<span class="tag">'+esc(s.tag)+'</span>';
  if(s.eyebrow) h += '<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.t==='pillar'){
    h += '<div class="pillar-num">'+esc(s.num)+'</div><div class="pillar-k">'+esc(s.k)+'</div>';
    h += '<p class="lead">'+esc(s.body)+'</p>';
  } else {
    if(s.h) h += (s.t==='title'||s.t==='cta') ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>';
    if(s.promise) h += '<p class="promise">'+esc(s.promise)+'</p>';
    if(s.lead) h += '<p class="lead">'+esc(s.lead)+'</p>';
    if(s.big) h += '<p class="big">'+esc(s.big)+'</p>';
    if(s.bullets){ h += '<ul>'; s.bullets.forEach(b=> h += '<li>'+esc(b)+'</li>'); h += '</ul>'; }
    if(s.foot) h += '<p style="margin-top:16px">'+esc(s.foot)+'</p>';
    if(s.brand) h += '<p class="brandline">'+s.brand+'</p>';
    if(s.disc) h += '<p class="disc">'+esc(s.disc)+'</p>';
  }
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
