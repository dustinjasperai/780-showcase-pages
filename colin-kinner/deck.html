<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Predictable Mistakes That Kill Startups — a masterclass with Colin Kinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f8f6;
    --panel:#efece5;
    --rule:#7c736a;
    --ink:#221f1c;
    --accent:#ce2029;
    --head:'Rajdhani',system-ui,sans-serif;
    --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--bg);
    border:1px solid #dedbd3;
    border-radius:4px;
    padding:64px 60px;
    margin:0 0 26px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 2px rgba(34,31,28,.04);
  }
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:14px;color:var(--accent);margin-bottom:22px}
  .num{position:absolute;top:34px;right:46px;font-family:var(--head);font-weight:700;
    font-size:18px;color:var(--rule)}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.02;letter-spacing:.01em;margin-bottom:22px}
  h2{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.08;margin-bottom:20px}
  .sub{font-size:21px;line-height:1.5;color:#3c3832;max-width:42ch}
  p{font-size:20px;line-height:1.55;color:#3c3832;max-width:60ch;margin-bottom:14px}
  .big{font-size:27px;line-height:1.4;color:var(--ink);max-width:52ch}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;line-height:1.4;color:#3c3832;padding:14px 0 14px 44px;position:relative;
    border-top:1px solid #dedbd3;max-width:58ch}
  li:first-child{border-top:none}
  li .mk{position:absolute;left:0;top:14px;font-family:var(--head);font-weight:700;color:var(--accent);font-size:20px}
  .lead{color:var(--ink);font-weight:600}
  .quote{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.2;color:var(--ink);max-width:40ch}
  .src{font-size:15px;color:var(--rule);margin-top:26px}
  .cta h2{color:var(--ink)}
  .disc{font-size:14px;color:var(--rule);margin-top:30px;max-width:66ch;line-height:1.5}
  .foot{font-family:var(--head);letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--rule);
    position:absolute;bottom:30px;left:60px}
  .accentbar{width:54px;height:5px;background:var(--accent);margin-bottom:26px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="accentbar"></div>
    <h1>The Predictable Mistakes<br>That Kill Startups</h1>
    <p class="sub">And the repeatable patterns that help first-time founders avoid them. A live masterclass with Colin Kinner, Startup Onramp.</p>
    <div class="foot">Startup Onramp</div>`},

  {t:'intro', kicker:'Who this is for', html:`
    <h2>If you are in your first two years, this is for you</h2>
    <p>You have an idea, maybe a prototype, maybe your first customers. You are moving fast, and you assume your startup is different enough that the usual rules do not apply to you.</p>
    <p class="lead">That assumption is the trap. The startups that fail rarely fail because the idea was wrong. They fail on a short list of avoidable mistakes, made in a predictable order.</p>`},

  {t:'hook', kicker:'The reframe', html:`
    <div class="accentbar"></div>
    <p class="quote">Startups do not fail from bad luck. They fail from a handful of mistakes that show up again and again, in roughly the same sequence.</p>
    <p class="src">Twenty years. More than 2,000 founders. The same patterns, over and over.</p>`},

  {t:'part', kicker:'Part one', html:`
    <h2>Why most startup advice makes it worse</h2>
    <p>Most founders learn from one person who succeeded once. The problem is that a single win can be luck as easily as skill.</p>
    <p class="big">Taking advice from a one-time founder is like asking them which lottery numbers they used, and then playing the same numbers.</p>
    <p>What you want is the repeatable pattern, the thing that holds true across thousands of startups, not one person's story.</p>`},

  {t:'problem', kicker:'The core problem', html:`
    <h2>The number one killer: building something nobody wants</h2>
    <p>The most common and most expensive mistake is a quiet one. You spend months building a product, and only afterward discover there was never enough real demand for it.</p>
    <p class="lead">Everything else in this masterclass exists to stop you making this one mistake.</p>`},

  {t:'framework', kicker:'Part two', html:`
    <div class="accentbar"></div>
    <h2>The predictable mistakes, in the order founders make them</h2>
    <p>Here is the sequence. Each one is avoidable once you can see it coming.</p>`},

  {t:'mistake', num:'01', kicker:'Mistake one', html:`
    <h2>Building before you validate</h2>
    <p>Founders fall in love with the solution and skip the step of proving anyone actually has the problem. The fix is to validate first: get out and test the idea with real customers before you build.</p>`},

  {t:'mistake', num:'02', kicker:'Mistake two', html:`
    <h2>Never articulating the customer problem</h2>
    <p>If you cannot state the customer's problem in one clear sentence, you cannot build for it, sell it, or raise money on it. Articulating and sharpening that problem is the first real work of a startup.</p>`},

  {t:'mistake', num:'03', kicker:'Mistake three', html:`
    <h2>Splitting equity equally between co-founders</h2>
    <p>An equal split feels fair on day one. It is normally a really bad idea. One co-founder typically leaves within twelve months, and now a person who is gone owns half the company.</p>`},

  {t:'mistake', num:'04', kicker:'Mistake four', html:`
    <h2>No founder vesting</h2>
    <p>Equity should be earned over time, not handed over on day one. Put vesting in place over three to four years so that the people who stay and do the work are the people who own the company.</p>`},

  {t:'mistake', num:'05', kicker:'Mistake five', html:`
    <h2>Raising money on the wrong story, too early</h2>
    <p>Founders chase capital before they have traction, then pitch the product instead of the problem. Fundraising works when you raise on evidence: a clear problem, early validation, and a credible plan for the money.</p>`},

  {t:'pattern', kicker:'The pattern', html:`
    <h2>Why these keep happening</h2>
    <p>None of these mistakes are exotic. They repeat because first-time founders do not know they are coming, and because the advice they hear rewards speed over evidence.</p>
    <p class="lead">Once you can name the pattern, you can get ahead of it. That is the whole point.</p>`},

  {t:'part', kicker:'Part three', html:`
    <div class="accentbar"></div>
    <h2>What getting it right looks like</h2>
    <ul>
      <li><span class="mk">1</span>Validate the problem with real customers before you build.</li>
      <li><span class="mk">2</span>State the customer problem in one sharp sentence.</li>
      <li><span class="mk">3</span>Structure the founding team and earn equity through vesting.</li>
      <li><span class="mk">4</span>Raise on traction and evidence, not on hope.</li>
    </ul>`},

  {t:'why', kicker:'Why learn this here', html:`
    <h2>Twenty years of watching the same film</h2>
    <p>Colin Kinner has spent two decades as a startup coach, mentor, advisor and investor, and has supported more than 2,000 founders through Startup Onramp. The predictable mistakes are not a theory. They are what he has watched sink good founders, again and again.</p>
    <p class="lead">The job of this work is simple: help you sidestep the mistakes so your time and money go into the things that actually move your startup forward.</p>`},

  {t:'recap', kicker:'The checklist', html:`
    <h2>Run this before you build</h2>
    <ul>
      <li><span class="mk">01</span>Have I validated that this problem is real and painful?</li>
      <li><span class="mk">02</span>Can I state the problem in one sentence?</li>
      <li><span class="mk">03</span>Is our equity split sane, with vesting in place?</li>
      <li><span class="mk">04</span>Am I raising on evidence, or on hope?</li>
    </ul>`},

  {t:'cta', cls:'cta', kicker:'Next step', html:`
    <div class="accentbar"></div>
    <h2>Work the patterns with Colin</h2>
    <p>If you want help applying this to your own startup, that is exactly what Startup Onramp is for: the Founders Course, the Founder Community, and 1:1 founder coaching with Colin.</p>
    <p class="lead">Start with a conversation. Book a founder coaching session, or join the Founder Community at startuponramp.com.</p>
    <p class="disc">Educational content only. This masterclass shares general startup principles and patterns. It is not investment, legal, or financial advice. No outcome, funding result, or revenue is guaranteed. Every startup is different and results vary.</p>`}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let inner = '';
  if (i > 0) inner += '<div class="num">' + String(i+1).padStart(2,'0') + '</div>';
  if (s.kicker) inner += '<div class="kicker">' + s.kicker + '</div>';
  inner += s.html;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
