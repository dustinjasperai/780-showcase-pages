<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goals Alive — A Live Masterclass with Jacki Carr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:ital,wght@0,400;0,500;0,600;1,400&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6e5;        /* her dominant cream ground */
    --panel:#f1ead3;     /* deepened cream */
    --ink:#384c48;       /* her forest-green text */
    --ink-soft:#5c6f6a;
    --accent:#c38f2c;    /* her gold/ochre accent */
    --serif:"Brygada 1918",Georgia,serif;
    --sans:"Schibsted Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:7vh 7vw;border-bottom:1px solid rgba(56,76,72,.12);position:relative}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.72rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.6rem,7vw,5rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.1;letter-spacing:-.01em}
  .lede{font-family:var(--serif);font-weight:400;font-size:clamp(1.3rem,2.3vw,1.8rem);color:var(--ink-soft);margin-top:1.6rem;max-width:40ch}
  p.body{font-size:1.15rem;margin-top:1.3rem;max-width:52ch;color:var(--ink)}
  .mark{display:inline-block;width:46px;height:3px;background:var(--accent);margin:1.8rem 0 0}
  .num{font-family:var(--serif);font-size:1.1rem;color:var(--accent);font-weight:600;letter-spacing:.04em;margin-bottom:.6rem}
  .pillar{display:flex;gap:1.3rem;align-items:flex-start;margin-top:1.6rem;max-width:56ch}
  .pillar .dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:.5rem}
  .pillar h3{font-family:var(--serif);font-weight:500;font-size:1.5rem}
  .pillar p{color:var(--ink-soft);margin-top:.3rem;font-size:1.05rem}
  .big-quote{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(1.8rem,4vw,3rem);line-height:1.2;max-width:24ch}
  .panel{background:var(--panel);border-radius:18px;padding:2.4rem 2.6rem;margin-top:1.8rem;max-width:54ch}
  .panel .q{font-family:var(--serif);font-size:1.3rem;color:var(--ink)}
  .panel .a{color:var(--ink-soft);margin-top:.6rem;font-size:1.05rem}
  .cta-list{margin-top:1.8rem;display:flex;flex-direction:column;gap:1rem;max-width:48ch}
  .cta-list .row{display:flex;gap:1rem;align-items:baseline;font-size:1.12rem}
  .cta-list .row b{color:var(--accent);font-family:var(--serif);font-weight:600;white-space:nowrap}
  .disclaimer{font-size:.82rem;color:var(--ink-soft);margin-top:2rem;max-width:58ch;line-height:1.5;font-weight:400}
  .brandline{font-family:var(--serif);font-size:1.15rem;color:var(--ink);margin-top:1.6rem}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", eyebrow:"A Live Masterclass", h:"Goals Alive",
   lede:"Why your goals keep dying by March, and the values-first way to set ones that actually stick.",
   brand:"With Jacki Carr, creator of Goals Alive"},

  {t:"who", eyebrow:"Who this is for",
   h:"You set the same goals every year.",
   body:"And every year, somewhere around March, they quietly disappear. You are not lazy and you are not short on ambition. You hit targets for a living. So why do your own goals keep fading out?"},

  {t:"trap", eyebrow:"The trap",
   h:"You were taught to set goals through the overachiever lens.",
   body:"Pick the goal. Grind toward it. You are allowed to feel good once it is done. Happiness always waits at the finish line, so the goal never feels like yours while you are living it. It feels like one more thing you owe."},

  {t:"hook", eyebrow:"The reframe",
   quote:"A goal with no values underneath it is just pressure with a deadline."},

  {t:"section", num:"Part One", h:"Why goals die.",
   body:"It is almost never a discipline problem, and it is almost never the wrong goal. The goal died because it had nothing to hold onto."},

  {t:"point", eyebrow:"The real reason",
   h:"The root was missing.",
   body:"A goal that is not rooted in what you actually value has nothing to draw on when the first hard week comes. So it lets go. You blame your willpower, set it again next January, and the cycle repeats."},

  {t:"section", num:"Part Two", h:"Goals Alive.",
   body:"The fix is to build the goal from the inside out. Three moves, in order. Your core values first, a vision second, and only then the goals that serve them."},

  {t:"pillar", eyebrow:"The method, step one",
   h:"Name your core values, in your own language.",
   pillars:[
     {k:"Not a borrowed list", d:"The three or four words that are actually true about how you want to live, written and defined in language that sounds like you, not pulled from someone else's poster."},
     {k:"The filter", d:"Once they are named, they become the filter every future goal has to pass through. If a goal does not serve a value, it is not your goal."}
   ]},

  {t:"panelpoint", eyebrow:"What a defined value looks like",
   h:"Say it in your own words.",
   q:"“Connection” on its own is a bumper sticker.",
   a:"Defined, it becomes yours: the practice of choosing people and work that make me feel known, and leaving the rooms that do not. That is a value you can actually hold a goal against."},

  {t:"pillar", eyebrow:"The method, step two",
   h:"Build a vision that gives direction.",
   pillars:[
     {k:"Vision before resolutions", d:"A clear picture of the life those values are building toward. This is the step most goal setting skips, which is why January's list always feels arbitrary."},
     {k:"Direction, not pressure", d:"The vision is what the goals point at. It turns a scattered wish list into a handful of goals that obviously belong."}
   ]},

  {t:"point", eyebrow:"Why vision comes first",
   h:"Goals are answers. Vision is the question.",
   body:"Set goals without a vision and you are answering a question nobody asked. Build the vision first and the right goals get obvious. You stop guessing at what to want."},

  {t:"pillar", eyebrow:"The method, step three",
   h:"Set value-based goals that serve the vision.",
   pillars:[
     {k:"A real format", d:"A clear template for writing a goal so it is specific, alive, and tied back to a value and the vision, instead of a vague intention you can wriggle out of."},
     {k:"The goals audit", d:"A simple check you run on every goal before you commit to it."}
   ]},

  {t:"panelpoint", eyebrow:"The goals audit",
   h:"Two questions, every goal.",
   q:"Which of my values does this goal serve, and does it move my vision forward?",
   a:"If a goal does neither, you let it go without guilt. What survives the audit is a short list of goals that are genuinely yours, which is exactly why they hold."},

  {t:"after", num:"Part Three", h:"What an alive goal feels like.",
   body:"It pulls you forward instead of guilt-tripping you from behind. You stop renegotiating it every Monday, because it is rooted in something you are not willing to trade."},

  {t:"point", eyebrow:"The difference",
   h:"The hard weeks stop ending it.",
   body:"When a goal is tied to a value and a vision, a bad week is just a bad week. You know exactly what the goal is for, so you come back to it instead of quietly dropping it."},

  {t:"after2", eyebrow:"The shift",
   h:"From chasing goals to living them.",
   body:"Values, vision, and goals become one living practice you return to, not a list you abandon. That is the whole point of Goals Alive, and the work that opens up inside the UNRAVEL cohort."},

  {t:"why", eyebrow:"Why me",
   h:"I have spent 18 years on this.",
   body:"Brand and culture work with lululemon, Patagonia, NIKE, and Mindbody, helping teams turn abstract values into how people actually operate. Goals Alive is that same work, built for one person and their own life. I am a goal coach, a speaker, and a writer, and this is the thing I am known for.",
   brand:"Jacki Carr"},

  {t:"bridge", eyebrow:"Where this goes",
   h:"You leave with your own three.",
   body:"By the end of the live class you will have named your core values, sketched a vision, and written one value-based goal against them. Not a worksheet you file away. A practice you can keep using."},

  {t:"cta", eyebrow:"Your next step",
   h:"Bring your goals back to life.",
   rows:[
     {a:"Start the method", b:"Join the Goals Alive program and build your values, vision, and goals step by step."},
     {a:"Go deeper", b:"Step into UNRAVEL, the 9-month cohort for direction, support, and expansion."},
     {a:"Work with me", b:"Book a 1:1 session and we set your value-based goals together."}
   ],
   disclaimer:"This masterclass is for educational purposes. It shares a goal-setting method and reflects one coach's experience. It is not a guarantee of any particular outcome or result. Your results depend on your own effort and circumstances."}
];

function esc(x){return (x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const deck = document.getElementById("deck");
let html = "";
for(const s of S){
  html += '<section class="slide">';
  if(s.num) html += '<div class="num">'+esc(s.num)+'</div>';
  if(s.eyebrow) html += '<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.t==="title"){
    html += '<h1>'+esc(s.h)+'</h1><div class="mark"></div>';
    if(s.lede) html += '<div class="lede">'+esc(s.lede)+'</div>';
    if(s.brand) html += '<div class="brandline">'+esc(s.brand)+'</div>';
  } else if(s.t==="hook"){
    html += '<div class="big-quote">'+esc(s.quote)+'</div>';
  } else if(s.t==="pillar"){
    html += '<h2>'+esc(s.h)+'</h2>';
    for(const p of s.pillars){
      html += '<div class="pillar"><span class="dot"></span><div><h3>'+esc(p.k)+'</h3><p>'+esc(p.d)+'</p></div></div>';
    }
  } else if(s.t==="panelpoint"){
    html += '<h2>'+esc(s.h)+'</h2><div class="panel"><div class="q">'+esc(s.q)+'</div><div class="a">'+esc(s.a)+'</div></div>';
  } else if(s.t==="cta"){
    html += '<h2>'+esc(s.h)+'</h2><div class="cta-list">';
    for(const r of s.rows){
      html += '<div class="row"><b>'+esc(r.a)+'.</b><span>'+esc(r.b)+'</span></div>';
    }
    html += '</div>';
    if(s.disclaimer) html += '<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
  } else {
    if(s.h) html += '<h2>'+esc(s.h)+'</h2>';
    if(s.body) html += '<p class="body">'+esc(s.body)+'</p>';
    if(s.brand) html += '<div class="brandline">'+esc(s.brand)+'</div>';
  }
  html += '</section>';
}
deck.innerHTML = html;
</script>
</body>
</html>
