<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Dashboard Factory to Strategic Partner, a live masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fa; --panel:#eef2f7; --rule:#d7dee8;
  --ink:#16202e; --accent:#1f5fbf; --deep:#12385f;
  --muted:#5b6675;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:9vh 9vw;border-bottom:1px solid var(--rule);position:relative}
.kicker{font-size:.82rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:1.4rem}
h1{font-family:'Lato',sans-serif;font-weight:900;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.04;letter-spacing:-.01em}
h2{font-family:'Lato',sans-serif;font-weight:700;font-size:clamp(1.8rem,4vw,3rem);line-height:1.1}
.sub{font-size:clamp(1.05rem,2.2vw,1.5rem);color:var(--muted);margin-top:1.6rem;max-width:34ch;line-height:1.5}
.big{font-family:'Lato',sans-serif;font-weight:900;font-size:clamp(2rem,5.4vw,3.8rem);line-height:1.08;max-width:22ch}
.big .a{color:var(--accent)}
.partnum{font-family:'Lato',sans-serif;font-weight:900;font-size:clamp(3rem,10vw,7rem);color:var(--accent);line-height:1}
.card{background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--accent);
  border-radius:14px;padding:2.2rem 2.4rem;max-width:44ch}
.card .step{font-size:.8rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.card h3{font-family:'Lato',sans-serif;font-size:1.7rem;font-weight:700;margin:.5rem 0 .8rem}
.card p{color:var(--muted);font-size:1.08rem;line-height:1.55}
ul.moves{list-style:none;margin-top:1.8rem;max-width:40ch}
ul.moves li{display:flex;gap:1rem;align-items:baseline;padding:.9rem 0;border-bottom:1px solid var(--rule);font-size:1.15rem}
ul.moves li b{font-family:'Lato',sans-serif;color:var(--accent);font-weight:900;min-width:2.2rem}
.credit{background:var(--deep);color:#eaf1fb;margin:0 -9vw;padding:9vh 9vw;min-height:100vh;
  display:flex;flex-direction:column;justify-content:center}
.credit h2,.credit h1{color:#fff}
.credit .sub{color:#c4d4ec}
.cta-box{background:var(--accent);color:#fff;margin:0 -9vw;padding:9vh 9vw;min-height:100vh;
  display:flex;flex-direction:column;justify-content:center}
.cta-box h1{color:#fff}
.cta-box .sub{color:#e7effb}
.disclaimer{margin-top:2.4rem;font-size:.85rem;color:#dbe6f8;max-width:52ch;line-height:1.5}
.pageno{position:absolute;bottom:3vh;right:9vw;font-size:.8rem;color:var(--muted);letter-spacing:.1em}
.credit .pageno,.cta-box .pageno{color:#a9c0e0}
.brandmark{position:absolute;top:4vh;left:9vw;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.credit .brandmark,.cta-box .brandmark{color:#fff}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
{t:'title', k:'A live masterclass with Sebastian Hewing', h:'From Dashboard Factory to Strategic Partner', s:'How experienced data professionals package what they know into a premium consulting offer clients say yes to.'},
{t:'audience', k:'Who this is for', h:'You can build almost anything with data.', s:'3+ years in analytics, data science, or engineering. The skill was never the problem. Getting paid properly for it is.'},
{t:'trap', k:'The trap', h:'You keep shipping dashboards, and they keep going unopened.', s:'More reports, more models, more tools. The work piles up. The recognition, and the money, do not follow it.'},
{t:'reframe', big:'Nobody pays for a <span class="a">dashboard</span>. They pay for a <span class="a">decision</span>.', k:'The reframe'},
{t:'part', n:'One', h:'Why great data work goes unpaid'},
{t:'body', k:'The core problem', h:'You are selling effort. Buyers buy outcomes.', s:'A dashboard is proof you did the work. An offer is a promise about the buyer\'s result. Those are two different products, and only one of them commands a premium.'},
{t:'body', k:'The loop', h:'The dashboard-factory loop', s:'Take the request, build the thing, deliver it, wait for the next request. You stay busy and stay a cost centre. Nothing in that loop moves you toward strategic partner.'},
{t:'part', n:'Two', h:'The method: three tools'},
{t:'framework', step:'Tool 01', h:'ICP Definition Tool', s:'A four-step way to name the one buyer worth pursuing, so you stop being a generalist that everyone can afford to ignore.'},
{t:'framework', step:'Tool 02', h:'Problem Definition Tool', s:'A five-step problem-interview framework to find the problem important enough that the buyer will pay real money to make it go away.'},
{t:'framework', step:'Tool 03', h:'Offer Creation Tool', s:'A four-step way to shape and validate the offer itself, so you walk in with something specific, priced, and proven, not a rate card.'},
{t:'body', k:'How they fit', h:'Buyer, then problem, then offer.', s:'In that order. Most data pros invent the offer first and hunt for someone to sell it to. The tools run the other way, which is why the offer lands.'},
{t:'part', n:'Three', h:'Where this puts you'},
{t:'body', k:'The shift', h:'From order-taker to the person in the room when the decision gets made.', s:'Same technical depth. A completely different position, and a completely different price, because you are now attached to the outcome.'},
{t:'body', k:'Pricing the outcome', h:'You price the result, not the hours.', s:'When the offer is tied to a decision the business cares about, the conversation stops being about your day rate. That is where a premium offer comes from.'},
{t:'credit', k:'Why me', h:'I built the data function 40+ times.', s:'15+ years in data, analytics and AI. As Head of Business Analytics at Rocket Internet I built data teams and infrastructure for 7 portfolio companies across 15 countries. The tools in this masterclass are the ones I use.'},
{t:'moves', k:'The recap', h:'Three moves', items:['Define the buyer worth pursuing','Find the problem worth paying for','Build and validate the offer']},
{t:'body', k:'The takeaway', h:'The gap is not your skill. It is your offer.', s:'Close that gap and the work you already do turns into a premium consulting practice, on your terms and your schedule.'},
{t:'cta', k:'Your next step', h:'Join the live masterclass', s:'Bring one buyer you want to work with. Leave with the shape of an offer you could put in front of them. Save your seat for the next live session.', disc:'This masterclass is educational. No income or result is guaranteed. Results vary and depend on your own work, market, and effort.'}
];
const deck=document.getElementById('deck');
S.forEach((sl,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(sl.t==='credit'?' has-credit':'')+(sl.t==='cta'?' has-cta':'');
  let inner='';
  const brand='<div class="brandmark">Data Action Mentor</div>';
  const no='<div class="pageno">'+(i+1)+' / '+S.length+'</div>';
  if(sl.t==='title'){inner=brand+'<div class="kicker">'+sl.k+'</div><h1>'+sl.h+'</h1><div class="sub">'+sl.s+'</div>'+no;}
  else if(sl.t==='audience'||sl.t==='trap'||sl.t==='body'){inner=brand+'<div class="kicker">'+sl.k+'</div><h2>'+sl.h+'</h2><div class="sub">'+sl.s+'</div>'+no;}
  else if(sl.t==='reframe'){inner=brand+'<div class="kicker">'+sl.k+'</div><div class="big">'+sl.big+'</div>'+no;}
  else if(sl.t==='part'){inner=brand+'<div class="partnum">'+sl.n+'</div><h2 style="margin-top:1rem">'+sl.h+'</h2>'+no;}
  else if(sl.t==='framework'){inner=brand+'<div class="card"><div class="step">'+sl.step+'</div><h3>'+sl.h+'</h3><p>'+sl.s+'</p></div>'+no;}
  else if(sl.t==='credit'){d.className='slide';inner='<div class="credit"><div class="brandmark">Data Action Mentor</div><div class="kicker">'+sl.k+'</div><h2>'+sl.h+'</h2><div class="sub">'+sl.s+'</div><div class="pageno">'+(i+1)+' / '+S.length+'</div></div>';}
  else if(sl.t==='moves'){inner=brand+'<div class="kicker">'+sl.k+'</div><h2>'+sl.h+'</h2><ul class="moves">'+sl.items.map((m,j)=>'<li><b>'+(j+1)+'</b><span>'+m+'</span></li>').join('')+'</ul>'+no;}
  else if(sl.t==='cta'){d.className='slide';inner='<div class="cta-box"><div class="brandmark">Data Action Mentor</div><div class="kicker" style="color:#e7effb">'+sl.k+'</div><h1>'+sl.h+'</h1><div class="sub">'+sl.s+'</div><div class="disclaimer">'+sl.disc+'</div><div class="pageno">'+(i+1)+' / '+S.length+'</div></div>';}
  d.innerHTML=inner;
  deck.appendChild(d);
});
</script>
</body>
</html>
