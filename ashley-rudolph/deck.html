<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Your Best Work Isn't Getting You Promoted: Masterclass with Ashley Rudolph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f6;
    --panel:#f1ece5;
    --ink:#1a1a1a;
    --muted:#6b6457;
    --accent:#b15e3c;
    --accent-soft:#f5d8d6;
    --rule:#e4ddd2;
    --display:"Cormorant Garamond",Georgia,serif;
    --body:"Figtree",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:64px 60px;
    margin:0 0 28px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);
  }
  .kicker{font-family:var(--body);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1}
  .sub{font-family:var(--body);font-size:20px;color:var(--muted);margin-top:22px;max-width:40ch;line-height:1.5}
  .lead{font-family:var(--display);font-size:34px;line-height:1.18;font-weight:500;max-width:26ch}
  .body{font-family:var(--body);font-size:19px;line-height:1.6;color:var(--ink);max-width:48ch;margin-top:18px}
  .big{font-family:var(--display);font-size:46px;line-height:1.08;font-weight:600;letter-spacing:-.01em;max-width:24ch}
  .accent{color:var(--accent)}
  .part-num{font-family:var(--display);font-size:120px;font-weight:700;color:var(--accent-soft);line-height:.9}
  .pillars{display:flex;flex-direction:column;gap:20px;margin-top:10px}
  .pill{display:flex;gap:20px;align-items:flex-start}
  .pill .n{font-family:var(--display);font-size:30px;font-weight:700;color:var(--accent);min-width:48px}
  .pill .t{font-family:var(--body);font-size:20px;font-weight:600}
  .pill .d{font-family:var(--body);font-size:16px;color:var(--muted);margin-top:4px;line-height:1.5}
  .vals{display:flex;gap:16px;margin-top:28px;flex-wrap:wrap}
  .val{flex:1;min-width:200px;background:var(--panel);border-radius:10px;padding:24px}
  .val h3{font-family:var(--display);font-size:24px;font-weight:600;color:var(--accent)}
  .val p{font-family:var(--body);font-size:15px;color:var(--muted);margin-top:8px;line-height:1.5}
  .cred{font-family:var(--body);font-size:18px;line-height:1.65;color:var(--ink);max-width:46ch;margin-top:16px}
  .cred b{color:var(--accent);font-weight:600}
  .foot{position:absolute;bottom:22px;left:60px;right:60px;display:flex;justify-content:space-between;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.04em}
  .disclaimer{font-family:var(--body);font-size:13px;color:var(--muted);margin-top:26px;max-width:52ch;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-family:var(--body);font-weight:600;font-size:17px;padding:16px 30px;border-radius:9px;letter-spacing:.01em}
  @media(max-width:640px){.slide{padding:40px 28px;min-height:420px}h1{font-size:38px}.big{font-size:32px}.part-num{font-size:84px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass with Ashley Rudolph',h:'Why Your Best Work Isn’t Getting You Promoted',sub:'And what actually moves senior leaders to the next level. For VPs, directors, and high performers who keep getting overlooked.'},
 {t:'promise',kicker:'What you’ll leave with',big:'A clear read on the one gap that’s keeping you stuck, and the method to close it.',body:'Not more tactics to work harder. A different understanding of what advancement actually rewards.'},
 {t:'who',kicker:'Who this is for',lead:'You’re the top performer on the team. So why does the promotion keep going to someone else?',body:'You deliver. You’re reliable. Your reviews are strong. And yet the senior role, the visibility, the seat at the table keep landing with people whose work you quietly out-perform.'},
 {t:'hook',kicker:'The uncomfortable part',big:'You’ve been told to do more, and do it better. That advice is exactly why you’re stuck.',body:'Working harder is a strategy for getting where you are. It is not the strategy for getting to the next level.'},
 {t:'part',num:'01',kicker:'Part one',h:'The real problem is a perception gap'},
 {t:'content',kicker:'Output is not the lever',lead:'Your work won’t speak for itself.',body:'Great output is assumed at your level. What decides promotions is whether the people above you see your work as strategic impact, or just as reliable effort. Those are two completely different stories about the same work.'},
 {t:'content',kicker:'The gap',big:'The distance between how you operate and how you’re perceived.',body:'Close that gap and the work you’re already doing starts to land. That is the whole game, and almost nobody is coaching you on it.'},
 {t:'part',num:'02',kicker:'Part two',h:'The “Tell Me What To Do” Method'},
 {t:'content',kicker:'Why it starts one step earlier',lead:'Most advice starts at execution. This starts before it.',body:'High performers want to be told what to do. The method teaches you to first find what’s actually holding you back, so the thing you do next is finally the right thing, not just another task done well.'},
 {t:'pillars',kicker:'The three pillars',h:'How the method works',pillars:[
   {n:'1',t:'Understand what’s actually happening',d:'Name the real blocker. It is usually in how your work is communicated, clarified, and positioned, not in the work itself.'},
   {n:'2',t:'Build the right strategy for your situation',d:'A plan built for your role, your politics, and your goals, not generic career advice that ignores the room you’re in.'},
   {n:'3',t:'Put it into practice',d:'Rehearse the real high-stakes moments until the new way of operating becomes natural, not performed.'}
 ]},
 {t:'vals',kicker:'What the method protects',h:'Three things we refuse to trade',vals:[
   {h:'Authenticity',p:'You lead as yourself, clarified, not as a borrowed version of someone else’s leadership.'},
   {h:'Excellence',p:'Results come from understanding what drives outcomes at each level, not from working longer.'},
   {h:'Impact',p:'Strong work gets translated into visible, recognized contribution tied to business outcomes.'}
 ]},
 {t:'part',num:'03',kicker:'Part three',h:'When the perception gap closes'},
 {t:'content',kicker:'Executive presence',lead:'Presence isn’t performance. It’s how your work lands in the room.',body:'When you walk into the rooms that decide your next level and your thinking is clear, your narrative is sharp, and your impact is named, the decision gets easy for the people making it.'},
 {t:'content',kicker:'Strategic narrative',big:'Stop describing effort. Start owning impact.',body:'The same project, told as business impact instead of a list of tasks, changes how senior leaders size you up for what’s next.'},
 {t:'cred',kicker:'Why me',h:'I’ve been on both sides of the table',cred:'I went from individual contributor to <b>VP in about five years</b>, leading teams and shaping strategy at the executive table. I know what gets someone promoted, because I did it, and because I now coach senior leaders at companies like Meta, Disney, and Citi to do the same. My work and writing have been featured in U.S. News & World Report, Success Magazine, and Inc.'},
 {t:'content',kicker:'The takeaway',big:'You’re not behind. Your impact is just invisible, and that’s fixable.',body:'The leaders who advance aren’t working harder than you. They’ve closed the perception gap. You can too, and faster than you think.'},
 {t:'cta',kicker:'Your next step',h:'Work with me on closing the gap',sub:'If this is the problem you’ve been circling, apply for Elevate, my 1:1 coaching for high achievers. We’ll find your real blocker and build the strategy, narrative, and presence to move you up.',cta:'Apply for 1:1 coaching',disc:'Educational only. No income or result is guaranteed. Results vary and depend on each individual’s situation and effort.'}
];

function esc(s){return s;}
function render(){
 const d=document.getElementById('deck');
 S.forEach((s,i)=>{
   const el=document.createElement('section');
   el.className='slide';
   let h='';
   if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
   if(s.t==='title'){h+='<h1>'+s.h+'</h1>'+(s.sub?'<p class="sub">'+s.sub+'</p>':'');}
   else if(s.t==='part'){h+='<div class="part-num">'+s.num+'</div><h2 style="margin-top:14px">'+s.h+'</h2>';}
   else if(s.t==='promise'||s.t==='content'){
     if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
     if(s.big) h+='<p class="big">'+s.big+'</p>';
     if(s.body) h+='<p class="body">'+s.body+'</p>';
   }
   else if(s.t==='who'||s.t==='hook'){
     if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
     if(s.big) h+='<p class="big">'+s.big+'</p>';
     if(s.body) h+='<p class="body">'+s.body+'</p>';
   }
   else if(s.t==='pillars'){
     h+='<h2>'+s.h+'</h2><div class="pillars">';
     s.pillars.forEach(p=>{h+='<div class="pill"><div class="n">'+p.n+'</div><div><div class="t">'+p.t+'</div><div class="d">'+p.d+'</div></div></div>';});
     h+='</div>';
   }
   else if(s.t==='vals'){
     h+='<h2>'+s.h+'</h2><div class="vals">';
     s.vals.forEach(v=>{h+='<div class="val"><h3>'+v.h+'</h3><p>'+v.p+'</p></div>';});
     h+='</div>';
   }
   else if(s.t==='cred'){
     h+='<h2>'+s.h+'</h2><p class="cred">'+s.cred+'</p>';
   }
   else if(s.t==='cta'){
     h+='<h2>'+s.h+'</h2>'+(s.sub?'<p class="sub">'+s.sub+'</p>':'');
     h+='<div><span class="cta-btn">'+s.cta+'</span></div>';
     h+='<p class="disclaimer">'+s.disc+'</p>';
   }
   h+='<div class="foot"><span>Work with Ashley R.</span><span>'+(i+1)+' / '+S.length+'</span></div>';
   el.innerHTML=h;
   d.appendChild(el);
 });
}
render();
</script>
</body>
</html>
