<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grieving the Good Girl — A Live Masterclass with Moun D'Simone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efefe9;        /* her dominant cream ground (brand.json, 8 uses) */
    --panel:#e4e2d9;     /* half-step deeper warm cream */
    --rule:#c9c6ba;      /* muted warm gray hairline */
    --accent:#b30000;    /* her exact dominant red (brand.json, 23 uses) */
    --ink:#1c1a18;       /* warm near-black */
    --muted:#6f6a61;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 24px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:56px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .slide .num{position:absolute;top:22px;right:28px;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .kicker{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:20px}
  h1{font-family:'Gloock',Georgia,serif;font-weight:400;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-family:'Gloock',Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;margin-bottom:20px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:62ch;margin-bottom:14px}
  p.lead{font-size:23px}
  .muted{color:var(--muted)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.45;padding:12px 0 12px 26px;border-top:1px solid var(--rule);position:relative;max-width:64ch}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  li b{font-weight:600}
  .big{font-family:'Gloock',Georgia,serif;font-size:64px;color:var(--accent);line-height:1;margin:6px 0 18px}
  .title-slide{background:var(--panel);align-items:flex-start}
  .title-slide h1{font-size:60px}
  .cta{background:var(--ink);color:var(--bg)}
  .cta h2,.cta h1{color:var(--bg)}
  .cta .kicker{color:#ff6b6b}
  .cta p{color:#e7e4dd}
  .cta .btn{display:inline-block;margin-top:18px;background:var(--accent);color:#fff;font-weight:600;font-size:18px;padding:15px 28px;border-radius:3px;text-decoration:none}
  .disclaimer{font-size:13px;color:#b9b4ab;margin-top:26px;max-width:60ch;line-height:1.5}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .card{background:var(--panel);border-radius:4px;padding:24px}
  .card h3{font-family:'Gloock',Georgia,serif;font-weight:400;font-size:22px;margin-bottom:8px}
  .card p{font-size:16px;margin:0;color:var(--muted)}
  @media(max-width:700px){.slide{padding:36px 26px}h1{font-size:38px}h2{font-size:28px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A Live Masterclass with Moun D’Simone',h:'Grieving the Good Girl',p:'The Dakini path to reclaiming your own authority. Buddhist wisdom, parts work, and the body, for women ready to stop living the life they were taught to want.'},
 {t:'who',kicker:'Who this is for',h:'You have done the work. And you have hit a ceiling.',bullets:['You have read the books, understood your patterns, named your conditioning.','And still your relationships, your creativity, your capacity to receive feel capped.','You keep being the understanding one, the agreeable one, the one who takes care of everyone.','Something in you knows there is a bigger life waiting, and you cannot quite reach it.']},
 {t:'trap',kicker:'The trap',h:'The good girl is running the show.',p:'The woman you were taught to be learned that being loved meant being liked. That belonging meant being good. That being worthy meant being useful, accommodating, and easy to love. What once kept you safe is now quietly deciding how much life you allow yourself to have.'},
 {t:'standard',kicker:'The cost',h:'What the ceiling actually costs',bullets:['The relationships where you keep shrinking to stay easy to love.','The creative work you keep almost starting.','The desires you talk yourself out of before you let them be real.','The years spent waiting for permission that was never going to arrive from the outside.']},
 {t:'reframe',kicker:'The reframe',h:'She does not live in your beliefs. She lives in your body.',p:'This is why insight alone never set you free. The good girl lives in your nervous system, your emotional reflexes, the habitual way you brace and accommodate. You cannot think your way out of a pattern you are living inside your body. You have to meet her somewhere deeper.'},
 {t:'part',kicker:'Part One',h:'Why awareness was never enough',p:'Most personal growth stops at understanding. You learn the origin of a pattern and expect it to dissolve. But a protective part does not leave because you understand it. It leaves when it is met, thanked, and shown there is now a wiser authority inside you who can take the wheel.'},
 {t:'standard',kicker:'Part One',h:'The part that learned to be good was trying to keep you safe.',p:'She is not your enemy. She is the younger self who figured out, often very early, that love had conditions. Grieving her is not getting rid of her. It is thanking her, and gently relieving her of a job she was never meant to carry for the rest of your life.'},
 {t:'part',kicker:'Part Two: The Modern Dakini Method',h:'Five dimensions of one living practice',p:'This is the method I have built over a decade of Tibetan Buddhist study, retreat, and practice. Each dimension opens a doorway. Together they become a way of living.'},
 {t:'cards',kicker:'The Method',h:'How the work actually moves',cards:[
   {h:'Buddhist Wisdom',p:'Study the nature of the mind. Uncover your innate capacity for compassion and your real potential.'},
   {h:'Parts Work',p:'Meet the younger parts and protectors, rewrite the beliefs they carry, and cultivate inner authority.'},
   {h:'The Body',p:'Breath, mantra, and movement. Move beyond the thinking mind to feel, release, and embody.'},
   {h:'Creative Expression',p:'Explore desire, imagination, and pleasure. Open the creative portal that the good girl kept shut.'}
 ]},
 {t:'standard',kicker:'The Method',h:'And none of it is done alone.',p:'Community is the fifth dimension. We heal in the presence of witnesses. To be seen, challenged, and supported is where courage becomes possible, and where the new self gets to practice being real in front of other people.'},
 {t:'standard',kicker:'What a Dakini means',h:'Sky Dancer. Feminine wisdom in motion.',p:'In Tibetan Buddhism the Dakini is the feminine embodiment of enlightened wisdom and transformative energy. She tells the truth. She moves and creates. She does not stay small. For us as modern women she is a fierce example of vulnerability as strength: the courage to stay open, to feel deeply, and to meet life without hiding behind the identities that once kept us safe.'},
 {t:'pillars',kicker:'What holds the work',h:'Three pillars',bullets:['<b>Your life is your art.</b> The grief, the desires, the ordinary days. Your spiritual life is your actual life. They were never separate.','<b>Practice, play, pleasure.</b> Practice is the container. Play, so it does not become another way to be hard on yourself. Pleasure, because you were taught to earn it.','<b>Courage, connection, vulnerability.</b> Courage to look. Connection because we cannot do this alone. Vulnerability because when we are defended, nothing gets in or out.']},
 {t:'part',kicker:'Part Three',h:'What becoming your own permission looks like',p:'You stop waiting to be chosen, understood, or allowed. You feel a want and you let it be real. You disappoint someone and you stay with yourself. You make the thing, say the truth, take up the room. Not because the good girl is gone, but because she is no longer the one deciding.'},
 {t:'standard',kicker:'This season',h:'We grieve who you were taught to be.',p:'In this masterclass we make space to grieve the good girl: to honor everything she did to protect you, everything she helped you survive, and everything you no longer need to carry into another year. You do not have to bring the same woman forward simply because she is the one you have always known how to be.'},
 {t:'standard',kicker:'What you leave with',h:'By the end of our hour together',bullets:['A clear felt sense of where the good girl still runs your choices.','One parts-work practice you can return to on your own, any time the old pattern grips.','A first taste of your own authority: what it feels like in the body to choose from it.','Language for the grief, so changing no longer feels like betrayal.']},
 {t:'why',kicker:'Why me',h:'I am Moun.',p:'Brazilian-born Buddhist practitioner and practical mystic. I have studied Tibetan Buddhism through extended retreats in India and Nepal, trained in contemplative psychotherapy, and taught women around the world since 2016 through retreats, courses, and private mentorship. From those years I built the Modern Dakini Method and, in 2023, The Dakini House: a global community of women coming home to themselves.'},
 {t:'cta',kicker:'Your next step',h:'Come all the way home to yourself.',p:'If this is the work you are here for, there are two ways to go deeper with me. The Dakini House, our ongoing monthly practice and community, or private coaching for the woman ready to do this work one to one.',btn:'Work with Moun',disc:'This masterclass is for education and personal growth. It is not therapy or medical advice. No specific result is guaranteed. Results vary and depend on your own practice and circumstances.'}
];
const d=document.getElementById('deck');
S.forEach((s,i)=>{
 const el=document.createElement('section');
 el.className='slide'+(s.t==='title'?' title-slide':'')+(s.t==='cta'?' cta':'');
 let html='<div class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</div>';
 if(s.kicker)html+='<div class="kicker">'+s.kicker+'</div>';
 if(s.t==='title')html+='<h1>'+s.h+'</h1>';else html+='<h2>'+s.h+'</h2>';
 if(s.p)html+='<p class="lead">'+s.p+'</p>';
 if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul>';}
 if(s.cards){html+='<div class="two">';s.cards.forEach(c=>html+='<div class="card"><h3>'+c.h+'</h3><p>'+c.p+'</p></div>');html+='</div>';}
 if(s.btn)html+='<a class="btn" href="#">'+s.btn+'</a>';
 if(s.disc)html+='<p class="disclaimer">'+s.disc+'</p>';
 el.innerHTML=html;
 d.appendChild(el);
});
</script>
</body>
</html>
