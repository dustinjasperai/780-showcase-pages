<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 90-Day Freedom Method — Goldbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505;        /* near-black ground, from site #000000 */
    --panel:#17130b;     /* warm-dark panel, derived from bronze #7f4e15 */
    --rule:#2a2118;      /* warm rule */
    --accent:#dbb65b;    /* the Goldbar gold (site CSS, ranked #2) */
    --accent-deep:#7f4e15;/* secondary bronze (site CSS) */
    --ink:#f4efe6;       /* warm off-white text */
    --muted:#b8ab93;     /* muted warm grey-gold */
    --display:'Oswald',system-ui,sans-serif;
    --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    position:relative;background:linear-gradient(160deg,#0a0806 0%,var(--bg) 60%);
    border:1px solid var(--rule);border-radius:14px;
    min-height:560px;margin:0 0 26px;padding:56px 60px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:60px;top:52px;width:64px;height:6px;
    background:var(--accent);border-radius:2px;box-shadow:0 0 0 1px var(--accent-deep)}
  .kicker{font-family:var(--display);text-transform:uppercase;letter-spacing:.22em;
    font-weight:600;font-size:13px;color:var(--accent);margin:26px 0 20px}
  h1{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.03;
    letter-spacing:.005em;color:var(--ink);text-transform:uppercase}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.08;
    color:var(--ink);text-transform:uppercase;letter-spacing:.01em}
  .lede{font-size:21px;line-height:1.5;color:var(--muted);margin-top:20px;max-width:44ch}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);margin-top:16px;max-width:52ch}
  ul{margin:22px 0 0 0;list-style:none}
  li{position:relative;padding-left:30px;margin:14px 0;font-size:19px;line-height:1.5;color:var(--ink);max-width:54ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:16px;height:5px;background:var(--accent);border-radius:2px}
  .pillar{font-family:var(--display);text-transform:uppercase;color:var(--accent);font-weight:600;font-size:15px;letter-spacing:.14em}
  .num{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent-deep)}
  .foot{position:absolute;right:26px;bottom:20px;font-family:var(--display);font-size:12px;
    letter-spacing:.18em;color:var(--accent-deep);text-transform:uppercase}
  .brand{position:absolute;left:60px;bottom:22px;font-family:var(--display);font-weight:600;
    font-size:13px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
  .disc{font-size:14px;line-height:1.55;color:var(--muted);margin-top:26px;max-width:60ch}
  .cta-btn{display:inline-block;margin-top:26px;font-family:var(--display);font-weight:600;
    text-transform:uppercase;letter-spacing:.12em;font-size:17px;color:#120d04;background:var(--accent);
    padding:15px 30px;border-radius:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:26px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px 24px}
  .card h3{font-family:var(--display);text-transform:uppercase;font-size:19px;color:var(--accent);letter-spacing:.04em;margin-bottom:8px}
  .card p{font-size:16px;line-height:1.5;color:var(--muted)}
  @media(max-width:720px){.slide{padding:40px 28px;min-height:440px}h1{font-size:38px}h2{font-size:28px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', html:`
    <div class="kicker">A Goldbar Masterclass with Juan Barreneche</div>
    <h1>The 90-Day<br>Freedom Method</h1>
    <p class="lede">How working real estate agents build a listing business that runs on systems and delegation, so it produces listings without running your life.</p>
    <span class="brand">Goldbar</span><span class="foot">Live Masterclass</span>`},
  {t:'who', html:`
    <div class="kicker">Who this is for</div>
    <h2>You are already good at this. You are just doing all of it yourself.</h2>
    <p class="body">This is for the agent who is closing deals, hitting real numbers, and quietly running out of hours. You are the lead generator, the showing agent, the transaction coordinator, the marketer, and the person who answers every text at 9pm.</p>
    <p class="body">More business does not feel like a win anymore. It feels like more nights and weekends gone.</p>
    <span class="brand">Goldbar</span><span class="foot">01</span>`},
  {t:'trap', html:`
    <div class="kicker">The trap</div>
    <h2>"Just get more leads" is the advice that keeps you stuck.</h2>
    <p class="body">Every course, every coach, every guru sells you the same thing: another lead source. So you buy more leads, make more calls, and take on more clients.</p>
    <p class="body">And the busier you get, the more the whole business depends on you being available every single day. You did not build a business. You built a job that owns you.</p>
    <span class="brand">Goldbar</span><span class="foot">02</span>`},
  {t:'reframe', html:`
    <div class="kicker">The reframe</div>
    <h1 style="font-size:46px">You do not have a lead problem. You have a systems and delegation problem.</h1>
    <p class="lede">The top producers are not working more hours than you. They have built a listing engine that runs on repeatable systems and a trained team, so the machine keeps producing whether or not they are in the room.</p>
    <span class="brand">Goldbar</span><span class="foot">03</span>`},
  {t:'p1head', html:`
    <div class="kicker"><span class="num">Part One</span></div>
    <h1>Why the hustle<br>caps out.</h1>
    <span class="brand">Goldbar</span><span class="foot">04</span>`},
  {t:'plateau', html:`
    <div class="kicker">The plateau</div>
    <h2>There is a hard ceiling on what one person can carry.</h2>
    <p class="body">Every agent hits it. You can only make so many calls, run so many appointments, and coordinate so many files before the day runs out. Adding more leads past that point does not add income. It adds chaos and dropped balls.</p>
    <ul>
      <li>Your income is capped by your personal capacity, not your market.</li>
      <li>Admin work eats the hours that should go to listing appointments.</li>
      <li>Growth makes it worse, because there is more to hold and still only one of you.</li>
    </ul>
    <span class="brand">Goldbar</span><span class="foot">05</span>`},
  {t:'truth', html:`
    <div class="kicker">The uncomfortable truth</div>
    <h2>Working harder is why you are stuck, not the way out of it.</h2>
    <p class="body">The plateau is not a motivation problem you can grind through. It is a structural one. The only way past your own capacity is to stop being the whole business, and start building one that produces without you touching every piece.</p>
    <span class="brand">Goldbar</span><span class="foot">06</span>`},
  {t:'p2head', html:`
    <div class="kicker"><span class="num">Part Two</span></div>
    <h1>The Freedom Method:<br>four pillars.</h1>
    <p class="lede">This is the exact structure behind a real estate business that generates listings on systems and delegation instead of raw hours.</p>
    <span class="brand">Goldbar</span><span class="foot">07</span>`},
  {t:'pillar1', html:`
    <div class="pillar">Pillar One</div>
    <h2>A Listing Acquisition System</h2>
    <p class="body">A predictable, repeatable engine for seller listings, built on proven prospecting, FSBO and expired scripts, and disciplined follow-up. Not one hot lead source that dries up, but a system that puts listing appointments on the calendar every single week.</p>
    <ul>
      <li>Know exactly where next week's listing appointments come from.</li>
      <li>Scripts and follow-up that convert conversations into signed listings.</li>
      <li>Listings, not just buyer leads, so you own the inventory in your market.</li>
    </ul>
    <span class="brand">Goldbar</span><span class="foot">08</span>`},
  {t:'pillar2', html:`
    <div class="pillar">Pillar Two</div>
    <h2>Time-Saving Systems</h2>
    <p class="body">Turn the repeatable parts of your business into documented, handoff-ready processes: lead follow-up, transaction coordination, listing launches, and client care. Once a task is a system, it no longer needs to live in your head or on your calendar.</p>
    <ul>
      <li>Every recurring task written down as a process someone else can run.</li>
      <li>Your operations keep moving when you are in an appointment or off.</li>
      <li>Your time freed up for the two things only you can do: list and close.</li>
    </ul>
    <span class="brand">Goldbar</span><span class="foot">09</span>`},
  {t:'pillar3', html:`
    <div class="pillar">Pillar Three</div>
    <h2>The Virtual Executive Assistant</h2>
    <p class="body">Delegation is where freedom becomes real. A trained virtual executive assistant takes the admin, the coordination, and the follow-up off your plate, so your hours go back to listing appointments and closings. This is how a solo agent starts operating like a team.</p>
    <ul>
      <li>Hand off the paperwork and coordination that never grew your income.</li>
      <li>A trained assistant running your systems, not just extra hands.</li>
      <li>You become the agent, not the agent plus the whole back office.</li>
    </ul>
    <span class="brand">Goldbar</span><span class="foot">10</span>`},
  {t:'pillar4', html:`
    <div class="pillar">Pillar Four</div>
    <h2>The Mindset to Let Go</h2>
    <p class="body">The hardest part of scaling is not the systems. It is trusting them, and trusting your team, enough to step out of the daily grind. Breaking the income plateau means breaking the belief that everything only works when you do it yourself.</p>
    <ul>
      <li>Move from doing every task to owning the outcome.</li>
      <li>Build the confidence to take bold action instead of staying safe and busy.</li>
      <li>Lead a business instead of being consumed by one.</li>
    </ul>
    <span class="brand">Goldbar</span><span class="foot">11</span>`},
  {t:'stack', html:`
    <div class="kicker">How the pillars stack</div>
    <h2>Each pillar frees the next.</h2>
    <div class="two">
      <div class="card"><h3>System</h3><p>The listing engine creates predictable demand.</p></div>
      <div class="card"><h3>Process</h3><p>Time-saving systems make that demand repeatable without you.</p></div>
      <div class="card"><h3>Delegation</h3><p>A trained assistant runs the processes day to day.</p></div>
      <div class="card"><h3>Freedom</h3><p>You spend your hours listing and closing, or not at all.</p></div>
    </div>
    <span class="brand">Goldbar</span><span class="foot">12</span>`},
  {t:'p3head', html:`
    <div class="kicker"><span class="num">Part Three</span></div>
    <h1>What freedom<br>actually looks like.</h1>
    <span class="brand">Goldbar</span><span class="foot">13</span>`},
  {t:'week', html:`
    <div class="kicker">A week in a freedom-based business</div>
    <h2>Your calendar changes shape.</h2>
    <ul>
      <li>Mornings are listing appointments and dollar-productive conversations, not inbox triage.</li>
      <li>Your assistant runs follow-up, coordination, and the launch checklist in the background.</li>
      <li>The pipeline fills whether you worked a full day or took your kid to practice.</li>
      <li>You can take a week off and come back to a business that kept producing.</li>
    </ul>
    <span class="brand">Goldbar</span><span class="foot">14</span>`},
  {t:'numbers', html:`
    <div class="kicker">Why it compounds</div>
    <h2>Freedom is not the opposite of growth. It is what unlocks it.</h2>
    <p class="body">When you are no longer the bottleneck, the ceiling moves. The same agent who was maxed out at their personal capacity can carry far more listings once the systems and the assistant are holding the weight. Scale stops costing you your life.</p>
    <span class="brand">Goldbar</span><span class="foot">15</span>`},
  {t:'whyme', html:`
    <div class="kicker">Why listen to me on this</div>
    <h2>I built my whole business this way.</h2>
    <p class="body">I am Juan Barreneche. I closed over three hundred million dollars in real estate and built a seven-figure production team, running it fully virtually from home. Today I lead a cloud-based brokerage of more than a thousand agents, and I teach this same freedom model to a community of over ten thousand real estate professionals through Goldbar.</p>
    <p class="body">I am not teaching theory. This is the exact structure that let me scale without being chained to the business, and it is what Goldbar is built to install for you.</p>
    <span class="brand">Goldbar</span><span class="foot">16</span>`},
  {t:'recap', html:`
    <div class="kicker">The whole thing in one place</div>
    <h2>The 90-Day Freedom Method</h2>
    <ul>
      <li>A Listing Acquisition System that fills your calendar with seller appointments.</li>
      <li>Time-Saving Systems that turn your business into repeatable processes.</li>
      <li>A trained Virtual Executive Assistant who runs those processes for you.</li>
      <li>The mindset to let go, so you lead the business instead of carrying it.</li>
    </ul>
    <p class="body">Systems and delegation, not more hours. That is the whole method.</p>
    <span class="brand">Goldbar</span><span class="foot">17</span>`},
  {t:'cta', html:`
    <div class="kicker">Your next step</div>
    <h1 style="font-size:44px">Come build your freedom<br>model with us.</h1>
    <p class="lede">Goldbar is the community, coaching, and systems that install the 90-Day Freedom Method in your business, alongside more than ten thousand agents doing the same. Join us and start turning your business into one that runs without you.</p>
    <a class="cta-btn" href="https://goldbarcoaching.com/">Join the Goldbar Community</a>
    <p class="disc">Educational content only. No income or result is guaranteed. Results vary and depend on your market, your effort, your license status, and factors outside anyone's control. Juan Barreneche and Goldbar make no promise of earnings.</p>
    <span class="brand">Goldbar</span><span class="foot">18</span>`}
];

const deck=document.getElementById('deck');
S.forEach(s=>{const d=document.createElement('div');d.className='slide';d.innerHTML=s.html;deck.appendChild(d)});
</script>
</body>
</html>
