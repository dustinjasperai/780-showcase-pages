<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Radical Practice · Krista Dicks, RMT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f3ec; --panel:#efe7da; --rule:#e3d9c9;
    --acc:#e8583c; --ink:#241f1d; --body:#4b453e; --dim:#8c8378; --cream:#f6efe4;
  }
  html,body{height:100%}
  body{background:#ece3d4;font-family:'Manrope',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ece3d4}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Manrope',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Spectral',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.13;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:94%;font-weight:600}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Manrope',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:75%;line-height:1.64;font-weight:400}
  .sub{font-family:'Spectral',serif;font-size:2.05vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:400;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Manrope',sans-serif;font-size:1.05vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#2a2521 0%,#191512 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2a2521 0%,#191512 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Manrope',sans-serif;color:#e8ddca;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .anc-motif{position:absolute;pointer-events:none}
  .title-anc{right:7.5%;bottom:8%;width:15vw;opacity:.92}
  .corner-anc{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Manrope',sans-serif;font-size:1.12vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(36,31,29,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Radical RMT</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: an anchor drawn as a steady line, in coral - "the anchor, not the cage" -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="anc" viewBox="0 0 120 120">
  <g fill="none" stroke="#e8583c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="24" r="8" opacity="0.9"/>
    <path d="M60 32 V96" opacity="0.9"/>
    <path d="M38 50 H82" opacity="0.85"/>
    <path d="M24 78 A36 36 0 0 0 96 78" opacity="0.9"/>
    <path d="M24 78 l-7 -3 M24 78 l3 8" opacity="0.7"/>
    <path d="M96 78 l7 -3 M96 78 l-3 8" opacity="0.7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Radical Practice',sub:'How massage therapists build a career that pays for real freedom, flexibility, and a life on their own terms, without burning out to get there.',brand:true,anc:'title'},
 {t:'normal',k:'Who this is for',title:'You are booked. You are respected. And you are quietly exhausted.',body:'You are a skilled therapist and the calendar stays full. But full is the only setting you have. Time off costs income, every raise means more hours on the table, and the freedom you got into this career for keeps getting pushed to next year. The schedule stopped being yours a while ago.'},
 {t:'dark',title:'A full schedule is not the same as a free life.'},

 {t:'section',idx:'Part One',title:'Why a Full Table Stops Feeling Like Success'},
 {t:'normal',k:'The technician trap',title:'You did not leave a boss to be run by a booking calendar.',body:'When you own your work but sell it one hour at a time, the calendar becomes the boss. It decides when you rest, when you can travel, and how much a sick week hurts. You are the business, so nothing moves unless your hands are moving, and that is a quiet kind of trapped.'},
 {t:'normal',k:'The one lever',title:'More hours is the only growth lever you have, and it has a ceiling.',body:'Trading time for money means the only way up is more time. But there is a hard limit, and it is your own body. The exact tool your whole income depends on is the one thing burnout takes first. A practice built only on your hours is a practice with a countdown on it.'},
 {t:'dark',title:'Your career is not a cage. It is an anchor.'},

 {t:'section',idx:'Part Two',title:'Building a Practice Designed for Freedom'},
 {t:'normal',k:'The mindset shifts',title:'Freedom starts as a decision, before it is ever a schedule.',body:'This is the heart of the 5 mindset shifts that changed my own practice. You stop seeing yourself as a set of hands for hire and start seeing yourself as the owner of your time, your rates, and your energy. Nothing about the business changes until that belief does. Every practical move below runs on this shift.'},
 {t:'normal',k:'Design your capacity',title:'Decide what the practice is allowed to ask of you, on purpose.',body:'Left alone, a practice will happily take everything you have. So you set it by design: the hours, the recovery, and the point where growth comes from systems, delegation, or a raise instead of another hour on the table. This is how you take back control before the business becomes the boss.'},
 {t:'normal',k:'Charge for the value, not the hour',title:'The experience is what lets you earn more without working more.',body:'Clients do not remember the technique. They remember how the whole visit made them feel, and unreasonable hospitality is what turns a good treatment into a client who stays for years and refers everyone they know. How you show up, look, and care for people is what lets you hold your rate without discounting your time.'},
 {t:'normal',k:'Visibility on your terms',title:'Get known without giving your time and energy away for free.',body:'You do not grow by handing out ten minutes of free chair massage until you are drained. You grow by becoming visible on your own terms, protecting your time, your energy, and your expertise while the right clients come to you. Reach that fills the calendar you actually want, not just any calendar.'},
 {t:'dark',title:'Freedom is not fewer clients. It is a practice you built on purpose.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Practice Serves the Life'},
 {t:'normal',k:'The therapist this builds',title:'The same career, pointed at freedom, flexibility, financial success, and fun.',body:'When the practice is designed instead of just endured, a week off stops costing you sleep, a raise does not mean more hours, and the income finally funds the life you started this for. You keep the work you love and the clients who value you, and the career becomes the anchor that holds the life, not the cage that runs it.'},
 {t:'dark',title:'The goal was never a fuller table. It was a life your career actually pays for.'},
 {t:'normal',k:'Why Krista',title:'A working RMT and clinic owner who rebuilt her own practice around freedom.',body:'Krista Dicks has been a Registered Massage Therapist since 2006 and a clinic owner, and she now mentors massage therapists on building sustainable, freedom filled practices. She hosts The Radical Massage Therapist Podcast, more than 160 episodes of real strategies from therapists around the world. This is the thinking behind all of it.'},

 {t:'section',idx:'Your Next Step',title:'Build the Practice on Your Own Terms'},
 {t:'normal',k:'Keep going with Krista',title:'Start with the shift, then build the practice around it.',body:'The 5 Mindset Shifts That Changed My Practice is the free first step, the beliefs that move you from booked and tired to designed and free. From there, Krista mentors therapists through building the whole thing, so your career becomes the vehicle and freedom is the destination.'},
 {t:'cta',title:'Ready to build a practice that gives you your life back?',body:'Take the next step with The Radical RMT.',chips:['Get the 5 Mindset Shifts','Work with Krista'],disc:'Educational content for practicing and aspiring massage therapists. No income or business result is guaranteed. Results vary by therapist, practice, and market.'},
];

const deck=document.getElementById('deck');
function anc(kind){return `<svg class="anc-motif ${kind==='title'?'title-anc':'corner-anc'}"><use href="#anc"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Radical <b>RMT</b> · Krista Dicks, RMT</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.anc) h+=anc(s.anc);
  else if(s.t==='title') h+=anc('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
