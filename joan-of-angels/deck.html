<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Next Right Move — a live masterclass with Joan of Angels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000321;        /* midnight navy — her deep blue (brand.json) */
    --panel:#0a0b22;     /* lifted ground */
    --rule:#2a2c45;      /* muted navy-violet hairline */
    --accent:#d4af37;    /* starlight gold — her link/button color */
    --ink:#f6f3ec;       /* warm ivory */
    --muted:#b8bdd4;     /* soft periwinkle for secondary text */
    --display:"Cormorant Garamond",Georgia,serif;
    --text:"Libre Franklin",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:linear-gradient(180deg,var(--panel),#05061a);border:1px solid var(--rule);
    border-radius:16px;padding:54px 50px;margin:0 0 20px;min-height:430px;display:flex;
    flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;right:34px;top:30px;width:5px;height:5px;border-radius:50%;
    background:var(--accent);box-shadow:34px 10px 0 -1px var(--accent),-18px 46px 0 -2px var(--accent),
    58px 54px 0 -2px rgba(212,175,55,.6);opacity:.65}
  .kicker{font-family:var(--text);text-transform:uppercase;letter-spacing:.28em;font-size:12px;
    font-weight:600;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.04;letter-spacing:.3px}
  h2{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.1;margin-bottom:14px}
  .lede{font-family:var(--display);font-size:27px;line-height:1.4;color:var(--ink);font-weight:500}
  p{font-size:18px;line-height:1.65;color:var(--muted);max-width:62ch;margin-top:14px}
  .big{font-size:21px;color:var(--ink)}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px;max-width:66ch}
  li{font-size:18px;line-height:1.5;color:var(--ink);padding-left:30px;position:relative}
  li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;
    background:var(--accent)}
  li b{font-family:var(--display);font-weight:600;font-size:21px;color:var(--ink)}
  .step{font-family:var(--display);color:var(--accent);font-size:20px;letter-spacing:.1em}
  .rule{height:1px;background:var(--rule);margin:26px 0;max-width:120px}
  .foot{font-family:var(--text);font-size:13px;letter-spacing:.04em;color:var(--muted);
    position:absolute;left:50px;bottom:26px;opacity:.8}
  .cta h2{font-size:48px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:70ch;line-height:1.6;opacity:.85}
  .brand{font-family:var(--display);color:var(--accent);font-size:22px}
  @media(max-width:620px){.slide{padding:40px 26px}h1{font-size:40px}h2{font-size:30px}.lede{font-size:22px}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kicker">A live masterclass with Joan of Angels</div>
    <h1>Your Next Right Move</h1>
    <p class="lede">How to find your answer from the inside out, when you are standing at a crossroads and every option looks reasonable.</p>
    <div class="foot">Soul Vision mentoring</div>`},

  {t:'who', html:`
    <div class="kicker">Who this is for</div>
    <h2>The woman who did everything right</h2>
    <p class="big">You built a life that looks good on paper. You are thoughtful, capable, spiritually aware. And still, at this threshold, you feel lost.</p>
    <ul>
      <li>A relationship, a career, or a chapter is quietly ending.</li>
      <li>You have made good decisions before, yet this one will not come.</li>
      <li>You are tired of asking everyone but yourself.</li>
    </ul>`},

  {t:'trap', html:`
    <div class="kicker">The trap</div>
    <h2>So you push harder</h2>
    <p class="big">More research. More advice. More lists of pros and cons. You try to think your way to the answer, the way you were taught to.</p>
    <p>And the harder you push, the quieter the one voice that actually knows gets.</p>`},

  {t:'reframe', html:`
    <div class="kicker">A different way to see it</div>
    <h2>The answer is not missing. It is drowned out.</h2>
    <p class="lede">Clarity does not arrive by searching harder on the outside. It arrives when you slow down, reconnect with your inner wisdom, and remember who you truly are.</p>`},

  {t:'part', html:`<div class="step">Part One</div><h2>Why thinking harder keeps you stuck</h2>
    <p class="big">Analysis is a wonderful tool for problems that live in the mind. A true crossroads does not.</p>`},

  {t:'body', html:`
    <div class="kicker">The core problem</div>
    <h2>You overrode your signal to get here</h2>
    <p class="big">Most capable women have spent years learning to override the inner no and the quiet yes in order to perform, provide, and keep the peace.</p>
    <p>That skill built your life. It is also exactly why, at the moment that matters most, your own knowing feels out of reach. The work is not to find a new answer. It is to become able to hear the one already in you.</p>`},

  {t:'part', html:`<div class="step">Part Two</div><h2>The Soul Vision Clarity Shift</h2>
    <p class="lede">A four-step practice, not a lecture. Something you do, in your body, that you can return to every time the noise gets loud again.</p>`},

  {t:'step', html:`<div class="step">Step one</div><h2>Reconnect</h2>
    <p class="big">Come out of the racing mind and back into the body. Slow the nervous system down enough that something other than fear can speak.</p>
    <p>This is where 45 years of clinical and somatic work meets the intuitive. The body is not a distraction from the decision. It is the instrument.</p>`},

  {t:'step', html:`<div class="step">Step two</div><h2>Listen</h2>
    <p class="big">Learn to tell a true inner signal from old conditioning and fear wearing its voice.</p>
    <ul>
      <li>Fear is loud, urgent, and contracts you.</li>
      <li>Your soul signal is quiet, steady, and opens you.</li>
      <li>Once you feel the difference, you cannot unfeel it.</li>
    </ul>`},

  {t:'step', html:`<div class="step">Step three</div><h2>Find the one true signal</h2>
    <p class="big">Out of the dozen voices, there is one thread that is actually yours. We locate it and let the rest go quiet.</p>
    <p>This is the shift from being overwhelmed by every option to being guided by one.</p>`},

  {t:'step', html:`<div class="step">Step four</div><h2>Take one next step</h2>
    <p class="big">Not the whole staircase. One clear, soul-aligned next step you can take this week, and a body that feels lighter for having chosen it.</p>`},

  {t:'practice', html:`
    <div class="kicker">Why a practice and not a plan</div>
    <h2>Something you keep</h2>
    <p class="big">A plan is good until the next hard moment. A practice is yours for life. You will leave this hour able to run the Clarity Shift yourself, any time you are at a threshold again.</p>`},

  {t:'part', html:`<div class="step">Part Three</div><h2>After the Shift, who you become</h2>`},

  {t:'after', html:`
    <div class="kicker">The woman who walks out</div>
    <ul>
      <li><b>She stops outsourcing her life.</b> The decision comes from her own knowing, not the loudest advisor.</li>
      <li><b>She moves with less noise.</b> One clear direction instead of twelve open tabs.</li>
      <li><b>She trusts herself again.</b> The relationship, the work, the next chapter, chosen on purpose.</li>
    </ul>`},

  {t:'why', html:`
    <div class="kicker">Why me</div>
    <h2>I rebuilt from nothing, then learned how</h2>
    <p class="big">I am Joan. A Doctor of Chiropractic and a licensed counselor, 45 years guiding women through transitions.</p>
    <p>In 1998, as a single mother, I lost my home, my practice, and my car. Every night my children and I held a vision of what was possible when there was no evidence for it. I called it the Miracle Mastermind. That is where this work was forged, and it is why I teach clarity as a practice of the body and the soul, not a trick of the mind.</p>`},

  {t:'bridge', html:`
    <div class="kicker">Clarity · Alignment · Expect Miracles</div>
    <h2>Becoming takes time</h2>
    <p class="big">The masterclass gives you the shift. For the woman ready to reinvent the whole chapter, there is a deeper path, the Become Her reinvention mentorship, where we do this work privately over six months.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next right move</div>
    <h2>Begin with a Soul Vision Discovery Session</h2>
    <p class="big">A complimentary, unhurried conversation. We find where you are at the crossroads and the first thread of your Soul Vision for what is next.</p>
    <div class="rule"></div>
    <p class="brand">Joan of Angels</p>
    <p class="disc">Educational content only. Nothing here is medical, psychological, financial, or legal advice. No outcome, income, or result is guaranteed; results vary from woman to woman. Participation is a personal choice and your decisions remain your own.</p>`}
];
const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls||'');
  el.innerHTML = s.html;
  deck.appendChild(el);
}
</script>
</body>
</html>
