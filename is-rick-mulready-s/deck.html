<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Constraint-First AI Playbook — Rick Mulready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eff3f8;      /* his cool light ground, from #e3e8ee / #f7f9fb */
    --panel:#ffffff;
    --ink:#141a22;     /* derived from his dark #0f1722 */
    --muted:#5c6673;
    --rule:#dde4ec;    /* cool light rule, from #e3e8ee */
    --accent:#ff8000;  /* his brand orange */
    --display:'Geist',system-ui,sans-serif;
    --mono:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:22px 0;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);opacity:.9}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);font-weight:500;margin-bottom:18px}
  h1{font-size:46px;line-height:1.05;font-weight:700;letter-spacing:-.02em;margin-bottom:18px}
  h2{font-size:34px;line-height:1.12;font-weight:600;letter-spacing:-.01em;margin-bottom:16px}
  .sub{font-size:20px;line-height:1.5;color:var(--muted);font-weight:400;max-width:62ch}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);max-width:62ch;margin-top:10px}
  .part{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  ul{margin-top:18px;max-width:60ch}
  li{font-size:19px;line-height:1.5;margin:12px 0;list-style:none;padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .step-no{font-family:var(--mono);font-size:14px;color:var(--accent);font-weight:500;margin-bottom:8px}
  .valve{display:flex;align-items:center;gap:8px;margin-top:26px}
  .valve span{height:8px;background:var(--rule);border-radius:4px}
  .valve .a{flex:6} .valve .b{flex:3} .valve .c{flex:1;background:var(--accent)}
  .foot{position:absolute;bottom:18px;left:56px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
  .disclaimer{font-size:14px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:60ch}
  .cta-step{font-size:22px;font-weight:600;margin-top:14px}
  @media(max-width:640px){.slide{padding:36px 28px}h1{font-size:34px}h2{font-size:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Rick Mulready',h:'The Constraint-First AI Playbook',sub:'How to find the one bottleneck holding your business back, and build AI only where it pays for itself.',valve:true},
  {t:'who',eyebrow:'Who this is for',h:'You already have an offer and sales.',sub:'This is for coaches, consultants and course creators with real revenue who are drowning in AI tools and somehow busier than ever. Not beginners. Operators.'},
  {t:'trap',eyebrow:'The trap',h:'You bought the tools. You are still the bottleneck.',body:'You are the owner, the marketer and the fire department. Every new tool promised to buy back time. Most of them just added one more tab to check.'},
  {t:'hook',eyebrow:'The reframe',h:'More AI is not the answer.',sub:'The right AI, in one place, pointed at the one thing limiting your growth, is. And sometimes the answer is no AI at all.'},
  {t:'part',part:'Part one',h:'Why "AI-first" keeps you stuck.'},
  {t:'content',eyebrow:'The pattern',h:'Adding tools never removes a constraint.',body:'Stacking tools on top of a business that has a sales problem, or a delivery problem, or a pricing problem, does not fix the problem. It hides it under more work and a bigger subscription bill.'},
  {t:'content',eyebrow:'The right question',h:'Stop asking what AI can do.',body:'Start asking what one thing is limiting growth right now. The answer points at exactly one place to act. Everything else is a distraction dressed up as progress.'},
  {t:'part',part:'Part two',h:'The Constraint First method.'},
  {t:'step',n:'Step 1',h:'Find the constraint.',body:'Identify the single bottleneck limiting growth, backed by real numbers. Not a feeling. One place where the business is actually stuck.'},
  {t:'step',n:'Step 2',h:'Pick the Growth Play.',body:'Choose the business move that removes that constraint. Optimize what you already have before you build anything new. The play comes before the tool.'},
  {t:'step',n:'Step 3',h:'Build the AI, if it helps.',body:'Implement AI only where it removes the constraint, so it pays for itself. Sometimes the answer is no AI at all, and that is a win, not a failure.'},
  {t:'step',n:'Step 4',h:'Measure.',body:'Check whether the number you targeted actually moved. If it did not, the play or the build was wrong, and that is useful information you act on fast.'},
  {t:'step',n:'Step 5',h:'Decide.',body:'Move to the next constraint, or troubleshoot the step that underperformed. The loop repeats. The business keeps getting unstuck, one bottleneck at a time.'},
  {t:'content',eyebrow:'The library',h:'Growth Plays.',body:'Over time the moves become a library of repeatable plays across marketing, sales and operations, so you are never staring at a blank page wondering where to point AI next.'},
  {t:'part',part:'Part three',h:'From owner to CEO.'},
  {t:'content',eyebrow:'The operating system',h:'A human-first, AI-powered operating system.',body:'When this is built, AI stops being that thing you sometimes remember to use and becomes your default operating system. It handles the work you do not want to do, so you stay in your zone of genius. Most owners build the first version in about 30 days.'},
  {t:'content',eyebrow:'The outcome',h:'Still the owner. Finally the CEO.',body:'You move out of being the marketer and the fire department, and back into the one seat only you can fill. The business runs on a system instead of on your adrenaline.'},
  {t:'why',eyebrow:'Why me',h:'Rick Mulready.',body:'I built and sold a seven-figure online business and a podcast with more than 12 million downloads. Today I show more than 14,000 coaches, consultants and service providers every week how to use AI to work less and profit more, and I do it inside real businesses, not slide decks.'},
  {t:'cta',eyebrow:'Your next step',h:'Want this built with you?',cta:'Apply to Unlimited, private 1:1 Business and AI coaching, and we will find your constraint and build the system around it together.',disclaimer:'This masterclass is educational. It shares frameworks and examples, not guarantees. Results depend on your business, your market and the work you put in. Nothing here is a promise of income or specific results.'}
];
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');d.className='slide';
  let html='';
  if(s.part) html+=`<div class="part">${s.part}</div>`;
  if(s.eyebrow) html+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.n) html+=`<div class="step-no">${s.n}</div>`;
  if(s.h) html+=`<h1>${s.h}</h1>`;
  if(s.sub) html+=`<div class="sub">${s.sub}</div>`;
  if(s.body) html+=`<p class="body">${s.body}</p>`;
  if(s.cta) html+=`<div class="cta-step">${s.cta}</div>`;
  if(s.disclaimer) html+=`<div class="disclaimer">${s.disclaimer}</div>`;
  if(s.valve) html+=`<div class="valve"><span class="a"></span><span class="b"></span><span class="c"></span></div>`;
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
