<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create &amp; Sell Your First Digital Therapy Offer — The Freedom Therapist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#221812;        /* her dark warm scheme ground */
    --panel:#2e211a;     /* one step up for cards */
    --ink:#fff2df;       /* her dominant cream (ranked_colors) */
    --muted:#c9b7a6;     /* desaturated cream for secondary text */
    --accent:#f25d1a;    /* her burnt orange (ranked_colors), verbatim */
    --rule:rgba(255,242,223,0.16);
    --serif:'DM Serif Display',Georgia,serif;
    --sans:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
  #deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:52px 48px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .num{position:absolute;top:22px;right:30px;font-size:13px;letter-spacing:.18em;color:var(--muted);font-weight:500}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5.2vw,60px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,44px);line-height:1.08;letter-spacing:-.01em}
  .lede{font-size:clamp(18px,2.1vw,23px);color:var(--muted);margin-top:22px;max-width:36ch}
  .big{font-family:var(--serif);font-size:clamp(30px,4.4vw,50px);line-height:1.12}
  .big .hl{color:var(--accent)}
  p.body{font-size:clamp(16px,1.8vw,19px);margin-top:16px;max-width:52ch;color:var(--ink)}
  p.body.muted{color:var(--muted)}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px}
  ul.two{grid-template-columns:1fr 1fr}
  li{font-size:clamp(15px,1.7vw,18px);padding-left:26px;position:relative;color:var(--ink);max-width:46ch}
  li::before{content:"";position:absolute;left:0;top:.62em;width:11px;height:11px;border-radius:3px;background:var(--accent)}
  .pillar-k{font-family:var(--serif);color:var(--accent);font-size:clamp(22px,3vw,30px);margin-bottom:10px}
  .step{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:14px}
  .rule{height:1px;background:var(--rule);margin:26px 0;width:90px}
  .cta h2{margin-bottom:10px}
  .btn{display:inline-block;margin-top:26px;background:var(--accent);color:#1a120d;font-weight:700;font-size:17px;padding:15px 30px;border-radius:999px;text-decoration:none;letter-spacing:.01em}
  .disclaimer{margin-top:30px;font-size:12.5px;color:var(--muted);max-width:60ch;line-height:1.5}
  .kicker{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:clamp(18px,2.2vw,24px);margin-top:18px}
  @media(max-width:620px){.slide{padding:38px 26px;min-height:380px}ul.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass with Mia Poklepovich',
   h1:'Create &amp; Sell Your First Digital Therapy Offer',
   lede:'Turn the clinical knowledge you already have into one simple, sellable offer, created and priced live.'},

  {t:'who', eyebrow:'Who this is for',
   h2:'You are good at what you do. You are also doing all of it yourself.',
   body:'Therapists, allied health practitioners and holistic practitioners who are fully booked, a little fried, and quietly wondering what happens to the income the week they stop.',
   points:['You have years of training and knowledge worth far more than an hourly rate',
           'You have a handout, a resource or an idea already sitting in your Google Drive',
           'You want income that does not depend on you being in the room']},

  {t:'trap', eyebrow:'The trap',
   big:'More clients is not freedom. It is a <span class="hl">tighter ceiling</span>.',
   body:'A fully booked practice feels like the goal until you realise it needs you in it every single day. No session, no income. A sick week, school holidays, mat leave, and the maths falls apart.'},

  {t:'reframe', eyebrow:'The reframe',
   big:'You are the asset in your practice. <span class="hl">Not the NDIS. Not the rebates.</span>',
   kicker:'Build something no funding review can ever take away: your knowledge, packaged properly, out in the world.'},

  {t:'part', step:'Part One', h2:'The real problem is that your knowledge is trapped inside sessions.'},

  {t:'point', eyebrow:'Part One',
   h2:'One to one is the most fragile model in allied health.',
   points:['Your income is capped by the hours in your week',
           'Every dollar requires you present and mentally on',
           'Funding and referral changes hit you directly, with no buffer',
           'The expertise that could serve hundreds only ever reaches one person at a time']},

  {t:'point', eyebrow:'Part One',
   h2:'You already have the offer. You just have not packaged it.',
   body:'Nearly every therapist is sitting on something worth selling: the resource you rebuild for every client, the workshop you have run a dozen times, the framework in your head. It is not a content problem. It is a packaging problem.'},

  {t:'part', step:'Part Two', h2:'The Freedom Therapist Offer Method.',
   body:'Four moves that take what is already in your head and turn it into an offer that sells without you in the room.'},

  {t:'pillar', step:'Pillar One', k:'The Freedom Offer Audit',
   body:'We find the offer that has been sitting right in front of you. I have never met a therapist who did not have something worth packaging. We find yours, and we find the one that will actually sell.'},

  {t:'pillar', step:'Pillar Two', k:'The Scope &amp; Delivery Formula',
   body:'What is in, what is out, and exactly what format means it runs without you. This is the difference between an offer that works and one that just creates more work, and it keeps you safely inside your clinical scope.'},

  {t:'pillar', step:'Pillar Three', k:'The Freedom Map',
   body:'Pricing, landing page, thank you page, and where this offer sits in your world. One offer, placed properly, as the first door into everything you do.'},

  {t:'pillar', step:'Pillar Four', k:'The Therapists&#39; Language Table',
   body:'The single exercise that shows you why your messaging has not been landing, and gives you the words that make people buy. Your title, your byline, your sales language, written in the words you actually use.'},

  {t:'part', step:'Part Three', h2:'When one offer is in place, the maths finally works for you.'},

  {t:'point', eyebrow:'Part Three',
   h2:'One offer, placed as the first door into your practice.',
   points:['A product your clients can buy whether or not you have a free session',
           'Income that shows up on the weeks you step back',
           'A warm, honest on-ramp into your deeper work and programs',
           'A business you actually want to be in, for years, not months']},

  {t:'point', eyebrow:'Why me',
   h2:'I built this because I needed it first.',
   body:'I am a mental health occupational therapist. I started and ran OT Inspire, a remote outreach practice in the Northern Territory, serving communities across huge distances and supervising other therapists. I built a fully booked practice and then realised it owned me. So I built digital offers instead, and my whole business changed. Now I teach therapists to do the same inside the Freedom Therapist Club.'},

  {t:'recap', eyebrow:'In one line',
   big:'Stop renting out your hours. <span class="hl">Start selling what you know.</span>',
   body:'Audit the offer, scope the delivery, map where it sits, say it in your own words. That is one sellable offer, live, in one session.'},

  {t:'cta', eyebrow:'Your next step',
   h2:'Come build your first offer with me.',
   body:'The Freedom Therapist Club is where therapists build, price and launch their offers with me and a room of practitioners doing the same. If you are ready to stop waiting until you feel ready, this is the room.',
   btn:'Join the Freedom Therapist Club',
   disclaimer:'This masterclass is educational. It shares the method and frameworks I use and teach. It is not financial advice and it is not a guarantee of income or results. What you build and earn depends on your own work, offer and market.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta':'');
  let h = '';
  h += '<span class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</span>';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.step) h += '<div class="step">'+s.step+'</div>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.k) h += '<div class="pillar-k">'+s.k+'</div>';
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.big) h += '<div class="big">'+s.big+'</div>';
  if(s.lede) h += '<div class="lede">'+s.lede+'</div>';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.body) h += '<p class="body'+(s.t==='pillar'?'':'')+'">'+s.body+'</p>';
  if(s.points){
    const two = s.points.length>3 ? ' two':'';
    h += '<ul class="'+two.trim()+'">'+s.points.map(p=>'<li>'+p+'</li>').join('')+'</ul>';
  }
  if(s.btn) h += '<span class="btn">'+s.btn+'</span>';
  if(s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
