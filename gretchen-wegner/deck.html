<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Coach Approach to Powerful Studying — Gretchen Wegner</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffdf6;      /* warm light paper (brand site_scheme: light) */
    --panel:#ffffff;
    --rule:#ece7d8;
    --ink:#282828;     /* brand dominant text hex */
    --muted:#6b6457;
    --accent:#ffde59;  /* brand yellow, verbatim */
    --accent2:#2aa7c4; /* deepened brand sky #bde0e8 for small accents */
    --display:'Poppins',system-ui,sans-serif;
    --body:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(40,40,40,.03)}
  .num{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:18px}
  .kicker{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent2);margin-bottom:14px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:33px;line-height:1.14}
  .promise{font-size:20px;line-height:1.5;color:var(--ink);margin-top:20px;max-width:30em}
  p{font-size:19px;line-height:1.6;max-width:34em;margin-top:16px}
  .lead{font-size:23px;line-height:1.5}
  .hl{background:linear-gradient(transparent 58%, var(--accent) 58%);padding:0 .08em}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.45;padding:12px 0 12px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:4px;background:var(--accent)}
  .cyc{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
  .cyc span{font-family:var(--display);font-weight:600;font-size:16px;background:var(--bg);
    border:1px solid var(--rule);border-radius:999px;padding:10px 18px}
  .cyc span.on{background:var(--accent);border-color:var(--accent)}
  .stat{display:flex;gap:40px;flex-wrap:wrap;margin-top:26px}
  .stat b{font-family:var(--display);font-weight:700;font-size:40px;display:block;line-height:1}
  .stat small{font-size:14px;color:var(--muted);font-family:var(--display);letter-spacing:.02em}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:40em;line-height:1.5}
  .foot{font-family:var(--display);font-size:12px;color:var(--muted);letter-spacing:.1em;
    text-transform:uppercase;margin-top:30px}
  .ghost{text-decoration:line-through;text-decoration-color:var(--accent2);color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', kicker:'A live masterclass for educators & coaches',
   h:'The Coach Approach to Powerful Studying',
   promise:'Why study tips do not stick, what the brain actually needs instead, and how to coach it in students who have given up on themselves.'},

  {t:'who', kicker:'Who this is for',
   h:'Teachers, tutors, and academic coaches',
   p:'If you teach the material clearly and your students still freeze on the test, this hour is for you. We are going to look at studying as a brain skill you can coach, not a work-harder problem.'},

  {t:'trap', kicker:'The trap',
   h:'"I taught it. They knew it. They still blanked."',
   p:'You re-explain. You make another study guide. They reread their notes the night before and feel ready. Then the grade comes back and nobody can say what went wrong. So everyone decides the student just is not trying hard enough.'},

  {t:'reframe', kicker:'The reframe',
   h:'Studying is not a content problem. It is a brain problem.',
   lead:'Rereading feels like learning and is almost none of it. The issue is never how much your students care. It is that <span class="hl">nobody taught them how their brain actually stores and retrieves what they study.</span>'},

  {t:'p1', kicker:'Part one',
   h:'Why tips do not stick',
   p:'Highlight your notes. Make flashcards. Study in your learning style. Every tip is a tactic with no model behind it, so students cannot tell a good study hour from a wasted one. Tactics without the brain science are just rituals that feel productive.'},

  {t:'cost', kicker:'What it costs',
   h:'Two people burn out at once',
   p:'The student works hard the wrong way and concludes they are bad at school. The educator keeps re-teaching content that was never the real gap. Effort goes up, results do not, and confidence quietly drains out of the room.'},

  {t:'p2intro', kicker:'Part two',
   h:'The Anti-Boring Approach',
   p:'A way of teaching studying that puts the brain science first and the tactics second. It rests on five core principles. None of them is a hack. Together they are a system you can coach.'},

  {t:'list', kicker:'Principle 1',
   h:'Equip, do not rescue',
   list:['Teach the actual study skills and executive-function moves students are missing','Plan, start, organise, and self-check are skills, not personality traits','You are building capability they keep, not doing the work for them']},

  {t:'list', kicker:'Principle 2',
   h:'Always show the brain science',
   list:['Every strategy comes with the reason it works','Spacing and retrieval beat rereading because of how memory consolidates','When students understand why, they keep doing it without you standing over them']},

  {t:'list', kicker:'Principle 3: the mini-lecture',
   h:'Teach the minimum they need',
   list:['A short, vivid mini-lecture, then straight into doing','Cut everything that is nice to know but not needed now','Less talking from you means more thinking from them']},

  {t:'list', kicker:'Principle 4',
   h:'Break it into tiny steps',
   list:['Shrink the task until the first step is almost too small to refuse','Tiny and immediate beats big and someday for a stuck brain','Momentum is built, not summoned']},

  {t:'list', kicker:'Principle 5',
   h:'Model lifelong learning',
   list:['You are the proof that learning is a skill you keep sharpening','Curiosity and growth are caught from the adult in the room','This is what makes the work anti-boring for both of you']},

  {t:'cycle', kicker:'The framework',
   h:'The Study Cycle',
   p:'The four moves that replace cram-the-night-before. Each one is a coaching point you can name out loud with a student.',
   cyc:['Encode with intention','Space the practice','Retrieve, do not reread','Coach the loop']},

  {t:'senses', kicker:'The framework',
   h:'Learning styles are dead',
   lead:'Students are not <span class="ghost">visual</span> or <span class="ghost">auditory</span> learners. They have <span class="hl">Study Senses</span> you deliberately engage, because deep learning is multi-sensory and effortful on purpose, not a matter of finding your one true style.'},

  {t:'coach', kicker:'The move that changes everything',
   h:'Coach, do not lecture',
   p:'Instead of handing students the answer, you ask the question that makes them find it. The coach approach turns every study session into reps of the thinking they will have to do alone on the test. It is the difference between a student who needs you and a student you have set free.'},

  {t:'p3', kicker:'Part three',
   h:'What a session actually looks like',
   p:'Name the real gap in sixty seconds. One mini-lecture. One tiny first step done in the room. One retrieval rep. One question that hands the thinking back to them. They leave with a plan they built, not a guilt trip they carry.'},

  {t:'why', kicker:'Why trust this',
   h:'This has been tested on the hardest cases',
   stat:[['20+ years','teaching, coaching & training educators'],['1000+','educators trained in the Anti-Boring Approach'],['300+','neurodiverse learners coached']],
   p:'Built in the real work with the students everyone else had given up on, and shared every week with a community of educators inside the Anti-Boring Learning Lab.'},

  {t:'become', kicker:'Who you become',
   h:'The educator students finally get',
   p:'Not the one with the best handouts. The one who taught them how their own brain learns, then coached them until they believed it. That educator is never short of students, and never bored.'},

  {t:'cta', kicker:'Your next step',
   h:'Come learn the whole approach with me',
   p:'Join the Anti-Boring Learning Lab and get the Toolkit, the Study Cycle, and a community of educators coaching this every week. If you want to build a practice on it, the certification path is open too.',
   cuelabel:'antiboringlearninglab.com',
   disc:'Educational content only. No income, grade, or student result is guaranteed. Results vary with each learner, educator, and context.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='<div class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</div>';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){h+='<h1>'+s.h+'</h1>';}
  else {h+='<h2>'+s.h+'</h2>';}
  if(s.promise) h+='<p class="promise">'+s.promise+'</p>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.p) h+='<p>'+s.p+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.cyc){h+='<div class="cyc">';s.cyc.forEach((x,j)=>h+='<span class="'+(j===2?'on':'')+'">'+x+'</span>');h+='</div>';}
  if(s.stat){h+='<div class="stat">';s.stat.forEach(x=>h+='<div><b>'+x[0]+'</b><small>'+x[1]+'</small></div>');h+='</div>';}
  if(s.cuelabel) h+='<div class="foot">'+s.cuelabel+'</div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
