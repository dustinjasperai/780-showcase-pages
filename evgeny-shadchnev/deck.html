<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startup CEO Succession, a live masterclass with Evgeny Shadchnev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b1c1d; --panel:#26282a; --rule:#3a3c3e;
    --accent:#1470af; --ink:#eceef0; --muted:#9aa0a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Mulish",system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 120px}
  .slide{background:linear-gradient(180deg,#202224,#191a1b);border:1px solid var(--rule);
    border-radius:16px;padding:56px 56px;margin:0 0 28px;min-height:420px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);opacity:.85}
  .kick{font:600 13px/1 "Mulish";letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"Spectral",Georgia,serif;font-weight:600;font-size:36px;line-height:1.14}
  p{font-size:19px;line-height:1.6;color:#d6d9dc;margin-top:18px;max-width:62ch}
  .lead{font-size:23px;color:var(--ink)}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;color:#d6d9dc;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:2px;background:var(--accent)}
  .big{font-family:"Spectral",Georgia,serif;font-style:italic;font-size:30px;line-height:1.3;color:#fff}
  .foot{position:absolute;right:28px;bottom:20px;font:500 12px/1 "Mulish";letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .num{position:absolute;left:28px;bottom:20px;font:500 12px/1 "Mulish";color:var(--muted)}
  .cta h1{font-size:46px}
  .disc{margin-top:26px;font-size:13px;line-height:1.6;color:var(--muted);max-width:70ch}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:26px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .card .n{font-family:"Spectral",serif;color:var(--accent);font-size:28px;font-weight:700}
  .card p{font-size:16px;margin-top:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">A live masterclass</div>
    <h1>Startup CEO Succession</h1>
    <p class="lead">The founder-to-CEO transition, taught by someone who lived it and wrote the book on it.</p>
    <p>With Evgeny Shadchnev. Founder and ex-CEO of Makers. Author of the founder's guide to leadership transition.</p>
    <div class="foot">Unconditionally Human</div>`},

  {t:'audience', html:`
    <div class="kick">Who this is for</div>
    <h2>You built the company. Now the company needs something the role no longer gives you.</h2>
    <p>You are a founder-CEO of a scaling startup. The decisions still flow through you. The team has grown past the way you used to run it. And a quiet question has started showing up at 2am.</p>`},

  {t:'trap', html:`
    <div class="kick">The trap</div>
    <h2>Everyone told you how to start it. Nobody told you how to lead it once it outgrew you.</h2>
    <p>There are a thousand guides on founding a company and almost none on the moment the seat changes shape. So most founders wait, push harder, and let the question answer itself badly.</p>`},

  {t:'hook', html:`
    <div class="kick">The reframe</div>
    <p class="big">Most of the problems you think are operational are actually psychological. Fundraising, co-founder tension, restructuring. The hard part is rarely the spreadsheet.</p>
    <p>Succession is the clearest example. It looks like an org-chart decision. It is really a decision about identity, status, and what you want your life to feel like next.</p>`},

  {t:'part', html:`
    <div class="kick">Part one</div>
    <h1>The real question is not "should I leave?"</h1>
    <p>It is "is the role still a fit for who I am and what the company needs?" That question has an honest answer, and avoiding it is what quietly costs founders their company and their peace.</p>`},

  {t:'threepath', html:`
    <div class="kick">The three honest moves</div>
    <h2>When role fit becomes the constraint, you have exactly three choices.</h2>
    <div class="grid3">
      <div class="card"><div class="n">1</div><p><b>Grow into it.</b> Become the next version of the CEO the company now needs.</p></div>
      <div class="card"><div class="n">2</div><p><b>Redesign the seat.</b> Reshape the role so it fits you and the company again.</p></div>
      <div class="card"><div class="n">3</div><p><b>Hand it off.</b> Give the chair to someone better suited, on your terms.</p></div>
    </div>
    <p>There is no wrong door. There is only the drift of choosing none of them on purpose.</p>`},

  {t:'part', html:`
    <div class="kick">Part two</div>
    <h1>Why founders freeze: the 11 fears.</h1>
    <p>Before the decision is a strategy problem, it is a fear problem. Naming the fear is most of the work. Here is the map.</p>`},

  {t:'fears', html:`
    <div class="kick">The psychological landscape</div>
    <h2>The 11 fears of CEOs in transition.</h2>
    <ul>
      <li>Who am I if I'm not a founder? (identity)</li>
      <li>Will people still respect me? (status)</li>
      <li>What if I don't know what to do next?</li>
      <li>What will my investors think of me?</li>
      <li>How do I pay the bills without the CEO salary?</li>
      <li>What if the new CEO screws it up?</li>
      <li>And the one nobody admits: what if my successor smashes it?</li>
    </ul>`},

  {t:'fear11', html:`
    <div class="kick">The fear nobody says out loud</div>
    <p class="big">"What if my successor does it better than I ever did?"</p>
    <p>This is the fear that keeps a good founder in the chair two years too long. We work it directly, because an unspoken fear runs the decision from the shadows.</p>`},

  {t:'part', html:`
    <div class="kick">Part three</div>
    <h1>The nine-step roadmap.</h1>
    <p>Once the fear is named, succession becomes sequential and practical instead of personal. This is the arc we walk.</p>`},

  {t:'roadmap', html:`
    <div class="kick">From taboo topic to plan</div>
    <h2>Making the handoff practical.</h2>
    <ul>
      <li>Reflect on your deepest reasons for starting the company.</li>
      <li>Assess your skills and your situation honestly.</li>
      <li>Decide whether to stay, redesign, or step down.</li>
      <li>Choose the right successor for this stage, not the last one.</li>
      <li>Set decision rights so the company stops depending on one person.</li>
      <li>Execute a smooth handoff, and protect your own next chapter.</li>
    </ul>`},

  {t:'inner', html:`
    <div class="kick">The session work</div>
    <h2>We hold two agendas at once.</h2>
    <p>The big agenda is the transformation you actually want from this chapter. The small agenda is the one real thing worth working on today. We move between the external layer, your goals and obstacles, and the internal layer, your drives and emotions, because that is where the decision really lives.</p>`},

  {t:'whyme', html:`
    <div class="kick">Why me</div>
    <h2>I stepped down from a company I built, and then wrote the map I wish I'd had.</h2>
    <p>I co-founded Makers, trained engineers for Google, Apple, Microsoft and three hundred other companies, and then faced this exact transition myself. I became a certified coach and wrote the founder's guide to leadership transition, with a foreword by Jerry Colonna.</p>`},

  {t:'proof', html:`
    <div class="kick">In their words</div>
    <p class="big">"Evgeny has improved me as a leader and as a person."</p>
    <p>Oyvind Reed, CEO, Whereby.</p>`},

  {t:'what', html:`
    <div class="kick">What you walk away with</div>
    <h2>By the end of the masterclass.</h2>
    <ul>
      <li>A clear read on whether the role still fits you.</li>
      <li>Your own three-path decision, made on purpose.</li>
      <li>The fear that has been quietly driving the delay, named.</li>
      <li>The first three steps of a handoff you can start this quarter.</li>
    </ul>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h1>Come to the live session.</h1>
    <p>If any of this landed, join the live masterclass on the founder-to-CEO transition. Bring the question you have been avoiding. We will make it practical.</p>
    <p class="lead">Save your seat at evgeny.coach</p>
    <p class="disc">This masterclass is educational. It is not individual advice, and no income, role, valuation, or result is guaranteed. Every founder's situation is different and outcomes vary. Nothing here is a recommendation to make or avoid any specific business or personal decision.</p>
    <div class="foot">Unconditionally Human</div>`}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.cls||'');
  d.innerHTML=s.html+'<div class="num">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(d);
});
</script>
</body>
</html>
