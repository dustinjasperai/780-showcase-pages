<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Pass the CPC® Exam on Your First Try — the BHAT® System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8fb;        /* warm near-white, plum cast — brand light scheme (#efefef base) */
    --panel:#f2ebf3;     /* plum-tinted panel */
    --rule:#e2d4e4;      /* muted plum rule */
    --ink:#113e57;       /* brand deep teal (brand.json) — headings */
    --body:#2e2a30;      /* near-black body */
    --accent:#815481;    /* brand plum / link color (brand.json) — single accent */
    --head:'Spectral', Georgia, serif;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--body);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 64px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:52px 54px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide.part{background:var(--panel)}
  .slide.cta{background:var(--panel)}
  .kick{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;color:var(--ink);font-size:46px;line-height:1.1;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;color:var(--ink);font-size:34px;line-height:1.15;margin-bottom:16px}
  p{font-size:19px;max-width:62ch;margin-bottom:14px}
  p.lead{font-size:22px}
  .big{font-family:var(--head);font-weight:600;color:var(--ink);font-size:30px;line-height:1.25;max-width:24ch}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;padding:12px 0 12px 34px;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border:2.5px solid var(--accent);border-radius:50%}
  li:last-child{border-bottom:none}
  .mark{background:linear-gradient(transparent 58%, #e9d7ea 58%);padding:0 2px}
  .num{font-family:var(--head);color:var(--accent);font-weight:700;font-size:16px;letter-spacing:.1em}
  .disc{margin-top:26px;font-size:13px;color:#6b6470;max-width:70ch}
  .foot{position:absolute;bottom:18px;right:26px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a99bab}
  .cta-step{display:inline-block;margin-top:10px;font-family:var(--head);font-weight:600;color:var(--accent);font-size:22px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', kick:'A free masterclass with Laureen Jandroep · CCO',
   h:'How to Pass the CPC® Exam on Your First Try',
   p:'The BHAT® System for the open-book exam. The quiet method thousands of coders have used to walk in ready and walk out certified.'},

  {t:'audience', cls:'', kick:'Who this is for',
   h:'For the coder about to sit the CPC® exam',
   p:'You have studied for months. You know the guidelines. And you are still a little afraid of the clock, the open book, and the day itself.',
   p2:'If that is you, this hour is for you. By the end you will see exactly why first-try passes come down to one skill almost nobody teaches.'},

  {t:'trap', cls:'', kick:'The trap',
   h:'You have read the guidelines ten times. You still cannot find them fast enough.',
   p:'Most prep tells you to study harder and read more. So you do. But on exam day the problem is not what you know. It is how long it takes you to find it.'},

  {t:'reframe', cls:'part', kick:'The reframe',
   big:'The CPC® exam is not testing what you memorized. It is an open-book, timed test of how fast you can navigate the manual.'},

  {t:'part', cls:'part', kick:'Part one', h:'Why smart, prepared people still fail',
   p:'The exam is open book for a reason. Every answer is in front of you. What it really measures is whether you can get to the right code and the right guideline before the clock runs out.',
   p2:'People fail not because they did not study. They fail because they spend the whole exam flipping pages.'},

  {t:'point', cls:'', kick:'The real bottleneck',
   h:'Time, not knowledge',
   list:['A plain manual forces you to search for every guideline','Searching eats the minutes you needed for the hard questions','You run out of time with pages still unanswered','Confidence collapses, and so does the score']},

  {t:'part', cls:'part', kick:'Part two · the method', h:'The BHAT® System',
   p:'Bubble. Highlight. Annotate. The method I built in 1999 and have taught ever since. You prepare the manual itself so the answers sit next to the codes before you ever open the exam.',
   p2:'Three moves turn a book you search into a book you read.'},

  {t:'pillar', cls:'', num:'01 · Bubble',
   h:'Bubble the code',
   p:'Draw a ring around the codes that matter and write a short note inside the bubble, specific to that section. The reminder lives right where you need it, not twenty pages away.'},

  {t:'pillar', cls:'', num:'02 · Highlight',
   h:'Highlight the guidelines',
   p:'Color-code the rules so your eye lands on the right line instantly. On a timed exam, your eye finding the answer in one second instead of thirty is the whole game.'},

  {t:'pillar', cls:'', num:'03 · Annotate',
   h:'Annotate the cross-references',
   p:'Write the cross-reference down once, by hand, in your own words. You will never flip back and forth for it again, because the path is already drawn in the margin.'},

  {t:'point', cls:'', kick:'Put it together', h:'The BHAT® Cave',
   p:'Before exam day you build your own marked-up CPT, ICD, and HCPCS manuals, guided move by move. This is the BHAT® Cave: the work that turns the manual from your biggest obstacle into your fastest tool.'},

  {t:'part', cls:'part', kick:'Part two · the exam plan', h:'The CPC® Exam Formula',
   p:'Marking the book is half of it. The other half is how you sit the exam.',
   list:['Know the exam layout and the passing grade before you arrive','Work the questions series by series, not top to bottom','Spend your minutes where the points are','Flag and move, so one hard question never costs you five']},

  {t:'point', cls:'', kick:'Build the reflex', h:'Drill until it is automatic',
   p:'With CodeDrill™ and the CCO Mini-Mock exams you practice against real exam-style questions until finding the answer in your marked manual is reflex, not effort. Speed you can trust is speed you built.'},

  {t:'reframe', cls:'part', kick:'Exam day, with a marked book',
   big:'You open the book, and the answer is already marked. You are not searching. You are reading. And you finish with time to spare.'},

  {t:'why', cls:'', kick:'Why listen to me',
   h:'Laureen Jandroep',
   p:'I have taught medical coding and billing since 1999 and created the BHAT® System that same year. I founded a local AAPC chapter and served on the AAPC National Advisory Board.',
   p2:'In 25 years one thing has never changed: the coders who mark the book the right way are the ones who pass on the first try and stay calm doing it.'},

  {t:'point', cls:'', kick:'The real shift', h:'From dreading the retake to walking in ready',
   p:'The retake fee and the months of waiting are what keep coders stuck. The point of BHAT® is that you do not plan around a second attempt. You prepare the book, drill the reflex, and sit the exam once.'},

  {t:'recap', cls:'', kick:'Recap', h:'Three moves, one outcome',
   list:['Bubble the code so the note is where you need it','Highlight the guideline so your eye lands fast','Annotate the cross-reference so you never flip again','Walk in with the answers already in the book']},

  {t:'cta', cls:'cta', kick:'Your next step',
   h:'Ready to mark your book the BHAT® way?',
   p:'Join the next live session and bring your CPT manual. I will show you the first bubbles live, and you will leave with your exam prep already in motion.',
   step:'Enroll in the CCO Medical Coding Course to get the full BHAT® Cave, the Review Blitz, and your coach.',
   disc:'Educational content only. No income, role, exam result, or passing score is guaranteed. Results vary and depend on your own study and preparation.'}
];

const d = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  let h = '';
  if (s.kick) h += '<div class="kick">'+s.kick+'</div>';
  if (s.num) h += '<div class="num">'+s.num+'</div>';
  if (s.h) h += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if (s.big) h += '<div class="big">'+s.big+'</div>';
  if (s.p) h += '<p class="'+(s.t==='title'||s.t==='audience'?'lead':'')+'">'+s.p+'</p>';
  if (s.p2) h += '<p>'+s.p2+'</p>';
  if (s.list) h += '<ul>'+s.list.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  if (s.step) h += '<div class="cta-step">'+s.step+'</div>';
  if (s.disc) h += '<div class="disc">'+s.disc+'</div>';
  h += '<div class="foot">CCO · BHAT® System</div>';
  el.innerHTML = h;
  d.appendChild(el);
});
</script>
</body>
</html>
