<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Frequency You're Transmitting - A Masterclass with Rob Baines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1410; --panel:#12201a; --rule:#1f3a2c;
    --accent:#2e9d50; --ink:#eaf3ec; --muted:#9db4a6;
    --display:'Libre Baskerville',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:60px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;right:-120px;top:-120px;width:300px;height:300px;
    border-radius:50%;background:radial-gradient(circle,rgba(46,157,80,.22),transparent 70%)}
  .num{position:absolute;top:22px;right:28px;font-size:12px;color:var(--muted);letter-spacing:.14em}
  .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.1;margin-bottom:22px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.18;margin-bottom:20px}
  .sub{font-size:19px;line-height:1.55;color:var(--muted);max-width:60ch}
  .big{font-family:var(--display);font-size:32px;line-height:1.3;font-style:italic;max-width:24ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .quote{font-family:var(--display);font-style:italic;font-size:30px;line-height:1.35;max-width:26ch}
  .attr{margin-top:22px;font-size:15px;color:var(--muted);letter-spacing:.04em}
  .ctabox{text-align:center}
  .ctabox h2{font-size:40px}
  .step{display:inline-block;margin-top:14px;padding:14px 30px;border:1px solid var(--accent);
    border-radius:999px;color:var(--accent);font-weight:600;font-size:18px}
  .disc{margin-top:34px;font-size:13px;line-height:1.6;color:var(--muted);max-width:64ch;margin-left:auto;margin-right:auto}
  .brand{margin-top:26px;font-size:14px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',k:'A Live Masterclass with Rob Baines',h:"The Frequency You're Transmitting",s:"How to shift your reality without more mindset work. The Spacetime Method."},
  {t:'list',k:'Who this is for',h:"You have done the work. You are still waiting.",items:["You meditate. You have read the books, done the affirmations, kept the journals.","On paper you are doing everything right.","And yet the same patterns, the same ceiling, the same life keep returning.","You are starting to wonder if the problem is you."]},
  {t:'statement',k:'The reframe',h:"The problem was never your mindset. It is the frequency underneath it."},
  {t:'section',k:'Part One',h:"Why effort at the level of thought keeps you stuck"},
  {t:'list',k:'Part One',h:"Thoughts are downstream",items:["Affirmations, goals and vision boards all work at the level of the mind.","But the mind is an effect, not a cause. It reflects something deeper.","That deeper thing is your frequency, the vibrational tone you are quietly transmitting.","Change the thought and keep the old frequency, and life keeps reflecting the old frequency back."]},
  {t:'quote',q:"Frequency is the energetic tone of your being. It is the living blueprint that shapes your experience across space and time.",a:"The Spacetime Method"},
  {t:'section',k:'Part Two',h:"The Spacetime Method: three movements"},
  {t:'list',k:'Movement one',h:"Frequency as the living blueprint",items:["Your field has a tone, and life organizes itself around that tone.","Your outer world is feedback. It shows you what is active in your resonance.","Once you can read your own frequency, you stop fighting symptoms and start at the source."]},
  {t:'list',k:'Movement two',h:"Coherence, not force",items:["Coherence is clarity, groundedness and presence held in the field at once.","You do not chase the outcome. You embody the version of you that is already whole.","When the field is coherent, that becomes the tone you transmit, and life reflects it back."]},
  {t:'list',k:'Movement three',h:"Coherence reorganizes reality",items:["Reality listens to frequency, and frequency is who you choose to be.","As you learn to weave through the fabric of space and time, you create consciously.","Abundance, wisdom and sustainable success are magnetized, not forced."]},
  {t:'statement',k:'The shift',h:"This is not a slow grind. It is a catalytic shift you can feel."},
  {t:'list',k:'The catalytic shift',h:"What changes in the room",items:["A catalytic shift is an immediate, powerful frequency alignment.","It activates clarity, balance and coherence in your field in real time.","You do not leave with more to think about. You leave transmitting differently."]},
  {t:'section',k:'Part Three',h:"What a tuned life actually looks like"},
  {t:'list',k:'Part Three',h:"From noise to coherence",items:["Decisions get quiet and obvious instead of loud and anxious.","You stop performing wholeness and start resting in it.","Opportunities, people and timing begin to meet you where you already are.","The work becomes maintaining your frequency, not forcing your life."]},
  {t:'quote',q:"Reality listens to frequency. When you change who you are being, what becomes available changes with you.",a:"Rob Baines, The Spacetime Method"},
  {t:'list',k:'Why this path',h:"Why Rob, and why now",items:["Rob built the Spacetime Method and the Spacetime Collective around this one idea.","He has guided this work in rooms from the Science Museum in London to retreats across the world.","Every week, a Collective of people meditate and recalibrate their frequency together.","This masterclass is the doorway into that work."]},
  {t:'cta',h:"Step into the Spacetime Method",s:"If the frequency you transmit is the frequency your life reflects, the next step is to learn to tune it on purpose. Join Rob inside the Spacetime Collective and begin the work.",step:"Join the Spacetime Collective",disc:"This masterclass is educational. No income, outcome or result is guaranteed. Results vary from person to person and depend on many factors outside any teacher's control.",brand:"Spacetime with Rob"}
];
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('div','slide');
  sl.appendChild(el('div','num','0'+(i+1)));
  if(s.k) sl.appendChild(el('div','kick',s.k));
  if(s.t==='title'){sl.appendChild(el('h1',null,s.h));sl.appendChild(el('div','sub',s.s));}
  else if(s.t==='statement'){sl.appendChild(el('div','big',s.h));}
  else if(s.t==='section'){sl.appendChild(el('h2',null,s.h));}
  else if(s.t==='list'){sl.appendChild(el('h2',null,s.h));const ul=el('ul');s.items.forEach(it=>ul.appendChild(el('li',null,it)));sl.appendChild(ul);}
  else if(s.t==='quote'){sl.appendChild(el('div','quote','&ldquo;'+s.q+'&rdquo;'));sl.appendChild(el('div','attr',s.a));}
  else if(s.t==='cta'){sl.className='slide ctabox';sl.appendChild(el('h2',null,s.h));sl.appendChild(el('div','sub',s.s));sl.appendChild(el('div','step',s.step));sl.appendChild(el('div','disc',s.disc));sl.appendChild(el('div','brand',s.brand));}
  deck.appendChild(sl);
});
</script>
</body>
</html>
