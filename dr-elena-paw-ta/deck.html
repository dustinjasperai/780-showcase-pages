<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak With Impact - Dr Elena Pawęta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf4f6;      /* pale rose ground, desaturated from her accent #cc3366 (light scheme) */
    --panel:#fffafc;   /* near-white with a rose tint */
    --rule:#efdfe4;    /* rose-tinted rule */
    --ink:#1a1a1a;     /* her dominant text hex (25 uses) */
    --muted:#69727d;   /* her slate (10 uses) */
    --accent:#cc3366;  /* her own link/brand rose rgb(204,51,102) - single accent */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 72px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .kicker{font-family:'Fraunces',serif;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:44px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Fraunces',serif;font-weight:900;font-size:34px;line-height:1.12;letter-spacing:-.01em}
  .lede{font-size:21px;line-height:1.5;color:var(--ink);margin-top:18px;max-width:44ch}
  .sub{font-size:18px;line-height:1.55;color:var(--muted);margin-top:14px;max-width:52ch}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block;margin-bottom:26px}
  ul{list-style:none;margin-top:22px}
  li{position:relative;padding-left:26px;margin:12px 0;font-size:19px;line-height:1.5;max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .big{font-size:30px;line-height:1.25;font-family:'Source Serif 4',serif;font-style:italic;max-width:40ch}
  .name{font-family:'Fraunces',serif;font-weight:700;font-size:17px;margin-top:30px}
  .name span{color:var(--muted);font-weight:400}
  .pillar{font-family:'Fraunces',serif;font-weight:900;font-size:13px;color:var(--accent);
    letter-spacing:.08em;text-transform:uppercase}
  .disc{font-family:'Fraunces',serif;font-size:12px;color:var(--muted);margin-top:28px;max-width:56ch;line-height:1.5}
  .cta{font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:var(--accent);margin-top:22px}
  .pg{font-family:'Fraunces',serif;font-size:12px;color:var(--muted);margin-top:20px;letter-spacing:.06em}
  @media(max-width:640px){.slide{padding:34px 24px}h1{font-size:32px}h2{font-size:26px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass with Dr Elena Pawęta',h:'Speak With Impact',
  lede:'How to command any room as your authentic self, using the method behind TEDx talks with over a million views.',
  name:'Dr Elena Pawęta <span>/ Executive Communication & Leadership Advisor</span>'},

 {t:'who',kicker:'Who this is for',h:'You already know your material cold',
  lede:'This is for managers, founders and executives who have something worth saying and want to be heard when it matters most.',
  sub:'The board meeting. The pitch. The keynote. The moment your idea lives or dies on how you deliver it.'},

 {t:'trap',kicker:'The trap',h:'Then you stand up, and the nerves take over',
  lede:'You rehearse. You tighten the slides. You tell yourself to relax. And the message still gets smaller the moment you open your mouth.',
  sub:'So you conclude you are just not a natural speaker. That conclusion is the real problem, and it is wrong.'},

 {t:'reframe',kicker:'The reframe',
  big:'The problem was never your confidence. It is that you were taught to perform, when the job was to connect.'},

 {t:'part',kicker:'Part One',h:'Why the best speakers are not performing',
  sub:'The fear of speaking is almost always the fear of being judged. The fix is not more willpower. It is where you point your attention.'},

 {t:'content',kicker:'Facing Outwards',h:'Nerves come from facing inward',
  lede:'When every thought is about how you look and whether you will mess up, your body reads it as a threat.',
  sub:'Facing Outwards moves the focus off yourself and onto one question: what does this audience need from me right now? The nerves shrink because you are no longer the subject.'},

 {t:'content',kicker:'Your authentic style',h:'You do not need a borrowed persona',
  lede:'Most speaking advice hands you someone else to imitate. It never fits, so it always reads as forced.',
  sub:'Impact comes from your own authentic style, made intentional. We build on who you already are, not on a character you have to maintain under pressure.'},

 {t:'part',kicker:'Part Two',h:'The Speak With Impact method',
  sub:'Seven moves that turn a competent presenter into a memorable one. Each one is a skill, practised by doing, not a personality you were born with.'},

 {t:'pillarslide',p:'Secrets of TEDx Speakers',h:'Why the red-dot talks land',
  lede:'After nine years organizing TEDx and coaching its speakers, the patterns are clear.',
  sub:'What the talks past a million views do differently, and how to port it into a business presentation.'},

 {t:'pillarslide',p:'Your Main Message',h:'One idea they remember',
  lede:'Most talks fail because they try to say five things and land none.',
  sub:'We find the single message worth remembering, and build everything to serve it.'},

 {t:'pillarslide',p:'Structure Your Speech',h:'A spine they can follow',
  lede:'A clear structure is what lets an audience relax and stay with you.',
  sub:'Proven frameworks so you always know exactly what to say next, and so do they.'},

 {t:'pillarslide',p:'Prove Your Point',h:'Credible, not just confident',
  lede:'Confidence without evidence is noise. Evidence is what earns the room.',
  sub:'How to use the right kinds of proof so you are perceived as credible and professional.'},

 {t:'pillarslide',p:'Tell Your Story',h:'Connect before you convince',
  lede:'Story is how you reach people on an emotional level, and how you defeat your own fear.',
  sub:'The art of business storytelling, so your point is felt and not just heard.'},

 {t:'pillarslide',p:'Show Your Credibility',h:'Be believed in the first minute',
  lede:'Credibility is built on purpose, through what you say, do, and how you carry it.',
  sub:'Small, deliberate choices that make an audience lean in and trust you early.'},

 {t:'content',kicker:'Learning by doing',h:'You learn this by doing it',
  lede:'Reading about speaking changes nothing. A practical task after every move is what makes it stick.',
  sub:'This is a learning-by-doing method. You leave not with notes, but with a talk you can give and a way of speaking that is yours.'},

 {t:'part',kicker:'Part Three',h:'The same you, finally landing',
  sub:'Not a different person. The same you, heard the way you always knew you could be.'},

 {t:'after',kicker:'The shift',h:'From dreading the room to owning it',
  lede:'You walk in with one clear message, a spine to carry it, a story that connects, and your attention pointed outward.',
  sub:'The same meeting, the same pitch, the same stage. You are simply heard now, and remembered after.'},

 {t:'why',kicker:'Why learn this from me',h:'Dr Elena Pawęta',
  lede:'Nine years organizing TEDx and coaching its speakers, several past a million views, one near two million.',
  sub:'PhD economist, certified Dale Carnegie trainer, lecturer at leading business schools, host of the IDEAS+LEADERS podcast, and a keynote speaker from London to New York to Riyadh.'},

 {t:'cta',kicker:'Your next step',h:'Ready to speak with impact?',
  lede:'If you want to find your authentic impactful style and be remembered when it matters, let us talk about where you are and where you want to be.',
  cta:'Book a discovery call with Dr Elena Pawęta',
  disc:'This masterclass is educational. It shares a communication method and reflects the experience of the presenter and her clients. Results vary from person to person, and nothing here is a promise or guarantee of any specific outcome.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.p) h+='<div class="pillar">'+s.p+'</div>';
  if(s.t==='reframe'){h+='<span class="dot"></span><div class="big">'+s.big+'</div>';}
  else{
    if(s.h) h+=(i===0?'<h1>':'<h2>')+s.h+(i===0?'</h1>':'</h2>');
    if(s.lede) h+='<div class="lede">'+s.lede+'</div>';
    if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
    if(s.cta) h+='<div class="cta">'+s.cta+'</div>';
    if(s.name) h+='<div class="name">'+s.name+'</div>';
    if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  }
  h+='<div class="pg">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
