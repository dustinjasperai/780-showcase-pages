<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Work Less Behind the Computer · Sara Monika, Outsourcing Made Easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Sofia+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbf7f1; --panel:#f6f0ea; --rule:#e6d9c6;
    --acc:#a26840; --ink:#211d17; --body:#524a40; --dim:#9a8f80; --cream:#faf5ee;
  }
  html,body{height:100%}
  body{background:#efe6d8;font-family:'Sofia Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe6d8}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Sofia Sans',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:.002em}
  .t-title h1{font-size:4.7vw;max-width:95%}
  .t-normal h1{font-size:3.05vw;max-width:91%}
  .t-normal .body{font-family:'Sofia Sans',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.64;font-weight:400}
  .sub{font-family:'Bodoni Moda',serif;font-style:italic;font-size:1.9vw;color:var(--acc);margin-top:3.6vh;max-width:86%;line-height:1.42;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Sofia Sans',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:93%}
  .t-section .rule{width:14vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#2b241c 0%,#1a150f 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:89%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2b241c 0%,#1a150f 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:87%;color:var(--cream)}
  .t-cta .body{font-family:'Sofia Sans',sans-serif;color:#e9ddcd;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.5%;bottom:8.5%;width:15vw;opacity:.9}
  .corner-vf{right:6.5%;bottom:7.5%;width:7.2vw;opacity:.5}
  .brandline{font-family:'Sofia Sans',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(33,29,23,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.0vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Outsourcing Made Easy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: the reclaimed hour, a clock quarter that empties back to a filled dot at twelve, drawn in terracotta -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <circle cx="60" cy="60" r="42" fill="none" stroke="#a26840" stroke-width="2" opacity="0.35"/>
  <path d="M60 60 L60 22 A38 38 0 0 0 26 60 Z" fill="#a26840" opacity="0.16"/>
  <path d="M60 60 L60 26 M60 60 L34 60" fill="none" stroke="#a26840" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="4.5" fill="#a26840" opacity="0.9"/>
  <circle cx="60" cy="22" r="3" fill="#a26840" opacity="0.9"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Work Less Behind the Computer',sub:'How wedding photographers hand off the culling, editing, and admin, get their weekends back, and grow without shooting more.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You love the part where you make the pictures. It is everything after that is eating your life.',body:'You are a working photographer whose images are genuinely good, and the bookings come in. But the shoot is the small part now. It is the culling, the editing, the blogging, the album design, and the inbox that keep you at the desk until one in the morning, long after the wedding is over.'},
 {t:'dark',title:'A full calendar you never leave your desk to enjoy is not a business. It is a second job you handed yourself.'},

 {t:'section',idx:'Part One',title:'Why Working Harder Stopped Working'},
 {t:'normal',k:'The volume reflex',title:'When money feels tight, the instinct is to shoot more. That only makes the pile bigger.',body:'Every new booking is another cull, another edit, another set of albums and emails. More low-margin work does not buy you room. It buys you a busier version of the exact same week. You cannot out-hustle a workflow that lives entirely on your own two hands.'},
 {t:'normal',k:'The five jobs',title:'You did not sign up to be the culler, the editor, the blogger, the admin, and the artist all at once.',body:'Somewhere along the way you became all of them. The creative work you actually trained for now competes with hours of production nobody sees. And because it all runs through you, a good month and a burned-out month look exactly the same from the outside.'},
 {t:'dark',title:'The bottleneck is not your talent or your prices. It is that everything still depends on you.'},

 {t:'section',idx:'Part Two',title:'The Outsourcing Made Easy Method'},
 {t:'normal',k:'The reframe',title:'The Art of Working Less and Making More.',body:'It starts with an honest number: what an hour of your time is actually worth. Most of your week is spent on tasks worth a fraction of that, the ones anyone trained could do. The method keeps the handful of things only you can do, your eye, your clients, your art, and builds a plan to hand off the rest. Your hours are the cost, not the product.'},
 {t:'normal',k:'Pillar one, culling',title:'The Outsourcing Culling Framework.',body:'Culling is the first hour-thief to go, and the one photographers are most afraid to hand off. This is how you do it without losing your eye: how to write the job post, how to test and hire a culler, the Culling Formula that keeps the selects consistent, and the feedback loop that gets their picks matching yours in a couple of rounds.'},
 {t:'normal',k:'Pillar two, editing',title:'The Roadmap to Outsourcing Editing.',body:'Editing is where the real hours hide, and the real fear lives: what if it stops looking like mine. The roadmap answers it with a training-video and feedback system that holds your style. Done right, this alone gives most photographers back eight to twelve hours on every single wedding.'},
 {t:'normal',k:'Pillar three, the rest',title:'Hire a Virtual Assistant in Two Weeks.',body:'Blogging, slideshows, album design, the admin that piles up between weddings. This is the ethical, step by step way to hire and train a virtual assistant to carry it, so the work behind the work stops landing on you at eleven at night.'},
 {t:'dark',title:'Delegation is not losing control of your art. It is deciding which hours are actually yours to spend.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Hand It Off'},
 {t:'normal',k:'The photographer this builds',title:'Weekends that belong to you again, and a business that no longer needs you awake at 1am.',body:'When culling, editing, and admin run through a team you trained, the work still ships and still looks like yours. The evenings come back. The slow weeks stop being a crisis. And the hours you used to pour into production go back to your family, your own creative work, and the parts of the business only you can do.'},
 {t:'dark',title:'The goal was never a fuller hard drive. It was a life you are actually present for.'},
 {t:'normal',k:'Why Sara',title:'Thirteen years, 375 weddings, and the systems built to survive all of it.',body:'Sara Monika is a wedding and portrait photographer who built her own studio to run without living behind the computer, then taught the system to photographers through Outsourcing Made Easy and the Shine and Thrive podcast, now past two hundred thousand downloads. This is the method behind all of it, the same one that got her nights back.'},

 {t:'section',idx:'Your Next Step',title:'Build the Studio That Runs Without You In It'},
 {t:'normal',k:'Keep going with Sara',title:'A free place to start, and a full system for when you are ready to hand it all off.',body:'The free workflow tools are where you begin: the post-workflow checklist and the small delegations that give you your first evenings back. Outsourcing Made Easy is the full method, the culling, editing, and hiring systems, with live coaching the whole way. Start where you are, and go as far as you want to.'},
 {t:'cta',title:'Ready to work less behind the computer?',body:'Take the next step with Sara Monika.',chips:['Grab the free workflow tools','Join the Outsourcing Made Easy waitlist'],disc:'Educational content for working and aspiring photographers. No income or business result is guaranteed. Results vary by photographer, market, and effort.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Sara <b>Monika</b> · Outsourcing Made Easy</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
