<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When Your Playbook Stops Working: a masterclass with Kathy Wu Brady</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e8;        /* warm cream ground, from brand creams #f4ede1/#dcd5cb */
    --panel:#ece3d4;     /* lighter stone, from #dcd5cb */
    --ink:#363737;       /* her near-black */
    --taupe:#514b40;     /* dominant brand taupe/olive-stone */
    --stone:#82807b;     /* secondary stone grey */
    --accent:#0c362a;    /* deep forest green — the one saturated brand hex */
    --serif:'Lora',Georgia,serif;
    --sans:'Lexend',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d9d0c2;font-family:var(--sans);color:var(--ink)}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{
    background:var(--bg);
    border:1px solid #e2d8c7;
    border-radius:4px;
    aspect-ratio:16/9;
    padding:64px 72px;
    margin:0 0 28px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 0 rgba(81,75,64,.08);
  }
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:600;font-size:46px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.14;color:var(--ink)}
  .sub{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--taupe);margin-top:18px;line-height:1.35}
  p,li{font-family:var(--sans);font-weight:300;font-size:19px;line-height:1.55;color:var(--taupe)}
  .lead{font-size:23px;color:var(--ink);font-weight:400}
  ul{margin:18px 0 0 0;list-style:none}
  li{margin:0 0 14px 0;padding-left:26px;position:relative}
  li:before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:1px}
  .rule{width:56px;height:3px;background:var(--accent);margin:0 0 26px}
  .foot{position:absolute;left:72px;bottom:30px;font-family:var(--sans);font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--stone)}
  .pagenum{position:absolute;right:72px;bottom:30px;font-size:12px;color:var(--stone)}
  .big{font-family:var(--serif);font-size:40px;line-height:1.12;color:var(--ink)}
  .panel{background:var(--panel);border-radius:4px;padding:28px 32px;margin-top:22px}
  .pillar{font-family:var(--serif);font-size:26px;color:var(--accent);margin-bottom:8px}
  .disclaimer{font-size:13px;color:var(--stone);margin-top:26px;font-weight:300;max-width:70ch}
  .cta-step{font-family:var(--serif);font-size:26px;color:var(--ink);margin-top:10px}
  .name{font-family:var(--serif);font-size:20px;color:var(--ink);margin-top:28px}
  .role{font-size:15px;color:var(--stone);letter-spacing:.04em}
  .stat{font-family:var(--serif);font-size:34px;color:var(--accent);display:block}
  .statline{display:flex;gap:40px;flex-wrap:wrap;margin-top:24px}
  .statline div{min-width:140px}
  .statline span.lab{font-size:14px;color:var(--stone);display:block;margin-top:4px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:'A live masterclass for senior leaders',
    h1:'When Your Playbook Stops Working',
    sub:'How excellent, empathetic leaders find the next gear when the strategies that got them here quietly stop getting results.',
    name:'Kathy Wu Brady',
    role:'Executive Coach & Strategic Advisor · 2x CEO, 2x COO' },

  {t:'promise',
    kicker:'What you will leave with',
    h2:'One hour. Three shifts.',
    lead:'By the end of this session you will be able to:',
    bullets:[
      'Name the exact moment your proven playbook started working against you.',
      'See the operator blind spot that keeps senior leaders solving at the wrong altitude.',
      'Walk out with the three-pillar move I use with clients to lead without limits.'
    ] },

  {t:'who',
    kicker:'Who this is for',
    h2:'You have always delivered.',
    bullets:[
      'A senior leader who is excellent and empathetic, and has the track record to prove it.',
      'Someone who wants a strategic thought partner, not platitudes.',
      'A leader who feels stretched and is quietly asking what the next chapter is really for.'
    ] },

  {t:'trap',
    kicker:'The trap',
    h2:'The strategies that earned you the seat.',
    lead:'Work harder. Out-prepare the room. Carry more. Be the one who always finds the answer. It is the exact playbook that got you promoted, trusted, and relied on.',
    sub:'And it is the one that is now quietly costing you.' },

  {t:'hook',
    kicker:'The reframe',
    big:'Your playbook is no longer working. Working it harder is the problem, not the fix.' },

  {t:'part', kicker:'Part one', h1:'The operator blind spot' },

  {t:'content',
    kicker:'Part one',
    h2:'You are still solving at the altitude that earned you the seat.',
    lead:'The skills that made you a brilliant operator reward speed, control, and being the answer. At senior altitude the job inverts: your value is judgment, leverage, and the people you grow, not the tasks you personally close.',
    bullets:[
      'More hours stop buying more results.',
      'Being the smartest person in the room caps the room.',
      'The harder you push the old levers, the more stuck the system feels.'
    ] },

  {t:'content',
    kicker:'Part one',
    h2:'The cost nobody puts on the scorecard.',
    bullets:[
      'Stalled: the next move is not obvious, and waiting to be chosen is not working.',
      'Stretched: you are carrying the weight of the old playbook into a bigger role.',
      'Unseen: you are delivering and still not being heard at the level you have earned.'
    ],
    sub:'This is the inflection. It is not a performance problem. It is a playbook problem.' },

  {t:'part', kicker:'Part two', h1:'The Lead without Limits framework' },

  {t:'content',
    kicker:'Part two',
    h2:'Three pillars, worked in order.',
    lead:'This is the structure I use with the small number of leaders I coach one-on-one. Each pillar is a different lever, and most leaders are over-indexed on one and blind to the other two.' },

  {t:'pillar',
    kicker:'Pillar one',
    pillar:'Leadership Mastery',
    lead:'Growing your impact through others, not through heroics.',
    bullets:[
      'Make the strategic decisions only you can make, and let the rest go.',
      'Lead with earned confidence instead of over-preparation.',
      'Communicate so you are actually heard, not just present.'
    ] },

  {t:'pillar',
    kicker:'Pillar two',
    pillar:'Career Navigation & Growth',
    lead:'Designing the next chapter on purpose instead of waiting to be chosen.',
    bullets:[
      'Name the obstacle that is really stalling you, not the one that is easy to say.',
      'Claim and articulate your value rather than assuming the work speaks for itself.',
      'Choose the next move deliberately, from your terms.'
    ] },

  {t:'pillar',
    kicker:'Pillar three',
    pillar:'Mindset & Mental Fitness',
    lead:'Building the inner engine that lets you sustain the pace.',
    bullets:[
      'Catch the self-doubt that shows up precisely when the stakes rise.',
      'Rewire the limiting beliefs you were promoted right past.',
      'Build the resilience that makes the first two pillars repeatable.'
    ] },

  {t:'hook',
    kicker:'The through-line',
    big:'Think like an operator. Act like a guide.' },

  {t:'part', kicker:'Part three', h1:'Ninety days of leading without limits' },

  {t:'content',
    kicker:'Part three',
    h2:'The first ninety days of leading without limits.',
    bullets:[
      'Weeks 1 to 3: find the altitude leak and stop personally closing what you should be delegating.',
      'Weeks 4 to 8: install the one decision cadence that protects your judgment and your calendar.',
      'Weeks 9 to 12: make the career move, or the internal shift, you have been circling.'
    ],
    sub:'Small, deliberate shifts. Compounding results.' },

  {t:'why',
    kicker:'Why me',
    h2:'I have been in the seat.',
    lead:'I coach from the chair you are in, not from a theory of it.',
    stats:[
      {n:'2x / 2x', l:'CEO and COO'},
      {n:'$15-50MM', l:'ARR built across 4 businesses'},
      {n:'5', l:'industries led'}
    ],
    sub:'My clients want someone who knows how to think like an operator and act like a guide.' },

  {t:'recap',
    kicker:'Recap',
    h2:'Three shifts, one move.',
    bullets:[
      'The old playbook is the problem, not the effort behind it.',
      'The blind spot is altitude, not ability.',
      'Leadership Mastery, Career Navigation, and Mental Fitness, worked in order, are the way through.'
    ] },

  {t:'cta',
    kicker:'Your next step',
    h2:'Ready to lead without limits?',
    step:'Book a free strategy call with me, and we will map your inflection and the first move.',
    name:'Kathy Wu Brady',
    role:'Executive Coach & Strategic Advisor',
    disclaimer:'This masterclass is educational. It shares frameworks and perspective, not guarantees. Individual results vary and depend on your own situation, effort, and context.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){
    h += '<div class="rule"></div><h1>'+s.h1+'</h1>';
    if(s.sub) h += '<div class="sub">'+s.sub+'</div>';
    h += '<div class="name">'+s.name+'</div><div class="role">'+s.role+'</div>';
  } else if(s.t==='part'){
    h += '<h1>'+s.h1+'</h1>';
  } else if(s.t==='hook'){
    h += '<div class="rule"></div><div class="big">'+s.big+'</div>';
  } else {
    if(s.h1) h += '<h1>'+s.h1+'</h1>';
    if(s.h2) h += '<h2>'+s.h2+'</h2>';
    if(s.pillar) h += '<div class="pillar">'+s.pillar+'</div>';
    if(s.lead) h += '<p class="lead">'+s.lead+'</p>';
    if(s.bullets){ h += '<ul>'; s.bullets.forEach(b=> h += '<li>'+b+'</li>'); h += '</ul>'; }
    if(s.stats){ h += '<div class="statline">'; s.stats.forEach(x=> h += '<div><span class="stat">'+x.n+'</span><span class="lab">'+x.l+'</span></div>'); h += '</div>'; }
    if(s.step) h += '<div class="cta-step">'+s.step+'</div>';
    if(s.sub) h += '<div class="sub">'+s.sub+'</div>';
    if(s.name) h += '<div class="name">'+s.name+'</div>';
    if(s.role) h += '<div class="role">'+s.role+'</div>';
    if(s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  }
  h += '<div class="foot">Lead without Limits · Kathy Wu Brady</div>';
  h += '<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
