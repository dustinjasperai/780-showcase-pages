<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Team +1 Masterclass &middot; Shawn King</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F5F7FB; --panel:#E7ECF7; --rule:#C9D3E8;
    --acc:#2C51AC; --deep:#1B3568; --ink:#232323; --dim:#6B7280; --paper:#FBFCFE;
  }
  html,body{height:100%}
  body{background:#DCE3F2;font-family:'Open Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#DCE3F2}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Russo One',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.6vw;max-width:88%}
  .t-normal h1{font-size:2.6vw;max-width:86%}
  .t-normal .body{font-size:1.42vw;color:#4A5063;margin-top:2.6vh;max-width:74%;line-height:1.56;font-weight:400;font-family:'Open Sans',sans-serif}
  .sub{font-size:1.5vw;color:#4A5063;margin-top:3.2vh;max-width:78%;line-height:1.48;font-weight:400;font-family:'Open Sans',sans-serif}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.3vw;font-weight:600;color:var(--deep);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:3.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:linear-gradient(180deg,var(--deep) 0%,#0F2142 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:2.7vw;max-width:82%;color:var(--paper)}
  .t-cta{background:linear-gradient(180deg,var(--deep) 0%,#0F2142 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.1vw;max-width:80%;color:var(--paper)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#E7ECF7;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500;font-family:'Open Sans',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.88vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4;font-family:'Open Sans',sans-serif}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .t-cta .disc{color:#B9C6E4}
  .motif{position:absolute;pointer-events:none;opacity:.9}
  .title-motif{right:7%;bottom:9%;width:16vw}
  .corner-motif{right:6%;bottom:7.5%;width:7.5vw;opacity:.6}
  .brandline{font-size:1.2vw;color:#4A5063;margin-top:3.4vh;font-weight:400;letter-spacing:.02em;font-family:'Open Sans',sans-serif}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(35,36,35,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500;font-family:'Open Sans',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Open Sans',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Open Sans',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.4vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.4vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Mr. Fence Academy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- post-and-rail motif: a simple fence-line device, straight verticals + one connecting rail -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rail" viewBox="0 0 220 140">
  <g fill="none" stroke="#2C51AC" stroke-width="4" stroke-linecap="round">
    <line x1="20" y1="30" x2="20" y2="120" opacity="0.85"/>
    <line x1="70" y1="18" x2="70" y2="120" opacity="0.85"/>
    <line x1="120" y1="30" x2="120" y2="120" opacity="0.85"/>
    <line x1="170" y1="18" x2="170" y2="120" opacity="0.85"/>
    <line x1="10" y1="55" x2="200" y2="46" stroke-width="5" opacity="0.55"/>
    <line x1="10" y1="90" x2="200" y2="82" stroke-width="5" opacity="0.55"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Team +1 Masterclass',sub:'For fence company owners, taught by an owner who still runs the company today.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You are the best installer in the company. That is the problem.',body:'You run a fence company, and a lot of hard quotes, tricky gates, and new hires still route through you. A crew like that is good. It still struggles to run a full week without you on the phone.'},
 {t:'dark',title:'You have to improve yourself before you can help others.'},

 {t:'section',idx:'Part One',title:'Why Skilled Owners Still Run Out of Gas'},
 {t:'normal',k:'The invisible cost',title:'The most skilled person in the company is often the most exhausted.',body:'That is exactly why growth stalls at the owner\'s own energy, not the crew\'s skill. The business runs beautifully as long as the owner shows up wired and ready, and it cannot run any faster than one tired person can push it.'},
 {t:'normal',k:'The trap nobody names',title:'Owners will fix a crew\'s schedule before they will fix their own.',body:'You will rebuild a production schedule, retrain a salesman, rewrite a bid sheet, all before you ever ask whether you personally are set up to lead any of it. The team problem is almost always an owner problem wearing a team costume.'},
 {t:'dark',title:'His own words: you have to improve yourself before you can help others.'},

 {t:'section',idx:'Part Two',title:'The Rhythm: Commit, Learn, Lead'},
 {t:'normal',k:'Commit',title:'Every real result starts with committing to the process, not just liking the idea.',body:'Committing means working the process the way it is taught, on the weeks it feels inconvenient, not just the weeks it is easy to be excited.'},
 {t:'normal',k:'Learn',title:'Training only works if you actually show up and put it to use.',body:'A video watched once and a system installed and run every week are not the same thing. Learning here means active participation, not passive consumption.'},
 {t:'normal',k:'Lead',title:'The job is not done until you can teach someone else to run it.',body:'Leading is the step most owners skip. It means implementing the system in your own company, then handing pieces of it to your team so it runs without you standing over it.'},
 {t:'dark',title:'Commit. Learn. Lead. Skip a step and the other two fall apart.'},

 {t:'section',idx:'Part Three',title:'What Running On The Rhythm Actually Looks Like'},
 {t:'normal',k:'The Financial Matrix',title:'Know which number is actually holding the company back.',body:'Most owners can tell you revenue. Few can tell you which single number in the business is the real constraint. The Financial Matrix is built to name it instead of guessing at it.'},
 {t:'normal',k:'Fast Fives SOPs',title:'One documented way to run a job, not just what is in your head.',body:'Fast Fives and the Production Spreadsheet turn "how we do it" into a written, repeatable standard, so a crew is not reinventing the process on every job.'},
 {t:'normal',k:'Solution-Based Sales',title:'Sell fence on fit and value, not on discounting to close the job.',body:'A salesperson who can quote confidently without shaving the price protects the same margin the Financial Matrix is trying to grow in the first place.'},

 {t:'section',idx:'Why Shawn King',title:'Still Running The Company, Not Retired Into Consulting'},
 {t:'normal',k:'The credibility',title:'He was leading an install crew before he was old enough to drive.',body:'Shawn started in his family\'s fence business at 8, led a crew as a teenager, and was one of the youngest Certified Fence Professionals in AFA history by 22. He still runs Mr. Fence, an active fence company, alongside coaching the trade.',brand:true},

 {t:'section',idx:'Your Next Step',title:'Find Your Rhythm'},
 {t:'normal',k:'Book a Consultation',title:'A straight conversation about where your company actually stands today.',body:'No obligation, no upsell pressure. A conversation about your business with a coach who still runs a fence company himself, not someone teaching from memory.'},
 {t:'cta',title:'Ready to commit, learn, and lead?',chips:['Book a Consultation'],disc:'Educational content for fence company owners. No income or business result is guaranteed. Results vary by business, market, and execution.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#rail"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Mr. Fence <b>Academy</b> &middot; Shawn King</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=motif(s.arc);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
