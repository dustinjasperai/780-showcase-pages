<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 4 Numbers That Move Your Business - Michael Kaye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1E2E; --panel:#13293D; --rule:#2A4A63; --accent:#C9A24B; --ink:#EAF0F4;
    --muted:#9FB3C2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:48px 44px;margin:0 0 22px;min-height:360px;display:flex;flex-direction:column;justify-content:center}
  h1,h2,.kick{font-family:'Libre Baskerville',Georgia,serif}
  h1{font-size:40px;line-height:1.15;letter-spacing:-.01em}
  h2{font-size:28px;line-height:1.2;margin-bottom:16px}
  .kick{color:var(--accent);font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
  p{font-size:18px;color:var(--ink);margin-bottom:12px;max-width:62ch}
  .lead{font-size:22px}
  .muted{color:var(--muted)}
  .accent{color:var(--accent)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:18px;padding:10px 0 10px 26px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:18px;width:10px;height:10px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .num{font-family:'Libre Baskerville',serif;font-size:56px;color:var(--accent);line-height:1}
  .big{font-size:34px;font-family:'Libre Baskerville',serif;line-height:1.25}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch}
  .foot{margin-top:28px;font-size:13px;color:var(--muted);letter-spacing:.04em}
  .cta .big{color:var(--ink)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`<div class="kick">A live masterclass with Michael Kaye, The Business Coach</div><h1>The 4 Numbers That Move Your Business</h1><p class="lead muted">A pragmatic, results first session on the handful of numbers that actually move profit, clarity, leadership, and your time. Metrics and mentorship, no hype.</p>`},
  {t:'promise', cls:'', html:`<div class="kick">What you will leave with</div><h2>A bearing, not a pep talk</h2><ul><li>The four numbers a real coaching engagement has to move</li><li>How to read each one without a finance degree</li><li>A simple monthly rhythm to move them on purpose</li><li>One clear 12 month target for your business</li></ul>`},
  {t:'who', cls:'', html:`<div class="kick">Who this is for</div><h2>The owner who is working harder and seeing the same numbers</h2><p>You have built something real. You put in the hours. But revenue is flat, the team still needs you for everything, and you never get your evenings back. More effort has stopped buying more results.</p>`},
  {t:'trap', cls:'', html:`<div class="kick">The trap</div><p class="big">So you buy another course. You book another seminar. You get a weekend of motivation, and by Wednesday you are back exactly where you started.</p><p class="muted">The problem was never your effort or your attitude.</p>`},
  {t:'reframe', cls:'', html:`<div class="kick">A harder truth</div><p class="big">Recognition is nice. Activity feels like progress. But awards and busyness do not build a business. <span class="accent">Numbers that move</span> build a business.</p>`},
  {t:'part1', cls:'', html:`<div class="kick">Part one</div><h2>Most owners are flying blind on the few numbers that matter</h2><p>There are hundreds of things you could measure. Almost none of them change a decision. The owners who grow are not tracking more. They are tracking the right four, and acting on them every month.</p>`},
  {t:'part1b', cls:'', html:`<div class="kick">Part one</div><h2>Why motivation keeps failing you</h2><p>Motivation is a feeling, and feelings fade. A number is a fact, and a fact you look at every month changes what you do. That is the whole difference between a seminar high and a business that actually moves.</p>`},
  {t:'framework', cls:'', html:`<div class="kick">Part two - the method</div><h2>Metrics and Mentorship</h2><p>In 29 years coaching more than 5,000 companies, the model that works is simple and hard to fake. You pick the few numbers that matter, you read them on a fixed rhythm, and you have one person holding you accountable to act. Metrics tell you the truth. Mentorship makes you do something about it.</p>`},
  {t:'four', cls:'', html:`<div class="kick">Part two - the four numbers</div><h2>The four a coaching engagement has to move</h2><ul><li><span class="accent">Profit</span> - what the business actually keeps</li><li><span class="accent">Clarity</span> - one direction everyone can name</li><li><span class="accent">Leadership</span> - how well it runs when you step away</li><li><span class="accent">Time</span> - the hours you get back</li></ul>`},
  {t:'n1', cls:'', html:`<div class="num">1</div><h2>Profit, not just revenue</h2><p>Revenue flatters you. Profit tells the truth. We find the one margin or cost line that moves your take home the most, and we move it first. One number, read monthly, defended every month.</p>`},
  {t:'n2', cls:'', html:`<div class="num">2</div><h2>Clarity your whole team can repeat</h2><p>If your people cannot say in one sentence where the business is going this year, they cannot row in the same direction. We set one 12 month bearing and make it impossible to misread.</p>`},
  {t:'n3', cls:'', html:`<div class="num">3</div><h2>Leadership that does not depend on you</h2><p>A business that needs the owner for every decision is a job, not an asset. We build the standards and the accountability so results stop depending on you working harder.</p>`},
  {t:'n4', cls:'', html:`<div class="num">4</div><h2>Your time back</h2><p>Reclaimed time is the point, not the reward. When the first three numbers move, the hours come back to you. We track that on purpose, because a business that eats your life is not a success.</p>`},
  {t:'nav', cls:'', html:`<div class="kick">The frame - Sailing to Your Success</div><h2>You are the captain, not the engine</h2><p>Set a bearing. Read your instruments. Correct course when the conditions change. A good coach is not the wind and not the crew. A good coach is the navigator who keeps you honest about where the boat is actually heading.</p>`},
  {t:'cadence', cls:'', html:`<div class="kick">The rhythm</div><h2>What the month looks like</h2><ul><li>Look at the four numbers, honestly, every month</li><li>Pick the one that needs to move next</li><li>Decide the one action that moves it</li><li>Be held to it before the next month starts</li></ul>`},
  {t:'part3', cls:'', html:`<div class="kick">Part three - what it looks like</div><h2>A business that runs on standards, not heroics</h2><p>This is the idea behind my book, We Found Excellence. Excellence is not a burst of effort. It is a standard the business holds even on your worst week, because the numbers and the rhythm hold it for you.</p>`},
  {t:'whyme', cls:'', html:`<div class="kick">Why listen to me</div><h2>29 years, more than 5,000 companies</h2><p>I am Michael Kaye. I have coached owners of startups through to leaders inside Coca-Cola, General Motors, McDonald's, and NFL Properties. My whole approach is pragmatic and results first. Metrics and mentorship. I care a lot more about your results than about recognition.</p>`},
  {t:'recap', cls:'', html:`<div class="kick">To recap</div><h2>Four numbers. One rhythm. One navigator.</h2><p>Profit, clarity, leadership, and your time. Read them every month, move one at a time, and have someone keep you honest. That is how a business moves on purpose instead of by accident.</p>`},
  {t:'cta', cls:'cta', html:`<div class="kick">Your next step</div><p class="big">Let's look at your four numbers together.</p><p>Book a free 45 minute coaching session with me. We will pick the one number that matters most for you right now and the first move to make. No charge, no pressure.</p><p class="foot">The Business Coach, Michael Kaye - thebusinesscoach.com</p><p class="disc">Educational session only. Nothing here is financial, legal, or professional advice. No income, role, or result is guaranteed and results vary by business, market, and effort.</p>`}
];
const deck=document.getElementById('deck');
S.forEach(s=>{const d=document.createElement('section');d.className='slide '+(s.cls||'');d.innerHTML=s.html;deck.appendChild(d);});
</script>
</body>
</html>
