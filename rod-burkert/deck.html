<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Becoming the Recognized Authority in Your BVFLS Market · Rod Burkert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1b1a24; --panel:#262433; --rule:#3a3850;
    --acc:#fc7f00; --idx:#c9b8ea; --chalk:#f3f1ea; --grey:#cac6d9; --dim:#8b87a0;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Inter',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'DM Sans',Georgia,serif;font-weight:500;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.1vw;max-width:88%}
  .t-normal h1{font-size:3.2vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#332b47 0%,#0e0d14 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:86%;font-style:italic;color:#f6f4ee}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#332b47 0%,#0e0d14 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#ffd9ad;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .ledger-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-ledger{right:7.5%;bottom:8%;width:20vw}
  .corner-ledger{right:6%;bottom:7.5%;width:9vw;opacity:.42}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Burkert Valuation Advisors</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ledger motif: ascending appraisal tick marks building toward a total, diamond at the apex -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ledger" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="128" x2="246" y2="128" stroke="#c9b8ea" opacity="0.3"/>
    <line x1="40" y1="128" x2="40" y2="104" stroke="#fc7f00" opacity="0.55"/>
    <line x1="76" y1="128" x2="76" y2="88" stroke="#fc7f00" opacity="0.65"/>
    <line x1="112" y1="128" x2="112" y2="68" stroke="#fc7f00" opacity="0.78"/>
    <line x1="148" y1="128" x2="148" y2="48" stroke="#fc7f00" opacity="0.9"/>
    <line x1="184" y1="128" x2="184" y2="30" stroke="#f3f1ea" opacity="0.95"/>
    <rect x="177" y="16" width="14" height="14" transform="rotate(45 184 23)" fill="none" stroke="#fc7f00" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Becoming the Recognized Authority in Your BVFLS Market',sub:'A masterclass for owners of 1-3 person business valuation, forensic, and litigation support firms.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You do excellent technical work. Almost nobody outside your circle knows it.',body:'Valuations that hold up. Reports that survive cross-examination. Referral sources who trust your numbers. But outside that circle, most BVFLS owners are the best-kept secret in their own market.'},
 {t:'dark',title:'Being the best valuator in the room does not make you the first name anyone thinks of.'},

 {t:'section',idx:'Part One',title:'The Trap'},
 {t:'normal',k:'The technical trap',title:'Technical excellence and market visibility are different skills.',body:'Nothing about the CVA exam or a defensible report teaches you how to become known. Most BVFLS owners assume the work speaks for itself. It does not, not to the referral sources and firm owners who have never heard your name.'},
 {t:'normal',k:'The cost of staying quiet',title:'Every year you stay unknown, a less experienced name becomes the local one instead.',body:'Referral sources need someone to call. If it is not you, it is whoever showed up in their feed, their inbox, or their community last.'},
 {t:'dark',title:'A full calendar today does not protect you from being forgotten tomorrow.'},

 {t:'section',idx:'Part Two',title:'The Authority-Building Method'},
 {t:'normal',k:'Know what to keep',title:'The File Autopsy Toolkit: know which files and clients actually build your name.',body:'A structured look at the work you like doing, the clients you enjoy serving, and how you price it, next to the work you do not like, the clients you do not want, and the pricing mistakes that quietly cap what you are known for.'},
 {t:'normal',k:'Build the authority',title:'The Practice Builder Bootcamp: six sessions built for rainmaker authority.',body:'A structured, six-hour blueprint built specifically to establish rainmaker authority for a BVFLS practice owner. Not generic marketing advice, a method built by a practicing valuator for practicing valuators.'},
 {t:'normal',k:'Know where you stand',title:'The Practice Self-Assessment: find out what is actually holding your visibility back.',body:'A diagnostic covering both the practice and the practitioner, personally reviewed, followed by a short call to walk through what needs attention next.'},
 {t:'dark',title:'Authority is not accidental. It is the outcome of a method, run on purpose.'},

 {t:'section',idx:'Part Three',title:'What It Looks Like'},
 {t:'normal',k:'The practice this builds',title:'Referral sources who call you first, not last.',body:'A BVFLS owner known for a specific kind of work, priced right, in front of the right referral sources consistently, instead of hoping the next opportunity finds them.'},
 {t:'dark',title:'The market does not reward the best technician. It rewards the technician everyone already knows.'},
 {t:'normal',k:'Why Rod Burkert',title:'Decades in practice, recognized by the association itself.',body:'Rod Burkert, CPA/ABV, CVA, has practiced valuation since the late 1980s and run his own firm, Burkert Valuation Advisors, since 2000. His coaching is listed by NACVA on the association’s own member portal as a recommended practice-growth resource for BVFLS firm owners.'},

 {t:'section',idx:'Your Next Step',title:'Turn the Practice You Have Into the Practice You Want'},
 {t:'normal',k:'Start with the assessment',title:'The free Practice Self-Assessment.',body:'A short, personally reviewed diagnostic covering your practice and you, followed by a call to talk through what needs attention first.'},
 {t:'normal',k:'Go deeper',title:'The Practice Builder Bootcamp.',body:'Six sessions, six hours, built to establish your authority as the rainmaker in your market. Custom firm training also available, for 1 to 100 people, virtual or in person.'},
 {t:'cta',title:'Ready to turn the practice you have into the practice you want?',chips:['Take the Practice Self-Assessment','Book your call'],disc:'Educational content for BVFLS firm owners. No income, client, or practice-growth result is guaranteed. Results vary by practitioner, market, and effort.'},
];

const deck=document.getElementById('deck');
function ledger(kind){return `<svg class="ledger-motif ${kind==='title'?'title-ledger':'corner-ledger'}"><use href="#ledger"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Burkert Valuation Advisors <b>&middot; BVA Coaching</b> &middot; Rod Burkert, CPA/ABV, CVA</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=ledger(s.arc);
  else if(s.t==='title') h+=ledger('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
