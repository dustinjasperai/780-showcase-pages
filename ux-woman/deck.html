<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masterclass - Land a Six-Figure Fortune 500 UX Job</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f1;
    --panel:#ffffff;
    --rule:#cfdedb;
    --ink:#10211e;
    --accent:#07443d;
    --mut:#5b6b67;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:48px 52px;margin:20px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:18px}
  h1{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:40px;line-height:1.12;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:30px;line-height:1.15;margin-bottom:16px}
  p{font-size:19px;color:var(--ink);margin-bottom:14px;max-width:62ch}
  p.lead{font-size:22px}
  .mut{color:var(--mut)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:18px;padding:11px 0 11px 30px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .k{font-family:"IBM Plex Mono",monospace;color:var(--accent);font-weight:600}
  .big{font-family:"IBM Plex Mono",monospace;font-size:64px;font-weight:600;color:var(--accent);line-height:1}
  .foot{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mut);margin-top:26px;letter-spacing:.04em}
  .disc{font-size:13px;color:var(--mut);margin-top:20px;max-width:64ch;line-height:1.5}
  .title-slide{min-height:520px}
  .title-slide h1{font-size:48px}
  .pres{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--mut);margin-top:24px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', tag:'// UX Woman - Live Masterclass',
    h:'How to Land a Six-Figure Fortune 500 UX Job as a Woman in Tech',
    p:'A live, 60-minute working session on the path from "self-taught and invisible" to a signed six-figure offer, and what it really takes to be seen.',
    pres:'Presented live by Samaya Sinha, Founder of UX Woman' },

  {t:'who', tag:'// Who this is for',
    h:'You can design. You just can not get in the room.',
    items:['You are a woman, immigrant, BIPOC or LGBTQ+ designer who taught yourself the craft',
           'Your portfolio is solid, but recruiters scroll past it',
           'You are competing against 400 applicants for every entry-level UX role',
           'You keep hearing "we went with someone more senior"'] },

  {t:'hook', tag:'// The uncomfortable truth',
    h:'The job market is not rewarding the best designer. It is rewarding the most legible one.',
    p:'Hiring managers spend seconds on a portfolio. If yours looks like every bootcamp graduate\'s, you are invisible, no matter how good the work is. Skill gets you considered. Positioning gets you hired.' },

  {t:'part', tag:'// Part One', h:'Why talented women stall at the door' },

  {t:'point', tag:'// Problem 1',
    h:'Everyone is taught the same three case studies',
    p:'Redesign a food app. Fix a banking flow. A meditation app. When every candidate scopes the same safe project, the portfolio stops being a differentiator and becomes noise.' },

  {t:'point', tag:'// Problem 2',
    h:'Craft is taught. Being seen is not.',
    p:'Most programs stop at Figma and heuristics. Nobody teaches you how to turn your work into a story a stakeholder buys, or how to advocate for yourself once the door opens. That gap is where careers stall.' },

  {t:'point', tag:'// Problem 3',
    h:'Waiting for permission is the silent career killer',
    p:'Underrepresented designers are trained to wait to be chosen: wait to be qualified enough, senior enough, ready enough. The market does not reward waiting. It rewards the person who moves first.' },

  {t:'part', tag:'// Part Two', h:'The UX Woman method: three moves that make you un-ignorable' },

  {t:'point', tag:'// Move 1 - Delusional by Design',
    h:'Pick the unhinged project on purpose',
    p:'Delusional by Design is the idea that ambitious, "unreasonable" project choices are what create a creative career leap. Instead of the safe redesign, you scope one differentiated 0-to-1 problem, grounded in Blue Ocean thinking, that no other candidate in the stack is showing.' },

  {t:'point', tag:'// Move 2 - Story over screens',
    h:'Design the narrative, not just the interface',
    p:'A portfolio that gets interviews is 3 to 5 case studies built as stories: the business problem, the research, the hard tradeoff, the measurable impact. UX storytelling is how you turn a Figma file into stakeholder buy-in, in the portfolio and in the room.' },

  {t:'point', tag:'// Move 3 - Power Without Permission',
    h:'Take up space before you feel ready',
    p:'Power Without Permission is the playbook for navigating tech and UX workplace dynamics as a woman or outsider: how to negotiate, how to advocate, how to lead design strategy without waiting to be handed the authority. This is the part that protects the six-figure offer after you win it.' },

  {t:'point', tag:'// How the moves compound',
    h:'Differentiated work + a story + presence',
    items:['A project recruiters have never seen opens the conversation',
           'A narrative that names business impact earns the interview',
           'Presence and self-advocacy convert the interview into an offer',
           'The same three moves get you promoted once you are in'] },

  {t:'part', tag:'// Part Three', h:'What seven months of this actually builds' },

  {t:'point', tag:'// The arc',
    h:'Research and strategy, then craft, then the job',
    items:['Months 1-2: UX research, business strategy, scoping your 0-to-1 project',
           'Months 3-4: design systems, UX heuristics, high-fidelity work, storytelling',
           'Months 5-7: A/B-tested resume, LinkedIn, a 3-to-5 case-study portfolio, interview prep',
           'After: alumni coaching, real consulting projects, and a community of allies'] },

  {t:'point', tag:'// Why me',
    h:'I have sat on both sides of the table',
    p:'I am Samaya Sinha, a Lead Product Designer with 10+ years across startups, consulting and Fortune 500 teams, with design work tied to brands like Disney, Hulu, Marvel, Ford and Meta. Carnegie Mellon engineering, Penn product design. I built UX Woman so the people the industry overlooks get a fair shot.' },

  {t:'point', tag:'// The community',
    h:'You are not doing this alone',
    p:'75,000 learners, a team of mentor-allies invested in your success, and highly personalized coaching in simple, clear language. The goal is not just a job. It is a career you can defend and grow.' },

  {t:'point', tag:'// The reframe',
    h:'Stop auditioning. Start being chosen.',
    p:'The designers who break through are not the most credentialed. They are the ones who show differentiated work, tell it as a story, and carry themselves like they already belong. That is a learnable system, not a personality trait.' },

  {t:'recap', tag:'// In one sentence',
    h:'Be un-ignorable, then be un-overlookable',
    items:['Delusional by Design: the project no one else dares to scope',
           'Story over screens: the case study that names business impact',
           'Power Without Permission: the presence that wins and keeps the offer'] },

  {t:'cta', tag:'// Your next step',
    h:'Ready to build the career, not just the portfolio?',
    p:'Take the UX Personality Quiz to find your path, then apply for the next live cohort of the 7-Month UX Design Accelerator at uxwoman.com.',
    disc:'This masterclass is educational. No specific job, salary, or outcome is guaranteed; results vary with your effort, experience, and the job market. UX Woman is a program of Ideate Innovation Labs LLC.' }
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title' ? ' title-slide' : '');
  let html = '';
  if (s.tag) html += '<div class="tag">'+s.tag+'</div>';
  if (s.t==='title'){
    html += '<h1>'+s.h+'</h1>';
    if (s.p) html += '<p class="lead mut">'+s.p+'</p>';
    if (s.pres) html += '<div class="pres">'+s.pres+'</div>';
  } else if (s.t==='part'){
    html += '<h1>'+s.h+'</h1>';
  } else {
    html += '<h2>'+s.h+'</h2>';
    if (s.p) html += '<p>'+s.p+'</p>';
    if (s.items){ html += '<ul>'; for (const it of s.items) html += '<li>'+it+'</li>'; html += '</ul>'; }
    if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  }
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
