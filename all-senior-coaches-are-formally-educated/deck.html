<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command the Room | The Speech Improvement Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;        /* warm paper, softened from their white ground */
    --panel:#ffffff;
    --rule:#e4e2db;
    --ink:#242121;       /* their ranked dark */
    --muted:#55524d;
    --accent:#006043;    /* their link green, verbatim from brand.json */
    --serif:'Libre Baskerville',Georgia,serif;
    --sans:'Raleway',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:52px 56px;margin:0 0 20px;min-height:440px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  .num{position:absolute;top:22px;right:28px;font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.08em}
  h1{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1.14;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.18;margin-bottom:18px}
  .big{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.16;margin-bottom:14px}
  p{font-size:19px;color:var(--muted);margin-bottom:14px;max-width:62ch}
  p.lead{font-size:21px;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;color:var(--ink);padding:14px 0 14px 46px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li .n{position:absolute;left:0;top:14px;font-family:var(--serif);font-weight:700;color:var(--accent);font-size:19px}
  li .sub{display:block;font-size:16px;color:var(--muted);margin-top:4px}
  .promise{font-size:18px;color:var(--ink);margin-top:10px;border-left:3px solid var(--accent);padding-left:16px}
  .cred{display:flex;gap:40px;flex-wrap:wrap;margin-top:18px}
  .cred div{min-width:120px}
  .cred .fig{font-family:var(--serif);font-weight:700;font-size:34px;color:var(--accent)}
  .cred .cap{font-size:14px;color:var(--muted);margin-top:4px}
  .cta{background:var(--ink);color:#fff}
  .cta h2{color:#fff}
  .cta p{color:#cfcdc8}
  .cta .step{display:inline-block;margin-top:14px;font-family:var(--sans);font-weight:600;font-size:17px;color:#fff;border:1px solid var(--accent);border-radius:8px;padding:14px 26px}
  .disc{font-size:13px;color:#9a9893;margin-top:26px;max-width:66ch;line-height:1.5}
  .footer-note{text-align:center;font-size:13px;color:var(--muted);font-family:var(--sans);padding:6px 0 0}
  @media(max-width:620px){.slide{padding:34px 24px;min-height:auto}h1{font-size:32px}h2{font-size:25px}.big{font-size:28px}p,li{font-size:17px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A communication masterclass from The Speech Improvement Company',
   h:'Command the Room: The Hidden Structure Behind Every High-Stakes Message',
   promise:'In the next 60 minutes you will learn the repeatable structure our coaches have used since 1964 to help executives sound clear, credible, and in control when the stakes are highest.'},

  {t:'who',
   kicker:'Who this is for',
   h:'For the executive who is already good, and still loses the room',
   body:'You brief the board, pitch investors, run the all-hands, and have the tough one-on-one. You know your material cold. And yet some of the most important messages you deliver land softer than they should.',
   promise:'If you are a senior leader, founder, or executive who has to be understood when it matters most, this is built for you.'},

  {t:'trap',
   kicker:'The trap',
   h:'More slides, more rehearsal, more confidence tips',
   body:'The usual advice treats communication like a performance problem. Breathe. Make eye contact. Practice the opening. So you polish delivery and the message still does not move the room, because the problem was never your nerves.'},

  {t:'reframe',
   kicker:'The reframe',
   big:'The room does not reward the most polished speaker. It rewards the clearest structure.',
   body:'An executive with an average voice and a clear structure beats a charismatic one who is improvising every time. Structure is the variable almost nobody is actually coached on, and it is the one you can control.'},

  {t:'cost',
   kicker:'What it costs',
   h:'An unstructured message is expensive',
   body:'Every message that lands soft has a price. The decision slips a week. The investor stays unsure. The team leaves the room with three different versions of what you said, and you spend the next month correcting them one by one.',
   promise:'The higher you sit, the more each unclear message costs the people below you, who now repeat the confusion down the line.'},

  {t:'section',
   kicker:'Part one',
   h:'Why talented leaders still lose the room',
   body:'Three failures show up again and again, and none of them are about confidence.'},

  {t:'list',
   kicker:'Part one',
   h:'The three ways a strong message gets lost',
   items:[
     {n:'1',t:'You lead with the data, not the point.',s:'The room is doing the work of assembling your conclusion while you talk. Most of them give up before you get there.'},
     {n:'2',t:'You make one appeal, not three.',s:'Logic alone, or passion alone, or credibility alone. The room needs all three, in the right order, to actually move.'},
     {n:'3',t:'You use the same shape for every situation.',s:'A board update, an investor story, and a hard conversation each need a different structure. One default shape cannot carry all three.'}
   ]},

  {t:'section',
   kicker:'Part two',
   h:'The structure our coaches teach',
   body:'This is the method taught at Harvard, Johns Hopkins, and in MBA programs, and translated into twelve languages. Four moves.'},

  {t:'list',
   kicker:'Part two, move one',
   h:'Choose your order: inductive or deductive',
   items:[
     {n:'A',t:'Deductive: point first, then support.',s:'Use it when the room is busy, senior, or skeptical. They get the conclusion up front and spend their attention evaluating it, not hunting for it.'},
     {n:'B',t:'Inductive: build the case, then land the point.',s:'Use it when the conclusion is hard to accept cold. You walk them to it so they arrive on their own.'}
   ],
   promise:'Picking the order on purpose, before you build a single slide, is the first thing most executives have never been taught to do.'},

  {t:'list',
   kicker:'Part two, move two',
   h:'Build all three appeals, in order: ethos, pathos, logos',
   items:[
     {n:'1',t:'Ethos. Earn the right to be heard.',s:'Why you, why now. Establish credibility before you ask the room to follow you anywhere.'},
     {n:'2',t:'Pathos. Make them care.',s:'Connect the message to what the room actually wants or fears. Logic does not move people who do not yet care.'},
     {n:'3',t:'Logos. Give them the reasoning.',s:'Now the data lands, because you have earned trust and created stakes first.'}
   ]},

  {t:'quote',
   kicker:'Part two, move three',
   big:'Tell the story.',
   body:'Every executive has heard it, and almost nobody is told what it means. A story is not an anecdote dropped into slide twelve. It is a shape: a situation, a tension, and a resolution the room can follow. The structure above is how you build one on purpose.'},

  {t:'example',
   kicker:'Part two, applied',
   h:'The same board update, two ways',
   items:[
     {n:'Before',t:'Twelve slides of context, conclusion buried on slide eleven.',s:'The board spends the meeting guessing where you are headed, and asks the real questions after you sit down.'},
     {n:'After',t:'Point first, three appeals, one clear ask.',s:'Credibility, then why it matters, then the numbers, then the decision you need. The room follows and decides in the room.'}
   ],
   promise:'Same facts, same executive, same twenty minutes. Only the structure changed.'},

  {t:'list',
   kicker:'Part two, move four',
   h:'Reuse the six formats, do not start from blank',
   items:[
     {n:'',t:'A small set of repeatable formats sits behind every strong presentation, negotiation, and meeting.',s:'The board update has a shape. The investor story has a shape. The difficult conversation has a shape. You stop improvising structure under pressure and reuse the one that fits.'}
   ],
   promise:'This is the difference between preparing for twenty minutes and preparing for two hours. Same clarity, a fraction of the effort.'},

  {t:'section',
   kicker:'Part three',
   h:'What changes once the structure is yours',
   body:'The change is not that you become a different person. It is that your best thinking survives the trip from your head to the room.'},

  {t:'quote',
   kicker:'Part three',
   big:'You stop rehearsing to hide the gaps, and start building so there are none.',
   body:'Confidence stops being something you manufacture before you walk in. It becomes a byproduct of knowing the shape of what you are about to say is already right.'},

  {t:'list',
   kicker:'Part three',
   h:'Three things change',
   items:[
     {n:'1',t:'You decide the shape before the slides.',s:'Order, appeals, and format are chosen on purpose, so the build is faster and the delivery is calmer.'},
     {n:'2',t:'The room follows you the first time.',s:'Fewer clarifying questions, fewer re-explanations, fewer meetings to undo the last one.'},
     {n:'3',t:'High-stakes moments stop being a gamble.',s:'Board, investors, and hard conversations run on a structure you trust instead of hope.'}
   ]},

  {t:'cred',
   kicker:'Why learn this from us',
   h:'Sixty years of coaching the highest-stakes rooms',
   body:'The Speech Improvement Company is the oldest speech coaching and training firm in the United States. Our coaches are formally educated communication specialists, and we have coached executives, founders, boards, and public figures since 1964.',
   figs:[
     {fig:'1964',cap:'Founded. The oldest firm of its kind in the US.'},
     {fig:'12',cap:'Languages our framework is published in.'},
     {fig:'Harvard',cap:'Among the schools that teach our method.'}
   ]},

  {t:'cta',
   kicker:'Your next step',
   h:'Work on the message that matters most to you',
   body:'If there is a board meeting, an investor presentation, or a conversation coming up where you cannot afford to lose the room, bring it to a coach. We will build the structure with you and rehearse it live until it lands.',
   step:'Speak with a coach at The Speech Improvement Company',
   disc:'Educational content only. Coaching outcomes depend on each participant, their situation, and the work they put in. No specific result, promotion, or business outcome is promised or guaranteed.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let html='<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h) html+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.body) html+='<p class="lead">'+s.body+'</p>';
  if(s.items){
    html+='<ul>';
    s.items.forEach(it=>{html+='<li>'+(it.n?'<span class="n">'+it.n+'</span>':'')+it.t+(it.s?'<span class="sub">'+it.s+'</span>':'')+'</li>';});
    html+='</ul>';
  }
  if(s.figs){
    html+='<div class="cred">';
    s.figs.forEach(f=>{html+='<div><div class="fig">'+f.fig+'</div><div class="cap">'+f.cap+'</div></div>';});
    html+='</div>';
  }
  if(s.promise) html+='<div class="promise">'+s.promise+'</div>';
  if(s.step) html+='<div><span class="step">'+s.step+'</span></div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
const fn=document.createElement('div');
fn.className='footer-note';
fn.textContent='The Speech Improvement Company  ·  Communication coaching since 1964';
deck.appendChild(fn);
</script>
</body>
</html>
