<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Becoming a Chief of Staff — Your Chief of Staff with Elise Kennedy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Bitter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f9f7ee;
    --panel:#fffdf7;
    --rule:#e7e0d2;
    --ink:#36302a;
    --ink-soft:#574c3f;
    --accent:#574c3f;
    --sand:#b9a590;
  }
  html,body{height:100%}
  body{
    font-family:'Bitter',Georgia,serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .deck{max-width:960px;margin:0 auto}
  .slide{
    min-height:100vh;
    display:none;
    flex-direction:column;
    justify-content:center;
    padding:72px 68px;
    position:relative;
  }
  .slide.active{display:flex}
  .kicker{
    font-family:'Manrope',sans-serif;
    font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--sand);margin-bottom:22px;
  }
  h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:54px;line-height:1.08;letter-spacing:-.02em;color:var(--ink);margin-bottom:24px}
  h2{font-family:'Manrope',sans-serif;font-weight:700;font-size:38px;line-height:1.14;letter-spacing:-.015em;color:var(--ink);margin-bottom:20px}
  .promise{font-size:23px;line-height:1.5;color:var(--ink-soft);max-width:30em}
  p{font-size:21px;line-height:1.55;color:var(--ink-soft);max-width:34em;margin-bottom:16px}
  .lead{font-size:25px;color:var(--ink);font-weight:500}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:21px;line-height:1.5;color:var(--ink-soft);padding-left:30px;position:relative;margin-bottom:16px;max-width:34em}
  li::before{content:"";position:absolute;left:0;top:13px;width:14px;height:2px;background:var(--accent)}
  li strong{color:var(--ink);font-weight:600}
  .big-num{font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:14px}
  .rule{width:64px;height:3px;background:var(--accent);margin:0 0 26px}
  .quote{font-size:30px;line-height:1.32;color:var(--ink);font-weight:500;font-style:italic;max-width:24em}
  .foot{position:absolute;left:68px;bottom:34px;font-family:'Manrope',sans-serif;font-size:12px;letter-spacing:.06em;color:var(--sand)}
  .cta-box{margin-top:14px;padding:26px 30px;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);max-width:34em}
  .cta-box .step{font-family:'Manrope',sans-serif;font-weight:700;font-size:22px;color:var(--ink);margin-bottom:8px}
  .disclaimer{margin-top:26px;font-family:'Manrope',sans-serif;font-size:13px;line-height:1.5;color:var(--sand);max-width:36em}
  .nav{position:fixed;right:22px;bottom:20px;font-family:'Manrope',sans-serif;font-size:13px;color:var(--ink-soft);background:var(--panel);border:1px solid var(--rule);border-radius:30px;padding:8px 16px;z-index:10}
  .nav b{color:var(--ink)}
  .credit{display:flex;gap:40px;margin-top:20px;flex-wrap:wrap}
  .credit div{font-family:'Manrope',sans-serif}
  .credit .n{font-size:40px;font-weight:800;color:var(--accent);line-height:1}
  .credit .l{font-size:14px;color:var(--ink-soft);margin-top:6px;max-width:9em}
  @media(max-width:640px){.slide{padding:48px 28px}h1{font-size:34px}h2{font-size:27px}.quote{font-size:23px}.foot,.nav{display:none}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav"><b id="cur">1</b> / <span id="tot">1</span> &nbsp;·&nbsp; → to advance</div>
<script>
const S = [
  {t:'title', kicker:'Your Chief of Staff · A Masterclass with Elise Kennedy',
   title:'Becoming a Chief of Staff',
   promise:'The trust-first path into the room where decisions get made, without waiting for a certification or the perfect resume.'},

  {t:'agenda', kicker:'What we\'ll cover',
   h:'Three moves and two numbers.',
   items:['Why the way into the role is trust, not a credential','The three-move Trust-First Path I have used three times','The skills that keep you in the room once you are there','The two numbers that prove, after a year, that it worked']},

  {t:'audience', kicker:'Who this is for',
   h:'You already do the work. You just don\'t have the title yet.',
   body:'This is for the operators, senior EAs, ex-founders, and strategy and ops people who keep the whole thing running and want the seat beside the principal. You can see the role clearly. What you can\'t see is the way in.'},

  {t:'trap', kicker:'The trap',
   h:'You think the gap is a credential.',
   body:'So you look at certifications, you rewrite the resume again, you wait to feel ready. Meanwhile the people getting hired as Chief of Staff rarely applied through a job board at all. The way in was never a document.'},

  {t:'reframe', kicker:'The reframe',
   quote:'The number one thing you need to become a Chief of Staff is the trust of the principal. Not a certificate. Trust.'},

  {t:'myth', kicker:'The resume myth',
   h:'The resume is the last thing that moves.',
   body:'The role is high-stakes and discreet, so principals hire for trust before they hire for a title on a page. By the time your resume matters, the trust has already decided it. Build the trust and the resume writes itself.'},

  {t:'part', num:'Part One', h:'The role has no job description.',
   body:'No two Chiefs of Staff are alike. The job is connective tissue: strategic vision in one meeting, operational cleanup in the next, discretion in all of them. You cannot credential your way into a role that refuses to be defined. You earn it by being trusted inside it.'},

  {t:'quote-mid', kicker:'What the role actually is',
   quote:'A Chief of Staff is an organizational chameleon. The two hallmarks are discretion and empathy.'},

  {t:'part', num:'Part Two', h:'The Trust-First Path',
   body:'There are three moves, and none of them require you to leave your current seat to start. This is the path I used three times, and the one I coach aspiring Chiefs through.'},

  {t:'pillar', big:'Move One', h:'Earn the principal\'s trust',
   body:'The role is handed to the person the principal already relies on in high-stakes moments. Become that person where you are now. Most Chiefs of Staff either knew the principal or had someone who could vouch for them both.'},

  {t:'pillar', big:'Move Two', h:'Build trust across every department',
   body:'Getting the role takes the principal\'s trust. Succeeding in it takes trust across the whole org. You are the bridge between the C-suite and the floor, and the bridge only holds if both sides believe you are on their side.'},

  {t:'pillar', big:'Move Three', h:'Do the job before you have the title',
   body:'The fastest way in is to start acting as the connective tissue right where you sit. Take the cross-functional problem no one owns. Run the offsite. Build the trust and the track record first, and the title follows the evidence.'},

  {t:'stack', kicker:'The skills that compound',
   h:'The upskilling stack',
   body:'Trust opens the door. These keep you in the room:',
   items:['<strong>Financial modeling</strong>, so you can speak to the numbers the principal cares about','<strong>Data analysis</strong> (SQL and Python), so you bring answers, not just questions','<strong>AI adoption</strong>, so you make the whole org faster','<strong>EQ</strong>, the hallmark that makes all of the above land']},

  {t:'fractional', kicker:'More than one door',
   h:'The seat does not have to be full-time.',
   body:'Once you can earn trust and run the connective work, you can do it fractionally, for one founder or several. For a lot of operators the fractional Chief of Staff route is the fastest way to start doing the job and getting paid for it before anyone hands you the full title.'},

  {t:'part', num:'Part Three', h:'What a year of this looks like',
   body:'You do not measure a Chief of Staff by activity. You measure by what changed around the principal.'},

  {t:'scoreboard', kicker:'The year-one scoreboard',
   h:'Two numbers tell you it worked',
   items:['After one year, <strong>the CEO\'s calendar</strong> has shifted almost entirely to the things only the CEO can do. Everything they could hand off, you took.','After one year, <strong>C-suite job satisfaction</strong> has gone up, because the executive team finally has the connective tissue it was missing.']},

  {t:'recap', kicker:'The whole path in one line',
   quote:'Earn the trust, do the job before the title, and let the evidence hand you the role.'},

  {t:'credit', kicker:'Why learn this from me',
   h:'I have taken this path three times.',
   body:'Fifteen years in early-stage startups. Three times a Chief of Staff. Two exits, one acquired by Nubank.',
   credits:[['3x','Chief of Staff'],['2','company exits'],['15','years in startups']]},

  {t:'cta', kicker:'Your next step',
   h:'Let\'s build your way in.',
   body:'If you want the trust-first path mapped to your actual situation, your principal, your org, your timeline, that is what I coach.',
   step:'Book a time with Elise',
   sub:'We\'ll look at where you sit now and the shortest honest route to the Chief of Staff seat.',
   disc:'This masterclass is educational. No role, hire, or income result is guaranteed. Results vary with your situation, your relationships, and your effort.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const sec = document.createElement('section');
  sec.className = 'slide' + (i===0?' active':'');
  let html = '';
  if(s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if(s.num) html += `<div class="big-num">${s.num}</div>`;
  if(s.big) html += `<div class="big-num">${s.big}</div>`;
  if(s.title){ html += `<h1>${s.title}</h1>`; if(s.promise) html += `<div class="rule"></div><p class="promise">${s.promise}</p>`; }
  if(s.quote) html += `<div class="rule"></div><p class="quote">"${s.quote}"</p>`;
  if(s.h) html += `<h2>${s.h}</h2>`;
  if(s.body) html += `<p class="lead">${s.body}</p>`;
  if(s.items){ html += '<ul>'; s.items.forEach(it=>html+=`<li>${it}</li>`); html += '</ul>'; }
  if(s.credits){ html += '<div class="credit">'; s.credits.forEach(c=>html+=`<div><div class="n">${c[0]}</div><div class="l">${c[1]}</div></div>`); html += '</div>'; }
  if(s.step){ html += `<div class="cta-box"><div class="step">${s.step}</div><div style="font-family:'Manrope',sans-serif;font-size:16px;color:var(--ink-soft)">${s.sub}</div></div>`; }
  if(s.disc) html += `<div class="disclaimer">${s.disc}</div>`;
  html += `<div class="foot">Your Chief of Staff · Elise Kennedy</div>`;
  sec.innerHTML = html;
  deck.appendChild(sec);
});

let cur = 0;
const slides = document.querySelectorAll('.slide');
document.getElementById('tot').textContent = slides.length;
function go(n){ slides[cur].classList.remove('active'); cur=(n+slides.length)%slides.length; slides[cur].classList.add('active'); document.getElementById('cur').textContent=cur+1; window.scrollTo(0,0); }
document.addEventListener('keydown',e=>{ if(['ArrowRight','ArrowDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1);} if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();go(cur-1);} });
document.addEventListener('click',e=>{ if(!e.target.closest('a')) go(cur+1); });
</script>
</body>
</html>
