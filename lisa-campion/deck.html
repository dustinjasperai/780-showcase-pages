<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Gifted to Professional - A Masterclass with Lisa Campion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0edf5;        /* pale indigo wash - 6% tint of her #2c214c (brand.json), light scheme */
    --panel:#faf8fd;     /* near-white, warmed toward her indigo */
    --ink:#2c214c;       /* mystic indigo - her H2/heading color (brand.json, 18 uses) */
    --body:#2a2630;
    --rule:#2c214c;
    --secondary:#144f66; /* deep teal - her dominant brand color (brand.json, 30 uses) */
    --accent:#2c214c;    /* deck accent, traceable to ## Palette (indigo) */
    --gold:#e9c29a;      /* warm gold highlight - her accent (brand.json) */
    --display:'Raleway',system-ui,sans-serif;
    --text:'Albert Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e8e4dd;font-family:var(--text);color:var(--body);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
  .slide{background:var(--bg);border:1px solid #e3ddd2;border-radius:14px;padding:56px 60px;
    margin:0 0 22px;min-height:430px;display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
    background:linear-gradient(180deg,var(--secondary),var(--accent))}
  .wave{position:absolute;right:46px;top:40px;width:120px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,transparent,var(--gold),var(--secondary))}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--secondary);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;color:var(--ink);font-size:46px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;color:var(--ink);font-size:33px;line-height:1.14;
    margin-bottom:16px}
  p{font-size:19px;max-width:40em;margin-bottom:14px}
  .lead{font-size:22px;color:var(--ink);font-weight:500}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;padding:11px 0 11px 30px;position:relative;border-bottom:1px solid #e7e1d6;max-width:44em}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:50%;
    background:var(--gold);border:2px solid var(--secondary)}
  li b{font-family:var(--display);color:var(--ink);font-weight:700}
  .big{font-size:30px;color:var(--ink);font-weight:600;max-width:30em;line-height:1.25}
  .kicker{color:var(--secondary);font-weight:700}
  .num{font-family:var(--display);font-weight:800;color:var(--gold);font-size:15px;
    letter-spacing:.14em;text-transform:uppercase}
  .cta-slide{background:linear-gradient(135deg,#2c214c,#144f66);border:none}
  .cta-slide::before{display:none}
  .cta-slide .eyebrow{color:var(--gold)}
  .cta-slide h1,.cta-slide h2{color:#fff}
  .cta-slide p{color:#efeaf5}
  .step{font-family:var(--display);font-weight:700;color:#fff;font-size:22px;
    background:rgba(255,255,255,.12);border-radius:10px;padding:14px 18px;margin:8px 0;max-width:34em}
  .disclaimer{font-size:14px;color:#d7cfe6;margin-top:22px;max-width:46em;line-height:1.5}
  .pres{font-family:var(--display);font-weight:600;color:var(--secondary);font-size:18px;margin-top:8px}
  .foot{font-size:13px;color:#8a8398;margin-top:auto;padding-top:26px;font-family:var(--display);
    letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass',
    h1:'From Gifted to Professional',
    lead:'The four skills that turn a natural healer into a working psychic healer with a full, thriving practice.',
    pres:'With Lisa Campion - psychic, Reiki master teacher, author of The Art of Psychic Reiki' },

  {t:'content', eyebrow:'The promise', h2:'By the end of this hour.',
    bullets:[['A clear path','You will see exactly what separates a hobbyist from a working professional healer.'],
             ['The four skills','You will know the four things you must master, and where you are strong and where the gaps are.'],
             ['A real decision','You will know whether going pro is your next step, and what the 12-month path looks like.']] },

  {t:'content', eyebrow:'Who this is for', h2:'You know you have the gift.',
    p:['You feel things other people do not. You read a room before anyone speaks. People already come to you when they are hurting.',
       'Maybe you have taken Reiki classes, read every book, done the inner work. The ability is real and it is yours.',
       'And yet the practice, the clients, the income - that part has not come together. That is not a gift problem. It is a practice problem, and it can be taught.'] },

  {t:'content', eyebrow:'The trap', h2:'Talented healers stay hobbyists for years.',
    bullets:[['Giving it away','You heal everyone for free because charging feels wrong, so it never becomes a living.'],
             ['The trickle','A few readings a month from friends of friends, never a full, reliable calendar.'],
             ['The burnout','You take on everyone and everything, with no way to manage your own energy, until you are drained.']] },

  {t:'reframe', eyebrow:'The reframe',
    big:'Mastering your craft is not enough. No one ever taught you the skills of running a practice - so of course it feels impossible.' },

  {t:'content', eyebrow:'Part one - the core problem', h2:'Two different skill sets.',
    p:['Being a powerful healer and running a professional healing practice are two completely different things.',
       'One is about energy, intuition, and presence. The other is about fees, clients, boundaries, and clinical competence under pressure.',
       'Most training only teaches the first. This masterclass is about the second - the part that actually pays.'] },

  {t:'content', eyebrow:'Part one - why it stalls', h2:'Talent is invisible without a practice.',
    p:['The world is full of gifted healers no one has ever heard of. Their ability is not the problem.',
       'What is missing is a way for the right people to find them, trust them quickly, and say yes. That is a system, and systems can be built.'] },

  {t:'section', num:'Part two', h2:'The four skills of a professional psychic healer.',
    p:['Over 40 years and more than 15,000 sessions, I distilled what separates a gifted hobbyist from a working professional into four things you can learn.'] },

  {t:'content', eyebrow:'Skill one', h2:'Psychic mastery, without the burnout.',
    p:['Using the Nine Psychic Senses - my practical map of the psychic realms - so your information is accurate, insightful, and available on demand.',
       'And just as important: managing your own energy so you can hold space all day and not be wrecked by it.'] },

  {t:'content', eyebrow:'Skill two', h2:'Magnetizing the right clients.',
    p:['How to attract clients who adore what you do, gladly pay your fee, keep coming back, and send you everyone they know.',
       'This is honest, non-sleazy marketing built for sensitive people - no pressure, no bro tactics, no pretending to be someone you are not.'] },

  {t:'content', eyebrow:'Skill three', h2:'Clinical skill for the hard stuff.',
    p:['No one comes to your office because they are having a good day. They bring you grief, trauma, and the deep issues.',
       'You need real clinical skill to competently handle what walks through the door, so you can do profound work and stay grounded while you do it.'] },

  {t:'content', eyebrow:'Skill four', h2:'Mastering your inner self.',
    p:['The healers with a line of clients out the door are the ones who have done the most inner work.',
       'When you lovingly clear your own patterns, you stop sabotaging yourself and get out of your own way - and the practice finally opens up.'] },

  {t:'content', eyebrow:'The business, made simple', h2:'Five pillars of a thriving practice.',
    bullets:[['Set your fees','Price your work so it honors the gift and sustains your life.'],
             ['Talk about your work','Describe what you do so the right person leans in, not glazes over.'],
             ['Non-sleazy marketing','Reach people with integrity, the way a sensitive person actually can.'],
             ['Website essentials','The few simple things a page needs to turn a visitor into a client.'],
             ['Attract and retain','Build relationships so clients stay, grow, and refer.']] },

  {t:'content', eyebrow:'The integration', h2:'The Art of Psychic Reiki.',
    p:['These skills come together in the work I am known for: reading and healing in the same session.',
       'Psychic development tells you what is happening. Energy medicine, like Reiki and Quantum Light Wave Healing, lets you do something about it. Together they are what clients truly pay for.'] },

  {t:'content', eyebrow:'Part three - the professional practice', h2:'A real practice, not a hobby.',
    bullets:[['A full calendar','A reliable week of clients, not a handful of favors a month.'],
             ['Fees you keep','Rates that honor your gift and sustain your life, charged without apology.'],
             ['Work that lasts','Clients who come back, refer, and grow with you for years.']] },

  {t:'content', eyebrow:'Why me', h2:'I have walked the whole path.',
    p:['I have been a professional psychic for over 40 years and conducted well over 15,000 sessions. I have taught Reiki for more than 27 years and trained thousands of healers.',
       'I spent 15 years as Dean of Students at an energy medicine school and wrote the books many of you learned from. I have made every mistake so I can show you the shortcuts.'] },

  {t:'section', num:'The path', h2:'From gifted to professional in 12 months.',
    p:['The apprentice path moves through four stages: mastering your psychic ability, leveling up your healing skills, healing your own inner child, and mastering your healing business.',
       'Self-paced lessons you can take anywhere, live weekly Q and A with me, and a community of healers walking the same road.'] },

  {t:'cta', eyebrow:'Your next step',
    h2:'Ready to go pro?',
    p:['If you are feeling the pull to finally turn your gift into a real, paying practice, the next step is simple.'],
    steps:['Apply for the Psychic Healer Apprentice Program','Book your discovery call with my team','We map your 12-month path from gifted to professional'],
    disclaimer:'This masterclass is educational. No specific income or result is guaranteed. Results vary with your effort, circumstances, and practice. Nothing here is medical, psychological, or financial advice.' }
];

const deck = document.getElementById('deck');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta-slide':'');
  let h='<span class="wave"></span>';
  if(s.eyebrow) h+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.num) h+='<div class="num">'+esc(s.num)+'</div>';
  if(s.h1) h+='<h1>'+esc(s.h1)+'</h1>';
  if(s.h2) h+='<h2>'+esc(s.h2)+'</h2>';
  if(s.lead) h+='<p class="lead">'+esc(s.lead)+'</p>';
  if(s.big) h+='<p class="big">'+esc(s.big)+'</p>';
  if(s.p) s.p.forEach(x=>h+='<p>'+esc(x)+'</p>');
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li><b>'+esc(b[0])+'.</b> '+esc(b[1])+'</li>');h+='</ul>';}
  if(s.steps) s.steps.forEach((x,i)=>h+='<div class="step">'+(i+1)+'. '+esc(x)+'</div>');
  if(s.pres) h+='<div class="pres">'+esc(s.pres)+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
  if(s.t==='title') h+='<div class="foot">A live masterclass for empaths and intuitives ready to go professional</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
