<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Inside the Song, a Meisner in Music Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9ebf0;      /* pale tint of her dominant slate #282f41 / #5e6b8d (brand.json) */
    --panel:#fbfaf8;   /* warm paper panel */
    --ink:#282f41;     /* brand dominant slate (brand.json, 84 uses) */
    --rule:#cfd2db;
    --accent:#511e18;  /* brand oxblood (brand.json ranked_colors) */
    --mut:#5e6b8d;     /* brand secondary slate (brand.json) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Mulish',system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    margin:0 0 22px;padding:60px 56px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(40,47,65,.03);position:relative;
  }
  .num{position:absolute;top:22px;right:28px;font-size:12px;letter-spacing:.14em;color:var(--mut)}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:64px;line-height:1.02;letter-spacing:.01em}
  h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:46px;line-height:1.08}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:var(--mut);margin-top:20px}
  p.lead{font-size:21px;line-height:1.55;max-width:40ch;margin-top:10px}
  .big{font-family:'Cormorant Garamond',serif;font-size:40px;line-height:1.14;max-width:22ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;line-height:1.5;padding-left:26px;position:relative;margin-bottom:16px;max-width:46ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .fw-name{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--accent);margin-bottom:8px}
  .rule{width:64px;height:2px;background:var(--accent);margin:0 0 26px}
  .part{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--mut);letter-spacing:.04em}
  .cta h2{font-size:52px}
  .disc{font-size:13px;color:var(--mut);margin-top:34px;max-width:60ch;line-height:1.5}
  .credit{font-size:18px;line-height:1.6;color:var(--ink);max-width:52ch;margin-top:6px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass · Meisner in Music',h:'Living Inside the Song',sub:'The Meisner technique, for singers.'},
  {t:'who',eyebrow:'Who this is for',big:'For the singer whose technique is solid, and who still goes missing the moment the stage lights come up.'},
  {t:'points',eyebrow:'The trap',h:'You were trained in two rooms',li:['In the voice lesson, you learned to sing beautifully.','In the acting class, you learned to feel.','Nobody taught you how to do both at once, in the same breath, live.']},
  {t:'big',eyebrow:'The reframe',big:'The problem was never your voice. It was that the moment you step out, you start watching yourself sing.'},
  {t:'part',part:'Part One',h:'Why beautiful singing goes cold'},
  {t:'points',eyebrow:'The core problem',h:'Monitoring kills presence',li:['When you watch yourself perform, you leave the song to grade it.','The audience feels the gap instantly, even when every note is right.','Control and truth start to feel like a choice you have to make.']},
  {t:'points',eyebrow:'The false trade-off',h:'Emotion or technique, pick one?',li:['Reach for real feeling and you fear the tone will break.','Protect the tone and the performance goes flat and safe.','So most singers quietly choose control, and sound correct but untouched.']},
  {t:'big',eyebrow:'The real cost',big:'Stage freeze is not a talent problem or a preparation problem. It is a presence problem, and presence can be trained.'},
  {t:'part',part:'Part Two',h:'The Meisner method, for singers'},
  {t:'framework',eyebrow:'Pillar one',name:'Repetition',body:'Meisner\'s foundational exercise, reworked for a singer who often performs with no scene partner. It trains truthful, present-moment response so you answer the music instead of pre-planning it.'},
  {t:'framework',eyebrow:'Pillar two',name:'Emotional Preparation',body:'A safe, repeatable way to bring real emotional material to the first phrase, so the feeling is already alive in you when you open your mouth, not indicated or pushed.'},
  {t:'framework',eyebrow:'Pillar three',name:'The Physical Impediment',body:'Working truthfully while something is genuinely in your way. It builds trust in your instrument under pressure, which is exactly what nerves try to take from you.'},
  {t:'framework',eyebrow:'The through-line',name:'Beautiful singing, and freedom',body:'The whole method exists to end the trade-off: full vocal technique and emotional freedom and impulsivity, in the same living moment on stage.'},
  {t:'part',part:'Part Three',h:'When it finally lands in performance'},
  {t:'points',eyebrow:'On stage',h:'Singing to the room, not at it',li:['You respond to what is actually happening, so no two performances are identical.','The nerves still arrive, and they stop running the show.','People stop admiring your voice and start believing you.']},
  {t:'points',eyebrow:'In practice',h:'A practice you can repeat',li:['A pre-performance preparation you can run before any audition or show.','Less self-monitoring, more instinct, by design rather than by luck.','Presence that holds up when it counts, not only in the practice room.']},
  {t:'credit',eyebrow:'Who is teaching this',h:'Jillian Paige',credit:'Founder of Meisner in Music and a designated second-generation Meisner teacher, who studied the technique under Terry Martin, a direct pupil of Sanford Meisner. Master\'s in Music Theatre from Oklahoma City University, Bachelor\'s in Classical Vocal Performance from Belmont University. Off-Broadway debut in A Tale of Two Cities; work with Nashville Opera and Kentucky Opera.'},
  {t:'points',eyebrow:'The three moves',h:'What you just learned',li:['Repetition, to answer the music in the moment.','Emotional Preparation, to arrive already feeling.','The Physical Impediment, to trust the instrument under pressure.']},
  {t:'cta',eyebrow:'Your next step',h:'Join the next live Core Class',lead:'The 12-Week Core Class is where this becomes a reliable skill: a live, intensive group, capped small, building to a performance. Take the next cohort.',disc:'This masterclass is educational. No specific performance, audition, or career result is guaranteed. Results vary from singer to singer.'}
];
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('section','slide'+(s.t==='cta'?' cta':''));
  sl.appendChild(el('div','num',(i+1)+' / '+S.length));
  if(s.eyebrow)sl.appendChild(el('div','eyebrow',s.eyebrow));
  if(s.t==='title'){sl.appendChild(el('h1',null,s.h));sl.appendChild(el('div','sub',s.sub));}
  else if(s.t==='who'||s.t==='big'){sl.appendChild(el('div','rule'));sl.appendChild(el('div','big',s.big));}
  else if(s.t==='part'){sl.appendChild(el('div','part',s.part));sl.appendChild(el('h2',null,s.h));}
  else if(s.t==='framework'){sl.appendChild(el('div','fw-name',s.name));sl.appendChild(el('p','lead',s.body));}
  else if(s.t==='credit'){sl.appendChild(el('h2',null,s.h));sl.appendChild(el('p','credit',s.credit));}
  else if(s.t==='cta'){sl.appendChild(el('h2',null,s.h));sl.appendChild(el('p','lead',s.lead));sl.appendChild(el('div','disc',s.disc));}
  else{if(s.h)sl.appendChild(el('h2',null,s.h));const ul=el('ul');s.li.forEach(x=>ul.appendChild(el('li',null,x)));sl.appendChild(ul);}
  deck.appendChild(sl);
});
</script>
</body>
</html>
