<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Story Spine — a masterclass with Tracy Stewart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7ef;        /* warm cream ground (site light scheme) */
    --panel:#ffffff;
    --ink:#1d231c;       /* brand deep charcoal-green */
    --muted:#5c625a;
    --rule:#e6e1d4;
    --accent:#fdde52;    /* brand yellow (dominant, 46 uses) */
    --head:"Bodoni Moda", Georgia, serif;
    --body:"Mulish", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:20px 0;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:20px;right:26px;font-size:12px;letter-spacing:.14em;
    color:var(--muted);text-transform:uppercase}
  .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    margin-bottom:18px;font-weight:600}
  h1{font-family:var(--head);font-weight:400;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:400;font-size:38px;line-height:1.1;margin-bottom:16px}
  .sub{font-size:20px;line-height:1.5;color:var(--muted);margin-top:18px;max-width:40ch}
  .body{font-size:19px;line-height:1.6;margin-top:14px;max-width:54ch}
  ul{list-style:none;margin-top:20px}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:19px;width:16px;height:16px;
    background:var(--accent);border-radius:3px}
  .lead{display:inline-block;background:var(--accent);color:var(--ink);font-weight:600;
    padding:3px 12px;border-radius:6px;margin-bottom:14px;font-size:14px;letter-spacing:.04em}
  .big{font-family:var(--head);font-size:44px;line-height:1.08}
  .accentbar{height:8px;width:72px;background:var(--accent);border-radius:4px;margin-top:26px}
  .title h1{font-size:62px}
  .title{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .title .kick,.title .sub{color:#d7d2c2}
  .title .num{color:#8a8f84}
  .pillar h2{font-size:34px}
  .pillar .tag{font-family:var(--head);font-size:26px;color:var(--ink);background:var(--accent);
    display:inline-block;padding:4px 16px;border-radius:8px;margin-bottom:10px}
  .cta{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .cta h2{color:var(--bg);font-size:40px}
  .cta .step{font-size:20px;line-height:1.5;margin-top:18px;max-width:46ch}
  .cta .disc{font-size:13px;line-height:1.5;color:#b8b4a6;margin-top:28px;max-width:60ch}
  .cite{font-size:15px;color:var(--muted);margin-top:22px;font-style:italic}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', kick:'A live masterclass with Tracy Stewart', h:'The Story Spine',
   sub:'How to give your book a real structure before you write another word. The anti-hustle way to finally finish.'},

  {t:'intro', kick:'Who this is for', h:'You have a book in you. You just cannot get it to hold.',
   body:'You have started it more than once. You have notebooks, fragments, a folder of chapters that do not sit together. The ideas are there. What is missing is the shape that lets them stand up.'},

  {t:'trap', kick:'The trap', h:'You were told the problem was discipline.',
   body:'Write every day. Hit your word count. Push through. So you blamed yourself when it stalled, and started over, and stalled again. The advice was never built for the book you are actually trying to write.'},

  {t:'reframe', kick:'The reframe', h:'A stuck draft is almost never a willpower problem.',
   sub:'It is a structure problem. Books do not fall apart because you did not try hard enough. They fall apart because they have no spine to hang on.'},

  {t:'part', cls:'pillar', kick:'Part one', h:'Why books really stall',
   body:'Without a clear subject and a structure underneath it, every writing session starts from zero. You rewrite the same opening, chase new ideas, and lose the thread. More hours do not fix a shape that was never there. The spine comes first, then the words get easier.'},

  {t:'myth', kick:'The daily-writing myth', h:'You do not have to write every day.',
   body:'I do not believe in forcing a formula onto a human life. A sustainable practice that fits your real weeks will take you further than a streak you cannot keep. Slow, considered, finished beats fast, frantic, abandoned.'},

  {t:'framework', cls:'pillar', kick:'Part two', h:'The method: map the whole book first',
   sub:'In a single focused pass we give the book its architecture across five parts. This is the work we do inside the Book Intensive.'},

  {t:'pillar', cls:'pillar', kick:'Part two · 1 of 5', tag:'Concept',
   h:'What is it actually about?',
   body:'Not the topic. The real subject underneath it, the thing a reader will carry out. Most stuck books have three books tangled into one. We find the one that is yours.'},

  {t:'pillar', cls:'pillar', kick:'Part two · 2 of 5', tag:'Positioning',
   h:'Who is it for, and why them?',
   body:'A book that is for everyone lands for no one. We name the reader, the moment they are in, and the promise the book makes to them.'},

  {t:'pillar', cls:'pillar', kick:'Part two · 3 of 5', tag:'Structure',
   h:'The spine itself.',
   body:'The order that makes the argument or the story inevitable. This is the part that turns a pile of good material into a book that moves. Get it right and the drafting stops feeling like guessing.'},

  {t:'pillar', cls:'pillar', kick:'Part two · 4 of 5', tag:'Voice',
   h:'How it should sound.',
   body:'Your voice on the page, steady from the first line to the last. We protect it rather than sand it down, so the finished book still sounds like you.'},

  {t:'pillar', cls:'pillar', kick:'Part two · 5 of 5', tag:'Plan',
   h:'A plan you can actually trust.',
   body:'A realistic path from here to a finished manuscript, built around your life, not against it. You leave knowing the next move and the one after that.'},

  {t:'clarity', kick:'The clarity lens', h:'Two questions that unstick almost any draft.',
   list:['What is this book actually about, in one honest sentence?','Does the structure have a real spine, or are you holding it together by will?']},

  {t:'sustainable', kick:'The practice', h:'Finishing without burning out',
   body:'Trauma-informed, author-first, anti-hustle. We build a rhythm you can return to, protect the energy the work needs, and treat rest as part of the craft rather than a failure of it.'},

  {t:'after', kick:'What changes', h:'When the spine is in place',
   list:['You sit down and know exactly what this session is for.','The rewriting stops; the drafting starts.','The book sounds like you and holds together.','You can see the finish line, and a plan that reaches it.']},

  {t:'whyme', kick:'Why me', h:'Tracy Stewart',
   body:'Published fiction author, bibliotherapist, and book coach. I judge for the Page Turner Awards and work with authors and purpose-led entrepreneurs in Paris, London, Bordeaux, and everywhere online. I help you build the structure your story needs, without asking you to become someone who writes every day.',
   cite:'"You have the story. I help you build the structure it needs."'},

  {t:'cta', cls:'cta', kick:'Your next step', h:'Bring me your stuck book.',
   step:'Start with a conversation. We will look at what your book is really about and whether the structure holds, and map your next move. If it is a fit, we can carry on together through the Book Intensive, Book Coaching and Mentoring, or the Writers Society.',
   disc:'Educational only. No income, publishing outcome, or result is guaranteed. Results vary and depend on the work you put in.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls||'');
  let h = '<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.kick) h += '<div class="kick">'+s.kick+'</div>';
  if(s.tag) h += '<div class="tag">'+s.tag+'</div>';
  if(s.t==='title'){ h += '<h1>'+s.h+'</h1>'; } else { h += '<h2>'+s.h+'</h2>'; }
  if(s.body) h += '<p class="body">'+s.body+'</p>';
  if(s.sub) h += '<p class="sub">'+s.sub+'</p>';
  if(s.list){ h += '<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(s.step) h += '<p class="step">'+s.step+'</p>';
  if(s.cite) h += '<p class="cite">'+s.cite+'</p>';
  if(s.disc) h += '<p class="disc">'+s.disc+'</p>';
  if(s.t!=='title' && s.t!=='cta' && !s.list) h += '<div class="accentbar"></div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
