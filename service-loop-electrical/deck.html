<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Perfect Play | A Service Loop Electrical Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0c0e11;
    --panel:#15191f;
    --rule:#2a2f37;
    --ink:#f4f5f7;
    --ink-soft:#c3c8d0;
    --ink-muted:#828b98;
    --accent:#ce2f29;
    --spark:#3fb3d4;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:960px}
  .slide.active{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .kicker.cyan{color:var(--spark)}
  h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(34px,6vw,62px);line-height:1.03;letter-spacing:-0.01em;margin-bottom:22px}
  h2{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(26px,4vw,42px);line-height:1.1;letter-spacing:-0.01em;margin-bottom:20px}
  h3{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(20px,2.4vw,26px);line-height:1.2;margin-bottom:14px}
  p{font-size:clamp(16px,1.9vw,21px);line-height:1.6;color:var(--ink-soft);max-width:44ch}
  p.lead{font-size:clamp(18px,2.2vw,24px);color:var(--ink)}
  .sub{color:var(--ink-muted);font-size:clamp(15px,1.7vw,18px);margin-top:18px}
  .big{font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(52px,10vw,120px);line-height:.95;color:var(--accent)}
  .big.cyan{color:var(--spark)}
  ul{list-style:none;margin-top:10px}
  li{font-size:clamp(16px,1.9vw,21px);line-height:1.5;color:var(--ink-soft);padding-left:30px;position:relative;margin-bottom:16px;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:.62em;width:14px;height:2px;background:var(--accent)}
  li.c::before{background:var(--spark)}
  .loop{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
  .node{border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:16px 18px;min-width:150px}
  .node .n{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--spark);font-size:13px;letter-spacing:.14em}
  .node .t{font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;margin-top:6px}
  .node.on{border-color:var(--accent)}
  .node.on .n{color:var(--accent)}
  .card{border:1px solid var(--rule);border-left:3px solid var(--accent);background:var(--panel);border-radius:10px;padding:22px 24px;margin-top:8px;max-width:56ch}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}
  .who .card{margin-top:0}
  .foot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:16px 26px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);border-top:1px solid var(--rule);background:var(--bg)}
  .foot .brand{color:var(--ink-soft);font-weight:700}
  .foot .brand span{color:var(--accent)}
  .prog{height:2px;background:var(--spark);position:fixed;top:0;left:0;transition:width .3s}
  .disc{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink-muted);line-height:1.5;margin-top:22px;max-width:60ch;font-style:italic}
  .cta-btn{display:inline-block;margin-top:22px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:19px;letter-spacing:.02em;color:#fff;background:var(--accent);padding:16px 30px;border-radius:8px}
  .hint{position:fixed;right:26px;bottom:58px;font-size:11px;color:var(--ink-muted);font-family:'Inter',sans-serif}
  @media(max-width:640px){.who{grid-template-columns:1fr}.loop{gap:10px}.node{min-width:120px}}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div id="stage"></div>
<div class="foot"><div class="brand">SERVICE LOOP <span>ELECTRICAL</span></div><div id="pg">01</div></div>
<div class="hint">Use arrow keys</div>
<script>
const S=[
 {t:'title',html:`
   <div class="kicker">A live masterclass for service electricians</div>
   <h1>The Perfect Play</h1>
   <p class="lead">How to turn every service call into a premium sale, without dropping your price to win the job.</p>
   <div class="sub">Presented live by Clay Neumeyer &amp; Joseph Lucanie, Master Electricians &middot; Service Loop Electrical</div>`},

 {t:'promise',html:`
   <div class="kicker cyan">What you will walk away with</div>
   <h2>One hour. Three shifts.</h2>
   <ul>
     <li>Why your best techs still lose jobs they should have closed, and the real reason it is not the price.</li>
     <li class="c">The Service Loop: the exact path from a cold lead to a premium install to the next referral.</li>
     <li>How to run the kitchen-table conversation so the homeowner chooses the bigger option on their own.</li>
   </ul>`},

 {t:'audience',html:`
   <div class="kicker">Who this is for</div>
   <h2>You already do great work.</h2>
   <div class="who">
     <div class="card"><h3>This is you</h3><p>A service electrician or shop owner who does clean, safe, honest work and still watches good jobs walk over price.</p></div>
     <div class="card"><h3>The trap</h3><p>You quote fast, quote low, and hope. When the homeowner says "let me think about it," you have nothing left to say.</p></div>
   </div>`},

 {t:'reframe',html:`
   <div class="kicker">The reframe</div>
   <h1>You are not losing jobs on&nbsp;price.</h1>
   <p class="lead">You are losing them in the twenty minutes at the kitchen table, before price is ever the real question.</p>`},

 {t:'part',html:`
   <div class="kicker">Part one</div>
   <h1>The quote-and-hope trap</h1>
   <p class="lead">Most electricians run every call the same way: look, guess a number, write it down, leave. The homeowner is left to decide alone, and the cheapest number wins.</p>`},

 {t:'content',html:`
   <div class="kicker">Part one</div>
   <h2>Where the money leaks</h2>
   <ul>
     <li>One price on the page means one decision: yes or no. No room to trade up.</li>
     <li class="c">No options means the homeowner shops you against the next truck on price alone.</li>
     <li>A rushed quote hides the value of doing it right, so doing it right looks expensive.</li>
   </ul>
   <p class="sub">The fix is not a bigger discount. It is a better conversation.</p>`},

 {t:'part',html:`
   <div class="kicker cyan">Part two</div>
   <h1>The Service Loop</h1>
   <p class="lead">Every service call is a loop. Each hand-off either raises the ticket and feeds the next lead, or leaks it. We close every gap in order.</p>`},

 {t:'loop',html:`
   <div class="kicker cyan">The loop, end to end</div>
   <h2>Four stages, one circuit</h2>
   <div class="loop">
     <div class="node"><div class="n">STAGE 01</div><div class="t">More of the right leads</div></div>
     <div class="node"><div class="n">STAGE 02</div><div class="t">Take the perfect call</div></div>
     <div class="node on"><div class="n">STAGE 03</div><div class="t">Run the perfect play</div></div>
     <div class="node"><div class="n">STAGE 04</div><div class="t">Execute the install</div></div>
   </div>
   <p class="sub">Stage three, the in-home sale, is where the ticket is won or lost. That is where we spend most of today.</p>`},

 {t:'pillar',html:`
   <div class="kicker">Stage 01</div>
   <h2>More of the right leads</h2>
   <p class="lead">Not more calls. The right calls, from homeowners who already want it done properly.</p>
   <div class="card"><p>When your name shows up before the emergency, you stop being the third quote and start being the one they called first.</p></div>`},

 {t:'pillar',html:`
   <div class="kicker">Stage 02</div>
   <h2>Take the perfect call</h2>
   <p class="lead">The job is half sold before the van leaves the shop.</p>
   <ul>
     <li>Qualify the work and the homeowner so the tech shows up to a job that is ready to buy.</li>
     <li class="c">Set the expectation that you arrive with options, not a single guess.</li>
   </ul>`},

 {t:'pillar',html:`
   <div class="kicker cyan">Stage 03 &middot; the core</div>
   <h1>Run the perfect play</h1>
   <p class="lead">The kitchen-table conversation: how you present the work so the homeowner sees the value and chooses the level of service that is right for them.</p>`},

 {t:'pillar',html:`
   <div class="kicker">Stage 03 &middot; pricing</div>
   <h2>Options, not one number</h2>
   <ul>
     <li>Present clear, transparent, good / better / best options in plain language.</li>
     <li class="c">Now the decision is not "yes or no," it is "which one," and the homeowner trades up on their own.</li>
     <li>Transparent pricing builds trust, simplifies the estimate, and lifts your average ticket.</li>
   </ul>`},

 {t:'pillar',html:`
   <div class="kicker">Stage 03 &middot; the close</div>
   <h2>Communication and objections</h2>
   <p class="lead">"Let me think about it" is not a no. It is a question you have not answered yet.</p>
   <div class="card"><p>Real client communication, honest negotiation, and calm objection handling turn hesitation into a signed job, without pressure and without discounting your worth.</p></div>`},

 {t:'pillar',html:`
   <div class="kicker cyan">Stage 04</div>
   <h2>Execute the install, close the loop</h2>
   <p class="lead">A premium install done right becomes the review, the referral, and the next right lead. The loop starts again, one rung higher.</p>`},

 {t:'part',html:`
   <div class="kicker">Part three</div>
   <h1>Same crew, bigger ticket</h1>
   <p class="lead">Same trucks. Same honest work. A different conversation at the table, and a very different number on the invoice.</p>`},

 {t:'proof',html:`
   <div class="kicker cyan">The result of running the play</div>
   <div class="big cyan">80%</div>
   <p class="lead" style="margin-top:18px">Joseph led his team to a consistent 80% close ratio running this exact conversation in the field.</p>
   <p class="sub">The Loop Method helped service electricians book over $5M in wins in a single year. Results vary by shop, market, and effort.</p>`},

 {t:'why',html:`
   <div class="kicker">Why us</div>
   <h2>Master electricians, not marketers</h2>
   <div class="who">
     <div class="card"><h3>Clay Neumeyer</h3><p>Master Electrician and eighteen-year entrepreneur. Host of the Million Dollar Electrician podcast.</p></div>
     <div class="card"><h3>Joseph Lucanie</h3><p>Master Electrician, sixteen-plus years in the field, the 80% close ratio came off his own trucks.</p></div>
   </div>
   <p class="sub">We have stood at the same kitchen tables you do. The Loop is what we wish someone had handed us on day one.</p>`},

 {t:'recap',html:`
   <div class="kicker cyan">The whole thing in one line</div>
   <h1>Win the table, win the loop.</h1>
   <p class="lead">Right leads, a perfect call, the perfect play, a premium install, then referrals that feed it all again.</p>`},

 {t:'cta',html:`
   <div class="kicker">Your next step</div>
   <h2>Learn the Loop</h2>
   <p class="lead">If you want the full playbook, the pricing scripts, and the call framework mapped to your shop, book a call with our team and we will walk you through it.</p>
   <span class="cta-btn">Learn the Loop &rarr; Book your call</span>
   <p class="disc">Educational content only. Service Loop Electrical does not guarantee any income, revenue, or business result. Outcomes depend on your market, your team, your pricing, and the work you put in. Figures shown are examples, not promises.</p>`}
];
let i=0;const stage=document.getElementById('stage'),pg=document.getElementById('pg'),prog=document.getElementById('prog');
function render(){stage.innerHTML=`<div class="slide active">${S[i].html}</div>`;pg.textContent=String(i+1).padStart(2,'0');prog.style.width=((i+1)/S.length*100)+'%';}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){go(1);}else if(e.key==='ArrowLeft'){go(-1);}});
document.addEventListener('click',e=>{const w=window.innerWidth;go(e.clientX>w/2?1:-1);});
render();
</script>
</body>
</html>
