<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Commercial Real Estate Power Brokers &middot; Jim Gillespie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f2f3f5; --panel:#e4e7ea; --rule:#cfd4da;
    --forest:#066943; --azure:#0038a8; --chalk:#141617; --grey:#41474d; --dim:#79818a;
  }
  html,body{height:100%}
  body{background:#c9ced4;font-family:'Inter',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#c9ced4}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
    display:flex;flex-direction:column;justify-content:center;padding:8% 9% 8% 11%}
  .slide.active{opacity:1;visibility:visible}
  .slide::before{content:'';position:absolute;left:5.4%;top:12%;bottom:12%;width:2px;background:var(--rule)}
  .t-title::before,.t-quote::before,.t-cta::before{display:none}
  .kicker{font-family:'Inter',sans-serif;font-size:.98vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--forest);margin-bottom:2.2vh}
  h1{font-family:'Public Sans',Helvetica,sans-serif;font-weight:800;color:var(--chalk);line-height:1.1;letter-spacing:-.022em}
  .t-title h1{font-size:4.6vw;max-width:88%}
  .t-normal h1{font-size:3.05vw;max-width:84%;font-weight:600}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.44vw;color:var(--grey);margin-top:2.6vh;max-width:72%;line-height:1.6;font-weight:300}
  .sub{font-family:'Inter',sans-serif;font-size:1.7vw;color:var(--grey);margin-top:3vh;max-width:74%;line-height:1.5;font-weight:300}
  .t-section{background:var(--panel);align-items:flex-start}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.1vw;font-weight:600;color:var(--azure);margin-bottom:1.8vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:4.3vw;max-width:86%}
  .t-section .bar{width:9vw;height:6px;background:var(--forest);margin-top:3.2vh}
  .t-quote{background:var(--chalk);align-items:flex-start;justify-content:center;padding-left:11%}
  .t-quote h1{font-size:3.5vw;max-width:82%;color:#f2f3f5;font-weight:600;line-height:1.16}
  .t-quote .mark{font-family:'Public Sans',sans-serif;font-size:5vw;font-weight:800;color:var(--forest);line-height:.7;margin-bottom:2.4vh}
  .t-cta{background:var(--panel);align-items:flex-start}
  .t-cta h1{font-size:3.7vw;max-width:80%}
  .chips{display:flex;gap:.9vw;margin-top:4vh;flex-wrap:wrap}
  .chip{border:1.5px solid var(--forest);color:var(--forest);border-radius:3px;padding:1.2vh 1.5vw;font-size:1.16vw;font-weight:600;font-family:'Inter',sans-serif}
  .disc{position:absolute;left:11%;right:9%;bottom:4.2vh;font-size:.86vw;color:var(--dim);text-align:left;line-height:1.45;font-weight:300}
  .brandline{font-family:'Inter',sans-serif;font-size:1.2vw;color:var(--grey);margin-top:3.6vh;font-weight:400;letter-spacing:.03em}
  .brandline b{color:var(--forest);font-weight:600}
  .bracket{position:absolute;pointer-events:none}
  .b-title{right:7%;bottom:11%;width:17vw;opacity:.85}
  .b-corner{right:6%;bottom:8%;width:8vw;opacity:.32}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--forest);width:0;transition:width .3s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#6d747b;z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6d747b;z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#6d747b;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.5vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:2.9vw}
    .sub{font-size:3.3vw}.t-section h1{font-size:6.8vw}.t-quote h1{font-size:5.6vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.5vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Jim Gillespie</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ruled bracket: the mark of an entry in a record -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="brk" viewBox="0 0 240 150">
  <g fill="none" stroke-width="3" stroke-linecap="square">
    <path d="M40 12 H14 V138 H40" stroke="#066943"/>
    <path d="M200 12 H226 V138 H200" stroke="#0038a8" opacity="0.75"/>
    <line x1="60" y1="52" x2="180" y2="52" stroke="#141617" opacity="0.22"/>
    <line x1="60" y1="75" x2="180" y2="75" stroke="#141617" opacity="0.22"/>
    <line x1="60" y1="98" x2="140" y2="98" stroke="#141617" opacity="0.22"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Commercial Real Estate Power Brokers',sub:'What the best in the business actually do differently, drawn from more than 180 interviews with top producing commercial brokers.',brand:true},

 {t:'normal',k:'Who this is for',title:'You already know how to do the work.',body:'You can underwrite a deal, walk a building, and hold a room. You are not short on ability. You are short on a business that produces the same result every quarter instead of the one you happen to land. That is a different problem, and it has a different answer.'},

 {t:'quote',title:'The gap between a good commercial broker and a great one is almost never market knowledge.'},

 {t:'section',idx:'Part One',title:'Why Good Brokers Stay Stuck'},

 {t:'normal',k:'Back to zero',title:'Every closing resets you to nothing.',body:'A commercial deal takes months to make and pays once. The day it funds, your income starts over. Most brokers spend the long middle of a deal working only that deal, so the next quarter is always thin. The work is real. The rhythm is the problem.'},

 {t:'normal',k:'Sameness',title:'You are competing on the three things everyone competes on.',body:'Market knowledge, responsiveness, and a comparables package. Every broker in the running says the same three things, so the owner decides on the only thing left that looks different, which is your fee. You did not lose on ability. You lost because nothing separated you.'},

 {t:'normal',k:'The fee squeeze',title:'When nothing separates you, the conversation lands on your commission.',body:'An owner who cannot tell two brokers apart will always ask the second one for a discount. Cutting the fee to stay in the deal teaches the market what your work is worth, and the number never goes back up on the next assignment.'},

 {t:'normal',k:'Feast and famine',title:'Prospecting stops the moment you get busy.',body:'The month a deal heats up is the month the calls stop. Ninety days later the calendar is empty again and the cycle restarts. Almost every broker who feels stuck is not lazy. They simply have no way to keep prospecting running while the work is loud.'},

 {t:'quote',title:'Nobody plateaus because they ran out of talent. They plateau because nothing in the business runs without them.'},

 {t:'section',idx:'Part Two',title:'What the Power Brokers Do Differently'},

 {t:'normal',k:'One, prospecting that survives a busy month',title:'Protect the hour before you protect anything else.',body:'The top producers do not prospect when they feel like it. They keep a fixed block that a live deal is not allowed to take, and they work a defined list rather than whoever comes to mind. The point is not volume. The point is that the number of conversations stays flat in the loud months.'},

 {t:'normal',k:'Two, win it before the presentation',title:'The listing is decided before you present, not during.',body:'Power brokers arrive already known. They have been sending the owner something useful for months, so the meeting confirms a decision that was made earlier. If the first real contact is the presentation, you are a bidder. If it is the twelfth, you are the choice.'},

 {t:'normal',k:'Three, name what makes you different',title:'Say the one thing the others cannot say.',body:'Not "we know the market." Something specific and provable: the submarket you have transacted in most, the buyer list you can name, the asset type you have taken through the hardest year. One concrete difference stated plainly outperforms a polished pitch that could belong to anyone.'},

 {t:'normal',k:'Four, maximum exposure on every listing',title:'Exposure is the promise you can actually keep.',body:'An owner cannot judge your judgment, but they can judge reach. Put every assignment in front of the largest possible number of commercial professionals through the channels that exist for it, then show the owner exactly where it went. That report is the reason the second listing comes without a competition.'},

 {t:'normal',k:'Five, hold the fee with language',title:'Have the commission answer ready before you are asked.',body:'When an owner asks you to come down, the deciding factor is whether you have words prepared. Explain what the fee buys, what it funds in the marketing of their asset, and what it costs them to hire the cheapest option. Brokers who prepare that answer keep their fee. Brokers who improvise it do not.'},

 {t:'normal',k:'Six, persuasion, not pressure',title:'Move an owner from interested to decided.',body:'Most commercial deals stall in the gap between wanting to act and acting. That gap closes with questions, not with pressure: what happens if nothing changes this year, what the hold is really costing, what the decision looks like from the other side. Persuasion is helping someone finish a decision they already started.'},

 {t:'normal',k:'Seven, leverage',title:'Let the tools carry the parts that never needed you.',body:'Research, first drafts, summaries and the long tail of follow up are now largely machine work. Brokers who hand that off cover more ground with the same hours and spend the recovered time where a person is required, which is in front of an owner. The tool is not the edge. What you do with the returned hours is.'},

 {t:'quote',title:'None of this is a secret. It is simply what the best in the business already do every week.'},

 {t:'section',idx:'Part Three',title:'Where This Came From'},

 {t:'normal',k:'The record',title:'More than 180 top producers, on the record.',body:'Commercial Real Estate Power Brokers came out of interviews with the highest producing commercial brokers in the country, asking each one what they actually do. Across thirty five years in this business, a term as President of the AIR Commercial Real Estate Association, and more than a thousand published articles, the pattern above is what kept repeating.'},

 {t:'cta',title:'Want to work through this on your own business?',chips:['Request a discovery call','Get the book','Ask the CRE Coaching GPT'],disc:'Educational content for commercial real estate brokers and brokerage owners. No income, commission, listing, or business result is guaranteed. Results vary by broker, market, and asset class.'},
];

const deck=document.getElementById('deck');
function brk(kind){return `<svg class="bracket ${kind==='title'?'b-title':'b-corner'}"><use href="#brk"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="bar"></div>`; }
  else if(s.t==='quote'){ h=`<div class="mark">&ldquo;</div><h1>${s.title}</h1>`; }
  else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Commercial Real Estate <b>Power Brokers</b> &middot; Jim Gillespie</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=brk('title');
  else if(s.t==='cta') h+=brk('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
