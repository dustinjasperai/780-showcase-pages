<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Red Dress Moment: Turn Your Story Into Booked Stages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F2E9;        /* warm ivory paper (light scheme, brand-derived) */
    --panel:#FFFFFF;
    --ink:#20303a;       /* deep teal-charcoal text */
    --rule:#296474;      /* dominant brand teal */
    --accent:#296474;    /* dominant brand teal */
    --beam:#fff952;      /* sunbeam light-beam highlight (second brand hex) */
    --muted:#5b6b70;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Lato",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid #e7e0d2;border-radius:18px;padding:52px 56px;margin:22px 0;
    min-height:430px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 #efe8da}
  .slide .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:38px;line-height:1.12;margin-bottom:8px}
  p{font-size:20px;color:var(--ink);margin-top:14px;max-width:48ch}
  p.lead{font-size:23px}
  .muted{color:var(--muted)}
  .beam{background:linear-gradient(transparent 62%, var(--beam) 62%);padding:0 2px}
  ul{margin:20px 0 0 0;list-style:none}
  li{font-size:20px;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid #eee6d6;max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .arc{display:flex;gap:16px;margin-top:26px;flex-wrap:wrap}
  .arc .step{flex:1;min-width:200px;background:var(--bg);border:1px solid #e7e0d2;border-radius:12px;padding:22px}
  .arc .step .n{font-family:"Playfair Display",serif;font-size:30px;color:var(--accent)}
  .arc .step .t{font-weight:700;margin-top:6px;font-size:19px}
  .arc .step .d{color:var(--muted);font-size:16px;margin-top:6px}
  .title h1 .beam{background:linear-gradient(transparent 60%, var(--beam) 60%)}
  .cta{border:2px solid var(--accent)}
  .cta .step-note{font-size:19px;margin-top:10px}
  .disc{margin-top:26px;font-size:14px;color:var(--muted);max-width:60ch}
  .tag{font-size:15px;color:var(--muted);margin-top:30px;letter-spacing:.04em}
  .num{position:absolute;top:18px;right:24px;font-size:13px;color:#b7ad97}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="kick">A live masterclass with April Adams Pertuis</div>
    <h1>The Red Dress Moment: <span class="beam">turn your story into booked stages</span></h1>
    <p class="lead muted">For mission-driven women ready to be seen, heard, and booked. Live, 60 minutes.</p>
    <div class="tag">LIGHTbeamers &middot; lightbeamers.com</div>`},

  {t:'promise', html:`
    <div class="kick">What you will leave with</div>
    <h2>You will walk out able to do three things</h2>
    <ul>
      <li>Find the one story worth telling, even if yours feels too ordinary.</li>
      <li>Shape it with a three-part Story Arc so the right rooms lean in.</li>
      <li>See the path from a single talk to booked, paid stages.</li>
    </ul>`},

  {t:'who', html:`
    <div class="kick">Who this is for</div>
    <h2>The woman who has the results, not the visibility</h2>
    <p>You are an entrepreneur, a founder, an expert. You are good at what you do. But the rooms
    that could change your business do not know you exist yet, and that gap is not about talent.</p>`},

  {t:'trap', html:`
    <div class="kick">The trap</div>
    <h2>You keep waiting to feel ready</h2>
    <p>Ready sounds like: once the website is done, once I lose the nerves, once I have a bigger
    following. So the pitch never goes out, the talk never gets built, and someone with half your
    substance takes the stage instead.</p>`},

  {t:'hook', html:`
    <div class="kick">A harder truth</div>
    <h1>It was never <span class="beam">imposter syndrome</span>.</h1>
    <p class="lead">What stops you is older and quieter than that. It is resistance to being seen.</p>`},

  {t:'part1', html:`
    <div class="kick">Part one &middot; the real problem</div>
    <h2>The Red Dress Moment</h2>
    <p>Picture the one outfit you own that turns heads, and the small voice that says do not wear
    it. That voice is not doubt about your ability. It is your nervous system flinching at
    attention. The stage triggers the exact same flinch.</p>
    <p class="muted">Name it correctly and it loses its grip. You cannot fix a visibility problem
    by working harder on competence.</p>`},

  {t:'cost', html:`
    <div class="kick">What it costs</div>
    <h2>The room books what it can see</h2>
    <p>Decision makers do not reward the most qualified person. They reward the one whose story
    they remember. Stay invisible and you are not being humble, you are handing your opportunities
    to people who were willing to be seen.</p>`},

  {t:'part2intro', html:`
    <div class="kick">Part two &middot; the method</div>
    <h2>One story, three rooms</h2>
    <p>Visibility is not one channel. It is the Visibility Trifecta: stages, pages, and media.
    The same core story, told well once, can travel across all three. Today we build the engine
    that makes that possible: your story, structured.</p>`},

  {t:'arc', cls:'arc-slide', html:`
    <div class="kick">The Story Arc</div>
    <h2>Every story that books a stage has three parts</h2>
    <div class="arc">
      <div class="step"><div class="n">1</div><div class="t">The before</div><div class="d">Who you were, and the ordinary world you lived in.</div></div>
      <div class="step"><div class="n">2</div><div class="t">The turning point</div><div class="d">The moment that changed everything. The once upon a time.</div></div>
      <div class="step"><div class="n">3</div><div class="t">The after</div><div class="d">Who you became, and why it matters to the room.</div></div>
    </div>
    <p class="muted">This structure is older than the caveman wall. Your job is not to invent it.
    It is to find yours.</p>`},

  {t:'edit', html:`
    <div class="kick">The skill most people miss</div>
    <h2>Knowing which parts to leave out</h2>
    <p>Most women tell all of it, or none of it. A journalist knows the opposite is true: the
    power is in the edit. Which ten percent of your story earns the room's trust, and which
    ninety percent you keep for yourself.</p>`},

  {t:'exercise', html:`
    <div class="kick">Do this live</div>
    <h2>Find your turning point</h2>
    <p>We will locate the single moment your audience needs, not the whole timeline. One scene.
    One change. Told so a stranger feels it in their body, not just hears it in their head.</p>`},

  {t:'louder', html:`
    <div class="kick">The reframe that changes everything</div>
    <h1>You do not need to be louder.</h1>
    <p class="lead">You need the <span class="beam">right story</span>, in the right structure,
    pointed at the right room.</p>`},

  {t:'part3', html:`
    <div class="kick">Part three &middot; what it looks like</div>
    <h2>From one talk to booked stages</h2>
    <ul>
      <li>Craft a signature talk anchored in your story and built for business impact.</li>
      <li>Practice it live until the delivery is yours, not a script.</li>
      <li>Book repeatedly with a simple, trackable system instead of waiting to be found.</li>
    </ul>`},

  {t:'monetize', html:`
    <div class="kick">The part no one tells you</div>
    <h2>Speaking is a channel, not exposure</h2>
    <p>A stage is not a favor you do for free. Done right, it is one of the most efficient ways a
    woman grows authority and revenue at the same time. The goal is not applause. It is the right
    person walking up afterward.</p>`},

  {t:'whyme', html:`
    <div class="kick">Why me</div>
    <h2>Thirty years of finding the story</h2>
    <p>I spent three decades as a television journalist and producer, finding the human thread in
    thousands of stories on CBS, FOX, HGTV, and more. I have taught thousands of women to do the
    same with their own, inside a community that reaches ten countries. Everybody has a story.
    When you share yours, you shine a light.</p>`},

  {t:'isthisyou', html:`
    <div class="kick">Is this you</div>
    <h2>Check the ones that land</h2>
    <ul>
      <li>You have a message, but it stays small when you try to say it out loud.</li>
      <li>You have watched less-qualified people get the stage you wanted.</li>
      <li>You are ready to be visible on purpose, not by accident.</li>
    </ul>`},

  {t:'objection', html:`
    <div class="kick">But what if</div>
    <h2>"I do not have a dramatic enough story"</h2>
    <p>The best stories are rarely dramatic. They are honest and specific. A journalist's eye
    finds the turning point hiding in an ordinary afternoon. If you have lived, you have the raw
    material. The craft is what we build.</p>`},

  {t:'next', html:`
    <div class="kick">Where this goes next</div>
    <h2>The story is the start, not the finish</h2>
    <p>Today you leave with your Story Arc and the reframe. If you want help turning it into a
    booked, paid speaking engine, there is a clear next step inside The Speak Easy, where women
    craft the talk, practice it, book it, and monetize it together.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h2>Ready to build the booked version of your story?</h2>
    <p class="step-note">Book a strategy call with April to map your Story Arc into a speaking
    plan, or explore The Speak Easy at <strong>lightbeamers.com</strong>.</p>
    <p class="disc">Educational only. No income, role, booking, or result is guaranteed. Outcomes
    vary with your effort, market, and circumstances. Nothing here is financial or professional
    advice.</p>
    <div class="tag">LIGHTbeamers &middot; lightbeamers.com</div>`}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls||'');
  el.innerHTML = '<span class="num">'+(i+1)+' / '+S.length+'</span>' + s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
