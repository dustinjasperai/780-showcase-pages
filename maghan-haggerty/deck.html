<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Business Flow: a live masterclass with Maghan Haggerty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f0;      /* warm paper, harvested-light */
    --ink:#363737;     /* dominant harvested charcoal */
    --muted:#757575;   /* harvested grey */
    --rule:#e6e6e6;    /* harvested hairline */
    --accent:#16a34a;  /* the one chromatic hex in the brand palette */
    --paper:#fffdf8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px}
  .slide{background:var(--paper);border:1px solid var(--rule);border-radius:8px;
    padding:64px 64px;margin:0 0 28px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(54,55,55,.04)}
  .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:22px}
  h1{font-family:"Spectral",Georgia,serif;font-weight:600;font-size:52px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:"Spectral",Georgia,serif;font-weight:600;font-size:36px;line-height:1.14;
    margin-bottom:18px}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:38em;margin-bottom:14px}
  p.sub{color:var(--muted);font-size:19px}
  .lead{font-family:"Spectral",Georgia,serif;font-style:italic;font-size:30px;line-height:1.3;
    color:var(--ink);max-width:24em}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 28px;position:relative;
    border-top:1px solid var(--rule);max-width:40em}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:9px;height:9px;
    border-radius:50%;background:var(--accent)}
  .dots{display:flex;gap:10px;align-items:center;margin-bottom:20px}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;opacity:.5}
  .dots i:last-child{opacity:1}
  .big{font-family:"Spectral",Georgia,serif;font-size:40px;line-height:1.16;max-width:20em}
  .tag{color:var(--muted);font-size:16px;margin-top:26px}
  .note{color:var(--muted);font-size:14px;line-height:1.5;margin-top:28px;max-width:44em;
    border-top:1px solid var(--rule);padding-top:16px}
  .cta h1{color:var(--ink)}
  .snum{position:absolute;top:18px;right:22px;font-size:12px;color:var(--muted);letter-spacing:.1em}
  .slide{position:relative}
  .accent{color:var(--accent)}
  @media(max-width:640px){.slide{padding:40px 28px;min-height:auto}h1{font-size:36px}h2{font-size:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* Maghan Haggerty: Find Your Business Flow. Her masterclass, her content, her CTA. */
const S = [
  {t:"title", kick:"A live masterclass with Maghan Haggerty",
   h:"Find Your Business Flow",
   p:"Build the business around what's already working in you, instead of forcing it into someone else's system."},

  {t:"point", kick:"Who this is for",
   h:"You built something real. It just doesn't feel like it fits.",
   p:"You are a solopreneur or a micropreneur. You care about the work. And somewhere along the way you started running your business on a borrowed template that was never built for how you actually work."},

  {t:"lead", kick:"The reframe",
   lead:"You don't have a discipline problem. You have a fit problem."},

  {t:"point", kick:"Part one: the trap",
   h:"Generic systems break for people like you.",
   p:"The productivity advice assumes a team, a tolerance for grind, and a brain that likes the same five steps. When it breaks, you blame yourself and go looking for the next system. The problem was never you. It was the fit."},

  {t:"point", kick:"Part one: the cost",
   h:"Running against your grain is expensive.",
   p:"It costs energy you do not get back, decisions you keep re-making, and a quiet sense that the business is running you. The fix is not more willpower. It is building the thing around what is already working in you."},

  {t:"section", kick:"Part two: the framework",
   h:"The GATES audit",
   p:"Before you fix the business, you name what is already working inside you. GATES is five lenses on your own raw material."},

  {t:"point", kick:"G: Genius",
   h:"Genius",
   p:"The work you do so naturally you forget it is hard for other people. This is the thing to build around, not the thing to delegate away."},

  {t:"point", kick:"A: Affinities",
   h:"Affinities",
   p:"The people, problems, and subjects you are drawn to on your own time. Affinities tell you which market and which work will keep your energy up instead of draining it."},

  {t:"point", kick:"T: Talents",
   h:"Talents",
   p:"Your CliftonStrengths and your Sparketype, read as instructions, not as a personality badge. Talents show you the shape of the week your business should run on."},

  {t:"point", kick:"E: Expertise",
   h:"Expertise",
   p:"What you have actually earned through reps. Expertise is where your offer gets to be premium, because it is the part no template can hand someone else."},

  {t:"point", kick:"S: Strengths",
   h:"Strengths",
   p:"Genius, affinities, talents, and expertise pointed at one real goal in front of you. A strength is a talent in motion, aimed."},

  {t:"section", kick:"Connect the dots",
   h:"From an audit to a direction.",
   p:"An assessment result is trivia until you connect it. The move is simple: who you are, what you want to build, and the next decision in front of you, lined up so the choice gets obvious."},

  {t:"section", kick:"Part three: the four conditions",
   h:"The four conditions for flow",
   p:"A business is not one thing you optimize. It runs across four domains, and each one has to be shaped to how you actually work."},

  {t:"list", kick:"Strategy",
   h:"Strategy that sounds like you.",
   items:["One clear answer to who you serve and what changes for them",
          "A direction you can hold without checking it against everyone else's",
          "Said in your own words, not a borrowed positioning formula"]},

  {t:"list", kick:"Growth: marketing and sales",
   h:"Growth that fits your energy.",
   items:["The one or two channels your talents make sustainable",
          "A way to be found by people who have never heard of you",
          "Selling that feels like service, because it is built on your affinities"]},

  {t:"list", kick:"Operations",
   h:"Operations built around your week.",
   items:["Deep work in your high-energy hours, protected on purpose",
          "Admin batched into the pockets where it actually belongs",
          "Rhythms you keep, because they were designed for you"]},

  {t:"list", kick:"Finances",
   h:"Finances you will actually look at.",
   items:["Numbers checked on a cadence you can hold",
          "Pricing that reflects your expertise, not your fear",
          "Enough clarity that money decisions stop being dread"]},

  {t:"point", kick:"A week in flow",
   h:"A week built around your flow, not against it.",
   p:"When the four conditions are shaped to your GATES, the week stops being a fight. The work that only you can do sits in your best hours. Everything else finds its right, smaller place. That is business flow."},

  {t:"point", kick:"Why me",
   h:"Who is teaching this.",
   p:"I am Maghan Haggerty, a Gallup Certified Strengths Coach and Certified Sparketype Advisor, and the lead productivity coach at Productive Flourishing. After twenty years in marketing I now help solopreneurs build ventures that run on their own strengths. This is the work I do every day."},

  {t:"cta", kick:"Your next step",
   h:"Find your business flow.",
   p:"If this is the way you want to build, let's map your GATES and the four conditions to your business together.",
   tag:"Join the next Find Your Business Flow cohort, or book a strengths session with me.",
   note:"This masterclass is educational. No specific income or result is guaranteed. Results vary and depend on your own situation, effort, and choices."}
];

const deck = document.getElementById("deck");
S.forEach((s,i)=>{
  const el = document.createElement("section");
  el.className = "slide" + (s.t==="cta"?" cta":"");
  let inner = '<span class="snum">'+(i+1)+' / '+S.length+'</span>';
  if(s.kick) inner += '<div class="kick">'+s.kick+'</div>';
  if(s.t==="lead"){ inner += '<p class="lead">'+s.lead+'</p>'; }
  if(s.t==="section"){ inner += '<div class="dots"><i></i><i></i><i></i></div>'; }
  if(s.h){ inner += (s.t==="title" ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>'); }
  if(s.p){ inner += '<p>'+s.p+'</p>'; }
  if(s.items){ inner += '<ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(s.tag){ inner += '<div class="tag">'+s.tag+'</div>'; }
  if(s.note){ inner += '<div class="note">'+s.note+'</div>'; }
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
