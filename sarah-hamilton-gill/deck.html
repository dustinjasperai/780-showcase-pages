<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Four Pillars &middot; Sarah Hamilton-Gill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f2ee; --panel:#2d1a5c; --rule:#e3ddd0;
    --ink:#282b30; --inkp:#f7f4ec; --accent:#29adad; --gold:#522eb3;
    --grey:#55504a; --greyp:#cfc6e6; --dim:#8a847c;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Open Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%;background:var(--bg);color:var(--ink)}
  .slide.active{opacity:1;visibility:visible}
  .slide.t-dark,.slide.t-cta{background:var(--panel);color:var(--inkp)}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  .t-dark .kicker,.t-cta .kicker{color:var(--gold)}
  h1{font-family:'Poppins',sans-serif;font-weight:600;line-height:1.18;letter-spacing:-.005em}
  .t-title h1{font-size:3.4vw;max-width:88%}
  .t-normal h1{font-size:2.5vw;max-width:84%;color:var(--ink)}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.58;font-weight:400}
  .sub{font-family:'Open Sans',sans-serif;font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.6vw;max-width:88%;color:var(--ink)}
  .t-section .rule{width:16vw;height:3px;background:var(--gold);margin-top:3.4vh}
  .t-dark{align-items:center;text-align:center}
  .t-dark h1{font-size:2.65vw;max-width:82%;font-style:italic;color:var(--inkp)}
  .t-cta{align-items:center;text-align:center}
  .t-cta h1{font-size:2.9vw;max-width:80%;color:var(--inkp)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--gold);color:var(--inkp);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:var(--greyp)}
  .t-title .disc,.t-normal .disc{text-align:left}
  .pillar-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-pillar{right:5%;bottom:5%;width:19vw}
  .corner-pillar{right:6%;bottom:7%;width:8vw;opacity:.55}
  .brandline{font-family:'Open Sans',sans-serif;font-size:1.2vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#fff;z-index:20;font-weight:500;font-family:'Open Sans',sans-serif;opacity:.55}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#fff;z-index:20;font-weight:600;font-family:'Open Sans',sans-serif;opacity:.55}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff;opacity:.55;z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Open Sans',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.4vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Leap into HR Consulting</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- pillar motif: four vertical columns of rising height, literally echoing "The Four Pillars"
     (Catalysts, Community, Commercials, Content & Coverage) over a generic growth-arrow or dial -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="pillars" viewBox="0 0 320 140">
  <g fill="none" stroke="#29adad" stroke-width="2.5" stroke-linecap="round">
    <line x1="20" y1="130" x2="20" y2="66"/>
    <line x1="110" y1="130" x2="110" y2="40"/>
    <line x1="200" y1="130" x2="200" y2="80"/>
    <line x1="290" y1="130" x2="290" y2="15"/>
  </g>
  <g fill="#522eb3" stroke="none">
    <circle cx="20" cy="66" r="7"/>
    <circle cx="110" cy="40" r="7"/>
    <circle cx="200" cy="80" r="7"/>
    <circle cx="290" cy="15" r="7"/>
  </g>
  <line x1="10" y1="130" x2="300" y2="130" stroke="#282b30" stroke-width="2" opacity=".25"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Four Pillars',sub:'A masterclass for HR consultancy owners on growing a practice built to last, through the four pillars behind the HR Consultancy Academy: Catalysts, Community, Commercials, and Content & Coverage.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:"You built a real HR consultancy. Nobody taught you how to grow it past yourself.",body:'Most independent HR consultants come from in-house HR or corporate practice, not from running a company. The skills that make you brilliant with a client engagement are not the skills that fill your pipeline, price your services, or turn a solo practice into something that grows on its own.'},
 {t:'dark',title:'The HR work was never the part that was missing. The system that brings new clients to you is.'},

 {t:'section',idx:'Part One',title:'Why Growth Stalls at Referral-Only'},
 {t:'normal',k:'The referral ceiling',title:'A consultancy built entirely on word of mouth grows only as fast as the people already inside your circle can talk about you.',body:'Referrals are real, but they cap out. Businesses who have never heard of you, in your own market, never find their way in, because there is no system built for them to.'},
 {t:'normal',k:'Growth without a structure',title:"Training happens once, informally, then rarely gets revisited, because there's no framework for what to build next.",body:'Client acquisition, positioning, and scaling past solo are the business problems independent HR consultants run into most often, once the practitioner work itself is no longer the constraint.'},
 {t:'dark',title:'You do not need a bigger referral network. You need a system for the consultancies you have never met.'},

 {t:'section',idx:'Part Two',title:'The Four Pillars'},
 {t:'normal',k:'Catalysts',title:'The practical tools, training, and expert guidance to actually run and grow a consultancy.',body:'A resource vault, live CPD sessions with specialists, and regular strategy sessions that keep you focused and moving forward, not generic business theory bolted onto an HR career.'},
 {t:'normal',k:'Community',title:'A network of HR consultants who have already solved the problem you are stuck on.',body:'Monthly networking sessions and a member community platform. Consultancy ownership is isolating by default. This pillar removes that on purpose.'},
 {t:'normal',k:'Commercials',title:'Deals and opportunities, including being matched with organisations actively looking for HR support.',body:"This is the pillar most growth programmes skip. Partner discounts on the tools you already run (CIPD HR-inform, Xero, Capsule CRM) sit alongside a genuine referral mechanic: businesses that need HR support get matched to members. Growth isn't just taught here, it's fed to you."},
 {t:'normal',k:'Content & Coverage',title:'Getting seen, recognised, and remembered by the people who matter.',body:'Member spotlights, features, podcast opportunities, and campaign visibility. Referrals compound faster when the market already recognises your name before the first conversation.'},
 {t:'dark',title:'Built from a working consultancy, not written as generic business theory.'},

 {t:'section',idx:'Part Three',title:'Where This Comes From'},
 {t:'normal',k:'Why Sarah Hamilton-Gill',title:'She built her own HR consultancy, Globus HR Consulting, over three decades before building the Academy other consultants now lean on.',body:'FCIPD. Author of "Leap into HR Consulting." Host of the "Leap into HR Consulting" podcast. The Four Pillars are drawn directly from what actually grew her own practice, not from a generic coaching curriculum.'},
 {t:'normal',k:'A structural advantage',title:'The Commercials pillar is a lead-referral mechanic, not just a discount code.',body:'Most business coaches sell training and stop there. Being matched with organisations already looking for HR support means growth is partly built in, on top of whatever you learn.'},

 {t:'section',idx:'Your Next Step',title:'Start With a Conversation'},
 {t:'normal',k:'How it works',title:'A Business Audit finds where your consultancy needs the Four Pillars most. The Academy and 1:1 coaching build the system that makes it stick.',body:'The Business Audit is a fact-finding review, a written report on gaps and opportunities, and a virtual review meeting, built for a consultancy that is already running, not one just starting out.'},
 {t:'cta',title:'Ready to build the pillars your next clients are already looking for?',chips:['Book Your Business Audit'],disc:'Educational content for independent HR consultants. No income, growth, or business result is guaranteed. Results vary by practice, market, and effort.'},
];

const deck=document.getElementById('deck');
function pillarSvg(kind){return `<svg class="pillar-motif ${kind==='title'?'title-pillar':'corner-pillar'}"><use href="#pillars"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Leap into <b>HR Consulting</b> &middot; Sarah Hamilton-Gill</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=pillarSvg(s.arc);
  else if(s.t==='title') h+=pillarSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
