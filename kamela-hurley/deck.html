<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Gift to Method: A NeuroSoul Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2ea;        /* her dominant warm ivory */
    --panel:#ede6da;     /* second cream */
    --rule:#d8cdb8;      /* muted of the cream family */
    --ink:#1f1b17;       /* her espresso near-black */
    --soft:#5c5146;      /* muted ink */
    --accent:#b8954a;    /* deepened form of her brand gold #d4b97f */
    --display:'Bodoni Moda',Georgia,serif;
    --body:'Jost',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:60px 58px;margin:0 0 26px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(31,27,23,0.03);
  }
  .slide.divider{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.divider .eyebrow{color:var(--accent)}
  .slide.divider h2{color:var(--bg)}
  .eyebrow{font-family:var(--body);font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:600;font-size:52px;line-height:1.05;letter-spacing:.005em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.12;margin-bottom:20px}
  h3{font-family:var(--display);font-weight:500;font-size:25px;line-height:1.2;margin-bottom:10px}
  p.lead{font-size:21px;line-height:1.5;color:var(--soft);max-width:46ch}
  p.body{font-size:18px;line-height:1.6;color:var(--ink);max-width:52ch;margin-top:8px}
  .sub{font-size:19px;color:var(--soft);line-height:1.5;max-width:50ch}
  ul{list-style:none;margin-top:14px;max-width:60ch}
  ul li{position:relative;padding-left:30px;margin:14px 0;font-size:18px;line-height:1.5}
  ul li:before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .phase{display:flex;align-items:baseline;gap:16px;margin:12px 0;border-bottom:1px solid var(--rule);padding-bottom:12px}
  .phase .num{font-family:var(--display);font-size:22px;color:var(--accent);min-width:34px}
  .phase .pt{font-size:18px;line-height:1.45}
  .phase .pt b{font-weight:600}
  .arc{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
  .arc .step{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px 16px}
  .arc .step .k{font-family:var(--display);font-size:22px;color:var(--accent);margin-bottom:8px}
  .arc .step .d{font-size:15px;color:var(--soft);line-height:1.4}
  .sigs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}
  .sig{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 12px;text-align:center}
  .sig .nm{font-family:var(--display);font-size:19px;margin-bottom:4px}
  .sig .el{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .pagefoot{position:absolute;right:24px;bottom:16px;font-size:12px;letter-spacing:.14em;color:var(--rule);text-transform:uppercase}
  .cta ul li:before{background:var(--accent)}
  .disclaimer{margin-top:26px;font-size:13px;line-height:1.5;color:var(--soft);max-width:60ch;border-top:1px solid var(--rule);padding-top:16px}
  .brandline{font-family:var(--display);font-size:16px;color:var(--accent);letter-spacing:.04em;margin-top:30px}
  @media(max-width:720px){
    .slide{padding:40px 26px;min-height:auto}
    h1{font-size:36px}h2{font-size:28px}
    .arc,.sigs{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A NeuroSoul Masterclass with Kamela Hurley',
    title:'From Gift to Method',
    lead:'How to turn a lifetime of intuitive gifts into a structured, ethical practice people can actually hire you for.' },

  {t:'promise',
    eyebrow:'What you will leave with',
    h2:'By the end of this hour',
    items:[
      'A clear name for the trap that keeps gifted people stuck as "the one everyone comes to" for free.',
      'The NeuroSoul Method, so you can see the difference between collecting modalities and running a method.',
      'A sense of your own Soul Signature and how it shapes the way you create and guide.',
      'The honest path from a raw gift to a credentialed, repeatable practice.' ] },

  {t:'who',
    eyebrow:'Who this is for',
    h2:'You already know who you are',
    body:'You are the friend people call in a crisis. You read a room before anyone speaks. You have taken the courses, the Reiki, the tarot, the astrology, the coaching training, and you have more than enough. What you do not have is one coherent way to put it to work.' },

  {t:'slide',
    eyebrow:'The trap',
    h2:'A gift without a method stays a hobby',
    body:'When there is no framework, every client feels like starting over. You cannot name what you do, so you cannot price it, repeat it, or teach it. The gift is real. The structure around it is missing, and that is what keeps it from becoming a living.' },

  {t:'divider', eyebrow:'The reframe', h2:'Your gift is not the problem.\nThe missing method is.' },

  {t:'divider', eyebrow:'Part One', h2:'Why willpower and insight are not enough' },

  {t:'slide',
    eyebrow:'The core problem',
    h2:'Real change does not happen at the level of thinking',
    body:'Most personal growth tries to fix things with more awareness, more mindset, more affirmations. It works for a while, then the old pattern returns. That is because the pattern does not live in your thoughts. It lives in your nervous system and your subconscious, beneath the words.' },

  {t:'slide',
    eyebrow:'Why this matters for your work',
    h2:'Intuition without grounding stays unreliable',
    body:'An intuitive hit is only as trustworthy as the nervous system it arrives in. When you are dysregulated, you cannot tell intuition from fear. The first job of a real method is to create internal safety, so the signal comes through clean, for you and for the people you guide.' },

  {t:'divider', eyebrow:'Part Two', h2:'The NeuroSoul Method' },

  {t:'slide',
    eyebrow:'Neuro + Soul',
    h2:'A method, not another modality',
    body:'NeuroSoul joins two things most teachers keep apart: the science of the nervous system and the practice of intuition. It is not one more certificate to collect. It is the structure that lets everything you already know finally work together, the same way, every time.' },

  {t:'phases',
    eyebrow:'The seven phases',
    h2:'How change actually moves',
    phases:[
      ['1','Stabilization','regulating the nervous system and creating internal safety.'],
      ['2','Subconscious Insight','uncovering the emotional imprints and identity loops underneath.'],
      ['3','Pattern Recalibration','actively shifting the long standing cycles.'],
      ['4','Embodiment','integrating insight into how life is actually lived.'] ] },

  {t:'phases',
    eyebrow:'The seven phases',
    h2:'From insight to lasting change',
    phases:[
      ['5','Expansion','accessing new capacity, energy, and creativity.'],
      ['6','Self-Leadership','building internal authority and self-trust.'],
      ['7','Integration','making the change sustainable, so it holds.'] ] },

  {t:'arc',
    eyebrow:'The client experience',
    h2:'Decode. Reclaim. Enchant. Create.',
    steps:[
      ['Decode','Understand what shaped you and why the pattern repeats.'],
      ['Reclaim','Reclaim your inner knowing and your right to choose.'],
      ['Enchant','Make possibility visible again.'],
      ['Create','Build what comes next, on purpose.'] ] },

  {t:'sigs',
    eyebrow:'The NeuroSoul Map',
    h2:'Five Soul Signatures',
    note:'Your Soul Signature is the way you are naturally designed to create, draw in opportunity, and move through the world. Knowing yours changes how you guide others.',
    sigs:[
      ['Pioneer','Wood'],['Firekeeper','Fire'],['Builder','Earth'],['Oracle','Metal'],['Navigator','Water'] ] },

  {t:'divider', eyebrow:'Part Three', h2:'Taking the method to your own clients' },

  {t:'slide',
    eyebrow:'The ethical intuitive',
    h2:'Repeatable, ethical, and yours',
    body:'A method means you can explain what you do, hold clear scope and ethics, and get a client the same quality of experience every time. That is the difference between being gifted and being someone people trust enough to pay, refer, and come back to.' },

  {t:'slide',
    eyebrow:'From gift to credential',
    h2:'Become. Build. Create.',
    body:'The practice is built in three moves: Become the practitioner and own your identity and presence. Build the practice by turning your gifts into clear, defined offerings. Create the opportunity with the visibility and simple business structure that brings the right people to you.' },

  {t:'slide',
    eyebrow:'Why me',
    h2:'I have lived both halves of this',
    body:'I have spent more than a decade building a life around intuition, pattern recognition, and the will to help people. I started a business at my kitchen table with fifty dollars and grew it until it sold out live on QVC and was featured on Good Morning America. NeuroSoul is everything I learned about making a real gift pay, turned into a method you can learn.' },

  {t:'slide',
    eyebrow:'The takeaway',
    h2:'You do not have to build alone',
    body:'Your gift is real. What it has been missing is a method, a map, and a path to a practice you can stand behind. That is exactly what NeuroSoul was built to give you.' },

  {t:'cta',
    eyebrow:'Your next step',
    h2:'Begin the NeuroSoul path',
    items:[
      'Discover your Soul Signature, free, and see how you are designed to create.',
      'Book your NeuroSoul discovery call to talk through becoming a Certified NeuroSoul Coach.' ],
    brand:'NeuroSoul with Kamela Hurley',
    disclaimer:'This masterclass is educational. It makes no income, earnings, or results guarantees, and outcomes depend on your effort, path, and circumstances. NeuroSoul is an educational, self-reflective framework and is not medical, psychological, legal, or financial advice. Results vary.' },
];

const deck = document.getElementById('deck');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function nl(s){return esc(s).replace(/\n/g,'<br>');}
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='divider'?' divider':'') + (s.t==='cta'?' cta':'');
  let h = '';
  if(s.eyebrow) h += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.title) h += `<h1>${nl(s.title)}</h1>`;
  if(s.h2) h += `<h2>${nl(s.h2)}</h2>`;
  if(s.lead) h += `<p class="lead">${esc(s.lead)}</p>`;
  if(s.body) h += `<p class="body">${esc(s.body)}</p>`;
  if(s.note) h += `<p class="sub">${esc(s.note)}</p>`;
  if(s.items){ h += '<ul>'; s.items.forEach(it=>h+=`<li>${esc(it)}</li>`); h += '</ul>'; }
  if(s.phases){ h += '<div>'; s.phases.forEach(p=>h+=`<div class="phase"><div class="num">${esc(p[0])}</div><div class="pt"><b>${esc(p[1])}</b>: ${esc(p[2])}</div></div>`); h += '</div>'; }
  if(s.steps){ h += '<div class="arc">'; s.steps.forEach(p=>h+=`<div class="step"><div class="k">${esc(p[0])}</div><div class="d">${esc(p[1])}</div></div>`); h += '</div>'; }
  if(s.sigs){ h += '<div class="sigs">'; s.sigs.forEach(p=>h+=`<div class="sig"><div class="nm">${esc(p[0])}</div><div class="el">${esc(p[1])}</div></div>`); h += '</div>'; }
  if(s.brand) h += `<div class="brandline">${esc(s.brand)}</div>`;
  if(s.disclaimer) h += `<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  h += `<div class="pagefoot">${i+1} / ${S.length}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
