<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Profit-Centered, People-Forward Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f3;
    --panel:#f1e9e4;
    --rule:#e2d3cb;
    --ink:#2b2320;
    --wine:#642240;
    --sage:#789e91;
    --dim:#595959;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--panel);color:var(--ink);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  .slide{display:none;width:min(1040px,92vw);aspect-ratio:16/10;background:var(--bg);border-radius:18px;
    box-shadow:0 30px 80px rgba(90,40,60,.16),0 3px 10px rgba(90,40,60,.08);
    padding:64px 72px;position:relative;overflow:hidden;flex-direction:column}
  .slide.on{display:flex}
  .slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--wine)}
  h1{font-family:'Gilda Display',Georgia,serif;font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em;color:var(--ink)}
  h2{font-family:'Gilda Display',Georgia,serif;font-weight:600;font-size:44px;line-height:1.08;color:var(--wine)}
  .kick{font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--sage);margin-bottom:24px}
  .sub{font-size:23px;line-height:1.5;font-weight:400;color:var(--dim);margin-top:26px;max-width:42ch}
  .lead{font-family:'Gilda Display',Georgia,serif;font-style:italic;font-weight:500;font-size:34px;line-height:1.28;color:var(--ink);max-width:24ch}
  .big{font-family:'Gilda Display',Georgia,serif;font-weight:700;font-size:72px;line-height:1.02;color:var(--wine)}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px}
  li{font-size:24px;line-height:1.4;color:var(--ink);display:flex;gap:16px;align-items:flex-start}
  li b{color:var(--wine);font-weight:700}
  li::before{content:'';flex-shrink:0;width:12px;height:12px;margin-top:9px;border-radius:3px;background:var(--sage)}
  .pillars{margin-top:34px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px 40px}
  .pillars div{font-size:22px;color:var(--ink);display:flex;gap:14px;align-items:center}
  .pillars span{font-family:'Gilda Display',serif;font-weight:700;font-size:26px;color:var(--wine);min-width:34px}
  .partnum{font-family:'Gilda Display',serif;font-weight:700;font-size:150px;line-height:.8;color:var(--rule)}
  .foot{margin-top:auto;padding-top:26px;display:flex;align-items:center;justify-content:space-between;font-size:14px;letter-spacing:.06em;color:var(--dim);border-top:1px solid var(--rule)}
  .foot .b{font-weight:700;color:var(--wine);letter-spacing:.14em;text-transform:uppercase}
  .pill{display:inline-block;margin-top:30px;background:var(--wine);color:#fff;font-weight:600;font-size:20px;padding:15px 28px;border-radius:100px}
  .pill.sage{background:var(--sage)}
  .disc{font-size:14px;line-height:1.6;color:var(--dim);margin-top:26px;max-width:62ch}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px}
  .two .box{background:var(--panel);border-radius:12px;padding:28px 30px}
  .two h3{font-family:'Gilda Display',serif;font-size:27px;color:var(--wine);margin-bottom:12px;font-weight:700}
  .two p{font-size:19px;line-height:1.42;color:var(--dim)}
  .nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;z-index:5}
  .nav button{font-family:'Montserrat';font-size:15px;font-weight:600;color:var(--bg);background:var(--wine);border:0;border-radius:100px;padding:10px 20px;cursor:pointer}
  .nav .count{font-size:14px;color:var(--dim);font-weight:600;min-width:52px;text-align:center}
  @media(max-width:720px){.slide{padding:38px 34px}h1{font-size:40px}h2{font-size:32px}.big{font-size:48px}.partnum{font-size:90px}.pillars{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button id="prev">Prev</button><div class="count" id="count"></div><button id="next">Next</button></div>
<script>
const BRAND = "Wendy Pitts Reeves, LCSW";
const S = [
  {t:'title',
   h:'The Profit-Centered, People-Forward Practice',
   s:'How healers build a practice that is profitable, sustainable, and genuinely theirs, without choosing between caring and getting paid.',
   by:'A live masterclass with Wendy Pitts Reeves, LCSW'},

  {t:'promise',
   k:'What you will leave with',
   h:'One hour. Three shifts.',
   items:['A new way to think about money that does not feel like a betrayal of why you do this work.',
          'The 7 Pillars every thriving practice stands on, and the one most healers skip.',
          'A clear first step toward a practice that pays you well and still fits your life.']},

  {t:'who',
   k:'Who this is for',
   h:'You help people heal. You just were not handed a business plan with your license.',
   items:['Therapists and counselors in private practice.',
          'Coaches, yoga teachers, and energy and bodywork practitioners.',
          'Healers who are good at the work and tired of being broke, booked out, or both.']},

  {t:'trap',
   k:'The trap',
   lead:'"I went into this to help people. I did not sign up to be a CEO."',
   s:'So the business side gets improvised at 11pm. You take whoever calls, charge what feels safe, and tell yourself the money will sort itself out. It does not.'},

  {t:'hook',
   k:'The part nobody says out loud',
   big:'The secret shame too many healers carry.',
   s:'We were trained to put the client first, always. And somewhere in there we learned that wanting to be paid well makes us a little bit of a fraud. That shame is quiet, and it is expensive.'},

  {t:'part',n:'1',h:'Why good healers stay broke'},

  {t:'problem',
   k:'The real problem',
   h:'Undercharging is not generosity.',
   items:['It is the slow road to resentment, exhaustion, and quitting the work you love.',
          'A practice that cannot pay you cannot keep serving anyone.',
          'Your lowest rate is not humility. It is a tax on your own longevity.']},

  {t:'idea',
   k:'The false choice',
   h:'Care OR money. Pick one.',
   s:'That is the story. It is also wrong. The most sustainable practices are run by people who refused the binary and decided they could do both at once.'},

  {t:'idea',
   k:'The reframe',
   big:'Profit-centered AND people-forward.',
   s:'Not profit instead of people. Not people instead of profit. A practice built so that doing right by your clients and being well paid are the same decision, not opposing ones.'},

  {t:'part',n:'2',h:'The 7 Pillars of an Ideal Practice'},

  {t:'pillars',
   k:'The framework',
   h:'Seven pillars. One practice that holds.',
   list:[['1','Purpose'],['2','People'],['3','Profit'],['4','Promotion'],['5','CEO Mindset'],['6','Systems & Support'],['7','Self-Leadership']],
   s:'Thirty years of private practice, distilled into the things that actually keep one standing.'},

  {t:'pillar',num:'1',name:'Purpose',
   lead:'The why underneath the why.',
   s:'Before pricing or marketing, get ruthlessly clear on what this practice is for and the life it is supposed to make possible. Every later decision gets easier when this one is settled.'},

  {t:'pillar',num:'2',name:'People',
   lead:'The clients you are actually built to serve.',
   s:'Not everyone who can pay. The people you do your best work with, and who are glad to pay for it. Choosing them is the first act of a practice that does not burn you out.'},

  {t:'pillar',num:'3',name:'Profit',
   lead:'The pillar most healers skip. Claim your worth first.',
   s:'Pricing and payments, done cleanly and without apology. This is where the money shame lives, so this is where the real work is. Get this right and most of the rest follows.'},

  {t:'pillar',num:'4',name:'Promotion',
   lead:'Messaging that connects you with your best clients.',
   s:'Marketing is not selling out. It is telling the right people, clearly, that you exist and can help. When the first three pillars are solid, this stops feeling gross and starts feeling honest.'},

  {t:'pillar',num:'5',name:'CEO Mindset',
   lead:'The shift from clinician to owner.',
   s:'You are still the healer in the room. You are also the person who runs the place. Learning to hold both, and to make owner-level decisions on purpose, is the pillar everything else leans on.'},

  {t:'pillar',num:'6',name:'Systems & Self-Leadership',
   lead:'The support that carries it when you cannot.',
   s:'The structures, habits, and boundaries that let the practice run without running you into the ground. How we do anything is how we do everything, so we build this one on purpose too.'},

  {t:'part',n:'3',h:'What an Ideal Practice looks like'},

  {t:'looks',
   k:'The outcome',
   h:'Profitable. Sustainable. Enjoyable.',
   two:[['Before','Fully booked and still anxious about money. Saying yes to the wrong clients. Doing the business side on fumes, late, alone.'],
        ['After','Charging what the work is worth, without the knot in your stomach. Fewer clients, better fit, more room. A practice that funds the life you wanted when you started.']]},

  {t:'why',
   k:'Why listen to me',
   h:'I built the practice I am describing. Then I helped other healers do the same.',
   items:['Licensed Clinical Social Worker, 30+ years in private practice.',
          'Host of the Ideal Practice podcast; member of the Forbes Coaches Council.',
          'Creator of the 7 Pillars and EVOLVE, a mastermind for practice owners who are ready.']},

  {t:'cta',
   k:'Your next step',
   h:'Start where the shame lives: your worth.',
   items:['Take the free IP 360 Scorecard and see which pillars are holding and which are not.',
          'Book a Quick Start Consult and we will map your first move together.',
          'When you are ready for the full build, EVOLVE is the 7-month room where it happens.'],
   disc:'This masterclass is educational. No specific income, caseload, or business result is guaranteed. Results vary and depend on your own practice, effort, and circumstances.'}
];

const stage = document.getElementById('stage');
function footHtml(){return '<div class="foot"><span class="b">The 7 Pillars of an Ideal Practice</span><span>'+BRAND+'</span></div>';}
function render(sl){
  let c='';
  if(sl.t==='title'){
    c='<div style="margin:auto 0"><div class="kick">A live masterclass</div><h1>'+sl.h+'</h1><div class="sub">'+sl.s+'</div><div class="pill sage">'+sl.by+'</div></div>';
  }else if(sl.t==='part'){
    c='<div style="margin:auto 0;display:flex;align-items:center;gap:44px"><div class="partnum">'+sl.n+'</div><h2 style="font-size:52px">'+sl.h+'</h2></div>';
  }else if(sl.t==='hook'||(sl.t==='idea'&&sl.big)){
    c='<div style="margin:auto 0">'+(sl.k?'<div class="kick">'+sl.k+'</div>':'')+'<div class="big">'+sl.big+'</div><div class="sub" style="max-width:52ch">'+sl.s+'</div></div>';
  }else if(sl.t==='trap'){
    c='<div style="margin:auto 0"><div class="kick">'+sl.k+'</div><div class="lead">'+sl.lead+'</div><div class="sub" style="max-width:54ch">'+sl.s+'</div></div>';
  }else if(sl.t==='idea'){
    c='<div style="margin:auto 0"><div class="kick">'+sl.k+'</div><h1>'+sl.h+'</h1><div class="sub" style="max-width:54ch">'+sl.s+'</div></div>';
  }else if(sl.t==='pillars'){
    let g=sl.list.map(p=>'<div><span>'+p[0]+'</span>'+p[1]+'</div>').join('');
    c='<div><div class="kick">'+sl.k+'</div><h1>'+sl.h+'</h1><div class="pillars">'+g+'</div><div class="sub">'+sl.s+'</div></div>';
  }else if(sl.t==='pillar'){
    c='<div style="margin:auto 0"><div class="kick">Pillar '+sl.num+'</div><h2 style="font-size:54px">'+sl.name+'</h2><div class="lead" style="margin-top:20px;max-width:30ch">'+sl.lead+'</div><div class="sub" style="max-width:56ch">'+sl.s+'</div></div>';
  }else if(sl.t==='looks'){
    let b=sl.two.map(x=>'<div class="box"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>').join('');
    c='<div><div class="kick">'+sl.k+'</div><h1>'+sl.h+'</h1><div class="two">'+b+'</div></div>';
  }else if(sl.t==='cta'){
    let it=sl.items.map(i=>'<li>'+i+'</li>').join('');
    c='<div><div class="kick">'+sl.k+'</div><h1>'+sl.h+'</h1><ul>'+it+'</ul><div class="disc">'+sl.disc+'</div></div>';
  }else{
    let it=(sl.items||[]).map(i=>'<li>'+i+'</li>').join('');
    c='<div'+(sl.t==='hook'?'':' ')+'><div class="kick">'+(sl.k||'')+'</div><h1>'+sl.h+'</h1><ul>'+it+'</ul></div>';
  }
  return '<section class="slide">'+c+footHtml()+'</section>';
}
stage.innerHTML = S.map(render).join('');
const slides=[...document.querySelectorAll('.slide')];
let i=0;
function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));document.getElementById('count').textContent=(i+1)+' / '+slides.length;}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
show(0);
</script>
</body>
</html>
