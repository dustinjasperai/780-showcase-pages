<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Courageous Team · Stephanie Freeth · Executive Team Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f3efe8; --panel:#fbf9f5; --rule:#e3ddd0;
    --acc:#2f5d62; --slate:#23303a; --ink:#23303a; --grey:#4f5560; --dim:#8a8578; --brass:#a97b3c;
  }
  html,body{height:100%}
  body{background:#e9e3d8;font-family:'Inter',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9e3d8}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Spectral',Georgia,serif;font-weight:700;color:var(--slate);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.1vw;max-width:93%}
  .t-normal h1{font-size:3.0vw;max-width:88%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.7vh;max-width:77%;line-height:1.58;font-weight:400}
  .sub{font-family:'Inter',sans-serif;font-size:1.68vw;color:var(--grey);margin-top:3.2vh;max-width:82%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.24vw;font-weight:600;color:var(--brass);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:4.5vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#2c3b46 0%,#1a242c 100%);align-items:center;text-align:center}
  .t-dark h1{font-family:'Spectral',Georgia,serif;font-weight:500;font-style:italic;font-size:3.2vw;max-width:88%;color:#f3efe8}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#fbf9f5 0%,#efe7d9 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:88%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Inter',sans-serif;border:1.5px solid var(--slate);color:var(--slate);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.14vw;font-weight:500}
  .chip.solid{background:var(--acc);border-color:var(--acc);color:#f3efe8}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Inter',sans-serif;font-size:.9vw;color:var(--dim);text-align:center;line-height:1.44}
  .t-title .disc,.t-normal .disc{text-align:left}
  .stat-row{display:flex;gap:3.4vw;margin-top:4vh}
  .stat .n{font-family:'Spectral',Georgia,serif;font-size:2.7vw;font-weight:700;color:var(--acc);line-height:1}
  .stat .l{font-family:'Inter',sans-serif;font-size:1.02vw;color:var(--grey);margin-top:1vh;letter-spacing:.02em}
  .mesh{position:absolute;pointer-events:none;right:7%;bottom:8.5%;width:20vw;opacity:.9}
  .corner-mesh{position:absolute;pointer-events:none;right:6%;bottom:7.5%;width:9vw;opacity:.45}
  .brandline{font-family:'Inter',sans-serif;font-size:1.2vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.01em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(35,48,58,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.3vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.6vw}.stat .n{font-size:6vw}.stat .l{font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Stephanie Freeth</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: nine points on a circle (the Enneagram), a few honest chords drawn across it -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mesh" viewBox="0 0 200 200">
  <g fill="none" stroke="#23303a" stroke-width="1.6" opacity="0.55">
    <circle cx="100" cy="100" r="82"/>
    <path d="M100 18 L171 141 L29 141 Z"/>
    <path d="M100 18 L58 178 M100 18 L142 178 M18 78 L182 78"/>
  </g>
  <g fill="#2f5d62">
    <circle cx="100" cy="18" r="6"/><circle cx="171" cy="59" r="5"/><circle cx="182" cy="122" r="5"/>
    <circle cx="142" cy="178" r="5"/><circle cx="58" cy="178" r="5"/><circle cx="18" cy="122" r="5"/>
    <circle cx="29" cy="59" r="5"/><circle cx="100" cy="100" r="4" fill="#a97b3c"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Courageous Team',sub:'How executive teams build the trust and candor that lets them actually decide, using the Enneagram to read what is really happening in the room. A live masterclass for CEOs and leadership teams.',brand:true,mesh:true},
 {t:'normal',k:'Who this is for',title:'Your team is smart, aligned on paper, and somehow still stuck.',body:'Everyone nods in the meeting. The plan is sound. And then the decision does not move, the same tension resurfaces next quarter, and the people in the room privately disagree in ways they never say out loud. The talent is not the problem.'},
 {t:'dark',title:'It was almost never the strategy. It was what nobody in the room was willing to say.'},

 {t:'section',idx:'Part One',title:'Why Smart Teams Stall'},
 {t:'normal',k:'The polite-agreement trap',title:'A team that cannot disagree cannot really decide.',body:'When candor feels unsafe, people agree in the room and hedge outside it. The meeting ends with a nod and no real commitment, so execution quietly stalls. Consensus that skips the honest conversation is not alignment, it is avoidance wearing a nicer suit.'},
 {t:'normal',k:'The cost at the top',title:'Low trust is expensive in ways that never show up on the agenda.',body:'Decisions get re-litigated, good people go quiet, and the leader ends up as the single point everything routes through. The drama is not a personality issue to manage around. It is a signal about the health of the team underneath the strategy.'},
 {t:'dark',title:'High trust, low drama, high learning. That is the culture a strategy can actually run on.'},

 {t:'section',idx:'Part Two',title:'The Enneagram Lens on Your Team'},
 {t:'normal',k:'Under the behavior',title:'Every hard-to-name pattern is a defense protecting a core fear.',body:'The Enneagram maps the personality structures and defense mechanisms that protect what each of us is most afraid of. Once a team can see those patterns without blame, the behavior that used to look like stubbornness or silence becomes something you can actually talk about.'},
 {t:'normal',k:'Head, heart, and body',title:'Judgment under pressure lives in three intelligences, not one.',body:'Leaders are trained to trust IQ. But the moments that make or break a team are read in emotional intelligence and body intelligence too, the felt sense that something is off before anyone has words for it. Learning to use all three is what lets a team stay honest when the stakes rise.'},
 {t:'normal',k:'The Executive Team Health Matrix',title:'You can read the health of a team honestly, on purpose.',body:'The Matrix is a way to see where trust, candor, decision clarity, and alignment actually stand right now, especially through growth, transition, or sustained pressure. Naming where the team is turns a vague sense of friction into a specific place to start.'},
 {t:'dark',title:'Trust first. Candor second. Strategy third. Reverse that order and the plan stalls.'},

 {t:'section',idx:'Part Three',title:'Candor Without Blowing Up the Room'},
 {t:'normal',k:'The practice',title:'Courage is a skill a team can build, not a personality some people have.',body:'It starts by making the undiscussable discussable, one honest sentence at a time. When leaders model taking responsibility instead of assigning blame, and invite the disagreement that was already in the room, the team learns it is safe to be direct. That is where real decisions get made.'},
 {t:'normal',k:'What changes',title:'Same people, a more honest room, a faster decision.',body:'The team does not change. The conversation does. Meetings surface the real objection instead of burying it, commitments hold because they were tested, and the leader stops being the only person carrying the truth. Trust compounds every time candor is safe.'},
 {t:'normal',k:'Why Stephanie Freeth',title:'Twenty-five years helping senior leaders and their teams get honest.',body:'A strategist and executive coach who works leaders across intellect, emotion, and body, certified in the 15 Commitments of Conscious Leadership and accredited in the Integrative Enneagram, and the creator of the Executive Team Health Matrix.',stats:[['25+','years with senior leaders and teams'],['iEQ9','Integrative Enneagram accredited'],['6 yrs','co-facilitating Leadership Detroit']]},
 {t:'dark',title:'The team is the strategy. Everything else is a plan waiting on people who trust each other.'},

 {t:'section',idx:'Your Next Step',title:'Start With an Honest Read'},
 {t:'normal',k:'Where to start',title:'See where your team actually stands, then build from there.',body:'The work begins with a clear-eyed read of your team using the Executive Team Health Matrix, followed by the trust and candor practices that let the group decide and move together. The first step is a straight conversation about where your leadership team is right now.'},
 {t:'cta',title:'Ready to build a team that can be honest with each other?',chips:['Start with a team health read','Explore working with Stephanie'],disc:'Educational content for CEOs and leadership teams. No specific leadership or business result is guaranteed. Outcomes vary by team, organization, and starting conditions.'},
];

const deck=document.getElementById('deck');
function mesh(){return `<svg class="mesh"><use href="#mesh"/></svg>`}
function cornerMesh(){return `<svg class="corner-mesh"><use href="#mesh"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.stats) h+=`<div class="stat-row">`+s.stats.map(st=>`<div class="stat"><div class="n">${st[0]}</div><div class="l">${st[1]}</div></div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Stephanie <b>Freeth</b> · Executive Team Health</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map((c,ci)=>`<div class="chip ${ci===0?'solid':''}">${c}</div>`).join('')+`</div>`;
  }
  if(s.mesh) h+=mesh();
  else if(s.t==='title') h+=mesh();
  else if(s.t==='normal') h+=cornerMesh();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
