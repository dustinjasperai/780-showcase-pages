<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Living From the Art You Love — a masterclass with Kelly Rae Roberts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf6f0; --panel:#ffffff; --ink:#155c57; --accent:#c03c94; --gold:#e7c431;
    --muted:#5c6b68;
    --serif:"DM Serif Display",Georgia,serif;
    --sans:"Mulish",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid #ece2d6;border-radius:18px;
    padding:52px 54px;margin:0 0 26px;box-shadow:0 1px 0 #efe6da;position:relative;overflow:hidden}
  .slide.dark{background:var(--ink);color:var(--bg);border-color:#0e433f}
  .slide.dark .k{color:var(--gold)}
  .slide.dark .sub,.slide.dark .body,.slide.dark li{color:#e9efed}
  .slide.dark .rule{background:var(--gold)}
  .k{font-family:var(--sans);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 14px}
  h1{font-family:var(--serif);font-size:54px;line-height:1.04;margin:0 0 16px;font-weight:400}
  h2{font-family:var(--serif);font-size:38px;line-height:1.1;margin:0 0 14px;font-weight:400}
  .sub{font-size:21px;line-height:1.5;color:var(--muted);margin:0 0 10px;max-width:40ch}
  .body{font-size:19px;line-height:1.6;color:#36433f;margin:10px 0 0;max-width:58ch}
  .rule{height:5px;width:74px;background:var(--accent);border-radius:4px;margin:0 0 22px}
  ul{margin:18px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;margin:0 0 14px;padding-left:30px;position:relative;color:#36433f;max-width:56ch}
  li:before{content:"";position:absolute;left:0;top:9px;width:13px;height:13px;border-radius:3px;
    background:var(--gold);transform:rotate(45deg)}
  .pill{display:inline-block;font-weight:700;font-size:14px;color:var(--ink);
    background:#f6e7b8;border-radius:999px;padding:6px 14px;margin-top:22px}
  .big{font-family:var(--serif);font-size:46px;line-height:1.08;margin:0 0 10px;font-weight:400}
  .foot{font-size:13px;color:#8a9793;margin-top:8px}
  .disc{font-size:14px;line-height:1.5;color:#8a9793;margin-top:26px;max-width:60ch}
  .n{font-family:var(--serif);font-size:30px;color:var(--accent);margin-right:10px}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:38px}h2{font-size:28px}.big{font-size:32px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title', cls:'dark', k:'A live masterclass with Kelly Rae Roberts',
   h1:'Build a Living From the Art You Love',
   sub:'The Possibilitarian path from a quiet hobby to a working artist.'},

  {t:'who', k:'Who this is for',
   h:'You are in the right room if',
   list:[
     'You make art you love, but it still feels like a private hobby.',
     'You are tired of hearing "just keep creating" with no plan for the money.',
     'You are curious whether prints, licensing, or courses could actually pay you.'
   ]},

  {t:'trap', k:'The honest starting point',
   h:'Talent was never your problem',
   body:'You can already make the work. What you were never taught is the part that turns a gift into a living: permission, a real body of work, and income streams built for an artist. That gap is not a flaw in you. It is a missing lesson.'},

  {t:'hook', cls:'dark', k:'The reframe',
   big:'Most artists stay hidden because they are waiting for permission that is never coming.',
   body:'So we are going to take it today, and then build the structure underneath it.'},

  {t:'story', k:'Why I can show you this',
   h:'I started at thirty, with a day job',
   body:'Before I picked up my first paintbrush I was a clinical medical social worker. I followed my creative whispers, began sharing the work, and slowly built a life around it: books, licensed collections sold around the world, courses, and retreats. I am not special. I just learned the path, one brave step at a time.'},

  {t:'part', k:'Part One', h:'The Permission Problem'},

  {t:'permission', k:'The belief to retire',
   h:'"Real artists do not sell"',
   body:'This is the story that keeps the most gifted people the most invisible. Selling your art is not a betrayal of it. It is how the work reaches the people it was made for, and how you get to keep making it. Permission is the first skill, not a personality trait.'},

  {t:'part', k:'Part Two', h:'The Possibilitarian Path'},

  {t:'p1', k:'Move one', h:'Permission',
   body:'Say yes out loud. Decide that your art is allowed to be a real part of your income. Everything downstream depends on this one quiet decision, so we make it on purpose.'},

  {t:'p2', k:'Move two', h:'A body of work and your voice',
   body:'A living comes from a body of work, not a single piece. We look at how to make consistently, find the message that is only yours, and turn it into mantra art that people connect with and want to own.'},

  {t:'p3', k:'Move three', h:'Income streams that fit an artist',
   body:'One painting can become many kinds of income: original work, prints, and print-on-demand or licensed products. This is the exact model I used to put my art into homes around the world, and it is more reachable than it looks.'},

  {t:'p4', k:'Move four', h:'Heart-led branding and visibility',
   body:'Being seen does not have to feel pushy. Heart-led branding means letting your real voice and story do the work, so the right people find you and feel you before they ever buy.'},

  {t:'p5', k:'Move five', h:'Community and the long game',
   body:'Careers are built in community, not isolation. Circles, retreats, and a steady relationship with the people who love your work are what make a creative life last for decades, not months.'},

  {t:'part', k:'Part Three', h:'A Working Artist\'s Ordinary Week'},

  {t:'after', k:'The shift',
   h:'From hobby to working artist',
   list:[
     'Your art has a front door, so new people find you every week.',
     'You have more than one way to get paid for the work you already make.',
     'Marketing feels like sharing, because it sounds like you.',
     'You are held by a community instead of guessing alone.'
   ]},

  {t:'cred', cls:'dark', k:'Twenty years on this path',
   big:'Author of Taking Flight. Work licensed around the world. Tens of thousands of students taught.',
   body:'Not as a highlight reel, but as proof that this path is walkable by someone who started exactly where you are.'},

  {t:'recap', k:'The whole path on one slide',
   h:'Permission. A body of work. Income streams. Heart-led visibility. Community.',
   body:'Five moves, in order. Each one is learnable, and each one compounds on the last.'},

  {t:'cta', cls:'dark', k:'Your next step',
   h:'Come keep walking with me',
   body:'Join the Possibilitarian newsletter for the free manifesto, step into the Possibilitarian Path circle when it opens, and come paint and plan with me at a retreat. The art is already in you. Let us build the living around it.',
   disc:'Educational content only. Nothing here is a promise of income, sales, or results, and no outcome is guaranteed. Your results will vary and depend on your own work and circumstances.'}
];

const app = document.getElementById('app');
S.forEach(s=>{
  const d = document.createElement('section');
  d.className = 'slide' + (s.cls === 'dark' ? ' dark' : '');
  let html = '';
  if(s.k) html += '<p class="k">'+s.k+'</p>';
  html += '<div class="rule"></div>';
  if(s.h1) html += '<h1>'+s.h1+'</h1>';
  if(s.big) html += '<p class="big">'+s.big+'</p>';
  if(s.h) html += '<h2>'+s.h+'</h2>';
  if(s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if(s.body) html += '<p class="body">'+s.body+'</p>';
  if(s.list){ html += '<ul>'; s.list.forEach(i=> html += '<li>'+i+'</li>'); html += '</ul>'; }
  if(s.pill) html += '<span class="pill">'+s.pill+'</span>';
  if(s.disc) html += '<p class="disc">'+s.disc+'</p>';
  d.innerHTML = html;
  app.appendChild(d);
});
</script>
</body>
</html>
