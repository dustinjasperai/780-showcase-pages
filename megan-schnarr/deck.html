<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Becoming Her: Redesigning a Life You've Outgrown - Megan Schnarr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1eb;
    --ink:#0c0c0c;
    --panel:#ffffff;
    --rule:#62605e;
    --accent:#e85e3f;
    --accent2:#a0b5dc;
    --display:'Cormorant', Georgia, serif;
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e7e1d7;color:var(--ink);font-family:var(--body);line-height:1.5;padding:40px 16px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  .slide{background:var(--bg);border:1px solid #e0d9cc;border-radius:4px;padding:72px 64px;min-height:540px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:attr(data-n);position:absolute;right:24px;bottom:18px;font-size:12px;letter-spacing:.14em;color:var(--rule);opacity:.6}
  .kicker{font-family:var(--body);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--display);font-weight:600;font-size:64px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:46px;line-height:1.08;margin-bottom:20px}
  .sub{font-family:var(--display);font-style:italic;font-size:26px;color:var(--rule);margin-top:24px;max-width:28ch}
  p{font-size:20px;max-width:60ch;margin-top:16px}
  .lead{font-size:23px;max-width:56ch}
  ul{margin-top:20px;max-width:58ch;list-style:none}
  li{font-size:20px;padding:12px 0 12px 30px;border-bottom:1px solid #e0d9cc;position:relative}
  li::before{content:'';position:absolute;left:0;top:22px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  .phases{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
  .phase{background:var(--panel);border:1px solid #e0d9cc;border-top:3px solid var(--accent);border-radius:3px;padding:20px 16px}
  .phase .num{font-family:var(--display);font-size:30px;color:var(--accent);font-weight:600}
  .phase .nm{font-weight:600;font-size:16px;margin-top:6px}
  .phase .ds{font-size:14px;color:var(--rule);margin-top:8px;line-height:1.45}
  .big{font-family:var(--display);font-size:52px;line-height:1.1;font-weight:500;max-width:22ch}
  .accentbar{width:64px;height:4px;background:var(--accent);margin-bottom:28px}
  .quote{font-family:var(--display);font-style:italic;font-size:38px;line-height:1.2;max-width:26ch}
  .cite{margin-top:24px;font-size:15px;letter-spacing:.04em;color:var(--rule)}
  .disclaimer{margin-top:30px;font-size:13px;color:var(--rule);max-width:62ch;line-height:1.5}
  .cta-step{font-size:22px;margin-top:14px;padding-left:30px;position:relative}
  .cta-step::before{content:'';position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent2);border-radius:50%}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'cover', kicker:'A live masterclass with Megan Schnarr',
   title:'Becoming Her', sub:'Redesigning a life you have outgrown, without burning it down.'},

  {t:'promise', kicker:'The promise',
   h:'By the end of this hour, you will know exactly what is off and what to do first.',
   lead:'Not a vision board. A clear read on the life you are actually living, a picture of the one you want, and the first real move to close the gap.'},

  {t:'who', kicker:'Who this is for',
   h:'You built the life. It stopped feeling like yours.',
   lead:'You are smart, capable, high-achieving. You did the things you were supposed to do. And quietly, you are wondering what it was all for. You are not ungrateful. You outgrew the version of your life that used to fit.'},

  {t:'reframe', kicker:'The reframe',
   big:'This is not a breakdown. It is the start of a redesign.',
   p:'The feeling that something is off is not a problem to fix. It is information. It is the gap between who you were and who you are becoming, finally getting loud enough to hear.'},

  {t:'section', kicker:'Part one', h:'Why clarity keeps slipping away'},

  {t:'point', kicker:'The core problem',
   h:'You cannot design a new life while performing the old one.',
   lead:'Most high-achievers try to think their way out. But you were taught that more equals more, and no amount of intellectual understanding shifts a pattern your body still runs. The Good Girl keeps over-delivering while you quietly burn out.'},

  {t:'point', kicker:'The trap',
   h:'More goals on top of a life that already does not fit.',
   lead:'Adding another plan to an un-audited life just makes the misalignment more efficient. You get better at a life you do not actually want. The work is not more. It is honest, and then it is structural.'},

  {t:'section', kicker:'Part two', h:'The 4-Phase Life Design Model'},

  {t:'framework', kicker:'The method',
   h:'Four phases, in order.',
   phases:[
     {num:'01', nm:'The Audit', ds:'Get honest about the life you are living now. Career, money, relationships, health, you.'},
     {num:'02', nm:'The Design', ds:'Picture an ordinary day that feels really good to live. Realistic, not fantasy.'},
     {num:'03', nm:'The Gap Work', ds:'Build the systems and habits that close the distance between the two.'},
     {num:'04', nm:'The Embodiment', ds:'Small daily steps in her direction, until the new version of you feels safe.'}
   ]},

  {t:'point', kicker:'Phase one, the Audit',
   h:'You cannot design a new life if you are not clear about the one you are living.',
   list:['Where does your energy actually go?','What fills you up, what drains you?','Which patterns have quietly kept you stuck?','What already feels aligned, and gets to stay?']},

  {t:'point', kicker:'Phase two, the Design',
   h:'The Ideal Day question.',
   lead:'What would a normal day look like if your life felt really good to live? Answer fast, in one sitting. The first thought is usually your true desire. We design the ordinary days, not just the big milestones.'},

  {t:'point', kicker:'Phase three, the Gap Work',
   h:'Clarity without structure evaporates by Thursday.',
   lead:'Between the life you are living and the one you want, there is a gap. We close it with practical systems: your mornings, your evenings, your week, and the few things you actually enjoy. Aligned action, without the burnout.'},

  {t:'point', kicker:'Phase four, the Embodiment',
   h:'Meet her, then build around her.',
   lead:'The version of you that feels calm, clear and like herself again. You become her the same way you became anyone else you have been: small steps, every day, showing yourself that this new version is safe to step into.'},

  {t:'quote', kicker:'The shift',
   quote:'You were taught that more equals more. What if time is the new wealth?',
   cite:'The unlearning at the center of life design.'},

  {t:'section', kicker:'Part three', h:'What a designed life looks like'},

  {t:'point', kicker:'The other side',
   h:'Calm, clear, and genuinely yours.',
   lead:'Not a life that looks good on paper and feels off on the inside. Ordinary days you actually want to live. The freedom to choose, whether that is your career, a business, a relationship, or simply more room to breathe.'},

  {t:'point', kicker:'Why me',
   h:'Clarity, strategy and systems. Not therapy, not hustle.',
   lead:'I am a Life Design Coach and a recovering Type A. I work with women one on one and write to thousands more each week about what it actually takes to stop performing and start living. This model is the one I used, and the one I run my clients through.'},

  {t:'cta', kicker:'Your next step',
   h:'Start with the Audit.',
   lead:'If today named something you have been carrying, that is the signal. The next step is a free clarity call, where we run the first phase together and map what to design first.',
   step:'Book a free clarity call with Megan',
   disclaimer:'This masterclass is for educational purposes only. It is not therapy or medical advice, and it makes no guarantee of any specific outcome. Life design results vary from person to person.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  el.setAttribute('data-n', String(i+1).padStart(2,'0') + ' / ' + String(S.length).padStart(2,'0'));
  let h = '';
  if (s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if (s.t === 'cover') {
    h += '<div class="accentbar"></div><h1>'+s.title+'</h1><div class="sub">'+s.sub+'</div>';
  } else if (s.t === 'section') {
    h += '<div class="accentbar"></div><h1>'+s.h+'</h1>';
  } else if (s.t === 'reframe') {
    h += '<div class="big">'+s.big+'</div><p class="lead">'+s.p+'</p>';
  } else if (s.t === 'quote') {
    h += '<div class="quote">'+s.quote+'</div><div class="cite">'+s.cite+'</div>';
  } else if (s.t === 'framework') {
    h += '<h2>'+s.h+'</h2><div class="phases">';
    s.phases.forEach(p => { h += '<div class="phase"><div class="num">'+p.num+'</div><div class="nm">'+p.nm+'</div><div class="ds">'+p.ds+'</div></div>'; });
    h += '</div>';
  } else if (s.t === 'cta') {
    h += '<h2>'+s.h+'</h2><p class="lead">'+s.lead+'</p><div class="cta-step">'+s.step+'</div><div class="disclaimer">'+s.disclaimer+'</div>';
  } else {
    if (s.h) h += '<h2>'+s.h+'</h2>';
    if (s.lead) h += '<p class="lead">'+s.lead+'</p>';
    if (s.list) { h += '<ul>'; s.list.forEach(x => h += '<li>'+x+'</li>'); h += '</ul>'; }
  }
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
