<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>How to Build an Abundant Yoga Business · Amy McDonald</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d0c3c; --panel:#161154; --rule:#2c1797;
    --acc:#e0b15e; --idx:#b9a7e8; --chalk:#faf7f5; --grey:#c8c2e6; --dim:#7a75a6;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Mulish',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Jost',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Jost',sans-serif;font-weight:500;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.4vw;max-width:90%;font-weight:600}
  .t-normal h1{font-size:3.25vw;max-width:85%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.55;font-weight:300}
  .sub{font-size:1.75vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Jost',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:90%;font-weight:600}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1c1668 0%,#08072a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;font-style:italic;color:#fdf6ea;font-weight:400}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1c1668 0%,#08072a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:84%;font-weight:600}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#f3dcae;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.22vw;font-weight:500;font-family:'Jost',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .lotus{position:absolute;pointer-events:none;opacity:.92}
  .title-lotus{right:7.5%;bottom:8%;width:20vw}
  .corner-lotus{right:6%;bottom:7.5%;width:9vw;opacity:.45}
  .brandline{font-family:'Jost',sans-serif;font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Abundant Yoga Teacher</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- open-lotus motif: a centre petal flanked by two opening petals, rising from a base line -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lotus" viewBox="0 0 240 150">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="34" y1="128" x2="206" y2="128" stroke="#b9a7e8" opacity="0.32"/>
    <path d="M120 122 C104 84 104 52 120 28 C136 52 136 84 120 122 Z" stroke="#e0b15e" opacity="0.95"/>
    <path d="M120 122 C86 96 70 66 70 40 C104 52 120 82 120 122 Z" stroke="#e0b15e" opacity="0.7"/>
    <path d="M120 122 C154 96 170 66 170 40 C136 52 120 82 120 122 Z" stroke="#e0b15e" opacity="0.7"/>
    <path d="M120 122 C64 110 44 88 40 66 C78 70 108 92 120 122 Z" stroke="#b9a7e8" opacity="0.4"/>
    <path d="M120 122 C176 110 196 88 200 66 C162 70 132 92 120 122 Z" stroke="#b9a7e8" opacity="0.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'How to Build an Abundant Yoga Business',sub:'A live masterclass for yoga teachers who want to earn a real living without betraying the reason they started teaching.',brand:true,lotus:'title'},
 {t:'normal',k:'Who this is for',title:'You teach beautiful classes. The business is where it comes undone.',body:'You trained for years to hold space, sequence a class, and guide a room. Nobody trained you to price it, fill it, or talk about money without flinching. So the teaching thrives and the business quietly struggles.'},
 {t:'dark',title:'You were never bad at business. You were taught that wanting money makes you a lesser yogi.'},

 {t:'section',idx:'Part One',title:'Why Good Teachers Stay Broke'},
 {t:'normal',k:'The scarcity story',title:'The wounded healer gives everything away and calls it devotion.',body:'Discount the workshop. Round the price down. Say yes to the student who cannot pay. Each choice feels generous, and together they build a business that cannot hold you, let alone the people you want to serve.'},
 {t:'normal',k:'The cost of undercharging',title:'A price set from fear teaches your students to value you less.',body:'When the number apologises for itself, the room feels it. Underpricing does not fill classes, it fills them with people who were never going to stay. The teacher carries the shortfall in unpaid hours and slow burnout.'},
 {t:'dark',title:'An empty bank account is not humility. It is a devoted teacher heading for burnout.'},

 {t:'section',idx:'Part Two',title:'The Abundant Yoga Teacher Method'},
 {t:'normal',k:'Set the foundations',title:'Start from a clear vision and honest numbers.',body:'Before tactics, you need to know what you are building and what it must earn to be worth building. A vision with real numbers under it turns a hobby that drains you into a business that carries you.'},
 {t:'normal',k:'Stand out',title:'Teach in your own voice, not the voice of every other studio.',body:'There are a thousand vinyasa classes within a phone tap. What there is one of is you: your language, your lineage, the way you actually help people change. Naming that clearly is what makes a student choose you on purpose.'},
 {t:'normal',k:'The class container',title:'Price with confidence, package with care, and build a Kula.',body:'A single drop-in class is the hardest thing to sell and the easiest to skip. Offers with a beginning and an end, priced without apology, held inside a real community, are what turn first-timers into the Kula that keeps coming back.'},
 {t:'normal',k:'Market like a pro',title:'Sharing your work is service, not selling out.',body:'Marketing is simply telling the people who need you that you exist, in words that sound like you. Done in your own voice, it stops feeling gross and starts feeling like an extension of the teaching itself.'},
 {t:'normal',k:'Grow, serve and shine',title:'Abundance is a practice before it is a number.',body:'The inner work runs underneath all of it: releasing the belief that money and meaning cannot share a room. A teacher who has done that work sets a fair price, holds it, and serves from a full cup instead of an empty one.'},
 {t:'dark',title:'Price it right, build your Kula, and full rooms stop depending on luck.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The teacher this builds',title:'Full classes, fair pay, and a business that runs on your values.',body:'You take the students who are right for you, hold prices that let you keep teaching for decades, and grow a community that brings the next student to the door. The work that felt precarious starts to feel like a life.'},
 {t:'dark',title:'Abundance is not less yoga. It is more of you, reaching more of the people who need you.'},
 {t:'normal',k:'Why Amy McDonald',title:'A yoga teacher who learned the business, taught in the open.',body:'Amy McDonald hosts the Abundant Yoga Teacher podcast, runs the Abundant Yoga Teacher Immersion in cities across Australia, and coaches teachers privately and inside the Keep Growing Mastermind. She teaches the whole method, mindset and mechanics together.'},

 {t:'section',idx:'Your Next Step',title:'Build Your Abundant Business'},
 {t:'normal',k:'Where to begin',title:'Start with the free training, then go deeper.',body:'The free seven part training walks you through attracting students. From there the Immersion and the Keep Growing Mastermind take you all the way to a full, values-aligned yoga business, with the accountability to actually get there.'},
 {t:'cta',title:'Ready to grow, serve and shine?',chips:['Start the free 7 part training','Join the Keep Growing Mastermind'],disc:'Educational content for yoga teachers and holistic practitioners. No income or business result is guaranteed. Results vary by teacher, market, and effort.'},
];

const deck=document.getElementById('deck');
function lotus(kind){return `<svg class="lotus ${kind==='title'?'title-lotus':'corner-lotus'}"><use href="#lotus"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Amy McDonald · <b>Abundant Yoga Teacher</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.lotus) h+=lotus(s.lotus);
  else if(s.t==='title') h+=lotus('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
