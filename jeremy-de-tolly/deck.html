<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finding Your Radiant Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161f;      /* from site dark ground #161e2a, deepened */
    --panel:#1b2230;
    --rule:#2b3444;
    --accent:#d8b234;  /* his dominant brand gold, verbatim from extract_brand */
    --ink:#f4f1e8;
    --mut:#9aa6b6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:24px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:22px 0;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:52px;line-height:1.08;margin-bottom:18px}
  h2{font-family:'Playfair Display',serif;font-weight:700;font-size:38px;line-height:1.12;margin-bottom:16px}
  p{font-size:20px;line-height:1.6;color:var(--ink);max-width:40em;margin-bottom:12px}
  p.sub{color:var(--mut);font-size:19px}
  ul{margin:14px 0 0 0;padding:0;list-style:none;max-width:42em}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 26px;position:relative;border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:2px;background:var(--accent)}
  /* the waterline motif */
  .waterline{height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin:22px 0;width:70%}
  .tag{position:absolute;top:22px;right:28px;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--mut)}
  .big{font-size:30px;font-family:'Playfair Display',serif;color:var(--accent);line-height:1.2}
  .disc{color:var(--mut);font-size:14px;line-height:1.5;margin-top:22px;max-width:46em}
  .nav{position:fixed;bottom:16px;right:20px;background:var(--panel);border:1px solid var(--rule);
    border-radius:8px;padding:6px 12px;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav" id="nav"></div>
<script>
const BRAND="Radiant Voices";
const S=[
 {t:'title',eyebrow:'A live masterclass with Jeremy de Tolly',
  h:'Finding Your Radiant Voice',
  p:'Why speaking freezes you, and how to free it from underneath, not with more technique.'},

 {t:'who',eyebrow:'Who this is for',
  h:'For anyone whose voice goes first',
  p:'CEOs, keynote speakers, coaches, creatives and quietly capable people who freeze, race, overthink or shut down the moment it is their turn to speak, in the room, on camera, or on a feed.',
  li:['You rehearse for hours and still blank out','Your voice shakes or speeds up under pressure','You sound nothing like the person you are in private']},

 {t:'trap',eyebrow:'The trap',
  h:'You have been told to practise harder',
  p:'More notes. More reps. More breathing tips off the internet. And it helps a little, right up until the pressure arrives, and then the old pattern takes the wheel again.',
  sub:'If effort were the answer, you would have solved this years ago.'},

 {t:'reframe',eyebrow:'The reframe',
  big:'What appears to be in the way, is the way.',
  p:'The freeze is not a flaw to push past. It is information. It is your body doing exactly what it learned to do a long time ago, and it is pointing straight at the work.'},

 {t:'part',eyebrow:'Part one',h:'The core problem',
  p:'Your voice was not born blocked. It was imprinted.'},

 {t:'body',eyebrow:'Part one',
  h:'Your voice is imprinted',
  p:'How you speak was shaped by childhood, parenting, school and culture, long before any meeting or stage. Somewhere you learned it was safer to be quiet, to be fast, to be small. That lesson never left.',
  sub:'So when the pressure comes, you do not choose the freeze. It chooses you.'},

 {t:'waterline',eyebrow:'The model',
  h:'The waterline',
  p:'Every voice has two layers. Above the waterline is everything you can teach and drill: pace, breath, structure, delivery. Below it are the automatic reactions and nervous-system patterns that actually decide what happens when you open your mouth.',
  line:true,
  sub:'Most training only ever touches the top. That is why it stops working the moment you are nervous.'},

 {t:'body',eyebrow:'Part one',
  h:'Why technique alone fails',
  p:'You cannot out-technique a braced nervous system. When the body is in protection, the clever words you prepared simply are not available. The fix is not more surface. It is settling the layer underneath.'},

 {t:'part',eyebrow:'Part two',h:'The Radiant Voices Process',
  p:'How we work both above and below the waterline, in order.'},

 {t:'body',eyebrow:'Part two, pillar one',
  h:'Settle the body first',
  p:'Before words, breath and release. Using body-based practices, including the tension-release and tapping methods I am trained in, we teach the nervous system that speaking is safe, so it stops bracing on your behalf.',
  li:['Down-regulate the freeze response','Free the breath that fear holds','Let the voice drop back into the body']},

 {t:'body',eyebrow:'Part two, pillar two',
  h:'Meet the block, do not fight it',
  p:'The shake, the held breath, the rushing, each one is a doorway, not an enemy. We turn toward what you have spent years bracing against, and the charge starts to drain out of it.'},

 {t:'body',eyebrow:'Part two, pillar three',
  h:'Then, and only then, the craft',
  p:'With the body settled, the surface skills finally stick: real pace, resonance, presence, the ability to pause and still feel in control. Technique works beautifully once it is built on a calm foundation.'},

 {t:'body',eyebrow:'Part two, pillar four',
  h:'From not trusting your voice to trusting it',
  p:'The whole arc is one move: from a place of not trusting your voice to feeling calm and confident enough to express your magic in the world. Not managing anxiety in the moment. Freedom.'},

 {t:'part',eyebrow:'Part three',h:'What freedom sounds like',
  p:'When the clamps come off.'},

 {t:'body',eyebrow:'Part three',
  h:'When the clamps come off, the joy comes out',
  p:'The goal was never a polished performance. It is you, sounding like you, at full size. People do not remember your structure. They remember that you were finally there, present and undefended.',
  sub:'That is what moves rooms, closes work, and makes people lean in.'},

 {t:'why',eyebrow:'Why me',
  h:'Fifteen years, thousands of voices',
  p:'I am a communication coach specialising in voice and self-expression, and a singer and music producer. Over fifteen years I have helped thousands of people, from CEOs to yoga teachers, find a voice they trust.',
  li:['Creator of the Radiant Voices Process','Trained as a Transformation Coach, and in body-based release and tapping methods','A working singer and music producer, featured in Rolling Stone, GQ and Men’s Health']},

 {t:'recap',eyebrow:'The recap',
  h:'Three things to take with you',
  li:['The freeze is a nervous-system pattern, not a lack of talent','Technique only sticks once the body underneath feels safe','What appears to be in the way, is the way']},

 {t:'cta',eyebrow:'Your next step',
  h:'Awaken your radiant voice',
  p:'If this is the work you have been circling for years, the next step is to go deeper with it, together, over seven weeks in Awaken Your Radiant Voice, or in private coaching.',
  sub:'Come and find the voice that has been waiting underneath the whole time.',
  disc:'This masterclass is educational. It shares a method and a way of working with the voice. It is not therapy and makes no guarantee of any specific professional, financial, or personal outcome. Individual results vary.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let html='<div class="tag">'+BRAND+' &middot; '+(i+1)+'/'+S.length+'</div>';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h) html+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.line) html+='<div class="waterline"></div>';
  if(s.p) html+='<p>'+s.p+'</p>';
  if(s.sub) html+='<p class="sub">'+s.sub+'</p>';
  if(s.li){html+='<ul>';s.li.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  d.innerHTML=html;deck.appendChild(d);
});
document.getElementById('nav').textContent=S.length+' slides';
</script>
</body>
</html>
