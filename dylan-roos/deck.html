<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ascent, a Prince to King masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ec; --panel:#efe7d8; --rule:#e0d5c2; --ink:#15130f; --muted:#5b5346; --accent:#FF503C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'PT Sans',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:54px 50px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .eyebrow{font-family:'PT Sans';text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Fjalla One';font-weight:400;font-size:62px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase}
  h2{font-family:'Fjalla One';font-weight:400;font-size:40px;line-height:1.08;text-transform:uppercase;margin-bottom:18px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:62ch;margin-bottom:14px}
  p.lead{font-size:24px;color:var(--muted)}
  .big{font-family:'Fjalla One';font-size:34px;line-height:1.12;letter-spacing:.005em;margin-bottom:14px}
  ul{list-style:none;margin:12px 0 0}
  li{font-size:21px;line-height:1.45;padding:10px 0 10px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;background:var(--accent);border-radius:3px}
  .phase{display:flex;align-items:baseline;gap:18px}
  .pnum{font-family:'Fjalla One';font-size:72px;color:var(--accent);line-height:.9}
  .foot{position:absolute;bottom:18px;left:50px;right:50px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:66ch}
  .kicker{font-family:'Fjalla One';font-size:26px;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', eyebrow:'A Prince to King masterclass, for parents', h1:'The Ascent',
  lead:'Why a capable son drifts, and the five-phase climb that turns him back into someone with direction, discipline and drive.'},

 {t:'list', kicker:'', eyebrow:'Who this is for', h:'You can see what he is capable of. He cannot.',
  paras:['This is for the parent of a son, roughly fourteen to twenty-three, who is not lazy and is not broken, but is not where you both know he should be.'],
  items:['He avoids the hard things and calls it "later."','He says he will do something and does not follow through.','He has gone quiet, and you do not want to nag him into resenting you.']},

 {t:'statement', eyebrow:'The honest part',
  big:'He is never standing still. Every day he is either moving toward the man he could become, or quietly getting further from him.',
  paras:['Drift is not neutral. Left alone it hardens into weak habits, low confidence, and a life lived below what he is clearly capable of. Not because he could not. Because he never stepped up.']},

 {t:'body', kicker:'Part one', h:'It is not a knowledge problem',
  paras:['Most parents assume their son needs the right information. The right video, the right book, the right talk that finally lands.','He has heard it all. He can recite it back to you. And nothing changes.']},

 {t:'statement', eyebrow:'Part one',
  big:'Most young men do not have a knowledge problem. They have an execution problem.',
  paras:['He knows what to do. What he does not have is a reason to do it today, someone who will notice if he does not, and a structure that makes following through the normal thing instead of the heroic thing.']},

 {t:'body', eyebrow:'Part one', h:'Why motivation keeps failing him',
  paras:['Motivation is a feeling, and feelings do not show up on command. A program built on hype works for about a week, then he is back in the same patterns and feeling worse for having tried.','What actually moves a young man is the opposite of hype: reflection, standards, accountability, and a climb he can see himself making.']},

 {t:'list', kicker:'Part two', h:'The Ascent Framework',
  paras:['This is the structure I take every young man through. Five phases, in order. You cannot skip one, because each phase is what makes the next one hold.'],
  items:['Reflections, then Self-Leadership, then Direction and Standards, then Execution and Ownership, then Integration.']},

 {t:'phase', n:'1', h:'Reflections', s:'Fix the foundations before chasing more. We start by looking honestly at where he actually is, not where he says he is. Nothing changes until he sees the gap clearly.'},
 {t:'phase', n:'2', h:'Self-Leadership', s:'Discipline, decisions, self-trust. He learns to keep the small promises he makes to himself, because that is where confidence is actually built.'},
 {t:'phase', n:'3', h:'Direction and Standards', s:'We turn his values into actual behaviours. Vague "be better" becomes a short list of standards he holds himself to, in writing, every week.'},
 {t:'phase', n:'4', h:'Execution and Ownership', s:'Following through, especially when it is hard. This is the phase most programs skip. We stay on it week after week until doing the work is just who he is.'},
 {t:'phase', n:'5', h:'Integration', s:'He becomes someone who lives it, not just talks about it. The old drifting version is retired for good, and the change holds without me standing over it.'},

 {t:'list', eyebrow:'What makes it hold', h:'He does not climb alone',
  paras:['Two things carry the change past the point where most programs lose it.'],
  items:['The Brotherhood. A small, high-standard group so he is not the only one trying. Boys will do for their brothers what they will not do for a parent.','Family integration. Where it helps, we bring you in, so what he is building is supported at home instead of quietly undone there.']},

 {t:'list', kicker:'Part three', h:'When he stops negotiating with himself',
  paras:['He gets consistent with the simple things first: sleep, training, the promises he makes to himself. Then you watch something shift.'],
  items:['He stops negotiating with himself about the hard thing and just does it.','He can tell you where he is going, in his own words.','The change holds when no one is watching, because it is now his, not yours.']},

 {t:'body', eyebrow:'Why me', h:'I lived the drift first',
  paras:['For years I knew I was capable of more and was not living it. No structure, inconsistent habits, breaking promises to myself. I did not read my way out. I built a structure and did the work properly.','Since then I have coached over two hundred and fifty young men through this exact process, with my father, Paul Roos, inside the work. Different backgrounds, the same patterns, the same climb.']},

 {t:'list', eyebrow:'The climb, in one page', h:'From prince to king',
  items:['The problem is execution, not information.','The map is the five-phase Ascent, in order.','What holds it is the Brotherhood and your involvement.','What you get is a son who owns his direction, not one who was talked at.']},

 {t:'cta', eyebrow:'Your next step', h:'Apply for the Prince to King mentorship',
  paras:['If you want your son taken through the full Ascent, with weekly one-to-one coaching, the Brotherhood, and family integration where it helps, the next step is a short application so we can see if it is the right fit. Numbers are limited by design.'],
  big:'Apply at dylanrooscoaching.com',
  disc:'This masterclass is for educational purposes only. No income or result is guaranteed. Results vary with the work each young man puts in, and every son is different.'}
];

function esc(x){return x;}
function slide(s){
 const d=document.createElement('div'); d.className='slide';
 let inner='';
 if(s.kicker) inner+=`<div class="kicker">${s.kicker}</div>`;
 if(s.eyebrow) inner+=`<div class="eyebrow">${s.eyebrow}</div>`;
 if(s.t==='title'){
  inner+=`<h1>${s.h1}</h1><p class="lead" style="margin-top:20px">${s.lead}</p>`;
 } else if(s.t==='phase'){
  inner=`<div class="eyebrow">The Ascent Framework, phase ${s.n} of 5</div>
   <div class="phase"><div class="pnum">${s.n}</div><div><h2>${s.h}</h2><p>${s.s}</p></div></div>`;
 } else {
  if(s.big) inner+=`<p class="big">${s.big}</p>`;
  if(s.h) inner+=`<h2>${s.h}</h2>`;
  if(s.paras) s.paras.forEach(p=>inner+=`<p>${p}</p>`);
  if(s.items){inner+='<ul>';s.items.forEach(i=>inner+=`<li>${i}</li>`);inner+='</ul>';}
  if(s.disc) inner+=`<p class="disc">${s.disc}</p>`;
 }
 d.innerHTML=inner+`<div class="foot"><span>Prince to King, Dylan Roos</span><span>The Ascent</span></div>`;
 return d;
}
const deck=document.getElementById('deck');
S.forEach(s=>deck.appendChild(slide(s)));
</script>
</body>
</html>
