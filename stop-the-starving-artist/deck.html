<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Posts to Profit — Stop the Starving Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f0;      /* warm cream gallery ground (brand: light scheme, body text black) */
    --panel:#f0e8dd;   /* soft oat panel */
    --sage:#95bcb6;    /* brand dominant (header/footer bg, 4 uses) */
    --accent:#de7855;  /* brand terracotta accent (2 uses) */
    --ink:#241f1c;     /* near-black ink */
    --muted:#6f655d;
    --serif:'Bodoni Moda',Georgia,serif;  /* high-contrast gallery/fashion serif (site pair collided in-vertical) */
    --sans:'Mulish',system-ui,sans-serif;  /* clean humanist body */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--panel);font-family:var(--sans);color:var(--ink);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{background:var(--bg);border-radius:14px;padding:64px 56px;margin:0 0 26px;
    min-height:460px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(36,31,28,.06);border:1px solid #ece2d6;position:relative;overflow:hidden}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;font-size:54px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;margin-bottom:14px}
  p{font-size:20px;color:#3a332e;max-width:44ch}
  p.lead{font-size:23px}
  .sub{color:var(--muted);font-size:18px;margin-top:10px}
  ul{list-style:none;margin-top:20px}
  li{font-size:21px;padding:11px 0 11px 34px;position:relative;max-width:48ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:16px;height:3px;background:var(--accent);border-radius:2px}
  .part .eyebrow{color:var(--ink)}
  .part{background:var(--sage);color:var(--ink);border:none}
  .part h2{font-size:46px}
  .part .num{font-family:var(--serif);font-size:20px;color:#2c4a45;font-weight:600;margin-bottom:8px}
  .key h1{font-size:46px}
  .key .big{font-family:var(--serif);font-size:120px;color:var(--accent);opacity:.18;
    position:absolute;right:40px;bottom:-14px;font-weight:700;line-height:1}
  .cta{background:var(--ink);color:var(--bg);border:none}
  .cta h1{color:var(--bg)}
  .cta .eyebrow{color:var(--sage)}
  .cta p{color:#e7ded4}
  .pill{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;
    font-weight:600;font-size:18px;padding:14px 28px;border-radius:999px}
  .disclaimer{font-size:13px;color:#9a8f85;margin-top:24px;max-width:60ch}
  .cta .disclaimer{color:#8a8178}
  .credit{font-family:var(--sans);font-size:16px;color:var(--muted);margin-top:28px}
  .quote h1{font-style:normal}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:8px 0 28px;font-family:var(--sans)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<footer>Stop the Starving Artist &middot; More art. More sales. More you.</footer>
<script>
const S = [
  {t:'title', eyebrow:'A free masterclass', h:'From Posts to Profit',
    p:'How to sell more of your art online by being more of you, the artist. A simple 30-day plan, no website, no paid ads, no wordy artist statement.',
    credit:'Lennon Bone &middot; Stop the Starving Artist'},

  {t:'who', eyebrow:'Who this is for',
    h:'For the artist who sells in person, but stalls online.',
    p:'Painters, crafters, musicians, and creative teachers who make work people love, and who know there are buyers out there they just are not reaching yet.'},

  {t:'trap', eyebrow:'The trap',
    h:'You post constantly, and you reach... other artists.',
    p:'The likes feel good. But the people double-tapping are mostly other creatives, not the people who would actually buy a piece. So the sales never come, and it feels like the algorithm is against you.'},

  {t:'quote', eyebrow:'The reframe',
    h:'The problem was never your art. It is who is in the room.',
    sub:'Change the room and the same work starts selling.'},

  {t:'part', num:'Part One', eyebrow:'The core problem', h:'Three quiet habits that keep good artists broke.'},

  {t:'bullets', eyebrow:'Problem 1', h:'You make content for artists, not buyers.',
    items:['Trends, process reels, and inside-jokes play well with peers.','They rarely reach the person who hangs art on a wall or commissions a piece.']},

  {t:'bullets', eyebrow:'Problem 2', h:'You wait to be discovered.',
    items:['Discovery is not luck. It is being discoverable, on purpose, again and again.','Showing up consistently beats one perfect post you agonized over for a week.']},

  {t:'bullets', eyebrow:'Problem 3', h:'You stay quiet because selling feels "salesy".',
    items:['So you hint, and hope, and never actually say the work is for sale.','People cannot buy what they do not know they can buy.']},

  {t:'quote', eyebrow:'The cost',
    h:'That is the starving-artist cycle.',
    sub:'Talented, consistent, invisible to the people who would pay. It is not a talent problem. It is a visibility and message problem.'},

  {t:'part', num:'Part Two', eyebrow:'The method', h:'heART Based Sales: five keys that put your work in front of buyers.'},

  {t:'quote', eyebrow:'The idea behind it',
    h:'People do not buy art. They buy the story behind it.',
    sub:'Nail the message, connect your work to something people feel, and you can skip the flashy edits and the awkward pointing altogether.'},

  {t:'key', eyebrow:'Key 1', big:'1', h:'More of YOU, the artist.',
    p:'Your story, your why, and your face are the one thing no one can copy-paste. That is what turns a scroller into a collector.'},

  {t:'key', eyebrow:'Key 2', big:'2', h:'Be discoverable.',
    p:'Show up consistently so the right people can find you on purpose, instead of hoping an algorithm hands you a lucky day.'},

  {t:'key', eyebrow:'Key 3', big:'3', h:'Make content for buyers.',
    p:'Speak to the person who would own the work, not the person who makes work like yours. The audience changes, and so do the sales.'},

  {t:'key', eyebrow:'Key 4', big:'4', h:'Say it is for sale. Consistently.',
    p:'Not once, not shyly. Tell people clearly and often that your work can be bought, and make the next step obvious.'},

  {t:'key', eyebrow:'Key 5', big:'5', h:'Stand out in a copy-paste world.',
    p:'In a feed full of AI and sameness, the human behind the work is the edge. You do not need every trend or a fancy editing trick.'},

  {t:'part', num:'Part Three', eyebrow:'From posts to profit', h:'A 30-day plan, built around your real life.'},

  {t:'bullets', eyebrow:'The next 30 days', h:'Simple, repeatable, yours.',
    items:['A clear message that draws in buyers, not just other artists.','A content rhythm you can keep, with no website or paid ads required.','A natural way to say your work is for sale, so people can actually buy it.']},

  {t:'why', eyebrow:'Why listen to me', h:'I spent 15 years making a living as an artist.',
    p:'Touring 14 countries, writing and recording with a Grammy-nominated artist, with my playing landing on film and TV. I learned how to turn creative work into a living, and now I help other creatives do the same, as themselves.',
    credit:'Lennon Bone &middot; Stop the Starving Artist'},

  {t:'cta', eyebrow:'Your next step',
    h:'Ready to attract fewer artists and more buyers?',
    p:'Start with the 30-day heART Based Sales plan and bring your work to the people who are ready to own it. Join the heART community and take the first step today.',
    pill:'Start with heART Based Sales',
    disclaimer:'This masterclass is for educational purposes only. Results vary and depend on your work, your market, and your effort. Nothing here is a guarantee of income or sales.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t==='part'?'part':'') + (s.t==='cta'?'cta':'') + (s.t==='key'?'key':'') + (s.t==='quote'?'quote':'');
  let html = '';
  if (s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if (s.num) html += '<div class="num">'+s.num+'</div>';
  if (s.t==='title'){ html += '<h1>'+s.h+'</h1>'; if(s.p) html += '<p class="lead" style="margin-top:18px">'+s.p+'</p>'; }
  else if (s.t==='part'){ html += '<h2>'+s.h+'</h2>'; }
  else { html += '<h1 style="font-size:40px">'+s.h+'</h1>'; }
  if (s.big) html += '<div class="big">'+s.big+'</div>';
  if (s.p && s.t!=='title') html += '<p style="margin-top:14px">'+s.p+'</p>';
  if (s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if (s.items){ html += '<ul>'; for(const it of s.items) html += '<li>'+it+'</li>'; html += '</ul>'; }
  if (s.pill) html += '<div><span class="pill">'+s.pill+'</span></div>';
  if (s.disclaimer) html += '<div class="disclaimer">'+s.disclaimer+'</div>';
  if (s.credit) html += '<div class="credit">'+s.credit+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
