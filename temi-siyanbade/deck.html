<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Own Your Space — a masterclass with Temi Siyanbade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,700;1,6..96,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EE;
  --panel:#EFE7D6;
  --rule:#E0D6C2;
  --ink:#17140F;
  --accent:#B08D57;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Montserrat",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
.slide{display:none;width:100%;max-width:980px}
.slide.on{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-family:"Montserrat";font-weight:600;letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--accent)}
h1{font-family:"Bodoni Moda",serif;font-weight:700;font-size:clamp(38px,6.4vw,76px);line-height:1.02;letter-spacing:-.01em;margin:.28em 0}
h2{font-family:"Bodoni Moda",serif;font-weight:600;font-size:clamp(28px,4.4vw,50px);line-height:1.08;margin:.2em 0 .5em}
.lede{font-size:clamp(17px,2vw,22px);line-height:1.55;max-width:40ch;color:#3a3326}
p.body{font-size:clamp(15px,1.5vw,18px);line-height:1.62;max-width:60ch;color:#3a3326;margin:.5em 0}
.rule{height:1px;background:var(--rule);margin:1.4em 0;max-width:120px;border:0}
.rule.gold{background:var(--accent)}
ul{list-style:none;margin:.6em 0;max-width:62ch}
ul li{position:relative;padding-left:1.4em;margin:.55em 0;font-size:clamp(15px,1.5vw,18px);line-height:1.5;color:#3a3326}
ul li:before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;background:var(--accent);border-radius:50%}
.big{font-family:"Bodoni Moda",serif;font-style:italic;font-weight:500;font-size:clamp(26px,3.6vw,42px);line-height:1.2;max-width:22ch}
.chain{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;font-family:"Bodoni Moda",serif;font-weight:600;font-size:clamp(20px,2.6vw,32px);color:var(--ink)}
.chain span{color:var(--accent)}
.phase{display:grid;grid-template-columns:auto 1fr;gap:1.2em;align-items:start;max-width:62ch}
.phase .no{font-family:"Bodoni Moda",serif;font-size:clamp(40px,6vw,72px);color:var(--accent);line-height:.9}
.panelcard{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:1.3em 1.5em;margin:.5em 0}
.foot{position:fixed;left:7vw;bottom:3.4vh;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9c927d}
.count{position:fixed;right:7vw;bottom:3.4vh;font-size:11px;letter-spacing:.14em;color:#9c927d}
.name{font-family:"Bodoni Moda",serif;font-weight:600}
.disc{font-size:12px;line-height:1.5;color:#8a8070;max-width:66ch;margin-top:1.4em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.6em;max-width:62ch}
nav{position:fixed;inset:0;display:flex;justify-content:space-between;z-index:5}
nav button{background:none;border:0;width:12vw;cursor:pointer;color:transparent}
.pres{display:flex;align-items:baseline;gap:.6em;margin-top:1.4em}
.pres .n{font-family:"Bodoni Moda",serif;font-weight:600;font-size:18px}
.pres .r{font-size:13px;color:#8a8070;letter-spacing:.04em}
@media(max-width:640px){.cols,.phase{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="stage"></div>
<nav><button id="prev" aria-label="previous"></button><button id="next" aria-label="next"></button></nav>
<div class="foot">Own Your Space &middot; Temi Siyanbade</div>
<div class="count" id="count"></div>
<script>
const S=[
 {t:'title',html:`<div class="kicker">A live masterclass with Temi Siyanbade</div>
   <h1>Own Your Space</h1>
   <p class="lede">How overlooked experts and executives turn deep expertise into recognized authority, and build a legacy that lasts.</p>
   <div class="pres"><span class="n">Temi Siyanbade</span><span class="r">Attorney, keynote speaker, author of Show, Don't Tell</span></div>`},

 {t:'who',html:`<div class="kicker">Who this is for</div>
   <h2>The best kept secret in the room</h2>
   <p class="body">This is for the expert, the executive, the founder who is genuinely excellent at the work, yet keeps watching louder, lesser voices get the stage, the clients, and the opportunities.</p>
   <ul><li>You have the credentials, the results, and the years.</li>
   <li>You are quietly referred, but rarely sought out by name.</li>
   <li>You know your value, and you are tired of staying invisible.</li></ul>`},

 {t:'promise',html:`<div class="kicker">What you will leave with</div>
   <h2>A clear path from hidden to highlighted</h2>
   <ul><li>Why great expertise no longer converts to opportunity on its own.</li>
   <li>The three phases of Own Your Space, and where you are stuck.</li>
   <li>Your first move toward becoming the obvious authority in your field.</li></ul>
   <hr class="rule gold">`},

 {t:'problem',html:`<div class="kicker">Part one</div>
   <h2>Expertise is no longer enough</h2>
   <p class="body">A brilliant message, unmatched expertise, and years of experience no longer translate into automatic clients, customers, or influence. The market does not reward the most qualified person. It rewards the most visible one it trusts.</p>
   <p class="body">And trust now forms fast. You are judged in your first seven seconds on a screen, long before anyone reads your résumé.</p>`},

 {t:'reframe',html:`<div class="kicker">The reframe</div>
   <p class="big">Your expertise was never the problem. Your invisibility is.</p>
   <hr class="rule gold">
   <p class="body">Getting better at the work will not fix this. More letters after your name will not fix it. What is missing is a deliberate way to be seen, remembered, and chosen.</p>`},

 {t:'cost',html:`<div class="kicker">The cost of staying invisible</div>
   <h2>Visibility compounds. So does silence.</h2>
   <div class="chain">Visibility <span>&rarr;</span> Credibility <span>&rarr;</span> Opportunities <span>&rarr;</span> Income</div>
   <p class="body">Every quarter you stay hidden, that chain runs for someone else. The opportunities that should be yours quietly route to whoever showed up with clarity and presence.</p>`},

 {t:'part',html:`<div class="kicker">Part two</div>
   <h1>The Own Your Space method</h1>
   <p class="lede">Three phases that move you from quietly qualified to clearly in demand.</p>`},

 {t:'why-hide',html:`<div class="kicker">Before the method</div>
   <h2>Why talent hides</h2>
   <ul><li><b>Humility.</b> You were taught the work should speak for itself. It does not speak loudly enough on its own.</li>
   <li><b>Noise.</b> The feed rewards volume, and you refuse to be loud for the sake of it.</li>
   <li><b>No system.</b> You show up in bursts, then disappear. Presence without a system reads as absence.</li></ul>`},

 {t:'take',html:`<div class="kicker">Phase one</div>
   <div class="phase"><div class="no">1</div><div>
   <h2>Take Space</h2>
   <p class="body"><b>Identity and presence.</b> Get ruthlessly clear on who you are, who you serve, and the single idea you want to be known for. Then show up with the posture of someone who belongs at the front of the room, because you do.</p>
   <div class="panelcard">The work here: your positioning, your signature point of view, and a presence that matches the expertise.</div></div></div>`},

 {t:'make',html:`<div class="kicker">Phase two</div>
   <div class="phase"><div class="no">2</div><div>
   <h2>Make Space</h2>
   <p class="body"><b>Strategy and support.</b> Build the repeatable system that carries your message to the right people on purpose, instead of hoping the algorithm notices. A message that positions you as the trusted authority and moves people from interest to action.</p>
   <div class="panelcard">The work here: your content strategy, your message, and the offer that turns attention into opportunity.</div></div></div>`},

 {t:'shape',html:`<div class="kicker">Phase three</div>
   <div class="phase"><div class="no">3</div><div>
   <h2>Shape Space</h2>
   <p class="body"><b>Vision and legacy.</b> Turn recognition into something durable. Once you are known, you stop chasing and start choosing, and you begin building influence that outlasts any single launch, title, or season.</p>
   <div class="panelcard">The work here: authority that compounds, protected and multiplied into a legacy that lasts.</div></div></div>`},

 {t:'video',html:`<div class="kicker">Show, don't tell</div>
   <h2>Video is the fastest way to be believed</h2>
   <p class="body">Nothing builds trust faster than letting people see and hear you think. You do not need to be loud, polished, or perfect on camera. You need a repeatable structure that lets the right people feel your expertise in seconds.</p>
   <ul><li>Speak to one person's real problem, not an audience.</li>
   <li>Position the point of view only you can offer.</li>
   <li>Make it easy to say yes to the next step.</li></ul>`},

 {t:'map',html:`<div class="kicker">The through-line</div>
   <h2>Your Visibility Action Map</h2>
   <p class="body">Every phase feeds one simple plan that takes you from hidden to highlighted. Not a content calendar you will abandon in three weeks, but a clear sequence of moves that make being seen feel deliberate instead of exhausting.</p>
   <hr class="rule gold">`},

 {t:'part',html:`<div class="kicker">Part three</div>
   <h1>What authority looks like</h1>
   <p class="lede">The quiet signals that you have stopped blending in.</p>`},

 {t:'signals',html:`<div class="kicker">You will know it is working</div>
   <h2>From chasing to chosen</h2>
   <div class="cols"><ul>
   <li>People arrive already knowing who you are.</li>
   <li>Referrals come with your name attached, not just your function.</li></ul>
   <ul><li>You can command your value without flinching.</li>
   <li>The right rooms, stages, and clients come to you.</li></ul></div>`},

 {t:'legacy',html:`<div class="kicker">Legacy is luxury</div>
   <p class="big">The real luxury is building something that keeps working when you are not in the room.</p>
   <p class="body">Visibility is not vanity. Done with intention, it is how a high achiever protects their name, multiplies their influence, and leaves a legacy that outlives the title.</p>`},

 {t:'why',html:`<div class="kicker">Why learn this from me</div>
   <h2>Temi Siyanbade</h2>
   <ul><li>Licensed attorney and founder of Own Elevation Global.</li>
   <li>Author of Show, Don't Tell, a number one new release in legal services.</li>
   <li>National speaker on visibility and leadership for the American Bar Association, ABA TECHSHOW, and the National Business Institute.</li>
   <li>Trusted by more than 10,000 entrepreneurs and professionals, and an advisor to six, seven, and eight figure leaders.</li></ul>`},

 {t:'recap',html:`<div class="kicker">The method, in one breath</div>
   <h2>Own Your Space</h2>
   <div class="cols"><ul><li><b>Take Space.</b> Identity and presence.</li>
   <li><b>Make Space.</b> Strategy and support.</li></ul>
   <ul><li><b>Shape Space.</b> Vision and legacy.</li>
   <li><b>Show, don't tell.</b> Be seen, be believed.</li></ul></div>
   <hr class="rule gold">`},

 {t:'cta',html:`<div class="kicker">Your next move</div>
   <h1>Ready to own your space?</h1>
   <p class="lede">If you are ready to stop being the best kept secret in your field, the Visibility and Authority Mastermind is where we do this work together over ninety days.</p>
   <div class="panelcard"><b>Apply for the Visibility and Authority Mastermind</b>, or book a strategy call with Temi to map your first move.</div>
   <p class="disc">Educational content only. No specific outcome, income, or result is guaranteed. Results vary based on your market, your effort, and many factors outside any program's control.</p>`}
];
let i=0;const stage=document.getElementById('stage'),cnt=document.getElementById('count');
function render(){stage.innerHTML='';const s=S[i];const d=document.createElement('div');d.className='slide on';d.innerHTML=s.html;stage.appendChild(d);cnt.textContent=(i+1)+' / '+S.length;}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(i+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);});
render();
</script>
</body>
</html>
