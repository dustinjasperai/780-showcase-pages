<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Systemize to Step Away - Chelsea Brinkley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5eee1;        /* warm sand paper, from her LIGHT ochre-leaning scheme */
    --panel:#fffdf8;     /* warm white */
    --soft:#ece3d4;
    --rule:#e4ddd0;
    --ink:#1b1a17;       /* her dominant hex */
    --muted:#6f685d;
    --accent:#be7b37;    /* her ochre, brand.json */
    --teal:#56a7bd;      /* her single secondary */
    --serif:'Bodoni Moda',Georgia,serif;
    --sans:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--soft);font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
  .stage{width:min(960px,94vw);aspect-ratio:16/9;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 18px 60px rgba(27,26,23,.18);border-radius:6px}
  .slide{position:absolute;inset:0;padding:60px 70px;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:16px}
  h1{font-family:var(--serif);font-weight:700;font-size:56px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.1;margin-bottom:16px}
  .sub{font-size:21px;color:var(--muted);margin-top:20px;font-weight:300;line-height:1.4;max-width:48ch}
  p.lead{font-size:20px;line-height:1.5;max-width:47ch;color:#2c2820}
  ul{list-style:none;margin-top:12px}
  li{font-size:19px;line-height:1.45;padding-left:28px;position:relative;margin-bottom:13px;max-width:50ch}
  li:before{content:"";position:absolute;left:0;top:10px;width:10px;height:10px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .num{font-family:var(--serif);font-size:19px;color:var(--teal);font-weight:600;margin-bottom:10px;letter-spacing:.02em}
  .pillar{display:flex;gap:24px;align-items:flex-start}
  .pillar .big{font-family:var(--serif);font-size:70px;line-height:.9;color:var(--accent);font-weight:700;flex:none;width:98px}
  .pillar .body h2{font-size:32px;margin-bottom:10px}
  .byline{margin-top:28px;font-size:17px;letter-spacing:.03em;color:var(--ink)}
  .byline b{font-weight:600}
  .footer{position:absolute;left:70px;bottom:24px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a89d8c}
  .page{position:absolute;right:70px;bottom:24px;font-size:12px;color:#a89d8c;letter-spacing:.1em}
  .disc{font-size:13px;color:var(--muted);margin-top:24px;max-width:60ch;line-height:1.5;border-top:1px solid var(--rule);padding-top:13px}
  .cta-box{margin-top:20px;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);padding:20px 24px;border-radius:4px;max-width:52ch}
  .cta-box .step{font-size:22px;font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:6px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:18px 20px}
  .card h3{font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:6px}
  .card p{font-size:15px;color:var(--muted);line-height:1.4}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
  .nav button{border:1px solid var(--rule);background:var(--bg);color:var(--ink);width:40px;height:34px;border-radius:5px;cursor:pointer;font-size:15px}
  .nav button:hover{background:var(--soft)}
  @media(max-width:640px){.slide{padding:32px 28px}h1{font-size:32px}h2{font-size:25px}p.lead,li{font-size:16px}.pillar .big{font-size:46px;width:58px}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="nav"><button onclick="go(-1)">&#8592;</button><button onclick="go(1)">&#8594;</button></div>
<script>
const S=[
  {t:'title',kicker:'A Masterclass with Chelsea Brinkley',h:'Systemize to Step Away',sub:'How to organize your business so you can hand it off and do great work from anywhere.',byline:'Chelsea Brinkley, systems coach for online business owners'},
  {t:'list',kicker:'What you will walk away with',h:'By the end of this hour',bullets:['The five systems that let a business run without its owner in the room.','The order to build them in, so the next hire steps into structure instead of chaos.','A clear picture of what to hand off first, and to whom.']},
  {t:'lead',kicker:'Who this is for',h:'You are the bottleneck, and you know it',p:'You built something real. But it only moves when you push it. You cannot take a clean day off, the team waits on you for answers, and growth means more hours, not more freedom. This hour is for owners who are ready to change that.'},
  {t:'lead',kicker:'The trap',h:'Working harder looks like progress',p:'So you add more hours, more tools, more sticky notes. For a while it holds. But every new client, project, and team member adds another thread that runs through you, and the busier you get, the more tangled it becomes.'},
  {t:'lead',kicker:'The hard truth',h:'Hiring help will not save you yet',p:'Bring someone into a business that lives in your head and you just become their bottleneck too. A great assistant cannot rescue a business with no systems. The systems come first, then the right person has somewhere to stand.'},
  {t:'part',num:'Part One',h:'The business lives in your head',p:'Every answer, password, and process runs through one person. You. That is not a workload problem you can hire your way out of. It is a systems problem, and it caps how far the business can go and how far you can get from your desk.'},
  {t:'list',kicker:'What it costs you',h:'The real price of holding it all',bullets:['You cannot step away without the business slowing down.','Good people leave because they are stuck waiting on you.','The work you are best at gets buried under the work anyone could do.']},
  {t:'part',num:'Part Two',h:'The Work From Anywhere System',p:'Five systems that move the business out of your head and onto a shelf anyone can reach. Build them in order and the business stops depending on you being in the room.'},
  {t:'pillar',kicker:'The Work From Anywhere System',big:'01',h:'The 2-Minute File System',p:'One organized cloud home for everything, built to a simple rule: you can find any document you are looking for in two minutes or less. If a file takes longer, the system is costing you money.'},
  {t:'pillar',kicker:'The Work From Anywhere System',big:'02',h:'Project and Delegation System',p:'Work comes out of your inbox and your memory and into one project tool, so tasks can be tracked, assigned, and handed off instead of living with you.'},
  {t:'pillar',kicker:'The Work From Anywhere System',big:'03',h:'SOPs and a Loom Library',p:'Document the steps once, then record a short Loom walking through each one. A written SOP plus a video covers every learning style, so a new person can run a process without asking you.'},
  {t:'pillar',kicker:'The Work From Anywhere System',big:'04',h:'Automations',p:'Remove the repetitive manual steps so the systems run quietly in the background. That is what gives you the room to be in the creative space instead of the busywork.'},
  {t:'pillar',kicker:'The Work From Anywhere System',big:'05',h:'Secure Shared Access',p:'Share access the safe way with a password manager, never passwords over text, email, or Slack. Secure access is what lets you delegate without exposing the business.'},
  {t:'cards',kicker:'The hand-off',h:'Equip, train, source, execute',cards:[['Equip','The five systems above, in place and documented.'],['Train','The Loom library teaches the role without you repeating yourself.'],['Source','Find a vetted person who fits the seat you have built.'],['Execute','They run the systems while you do the work only you can do.']]},
  {t:'part',num:'Part Three',h:'A week where the business runs without you',p:'Picture the hand-off done: requests have a home, work moves through the tool, procedures run from the Loom library, and the right person is in the seat. You check in, you do not hold it up.'},
  {t:'lead',kicker:'The right person',h:'Systems first, then the seat',p:'Once the structure exists, the hire gets simple. You are not looking for someone to figure out your chaos. You are placing a skilled executive assistant or online business manager into a role that is already defined, with the processes waiting for them.'},
  {t:'list',kicker:'Why listen to me',h:'I have lived both sides of this desk',bullets:['I was the executive assistant to a chief digital officer, so I know what a great seat looks like from the inside.','My husband and I have run our business as digital nomads since 2016, on systems, not luck.','I now match owners with vetted assistants and managers from a network hundreds of thousands deep.']},
  {t:'lead',kicker:'The shift',h:'From doing the work to owning the business',p:'When the systems hold and the right person is in the seat, your week changes shape. The business keeps its promises whether you are at your desk or on a trail. That is what work from anywhere actually means.'},
  {t:'list',kicker:'The five systems',h:'Build them in this order',bullets:['One. The 2-Minute File System.','Two. Project and delegation.','Three. SOPs and a Loom library.','Four. Automations.','Five. Secure shared access, then equip, train, source, execute.']},
  {t:'cta',kicker:'Your next step',h:'Let us build your system together',p:'If you want help putting these five systems in place and matching the right person into them, that is exactly what my private coaching does.',step:'Book a private coaching call with Chelsea',disc:'This masterclass is educational. It shares systems and principles, not promises. No specific income, revenue, or result is guaranteed. Results vary and depend on your own business, effort, and circumstances.'}
];

function esc(x){return x;}
function render(i){
  const s=S[i]; let h='';
  const foot='<div class="footer">Work From Anywhere</div><div class="page">'+(i+1)+' / '+S.length+'</div>';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.num) h+='<div class="num">'+s.num+'</div>';
  if(s.t==='title'){
    h+='<h1>'+s.h+'</h1><div class="sub">'+s.sub+'</div><div class="byline"><b>'+s.byline+'</b></div>';
  } else if(s.t==='pillar'){
    h+='<div class="pillar"><div class="big">'+s.big+'</div><div class="body"><h2>'+s.h+'</h2><p class="lead">'+s.p+'</p></div></div>';
  } else if(s.t==='cards'){
    h+='<h2>'+s.h+'</h2><div class="two">';
    for(const c of s.cards) h+='<div class="card"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div>';
    h+='</div>';
  } else if(s.t==='cta'){
    h+='<h2>'+s.h+'</h2><p class="lead">'+s.p+'</p><div class="cta-box"><div class="step">'+s.step+'</div></div><div class="disc">'+s.disc+'</div>';
  } else {
    if(s.h) h+='<h2>'+s.h+'</h2>';
    if(s.p) h+='<p class="lead">'+s.p+'</p>';
    if(s.bullets){h+='<ul>';for(const b of s.bullets) h+='<li>'+b+'</li>';h+='</ul>';}
  }
  return h+foot;
}
let cur=0;
const stage=document.getElementById('stage');
function show(){stage.innerHTML='<div class="slide on">'+render(cur)+'</div>';}
function go(d){cur=Math.max(0,Math.min(S.length-1,cur+d));show();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
show();
</script>
</body>
</html>
