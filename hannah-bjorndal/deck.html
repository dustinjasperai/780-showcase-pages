<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Business That Runs Without You · Hannah Bjorndal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0f0f0f; --panel:#15191d; --rule:#26292e;
    --acc:#c9a86a; --ink:#f4efe6; --body:#c9cdd3; --dim:#7c8088;
  }
  html,body{height:100%}
  body{background:#070707;font-family:'Poppins',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070707}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Gilda Display',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.14;letter-spacing:.004em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.25vw;max-width:90%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.64;font-weight:300}
  .sub{font-family:'Gilda Display',serif;font-size:2.0vw;color:var(--acc);margin-top:3.6vh;max-width:86%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:92%}
  .t-section .rule{width:14vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#1a1f24 0%,#0a0c0e 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--ink)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#1a1f24 0%,#0a0c0e 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--ink)}
  .t-cta .body{font-family:'Poppins',sans-serif;color:#dfe3e8;font-size:1.42vw;margin-top:3vh;max-width:70%;line-height:1.6;font-weight:300}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--ink);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.5%;bottom:8.5%;width:15vw;opacity:.92}
  .corner-vf{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.06em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Hannah Bjorndal</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: an editorial corner mark, a thin quarter-frame closing on a filled dot (the "it runs without you" full stop), drawn in champagne -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#c9a86a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 92 V44 A24 24 0 0 1 44 20 H92" opacity="0.85"/>
    <path d="M64 40 H100 M100 40 V76" opacity="0.5"/>
  </g>
  <circle cx="84" cy="84" r="8" fill="#c9a86a" opacity="0.9"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Business That Runs Without You',sub:'How established wedding pros build a team, step out of the day-to-day, and grow the business while getting their calendar back.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You are the business. That is exactly the problem.',body:'You are an established wedding pro. The bookings come in, the work is genuinely good, and the reason it all holds together is you. You shoot, you edit, you answer every email, you carry every detail. Growth has started to feel like a heavier version of the same week, because every new booking lands on the one person who is already full.'},
 {t:'dark',title:'A business that only works when you do is not an asset. It is a job you cannot leave.'},

 {t:'section',idx:'Part One',title:'Why Doing More Stopped Working'},
 {t:'normal',k:'The bottleneck',title:'Every path to more revenue runs back through you.',body:'When you are the only one who can deliver the work, every extra booking costs you a weekend, and the ceiling is simply how many hours you are willing to give up. You can raise prices for a while, but you cannot clone yourself. The thing that built the business, your hands on every wedding, is now the exact thing capping it.'},
 {t:'normal',k:'The burnout trap',title:'Working harder is the one lever that quietly takes the most and returns the least.',body:'Most established pros hit a wall where the calendar is full, the income is good on paper, and there is nothing left over: no time, no margin to think, no way to grow without adding more weekends you do not have. Hustle got you here. It cannot get you out, because the problem is not effort. It is that the whole business still depends on you being in it.'},
 {t:'dark',title:'You did not build something this good just to be trapped inside of it.'},

 {t:'section',idx:'Part Two',title:'The Three C’s'},
 {t:'normal',k:'The framework',title:'The way out is a business built on three things at once, not a busier you.',body:'This is the framework behind the Wedding Executive Board: Clarity, Core Functions, and Cultivation. It is a roadmap for growing the business while giving you back your time, instead of trading one for the other. The three move together, and most pros are missing at least one of them.'},
 {t:'normal',k:'One, Clarity',title:'Clarity: decide what only you can do, and let go of the rest.',body:'Clarity is getting honest about your real role. Which parts of the business genuinely need your eye and your name, and which parts you are only doing because you always have. You cannot hand off work you have never defined. So the first move is naming the job you actually want to own, and everything that has to leave your plate for that to be possible.'},
 {t:'normal',k:'Two, Core Functions',title:'Core Functions: turn the way you work into systems someone else can run.',body:'Core Functions is documenting how the business actually operates, so it no longer lives only in your head. The booking flow, the shoot, the edit, the client experience, written down as repeatable systems. This is what makes an associate possible: when the standard is on paper instead of in you, someone else can meet it, and the work stops depending on your memory and your mood.'},
 {t:'normal',k:'Three, Cultivation',title:'Cultivation: hire and lead a team so the work happens without you in the room.',body:'Cultivation is building the team that carries the business. Recruiting and training your first associate, leading them to your standard, and letting them own real work. This is the shift from being the only pair of hands to being the owner: the business keeps delivering, and keeps earning, on the weekends you are not there.'},
 {t:'dark',title:'The goal was never a fuller calendar. It was a business that keeps running when you step out of the frame.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Build The Team'},
 {t:'normal',k:'The owner this builds',title:'More revenue, more weddings served, and weekends that are finally yours again.',body:'When the systems are written and an associate is carrying real work, growth stops costing you your life. The studio takes on more than you could ever shoot alone, the income grows past the ceiling of your own two hands, and a full weekend stops meaning another one gone. You move from doing every job to leading the business that does them.'},
 {t:'dark',title:'You stop being the busiest person in your business and start being the owner of it.'},
 {t:'normal',k:'Why Hannah',title:'She built the team first, then taught the method to everyone else.',body:'Hannah Bjorndal built La Vie En Rose into a six-figure wedding studio with a team of three lead photographers, then stepped back from shooting every wedding herself. She has mentored more than twenty-five creative entrepreneurs through the same shift, and hosts the How to Scale Your Wedding Business podcast. The Three C’s is the method behind all of it: the business runs, and she is no longer the bottleneck.'},

 {t:'section',idx:'Your Next Step',title:'Build The Business Your Work Deserves'},
 {t:'normal',k:'Keep going with Hannah',title:'A first hire to learn from, and a room for when you are ready to scale the whole thing.',body:'How to Hire Your First Associate is where you start: the step-by-step way to recruit, hire, and train the first person who takes work off your plate. The Wedding Executive Board is the room you step into when you are ready to build the whole business around the Three C’s, with a small group and a custom roadmap the entire way. Start where you are, and go as far as you want to.'},
 {t:'cta',title:'Ready to build a business that runs without you?',body:'Take the next step with Hannah Bjorndal.',chips:['Start with the associate course','Apply for the Wedding Executive Board'],disc:'Educational content for working wedding professionals. No income or business result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Hannah <b>Bjorndal</b> · Business Coach for Wedding Pros</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
