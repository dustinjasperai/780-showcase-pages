<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Frictionfree Enterprise, a masterclass with Helen Beal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f6;
    --panel:#fbfdfe;
    --rule:#d8e2e8;
    --ink:#16242c;
    --muted:#516069;
    --accent:#006699;
    --accent2:#0091a7;
    --head:'Spectral',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(22,36,44,.08);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* flow motif: a thin current line top-left */
  .slide::before{content:'';position:absolute;top:0;left:0;height:5px;width:46%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 0 6px 0}
  .kick{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:60px;line-height:1.04;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:600;font-size:42px;line-height:1.08;margin:0 0 20px}
  h3{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:44ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:16px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px}
  .big{font-family:var(--head);font-size:120px;line-height:.98;font-weight:700}
  .strike{color:transparent;-webkit-text-stroke:2px #16242c55;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:210px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:26px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:56px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:auto}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:40px}h2{font-size:30px}.big{font-size:74px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Flowtopia · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Frictionfree Enterprise',p:'How to turn a tangle of busy teams into one flowing value stream.',pres:'With <b>Helen Beal</b>, Founder & Chief Flow:er, Flowtopia'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['See where the work actually stops','Not who is busy. Where value waits.'],['A way to run the stream, not just draw it','The shift from a one-off map to a managed flow.'],['The first move you can make on Monday','One constraint, one change, one measure.']]},
 {t:'audience',kick:'Who this is for',h:'You lead delivery. And it is slower than it should be.',p:'Value stream, DevOps, engineering and product leaders in a scaling organization, where every team is flat out and the work still crawls.',who:'<b>The trap:</b> you add people and process to go faster, and the friction quietly grows instead.'},
 {t:'reframe',kick:'The reframe',big1:'Busy.',big2:'Not <span class="em">flowing</span>.',p:'Busy is a measure of effort. Flow is a measure of value reaching a customer. Most enterprises optimize the first and wonder why the second never moves.'},
 {t:'part',kick:'Part one',h:'Why the work stops.'},
 {t:'point',kick:'The core problem',h:'You are managing teams. The value crosses between them.',p:'Work does not get stuck inside a team. It gets stuck in the handoffs, the queues and the waiting between teams, where nobody is looking and nobody owns it.'},
 {t:'point',kick:'The core problem',h:'Mapping was the warm-up.',p:'A value stream mapping workshop gives you a wall of post-its and a good day out. Then nothing changes, because a static picture cannot manage a living system.'},
 {t:'framework',kick:'The core problem',h:'Mapping vs. management.',row:[['Mapping','A one-off, human, post-it picture of how work flows today.'],['Management','A continuous, data-driven discipline for running the stream every day.']],p:'The move from the first to the second is the whole game.'},
 {t:'part',kick:'Part two',h:'How to make it flow.'},
 {t:'lenses',kick:'Value stream management',h:'See the same stream three ways.',li:[['Process','Follow the workflow, step by step, as it really runs.'],['Customer journey','Follow the experience, so you improve value, not local speed.'],['Bird’s-eye','See how the processes interconnect to deliver one outcome.']]},
 {t:'network',kick:'Value stream management',h:'Your enterprise is a network of streams.',p:'Streams do not live alone. They feed and block each other. Improvement targets the connections between them, not one team in isolation.',who:'<b>Principle:</b> identify the streams first, then connect them into a network you can actually run.'},
 {t:'evsa',kick:'The missing role',h:'The Enterprise Value Stream Architect.',p:'The bridge builder who orchestrates value streams across the whole organization, connects the isolated ones, and owns the flow that no single team can.',who:'<b>Most scaling orgs have nobody in this seat.</b> That is why the friction has no owner.'},
 {t:'cycle',kick:'The engine',h:'The value cycle.',steps:['Align the portfolio and backlog to the outcome','Integrate continuously','Test continuously','Deliver continuously','Read the insights, then pivot'],p:'Five phases, one feedback loop. The loop is what lets you steer instead of guess.'},
 {t:'metrics',kick:'The numbers',h:'Flow metrics vs. DORA. Which to watch.',row:[['Flow metrics','Velocity, efficiency, time, load and distribution. Where value waits inside the stream.'],['DORA metrics','Delivery throughput and stability. How well you ship once work is moving.']],p:'Pick the lens for the question you are asking, so you find the constraint instead of drowning in dashboards.'},
 {t:'part',kick:'Part three',h:'What a frictionfree quarter looks like.'},
 {t:'looks',kick:'The outcome',h:'The stream, made visible and managed.',li:[['The constraint is named','Everyone can point to where value waits, and why.'],['Improvement has an owner','The architect runs the network, not a committee.'],['You steer on evidence','Flow and delivery metrics tell you the next move.']]},
 {t:'whyme',kick:'Why Helen',h:'Someone who has spent a career on flow.',li:[['Founder & Chief Flow:er, Flowtopia','The home and community for value stream practitioners.'],['Chair, Value Stream Management Consortium','Helping define the discipline itself.'],['DevOps Institute Chief Ambassador · IDC analyst','A recognized voice on DevOps, VSM and flow.']]},
 {t:'cta',kick:'Your next step',h:'Ready to make your enterprise flow?',ctas:['<b>Book a free consultation</b> and we will look at your streams together.','<b>Join the Flow Pro community</b> for ongoing coaching and peer huddles.'],disc:'This masterclass is educational. It shares frameworks and approaches for improving flow; it is not advice for your specific situation and not a guarantee of any particular result. Outcomes vary by organization.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function esc(x){return x}
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 if(s.who&&s.t!=='audience'&&!/who/.test(h)){}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
