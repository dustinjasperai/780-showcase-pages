<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Same Words, a Different Jesus | Finding Faith Above</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#ede1d1; --panel:#e2d2bd; --ink:#3a2f28; --ink-soft:#5f5046;
    --rule:#cdb79e; --accent:#a15e50; --accent2:#5e5e43;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;line-height:1.5;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:960px}
  .slide.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:'Hanken Grotesk';font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Italiana',Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,68px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-family:'Italiana',Georgia,serif;font-weight:600;font-size:clamp(28px,4.4vw,46px);line-height:1.1;margin-bottom:20px}
  .sub{font-family:'Italiana',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(19px,2.6vw,27px);color:var(--accent2);margin-bottom:18px}
  p.body{font-size:clamp(16px,2vw,21px);color:var(--ink-soft);max-width:40ch;margin-bottom:14px}
  ul{list-style:none;margin-top:10px}
  li{font-size:clamp(15px,1.9vw,20px);color:var(--ink-soft);padding:11px 0 11px 30px;border-bottom:1px solid var(--rule);position:relative;max-width:46ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .big{font-family:'Italiana',serif;font-size:clamp(60px,12vw,140px);font-weight:600;color:var(--accent);line-height:1}
  .cover h1{max-width:18ch}
  .section-num{font-family:'Italiana',serif;font-style:italic;font-size:clamp(20px,3vw,30px);color:var(--accent);margin-bottom:10px}
  .disc{margin-top:26px;font-size:13px;color:var(--ink-soft);opacity:.8;max-width:52ch;font-style:italic}
  .cta-line{display:inline-block;margin-top:14px;font-weight:700;color:var(--accent);font-size:clamp(17px,2.2vw,22px);border-bottom:2px solid var(--accent);padding-bottom:3px}
  footer{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 7vw;font-size:12px;color:var(--ink-soft);opacity:.65;font-weight:600;letter-spacing:.04em}
  .nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
  .nav button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);width:40px;height:30px;border-radius:6px;cursor:pointer;font-size:15px}
  .nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .brand{font-family:'Italiana',serif;font-style:italic}
</style>
</head>
<body>
<div id="stage"></div>
<footer><span class="brand">Finding Faith Above</span><span id="pageno"></span></footer>
<div class="nav"><button id="prev">&#8592;</button><button id="next">&#8594;</button></div>
<script>
const S = [
  {t:'cover', cls:'cover',
   kicker:'A Finding Faith Above Masterclass',
   h:'The Same Words, a Different Jesus',
   sub:'How to rebuild real faith after you leave the Mormon church',
   body:"For the woman who left the LDS church and still, quietly, wants God. This is the path back to Him, one honest step at a time."},

  {t:'content',
   kicker:'Who this is for',
   h:'You left. But you did not stop wanting God.',
   body:"You walked away from the church. Maybe from church hurt, maybe from questions no one would answer. But somewhere underneath the doubt, you still want to know if Jesus is real, and if He wants you."},

  {t:'stat',
   kicker:'The thing no one warns you about',
   big:'85%',
   sub:'of people who leave the LDS church leave God altogether.',
   body:"Not because they stopped caring. Because no one showed them the difference between the church they left and the God they were actually looking for. It does not have to be you."},

  {t:'content',
   kicker:'The trap',
   h:'You were handed a Jesus, a gospel, and a plan.',
   body:"When you leave, all three come up for question at once. And because you cannot tell which parts were true, it feels safer to set the whole thing down. So most women do."},

  {t:'reframe',
   kicker:'The real reframe',
   h:'The hardest part of leaving is not losing the church.',
   sub:"It is discovering that the words you trusted meant something different than you thought.",
   body:"God. Jesus. Grace. Salvation. You already have these words. That is exactly why rebuilding feels so disorienting."},

  {t:'section', num:'Part One', h:'The core problem: counterfeit gospels'},

  {t:'content',
   kicker:'Part One',
   h:'Identical language. A different theology.',
   body:"LDS teaching and biblical Christianity use the same vocabulary while meaning very different things about who God is, who Jesus is, and how a person is saved.",
   list:["“Grace” you earn vs grace you receive","A Jesus you reach vs a Jesus who reaches you","Worthiness you perform vs righteousness you are given"]},

  {t:'content',
   kicker:'Part One',
   h:'This is why self-help could not fix it.',
   body:"You do not have a motivation problem. You have a translation problem. Until the words are untangled, every attempt to “just believe again” runs back into the old meanings."},

  {t:'section', num:'Part Two', h:'The framework: Finding Faith Above'},

  {t:'content',
   kicker:'Part Two · Pillar 1',
   h:'Name your exit. The Four Types of Ex-Mormon.',
   body:"There is not one way out of the church, there are four. Knowing which journey you are on tells you what to rebuild first, and what to stop carrying."},

  {t:'content',
   kicker:'Part Two · Pillar 2',
   h:'Learn to read the Bible for the first time.',
   body:"Biblical literacy is the skill that lets you spot a counterfeit gospel on your own, so your faith stops depending on who is in the room and starts standing on what is actually written."},

  {t:'content',
   kicker:'Part Two · Pillar 3',
   h:'Grace, not performance.',
   body:"The gospel that frees you is the one you cannot earn. We trade the worthiness treadmill for the thing it was always pointing at: being received as you are."},

  {t:'content',
   kicker:'Part Two · Pillar 4',
   h:'Peacekeeper or peacemaker?',
   body:"Your family may still believe. Peacekeeping keeps everyone comfortable and keeps you small. Peacemaking tells the truth in love, even when the truth disrupts the room.",
   list:["Peacekeeping is appeasement","Peacemaking is truth rooted in love","You are allowed to do the second one"]},

  {t:'content',
   kicker:'Part Two · Pillar 5',
   h:'Baby steps, every day.',
   body:"You do not rebuild a faith in a weekend. You rebuild it in small daily steps: who God is, what the gospel says, how to walk with Jesus without the old overwhelm."},

  {t:'section', num:'Part Three', h:'What the other side looks like'},

  {t:'content',
   kicker:'Part Three',
   h:'Peace. Truth. Confidence.',
   body:"Not certainty about everything. Confidence about the one thing that holds: you can be out of the church and fully with God at the same time. That is the whole promise."},

  {t:'content',
   kicker:'Why me',
   h:'I spent 20 years in the confusion first.',
   body:"I left the LDS church and, like most people, left God too. It took two decades of doubt and searching before I found freedom in the real gospel of Jesus. Finding Faith Above is the map I wish someone had handed me on the way out."},

  {t:'content',
   kicker:'Grace Mentorship',
   h:'A private place to ask the big questions.',
   body:"One on one, no judgment, no performance. We start by walking the Five Steps of Finding Faith Above together and unpack what is actually holding your faith back."},

  {t:'cta', cls:'cta',
   kicker:'Your next step',
   h:'Start with one honest conversation.',
   sub:"Book a Grace Mentorship call and walk the Five Steps of Finding Faith Above with me.",
   body:"You left the church. You do not have to leave God. Let's find your way back to Him, together.",
   cta:'findingfaithabove.com/coaching',
   disc:"Educational content only. No spiritual, emotional, income, or life result is guaranteed. Results vary and depend on your own faith journey."}
];

const stage=document.getElementById('stage');
const pageno=document.getElementById('pageno');
let i=0;
function esc(x){return x;}
function render(){
  const s=S[i];
  let html='<div class="slide on '+(s.cls||'')+'">';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.num) html+='<div class="section-num">'+s.num+'</div>';
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.h) html+=(s.t==='cover'?'<h1>':'<h2>')+s.h+(s.t==='cover'?'</h1>':'</h2>');
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.body) html+='<p class="body">'+s.body+'</p>';
  if(s.list){html+='<ul>';s.list.forEach(function(x){html+='<li>'+x+'</li>';});html+='</ul>';}
  if(s.cta) html+='<span class="cta-line">'+s.cta+'</span>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  html+='</div>';
  stage.innerHTML=html;
  pageno.textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.getElementById('next').onclick=function(){go(1);};
document.getElementById('prev').onclick=function(){go(-1);};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
stage.addEventListener('click',function(e){if(e.clientX>window.innerWidth*0.5)go(1);else go(-1);});
render();
</script>
</body>
</html>
