<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sought-After Speaker System - a masterclass with Laylee Emadi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e4;        /* brand cream ground */
    --panel:#fffdf7;     /* lifted cream panel */
    --ink:#2b574f;       /* brand dominant forest green */
    --ink-soft:#3f6b62;
    --accent:#ba7a6e;    /* brand terracotta accent */
    --rule:#d9cfb6;      /* muted warm hairline */
    --muted:#6f6552;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:64px 58px;
    margin:0 0 22px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide.dark{background:var(--ink);color:var(--bg);border-color:#24463f}
  .slide.dark .kicker{color:var(--accent)}
  .slide.dark .rule{background:var(--accent)}
  .kicker{font-family:'Montserrat';font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .rule{width:54px;height:3px;background:var(--accent);border-radius:2px;margin:18px 0 0}
  h1{font-family:'Libre Caslon Display';font-weight:400;font-size:56px;line-height:1.06;letter-spacing:-.005em}
  h2{font-family:'Libre Caslon Display';font-weight:400;font-size:40px;line-height:1.1;margin-bottom:10px}
  .lead{font-family:'Libre Caslon Display';font-size:30px;line-height:1.26;font-weight:400}
  p.body{font-size:17px;line-height:1.6;color:var(--ink-soft);margin-top:16px;max-width:60ch}
  .slide.dark p.body{color:#d9e4df}
  .present{margin-top:26px;font-size:14px;letter-spacing:.04em;color:var(--muted)}
  .slide.dark .present{color:#b8c7c0}
  ul.points{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:14px}
  ul.points li{font-size:18px;line-height:1.45;padding-left:30px;position:relative;color:var(--ink-soft)}
  ul.points li:before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .slide.dark ul.points li{color:#dfe8e3}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
  .pillar{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:22px}
  .pillar .n{font-family:'Libre Caslon Display';font-weight:400;font-size:30px;color:var(--accent);line-height:1}
  .pillar h3{font-family:'Montserrat';font-weight:600;font-size:16px;margin:8px 0 6px;letter-spacing:.01em}
  .pillar p{font-size:14px;line-height:1.5;color:var(--muted)}
  .cred{display:flex;flex-direction:column;gap:12px;margin-top:22px}
  .cred span{font-size:17px;line-height:1.5;color:var(--ink-soft);padding-left:26px;position:relative}
  .cred span:before{content:"";position:absolute;left:0;top:8px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .disclaimer{margin-top:26px;font-size:12.5px;line-height:1.5;color:var(--muted);max-width:66ch}
  .num{position:absolute;top:22px;right:28px;font-family:'Libre Caslon Display';font-size:16px;color:var(--muted)}
  .slide.dark .num{color:#9fb2ab}
  .big-quote{font-family:'Libre Caslon Display';font-weight:400;font-size:40px;line-height:1.2}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:'A live masterclass',
    h1:'The Sought-After Speaker System',
    lead:'How creative entrepreneurs get booked and paid to speak on the stages that grow their business.',
    present:'with Laylee Emadi'},

  {t:'statement',
    kicker:'What you will walk away with',
    lead:'A clear path from great at your craft to booked on the stage.',
    body:'By the end you will know the one talk to lead with, the pitch that gets a yes, the way to turn one booking into the next, and how to make speaking a part of your business that actually pays.'},

  {t:'statement',
    kicker:'Who this is for',
    lead:'You are great at your craft. You just have not been handed a microphone yet.',
    body:'Photographers, designers, course creators, creative educators. You have the expertise and the stories. What you do not have is a repeatable way onto the stages where your dream clients are already sitting.'},

  {t:'statement',
    kicker:'The trap',
    lead:'Most creatives wait to be discovered.',
    body:'The quiet belief is that if the work is good enough, someone will notice and invite you. So you keep posting, keep perfecting, and keep waiting for the email that rarely comes.'},

  {t:'dark',
    kicker:'The cost of waiting',
    quote:'Every season you wait to be chosen, someone with half your skill is pitching for the stage you wanted.',
    body:'The stage does not go to the best creative. It goes to the one the host had a reason to say yes to.'},

  {t:'dark',
    kicker:'The reframe',
    quote:'The speaker on that stage is almost never the most talented person in the room. They are the one who learned how to get booked.',
    body:'Getting on stage is not a talent contest. It is a skill, and like any skill it can be taught, practiced, and repeated.'},

  {t:'statement',
    kicker:'Part one',
    lead:'Why talent alone does not get you booked.',
    body:'There are three real reasons skilled creatives stay invisible to the people who fill stages.'},

  {t:'list',
    kicker:'Part one',
    h2:'The three reasons you stay invisible',
    points:[
      'You wait for an invitation instead of making a pitch, so hosts never know you want the stage.',
      'You pitch your bio and your topic list instead of one clear talk a host can say yes to.',
      'You treat speaking as free exposure, so you never build it into a paid part of your business.'
    ]},

  {t:'statement',
    kicker:'Part two',
    lead:'The Sought-After Speaker System.',
    body:'Four parts that turn your expertise into a talk hosts compete to book, and a business that gets paid for it.'},

  {t:'pillars',
    kicker:'Part two',
    h2:'The four parts',
    pillars:[
      {n:'01',h:'Your signature talk',p:'Shape the one talk only you can give, built around a clear transformation so a host instantly knows who it is for and why it belongs on their stage.'},
      {n:'02',h:'The pitch',p:'Craft the irresistible pitch and build real relationships with the organizers who decide, so your name is in the room before the lineup is set.'},
      {n:'03',h:'The stage',p:'Deliver in a way that earns the rebooking and the referral, so one yes turns into the next three without a cold pitch.'},
      {n:'04',h:'Get paid',p:'Understand how speaker pay actually works in the creative industry and price yourself so the stage pays you, not just promotes you.'}
    ]},

  {t:'statement',
    kicker:'Part two - the signature talk',
    lead:'A signature talk is not a topic. It is a promise.',
    body:'Hosts do not book subjects, they book outcomes for their audience. When your talk names the exact change a room will walk away with, you stop competing on credentials and start being the obvious choice.'},

  {t:'statement',
    kicker:'Part two - the pitch',
    lead:'Pitches get the yes. Relationships get the next five.',
    body:'One good pitch can open a door. A real relationship with the people who run events is what keeps you on the shortlist season after season, long before applications ever open.'},

  {t:'statement',
    kicker:'Part two - the stage',
    lead:'The best lead for your next stage is the stage you are on.',
    body:'How you show up and follow through decides whether a host rebooks you and sends your name to the three organizers they know. Delivered well, one talk quietly books the next few.'},

  {t:'statement',
    kicker:'Part two - get paid',
    lead:'Speaking can pay you, not just promote you.',
    body:'Most creatives never learn how compensation really works in this industry, so they say yes to exposure and leave money on the table. Knowing the models lets you ask with confidence and build speaking into real income.'},

  {t:'dark',
    kicker:'Part two',
    quote:'Exposure does not pay your bills. A system does.',
    body:'The creatives who speak for a living did not get lucky. They decided speaking was a channel, not a favor, and they built it on purpose.'},

  {t:'statement',
    kicker:'Part three',
    lead:'A season in the booked version of your business.',
    body:'You are pitching a handful of the right stages each season, hosts are coming back to you, your signature talk feeds your programs, and speaking has become a line of income instead of a hope.'},

  {t:'statement',
    kicker:'Part three',
    lead:'The stage does not just grow your reach. It grows your whole business.',
    body:'Every talk sends the right people toward your programs, your community, and your waitlist. One signature talk, given on the right stages, can do the work of months of quiet marketing.'},

  {t:'cred',
    kicker:'Why learn this here',
    h2:'Why me',
    cred:[
      'A trained classroom teacher and curriculum designer before I was a creative, so I teach the craft of teaching and speaking, not just the pep talk.',
      'A full-time creative since 2013 who built a speaking and education business in this exact industry.',
      'I have spoken on the stages creatives want: Showit United, Creative at Heart, Alt Summit, HoneyBook, and more.',
      'I host a long-running podcast for speakers, coaches, and course creators, where event hosts tell me what they are really looking for.'
    ]},

  {t:'cta',
    kicker:'Your next step',
    h2:'Take the first step toward the stage',
    body:'If you are ready to stop waiting to be discovered and start getting booked, the Sought-After Speaker System walks you through all four parts, with the pitching guides and host interviews that make it real.',
    next:'Join the Sought-After Speaker System and start building the talk that gets you booked.',
    disclaimer:'For educational purposes only. This masterclass teaches a method; it is not advice about your specific business and makes no income or results promises. Outcomes depend on your work and your market, so results vary and are not guaranteed.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var deck=document.getElementById('deck');
S.forEach(function(s,i){
  var slide=el('div','slide'+((s.t==='dark')?' dark':''));
  slide.appendChild(el('div','num',(i+1)+' / '+S.length));
  if(s.kicker) slide.appendChild(el('div','kicker',s.kicker));
  if(s.t==='title'){
    slide.appendChild(el('h1',null,s.h1));
    slide.appendChild(el('div','rule'));
    if(s.lead) slide.appendChild(el('p','lead',s.lead));
    if(s.present) slide.appendChild(el('div','present',s.present));
  } else if(s.t==='statement'){
    if(s.lead) slide.appendChild(el('div','lead',s.lead));
    if(s.body) slide.appendChild(el('p','body',s.body));
  } else if(s.t==='dark'){
    if(s.quote) slide.appendChild(el('div','big-quote',s.quote));
    slide.appendChild(el('div','rule'));
    if(s.body) slide.appendChild(el('p','body',s.body));
  } else if(s.t==='list'){
    if(s.h2) slide.appendChild(el('h2',null,s.h2));
    var ul=el('ul','points');
    s.points.forEach(function(p){ul.appendChild(el('li',null,p));});
    slide.appendChild(ul);
  } else if(s.t==='pillars'){
    if(s.h2) slide.appendChild(el('h2',null,s.h2));
    var grid=el('div','pillars');
    s.pillars.forEach(function(p){
      var c=el('div','pillar');
      c.appendChild(el('div','n',p.n));
      c.appendChild(el('h3',null,p.h));
      c.appendChild(el('p',null,p.p));
      grid.appendChild(c);
    });
    slide.appendChild(grid);
  } else if(s.t==='cred'){
    if(s.h2) slide.appendChild(el('h2',null,s.h2));
    var box=el('div','cred');
    s.cred.forEach(function(x){box.appendChild(el('span',null,x));});
    slide.appendChild(box);
  } else if(s.t==='cta'){
    if(s.h2) slide.appendChild(el('h2',null,s.h2));
    if(s.body) slide.appendChild(el('p','body',s.body));
    slide.appendChild(el('div','rule'));
    if(s.next) slide.appendChild(el('p','lead',s.next));
    if(s.disclaimer) slide.appendChild(el('div','disclaimer',s.disclaimer));
  }
  deck.appendChild(slide);
});
</script>
</body>
</html>
