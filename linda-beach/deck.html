<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Retreat Roadmap — Linda Beach Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7edd4;        /* pale sand, a light tint of her golden sun #ffcc4d + warm-brown world */
    --panel:#fffdf6;     /* warm off-white panel */
    --rule:#2d93ad;      /* ocean teal, her footer brand (9 uses) */
    --accent:#2d93ad;    /* ocean teal accent */
    --sun:#ffcc4d;       /* golden sun pop (10 uses) */
    --ink:#563a00;       /* warm brown, dominant (26 uses) */
    --muted:#6f6350;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:'Ubuntu',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{background:var(--bg);border-radius:14px;padding:56px 56px 52px;margin:0 0 22px;
    min-height:470px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 34px rgba(0,0,0,.18);position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--rule)}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-family:'Playfair Display',serif;font-weight:800;font-size:52px;line-height:1.05;margin-bottom:18px}
  h2{font-family:'Playfair Display',serif;font-weight:700;font-size:38px;line-height:1.1;margin-bottom:16px}
  h3{font-family:'Playfair Display',serif;font-weight:600;font-size:26px;margin-bottom:10px}
  p{font-size:20px;line-height:1.5;color:var(--muted);max-width:44ch;margin-bottom:12px}
  p.lead{color:var(--ink);font-size:22px;max-width:46ch}
  .promise{font-size:24px;color:var(--ink);font-weight:500;max-width:48ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;line-height:1.45;color:var(--ink);padding:10px 0 10px 34px;position:relative;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:18px;width:14px;height:14px;border-radius:50%;
    background:var(--sun);border:3px solid var(--accent)}
  .stop{display:flex;gap:16px;align-items:flex-start;margin:8px 0}
  .stopnum{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;
    font-family:'Playfair Display',serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
  .brand{position:absolute;right:30px;bottom:24px;font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);font-weight:700}
  .kicker{font-size:18px;color:var(--accent);font-weight:700;margin-bottom:8px}
  .big{font-family:'Playfair Display',serif;font-size:64px;font-weight:800;color:var(--accent);line-height:1}
  .cta h2{margin-bottom:14px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.4}
  .pagefoot{text-align:center;color:#d8cbb3;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding-top:6px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="pagefoot">Linda Beach Coaching &middot; a live masterclass</div>
<div class="pagefoot" style="max-width:62ch;margin:6px auto 0;text-transform:none;letter-spacing:normal">This masterclass is educational. No specific income or result is guaranteed. Results vary with the work, the market and the person.</div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass',h:'The Retreat Roadmap',promise:'How to design, fill and run a profitable retreat without the overwhelm.'},
 {t:'who',eyebrow:'Who this is for',h:'You love the idea of hosting a retreat.',body:'Coaches, course creators, speakers, yoga teachers, healers and any entrepreneur, online or off, who wants to add transformational retreats to their business and get paid to travel.'},
 {t:'trap',eyebrow:'The trap',h:'So why does it feel so risky?',body:'You picture the perfect venue and the life-changing week. Then the doubt creeps in. What if the seats do not fill? What if you pour months into planning and barely break even?'},
 {t:'reframe',eyebrow:'The real problem',h:'A retreat is not an event. It is a business.',body:'Most first retreats do not fail on the experience. They fail on the business behind it: the wrong guest, pricing built on hope, and marketing that started far too late.'},
 {t:'part',kicker:'Part One',h:'Why most retreats lose money or never fill.'},
 {t:'list',eyebrow:'The three silent killers',h:'It is almost never the destination.',items:['No clear picture of the one guest the retreat is for','Pricing set from fear instead of the real numbers','Marketing that starts weeks before, not months before']},
 {t:'part',kicker:'Part Two',h:'The 12-Milestone Retreat Roadmap.'},
 {t:'lead',eyebrow:'The idea',h:'Think of it as a road trip.',body:'Every profitable retreat follows the same route. When you take the stops in order, you never miss the piece that would have cost you the booking or the budget. Here are the five stops that matter most.'},
 {t:'stops',eyebrow:'Stop one and two',h:'Set your compass. Learn the rules of the road.',stops:[['1','Get clear on your purpose, your values and the transformation you are really selling.'],['2','Handle the legal, insurance and risk pieces before anything else, so nothing can blindside you later.']]},
 {t:'stops',eyebrow:'Stop three',h:'Map your route.',stops:[['3','Choose the one ideal guest, narrow the offer, and lock the theme. This single decision makes every later choice easy.']]},
 {t:'stops',eyebrow:'Stop four, five and six',h:'Build the experience and the numbers.',stops:[['4','Assemble your team: co-facilitators, assistants, speakers and local vendors.'],['5','Design the curriculum and the daily rhythm so guests feel held, not rushed.'],['6','Profits in paradise: build the real budget and price so the retreat profits.']]},
 {t:'stops',eyebrow:'Stop seven, eight and nine',h:'Start your marketing engines.',stops:[['7','Set up registration and a simple vetting process so you attract the right people.'],['8','Write the sales page and the copy that makes the right guest feel seen.'],['9','Put the pedal to the metal: grow the list with a freebie and nurture it until it is time to fill the seats.']]},
 {t:'stops',eyebrow:'Stop ten, eleven and twelve',h:'Arrive, deliver, and do it again.',stops:[['10','Finalize logistics and prepare your guests so arrival day is calm.'],['11','Run the retreat and manage expectations on the ground.'],['12','Unpack the journey: reconcile, learn, and roll your guests into the next one.']]},
 {t:'part',kicker:'Part Three',h:'When the retreat pays three times over.'},
 {t:'lead',eyebrow:'The shift',h:'Revenue before, during and after.',body:'A retreat run this way earns three times over: deposits and seats before you go, upgrades and experiences while you are there, and the next program or retreat when guests come home transformed. That is what makes it repeatable.'},
 {t:'why',eyebrow:'Why me',h:'I have made the mistakes so you do not have to.',body:'I am a 35-year entrepreneur who rebuilt a spa-school chain, then sold it, moved to Belize and became a digital nomad. I have personally hosted 350+ events and 50+ retreats across every group size. This roadmap is that experience, turned into stops you can follow.'},
 {t:'lead',eyebrow:'The invitation',h:'One decision away.',body:'You are only one decision away from creating a life you do not need a vacation from. The roadmap is how you get there without the overwhelm.'},
 {t:'cta',eyebrow:'Your next step',h:'Ready to map your retreat?',body:'Join me inside Retreat Success Coaching and we will walk your retreat through every stop together.',cta:'Start with the Mini Retreat Roadmap at lindabeachcoaching.com',disc:'This masterclass is educational. No specific income or result is guaranteed. Results vary with the work, the market and the person.'}
];
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function slideHTML(s){
  let inner='';
  if(s.eyebrow) inner+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.kicker) inner+='<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.t==='title'){inner+='<h1>'+esc(s.h)+'</h1><p class="promise">'+esc(s.promise)+'</p>';}
  else if(s.t==='part'){inner+='<h2>'+esc(s.h)+'</h2>';}
  else {inner+='<h2>'+esc(s.h)+'</h2>';}
  if(s.body) inner+='<p class="lead">'+esc(s.body)+'</p>';
  if(s.items){inner+='<ul>';s.items.forEach(function(i){inner+='<li>'+esc(i)+'</li>';});inner+='</ul>';}
  if(s.stops){s.stops.forEach(function(p){inner+='<div class="stop"><div class="stopnum">'+esc(p[0])+'</div><p class="lead" style="margin:6px 0 0">'+esc(p[1])+'</p></div>';});}
  if(s.cta) inner+='<p class="lead" style="color:var(--ink);font-weight:500;margin-top:18px">'+esc(s.cta)+'</p>';
  if(s.disc) inner+='<div class="disc">'+esc(s.disc)+'</div>';
  inner+='<div class="brand">Linda Beach Coaching</div>';
  return '<section class="slide '+(s.t==='cta'?'cta':'')+'">'+inner+'</section>';
}
document.getElementById('deck').innerHTML=S.map(slideHTML).join('');
</script>
</body>
</html>
