<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"><style>
* { margin:0; padding:0; box-sizing:border-box; }
.slide {
  width:1280px; height:720px; position:relative; overflow:hidden;
  font-family:'Roboto',sans-serif; color:#ecf0f1;
  background:#1d2f4f; display:flex; flex-direction:column;
  justify-content:center; padding:90px 100px;
}
.slide:before {
  content:''; position:absolute; top:0; left:0; width:14px; height:100%;
  background:#35c1cc;
}
.kicker { font-family:'Roboto',sans-serif; font-weight:700; letter-spacing:.22em;
  text-transform:uppercase; color:#35c1cc; font-size:20px; margin-bottom:26px; }
h1 { font-family:'Fjalla One',sans-serif; font-weight:400; line-height:1.05;
  color:#ffffff; font-size:72px; margin-bottom:34px; }
h2 { font-family:'Fjalla One',sans-serif; font-weight:400; line-height:1.08;
  color:#ffffff; font-size:58px; margin-bottom:40px; }
p { font-size:30px; line-height:1.5; color:#ecf0f1; margin-bottom:18px; max-width:980px; }
.sub { font-size:34px; color:#ecf0f1; font-weight:300; }
.byline { font-size:26px; color:#35c1cc; margin-top:18px; font-weight:500; }
.pagenum { position:absolute; right:56px; bottom:44px; font-size:18px;
  color:rgba(236,240,241,.5); letter-spacing:.1em; }
.brandfoot { position:absolute; left:100px; bottom:44px; font-size:18px;
  color:rgba(236,240,241,.5); letter-spacing:.08em; text-transform:uppercase; }
/* quote */
.q h1 { font-size:84px; color:#35c1cc; }
.q p { font-size:40px; font-weight:300; }
/* engine */
.engine-tag { display:inline-block; background:#35c1cc; color:#1d2f4f;
  font-family:'Fjalla One',sans-serif; font-size:24px; padding:8px 20px;
  letter-spacing:.14em; margin-bottom:30px; }
.engine p.symptom { color:#ffffff; font-size:36px; font-style:italic;
  border-left:5px solid #7155a2; padding-left:28px; margin-top:12px; }
/* grid4 */
.cards { display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:16px; }
.card { background:rgba(53,193,204,.10); border:1px solid rgba(53,193,204,.45);
  border-left:8px solid #35c1cc; padding:30px 34px; font-size:27px; color:#ffffff;
  line-height:1.4; border-radius:6px; }
/* title slide */
.title-slide { background:#0f1b30; }
.title-slide h1 { font-size:92px; }
.title-slide:before { width:100%; height:14px; }
/* cta */
.cta-slide { background:#0f1b30; }
.cta-slide .kicker { color:#7155a2; }
/* disclaimer */
.disclaimer-slide { background:#12203a; }
.disclaimer-slide p { font-size:24px; color:rgba(236,240,241,.8); }
.disclaimer-slide h2 { font-size:40px; color:#ecf0f1; }
</style></head><body><div class="slide "><div class="kicker">Travel Agent Achievers</div><h2>This is the DELIVER engine in action</h2><p>When the steps live in a system instead of your head,</p><p>a team member or a co-pilot can run them to your standard.</p><p>You review the outcome instead of doing every task.</p><div class="pagenum">15 / 24</div><div class="brandfoot">Travel Agent Achievers</div></div></body></html>
