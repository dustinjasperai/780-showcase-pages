<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reignite Your Career — a masterclass with Tosca DiMatteo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f7f6fb;
    --ink:#2a086d;
    --ink-soft:#453074;
    --paper:#ffffff;
    --accent:#7fc79a;
    --accent-soft:#d1edd9;
    --muted:#6f6494;
  }
  html,body{height:100%;}
  body{
    font-family:'Archivo',-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;}
  .slide{display:none;width:100%;max-width:900px;}
  .slide.on{display:block;animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kicker{font-family:'Archivo',sans-serif;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:22px;display:flex;align-items:center;gap:12px;}
  .kicker::before{content:"";width:28px;height:2px;background:var(--accent);display:inline-block;}
  h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,62px);line-height:1.08;letter-spacing:-.01em;margin-bottom:22px;}
  h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:clamp(26px,4.4vw,44px);line-height:1.14;letter-spacing:-.01em;margin-bottom:20px;}
  .sub{font-size:clamp(17px,2.1vw,22px);color:var(--ink-soft);line-height:1.5;max-width:40ch;}
  .body{font-size:clamp(16px,1.9vw,20px);color:var(--ink-soft);line-height:1.62;max-width:46ch;margin-top:10px;}
  .quote{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;font-size:clamp(26px,4.2vw,42px);line-height:1.22;letter-spacing:-.01em;max-width:24ch;}
  .quote .mark{color:var(--accent);}
  ul{list-style:none;margin-top:14px;}
  li{font-size:clamp(16px,2vw,21px);color:var(--ink-soft);line-height:1.4;padding:14px 0 14px 30px;border-bottom:1px solid var(--accent-soft);position:relative;}
  li:last-child{border-bottom:none;}
  li::before{content:"";position:absolute;left:0;top:22px;width:12px;height:2px;background:var(--accent);}
  li b{color:var(--ink);font-weight:600;}
  .big{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:clamp(60px,12vw,120px);line-height:1;color:var(--ink);}
  .pill{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--accent-soft);padding:7px 14px;border-radius:999px;margin-bottom:24px;}
  .cta{background:var(--ink);color:#fff;border-radius:18px;padding:7vh 6vw;}
  .cta h2{color:#fff;}
  .cta .sub{color:#d9d1f0;}
  .cta .step{margin-top:26px;font-size:clamp(17px,2.2vw,22px);font-weight:600;color:#fff;}
  .cta .step span{color:var(--accent);}
  .disc{margin-top:30px;font-size:13px;line-height:1.55;color:#b9aede;max-width:60ch;font-family:'Archivo',sans-serif;}
  .credit{margin-top:28px;font-size:15px;color:var(--muted);}
  .credit b{color:var(--ink);font-weight:600;}
  #nav{position:fixed;bottom:22px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px;font-family:'Archivo',sans-serif;font-size:13px;color:var(--muted);}
  #nav button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--accent-soft);border-radius:8px;padding:6px 12px;cursor:pointer;}
  #nav button:hover{border-color:var(--accent);}
  #count{min-width:54px;text-align:center;}
  .brandmark{position:fixed;top:24px;right:30px;font-family:'Bodoni Moda',serif;font-size:15px;color:var(--muted);letter-spacing:.02em;}
</style>
</head>
<body>
<div class="brandmark">The Unlock Lab &middot; Tosca DiMatteo</div>
<div id="stage"></div>
<div id="nav"><button id="prev">&larr; Prev</button><span id="count"></span><button id="next">Next &rarr;</button></div>
<script>
const S = [
  {t:'title', pill:'A live masterclass', h:"Reignite Your Career", sub:"Rewrite the story that is keeping you stuck, and move again. With Tosca DiMatteo, PCC."},
  {t:'list', k:"Who this is for", h:"You look successful on paper. You feel stuck underneath it.", list:["You have the titles, the resume, the results, and still a quiet sense that you have plateaued.","You keep reaching for the next certification, the next role, the next plan.","Nothing is wrong, exactly. Nothing is moving, either."]},
  {t:'quote', k:"The trap", html:"Leaders chase the next action <span class='mark'>because it is easier than facing the pattern beneath it.</span>"},
  {t:'body', k:"The reframe", h:"This was never a resume problem.", body:"The thing holding you is not a missing skill or a better plan. It is the story you are still telling about who you are and what you are allowed to want. Change the story, and the next move becomes obvious."},
  {t:'section', big:"01", k:"Part one", h:"You are running an outdated story.", body:"Most career advice works on the surface. It optimizes the plan. It never touches the narrative underneath, so the stuck feeling always comes back."},
  {t:'list', k:"The inner critic", h:"One voice writes most of the story.", body:"Before you can rewrite anything, you have to hear who is narrating. The Inner Critic Compass names the voice that is loudest for you.", list:["The Perfectionist, who moves the finish line every time you reach it.","The Doubter, who calls every win luck and every risk reckless.","The Pleaser, who built a career out of other people's expectations."]},
  {t:'section', big:"02", k:"Part two", h:"The Reignite method.", body:"Three moves that take you from stuck to moving. This is the work I do with clients over twelve months, in its simplest form."},
  {t:'list', k:"Move one", h:"Name the pattern.", body:"Not the symptom, the pattern. The recurring loop that has quietly run your last three decisions.", list:["Where you self-protect instead of reach.","The story you repeat about why now is not the time.","The one layer deeper that surface advice never asks about."]},
  {t:'list', k:"Move two", h:"Get clear on what you actually want.", body:"Clarity is not a vision board. It is the direction you would choose if the old story were not voting.", list:["Separate what you want from what you were told to want.","Realign the goal with your real values, not your title.","Decide the direction before you optimize the plan."]},
  {t:'list', k:"Move three", h:"Rewrite your personal-brand narrative.", body:"This is the part no generic coach can teach. I spent twenty-five years as a Fortune 500 brand strategist. We are going to build your story the same way.", list:["Reread your whole journey through an empowered, honest lens.","Turn it into mastery-level storytelling about who you are now.","Make the next move believable, to you first and then to the room."]},
  {t:'quote', k:"The principle", html:"Going <span class='mark'>one layer deeper</span> is what shifts your potential. Everything else is rearranging the surface."},
  {t:'list', k:"How the shift feels", h:"From self-protection to power.", list:["From your head to your heart, out of self-protection mode.","Learning to be your own best friend, not your harshest critic.","Leading from your strengths instead of your wounds."]},
  {t:'section', big:"03", k:"Part three", h:"After the rewrite, you move on purpose.", body:"Clients describe the change in plain terms, not jargon."},
  {t:'list', k:"The outcomes", h:"Unstuck, and moving on purpose.", list:["More confidence in the room and in the decision.","Better results, because the direction finally fits.","Simply feeling better about the work and the week."]},
  {t:'body', k:"Why me", h:"I have sat on both sides of this.", body:"Twenty-five years as a brand and marketing strategist at Unilever, Kimberly-Clark, Pernod Ricard and Univision. An MBA, an ICF Professional Certified Coach credential, and a podcast, The Unlock Lab, where I do this work out loud. I was the one getting in the way of my own potential, until I was not.", credit:true},
  {t:'cta', k:"Your next step", h:"Ready to rewrite the story?", sub:"If something here landed, the next move is a conversation. We will find the pattern, name the direction, and map the first rewrite together.", step:"Book an exploratory call at <span>toscadimatteo.com</span>", disc:"This masterclass is educational. No income, role, promotion, or result is guaranteed. Results vary by person, effort, and circumstance."}
];

const stage=document.getElementById('stage');
function esc(x){return x;}
function render(s){
  let h='';
  if(s.pill) h+=`<span class="pill">${s.pill}</span>`;
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.big) h+=`<div class="big">${s.big}</div>`;
  if(s.h) h+=(s.t==='title')?`<h1>${s.h}</h1>`:`<h2>${s.h}</h2>`;
  if(s.quote||s.t==='quote') h+=`<div class="quote">${s.html||''}</div>`;
  if(s.sub) h+=`<p class="sub">${s.sub}</p>`;
  if(s.body) h+=`<p class="body">${s.body}</p>`;
  if(s.credit) h+=`<p class="credit"><b>Tosca DiMatteo</b>, founder of TOSCA Coaching and Consulting</p>`;
  if(s.list){h+='<ul>';s.list.forEach(li=>h+=`<li>${li}</li>`);h+='</ul>';}
  if(s.step) h+=`<p class="step">${s.step}</p>`;
  if(s.disc) h+=`<p class="disc">${s.disc}</p>`;
  return h;
}
let i=0;
function show(n){
  i=Math.max(0,Math.min(S.length-1,n));
  const s=S[i];
  const cls=(s.t==='cta')?'slide on cta':'slide on';
  stage.innerHTML=`<div class="${cls}">${render(s)}</div>`;
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(i+1);
  if(e.key==='ArrowLeft')show(i-1);
});
document.addEventListener('click',e=>{if(e.target.closest('#nav'))return;show(i+1);});
show(0);
</script>
</body>
</html>
