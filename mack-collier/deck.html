<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From 0.5% to 13% - The Substack Conversion Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcf4f3;      /* faint tint of his brand red #e04b4b, light-scheme ground */
    --panel:#fffdfc;   /* warm off-white card */
    --rule:#e9e9e9;    /* his site rule grey */
    --accent:#e04b4b;  /* his dominant brand red (221 uses) */
    --accent2:#64c9ea; /* his button blue, used sparingly */
    --ink:#222222;     /* his body ink */
    --muted:#555555;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 44px;margin:0 0 22px;min-height:360px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .kick{font-family:"Open Sans";font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Anton",Impact,sans-serif;font-weight:400;line-height:1.02;letter-spacing:.01em;
    font-size:clamp(40px,7vw,78px);text-transform:uppercase}
  h2{font-family:"Anton",Impact,sans-serif;font-weight:400;line-height:1.05;
    font-size:clamp(28px,4.4vw,46px);text-transform:uppercase}
  p{font-size:19px;line-height:1.6;color:var(--ink);margin-top:16px;max-width:60ch}
  p.lead{font-size:22px;color:var(--muted)}
  .big{font-family:"Anton",Impact,sans-serif;font-size:clamp(54px,10vw,120px);color:var(--accent);
    line-height:1;letter-spacing:.01em}
  ul{margin:20px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 46px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:0}
  li .n{position:absolute;left:0;top:12px;font-family:"Anton";color:var(--accent);font-size:26px}
  .stages{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px}
  .stage{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .stage .t{font-family:"Anton";font-size:30px;color:var(--accent)}
  .stage .s{font-size:15px;color:var(--muted);margin-top:8px}
  .cta h1{color:var(--accent)}
  .disc{font-size:13px;color:var(--muted);margin-top:28px;max-width:62ch;line-height:1.5}
  .foot{font-size:13px;color:var(--muted);margin-top:14px;letter-spacing:.04em}
  .tag{display:inline-block;background:var(--accent2);color:#06323f;font-weight:700;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:999px;margin-bottom:18px;width:max-content}
  .num{font-family:"Open Sans";font-size:12px;color:var(--muted);letter-spacing:.12em;margin-top:26px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">A live masterclass with Mack Collier</div>
    <h1>From 0.5%<br>to 13%</h1>
    <p class="lead">The Substack conversion system that turns the readers you already have into paying subscribers.</p>`},

  {t:'audience', html:`
    <div class="kick">Who this is for</div>
    <h2>You already write. People already read.</h2>
    <p>This is for Substack writers and creators who have an audience and a free list that keeps growing, but a paid conversion rate that will not move. If you are great at the writing and stuck on the money, you are in the right room.</p>`},

  {t:'trap', html:`
    <div class="kick">The trap</div>
    <h2>1,000 subscribers. $300.</h2>
    <p>That was my own Substack after fourteen months of doing what the growth advice told me to do. A list that looked healthy, and almost no revenue underneath it. The number everyone told me to chase was the wrong number.</p>`},

  {t:'reframe', cls:'', html:`
    <div class="kick">The reframe</div>
    <h2>Growth is not your problem.</h2>
    <p class="lead">Conversion is. More free readers on a 0.5% conversion rate is just a bigger pile of people who will never pay you. The lever is not the top of the funnel. It is the middle.</p>`},

  {t:'part1', html:`
    <div class="tag">Part one</div>
    <h2>The cost of counting subscribers</h2>
    <p>Subscriber count is the easiest thing to measure and the easiest thing to fool yourself with. It feels like progress. It photographs well. And it hides the only question that matters: when a new reader arrives, what is the experience that turns them into a paying subscriber?</p>`},

  {t:'part1b', html:`
    <div class="kick">Part one</div>
    <h2>Most Substacks never build that experience</h2>
    <p>They publish, they grow the free list, and they hope. There is no deliberate path from free reader to paid subscriber, and no reason inside the work for anyone to upgrade. So the conversion rate sits at half a percent and nobody can say why.</p>`},

  {t:'part2', cls:'', html:`
    <div class="tag">Part two</div>
    <h2>The Three-Phase System</h2>
    <p class="lead">The method I used to take my own conversion rate from 0.5% to 13% in six months, and revenue up 703% over the same stretch. Three phases, in order.</p>`},

  {t:'phase1', html:`
    <div class="kick">Phase one</div>
    <h2>Content strategy</h2>
    <p>Focus and positioning first. Not more posts. A clear answer to what you are for and who you are for, so every piece compounds instead of scattering. Positioning is what makes the conversion possible later. Without it, nothing downstream works.</p>`},

  {t:'phase2', html:`
    <div class="kick">Phase two</div>
    <h2>The conversion experience</h2>
    <p>Now you design the path. A reader lands on a free post and there is a deliberate, repeatable experience that leverages your positioning and gives them a real reason to pay. This is the phase almost nobody builds, and it is where the 0.5% becomes 13%.</p>`},

  {t:'phase3', html:`
    <div class="kick">Phase three</div>
    <h2>The engagement layer</h2>
    <p>Then you layer engagement over both. Think like a rock star: your most engaged readers become the fans who bring the next wave and the subscribers who stay. An active subscriber chat and a real community are not nice-to-haves. They are the retention and referral engine.</p>`},

  {t:'stagesIntro', cls:'', html:`
    <div class="kick">The diagnostic</div>
    <h2>Three growth stages</h2>
    <p class="lead">Before you fix anything, know where you actually are. Every Substack moves through three stages, and each one needs a different move.</p>`},

  {t:'stages', html:`
    <div class="kick">Know your stage</div>
    <h2>Where are you right now?</h2>
    <div class="stages">
      <div class="stage"><div class="t">Stage 1</div><div class="s">0 to 3 new subscribers a day. Roughly the first 6 to 12 months. The job here is positioning.</div></div>
      <div class="stage"><div class="t">Stage 2</div><div class="s">4 to 10 a day. The next 3 to 6 months. The job here is the conversion experience.</div></div>
      <div class="stage"><div class="t">Stage 3</div><div class="s">The hockey stick. Growth turns exponential once engagement compounds.</div></div>
    </div>`},

  {t:'part3', cls:'', html:`
    <div class="tag">Part three</div>
    <h2>The week it starts paying</h2>
    <p class="lead">The three phases are not theory. Here is what they change the week you put them to work.</p>`},

  {t:'practice', html:`
    <div class="kick">In practice</div>
    <h2>The chat is where it happens</h2>
    <p>A free reader asks what upgrading actually gets them. In a Substack built on the system, that question has a clear, confident answer and a path to say yes. In one built on count alone, it gets a shrug. Conversion is a conversation you design on purpose.</p>`},

  {t:'proof', html:`
    <div class="kick">Why me</div>
    <h2>I ran this on myself first</h2>
    <ul>
      <li><span class="n">1</span>Conversion rate from 0.5% to 13% in six months on my own Substack.</li>
      <li><span class="n">2</span>Revenue up 703% over the same six months, from the same list.</li>
      <li><span class="n">3</span>Twenty years building engagement and content strategy for brands like Adobe, Dell and Club Med.</li>
      <li><span class="n">4</span>Author of Think Like a Rock Star, on turning customers into advocates.</li>
    </ul>`},

  {t:'recap', cls:'', html:`
    <div class="kick">The whole system</div>
    <h2>Content. Conversion. Engagement.</h2>
    <p class="lead">Positioning that compounds, a deliberate path that converts, and an engagement layer that keeps and multiplies the people who pay. In that order.</p>`},

  {t:'mistake', html:`
    <div class="kick">One thing to avoid</div>
    <h2>Do not skip to phase three</h2>
    <p>A community without positioning and a conversion path is just a busy room that does not pay. The phases are in order for a reason. Get the first two right and the third one does the compounding for you.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Keep building with me</div>
    <h1>Put the system to work</h1>
    <p>If you want the ongoing teardowns, templates and the conversion playbook, join <strong>Backstage Pass</strong>, my paid newsletter. If you want it built with you, <strong>Work With Mack</strong> on a consulting engagement and we will map your three phases together.</p>
    <p class="foot">Backstage Pass and consulting at mackcollier.com</p>
    <div class="disc">Educational content only. Your results depend on your own work, audience and market. No income, revenue, subscriber, or result is guaranteed, and the numbers shown are my own and not a promise of yours. Results vary.</div>`},
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls||'');
  d.innerHTML = s.html + `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  deck.appendChild(d);
});
</script>
</body>
</html>
