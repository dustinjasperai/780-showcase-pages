<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Recurring Revenue Salon — A Masterclass with Phil Jackson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f7; --panel:#f4eeeb; --rule:#ece0da;
    --acc:#e2238c; --spark:#ceff1a; --ink:#141110; --body:#4a3f3b; --dim:#9c8d86; --cream:#fbeef5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#efe6e2;font-family:'Montserrat',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.6%;background:var(--bg)}
  .slide.active{opacity:1}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Teko',sans-serif;font-weight:600;color:var(--ink);line-height:1.02;letter-spacing:.005em}
  .t-title h1{font-size:7.4vw;max-width:92%}
  .t-normal h1{font-size:4.4vw;max-width:88%;line-height:1.0}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.28vw;color:var(--body);margin-top:2.8vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Montserrat',sans-serif;font-style:italic;font-size:1.62vw;color:var(--acc);margin-top:3.0vh;max-width:80%;line-height:1.42;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.05vw;font-weight:700;color:var(--acc);margin-bottom:1.8vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:6.0vw;max-width:82%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.0vh}
  .t-dark{background:radial-gradient(120% 140% at 82% 8%,#241016 0%,#120a0d 100%)}
  .t-dark h1{color:var(--cream);font-size:5.0vw;max-width:86%;font-weight:500}
  .t-dark h1 .hl{color:var(--spark)}
  .t-cta{background:radial-gradient(120% 140% at 82% 8%,#241016 0%,#120a0d 100%)}
  .t-cta h1{color:var(--cream);font-size:5.2vw;max-width:84%}
  .t-cta .body{font-family:'Montserrat',sans-serif;color:#e9cfdd;font-size:1.3vw;margin-top:2.6vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.2vw;margin-top:4.0vh;flex-wrap:wrap}
  .chip{border:1.6px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.3vh 1.9vw;font-size:1.1vw;font-weight:600;font-family:'Montserrat',sans-serif}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.1vw;color:var(--body);margin-top:3.4vh;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:5.0vh;font-family:'Montserrat',sans-serif;font-size:.8vw;color:#c7a7b6;line-height:1.5;max-width:82%}
  .hud{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:6.5%;top:50%;transform:translateY(-50%);width:22vw;height:22vw;opacity:.95}
  .corner-mo{right:6%;bottom:8%;width:8vw;height:8vw;opacity:.5}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:12vw}.t-normal h1{font-size:8.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:10vw}.t-dark h1{font-size:8.6vw}
    .t-cta h1{font-size:9.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}.disc{font-size:2vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Build Your Salon</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a recurring-revenue cycle, a membership card looping through the months -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <g fill="none" stroke="#e2238c" stroke-width="2.4" stroke-linecap="round">
    <path d="M96 40 A40 40 0 1 0 100 66" opacity="0.9"/>
    <path d="M96 26 L98 42 L82 44" opacity="0.9"/>
    <rect x="34" y="48" width="52" height="34" rx="6" fill="#e2238c" stroke="none" opacity="0.14"/>
    <rect x="34" y="48" width="52" height="34" rx="6" opacity="0.85"/>
    <path d="M34 60 H86" opacity="0.7"/>
    <circle cx="60" cy="72" r="3.4" fill="#e2238c" stroke="none" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Recurring Revenue Salon',sub:'How to turn one-off appointments into predictable monthly income, with a membership your clients actually love.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You are brilliant behind the chair. It is the month-to-month income that keeps you up at night.',body:'You do beautiful work and your regulars adore you. But every new month the tills reset to zero, a quiet week still sends a chill down your spine, and the income never quite feels like something you can plan a life around. That is not a talent problem.'},
 {t:'dark',title:'A fully booked week is not the same as a <span class="hl">stable business</span>.'},

 {t:'section',idx:'Part One',title:'Why Great Salons Still Feel Fragile'},
 {t:'normal',k:'The feast and famine trap',title:'Every month your salon starts back at zero.',body:'It does not matter how strong last month was. On the first, the counter resets and you are chasing the next booking all over again. You are running a business that has to be re-won every single month, and that is exhausting even when the chairs are full.'},
 {t:'normal',k:'The discount reflex',title:'When it goes quiet, the instinct is to discount. That just trains clients to wait for the next deal.',body:'A flash offer rescues this week and quietly damages next year. It teaches your best clients that your work is worth less if they hold out, and it puts you in a price fight with the salon down the road instead of building something they cannot get anywhere else.'},
 {t:'dark',title:'You do not have a booking problem. You have a <span class="hl">predictability problem</span>.'},

 {t:'section',idx:'Part Two',title:'The Packages to Memberships Ladder'},
 {t:'normal',k:'Start with packages',title:'If you have no recurring revenue yet, start with packages, not memberships.',body:'Packages are simpler to build, easier to sell, and need no billing software. They get a client pre-committing to a series of visits, and they get you comfortable selling ahead instead of one appointment at a time. Packages are the first rung, and almost every salon can climb it this month.'},
 {t:'normal',k:'Know what you are selling',title:'A membership is not a loyalty card, and it is not a discount club.',body:'This is where most owners go wrong. A membership sells a monthly relationship and a result your client can feel, not a stack of points and not ten percent off. Get clear on the difference between a membership, a subscription, and a loyalty scheme before you price a single thing.'},
 {t:'normal',k:'Design around a result',title:'Build the membership around the outcome your client wants every month, not the gaps you want to fill.',body:'The members who stay are the ones getting something they genuinely value on a rhythm, whether that is maintenance, colour, or care they no longer have to think about booking. Design the tiers around that result, and price for profit rather than for whoever is cheapest in town.'},
 {t:'normal',k:'Convert your regulars first',title:'Your first members are already sitting in your chair.',body:'This is where the ladder pays off. Your most loyal, most regular clients are the easiest yes you will ever get, and they are the proof the model works. Invite them in before you spend a penny telling the world, and let their results become the story that fills the rest.'},
 {t:'dark',title:'Recurring revenue is not a bigger promotion. It is a <span class="hl">different model</span>.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Revenue Recurs'},
 {t:'normal',k:'The business this builds',title:'Predictable monthly income, loyal clients, and a diary that stops frightening you.',body:'When a base of members pays every month, you can finally plan, invest, and breathe. The quiet weeks lose their teeth because the income does not switch off with the footfall, and the decisions that used to feel risky, hiring, refitting, a day off, become things you can actually do.'},
 {t:'dark',title:'The goal was never to be busier. It was to build something that <span class="hl">holds</span>.'},
 {t:'normal',k:'Why Phil Jackson',title:'27 years in salons, and over 100 salon memberships built.',body:'Phil has spent nearly three decades inside the hair and beauty industry and has helped more than 100 salons build membership programmes that generate real, recurring revenue. Everything in this session is drawn from what actually worked in those salons, not from theory. This is the method behind all of it.'},

 {t:'section',idx:'Your Next Step',title:"Build Your Salon's Recurring Revenue"},
 {t:'normal',k:'Keep going with Phil',title:'The full method, from your first package to a membership your clients love.',body:'Salon Memberships Made Easy walks you through designing, pricing, and launching a membership step by step, and Phil coaches salon owners one to one when they want a set of eyes on their own numbers. Start where you are, and build the recurring income the rest of your business can lean on.'},
 {t:'cta',title:"Ready to make your salon's income recurring?",body:'Take the next step with Phil and Build Your Salon.',chips:['Work with Phil one to one','Start with Salon Memberships Made Easy'],disc:'Educational content for salon and beauty business owners. No revenue or income result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Build Your <b>Salon</b> · Phil Jackson</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='corner') h+=mo('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
