<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ambition Trap — A Masterclass with Amina AlTai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f3ede7;        /* her warm cream ground */
    --panel:#ffffff;
    --tint:#defff1;      /* her pale mint */
    --ink:#24245c;       /* her deep indigo ink */
    --ink-soft:#4a4a6e;
    --rule:#dcd4ca;
    --accent:#4c4cf9;    /* her 130-use signature indigo */
    --mint:#92ffcd;      /* her mint highlight */
  }
  html,body{height:100%}
  body{
    background:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:min(100vw,1180px);
    aspect-ratio:16/9;
    background:var(--bg);
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
  }
  .slide{
    position:absolute;inset:0;
    padding:72px 84px;
    display:none;
    flex-direction:column;
    justify-content:center;
  }
  .slide.on{display:flex}
  .eyebrow{font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:66px;line-height:1.04;letter-spacing:-.01em;color:var(--ink)}
  h2{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:46px;line-height:1.1;color:var(--ink);margin-bottom:24px}
  .lede{font-size:23px;line-height:1.5;color:var(--ink-soft);max-width:40ch;margin-top:26px}
  .big{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:52px;line-height:1.14;color:var(--ink);max-width:22ch}
  .big .hl{color:var(--accent)}
  ul{list-style:none;margin-top:14px}
  li{font-size:22px;line-height:1.45;color:var(--ink);padding:16px 0 16px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:46ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:25px;width:14px;height:14px;background:var(--accent);border-radius:50%}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:10px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 30px}
  .card.alt{background:var(--tint);border-color:#bfead6}
  .card .k{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .card.alt .k{color:#1b6b4b}
  .card .d{font-size:19px;line-height:1.42;color:var(--ink)}
  .num{font-family:'Newsreader',serif;font-size:30px;color:var(--accent);margin-right:12px}
  .frame{display:flex;flex-direction:column;gap:16px;margin-top:8px}
  .frame .row{display:flex;align-items:flex-start;gap:18px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px 26px;max-width:62ch}
  .frame .row .t{font-weight:700;font-size:20px;color:var(--ink)}
  .frame .row .s{font-size:18px;line-height:1.4;color:var(--ink-soft);margin-top:4px}
  .cred{font-size:21px;line-height:1.55;color:var(--ink);max-width:48ch;margin-top:10px}
  .cred strong{color:var(--accent);font-weight:600}
  .cta-h{font-family:'Newsreader',serif;font-size:58px;font-weight:400;line-height:1.05;color:var(--ink)}
  .cta-sub{font-size:23px;color:var(--ink-soft);margin-top:22px;max-width:40ch}
  .cta-btn{display:inline-block;margin-top:34px;background:var(--accent);color:#fff;font-weight:600;font-size:20px;padding:18px 40px;border-radius:999px;letter-spacing:.01em}
  .disclaimer{position:absolute;left:84px;right:84px;bottom:30px;font-size:13px;line-height:1.45;color:var(--ink-soft);opacity:.85}
  .path{display:flex;gap:0;margin-top:30px;border:1px solid var(--rule);border-radius:14px;overflow:hidden;max-width:70ch}
  .path>div{flex:1;padding:26px 28px}
  .path .pain{background:var(--panel)}
  .path .pur{background:var(--tint)}
  .path h3{font-family:'Newsreader',serif;font-weight:500;font-size:24px;margin-bottom:10px}
  .path .pain h3{color:var(--ink)}
  .path .pur h3{color:#1b6b4b}
  .path p{font-size:17px;line-height:1.4;color:var(--ink-soft)}
  .foot{position:absolute;right:28px;bottom:22px;font-size:13px;color:var(--ink-soft);font-weight:600;letter-spacing:.06em}
  .brandmark{position:absolute;left:84px;top:40px;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
  .nav button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:15px;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:'Archivo',sans-serif}
  .count{position:fixed;top:16px;right:20px;color:rgba(255,255,255,.6);font-size:13px;z-index:10;font-family:'Archivo',sans-serif}
</style>
</head>
<body>
<div id="stage"></div>
<div class="count" id="count"></div>
<div class="nav"><button onclick="go(-1)">&larr; Prev</button><button onclick="go(1)">Next &rarr;</button></div>
<script>
const S = [
  {t:'title'},
  {t:'forwhom'},
  {t:'reframe'},
  {t:'p1head'},
  {t:'p1wounds'},
  {t:'p1cost'},
  {t:'p1cycle'},
  {t:'p2head'},
  {t:'p2paths'},
  {t:'p2myth'},
  {t:'p2pillars'},
  {t:'p2aligned'},
  {t:'p2regulate'},
  {t:'p3head'},
  {t:'p3look'},
  {t:'p3start'},
  {t:'p3whyme'},
  {t:'recap'},
  {t:'cta', disc:'This masterclass is educational and reflects one coaching approach. It is not therapy, medical, or financial advice. No specific income, career, or business result is guaranteed. Results vary from person to person.'}
];

function h(html){return html}

function render(s){
  switch(s.t){
    case 'title': return `
      <div class="brandmark">Amina AlTai</div>
      <div class="eyebrow">A Live Masterclass</div>
      <h1>The Ambition Trap</h1>
      <p class="lede">How to stop chasing, start living, and build success that does not cost you yourself.</p>`;
    case 'forwhom': return `
      <div class="eyebrow">Who this is for</div>
      <h2>You hit the goal. The feeling did not come.</h2>
      <p class="lede">This is for the high achiever who keeps clearing the bar, keeps raising it, and keeps wondering why the finish line never arrives. The drive is real. So is the exhaustion.</p>`;
    case 'reframe': return `
      <div class="eyebrow">The reframe</div>
      <p class="big">Your ambition is not the problem. <span class="hl">Where it is rooted is.</span></p>`;
    case 'p1head': return `
      <div class="eyebrow">Part one</div>
      <h2>Painful ambition</h2>
      <p class="lede">Ambition that runs on fear, people pleasing, and old wounds. It can take you a long way, and it will still leave you empty, because it is trying to fill a hole that achievement cannot reach.</p>`;
    case 'p1wounds': return `
      <div class="eyebrow">What is really driving the chase</div>
      <h2>The three needs underneath</h2>
      <ul>
        <li><strong>Acceptance.</strong> Proving you are enough to belong.</li>
        <li><strong>Security.</strong> Outrunning an old fear of not being safe.</li>
        <li><strong>Belonging.</strong> Earning a seat you were made to doubt.</li>
      </ul>`;
    case 'p1cost': return `
      <div class="eyebrow">The bill comes due</div>
      <h2>What the chase quietly costs</h2>
      <ul>
        <li>Your health, spent as fuel and called discipline.</li>
        <li>Your relationships, scheduled around the next goal.</li>
        <li>The joy that made you want any of this in the first place.</li>
      </ul>`;
    case 'p1cycle': return `
      <div class="eyebrow">Why more never works</div>
      <p class="big">When we use external wins to soothe internal wounds, the win wears off and the bar goes up. <span class="hl">That is the trap.</span></p>`;
    case 'p2head': return `
      <div class="eyebrow">Part two</div>
      <h2>Purposeful ambition</h2>
      <p class="lede">The same drive, re-anchored. Rooted in alignment, self worth, and joy instead of fear. It is collaborative rather than isolating, and it is sustainable because it is not trying to prove anything.</p>`;
    case 'p2paths': return `
      <div class="eyebrow">The shift</div>
      <h2>Two ways to want the same things</h2>
      <div class="path">
        <div class="pain"><h3>Pain driven</h3><p>Chasing to be enough. Never arriving. Burnout as proof of effort.</p></div>
        <div class="pur"><h3>Purpose driven</h3><p>Building from enough. Clear on why. Energy that renews instead of drains.</p></div>
      </div>`;
    case 'p2myth': return `
      <div class="eyebrow">The fear that keeps you stuck</div>
      <p class="big">Slowing down will not cost you your edge. <span class="hl">Running on fear already is.</span></p>`;
    case 'p2pillars': return `
      <div class="eyebrow">What purposeful ambition stands on</div>
      <div class="two">
        <div class="card"><div class="k">Alignment</div><div class="d">Your goals match your actual values, so the work stops fighting you.</div></div>
        <div class="card alt"><div class="k">Self worth</div><div class="d">Worth is the starting point, not the prize at the end of the next goal.</div></div>
        <div class="card alt"><div class="k">Joy</div><div class="d">Pleasure and rest are inputs to great work, not rewards you keep deferring.</div></div>
        <div class="card"><div class="k">Community</div><div class="d">You can care for yourself and others at once. Ambition stops being a solo sport.</div></div>
      </div>`;
    case 'p2aligned': return `
      <div class="eyebrow">The method</div>
      <h2>Aligned leadership, mind, body and business</h2>
      <div class="frame">
        <div class="row"><div><div class="t">Mind</div><div class="s">Catch the old pattern setting the goal, and choose a truer one.</div></div></div>
        <div class="row"><div><div class="t">Body</div><div class="s">Regulate the nervous system so you lead from calm, not from threat.</div></div></div>
        <div class="row"><div><div class="t">Business</div><div class="s">Apply rigorous strategy on top of a steady system, so growth has integrity.</div></div></div>
      </div>`;
    case 'p2regulate': return `
      <div class="eyebrow">Why the body is in the room</div>
      <h2>You cannot think your way out of a threat response</h2>
      <p class="lede">When the system is braced for danger, every decision gets smaller and more defensive. Regulating first is what lets you lead from clarity, choose the bigger goal, and actually enjoy the pursuit.</p>`;
    case 'p3head': return `
      <div class="eyebrow">Part three</div>
      <h2>What changes when ambition is rooted right</h2>
      <p class="lede">Not less ambition. Better rooted ambition. You still aim high, and you stop paying for it with your health, your relationships, and the joy that made you want any of it.</p>`;
    case 'p3look': return `
      <div class="eyebrow">The difference you feel</div>
      <ul>
        <li>You pursue the big goal and stay recognizably yourself while you do it.</li>
        <li>Rest stops feeling like something you have to earn.</li>
        <li>Success starts to feel good, not just impressive on paper.</li>
      </ul>`;
    case 'p3start': return `
      <div class="eyebrow">Where the shift begins</div>
      <ul>
        <li>Name the goal you are chasing, then ask whose approval it is for.</li>
        <li>Separate the wound from the want. The want is often still worth it.</li>
        <li>Re-root the same ambition in a reason that would survive the win.</li>
      </ul>`;
    case 'p3whyme': return `
      <div class="eyebrow">Why learn this here</div>
      <h2>I built my work on this exact shift</h2>
      <p class="cred">I am <strong>Amina AlTai</strong>, a career and leadership coach and author of <strong>The Ambition Trap</strong>. My work on healthy, purpose driven ambition has been featured in Forbes, Entrepreneur, NBC and The New York Times, and it is the foundation of how I coach leaders and founders every day.</p>`;
    case 'recap': return `
      <div class="eyebrow">What you leave with</div>
      <ul>
        <li>A clear read on whether pain or purpose is driving you right now.</li>
        <li>The three wounds that quietly set your goals, named out loud.</li>
        <li>A first move to re-anchor your ambition to purpose this week.</li>
      </ul>`;
    case 'cta': return `
      <div class="eyebrow">Your next step</div>
      <div class="cta-h">Want to go deeper together?</div>
      <p class="cta-sub">If this masterclass named something true, the coaching is where we do the work. Book a consult with me and we will map what purposeful ambition looks like for you.</p>
      <span class="cta-btn">Book a consult with Amina</span>
      <div class="disclaimer">${s.disc}</div>`;
  }
}

let i=0;const stage=document.getElementById('stage'),count=document.getElementById('count');
function draw(){
  stage.innerHTML='';
  const d=document.createElement('div');
  d.className='slide on';
  d.innerHTML=render(S[i]) + (S[i].t!=='cta'?'<div class="foot">The Ambition Trap</div>':'');
  stage.appendChild(d);
  count.textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));draw()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
draw();
</script>
</body>
</html>
