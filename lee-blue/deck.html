<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Recurring Web Designer — DoubleStack with Lee Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --panel:#f4f1ec; --ink:#15151a; --deep:#171a50; --accent:#ff6a1f;
    --rule:rgba(21,21,26,.12); --muted:rgba(21,21,26,.62);
    --display:'Geist',system-ui,sans-serif; --body:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;
    justify-content:center;padding:8vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .k{font-family:var(--display);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:.78rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.02;
    letter-spacing:-.02em}
  h2{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,4.4vw,3.1rem);line-height:1.08;
    letter-spacing:-.01em}
  .sub{font-size:clamp(1.05rem,2vw,1.5rem);color:var(--muted);margin-top:1.3rem;max-width:30ch}
  p.body{font-size:clamp(1.02rem,1.6vw,1.3rem);margin-top:1.1rem;max-width:40ch}
  ul{list-style:none;margin-top:1.6rem;display:grid;gap:.9rem;max-width:44ch}
  li{font-size:clamp(1rem,1.5vw,1.22rem);padding-left:1.6rem;position:relative}
  li:before{content:"";position:absolute;left:0;top:.62em;width:.7rem;height:.7rem;
    background:var(--accent);border-radius:2px}
  .foot{position:absolute;bottom:3.4vh;left:9vw;font-family:var(--display);font-weight:600;
    font-size:.8rem;letter-spacing:.04em;color:var(--muted)}
  .num{position:absolute;top:3.4vh;right:9vw;font-family:var(--display);font-size:.8rem;color:var(--muted)}
  .title{background:var(--deep);color:var(--panel)}
  .title h1{color:var(--panel)} .title .sub{color:rgba(244,241,236,.8)} .title .foot{color:rgba(244,241,236,.7)}
  .title .k{color:var(--accent)} .title .num{color:rgba(244,241,236,.6)}
  .part{background:var(--deep);color:var(--panel)}
  .part h2{color:var(--panel)} .part .k{color:var(--accent)} .part .sub{color:rgba(244,241,236,.82)}
  .part .foot,.part .num{color:rgba(244,241,236,.6)}
  .reframe{background:var(--accent);color:#1a0f06}
  .reframe h2{color:#1a0f06} .reframe .k{color:#4a1f07} .reframe .foot,.reframe .num{color:rgba(26,15,6,.6)}
  .engine .tag{display:inline-block;font-family:var(--display);font-weight:800;font-size:1rem;
    background:var(--deep);color:var(--panel);padding:.3rem .9rem;border-radius:999px;margin-bottom:1.2rem}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:3rem;max-width:52ch}
  .cta{background:var(--deep);color:var(--panel)}
  .cta h2{color:var(--panel)} .cta .k{color:var(--accent)} .cta .sub{color:rgba(244,241,236,.85)}
  .disc{margin-top:2.4rem;font-size:.82rem;color:rgba(244,241,236,.55);max-width:52ch;line-height:1.5}
  .cta .foot{color:rgba(244,241,236,.65)}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', cls:'title', k:"DoubleStack with Lee Blue", h:"The Recurring Web Designer",
    sub:"How to turn a one-off build into income a local business pays you every month."},
  {t:'who', cls:'', k:"Who this is for", h:"You can build anything. You are just tired of starting from zero every month.",
    sub:"For the self-employed web designer who wants off the project treadmill."},
  {t:'trap', cls:'', k:"The trap", h:"You finish the site. You get paid once. Then you go find another stranger.",
    p:["Every month resets to zero. The work is good. The income is a rollercoaster.",
       "AI and cheap freelancers keep pushing your prices down. Building faster does not fix it."]},
  {t:'reframe', cls:'reframe', k:"The reframe", h:"A website is a one-time sale. A town is a subscription."},
  {t:'part', cls:'part', k:"Part one", h:"The real problem is not your skills.",
    sub:"It is what you are selling, and how often they pay for it."},
  {t:'list', cls:'', k:"Why one-off projects cap you", h:"Three ceilings every project shop hits.",
    p:["Each of these is a direct result of selling the website, not the outcome."],
    list:["Feast or famine: income stops the day the site ships.",
          "Price pressure: a website is a commodity, so you compete on cost.",
          "No leverage: more revenue always means more projects and more hours."]},
  {t:'turn', cls:'', k:"The shift", h:"Stop saying I build websites. Start saying I grow local businesses.",
    sub:"Local owners do not want a website. They want more customers, every month."},
  {t:'part', cls:'part', k:"Part two", h:"The Local Authority Blueprint",
    sub:"One local client. Three recurring engines. Income that repeats."},
  {t:'engine', cls:'engine', tag:"Engine 1", h:"Buy Now",
    p:["Capture the customers already looking: search, maps, and reviews that make your client the obvious choice today.",
       "This is the first thing a local business feels, and the first thing they will pay you to run."]},
  {t:'engine', cls:'engine', tag:"Engine 2", h:"Buy Later",
    p:["Nurture the customers who are not ready yet: simple content, email, and follow-up that keep your client top of mind.",
       "Most local businesses never do this, which is exactly why it is worth a monthly fee."]},
  {t:'engine', cls:'engine', tag:"Engine 3", h:"Buy Again",
    p:["Drive repeat business from customers they already won: offers, reminders, and reactivation.",
       "The cheapest growth a local business can buy, and the reason they stay with you for years."]},
  {t:'stack', cls:'', k:"Stacked", h:"Three engines running together is one monthly retainer.",
    p:["You are no longer paid once for a site. You are paid every month to keep the system working.",
       "That is the difference between a project and a practice."]},
  {t:'part', cls:'part', k:"Part three", h:"How you get in the door: Local Legends",
    sub:"The outreach that gets local owners to actually reply."},
  {t:'legend', cls:'', k:"The Local Legends move", h:"Lead with the community, not a cold website pitch.",
    p:["You reach out to feature a standout local business, not to sell them anything.",
       "People ignore a web designer selling websites. They say yes to being celebrated."]},
  {t:'why', cls:'', k:"Why it works", h:"You open a relationship instead of a sales call.",
    p:["Once you are talking, the conversation moves naturally from their story to their growth.",
       "That is where the recurring marketing engines come in, and where the retainer begins."]},
  {t:'day', cls:'', k:"Your DoubleStack week", h:"Under an hour a day of outreach.",
    p:["You are having real conversations with local owners instead of chasing one-off project leads.",
       "A handful of those conversations becomes a roster of clients who pay you every month."]},
  {t:'me', cls:'', k:"Why me", h:"I have been in your seat since 2002.",
    p:["I built websites and ran my own agency for over 20 years, then spent the last 8 years mentoring web designers on exactly this shift.",
       "I publish free training for more than 16,500 designers every week. This is the method I use and teach."]},
  {t:'outcome', cls:'', k:"What changes", h:"Predictable monthly income. Work you choose. Clients who stay.",
    p:["You stop competing on the price of a website and start owning the growth of a town.",
       "That is what the recurring model is built to make possible."]},
  {t:'recap', cls:'', k:"The whole system", h:"Local Legends in. Buy Now, Buy Later, Buy Again on repeat.",
    p:["Get in the door with the community. Install the three engines. Get paid every month to run them."]},
  {t:'cta', cls:'cta', k:"Your next step", h:"Want me to help you build this?",
    sub:"Book a call and we will map your first recurring local client together.",
    disc:"Educational only. No income, role, or result is guaranteed. Results vary based on your effort, your skills, and your local market."}
];
const root = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  let inner = '';
  if (s.k) inner += '<div class="k">' + s.k + '</div>';
  if (s.tag) inner += '<div class="tag">' + s.tag + '</div>';
  if (s.h) inner += (s.t === 'title' ? '<h1>' : '<h2>') + s.h + (s.t === 'title' ? '</h1>' : '</h2>');
  if (s.sub) inner += '<div class="sub">' + s.sub + '</div>';
  if (s.p) s.p.forEach(par => inner += '<p class="body">' + par + '</p>');
  if (s.list) { inner += '<ul>'; s.list.forEach(it => inner += '<li>' + it + '</li>'); inner += '</ul>'; }
  if (s.disc) inner += '<div class="disc">' + s.disc + '</div>';
  inner += '<div class="num">' + (i + 1) + ' / ' + S.length + '</div>';
  inner += '<div class="foot">DoubleStack with Lee Blue</div>';
  el.innerHTML = inner;
  root.appendChild(el);
});
</script>
</body>
</html>
