<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Service Businesses Win Corporate Contracts — a live masterclass with Jessica Lorimer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f4ef;      /* ground — harvested white-ground brand, warmed */
    --ink:#363636;        /* harvested dominant ink / primary accent */
    --deep:#1f1f1f;       /* deepened ink for emphasis */
    --rule:#b7b7b7;       /* harvested secondary grey */
    --mute:#6b6b6b;
    --head:'Newsreader',Georgia,serif;
    --body:'Archivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--deep);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 64px}
  .slide{background:var(--paper);border:1px solid var(--rule);border-radius:4px;
    padding:64px 64px 56px;margin:0 0 22px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative}
  .kick{font:600 12px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;
    color:var(--mute);margin-bottom:22px}
  h1{font:600 56px/1.04 var(--head);color:var(--deep);letter-spacing:-.01em}
  h2{font:600 40px/1.08 var(--head);color:var(--deep);letter-spacing:-.01em}
  .lead{font:400 22px/1.5 var(--head);color:var(--ink);margin-top:20px;max-width:34ch}
  p{font:400 18px/1.6 var(--body);color:var(--ink);margin-top:16px;max-width:58ch}
  .rule{height:1px;background:var(--rule);margin:26px 0;width:88px}
  .num{font:600 120px/.9 var(--head);color:var(--rule);position:absolute;top:40px;right:56px}
  ul{margin:18px 0 0 0;max-width:56ch}
  li{font:400 18px/1.5 var(--body);list-style:none;padding:14px 0;border-top:1px solid var(--rule);
    display:flex;gap:16px}
  li b{font:600 18px/1.5 var(--body);color:var(--deep);min-width:26px}
  .byline{font:500 15px/1.4 var(--body);color:var(--mute);margin-top:34px}
  .big{font:400 34px/1.28 var(--head);color:var(--deep);max-width:24ch}
  .stat{display:flex;gap:48px;margin-top:30px;flex-wrap:wrap}
  .stat div{min-width:150px}
  .stat .n{font:600 46px/1 var(--head);color:var(--deep)}
  .stat .l{font:400 15px/1.4 var(--body);color:var(--mute);margin-top:8px;max-width:20ch}
  .disc{font:400 13px/1.5 var(--body);color:var(--mute);margin-top:28px;max-width:60ch}
  .cta h2{margin-bottom:6px}
  .pagefoot{font:500 12px/1 var(--body);color:var(--mute);letter-spacing:.08em;
    position:absolute;bottom:26px;left:64px;text-transform:uppercase}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
   h:'How Service Businesses Win Corporate Contracts',
   lead:'The repeatable outbound system for landing paid corporate clients, taught live.',
   by:'A live masterclass with Jessica Lorimer · Selling To Corporate®'},

  {t:'who',k:'Who this is for',
   h:'Built for the expert, not the salesperson',
   p:'You are a coach, consultant, speaker, trainer or done-for-you service provider. You are great at the work. You just want a steadier way to put real corporate contracts on the books.'},

  {t:'trap',k:'The trap',
   h:'The creator playbook has a ceiling',
   p:'Chase dream clients on social. Wait for referrals. Fill the gaps with one-off day rates. It can work, but it is feast and famine, and it caps you at the size of your audience.'},

  {t:'cost',k:'The real cost',
   h:'You are competing for the wrong budget',
   p:'Individuals pay from their own pocket and haggle. Organisations have a line item for exactly what you do, sign off is one person, and the contract is worth months of individual clients.'},

  {t:'hook',k:'A reframe',
   big:'The budgets you want are already being spent. Just not in your inbox yet.'},

  {t:'part',k:'Part one',h:'Why waiting to be found never fills the pipeline'},

  {t:'body',k:'The core problem',
   h:'Corporates do not discover you. They are reached.',
   p:'Inbound brings you the buyers who were already looking. The organisations with real budgets are not searching creator hashtags. They get reached, deliberately, by someone who knows who holds the budget. That is a skill, and it is learnable.'},

  {t:'myth',k:'The myth to kill',
   h:'"Selling to corporates is cold and salesy"',
   p:'It is the opposite when it is done right. You show up as a peer who understands their problem, not a vendor pitching. Consultative beats salesy every time, and it is exactly how the quiet experts win the big contracts.'},

  {t:'part',k:'Part two',h:'The Selling To Corporate® 5-step framework'},

  {t:'step',n:'1',k:'Step one',h:'Clarity',
   p:'You get precise about who you sell to and the transformation you create for them, so every organisation you target has the exact problem you were built to solve.'},

  {t:'step',n:'2',k:'Step two',h:'Lead Generation',
   p:'You identify, target and approach the qualified decision-maker directly, the one person who owns the specialism and controls the budget, instead of getting stuck with gatekeepers who cannot say yes.'},

  {t:'step',n:'3',k:'Step three',h:'Business Development',
   p:'You open a conversation about their problem, not your services, and help them make sense of what is actually going on. That consultative relationship is what turns a cold contact into revenue.'},

  {t:'step',n:'4',k:'Step four',h:'Offers and Proposals',
   p:'You design the solution and put the outcome, the scope and the investment in the language procurement signs off, so the proposal does the selling when you are not in the room.'},

  {t:'step',n:'5',k:'Step five',h:'Delivery and Resell',
   p:'You deliver brilliantly, then renew and resell inside the same organisation, so one won contract becomes the start of an account, not a one-off.'},

  {t:'mechanic',k:'The asset at the centre',
   h:'The cold email that gets a reply',
   p:'The first step most people get wrong is the outreach itself. A short, structured, human email to the right decision-maker is the single highest-leverage asset in the whole system. Well-structured outreach regularly earns around a 38% reply rate.'},

  {t:'part',k:'Part three',h:'Your corporate pipeline, once the outreach is live'},

  {t:'picture',k:'The outcome',
   h:'A pipeline you control',
   p:'Instead of hoping the next client appears, you have a repeatable process that puts conversations with real buyers on the calendar every week. One corporate contract can replace months of individual work.'},

  {t:'why',k:'Why learn this from me',
   h:'This is the whole of what I do',
   p:'I have built a seven-figure business teaching thousands of independent service providers to sell into organisations including Amazon and the NHS, across 21+ countries, through the CPD-accredited Selling To Corporate® method.',
   stat:[['£1m+','in programme sales since 2019'],['98%','course completion rate'],['96%','cover their training cost within 6 months']]},

  {t:'cta',k:'Your next step',
   h:'Come build your corporate pipeline',
   p:'If you want the full framework, the outreach templates and the proposal structure, The C Suite® is where we do the work together, step by step.',
   disc:'Educational only. Results vary and are not guaranteed; outcomes depend on your offer, your market and the work you put in.',
   foot:'The C Suite® · Selling To Corporate®'}
];

const deck=document.getElementById('deck');
function esc(x){return x}
S.forEach(s=>{
  const d=document.createElement('section');d.className='slide '+(s.t==='cta'?'cta':'');
  let html='';
  if(s.n) html+='<div class="num">'+s.n+'</div>';
  if(s.k) html+='<div class="kick">'+s.k+'</div>';
  if(s.t==='title'){
    html+='<h1>'+s.h+'</h1><div class="rule"></div><div class="lead">'+s.lead+'</div>'+
          '<div class="byline">'+s.by+'</div>';
  } else if(s.t==='hook'){
    html+='<div class="big">'+s.big+'</div>';
  } else if(s.t==='part'){
    html+='<h2>'+s.h+'</h2><div class="rule"></div>';
  } else {
    if(s.h) html+='<h2>'+s.h+'</h2>';
    if(s.p) html+='<div class="rule"></div><p>'+s.p+'</p>';
    if(s.stat){html+='<div class="stat">';s.stat.forEach(x=>{html+='<div><div class="n">'+x[0]+'</div><div class="l">'+x[1]+'</div></div>'});html+='</div>';}
    if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  }
  if(s.foot) html+='<div class="pagefoot">'+s.foot+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
