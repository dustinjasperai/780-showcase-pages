<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Unoptimised Life — a masterclass with Dr. Rodney King</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe6;
    --panel:#e9e3d5;
    --rule:#d6cdbb;
    --ink:#2b2a26;
    --muted:#5e5a50;
    --accent:#3f5a43;
    --serif:'Lora',Georgia,serif;
    --sans:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--serif)}
  .wrap{max-width:900px;margin:0 auto;padding:48px 28px 96px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:56px 52px;
    margin:22px 0;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .slide::before{content:"";position:absolute;left:52px;top:34px;width:46px;height:2px;background:var(--accent)}
  .kicker{font-family:var(--sans);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;font-weight:600}
  h1{font-size:46px;line-height:1.08;font-weight:600;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-size:34px;line-height:1.16;font-weight:600;margin-bottom:18px}
  p{font-size:20px;line-height:1.55;color:var(--ink);margin-bottom:16px;max-width:62ch}
  p.lead{font-size:23px;color:var(--muted)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 26px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:21px;width:10px;height:10px;background:var(--accent);border-radius:50%}
  .cite{font-family:var(--sans);font-size:14px;color:var(--muted);margin-top:14px}
  .title-slide{min-height:560px}
  .title-slide h1{font-size:60px}
  .credit{font-family:var(--sans);font-size:15px;color:var(--muted);margin-top:28px;letter-spacing:.02em}
  .cta h2{color:var(--accent)}
  .disclaimer{font-family:var(--sans);font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:24px;padding-top:16px;border-top:1px solid var(--rule);max-width:70ch}
  .quote{font-style:italic;font-size:26px;line-height:1.4;max-width:58ch}
  .num{font-family:var(--sans);font-size:13px;color:var(--muted);position:absolute;right:52px;top:34px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'A live masterclass with Dr. Rodney King',h:'The Unoptimised Life',lead:'How to stop managing your life and start living it. A philosophy for people worn out by the self-improvement machine.',credit:'Coaching Philosophia · Natural Wisdom'},

  {t:'promise',kicker:'What this hour is',h:'Not another system to run',p:['By the end of this hour you will have a different relationship with the pressure you are under. Not one more routine to maintain, but a way of being you can return to.','We will look at why more improvement keeps making things worse, and what to reach for instead.'],lead:true},

  {t:'for',kicker:'Who this is for',h:'You did everything right. And you still feel it.',p:['You hit the goals. You read the books. You tracked the habits, downloaded the apps, optimised the morning.','And somewhere underneath it all is a quiet, stubborn question none of it answered: what is this actually for?']},

  {t:'trap',kicker:'The trap',h:'The gap nobody warned you about',p:['There is a growing gap between what modern life promises and what it actually delivers.','You were told that if you improved enough, measured enough, performed enough, the meaning would arrive. It did not. More optimisation only made the gap wider.']},

  {t:'reframe',kicker:'A harder truth',h:'The self-improvement machine is part of what is wearing you out.',p:['This is the reframe most coaching will never offer you, because the whole industry is built on selling you the next fix.','The problem was never that you had the wrong app, tracker, or routine. The problem is that you were trying to optimise your way to something optimisation cannot reach.'],quote:true},

  {t:'part',kicker:'Part One',h:'Performance has quietly replaced presence',p:['We have learned to treat our own lives as a project to be managed. Every moment becomes a task, every experience a metric, every self a brand to maintain.','Under that pressure the ordinary texture of being alive goes quiet. We get so busy performing a life that we stop actually living one.']},

  {t:'part1b',kicker:'Part One',h:'You cannot think your way out of it',p:['Here is why insight alone never fixes this. You already know you are overstretched. Knowing has not changed anything.','Transformation requires the whole self, not just the intellect. The gap between what we know and how we actually live is rarely closed by more information.']},

  {t:'questions',kicker:'Part One',h:'The questions beneath the goals',p:['Underneath every goal is a question the goal was meant to answer. Am I enough? Is this life actually mine?','Striving is very good at hitting targets. It is very bad at answering those. Philosophy is the practice of taking the real questions seriously again.']},

  {t:'part',kicker:'Part Two',h:'Natural Wisdom',p:['There is another kind of intelligence, and you were born with it. I call it Natural Wisdom.','It is not a technique or a system. It is the knowing that already lives in your body, your attention, and your breath. The wisdom that surfaces the moment you stop forcing and start feeling.']},

  {t:'pillars',kicker:'Part Two · what Natural Wisdom is',h:'It asks for the opposite of effort',p:['It does not require retreats, certifications, or complicated routines.'],ul:['Presence over performance: being here, not managing here','Being over branding: a self you live in, not one you maintain for others','The body as a source of knowing, not a machine to be upgraded','Boredom welcomed as a gateway back to imagination']},

  {t:'soulful',kicker:'Part Two · where it lives',h:'Soulful moments',p:['Natural Wisdom does not arrive inside the productivity stack. It arrives in the unstructured moments we have been trained to skip.','A barefoot walk. An unhurried meal. Watching birds play with nothing to show for it. These are not breaks from a meaningful life. They are the thing itself.'],quote:true},

  {t:'walk',kicker:'Part Two · the practice',h:'Walking Philosophy Home',p:['Philosophy was never meant to be an academic exercise. It was meant to be lived. Walked, eaten, breathed, practised in the middle of an ordinary day.','Walking Philosophy Home is how we bring timeless human wisdom back into contact with the whole self, so that what you believe and how you live finally start to agree.']},

  {t:'notthis',kicker:'Name it plainly',h:'Unoptimisation',p:['This is not positive thinking, and it is not one more morning routine. If anything it is subtraction.','Unoptimisation is the deliberate, slightly defiant choice of presence over performance and being over branding. Doing less, and actually inhabiting it.'],quote:true},

  {t:'part',kicker:'Part Three',h:'What flourishing actually looks like',p:['Flourishing is not a peak you reach and photograph. It is a way of being that holds up on the ordinary Tuesday as much as on the mountaintop.','It looks like doing less, but meeting it more fully. Choosing presence over the next optimisation.']},

  {t:'otherwise',kicker:'Part Three',h:'The art of living otherwise',p:['Most of us were handed a single script for a good life: achieve, acquire, optimise, repeat.','Living otherwise means noticing the script and quietly choosing differently. Not dropping out, but living in, with more of yourself present for it.']},

  {t:'shift',kicker:'The shift',h:'From managing a life to living one',p:['Optimising asks: how do I get more out of this?','Natural Wisdom asks: how do I actually meet this. This hour, this breath, this one unrepeatable life.'],quote:true},

  {t:'whyme',kicker:'Why me',h:'Three decades, one question',p:['I spent over thirty years as a martial arts coach, running programs in fifteen countries, working with everyone from Tier One Special Forces operators to airline crews. Then a physical breakdown ended that chapter and handed me the question I now work on with others.','I am a certified philosophical counselor, an accredited Fellow Coach, and I lead Philosophical Health International in the UK. But the work is simple: how can we flourish and stay deeply human inside the pressures of modern life?']},

  {t:'recap',kicker:'One thing to take',h:'You are not a project to be managed',p:['If you keep one idea from today, keep this.','The wisdom you have been searching for in the next app or framework is already closer than that. It arrives the moment you stop forcing and start feeling.'],lead:true},

  {t:'cta',kicker:'Your next step',h:'Begin with a conversation',p:['If any of this landed, the next step is not another course to finish. It is a conversation.','Book a free fifteen-minute connection call. We will talk about where you are, what feels off, and whether philosophy-inspired coaching is a fit for you. Most people begin with a short series of one-to-one sessions from there.'],cta:true,disclaimer:'This masterclass is offered for educational and reflective purposes only. It is not therapy, medical care, or mental-health treatment, and it makes no guarantee of any particular outcome. Philosophical coaching supports reflection and personal growth; results vary from person to person.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='title'?' title-slide':'')+(s.cta?' cta':'');
  let html='';
  html+='<span class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</span>';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){
    html+='<h1>'+s.h+'</h1>';
    if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
    if(s.credit) html+='<div class="credit">'+s.credit+'</div>';
  } else {
    html+='<h2>'+s.h+'</h2>';
    if(s.p) s.p.forEach((para,idx)=>{
      const cls=(s.quote&&idx===0)?'quote':(s.lead?'lead':'');
      html+='<p'+(cls?' class="'+cls+'"':'')+'>'+para+'</p>';
    });
    if(s.ul){html+='<ul>';s.ul.forEach(li=>html+='<li>'+li+'</li>');html+='</ul>';}
    if(s.disclaimer) html+='<div class="disclaimer">'+s.disclaimer+'</div>';
  }
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
