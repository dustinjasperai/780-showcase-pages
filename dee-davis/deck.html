<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intentional Leadership — a masterclass for construction project managers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131b1e;        /* their dark charcoal ground (brand.json, 18 uses) */
    --panel:#5c413f;     /* their dominant brown (brand.json, 30 uses) */
    --accent:#edca12;    /* their hi-vis safety yellow (brand.json header/footer) */
    --ink:#f4f1ea;
    --muted:#b9b2a6;
    --rule:#2a3539;
    --display:'Karla',system-ui,sans-serif;   /* their brand face */
    --serif:'Spectral',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0c1113;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:10px;padding:54px 52px;margin:0 0 20px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
  .eyebrow{font-family:var(--display);font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:800;font-size:33px;line-height:1.1;margin-bottom:16px}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:62ch}
  .sub{font-size:19px;line-height:1.55;color:var(--muted);max-width:60ch;margin-top:14px}
  .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.08;letter-spacing:-.01em}
  .kicker{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
  .num{font-family:var(--display);font-weight:800;font-size:15px;color:var(--bg);background:var(--accent);
    display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:7px;margin-bottom:20px}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;padding:11px 0 11px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  li:last-child{border-bottom:0}
  .panel{background:var(--panel);border-radius:8px;padding:26px 28px;margin-top:8px}
  .cred{font-size:18px;line-height:1.6;color:var(--ink)}
  .cred b{font-family:var(--display);font-weight:600;color:var(--accent)}
  .cta-line{font-family:var(--display);font-weight:800;font-size:18px;color:var(--bg);background:var(--accent);
    display:inline-block;padding:14px 26px;border-radius:8px;margin-top:22px}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:66ch;font-style:italic}
  .foot{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);position:absolute;right:30px;bottom:22px}
  @media(max-width:640px){.slide{padding:38px 26px}h1{font-size:34px}h2{font-size:26px}.big{font-size:30px}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S=[
  {t:'title',eyebrow:'Yellowstone Professional Education · Live masterclass',
   h1:'Intentional Leadership',
   lead:'How construction project managers stop being the bottleneck and start building teams that run the job.',
   foot:'With Dee Davis, CEM, LEED AP'},

  {t:'who',kicker:'Who this is for',
   h2:'You were the best in the field. So they made you the PM.',
   sub:'You can read a set of plans, run the equipment, and solve problems nobody else can. That is exactly why you got promoted.'},

  {t:'trap',kicker:'The trap',
   h2:'Now you are in meetings all day.',
   sub:'Your crew waits on you for every call. The schedule still slips. And the skills that made you great on site are not the ones the job is asking for anymore.'},

  {t:'hook',
   big:'You do not have a scheduling problem. You have a leadership problem. And nobody trained you for it.'},

  {t:'part',kicker:'Part one',h2:'Promoted for what you build. Judged for how you lead.',
   sub:'Technical skill got you here. It will not get your team there. The gap between a good field hand and a strong project manager is not more technical knowledge. It is people.'},

  {t:'part',kicker:'The autopilot trap',h2:'Most PMs lead on reflex.',
   sub:'React to the fire in front of you. Hold every decision yourself because it is faster. Skip the recognition because the next crisis is already here. It feels like control. It is the thing keeping your team small.'},

  {t:'framehead',eyebrow:'Part two · the framework',
   h1:'Intentional Leadership',
   lead:'Six principles that move you from reacting to leading on purpose. This is the method I coach one on one, built over 25 years on real jobs.'},

  {t:'p',num:'1',h2:'Self-Awareness',
   sub:'There is a small space between feeling something and acting on it. That space is where leadership lives. Most bad calls on a jobsite happen inside the first three seconds of a reaction.'},

  {t:'p',num:'2',h2:'Emotional Intelligence',
   sub:'Read your team, not just the schedule. People take direction differently. I teach PMs to use simple tools like DISC and Positive Intelligence to see how each person actually hears them.'},

  {t:'p',num:'3',h2:'Delegation as Development',
   sub:'Delegating is not offloading tasks. It is building the next leader. Ask yourself the honest question: am I holding onto this because I truly need to, or because letting go makes me uncomfortable?'},

  {t:'p',num:'4',h2:'Celebration and Recognition',
   sub:'High achievers blow past their own wins. Keep an evidence list. When you document what the team got right, you change what they do next, and you change how they see themselves on your job.'},

  {t:'p',num:'5',h2:'Rest and Recovery',
   sub:'Sustained performance requires recovery. A worn-out PM makes worse calls, communicates worse, and drags the whole crew down with them. Recovery is not a reward. It is part of the work.'},

  {t:'p',num:'6',h2:'Building Other Leaders',
   sub:'Here is the only real measure. Can the team solve problems without you in the room? Can someone else step forward and lead? When the answer is yes, the schedule stops living and dying on you.'},

  {t:'part',kicker:'Part three · the job after',h2:'A job that does not need you in every room.',
   sub:'A crew that makes the right call without waiting. A schedule that holds because the people holding it are growing. And a project manager who actually goes home.'},

  {t:'cred',kicker:'Why listen to me',h2:'I came up through the trades.',
   panel:'<p class="cred">Carpenter, then engineering, then project management, then owner\'s representation. <b>25 years</b> in commercial construction, much of it on large life-sciences, pharmaceutical, and healthcare builds worth hundreds of millions. <b>CEM, LEED AP BD+C.</b> I host <b>Management Under Construction</b>, and I coach project managers one on one through Yellowstone Professional Education.</p>'},

  {t:'shift',
   big:'The best PMs are not the ones who do the most. They are the ones who build a team that does not need them to.'},

  {t:'cta',eyebrow:'Where to go from here',
   h2:'Work with me, one on one.',
   sub:'If you want help putting Intentional Leadership to work on your own projects, that is exactly what my Project Manager coaching is for. Custom sessions built around the challenges on your job right now.',
   ctaLine:'Book a free intro consultation at yspe.co',
   disc:'This masterclass is educational. It shares a leadership method, not a guarantee. Results depend on your own projects, your team, and the work you put in.',
   foot:'Yellowstone Professional Education'}
];

const deck=document.getElementById('deck');
function esc(s){return s}
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let html='';
  if(s.eyebrow)html+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.kicker)html+=`<div class="kicker">${s.kicker}</div>`;
  if(s.num)html+=`<div class="num">${s.num}</div>`;
  if(s.h1)html+=`<h1>${s.h1}</h1>`;
  if(s.h2)html+=`<h2>${s.h2}</h2>`;
  if(s.big)html+=`<p class="big">${s.big}</p>`;
  if(s.lead)html+=`<p class="lead">${s.lead}</p>`;
  if(s.sub)html+=`<p class="sub">${s.sub}</p>`;
  if(s.panel)html+=`<div class="panel">${s.panel}</div>`;
  if(s.ctaLine)html+=`<div class="cta-line">${s.ctaLine}</div>`;
  if(s.disc)html+=`<p class="disc">${s.disc}</p>`;
  if(s.foot)html+=`<div class="foot">${s.foot}</div>`;
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
