<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak Fearlessly: CELPIP Speaking Tasks 3 &amp; 4 - A Masterclass with Aaron Nelson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aleo:wght@400;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eee9e3;        /* their secondary cream, as the deck ground */
    --panel:#faf7f4;     /* their body off-white, as slide panels */
    --cream:#f4efe9;     /* lighter cream accent panel */
    --ink:#554948;       /* their body/heading ink */
    --muted:#8a7d7b;
    --accent:#c6080d;    /* their exact CELPIP-red button/link */
    --rule:#e4ddd5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(85,73,72,.04)}
  .slide.accentbg{background:var(--accent);color:#fff;border-color:var(--accent)}
  .slide.cream{background:var(--cream)}
  .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
    color:var(--accent);margin-bottom:18px}
  .slide.accentbg .eyebrow{color:#ffd9d6}
  h1,h2{font-family:'Aleo',serif;line-height:1.1;font-weight:700}
  h1{font-size:46px;margin-bottom:18px}
  h2{font-size:34px;margin-bottom:16px}
  .sub{font-size:19px;color:var(--muted);max-width:40ch;line-height:1.5}
  .slide.accentbg .sub{color:#ffe7e5}
  .big{font-size:26px;line-height:1.4;max-width:30ch;font-family:'Aleo',serif}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.45;max-width:46ch}
  li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;
    border-radius:3px;background:var(--accent)}
  .score{font-family:'Aleo',serif;font-weight:700;color:var(--accent)}
  .foot{margin-top:26px;font-size:14px;color:var(--muted)}
  .brandtag{position:fixed;top:14px;right:18px;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .cta a{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;
    text-decoration:none;font-weight:600;padding:14px 26px;border-radius:9px;font-size:17px}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:52ch;line-height:1.5}
  .pagenum{font-size:12px;color:var(--muted);margin-top:28px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="brandtag">CELPIP Success</div>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A free live masterclass with Aaron Nelson',
  h:'Speak Fearlessly on the CELPIP',
  sub:'How to answer Speaking Tasks 3 and 4 with confidence, without memorizing a single template.'},

 {t:'audience',eyebrow:'Who this is for',
  h:'You are a newcomer to Canada, and the speaking section scares you',
  bullets:['You need a 7, 8, or 9 for PR, citizenship, or your license.',
    'You can hold a conversation, but the exam makes your mind go blank.',
    'You have tried memorizing templates and they let you down when the picture changed.']},

 {t:'trap',eyebrow:'The trap',
  h:'Templates feel safe. They are quietly capping your score.',
  sub:'A memorized script sounds robotic to a rater, and the moment the task does not fit the script, you freeze.'},

 {t:'reframe',accentbg:true,eyebrow:'The reframe',
  big:'The problem was never your English. It is that nobody taught you a calm way to think under 30 seconds of pressure.'},

 {t:'problem',eyebrow:'Part one: the real problem',
  h:'What actually happens in Speaking Task 3',
  bullets:['You get 30 seconds to plan and 60 seconds to describe a picture to someone who cannot see it.',
    'With a template in your head, you spend the 30 seconds trying to remember the script.',
    'The clock starts, the script does not fit, and your mind goes blank.']},

 {t:'problem',eyebrow:'Part one: the real problem',
  h:'Freezing is a planning problem, not a vocabulary problem',
  sub:'You already know the words. What you are missing is a repeatable way to decide what to say before the timer starts.'},

 {t:'framework',cream:true,eyebrow:'Part two: the method',
  h:'The Fearless Speaking method',
  bullets:['Brainstorm in 30 seconds, so you always know where to start.',
    'Divide and conquer the picture, so you never try to say everything.',
    'The secret weapon, so you never run out of things to say.',
    'Practice out loud in a mistake-friendly room, so the fear fades.']},

 {t:'pillar',eyebrow:'Pillar one',
  h:'Brainstorm in 30 seconds',
  bullets:['Pick two or three things in the picture you feel most confident describing.',
    'You do not need everything. You need a confident starting point.',
    'This is a decision you make on purpose, not a panic you survive.']},

 {t:'pillar',eyebrow:'Pillar two',
  h:'Divide and conquer',
  bullets:['Describe the picture in focused chunks: foreground, people, what is happening.',
    'Finish one chunk calmly before moving to the next.',
    'Trying to cover the whole picture at once is what makes you rush and stumble.']},

 {t:'pillar',eyebrow:'Pillar three',
  h:'The secret weapon',
  bullets:['A simple move that keeps you talking when you feel the blank coming.',
    'It buys you a breath and a next sentence, every time.',
    'This is the difference between a 6 answer and a 9 answer under pressure.']},

 {t:'pillar',eyebrow:'Pillar four',
  h:'Mistake-friendly practice',
  bullets:['You will never be put on the spot or shamed for a mistake here.',
    'Confidence is built by speaking out loud and being corrected kindly.',
    'This is 100 percent human coaching, not an app grading you.']},

 {t:'demo',accentbg:true,eyebrow:'Live, together',
  big:'In this masterclass you will try a real Speaking Task 3 out loud, and feel the difference between reciting and describing.'},

 {t:'result',eyebrow:'Part three: what changes for you',
  h:'From a 6 to a 9, in your own voice',
  bullets:['You walk in with a plan instead of a script.',
    'You sound like a person describing something, which is exactly what raters reward.',
    'The fear stops running the exam, and you do.']},

 {t:'result',eyebrow:'One more thing',
  h:'This works for listening too',
  sub:'The same calm, habit-first approach moves your listening band with ten honest minutes a day, not a weekend of cramming practice tests.'},

 {t:'why',cream:true,eyebrow:'Why learn this from me',
  h:'Aaron Nelson, CELPIP Success',
  bullets:['17 years teaching English, and a certified CELPIP trainer.',
    'I coach newcomers to Canada to speak English fearlessly.',
    'Host of The CELPIP Success Podcast, every week.']},

 {t:'why',eyebrow:'What makes this different',
  h:'No templates. No shame. Real human coaching.',
  sub:'I built CELPIP Success because newcomers deserve to feel confident speaking, not to feel lost, alone, and overwhelmed.'},

 {t:'recap',eyebrow:'Recap',
  h:'The Fearless Speaking method',
  bullets:['Brainstorm in 30 seconds.','Divide and conquer the picture.',
    'Use the secret weapon so you never run dry.','Practice out loud where mistakes are welcome.']},

 {t:'cta',eyebrow:'Your next step',
  h:'Keep going inside the CELPIP Success School',
  sub:'Join me for weekly live coaching, real speaking and writing feedback, and a community of newcomers working toward the same goal.',
  cta:'Join the CELPIP Success School',
  disclaimer:'This masterclass is for educational purposes only. Every learner is different and your results on the CELPIP depend on your own practice and preparation. No score is guaranteed.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.accentbg?' accentbg':'')+(s.cream?' cream':'');
  let html='';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h) html+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul>';}
  if(s.cta) html+='<div class="cta"><a href="https://membership.celpipsuccess.com/p/page-f0abd1b1">'+s.cta+'</a></div>';
  if(s.disclaimer) html+='<div class="disclaimer">'+s.disclaimer+'</div>';
  html+='<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
