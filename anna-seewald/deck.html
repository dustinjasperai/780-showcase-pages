<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calm Starts With You — a live masterclass with Anna Seewald</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe3;
    --panel:#fffdf7;
    --rule:#e7ddcb;
    --accent:#1f7a7d;
    --accent-soft:#48afb2;
    --ink:#2b2b2b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:22px;
    padding:64px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 10px 30px rgba(31,122,125,.06)}
  .kick{font-family:'Baloo 2';font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    font-size:.82rem;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Baloo 2';font-weight:700;font-size:2.9rem;line-height:1.1;color:var(--ink)}
  h2{font-family:'Baloo 2';font-weight:700;font-size:2.1rem;line-height:1.15;color:var(--ink)}
  .sub{font-size:1.2rem;margin-top:18px;max-width:40ch;color:#4a4a4a}
  .body{font-size:1.12rem;margin-top:16px;max-width:52ch}
  ul{margin-top:22px;list-style:none;max-width:54ch}
  li{position:relative;padding-left:30px;margin:14px 0;font-size:1.1rem}
  li:before{content:'';position:absolute;left:0;top:.55em;width:12px;height:12px;border-radius:50%;
    background:var(--accent-soft)}
  .big{font-size:2.3rem;font-family:'Baloo 2';font-weight:600;line-height:1.2;max-width:24ch}
  .part{background:var(--accent);color:#fff;border-color:var(--accent)}
  .part .kick{color:rgba(255,255,255,.8)}
  .part h2{color:#fff}
  .pill{display:inline-block;font-family:'Baloo 2';font-weight:600;background:rgba(72,175,178,.16);
    color:var(--accent);padding:6px 16px;border-radius:999px;font-size:.95rem;margin-bottom:10px}
  .disc{font-size:.82rem;color:#7a7368;margin-top:26px;max-width:56ch}
  .cta h2{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Anna Seewald', h:'Calm Starts With You',
    sub:'How to stay calm in the moments you usually snap, and raise a child who feels safe.'},
  {t:'who', kick:'Who this is for', h:'You love your kids. You still lose it.',
    body:'This is for the parent who reads the books, swears they will stay calm, and still ends the day flooded with guilt. You are not failing. You were never taught the part that actually works.'},
  {t:'trap', kick:'The daily loop', h:'The guilt loop',
    pts:['The morning you promise yourself today is different','The small thing that sets you off by 6pm','The yelling you hear come out of your own mouth','The apology at bedtime, and the promise again']},
  {t:'reframe', h:'The problem was never your child’s behavior.',
    sub:'It is what happens in you a half second before you react. That is the part no sticker chart can fix.'},
  {t:'part', kick:'Part one', h:'Why staying calm feels impossible'},
  {t:'why1', kick:'It is not willpower', h:'You cannot white-knuckle your way to calm',
    body:'Willpower runs out exactly when you need it most, at the end of a long day. If calm depended on trying harder, you would already have it. You try harder than anyone.'},
  {t:'why2', kick:'It is your nervous system', h:'Your body reacts before your mind can vote',
    body:'A meltdown, a whine, a spilled cup can trip your own stress response in a half second. You are not choosing to react. Your nervous system is, and it can be retrained.'},
  {t:'why3', kick:'And it is older than your kids', h:'You are parenting with a story you inherited',
    body:'The moments that flood you are often the ones that echo your own childhood. Naming that story is the first move in Anna’s trauma-informed approach, and it is where real change starts.'},
  {t:'part', kick:'Part two', h:'The approach that actually holds'},
  {t:'pillar', pill:'The CALM Formula', h:'Stay composed in the moment',
    body:'Anna’s signature four-step formula for catching yourself before you react, so you can respond on purpose instead of on autopilot. It has helped thousands of parents stay calm when it counts.'},
  {t:'pillar', pill:'The Freedom Frame', h:'Firm AND kind, at the same time',
    body:'Boundaries do not have to mean yelling, and kindness does not mean caving. The Freedom Frame is how you hold a limit with warmth, so your child feels both safe and free.'},
  {t:'pillar', pill:'RADICAL self-care', h:'Your wellbeing is the foundation, not a luxury',
    body:'A depleted parent cannot co-regulate a dysregulated child. Caring for yourself is not selfish here. It is the thing that makes every other tool work.'},
  {t:'pillar', pill:'Co-regulation', h:'You calm first. They borrow it.',
    body:'Children cannot regulate alone. When you steady your own body, you lend them your calm, and over time they build their own. This is how emotional safety is actually taught.'},
  {t:'part', kick:'Part three', h:'6pm in your kitchen, after this lands'},
  {t:'scene', kick:'The hard moment, handled', h:'6pm, everyone is melting down',
    body:'Instead of the old spiral, you catch the trigger, steady your breath, and hold the limit with a calm voice. The storm still comes. It just no longer takes you with it.'},
  {t:'repair', kick:'When you slip', h:'Repair is the skill, not perfection',
    body:'You will still have hard days. The difference is you learn to go back, reconnect, and repair. Children do not need a perfect parent. They need one who comes back.'},
  {t:'whyme', kick:'Why Anna', h:'25 years in the hard rooms',
    body:'Anna Seewald is a psychologist and educator who has spent 25-plus years with parents, children, and teachers, including children who had every reason not to feel safe. This work is not theory for her. It is her life’s practice.'},
  {t:'shift', kick:'The shift', h:'From reactive to responsive',
    pts:['Fewer power struggles and meltdowns','Calm that holds under pressure','Boundaries without the yelling','A home that feels connected again']},
  {t:'recap', kick:'The one idea', h:'Calm is not something you force. It is something you build, starting with you.',
    sub:'Heal the parent, and the connection with the child follows.'},
  {t:'cta', kick:'Your next step', h:'Come to the live masterclass',
    body:'Bring the moment you keep losing. Leave with the first moves of the CALM Formula and a way forward. If it resonates, book a free 15-minute session with Anna to find your next step.',
    disc:'This masterclass is for education and support only. No particular parenting result is guaranteed, and results vary from family to family. Nothing here is medical, psychological, or legal advice.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='part'?' part':'') + (s.t==='cta'?' cta':'');
  let html = '';
  if (s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if (s.pill) html += '<div class="pill">'+s.pill+'</div>';
  if (s.h && (s.t==='reframe'||s.t==='recap')) html += '<div class="big">'+s.h+'</div>';
  else if (s.h && s.t==='title') html += '<h1>'+s.h+'</h1>';
  else if (s.h) html += '<h2>'+s.h+'</h2>';
  if (s.sub) html += '<div class="sub">'+s.sub+'</div>';
  if (s.body) html += '<div class="body">'+s.body+'</div>';
  if (s.pts){ html += '<ul>'; for (const p of s.pts) html += '<li>'+p+'</li>'; html += '</ul>'; }
  if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
