<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead From Your Greatness, a masterclass with Urszula Lipsztajn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef4f1; --panel:#fbfdfc; --ink:#1c2b29; --accent:#569f97; --spark:#fd6e65;
    --muted:#5d6b68; --rule:#dce7e2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .stage{max-width:960px;margin:0 auto;padding:28px 20px 64px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:20px;
    padding:52px 48px;margin:18px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 10px 30px rgba(28,43,41,.05)}
  .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1,h2{font-family:'Archivo Black',system-ui,sans-serif;line-height:1.04;letter-spacing:-.01em}
  h1{font-size:52px}
  h2{font-size:34px}
  .sub{font-size:20px;color:var(--muted);margin-top:18px;max-width:40ch;line-height:1.5}
  .body{font-size:19px;margin-top:20px;max-width:52ch;line-height:1.62}
  ul{margin-top:22px;max-width:52ch}
  li{list-style:none;font-size:19px;line-height:1.5;padding:14px 0 14px 40px;position:relative;
    border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:6px;top:22px;width:14px;height:14px;
    border-radius:4px;background:var(--accent)}
  .arc{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap}
  .arc span{font-family:'Archivo Black',sans-serif;font-size:22px;padding:14px 22px;
    border-radius:14px;background:var(--bg);border:1px solid var(--rule)}
  .arc span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .big{font-family:'Archivo Black',sans-serif;font-size:40px;line-height:1.1;max-width:20ch}
  .big .s{color:var(--spark)}
  .big .a{color:var(--accent)}
  .note{margin-top:24px;font-size:15px;color:var(--muted);max-width:50ch;line-height:1.5}
  .num{font-family:'Archivo Black',sans-serif;color:var(--accent);font-size:16px;margin-bottom:10px}
  .cta h2{font-size:40px}
  .btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;
    font-weight:600;font-size:18px;padding:16px 30px;border-radius:12px;text-decoration:none}
  .disc{margin-top:30px;font-size:13px;color:var(--muted);max-width:56ch;line-height:1.5;
    border-top:1px solid var(--rule);padding-top:16px}
  .foot{margin-top:auto;padding-top:26px;font-size:14px;color:var(--muted)}
  @media(max-width:620px){.slide{padding:36px 26px}h1{font-size:38px}h2{font-size:28px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const S = [
  {t:'title',
    k:"A live masterclass with Urszula Lipsztajn",
    h:"Lead From Your Greatness",
    sub:"The four shifts that stop capable women from shrinking, and start them leading as they are."},

  {t:'promise',
    k:"What you will leave with",
    h:"One hour. Four shifts.",
    list:["A clear read on where you quietly shrink, and what it costs you and your team",
          "The order that actually works: calm, then clear, then strong",
          "A simple way to quiet the inner critic before the room does it for you",
          "Your Enneagram type as a leadership map, not a personality box"]},

  {t:'who',
    k:"Who this is for",
    h:"The capable woman who still doubts her value.",
    body:"You are a founder, a director, an executive. You have the track record. And you still over-explain, over-apologize, and wait to be chosen. This hour is for you."},

  {t:'trap',
    k:"The trap",
    h:"The competence trap.",
    body:"The more competent you are, the easier it is to believe you have to earn the room again every single day. So you work harder, say yes more, and take up less space. Competence was never the problem."},

  {t:'reframe',
    k:"The reframe",
    big:'You were never asked to <span class="s">change who you are</span>. You were asked to <span class="a">lead from it</span>.'},

  {t:'part',
    num:"Part one",
    h:"Why the loudest critic lives in the most capable leaders."},

  {t:'point',
    k:"The real problem",
    h:"It is not confidence. It is noise.",
    body:"Capable leaders are not missing ability. They are drowning it out, with a running commentary that second-guesses every decision at 11pm. You cannot lead clearly over that noise."},

  {t:'arc',
    k:"The order most training skips",
    h:"Calm comes first.",
    arc:["Calm","Clear","Strong"],
    note:"Clarity cannot land in a dysregulated nervous system, and strength without clarity is just force. Calm is the leadership skill nobody sells you. It comes first on purpose."},

  {t:'part',
    num:"Part two",
    h:"The SHINE method, and the map underneath it."},

  {t:'point',
    k:"The map",
    h:"Your Enneagram type is not a box.",
    body:"Using the iEQ9 Integrative Enneagram, we name your core strengths, your predictable blindspots, and your growth edge. Not to label you, to give you a map of exactly where your leadership leaks and where it shines."},

  {t:'pillar',
    num:"Pillar one",
    h:"Build your confidence.",
    body:"Lead from proven competence instead of the doubt sitting on top of it. We separate the evidence of what you have done from the story that says it is not enough."},

  {t:'pillar',
    num:"Pillar two",
    h:"Clarity in communication.",
    body:"Own your voice, and learn to say no without guilt. Clear is kind. We practice the sentences that stop the over-explaining before it starts."},

  {t:'pillar',
    num:"Pillar three",
    h:"Responsive decision-making.",
    body:"Decide from your values, not from the fastest way to make the discomfort stop. Responsive, not reactive. This is where calm becomes a visible leadership advantage."},

  {t:'pillar',
    num:"Pillar four",
    h:"Manage your inner critic.",
    body:"You will not silence it. You can stop handing it the microphone. We build the second voice, the grounded one, so it is there when the loud day comes."},

  {t:'part',
    num:"Part three",
    h:"What a grounded woman leader does differently."},

  {t:'point',
    k:"On the inside",
    h:"The commentary gets quiet.",
    body:"You walk into the room already belonging in it. Decisions take less out of you. You stop rehearsing the apology before you have even spoken."},

  {t:'point',
    k:"We as leaders",
    h:"Difference stops being a threat.",
    body:"When you can read your own type, you can read your team's. Conflict becomes information. Difference becomes the organization's strength instead of its friction."},

  {t:'why',
    k:"Why me",
    h:"Fifteen years of this work.",
    body:"I am Urszula Lipsztajn, a leadership coach to impact-driven leaders and entrepreneurs, iEQ9 certified, coaching from the west coast of Canada. Coaching is a guided process that holds a mirror up, so you can see what is already here and lead from it."},

  {t:'recap',
    k:"The whole hour, in three words",
    h:"Calm. Clear. Strong.",
    arc:["Calm","Clear","Strong"]},

  {t:'cta',
    k:"Your next step",
    h:"Let's see your leadership whole.",
    body:"If this hour landed, the next step is a conversation. Book a discovery call and we will map where you are shrinking, and build the path to leading from your greatness.",
    btn:"Book a discovery call",
    disc:"This masterclass is educational. No income, role, promotion, or result is guaranteed. Results vary and depend on your own effort, context, and circumstances."}
];

function render(){
  const stage=document.getElementById('stage');
  S.forEach(function(s){
    const d=document.createElement('section');
    d.className='slide'+(s.t==='cta'?' cta':'');
    let h='';
    if(s.num) h+='<div class="num">'+s.num+'</div>';
    if(s.k) h+='<div class="k">'+s.k+'</div>';
    if(s.big){ h+='<div class="big">'+s.big+'</div>'; }
    else if(s.h){ h+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>'); }
    if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
    if(s.body) h+='<p class="body">'+s.body+'</p>';
    if(s.arc){ h+='<div class="arc">'+s.arc.map(function(a,i){return '<span'+(i===0&&s.t==='arc'?' class="on"':(s.t==='recap'?' class="on"':''))+'>'+a+'</span>';}).join('')+'</div>'; }
    if(s.list){ h+='<ul>'+s.list.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'; }
    if(s.note) h+='<p class="note">'+s.note+'</p>';
    if(s.btn) h+='<a class="btn" href="https://www.urszula.co/connect">'+s.btn+'</a>';
    if(s.disc) h+='<p class="disc">'+s.disc+'</p>';
    d.innerHTML=h;
    stage.appendChild(d);
  });
}
render();
</script>
</body>
</html>
