<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Room for What Matters: A Masterclass with Andréa Jones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f3e9;        /* her warm cream ground (brand.json dominant bg) */
    --panel:#fffdf8;     /* card, a hair lighter than bg */
    --ink:#203b47;       /* her dominant deep teal (98 uses) */
    --ink-soft:#4a626c;  /* muted teal-ink for body */
    --rule:#9aafb5;      /* her pale teal-grey */
    --accent:#203b47;    /* single brand accent = deep teal */
    --accent-2:#173a48;  /* darker teal, used sparingly */
    --chip:#eef0e6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#e7e0d2;font-family:'Montserrat',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 64px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:54px 56px;margin:0 0 22px;min-height:520px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:attr(data-n);position:absolute;right:20px;bottom:16px;font-size:12px;letter-spacing:.12em;color:var(--rule)}
  .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:20px}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Playfair Display',serif;font-weight:700;font-size:38px;line-height:1.1;margin-bottom:18px}
  h3{font-family:'Playfair Display',serif;font-weight:500;font-size:25px;line-height:1.2;margin-bottom:10px}
  p{font-size:19px;line-height:1.6;color:var(--ink-soft);max-width:48ch;margin-bottom:14px}
  p.lead{font-size:22px;color:var(--ink)}
  .big{font-family:'Playfair Display',serif;font-size:30px;line-height:1.25;color:var(--ink);max-width:24ch;font-weight:500}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;color:var(--ink-soft);padding:12px 0 12px 34px;position:relative;border-top:1px solid var(--rule);max-width:52ch}
  li:first-child{border-top:none}
  li .num{position:absolute;left:0;top:12px;font-family:'Playfair Display',serif;color:var(--accent);font-weight:700}
  li b{color:var(--ink);font-weight:600}
  .title-slide{align-items:flex-start}
  .title-slide h1{font-size:60px}
  .byline{margin-top:26px;font-size:16px;color:var(--ink);letter-spacing:.02em}
  .byline span{color:var(--ink-soft)}
  .rule{width:64px;height:3px;background:var(--accent);margin:4px 0 22px;border:none}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .cardlet{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:18px 20px}
  .cardlet h3{font-size:19px;margin-bottom:6px;color:var(--ink)}
  .cardlet p{font-size:15.5px;margin:0;max-width:none}
  .chip{display:inline-block;background:var(--chip);color:var(--accent);border-radius:100px;padding:6px 16px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:22px}
  .stage{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .stage div{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px 16px;font-size:15px;color:var(--ink);font-weight:500}
  .stage div.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .quietnote{font-size:14px;color:var(--rule);margin-top:26px;letter-spacing:.02em}
  .disclaimer{font-size:13px;color:var(--ink-soft);margin-top:18px;max-width:60ch;line-height:1.5}
  .cta-steps li{border-top:1px solid var(--rule)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A FREE MASTERCLASS',h:'Make Room for<br>What Matters',sub:'A capacity-first marketing plan for busy business owners, so your marketing finally fits the time and energy you actually have.',by:'Andréa Jones',role:'Founder, OnlineDrea · Host of the Mindful Marketing Podcast'},

 {t:'lead',kicker:'Who this is for',h:'You run the business and the marketing.',p:['You are the owner, the strategist, the content team, and the person answering the inbox. Marketing is one more thing on a list that never ends.','This hour is for the owner who is doing a lot of marketing and still feels behind. We are going to make it smaller, not bigger.']},

 {t:'big',kicker:'The trap',big:'You have been told the answer is always more. Post more. Be on more platforms. Show up more. So you do. And it still feels like shouting into the void.'},

 {t:'reframe',kicker:'The reframe',h:'The problem is not effort.',p:['You are not behind because you are lazy. You are behind because you are running marketing that only works if nothing in your life ever gets in the way.','A plan that assumes unlimited time is a plan built to fail the first busy week. And every week is a busy week.'],note:'So we build the plan around your real capacity instead.'},

 {t:'part',chip:'PART ONE',h:'The cost of doing everything',p:['When every tactic is on the table, attention scatters. You post on five platforms, each one a little, and none of them get enough to actually work.','Busywork feels like progress. But "did I post today" is not the same question as "is my marketing bringing the right people closer."']},

 {t:'bullets',kicker:'What the everything-plan really costs',h:'Three quiet leaks',items:[['01','<b>Your energy</b>, spent evenly across things that do not all matter equally.'],['02','<b>Your clarity</b>, because with no map you cannot tell what is working.'],['03','<b>Your follow-through</b>, because a plan this big is the first thing to drop when life gets loud.']]},

 {t:'part',chip:'PART TWO',h:'A map for your marketing',p:['Before you decide what to do, you need to see the whole picture. Not a to-do list. A map.','I use one simple model to organize every piece of marketing a business does, so you can see where your attention is actually needed.']},

 {t:'ecosystem',kicker:'The framework',h:'The Marketing Ecosystem Model',p:['Every marketing action a business takes fits into one of five stages. When you can see the whole ecosystem, you stop guessing and start placing your effort where the gap is.'],stages:['Awareness','Nurture','Convert','Delight','Advocate']},

 {t:'bullets',kicker:'The five stages, plainly',h:'What each stage is for',items:[['1','<b>Awareness</b>:new people find you for the first time.'],['2','<b>Nurture</b>:the people who found you get to know and trust you.'],['3','<b>Convert</b>:a nurtured person becomes a customer.'],['4','<b>Delight</b>:that customer has a great experience and stays.'],['5','<b>Advocate</b>:a delighted customer sends you the next one.']]},

 {t:'lead',kicker:'How to read your own map',h:'Find the stage that is starving.',p:['Most overwhelmed owners are pouring energy into one stage and ignoring the one that is actually holding them back.','Endless awareness work with no nurture means strangers who never warm up. A great product with no advocate stage means you buy every customer from scratch. The map shows you where to aim.']},

 {t:'part',chip:'PART THREE',h:'Build the plan around your capacity',p:['Now the honest part. A map only helps if the plan you build from it survives a real week.','So before you choose tactics, you tell the truth about the time and energy you actually have. That is the whole method.']},

 {t:'bullets',kicker:'The capacity method',h:'Three questions before any plan',items:[['01','<b>What is the one outcome</b> you want your marketing to support this season?'],['02','<b>What is the real capacity</b> you have, the hours and energy that exist after the rest of your life?'],['03','<b>What is the single next step</b> that moves the starving stage forward inside that capacity?']]},

 {t:'twocard',kicker:'The tools',h:'Keep it honest, keep it light',cards:[['The ecosystem map','One page. You mark where your effort is going now and where the gap is. The map makes the decision for you.'],['The monthly number tracker','A few numbers you check once a month so you can read your marketing without spiraling, and without living in your analytics.']]},

 {t:'lead',kicker:'What a capacity-first week looks like',h:'Fewer things, done on purpose.',p:['Not five platforms done badly. One stage, one clear action, repeated at a pace you can actually keep.','When the plan fits your capacity, you stop starting over every Monday. Consistency stops being a willpower problem and becomes a design choice.']},

 {t:'big',kicker:'The shift',big:'Good marketing should leave room for you. When the plan fits your real life, you keep going. And consistent, aimed effort is what actually compounds.'},

 {t:'why',kicker:'Why listen to me',h:'I have been doing this the sustainable way for two decades.',p:['I am Andréa Jones. I have been creating online since 2004, hosting the Mindful Marketing Podcast since 2018, and helping thousands of business owners make marketing decisions that fit their real lives.','Twenty thousand owners open my emails each week for exactly this: practical marketing with room for the rest of your life.']},

 {t:'cta',kicker:'Your next step',h:'Make room for what matters.',steps:[['Start free','Take the Q4 Marketing Challenge and build one clear, capacity-first plan for the rest of the year.'],['Go deeper','Join the Mindful Marketing Lab for monthly workshops, weekly coworking, and a community building marketing that fits real life.']],disc:'This masterclass is educational. No specific marketing result or income is guaranteed. Results vary and depend on your business, your market, and your own follow-through.'}
];

function slide(s,i){
 const n=String(i+1).padStart(2,'0');
 let body='';
 if(s.t==='title'){
   body=`<div class="kicker">${s.kicker}</div><h1>${s.h}</h1><hr class="rule"><p class="lead">${s.sub}</p>
   <div class="byline">${s.by}<br><span>${s.role}</span></div>`;
   return `<section class="slide title-slide" data-n="${n}">${body}</section>`;
 }
 if(s.t==='lead'){body=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2>${s.p.map(x=>`<p>${x}</p>`).join('')}`;}
 if(s.t==='big'){body=`<div class="kicker">${s.kicker}</div><div class="big">${s.big}</div>`;}
 if(s.t==='reframe'){body=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2>${s.p.map(x=>`<p>${x}</p>`).join('')}<div class="quietnote">${s.note}</div>`;}
 if(s.t==='part'){body=`<div class="chip">${s.chip}</div><h2>${s.h}</h2>${s.p.map(x=>`<p>${x}</p>`).join('')}`;}
 if(s.t==='bullets'){body=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2><ul>${s.items.map(it=>`<li><span class="num">${it[0]}</span>${it[1]}</li>`).join('')}</ul>`;}
 if(s.t==='ecosystem'){body=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2>${s.p.map(x=>`<p>${x}</p>`).join('')}<div class="stage">${s.stages.map((st,k)=>`<div class="${k===1?'on':''}">${st}</div>`).join('')}</div>`;}
 if(s.t==='twocard'){body=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2><div class="grid">${s.cards.map(c=>`<div class="cardlet"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>`;}
 if(s.t==='why'){body=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2>${s.p.map(x=>`<p>${x}</p>`).join('')}`;}
 if(s.t==='cta'){body=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2><ul class="cta-steps">${s.steps.map(st=>`<li><b>${st[0]}.</b> ${st[1]}</li>`).join('')}</ul><div class="disclaimer">${s.disc}</div>`;}
 return `<section class="slide" data-n="${n}">${body}</section>`;
}
document.getElementById('deck').innerHTML=S.map(slide).join('');
</script>
</body>
</html>
