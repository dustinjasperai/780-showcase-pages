<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetising Soul-Aligned Clients | SoulAlign® with Anna Kitney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#f8f4ef;          /* warm ivory ground (annakitney.com light scheme) */
    --panel:#ffffff;
    --rule:#e7ddd2;
    --ink:#2a1016;         /* deep oxblood-black */
    --ink-soft:#5a4a4d;
    --accent:#5d071b;      /* her dominant oxblood */
    --gold:#c09b4f;        /* her antique gold */
  }
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Montserrat',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:28px;
  }
  .stage{ width:min(960px,96vw); }
  .slide{
    display:none; background:var(--panel);
    border:1px solid var(--rule); border-top:4px solid var(--accent);
    padding:64px 64px 58px; min-height:560px;
    position:relative; box-shadow:0 1px 0 rgba(42,16,22,.03);
  }
  .slide.on{ display:block; animation:fade .4s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .eyebrow{ font-size:12px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin-bottom:22px; }
  .eyebrow .mark{ color:var(--gold); }
  h1{ font-family:'Bodoni Moda',Didot,'Times New Roman',serif; font-weight:600; font-size:58px; line-height:1.06; letter-spacing:-.01em; margin-bottom:20px; }
  h2{ font-family:'Bodoni Moda',Didot,'Times New Roman',serif; font-weight:600; font-size:42px; line-height:1.12; margin-bottom:22px; }
  .lead{ font-size:19px; line-height:1.6; color:var(--ink-soft); max-width:60ch; }
  .big{ font-family:'Bodoni Moda',Didot,'Times New Roman',serif; font-size:40px; line-height:1.22; font-weight:500; max-width:24ch; }
  .big .hl{ color:var(--accent); font-style:italic; }
  ul{ list-style:none; margin-top:14px; }
  li{ font-size:19px; line-height:1.5; color:var(--ink-soft); padding:14px 0 14px 34px; border-bottom:1px solid var(--rule); position:relative; }
  li:last-child{ border-bottom:none; }
  li::before{ content:""; position:absolute; left:4px; top:22px; width:10px; height:10px; background:var(--gold); transform:rotate(45deg); }
  .pillar-no{ font-family:'Bodoni Moda',Didot,serif; font-size:16px; color:var(--gold); letter-spacing:.2em; margin-bottom:10px; }
  .hairline{ width:56px; height:2px; background:var(--gold); margin:0 0 26px; }
  .part{ display:flex; flex-direction:column; justify-content:center; min-height:560px; }
  .part .num{ font-family:'Bodoni Moda',Didot,serif; font-size:22px; letter-spacing:.3em; color:var(--gold); margin-bottom:16px; }
  .credit{ font-size:18px; line-height:1.6; color:var(--ink-soft); max-width:62ch; }
  .credit strong{ color:var(--ink); font-weight:600; }
  .cta h1{ margin-bottom:18px; }
  .cta .step{ display:inline-block; margin-top:8px; padding:14px 26px; border:1.5px solid var(--accent); color:var(--accent); font-weight:600; font-size:15px; letter-spacing:.04em; }
  .disclaimer{ margin-top:34px; font-size:12px; line-height:1.5; color:var(--ink-soft); max-width:66ch; font-style:italic; }
  .foot{ position:absolute; bottom:22px; left:64px; right:64px; display:flex; justify-content:space-between; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); border-top:1px solid var(--rule); padding-top:12px; }
  .foot .brand{ color:var(--accent); font-weight:600; }
  .nav{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:14px; align-items:center; font-family:'Montserrat',sans-serif; }
  .nav button{ background:var(--accent); color:#fff; border:none; width:42px; height:42px; font-size:18px; cursor:pointer; }
  .nav button:disabled{ opacity:.3; cursor:default; }
  .count{ font-size:13px; color:var(--ink-soft); letter-spacing:.1em; }
  @media (max-width:640px){
    .slide{ padding:40px 26px 54px; min-height:520px; }
    h1{ font-size:40px; } h2{ font-size:32px; } .big{ font-size:30px; } .lead{ font-size:17px; }
    .foot{ left:26px; right:26px; }
  }
</style>
</head>
<body>
<div class="stage"><div id="deck"></div></div>
<div class="nav">
  <button id="prev">&#8249;</button>
  <span class="count" id="count"></span>
  <button id="next">&#8250;</button>
</div>
<script>
const S = [
  {t:'title'},
  {t:'who'},
  {t:'promise'},
  {t:'trap'},
  {t:'hook'},
  {t:'part', num:'Part One', h:'Why the right clients never arrive'},
  {t:'problem'},
  {t:'cost'},
  {t:'part', num:'Part Two', h:'The SoulAlign® Method'},
  {t:'overview'},
  {t:'pillar', no:'Pillar One', h:'Identity &amp; Energetics', body:'Attraction starts with who you are being, not what you are posting. You embody the future self your soul-aligned clients are already looking for, calibrate to a higher frequency, and clear the upper limits that keep you playing small. This is the I AM work: you become the woman they are magnetised by.'},
  {t:'pillar', no:'Pillar Two', h:'The SoulAlign® Framework', body:'A repeatable method to coach anyone on anything, a fusion of powerful questions, energetics and spiritual process that collapses resistance and story fast. You stop reinventing the wheel with every client and start producing real breakthroughs, sometimes in a single session.'},
  {t:'pillar', no:'Pillar Three', h:'Soul-Client Attraction', body:'Now you call them in. You market to active buyers from desire and identity, not from pain or struggle, and you run the Soul Client Calling practice to attract hell-yes clients. You sell your gift with power instead of discounting it out of fear.'},
  {t:'part', num:'Part Three', h:'When soul-flow replaces the grind'},
  {t:'after'},
  {t:'practice'},
  {t:'whyme'},
  {t:'recap'},
  {t:'cta', disclaimer:'For education only. No income or result is guaranteed. Results vary with every coach and business, and depend on your own work, market and circumstances.'}
];

const foot = (label) => `<div class="foot"><span class="brand">SoulAlign® · Anna Kitney</span><span>${label}</span></div>`;

function render(s, i){
  const n = i+1;
  switch(s.t){
    case 'title': return `
      <div class="eyebrow">Live Masterclass <span class="mark">&bull;</span> SoulAlign®</div>
      <h1>Magnetising<br>Soul-Aligned Clients</h1>
      <div class="hairline"></div>
      <p class="lead">How soul-led coaches, healers and guides attract premium clients without the hustle and grind.</p>
      ${foot('With Anna Kitney')}`;
    case 'who': return `
      <div class="eyebrow">Who this is for</div>
      <h2>You are already powerful. Your income just does not match your mastery yet.</h2>
      <ul>
        <li>You are a coach, healer or guide with a real gift and real results.</li>
        <li>You are tired of hustling for clients who cannot pay what you are worth.</li>
        <li>You know there is a more aligned way to grow, and you are ready for it.</li>
      </ul>
      ${foot('Who this is for')}`;
    case 'promise': return `
      <div class="eyebrow">What you will leave with</div>
      <h2>In the next hour</h2>
      <ul>
        <li>Why working harder quietly repels your most aligned clients.</li>
        <li>The identity and energetic shift that makes you magnetic to them.</li>
        <li>A simple practice to start calling in hell-yes clients this week.</li>
      </ul>
      ${foot('The promise')}`;
    case 'trap': return `
      <div class="eyebrow">The world you were sold</div>
      <p class="big">You were told the answer is to hustle harder. Post more. Chase more calls. Discount until someone says yes.</p>
      ${foot('The trap')}`;
    case 'hook': return `
      <div class="eyebrow">The reframe</div>
      <p class="big">But the hustle does not attract soul-aligned clients. <span class="hl">It repels them.</span> Misaligned energy calls in misaligned clients.</p>
      ${foot('The reframe')}`;
    case 'part': return `
      <div class="part">
        <div class="num">${s.num}</div>
        <h1>${s.h}</h1>
        <div class="hairline"></div>
      </div>
      ${foot(s.num)}`;
    case 'problem': return `
      <div class="eyebrow">Part One</div>
      <h2>The problem was never your strategy</h2>
      <p class="lead">You can have the perfect funnel and still attract the wrong people. Clients are drawn to your frequency and your identity first. When those are set to scarcity, over-giving and fear of being seen, that is exactly who shows up: people who cannot commit, cannot pay, and cannot receive your work.</p>
      ${foot('The real problem')}`;
    case 'cost': return `
      <div class="eyebrow">Part One</div>
      <h2>And it costs you</h2>
      <ul>
        <li>Discounting and under-earning, because you fear the no.</li>
        <li>Over-explaining and over-delivering to prove your value.</li>
        <li>Burnout, as the grind replaces the calling that started all of this.</li>
      </ul>
      ${foot('The cost')}`;
    case 'overview': return `
      <div class="eyebrow">The method</div>
      <h2>Three shifts, in order</h2>
      <ul>
        <li><strong>Identity &amp; Energetics</strong>: become magnetic.</li>
        <li><strong>The SoulAlign® Framework</strong>: coach with power.</li>
        <li><strong>Soul-Client Attraction</strong>: call them in.</li>
      </ul>
      <p class="lead" style="margin-top:18px">You do not chase soul-aligned clients. You become the woman they are magnetised by, then you let the method do the rest.</p>
      ${foot('The SoulAlign method')}`;
    case 'pillar': return `
      <div class="pillar-no">${s.no}</div>
      <h2>${s.h}</h2>
      <div class="hairline"></div>
      <p class="lead">${s.body}</p>
      ${foot(s.no)}`;
    case 'after': return `
      <div class="eyebrow">Part Three</div>
      <h2>When the three shifts land</h2>
      <ul>
        <li>Your calendar fills with clients who make your heart happy and pay in full.</li>
        <li>You sell your potent work with power, no discounting, no convincing.</li>
        <li>You lead from soul-flow instead of hustle, and the growth becomes repeatable.</li>
      </ul>
      ${foot('What changes')}`;
    case 'practice': return `
      <div class="eyebrow">Try it now</div>
      <h2>The Soul Client Calling practice</h2>
      <p class="lead">Close your eyes and picture one soul-aligned client already working with you. Feel who you are being in that relationship: the certainty, the generosity, the ease. That identity is your point of attraction. Spend five minutes a day being her before you post, pitch or price anything. You are calibrating your frequency to the clients you are meant to serve.</p>
      ${foot('A simple practice')}`;
    case 'whyme': return `
      <div class="eyebrow">Why listen to me</div>
      <h2>Anna Kitney</h2>
      <p class="credit">A self-made seven-figure intuitive business coach and spiritual advisor, and the CEO of <strong>Bourgeon</strong>, a world-renowned Theta Healing® training organisation. Across <strong>18 years and five companies</strong> I have trained thousands of coaches, healers and therapists internationally to build soul-led businesses that thrive in any economy. My work is a blend of soul-led strategy, intuitive ability, energetic recalibration and mindset reprogramming.</p>
      ${foot('Credibility')}`;
    case 'recap': return `
      <div class="eyebrow">The whole thing in one line</div>
      <p class="big">Stop chasing. <span class="hl">Become magnetic,</span> coach with power, and call in the clients your soul is here to serve.</p>
      ${foot('Recap')}`;
    case 'cta': return `
      <div class="cta">
        <div class="eyebrow">Your next step</div>
        <h1>Ready to magnetise<br>your soul-aligned clients?</h1>
        <div class="hairline"></div>
        <p class="lead">If this landed, the next step is a clarity call. We will look at where your energy and your offers are misaligned, and map your path into SoulAlign® Business, my soul-led coaching program.</p>
        <div style="margin-top:22px"><span class="step">Book your clarity call &rarr;</span></div>
        <p class="disclaimer">${s.disclaimer}</p>
      </div>
      ${foot('Your next step')}`;
  }
}

let cur = 0;
const deck = document.getElementById('deck');
const countEl = document.getElementById('count');
const prevB = document.getElementById('prev');
const nextB = document.getElementById('next');
function show(){
  deck.innerHTML = `<div class="slide on">${render(S[cur], cur)}</div>`;
  countEl.textContent = (cur+1) + ' / ' + S.length;
  prevB.disabled = cur===0;
  nextB.disabled = cur===S.length-1;
}
prevB.onclick = ()=>{ if(cur>0){cur--;show();} };
nextB.onclick = ()=>{ if(cur<S.length-1){cur++;show();} };
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '){ if(cur<S.length-1){cur++;show();} }
  if(e.key==='ArrowLeft'){ if(cur>0){cur--;show();} }
});
show();
</script>
</body>
</html>
