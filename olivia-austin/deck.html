<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Premium Studio — The Studio Co. Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette (brand-derived from thestudioco.co, see 01-deep-research ## Palette)
     bg #f6ece2 (warm paper derived from their #f9f9f6 off-white, warmed toward the coral)
     panel #fdf7f2 (warm off-white) · ink/rule #1c1a17 · accent #ff7145 (their coral, verbatim) */
  :root{
    --bg:#f6ece2; --panel:#fdf7f2; --ink:#1c1a17; --rule:#1c1a17; --accent:#ff7145;
    --muted:#6b645c; --head:"Libre Caslon Display",Georgia,serif; --body:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid rgba(28,26,23,.1);border-radius:14px;
    padding:56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(28,26,23,.04)}
  .ey{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-size:52px;line-height:1.05;font-weight:400;margin-bottom:18px}
  h2{font-family:var(--head);font-size:38px;line-height:1.1;font-weight:400;margin-bottom:16px}
  p{font-size:19px;color:var(--ink);margin-bottom:12px;max-width:62ch}
  .sub{font-size:21px;color:var(--muted)}
  .accent{color:var(--accent)}
  .rule{height:3px;width:64px;background:var(--accent);border:0;margin:4px 0 24px}
  .tag{display:inline-block;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-top:28px}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',ey:'A live masterclass with The Studio Co.',h:'The Premium Studio',
  sub:'How to scale a design business past six figures without taking on more projects.'},
 {t:'who',ey:'Who this is for',h:'The booked-but-stuck designer',
  body:['You are a brand or website designer. The work is good and the referrals come in.',
        'But every month resets to zero, the calendar is full, and growth means more hours you do not have.',
        'This hour is about a different way up.']},
 {t:'trap',ey:'The trap',h:'More clients is not the answer',
  body:['The instinct is to take on more projects, add more revisions, say yes to more scope.',
        'That path has a ceiling, and it is your own capacity.',
        'A busy freelancer and a studio owner are not the same business.']},
 {t:'reframe',ey:'The reframe',h:'It is not your design. It is your positioning.',
  body:['Clients do not pay premium fees for prettier files.',
        'They pay for clarity, a signature process, and the confidence that you own the outcome.',
        'Premium is a decision you make before the next inquiry, not a reward you earn later.']},
 {t:'part',ey:'Part one',h:'The Six-Figure Foundation',
  sub:'Positioning and pricing, settled before anything else.'},
 {t:'content',ey:'Foundation',h:'Stop competing on price',
  body:['Define the one client you are built for, and price for the transformation, not the hours.',
        'One member who had been charging $2,000 for branding raised it to $4,000 and signed the client with no hesitation.',
        'The ceiling was never the market. It was the number on the proposal.']},
 {t:'part',ey:'Part two',h:'Scalable Systems',
  sub:'The backbone that lets the studio carry weight you used to carry alone.'},
 {t:'content',ey:'The signature method',h:'The One Concept Method',
  body:['Present one strong concept, not three safe ones.',
        'One concept, delivered through a branded presentation, minimizes revisions and shows expertise.',
        'Fewer rounds, higher fees, and a client who trusts your judgment.']},
 {t:'content',ey:'Experience',h:'The Luxury Client Experience',
  body:['The work is half of it. The experience around the work is what gets remembered and referred.',
        'A considered inquiry, sales call, and proposal process makes the price feel inevitable.',
        'Premium is felt at every touchpoint, not just in the final files.']},
 {t:'content',ey:'Revenue',h:'Recurring revenue for a studio',
  body:['Project income starts at zero every month. That is the freelancer trap in one line.',
        'Care plans, retainers, and ongoing design turn one-off projects into predictable income.',
        'Recurring revenue is what makes a studio calm instead of frantic.']},
 {t:'part',ey:'Part three',h:'Accelerate Your Growth',
  sub:'From solo operator to a studio that runs without you on every task.'},
 {t:'content',ey:'Beyond solo',h:'The systems that let you step back',
  body:['Market the studio on purpose, not only when the pipeline runs dry.',
        'Build a small team and a clear internal hierarchy so the work does not all route through you.',
        'The goal is a studio that runs without you on every task.']},
 {t:'picture',ey:'In practice',h:'A week in a premium studio',
  body:['One concept presented, approved the first time.',
        'A proposal that opens at a premium number, and closes.',
        'Recurring revenue already in the bank before the month begins.',
        'Time back, because the systems carry the load.']},
 {t:'why',ey:'Why learn this from us',h:'Olivia and Ali',
  body:['Olivia built Current Design Studio to multiple six figures. Ali built Amari Creative.',
        'Together that is 17+ years of running design studios, not theory from the sidelines.',
        'The Studio Co. is the playbook we used, taught the way we wish someone had taught us.']},
 {t:'recap',ey:'The path',h:'Foundation, Systems, Acceleration',
  body:['Foundation: premium positioning and profitable pricing.',
        'Systems: the One Concept Method, a luxury experience, recurring revenue.',
        'Acceleration: marketing, a small team, and your time back.']},
 {t:'cta',ey:'Your next step',h:'Scale your studio with us',
  body:['If this is the studio you want to build, the Studio Growth Accelerator is where we do it together.',
        'Apply to work with Olivia and Ali, and we will tell you exactly what to work on first based on your numbers and capacity.'],
  cta:'Apply at thestudioco.co',
  disc:'This masterclass is educational and shares the approach Olivia and Ali use in their own studios and with members. No income or result is guaranteed. Results vary with your market, effort, and experience.'}
];
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');d.className='slide';
  let h='';
  if(s.ey)h+=`<div class="ey">${s.ey}</div>`;
  if(s.t==='title'){h+=`<h1>${s.h}</h1><hr class="rule">`;}
  else{h+=`<h2>${s.h}</h2><hr class="rule">`;}
  if(s.sub)h+=`<p class="sub">${s.sub}</p>`;
  if(s.body){h+='<div>'+s.body.map(b=>`<p>${b}</p>`).join('')+'</div>';}
  if(s.cta)h+=`<div class="tag">${s.cta}</div>`;
  if(s.disc)h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;deck.appendChild(d);
});
</script>
</body>
</html>
