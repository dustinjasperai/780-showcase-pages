<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joining Your Autistic Child — a JOIN Program masterclass with Kat Kramlich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#180e3a;      /* harvested Circle indigo ground */
    --panel:#2c256f;   /* harvested Circle indigo panel */
    --rule:#4a3f8f;    /* light indigo rule */
    --accent:#4855bf;  /* harvested brand accent */
    --ink:#ffffff;
    --muted:#d2d7db;
    --head:'Lora',Georgia,serif;
    --body:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#120a2e;color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:48px 20px 96px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .slide .kick{font-family:var(--body);text-transform:uppercase;letter-spacing:.16em;
    font-size:13px;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:600;font-size:52px;line-height:1.05;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.1;margin-bottom:18px}
  h3{font-family:var(--head);font-weight:500;font-size:26px;line-height:1.2;margin-bottom:10px}
  p{font-size:20px;line-height:1.5;color:var(--muted);margin-bottom:14px;max-width:44ch}
  .lead{font-size:24px;color:var(--ink)}
  .big{font-family:var(--head);font-size:40px;line-height:1.15;color:var(--ink);font-style:italic}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;line-height:1.45;color:var(--muted);padding:12px 0 12px 34px;position:relative;
    border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:20px;width:14px;height:14px;border-radius:50%;
    background:var(--accent)}
  .pill{display:inline-block;background:var(--panel);border:1px solid var(--rule);border-radius:999px;
    padding:8px 16px;font-size:15px;color:var(--muted);margin:0 8px 8px 0}
  .sig{font-family:var(--head);font-style:italic;font-size:22px;color:var(--ink);margin-top:8px}
  .foot{font-size:14px;color:var(--muted);margin-top:26px}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:60ch;border-top:1px solid var(--rule);
    padding-top:16px}
  .num{font-family:var(--head);font-size:18px;color:var(--accent);margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">Loving Growth Collective &middot; The JOIN Program</div>
    <h1>Joining Your Autistic Child</h1>
    <p class="lead">A play-based path to real connection, from the Son-Rise tradition.</p>
    <div class="sig">with Kat Kramlich</div>
    <div class="foot">A free masterclass for parents who want to connect, not just manage.</div>
  `},
  {t:'who', cls:'', html:`
    <div class="kick">Who this is for</div>
    <h2>You love your child. You also feel shut out.</h2>
    <p>You have read the books. You have tried the charts and the rewards. Some days it works, most days it leaves you both exhausted.</p>
    <p>You do not want a program that treats your child as a problem to fix. You want a way in.</p>
  `},
  {t:'hook', cls:'', html:`
    <div class="kick">A reframe to start</div>
    <p class="big">"Your child is not giving you a hard time. They are having one."</p>
    <p>Everything in this hour rests on that one shift. Behavior is communication. Our job is to listen first.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="num">Part One</div>
    <h2>Why "managing" quietly stops working</h2>
    <p>Most autism support starts with compliance: get the behavior to stop, get the skill to appear. It can produce short wins and a child who slowly disappears.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">The managing loop</div>
    <h3>What managing teaches a child</h3>
    <ul>
      <li>That their signals are inconvenient, so they send fewer of them</li>
      <li>That connection is conditional on performing</li>
      <li>That the people they trust most are there to correct them</li>
    </ul>
    <p>None of this is a parent failing. It is the frame we were handed.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="num">Part Two</div>
    <h2>The JOIN approach</h2>
    <p>JOIN grows out of the Son-Rise Program: enter the child's world before you ask them into yours. Four moves, in order.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">Move one</div>
    <h3>Join their world</h3>
    <p>When your child lines up cars or flaps or repeats a sound, that is not a wall. It is a door. Sit down and do it too, with warmth and no agenda. You are telling them, in the only language that counts, that who they are is welcome.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">Move two</div>
    <h3>Support the senses first</h3>
    <p>A dysregulated nervous system cannot connect. Before anything else we learn how your child takes in light, sound, movement and touch, and we build a calmer room around that. Regulation is the ground everything else stands on.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">Move three</div>
    <h3>Connection and trust before anything else</h3>
    <p>No lesson lands without the relationship. We spend our first real effort on being safe, fun and predictable to be with, so that your child chooses to turn toward you. Connection is not the reward at the end. It is the starting line.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">Move four</div>
    <h3>Follow the motivation, through play</h3>
    <p>Children learn fastest inside what they already love. We use your child's own interests as the doorway to eye contact, language and flexibility, instead of dragging them toward ours. Play is not a break from the work. Play is the work.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">The shift in one picture</div>
    <h3>From managing to joining</h3>
    <ul>
      <li>Managing asks "how do I get my child to stop." Joining asks "what is my child telling me."</li>
      <li>Managing leads with the goal. Joining leads with the relationship.</li>
      <li>Managing is exhausting. Joining gives you your child back.</li>
    </ul>
  `},
  {t:'part', cls:'', html:`
    <div class="num">Part Three</div>
    <h2>On the floor, in your own home</h2>
    <p>You do not need a clinic, a timer or a perfect script. You need a few minutes, a little floor space and a willingness to follow.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">A real green light</div>
    <h3>Wait to be invited</h3>
    <p>When you join without pushing, children start to look over, to offer you a car, to glance up and smile. Those are green lights. That is your child opening the door from the inside, which is the only door that stays open.</p>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">Hard moments</div>
    <h3>Meet the storm with connection</h3>
    <p>Crying, whining and shutdown are not problems to end quickly. They are signals. We meet them calmly, stay close, and let the child feel that big feelings do not cost them our presence. The upset passes faster, and trust grows each time.</p>
  `},
  {t:'why', cls:'', html:`
    <div class="kick">Why learn this from me</div>
    <h3>Kat Kramlich</h3>
    <p>Senior Son-Rise Program Child Facilitator at the Autism Treatment Center of America, and for more than fifteen years a family coach who has sat on the floor with hundreds of children and the parents who love them.</p>
    <div class="pill">Son-Rise senior facilitator</div>
    <div class="pill">Founder, Inspired Spectrums</div>
    <div class="pill">Teacher, the JOIN Program</div>
  `},
  {t:'point', cls:'', html:`
    <div class="kick">What you walk away with</div>
    <h3>Three things to try tonight</h3>
    <ul>
      <li>Join one thing your child is already doing, with zero agenda</li>
      <li>Change one sensory detail in the room and watch what shifts</li>
      <li>Notice one green light and celebrate it out loud</li>
    </ul>
  `},
  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step together</div>
    <h2>Keep going with the JOIN Program</h2>
    <p>If this way of being with your child feels like home, the Loving Growth Collective is where we go deeper together, and you can book a one to one consultation with me to build a plan around your child.</p>
    <div class="sig">Book a consultation &middot; lovinggrowthcollective.com</div>
    <p class="disc">Educational content only. The JOIN Program is a relationship and development approach, not medical, psychological or behavioral treatment, and nothing here replaces care from your own providers. Every child is different and no specific outcome or result is guaranteed. Results vary.</p>
  `}
];
const deck = document.getElementById('deck');
S.forEach(s=>{
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls||'');
  d.innerHTML = s.html;
  deck.appendChild(d);
});
</script>
</body>
</html>
