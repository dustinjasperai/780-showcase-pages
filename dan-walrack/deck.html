<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Beyond The Hustle - The 5 C's of Roofing Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#F5F8FB;
    --panel:#E7EEF5;
    --rule:#D4DFEA;
    --ink:#16222E;
    --dim:#5E7183;
    --blue:#2E6F9E;
    --accent:#F26524;
    --chalk:#EAF2F8;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  #stage{width:100vw;height:100vh;position:relative;}
  .slide{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;justify-content:center;
    padding:8vh 9vw;
  }
  .slide.on{display:flex;}
  .kicker{
    font-family:'Anton',sans-serif;
    letter-spacing:.16em;text-transform:uppercase;
    font-size:clamp(12px,1.5vw,17px);
    color:var(--accent);
    margin-bottom:18px;
  }
  h1{
    font-family:'Anton',sans-serif;
    font-weight:400;line-height:1.02;letter-spacing:.005em;
    font-size:clamp(34px,6.6vw,88px);
    text-transform:uppercase;
  }
  h2{
    font-family:'Anton',sans-serif;
    font-weight:400;line-height:1.05;letter-spacing:.005em;
    font-size:clamp(28px,4.6vw,60px);
    text-transform:uppercase;
  }
  .sub{
    font-size:clamp(17px,2.1vw,27px);
    color:var(--dim);font-weight:500;
    margin-top:22px;max-width:26ch;line-height:1.4;
  }
  .lead{
    font-size:clamp(18px,2.3vw,30px);
    line-height:1.5;max-width:20ch;font-weight:600;
  }
  .body{
    font-size:clamp(16px,1.7vw,22px);
    line-height:1.6;color:var(--ink);max-width:34ch;margin-top:10px;
  }
  .body.wide{max-width:40ch;}
  ul{list-style:none;margin-top:20px;}
  li{
    font-size:clamp(15px,1.65vw,21px);
    line-height:1.45;color:var(--ink);
    padding:11px 0 11px 34px;position:relative;
    border-bottom:1px solid var(--rule);max-width:40ch;
  }
  li:last-child{border-bottom:none;}
  li::before{
    content:"";position:absolute;left:2px;top:18px;
    width:13px;height:13px;border-radius:2px 8px 2px 8px;
    background:var(--accent);
  }
  .pill{
    display:inline-block;font-family:'Anton',sans-serif;
    background:var(--accent);color:#fff;
    padding:4px 16px;border-radius:3px;letter-spacing:.06em;
    font-size:clamp(13px,1.5vw,18px);margin-bottom:20px;
  }
  .cnum{
    font-family:'Anton',sans-serif;color:var(--accent);
    font-size:clamp(50px,10vw,150px);line-height:.85;
  }
  .crow{display:flex;align-items:baseline;gap:26px;flex-wrap:wrap;}
  /* dark divider slides */
  .slide.dark{background:var(--blue);color:var(--chalk);}
  .slide.dark h1,.slide.dark h2{color:#fff;}
  .slide.dark .kicker{color:var(--chalk);opacity:.85;}
  .slide.dark .sub{color:var(--chalk);opacity:.9;}
  .slide.dark li{color:var(--chalk);border-color:rgba(255,255,255,.2);}
  .slide.title{background:var(--blue);color:#fff;}
  .slide.title .kicker{color:var(--chalk);}
  .slide.title .sub{color:var(--chalk);opacity:.95;max-width:30ch;}
  .track{display:flex;gap:9px;margin-top:30px;}
  .track span{width:15px;height:19px;background:var(--chalk);opacity:.55;
    border-radius:3px 9px 3px 9px;transform:rotate(-8deg);}
  .disc{font-size:clamp(12px,1.25vw,15px);color:var(--dim);
    margin-top:26px;max-width:52ch;line-height:1.45;font-style:italic;}
  .slide.dark .disc,.slide.title .disc{color:var(--chalk);opacity:.8;}
  .cta-step{font-family:'Anton',sans-serif;font-size:clamp(22px,3vw,40px);
    color:var(--accent);margin-top:18px;text-transform:uppercase;}
  .foot{position:absolute;bottom:3.4vh;left:9vw;right:9vw;
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--dim);letter-spacing:.03em;}
  .slide.dark .foot,.slide.title .foot{color:var(--chalk);opacity:.7;}
  .foot .brand{font-family:'Anton',sans-serif;letter-spacing:.1em;text-transform:uppercase;}
  #nav{position:fixed;bottom:0;left:0;right:0;height:4px;background:var(--rule);z-index:9;}
  #bar{height:100%;width:0;background:var(--accent);transition:width .25s;}
  .hint{position:fixed;bottom:14px;right:16px;font-size:11px;color:var(--dim);
    letter-spacing:.04em;z-index:9;}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><div id="bar"></div></div>
<div class="hint">&larr; / &rarr; to move</div>
<script>
const S=[
  {t:'title', kicker:'A Live Masterclass with Dan Walrack', h:'Go Beyond The Hustle', sub:"The 5 C's of Roofing Sales Without Pounding Doors All Day", track:true},

  {t:'promise', kicker:'What you walk away with', h:'One honest system', body:"By the end you will have a repeatable way to create roofing opportunities, own your calendar, and sell with your integrity intact. No scripts that make you cringe. No living door to door."},

  {t:'audience', kicker:'Who this is for', lead:'Roofing and exterior reps, and the owners who lead them.', body:"If you sell roofs and you are tired of the grind deciding your income and your family time, this hour is built for you. It works whether you are one rep or leading a team of them."},

  {t:'trap', kicker:'The trap', h:'The hustle treadmill', body:"Knock more doors. Work more hours. Push a little harder. It works, right up until it costs you your evenings, your weekends, and eventually your drive. The grind caps your income and your life at the same time."},

  {t:'reframe', kicker:'The reframe', h:'It was never your work ethic', body:"You are not lazy. You have out worked most people you know. The problem is that the only lever you were handed was volume, and volume has a ceiling. There is another lever."},

  {t:'mindset', kicker:'Be A Good Human', h:'Fix the rep before the sale', body:"I do not manipulate people and I do not waste their time. When you lead with honesty and real relationships, selling stops feeling like pressure and starts feeling like service. Transform the person first, and the numbers follow. This is a game of discipline, growth, and heart."},

  {t:'section', dark:true, kicker:'Part One', h:'Why the grind has a ceiling'},

  {t:'problem', kicker:'The math of the grind', h:'Income tied to hours', body:"When every sale depends on another door, your income is chained to your calendar. Good week, great month. Slow week, feast turns to famine. You cannot scale a business that only grows when you knock harder."},

  {t:'shift', kicker:'The shift', h:'Create, do not chase', body:"Opportunities you build come to you again and again. A door you knock is gone the moment you walk away. The reps who last stop chasing volume and start creating a flow of warm conversations. That is the whole point of the 5 C's."},

  {t:'section', dark:true, kicker:'Part Two', h:"The Five C's"},

  {t:'c', kicker:'Create Opportunities', num:'C1', h:'The non-door engine', list:["Insurance agents and adjusters who already know homeowners with damage","Networking, BNI, booster clubs, and faith communities","Facebook groups and referral partners","Creative branding: billboards, direct mail, a name people remember"]},

  {t:'c', kicker:'Control Your Schedule', num:'C2', h:'Own your calendar', list:["Plan the week before the week runs you","Simple systems and checklists for the repeatable work","Lean on tools and help so the business works for you","Protect the time that matters off the field"]},

  {t:'c', kicker:'Be Competitive', num:'C3', h:'Against others and yourself', body:"Compete with the best reps in your market, and compete with the person you were last month. Healthy competition keeps the standard high when motivation runs low."},

  {t:'c', kicker:'Consistency Is Key', num:'C4', h:'The daily discipline', body:"Consistency beats intensity. A short daily checklist, run every day, compounds into a pipeline of relationships and referrals. The reps who win are not the loudest. They are the most consistent."},

  {t:'c', kicker:'Challenge Yourself', num:'C5', h:'Keep raising the bar', body:"Comfort is where growth stops. Set the next goal, take the next hard rep, and keep stretching. Sustained effort over time is what separates a good season from a great career."},

  {t:'motif', dark:true, kicker:'Train Like a Dino', h:'The basics endure', sub:"Fundamentals do not go out of style. Master the simple things, run them every day, and they carry you when everything else changes.", track:true},

  {t:'section', dark:true, kicker:'Part Three', h:'A week that finally works'},

  {t:'week', kicker:'A week on the system', h:'Fewer doors, more roofs', body:"Mornings built around the relationships you are creating, not the streets you have not walked yet. Afternoons on the appointments those relationships set. Evenings at home, because the calendar is yours. The volume comes from the system, not from your body."},

  {t:'whyme', kicker:'Why listen to me', h:'24 years in the field', list:["24-plus years selling exterior restoration and roofing","20-plus years as a licensed insurance adjuster, the dual perspective","National speaker: the D2D Sales Summit and the SRC Summit","Built the Go Beyond The Hustle and Be A Good Human method"]},

  {t:'fit', kicker:'Honest fit', h:'Who this is and is not for', body:"This is for reps who want to build something that lasts and who are willing to work on themselves first. It is not a shortcut, and it is not for anyone looking to pressure people into a sale. If that is not you, this will not be a fit, and that is okay."},

  {t:'recap', kicker:'The whole system', h:'Be A Good Human, run the 5 C’s', list:["Create Opportunities beyond the door","Control Your Schedule","Be Competitive","Consistency Is Key","Challenge Yourself"]},

  {t:'cta', kicker:'Your next move', h:'Install it in your territory', step:'Book a 1:1 coaching call', body:"If you want help running the 5 C's in your own market, that is what my 1:1 coaching is for. We take the system, the Be A Good Human mindset, and your specific territory, and build a plan you can actually run.", disc:"This masterclass is educational. No specific income, sales, or earnings result is guaranteed; results vary with your effort, your market, and your skill. Nothing here is a promise of future performance."}
];

const stage=document.getElementById('stage');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'+(s.dark?' dark':'')+(s.t==='title'?' title':'');
  let h='';
  if(s.kicker) h+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.num){
    h+=`<div class="crow"><span class="cnum">${esc(s.num)}</span><h2>${esc(s.h)}</h2></div>`;
  } else if(s.h){
    h+= (s.t==='title')?`<h1>${esc(s.h)}</h1>`:`<h2>${esc(s.h)}</h2>`;
  }
  if(s.lead) h+=`<div class="lead">${esc(s.lead)}</div>`;
  if(s.sub) h+=`<div class="sub">${esc(s.sub)}</div>`;
  if(s.body) h+=`<div class="body wide">${esc(s.body)}</div>`;
  if(s.list){h+='<ul>';s.list.forEach(x=>h+=`<li>${esc(x)}</li>`);h+='</ul>';}
  if(s.step) h+=`<div class="cta-step">${esc(s.step)}</div>`;
  if(s.track) h+=`<div class="track"><span></span><span></span><span></span></div>`;
  if(s.disc) h+=`<div class="disc">${esc(s.disc)}</div>`;
  h+=`<div class="foot"><span class="brand">Go Beyond The Hustle</span><span>${i+1} / ${S.length}</span></div>`;
  d.innerHTML=h;
  stage.appendChild(d);
});
let cur=0;const slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('bar');
function show(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((el,i)=>el.classList.toggle('on',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';}
function go(d){show(cur+d);}
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
});
stage.addEventListener('click',e=>{go(e.clientX < window.innerWidth*0.32 ? -1 : 1);});
show(0);
</script>
</body>
</html>
