<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Mind Under Pressure · Dr. Cindra Kamphoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f8fc; --panel:#e7eff8; --rule:#cddbec;
    --acc:#17509a; --acc2:#2b7bb9; --ink:#14294f; --body:#37425c; --dim:#8792a8; --cream:#eef4fb;
  }
  html,body{height:100%}
  body{background:#e3ecf6;font-family:'Montserrat',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e3ecf6}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Spectral',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:75%;line-height:1.64;font-weight:400}
  .sub{font-family:'Spectral',serif;font-size:2.05vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#1b3563 0%,#0d1a33 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#1b3563 0%,#0d1a33 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Montserrat',sans-serif;color:#cfdcee;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc2);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.2%;bottom:8%;width:17vw;opacity:.92}
  .corner-vf{right:6.5%;bottom:7.5%;width:8.5vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(20,41,79,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">High Performance Mindset</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a steady pulse line inside a focus ring, drawn in the brand blue (composure under pressure) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <circle cx="60" cy="60" r="34" fill="none" stroke="#2b7bb9" stroke-width="1.6" opacity="0.4"/>
  <g fill="none" stroke="#17509a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 60 H44 L50 60 L56 42 L66 82 L73 60 L78 60 H98" opacity="0.95"/>
  </g>
  <circle cx="60" cy="60" r="4" fill="#17509a" opacity="0.85"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Mind Under Pressure',sub:'The mental skills elite performers use to stay composed and confident when everything is on the line.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You are excellent at the work. The biggest moments are where your mind, not your skill, decides the outcome.',body:'You have trained for years and you are genuinely good under normal conditions. But in the highest-stakes moments the mind can tighten: attention narrows, the second-guessing starts, and you perform a notch below what you are actually capable of. The skill is there. Getting clean access to it when it counts is the part no one trained.'},
 {t:'dark',title:'Talent gets you to the high-stakes moment. What you do with your mind decides what happens in it.'},

 {t:'section',idx:'Part One',title:'Why Pressure Costs Good Performers'},
 {t:'normal',k:'The body reacts before you choose to',title:'Under pressure, your physiology moves first.',body:'When the stakes spike, the body floods with stress chemistry: heart rate climbs, breathing shortens, attention collapses onto the threat. None of that is a character flaw. It is a trained system doing exactly what it evolved to do. The problem is that it narrows you at the precise moment you need to be widest and calmest.'},
 {t:'normal',k:'The overthinking spiral',title:'The mistake you keep replaying is the one still costing you.',body:'High performers rarely fail from not caring enough. They tighten from caring too much: replaying the last error, rehearsing the next one, managing a running commentary instead of the moment in front of them. Left untrained, that spiral shows up in the exact situations that matter most.'},
 {t:'dark',title:'The gap between your best and your worst is almost never skill. It is your mind under pressure.'},

 {t:'section',idx:'Part Two',title:'The Mental Performance System'},
 {t:'normal',k:'Beyond Grit: dominate the controllables',title:'Spend your attention only where it changes the outcome.',body:'The first practice of high performers is ruthless sorting: what here is inside my control, and what is not. You cannot control the outcome, the room, or the last mistake. You can control your preparation, your breath, your focus, and your next action. Trained performers pour their attention into the controllables and let the rest go, which is what keeps them steady when others spin.'},
 {t:'normal',k:'PCR: Pause, Consider, Respond',title:'A trained response beats a reflex every time.',body:'Pressure pushes you to react. The PCR tool puts a deliberate beat between the trigger and the action: Pause to interrupt the reflex, Consider what actually matters right now, then Respond on purpose. It is a small habit that decides whether your best training or your stress reaction runs the moment.'},
 {t:'normal',k:'The Confidence Habit',title:'Confidence is not a trait you are born with. It is a habit you train.',body:'The research is clear that confidence is built, not bestowed. It is the accumulation of small daily practices: how you talk to yourself, what evidence you count, how you recover from a miss. Treat confidence as a habit and it stops being weather that happens to you and becomes something you can build on purpose, before the high-stakes moment arrives.'},
 {t:'normal',k:'The 5 Cs: own the moment',title:'Courage, confidence, commitment, composure, concentration.',body:'Mental toughness is not gritting your teeth. It is five trainable qualities working together, with composure and concentration as the ones that hold under real pressure. Own the moment and choose the emotion that serves you, and you meet the biggest situations already prepared instead of hoping to feel ready.'},
 {t:'dark',title:'Composure is not the absence of pressure. It is a trained response to it.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Mind Is Trained'},
 {t:'normal',k:'The performer this builds',title:'Steadier when it counts, faster to recover, and yourself in the biggest moments.',body:'When the mind is trained, the high-stakes moment stops shrinking you. You stay wide and calm where you used to tighten, you let go of a mistake in seconds instead of carrying it, and you perform to your actual training when the pressure is highest. Nothing about the difficulty changes. Your relationship to it does.'},
 {t:'dark',title:'The goal was never to feel less pressure. It was to perform inside it.'},
 {t:'normal',k:'Why Dr. Cindra Kamphoff',title:'A sport-and-performance psychologist who trains elite performers, from the field to the boardroom.',body:'Dr. Cindra Kamphoff is a Certified Mental Performance Consultant with nearly twenty years of research and coaching. She has trained NFL Pro-Bowl athletes, Olympians, and championship teams, and has brought the same mental-performance work to leaders inside organizations like the Mayo Clinic Health System and Verizon. She is the author of Beyond Grit and The Confidence Habit, and hosts the High Performance Mindset podcast, past two million downloads.'},

 {t:'section',idx:'Your Next Step',title:'Train the Mind That Performs Under Pressure'},
 {t:'normal',k:'Keep going with Cindra',title:'The full system, coached, so it holds when the stakes are highest.',body:'The practices in this masterclass are the foundation. In coaching they become yours: applied to your real high-stakes moments, built into daily habits, and reinforced until composure and confidence are your trained default. Start with the free 10 Practices, and book a call when you are ready to build it in.'},
 {t:'cta',title:'Ready to train the mind that performs under pressure?',body:'Take the next step with Dr. Cindra Kamphoff.',chips:['Get the free 10 Practices','Book a call with Cindra'],disc:'Educational content on mental performance and mindset. No specific result or outcome is guaranteed. Individual results vary by person, role, and circumstance.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">High Performance <b>Mindset</b> · Dr. Cindra Kamphoff</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
