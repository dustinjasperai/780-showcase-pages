<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transition Is a Contact Sport - a live masterclass with Bernard Bergan</title>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16241d; --panel:#1f3228; --rule:#35503f; --accent:#c9a24a;
    --ink:#eef2ec; --muted:#a7b5aa; --head:'Zilla Slab',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:46px 44px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;margin-bottom:8px}
  h3{font-family:var(--head);font-weight:600;font-size:22px;color:var(--accent)}
  p{font-size:19px;color:var(--ink);margin-top:14px;max-width:46ch}
  p.lead{font-size:22px;color:var(--muted)}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.1}
  ul{list-style:none;margin-top:18px;display:grid;gap:12px}
  li{font-size:19px;padding-left:28px;position:relative;color:var(--ink);max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:3px;background:var(--accent)}
  .num{font-family:var(--head);font-weight:700;font-size:15px;color:var(--bg);background:var(--accent);
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .part{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
  .foot{position:absolute;bottom:18px;left:44px;right:44px;display:flex;justify-content:space-between;
    font-size:12px;color:var(--muted);letter-spacing:.04em}
  .quote{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.25;max-width:24ch}
  .cal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
  .cal div{border:1px solid var(--rule);border-radius:10px;padding:16px;text-align:center}
  .cal .n{font-family:var(--head);font-weight:700;font-size:28px;color:var(--accent)}
  .cal .s{font-size:13px;color:var(--muted);margin-top:6px}
  .disc{font-size:14px;color:var(--muted);max-width:60ch;margin-top:20px;border-top:1px solid var(--rule);padding-top:16px}
  .page{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass', h:'Transition Is a Contact Sport',
   p:'The plan nobody gave you before you ETS. Hosted live by Bernard Bergan, US Army veteran.'},
  {t:'promise', kick:'What you leave with', h:'By the end of this live session you will have',
   items:['A clear read on what you are actually worth in the civilian market, before you touch a resume.',
          'The three moves that turn separation from a checklist into a campaign you run.',
          'Your own next mission, written down, so Monday after terminal leave has a plan.']},
  {t:'who', kick:'Who this is for', h:'If you are 6 to 24 months from the uniform',
   p:'This is for the service member who is about to separate, or recently did, and feels the ground shifting. You led people and real missions. Now the orders stop coming. That is the moment this session is built for.'},
  {t:'trap', kick:'The trap', h:'The checklist feels like progress',
   items:['Update the resume.','Build the LinkedIn.','Sit the TAP class.','Apply to fifty jobs.'],
   p:'You can tick every box and still have no plan for who you are on Monday. A checklist is motion. It is not a campaign.'},
  {t:'cost', kick:'The cost of winging it', h:'What happens when there is no plan',
   p:'The jump gets treated like paperwork, so the hardest transition of your life gets the least preparation. The common outcomes are underemployment, a borrowed identity, and the quiet sense that your best mission is behind you. It does not have to go that way.'},
  {t:'reframe', kick:'The reframe', big:'Nobody hands you your next mission.',
   p:'The transition is the hardest operation you will ever run, with the least support and the highest personal stakes. So you stop waiting for orders, and you run it like one.'},
  {t:'part', part:'Part One', h:'Why the jump is so hard'},
  {t:'problem', kick:'The core problem', h:'You were trained to execute, not to self-assign',
   p:'The military is built on assigned missions, clear chains, and shared language. Civilian life assigns you nothing and translates none of it. The gap is not your resume. The gap is that no one is handing you the mission anymore, and nobody taught you to write your own.'},
  {t:'part', part:'Part Two', h:'The method: a contact sport'},
  {t:'pillar', num:'1', h3:'Train for it. Full contact.',
   p:'Transition is active, not something that happens to you while you wait out terminal leave. You prepare, you rep it, you take hits, you adjust. You go take the next mission rather than hoping it is handed to you.'},
  {t:'pillar', num:'2', h3:'Self-assess before the jump.',
   p:'Before the resume, before the applications, you do an honest inventory: what you led, what you carried, what you are genuinely worth out here. You walk in from strength instead of scrambling, because you already know the answer to the only question that matters.'},
  {t:'pillar', num:'3', h3:'Build your own mission.',
   p:'The uniform gave you purpose on a schedule. Civilian life will not. So you define the next mission yourself, in writing, and you lead toward it. Transition is not the end of service. It is stepping into civilian leadership.'},
  {t:'quote', kick:'The thesis', q:'You ran logistics in a war zone. The hard part was never the resume. It is deciding who you are on Monday, and then going to take it.'},
  {t:'part', part:'Part Three', h:'Running the campaign, not the checklist'},
  {t:'playbook', kick:'The 90 day campaign', h:'Run it like an operation',
   cal:[['90','map your worth'],['60','write the mission'],['30','interviews, from strength'],['Day 1','who you are now']],
   p:'Each window has one objective, not a pile of tasks. That is the difference between a checklist and a campaign.'},
  {t:'whyme', kick:'Why listen to me', h:'Bernard Bergan',
   p:'US Army veteran, speaker, and author of Transition: A Contact Sport. Through the Veterans Leadership Blog and the Veterans Speaker Series I have sat with hundreds of veterans and leaders on exactly this jump. I built this session from that work, and from my own transition out of the uniform.'},
  {t:'cta', kick:'Your next step', h:'Run your transition like the mission it is',
   p:'Stay to the end of the live session, take the self-assessment with you, and bring one question about your own jump. Keep going at BernardBergan.com.',
   disc:'This masterclass is educational and reflects one veteran's experience and framework. It is not career, legal, or financial advice. Results vary from person to person and no specific outcome, job, or income is promised or guaranteed.'}
];

const deck = document.getElementById('deck');
const foot = (i)=>`<div class="foot"><span>Transition Is a Contact Sport</span><span class="page">${i+1} / ${S.length}</span></div>`;
S.forEach((s,i)=>{
  let inner='';
  const k = s.kick?`<div class="kick">${s.kick}</div>`:'';
  if(s.t==='title'){ inner = `${k}<h1>${s.h}</h1><p class="lead">${s.p}</p>`; }
  else if(s.t==='promise'||s.t==='trap'){ inner = `${k}<h2>${s.h}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>${s.p?`<p>${s.p}</p>`:''}`; }
  else if(s.t==='who'||s.t==='cost'||s.t==='problem'||s.t==='whyme'){ inner = `${k}<h2>${s.h}</h2><p>${s.p}</p>`; }
  else if(s.t==='reframe'){ inner = `${k}<div class="big">${s.big}</div><p>${s.p}</p>`; }
  else if(s.t==='part'){ inner = `<div class="part">${s.part}</div><h2 style="margin-top:14px">${s.h}</h2>`; }
  else if(s.t==='pillar'){ inner = `<div class="num">${s.num}</div><h3>${s.h3}</h3><p>${s.p}</p>`; }
  else if(s.t==='quote'){ inner = `${k}<div class="quote">${s.q}</div>`; }
  else if(s.t==='playbook'){ inner = `${k}<h2>${s.h}</h2><div class="cal">${s.cal.map(c=>`<div><div class="n">${c[0]}</div><div class="s">${c[1]}</div></div>`).join('')}</div><p>${s.p}</p>`; }
  else if(s.t==='cta'){ inner = `${k}<h2>${s.h}</h2><p>${s.p}</p><div class="disc">${s.disc}</div>`; }
  deck.insertAdjacentHTML('beforeend', `<section class="slide">${inner}${foot(i)}</section>`);
});
</script>
</body>
</html>
