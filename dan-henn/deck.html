<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Tax Prep to Taxpayer Representative — Dan Henn, CPA, CTR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f0f8;        /* pale federal-blue ground, a low-saturation tint of their #0066cc on white */
    --panel:#ffffff;     /* their page bg */
    --ink:#1f2733;       /* charcoal, from their #333333 headings */
    --muted:#5b6672;     /* from their #666666 body */
    --accent:#0066cc;    /* their exact link color */
    --deep:#0b3a66;      /* darker shade of the same federal blue */
    --rule:#d7dee7;
    --head:"Spectral",Georgia,serif;
    --body:"Public Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.45}
  .deck{max-width:1120px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 60px;margin:0 0 26px;min-height:560px;position:relative;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 1px 0 rgba(31,39,51,.04)}
  .tag{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin:0 0 18px}
  .slide h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.06;margin:0 0 18px}
  .slide h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.1;margin:0 0 20px}
  .slide h3{font-family:var(--head);font-weight:600;font-size:25px;margin:22px 0 6px}
  .lead{font-size:21px;color:var(--muted);max-width:42em}
  p{font-size:18px;max-width:40em}
  .big{font-size:26px;line-height:1.35;max-width:36em}
  ul{margin:14px 0 0;padding:0;list-style:none;max-width:44em}
  ul li{position:relative;padding:11px 0 11px 34px;border-bottom:1px solid var(--rule);font-size:18px}
  ul li:last-child{border-bottom:0}
  ul li:before{content:"";position:absolute;left:0;top:18px;width:14px;height:14px;
    border:2px solid var(--accent);border-radius:3px}
  ul li b{font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
  .box{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
  .box .n{font-family:var(--head);font-size:30px;font-weight:700;color:var(--accent)}
  .notice{border-left:4px solid var(--accent);background:var(--bg);padding:16px 22px;border-radius:0 10px 10px 0;margin-top:14px}
  .ribbon{position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,var(--deep),var(--accent))}
  .foot{position:absolute;bottom:22px;left:60px;right:60px;display:flex;justify-content:space-between;
    font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
  .center{text-align:center;align-items:center}
  .center .lead,.center p{margin-left:auto;margin-right:auto}
  .disc{font-size:13.5px;color:var(--muted);max-width:52em;margin-top:16px}
  .cta-steps{font-size:20px;margin-top:10px}
  .cta-steps li:before{border-radius:50%}
  .kpi{font-family:var(--head);font-size:64px;font-weight:700;color:var(--accent);line-height:1}
  @media(max-width:760px){.slide{padding:34px 26px;min-height:0}.slide h1{font-size:34px}.slide h2{font-size:27px}.grid2{grid-template-columns:1fr}.foot{position:static;margin-top:26px;left:0;right:0}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", cls:"center", html:`
    <div class="ribbon"></div>
    <p class="tag">A Tax Resolution Academy Masterclass</p>
    <h1>From Tax Prep to Taxpayer Representative</h1>
    <p class="lead">How to add year round IRS resolution income to a seasonal practice, and earn the credential that proves you can do the work.</p>
    <div class="foot"><span>Dan Henn, CPA, CTR</span><span>Tax Resolution Academy</span></div>
  `},

  {t:"who", html:`
    <p class="tag">Who this is for</p>
    <h2>You already have the license. You are leaving the best work on the table.</h2>
    <p class="big">This is for the CPA, EA, or tax attorney who runs a solid prep practice, works brutal hours from January to April, and then watches revenue fall off a cliff in May.</p>
    <div class="notice"><p style="margin:0">If you have ever had a client open an IRS notice in front of you and ask "what do I do now," you already have the demand. You just have not built the practice to meet it.</p></div>
  `},

  {t:"trap", cls:"center", html:`
    <p class="tag">The trap</p>
    <h2>Prep is a commodity. Representation is a relationship.</h2>
    <p class="lead">Software, storefronts, and the client down the street all compete with you on price for the same 1040. Nobody shops on price when the IRS is taking their paycheck.</p>
  `},

  {t:"reframe", html:`
    <p class="tag">The reframe</p>
    <h2>The notice your client fears is the opportunity you have been trained for.</h2>
    <p>When someone owes the IRS, the value of proper representation is enormous. They are not hiring a tax preparer. They are hiring protection for their finances, their future, and their peace of mind.</p>
    <p class="big" style="color:var(--deep)">Your clients are already receiving these letters. The only question is whether they bring them to you, or to a national firm that has never met them.</p>
  `},

  {t:"cliff", html:`
    <p class="tag">The pattern</p>
    <h2>Every prep-only practice has the same shape.</h2>
    <p>A wall of revenue from January to April, then a long quiet valley. You spend the busy season too slammed to sell anything, and the slow season with nothing new to sell.</p>
    <div class="grid2">
      <div class="box"><h3 style="margin-top:0">The prep-only year</h3><p style="margin:0">One hard season, one long drought, and fees that reset to zero every January.</p></div>
      <div class="box"><h3 style="margin-top:0;color:var(--accent)">The representation year</h3><p style="margin:0">Collections cases arrive year round, priced on value, with recurring protection plans underneath.</p></div>
    </div>
  `},

  {t:"two-roads", cls:"center", html:`
    <p class="tag">Two roads from the same license</p>
    <h2>Preparer or representative.</h2>
    <p class="lead">Same credential behind you. One road competes for 1040s on price. The other represents people in front of the IRS and is paid for the outcome. This masterclass is the map to the second road.</p>
  `},

  {t:"part1", cls:"center", html:`
    <div class="ribbon"></div>
    <p class="tag">Part One</p>
    <h1>The problem is not skill. It is scope.</h1>
    <p class="lead">You can learn the case work. What stops most tax pros is not knowing the map: which cases, which path, and what to charge.</p>
  `},

  {t:"map", html:`
    <p class="tag">Part Two, the method</p>
    <h2>The taxpayer representation map</h2>
    <p>Every IRS collections case resolves down one of a handful of named paths. Know the map and you can take any case that walks in.</p>
    <ul>
      <li><b>Offers in Compromise</b> settling a debt for less than the balance</li>
      <li><b>Installment agreements</b> structured payment plans that stop enforcement</li>
      <li><b>Penalty abatement</b> removing penalties for reasonable cause</li>
      <li><b>Innocent and injured spouse relief</b></li>
      <li><b>Liens and levies</b> releasing and preventing enforcement actions</li>
      <li><b>941 collections and Trust Fund Recovery Penalties</b> the highest stakes work</li>
    </ul>
  `},

  {t:"qualify", html:`
    <p class="tag">The method</p>
    <h2>It starts with the financial analysis, not the form.</h2>
    <p>The single skill that separates a representative from a preparer is reading a taxpayer's finances the way the IRS reads them. Individual Financial Analysis, built on Form 433, tells you exactly what the IRS can and cannot collect.</p>
    <div class="notice"><p style="margin:0">Once you can run that analysis, you already know which path on the map the case belongs on, before you ever pick up the phone with Collections.</p></div>
  `},

  {t:"first-case", html:`
    <p class="tag">The method</p>
    <h2>What a first case actually looks like</h2>
    <p>You do not need a hundred cases to start. You need one, run properly, end to end.</p>
    <ul>
      <li><b>Intake</b> pull the account transcripts and read where the client really stands</li>
      <li><b>Analysis</b> run the financial analysis to see what the IRS can collect</li>
      <li><b>Path</b> match the facts to a resolution on the map</li>
      <li><b>Resolve</b> file, negotiate, and close the case with the client protected</li>
    </ul>
    <div class="notice"><p style="margin:0">One clean case gives you the template, the confidence, and the first fee that is not tied to a tax return.</p></div>
  `},

  {t:"collections", html:`
    <p class="tag">The specialty</p>
    <h2>941 collections is where the need is greatest and the field is thinnest.</h2>
    <p>Payroll tax cases carry personal liability through the Trust Fund Recovery Penalty, which terrifies business owners and keeps most generalists away. That is exactly why it is the most defensible, highest value corner of the practice.</p>
    <p class="big">Fewer competitors. Higher stakes. Clients who cannot afford to shop on price.</p>
  `},

  {t:"pricing", html:`
    <p class="tag">The economics</p>
    <h2>The price is the price. Stop billing by the hour.</h2>
    <p>Reframe your fee in terms of the result. If a client is facing a large penalty and you settle it, your fee is a fraction of what you saved them. That is not a cost to them. It is a bargain.</p>
    <div class="grid2">
      <div class="box"><div class="n">$3k to $5k</div><p style="margin:6px 0 0">a starting retainer, by the Academy's pricing doctrine, before the work begins</p></div>
      <div class="box"><div class="n">Flat, not hourly</div><p style="margin:6px 0 0">priced on the outcome, so your best work is never punished with a smaller invoice</p></div>
    </div>
  `},

  {t:"leverage", html:`
    <p class="tag">The economics</p>
    <h2>The $10 hour and the $250 hour</h2>
    <p>Take the income you want, divide by two thousand, then by four. That is roughly your true hourly rate for the work only you can do. Everything below it belongs to a trained assistant or a template, not to you.</p>
    <p class="big" style="color:var(--deep)">A representation practice runs on leverage. The owner does the strategy. The system does the rest.</p>
  `},

  {t:"recurring", html:`
    <p class="tag">The economics</p>
    <h2>Build income that does not stop in April.</h2>
    <p>Audit protection and IRS account monitoring turn your existing prep clients into a recurring revenue line. Offer it to the clients you already serve and the off season stops being a cliff.</p>
    <div class="notice"><p style="margin:0">Dan's own worked example: if 200 prep clients each add a modest audit protection plan, that is meaningful recurring revenue from clients you already have, with no new acquisition.</p></div>
  `},

  {t:"part3", cls:"center", html:`
    <div class="ribbon"></div>
    <p class="tag">Part Three</p>
    <h1>What a year round representation practice looks like</h1>
    <p class="lead">Steady cases through the summer. Fees priced on value. A credential that makes referral partners trust you on sight.</p>
  `},

  {t:"ctr", html:`
    <p class="tag">The proof</p>
    <h2>The CTR designation is the shortcut to trust.</h2>
    <p>Certified Taxpayer Representative is the credential built for exactly this work. It takes training hours, hands on case work, and a passing exam, and it tells every client and referral source that you can actually do the job, not just file the return.</p>
    <ul>
      <li><b>Competency backed</b> a defined body of case work, not a weekend seminar</li>
      <li><b>Referral ready</b> other pros send you the cases they will not take</li>
      <li><b>Defensible fees</b> a certified specialist does not compete on prep pricing</li>
    </ul>
  `},

  {t:"why", html:`
    <p class="tag">Why listen to me</p>
    <h2>I built this practice before I taught it.</h2>
    <p>I am Dan Henn, CPA, CTR. I added IRS representation as a full time service to my own Florida practice in 2013, I write and speak on tax across the state, and with the Tax Resolution Academy I helped create the Certified Taxpayer Representative designation so other pros would have a real path into this work.</p>
    <p class="big">My focus is the work most generalists avoid: IRS collections and real estate tax. That is where the peace of mind, and the fees, live.</p>
  `},

  {t:"cta", cls:"center", html:`
    <div class="ribbon"></div>
    <p class="tag">Your next step</p>
    <h2>Start the path to Certified Taxpayer Representative.</h2>
    <p class="lead">Join the Tax Resolution Academy and get the case work training, the weekly office hours, and the templates that turn a seasonal prep practice into a year round representation firm.</p>
    <ul class="cta-steps" style="max-width:30em;margin-left:auto;margin-right:auto;text-align:left">
      <li>Join the Academy and start earning CTR training hours</li>
      <li>Bring your first collections case to office hours</li>
      <li>Price it on value, and resolve it</li>
    </ul>
    <p class="disc">Educational content only. This masterclass teaches tax resolution practice and representation methods. No income, role, client, or case result is guaranteed. Outcomes depend on your license, your effort, and the facts of each case. Nothing here is legal, tax, or financial advice for a specific taxpayer.</p>
    <div class="foot"><span>Dan Henn, CPA, CTR</span><span>Tax Resolution Academy</span></div>
  `}
];

const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide" + (s.cls ? " " + s.cls : "");
  el.innerHTML = s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
