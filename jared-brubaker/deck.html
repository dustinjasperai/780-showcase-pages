<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Your Best People Leave, and How to Keep Them — Manufacturing Leadership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#17130b;
    --rule:#33291a;
    --accent:#ffbb26;
    --ink:#ece7df;
    --muted:#9a9488;
    --head:'Inter',system-ui,sans-serif;
    --body:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:var(--ink);font-family:var(--body);display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(96vw,1100px);aspect-ratio:16/10;background:var(--bg);border:1px solid var(--rule);border-radius:14px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .slide{position:absolute;inset:0;padding:70px 78px;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.06;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.1;color:var(--ink)}
  .sub{font-size:24px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:40ch}
  .big{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.12;color:var(--ink);max-width:24ch}
  .accent{color:var(--accent)}
  .lede{font-size:26px;line-height:1.55;color:var(--ink);max-width:34ch;margin-top:10px}
  .part{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
  ul.pillars{margin-top:30px;list-style:none;display:flex;flex-direction:column;gap:16px}
  ul.pillars li{font-size:24px;padding-left:34px;position:relative;color:var(--ink)}
  ul.pillars li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:4px;background:var(--accent)}
  .rule{height:3px;width:64px;background:var(--accent);margin:0 0 30px}
  .cad{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
  .cad div{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 22px;font-family:var(--head);font-weight:600;font-size:19px;color:var(--ink)}
  .cad div span{display:block;font-family:var(--body);font-weight:400;font-size:16px;color:var(--muted);margin-top:4px}
  .cred{font-size:23px;line-height:1.55;color:var(--ink);max-width:36ch;margin-top:20px}
  .disc{font-size:16px;line-height:1.5;color:var(--muted);margin-top:30px;max-width:52ch}
  .cta-line{font-family:var(--head);font-weight:800;font-size:28px;color:var(--accent);margin-top:18px}
  #nav{position:absolute;bottom:18px;right:26px;font-family:var(--head);font-size:14px;color:var(--muted)}
  #hint{position:absolute;bottom:18px;left:26px;font-family:var(--head);font-size:13px;color:var(--rule)}
  .footer-brand{position:absolute;top:30px;left:78px;font-family:var(--head);font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title', kick:'Manufacturing Leadership', h:'Why Your Best People Leave, and How to Keep Them', sub:'A live masterclass for manufacturing leaders who are tired of training good people just to watch them walk.'},
  {t:'who', kick:'Who this is for', big:'Plant managers, operations leaders, and owners running a manufacturing team.', sub:'If you carry the floor, and turnover keeps setting you back to zero, this hour is for you.'},
  {t:'trap', kick:'The trap', big:'The Tuesday morning you find out your best lead hand is leaving.', sub:'You backfill, you retrain, and six months later you are doing it again.'},
  {t:'reframe', kick:'The real reason', lede:'They did not leave for a dollar an hour somewhere else. They left the person they reported to.'},
  {t:'part', part:'Part One', h:'Why people really leave the floor'},
  {t:'point', kick:'The cost nobody logs', big:'Every departure resets a line to zero.', sub:'Lost knowledge, a slower crew, and the people who stay wondering if they should go too. Turnover is not an HR line item. It is a leadership signal.'},
  {t:'point', kick:'The pattern', big:'People join companies. They quit managers.', sub:'The strongest predictor of whether your people stay is the leader they answer to every shift.'},
  {t:'part', part:'Part Two', h:'The manufacturing leadership system'},
  {t:'pillars', kick:'What we build in your leaders', h:'Four things every floor leader has to be able to do', items:['Build genuine trust with the crew','Motivate the team on a hard day, not just a good one','Develop the next lead hand before you need them','Resolve conflict before it walks out the door']},
  {t:'point', kick:'Beyond the four', big:'Spot and stop the leadership habits that push people out.', sub:'Most floor leaders were promoted for being the best operator, never taught to lead. We name the patterns that quietly cost you people, and replace them.'},
  {t:'cadence', kick:'How leaders actually change', h:'Leadership is developed over time', sub:'Not a one-day workshop that fades by next week. A steady cadence that builds the habit.', tiles:[['Bi-weekly','Live training'],['Quarterly','1:1 coaching'],['After each session','Group discussion'],['Always on','Community']]},
  {t:'point', kick:'Built for the floor', big:'Not boardroom leadership theory. Plant-floor leadership.', sub:'Built for manufacturing, by someone who ran it, so the examples are your shifts, your pressures, and your people, not a generic slide from another industry.'},
  {t:'part', part:'Part Three', h:'What changes on your floor'},
  {t:'point', kick:'The difference', big:'A leader who develops people, versus one who only assigns work.', sub:'One keeps a crew together through a hard quarter. The other loses the exact people they can least afford to lose.'},
  {t:'point', kick:'The flywheel', big:'Stronger leaders keep stronger people, who become the next leaders.', sub:'Retention stops being a scramble and starts compounding. That is the whole point of building leaders on purpose.'},
  {t:'cred', kick:'Why me', h:'Twenty-two years on the floor, from entry level to COO', cred:'I have worked every role in manufacturing, from the line to the corner office, in $800M operations and in startups. I built Manufacturing Leadership because the same thing broke everywhere: we promote good operators and never teach them to lead.'},
  {t:'recap', kick:'What we covered', h:'The hour in three parts', items:['Why your best people really leave','The four-pillar leadership system, on a cadence','What developing leaders looks like on your floor']},
  {t:'point', kick:'The one idea to keep', big:'Keep your people by building the leaders they report to.', sub:'Everything else is downstream of that.'},
  {t:'next', kick:'If this is the year you fix retention', big:'Bring this to your leadership team.', sub:'The program runs year-round: bi-weekly live training, quarterly coaching, group discussion, and community, built for your leaders.'},
  {t:'cta', kick:'Next step', h:'Work with Manufacturing Leadership', ctaline:'Schedule a discovery call to see if it fits your plant.', disc:'This is a leadership development program, not a promise of a specific number. No specific retention or performance result is guaranteed. Results vary by plant, team, and how consistently your leaders apply what they learn.'}
];

const stage = document.getElementById('stage');
let i = 0;
function render(){
  stage.innerHTML = '';
  const s = S[i];
  const el = document.createElement('div');
  el.className = 'slide on';
  let inner = `<div class="footer-brand">Manufacturing Leadership</div>`;
  if(s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if(s.part) inner += `<div class="rule"></div><div class="part">${s.part}</div>`;
  if(s.h) inner += `<h1 style="font-size:${s.h.length>40?'44px':'52px'}">${s.h}</h1>`;
  if(s.big) inner += `<div class="big">${s.big}</div>`;
  if(s.lede) inner += `<div class="lede">${s.lede}</div>`;
  if(s.cred) inner += `<div class="cred">${s.cred}</div>`;
  if(s.items){ inner += '<ul class="pillars">'; s.items.forEach(x=> inner += `<li>${x}</li>`); inner += '</ul>'; }
  if(s.tiles){ inner += '<div class="cad">'; s.tiles.forEach(x=> inner += `<div>${x[0]}<span>${x[1]}</span></div>`); inner += '</div>'; }
  if(s.sub) inner += `<div class="sub">${s.sub}</div>`;
  if(s.ctaline) inner += `<div class="cta-line">${s.ctaline}</div>`;
  if(s.disc) inner += `<div class="disc">${s.disc}</div>`;
  inner += `<div id="nav">${i+1} / ${S.length}</div><div id="hint">arrow keys</div>`;
  el.innerHTML = inner;
  stage.appendChild(el);
}
function go(n){ i = Math.max(0, Math.min(S.length-1, i+n)); render(); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') go(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});
stage.addEventListener('click', ()=> go(1));
render();
</script>
</body>
</html>
