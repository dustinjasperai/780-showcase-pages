<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Black Belt Path to Breakthrough — Chris Natzke</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0E10; --panel:#17171B; --rule:#2B2B31;
    --accent:#C9A227; --ink:#F4F1EA; --muted:#A9A69E;
    --head:'Oswald',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:8vh 9vw;}
  .slide.on{display:flex}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.26em;text-transform:uppercase;
    font-size:clamp(12px,1.5vw,17px);color:var(--accent);margin-bottom:28px}
  h1{font-family:var(--head);font-weight:600;line-height:1.05;letter-spacing:-.01em;
    font-size:clamp(34px,6.4vw,82px)}
  h2{font-family:var(--head);font-weight:600;line-height:1.08;font-size:clamp(28px,4.6vw,56px)}
  .sub{font-size:clamp(17px,2.1vw,26px);color:var(--muted);margin-top:26px;max-width:46ch;line-height:1.5}
  .big{font-family:var(--head);font-weight:600;font-size:clamp(30px,5.2vw,68px);line-height:1.1;max-width:20ch}
  .big .a{color:var(--accent)}
  ul{list-style:none;margin-top:34px;display:flex;flex-direction:column;gap:20px;max-width:40ch}
  li{position:relative;padding-left:40px;font-size:clamp(17px,2.1vw,25px);line-height:1.4}
  li::before{content:'';position:absolute;left:0;top:.5em;width:16px;height:16px;border:2.5px solid var(--accent);
    border-radius:4px;transform:rotate(45deg)}
  .belt{display:flex;flex-direction:column;gap:18px;margin-top:30px;max-width:42ch}
  .belt .row{display:flex;align-items:baseline;gap:22px}
  .belt .r{font-family:var(--head);font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    font-size:clamp(16px,2vw,23px);color:var(--accent);min-width:7.5ch}
  .belt .d{font-size:clamp(16px,2vw,24px);color:var(--ink)}
  .part .num{font-family:var(--head);font-weight:700;font-size:clamp(60px,12vw,160px);color:var(--rule);line-height:.9}
  .note{margin-top:40px;font-size:clamp(12px,1.4vw,15px);color:var(--muted);max-width:56ch;line-height:1.5}
  .credit{margin-top:40px;font-family:var(--head);letter-spacing:.14em;text-transform:uppercase;
    font-size:clamp(13px,1.6vw,18px);color:var(--muted)}
  .cta-line{display:inline-block;margin-top:34px;font-family:var(--head);font-weight:600;
    font-size:clamp(18px,2.4vw,30px);color:var(--bg);background:var(--accent);
    padding:16px 34px;border-radius:100px}
  .stripe{height:6px;width:120px;background:var(--accent);border-radius:3px;margin-bottom:34px}
  .nav{position:fixed;bottom:22px;right:28px;display:flex;align-items:center;gap:16px;z-index:10;
    font-family:var(--head);letter-spacing:.1em;font-size:14px;color:var(--muted)}
  .nav button{font:inherit;color:var(--bg);background:var(--accent);border:0;border-radius:8px;
    width:40px;height:34px;cursor:pointer}
  .count{min-width:5ch;text-align:center}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav"><button id="prev">&#8249;</button><span class="count" id="count"></span><button id="next">&#8250;</button></div>
<script>
const S = [
  {t:'title', stripe:true, kicker:'A Live Masterclass with Chris Natzke',
   h:'The Black Belt Path to Breakthrough',
   sub:'How to lead your life the way a black belt earns rank: vision, the inner game, and the self-mastery habit that makes it stick.'},

  {t:'content', kicker:'What you leave with', h:'Three things, by the end of the hour',
   bullets:['A purposeful vision for your next belt in life',
     'The inner game that beats self-doubt under pressure',
     'A daily rep that makes the change automatic']},

  {t:'content', kicker:'Who this is for', h:'Leaders and high performers who have plateaued',
   sub:'You are driven. You have hit real goals before. Lately the same discipline that worked everywhere else has stopped moving the needle in your own life, and you cannot name why.'},

  {t:'content', kicker:'The trap', h:'You have been training willpower',
   sub:'Willpower resets every January. You set the goals, you white-knuckle it, and by March the old pattern is back. The problem was never your effort. It was what you were training.'},

  {t:'reframe', big:'You do not rise to your goals. You fall to the level of your <span class="a">training</span>.'},

  {t:'part', num:'01', h:'The core problem', sub:'A champion is built by the system they repeat, not the motivation they feel.'},

  {t:'content', kicker:'Part one', h:'Fear and old beliefs run the show',
   sub:'Under pressure you default to the story you have rehearsed the most. For most people that story is doubt. A black belt does not feel less fear. They have trained a different response so many times it fires first.'},

  {t:'part', num:'02', h:'The 7 Qualities of Black Belt Leadership', sub:'The belt path, applied to your life. You earn the next rank by living the one before it.'},

  {t:'content', kicker:'White belt', h:'A purposeful vision',
   sub:'Every rank starts here. Before technique, before drills, you decide what you are training toward. Most people skip this and wonder why the effort scatters.'},

  {t:'belt', kicker:'The early belts', h:'Becoming the person first',
   rows:[['Yellow','Being the change you wish to see'],
     ['Orange','Personal integrity, on and off the mat'],
     ['Green','Conscious persistence through the plateau']]},

  {t:'belt', kicker:'The middle belts', h:'Strength turns outward',
   rows:[['Blue','Compassionate service to others'],
     ['Brown','Acceptance and surrender of what you cannot control']]},

  {t:'content', kicker:'Red belt', h:'Inspired action',
   sub:'Vision without action is a daydream. By now the action is not forced. It comes from who you have become through the earlier ranks.'},

  {t:'content', kicker:'Black belt', h:'Living a life of self-mastery',
   sub:'The black belt is not the end. It is the beginning of teaching it to yourself for life. Mastery is a daily practice, not a certificate on the wall.'},

  {t:'content', kicker:'The inner game', h:'The Champion’s Mindset',
   sub:'This is the loop I trained to win at national level: a clear vision, a trained response to fear, and a rep I repeat until it is automatic. It is the same loop that carries the belt path.'},

  {t:'part', num:'03', h:'Your next ninety days', sub:'Ninety days of training the system instead of your willpower.'},

  {t:'content', kicker:'The picture', h:'The next belt is a decision, not a feeling',
   bullets:['You stop waiting to feel ready and start the rep',
     'Pressure stops deciding your response for you',
     'Progress compounds rank by rank instead of resetting']},

  {t:'content', kicker:'Why me', h:'Four decades on the mat',
   sub:'I am an 8th degree black belt and Master Instructor, a former U.S. National Taekwondo Champion, and the author of Black Belt Leadership and the number one bestseller Breaking Through. I have trained people to find their inner champion for over forty years.'},

  {t:'content', kicker:'In one line', h:'The belt path, remembered',
   bullets:['Vision first, every time (White)',
     'Become the person before the result (Yellow to Brown)',
     'Then inspired action and self-mastery (Red, Black)']},

  {t:'cta', kicker:'Your next step', h:'Book a Breakthrough Call',
   sub:'If you want the belt path applied to your own life and leadership, let us talk it through. We will map where you are now and what the next rank looks like for you.',
   cta:'Schedule your Breakthrough Call',
   note:'This masterclass is educational. No specific income, rank, or result is guaranteed. Results vary and depend on your own effort and circumstances.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t ? ' ' + s.t : '');
  let html = '';
  if (s.stripe) html += '<div class="stripe"></div>';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.t === 'part' && s.num) html += '<div class="num">' + s.num + '</div>';
  if (s.big) html += '<div class="big">' + s.big + '</div>';
  if (s.h) html += (s.t === 'title' ? '<h1>' : '<h2>') + s.h + (s.t === 'title' ? '</h1>' : '</h2>');
  if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  if (s.bullets) html += '<ul>' + s.bullets.map(b => '<li>' + b + '</li>').join('') + '</ul>';
  if (s.rows) html += '<div class="belt">' + s.rows.map(r => '<div class="row"><span class="r">' + r[0] + '</span><span class="d">' + r[1] + '</span></div>').join('') + '</div>';
  if (s.credit) html += '<div class="credit">' + s.credit + '</div>';
  if (s.cta) html += '<div><span class="cta-line">' + s.cta + '</span></div>';
  if (s.note) html += '<div class="note">' + s.note + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
const count = document.getElementById('count');
function show(n){ cur = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle('on', i === cur));
  count.textContent = (cur + 1) + ' / ' + slides.length; }
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('prev').onclick = () => show(cur - 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
show(0);
</script>
</body>
</html>
