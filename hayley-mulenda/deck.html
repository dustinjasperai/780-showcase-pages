<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Paid for What You Know — Speak Up Masterclass with Hayley Mulenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2;
    --panel:#f3ece2;
    --rule:#e4d8c8;
    --ink:#2a2320;
    --muted:#6b5f55;
    --accent:#efbd8c;
    --display:'Bricolage Grotesque',Georgia,serif;
    --body:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .slide .num{position:absolute;top:20px;right:26px;font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.08em}
  .eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .eyebrow .dot{color:var(--accent)}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-0.01em;margin-bottom:20px}
  h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-0.01em;margin-bottom:18px}
  h3{font-family:var(--display);font-weight:500;font-size:24px;margin-bottom:10px}
  p{font-size:20px;color:var(--ink);max-width:58ch;margin-bottom:14px}
  p.lead{font-size:23px}
  .muted{color:var(--muted)}
  .accent-rule{width:72px;height:5px;background:var(--accent);border-radius:3px;margin:0 0 26px}
  .title-slide{background:var(--panel)}
  .title-slide h1{font-size:60px}
  .pillar{display:flex;gap:18px;align-items:flex-start;margin:14px 0}
  .pillar .k{font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink);min-width:150px}
  .pillar .k .bar{display:block;width:40px;height:4px;background:var(--accent);border-radius:2px;margin-top:8px}
  .pillar .v{font-size:19px;color:var(--muted);max-width:52ch}
  ul{list-style:none;margin:8px 0 0}
  ul li{font-size:20px;padding:10px 0 10px 26px;position:relative;border-bottom:1px solid var(--rule);max-width:60ch}
  ul li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;background:var(--accent);border-radius:50%}
  .part .eyebrow{color:var(--accent)}
  .part h2{font-size:44px}
  .cta-slide{background:var(--panel)}
  .cta-slide .btn{display:inline-block;font-family:var(--display);font-weight:500;font-size:19px;background:var(--ink);color:var(--bg);padding:16px 30px;border-radius:999px;margin-top:10px}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:28px;max-width:62ch;line-height:1.5}
  .cred{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;margin-top:10px}
  .cred div{font-size:18px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--rule)}
  .cred b{color:var(--ink);font-family:var(--display);font-weight:500}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'Live Masterclass', h1:'Get Paid for What You Know',
   p:'Turn your voice into bookings, clients and income. A live masterclass with Hayley Mulenda, international speaker and founder of Speak Up Mastery.'},

  {t:'who', eyebrow:'Who this is for',
   h2:'If people already come to you for what you know',
   lis:['Aspiring speakers who want a clearer place to start',
        'Established speakers who want stronger positioning',
        'Coaches and consultants building a brand around their expertise',
        'Experts and professionals ready to be seen and paid for their value']},

  {t:'content', eyebrow:'The trap',
   h2:'You are the person everyone asks for advice',
   p:'And yet the bookings feel inconsistent, the paid work is patchy, and a quiet voice keeps asking whether you are even qualified to charge for this.',
   p2:'That is not a talent problem. You already have the knowledge. It is a visibility and positioning problem.'},

  {t:'reframe', eyebrow:'A reframe',
   h2:'Being good on the stage is not what gets you paid',
   p:'Being findable, being clear about your value, and being in the right rooms is what turns a voice into a business. Most talented people never get this part taught to them.'},

  {t:'part', eyebrow:'Part one', h2:'The real problem: your value is invisible'},

  {t:'content', eyebrow:'The pattern',
   h2:'Great message, wrong distance',
   p:'The people who would happily pay you have never heard of you, cannot find you, or cannot tell in five seconds what you help with and why it matters.',
   p2:'So they book the person who is merely easier to find. Closing that distance is the whole game.'},

  {t:'part', eyebrow:'Part two', h2:'The method: the three rooms that get you booked'},

  {t:'pillars', eyebrow:'The method',
   h2:'Clarity, Visibility, Proximity',
   pillars:[
     ['Clarity','Get clear on what you want to be known for, who you serve, and the real value of your experience, so people can understand what you bring.'],
     ['Visibility','Position your voice where the right people see it. Practical positioning that turns showing up into enquiries, relationships and paid work.'],
     ['Proximity','The rooms you are in, and the people you learn from, shape your standards, your confidence and the opportunities you can even see.']]},

  {t:'content', eyebrow:'Clarity', h2:'What do you want to be known for?',
   p:'A powerful story is a starting point, not a brand. The work is turning it into one clear message, one audience you serve, and one promise people remember.',
   p2:'When your message is clear, the right opportunities start to recognise themselves.'},

  {t:'content', eyebrow:'Visibility and positioning', h2:'Help the right people find you',
   p:'Visibility is not about going viral. It is about consistently showing the right people the value you create, so that speaking engagements, partnerships and paid work come looking for you.'},

  {t:'content', eyebrow:'Proximity', h2:'The rooms raise your ceiling',
   p:'Who you are close to sets what feels normal, what feels possible, and what you will charge. Mentorship and community are not extras. They are how progress accelerates.'},

  {t:'part', eyebrow:'Part three', h2:'The maths: actually getting paid'},

  {t:'content', eyebrow:'The maths behind speaking', h2:'Price, negotiate, and build beyond the stage',
   p:'Most experts undercharge because nobody taught them the money side. The maths is learnable: how to price an engagement, how to negotiate it, and how to stop trading time for a single fee.',
   p2:'Your knowledge can earn in more than one way at once.'},

  {t:'content', eyebrow:'Income beyond the stage', h2:'One voice, several income streams',
   lis:['Paid speaking and keynotes','One to one coaching and consulting','Workshops and group programs','Books, courses and digital products']},

  {t:'cred', eyebrow:'Why learn this from me',
   h2:'I built a business on my own voice',
   creds:[['25+ countries','spoken on stages worldwide'],
          ['Microsoft, Google, Meta, JP Morgan','among the organisations I have worked with'],
          ['Author and podcast host','The ABCs to Student Success; The Building You Podcast'],
          ['Clients generating £700,000+','first paid bookings to five figure days']],
   p:'I started speaking as a teenager in East London and built a seven figure business from my voice. These are the principles I used, and that my clients use now.'},

  {t:'content', eyebrow:'Recap', h2:'Clear, visible, close',
   p:'Get clear on your value. Make the right people see it. Put yourself in the rooms that raise your standards. Then price and package it so your voice pays you.',
   p2:'That is how you get paid for what you know.'},

  {t:'cta', eyebrow:'Your next step',
   h2:'Work with me one to one',
   p:'If you want help applying this to your own voice and building the income around it, the next step is to work with me directly through Speak Up Mastery mentoring.',
   btn:'Book a call with Hayley',
   disclaimer:'This masterclass is educational. It shares principles and examples from Hayley Mulenda and her clients. It is not a promise or guarantee of income or results. Outcomes vary and depend on your own effort, market and circumstances.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t === 'title' ? 'title-slide' : s.t === 'cta' ? 'cta-slide' : s.t === 'part' ? 'part' : '');
  let html = '<span class="num">' + (i + 1) + ' / ' + S.length + '</span>';
  if (s.eyebrow) html += '<div class="eyebrow"><span class="dot">&#9679;</span> ' + s.eyebrow + '</div>';
  if (s.h1) html += '<h1>' + s.h1 + '</h1>';
  if (s.h2) html += '<div class="accent-rule"></div><h2>' + s.h2 + '</h2>';
  if (s.p) html += '<p class="lead">' + s.p + '</p>';
  if (s.p2) html += '<p class="muted">' + s.p2 + '</p>';
  if (s.lis) { html += '<ul>'; s.lis.forEach(li => html += '<li>' + li + '</li>'); html += '</ul>'; }
  if (s.pillars) { s.pillars.forEach(pr => html += '<div class="pillar"><div class="k">' + pr[0] + '<span class="bar"></span></div><div class="v">' + pr[1] + '</div></div>'); }
  if (s.creds) { html += '<div class="cred">'; s.creds.forEach(c => html += '<div><b>' + c[0] + '</b><br>' + c[1] + '</div>'); html += '</div>'; }
  if (s.btn) html += '<div><span class="btn">' + s.btn + '</span></div>';
  if (s.disclaimer) html += '<div class="disclaimer">' + s.disclaimer + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
