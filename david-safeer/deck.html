<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profit on the Books, Broke in the Bank, a Cash is Clear&reg; masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f2d4d;
  --panel:#164374;
  --rule:#004478;
  --accent:#ffcb05;
  --ink:#ecf0f1;
  --dim:#9fb3cc;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
.deck{width:100%}
.slide{
  position:relative;
  min-height:100vh;
  scroll-snap-align:start;
  display:flex;flex-direction:column;justify-content:center;
  padding:9vh 9vw;
  border-bottom:1px solid rgba(255,255,255,.06);
  overflow:hidden;
}
.deck{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}
.kicker{font-size:14px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
h1{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:clamp(34px,6vw,76px);line-height:1.04;letter-spacing:-.015em}
h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(28px,4.4vw,54px);line-height:1.1;letter-spacing:-.01em}
.lede{font-size:clamp(18px,2.2vw,28px);line-height:1.5;color:var(--dim);margin-top:28px;max-width:60ch}
.big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(26px,3.6vw,46px);line-height:1.18;max-width:24ch}
.accent{color:var(--accent)}
.rule{width:92px;height:5px;background:var(--accent);border-radius:3px;margin:30px 0 0}
.meta{margin-top:auto;padding-top:34px;font-size:15px;letter-spacing:.04em;color:var(--dim)}
.badge{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:7px 14px;border-radius:100px}
ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:16px;max-width:60ch}
li{font-size:clamp(17px,2vw,24px);line-height:1.4;padding-left:34px;position:relative;color:var(--ink)}
li::before{content:'';position:absolute;left:0;top:.62em;width:16px;height:16px;border:3px solid var(--accent);border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px;max-width:58rem}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:26px 22px}
.card .n{font-family:'Space Grotesk',sans-serif;font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.card .t{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin-top:10px}
.card .d{color:var(--dim);font-size:16px;line-height:1.42;margin-top:8px}
.horizon{position:absolute;right:7vw;bottom:8vh;opacity:.5}
.stepno{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:clamp(40px,7vw,90px);color:var(--rule);line-height:.9}
.two{display:flex;gap:16px;align-items:baseline}
.disc{font-size:14px;line-height:1.5;color:var(--dim);margin-top:26px;max-width:62ch}
.cta-line{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(20px,2.6vw,30px);margin-top:18px;color:var(--accent)}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
   kicker:'A live Cash is Clear&reg; masterclass',
   h:'Profit on the Books,<br><span class="accent">Broke in the Bank</span>',
   lede:'How accountants and bookkeepers become the cash flow advisor every client needs.',
   meta:'Presented live by David Safeer, founder of Cash is Clear&reg; Learning Systems'},

  {t:'who',
   kicker:'Who this is for',
   h:'You are good at the numbers.',
   lede:'This hour is for CPAs, accountants, bookkeepers and fractional CFOs who do solid compliance work and want to grow into high value advisory, without becoming a different person to do it.'},

  {t:'trap',
   kicker:'Picture a client',
   h:'The P&amp;L looked fine.',
   lede:'Revenue was up. The statement showed a profit. Then payroll cleared, a supplier wanted paying, and the account was empty. The owner did nothing obviously wrong. You still got the panicked call.'},

  {t:'hook',
   kicker:'The reframe',
   h:'Profit is a conclusion.<br><span class="accent">Cash is reality.</span>',
   lede:'Profit is an accounting conclusion drawn after the fact. Cash is what the business actually has on a Tuesday afternoon. Most accountants report the first. Clients are living in the second.'},

  {t:'problem',
   kicker:'Part one: why the reports lie',
   h:'Historical reports tell a misleading story about cash.',
   lede:'Accrual profit is not money in the bank. A client can read a healthy statement and still be weeks away from a crisis, because the report looks backward and cash lives forward.'},

  {t:'problem',
   kicker:'The cost of the gap',
   h:'A profitable business can still fail.',
   list:['Emergency borrowing at the worst possible rate','Missed payroll and lost key people','Forced, panic selling of good assets','Clients who churn because no one warned them in time']},

  {t:'framework',
   kicker:'Part two: the method',
   h:'The Cash is Clear&reg; Process.',
   lede:'Five critical elements for cash flow and profit maximization, and a repeatable way to deliver them as a service. Not theory. The system I built from twenty years of fixing real companies.'},

  {t:'pillars',
   kicker:'Six systems',
   h:'The arc of an engagement.',
   cards:[
     ['01','Mindset','Think like an operator, not a historian'],
     ['02','Measure','See the cash, forward, every week'],
     ['03','Model','Map every lever that moves cash'],
     ['04','Manage','Fix the real drain, not the symptom'],
     ['05','Mentor','Guide the owner through the change'],
     ['06','Maximize','Turn it into a recurring engagement']]},

  {t:'step',
   kicker:'System one',
   no:'01',
   h:'Mindset',
   lede:'Stop thinking like a scorekeeper reporting last quarter. Start thinking like the operator who has to make payroll on Friday. That single shift is what separates an advisor from a bookkeeper.'},

  {t:'step',
   kicker:'System two',
   no:'02',
   h:'Measure: the 13-Week Forecast',
   lede:'A rolling thirteen week cash forecast, updated weekly against real bank transactions. Extremely reliable two weeks out, directional through week ten, estimated through week thirteen. Forward visibility a P&amp;L can never give.'},

  {t:'step',
   kicker:'System three',
   no:'03',
   h:'Model: the Maximizer',
   lede:'A diagnostic that sorts more than 240 cash strategies into 20 buckets by difficulty, timeline and profit impact, so you can prescribe the right move for a client instead of starting from a blank page every time.'},

  {t:'step',
   kicker:'System four',
   no:'04',
   h:'Manage',
   lede:'Find what is actually draining the cash and fix it. This is the work owners cannot do alone and will pay for: diagnosis and a plan, not another report that confirms the problem after it is too late.'},

  {t:'step',
   kicker:'System five',
   no:'05',
   h:'Mentor',
   lede:'Guide the owner through the changes week by week. You stop being the person who files the past and become the advisor they call before they make a decision. That seat is where the real fees are.'},

  {t:'step',
   kicker:'System six',
   no:'06',
   h:'Maximize',
   lede:'Package the method into a standing advisory engagement with a recurring fee, so the value you create every month is matched by the income you earn every month.'},

  {t:'proof',
   kicker:'Part three: inside the engagement',
   h:'A monthly seat at the client&rsquo;s table.',
   lede:'An advisory engagement is not a bigger invoice for the same work. It is a different relationship: a monthly rhythm of forecast, diagnosis and decisions that the owner comes to rely on.'},

  {t:'credibility',
   kicker:'Why learn this from me',
   h:'I ran the businesses before I taught the method.',
   lede:'Thirty five years across more than forty countries. VP and general manager at Kodak Latin America, including an 18 month turnaround. President of Iomega Latin America. I built Cash is Clear&reg; from what actually worked when the cash was mine to protect.'},

  {t:'economics',
   kicker:'What it can mean',
   h:'From price taker to trusted advisor.',
   lede:'Advisors delivering this work can earn advisory fees of five thousand dollars or more each month from a single client. Compliance competes on price. Advisory competes on the outcome you create.'},

  {t:'recap',
   kicker:'The shift',
   h:'Same clients. Different relationship.',
   list:['Report the past, or forecast the future','Confirm the problem, or fix it','Compete on fees, or compete on outcomes','Be the bookkeeper, or be the advisor']},

  {t:'next',
   kicker:'Where to take this',
   h:'You now have the method.',
   lede:'The fastest way to put it to work is to walk your own practice and your real clients through it with the Cash is Clear&reg; team, and decide if advisory is the right next chapter for you.'},

  {t:'cta',
   kicker:'Your next step',
   h:'Book a right-fit call with Cash is Clear&reg;.',
   cta:'Bring one client&rsquo;s numbers and we will show you where the cash is hiding.',
   disc:'No specific income or result is guaranteed. Any figures describe what is possible, not what is promised. Results vary and depend on your effort, your clients and factors outside anyone&rsquo;s control. This masterclass is educational and is not financial, legal or tax advice.'}
];

const deck=document.getElementById('deck');
function esc(x){return x||''}
for(const s of S){
  const el=document.createElement('section');
  el.className='slide s-'+s.t;
  let inner='';
  if(s.kicker) inner+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){
    inner+='<h1>'+s.h+'</h1><div class="rule"></div>';
    if(s.lede) inner+='<p class="lede">'+s.lede+'</p>';
    if(s.meta) inner+='<div class="meta">'+s.meta+'</div>';
  } else if(s.t==='hook'){
    inner+='<h1>'+s.h+'</h1>';
    if(s.lede) inner+='<p class="lede">'+s.lede+'</p>';
  } else {
    if(s.no) inner+='<div class="stepno">'+s.no+'</div>';
    inner+='<h2>'+esc(s.h)+'</h2>';
    if(s.lede) inner+='<p class="lede">'+s.lede+'</p>';
    if(s.list){inner+='<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
    if(s.cards){inner+='<div class="grid">'+s.cards.map(c=>'<div class="card"><div class="n">'+c[0]+'</div><div class="t">'+c[1]+'</div><div class="d">'+c[2]+'</div></div>').join('')+'</div>';}
    if(s.cta) inner+='<div class="cta-line">'+s.cta+'</div>';
    if(s.disc) inner+='<div class="disc">'+s.disc+'</div>';
  }
  el.innerHTML=inner;
  deck.appendChild(el);
}
</script>
</body>
</html>
