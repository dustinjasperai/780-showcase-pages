<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Direct Booking Blueprint Masterclass · Sarah Orchard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f3ea; --panel:#e7eef0; --rule:#ddd6c9;
    --acc:#336078; --acc2:#3c7899; --spark:#f7be05;
    --ink:#2b3138; --body:#4a5158; --dim:#9a938a; --paper:#f7f3ea;
  }
  html,body{height:100%}
  body{background:#e6e1d6;font-family:'Raleway',system-ui,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e6e1d6}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Raleway',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{color:var(--ink);line-height:1.1}
  .t-title h1{font-family:'DM Serif Display',Georgia,serif;font-size:6.4vw;max-width:96%;letter-spacing:0;line-height:1.02}
  .t-normal h1{font-family:'Raleway',sans-serif;font-weight:700;font-size:3.05vw;max-width:90%;letter-spacing:-.01em;line-height:1.16}
  .t-normal .body{font-family:'Raleway',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:80%;line-height:1.72;font-weight:400}
  .sub{font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:2.1vw;color:var(--acc);margin-top:3.6vh;max-width:90%;line-height:1.34;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.0vw;font-weight:700;color:var(--acc);margin-bottom:2.4vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-family:'DM Serif Display',Georgia,serif;font-size:5.8vw;max-width:94%;letter-spacing:0;line-height:1.04}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#2f5163 0%,#23414f 100%);align-items:center;text-align:center}
  .t-dark h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:3.9vw;max-width:88%;color:#f4f6f4;line-height:1.2}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2f5163 0%,#23414f 100%);align-items:center;text-align:center}
  .t-cta h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:3.9vw;max-width:88%;color:#f4f6f4;line-height:1.14}
  .t-cta .body{font-family:'Raleway',sans-serif;color:#d5e0e2;font-size:1.4vw;margin-top:3vh;max-width:76%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Raleway',sans-serif;border:1.6px solid var(--spark);color:#f4f6f4;border-radius:100px;padding:1.4vh 1.9vw;font-size:1.06vw;font-weight:600;letter-spacing:.02em}
  .chip.alt{border-color:#7fb0c7}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-family:'Raleway',sans-serif;font-size:.82vw;color:var(--dim);text-align:center;line-height:1.5}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:8%;bottom:9%;width:17vw;opacity:.98}
  .corner-vf{right:6.5%;bottom:7.5%;width:8.5vw;opacity:.55}
  .brandline{font-family:'Raleway',sans-serif;font-size:1.05vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(51,55,61,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Raleway',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Raleway',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:11vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.2vw}.t-section h1{font-size:9.4vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Get Fully Booked</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a calendar filling up; most cells booked direct (teal), one in warm spark = the guest who is yours -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g>
    <rect x="10" y="16" width="100" height="94" rx="12" fill="none" stroke="#336078" stroke-width="3" opacity="0.5"/>
    <line x1="10" y1="40" x2="110" y2="40" stroke="#336078" stroke-width="3" opacity="0.5"/>
    <rect x="34" y="8" width="7" height="16" rx="3.5" fill="#336078" opacity="0.7"/>
    <rect x="79" y="8" width="7" height="16" rx="3.5" fill="#336078" opacity="0.7"/>
    <rect x="20" y="50" width="18" height="16" rx="4" fill="#3c7899" opacity="0.85"/>
    <rect x="51" y="50" width="18" height="16" rx="4" fill="#3c7899" opacity="0.4"/>
    <rect x="82" y="50" width="18" height="16" rx="4" fill="#3c7899" opacity="0.85"/>
    <rect x="20" y="76" width="18" height="16" rx="4" fill="#f7be05" opacity="0.95"/>
    <rect x="51" y="76" width="18" height="16" rx="4" fill="#3c7899" opacity="0.85"/>
    <rect x="82" y="76" width="18" height="16" rx="4" fill="#3c7899" opacity="0.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Direct Booking Blueprint',sub:'How holiday let, cottage and Airbnb owners fill the calendar with bookings that are theirs, not the platform’s.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You built a place people love. The platforms built a tollbooth in front of it.',body:'You pour yourself into the property, the welcome, the little touches guests remember. Then a platform sits between you and every guest, takes a cut of each stay, keeps the guest’s details, and decides how often you get seen. You are running a real hospitality business, but on rented land. This is for the owner who is ready to own the front door too.'},
 {t:'dark',title:'Every booking through a platform is a guest who belongs to them, not to you.'},

 {t:'section',idx:'Part One',title:'Why The Platforms Feel Impossible To Leave'},
 {t:'normal',k:'The comfort trap',title:'The platforms are easy. Easy is what makes them expensive.',body:'Listing is simple, the bookings arrive, and you never have to think about marketing. That convenience is real, and it is exactly why the commission feels unavoidable. But easy has a price that never stops: a slice of every booking, forever, plus a business that only works while the platform keeps sending guests. Convenient today, fragile tomorrow.'},
 {t:'normal',k:'What it really costs',title:'You are not just paying commission. You are renting your whole guest list.',body:'The fee is the part you can see. The bigger cost is hidden. You do not own the guest relationship, you cannot email past guests to fill a quiet week, and your ranking can change overnight with no say from you. When the platform is your only channel, your calendar is only ever as full as they decide to make it.'},
 {t:'dark',title:'You are not short of guests. You are short of guests who know your name.'},

 {t:'section',idx:'Part Two',title:'The Direct Booking Blueprint'},
 {t:'normal',k:'Step one, know your guest',title:'Get specific about the one guest you are perfect for.',body:'Trying to appeal to everyone is why so many listings blur together. The blueprint starts by naming the exact guest your place is made for: who they are, what they are escaping, and what would make your cottage or glampsite the obvious yes. When you know that guest, your photos, your words and your whole offer stop being generic and start being magnetic.'},
 {t:'normal',k:'Step two, give a reason to book direct',title:'Make booking with you directly the easy, obvious choice.',body:'Guests will happily book direct when it is simple and clearly better for them. That means a site that loads and books in a few taps, a real reason to choose you over the platform listing, and the trust signals that make a stranger comfortable paying you directly. You keep the commission, and just as importantly, you keep the guest.'},
 {t:'normal',k:'Step three, market across the year',title:'Fill the quiet weeks on purpose, not by luck.',body:'Most owners market hard only when they panic about an empty week. The blueprint runs the other way: a simple rhythm across the whole year so the quiet seasons fill before they arrive. A little every week, aimed at the right guest, turns a calendar you hope fills into one you plan to fill.'},
 {t:'dark',title:'Direct bookings are not luck. They are a simple system you run every week.'},

 {t:'section',idx:'Part Three',title:'What Changes When The Bookings Are Yours'},
 {t:'normal',k:'The business this builds',title:'Keep the commission, own the guest, and let good stays repeat.',body:'When guests come to you directly, the maths changes and so does the business. Every booking keeps its full value instead of leaking a cut. Past guests become an asset you can reach any time, so a slow month is a quick email away from full. Great stays turn into repeat stays and word of mouth, because now the relationship is yours to keep.'},
 {t:'dark',title:'A calendar you fill on your own terms, with every penny staying with you.'},
 {t:'normal',k:'Why Sarah',title:'Thirty years in marketing, and a host who has done exactly this.',body:'Sarah Orchard spent thirty years in marketing, is a CIM Fellow and Chartered Marketer, and now runs her own treehouse stay. At launch she sold fifty stays in nineteen days, all direct, and has saved around a hundred thousand pounds in commission by booking guests herself. The blueprint is not theory. It is the exact approach she uses, taught simply enough to actually do.'},

 {t:'section',idx:'Your Next Step',title:'Fill Your Calendar'},
 {t:'normal',k:'Keep going with Sarah',title:'This masterclass is the map. Running it in your business is the work.',body:'What you just walked through is how direct bookings actually happen, in the right order. Doing it for your own place, with your own calendar and someone who has walked every step, is what the coaching and the Fully Booked Business Club are for. If any of this sounded like your business, that is exactly where to start.'},
 {t:'cta',title:'Ready to fill your calendar with direct bookings?',body:'Take the next step with Sarah and the Get Fully Booked team.',chips:['Book a call with Sarah','Join the Fully Booked Business Club'],disc:'Educational content for accommodation owners. No income or booking result is guaranteed. Results vary by property, market, and effort.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">SARAH <b>ORCHARD</b> · GET FULLY BOOKED</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map((c,ci)=>`<div class="chip${ci===0?'':' alt'}">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
