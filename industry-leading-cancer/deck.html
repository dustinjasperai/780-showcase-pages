<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Becoming a Certified Cancer Coach — The Cancer Wellness Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f5efe6; --panel:#e9ded0; --rule:#d7c9b8;
    --ink:#2b2622; --ink-muted:#6f5f52; --accent:#9c8b7e;
  }
  html,body { height:100%; }
  body { font-family:'Poppins',-apple-system,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  #stage { height:100vh; display:flex; align-items:center; justify-content:center; padding:6vh 7vw; }
  .slide { display:none; width:100%; max-width:960px; }
  .slide.on { display:block; animation:fade .3s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .eyebrow { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:22px; }
  h1 { font-family:'Spectral',Georgia,serif; font-weight:600; font-size:clamp(30px,5vw,56px); line-height:1.12; letter-spacing:-.01em; margin-bottom:20px; }
  h2 { font-family:'Spectral',Georgia,serif; font-weight:600; font-size:clamp(24px,3.6vw,40px); line-height:1.18; margin-bottom:22px; }
  .sub { font-size:clamp(15px,1.7vw,20px); color:var(--ink-muted); line-height:1.6; max-width:760px; }
  ul { list-style:none; margin-top:10px; }
  li { font-size:clamp(15px,1.7vw,20px); line-height:1.5; padding:11px 0 11px 26px; border-bottom:1px solid var(--rule); position:relative; }
  li::before { content:''; position:absolute; left:0; top:20px; width:10px; height:10px; background:var(--accent); border-radius:50%; }
  .big { font-family:'Spectral',Georgia,serif; font-size:clamp(26px,3.4vw,38px); line-height:1.3; }
  .part { color:var(--accent); font-family:'Spectral',serif; font-weight:600; }
  .card { background:var(--panel); border:1px solid var(--rule); border-left:4px solid var(--accent); padding:26px 28px; border-radius:4px; }
  .fine { font-size:13px; color:var(--ink-muted); line-height:1.55; margin-top:18px; }
  footer { position:fixed; bottom:18px; left:0; right:0; display:flex; justify-content:space-between; padding:0 7vw; font-size:12px; color:var(--ink-muted); letter-spacing:.04em; }
  .nav { position:fixed; bottom:16px; right:7vw; display:flex; gap:8px; }
  .nav button { font-family:'Poppins'; font-size:13px; border:1px solid var(--rule); background:var(--panel); color:var(--ink); padding:6px 14px; border-radius:20px; cursor:pointer; }
  .nav button:hover { border-color:var(--accent); }
</style>
</head>
<body>
<div id="stage"></div>
<footer><span>The Cancer Wellness Institute</span><span id="pageno"></span></footer>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S = [
  {t:'title', h:"Becoming a Certified Cancer Coach", sub:"How to support survivors with confidence, stay safely within scope, and build a real practice. A masterclass with Kara Kenan, Founder of The Cancer Wellness Institute."},
  {t:'who', eyebrow:"Who this is for", h:"You want to help people through cancer", list:["Aspiring coaches with no prior training who feel called to this work","Existing health, life, and wellness coaches ready to specialize","Oncology nurses, navigators, and survivors who want to guide others"]},
  {t:'promise', eyebrow:"What you'll leave with", h:"A clear map of the work", sub:"By the end you'll understand what cancer coaching is (and is not), the Pillars of Health that structure every plan, and exactly where coaching ends and clinical care begins."},
  {t:'trap', eyebrow:"The real problem", h:"Treatment ends. The support disappears.", sub:"Survivors ring the bell and go home to a quiet house with no plan. The medical team's job was the tumor. Nobody was assigned to the person who is left behind, exhausted, anxious, and trying to rebuild a life."},
  {t:'reframe', h:"Good intentions are not a method", sub:"Caring deeply is why you're here. It is not the same as being trained. Survivors have been hurt by well-meaning advice that pushed too hard, ignored trauma, or quietly crossed into medical territory. They deserve a trained, trauma-informed guide."},
  {t:'part', eyebrow:"Part One", h:"Why cancer coaching is its own profession"},
  {t:'field', eyebrow:"An emerging field", h:"The gap is enormous, and growing", sub:"There are more survivors alive today than at any point in history, and most are discharged into a support vacuum the moment active treatment stops. Cancer coaching exists to fill that gap with structure instead of guesswork."},
  {t:'part', eyebrow:"Part Two", h:"The Pillars of Health"},
  {t:'pillar', eyebrow:"Pillar 1", h:"Movement", sub:"Rebuilding strength and energy at the body's real pace after treatment, not a generic fitness template. Small, sustainable movement that restores confidence in a body that feels foreign."},
  {t:'pillar', eyebrow:"Pillar 2", h:"Nutrition", sub:"Cutting through the fear and the internet noise. Helping survivors eat in a way that supports recovery without turning food into another source of anxiety."},
  {t:'pillar', eyebrow:"Pillar 3", h:"Sleep and restoration", sub:"Fatigue is the most reported and least addressed effect of cancer. Coaching the rest, routines, and recovery that medicine rarely has time to."},
  {t:'pillar', eyebrow:"Pillar 4", h:"Stress", sub:"Scanxiety, fear of recurrence, and the weight of 'what now'. Practical tools to lower the daily load and build resilience that lasts past the appointment calendar."},
  {t:'pillar', eyebrow:"Pillar 5", h:"Emotional wellbeing", sub:"The identity question underneath all of it: who am I now? Holding space for grief and meaning while helping a survivor find their own path forward."},
  {t:'part', eyebrow:"Part Three", h:"Coaching safely: scope and ethics"},
  {t:'method', eyebrow:"The method", h:"Trauma-informed, always", sub:"You meet survivors where they are, not where a program says they should be. Trauma-informed coaching is the difference between a plan a survivor can actually follow and one that quietly re-injures them."},
  {t:'scope', eyebrow:"The boundary that protects everyone", h:"Where coaching stops", sub:"The single most important skill is knowing where coaching ends and clinical care begins. Clear scope, clear ethics, and clear referral language keep your clients safe and your practice credible."},
  {t:'skill', eyebrow:"The core skill", h:"Powerful questioning", sub:"Survivors don't need another person telling them what to do. They need someone trained to ask the question that unlocks their own next step. This is the craft of coaching, and it is learnable."},
  {t:'why', eyebrow:"Why learn it here", h:"Built by a survivor, held to a standard", sub:"I was diagnosed with breast cancer at 35. As a Certified Oncology Patient Navigator I saw exactly where survivors fall through the cracks. The curriculum is trauma-informed and approved for continuing education by NBHWC, UKIHCA, and HCANZA, and recognized by the ICF. This is a profession, not a weekend badge."},
  {t:'next', eyebrow:"Your next step", h:"Get certified in Cancer Coaching Foundations", sub:"The Foundations certification takes you from called to credentialed: survivorship fundamentals, the Pillars of Health, trauma-informed competencies, ethics and scope, and the business of building your practice."},
  {t:'cta', eyebrow:"Begin", h:"Start your Foundations certification", sub:"Enroll in Cancer Coaching Foundations at The Cancer Wellness Institute, or book a consultation to find the path that fits you.", fine:"Educational only. No specific income, enrollment, or client health result is guaranteed. Results vary with each coach, each survivor, and each practice. Coaching supports, and never replaces, a survivor's medical care team."}
];
let i=0;
const stage=document.getElementById('stage');
function render(){
  stage.innerHTML='';
  const s=S[i];
  const d=document.createElement('div'); d.className='slide on';
  let html='';
  if(s.eyebrow) html+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='part'){ html+=`<h1 class="part">${s.h}</h1>`; }
  else if(s.t==='title'||s.t==='cta'){ html+=`<h1>${s.h}</h1>`; if(s.sub) html+=`<p class="sub">${s.sub}</p>`; }
  else { html+=`<h2>${s.h}</h2>`; if(s.sub) html+=`<p class="sub">${s.sub}</p>`; }
  if(s.list){ html+='<ul>'+s.list.map(x=>`<li>${x}</li>`).join('')+'</ul>'; }
  if(s.fine){ html+=`<div class="card"><p class="fine">${s.fine}</p></div>`; }
  d.innerHTML=html; stage.appendChild(d);
  document.getElementById('pageno').textContent=(i+1)+' / '+S.length;
}
function go(n){ i=Math.max(0,Math.min(S.length-1,i+n)); render(); }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ') go(1); if(e.key==='ArrowLeft') go(-1); });
render();
</script>
</body>
</html>
