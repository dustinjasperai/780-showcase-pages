<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defy the Trend — The Rebellious Rest Method (Masterclass)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1ea;        /* warm oat paper (light scheme) */
    --panel:#ece5da;
    --rule:#ddd2c2;
    --ink:#2b2b33;
    --muted:#6b6458;
    --accent:#3a4473;    /* dusk indigo — her Substack brand accent */
    --accent-deep:#2a3156;
    --head:'Roboto Slab', serif;
    --body:'Nunito Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--rule);font-family:var(--body);color:var(--ink);padding:28px 16px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:60px 58px;min-height:432px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent-deep) 60%,var(--panel) 100%)}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.14;margin-bottom:16px}
  .sub{font-size:20px;color:var(--muted);line-height:1.5;max-width:40ch}
  .big{font-family:var(--head);font-weight:500;font-size:40px;line-height:1.18;max-width:22ch}
  .big .a{color:var(--accent)}
  ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:8px}
  li{font-size:20px;line-height:1.45;padding-left:30px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .pill{display:inline-block;font-family:var(--head);font-weight:700;font-size:18px;color:#fff;
    background:var(--accent);border-radius:999px;padding:4px 16px;margin-bottom:18px}
  .num{font-family:var(--head);font-weight:700;font-size:64px;color:var(--accent);opacity:.25;
    position:absolute;top:34px;right:48px}
  .foot{position:absolute;left:58px;bottom:24px;font-size:13px;color:var(--muted);letter-spacing:.04em}
  .note{margin-top:22px;font-size:14px;color:var(--muted);line-height:1.5;max-width:52ch}
  .idx{position:absolute;right:24px;bottom:22px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Nicole Havelka',
    h:'The Rebellious Rest Method',
    s:'How mid-life women recover from burnout without quitting the work they love.' },

  {t:'who', k:'Who this is for',
    h:'You are a helper who is running on empty',
    items:[
      'You are a mid-life woman doing work that matters: ministry, care, teaching, organizing, art.',
      'You are exhausted in a way sleep no longer fixes.',
      'And you will not walk away from the work, because the work is who you are.' ] },

  {t:'statement', k:'The trap',
    big:'You keep promising yourself rest <span class="a">after</span> the next hard thing. The next hard thing never stops coming.' },

  {t:'statement', k:'A harder truth',
    big:'Burnout is not a sign you are <span class="a">weak</span>. It is a sign the system is working exactly as designed.' },

  {t:'section', pill:'Part One', h:'Why pushing through makes it worse',
    s:'Grind culture tells you the answer to exhaustion is more discipline. That is the belief that keeps you stuck.' },

  {t:'bullets', k:'The cost of "just push through"',
    h:'What depletion actually does',
    items:[
      'Your nervous system stays locked in survival, so rest stops feeling possible.',
      'Your planning gets more rigid right when your capacity is shrinking.',
      'You start to believe the problem is you, not the pace you were handed.' ] },

  {t:'statement', k:'The reframe',
    big:'Rest is not the <span class="a">reward</span> for the work. Rest is the <span class="a">method</span> that lets you keep doing it.' },

  {t:'section', pill:'Part Two', h:'Rest as resistance',
    s:'The core of Defy the Trend: treating rest as a non-negotiable practice, not something you earn when everything is finally done.' },

  {t:'pillar', n:'01', h:'You are worthy of rest now',
    s:'No productivity required. We start by uncoupling your worth from your output, because every plan built on earning rest eventually collapses.' },

  {t:'pillar', n:'02', h:'De-adrenalize the body',
    s:'Guided Rest: short, trauma-informed, embodied practices that bring your nervous system out of survival so real recovery can begin. This is physiology, not willpower.' },

  {t:'pillar', n:'03', h:'Plan for the brain you actually have',
    s:'Good-Enough Planning: a flexible system built for an ADHD, perimenopausal or overworked brain. You do not need to be more organized. You need a calendar that respects your capacity.' },

  {t:'pillar', n:'04', h:'Boundaries rooted in your values',
    s:'Sustainability is not a betrayal of the mission. It is what lets you serve it for decades instead of flaming out in three years.' },

  {t:'section', pill:'Part Three', h:'What a rested life looks like',
    s:'Not a retreat from the work. A durable, honest pace that the work can be built on.' },

  {t:'bullets', k:'The shift',
    h:'What changes when rest becomes the method',
    items:[
      'A week planned around your real energy, with rest on the calendar before the work.',
      'A nervous system that can actually downshift, so sleep and joy come back.',
      'The same calling, carried at a pace that does not cost you your health.' ] },

  {t:'statement', k:'The decision',
    big:'You can love the work and still be running on empty. <span class="a">Both are true.</span> You get to change the second one.' },

  {t:'why', k:'Why me',
    h:'Nicole Havelka',
    items:[
      'Burnout recovery coach, ordained UCC clergyperson, and host of the Just Rest podcast.',
      '500-hour Registered Yoga Teacher and trauma-informed movement facilitator.',
      'A decade coaching and supporting helpers, healers, clergy and activists through Defy the Trend.' ] },

  {t:'recap', k:'The method, in one breath',
    h:'The Rebellious Rest Method',
    items:[
      'Worthy of rest now, no earning required.',
      'De-adrenalize the body with Guided Rest.',
      'Plan for the brain and capacity you actually have.',
      'Hold boundaries rooted in your values.' ] },

  {t:'cta', k:'Your next step',
    h:'Start building a burnout-resistant life',
    s:'If this is the work you want support with, schedule a session with Nicole and we will map your first rested week together.',
    note:'This masterclass is educational. It is not medical or mental-health treatment. No income, role, or result is guaranteed. Results vary from person to person.' }
];

const deck = document.getElementById('deck');
S.forEach((sl, i) => {
  const d = document.createElement('section');
  d.className = 'slide';
  let inner = '';
  if (sl.k) inner += `<div class="kicker">${sl.k}</div>`;
  if (sl.pill) inner += `<div class="pill">${sl.pill}</div>`;
  if (sl.n) inner += `<div class="num">${sl.n}</div>`;
  if (sl.t === 'title') {
    inner += `<h1>${sl.h}</h1><div class="sub">${sl.s}</div>`;
  } else if (sl.t === 'statement') {
    inner += `<div class="big">${sl.big}</div>`;
  } else if (sl.t === 'section') {
    inner += `<h2>${sl.h}</h2><div class="sub">${sl.s}</div>`;
  } else if (sl.t === 'pillar') {
    inner += `<h2>${sl.h}</h2><div class="sub">${sl.s}</div>`;
  } else if (sl.t === 'cta') {
    inner += `<h2>${sl.h}</h2><div class="sub">${sl.s}</div><div class="note">${sl.note}</div>`;
  } else if (sl.items) {
    if (sl.h) inner += `<h2>${sl.h}</h2>`;
    inner += '<ul>' + sl.items.map(x => `<li>${x}</li>`).join('') + '</ul>';
  }
  inner += `<div class="foot">Defy the Trend</div><div class="idx">${i+1} / ${S.length}</div>`;
  d.innerHTML = inner;
  deck.appendChild(d);
});
</script>
</body>
</html>
