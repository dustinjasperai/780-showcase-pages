<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead On Mission — The Consultant and the Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Taviraj:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f4f3ee;
    --panel:#ffffff;
    --rule:#e4e2da;
    --ink:#101033;
    --navy:#000037;
    --muted:#5b5b6b;
    --accent:#f29405;
    --display:'Bitter',serif;
    --body:'Taviraj',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ground);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.05;color:var(--navy);
    letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.12;color:var(--navy);
    margin-bottom:14px}
  .lede{font-size:21px;line-height:1.5;color:var(--ink);margin-top:18px;max-width:46ch}
  p{font-size:18px;line-height:1.55;color:var(--ink);margin-top:12px;max-width:54ch}
  .muted{color:var(--muted)}
  ul{margin:16px 0 0 0;padding:0;list-style:none}
  li{font-size:18px;line-height:1.5;padding:10px 0 10px 26px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .big{font-family:var(--display);font-weight:800;font-size:40px;color:var(--navy);line-height:1.1;max-width:20ch}
  .pill{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;
    color:var(--navy);background:#f3e2c6;border-radius:999px;padding:6px 14px;margin-bottom:16px}
  .num{font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.14em}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);
    margin-top:28px;max-width:960px;margin-left:auto;margin-right:auto;padding:0 20px}
  .cta h1{font-size:40px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;line-height:1.5;max-width:60ch}
  .brand{font-family:var(--display);font-weight:700;color:var(--navy)}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:34px}.big{font-size:30px}.lede{font-size:18px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot"><span class="brand">The Consultant and the Coach</span><span>Lead On Mission</span></div>
<script>
const S = [
  {t:'title',
   kicker:'A live masterclass for business leaders',
   h1:'Lead On Mission',
   lede:'How to stop drowning in the chaos by aligning your business structure and your own focus, at the same time.'},

  {t:'promise',
   kicker:'What you will leave with',
   h2:'A clearer next move, in three parts',
   body:'By the end of this session you will have a way to see the business and yourself as one problem, not two.',
   items:['A read on which half, structure or focus, is actually costing you right now.',
          'The three moves that pull a drifting company and a tired leader back on mission.',
          'A single sentence you can say out loud that your whole team can line up behind.']},

  {t:'who',
   kicker:'Who this is for',
   h2:'For the leader carrying all of it',
   body:'You run the company, hold the culture together, and answer to everyone. You are the owner, the strategist, and most days the therapist too.',
   items:['You are the most trusted person in the room, and the most tired.',
          'The strategy is in your head, not in the structure.',
          'You keep reacting to the chaos instead of leading through it.']},

  {t:'trap',
   kicker:'The trap',
   h2:'Working harder on the wrong half',
   body:'Most leaders try to fix this with more hustle or one more tool. So they tighten the business and ignore themselves, or they work on themselves and leave the business a mess. Either way the chaos wins.'},

  {t:'hook',
   kicker:'The reframe',
   big:'The problem was never your effort. It was that no one was looking at both halves at once.',
   body:'Structure without focus burns you out. Focus without structure goes nowhere. On mission means the two point the same direction.'},

  {t:'two', num:'TWO LEADERS, ONE CHAIR',
   h2:'You are doing two jobs at once',
   body:'Every day you switch between running the organization and holding yourself together. Nobody trained you to do both, and most help only covers one of them.'},

  {t:'partlabel', num:'PART ONE', h2:'Why clarity keeps slipping away',
   body:'The real cost of leading on instinct.'},

  {t:'part',
   kicker:'Part one',
   h2:'The cost of the fog',
   body:'When the mission lives only in your head, three things happen, and they compound.',
   items:['Your team guesses at priorities, so good people work hard on the wrong things.',
          'Every decision routes back to you, so you become the bottleneck you built.',
          'You lose the distance to see your own role in the chaos.']},

  {t:'partlabel', num:'PART TWO', h2:'The Lead On Mission framework',
   body:'Three moves, worked together, not in isolation. The consultant handles the outside view, the coach handles the inside one.'},

  {t:'part',
   kicker:'Pillar one, the structure',
   h2:'Make the structure work for you',
   body:'Before more effort, make the organization carry weight you are carrying by hand. Clarity on roles, priorities, and the one next outcome.',
   items:['Name the handful of outcomes the business actually runs on.',
          'Put each one on an owner who is not you.',
          'Give the team a scoreboard they can read without asking you.']},

  {t:'part',
   kicker:'Pillar two, the focus',
   h2:'Outrageous focus, on purpose',
   body:'Focus is not doing more, it is refusing the distractions that feel like progress. Lead courageously means you protect the few things that move the mission.',
   items:['Decide what you will stop doing this quarter, in writing.',
          'Guard a weekly block where you work on the business, not in it.',
          'Measure your week by the mission, not by how busy it felt.']},

  {t:'part',
   kicker:'Pillar three, the mission',
   h2:'Know your mission first',
   body:'Knowing your mission is the first step toward achieving it. A plan for the leader, not just the company, so the person leading does not quietly come apart.',
   items:['Write the mission plainly enough to say it in one breath.',
          'Align your calendar and your team to that one sentence.',
          'Check your own character and energy against it, not just the numbers.']},

  {t:'part',
   kicker:'Putting it together',
   h2:'Structure plus focus plus mission',
   body:'None of these works alone. Structure gives the business a spine, focus gives the week a filter, mission gives both a direction. Run together, the leader stops being the bottleneck and the chaos finally has somewhere to go.'},

  {t:'recap', num:'THE WHOLE MOVE',
   h2:'Structure, focus, mission, held together',
   body:'Keep all three in one hand. Drop one and the other two slowly stop working.',
   items:['Structure so the business carries weight you carry by hand today.',
          'Focus so your week protects the few things that move the mission.',
          'Mission so the leader and the company are pointed the same way.']},

  {t:'partlabel', num:'PART THREE', h2:'After you lead on mission',
   body:'A quieter, steadier kind of leading.'},

  {t:'part',
   kicker:'Part three',
   h2:'The leader who is on mission',
   body:'Nothing about the work got smaller. The difference is where the weight sits now.',
   items:['The team moves on priorities without routing every call through you.',
          'You spend your best hours on the mission, not on the fire of the day.',
          'You can name, out loud, the one thing the business is for right now.']},

  {t:'why',
   kicker:'Why a consultant and a coach',
   h2:'Two lenses, not one',
   body:'Most leaders get one or the other. A consultant who fixes the org and ignores the person, or a coach who tends the person and never touches the structure. The reason this works is that you get both looking at both halves at once, so the business and the leader move together.'},

  {t:'cta',
   kicker:'Your next step',
   h1:'Lead on mission, on purpose',
   body:'If you want a plan that treats the business and the leader as one problem, book a session with The Consultant and the Coach. We will look at your structure and your focus together and name the next move.',
   disclaimer:'This masterclass is educational and reflects the experience of The Consultant and the Coach. It is not business, financial, or legal advice, and no specific outcome is guaranteed. Results vary by leader and situation.'}
];

const deck=document.getElementById('deck');
function esc(x){return (x||'').toString()}
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t==='cta'?'cta':'');
  let h='';
  if(s.kicker) h+='<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.num) h+='<div class="num">'+esc(s.num)+'</div>';
  if(s.pill) h+='<div class="pill">'+esc(s.pill)+'</div>';
  if(s.h1) h+='<h1>'+esc(s.h1)+'</h1>';
  if(s.h2) h+='<h2>'+esc(s.h2)+'</h2>';
  if(s.big) h+='<div class="big">'+esc(s.big)+'</div>';
  if(s.lede) h+='<div class="lede">'+esc(s.lede)+'</div>';
  if(s.body) h+='<p>'+esc(s.body)+'</p>';
  if(s.items){h+='<ul>';s.items.forEach(i=>h+='<li>'+esc(i)+'</li>');h+='</ul>';}
  if(s.disclaimer) h+='<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
