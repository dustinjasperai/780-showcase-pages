<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 5-Star Marriage — a masterclass with Maggie Reyes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nixie+One&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f4;        /* warm near-white, site_scheme: light */
    --panel:#fceef4;     /* blush, from brand evidence */
    --rule:#e7cdd8;      /* muted blush tint */
    --accent:#2aa79e;    /* deepened brand aqua #73c9c3/#8ed2cd for contrast */
    --deep:#16706a;      /* deep aqua */
    --ink:#2b2340;       /* deep plum-charcoal */
    --muted:#6b6577;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);font-family:'Poppins',system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
  .stage{width:min(960px,96vw);aspect-ratio:16/10;background:var(--bg);border-radius:18px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .slide{position:absolute;inset:0;padding:7% 8%;display:none;flex-direction:column;justify-content:center;gap:18px}
  .slide.on{display:flex}
  .kicker{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--deep);font-weight:600}
  h1{font-family:'Nixie One',serif;font-weight:400;font-size:3.1rem;line-height:1.08;color:var(--ink)}
  h2{font-family:'Nixie One',serif;font-weight:400;font-size:2.3rem;line-height:1.12;color:var(--ink)}
  p{font-size:1.18rem;line-height:1.5;color:var(--ink);font-weight:300;max-width:46ch}
  p.lead{font-size:1.32rem;color:var(--muted)}
  .accent{color:var(--accent);font-weight:500}
  .panel{background:var(--panel);border-radius:14px;padding:26px 30px}
  ul{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:6px}
  li{font-size:1.12rem;font-weight:300;padding-left:30px;position:relative;line-height:1.4}
  li::before{content:'';position:absolute;left:0;top:.55em;width:12px;height:12px;border:2px solid var(--accent);border-radius:3px;transform:rotate(45deg)}
  .big{font-family:'Nixie One',serif;font-size:4.4rem;color:var(--accent);line-height:1}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .chip{background:#fff;border:1px solid var(--rule);border-radius:999px;padding:8px 16px;font-size:.98rem;color:var(--ink)}
  .disclaimer{font-size:.82rem;color:var(--muted);font-weight:300;max-width:52ch}
  .foot{position:absolute;bottom:18px;right:26px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;color:#fff;font-size:.85rem;font-family:'Poppins'}
  .nav button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.9rem}
  .count{opacity:.8}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="nav"><button onclick="go(-1)">Prev</button><span class="count" id="count"></span><button onclick="go(1)">Next</button></div>
<script>
const S=[
 {t:'title', h:`<div class="kicker">A live masterclass with Maggie Reyes</div>
   <h1>The 5-Star Marriage</h1>
   <p class="lead">How to upgrade a good marriage without waiting for your partner to change.</p>`},
 {t:'whofor', h:`<div class="kicker">Who this is for</div>
   <h2>The woman who runs everything, and still feels unseen at home</h2>
   <p>You are driven. You handle the career, the calendar, the people who depend on you. The one place your usual effort does not seem to move the needle is the marriage you care about most.</p>`},
 {t:'trap', h:`<div class="kicker">The trap</div>
   <h2>Waiting for him to change</h2>
   <p>So you wait. For him to notice, to step up, to agree to counseling. The waiting becomes the pattern, and the good marriage quietly runs on autopilot.</p>`},
 {t:'reframe', h:`<div class="kicker">The reframe</div>
   <h1>The marriage most at risk is not the one in crisis.</h1>
   <p class="lead">It is the good one left on autopilot while you pour your energy everywhere else.</p>`},
 {t:'p1head', h:`<div class="kicker">Part one</div><h1>The core problem</h1>
   <p class="lead">You have been taught that a marriage takes two people deciding to change at the same time. That is why it feels stuck.</p>`},
 {t:'p1body', h:`<div class="kicker">Part one</div>
   <h2>Two-person math keeps you powerless</h2>
   <p>If progress requires both of you to move together, then one reluctant partner can freeze the whole thing. You end up negotiating instead of leading.</p>`},
 {t:'p1cost', h:`<div class="panel"><div class="kicker">The cost</div>
   <h2>Years of a "fine" marriage</h2>
   <p>Not bad enough to leave, not warm enough to feel chosen. The slow fade is the real risk, and it does not announce itself.</p></div>`},
 {t:'p2head', h:`<div class="kicker">Part two</div><h1>A five-star standard</h1>
   <p class="lead">What if you ran your marriage the way a five-star hotel runs a stay: intentional, warm, held to a standard you set.</p>`},
 {t:'fivestar', h:`<div class="kicker">The 5-Star Marriage</div>
   <h2>Upgrade, do not rescue</h2>
   <p>A five-star hotel is not fixing a broken room. It is holding every detail to a standard. You are not here to save your marriage. You are here to <span class="accent">upgrade</span> it.</p>`},
 {t:'powerofone', h:`<div class="kicker">The Power of One</div>
   <h2>One person moves the whole system</h2>
   <p>In any relationship system, when one person changes how she shows up, the other responds to that change. You do not need his permission to start. You go first, on purpose.</p>`},
 {t:'loveupgrade', h:`<div class="kicker">The Love Upgrade</div>
   <h2>Seven deliberate upgrades</h2>
   <p>Small, repeatable moves that compound over time. Not grand gestures, upgrades. Here is the shape of them.</p>`},
 {t:'steps_a', h:`<div class="kicker">The Love Upgrade, 1 to 4</div>
   <ul>
     <li><span class="accent">Decide</span> the marriage matters enough to lead it.</li>
     <li><span class="accent">Declutter</span> the stored resentment that runs in the background.</li>
     <li><span class="accent">Bring your best self</span> instead of your most tired one.</li>
     <li><span class="accent">Take action</span>, the flirty and fun kind, on purpose.</li>
   </ul>`},
 {t:'steps_b', h:`<div class="kicker">The Love Upgrade, 5 to 7</div>
   <ul>
     <li><span class="accent">Build your love database</span>: notice and store what works.</li>
     <li><span class="accent">Ask the right questions</span> instead of making the case.</li>
     <li><span class="accent">Appreciate</span> out loud, specifically, often.</li>
   </ul>`},
 {t:'soul', h:`<div class="kicker">Soul-Centered Communication</div>
   <h2>Be heard without a fight</h2>
   <p>A solution-focused way to raise the hard thing so it moves you closer instead of becoming the argument you both already know by heart.</p>`},
 {t:'p3head', h:`<div class="kicker">Part three</div><h1>A marriage that feels five-star again</h1>
   <p class="lead">Not a different husband. A different dynamic, led by you.</p>`},
 {t:'looks', h:`<div class="row">
     <span class="chip">You lead instead of wait</span>
     <span class="chip">Conflict gets shorter</span>
     <span class="chip">Warmth comes back</span>
     <span class="chip">You feel chosen again</span>
   </div>
   <p>The change starts the week you stop waiting, because the one variable you control is the one that moves the system.</p>`},
 {t:'whyme', h:`<div class="kicker">Why me</div>
   <h2>Maggie Reyes, Modern Marriage Mentor</h2>
   <p>Master Certified Life Coach, host of the Marriage Life Coach Podcast (top 2 percent of all podcasts), and author of the best-selling Questions for Couples Journal. I teach ambitious women the relationship skills no one taught us in school.</p>`},
 {t:'cta', h:`<div class="kicker">Your next step</div>
   <h1>The Marriage MBA</h1>
   <p>A six-month mentorship to build your five-star marriage, one upgrade at a time. If this is the standard you want, the next step is to apply.</p>
   <div class="row"><span class="chip accent">Apply at maggiereyes.com</span></div>
   <p class="disclaimer">This masterclass is educational and is not therapy or a substitute for professional care. No specific result is guaranteed. Results vary from person to person.</p>`}
];
const stage=document.getElementById('stage');
const count=document.getElementById('count');
let i=0;
function render(){
  stage.innerHTML='';
  const s=S[i];
  const d=document.createElement('div');
  d.className='slide on';
  d.innerHTML=s.h+'<div class="foot">The 5-Star Marriage</div>';
  stage.appendChild(d);
  count.textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
