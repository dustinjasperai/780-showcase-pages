<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inside Out Coach — a masterclass with Dr Amar Dhall, Primal Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ee;      /* warm off-white ground, from brand #f0efef */
    --panel:#ffffff;
    --ink:#2b2622;     /* warm near-black */
    --muted:#6f6659;
    --accent:#c0803a;  /* deepened form of brand dominant #d1a054 */
    --rule:#e7e0d4;
    --head:'Montserrat',system-ui,sans-serif;
    --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 44px;margin:22px 0;min-height:360px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .slide.title{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.section{background:#fbf8f2}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:16px}
  .slide.title .kicker{color:var(--accent)}
  h1{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.12;margin-bottom:14px}
  h2{font-family:var(--head);font-weight:700;font-size:30px;line-height:1.16;margin-bottom:14px}
  p.lead{font-size:20px;color:var(--muted);max-width:62ch}
  .slide.title p.lead{color:#d8cfbd}
  ul{margin:14px 0 0 0;list-style:none}
  li{position:relative;padding-left:26px;margin:12px 0;font-size:18px;max-width:64ch}
  li:before{content:"";position:absolute;left:0;top:10px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .ring{width:120px;height:120px;border-radius:50%;border:3px solid var(--accent);
    display:flex;align-items:center;justify-content:center;margin:8px 0 18px}
  .ring span{width:60px;height:60px;border-radius:50%;background:var(--accent);opacity:.25}
  .note{margin-top:22px;font-size:14px;color:var(--muted);max-width:64ch}
  .page{font-family:var(--head);font-size:12px;color:var(--muted);text-align:right;margin-top:26px}
  .slide.title .page{color:#b7ad99}
  .big{font-size:48px;font-family:var(--head);font-weight:700;line-height:1.1}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Dr Amar Dhall', title:'The Inside Out Coach',
   lead:'Why who you are coaches louder than what you know.'},

  {t:'who', kicker:'Who this is for', title:'For the coach who does everything right',
   lead:'You trained. You got certified. You know the models and the questions.',
   bullets:['You are a coach, facilitator, or leader who wants to create real change.',
            'You have the frameworks. You can run a clean session.',
            'And still, sometimes, the person in front of you does not shift.']},

  {t:'trap', kicker:'The trap', title:'So you go looking for more technique',
   lead:'Another certification. Another model. Another set of questions to memorise.',
   bullets:['The industry is built to sell you the next credential.',
            'Each one helps a little. None of them fixes the real thing.',
            'Because the thing that was missing was never a technique.']},

  {t:'reframe', kicker:'The reframe', title:'Your clients do not respond to your technique',
   lead:'They respond to who you are being while you use it.'},

  {t:'section', kicker:'Part one', title:'The problem nobody certifies',
   lead:'Two coaches can ask the exact same question. One lands. One does not. The difference is not the question.'},

  {t:'point', kicker:'Part one', title:'Presence is the real instrument',
   bullets:['A client can feel, in seconds, whether you are with them or performing at them.',
            'When you are in your own head, running the script, they stay guarded.',
            'When you are settled and present, they open, and the work actually begins.',
            'No model works through a coach who is not there.']},

  {t:'point', kicker:'Part one', title:'Ego-driven dynamics quietly run the room',
   bullets:['Wanting to look competent. Needing the breakthrough. Fixing instead of being with.',
            'These are not character flaws. They are default settings.',
            'Left unexamined, they shape every session more than any framework does.']},

  {t:'section', kicker:'Part two', title:'The Inside Out Technology',
   lead:'The method behind everything we teach at Primal Intelligence: who you are is just as important as what you know.'},

  {t:'ring', kicker:'The core idea', title:'Change moves from the inside out',
   lead:'Shift who you are being first. What you do then changes on its own.'},

  {t:'point', kicker:'Pillar one', title:'Self-awareness before technique',
   bullets:['Notice the state you walk into the room carrying.',
            'Name the ego-driven pull before it drives the session.',
            'You cannot regulate what you cannot see.']},

  {t:'point', kicker:'Pillar two', title:'Emotional intelligence as the operating system',
   bullets:['Work with what is live in the room, not just the words.',
            'Your own regulated nervous system becomes the safe field the client borrows.',
            'Emotion is data, not an interruption to manage.']},

  {t:'point', kicker:'Pillar three', title:'Soul-centred, not ego-centred',
   bullets:['Replace needing to be the one who fixes with being the one who is present.',
            'Let the client keep authorship of their change.',
            'The less you grip, the more moves.']},

  {t:'point', kicker:'Pillar four', title:'Practice makes it real',
   bullets:['This is experiential, not theoretical. It is trained by being felt.',
            'Live reps, feedback, and reflection grow the inner capacity.',
            'That is why our work happens live and in community, never on autopilot.']},

  {t:'section', kicker:'Part three', title:'The same coach, a different room',
   lead:'Same models, same questions, a completely different session once presence leads.'},

  {t:'point', kicker:'In the room', title:'From performing to being with',
   bullets:['You stop rehearsing your next clever question.',
            'You slow down and actually meet the person.',
            'The client feels met, and says the thing they came to say.']},

  {t:'point', kicker:'The outcome', title:'Change that holds',
   bullets:['Sessions get deeper with less effort.',
            'Clients refer you because of how it felt to be coached by you.',
            'You stop chasing the next certificate to feel enough.']},

  {t:'why', kicker:'Why learn this here', title:'Primal Intelligence',
   lead:'We train coaches, facilitators, and leaders in the Inside Out method.',
   bullets:['Led by Dr Amar Dhall, author, facilitator, and coach.',
            'The Inside Out Coaching Course: a live, experiential certification journey.',
            'A living community of coaches practising this work together.']},

  {t:'recap', kicker:'In one line', title:'Who you are is just as important as what you know',
   lead:'Train the inner half, and every technique you already have starts to work.'},

  {t:'cta', kicker:'Your next step', title:'Join the Inside Out Coaching Course',
   lead:'Come and learn to coach from the inside out, live and in community with us.',
   bullets:['Reserve your place in the next live cohort.',
            'Or join one of our free community rooms to experience the method first.'],
   note:'This masterclass is educational. Results vary from person to person; nothing here is a guarantee of income, certification, or specific outcomes.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t==='title'?'title':(s.t==='section'?'section':''));
  let h = '';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='ring') h += '<div class="ring"><span></span></div>';
  h += (s.t==='title' ? '<h1>'+s.title+'</h1>' : '<h2>'+s.title+'</h2>');
  if(s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if(s.bullets){ h += '<ul>'; s.bullets.forEach(b=> h+='<li>'+b+'</li>'); h += '</ul>'; }
  if(s.note) h += '<div class="note">'+s.note+'</div>';
  h += '<div class="page">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
