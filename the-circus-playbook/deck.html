<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Trained to Booked — a masterclass with Coach Elise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0ece6;        /* brand warm cream (brand.json, 20 uses) */
    --panel:#faf7f2;     /* lightened cream */
    --ink:#130f0b;       /* brand warm near-black (brand.json, 6 uses) */
    --muted:#6f6656;     /* stone-derived muted, from #ada390 family */
    --rule:#ada390;      /* brand stone */
    --accent:#caa649;    /* brand signature gold (brand.json, 9 uses) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto}
  .slide{
    background:var(--bg);
    min-height:540px;
    padding:64px 72px;
    margin:22px 0;
    border-radius:4px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);border-radius:4px 0 0 4px}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:20px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:58px;line-height:1.04;color:var(--ink);margin-bottom:18px}
  h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;line-height:1.1;color:var(--ink);margin-bottom:22px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:62ch;margin-bottom:14px}
  p.sub{color:var(--muted);font-size:21px}
  .lead{font-size:24px;line-height:1.5}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding-left:26px;position:relative;margin-bottom:16px;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .pillar{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;color:var(--ink)}
  .pillar small{display:block;font-family:'Inter';font-size:17px;font-weight:400;color:var(--muted);margin-top:5px;line-height:1.5}
  .big{font-family:'Cormorant Garamond',serif;font-size:46px;line-height:1.12;color:var(--ink);font-weight:600}
  .brandline{position:absolute;bottom:28px;left:72px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .pageno{position:absolute;bottom:28px;right:72px;font-size:12px;color:var(--muted)}
  .cta .btn{display:inline-block;margin-top:14px;background:var(--accent);color:#1a1305;font-weight:600;padding:15px 30px;border-radius:3px;font-size:18px}
  .disclaimer{margin-top:28px;font-size:13px;color:var(--muted);max-width:66ch;line-height:1.5}
  .cred{display:grid;grid-template-columns:1fr 1fr;gap:12px 36px;margin-top:8px}
  .cred li{margin-bottom:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A masterclass with Coach Elise',h1:'From Trained to Booked',sub:'How to turn years of aerial training into a professional, paid performing career.'},
 {t:'promise',eyebrow:'What you will leave with',h2:'The path from the studio to the stage contract',body:['By the end of this session you will know the exact difference between an aerialist who trains hard and an aerialist who gets booked, and the steps that move you from one to the other.','This is the path I teach my own students across silks, hoop and straps.']},
 {t:'who',eyebrow:'Who this is for',h2:'You can already do the work',body:['You train seriously. You are landing drops, cleaning transitions, building strength. Your skills are real.','And still the contracts, the agents and the world-class shows feel like they belong to someone else.']},
 {t:'trap',eyebrow:'The trap',h2:'More skills is not the same as a career',body:['So you drill harder. You buy another workshop. You post another reel. You wait to be discovered.','The training stacks up. The bookings do not. It is the quiet loop almost every talented aerialist gets stuck in.']},
 {t:'reframe',eyebrow:'The reframe',big:'The industry does not book the best trickster. It books the complete professional artist who can be their own agent.'},
 {t:'two',eyebrow:'Two aerialists',big:'Put two aerialists with the same skills side by side. One is booked a year out. One is still waiting to be found. The gap between them is never talent.'},
 {t:'part',eyebrow:'Part one',h2:'Why skill alone stalls your career',body:['A paid performing career sits on three things most aerial training never touches. Name them and you can close them.']},
 {t:'gap',eyebrow:'Gap one',h2:'The artistry gap',body:['Clean skills are not yet an act. An act has a through line, a character and a moment a director remembers after a hundred auditions.','Tricks get applause. A point of view gets the contract.']},
 {t:'gap',eyebrow:'Gap two',h2:'The business gap',body:['Most aerialists have no portfolio, no usable resume, no headshots and no idea how directors and agents actually hire.','The work exists. You are simply invisible to the people paying for it.']},
 {t:'gap',eyebrow:'Gap three',h2:'The access gap',body:['You do not yet know the rooms, the auditions or the people who say yes, and nobody in a recreational class is going to hand you that map.','Access is learnable. It is not luck.']},
 {t:'framework',eyebrow:'Part two',h2:'The Complete Professional Circus Artist',body:['The method I teach develops you from every angle, not skills in isolation. Four pillars carry it.']},
 {t:'pillar',eyebrow:'Pillar one',pillar:'Technical and Artistic Mastery',desc:'Advanced big drops, unique artistic transitions, creative movement and choreography, and performance technique, built step by step to a professional stage level across silks, hoop and straps.'},
 {t:'pillar',eyebrow:'Pillar two',pillar:'The Signature Act',desc:'Act creation and choreography direction. How a bookable act is built on purpose: a through line, a character and a moment directors remember, not a string of tricks.'},
 {t:'pillar',eyebrow:'Pillar three',pillar:'Be Your Own Agent',desc:'The business curriculum. Portfolio, resume and headshots, how to audition for world-class shows, and how to pitch and talk to the directors and agents who book the work.'},
 {t:'pillar',eyebrow:'Pillar four',pillar:'The Whole Athlete',desc:'A full conditioning and fitness system built for aerial bodies, so the career you build is one you can sustain for years without breaking down.'},
 {t:'practice',eyebrow:'Part three',h2:'How my students actually train week to week',body:['A professional does not only train skills. Each week carries a training block, an act-development block, and a business block: reaching out, auditioning, keeping the portfolio alive.','The business hours are the ones that turn skill into income, and they are the hours almost every aerialist skips.']},
 {t:'cred',eyebrow:'Why learn this from me',h2:'I have lived both sides of it',creds:['Aerial coach and performer at La Perle by Dragone, where I created the aerial hoop act in the show.','Signed with Cirque du Soleil, and years in arena shows, cruise, corporate and cabaret.','Around 20 years performing and 12 years running my own school.','Hundreds of show and agent contacts, and a podcast with the directors who do the hiring.']},
 {t:'bridge',eyebrow:'The point',big:'Your skills are the hard part, and you already did it. The career is a system, and a system can be taught.'},
 {t:'cta',eyebrow:'Your next step',h2:'Start booking the stage',body:['If you want the full path, my professional-development program gives you the video curriculum, the business curriculum, the fitness system, and one-to-one coaching on your own apparatus with me and my team.'],btn:'Start your professional development',disclaimer:'This masterclass is educational. It shares the training and career approach I use with my students. It is not a guarantee of bookings, income or any specific result. Outcomes depend on your own training, effort and circumstances.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide '+(s.t||'');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.sub) h+='<p class="sub lead">'+s.sub+'</p>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.big) h+='<p class="big">'+s.big+'</p>';
  if(s.body) s.body.forEach(p=>h+='<p>'+p+'</p>');
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li>'+b+'</li>');h+='</ul>';}
  if(s.pillar) h+='<p class="pillar">'+s.pillar+'<small>'+s.desc+'</small></p>';
  if(s.creds){h+='<ul class="cred">';s.creds.forEach(b=>h+='<li>'+b+'</li>');h+='</ul>';}
  if(s.btn) h+='<div><span class="btn">'+s.btn+'</span></div>';
  if(s.disclaimer) h+='<p class="disclaimer">'+s.disclaimer+'</p>';
  h+='<div class="brandline">Coach Elise &middot; Aerial Professional Development</div>';
  h+='<div class="pageno">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=h;deck.appendChild(d);
});
</script>
</body>
</html>
