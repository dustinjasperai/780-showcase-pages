<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Price for the Outcome · Robin Waite, Fearless Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f8f3ea; --panel:#ffffff; --rule:#ece3d4;
    --acc:#e04e39; --ink:#283645; --body:#414a54; --dim:#8a8f97; --cream:#faf6ef;
  }
  html,body{height:100%}
  body{background:#e6ded0;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e6ded0}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Gelasio',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.16;letter-spacing:.002em}
  .t-title h1{font-size:4.8vw;max-width:94%}
  .t-normal h1{font-size:3.2vw;max-width:90%}
  .t-normal h1 b{color:var(--acc);font-weight:600}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.66;font-weight:400}
  .sub{font-family:'Gelasio',serif;font-size:1.95vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.44;font-weight:400;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh;border-radius:3px}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#31465b 0%,#283645 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#31465b 0%,#283645 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Inter',sans-serif;color:#d7dde4;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .lp-motif{position:absolute;pointer-events:none}
  .title-lp{right:7.5%;bottom:8%;width:14vw;opacity:.95}
  .corner-lp{right:6.5%;bottom:7.5%;width:7vw;opacity:.45}
  .brandline{font-family:'Inter',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(40,54,69,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Fearless Business · Robin Waite</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a price tag, drawn in the brand coral -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lp" viewBox="0 0 120 120">
  <g fill="none" stroke="#e04e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 18 L100 58 A6 6 0 0 1 100 66 L66 100 A6 6 0 0 1 58 100 L18 60 L18 22 A4 4 0 0 1 22 18 Z" opacity="0.9"/>
    <circle cx="38" cy="38" r="7" opacity="0.95"/>
    <path d="M52 74 L74 52" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Price for the Outcome, Not the Hour',sub:'How coaches, consultants and freelancers escape the hourly trap, package one clear offer, and charge what the result is worth.',brand:true,lp:'title'},
 {t:'normal',k:'Who this is for',title:'You are brilliant at the work. What you charge for it is the part that keeps you stuck.',body:'You deliver real results for the people you work with. But the price is still tied to your time, an hour here, a day there, a number you quietly discount the moment someone hesitates. If your income has a ceiling and that ceiling is the number of hours in your week, this hour is for you.'},
 {t:'dark',title:'The problem was never that you undercharge. It is that you are still selling hours.'},

 {t:'section',idx:'Part One',title:'The Pricing Problem'},
 {t:'normal',k:'Why more clients will not fix it',title:'More clients do not cure an underpriced business. They multiply the problem.',body:'When the pricing is wrong, every new client compounds the same low margins, the same overdelivery, the same exhaustion. You work more and keep less. Chasing volume on top of a broken price is how good coaches burn out while looking busy and successful from the outside.'},
 {t:'normal',k:'The hourly ceiling',title:'An hourly rate caps you at the number of hours you can survive.',body:'Sell time and you compete with every other person selling time, on a scale that tops out fast. The client is buying an hour, so that is all they value. The moment you price the transformation instead of the clock, the ceiling moves, because the outcome is worth far more than the time it takes you to deliver it.'},
 {t:'dark',title:'You do not have a lead problem. You have a pricing problem wearing a lead problem for a disguise.'},

 {t:'section',idx:'Part Two',title:'The Fearless Business Blueprint'},
 {t:'normal',k:'Turn a service into a product',title:'Three tests turn an hourly service into a <b>productised offer.</b>',body:'A productised offer passes three tests. One, it is teachable and repeatable, so it is a method and not a mood. Two, it delivers a clear Dream Outcome the client can picture before they buy. Three, it is priced at a fixed fee for a fixed timeframe, so the price is attached to the result, not to how many hours you happen to spend.'},
 {t:'normal',k:'Charge for the result',title:'Decouple the price from the hours, and the number stops being about you.',body:'Years ago I productised a design process and charged many times the going rate for the same work, because clients were buying the result and no longer the hours. The mechanics are the same for a coach. Package the outcome, name a fixed fee, and the conversation moves off your time and onto the change you create.'},
 {t:'normal',k:'The Three Pricing Mistakes',title:'Three habits quietly keep your price low, and all three are fixable.',body:'One, discounting before anyone pushes back, offering a payment plan or a bit of flex the prospect never asked for. Two, reverting to an hourly number in the room even though a fixed-fee product exists, because the smaller number feels safer. Three, adding a bonus module or an extra call instead of holding the price. Name these and you can stop doing them.'},
 {t:'dark',title:'Action creates belief, not the other way around. You raise the price first, and the confidence follows.'},

 {t:'section',idx:'Part Three',title:'Charge It With Confidence'},
 {t:'normal',k:'The Pricing Auction',title:'A ten minute exercise that moves your price before your nerves catch up.',body:'Write down your current productised price. Raise it in steps and notice exactly where your stomach tightens, because that flinch is the belief, not the market. Then pitch your next three prospects at the higher number, without apologising or explaining it away, and watch what actually happens over the next thirty days. The number holds far more often than the fear predicts.'},
 {t:'normal',k:'Then fill the room',title:'With the price right, lead flow becomes simple and mostly free.',body:'Once the offer is productised and priced, you do not need a social media treadmill to fill it. A book that quietly does the selling, a talk or a podcast guesting spot in front of the right audience, a handful of real partnerships. Fewer, better conversations with people who already understand the value before they ever speak to you.'},
 {t:'normal',k:'What changes',title:'One clear offer, better clients, and a price you can say out loud.',body:'You end up with a single packaged offer instead of a menu you improvise. You attract clients who want the outcome rather than the cheapest hour. And you can state your price in a sentence, without the nervous discount, because you have already tested that it holds. That is what fearless pricing actually feels like day to day.'},
 {t:'dark',title:'You are not your rates. You are the outcome you create, and it is time your price said so.'},

 {t:'normal',k:'Why Robin Waite',title:'The pricing coach for coaches, consultants and freelancers.',body:'I am Robin Waite, founder of Fearless Business and author of Take Your Shot. I host the Fearless Business Podcast and have spent years helping coaches, consultants and freelancers productise their services and charge with confidence. This masterclass is the short version of the method I teach my clients every week.'},

 {t:'section',idx:'Your Next Step',title:'Fearless Business'},
 {t:'normal',k:'Keep going with Robin',title:'Take the method further, with coaching built around your offer.',body:'This hour is the map. A free coaching session is the simplest next step, a real conversation about your offer and your price. And the Fearless Business Accelerator is where you build the productised offer, the pricing and the lead flow into your actual business, alongside a coach who has done it.'},
 {t:'cta',title:'Ready to price for the outcome, not the hour?',body:'Take the next step with Fearless Business.',chips:['Book a free coaching session','Apply for the Accelerator'],disc:'Educational content for coaches, consultants and freelancers. Examples are illustrative, and no specific financial result is guaranteed. Results vary by person and business.'},
];

const deck=document.getElementById('deck');
function lp(kind){return `<svg class="lp-motif ${kind==='title'?'title-lp':'corner-lp'}"><use href="#lp"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Fearless <b>Business</b> · Robin Waite</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.lp) h+=lp(s.lp);
  else if(s.t==='title') h+=lp('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
