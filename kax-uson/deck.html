<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside-Out Leadership — a live masterclass with Kax Uson</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe7;        /* warm cream ground, from her light editorial brand */
    --panel:#ebe3d6;     /* panel */
    --rule:#dccfbd;      /* hairline rule */
    --ink:#363737;       /* her dominant charcoal text (brand.json) */
    --muted:#7a7268;     /* muted warm gray */
    --accent:#c06836;    /* her warm orange accent (brand.json) */
    --deep:#7a5a3d;      /* deep warm support tone */
    --head:'Roboto Slab',Georgia,serif;   /* her heading face */
    --body:'Inter',system-ui,sans-serif;  /* body */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 100px}
  .slide{background:var(--bg);border:1.5px solid var(--rule);border-radius:16px;padding:60px 58px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:0 10px 30px rgba(90,64,40,.06)}
  .num{position:absolute;top:22px;right:28px;font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .kick{font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  .mark{display:inline-flex;gap:8px;align-items:center;margin-bottom:22px}
  .mark i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .mark .o{background:transparent;border:2.5px solid var(--accent)}
  .mark .f{background:var(--accent)}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.12}
  .sub{font-size:23px;line-height:1.5;color:#4a4f5c;margin-top:22px;max-width:40ch}
  .divider{background:var(--ink);border-color:var(--ink)}
  .divider .kick{color:#e6b58f}
  .divider h2{color:var(--bg);font-size:46px}
  .divider .sub{color:#d9cdbb}
  ul.items{margin-top:26px;list-style:none;display:flex;flex-direction:column;gap:16px}
  ul.items li{font-size:22px;line-height:1.4;padding-left:38px;position:relative;color:#43474f}
  ul.items li::before{content:'';position:absolute;left:0;top:9px;width:16px;height:16px;border-radius:5px;border:2.5px solid var(--accent)}
  .pillars{margin-top:30px;display:grid;grid-template-columns:1fr;gap:18px}
  .pillar{border:1.5px solid var(--rule);border-left:5px solid var(--accent);border-radius:12px;padding:22px 26px;background:var(--panel)}
  .pillar .pn{font-family:var(--head);font-weight:600;font-size:25px;color:var(--ink)}
  .pillar .pd{font-size:19px;line-height:1.45;color:#4a4f5c;margin-top:7px}
  .big{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.08;color:var(--ink)}
  .big .a{color:var(--accent)}
  .cta h1{font-size:50px}
  .cta .step{margin-top:26px;font-size:24px;font-weight:600;color:var(--accent)}
  .disc{margin-top:40px;padding-top:20px;border-top:1px solid var(--rule);font-size:14px;line-height:1.5;color:var(--muted);max-width:60ch}
  .foot{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-top:12px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Inside-Out Leadership · a live masterclass with Kax Uson</div>
<script>
const S = [
  {t:'title', k:'A live masterclass', h:'Inside-Out Leadership', s:'The half of leadership no one trains product people on.'},
  {t:'promise', h:'By the end of this hour', items:[
    'Why technical skill alone stops carrying you the moment you lead',
    'The two sides of leadership, and the one you were never taught',
    'A simple way to lead yourself first, so the rest gets easier']},
  {t:'who', h:'Who this is for', items:[
    'New and aspiring product leaders',
    'PMs, designers and engineers stepping into their first lead role',
    'Anyone who got the title and quietly wondered, now what']},
  {t:'reframe', k:'The trap', big:'You got the title. <span class="a">Now what.</span>', s:'Most new leaders pour everything into the visible work and still feel like they are faking it.'},
  {t:'reframe', k:'The hard truth', big:'The internal patterns <span class="a">leak into the execution.</span>', s:'How you handle feedback, conflict and priorities is set by defaults you have never looked at.'},
  {t:'divider', k:'Part One', h:'The problem no one names', s:'Leadership has two sides, and only one of them gets trained.'},
  {t:'point', h:'The visible side', s:'Hiring, roadmaps, performance reviews, goal alignment. The work that gets measured and rewarded. You will get plenty of help here.'},
  {t:'point', h:'The shadow side', s:'Your values, your energy patterns, your default reactions. Nobody puts this on an onboarding plan, and it quietly runs the show.'},
  {t:'point', h:'So competence is not enough', s:'You can know every framework and still stall, because the inside half is driving the decisions you think you are making on logic.'},
  {t:'divider', k:'Part Two', h:'Inside-Out Leadership', s:'Lead yourself first. Three moves to start.'},
  {t:'framework', h:'Leading yourself starts here', pillars:[
    {pn:'Curiosity', pd:'Examine your autopilot reactions and where they came from, instead of acting them out.'},
    {pn:'Strength awareness', pd:'Recognise the talents you already have, rather than only chasing the gaps.'},
    {pn:'Embracing failure', pd:'Treat setbacks as learning and data, not as a threat to who you are.'}]},
  {t:'point', h:'What this changes', s:'Leading yourself means noticing your defaults and being honest about whether they still serve you, so you can decide when to hold your ground and when to adjust.'},
  {t:'reframe', k:'The order matters', big:'Courage <span class="a">comes before confidence.</span>', s:'You do not wait to feel ready. You build the capacity to act, and the confidence follows.'},
  {t:'framework', h:'A 90-day way to practise it', pillars:[
    {pn:'Clarify', pd:'Define your ideal twelve-month vision and what you actually want.'},
    {pn:'Define your ideal self', pd:'Name the version of you who achieves it, and the beliefs and decisions that version holds.'},
    {pn:'Systems for emergence', pd:'Build the daily habits and awareness practices that let that version show up consistently.'}]},
  {t:'divider', k:'Part Three', h:'When you lead yourself first', s:'What changes once the inside half is doing its job.'},
  {t:'point', h:'You stop managing fear', s:'The energy you spent saying yes to everything and delaying decisions goes back into the work that matters, and the burnout eases.'},
  {t:'point', h:'You lead like yourself', s:'Not a copy of the last leader you had. You hold your ground where it counts and adjust where it does not, on purpose.'},
  {t:'why', h:'Why me', s:'I am a Head of Product with over a decade building products, and I have coached and mentored more than 100 women in tech. I write How to Build What Feels Good for product leaders and builders.'},
  {t:'cta', h:'Start leading from the inside out', step:'Book a discovery call to map your first 90 days.', s:'If this is the kind of leader you want to become, let us talk about what it looks like for you.', disc:'This masterclass is educational. Results vary and depend on your own effort and circumstances. Nothing here is a promise or guarantee of any specific outcome.'}
];
const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'divider' ? ' divider' : '') + (s.t === 'cta' ? ' cta' : '');
  let html = '<div class="num">' + (i+1) + ' / ' + S.length + '</div>';
  if (s.t === 'title') {
    html += '<div class="mark"><i class="o"></i><i class="f"></i></div>';
    html += '<div class="kick">' + s.k + '</div><h1>' + s.h + '</h1><div class="sub">' + s.s + '</div>';
  } else if (s.t === 'promise' || s.t === 'who') {
    html += '<h2>' + s.h + '</h2><ul class="items">' + s.items.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  } else if (s.t === 'reframe') {
    if (s.k) html += '<div class="kick">' + s.k + '</div>';
    html += '<div class="big">' + s.big + '</div>';
    if (s.s) html += '<div class="sub">' + s.s + '</div>';
  } else if (s.t === 'divider') {
    html += '<div class="kick">' + s.k + '</div><h2>' + s.h + '</h2><div class="sub">' + s.s + '</div>';
  } else if (s.t === 'point' || s.t === 'why') {
    html += '<h2>' + s.h + '</h2><div class="sub">' + s.s + '</div>';
  } else if (s.t === 'framework') {
    html += '<h2>' + s.h + '</h2><div class="pillars">' + s.pillars.map(p => '<div class="pillar"><div class="pn">' + p.pn + '</div><div class="pd">' + p.pd + '</div></div>').join('') + '</div>';
  } else if (s.t === 'cta') {
    html += '<div class="mark"><i class="o"></i><i class="f"></i></div>';
    html += '<h1>' + s.h + '</h1><div class="step">' + s.step + '</div><div class="sub">' + s.s + '</div><div class="disc">' + s.disc + '</div>';
  }
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
