<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activate Your Inner Author - a live masterclass with Carolyn Flower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --panel:#f2ebe2; --ink:#2a2320; --muted:#6b5f57; --accent:#9a4d63; --line:#e0d4c6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif}
  .deck{max-width:960px;margin:0 auto}
  .slide{background:var(--bg);min-height:560px;padding:72px 80px;display:flex;flex-direction:column;justify-content:center;border-bottom:3px solid var(--ink);position:relative;overflow:hidden}
  .slide.alt{background:var(--panel)}
  .eyebrow{font-family:'Bebas Neue',sans-serif;letter-spacing:.22em;color:var(--accent);font-size:20px;margin-bottom:22px;text-transform:uppercase}
  h1{font-family:'Bebas Neue',sans-serif;font-size:74px;line-height:.98;letter-spacing:.01em;color:var(--ink)}
  h2{font-family:'Bebas Neue',sans-serif;font-size:50px;line-height:1.04;color:var(--ink);margin-bottom:20px}
  p{font-size:26px;line-height:1.5;color:var(--ink);max-width:42ch}
  p.lead{font-size:30px}
  .muted{color:var(--muted)}
  .big{font-size:40px;line-height:1.3}
  ul{list-style:none;margin-top:18px}
  li{font-size:26px;line-height:1.5;padding-left:34px;position:relative;margin-bottom:16px}
  li::before{content:"";position:absolute;left:0;top:14px;width:16px;height:16px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg)}
  .num{font-family:'Bebas Neue',sans-serif;font-size:120px;color:var(--accent);line-height:.8;opacity:.9}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:30px 34px;margin-top:22px}
  .slide.alt .panel{background:var(--bg)}
  .rule{width:68px;height:4px;background:var(--accent);margin:26px 0}
  .kicker{font-family:'Bebas Neue',sans-serif;letter-spacing:.14em;font-size:22px;color:var(--muted);margin-top:28px}
  .bloom{position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50% 50% 50% 0;background:var(--panel);transform:rotate(-45deg);opacity:.6}
  .slide.alt .bloom{background:var(--bg)}
  .disc{font-size:18px;color:var(--muted);margin-top:30px;max-width:56ch}
  .ctahead{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Carolyn Flower', h:'Activate Your Inner Author', rule:true, lead:'Why your book is stuck in your head, and the inside-out method that finally gets it onto the page.', bloom:true},

  {t:'audience', eyebrow:'Who this is for', h2:'You already know the book is in you', ps:['You have lived something worth writing. The ideas show up in the shower, in the car, in the margins of other people’s books.','What you do not have yet is a finished manuscript. And it has been that way for a while.']},

  {t:'problem', eyebrow:'The trap', h2:'Three years of "writing a book"', bullets:['Notes in four apps and no first draft.','You start, you reread, you decide it is not good enough, you stop.','Every writing course you buy teaches craft, and still the page stays blank.'], kicker:'So you assume you need more time, or more talent.'},

  {t:'reframe', eyebrow:'The reframe', h:'You do not have writer’s block.', rule:true, big:'You have an inner author you have not activated yet.', bloom:true},

  {t:'part', eyebrow:'Part One. The real problem', h2:'The page is a mindset before it is a manuscript', ps:['Success starts on the inside. Your thinking controls the result, and the result you want is a book.'], panel:'When you sit down to write, you are not fighting the blank page. You are fighting the beliefs you hold about whether you are an author at all.'},

  {t:'part', eyebrow:'Part One', h2:'Craft cannot fix an identity problem', ps:['Editing before you have activated the author is like pruning a plant you never planted.','This is why writing harder does not work. The order is backwards.']},

  {t:'part', eyebrow:'Part One', h2:'What the backwards order costs you', bullets:['Years, not weeks. The someday book stays someday.','The story that only you can tell goes untold.','You start to believe the block is who you are, instead of where you started.']},

  {t:'partcover', alt:true, eyebrow:'Part Two. The method', h:'Shape Your Story', rule:true, lead:'Draw the story from the inside out, and the first draft begins to write itself.'},

  {t:'part', alt:true, eyebrow:'Part Two. The principle', h2:'Inside out, in that order', ps:['We shape the author, then we shape the story. The beliefs and the manuscript grow together, which is why the writing stops feeling like a fight.'], panel:'Three moves, in sequence. Skip the first and the other two never hold.'},

  {t:'step', num:'1', h2:'Activate the author', ps:['Before a word is shaped, we settle the inner question. You decide, on purpose, that you are the author of this story. The identity comes first.']},

  {t:'step', num:'2', h2:'Draw it from your head to the page', ps:['Then we pull the story out of you: conceptualize it, organize it, and commit the content to the page. Not perfect, not polished. On the page.']},

  {t:'step', num:'3', h2:'Shape it into a first draft', ps:['With the moving parts in front of you, the manuscript takes shape with clarity, confidence, and ease. You are writing with structure instead of hoping for a good day.']},

  {t:'part', eyebrow:'Part Two', h2:'What changes when the order is right', bullets:['You stop collecting notes and start finishing chapters.','The inner critic has a job again: later, in editing, not now.','Thirty focused days produce what three unfocused years could not.']},

  {t:'part', eyebrow:'Part Three. Your manuscript in your hands', h2:'From a head full of ideas to a finished draft', ps:['This is the same path my authors walk inside the VIP Author Immersion: the story shaped from the inside out, draft finished, ready for the world.']},

  {t:'part', eyebrow:'Part Three', h2:'And then the reader meets you', ps:['The legacy was never the pile of notes. It is the book in a stranger’s hands, the lived experience that finally reached the person who needed it.']},

  {t:'why', eyebrow:'Why me', h2:'I have helped authors grow since 1992', ps:['I am Carolyn Flower, bestselling author of Gravitate 2 Gratitude and founder of an independent publishing house that has guided authors from idea to impact.','My whole work is one idea: transform lived experience into a meaningful, lasting legacy.']},

  {t:'why', eyebrow:'Why me', h2:'Mindset is not a side note here. It is the method.', ps:['I was trained in the material that teaches thinking into results, and I built Shape Your Story so that an author’s beliefs and their manuscript grow together.']},

  {t:'cta', eyebrow:'Your next step', h2:'Ready to activate your inner author?', lead:'If you are serious about finishing the book that is already in you, let’s shape your story together.', panel:'Book a free author discovery call with me, and we will map the path from where your story sits now to a finished first draft.', disc:'This masterclass is educational. It shares a method and a way of thinking about authorship. No specific result, income, or publishing outcome is guaranteed. Results vary and depend entirely on the author.', bloom:true}
];

function esc(s){return s;}
const deck = document.getElementById('deck');
S.forEach(function(s){
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.alt ? ' alt' : '');
  let html = '';
  if(s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.num) html += '<div class="num">'+s.num+'</div>';
  if(s.h) html += '<h1'+(s.t==='cta'?' class="ctahead"':'')+'>'+s.h+'</h1>';
  if(s.h2) html += '<h2'+(s.t==='cta'?' class="ctahead"':'')+'>'+s.h2+'</h2>';
  if(s.rule) html += '<div class="rule"></div>';
  if(s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if(s.big) html += '<p class="big">'+s.big+'</p>';
  if(s.ps) s.ps.forEach(function(p){ html += '<p>'+p+'</p>'; });
  if(s.bullets){ html += '<ul>'; s.bullets.forEach(function(b){ html += '<li>'+b+'</li>'; }); html += '</ul>'; }
  if(s.panel) html += '<div class="panel"><p>'+s.panel+'</p></div>';
  if(s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if(s.disc) html += '<p class="disc">'+s.disc+'</p>';
  if(s.bloom) html += '<div class="bloom"></div>';
  sec.innerHTML = html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
