<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Heart of Sales — A Live Masterclass with Tiffany Cheung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b1a1d;
    --panel:#262329;
    --rule:#3a3640;
    --accent:#a5d5e5;
    --ink:#f3eef0;
    --muted:#b9b2bb;
    --display:"Cormorant", Georgia, serif;
    --body:"Poppins", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    position:relative;background:linear-gradient(180deg,#201e23 0%, var(--bg) 100%);
    border:1px solid var(--rule);border-radius:18px;
    padding:64px 56px;margin:22px 0;min-height:440px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::after{content:"";position:absolute;top:-120px;right:-120px;width:320px;height:320px;
    background:radial-gradient(circle, rgba(165,213,229,0.16) 0%, rgba(165,213,229,0) 70%);pointer-events:none}
  .eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;font-weight:400}
  h1{font-family:var(--display);font-weight:600;font-size:52px;line-height:1.08;letter-spacing:.01em}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.12;margin-bottom:18px}
  .lede{font-family:var(--display);font-style:italic;font-size:26px;color:var(--muted);line-height:1.4;margin-top:20px}
  p{font-size:17px;line-height:1.7;color:var(--ink);max-width:62ch;margin-top:14px;font-weight:300}
  .muted{color:var(--muted)}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  li{position:relative;padding-left:26px;font-size:17px;line-height:1.5;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .pill{display:inline-block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 14px;border-radius:999px;font-weight:500;margin-bottom:20px;width:max-content}
  .big{font-family:var(--display);font-size:72px;font-weight:600;color:var(--accent);line-height:1}
  .framework{display:grid;gap:12px;margin-top:24px}
  .framework .row{border-left:2px solid var(--accent);padding:4px 0 4px 18px}
  .framework .row b{font-family:var(--display);font-size:22px;font-weight:600;display:block;color:var(--ink)}
  .framework .row span{color:var(--muted);font-size:15px}
  .foot{position:absolute;bottom:22px;left:56px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--rule)}
  .cta h1{font-size:46px}
  .disclaimer{margin-top:28px;font-size:12.5px;color:var(--muted);line-height:1.6;max-width:70ch}
  .count{position:absolute;bottom:22px;right:56px;font-size:12px;color:var(--rule);letter-spacing:.2em}
  @media(max-width:640px){.slide{padding:44px 26px;min-height:auto}h1{font-size:36px}.big{font-size:52px}.foot,.count{left:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "Heart Artistry";
const S = [
  {t:'title', eyebrow:'A live masterclass with Tiffany Cheung',
   h:'The Heart of Sales',
   lede:'How heart-centered coaches turn "maybe later" into "I’m in" without a single pushy funnel.'},

  {t:'who', eyebrow:'Who this is for',
   h:'For the coach, healer or creative who knows they are meant for more',
   body:'You have the gift. You have the audience. You have poured your heart into the work. What you do not have yet is a way to make the sale feel as aligned as the service itself.'},

  {t:'trap', eyebrow:'The trap',
   h:'You were told the answer is more',
   list:['More content, more posting, more hustle.','More followers before you are allowed to sell.','More funnels, more tactics, more borrowed scripts that do not sound like you.'],
   body:'So you do more, and selling still feels like performing. That is not a you problem. It is a method problem.'},

  {t:'reframe', eyebrow:'The reframe',
   h:'Selling is not louder. Selling is magnetic.',
   lede:'The people meant for your work do not need to be convinced. They need to feel understood, and then shown the way in.'},

  {t:'cost', eyebrow:'The cost of the push',
   h:'Every pushy pitch teaches your audience to brace',
   body:'When selling feels like a performance, your people learn to flinch when you show up with an offer. The quiet damage is not a lost sale today. It is an audience that stops trusting the invitation.'},

  {t:'part', pill:'Part One', h:'Why the "maybe later" happens',
   body:'A "maybe later" is almost never about money. It is about safety. The lead cannot yet feel that this will work for them. Close that gap and the yes becomes obvious.'},

  {t:'points', eyebrow:'The real objection',
   h:'Three things a soft offer is missing',
   list:['Resonance: they do not yet feel seen in your words.','Proof of fit: they cannot picture it working for their life.','A clear, kind next step: no path that feels safe to take.']},

  {t:'part', pill:'Part Two', h:'The Heart of Sales method',
   body:'This is the work I take my clients through. Four movements, each one a layer most coaches skip, which is exactly why their selling feels like a push.'},

  {t:'framework', eyebrow:'The method',
   h:'Align, Awaken, and sell from the heart',
   rows:[
     {b:'Align', s:'Belief work, energy and identity so you sell from fullness, not fear.'},
     {b:'Magnetic Messaging', s:'The words that move a "maybe later" to "take my money" without the ick.'},
     {b:'Money Energetics', s:'Your relationship with receiving, so high-ticket feels clean to offer.'},
     {b:'Soulful Selling', s:'A kind, clear invitation that honors the person on the other side.'}
   ]},

  {t:'deep', eyebrow:'Movement one',
   h:'Align before you ever ask',
   body:'If you do not believe the offer is a clear yes, your audience will feel the hesitation before they read the price. Alignment is not a vibe. It is the groundwork that makes everything after it land.'},

  {t:'deep', eyebrow:'Movement two',
   h:'Magnetic Messaging',
   list:['Name the exact ache in their words, not yours.','Show the bridge, not just the destination.','Make the next step feel like relief, not risk.'],
   body:'This is the difference between content that gets saved and content that gets bought.'},

  {t:'deep', eyebrow:'Movement three',
   h:'Money Energetics',
   body:'High cash months are not an accident and they are not only strategy. The way you hold money changes the way you offer it. We clear the static so your price stops feeling like an apology.'},

  {t:'deep', eyebrow:'Movement four',
   h:'Soulful Selling',
   body:'The invitation is the whole thing. A clear, kind ask that holds the person on the other side with respect. No scarcity theatre, no fake countdowns. Just the truth of what you offer and a safe door to walk through.'},

  {t:'promise', eyebrow:'In one live hour',
   h:'What you walk away holding',
   list:['The exact reason your current offer gets a "maybe later".','The messaging move that turns it into a clear yes.','A sense of how a five-figure launch actually gets built.']},

  {t:'part', pill:'Part Three', h:'When selling finally feels like service',
   body:'When the four movements are in place, selling stops being the hard part. Here is what my clients feel on the other side.'},

  {t:'points', eyebrow:'The after',
   h:'The shift',
   list:['People reply "take my money" before you finish the pitch.','Launches that land in the five figures, on repeat.','Selling feels like service, because it finally is.']},

  {t:'why', eyebrow:'Why me',
   h:'I built this the hard way',
   body:'I was laid off in 2020. I built Heart Artistry from zero, hit six figures in about eight months, and crossed two hundred thousand in my first year, with launches that stayed in the five figures. The Heart of Sales is the method underneath all of it. It is what I now teach inside Magicmind.'},

  {t:'cta', eyebrow:'Your next step',
   h:'Ready to sell from the heart?',
   body:'If this is the way you have always wanted to sell, the next step is simple. Come apply to work with me inside Magicmind, where we take the Heart of Sales from a method you understand to a business that runs on it.',
   disclaimer:'This masterclass is educational. Every business is different and results depend on many factors, including your offer, your audience and your own effort. Nothing here is a guarantee of income or specific results.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck = document.getElementById('deck');
S.forEach((s, i)=>{
  const sl = el('section','slide'+(s.t==='cta'?' cta':''));
  if(s.pill) sl.appendChild(el('span','pill',s.pill));
  if(s.eyebrow) sl.appendChild(el('div','eyebrow',s.eyebrow));
  if(s.t==='title'){ sl.appendChild(el('h1',null,s.h)); if(s.lede) sl.appendChild(el('div','lede',s.lede)); }
  else { sl.appendChild(el('h2',null,s.h)); }
  if(s.lede && s.t!=='title') sl.appendChild(el('div','lede',s.lede));
  if(s.body) sl.appendChild(el('p',null,s.body));
  if(s.list){ const ul=el('ul'); s.list.forEach(x=>ul.appendChild(el('li',null,x))); sl.appendChild(ul); }
  if(s.rows){ const fr=el('div','framework'); s.rows.forEach(r=>{const row=el('div','row'); row.appendChild(el('b',null,r.b)); row.appendChild(el('span',null,r.s)); fr.appendChild(row);}); sl.appendChild(fr); }
  if(s.disclaimer) sl.appendChild(el('div','disclaimer',s.disclaimer));
  sl.appendChild(el('div','foot',BRAND));
  sl.appendChild(el('div','count',(i+1)+' / '+S.length));
  deck.appendChild(sl);
});
</script>
</body>
</html>
