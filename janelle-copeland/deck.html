<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Profitable Baker — a live masterclass with Janelle Copeland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2efe9; --panel:#fbf7f1; --rule:#e4dccf;
    --ink:#3a3330; --muted:#6c6c6c;
    --accent:#b170a2; --pop:#df885c;
    --serif:'Prata',Georgia,serif;
    --sans:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:400;font-size:56px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.15}
  .promise{font-family:var(--serif);font-size:26px;color:var(--muted);margin-top:20px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:58ch}
  p.lead{font-size:21px;color:var(--muted);margin-top:16px}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:62ch}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .big{font-family:var(--serif);font-size:68px;line-height:1.04;letter-spacing:-.01em}
  .big .pop{color:var(--pop)}
  .sub{font-size:20px;color:var(--muted);margin-top:22px;max-width:56ch}
  .section-k{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--pop)}
  .section-t{font-family:var(--serif);font-size:48px;margin-top:10px}
  .cred{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}
  .cred div{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:16px 20px;min-width:150px}
  .cred b{font-family:var(--serif);font-size:32px;display:block;color:var(--accent)}
  .cred span{font-size:14px;color:var(--muted)}
  .cta h2{font-size:44px}
  .cta .step{font-size:21px;margin-top:22px}
  .disc{font-size:13px;color:var(--muted);margin-top:30px;max-width:64ch;line-height:1.5}
  .num{font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:12px}
  .by{font-family:var(--sans);font-size:15px;color:var(--muted);margin-top:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass',h:'The Profitable Baker',
   promise:'Price for profit, run like a CEO, and scale to consistent $10K months.',
   by:'with Janelle Copeland, founder of The Cake Mamas'},
  {t:'who',eyebrow:'Who this is for',h:'You are booked, busy, and still broke.',
   p1:'You make beautiful work. Customers keep coming back. But the deposits never seem to turn into money you get to keep, and you are quietly wondering if this is just what owning a bakery feels like.',
   p2:'It is not. You were never taught the business. You are about to be.'},
  {t:'content',eyebrow:'The trap',h:'"If I just get more orders, it will fix itself."',
   p:'So you take on more. More late nights, more stress, more volume. And the bank balance barely moves, because the problem was never how much you sell. It is what happens to the money after you do.'},
  {t:'hook',eyebrow:'The reframe',big:'Revenue is <span class="pop">not</span> profit.',
   sub:'Selling $2,000 of desserts last weekend does not mean you made $2,000. Booked and busy is not the same as profitable. Until you know the difference, every price is a guess.'},
  {t:'section',k:'Part One',ttl:'Where the money really goes'},
  {t:'content',h:'You priced the cake. You never priced the business.',
   p:'Knowing you spent $47 at the store is not the same as knowing what one cookie costs to make. Most bakers set a price off a feeling, a competitor, or a round number, then wonder why a full calendar still leaves nothing in the bank.'},
  {t:'list',h:'The costs hiding under every order',
   items:['Your labor, counted as a real wage, not an afterthought',
          'Overhead: rent, utilities, insurance, software, cards',
          'Packaging, boxes, boards, and the waste nobody tracks',
          'The hours of admin, driving, and messaging you do for free']},
  {t:'section',k:'Part Two',ttl:'Pricing for Profit'},
  {t:'content',h:'Start with true cost per unit',
   p:'Break every recipe down to the cost of a single finished item: ingredients to the ounce, labor to the minute, overhead per hour of production. Once you know that number, a price stops being a guess and becomes a decision.'},
  {t:'list',h:'The pricing shifts that change the math',
   items:['Margin vs markup: the gap that quietly eats your profit',
          'Capacity vs volume: more orders is not more money',
          'Raising rates without losing the clients worth keeping',
          'Pricing for the dream client, not the bargain hunter']},
  {t:'content',h:'Charge what the work is actually worth',
   p:'When your price reflects the real cost plus the margin a business needs to survive, the right buyer says yes faster and the wrong one stops draining you. Premium pricing is not arrogance. It is how the bakery stays open.'},
  {t:'section',k:'Part Three',ttl:'Run it like a CEO'},
  {t:'content',h:'Work ON the bakery, not just IN it',
   p:'The oven does not need you to also be the bookkeeper, the marketer, and the dishwasher forever. Simple systems and written SOPs turn a business that depends on you into one that runs with you, so a good month can happen again on purpose.'},
  {t:'content',h:'A $10K month you can repeat',
   p:'Consistent months do not come from working harder on the weekends. They come from pricing that holds, offers that sell, and systems that keep it all moving without you touching every step. That is the whole game.'},
  {t:'cred',eyebrow:'Why listen to me',h:'I built the bakery before I taught the business.',
   p:'I started The Cake Mamas after a bankruptcy, with no money and no business experience, and learned every one of these lessons the expensive way.',
   stats:[['2','storefronts opened'],['20+','team members led'],['Millions','in desserts sold'],['2&times;','Food Network champion']]},
  {t:'content',h:'What changes when the numbers work',
   p:'You stop trading more hours for the same empty bank account. You take home a real wage. You choose the orders you want. And the business becomes something you could grow, sell, or simply enjoy, instead of something that owns you.'},
  {t:'cta',eyebrow:'Your next step',h:'Ready to build a bakery that actually pays you?',
   step1:'If today lit something up, the Baking Business Accelerator is where we do this together: a 12-week, high-touch program to price for profit, install the systems, and build toward consistent $10K months. It is application-only and kept intentionally small.',
   step2:'Apply for the Baking Business Accelerator at janellecopeland.com.',
   disc:'For educational purposes only. No income or specific result is guaranteed. Results vary with your market, effort, and circumstances.'}
];
function render(s){
  if(s.t==='title') return `<div class="eyebrow">${s.eyebrow}</div><h1>${s.h}</h1><div class="promise">${s.promise}</div><div class="by">${s.by}</div>`;
  if(s.t==='who') return `<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><p class="lead">${s.p1}</p><p class="lead">${s.p2}</p>`;
  if(s.t==='content') return `${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<h2>${s.h}</h2><p class="lead">${s.p}</p>`;
  if(s.t==='hook') return `<div class="eyebrow">${s.eyebrow}</div><div class="big">${s.big}</div><div class="sub">${s.sub}</div>`;
  if(s.t==='section') return `<div class="section-k">${s.k}</div><div class="section-t">${s.ttl}</div>`;
  if(s.t==='list') return `<h2>${s.h}</h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(s.t==='cred') return `<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><p class="lead">${s.p}</p><div class="cred">${s.stats.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`;
  if(s.t==='cta') return `<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><p class="step">${s.step1}</p><p class="step"><strong>${s.step2}</strong></p><div class="disc">${s.disc}</div>`;
  return '';
}
document.getElementById('deck').innerHTML = S.map((s,i)=>
  `<section class="slide ${s.t==='cta'?'cta':''}"><div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>${render(s)}</section>`
).join('');
</script>
</body>
</html>
