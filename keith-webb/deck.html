<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead by Coaching: The COACH Model Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f3; --panel:#f1efe6; --rule:#d8d3c4;
    --ink:#2f3a19; --body:#43452f; --muted:#6b6d55;
    --accent:#637e37; --accent-deep:#2f3a19;
    --head:'Spectral',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--accent-deep);font-family:var(--sans);color:var(--body);padding:32px 0}
  .deck{max-width:960px;margin:0 auto;padding:0 20px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:64px 64px;margin:0 auto 26px;min-height:540px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:28px;font-size:12px;color:var(--muted);letter-spacing:.14em}
  .kick{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--head);font-weight:700;font-size:56px;line-height:1.05;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.1;color:var(--ink)}
  .promise{font-family:var(--head);font-weight:500;font-style:italic;font-size:26px;color:var(--body);margin-top:22px;max-width:42ch}
  .lead{font-size:22px;line-height:1.5;color:var(--body);margin-top:18px;max-width:46ch}
  .big{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.2;color:var(--ink);max-width:40ch}
  .brand{margin-top:40px;font-weight:600;color:var(--accent-deep);letter-spacing:.02em}
  .brand span{color:var(--muted);font-weight:400}
  ul{margin-top:22px;list-style:none}
  li{font-size:20px;line-height:1.45;color:var(--body);padding-left:28px;position:relative;margin-bottom:16px;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:3px}
  .fw{display:flex;align-items:baseline;gap:20px}
  .fw .letter{font-family:var(--head);font-weight:700;font-size:92px;color:var(--accent);line-height:1}
  .fw .word{font-family:var(--head);font-weight:600;font-size:40px;color:var(--ink)}
  .fw-body{font-size:21px;line-height:1.5;color:var(--body);margin-top:20px;max-width:46ch}
  .section-mark{width:60px;height:5px;background:var(--accent);border-radius:3px;margin-bottom:26px}
  .cta-box{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:30px 34px;margin-top:26px}
  .cta-box .step{font-weight:600;color:var(--ink);font-size:22px;margin-bottom:8px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:28px;max-width:60ch;line-height:1.5}
  .quote{font-family:var(--head);font-style:italic;font-weight:500;font-size:30px;color:var(--ink);line-height:1.3;max-width:40ch}
  .quote cite{display:block;font-style:normal;font-size:16px;color:var(--accent);margin-top:18px;font-family:var(--sans);font-weight:600}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:'A live masterclass for ministry leaders',
    h1:'Lead by Coaching',
    promise:'The three questions that get your people to own their own growth.',
    brand:'Creative Results Management', brandsub:'with Dr. Keith E. Webb, PCC' },

  {t:'content',
    kick:'Who this is for',
    big:'For the leader everyone brings their problems to.',
    lead:'Pastors, missionaries, and nonprofit leaders who are tired of being the only one with the answers, and who want the people around them to grow.' },

  {t:'content',
    kick:'The trap',
    big:'You became the answer. Now nothing moves without you.',
    lead:'Advice feels helpful in the moment. But people rarely own what they are told, so they keep coming back, and you keep carrying it all.' },

  {t:'quote',
    quote:'The most faithful thing you can do is often to stop giving the answer.',
    cite:'The shift this masterclass is about' },

  {t:'section', kick:'Part One', h2:'Why telling stops working' },

  {t:'content',
    big:'Telling creates dependence. Asking creates ownership.',
    lead:'When you hand someone your answer, it stays yours. When you help them find their own, they carry it out the door and act on it.' },

  {t:'quote',
    quote:'The purposes of a person’s heart are deep waters, but one who has insight draws them out.',
    cite:'Proverbs 20:5' },

  {t:'content',
    big:'The move: from expert to guide.',
    lead:'You do not lose your wisdom. You change how you use it, from delivering conclusions to drawing out what God has already put into the person in front of you.' },

  {t:'section', kick:'Part Two', h2:'The COACH Model' },

  {t:'framework', letter:'C', word:'Connect',
    body:'Pick up where you left off. Build trust and follow up on the action steps from last time, so the conversation has continuity and momentum.' },
  {t:'framework', letter:'O', word:'Outcome',
    body:'Agree on the result they want from this conversation. A clear outcome keeps the dialogue honest and focused instead of wandering.' },
  {t:'framework', letter:'A', word:'Awareness',
    body:'Ask the questions that produce their own insight. This is where the real work happens: they see something they could not see before.' },
  {t:'framework', letter:'C', word:'Course',
    body:'Turn insight into concrete next steps they choose. Ideas without a course of action change nothing by Monday morning.' },
  {t:'framework', letter:'H', word:'Highlights',
    body:'Have them summarize what mattered. When they say it back in their own words, the learning consolidates and sticks.' },

  {t:'content',
    kick:'One conversation, start to finish',
    big:'Five steps, one flow.',
    lead:'Connect opens the door. Outcome aims it. Awareness does the lifting. Course turns it into action. Highlights makes it stick. The whole arc fits one normal conversation.' },

  {t:'section', kick:'Part Three', h2:'What it looks like' },

  {t:'content',
    big:'A leader who multiplies, not a bottleneck.',
    lead:'Volunteers start taking ownership. Staff stop waiting to be told. The problems that used to land on your desk get solved by the people closest to them.' },

  {t:'content',
    kick:'Why learn this here',
    big:'Twenty years of teaching this, built into one model.',
    lead:'Dr. Keith Webb is a PCC-credentialed coach and past President of the ICF Washington State chapter. He spent twenty years leading in Japan, Indonesia and Singapore, wrote seven books including The COACH Model for Christian Leaders, and built an ICF-accredited certification used by leaders worldwide.' },

  {t:'content',
    kick:'Your next step',
    big:'Go deeper with the certification.',
    lead:'This masterclass is the first taste. The Coaching Mastery Certificate is where you build the skill into muscle memory, with live practice and ICF-approved training hours toward your own credential.' },

  {t:'cta',
    kick:'Take the next step',
    h2:'Lead by coaching, starting this week.',
    step1:'Join the free live workshop to practice the three skills.',
    step2:'Then enroll in the Coaching Mastery Certificate to learn the full COACH Model.',
    disclaimer:'This training is educational. Coaching outcomes depend on the person and their context, and no specific result or income is promised or guaranteed.' }
];

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section'); el.className='slide';
  let html='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.kick) html+='<div class="kick">'+esc(s.kick)+'</div>';
  if(s.t==='title'){
    html+='<h1>'+esc(s.h1)+'</h1>';
    if(s.promise) html+='<div class="promise">'+esc(s.promise)+'</div>';
    html+='<div class="brand">'+esc(s.brand)+' <span>'+esc(s.brandsub||'')+'</span></div>';
  } else if(s.t==='section'){
    html+='<div class="section-mark"></div><h2>'+esc(s.h2)+'</h2>';
  } else if(s.t==='framework'){
    html+='<div class="fw"><div class="letter">'+esc(s.letter)+'</div><div class="word">'+esc(s.word)+'</div></div>';
    html+='<div class="fw-body">'+esc(s.body)+'</div>';
  } else if(s.t==='quote'){
    html+='<div class="quote">“'+esc(s.quote)+'”<cite>'+esc(s.cite)+'</cite></div>';
  } else if(s.t==='cta'){
    html+='<h2>'+esc(s.h2)+'</h2>';
    html+='<div class="cta-box"><div class="step">1. '+esc(s.step1)+'</div><div class="step">2. '+esc(s.step2)+'</div></div>';
    html+='<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
  } else {
    if(s.big) html+='<div class="big">'+esc(s.big)+'</div>';
    if(s.lead) html+='<div class="lead">'+esc(s.lead)+'</div>';
    if(s.items){html+='<ul>';s.items.forEach(x=>html+='<li>'+esc(x)+'</li>');html+='</ul>';}
  }
  el.innerHTML=html; deck.appendChild(el);
});
</script>
</body>
</html>
