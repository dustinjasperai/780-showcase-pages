<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Growth Assessment Masterclass &middot; Doug Howard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F5F4EE; --panel:#E3DDC7; --rule:#CFC6A8;
    --acc:#A15A2E; --idx:#8B6A3F; --chalk:#23324A; --grey:#48566B; --dim:#8B8368;
  }
  html,body{height:100%}
  body{background:#1B2434;font-family:'Archivo',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1B2434}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:3.9vw;max-width:88%}
  .t-normal h1{font-size:2.9vw;max-width:84%}
  .t-normal .body{font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.58;font-weight:400}
  .sub{font-size:1.6vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Archivo',sans-serif;font-size:1.35vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.2vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#2C3E5C 0%,#161E2C 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.2vw;max-width:86%;font-style:italic;color:#F3F1E8;font-weight:500}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#2C3E5C 0%,#161E2C 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.5vw;max-width:82%;color:#F3F1E8}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid #D68A4C;color:#F3E4D2;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-dark .disc,.t-cta .disc{color:#9AA6BE}
  .t-title .disc,.t-normal .disc{text-align:left}
  .signal-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-signal{right:6%;bottom:6%;width:16vw}
  .corner-signal{right:5%;bottom:6.5%;width:8vw;opacity:.5}
  .brandline{font-size:1.24vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#9AA6BE;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9AA6BE;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#9AA6BE;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.3vw}.t-section h1{font-size:6.4vw}.t-dark h1{font-size:5.4vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 18</div>
<div class="brand-foot">Growth Team Strategies</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- signal motif: concentric growth rings (wood grain / growth), not a generic radial -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rings" viewBox="0 0 260 260">
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <ellipse cx="130" cy="130" rx="110" ry="102" stroke="#A15A2E" opacity="0.75" stroke-dasharray="16 9"/>
    <ellipse cx="126" cy="134" rx="80" ry="74" stroke="#C08654" opacity="0.5" stroke-dasharray="11 8"/>
    <ellipse cx="132" cy="128" rx="50" ry="46" stroke="#8B6A3F" opacity="0.35" stroke-dasharray="7 6"/>
    <ellipse cx="129" cy="131" rx="22" ry="20" stroke="#23324A" opacity="0.22" stroke-dasharray="5 5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Growth Assessment Masterclass',sub:'A live strategic growth session for wood flooring company owners, built from Doug Howard\'s Growth Assessment approach.',brand:true,signal:'title'},
 {t:'normal',k:'Who this is for',title:'You built a real wood flooring business. Growth still runs through you.',body:'Every big decision, every hire, every hard call from a job site still lands on your desk. That is not a flaw in how you run things. It is what happens when nobody has ever sat down with you and turned your instincts into a written plan.'},
 {t:'dark',title:'A business that only grows when the owner personally pushes it is not a business yet. It is a very demanding job.'},

 {t:'section',idx:'Part One',title:'Why "Work Harder" Stops Working'},
 {t:'normal',k:'The trap',title:'More hours does not buy more growth.',body:'Past a certain size, a wood flooring company cannot out-hustle its way to the next stage. The owner is already the busiest person in the building. What is missing is not effort. It is a plan built by someone outside the daily fire who has done this before.'},
 {t:'normal',k:'What actually caps growth',title:'Nobody has ever priced out what "no plan" costs you.',body:'Every year without a written strategic plan is a year of decisions made on instinct instead of numbers: who to hire next, which jobs to chase, what a fair price on a big remodel-and-flooring job actually is. That adds up quietly, year over year.'},
 {t:'dark',title:'The owners who break through are not the ones who work the most hours. They are the ones who stop being the only person doing the thinking.'},

 {t:'section',idx:'Part Two',title:'The Growth Team Strategies Approach'},
 {t:'normal',k:'Strategic planning',title:'A real plan, not a New Year\'s resolution.',body:'Where the business is actually headed, in writing: revenue targets, the jobs worth chasing, the ones worth turning down, and what has to be true a year from now for the plan to have worked.'},
 {t:'normal',k:'Process streamlining',title:'The parts of the job that should not need the owner.',body:'Estimating, scheduling, crew handoffs, follow-up after the install. Every one of these can run without the owner personally checking it, once it is written down as a process instead of living in someone\'s head.'},
 {t:'normal',k:'Profitability enhancement',title:'Growing revenue is not the same as growing profit.',body:'A busier calendar can still be a worse year if pricing, job costing, and overhead are not tracked closely. Profitability work means knowing which jobs actually make money before you are mid-installation, not after.'},
 {t:'dark',title:'Strategic planning, process, and profitability are not three separate projects. They are the same plan, looked at from three angles.'},

 {t:'section',idx:'Part Three',title:'Where The Growth Assessment Leads'},
 {t:'normal',k:'How it starts',title:'The Growth Assessment: a real look at where the business stands.',body:'Before any plan gets written, the starting point gets mapped honestly: what is working, what is quietly costing money, and where the owner is still the bottleneck. That is the free first step, and it is the one this masterclass is built from.'},
 {t:'normal',k:'Why Doug Howard',title:'Wharton training, applied to trade businesses for thirty years.',body:'Doug Howard studied economics, marketing and entrepreneurial management at the Wharton School, then spent three decades consulting with growing businesses, including a run as Director of Consulting Services at Remodelers Advantage. He works directly with NWFA to build growth content for wood flooring companies specifically.'},

 {t:'section',idx:'Your Next Step',title:'See Where Your Business Actually Stands'},
 {t:'normal',k:'How it\'s delivered',title:'One-on-one consulting, built around your Growth Assessment results.',body:'Growth Team Strategies works directly with owners on strategic planning, process work, and profitability, starting from the Growth Assessment and building a plan around what it actually finds in your business.'},
 {t:'cta',title:'Ready to see where your business actually stands?',chips:['Start the Growth Assessment','Growth Team Strategies'],disc:'Educational content for wood flooring company owners. No income or growth result is guaranteed. Results vary by company, market, and team.'},
];

const deck=document.getElementById('deck');
function signal(kind){return `<svg class="signal-motif ${kind==='title'?'title-signal':'corner-signal'}"><use href="#rings"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Growth <b>Team</b> Strategies &middot; Doug Howard</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.signal) h+=signal(s.signal);
  else if(s.t==='title') h+=signal('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
