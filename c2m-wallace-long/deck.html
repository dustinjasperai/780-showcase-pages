<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attract the Right Patients — A Masterclass with Wallace Long, C2M Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8fb; --panel:#eeeef4; --rule:#d8dee7;
    --acc:#004c7f; --ink:#282829; --body:#4a4f5c; --dim:#8a8f9c; --cream:#eef3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#e4e9f0;font-family:'Source Serif 4',Georgia,serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Poppins',sans-serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:-.005em}
  .t-title h1{font-size:4.7vw;max-width:90%}
  .t-normal h1{font-size:2.85vw;max-width:86%}
  .t-normal .body{font-family:'Source Serif 4',serif;font-size:1.34vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Source Serif 4',serif;font-style:italic;font-size:1.9vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.4;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.05vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:3.7vw;max-width:82%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(120% 140% at 20% 10%,#0a3a5c 0%,#062033 100%)}
  .t-dark h1{color:var(--cream);font-size:3.2vw;max-width:86%}
  .t-cta{background:radial-gradient(120% 140% at 20% 10%,#0a3a5c 0%,#062033 100%)}
  .t-cta h1{color:var(--cream);font-size:3.1vw;max-width:84%}
  .t-cta .body{font-family:'Source Serif 4',serif;color:#cddcea;font-size:1.34vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.2vw;margin-top:4.4vh;flex-wrap:wrap}
  .chip{border:1.5px solid #7fa8c8;color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-family:'Poppins',sans-serif;font-size:1.08vw;font-weight:500}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.1vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.03em}
  .brandline b{color:var(--acc);font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:5.2vh;font-family:'Poppins',sans-serif;font-size:.82vw;color:#9fb4c6;line-height:1.5;max-width:82%}
  .hud{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:7%;top:50%;transform:translateY(-50%);width:19vw;height:19vw;opacity:.92}
  .corner-mo{right:6%;bottom:8%;width:7.5vw;height:7.5vw;opacity:.5}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:5.5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}.disc{font-size:2vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">C2M Consulting</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: evidence + sequence + clarity — three plotted points rising along a fine
     baseline, with a focus ring on the destination point. reads like a considered brief. -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <g fill="none" stroke="#004c7f" stroke-width="2" stroke-linecap="round">
    <path d="M16 96 H104" opacity="0.35"/>
    <path d="M16 96 V20" opacity="0.35"/>
    <path d="M24 84 L52 62 L78 46 L98 26" opacity="0.55"/>
    <circle cx="24" cy="84" r="4.5" fill="#004c7f" stroke="none" opacity="0.85"/>
    <circle cx="52" cy="62" r="4.5" fill="#004c7f" stroke="none" opacity="0.9"/>
    <circle cx="78" cy="46" r="4.5" fill="#004c7f" stroke="none" opacity="0.9"/>
    <circle cx="98" cy="26" r="6.5" fill="#004c7f" stroke="none" opacity="0.95"/>
    <circle cx="98" cy="26" r="13" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Attract the Right Patients',sub:'How allied health practices grow with clarity and evidence, not hype or more marketing.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You are a great clinician. Growing the practice is the part that never feels solved.',body:'You know your craft and your patients value you. But running a practice is a different skill set to treating one, and the growth side stays a moving target. You try things, you pause, you wonder if any of it is working, and the diary still feels unpredictable. That gap is not a clinical problem.'},
 {t:'dark',title:'A quiet diary is rarely a skill problem. It is a clarity problem.'},

 {t:'section',idx:'Part One',title:'Why Good Practices Stay Overlooked'},
 {t:'normal',k:'The do-more trap',title:'Doing more marketing does not grow a practice. It just adds noise.',body:'When referrals dip, the instinct is to do more, post more, try one more tactic. But activity without a plan is just busywork, and it wears you out. The patients who need you are not waiting for your next campaign. They are waiting to find someone they can clearly understand and trust.'},
 {t:'normal',k:'The sea of sameness',title:'Most clinic messaging sounds the same, so patients cannot tell anyone apart.',body:'Same services, same reassurances, same words on every website. When your message blends in with every other practice nearby, people default to whatever is closest or cheapest. Standing out is not about saying more. It is about being clearly, recognisably you.'},
 {t:'dark',title:'A patient cannot choose you if they cannot tell what makes you different.'},

 {t:'section',idx:'Part Two',title:'The Evidence-Based Growth Method'},
 {t:'normal',k:'Start with clarity',title:'Growth begins with clarity, not tactics.',body:'Before any channel or campaign, you need a realistic, sequenced pathway: understand where the practice is, clarify the priorities, and translate the goal into steps you can actually act on. Clarity, sequence, and practical movement come first. Everything else is built on top of that, in order.'},
 {t:'normal',k:'Know exactly who you help',title:'Get clear on who your practice is truly best suited to help.',body:'Evidence-based marketing starts with the audience: who you are trying to reach, and how they currently find and evaluate a practice like yours. When you are specific about the people you serve best, your marketing stops guessing and starts landing with the right person.'},
 {t:'normal',k:'A message that reduces confusion',title:'The right message builds trust. The wrong one adds confusion.',body:'Once you know who you are speaking to, the work is choosing messages that reduce confusion and build trust, in the words patients and referrers actually use. Not hype, not jargon, not one-size-fits-all claims. Clear, honest messaging is what makes a stranger feel understood before they ever call.'},
 {t:'normal',k:'Choose channels on purpose',title:'Use the channels that fit your context, not a generic playbook.',body:'There is no universal list of what works. The question is which channels make sense for your practice, your patients, and your capacity, and what marketing activity is genuinely worth prioritising right now. A few things done well and consistently beats a scramble across every platform.'},
 {t:'normal',k:'Position to be understood',title:'Positioning: what makes your practice feel distinct, credible, and relevant.',body:'Positioning ties it together: the problems you are known for, how your approach is understood by patients and referrers, and what makes you distinct. When your website, your team, and your referrer conversations all say the same clear thing, people understand you quickly and choose you with confidence.'},
 {t:'dark',title:'You do not need to do more marketing. You need marketing that reflects how your practice really works.'},

 {t:'section',idx:'Part Three',title:'What Changes When It Is Clear'},
 {t:'normal',k:'The practice this builds',title:'Better-fit patients, stronger referrer relationships, and growth you can sustain.',body:'When your strategy is clear and your message is consistent, the right patients find you and feel like they already understand you. Referrers know exactly who to send. Growth becomes commercially sound and professionally aligned, the kind you can keep, rather than a burst that fades when the campaign stops.'},
 {t:'dark',title:'The goal was never to be the loudest clinic. It was to be the clear, trusted choice.'},
 {t:'normal',k:'Why Wallace Long',title:'Health-sector experience, communication strategy, and practical business thinking.',body:'Wallace built C2M Consulting to help practice owners think clearly about the next step instead of feeling overwhelmed by everything at once. His background combines health-sector experience with communication strategy and practical business thinking, and he explores the same questions with owners and experts each week on the Health Practice Insights podcast. This method is how he works.'},

 {t:'section',idx:'Your Next Step',title:'Build a Clear Growth Plan for Your Practice'},
 {t:'normal',k:'Keep going with C2M',title:'A tailored plan, built around your practice and the decisions in front of you.',body:'C2M works with you one to one to turn your goals into a realistic growth pathway: the audience, the message, the channels, and the positioning, sequenced so you know what to do next. Calm, structured, and evidence-based, not another list of tactics to chase.'},
 {t:'cta',title:'Ready to grow your practice with clarity?',body:'Book an initial consultation with Wallace and C2M Consulting, and start with a plan that fits how your practice actually works.',chips:['Schedule a consultation','Listen to Health Practice Insights'],disc:'Educational content for allied health practice owners. No growth or income result is guaranteed. Outcomes vary by practice, market, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">C2M <b>Consulting</b> · Wallace Long</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='corner') h+=mo('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
go(0);
</script>
</body>
</html>
