<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Obvious $10K Choice — A Masterclass with Alora Rachelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f0e8;
  --panel:#ece5d8;
  --ink:#2b2622;
  --rule:#9a8f80;
  --accent:#87634b;
  --accent2:#ad8b6a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
.slide{background:linear-gradient(180deg,var(--bg),var(--panel));border:1px solid #e2d8c9;border-radius:18px;padding:64px 60px;margin:20px 0;min-height:520px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.slide::before{content:'';position:absolute;left:60px;top:34px;width:44px;height:3px;background:var(--accent);border-radius:2px}
.num{position:absolute;right:34px;top:30px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--rule);font-weight:600}
.k{font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:72px;line-height:1.04;letter-spacing:-.01em}
h1 .i{font-style:italic;color:var(--accent)}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.005em}
.lead{font-size:24px;line-height:1.5;color:#544c43;margin-top:26px;max-width:88%;font-weight:400}
.big{font-family:'Cormorant Garamond',Georgia,serif;font-size:96px;line-height:1;font-weight:600}
.strike{color:var(--rule);position:relative;display:inline-block}
.strike::after{content:'';position:absolute;left:-2%;right:-2%;top:54%;height:5px;background:var(--accent);border-radius:3px;transform:rotate(-2deg)}
ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px}
li{font-size:23px;line-height:1.42;color:#463f37;padding-left:38px;position:relative}
li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border:2.4px solid var(--accent);border-radius:5px}
.pill{display:inline-block;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;border:1.5px solid var(--accent);border-radius:100px;padding:8px 18px;margin-bottom:26px;align-self:flex-start}
.pillar-n{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:40px;color:var(--accent2);margin-bottom:8px}
.stat-row{display:flex;gap:44px;margin-top:38px;flex-wrap:wrap}
.stat{min-width:180px}
.stat .v{font-family:'Cormorant Garamond',serif;font-size:58px;font-weight:700;color:var(--accent);line-height:1}
.stat .l{font-size:16px;color:#5c544a;margin-top:8px;line-height:1.35}
.cta-box{margin-top:30px}
.cta-btn{display:inline-block;background:var(--accent);color:#fff;font-weight:600;font-size:22px;padding:18px 40px;border-radius:100px;letter-spacing:.01em}
.disc{font-size:14px;color:#6b6255;margin-top:34px;line-height:1.55;max-width:80%}
.foot{position:absolute;left:60px;bottom:26px;font-size:14px;letter-spacing:.06em;color:var(--rule);font-weight:600}
.foot b{color:var(--ink);font-weight:700}
@media(max-width:720px){.slide{padding:44px 30px}h1{font-size:48px}h2{font-size:38px}.big{font-size:64px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
 {t:'title', k:'A live masterclass for wedding photographers', h:"How to Become the<br>Obvious <span class='i'>$10K Choice</span>", lead:"Positioning and sales psychology for wedding photographers who want fewer weddings at far higher prices. Presented live by Alora Rachelle."},
 {t:'promise', k:'What you will walk away with', h:'The exact shift', b:["Why most photographers price themselves out of $10K weddings before an inquiry ever lands","The shift that makes couples see you as a $10K photographer before the sales call","How to move from $3K to $10K without booking more dates"]},
 {t:'who', k:'Who this is for', h:'You are good. You are busy. You are underpaid.', lead:"You book weddings, but nowhere near $10K. You shoot more dates to make more money, and the calendar fills while the bank account does not."},
 {t:'trap', k:'The trap', h:'More weddings is<br>not the answer', lead:"Booking more dates trades your weekends for volume. It caps your income at how many Saturdays you are willing to give away, and it burns you out on the work you used to love."},
 {t:'reframe', k:'The reframe', h:'$10K weddings are<br>not booked on <span class="i">talent</span>', lead:"The photographers who book $10K weddings are not simply better at taking photos. They have mastered positioning, messaging, and buyer psychology. That is a skill you can learn."},
 {t:'part', k:'Part One', h:'The Core Problem'},
 {t:'point', k:'The core problem', h:'You price before<br>you position', lead:"When couples meet your price before they understand your value, every conversation becomes a negotiation. Price is a story, and right now the story is missing."},
 {t:'point', k:'The core problem', h:'So they compare,<br>haggle, or ghost', lead:"Wrong-fit couples treat you like a line item. They compare you on price, ask for discounts, or disappear, because nothing told them you were the obvious choice."},
 {t:'point', k:'The core problem', h:'The fix is not a<br>better portfolio', lead:"You do not need more talent or a new camera. You need couples to arrive already expecting premium, already sold on you, before the call."},
 {t:'part', k:'Part Two', h:'Marketing meets<br>Sales Psychology'},
 {t:'pillar', k:'The method', pn:'Pillar one', h:'Price so $10K couples self-select', lead:"Structure and present your pricing so the right couples raise their hand and the wrong ones opt themselves out, before they ever fill out a form."},
 {t:'pillar', k:'The method', pn:'Pillar two', h:'Message the value before the call', lead:"Your brand, your words, and your content should do the selling in advance, so the couple sees you as the $10K photographer before you ever speak."},
 {t:'pillar', k:'The method', pn:'Pillar three', h:'Guide the yes, do not discount it', lead:"On the call, lead with confidence and value instead of over-explaining or dropping your price. The yes should feel inevitable, not negotiated."},
 {t:'pillar', k:'The craft edge', pn:'The signature', h:'A style that refuses<br>to blend in', lead:"Technical skill meets artistic identity. A signature editorial look is not vanity, it is pricing power, because a couple cannot compare you on price when no one else looks like you."},
 {t:'part', k:'Part Three', h:'The Booked-Out Brand'},
 {t:'point', k:'The outcome', h:'Fewer weddings.<br>Higher prices.<br>Freer weekends.', lead:"You keep the work you love, drop the volume you do not, and finally get paid what the work is worth."},
 {t:'point', k:'The outcome', h:'The <span class="i">CEO</span> shift', lead:"You stop running your business like a shooter who is always booked and start running it like an owner who is booked well. That is the shift that changes everything."},
 {t:'proof', k:'Why me', h:'I built this from<br>my own business', lead:"I went from 30-plus weddings a year at $3K each and barely breaking even to a six figure business, on fewer than 20 weddings a year.", stats:[["$10K to $100K","in two years, on fewer weddings"],["$3M+","in collected student revenue in Wedding Atelier"],["First 5","students to $100K within six months"]]},
 {t:'next', k:'Your next 12 months', h:'This is the whole<br>system, together', lead:"Wedding Atelier is the 12 month path that walks you through positioning, pricing, marketing, and the CEO mindset, so you become the obvious $10K choice in your market."},
 {t:'cta', k:'Your next step', h:'Apply to<br>Wedding Atelier', lead:"If you are ready to book fewer, higher paying weddings, apply to join the next Wedding Atelier group.", cta:'Apply to Wedding Atelier', disc:"No specific income or result is guaranteed. Results vary based on your work, your market, your pricing, and the effort you put in. This masterclass is educational and reflects one photographer's experience."}
];
function esc(x){return x||''}
function render(){
 const root=document.getElementById('deck');
 S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let inner='<div class="num">'+String(i+1).padStart(2,'0')+' / '+S.length+'</div>';
  if(s.k) inner+='<div class="k">'+esc(s.k)+'</div>';
  if(s.pn) inner+='<div class="pillar-n">'+esc(s.pn)+'</div>';
  if(s.t==='part'){ inner+='<h1>'+esc(s.h)+'</h1>'; }
  else if(s.t==='cta'){
    inner+='<h1>'+esc(s.h)+'</h1>';
    if(s.lead) inner+='<div class="lead">'+esc(s.lead)+'</div>';
    inner+='<div class="cta-box"><span class="cta-btn">'+esc(s.cta)+'</span></div>';
    if(s.disc) inner+='<div class="disc">'+esc(s.disc)+'</div>';
  } else {
    inner+='<h2>'+esc(s.h)+'</h2>';
    if(s.lead) inner+='<div class="lead">'+esc(s.lead)+'</div>';
    if(s.b){ inner+='<ul>'; s.b.forEach(x=>inner+='<li>'+esc(x)+'</li>'); inner+='</ul>'; }
    if(s.stats){ inner+='<div class="stat-row">'; s.stats.forEach(p=>inner+='<div class="stat"><div class="v">'+esc(p[0])+'</div><div class="l">'+esc(p[1])+'</div></div>'); inner+='</div>'; }
  }
  inner+='<div class="foot"><b>Alora Rachelle</b> &nbsp; The Obvious $10K Choice</div>';
  el.innerHTML=inner;
  root.appendChild(el);
 });
}
render();
</script>
</body>
</html>
