<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The $10M System | Green Industry Masterminds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f8f5; --panel:#eef2ea; --rule:#cdd8cc;
    --ground:#163a24; --accent:#2f8f4e;
    --ink:#1d241f; --muted:#5d6b60;
  }
  html,body{height:100%}
  body{font-family:'Lato',-apple-system,sans-serif;background:var(--ground);color:var(--ink);overflow:hidden}
  #stage{position:relative;width:100vw;height:100vh}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7vh 9vw;background:var(--bg)}
  .slide.on{display:flex}
  .slide.dark{background:var(--ground);color:#eef2ea}
  .slide.dark .k{color:#9fd3af}
  .slide.dark .muted{color:#b9c9bc}
  .k{font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(30px,5.2vw,62px);
    line-height:1.08;letter-spacing:-.01em;color:var(--ground);margin-bottom:22px}
  .slide.dark h1{color:#f3f8f0}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(24px,3.6vw,42px);
    line-height:1.14;color:var(--ground);margin-bottom:20px}
  .slide.dark h2{color:#f3f8f0}
  p{font-size:clamp(16px,1.7vw,23px);line-height:1.6;color:var(--ink);max-width:40ch;margin-bottom:14px}
  .slide.dark p{color:#e6efe4}
  .lead{font-size:clamp(19px,2.1vw,27px);color:var(--muted);max-width:42ch}
  .slide.dark .lead{color:#cfe0cc}
  .muted{color:var(--muted)}
  ul{list-style:none;max-width:44ch}
  li{position:relative;font-size:clamp(16px,1.7vw,22px);line-height:1.5;padding-left:30px;margin-bottom:16px;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:.6em;width:12px;height:12px;border-radius:2px;background:var(--accent)}
  .phases{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .phase{flex:1 1 180px;background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--accent);
    padding:20px 18px;border-radius:4px}
  .phase .n{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--accent);font-size:14px;letter-spacing:.1em}
  .phase h3{font-family:'Montserrat',sans-serif;font-weight:700;font-size:19px;color:var(--ground);margin:6px 0 8px}
  .phase p{font-size:15px;line-height:1.45;color:var(--muted);margin:0;max-width:none}
  .big{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(40px,8vw,96px);color:var(--ground);line-height:1;margin-bottom:10px}
  .ramp{display:flex;align-items:flex-end;gap:12px;margin-top:24px;height:34vh}
  .bar{flex:1;background:linear-gradient(180deg,var(--accent),var(--ground));border-radius:4px 4px 0 0;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:10px}
  .bar span{font-family:'Montserrat',sans-serif;font-weight:800;color:#fff;font-size:15px}
  .bar small{color:#dfeede;font-size:12px;margin-top:4px}
  .cta-btn{display:inline-block;margin-top:14px;background:var(--accent);color:#fff;font-family:'Montserrat',sans-serif;
    font-weight:700;font-size:20px;padding:16px 30px;border-radius:5px;letter-spacing:.01em;text-decoration:none}
  .disc{font-size:13px;color:#cfe0cc;max-width:60ch;margin-top:22px;line-height:1.5}
  .nav{position:fixed;bottom:18px;right:24px;font-family:'Montserrat',sans-serif;font-size:12px;
    letter-spacing:.12em;color:var(--muted);z-index:10}
  .brandmark{position:fixed;bottom:18px;left:24px;font-family:'Montserrat',sans-serif;font-weight:700;
    font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;z-index:10}
  @media(max-width:640px){.slide{padding:6vh 7vw}p,.lead{max-width:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandmark">Green Industry Masterminds</div>
<div class="nav"><span id="cur">1</span> / <span id="tot">1</span> &nbsp;·&nbsp; &rarr; to advance</div>
<script>
const S = [
  {t:'title', dark:true, k:'A Green Industry Masterminds Training', h1:'The $10M System',
   lead:'How lawn care and landscaping owners scale past $1M to $8-10M without living inside the truck, the schedule, and the chaos.'},

  {t:'who', k:'Who this is for',
   h2:"You're past $500k. And more revenue keeps costing you more of your life.",
   bullets:[
     "You're doing $500k to $3M and growth has started to hurt instead of help.",
     "Every new crew, truck, and client lands back on your plate.",
     "You're the best salesperson, the best operator, and the bottleneck, all at once."]},

  {t:'trap', k:'The trap',
   h2:'The thing that got you to $1M is the exact thing stopping you at $1M.',
   paras:[
     'You outworked everyone. You answered every call, closed every bid, fixed every problem. That hustle built the company.',
     'Now that same hustle is the ceiling. The business runs on you, so it can only ever be as big as one exhausted owner.']},

  {t:'reframe', dark:true, k:'The reframe',
   h2:"You don't have a lead problem. You have a system problem.",
   lead:'More leads poured into a business that depends on the owner just makes the owner drown faster. The $10M companies aren’t working harder. They built a machine the owner doesn’t have to run.'},

  {t:'p1head', dark:true, k:'Part one', h1:'Why most lawn care companies stall between $1M and $3M'},

  {t:'p1body', h2:"Revenue grows. Profit and freedom don't.",
   bullets:[
     "Sales live in the owner's head, so they can't be handed off.",
     'There are no numbers, so every decision is a guess.',
     "There's no org chart, so everyone reports to you about everything."]},

  {t:'p1cost', k:'What it costs you', big:'60+ hrs',
   lead:"The average stuck owner works 60-plus hours a week to hold together a company that still can't run a single day without them. That's not a business yet. It's a high-paying job you can never quit."},

  {t:'p2head', dark:true, k:'Part two', h1:'The $10M System: the four phases that take the owner out of the work'},

  {t:'p2phases', k:'The four phases',
   phases:[
     {n:'01', h:'Operational Foundation', p:'A company deep dive and SWOT, clean numbers, and the base systems a scalable company stands on.'},
     {n:'02', h:'Systems Development', p:'Sales, production, and admin turned into documented processes anyone on the team can run.'},
     {n:'03', h:'Team Building', p:'The org chart, the roles, and the leaders who own outcomes so the work no longer lands on you.'},
     {n:'04', h:'Scaling', p:'The repeatable growth engine that pushes past $1M toward $8-10M on purpose, not by accident.'}]},

  {t:'p2sales', k:'The engine inside the system', h2:'The 7 Sales Laws',
   paras:[
     'Phase two lives or dies on sales. Most owners are the only person who can sell, so sales can never scale past them.',
     'The 7 Sales Laws turn your instinct into a process: how you price, how you present, how you follow up, so a trained team closes the way you do and the calendar fills without you on every call.']},

  {t:'p2diag', k:'Where every owner starts', h2:'The Company Deep Dive and the 5-7 step road map',
   paras:[
     'Before any system gets built, we map your real numbers and your real gaps with a full company assessment and SWOT.',
     'That becomes a 5-7 step action road map, worked one step at a time with bi-weekly accountability. No overwhelm. One clear next move at a time.']},

  {t:'p3head', dark:true, k:'Part three', h1:'What changes once the $10M System runs your company'},

  {t:'p3look', h2:'The business runs. You lead it.',
   bullets:[
     'A sales team that closes without you on the call.',
     'Numbers you check weekly instead of fears you carry daily.',
     'Crews and managers who own the day so you can own the direction.',
     'Time back, because the company no longer needs you in the field.']},

  {t:'p3whyme', k:'Why learn this from us', h2:'We built the companies first, then the system.',
   paras:[
     'Chester Buczynski built a $55M lawn care company across three states. Carson Jones grew a landscaping company from $2M to $10M. Rusty McCommas scaled Evergreen from $1.8M to $5.4M.',
     "This isn't theory from a whiteboard. It's the exact playbook we ran in our own green-industry companies."]},

  {t:'p3proof', k:'The climb, on purpose',
   ramp:[['$500k','stuck',30],['$1M','foundation',48],['$3M','systems',66],['$6M','team',82],['$10M','scaling',100]],
   note:'100-plus green-industry companies have used this system to climb the same ramp.'},

  {t:'recap', k:'The whole thing in one line', h2:'Stop being the business. Start owning it.',
   lead:'Four phases. One sales engine. A road map worked one step at a time, from people who built $55M in lawn care and landscaping before they ever coached it.'},

  {t:'cta', dark:true, k:'Your next step', h1:'Ready to build your $10M System?',
   lead:"Book a call with a Green Industry Masterminds coach. We'll map where you're stuck and the first phase to build.",
   cta:{label:'Book a call with GIM', href:'https://leads.greenindustrymasterminds.com/'},
   disc:'Educational training only. No result is guaranteed. Results vary and depend on your market, team, effort, and execution. Company figures describe past results of GIM coaches and members, not a promise of future earnings. Nothing here is financial, legal, or tax advice.'}
];

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const stage=document.getElementById('stage');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide'+(s.dark?' dark':'');
  let h='';
  if(s.k) h+=`<div class="k">${esc(s.k)}</div>`;
  if(s.h1) h+=`<h1>${esc(s.h1)}</h1>`;
  if(s.big) h+=`<p class="big">${esc(s.big)}</p>`;
  if(s.h2) h+=`<h2>${esc(s.h2)}</h2>`;
  if(s.lead) h+=`<p class="lead">${esc(s.lead)}</p>`;
  if(s.paras) s.paras.forEach(p=>h+=`<p>${esc(p)}</p>`);
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+=`<li>${esc(b)}</li>`);h+='</ul>';}
  if(s.phases){h+='<div class="phases">';s.phases.forEach(p=>h+=`<div class="phase"><div class="n">${esc(p.n)}</div><h3>${esc(p.h)}</h3><p>${esc(p.p)}</p></div>`);h+='</div>';}
  if(s.ramp){h+='<div class="ramp">';s.ramp.forEach(r=>h+=`<div class="bar" style="height:${r[2]}%"><span>${esc(r[0])}</span><small>${esc(r[1])}</small></div>`);h+='</div>';}
  if(s.note) h+=`<p class="muted" style="margin-top:16px">${esc(s.note)}</p>`;
  if(s.cta) h+=`<a class="cta-btn" href="${esc(s.cta.href)}">${esc(s.cta.label)}</a>`;
  if(s.disc) h+=`<p class="disc">${esc(s.disc)}</p>`;
  d.innerHTML=h;stage.appendChild(d);
});
const slides=[...document.querySelectorAll('.slide')];
let i=0;document.getElementById('tot').textContent=slides.length;
function show(n){i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,k)=>s.classList.toggle('on',k===i));
  document.getElementById('cur').textContent=i+1;}
show(0);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){show(i+1);e.preventDefault();}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){show(i-1);e.preventDefault();}});
stage.addEventListener('click',e=>{show(i+(e.clientX<window.innerWidth*0.3?-1:1));});
</script>
</body>
</html>
