<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Six Figure Playbook - a masterclass with Alan Dickie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;          /* his light site ground */
    --panel:#f3f4f5;       /* from his #e9ecef light grey */
    --rule:#adb5bd;        /* his dominant cool grey */
    --ink:#343a40;         /* his charcoal */
    --muted:#6b727a;
    --accent:#17ab7e;      /* his teal-green brand accent */
    --display:'Prata', Georgia, serif;   /* his actual H1 face */
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 18px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:420px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(52,58,64,.04);
  }
  .tag{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:400;font-size:52px;line-height:1.06;color:var(--ink);margin-bottom:16px}
  h2{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.12;color:var(--ink);margin-bottom:18px}
  p{font-size:19px;line-height:1.6;color:var(--ink);margin-bottom:14px;max-width:62ch}
  p.lead{font-size:22px;color:var(--muted)}
  .kicker{font-size:17px;color:var(--muted)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:14px 0 14px 46px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li .n{position:absolute;left:0;top:13px;font-family:var(--display);font-size:22px;color:var(--accent)}
  li b{font-weight:600}
  .big{font-family:var(--display);font-size:40px;line-height:1.1;color:var(--ink)}
  .big .hl{color:var(--accent)}
  .foot{position:absolute;left:56px;bottom:22px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .pageno{position:absolute;right:56px;bottom:22px;font-size:12px;color:var(--muted)}
  .cta .btn{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;font-weight:600;
    font-size:18px;padding:16px 30px;border-radius:9px;text-decoration:none}
  .disclaimer{margin-top:26px;font-size:13px;line-height:1.5;color:var(--muted);max-width:70ch}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px 24px}
  .card h3{font-family:var(--display);font-weight:400;font-size:22px;margin-bottom:8px}
  .card p{font-size:16px;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "The Entrepreneurial Collective";
const S=[
  {t:'title',
    tag:'A free masterclass with Alan Dickie',
    h1:'The Six Figure Playbook',
    lead:'How ordinary people get <span style="color:var(--accent)">built</span> into entrepreneurs. No passion required. No luck required. Just the system.' },

  {t:'who',
    tag:'Who this is for',
    h2:'You are good at what you do. You are tired of building someone else’s dream.',
    body:['You show up. You work hard. People trust you. But every hour you give still ends up on someone else’s balance sheet.',
          'You have thought about building your own thing for a while now. Something keeps stopping you. This hour is about what that something actually is.'] },

  {t:'trap',
    tag:'The trap',
    h2:'You were told entrepreneurs are born.',
    body:['Risk-takers. Naturals. People who always knew. So you keep waiting to feel like one of them.',
          'Waiting to feel ready. Waiting for the idea. Waiting for the fear to go quiet so you can finally start.'],
    kicker:'Here is the problem with waiting.' },

  {t:'reframe',
    tag:'The reframe',
    big:'Entrepreneurs are not born. They are <span class="hl">built</span>.<br>And “ready” never shows up. Discipline does.' },

  {t:'part', tag:'Part one', h2:'Why most first businesses stall',
    body:['It is almost never talent and it is almost never the idea. First businesses stall for three quiet reasons, and none of them feel urgent until it is too late.'] },

  {t:'list', tag:'The three silent killers', h2:'What actually ends it',
    items:[
      ['01','<b>No system.</b> Motivation is a feeling, and feelings do not show up on a schedule. Without a system you are starting over every Monday.'],
      ['02','<b>No reps.</b> You wait until it is perfect instead of getting the reps that make it good. The work that teaches you never gets done.'],
      ['03','<b>No discipline engine.</b> You rely on willpower. Willpower runs out by Wednesday. What lasts is a habit you no longer have to decide on.']
    ] },

  {t:'part', tag:'Part two', h2:'The operating system',
    body:['This is the part nobody teaches, because most people selling you a dream have never had to build one from a standing start. I have, and I have trained thousands of people to do the same thing on a sales floor.',
          'Here is the six-week build, held together by the 100 Laws of Success.'] },

  {t:'list', tag:'Pillar 1 - install the habits', h2:'The First 21',
    items:[
      ['','<b>21 days to build the engine.</b> Before any business tactics, you install the daily habits that make everything after it possible.'],
      ['','<b>Why 21 first.</b> You do not need more motivation. You need a default. By day 21 the work happens whether you feel like it or not.']
    ] },

  {t:'list', tag:'Pillars 2 and 3 - find the work', h2:'Your gift, and a problem worth solving',
    items:[
      ['','<b>Discover your gift.</b> Not your passion. The thing you already do better than most people around you, usually without noticing.'],
      ['','<b>Solve a problem.</b> A business is a solved problem that people will pay for. We find the overlap between your gift and a problem people already feel.']
    ] },

  {t:'list', tag:'Pillar 4 - make it pay', h2:'Forming the offer and pricing it',
    items:[
      ['','<b>Form the offer.</b> Turn the solved problem into something specific, nameable, and buyable. Vague offers do not sell.'],
      ['','<b>Price with conviction.</b> Most first-timers underprice out of fear. We set a price you can defend and deliver on.']
    ] },

  {t:'list', tag:'Pillar 5 - the fundamentals that pay the bills', h2:'The A.C.E. selling fundamentals',
    body:['Twenty years on dealership floors taught me one thing: selling is not a personality, it is a discipline. A.C.E. is how ordinary people learn to sell without ever being “salesy.”'],
    items:[
      ['A','<b>Attitude.</b> You cannot give someone certainty you do not have. It starts with how you show up before a word is said.'],
      ['C','<b>Conviction.</b> You sell what you believe. We build real belief in the offer, so the ask stops feeling like a favor.'],
      ['E','<b>Execution.</b> A repeatable path from first conversation to a yes, so it works on your worst day, not just your best.']
    ] },

  {t:'list', tag:'Pillars 6 and 7 - keep it alive', h2:'Getting found, then closing and keeping',
    items:[
      ['','<b>Lead generation and a content system.</b> A simple, repeatable way to be found by the people who have the problem you solve.'],
      ['','<b>Closing, then managing and maintaining.</b> The part amateurs skip. Winning the client is the start; keeping and serving them is the business.']
    ] },

  {t:'laws', tag:'The through-line', h2:'The 100 Laws of Success',
    body:['Every pillar sits on the same foundation: a set of principles that do not change with the market. They hold in your business, and they hold at your kitchen table.',
          'That is the point. We are not building a hustle you burn out of in a year. We are building an operator who lasts.'] },

  {t:'part', tag:'Part three', h2:'What a built entrepreneur actually looks like',
    body:['Not a motivational poster. A person with a default. The reps happen. The offer is clear. The selling is a process, not a mood. And it compounds, week over week, because the system does not take days off.'] },

  {t:'cards', tag:'This masterclass is for you if', h2:'Honest fit',
    cards:[
      ['This is for you if','You are willing to be built. You would rather follow a proven path and do the reps than wait to feel ready.'],
      ['This is not for you if','You are looking for an overnight win, a passive hack, or permission to skip the fundamentals. The playbook will not help you.']
    ] },

  {t:'why', tag:'Why me', h2:'Alan Dickie',
    body:['Twenty-plus years in the automotive industry as a sales trainer and talent specialist, building profitable departments with the Finance First approach and training thousands of people to sell with discipline instead of pressure.',
          'Founder of The Entrepreneurial Collective, host of the podcast, and author of The Six Figure Playbook. The community runs on one rule: Man sharpens Man, and Steel sharpens Steel.'] },

  {t:'path', tag:'The path forward', h2:'The six-week build',
    body:['Everything in this hour is the first mile of the build we walk together inside The Entrepreneurial Collective: the First 21, your gift and your offer, the A.C.E. fundamentals, lead generation, closing, and the 100 Laws that hold it together.',
          'Six weeks, a clear path, and a room of people being built right alongside you.'] },

  {t:'cta', tag:'Your next step',
    h2:'Join The Entrepreneurial Collective',
    body:['If you are ready to stop waiting to feel ready, come get built. The next six-week cohort walks the full playbook, step by step, with the community behind you.'],
    btn:'Join The Entrepreneurial Collective',
    disclaimer:'This masterclass is educational. It shares principles and a process, not a promise of income or results. Building a business involves effort and risk, and outcomes vary from person to person based on the work they put in. Nothing here is a guarantee of earnings.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='cta'?'cta':'');
  let h='';
  if(s.tag) h+='<div class="tag">'+s.tag+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.body) s.body.forEach(p=>h+='<p>'+p+'</p>');
  if(s.items){h+='<ul>';s.items.forEach(it=>h+='<li>'+(it[0]?'<span class="n">'+it[0]+'</span>':'')+it[1]+'</li>');h+='</ul>';}
  if(s.cards){h+='<div class="two">';s.cards.forEach(c=>h+='<div class="card"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div>');h+='</div>';}
  if(s.kicker) h+='<p class="kicker">'+s.kicker+'</p>';
  if(s.btn) h+='<div><a class="btn" href="https://alan-dickie.mykajabi.com/main-tec-page">'+s.btn+'</a></div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  h+='<div class="foot">'+BRAND+'</div><div class="pageno">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
