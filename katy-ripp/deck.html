<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Multi-Passionate Business - A Live Masterclass with Katy Ripp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fef9f2;        /* harvested cream */
    --panel:#efe5d1;     /* harvested warm sand */
    --ink:#251f18;       /* harvested espresso */
    --muted:#6b6258;
    --accent:#d4b06a;    /* harvested signature gold */
    --deep:#00584e;      /* harvested deep green */
    --display:'EB Garamond', Georgia, serif;
    --body:'Josefin Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:1040px;margin:0 auto}
  .slide{
    position:relative;min-height:100vh;background:var(--bg);
    padding:9vh 8vw;display:flex;flex-direction:column;justify-content:center;
    border-bottom:1px solid rgba(37,31,24,.08);
  }
  .k{font-family:var(--body);font-weight:600;letter-spacing:.26em;text-transform:uppercase;
     font-size:13px;color:var(--deep);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,6.4vw,74px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:500;font-size:clamp(30px,4.6vw,52px);line-height:1.08;letter-spacing:-.01em}
  .sub{font-family:var(--display);font-style:italic;font-size:clamp(19px,2.3vw,27px);color:var(--muted);margin-top:22px;max-width:30ch}
  .by{margin-top:38px;font-family:var(--body);font-weight:500;letter-spacing:.04em;color:var(--ink)}
  .by span{color:var(--deep)}
  p.b{font-family:var(--display);font-size:clamp(20px,2.5vw,30px);line-height:1.5;margin-top:26px;max-width:30ch;color:#3a3229}
  ul{list-style:none;margin-top:30px;max-width:34ch}
  li{font-family:var(--body);font-weight:300;font-size:clamp(17px,2vw,22px);line-height:1.5;
     padding:16px 0 16px 34px;border-top:1px solid rgba(37,31,24,.12);position:relative;color:#3a3229}
  li:before{content:"";position:absolute;left:0;top:24px;width:14px;height:2px;background:var(--accent)}
  .divider{background:var(--ink);color:var(--bg)}
  .divider .k{color:var(--accent)}
  .divider h2{color:var(--bg)}
  .curr{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
  .curr div{font-family:var(--body);font-weight:500;letter-spacing:.03em;font-size:clamp(15px,1.7vw,19px);
     padding:14px 22px;border:1.5px solid var(--accent);border-radius:999px;color:var(--ink)}
  .cta-slide{background:var(--panel)}
  .btn{display:inline-block;margin-top:34px;font-family:var(--body);font-weight:600;letter-spacing:.05em;
     background:var(--deep);color:var(--bg);padding:17px 38px;border-radius:4px;font-size:16px;align-self:flex-start}
  .disc{margin-top:40px;font-family:var(--body);font-weight:300;font-size:13px;line-height:1.6;color:var(--muted);max-width:52ch}
  .pg{position:fixed;right:16px;bottom:14px;font-family:var(--body);font-size:12px;letter-spacing:.1em;
     color:var(--muted);background:var(--bg);padding:6px 11px;border-radius:999px;box-shadow:0 1px 6px rgba(0,0,0,.12)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<div class="pg" id="pg"></div>
<script>
const S = [
  {t:'title', k:'A Live Masterclass', h:'The Multi-Passionate Business', s:'How to build one life around all of it, without niching down or burning out.', by:'with Katy Ripp'},
  {t:'agenda', k:'In the next hour', h:'What we will cover', list:['Why "pick one thing" quietly breaks multi-passionate women','The Four Currencies, and how to spend them on purpose','What your next chapter looks like when you stop apologizing for your range']},
  {t:'who', k:'Who this is for', h:'This is for you if', list:['You have more than one calling and you are tired of being told to pick one','You have started, and quietly shelved, more than one business','Your range feels like a liability instead of your edge']},
  {t:'body', k:'The trap', h:'The advice you have heard a hundred times', b:'Niche down. Pick one thing. Stay in your lane. So you try. And the version of you that fits in one lane is not the version anyone fell in love with.'},
  {t:'body', k:'The reframe', h:'Here is the part no one says out loud', b:'Niching down is not the price of a real business. For a multi-passionate woman it is the fastest route to a business you resent and quietly abandon.'},
  {t:'divider', k:'Part One', h:'Why "pick one thing" breaks scanners'},
  {t:'body', k:'Your wiring', h:'You are not scattered. You are wired for cycles.', b:'Some people are wired for linear paths. You are wired for intensity, curiosity, and change. Without that frame you read your natural pattern-shifting as failure. It is not failure. It is how you are built.'},
  {t:'body', k:'The real cost', h:'What it costs to ignore it', list:['You force a niche and lose the spark within months','You start over, again, and call yourself inconsistent','You build five half-things instead of one whole thing']},
  {t:'divider', k:'Part Two', h:'The Four Currencies'},
  {t:'curr', k:'The framework', h:'Spend four currencies on purpose', b:'Every decision spends one of four finite currencies. Choose where each one goes on purpose and your many passions stop competing and start compounding into one coherent business.', curr:['Money','Time','Energy','Attention']},
  {t:'body', k:'How it decides', h:'The one question that ends the chaos', b:'A new idea is not simply yes or no. It is: which currency does this spend, and can I afford it this season? That single question turns a scattered calendar into a strategy.'},
  {t:'body', k:'In practice', h:'A season at a time', b:'You do not have to do all of it at once. You decide which passion gets the attention and energy this season, and which ones wait, funded and protected, for theirs. Nothing gets abandoned. Everything gets a turn.'},
  {t:'divider', k:'Part Three', h:'What the next chapter looks like'},
  {t:'body', k:'The middle', h:'Stuck is the middle, not the end', b:'The hero’s journey is not just for books and movies. The part where it all feels uncertain is not the end of your story. It is the ordeal in the middle, right before the return.'},
  {t:'body', k:'The other side', h:'On the far side of niching down', list:['One business that holds all of you, not a shrunken slice','A calendar that funds a slower life instead of eating it','Permission to stop apologizing for your range']},
  {t:'body', k:'Why me', h:'Why I teach this', b:'I am Katy Ripp. I write the Love Monday letter to more than 600 women every week, I coach multi-passionate women through A New Chapter, and I built this life around all of my passions on purpose, from Storybook Hill. This is the work I do.'},
  {t:'body', k:'Leave with', h:'What you will walk away with', list:['Your four currencies mapped to the season you are actually in','A filter for every new idea, so range becomes strategy','A next step that does not require you to become someone smaller']},
  {t:'cta', k:'Your move', h:'Your next chapter starts here', b:'If this is the season you stop picking one thing and start building around all of it, A New Chapter is where we do it together.', cta:'Join A New Chapter', disc:'This masterclass is for education only. No income or specific result is guaranteed, and nothing here is a promise of earnings. Results vary based on your own effort, circumstances, and market.'}
];

function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  const d = document.getElementById('deck');
  S.forEach(s=>{
    const sec = document.createElement('section');
    sec.className = 'slide' + (s.t==='divider'?' divider':'') + (s.t==='cta'?' cta-slide':'');
    let h = '';
    if(s.k) h += '<div class="k">'+esc(s.k)+'</div>';
    if(s.t==='title'){
      h += '<h1>'+esc(s.h)+'</h1>';
      if(s.s) h += '<div class="sub">'+esc(s.s)+'</div>';
      if(s.by) h += '<div class="by">with <span>'+esc(s.by.replace(/^with /,''))+'</span></div>';
    } else {
      h += '<h2>'+esc(s.h)+'</h2>';
    }
    if(s.b) h += '<p class="b">'+esc(s.b)+'</p>';
    if(s.curr){ h += '<div class="curr">'+s.curr.map(c=>'<div>'+esc(c)+'</div>').join('')+'</div>'; }
    if(s.list){ h += '<ul>'+s.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'; }
    if(s.cta) h += '<span class="btn">'+esc(s.cta)+'</span>';
    if(s.disc) h += '<div class="disc">'+esc(s.disc)+'</div>';
    sec.innerHTML = h;
    d.appendChild(sec);
  });
}
render();
const pg = document.getElementById('pg');
const secs = [...document.querySelectorAll('.slide')];
function upd(){
  let i = secs.findIndex(x=>x.getBoundingClientRect().bottom>window.innerHeight*0.5);
  if(i<0) i = secs.length-1;
  pg.textContent = (i+1)+' / '+secs.length;
}
window.addEventListener('scroll',upd); upd();
</script>
</body>
</html>
