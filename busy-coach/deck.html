<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The System-Driven Coach | Mandy Green, Busy Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0b2651;        /* her footer deep navy */
    --panel:#103041;     /* her dark teal-navy */
    --rule:rgba(255,255,255,0.14);
    --accent:#f05b23;    /* her dominant brand orange */
    --accent2:#fd9937;   /* her amber */
    --ink:#f4f1ea;
    --ink-soft:#c7d0dd;
    --ink-muted:#8696ab;
    --display:'Montserrat',system-ui,sans-serif;
    --body:'Karla',system-ui,sans-serif;
  }
  html,body{height:100%;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--body);
    -webkit-font-smoothing:antialiased; overflow:hidden; }
  #deck{ position:fixed; inset:0; }
  .slide{ position:absolute; inset:0; display:none; flex-direction:column;
    justify-content:center; padding:7vh 9vw; }
  .slide.active{ display:flex; }
  .kicker{ font-family:var(--display); font-weight:700; font-size:clamp(11px,1.5vw,15px);
    letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin-bottom:22px; }
  h1{ font-family:var(--display); font-weight:800; font-size:clamp(30px,5.6vw,64px);
    line-height:1.04; letter-spacing:-.015em; max-width:16ch; }
  h2{ font-family:var(--display); font-weight:700; font-size:clamp(24px,4vw,44px);
    line-height:1.1; letter-spacing:-.01em; max-width:20ch; margin-bottom:10px; }
  .lead{ font-size:clamp(17px,2.2vw,25px); color:var(--ink-soft); max-width:36ch; margin-top:22px; line-height:1.5; }
  .sub{ font-size:clamp(15px,1.8vw,20px); color:var(--ink-muted); max-width:42ch; margin-top:14px; line-height:1.55; }
  .big{ font-family:var(--display); font-weight:800; font-size:clamp(40px,8vw,92px); color:var(--accent); line-height:1; letter-spacing:-.02em; }
  ul{ list-style:none; margin-top:26px; max-width:40ch; }
  li{ font-size:clamp(16px,2vw,22px); color:var(--ink-soft); padding:12px 0 12px 34px; position:relative; border-bottom:1px solid var(--rule); line-height:1.4; }
  li:last-child{ border-bottom:none; }
  li::before{ content:""; position:absolute; left:0; top:20px; width:14px; height:14px;
    background:var(--accent); border-radius:3px; }
  .pillars{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px 40px; margin-top:28px; max-width:60ch; }
  .pillars .p{ padding:16px 18px; background:var(--panel); border-left:3px solid var(--accent); }
  .pillars .p .n{ font-family:var(--display); font-weight:700; color:var(--accent2); font-size:14px; letter-spacing:.08em; }
  .pillars .p .t{ font-family:var(--display); font-weight:600; font-size:clamp(15px,1.7vw,19px); margin:4px 0 4px; }
  .pillars .p .d{ font-size:clamp(13px,1.4vw,15px); color:var(--ink-muted); line-height:1.45; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center; max-width:70ch; margin-top:24px; }
  .card{ background:var(--panel); padding:26px 28px; border-top:3px solid var(--accent); }
  .card h3{ font-family:var(--display); font-weight:700; font-size:clamp(16px,2vw,22px); margin-bottom:10px; }
  .card p{ font-size:clamp(14px,1.5vw,17px); color:var(--ink-soft); line-height:1.5; }
  .disclaimer{ font-size:clamp(12px,1.3vw,14px); color:var(--ink-muted); max-width:52ch; margin-top:30px; line-height:1.5; font-style:italic; }
  .cta-btn{ display:inline-block; margin-top:28px; font-family:var(--display); font-weight:700;
    background:var(--accent); color:#0b2651; padding:16px 30px; font-size:clamp(15px,1.8vw,20px); letter-spacing:.02em; }
  .nav{ position:fixed; bottom:20px; right:26px; font-family:var(--display); font-size:13px;
    color:var(--ink-muted); letter-spacing:.1em; z-index:10; }
  .brandmark{ position:fixed; bottom:20px; left:26px; font-family:var(--display); font-weight:700;
    font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-muted); z-index:10; }
  .brandmark b{ color:var(--accent); }
  .progress{ position:fixed; top:0; left:0; height:4px; background:var(--accent); transition:width .25s ease; z-index:10; }
  @media (max-width:760px){ .pillars,.two{ grid-template-columns:1fr; } .slide{ padding:8vh 7vw; } }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="brandmark">BUSY <b>COACH</b></div>
<div class="nav" id="nav"></div>
<div id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Masterclass for College Coaches',
    h1:'The System-Driven Coach',
    lead:'How to recruit consistently, lead your program, and stop burning out, without adding a single hour to your week.' },

  {t:'content', kicker:'What you will walk away with',
    h2:'One operating system for the whole job',
    bullets:['A clear way to decide what matters most on any given day',
             'A recruiting rhythm that keeps moving even in the middle of your season',
             'A plan to protect your energy so you are still standing in year ten'],
    sub:'Not more tips. One system that holds your recruiting, your leadership, and your recovery together.' },

  {t:'content', kicker:'Who this is for',
    h2:'You did not get into coaching to live in your inbox',
    bullets:['You are recruiting, planning practice, managing a staff, and answering parents, all at once',
             'The to-do list never ends, so you work nights and weekends to stay even',
             'You are good at your job and still feel a step behind every single day'],
    sub:'If that is your week, this is built for you.' },

  {t:'statement', kicker:'The trap', big:'More effort',
    lead:'is the first thing every coach reaches for, and the reason so many of them burn out.' },

  {t:'content', kicker:'Part one: the real problem',
    h2:'Effort-driven coaches burn out. System-driven coaches win.',
    bullets:['Effort-driven means the program runs on your energy, so the output stops when you do',
             'Every task starts from scratch, so nothing compounds',
             'When recruiting season collides with your season, something always gets dropped'],
    sub:'The problem was never how hard you work. It is that the work has no system underneath it.' },

  {t:'content', kicker:'Part one: the real cost',
    h2:'What hustle quietly takes from you',
    bullets:['Recruiting goes cold the week you get buried, and you feel it two classes later',
             'The best ideas never get built because there is no room to think',
             'The job follows you home, and the people who matter get what is left over'],
    sub:'You can out-work this for a while. You cannot out-work it for a career.' },

  {t:'statement', kicker:'The reframe', big:'A better plan',
    lead:'not more hours. The coaches who win long term install a personal operating system and let it carry the load.' },

  {t:'content', kicker:'Part two: the method',
    h2:'The Personal Operating System',
    bullets:['A repeatable way to run your day so clarity and consistency are automatic',
             'Recruiting, leadership, and recovery all sit inside one system instead of competing',
             'The result does not depend on how motivated you feel that morning'],
    sub:'This is the spine of everything inside Win the Day. Here is what it is built from.' },

  {t:'content', kicker:'Pillar 01', h2:'Clarify your mission',
    bullets:['Define what you are actually building, on and off the court',
             'Build a Purpose Filter you run every new request through',
             'When you know the mission, saying no stops feeling like guilt'] },

  {t:'content', kicker:'Pillar 02', h2:'Own your time',
    bullets:['Block your calendar around the work that actually moves the program',
             'Choose one Daily Priority and protect it before the day scatters',
             'Stop letting the loudest email set your agenda for you'] },

  {t:'content', kicker:'Pillar 03', h2:'Set up your environment for success',
    bullets:['Remove the friction and clutter that quietly drain your focus',
             'Design your space and your phone so the right work is the easy work',
             'Make distraction take effort instead of making focus take effort'] },

  {t:'content', kicker:'Pillar 04', h2:'Use your strengths and systems',
    bullets:['Find your energy zones and schedule your hardest work inside them',
             'Turn anything you repeat into a template, a checklist, or a routine',
             'Let simple tools and AI carry the parts that do not need you'] },

  {t:'content', kicker:'Pillar 05', h2:'Simplify to multiply',
    bullets:['Build a Stop Doing List and actually honor it',
             'Cut the busywork that feels productive but moves nothing',
             'Choose a few habits that compound season over season'] },

  {t:'content', kicker:'Pillar 06', h2:'Recharge like a pro',
    bullets:['Treat recovery as part of the work, not a reward for finishing it',
             'Build reset rituals for the drive home and the off day',
             'Keep burnout off the table so your best coaching is still there in March'] },

  {t:'content', kicker:'Pillar 07 plus the staff', h2:'Mastery in motion and a staff that runs itself',
    bullets:['Stay consistent when travel, season, and chaos try to break the system',
             'Delegate real responsibility with the Staff Operating System',
             'Develop assistants who own their areas so you can coach instead of chase'] },

  {t:'content', kicker:'Part three: what changes',
    h2:'What a system-driven week looks like',
    bullets:['You know your one priority before your feet hit the floor',
             'Recruiting follow-up happens on a rhythm, not a panic, even in-season',
             'Your staff owns real responsibility, so you coach instead of chase',
             'You leave at a reasonable hour and the program keeps moving'],
    sub:'Same you. Same roster. A system doing the carrying instead of your willpower.' },

  {t:'two', kicker:'Why me',
    h2:'I built this because I lived the other version',
    cards:[
      ['23 years on the sideline','Two decades as a college coach, working harder and harder and still feeling behind, until I stopped relying on effort and built the system.'],
      ['Thousands of coaches later','Busy Coach has helped coaches across every sport go from overwhelmed to organized with the same operating system you just walked through.'] ] },

  {t:'cta', kicker:'Your next step',
    h2:'Install the system. Win the day.',
    lead:'If you want the full operating system, the templates, and the recruiting rhythm in one place, that is exactly what Win the Day Academy and my coaching are built to give you.',
    btn:'Start with Busy Coach',
    disclaimer:'This masterclass is for educational purposes only. It shares systems and strategies, not promises. No specific result is guaranteed. Results vary and depend on your own situation, effort, and program.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (i===0?' active':'');
  let html = '';
  if(s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){ html += `<h1>${s.h1}</h1>`; if(s.lead) html+=`<p class="lead">${s.lead}</p>`; }
  else if(s.t==='statement'){ html += `<div class="big">${s.big}</div>`; if(s.lead) html+=`<p class="lead">${s.lead}</p>`; }
  else { if(s.h2) html += `<h2>${s.h2}</h2>`;
    if(s.bullets){ html += '<ul>'+s.bullets.map(b=>`<li>${b}</li>`).join('')+'</ul>'; }
    if(s.items){ html += '<div class="pillars">'+s.items.map(p=>`<div class="p"><div class="n">${p[0]}</div><div class="t">${p[1]}</div><div class="d">${p[2]}</div></div>`).join('')+'</div>'; }
    if(s.cards){ html += '<div class="two">'+s.cards.map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')+'</div>'; }
    if(s.lead) html += `<p class="lead">${s.lead}</p>`;
    if(s.btn) html += `<div class="cta-btn">${s.btn}</div>`;
    if(s.disclaimer) html += `<p class="disclaimer">${s.disclaimer}</p>`;
  }
  if(s.sub) html += `<p class="sub">${s.sub}</p>`;
  el.innerHTML = html;
  deck.appendChild(el);
});

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
const nav = document.getElementById('nav');
const prog = document.getElementById('progress');
function show(n){
  cur = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,i)=>s.classList.toggle('active', i===cur));
  nav.textContent = (cur+1) + ' / ' + slides.length;
  prog.style.width = ((cur+1)/slides.length*100) + '%';
}
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1);
});
document.getElementById('deck').addEventListener('click', ()=>show(cur+1));
show(0);
</script>
</body>
</html>
