<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sticky Butt Masterclass — Coach Krystal Kelly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette traceable to 01-deep-research.md ## Palette:
     ground #241a12 (saddle leather), panel #33261a, rule #7a6a52 (warm sand),
     single accent #c79a4b (equestrian brass), ink #f3ece0.
     Type: Marcellus (display) + Inter (body). */
  :root{
    --bg:#241a12; --panel:#33261a; --rule:#7a6a52; --accent:#c79a4b; --ink:#f3ece0;
    --muted:#c6b9a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;border-bottom:1px solid rgba(122,106,82,.35);position:relative}
  .eyebrow{font-family:'Inter';text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;
    color:var(--accent);font-weight:600;margin-bottom:1.4rem}
  h1{font-family:'Marcellus';font-weight:400;font-size:clamp(2.6rem,6vw,5rem);line-height:1.06;letter-spacing:.4px}
  h2{font-family:'Marcellus';font-weight:400;font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.12}
  .sub{color:var(--muted);font-size:clamp(1.05rem,1.7vw,1.4rem);max-width:48ch;margin-top:1.6rem}
  .lede{font-size:clamp(1.15rem,1.9vw,1.5rem);max-width:52ch;margin-top:1.5rem}
  .rule{width:64px;height:2px;background:var(--accent);margin:0 0 2.2rem}
  ul{list-style:none;margin-top:2rem;max-width:54ch}
  li{position:relative;padding-left:1.7rem;margin:1.05rem 0;font-size:clamp(1.02rem,1.6vw,1.28rem)}
  li:before{content:"";position:absolute;left:0;top:.62em;width:9px;height:9px;background:var(--accent);transform:rotate(45deg)}
  .pillar{font-family:'Marcellus';color:var(--accent);font-size:1.15rem;letter-spacing:.06em}
  .kicker{color:var(--muted);font-size:.98rem;margin-top:1.4rem;max-width:50ch}
  .credit{color:var(--muted);margin-top:2.4rem;font-size:1rem}
  .panel{background:var(--panel);border:1px solid rgba(122,106,82,.4);padding:2.2rem 2.4rem;border-radius:4px;margin-top:2rem;max-width:58ch}
  .panel h2{margin-top:.5rem}
  .disclaimer{color:var(--muted);font-size:.82rem;margin-top:2.6rem;max-width:62ch;line-height:1.5}
  .pagenum{position:absolute;bottom:3vh;right:9vw;color:var(--rule);font-size:.8rem;letter-spacing:.1em}
  .big{font-family:'Marcellus';font-size:clamp(2.2rem,5vw,4rem);line-height:1.12;max-width:22ch}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass with Coach Krystal Kelly', h:'The Sticky Butt Masterclass', sub:'Why your position falls apart over bigger fences, and the three-part seat reset that fixes it.', credit:'Coach Krystal Kelly | FEI Level II Show Jumping Coach'},

  {t:'content', eyebrow:'The promise', h:'What you will walk away with today.', list:['Why more lessons have not fixed your position','The exact part of your riding that breaks over bigger fences','A three-part system to build a seat that holds, on the horse you already have'], kicker:'No theory for its own sake. Everything here you can start working on this week.'},

  {t:'section', eyebrow:'Who this is for', h:'The ambitious amateur who has quietly plateaued.', sub:'You ride well. You have the goals, the drive, and the horse. But over bigger fences something keeps slipping, and more lessons have not moved it.'},

  {t:'content', eyebrow:'The trap', h:'So you do what every rider is told to do.', list:['You book more lessons and drill the same course again','You wonder if you need a more scopey, more expensive horse','You blame the distance, the footing, the weather, the nerves'], kicker:'And the wall stays exactly where it was.'},

  {t:'content', eyebrow:'The real cost', h:'What the plateau quietly takes from you.', list:['Years of riding stuck at the same height','Confidence that erodes a little with every bad round','A good horse that gets blamed for a rider problem'], kicker:'The plateau is rarely a talent ceiling. It is a foundation that was never built.'},

  {t:'reframe', eyebrow:'The reframe', big:'The problem was never the horse. It is what your body does in the saddle.'},

  {t:'section', eyebrow:'Part one', h:'The real problem: a dependent seat.', sub:'A dependent seat borrows its balance from the reins, the stirrups, and the horse. It holds together on a quiet day and comes apart the moment the fences get bigger or the horse gets strong.'},

  {t:'content', eyebrow:'Part one', h:'What a dependent seat looks like over a fence.', list:['You tip, grip with the knee, or get left behind on take-off','Your hands move because your seat cannot stay still','You are managing your own body instead of riding the horse'], kicker:'On a bigger track, the horse feels it first, and so do the judges.'},

  {t:'content', eyebrow:'Part one', h:'Why lessons alone rarely fix it.', list:['Most coaching trains the horse, not the rider body that is failing','You cannot feel your own imbalance from inside it','A once-a-week lesson cannot build strength that lives in daily work'], kicker:'The missing piece is a system for the rider, off the horse and on it.'},

  {t:'section', eyebrow:'Part two', h:'The Sticky Butt Rider Foundation System.', sub:'A biomechanics-first way to build an independent, following seat, so you stay balanced and quiet over anything. Three pillars, built in order.'},

  {t:'pillar', eyebrow:'Part two, pillar one', pn:'Pillar one', h:'Core and balance, off the horse.', d:'The strength and body awareness that lets you own your own balance before you ever ask the horse for it. This is the work almost every rider skips.'},

  {t:'pillar', eyebrow:'Part two, pillar two', pn:'Pillar two', h:'An independent, following seat.', d:'Hips, seat bones and core working together so your lower body follows the motion and your hands finally go still. The horse can breathe underneath you.'},

  {t:'pillar', eyebrow:'Part two, pillar three', pn:'Pillar three', h:'Holding position through the jump.', d:'Keeping that seat on take-off, over the back, and on landing, so bigger fences stop breaking your position and start feeling like just another stride.'},

  {t:'content', eyebrow:'The application', h:'The Rider Reset: a 30-day arc.', list:['Week one, core and balance off the horse','Week two, an independent, following seat','Week three, holding position over fences','Week four, jumping bigger with confidence'], kicker:'In-saddle audio lessons and rider-specific exercises you can start this week.'},

  {t:'section', eyebrow:'Part three', h:'What changes when the seat is yours.', sub:'You stop riding defensively. Your position holds when the horse surprises you. The bigger track stops feeling like a different sport, because your body is no longer the variable.'},

  {t:'content', eyebrow:'Part three', h:'From plateau to podium, on the horse you already have.', list:['You progress without chasing a more expensive horse','Your good days become your normal days','You ride with the quiet confidence judges reward'], kicker:'This is how an amateur learns to ride like a Grand Prix rider: the body first.'},

  {t:'credibility', eyebrow:'Why learn this from me', h:'Coach Krystal Kelly.', list:['FEI Level II certified show jumping coach','Coached riders in more than twenty countries','Bridges United States and European show jumping standards','Founder of The International Equestrian and Riding Masters Academy'], kicker:'I built this system because the rider, not the horse, is almost always the thing holding an ambitious amateur back.'},

  {t:'cta', eyebrow:'Your next step', h:'Ready to reset your seat?', sub:'If you want my eyes on your riding, apply to work with me inside Riding Masters Academy and my VIP coaching. We will build your seat, your plan, and your path to bigger courses together.', cta:'Apply to Riding Masters Academy', disclaimer:'This masterclass is educational. Riding involves inherent risk, and results depend on your own practice, horse, and circumstances. No specific result, placing, or outcome is guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.eyebrow) inner += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.t === 'reframe') {
    inner += `<div class="rule"></div><div class="big">${s.big}</div>`;
  } else if (s.t === 'pillar') {
    inner += `<div class="panel"><div class="pillar">${s.pn}</div><h2>${s.h}</h2><div class="sub">${s.d}</div></div>`;
  } else {
    if (s.h) inner += (s.t === 'title') ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`;
    if (s.sub) inner += `<div class="${s.t==='title'?'sub':'lede'}">${s.sub}</div>`;
    if (s.list) { inner += '<ul>'; s.list.forEach(x => inner += `<li>${x}</li>`); inner += '</ul>'; }
    if (s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
    if (s.credit) inner += `<div class="credit">${s.credit}</div>`;
    if (s.cta) inner += `<div class="panel"><div class="pillar">${s.cta}</div></div>`;
    if (s.disclaimer) inner += `<div class="disclaimer">${s.disclaimer}</div>`;
  }
  inner += `<div class="pagenum">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
