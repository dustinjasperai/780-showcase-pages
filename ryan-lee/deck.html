<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The 3 Levers to Double Your Lighting Profits · Ryan Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#14110a; --panel:#1e1a10; --rule:rgba(255,187,0,.22);
    --accent:#ffbb00; --ink:#f6efe0; --muted:#b6a982; --tint:#ffd257;
  }
  html,body{height:100%}
  body{background:#080703;font-family:'Lato',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080703}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:radial-gradient(120% 90% at 82% 6%, #201a0e 0%, #14110a 46%, #0c0a05 100%);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .42s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--ink);line-height:1.12;letter-spacing:-.01em}
  .t-title h1{font-size:4.3vw;max-width:94%}
  .t-title h1 b{color:var(--accent);font-weight:800}
  .t-normal h1{font-size:3.0vw;max-width:88%;font-weight:700}
  .t-normal .body{font-family:'Lato',sans-serif;font-size:1.5vw;color:var(--muted);margin-top:2.6vh;max-width:78%;line-height:1.62;font-weight:400}
  .sub{font-family:'Lato',sans-serif;font-size:1.6vw;color:var(--muted);margin-top:3.2vh;max-width:82%;line-height:1.55;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.2vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:var(--accent);margin-top:3.6vh}
  .t-dark{background:linear-gradient(160deg,#1b160c 0%,#0a0804 100%);align-items:flex-start;justify-content:center}
  .t-dark h1{font-size:3.5vw;max-width:92%;color:var(--ink)}
  .t-dark h1 b{color:var(--tint);font-weight:800}
  .t-cta{background:linear-gradient(160deg,#1b160c 0%,#0a0804 100%);align-items:flex-start}
  .t-cta h1{font-size:3.9vw;max-width:88%;color:var(--ink)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap}
  .chip{border:1.5px solid var(--tint);color:var(--tint);border-radius:100px;padding:1.3vh 1.7vw;font-family:'Montserrat',sans-serif;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Lato',sans-serif;font-size:.9vw;color:var(--muted);font-style:italic;line-height:1.45}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.25vw;color:var(--muted);margin-top:3.6vh;font-weight:600;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:800}
  .beam{position:absolute;pointer-events:none}
  .title-beam{right:5%;bottom:0;width:34vw;height:100%;opacity:.9}
  .corner-beam{right:5%;bottom:0;width:16vw;height:70%;opacity:.55}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,187,0,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--muted);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Landscape Lighting Secrets</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- landscape-lighting motif: an uplight fixture casting a warm cone of light up into the dark -->
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="cone" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0" stop-color="#ffbb00" stop-opacity="0.42"/>
  <stop offset="1" stop-color="#ffbb00" stop-opacity="0"/>
</linearGradient>
<symbol id="beam" viewBox="0 0 200 300" preserveAspectRatio="xMidYMax meet">
  <path d="M100 262 L34 20 L166 20 Z" fill="url(#cone)"/>
  <rect x="92" y="258" width="16" height="26" rx="3" fill="none" stroke="#ffbb00" stroke-width="2.4" opacity="0.85"/>
  <circle cx="100" cy="258" r="5.5" fill="#ffd257"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The 3 Levers That <b>Double Your Profit</b> Without Doubling the Work',sub:'A live masterclass for landscape lighting business owners who are the best installer on the crew and the reason the business cannot grow past them.',brand:true,beam:'title'},
 {t:'normal',k:'Who this is for',title:'You build beautiful lighting. You are also buried under the business.',body:'You can design and install better than anyone you would hire. So every bid, every install, every problem still runs through you, and the busy season just means longer days for the same money at the end of the year.'},
 {t:'dark',title:'More installs was never the answer. <b>More profit per job</b> is.'},

 {t:'section',idx:'Part One',title:'Why Working Harder Stopped Paying'},
 {t:'normal',k:'The cheap-bid trap',title:'Competing on price is a race you win by losing.',body:'Most lighting contractors quote low to win the job, then work nights and weekends to make the math work. The skill that built your reputation, doing it all yourself, is the exact thing capping what the business can earn.'},
 {t:'normal',k:'The real number',title:'The goal is not a fuller schedule. It is a bigger number per job.',body:'Two contractors can install the same lights on the same street. One nets a few hundred dollars, the other a few thousand. The difference is never the fixtures. It is price, the right leads, and how the sale gets closed.'},
 {t:'dark',title:'You do not have a lead problem or a labor problem. You have a <b>profit-per-job</b> problem.'},

 {t:'section',idx:'Part Two',title:'The Three Levers'},
 {t:'normal',k:'Lever one: price',title:'Raise the price before you do anything else.',body:'On most lighting jobs a 10% price increase can double the profit, because your costs barely move. Selling the design and the result instead of the fixture count is what lets you charge it, and it is the fastest change you can make this week.'},
 {t:'normal',k:'Lever two: qualified leads',title:'Fewer, better leads beat a flood of price shoppers.',body:'You do not need more calls. You need calls from homeowners who already want premium lighting and are not opening with "what is your cheapest option." A real personal brand in your market is also what smooths out the slow season.'},
 {t:'normal',k:'Lever three: closing',title:'Close in the yard, not in an emailed quote.',body:'The quote you email and wait on is the quote you lose. Designing and closing on the spot, while you are standing in their yard and the vision is alive, is what turns a higher price into a signed job instead of a ghosted follow-up.'},
 {t:'dark',title:'Price, leads, and closing are the only three dials. <b>Turn all three</b> and the profit doubles.'},

 {t:'section',idx:'Part Three',title:'From Operator to Owner'},
 {t:'normal',k:'The shift',title:'Build the business so it runs on the levers, not on you.',body:'Once price, leads, and closing are systems your team runs, you stop being the operator on every job and become the owner of the company. That is the shift that collapses the years it usually takes to reach a seven-figure lighting business.'},
 {t:'dark',title:'The business should not need you in every truck. <b>It should need your system.</b>'},
 {t:'normal',k:'Why Ryan',title:'I built this in a truck before I taught it in a room.',body:'I grew Majestic Outdoor Lighting to $200k a month and sold it in 2019. Landscape Lighting Secrets is what I did next, and members have generated more than $75 million in lighting revenue using these same three levers. This masterclass is that playbook, start to finish.'},

 {t:'section',idx:'Your Next Step',title:'Double the Profit on the Jobs You Already Win'},
 {t:'normal',k:'Landscape Lighting Secrets',title:'Take one lever and turn it this week.',body:'Start with price on your very next bid. When you are ready to run all three as a system, the free case study walks through exactly how it was done, and the coaching is where we build it into your business.'},
 {t:'cta',title:'Ready to double your profit without doubling the work?',chips:['Watch the free case study','Landscape Lighting Secrets'],disc:'Educational content for landscape lighting business owners. No specific income or business result is guaranteed. Results vary by market, pricing, effort, and execution.'},
];

const deck=document.getElementById('deck');
function beam(kind){return `<svg class="beam ${kind==='title'?'title-beam':'corner-beam'}"><use href="#beam"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Landscape Lighting <b>Secrets</b> · Ryan Lee</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.beam) h+=beam(s.beam);
  else if(s.t==='title') h+=beam('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
