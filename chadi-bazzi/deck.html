<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win The Listing Appointment, Chadi Bazzi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1b30;
    --panel:#16263f;
    --rule:#2c3f5e;
    --accent:#375daa;
    --muted:#aeb8c9;
    --ink:#eaf0f8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vmin}
  .slide{display:none;width:min(1040px,94vw);max-height:92vh}
  .slide.on{display:block}
  .kick{font-family:"Fira Sans",sans-serif;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-size:15px;margin-bottom:22px}
  h1{font-family:"Fira Sans",sans-serif;font-weight:700;font-size:58px;line-height:1.05;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:"Fira Sans",sans-serif;font-weight:700;font-size:40px;line-height:1.12;color:var(--ink)}
  .sub{color:var(--muted);font-size:24px;line-height:1.5;margin-top:26px;max-width:40ch}
  .lead{font-size:28px;line-height:1.5;margin-top:22px;max-width:44ch}
  .big{font-family:"Fira Sans",sans-serif;font-weight:700;font-size:72px;line-height:1.04;color:var(--ink)}
  .big .ac{color:var(--accent)}
  .partno{font-family:"Fira Sans",sans-serif;font-weight:700;font-size:150px;color:var(--rule);line-height:.9}
  ul{list-style:none;margin-top:30px;display:grid;gap:18px}
  li{position:relative;padding-left:40px;font-size:24px;line-height:1.45;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:11px;width:16px;height:16px;border:3px solid var(--accent);border-radius:4px}
  .step{display:flex;gap:34px;align-items:flex-start}
  .letter{font-family:"Fira Sans",sans-serif;font-weight:700;font-size:120px;color:var(--accent);line-height:.85;flex:0 0 auto}
  .stepbody h2{font-size:38px}
  .stepbody .sub{margin-top:16px;font-size:23px;max-width:34ch}
  .stat{display:flex;gap:56px;margin-top:40px;flex-wrap:wrap}
  .stat div span{display:block;font-family:"Fira Sans",sans-serif;font-weight:700;font-size:54px;color:var(--accent)}
  .stat div small{color:var(--muted);font-size:18px;letter-spacing:.04em}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:48px 52px}
  .btn{display:inline-block;margin-top:34px;font-family:"Fira Sans",sans-serif;font-weight:600;font-size:22px;color:#fff;background:var(--accent);border-radius:100px;padding:18px 36px}
  .disc{margin-top:40px;color:var(--muted);font-size:15px;line-height:1.6;max-width:60ch;border-top:1px solid var(--rule);padding-top:22px}
  .nav{position:fixed;bottom:22px;right:28px;color:var(--muted);font-size:14px;font-family:"Fira Sans",sans-serif;letter-spacing:.08em}
  .brandfoot{position:fixed;bottom:22px;left:28px;color:var(--muted);font-size:14px;font-family:"Fira Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase}
  @media(max-width:640px){h1{font-size:40px}.big{font-size:48px}.partno{font-size:96px}.letter{font-size:80px}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandfoot">Chadi Bazzi</div>
<div class="nav"><span id="pos">1</span> / <span id="tot">1</span> &nbsp;·&nbsp; arrow keys</div>
<script>
const S = [
  {t:'title', k:'The One Listing A Week Masterclass', h:'Win The Listing Appointment', sub:'How to turn the listing appointments you already get into signed listings, one a week, without buying leads or running ads.'},
  {t:'who', k:'Who this is for', h:'The agent who gets in the door and still loses the listing', sub:'You can get appointments. The problem is not lead count. The problem is what happens once you are sitting across from the seller.'},
  {t:'trap', k:'The trap', h:'Chasing more leads to fix a conversion problem', sub:'More leads just means more appointments you lose the same way. You do not have a volume problem. You have an appointment problem.'},
  {t:'reframe', k:'The reframe', big:'The listing is usually lost <span class="ac">before</span> you ever present.'},
  {t:'part', no:'01', h:'Why better scripts keep failing'},
  {t:'point', k:'Part one', h:'It is not a wording problem', sub:'Agents memorize a new script every year and still freeze in the room. The words were never what won the listing.'},
  {t:'point', k:'Part one', h:'It is an identity and state problem', sub:'The seller is not buying a script. They are reading whether you are the calm, certain person who will handle the most important sale of their life. It is the agent who embodies the method, not the one who recites it, who wins.'},
  {t:'part', no:'02', h:'The DEAL method'},
  {t:'step', letter:'D', h:'Diagnose the seller', sub:'Before you present anything, find out what actually has to go right for them. You cannot win a listing you have not understood.'},
  {t:'step', letter:'E', h:'Set the expectations', sub:'Frame how the conversation will go up front, so the appointment runs on your terms instead of theirs.'},
  {t:'step', letter:'A', h:'Assign the homework', sub:'Get the seller to take one small action. Commitment on the appointment predicts the signature after it.'},
  {t:'step', letter:'L', h:'Lock in the state', sub:'Manage your own state and the seller\'s through the conversation. State is contagious, and certainty is what they are buying.'},
  {t:'point', k:'The DEAL method', h:'You win without closing', sub:'Run the four moves and the seller talks themselves into choosing you. There is no hard close because there is nothing left to overcome.'},
  {t:'part', no:'03', h:'The one listing a week week'},
  {t:'point', k:'Part three', h:'Two sources you work every day', sub:'Your next listing comes from people you can reach without an ad budget. The skill is working those two sources daily, not finding a new lead hack.'},
  {t:'point', k:'Part three', h:'A repeatable rhythm', sub:'Reach out, set appointments, run the DEAL, lock the listing, follow up. The same week, every week, is what produces a listing a week.'},
  {t:'why', k:'Why me', h:'I have had this conversation 40,000 times', stats:[['25+','years in real estate'],['10,000+','agents coached'],['40,000+','coaching calls']], sub:'Across 25 years the focus has never changed: helping agents build the skill and the identity to win listings.'},
  {t:'recap', k:'What you can do now', h:'Stop guessing where the next listing comes from', sub:'Diagnose before you present, run the four moves, and work the same week every week. That is a listing business you can count on.'},
  {t:'cta', k:'Your next step', h:'Build your listing business with me', sub:'Join the free masterclass and see the full DEAL method, then apply for The Listing Agent Blueprint to build it with my coaching.', btn:'Join the free masterclass', disc:'Educational content only. No income or result is guaranteed. Results vary based on your effort, your market, and your implementation. Individual client outcomes are not a promise of your results.'}
];

const stage = document.getElementById('stage');
function render(){
  stage.innerHTML = '';
  S.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' on' : '');
    let inner = '';
    if (s.k) inner += '<div class="kick">' + s.k + '</div>';
    if (s.t === 'reframe') {
      inner += '<div class="big">' + s.big + '</div>';
    } else if (s.t === 'part') {
      inner += '<div class="partno">' + s.no + '</div><h1 style="margin-top:18px">' + s.h + '</h1>';
    } else if (s.t === 'step') {
      inner += '<div class="step"><div class="letter">' + s.letter + '</div><div class="stepbody"><h2>' + s.h + '</h2><div class="sub">' + s.sub + '</div></div></div>';
    } else {
      if (s.h) inner += (s.t === 'title' ? '<h1>' : '<h2>') + s.h + (s.t === 'title' ? '</h1>' : '</h2>');
      if (s.stats){
        let st = '<div class="stat">';
        s.stats.forEach(p => st += '<div><span>' + p[0] + '</span><small>' + p[1] + '</small></div>');
        st += '</div>';
        inner += st;
      }
      if (s.sub) inner += '<div class="' + (s.t === 'title' ? 'sub' : 'lead') + '">' + s.sub + '</div>';
      if (s.btn) inner += '<div class="btn">' + s.btn + '</div>';
      if (s.disc) inner += '<div class="disc">' + s.disc + '</div>';
    }
    el.innerHTML = inner;
    stage.appendChild(el);
  });
  document.getElementById('tot').textContent = S.length;
}
let cur = 0;
function go(n){
  const slides = document.querySelectorAll('.slide');
  slides[cur].classList.remove('on');
  cur = Math.max(0, Math.min(S.length - 1, n));
  slides[cur].classList.add('on');
  document.getElementById('pos').textContent = cur + 1;
}
render();
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') go(cur + 1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1);
});
document.addEventListener('click', () => go(cur + 1));
</script>
</body>
</html>
