<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take Your Seat | A masterclass with Louise Thompson</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Questrial&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --panel:#ffffff; --accent:#6e8c7b; --deep:#015243;
  --ink:#102e26; --muted:#5d6b63; --rule:rgba(110,140,123,.35);
  --head:'Marcellus', Georgia, serif; --body:'Questrial', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
#stage{max-width:960px;margin:0 auto;padding:48px 24px 96px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:56px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;
  justify-content:center;box-shadow:0 1px 0 rgba(16,46,38,.04)}
.slide.dark{background:var(--deep);color:#f3efe4;border-color:transparent}
.slide.dark .kick,.slide.dark .num{color:#b9ccbf}
.slide.dark .accent{color:#cfe0d3}
.kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
  font-weight:600;margin-bottom:22px}
h1{font-family:var(--head);font-weight:400;font-size:66px;line-height:1.02;letter-spacing:.005em}
h2{font-family:var(--head);font-weight:400;font-size:46px;line-height:1.06;margin-bottom:16px}
.lead{font-size:22px;line-height:1.5;color:var(--muted);max-width:60ch;margin-top:18px}
.slide.dark .lead{color:#d6e2d9}
.big{font-family:var(--head);font-size:54px;line-height:1.1;font-weight:400;max-width:20ch}
.accent{color:var(--accent)}
.strike{text-decoration:line-through;text-decoration-color:var(--accent);opacity:.55}
ul{list-style:none;margin-top:26px;display:grid;gap:16px;max-width:64ch}
li{position:relative;padding-left:30px;font-size:21px;line-height:1.45;color:var(--ink)}
.slide.dark li{color:#eaf1ea}
li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;
  background:var(--accent);transform:rotate(45deg)}
.num{font-size:13px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;
  margin-top:34px;font-weight:500}
.quote{font-family:var(--head);font-size:42px;line-height:1.18;font-weight:400;max-width:24ch}
.cta h2{font-size:52px}
.disc{font-size:14px;color:var(--muted);margin-top:28px;max-width:62ch;line-height:1.5}
.creds{font-size:19px;color:var(--muted);margin-top:16px;line-height:1.6}
@media(max-width:620px){.slide{padding:36px 26px;min-height:340px}h1{font-size:42px}h2{font-size:32px}.big,.quote{font-size:34px}}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title', cls:'', html:`<div class="kick">A live masterclass with Louise Thompson</div>
    <h1>Take Your Seat</h1>
    <p class="lead">Why the most capable woman in the room keeps getting overlooked, and how to be seen as the strategic leader you already are. Without working more hours, and without "fixing" a confidence you were never actually missing.</p>`},

  {t:'list', cls:'', html:`<div class="kick">Who this is for</div>
    <h2>You did what you were told.</h2>
    <p class="lead">Be helpful. Work hard. Never say no. And now you are the most capable, expert person in the room, but not the one people turn to as a strategic advisor.</p>
    <ul>
      <li>You get to Friday unsure what you actually achieved</li>
      <li>Your diary is filled by other people's priorities, not yours</li>
      <li>You are delivering constantly, but no one sees your strategic contribution</li>
    </ul>`},

  {t:'hook', cls:'dark', html:`<div class="kick">The reframe</div>
    <p class="big">That is not a confidence problem.<br>It is <span class="accent">positioning</span>.</p>
    <p class="lead">For years I thought I was struggling with confidence. I was not. It was conditioning.</p>`},

  {t:'section', cls:'', html:`<div class="num">Part One</div>
    <h2>The conditioning trap</h2>
    <p class="lead">The kind that teaches capable, expert women to be useful rather than visible, and to accept that most corporate cultures were not built for them to lead in.</p>`},

  {t:'list', cls:'', html:`<div class="kick">Useful, not visible</div>
    <h2>How capable women get stuck just below the level they are ready for</h2>
    <ul>
      <li>Holding it all together, waiting to be seen, recognised and valued</li>
      <li>Mistaking being busy for being strategic</li>
      <li>Reading the room as "I need more confidence" when the real gap is positioning</li>
    </ul>`},

  {t:'quote', cls:'dark', html:`<div class="kick">The busy trap</div>
    <p class="quote">You are operating below your level. You just cannot seem to stop.</p>`},

  {t:'section', cls:'', html:`<div class="num">Part Two</div>
    <h2>Take Your Seat</h2>
    <p class="lead">Positioning over performance. The work is not to do more. It is to be seen differently, on purpose.</p>`},

  {t:'hook', cls:'', html:`<div class="kick">The shift</div>
    <p class="big">From <span class="strike">doer</span> to <span class="accent">leader</span>.</p>
    <p class="lead">Not louder. Not harder. A deliberate change in how your contribution is framed, so your authority is obvious to the room and to you.</p>`},

  {t:'list', cls:'', html:`<div class="kick">Pillar one</div>
    <h2>Make your strategic contribution visible</h2>
    <ul>
      <li>Name the value you are already creating, in language the room recognises</li>
      <li>Shift from reactive to intentional, so Monday starts with direction, not an inbox</li>
      <li>Stop waiting to be chosen and start positioning for the seat</li>
    </ul>`},

  {t:'list', cls:'', html:`<div class="kick">Pillar two, the practice</div>
    <h2>The Friday Reset</h2>
    <p class="lead">Five questions. Thirty minutes. Every Friday. A leadership practice, not a productivity tool.</p>
    <ul>
      <li>The five questions that shift you from busy to strategic</li>
      <li>A diagnostic for when you cannot even find the time, and what that tells you</li>
      <li>A way to use your answers as leadership evidence, not just personal reflection</li>
    </ul>`},

  {t:'quote', cls:'dark', html:`<div class="kick">Why it works</div>
    <p class="quote">It will not help you do more. It will help you be seen differently.</p>`},

  {t:'list', cls:'', html:`<div class="kick">Pillar three</div>
    <h2>Executive presence is communication</h2>
    <p class="lead">From a former board-level Director of Communications: presence is not performance, it is how clearly your judgement lands.</p>
    <ul>
      <li>Communicate with impact so your voice is heard</li>
      <li>Hold difficult conversations and give feedback without shrinking</li>
      <li>Lead change, and lead a team, like someone who belongs at the table</li>
    </ul>`},

  {t:'section', cls:'', html:`<div class="num">Part Three</div>
    <h2>When the overlooking stops</h2>
    <p class="lead">Your weekend is actually yours again. Your contribution is named before you have to claim it. You are in the room as a leader, not the reliable pair of hands.</p>`},

  {t:'list', cls:'', html:`<div class="kick">Why me</div>
    <h2>I have led at that level, and I got stuck there too</h2>
    <p class="creds">More than 20 years as a Director of Communications, much of it at board level, across the NHS and the private sector. Coaching was part of how I made this shift myself, from someone who delivered quietly to someone who led confidently.</p>
    <p class="creds">Clients I have worked with include Google, the NHS, Lloyds Bank, Activision and Charlotte Tilbury.</p>`},

  {t:'list', cls:'', html:`<div class="kick">The shape of the shift</div>
    <h2>What you leave with</h2>
    <ul>
      <li>The reframe: it is conditioning and positioning, not a confidence deficit</li>
      <li>The doer to leader move, made deliberate</li>
      <li>The Friday Reset as a weekly practice you can start immediately</li>
    </ul>`},

  {t:'cta', cls:'cta dark', html:`<div class="kick">Your next step</div>
    <h2>Ready to take your seat?</h2>
    <p class="lead">If you are a senior woman ready to stop being overlooked and overwhelmed, book a free coaching discovery call, or join the next Confident Communications Leader programme. Let's get to work.</p>
    <p class="disc">Educational content only. No income, role, or result is guaranteed. Results vary and depend on your own circumstances and effort.</p>`}
];
const stage = document.getElementById('stage');
S.forEach(s=>{const d=document.createElement('section');d.className='slide '+(s.cls||'');d.innerHTML=s.html;stage.appendChild(d);});
</script>
</body>
</html>
