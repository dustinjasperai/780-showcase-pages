<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter-By-Chapter | A live masterclass with Brenda Smit-James</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F4;
    --panel:#F3ECF0;
    --ink:#543950;
    --accent:#45a5a2;
    --rule:#2c2c2c;
    --body:#4a4247;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:'Montserrat',sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:var(--bg);
    border:1px solid rgba(84,57,80,.14);
    border-radius:4px;
    padding:64px 56px;
    margin:0 0 28px;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .slide::before{
    content:attr(data-n);
    position:absolute;top:22px;right:28px;
    font-size:12px;letter-spacing:.18em;color:var(--accent);
    font-weight:600;
  }
  .kicker{
    font-size:13px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:22px;
  }
  h1,h2,h3{font-family:'Libre Baskerville',Georgia,serif;color:var(--ink);line-height:1.18}
  h1{font-size:46px;margin-bottom:18px}
  h2{font-size:34px;margin-bottom:16px}
  h3{font-size:22px;margin-bottom:10px}
  p{font-size:19px;line-height:1.6;margin-bottom:14px;max-width:62ch}
  .lead{font-size:23px;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.55;padding:12px 0 12px 26px;position:relative;border-bottom:1px solid rgba(84,57,80,.10)}
  li::before{content:"";position:absolute;left:0;top:21px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .big{font-family:'Libre Baskerville',Georgia,serif;font-size:30px;color:var(--ink);line-height:1.3}
  .sub{font-size:16px;color:var(--body);letter-spacing:.02em}
  .rule{width:54px;height:3px;background:var(--accent);margin:18px 0 24px}
  .title-slide{background:var(--panel);text-align:left}
  .cta-slide{background:var(--panel)}
  .disc{font-size:13px;color:#7a7079;margin-top:26px;line-height:1.5;max-width:66ch}
  .by{font-size:16px;color:var(--ink);font-weight:600;margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass', h:'Chapter-By-Chapter', lead:'How to build a memoir that reads like a page-turner, one chapter at a time.', by:'with Brenda Smit-James', cls:'title-slide'},
  {t:'who', kicker:'Who this is for', h:'You have a hot mess of scenes. Not a story. Yet.', p:['If you have pages and pages of memories but no book, this hour is for you.','You are not a bad writer. You are missing the structure nobody taught you.']},
  {t:'trap', kicker:'The trap', h:'Rewriting the same chapters, forever.', p:['You rewrite chapter three for the fifth time and it still drags.','You sense something is off but you cannot name it.','So you keep writing, hoping it will come together on its own.']},
  {t:'reframe', kicker:'The real problem', big:'Your memoir is not failing because of your story. It is failing because of your chapters.'},
  {t:'promise', kicker:'In the next hour', h:'Three things you will walk away with', list:['Why a pile of scenes never becomes a book on its own','The four parts every strong chapter needs','A way to build the rest of your memoir without endless rewrites']},
  {t:'part', kicker:'Part one', h:'Why most memoirs stall'},
  {t:'content', kicker:'Part one', h:'A pile of scenes is not a book.', p:['When you flip through any book, the first thing you see is its form: the chapters.','Chapters are the visual structure of a book. Events and scenes do not live on their own. They live inside a chapter.']},
  {t:'content', kicker:'Part one', h:'A weak chapter kills narrative drive.', p:['Narrative drive is the force that makes a reader turn the page.','A chapter that is just a body of information has none. And one weak chapter makes the whole memoir feel flat.']},
  {t:'part', kicker:'Part two', h:'The Chapter-By-Chapter framework'},
  {t:'pillar', kicker:'Part two: pillar one', h:'Start with your memoir’s unique message.', p:['Writing without knowing your message is how you lose weeks, months, even years writing in the wrong direction.','Name the one message first. Everything else gets built to serve it.']},
  {t:'pillar', kicker:'Part two: pillar two', h:'Design your story spine: premise to promise.', p:['Before you draft, you build a blueprint for the book so you know where you are going and how you get there.','The spine carries the reader from your premise to the promise your memoir makes.']},
  {t:'pillar', kicker:'Part two: pillar three', h:'Build each chapter scene by scene.', p:['A chapter has a structure you have to deliver on. You build it scene by scene, starting from the opening line.','The opening line is a promise to the reader. The scenes keep it.']},
  {t:'pillar', kicker:'Part two: pillar four', h:'End the chapter at the turn.', p:['Knowing where to end a chapter, at just the right place, is what creates the pull into the next one.','End at the turn, not at the explanation. That is narrative drive you can feel.']},
  {t:'content', kicker:'Part two', h:'Execute drive well in every chapter.', big:'Build one chapter well, and then it is a case of rinse and repeat until your memoir is done.'},
  {t:'part', kicker:'Part three', h:'When the structure holds'},
  {t:'look', kicker:'Part three', h:'From a hot mess to a must-read.', p:['The scenes stop floating. They sit inside chapters that each carry one unit of drive.','You stop rewriting in the dark because you can see the shape of the whole book.']},
  {t:'look', kicker:'Part three', h:'You save the weeks you were losing.', p:['Strong chapters that build on each other save you weeks of rewrites, never mind the editing costs.','You write with a map instead of a hope.']},
  {t:'why', kicker:'Why learn this from me', h:'I wrote my way out of the dark.', p:['I never saw myself as a writer. Then an eighteen-month depression in my late thirties changed everything.','I wrote my memoir to survive my grief, to be released from the fear of forgetting and the torment of remembering.'], by:'Brenda Smit-James, author of When God Says No'},
  {t:'recap', kicker:'Remember', h:'You are always part of three stories.', p:['Your story. Someone else’s story. And the larger story you are living inside.','A memoir built chapter by chapter lets a reader live all three with you.']},
  {t:'cta', kicker:'Your next step', h:'Join the next live Chapter-By-Chapter masterclass.', p:['Get on the priority list to be notified first when the next live session opens, and bring the chapter that keeps fighting you.','We will build it together, scene by scene.'], by:'Brenda Smit-James | brendasmitjames.com', disc:'This masterclass is educational. No publishing outcome, sale, or income result is guaranteed. Results vary and depend on the work you put into your own writing.', cls:'cta-slide'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  el.setAttribute('data-n', String(i + 1).padStart(2, '0') + ' / ' + S.length);
  let html = '';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.h) html += (s.cls === 'title-slide' ? '<h1>' + s.h + '</h1>' : '<h2>' + s.h + '</h2>');
  if (s.lead) html += '<div class="rule"></div><p class="lead">' + s.lead + '</p>';
  if (s.big) html += '<div class="rule"></div><p class="big">' + s.big + '</p>';
  if (s.p) s.p.forEach(x => html += '<p>' + x + '</p>');
  if (s.list) { html += '<ul>'; s.list.forEach(x => html += '<li>' + x + '</li>'); html += '</ul>'; }
  if (s.by) html += '<p class="by">' + s.by + '</p>';
  if (s.disc) html += '<p class="disc">' + s.disc + '</p>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
