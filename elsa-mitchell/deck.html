<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Well-Oiled Machine | A masterclass with Elsa Mitchell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#eaf6f5;
    --panel:#ffffff;
    --panel2:#edf8f7;
    --ink:#222222;
    --ink-soft:#4a4440;
    --ink-muted:#8a807a;
    --rule:#d2e8e6;
    --accent:#16b4b8;
    --accent2:#fa824c;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Spectral',Georgia,serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;
  }
  #stage{width:100%;max-width:1040px;aspect-ratio:16/9;position:relative;}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:64px 72px;background:var(--panel);border:1px solid var(--rule);}
  .slide.on{display:flex;}
  .kicker{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  .kicker.coral{color:var(--accent2);}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:54px;line-height:1.05;
    letter-spacing:-.02em;margin-bottom:22px;}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:37px;line-height:1.12;
    letter-spacing:-.01em;margin-bottom:18px;}
  .lede{font-size:24px;line-height:1.5;color:var(--ink-soft);max-width:46ch;}
  .lede b,.quote b{color:var(--accent);font-weight:600;}
  .big{font-family:'Montserrat',sans-serif;font-weight:700;font-size:29px;line-height:1.3;max-width:40ch;}
  p.body{font-size:21px;line-height:1.55;color:var(--ink-soft);max-width:48ch;margin-top:8px;}
  .sub{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:600;letter-spacing:.03em;
    color:var(--ink-muted);margin-top:28px;}
  ul.points{list-style:none;margin-top:14px;}
  ul.points li{font-size:21px;line-height:1.4;color:var(--ink-soft);padding:12px 0 12px 34px;
    position:relative;border-bottom:1px solid var(--rule);max-width:50ch;}
  ul.points li:last-child{border-bottom:none;}
  ul.points li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;
    background:var(--accent);border-radius:2px;}
  ul.points li.coral::before{background:var(--accent2);}
  .pillars{display:flex;gap:18px;margin-top:24px;}
  .pillar{flex:1;background:var(--panel2);border-top:4px solid var(--accent);padding:24px 22px;}
  .pillar:nth-child(2){border-top-color:var(--accent2);}
  .pillar:nth-child(3){border-top-color:var(--ink);}
  .pillar .n{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;color:var(--ink-muted);}
  .pillar .t{font-family:'Montserrat',sans-serif;font-weight:700;font-size:23px;margin:6px 0 10px;}
  .pillar .d{font-size:16px;line-height:1.45;color:var(--ink-soft);}
  .present{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:600;margin-top:34px;}
  .present span{color:var(--ink-muted);font-weight:500;}
  .quote{font-family:'Spectral',serif;font-style:italic;font-size:32px;line-height:1.4;max-width:40ch;}
  .checklist{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin-top:22px;max-width:54ch;}
  .checklist div{font-size:19px;color:var(--ink-soft);padding-left:30px;position:relative;line-height:1.35;}
  .checklist div::before{content:"\2713";position:absolute;left:0;top:0;color:var(--accent);
    font-family:'Montserrat',sans-serif;font-weight:800;}
  .disclaimer{font-family:'Montserrat',sans-serif;font-size:13px;line-height:1.5;color:var(--ink-muted);
    margin-top:24px;max-width:62ch;}
  .cta-step{font-family:'Montserrat',sans-serif;font-weight:800;font-size:27px;color:var(--accent2);margin:4px 0 6px;}
  #nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;color:var(--ink-muted);
    display:flex;gap:16px;align-items:center;}
  #nav button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--rule);
    padding:6px 14px;cursor:pointer;border-radius:3px;}
  #count{min-width:60px;text-align:center;}
  @media(max-width:720px){
    .slide{padding:34px 30px;}h1{font-size:34px;}h2{font-size:25px;}.lede{font-size:19px;}
    .big{font-size:21px;}.quote{font-size:23px;}.pillars{flex-direction:column;}.checklist{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">&larr;</button><span id="count"></span><button id="next">&rarr;</button></div>
<script>
const S=[
 {t:'title',k:"A live masterclass for women in business",hd:"The Well-Oiled Machine",
  lede:"How to build the foundations that let your business run <b>without running you</b>.",present:true},
 {t:'content',k:"The plan for today",hd:"What we'll cover",
  points:["Why more hustle stopped working","The method: Clarity, Community, Foundations","The Sweet Spot your business is aiming for","Your first move after today"]},
 {t:'content',k:"Who this is for",hd:"You're wearing all the hats, and it's exhausting",
  body:"You're busy. Like, really busy. You chip away at the to-do list and still can't make a dent. But the growth? It just isn't showing up. And you're ready for it."},
 {t:'quote',k:"The real problem",quote:"You don't have a <b>hustle</b> problem. You have a <b>foundations</b> problem."},
 {t:'content',k:"Part one",hd:"Right now, the business runs through you",
  points:["Every decision lands back on your desk","Nothing happens unless you push it","More hours is the only lever you have left","So the harder you work, the more stuck it feels"]},
 {t:'content',k:"Let's be honest",big:"Sorry, no four-hour work week. No business hacks. The thing that actually moves the needle is the boring stuff nobody wants to sell you.",
  sub:"Foundations. Systems. The nuts and bolts."},
 {t:'content',k:"Part two",hd:"The method: Clarity, Community, Foundations",
  body:"This is how I help women in business make more money: by getting the clarity they need, developing the community they need, and implementing the foundations they need to make the impact they want.",
  pillars:[
   {n:"01",t:"Clarity",d:"Know exactly what to focus on next. One thing, not five thousand more jobs on the list."},
   {n:"02",t:"Foundations",d:"The systems a business needs before it can scale: web, Google, socials, service, repeat sales."},
   {n:"03",t:"Community",d:"The biz besties and the accountability. You're only as good as who you surround yourself with."}
  ]},
 {t:'content',k:"Pillar 01 · Clarity",hd:"Stop winging it",
  body:"Most owners are too close to their own business to see the fix. We get clear on the one next move that actually grows sales, and we park the rest until it's done."},
 {t:'content',k:"The diagnostic",hd:"Unpack and repack",
  body:"We take the whole business apart, look at what's really going on, and repack it with strategies and ideas that work. Not theory. The stuff that has already worked in real businesses."},
 {t:'content',k:"Pillar 02 · Foundations",hd:"The Sweet Spot",
  body:"The stage every business is aiming for. When these are in place, the machine starts to run on its own:",
  checklist:["Your website is well established","You're making friends with Google","Your social media game is strong","New clients are being generated","Your customer service is top-notch","The business holds for a day without you"]},
 {t:'content',k:"Pillar 02 · Foundations",hd:"Good customer service isn't good enough",
  body:"The cheapest growth you'll ever get is the client you already have. We build the service and repeat-sale systems that turn one sale into the next one, on purpose, not by luck."},
 {t:'content',k:"Pillar 03 · Community",hd:"You're only as good as your crew",
  body:"Growth is lonely when you do it alone. The right room gives you accountability, referrals, and people who've already solved the thing that's keeping you up at night."},
 {t:'content',k:"The goal",hd:"A business that runs like a well-oiled machine",
  points:["You know the one thing to work on each week","Leads come in without you chasing them","The systems hold when you take a day off","You're building the business, not just surviving it"]},
 {t:'quote',k:"If not now, when?",quote:"I said it wasn't the right time too. Then I realised that's exactly <b>why</b> it was."},
 {t:'content',k:"Why listen to me",hd:"I've actually done this",
  body:"Twenty years building businesses from the ground up, from beauty to construction, and turning them into award-winning, profit-churning powerhouses. I'm not a coach who did a course and never owned a business. I've lived the nuts and bolts.",
  sub:"Elsa Mitchell · host of the Bossy Bitch Podcast"},
 {t:'content',k:"The whole thing in one line",big:"Get clear on the one move, build the foundations under it, and surround yourself with the right people. That's how the machine runs.",
  sub:"Clarity · Foundations · Community"},
 {t:'cta',k:"Your next move",hd:"Put your hand up",cta:"Fill in the form. It takes about a minute.",
  body:"If you want someone to look at YOUR business and tell you exactly what to focus on, this is where we start. We have a free 30-minute chat, no sales pitch, and we work out if we're a fit.",
  disclaimer:"This masterclass is educational. Every business is different and results depend on your own work, market, and effort. Nothing here is a guarantee of income or any specific result."}
];
const stage=document.getElementById("stage");
S.forEach((s,i)=>{
  const d=document.createElement("div");d.className="slide"+(i===0?" on":"");let h="";
  if(s.k)h+=`<div class="kicker${s.t==='cta'?' coral':''}">${s.k}</div>`;
  if(s.hd&&s.t==='title')h+=`<h1>${s.hd}</h1>`;else if(s.hd)h+=`<h2>${s.hd}</h2>`;
  if(s.quote)h+=`<div class="quote">${s.quote}</div>`;
  if(s.lede)h+=`<div class="lede">${s.lede}</div>`;
  if(s.big)h+=`<div class="big">${s.big}</div>`;
  if(s.cta)h+=`<div class="cta-step">${s.cta}</div>`;
  if(s.body)h+=`<p class="body">${s.body}</p>`;
  if(s.points){h+='<ul class="points">';s.points.forEach((p,j)=>h+=`<li${j%2?' class="coral"':''}>${p}</li>`);h+="</ul>";}
  if(s.pillars){h+='<div class="pillars">';s.pillars.forEach(p=>h+=`<div class="pillar"><div class="n">${p.n}</div><div class="t">${p.t}</div><div class="d">${p.d}</div></div>`);h+="</div>";}
  if(s.checklist){h+='<div class="checklist">';s.checklist.forEach(c=>h+=`<div>${c}</div>`);h+="</div>";}
  if(s.sub)h+=`<div class="sub">${s.sub}</div>`;
  if(s.present)h+=`<div class="present">Presented live by Elsa Mitchell <span>· Elsa Mitchell Business Mentoring</span></div>`;
  if(s.disclaimer)h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  d.innerHTML=h;stage.appendChild(d);
});
let cur=0;const slides=[...document.querySelectorAll(".slide")];const count=document.getElementById("count");
function show(n){slides[cur].classList.remove("on");cur=(n+slides.length)%slides.length;
  slides[cur].classList.add("on");count.textContent=(cur+1)+" / "+slides.length;}
document.getElementById("next").onclick=()=>show(cur+1);
document.getElementById("prev").onclick=()=>show(cur-1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" ")show(cur+1);if(e.key==="ArrowLeft")show(cur-1);});
count.textContent="1 / "+slides.length;
</script>
</body>
</html>
