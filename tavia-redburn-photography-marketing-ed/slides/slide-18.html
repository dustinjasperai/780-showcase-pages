<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Slide 18 | The Fully Booked Birth Roadmap</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--cream:#faf5f2;--ink:#363636;--rose:#c6aca3;--roseD:#9c7d72;--blush:#efe4dd;--muted:#7a6f69;}
html,body{height:100%;}
body{background:var(--cream);color:var(--ink);font-family:"Montserrat",system-ui,sans-serif;}
.slide{position:relative;width:100%;aspect-ratio:16/9;background:var(--cream);

.slide:before{content:"";position:absolute;left:9%;top:8%;width:54px;height:4px;

.kicker{font-size:1.05vw;letter-spacing:.18em;text-transform:uppercase;color:var(--roseD);

p{font-size:1.8vw;line-height:1.5;max-width:44em;margin-bottom:1.6vh;color:var(--ink);}
p.lede{font-size:2.2vw;color:var(--ink);}
p.muted{color:var(--muted);}
p.small{font-size:1.5vw;}
p.center{text-align:center;max-width:none;margin-top:3vh;}
p.by{font-family:"Gilda Display",serif;font-style:italic;color:var(--roseD);font-size:1.7vw;}
p.diag{display:inline-block;background:var(--blush);color:var(--roseD);font-weight:600;
  font-size:1.5vw;padding:1.2vh 1.6vw;border-radius:10px;margin-top:1.2vh;max-width:none;}
.slide.title{background:linear-gradient(160deg,#fbf7f4,#f2e6df);}
.slide.title h1{font-size:5.4vw;}
.slide.closing{background:linear-gradient(160deg,#fbf7f4,#f2e6df);}
.stagemap{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.6vw;
  margin:2vh 0 1vh;}
.stagemap .sm{background:#fff;border:1px solid var(--blush);border-radius:12px;
  padding:1.6vh 1.2vw;text-align:center;font-size:1.35vw;font-weight:600;color:var(--ink);
  min-width:9vw;box-shadow:0 6px 18px rgba(120,90,80,.06);}
.stagemap .sm span{display:flex;align-items:center;justify-content:center;width:2.4vw;

  font-family:"Gilda Display",serif;font-size:1.5vw;}
.stagemap .sm.hl{background:var(--roseD);color:#fff;}
.stagemap .sm.hl span{background:#fff;color:var(--roseD);}
.stagemap .ar{color:var(--rose);font-size:1.8vw;font-weight:700;}
.pagenum{position:absolute;right:9%;bottom:6%;font-size:1.1vw;color:var(--muted);
  letter-spacing:.1em;}
.brandmark{position:absolute;left:9%;bottom:6%;font-family:"Gilda Display",serif;
  font-style:italic;font-size:1.2vw;color:var(--muted);}
