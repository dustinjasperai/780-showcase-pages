<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids or Childfree · Reaching 99% Clarity · Keltie Maguire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2b1510;        /* deep espresso, one step darker than her dominant #42211a */
    --panel:#3a1e17;     /* lifted espresso */
    --rule:#8b9473;      /* her sage hairline */
    --text:#fdf5e6;      /* her warm cream */
    --muted:#cdb9a3;     /* softened cream */
    --accent:#c5624d;    /* her terracotta, verbatim from brand.json */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #stage{width:min(960px,94vw);aspect-ratio:16/10;position:relative;
    background:linear-gradient(170deg,var(--panel),var(--bg));
    border:1px solid #4d2c22;border-radius:14px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .slide{position:absolute;inset:0;padding:7% 8%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex;animation:f .5s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:'Inter';font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.1rem}
  h1{font-family:'Spectral';font-weight:700;font-size:clamp(1.9rem,4.4vw,3.3rem);line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Spectral';font-weight:600;font-size:clamp(1.5rem,3.2vw,2.3rem);line-height:1.14;margin-bottom:1rem}
  p{font-size:clamp(1rem,1.5vw,1.18rem);line-height:1.6;color:var(--muted);max-width:40ch}
  p.lead{color:var(--text);max-width:44ch}
  .big{font-family:'Spectral';font-weight:700;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.05;color:var(--text);max-width:22ch}
  .accent{color:var(--accent)}
  ul{list-style:none;margin-top:.6rem}
  li{font-size:clamp(1rem,1.5vw,1.16rem);line-height:1.5;color:var(--text);padding-left:1.5rem;position:relative;margin:.55rem 0;max-width:42ch}
  li:before{content:"";position:absolute;left:0;top:.62em;width:.5rem;height:.5rem;border-radius:50%;background:var(--accent)}
  .rule{width:3rem;height:2px;background:var(--rule);margin:1.3rem 0}
  .byline{margin-top:1.6rem;font-size:1rem;color:var(--muted)}
  .byline b{color:var(--text);font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
  .card{background:rgba(253,245,230,.05);border:1px solid #4d2c22;border-radius:10px;padding:1.1rem 1.2rem}
  .card h3{font-family:'Spectral';font-weight:600;font-size:1.15rem;color:var(--accent);margin-bottom:.4rem}
  .card p{font-size:.98rem;max-width:none}
  .disc{font-size:.82rem;color:#9c8a76;max-width:52ch;line-height:1.5;margin-top:1.3rem}
  .cta-btn{display:inline-block;margin-top:1.4rem;background:var(--accent);color:#fff8f0;
    font-weight:600;font-family:'Inter';padding:.8rem 1.6rem;border-radius:8px;font-size:1.05rem;text-decoration:none}
  footer{position:absolute;bottom:3.2%;left:8%;right:8%;display:flex;justify-content:space-between;
    font-size:.74rem;color:#8a7461;letter-spacing:.04em}
  nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;z-index:5}
  nav button{background:var(--panel);color:var(--text);border:1px solid #4d2c22;border-radius:7px;
    padding:.5rem .9rem;font-size:.9rem;cursor:pointer;font-family:'Inter'}
  nav button:hover{border-color:var(--accent)}
  #count{font-size:.82rem;color:var(--muted);min-width:3.2rem;text-align:center}
</style>
</head>
<body>
<div id="stage"></div>
<nav>
  <button onclick="go(-1)">Prev</button>
  <span id="count"></span>
  <button onclick="go(1)">Next</button>
</nav>
<script>
const S=[
  {t:'title', h:`<div class="kicker">A live masterclass with Keltie Maguire</div>
    <h1>Kids or Childfree:<br>How to reach <span class="accent">99% clarity</span> on whether to become a parent</h1>
    <div class="byline">Without waiting years to "just know." · <b>Keltie Maguire</b>, Kids or Childfree Decision Coach</div>`},

  {t:'promise', h:`<div class="kicker">The promise</div>
    <h2>By the end of this hour you will have a way to decide, with confidence, either way.</h2>
    <p class="lead">Not a push toward kids. Not a push toward childfree. A clear, honest path to the answer that is actually yours.</p>`},

  {t:'audience', h:`<div class="kicker">Who this is for</div>
    <h2>You have been on the fence for years.</h2>
    <ul>
      <li>You are tired of making endless pros and cons lists that never settle anything.</li>
      <li>You dodge the question at dinner: "So, when are you two having kids?"</li>
      <li>You are quietly afraid of choosing wrong, and ending up with regret either way.</li>
    </ul>`},

  {t:'hook', h:`<div class="kicker">The hard truth</div>
    <p class="big">You are never going to "just know." Waiting for certainty is the <span class="accent">exact thing</span> keeping you stuck.</p>`},

  {t:'p1head', h:`<div class="kicker">Part one · The real problem</div>
    <h2>Indecision is not a character flaw.</h2>
    <p class="lead">It is what happens when a decision this big gets made from fear and other people's expectations, instead of from what you actually want.</p>`},

  {t:'p1trap', h:`<div class="kicker">Part one · The trap</div>
    <h2>Why the pros and cons list keeps you stuck</h2>
    <p class="lead">A spreadsheet can weigh a job offer. It cannot weigh a life. Rational list-making feels productive, but it keeps the decision in your head and away from what you feel.</p>`},

  {t:'p1cost', h:`<div class="kicker">Part one · The cost</div>
    <h2>Every year on the fence has a price.</h2>
    <p class="lead">Not just the biological clock. The low hum of a question that follows you into every birthday, every pregnancy announcement, every quiet Sunday. The cost is living in the maybe.</p>`},

  {t:'p2head', h:`<div class="kicker">Part two · The method</div>
    <h2>How clarity actually works</h2>
    <p class="lead">Clarity is not a lightning bolt. It is a process you can walk, deliberately, in a direction you choose.</p>`},

  {t:'p2clarity', h:`<div class="kicker">Part two · 99% Clarity</div>
    <h2><span class="accent">99% clarity</span>, not 100% certainty.</h2>
    <p class="lead">A confident decision does not mean zero doubt. The 1% seed of doubt is normal, and it can bring comfort and confidence rather than second-guessing. Aiming for 100% is how you stay stuck forever.</p>`},

  {t:'p2fears', h:`<div class="kicker">Part two · What really drives it</div>
    <h2>Three fears run this decision from the shadows.</h2>
    <p class="lead">Until you name them and work them one at a time, they vote for you. Here they are.</p>`},

  {t:'p2regret', h:`<div class="kicker">Part two · Fear one</div>
    <h2>The fear of regret</h2>
    <p class="lead">Regret cuts both ways: regret having kids, regret not having them. When you decide from fear of regret, you are not deciding at all. We separate a real preference from a worst-case story.</p>`},

  {t:'p2fomo', h:`<div class="kicker">Part two · Fear two</div>
    <h2>FOMO, and the "everyone else is doing it" pull</h2>
    <p class="lead">Wanting what the people around you have is not the same as wanting children. We pull apart genuine desire from social contagion, so the answer is yours and not the room's.</p>`},

  {t:'p2diff', h:`<div class="kicker">Part two · Fear three</div>
    <h2>A difference of opinion</h2>
    <p class="lead">What happens when you lean one way and your partner leans the other. There is a way to hold both honestly, without one person quietly surrendering the rest of their life.</p>`},

  {t:'p2reframe', h:`<div class="kicker">Part two · The reframe</div>
    <p class="big">Parenthood is not the default you opt out of. It is a <span class="accent">genuine decision</span> you get to make on purpose.</p>`},

  {t:'p3head', h:`<div class="kicker">Part three · Off the fence</div>
    <h2>The other side of the fence</h2>
    <p class="lead">Not certainty. Confidence. A decision you can say out loud, stand behind, and stop re-litigating every time someone asks.</p>`},

  {t:'p3look', h:`<div class="kicker">Part three · What changes</div>
    <div class="two">
      <div class="card"><h3>Before</h3><p>The question runs in the background of every day. Lists, loops, and a knot you cannot name.</p></div>
      <div class="card"><h3>After</h3><p>A clear "yes" or a clear "no," held with 99% clarity, and your life pointed somewhere on purpose.</p></div>
    </div>`},

  {t:'p3whyme', h:`<div class="kicker">Part three · Why me</div>
    <h2>I lived in the maybe for years.</h2>
    <p class="lead">For a long time I felt there was something wrong with me for not longing to be a mother. Through my own process I reached 99% clarity that my path is childfree, and I have since walked hundreds of women through the same decision, on the podcast, in workshops, and one to one.</p>
    <div class="byline"><b>Keltie Maguire</b> · Host of The Kids or Childfree Podcast</div>`},

  {t:'walkaway', h:`<div class="kicker">What you walk away with</div>
    <ul>
      <li>A way to tell a real preference apart from fear, FOMO, and other people's timelines.</li>
      <li>The 99% clarity standard, so you stop waiting for a certainty that never comes.</li>
      <li>Honest language for the conversation with your partner.</li>
      <li>A next step that fits whichever way you are leaning.</li>
    </ul>`},

  {t:'cta', h:`<div class="kicker">Your next step</div>
    <h2>Ready to get off the fence?</h2>
    <p class="lead">Join the next live Kids or Childfree Workshop, or book a free discovery call, and let's start moving you toward your clear, confident answer.</p>
    <a class="cta-btn" href="https://www.kidsorchildfree.com/work-with-me1">Work with Keltie</a>
    <p class="disc">This workshop is educational and for personal reflection. It is not therapy, medical, or fertility advice. No specific result is guaranteed. Results vary from person to person. The choice is always yours.</p>`}
];

const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide';d.dataset.i=i;
  d.innerHTML=s.h+`<footer><span>Kids or Childfree · 99% Clarity</span><span>Keltie Maguire</span></footer>`;
  stage.appendChild(d);
});
let cur=0;const slides=[...document.querySelectorAll('.slide')];
function show(n){slides[cur].classList.remove('on');cur=(n+slides.length)%slides.length;
  slides[cur].classList.add('on');document.getElementById('count').textContent=(cur+1)+' / '+slides.length;}
function go(d){show(cur+d);}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
show(0);
</script>
</body>
</html>
