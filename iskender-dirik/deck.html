<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Makes an Investor Lean In | The 3P Fundraising Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f6f6; --ink:#111111; --soft:#4a4a4a; --muted:#6f6f6f;
    --rule:#e6e6e6; --deep:#2d2d2d; --accent:#2d2d2d; --panel:#ffffff;
  }
  html,body{height:100%}
  body{background:var(--deep);font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
  .deck{width:min(960px,96vw);aspect-ratio:16/9;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .slide{position:absolute;inset:0;padding:72px 84px;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em;color:var(--ink)}
  h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:34px;line-height:1.14;letter-spacing:-.01em;color:var(--ink);margin-bottom:20px}
  .lede{font-size:21px;line-height:1.55;color:var(--soft);margin-top:20px;max-width:44ch}
  .big{font-family:'Poppins',sans-serif;font-weight:600;font-size:40px;line-height:1.16;letter-spacing:-.01em;color:var(--ink);max-width:22ch}
  p.body{font-size:19px;line-height:1.6;color:var(--soft);margin-top:14px;max-width:46ch}
  .rule{width:54px;height:3px;background:var(--accent);margin:0 0 26px}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;color:var(--soft);padding:14px 0;border-top:1px solid var(--rule);display:flex;gap:16px}
  li:last-child{border-bottom:1px solid var(--rule)}
  li b{font-family:'Poppins',sans-serif;color:var(--ink);font-weight:600}
  .num{font-family:'Poppins',sans-serif;font-weight:700;color:var(--accent);font-size:17px;min-width:28px}
  .part{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  .by{font-family:'Poppins',sans-serif;font-size:16px;color:var(--muted);margin-top:30px}
  .cta h1{font-size:40px}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:30px;max-width:52ch}
  .cred{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:22px}
  .cred span{font-family:'Poppins',sans-serif;font-size:15px;color:var(--soft)}
  .nav{position:absolute;bottom:18px;right:26px;font-family:'Poppins',sans-serif;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .brandmark{position:absolute;top:30px;left:84px;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--ink)}
  @media(max-width:640px){.slide{padding:40px 34px}h1{font-size:30px}h2{font-size:24px}.big{font-size:26px}.lede,p.body,li{font-size:16px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass for founders',h:'What Makes an Investor Lean In',lede:'The 3P Fundraising Masterclass, for founders raising seed to Series A.',by:'with Iskender Dirik'},
 {t:'promise',kick:'What you will leave with',h:'The three things that decide a round',body:'By the end you will know what actually makes an investor lean in, why your deck is not one of those things, and how to run a round so the terms favor you.'},
 {t:'for',kick:'Who this is for',h:'You have a real company. You are about to raise.',body:'Pre-seed through Series A. The product works, the traction is there, and now the round is the job. This is about the part nobody taught you: the investor side of the table.'},
 {t:'trap',kick:'The trap',big:'You are polishing the one thing the decision does not hinge on.',body:'Founders pour weeks into the deck. Investors decide on psychology, conviction, and momentum. The deck is the artifact, not the reason.'},
 {t:'hook',kick:'The uncomfortable part',big:'You will never be in the room when they decide.',body:'The partner who met you repeats your story to people you never meet. If the story does not travel without you, it dies in that meeting.'},
 {t:'part',part:'Part One',h:'Why most rounds stall',body:'Not because the company is weak. Because the raise is run on the founder assumptions, not on how capital actually moves.'},
 {t:'content',kick:'The real problem',h:'Investors fund conviction, not features',body:'A feature list invites comparison. Conviction invites a decision. The founders who raise fast make the investor feel a cost to missing out, not a checklist to evaluate.'},
 {t:'content',kick:'The second problem',h:'A scattered round leaks momentum',body:'Raising in a trickle lets investors wait each other out. A time boxed, sequenced round creates the pressure that moves a maybe to a yes, on better terms.'},
 {t:'part',part:'Part Two',h:'The 3P Framework',body:'The method I run with founders in FundraisingCOUP. Three pillars you run in order: Psychology, Pitch, Process.'},
 {t:'list',kick:'Pillar one',h:'Psychology',items:[['','Read what actually moves an investor to lean in, not what founders assume moves them.'],['','Build real FOMO through momentum and scarcity that is true, never manufactured.'],['','Understand the partner meeting you are not invited to, and design for it.']]},
 {t:'list',kick:'Pillar two',h:'Pitch and Communication',items:[['','The equity story: a narrative a partner can retell accurately without you.'],['','Structure before slides, using the COUP storytelling system.'],['','Answer the three questions every investor is silently scoring.']]},
 {t:'list',kick:'Pillar three',h:'Process',items:[['','Sequence outreach so interest compounds instead of scattering.'],['','Time box the round to create genuine momentum.'],['','Run the close so terms and timing favor the founder, not the fund.']]},
 {t:'part',part:'Part Three',h:'A real raise, pillar by pillar',body:'The pillars are not theory. Here is how they change a round in practice.'},
 {t:'content',kick:'The equity story',h:'Build the version that travels without you',body:'Write the story so the investor who believes it can defend it to a skeptical partner on a Monday. That is the only version that funds.'},
 {t:'content',kick:'Momentum in weeks, not months',h:'A round you can close in seven weeks',body:'Mapped week by week: who you talk to first, how interest is sequenced, and when the time box turns soft interest into committed terms.'},
 {t:'why',kick:'Why me',h:'I have sat on the other side of the table',cred:['Venture Partner, EQT Ventures','Ex Managing Director, Samsung NEXT Ventures','Ex Managing Director, Microsoft ScaleUp','Ex Managing Director, Bauer Venture Partners','Worked with 40+ startups'],body:'I have evaluated and backed founders from the investor seat. The 3P Framework is what I watched separate the rounds that closed from the ones that did not.'},
 {t:'recap',kick:'In one line',big:'Raise on psychology and momentum, and let the deck be the artifact, not the argument.',body:'Psychology. Pitch. Process. In that order.'},
 {t:'cta',kick:'Your next step',h:'Run your actual round through the 3P Framework',body:'If you are raising in the next two quarters, book a FundraisingCOUP call and we will pressure test your round against the three pillars.',disc:'Educational content only. No part of this masterclass is a guarantee of funding, valuation, or financial outcome. Every raise is different and results vary.',by:'Iskender Dirik, id.vc'}
];
const deck=document.getElementById('deck');let i=0;
function render(){
 deck.innerHTML='';
 const s=S[i];
 const el=document.createElement('div');el.className='slide on';
 let html='<div class="brandmark">FundraisingCOUP</div>';
 if(s.kick)html+='<div class="kick">'+s.kick+'</div>';
 if(s.part)html+='<div class="part">'+s.part+'</div>';
 if(s.t==='title'||s.t==='cta'||s.t==='promise'||s.t==='for'||s.t==='part'||s.t==='content'||s.t==='why'){
   if(s.h)html+='<div class="rule"></div><h1>'+s.h+'</h1>';
   if(s.lede)html+='<div class="lede">'+s.lede+'</div>';
   if(s.cred){html+='<div class="cred">';s.cred.forEach(c=>html+='<span>'+c+'</span>');html+='</div>';}
   if(s.body)html+='<p class="body">'+s.body+'</p>';
   if(s.disc)html+='<div class="disc">'+s.disc+'</div>';
   if(s.by)html+='<div class="by">'+s.by+'</div>';
 } else if(s.t==='trap'||s.t==='hook'||s.t==='recap'){
   html+='<div class="rule"></div><div class="big">'+s.big+'</div>';
   if(s.body)html+='<p class="body">'+s.body+'</p>';
 } else if(s.t==='list'){
   html+='<h2>'+s.h+'</h2><ul>';
   s.items.forEach((it,n)=>{html+='<li><span class="num">0'+(n+1)+'</span><span>'+it[1]+'</span></li>';});
   html+='</ul>';
 }
 html+='<div class="nav">'+(i+1)+' / '+S.length+'</div>';
 el.innerHTML=html;deck.appendChild(el);
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
deck.addEventListener('click',()=>go(1));
render();
</script>
</body>
</html>
