<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Influence, Not Just a Book — The ASPEN Method | Jenn T. Grace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0;       /* warm ivory ground (brand.json ink family + literary positioning) */
    --panel:#F1E9DB;    /* soft parchment */
    --ink:#2A2A28;      /* near-black charcoal (traceable to brand.json #363636 ink family) */
    --muted:#6A6459;    /* muted ink */
    --accent:#1C6E63;   /* deep pine-teal accent */
    --accent2:#B07D2B;  /* literary gold */
    --rule:#D9CEBC;
    --display:'Literata', Georgia, serif;
    --body:'Hanken Grotesk', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#efe8da;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:64px 64px 56px;margin:0 0 22px;min-height:540px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .num{position:absolute;top:26px;right:30px;font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.14em}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--display);font-weight:800;font-size:54px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.08;letter-spacing:-.01em}
  h3{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.15}
  p{font-size:19px;line-height:1.62;color:#3a362f;max-width:60ch}
  .lead{font-size:22px}
  .sub{font-size:21px;color:var(--muted);margin-top:18px;font-family:var(--display);font-style:italic}
  .big{font-size:64px;font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.02em}
  .accent{color:var(--accent)}
  .gold{color:var(--accent2)}
  .rule{height:2px;width:72px;background:var(--accent2);margin:26px 0;border:0}
  ul{margin:22px 0 0 0;list-style:none}
  ul li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule);max-width:62ch}
  ul li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;background:var(--accent);border-radius:50%}
  .steps{margin-top:26px}
  .step{display:flex;gap:22px;align-items:baseline;padding:14px 0;border-top:1px solid var(--rule)}
  .step .k{font-family:var(--display);font-weight:800;font-size:30px;color:var(--accent2);min-width:46px}
  .step .l{font-family:var(--display);font-weight:600;font-size:23px;min-width:160px}
  .step .d{font-size:18px;color:var(--muted)}
  .paths{display:flex;gap:16px;margin-top:28px;flex-wrap:wrap}
  .path{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:22px}
  .path h3{font-size:20px;margin-bottom:8px}
  .path.pick{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .path .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .quote{font-family:var(--display);font-style:italic;font-size:30px;line-height:1.3;max-width:24ch}
  .meta{display:flex;gap:40px;margin-top:30px;flex-wrap:wrap}
  .meta div span{display:block;font-family:var(--display);font-weight:800;font-size:40px;color:var(--accent)}
  .meta div small{font-size:14px;color:var(--muted);letter-spacing:.04em}
  .cta-box{background:var(--ink);color:var(--bg);border-radius:10px;padding:48px 52px;margin-top:8px}
  .cta-box h2{color:var(--bg)}
  .cta-box .accent{color:var(--accent2)}
  .cta-step{display:inline-block;margin-top:24px;font-family:var(--body);font-weight:700;font-size:20px;
    color:var(--ink);background:var(--accent2);padding:14px 26px;border-radius:6px}
  .disc{font-size:13px;color:#b9b2a4;margin-top:26px;max-width:70ch;line-height:1.5}
  .foot{position:absolute;bottom:22px;left:64px;font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.06em}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A live masterclass with Jenn T. Grace',
    h:'Build Influence,<br>Not Just a Book.',
    sub:'The ASPEN Method for turning your idea into lasting authority.'},

  {t:'content', eyebrow:'What you will leave with',
    h:'A plan for the book, and for the decade after it.',
    p:'By the end of this hour you will know how to turn one nonfiction book into a repeatable authority engine, how to pick the right publishing path for your goals, and how to avoid the mistakes that leave most books sitting on a shelf.'},

  {t:'content', eyebrow:'Who this is for',
    h:'Experts with something worth saying.',
    list:['Entrepreneurs, consultants and executives who want a book that grows their influence.','Changemakers and first time authors, including voices the traditional industry overlooks.','People who have a big idea, and are tired of calling it a someday project.']},

  {t:'quote', eyebrow:'The trap',
    q:'You do not have a writing problem. You have a strategy problem.',
    p:'Most authors start with the manuscript and leave the strategy for later. Later never comes, and a good book quietly disappears.'},

  {t:'big', eyebrow:'The reframe',
    big:'A book is not a credential.<br>It is an <span class="accent">authority engine</span>.',
    p:'A credential sits on a shelf. An engine keeps working: bringing you readers, clients, speaking invitations and trust, long after launch week.'},

  {t:'content', eyebrow:'Part one, the real problem',
    h:'Most nonfiction books are built backward.',
    p:'Written first, positioned never. No clear reader, no plan for what happens after publication, no system to turn attention into relationships. The result is a launch spike, then silence.'},

  {t:'content', eyebrow:'Part one, the cost',
    h:'What backward costs you.',
    list:['Months of work that moves your business almost nothing.','A book that is hard to describe in one sentence, so nobody shares it.','No momentum to build on, so the next idea starts from zero.']},

  {t:'section', eyebrow:'Part two, the method',
    h:'The ASPEN Method.',
    sub:'Five moves that turn a manuscript into lasting influence. It is the spine behind nearly 300 books we have brought into the world.'},

  {t:'step', eyebrow:'A', h:'Assess.',
    steps:[['A','Assess','Start with your purpose and your reader, not your word count. Who is this for, and what changes for them?']]},
  {t:'step', eyebrow:'S', h:'Strategize.',
    steps:[['S','Strategize','Find the one position only you can own, the angle that makes your book impossible to confuse with anyone else’s.']]},
  {t:'step', eyebrow:'P', h:'Plan.',
    steps:[['P','Plan','Map the launch and the twelve months after it, so attention has somewhere to go when it arrives.']]},
  {t:'step', eyebrow:'E', h:'Execute.',
    steps:[['E','Execute','Build it with a real team: editorial, design and distribution, while you keep full creative control and ownership.']]},
  {t:'step', eyebrow:'N', h:'Nurture.',
    steps:[['N','Nurture','Keep showing up for the audience the book earns you. Influence compounds when you do not disappear after launch.']]},

  {t:'recap', eyebrow:'The method, in one view', h:'Assess. Strategize. Plan. Execute. Nurture.',
    steps:[['A','Assess','purpose and reader first'],['S','Strategize','the position you own'],['P','Plan','launch and the year after'],['E','Execute','with a real team'],['N','Nurture','long after launch']]},

  {t:'paths', eyebrow:'Pick your path',
    h:'Three ways to publish. One right answer for you.',
    p:'Before you pay anyone, know the trade-offs, and how to spot a predatory publisher.'},

  {t:'content', eyebrow:'The mindset shift',
    h:'From writer to author.',
    p:'The first ninety days are not about the manuscript. They are about sharpening the one idea worth a book, and stepping into the identity of someone building a platform, not finishing a document.'},

  {t:'big', eyebrow:'Twelve months after launch',
    big:'Readers who find <span class="accent">you</span>,<br>because they found the book.',
    p:'Speaking invitations, qualified clients, media, and a growing audience that trusts you. The book stops being the finish line and becomes the front door.'},

  {t:'why', eyebrow:'Why learn this from us',
    h:'Your publisher is also an author.',
    p:'Publish Your Purpose is a strategic hybrid publisher built around voices the industry overlooks. You keep 100% of your rights and royalties. We bring the editorial, design and distribution, and a community that does not end at launch.',
    meta:[['~300','books published'],['7','books Jenn has authored'],['Forbes','WSJ, HuffPost, CNBC']]},

  {t:'cta', eyebrow:'Your next step',
    h:'Ready to build influence, not just a book?',
    p:'If you have a big idea and you are done calling it someday, the next step is simple. Submit your manuscript or your idea, and let us help you pick your path.',
    step:'Apply to publish with Publish Your Purpose',
    disc:'This masterclass is educational. Publishing, sales and business outcomes vary by author, idea and effort. No specific results, bestseller status, or income are promised or guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section'); el.className='slide';
  const n=(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0');
  let inner='<div class="num">'+n+'</div>';
  if(s.eyebrow) inner+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){ inner+='<h1>'+s.h+'</h1>'; if(s.sub) inner+='<div class="sub">'+s.sub+'</div>'; }
  else if(s.t==='section'){ inner+='<h2>'+s.h+'</h2>'; if(s.sub) inner+='<p class="lead" style="margin-top:22px">'+s.sub+'</p>'; }
  else if(s.t==='big'){ inner+='<div class="big">'+s.big+'</div>'; inner+='<hr class="rule">'; if(s.p) inner+='<p>'+s.p+'</p>'; }
  else if(s.t==='quote'){ inner+='<div class="quote accent">'+s.q+'</div>'; inner+='<hr class="rule">'; if(s.p) inner+='<p>'+s.p+'</p>'; }
  else if(s.t==='step'){ inner+='<h2>'+s.h+'</h2><div class="steps">'; s.steps.forEach(st=>{ inner+='<div class="step"><div class="k">'+st[0]+'</div><div class="l">'+st[1]+'</div><div class="d">'+st[2]+'</div></div>'; }); inner+='</div>'; }
  else if(s.t==='recap'){ inner+='<h2>'+s.h+'</h2><div class="steps">'; s.steps.forEach(st=>{ inner+='<div class="step"><div class="k">'+st[0]+'</div><div class="l">'+st[1]+'</div><div class="d">'+st[2]+'</div></div>'; }); inner+='</div>'; }
  else if(s.t==='paths'){ inner+='<h2>'+s.h+'</h2>'; if(s.p) inner+='<p style="margin-top:16px">'+s.p+'</p>'; inner+='<div class="paths">'+
      '<div class="path"><h3>Traditional</h3><p style="font-size:16px">A publisher takes the rights and most of the royalties, and the timeline.</p></div>'+
      '<div class="path pick"><div class="tag">Often the fit</div><h3>Hybrid</h3><p style="font-size:16px">You keep control and royalties, with a real team behind the book.</p></div>'+
      '<div class="path"><h3>Self</h3><p style="font-size:16px">Full control, and the full weight of doing every part alone.</p></div></div>'; }
  else if(s.t==='why'){ inner+='<h2>'+s.h+'</h2>'; if(s.p) inner+='<p style="margin-top:18px">'+s.p+'</p>'; if(s.meta){ inner+='<div class="meta">'; s.meta.forEach(m=>{ inner+='<div><span>'+m[0]+'</span><small>'+m[1]+'</small></div>'; }); inner+='</div>'; } }
  else if(s.t==='content'){ inner+='<h2>'+s.h+'</h2>'; if(s.p) inner+='<p style="margin-top:18px">'+s.p+'</p>'; if(s.list){ inner+='<ul>'; s.list.forEach(li=>inner+='<li>'+li+'</li>'); inner+='</ul>'; } }
  else if(s.t==='cta'){ inner+='<div class="cta-box"><h2>'+s.h+'</h2><p style="color:#e6ddcb;margin-top:18px">'+s.p+'</p><div class="cta-step">'+s.step+'</div><div class="disc">'+s.disc+'</div></div>'; }
  if(s.t!=='cta' && s.t!=='title') inner+='<div class="foot">Build Influence, Not Just a Book &middot; Jenn T. Grace</div>';
  el.innerHTML=inner; deck.appendChild(el);
});
</script>
</body>
</html>
