<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The $50K Ceiling · BasketballTrainer.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* Palette from his own live site probe (brand.json): charcoal #333333 + basketball
       orange #ff7b00 co-dominant on white; Lato is the site's own face. */
    --bg:#ffffff; --panel:#2b2b2b; --rule:#e9e9e9;
    --ink:#333333; --accent:#ff7b00; --grey:#5c5c5c; --dim:#9a9a9a;
  }
  html,body{height:100%}
  body{background:#1c1c1c;font-family:'Lato',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1c1c1c}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.004em}
  .t-title h1{font-size:3.8vw;max-width:90%}
  .t-normal h1{font-size:2.5vw;max-width:84%}
  .t-normal .body{font-size:1.38vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.6;font-weight:400}
  .sub{font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.52;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-size:1.3vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.8vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:2.7vw;max-width:82%;color:#ffffff}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:2.9vw;max-width:80%;color:#ffffff}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:#ffffff;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:700}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#b9b9b9}
  .t-title .disc,.t-normal .disc{text-align:left}
  .floor-motif{position:absolute;pointer-events:none}
  .title-floor{right:6%;bottom:9%;width:16vw;opacity:.95}
  .brandline{font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(51,51,51,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">BasketballTrainer.com</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- floor-line motif: the $50k application floor drawn literally — a court floor line
     with the one orange ball sitting above it. Charcoal + orange from brand.json. -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="floor" viewBox="0 0 260 110">
  <g fill="none">
    <line x1="16" y1="82" x2="244" y2="82" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
    <circle cx="200" cy="54" r="16" fill="#ff7b00"/>
    <path d="M186,50 A16,16 0 0 1 214,50 M200,38 V70" stroke="#ffffff" stroke-width="2"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The $50K Ceiling',sub:'A live masterclass for established basketball trainers on the systems that break the ceiling your own hustle built.',brand:true},
 {t:'normal',k:'Who this is for',title:'You already won the first fight. The gym is full and the calendar is packed.',body:'This is not for the startup basketball trainer. It is for the trainer already past fifty thousand a year who has discovered the prize for winning round one: a schedule with no room left in it, revenue that only grows when you personally train more hours, and a business that still runs entirely on you.'},
 {t:'dark',title:'Hustle got you to the ceiling. Hustle is also what the ceiling is made of.'},

 {t:'section',idx:'Part One',title:'Why the Ceiling Holds'},
 {t:'normal',k:'The hours wall',title:'Past a certain point, more sessions stop being growth and start being burnout.',body:'Every dollar is still attached to an hour of your time on the floor. Raise rates and you buy a little headroom; the wall just moves a few feet. The trainers who actually break through change what grows: the business, not the calendar.'},
 {t:'normal',k:'The invisible business',title:'Great trainers are usually invisible businesses.',body:'The training speaks for itself inside the gym, and nowhere else. No search presence, no content engine, no email list working while you coach. The families who would pay for the best trainer in the area mostly never find out who that is.'},
 {t:'dark',title:'The next stage does not come from the court. It comes from the desk you never sit at.'},

 {t:'section',idx:'Part Two',title:'The Systems That Scale'},
 {t:'normal',k:'Get found',title:'Search, content and email working while you are on the floor.',body:'The Business Accelerator curriculum in one line: digital marketing, SEO, email marketing and content built for a training business, so the pipeline of new athletes stops depending on referrals and luck.'},
 {t:'normal',k:'Sell like a business',title:'Sales systems instead of hopeful conversations.',body:'A repeatable path from inquiry to enrolled athlete: what gets said, what gets sent, what gets followed up, so conversion stops being a personality trait and becomes a process anyone on your staff can run.'},
 {t:'normal',k:'Know your numbers',title:'Financial dashboards that tell you what is actually working.',body:'Which programs earn, which hours leak, what a family is worth over a season. The dashboard discipline the accelerator teaches, because a business you can read is a business you can steer.'},
 {t:'dark',title:'Systems are not the opposite of great training. They are how great training gets paid properly.'},

 {t:'section',idx:'Part Three',title:'Who Is Teaching This'},
 {t:'normal',k:'Built for the established',title:'An accelerator with an application floor, not an open door.',body:'BasketballTrainer.com built the Business Accelerator for proven trainers only: playing and coaching pedigree plus a real revenue base are the price of admission. The room is the product; everyone in it already runs a working training business.'},
 {t:'normal',k:'The platform behind it',title:'Community, group coaching, and the BasketballTrainer.com platform.',body:'Christopher Corbett and Brian Williams run the accelerator on top of the BasketballTrainer.com platform and directory, alongside the curriculum: a place where established trainers compare numbers, playbooks, and what actually moved them past the ceiling.'},

 {t:'section',idx:'Your Next Step',title:'Break the Ceiling on Purpose'},
 {t:'normal',k:'How it works',title:'The masterclass teaches the systems. The Accelerator is where you install them.',body:'Membership is by application, built around the curriculum, the group coaching, and the community of trainers past their first fifty thousand.'},
 {t:'cta',title:'Ready to grow the business instead of the calendar?',chips:['Apply for the Business Accelerator'],disc:'Educational content for basketball training business owners. No income, enrollment, or business result is guaranteed. Results vary by trainer, market, and effort.'},
];

const deck=document.getElementById('deck');
function floorSvg(){return `<svg class="floor-motif title-floor"><use href="#floor"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">BasketballTrainer<b>.com</b> &middot; Business Accelerator</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=floorSvg();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
