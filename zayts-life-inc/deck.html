<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Succeed in Weed - The Cannabis Business Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f3ec;        /* warm paper, from his light site */
    --ink:#212020;       /* dominant color, from brand.json */
    --muted:#6b7169;     /* rule / secondary */
    --accent:#2f6b3f;    /* deep cannabis green - his brand identity */
    --accent-soft:#e3ece4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--muted);font-family:'Lato',system-ui,sans-serif;color:var(--ink)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 64px}
  .slide{
    position:relative;background:var(--bg);border-radius:10px;
    aspect-ratio:16/9;margin:0 0 22px;padding:56px 60px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 30px rgba(33,32,32,.12);overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
  .kicker{font-family:'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;
    font-size:14px;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:52px;line-height:1.05;letter-spacing:.01em}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:38px;line-height:1.1;margin-bottom:16px}
  p{font-size:21px;line-height:1.5;max-width:40ch;color:var(--ink)}
  p.lead{font-size:24px;color:var(--muted);margin-top:16px;max-width:42ch}
  ul{margin:14px 0 0 0;padding:0;list-style:none;max-width:44ch}
  li{font-size:20px;line-height:1.45;padding:9px 0 9px 30px;position:relative;border-bottom:1px solid #e4e1d7}
  li::before{content:"";position:absolute;left:0;top:18px;width:12px;height:12px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .big{font-family:'Oswald',sans-serif;font-size:72px;font-weight:700;color:var(--accent);line-height:1}
  .title-slide{background:var(--ink);color:var(--bg)}
  .title-slide::before{background:var(--accent)}
  .title-slide h1{color:var(--bg)}
  .title-slide .kicker{color:#9ec8a8}
  .title-slide p{color:#c9c7bf}
  .footer{position:absolute;right:26px;bottom:18px;font-family:'Oswald',sans-serif;
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .title-slide .footer{color:#8a9a8c}
  .cta h2{color:var(--accent)}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.4}
  .two{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
  .two .col{flex:1;min-width:230px}
  .num{font-family:'Oswald',sans-serif;color:var(--accent);font-weight:700;font-size:15px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "The Cannabis Business Coach";
const S = [
  {t:'title', kicker:'A live masterclass with Michael Zaytsev',
    h1:'How to Succeed in Weed',
    p:'The founder playbook for building a profitable, durable cannabis business in the one industry built to make that hard.' },

  {t:'who', kicker:'Who this is for',
    h2:'If you are building in cannabis, this was made for you',
    lead:'Licensed operators, brand founders, dispensary owners, and the people betting their savings on weed.',
    bullets:['You know your product cold, but the business keeps fighting you',
             'You watched competitors with worse product outlast you',
             'You suspect the usual small-business advice does not survive contact with this industry'] },

  {t:'trap', kicker:'The trap',
    h2:'You were handed a business playbook written for a different world',
    p:'Every book, mentor, and course assumes normal banking, normal taxes, and normal advertising. In cannabis, all three are missing. So founders run a standard playbook into a non-standard industry and call the wreck a personal failure.' },

  {t:'reframe', kicker:'The reframe',
    h2:'It is not that you are bad at business',
    p:'It is that nobody taught you the rules of THIS business. Cannabis is unlike any other industry on at least eleven counts, and each one quietly breaks a plan built for anything else.' },

  {t:'part', kicker:'Part one', h1:'Why cannabis breaks normal plans' },

  {t:'list', kicker:'The industry is unlike any other',
    h2:'Eleven forces working against your margin',
    bullets:['Section 280E taxes you on revenue, not profit - effective rates past 70%',
             'No normal banking, lending, or payment rails',
             'A legal illicit market still competing on price',
             'Decades of stigma you have to reverse before you can sell'] },

  {t:'list', kicker:'The industry is unlike any other',
    h2:'And the rest you plan around, not against',
    bullets:['Advertising bans that close every easy acquisition channel',
             'Under-informed buyers who need educating before converting',
             'A regulatory map that can change under you overnight',
             'Thin B2B tech and an enthusiast workforce to lead well'] },

  {t:'stat', kicker:'The one that ends most businesses',
    big:'280E',
    p:'The tax code that lets the IRS disallow ordinary deductions for a plant-touching business. Plan your pricing and your entity around it from day one, or it decides your fate for you.' },

  {t:'part', kicker:'Part two', h1:'The way through: strategy plus grit' },

  {t:'framework', kicker:'The method',
    h2:'What I learned from 50 insiders, turned into a path',
    lead:'The Cannabis Business Book distilled fifty operators who lasted. The pattern was never one tactic. It was four disciplines, run together.' },

  {t:'pillar', kicker:'Discipline 01', num:'01 - Know the terrain',
    h2:'Build the business around the obstacles, not despite them',
    p:'Your entity, pricing, and cash strategy are designed for 280E, no-banking, and the illicit market from the start. The constraint becomes the blueprint.' },

  {t:'pillar', kicker:'Discipline 02', num:'02 - Reverse the stigma',
    h2:'Educate the buyer before you sell the buyer',
    p:'In a market of under-informed consumers and old stigma, the brand that teaches wins trust first and the sale second. Demand gets built, not bought.' },

  {t:'pillar', kicker:'Discipline 03', num:'03 - Pick partners like your life depends on it',
    h2:'Be extra careful about who you build with',
    p:'In an industry this volatile, the wrong partner or capital source is fatal and the right one is leverage. Values-aligned, long-horizon relationships are the real moat.' },

  {t:'pillar', kicker:'Discipline 04', num:'04 - Found from resilience',
    h2:'The inner game is not a luxury here',
    p:'Everything can change overnight in cannabis. Your greatest challenges are also your greatest growth. Gratitude, persistence, and not taking no for an answer are operating tools, not affirmations.' },

  {t:'proof', kicker:'Part three - why me',
    h2:'I have lived on every side of this',
    bullets:['Founder of High NY, one of the world\'s largest cannabis communities, since 2014',
             'Academic Director of the first accredited cannabis degrees in New York',
             'Author of The Cannabis Business Book and a Cannabis Industry Power Player',
             'A business coach since 2015 for founders and executives alike'] },

  {t:'picture', kicker:'The business you actually wanted',
    h2:'A business that stops fighting you',
    p:'Pricing that survives 280E. A brand buyers trust. Partners you would build with again. And a founder steady enough to lead through the next regulatory surprise instead of being flattened by it.' },

  {t:'cta', kicker:'Your next step',
    h2:'Let us get higher together',
    p:'If you are serious about building something that lasts in weed, this is the work. Reach out and we will map your path through.',
    disclaimer:'Educational content only. Building a business in cannabis carries legal, tax, and financial risk, and nothing here is legal, tax, or investment advice. Individual results vary and no specific outcome, income, or result is promised or guaranteed.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta':'');
  let html = '';
  if(s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if(s.num) html += `<div class="num">${s.num}</div>`;
  if(s.h1) html += `<h1>${s.h1}</h1>`;
  if(s.h2) html += `<h2>${s.h2}</h2>`;
  if(s.big) html += `<div class="big">${s.big}</div>`;
  if(s.lead) html += `<p class="lead">${s.lead}</p>`;
  if(s.p) html += `<p>${s.p}</p>`;
  if(s.bullets){ html += '<ul>'; s.bullets.forEach(b=> html += `<li>${b}</li>`); html += '</ul>'; }
  if(s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  html += `<div class="footer">${BRAND} &middot; ${String(i+1).padStart(2,'0')}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
