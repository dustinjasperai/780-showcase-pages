<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scattered to Streamlined — a masterclass with Connie Whitesell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ee; --panel:#ecece9; --ink:#2a2230; --soft:#5d5566;
    --muted:#8a8290; --rule:#d9d2cf; --accent:#652851; --deep:#4a1d3b;
    --head:'Spectral',Georgia,serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#ddd7d2;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:64px 64px;margin:18px 0;min-height:560px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;
    color:var(--muted);font-weight:600}
  .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:20px}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  .lede{font-size:21px;line-height:1.5;color:var(--soft);margin-top:22px;max-width:30em}
  p.big{font-size:27px;line-height:1.42;margin-top:14px;max-width:26em}
  .accent{color:var(--accent)}
  .pillarno{font-family:var(--head);font-size:22px;color:var(--accent);font-weight:700}
  ul{list-style:none;margin-top:26px;max-width:32em}
  ul li{position:relative;padding-left:30px;font-size:19px;line-height:1.5;margin:14px 0;color:var(--ink)}
  ul li::before{content:"";position:absolute;left:0;top:10px;width:10px;height:10px;
    border-radius:50%;background:var(--accent)}
  .week{display:flex;gap:10px;margin-top:30px}
  .day{flex:1;border:1px solid var(--rule);border-radius:9px;padding:14px 10px;background:#fff;min-height:150px}
  .day .d{font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:700}
  .day .blk{margin-top:10px;border-radius:6px;padding:8px 9px;font-size:13px;line-height:1.3}
  .blk.a{background:var(--accent);color:#fff}
  .blk.o{background:transparent;border:1px dashed var(--rule);color:var(--soft)}
  .blk.d{background:var(--deep);color:#fff}
  .divider{display:flex;gap:7px;align-items:center;margin-top:30px}
  .divider i{height:2px;background:var(--rule);border-radius:2px;display:block}
  .foot{position:absolute;bottom:22px;left:64px;font-size:12px;letter-spacing:.08em;
    color:var(--muted);font-weight:600}
  .disc{font-size:13px;line-height:1.55;color:var(--muted);margin-top:28px;max-width:40em}
  .cta .lede{color:var(--ink)}
  .title-slide h1{font-size:72px}
  .scatter{margin-top:34px;display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-width:30em}
  .scatter span{height:8px;border-radius:4px;background:var(--rule)}
  .scatter span.on{background:var(--accent)}
  @media(max-width:720px){.slide{padding:38px 26px}h1{font-size:40px}.title-slide h1{font-size:46px}h2{font-size:30px}.week{flex-wrap:wrap}.day{min-width:40%}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title-slide', html:`
    <div class="kick">A live masterclass with Connie Whitesell, PCC</div>
    <h1>Scattered <span class="accent">to</span> Streamlined</h1>
    <p class="lede">How solo service owners build a calm, profitable business by doing less of the right things, not more of everything.</p>
    <div class="divider"><i style="width:40px"></i><i style="width:90px;background:var(--accent)"></i><i style="width:24px"></i></div>`},

  {t:'who', html:`
    <div class="kick">Who this is for</div>
    <h2>You are great at the work. You are buried by everything around it.</h2>
    <p class="big">The independent consultant, advisor, creative, or coach who is doing good work for real clients, and still feels one dropped ball away from the whole thing wobbling.</p>`},

  {t:'trap', html:`
    <div class="kick">The trap</div>
    <h2>You started this for freedom.</h2>
    <p class="big">Now you are the bottleneck, the operations team, and the marketing department, all at once. The business depends on you holding every piece in your head.</p>`},

  {t:'hook', html:`
    <div class="kick">An honest reframe</div>
    <h2>Working harder is the problem, not the fix.</h2>
    <p class="big">More hustle on a scattered business just scatters you faster. You cannot out-work a lack of focus.</p>`},

  {t:'part', html:`
    <div class="kick">Part one</div>
    <h2>Scattered is not a time problem. It is a focus problem.</h2>
    <p class="big">Everything feels urgent because nothing has been decided. When every task is a priority, none of them is.</p>`},

  {t:'cost', html:`
    <div class="kick">What scattered costs you</div>
    <ul>
      <li>Revenue left on the table because the right offer never gets finished.</li>
      <li>No real time off, because the business cannot run without you in the room.</li>
      <li>Reactive decisions, made at 11pm, that you quietly redo a month later.</li>
      <li>The slow erosion of why you started: the freedom is gone.</li>
    </ul>`},

  {t:'shift', html:`
    <div class="kick">The shift</div>
    <h2>Streamlined means fewer, better decisions.</h2>
    <p class="big">A business that runs on a plan, not on adrenaline. The goal is not a bigger machine. It is less to carry, and more of it working.</p>`},

  {t:'framework', html:`
    <div class="kick">Part two, the method</div>
    <h2>The Scattered to Streamlined framework: five pillars, in order.</h2>
    <p class="lede">Each one reduces friction and frees the next. We start with clarity and end with a business that pays you back.</p>
    <div class="scatter"><span class="on"></span><span></span><span class="on"></span><span></span><span></span><span class="on"></span><span></span><span class="on"></span><span></span><span class="on"></span><span></span><span></span><span class="on"></span><span></span><span class="on"></span><span></span></div>`},

  {t:'pillar', html:`
    <div class="pillarno">Pillar 1</div>
    <h2 style="margin-top:8px">Vision</h2>
    <p class="big">Get grounded in where you are actually going, so you finally know what to say yes to, and what to say a clean no to.</p>`},

  {t:'pillar', html:`
    <div class="pillarno">Pillar 2</div>
    <h2 style="margin-top:8px">Products and Services</h2>
    <p class="big">Make sure you are offering the right things to the right people, so the work you sell is the work you want to be doing.</p>`},

  {t:'pillar', html:`
    <div class="pillarno">Pillar 3</div>
    <h2 style="margin-top:8px">Operations</h2>
    <p class="big">Simplify the back end so the day-to-day stops draining your energy. The business should not live only in your head.</p>`},

  {t:'pillar', html:`
    <div class="pillarno">Pillar 4</div>
    <h2 style="margin-top:8px">Marketing and Sales</h2>
    <p class="big">Make them focused and personal, tailored to how you naturally connect with the clients you most want to work with.</p>`},

  {t:'pillar', html:`
    <div class="pillarno">Pillar 5</div>
    <h2 style="margin-top:8px">Finances and Personal Management</h2>
    <p class="big">Build the numbers and the rhythm so the business supports your life, instead of constantly pulling from it.</p>`},

  {t:'sequence', html:`
    <div class="kick">Why the order matters</div>
    <h2>Vision first. Money last. Each pillar unlocks the next.</h2>
    <p class="big">You cannot fix pricing before you know who you serve, and you cannot streamline operations for offers you have not decided on. In sequence, it compounds.</p>`},

  {t:'look', html:`
    <div class="kick">Part three, what it looks like</div>
    <h2>A streamlined week has room in it.</h2>
    <div class="week">
      <div class="day"><div class="d">Mon</div><div class="blk a">Deep work</div></div>
      <div class="day"><div class="d">Tue</div><div class="blk o">Clients</div></div>
      <div class="day"><div class="d">Wed</div><div class="blk o">Open</div></div>
      <div class="day"><div class="d">Thu</div><div class="blk o">Clients</div></div>
      <div class="day"><div class="d">Fri</div><div class="blk d">Plan, off by 2</div></div>
    </div>
    <p class="lede">Not busier. Clearer. The white space is the point.</p>`},

  {t:'roadmap', html:`
    <div class="kick">How we get there</div>
    <h2>A 90-day roadmap, one quarter at a time.</h2>
    <p class="big">We pick the few right priorities for the next ninety days instead of chasing everything at once, then build the systems and the weekly rhythm that make them stick.</p>`},

  {t:'whyme', html:`
    <div class="kick">Why me</div>
    <h2>Connie Whitesell, PCC, MBA</h2>
    <p class="big">Twenty-plus years in business and strategy, an ICF Professional Certified Coach, host of the Small Biz 101 Podcast. My whole practice is one thing: taking brilliant, scattered owners and helping them streamline into a business that runs.</p>`},

  {t:'recap', html:`
    <div class="kick">Three things to keep</div>
    <ul>
      <li>Scattered is a focus problem, not a time problem.</li>
      <li>Fewer, better decisions beat more effort, every time.</li>
      <li>A business that runs on a plan gives you back the freedom you started for.</li>
    </ul>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h1 style="font-size:46px">Let's map your first 90 days.</h1>
    <p class="lede">Book a free discovery call with Connie at scatteredtostreamlined.com. We will find the one pillar holding you back right now, and the first streamlined move to make.</p>
    <p class="disc">Educational content only. This masterclass shares a strategic method and general business principles. No income, revenue, or result is guaranteed, and nothing here is financial, legal, or tax advice. Outcomes vary with your market, effort, and circumstances.</p>`}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls||'');
  el.innerHTML = s.html + '<div class="num">'+(i+1)+' / '+S.length+'</div>'
    + '<div class="foot">Scattered to Streamlined</div>';
  deck.appendChild(el);
});
</script>
</body>
</html>
