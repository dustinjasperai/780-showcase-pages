<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing Through the Block, With Love — a masterclass with Joanna Phoenix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0fb;
    --panel:#ffffff;
    --rule:#dfe3f5;
    --ink:#363737;
    --muted:#757575;
    --accent:#6b7fd7;
    --deep:#3f4a99;
    --head:"IBM Plex Serif",Georgia,serif;
    --body:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(54,55,55,.04)}
  .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:600;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14}
  h3{font-family:var(--head);font-weight:500;font-size:25px;line-height:1.2;margin-bottom:10px}
  p{font-size:19px;margin-top:16px;max-width:60ch}
  p.lead{font-size:22px;color:var(--ink)}
  p.muted{color:var(--muted)}
  .big{font-family:var(--head);font-size:40px;line-height:1.12;font-weight:500}
  .big .a{color:var(--accent);font-style:italic}
  ul{margin:20px 0 0 0;padding:0;list-style:none}
  li{font-size:19px;padding:12px 0 12px 26px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;
    border-radius:50%;background:var(--accent)}
  .num{font-family:var(--head);font-size:15px;color:var(--deep);font-weight:600;
    letter-spacing:.06em;margin-bottom:6px}
  .pillar{display:flex;align-items:baseline;gap:16px}
  .pillar .n{font-family:var(--head);font-size:52px;font-weight:600;color:var(--accent);
    line-height:1;min-width:64px}
  .foot{margin-top:26px;font-size:14px;color:var(--muted)}
  .cta h1{font-size:42px}
  .disc{margin-top:28px;font-size:13px;color:var(--muted);max-width:66ch;line-height:1.5}
  .pg{position:absolute}
  .slide{position:relative}
  .pgn{position:absolute;top:18px;right:22px;font-size:12px;color:var(--muted);
    letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">Creative, Inspired, ALIVE &middot; a live masterclass</div>
    <h1>Writing Through the Block, With Love</h1>
    <p class="lead">For writers who have the talent and the idea, and still cannot get the pages out. This is the inner work that gets you moving again.</p>
    <div class="foot">with Joanna Phoenix</div>`},

  {t:'promise', cls:'', html:`
    <div class="kick">What this hour gives you</div>
    <h2>Leave able to sit down and write, with the critic in the room.</h2>
    <p>Not more rules. A way to understand what is actually stopping you, and four shifts that put you back in contact with your own creative energy.</p>`},

  {t:'who', cls:'', html:`
    <div class="kick">Who this is for</div>
    <h2>The serious writer who keeps not opening the file.</h2>
    <ul>
      <li>You have a novel you believe in and have barely touched in months.</li>
      <li>You have bought the craft books and the courses. The problem is not information.</li>
      <li>Every time you sit down, a voice tells you who do you think you are.</li>
    </ul>`},

  {t:'trap', cls:'', html:`
    <div class="kick">The trap</div>
    <h2>So you reach for more discipline.</h2>
    <p>More structure, more word-count rules, one more craft class. It works for a week, then the resistance comes back harder, and now you also feel like you failed at discipline.</p>
    <p class="muted">The lane is full of people selling you the craft. Almost no one is talking about the part of you that will not let you use it.</p>`},

  {t:'reframe', cls:'', html:`
    <div class="kick">The reframe</div>
    <p class="big">The block is not a craft problem. It is a <span class="a">safety</span> problem.</p>
    <p>A nervous system that does not feel safe to be seen will protect you from the exposure of finishing. Discipline cannot override that. Love can soften it.</p>`},

  {t:'part', cls:'', html:`
    <div class="num">Part one</div>
    <h2>What "stuck" actually is</h2>`},

  {t:'p1a', cls:'', html:`
    <div class="kick">Part one</div>
    <h3>Resistance is information, not a verdict.</h3>
    <p>The avoidance, the cleaning, the research spiral: these are not proof that you are undisciplined or out of talent. They are your system telling you something feels unsafe. Once you can read the signal, you can answer it instead of fighting it.</p>`},

  {t:'p1b', cls:'', html:`
    <div class="kick">Part one</div>
    <h3>The inner critic, up close.</h3>
    <p>The voice that says the first chapter is already bad is trying to keep you from being judged. You do not silence it by arguing. You learn what it is protecting, and you bring it with you to the page instead of waiting for it to leave.</p>`},

  {t:'part2', cls:'', html:`
    <div class="num">Part two</div>
    <h2>The four shifts</h2>
    <p class="muted">The heart of how I coach: transformation through love, not force.</p>`},

  {t:'pillar1', cls:'', html:`
    <div class="pillar"><div class="n">1</div><div>
      <div class="num">The four shifts</div>
      <h3>Unlocking creative energy</h3>
      <p>Reconnecting to the felt sense of aliveness that made you want to write in the first place, so the work flows instead of grinds.</p>
    </div></div>`},

  {t:'pillar2', cls:'', html:`
    <div class="pillar"><div class="n">2</div><div>
      <div class="num">The four shifts</div>
      <h3>Dealing with the inner critic</h3>
      <p>Naming the voice, understanding what it is guarding, and building a working relationship with it so it stops running the whole process.</p>
    </div></div>`},

  {t:'pillar3', cls:'', html:`
    <div class="pillar"><div class="n">3</div><div>
      <div class="num">The four shifts</div>
      <h3>Drama-free creativity</h3>
      <p>Letting go of the belief that the creative life has to be suffering. Progress without the perfectionism spiral and the all-or-nothing starts and stops.</p>
    </div></div>`},

  {t:'pillar4', cls:'', html:`
    <div class="pillar"><div class="n">4</div><div>
      <div class="num">The four shifts</div>
      <h3>Finding your genius</h3>
      <p>Locating the particular gift that is yours to give, the story only you can tell, and writing from there instead of from who you think you should be.</p>
    </div></div>`},

  {t:'together', cls:'', html:`
    <div class="kick">How they fit</div>
    <h2>Transformation through love.</h2>
    <p>Energy, the critic, the drama, your genius: these are not four tactics. They are one movement, from forcing yourself to write toward feeling safe enough to. That is the whole method, and it is gentler and more durable than discipline.</p>`},

  {t:'part3', cls:'', html:`
    <div class="num">Part three</div>
    <h2>What changes</h2>`},

  {t:'after', cls:'', html:`
    <div class="kick">When the block lifts</div>
    <h3>From numb to alive.</h3>
    <ul>
      <li>You open the file without the dread, because the critic no longer gets the first word.</li>
      <li>You write on ordinary days, not only on inspired ones.</li>
      <li>The work starts to sound like you again, because you are writing from your genius, not your fear.</li>
    </ul>`},

  {t:'whyme', cls:'', html:`
    <div class="kick">Why me</div>
    <h2>I built my way back to the page the hard way.</h2>
    <p>I was a nurse with a PhD in public health, and I burned out. Reading and writing were how I healed. Over the next decade I studied craft closely and completed three novels while raising two kids, and I learned that the real work is almost never the craft. It is the inner life around it.</p>
    <p class="muted">Now I coach creatives through exactly that, and I share it every week in Creative, Inspired, ALIVE.</p>`},

  {t:'recap', cls:'', html:`
    <div class="kick">In one line</div>
    <p class="big">You do not need to become more disciplined. You need to feel <span class="a">safe</span> enough to create, and loved enough to be seen.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h1>Let's get you writing again.</h1>
    <p class="lead">If this is the work you have been missing, come and do it with me. I coach writers through the four shifts, one on one and in small groups.</p>
    <p>Reply to this, or find me at creativeinspiredalive.com to start.</p>
    <div class="disc">Educational content only. Nothing here is a promise of publication, income, or any specific result, and no outcome is guaranteed. Creative progress varies from writer to writer and depends on your own work.</div>`},
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.cls||'');
  d.innerHTML='<div class="pgn">'+(i+1)+' / '+S.length+'</div>'+s.html;
  deck.appendChild(d);
});
</script>
</body>
</html>
