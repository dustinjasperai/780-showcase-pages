<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mindset Architecture of Elite Performers | Elite High Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D2436;        /* deep performance navy ground (from brand-world palette) */
    --panel:#13324A;     /* raised panel */
    --rule:#20506E;      /* hairline architecture rule */
    --accent:#36D6C3;    /* performance teal accent */
    --ink:#F2F7FA;       /* light ink */
    --muted:#A9C2D2;     /* muted light */
    --display:'Sora',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    background:linear-gradient(180deg,var(--panel),#0F2A3E);
    border:1px solid var(--rule);
    border-radius:18px;
    padding:52px 54px;
    margin:0 0 22px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.01em}
  .sub{font-size:20px;color:var(--muted);margin-top:18px;max-width:40ch;line-height:1.5}
  .big{font-family:var(--display);font-weight:800;font-size:92px;line-height:1;color:var(--accent)}
  ul{margin-top:22px;list-style:none;display:grid;gap:14px}
  li{position:relative;padding-left:30px;font-size:20px;line-height:1.45;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;border:2px solid var(--accent);border-radius:3px}
  .steps{margin-top:26px;display:grid;gap:12px}
  .step{display:flex;gap:16px;align-items:baseline;border-top:1px solid var(--rule);padding-top:12px}
  .step .n{font-family:var(--display);font-weight:800;color:var(--accent);font-size:18px;min-width:34px}
  .step .t{font-size:19px;color:var(--ink)}
  .step .d{display:block;color:var(--muted);font-size:16px;margin-top:3px}
  .note{font-size:15px;color:var(--muted);margin-top:26px;line-height:1.5}
  .tag{font-family:var(--display);font-size:14px;color:var(--muted);position:absolute;right:22px;top:20px;letter-spacing:.08em}
  .brandline{font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Susan Hobson', h:'The Mindset Architecture of Elite Performers',
   sub:'Why 90% of leadership is mental, and how to rebuild the other 90%.'},

  {t:'promise', eyebrow:'What you will leave with', h:'One hour. Three things you keep.',
   bullets:['Why your ceiling is almost never a skills problem','The mental architecture elite performers run under pressure','A first move to rewire one belief that is costing you impact']},

  {t:'who', eyebrow:'Who this is for', h:'High achievers who have already done the obvious.',
   sub:'Executives, founders, and emerging leaders who work hard, deliver, and still feel held back by self-doubt, perfectionism, or an invisible ceiling.'},

  {t:'trap', eyebrow:'The trap', h:'You did everything right. You still feel stuck.',
   sub:'So you reach for more. More effort, more tactics, another leadership course. The 10 percent gets a little better. The real lever never moves.'},

  {t:'reframe', eyebrow:'The reframe', h:'The ceiling is not your skill set.',
   sub:'It is the mental architecture underneath it. Skills are the 10 percent. Mindset is the 90 percent, and almost nobody trains it.'},

  {t:'part', eyebrow:'Part one', h:'The core problem',
   sub:'Leadership development has spent decades on the visible 10 percent, and left the engine untouched.'},

  {t:'stat', eyebrow:'The number I built a career on', big:'90%',
   sub:'Of any performance is mental. I learned it competing at Princeton, Harvard, and in pro hockey, and it holds exactly the same in the C-suite.'},

  {t:'problem', eyebrow:'Why skills never close the gap', h:'A better tactic cannot fix a limiting belief.',
   bullets:['Perfectionism quietly caps the size of the bets you make','Imposter thoughts tax every high-stakes decision','Old mental patterns run on autopilot, faster than any new skill']},

  {t:'part', eyebrow:'Part two', h:'The Mindset Architecture Framework',
   sub:'A neuroscience-based way to rebuild how a leader thinks, grounded in neuroplasticity, so new patterns actually hold.'},

  {t:'framework', eyebrow:'The architecture', h:'Think strategically, so you play your biggest impact.',
   bullets:['Awareness of the belief running the pattern','Reprogramming it using how the brain actually changes','Self-awareness and mental resilience you can feel under pressure']},

  {t:'process', eyebrow:'The process', h:'How the work actually runs',
   steps:[
     {n:'01',t:'Awareness',d:'Name the pattern and the belief driving it'},
     {n:'02',t:'Alignment',d:'Line the belief up with who you are becoming'},
     {n:'03',t:'Strategy',d:'Design the new mental response on purpose'},
     {n:'04',t:'Action',d:'Rehearse it where the stakes are real'},
     {n:'05',t:'Reflection',d:'Study what the brain is learning'},
     {n:'06',t:'Adaptation',d:'Lock it in, then raise the bar again'}
   ]},

  {t:'leadership2', eyebrow:'Leadership 2.0', h:'Mindset first. Skills second.',
   sub:'Leadership 2.0 is a science-based methodology for sustainable high performance. It targets the epicenter of your impact and influence, your mindset, instead of adding one more skill on top.'},

  {t:'part', eyebrow:'Part three', h:'When the architecture holds',
   sub:'When the architecture changes, the behavior changes on its own. You stop managing symptoms.'},

  {t:'after', eyebrow:'On the other side', h:'The same you, with the ceiling gone.',
   bullets:['Decisions made from clarity, not from fear of being found out','Pressure that sharpens you instead of shrinking you','Performance that holds, because it is built from the inside out']},

  {t:'why', eyebrow:'Why learn this from me', h:'From athlete to coaching the C-suite.',
   sub:'Fifteen years coaching professional athletes, C-suite executives, entrepreneurs, and leaders at companies like Google. I competed at Princeton and Harvard and in the NWHL, and I have spent my career turning that performance science into a method leaders can use.'},

  {t:'cta', eyebrow:'Your next step', h:'Build your own mindset architecture.',
   sub:'If this is the work you want to do, the next step is a free high-performance consult with an Elite coach. We will look at the one belief holding you back and map what rebuilding it would take.',
   disclaimer:'This masterclass is for educational purposes only. Individual results vary and no specific outcome, income, or performance result is guaranteed.'}
];

function el(tag, cls, html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('div','slide');
  sl.appendChild(el('span','tag', (i+1)+' / '+S.length));
  if(s.eyebrow) sl.appendChild(el('div','eyebrow',s.eyebrow));
  if(s.big){ sl.appendChild(el('div','big',s.big)); }
  if(s.h){ sl.appendChild(el(i===0?'h1':'h2',null,s.h)); }
  if(s.sub) sl.appendChild(el('div','sub',s.sub));
  if(s.bullets){const ul=el('ul');s.bullets.forEach(b=>ul.appendChild(el('li',null,b)));sl.appendChild(ul);}
  if(s.steps){const w=el('div','steps');s.steps.forEach(st=>{const r=el('div','step');r.appendChild(el('span','n',st.n));const tx=el('div');tx.appendChild(el('span','t',st.t));tx.appendChild(el('span','d',st.d));r.appendChild(tx);w.appendChild(r);});sl.appendChild(w);}
  if(s.disclaimer) sl.appendChild(el('div','note',s.disclaimer));
  if(i===0) sl.appendChild(el('div','brandline','Elite High Performance'));
  deck.appendChild(sl);
});
</script>
</body>
</html>
