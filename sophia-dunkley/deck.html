<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Turning Strangers Into Friends · Sophia Dunkley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1D1620; --panel:#271C2A; --rule:#3A2C3E;
    --rose:#B5677E; --sage:#7C9070; --chalk:#F1ECE7; --grey:#CDBFC7; --dim:#7A6B76;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Work Sans',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--rose);margin-bottom:2.4vh}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:400;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:5vw}
  .t-normal h1{font-size:3.4vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.85vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Work Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--sage);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--rose),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#3A2C3E 0%,#100B13 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:86%;font-style:italic;color:#F1EFE9}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#3A2C3E 0%,#100B13 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.2vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--rose);color:#EFC9D3;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .arc-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-arc{right:7.5%;bottom:8%;width:22vw}
  .corner-arc{right:6%;bottom:7.5%;width:10vw;opacity:.4}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--rose);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--rose);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 18</div>
<div class="brand-foot">Turning Strangers Into Friends</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- trust-arc: two nodes (stranger, friend) joined by a warming line -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arc" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 118 C 90 40, 170 40, 232 118" stroke="#7C9070" opacity="0.5"/>
    <path d="M28 118 C 90 46, 170 46, 232 118" stroke="#B5677E" opacity="0.9"/>
    <circle cx="28" cy="118" r="6" fill="#7C9070" opacity="0.9"/>
    <circle cx="232" cy="118" r="6" fill="#B5677E" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Turning Strangers Into Friends',sub:'The relationship system that turns a new patient into an accepted treatment plan, starting with the very first phone call.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'A great treatment plan still gets declined by a stranger.',body:'Your team can diagnose correctly, price fairly, and still watch a patient say no. The plan was never the problem. The relationship had not been built yet when the plan was presented.'},
 {t:'dark',title:'Patients rarely say no to a treatment plan. They say no to a stranger holding one.'},

 {t:'section',idx:'Part One',title:'Why Good Treatment Plans Get Declined'},
 {t:'normal',k:'The timing mistake',title:'Case acceptance is decided long before the chairside conversation.',body:'By the time a doctor presents a plan, the patient has already decided how much they trust the practice. If that trust was never built, the presentation is just a stranger asking for money.'},
 {t:'normal',k:'The real cost',title:'A skilled doctor still loses cases a trained team would have kept.',body:'Clinical skill protects the diagnosis. It does not protect the relationship. Practices lose acceptance every week to a phone call, a front-desk greeting, or a rushed handoff that never let the patient feel known.'},
 {t:'dark',title:'If the first friendly voice a patient hears is someone explaining a fee, the relationship already started behind.'},

 {t:'section',idx:'Part Two',title:'The Turning Strangers Into Friends System'},
 {t:'normal',k:'Pillar One, The Phone',title:'Every new patient becomes a friend, or a stranger, on the first call.',body:'The front desk and treatment coordinators are trained on the call itself: how to greet, listen, and build real rapport before a single question about insurance or price. The call is where the relationship starts, not where scheduling happens.'},
 {t:'normal',k:'Pillar Two, The Team',title:'The ELI 360 shows each team member how they naturally connect.',body:'A leadership and communication assessment maps how each doctor and team member builds trust. Instead of one person carrying the relationship-building, the whole office learns to adapt its style to the patient in front of it.'},
 {t:'normal',k:'Pillar Three, The Case Presentation',title:'A full-arch case is accepted by a friend, not sold to a stranger.',body:'Case presentation and implant-arch sales training give doctors and coordinators a scripted handoff that presents the whole treatment plan as a continuation of a relationship already built, not a cold pitch at the end of an exam.'},
 {t:'dark',title:'Turning Strangers Into Friends runs as one system, from the first ring of the phone to the signature on the plan.'},

 {t:'section',idx:'Part Three',title:'What This Looks Like In Your Practice'},
 {t:'normal',k:'The shift',title:'Case acceptance becomes a team habit, not one person\'s talent.',body:'When the phone, the team, and the case presentation all build the same relationship, acceptance stops depending on which doctor or coordinator happens to be working that day.'},
 {t:'normal',k:'Why this system',title:'Built inside real practices for more than 25 years.',body:'This comes from decades inside dental practices: management, treatment coordination, and dental-implant-arch sales coaching, not a theory built in a classroom.'},
 {t:'dark',title:'You already have strangers walking through the door every day. This system decides how many leave as friends.'},

 {t:'section',idx:'Your next step',title:'Bring Turning Strangers Into Friends Into Your Practice'},
 {t:'normal',k:'How this starts',title:'A complimentary consultation to map the system onto your team.',body:'We look at your phone process, your team\'s natural communication styles, and how your practice currently presents treatment plans, then map where Turning Strangers Into Friends fits first.'},
 {t:'cta',title:'Ready to turn more strangers into friends?',chips:['Schedule your complimentary consultation','Start with the phone training'],disc:'Educational content for dental practice owners and teams. No income, case-acceptance rate, or business result is guaranteed. Results vary by practice and team.'},
];

const deck=document.getElementById('deck');
function arc(kind){return `<svg class="arc-motif ${kind==='title'?'title-arc':'corner-arc'}"><use href="#arc"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Turning Strangers Into <b>Friends</b> &middot; Sophia Dunkley, The Practice Navigator</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=arc(s.arc);
  else if(s.t==='title') h+=arc('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
