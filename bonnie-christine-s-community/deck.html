<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Blank Page to Licensed Collection — a live masterclass with Bonnie Christine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf4e2;      /* her cream ground (brand.json #fdf4e2) */
    --panel:#f2e6d0;   /* deeper tint of the cream, in-family */
    --ink:#43362d;     /* her dominant espresso (brand.json #43362d, 80 uses) */
    --taupe:#b39688;   /* brand.json #b39688 */
    --accent:#b75858;  /* her terracotta/rose (brand.json #b75858) */
    --rule:#d9c7a8;    /* soft sketchbook-margin rule, cream-family */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Karla",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:64px 60px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;top:26px;left:0;width:100%;height:1px;background:var(--rule);opacity:.5}
  .kicker{font-family:"Karla";text-transform:uppercase;letter-spacing:.22em;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:20px}
  h1{font-family:"Cormorant Garamond";font-weight:700;font-size:58px;line-height:1.06;letter-spacing:.2px;margin-bottom:22px}
  h2{font-family:"Cormorant Garamond";font-weight:600;font-size:44px;line-height:1.12;margin-bottom:20px}
  h3{font-family:"Cormorant Garamond";font-weight:600;font-size:26px;margin-bottom:6px}
  p{font-size:20px;max-width:42ch;margin-bottom:14px}
  p.lead{font-size:23px;max-width:46ch}
  .big{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-size:38px;line-height:1.2;color:var(--ink);max-width:36ch}
  .accent{color:var(--accent)}
  ul{list-style:none;margin-top:8px}
  li{font-size:20px;padding:14px 0 14px 30px;border-bottom:1px solid var(--rule);position:relative;max-width:54ch}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  li b{font-weight:700}
  .pill{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--bg);background:var(--accent);border-radius:100px;padding:6px 16px;margin-bottom:20px;width:max-content}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
  .cell{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px 24px}
  .cell p{font-size:17px;color:var(--ink);opacity:.86;margin:0;max-width:none}
  .quote{font-family:"Cormorant Garamond";font-style:italic;font-size:30px;line-height:1.25;max-width:40ch;margin-bottom:16px}
  .cite{font-size:15px;letter-spacing:.06em;color:var(--ink);opacity:.7;max-width:52ch}
  .foot{position:absolute;bottom:22px;left:60px;right:60px;display:flex;justify-content:space-between;font-size:13px;letter-spacing:.08em;color:var(--ink);opacity:.55}
  .disc{font-size:14px;color:var(--ink);opacity:.72;max-width:58ch;margin-top:18px;line-height:1.45}
  .cta-note{font-size:22px;max-width:44ch;margin-top:6px}
  @media(max-width:680px){.slide{padding:44px 26px}h1{font-size:38px}h2{font-size:31px}.grid{grid-template-columns:1fr}.foot{left:26px;right:26px}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S=[
 {t:'title',kicker:'A live masterclass with Bonnie Christine',
   h:'From a Blank Page<br>to a <span class="accent">Licensed Collection</span>',
   lead:'How to design original surface patterns and turn them into a collection a brand will actually license, and pay you for.'},

 {t:'text',kicker:'Who this is for',
   h:'You have a folder full of patterns. None of them are earning anything.',
   lead:'This hour is for the aspiring designer who can already make pretty work but has never been shown the path from a sketchbook to a signed licensing deal.'},

 {t:'statement',kicker:'The trap',
   big:'You were told the art was the hard part. So you got good at the art. And the patterns still just sit in a folder.'},

 {t:'statement',kicker:'The real problem',
   big:'Talent was never your bottleneck. The bottleneck is that no one taught you the repeatable path from a single motif to a paid, licensed collection.'},

 {t:'part',pill:'Part One',h:'Why beautiful work does not sell itself'},

 {t:'list',kicker:'Three quiet reasons',h:'Why good designers stay unpaid',
   items:[
     '<b>No repeatable process.</b> Every collection starts from a blank page and a knot of anxiety.',
     '<b>No collection thinking.</b> Single pretty tiles, never a cohesive set a brand can buy.',
     '<b>No licensing map.</b> No idea who buys art, how deals are structured, or how royalties work.']},

 {t:'part',pill:'Part Two',h:'The method, step by step'},

 {t:'text',kicker:'The method, step 1',h:'Heartstorming',
   lead:'Before a single line, we root the collection in your own story and values, not a mood board of other people’s work. It is garden-grown storytelling made into a first step you can repeat every time.'},

 {t:'text',kicker:'The method, step 2',h:'Quick-Jot Brainstorming',
   lead:'Start from twenty plain words and expand them into fifty concrete motif ideas. You never face a blank page again, and the ideas are yours from the first minute.'},

 {t:'grid',kicker:'The method, step 3',h:'The Motif Hierarchy',
   lead:'A pattern reads because its parts do different jobs. Three tiers do the work:',
   cells:[
     {h:'Hero',p:'The bold motif your eye lands on first.'},
     {h:'Support',p:'Mid-scale motifs that carry the rhythm.'},
     {h:'Accent',p:'Small fillers that keep it from going flat.'},
     {h:'Together',p:'A pattern that feels designed, not decorated.'}]},

 {t:'list',kicker:'The method, step 4',h:'The Four Composition Families',
   lead:'Professionals choose a layout on purpose instead of by accident. You will know when to reach for each:',
   items:[
     '<b>Tossed</b>, for an easy, organic scatter.',
     '<b>Geometric</b>, for structure and calm.',
     '<b>Half-drop and layered</b>, for depth and movement.',
     '<b>Striped</b>, for direction and energy.']},

 {t:'text',kicker:'The method, step 5',h:'From motifs to a collection',
   lead:'A single tile is a sample. A cohesive set with considered colorways is what a brand licenses. This is where your work stops looking like practice and starts looking like a product.'},

 {t:'part',pill:'Part Three',h:'Getting paid: the licensing path'},

 {t:'text',kicker:'The method, step 6',h:'How licensing actually pays',
   lead:'The part almost no one teaches: who buys surface designs, how to pitch a collection, how contracts and royalties are structured, and how one signed collection can pay you again and again.'},

 {t:'text',kicker:'Where this leads',h:'A signed collection, not a hopeful inbox',
   lead:'Instead of guessing, you will have a cohesive collection, a short list of brands who license work like yours, and a clear ask. That is what turns a hobby into an income.'},

 {t:'text',kicker:'Why learn this here',h:'Built from a real licensing career',
   lead:'Bonnie Christine has licensed her artwork with brands around the world and built a multi-seven-figure creative business from surface pattern design. The method in this class is the one she uses herself.'},

 {t:'quote',kicker:'From past students',
   quotes:[
     '“I got a fabric licensing offer on graduation day.”',
     '“I am licensed with my dream fabric company, now working on my twelfth collection.”'],
   cite:'Surface Pattern Design Immersion graduates. Over 15,000 designers in more than 75 countries have taken the course since 2018.'},

 {t:'text',kicker:'The whole path, in one line',
   h:'Heartstorm, motifs, patterns, collection, <span class="accent">license</span>',
   lead:'Six steps, one repeatable path, from the story only you can tell to a collection a brand will pay to use.'},

 {t:'cta',kicker:'Your next step',
   h:'Ready to build your<br>first licensed collection?',
   note:'Surface Pattern Design Immersion is the full 8-week program where you build a complete, license-ready collection with live guidance. Enrollment opens once a year.',
   disc:'Educational program only. No income, licensing, or specific result is guaranteed. Results vary by the effort, market, and circumstances of each designer.'}
];

const deck=document.getElementById('deck');
const foot='<div class="foot"><span>Surface Pattern Design Immersion</span><span>Bonnie Christine</span></div>';
function kick(s){return s.kicker?`<div class="kicker">${s.kicker}</div>`:''}
const R={
 title:s=>kick(s)+`<h1>${s.h}</h1><p class="lead">${s.lead}</p>`,
 text:s=>kick(s)+`<h2>${s.h}</h2><p class="lead">${s.lead}</p>`,
 statement:s=>kick(s)+`<p class="big">${s.big}</p>`,
 part:s=>`<div class="pill">${s.pill}</div><h1>${s.h}</h1>`,
 list:s=>kick(s)+`<h2>${s.h}</h2>`+(s.lead?`<p class="lead">${s.lead}</p>`:'')+'<ul>'+s.items.map(i=>`<li>${i}</li>`).join('')+'</ul>',
 grid:s=>kick(s)+`<h2>${s.h}</h2>`+(s.lead?`<p class="lead">${s.lead}</p>`:'')+'<div class="grid">'+s.cells.map(c=>`<div class="cell"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')+'</div>',
 quote:s=>kick(s)+s.quotes.map(q=>`<p class="quote">${q}</p>`).join('')+`<p class="cite">${s.cite}</p>`,
 cta:s=>kick(s)+`<h1>${s.h}</h1><p class="cta-note">${s.note}</p><p class="disc">${s.disc}</p>`
};
S.forEach(s=>{const sec=document.createElement('section');sec.className='slide';sec.innerHTML=R[s.t](s)+foot;deck.appendChild(sec);});
</script>
</body>
</html>
