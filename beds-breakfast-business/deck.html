<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Booked-Direct B&amp;B &middot; A Live Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ea;        /* warm cream ground (their light scheme) */
    --ink:#1a3a2a;       /* deep forest green heading (brand h2) */
    --panel:#0b4008;     /* deep forest green (brand button bg + footer) */
    --deep:#0a3f06;      /* footer green */
    --accent:#0b4008;    /* forest green, dominant brand color */
    --gold:#fdc71a;      /* warm gold highlight (brand button text) */
    --muted:#55624f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Montserrat",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:#fffdf8;border:1px solid #e7dedc;border-radius:16px;padding:48px 44px;margin:22px 0;
    box-shadow:0 1px 0 rgba(10,63,6,.06),0 18px 40px -28px rgba(10,63,6,.5);min-height:360px;
    display:flex;flex-direction:column;justify-content:center}
  .slide.hero{background:var(--panel);color:#fbf6e6}
  .slide.part{background:var(--deep);color:#fbf6e6}
  .kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--gold);margin-bottom:14px}
  .slide:not(.hero):not(.part) .kick{color:var(--accent)}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:46px;line-height:1.08;margin-bottom:16px}
  h2{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:34px;line-height:1.12;margin-bottom:16px}
  p{font-size:19px;max-width:62ch;margin-bottom:12px}
  .slide.hero p,.slide.part p{color:#efe8d4}
  ul{margin:10px 0 0 0;padding:0;list-style:none}
  li{font-size:18px;padding:10px 0 10px 30px;position:relative;max-width:64ch}
  li:before{content:"";position:absolute;left:0;top:18px;width:12px;height:12px;border-radius:3px;background:var(--gold)}
  .slide.part li:before{background:var(--gold)}
  .num{font-family:"Playfair Display",serif;font-weight:700;color:var(--gold);font-size:20px;margin-bottom:6px}
  .disc{margin-top:20px;font-size:13px;color:#efe8d4;max-width:70ch}
  .foot{max-width:960px;margin:0 auto;padding:0 24px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Beds, Breakfast &amp; Business &middot; a live masterclass with Gerry MacPherson</div>
<script>
const S = [
  {t:'title', cls:'hero', k:'A Live Masterclass', h:"The Booked-Direct B&B",
   p:"How to fill your rooms direct, price for the whole calendar, and run a bed and breakfast like the business it actually is."},

  {t:'who', k:'Who this is for', h:"The owner who is busy, booked some, and still not keeping enough",
   list:["You run a real bed and breakfast, not a side project.","Your calendar fills on peak weekends and goes quiet midweek.","A big slice of every booking leaves again as platform commission.","You wear every hat, so there is never time to fix the engine."]},

  {t:'trap', k:'The trap', h:"You are not short on guests. You are short on guests who are yours.",
   p:"The booking platforms have trained your future guests to search, compare, and book somewhere other than your own site. You still do the hosting. They keep the relationship and a cut of the rate."},

  {t:'reframe', cls:'part', k:'The reframe', h:"A bed and breakfast is a business. The cozy part is the product, not the plan.",
   p:"The inns that thrive are not the prettiest. They are the ones run with direct bookings, real pricing, and systems that hold when the owner is not in the room."},

  {t:'part', cls:'part', k:'Part One', h:"The problem: rented guests",
   p:"When the platform owns the search and the booking, you are renting your own guests back at a commission, every single night."},

  {t:'problem', k:'What OTA dependence costs you', h:"Three quiet leaks",
   list:["Margin: commission comes off the top of your best-earning nights.","Relationship: the guest is the platform's contact, not yours, so the rebooking is theirs to win.","Pricing power: you match the comp set on the platform instead of pricing your own demand."]},

  {t:'part', cls:'part', k:'Part Two', h:"The method: the Booked-Direct system",
   p:"Four moving parts, built from the Beds, Breakfast & Business pillars. Each one takes a night back from the platforms."},

  {t:'pillar', k:'Pillar 1 of 4', h:"Direct Booking Growth", nnum:"01",
   list:["A website built to convert a looker into a direct booking, not just to look nice.","A Google Business Profile and review flow that answer the search before the OTA does.","An email list that turns a past guest into a repeat guest with no commission attached."]},

  {t:'pillar', k:'Pillar 2 of 4', h:"Revenue Management", nnum:"02",
   list:["Price by season and demand, not one flat nightly rate all year.","Build a 12-month revenue calendar so midweek and shoulder nights have a plan.","Treat your quiet nights as the profit they can be, not dead space."]},

  {t:'pillar', k:'Pillar 3 of 4', h:"Operations that run without you", nnum:"03",
   list:["Written SOPs for front desk, housekeeping QC, and turnover so quality holds every stay.","A turnover timer and checklist so a new helper performs like you on day one.","The business keeps its standard whether or not you are standing in the hallway."]},

  {t:'pillar', k:'Pillar 4 of 4', h:"Guest messaging that compounds", nnum:"04",
   list:["A structured flow from first inquiry to post-stay, so nothing falls through.","Messages that earn the five-star review while the stay is still fresh.","Each happy guest becomes the next booking and the next referral."]},

  {t:'map', k:'The whole picture', h:"The five pillars behind it all",
   p:"Direct bookings and pricing are where the money moves first. They sit on top of the full framework that runs the property.",
   list:["Planning and finances: know your numbers and your break-even.","Operations and safety: the property runs clean, legal, and consistent.","Guest experience and marketing: the reason they come, and the reason they come back."]},

  {t:'part', cls:'part', k:'Part Three', h:"What a booked-direct month looks like",
   p:"The shift is not more hours. It is the same rooms, earning more per night, with more of each night staying in the business."},

  {t:'picture', k:'The picture', h:"Same rooms. A different business.",
   list:["Midweek nights booked on a plan instead of left to chance.","A growing share of bookings coming direct, through your own front door.","Standards that hold because they live in a system, not only in your head.","Past guests returning because the relationship is yours to keep."]},

  {t:'why', k:'Why me', h:"35 years turning properties into businesses",
   p:"I am Gerry MacPherson. I have spent more than three decades in hospitality and built Beds, Breakfast & Business and the Keystone Hospitality Property School to give owners the revenue, direct-booking, and operations playbooks the big brands keep to themselves."},

  {t:'recap', k:'The recap', h:"Take one night back at a time",
   list:["Win the booking direct before a platform does.","Price the whole calendar, not just the peak.","Systemize the operation so quality does not depend on your presence.","Message guests so one stay becomes the next three."]},

  {t:'cta', cls:'hero', k:'Your next step', h:"Let's map your booked-direct plan",
   p:"If you want help applying this to your own property, book a free bed and breakfast coaching session with me and we will find the first night to take back.",
   disc:"Educational only. No income, occupancy, or revenue result is guaranteed. Results vary by property, market, effort, and conditions outside anyone's control."}
];

function el(tag, cls, html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
var deck=document.getElementById('deck');
S.forEach(function(s){
  var slide=el('section','slide'+(s.cls?(' '+s.cls):''));
  if(s.k) slide.appendChild(el('div','kick',s.k));
  if(s.nnum) slide.appendChild(el('div','num',s.nnum));
  if(s.h){ var tag = (s.t==='title')?'h1':'h2'; slide.appendChild(el(tag,null,s.h)); }
  if(s.p) slide.appendChild(el('p',null,s.p));
  if(s.list){ var ul=el('ul'); s.list.forEach(function(it){ ul.appendChild(el('li',null,it)); }); slide.appendChild(ul); }
  if(s.disc) slide.appendChild(el('div','disc',s.disc));
  deck.appendChild(slide);
});
</script>
</body>
</html>
