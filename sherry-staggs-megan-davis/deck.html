<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 10-Hour Bookkeeping Business — a masterclass with Sherry Staggs &amp; Megan Davis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F1;        /* warm ivory ground - brand ranked warm accents on light pages */
    --panel:#F4ECE2;     /* warm panel */
    --ink:#2A3B5E;       /* deep navy - brand dominant structural color #2a3b5e */
    --rule:#2A3B5E;
    --accent:#F8746A;    /* coral - brand button color #f8746a (11 uses) */
    --accent2:#E9A040;   /* amber - brand #e9a040 (9 uses) */
    --muted:#5B6782;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #deck{width:100vw;height:100vh;overflow:hidden;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:7vmin 9vmin}
  .slide.on{display:flex}
  h1,h2,.kicker,.num{font-family:'Amaranth',sans-serif}
  .kicker{font-size:2.0vmin;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:2.4vmin}
  h1{font-size:7.2vmin;line-height:1.04;font-weight:700;letter-spacing:-.01em;max-width:22ch}
  h2{font-size:5.0vmin;line-height:1.08;font-weight:700;max-width:24ch;margin-bottom:3vmin}
  .lead{font-size:3.0vmin;line-height:1.5;max-width:40ch;color:var(--ink)}
  .sub{font-size:2.5vmin;line-height:1.55;max-width:46ch;color:var(--muted);margin-top:2.4vmin}
  .rule{width:12vmin;height:.7vmin;background:var(--accent);border:0;margin:3vmin 0;border-radius:4px}
  .present{font-size:2.6vmin;color:var(--muted);margin-top:4vmin}
  .present b{color:var(--ink);font-weight:700}
  ul{list-style:none;margin-top:1vmin}
  li{font-size:2.7vmin;line-height:1.5;padding-left:4.4vmin;position:relative;margin:1.7vmin 0;max-width:44ch}
  li::before{content:"";position:absolute;left:0;top:1.0vmin;width:2.1vmin;height:2.1vmin;background:var(--accent);border-radius:3px}
  li.amber::before{background:var(--accent2)}
  .step{display:flex;align-items:baseline;gap:3vmin;margin:2.2vmin 0;max-width:50ch}
  .num{font-size:6vmin;font-weight:700;color:var(--accent);line-height:1;min-width:9vmin}
  .step-b{font-size:2.9vmin;line-height:1.4}
  .step-b b{display:block;font-size:3.2vmin;margin-bottom:.6vmin}
  .step-b span{color:var(--muted);font-size:2.4vmin;display:block;margin-top:.6vmin}
  .panel{background:var(--panel);border-left:.8vmin solid var(--accent);padding:4vmin 5vmin;border-radius:6px;max-width:52ch}
  .big{font-size:9vmin;font-weight:700;font-family:'Amaranth',sans-serif;color:var(--accent)}
  .who b{color:var(--accent)}
  .foot{position:absolute;bottom:3.5vmin;left:9vmin;right:9vmin;display:flex;justify-content:space-between;font-size:1.9vmin;color:var(--muted);letter-spacing:.04em}
  .disc{font-size:2.0vmin;color:var(--muted);max-width:52ch;line-height:1.5;margin-top:3vmin}
  .nav{position:fixed;bottom:3vmin;right:3vmin;display:flex;gap:1.4vmin;z-index:10}
  .nav button{font-family:'Amaranth',sans-serif;background:var(--ink);color:var(--bg);border:0;width:5vmin;height:5vmin;border-radius:50%;font-size:2.4vmin;cursor:pointer}
  .cta-steps li{font-size:2.9vmin}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav"><button onclick="go(-1)" aria-label="previous">&#8592;</button><button onclick="go(1)" aria-label="next">&#8594;</button></div>
<script>
const S = [
  {t:'title', kicker:'A Free Live Masterclass', h1:'The 10-Hour Bookkeeping Business',
   lead:'How to build a stable, recurring-revenue bookkeeping business in about ten hours a week, without chasing one-off clients.',
   present:'With <b>Sherry Staggs</b> &amp; <b>Megan Davis</b>, founders of The Bookkeeper Blueprint'},

  {t:'bullets', kicker:'Who this is for', h2:'You can do the books. The business is the part nobody taught you.',
   bullets:[
     'You are a skilled bookkeeper, but your income still depends on the hours you put in.',
     'Clients come one at a time, from referrals you cannot predict.',
     'Some months are full, some months are thin, and nothing feels stable.']},

  {t:'twople', kicker:'The reframe', h2:'More clients is not the fix. A more stable business is.',
   lead:'Most bookkeepers try to grow by taking on more work. That just buys you a busier, more fragile version of the same ceiling.',
   sub:'The bookkeepers who break through do not work more. They build a business that brings clients in on repeat and runs on recurring revenue.'},

  {t:'part', kicker:'Part One', h1:'The busy-bookkeeper trap', lead:'Why skill alone keeps you stuck at a ceiling.'},

  {t:'bullets', kicker:'What the trap costs you', h2:'Three leaks that keep a good bookkeeper small.',
   bullets:[
     '<b>Hourly thinking.</b> Billing by the hour caps your income at the number of hours in your week.',
     '<b>Manual client-getting.</b> If every new client depends on you hustling, growth stops the moment you get busy.||amber',
     '<b>No recurring base.</b> Without monthly retainers you start every month back at zero.']},

  {t:'part', kicker:'Part Two', h1:'The Bookkeeper Blueprint System', lead:'A four-step framework for reliable monthly income on about ten hours a week.'},

  {t:'step', kicker:'Step One', num:'01', title:'Build a recurring-revenue offer',
   body:'Move off one-off, hourly work and package monthly retainers so the same client pays you every month.',
   note:'Predictable income is the foundation everything else sits on.'},

  {t:'step', kicker:'Step Two', num:'02', title:'Choose the right clients',
   body:'Pick a niche and an ideal client you can serve profitably and repeatedly, so your work gets easier and your referrals get warmer.',
   note:'The wrong clients are why bookkeepers burn out and undercharge.'},

  {t:'step', kicker:'Step Three', num:'03', title:'Run the Marketing Automation Playbook',
   body:'Put a simple, automated system in place that attracts and converts new clients while you work, instead of relying on you to chase every lead.',
   note:'This is the engine most bookkeepers never build.'},

  {t:'step', kicker:'Step Four', num:'04', title:'Systemize delivery to about ten hours a week',
   body:'Use the right tools and repeatable workflows so the actual bookkeeping fits into part-time hours and the business stops eating your life.',
   note:'Stable income and a stable schedule, together.'},

  {t:'twople', kicker:'The engine', h2:'Why the automation step changes everything.',
   lead:'When clients come in through a system instead of through your energy, two things happen: growth no longer stalls when you get busy, and the business keeps filling even on your quiet weeks.',
   sub:'This is the difference between owning a bookkeeping job and owning a bookkeeping business.'},

  {t:'panel', kicker:'The outcome', big:'~10 hrs',
   lead:'A profitable, stable bookkeeping business that runs on recurring revenue and fits inside about ten hours a week.',
   sub:'Bookkeeping is not just about balancing numbers. It is about rebalancing your life.'},

  {t:'part', kicker:'Part Three', h1:'A ten-hour week, in real life', lead:'And why we can show you the way.'},

  {t:'bullets', kicker:'The shift', h2:'From trading hours to running a business.',
   bullets:[
     'Monthly retainers replace feast-or-famine invoicing.',
     'New clients arrive on repeat through your automated system.||amber',
     'The work fits part-time hours, so the income grows and the schedule does not.']},

  {t:'twople', kicker:'Your guides', h2:'Two bookkeepers who built this, then taught it.',
   lead:'<b style="color:var(--accent)">Sherry Staggs</b> holds a Master’s in Accountancy and runs Staggs Consulting, a six-figure bookkeeping firm.',
   sub:'<b style="color:var(--accent)">Megan Davis</b> started with no experience and left her full-time job as a single mom within four months, building Harvest Books into a six-figure firm.'},

  {t:'twople', kicker:'The whole system, in one line', h2:'Recurring offer, right clients, automated marketing, part-time delivery.',
   lead:'That is how you build a bookkeeping business that is stable, profitable, and about ten hours a week, instead of a busier version of the job you already have.'},

  {t:'cta', kicker:'Build it with us', h2:'Ready to build your 10-hour bookkeeping business?',
   lead:'Inside The Bookkeeper Blueprint, we walk you through the full system step by step, with the templates, the automation, and the community to get it running.',
   steps:['Join The Bookkeeper Blueprint and start with the Fast Start Course.',
          'Come to a free live Q&amp;A to map your next step with us.||amber'],
   disc:'This masterclass is for educational purposes only and is not financial, legal, or business advice. No income or result is guaranteed. Results vary and depend on your effort, experience, market, and individual circumstances. Your results may differ.'}
];

function li(items){
  return '<ul>'+items.map(function(x){
    var parts = x.split('||'); var cls = parts[1]==='amber' ? ' class="amber"' : '';
    return '<li'+cls+'>'+parts[0]+'</li>';
  }).join('')+'</ul>';
}
function foot(i){ return '<div class="foot"><span>The Bookkeeper Blueprint</span><span>'+(i+1)+' / '+S.length+'</span></div>'; }

function body(s,i){
  var h = '';
  switch(s.t){
    case 'title':
      h = '<div class="kicker">'+s.kicker+'</div><h1>'+s.h1+'</h1><hr class="rule"><p class="lead">'+s.lead+'</p><p class="present">'+s.present+'</p>'; break;
    case 'part':
      h = '<div class="kicker">'+s.kicker+'</div><h1>'+s.h1+'</h1><hr class="rule"><p class="lead">'+s.lead+'</p>'; break;
    case 'bullets':
      h = '<div class="kicker">'+s.kicker+'</div><h2>'+s.h2+'</h2>'+li(s.bullets); break;
    case 'twople':
      h = '<div class="kicker">'+s.kicker+'</div><h2>'+s.h2+'</h2>'+(s.lead?'<p class="lead">'+s.lead+'</p>':'')+(s.sub?'<p class="sub">'+s.sub+'</p>':''); break;
    case 'step':
      h = '<div class="kicker">'+s.kicker+'</div><div class="step"><div class="num">'+s.num+'</div><div class="step-b"><b>'+s.title+'</b>'+s.body+'<span>'+s.note+'</span></div></div>'; break;
    case 'panel':
      h = '<div class="kicker">'+s.kicker+'</div><div class="panel"><div class="big">'+s.big+'</div><p class="lead">'+s.lead+'</p></div><p class="sub">'+s.sub+'</p>'; break;
    case 'cta':
      h = '<div class="kicker">'+s.kicker+'</div><h2>'+s.h2+'</h2><p class="lead">'+s.lead+'</p>'+'<ul class="cta-steps">'+s.steps.map(function(x){var p=x.split('||');return '<li'+(p[1]==='amber'?' class="amber"':'')+'>'+p[0]+'</li>';}).join('')+'</ul>'+'<p class="disc">'+s.disc+'</p>'; break;
  }
  return h + foot(i);
}

var cur = 0;
function render(){
  var d = document.getElementById('deck'); d.innerHTML='';
  S.forEach(function(s,i){
    var el = document.createElement('section');
    el.className = 'slide' + (i===cur?' on':'');
    el.innerHTML = body(s,i);
    d.appendChild(el);
  });
}
function go(n){ cur = Math.max(0, Math.min(S.length-1, cur+n)); render(); }
document.addEventListener('keydown', function(e){ if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); });
render();
</script>
</body>
</html>
