<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Podcast Closing Framework — Jamie Atkinson &amp; Brittany Chetyrbok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17121d; --panel:#211829; --rule:#38283f;
    --accent:#ff2f6d; --gold:#f2b53b;
    --ink:#f4eef7; --muted:#b4a6c0;
    --display:'Space Grotesk',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0910;color:var(--ink);font-family:var(--body);line-height:1.5;padding:28px 16px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:16px;padding:52px 48px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;top:0;left:0;width:6px;height:100%;background:var(--accent)}
  .kicker{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.12;margin-bottom:16px}
  .sub{font-size:20px;color:var(--muted);max-width:44ch}
  .body{font-size:19px;margin-top:10px;max-width:56ch;color:var(--ink)}
  ul{margin-top:18px;list-style:none;display:flex;flex-direction:column;gap:12px;max-width:60ch}
  li{position:relative;padding-left:26px;font-size:18px}
  li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .note{margin-top:22px;font-size:13px;color:var(--muted);max-width:58ch;border-top:1px solid var(--rule);padding-top:14px}
  .gold{color:var(--gold)}
  .title-slide h1{font-size:54px}
  .presenter{margin-top:26px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink)}
  .presenter span{display:block;color:var(--muted);font-weight:400;font-size:14px;margin-top:4px}
  .num{position:absolute;top:22px;right:28px;font-family:var(--display);font-size:13px;color:var(--rule)}
  .cta-slide{background:linear-gradient(140deg,#241829,#17121d)}
  .onair{position:absolute;top:26px;right:30px;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:5px 12px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A Live Masterclass',
   h:'The Podcast Closing Framework',
   sub:'How to turn a small, targeted podcast into a steady stream of high-ticket clients, without chasing downloads.',
   presenter:'Jamie Atkinson & Brittany Chetyrbok',
   presenterSub:'Podcast Rebels'},

  {t:'slide', kicker:'Who this is for',
   h:'If a podcast is supposed to grow your business, not just your download count',
   body:'This is for coaches, consultants, course-creators and experts who have a show (or are about to start one) and want it to actually bring in premium clients.',
   bullets:['You sell a high-ticket program, not a cheap product','You would rather have 200 of the right listeners than 20,000 of the wrong ones','You are tired of being told to post everywhere and go viral']},

  {t:'slide', kicker:'The trap',
   h:'You were told to grow the audience first, and the money would follow',
   body:'So you chased downloads, rankings, and reach. You posted clips on every platform. And the show became another content treadmill that takes hours and pays almost nothing.'},

  {t:'slide', kicker:'The reframe',
   h:'Downloads do not pay you. Conversations do.',
   body:'A small show built to start the right conversations will out-earn a big show built for applause. The goal was never a bigger audience. It was a room full of the right buyers.',
   note:'Educational framing only. Results depend on your offer, your effort, and your market.'},

  {t:'slide', kicker:'What we will cover',
   h:'The three levers of podcast closing',
   bullets:['Lever one: Position the show for a buyer, not an audience','Lever two: Attract the right people with High Profile Guest Outreach','Lever three: Close high-ticket clients inside the show itself']},

  {t:'slide', kicker:'Part one: the problem',
   h:'The vanity-metrics trap',
   body:'Every podcast tool and guru measures the wrong thing. Downloads, chart position, follower count. None of those are clients. Optimizing for them is optimizing for a number that never shows up in your bank account.'},

  {t:'slide', kicker:'Part one: the problem',
   h:'Why it keeps coaches stuck',
   body:'When the show is built for reach, every episode is aimed at the most people possible. That means the broadest, shallowest topics, which attract browsers, not buyers. The bigger it gets, the less it sells.'},

  {t:'slide', kicker:'Part two: the framework',
   h:'The Podcast Closing Framework',
   body:'Instead of a show built to be heard, you build a show engineered to close. Three levers, in order.',
   bullets:['Position','Attract','Close']},

  {t:'slide', kicker:'Lever one: Position',
   h:'Build the show for one buyer',
   body:'Niche clarity and show positioning come first. You pick the exact person you want as a client and build every episode around the decisions they are trying to make. The audience gets smaller and the pipeline gets stronger.'},

  {t:'slide', kicker:'Lever two: Attract',
   h:'High Profile Guest Outreach',
   body:'The fastest way to fill a targeted show is to invite the people your buyers already trust. A dream-guest strategy turns interviews into relationships, referral partners, and warm introductions, not just content.'},

  {t:'slide', kicker:'Lever three: Close',
   h:'Close inside the show',
   body:'This is the part almost no one teaches. The episode itself does the selling. With the right structure and closing conversations, a listener goes from stranger to booked call without a single cold pitch.',
   note:'The method is the teaching. Your enrollment numbers depend on your own offer and follow-up.'},

  {t:'slide', kicker:'The build',
   h:'From idea to income-producing show in 28 days',
   body:'You do not grow this for years. The 28-day build stages it: niche clarity, then positioning, then launch, then monetization. A profitable small show is engineered in weeks, not grown by luck.'},

  {t:'slide', kicker:'Part three: in practice',
   h:'What a closing show looks like',
   body:'A short, sharp episode. A clear buyer. A guest your buyer admires. A natural invitation to go deeper. The show is small, the calendar is full, and the downloads stopped being the point a long time ago.'},

  {t:'slide', kicker:'Why learn this from us',
   h:'We built multiple businesses this exact way',
   body:'Jamie is a top-ranked podcaster who has built six and seven-figure businesses on the back of small, targeted shows, and Brittany co-hosts 6 Figure Podcast Rebels. The Podcast Closing Framework is the system we use ourselves.'},

  {t:'slide', kicker:'The common objection',
   h:'"But my audience is too small"',
   body:'Good. A small audience is the advantage, not the problem. It is cheaper to build, faster to position, and easier to fill with the exact buyers you want. Small and targeted beats big and broad every time.'},

  {t:'slide', kicker:'Recap',
   h:'The three levers, one more time',
   bullets:['Position the show for a single buyer','Attract them with High Profile Guest Outreach','Close them inside the show with podcast closing']},

  {t:'cta', kicker:'Your next step',
   h:'Build your closing show with us',
   body:'If you want the full Podcast Closing Framework, the 28-day build, and the closing scripts, the 28 Day Podcast Profit LAB is where we walk you through all of it, step by step.',
   bullets:['Join the 28 Day Podcast Profit LAB','Start positioning your show for buyers this week'],
   note:'Educational content only. This masterclass is not a guarantee of income or results. Outcomes vary and depend on your offer, your market, and your effort.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta-slide':'');
  let html = '';
  if(s.t==='title'){ html += '<div class="onair">ON AIR</div>'; }
  else { html += '<div class="num">'+(i+1)+' / '+S.length+'</div>'; }
  if(s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if(s.h) html += (s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if(s.body) html += '<p class="body">'+s.body+'</p>';
  if(s.bullets){ html += '<ul>'; s.bullets.forEach(b=> html += '<li>'+b+'</li>'); html += '</ul>'; }
  if(s.presenter) html += '<div class="presenter">'+s.presenter+'<span>'+(s.presenterSub||'')+'</span></div>';
  if(s.note) html += '<div class="note">'+s.note+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
