<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Discovery, Strategy, Implementation Masterclass &middot; Jamie Leos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1a1a22; --panel:#403f51; --rule:#55536b;
    --coral:#d87c7c; --violet:#504d7e; --ink:#f3ece8; --dim:#b7b2c2; --faint:#7d7889;
  }
  html,body{height:100%}
  body{background:#0e0e13;font-family:'Hanken Grotesk',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e0e13}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--coral);margin-bottom:2.4vh}
  h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.3vw}
  .t-normal h1{font-size:3vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--dim);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.7vw;color:var(--dim);margin-top:3.2vh;max-width:78%;line-height:1.48;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-size:1.4vw;font-weight:600;color:var(--coral);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.1vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--coral),var(--violet),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#2c2a3d 0%,#141319 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3vw;max-width:80%;font-style:italic;color:#f7f2ee;font-weight:400}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#332f47 0%,#0e0e13 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.5vw;max-width:82%;color:#f7f2ee}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--coral);color:#f0d3d3;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--faint);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#8f8a9c}
  .t-title .disc,.t-normal .disc{text-align:left}
  .arrow-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-arrow{right:7%;bottom:9%;width:19vw}
  .corner-arrow{right:6%;bottom:7.5%;width:8vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--dim);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--coral);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--coral);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--faint);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--faint);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5vw}.t-cta h1{font-size:6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Discovery &middot; Strategy &middot; Implementation</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- three-node arrow motif (Discovery -> Strategy -> Implementation) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arrow3" viewBox="0 0 260 120">
  <g fill="none" stroke-width="2.4" stroke-linecap="round">
    <circle cx="24" cy="90" r="7" fill="#d87c7c" stroke="none"/>
    <path d="M24 90 C 70 90, 70 60, 116 60" stroke="#d87c7c" opacity="0.85"/>
    <circle cx="116" cy="60" r="7" fill="#504d7e" stroke="none"/>
    <path d="M116 60 C 162 60, 162 30, 208 30" stroke="#504d7e" opacity="0.85"/>
    <circle cx="208" cy="30" r="7" fill="#f3ece8" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Discovery, Strategy, Implementation Masterclass',sub:'What specialty practices actually need to grow: leaders who communicate, financial numbers you can trust, and a growth plan your team can execute without you carrying all of it.',brand:true,arrow:'title'},
 {t:'normal',k:'Who this is for',title:'Oral surgeons growing case volume faster than their leadership team or their numbers can keep up.',body:'Clinically excellent, operationally stretched. The surgery calendar keeps filling. The leadership team, the billing data, and the growth plan behind it were never built to match that pace.'},
 {t:'normal',k:'What you’ll walk away with',title:'A clear, honest read on where specialty-practice growth actually breaks.',body:'The same three areas Jamie works with oral surgery, plastic surgery, and med spa owners on every week: leadership, revenue-cycle financial strategy, and growth planning.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'Every practice, team, and market is different. What matters is which of these three areas is actually holding yours back.',disc:'Educational content. Nothing here is a promise of income, patient volume, or business results. Results vary and no outcome is guaranteed.'},
 {t:'normal',k:'Who’s teaching this',title:'Jamie Leos. Specialty Medical Practice Consultant.',body:'Works hands-on with oral surgeons, plastic surgeons, and medical spas on leadership development, financial clarity, and team synergy. 2026 speaker at SOMSA on referral-partner relationship strategy.'},

 {t:'section',idx:'Part One',title:'Leadership Team Development'},
 {t:'normal',k:'Where it actually breaks',title:'Clinical excellence doesn’t automatically produce a leadership team.',body:'A surgeon can run a flawless OR and still have a front desk, a treatment coordinator, and an office manager who have never once been taught to run the business side as a team.'},
 {t:'normal',k:'What most practices try first',title:'Hiring more, not developing who’s already there.',body:'The instinct is to add headcount. The actual fix is elevating communication and building a culture of accountability among the team already in the building.'},
 {t:'dark',title:'A practice that grows its case volume without growing its leaders is scaling a bottleneck, not a business.'},
 {t:'normal',k:'The real cost',title:'Without trust and synergy across the team, growth just multiplies the friction.',body:'More patients on a leadership structure that was never built to hold them shows up as missed handoffs, burned-out staff, and a surgeon fielding problems that a real leadership team should absorb.'},

 {t:'section',idx:'Part Two',title:'Revenue Cycle Financial Strategy'},
 {t:'normal',k:'The tension',title:'Most owners are excellent surgeons and reluctant financial analysts.',body:'Billing complexity in a specialty surgical practice compounds fast: coding, payer mix, and collections data pile up faster than most owners have time to translate into a decision.'},
 {t:'normal',k:'The real skill',title:'Translating complex data into a decision you can actually make.',body:'Not more reports. Actionable insight: which part of the revenue cycle is leaking, what to optimize first, and the confidence to make the call.'},
 {t:'dark',title:'The practices that grow profitably are the ones that can see their numbers clearly, not the ones that just see more patients.'},

 {t:'section',idx:'Part Three',title:'Practice Growth Strategic Planning'},
 {t:'normal',k:'The shift',title:'A roadmap, not a hunch.',body:'Expanding services, improving the patient experience, and strengthening operations are three different levers. Most practices pull one without checking what it does to the other two.'},
 {t:'normal',k:'What that looks like',title:'A clear plan that ties leadership, financial strategy, and growth together.',body:'Not a growth plan that ignores the team executing it or the numbers funding it. One plan, built to hold all three at once.'},
 {t:'dark',title:'Growth without a plan across leadership, financials, and operations is just faster chaos.'},

 {t:'section',idx:'How it comes together',title:'The Engagement Arc'},
 {t:'normal',k:'How it actually runs',title:'Discovery. Strategy. Implementation.',body:'Discovery explores your leadership dynamics, financial landscape, and cultural challenges. Strategy designs a plan aligning leadership growth, financial insight, and team engagement. Implementation is hands-on support building the culture that holds it.',arrow:'corner'},
 {t:'cta',title:'Build the leadership, the numbers, and the growth plan your practice needs.',chips:['Download the RCM guide','Get in touch'],disc:'Educational content only. No income, patient-volume, or business result is guaranteed. Results vary by practice and market.'},
];

const deck=document.getElementById('deck');
function arrowMotif(kind){return `<svg class="arrow-motif ${kind==='title'?'title-arrow':'corner-arrow'}"><use href="#arrow3"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Discovery &middot; Strategy &middot; <b>Implementation</b> &middot; Jamie Leos Consulting</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arrow) h+=arrowMotif(s.arrow);
  else if(s.t==='title') h+=arrowMotif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
