<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lazy Entrepreneur: How to Build an Agency That Runs Without You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#fff9f3;
    --panel:#f6e7dd;
    --ink:#302f32;
    --ink-soft:#5a5155;
    --rule:#e7d3c6;
    --accent:#a9461b;
  }
  html,body{height:100%;}
  body{
    font-family:'Poppins',-apple-system,sans-serif;
    background:var(--ink);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden;}
  .slide{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;justify-content:center;
    padding:9vh 10vw;
    background:var(--bg);
  }
  .slide.active{display:flex;}
  .slide.part{background:var(--accent);color:var(--bg);}
  .slide.title{background:var(--panel);}
  .eyebrow{font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:28px;}
  .slide.part .eyebrow{color:var(--bg);opacity:.85;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,76px);line-height:1.04;letter-spacing:-.01em;color:var(--ink);}
  .slide.title h1{font-size:clamp(38px,7vw,88px);}
  h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(30px,5vw,60px);line-height:1.1;color:var(--ink);}
  .slide.part h2{color:var(--bg);font-size:clamp(34px,6vw,72px);}
  .sub{font-size:clamp(18px,2.2vw,27px);font-weight:300;color:var(--ink-soft);margin-top:28px;max-width:40ch;line-height:1.5;}
  .slide.part .sub{color:var(--bg);opacity:.9;}
  .lede{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(26px,3.6vw,46px);line-height:1.2;color:var(--ink);max-width:22ch;}
  .promise{font-size:clamp(17px,2vw,24px);font-weight:400;color:var(--ink-soft);margin-top:26px;max-width:40ch;}
  ul{list-style:none;margin-top:30px;}
  li{font-size:clamp(17px,2.1vw,26px);font-weight:400;color:var(--ink);padding:14px 0;border-top:1px solid var(--rule);display:flex;gap:16px;align-items:baseline;}
  li:last-child{border-bottom:1px solid var(--rule);}
  li .n{font-family:'Fraunces',serif;color:var(--accent);font-weight:600;font-size:.9em;min-width:1.4em;}
  .fw{display:flex;flex-direction:column;gap:10px;margin-top:24px;max-width:34ch;}
  .fw .name{font-family:'Fraunces',serif;font-size:clamp(24px,3vw,40px);font-weight:600;color:var(--accent);}
  .disc{font-size:13px;color:var(--ink-soft);margin-top:40px;max-width:52ch;line-height:1.5;opacity:.85;}
  .cta-line{font-size:clamp(18px,2.2vw,28px);color:var(--ink-soft);margin-top:24px;}
  .nav{position:fixed;bottom:18px;right:24px;font-size:12px;color:var(--ink-soft);font-weight:500;letter-spacing:.05em;z-index:10;background:rgba(255,249,243,.8);padding:6px 12px;border-radius:20px;}
  .slide.part .nav{color:var(--bg);}
  .brandmark{position:fixed;bottom:18px;left:24px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;z-index:10;}
</style>
</head>
<body>
<div id="deck"></div>
<div class="brandmark">The Lazy Entrepreneur</div>
<div class="nav" id="nav"></div>
<script>
const S = [
  {t:'title', cls:'title', eyebrow:'A live masterclass with Kristy Yoder', h1:'How to Build an Agency That Runs Without You', promise:'The Lazy Entrepreneur method for getting out of the daily weeds, without the business falling apart.'},
  {t:'point', eyebrow:'Who this is for', h2:'You built the agency. Now it cannot move without you.', sub:'For agency owners (VA, marketing, creative, staffing) who hired the team and are still in every approval, every fire, every decision.'},
  {t:'point', eyebrow:'The trap', lede:'You hired more people to get your time back. You got more messages instead.', promise:'Every new hire added one more person who needs you to sign off. The busier you got, the more the agency depended on you.'},
  {t:'reframe', cls:'part', eyebrow:'The reframe', h2:'Founder dependency is not a staffing problem. It is a leadership problem.'},
  {t:'part', cls:'part', eyebrow:'Part One', h2:'Why more people never fixed it'},
  {t:'point', eyebrow:'The real ceiling', h2:'If every decision routes through you, you are the ceiling.', sub:'The agency can only grow as fast as you can answer. More team under a bottleneck just means a bigger line outside your door.'},
  {t:'point', eyebrow:'The honest reason', lede:'You cannot delegate chaos.', promise:'When the work only lives in your head, handing it off feels slower than doing it yourself. So you take it back, and the dependency hardens.'},
  {t:'part', cls:'part', eyebrow:'Part Two', h2:'The Three-Part Model'},
  {t:'point', eyebrow:'My core framework', h2:'Businesses get healthier when their leaders get healthier.', sub:'So we work three things at once, not just the org chart. Fix one and leave the others and the owner stays the bottleneck.'},
  {t:'fw', eyebrow:'Part Two of three', name:'1. The Business', lede:'Systems before delegation.', promise:'Document and systematize the work into repeatable processes first, then hand those processes to the team, so what you delegate actually sticks.'},
  {t:'fw', eyebrow:'Part Two of three', name:'2. The Leader', lede:'Build a team that owns outcomes.', promise:'Decisions, communication, and trust, so people solve problems without routing every call back to you. You coach outcomes, not tasks.'},
  {t:'fw', eyebrow:'Part Two of three', name:'3. The Person', lede:'Your worth is not your productivity.', promise:'Identity, boundaries, and a life beyond the work. The owner who believes they must be needed will always rebuild the bottleneck.'},
  {t:'part', cls:'part', eyebrow:'Part Three', h2:'When the agency no longer needs you'},
  {t:'point', eyebrow:'Your week', h2:'A calendar that is not wall-to-wall approvals.', sub:'The recurring approvals, check-ins, and fire drills become the team's, on systems you built, so your time goes to the few decisions only you should make.'},
  {t:'list', eyebrow:'The delegation ladder', h2:'What to hand off, in order', items:['The repeatable tasks you have done a hundred times','The decisions with a clear rule you can write down','The outcomes you can measure without watching','What stays yours: vision, key hires, the handful of calls only you can make']},
  {t:'point', eyebrow:'Why me', lede:'I built a virtual-assistant agency to 70-plus people serving 400-plus businesses, then sold it.', promise:'I got out of the weeds the hard way first. I am a certified life and mental-health coach, which is why this method fixes the leader, not just the funnel.'},
  {t:'point', eyebrow:'The whole idea', h2:'Be the lazy entrepreneur on purpose.', sub:'Not lazy about the work. Lazy about being the person everything depends on. That is the business that finally gives you your life back.'},
  {t:'cta', cls:'title', eyebrow:'Your next step', h1:'Build the agency that runs without you.', ctaLine:'If you want help putting the Three-Part Model in place, join the waitlist for my business coaching at kristyyoder.com.', disc:'This masterclass is educational. It shares frameworks and examples, not guarantees. Results depend on your own business, market, and effort. Nothing here is a promise of income or specific outcomes.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide '+(s.cls||'')+(i===0?' active':'');
  let html='';
  if(s.eyebrow)html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1)html+='<h1>'+s.h1+'</h1>';
  if(s.h2)html+='<h2>'+s.h2+'</h2>';
  if(s.lede)html+='<div class="lede">'+s.lede+'</div>';
  if(s.name)html+='<div class="fw"><div class="name">'+s.name+'</div></div>';
  if(s.promise)html+='<div class="promise">'+s.promise+'</div>';
  if(s.sub)html+='<div class="sub">'+s.sub+'</div>';
  if(s.items){html+='<ul>';s.items.forEach((it,j)=>{html+='<li><span class="n">'+(j+1)+'</span><span>'+it+'</span></li>';});html+='</ul>';}
  if(s.ctaLine)html+='<div class="cta-line">'+s.ctaLine+'</div>';
  if(s.disc)html+='<div class="disc">'+s.disc+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
let cur=0;const slides=[...document.querySelectorAll('.slide')];const nav=document.getElementById('nav');
function show(n){slides[cur].classList.remove('active');cur=Math.max(0,Math.min(slides.length-1,n));slides[cur].classList.add('active');nav.textContent=(cur+1)+' / '+slides.length;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
document.addEventListener('click',e=>{show(cur+1);});
nav.textContent='1 / '+slides.length;
</script>
</body>
</html>
