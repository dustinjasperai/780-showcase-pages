<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Strategic Shift — a masterclass with Joanna Parsons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1c0d;        /* dark forest ground, from brand #091405 */
    --panel:#16261a;     /* raised panel */
    --rule:#2c4a34;      /* hairline rule */
    --accent:#e7b53c;    /* warm gold, from brand #fdf733 */
    --ink:#fff9f0;       /* cream type, from brand #fff9f0 */
    --muted:#b7c6b3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 22px 100px}
  .slide{background:linear-gradient(180deg,var(--panel),#12201400);border:1px solid var(--rule);border-radius:18px;padding:52px 48px;margin:0 0 26px;min-height:60vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:48px;top:30px;width:34px;height:3px;background:var(--accent);border-radius:3px}
  .kicker{font-family:"Space Grotesk";font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;font-weight:600}
  h1{font-family:"Syne";font-weight:800;font-size:clamp(34px,6vw,62px);line-height:1.03;letter-spacing:-.01em}
  h2{font-family:"Syne";font-weight:700;font-size:clamp(26px,4vw,42px);line-height:1.08;letter-spacing:-.01em}
  p{font-size:clamp(16px,2vw,20px);line-height:1.55;color:var(--ink);margin-top:18px;max-width:40ch}
  p.lead{color:var(--muted)}
  .big{font-size:clamp(20px,2.6vw,26px);max-width:34ch}
  ul{margin-top:22px;list-style:none;display:grid;gap:14px;max-width:46ch}
  li{position:relative;padding-left:26px;font-size:clamp(16px,2vw,20px);line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;background:var(--accent);border-radius:50%}
  .pillars{display:grid;gap:16px;margin-top:26px;grid-template-columns:1fr}
  .pillar{border:1px solid var(--rule);border-radius:14px;padding:22px 24px;background:#13231666}
  .pillar .n{font-family:"Syne";font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.14em}
  .pillar h3{font-family:"Syne";font-weight:700;font-size:22px;margin:8px 0 6px}
  .pillar p{margin-top:4px;font-size:16px;color:var(--muted);max-width:52ch}
  .quote{font-family:"Syne";font-weight:600;font-size:clamp(22px,3.2vw,34px);line-height:1.2;max-width:24ch}
  .foot{position:absolute;right:30px;bottom:22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6f8470}
  .disc{margin-top:26px;font-size:13px;color:#90a18d;max-width:62ch;line-height:1.5}
  .cta .btn{display:inline-block;margin-top:26px;font-family:"Syne";font-weight:700;font-size:18px;color:var(--bg);background:var(--accent);padding:14px 26px;border-radius:999px;text-decoration:none}
  .who{display:grid;gap:10px;margin-top:22px;max-width:48ch}
  .who div{border-left:3px solid var(--accent);padding:6px 0 6px 16px;color:var(--muted);font-size:17px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:"title", cls:"title", html:`
    <div class="kicker">A live masterclass with Joanna Parsons</div>
    <h1>The Strategic Shift</h1>
    <p class="lead big">How internal communicators move from tactical doer to trusted advisor, without waiting for a bigger team or a bigger budget.</p>
    <div class="foot">The Curious Route</div>`},

  {t:"promise", cls:"reframe", html:`
    <div class="kicker">The promise</div>
    <h2>In the next hour</h2>
    <p>You will leave with a clear method for turning the work you already do into the influence you have been missing, and a way to prove its value that leaders respect.</p>`},

  {t:"who", cls:"who-slide", html:`
    <div class="kicker">Who this is for</div>
    <h2>You are the comms function. Often all of it.</h2>
    <div class="who">
      <div>You run the intranet, the newsletter, the town halls and the leadership messages, frequently as a team of one.</div>
      <div>You are brilliant at delivery, but you are stuck being seen as the person who makes the words look nice.</div>
      <div>You want a seat at the table where the real decisions get made, before they get made.</div>
    </div>`},

  {t:"trap", cls:"trap", html:`
    <div class="kicker">The trap</div>
    <h2>Being busy is not the same as being strategic.</h2>
    <p>The more requests you say yes to, the more you train the business to treat communication as a service desk. You get louder, not more influential. The output goes up and the respect stays flat.</p>`},

  {t:"reframe", cls:"reframe", html:`
    <div class="kicker">The reframe</div>
    <p class="quote">Innovation in internal comms is not a new channel or a new tool. It is a better question.</p>
    <p class="lead">Curiosity is the discipline that turns a comms doer into an advisor leaders actually ask for.</p>`},

  {t:"part", cls:"part", html:`
    <div class="kicker">Part one</div>
    <h2>Why the tactical trap is so sticky</h2>
    <p>Nobody chooses to stay reactive. Three forces keep good communicators stuck in delivery.</p>`},

  {t:"body", cls:"body", html:`
    <div class="kicker">Part one</div>
    <h2>The three forces</h2>
    <ul>
      <li>No baseline. You cannot prove what is working, so every channel survives on habit.</li>
      <li>No evidence. Leaders trust their gut over your judgement, because you have not shown them the data.</li>
      <li>No room to think. Every hour goes to the next ask, so the strategic work never starts.</li>
    </ul>`},

  {t:"body", cls:"body", html:`
    <div class="kicker">Part one</div>
    <h2>What the trap costs</h2>
    <ul>
      <li>Your best ideas arrive too late to change anything.</li>
      <li>Good messages fail quietly because nobody checks whether they landed.</li>
      <li>You carry the workload of a department and the standing of a service desk.</li>
    </ul>`},

  {t:"reframe", cls:"reframe", html:`
    <div class="kicker">The principle underneath</div>
    <p class="quote">Put the employee at the front of every decision, and the strategy writes itself.</p>
    <p class="lead">Most comms starts with what the business wants to say. The shift starts with what the employee needs to understand, feel and do.</p>`},

  {t:"part", cls:"part", html:`
    <div class="kicker">Part two</div>
    <h2>The Curious Route: a method, not a mood</h2>
    <p class="lead">Three pillars that move you from reacting to advising. This is the backbone of my book and my work.</p>`},

  {t:"pillars", cls:"pillars-slide", html:`
    <div class="kicker">Part two</div>
    <h2>The three pillars</h2>
    <div class="pillars">
      <div class="pillar"><div class="n">PILLAR 01</div><h3>Innovation as a mindset</h3><p>Stop chasing channels. Start asking sharper questions of the business and its people. Curiosity, applied on purpose, is what surfaces the message that actually matters.</p></div>
      <div class="pillar"><div class="n">PILLAR 02</div><h3>Audit before you act</h3><p>Run the channels-and-content audit first. Know what your people actually read, trust and ignore before you plan a single campaign. You cannot improve what you have never measured.</p></div>
      <div class="pillar"><div class="n">PILLAR 03</div><h3>Measurement and the scientific method</h3><p>Treat communication like a series of experiments. Set a hypothesis, measure impact, and bring leaders evidence instead of opinions. Evidence is what earns the seat at the table.</p></div>
    </div>`},

  {t:"body", cls:"body", html:`
    <div class="kicker">Part two in practice</div>
    <h2>What curiosity looks like on a Tuesday</h2>
    <ul>
      <li>You ask the exec what decision they are trying to influence, not what they want sent.</li>
      <li>You test two versions of the message and report which one changed behaviour.</li>
      <li>You retire the channel nobody reads and defend the choice with your own numbers.</li>
    </ul>`},

  {t:"body", cls:"body", html:`
    <div class="kicker">The audit, in four questions</div>
    <h2>Start every plan here</h2>
    <ul>
      <li>Which channels do people actually open, and which do they only tolerate?</li>
      <li>Where does trust live in this organisation, and is it in your channels?</li>
      <li>What content changes behaviour, and what just fills space?</li>
      <li>If you deleted a channel tomorrow, who would genuinely miss it?</li>
    </ul>`},

  {t:"quote", cls:"quoteslide", html:`
    <div class="kicker">The shift</div>
    <p class="quote">When you bring evidence, you stop asking for permission and start giving counsel.</p>`},

  {t:"part", cls:"part", html:`
    <div class="kicker">Part three</div>
    <h2>What the strategic shift gets you</h2>
    <p>The same role, seen completely differently, inside a quarter.</p>`},

  {t:"body", cls:"body", html:`
    <div class="kicker">Part three</div>
    <h2>Three changes you will feel</h2>
    <ul>
      <li>Leaders bring you in early, while the decision is still being shaped.</li>
      <li>You say no to low-value requests because you can point to what matters more.</li>
      <li>Your work has a number attached to it, so your next budget conversation is easier.</li>
    </ul>`},

  {t:"why", cls:"why", html:`
    <div class="kicker">Why listen to me</div>
    <h2>I built this under real pressure.</h2>
    <p>I was the first Head of Internal Communications in the 100-year history of An Garda Siochana, Ireland's national police service, and I led its internal communication through the Covid-19 pandemic. Calm, creative, evidence-led communication kept people safe when it mattered most.</p>
    <p class="lead">I am an IoIC Fellow and the author of Innovative Internal Communication, published by Kogan Page. The Curious Route is where I teach the method.</p>`},

  {t:"recap", cls:"reframe", html:`
    <div class="kicker">The route in one line</div>
    <p class="quote">Get curious, run the audit, prove the impact. Do that on repeat and the advisor role is yours.</p>`},

  {t:"cta", cls:"cta", html:`
    <div class="kicker">Your next step</div>
    <h2>Keep going with The Curious Tribe.</h2>
    <p>The Curious Tribe is my membership for ambitious internal communicators who want to make the strategic shift with support, live coaching and a library of the tools I use. If today was useful, this is where the work continues.</p>
    <a class="btn" href="https://www.thecuriousroute.com/thecurioustribe">Explore The Curious Tribe</a>
    <p class="disc">Educational session only. This masterclass shares a method and professional judgement; it is not a promise of a specific career, role, pay or business outcome. No result is guaranteed and individual results vary. Any examples are illustrative of the approach, not a forecast of your results.</p>
    <div class="foot">The Curious Route</div>`}
];
const root = document.getElementById("deck");
for(const s of S){
  const sec = document.createElement("section");
  sec.className = "slide " + (s.cls||"");
  sec.innerHTML = s.html;
  root.appendChild(sec);
}
</script>
</body>
</html>
