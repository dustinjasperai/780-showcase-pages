<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fractional Pricing Shift — Natalie Hoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f0;        /* her site is light-scheme */
    --panel:#eae5db;     /* warm stone */
    --rule:#d8d2c6;
    --ink:#1c1c1c;       /* near-black, from brand.json */
    --muted:#5c5a53;
    --accent:#1a3d35;    /* her dominant brand hex (rgb 26,61,53) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;align-items:center;padding:48px 20px 90px}
  .slide{
    width:min(960px,100%);background:var(--bg);border:1px solid var(--rule);
    border-radius:4px;padding:66px 64px;margin:0 0 26px;min-height:540px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .slide::before{content:"";position:absolute;left:64px;top:46px;width:46px;height:3px;background:var(--accent)}
  .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:"Playfair Display",serif;font-weight:700;font-size:54px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:"Playfair Display",serif;font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  .lede{font-size:21px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:62ch}
  p.body{font-size:19px;line-height:1.6;margin-top:18px;max-width:64ch}
  .kicker{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .part{font-family:"Playfair Display",serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:16px}
  li{font-size:19px;line-height:1.45;padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:1px}
  .pillar{font-family:"Playfair Display",serif;font-size:15px;color:var(--accent);font-weight:700;letter-spacing:.06em}
  .stat-row{display:flex;gap:40px;flex-wrap:wrap;margin-top:30px}
  .stat{min-width:180px}
  .stat .n{font-family:"Playfair Display",serif;font-size:46px;color:var(--accent);font-weight:700;line-height:1}
  .stat .l{font-size:15px;color:var(--muted);margin-top:8px;max-width:22ch}
  .quote{font-family:"Playfair Display",serif;font-size:30px;line-height:1.3;font-style:italic;max-width:27ch}
  .panel{background:var(--panel);border-radius:4px;padding:30px 34px;margin-top:26px}
  .cta-steps{display:flex;flex-direction:column;gap:14px;margin-top:24px}
  .cta-steps div{font-size:19px;padding-left:34px;position:relative}
  .cta-steps div span{position:absolute;left:0;top:-1px;font-family:"Playfair Display",serif;color:var(--accent);font-weight:700;font-size:22px}
  .disclaimer{font-size:13px;color:var(--muted);line-height:1.5;margin-top:34px;max-width:70ch;border-top:1px solid var(--rule);padding-top:18px}
  .foot{position:absolute;right:28px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .brand{position:absolute;left:64px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  @media(max-width:620px){.slide{padding:48px 26px}.slide::before{left:26px}h1{font-size:38px}h2{font-size:30px}.brand{left:26px}}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass for fractional leaders', h:'The Fractional Pricing Shift',
    sub:'How to stop pricing from fear and start charging for the outcome you create, so your practice pays you like the owner you now are.' },

  {t:'content', eyebrow:'Who this is for', h:'You were a great operator. Now you are a business.',
    body:[
      'You spent fifteen years as the person leadership trusted to fix the hard things. You went fractional because you wanted the work on your terms. The skills came with you. The way you value them did not.',
      'This hour is for Directors, VPs, and senior operators who have clients but still feel like they are guessing at what to charge.'
    ] },

  {t:'content', eyebrow:'The trap', h:'The fast yes feels great. It should scare you.',
    body:[
      'You send the proposal. They say yes in four minutes. For a second it feels like a win.',
      'A yes that fast almost always means one thing: you left money on the table, and the client already knew it.'
    ] },

  {t:'title', eyebrow:'The hard truth', h:'Pricing from fear is the most expensive mistake you will make.',
    sub:'Not a bad client. Not a slow month. The number you talk yourself down to before the call even starts.' },

  {t:'section', part:'Part One', h:'The problem is not your rate. It is who you think you are.' },

  {t:'content', eyebrow:'The identity you did not pack', h:'You left the job. The employee came with you.',
    body:[
      'An employee trades hours for a salary someone else decides. An owner sets a price against the value they create. You changed your title. The belief underneath it did not move.',
      'So you price like someone waiting to be told the number is fair.'
    ] },

  {t:'quote', eyebrow:'Why tactics have not fixed it',
    q:'Until you name the beliefs and change them, every framework, every tactic, and every strategy will feel like pushing water uphill.',
    body:['This is why the pricing templates you downloaded did not stick. The limiting belief was never on the page. It was in the hand that typed the number.'] },

  {t:'section', part:'Part Two', h:'The four pillars of a practice that pays you like an owner.',
    body:['We do not skip the hard parts. We do not skip identity. We do not skip pricing. You leave with a business, not just insight.'] },

  {t:'pillar', pillar:'Pillar One', h:'Mindset: from employee to owner',
    body:['We name the specific beliefs driving your pricing and your boundaries, and we change them first. Everything downstream, the rate, the scope, the way you hold a room, moves once this does.'] },

  {t:'pillar', pillar:'Pillar Two', h:'Positioning: hired for an outcome, not a title',
    body:['A generic fractional COO competes on day rate. A leader positioned around a specific, expensive problem competes on results. We make you the obvious answer to one clear outcome, so the conversation stops being about hours.'] },

  {t:'pillar', pillar:'Pillar Three', h:'Pricing: the value of the outcome is the anchor',
    body:['Your price is not your hours and it is not your comfort. It is what the result is worth to the client.'],
    panel:'A fractional COO who helps a founder recover five hundred thousand dollars in past due receivables is not worth five thousand dollars a month. The value of the outcome is the anchor. Your discomfort is not.' },

  {t:'content', eyebrow:'The number you build toward', h:'The Enough Number',
    body:['Most fractionals price one proposal at a time and hope it adds up. We work backward from the revenue your practice is actually built to hit, the number that funds the life you went fractional for, and let that set your scope, your boundaries, and your rate.'] },

  {t:'list', pillar:'Pillar Four', h:'Go to market: a ninety day entry plan',
    items:[
      'A positioning you can say in one sentence and repeat everywhere',
      'A referral network that sends the right clients, not any client',
      'A portfolio built on purpose, so you are not starting from zero each quarter'
    ] },

  {t:'section', part:'Part Three', h:'What changes when you price like an owner.' },

  {t:'list', eyebrow:'When the shift lands',
    items:[
      'You stop quoting the number that will not scare anyone, including you',
      'You name the outcome first, then the price, and you hold it',
      'A slow yes becomes a sign you priced it right, not a reason to panic',
      'Your calendar fills with the clients your positioning was built to attract'
    ] },

  {t:'stat', eyebrow:'Why learn this from me', h:'I underpriced first. Then I built the method.',
    body:['I was laid off in January 2023 and took my first fractional role for far less than it was worth. I know the fear because I priced from it. Then I did the work I now teach.'],
    stats:[
      { n:'238%', l:'sales increase I drove for a client in thirty days' },
      { n:'68 pts', l:'gross margin improvement in four months' },
      { n:'100+', l:'fractional leaders coached through this shift' }
    ] },

  {t:'quote', eyebrow:'The whole shift in one line',
    q:'Price to the value of the outcome. Think like the owner you already are.' },

  {t:'cta', eyebrow:'Your next step', h:'Build the practice, not just the insight.',
    body:['If you want to do this work together, here is how it goes:'],
    steps:[
      'Apply to work with me at nataliehoop.com',
      'We map your pricing, positioning, and the Enough Number together',
      'You leave with a real business built around your life, not a binder of tips'
    ],
    disclaimer:'This masterclass is educational. It shares the method I use with coaching clients. It is not a promise of income or results. Outcomes depend on your market, your offer, and the work you put in. Figures shared are from my own client engagements and are illustrative, not a guarantee of what any practice will earn.' }
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.eyebrow) html += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if (s.part)    html += `<div class="part">${esc(s.part)}</div>`;
  if (s.pillar)  html += `<div class="pillar">${esc(s.pillar)}</div>`;
  if (s.t === 'title') {
    html += `<h1>${esc(s.h)}</h1>`;
    if (s.sub) html += `<p class="lede">${esc(s.sub)}</p>`;
  } else if (s.t === 'quote') {
    html += `<div class="quote">${esc(s.q)}</div>`;
  } else if (s.h) {
    html += `<h2${(s.part||s.pillar)?' style="margin-top:12px"':''}>${esc(s.h)}</h2>`;
  }
  if (s.body) s.body.forEach(p => html += `<p class="body">${esc(p)}</p>`);
  if (s.panel) html += `<div class="panel"><p class="body" style="margin-top:0">${esc(s.panel)}</p></div>`;
  if (s.items) html += '<ul>' + s.items.map(it => `<li>${esc(it)}</li>`).join('') + '</ul>';
  if (s.stats) html += '<div class="stat-row">' + s.stats.map(x => `<div class="stat"><div class="n">${esc(x.n)}</div><div class="l">${esc(x.l)}</div></div>`).join('') + '</div>';
  if (s.steps) html += '<div class="cta-steps">' + s.steps.map((st, n) => `<div><span>${n+1}.</span> ${esc(st)}</div>`).join('') + '</div>';
  if (s.disclaimer) html += `<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  html += `<div class="brand">Natalie Hoop</div><div class="foot">${String(i+1).padStart(2,'0')}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
