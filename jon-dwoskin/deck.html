<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell With Clarity, Courage, Confidence &amp; Consistency | Jon Dwoskin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#fdfcf9; --panel:#ffffff; --ink:#1c1a17; --ink-soft:#4a463f;
    --ink-muted:#857f74; --rule:#e5e2db; --accent:#ff6600; --charcoal:#262320;
  }
  html,body{height:100%;}
  body{ font-family:'Open Sans',-apple-system,sans-serif; background:var(--charcoal);
    color:var(--ink); display:flex; align-items:center; justify-content:center; }
  #stage{ width:100%; max-width:960px; aspect-ratio:16/9; background:var(--bg);
    position:relative; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .slide{ position:absolute; inset:0; padding:64px 72px; display:none;
    flex-direction:column; }
  .slide.on{ display:flex; }
  .kicker{ font-family:'Open Sans',sans-serif; font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:.16em; color:var(--accent); margin-bottom:18px; }
  h1{ font-family:'Bitter',Georgia,serif; font-weight:700; font-size:46px;
    line-height:1.1; color:var(--ink); letter-spacing:-.01em; }
  h2{ font-family:'Bitter',Georgia,serif; font-weight:700; font-size:34px;
    line-height:1.14; color:var(--ink); margin-bottom:18px; }
  .sub{ font-size:21px; color:var(--ink-soft); margin-top:22px; line-height:1.5; max-width:40ch; }
  p{ font-size:19px; color:var(--ink-soft); line-height:1.55; max-width:46ch; margin-bottom:14px; }
  .big{ font-family:'Bitter',Georgia,serif; font-weight:600; font-size:30px;
    line-height:1.25; color:var(--ink); max-width:34ch; }
  .accent{ color:var(--accent); }
  ul{ list-style:none; margin-top:6px; }
  li{ font-size:19px; color:var(--ink-soft); line-height:1.5; padding-left:26px;
    position:relative; margin-bottom:12px; max-width:44ch; }
  li::before{ content:""; position:absolute; left:0; top:11px; width:9px; height:9px;
    background:var(--accent); border-radius:2px; }
  .part-num{ font-family:'Bitter',serif; font-weight:700; font-size:15px; color:var(--accent);
    letter-spacing:.1em; text-transform:uppercase; }
  .foot{ margin-top:auto; font-family:'Open Sans',sans-serif; font-size:13px;
    color:var(--ink-muted); display:flex; justify-content:space-between; align-items:center;
    padding-top:20px; border-top:1px solid var(--rule); }
  .disc{ font-size:12px; color:var(--ink-muted); margin-top:16px; max-width:56ch; line-height:1.5; }
  .cgrid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 28px; margin-top:8px; }
  .ccard{ border-left:3px solid var(--accent); padding:4px 0 4px 16px; }
  .ccard b{ font-family:'Bitter',serif; font-size:21px; color:var(--ink); display:block; }
  .ccard span{ font-size:16px; color:var(--ink-soft); }
  .step{ font-size:18px; color:var(--ink-soft); margin-bottom:10px; }
  .step b{ font-family:'Bitter',serif; color:var(--ink); }
  .nav{ position:fixed; bottom:18px; right:24px; font-family:'Open Sans',sans-serif;
    font-size:13px; color:#cfc9bd; }
  .title-wrap{ justify-content:center; }
  @media (max-width:720px){ .slide{ padding:36px 32px; } h1{ font-size:32px; } h2{ font-size:26px; } .big{ font-size:23px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><span id="pos">1</span> / <span id="tot"></span> &nbsp;&middot;&nbsp; use arrow keys</div>
<script>
const S = [
  {t:'title', k:'A Think Big masterclass with Jon Dwoskin', h:'Sell With Clarity, Courage, Confidence &amp; Consistency', s:'How successful-but-stuck sellers and owners get unstuck and grow, one measured step at a time.'},
  {t:'body', k:'Who this is for', h:'You are good. You are also stuck.', b:['Owners, managers and reps who already win, but whose numbers have gone flat.','You are busy. The pipeline looks full. Revenue has stopped moving.','This is for the seller who is successful, and quietly stuck.']},
  {t:'big', k:'The trap', big:'You add more activity, more hustle, more hours. The line on the chart does not move. So you add more. That is the trap.'},
  {t:'big', k:'The reframe', big:'It is not a motivation problem. It is a clarity problem. <span class="accent">Everything is sales, and sales is everything.</span>'},
  {t:'part', num:'Part One', h:'The core problem', s:'Why working harder stopped working.'},
  {t:'body', k:'The core problem', h:'You are trying to fix all of it at once.', b:['Faced with the whole gap, most sellers freeze or scatter.','Growth does not hide in a total overhaul. It hides in the next 0.1%.','Pick the one next measured step. Take it. Then the next one.']},
  {t:'big', k:'The discovery lens', big:'My job is to see what is not being seen, hear what is not being heard, and ask the question nobody is asking. The blind spot is where the growth is.'},
  {t:'part', num:'Part Two', h:'The 4 C’s of Selling', s:'The spine of every conversation that closes.'},
  {t:'cards', k:'The 4 C’s', h:'Clarity, Courage, Confidence, Consistency', cards:[['Clarity','A clear pitch, a clear message, one clear next step. If they are confused, they do not buy.'],['Courage','Ask for the business. Make the call. Follow up again when it is uncomfortable.'],['Confidence','Lead the conversation. Meet the objection. Close without flinching.'],['Consistency','Daily systems and accountability. The small reps compound into the number.']]},
  {t:'body', k:'How they stack', h:'Each C fails without the one before it.', b:['Courage without Clarity is noise. You ask, but for the wrong thing.','Confidence without Courage never gets tested. You stay comfortable.','Consistency is what turns the other three into a result you can predict.']},
  {t:'part', num:'Part Three', h:'Running the 4 C’s every week', s:'The rhythm that makes it stick.'},
  {t:'steps', k:'The cadence', h:'Deep dive, then rhythm, then daily reps', steps:[['90-minute deep dive','We find the one blind spot and the next 0.1%, not forty things to fix.'],['Weekly rhythm','Short, focused sessions. One measured step taken every single week.'],['Daily support','A quick text or call when it counts, so momentum never stalls.']]},
  {t:'body', k:'A week running the 4 C’s', h:'Small, boring, relentless.', b:['Monday: clarify the one offer and the one message you lead with.','Midweek: the courage reps, the follow-ups you have been avoiding.','Friday: review the leading activity, not just the closed revenue.']},
  {t:'why', k:'Why me', h:'I have carried the number.', b:['Negotiated the sale of nearly 5,000 units worth about $250 million at Marcus &amp; Millichap.','Ran a region of 45 agents and roughly $4 billion in transactions.','Crain’s 40 Under 40. Author of The Think Big Movement. Host of Coffee with Jon, ranked top 1% globally.']},
  {t:'big', k:'The recap', big:'Get unstuck. Think Big. Grow by the next 0.1%, with Clarity, Courage, Confidence and Consistency.'},
  {t:'cta', k:'Your next step', h:'Ready to get unstuck and Think Big?', b:['Bring me your flat number and your busiest week.','We find the one blind spot and the next measured step together.','Book a Think Big deep dive and let us get it moving.'], disc:'Educational content only. No income, revenue, or result is guaranteed. Results vary with your market, effort, and execution.'}
];
const stage=document.getElementById('stage');
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='slide'+(i===0?' on':'')+(s.t==='title'?' title-wrap':'');
    let html='';
    if(s.k) html+='<div class="kicker">'+s.k+'</div>';
    if(s.t==='title'){ html+='<h1>'+s.h+'</h1>'; if(s.s) html+='<div class="sub">'+s.s+'</div>'; }
    else if(s.t==='big'){ html+='<div class="big">'+s.big+'</div>'; }
    else if(s.t==='part'){ html+='<div class="part-num">'+s.num+'</div><h2 style="margin-top:14px">'+s.h+'</h2>'; if(s.s) html+='<p>'+s.s+'</p>'; }
    else if(s.t==='cards'){ html+='<h2>'+s.h+'</h2><div class="cgrid">'+s.cards.map(c=>'<div class="ccard"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>').join('')+'</div>'; }
    else if(s.t==='steps'){ html+='<h2>'+s.h+'</h2>'+s.steps.map(c=>'<div class="step"><b>'+c[0]+'.</b> '+c[1]+'</div>').join(''); }
    else { html+='<h2>'+s.h+'</h2><ul>'+s.b.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
    if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
    html+='<div class="foot"><span>Jon Dwoskin &middot; THINK BIG</span><span>jondwoskin.com</span></div>';
    d.innerHTML=html; stage.appendChild(d);
  });
  document.getElementById('tot').textContent=S.length;
}
let cur=0;
function go(n){ const sl=document.querySelectorAll('.slide'); sl[cur].classList.remove('on'); cur=(n+S.length)%S.length; sl[cur].classList.add('on'); document.getElementById('pos').textContent=cur+1; }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') go(cur+1); if(e.key==='ArrowLeft'||e.key==='ArrowUp') go(cur-1); });
stage.addEventListener('click',()=>go(cur+1));
render();
</script>
</body>
</html>
