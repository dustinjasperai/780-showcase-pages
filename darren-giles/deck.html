<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Double Your Listings and Sales: The Appraisal-to-Settlement System · Darren Giles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f9fc; --panel:#ffffff; --rule:#dbe4ee;
    --acc:#1070b8; --acc2:#2f9e52; --idx:#33475b; --ink:#101820; --grey:#33475b; --dim:#6b7c93;
  }
  html,body{height:100%}
  body{background:#0c1420;font-family:'Source Sans 3',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0c1420}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Merriweather',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.18;letter-spacing:-.005em}
  .t-title h1{font-size:4vw;max-width:88%}
  .t-normal h1{font-size:3vw;max-width:86%}
  .t-normal .body{font-size:1.42vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-size:1.7vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Source Sans 3',sans-serif;font-size:1.32vw;font-weight:700;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#dfeaf6 0%,#c4d6ea 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:84%;font-style:italic;color:#0e1b2b}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#dfeaf6 0%,#c4d6ea 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:var(--acc);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.16vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .funnel-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-funnel{right:7%;bottom:9%;width:24vw}
  .corner-funnel{right:6%;bottom:7.5%;width:11vw;opacity:.55}
  .brandline{font-size:1.26vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.01em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(16,24,32,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">Business Broker Coach</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- four-stage funnel motif: narrowing nodes, appraisal to settlement -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="funnel" viewBox="0 0 260 130">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="16" y1="112" x2="70" y2="112" stroke="#1070B8" opacity="0.85"/>
    <line x1="70" y1="112" x2="70" y2="82" stroke="#1070B8" opacity="0.85"/>
    <line x1="70" y1="82" x2="128" y2="82" stroke="#1070B8" opacity="0.85"/>
    <line x1="128" y1="82" x2="128" y2="52" stroke="#1070B8" opacity="0.85"/>
    <line x1="128" y1="52" x2="186" y2="52" stroke="#1070B8" opacity="0.85"/>
    <line x1="186" y1="52" x2="186" y2="24" stroke="#1070B8" opacity="0.85"/>
    <line x1="186" y1="24" x2="230" y2="24" stroke="#1070B8" opacity="0.85"/>
    <circle cx="230" cy="24" r="6" fill="none" stroke="#2F9E52" stroke-width="2.8"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Double Your Listings and Sales: The Appraisal-to-Settlement System',sub:'A masterclass for business broker principals, brokers, and sales managers.',brand:true,funnel:'title'},
 {t:'normal',k:'Who this is for',title:'Your team takes plenty of appraisals. Not enough of them settle.',body:'You run a brokerage, a sales team, or your own book. Appraisals come in fine. The drop happens somewhere between the appraisal and the cheque, and most principals have never had it broken into stages they can actually coach.'},
 {t:'dark',title:'A ratio nobody is watching is a ratio nobody is improving.'},

 {t:'section',idx:'Part One',title:'Where the Ratio Leaks'},
 {t:'normal',k:'Appraisal to listing',title:'Every appraisal you do not convert to a listing costs you the visit for nothing.',body:'The appraisal itself is not the job. Getting the seller to sign is. A broker who cannot move an appraisal to a signed listing agreement is doing free consulting.'},
 {t:'normal',k:'Listing to sale',title:'A listing that never sells is a listing that never should have been taken this way.',body:'Overpriced, under-marketed, or handed to the wrong buyer pool, a stalled listing burns your time and the seller loses faith in you specifically, not just the market.'},
 {t:'normal',k:'Sale to settlement',title:'A signed contract is a promise, not a result.',body:'Deals fall over between contract and settlement more often than principals like to admit. Finance conditions, due diligence surprises, and a broker not managing the gap all cost you a paid deal at the finish line.'},
 {t:'dark',title:'Four stages. One leak at a time. That is the whole system.'},

 {t:'section',idx:'Part Two',title:'The Four Levers'},
 {t:'normal',k:'Prospecting and scripts',title:'More appraisals convert when the conversation is built, not improvised.',body:'Consistent prospecting habits and sales scripts built for business broking (not general real estate) are what move an appraisal toward a signed listing.'},
 {t:'normal',k:'Marketing and negotiation',title:'A listing sells when it is positioned and negotiated, not just posted.',body:'Marketing that reaches the right buyer pool, paired with negotiation and auction skills built for business sales, is what moves a listing to a signed sale.'},
 {t:'normal',k:'Systemization',title:'Settlement is a systems problem, not a luck problem.',body:'The brokers who settle what they sell run a checklist-driven process from contract to close, so finance conditions and due diligence get managed instead of discovered too late.'},
 {t:'normal',k:'The Fundamental3 Plan',title:'Planning that survives a slow market, not just a good one.',body:'Darren teaches three specific plans under his Planning pillar built for staying profitable through a downturn, not only for growth years. The plan is what keeps a principal coaching the ratio instead of panicking at it.'},
 {t:'dark',title:'The market does not reward brokers for effort. It rewards the ratio.'},

 {t:'section',idx:'Part Three',title:'What a Fixed Ratio Looks Like'},
 {t:'normal',k:'The team this builds',title:'Fewer wasted appraisals, fewer stalled listings, more settlements that stick.',body:'Illustrative example only, not a client result: a broker doing 20 appraisals a month at a 40 percent listing rate, 50 percent sale rate, and 80 percent settlement rate settles about 3 deals. Move each stage 10 points and the same 20 appraisals settle close to double that, with no extra prospecting.'},
 {t:'dark',title:'You do not need more appraisals. You need to keep the ones you already have.'},
 {t:'normal',k:'Why Darren Giles',title:'Thirty years in the industry, seven years built for this exact audience.',body:'Darren has 30-plus years of business and industry experience, 11 of them as a multi-award-winning real estate professional, and founded Real Estate Coaching Hub in 2009. In 2019, after seeing business brokers underserved everywhere else, he launched Business Broker Coach: a coaching, consulting, and sales training organisation built only for practicing business broker principals and their teams.'},

 {t:'section',idx:'Your Next Step',title:'Coach the Ratio With Darren'},
 {t:'normal',k:'How the coaching runs',title:'Three tiers, matched to how much support you want.',body:'Challenge Focused (monthly, on-demand), Leading Broker (fortnightly), and Broker Expert (weekly), each covering the 16 pillars from prospecting and listings to negotiation and systemization, all built around the appraisal-to-settlement ratio.'},
 {t:'normal',k:'What backs it',title:'A Lifetime Price Lock Guarantee and a 30-Day Money Back Guarantee on premium tiers.',body:'Darren’s clients have reported up to a 10x return on their coaching investment. Start with a free coaching session to see where your ratio is leaking first.'},
 {t:'cta',title:'Ready to see where your ratio is leaking?',chips:['Book your free coaching session','Explore the coaching tiers'],disc:'Educational content for business broker principals and their teams. No income, commission, or deal result is guaranteed. Results vary by broker, market, and deal flow.'},
];

const deck=document.getElementById('deck');
function funnel(kind){return `<svg class="funnel-motif ${kind==='title'?'title-funnel':'corner-funnel'}"><use href="#funnel"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Business <b>Broker Coach</b> · Darren Giles</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.funnel) h+=funnel(s.funnel);
  else if(s.t==='title') h+=funnel('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
