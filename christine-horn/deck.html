<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Booking Magnet Method · A Masterclass with Christine Horn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f9; --panel:#ffffff; --ink:#141013; --muted:#6a5c63;
    --rule:#e7dbe0; --accent:#d6006e; --gold:#cba132;
    --head:'Playfair Display',serif; --body:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:56px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  .eyebrow.gold{color:var(--gold)}
  h1{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:36px;line-height:1.1;letter-spacing:-.01em}
  .lede{font-size:21px;color:var(--muted);margin-top:18px;max-width:46ch}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.15;max-width:22ch}
  .big .hl{color:var(--accent)}
  p.body{font-size:18px;color:#2c2329;margin-top:14px;max-width:52ch}
  ul{margin-top:20px;list-style:none}
  ul li{font-size:19px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  ul li:last-child{border-bottom:none}
  ul li::before{content:"";position:absolute;left:0;top:20px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .num{font-family:var(--head);font-weight:800;color:var(--gold);font-size:22px;margin-right:6px}
  .pillar{font-family:var(--head);font-weight:700;font-size:28px;margin-top:6px}
  .foot{position:absolute;right:28px;bottom:20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .part-n{font-family:var(--head);font-weight:800;font-size:16px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase}
  .cta-box{margin-top:26px;padding:22px 26px;border:1px solid var(--accent);border-radius:12px;background:#fff0f7}
  .cta-box strong{font-size:20px}
  .disclaimer{font-size:12px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .ladder{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
  .rung{flex:1;min-width:150px;background:#fff0f7;border:1px solid var(--rule);border-radius:10px;padding:16px}
  .rung .r-t{font-family:var(--head);font-weight:700;font-size:19px}
  .rung .r-s{font-size:13px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A Live Masterclass',
    h1:'The Booking Magnet Method',
    lede:'Why talented actors do not book, and the repeatable system that fixes it.',
    foot:'With Christine Horn' },

  {t:'who',
    eyebrow:'Who this is for',
    h2:'If you are a good actor who is not booking enough TV',
    body:'For new and emerging screen actors, from your first co-star to reaching for your first series regular. You train, you prepare, you get in the room or send the tape, and then nothing. You have been told it is talent, headshots, or luck. It is not.' },

  {t:'content',
    eyebrow:'The real cost',
    h2:'Another pilot season goes by',
    body:'It is not just the roles you did not get. It is the year of training that did not convert, the confidence that erodes a little with each silence, and the quiet suspicion that maybe you are just not one of the ones it happens for. That story is the thing to kill first.' },

  {t:'hook',
    eyebrow:'The reframe', gold:true,
    big:'The actors who book consistently are not the most talented. They run a <span class="hl">system</span>.' },

  {t:'part', n:'Part One', h2:'How TV casting really works', body:'Most actors audition blind. They treat every role the same, with no read on how the casting process actually decides, so a strong actor keeps losing to a prepared one.' },

  {t:'content',
    eyebrow:'The core problem',
    h2:'You are preparing for the wrong job',
    body:'The same five pages of sides are a different job on a single-cam comedy, a multi-cam sitcom, a procedural, and a medical drama. When you prepare the same way for all of them, you leave the read that the room is actually listening for on the table.' },

  {t:'content',
    eyebrow:'What actually decides',
    h2:'Fit and tone, before talent',
    body:'By the time strong actors are in the mix, talent is table stakes. What separates the booking from the almost is whether the read matched the show, the tone, and the type the room was casting for. Those are knowable things, and that is the good news.' },

  {t:'part', n:'Part Two', h2:'The Booking Magnet Method', body:'A rinse-and-repeat system you run on every audition, so booking stops being a lucky day and becomes something you can cause on purpose. Five pillars.' },

  {t:'pillar', n:'01', pillar:'How TV really works', body:'See the casting process from the other side of the table, so you stop wasting your year on auditions that were never aligned with you in the first place.' },

  {t:'pillar', n:'02', pillar:'Tone to the network and medium', body:'Prepare to the network, tone, pace, and medium you are actually auditioning for. Procedural, medical drama, single-cam, multi-cam, each one is a different instrument.' },

  {t:'pillar', n:'03', pillar:'The script-analysis checklist', body:'Your own repeatable process for breaking down sides: the powerful questions that reveal the heart of the character fast, so prep stops being a panic the night before.' },

  {t:'pillar', n:'04', pillar:'Get real about your type', body:'Use insider tools to see exactly how Hollywood sees you, and audition from where you actually fit instead of forcing a role that was never going to be yours.' },

  {t:'pillar', n:'05', pillar:'The self-tape blindspot', body:'A checklist to evaluate your own self-tape before you ever send it. You cannot judge your own tape cold, and that blindspot is where booked roles quietly slip away.' },

  {t:'content',
    eyebrow:'The shift',
    h2:'From hoping to running a play',
    body:'Once the five pillars are second nature, an audition is no longer a verdict on whether you are good enough. It is a job you know how to do. You stop waiting to be chosen and start running the same play every single time.' },

  {t:'part', n:'Part Three', h2:'When booking starts to compound', body:'The audition stops being a lottery ticket and becomes a skill you run again. You walk in knowing the job, you tape knowing it is right, and the bookings start to compound.' },

  {t:'ladder',
    eyebrow:'The booking ladder',
    h2:'The same system scales with you',
    rungs:[
      {rt:'First co-star',rs:'Get in and book the first one'},
      {rt:'Your next ten',rs:'Make it repeatable'},
      {rt:'Guest star',rs:'Uplevel the read'},
      {rt:'Series regular',rs:'The one you are reaching for'}
    ],
    body:'You do not change systems at each rung. You run the same method at a higher level.' },

  {t:'content',
    eyebrow:'What changes',
    h2:'Preparation becomes repeatable',
    body:'No more reinventing your process for every audition, no more sending a tape you are secretly unsure of. The same checklist, the same questions, the same honest read on your type, applied every time. That consistency is what turns talent into a career.' },

  {t:'credibility',
    eyebrow:'Why learn this from Christine', gold:true,
    h2:'The Booking Magnet',
    body:'Christine Horn is an award-winning working actress with more than twenty years across theater, TV, and film, known as The Booking Magnet. She teaches the booking system she runs herself, the way only someone still in the room can.' },

  {t:'cta',
    eyebrow:'Your next step',
    h2:'Work with Christine',
    body:'If you want the full system and her eyes on your work, this is where you start.',
    cta:'Apply for coaching with Christine at Hollywood Bound Actors, or join Book More TV to run the method on your own.',
    disclaimer:'This masterclass is educational. Nothing here is a promise or guarantee of bookings, representation, income, or any specific career result. Acting outcomes depend on many factors outside any coach’s control, and individual results vary.' }
];

const deck = document.getElementById('deck');
function foot(s){ return s.foot ? '<div class="foot">'+s.foot+'</div>' : '<div class="foot">The Booking Magnet Method</div>'; }
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='';
  const eye = s.eyebrow ? '<div class="eyebrow'+(s.gold?' gold':'')+'">'+s.eyebrow+'</div>' : '';
  if(s.t==='title'){ h=eye+'<h1>'+s.h1+'</h1><div class="lede">'+s.lede+'</div>'; }
  else if(s.t==='hook'){ h=eye+'<div class="big">'+s.big+'</div>'; }
  else if(s.t==='part'){ h='<div class="part-n">'+s.n+'</div><h2 style="margin-top:10px">'+s.h2+'</h2><p class="body">'+s.body+'</p>'; }
  else if(s.t==='pillar'){ h=eye+'<div><span class="num">'+s.n+'</span></div><div class="pillar">'+s.pillar+'</div><p class="body">'+s.body+'</p>'; }
  else if(s.t==='ladder'){
    let r=s.rungs.map(x=>'<div class="rung"><div class="r-t">'+x.rt+'</div><div class="r-s">'+x.rs+'</div></div>').join('');
    h=eye+'<h2>'+s.h2+'</h2><div class="ladder">'+r+'</div><p class="body">'+s.body+'</p>'; }
  else if(s.t==='cta'){ h=eye+'<h2>'+s.h2+'</h2><p class="body">'+s.body+'</p><div class="cta-box"><strong>'+s.cta+'</strong></div><div class="disclaimer">'+s.disclaimer+'</div>'; }
  else { h=eye+'<h2>'+s.h2+'</h2><p class="body">'+s.body+'</p>'; }
  el.innerHTML=h+foot(s);
  deck.appendChild(el);
});
</script>
</body>
</html>
