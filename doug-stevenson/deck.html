<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Performance Is the Point | Doug Stevenson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Martel:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf7;
  --panel:#0a405d;
  --accent:#fdd65b;
  --ink:#343434;
  --chalk:#ffffff;
  --rule:#d9d4c7;
  --dim:#6b6f73;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Martel",Georgia,serif}
.deck{max-width:960px;margin:0 auto;padding:40px 22px 120px}
.slide{
  background:var(--chalk);border:1px solid var(--rule);border-radius:14px;
  padding:60px 56px;margin:0 0 26px;min-height:460px;position:relative;
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 1px 0 rgba(10,64,93,.04);
}
.slide .num{position:absolute;top:20px;right:26px;font-family:"Roboto Condensed",sans-serif;
  font-size:12px;letter-spacing:.14em;color:var(--dim)}
.kick{font-family:"Roboto Condensed",sans-serif;text-transform:uppercase;letter-spacing:.18em;
  font-size:13px;font-weight:700;color:var(--panel)}
.kick.gold{color:#b4860c}
h1{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:54px;line-height:1.04;
  color:var(--panel);margin:14px 0}
h2{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:38px;line-height:1.08;
  color:var(--panel);margin:12px 0 10px}
p{font-size:20px;line-height:1.5;margin:10px 0;max-width:40ch}
.lead{font-size:23px}
.big{font-family:"Roboto Condensed",sans-serif;font-weight:700;font-size:46px;color:var(--panel);line-height:1.1}
ul{list-style:none;margin:16px 0}
li{font-size:20px;line-height:1.45;padding:10px 0 10px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:46ch}
li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;background:var(--accent);border-radius:2px}
.spot li:nth-child(3):before{box-shadow:0 0 0 5px rgba(253,214,91,.35)}
.dark{background:var(--panel);border-color:var(--panel)}
.dark h1,.dark h2,.dark .big{color:var(--chalk)}
.dark p,.dark li{color:#e9eef2}
.dark .kick{color:var(--accent)}
.dark li{border-color:rgba(255,255,255,.14)}
.spotline{color:var(--accent)}
.byline{font-family:"Roboto Condensed",sans-serif;letter-spacing:.04em;color:var(--dim);font-size:17px;margin-top:22px}
.part .big{font-size:40px}
.credits{font-size:16px;color:var(--dim);max-width:52ch}
.disc{font-size:14px;color:var(--dim);margin-top:22px;max-width:54ch;line-height:1.5}
.cta-step{display:inline-block;font-family:"Roboto Condensed",sans-serif;font-weight:700;
  background:var(--accent);color:#2a2a2a;padding:13px 22px;border-radius:9px;margin-top:16px;font-size:19px}
@media(max-width:640px){.slide{padding:40px 26px}h1{font-size:38px}h2{font-size:28px}.big{font-size:32px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', kick:'A Story Theater International Masterclass', h:'The Performance Is the Point', p:'How to tell a business story your audience cannot forget.', by:'With Doug Stevenson, founder of Story Theater International'},
 {t:'forwho', kick:'Who this is for', h:'If you have to present, persuade or sell', items:['Leaders who need a room to move, not just nod','Salespeople tired of answering objections with features','Speakers who want to be remembered after the lights come up']},
 {t:'trap', kick:'The trap', h:'You prepared the data. They forgot it by lunch.', p:'You did the work. Clean slides, solid numbers, a logical build. And by the afternoon almost none of it had stuck. That is not a content problem. It is a story problem.'},
 {t:'reframe', dark:true, kick:'The reframe', big:'Logic explains. Stories persuade.', p:'Everyone in the room already has the facts. Information in a flat, linear format fails to make the emotional connection that makes people act. Lead with the story. Follow with the data.'},
 {t:'part', kick:'Part One', big:'Why your best content keeps falling flat'},
 {t:'point', kick:'The real problem', h:'A data dump insults the audience', p:'It wastes their time and it fails to get results. People do not remember information. They remember the moment, the tension, the person who changed because of it.'},
 {t:'point', kick:'The mechanism', h:'People remember stories, not slides', p:'When they remember your story, they remember your point, and they remember you. If you want to be memorable, tell a story. If you want to be forgettable, recite the deck.'},
 {t:'part', kick:'Part Two', big:'The Story Theater Method'},
 {t:'framework', kick:'Three critical components', h:'Choose. Craft. Perform.', spot:true, items:['Choose the right story for this audience and this outcome','Craft it with the Nine Steps of Story Structure','Perform it with practical theatricality']},
 {t:'step', kick:'Component one', h:'Choose the right story', p:'A story is a tool. You pick it the way you pick the right tool for the job, by the outcome you need in the room, not by the one you like telling most.'},
 {t:'step', kick:'Component two', h:'Craft it with the Nine Steps', p:'The Nine Steps of Story Structure put the pieces in the right order. The pivot is the obstacle: the mistake, the failure, the small disaster. That is where the tension lives, and the lesson with it.'},
 {t:'step', dark:true, kick:'Component three', h:'Perform it', p:'This is the part no structure-only method teaches. An actor works with words, emotion, mood and relationship. Practical theatricality is a little show time, on purpose. A sloppy performance negates all the work that came before. A disciplined one makes it unforgettable.'},
 {t:'point', kick:'Make it stick', h:'The Phrase That Pays', p:'One short, branded line that carries the message out the door. Make It Work. Walk Your Talk. Keep an Open Mind. It is the handle people grab when they retell your point to someone who was not in the room.'},
 {t:'part', kick:'Part Three', big:'Selling and leading with story'},
 {t:'point', kick:'For the sales conversation', h:'Aikido Selling', p:'Aikido means the way of blending energy. Do not fight the objection. Welcome it, blend with it, and answer it with a story you chose and crafted in advance. The right story shifts the talk from logic to emotion and lowers defenses on both sides.'},
 {t:'point', kick:'The story that sells without selling', h:'The Credibility Story', p:'A customer-interaction story told in the customer’s own words. Instead of selling yourself, you let a past client do it from inside the story. It is referral selling, and a test drive of what it is like to work with you, at the same time.'},
 {t:'proof', dark:true, kick:'Why learn this here', h:'Thirty years on the world’s stages', credits:'Doug spent 20 years as a professional actor before founding Story Theater International. Since 1994 he has taught storytelling for business in 18 countries and trains thousands of professionals and executives every year, for organizations that include Microsoft, Oracle, Bayer, Caterpillar, Volkswagen and Hewlett Packard.'},
 {t:'point', kick:'After you learn this', h:'You walk in with one story, ready', p:'You know which story, you know how it is built, and you know how to perform it. The objection you used to dread becomes the opening you were hoping for. The room leans in. The point lands, and it stays.'},
 {t:'recap', kick:'The one thing', h:'Choose it. Craft it. Perform it.', p:'A great story told poorly is still forgettable. A well chosen story, built on the Nine Steps and performed with practical theatricality, is the most persuasive tool you own.'},
 {t:'cta', kick:'Where to take this next', h:'Bring the Story Theater Method to your team', p:'Book Doug for a keynote, a training or private coaching, and put a repeatable storytelling method in the hands of the people who present, persuade and sell for you.', step:'storytelling-in-business.com', disc:'This masterclass teaches a method for crafting and performing business stories. It is educational. No specific sales, revenue or career result is guaranteed, and results vary with the audience, the material and the work you put in.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.dark?' dark':'')+(s.t==='part'?' part':'')+(s.spot?' ':'');
  let h='<span class="num">'+String(i+1).padStart(2,'0')+' / '+S.length+'</span>';
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.h) h+='<h1 style="font-size:'+(s.t==='title'?'54':'40')+'px">'+s.h+'</h1>';
  if(s.p) h+='<p class="lead">'+s.p+'</p>';
  if(s.items){h+='<ul'+(s.spot?' class="spot"':'')+'>';s.items.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.credits) h+='<p class="credits">'+s.credits+'</p>';
  if(s.by) h+='<div class="byline">'+s.by+'</div>';
  if(s.step) h+='<div class="cta-step">'+s.step+'</div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
