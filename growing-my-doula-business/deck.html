<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Stream Revenue for Doula Agencies | Birth Boss Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#faf6f1; --panel:#f3ebe2; --ink:#0e2036; --ink-soft:#33425a;
    --muted:#7d7266; --accent:#ca7a61; --accent-deep:#b2624a; --rule:#e4d6c9;
  }
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--ink); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  #stage{
    position:relative; width:min(960px,96vw); aspect-ratio:16/9;
    background:var(--bg); overflow:hidden;
    box-shadow:0 24px 70px rgba(14,32,54,.45); border-radius:6px;
  }
  .slide{
    position:absolute; inset:0; padding:64px 72px;
    display:none; flex-direction:column; justify-content:center;
  }
  .slide.on{ display:flex; }
  .eyebrow{ font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--accent-deep); margin-bottom:20px; }
  h1{ font-family:'Lora',Georgia,serif; font-weight:600; font-size:46px; line-height:1.1; color:var(--ink); letter-spacing:-.01em; }
  h2{ font-family:'Lora',Georgia,serif; font-weight:600; font-size:34px; line-height:1.18; color:var(--ink); margin-bottom:18px; }
  .lede{ font-size:21px; line-height:1.5; color:var(--ink-soft); margin-top:18px; max-width:46ch; }
  p.big{ font-family:'Lora',Georgia,serif; font-style:italic; font-weight:500; font-size:30px; line-height:1.35; color:var(--ink); max-width:40ch; }
  ul{ list-style:none; margin-top:10px; }
  li{ font-size:19px; line-height:1.4; color:var(--ink-soft); padding:12px 0 12px 26px; position:relative; border-bottom:1px solid var(--rule); max-width:52ch; }
  li:last-child{ border-bottom:none; }
  li::before{ content:""; position:absolute; left:0; top:21px; width:12px; height:2px; background:var(--accent); }
  .streams{ display:flex; gap:0; margin-top:26px; }
  .stream{ flex:1; padding:20px 18px; background:var(--panel); border-top:3px solid var(--accent); margin-right:10px; }
  .stream:last-child{ margin-right:0; }
  .stream .n{ font-family:'Lora',serif; font-size:13px; color:var(--accent-deep); font-weight:600; letter-spacing:.1em; }
  .stream .t{ font-size:16px; color:var(--ink); margin-top:8px; line-height:1.3; font-weight:500; }
  .steps{ margin-top:22px; }
  .step{ display:flex; align-items:baseline; gap:16px; padding:11px 0; border-bottom:1px solid var(--rule); max-width:54ch; }
  .step:last-child{ border-bottom:none; }
  .step .num{ font-family:'Lora',serif; font-size:22px; color:var(--accent); font-weight:600; min-width:28px; }
  .step .txt{ font-size:18px; color:var(--ink-soft); line-height:1.35; }
  .step .txt b{ color:var(--ink); font-weight:600; }
  .cred{ font-size:18px; line-height:1.55; color:var(--ink-soft); max-width:50ch; margin-top:8px; }
  .cred b{ color:var(--ink); font-weight:600; }
  .title-wrap .brand{ margin-top:34px; font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .title-wrap .brand b{ color:var(--accent-deep); font-weight:600; }
  .rule-streams{ display:flex; gap:7px; margin:26px 0 0; }
  .rule-streams span{ height:2px; background:var(--accent); opacity:.55; }
  .rule-streams span:nth-child(1){ width:70px; } .rule-streams span:nth-child(2){ width:40px; opacity:.4;} .rule-streams span:nth-child(3){ width:22px; opacity:.3;}
  .cta-box{ margin-top:22px; padding:22px 24px; background:var(--panel); border-left:4px solid var(--accent); max-width:52ch; }
  .cta-box .step-line{ font-size:18px; color:var(--ink); padding:7px 0; }
  .cta-box .step-line b{ color:var(--accent-deep); }
  .disclaimer{ margin-top:22px; font-size:12px; line-height:1.5; color:var(--muted); max-width:58ch; }
  .nav{ position:absolute; bottom:18px; right:24px; font-family:'Inter',sans-serif; font-size:12px; color:var(--muted); letter-spacing:.08em; z-index:5; }
  .hint{ position:absolute; bottom:18px; left:24px; font-size:12px; color:var(--muted); z-index:5; }
  .tap{ position:absolute; inset:0; z-index:3; cursor:pointer; }
  @media (max-width:640px){
    .slide{ padding:34px 30px; } h1{ font-size:30px; } h2{ font-size:24px; }
    .lede{ font-size:17px; } p.big{ font-size:21px; } li{ font-size:15px; }
    .streams{ flex-direction:column; } .stream{ margin:0 0 8px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="tap" id="tap"></div>
  <div class="nav" id="nav"></div>
  <div class="hint">Use arrow keys or click to advance</div>
</div>
<script>
const S = [
  {t:'title', html:`
    <div class="title-wrap">
      <div class="eyebrow">A free masterclass for doula business owners</div>
      <h1>Multi-Stream Revenue<br>for Doula Agencies</h1>
      <div class="rule-streams"><span></span><span></span><span></span></div>
      <p class="lede">How to build a doula business that pays you, runs without you, and is worth selling.</p>
      <div class="brand">Birth Boss Society &nbsp;&middot;&nbsp; with <b>Jodi Congdon</b></div>
    </div>` },

  {t:'content', eyebrow:'What you will learn', html:`
    <h2>In the next session, together</h2>
    <ul>
      <li>How to spot every revenue stream already hiding in your business</li>
      <li>Which services are actually profitable, and which ones eat your time for pennies</li>
      <li>How to separate your streams so the business makes sense to anyone looking at it</li>
      <li>How to build toward the number that changes everything</li>
    </ul>` },

  {t:'content', eyebrow:'Who this is for', html:`
    <h2>This is for you if...</h2>
    <ul>
      <li>You're a solo doula who's fully booked and still not where you want to be financially</li>
      <li>You're an agency owner whose revenue looks great on paper but feels messy underneath</li>
      <li>You have one bank account, one social presence, and multiple audiences, and it's getting confusing</li>
      <li>You've had the thought, even once: "what happens to this business if I stop?"</li>
    </ul>` },

  {t:'content', eyebrow:'The thing nobody says out loud', html:`
    <p class="big">From the outside it looks like your business is thriving. But if you stopped working tomorrow, the revenue stops too. All of it.</p>` },

  {t:'content', eyebrow:'The hard reframe', html:`
    <h2>That's not a business.</h2>
    <p class="lede">It's a job you built for yourself, with no benefits, no retirement plan, and no exit strategy. You didn't do anything wrong. Nobody ever taught you the financial architecture.</p>` },

  {t:'content', eyebrow:'And you know it', html:`
    <p class="big">The worst part? You know there's more you could be doing. More services. More revenue. More ways to get paid that don't require you at 2am.</p>
    <p class="lede">Nobody has shown you how to organize it, track it, and scale it without running yourself into the ground. Until now.</p>` },

  {t:'section', eyebrow:'Part one', html:`
    <h1>Revenue is not profit.</h1>
    <div class="rule-streams"><span></span><span></span><span></span></div>` },

  {t:'content', eyebrow:'Part one', html:`
    <h2>What did you actually keep?</h2>
    <p class="lede">That birth you took last weekend. That class you taught. After expenses, contractor payouts, and your own time, what did you keep? Revenue tells you how busy you are. Profit tells you whether the business works.</p>` },

  {t:'section', eyebrow:'Part two', html:`
    <h1>The streams already<br>hiding in your practice.</h1>
    <div class="rule-streams"><span></span><span></span><span></span></div>` },

  {t:'content', eyebrow:'Part two', html:`
    <h2>Most doulas are sitting on 2 to 3 untapped streams</h2>
    <div class="streams">
      <div class="stream"><div class="n">01</div><div class="t">Active services: births and postpartum care</div></div>
      <div class="stream"><div class="n">02</div><div class="t">Teaching, training, and certification</div></div>
      <div class="stream"><div class="n">03</div><div class="t">Passive income and team leverage that don't need you present</div></div>
    </div>
    <p class="lede">We map every one of them, together, in the masterclass.</p>` },

  {t:'content', eyebrow:'Part two', html:`
    <h2>Then separate them</h2>
    <p class="lede">Organize your streams so the business makes sense to anyone looking at it: your accountant, a loan officer, a future buyer, or just you at 11pm trying to figure out where the money went.</p>` },

  {t:'section', eyebrow:'Part three', html:`
    <h1>The freedom number.</h1>
    <div class="rule-streams"><span></span><span></span><span></span></div>` },

  {t:'content', eyebrow:'Part three', html:`
    <p class="big">When your passive income exceeds your expenses, you no longer need active income.</p>
    <p class="lede">That's not retirement. That's freedom. And it's closer than you think if you build the right streams now.</p>` },

  {t:'content', eyebrow:'Part three', html:`
    <h2>Start thinking like a CEO</h2>
    <p class="lede">Build something worth selling, even if you're not selling for seven years. The doulas who win long-term start preparing now, not when life forces their hand.</p>` },

  {t:'content', eyebrow:'Your actual week', html:`
    <h2>A week that doesn't depend on you</h2>
    <p class="lede">You still do the work you love. But income also comes from streams that keep running when you're at a school event, on a walk, or asleep. The practice earns whether or not you're physically present. That's the whole point.</p>` },

  {t:'content', eyebrow:'The method', html:`
    <h2>Multi-Stream Revenue, in four moves</h2>
    <div class="steps">
      <div class="step"><div class="num">1</div><div class="txt"><b>Know your profit per service.</b> Revenue is not profit.</div></div>
      <div class="step"><div class="num">2</div><div class="txt"><b>Map the streams</b> already hiding in your practice.</div></div>
      <div class="step"><div class="num">3</div><div class="txt"><b>Separate and organize</b> them so the business is legible.</div></div>
      <div class="step"><div class="num">4</div><div class="txt"><b>Build toward the freedom number.</b></div></div>
    </div>` },

  {t:'content', eyebrow:'In one line', html:`
    <p class="big">You're not bad with money. You're a doula who built a real business, and nobody taught you the financial architecture to make it sustainable, scalable, and sellable.</p>` },

  {t:'content', eyebrow:'Why listen to me', html:`
    <h2>Meet Jodi Congdon</h2>
    <p class="cred">I'm a postpartum doula and lactation educator who built <b>Hip to Heart</b> into a doula agency with <b>over 60 contractors</b> serving families across the Boston area. I'm a <b>CAPPA Faculty member</b> and the Postpartum Doula and Lactation Educator Trainer for all of New England, and the founder of <b>Birth Boss Society</b>. I run multiple revenue streams and work about 20 hours a week. I'm not teaching theory. I built this.</p>` },

  {t:'cta', eyebrow:'Your next step', html:`
    <h2>Your business should pay you back for everything you've poured into it.</h2>
    <div class="cta-box">
      <div class="step-line"><b>Birth Boss Society</b> membership, to grow alongside other doula CEOs</div>
      <div class="step-line"><b>Business Builder</b>, to put the systems in place as a solo doula</div>
      <div class="step-line"><b>Agency Builder</b>, the 8-week path from solo to a team-run agency</div>
    </div>
    <p class="disclaimer">Educational content only. No income or result is guaranteed. Results vary by business, effort, and market. Nothing here is financial, legal, or tax advice.</p>` }
];

const stage=document.getElementById('stage');
const nav=document.getElementById('nav');
let i=0;
S.forEach((s,idx)=>{
  const d=document.createElement('div');
  d.className='slide'+(idx===0?' on':'');
  d.innerHTML=(s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:'')+s.html;
  stage.insertBefore(d,document.getElementById('nav'));
});
const slides=[...document.querySelectorAll('.slide')];
function show(n){ slides[i].classList.remove('on'); i=(n+slides.length)%slides.length; slides[i].classList.add('on'); nav.textContent=(i+1)+' / '+slides.length; }
document.getElementById('tap').onclick=()=>show(i+1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')show(i+1); if(e.key==='ArrowLeft')show(i-1); });
nav.textContent='1 / '+slides.length;
</script>
</body>
</html>
