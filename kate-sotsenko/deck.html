<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 60% Rule — a Good Busy masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7f5;
    --panel:#fbfaf7;
    --rule:#d9d6cb;
    --ink:#181818;
    --accent:#2e4e57;
    --accent2:#98abb3;
    --grey:#5c5c5c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;line-height:1.5}
  h1,h2,.k,.part{font-family:"League Spartan","Nunito Sans",sans-serif;letter-spacing:-.01em}
  #deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:20px 0;min-height:440px;display:flex;flex-direction:column;justify-content:center}
  .k{text-transform:uppercase;letter-spacing:.14em;font-size:13px;font-weight:600;color:var(--accent2);margin-bottom:18px}
  .part{text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px}
  h1{font-size:60px;font-weight:700;line-height:1.02;margin-bottom:18px}
  h2{font-size:38px;font-weight:600;line-height:1.08;margin-bottom:16px;color:var(--accent)}
  p{font-size:21px;color:var(--ink);max-width:48ch}
  p.lead{font-size:24px;color:var(--grey)}
  .big{font-size:120px;font-weight:700;color:var(--accent);line-height:1;font-family:"League Spartan",sans-serif}
  ul{list-style:none;margin-top:10px}
  li{font-size:21px;padding:12px 0;border-bottom:1px solid var(--rule);max-width:52ch;display:flex;gap:16px;align-items:baseline}
  li:last-child{border-bottom:none}
  li .n{font-family:"League Spartan",sans-serif;font-weight:700;color:var(--accent);min-width:28px}
  .note{margin-top:22px;font-size:15px;color:var(--grey);max-width:60ch}
  .q{font-size:30px;font-weight:600;color:var(--accent);margin-bottom:10px}
  .divider{display:flex;justify-content:center;align-items:center}
  .section{text-align:center}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', k:'A LIVE GOOD BUSY MASTERCLASS', title:'The 60% Rule', sub:'How busy professionals decide what is actually a must-do, and get their week back.'},
  {t:'promise', title:'What you will leave with', lead:'One clear work-life balance goal, and a simple way to decide what deserves your time tomorrow morning.'},
  {t:'who', k:'WHO THIS IS FOR', title:'For the overcommitted professional', body:'You lead, you deliver, and your calendar is full of things other people put there. You are good at your job. You are also tired.'},
  {t:'trap', part:'THE TRAP', title:'Overwhelmed. Overcommitted. Overworked.', body:'This is the OOO Cycle. More effort goes in, the cycle tightens, and the days still end with the real work undone.'},
  {t:'reframe', k:'THE UNCOMFORTABLE PART', title:'Doing it faster never fixes it', lead:'If most of what fills your day should not be there, then speed, apps, and willpower only help you do the wrong things more efficiently.'},
  {t:'part', part:'PART ONE', title:'Busy is not the same as productive'},
  {t:'problem', title:'Busy is human', body:'Being busy feels like proof of value. So we say yes, we attend, we reply, and we measure ourselves by how full the day was instead of what it moved forward.'},
  {t:'stat', k:'THE NUMBER THAT CHANGES THINGS', big:'60%', body:'Up to 60% of the work keeping you busy is not a must-do. Meetings that could be a message. Replies no one needed. Tasks that simply should not exist.'},
  {t:'why', title:'Why the usual fixes fail', body:'A new app adds another place to check. A longer to-do list hides the 60% in plain sight. The problem was never your tools or your discipline. It was the decision underneath.'},
  {t:'part', part:'PART TWO', title:'Good Busy is a skill'},
  {t:'framework', k:'THE GOOD BUSY APPROACH', title:'Productivity is a game of decisions', body:'Not more doing. Better deciding. Five questions turn a chaotic week into a short list of what truly matters.'},
  {t:'q', part:'QUESTION ONE', q:'What is the end goal?', body:'Name the outcome you are actually here for. Most overwhelm is a pile of activity with no finish line attached.'},
  {t:'q', part:'QUESTION TWO', q:'What is to prepare?', body:'Clear the ground before you start. Decide what you need in place so the work can move without constant interruption.'},
  {t:'q', part:'QUESTION THREE', q:'What is the game plan?', body:'Sort the list into must-do and the rest. The rest is the 60%. This is where you win back hours.'},
  {t:'q', part:'QUESTION FOUR', q:'What is the next step?', body:'Protect time for the one thing that matters next, and put it on the calendar before anyone else fills it.'},
  {t:'q', part:'QUESTION FIVE', q:'What is working, what is not?', body:'Review honestly, keep what freed up time, and drop what did not. The skill compounds every week you practise it.'},
  {t:'after', part:'PART THREE', title:'A Good Busy week', body:'Fewer meetings, more finished work, and evenings that belong to you. People report freeing up 8 or more hours a week, without doing more.'},
  {t:'whyme', k:'WHY LEARN THIS FROM ME', title:'I burned out first', body:'Fifteen years in corporate roles, until the overwhelm cost me episodes of vision loss. I rebuilt the way I work around decisions, not effort, and freed up 30% of my time while covering a 13-month leave and leading my team past target. Leaders from Amazon, Shell, and Bosch now learn the same approach.'},
  {t:'recap', title:'The whole idea, in one line', lead:'Busy is human. Good Busy is a skill. It is deciding what is a must-do, and letting the rest go.'},
  {t:'cta', k:'YOUR NEXT STEP', title:'Start your reset', body:'Join the Good Busy Reset and put the five questions to work on your own week, with support the whole way through.', note:'This session is educational. No specific result or outcome is guaranteed. Results vary and depend on your own choices and circumstances.'}
];
const deck = document.getElementById('deck');
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide ' + (['title','promise','part','reframe','recap','stat'].includes(s.t)?'section':'');
  let h = '';
  if(s.k) h += '<div class="k">'+s.k+'</div>';
  if(s.part) h += '<div class="part">'+s.part+'</div>';
  if(s.big) h += '<div class="big">'+s.big+'</div>';
  if(s.title) h += (s.t==='title'?'<h1>'+s.title+'</h1>':'<h2>'+s.title+'</h2>');
  if(s.q) h += '<div class="q">'+s.q+'</div>';
  if(s.sub) h += '<p class="lead">'+s.sub+'</p>';
  if(s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if(s.body) h += '<p>'+s.body+'</p>';
  if(s.bullets){ h += '<ul>'; s.bullets.forEach((b,i)=>{ h+='<li><span class="n">'+(i+1)+'</span><span>'+b+'</span></li>'; }); h += '</ul>'; }
  if(s.note) h += '<div class="note">'+s.note+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
