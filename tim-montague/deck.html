<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The CLEAN Power Market Expansion Method · Tim Montague</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FAF9F6; --panel:#F1EEE6; --rule:#E2DDD0;
    --acc:#C97A2E; --idx:#1A1A1A; --chalk:#F5F1EA; --grey:#5B5650; --dim:#948C7E;
  }
  html,body{height:100%}
  body{background:#0B0A08;font-family:'DM Sans',-apple-system,sans-serif;color:var(--idx);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0B0A08}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Space Grotesk',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'DM Sans',Georgia,serif;font-weight:700;color:var(--idx);line-height:1.14;letter-spacing:-.01em}
  .t-title h1{font-size:3.7vw;max-width:88%}
  .t-normal h1{font-size:2.7vw;max-width:84%}
  .t-normal .body{font-family:'Space Grotesk',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.56;font-weight:400}
  .sub{font-family:'Space Grotesk',sans-serif;font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Space Grotesk',sans-serif;font-size:1.3vw;font-weight:600;color:var(--acc);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:3.9vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:linear-gradient(180deg,var(--idx) 0%,#000 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.1vw;max-width:82%;color:var(--chalk);font-weight:500;font-style:italic}
  .t-cta{background:linear-gradient(180deg,var(--idx) 0%,#000 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.3vw;max-width:80%;color:var(--chalk)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#F3DDC4;border-radius:100px;padding:1.3vh 1.6vw;font-family:'Space Grotesk',sans-serif;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Space Grotesk',sans-serif;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .t-cta .disc{color:#C4BAA8}
  .motif{position:absolute;pointer-events:none;opacity:.9}
  .title-motif{right:7%;bottom:9%;width:17vw}
  .corner-motif{right:6%;bottom:7.5%;width:7.5vw;opacity:.55}
  .brandline{font-family:'Space Grotesk',sans-serif;font-size:1.2vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(26,26,26,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Space Grotesk',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.4vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Clean Power Consulting Group</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ascending five-step expansion motif: five bars, small to large, last one picked out in accent -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="steps" viewBox="0 0 260 170">
  <g fill="none" stroke-linecap="round">
    <line x1="30" y1="150" x2="30" y2="128" stroke="#1A1A1A" stroke-width="9" opacity="0.22"/>
    <line x1="75" y1="150" x2="75" y2="110" stroke="#1A1A1A" stroke-width="9" opacity="0.28"/>
    <line x1="120" y1="150" x2="120" y2="88" stroke="#1A1A1A" stroke-width="9" opacity="0.34"/>
    <line x1="165" y1="150" x2="165" y2="62" stroke="#1A1A1A" stroke-width="9" opacity="0.4"/>
    <line x1="210" y1="150" x2="210" y2="34" stroke="#C97A2E" stroke-width="10" opacity="0.95"/>
    <circle cx="210" cy="26" r="7" fill="none" stroke="#C97A2E" stroke-width="3.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The CLEAN Power Market Expansion Method',sub:'A masterclass for solar EPC owners moving from residential and light-commercial work into large C&I, taught by an operator who has originated 150+ MW of his own projects.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You run a solid residential or light-commercial book. You still cannot land a real C&I project.',body:'You have crews, permits, and a pipeline that works for rooftops. C&I is a different sale, a different financing structure, and a different buyer. Most EPC owners try to scale the residential playbook up and wonder why it stalls.'},
 {t:'dark',title:'Quoting rooftops and closing megawatts are two different businesses, run by the same company.'},

 {t:'section',idx:'Part One',title:'Why Residential Success Does Not Transfer to C&I'},
 {t:'normal',k:'The sales cycle problem',title:'A homeowner decides in a week. A facilities director decides in a quarter.',body:'The C&I buyer is a committee, not a homeowner: facilities, finance, and sometimes the board. A sales process built for a single decision-maker in one visit falls apart the first time it meets a procurement cycle.'},
 {t:'normal',k:'The technology and financing gap',title:'Bigger projects need a bigger stack, and most EPCs never had to build one.',body:'Battery storage, interconnection studies, offtake structures, and financing options that never came up on a rooftop job are now the whole deal. Owners who never had to learn this stack are guessing at exactly the point where the project gets big enough to matter.'},
 {t:'dark',title:'The EPCs that make the jump did not get luckier leads. They got a plan first.'},

 {t:'section',idx:'Part Two',title:'The CLEAN Power Market Expansion Method, Named'},
 {t:'normal',k:'C: Capacity assessment',title:'Know what your team and tools can actually support before you chase bigger deals.',body:'An honest audit of your current crew, tech stack, and process against what a real C&I project demands. Most owners overestimate this. Chasing megawatt deals on a rooftop-sized operation is how good companies take on projects they cannot execute.'},
 {t:'normal',k:'L: Leverage',title:'Use the relationships and infrastructure you already have instead of starting cold.',body:'Every EPC owner already has more leverage than they use: past customers, supplier relationships, local reputation. This step is about deploying what already exists before spending a dollar on anything new.'},
 {t:'normal',k:'E: Expansion',title:'The actual move into large C&I, industrial, and small-utility work.',body:'This is the step everyone wants to skip to. It only works after capacity and leverage are honest, which is why most owners who jump straight here stall on their first real bid.'},
 {t:'normal',k:'A: Action planning',title:'Turn the assessment into a concrete sales and marketing plan for bigger deals.',body:'Specific moves for the sales process, the marketing message, and who on your team owns each piece. A plan an owner can actually run this quarter, not a slide of principles.'},
 {t:'normal',k:'N: Next steps',title:'What happens after the first C&I win, including where AI actually helps.',body:'The step most owners never get to: what changes operationally once C&I work is real revenue, not a pilot, and where AI tools genuinely save time in bidding, qualification, and ops versus where they are just noise.'},
 {t:'dark',title:'Five steps. One is obvious. The other four are why most EPCs never make the jump.'},

 {t:'section',idx:'Part Three',title:'What The Expansion Actually Looks Like'},
 {t:'normal',k:'The shop this builds',title:'A pipeline with both residential stability and real C&I upside, not a bet-the-company pivot.',body:'The residential and light-commercial book keeps running. C&I gets added on top of a real capacity assessment, not instead of the business that already works.'},
 {t:'normal',k:'Why Tim Montague',title:'An operator who has done it himself, in front of the whole industry every week.',body:'Tim Montague has originated and developed 150+ MW of his own solar projects over 30+ years in technology and sustainability, and hosts the Clean Power Hour podcast, 400+ episodes and 1.4M+ views, where he talks to the operators actually building the energy transition every week.'},

 {t:'section',idx:'Your Next Step',title:'Find Your Capacity Gap'},
 {t:'normal',k:'Free introductory call',title:'A no-obligation conversation about where your capacity actually stands.',body:'No pitch deck, no pressure. A straight conversation about which step of the CLEAN Method matters most for your business right now, from someone who has originated the megawatts himself.'},
 {t:'normal',k:'A specific course',title:'If you already know your gap, start there.',body:'Selling Commercial Solar and Qualifying Commercial Solar Leads and Projects are each built as focused, practical training for owners who already know which piece needs the work.'},
 {t:'cta',title:'Ready to find your capacity gap?',chips:['Book the introductory call','Explore a course'],disc:'Educational content for solar EPC business owners. No income or business result is guaranteed. Results vary by company, market, and execution.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#steps"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Clean Power <b>Consulting Group</b> &middot; Tim Montague</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=motif(s.arc);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
