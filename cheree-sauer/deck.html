<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale Without Sacrifice: The RAMP Method Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --ground:#0d3f57;
    --panel:#114e6b;
    --rule:#2f6d87;
    --accent:#ebb326;
    --paper:#f6f1e6;
    --ink-paper:#10303f;
    --cloud:#eaf2f6;
    --mist:#9fc0cf;
  }
  html,body{height:100%;}
  body{
    font-family:'Montserrat',-apple-system,sans-serif;
    background:var(--ground);
    color:var(--cloud);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;}
  .slide{display:none;width:100%;max-width:980px;}
  .slide.on{display:block;animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .eyebrow{font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(30px,5vw,56px);line-height:1.08;color:#fff;letter-spacing:-.01em;}
  h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(24px,3.6vw,40px);line-height:1.15;color:#fff;margin-bottom:20px;}
  .lead{font-size:clamp(17px,2vw,22px);line-height:1.5;color:var(--mist);max-width:40ch;}
  .big{font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(26px,4vw,44px);line-height:1.2;color:#fff;max-width:20ch;}
  .big .hi{color:var(--accent);}
  p.body{font-size:clamp(16px,1.9vw,20px);line-height:1.6;color:var(--cloud);max-width:46ch;margin-top:14px;}
  ul.list{list-style:none;margin-top:24px;}
  ul.list li{font-size:clamp(16px,2vw,21px);line-height:1.4;padding:14px 0 14px 36px;position:relative;border-bottom:1px solid var(--rule);color:var(--cloud);}
  ul.list li:before{content:"";position:absolute;left:0;top:22px;width:16px;height:3px;background:var(--accent);}
  .pillar-tag{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(56px,12vw,120px);color:var(--panel);line-height:.9;}
  .pillar-tag .on{color:var(--accent);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px;}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:24px;}
  .card .k{font-family:'Poppins',sans-serif;font-weight:700;color:var(--accent);font-size:20px;margin-bottom:8px;}
  .card .v{font-size:16px;line-height:1.45;color:var(--cloud);}
  .paper{background:var(--paper);color:var(--ink-paper);border-radius:16px;padding:40px;}
  .paper h2,.paper .big{color:var(--ink-paper);}
  .paper .lead{color:#3a5663;}
  .cta-steps{list-style:none;margin-top:22px;}
  .cta-steps li{font-size:clamp(16px,2vw,20px);padding:12px 0;border-bottom:1px solid #d9cdb4;color:var(--ink-paper);}
  .cta-steps li b{font-family:'Poppins',sans-serif;color:#0d3f57;}
  .disclaimer{font-family:'Montserrat',sans-serif;font-size:12px;color:#6f7f86;margin-top:26px;line-height:1.5;max-width:60ch;}
  .brandline{font-family:'Poppins',sans-serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:30px;}
  .steprule{display:flex;gap:10px;margin-top:30px;}
  .steprule span{height:6px;flex:1;background:var(--panel);border-radius:3px;}
  .steprule span.lit{background:var(--accent);}
  #nav{position:fixed;bottom:18px;right:24px;font-family:'Poppins',sans-serif;font-size:13px;color:var(--mist);display:flex;gap:16px;align-items:center;}
  #nav button{background:none;border:1px solid var(--rule);color:var(--cloud);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;}
  #nav button:hover{border-color:var(--accent);color:var(--accent);}
  #count{min-width:48px;text-align:center;}
  .kicker{font-size:clamp(16px,1.9vw,20px);color:var(--mist);margin-top:18px;max-width:44ch;line-height:1.55;}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">&#8249;</button><span id="count"></span><button id="next">&#8250;</button></div>
<script>
const S=[
  {t:'cover',eyebrow:'A live masterclass for insurance agency owners',h1:'Scale Without Sacrifice',kicker:'How to grow your agency without adding hours, using the performance science elite athletes use to peak without burning out.',brand:'The RAMP Method with Cheree Sauer'},

  {t:'statement',eyebrow:'Who this is for',big:'You built the agency. Now it feels like the agency owns <span class="hi">you</span>.',body:'This is for the insurance agency owner who hit the revenue goals and is still working nights, still the bottleneck, still one bad week from burning out.'},

  {t:'list',eyebrow:'The trap',h2:'You know this feeling',items:['Every result still runs through you','Time off means the numbers slip','You are growing, but it costs you your evenings, your health, your family','The reward for hitting the goal is a bigger goal and less margin']},

  {t:'statement',eyebrow:'The reframe',big:'More hours is not a growth strategy. It is a <span class="hi">ceiling</span>.',body:'Most agency owners try to grow by doing more. There is a hard limit to that, and you are feeling it. The owners who break through do something different.'},

  {t:'statement',eyebrow:'Part one',big:'Growing and <span class="hi">scaling</span> are not the same thing.',body:'Growing means the agency produces more because you do more. Scaling means the agency produces more without you doing more. One burns you out. The other sets you free.'},

  {t:'list',eyebrow:'Part one',h2:'Why effort stops working',items:['The harder you push, the more the agency depends on you','Fatigue quietly lowers the quality of every decision you make','You cannot out-work a system problem','Recovery gets treated as a reward you never let yourself earn']},

  {t:'statement',eyebrow:'The sports-science lens',big:'No elite athlete trains at 100% every day. <span class="hi">Neither should you.</span>',body:'I spent 14 years as a sports psychologist and athletic trainer with high performers. Peak performance is never constant effort. It is loading, recovering, and peaking on purpose. Your agency works the same way.'},

  {t:'framework',eyebrow:'Part two',h2:'The RAMP Method',kicker:'A system for scaling your agency on performance science instead of adrenaline. Four pillars.'},

  {t:'pillar',tag:'R',word:'Rest',h2:'Rest is a performance input, not a reward',body:'In athletics you grow during recovery, not during the grind. We build recovery into the agency on purpose so your best thinking shows up when it matters, instead of running you into the ground.'},

  {t:'pillar',tag:'A',word:'Align',h2:'Align business, life and leadership',body:'When your calendar, your team and your goals are pointed at the same thing, effort stops leaking. We get the agency aligned with the life you actually want, so growth is not at war with everything else.'},

  {t:'pillar',tag:'M',word:'Master',h2:'Master your systems and your time',body:'We structure your day, week, month and year the way an elite program periodizes a season: load, deload, peak. The agency grows on a schedule, and you stop being the bottleneck.'},

  {t:'pillar',tag:'P',word:'Peak',h2:'Reach your peak, and stay there',body:'Peak performance you can repeat, without the crash. The owner who has rested, aligned and mastered their systems can operate at a high level again and again, instead of sprinting until something breaks.'},

  {t:'grid',eyebrow:'Part three',h2:'What changes when RAMP is installed',cards:[{k:'Your week',v:'Periodized, not reactive. You know when you load and when you recover.'},{k:'Your team',v:'Carries the day-to-day. You step into the CEO seat you have been too busy to hold.'},{k:'Your energy',v:'Protected on purpose, so your decisions are sharp when they count.'},{k:'Your growth',v:'Comes from the system, not from you giving up another evening.'}]},

  {t:'statement',eyebrow:'The outcome',big:'A bigger agency and <span class="hi">your life back</span>, at the same time.',body:'This is not balance as a nice idea. It is a structure that lets the agency scale while you work fewer, better hours.'},

  {t:'credibility',eyebrow:'Why listen to me',h2:'Cheree Sauer',items:['Master’s Degree in Sports Psychology','14+ years training high-performing athletes and teams','20+ years as an entrepreneur','Creator of the RAMP Method, host of the Insurance Revolutionized podcast','National speaker on scaling without burnout'],kicker:'I built the RAMP Method to give agency owners the same performance science that keeps elite athletes at the top without breaking them.'},

  {t:'cta',eyebrow:'Your next step',h2:'Join the Success Without Sacrifice Intensive',steps:[['6 weeks','A live group coaching program that installs the RAMP Method in your agency.'],['The outcome','A periodized, scalable agency and a schedule you control.'],['Start here','Save your seat or book a call to see if it is the right fit.']],brand:'Success Without Sacrifice',disclaimer:'This presentation is for educational purposes only and reflects one coaching approach. It is not financial, medical, or business advice, and it is not a guarantee of results. Individual outcomes vary based on your effort, your agency, and your market.'}
];

const stage=document.getElementById('stage');
let i=0;
function esc(s){return s;}
function slideHTML(s,idx){
  const steps=`<div class="steprule">${S.map((_,k)=>`<span class="${k<=idx?'lit':''}"></span>`).join('')}</div>`;
  if(s.t==='cover'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h1>${s.h1}</h1><p class="kicker">${s.kicker}</p><div class="brandline">${s.brand}</div></div>`;}
  if(s.t==='statement'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><div class="big">${s.big}</div><p class="body">${s.body}</p></div>`;}
  if(s.t==='list'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><ul class="list">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;}
  if(s.t==='framework'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><p class="lead">${s.kicker}</p>${steps}</div>`;}
  if(s.t==='pillar'){return `<div class="slide"><div class="pillar-tag"><span class="on">${s.tag}</span>AMP</div><div class="eyebrow" style="margin-top:14px">${s.word}</div><h2>${s.h2}</h2><p class="body">${s.body}</p></div>`;}
  if(s.t==='grid'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><div class="grid">${s.cards.map(c=>`<div class="card"><div class="k">${c.k}</div><div class="v">${c.v}</div></div>`).join('')}</div></div>`;}
  if(s.t==='credibility'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><ul class="list">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul><p class="kicker">${s.kicker}</p></div>`;}
  if(s.t==='cta'){return `<div class="slide"><div class="paper"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><ul class="cta-steps">${s.steps.map(x=>`<li><b>${x[0]}</b> &middot; ${x[1]}</li>`).join('')}</ul><div class="brandline" style="color:#0d3f57">${s.brand}</div><p class="disclaimer">${s.disclaimer}</p></div></div>`;}
  return '';
}
function render(){
  stage.innerHTML=slideHTML(S[i],i);
  const el=stage.querySelector('.slide');if(el)el.classList.add('on');
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
