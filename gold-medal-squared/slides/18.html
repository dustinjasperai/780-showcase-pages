<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>GMS Webinar Slide 18</title><link rel='preconnect' href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap' rel='stylesheet'><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#00172e;--navy2:#002244;--navy3:#010a1d;--gold:#ffbb33;

html,body{font-family:'Inter',system-ui,sans-serif;background:#05060a}
.slide{position:relative;width:1280px;height:720px;overflow:hidden;margin:0 auto 26px;

padding:84px 96px;background:var(--navy);color:var(--ink)}
.slide.paper{background:var(--paper);color:var(--slate)}
.slide.deep{background:var(--navy3)}

.slide.paper .kick{color:#9a6b00}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;line-height:.96;

h2{font-family:'Bebas Neue',sans-serif;font-weight:400;line-height:.98;
font-size:70px;text-transform:uppercase;letter-spacing:.01em}
.lead{font-size:29px;line-height:1.4;font-weight:400;max-width:64ch;margin-top:24px;color:var(--ink)}
.slide.paper .lead{color:var(--slate)}
.gold{color:var(--gold)}
.num{position:absolute;right:54px;bottom:40px;font-family:'Bebas Neue',sans-serif;
font-size:26px;color:var(--mute);letter-spacing:.08em}
.brand{position:absolute;left:96px;bottom:40px;font-family:'Bebas Neue',sans-serif;

.rule{width:84px;height:6px;background:var(--gold);margin:30px 0}

ul.pts li{font-size:26px;line-height:1.35;padding-left:42px;position:relative;max-width:68ch}
ul.pts li:before{content:"";position:absolute;left:0;top:11px;width:20px;height:20px;

.two{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,187,51,.25);

.slide.paper .card{background:#fff;border:1px solid #e2d6b4;box-shadow:0 10px 30px rgba(0,23,46,.08)}
.card h3{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--gold);

.slide.paper .card h3{color:#9a6b00}
.card p{font-size:21px;line-height:1.4}
.stat{font-family:'Bebas Neue',sans-serif;font-size:150px;color:var(--gold);line-height:.9}
.sym{color:#ff8f6b;font-weight:700}
.fix{color:var(--gold);font-weight:700}
.tag{display:inline-block;font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;

.foot{font-size:15px;color:var(--mute);line-height:1.5;max-width:82ch;margin-top:38px}
.check{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.check div{font-size:24px;padding:15px 22px;background:rgba(255,255,255,.05);
border-left:5px solid var(--gold);border-radius:8px}
</style></head><body><section class='slide '><div class='kick'>Habit 5 / The Symptom</div><h2>Complexity for its own sake.</h2><div class='lead'><span class='sym'>Symptom:</span> too many drills, too much system, not enough clarity. Athletes are busy but not better.</div><div class='brand'>Gold Medal Squared</div><div class='num'>18 / 25</div></section></body></html>
