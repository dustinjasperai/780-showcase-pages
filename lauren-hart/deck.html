<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otuition Masterclass - From Generalist to Specialist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fff8f1; --panel:#ffffff; --ink:#2b1f38; --ink-soft:#4a4a4a;
    --rule:#ccb5d8; --accent:#6a428e; --accent2:#00746b; --mute:#7a6f85;
  }
  html{-webkit-font-smoothing:antialiased}
  body{font-family:'Lora',Georgia,serif;background:#efe6dc;color:var(--ink);line-height:1.6}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:54px 56px;margin:0 0 22px;min-height:480px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .slide.alt{background:var(--panel)}
  .slide.dark{background:#412857;color:#f6eefc;border-color:#412857}
  .slide.dark .kic,.slide.dark .mute{color:#ccb5d8}
  .slide.dark h2,.slide.dark h1{color:#fff}
  .kic{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:46px;
    line-height:1.1;letter-spacing:-.01em;color:var(--ink);margin-bottom:20px}
  h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:32px;
    line-height:1.15;color:var(--ink);margin-bottom:18px}
  p{font-size:19px;color:var(--ink-soft);margin-bottom:14px;max-width:62ch}
  .lead{font-size:22px;color:var(--ink)}
  .mute{color:var(--mute);font-size:16px}
  ul{list-style:none;margin:10px 0 4px}
  li{font-size:18px;color:var(--ink-soft);padding:12px 0 12px 34px;position:relative;
    border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;
    border-radius:3px;background:var(--accent2)}
  li b{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);font-weight:700}
  .pillnum{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;
    color:var(--accent);letter-spacing:.1em;margin-bottom:10px}
  .cta{background:#412857;color:#fff;border-color:#412857}
  .cta h1,.cta h2{color:#fff}
  .cta p{color:#e7d9f2}
  .btn{display:inline-block;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
    font-size:17px;background:#6a428e;color:#fff;padding:14px 26px;border-radius:10px;margin-top:16px}
  .disc{font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;color:#cbb8db;
    margin-top:26px;line-height:1.5;max-width:70ch}
  .foot{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;color:var(--mute);
    text-align:center;margin-top:10px}
  @media(max-width:640px){.slide{padding:36px 26px;min-height:380px}h1{font-size:32px}h2{font-size:24px}p{font-size:17px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Otuition &middot; built by OTs, for OTs</div>
<script>
const S=[
 {t:'title',kic:'An Otuition Masterclass for Occupational Therapists',
  h:'From Generalist to Specialist',
  p:'How to build real confidence in the high-demand clinical niches that are reshaping OT work in Australia: SDA, functional capacity assessments, home modifications and assistive technology.',
  mute:'With Lauren Hart and Therese Sullivan, practicing OTs and co-founders of Otuition.'},

 {t:'promise',cls:'alt',kic:'What you will walk away with',
  h:'A repeatable process for the work that scares you',
  p:'By the end you will know how to approach the specialist referrals that most OTs dread, and where to build the depth that makes you the clinician colleagues refer to.',
  list:['A <b>clear workflow</b> for AT, SDA, FCA and home-mod referrals','The <b>standards and templates</b> that make reports defensible','A <b>community</b> of OTs doing the same specialist work']},

 {t:'who',kic:'Who this is for',
  h:'You trained as a generalist. The work got specialised.',
  p:'New grads, early-career clinicians and senior OTs all feel it: NDIS, aged care and disability housing now ask for specialist reports and specialist decisions, often with little structured training behind them.',
  list:['<b>New grads</b> handed complex AT and home-mod referrals in week one','<b>Early-career OTs</b> writing FCAs with no template and no feedback loop','<b>Senior OTs</b> keeping pace with SDA design standards and the Aged Care Act changes']},

 {t:'trap',cls:'dark',kic:'The trap',
  h:'"I\'ll figure it out on the job."',
  p:'So you piece it together from scattered webinars, a colleague\'s old report, and a lot of second-guessing. The client still gets a result. But the stress compounds, and the gaps stay hidden until an assessment gets questioned.'},

 {t:'reframe',kic:'The reframe',
  h:'The gap is not your ability. It is the lack of a map.',
  p:'Specialist OT work is learnable and repeatable once someone shows you the components, the standards, and the exact steps. That is a training problem, not a talent problem. This masterclass is the map.'},

 {t:'demand',cls:'alt',kic:'Why now',h:'The demand is already here',
  p:'NDIS, disability housing and aged-care reform have made SDA, functional capacity and home-mod work some of the most requested OT services in the country. The referrals are arriving faster than the training to handle them.',
  mute:'The OTs who build this depth now are the ones who get the complex, higher-value work.'},

 {t:'part',kic:'Part one',h:'Why specialist niches feel so hard',
  p:'Three forces make this work feel heavier than it should:',
  list:['<b>Moving goalposts</b>: SDA design standards, NDIS rules and the Aged Care Act keep changing','<b>No structured path</b>: generic CPD teaches breadth, not the depth a real FCA or SDA report needs','<b>Isolation</b>: most OTs problem-solve alone, with no community checking their reasoning']},

 {t:'part',kic:'Part one',h:'What good actually looks like',
  p:'A confident specialist is not someone who memorised everything. It is someone with a dependable process:',
  list:['A clear <b>assessment-to-recommendation</b> workflow they trust','<b>Templates and standards</b> they can lean on under time pressure','A <b>community</b> to pressure-test the hard calls']},

 {t:'part2',cls:'dark',kic:'Part two',h:'The Otuition way: five specialist pillars',
  p:'Each pillar is a complete, practical pathway built from real Australian casework, not theory. Here is what you build.'},

 {t:'pillar',cls:'alt',num:'Pillar 01',h:'Assistive technology you can prescribe with confidence',
  p:'The Community AT Series walks you through the full assessment-to-prescription process for the equipment you actually see: beds and mattresses, wheelchairs, commodes, riser recliners and mobility scooters. No more guessing on specs or funding.'},

 {t:'pillar',num:'Pillar 02',h:'Specialist Disability Accommodation, demystified',
  p:'SDA Explained, the SDA design standards, and how to run a defensible OT SDA assessment, including video tours of built SDA dwellings so you can see the standards in the real world, not just on a page.'},

 {t:'pillar',cls:'alt',num:'Pillar 03',h:'Functional capacity assessments that hold up',
  p:'The FCA Handbook gives you the structure to conduct an assessment and write a report that stands up to scrutiny, with templates and assessment guides so you are not starting from a blank page every time.'},

 {t:'pillar',num:'Pillar 04',h:'Home modifications, from minor to complex',
  p:'How to scope, assess and document minor home modifications correctly, so the recommendation is clear, fundable and buildable, and nothing comes back to you weeks later.'},

 {t:'pillar',cls:'alt',num:'Pillar 05',h:'Practice that keeps up with the sector',
  p:'Merging Positive Behaviour Support with OT interventions, neurodiversity-affirming practice, and the Aged Care Act changes, so your clinical approach matches where the sector is heading.'},

 {t:'part3',cls:'dark',kic:'Part three',h:'What changes when you have the map',
  p:'This is the difference between surviving a specialist referral and owning it.',
  list:['You take on <b>higher-value work</b> without the dread','Your reports get <b>questioned less</b> and approved faster','You stop <b>reinventing</b> every assessment from scratch']},

 {t:'community',kic:'You are not doing this alone',h:'Knowledge shared, not hoarded',
  p:'The hardest part of specialist work is making the call with no one to check it against. Otuition pairs the courses with a community of like-minded OTs, so the tricky referral becomes a conversation instead of a solo gamble.'},

 {t:'why',cls:'alt',kic:'Why learn it here',h:'Built by OTs, for OTs',
  p:'Otuition was founded by Lauren Hart and Therese Sullivan, practicing occupational therapists who saw the need for genuinely niche OT training and a community to share it in. Over 375 occupational therapists across Australia already trust Otuition for exactly this.',
  mute:'Everything is practical, Australian-context, and made by clinicians who do this work.'},

 {t:'cta',cls:'cta',kic:'Your next step',h:'Go from generalist to specialist',
  p:'Start with one specialist course or unlock everything with the Unlimited Membership, and join a community of OTs levelling up the same way.',
  btn:'Explore the courses at otuition.com.au',
  disc:'This masterclass is educational. It shares clinical-practice frameworks and professional-development guidance for occupational therapists. No income, career, clinical, or funding outcome is guaranteed. Results vary with each clinician and context. Always apply your own professional judgement and relevant regulatory standards.'}
];
const d=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.cls?' '+s.cls:'');
  let h='';
  if(s.kic)h+='<div class="kic">'+s.kic+'</div>';
  if(s.num)h+='<div class="pillnum">'+s.num+'</div>';
  if(s.h)h+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.p)h+='<p'+(s.t==='title'||s.t==='reframe'?' class="lead"':'')+'>'+s.p+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(i=>h+='<li>'+i+'</li>');h+='</ul>';}
  if(s.btn)h+='<div><span class="btn">'+s.btn+'</span></div>';
  if(s.mute)h+='<p class="mute">'+s.mute+'</p>';
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=h;
  d.appendChild(el);
});
</script>
</body>
</html>
