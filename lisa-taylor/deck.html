<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Peaceful Powerhouse — a masterclass with Lisa Taylor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf2ea; --panel:#eae4dd; --ink:#333333; --rule:#948473; --accent:#d4aa9f; --teal:#7ebec5;
  --serif:"Lora",Georgia,serif; --sans:"Mulish",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
.wrap{max-width:960px;margin:0 auto;padding:40px 22px 90px}
.slide{background:var(--bg);border:1px solid rgba(148,132,115,.28);border-radius:18px;
  padding:54px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
  justify-content:center;position:relative;overflow:hidden}
.slide::after{content:"";position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;
  background:
    linear-gradient(120deg,transparent 48%,rgba(212,170,159,.30) 49% 51%,transparent 52%),
    linear-gradient(60deg,transparent 48%,rgba(148,132,115,.18) 49% 51%,transparent 52%);
  opacity:.5;transform:rotate(8deg);pointer-events:none}
.kicker{font-family:var(--sans);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--rule);font-weight:600;margin-bottom:18px}
.part{font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin-bottom:14px}
h1{font-family:var(--serif);font-weight:600;font-size:58px;line-height:1.04;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.1;margin-bottom:16px}
.sub{font-size:19px;line-height:1.55;color:#5a5048;margin-top:20px;max-width:40ch}
.body{font-size:19px;line-height:1.6;color:#4a423b;max-width:52ch}
.big{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1.18;max-width:20ch}
.big .a{color:var(--accent);font-style:italic}
ul{list-style:none;margin-top:10px}
li{font-size:19px;line-height:1.5;padding:14px 0 14px 34px;border-bottom:1px solid rgba(148,132,115,.22);position:relative;max-width:56ch}
li:before{content:"";position:absolute;left:0;top:22px;width:14px;height:14px;
  background:var(--accent);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
li b{font-weight:600;color:var(--ink)}
.dim b{color:var(--accent)}
.steps{margin-top:22px}
.steps div{font-size:19px;line-height:1.5;padding:10px 0;color:#4a423b}
.steps .n{display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;
  background:var(--accent);color:#fff;font-weight:600;font-size:14px;margin-right:12px}
.disc{margin-top:26px;font-size:13px;line-height:1.5;color:#8a7f73;max-width:60ch}
.n-of{position:absolute;top:22px;right:26px;font-size:12px;color:var(--rule);letter-spacing:.1em}
.foot{text-align:center;color:var(--rule);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:640px){.slide{padding:38px 26px}h1{font-size:40px}h2{font-size:30px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const S=[
 {t:'title',kicker:'A masterclass with Lisa Taylor - The Hive Holistic',
  h:'The Peaceful Powerhouse',
  sub:'How high achievers clear the inner blocks hiding behind their success, and finally feel as good as their life looks.'},

 {t:'who',h:'This hour is for you if',
  list:[
   'You have mastered the skills to thrive professionally, but your personal life does not feel as complete.',
   'You keep thinking there has to be an easier way, and you are tired of white-knuckling through the day.',
   'You know the spiritual and self-care tools you should use, but you do not actually live them day to day.',
   'You are a high achiever, a coach, or a healer, and you are quietly running on empty.']},

 {t:'who',h:'You have already tried',
  list:[
   'The workshops and the trainings. You finished most of them and still felt off.',
   'The productivity systems that promise balance and quietly add one more thing to manage.',
   'Powering through, because stopping feels like losing what you worked so hard to build.',
   'Telling yourself it will settle down after the next launch, the next quarter, the next hire.']},

 {t:'hook',big:'You do not have a discipline problem. You have a <span class="a">block</span>, and it is hiding behind everything you have already built.'},

 {t:'who',h:'The quiet cost',
  list:[
   'The 3pm crash and the second-guessing that no amount of coffee fixes.',
   'Success stories in your feed while your own wins feel strangely hollow.',
   'The relationships, including the one with yourself, that keep getting the leftovers.',
   'The vision of the life you actually want, postponed one more quarter.']},

 {t:'part',n:'Part One',h:'Everything is connected',
  body:'If you have worked non-stop to reach high levels of success but your personal life does not feel balanced, the cause is not out there. Your personal blocks are linked to your business and to the rest of your life. They are hiding behind the image of your professional success, holding you back from your full potential in every area at once.'},

 {t:'part',n:'Part One',h:'Balance is not a scheduling problem',
  body:'This is the trap that keeps high achievers stuck: we treat balance like a calendar puzzle, and try to solve a block with better time management. It never holds, because the block is energetic, not logistical. Until you see what is running underneath, every system you add just gives the block a new place to hide.'},

 {t:'hook',big:'The more time you spend hiding from your true vision, the more opportunities quietly pass that you will <span class="a">never get back</span>.'},

 {t:'part',n:'Part Two',h:'The five dimensions',
  body:'Most high achievers optimise one or two dimensions and wonder why it still does not work. A whole life runs on five, and they move together.'},

 {t:'who',h:'Where your energy actually lives',dim:true,
  list:[
   '<b>Mind</b> - the stories and beliefs running underneath your decisions.',
   '<b>Body</b> - the energy and nervous system you keep overriding.',
   '<b>Heart</b> - the relationships and emotions you postpone.',
   '<b>Spirit</b> - the intuition and inner power you already have access to.',
   '<b>Soul</b> - the vision and purpose that make the rest worth doing.']},

 {t:'part',n:'Part Two',h:'Your inner power is not woo',
  body:'Inner power is simply the part of you that already knows the answer before the spreadsheet does. High achievers are trained to override it. The work is learning to hear it again and act on it, so your decisions get lighter and your results stop being forced.'},

 {t:'part',n:'Part Two',h:'How change actually moves',
  body:'This is the sequence underneath every real shift. A new awareness creates a new perspective. A new perspective leads to new actions. New actions produce results that light you up, and your career stops costing you the life around it. Awareness first, always. You cannot push your way past a block you have not seen.'},

 {t:'hook',big:'When you tap your inner power, results in every area begin to <span class="a">flow</span> instead of being forced.'},

 {t:'part',n:'Part Three',h:'Balance you can actually live',
  body:'This is not another course to half-finish. It is a small set of practices woven into the day you already live, so balance becomes something you do, not something you schedule.'},

 {t:'who',h:'The daily reset',
  list:[
   '<b>Magical Morning</b> - an eight-minute practice to set a clear intention and point your energy before the day points it for you.',
   '<b>Breath of Fire</b> - the antidote to the afternoon crash, in place of the third coffee or the sugar reach.',
   '<b>The Hive Mind</b> - group energy, connection, and amplified intentions that make your one-on-one work far more effective.']},

 {t:'who',h:'What begins to shift',
  list:[
   'The decisions you used to agonise over get faster and quieter.',
   'Your energy holds through the afternoon instead of collapsing.',
   'The people in your life get you, not the leftovers of you.',
   'The success you built finally feels like it belongs to you.']},

 {t:'who',h:'Why me',
  list:[
   'I spent twenty years as a marketing strategist and built a successful business before burnout, divorce, and loss opened the rest of the work.',
   'I am an ICF certified coach, a shamanic healer, a Kundalini yoga teacher, and a meditation facilitator.',
   'Over the last several years I have guided hundreds of high achievers, coaches, and healers to feel as good as their life looks.',
   'I come from a family of healers. This is the work I was made for.']},

 {t:'hook',big:'You can have the success you built <span class="a">and</span> the life you actually want. You do not have to choose.'},

 {t:'cta',h:'Your next step',
  sub:'If this is the work you are ready for, the door is open.',
  steps:[
   'Join the Hive Mind Community and bring the five dimensions into the week you already live.',
   'Prefer to talk first? Book a free discovery session with me and we will map where your energy is leaking.',
   'Either way, start tomorrow with the Magical Morning practice. Eight minutes changes the trajectory of a day.'],
  disc:'This masterclass is for education only. Nothing here is medical, psychological, or financial advice, and no specific outcome, income, or result is guaranteed. Results vary from person to person. The Hive Holistic - Peaceful Powerhouses.'}
];

function render(){
 const w=document.getElementById('wrap');
 S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let html='<div class="n-of">'+(i+1)+' / '+S.length+'</div>';
  if(s.t==='title'){
   html+='<div class="kicker">'+s.kicker+'</div><h1>'+s.h+'</h1><p class="sub">'+s.sub+'</p>';
  }else if(s.t==='hook'){
   html+='<p class="big">'+s.big+'</p>';
  }else if(s.t==='part'){
   html+='<div class="part">'+s.n+'</div><h2>'+s.h+'</h2><p class="body">'+s.body+'</p>';
  }else if(s.t==='who'){
   html+='<h2>'+s.h+'</h2><ul'+(s.dim?' class="dim"':'')+'>'+s.list.map(x=>'<li class="'+(s.dim?'dim':'')+'">'+x+'</li>').join('')+'</ul>';
  }else if(s.t==='cta'){
   html+='<div class="part">The Hive Holistic</div><h2>'+s.h+'</h2><p class="body">'+s.sub+'</p>';
   html+='<div class="steps">'+s.steps.map((x,j)=>'<div><span class="n">'+(j+1)+'</span>'+x+'</div>').join('')+'</div>';
   html+='<p class="disc">'+s.disc+'</p>';
  }
  d.innerHTML=html;w.appendChild(d);
 });
 const f=document.createElement('div');f.className='foot';f.textContent='The Hive Holistic - Peaceful Powerhouses';
 w.appendChild(f);
}
render();
</script>
</body>
</html>
