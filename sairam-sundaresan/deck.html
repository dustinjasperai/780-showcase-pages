<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AI-Native Product Manager — a masterclass by Sairam Sundaresan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5ef; --panel:#ffffff; --ink:#232833; --muted:#5c6066;
    --rule:#d6d3cb; --accent:#ffbe3c; --blue:#295c9b;
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:900px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:44px 46px;margin:0 0 22px;min-height:360px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(35,40,51,.03)}
  .slide.title{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.hook{background:#fbf3dd;border-color:var(--accent)}
  .kick{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--blue);margin:0 0 16px}
  .slide.title .kick{color:var(--accent)}
  h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;margin:0 0 16px;letter-spacing:-.01em}
  p{font-size:19px;line-height:1.55;margin:0 0 14px;max-width:62ch}
  .lead{font-size:22px}
  .big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.08;letter-spacing:-.01em}
  .accentword{color:var(--blue)}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.4;padding:12px 0 12px 34px;border-top:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:19px;width:16px;height:16px;border-radius:4px;background:var(--accent)}
  .num{font-family:var(--display);font-weight:700;color:var(--blue);font-size:15px}
  .foot{margin-top:22px;font-size:14px;color:var(--muted)}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;margin-top:18px;max-width:70ch}
  .by{font-size:17px;color:var(--bg);opacity:.9;margin-top:10px}
  .cta h2{color:var(--ink)}
  .pill{display:inline-block;background:var(--accent);color:var(--ink);font-family:var(--display);
    font-weight:600;padding:12px 22px;border-radius:999px;font-size:18px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', kick:'A live masterclass', h:'The AI-Native Product Manager',
   html:`<p class="lead">Build an operating system on Claude that knows your product, so you stop starting from zero every session.</p><p class="by">with Sairam Sundaresan, author of "AI for the Rest of Us" and writer of Gradient Ascent</p>`},

  {t:'who', kick:'Who this is for', h:'You already use AI every day.',
   html:`<p>You are a product manager who opens Claude for a PRD, a discovery doc, a competitor brief. It helps, a little. Then by lunch it has forgotten your product, your users, and everything you told it this morning.</p><p>This session is for the PM who is done pasting the same context in over and over and wants a real system instead.</p>`},

  {t:'hook', cls:'hook', kick:'The reframe', h:'Most PMs use Claude like a chat box.',
   html:`<p class="big">The best ones use it like a <span class="accentword">teammate that already knows their product.</span></p><p>That difference is not a better prompt. It is an operating system.</p>`},

  {t:'part', kick:'Part one', h:'Why every session starts cold',
   html:`<p>Three things quietly cost you hours every week:</p><ul><li>Context loss. The model forgets your product the moment the window closes.</li><li>Generic output. Without your users and strategy, you get advice that fits anyone and no one.</li><li>Tools that do not talk. Your decisions live in Slack, Linear, and Notion, and your AI sees none of it.</li></ul>`},

  {t:'cost', kick:'The cost', h:'You are the context library.',
   html:`<p>Right now the memory lives in your head, and you re-key it into every chat. That is the real tax: not that AI is weak, but that you rebuild its understanding from scratch, daily.</p><p>Fix that one thing and the rest compounds.</p>`},

  {t:'part', kick:'Part two', h:'The PM Operating System',
   html:`<p class="lead">Four layers that turn Claude from a chat box into a system your product work runs on. We build the first layers together, live.</p><ul><li><span class="num">01</span>&nbsp; A context library it reads first</li><li><span class="num">02</span>&nbsp; Skills that run your PM frameworks</li><li><span class="num">03</span>&nbsp; Reviewer agents that challenge your work</li><li><span class="num">04</span>&nbsp; An enforced rule nothing ships without</li></ul>`},

  {t:'layer', kick:'Layer 01', h:'A context library',
   html:`<p>A CLAUDE.md and a small library of context Claude reads automatically, so it knows your product, your users, and your stakeholders before you type a word. Add a memory pattern and it remembers your last session instead of starting cold.</p>`},

  {t:'layer', kick:'Layer 02', h:'Skills that run your frameworks',
   html:`<p>A /discover and a /prd skill that run real PM frameworks, the Opportunity Solution Tree, a PRFAQ, on a single command. Plan mode lets you review the thinking before anything gets written. The framework runs in seconds, with your judgment still in charge.</p>`},

  {t:'layer', kick:'Layer 03', h:'Reviewers that challenge you',
   html:`<p>Four reviewer agents that read a PRD in parallel and push back, each with a job:</p><ul><li>Devil's Advocate, the case against shipping</li><li>Assumption Hunter, the beliefs you did not test</li><li>Data Reviewer, the numbers that do not hold</li><li>Compliance Reviewer, the risk you missed</li></ul>`},

  {t:'layer', kick:'Layer 04', h:'A rule that cannot be argued with',
   html:`<p>An agent can be talked out of its objection. A hook cannot. This is enforced code that blocks a PRD from shipping without your one non-negotiable section. Your standard, applied every time, with no willpower required.</p>`},

  {t:'connect', kick:'The connected system', h:'Your tools feed it live',
   html:`<p>Wire in Slack, Linear, and Notion so an engineer's constraint in a thread flows straight into your PRD, with no copy-pasting. The system stops being a sandbox and starts living where your team already works.</p>`},

  {t:'auto', kick:'While you sleep', h:'Workflows that run on a schedule',
   html:`<p>Competitor monitors, sprint summaries, a Monday Slack digest. Once the skills and agents exist, they can run on their own and hand you the output, so the routine work is done before you open your laptop.</p>`},

  {t:'contrast', kick:'What changes', h:'A week, before and after',
   html:`<ul><li>Before: re-explain the product, write the PRD alone, hope you caught the holes.</li><li>After: Claude opens knowing the product, the frameworks run in seconds, four reviewers find the blocker, and the rule holds the line.</li></ul><p>Same you. A system doing the carrying.</p>`},

  {t:'principle', kick:'The principle', h:'Intuition first, always',
   html:`<p>This is "AI for the Rest of Us." You will not just copy a setup, you will understand why each layer works, so you can extend the system as your roadmap changes. The goal is fluency, not a one-time template.</p>`},

  {t:'plan', kick:'Your first 90 days', h:'An honest ramp',
   html:`<ul><li>Weeks 1 to 2: use it daily, feed it context every time.</li><li>Weeks 3 to 4: build a skill for every workflow you repeat twice.</li><li>Month 2 to 3: wire in your team's tools, then share it with a teammate.</li></ul>`},

  {t:'why', kick:'Why learn this from me', h:'A builder, not a hype account',
   html:`<p>Fifteen-plus years in AI research and development at Qualcomm, Intel Labs, Valeo, and NASA's Frontier Development Lab, with dozens of patents and publications. Author of "AI for the Rest of Us" (Bloomsbury). I write Gradient Ascent, read by 27,000-plus researchers, engineers, and managers across 125-plus countries. I teach the way I wish someone had taught me.</p>`},

  {t:'recap', kick:'Recap', h:'Four layers, one system',
   html:`<ul><li>Context library, so it knows your product.</li><li>Skills, so your frameworks run on command.</li><li>Reviewer agents, so your work gets challenged.</li><li>An enforced rule, so your standard always holds.</li></ul>`},

  {t:'cta', cls:'cta', kick:'Your next step', h:'Build your PM Operating System, live',
   html:`<p>Join the next live session and walk out with the first layers of your own system running on your real product, plus the intuition to extend it.</p><p><span class="pill">Reserve your seat for the live build</span></p><p class="disc">Educational session only. No income, role, promotion, or specific result is guaranteed; outcomes vary with your product, effort, and context. Examples are illustrative.</p>`}
];
const deck = document.getElementById('deck');
S.forEach(s=>{
  const sec=document.createElement('section');
  sec.className='slide'+(s.cls?(' '+s.cls):'');
  sec.innerHTML=`<p class="kick">${s.kick}</p>`+(s.h?`<h1>${s.h}</h1>`:'')+(s.html||'');
  deck.appendChild(sec);
});
</script>
</body>
</html>
