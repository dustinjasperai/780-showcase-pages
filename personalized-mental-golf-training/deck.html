<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Playing Someone Else's Mental Game — Mental Golf Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Spline+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --panel:#161e2a; --rule:#d8d2c4; --accent:#fdd600; --ink:#1b2330; --muted:#595959;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Spline Sans",system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    background:#fffdf8;border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(22,30,42,.04);
  }
  .slide.dark{background:var(--panel);color:#f6f4ef;border-color:#0e141d}
  .slide.dark .eyebrow{color:var(--accent)}
  .slide.dark .muted{color:#c3c9d2}
  .num{position:absolute;top:20px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .slide.dark .num{color:#8a93a1}
  .eyebrow{font-family:"Bricolage Grotesque";font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#9a7b00;margin-bottom:18px}
  .bar{width:52px;height:5px;background:var(--accent);border-radius:3px;margin-bottom:22px}
  h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"Bricolage Grotesque";font-weight:800;font-size:33px;line-height:1.1;margin-bottom:16px}
  p{font-size:19px;line-height:1.55;max-width:62ch;margin-bottom:14px}
  p.lead{font-size:22px}
  .muted{color:var(--muted)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding-left:26px;position:relative;margin-bottom:14px;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:10px;width:11px;height:11px;background:var(--accent);border-radius:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:22px 22px}
  .slide.dark .card{background:#1e2735;border-color:#2b3647}
  .card h3{font-family:"Bricolage Grotesque";font-weight:700;font-size:20px;margin-bottom:8px}
  .card p{font-size:16px;margin:0}
  .pill{display:inline-block;font-family:"Bricolage Grotesque";font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--panel);background:var(--accent);padding:5px 13px;border-radius:999px;margin-bottom:20px}
  .flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
  .flow span{font-family:"Bricolage Grotesque";font-weight:700;font-size:18px;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:12px 16px}
  .flow b{color:var(--accent);font-size:20px}
  .quote{font-family:"Bricolage Grotesque";font-weight:600;font-size:21px;line-height:1.4;max-width:60ch}
  .cite{color:var(--muted);font-size:15px;margin-top:6px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .cta-line{font-family:"Bricolage Grotesque";font-weight:800;font-size:24px;color:var(--accent);margin-top:8px}
  @media(max-width:640px){.slide{padding:34px 24px;min-height:0}h1{font-size:33px}h2{font-size:26px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'Mental Golf Type',h:'Stop Playing Someone Else’s Mental Game',sub:'A personalized approach to the mental side of golf. The strengths behind your best rounds, and how to use them when it matters most.'},
  {t:'promise',h:'What this next hour gives you',body:['Why your best golf disappears under pressure, even when your swing is fine.','Why one universal mental routine does not fit every golfer.','A mental plan built for your type, not someone else’s.']},
  {t:'who',eyebrow:'Who this is for',h:'For golfers who are better than their scorecard',body:['You strike it beautifully on the range. You know the course. You have had the rounds that prove what you are capable of.','And then, when it counts, a different golfer shows up.']},
  {t:'trap',eyebrow:'The trap',h:'You were handed one routine and told it works for everyone',body:['Breathe. Stay positive. One shot at a time. Pick a target and commit.','It is not wrong. It is just not built for you, and that is why it keeps slipping under pressure.']},
  {t:'reframe',dark:true,eyebrow:'The reframe',h:'The problem was never your focus',body:['It was that the advice was never built for the way your mind actually works.','Sixteen golfers can stand over the same putt and need sixteen different things to hole it.']},
  {t:'part',dark:true,pill:'Part One',h:'Why generic mental advice fails',body:['Your focus, your decisions, your confidence and how you respond to a bad shot are not generic. They are wired to your personality.','Give a “precise target” golfer a “target zone,” and you have just made them worse, with the exact same advice that helps someone else.']},
  {t:'gap',eyebrow:'The practice-to-course gap',h:'Same swing. Two completely different players.',body:['On the range there is no threat, so your natural strengths run free.','On the first tee the threat is real, and most golfers get pulled straight off the very strengths that make them good. The gap is mental, and it is specific to you.']},
  {t:'part',dark:true,pill:'Part Two',h:'First, find your type',body:['The Mental Fitting is a short assessment that uncovers the natural preferences behind your focus, decisions, confidence and response on the course.','It is the difference between guessing at your mental game and training it on purpose.']},
  {t:'types',eyebrow:'The 16 Mental Golf Types',h:'Different wiring, different plan',grid:[
    {h3:'Target',p:'Some golfers perform best aimed at a precise target. Others need a target zone to swing freely.'},
    {h3:'Plan',p:'Some want a clear, fixed plan. Others play their best golf with the freedom to adapt.'},
    {h3:'Focus',p:'Where your attention naturally goes under pressure is a feature of your type, not a flaw.'},
    {h3:'Response',p:'How you bounce back from a bad shot is predictable once you know your wiring.'}
  ]},
  {t:'pillars-intro',eyebrow:'The plan',h:'Three pillars, tuned to your type',body:['Once you know your type, the work organizes into three connected pillars. We train all three together, in the way that fits you.']},
  {t:'pillar',pill:'Pillar One',h:'Stress Management',body:['What happens when fear, threat or anxiety starts pulling you away from the mental strengths you normally rely on.','Your type tells us exactly how your stress shows up, and the fastest personalized way back to your strengths.']},
  {t:'pillar',pill:'Pillar Two',h:'Shot Process',body:['How you make decisions, prepare, commit, perform and respond to the result.','One repeatable process for every shot, so pressure has less room to change what you do.'],flow:['Decision','Commit','Execute','Respond']},
  {t:'pillar',pill:'Pillar Three',h:'Self-Image',body:['The beliefs and expectations you carry about yourself and the golfer you are capable of becoming.','Your self-image sets your ceiling. We rebuild it on purpose instead of letting old labels set it for you.']},
  {t:'together',dark:true,eyebrow:'How it fits together',h:'One mental game, built around you',body:['Stress Management keeps you in your strengths. The Shot Process gives you something repeatable to lean on. Self-Image raises the ceiling.','Trained together and tuned to your type, they become a mental game that holds up when the round is on the line.']},
  {t:'part',dark:true,pill:'Part Three',h:'The round that holds up under pressure',body:['A committed routine you actually trust, the same on the 1st tee as on the 18th green.','Less time fighting your own head, more time playing the golf you already have.']},
  {t:'week',eyebrow:'Where you start',h:'Week one',body:['Take the Mental Fitting and learn your type.','Learn the one stress pattern that costs you the most shots, and your personalized reset.','Run your Shot Process on a single club until it feels automatic.']},
  {t:'why',eyebrow:'Who built this',h:'Built on two decades inside the game',body:['John Weir has spent 20+ years at the intersection of psychology, mental performance and competitive golf. Board-certified hypnotist, author of The Golfer’s Guide to Mental Fitness.','Sevan Weir brought formal personality-typology training, certified in MBTI and MMTIC, into the Mental Golf Type method.']},
  {t:'reach',dark:true,eyebrow:'In the real world',h:'30,000+ golfers. 100+ countries.',quote:'“It has given me a blueprint on how to work on the most important aspect of competitive golf: the mind.”',cite:'Gordan Brixi, Challenge Tour'},
  {t:'cta',eyebrow:'Your next step',h:'Find your Mental Golf Type',body:['Start with the free Mental Fitting and discover the mental strengths behind your best golf.','From there, Core Concepts and personalized coaching build the plan around your type.'],ctaLine:'Take the free Mental Fitting',disc:'Educational content only. Golf is an individual game and results vary from player to player. Nothing here is a guarantee of scores, rankings or performance outcomes.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.dark?' dark':'');
  let h='<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.pill) h+='<span class="pill">'+s.pill+'</span>';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(!s.pill && !s.eyebrow) h+='<div class="bar"></div>';
  if(s.t==='title'){h+='<h1>'+s.h+'</h1>';}else{h+='<h2>'+s.h+'</h2>';}
  if(s.sub) h+='<p class="lead muted">'+s.sub+'</p>';
  if(s.body){
    if(s.t==='promise'||s.t==='week'){h+='<ul>'+s.body.map(b=>'<li>'+b+'</li>').join('')+'</ul>';}
    else{h+=s.body.map(b=>'<p>'+b+'</p>').join('');}
  }
  if(s.grid){h+='<div class="grid">'+s.grid.map(c=>'<div class="card"><h3>'+c.h3+'</h3><p>'+c.p+'</p></div>').join('')+'</div>';}
  if(s.flow){h+='<div class="flow">'+s.flow.map((f,k)=>'<span>'+f+'</span>'+(k<s.flow.length-1?'<b>›</b>':'')).join('')+'</div>';}
  if(s.quote){h+='<p class="quote">'+s.quote+'</p><div class="cite">'+s.cite+'</div>';}
  if(s.ctaLine){h+='<div class="cta-line">'+s.ctaLine+'</div>';}
  if(s.disc){h+='<div class="disclaimer">'+s.disc+'</div>';}
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
