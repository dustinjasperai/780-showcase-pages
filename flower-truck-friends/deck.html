<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Start a Flower Truck · Missy Rolfe, Flower Truck Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbf6ee; --panel:#f4ecdd; --rule:#e7dac4;
    --acc:#1f8f8f; --acc2:#d98236; --ink:#2a2320; --body:#4a423c; --dim:#8a8177; --cream:#f7efe1;
  }
  html,body{height:100%}
  body{background:#efe6d6;font-family:'Karla',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe6d6}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Karla',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.12;letter-spacing:-.004em}
  .t-title h1{font-size:5.0vw;max-width:93%}
  .t-normal h1{font-size:3.2vw;max-width:90%}
  .t-normal .body{font-family:'Karla',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'DM Serif Display',serif;font-style:italic;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.4;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Karla',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc2);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 10%,#143d3a 0%,#0c2321 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#143d3a 0%,#0c2321 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Karla',sans-serif;color:#e7ddca;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:6.6%;bottom:8%;width:18vw;opacity:.95}
  .corner-vf{right:6.2%;bottom:7.2%;width:8.6vw;opacity:.5}
  .brandline{font-family:'Karla',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(42,35,32,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Flower Truck Friends</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a vintage flower truck, drawn in turquoise (Rosalee) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 140 120">
  <g fill="none" stroke="#1f8f8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 86 L16 60 L40 60 L52 46 L112 46 L112 86 Z" opacity="0.92"/>
    <path d="M40 60 L52 46 L74 46 L74 60 Z" opacity="0.7"/>
    <path d="M16 86 L112 86" opacity="0.9"/>
    <circle cx="42" cy="90" r="9" opacity="0.92"/>
    <circle cx="96" cy="90" r="9" opacity="0.92"/>
    <path d="M84 46 C84 34 92 28 98 28 C96 36 92 44 84 46 Z" opacity="0.72" stroke="#d98236"/>
    <circle cx="100" cy="28" r="6" opacity="0.85" stroke="#d98236"/>
    <path d="M100 22 C104 25 104 33 100 36 C96 33 96 25 100 22 Z" opacity="0.8" stroke="#d98236"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Start a Flower Truck',sub:'Turn a vintage truck and a love of flowers into a mobile business people chase down the street, without the rent and the lease of a shop.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You can already make something beautiful. Turning it into a business that pays is the part nobody shows you.',body:'You love flowers, and people love what you make. But the leap from a hobby to income feels blurry. A storefront looks expensive and risky, selling here and there never adds up, and no one hands you the actual model for making a living from flowers.'},
 {t:'dark',title:'A shop ties you to one corner and a lease. A truck brings the flowers to where the people already are.'},

 {t:'section',idx:'Part One',title:'Why Loving Flowers Is Not a Business Yet'},
 {t:'normal',k:'The storefront trap',title:'A shop is the expensive, risky way in.',body:'A brick-and-mortar florist means a lease, rent every month whether it rains or shines, a fixed corner you hope has foot traffic, and a cooler full of flowers that spoil if they do not sell. It is a big bet made before you have a single customer, and it locks you in place.'},
 {t:'normal',k:'The hobby trap',title:'Selling a little here and there never turns into income.',body:'A table at one market, a few bouquets for friends, a booth now and then. It is lovely, and it never compounds, because there is no brand people follow and no system that brings them back. Effort goes in, a little money comes out, and it stays a hobby that happens to cost money.'},
 {t:'dark',title:'The thing missing is not your flowers. It is a model that is mobile, low-overhead, and impossible to walk past.'},

 {t:'section',idx:'Part Two',title:'The Flower Truck Method'},
 {t:'normal',k:'Pillar one, the truck',title:'The truck is the storefront, the marketing, and the brand, all at once.',body:'A vintage truck full of flowers stops people in their tracks and asks to be photographed. It is your shop with no lease, your billboard that drives itself, and a brand people remember. You go to the customers instead of praying they find your corner, and the truck does your marketing every time it parks.'},
 {t:'normal',k:'Pillar two, the flowers',title:'Source the blooms without giving away your margin.',body:'The flowers are your cost of goods, so where they come from decides whether you make money. You learn what is worth growing yourself, which blooms are easy and which will break your heart, and when to buy wholesale instead. Getting this right is the difference between a busy truck and a profitable one.'},
 {t:'normal',k:'Pillar three, the spots',title:'Park where the customers and the events already are.',body:'A truck earns by being in the right place at the right time. Standing pop-up spots, farmers markets, festivals, downtown foot traffic, and private events all become locations you can work. You build a simple rhythm of where to be and when, so the truck is in front of buyers instead of sitting idle.'},
 {t:'normal',k:'Pillar four, the revenue',title:'Get paid more than one way from a single truck.',body:'Walk-up bouquet sales are only the start. The same truck books weddings and private events, anchors brand pop-ups, and can be rented out as a backdrop for photo sessions. One asset, several income streams, so a slow day for one is a good day for another and the truck rarely sits still.'},
 {t:'dark',title:'One truck. Low overhead. Several ways to get paid. That is a business, not a hobby.'},

 {t:'section',idx:'Part Three',title:'What the First Season Looks Like'},
 {t:'normal',k:'From empty truck to booked season',title:'The build is simpler than a shop, and it moves faster.',body:'You outfit the truck to display and sell, line up your first handful of spots, and book your first events. Because the overhead is low, you can start small and let it grow, learning what your town responds to without a lease hanging over every decision. The first season is where the truck earns its keep.'},
 {t:'normal',k:'Why the model pays',title:'Low fixed costs and a brand people follow.',body:'With no rent and a truck that markets itself, more of every sale is yours to keep. People follow the truck on social media to find out where it will be next, which turns strangers into regulars and regulars into referrals. The mobility that makes it cheap is the same thing that makes it spread.'},
 {t:'dark',title:'The goal was never just to sell flowers. It was a business you actually own and love running.'},
 {t:'normal',k:'Why Missy Rolfe',title:'She built this truck, and now she helps other people build theirs.',body:'Missy runs Honeybee Flower Boutique and Rosalee, her turquoise 1967 flower truck, and hosts the Flower Truck Friends podcast where she talks with owners across the country. She has walked every step of this, from sourcing to spots to bookings, and teaches it to aspiring owners. This is the method behind all of it.'},

 {t:'section',idx:'Your Next Step',title:'Get Your Truck on the Road'},
 {t:'cta',title:'Ready to start your own flower truck?',body:'Keep going with Missy Rolfe and the Flower Truck 101 course, including a live one-on-one coaching session and the Flower Truck Friends community.',chips:['Join Flower Truck 101','Book a 1:1 session with Missy'],disc:'Educational content for aspiring and new flower truck owners. No income or business result is guaranteed. Results vary by owner, market, location, and season.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Flower Truck <b>Friends</b> · Missy Rolfe</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
