<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Four Intimacies · Deck</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#212529;font-family:'Montserrat',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;justify-content:center}
.stage{position:relative;width:min(96vw,1280px);aspect-ratio:16/9;background:#faf9f6;box-shadow:0 18px 60px rgba(0,0,0,.4)}
iframe{position:absolute;inset:0;width:1280px;height:720px;border:0;transform-origin:top left}
.bar{display:flex;align-items:center;gap:20px;margin-top:20px;color:#faf9f6;font-size:15px;letter-spacing:.08em}
button{background:#2c365d;color:#faf9f6;border:0;padding:11px 20px;border-radius:7px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.06em}
button:disabled{opacity:.4;cursor:default}.count{min-width:80px;text-align:center}
</style></head><body>
<div class="stage"><iframe id="f" src="01.html" scrolling="no"></iframe></div>
<div class="bar"><button id="prev">PREV</button><span class="count"><span id="c">1</span> / 24</span><button id="next">NEXT</button></div>
<script>
var n=24,i=1,f=document.getElementById('f'),c=document.getElementById('c'),p=document.getElementById('prev'),nx=document.getElementById('next');
function pad(x){return (x<10?'0':'')+x}
function fit(){var s=document.querySelector('.stage');f.style.transform='scale('+(s.clientWidth/1280)+')'}
function go(){f.src=pad(i)+'.html';c.textContent=i;p.disabled=(i<=1);nx.disabled=(i>=n)}
p.onclick=function(){if(i>1){i--;go()}};nx.onclick=function(){if(i<n){i++;go()}};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'&&i<n){i++;go()}if(e.key==='ArrowLeft'&&i>1){i--;go()}});
window.addEventListener('resize',fit);fit();go();
</script></body></html>
