const S=[
{t:'title',k:"A live biblical masterclass with Belah Rose",h:"The Four Intimacies",p:["Why your marriage feels stuck, and the one you fix first."],note:"Delight Your Marriage"},
{t:'text',k:"The paradox",h:"You solve hard problems all day",p:["So why is intimacy still the one thing that will not move?","You win at work, at parenting, at almost everything. Yet the closeness you want with your spouse keeps slipping. You are not broken, and neither is your marriage. You have just never been shown the frame."]},
{t:'list',k:"What this hour is",h:"A live diagnosis, not a lecture",p:["In the next hour you will score your own marriage across four kinds of intimacy, find the one costing you the most connection right now, and leave with a first step you can take this week."],b:["Live, with Belah, in real time","Biblical and practical, never clinical","You can begin even if you came alone"]},
{t:'text',k:"Who is teaching",h:"Meet Belah Rose",p:["Founder and head coach of Delight Your Marriage. For a decade she has walked hundreds of husbands and wives through biblical marriage transformation.","Host of the Delight Your Marriage Podcast, a top 1% podcast worldwide with millions of downloads, and author of a book written for the Christian wife on passion, confidence, and intimacy."]},
{t:'list',k:"The frame",h:"Four intimacies, not one",p:["Most couples fight about one thing and quietly lose the other three. A whole marriage needs all four."],b:["Emotional intimacy","Physical intimacy","Spiritual intimacy","The marriage culture that holds them together"]},
{t:'text',k:"Intimacy one",h:"Emotional",p:["Do you feel known, safe, and wanted by your spouse? Emotional intimacy is the felt sense that you are on the same team, that your inner world is welcome.","When it is low, everything else starts to feel like roommates managing a household."]},
{t:'text',k:"Intimacy two",h:"Physical",p:["The sacred, designed closeness between a husband and wife. Not a performance and not a bargaining chip.","This is the intimacy most Christian marriage teaching avoids. It is the one Belah was built to help you reclaim, with confidence and without shame."]},
{t:'text',k:"Intimacy three",h:"Spiritual",p:["Are you growing toward God together, or on separate tracks? Spiritual intimacy is praying, hoping, and being formed in the same direction.","It is the intimacy that holds when the hard seasons come."]},
{t:'text',k:"Intimacy four",h:"Marriage culture",p:["The daily climate of your home. The tone, the playfulness, the small habits that either warm the room or cool it.","Culture is the water the other three swim in. Change the culture and the others get easier."]},
{t:'list',k:"Live self-diagnosis",h:"Score each one, one to five",p:["Right now, privately, give each intimacy a score from one (cold) to five (warm). Be honest. No one sees your numbers but you."],b:["Emotional: 1 to 5","Physical: 1 to 5","Spiritual: 1 to 5","Marriage culture: 1 to 5"]},
{t:'text',k:"The insight",h:"Find your lowest",p:["The lowest number is not your failure. It is your leverage.","That one intimacy is costing you the most connection right now, and it is the one that moves the others when you work it first."]},
{t:'text',k:"Why the usual fixes stall",h:"Date nights treat symptoms",p:["Communication tips and scheduled date nights are good, but they work on the surface. They do not touch the intimacy underneath that actually went cold.","If you fix the wrong level, the warmth never lasts."]},
{t:'text',k:"The posture",h:"Sacred, not clinical",p:["Biblical intimacy is designed and good. Treated with reverence instead of embarrassment, it becomes something you can actually talk about and rebuild.","That reverence is the difference between advice that shames you and help that frees you."]},
{t:'list',k:"The signature principle",h:"You can begin alone",p:["You do not need your spouse in the room to start. A marriage can begin to turn when only one person does the work."],b:["Work it quietly, at your own pace","No ultimatums, no waiting for them to change first"]},
{t:'quote',k:"The hope",h:"When you change you",p:["When you change you, then by God’s grace, we get to witness Him transform people.","Again and again, one spouse starting has drawn the other one back. That is the hope this room is built to give you."]},
{t:'quote',k:"A real story",h:"From barely speaking to warm again",p:["One wife put it simply after doing the work: we went from barely speaking to genuinely enjoying each other again."],note:"Shared by a Delight Your Marriage community member."},
{t:'text',k:"First step",h:"If emotional is lowest",p:["Ask your spouse one open question this week and listen without fixing or defending. Thirty seconds of real curiosity rebuilds more than an hour of problem solving."]},
{t:'text',k:"First step",h:"If physical is lowest",p:["Name the shame or fear out loud to God first, then take one small step toward warmth that is given, not demanded. Desire follows safety."]},
{t:'text',k:"First step",h:"If spiritual is lowest",p:["Pray together once this week, even badly, even for sixty seconds. Shared surrender does what shared opinions never can."]},
{t:'text',k:"First step",h:"If culture is lowest",p:["Bring back one playful habit you lost. A nickname, a laugh, a ten second welcome home. Culture turns on the small things first."]},
{t:'list',k:"Who this is for",h:"Is this you?",p:["This is for the husband or wife who is tired of guessing, who still has hope, and who is willing to be the one who moves first."],b:["You want biblical help, not secular band aids","You are ready to start even if your spouse is not","You want to be walked through it, not left with a worksheet"]},
