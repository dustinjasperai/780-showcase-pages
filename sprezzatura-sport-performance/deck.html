<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 5 Pillars of Fencing Performance - A Live Masterclass with Dr. Liz Scott</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12171a; --panel:#1b2227; --rule:#2c363d; --accent:#44b2a6;
    --ink:#eef2f3; --muted:#9fb0b4; --deep:#0d1114;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--deep);color:var(--ink);font-family:"Roboto",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);opacity:.9}
  .kick{font-family:"Oswald";text-transform:uppercase;letter-spacing:.22em;font-size:13px;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:"Oswald";font-weight:700;font-size:52px;line-height:1.04;letter-spacing:.01em;margin-bottom:18px}
  h2{font-family:"Oswald";font-weight:600;font-size:38px;line-height:1.08;margin-bottom:16px}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:46ch}
  .lead.muted{color:var(--muted)}
  .big{font-family:"Oswald";font-weight:700;font-size:46px;line-height:1.08}
  .big .a{color:var(--accent)}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:3px}
  .num{font-family:"Oswald";font-weight:700;font-size:15px;color:var(--deep);background:var(--accent);
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .row{display:flex;gap:18px;align-items:flex-start;margin-top:14px}
  .row .body{font-size:19px;line-height:1.45}
  .row .body b{font-family:"Oswald";font-weight:600;letter-spacing:.02em;display:block;font-size:21px;margin-bottom:3px}
  ul.clean{list-style:none;margin-top:18px}
  ul.clean li{font-size:20px;line-height:1.5;padding:10px 0 10px 28px;position:relative;border-bottom:1px solid var(--rule)}
  ul.clean li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;background:var(--accent);transform:rotate(45deg)}
  .pillars{display:flex;gap:10px;margin-top:22px}
  .col{flex:1;background:var(--panel);border-top:3px solid var(--rule);border-radius:0 0 6px 6px;padding:16px 12px;text-align:center}
  .col.on{border-top-color:var(--accent)}
  .col .t{font-family:"Oswald";text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted)}
  .col.on .t{color:var(--accent)}
  .foot{position:absolute;right:26px;bottom:20px;font-family:"Oswald";letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--muted)}
  .page{position:absolute;left:30px;bottom:20px;font-size:11px;color:var(--muted);font-family:"Oswald";letter-spacing:.1em}
  .disc{margin-top:22px;font-size:13px;line-height:1.5;color:var(--muted);max-width:60ch}
  .cta-step{font-family:"Oswald";font-weight:600;font-size:22px;color:var(--accent);margin-top:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Dr. Liz Scott', h:'The 5 Pillars of Fencing Performance',
   lead:'Why the fencers who stop improving are almost never the ones who need to get stronger.'},

  {t:'who', kick:'Who this is for', h:'You train hard. You have hit a wall.',
   lead:'For historical and Olympic fencers who lift, drill, and condition, and still feel slow, gassed, or stuck. This is for the fencer who is doing the work and not getting the return.'},

  {t:'trap', kick:'The trap', h:'So you add more weight.',
   lead:'More barbell. More volume. Another strength block. It feels like the responsible answer, and for most fencers it is the wrong one. The body gets heavier and more tired, and the strip does not get any easier.'},

  {t:'reframe', kick:'The reframe', big:'You are not <span class="strike">under-strong</span>.<br>You are under-<span class="a">trained for power</span>.'},

  {t:'reframe2', kick:'The reframe', h:'Strength is not the limiter.',
   lead:'Most aspiring top-tier fencers are under-plyometriced, not under-strong. They have the raw force. What they are missing is the fast expression of it, the resilience to repeat it, and the recovery to bring it back tomorrow.'},

  {t:'part', kick:'Part one', h:'What actually decides a bout'},

  {t:'problem', kick:'Part one', h:'Four things, and only one is strength.',
   items:['Speed and power, the ability to express force fast and repeat it','Resilient joints that tolerate lunging, recovery, and change of direction','A nervous system that is fresh, not buried under junk fatigue','A mind that holds its shape when the score turns']},

  {t:'problem2', kick:'Part one', h:'Why the strength-only plan stalls.',
   lead:'Train only strength and you get heavier and more fatigued without getting faster. You borrow from recovery, your joints take the load, and your fifth bout feels nothing like your first. The fix is not more of one pillar. It is the whole system, in proportion.'},

  {t:'part', kick:'Part two', h:'The 5 Pillars'},

  {t:'pillarintro', kick:'Part two', h:'One system, five pillars.',
   lead:'This is the framework I use with every fencer I coach. Each pillar carries its share. Train them in balance and performance stops being a grind and starts to look, and feel, effortless.',
   on:0},

  {t:'pillar', kick:'Pillar one', num:'1', title:'Programming',
   lead:'Training designed around your real abilities, your schedule, and the demands of your weapon, not a generic template. The right dose, in the right order, so every session earns its place.', on:0},

  {t:'pillar', kick:'Pillar two', num:'2', title:'Movement',
   lead:'Speed, power, and metabolic fitness. This is where under-plyometriced fencers find the gear they were missing: explosive force you can produce fast and repeat deep into a tournament day.', on:1},

  {t:'pillar', kick:'Pillar three', num:'3', title:'Mobility and Stability',
   lead:'Joint health and usable range through the hips, trunk, and shoulders, so the lunge, the recovery, and the quick change of direction load the right tissue and not the vulnerable one.', on:2},

  {t:'pillar', kick:'Pillar four', num:'4', title:'Mental Performance',
   lead:'Focus, emotional regulation, and an elite competitive mindset. The pillar that holds the other four together when the score is against you and the room is loud.', on:3},

  {t:'pillar', kick:'Pillar five', num:'5', title:'Recovery',
   lead:'Sleep, nutrition, and the regeneration habits that turn hard training into actual adaptation. Without this pillar the other four just dig a deeper hole.', on:4},

  {t:'part', kick:'Part three', h:'Your week, rebalanced'},

  {t:'picture', kick:'Part three', h:'Effortless is engineered.',
   lead:'A balanced week is not harder, it is smarter. A little less grinding volume, a little more quality power, joints that feel ready, and sleep protected like training. The fifth bout starts to feel like the first. That is sprezzatura, the art of making the difficult look effortless, by design.'},

  {t:'whyme', kick:'Why trust this', h:'A surgeon who fences.',
   lead:'I am a sports-medicine trained orthopedic surgeon turned sport performance coach, with an MSc in strength and conditioning and NSCA certification, and I fence. I have operated on the joints I now train around. The 5 Pillars are how I coach modern and historical fencers to train smarter, perform better, and feel unstoppable.'},

  {t:'recap', kick:'The system', h:'The 5 Pillars, together.',
   lead:'Programming, Movement, Mobility and Stability, Mental Performance, Recovery. Not five programs. One system, trained in proportion to the fencer in front of me.'},

  {t:'cta', kick:'Your next step', h:'Let us map your pillars.',
   step:'Book a consultation with Liz at sprezzaturasports.com',
   lead:'We will look at where your five pillars stand today, find the one that is quietly limiting you, and lay out the plan to fix it.',
   disc:'Educational only. No specific result, ranking, or outcome is guaranteed. Results vary by athlete, effort, consistency, and starting point.'}
];

const deck = document.getElementById('deck');
const pillarNames = ['Programming','Movement','Mobility','Mental','Recovery'];
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.kick) html += `<div class="kick">${s.kick}</div>`;
  if (s.big) {
    html += `<div class="big">${s.big}</div>`;
  } else if (s.num) {
    html += `<h2>${s.title}</h2>`;
    html += `<div class="row"><div class="num">${s.num}</div><div class="body"><div class="lead">${s.lead}</div></div></div>`;
  } else {
    if (s.h) html += (s.t === 'part') ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`;
    if (s.lead) html += `<div class="lead">${s.lead}</div>`;
  }
  if (s.items) {
    html += '<ul class="clean">';
    s.items.forEach(it => html += `<li>${it}</li>`);
    html += '</ul>';
  }
  if (s.step) html += `<div class="cta-step">${s.step}</div>`;
  if (s.t === 'pillarintro' || s.t === 'pillar' || s.t === 'recap') {
    html += '<div class="pillars">';
    pillarNames.forEach((p, idx) => {
      const on = (s.t === 'recap') ? true : (s.on === idx);
      html += `<div class="col${on ? ' on' : ''}"><div class="t">${p}</div></div>`;
    });
    html += '</div>';
  }
  if (s.disc) html += `<div class="disc">${s.disc}</div>`;
  html += `<div class="page">Sprezzatura Sport Performance</div>`;
  html += `<div class="foot">${i+1} / ${S.length}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
