<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train the Dog in Front of You — Canine Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6efe9;        /* warm sand paper ground, derived from his earthy-red brand (site_scheme: light) */
    --panel:#fffaf7;     /* warm off-white panel (not pure white) */
    --rule:#e6ddd4;      /* warm hairline rule */
    --ink:#222222;       /* charcoal ink, from site dominant text color */
    --muted:#6b6560;
    --accent:#cb2127;    /* Dog Gone Smart / Canine Master brand red */
    --disp:'Raleway',system-ui,sans-serif;
    --serif:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--serif)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:var(--disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--disp);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1.12;margin-bottom:18px}
  .sub{font-size:21px;color:var(--muted);margin-top:18px;max-width:40ch}
  p.body{font-size:19px;line-height:1.6;max-width:52ch;margin-top:8px}
  ul{margin:18px 0 0 0;padding:0;list-style:none;max-width:54ch}
  li{font-size:18px;line-height:1.5;padding:10px 0 10px 28px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  li b{font-family:var(--disp);font-weight:700}
  .cover h1{font-size:58px;max-width:18ch}
  .cover .byline{font-family:var(--disp);font-weight:700;margin-top:28px;font-size:18px}
  .cover .byline span{color:var(--muted);font-weight:500}
  .section .kicker{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--accent);margin-bottom:10px}
  .section h2{font-size:44px}
  .why .cred{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .why .cred span{font-family:var(--disp);font-weight:600;font-size:14px;background:var(--bg);
    border:1px solid var(--rule);border-radius:999px;padding:8px 14px}
  .cta{background:var(--ink);color:#fff}
  .cta::before{background:var(--accent)}
  .cta h2{color:#fff}
  .cta .sub{color:#d9d4cf}
  .cta .step{font-family:var(--disp);font-weight:700;font-size:22px;margin-top:22px;color:#fff}
  .disclaimer{font-size:13px;color:#b7b1ab;margin-top:28px;max-width:60ch;line-height:1.5;font-family:var(--disp);font-weight:500}
  .n{position:absolute;right:22px;bottom:16px;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--rule)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'cover',eyebrow:'A live masterclass',h:'Train the Dog in Front of You',
   sub:'Why your dog ignores commands, and the drive-based fix.',
   by:'Chris Onthank',byd:'Canine Master'},

  {t:'point',eyebrow:'Who this is for',h:'You love your dog. You are also exhausted.',
   body:'This is for the dog parent who has tried the treats, the stern voice, the YouTube videos and the obedience class, and still cannot get a reliable come, a calm leash, or a front door that is not chaos.'},

  {t:'point',eyebrow:'The trap',h:'More commands has not worked. It will not start working.',
   list:['You add another command and the old ones still fall apart under distraction.',
         'You buy more treats and the dog performs for food, not for you.',
         'You get louder, and the dog gets more anxious, not more obedient.']},

  {t:'point',eyebrow:'The reframe',h:'Your dog is not stubborn. You are talking past his instincts.',
   body:'Every dog runs on drives he was born with. When your training ignores those drives, the dog is not defying you. He literally cannot hear you over what his instincts are telling him to do.'},

  {t:'section',k:'Part One',h:'Why generic obedience breaks'},

  {t:'point',eyebrow:'The core problem',h:'Sit, stay, come is a script. Your dog is not reading it.',
   body:'A command list treats every dog the same. But the dog chasing a squirrel, the dog lunging at the fence and the dog hiding under the table are driven by three different things. One script cannot answer all three.'},

  {t:'point',eyebrow:'The core problem',h:'Distraction is where command-only training dies.',
   body:'At home, with no competition, the commands look great. The park, the doorbell and the other dog are not disobedience problems. They are drive problems, and that is exactly where the real training begins.'},

  {t:'section',k:'Part Two',h:'The Canine Master Method'},

  {t:'point',eyebrow:'The method',h:'Two pronged: instinct plus positive motivation.',
   body:'The Canine Master Method does not fight your dog’s instincts and it does not bribe them away. It channels a dog’s natural drives and pairs them with positive, motivational learning, so the behavior you want becomes the behavior the dog wants.'},

  {t:'point',eyebrow:'Read the drive',h:'Prey drive',
   body:'The desire to chase, hunt and play. High prey drive looks like a dog that cannot stop fixating on movement. Channeled, it becomes the most powerful recall and focus tool you have.'},

  {t:'point',eyebrow:'Read the drive',h:'Pack drive',
   body:'The desire to follow a leader and belong. Pack drive is the relationship engine. When the dog sees you as the one worth following, cooperation stops being a fight.'},

  {t:'point',eyebrow:'Read the drive',h:'Defense drive',
   body:'Fight or flight. A dog high in defense drive is not aggressive by choice, he is reacting to feel safe. Read it correctly and reactivity becomes something you can lower, not something you punish.'},

  {t:'point',eyebrow:'Speak his language',h:'Think like a dog. Feel like a dog. Talk like a dog.',
   body:'If we learn to think, feel and talk like a dog, training becomes easier and far more effective. Communication and trust are the cornerstones of the relationship, and the owner’s first job is to learn the dog’s language, not to shout louder in ours.'},

  {t:'point',eyebrow:'The foundation',h:'Relationship and leadership come before obedience.',
   body:'Calm, consistent leadership is what makes every command stick. Build the bond and the trust first, and the behaviors stop being tricks you enforce and start being habits the dog offers.'},

  {t:'section',k:'Part Three',h:'Your household after the drives click'},

  {t:'point',eyebrow:'In practice',h:'Come When Called, even with distractions.',
   body:'Recall is the proof case. Instead of begging, you channel prey and pack drive into the come itself, so calling your dog becomes the most rewarding option in the field, not the least.'},

  {t:'point',eyebrow:'In practice',h:'The leash, the door and the jump, solved at the drive.',
   list:['Leash reactivity: lower defense drive instead of correcting the lunge.',
         'Jumping and door charging: redirect the drive before it fires, not after.',
         'A calmer dog and a household that finally feels like a partnership.']},

  {t:'why',eyebrow:'Why learn this from me',h:'35 years reading the dog in front of me.',
   body:'I have spent my life on the hardest cases first, aggression, fear and anxiety, the dogs other trainers gave up on.',
   cred:['35+ years with dogs','Founder, Dog Gone Smart','Dog trainer to the stars','Aggression and behavior specialist','Host, Canine Master']},

  {t:'point',eyebrow:'Recap',h:'Stop drilling commands. Start reading drives.',
   list:['Your dog runs on prey, pack and defense drive.',
         'The Canine Master Method channels those drives with positive motivation.',
         'Communication, trust and leadership make it all hold together.']},

  {t:'cta',eyebrow:'Your next step',h:'Let us train your actual dog, together.',
   sub:'If you want help applying this to your dog, the next step is one-on-one Canine Master virtual training.',
   step:'Book your Canine Master virtual training session.',
   disc:'This masterclass is for educational purposes only. Every dog and every household is different, and individual results vary. Nothing here is a guarantee of a specific outcome.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+s.t;
  let html='';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='cover'){
    html='<div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.h+'</h1>';
    if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
    html+='<div class="byline">'+s.by+' <span>/ '+s.byd+'</span></div>';
  } else if(s.t==='section'){
    html='<div class="kicker">'+s.k+'</div><h2>'+s.h+'</h2>';
  } else if(s.t==='cta'){
    html+='<h2>'+s.h+'</h2>';
    if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
    if(s.step) html+='<div class="step">'+s.step+'</div>';
    if(s.disc) html+='<div class="disclaimer">'+s.disc+'</div>';
  } else if(s.t==='why'){
    html+='<h2>'+s.h+'</h2>';
    if(s.body) html+='<p class="body">'+s.body+'</p>';
    if(s.cred){html+='<div class="cred">';s.cred.forEach(c=>html+='<span>'+c+'</span>');html+='</div>';}
  } else {
    html+='<h2>'+s.h+'</h2>';
    if(s.body) html+='<p class="body">'+s.body+'</p>';
    if(s.list){html+='<ul>';s.list.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  }
  html+='<div class="n">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
