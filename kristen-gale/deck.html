<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>How to Live at a Ten When Your Life Already Looks Like One · Kristen Gale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#384252; --panel:#f9f4ef; --rule:#55606f;
    --ink:#f9f4ef; --muted:#b9c1cd; --dim:#8a94a2;
    --accent:#ffb03a; --pop:#f665a4; --slate:#384252;
  }
  html,body{height:100%}
  body{background:#222933;font-family:'IBM Plex Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#222933}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Oswald',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ink);line-height:1.06;letter-spacing:.005em;text-transform:uppercase}
  .t-title h1{font-size:5.1vw;max-width:92%}
  .t-normal h1{font-size:3.55vw;max-width:88%;text-transform:none;font-weight:500}
  .t-normal .body{font-family:'IBM Plex Sans',sans-serif;font-size:1.44vw;color:var(--muted);margin-top:2.8vh;max-width:74%;line-height:1.62;font-weight:300}
  .sub{font-size:1.66vw;color:var(--muted);margin-top:3.4vh;max-width:76%;line-height:1.5;font-weight:300}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Oswald',sans-serif;font-size:1.1vw;font-weight:600;color:#c07a12;margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:5.1vw;max-width:92%;color:var(--slate)}
  .t-section .rule{width:17vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(135% 135% at 50% 0%,#2b333f 0%,#384252 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:90%;font-weight:500;text-transform:none;color:#f9f4ef}
  .t-dark .accent-bar{width:9vw;height:3px;background:var(--accent);margin:3.6vh auto 0}
  .t-cta{background:radial-gradient(135% 135% at 50% 100%,#2b333f 0%,#384252 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.1vw;max-width:86%;color:#f9f4ef;text-transform:none;font-weight:500}
  .chips{display:flex;gap:1.2vw;margin-top:4.4vh;flex-wrap:wrap;justify-content:center}
  .chip{background:var(--accent);color:#2b333f;border-radius:100px;padding:1.5vh 2vw;font-size:1.18vw;font-weight:600;font-family:'Oswald',sans-serif;letter-spacing:.02em;text-transform:uppercase}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-cta .disc{color:#8a94a2}
  .t-title .disc,.t-normal .disc{text-align:left}
  .brandline{font-family:'Oswald',sans-serif;font-size:1.28vw;color:var(--muted);margin-top:3.6vh;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:700}
  .ten{position:absolute;right:5.5%;bottom:2%;font-family:'Oswald',sans-serif;font-weight:700;font-size:22vw;line-height:1;color:rgba(255,176,58,.10);pointer-events:none;letter-spacing:-.02em}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(249,244,239,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:13px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Oswald',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:8.2vw}.t-section .idx{font-size:2.8vw}
    .t-dark h1{font-size:6.4vw}.t-cta h1{font-size:7vw}.chip{font-size:2.8vw}.ten{font-size:34vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">LIFE AT A TEN</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'How to Live at a Ten When Your Life Already Looks Like One',sub:'A live masterclass for high-functioning women whose life is good on paper and still quietly feels like a 7.',brand:true,ten:true},
 {t:'normal',k:'Who this is for',title:'You have the career, the family, the home. On paper, nothing is wrong.',body:'You are busy as anything. You love your people, you have built things you are proud of, you travel, you have a home. There is nothing to fix and nothing to complain about. And still, most days feel like a solid 7 when you know they could be a 10.'},
 {t:'dark',title:'You do not need a crisis to want more.'},

 {t:'section',idx:'Part One',title:'Why a Good Life Can Still Feel Like a 7'},
 {t:'normal',k:'The more trap',title:'Adding more goals will not move the number.',body:'The instinct is to want more, do more, achieve more. But a life that already looks full does not get to a 10 by piling on. More is how a 7 stays a busy, tired 7. The number moves when the life gets aligned, not heavier.'},
 {t:'normal',k:'Time is not the problem',title:'You have optimized your calendar. Your energy is what is running low.',body:'Smart, capable women manage their time to the minute and still feel flat. Time is not the resource that decides how much life you can actually build in a week. Energy is. And almost no one manages it on purpose.'},
 {t:'normal',k:'The identity gap',title:'You set goals before you decided who you actually are.',body:'Generic resolutions fail because they get set before you have named what you truly value and who you want to be. Goals borrowed from everyone else can never add up to a life that feels like yours.'},
 {t:'dark',title:'A 10 is not more. It is aligned.'},

 {t:'section',idx:'Part Two',title:'The LIFE AT A TEN Method'},
 {t:'normal',k:'Be the CEO',title:'Run your own life the way you would run a company you love.',body:'Most people drift through their own life on autopilot. Being the CEO of your life means bringing real ownership, mindset, and strategy to it on purpose, the same way you would if your life were the most important thing you were ever asked to build. Because it is.'},
 {t:'normal',k:'Energy optimization',title:'Optimize your energy, not just your calendar.',body:'Once you treat energy as the real currency, you build your week around what actually fuels you instead of just what fits. This is the difference between a schedule that survives and a life that feels good to be inside of.'},
 {t:'normal',k:'Living on brand',title:'Decide who you are and what you value, first.',body:'Before a single goal, you get clear on your identity, purpose, vision, and values. When you live on brand, your goals stop being random and start pulling in one direction, because they finally belong to you.'},
 {t:'normal',k:'Engineer enthusiasm',title:'Build the enthusiasm in so a 10 actually sticks.',body:'A 10 is not a mood you wait for. It is engineered, on purpose, into how you live, so the good does not quietly slide back to a 7 the moment life gets busy again.'},
 {t:'dark',title:'Ownership, energy, identity, enthusiasm. That is a life run at a ten.'},

 {t:'section',idx:'Part Three',title:'What a Ten Actually Looks Like'},
 {t:'normal',k:'The life this builds',title:'A life you are running on purpose, not drifting through.',body:'You wake up clear on who you are and what this season is for. Your energy goes where it counts. The good stops feeling accidental, because you are the one engineering it. Nothing needed to blow up. It just needed to be run like it mattered.'},
 {t:'dark',title:'The goal was never a different life. It was your life, at a ten.'},
 {t:'normal',k:'Why Kristen Gale',title:'I built and scaled a real company. Then I built the method for my life.',body:'I am Kristen Gale, founder of THE TEN SPOT, an award winning franchise of 30-plus beauty bars across Canada and the US, a past YPO chapter chair, a wife and a mother. LIFE AT A TEN is the operating system I built to run my own life with the same ownership I brought to the business.'},

 {t:'section',idx:'Your Next Step',title:'Go Deeper on the Method'},
 {t:'normal',k:'The LIFE AT A TEN Challenge',title:'One module, one worksheet, one action, each week.',body:'The 10 Week Challenge walks you through the whole method a step at a time, from being the CEO of your life to engineering enthusiasm. No overwhelming course library. Just one focused move a week until your life is running at a ten on purpose.'},
 {t:'cta',title:'Ready to build a life that actually feels like a ten?',chips:['Join the LIFE AT A TEN Challenge'],disc:'Educational content for personal development. No specific outcome or result is guaranteed. Results vary by person, circumstance, and effort.'},
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">LIFE AT A <b>TEN</b> · Kristen Gale</div>`;
    if(s.t==='dark') h+=`<div class="accent-bar"></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.ten) h+=`<div class="ten">10</div>`;
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
