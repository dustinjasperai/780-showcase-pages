<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Firm That Runs Without You - Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfc;      /* brand near-white ground (site_scheme: light) */
    --ink:#0e1f33;     /* brand dominant navy, 173 uses */
    --body:#4d5c6d;    /* brand slate body text */
    --accent:#ff7959;  /* brand signature coral, 25 uses */
    --panel:#ffffff;
    --rule:#e7e9ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Roboto",system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(14,31,51,.04)}
  .slide.ground{background:var(--ink);color:#fff;border-color:var(--ink)}
  .slide.ground .k{color:var(--accent)}
  .slide.ground .b{color:#c9d2db}
  .k{font-family:"Inter";font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Inter";font-weight:800;font-size:46px;line-height:1.08;color:inherit;margin-bottom:18px}
  h2{font-family:"Inter";font-weight:700;font-size:34px;line-height:1.14;color:inherit;margin-bottom:16px}
  .b{font-size:19px;line-height:1.5;color:var(--body);max-width:62ch}
  .slide.ground .b{color:#c9d2db}
  ul{list-style:none;margin-top:14px}
  li{font-size:19px;line-height:1.5;color:var(--body);padding:10px 0 10px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .step{font-family:"Inter";font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.1em;margin-bottom:10px}
  .big{font-family:"Inter";font-weight:800;font-size:60px;color:var(--accent);line-height:1}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:4px;opacity:.55}
  .em{color:var(--accent)}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:#8a97a6;max-width:66ch}
  .cta-btn{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;font-family:"Inter";
    font-weight:700;font-size:18px;padding:14px 26px;border-radius:9px}
  .num{font-family:"Inter";font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.12em;margin-bottom:12px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:"title",k:"A Free Live Masterclass for Firm Owners",h:"The Firm That Runs Without You",
  b:"How to turn an owner-dependent accounting practice into a systematized business that keeps running, and growing, when you step away. With Ryan Lazanis, CPA."},

 {t:"who",k:"Who this is for",h:"You built the firm. Now it will not let go of you.",
  b:"Solo owners and partners running accounting, bookkeeping, or tax firms who are good at the work, busy, profitable enough, and quietly exhausted. Every important decision still runs through you."},

 {t:"trap",k:"The trap",h:"You are the business.",
  b:"Clients ask for you. Staff wait on you. The quality is you. So the only lever you have left is more of your hours, and you are already out of those. Busy season is proof: the firm cannot absorb growth without taking it out of your life."},

 {t:"reframe",k:"The hard truth",h:"More clients and more hours will not free you.",
  b:"They scale the trap. A practice that depends on the owner gets heavier as it grows. The goal is not a bigger practice. It is a different kind of thing entirely: a business."},

 {t:"part",k:"Part One",h:"Practice versus business",b:"The one distinction that changes everything about how your firm grows."},

 {t:"split",k:"The core problem",h:"A dental office vs a software company.",
  b:"A dental office is a practice: when the dentist is out, it stops earning. A software company is a business: it earns whether the founder is in the room or not. Most accounting firms are run as practices. The fix is not more effort inside the practice. It is converting it into a business."},

 {t:"diag",k:"The diagnostic",h:"Start with 23 words.",
  b:"How many clients do you have, and what do you charge on average? That one question almost always surfaces the real root cause, and it is rarely a lack of automation. It is underpricing and overcommitment baked into the business model."},

 {t:"why",k:"Why this happens",h:"You were trained to do the work, not run the business.",
  b:"Accountants are trained as technical specialists, not as operators. That is the structural reason firms stall. The skills that made you a great accountant are not the skills that build a firm that runs without you. Those are learnable, in a specific order."},

 {t:"part",k:"Part Two",h:"The 6-Step Firm Freedom System",b:"The order matters. Each step only works once the one before it is in place."},

 {t:"step",step:"Step 1",h:"Standardized packages with strong margins",
  b:"Stop selling hours. Package your services so you can often raise prices while doing less work. Margin, not revenue, is what buys your time back. Everything downstream depends on getting this right first."},

 {t:"step",step:"Step 2",h:"1 to 5 high-quality deals a month",
  b:"A handful of free, high-leverage marketing moves that bring in a steady, predictable flow of the right-fit clients, so you are choosing clients instead of accepting whoever shows up."},

 {t:"step",step:"Step 3",h:"Capacity planning",
  b:"Balance the work against the team you have so nobody, including you, is drowning, even in busy season. This is how growth stops costing you your evenings."},

 {t:"step",step:"Step 4",h:"A team of A-players",
  b:"Recruit and keep strong people using repeatable job templates and interview scripts, so the firm's quality stops depending on you being in every detail."},

 {t:"step",step:"Step 5",h:"Easy-to-follow processes",
  b:"Document how the work gets done, but only after the steps above are set. Process built on a broken model just makes the wrong thing efficient. Built in order, it makes the firm repeatable without you."},

 {t:"step",step:"Step 6",h:"Focused action toward your ideal lifestyle",
  b:"Keep every decision pointed at the life you actually want from this firm, and protect it from the endless distractions that pull owners off course. The system exists to serve the lifestyle, not the other way around."},

 {t:"part",k:"Part Three",h:"Your firm once it runs on the system",b:"The same firm, rebuilt as a business you own."},

 {t:"after",k:"The outcome",h:"A firm you own, instead of a job you cannot leave.",
  b:"Prices that reflect your value. A team that carries the work. A calendar with room in it. A firm that keeps running when you take a week off, and one that could one day be sold if you choose to, because it is no longer just you."},

 {t:"whyme",k:"Why me",h:"I built this firm, then I sold it.",
  b:"From 2013 to 2018 I scaled my cloud accounting firm from zero to multiple seven figures, working about 35 hours a week, and then I sold it. Today I coach 750-plus firm owners inside Future Firm Accelerate and share what works with 10,000-plus firm leaders every week. This is the exact path I walked, taught in order."},

 {t:"cta",k:"Your next step",h:"Build the firm that runs without you.",
  b:"If you want help putting the 6-Step Firm Freedom System to work in your firm, the next step is to apply to Future Firm Accelerate. We will look at where your firm is today and whether it is the right fit.",
  btn:"Apply to Future Firm Accelerate",
  disc:"Educational content only. This masterclass shares frameworks and experience, not individualized financial, tax, legal, or business advice. Results vary from firm to firm and are not guaranteed; nothing here is a promise of specific revenue, profit, or outcomes."}
];

const deck=document.getElementById("deck");
for(const s of S){
  const el=document.createElement("section");
  el.className="slide"+((s.t==="title"||s.t==="part"||s.t==="cta")?" ground":"");
  let html="";
  if(s.k) html+='<div class="k">'+s.k+'</div>';
  if(s.step) html+='<div class="step">'+s.step+'</div>';
  if(s.t==="reframe"&&false){}
  if(s.h) html+=(s.t==="title")?'<h1>'+s.h+'</h1>':'<h2>'+s.h+'</h2>';
  if(s.b) html+='<p class="b">'+s.b+'</p>';
  if(s.btn) html+='<div><span class="cta-btn">'+s.btn+'</span></div>';
  if(s.disc) html+='<p class="disc">'+s.disc+'</p>';
  el.innerHTML=html;
  deck.appendChild(el);
}
</script>
</body>
</html>
