<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Delegates Win Best Delegation: The All-American Win System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f9fb;        /* light ground - their site is light-scheme */
    --panel:#eaf1f6;     /* light blue-gray panel */
    --ink:#212121;       /* body text */
    --ink-soft:#41505c;  /* secondary text */
    --navy:#004a7f;      /* dominant - their brand/CTA color rgb(0,74,127) */
    --teal:#82c0c7;      /* accent - from ranked_colors */
    --hair:#d3dee7;      /* hairlines */
    --display:"Libre Baskerville", Georgia, serif;
    --body:"Open Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#dfe6ec;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--hair);
    border-radius:6px;padding:60px 64px;margin:0 0 26px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,40,80,.06);
  }
  /* committee placard / nameplate motif */
  .slide::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--navy);
  }
  .plate{
    position:absolute;top:26px;right:30px;font-family:var(--body);font-size:11px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--navy);font-weight:700;
    border:1px solid var(--navy);border-radius:3px;padding:5px 10px;background:rgba(0,74,127,.04);
  }
  .kicker{font-family:var(--body);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--teal);font-weight:700;margin-bottom:18px}
  .plate ~ *{}
  h1{font-family:var(--display);font-weight:700;color:var(--navy);font-size:44px;line-height:1.12;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;color:var(--navy);font-size:32px;line-height:1.16}
  .sub{font-family:var(--display);font-style:italic;color:var(--ink-soft);font-size:20px;margin-top:20px;line-height:1.4}
  p.lead{font-size:20px;line-height:1.5;color:var(--ink);margin-top:18px;max-width:44ch}
  p.big{font-family:var(--display);font-size:30px;line-height:1.3;color:var(--navy);max-width:24ch}
  ul{margin:22px 0 0;padding:0;list-style:none}
  li{position:relative;padding:0 0 0 30px;margin:0 0 16px;font-size:18px;line-height:1.45;color:var(--ink);max-width:52ch}
  li::before{content:"";position:absolute;left:2px;top:9px;width:10px;height:10px;background:var(--teal);border-radius:2px;transform:rotate(45deg)}
  li b{color:var(--navy)}
  .pillar-no{font-family:var(--display);font-size:15px;color:var(--teal);font-weight:700;letter-spacing:.1em;margin-bottom:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
  .card{background:var(--panel);border:1px solid var(--hair);border-radius:5px;padding:22px 22px}
  .card h3{font-family:var(--display);color:var(--navy);font-size:19px;margin-bottom:8px}
  .card p{font-size:15px;line-height:1.45;color:var(--ink-soft)}
  .stat-row{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap}
  .stat b{display:block;font-family:var(--display);font-size:40px;color:var(--navy);line-height:1}
  .stat span{font-size:13px;color:var(--ink-soft);letter-spacing:.03em}
  .foot{position:absolute;left:64px;bottom:24px;font-size:11px;color:#8a97a1;letter-spacing:.04em}
  .cta{background:var(--navy);border-color:var(--navy)}
  .cta::before{background:var(--teal)}
  .cta .kicker{color:var(--teal)}
  .cta h1,.cta h2{color:#fff}
  .cta p.lead,.cta li{color:#e9f1f6}
  .cta li b{color:#fff}
  .cta .plate{color:#fff;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.08)}
  .disclaimer{margin-top:26px;font-size:12px;line-height:1.5;color:#cfe0ea;max-width:60ch;border-top:1px solid rgba(255,255,255,.25);padding-top:14px}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:24px;border:1px solid var(--hair);border-radius:5px;overflow:hidden}
  .compare>div{padding:22px 24px}
  .compare .before{background:#fff}
  .compare .after{background:var(--panel);border-left:3px solid var(--teal)}
  .compare h4{font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
  .compare .before h4{color:#98a3ac}
  .compare .after h4{color:var(--navy)}
  .compare p{font-size:16px;line-height:1.45;color:var(--ink)}
  @media(max-width:720px){.slide{padding:40px 28px}.grid,.compare{grid-template-columns:1fr}h1{font-size:32px}.foot,.plate{position:static;margin-top:18px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', plate:'Committee Prep', kicker:'A Live All-American Masterclass',
   h1:'How Delegates Win Best Delegation',
   sub:'The All-American Win System, taught live by Frank Pobutkiewicz',
   foot:'All-American Model UN'},

  {t:'who', plate:'Who this is for', kicker:'Before we start',
   h2:'This is for delegates who are done leaving the gavel to luck',
   lead:'If you have prepped for weeks and still watched an award go to someone who spoke half as much, this hour is for you and your family. We are going to look at why that happens and the system that fixes it.'},

  {t:'trap', plate:'The trap', kicker:'The honest problem',
   h2:'Most delegates work hard at the wrong things',
   list:['They memorize their country and hope it comes up.',
         'They write a speech and wait for a speakers list that never reaches them.',
         'They treat the unmoderated caucus as a break instead of the place awards are won.',
         'Effort goes up, results stay random. That is not a talent gap. It is a <b>system</b> gap.']},

  {t:'reframe', plate:'The reframe', kicker:'The shift',
   big:'Winning Model UN is not about talking the most. It is a repeatable system, and a system can be coached.'},

  {t:'roadmap', plate:'The roadmap', kicker:'What we cover today',
   h2:'The four pillars of the win system',
   grid:[['1. The Research Spine','Substance first, so every position holds up under pressure.'],
         ['2. Large Committees','The nine-part approach to the General Assembly and ECOSOC.'],
         ['3. The Crisis Method','Front of the room and back of the room, run in parallel.'],
         ['4. Own the Unmod','Bloc management, amendments, and solution sets that pass.']]},

  {t:'part', plate:'Part One', kicker:'The core problem',
   h2:'Preparation without a system is just noise',
   lead:'A delegate who knows facts but has no structure gets talked over. A delegate with a structure turns the same facts into floor control, blocs, and a resolution with their fingerprints on it. The rest of this masterclass is that structure.'},

  {t:'pillar', plate:'Pillar One', no:'PILLAR 01',
   h2:'The Research Spine',
   lead:'Before tactics, substance. We teach delegates how the UN body actually works, the recent history of the issue, and the two or three positions that will really move the room, so their argument is built on something an experienced chair respects.',
   list:['Know the committee mandate, not just the topic.',
         'Find the leverage points other delegates skip.',
         'Walk in with a position you can defend, not just recite.']},

  {t:'pillar', plate:'Pillar Two', no:'PILLAR 02',
   h2:'The Nine-Part Approach to Large Committees',
   lead:'The General Assembly and ECOSOC reward structure. Our nine-part approach gives a delegate a repeatable path through a large committee, from the opening speech to the final resolution.',
   list:['Open with a speech that earns you the room, not just a turn.',
         'Read the flow of debate and time your moves.',
         'Write resolutions the way winning delegations write them, using the most widely accepted procedure.']},

  {t:'pillar', plate:'Pillar Three', no:'PILLAR 03',
   h2:'The Crisis Method, Front of the Room',
   lead:'Crisis committees move fast and reward delegates who can hold the floor. Front of the room is public control: strong interactions, clear directives, and reading where the committee is about to go before it gets there.',
   list:['Turn interventions into momentum instead of reactions.',
         'Write directives that actually pass the room.',
         'Be the delegate the chair looks to when the crisis breaks.']},

  {t:'pillar', plate:'Pillar Three', no:'PILLAR 03b',
   h2:'The Crisis Method, Back of the Room',
   lead:'While the floor moves, the real game runs in private. Back of the room is where a delegate builds crisis arcs and sends the directives that quietly reshape the committee in their favor.',
   list:['Build a crisis arc that pays off over the whole weekend.',
         'Use private notes and directives without losing the floor.',
         'Run front and back of the room at the same time, on purpose.']},

  {t:'pillar', plate:'Pillar Four', no:'PILLAR 04',
   h2:'Own the Unmoderated Caucus',
   lead:'The unmod is where awards are decided, and most delegates waste it. We drill delegates on running the room instead of standing in it.',
   list:['Form and steer a bloc instead of joining one.',
         'Pass the amendments that get your language into the final draft.',
         'Build a solution set, so you are the delegate the resolution is named after.']},

  {t:'compare', plate:'In committee', kicker:'What changes',
   h2:'The same delegate, coached',
   before:['The uncoached weekend','Waits on the speakers list. Talks in the unmod but steers nothing. Signs a resolution someone else wrote. Goes home hoping the judges noticed.'],
   after:['The coached weekend','Opens strong and is known by the first session. Runs a bloc in the unmod. Writes language into the resolution. Wins the committee because the room ran through them.']},

  {t:'why', plate:'Why this works', kicker:'The track record',
   h2:'This is the exact system behind All-American delegations',
   lead:'Frank Pobutkiewicz has coached over 1,000 delegates and led All-American teams to Best Delegation at 42 of 45 conferences attended, with team awards from Washington DC to Budapest, Beijing, and Hyderabad. The pillars in this masterclass are that method, taught the way he coaches it live.',
   stats:[['1,000+','delegates coached'],['42 of 45','conferences won Best Delegation'],['16+','years coaching Model UN']]},

  {t:'whole', plate:'The bigger win', kicker:'Beyond the gavel',
   h2:'Model UN is a training ground for the whole student',
   lead:'The delegate who learns to research a hard problem, hold a room, and build a coalition is building the exact record that stands out later: real public speaking, real research, and real leadership. The gavel is the near-term win. The skills are the long one.'},

  {t:'how', plate:'How to train it', kicker:'Where delegates go next',
   h2:'Two ways to learn the full system',
   grid:[['The All-American Academy','A week of coached committees with a small student-to-staff ratio and daily one-on-one feedback.'],
         ['The Online Club','Weekly live workshops, monthly one-on-one coaching, and a delegate community, all year long.']]},

  {t:'cta', plate:'Your next step', kicker:'Start winning committees',
   h2:'Bring the win system to your delegate',
   lead:'If today made the game feel coachable instead of random, the next step is simple: come train the full system with All-American Model UN.',
   list:['Apply for a seat at the next All-American Academy.',
         'Or start with the Online Club and get coached every week.'],
   disclaimer:'This masterclass is educational. Model UN results depend on each delegate’s effort, preparation, and the conferences they attend. No specific award or outcome is guaranteed.'}
];

const deck = document.getElementById('deck');
function esc(x){return x;}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.plate) h+=`<div class="plate">${s.plate}</div>`;
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.no) h+=`<div class="pillar-no">${s.no}</div>`;
  if(s.h1) h+=`<h1>${s.h1}</h1>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
  if(s.big) h+=`<p class="big">${s.big}</p>`;
  if(s.lead) h+=`<p class="lead">${s.lead}</p>`;
  if(s.list){h+='<ul>';s.list.forEach(x=>h+=`<li>${x}</li>`);h+='</ul>';}
  if(s.grid){h+='<div class="grid">';s.grid.forEach(g=>h+=`<div class="card"><h3>${g[0]}</h3><p>${g[1]}</p></div>`);h+='</div>';}
  if(s.compare){h+='<div class="compare">';}
  if(s.before){h+=`<div class="compare"><div class="before"><h4>${s.before[0]}</h4><p>${s.before[1]}</p></div><div class="after"><h4>${s.after[0]}</h4><p>${s.after[1]}</p></div></div>`;}
  if(s.stats){h+='<div class="stat-row">';s.stats.forEach(st=>h+=`<div class="stat"><b>${st[0]}</b><span>${st[1]}</span></div>`);h+='</div>';}
  if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  if(s.foot) h+=`<div class="foot">${s.foot}</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
