<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Own a Revolutionary Craft Biz</title>
<link href="https://fonts.googleapis.com/css2?family=Varta:wght@400;500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#24135f;      /* Hunter's Design Studio dominant aubergine */
    --panel:#2d1a6e;   /* one step up from the ground */
    --rule:#4a4e57;    /* her slate grey */
    --accent:#ff6a39;  /* her vivid coral */
    --ink:#f4f1ea;     /* warm off-white for type on aubergine */
    --muted:#c7c0dd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border-radius:14px;padding:52px 48px;margin:0 0 22px;
    min-height:420px;display:flex;flex-direction:column;justify-content:center;
    border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden}
  /* coral running-stitch motif */
  .slide:before{content:"";position:absolute;left:48px;top:40px;width:64px;height:0;
    border-top:3px dashed var(--accent)}
  .slide.title:before{display:none}
  h1,h2,.k{font-family:"Varta","Open Sans",sans-serif}
  .k{letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-size:52px;line-height:1.08;font-weight:700;margin:14px 0 18px}
  h2{font-size:34px;line-height:1.14;font-weight:700;margin:6px 0 16px}
  p{font-size:20px;color:var(--ink);max-width:62ch}
  p.lead{font-size:23px;color:var(--muted)}
  ul{list-style:none;margin:14px 0 0}
  li{font-size:20px;padding:10px 0 10px 28px;position:relative;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:18px;width:14px;height:0;
    border-top:3px solid var(--accent)}
  .big{font-size:40px;font-weight:700;font-family:"Varta",sans-serif;line-height:1.14}
  .accent{color:var(--accent)}
  .present{margin-top:26px;color:var(--muted);font-size:17px}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .num{position:absolute;right:46px;bottom:34px;color:rgba(255,255,255,.18);
    font-family:"Varta";font-weight:700;font-size:48px}
  .title{background:linear-gradient(135deg,#24135f 0%,#1a0e47 100%);text-align:left}
  .title h1{font-size:60px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="k">A live masterclass with Sam Hunter</div>
    <h1>How to Own a Revolutionary Craft Biz</h1>
    <p class="lead">Price your work. Run real systems. Stop working for free.</p>
    <div class="present">Sam Hunter, Chief Everything Officer, Hunter's Design Studio</div>`},

  {t:'who', html:`
    <div class="k">Who this is for</div>
    <h2>For the maker who actually sells</h2>
    <p class="lead">Quilters, fiber artists, embroiderers, pattern designers. If people pay you for what you make, this is for you.</p>
    <ul>
      <li>You are good at the craft. That part was never the problem.</li>
      <li>The money part feels like guesswork, guilt, and late nights.</li>
    </ul>`},

  {t:'trap', html:`
    <div class="k">The trap</div>
    <h2>You were taught the craft. Nobody taught you the business.</h2>
    <p>Every class you ever took was about technique. Not one was about pricing, systems, or saying no. So the business runs on instinct and apology.</p>`},

  {t:'hook', html:`
    <div class="k">The hard truth</div>
    <p class="big">So you price from guilt and run on chaos.<br><span class="accent">That is not a you problem. It is a training problem.</span></p>`},

  {t:'part', html:`
    <div class="k">Part one</div>
    <h2>The core problem: the craft industry runs on your underpricing.</h2>
    <p class="lead">The low-ball is not an accident. It is the norm the whole industry is built on, and it is quietly deciding what you earn.</p>`},

  {t:'detail', html:`
    <div class="k">The low-ball norm</div>
    <h2>How much do you like being asked to work for free?</h2>
    <p>Discounts. Exposure. "Friends and family" pricing. A thousand small asks that each sound reasonable and together pay you less than minimum wage for skilled work.</p>`},

  {t:'cost', html:`
    <div class="k">What it costs you</div>
    <h2>A business that cannot pay you is a hobby with a spreadsheet.</h2>
    <ul>
      <li>Resentment creeps into the work you used to love.</li>
      <li>Burnout, because the only lever you have left is more hours.</li>
      <li>No room to invest, hire, or rest.</li>
    </ul>`},

  {t:'part', html:`
    <div class="k">Part two</div>
    <h2>The reframe: a craft business is a real business.</h2>
    <p class="lead">The revolution is not louder marketing. It is simply deciding to run yours like the real business it already is.</p>`},

  {t:'pillar', html:`
    <div class="k">Pillar one</div>
    <h2>Price for your worth.</h2>
    <p>Price from the value and the hours, not from what you are afraid the market will tolerate. Skilled creative labor is labor. Charge like it.</p>`},

  {t:'detail', html:`
    <div class="k">Pillar one, in practice</div>
    <h2>Hold your price through the discount ask.</h2>
    <ul>
      <li>A simple script for "any chance of a discount?" that keeps the relationship and the rate.</li>
      <li>Pricing that includes your time, your materials, and your expertise, in that order.</li>
    </ul>`},

  {t:'pillar', html:`
    <div class="k">Pillar two</div>
    <h2>A studio that runs on systems, not chaos.</h2>
    <p>The space and the workflow are part of the business. When they are organized on purpose, the business stops running you.</p>`},

  {t:'detail', html:`
    <div class="k">Pillar two, in practice</div>
    <h2>Get sorted.</h2>
    <ul>
      <li>Organize the physical studio around how you actually work, not a magazine photo.</li>
      <li>A workflow for making, shipping, and admin so nothing lives only in your head.</li>
    </ul>`},

  {t:'pillar', html:`
    <div class="k">Pillar three</div>
    <h2>Sustainable operations.</h2>
    <p>You are Chief Everything Officer. The goal is to do that without burning down. Boundaries and self-care are not extras. They are how the business survives you.</p>`},

  {t:'detail', html:`
    <div class="k">Pillar three, in practice</div>
    <h2>Grow it like a revolution, not a grind.</h2>
    <ul>
      <li>Say no without apology, so your yes is worth something.</li>
      <li>Lean on community, not lone hustle. The change is easier shared.</li>
    </ul>`},

  {t:'look', html:`
    <div class="k">A revolutionary week</div>
    <h2>A week that runs on purpose, not panic.</h2>
    <p>You know your numbers. Your prices hold. The studio is set up so the work flows. You take the commission you want and decline the one you dread, and the business pays you like it means it.</p>`},

  {t:'why', html:`
    <div class="k">Why me</div>
    <h2>I run three craft businesses and I teach this every week.</h2>
    <p>Hunter's Design Studio, The Embroidered Journey, and Creatively Sorted, plus the Rev Craft Biz podcast and newsletter. I have made every one of these mistakes and built the systems that fixed them.</p>`},

  {t:'recap', html:`
    <div class="k">The three pillars</div>
    <h2>Own it on purpose.</h2>
    <ul>
      <li><span class="accent">Price</span> for your worth.</li>
      <li><span class="accent">Systems</span> that run the studio for you.</li>
      <li><span class="accent">Sustainable</span> operations that do not burn you down.</li>
    </ul>`},

  {t:'cta', cls:'cta', html:`
    <div class="k">Your next step</div>
    <h2>Ready to run yours like a revolution?</h2>
    <p class="lead">Book a session with me and we will sort your pricing and your systems together.</p>
    <p class="disc">Educational only. No income, role, or specific result is guaranteed, and results vary from one business to another. Examples reflect principles, not promises.</p>`}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls||s.t||'');
  d.innerHTML = s.html + (s.t!=='title' ? '<div class="num">'+String(i+1).padStart(2,'0')+'</div>' : '');
  deck.appendChild(d);
});
</script>
</body>
</html>
