<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Doctor Frame — Nada Buhendi</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f2f3;      /* teal-tinted light ground, derived from her brand accent #68b8c1 */
    --panel:#fbfdfd;   /* near-white with a faint teal whisper */
    --rule:#d7e5e6;    /* light neutral tinted from the teal family */
    --ink:#2c2c2c;     /* her dominant charcoal */
    --muted:#6a6e72;
    --accent:#68b8c1;  /* her ranked brand teal (16 uses) */
    --stake:#e06161;   /* her ranked warm accent, used once */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1080px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:56px 56px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(44,44,44,.03)}
  .eyebrow{font-family:"Poppins";font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Bebas Neue";font-weight:400;letter-spacing:.01em;font-size:74px;line-height:.98;margin-bottom:18px}
  h2{font-family:"Bebas Neue";font-weight:400;font-size:52px;line-height:1.02;margin-bottom:16px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:40ch}
  p.lead{font-size:23px;color:var(--muted);max-width:44ch}
  .rule{height:3px;width:60px;background:var(--accent);border-radius:3px;margin:8px 0 26px}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;line-height:1.45;padding:14px 0 14px 40px;position:relative;border-bottom:1px solid var(--rule);max-width:50ch}
  li:last-child{border-bottom:0}
  li .n{position:absolute;left:0;top:14px;font-family:"Bebas Neue";font-size:26px;color:var(--accent)}
  .move{display:flex;gap:18px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--rule);max-width:52ch}
  .move:last-child{border-bottom:0}
  .move .tag{font-family:"Bebas Neue";font-size:30px;color:var(--accent);min-width:150px}
  .move p{font-size:19px;max-width:34ch}
  .quote{font-family:"Bebas Neue";font-size:46px;line-height:1.05;max-width:22ch}
  .stake{color:var(--stake)}
  .accentword{color:var(--accent)}
  .foot{margin-top:auto;padding-top:28px;color:var(--muted);font-size:14px}
  .disc{font-size:13px;color:var(--muted);max-width:60ch;margin-top:18px;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:14px;background:var(--accent);color:#0c2a2d;font-weight:600;font-size:18px;padding:16px 30px;border-radius:999px;text-decoration:none}
  .cred{display:grid;grid-template-columns:1fr 1fr;gap:14px 34px;margin-top:10px;max-width:60ch}
  .cred div{border-left:3px solid var(--accent);padding:4px 0 4px 16px;font-size:18px;line-height:1.4}
  .snum{font-family:"Bebas Neue";font-size:15px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass',h:'The Doctor Frame',lead:'How to convert interviews into offers without selling yourself.',foot:'Nada Buhendi · Unleashing Your Awesome'},

  {t:'who',eyebrow:'Who this is for',h:'You keep reaching the final round',body:'You are a multi-talented professional or leader. You get the interview. Sometimes you get to the final round. Then the offer goes to someone else, and no one can quite tell you why.',foot:'If that is you, you are in the right room.'},

  {t:'trap',eyebrow:'The trap',h:'You were taught to perform',body:'Polish the resume. Rehearse the answers. Walk in and prove you are good enough. Every piece of advice in your feed treats the interview as a test you pass. So you prepare like a student, and you show up as one.'},

  {t:'reframe',eyebrow:'The reframe',quote:'You are not there to <span class="stake">pass a test.</span> You are there to <span class="accentword">run the diagnosis.</span>',body:'Change that one thing and the entire dynamic of the room moves.'},

  {t:'section',snum:'Part One',h:'Why strong candidates lose',lead:'The problem is not your qualifications. It is the posture you walk in with.'},

  {t:'point',eyebrow:'The core problem',h:'A supplicant cannot command a premium',body:'When you interview to prove yourself, you hand the hiring manager all the authority. You answer, they judge. People do not pay a premium for someone who is auditioning. They pay a premium for someone they already trust to fix the problem.'},

  {t:'point',eyebrow:'The pattern',h:'Think about your own doctor',body:'A doctor has fifteen minutes and a stranger, and walks out with complete trust. They do not list their credentials. They ask the right questions, name what is wrong, and prescribe the fix. You leave certain you were in good hands. That is a posture. It can be learned.'},

  {t:'section',snum:'Part Two',h:'The Doctor Frame',lead:'The posture doctors use with patients, turned into a method for your next interview.'},

  {t:'moves',eyebrow:'The method',h:'Three moves',moves:[
    {tag:'Diagnose',p:'Lead with their problem, not your resume. Ask what the person they hire needs to fix in the first 90 days.'},
    {tag:'Prescribe',p:'Position yourself as the fix. Map your real experience directly onto the problem they just named.'},
    {tag:'Follow-Up',p:'Close the loop like a professional who expects to be chosen, so the offer comes to you.'}
  ]},

  {t:'point',eyebrow:'Move one',h:'Diagnose before you pitch',body:'The first real question you ask reframes who is leading. "What would the person you hire need to fix in the first 90 days?" Now they are describing their pain, and you are the one holding the chart.'},

  {t:'point',eyebrow:'Move two',h:'Prescribe, do not list',body:'Once they have named the problem out loud, you stop reciting your background and start matching it. Not "here is everything I have done," but "here is the exact thing I did that fixes what you just described."'},

  {t:'point',eyebrow:'Move three',h:'Follow up from authority',body:'A doctor does not nervously hope you booked the follow-up. They expect it. Your close carries the same quiet certainty, and it changes how the decision feels on the other side of the table.'},

  {t:'section',snum:'Part Three',h:'The same room, moved',lead:'The same candidate, the same resume, a completely different conversation.'},

  {t:'point',eyebrow:'In the room',h:'From stall to next step',body:'"We have a few more people to see" is where most candidates freeze. With the Doctor Frame you answer with a question that puts you back in the diagnosis, and the conversation keeps moving toward you instead of away.'},

  {t:'point',eyebrow:'The wider method',h:'Find your Career Sweet Spot first',body:'The Doctor Frame wins the room. The Career Sweet Spot decides which room to walk into: the intersection of what you do better than others, what you care about, and the roles that actually pay. Name that, and the interviews get easier because you finally fit.'},

  {t:'cred',eyebrow:'Why me',h:'I have run this',creds:[
    'Fifteen years in IT and agile consulting, at a six-figure leadership level, before I left to coach.',
    'One of four Master-level Career Coaches with the International Association of Career Coaches.',
    'The Doctor Frame has helped 70+ clients turn interviews into offers.',
    'The method was presented at the Scrum Alliance.'
  ]},

  {t:'point',eyebrow:'The bigger idea',h:'Unleash your awesome',body:'This was never only about one interview. It is about driving your own career instead of letting an organization decide what you are worth. Go big. You have earned the right to.'},

  {t:'recap',eyebrow:'In one line',h:'Stop auditioning. Start diagnosing.',body:'Diagnose, prescribe, follow up. The posture does the work your qualifications could not do on their own.'},

  {t:'cta',eyebrow:'Your next step',h:'Book your free Career Diagnosis',body:'A no-strings 1:1 where we map your path to the role you actually deserve, and see whether the Career Transformation Program is the right fit for you.',btn:'Book your free Career Diagnosis',foot:'nadabuhendi.com',disc:'Educational content only. Individual results vary and are not guaranteed; nothing here is a promise of a specific salary, offer, or outcome.'}
];

function esc(x){return x;}
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');d.className='slide';
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.snum) h+=`<div class="snum">${s.snum}</div>`;
  if(s.quote){ h+=`<div class="quote">${s.quote}</div><div class="rule"></div>`; }
  else if(s.h){ h+=`<h1 style="${s.t==='title'?'':'font-size:52px'}">${s.h}</h1><div class="rule"></div>`; }
  if(s.lead) h+=`<p class="lead">${s.lead}</p>`;
  if(s.body) h+=`<p>${s.body}</p>`;
  if(s.moves){ h+='<div>'; s.moves.forEach(m=>{h+=`<div class="move"><div class="tag">${m.tag}</div><p>${m.p}</p></div>`;}); h+='</div>'; }
  if(s.creds){ h+='<div class="cred">'; s.creds.forEach(c=>{h+=`<div>${c}</div>`;}); h+='</div>'; }
  if(s.btn) h+=`<div><a class="cta-btn" href="https://www.nadabuhendi.com/introduction-call/">${s.btn}</a></div>`;
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  if(s.foot) h+=`<div class="foot">${s.foot}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
