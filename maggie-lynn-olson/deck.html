<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Magnetic Method · Maggie Lynn Olson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F7F1EE; --panel:#FCF8F5; --rule:#E7DAD3;
    --accent:#795663; --ink:#011627; --soft:#4A4351; --dim:#9A8B92;
  }
  html,body{height:100%}
  body{background:#EDE3DE;font-family:'Roboto',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#EDE3DE}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.04vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Poppins',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:-.01em}
  .t-title h1{font-size:5.4vw;font-weight:700}
  .t-title h1 b{color:var(--accent);font-weight:700;font-style:italic}
  .t-normal h1{font-size:3.4vw;max-width:92%;font-weight:600}
  .t-normal h1 b{color:var(--accent);font-weight:600;font-style:italic}
  .t-normal .body{font-family:'Roboto',sans-serif;font-size:1.36vw;color:var(--soft);margin-top:2.6vh;max-width:80%;line-height:1.68;font-weight:400}
  .sub{font-family:'Roboto',sans-serif;font-size:1.58vw;color:var(--soft);margin-top:3.2vh;max-width:82%;line-height:1.56;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.16vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:92%;font-weight:600}
  .t-section .rule{width:15vw;height:2.5px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#122234 0%,#03101d 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:90%;color:#F7F1EE;font-weight:500}
  .t-dark h1 b{color:#C79BA8;font-style:italic}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#122234 0%,#03101d 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:88%;color:#F7F1EE;font-weight:600}
  .t-cta h1 b{color:#C79BA8;font-style:italic}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Poppins',sans-serif;border:1.6px solid #C79BA8;color:#E4C6CE;border-radius:100px;padding:1.3vh 1.9vw;font-size:1.12vw;font-weight:500;letter-spacing:.02em}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.88vw;color:#B6A3AB;font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mag-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-m{right:5.5%;bottom:7%;width:30vw;opacity:.9}
  .corner-m{right:6%;bottom:7.4%;width:11vw;opacity:.5}
  .brandline{font-family:'Roboto',sans-serif;font-size:1.2vw;color:var(--soft);margin-top:3.4vh;font-weight:500;letter-spacing:.03em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(121,86,99,.16);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.7vw}.t-title h1{font-size:9vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.7vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Chaos to Clarity</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: scattered marks pulled into one aligned, rising line that lands on a focal dot (chaos to clarity / a magnetic pull) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mag" viewBox="0 0 280 200">
  <g fill="none" stroke="#795663" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="34" cy="70" r="3.2" fill="#795663" stroke="none" opacity="0.5"/>
    <circle cx="52" cy="132" r="3.2" fill="#795663" stroke="none" opacity="0.5"/>
    <circle cx="78" cy="52" r="3.2" fill="#795663" stroke="none" opacity="0.5"/>
    <circle cx="96" cy="150" r="3.2" fill="#795663" stroke="none" opacity="0.45"/>
    <circle cx="120" cy="96" r="3.2" fill="#795663" stroke="none" opacity="0.45"/>
    <path d="M40 150 C 92 148, 120 132, 168 108 S 224 72, 252 58" opacity="0.9"/>
    <circle cx="252" cy="58" r="8" fill="#795663" stroke="none" opacity="0.95"/>
    <circle cx="252" cy="58" r="18" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Magnetic <b>Method</b>',sub:'A live masterclass on why selling feels like a grind when you are great at the work, and how to build a way to sell that actually fits how you are wired.',brand:true,w:'title'},
 {t:'normal',k:'Who this is for',title:'You are great at the work. <b>Selling</b> it is the part that gets loud.',body:'Too many tactics, someone else’s funnel, DMs that feel a little gross, launches that spike and then go quiet. You keep adding, tweaking, and starting over, and it still feels like pushing. You are not lazy and you are not bad at business. You are running a strategy that was built for somebody else.'},
 {t:'dark',title:'This was never a hustle problem. It is an <b>alignment</b> problem.'},

 {t:'section',idx:'Part One',title:'Why Selling Feels So Hard'},
 {t:'normal',k:'The borrowed blueprint',title:'You bought someone else’s <b>funnel</b>.',body:'The 17-step script, the guru’s exact launch plan, the same three reels everyone is posting. It works for them because it fits them. Run through you it feels forced, so you second-guess it, water it down, and stall out halfway. The tactic is not broken. It just was not built for you.'},
 {t:'normal',k:'The chaos tax',title:'More tactics is exactly why it feels like <b>chaos</b>.',body:'Every new strategy is one more thing to manage. The calendar fills up, the offer gets blurry, and the one clear next step disappears under all of it. Clarity is the thing that actually converts, and you have been quietly trading it away for volume.'},
 {t:'dark',title:'You do not need more tactics. You need a way to sell that <b>fits you</b>.'},

 {t:'section',idx:'Part Two',title:'The Magnetic Method'},
 {t:'normal',k:'The method',title:'Three moves, in <b>order</b>: clarity, alignment, conversion.',body:'The Magnetic Method has three parts and they build on each other. Get clear on the one offer and the one next step. Align how you sell to how you are actually wired, using your Human Design. Then run a simple sales system, lead generation, DMs, and a client journey, that fits you, instead of one more script you have to force.'},
 {t:'normal',k:'Move one',title:'<b>Clarity</b> equals clients.',body:'One clear offer, one clear person, one obvious next step. Most scattered businesses are not under-working, they are under-decided. When the offer is clear the selling gets quiet, because the right person already knows this is for her before you say much at all.'},
 {t:'normal',k:'Move two',title:'<b>Alignment</b> equals sales.',body:'This is the part almost nobody teaches. Your Human Design shows how you are built to make decisions, create, and sell, whether you lead best by initiating, by responding, by being invited in, or by steady consistency. Sell in that lane and it stops feeling like acting. Sell against it and every tactic feels like pushing a rock uphill.'},
 {t:'normal',k:'Move three',title:'A sales system built <b>around you</b>, not a script.',body:'Lead generation that suits how you actually show up. DM conversations that sound like you instead of a pitch template. A client journey that carries someone from stranger to buyer without the grind. Personalized to your design, not a cookie-cutter funnel or a 17-step sales script.'},
 {t:'dark',title:'Clarity equals clients. Alignment equals <b>sales</b>.'},

 {t:'section',idx:'Part Three',title:'What Changes When It Is Aligned'},
 {t:'normal',k:'The shift',title:'Same business. Selling that finally feels like <b>you</b>.',body:'Nothing has to change about your market or your craft. What changes is the pushing. You stop forcing yourself through strategies that drain you, the DMs stop feeling gross, and the income stops spiking and stalling and starts building, because you are finally selling in a way you can actually keep doing.'},
 {t:'normal',k:'Why me',title:'I built my own way <b>out of the chaos</b> first.',body:'I am Maggie Lynn Olson. I have owned and run real businesses of my own, a power-yoga studio and a photography studio, before I became a business mentor and Human Design expert for women service-based entrepreneurs. I host the Chaos to Clarity podcast, and the whole method comes from the thing I had to do myself: stop copying other people’s playbooks and build one that fit me.'},
 {t:'dark',title:'Aligned selling is not the <b>soft</b> option. It is the one that converts.'},

 {t:'section',idx:'Your next step',title:'Build Your Magnetic Method'},
 {t:'normal',k:'Where this goes',title:'The method, worked into <b>your</b> offer and your design.',body:'This masterclass is the map. Inside my world, in the Magnetic Method mentorship and my strategy sessions, we take it into your real offer, your real Human Design, and your real numbers, move by move, until clear and aligned selling is simply how your business runs.'},
 {t:'cta',title:'Ready to sell the way you are actually <b>wired</b>?',chips:['Apply for the Magnetic Method','Book a strategy session'],disc:'Educational content for women in business. No specific income, revenue, or business result is guaranteed. Results vary by situation, effort, and circumstance.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="mag-motif ${kind==='title'?'title-m':'corner-m'}"><use href="#mag"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Maggie Lynn Olson · <b>Chaos to Clarity</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.w) h+=motif(s.w);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
