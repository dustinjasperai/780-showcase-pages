<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Health-First Velocity Method — Healthy Velo</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1626; --panel:#12213a; --ink:#eef2f8; --muted:#9fb0c6;
  --rule:#243a55; --accent:#0072ef; --alert:#e23b2f;
  --head:'Rajdhani',Helvetica,sans-serif; --body:'Mulish',Helvetica,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0e14;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.deck{max-width:1040px;margin:0 auto}
.slide{position:relative;background:var(--bg);min-height:620px;padding:76px 84px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.num{position:absolute;top:30px;right:40px;font-size:13px;letter-spacing:.2em;color:var(--muted);font-weight:600}
.kick{font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:26px}
h1{font-family:var(--head);font-weight:700;font-size:62px;line-height:1.05;letter-spacing:-.01em}
h2{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.1;letter-spacing:-.01em}
.sub{font-size:24px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:84%}
.lead{font-size:28px;line-height:1.5;margin-top:22px;max-width:86%}
.big{font-family:var(--head);font-weight:700;font-size:72px;line-height:1.04;letter-spacing:-.02em}
.accent{color:var(--accent)}
.alert{color:var(--alert)}
.strike{text-decoration:line-through;text-decoration-color:var(--alert);text-decoration-thickness:4px;color:var(--muted)}
ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px}
li{font-size:23px;line-height:1.4;padding-left:40px;position:relative;max-width:88%}
li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:5px;border:3px solid var(--accent)}
.steps{margin-top:34px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:baseline;gap:20px}
.step .n{font-family:var(--head);font-weight:700;font-size:26px;color:var(--accent);min-width:42px}
.step .tx{font-size:23px;line-height:1.35}
.grid3{margin-top:36px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:28px 24px}
.card .h{font-family:var(--head);font-weight:600;font-size:24px;color:var(--ink)}
.card .d{font-size:18px;color:var(--muted);margin-top:12px;line-height:1.45}
.timeline{margin-top:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tl{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px 20px}
.tl .w{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.tl .b{font-family:var(--head);font-size:22px;font-weight:600;margin-top:10px;line-height:1.2}
.who{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.who .box{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:24px}
.who .box .l{font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:12px}
.who .yes .l{color:var(--accent)} .who .no .l{color:var(--alert)}
.who p{font-size:19px;color:var(--muted);line-height:1.5}
.stat{display:flex;gap:56px;margin-top:40px;flex-wrap:wrap}
.stat .s{display:flex;flex-direction:column}
.stat .v{font-family:var(--head);font-weight:700;font-size:52px;color:var(--accent);line-height:1}
.stat .k{font-size:17px;color:var(--muted);margin-top:10px;letter-spacing:.02em}
.disc{font-size:15px;color:var(--muted);line-height:1.5;margin-top:34px;max-width:88%;border-top:1px solid var(--rule);padding-top:20px}
.cta-line{font-family:var(--head);font-weight:600;font-size:30px;margin-top:24px;color:var(--ink)}
.motif{position:absolute;right:60px;bottom:50px;opacity:.5}
.footer-brand{position:absolute;bottom:28px;left:90px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
@media(max-width:700px){.slide{padding:48px 32px}h1{font-size:42px}h2{font-size:32px}.big{font-size:48px}.grid3,.timeline,.who{grid-template-columns:1fr}.sub,.lead,li{max-width:100%}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A Healthy Velo Masterclass', h:'The Health-First Velocity Method', sub:'How pitchers add 4 to 14 MPH in 90 days without grinding the arm. Presented by Scott Haase, founder of Healthy Velo.'},
  {t:'promise', kick:'What you will leave with', h:'By the end of this hour', items:['Why the arm is not the engine, and what actually is','The Health-First foundation most pitchers skip','The spine-dominant sequence that turns effort into MPH','A 90-day path to peak velocity that protects your arm']},
  {t:'who', kick:'Who this is for', h:'Is this you?', yes:'A pitcher stuck between 80 and 90 for months, or a parent watching their kid grind with nothing to show for it.', no:'Someone looking for a quick fix, a magic drill, or more weighted-ball volume piled on a tired arm.'},
  {t:'hook', kick:'The reframe', big:'Your arm is not<br>your <span class="accent">engine</span>.', sub:'Velocity bought with arm stress is borrowed, not earned. It shows up for a bullpen and leaves with an injury. Real velocity is built underneath the arm.'},
  {t:'part', kick:'Part One', h:'The core problem', lead:'The whole industry trains the arm harder. More weighted balls, more max-effort throws, more volume on the exact tissue that is already the bottleneck.'},
  {t:'bullets', kick:'Why plateaus happen', h:'Three velocity killers hiding in plain sight', items:['A tired, under-recovered body cannot express the speed it has','Poor sequencing leaks force before it ever reaches the ball','Chasing effort instead of intent trains strain, not speed']},
  {t:'statement', kick:'The cost', big:'More grinding is how<br>pitchers <span class="alert">break</span>.', sub:'You can add a mile or two by muscling it. You cannot keep it, and you put the arm at risk doing it. There is a better order of operations.'},
  {t:'part', kick:'Part Two', h:'The Health-First, Spine-Dominant method', lead:'Velocity is built in a sequence: health first, then the spine, then intent. Each layer unlocks the next. Skip one and the ceiling drops.'},
  {t:'cards', kick:'Pillar one', h:'Health first', cards:[{h:'Sleep',d:'9 to 10 hours a night. Recovery is where adaptation actually happens.'},{h:'Hydration',d:'Half your bodyweight in ounces, 100 to 150+ a day. Tissue quality is velocity.'},{h:'Fuel + stress',d:'Vegetables and protein every meal, breathing and recovery to keep the system calm.'}]},
  {t:'cards', kick:'Pillar two', h:'Spine-dominant mechanics', cards:[{h:'Bend',d:'Hinge at the ankle, knee and waist to load the lower half.'},{h:'Drive + rotate',d:'Hip drive down the mound, upper body rotating against a firm front leg.'},{h:'Sequence',d:'Force transfers up the chain so release is the result, not the effort.'}]},
  {t:'steps', kick:'The movement, in order', h:'How force becomes velocity', steps:[['1','Bend and load the lower half, spine stacked'],['2','Hip drive moving down the mound'],['3','Stabilize into a firm front leg'],['4','Upper body rotates against that firm leg'],['5','Ball release follows the sequential rotation']]},
  {t:'cards', kick:'Pillar three', h:'Speed is trained with intent', cards:[{h:'Learn it',d:'Understand why moving faster matters mechanically before you chase it.'},{h:'Earn it',d:'Build the strength and throwing base that lets speed be safe.'},{h:'Chuck it',d:'Then train with genuine intent. Moving faster smooths the pattern out.'}]},
  {t:'statement', kick:'The formula', big:'The <span class="accent">4 MPH</span><br>Mechanics Formula.', sub:'The PR-proven sequence every Healthy Velo pitcher runs. Health unlocks the body, the spine delivers the force, intent turns it into miles per hour.'},
  {t:'part', kick:'Part Three', h:'What the next 90 days look like', lead:'This is not a single drill. It is a staged plan that layers the method in the right order so velocity arrives and stays.'},
  {t:'timeline', kick:'The 90-day arc', h:'From stuck to peak', tiles:[['Weeks 1-2','Health reset and baseline'],['Weeks 3-5','Spine-dominant sequencing'],['Weeks 6-8','Earn the intent'],['Weeks 9-10','Chuck it, full intent'],['Weeks 11-12','Peak velocity'],['Day 90','Re-test the gun']]},
  {t:'why', kick:'Why me', h:'Scott Haase, Healthy Velo', lead:'A former left-handed pitcher who spent most of a decade as a hospital and corporate health coach and personal trainer before coaching pitching. That is where the health-first approach comes from.', stats:[['17 yrs','coaching pitchers'],['2,000+','pitchers trained'],['200+','colleges']]},
  {t:'statement', kick:'The result pitchers aim for', big:'4 to 14 MPH<br>in <span class="accent">90 days</span>.', sub:'That is the average gain our pitchers train toward with the health-first method. Added the right way, so the arm stays healthy enough to use it.'},
  {t:'who', kick:'Before you go further', h:'The honest fit', yes:'You want velocity you can keep, and you are willing to build health and sequencing before you chase radar-gun numbers.', no:'You want one trick by the weekend. The method works, but it works in order, over weeks.'},
  {t:'cta', kick:'Your next step', h:'Train the method with us', cta:'Join the Healthy Core 4 Velocity Program and we will build your 90-day health-first plan together.', disc:'Educational only. Results vary by athlete, starting point, effort, and consistency, and are not guaranteed. Nothing here is medical advice. Train under appropriate supervision and consult a qualified professional before beginning any training or nutrition program.'}
];

function slide(s,i){
  const n = `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  const kick = s.kick?`<div class="kick">${s.kick}</div>`:'';
  const brand = `<div class="footer-brand">Healthy Velo · Scott Haase</div>`;
  let inner='';
  if(s.t==='title') inner = kick + `<h1>${s.h}</h1>` + (s.sub?`<div class="sub">${s.sub}</div>`:'');
  else if(s.t==='promise'||s.t==='bullets') inner = kick + `<h2>${s.h}</h2>` + `<ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='hook'||s.t==='statement') inner = kick + `<div class="big">${s.big}</div>` + (s.sub?`<div class="sub">${s.sub}</div>`:'');
  else if(s.t==='part') inner = kick + `<h2>${s.h}</h2>` + `<div class="lead">${s.lead}</div>`;
  else if(s.t==='who') inner = kick + `<h2>${s.h}</h2>` + `<div class="who"><div class="box yes"><div class="l">This is for you if</div><p>${s.yes}</p></div><div class="box no"><div class="l">Not for you if</div><p>${s.no}</p></div></div>`;
  else if(s.t==='cards') inner = kick + `<h2>${s.h}</h2>` + `<div class="grid3">${s.cards.map(c=>`<div class="card"><div class="h">${c.h}</div><div class="d">${c.d}</div></div>`).join('')}</div>`;
  else if(s.t==='steps') inner = kick + `<h2>${s.h}</h2>` + `<div class="steps">${s.steps.map(st=>`<div class="step"><div class="n">${st[0]}</div><div class="tx">${st[1]}</div></div>`).join('')}</div>`;
  else if(s.t==='timeline') inner = kick + `<h2>${s.h}</h2>` + `<div class="timeline">${s.tiles.map(t=>`<div class="tl"><div class="w">${t[0]}</div><div class="b">${t[1]}</div></div>`).join('')}</div>`;
  else if(s.t==='why') inner = kick + `<h2>${s.h}</h2>` + `<div class="lead">${s.lead}</div>` + `<div class="stat">${s.stats.map(x=>`<div class="s"><div class="v">${x[0]}</div><div class="k">${x[1]}</div></div>`).join('')}</div>`;
  else if(s.t==='cta') inner = kick + `<h2>${s.h}</h2>` + `<div class="cta-line">${s.cta}</div>` + `<div class="disc">${s.disc}</div>`;
  return `<section class="slide">${n}${inner}${brand}</section>`;
}
document.getElementById('deck').innerHTML = S.map(slide).join('');
</script>
</body>
</html>
