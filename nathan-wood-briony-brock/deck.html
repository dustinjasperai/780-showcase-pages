<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play to Your Potential — Cricket Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8f7;        /* light ground — their site is a light scheme */
    --panel:#ffffff;
    --rule:#c9cbd0;      /* their 37-use grey hairline */
    --ink:#25272c;       /* their near-black header */
    --ink2:#4f506a;      /* their 43-use body slate */
    --accent:#1aab5d;    /* their link green */
    --accent2:#22bc77;   /* their highlight green */
    --head:'Plus Jakarta Sans',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(37,39,44,.04)}
  .slide.title{background:linear-gradient(180deg,#ffffff 0%,#f0f6f2 100%)}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.02em;margin-bottom:16px}
  h2{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.12;letter-spacing:-.01em;margin-bottom:14px}
  .sub{font-size:19px;color:var(--ink2);line-height:1.5;max-width:40ch}
  .lead{font-size:21px;color:var(--ink2);line-height:1.55;max-width:46ch}
  .big{font-family:var(--head);font-weight:700;font-size:30px;line-height:1.2;letter-spacing:-.01em;max-width:30ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:18px;color:var(--ink2);line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(26,171,93,.14)}
  .pillar-no{font-family:var(--head);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.1em}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .card{border:1px solid var(--rule);border-radius:11px;padding:22px 24px;background:#fbfdfc}
  .card h3{font-family:var(--head);font-weight:700;font-size:19px;margin-bottom:7px;color:var(--ink)}
  .card p{font-size:15px;color:var(--ink2);line-height:1.5}
  .section h2{font-size:38px}
  .section .kicker{color:var(--accent)}
  .crease{height:3px;width:72px;background:var(--accent);border-radius:2px;margin:22px 0 0}
  .foot{position:absolute}
  .cta h1{font-size:40px}
  .cta .step{font-size:18px;color:var(--ink2);line-height:1.6;margin-top:10px;max-width:48ch}
  .disc{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);font-size:13px;color:#8a8ca0;line-height:1.5;max-width:60ch}
  .who{font-size:17px;color:var(--ink2);line-height:1.55;max-width:48ch;margin-top:6px}
  .cred{font-size:17px;color:var(--ink2);line-height:1.55;max-width:50ch}
  .cred b{color:var(--ink);font-weight:600;font-family:var(--head)}
  .snum{font-family:var(--head);font-size:12px;color:#aeb1bd;position:absolute;right:26px;bottom:18px;font-weight:600}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'Cricket Mind · Mental Performance Coaching',
   h:'Play to Your Potential',
   sub:'The cricketer’s mental game when it matters most. A live masterclass for players and parents who know the talent is there and want it to show up in the middle.'},

  {t:'who',kicker:'Who this is for',
   h:'You have the shots. The nets prove it.',
   who:'This is for the cricketer who looks the part in training, then tightens up on match day. For the parent watching a talented young player get quiet before a trial. For anyone who has walked out to bat knowing their game, and left wondering where it went.'},

  {t:'lead',kicker:'The trap',
   h:'Net form is not match form.',
   lead:'The difference between the two is almost never technique. It is what happens in the ninety seconds before the first ball, and in the over after a mistake. That gap is mental, and most players are never actually coached through it.'},

  {t:'big',kicker:'A harder truth',
   h:'',
   big:'You do not need more technique. You need a mind that holds up when the game gets loud.'},

  {t:'section',kicker:'Part One',
   h:'Why good players underperform under pressure'},

  {t:'bullets',kicker:'The real problem',
   h:'Pressure does not create the problem. It reveals it.',
   items:[
     'Confidence that lives in the nets but disappears when the scoreboard is watching.',
     'Selection and expectation sitting heavier than the delivery you are actually facing.',
     'One mistake turning into three, because the mind is still playing the last ball.']},

  {t:'bullets',kicker:'The spiral',
   h:'The problem is a pattern, not a flaw.',
   items:[
     'Fear of failure narrows focus to all the wrong things.',
     'Overthinking replaces the instinct that scores runs.',
     'Without a way to reset, a slow start becomes a lost innings, then a lost season.']},

  {t:'section',kicker:'Part Two',
   h:'The Cricket Mind method'},

  {t:'lead',kicker:'How we coach it',
   h:'Eight pressure-points, coached to the player.',
   lead:'Mental performance is not one skill. We coach the eight places cricket actually tests a player, shaped around their role and the situations they find most challenging. Not motivation. Habits, strategies and behaviours they can use in practice and in matches.'},

  {t:'two',kicker:'The eight pressure-points',
   h:'What we work on',
   cards:[
     {h:'Confidence',p:'Built on evidence and routine, so it survives a low score instead of depending on the last one.'},
     {h:'Focus',p:'Attention trained onto the single cue that matters, ball by ball, instead of the whole situation at once.'},
     {h:'Pressure',p:'A repeatable way to meet the big moment calm, so the occasion does not play the shot for you.'},
     {h:'Preparation',p:'Training with purpose, so the work in the week actually transfers to Saturday.'}]},

  {t:'two',kicker:'The eight pressure-points',
   h:'What we work on',
   cards:[
     {h:'Mistakes & setbacks',p:'A reset between balls, so one error stays one error and the innings keeps going.'},
     {h:'Decision-making',p:'Clear, committed choices at the crease instead of the half-second of doubt that gets players out.'},
     {h:'Practice & learning',p:'How to practise so skill holds up under pressure, not just in ideal conditions.'},
     {h:'Selection & expectations',p:'Carrying the weight of trials and selection without letting it shrink the player.'}]},

  {t:'lead',kicker:'Shaped to the player',
   h:'A batter’s mind is not a bowler’s mind.',
   lead:'The coaching is built around the individual, their role, and the match moments they fear most. Walking out at three down. The first ball back after a run of low scores. The trial where everyone is watching. We coach the situation, not a generic idea of confidence.'},

  {t:'lead',kicker:'The principle that holds it together',
   h:'Habits over motivation.',
   lead:'Pep talks wear off by the second over. What lasts is a small set of habits a player owns: a pre-ball routine, a reset after a mistake, a way to prepare that calms the mind before the first delivery. Mental performance is something a player can develop, like any other skill.'},

  {t:'section',kicker:'Part Three',
   h:'What it looks like in the middle'},

  {t:'bullets',kicker:'What changes',
   h:'The same player, showing up.',
   items:[
     'The talent from the nets finally travelling into match day.',
     'A slow start that no longer decides the whole innings.',
     'A young player who walks out to a trial steady instead of shrinking.']},

  {t:'cred',kicker:'Why learn this from us',
   h:'Coached from inside the professional game.',
   cred:'<b>Nathan Wood</b> came through Young England and First-Class cricket with Lancashire, scoring a century at The Oval by twenty, then spent years as Head of Coach Development with England Cricket. <b>Briony Brock</b> is a mindset coach specialising in confidence, overthinking and performing under pressure, working alongside a sport psychologist and high-performance coaches. This is the mental game spoken in the language of trials, selection and real match situations, not generic psychology.'},

  {t:'cta',kicker:'Your next step',
   h:'Play to your potential.',
   step:'If this is the part of the game you have been missing, the next step is a focused one-to-one consultation with Cricket Mind. We look at what is getting in the way of your performance and build a plan you can actually use in the middle.',
   cta:'Book a consultation at cricketmind.online',
   disc:'Educational content only. Mental performance coaching supports how a player trains and competes; it does not guarantee selection, scores or any specific outcome. Results vary from player to player.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=el('div','slide '+s.t);
  if(s.kicker)d.appendChild(el('div','kicker',s.kicker));
  if(s.t==='title'){d.appendChild(el('h1',null,s.h));d.appendChild(el('div','sub',s.sub));d.appendChild(el('div','crease'));}
  else if(s.t==='section'){d.appendChild(el('h2',null,s.h));d.appendChild(el('div','crease'));}
  else if(s.t==='big'){d.appendChild(el('div','big',s.big));d.appendChild(el('div','crease'));}
  else if(s.t==='lead'){d.appendChild(el('h2',null,s.h));d.appendChild(el('div','lead',s.lead));}
  else if(s.t==='who'){d.appendChild(el('h2',null,s.h));d.appendChild(el('div','who',s.who));}
  else if(s.t==='cred'){d.appendChild(el('h2',null,s.h));d.appendChild(el('div','cred',s.cred));}
  else if(s.t==='bullets'){d.appendChild(el('h2',null,s.h));const u=el('ul');s.items.forEach(x=>u.appendChild(el('li',null,x)));d.appendChild(u);}
  else if(s.t==='two'){d.appendChild(el('h2',null,s.h));const g=el('div','two');s.cards.forEach(c=>{const cc=el('div','card');cc.appendChild(el('h3',null,c.h));cc.appendChild(el('p',null,c.p));g.appendChild(cc);});d.appendChild(g);}
  else if(s.t==='cta'){d.appendChild(el('h1',null,s.h));d.appendChild(el('div','step',s.step));d.appendChild(el('div','big',s.cta));d.appendChild(el('div','disc',s.disc));}
  d.appendChild(el('div','snum',(i+1)+' / '+S.length));
  deck.appendChild(d);
});
</script>
</body>
</html>
