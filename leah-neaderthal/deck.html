<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Land High-Value Clients Without the Hard Sell · Leah Neaderthal, Smart Gets Paid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Bitter:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7fafc; --panel:#eaf1f8; --rule:#d6e2ee;
    --acc:#2c79c4; --warm:#fc943e; --ink:#1c2733;
    --grey:#3d4a57; --dim:#8a97a4; --cream:#f2f6fa;
  }
  html,body{height:100%}
  body{background:#dde6ef;font-family:'Bitter',Georgia,serif;color:var(--grey);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dde6ef}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Oswald',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:.004em}
  .t-title h1{font-size:4.7vw;max-width:95%;color:var(--ink);text-transform:none}
  .t-normal h1{font-size:3.15vw;max-width:91%}
  .t-normal .body{font-family:'Bitter',serif;font-size:1.42vw;color:var(--grey);margin-top:3.0vh;max-width:78%;line-height:1.66;font-weight:400}
  .sub{font-family:'Bitter',serif;font-style:italic;font-size:1.9vw;color:var(--acc);margin-top:3.6vh;max-width:86%;line-height:1.44;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Oswald',sans-serif;font-size:1.05vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:93%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc) 60%,var(--warm));margin-top:3.6vh;border-radius:2px}
  .t-dark{background:radial-gradient(135% 135% at 50% 8%,#26445f 0%,#16232f 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:90%;color:var(--cream);text-transform:none}
  .t-cta{background:radial-gradient(135% 135% at 50% 100%,#26445f 0%,#16232f 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:88%;color:var(--cream);text-transform:none}
  .t-cta .body{font-family:'Bitter',serif;color:#d6e2ee;font-size:1.4vw;margin-top:3vh;max-width:74%;line-height:1.62}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-family:'Oswald',sans-serif;font-size:1.1vw;font-weight:500;letter-spacing:.02em}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-family:'Bitter',serif;font-size:.84vw;color:#9fb0c0;text-align:center;line-height:1.5}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mark{position:absolute;pointer-events:none}
  .title-mark{right:7.5%;bottom:10%;width:20vw;opacity:.9}
  .corner-mark{right:7%;bottom:8%;width:8vw;opacity:.42}
  .brandline{font-family:'Oswald',sans-serif;font-size:1.15vw;color:var(--grey);margin-top:3.8vh;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(28,39,51,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Oswald',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.0vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Smart Gets Paid</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a signature stroke settling onto a signing line, drawn in her brand blue with a warm nib -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mark" viewBox="0 0 200 90">
  <g fill="none" stroke="#2c79c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 58 C40 20 52 78 74 50 C92 28 104 74 128 46 C142 30 156 58 186 40" opacity="0.9"/>
    <path d="M12 74 L188 74" stroke="#d6e2ee" stroke-width="2" opacity="0.9"/>
    <circle cx="186" cy="40" r="3.2" fill="#fc943e" stroke="none" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'How to Land High-Value Clients Without the Hard Sell',sub:'For women consultants who are brilliant at the work, and tired of feeling salesy the moment it is time to win the business.',brand:true,mark:'title'},
 {t:'normal',k:'Who this is for',title:'You are excellent at the work. The selling is the part that feels wrong.',body:'You can walk into a room and solve a problem better than almost anyone. Then a prospect asks about working together, and something tightens. You do not want to be pushy, so you soften, you rush, and you hope they say yes. The talent was never the issue. The way you were told to sell is.'},
 {t:'dark',title:'Most consultants do not lose good clients because the work is weak. They lose them because the selling felt uncomfortable, so they cut it short.'},

 {t:'section',idx:'Part One',title:'Why Great Consultants Undercharge and Lose Good Clients'},
 {t:'normal',k:'The trap',title:'Selling like someone you are not is exactly why it feels gross.',body:'The loud, closer-style playbook was built for a different room. Push hard enough and you might get a yes, but you dread every call, and the clients it attracts are rarely the ones you want. So you avoid selling, the pipeline goes quiet, and the feast or famine begins.'},
 {t:'normal',k:'The cost',title:'When the conversation is awkward, you discount just to end it.',body:'An uncomfortable sales call almost always ends in a lower number. You price by the hour because it feels safer to defend, you drop the fee at the first pause, and you leave real money on the table on work you are proud of. The discomfort is not free. It shows up in the invoice.'},
 {t:'dark',title:'Selling is not convincing anyone of anything. It is helping the right client get clear on a decision they already want to make.'},

 {t:'section',idx:'Part Two',title:'The Roadmap to Clients'},
 {t:'normal',k:'Pillar one, price for value',title:'Charge for the value you create, not the hours you happen to spend.',body:'When you price by the hour, you cap what you can earn and you invite a negotiation about your time. Value-based pricing anchors the fee to the outcome the client actually wants. The same project, framed around its result, can be worth several times the day-rate version, and it is easier to say out loud once you can see it.'},
 {t:'normal',k:'Pillar two, the conversation',title:'A sales conversation is a series of honest questions, not a pitch.',body:'You do not need a script or a closing trick. You need a way to understand what the client is really trying to solve, to help them see the cost of leaving it unsolved, and to lay out how you would help. Done this way, the call feels like consulting, because it is. That is why it works for people who hate selling.'},
 {t:'normal',k:'Pillar three, first contact to signed proposal',title:'Every step from the first hello to a signed proposal, mapped out.',body:'Most deals stall in the gaps, the vague follow-up, the proposal that reads like a menu, the silence after you send it. When the whole path is mapped, you always know the next move: how to open, what to ask, how to write a proposal that sells, and how to follow through so a yes is the natural end.'},
 {t:'normal',k:'Pillar four, the pipeline',title:'Opportunities keep coming when you build the system, not when you get lucky.',body:'One good month is not a pipeline. You learn to keep a steady flow of the right conversations coming, from referrals, relationships, and a simple, repeatable way of staying in front of the people you want to work with, so you are choosing between clients instead of chasing them.'},
 {t:'dark',title:'When the process is clear, you stop chasing work and start choosing it.'},

 {t:'section',idx:'Part Three',title:'When Selling Finally Feels Like You'},
 {t:'normal',k:'The shift',title:'Fewer proposals, more of them signed, at numbers you used to be afraid to say.',body:'This is the quiet change most people describe. You send fewer proposals, because you qualify better, and more of them come back signed. The fees go up because you can finally connect them to value, and the whole thing feels less like performing and more like a good conversation with someone you can help.'},
 {t:'normal',k:'On your terms',title:'More of the work you love, with the clients you actually enjoy.',body:'The point was never to sell more of everything. It was to get paid well for your best work, for the clients who are a genuine fit, so the business supports your life instead of consuming it. That is what a calm, reliable way of selling actually buys you.'},
 {t:'normal',k:'Why learn this from Leah Neaderthal',title:'Someone who could not sell either, until she built a way that worked.',body:'Leah came out of corporate marketing, went independent, and at first could not sell to save her business. She nearly went back to a job. Instead she taught herself a way of selling that felt like her, and it worked: a 92 percent win rate and over three million dollars in her own consulting. Her work has been featured in the New York Times, Forbes, and Fast Company. Now she teaches it to women consultants through Smart Gets Paid.'},
 {t:'dark',title:'You do not have to become a different person to get paid what your work is worth.'},

 {t:'section',idx:'Your Next Step',title:'Go Deeper Inside The Academy'},
 {t:'normal',k:'Keep going',title:'The full method, real coaching, and a room of women doing the same thing.',body:'This hour is the overview. The Academy is where you put the whole Roadmap to Clients to work, with coaching from Leah and her team, the templates and tools that make it repeatable, and a community of women B2B consultants building the same kind of business alongside you.'},
 {t:'cta',title:'Ready to land higher-value clients without the hard sell?',body:'Apply to The Academy and put the full method to work in your business, with Leah and her team in your corner.',chips:['Apply to The Academy','Listen to the podcast'],disc:'Educational content for women running consulting businesses. No income or business result is guaranteed. Results vary by person, effort, and market.'},
];

const deck=document.getElementById('deck');
function mark(kind){return `<svg class="mark ${kind==='title'?'title-mark':'corner-mark'}"><use href="#mark"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='cta'){
    h+=`<h1>${s.title}</h1>`;
    if(s.body) h+=`<div class="body" style="color:#d6e2ee;text-align:center;max-width:74%">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">${s.chips.map(c=>`<div class="chip">${c}</div>`).join('')}</div>`;
    if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  } else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Smart Gets Paid &nbsp;&middot;&nbsp; <b>Leah Neaderthal</b></div>`;
  }
  if(s.mark) h+=mark(s.mark);
  else if(s.t!=='dark'&&s.t!=='section'&&s.t!=='cta'&&i>0) h+=mark('corner');
  d.innerHTML=h;
  deck.appendChild(d);
});

let cur=0;const slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('bar'),count=document.getElementById('count'),hint=document.getElementById('hint');
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  if(cur>0&&hint) hint.style.opacity='0';
}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1);
});
show(0);
</script>
</body>
</html>
