<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>More Profit, Less Stress — Forzani Business Education</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f5;
  --panel:#ffffff;
  --ink:#1a1a1a;
  --accent:#a67c00;
  --gold:#f1c40e;
  --deep:#1a1a1a;
  --rule:#e7e3d8;
  --grey:#5b5750;
  --dim:#8a857c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Open Sans',sans-serif;color:var(--ink);padding:26px 0 60px}
.deck{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:22px}
.slide{position:relative;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--rule);
  border-radius:16px;padding:66px 74px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 12px 34px rgba(26,26,26,.06)}
.kicker{font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);margin-bottom:26px}
h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:56px;line-height:1.05;
  letter-spacing:-.015em;color:var(--ink)}
h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:42px;line-height:1.1;
  letter-spacing:-.01em;color:var(--ink)}
.sub{font-size:26px;line-height:1.45;color:var(--grey);margin-top:22px;max-width:88%}
.body{font-size:23px;line-height:1.55;color:var(--grey);margin-top:24px;max-width:90%}
.pts{list-style:none;margin-top:28px;display:flex;flex-direction:column;gap:15px}
.pts li{font-size:22px;color:var(--ink);padding-left:40px;position:relative;line-height:1.4}
.pts li::before{content:"";position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:5px;
  background:var(--gold);box-shadow:inset 0 0 0 4px var(--panel),0 0 0 1.5px var(--accent)}
.foot{margin-top:auto;padding-top:26px;display:flex;align-items:center;gap:14px;font-family:'Montserrat',sans-serif;
  font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.foot .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.mark{position:absolute;top:60px;right:74px}
.mark svg{display:block}
/* title */
.slide.title{background:linear-gradient(160deg,#fffef9,#f7f5ee)}
.slide.title h1{font-size:72px}
.slide.title .brand{margin-top:auto;font-family:'Montserrat',sans-serif;font-weight:700;font-size:19px;
  letter-spacing:.04em;color:var(--ink)}
.slide.title .brand span{color:var(--accent)}
/* dark part-dividers */
.slide.part{background:var(--deep);border-color:var(--deep);justify-content:center}
.slide.part .num{font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold);margin-bottom:20px}
.slide.part h2{color:#fdfbf4;font-size:52px;max-width:80%}
.slide.part .rule{width:96px;height:5px;background:var(--gold);border-radius:3px;margin-top:30px}
.slide.reframe{background:var(--deep);border-color:var(--deep);justify-content:center}
.slide.reframe h1{color:#fdfbf4;font-size:58px;max-width:92%}
.slide.reframe h1 em{font-style:normal;color:var(--gold)}
.slide.reframe .sub{color:#cfc9bb;margin-top:26px}
/* pillar */
.slide.pillar{flex-direction:row;align-items:center;gap:52px}
.slide.pillar .n{font-family:'Montserrat',sans-serif;font-weight:800;font-size:150px;line-height:.9;
  color:var(--gold);flex-shrink:0;letter-spacing:-.03em}
.slide.pillar .col h2{font-size:46px}
.slide.pillar .col .body{margin-top:20px}
/* credibility */
.slide.credibility{background:linear-gradient(160deg,#fffef9,#f6f4ec)}
.slide.credibility .big{font-family:'Montserrat',sans-serif;font-weight:800;font-size:40px;color:var(--accent);
  margin-top:8px}
/* cta */
.slide.cta{background:var(--deep);border-color:var(--deep);justify-content:center}
.slide.cta .kicker{color:var(--gold)}
.slide.cta h1{color:#fdfbf4;font-size:60px}
.slide.cta .body{color:#dcd7ca}
.slide.cta .pill{display:inline-block;margin-top:30px;font-family:'Montserrat',sans-serif;font-weight:700;
  font-size:22px;color:var(--deep);background:var(--gold);border-radius:100px;padding:16px 34px;letter-spacing:.01em}
.slide.cta .disc{margin-top:auto;font-size:14px;line-height:1.5;color:#9a958a;max-width:88%}
@media(max-width:720px){
  .slide{padding:34px 30px;aspect-ratio:auto;min-height:460px}
  h1{font-size:34px}.slide.title h1{font-size:40px}.slide.reframe h1,.slide.cta h1{font-size:34px}
  h2{font-size:28px}.slide.part h2{font-size:32px}
  .sub{font-size:19px;max-width:100%}.body{font-size:18px;max-width:100%}.pts li{font-size:18px}
  .slide.pillar{flex-direction:column;align-items:flex-start;gap:14px}.slide.pillar .n{font-size:88px}
  .mark{display:none}
}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const RISE = '<svg width="64" height="30" viewBox="0 0 64 30" fill="none"><path d="M4 26 H18 V18 H32 V11 H46 V4" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/><circle cx="46" cy="4" r="4" fill="none" stroke="var(--gold)" stroke-width="3"/></svg>';
const S = [
  {t:'title', kicker:'A free masterclass for business owners', h:'More Profit, Less Stress', sub:'How to turn the business you run into an asset you could sell.'},
  {t:'who', kicker:'Who this is for', h:'You are profitable, and exhausted', body:'This is for owners of small and mid-sized businesses who make good money and still feel like the business could not survive a week without them.', pts:['You wear most of the hats','Your real numbers live in your head','You have never had the business valued']},
  {t:'trap', kicker:'The trap', h:'You did not build a business. You built a job.', body:'When every decision, sale, and fire drill runs through you, you own the busiest seat in the company. That is a job with overhead attached, not an asset you own.'},
  {t:'reframe', h:'A business that cannot run without you <em>cannot be sold.</em>', sub:'And a business that cannot be sold gives you no exit, no matter how hard you work inside it.'},
  {t:'part', num:'Part One', h:'Why working harder stops paying'},
  {t:'content', kicker:'The core problem', h:'You are flying blind on your numbers', body:'Most owners can quote last year’s revenue and almost nothing under it. Revenue is vanity. What decides whether you keep the profit, and whether the business is worth anything, is the math beneath the top line.', pts:['Do you know your true gross margin?','Does that margin cover overhead AND a target profit?','Is every cost tracked, or guessed?']},
  {t:'content', kicker:'The cost of guessing', h:'More sales through a broken model', body:'If the margin is wrong, growth just moves more money through the same leak. You feel the stress of scaling without the reward of it. The fix is not more effort. It is knowing your numbers well enough to decide on facts instead of hope.'},
  {t:'part', num:'Part Two', h:'The Forzani Freedom Formula'},
  {t:'framework', kicker:'The method', h:'Play to win, not to survive', body:'The Forzani Freedom Formula is the system we teach owners so the business plays to win instead of playing to hopefully survive. It runs on five moves, in order.'},
  {t:'pillar', n:'01', h:'Know your numbers', body:'Set the gross margin percentage that covers your operating expenses plus the net profit you actually want. Now every price and every cost has a target to answer to.'},
  {t:'pillar', n:'02', h:'Protect the margin', body:'Track every cost that touches a sale: labour, materials, shipping, waste. Small leaks, found and closed, are where most of the recoverable profit is hiding.'},
  {t:'pillar', n:'03', h:'Systemize the work', body:'Move what lives in your head into documented processes and systems, so the right thing happens whether or not you are in the room that day.'},
  {t:'pillar', n:'04', h:'Build the value', body:'Predictability is what makes a business worth more than its equipment. A company that runs on systems instead of on the owner earns real goodwill.'},
  {t:'pillar', n:'05', h:'Make it sellable', body:'Get the business ready to sell for top dollar, whether or not you ever sell it. Sellable is just another word for well built.'},
  {t:'content', kicker:'The program', h:'The 9 Accelerators', body:'Inside the More Profit Less Stress Program, the Formula becomes a done-with-you build. Nine accelerators, the tools, processes, and systems that take the guesswork out of growing the business.'},
  {t:'part', num:'Part Three', h:'A business that runs without you'},
  {t:'content', kicker:'What changes', h:'The owner becomes optional', body:'The work still gets done, to standard, on the days you are not there. Profit stops depending on your presence. That is the point where the stress drops and the value climbs at the same time.'},
  {t:'content', kicker:'The numbers that decide value', h:'What a buyer actually pays for', body:'Not your hours. A buyer pays for predictable profit and low dependence on you. Roughly, the more the business runs itself on numbers and systems, the more it is worth.', pts:['Documented, current financials','Owner-independent operations','A margin that holds under growth']},
  {t:'credibility', kicker:'Why listen to us', h:'Built at scale, then sold', big:'One store to 551 locations', body:'Greg Forzani grew the Forzani Group from a single store to 551 locations and over $1.6 billion in annual sales, before it was sold to Canadian Tire in 2011. Forzani Business Education now teaches owners that same discipline, with over 55 years of combined operating experience behind it.'},
  {t:'recap', kicker:'The whole method, in one line', h:'More Profit, Less Stress', body:'Know your numbers. Protect the margin. Systemize the work. Build the value. Make it sellable. Five moves that trade the busiest seat in the business for an asset you actually own.'},
  {t:'cta', kicker:'Your next step', h:'See the first move for your business', body:'Book a free consultation call with Forzani Business Education. We will look at your numbers together and show you the first move to more profit and less stress.', pill:'Book your free consultation', disclaimer:'Educational content only. No specific financial result or sale price is guaranteed. Results vary based on your business, your effort, and market conditions.'}
];

function esc(s){return s;}
function render(s){
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let inner = '';
  if(s.t==='title'){
    inner += '<div class="mark">'+RISE+'</div>';
    if(s.kicker) inner += '<div class="kicker">'+s.kicker+'</div>';
    inner += '<h1>'+s.h+'</h1>';
    if(s.sub) inner += '<div class="sub">'+s.sub+'</div>';
    inner += '<div class="brand">Forzani Business Education <span>&middot;</span> Greg Forzani</div>';
  } else if(s.t==='part'){
    inner += '<div class="num">'+s.num+'</div><h2>'+s.h+'</h2><div class="rule"></div>';
  } else if(s.t==='reframe'){
    inner += '<h1>'+s.h+'</h1>'+(s.sub?'<div class="sub">'+s.sub+'</div>':'');
  } else if(s.t==='pillar'){
    inner += '<div class="n">'+s.n+'</div><div class="col"><h2>'+s.h+'</h2><div class="body">'+s.body+'</div></div>';
  } else if(s.t==='cta'){
    inner += '<div class="kicker">'+s.kicker+'</div><h1>'+s.h+'</h1>';
    inner += '<div class="body">'+s.body+'</div>';
    if(s.pill) inner += '<div><span class="pill">'+s.pill+'</span></div>';
    inner += '<div class="disc">'+s.disclaimer+'</div>';
  } else {
    inner += '<div class="mark">'+RISE+'</div>';
    if(s.kicker) inner += '<div class="kicker">'+s.kicker+'</div>';
    inner += '<h2>'+s.h+'</h2>';
    if(s.big) inner += '<div class="big">'+s.big+'</div>';
    if(s.body) inner += '<div class="body">'+s.body+'</div>';
    if(s.pts){ inner += '<ul class="pts">'; s.pts.forEach(p=>inner+='<li>'+p+'</li>'); inner += '</ul>'; }
    inner += '<div class="foot"><span class="dot"></span>Forzani Business Education</div>';
  }
  el.innerHTML = inner;
  return el;
}
const deck = document.getElementById('deck');
S.forEach(s => deck.appendChild(render(s)));
</script>
</body>
</html>
