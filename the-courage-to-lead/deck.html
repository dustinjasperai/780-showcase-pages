<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Barnstormer's Flight Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8eaf4;
    --panel:#f4f6fd;
    --ink:#0d1230;
    --muted:#565c78;
    --rule:#c9cde3;
    --accent:#040654;
    --flare:#e22222;
    --head:'Barlow',system-ui,sans-serif;
    --body:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:8vh 9vw;scroll-snap-align:start;position:relative;border-bottom:1px solid var(--rule)}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px;display:flex;align-items:center;gap:12px}
  .kick::before{content:"";width:34px;height:2px;background:var(--flare);display:inline-block}
  h1{font-family:var(--head);font-weight:800;font-size:clamp(34px,6vw,68px);line-height:1.04;
    letter-spacing:-.01em;color:var(--accent)}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(26px,4vw,44px);line-height:1.1;
    letter-spacing:-.01em;color:var(--ink)}
  .lead{font-size:clamp(18px,2.1vw,24px);color:var(--muted);max-width:40ch;margin-top:22px}
  .big{font-size:clamp(20px,2.4vw,30px);max-width:32ch;margin-top:26px}
  p.body{font-size:clamp(16px,1.6vw,20px);max-width:48ch;margin-top:18px;color:var(--ink)}
  .num{font-family:var(--head);font-weight:800;font-size:15px;color:var(--flare);
    letter-spacing:.14em;margin-bottom:18px;text-transform:uppercase}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:46ch}
  li{padding-left:26px;position:relative;font-size:clamp(16px,1.7vw,21px)}
  li::before{content:"";position:absolute;left:0;top:.62em;width:11px;height:11px;
    border:2px solid var(--accent);border-radius:50%}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
  .pillar{background:var(--panel);border:1px solid var(--rule);border-top:4px solid var(--accent);
    border-radius:12px;padding:26px 22px}
  .pillar h3{font-family:var(--head);font-weight:700;font-size:21px;color:var(--accent);margin-bottom:10px}
  .pillar p{font-size:15.5px;color:var(--muted)}
  .cover h1{font-size:clamp(40px,8vw,88px)}
  .cover .sub{font-size:clamp(18px,2.4vw,27px);color:var(--ink);margin-top:26px;max-width:34ch;font-weight:600}
  .present{margin-top:46px;font-family:var(--head);font-weight:600;color:var(--muted);
    letter-spacing:.04em;font-size:16px}
  .present b{color:var(--ink)}
  .flare{color:var(--flare)}
  .cta-steps{display:grid;gap:14px;margin-top:30px;max-width:40ch}
  .cta-steps div{font-family:var(--head);font-weight:600;font-size:clamp(17px,1.9vw,22px)}
  .disclaimer{margin-top:40px;font-size:13px;color:var(--muted);max-width:52ch;line-height:1.5;
    border-top:1px solid var(--rule);padding-top:16px;font-family:var(--head);font-weight:600}
  .pageno{position:absolute;right:9vw;bottom:5vh;font-family:var(--head);font-weight:700;
    font-size:13px;color:var(--rule)}
  .horizon{position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--flare) 60%,transparent)}
  @media(max-width:720px){.pillars{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'cover', kick:'A live masterclass', h:"The Barnstormer's Flight Plan",
    sub:'How owners stand out, draw customers to them, and build a business that runs on systems instead of on them.',
    present:'Presented live by <b>Harlan Hammack</b>, iB4e Coaching'},

  {t:'who', kick:'Who this is for', h:'You built a real business. It still cannot be found.',
    body:'This is for small and mid-sized business owners who are good at the work, busy enough to be tired, and quietly invisible to the customers who would happily pay them.'},

  {t:'trap', kick:'The trap', h:'Hope is not a marketing plan.',
    body:'Most owners wait to be found. A website sits there. A page gets posted to now and then. And the business grows by referral and luck, which means it stalls the moment either one dries up.'},

  {t:'reframe', kick:'The reframe', h:'Being invisible is a choice.',
    big:'In the 1920s, barnstorming pilots refused to be ignored. They flew low over the town, drew a crowd, and the customers came to them. You can run a business the same way.'},

  {t:'p1title', num:'Part One', h:'Why customers cannot find you.'},

  {t:'p1', kick:'Part One', h:'You are blending in.',
    list:['You market passively and hope the right people stumble in.',
      'You sound like every other business in your category.',
      'You are the whole engine, so growth stops when you do.']},

  {t:'p1cost', kick:'Part One', h:'What that quietly costs you.',
    body:'Feast and famine months. A calendar you do not control. And a business that is worth less than it should be, because it cannot run without you in the room.'},

  {t:'p2title', num:'Part Two', h:"The barnstormer's posture."},

  {t:'p2a', kick:'Part Two', h:'Stand out on purpose.',
    list:['Pick the one thing you do differently and say it plainly.',
      'Show the work in public instead of waiting to be discovered.',
      'Take the visible risk your competitors will not take.']},

  {t:'p2b', kick:'Part Two', h:'Draw customers to you.',
    body:'When you are the owner who is actually visible and clearly different, you stop chasing. The right customers start arriving already half-sold, because they found you being good out loud.'},

  {t:'p3title', num:'Part Three', h:'Build it to last: the Three Pillars.'},

  {t:'pillars', kick:'Part Three', h:'Strategies. Systems. Controls.',
    pillars:[
      {h:'Strategies', p:'Where is the business going, and what do you want it to become? Direction first, before activity.'},
      {h:'Systems', p:'Every business runs on a system. Document the processes so the business repeats without you improvising it.'},
      {h:'Controls', p:'The KPIs that tell you the truth, so you can step back. This is where location independence comes from.'}]},

  {t:'model', kick:'How the change sticks', h:'Awareness, Education, Accountability.',
    body:'I do not work on the business. I work with you, the owner. Awareness of what is possible, education in what actually works, and the accountability that turns a good intention into a standing habit.'},

  {t:'picture', kick:'The view from altitude', h:'Ninety days from now.',
    list:['People in your market know what you stand for.',
      'Customers arrive because they found you, not because you chased them.',
      'The business runs on documented systems, with you choosing where to spend your time.']},

  {t:'whyme', kick:'Why listen to me', h:'I have flown this route since 2004.',
    body:'iB4e Coaching has guided owners across the US and into England, Germany, Mexico, Denmark, and France. I wrote the book Barnstorming, and I have had 295 plus conversations with owners on The Courage to Lead podcast. This is the method, not a theory.'},

  {t:'recap', kick:'The flight plan', h:'From invisible to inbound.',
    list:['Stand out like a barnstormer, on purpose.',
      'Draw the right customers to you.',
      'Hold it together with Strategies, Systems, and Controls.']},

  {t:'cta', kick:'Your next step', h:'Map your own flight plan.',
    steps:['Book a free discovery chat with Harlan.','Bring your one biggest growth bottleneck.','Leave with the first leg of your plan.'],
    disclaimer:'This masterclass is educational. Outcomes depend on your market, your effort, and how you apply the material. Results vary and nothing here is a guaranteed result.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.t === 'cover' ? ' cover' : '');
  let html = '';
  if (s.kick) html += `<div class="kick">${s.kick}</div>`;
  if (s.num) html += `<div class="num">${s.num}</div>`;
  if (s.h) html += s.t === 'cover' ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`;
  if (s.sub) html += `<div class="sub">${s.sub}</div>`;
  if (s.lead) html += `<p class="lead">${s.lead}</p>`;
  if (s.big) html += `<p class="big">${s.big}</p>`;
  if (s.body) html += `<p class="body">${s.body}</p>`;
  if (s.list) html += '<ul>' + s.list.map(x => `<li>${x}</li>`).join('') + '</ul>';
  if (s.pillars) html += '<div class="pillars">' + s.pillars.map(p => `<div class="pillar"><h3>${p.h}</h3><p>${p.p}</p></div>`).join('') + '</div>';
  if (s.steps) html += '<div class="cta-steps">' + s.steps.map((x, n) => `<div><span class="flare">0${n + 1}</span>&nbsp; ${x}</div>`).join('') + '</div>';
  if (s.present) html += `<div class="present">${s.present}</div>`;
  if (s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  html += `<div class="pageno">${String(i + 1).padStart(2, '0')} / ${String(S.length).padStart(2, '0')}</div>`;
  html += '<div class="horizon"></div>';
  sec.innerHTML = html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
