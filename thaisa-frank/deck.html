<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion Fiction - A Live Masterclass with Thaisa Frank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4ecda;      /* warm parchment ground (## Palette) */
    --panel:#e6d8bb;   /* panel */
    --rule:#cfbd98;    /* thin rule */
    --accent:#6e1f2e;  /* deep garnet ink-stamp (## Palette) */
    --ink:#241f1a;     /* text */
    --muted:#6a6157;
    --head:'EB Garamond', Georgia, serif;
    --body:'Public Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:64px 60px;
    margin:0 0 26px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .slide .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .k{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:600;font-size:60px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.1}
  .sub{font-family:var(--head);font-style:italic;font-size:25px;color:var(--muted);margin-top:20px;line-height:1.35}
  p.body{font-size:19px;line-height:1.6;max-width:62ch;margin-top:18px;color:var(--ink)}
  .big{font-family:var(--head);font-size:46px;line-height:1.18;font-weight:500;max-width:22ch}
  .big .a{color:var(--accent)}
  .rule{height:2px;width:70px;background:var(--accent);margin:26px 0}
  ul.list{list-style:none;margin-top:24px}
  ul.list li{font-size:20px;line-height:1.5;padding:14px 0 14px 30px;border-bottom:1px solid var(--rule);position:relative}
  ul.list li:before{content:"";position:absolute;left:0;top:23px;width:12px;height:2px;background:var(--accent)}
  ul.list li b{font-family:var(--head);font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:28px}
  .card{background:var(--panel);border-radius:6px;padding:28px}
  .card .cap{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px}
  .card p{font-size:18px;line-height:1.5}
  .partnum{font-family:var(--head);font-size:120px;color:var(--rule);font-weight:600;line-height:1}
  .cta h2{font-size:46px}
  .steps{margin-top:26px}
  .steps div{font-size:20px;padding:12px 0;border-top:1px solid var(--rule)}
  .steps div b{color:var(--accent);font-family:var(--head)}
  .disc{font-size:13px;color:var(--muted);margin-top:34px;line-height:1.5;max-width:70ch}
  .quietquote{font-family:var(--head);font-style:italic;font-size:42px;line-height:1.3;max-width:20ch;color:var(--ink)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Thaisa Frank',
   html:`<h1>Accordion Fiction</h1><div class="rule"></div><div class="sub">Make a story land by what you leave out.</div>`},

  {t:'intro', k:'Who this is for',
   html:`<h2>For fiction writers whose drafts keep falling flat.</h2><p class="body">Flash, short stories, a novel in progress. You can write the scene. You can hit the word count. And still the page feels thin, like the real story is somewhere just underneath it. This hour is about getting that story to the surface.</p>`},

  {t:'trap', k:'The trap',
   html:`<div class="big">You wrote <span class="a">more</span>. It got flatter.</div><p class="body">When a draft feels weak, the instinct is to explain further. Add a line of backstory. Spell out what the character feels. Close every loop. Each addition feels like progress, and each one quietly takes the story further from the reader.</p>`},

  {t:'reframe', k:'The reframe',
   html:`<div class="big">The story was never in what you added. It was hiding in what you <span class="a">cut</span>.</div><p class="body">A reader does not want to be told. A reader wants to complete the picture themselves. The writer's job is to leave the right gaps in the right places.</p>`},

  {t:'part', k:'Part one',
   html:`<div class="partnum">01</div><h2>Why more words make a story smaller.</h2>`},

  {t:'point', k:'The core problem',
   html:`<h2>Over-explaining closes the door the reader wanted to walk through.</h2><p class="body">Every detail you state is a detail the reader no longer gets to imagine. Spell out the grief and the reader feels reported to. Suggest it, and the reader supplies their own, which is always stronger than anything you could have written for them.</p>`},

  {t:'principle', k:'The principle',
   html:`<div class="quietquote">"By saying nothing, it says something."</div><p class="body">This is functional white space: the deliberate gap between scenes that lets a reader leap across time and place in an instant, and feel the leap. The silence is doing the work.</p>`},

  {t:'part', k:'Part two',
   html:`<div class="partnum">02</div><h2>The Ten Tools of Accordion Fiction.</h2><p class="body">A story expands and contracts like an accordion. These are the controls. We will work through the first four live, with examples you can use the same day.</p>`},

  {t:'tool', k:'Tool one',
   html:`<h2>Functional White Space</h2><p class="body">Strategic breaks between scenes. You remove the connective tissue and trust the reader to cross the gap. Done well, the jump itself carries the emotion.</p>`},

  {t:'tool', k:'Tool two',
   html:`<h2>Compression and Contraction</h2><p class="body">Cut to the essential core so the reader completes the rest. The hundred-word story is the training ground: it lets you see the story and the words at the same time.</p>`},

  {t:'tool', k:'Tool three',
   html:`<h2>Indirect Dialogue</h2><p class="body">Let characters talk at cross-purposes. People rarely say what they mean, and a scene where two people miss each other reveals more than any line that states the feeling outright.</p>`},

  {t:'tool', k:'Tool four',
   html:`<h2>Omission of Resolution</h2><p class="body">End on an unresolved tension and invite the reader to sit inside it. A story that refuses to tie its own bow can feel more complete than one that explains itself to the last line.</p>`},

  {t:'tools-rest', k:'The rest of the kit',
   html:`<h2>And six more we build from there.</h2><ul class="list"><li><b>Unity</b>, one time, one place, one continuous sequence</li><li><b>Voice-Driven</b> and <b>Image-Driven</b> narrative</li><li><b>Concrete Imagery</b> over abstraction</li><li><b>Political Allegory</b> carried through character</li><li><b>Complex, Contradictory Characters</b> that resist a single label</li></ul>`},

  {t:'voice', k:'Where a story begins',
   html:`<div class="big">A story starts with a <span class="a">phrase you hear</span>. Not a plot.</div><p class="body">Voice comes first. When you listen for the sentence that only this narrator would say, structure stops being something you force and starts being something you follow.</p>`},

  {t:'part', k:'Part three',
   html:`<div class="partnum">03</div><h2>What a revised page looks like.</h2>`},

  {t:'beforeafter', k:'Before and after',
   html:`<div class="two"><div class="card"><div class="cap">Draft one</div><p>Everything is explained. The backstory, the motive, the feeling, the meaning. Nothing is left for the reader to do.</p></div><div class="card"><div class="cap">Draft two</div><p>The three lines that matter, and the space around them. The reader leans in to fill the rest, and the scene finally lands.</p></div></div>`},

  {t:'whole', k:'The whole story',
   html:`<h2>Complete is not the same as finished.</h2><p class="body">Unity and omission together make a story feel whole at any length, a hundred words or three hundred pages. Completeness is a feeling you design, not a word count you reach.</p>`},

  {t:'whyme', k:'Why me',
   html:`<h2>Thaisa Frank</h2><p class="body">Two-time PEN award winner and Pushcart Prize winner. Author of the novel <em>Heidegger's Glasses</em> and four short story collections. Co-author of <em>Finding Your Writer's Voice</em>, used in MFA programs. I have taught at UC Berkeley, SF State and the University of San Francisco, and I work as a developmental editor.</p>`},

  {t:'recap', k:'In one line',
   html:`<div class="big">Write the three lines that matter. Leave the rest to the <span class="a">reader</span>.</div>`},

  {t:'cta', k:'Work with Thaisa', cls:'cta',
   html:`<h2>Keep going with your own pages.</h2><div class="steps"><div><b>1.</b> Join a private Accordion Fiction class and work the Ten Tools on your draft.</div><div><b>2.</b> Or book a developmental edit and we go through your manuscript together.</div></div><p class="body">Bring a story you feel stuck on. That is where this starts.</p><div class="disc">For educational purposes only. No income, role, or result is guaranteed. Results vary and depend on your own work, revision, and circumstances.</div>`}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  const k = s.k ? `<div class="k">${s.k}</div>` : '';
  el.innerHTML = `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>${k}${s.html || ''}`;
  deck.appendChild(el);
});
</script>
</body>
</html>
