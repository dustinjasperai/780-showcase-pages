<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You Weren't Born Afraid of a Room: Wake Up Your WOW</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2;        /* warm near-white ground, brand light scheme */
    --panel:#f1ebe2;     /* warm tinted panel */
    --rule:#e4dccf;      /* soft rule */
    --ink:#2d3031;       /* brand ink (brand.json dominant) */
    --muted:#6b6963;     /* muted ink */
    --accent:#e67e22;    /* brand WOW orange (brand.json h1 accent) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Roboto',system-ui,sans-serif;font-weight:300;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:52px 46px;margin:0 0 20px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:'Raleway',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:16px}
  h1{font-family:'Raleway',sans-serif;font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Raleway',sans-serif;font-weight:700;font-size:32px;line-height:1.14;margin-bottom:14px}
  p{font-size:19px;max-width:62ch;margin-bottom:12px;color:var(--ink)}
  p.lead{font-size:22px;color:var(--muted)}
  .promise{font-family:'Raleway',sans-serif;font-weight:500;font-size:22px;color:var(--muted);margin-top:18px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;padding:10px 0 10px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .step{font-family:'Raleway',sans-serif;font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}
  .big{font-family:'Raleway',sans-serif;font-weight:800;font-size:40px;line-height:1.1;margin:6px 0 16px}
  .wow{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
  .wow span{font-family:'Raleway',sans-serif;font-weight:700;font-size:20px;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:10px 22px}
  .brandfoot{position:absolute;right:24px;bottom:18px;font-family:'Raleway',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .cta .btn{display:inline-block;margin-top:20px;font-family:'Raleway',sans-serif;font-weight:700;font-size:18px;color:#fff;background:var(--accent);border-radius:10px;padding:16px 30px;text-decoration:none}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch}
  .credit li::before{background:var(--ink)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'Wake Up Your WOW: a live masterclass with Cath Vincent',
    h1:'You Weren’t Born Afraid of a Room',
    promise:'How to un-learn the fear of speaking and lead with energy, confidence and motivation.' },

  {t:'who', eyebrow:'Who this is for',
    h2:'You know your work. The room still makes you shrink.',
    lead:'You have something worth saying in the meeting, on the stage, in your own business. But the moment the attention turns to you, your voice tightens, your hands go, and the version of you that shows up is smaller than the one you are.' },

  {t:'trap', eyebrow:'The trap',
    h2:'You have been told this is just how you are.',
    body:['“I’m not a natural speaker.” “Confident people are born that way.” “I’ll always be nervous, I just have to push through it.”',
          'So you avoid the stage, keep the camera off, let someone else take the room. And the fear quietly runs your career.'] },

  {t:'reframe', eyebrow:'The reframe',
    big:'Nervousness is not natural. It is learned.',
    body:['As a child you could not wait to speak, before you even had words. The drive to express yourself is innate. What changed is conditioning.',
          'And here is the part that changes everything: anything you learned, you can un-learn.'] },

  {t:'part', eyebrow:'Part One', h2:'How the fear got installed' },

  {t:'body', eyebrow:'The conditioning',
    h2:'Three places you were taught to stay quiet',
    items:['At school, you learned to fit in, not to stand out.',
           'At work, staying safe meant staying silent.',
           'Deep down, the tribe instinct says standing alone before the group risks rejection.'] },

  {t:'body', eyebrow:'The myth of “natural” nerves',
    h2:'Fear spreads because we all agree it is normal',
    body:['Say you are nervous about presenting and everyone calls it natural. That shared belief is self-reinforcing. We collectively agree fear is the price of being seen.',
          'It is not. It is a learned behaviour wearing the costume of a personality trait.'] },

  {t:'body', eyebrow:'What it is costing you',
    h2:'An unspoken idea helps no one',
    body:['When you are not confident as you speak, you are not yet the best ambassador for your own ideas or your business.',
          'People read uncertainty in seconds, through energy and body language, and they quietly doubt the message along with the messenger.'] },

  {t:'part', eyebrow:'Part Two', h2:'The three-step shift' },

  {t:'step', step:'Shift One', h2:'Change your first thought',
    body:['“I’ll mess this up” triggers the tension before you say a word. The body follows the thought.',
          'Replace it with something grounding: “It’s only ten minutes.” “I’ve got this.” You are not faking calm, you are choosing the thought that creates it.'] },

  {t:'step', step:'Shift Two', h2:'Set a better goal',
    body:['Most people aim to survive the talk. Survival is a low, anxious bar, and your energy drops to meet it.',
          'Aim to thrive instead. When the goal moves from endurance to enjoyment, your whole energy lifts and the audience feels it.'] },

  {t:'step', step:'Shift Three', h2:'Shift the spotlight',
    body:['Nerves live in self-focus: how do I look, what will they think of me.',
          'Move the spotlight off yourself and onto the people in front of you. Stop performing and start serving. When you focus on being useful, authenticity flows and the nerves fade.'] },

  {t:'method', eyebrow:'The method', h2:'This is how you Wake Up Your WOW',
    body:['The shifts are not a one-off pep talk. Practised, they become the default way you walk into a room.'],
    wow:['Energy','Confidence','Motivation'] },

  {t:'part', eyebrow:'Part Three', h2:'What confident presence looks like' },

  {t:'body', eyebrow:'What a room reads',
    h2:'Confidence is a signal, and it is trainable',
    body:['Confident speakers do not know everything. They make sense of the world for the people listening. They speak clearly, hold the space, and show certainty.',
          'Leadership is not about being right. It is about giving people clarity and calm. When your energy communicates confidence, people trust you, and they trust your business.'] },

  {t:'body', eyebrow:'The ripple',
    h2:'This goes far beyond the stage',
    body:['Confidence changes not only how others see you, but how you see yourself. The meeting you now speak up in. The offer you now make out loud. The room you now walk into as yourself.',
          'Fear of speaking is not who you are. It is what you learned. The moment you stop accepting it as normal, you begin to un-learn it.'] },

  {t:'credit', eyebrow:'Why learn this with me',
    h2:'Cath Vincent',
    items:['Twenty years refining one technique for unleashing potential: Wake Up Your WOW.',
           'International, award-winning keynote speaker; National Speakers Association of New Zealand BrightStar Award; a TEDx talk.',
           'Host of The Cath Vincent Show, and founder of Studio 38, where leaders gather to find their voice.'] },

  {t:'cta', eyebrow:'Your next step',
    h2:'Decide you are done being afraid',
    body:['If you are ready to un-learn the fear and speak with real energy and confidence, let us do it together, step by step, with feedback.'],
    btn:'Work with Cath Vincent',
    sub:'One-to-one speaking coaching and the She Says So class at cathvincent.com.',
    disc:'No specific result is guaranteed. Results vary with each person and the work they put in.' }
];

const deck = document.getElementById('deck');
function p(arr){ return (arr||[]).map(t=>`<p>${t}</p>`).join(''); }
function li(arr,cls){ return `<ul class="${cls||''}">`+(arr||[]).map(t=>`<li>${t}</li>`).join('')+'</ul>'; }
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='cta'?'cta ':'')+(s.t==='credit'?'credit ':'');
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.step) h+=`<div class="step">${s.step}</div>`;
  if(s.h1) h+=`<h1>${s.h1}</h1>`;
  if(s.promise) h+=`<p class="promise">${s.promise}</p>`;
  if(s.big) h+=`<div class="big">${s.big}</div>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.lead) h+=`<p class="lead">${s.lead}</p>`;
  if(s.body) h+=p(s.body);
  if(s.items) h+=li(s.items, s.t==='credit'?'credit':'');
  if(s.wow) h+='<div class="wow">'+s.wow.map(w=>`<span>${w}</span>`).join('')+'</div>';
  if(s.btn) h+=`<a class="btn" href="https://www.cathvincent.com">${s.btn}</a>`;
  if(s.sub) h+=`<div class="disclaimer">${s.sub}</div>`;
  if(s.disc) h+=`<div class="disclaimer">This masterclass is educational. ${s.disc}</div>`;
  h+='<div class="brandfoot">Wake Up Your WOW</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
