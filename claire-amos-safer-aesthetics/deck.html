<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Safe Injector - Safer Aesthetics Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf0f7;      /* clinical blue-grey ground, lightened from brand #013d79 */
    --panel:#f7fafd;   /* cool off-white panel, same blue family */
    --rule:#d4def0;
    --ink:#10243b;
    --muted:#4f5f73;
    --accent:#013d79;  /* brand dominant deep clinical blue (#013d79, 39 uses) */
    --gold:#daaf37;    /* brand secondary gold (#daaf37, 24 uses) */
    --serif:'Zilla Slab',Georgia,serif;
    --sans:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(1,61,121,.05)}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  .gold-rule{height:3px;width:54px;background:var(--gold);border:0;margin:0 0 26px}
  h1{font-family:var(--serif);font-weight:700;font-size:54px;line-height:1.05;margin:0 0 18px;color:var(--ink)}
  h2{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.12;margin:0 0 16px;color:var(--ink)}
  p{font-size:19px;line-height:1.6;color:var(--muted);margin:0 0 14px;max-width:62ch}
  .lead{font-size:22px;color:var(--ink)}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:14px 0 14px 30px;position:relative;
    border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .pillar{font-family:var(--serif);font-size:26px;color:var(--accent);font-weight:600}
  .kicker{font-family:var(--serif);font-size:30px;color:var(--ink);font-weight:600}
  .cta h2{color:var(--accent)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:28px;border-top:1px solid var(--rule);
    padding-top:16px;max-width:70ch}
  .brandline{font-family:var(--sans);font-weight:600;color:var(--accent);font-size:15px;letter-spacing:.04em;margin-top:30px}
  .num{font-family:var(--serif);font-size:15px;color:var(--muted);position:absolute;top:18px;right:24px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "Safer Aesthetics Training";
const S = [
  {t:'title', eyebrow:'A live masterclass for medical professionals', h1:'The Safe Injector', lead:'How to build an aesthetics practice your patients trust, without the complications that end careers.'},
  {t:'who', eyebrow:'Who this is for', h2:'For doctors, dentists, nurses, pharmacists and paramedics moving into aesthetics', p:'You already have the clinical foundation. What you want is a way into aesthetics that feels as safe as the rest of your practice, not a one-day certificate and a leap of faith.'},
  {t:'trap', eyebrow:'The trap', h2:'The industry sells speed. Speed is not the same as safe.', p:'Most of what gets advertised is the fast route in: a weekend course, a certificate, and go. It is built to get you injecting quickly. It is not built to get you ready for the day something goes wrong.'},
  {t:'reframe', eyebrow:'The reframe', h2:'Your reputation is not built on how fast you started. It is built on what happens when it gets hard.', p:'Patients do not remember how quickly you qualified. They remember whether they felt safe, and whether you knew exactly what to do when a treatment did not go to plan.'},
  {t:'section', eyebrow:'Part one', kicker:'The problem nobody trains you for'},
  {t:'body', eyebrow:'The real risk', h2:'Injecting is the easy part to teach. Managing the rare event is the part that matters.', p:'Vascular occlusion. An adverse reaction. A result that is not what the patient hoped for. These are uncommon, but when they happen, the practitioner who was only taught to inject is suddenly out of their depth.'},
  {t:'body', eyebrow:'What safe really means', h2:'Safe is a method, not a mood.', p:'It is a consultation you can defend, an assessment of the whole face, evidence-based technique, and a clear, rehearsed plan for complications. It can be taught, and it should be taught from day one.'},
  {t:'section', eyebrow:'Part two', kicker:'The safer method'},
  {t:'pillars', eyebrow:'Three pillars', h2:'What safer, evidence-based training actually covers', items:[
    {p:'Safety and complications', d:'Recognising and managing adverse events, with emergency readiness and anaphylaxis built in, not bolted on.'},
    {p:'The holistic full-face approach', d:'Assessing and treating the whole face for natural, patient-centred results, drawn from a high-volume clinic, not a slide deck.'},
    {p:'The regulated pathway', d:'A structured Foundation to Level 7 route so your competence keeps pace with what you are allowed to offer.'}
  ]},
  {t:'body', eyebrow:'Pillar one', h2:'Train for the bad day before it arrives', p:'You rehearse complications the way you rehearse any emergency: calmly, repeatedly, before you need it. By the time you are treating patients, the plan is already in your hands.'},
  {t:'body', eyebrow:'Pillar two', h2:'Treat the face, not the line', p:'The most natural results come from reading the whole face and the patient in front of you, then doing less, more precisely. That judgement is what separates a confident injector from a careful one.'},
  {t:'body', eyebrow:'Pillar three', h2:'Let the qualification follow the competence', p:'A regulated Level 7 route gives you a real framework: supervised practice, mentorship, assessment, and a recognised qualification, so your paper and your practice say the same thing.'},
  {t:'section', eyebrow:'Part three', kicker:'The practice this builds'},
  {t:'body', eyebrow:'The outcome', h2:'A practice you can stand behind', p:'Patients who trust you because you are thorough. Treatments you can justify. And the quiet confidence of knowing that if the rare day comes, you are the practitioner who is ready for it.'},
  {t:'why', eyebrow:'Why learn it this way', h2:'Taught by a nurse prescriber who still injects every day', p:'This is not theory from someone who left the clinic. It is the safety-first method used daily in a busy aesthetics practice, taught in small groups so every learner gets real time with the trainer, holding full VTCT and OFQUAL regulated approval.'},
  {t:'cta', eyebrow:'Your next step', h2:'Train the safer way', p:'If you want to add aesthetics to your practice properly, start with the foundations and follow the regulated route at your own pace. Enquire about the pathway and the next available dates with Safer Aesthetics Training.', disclaimer:'Educational content only. Aesthetic training outcomes and earnings vary by individual, effort, market and regulatory context; nothing here is a guarantee of results or income. Treatments must be performed within your professional scope and local regulations.'}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'');
  let h = '<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'||s.t==='section') h += '<hr class="gold-rule">';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if(s.p && s.t!=='pillars') h += '<p>'+s.p+'</p>';
  if(s.items){ h += '<ul>'; s.items.forEach(it=>{ h += '<li><span class="pillar">'+it.p+'</span><br>'+it.d+'</li>'; }); h += '</ul>'; }
  if(s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  if(s.t==='cta') h += '<div class="brandline">'+BRAND+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
