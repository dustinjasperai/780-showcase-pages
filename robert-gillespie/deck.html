<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Chat Tool to Operator | A Masterclass with Robert Gillespie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#fbf6e8; --panel:#fffdf7; --rule:#eadfc8;
    --ink:#1a1a1a; --ink-soft:#4a463c; --ink-muted:#7a7a70;
    --accent:#d4782a; --deep:#b5631f;
  }
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  body{background:#efe7d2;color:var(--ink);font-family:'Spectral',Georgia,serif;}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px;}
  .slide{position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 22px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.02);}
  .slide.title{background:linear-gradient(160deg,#fbf6e8 0%,#f5ead2 100%);}
  .slide.cta{background:linear-gradient(160deg,#1a1a1a 0%,#2a2117 100%);color:#fbf6e8;border-color:#2a2117;}
  .kicker{font-family:'Bricolage Grotesque',sans-serif;font-size:12px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
  .slide.cta .kicker{color:#e8a86a;}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px;line-height:1.08;
    letter-spacing:-.02em;color:var(--ink);margin-bottom:18px;}
  h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:34px;line-height:1.14;
    letter-spacing:-.015em;color:var(--ink);margin-bottom:16px;}
  .slide.cta h1,.slide.cta h2{color:#fbf6e8;}
  p{font-size:20px;line-height:1.6;color:var(--ink-soft);margin-bottom:14px;max-width:46ch;}
  .slide.cta p{color:#efe3cf;}
  .lead{font-size:23px;color:var(--ink);}
  .big{font-size:22px;}
  ul{list-style:none;margin:10px 0 0;}
  li{font-size:20px;line-height:1.5;color:var(--ink-soft);padding:12px 0 12px 30px;position:relative;
    border-top:1px solid var(--rule);max-width:50ch;}
  li:first-child{border-top:none;}
  li::before{content:"";position:absolute;left:0;top:21px;width:12px;height:12px;border-radius:3px;
    background:var(--accent);}
  .split{display:flex;gap:10px;margin:26px 0 6px;align-items:stretch;}
  .split div{font-family:'Bricolage Grotesque',sans-serif;border-radius:10px;padding:22px 16px;text-align:center;color:#fff;}
  .split .d{flex:1;background:var(--deep);}
  .split .e{flex:8;background:var(--accent);}
  .split .j{flex:1;background:var(--deep);}
  .split b{display:block;font-size:30px;font-weight:800;}
  .split span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;opacity:.9;}
  .num{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:10px;}
  .arc{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;}
  .arc div{font-family:'Bricolage Grotesque',sans-serif;flex:1;min-width:180px;background:var(--panel);border:1px solid var(--rule);
    border-radius:10px;padding:18px 18px 20px;}
  .arc h3{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .arc p{font-size:15px;color:var(--ink-muted);margin:0;}
  .pill{display:inline-block;font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:600;color:var(--deep);
    background:#f6e4cd;border:1px solid #ecd3af;border-radius:999px;padding:5px 12px;margin:0 6px 8px 0;}
  .disc{font-family:'Bricolage Grotesque',sans-serif;font-size:13px;line-height:1.5;color:#c9b48c;margin-top:22px;max-width:60ch;}
  .foot{position:absolute;bottom:18px;left:56px;font-family:'Bricolage Grotesque',sans-serif;font-size:12px;
    letter-spacing:.08em;color:var(--ink-muted);text-transform:uppercase;}
  .slide.cta .foot{color:#8a7b60;}
  .page{position:absolute;bottom:18px;right:56px;font-family:'Bricolage Grotesque',sans-serif;font-size:12px;color:var(--ink-muted);}
  .slide.cta .page{color:#8a7b60;}
  .big-btn{display:inline-block;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;
    background:var(--accent);color:#1a1a1a;border-radius:10px;padding:14px 26px;margin-top:10px;}
  @media(max-width:640px){.slide{padding:36px 26px 46px;min-height:420px;}h1{font-size:32px;}h2{font-size:25px;}
    p,li{font-size:17px;}.foot,.page{left:26px;right:26px;}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="kicker">A live masterclass with Robert Gillespie</div>
    <h1>From Chat Tool to Operator</h1>
    <p class="lead">How marketers get 2 to 3 hours of work back using the 10-80-10 method, without code, engineers, or anything publishing without your yes.</p>`},

  {t:'who', cls:'', html:`
    <div class="kicker">Who this is for</div>
    <h2>You already use AI. You're still doing most of the work.</h2>
    <p>This is for solo marketers, marketing leaders with small teams, and founders doing their own marketing. If you can brief a junior team member, you can do this.</p>
    <p class="big">The skill you need is the one you already have: setting direction and judging the result.</p>`},

  {t:'trap', cls:'', html:`
    <div class="kicker">The trap</div>
    <h2>It's 5:30pm and you're typing "try again" into a chat window.</h2>
    <ul>
      <li>Fifteen tabs open, pasting the same brand context from one chat to the next.</li>
      <li>You paste a brief in, then spend just as long fixing the voice and the files.</li>
      <li>You watched the videos and saved the prompts. It helped, but it didn't stick.</li>
    </ul>`},

  {t:'reframe', cls:'', html:`
    <div class="kicker">The uncomfortable part</div>
    <h2>The limit was never the tool. It was the setup.</h2>
    <p>When jobs came back needing redoing, it wasn't the AI. The folders were unclear, the important information was hard to find, and Claude was doing its best with a mess.</p>
    <p class="lead">Fix the setup and the same tool runs whole jobs end to end.</p>`},

  {t:'p1', cls:'', html:`
    <div class="num">Part one</div>
    <h2>A conversation does not compound.</h2>
    <p>The old way treats AI as a conversation: one message at a time, start from scratch every time, re-explain your brand every time, upload files one at a time.</p>
    <p>60% of the average knowledge worker's day goes on the repetitive work around the job, not the job itself. A chat window does not give that time back.</p>`},

  {t:'p1b', cls:'', html:`
    <div class="num">Part one</div>
    <h2>The new way: Claude as an operating environment.</h2>
    <ul>
      <li>Organised context and documented instructions, read on every job.</li>
      <li>You delegate whole jobs, not single prompts.</li>
      <li>Projects, Skills and Connectors that remember and repeat.</li>
      <li>You define the goal and review the result.</li>
    </ul>`},

  {t:'p2', cls:'', html:`
    <div class="num">Part two: the method</div>
    <h2>The 10-80-10 model.</h2>
    <p>Human judgement at the beginning and the end, with Claude handling the repetitive execution in the middle.</p>
    <div class="split">
      <div class="d"><b>10</b><span>You direct</span></div>
      <div class="e"><b>80</b><span>Claude executes</span></div>
      <div class="j"><b>10</b><span>You judge</span></div>
    </div>`},

  {t:'p2b', cls:'', html:`
    <div class="num">Part two: the method</div>
    <h2>Most marketers are stuck at 10-60-20.</h2>
    <p>You direct, then you still do 60% of the execution yourself, and review only the last 20%. The gap between your week and 10-80-10 is where the hours are hiding.</p>
    <p class="lead">Closing that gap is the whole point of this session.</p>`},

  {t:'airbnb', cls:'', html:`
    <div class="num">Part two: the method</div>
    <h2>The Airbnb Strategy.</h2>
    <p>A good Airbnb host does not stand in the hallway answering questions. They write one great welcome guide, and guests help themselves.</p>
    <p>So you write one for Claude: structured files that explain how your marketing folder works, so it finds everything without asking.</p>`},

  {t:'welcome', cls:'', html:`
    <div class="num">Part two: the method</div>
    <h2>The one file Claude reads first.</h2>
    <ul>
      <li><b>Folders:</b> what each one holds and where finished work gets saved.</li>
      <li><b>Sources:</b> which files are authoritative when documents disagree.</li>
      <li><b>Process:</b> the steps for each job, and the approval rules that keep you in charge.</li>
    </ul>
    <p>Written once, read on every job. Claude stops asking questions mid-job and runs end to end.</p>`},

  {t:'arc', cls:'', html:`
    <div class="num">The path</div>
    <h2>Adopt, Automate, Integrate.</h2>
    <div class="arc">
      <div><h3>Adopt</h3><p>Build the operator habit and finish your first end-to-end job early, not in the final module.</p></div>
      <div><h3>Automate</h3><p>Teach Claude your work once: Projects, Skills, Connectors and scheduled tasks.</p></div>
      <div><h3>Integrate</h3><p>Connect it across your stack so complete workflows become part of how your marketing runs.</p></div>
    </div>`},

  {t:'p3', cls:'', html:`
    <div class="num">Part three: a real workflow</div>
    <h2>An ordinary Tuesday, the new way.</h2>
    <p>You sit down with a coffee, trigger a workflow, and twenty minutes later you are reviewing a finished piece of work, deciding whether it ships.</p>
    <p class="lead">Claude did the middle. You did the judgement.</p>`},

  {t:'content', cls:'', html:`
    <div class="num">Part three: a real workflow</div>
    <h2>One brief in, a complete content pack out.</h2>
    <ul>
      <li>Reads the brief and brand guidelines, researches before writing a word.</li>
      <li>Drafts the long-form asset and adapts it into a social pack, saved as real files.</li>
      <li>Stages everything for sign-off. Nothing publishes without your yes.</li>
    </ul>
    <p>Then it compounds: you package the whole thing as a reusable Skill and run it every week.</p>`},

  {t:'schedule', cls:'', html:`
    <div class="num">Part three: a real workflow</div>
    <h2>Recurring work that starts on time by itself.</h2>
    <p>Competitor digests, weekly checks and daily ideas run on a schedule. Live campaign data in, a written report and a finished deck out, every week.</p>
    <div>
      <span class="pill">Monthly reporting</span><span class="pill">Competitor research</span>
      <span class="pill">Content repurposing</span><span class="pill">Campaign briefs</span>
      <span class="pill">Social packs</span><span class="pill">Outreach drafts</span>
    </div>`},

  {t:'why', cls:'', html:`
    <div class="num">Why me</div>
    <h2>I made this switch in my own marketing first.</h2>
    <p>25+ years in marketing, and the last seven working with AI. This same system runs two in-depth newsletters a week, a Substack grown to 16,000 readers, and a weekly Inc. column, without working more hours.</p>
    <p>I have trained 2,150+ marketers at 55+ companies, including teams at Adobe and JP Morgan Chase. That judgement is what I teach.</p>`},

  {t:'recap', cls:'', html:`
    <div class="num">The whole system</div>
    <h2>Context Claude can navigate, a habit you can keep.</h2>
    <ul>
      <li>The Airbnb Strategy fixes the context.</li>
      <li>The 10-80-10 model fixes the way of working.</li>
      <li>Adopt, Automate, Integrate makes it part of everyday operations.</li>
    </ul>
    <p>Same role, same hours, a different way of working.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next step</div>
    <h1>Get your Operator Gameplan.</h1>
    <p class="big">In about three minutes, see your Operator Score, the gap between your week and 10-80-10, and the first task to hand to Claude.</p>
    <div class="big-btn">Start at robertgillespie.me</div>
    <p class="disc">Educational session only. No income, role, or result is guaranteed. Results vary with your inputs, effort, and market. This masterclass teaches a method; it does not promise a specific outcome.</p>`}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'slide ' + (s.cls || '');
  d.innerHTML = s.html
    + '<div class="foot">Robert Gillespie - Marketing with AI</div>'
    + '<div class="page">' + (i + 1) + ' / ' + S.length + '</div>';
  deck.appendChild(d);
});
</script>
</body>
</html>
