<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Finished Draft — A Live Masterclass with Kailey Brennan DelloRusso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,500&family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palette derived from kaileydellorusso.com (see 01-deep-research.md ## Palette) */
    --bg:#f7efe9;        /* warm blush paper, light tint of brand rose #d9a4ab */
    --panel:#fffdfb;     /* soft warm white */
    --ink:#582b2c;       /* brand oxblood, dominant structural ink */
    --accent:#d9a4ab;    /* brand dusty rose, sparing emphasis */
    --text:#2a1c1c;      /* warmed near-black body */
    --muted:#7a5e5c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  #deck{height:100vh;width:100vw;overflow:hidden;position:relative}
  .slide{
    position:absolute;inset:0;display:none;
    padding:7vh 9vw;
    flex-direction:column;justify-content:center;
    animation:fade .4s ease;
  }
  .slide.on{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-family:'Bodoni Moda',serif;font-weight:700;color:var(--ink);
     font-size:clamp(2.2rem,5.4vw,4.2rem);line-height:1.08;letter-spacing:-.5px}
  h2{font-family:'Bodoni Moda',serif;font-weight:700;color:var(--ink);
     font-size:clamp(1.7rem,3.6vw,2.7rem);line-height:1.15;margin-bottom:.5em}
  .kicker{font-family:'Manrope',sans-serif;font-weight:700;text-transform:uppercase;
     letter-spacing:.22em;font-size:.82rem;color:var(--accent);margin-bottom:1.4em}
  .lede{font-size:clamp(1.1rem,2.1vw,1.5rem);line-height:1.5;max-width:42ch;color:var(--text)}
  .sub{font-size:clamp(1rem,1.8vw,1.25rem);line-height:1.55;max-width:48ch;color:var(--muted);margin-top:1.1em}
  p.big{font-family:'Bodoni Moda',serif;font-style:italic;color:var(--ink);
     font-size:clamp(1.5rem,3.2vw,2.4rem);line-height:1.3;max-width:24ch}
  ul{list-style:none;margin-top:1.3em;max-width:46ch}
  li{position:relative;padding-left:1.5em;margin:.7em 0;font-size:clamp(1rem,1.9vw,1.3rem);line-height:1.45}
  li:before{content:"";position:absolute;left:0;top:.6em;width:.6em;height:.6em;
     border-radius:50%;background:var(--accent)}
  .rule{width:68px;height:3px;background:var(--accent);margin:1.3em 0;border-radius:2px}
  .stepnum{font-family:'Bodoni Moda',serif;color:var(--accent);font-size:1.1rem;font-weight:700}
  .pillars{display:flex;gap:2.4vw;margin-top:1.6em;flex-wrap:wrap}
  .pillar{background:var(--panel);border:1px solid #ecd9d4;border-radius:14px;
     padding:1.6em 1.5em;flex:1 1 240px;box-shadow:0 6px 24px rgba(88,43,44,.06)}
  .pillar h3{font-family:'Bodoni Moda',serif;color:var(--ink);font-size:1.25rem;margin-bottom:.5em}
  .pillar p{color:var(--muted);font-size:1rem;line-height:1.45}
  .who{font-size:clamp(1.05rem,2vw,1.4rem);line-height:1.5;max-width:40ch}
  .cta-box{background:var(--ink);color:#fdf3f0;border-radius:18px;padding:2.4em 2.2em;max-width:40ch}
  .cta-box h2{color:#fdf3f0}
  .cta-box .btn{display:inline-block;margin-top:1.1em;background:var(--accent);color:var(--ink);
     font-weight:700;padding:.75em 1.5em;border-radius:999px;font-size:1.05rem}
  .disc{font-size:.8rem;color:var(--muted);margin-top:2.2em;max-width:52ch;line-height:1.5}
  .byline{margin-top:1.8em;color:var(--muted);font-size:1rem}
  .page{position:absolute;right:4vw;bottom:4vh;color:var(--accent);font-size:.8rem;letter-spacing:.1em}
  .nav{position:absolute;left:4vw;bottom:4vh;color:var(--muted);font-size:.78rem}
  .nav b{color:var(--ink)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title',html:`
    <div class="kicker">A Live Masterclass</div>
    <h1>The Finished Draft</h1>
    <p class="sub">How to move from a messy, abandoned draft to a novel you are proud to query.</p>
    <div class="byline">with Kailey Brennan DelloRusso &middot; agented novelist &amp; founder of Write or Die Magazine</div>
  `},
  {t:'promise',html:`
    <div class="kicker">What you will leave with</div>
    <h2>One live hour. A way through the part where novels die.</h2>
    <ul>
      <li>Why the messy middle stalls more novels than any craft gap</li>
      <li>A map for the draft you have already started but cannot finish</li>
      <li>The three-phase way to revise without rewriting from scratch</li>
      <li>How an agented reader actually reads a query, and what moves it to the top</li>
    </ul>
  `},
  {t:'who',html:`
    <div class="kicker">Who this is for</div>
    <h2>The creative woman writing the novel of her dreams.</h2>
    <p class="who">You have pages. Maybe a whole draft. You have reread the opening so many times you cannot see it anymore, and the middle feels like a swamp. You are not a beginner. You are a writer who keeps almost finishing.</p>
  `},
  {t:'trap',html:`
    <div class="kicker">The trap</div>
    <h2>You keep buying more craft when craft was never the problem.</h2>
    <p class="sub">Another plotting course. Another structure template. The drawer fills with half-drafts and the advice contradicts itself. Each new method feels like progress and quietly becomes one more reason the book is not done.</p>
  `},
  {t:'reframe',html:`
    <div class="kicker">The real reason</div>
    <p class="big">You do not have a talent problem. You have a finishing problem.</p>
    <div class="rule"></div>
    <p class="sub">Finishing is a skill of its own: a map to follow, a rhythm you can sustain, and the devotion to stay with the story when it stops being fun. Those are learnable. They are what this hour is about.</p>
  `},
  {t:'part',html:`
    <div class="kicker">Part One</div>
    <h2>Where novels actually die</h2>
    <ul>
      <li>The saggy middle, where the plot loses its engine and you lose your nerve</li>
      <li>The finished-but-shapeless draft you are afraid to reread</li>
      <li>The query you never send because it never feels ready</li>
    </ul>
    <p class="sub">None of these is a sign you are not a real writer. Each one is a predictable place on the path, and each has a way through.</p>
  `},
  {t:'content',html:`
    <h2>The problem is not the words. It is the absence of a map and a reason to keep going.</h2>
    <p class="sub">When there is no structure to lean on, every writing session starts from zero. When there is no devotion practice, the first hard chapter is where you stop. Give the draft both and the messy middle becomes a stretch of road, not a wall.</p>
  `},
  {t:'part',html:`
    <div class="kicker">Part Two &middot; The method</div>
    <h2>Craft, Creativity &amp; Connection</h2>
    <p class="sub">Three things a draft needs to get finished. Not more talent. These three, working together.</p>
    <div class="pillars">
      <div class="pillar"><h3>Craft</h3><p>A structure to follow so no session starts from zero.</p></div>
      <div class="pillar"><h3>Creativity</h3><p>A rhythm that fits your real energy, not a borrowed discipline.</p></div>
      <div class="pillar"><h3>Connection</h3><p>Accountability and devotion so the hard chapters do not end the book.</p></div>
    </div>
  `},
  {t:'content',html:`
    <div class="kicker">Craft &middot; The Wild Draft arc</div>
    <h2>Map the whole book before the middle swallows you.</h2>
    <ul>
      <li>Project mapping: name the story engine and the stakes first</li>
      <li>Act by act, know what each stretch has to accomplish</li>
      <li>A drafting arc you can see from the opening page to the final revision</li>
    </ul>
  `},
  {t:'content',html:`
    <div class="kicker">Creativity &middot; Writing in Flow</div>
    <h2>Write in tune with your own rhythms, not against them.</h2>
    <p class="sub">Your energy is not flat across a month or a week. When you stop fighting that and build a writing rhythm around it, the work gets lighter and the self-doubt gets quieter. Sustainable beats heroic. A steady writer finishes.</p>
  `},
  {t:'content',html:`
    <div class="kicker">Connection &middot; Creative devotion</div>
    <h2>Devotion is what carries the book past the fun part.</h2>
    <p class="sub">Every novel stops being exciting somewhere in the middle. Writers who finish are not more disciplined by nature. They have a practice that keeps them returning to the page, and people who expect them back. That is a system, and it can be built.</p>
  `},
  {t:'part',html:`
    <div class="kicker">Part Two &middot; After the draft</div>
    <h2>The three-phase revision recalibration</h2>
    <ul>
      <li><span class="stepnum">01</span>&nbsp; Goal alignment: decide what this draft is trying to be</li>
      <li><span class="stepnum">02</span>&nbsp; Pattern and gap analysis: read the draft for what it is actually doing</li>
      <li><span class="stepnum">03</span>&nbsp; A personalised revision roadmap: clear next steps, in order</li>
    </ul>
  `},
  {t:'content',html:`
    <h2>Revision is not rewriting. It is finding what is already working.</h2>
    <p class="sub">Before you tear anything down, you look at the story engine, the characters, the world and the structure, and you name what is alive. Revision honours the heart of the story you already wrote. You move forward from strength, not from shame.</p>
  `},
  {t:'content',html:`
    <div class="kicker">Part Three &middot; The finished book</div>
    <h2>From a draft you avoid to a novel you can send.</h2>
    <p class="sub">A mapped draft. A revision plan you understand. A book that finally reads like the one you meant to write. And then the part most writers never let themselves reach: a query that is ready to go out.</p>
  `},
  {t:'content',html:`
    <div class="kicker">The querying edge</div>
    <h2>How an agented reader reads a query.</h2>
    <p class="sub">I read the market every week for Where to Query, and I have helped dozens of writers reach representation. A strong query is not clever. It is clear about the engine of the book and confident about the writer behind it. I will show you what moves one to the top of the pile.</p>
  `},
  {t:'why',html:`
    <div class="kicker">Why listen to me</div>
    <h2>Kailey Brennan DelloRusso</h2>
    <ul>
      <li>Agented novelist, represented by Creative Artists Agency</li>
      <li>Founder of Write or Die Magazine, a global community of writers since 2018</li>
      <li>Writer of the Where to Query column, reading the agent market every week</li>
      <li>Coach to dozens of writers on the way to representation</li>
    </ul>
  `},
  {t:'content',html:`
    <div class="kicker">The reader's lens</div>
    <h2>Read like a writer, and every novel you love becomes a teacher.</h2>
    <p class="sub">The books that move you are doing something you can name and borrow. Learning to read your favourite novels for their moves is the fastest craft education there is, and it never stops working on your own pages.</p>
  `},
  {t:'recap',html:`
    <div class="kicker">The path</div>
    <h2>Map it. Draft it with devotion. Revise from strength. Send it.</h2>
    <p class="sub">That is the whole arc, from the idea you are protecting to the novel an agent can say yes to. None of it requires more talent than you already have.</p>
  `},
  {t:'cta',html:`
    <div class="cta-box">
      <div class="kicker" style="color:var(--accent)">Your next step</div>
      <h2>Finish the book with me.</h2>
      <p style="line-height:1.5">The Wild Draft is my six-month novel-writing cohort: live classes, real feedback, and a small room of writers who expect you back at the page. If you are ready to finish, this is the room.</p>
      <span class="btn">Join the next Wild Draft cohort</span>
    </div>
    <p class="disc">This masterclass is for educational purposes only. Writing and publishing outcomes vary and depend on the work each writer puts in. Nothing here is a promise or guarantee of publication, agent representation, or any particular result.</p>
  `}
];
const deck=document.getElementById('deck');
deck.innerHTML=S.map((s,i)=>`<section class="slide${i===0?' on':''}" data-i="${i}">${s.html}<div class="page">${i+1} / ${S.length}</div>${i===0?'<div class="nav">Use <b>&larr; &rarr;</b> to move</div>':''}</section>`).join('');
let cur=0;const slides=[...document.querySelectorAll('.slide')];
function go(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,i)=>s.classList.toggle('on',i===cur));}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
deck.addEventListener('click',e=>{const w=window.innerWidth;go(e.clientX>w/2?cur+1:cur-1);});
</script>
</body>
</html>
