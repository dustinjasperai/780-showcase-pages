<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Balanced Growth Method - Pursuing Freedom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfbf7;
    --panel:#fffaf3;
    --ink:#182542;
    --muted:#5b6475;
    --rule:#e7e0d4;
    --accent:#e48560;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 2px rgba(24,37,66,.04)}
  .eyebrow{font-family:'Lato';font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Fraunces';font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:'Fraunces';font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-.01em}
  .sub{font-family:'Fraunces';font-weight:400;font-size:24px;color:var(--muted);margin-top:18px;line-height:1.3}
  p.body{font-size:20px;line-height:1.55;color:var(--ink);margin-top:20px;max-width:62ch}
  p.lead{font-family:'Fraunces';font-weight:400;font-size:30px;line-height:1.3;max-width:24ch}
  ul{margin-top:24px;list-style:none}
  li{font-size:20px;line-height:1.5;padding:14px 0 14px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  li b{font-weight:700}
  .pillar-num{font-family:'Fraunces';font-weight:700;font-size:20px;color:var(--accent);margin-bottom:10px}
  .byline{margin-top:34px;font-size:17px;color:var(--muted)}
  .byline b{color:var(--ink);font-weight:700}
  .big-quote{font-family:'Fraunces';font-weight:600;font-size:40px;line-height:1.15;letter-spacing:-.01em;max-width:20ch}
  .big-quote span{color:var(--accent)}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:30px}
  .cardi{border:1px solid var(--rule);border-radius:12px;padding:22px;background:var(--bg)}
  .cardi .k{font-family:'Fraunces';font-weight:700;font-size:21px}
  .cardi .d{font-size:16px;color:var(--muted);margin-top:8px;line-height:1.45}
  .week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:28px}
  .day{border:1px solid var(--rule);border-radius:10px;padding:16px 12px;background:var(--bg);text-align:center}
  .day .dn{font-family:'Lato';font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--muted)}
  .day .dv{margin-top:10px;font-size:15px;line-height:1.35}
  .day.off{background:var(--accent);border-color:var(--accent)}
  .day.off .dn,.day.off .dv{color:#fff}
  .steps{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
  .step{flex:1;min-width:200px;border:1px solid var(--rule);border-radius:12px;padding:22px;background:var(--bg)}
  .step .sn{font-family:'Fraunces';font-weight:700;color:var(--accent);font-size:18px}
  .step .st{font-family:'Fraunces';font-weight:600;font-size:23px;margin-top:6px}
  .step .sd{font-size:16px;color:var(--muted);margin-top:8px;line-height:1.45}
  .cta-box{text-align:center}
  .cta-box .cta-main{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-family:'Lato';font-weight:700;font-size:20px;padding:16px 34px;border-radius:999px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:34px;line-height:1.5;max-width:70ch;margin-left:auto;margin-right:auto}
  .pagefoot{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:340px}h1{font-size:38px}h2{font-size:30px}.grid3,.week{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="pagefoot">Pursuing Freedom &middot; Erin Bradley</div>
<script>
const S=[
 {t:'title'},
 {t:'lead',eyebrow:'The promise',lead:'A business that funds your life, not one that consumes it.'},
 {t:'bullets',eyebrow:'Who this is for',h:'Two kinds of agents, same ceiling',items:[
   '<b>Hungry for more.</b> You want to grow, but every new deal means more hours you do not have.',
   '<b>Maxed out and overwhelmed.</b> You are producing, and you are fried. The business runs on you.',
   'Either way the ceiling is the same, and it is not your market or your effort.']},
 {t:'bullets',eyebrow:'The trap',h:'The hustle myth',items:[
   'More hours. More leads. More grind. Keep pushing and the growth will come.',
   'So you push. And the plateau holds, because you have become the bottleneck.',
   'Working harder on a business built around you only makes the cage stronger.']},
 {t:'quote',eyebrow:'The reframe',q:'Your plateau is not a time-management problem. It is an <span>identity</span> problem.'},
 {t:'story',eyebrow:'Why I teach this',h:'I built the cage myself',items:[
   'In 2007 I went self employed in pursuit of freedom, with no game plan and no safety net.',
   'By 2008 I was so broke I rode my bike to client meetings. I studied what actually worked and rebuilt.',
   'By 2012 I had gone from broke to six figures, and I promptly burned out. No systems, trading all my time for money.',
   'What changed was not effort. It was who I decided to be, and the systems I finally built.']},
 {t:'section',eyebrow:'Part One',h:'The core problem',sub:'You are the bottleneck, and nobody told you that is a choice.'},
 {t:'bullets',eyebrow:'The core problem',h:'When the business runs on you',items:[
   'Every lead, every follow up, every decision routes through one person.',
   'Growth makes it worse, not better. More volume means more of you, until there is none left.',
   'The fix is not a better calendar. It is a different relationship to the work.']},
 {t:'section',eyebrow:'Part Two',h:'The Balanced Growth Method',sub:'Three pillars that take you off the critical path.'},
 {t:'threecards',eyebrow:'The method',h:'How balanced growth works',cards:[
   {k:'1. Mindset & Goal-Setting',d:'Release the self-doubt and the money and success beliefs that quietly cap the business.'},
   {k:'2. Reflection & Visioning',d:'Set goals from the heart, not the head, anchored in the life you actually want.'},
   {k:'3. Action Planning',d:'Turn the vision into a concise, clear plan and the systems that run without you.'}]},
 {t:'pillar',num:'Pillar One',h:'Mindset & Goal-Setting',body:'Most agents try to manage their time out of a plateau. The plateau is held in place by belief, what you think you are worth, what you think money requires of you, who you think you have to be to earn it. We name those beliefs first, because every goal you set sits on top of them.'},
 {t:'pillar',num:'Pillar Two',h:'Reflection & Visioning',body:'Goals set from the head chase someone else\'s scoreboard. Goals set from the heart are anchored in what matters to you today, so the probability of following through goes up and the growth does not cost you the life. We start with reflection on your values, then build the vision from there.'},
 {t:'pillar',num:'Pillar Three',h:'Action Planning',body:'A vision without a plan is a wish. We translate the vision into a concise action plan and the systems, the delegation, the boundaries, the repeatable process, that let the business grow without routing everything back through you. This is how you do much less in order to do much more.'},
 {t:'steps',eyebrow:'The operating model',h:'Get honest. Get free. Get out of the way.',steps:[
   {sn:'01',st:'Get honest',sd:'Identity. Upgrade the decision maker at the center of the business.'},
   {sn:'02',st:'Get free',sd:'Systems. Build the infrastructure that funds your life instead of eating it.'},
   {sn:'03',st:'Get out of the way',sd:'Leadership. Remove yourself as the bottleneck so the business can scale.'}]},
 {t:'section',eyebrow:'Part Three',h:'A business with room to breathe',sub:'What balanced growth actually looks like on your calendar.'},
 {t:'week',eyebrow:'A week on the method',h:'Build a life you do not need a vacation from',days:[
   {dn:'Mon',dv:'2 listing appts'},{dn:'Tue',dv:'Team sync'},{dn:'Wed',dv:'Deep work'},{dn:'Thu',dv:'Closings'},{dn:'Fri',dv:'OFF',off:true}]},
 {t:'bullets',eyebrow:'Why me',h:'I have lived both sides of this',items:[
   'Broke to six figures to burnout, then rebuilt with systems so the business doubled again and kept growing.',
   'I host the Pursuing Freedom podcast and coach realtors and mortgage lenders through EVOLVE.',
   'I teach the exact method I used to get my time and my financial freedom back at the same time.']},
 {t:'threecards',eyebrow:'Recap',h:'The Balanced Growth Method',cards:[
   {k:'Mindset',d:'Clear the beliefs that cap the business.'},
   {k:'Vision',d:'Set goals from the heart, anchored in your life.'},
   {k:'Action',d:'Build the plan and systems that run without you.'}]},
 {t:'cta',eyebrow:'Your next step',h:'Ready to grow without the burnout?',sub:'Book a free consult and we will map your Balanced Growth plan, or join EVOLVE to do it alongside other realtors and mortgage lenders.',cta:'Book your free consult at pursuingfreedom.com',disclaimer:'For education only. No income or result is guaranteed. Results vary and depend on your market, your effort, and many factors outside the control of any program.'}
];

function esc(x){return x}
function slideHTML(s){
 if(s.t==='title'){return `<div class="slide">
   <div class="eyebrow">A live masterclass with Erin Bradley</div>
   <h1>The Balanced Growth Method</h1>
   <div class="sub">Scale your real estate business without burning out.</div>
   <div class="byline"><b>Erin Bradley</b> &middot; Pursuing Freedom &middot; Helping realtors and mortgage lenders build profitable, scalable businesses and lives they love.</div>
 </div>`}
 if(s.t==='lead'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><p class="lead">${s.lead}</p></div>`}
 if(s.t==='quote'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><div class="big-quote">${s.q}</div></div>`}
 if(s.t==='section'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><div class="sub">${s.sub}</div></div>`}
 if(s.t==='bullets'||s.t==='story'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`}
 if(s.t==='threecards'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><div class="grid3">${s.cards.map(c=>`<div class="cardi"><div class="k">${c.k}</div><div class="d">${c.d}</div></div>`).join('')}</div></div>`}
 if(s.t==='pillar'){return `<div class="slide"><div class="pillar-num">${s.num}</div><h2>${s.h}</h2><p class="body">${s.body}</p></div>`}
 if(s.t==='steps'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><div class="steps">${s.steps.map(x=>`<div class="step"><div class="sn">${x.sn}</div><div class="st">${x.st}</div><div class="sd">${x.sd}</div></div>`).join('')}</div></div>`}
 if(s.t==='week'){return `<div class="slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><div class="week">${s.days.map(d=>`<div class="day ${d.off?'off':''}"><div class="dn">${d.dn}</div><div class="dv">${d.dv}</div></div>`).join('')}</div></div>`}
 if(s.t==='cta'){return `<div class="slide cta-box">
   <div class="eyebrow">${s.eyebrow}</div>
   <h2>${s.h}</h2>
   <div class="sub">${s.sub}</div>
   <div class="cta-main">${s.cta}</div>
   <div class="disclaimer">${s.disclaimer}</div>
 </div>`}
 return ''
}
document.getElementById('deck').innerHTML=S.map(slideHTML).join('');
</script>
</body>
</html>
