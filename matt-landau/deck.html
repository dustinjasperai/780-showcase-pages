<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Limited Edition Hospitality · Matt Landau, VRMB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#151210; --panel:#1e1916; --rule:#332b24;
    --acc:#ff5c00; --chalk:#f0ebe3; --body:#c8bfb3; --dim:#8a8075; --warm:#e7e3dc;
  }
  html,body{height:100%}
  body{background:#0d0b0a;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0b0a}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Outfit',sans-serif;font-weight:600;color:var(--chalk);line-height:1.1;letter-spacing:-.01em}
  .t-title h1{font-size:5.4vw;max-width:94%;font-weight:700}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Outfit',sans-serif;font-size:2.0vw;color:var(--warm);margin-top:3.4vh;max-width:84%;line-height:1.35;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#221c17 0%,#100d0b 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:88%;color:var(--warm);font-weight:500}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2a2118 0%,#100d0b 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.0vw;max-width:86%;color:var(--chalk)}
  .t-cta .body{font-family:'Inter',sans-serif;color:var(--warm);font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .pillar{display:flex;align-items:baseline;gap:1.6vw}
  .pillar .letter{font-family:'Outfit',sans-serif;font-size:4.6vw;font-weight:700;color:var(--acc);line-height:1}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--chalk);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none;color:var(--acc)}
  .title-vf{right:7.2%;bottom:8%;width:15vw;height:15vw;opacity:.85}
  .corner-vf{right:6.5%;bottom:7.5%;width:7vw;height:7vw;opacity:.5}
  .brandline{font-family:'Inter',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.8vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}.pillar .letter{font-size:9vw}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="vf" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="33" fill="none" stroke="currentColor" stroke-width="1"/>
    <path d="M50 8 L58 42 L92 50 L58 58 L50 92 L42 58 L8 50 L42 42 Z" fill="currentColor" opacity="0.9"/>
  </symbol>
</svg>

<div class="stage">
  <div class="deck" id="deck"></div>
</div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">VRMB</div>
<div class="hint" id="hint">Use arrow keys or click to advance</div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>

<script>
const S = [
 {t:'title',title:'Limited Edition',sub:'How independent vacation rental owners build a business guests seek out by name, and the listing sites cannot commoditize.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'Your rental is genuinely good. It is also one search result among a thousand.',body:'You run a place people love once they stay. But on the listing sites you are a square in a grid, sorted next to a hundred others by price and availability. A strong month can still feel one algorithm change, or one cheaper listing down the street, away from a quiet calendar.'},
 {t:'dark',title:'A row of near identical squares, ranked by price. That is a race you cannot win by trying harder at it.'},

 {t:'section',idx:'Part One',title:'The Commodity Trap'},
 {t:'normal',k:'Everything got flattened',title:'The platforms turned unique places into interchangeable inventory.',body:'Same wide angle photos, same amenities checklist, same map pin, same filters. The listing sites are built to make properties comparable, because comparison is how a guest chooses fast. The better those platforms get, the more your one of a kind home reads like everyone else’s.'},
 {t:'normal',k:'The only lever left is price',title:'When you compete on price and availability, everyone cheaper is your competitor.',body:'Drop the nightly rate to win the booking and you teach the market that your number is negotiable. The next guest expects the same, the platform rewards whoever discounts hardest, and your best asset quietly becomes your lowest price. There is always someone willing to go cheaper than you.'},
 {t:'dark',title:'There is a commodity model and a limited edition model, and less and less room to succeed anywhere in between.'},

 {t:'section',idx:'Part Two',title:'The Four Pillars of Limited Edition Hospitality'},
 {t:'normal',k:'Pillar one',title:'<span class="pillar"><span class="letter">F</span>Family</span>',body:'A limited edition is not run by a faceless listing. It is run by people a guest can name. The team, the story, and the human being behind the door are the first thing a commodity cannot copy, because nobody else has your family behind the business.'},
 {t:'normal',k:'Pillar two',title:'<span class="pillar"><span class="letter">L</span>Local</span>',body:'Become the local authority guests trust, even when you are not on site. The neighborhood knowledge, the relationships, the things only a true insider knows. A guest can book any house in the area. They cannot book your fifteen years of knowing it.'},
 {t:'normal',k:'Pillar three',title:'<span class="pillar"><span class="letter">S</span>Specialties</span>',body:'Stop serving everyone and become unmissable to someone. A tightly defined guest, a specific reason to visit, a property built around one thing done better than anywhere else. Niche is not smaller. Niche is the reason a guest scrolls past ten cheaper options to reach you.'},
 {t:'normal',k:'Pillar four',title:'<span class="pillar"><span class="letter">S</span>Surprises</span>',body:'Engineer the moments guests did not see coming, and start marketing the next stay the second they walk in the door. Delight is what turns a booking into a story, a story into a review, and a review into the guest who books you direct next time and brings three friends.'},
 {t:'dark',title:'A limited edition is not a nicer commodity. It is a different category, and a different category has no substitute.'},

 {t:'section',idx:'Part Three',title:'What a Defensible Moat Looks Like'},
 {t:'normal',k:'The business this builds',title:'Guests who book you by name, come direct, and refuse to replace you.',body:'When the four pillars are in place, you stop renting to whoever the algorithm sends and start hosting the guests who chose you specifically. They come back direct, they tell people, and your reliance on any single listing site drops year over year. The calendar fills because of who you are, not because you were the cheapest square in the grid.'},
 {t:'dark',title:'The goal was never more bookings from strangers. It was a business your best guests will not trade for a cheaper one.'},
 {t:'normal',k:'Why Matt Landau',title:'He has spent over a decade helping independent operators build businesses the platforms cannot flatten.',body:'Matt founded VRMB in 2012 as a free, open resource for independent vacation rental owners and managers, and grew it into the Inner Circle, one of the most respected communities of independent operators in the industry. Listing Site Independence and Limited Edition Hospitality are his frameworks. This masterclass is the thinking behind them.'},

 {t:'section',idx:'Your Next Step',title:'Build the Business Nobody Can Copy'},
 {t:'normal',k:'Keep going with VRMB',title:'The frameworks, the community, and the operators already doing it.',body:'The Inner Circle is where independent owners and managers put Limited Edition Hospitality and Listing Site Independence to work together, with the templates, the discussions, and the people a few steps ahead of you. Start with the free VRMB ideas, and join the community when you are ready to build the moat for real.'},
 {t:'cta',title:'Ready to build a vacation rental guests seek out by name?',body:'Take the next step with Matt Landau and VRMB.',chips:['Get the free VRMB ideas','Explore the Inner Circle'],disc:'Educational content for independent vacation rental owners and managers. No income, occupancy, or booking result is guaranteed. Results vary by property, market, and operator.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">VR<b>MB</b> · Matt Landau</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
