<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visibility That Converts (Tracy Beavers)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06303a;        /* deep teal ground, darkened from brand #00c2cb */
    --panel:#0c3f4a;     /* panel, same teal family */
    --rule:#1c5a66;      /* teal mid rule */
    --accent:#ffde59;    /* brand yellow, verbatim from brand.json */
    --text:#f4faf9;      /* near-white */
    --muted:#a9c6cc;     /* muted teal-grey */
    --display:'Space Grotesk',system-ui,sans-serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:24px 16px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 48px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center}
  .slide.title{background:linear-gradient(160deg,#06303a,#0c3f4a)}
  .kicker{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.14;margin-bottom:16px}
  h3{font-family:var(--display);font-weight:600;font-size:21px;color:var(--accent);margin-bottom:8px}
  p{font-size:18px;margin-bottom:14px;max-width:62ch}
  p.lead{font-size:21px;color:var(--muted)}
  .big{font-family:var(--display);font-weight:700;font-size:40px;color:var(--accent);line-height:1.1;margin-bottom:14px}
  ul{list-style:none;margin:8px 0 0}
  li{font-size:18px;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:64ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .path{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .path span{background:var(--bg);border:1px solid var(--rule);border-radius:999px;padding:9px 16px;
    font-family:var(--display);font-weight:600;font-size:15px}
  .path span.on{background:var(--accent);color:#06303a;border-color:var(--accent)}
  .step{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule)}
  .step:last-child{border-bottom:none}
  .num{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);min-width:42px}
  .foot{color:var(--muted);font-size:13px;margin-top:22px;max-width:70ch;line-height:1.5}
  .byline{color:var(--muted);font-size:17px;margin-top:8px}
  .cta-note{font-family:var(--display);color:var(--accent);font-weight:600;font-size:20px;margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Masterclass with Tracy Beavers', h1:'Visibility That Converts',
   lead:'How to turn attention into paying clients, without paid ads, complicated funnels, or burnout.',
   byline:'Tracy Beavers. Business Coach, Visibility Strategist & Client Attraction Expert.'},

  {t:'who', kicker:'Who this is for', h2:'You are already showing up. It is just not turning into clients.',
   bullets:[
     'You post, you network, you show up online, and your audience is slowly growing.',
     'But the followers and the likes are not becoming conversations, and the conversations are not becoming clients.',
     'You are a service-based business owner or coach who knows one more freebie is not the fix.'
   ]},

  {t:'trap', kicker:'The trap', h2:'The advice you keep hearing is "get more visible."',
   p:['So you add another platform. Another posting schedule. Another trend.',
      'More visibility feels like progress. But if attention has nowhere to go, you are just louder, not busier.']},

  {t:'reframe', kicker:'The reframe', big:'More visibility is not the answer.',
   p:['Visibility without a path from attention to conversation is just noise.',
      'The business owners who book out are not the loudest. They are the ones with a system that moves a stranger from "I just found you" to "I want to work with you."']},

  {t:'myth', kicker:'The freebie myth', h2:'One more freebie will not fix this',
   p:['A single opt-in gift gets you an email address and then silence. The download lands, the enthusiasm fades, and the subscriber forgets who you are.',
      'A freebie is a door. It is not the hallway that walks someone toward working with you. That hallway is what most owners never build.']},

  {t:'part', kicker:'Part One', h2:'The real problem: the missing middle',
   p:['There is a journey every client takes before they pay you:'],
   path:['Visibility','Conversations','Subscribers','Clients'],
   pafter:['Most advice obsesses over the first box and the last box. The money is lost in the middle, where attention is supposed to become a real conversation and never does.']},

  {t:'cost', kicker:'What the gap costs', h2:'A quiet launch is usually a middle problem',
   bullets:[
     'Your list grows slowly, because new people have no reason to stay once the freebie is read.',
     'Launches feel like shouting into a room that barely knows you.',
     'You work harder on content, and the needle moves less, because the content has nowhere to lead.'
   ]},

  {t:'part', kicker:'Part Two', h2:'The method: three organic strategies',
   p:['This is the heart of Business Visibility Made Easy. Three moves that turn visibility into conversations, without spending a dollar on ads.']},

  {t:'strat', kicker:'Strategy one', h3:'The 90-Day Content Map',
   p:['Map out 90 days of intentional content in about 30 minutes, so you stay visible to the right people without waking up every morning wondering what to post.',
      'Content stops being a daily scramble and starts being a plan that points at one outcome.']},

  {t:'strat', kicker:'Strategy two', h3:'The 24/7 Profile',
   p:['The overlooked profile tweaks that turn any online profile, on any platform, into a 24/7 tool for building curiosity and trust, before someone ever books a call.',
      'Your profile works while you sleep, warming people up so the conversation is half-won before it starts.']},

  {t:'strat', kicker:'Strategy three', h3:'Become the Known Presence',
   p:['My signature strategy: becoming a known, trusted presence inside the communities where your ideal clients already gather, even when direct promotion is not allowed.',
      'You do not chase the room. You become the person the right people get curious about and reach out to.']},

  {t:'strat', kicker:'The multiplier', h3:'Grow With Other People’s Audiences',
   p:['Collaborations, guesting, and cross-promotion put you in front of warm audiences someone else spent years building.',
      'It is the fastest honest way to grow a list and a reputation at the same time, with nothing spent on ads.']},

  {t:'system', kicker:'The roadmap', h2:'The 3-Step System To Grow',
   steps:[
     ['1','Begin with the end in mind','Get clear on the client and the outcome you are actually building toward, before you touch tactics.'],
     ['2','Create a roadmap for your journey','Turn that outcome into a simple, repeatable path: content, profile, community, follow-up.'],
     ['3','Stay the course for success','Consistency beats intensity. The system keeps working while you keep showing up.']
   ]},

  {t:'score', kicker:'Know where you stand', h2:'The Visibility & Conversations Scorecard',
   p:['Before you add a single tactic, it helps to see exactly where your journey leaks: visibility, conversations, subscribers, or the handoff to clients.',
      'A quick self-assessment shows you the one box to fix next, instead of trying to fix all four at once.']},

  {t:'look', kicker:'Part Three', h2:'A week once the system is running',
   bullets:[
     'You know what to post and why, 90 days out, planned in about 30 minutes.',
     'The right people find your profile and reach out already warm.',
     'You are the trusted name inside the communities your buyers already live in.',
     'Visibility turns into conversations, conversations into subscribers, subscribers into clients, on repeat.'
   ]},

  {t:'why', kicker:'Why me', h2:'I built this the hard way',
   p:['I spent twelve years as a corporate claims investigator, then moved through insurance, banking, real estate, and three of my own businesses before I started coaching.',
      'In five years I have helped hundreds of women turn visibility into real conversations, relationships, and clients, and built a multi-six-figure coaching business on these exact organic strategies, without paid ads.']},

  {t:'recap', kicker:'The whole picture', h2:'Attention becomes income on purpose',
   p:['Map your content, fix your profile, become the known presence, and borrow the right audiences, and the middle of the journey stops leaking.',
      'That is the difference between being seen and being booked.']},

  {t:'cta', kicker:'Your next step', h2:'Turn your visibility into clients',
   p:['Business Visibility Made Easy is my eight-week group coaching accelerator: weekly live coaching, personalized feedback, the full method, templates, and a community of owners doing the same work.'],
   ctaNote:'Join the waitlist at tracybeavers.com, or book a chat with me to see if it is your fit.',
   foot:'Educational content only. Results depend on your own effort, offer, and market; nothing here is a promise or guarantee of income or specific results.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=el('div','slide'+(s.t==='title'?' title':''));
  if(s.kicker)d.appendChild(el('div','kicker',s.kicker));
  if(s.h1)d.appendChild(el('h1',null,s.h1));
  if(s.h2)d.appendChild(el('h2',null,s.h2));
  if(s.h3)d.appendChild(el('h3',null,s.h3));
  if(s.big)d.appendChild(el('div','big',s.big));
  if(s.lead)d.appendChild(el('p','lead',s.lead));
  if(s.byline)d.appendChild(el('div','byline',s.byline));
  (s.p||[]).forEach(t=>d.appendChild(el('p',null,t)));
  if(s.bullets){const ul=el('ul');s.bullets.forEach(b=>ul.appendChild(el('li',null,b)));d.appendChild(ul);}
  if(s.path){const w=el('div','path');s.path.forEach((p,i)=>{const sp=el('span',i<s.path.length?'' :'',p);w.appendChild(sp);});d.appendChild(w);}
  (s.pafter||[]).forEach(t=>d.appendChild(el('p',null,t)));
  if(s.steps){s.steps.forEach(([n,h,b])=>{const st=el('div','step');st.appendChild(el('div','num',n));const box=el('div');box.appendChild(el('h3',null,h));box.appendChild(el('p',null,b));st.appendChild(box);d.appendChild(st);});}
  if(s.ctaNote)d.appendChild(el('div','cta-note',s.ctaNote));
  if(s.foot)d.appendChild(el('div','foot',s.foot));
  deck.appendChild(d);
});
</script>
</body>
</html>
