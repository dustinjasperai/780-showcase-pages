<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Psychology of NO — A Live Masterclass with Brian Will</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#181b25;        /* his dominant dark ground (brand.json, 24 uses) */
    --panel:#20232e;     /* one step lifted */
    --rule:rgba(226,226,226,.14);
    --ink:#ece9e3;
    --mut:#9aa3b2;
    --accent:#aa0505;    /* his site H1 red (brand.json h1 color) */
    --disp:"Work Sans",Arial,Helvetica,sans-serif;
    --body:Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0f1119;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw}
  .slide{display:none;width:min(1000px,92vw);background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:clamp(28px,5vw,64px);min-height:60vh;position:relative;overflow:hidden}
  .slide.on{display:block}
  .slide:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--disp);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-size:clamp(11px,1.3vw,14px);margin-bottom:22px}
  h1{font-family:var(--disp);font-weight:800;line-height:1.02;font-size:clamp(34px,6.4vw,76px);letter-spacing:-.01em}
  h2{font-family:var(--disp);font-weight:800;line-height:1.05;font-size:clamp(26px,4.2vw,50px);letter-spacing:-.01em}
  .sub{color:var(--mut);font-size:clamp(16px,2vw,23px);margin-top:20px;max-width:40ch;line-height:1.5}
  .big{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5.2vw,60px);line-height:1.05}
  .big .a{color:var(--accent)}
  .lead{font-size:clamp(17px,2.1vw,25px);line-height:1.5;margin-top:18px;max-width:46ch}
  ul{margin-top:24px;list-style:none;display:grid;gap:16px}
  li{padding-left:34px;position:relative;font-size:clamp(16px,1.9vw,22px);line-height:1.45;max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:.55em;width:14px;height:3px;background:var(--accent)}
  .ledger{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
  .cell{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 22px;min-width:150px}
  .cell b{font-family:var(--disp);font-weight:800;font-size:clamp(26px,3.4vw,40px);color:var(--accent);display:block}
  .cell span{color:var(--mut);font-size:14px}
  .partnum{font-family:var(--disp);font-weight:800;color:var(--accent);font-size:clamp(14px,1.6vw,18px);letter-spacing:.14em;text-transform:uppercase}
  .disc{color:var(--mut);font-size:13px;line-height:1.5;margin-top:26px;max-width:60ch}
  .nav{position:fixed;bottom:18px;right:22px;font-family:var(--disp);color:var(--mut);font-size:13px;letter-spacing:.08em}
  .brandline{position:fixed;bottom:18px;left:22px;font-family:var(--disp);color:var(--mut);font-size:13px;letter-spacing:.08em}
  .quietchat{margin-top:26px;display:grid;gap:10px;max-width:60ch}
  .bub{padding:12px 16px;border-radius:12px;font-size:clamp(14px,1.7vw,18px);line-height:1.4;max-width:80%}
  .bub.in{background:var(--panel);border:1px solid var(--rule);justify-self:start;border-bottom-left-radius:3px}
  .bub.out{background:var(--accent);color:#fff;justify-self:end;border-bottom-right-radius:3px}
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandline">Brian Will</div>
<div class="nav"><span id="pos">1</span> / <span id="tot">1</span>&nbsp;&nbsp;(&larr; &rarr;)</div>
<script>
const S=[
  {t:'title', kick:'A Live Masterclass with Brian Will', h:'The Psychology of NO', sub:'How to close more sales without chasing, discounting, or cheesy closers.'},
  {t:'who', kick:'Who this is for', h:'You are great at what you do.', body:'You built something real. But deals still stall at the last conversation, and you find yourself dropping the price just to win. This session is for business owners and founders who are tired of leaving money on the table at the close.'},
  {t:'trap', kick:'The trap', h:'You were told to "always be closing."', body:'So you learned the scripts, the pressure, the follow-up that feels like chasing. It makes good people feel sleazy, and it still loses the deal. The problem was never your effort. It was the model.'},
  {t:'hook', kick:'The reframe', big:'You do not have a lead problem. You have a <span class="a">NO</span> problem.', lead:'Every deal you lost said no for a reason you never actually heard. Learn to hear it, and the same pipeline closes more.'},
  {t:'part', partnum:'Part One', h:'Why good operators lose at the close'},
  {t:'content', kick:'The moment that decides it', h:'The sale is won or lost in one conversation.', body:'And most owners wing exactly that moment. You can be the best in your field and still fumble the five minutes that matter most, because nobody taught you what is really happening in them.'},
  {t:'content', kick:'The core truth', big:'Sales and negotiation are the <span class="a">same thing</span>.', lead:'Every single sale is a mini negotiation. The instant you treat it that way, you stop pitching and start listening for the one thing standing between you and yes.'},
  {t:'content', kick:'Why louder fails', h:'Arguing value harder does not work.', body:'Turning up the volume on your pitch makes you sound desperate. Discounting to win trains the buyer to wait for your next discount. Both cost you the deal, the margin, or the respect.'},
  {t:'part', partnum:'Part Two', h:'The Psychology of NO'},
  {t:'content', kick:'Pillar one', h:'Hear what the buyer is actually thinking.', body:'"Too expensive" and "let me think about it" are almost never the real objection. The first skill is reading the thought underneath the words, because that is the thing you have to solve.'},
  {t:'content', kick:'Pillar two', h:'Human nature, and the right words in the right places.', body:'People decide emotionally and justify logically. The method uses how humans actually make decisions, and a small number of precise words at the exact moments they matter.'},
  {t:'content', kick:'Pillar three', h:'Ethical soft-selling. No manipulation.', body:'No cheesy closers, no tricks, nothing you would be embarrassed to use on a friend. Pressure wins the argument and loses the relationship. This wins both.'},
  {t:'content', kick:'Pillar four', big:'A "no" is <span class="a">information</span>.', lead:'It is not rejection. It is the buyer telling you exactly what to address next. Once you believe that, the hardest moment in the sale becomes the most useful.'},
  {t:'content', kick:'In the room', h:'What it sounds like.', chat:[['in','Honestly it is more than we budgeted. Let me think about it.'],['out','Totally fair. What would have to be true for this to be an easy yes?'],['in','I guess I need to know it will actually work for us.'],['out','Then let us not talk price yet. Let us talk about that.']]},
  {t:'part', partnum:'Part Three', h:'Your next ten deals, done differently'},
  {t:'content', kick:'The conversation, reshaped', h:'Calm, curious, price last.', body:'You stop defending and start diagnosing. The buyer feels understood instead of handled, and the close becomes the natural end of a good conversation rather than a fight at the finish.'},
  {t:'content', kick:'So growth can hold', h:'Three phases quietly stall every business.', body:'Delegation, where you still wear every hat. Fear, where no hire ever matches your standard. Clarity, where there is no plan, just dead-end back roads. Closing more only helps if the business behind it can carry the weight.'},
  {t:'why', kick:'Why listen to me', h:'I have done this, not just taught it.', ledger:[['10','companies built'],['3','exits'],['$500M+','peak valuations'],['2x','WSJ bestseller'],['1,000+','salespeople trained']]},
  {t:'content', kick:'You will leave with', h:'A new way to handle the moment that matters.', body:'How to hear the real objection, what to say when you hear it, and how to close without ever using a line that makes you cringe. One live session, one deal you are stuck on, worked in real time.'},
  {t:'cta', kick:'Your next step', h:'Want me in your corner?', body:'If this is the way you want to sell and scale, come work with me directly. Start at brianwillmedia.com and book a coaching assessment.', disc:'Educational only. Results vary and depend on your market, offer, and execution. Nothing here is a promise or guarantee of income or results.'}
];

const stage=document.getElementById('stage');
let i=0;
function esc(s){return s;}
function render(){
  const s=S[i];
  let inner='';
  if(s.kick) inner+='<div class="kick">'+s.kick+'</div>';
  if(s.partnum) inner+='<div class="partnum">'+s.partnum+'</div>';
  if(s.h) inner+='<h1>'+s.h+'</h1>';
  if(s.big) inner+='<div class="big">'+s.big+'</div>';
  if(s.lead) inner+='<div class="lead">'+s.lead+'</div>';
  if(s.sub) inner+='<div class="sub">'+s.sub+'</div>';
  if(s.body) inner+='<div class="lead">'+s.body+'</div>';
  if(s.list){inner+='<ul>';s.list.forEach(x=>inner+='<li>'+x+'</li>');inner+='</ul>';}
  if(s.chat){inner+='<div class="quietchat">';s.chat.forEach(m=>inner+='<div class="bub '+m[0]+'">'+m[1]+'</div>');inner+='</div>';}
  if(s.ledger){inner+='<div class="ledger">';s.ledger.forEach(c=>inner+='<div class="cell"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>');inner+='</div>';}
  if(s.disc) inner+='<div class="disc">'+s.disc+'</div>';
  stage.innerHTML='<div class="slide on">'+inner+'</div>';
  document.getElementById('pos').textContent=(i+1);
  document.getElementById('tot').textContent=S.length;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
stage.addEventListener('click',()=>go(1));
render();
</script>
</body>
</html>
