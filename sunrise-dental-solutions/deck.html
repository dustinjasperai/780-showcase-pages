<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplication Through Subtraction — Sunrise Dental Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1511; --panel:#241d17; --rule:#3a2e24;
    --accent:#fb5718; --text:#f4ece2; --muted:#b8a894;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Lora',Georgia,serif;overflow:hidden}
  #stage{position:relative;height:100vh;width:100vw}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7vh 9vw;animation:fade .4s ease}
  .slide.on{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(30px,5.4vw,62px);
    line-height:1.04;letter-spacing:-.5px}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(24px,3.6vw,40px);
    line-height:1.12;margin-bottom:.5em}
  .kicker{font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;letter-spacing:3px;
    text-transform:uppercase;color:var(--accent);margin-bottom:1.6rem}
  .sub{font-size:clamp(17px,2.1vw,23px);color:var(--muted);margin-top:1.4rem;max-width:40ch;line-height:1.5}
  p.lead{font-size:clamp(18px,2.3vw,26px);line-height:1.5;max-width:46ch}
  ul{list-style:none;margin-top:1.4rem}
  li{font-size:clamp(16px,1.9vw,22px);line-height:1.45;padding-left:1.5rem;position:relative;margin:.7rem 0;max-width:50ch}
  li::before{content:"";position:absolute;left:0;top:.62em;width:.62rem;height:.62rem;background:var(--accent);
    border-radius:50% 50% 50% 0;transform:rotate(45deg)}
  .pillar-no{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--rule);font-size:clamp(60px,12vw,150px);line-height:.8}
  .horizon{position:absolute;left:0;right:0;bottom:0;height:34%;
    background:radial-gradient(120% 150% at 50% 100%, rgba(251,87,24,.34), rgba(251,87,24,0) 60%);pointer-events:none}
  .sun{position:absolute;right:9vw;top:14vh;width:clamp(70px,10vw,140px);height:clamp(70px,10vw,140px);
    border-radius:50%;background:radial-gradient(circle at 50% 50%,#fb5718,#c23c0c);box-shadow:0 0 70px rgba(251,87,24,.5)}
  .card{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    padding:1.3rem 1.5rem;border-radius:6px;max-width:54ch;margin-top:1rem}
  .card p{font-size:clamp(16px,1.9vw,21px);line-height:1.5}
  .foot{position:absolute;left:9vw;bottom:4vh;font-family:'Montserrat',sans-serif;font-size:12px;
    letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
  .disc{font-size:13px;color:var(--muted);max-width:62ch;margin-top:1.8rem;line-height:1.5;font-style:italic}
  .nav{position:absolute;right:3vw;bottom:3vh;font-family:'Montserrat',sans-serif;font-size:13px;color:var(--muted);z-index:5}
  .cta-btn{display:inline-block;margin-top:1.8rem;font-family:'Montserrat',sans-serif;font-weight:700;
    background:var(--accent);color:#1a1511;padding:.85rem 1.6rem;border-radius:7px;letter-spacing:.5px;text-decoration:none}
  @media(max-width:640px){.sun{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><span id="pg">1</span> / <span id="tot"></span></div>
<script>
const S=[
  {t:'title', kicker:'A Sunrise Dental Solutions Masterclass', h1:'Multiplication<br>Through Subtraction', sub:'How to make more, and work less, in your dental practice.', foot:'Dr. Anthony Feck, DMD &nbsp;&middot;&nbsp; Sunrise Dental Solutions', glow:true},
  {t:'bullets', kicker:'What you will leave with', h2:'The practice is supposed to serve the owner, not the other way around.', items:['Why doing more almost never gives a dentist more freedom','The five levers that raise production while you step back, not lean in','A clear picture of what your practice looks like when it runs without you at the center']},
  {t:'lead', kicker:'Who this is for', h2:'The successful, stuck owner.', lead:'You built a real practice. The numbers are good. And yet the whole thing still runs through you, and the only lever you know to pull is to work harder. This is for you.'},
  {t:'lead', kicker:'The trap', h2:'More production has quietly cost you your life.', lead:'Every time you grew, you added hours, chairs, and stress, and told yourself it was the price of success. So the better the practice did, the less of your own life you got back.'},
  {t:'statement', kicker:'The reframe', h1:'The busier your practice gets, the more it owns you.', sub:'Freedom is not on the other side of more effort. It is on the other side of a different design.', glow:true},
  {t:'lead', kicker:'Part one &nbsp;&middot;&nbsp; the real problem', h2:'You are the system.', lead:'When you are the glue, every decision, every save, every good day depends on you showing up at full power. That is not a practice you own. It is a job you cannot leave.'},
  {t:'bullets', kicker:'What it is really costing', h2:'The hidden bill.', items:['Time you will not get back with the people who matter','A team that waits to be told instead of taking ownership','A business worth less the day you want to step back or sell']},
  {t:'statement', kicker:'Part two &nbsp;&middot;&nbsp; the method', h1:'Make more by<br>subtracting yourself.', sub:'Five levers that grow the practice while pulling you out of its center, one at a time.', glow:true},
  {t:'pillar', no:'01', name:'The Ultimate Team', body:'Build a team that runs the practice when you are not standing over it. Right people, clear roles, a culture and accountability that hold without you. Your production should not live or die on your presence.'},
  {t:'pillar', no:'02', name:'Systems Over Sweat', body:'Sustainable growth comes from repeatable systems, not heroic individual effort. When the schedule, the handoffs, and the follow up run on a system, the practice stops leaning on your energy.'},
  {t:'pillar', no:'03', name:'Measure To Manage', body:'You cannot improve what you never look at. A handful of the right numbers, reviewed on a rhythm, turns guesswork into decisions and lets you steer the practice instead of reacting to it.'},
  {t:'pillar', no:'04', name:'Own Your Market', body:'A predictable flow of the right new patients, from internal and external marketing you control. Not hoping referrals show up, but owning your position so the chair fills on purpose.'},
  {t:'pillar', no:'05', name:'Solution Yes', body:'More of the patients already in your chair saying yes to the care they need. Presented with clarity and trust, case acceptance lifts production per patient without adding a single new appointment.'},
  {t:'lead', kicker:'The shift underneath all five', h2:'Lead, do not just manage.', lead:'Managing means staying on top of the work. Leading means building people and systems that carry the work for you. One keeps you in the chair. The other hands you your time back.'},
  {t:'statement', kicker:'Part three &nbsp;&middot;&nbsp; the freed practice', h1:'Higher production. Fewer of your hours.', sub:'Not someday. This is what the five levers are built to produce.', glow:true},
  {t:'bullets', kicker:'A week in the freed practice', h2:'You clinical when you choose to be.', items:['The schedule fills itself from a market you own','The team runs the day and brings you decisions, not fires','You read three numbers, not a hundred, and know exactly where to steer','And the practice is worth more every month, with or without you in it']},
  {t:'bullets', kicker:'Why listen to me', h2:'Dr. Anthony Feck, DMD', items:['Nearly 40 years in dentistry, starting one of the most successful practices in my state from scratch','Founder of Sunrise Dental Solutions, today coaching dozens of owner practices across the country','Author of The Prosperous Dental Practice, and I teach what I built, not theory']},
  {t:'lead', kicker:'The method, in one line', h2:'The Ultimate Team. Systems Over Sweat. Measure To Manage. Own Your Market. Solution Yes.', lead:'Five levers, one outcome: a practice that produces more while leaning on you less. That is multiplication through subtraction.'},
  {t:'cta', kicker:'Your next step', h1:'Book your free<br>Practice Analysis.', sub:'We will look at your real numbers together and map which of the five levers gives you back the most, the fastest.', cta_href:'https://sunrisedentalsolutions.com/free-practice-analysis/', cta_label:'Start at sunrisedentalsolutions.com', disc:'For educational purposes only. This masterclass is not financial, legal, or tax advice. No specific result is guaranteed. Results vary by practice, market, team, and execution.', glow:true}
];

function esc(x){return x||''}
function H(s){
  const glow = s.glow ? '<div class="sun"></div><div class="horizon"></div>' : '';
  const kick = s.kicker ? `<div class="kicker">${s.kicker}</div>` : '';
  switch(s.t){
    case 'title':
    case 'statement':
      return `${glow}${kick}<h1>${s.h1}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:''}${s.foot?`<div class="foot">${s.foot}</div>`:''}`;
    case 'lead':
      return `${glow}${kick}<h2>${s.h2}</h2><p class="lead">${s.lead}</p>`;
    case 'bullets':
      return `${glow}${kick}<h2>${s.h2}</h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'pillar':
      return `<div class="pillar-no">${s.no}</div><h2>${s.name}</h2><div class="card"><p>${s.body}</p></div>`;
    case 'cta':
      return `${glow}${kick}<h1>${s.h1}</h1><div class="sub">${s.sub}</div><a class="cta-btn" href="${s.cta_href}">${s.cta_label}</a><div class="disc">${s.disc}</div>`;
  }
  return '';
}

const stage=document.getElementById('stage');
S.forEach((s,i)=>{const d=document.createElement('section');d.className='slide'+(i===0?' on':'');d.innerHTML=H(s);stage.appendChild(d);});
document.getElementById('tot').textContent=S.length;
const slides=[...document.querySelectorAll('.slide')];
let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((e,i)=>e.classList.toggle('on',i===cur));document.getElementById('pg').textContent=cur+1;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
stage.addEventListener('click',e=>{const x=e.clientX/window.innerWidth;go(x<0.28?cur-1:cur+1);});
</script>
</body>
</html>
