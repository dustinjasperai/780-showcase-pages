<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Psychology of Memoir — a live masterclass with Lisa Cooper Ellison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f1e7; --panel:#fbf8f1; --ink:#272320; --muted:#6b6256;
    --cobalt:#1c3f8f; --gold:#b8872c; --rule:#d8cfbe;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.55}
  .deck{max-width:1120px;margin:0 auto}
  .slide{min-height:94vh;display:flex;flex-direction:column;justify-content:center;
    padding:7vh 8vw;border-bottom:1px solid var(--rule);position:relative}
  .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cobalt);
    font-weight:600;margin-bottom:22px}
  .kick .n{color:var(--muted)}
  h1{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,68px);
    line-height:1.05;letter-spacing:-.01em}
  h2{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(28px,4.4vw,46px);
    line-height:1.12;letter-spacing:-.01em}
  .lede{font-family:'Spectral',Georgia,serif;font-size:clamp(20px,2.6vw,30px);
    font-weight:400;color:var(--ink);max-width:26ch;line-height:1.3}
  p.body{font-size:clamp(16px,1.5vw,19px);max-width:60ch;margin-top:20px;color:#3b352d}
  p.body + p.body{margin-top:14px}
  .big{font-family:'Spectral',Georgia,serif;font-size:clamp(30px,5vw,56px);font-weight:500;
    line-height:1.12;max-width:20ch}
  .big .hi{color:var(--cobalt)}
  .sub{color:var(--muted);margin-top:18px;font-size:clamp(15px,1.4vw,18px);max-width:52ch}
  .hr{width:72px;height:3px;background:var(--gold);margin:26px 0;border:0}
  .cover{background:var(--cobalt);color:var(--paper)}
  .cover .kick{color:#cdd8f0}
  .cover h1{color:var(--paper)}
  .cover .by{margin-top:30px;color:#dfe6f6;font-size:17px}
  .cover .by b{color:#fff;font-weight:600}
  .section{background:#efe7d6}
  .section .num{font-family:'Spectral',serif;font-size:clamp(60px,12vw,150px);color:var(--gold);
    opacity:.5;line-height:.8;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:24px}
  .card .t{font-family:'Spectral',serif;font-weight:600;font-size:21px;color:var(--cobalt)}
  .card .d{margin-top:10px;color:#4a4339;font-size:15.5px}
  .card .step{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    font-weight:600;margin-bottom:12px}
  ul.clean{margin-top:24px;max-width:58ch}
  ul.clean li{list-style:none;padding:14px 0 14px 26px;border-top:1px solid var(--rule);
    position:relative;font-size:clamp(16px,1.5vw,19px);color:#3b352d}
  ul.clean li:before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;
    background:var(--gold);border-radius:2px;transform:rotate(45deg)}
  ul.clean li b{color:var(--ink)}
  .cred{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
  .cred .facts li{border-color:#d8cfbe}
  .map{position:absolute;inset:0;pointer-events:none;opacity:.5}
  .disclaimer{color:var(--muted);font-size:13px;max-width:60ch;margin-top:28px;line-height:1.5}
  .ctabox{background:var(--cobalt);color:var(--paper);border-radius:16px;padding:40px 44px;
    max-width:34ch;margin-top:30px}
  .ctabox .go{display:inline-block;margin-top:20px;background:var(--gold);color:#1a1405;
    font-weight:600;padding:13px 24px;border-radius:999px;text-decoration:none;font-size:16px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}.cred{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* The coach's masterclass. Her IP, her voice, her CTA. No em dashes in copy. */
const S = [
  {t:'title',
   kick:'A live masterclass',
   h:'The Psychology of Memoir',
   lede:'How to write your hardest story without getting stuck.',
   by:'with <b>Lisa Cooper Ellison</b>, trauma-informed writing coach'},

  {t:'who',
   kick:'Who this is for',
   h:'You have a story that matters and a draft that keeps stalling.',
   body:['You know the experience you need to write about. You have started it more than once. And every time you reach the hard part, the words go flat, or they flood, and you close the laptop.',
         'This session is for the writer who is ready to turn a painful chapter of their life into a book, and wants a way in that is safe, structured, and finishable.']},

  {t:'trap',
   kick:'The trap',
   big:'You try to push through. The harder you push, the more it resists.',
   sub:'Willpower is the wrong tool for this. The resistance is not weakness, and it is not a lack of talent.'},

  {t:'hook',
   kick:'The reframe',
   big:'Your memoir is not blocked. Your brain is <span class="hi">protecting the story</span>.',
   sub:'Difficult memories are stored differently than ordinary ones. When you reach for them head-on, your nervous system does exactly what it is built to do. The craft of memoir is knowing how to work with that, not against it.'},

  {t:'section', num:'1', kick:'Part One', h:'Why the hard story stalls.'},

  {t:'content',
   kick:'The neuroscience of memory',
   h:'The problem is not the material. It is the approach.',
   body:['A memoir asks you to revisit the exact experiences your mind has worked hardest to file away. Approached without a method, that is overwhelming, so the draft stops.',
         'Understanding how memory and storytelling actually work in the brain changes everything about how you sit down to write. You stop re-living the event and start shaping it.']},

  {t:'content',
   kick:'A key distinction',
   big:'A memoir is not a diary. It is a map.',
   sub:'A diary records what happened. A memoir selects, orders, and gives meaning to what happened, so a stranger can walk through it and come out changed. That shift, from recording to shaping, is where most drafts get unstuck.'},

  {t:'section', num:'2', kick:'Part Two', h:'The method.'},

  {t:'framework',
   kick:'The Memory Blueprint',
   h:'Three moves that make the hard part writeable.',
   cards:[
     {step:'Move one', t:'Map the memory safely', d:'Locate the experience and approach it with the resilience tools that let you write it without being pulled back into it.'},
     {step:'Move two', t:'Find your Essential Question', d:'Name the single question your memoir is really asking. It becomes the spine that tells you what belongs and what does not.'},
     {step:'Move three', t:'Draft without reliving it', d:'Use the structure to write toward meaning instead of replaying the event, so the pages move forward.'}
   ]},

  {t:'content',
   kick:'The Essential Question',
   h:'One question organizes the whole book.',
   body:['Most stalled memoirs are trying to say everything at once. The Essential Question is the quiet, central question underneath your story, the thing you were actually trying to understand.',
         'Once you can say it in a sentence, the draft stops sprawling. You know which scenes earn their place and which ones, however true, belong in a different book.']},

  {t:'content',
   kick:'The Misperception Matrix',
   h:'Revision is seeing what you could not see then.',
   body:['In the moment, you understood your experience one way. The finished memoir carries the meaning you can only see now, with distance.',
         'The Misperception Matrix is a way to hold both, the narrator who lived it and the writer who understands it, so revision deepens the story instead of flattening it into a lesson.']},

  {t:'content',
   kick:'Momentum',
   h:'From stuck memories to a streamlined draft.',
   body:['Finishing a hard book is a change you move through in stages, not a single act of discipline. Knowing which stage you are in tells you what the draft needs next, and what it does not.',
         'This is how a writer who has restarted six times finally gets to a complete, shaped draft, without gaslighting, embellishment, or fiction.']},

  {t:'content',
   kick:'Finding the universal',
   big:'The most personal story, told well, is the most universal.',
   sub:'Readers do not need to have lived your life. Told with structure and honesty, your specific story becomes the mirror a stranger has been looking for.'},

  {t:'section', num:'3', kick:'Part Three', h:'Finishing.'},

  {t:'content',
   kick:'The psychology of completion',
   h:'Knowing when it is done, and letting it be done.',
   body:['Finishing a memoir brings its own resistance: project-related grief, perfectionism, and the quiet fear of letting the story leave your hands.',
         'The final move is recognizing when the book is actually finished, writing an ending that satisfies, and carrying the mental tools you need for querying and publishing.']},

  {t:'credibility',
   kick:'Why learn this from Lisa',
   h:'Two decades at the intersection of storytelling and healing.',
   facts:[
     'Ed.S in Clinical Mental Health Counseling, with a background in mindfulness.',
     'Roughly twenty years helping writers turn difficult experiences into art.',
     'Essays and stories in The New York Times, HuffPost, Hippocampus, and Kenyon Review Online.',
     'Host of the Writing Your Resilience podcast, with more than one hundred episodes.',
     'Writers she has worked with have placed books with the American Psychological Association, Hachette, and St. Martin’s Press, among others.'
   ]},

  {t:'content',
   kick:'When the method is working',
   h:'A hard story, finally on the page, and finishable.',
   body:['You stop bracing every time you sit down. You know the move for the part that used to stop you. The draft has a spine, and it moves.',
         'That is the difference between a story you carry and a book you finish.']},

  {t:'cta',
   kick:'Your next step',
   h:'Write the story only you can write.',
   sub:'If this is the way in you have been missing, the next step is to work with Lisa directly, starting with a single session or the next live cohort of The Psychology of Memoir.',
   go:'Work with Lisa',
   disclaimer:'This masterclass is educational. It teaches craft and process; it is not therapy or a substitute for mental health care. Outcomes are not guaranteed. Results vary by writer, story, and circumstance.'}
];

const el = document.getElementById('deck');
function esc(s){return s;}
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide '+(s.t==='title'?'cover':'')+(s.t==='section'?'section':'');
  let h='';
  const kick = s.kick?`<div class="kick">${s.kick}${s.t==='section'?'':''}</div>`:'';
  if(s.t==='title'){
    h=`${kick}<h1>${s.h}</h1><hr class="hr"><div class="lede">${s.lede}</div><div class="by">${s.by}</div>`;
  } else if(s.t==='section'){
    h=`<div class="num">${s.num}</div>${kick}<h2>${s.h}</h2>`;
  } else if(s.t==='who'){
    h=`${kick}<h2>${s.h}</h2>${s.body.map(b=>`<p class="body">${b}</p>`).join('')}`;
  } else if(s.t==='trap'||s.t==='hook'||(s.big&&s.t==='content')){
    h=`${kick}<div class="big">${s.big}</div>${s.sub?`<div class="sub">${s.sub}</div>`:''}`;
  } else if(s.t==='framework'){
    h=`${kick}<h2>${s.h}</h2><div class="grid">${s.cards.map(c=>`<div class="card"><div class="step">${c.step}</div><div class="t">${c.t}</div><div class="d">${c.d}</div></div>`).join('')}</div>`;
  } else if(s.t==='credibility'){
    h=`${kick}<div class="cred"><div><h2>${s.h}</h2></div><div><ul class="clean facts">${s.facts.map(f=>`<li>${f}</li>`).join('')}</ul></div></div>`;
  } else if(s.t==='cta'){
    h=`${kick}<h2>${s.h}</h2><div class="ctabox"><div class="sub" style="color:#dfe6f6;margin-top:0">${s.sub}</div><span class="go">${s.go}</span></div><div class="disclaimer">${s.disclaimer}</div>`;
  } else {
    h=`${kick}<h2>${s.h}</h2>${(s.body||[]).map(b=>`<p class="body">${b}</p>`).join('')}`;
  }
  sec.innerHTML=h;
  el.appendChild(sec);
});
</script>
</body>
</html>
