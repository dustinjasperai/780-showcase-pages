<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Steady Studio — a Maker Division masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe6; --panel:#e8e0d1; --ink:#19291c; --accent:#2f5d3a; --taupe:#91836e;
    --serif:'Spectral',Georgia,serif; --sans:'Archivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d8cfbf;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--bg);border:1px solid #d8cfbf;border-radius:10px;padding:60px 64px;margin:0 0 26px;
    min-height:520px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--sans);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--taupe);margin-bottom:22px;font-weight:600}
  h1{font-family:var(--serif);font-weight:600;font-size:54px;line-height:1.05;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;margin-bottom:18px}
  .lede{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--accent);line-height:1.35;max-width:30ch}
  p{font-size:19px;line-height:1.6;max-width:62ch;color:#2d3b30}
  p+p{margin-top:14px}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;border-bottom:1px solid #ddd3c2;position:relative;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border:2px solid var(--accent);border-radius:50%}
  li.hot::before{background:var(--accent)}
  .big{font-family:var(--serif);font-size:46px;line-height:1.1;font-weight:600;max-width:20ch}
  .big .strike{text-decoration:line-through;text-decoration-color:var(--taupe);color:var(--taupe);font-style:italic}
  .big .a{color:var(--accent)}
  .meta{margin-top:30px;color:var(--taupe);font-size:15px;letter-spacing:.04em}
  .num{font-family:var(--serif);font-size:16px;color:var(--taupe);position:absolute;right:28px;bottom:22px}
  .cta{background:var(--ink);color:var(--bg)}
  .cta::before{background:var(--accent)}
  .cta h2,.cta h1{color:var(--bg)}
  .cta p{color:#cdd8cf}
  .cta .btn{display:inline-block;margin-top:24px;font-weight:600;background:var(--accent);color:#fff;padding:15px 30px;border-radius:7px;font-size:17px}
  .disc{margin-top:26px;font-size:13px;color:#9fb0a2;line-height:1.5;max-width:60ch}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'Maker Division · A live masterclass', h:'The Steady Studio',
   lede:'How creative studios keep the pipeline full without burning out or selling out.',
   meta:'With Ben Burns'},

  {t:'who', kick:'Who this is for', h:'You can do the work. That was never the problem.',
   p:["This is for freelancers and studio owners who are good at the craft and still stuck in the cycle: a packed month, then a silent one. Fully booked one week, refreshing your inbox the next.",
      "If you learned to design, illustrate, shoot or build, but nobody ever taught you how to be found on purpose, you are in the right room."]},

  {t:'hook', kick:'The uncomfortable part', big:'A full calendar is not a full <span class="a">pipeline</span>.',
   p:["Booked and broke are not opposites. They usually show up together, and they come from the same missing system."]},

  {t:'part', kick:'Part one', h:'Why the feast and famine never ends',
   p:["Most creative education stops at the craft and the portfolio. So the day the work dries up, you do the only thing you were ever taught to do: more work, faster, cheaper.",
      "That is how burnout and selling out begin. Not from a lack of talent. From a lack of a repeatable way to bring the next client in."]},

  {t:'cost', kick:'The real cost', h:'What the gap actually costs you',
   list:[{x:'Pricing from fear, because the next lead is not guaranteed to come'},
         {x:'Taking work that is wrong for you, because it is in front of you'},
         {x:'A studio that depends on your energy instead of a system'}]},

  {t:'part', kick:'Part two', h:'The system, in ten modules',
   p:["Everything we teach in Maker Division lives on one arc. The first half is where everyone starts. The second half is where studios actually get steady."],
   list:[{x:'Portfolio: attract the right clients, not just more of them'},
         {x:'Pricing: charge on value, not on nerves'},
         {x:'Outreach: a way to start conversations that does not feel gross', hot:true},
         {x:'Lead generation: a calendar that fills on purpose', hot:true}]},

  {t:'pillar', kick:'Pillar one · Portfolio', h:'Show the work you want to be hired for',
   p:["Your portfolio is not a highlight reel. It is a filter. It should repel the wrong brief as clearly as it attracts the right one.",
      "The right clients should see themselves in it before they ever message you."]},

  {t:'ratio', kick:'Pillar two · Pricing', big:'Price is a <span class="strike">number</span> <span class="a">ratio</span>.',
   p:["Raising your rate is not the lever. The lever is the ratio of the value you create, the position you hold, and the effort it takes you to deliver.",
      "Fix the ratio and the number takes care of itself. Chase the number alone and you just work more for the same life."]},

  {t:'pillar', kick:'Pillar two · Pricing', h:'What the ratio is made of',
   list:[{x:'Value: the outcome the client actually buys, not the hours'},
         {x:'Position: why it is you and not the cheaper option next door'},
         {x:'Effort: the cost of delivery, which your systems quietly lower'}]},

  {t:'pillar', kick:'Pillar three · Outreach', h:'Outreach that does not feel gross',
   p:["Outreach breaks when it is a cold pitch to a stranger. It works when it is a useful, specific message to someone you can genuinely help.",
      "You do not need to DM all day. You need a small, repeatable motion you can run without dreading it."]},

  {t:'pillar', kick:'Pillar four · Lead gen', h:'A calendar that fills on purpose',
   p:["This is the half most creatives never learn, and it is the one that ends the famine months. Lead generation is not luck or referrals you cannot control.",
      "It is a handful of channels that send the right people toward you, steadily, whether this month was busy or quiet."],
   list:[{x:'Know where your right clients already pay attention'},
         {x:'Give them a reason to raise their hand before they are ready to buy'},
         {x:'Turn attention into booked conversations on a schedule'}]},

  {t:'stage', kick:'Meet yourself where you are', h:'Which stage are you actually in?',
   p:["A freelancer stacking projects and a studio owner building a team do not have the same next move. The fastest progress comes from working the stage you are in, not the one on Instagram."],
   list:[{x:'Freelancer: steady your pipeline before you add anything'},
         {x:'Studio owner: build the system so it is not all on you'}]},

  {t:'part', kick:'Part three', h:'What a steady studio looks like',
   p:["A week where the next client is already in motion before the current one ships. Pricing you are not apologizing for. Work you chose, at a pace you can keep.",
      "That is not a bigger hustle. It is a quieter, more deliberate one."]},

  {t:'mind', kick:'The mindset underneath', big:'Good work starts before you know where it <span class="a">goes</span>.',
   p:["Perfectionism and imposter syndrome are the same safety reflex wearing two costumes. The studios that get steady are the ones that ship and get found before they feel ready."]},

  {t:'why', kick:'Why listen to me', h:'A decade in the trenches',
   p:["I have spent the last ten-plus years building studios, tools and communities for creatives, and directing work for clients like DreamWorks, Paramount, AMC, Laika and Hyatt.",
      "Maker Division is where I put all of it: the curriculum, the weekly critique, and the community of working creatives figuring this out together."]},

  {t:'community', kick:'You do not do this alone', h:'The part a course cannot give you',
   list:[{x:'A live group critique every week, on real work and real numbers'},
         {x:'Private feedback on your portfolio and your proposals'},
         {x:'A room of working creatives who send each other the right clients'}]},

  {t:'recap', kick:'The whole thing in one breath', h:'Pipeline first. Then everything else.',
   p:["Attract with the right portfolio. Price on the ratio. Reach out without the ick. Generate leads on purpose. Keep it steady so you never have to burn out or sell out to stay booked."]},

  {t:'cta', kick:'Your standing invitation', h:'Come build your steady studio',
   p:["If this is the half of the business nobody taught you, come get the whole system, the weekly critique, and the community inside The Division.",
      "Start at makerdivision.com."],
   btn:'Join The Division',
   disc:'Educational content only. No income, role, or outcome is promised or guaranteed. Results vary and depend on your own effort, market, and circumstances.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let html = '';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.h) html += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if(s.big) html += '<div class="big">'+s.big+'</div>';
  if(s.lede) html += '<div class="lede">'+s.lede+'</div>';
  if(s.p) s.p.forEach(par=> html += '<p>'+par+'</p>');
  if(s.list){ html += '<ul>'; s.list.forEach(it=> html += '<li class="'+(it.hot?'hot':'')+'">'+it.x+'</li>'); html += '</ul>'; }
  if(s.btn) html += '<div><span class="btn">'+s.btn+'</span></div>';
  if(s.meta) html += '<div class="meta">'+s.meta+'</div>';
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  html += '<div class="num">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
