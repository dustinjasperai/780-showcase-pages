<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The First 20 Seconds — a Smart Calling masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbf8;
    --panel:#ffffff;
    --rule:#e7e4dc;
    --ink:#242424;
    --accent:#2ea3f2;
    --red:#7b0303;
    --dim:#6b6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Open Sans",system-ui,sans-serif;line-height:1.55}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:44px 48px;margin:18px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .eyebrow{font-family:"Raleway";font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 14px}
  h1{font-family:"Raleway";font-weight:800;font-size:46px;line-height:1.08;margin:0 0 16px}
  h2{font-family:"Raleway";font-weight:700;font-size:32px;line-height:1.14;margin:0 0 14px}
  p{font-size:18px;margin:0 0 12px;max-width:62ch}
  .lead{font-size:22px;color:var(--ink)}
  .big{font-family:"Raleway";font-weight:800;font-size:40px;line-height:1.1}
  .num{font-family:"Raleway";font-weight:800;color:var(--accent);font-size:15px;
    letter-spacing:.1em}
  ul{margin:8px 0 0;padding:0 0 0 2px;list-style:none}
  li{font-size:18px;margin:10px 0;padding-left:30px;position:relative}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:2px;
    background:var(--accent)}
  .steps li:before{background:var(--ink)}
  .rulebar{height:3px;width:56px;background:var(--accent);border-radius:3px;margin:0 0 20px}
  .reframe h2{font-size:40px}
  .reframe .accentword{color:var(--red)}
  .foot{font-size:13px;color:var(--dim);margin-top:22px}
  .brandline{font-family:"Raleway";font-weight:700;letter-spacing:.08em;color:var(--dim);
    font-size:13px;text-transform:uppercase;margin-top:28px}
  .cta h1{font-size:40px}
  .disc{font-size:13px;color:var(--dim);margin-top:18px;max-width:70ch}
  .phoneline{display:flex;align-items:center;gap:10px;margin:0 0 18px}
  .phoneline span{height:2px;flex:1;background:var(--rule)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live Smart Calling masterclass',
   h:'The First 20 Seconds',
   p:'How to open a cold call so buyers stay on the line instead of hanging up.',
   brand:'Smart Calling'},

  {t:'audience', eyebrow:'Who this is for',
   h:'For the reps who still pick up the phone.',
   bullets:['Inside sales, AEs, BDRs and SDRs who prospect by phone',
            'Solo pros and owners who sell their own work',
            'Anyone tired of being screened out in the first ten seconds']},

  {t:'trap', eyebrow:'The moment it goes wrong',
   h:'You dial. They brace. The call is over before you finish your name.',
   p:'Most training blames the rep, the list, or the market. None of those are the real problem. The call dies in the opening, and almost nobody is taught how to open.'},

  {t:'reframe', eyebrow:'The reframe', reframe:true,
   h:'Cold calling isn’t dead.',
   h2:'Cold openings are.',
   p:'The phone still works. What stopped working is the generic, me-focused opening that tells the buyer in two seconds that this is a pitch.'},

  {t:'problem', num:'PART ONE', eyebrow:'The core problem',
   h:'Resistance is created, not inherited.',
   p:'A prospect decides whether to listen in the first few seconds, and they decide based on one thing: does this sound relevant to me, or is it about you? Most openings answer that question the wrong way.'},

  {t:'problem2', eyebrow:'The real cost',
   h:'Every weak opening trains you to fear the phone.',
   p:'Hangups and brush-offs pile up, confidence drops, and the rep starts avoiding the very activity that pays. The fix is not more calls. It is a better first twenty seconds.'},

  {t:'method', num:'PART TWO', eyebrow:'The method',
   h:'A method, not a script.',
   p:'Scripts break the moment a call goes off-rails. A method holds. Here is the system that takes the cold out of calling.'},

  {t:'pillar', num:'PILLAR 1', eyebrow:'Pre-Call Intelligence',
   h:'Know who you’re calling, why, and what matters to them.',
   bullets:['Gather intel before you dial, from online and offline sources',
            'Walk in with a reason that is about them, not you',
            'A call you prepared for is never truly cold']},

  {t:'pillar', num:'PILLAR 2', eyebrow:'Social Engineering',
   h:'Get the intel from the people around your prospect.',
   bullets:['Ask simple questions of others inside the organization',
            'Learn the problem, the player, and the timing first',
            'Show up already relevant instead of guessing']},

  {t:'pillar', num:'PILLAR 3', eyebrow:'The Opening Statement',
   h:'Four parts that earn the next sentence.',
   bullets:['Introduce yourself and your company, briefly',
            'Use your intel to show you did the work',
            'Hint at your Possible Value',
            'Ask a question, do not launch a pitch']},

  {t:'pillar', num:'PILLAR 4', eyebrow:'The Possible Value Proposition',
   h:'The word "possible" is what lowers the guard.',
   p:'You are not claiming to have the answer. You are offering a possibility worth a few minutes. That framing removes the pressure the prospect is braced for.'},

  {t:'example', eyebrow:'What it sounds like',
   h:'The opener, out loud.',
   quote:'"I’ve got a couple of ideas that might be of value to you regarding how your team covers the phones, and I’d like to ask a few quick questions."',
   p:'Relevant, low-pressure, and it ends on a question. That is the whole move.'},

  {t:'pillar', num:'PILLAR 5', eyebrow:'Secondary Objectives',
   h:'Every call moves you forward.',
   p:'Redefine what a win is. Even a no-sale call ends with a named next step, so you are never one rejection away from losing your nerve. This is how confidence becomes rejection-proof.'},

  {t:'process', eyebrow:'The full sequence',
   h:'The Smart Call Process.',
   steps:['Pre-communication and intel','Opening statement','Questioning',
          'Recommendation','Commitment for action','Wrap and set the next action']},

  {t:'looks', num:'PART THREE', eyebrow:'On a real call',
   h:'A call that earns "go ahead."',
   p:'Same prospect, same list. The difference is the opening. One version gets screened out. The other gets a question answered, then another, and the call is underway.'},

  {t:'why', eyebrow:'Why learn this here',
   h:'Forty years of real calls, not theory.',
   bullets:['Teaching Smart Calling since 1984, from a business built on the phone',
            'More than 1,500 in-person training programs delivered',
            'Author of the award-winning book Smart Calling',
            'Host of The Art of Sales podcast']},

  {t:'recap', eyebrow:'The takeaway',
   h:'Own the first twenty seconds and the rest of the call opens up.',
   bullets:['Prepare, so no call is cold','Open with relevance and possible value',
            'Ask, do not pitch','Make every call move forward']},

  {t:'cta', eyebrow:'Your next step',
   h:'Ready to open every call stronger?',
   p:'Join Smart Calling College, or book a time to talk through training for your team. We will put the first-twenty-seconds method to work on your own calls.',
   disc:'This masterclass is educational. No specific sales result or income is guaranteed. Results vary and depend on your market, effort, and execution.',
   brand:'Smart Calling'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide ' + (s.reframe ? 'reframe ' : '') + (s.t==='cta'?'cta':'');
  let html = '';
  if (s.num) html += '<div class="num">'+s.num+'</div>';
  if (s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if (s.t==='title'){ html += '<div class="phoneline"><span></span><i class="dot"></i></div>'; }
  if (s.h) html += '<h1>'+s.h+'</h1>';
  if (s.h2) html += '<h2 class="accentword">'+s.h2+'</h2>';
  if (!s.h2) html += '<div class="rulebar"></div>';
  if (s.quote) html += '<p class="big" style="font-size:26px;color:var(--ink)">'+s.quote+'</p>';
  if (s.p) html += '<p class="lead">'+s.p+'</p>';
  if (s.bullets){ html += '<ul>'; for(const b of s.bullets) html += '<li>'+b+'</li>'; html += '</ul>'; }
  if (s.steps){ html += '<ul class="steps">'; let i=1; for(const b of s.steps){ html += '<li><b>'+(i++)+'.</b> '+b+'</li>'; } html += '</ul>'; }
  if (s.disc) html += '<p class="disc">'+s.disc+'</p>';
  if (s.brand) html += '<div class="brandline">'+s.brand+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
