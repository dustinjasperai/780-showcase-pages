<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Top Buyers Agents Find Top-Performing Property, Property Research Australia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Zilla+Slab:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C2127; --panel:#143039; --rule:#27525E; --accent:#D9A441; --ink:#EAF1F2;
    --muted:#9FB4B9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;position:relative}
  .slide{display:none;width:min(1040px,92vw);max-height:92vh;padding:56px 60px;
    background:linear-gradient(180deg,var(--panel),var(--bg));border:1px solid var(--rule);
    border-radius:18px}
  .slide.on{display:block}
  .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:"Zilla Slab",Georgia,serif;font-weight:600;font-size:46px;line-height:1.08;
    letter-spacing:-.01em}
  h2{font-family:"Zilla Slab",Georgia,serif;font-weight:600;font-size:34px;line-height:1.12}
  .sub{color:var(--muted);font-size:20px;line-height:1.5;margin-top:18px;max-width:40ch}
  .big{font-family:"Zilla Slab",Georgia,serif;font-weight:500;font-style:italic;font-size:40px;
    line-height:1.2;max-width:22ch}
  ul{margin-top:26px;list-style:none}
  li{font-size:20px;line-height:1.45;padding:14px 0 14px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .num{font-family:"Zilla Slab",serif;color:var(--accent);font-size:15px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase}
  .disc{margin-top:28px;color:var(--muted);font-size:14px;line-height:1.5;max-width:52ch}
  .mark{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--accent);
    margin-bottom:24px}
  footer{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--muted);
    font-size:12px;letter-spacing:.1em}
  .count{position:absolute;bottom:22px;right:28px;color:var(--muted);font-size:12px}
  .nav{position:absolute;bottom:18px;left:28px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="stage"></div>
<footer>Property Research Australia</footer>
<div class="count" id="count"></div>
<div class="nav">Use arrow keys</div>
<script>
const S=[
  {t:'title', kicker:'A live masterclass for buyers agents',
   h:'How Top Buyers Agents Find Top-Performing Property',
   sub:'Replacing opinion with research, before anyone else does. Property Research Australia.'},

  {t:'who', kicker:'Who this is for',
   h:'For buyers agents who want their recommendations to stand on evidence',
   sub:'Working and aspiring buyers agents across Australia who are tired of picks that rest on a gut feeling.'},

  {t:'trap', kicker:'The trap',
   h:'The "feels right" pick',
   sub:'A client trusts you with the biggest purchase of their life. When a pick that merely felt right underperforms, it is your confidence, and theirs, that pays for it.'},

  {t:'reframe', kicker:'The reframe',
   big:'The market does not reward the agent with the best instincts. It rewards the one with the best research process.'},

  {t:'part', num:'Part One', h:'The cost of guessing'},

  {t:'list', kicker:'Part One',
   h:'What goes wrong without a process',
   list:['You fall for the suburb everyone is already talking about, at the top of its run.',
     'You confuse a nice street with a strong submarket.',
     'You cannot explain, in plain evidence, why this property and not the other three.',
     'Every recommendation starts from scratch, so it never gets faster or safer.']},

  {t:'part', num:'Part Two', h:'The four layers of real property research'},

  {t:'layer', num:'Layer one', h:'Market and economic drivers',
   sub:'Population, jobs, infrastructure spend, supply pipeline and credit. The forces that move a whole market before any single street does.'},

  {t:'layer', num:'Layer two', h:'Submarket selection from data',
   sub:'Narrowing from region to suburb to pocket using evidence: days on market, stock on market, rental demand and the gap between asking and selling.'},

  {t:'layer', num:'Layer three', h:'Property-level due diligence',
   sub:'Pressure-testing the actual asset. Comparable evidence, condition and risk, yield reality and the questions a seller hopes you will not ask.'},

  {t:'layer', num:'Layer four', h:'Exit and risk',
   sub:'Buying with the sale already in mind. Who the future buyer or tenant is, what could break the thesis, and what would make you walk away.'},

  {t:'part', num:'Part Three', h:'What a researched recommendation looks like'},

  {t:'list', kicker:'Part Three',
   h:'Turning research into a recommendation a client trusts',
   list:['One page a client can read: here is what we looked at, here is what it said.',
     'The evidence, not the adjectives, carries the case.',
     'The same repeatable process every time, so quality does not depend on the day.',
     'A clear reason you would walk away, which is what makes a yes credible.']},

  {t:'quote', kicker:'Why this works',
   big:'When the research does the convincing, you stop selling and start advising. That is the agent clients refer.'},

  {t:'who', kicker:'Why Property Research Australia',
   h:'Built around the research skill itself',
   sub:'Courses, consulting and a membership for buyers agents who want a method they can trust, not another opinion about the market.'},

  {t:'list', kicker:'Recap',
   h:'The method, in one view',
   list:['Drivers: read the whole market first.',
     'Submarket: narrow with data, not reputation.',
     'Property: pressure-test the asset.',
     'Exit: buy with the sale in mind.']},

  {t:'cta', kicker:'Your next step',
   h:'Learn the method with Property Research Australia',
   sub:'Join the membership to build the research process into how you work, every recommendation, every client.',
   disc:'Educational only. No income or result is guaranteed, and nothing here is a guarantee of investment performance. Property research informs decisions; it does not promise outcomes. Results vary and depend on your own circumstances and professional judgement.'}
];

const stage=document.getElementById('stage');
const countEl=document.getElementById('count');
function esc(x){return (x||'').toString();}
function render(){
  stage.querySelectorAll('.slide').forEach(n=>n.remove());
  S.forEach((s,i)=>{
    const d=document.createElement('section');
    d.className='slide'+(i===cur?' on':'');
    let html='';
    if(s.kicker) html+='<div class="kicker">'+esc(s.kicker)+'</div>';
    if(s.num && s.t==='part'){ html+='<span class="mark"></span><div class="num">'+esc(s.num)+'</div>'; }
    if(s.num && s.t!=='part'){ html+='<div class="num">'+esc(s.num)+'</div>'; }
    if(s.h) html+=(s.t==='title'?'<h1>':'<h2>')+esc(s.h)+(s.t==='title'?'</h1>':'</h2>');
    if(s.big) html+='<p class="big">'+esc(s.big)+'</p>';
    if(s.sub) html+='<p class="sub">'+esc(s.sub)+'</p>';
    if(s.list){ html+='<ul>'; s.list.forEach(it=>html+='<li>'+esc(it)+'</li>'); html+='</ul>'; }
    if(s.disc) html+='<p class="disc">'+esc(s.disc)+'</p>';
    d.innerHTML=html;
    stage.appendChild(d);
  });
  countEl.textContent=(cur+1)+' / '+S.length;
}
let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,n));render();}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') go(cur+1);
  else if(e.key==='ArrowLeft') go(cur-1);
});
stage.addEventListener('click',()=>go(cur+1));
render();
</script>
</body>
</html>
