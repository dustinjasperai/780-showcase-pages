<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Motherhood Raise — A Live Masterclass with Allison Venditti</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcf5e6;      /* brand cream ground */
    --panel:#ffffff;
    --ink:#211e1e;     /* brand charcoal ink */
    --muted:#5b544a;
    --accent:#ffcd27;  /* brand signature yellow (single accent) */
    --rule:#e7dcc4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Lora",Georgia,serif;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 60px;margin:22px 0;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 10px 30px rgba(33,30,30,.05)}
  .slide.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.center{align-items:center;text-align:center}
  .kicker{font-family:"Poppins",sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-bottom:22px}
  .slide.dark .kicker{color:var(--accent)}
  h1{font-family:"Poppins",sans-serif;font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:"Poppins",sans-serif;font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  h3{font-family:"Poppins",sans-serif;font-weight:600;font-size:26px;line-height:1.15}
  .lead{font-size:23px;color:var(--muted);margin-top:22px;max-width:40ch}
  .center .lead{margin-left:auto;margin-right:auto}
  p.body{font-size:21px;margin-top:18px;max-width:44ch}
  .hl{background:linear-gradient(transparent 60%, var(--accent) 60%);padding:0 .08em;font-weight:600}
  .num{font-family:"Poppins",sans-serif;font-weight:700;font-size:104px;line-height:1;color:var(--ink)}
  .slide.dark .num{color:var(--accent)}
  .part{font-family:"Poppins",sans-serif;font-weight:700;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink);background:var(--accent);display:inline-block;
    padding:8px 16px;border-radius:999px;margin-bottom:20px}
  ul.pts{margin-top:26px;list-style:none;display:grid;gap:16px;max-width:46ch}
  ul.pts li{font-size:21px;padding-left:34px;position:relative}
  ul.pts li::before{content:"";position:absolute;left:0;top:.55em;width:16px;height:16px;
    background:var(--accent);border-radius:4px}
  .who{display:grid;gap:14px;margin-top:24px;max-width:48ch}
  .who div{font-size:20px;padding:14px 18px;background:var(--bg);border-radius:12px;border:1px solid var(--rule)}
  .cred{display:grid;grid-template-columns:1fr;gap:12px;margin-top:24px;max-width:46ch}
  .cred div{font-size:19px;padding-left:30px;position:relative}
  .cred div::before{content:"\2713";position:absolute;left:0;color:var(--ink);font-weight:700}
  .foot{font-family:"Poppins",sans-serif;font-size:13px;letter-spacing:.05em;color:var(--muted);
    margin-top:30px}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:26px;max-width:52ch;line-height:1.45}
  .center .disclaimer{margin-left:auto;margin-right:auto}
  .cta-line{font-family:"Poppins",sans-serif;font-weight:600;font-size:20px;color:var(--ink);
    background:var(--accent);display:inline-block;padding:14px 26px;border-radius:12px;margin-top:26px}
  .snum{font-family:"Poppins",sans-serif;font-size:13px;color:var(--muted);letter-spacing:.1em;margin-bottom:14px}
  .slide.dark .snum{color:#b9b0a0}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", cls:"center",
    kicker:"A live masterclass with Allison Venditti",
    h1:'The <span class="hl">Motherhood Raise</span>',
    lead:"How working moms ask for, and get, the title and pay they have earned.",
    foot:"Moms at Work · Live, 60 minutes"},

  {t:"who", kicker:"Who this hour is for",
    h2:"You are in the right room if",
    items:[
      "You are a mom in a mid or senior role, and you are good at your job.",
      "You have a quiet suspicion you are underpaid, and you are probably right.",
      "You have been told to work hard and be grateful, one too many times.",
      "You want the words to ask, not just the nerve to try."]},

  {t:"promise", kicker:"What you walk out with",
    h2:"Three things, by the end of the hour",
    pts:["Your real number, built from evidence, not a gut guess.",
      "The exact way to ask, and the one move most of us skip.",
      "A plan to negotiate the whole offer, not just the salary line."]},

  {t:"trap", cls:"dark center",
    kicker:"The trap",
    h2:"You were told to work hard, and they would notice.",
    lead:"So you did. You over delivered, you covered, you stayed late on the days you could."},

  {t:"reframe", cls:"dark center",
    kicker:"The hard part",
    h2:'They noticed. They just did not <span class="hl">pay you</span> for it.',
    lead:"Good work is assumed. The raise is a separate skill, and almost no one is taught it."},

  {t:"stat", cls:"center",
    kicker:"Why this matters more for moms",
    num:"$11,000",
    body:"On average, mothers are offered about eleven thousand dollars less on a new job than women without kids. Wages fall roughly 7.8% per child, and it compounds. That is the gap we are here to close."},

  {t:"part", part:"Part One", h2:"Know your real number.",
    body:"Before you can ask, you have to know what you are actually asking for, and why it holds up."},

  {t:"content", kicker:"Part One",
    h3:"Stop quoting Glassdoor at them.",
    pts:["Build the number from real comparables and the value you carry, not a public average.",
      "Write down what you own: the revenue, the risk, the problems only you solve.",
      "Decide your number before you walk in. The room is not the place to do math."]},

  {t:"content", kicker:"Part One",
    h3:"Your number is a range, with a floor you will not cross.",
    pts:["A target you would be thrilled with, and a floor you will hold.",
      "Anchor high, on purpose. You can always come down; you cannot go up.",
      "Know it cold, so you can say it without your voice going up at the end."]},

  {t:"part", part:"Part Two", h2:"Make the ask, then stop talking.",
    body:"This is the move that changes the number, and it is the one almost everyone skips."},

  {t:"content", kicker:"Part Two",
    h3:'State your number. Then <span class="hl">go quiet</span>.',
    pts:["Say the range, or the percentage, clearly. Then stop.",
      "Do not justify it. Do not list everything you did. Do not fill the silence.",
      "The pause is not rude. It is the ask doing its work."]},

  {t:"content", kicker:"Part Two",
    h3:"Why the silence moves the money.",
    pts:["The moment you keep talking, you start negotiating against yourself.",
      "Silence hands the next move to them, and the next move is usually up.",
      "Let it be a little uncomfortable. Comfortable is what got you underpaid."]},

  {t:"part", part:"Part Three", h2:"Negotiate the whole offer.",
    body:"Salary is one line. Moms leave real money and real life on the table everywhere else."},

  {t:"content", kicker:"Part Three",
    h3:"It was never just the base pay.",
    pts:["Vacation, hours, and the flexible work that actually fits your family.",
      "Termination clauses and benefits, the parts nobody reads until it is too late.",
      "Equity, options, and the title that sets up your next raise."]},

  {t:"content", kicker:"Part Three",
    h3:"How the ask actually sounds when you run it.",
    body:"Calm, prepared, and specific. You know your number, you say it, you stop. You treat the whole offer as the offer. You are not asking for a favour. You are pricing your work."},

  {t:"cred", cls:"center", kicker:"Why listen to me",
    h2:"Allison Venditti",
    creds:["Career coach and HR expert, CHRP and CHRL.",
      "Close to twenty years negotiating offers, on the company side of the table.",
      "Founder of Moms at Work, the largest network for working moms in Canada.",
      "The leading voice in the country on pay transparency and salary negotiation."]},

  {t:"recap", cls:"center", kicker:"The whole hour, in three moves",
    h2:"Know your number. Ask, then stop. Negotiate the whole offer.",
    lead:"Simple to say. It works because most people never do all three."},

  {t:"cta", cls:"center", kicker:"Your next move, together",
    h2:"Keep going with us.",
    lead:"If today gave you the words, The Collective gives you the room: monthly workshops, coaches in your corner, and a network of women who open doors. Come build your raise with people who get it.",
    cta:"Join The Collective at thisismomsatwork.com",
    disclaimer:"This masterclass is educational. It does not promise or guarantee any specific salary, raise, job, or financial outcome, and individual results vary based on your situation and effort."}
];

function el(tag, cls, html){const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n;}
const deck=document.getElementById("deck");
S.forEach((s,i)=>{
  const sec=el("section","slide"+(s.cls?(" "+s.cls):""));
  sec.appendChild(el("div","snum", String(i+1).padStart(2,"0")+" / "+String(S.length).padStart(2,"0")));
  if(s.kicker) sec.appendChild(el("div","kicker",s.kicker));
  if(s.part) sec.appendChild(el("span","part",s.part));
  if(s.h1) sec.appendChild(el("h1",null,s.h1));
  if(s.h2) sec.appendChild(el("h2",null,s.h2));
  if(s.h3) sec.appendChild(el("h3",null,s.h3));
  if(s.num) sec.appendChild(el("div","num",s.num));
  if(s.lead) sec.appendChild(el("div","lead",s.lead));
  if(s.body) sec.appendChild(el("p","body",s.body));
  if(s.pts){const u=el("ul","pts"); s.pts.forEach(p=>u.appendChild(el("li",null,p))); sec.appendChild(u);}
  if(s.items){const w=el("div","who"); s.items.forEach(p=>w.appendChild(el("div",null,p))); sec.appendChild(w);}
  if(s.creds){const c=el("div","cred"); s.creds.forEach(p=>c.appendChild(el("div",null,p))); sec.appendChild(c);}
  if(s.cta) sec.appendChild(el("div","cta-line",s.cta));
  if(s.disclaimer) sec.appendChild(el("div","disclaimer",s.disclaimer));
  if(s.foot) sec.appendChild(el("div","foot",s.foot));
  deck.appendChild(sec);
});
</script>
</body>
</html>
