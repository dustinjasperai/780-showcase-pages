<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grace Under Fire - A Masterclass with Dan O'Connor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16222e;
    --panel:#223344;
    --rule:#33475b;
    --accent:#0065a6;
    --ink:#f4f7fa;
    --muted:#a9bacb;
    --display:'Lato', sans-serif;
    --body:'Open Sans', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{
    background:linear-gradient(180deg,var(--panel),var(--bg));
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 52px;
    margin:0 0 26px;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:900;font-size:52px;line-height:1.05;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:900;font-size:36px;line-height:1.1;margin-bottom:16px}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:40ch}
  p.lead{font-size:24px;color:var(--muted)}
  .sub{font-size:18px;color:var(--muted);margin-top:14px}
  ul{list-style:none;margin-top:10px}
  li{font-size:21px;line-height:1.5;padding:12px 0 12px 26px;position:relative;border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  .swap{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
  .swap div{background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font-size:19px}
  .swap .danger{color:var(--muted)}
  .swap .power{color:var(--ink);border-left:4px solid var(--accent)}
  .tag{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;position:absolute;top:22px;right:28px;letter-spacing:.08em}
  .big{font-size:60px;font-family:var(--display);font-weight:900;line-height:1.02}
  .cta h2{color:var(--ink)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.5}
  .brandline{font-family:var(--display);font-weight:700;letter-spacing:.1em;color:var(--muted);font-size:14px;margin-top:22px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:"A live masterclass with Dan O'Connor",h:"Grace Under Fire",sub:"The exact words to say when you're interrupted, dismissed, or talked over at work."},
  {t:'promise',eyebrow:"The promise",h:"Three moves, one hour.",p:"By the end of this session you'll have three word-for-word moves you can use in your very next hard conversation. Not theory. The actual lines."},
  {t:'who',eyebrow:"Who this is for",h:"You're good at your job. You still get talked over.",p:"This is for the competent, prepared professional who walks out of meetings thinking of the perfect thing to say ten minutes too late."},
  {t:'trap',eyebrow:"The trap",h:"You've tried both doors.",p:"You either pushed back harder and felt aggressive, or you went quiet and seethed. Neither one worked, because the problem was never your volume."},
  {t:'reframe',eyebrow:"The reframe",h:"You're not too quiet. You just never got the words.",p:"Communication under pressure is not a personality trait you're born with. It's a script you can learn. That is the entire premise of what I teach."},
  {t:'part',tag:"PART ONE",h:"Why smart people freeze."},
  {t:'content',eyebrow:"The reflex",h:"The defend reflex.",p:"When someone challenges you, the instinct is to explain and justify. Explaining hands them the floor and makes you sound unsure. The freeze isn't weakness. It's a missing move."},
  {t:'content',eyebrow:"The cost",h:"What it quietly costs you.",p:"The people who get heard in the room are not always the smartest. They're the ones with a ready line. Over a career, that gap compounds into influence, roles, and respect."},
  {t:'part',tag:"PART TWO",h:"The Say This, Not That method."},
  {t:'content',eyebrow:"Pillar 1",h:"Power phrases, not danger phrases.",p:"Most of us leak authority with reflex words. Swap the danger phrase for the power phrase and people hear you differently, instantly.",
    swap:[["Does that make sense?","What questions do you have?"],["Sorry to bother you...","Thanks for your time."]]},
  {t:'content',eyebrow:"Pillar 2",h:'The "That may be..." move.',p:"When someone pushes, you don't argue and you don't fold. You acknowledge, then restate your position unchanged. 'That may be. And I'd still like us to decide this together.' You hold your ground without raising your voice."},
  {t:'content',eyebrow:"Pillar 3",h:"The broken record.",p:"When the pressure keeps coming, you calmly repeat your position in the same words. No new justifications to attack. The pressure runs out before you do."},
  {t:'content',eyebrow:"Pillar 4",h:"The Never Defend Mindset.",p:"Stop explaining yourself. The moment you defend, you've agreed the question was fair. Respond with a power phrase instead and the exchange ends on your terms."},
  {t:'demo',eyebrow:"Watch the swap",h:"Same situation. Two different rooms.",swap:[["\"I think maybe we could possibly look at it?\"","\"Here's what I recommend, and here's why.\""],["\"I'm no expert, but...\"","\"From what I've seen...\""]]},
  {t:'part',tag:"PART THREE",h:"When the interruption lands and you're ready."},
  {t:'content',eyebrow:"Before and after",h:"The meeting changes shape.",p:"Same person, same idea. The difference is one prepared line at the moment it matters. The interruption lands, you have the move ready, and the conversation turns back toward you."},
  {t:'why',eyebrow:"Why me",h:"I've spent a career on exactly this.",p:"I'm Dan O'Connor. I teach tactical communication as the Wizard of Words to more than 250,000 subscribers, I wrote the bestseller Say This, Not That, and I've trained teams at organizations including Apple and the U.S. Air Force.",brand:"DAN O'CONNOR TRAINING"},
  {t:'recap',eyebrow:"The three moves",h:"You already have them.",list:["Power phrase over danger phrase","\"That may be...\" to hold your ground","Never defend; respond and close"]},
  {t:'cta',eyebrow:"Your next step",h:"Make it automatic.",p:"These three moves are the doorway. The full system, the complete phrase library, and the daily practice live inside the Communication Mastery Challenge. If today helped, that's where you go deeper.",disclaimer:"This masterclass is educational. Communication results depend on your own practice and circumstances; no specific outcome or income is promised or guaranteed.",brand:"Join the Communication Mastery Challenge at danoconnortraining.com"}
];
const deck=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let html='';
  if(s.tag) html+='<div class="tag">'+s.tag+'</div>';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'||s.t==='part'){ html+='<h1 class="big">'+(s.h||'')+'</h1>'; }
  else if(s.h){ html+='<h2>'+s.h+'</h2>'; }
  if(s.sub) html+='<p class="lead">'+s.sub+'</p>';
  if(s.p) html+='<p>'+s.p+'</p>';
  if(s.swap){ html+='<div class="swap">'; s.swap.forEach(pair=>{ html+='<div class="danger">'+pair[0]+'</div><div class="power">'+pair[1]+'</div>'; }); html+='</div>'; }
  if(s.list){ html+='<ul>'; s.list.forEach(i=>html+='<li>'+i+'</li>'); html+='</ul>'; }
  if(s.disclaimer) html+='<div class="disclaimer">'+s.disclaimer+'</div>';
  if(s.brand) html+='<div class="brandline">'+s.brand+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
