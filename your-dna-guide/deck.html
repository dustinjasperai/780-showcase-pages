<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do the DNA - A Live Masterclass with Diahan Southard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfdfc; --panel:#e7f2f0; --rule:#cfe4e0;
    --grey:#1b2b2b; --dim:#5c6f6c;
    --accent:#0e8a86; --accent2:#ef6a52;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--panel);color:var(--grey);font-family:'Public Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  #stage{max-width:960px;margin:0 auto;padding:28px 20px 72px;}
  .slide{display:none;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 56px 48px;min-height:70vh;box-shadow:0 1px 0 rgba(14,138,134,.04);}
  .slide.active{display:block;}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em;color:var(--grey);}
  h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:36px;line-height:1.15;letter-spacing:-.01em;color:var(--grey);margin-bottom:20px;}
  .sub{font-family:'Newsreader',Georgia,serif;font-size:24px;color:var(--dim);margin-top:18px;font-weight:400;}
  p{font-size:20px;line-height:1.6;color:var(--dim);margin-bottom:16px;max-width:60ch;}
  p strong{color:var(--grey);font-weight:600;}
  ul{list-style:none;margin:8px 0;}
  li{font-size:20px;line-height:1.5;color:var(--dim);margin-bottom:14px;padding-left:30px;position:relative;max-width:62ch;}
  li::before{content:"";position:absolute;left:0;top:11px;width:11px;height:11px;border-radius:50%;background:var(--accent);}
  li.coral::before{background:var(--accent2);}
  .step-n{font-family:'Newsreader',serif;font-size:20px;color:var(--accent2);font-weight:600;letter-spacing:.02em;margin-bottom:10px;}
  .spin{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:var(--panel);border:1px solid var(--rule);border-radius:20px;padding:5px 12px;margin-top:14px;}
  .big{font-family:'Newsreader',serif;font-size:30px;line-height:1.3;color:var(--grey);max-width:24ch;font-weight:500;}
  .cred li::before{background:var(--accent2);}
  .disclaimer{font-size:14px;color:var(--dim);margin-top:26px;max-width:64ch;line-height:1.5;}
  .cta-line{font-family:'Newsreader',serif;font-size:26px;color:var(--accent);font-weight:600;margin-top:18px;}
  .nav{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:16px;align-items:center;font-family:'Public Sans';}
  .nav button{background:var(--bg);border:1px solid var(--rule);color:var(--grey);border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;}
  .nav button:hover{border-color:var(--accent);color:var(--accent);}
  .count{font-size:13px;color:var(--dim);min-width:56px;text-align:center;}
  @media(max-width:640px){.slide{padding:34px 24px;}h1{font-size:34px;}h2{font-size:27px;}p,li{font-size:17px;}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button onclick="go(-1)">Prev</button><div class="count" id="count"></div><button onclick="go(1)">Next</button></div>
<script>
const S=[
 {t:'title', k:'A live masterclass', h:'Do the DNA', sub:'Turn your match list into your family tree - a live, hands-on session with Diahan Southard, Your DNA Guide'},
 {t:'who', k:'Who this is for', h:'You tested. Now what?', body:['You spit in the tube or swabbed your cheek. Weeks later a wall of matches showed up.','This hour is for the person who has DNA results and a family question, and no clear path between the two.']},
 {t:'stuck', k:'Where testers get stuck', h:'A thousand names, no plan', body:['Your match list is sorted by shared DNA, not by the answer you actually want.','So you scroll, you recognize no one, and you wait for a familiar surname to jump out. It rarely does.']},
 {t:'reframe', k:'The reframe', big:'The answer was never hiding inside one match. It shows up when you work the matches as a method.'},
 {t:'promise', k:'What you will leave with', h:'A repeatable way in', body:['A five-step process you can run on any ancestor, in any location.','The confidence to open your match list tomorrow and know your exact next click.']},
 {t:'part', k:'Part one', h:'Why DNA feels overwhelming'},
 {t:'problem', k:'The real problem', h:'You are collecting, not building', body:['Most people treat matches like a scavenger hunt: find a name you know and stop.','A tree gets built the other way. You start from a specific question and gather only the matches that answer it.']},
 {t:'problem2', k:'The real problem', h:'The list works against you', body:['The platforms rank matches by centimorgans - how much DNA you share - because that is what they can measure.','That ranking says nothing about which matches move YOUR question forward. That is the skill nobody hands you at checkout.']},
 {t:'part', k:'Part two', h:'The Search Party Method'},
 {t:'framework', k:'The framework', h:'Five steps, any mystery', body:['This is the process I teach for running a DNA search from a blank question to a documented answer.','It keeps you organized, focused, and moving forward instead of drowning in the list.']},
 {t:'step', n:'Step 1', h:'Question your question', body:['Name the exact person or answer you want. "Who was my great-grandfather?" beats "learn about my family."','A specific question tells you which matches matter and which you can ignore today.']},
 {t:'step', n:'Step 2', h:'Study just enough', body:['Learn only the tools this question needs: clustering, the shared-match view, a quick-and-clean tree.','You do not need a biology degree. You need the handful of moves that fit the case in front of you.'], spin:'SPIN - Study'},
 {t:'step', n:'Step 3', h:'Practice on your own matches', body:['Work your real list, not a textbook example. Group the matches who share DNA with each other.','The Leftover Strategy: set aside the matches you can already place, and focus on the ones you cannot. Those are the ones carrying the answer.'], spin:'SPIN - Practice'},
 {t:'step', n:'Step 4', h:'Implement: build down', body:['Take the cluster that points at your question and build the tree DOWN from the couple they share.','You are not guessing. You are following the DNA to the branch where your person belongs.'], spin:'SPIN - Implement'},
 {t:'step', n:'Step 5', h:'Next step, on purpose', body:['Every search ends by naming the next action: a record to pull, a match to message, a test to ask a cousin to take.','Progress is a loop, not a lucky break. You always know what you are doing next.'], spin:'SPIN - Next steps'},
 {t:'part', k:'Part three', h:'Seeing it work'},
 {t:'example', k:'What it produces', h:'From cluster to answer', body:['A group of unknown matches, all sharing DNA with each other, resolves to one shared couple.','You build their descendants forward, line the tree up with your question, and a name that was a blank last week now has evidence behind it.']},
 {t:'why', k:'Why learn this with me', h:'25 years of doing the DNA', cred:['I started at the Sorenson Molecular Genealogy Foundation, whose database became AncestryDNA.','I have spent 25+ years teaching DNA to real people, wrote Your DNA Guide - The Book, and teach this method internationally.','My whole approach is hands-on: you leave a session having DONE the work on your own results.']},
 {t:'recap', k:'The shift', big:'You stop hoping a match explains itself, and you start running a process that gets you answers.'},
 {t:'cta', k:'Your next step', h:'Come do the DNA with me', body:['If today gave you one clear next click, the DNA Skills Workshop gives you the whole system, six weeks of guided practice on YOUR results with me and my team of coaches.'], cta:'Join the next DNA Skills Workshop at yourdnaguide.com', disclaimer:'Educational session only. No specific research outcome or family discovery is guaranteed. Results vary with your test, your matches, and the records available for your family.'}
];
const stage=document.getElementById('stage');
stage.innerHTML=S.map((s,i)=>{
 let inner='';
 if(s.k) inner+=`<div class="kicker">${s.k}</div>`;
 if(s.h && s.t==='title') inner+=`<h1>${s.h}</h1>`; else if(s.h) inner+=`<h2>${s.h}</h2>`;
 if(s.sub) inner+=`<div class="sub">${s.sub}</div>`;
 if(s.big) inner+=`<div class="big">${s.big}</div>`;
 if(s.n) inner=`<div class="kicker">${s.k||''}</div><div class="step-n">${s.n}</div>`+ (s.h?`<h2>${s.h}</h2>`:'');
 if(s.body) inner+=s.body.map(b=>`<p>${b}</p>`).join('');
 if(s.cred) inner+=`<ul class="cred">`+s.cred.map(b=>`<li>${b}</li>`).join('')+`</ul>`;
 if(s.spin) inner+=`<span class="spin">${s.spin}</span>`;
 if(s.cta) inner+=`<div class="cta-line">${s.cta}</div>`;
 if(s.disclaimer) inner+=`<div class="disclaimer">${s.disclaimer}</div>`;
 return `<section class="slide${i===0?' active':''}">${inner}</section>`;
}).join('');
let cur=0;const slides=[...document.querySelectorAll('.slide')];const count=document.getElementById('count');
function render(){slides.forEach((el,i)=>el.classList.toggle('active',i===cur));count.textContent=(cur+1)+' / '+slides.length;}
function go(d){cur=Math.max(0,Math.min(slides.length-1,cur+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
