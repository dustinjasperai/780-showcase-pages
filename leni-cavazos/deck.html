<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hospitality-Grade Retreat — a masterclass with Leni Cavazos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f6f2; --panel:#ffffff; --ink:#1a2733; --muted:#5a6b78;
    --navy:#003a5d; --brass:#b98a4e; --rule:#dfe4e7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:'Open Sans',sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    padding:56px 60px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(0,58,93,.04)}
  .kicker{font-family:'Open Sans';font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--brass);margin-bottom:18px}
  h1{font-family:'Cormorant Garamond';font-weight:700;font-size:52px;line-height:1.05;
    color:var(--navy);margin-bottom:18px}
  h2{font-family:'Cormorant Garamond';font-weight:600;font-size:38px;line-height:1.1;
    color:var(--navy);margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:60ch;margin-bottom:12px}
  .lead{font-size:22px;color:var(--muted)}
  .big{font-family:'Cormorant Garamond';font-weight:700;font-size:46px;color:var(--navy);line-height:1.1}
  ul{margin:10px 0 0 22px}
  li{font-size:19px;line-height:1.6;margin-bottom:10px}
  .rule{height:3px;width:68px;background:var(--brass);margin:0 0 22px}
  .foot{margin-top:26px;font-size:14px;color:var(--muted)}
  .pres{font-size:17px;color:var(--muted);margin-top:22px}
  .disc{font-size:14px;color:var(--muted);margin-top:18px;max-width:64ch}
  .cta-step{font-family:'Cormorant Garamond';font-weight:600;font-size:26px;color:var(--brass);margin-top:10px}
  .n{font-family:'Cormorant Garamond';color:var(--brass);font-weight:700}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass', h:'The Hospitality-Grade Retreat',
   lead:'How to fill a retreat that actually profits.',
   pres:'With Leni Cavazos, founder of The Retreat Planner'},

  {t:'who', k:'Who this is for',
   h:'For retreat leaders who sell out and still are not sure they profited',
   p:'You are great at the room. The transformation is real, the feedback is glowing, people cry at the closing circle. And then you look at the numbers and you cannot tell whether this retreat actually paid you.'},

  {t:'trap', k:'The trap',
   h:'Full is not the same as profitable',
   p:'You poured everything into the experience. The seats filled. The bank account barely moved. So you tell yourself the next one will be the profitable one, and you run the same model again.'},

  {t:'reframe', k:'The hard truth',
   big:'A sold-out retreat that loses money is just an expensive favor.',
   p:'The problem was never filling the room. The problem is that nobody built the profit in before the doors opened.'},

  {t:'part', k:'Part one',
   h:'Why full does not mean profitable',
   p:'Three quiet leaks turn a sold-out retreat into a break-even one.'},

  {t:'point', k:'Leak one',
   h:'The venue decides your margin, and you let it',
   p:'Most leaders fall in love with a venue, sign, and then try to price backward from the cost. The number that should have been decided first gets decided last.'},

  {t:'point', k:'Leak two',
   h:'Pricing off a gut feel',
   p:'You set the price by what feels right and what the last person charged. You find out at year end whether it worked. By then the retreat is over and the money is spent.'},

  {t:'point', k:'Leak three',
   h:'One and done',
   p:'A retreat that fills once is luck. A retreat that fills every time is a system. Most leaders rebuild attendance from zero each round because nothing was built to bring people back.'},

  {t:'part', k:'Part two',
   h:'The profit-first sequence',
   p:'The same order the best hospitality brands use to make a room profitable before a single guest books.'},

  {t:'framework', k:'Pillar one', h:'Profit-First Strategy',
   p:'Decide the margin before you sign the venue. Model the profit of the retreat first, then build the experience to fit it, instead of hoping it nets out afterward.'},

  {t:'framework', k:'Pillar two', h:'Bespoke Business Architecture',
   p:'A retreat business built around your vision, your audience, and the life you actually want, not a one-size template. The structure for how your retreats run and how they make money.'},

  {t:'framework', k:'Pillar three', h:'Hospitality-Grade Strategy',
   p:'Run the retreat the way a great hotel runs its rooms. Venue sourcing and negotiation, guest experience, and the operational polish that makes attendees want to come back.'},

  {t:'framework', k:'Pillar four', h:'Transformation Meets Business',
   p:'You do not have to choose between a moving experience and a sustainable business. The deepest work and the healthiest P&L are built at the same time, on purpose.'},

  {t:'part', k:'Part three',
   h:'When the room and the numbers both work',
   p:'The retreat still feels like yours. The numbers stop being a mystery.'},

  {t:'point', k:'The artifact',
   h:'Your profit on one page',
   p:'Seats, price, venue, and margin laid out before anything is booked, so you know the retreat profits before you promote it, not after you clean up.'},

  {t:'point', k:'The return system',
   h:'Full every time, not just once',
   p:'When the experience and the follow-through are designed to bring people back, each retreat starts from a warm base instead of an empty calendar.'},

  {t:'whyme', k:'Why me',
   h:'From the Ritz-Carlton to your retreat',
   p:'I spent six years inside Marriott and The Ritz-Carlton, leading loyalty marketing and rebranding eight restaurants and a spa, which lifted revenue 36 percent in a single year.',
   p2:'Then I took that same profit infrastructure to retreats. I have strategized more than 100 of them. Retreat leaders did not need more passion. They needed the systems I spent years building inside the world’s best hospitality brands.'},

  {t:'recap', k:'The three shifts',
   h:'What changes',
   li:['Decide the profit before the venue, not after the retreat.',
       'Build the business around your vision, run it like a hotel runs a room.',
       'Design for return, so full every time replaces full once.']},

  {t:'cta', k:'Your next step',
   h:'Build your next retreat to profit',
   step:'Book a strategy call with Leni to map your retreat business model.',
   p:'On the call we map where your retreat leaks money and the fastest path to a sold-out, profitable one built around your vision.',
   disc:'This masterclass is educational. Nothing here is a guarantee of income or results, and no specific outcome is guaranteed. Results vary by leader, market, venue, and effort.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=el('div','slide');
  if(s.k) d.appendChild(el('div','kicker',s.k));
  if(s.h) d.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));
  if(s.t==='title'){d.insertBefore(el('div','rule'), d.children[1]||null);}
  if(s.big){d.appendChild(el('div','big',s.big));}
  if(s.lead) d.appendChild(el('p','lead',s.lead));
  if(s.p) d.appendChild(el('p',null,s.p));
  if(s.p2) d.appendChild(el('p',null,s.p2));
  if(s.li){const ul=el('ul'); s.li.forEach(x=>ul.appendChild(el('li',null,x))); d.appendChild(ul);}
  if(s.step) d.appendChild(el('div','cta-step',s.step));
  if(s.pres) d.appendChild(el('div','pres',s.pres));
  if(s.disc) d.appendChild(el('div','disc',s.disc));
  deck.appendChild(d);
});
</script>
</body>
</html>
