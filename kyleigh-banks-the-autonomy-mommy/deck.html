<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Autonomy Model — A Birthworker Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf3ec; --panel:#fffaf6; --rule:#f0d9cd;
    --accent:#fb4474; --gold:#fcb400; --ink:#1b1513; --muted:#7a6a62;
    --display:'Familjen Grotesk',system-ui,sans-serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:0 0 22px;min-height:432px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(27,21,19,.03)}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.08;letter-spacing:-.01em;margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:62ch;margin-bottom:14px}
  p.lead{font-size:22px;color:var(--muted)}
  .big{font-size:28px;font-family:var(--display);font-weight:600;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .num li::before{content:counter(step);counter-increment:step;background:var(--accent);color:#fff;
    width:26px;height:26px;border-radius:50%;left:0;top:11px;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:600;font-size:14px}
  .num{counter-reset:step}
  .layers li::before{background:var(--gold)}
  .foot{margin-top:22px;font-size:14px;color:var(--muted);font-family:var(--display);font-weight:500;letter-spacing:.04em}
  .cta{background:linear-gradient(160deg,#fff 0%,#fff2ea 100%);border-color:var(--accent)}
  .cta h2{color:var(--accent)}
  .pill{display:inline-block;background:var(--accent);color:#fff;font-family:var(--display);font-weight:600;
    font-size:18px;padding:13px 26px;border-radius:999px;margin-top:10px}
  .disclaimer{margin-top:20px;font-size:13px;line-height:1.5;color:var(--muted);max-width:66ch}
  .kicker{font-family:var(--display);font-weight:600;color:var(--gold);font-size:17px;margin-bottom:8px;letter-spacing:.02em}
  .brandline{font-family:var(--display);font-weight:600;color:var(--accent);letter-spacing:.06em;font-size:15px}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:0}h1{font-size:36px}h2{font-size:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
   brand:'Birthworker · with Kyleigh Banks',
   eyebrow:'A free masterclass for doulas',
   h:'The Autonomy Model',
   p:'How to build a full-income doula business you are not on call for.'},

  {t:'who',
   eyebrow:'Who this is for',
   h:'You love the work. You are tired of living on call.',
   p:'This is for the doula who said yes to birth work because it matters, and somewhere along the way handed her whole calendar to it. If your income only grows when you take on more births, you are in the right room.'},

  {t:'trap',
   eyebrow:'The trap',
   h:'You said yes to every birth. Now the births own your life.',
   p:'3am texts. Back-to-back due dates. Missing your own family moments to be present for someone else’s. The busier you get, the less free you are. That is not a you problem. It is built into the on-call model.'},

  {t:'reframe',
   eyebrow:'The reframe',
   h:'More births is not the answer. It is the trap.',
   p:'Every doula is taught to grow by attending more births. But a body can only be in one birth room at a time, so that path has a hard ceiling and the ceiling is your own exhaustion. The way out is not more births. It is a different model.'},

  {t:'part',
   kicker:'Part One',
   h:'The real problem: your income is capped by your body.',
   p:'When the only thing you sell is your physical presence at a birth, your income is tied one-to-one to your hours and your calendar. Raise your prices and you still hit the wall. The problem was never your rates. It is that you only sell one thing.'},

  {t:'bullets',
   eyebrow:'What the one-thing model costs you',
   h:'The math nobody shows a new doula.',
   items:['Your income stops the moment you stop attending births.','Every client needs you physically present, on their timeline, not yours.','Time off is lost income, so you never really take it.','Burnout is not a risk in this model. It is the destination.']},

  {t:'part',
   kicker:'Part Two',
   h:'The Autonomy Model: three income layers, one practice.',
   p:'Autonomy comes from selling more than your presence. You keep the birth work you love and build two more layers on top of it, so income stops depending on how many births your body can take.'},

  {t:'layers',
   eyebrow:'Layer one',
   h:'In-person birth support stays the foundation.',
   p:'You do not give up births. This is the heart of the work and the proof of your expertise. It stays, but it stops being the only thing you sell.'},

  {t:'layers',
   eyebrow:'Layer two',
   h:'Childbirth education: teach once, serve many.',
   p:'You already know how to prepare a family for birth. Package that into childbirth education and you serve many families from one body of teaching, without being in every room. This is the first layer that is not capped by your calendar.'},

  {t:'layers',
   eyebrow:'Layer three',
   h:'Digital courses and products: income while you sleep.',
   p:'Turn the lessons you repeat over and over into online courses and digital products. They sell whether or not you are at a birth, on vacation, or asleep. This is the layer that finally breaks the hours-for-income ceiling.'},

  {t:'part',
   kicker:'Part Three',
   h:'The 3-Step Method to make it actually sell.',
   p:'Owning three layers is not enough if strangers never find them. These are the three steps that turn an audience into paying clients across all three layers.'},

  {t:'num',
   eyebrow:'Step one',
   h:'Build the right mix of offers.',
   items:['Map one in-person offer, one education offer, and one digital offer.','Price them so each layer feeds the next instead of competing.','Give a stranger a low-risk first yes and a clear path to the deeper work.']},

  {t:'num',
   eyebrow:'Step two',
   h:'Grow a fanbase that trusts you.',
   items:['Show up consistently where expecting families already are.','Teach in public so your expertise is visible before anyone pays.','Turn one-time listeners and followers into an email list you own.']},

  {t:'num',
   eyebrow:'Step three',
   h:'Run a simple follower-to-client funnel.',
   items:['Invite your audience to one free live teaching session.','Teach your method live, then make one clear offer at the end.','Let the courses and education catch everyone who is not ready for one-to-one yet.']},

  {t:'picture',
   eyebrow:'An autonomous month',
   h:'A full income and a calendar that is still yours.',
   p:'A month with a few births you chose, a course that sold while you slept, an education cohort you taught once, and real days off that do not cost you income. Same expertise. A completely different life.'},

  {t:'why',
   eyebrow:'Why listen to this',
   h:'I built this model on myself first.',
   p:'I went full-time in birth work in 2020. Within about a year I had replaced my income and my partner was able to leave his job, and I did it without a 24/7 on-call schedule and without attending a hundred births a year. Not because I worked more. Because I stopped selling only one thing.'},

  {t:'depth',
   eyebrow:'The foundation underneath it',
   h:'This is built on real birth-work depth, not just business talk.',
   p:'The Full Spectrum training behind Birthworker runs eleven modules and more than a hundred hours: self mastery, the current state of maternity care, birth physiology, options and interventions, the fourth trimester, supporting birth, supporting the unexpected, supporting loss, postpartum, trauma-informed care, and alternative medicine. The business model sits on top of genuine clinical skill.'},

  {t:'bullets',
   eyebrow:'What to hold onto',
   h:'Three things to take from today.',
   items:['Your income is capped only because you sell one thing.','Autonomy comes from layering education and digital offers on top of births.','The 3-Step Method is how strangers find those offers and buy.']},

  {t:'cta',
   eyebrow:'Your next step',
   h:'Ready to build your autonomy model?',
   p:'If you want the full build, the free Birthworker workshop walks you through the 3-Step Method in detail, and from there you can see whether the Birthworker Academy is the right next step to put the whole model in place.',
   pill:'Join the free Birthworker workshop',
   disclaimer:'This masterclass is educational. It shares one business model and one teacher’s experience. It is not a promise or guarantee of income or results. Every doula’s outcome depends on her own market, effort, and choices.'}
];

const deck=document.getElementById('deck');
for(const s of S){
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'')+(s.t==='num'?' num':'')+(s.t==='layers'?' layers':'');
  let html='';
  if(s.brand) html+=`<div class="brandline">${s.brand}</div>`;
  if(s.kicker) html+=`<div class="kicker">${s.kicker}</div>`;
  if(s.eyebrow) html+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='title'){html+=`<h1>${s.h}</h1>`;} else {html+=`<h2>${s.h}</h2>`;}
  if(s.p) html+=`<p${s.t==='title'?' class="lead"':''}>${s.p}</p>`;
  if(s.items){html+=`<ul>`;for(const it of s.items){html+=`<li>${it}</li>`;}html+=`</ul>`;}
  if(s.pill) html+=`<div><span class="pill">${s.pill}</span></div>`;
  if(s.disclaimer) html+=`<div class="disclaimer">${s.disclaimer}</div>`;
  el.innerHTML=html;
  deck.appendChild(el);
}
</script>
</body>
</html>
