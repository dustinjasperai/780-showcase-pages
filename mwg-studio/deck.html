<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finally Sound Like Jazz — a masterclass with Matt Warnock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1420;        /* darkened brand navy (#062A48 / #212338) */
    --panel:#10233a;     /* brand deep navy */
    --panel2:#062A48;    /* brand deep navy, evidence */
    --rule:#2a3550;      /* derived navy rule */
    --muted:#9aa3bd;     /* derived from brand grey #bac1c7 */
    --ink:#eef1f7;       /* near-white ink on dark */
    --accent:#b11a12;    /* brand crimson (#8f0b00 / #8e191c) */
    --accent2:#f0dca0;   /* brand cream/gold (#f9edbe) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--rule);border-radius:14px;padding:54px 52px;margin:22px 0;
    min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:'Lato';font-weight:900;letter-spacing:.22em;text-transform:uppercase;
    font-size:13px;color:var(--accent2);margin-bottom:18px}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:900;font-size:clamp(34px,5.2vw,62px);
    line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'DM Serif Display',Georgia,serif;font-weight:700;font-size:clamp(26px,3.6vw,42px);
    line-height:1.1;margin-bottom:16px}
  .lead{font-size:clamp(17px,2vw,22px);color:var(--ink);max-width:40ch;line-height:1.5}
  .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);max-width:52ch;line-height:1.6;margin-top:10px}
  ul{list-style:none;margin-top:14px}
  li{font-size:clamp(16px,1.8vw,20px);line-height:1.5;padding:11px 0 11px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:10px;height:10px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .num{font-family:'DM Serif Display',serif;font-weight:900;font-size:clamp(46px,8vw,96px);color:var(--accent2);line-height:1;margin-bottom:8px}
  .byline{margin-top:30px;color:var(--muted);font-size:16px;font-weight:700}
  .byline b{color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  @media(max-width:720px){.two{grid-template-columns:1fr}.slide{padding:40px 26px}}
  .tag{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--panel);background:var(--accent2);padding:5px 12px;border-radius:999px;margin-bottom:16px;align-self:flex-start}
  .cta .box{border:1px solid var(--accent);border-radius:12px;padding:22px 24px;margin-top:20px;background:rgba(177,26,18,.08)}
  .cta .box b{color:var(--accent2)}
  .disc{margin-top:22px;color:var(--muted);font-size:13px;line-height:1.55;max-width:64ch}
  .foot{color:var(--muted);font-size:13px;text-align:center;padding:16px 0 0;letter-spacing:.04em}
  .progress{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;position:absolute;right:52px;bottom:22px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Matt Warnock Guitar &middot; a free live masterclass preview</div>
<script>
const S = [
  {t:'title',
    kicker:'A live masterclass with Matt Warnock',
    h1:'Finally Sound Like Jazz',
    lead:'How to go from lost in scales and theory to actually playing standards, comping, and improvising with confidence.',
    byline:'Hosted by <b>Matt Warnock</b> &middot; Matt Warnock Guitar'},

  {t:'content',
    kicker:'Who this is for',
    h2:'You can already play guitar. Jazz still feels like a locked door.',
    lead:'You know chords. You can follow a song. But when someone says "play over the changes," it all falls apart.',
    sub:'This is for the guitarist who loves the sound of jazz and is tired of collecting lessons that never add up to playing a tune.'},

  {t:'content',
    kicker:'The trap',
    h2:'More lessons has not made you a jazz player.',
    lead:'A folder of PDFs. Forty bookmarked videos. Three scale books. And you still freeze on a blues in F.',
    sub:'The problem was never a shortage of information. Jazz guitar has more free information than any style on earth. That is exactly why people get stuck.'},

  {t:'reframe',
    kicker:'The real reason',
    h1:'It is not talent. It is not theory. It is the missing map.',
    sub:'Nobody ever told you what to practice, in what order, and when you are ready for the next thing. So you practice everything a little and master nothing. The fix is a sequence, not more scales.'},

  {t:'part', num:'01', kicker:'Part one', h2:'Why jazz guitar overwhelms almost everyone'},

  {t:'content',
    kicker:'The three dead ends',
    h2:'Three ways good players stay stuck for years',
    list:['Random lessons: a lick here, a mode there, with no thread connecting them',
          'Theory with no music: you can explain a ii-V-I but you cannot play one over a tune',
          'No finish line: you never know when a skill is done, so nothing ever feels finished']},

  {t:'content',
    kicker:'The cost',
    h2:'What that really costs you',
    lead:'Not money. Years.',
    sub:'Years of practicing without progress is what makes talented players quietly decide "jazz is not for me." It almost never is. It is the method that failed them, not the player.'},

  {t:'part', num:'02', kicker:'Part two', h2:'The MWG method: a roadmap, not a pile of lessons'},

  {t:'content',
    kicker:'Framework 1',
    h2:'The Levels System',
    lead:'Twenty ordered levels, beginner to advanced, so you always know exactly what to practice next.',
    sub:'Early levels: blues chords, phrasing, major pentatonic, your first standard. Middle levels: minor ii-V-I, bossa nova, Autumn Leaves. Later levels: enclosures, bebop lines, and real soloing. One step at a time, each built on the last.'},

  {t:'content',
    kicker:'Framework 2',
    h2:'One Fingering, 28 Scales',
    lead:'Learn a single shape, the Lydian mode. Change one note at a time and you have 28 jazz scales and modes.',
    sub:'Instead of memorizing 28 unrelated shapes, you build each new sound off the one before it. The fretboard stops being a wall of dots and starts making sense.'},

  {t:'content',
    kicker:'Framework 3',
    h2:'Vocabulary First: See One Chord, Play Another',
    lead:'Improvising is not running scales. It is speaking a language made of lines and phrases.',
    sub:'You build a vocabulary of jazz lines, practice each one with a metronome, then apply it straight to a real tune. That is how you learn to see one chord and play the sound of another over it.'},

  {t:'content',
    kicker:'Framework 4',
    h2:'ii-V-I Essentials',
    lead:'Master the one progression that unlocks most of the standard repertoire, in major and minor.',
    sub:'The ii-V-I is the most common movement in jazz. Own it and dozens of tunes open up at once, instead of learning every song as if it were brand new.'},

  {t:'content',
    kicker:'Framework 5',
    h2:'Learn by Standards',
    lead:'Every skill is tied to a real song, so you are always making music, not drilling theory.',
    sub:'You do not learn arpeggios in a vacuum. You learn them on Autumn Leaves. Theory becomes a tune you can play at a jam, which is the whole point.'},

  {t:'part', num:'03', kicker:'Part three', h2:'What changes in your actual playing'},

  {t:'content',
    kicker:'A week on the roadmap',
    h2:'What a week actually looks like',
    list:['One short technical rep on the scale or lick for this level, with a metronome',
          'One application rep: that same idea played over the tune for this level',
          'One checkpoint: you know the level is done, so you move on without second-guessing']},

  {t:'content',
    kicker:'The shift',
    h2:'From noodling to playing Autumn Leaves',
    lead:'The first time you play a full chorus over a standard and it sounds like jazz, something changes for good.',
    sub:'That moment is the goal of the whole roadmap. Not knowing more. Playing more.'},

  {t:'content',
    kicker:'Why me',
    h2:'Who is teaching this',
    lead:'Matt Warnock. Jazz guitar columnist for Guitar World, over a decade teaching jazz guitar online.',
    sub:'Nearly 200 structured courses, a leveled curriculum, live workshops, and a library of free method guides that have helped guitarists all over the world. The method you just saw is the one I use every day.'},

  {t:'content',
    kicker:'The promise',
    h2:'Organized curriculum, personal attention, and a whole lotta fun',
    lead:'Jazz guitar is supposed to be joyful. A clear path is what makes it fun again.',
    sub:'When you always know the next step, practice stops being a chore and starts being the best part of your day.'},

  {t:'content',
    kicker:'The roadmap in one slide',
    h2:'Here is the whole idea',
    list:['A sequence, not a pile: 20 levels tell you exactly what is next',
          'Scales that build on each other, not 28 shapes to cram',
          'Vocabulary applied to real tunes, not theory in a vacuum',
          'The ii-V-I that unlocks the repertoire',
          'Every skill tied to a standard you can actually play']},

  {t:'cta',
    kicker:'Where to start',
    h1:'Start playing jazz, on a path that makes sense',
    boxlead:'Begin with the Levels curriculum inside <b>MWG All Access</b>. Try it free, follow the roadmap, and play your first standard.',
    boxcta:'Start your free trial at mwgcourses.com',
    disc:'This masterclass is for educational purposes only. Results depend on individual practice and effort; no specific outcome or skill level is guaranteed. Matt Warnock Guitar teaches methods and materials for learning jazz guitar.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t==='cta'?'cta':'');
  let h = '';
  if(s.kicker) h += `<div class="kicker">${s.kicker}</div>`;
  if(s.t==='part' && s.num) h += `<div class="num">${s.num}</div>`;
  if(s.h1) h += `<h1>${s.h1}</h1>`;
  if(s.h2) h += `<h2>${s.h2}</h2>`;
  if(s.lead) h += `<p class="lead">${s.lead}</p>`;
  if(s.list){ h += '<ul>'; s.list.forEach(x=> h += `<li>${x}</li>`); h += '</ul>'; }
  if(s.sub) h += `<p class="sub">${s.sub}</p>`;
  if(s.byline) h += `<div class="byline">${s.byline}</div>`;
  if(s.t==='cta'){
    h += `<div class="box"><p class="lead">${s.boxlead}</p><p class="byline"><b>${s.boxcta}</b></p></div>`;
    if(s.disc) h += `<p class="disc">${s.disc}</p>`;
  }
  h += `<div class="progress">${i+1} / ${S.length}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
