<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>From £999 Thinking to £10,000 Fees · The Complete Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf7f4; --panel:#f1e9ea; --rule:#e7d7db;
    --ink:#141414; --grey:#4a4448; --dim:#928a8d;
    --accent:#ee2e5f; --accent2:#d62e58;
  }
  html,body{height:100%}
  body{background:#e9e2e3;font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9e2e3}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:0}
  .t-title h1{font-size:4.9vw;max-width:92%}
  .t-normal h1{font-size:3.6vw;max-width:88%}
  .t-normal .body{font-size:1.42vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.6;font-weight:400}
  .sub{font-size:1.65vw;color:var(--grey);margin-top:3.4vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.05vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:92%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#2a1319 0%,#1a1013 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:88%;font-style:italic;font-weight:500;color:#faf7f4}
  .t-dark .accent-bar{width:9vw;height:3px;background:var(--accent);margin:3.6vh auto 0}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2a1319 0%,#1a1013 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.1vw;max-width:86%;color:#faf7f4}
  .chips{display:flex;gap:1.2vw;margin-top:4.4vh;flex-wrap:wrap;justify-content:center}
  .chip{background:var(--accent);color:#fff;border-radius:100px;padding:1.5vh 1.9vw;font-size:1.16vw;font-weight:600;font-family:'Montserrat',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-cta .disc{color:#b7a7ac}
  .t-title .disc,.t-normal .disc{text-align:left}
  .ladder{position:absolute;pointer-events:none}
  .title-ladder{right:6%;bottom:7%;width:27vw;opacity:.92}
  .corner-ladder{right:5%;bottom:7%;width:11vw;opacity:.5}
  .brandline{font-size:1.24vw;color:var(--grey);margin-top:3.6vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(20,20,20,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:13px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:8vw}.t-section .idx{font-size:2.8vw}
    .t-dark h1{font-size:6.4vw}.t-cta h1{font-size:7vw}.chip{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Complete Agent</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- fee-ladder motif: a rising stepped line climbing from a low fee to a premium one, drawn once -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ladder" viewBox="0 0 300 200">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 176 L84 176 L84 134 L146 134 L146 92 L208 92 L208 48 L276 48" stroke="#ee2e5f" opacity="0.92"/>
    <path d="M24 186 L96 186 L96 150 L160 150 L160 110 L222 110 L222 66 L276 66" stroke="#141414" opacity="0.12"/>
    <circle cx="24" cy="176" r="4.6" fill="none" stroke="#ee2e5f" stroke-width="2.8"/>
    <circle cx="276" cy="48" r="5.6" fill="#ee2e5f" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'From £999 Thinking to £10,000 Fees',sub:'A live masterclass for estate agents who are tired of competing on price and ready to charge, and defend, a premium fee.',brand:true,ladder:'title'},
 {t:'normal',k:'Who this is for',title:'You already win instructions. You just win them at a fee that does not reflect the job.',body:'You know your market, you work harder than the discounters down the high street, and you still find yourself shaving the fee to get the business. The problem was never your ability to sell houses. It is what happens the moment the conversation turns to money.'},
 {t:'dark',title:'A lower fee does not win more instructions. It just trains your market to expect less of you.'},

 {t:'section',idx:'Part One',title:'Why Good Agents Stay Stuck on Low Fees'},
 {t:'normal',k:'The fixed-fee ceiling',title:'A fixed fee caps the business before the valuation even starts.',body:'When you lead with a low fixed number, you compete in the one arena where someone can always go lower. You end up doing premium work for a fee that leaves nothing for marketing, for staff, or for you, and the harder you work the more obvious the mismatch becomes.'},
 {t:'normal',k:'"£999 thinking"',title:'The ceiling is in the language before it is in the market.',body:'"£999 thinking" is the quiet self-talk that shows up in everyday conversation: discounting before you are asked, apologising for the fee, assuming your area will not pay more. Vendors hear it, and they price you exactly where you have priced yourself in your own head.'},
 {t:'normal',k:'Lost in conversation',title:'Most agents do not lose the fee on the figure. They lose it in the conversation.',body:'The number is rarely the real objection. It is the pause, the flinch, the rush to justify, the fallback to a fixed fee the moment a vendor pushes. The agents charging 2% are not braver. They have simply learned to hold the conversation when the pressure arrives.'},
 {t:'dark',title:'The gap is never your value. It is a fee conversation you can run on purpose, every time.'},

 {t:'section',idx:'Part Two',title:'The ARC System'},
 {t:'normal',k:'The three moves',title:'One system, built from transforming our own agencies to average fees of £10,000+.',body:'The ARC System is how we moved out of low fixed fees for good. It is three moves that compound: get in the doors of the best homes in your area, command a consistent five-figure fee once you are there, and build a reputation that makes the next instruction easier than the last.'},
 {t:'normal',k:'Move one · Get in the doors',title:'Win the right instructions, not just more of them.',body:'Premium fees live in premium homes. The first move is positioning yourself so the best homeowners in your patch call you first, instead of chasing every valuation and competing with three other boards on the same street.'},
 {t:'normal',k:'Move two · Command the fee',title:'Hold a five-figure number without flinching.',body:'This is the fee conversation itself: preparing for the pressure before it happens, using language that builds authority instead of leaking it, and answering the fee objection without collapsing back to a fixed number. It is the single skill that separates the average agent from a 2% operator.'},
 {t:'normal',k:'Move three · Build the reputation',title:'Make the premium fee obvious before you ever name it.',body:'When your market already sees you as the agent for homes like theirs, the fee stops being a fight. Reputation is what turns one premium instruction into a steady stream of them, so you are not starting the argument from zero on every single call.'},
 {t:'dark',title:'Get in the right doors, hold the fee, build the name. That is an agency that charges what it is worth.'},

 {t:'section',idx:'Part Three',title:'What a Premium Agency Looks Like'},
 {t:'normal',k:'The agent this builds',title:'Fewer instructions, far better fees, a business that finally pays you.',body:'You walk into the valuation already positioned as the premium choice. You quote a five-figure fee and hold it calmly when it is tested. And because your reputation does the heavy lifting, the next vendor arrives half-sold, so you take on less and earn considerably more.'},
 {t:'dark',title:'The goal was never more listings. It was the right listings, at a fee that reflects the work.'},
 {t:'normal',k:'Why The Complete Agent',title:'Agents who still do the job, teaching the fees we actually charge.',body:'We are Ian Storey, James Kendall and David Warburton, with over 60 years and more than £1.9 billion of property sold between us. We built our own agencies up to average fees of £10,000+ using the ARC System, and now we teach ambitious agents to do the same through our membership and mentoring.'},

 {t:'section',idx:'Your Next Step',title:'Learn the Whole System'},
 {t:'normal',k:'The Complete Agent membership',title:'The full ARC System, with mentors who have done it.',body:'Our membership puts the complete fee-elevation path in one place: the positioning, the fee conversation, and the reputation work, plus the mastermind events, the training portal, and one-to-one coaching from agents still active in the market today.'},
 {t:'cta',title:'Ready to charge what your work is actually worth?',chips:['Explore The Complete Agent membership','Book a free call with the mentors'],disc:'Educational content for estate agents. No income, fee, or business result is guaranteed. Results vary by agent, market, and effort.'},
];

const deck=document.getElementById('deck');
function ladder(kind){return `<svg class="ladder ${kind==='title'?'title-ladder':'corner-ladder'}" viewBox="0 0 300 200"><use href="#ladder"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Complete <b>Agent</b> · Ian Storey, James Kendall, David Warburton</div>`;
    if(s.t==='dark') h+=`<div class="accent-bar"></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.ladder) h+=ladder(s.ladder);
  else if(s.t==='title') h+=ladder('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
