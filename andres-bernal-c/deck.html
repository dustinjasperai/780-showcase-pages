<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governing a Latin American Board — iDirectores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f8fa;        /* their light ground */
    --panel:#e9ecf1;     /* lightened #dcdfe5 */
    --rule:#c6ccd6;      /* from #dcdfe5 / #5c6370 */
    --ink:#1f242e;       /* their body/footer navy */
    --muted:#5c6370;     /* their link gray */
    --accent:#f97415;    /* their CTA orange (## Palette) */
    --deep:#004671;      /* their deep blue */
    --head:"Spectral",Georgia,serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#dfe3ea;color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;margin:0 0 16px}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin:0 0 14px;max-width:48ch}
  .lead{font-size:22px;color:var(--muted)}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:10px 0 10px 28px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .big{font-family:var(--head);font-size:40px;line-height:1.15;color:var(--deep)}
  .num{font-family:var(--head);font-size:15px;color:var(--muted);position:absolute;right:28px;bottom:20px}
  .foot{font-family:var(--body);font-size:13px;color:var(--muted);position:absolute;left:60px;bottom:20px;letter-spacing:.04em}
  .disc{font-size:14px;color:var(--muted);max-width:60ch;margin-top:18px}
  .cta .btn{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;font-weight:600;
    padding:14px 26px;border-radius:10px;font-size:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 34px}
  .tag{display:inline-block;background:var(--panel);border:1px solid var(--rule);border-radius:999px;
    padding:6px 14px;font-size:14px;color:var(--deep);margin:4px 6px 0 0}
  @media(max-width:640px){.slide{padding:38px 26px}h1{font-size:33px}h2{font-size:26px}.foot{left:26px}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const BRAND="iDirectores";
const S=[
 {t:"cover",kick:"A live masterclass for board directors",h:"Governing a Latin American Board",
  p:"What the imported playbook leaves out, and how to run the board you actually sit on."},

 {t:"who",kick:"Who this is for",h:"If you sit on a board in Latin America",
  items:["Directors of family businesses and family-controlled groups","Board members of conglomerates and holding structures","Directors and councils of state and mixed-ownership enterprises","Executives being asked to join their first board"]},

 {t:"trap",kick:"The trap",h:"You were handed a playbook written for someone else",
  p:"Most governance training is translated from listed-company, dispersed-ownership markets. Useful, but it quietly assumes a company your board does not run.",
  lead:"The result is a board that reviews a lot and governs very little."},

 {t:"reframe",kick:"The reframe",h:"Governance is the interaction between the owners and the executors",
  p:"The board is not a committee that approves minutes. It represents ownership, and its one job is to set the organization's north.",
  lead:"Fijar el norte. Everything else is in service of that."},

 {t:"part",kick:"Part one",h:"The reality your board sits over",
  p:"Three ownership realities dominate the region, and each changes how a board must behave."},

 {t:"three",kick:"Part one",h:"Three realities, three different boards",
  grid:[["Family firms","Owners in the room, succession in the air, emotion and capital entangled."],
        ["Conglomerates","Holding over many businesses; the board governs a portfolio, not a product."],
        ["State and mixed","Public mandate and political weather on top of commercial duty."]]},

 {t:"part",kick:"Part two",h:"How a professional board actually works",
  p:"Not more meetings. A small number of disciplines, practiced until they are ordinary."},

 {t:"pillar",kick:"The framework",h:"Represent ownership",
  p:"Be clear whose interests you carry into the room, and separate them cleanly from management's. In a family firm this is the whole game.",num:"1 of 4"},

 {t:"pillar",kick:"The framework",h:"Set the north, then hold it",
  p:"Agree the direction and the few things that must be true to get there. Govern against that, not against the length of the deck.",num:"2 of 4"},

 {t:"pillar",kick:"The framework",h:"Govern risk, do not just review it",
  p:"Enterprise risk is a board decision, not a compliance file. COSO, ISO 31000 and the rest become useful only once they are translated into the handful of choices the board must own.",num:"3 of 4"},

 {t:"riskcard",kick:"Risk in board language",h:"What a director must know about risk",
  items:["Which risks could end the company, not just dent a quarter","Where the board decides, and where it only oversees","The questions to ask before every material vote","How to read a 40-page report in four board decisions"]},

 {t:"pillar",kick:"The framework",h:"Learn at the table",
  p:"Governance is learned by discussing real situations with directors who have sat them, not from a lecture. Elevar el estandar a traves de la vivencia.",num:"4 of 4"},

 {t:"part",kick:"Part three",h:"What changes once a board governs",
  p:"A board that knows its job changes the temperature of a company within two or three meetings."},

 {t:"looks",kick:"Part three",h:"The shift, side by side",
  grid:[["A board that reviews","Approves the plan, receives the report, signs the minutes, hopes."],
        ["A board that governs","Owns the north, decides the few risks that matter, asks the question nobody else will."]]},

 {t:"why",kick:"Why me",h:"Where this comes from",
  p:"I am Andres Bernal. I advise boards across Latin America and founded iDirectores, the Spanish-language community where directors raise the standard together.",
  items:["Thousands of directors and senior executives in the network","Board work across family, conglomerate and state ownership","Teaching built on lived cases, in Spanish, for this region"]},

 {t:"tags",kick:"Inside iDirectores",h:"How directors keep learning",
  tags:["The director community","Enterprise-risk governance course","The annual Roundtable","Peer case discussions","Board evaluation"]},

 {t:"recap",kick:"The one idea",h:"Govern the board you actually have",
  p:"Not the one the imported manual describes. Represent ownership, set the north, decide the risks that matter, and learn at the table with your peers."},

 {t:"cta",kick:"Your next step",h:"Keep raising the standard of your board",
  p:"If this is the way you want to govern, continue with iDirectores: join the director community and the next live session.",
  btn:"Join iDirectores",
  disc:"Educational content only. Governance outcomes depend on each board, company and context; nothing here is a guarantee of any specific result, and none of it is legal, financial or investment advice."}
];

const d=document.getElementById("deck");
S.forEach((s,i)=>{
  const el=document.createElement("section");el.className="slide "+(s.t||"");
  let h="";
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  if(s.t==="cover"){h+='<h1>'+s.h+'</h1>';}
  else {h+='<h2>'+s.h+'</h2>';}
  if(s.p) h+='<p>'+s.p+'</p>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.items){h+='<ul>';s.items.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.grid){h+='<div class="grid2">';s.grid.forEach(g=>h+='<div><h2 style="font-size:22px;margin-bottom:6px">'+g[0]+'</h2><p>'+g[1]+'</p></div>');h+='</div>';}
  if(s.tags){h+='<div>';s.tags.forEach(t=>h+='<span class="tag">'+t+'</span>');h+='</div>';}
  if(s.btn) h+='<div><span class="btn">'+s.btn+'</span></div>';
  if(s.disc) h+='<p class="disc">'+s.disc+'</p>';
  h+='<span class="foot">'+BRAND+'</span><span class="num">'+(i+1)+' / '+S.length+'</span>';
  el.innerHTML=h;d.appendChild(el);
});
</script>
</body>
</html>
