<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Business Exceleration Blueprint — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Catamaran:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f4;      /* warm near-white ground (their light scheme) */
    --ink:#231f20;        /* their H1 near-black */
    --slate:#535c5e;      /* their dominant body slate */
    --accent:#eba33f;     /* their signature CTA-button orange */
    --rule:#e4ddd1;
    --panel:#2a2522;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--slate);font-family:'Catamaran',system-ui,sans-serif;color:var(--ink);line-height:1.5}
  .deck{max-width:960px;margin:0 auto}
  .slide{background:var(--paper);min-height:540px;padding:64px 72px;display:flex;flex-direction:column;justify-content:center;
    border-bottom:6px solid var(--slate);position:relative;overflow:hidden}
  .slide .kick{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:52px;line-height:1.04;letter-spacing:-.01em;color:var(--ink)}
  h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:38px;line-height:1.08;letter-spacing:-.01em;color:var(--ink)}
  h3{font-family:'Archivo',sans-serif;font-weight:700;font-size:23px;color:var(--ink)}
  p.lead{font-size:22px;color:var(--slate);margin-top:20px;max-width:42ch}
  p.body{font-size:19px;color:var(--slate);margin-top:16px;max-width:52ch}
  ul{margin-top:22px;list-style:none}
  ul li{font-size:19px;color:var(--slate);padding:11px 0 11px 34px;position:relative;border-top:1px solid var(--rule)}
  ul li:before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;background:var(--accent)}
  .num{font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.1em}
  /* title slide: dark panel */
  .slide.cover{background:var(--panel);border-bottom-color:var(--accent)}
  .slide.cover .kick{color:var(--accent)}
  .slide.cover h1,.slide.cover h3{color:#f7f3ec}
  .slide.cover p.lead{color:#cfc7ba}
  .slide.cover .foot{margin-top:40px;font-family:'Archivo';font-weight:600;color:#cfc7ba;font-size:16px;letter-spacing:.04em}
  /* stage slides */
  .stagewrap{display:flex;align-items:baseline;gap:20px}
  .stagewrap .snum{font-family:'Archivo';font-weight:800;font-size:76px;color:var(--accent);line-height:.9}
  .stageline{height:3px;background:var(--accent);width:84px;margin:20px 0 4px}
  .map{margin-top:26px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .map .cell{border:1px solid var(--rule);padding:14px 10px;text-align:center}
  .map .cell .n{font-family:'Archivo';font-weight:800;color:var(--accent);font-size:14px}
  .map .cell .l{font-family:'Archivo';font-weight:700;font-size:14px;color:var(--ink);margin-top:6px}
  .map .cell.on{background:var(--panel);border-color:var(--panel)}
  .map .cell.on .l{color:#f7f3ec}
  .cta-box{margin-top:30px;display:inline-block;background:var(--accent);color:#231f20;font-family:'Archivo';font-weight:700;
    font-size:19px;padding:17px 30px;letter-spacing:.02em}
  .disc{margin-top:30px;font-size:13.5px;color:#8a8780;max-width:62ch;line-height:1.5}
  .progress{font-family:'Archivo';font-weight:600;font-size:12px;color:#b7b0a4;position:absolute;top:30px;right:40px;letter-spacing:.14em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'cover', kick:'A Live Masterclass with Ben Fewtrell + David Carlin', h:'The Business Exceleration Blueprint', lead:'The 5 stages to a business that runs without you, instead of one that runs you into the ground.', foot:'MaxMyProfit'},

  {t:'who', kick:'Who this is for', h:'You passed the hard part years ago.', body:'You built a real business. Customers, revenue, a team. You are past the one-million-dollar mark or close to it. And somehow you are working more hours now than when you started, and the business still cannot run for a week without you in it.', pts:['You are the owner, the operator, and the firefighter','Every important decision still routes through you','Growth just means more work landing on your desk']},

  {t:'point', kick:'The trap', h:'More effort stopped buying more freedom.', body:'In the early days effort and reward moved together. Work harder, earn more. At your size that link quietly breaks. You push harder and the only thing that grows is the length of your day. That is not a motivation problem. It is a structure problem.'},

  {t:'point', kick:'The reframe', h:'A busy owner is not the same thing as a valuable business.', body:'A business that needs you in it every day is a job you own, not an asset you own. The goal was never to be the hardest-working person in the building for the next twenty years. It was to build something that works whether you are there or not.'},

  {t:'point', kick:'The three businesses', h:'Every owner is really running three businesses at once.', body:'The one you have today, the one you want, and the one your habits are actually building by default. When those three drift apart, you feel it as overwhelm. The job is to line them back up on purpose, in a sequence you can follow.', pts:['The business you have now','The business you actually want','The business your daily habits are building']},

  {t:'point', kick:'Part one: the real problem', h:'You are running your business from memory, not from a map.', body:'Most owners hold the whole business in their head. What to do next, what good looks like, how each job gets done. That works until it does not. When it is all in your head, nothing can be delegated, nothing can be improved on purpose, and nothing runs without you.', pts:['No map means no handover','No handover means no team ownership','No team ownership means no owner freedom']},

  {t:'map', kick:'Part two: the framework', h:'The Business Exceleration Blueprint', body:'Think of it as an instruction manual for your business. Every business and every owner moves through the same five stages on the way to a business that runs without them. We find out which stage you are actually in, and we work it in order.'},

  {t:'stage', num:'01', kick:'Stage one', h:'Foundation', body:'Set the foundations the whole business stands on. Your numbers, your vision, your core offer and the few things that have to be true before growth is safe to chase. Most owners skip this and build speed on sand.', on:0},

  {t:'stage', num:'02', kick:'Stage two', h:'Growth', body:'Now you turn the handle. Sharpen the offer, fix the sales and marketing engine, and maximise sales and profit on purpose rather than by luck. Growth is a system you can switch on, not a good month you hope repeats.', on:1},

  {t:'stage', num:'03', kick:'Stage three', h:'Optimize', body:'Turn the business into a well-oiled, profit-making machine. Document how the work gets done, automate the repetitive tasks, and get your key numbers and KPIs reporting back to you so the business improves without you watching every job.', on:2},

  {t:'stage', num:'04', kick:'Stage four', h:'Transition', body:'This is the one owners wait too long to reach. Build the leadership and management team and hand them real ownership, so you move from working IN the business to working ON it. This is where you buy your time back.', on:3},

  {t:'stage', num:'05', kick:'Stage five', h:'Diversify', body:'Once you have a business that genuinely runs without you, you finally have the one thing you never had: capacity. Now you can diversify, invest, start the next thing, or simply step back and enjoy what you built.', on:4},

  {t:'point', kick:'Why the order matters', h:'Stages skipped are stages you pay for later.', body:'Owners love to jump straight to growth, or straight to hiring a manager to rescue them. It rarely holds, because the stage underneath was never built. The Blueprint works because it is sequential. You stop guessing which fire to fight and start building in the order a business is actually built.'},

  {t:'point', kick:'Part three: what changes', h:'What a business that runs without you actually feels like.', body:'This is not theory. It is what the owners we work with describe once the stages are in place.', pts:['You take a real holiday and the numbers hold','Your team solves problems without calling you','You spend your week on the business, not buried in it','The business is finally worth selling, whether you sell or not']},

  {t:'point', kick:'The shift that unlocks it', h:'The owner stops being the system and starts owning the system.', body:'In every stage, the move is the same shape: take something that only lives in your head and turn it into something the business can run on its own. Do that five times, in order, and the business stops depending on you being in the room.'},

  {t:'why', kick:'Why us', h:'We have built this, not just taught it.', body:'Ben Fewtrell and David Carlin founded MaxMyProfit in 2015 after 20-plus years running and coaching businesses themselves. We have both worked crazy hours for little reward, structured our own way out of it, and then mapped the step-by-step process so other owners do not have to learn it the slow way. The Business Exceleration Blueprint is that process, written down.'},

  {t:'point', kick:'The honest part', h:'This is a method, not a magic wand.', body:'You still have to do the work and work the stages in order. What the Blueprint removes is the guessing: knowing which stage you are in, what to fix next, and what a business that runs without you is actually built from.'},

  {t:'cta', kick:'Your next step', h:'Find out which stage you are in.', body:'If a business that runs without you is the goal, the first move is to see your business through the five stages honestly and know exactly what to work on next. That is what we do together.', cta:'Book a call with the MaxMyProfit team', disc:'This masterclass is educational. It shares a framework and general business principles, not individual advice. No income or result is guaranteed. Results vary with your market, your effort, and your situation.'}
];

const deck = document.getElementById('deck');
const total = S.length;
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cover'?' cover':'');
  let h = '';
  if(s.t!=='cover') h += '<div class="progress">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</div>';
  if(s.kick) h += '<div class="kick">'+s.kick+'</div>';

  if(s.t==='cover'){
    h += '<h1>'+s.h+'</h1><p class="lead">'+s.lead+'</p><div class="foot">'+s.foot+'</div>';
  } else if(s.t==='map'){
    h += '<h2>'+s.h+'</h2><p class="body">'+s.body+'</p>';
    const stages=[['01','Foundation'],['02','Growth'],['03','Optimize'],['04','Transition'],['05','Diversify']];
    h += '<div class="map">'+stages.map(x=>'<div class="cell"><div class="n">'+x[0]+'</div><div class="l">'+x[1]+'</div></div>').join('')+'</div>';
  } else if(s.t==='stage'){
    h += '<div class="stagewrap"><div class="snum">'+s.num+'</div><div><h2>'+s.h+'</h2></div></div><div class="stageline"></div>';
    h += '<p class="body">'+s.body+'</p>';
    const stages=['Foundation','Growth','Optimize','Transition','Diversify'];
    h += '<div class="map">'+stages.map((x,k)=>'<div class="cell'+(k===s.on?' on':'')+'"><div class="n">0'+(k+1)+'</div><div class="l">'+x+'</div></div>').join('')+'</div>';
  } else if(s.t==='cta'){
    h += '<h2>'+s.h+'</h2><p class="body">'+s.body+'</p><div class="cta-box">'+s.cta+'</div>';
    h += '<div class="disc">'+s.disc+'</div>';
  } else {
    h += '<h2>'+s.h+'</h2>';
    if(s.body) h += '<p class="body">'+s.body+'</p>';
    if(s.pts) h += '<ul>'+s.pts.map(p=>'<li>'+p+'</li>').join('')+'</ul>';
  }
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
