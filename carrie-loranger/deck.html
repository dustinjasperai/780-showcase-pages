<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Portfolio of Paychecks — a 9-to-Thrive masterclass with Carrie Loranger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcfaf7;        /* her cream ground */
    --panel:#f4ede2;     /* her warm sand */
    --ink:#2d1914;       /* her dominant espresso */
    --rule:#2d1914;
    --accent:#ff4d00;    /* her one saturated brand orange */
    --muted:#6b5a50;
    --head:"Inter Tight", system-ui, sans-serif;
    --body:"Inter", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e9e1d6;color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:32px 16px 72px}
  .slide{
    position:relative;background:var(--bg);border:1px solid rgba(45,25,20,.12);
    border-radius:14px;padding:56px 56px 52px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 1px 0 rgba(45,25,20,.04);
  }
  .slide.alt{background:var(--panel)}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.04;letter-spacing:-.02em;max-width:18ch}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-.01em;max-width:20ch}
  p{font-size:19px;line-height:1.5;color:var(--ink);max-width:62ch;margin-top:16px}
  p.lead{font-size:22px}
  .muted{color:var(--muted)}
  .big{font-family:var(--head);font-weight:800;font-size:60px;line-height:1;letter-spacing:-.03em;color:var(--accent)}
  .n{font-size:16px;color:var(--muted);position:absolute;top:22px;right:26px;font-family:var(--head);font-weight:600}
  .by{margin-top:28px;font-size:16px;color:var(--muted)}
  .by b{color:var(--ink);font-weight:600}
  ul{margin:18px 0 0 0;list-style:none;display:grid;gap:12px}
  li{font-size:19px;line-height:1.4;padding-left:26px;position:relative}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:3px;background:var(--accent);border-radius:2px}
  /* paycheck-stack motif */
  .stack{margin-top:26px;display:grid;gap:10px;max-width:520px}
  .bar{display:flex;align-items:center;justify-content:space-between;
    background:#fff;border:1px solid rgba(45,25,20,.14);border-radius:10px;padding:14px 18px;font-size:18px;font-weight:500}
  .bar .tag{font-family:var(--head);font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.04em}
  .bar.f1{width:60%}.bar.f2{width:72%}.bar.f3{width:84%}.bar.f4{width:94%}.bar.f5{width:100%}
  .steps{margin-top:26px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .step{background:#fff;border:1px solid rgba(45,25,20,.14);border-radius:10px;padding:18px}
  .step .s{font-family:var(--head);font-weight:800;font-size:13px;color:var(--accent);letter-spacing:.08em}
  .step h3{font-family:var(--head);font-weight:700;font-size:19px;margin-top:8px}
  .step p{font-size:14.5px;margin-top:8px;color:var(--muted)}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:4px;color:var(--muted)}
  .em{color:var(--accent)}
  .disc{font-size:13px;color:var(--muted);margin-top:24px;max-width:70ch;line-height:1.45}
  .cta-line{font-family:var(--head);font-weight:700;font-size:22px;margin-top:18px}
  @media(max-width:640px){
    .slide{padding:36px 26px}.steps{grid-template-columns:repeat(2,1fr)}
    h1{font-size:34px}h2{font-size:26px}.big{font-size:44px}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const S=[
  {t:'title',kick:'A live 9-to-Thrive masterclass',h:'The Portfolio of Paychecks',
   p:'How to turn one Substack into a portfolio of compounding paychecks, without chasing a giant audience.',
   by:'With <b>Carrie Loranger</b>, 9-to-Thrive'},

  {t:'who',kick:'Who this is for',h:'You are already writing. The money just is not matching the work.',
   p:'You show up for your readers every week. Maybe you have a few hundred or a few thousand subscribers. The growth advice says get more people. The bank account says something else is wrong.'},

  {t:'trap',kick:'The trap',h:'You were told the lever is size.',
   p:'So you pour the hours into growth: more posts, more Notes, more cross-promotion. Subscribers tick up. Income barely moves. The trap is believing those two lines are the same line.'},

  {t:'reframe',kick:'The reframe',alt:true,h:'Growth and income are two different problems.',
   p:'A bigger list is not what pays you. One well-placed offer to the readers you already have beats ten thousand more free subscribers. Solve income first, and growth stops being the thing you are waiting on.'},

  {t:'part',kick:'Part one',h:'Why most Substacks stay broke',
   p:'Not for lack of talent or effort. For lack of an ordered build. Everything gets done at once and in the wrong order, so nothing compounds.'},

  {t:'problem',kick:'The core problem',h:'A free newsletter with no offer is a job you pay for.',
   p:'Writing is the product people see. The paycheck comes from what you ask them to do next. With no clear next step, even a loyal reader has nothing to say yes to.'},

  {t:'part',kick:'Part two',alt:true,h:'The 9-to-Thrive Method',
   p:'An ordered build. Each stage has to be in place before the next one pays off. This is the backbone of everything that follows.'},

  {t:'steps',kick:'The four stages',h:'Setup, then growth, then offer, then streams.',
   steps:[
     {s:'01',h:'Setup',p:'Your About page, welcome sequence and homepage doing the quiet selling.'},
     {s:'02',h:'Growth',p:'Substack Notes as the free engine that brings readers who have never heard of you.'},
     {s:'03',h:'First offer',p:'One paid product launched to the readers you already have.'},
     {s:'04',h:'Multiple streams',p:'Layer the next paycheck only once the first one runs on its own.'}
   ]},

  {t:'stage',kick:'Stage one',h:'Setup: make the room sell before you do.',
   p:'Most creators skip this and wonder why warm readers never convert. Your About page, your welcome sequence and your homepage are either compounding trust every day or leaking it. We set them once.'},

  {t:'stage',kick:'Stage two',alt:true,h:'Growth: the Notes-to-Subscribers System.',
   p:'Notes drove about 60% of my own subscriber growth. It is a system, not luck: a handful of Note formats, a posting cadence, and a clear path from a cold reader who liked one Note to a subscriber who opens every email.'},

  {t:'stage',kick:'Stage three',h:'First offer: ask for one yes.',
   p:'You do not need a product suite. You need one paid offer your existing readers actually want, priced like it is worth something instead of defaulting to the platform minimum.'},

  {t:'stage',kick:'Stage four',alt:true,h:'Multiple streams: stack, do not scatter.',
   p:'Only after the first paycheck runs on its own do you add the next. Add them in the wrong order and you end up with five half-built things. Add them in order and each one funds the next.'},

  {t:'portfolio',kick:'The portfolio of paychecks',h:'One publication. Five kinds of paycheck.',
   p:'This is the whole idea in one picture. From a single newsletter, you can build a portfolio that compounds.',
   bars:[
     {l:'Paid subscriptions',tag:'RECURRING'},
     {l:'Digital products',tag:'LEVERAGE'},
     {l:'Community',tag:'RETENTION'},
     {l:'Services',tag:'HIGH TRUST'},
     {l:'Software and AI tools',tag:'SCALE'}
   ]},

  {t:'order',kick:'The order matters',alt:true,h:'Build once, sell forever.',
   p:'Each paycheck is built one time and then sells on repeat. The portfolio is not more work stacked on more work. It is the same audience, monetized more than one way, so a slow month in one stream is covered by another.'},

  {t:'part',kick:'Part three',h:'A small list, finally earning its keep.',
   p:'Not a hustle and not a hope. A small, loyal readership turned into real income because the offer, the order and the engine are all finally in place.'},

  {t:'engine',kick:'The discovery engine',alt:true,h:'Small can out-earn big.',
   p:'I grew 9-to-Thrive from 11 subscribers to more than 5,800 in six months, and to a six-figure business, without a huge list. The subscriber-lean creator wins when positioning, offer and the Notes engine do the heavy lifting.'},

  {t:'why',kick:'Why listen to me',h:'I built this on my own newsletter first.',
   p:'I am a Substack bestseller with 12,500+ subscribers on 9-to-Thrive. Everything in this session is what I actually did and what I now walk creators through one on one. No theory borrowed from another platform.',
   by:'<b>Carrie Loranger</b>, 9-to-Thrive'},

  {t:'forwho',kick:'Who this works for',alt:true,h:'Writers who are done guessing.',
   p:'If you have a newsletter and the nagging sense that it should be earning more than it is, this is the ordered path. You do not need to be big. You need the method.'},

  {t:'recap',kick:'The recap',h:'The whole method in one breath.',
   ul:['Growth and income are two different problems. Fix income first.',
       'Run the 9-to-Thrive Method in order: setup, growth, first offer, multiple streams.',
       'Use Notes as the free discovery engine.',
       'Build a portfolio of paychecks from one publication so it compounds.']},

  {t:'cta',kick:'Your next step',h:'Let us build your portfolio together.',
   p:'If you want help putting this in place on your own Substack, the next step is to apply for 1:1 coaching or join the 9-to-Thrive Academy. We will map your offer, build it, and set the method running.',
   cta:'Apply for 1:1 coaching or join the 9-to-Thrive Academy at carrieloranger.com',
   disc:'Educational only. This masterclass teaches a method and shares one creator’s own results. It is not a promise or guarantee of income. Your results will vary and depend on your work, your audience and your market.'}
];

const wrap=document.getElementById('wrap');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.alt?' alt':'');
  let html='<span class="n">'+(i+1)+' / '+S.length+'</span>';
  if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='title'){html+='<h1>'+s.h+'</h1>';}
  else {html+='<h2>'+s.h+'</h2>';}
  if(s.p) html+='<p class="'+(s.t==='title'?'lead':'')+'">'+s.p+'</p>';
  if(s.steps){html+='<div class="steps">';s.steps.forEach(x=>{html+='<div class="step"><div class="s">'+x.s+'</div><h3>'+x.h+'</h3><p>'+x.p+'</p></div>';});html+='</div>';}
  if(s.bars){html+='<div class="stack">';s.bars.forEach((b,k)=>{html+='<div class="bar f'+(k+1)+'"><span>'+b.l+'</span><span class="tag">'+b.tag+'</span></div>';});html+='</div>';}
  if(s.ul){html+='<ul>';s.ul.forEach(x=>{html+='<li>'+x+'</li>';});html+='</ul>';}
  if(s.cta) html+='<div class="cta-line">'+s.cta+'</div>';
  if(s.by) html+='<div class="by">'+s.by+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  d.innerHTML=html;
  wrap.appendChild(d);
});
</script>
</body>
</html>
