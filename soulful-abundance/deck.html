<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nature-Inspired Abundance - Price Your Soul-Led Work Without Fear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7fc;
    --panel:#f4eff9;
    --rule:#d8cfe6;
    --accent:#5a4693;
    --highlight:#bd156d;
    --ink:#2a2140;
    --sand:#d1ccbd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Montserrat',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }
  #stage{width:min(960px,94vw);aspect-ratio:16/10;background:var(--panel);
    border:1px solid var(--rule);border-radius:18px;position:relative;
    box-shadow:0 24px 60px rgba(90,70,147,.12);overflow:hidden}
  .slide{position:absolute;inset:0;padding:7% 8%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(30px,5vw,56px);line-height:1.08;color:var(--accent)}
  h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(26px,4vw,42px);line-height:1.12;color:var(--ink);margin-bottom:14px}
  p{font-size:clamp(15px,1.7vw,20px);line-height:1.55;max-width:46ch;color:var(--ink)}
  p.lead{font-size:clamp(17px,2vw,23px);color:var(--ink)}
  .big{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(24px,3.4vw,38px);color:var(--highlight);line-height:1.2;max-width:24ch}
  ul{margin-top:18px;list-style:none}
  li{font-size:clamp(15px,1.7vw,20px);line-height:1.5;padding:9px 0 9px 26px;position:relative;max-width:48ch}
  li:before{content:"";position:absolute;left:0;top:17px;width:10px;height:10px;border-radius:50%;background:var(--highlight)}
  .num{font-family:'Cormorant Garamond',serif;color:var(--accent);font-weight:600}
  .foot{position:absolute;left:8%;bottom:5%;font-size:12px;letter-spacing:.1em;color:var(--accent);opacity:.7;text-transform:uppercase}
  .disc{font-size:12.5px;line-height:1.5;color:var(--ink);opacity:.8;max-width:60ch;margin-top:18px}
  .cta-line{font-size:clamp(16px,1.9vw,22px);font-weight:600;color:var(--accent);margin-top:10px}
  #nav{position:fixed;bottom:18px;right:22px;font-size:13px;color:var(--accent);font-weight:600}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rule);margin-left:5px}
  .dot.on{background:var(--highlight)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title', ey:'A free live masterclass with Kristin Hadley', h:"Nature-Inspired Abundance", b:"Price your soul-led work the way nature intends. Without fear, without guilt, and without pretending abundance is not for you."},
 {t:'promise', h:"By the end of this hour", b:"You will know the exact mindset pattern that is keeping your prices low, and the first move that changes it. This is the inner work almost every business course skips."},
 {t:'who', ey:'Who this is for', h:"The heart-centered woman entrepreneur", b:"You are a coach, healer, intuitive, or practitioner. You are genuinely good at what you do. And every time you set a price, something in you flinches."},
 {t:'trap', ey:'The trap', h:"You believe charging more makes you less soulful", b:"So you keep your prices small, you over-deliver, and you quietly resent it. You call it generosity. Often it is fear wearing a kinder name."},
 {t:'reframe', big:"Nature never apologizes for abundance. The orchard does not undercharge for its fruit."},
 {t:'problem', ey:'The real problem', h:"Business knowledge is not your bottleneck", b:"I spent 30 years as an animal communicator and teacher before I understood this: all the strategy in the world will not work if your relationship with money is not healthy. Price is a mindset before it is a number."},
 {t:'cost', ey:'What it costs you', h:"Underpricing is not humble", b:"It shrinks the help you can give. Fuller prices buy you the time, energy, and resources to serve more animals, more people, more of the mission you are actually here for."},
 {t:'part2', ey:'Part two', h:"The four pricing mindset hurdles", b:"Almost everyone who undercharges is caught on at least one of these four. Notice which one is yours."},
 {t:'hurdle1', ey:'Hurdle one', h:"Hiding in your business", b:"If you are not making offers or talking about what you do, you are hiding in plain sight. All of your experience, formal and lived, counts toward your price."},
 {t:'hurdle2', ey:'Hurdle two', h:"Seeking the perfect price", b:"There is no single right number waiting to be discovered. Trust your own instinct instead of copying the feed, and you start to own your unique value."},
 {t:'hurdle3', ey:'Hurdle three', h:"Believing prices are permanent", b:"The price you set today is not forever. Start at a number you can say out loud without flinching, watch the outcomes your clients get, and adjust from there."},
 {t:'hurdle4', ey:'Hurdle four', h:"Undervaluing work you love", b:"Because it comes easily to you, you assume it should be cheap or free. It is easy for you because you are skilled. Your clients pay precisely because it is not easy for them."},
 {t:'shift', ey:'The shift', h:'From "I have to" to "I get to"', b:"Pricing stops being a threat and becomes a decision you make on purpose. That is the whole move. Everything after it gets easier."},
 {t:'nature', ey:'The nature law', h:"Abundance is the natural state", b:"The tide returns. The seasons give and rest and give again. When you price from that truth instead of from scarcity, your work can finally sustain the life it is meant to support."},
 {t:'selling', ey:'Selling without the ick', h:"Get curious, not pushy", b:"The enrollment conversation is not a performance. Get curious about what she is struggling with and what she wants instead. You both choose. Easy, balanced, respectful."},
 {t:'look', ey:'On the other side of the flinch', h:"A price you can say without flinching", b:"Offers made in the open. Sales conversations that feel like service. A business that funds your mission instead of quietly draining it."},
 {t:'story', ey:'Why me', h:"I had to learn this myself", b:"Speech-language pathologist, then 30 years teaching interspecies trust, then watching my own graduates stall the moment money entered the room. Healing my money mindset is what finally let the work pay."},
 {t:'begin', ey:'Where to start', h:"One honest price this week", b:"Pick one offer. Set the number that matches the value, not the one that matches your fear. Say it out loud three times before you say it to a client."},
 {t:'invite', ey:'If you want to go deeper', h:"Keep going with me", b:"Inside my coaching I walk women entrepreneurs through this work step by step, until pricing, selling, and abundance feel like home instead of a fight."},
 {t:'cta', ey:'Your next step', h:"Let's build your soulful abundance", b:"If this stirred something, come work with me. Bring one offer you have been underpricing and we will set it right together.", cta:"Reach out to Kristin at kristinhadley.com", disc:"This masterclass is educational. No specific income or business result is guaranteed. Results vary and depend on your own effort, offer, and market."}
];
const stage=document.getElementById('stage');
const nav=document.getElementById('nav');
let i=0;
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  stage.innerHTML='';
  S.forEach((s,k)=>{
    const d=document.createElement('div');
    d.className='slide'+(k===i?' on':'');
    let html='';
    if(s.ey) html+='<div class="eyebrow">'+esc(s.ey)+'</div>';
    if(s.t==='title'){ html+='<h1>'+esc(s.h)+'</h1>'; if(s.b) html+='<p class="lead" style="margin-top:20px">'+esc(s.b)+'</p>'; }
    else if(s.big){ html+='<div class="big">'+esc(s.big)+'</div>'; }
    else { if(s.h) html+='<h2>'+esc(s.h)+'</h2>'; if(s.b) html+='<p>'+esc(s.b)+'</p>'; }
    if(s.cta) html+='<div class="cta-line">'+esc(s.cta)+'</div>';
    if(s.disc) html+='<div class="disc">'+esc(s.disc)+'</div>';
    html+='<div class="foot">Soulful Abundance</div>';
    d.innerHTML=html;
    stage.appendChild(d);
  });
  let dots='';S.forEach((s,k)=>dots+='<span class="dot'+(k===i?' on':'')+'"></span>');
  nav.innerHTML=(i+1)+' / '+S.length+' '+dots;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render()}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') go(i+1);
  if(e.key==='ArrowLeft') go(i-1);
});
stage.addEventListener('click',()=>go(i+1));
render();
</script>
</body>
</html>
