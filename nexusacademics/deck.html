<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Circuit Logic Masterclass | Triple Review by Nexus Academics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f8fb;
    --panel:#ffffff;
    --dark:#0e2233;
    --accent:#1470af;
    --ink:#12222e;
    --ink-soft:#3f5566;
    --muted:#8aa0b0;
    --rule:#dbe6ef;
  }
  html,body{height:100%}
  body{background:var(--dark);font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:8.5vh 9vw;opacity:0;transition:opacity .5s ease;pointer-events:none;background:var(--bg)}
  .slide.active{opacity:1;pointer-events:auto}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin-bottom:3.2vh}
  h1{font-family:'Poppins',sans-serif;font-weight:600;font-size:4.2vw;line-height:1.12;
    letter-spacing:-.015em;color:var(--ink);max-width:21ch}
  .sub{font-family:'Inter',sans-serif;font-weight:500;font-size:1.68vw;line-height:1.5;
    color:var(--ink-soft);margin-top:3.4vh;max-width:34ch}
  .body{font-family:'Inter',sans-serif;font-weight:400;font-size:1.52vw;line-height:1.62;
    color:var(--ink-soft);margin-top:3.4vh;max-width:41ch}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.12vw;font-weight:600;letter-spacing:.02em;
    color:var(--accent);margin-top:5vh}
  .brandline b{font-weight:700}
  /* section slides */
  .t-section{background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.12vw;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  .t-section h1{font-size:5vw}
  .t-section .rule{width:8.5vw;height:4px;background:var(--accent);border-radius:3px;margin-top:4vh}
  /* dark reframe slides */
  .t-dark{background:var(--dark)}
  .t-dark h1{color:#eaf3fb;font-weight:600;font-size:3.9vw;max-width:24ch}
  .t-dark .kicker{color:#6db4e6}
  /* cta */
  .t-cta{background:var(--panel)}
  .chips{display:flex;gap:1.4vw;margin-top:4.6vh;flex-wrap:wrap}
  .chip{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.28vw;color:#fff;background:var(--accent);
    border-radius:100px;padding:1.5vh 2.2vw}
  .disc{font-family:'Inter',sans-serif;font-size:.94vw;line-height:1.5;color:var(--muted);
    margin-top:6vh;max-width:54ch}
  /* circuit motif */
  .circuit{position:absolute;right:7vw;bottom:8vh;width:17vw;height:9vw;opacity:.9}
  .t-title .circuit{right:8vw;bottom:10vh;width:23vw;height:12vw;opacity:1}
  .t-dark .circuit path{stroke:#6db4e6}
  .t-dark .circuit circle{fill:#6db4e6}
  /* chrome */
  #hud{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:18px;
    padding:16px 26px;z-index:20;pointer-events:none}
  #track{flex:1;height:3px;background:rgba(18,34,46,.12);border-radius:3px;overflow:hidden}
  #bar{height:100%;width:0;background:var(--accent);transition:width .5s ease}
  #count{font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
  .nav{position:fixed;top:0;height:100vh;width:14vw;z-index:15;cursor:pointer;background:transparent;border:0}
  #prev{left:0}#next{right:0}
  #hint{position:fixed;right:26px;bottom:34px;font-family:'Poppins',sans-serif;font-size:12px;
    letter-spacing:.08em;color:var(--muted);z-index:20;transition:opacity .4s}
  @media(max-width:760px){h1{font-size:7.2vw}.sub,.body{font-size:3.4vw}.kicker{font-size:2.6vw}
    .t-section h1{font-size:8.4vw}.chip{font-size:3vw}.disc{font-size:2.4vw}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="circuit" viewBox="0 0 260 130">
  <path d="M40 104 H120" fill="none" stroke="#1470af" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M40 60 H120" fill="none" stroke="#1470af" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M120 104 V60" fill="none" stroke="#1470af" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M120 82 H210" fill="none" stroke="#1470af" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="40" cy="104" r="6" fill="#1470af"/>
  <circle cx="40" cy="60" r="6" fill="#1470af"/>
  <circle cx="120" cy="104" r="5" fill="#1470af"/>
  <circle cx="120" cy="60" r="5" fill="#1470af"/>
  <circle cx="210" cy="82" r="8" fill="#1470af"/>
</symbol></svg>
<div id="deck"></div>
<div id="hud"><div id="track"><div id="bar"></div></div><div id="count">01 / 20</div></div>
<button id="prev" class="nav" aria-label="Previous"></button>
<button id="next" class="nav" aria-label="Next"></button>
<div id="hint">Use arrow keys</div>
<script>
const S=[
 {t:'title',title:'You can learn to see an LSAT argument.',sub:'Circuit Logic, the visual method for Logical Reasoning, from Triple Review by Nexus Academics.',brand:true,climb:true},

 {t:'normal',k:'Who this is for',title:'For the applicant stuck in the mid-160s.',body:'You know the rules. You have done the drills. But Logical Reasoning still comes down to a gut read between the last two answers, and under time the gut read is where the points quietly leak.'},
 {t:'dark',title:'The problem was never how hard you worked. It is that the argument stays invisible.'},

 {t:'section',idx:'Part One',title:'Why Logical Reasoning Plateaus'},
 {t:'normal',k:'The trap',title:'More questions rehearse the same blind spot.',body:'Volume without a way to see the structure just repeats the same near-miss faster. You keep choosing the trap answer because on the page it looks almost exactly like the right one.'},
 {t:'normal',k:'The real cost',title:'Read only in words, and the logic stays hidden.',body:'When an argument lives as sentences, the conclusion, the support, and the gap between them all blur together. The test is built to hide that gap in ordinary language, and words alone let it stay hidden.'},
 {t:'dark',title:'If you cannot see the argument, you cannot find the flaw. And the flaw is the whole question.'},

 {t:'section',idx:'Part Two',title:'The Circuit'},
 {t:'normal',k:'The core move',title:'Start by finding the conclusion.',body:'Every circuit begins the same way. Find the conclusion first, then organize the rest of the argument around it. Once the claim is fixed in place, the support and the assumptions finally have somewhere to attach.'},
 {t:'normal',k:'Draw the argument',title:'Turn the argument into a diagram.',body:'A circuit maps the premises, the conclusion, and the link between them as connected nodes. Deductive arguments and causal arguments each get their own shape, so the structure you used to only feel becomes something you can point at.'},
 {t:'normal',k:'See the gap',title:'The assumption is the missing wire.',body:'Once the argument is a circuit, the flaw stops being a trick. The gap is the connection the author never drew, and the credited answer is almost always the one that names that missing wire or fills it in.'},
 {t:'normal',k:'Review, not race',title:'Draw all the circuits in your review.',body:'This is the Triple Review method. You draw circuits slowly and deliberately with the clock off, analyzing why each choice holds or fails, spaced out over time. The shapes become automatic, so on test day you save the mental effort for the questions that need it.'},
 {t:'dark',title:'Draw enough circuits in review, and on the timed section you barely have to draw them at all.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'Guessing becomes choosing',title:'The two-answer standoff disappears.',body:'When you can see the gap, the standoff between the last two answers mostly resolves itself. One answer speaks to the missing wire and the other does not, and you can say exactly why, on every question, under time.'},
 {t:'normal',k:'Why this method',title:'Two decades of teaching, built into one system.',body:'Circuit Logic is the method Jacob Feldman developed over more than twenty years of LSAT teaching at Nexus Academics, distilled from thousands of students into a curriculum of circuits and a review system that any motivated student can learn.'},
 {t:'dark',title:'The score does not move because you tried harder. It moves because you can finally see.'},

 {t:'section',idx:'Your next step',title:'Start Drawing Circuits'},
 {t:'normal',k:'How to begin',title:'The curriculum and the circuits are open to you.',body:'The Circuit Logic curriculum, and a library of free circuits drawn over real official tests, are there to work through today. When you want the method built around your own diagnostic and your target score, that is what a one-on-one plan is for.'},
 {t:'cta',title:'Ready to see the argument?',chips:['Book a consultation with Nexus Academics','Start the free Circuit Logic curriculum'],disc:'Educational content for LSAT students and law school applicants. No score or admissions result is guaranteed. Results vary by student, starting point, and effort.'},
];

const deck=document.getElementById('deck');
function circuit(){return '<svg class="circuit"><use href="#circuit"/></svg>'}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Triple Review <b>by Nexus Academics</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.climb||s.t==='title') h+=circuit();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
