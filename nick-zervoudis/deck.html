<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Value-Driven Data Professional — a masterclass with Nick Zervoudis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfe;        /* near-white ground, from brand #eef2ff tint */
    --ink:#030138;       /* brand navy, 114 uses */
    --muted:#4b4d6d;     /* brand slate */
    --panel:#eef2ff;     /* harvested indigo tint */
    --rule:#d9e1ff;      /* harvested periwinkle */
    --accent:#0000ee;    /* harvested brand link blue */
    --display:'Fraunces',Georgia,serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e9ebf4;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 18px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(3,1,56,.03),0 18px 40px -30px rgba(3,1,56,.4);
  }
  .slide.dark{background:var(--ink);color:#eef2ff;border-color:var(--ink)}
  .slide.dark .k{color:#aeb6ff}
  .slide.dark .sub{color:#c7cdf4}
  .slide.dark .num{color:#6f74c9}
  .k{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.14em;
     text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:600;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-.01em}
  .sub{font-size:20px;line-height:1.5;color:var(--muted);margin-top:20px;max-width:46ch}
  .big{font-family:var(--display);font-size:72px;line-height:1;font-weight:700}
  .big .accent{color:var(--accent)}
  .num{font-family:var(--display);font-size:20px;color:var(--rule);margin-bottom:14px;font-weight:600}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.5;max-width:52ch}
  li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;
     border:2px solid var(--accent);border-radius:3px}
  .panel{background:var(--panel);border-radius:12px;padding:26px 30px;margin-top:26px}
  .panel.dark{background:rgba(255,255,255,.06)}
  .foot{position:absolute;left:56px;bottom:26px;font-size:12px;letter-spacing:.08em;
     text-transform:uppercase;color:var(--muted);font-weight:600}
  .quote{font-family:var(--display);font-size:30px;line-height:1.25;font-weight:500;max-width:30ch}
  .cite{margin-top:18px;font-size:15px;color:var(--muted);font-weight:600}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:28px;max-width:60ch}
  .cta-line{font-size:22px;margin-top:22px;font-weight:600;color:var(--accent)}
  .row{display:flex;gap:16px;flex-wrap:wrap;margin-top:26px}
  .chip{background:var(--panel);border:1px solid var(--rule);border-radius:999px;
     padding:8px 16px;font-size:14px;font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'dark', k:'A live masterclass with Nick Zervoudis', h:`The Value-Driven Data Professional`, sub:`How to prove the commercial value of your data and AI work, in the only language leadership hears: money.`},

  {t:'who', k:'Who this is for', h:`If you build the work but struggle to show what it is worth`, list:[`Data scientists, engineers and analysts who are tired of being order-takers`,`Data and AI product managers who need buy-in and budget`,`Consultants who want to sell bigger projects and prove their impact`,`Data leaders defending their team's value to the C-suite`]},

  {t:'trap', k:'The trap', h:`You have mastered every algorithm. You still watch less-technical colleagues advance faster.`, sub:`You built the pipeline, shipped the model, cleared the backlog. And the recognition, the budget and the promotion went to the person who could explain why any of it mattered.`},

  {t:'reframe', cls:'dark', k:'The uncomfortable truth', big:true, html:`Nobody gets promoted for <span class="accent">what they built</span>. They get promoted for <span class="accent">what it was worth</span>.`, sub:`This is not about abandoning technical excellence. It is about adding the layer that multiplies it.`},

  {t:'part', num:'Part One', h:`The real problem is not your skill. It is the story.`, sub:`Most data work is delivered as output, a dashboard, a model, a pipeline. The business buys outcomes: money made, money saved, risk avoided, decisions changed. When nobody translates one into the other, good work stays invisible.`},

  {t:'problem', k:'The order-taker loop', h:`Why the ad-hoc request trap keeps you stuck`, list:[`A stakeholder asks for a dashboard. You build the dashboard.`,`Nobody asks what decision it will change, so it changes none.`,`The work ships, the value is never named, and the next request arrives.`,`You stay busy, essential, and overlooked.`]},

  {t:'part', num:'Part Two', h:`The method: five moves from order-taker to strategic partner`, sub:`These are the frameworks I have built and refined the hard way over a decade across retail, FMCG, banking, telecoms and government.`},

  {t:'fw', num:'Move 1', k:'Value and ROI Estimation', h:`Put a number on the work before a line of code`, list:[`Identify the value buckets a piece of work can move`,`Estimate direct and indirect benefit in money terms`,`Use Fermi estimation when the data is incomplete, instead of giving up on a number`]},

  {t:'fw', num:'Move 2', k:'Opportunity Discovery', h:`Get past the request to the decision`, list:[`Ask what decision the work would actually change`,`Uncover the real problem behind "just build me a dashboard"`,`Involve the end users early so you never build something nobody uses`]},

  {t:'fw', num:'Move 3', k:'Advanced Valuation', h:`Build a business case finance will trust`, list:[`Model growth scenarios and handle uncertainty honestly`,`Use a deliberately-draft business case to pull better inputs from stakeholders`,`Speak in the structure a CFO already thinks in`]},

  {t:'fw', num:'Move 4', k:'Value-Driven Prioritisation', h:`Make your priorities survive the business`, list:[`Compare value, cost, risk and your confidence in the estimate on one matrix`,`Redirect low-value requests without burning the relationship`,`Explain the trade-offs so decision-makers back your call`]},

  {t:'fw', num:'Move 5', k:'Presenting to Business', h:`Lead with the outcome, not the method`, list:[`Structure the recommendation with the Pyramid Principle`,`Open with the money and the decision, keep the methodology in the appendix`,`Claim your fair share of the credit with the right heuristics`]},

  {t:'signature', cls:'dark', k:'The through-line', h:`The Estimated Data Value framework`, sub:`Every move above feeds one defensible money figure you can put next to a piece of work, before you build it and after you ship it. That number is what gets projects funded and people promoted.`},

  {t:'part', num:'Part Three', h:`What a quarterly review looks like once you lead with value`, list:[`You walk into the quarterly review with a figure, not a status update`,`Proposals with no budget get fast-tracked because the value is already shown`,`You de-scope work a market will not use, and avoid the cost of building it`,`Your team is seen as a profit driver, not a cost centre`]},

  {t:'proof', k:'In practice', quote:`After the training I started challenging assumptions. In one case that led to de-scoping features a market was not going to use, avoiding 200,000 dollars in unnecessary delivery.`, cite:`Senior Data Product Manager, Fortune 50 client`},

  {t:'whyme', k:'Why me', h:`Nick Zervoudis`, sub:`Ten-plus years as a data product manager and consultant. Former Head of Product at CKDelta. Data PM and consultant for PepsiCo, Capgemini Invent, IKEA, Sainsbury's and Lloyds Banking Group. I have helped create tens of millions of dollars in value for dozens of companies, and I run the Data and AI Product Management community in London, Barcelona and Paris.`, chips:['PepsiCo','IKEA','Sainsbury’s','Lloyds Banking Group','Capgemini Invent']},

  {t:'recap', k:'The shift', h:`Stop hoping your work speaks for itself`, list:[`Estimate the value before you build`,`Discover the decision behind the request`,`Prioritise on value, risk and confidence`,`Present the outcome in the language of money`]},

  {t:'cta', cls:'dark', k:'Your next step', h:`Learn the full method with me`, cta:`Book a free discovery call, or join the Value-Driven Data Professional program at valuefromdata.ai`, disc:`Educational content only. This masterclass teaches frameworks and judgment, not a promise of any specific financial outcome. No income, role, promotion, or result is guaranteed. Results vary with your situation, effort and context.`}
];

const deck = document.getElementById('deck');
function esc(x){return x||''}
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.cls?(' '+s.cls):'');
  let h='';
  if(s.num) h+=`<div class="num">${esc(s.num)}</div>`;
  if(s.k) h+=`<div class="k">${esc(s.k)}</div>`;
  if(s.big && s.html){ h+=`<div class="big">${s.html}</div>`; }
  else if(s.h){ h+= (s.t==='title'?`<h1>${esc(s.h)}</h1>`:`<h2>${esc(s.h)}</h2>`); }
  if(s.quote){ h+=`<p class="quote">${esc(s.quote)}</p>`; }
  if(s.cite){ h+=`<p class="cite">${esc(s.cite)}</p>`; }
  if(s.sub){ h+=`<p class="sub">${esc(s.sub)}</p>`; }
  if(s.list){ h+='<ul>'+s.list.map(i=>`<li>${esc(i)}</li>`).join('')+'</ul>'; }
  if(s.chips){ h+='<div class="row">'+s.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')+'</div>'; }
  if(s.cta){ h+=`<p class="cta-line">${esc(s.cta)}</p>`; }
  if(s.disc){ h+=`<p class="disc">${esc(s.disc)}</p>`; }
  h+=`<div class="foot">Value from Data &amp; AI</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
