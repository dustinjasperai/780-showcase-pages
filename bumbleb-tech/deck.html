<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The High-Tech Innovation Blueprint — a live masterclass by Lydie Smets, bumbleb.tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7EC;        /* honey-cream ground (light deck, brand-derived) */
    --panel:#F2ECDD;     /* warm panel */
    --ink:#211F1A;       /* charcoal ink */
    --rule:#D8CDB4;      /* hairline */
    --accent:#E8A72B;    /* amber / honey (bumblebee identity) */
    --muted:#6B6456;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--rule);font-family:"Spectral",Georgia,serif;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 16px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:56px 56px 52px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;top:18px;right:18px;width:22px;height:22px;background:
    linear-gradient(135deg,transparent 46%,var(--accent) 46%,var(--accent) 54%,transparent 54%);opacity:.55}
  .eyebrow{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin:16px 0 14px}
  h2{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:32px;line-height:1.12;margin:10px 0 16px}
  .part{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  p{font-size:20px;margin:0 0 14px;max-width:62ch}
  p.lead{font-size:23px}
  .big{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:38px;line-height:1.14;letter-spacing:-.01em;max-width:22ch}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;padding:12px 0 12px 34px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;background:var(--accent);
    clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  .pill{display:inline-block;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;margin:0 8px 8px 0}
  .present{font-family:"Space Grotesk",sans-serif;font-size:16px;color:var(--muted);margin-top:26px}
  .foot{font-family:"Space Grotesk",sans-serif;font-size:12px;color:var(--muted);position:absolute;left:56px;bottom:20px;letter-spacing:.04em}
  .num{position:absolute;right:56px;bottom:20px;font-family:"Space Grotesk",sans-serif;font-size:12px;color:var(--muted)}
  .cta .big{color:var(--ink)}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:60ch;font-style:italic}
  .panelbox{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:22px 26px;margin-top:8px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass',h1:'The High-Tech Innovation Blueprint',lead:'Turning proven technology into a product the market actually buys.',present:'Presented live by Lydie Smets, PhD · bumbleb.tech'},
 {t:'who',eyebrow:'Who this is for',h2:'You have technology that works. You do not yet have a product that lands.',p:'This session is for high-tech and deep-tech teams in semiconductors, photonics, quantum, 3D printing and agritech who have proven a technology and now have to get it to market.'},
 {t:'trap',eyebrow:'The trap',h2:'You proved the technology, and assumed the product would follow.',p:'So the roadmap becomes a wish list, partners drift, risks get parked for later, and the window you were racing for quietly closes.'},
 {t:'hook',eyebrow:'The reframe',big:'Proven technology is not a product. Most deep-tech dies in the gap between the two.',p:'The gap is not a technology problem. It is an innovation-process problem, and it is the one thing almost no team is actually managing.'},
 {t:'part',part:'Part One',h2:'The lab-to-market gap'},
 {t:'body',eyebrow:'Why it stays open',h2:'Deep-tech breaks the normal rules of product development.',p:'Long horizons, many partners, hard science, and real physical risk. The usual product playbooks assume none of that, so they fail quietly right where it matters most.'},
 {t:'list',eyebrow:'Where teams stall',h2:'The four places the gap opens.',items:['The process is improvised, so progress is not repeatable','Collaboration is assumed, never designed','Risk and issues surface far too late to absorb','Program and project management is treated as paperwork, not the engine']},
 {t:'part',part:'Part Two',h2:'The blueprint'},
 {t:'body',eyebrow:'The idea',h2:'A blueprint, not a wish list.',p:'The blueprint turns the lab-to-market gap into a managed path. Three pillars, run together, that take a proven technology to a product people buy.'},
 {t:'list',eyebrow:'Pillar one',h2:'The high-tech innovation process',items:['A staged path from a working result to a marketable product','Clear decisions about what is proven, what is assumed, and what is next','A process a team can repeat, not reinvent every program']},
 {t:'list',eyebrow:'Pillar two',h2:'Collaborative development: the why and how',items:['Hard technology reaches market through partners, not in isolation','Collaboration designed on purpose, with roles and ownership named','The why and the how, so partners pull in the same direction']},
 {t:'list',eyebrow:'Pillar three',h2:'Program and risk management that ships',items:['Risk and issue management that works in practice, early, not at the end','Program and project management as the engine that holds the plan together','Windows hit because the plan is managed, not hoped for']},
 {t:'body',eyebrow:'How they fit',h2:'Run together, the three pillars close the gap.',p:'The process gives you a repeatable path. Collaborative development gives you the partners to walk it. Program and risk management keeps you on it. Drop any one and the gap reopens.'},
 {t:'part',part:'Part Three',h2:'When your team runs the blueprint'},
 {t:'body',eyebrow:'A team running the blueprint',h2:'The work stops feeling like luck.',p:'Roadmaps are realistic and shared. Partners know their part. Risks are named and owned while there is still time to act. The product reaches the market the technology earned.'},
 {t:'why',eyebrow:'Why learn it here',h2:'Built from the deep-tech trenches, not a textbook.',p:'Lydie Smets holds a PhD in collaborative product innovation management and has spent over a decade in high-tech program and project management across semiconductors, 3D printing, photonics, quantum and agritech, including as a programme director on the national PhotonDelta plan.'},
 {t:'recap',eyebrow:'In one line',big:'Close the gap on purpose: process, collaboration, and managed risk, run as one blueprint.'},
 {t:'cta',eyebrow:'Your next step',big:'Start inside bumbleb.tech, then go deeper.',p:'Join the bumbleb.tech community and work the blueprint with your own program, then take it further with the B2B acceleration packs. Begin free at bumbleb.tech.',disc:'This masterclass is educational. No business, revenue, funding, or outcome is guaranteed; results depend on your own technology, team, and market.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
 const d=document.createElement('section');
 d.className='slide '+(s.t==='cta'?'cta':'');
 let h='';
 if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
 if(s.part) h+='<div class="part">'+s.part+'</div>';
 if(s.h1) h+='<h1>'+s.h1+'</h1>';
 if(s.h2) h+='<h2>'+s.h2+'</h2>';
 if(s.big) h+='<div class="big">'+s.big+'</div>';
 if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
 if(s.p) h+='<p>'+s.p+'</p>';
 if(s.items){h+='<ul>';s.items.forEach(it=>h+='<li>'+it+'</li>');h+='</ul>';}
 if(s.present) h+='<div class="present">'+s.present+'</div>';
 if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
 h+='<div class="foot">bumbleb.tech</div><div class="num">'+(i+1)+' / '+S.length+'</div>';
 d.innerHTML=h;
 deck.appendChild(d);
});
</script>
</body>
</html>
