<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People-Powered Value Creation, a Masterclass for PE-Backed Leaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d2136;        /* deep navy ground (brand.json evidence) */
    --panel:#003152;     /* his dominant navy, 80 uses */
    --accent:#f5c76a;    /* his warm gold, 24 uses */
    --ink:#f8fafb;
    --muted:#a9bcd0;
    --rule:rgba(245,199,106,.35);
    --head:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;
    --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#060f1a;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid rgba(245,199,106,.14);
    border-radius:14px;padding:56px 56px;margin:0 0 22px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:var(--head);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:900;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:800;font-size:38px;line-height:1.08;letter-spacing:-.01em}
  .sub{font-size:21px;color:var(--muted);margin-top:20px;line-height:1.45;max-width:46ch}
  p.lead{font-size:20px;line-height:1.55;margin-top:18px;max-width:52ch;color:#e4edf6}
  .kicker{font-family:var(--head);font-weight:700;color:var(--accent);font-size:15px;margin-bottom:10px;letter-spacing:.04em}
  .num{font-family:var(--head);font-weight:900;font-size:120px;color:var(--panel);line-height:.8;
    position:absolute;right:40px;top:28px;opacity:.9}
  ul.pts{margin-top:26px;list-style:none;display:flex;flex-direction:column;gap:16px;max-width:60ch}
  ul.pts li{font-size:19px;line-height:1.4;padding-left:26px;position:relative;color:#e4edf6}
  ul.pts li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .layers{display:flex;flex-direction:column;gap:14px;margin-top:28px}
  .layer{background:var(--panel);border-left:4px solid var(--accent);border-radius:8px;padding:18px 22px}
  .layer .l-t{font-family:var(--head);font-weight:800;font-size:20px;color:var(--ink)}
  .layer .l-d{font-size:16px;color:var(--muted);margin-top:4px}
  .quote{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.18;max-width:20ch}
  .cred{display:flex;flex-direction:column;gap:14px;margin-top:24px;max-width:58ch}
  .cred div{font-size:18px;color:#e4edf6;padding-left:26px;position:relative}
  .cred div::before{content:"";position:absolute;left:0;top:9px;width:10px;height:10px;background:var(--accent);border-radius:50%}
  .cta h2{font-size:44px}
  .brandmark{font-family:var(--head);font-weight:700;color:var(--muted);letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;margin-top:40px}
  .disc{font-size:13px;color:#7f93a8;margin-top:26px;max-width:62ch;line-height:1.5}
  .pagefoot{font-family:var(--head);font-size:12px;color:#5f7389;position:absolute;bottom:18px;right:28px;letter-spacing:.08em}
  @media(max-width:620px){.slide{padding:36px 26px;min-height:440px}h1{font-size:36px}h2{font-size:28px}.num{font-size:80px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   eyebrow:'A Live Masterclass for PE-Backed Leaders',
   h1:'People-Powered Value Creation',
   sub:'How leaders inside private equity portfolio companies turn their teams into the engine of multiple expansion.',
   brand:'Presented by Dan Cremons'},

  {t:'content',eyebrow:'Who this is for',
   h2:'You are a VP or C-level leader in a PE-backed company.',
   lead:'Your investors expect value creation, and they expect it on a clock. You have an aggressive plan, a hold period, and a board watching the numbers. The pressure is real and it is yours to carry.'},

  {t:'content',eyebrow:'The trap',
   h2:'So you pour your energy into the plan.',
   pts:['Tighten the model. Rework the thesis into initiatives.',
        'Chase the metrics the board asks about each quarter.',
        'Assume that if the strategy is right, execution will follow.',
        'And still, things stall, and no one can quite say why.']},

  {t:'quote',eyebrow:'The reframe',
   quote:'The plan is almost never the problem. The people behind it are.',
   lead:'Across dozens of interviews with value-creation leaders at successful PE firms, the pattern held: strategy rarely fails on paper. It fails in the gap between a plan and a leadership team ready to run it.'},

  {t:'section',kicker:'Part One',h2:'Why value-creation plans stall.'},

  {t:'content',eyebrow:'The honest number',
   h2:'Most leaders already know the gap is there.',
   lead:'In a PwC survey Dan cites, 83% of private equity leaders said they need to improve their approach to value creation planning. The intent is not missing. The disciplined, people-first system is.'},

  {t:'content',eyebrow:'The real lever',
   h2:'Value creation is people-powered.',
   pts:['Right people, right seats, pointed at the few moves that matter.',
        'A leadership team aligned on where the company is going.',
        'Leaders who can actually execute the plan, not just admire it.',
        'Multiple expansion is the output. People are the input.']},

  {t:'section',kicker:'Part Two',h2:'The three layers of a PE-ready leader.'},

  {t:'layers',eyebrow:'The Ascend method',
   h2:'Leadership that compounds, layer by layer.',
   layers:[
     {t:'Layer 1 . Self-awareness and mindset',d:'360-degree feedback, a leadership mindset, naming the imposter voice, and leading from strengths instead of limiting beliefs.'},
     {t:'Layer 2 . Leading the team',d:'Setting expectations, driving accountability, inspiring followership, and coaching people through hard feedback with respect.'},
     {t:'Layer 3 . Value-creation skills',d:'Understanding how PE really works, setting vision, recruiting talent, and driving the value-creation plan with the data behind it.'}
   ]},

  {t:'content',eyebrow:'Layer 2, up close',
   h2:'Get the leadership team onto the same page. Literally.',
   lead:'Misalignment is the silent killer of growth. The A.R.T. of alignment uses six simple questions and a single sheet of paper to get a team pointed in the same direction, so the plan stops leaking energy sideways.'},

  {t:'content',eyebrow:'Layer 3, up close',
   h2:'Turn the thesis into a plan people can run.',
   pts:['Translate the investment thesis into an actionable plan.',
        'Deconstruct value creation into its component parts.',
        'Work the five keys to value-creation-planning success.',
        'Accelerate value after closing, not just before it.']},

  {t:'content',eyebrow:'How it fits together',
   h2:'Each layer makes the next one possible.',
   lead:'A self-aware leader can lead a team. An aligned team can run a value-creation plan. A plan that runs is what expands the multiple. Skip a layer and the one above it wobbles.'},

  {t:'section',kicker:'Part Three',h2:'Leading for the exit, inside the hold period.'},

  {t:'content',eyebrow:'The exit lens',
   h2:'Lead today the way the exit will be judged.',
   lead:'The strongest leaders reverse-engineer from the exit: the few must-do moves that maximize the multiple, the talent decisions made early rather than late, and the leadership bench that makes the company worth more without them in the room.'},

  {t:'cred',eyebrow:'Why listen to this',
   h2:'This is drawn from the inside of PE, not the sidelines.',
   cred:['Roughly fifteen years in private equity at Alpine Investors, as both an investor and an operator.',
         'Author of the bestseller Winning Moves: 105 Proven Ways to Create Value in Private Equity-Backed Companies.',
         'Teaches private equity value creation at the University of Chicago Booth School of Business.',
         'Founder of Accelera Partners and co-founder of Ascend, the leadership accelerator for PE-backed executives.']},

  {t:'content',eyebrow:'Is this you',
   h2:'You do not want to just manage the plan. You want to lead the value creation.',
   pts:['You own a number and a timeline you did not set alone.',
        'You suspect the ceiling is leadership, not strategy.',
        'You would rather build the team than babysit the model.']},

  {t:'cta',eyebrow:'Your next step',
   h2:'Become the leader your value-creation plan needs.',
   lead:'Ascend is a leadership accelerator built specifically for VP and C-level leaders inside PE-backed companies. Six months, a small cohort, and the three layers put to work on your real company.',
   brand:'Learn more and apply at dancremons.com',
   disc:'This masterclass is for educational purposes only. Outcomes vary and depend on many factors outside any program, including market conditions and individual execution. Nothing here is a promise or guarantee of financial, investment, or business results.'}
];

const deck = document.getElementById('deck');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t==='cta'?'cta':'');
  let h = '';
  if(s.t==='section'){ h += '<div class="num">'+String(i+1).padStart(2,'0')+'</div>'; }
  if(s.eyebrow) h += '<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.kicker)  h += '<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.h1) h += '<h1>'+esc(s.h1)+'</h1>';
  if(s.h2) h += '<h2>'+esc(s.h2)+'</h2>';
  if(s.quote) h += '<div class="quote">'+esc(s.quote)+'</div>';
  if(s.sub) h += '<div class="sub">'+esc(s.sub)+'</div>';
  if(s.lead) h += '<p class="lead">'+esc(s.lead)+'</p>';
  if(s.pts){ h += '<ul class="pts">'; s.pts.forEach(p=>h+='<li>'+esc(p)+'</li>'); h += '</ul>'; }
  if(s.layers){ h += '<div class="layers">'; s.layers.forEach(L=>h+='<div class="layer"><div class="l-t">'+esc(L.t)+'</div><div class="l-d">'+esc(L.d)+'</div></div>'); h += '</div>'; }
  if(s.cred){ h += '<div class="cred">'; s.cred.forEach(c=>h+='<div>'+esc(c)+'</div>'); h += '</div>'; }
  if(s.brand) h += '<div class="brandmark">'+esc(s.brand)+'</div>';
  if(s.disc) h += '<div class="disc">'+esc(s.disc)+'</div>';
  h += '<div class="pagefoot">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
