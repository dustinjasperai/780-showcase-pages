<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Growth Tax &middot; A Live Masterclass with Dewdrop Shaheena, Executive Gratitude Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Imprima&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d3321;        /* deep emerald ground (darkened from brand #145a32, ## Palette) */
    --panel:#14402a;     /* lighter emerald panel for cards */
    --ink:#f4efe3;       /* warm off-white display + headings */
    --ink-soft:#d8e2d2;  /* body copy on emerald */
    --rule:rgba(217,178,4,.26);
    --dim:#9db39f;       /* muted caption / foot */
    --accent:#d9b204;    /* her bright gold */
    --accent-deep:#9c7a1e;/* muted gold for rules / small type */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Imprima",-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative;width:100%;max-width:960px;aspect-ratio:16/9;
    background:
      radial-gradient(120% 90% at 84% 6%, rgba(217,178,4,.12), transparent 58%),
      var(--bg);
    overflow:hidden;box-shadow:0 0 0 1px var(--rule);
  }
  .slide{position:absolute;inset:0;padding:8% 9%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-family:"Ubuntu",sans-serif;font-weight:500;letter-spacing:.2em;
    text-transform:uppercase;font-size:clamp(11px,1.5vw,15px);color:var(--accent);margin-bottom:1em}
  h1{font-family:"Ubuntu",sans-serif;font-weight:700;line-height:1.05;
    font-size:clamp(34px,6.6vw,70px);letter-spacing:-.015em}
  h2{font-family:"Ubuntu",sans-serif;font-weight:500;line-height:1.1;
    font-size:clamp(25px,4.7vw,47px);letter-spacing:-.01em}
  .lede{font-size:clamp(16px,2.15vw,22px);line-height:1.5;max-width:46ch;margin-top:.9em;color:var(--ink-soft)}
  .rule{width:74px;height:5px;background:var(--accent);margin:1.05em 0;border-radius:3px}
  ul{list-style:none;margin-top:1.1em;max-width:52ch}
  li{position:relative;padding-left:1.7em;margin:.62em 0;font-size:clamp(15px,2vw,21px);line-height:1.42;color:var(--ink-soft)}
  li::before{content:"";position:absolute;left:.05em;top:.5em;width:11px;height:11px;background:var(--accent);border-radius:50%}
  .big{font-family:"Ubuntu",sans-serif;font-weight:700;font-size:clamp(60px,14vw,150px);color:var(--accent-deep);line-height:.9;letter-spacing:-.02em;opacity:.5}
  .cardwrap .inner{background:var(--panel);padding:5.5% 6.5%;border-left:6px solid var(--accent);border-radius:5px}
  .foot{position:absolute;left:9%;bottom:5.5%;font-family:"Ubuntu",sans-serif;
    letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--dim)}
  .disc{font-size:13px;line-height:1.55;color:var(--dim);max-width:60ch;margin-top:1.3em}
  #nav{position:fixed;bottom:14px;right:18px;display:flex;gap:8px;align-items:center;
    font-family:"Ubuntu",sans-serif;font-size:14px;color:var(--dim)}
  #nav button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--rule);
    border-radius:6px;padding:5px 11px;cursor:pointer}
  #nav button:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">Prev</button><span id="count"></span><button id="next">Next</button></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass with Dewdrop Shaheena, Executive Gratitude Coach',h:'The Growth Tax',lede:'How prophetic gratitude, trained as a discipline, turns pressure into sustained performance instead of burnout, for executives and leadership teams carrying real weight.'},
 {t:'promise',h:'What you will leave with',ul:['A name for the hidden cost your pressure is already charging your team','A trainable way to reappraise pressure in the moment, drawn from faith and neuroscience','A way to see which of your daily leadership behaviours create lift, and which create drag']},
 {t:'who',kick:'Who this is for',h:'You are already the performer. That was never in question.',lede:'You deliver under targets most people would fold under. What no title prepared you for is the slow cost of carrying that pressure year after year, for you and for the people who follow you.'},
 {t:'hook',kick:'The reframe',h:'You are not paying for more effort. You are paying the Growth Tax.',lede:'The Growth Tax is the hidden price pressure extracts when it is left unmanaged. It shows up as burnout, as trust that quietly erodes, and as execution that slows even while everyone is working harder.'},
 {t:'part',kick:'Part one',h:'Where the Growth Tax comes from'},
 {t:'content',h:'Three places pressure leaks out',ul:['Burnout: the best people run hot, then run out, and you absorb the loss twice','Eroded trust, or amanah: under strain, people stop extending each other the benefit of the doubt','Slow execution: decisions get heavier, hand-offs get sticky, and speed quietly disappears']},
 {t:'content',h:'Working harder is not the missing piece',lede:'You already outwork the room. Another push does not clear the Growth Tax, it compounds it. What clears it is a discipline for how you meet pressure in the first place, so the same weight produces performance instead of cost.'},
 {t:'part',kick:'Part two',h:'The discipline: from reaction to reappraisal'},
 {t:'card',kick:'The lens',h:'Gratitude is a discipline, not a mood',lede:'Gratitude here is a disciplined way of reappraising a moment: recognising the possibility inside pressure, and responding with clarity, faith, and personal responsibility rather than reaction. Trained, it changes what pressure does to you.'},
 {t:'card',kick:'The method',h:'The DEWDROP model: reappraise in the moment',lede:'Rooted in prophetic principle and neuroscience, the DEWDROP approach gives you a repeatable way to catch the reaction, reframe the pressure, and choose the response, so emotional resilience and self-leadership become habits, not hopes.'},
 {t:'card',kick:'The architecture',h:'The Prophetic Peak Performance System',lede:'P3 is the operating architecture that installs this across a team: a culturally grounded, neuroscience-informed way to regulate pressure, align behaviour to outcomes, and sustain high performance without paying the Growth Tax to get there.'},
 {t:'content',kick:'Inside P3',h:'Rebuild trust as a daily behaviour',ul:['Treat amanah as something practised in small daily actions, not declared on a wall','Make the behaviours that build trust visible, repeatable, and expected','Protect the conditions where people can perform without running themselves empty']},
 {t:'content',kick:'Inside P3',h:'Measure lift against drag with PSE 360',lede:'Prophetic Sustained Excellence 360 reads how a leader\'s daily actions create operational lift, or operational drag, across the team. It turns a felt problem into something you can see, work on, and watch improve.'},
 {t:'part',kick:'Part three',h:'What changes when the tax comes down'},
 {t:'content',h:'The shift you feel first',ul:['Pressure arrives and you meet it with a method, not a flinch','Your best people stay, because the environment stops quietly taxing them','Execution gets lighter, because trust is doing the work friction used to do']},
 {t:'why',kick:'Why learn this from me',h:'A leader who carried the weight, then built the method',lede:'I am Dewdrop Shaheena, an executive gratitude coach with more than twenty five years across finance, HR, operations and organisational leadership, including responsibility for over three hundred and fifty people. I am a certified executive and team coach and a certified leadership trainer, and I built the Prophetic Peak Performance System so leaders could turn pressure into performance on purpose, not by luck.'},
 {t:'recap',h:'The whole path in one breath',ul:['Name the Growth Tax your pressure is charging you and your team','Train the gratitude-reappraisal discipline so pressure produces performance','Install it with P3 and measure the lift with PSE 360']},
 {t:'cta',kick:'Your next step',h:'Bring the Growth Tax down in your own team',lede:'If this is the work you want to do inside your organisation, the next step is a diagnostic conversation. We look at where your Growth Tax is highest, and what a Prophetic Peak Performance engagement would change. Book your diagnostic call and let us begin.',disc:'This masterclass is educational. No specific financial, performance, retention, or business outcome is guaranteed. Results vary and depend on you, your organisation, and the work you put in. Nothing here is a promise of results.'}
];
const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='slide'+(i===0?' on':'');
  let h='';
  if(s.kick)h+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='part'){h+='<div class="big">'+(i)+'</div><h2 style="margin-top:.2em">'+s.h+'</h2>';}
  else if(s.t==='title'){h+='<h1>'+s.h+'</h1><div class="rule"></div>'+(s.lede?'<div class="lede">'+s.lede+'</div>':'');}
  else if(s.t==='card'){h+='<div class="cardwrap"><div class="inner"><h2>'+s.h+'</h2>'+(s.lede?'<div class="lede">'+s.lede+'</div>':'')+'</div></div>';}
  else{h+='<h2>'+s.h+'</h2><div class="rule"></div>';if(s.lede)h+='<div class="lede">'+s.lede+'</div>';}
  if(s.ul){h+='<ul>'+s.ul.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="foot">Dewdrop Shaheena &middot; Executive Gratitude Coach</div>';
  d.innerHTML=h;stage.appendChild(d);
});
let cur=0;const slides=[...stage.children];const count=document.getElementById('count');
function show(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,i)=>s.classList.toggle('on',i===cur));count.textContent=(cur+1)+' / '+S.length;}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
stage.addEventListener('click',e=>{if(e.clientX> stage.getBoundingClientRect().left+stage.clientWidth/2)show(cur+1);else show(cur-1);});
show(0);
</script>
</body>
</html>
