<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Values-First Way Out of Law, a Former Lawyer masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f4;        /* warm off-white, from her #f3f5f4 / #f4f4f4 grounds */
    --ink:#0d241d;       /* deep forest-green, from her dominant #091e19 */
    --accent:#2f7d6a;    /* teal-green, from her brand green #419782 / #37937c */
    --rose:#c23a66;      /* rose pop, from her #ca3464, used once */
    --panel:#eef2ee;     /* pale sage panel, from #97c9bd lightened */
    --rule:#dfe7e2;      /* muted sage rule */
    --muted:#4b5d55;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:"Montserrat",system-ui,sans-serif}
  .deck{max-width:1000px;margin:0 auto;padding:32px 18px 64px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:18px 0;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(13,36,29,.04);
  }
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:52px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:38px;line-height:1.1;margin-bottom:16px}
  .lead{font-family:"Newsreader",Georgia,serif;font-size:25px;line-height:1.4;color:var(--muted);font-weight:400}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:46ch;margin-top:12px}
  .big{font-family:"Newsreader",Georgia,serif;font-size:40px;line-height:1.18;font-weight:500}
  .num{font-family:"Newsreader",Georgia,serif;font-size:19px;color:var(--rose);font-weight:600}
  ul{margin:18px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 42px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li .step{position:absolute;left:0;top:12px;font-family:"Newsreader",serif;color:var(--accent);font-weight:600;font-size:19px}
  .foot{position:absolute;left:56px;bottom:22px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .page{position:absolute;right:56px;bottom:22px;font-size:12px;color:var(--muted)}
  .tag{display:inline-block;background:var(--panel);color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:999px;margin-bottom:22px}
  .disc{font-size:13px;color:var(--muted);max-width:60ch;margin-top:20px;line-height:1.5}
  .cta-line{font-family:"Newsreader",serif;font-size:27px;color:var(--accent);margin-top:14px;font-weight:600}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:360px}h1{font-size:34px}h2{font-size:28px}.big{font-size:28px}.foot,.page{position:static;margin-top:20px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "Former Lawyer";
const S = [
  {t:"title",
   eyebrow:"A FREE LIVE MASTERCLASS WITH SARAH COTTRELL",
   h:"The Values-First Way Out of Law",
   lead:"How to find the career that actually fits, before you ever touch your resume."},

  {t:"lead",
   eyebrow:"Who this is for",
   h:"If this is you, you are in the right room.",
   body:"You are a lawyer. On paper it worked. In practice, Sunday evening rolls around and you feel sick with dread about the week ahead. You have Googled \"what can I do with my law degree?\" more times than you would admit. You are not broken, and you are not alone."},

  {t:"big",
   eyebrow:"The trap",
   big:"\"I spent years and a fortune on this degree. Walking away would mean throwing all of it out.\"",
   body:"So you stay. Another quarter, another year. The sunk cost keeps you in a chair that was never going to fit."},

  {t:"big",
   eyebrow:"The reframe",
   big:"There is nothing wrong with you if you don't want to be a lawyer anymore.",
   body:"Leaving law is not failure, and it is not starting from zero. It is a decision you can make on purpose, with a process, instead of waiting to burn out."},

  {t:"section",
   eyebrow:"Part one",
   h:"Why most lawyers stay stuck",
   body:"Not because there is nothing else out there. Because of how they look for it."},

  {t:"point",
   eyebrow:"The core problem",
   h:"You are starting in the wrong place.",
   body:"Most legal-career advice jumps straight to the resume: update it, find a lateral move, chase a \"JD-preferred\" title. That is a credential match. It answers \"what can I technically do\" and never asks \"what do I actually want.\" So you land somewhere that looks sensible and feels exactly the same."},

  {t:"point",
   eyebrow:"The cost of a credential match",
   h:"A better-paid version of the same unhappiness.",
   body:"When the search starts with the job title instead of the person, you optimize for what is impressive, not what fits. The result is a move that looks good on LinkedIn and still has you dreading Monday."},

  {t:"section",
   eyebrow:"Part two",
   h:"The Former Lawyer Framework",
   body:"A values-first process. Self-knowledge comes first; the job search comes last. Here are the five steps."},

  {t:"steps",
   eyebrow:"The five steps",
   h:"Values first, resume last.",
   steps:[
     ["1","Stop and Self-Assess","Pause before you act. Look honestly at why you went into law and where the dissatisfaction actually lives."],
     ["2","Identify and Clarify","The most important step. Get accurate on five things: your values, personality, strengths, likes and dislikes, and skills."],
     ["3","Explore and Experiment","Research real options through conversations with people already doing the work, so you are testing reality, not guessing."],
     ["4","Refine and Iterate","Narrow, eliminate poor fits, and stay open to pivoting. The path is not linear and it is not supposed to be."],
     ["5","Strategize and Execute","Only now: the resume, the cover letters, the LinkedIn, the interviews. Execution is the easy part once the direction is right."]
   ]},

  {t:"point",
   eyebrow:"Step one, up close",
   h:"Stop and Self-Assess",
   body:"Before you touch a single job board, stop. Why did you choose law in the first place? What specifically drains you now, and what parts, if any, still feel good? This is the brainstorm that everything else is built on."},

  {t:"point",
   eyebrow:"Step two, up close",
   h:"Identify and Clarify",
   body:"This is where most people skip ahead and it is the step that matters most. You map five essential elements of yourself: values, personality, strengths, likes and dislikes, and skills. The right next career is the one that fits these, not the one that reuses your credential."},

  {t:"point",
   eyebrow:"Step three, up close",
   h:"Explore and Experiment",
   body:"Assumptions about a field are almost always wrong until you talk to someone inside it. You run small experiments and real conversations so the options you keep are the ones that survive contact with reality."},

  {t:"point",
   eyebrow:"Steps four and five, up close",
   h:"Refine, then execute",
   body:"You narrow with new information and let go of what does not fit, pivoting when you need to. When the direction is clear, the resume, the applications, and the interviews fall into place, because you finally know what you are aiming at."},

  {t:"section",
   eyebrow:"Part three",
   h:"On the other side of the decision",
   body:"Not a fantasy. A different relationship with your own week."},

  {t:"big",
   eyebrow:"The outcome",
   big:"Sunday evenings are not filled with dread about the week to come.",
   body:"You make career decisions from a place of confidence and ease, and you have let go of the anxiety you assumed was just a normal part of working life."},

  {t:"point",
   eyebrow:"Why this method",
   h:"Built from hundreds of real exits.",
   body:"This is not theory. The Former Lawyer Framework comes out of a decade in practice, an exit of my own, three hundred-plus podcast episodes interviewing former lawyers across every specialty, and direct work with hundreds of lawyers since 2020. The pattern that works is always values first."},

  {t:"point",
   eyebrow:"Who I am",
   h:"Sarah Cottrell, Former Lawyer",
   body:"I practiced law for a decade before I left. I am an ICF-certified career coach, the host of The Former Lawyer Podcast, and the creator of the Former Lawyer Framework. I help lawyers who want out figure out what is next, on purpose."},

  {t:"cta",
   eyebrow:"Your next step",
   h:"Ready to find the career that fits?",
   cta:"Start with the free guide, First Steps to Leaving the Law, then let's work through the Framework together.",
   body:"If today put words to something you have felt for a while, that is the signal to begin. The first step is small and it is free.",
   disc:"This masterclass is educational and informational only. It is not legal advice, financial advice, or a guarantee of any specific career outcome or income. Leaving law is a personal decision and individual results vary."}
];

const deck = document.getElementById("deck");
S.forEach((s,i)=>{
  const el = document.createElement("section");
  el.className = "slide";
  let inner = "";
  if(s.eyebrow && s.t!=="section") inner += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==="title"){
    inner += `<h1>${s.h}</h1><p class="lead" style="margin-top:22px">${s.lead}</p>`;
  } else if(s.t==="lead"){
    inner += `<h2>${s.h}</h2><p>${s.body}</p>`;
  } else if(s.t==="big"){
    inner += `<div class="big">${s.big}</div>${s.body?`<p>${s.body}</p>`:""}`;
  } else if(s.t==="section"){
    inner += `<span class="tag">${s.eyebrow}</span><h1>${s.h}</h1>${s.body?`<p class="lead" style="margin-top:16px">${s.body}</p>`:""}`;
  } else if(s.t==="point"){
    inner += `<h2>${s.h}</h2><p>${s.body}</p>`;
  } else if(s.t==="steps"){
    inner += `<h2>${s.h}</h2><ul>`;
    s.steps.forEach(st=>{ inner += `<li><span class="step">${st[0]}</span><strong>${st[1]}.</strong> ${st[2]}</li>`; });
    inner += `</ul>`;
  } else if(s.t==="cta"){
    inner += `<h1>${s.h}</h1><div class="cta-line">${s.cta}</div><p>${s.body}</p><div class="disc">${s.disc}</div>`;
  }
  el.innerHTML = inner + `<div class="foot">${BRAND}</div><div class="page">${i+1} / ${S.length}</div>`;
  deck.appendChild(el);
});
</script>
</body>
</html>
