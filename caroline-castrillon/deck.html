<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Corporate Escape Plan - Caroline Castrillon</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10332E; --panel:#16423B; --rule:#2C5A50; --accent:#C9A24B; --ink:#F4EFE6;
    --muted:#AFC6BD; --head:'Playfair Display',Georgia,serif; --body:'Archivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#07211D;color:var(--ink);font-family:var(--body);line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 52px;margin:22px 0;min-height:380px;display:flex;flex-direction:column;justify-content:center}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.1;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.15;margin-bottom:16px}
  p{font-size:19px;color:var(--ink);margin-bottom:12px;max-width:42em}
  p.sub{color:var(--muted)}
  .big{font-family:var(--head);font-size:40px;line-height:1.12}
  .accent{color:var(--accent)}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;padding:12px 0 12px 20px;border-left:3px solid var(--accent);margin:10px 0;background:var(--panel);border-radius:0 8px 8px 0;padding-left:18px}
  li b{color:var(--accent);font-weight:600}
  .present{font-size:18px;color:var(--muted);margin-top:22px}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:46em}
  .num{font-family:var(--head);font-size:22px;color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title', kick:"A live masterclass with Caroline Castrillon",
   h:"The Corporate Escape Plan",
   sub:"How to leave corporate without starting over.",
   present:"Caroline Castrillon - Corporate Escape Artist. Forbes Senior Contributor, LinkedIn Top Voice."},

  {t:'who', kick:"Who this is for",
   h:"You've built something real. And you're done.",
   sub:"For the experienced professional who is quietly exhausted by a job that looks fine on paper, and who wants out without blowing up 20 years of work."},

  {t:'trap', kick:"The trap",
   h:"\"I'll leave when things calm down.\"",
   sub:"They never calm down. So you stay, tell yourself it's the responsible choice, and the years keep moving. The hard part was never the leaving. It was never having a plan."},

  {t:'reframe', kick:"The reframe",
   big:"Staying feels safe. <span class='accent'>That is the trap.</span>",
   sub:"The risk you can see is leaving. The risk you can't see is what staying is already costing you."},

  {t:'part', kick:"Part one", h:"The Cost of Staying",
   sub:"Before you weigh the risk of leaving, you have to count the cost of staying. Most people never do."},

  {t:'list', kick:"The Cost of Staying", h:"Five costs that compound quietly",
   list:["<b>Confidence</b> - you start to believe the job is the ceiling.",
         "<b>Earnings</b> - the raise you're not getting anywhere else.",
         "<b>Marketability</b> - your skills age inside one company's walls.",
         "<b>Missed opportunities</b> - the doors you stop even looking at.",
         "<b>Well-being</b> - the Sunday dread that leaks into Monday."]},

  {t:'ask', kick:"The diagnostic", big:"\"What is staying <span class='accent'>already costing me</span> while I wait?\"",
   sub:"A difficult stretch doesn't automatically mean leave. But once a problem drags on, the question changes from whether you can tolerate it to what tolerating it costs."},

  {t:'part', kick:"Part two", h:"Your Career Assets",
   sub:"The fear that keeps people stuck is \"I'd be starting over.\" You wouldn't. You'd be carrying everything you already built."},

  {t:'reframe', kick:"The truth", big:"You're not starting over. <span class='accent'>You're starting from experience.</span>",
   sub:"Years of judgment, relationships, reading people, and getting things done under pressure. None of it fits on a resume. All of it transfers."},

  {t:'list', kick:"Career Assets", h:"Three moves, not a leap",
   list:["<b>Carry forward</b> - name the competencies that travel with you.",
         "<b>Leave behind</b> - decide what you are done carrying.",
         "<b>Test before you commit</b> - try a direction before you bet the mortgage on it."]},

  {t:'titles', kick:"Why this matters", h:"A title is a narrow description of your value.",
   sub:"Employers screen by titles and industries. But your actual value is the pattern of how you solve problems and move people. That pattern is portable."},

  {t:'part', kick:"Part three", h:"The 90-Day Escape Plan",
   sub:"The framework Caroline used to leave corporate after 20 years. Not a leap. A sequence."},

  {t:'list', kick:"The 90-Day Escape Plan", h:"Five steps to a planned exit",
   list:["<b>Set your escape date</b> - a date creates direction and urgency.",
         "<b>Identify your milestones</b> - runway, validation, clients, benefits, the resignation.",
         "<b>Define your support system</b> - a small circle of believers and mentors.",
         "<b>Create transition rituals</b> - real emotional closure, not just a last email.",
         "<b>Map it all out</b> - the whole plan on one page you can actually follow."]},

  {t:'step', kick:"Step one", h:"Pick the date first.",
   sub:"Everything downstream gets easier once there is a real date on the calendar. Ambiguity is what keeps people stuck for years."},

  {t:'step', kick:"Step two", h:"Build the runway before you need it.",
   sub:"Financial cushion, a validated direction, early clients or offers, a clear read on your benefits. The plan is what turns a scary leap into a calm step."},

  {t:'step', kick:"Steps three and four", h:"You don't do this alone, and you don't do it numb.",
   sub:"A small circle who believes you can, plus rituals that give the chapter a real ending. Both are what make the exit stick."},

  {t:'look', kick:"After the plan", h:"The planned exit",
   sub:"You walk out on a date you chose, into a direction you tested, carrying everything you built, with a runway under you. Not a panic. A plan that worked."},

  {t:'why', kick:"Why me", h:"I did this myself.",
   sub:"25 years in corporate - VP of Marketing roles at Dell, Sony, and more - then a deliberate exit to build Corporate Escape Artist. Now a Forbes Senior Contributor and LinkedIn Top Voice, I coach professionals through the same plan."},

  {t:'recap', kick:"The plan", h:"Count the cost. Claim your assets. Build the 90 days.",
   sub:"That's the whole method. Staying is the risk. Leaving well is a skill, and it can be planned."},

  {t:'cta', kick:"Your next step", h:"Ready to build your escape plan?",
   sub:"Book a focused career-change session and we'll look at how your background supports a new direction and the one next step to take.",
   disc:"Educational content only. No income or result is guaranteed. Results vary based on your situation, effort, and circumstances."}
];

const app = document.getElementById('app');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.kick) html += `<div class="kick">${s.kick}</div>`;
  if (s.h) html += (s.t === 'title') ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`;
  if (s.big) html += `<div class="big">${s.big}</div>`;
  if (s.sub) html += `<p class="sub">${s.sub}</p>`;
  if (s.list) { html += '<ul>'; s.list.forEach(i => html += `<li>${i}</li>`); html += '</ul>'; }
  if (s.present) html += `<div class="present">${s.present}</div>`;
  if (s.disc) html += `<div class="disc">${s.disc}</div>`;
  el.innerHTML = html;
  app.appendChild(el);
});
</script>
</body>
</html>
