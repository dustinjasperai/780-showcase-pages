<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Leading Practice — Inspiring Psychology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12222F;      /* Inspiring Psychology deep navy ground */
    --panel:#1B2E3D;   /* navy panel */
    --rule:#2E4150;    /* navy rule */
    --accent:#E85040;  /* their coral */
    --ink:#F1ECE3;     /* their warm cream */
    --muted:#9DB0BD;   /* their muted slate-blue */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:470px;display:flex;flex-direction:column;
    justify-content:center;position:relative}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:20px}
  h1{font-family:'Crimson Text',serif;font-weight:600;font-size:52px;line-height:1.08;
    letter-spacing:-.01em}
  h2{font-family:'Crimson Text',serif;font-weight:600;font-size:38px;line-height:1.14}
  .sub{font-family:'Crimson Text',serif;font-style:italic;font-size:23px;color:var(--muted);
    margin-top:22px;max-width:40ch}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);margin-top:20px;max-width:56ch}
  ul{margin-top:26px;list-style:none;max-width:60ch}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 30px;position:relative;
    border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;
    background:var(--accent);border-radius:3px}
  .pill{display:inline-block;font-family:'Crimson Text',serif;font-size:30px;color:var(--accent);
    font-weight:600}
  .section h2{font-size:46px}
  .section .num{font-size:15px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;
    margin-bottom:18px}
  .frame{border:2px solid var(--rule);border-radius:10px;padding:22px 26px;margin-top:26px;
    max-width:54ch;position:relative}
  .frame .step{position:absolute;right:-1px;bottom:-16px;background:var(--accent);color:#12222F;
    font-weight:600;font-size:13px;padding:5px 12px;border-radius:20px;letter-spacing:.04em}
  .foot{position:absolute;bottom:22px;left:56px;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .cite{font-size:15px;color:var(--muted);margin-top:24px;font-style:italic}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:30px;line-height:1.5;max-width:60ch}
  .cta-step{font-family:'Crimson Text',serif;font-size:26px;margin-top:18px;color:var(--ink)}
  @media(max-width:640px){.slide{padding:36px 26px}h1{font-size:36px}h2{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass for experienced psychologists',
  h:'Build a Leading Practice',
  sub:'Not a busier one. The professional conditioning that keeps experienced psychologists stuck, and the first shift out of it.',
  foot:'Inspiring Psychology · Wendy Kendall'},

 {t:'content',eyebrow:'Who this is for',
  h:'You built the practice. Now it runs you.',
  body:'You have the expertise, the reputation and a steady stream of people who want to work with you. And you are quietly frustrated by how much of your week is still swallowed by repetitive delivery, when what you want is room for your ideas, judgement and interests.'},

 {t:'content',eyebrow:'The trap',
  h:'A practice that got very good at reproducing itself.',
  body:'The traps rarely look like barriers. They look like sensible professional decisions. Keep the reliable work coming in. Do another training. Wait until the idea is clearer. Do not get too far ahead of the evidence. Before long, the practice you know how to run has quietly become the ceiling.'},

 {t:'hook',eyebrow:'The reframe',
  h:'The block usually isn’t confidence. It’s professional conditioning.',
  sub:'We trained inside powerful professional systems, and we absorbed their rules about what a credible psychologist looks like and how far we can move before we stop doing psychology "properly".'},

 {t:'section',num:'Part One',h:'The core problem: the binds, blind spots and safe zones.'},

 {t:'content',eyebrow:'Professional conditioning',
  h:'What it actually is.',
  body:'Over a career we absorb ideas about where our expertise belongs, how authority is earned, and what counts as legitimate work. These become internalised rules. They shape what you pursue, what you postpone, what you feel qualified to lead and how visible you are prepared to become.'},

 {t:'content',eyebrow:'How it shows up',
  h:'Structural barriers become internal blocks.',
  body:'The barrier is rarely out in the world. It shows up inside your own practice as hesitation, as needing one more qualification, as an idea that never feels finished. The constraint feels personal. Most of the time it is structural.'},

 {t:'content',eyebrow:'The wrong diagnosis',
  h:'More confidence is not the answer.',
  body:'Confidence, clarity, readiness or more time rarely tell the whole story. You can add all four and still circle the same safe zone, because the thing holding the pattern in place was never a skills gap. It was a set of inherited assumptions you were never asked to examine.'},

 {t:'section',num:'Part Two',h:'The Leading Practitioner Development Model.'},

 {t:'content',eyebrow:'Pillar one',
  h:'Develop the Practitioner.',
  body:'Strengthen self-belief and self-leadership while loosening the professional roles and rules that keep you small. This is the work of seeing the conditioning clearly enough to stop being pushed around by it.'},

 {t:'content',eyebrow:'Pillar two',
  h:'Develop the Work & Practice.',
  body:'Design programs and services that restore your energy rather than extract it. A Leading Practice is organised around your distinctive ideas and a sustainable, regenerative model, not around filling every hour with repetitive delivery.'},

 {t:'content',eyebrow:'Pillar three',
  h:'Lead the Work.',
  body:'Build meaningful work that is connected to your values, with the visibility and professional authority to match it. You stop waiting for permission and start leading the conversation in your field.'},

 {t:'content',eyebrow:'The distinctive layer',
  h:'The Inner Leadership Team.',
  body:'An IFS-informed way of working with the internal parts that quietly run your professional decisions. It is the piece that separates this from generic practice-building: the leadership happens on the inside first.'},

 {t:'section',num:'Part Three',h:'What a Leading Practice looks like.'},

 {t:'content',eyebrow:'The shift',
  h:'Less repetitive delivery. More of your actual thinking.',
  body:'The point is not to work harder or add another funnel. It is a practice with room for your judgement, your creativity and your interests, earning well without being tied to an ever-fuller calendar of one-to-one hours.'},

 {t:'frame',eyebrow:'Where you start',
  h:'One thing more, one thing less.',
  body:'You do not need a polished plan. Bring one thing you want much more of in your practice, and one thing you are thoroughly ready to do less of. That is the first step outside the safe zone.',
  step:'Step outside the box'},

 {t:'why',eyebrow:'Why me',
  h:'Wendy Kendall',
  body:'Chartered Occupational and Coaching Psychologist with around thirty years in leadership talent development, and founder of Inspiring Psychology and The Psychology Practice Accelerator. I work with experienced psychologists to turn their experience, expertise and ideas into sought-after Leading Practices.',
  cite:'"After years of working with experienced practitioners, one of the biggest influences on whether we change our practices is something we talk about far less: professional conditioning."'},

 {t:'cta',eyebrow:'Your next step',
  h:'Build a Leading Practice.',
  ctastep:'If this named something true, the next cohort of The Psychology Practice Accelerator is where we do the work together. Start with a free coffee chat.',
  disclaimer:'This masterclass is educational. It shares a model and a way of thinking about your practice. It is not a guarantee of any particular professional, clinical or financial outcome. Results depend on your own context, choices and effort.'}
];

const deck=document.getElementById('deck');
for(const s of S){
  const d=document.createElement('section');d.className='slide '+s.t;
  let h='';
  if(s.num) h+='<div class="num">'+s.num+'</div>';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h) h+=(s.t==='section'?'<h2>':'<h1>')+s.h+(s.t==='section'?'</h2>':'</h1>');
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.body && s.t!=='frame') h+='<p class="body">'+s.body+'</p>';
  if(s.t==='frame') h+='<div class="frame"><p class="body" style="margin-top:0">'+s.body+'</p><span class="step">'+s.step+'</span></div>';
  if(s.points){h+='<ul>';for(const p of s.points)h+='<li>'+p+'</li>';h+='</ul>';}
  if(s.cite) h+='<div class="cite">'+s.cite+'</div>';
  if(s.ctastep) h+='<div class="cta-step">'+s.ctastep+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
  d.innerHTML=h;deck.appendChild(d);
}
</script>
</body>
</html>
