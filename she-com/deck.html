<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Community Moat - A Masterclass with Lisa Jones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Belleza&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf3ec;        /* warm cream ground, from lisajones.co #f9efe7 */
    --panel:#f3e6da;     /* deeper cream */
    --rule:#e2cdbd;      /* hairline */
    --ink:#373639;       /* charcoal ink, from brand evidence */
    --muted:#6f6a66;     /* muted charcoal */
    --accent:#e2917a;    /* deepened warm coral, from #f0b39d/#fcd8c2 */
    --display:'Belleza', sans-serif;   /* her own display face */
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);font-family:var(--body);color:var(--ink);}
  .deck{max-width:1120px;margin:0 auto;}
  .slide{
    position:relative;background:var(--bg);min-height:64vh;
    padding:76px 84px;margin:28px auto;border-radius:6px;
    box-shadow:0 18px 50px rgba(0,0,0,.28);
    display:flex;flex-direction:column;justify-content:center;
  }
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px;}
  h1{font-family:var(--display);font-weight:400;font-size:60px;line-height:1.04;letter-spacing:.5px;}
  h2{font-family:var(--display);font-weight:400;font-size:42px;line-height:1.08;}
  .lead{font-size:22px;line-height:1.5;color:var(--ink);max-width:46ch;margin-top:22px;}
  .sub{font-size:18px;line-height:1.55;color:var(--muted);max-width:52ch;margin-top:18px;}
  .big{font-family:var(--display);font-size:52px;line-height:1.1;max-width:22ch;}
  ul{list-style:none;margin-top:26px;display:grid;gap:16px;max-width:60ch;}
  li{position:relative;padding-left:34px;font-size:19px;line-height:1.5;}
  li:before{content:"";position:absolute;left:0;top:11px;width:14px;height:2px;background:var(--accent);}
  .ratio{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap;}
  .ratio .cell{background:var(--panel);border:1px solid var(--rule);border-radius:8px;
    padding:24px 26px;flex:1;min-width:200px;}
  .ratio .n{font-family:var(--display);font-size:44px;color:var(--accent);}
  .ratio .t{font-weight:600;margin-top:8px;font-size:17px;}
  .ratio .d{color:var(--muted);font-size:15px;margin-top:6px;line-height:1.45;}
  .quote{font-family:var(--display);font-size:38px;line-height:1.18;max-width:24ch;}
  .cite{margin-top:22px;color:var(--muted);font-size:16px;font-weight:600;letter-spacing:.02em;}
  .cred{display:grid;gap:14px;margin-top:24px;max-width:54ch;}
  .cred div{font-size:18px;line-height:1.5;}
  .cred b{color:var(--accent);font-weight:600;}
  .cta-box{margin-top:30px;}
  .cta-btn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;
    padding:16px 30px;border-radius:999px;font-size:18px;letter-spacing:.02em;}
  .disclaimer{margin-top:30px;color:var(--muted);font-size:13px;line-height:1.5;max-width:60ch;}
  .pg{position:absolute;right:34px;bottom:26px;color:var(--muted);font-size:13px;letter-spacing:.1em;}
  .brand{position:absolute;left:84px;bottom:26px;color:var(--muted);font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;font-weight:600;}
  @media(max-width:720px){.slide{padding:48px 30px}h1{font-size:40px}h2{font-size:30px}.big,.quote{font-size:32px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'cover',kicker:'A live masterclass with Lisa Jones',h:'The Community Moat',
   lead:'How female product founders turn buyers into evangelists, and build a brand that compounds instead of one that constantly starts over.'},

  {t:'statement',kicker:'Who this is for',big:'You have real customers. Growth just stopped feeling like it compounds.',
   sub:'This is for women running a product brand past the first scrappy sales, who now feel like growth means one thing: spend more, and shout louder.'},

  {t:'list',kicker:'The trap',h2:'The quiet plateau most founders hit',
   items:[
     'Every new sale is a stranger who buys once and never comes back.',
     'Reach keeps costing more, and buys less each month.',
     'The brand lives or dies on the algorithm being kind that week.',
     'You are working harder to stand still.']},

  {t:'statement',kicker:'The reframe',big:'The advantages you can buy are the ones everyone else can buy too.',
   sub:'Paid reach, discounting, algorithm luck. They are rented, they are rising in price, and AI is making them cheaper for your competitors, not for you. The one advantage nobody can copy or outbid is a community that carries your brand for you.'},

  {t:'statement',kicker:'Part one',big:'Reach without belonging does not compound.',
   sub:'A thousand strangers who bought once is not a brand. It is a receipt. Compounding starts the moment a buyer becomes someone who belongs.'},

  {t:'list',kicker:'Part one',h2:'Why more traffic stops working',
   items:[
     'Acquisition cost rises, so each new customer earns you less.',
     'One-time buyers have no reason to return or refer.',
     'You rebuild your audience from zero every single launch.',
     'Belonging, not reach, is what makes people come back and bring others.']},

  {t:'quote',q:'Community over competition.',cite:'The idea SHE-com is built on'},

  {t:'statement',kicker:'Part two',big:'The 1,000 / 100 / 10 architecture',
   sub:'Every product brand that compounds has three groups, in a deliberate ratio. Most founders chase only the first and wonder why nothing sticks.'},

  {t:'ratio',kicker:'The framework',h2:'Buyers, evangelists, true believers',
   cells:[
     {n:'1,000',tt:'Buyers',dd:'People who bought once. Necessary, but on their own they do not build anything durable.'},
     {n:'100',tt:'Evangelists',dd:'Buyers you turned into fans who tell people, without being asked, because you gave them a reason to.'},
     {n:'10',tt:'True believers',dd:'The few who carry the brand as if it were theirs. They recruit, defend, and shape it with you.'}]},

  {t:'list',kicker:'The framework',h2:'Most founders build it upside down',
   items:[
     'They pour everything into the 1,000 and ignore the 100 and the 10.',
     'So they keep buying strangers instead of growing believers.',
     'The work is to move people up the ladder on purpose, not by luck.',
     'The 100 and the 10 are what make the 1,000 cheaper to reach next time.']},

  {t:'list',kicker:'Moving people up',h2:'How a buyer becomes an evangelist',
   items:[
     'Give the first purchase an experience worth talking about, not just a parcel.',
     'Make it easy and rewarding to bring someone else in.',
     'Show up as a person, not a logo. Personal brand is the doorway to community.',
     'Give evangelists a name, a place, and a role that is real.']},

  {t:'list',kicker:'Moving people up',h2:'How an evangelist becomes a true believer',
   items:[
     'Let them into decisions. Believers are made by being trusted.',
     'Build a space they own, not just a list you broadcast to.',
     'Recognise them publicly, consistently, and specifically.',
     'Ten true believers will out-market a thousand ads you had to pay for.']},

  {t:'statement',kicker:'Part three',big:'What this looks like in a real product brand',
   sub:'This is not theory. It is the same architecture behind building a brand that ranked above the category giant, and behind a community of women product founders that grew past a hundred thousand.'},

  {t:'cred',kicker:'Why this, from me',h2:'Lisa Jones',
   items:[
     ['Built', 'three multi-million-dollar product brands, and exited two of them.'],
     ['Ecoriginals', 'the eco-nappy brand that ranked higher than Huggies in customer reviews before my 2020 exit.'],
     ['SHE-com', 'a community of more than 100,000 women in e-commerce, built the same way I am teaching here.'],
     ['Author', 'of E-commerce Uncomplicated, and of Build the Damn Brand.']]},

  {t:'list',kicker:'The shift',h2:'From renting attention to owning belonging',
   items:[
     'You stop starting from zero at every launch.',
     'Your best customers do your marketing, because they want to.',
     'A bad ad month stops being an existential event.',
     'The brand becomes something people join, not just something they buy.']},

  {t:'statement',kicker:'The takeaway',big:'Reach is rented. Community is owned.',
   sub:'The founders who win the next few years will not be the ones who spent the most. They will be the ones who built the deepest belonging around a brand people are proud to carry.'},

  {t:'list',kicker:'Your first moves',h2:'Where to start this week',
   items:[
     'Name your 10. Who already acts like a true believer?',
     'Give your 100 a real place to belong, not just a discount code.',
     'Decide the one experience that will make a buyer talk about you.',
     'Show up as you. The personal brand is the front door to the moat.']},

  {t:'cta',kicker:'Join the SHE-com room',h:'Build your community moat, with women doing the same thing',
   lead:'SHE-com is where women product founders build brands that compound, together. Find the room that fits where your brand is right now.',
   btn:'Explore SHE-com',
   disc:'This masterclass is educational. No specific result is guaranteed. Results vary and depend on your own market, product, and effort. Nothing here is a promise of income or growth.'}
];

const deck=document.getElementById('deck');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='';
  if(s.kicker) h+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.t==='cover'){h+=`<h1>${esc(s.h)}</h1><div class="lead">${esc(s.lead)}</div>`;}
  else if(s.t==='statement'){h+=`<div class="big">${esc(s.big)}</div>`+(s.sub?`<div class="sub">${esc(s.sub)}</div>`:'');}
  else if(s.t==='list'){h+=`<h2>${esc(s.h2)}</h2><ul>`+s.items.map(x=>`<li>${esc(x)}</li>`).join('')+`</ul>`;}
  else if(s.t==='ratio'){h+=`<h2>${esc(s.h2)}</h2><div class="ratio">`+s.cells.map(c=>`<div class="cell"><div class="n">${esc(c.n)}</div><div class="t">${esc(c.tt)}</div><div class="d">${esc(c.dd)}</div></div>`).join('')+`</div>`;}
  else if(s.t==='quote'){h+=`<div class="quote">${esc(s.q)}</div><div class="cite">${esc(s.cite)}</div>`;}
  else if(s.t==='cred'){h+=`<h2>${esc(s.h2)}</h2><div class="cred">`+s.items.map(c=>`<div><b>${esc(c[0])}</b> ${esc(c[1])}</div>`).join('')+`</div>`;}
  else if(s.t==='cta'){h+=`<h1>${esc(s.h)}</h1><div class="lead">${esc(s.lead)}</div><div class="cta-box"><span class="cta-btn">${esc(s.btn)}</span></div><div class="disclaimer">${esc(s.disc)}</div>`;}
  h+=`<div class="brand">SHE-com</div><div class="pg">${i+1} / ${S.length}</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
