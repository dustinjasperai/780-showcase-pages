<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Seven Stages of Growth · Matthew Pohl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f2f2; --panel:#ffffff; --rule:#e6dcd9;
    --acc:#9a1c1f; --acc2:#1f3832; --ink:#1f2526; --grey:#4a4f4c; --dim:#8a827e;
  }
  html,body{height:100%}
  body{background:#2a2422;font-family:'Archivo',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2a2422}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Bitter',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.3vw;max-width:88%}
  .t-normal h1{font-size:3.1vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.55;font-weight:400}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Archivo',sans-serif;font-size:1.4vw;font-weight:600;color:var(--acc2);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#274a41 0%,#1a2f2a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:84%;font-style:italic;color:#f7f2f2}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#274a41 0%,#1a2f2a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:82%;color:#f7f2f2}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid #e9bd41;color:#f7f2f2;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-dark .disc,.t-cta .disc{color:#c9d6d0}
  .t-title .disc,.t-normal .disc{text-align:left}
  .stage-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-motif{right:7.5%;bottom:8%;width:16vw}
  .corner-motif{right:6%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#cfc7c2;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfc7c2;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#cfc7c2;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The ReWild Group</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- stage-step motif: an ascending staircase line, echoing the Seven Stages of Growth -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="steps" viewBox="0 0 260 150">
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 128 H62 V104 H106 V80 H150 V56 H194 V32" stroke="#9a1c1f" opacity="0.85"/>
    <circle cx="194" cy="32" r="6" fill="none" stroke="#9a1c1f" stroke-width="3.2"/>
    <line x1="14" y1="132" x2="246" y2="132" stroke="#1f3832" opacity="0.28"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Seven Stages of Growth',sub:'A live masterclass on Organizational ReWilding for owners of engineering firms.',brand:true,motif:'title'},
 {t:'normal',k:'Who this is for',title:'You built a firm your clients trust. Growth still keeps breaking.',body:'You solve hard technical problems for a living. But every time the firm adds people or projects, something that used to work stops working, and the fix that used to help stops helping.'},
 {t:'dark',title:'Growth does not fail randomly. It fails in predictable stages.'},

 {t:'section',idx:'Part One',title:'The Process Trap'},
 {t:'normal',k:'The reflex fix',title:'Engineering firms default to fixing growth with more process.',body:'A new project-management tool. Another SOP. A tighter checklist. It is the natural move for people trained to solve problems with structure and documentation.'},
 {t:'normal',k:'Why it stalls',title:'More process on the wrong stage makes things worse, not better.',body:'A firm that actually needs its people ready to own decisions, or needs its margins protected, does not get healthier from more structure. It gets slower, and the owner ends up carrying more, not less.'},
 {t:'dark',title:'The problem was never that you needed more process. It was that you were solving the wrong stage.'},

 {t:'section',idx:'Part Two',title:'Organizational ReWilding'},
 {t:'normal',k:'The reframe',title:'A business is a living system, not a machine.',body:'Built from research across more than 1,500 businesses over three decades, Organizational ReWilding treats a company as a set of interrelated elements that need different things at different points, not a checklist to optimize once and leave alone.'},
 {t:'normal',k:'The map',title:'The Seven Stages of Growth',body:'As a business adds people and complexity, it moves through seven distinct stages, each with its own characteristics and its own rules for what to fix next. Knowing your stage replaces guesswork with a map other firms have already walked.'},
 {t:'normal',k:'The diagnostic',title:'The Gates of Focus: People, Process, or Profit.',body:'At any given stage, one of these three levers deserves your attention far more than the other two. Pulling the wrong lever is the single most common way owners burn a year without moving the needle.'},
 {t:'normal',k:'Making it specific',title:'The Growth Readiness Check',body:'A short self-assessment that places your firm on the Seven Stages and points to the Gate that matters most right now, so the diagnosis is about your firm, not a generic stage of business in general.'},
 {t:'dark',title:'You do not need more effort. You need the right lever, for the stage you are actually in.'},

 {t:'section',idx:'Part Three',title:'Where This Shows Up'},
 {t:'normal',k:'In an engineering firm',title:'The pattern shows up in familiar places.',body:'An owner still doing billable work because delegating feels riskier than doing it themselves. Project managers who can run the technical side but will not own a business decision. Headcount that grows faster than margin. Each of these traces back to a specific stage and a specific Gate, not a personality flaw.'},
 {t:'normal',k:'The engineering-specific piece',title:'The Leadership Program for Engineers',body:'A track built to move technical specialists toward an ownership mentality, teaching how their work connects to the needs of the business so an owner can hand off real responsibility with confidence, not just tasks.'},
 {t:'dark',title:'Delegation is not a personality change. It is a stage you build toward.'},
 {t:'normal',k:'Why Matthew Pohl',title:'Three decades of research, taught in the open.',body:'Matthew Pohl founded The ReWild Group in 2017 and built Organizational ReWilding from research across more than 1,500 businesses. He has authored more than 16 books, hosts the Leaders of Lasting Impact podcast, and has been featured on Success.com.'},

 {t:'section',idx:'Your Next Step',title:'Two Ways In'},
 {t:'normal',k:'Direct engagement',title:'Work with The ReWild Group directly.',body:'Engagements start at $1,000 a month and are built around as little as two hours of your time, with a money-back guarantee on the first session.'},
 {t:'normal',k:'A certified Rewilder',title:'Or bring in a certified adviser in your region.',body:'The ReWild Group trains and certifies independent Rewilders (CORA) who deliver project-scoped engagements built from the same Organizational ReWilding framework, priced by the scope of the work.'},
 {t:'cta',title:'Ready to find out which stage you are actually in?',chips:['Talk to The ReWild Group','Find a certified Rewilder'],disc:'Educational content for owners of engineering firms. No income, growth, or business result is guaranteed. Results vary by firm, market, and how the framework is applied.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="stage-motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#steps"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The <b>ReWild Group</b> &middot; Matthew Pohl, CORA</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
