<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Run the Ranch Like a Business · Kolten Thigpen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f1e6; --panel:#efe7d6; --rule:#d8cdb3;
    --accent:#0e4c89; --ink:#161e2a; --body:#4a4535; --dim:#8a8172; --deep:#0f2036; --bone:#f6f1e6;
  }
  html,body{height:100%}
  body{background:#0a0f16;font-family:'Open Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0f16}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Crimson Text',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:-.005em}
  .t-title h1{font-size:5vw}
  .t-normal h1{font-size:3.4vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--body);margin-top:2.6vh;max-width:76%;line-height:1.55;font-weight:400}
  .sub{font-size:1.75vw;color:var(--body);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.35vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:90%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1b3450 0%,#0b1826 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:88%;font-style:italic;color:var(--bone);font-weight:400}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1b3450 0%,#0b1826 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.2vw;max-width:84%;color:var(--bone)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #9cc0e0;color:#dbe8f5;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.22vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#8ea6bd}
  .t-title .disc,.t-normal .disc{text-align:left}
  .rise-motif{position:absolute;pointer-events:none}
  .title-rise{right:7%;bottom:8%;width:24vw}
  .corner-rise{right:6%;bottom:7.5%;width:11vw;opacity:.5}
  .brandline{font-size:1.28vw;color:var(--body);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Cattle Coach Academy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- rising fence line: posts climbing to a rail, the operation growing into a business -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rise" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="138" x2="248" y2="138" stroke="#8a8172" opacity="0.45"/>
    <line x1="40" y1="138" x2="40" y2="112" stroke="#0e4c89" opacity="0.9"/>
    <line x1="95" y1="138" x2="95" y2="92" stroke="#0e4c89" opacity="0.9"/>
    <line x1="150" y1="138" x2="150" y2="70" stroke="#0e4c89" opacity="0.9"/>
    <line x1="205" y1="138" x2="205" y2="46" stroke="#0e4c89" opacity="0.9"/>
    <path d="M40 112 L95 92 L150 70 L205 46" stroke="#161e2a" opacity="0.6"/>
    <circle cx="205" cy="46" r="5.4" fill="none" stroke="#0e4c89" stroke-width="2.8"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Run the Ranch Like a Business',sub:'The money side of a cattle operation, from a man who built one from a $5,000 loan.',brand:true,rise:'title'},
 {t:'normal',k:'Who this is for',title:'You work harder than anyone. The operation still is not paying you.',body:'New rancher or seasoned cattleman, the story is the same. The days are long, the herd is real, and at the end of the year the numbers still do not add up to a living.'},
 {t:'dark',title:'You do not have a cattle problem. You have a business problem.'},

 {t:'section',idx:'Part One',title:'The Cowboy Trap'},
 {t:'normal',k:'Why hard work is not enough',title:'Hard work alone can keep a cowboy broke.',body:'Grit gets the chores done, but it does not decide what to buy, what to keep, or what to charge. An operation can run flat out for years and still never turn into a business.'},
 {t:'normal',k:'The hidden leak',title:'There can be six figures of missed profit inside an operation that just looks busy.',body:'It hides in the cattle you should not have bought, the ones you sold too cheap, and the costs nobody ever added up. You cannot fix what you have never measured.'},
 {t:'dark',title:'Busy is not the same as profitable.'},

 {t:'section',idx:'Part Two',title:'Run It Like a Business'},
 {t:'normal',k:'Know your numbers',title:'Every head has an ROI. Most ranchers have never run it.',body:'Cost to raise, cost to carry, and what it actually returns. When you know the number on every animal, the hard decisions get simple and the guessing stops.'},
 {t:'normal',k:'Buy on the math',title:'Winning the ribbon and making the right financial decision are not always the same thing.',body:'The show ring and the sale barn are too expensive to walk into without a plan. Every buy needs an ROI and a backup, decided before the emotion of the moment takes over.'},
 {t:'normal',k:'Genetics that compound',title:'The right seedstock decisions pay for a decade, not a season.',body:'Chasing one win is expensive. Building genetics that stack value year over year is how the top breeders turn a herd into an appreciating asset.'},
 {t:'normal',k:'Market your cattle',title:'Buyers should not have to imagine what a calf could look like.',body:'Presentation and marketing are not vanity, they are price. How you show, list, and tell the story of your cattle decides what a buyer is willing to pay.'},
 {t:'dark',title:'Numbers, genetics, marketing. The business behind the cattle.'},

 {t:'section',idx:'Part Three',title:'The System That Keeps You Profitable'},
 {t:'normal',k:'A system, not a scramble',title:'Six weeks can make or break your season.',body:'Results come from a routine you run every day, not a push at the end. A repeatable prep system means the good years stop being luck and start being a process.'},
 {t:'normal',k:'Reinvest on purpose',title:'The profit you keep is what turns one good year into a business.',body:'Money made and money kept are two different things. Deciding ahead of time where profit goes is how a five acre lease becomes an operation you are proud of.'},
 {t:'dark',title:'You can build wealth without leaving the ranch lifestyle.'},

 {t:'section',idx:'Your next step',title:'Keep Going With Cattle Coach Academy'},
 {t:'normal',k:'How I can help',title:'The same path I walked, laid out step by step.',body:'I started with bottle calves and a $5,000 FSA loan on five leased acres, and built up to QB Cattle Company, Bullnanza Stud Services, and Express Livestock Genomics. Cattle Coach Academy is where I teach the money and marketing side that got me there, so you can reach your goals faster without repeating my mistakes.'},
 {t:'cta',title:'Ready to run your operation like a business?',chips:['Start the free trial','Join Cattle Coach Academy'],disc:'Educational content for cattle producers. No income, revenue, or business result is guaranteed. Results vary by operation, market, and management.'}
];

const deck=document.getElementById('deck');
function rise(kind){return `<svg class="rise-motif ${kind==='title'?'title-rise':'corner-rise'}"><use href="#rise"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Cattle Coach <b>Academy</b> · Kolten Thigpen</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.rise) h+=rise(s.rise);
  else if(s.t==='title') h+=rise('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
