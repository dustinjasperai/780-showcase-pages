<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Strategy Compass — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C2A3A; --panel:#113A4F; --rule:#20536B; --accent:#C79A3C; --ink:#F3EFE6;
    --muted:#A9C2CE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .deckwrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 44px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;top:26px;right:30px;width:34px;height:34px;
    border:1.5px solid var(--accent);border-radius:50%;opacity:.55}
  .slide::after{content:"";position:absolute;top:36px;right:45px;width:1.5px;height:24px;
    background:var(--accent);transform:rotate(32deg);transform-origin:bottom;opacity:.7}
  .kick{font-family:Inter;font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:16px}
  h1{font-family:Spectral;font-weight:700;font-size:46px;line-height:1.08;margin-bottom:14px}
  h2{font-family:Spectral;font-weight:600;font-size:33px;line-height:1.14;margin-bottom:14px}
  .sub{font-size:19px;color:var(--muted);line-height:1.5;max-width:46ch}
  .big{font-family:Spectral;font-size:27px;line-height:1.3;max-width:40ch}
  ul{list-style:none;margin-top:12px}
  li{font-size:18px;line-height:1.45;padding:11px 0 11px 30px;border-bottom:1px solid var(--rule);
    position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:9px;height:9px;
    border:1.5px solid var(--accent);border-radius:50%}
  li b{font-family:Spectral;font-weight:600;color:var(--ink)}
  .byline{margin-top:22px;font-size:16px;color:var(--muted)}
  .note{margin-top:18px;font-size:15px;color:var(--muted);font-style:italic}
  .disc{margin-top:20px;font-size:13px;color:var(--muted);line-height:1.5;max-width:52ch}
  .step{font-family:Spectral;font-size:15px;color:var(--accent);letter-spacing:.1em;margin-bottom:8px}
  .n{font-family:Spectral;font-size:12px;color:var(--muted);position:absolute;bottom:20px;left:44px}
</style>
</head>
<body>
<div class="deckwrap" id="deck"></div>
<script>
const S=[
 {t:'title', kick:'A Business Growth Masterclass with Gavin Preston',
  h:'The Strategy Compass',
  sub:'How to double your net profit in the next 12 months without working more hours or betting the business on a single big idea.',
  byline:'Gavin Preston - Chartered Accountant, Master NLP Practitioner, and author of Survive and Thrive.'},

 {t:'who', kick:'Who this is for',
  h:'You run a business turning over roughly one to five million.',
  sub:'Revenue has grown. The team has grown. The hours have grown. Somehow the profit that reaches you at the end of the year has not grown with any of it.'},

 {t:'list', kick:'The trap',
  h:'You are busier than ever and it is not showing up in the numbers.',
  list:['Sales are up, but margin is quietly leaking somewhere you cannot see.',
        'Every decision still runs through you, so growth just means more weight on you.',
        'You have plenty of ideas and no clear order to act on them.',
        'You know the next level is possible. You do not have a map to it.']},

 {t:'big', kick:'The reframe',
  h:'You do not have a growth problem.',
  big:'You have a navigation problem. Most owners push harder on the oars. Thriving owners set a bearing first, then row.'},

 {t:'list', kick:'Part one - the core problem',
  h:'Growth without a compass is just faster drifting.',
  list:['Working harder lifts revenue and buries profit under more cost and more chaos.',
        'A business that depends entirely on the owner cannot scale, it can only stretch.',
        'Without one shared direction, your team pulls hard in different directions.',
        'The fix is not more effort. It is a repeatable bearing you can steer by.']},

 {t:'big', kick:'What drifting costs',
  h:'Profit does not leak in one big hole.',
  big:'It leaks through a dozen small ones at once: weak pricing, soft conversion, bloated cost, no accountability. Fix them in the wrong order and nothing moves.'},

 {t:'list', kick:'Part two - the method',
  h:'The Strategy Compass: six bearings, in order.',
  sub:'The proven six-step model behind businesses that have doubled in a year. Each bearing builds on the one before it.',
  list:['One: Compelling Vision','Two: High-Performance Culture','Three: Connect, Captivate and Convert',
        'Four: Systems and Cash','Five: Capability','Six: Action and Accountability']},

 {t:'step', kick:'Bearing one', step:'COMPELLING VISION',
  h:'Set a destination the whole business can steer by.',
  sub:'A vision specific enough to make decisions against, so you and your team stop debating direction and start making progress toward one place.'},

 {t:'step', kick:'Bearing two', step:'HIGH-PERFORMANCE CULTURE',
  h:'Build a crew that delivers without you steering every oar.',
  sub:'The habits, standards and ownership that let the business run on its people, not only on the founder. This is what turns stretch into scale.'},

 {t:'step', kick:'Bearing three', step:'CONNECT, CAPTIVATE AND CONVERT',
  h:'Speak to one ideal customer and win them, end to end.',
  sub:'Marketing that talks to one person, captures and holds their attention, and converts them from stranger to customer. Turn off the wrong buyers, pull in the right ones.'},

 {t:'step', kick:'Bearing four', step:'SYSTEMS AND CASH',
  h:'Secure the platform so growth does not sink you.',
  sub:'The operating systems and cash discipline that keep the boat afloat as you grow. Growth without this is how profitable-looking businesses run out of money.'},

 {t:'step', kick:'Bearing five', step:'CAPABILITY',
  h:'Grow the capability to deliver what you have sold.',
  sub:'The skills, roles and capacity in the team so delivery keeps pace with demand instead of becoming the bottleneck that caps your growth.'},

 {t:'step', kick:'Bearing six', step:'ACTION AND ACCOUNTABILITY',
  h:'Turn the plan into a rhythm that actually happens.',
  sub:'The cadence of review and accountability that converts a strategy on paper into results in the bank. Most plans fail here, not in the thinking.'},

 {t:'big', kick:'Why it compounds',
  h:'Each bearing multiplies the next.',
  big:'A ten percent lift in pricing, conversion, retention and cost control do not add up. They multiply. That is how a business doubles its net profit in a year rather than inching up a few points.'},

 {t:'list', kick:'Part three - what it looks like',
  h:'A business that thrives, not one that just survives.',
  list:['Profit grows faster than revenue, because you fixed the leaks in the right order.',
        'The business runs on its systems and its people, so it no longer runs you.',
        'You make decisions against one clear bearing instead of the loudest idea in the room.',
        'You know, month to month, that you are on course.']},

 {t:'list', kick:'Why listen to me',
  h:'I have navigated this voyage from both sides.',
  list:['KPMG-qualified Chartered Accountant, so the plan is built on the numbers, not motivation.',
        'Master Practitioner of NLP, so it accounts for how owners and teams actually behave.',
        'Twenty-five years with blue chips like HSBC, Ford and TalkTalk, and hundreds of SME owners.',
        'Author of Survive and Thrive and host of the Business Mastermind Podcast.']},

 {t:'big', kick:'Secure, then scale',
  h:'There are two phases to the voyage.',
  big:'First you secure the platform so you cannot be sunk. Then you scale with confidence. Try to scale on an unsecured platform and the growth itself is what capsizes you.'},

 {t:'list', kick:'Is this you',
  h:'Who the compass is for.',
  list:['Owners of businesses turning over roughly one to five million who want to double net profit.',
        'People ready to work on the business, not only in it.',
        'Not a magic-bullet seeker. This is a method, followed in order, over twelve months.']},

 {t:'cta', kick:'Your next step',
  h:'Plot your bearing on a free strategy call.',
  sub:'If you want to see where your business sits on the Strategy Compass and what doubling net profit would take for you specifically, book a free, no-obligation strategy call with me.',
  disc:'This masterclass is educational. No income, profit, or business result is guaranteed. Results vary and depend on your market, your execution, and factors outside any program.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var deck=document.getElementById('deck');
S.forEach(function(s,i){
  var sl=el('div','slide');
  if(s.kick) sl.appendChild(el('div','kick',s.kick));
  if(s.step) sl.appendChild(el('div','step',s.step));
  if(s.h) sl.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));
  if(s.big) sl.appendChild(el('div','big',s.big));
  if(s.sub) sl.appendChild(el('div','sub',s.sub));
  if(s.list){var ul=el('ul');s.list.forEach(function(x){ul.appendChild(el('li',null,x));});sl.appendChild(ul);}
  if(s.byline) sl.appendChild(el('div','byline',s.byline));
  if(s.note) sl.appendChild(el('div','note',s.note));
  if(s.disc) sl.appendChild(el('div','disc',s.disc));
  sl.appendChild(el('div','n',(i+1)+' / '+S.length));
  deck.appendChild(sl);
});
</script>
</body>
</html>
