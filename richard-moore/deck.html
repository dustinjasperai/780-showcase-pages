<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Doctor Method — Richard Moore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1e8; --panel:#ffffff; --rule:#e7e1d4;
    --ink:#16130f; --muted:#5d574e; --accent:#fe6c01;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 64px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(22,19,15,.03)}
  .kicker{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:54px;line-height:1.02;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:36px;line-height:1.08;margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:40em;margin-bottom:12px}
  p.lead{font-size:22px;color:var(--ink)}
  .big{font-family:'Oswald',sans-serif;font-weight:700;font-size:40px;line-height:1.05;color:var(--ink);max-width:22em}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:14px 0;border-top:1px solid var(--rule);display:flex;gap:16px}
  li:first-child{border-top:0}
  li .n{font-family:'Oswald',sans-serif;font-weight:700;color:var(--accent);min-width:34px}
  li .t{display:block}
  li .t b{display:block;font-weight:600;margin-bottom:3px}
  li .t span{color:var(--muted);font-size:17px}
  .rx{border-left:3px solid var(--accent);padding-left:20px;margin-top:6px}
  .foot{font-size:14px;color:var(--muted);margin-top:26px}
  .cta h2{color:var(--ink)}
  .step{font-family:'Oswald',sans-serif;font-weight:600;color:var(--accent);font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:44em;line-height:1.5}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:360px}h1{font-size:38px}h2{font-size:28px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A masterclass with Richard Moore', h:'The Doctor Method',
   lead:'How to close high-value clients without pitching, pressure, or discounting.',
   foot:'For founders, coaches and consultants who are brilliant at the work and freeze on the call.'},

  {t:'for', kicker:'Who this is for', h:'You can do the work. The conversation is where it slips.',
   p:'You get the meeting. The prospect is interested. Then the call turns into a pitch, the energy drops, and you hear "let me think about it." So you follow up harder, and the deal goes quiet.',
   p2:'The problem is not your offer. It is the shape of the conversation.'},

  {t:'trap', kicker:'The trap', h:'Selling harder is the wrong lever.',
   big:'More scripts. More follow-up. More pressure. It all makes a high-value buyer trust you less.'},

  {t:'reframe', kicker:'The reframe', h:'The best salespeople do not sell. They diagnose.',
   p:'Think about how a good doctor runs a consultation. They do not walk in pitching surgery. They establish authority, ask until they understand the problem, then prescribe. You comply because you trust the diagnosis.',
   p2:'That is the whole method. Sell like a doctor treats a patient.'},

  {t:'part', step:'Part one', h:'Why pitching repels the buyers you most want.',
   p:'A pitch puts you below the buyer, asking. A diagnosis puts you beside them, solving. The higher the value of the client, the more they can feel the difference, and the faster they pull away from pressure.'},

  {t:'cost', kicker:'What it costs you', h:'The pressure spiral.',
   list:[
     {n:'01',b:'Discounting',s:'You drop the price to rescue a deal that was never lost on price.'},
     {n:'02',b:'Chasing',s:'Five follow-ups that each make you look more available and less in demand.'},
     {n:'03',b:'Ghosting',s:'"Let me think about it" is what a buyer says when they were never diagnosed.'}
   ]},

  {t:'part', step:'Part two', h:'The Doctor Method: Authority, Compliance, Prescription.',
   p:'Three moves, in order. Miss the order and the sale collapses back into a pitch.'},

  {t:'pillar', kicker:'Move one', h:'Authority',
   p:'Build trust before you ever pitch. You earn the right to prescribe by showing you have seen this exact problem many times and know what it leads to. Authority is not bragging. It is pattern recognition the buyer can feel.',
   rx:'A doctor does not open with their price list. Neither do you.'},

  {t:'pillar', kicker:'Move two', h:'Compliance',
   p:'The diagnostic conversation. You ask, in a specific order, until the buyer says the problem out loud in their own words. When they describe the pain, they are no longer being sold to. They are being understood, and they comply because it is their diagnosis, not your script.',
   rx:'Structure beats improvisation every time.'},

  {t:'pillar', kicker:'Move three', h:'Prescription',
   p:'Now, and only now, you prescribe. Break the offer into three clear parts so the buyer can see exactly what they get, and handle a soft objection by returning to the diagnosis instead of defending the price.',
   rx:'You are not closing. You are prescribing the obvious next step.'},

  {t:'first', kicker:'The payoff', h:'Close on the first call.',
   p:'When you pre-qualify so you only speak to real buyers, run the diagnosis, and prescribe in three parts, you stop needing four calls to do the work of one. The decision gets made while the trust is still warm.'},

  {t:'price', kicker:'And the part everyone avoids', h:'Raise your prices without discounting.',
   p:'A prescription has a price, and a diagnosed buyer does not haggle with it. When the conversation is built on authority and understanding, you can charge what the outcome is worth and hold the number with a calm you did not have before.'},

  {t:'flow', step:'Part three', h:'What it looks like, from first post to closed deal.',
   list:[
     {n:'01',b:'Attract',s:'Three core content types that pull the right buyers toward you on LinkedIn.'},
     {n:'02',b:'Warm',s:'A pressure-free, low-cadence DM process that leaves buyers wanting the call.'},
     {n:'03',b:'Pivot',s:'Specific language that moves a conversation to a booked call without a hard ask.'},
     {n:'04',b:'Prescribe',s:'The Doctor Method on the call itself. Authority, compliance, prescription.'}
   ]},

  {t:'why', kicker:'Why listen to me on this', h:'Twenty-three years, one method.',
   p:'I spent my first decade in corporate sales in the City of London on accounts with IBM, Siemens and Sony. Today I am a three-time LinkedIn Top Voice, I have taught more than 75,000 learners on LinkedIn Learning, and I have coached over 700 founders and coaches through the Doctor Method.',
   foot:'Clients have included Microsoft, LinkedIn, JP Morgan and Deloitte.'},

  {t:'recap', kicker:'The shift', h:'Stop selling. Start diagnosing.',
   big:'Authority, then compliance, then prescription. The same order, every call, with every buyer worth closing.'},

  {t:'cta', cls:'cta', kicker:'Run the method with me', h:'Learn the full method inside Art of Sell.',
   p:'Art of Sell is my sales-training community for founders, coaches and consultants. Live coaching, guest-expert masterclasses, and the Doctor Method broken down call by call so you can run it yourself.',
   p2:'If you want it applied directly to your pipeline, apply for the LinkedIn Client Accelerator and we will work on your real deals together.',
   disc:'Educational content only. No income, revenue, role, or result is guaranteed. Outcomes vary with your market, offer, effort, and execution. Nothing here is financial, legal, or professional advice.'}
];

const d = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let h = '';
  if (s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if (s.step) h += '<div class="step">'+s.step+'</div>';
  if (s.h) h += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if (s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if (s.big) h += '<p class="big">'+s.big+'</p>';
  if (s.p) h += '<p>'+s.p+'</p>';
  if (s.p2) h += '<p>'+s.p2+'</p>';
  if (s.rx) h += '<p class="rx">'+s.rx+'</p>';
  if (s.list){
    let u = '<ul>';
    for (const i of s.list) u += '<li><span class="n">'+i.n+'</span><span class="t"><b>'+i.b+'</b><span>'+i.s+'</span></span></li>';
    u += '</ul>';
    h += u;
  }
  if (s.foot) h += '<div class="foot">'+s.foot+'</div>';
  if (s.disc) h += '<div class="disc">'+s.disc+'</div>';
  el.innerHTML = h;
  d.appendChild(el);
}
</script>
</body>
</html>
