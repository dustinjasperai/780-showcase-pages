<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Writers Really Fail — a live masterclass with Karena Akhavein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff9f9; --panel:#ffffff; --ink:#2b2b2b; --muted:#6a625f;
    --accent:#e02b20; --accent-deep:#a82400; --rule:#ecdcd9;
    --head:'Playfair Display',Georgia,serif; --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 64px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 48px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:900;font-size:52px;line-height:1.04;margin:0 0 16px}
  h2{font-family:var(--head);font-weight:700;font-size:36px;line-height:1.1;margin:0 0 14px}
  .sub{font-size:21px;color:var(--muted);margin:0 0 10px;max-width:42ch}
  .by{font-size:17px;color:var(--ink);margin-top:22px;font-weight:600}
  .partnum{font-family:var(--body);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    font-size:14px;color:var(--accent-deep);margin:0 0 10px}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:20px;line-height:1.5;padding:9px 0 9px 30px;position:relative;max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:16px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
  .step{border:1px solid var(--rule);border-radius:10px;padding:16px 16px 18px;background:#fffdfd}
  .step b{display:block;font-family:var(--head);font-size:15px;color:var(--accent-deep);margin:0 0 4px}
  .step span{font-size:18px}
  .big{font-family:var(--head);font-weight:900;font-size:60px;line-height:1.02;margin:0}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);color:var(--muted)}
  .note{font-size:14px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.5}
  .foot{font-size:13px;color:var(--muted);margin-top:30px}
  @media(max-width:640px){.slide{padding:34px 24px}h1,.big{font-size:38px}h2{font-size:28px}.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass', h:'Why Writers Really Fail',
   s:'And the finish system that takes a book from idea to published.', by:'with Karena Akhavein'},

  {t:'who', h:'This is for you if', items:[
     'You have started a book more than once and stalled every time.',
     'You have the idea. What you do not have is the draft.',
     'You keep waiting to feel ready, inspired, or unblocked.',
     'You are done blaming the blank page and want a real plan.']},

  {t:'hook', big:true, h:'Writer’s block', strike:true,
   s:'is not why writers fail.',
   note:'It is the most believed excuse in writing. It is also the wrong diagnosis, and it keeps good books unfinished for years.'},

  {t:'part', n:'Part One', h:'The real reason your draft stalls'},

  {t:'body', h:'You were never short on ideas', items:[
     'Most unfinished books died with plenty of ideas left over.',
     'The problem was never a shortage of imagination.',
     'It was the absence of a repeatable way to keep going when the excitement wore off.']},

  {t:'body', h:'What actually stops writers', items:[
     'Mindset: treating writing as a mood instead of a practice.',
     'No plan: no map from blank page to finished manuscript.',
     'No finish system: no way to push through the messy middle.',
     'No feedback loop: revising in the dark, alone, forever.']},

  {t:'part', n:'Part Two', h:'The From Idea to Published path'},

  {t:'framework', h:'Six months. One plan.', steps:[
     {b:'Month 1', s:'Foundation: validate the idea, build the writing habit.'},
     {b:'Month 2', s:'Rough draft: a fast-drafting method that beats the blank page.'},
     {b:'Month 3', s:'Beta readers: prepare the draft for real feedback.'},
     {b:'Month 4', s:'Editing: self-editing checklists, then the right outside help.'},
     {b:'Month 5', s:'Polish: choose your publishing path, format, cover.'},
     {b:'Month 6', s:'Publish: self-publish or query, with a plan for what is next.'}]},

  {t:'body', h:'The mindset months (1 and 2)', items:[
     'We fix the thing that actually breaks: your relationship with the work.',
     'A fast-drafting method gets words down before the inner critic wakes up.',
     'You stop writing when inspired and start writing on schedule.']},

  {t:'body', h:'The craft months (3 and 4)', items:[
     'Structure, clarity, pacing, and character arcs become checklists, not mysteries.',
     'Self-editing comes first so outside editing costs less and does more.',
     'Beta feedback is gathered on purpose, not begged for at random.']},

  {t:'body', h:'The finish months (5 and 6)', items:[
     'Publishing path chosen with eyes open: self-publish or query.',
     'Formatting, cover, and launch become a sequence you can follow.',
     'You end with a finished, published book and a plan for the next one.']},

  {t:'body', h:'The 3 tools that keep you moving', items:[
     'A dictation habit so drafting outruns the inner critic.',
     'A seven-day self-editing pass that turns a messy draft into a readable one.',
     'A weekly plan so the book advances whether or not you feel like it.']},

  {t:'part', n:'Part Three', h:'What finishing actually looks like'},

  {t:'body', h:'From started-four-times to done', items:[
     'The writer who stalled for years does not need more talent.',
     'They need the plan, the finish system, and someone in their corner.',
     'That is the whole job of this masterclass and the coaching behind it.']},

  {t:'cred', h:'Who is teaching this', s:'Karena Akhavein is an author and writing coach, host of the How to be an Author podcast, and the author of Writer’s Block is Not Why Writers Fail. She coaches aspiring authors one on one and through the From Idea to Published program, and runs writing retreats in Santa Barbara.'},

  {t:'cta', h:'Your next step', s:'If you want the plan and a coach in your corner, book a free call with Karena or start the From Idea to Published program. Bring the book you keep starting. We will build the plan that finishes it.',
   disc:'Educational content only. Results vary from writer to writer. Nothing here is a guarantee of publication, sales, or income.'}
];

const deck = document.getElementById('deck');
function esc(x){return x;}
S.forEach(function(sl){
  const d = document.createElement('section');
  d.className = 'slide';
  let html = '';
  if(sl.k){ html += '<p class="kick">'+sl.k+'</p>'; }
  if(sl.n){ html += '<p class="partnum">'+sl.n+'</p>'; }
  if(sl.t==='title'){
    html += '<h1>'+sl.h+'</h1>';
    if(sl.s) html += '<p class="sub">'+sl.s+'</p>';
    if(sl.by) html += '<p class="by">'+sl.by+'</p>';
  } else if(sl.t==='hook'){
    html += '<p class="big"><span class="strike">'+sl.h+'</span> '+sl.s+'</p>';
    if(sl.note) html += '<p class="note">'+sl.note+'</p>';
  } else if(sl.t==='framework'){
    html += '<h2>'+sl.h+'</h2><div class="steps">';
    sl.steps.forEach(function(st){ html += '<div class="step"><b>'+st.b+'</b><span>'+st.s+'</span></div>'; });
    html += '</div>';
  } else if(sl.t==='part'){
    html += '<h2>'+sl.h+'</h2>';
  } else if(sl.t==='cta'){
    html += '<h2>'+sl.h+'</h2><p class="sub">'+sl.s+'</p>';
    if(sl.disc) html += '<p class="note">'+sl.disc+'</p>';
  } else if(sl.t==='cred'){
    html += '<h2>'+sl.h+'</h2><p class="sub" style="max-width:58ch">'+sl.s+'</p>';
  } else {
    if(sl.h) html += '<h2>'+sl.h+'</h2>';
    if(sl.s) html += '<p class="sub">'+sl.s+'</p>';
  }
  if(sl.items){ html += '<ul>'; sl.items.forEach(function(it){ html += '<li>'+it+'</li>'; }); html += '</ul>'; }
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
