<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Modern Excel Blueprint — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4faf6; --panel:#ffffff; --rule:#d8ebe0; --ink:#15211b;
    --muted:#4e4e4e; --accent:#19ae54; --deep:#0b5e36; --blue:#055e94;
    --head:'Space Grotesk',system-ui,sans-serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 60px}
  .slide{position:relative;background:var(--panel);border:1px solid var(--rule);
    border-radius:14px;padding:52px 54px;margin:0 0 22px;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(21,33,27,.03)}
  .slide::before{content:"";position:absolute;left:0;top:26px;bottom:26px;width:4px;
    background:var(--accent);border-radius:4px}
  .k{font-family:var(--head);font-weight:600;font-size:12.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:16px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:31px;line-height:1.12;letter-spacing:-.01em}
  .sub{font-size:19px;color:var(--muted);margin-top:18px;max-width:46ch}
  .body{font-size:18px;margin-top:16px;max-width:54ch}
  .body.big{font-size:23px;line-height:1.4;max-width:40ch;color:var(--ink)}
  ul{margin:22px 0 0;padding:0;list-style:none;max-width:60ch}
  li{position:relative;padding:12px 0 12px 30px;border-top:1px solid var(--rule);font-size:17px}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:11px;height:11px;
    background:var(--accent);border-radius:2px}
  li b{font-family:var(--head);font-weight:600}
  .stageno{font-family:var(--head);font-weight:700;color:var(--deep);font-size:15px;
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
  .grid{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .cell{flex:1;min-width:120px;border:1px solid var(--rule);border-radius:9px;padding:16px 14px;background:#fbfdfc}
  .cell .d{font-family:var(--head);font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.06em}
  .cell .l{font-size:14.5px;margin-top:6px;color:var(--ink)}
  .cell.on{background:var(--deep);border-color:var(--deep)}
  .cell.on .d{color:#bff0d2}.cell.on .l{color:#eafff1}
  .cell.off .l{color:var(--muted)}
  .foot{font-family:var(--head);font-size:12.5px;color:var(--muted);letter-spacing:.12em;
    text-transform:uppercase;position:absolute;right:30px;bottom:18px}
  .num{position:absolute;left:30px;bottom:16px;font-family:var(--head);font-size:12px;color:#9bbfa9}
  .cta h1{font-size:40px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:62ch;line-height:1.5}
  .step{font-family:var(--head);font-weight:600;color:var(--blue)}
  @media(max-width:620px){.slide{padding:34px 26px;min-height:360px}h1{font-size:32px}h2{font-size:24px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A Free 60-Minute Masterclass with Jon Acampora, Microsoft MVP',
   h:'The Modern Excel Blueprint',
   sub:'How ambitious professionals go from overworked and overlooked to the indispensable, go-to Excel expert on their team.'},

  {t:'statement', k:'Who this is for',
   big:'You use Excel every day, you keep hearing Power Query, Dynamic Arrays, and AI, and you are not sure what you actually need to know, or when the manual grind ends.'},

  {t:'problem', k:'The trap',
   h:'More hours does not make you indispensable.',
   body:'You stay late rebuilding the same report. You re-paste the same data and re-fix the same formatting every month. The work gets done, but it keeps you invisible instead of promoted. Working harder inside a broken process just buys you more of the same.'},

  {t:'statement', k:'The reframe',
   big:'The problem is not that you need more Excel tips. The internet is full of tips. What you are missing is a system.'},

  {t:'problem', k:'Part one, the real problem',
   h:'Random tips do not add up to a skill.',
   body:'A trick you saw once solves one cell, one time. It does not change how your work runs. Real leverage comes from a handful of modern skills, used together as a repeatable system that does the tedious parts for you, so your time goes to the thinking only you can do.'},

  {t:'list', k:'The three symptoms of amateur Excel',
   h:'You can feel the gap before you can name it.',
   items:['<b>You redo work.</b> The same report, rebuilt by hand, every single cycle.',
          '<b>You fear the big file.</b> More tabs and more data means more places to break.',
          '<b>You cannot delegate yourself out of it.</b> The process only lives in your head.']},

  {t:'framework', k:'Part two, the method',
   h:'The Excel Hero Framework',
   sub:'A simple four-stage journey from overwhelmed to the recognized problem-solver on your team.',
   cells:[{d:'Stage 1',l:'Foundation',on:false},{d:'Stage 2',l:'Modern formulas',on:false},
          {d:'Stage 3',l:'Automate the data',on:false},{d:'Stage 4',l:'The automation mindset',on:false}]},

  {t:'stage', no:'Stage one', h:'Build a foundation that scales.',
   body:'Structured tables, clean references, and formulas that keep working when the data grows. This is the groundwork that makes everything after it possible, and it is where most self-taught users quietly have gaps.'},

  {t:'stage', no:'Stage two', h:'Modern formulas: Dynamic Arrays.',
   body:'One formula that spills across a whole range and updates itself. You stop copying formulas down thousands of rows and start writing logic once. This is the first moment the work starts doing itself.'},

  {t:'stage', no:'Stage three', h:'Automate the data with Power Query.',
   body:'Point Power Query at your messy source once, shape it once, and then every future refresh is a single click. The monthly import, clean, and reshape ritual that eats your afternoon becomes a button. This is the heart of getting your time back.'},

  {t:'stage', no:'Stage four', h:'The Automation Mindset: macros and VBA.',
   body:'Once you think in systems, you build tools, not spreadsheets. Macros and VBA turn a repeatable process into something that runs on its own. You stop being the person who does the task and become the person who built the thing that does it.'},

  {t:'list', k:'The five critical skills',
   h:'What separates the amateur from the indispensable.',
   items:['<b>Scalable foundations</b> so nothing breaks as the file grows.',
          '<b>Dynamic Arrays</b> so you write logic once, not a thousand times.',
          '<b>Power Query</b> so data prep becomes one click, not an afternoon.',
          '<b>Automation with macros and VBA</b> so the process runs itself.',
          '<b>AI used well</b> so the buzzwords become real leverage, not noise.']},

  {t:'problem', k:'The AI era', h:'AI will not make you indispensable. A system will.',
   body:'Copilot and AI are powerful inside a clear process and useless inside a messy one. The professionals who win the AI era are the ones who already think in systems, so the AI has something solid to build on. The blueprint is what makes the tools pay off.'},

  {t:'list', k:'Part three, your week back', h:'A workweek, automated.',
   items:['<b>Monday:</b> the monthly refresh that used to take the morning is one click.',
          '<b>Wednesday:</b> the report rebuilds itself, correct, with no late-night re-paste.',
          '<b>Friday:</b> your time goes to the analysis your manager actually remembers.']},

  {t:'statement', k:'The outcome',
   big:'You become the person others bring their hardest spreadsheet to, and the one who gets handed the next opportunity because of it.'},

  {t:'why', k:'Your guide', h:'Jon Acampora',
   body:'Microsoft MVP for over 10 years. Former corporate finance analyst who lived the overtime blues and solved it with automation. Since 2010, Excel Campus has helped millions of viewers on YouTube and guided over 30,000 students to become the Excel heroes of their organizations.'},

  {t:'list', k:'The path forward', h:'From this hour to a real system.',
   items:['<b>Today:</b> leave with the five skills and the four-stage map, clear.',
          '<b>This month:</b> follow the leveled path, with an assessment and a roadmap built for where you are.',
          '<b>Ongoing:</b> practice files, a community, and monthly live sessions keep it sticking.']},

  {t:'statement', k:'Recap',
   big:'Stop collecting tips. Build the system. The five skills, run as one repeatable process, are what make you indispensable.'},

  {t:'cta', k:'Your next step', h:'Ready to build your blueprint?',
   body:'Follow the leveled, assessed path inside Elevate Excel: the five critical skills, hands-on practice files, a community, and monthly live Q&A. Start where you are and build the system that gives you your time back.',
   disc:'Educational only. No income, role, promotion, or result is guaranteed, and individual results vary based on effort, data, and circumstances. Examples shown are illustrative of the method, not a promise of outcomes.'}
];

function el(s){
  const d=document.createElement('section'); d.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.k) h+='<div class="k">'+s.k+'</div>';
  if(s.no) h+='<div class="stageno">'+s.no+'</div>';
  if(s.t==='title'||s.t==='cta') h+='<h1>'+s.h+'</h1>'; else if(s.h) h+='<h2>'+s.h+'</h2>';
  if(s.big) h+='<div class="body big">'+s.big+'</div>';
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.body) h+='<div class="body">'+s.body+'</div>';
  if(s.items){ h+='<ul>'; s.items.forEach(function(i){h+='<li>'+i+'</li>';}); h+='</ul>'; }
  if(s.cells){ h+='<div class="grid">'; s.cells.forEach(function(c){
      h+='<div class="cell'+(c.on?' on':' off')+'"><div class="d">'+c.d+'</div><div class="l">'+c.l+'</div></div>';}); h+='</div>'; }
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="foot">The Modern Excel Blueprint</div>';
  d.innerHTML=h; return d;
}
const deck=document.getElementById('deck');
S.forEach(function(s,i){ const n=el(s); const num=document.createElement('div');
  num.className='num'; num.textContent=(i+1)+' / '+S.length; n.appendChild(num); deck.appendChild(n); });
</script>
</body>
</html>
