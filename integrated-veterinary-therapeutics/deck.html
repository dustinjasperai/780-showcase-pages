<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is Your Horse Misbehaving, Or Communicating? | Equine Functional Posture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f1e7;        /* tan-cream, from brand footer tan #ccb89a */
    --panel:#ece2d2;     /* deeper warm tan neutral, from #ccb89a */
    --ink:#2a1030;       /* deep aubergine, from brand #421255 */
    --muted:#6a5a66;
    --accent:#581772;    /* brand purple (brand.json #581772) */
    --gold:#c8961e;      /* muted draw of brand gold #f1c40f */
    --rule:#ddd2c4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Karla",system-ui,sans-serif;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:#fffdf9;border:1px solid var(--rule);border-radius:14px;
    padding:48px 52px;margin:22px 0;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(42,16,48,.03),0 18px 40px -30px rgba(42,16,48,.35);
    position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .slide.title::before,.slide.cta::before{width:0}
  h1,h2,h3{font-family:"PT Serif",Georgia,serif;font-weight:700;line-height:1.14;letter-spacing:-.01em}
  .eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12.5px;color:var(--accent)}
  .slide.title{background:var(--ink);color:#f7efe6;align-items:flex-start}
  .slide.title h1{font-size:46px;color:#fff;max-width:18ch}
  .slide.title .eyebrow{color:var(--gold)}
  .slide.title .sub{margin-top:18px;font-size:19px;color:#e5d7e2;max-width:40ch}
  .slide.title .by{margin-top:26px;font-size:15px;color:#c9b4c6;letter-spacing:.02em}
  h2{font-size:33px;max-width:22ch}
  .kicker{font-size:16px;color:var(--muted);margin-top:14px;max-width:52ch}
  ul{margin-top:26px;list-style:none;display:flex;flex-direction:column;gap:14px;max-width:60ch}
  li{position:relative;padding-left:30px;font-size:18.5px}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
  li b{font-weight:700}
  .big{font-family:"PT Serif",Georgia,serif;font-size:34px;font-weight:700;line-height:1.2;max-width:24ch}
  .part .eyebrow{color:var(--gold)}
  .part{background:linear-gradient(180deg,#fffdf9,#f7f1e9)}
  .pill{display:inline-block;background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:18px;letter-spacing:.02em}
  .cta{background:var(--accent);color:#fff}
  .cta::before{width:0}
  .cta h2{color:#fff;font-size:34px}
  .cta .step{margin-top:22px;font-size:20px;color:#f0e6f3;max-width:46ch}
  .cta .step b{color:#fff}
  .disclaimer{margin-top:30px;font-size:12.5px;color:#d9c7df;max-width:60ch;line-height:1.5}
  .num{font-family:"PT Serif",Georgia,serif;color:var(--gold);font-size:15px;font-weight:700;margin-bottom:10px}
  .foot{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--muted);letter-spacing:.03em}
  @media (max-width:640px){.slide{padding:34px 26px}.slide.title h1{font-size:34px}h2{font-size:26px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:"A Free Live Masterclass",
    h1:"Is Your Horse Misbehaving, Or Communicating?",
    sub:"The hidden physical issues behind the five most common behaviour problems, and how to read them before you blame the attitude.",
    by:"With Dr Raquel Butler, BVSc, Biomechanical Medicine Veterinarian" },

  {t:'promise', num:"In the next hour",
    h2:"What you will walk away with",
    items:[
      "<b>How to tell a behaviour problem from a physical one</b>, so you stop guessing",
      "<b>Three at-home posture checks</b> you can run on your horse tonight",
      "<b>The first step</b> to restoring functional posture, movement and calm" ] },

  {t:'whofor', num:"Who this is for",
    h2:"This will land if any of these sound familiar",
    items:[
      "You have been told your horse is lazy or naughty, but something feels off",
      "He resists the farrier, or will not stand still",
      "You are tired of yet another treatment or training technique that does not stick",
      "You believe horses deserve care that looks at the whole picture, not just the symptom" ] },

  {t:'problem', num:"The trap",
    h2:"We label it, drill it, and treat the symptom",
    kicker:"When a horse spooks, girths up, shuts down or refuses, the usual response is more pressure, more training, more management. The behaviour gets a name, naughty, difficult, lazy, and the real cause stays hidden. Nothing sticks, because we have been answering the wrong question." },

  {t:'hook',
    big:"What if the behaviour was never the problem? What if it was the only language he had?" },

  {t:'part', num:"Part one",
    h2:"The body is the hidden variable",
    kicker:"As a biomechanical medicine vet I have seen it again and again: poor posture, pain and physical imbalance show up as what we call bad behaviour. The horse is not being difficult. His body is doing the talking, and posture is how we read it." },

  {t:'chain', num:"The chain most owners miss",
    h2:"Posture, nervous system, behaviour",
    items:[
      "<b>Postural instability</b> changes how the body loads and braces",
      "That shifts the <b>nervous system</b> toward guarding and tension",
      "Which surfaces as <b>the behaviour</b>: spooking, resistance, shutdown" ] },

  {t:'list', num:"Read these as signals",
    h2:"Five behaviour problems that are really the body",
    items:[
      "Spooking at nothing",
      "Girthiness and bracing",
      "Shutting down and going flat",
      "Resisting the aids",
      "Being called lazy" ] },

  {t:'part', num:"Part two",
    h2:"Functional Posture: the framework",
    kicker:"Functional posture is a horse's ability to stand and move in a way that supports the body, not fight it. Restore it, and behaviour, movement and wellbeing follow. Here is how we build it." },

  {t:'pillar', num:"Pillar 01",
    h2:"Postural Assessment",
    kicker:"Learning to read a horse's default standing posture, what is loaded, what is bracing, what is avoided, so you can see the physical story before anyone calls it behaviour." },

  {t:'pillar', num:"Pillar 02",
    h2:"Physical Assessment",
    kicker:"A hands-on evaluation of the body: where there is tension, restriction and pain, so the plan fits this horse rather than a generic routine." },

  {t:'pillar', num:"Pillar 03",
    h2:"Feed to Form",
    kicker:"What is in the bucket shapes the frame. How nutrition supports or undermines posture, topline and the capacity to move well." },

  {t:'pillar', num:"Pillar 04",
    h2:"Spinal Mobilisations",
    kicker:"Gentle, specific work to restore movement through the spine, so the body has the range it needs to hold a healthier posture." },

  {t:'pillar', num:"Pillar 05",
    h2:"The Dance Steps, and The Dance",
    kicker:"The foundational in-hand movements, and the integrated routine they build into, that rebuild functional posture from the ground. This is where the change becomes the horse's new normal." },

  {t:'part', num:"Part three",
    h2:"When the body can finally speak, and is heard",
    kicker:"A horse that feels better, moves better and behaves better. The spook settles, the brace softens, the trust comes back. Not because he was corrected, but because he was finally understood." },

  {t:'checks', num:"Try it tonight",
    h2:"Three at-home checks",
    items:[
      "<b>Stand and watch:</b> where does he rest his weight, and is it even",
      "<b>The topline read:</b> what the back and neck are telling you",
      "<b>The ask:</b> watch the first response to a simple request, before the habit kicks in" ] },

  {t:'credibility', num:"Why me",
    h2:"Dr Raquel Butler",
    kicker:"Biomechanical medicine veterinarian, BVSc from Melbourne University, with postgraduate training in animal biomechanical medicine, equine rehabilitation and taping. Mentored by Dr Ian Bidstrup and Dr Sharon May-Davis, equine science lecturer, and host of The Equine Functional Posture Podcast. My own horses, the ones who bucked, reared and refused, are what led me here. They were not difficult. They were in pain, and no one was reading the body." },

  {t:'recap', num:"The one idea to keep",
    h2:"Behaviour is communication. Read the body first.",
    kicker:"Before you blame the attitude, check the posture. Most of the problems we train away or treat away are the body asking for help in the only language it has." },

  {t:'cta',
    eyebrow:"Your next step",
    h2:"Learn to read and rebuild your horse's functional posture",
    step:"Join the <b>Equine Functional Posture</b> seven week live course, and start turning what you learned tonight into a horse that feels better, moves better and behaves better.",
    disclaimer:"This masterclass is educational and is not a substitute for veterinary diagnosis or treatment. Always consult your own veterinarian about your horse. No specific result is guaranteed and results vary from horse to horse." }
];

const deck = document.getElementById("deck");
function esc(s){return s==null?"":s}
S.forEach((s,i)=>{
  const el = document.createElement("section");
  el.className = "slide " + s.t;
  let h = "";
  if(s.eyebrow) h += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.num) h += `<div class="num">${esc(s.num)}</div>`;
  if(s.t==="title"){
    h += `<h1>${esc(s.h1)}</h1>`;
    if(s.sub) h += `<div class="sub">${esc(s.sub)}</div>`;
    if(s.by) h += `<div class="by">${esc(s.by)}</div>`;
  } else if(s.t==="hook"){
    h += `<div class="big">${esc(s.big)}</div>`;
  } else {
    if(s.h2) h += `<h2>${esc(s.h2)}</h2>`;
    if(s.kicker) h += `<div class="kicker">${esc(s.kicker)}</div>`;
    if(s.step) h += `<div class="step">${esc(s.step)}</div>`;
    if(s.items){
      h += "<ul>" + s.items.map(x=>`<li>${x}</li>`).join("") + "</ul>";
    }
    if(s.disclaimer) h += `<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  }
  h += `<div class="foot">${i+1} / ${S.length}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
