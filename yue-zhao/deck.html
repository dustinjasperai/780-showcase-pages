<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outsmart the Room — The Uncommon Executive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f6;        /* their off-white ground */
    --panel:#ffffff;
    --rule:#cbe1e6;      /* their pale blue hairline */
    --ink:#192e34;       /* their dark teal-black */
    --muted:#4a5a60;
    --accent:#002253;    /* their deep navy, brand signature */
    --spark:#325d68;     /* their teal, secondary accent */
    --serif:'Petrona',Georgia,serif;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px;margin:0 0 26px;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .kick{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--spark);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;line-height:1.08;color:var(--accent);letter-spacing:-.01em}
  .lede{font-family:var(--serif);font-weight:500;font-size:27px;line-height:1.28;color:var(--ink)}
  p{font-size:18px;color:var(--muted);max-width:60ch}
  .big{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.2;color:var(--ink);max-width:26ch}
  .promise{margin-top:22px;font-size:19px;color:var(--muted);max-width:54ch}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  ul li{position:relative;padding-left:26px;font-size:19px;color:var(--ink);max-width:60ch}
  ul li:before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;border-radius:2px;background:var(--accent)}
  .frame{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;margin-top:10px}
  .tag{font-family:var(--serif);font-weight:700;font-size:38px;color:var(--spark);line-height:1;white-space:nowrap}
  .fh{font-family:var(--serif);font-weight:600;font-size:28px;color:var(--accent);margin-bottom:8px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}
  .cols .box{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:22px}
  .cols .box .lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
  .cols .box .val{font-family:var(--serif);font-size:21px;color:var(--ink);line-height:1.3}
  .stat{display:flex;gap:40px;flex-wrap:wrap;margin-top:28px}
  .stat .s .n{font-family:var(--serif);font-weight:700;font-size:38px;color:var(--accent)}
  .stat .s .l{font-size:14px;color:var(--muted);margin-top:4px;max-width:18ch}
  .quote{font-family:var(--serif);font-style:italic;font-weight:500;font-size:28px;color:var(--ink);line-height:1.3;max-width:32ch}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:66ch;line-height:1.5}
  .ctaband{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;padding:14px 26px;border-radius:999px}
  .foot{position:absolute;bottom:20px;left:56px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kick:'The Uncommon Executive · Live Masterclass',h:'Outsmart the Room',promise:'Executive presence and influence for women and minority leaders, in the age of AI. The 60 minutes that change how the room reads you.'},
  {t:'who',kick:'Who this is for',big:'You lead the work. You just are not being seen as the leader.',body:'Senior managers, directors, and principal individual contributors who are ready for VP and the C-suite, and keep hearing the same quiet note: strong executor, not quite executive yet.'},
  {t:'trap',kick:'The trap',big:'Strong reviews. Shipped results. Still passed over.',body:'You have done everything the playbook said. The work is excellent. And somehow the promotion, the airtime, the sponsorship keep going to someone who talks less and delivers less.'},
  {t:'reframe',kick:'The reframe',h:'You are not being passed over for competence.',promise:'You are being mis-read. Rooms decide who looks like leadership material in seconds, long before they weigh the work. For women and minority leaders that read often starts tilted. This hour is how you set it straight.'},
  {t:'part',kick:'Part one',h:'The room reads you before you speak.'},
  {t:'body',kick:'Why the mis-read happens',lede:'Three quiet forces decide the read.',list:['Attention: in a full room, the clearest signal wins, not the deepest work.','Attribution: your wins get spread around, your stumbles stick to your name.','Pattern-match: leadership gets pictured as someone who may not look like you.'],body:'None of this is about your ability. It is about how the signal travels. And signal is a skill you can build.'},
  {t:'part',kick:'Part two',h:'The system: four frameworks, then AI to run them.'},
  {t:'frame',kick:'Framework one',tag:'90s',fh:'The Executive 90',body:'Turn any update into a tight, confident 90-second story that earns senior attention and signals you are ready for the next level. Lead with the decision, not the backstory.'},
  {t:'frame',kick:'Framework two',tag:'BLUF',fh:'Bottom line up front, then SCR',body:'Structure the message so the point lands and sticks: Bottom Line Up Front, then Situation, Complication, Resolution for the hard questions. Clarity under pressure reads as authority.'},
  {t:'frame',kick:'Framework three',tag:'4P',fh:'The 4P delivery model',body:'Pace, Pitch, Pause, Posture. The same sentence lands as nervous or as decided depending on delivery. These four dials are learnable, and they move the read fast.'},
  {t:'frame',kick:'Framework four',tag:'MAP',fh:'Influence maps',body:'The informal org chart holds more power than the real one. Map who decides, who influences, and what each person needs to hear, so you spend your airtime where it moves the decision.'},
  {t:'ai',kick:'The amplifier',h:'Hand the frameworks to AI.',promise:'Once the structures are yours, AI turns rambling voice notes into crisp, tailored updates in seconds, drafts the stakeholder message in each person’s language, and runs your reps between real rooms. The frameworks make you clear. AI makes you fast.'},
  {t:'part',kick:'Part three',h:'Presence, once the frameworks are yours.'},
  {t:'cols',kick:'Before and after',cols:[['Before','You over-explain, then watch the room move on. Your update is accurate and forgettable.'],['After','You open with the decision in one line. The room leans in. The follow-up goes to you.']]},
  {t:'body',kick:'A worked example',lede:'The 90-second summary, live.',list:['One line: the decision you need and why now.','One line: the single risk, and how you have handled it.','One line: what you need from the people in the room.'],body:'Three sentences, delivered with the 4P dials. That is often the whole difference between being heard and being overlooked.'},
  {t:'why',kick:'Why learn this from Yue',big:'Built the rooms. Now I coach you into them.',stat:[['CPTO','ex-Meta, Thumbtack, McKinsey'],['300+','leaders coached since 2016'],['6-9','average months to promotion'],['94%','renewal and upgrade rate']],body:'Harvard MBA. I led product at Instagram and SMB Ads at Meta, and I have sat on the side of the table that decides who rises. These are the moves that actually change the read.'},
  {t:'quote',kick:'In their words',quote:'One of the most powerful executive coaches I have ever encountered.',body:'The frameworks are simple on purpose. The work is using them when the room is full and the stakes are real.'},
  {t:'cta',kick:'Your next step',h:'Get read as the leader you already are.',promise:'Outsmart the Room is a live masterclass on executive presence and influence in the age of AI. Bring one high-stakes conversation you have coming up. You will leave with your 90-second summary written and ready to use.',cta:'Save your seat with The Uncommon Executive',disc:'Educational content only. Outcomes depend on your own effort, role, and circumstances; no specific promotion, compensation, or career result is promised or guaranteed. Individual experiences vary.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  h+='<span class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</span>';
  if(s.kick)h+='<div class="kick">'+s.kick+'</div>';
  if(s.h)h+='<h1 style="font-size:'+(s.t==='title'?54:40)+'px">'+s.h+'</h1>';
  if(s.promise)h+='<div class="promise">'+s.promise+'</div>';
  if(s.big)h+='<div class="big">'+s.big+'</div>';
  if(s.lede)h+='<div class="lede">'+s.lede+'</div>';
  if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.tag){h+='<div class="frame"><div class="tag">'+s.tag+'</div><div><div class="fh">'+s.fh+'</div><p>'+s.body+'</p></div></div>';}
  if(s.body && !s.tag)h+='<p style="margin-top:18px">'+s.body+'</p>';
  if(s.cols){h+='<div class="cols">';s.cols.forEach(c=>h+='<div class="box"><div class="lab">'+c[0]+'</div><div class="val">'+c[1]+'</div></div>');h+='</div>';}
  if(s.stat){h+='<div class="stat">';s.stat.forEach(x=>h+='<div class="s"><div class="n">'+x[0]+'</div><div class="l">'+x[1]+'</div></div>');h+='</div>';}
  if(s.quote)h+='<div class="quote">&ldquo;'+s.quote+'&rdquo;</div>';
  if(s.cta)h+='<div class="ctaband">'+s.cta+'</div>';
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  if(s.t==='title'||s.t==='cta')h+='<div class="foot">The Uncommon Executive · theuncommonexecutive.com</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
