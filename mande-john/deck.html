<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Close the Gap · Mande John, Learn to Thrive with ADHD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f9f9f9; --panel:#ffffff; --rule:#e5e7eb;
    --acc:#ff1e4f; --spark:#ffd51e; --ink:#0b1528; --body:#3a4152; --dim:#8b91a0; --cream:#f4f4f4;
  }
  html,body{height:100%}
  body{background:#eceef2;font-family:'Montserrat',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eceef2}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Noto Serif',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.66;font-weight:400}
  .sub{font-family:'Noto Serif',serif;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),var(--spark));margin-top:3.6vh;border-radius:3px}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#122142 0%,#0b1528 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#122142 0%,#0b1528 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Montserrat',sans-serif;color:#d8dce6;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .lp-motif{position:absolute;pointer-events:none}
  .title-lp{right:7.5%;bottom:8%;width:15vw;opacity:.95}
  .corner-lp{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(11,21,40,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Learn to Thrive with ADHD</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- review-loop motif: a planner tick inside a returning loop, drawn in the brand pink -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lp" viewBox="0 0 120 120">
  <g fill="none" stroke="#ff1e4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 44 A40 40 0 1 0 100 72" opacity="0.9"/>
    <path d="M96 30 L96 46 L80 46" opacity="0.9"/>
    <path d="M44 62 L56 74 L80 46" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Close the Gap',sub:'Why you already know what to do, and the two-part system that finally makes it stick for adults with ADHD.',brand:true,lp:'title'},
 {t:'normal',k:'Who this is for',title:'You know exactly what to do. Doing it is the part that keeps breaking.',body:'You have read the books, bought the planners, and can explain the strategies better than the people selling them. And still, the follow-through collapses somewhere between knowing and doing. If that gap is the story of your week, this hour is for you.'},
 {t:'dark',title:'The problem was never that you did not know. Knowing was never the hard part.'},

 {t:'section',idx:'Part One',title:'The Knowing-Doing Gap'},
 {t:'normal',k:'It is not a knowledge problem',title:'More tips will not close a gap that tips did not open.',body:'Every new hack works for about a week, then quietly joins the pile of things that used to work. That is not a you problem, and it is not a discipline problem. The gap you keep falling into sits between knowing what to do and actually doing it, and no amount of new information reaches across it.'},
 {t:'normal',k:'Why willpower keeps failing',title:'Willpower is the most expensive tool in an ADHD brain, and the first to run out.',body:'When the only plan is try harder, every task is paid for in effort you do not reliably have. The brain that runs on interest and urgency will not be bullied into consistency. Willpower is not the system. It is what you burn when the system is missing.'},
 {t:'dark',title:'You are not lazy, and you are not failing. You are running a system built for a brain that is not yours.'},

 {t:'section',idx:'Part Two',title:'The Two-Part System'},
 {t:'normal',k:'Part one, executive function',title:'Build the outside scaffolding so your brain does not have to hold it all.',body:'The first half is executive function you can see and touch. A weekly plan treated as a draft and a best guess, not a promise. Working memory offloaded into calendars, voice notes, and visual timers. An environment designed so the right thing is the easy thing, and attention resets that are small enough to actually take. You stop relying on remembering.'},
 {t:'normal',k:'Part two, mind management',title:'Then do the inside work, because self-doubt undoes every system you build.',body:'The half most ADHD advice skips is the mind. The belief that you always drop the ball, that you cannot be trusted with your own plans, that this time will end like the last. Mind management is how you challenge those thoughts on purpose and rebuild self-trust, because you are not your ADHD, and the story you tell about yourself is running in the background either way.'},
 {t:'normal',k:'The Three R’s',title:'Review, Revise, Recommit: the weekly loop that keeps the system alive.',body:'A plan is a living draft, so it needs a short feedback loop instead of an all-or-nothing verdict. Once a week you review what actually happened, revise the plan to fit the real you, and recommit to the next small stretch. The loop is where the two halves meet, and it is what keeps a good week from being a fluke.'},
 {t:'normal',k:'Don’t miss twice',title:'Consistency for an ADHD brain is not perfection. It is coming back fast.',body:'You will miss. Everyone does, and an all-or-nothing brain treats one miss as proof the whole thing is over. The skill is simply not missing twice in a row. Come back the next day, and each return quietly rebuilds the self-trust that a broken streak used to burn down.'},
 {t:'dark',title:'Consistency was never about never missing. It was about how fast you come back.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The person this builds',title:'Follow-through that survives a bad week, and self-trust that survives a setback.',body:'When the scaffolding holds the details and the mind work holds you, a hard week stops being a collapse. You keep the plan because it was built for your brain, you come back faster when you slip, and the strengths of an ADHD mind finally get to show up, because they are no longer buried under the shame of not following through.'},
 {t:'dark',title:'You are not your ADHD. You are the person who finally learned to work with it.'},
 {t:'normal',k:'Why Mande John',title:'A certified coach who lived the gap, then built the way across it.',body:'Mande spent years on the wrong side of this gap, where severe ADHD symptoms tipped into depression and anxiety and falling short felt like the pattern. Coaching changed that. She is now a certified life coach through The Life Coach School, holds advanced ADHD training through PESI, coaches trauma-informed, and teaches this every week on the Learn to Thrive with ADHD podcast, as a happy adult, entrepreneur, and present parent with ADHD.'},

 {t:'section',idx:'Your Next Step',title:'Learn to Thrive with ADHD'},
 {t:'normal',k:'Keep going with Mande',title:'Take the system further, with coaching built around your brain.',body:'This hour is the map. The free ADHD Productivity Cheat Sheet is a simple place to start today, and one-on-one coaching is how you build the two-part system into your actual life, with someone who has ADHD, gets the gap, and will help you close it.'},
 {t:'cta',title:'Ready to close the gap between knowing and doing?',body:'Take the next step with Learn to Thrive with ADHD.',chips:['Get the free ADHD Cheat Sheet','Book a coaching consultation'],disc:'Educational content for adults with ADHD. Nothing here is medical advice or a substitute for diagnosis or treatment, and no specific result is guaranteed. Results vary by person.'},
];

const deck=document.getElementById('deck');
function lp(kind){return `<svg class="lp-motif ${kind==='title'?'title-lp':'corner-lp'}"><use href="#lp"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Learn to Thrive <b>with ADHD</b> · Mande John</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.lp) h+=lp(s.lp);
  else if(s.t==='title') h+=lp('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
