<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Prompt-to-Profit Method - A Live Masterclass with RhondaJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palette derived from rhondaj.com (brand.json): accent #85954f = dominant brand hex / H1 color (46 uses);
       spark #f595a7 = brand pink (16 uses); light scheme (brand reads light/feminine). */
    --bg:#f6f4ec;        /* warm cream ground */
    --panel:#eceadb;     /* pale sage-cream panel */
    --rule:#d9d6c4;      /* soft rule */
    --ink:#2f2d28;       /* warm near-black text */
    --muted:#6f6c61;     /* muted text */
    --accent:#85954f;    /* sage green - dominant brand color */
    --accent-deep:#5f6c38;
    --spark:#f595a7;     /* brand pink spark */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Spectral',Georgia,serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:1040px;animation:fade .4s ease}
  .slide.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1,h2,h3,.kicker,.cta-big,.pillar h3,.num{font-family:'Poppins',system-ui,sans-serif}
  .kicker{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-bottom:1.1rem}
  h1{font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.05;font-weight:700;letter-spacing:-.01em}
  h2{font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.12;font-weight:600;letter-spacing:-.01em}
  .lede{font-size:clamp(1.1rem,1.8vw,1.4rem);color:var(--muted);margin-top:1.3rem;max-width:40ch;line-height:1.5}
  .big{font-size:clamp(1.6rem,3.2vw,2.5rem);line-height:1.2;font-weight:500;max-width:22ch}
  .big .hi{color:var(--accent-deep);font-weight:600}
  .accentbar{width:68px;height:6px;border-radius:6px;background:var(--accent);margin:0 0 1.6rem}
  .accentbar.pink{background:var(--spark)}
  .title-wrap{border-left:10px solid var(--accent);padding-left:2.2rem}
  .brandline{margin-top:2.4rem;font-family:'Poppins',sans-serif;font-weight:500;color:var(--muted);font-size:1rem}
  .brandline b{color:var(--accent-deep)}
  ul.clean{list-style:none;margin-top:1.6rem;display:grid;gap:1rem;max-width:42ch}
  ul.clean li{position:relative;padding-left:1.8rem;font-size:1.18rem;line-height:1.45}
  ul.clean li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:3px;background:var(--spark)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:2rem}
  .pillar{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:1.5rem 1.4rem}
  .pillar .num{font-size:.8rem;font-weight:700;color:var(--spark);letter-spacing:.1em}
  .pillar h3{font-size:1.18rem;font-weight:600;margin:.5rem 0 .6rem;line-height:1.2}
  .pillar p{font-size:.98rem;color:var(--muted);line-height:1.45}
  .arc{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:2.2rem}
  .arc .step{background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:.7rem 1.3rem;font-family:'Poppins',sans-serif;font-weight:500}
  .arc .to{color:var(--accent);font-family:'Poppins',sans-serif;font-weight:700}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center}
  .panelcard{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:1.6rem}
  .panelcard h3{font-family:'Poppins',sans-serif;font-weight:600;margin-bottom:.5rem}
  .panelcard.quiet{opacity:.72}
  .panelcard p{color:var(--muted);line-height:1.5}
  .cta-big{font-size:clamp(1.3rem,2.4vw,2rem);font-weight:600;color:var(--accent-deep);margin-top:1.4rem}
  .disc{margin-top:2.2rem;font-size:.82rem;color:var(--muted);max-width:60ch;line-height:1.5;border-top:1px solid var(--rule);padding-top:1.1rem}
  .foot{position:fixed;left:7vw;bottom:3.2vh;font-family:'Poppins',sans-serif;font-size:.78rem;color:var(--muted);letter-spacing:.04em}
  .count{position:fixed;right:7vw;bottom:3.2vh;font-family:'Poppins',sans-serif;font-size:.78rem;color:var(--muted)}
  .nav{position:fixed;right:7vw;top:3.2vh;display:flex;gap:.5rem}
  .nav button{font-family:'Poppins',sans-serif;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:10px;width:40px;height:38px;font-size:1.1rem;cursor:pointer}
  .nav button:hover{border-color:var(--accent);color:var(--accent-deep)}
  @media(max-width:760px){.cards{grid-template-columns:1fr}.two{grid-template-columns:1fr}.title-wrap{border-left-width:6px;padding-left:1.2rem}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button id="prev" aria-label="Previous">&#8249;</button><button id="next" aria-label="Next">&#8250;</button></div>
<div class="foot">RhondaJ&#8217;s Creative AI &#183; Live Masterclass</div>
<div class="count"><span id="cur">1</span> / <span id="tot">1</span></div>
<script>
const S = [
  {t:'title', html:`
    <div class="title-wrap">
      <div class="kicker">A Live Masterclass with RhondaJ</div>
      <h1>The Prompt-to-Profit Method</h1>
      <div class="lede">How to turn an AI design into a digital product people actually buy, even if you are starting from zero.</div>
      <div class="brandline">Create More. Stress Less. <b>Sell Smarter.</b></div>
    </div>`},

  {t:'who', html:`
    <div class="accentbar"></div>
    <div class="kicker">Who this is for</div>
    <h2>For the creator who makes beautiful AI designs that nobody buys.</h2>
    <ul class="clean">
      <li>You have learned the AI tools and your designs look great.</li>
      <li>You have a shop, or you are about to open one.</li>
      <li>And it is quiet. The sales just are not coming.</li>
    </ul>`},

  {t:'trap', html:`
    <div class="accentbar pink"></div>
    <div class="kicker">The trap</div>
    <div class="big">You did everything the tutorials said. You learned Midjourney. You made gorgeous art. <span class="hi">So why is the shop still empty?</span></div>`},

  {t:'content', html:`
    <div class="accentbar"></div>
    <div class="kicker">What the quiet costs</div>
    <h2>It is not just lost sales.</h2>
    <ul class="clean">
      <li>Hours poured into designs that never find a buyer.</li>
      <li>A folder full of art you are proud of and nobody sees.</li>
      <li>And slowly, the quiet little thought: maybe this just is not for me.</li>
    </ul>`},

  {t:'reframe', html:`
    <div class="kicker">The hard truth</div>
    <h1>Pretty is not the product.<br><span style="color:var(--accent-deep)">Sellable is.</span></h1>
    <div class="lede">Most creators are one skill away from sales. It is not better art. It is making art that was built to sell.</div>`},

  {t:'part', html:`
    <div class="accentbar"></div>
    <div class="kicker">Part One</div>
    <h1>Why most AI designs never sell</h1>`},

  {t:'content', html:`
    <div class="kicker">Three quiet reasons</div>
    <h2>It is almost never the art.</h2>
    <div class="cards">
      <div class="pillar"><div class="num">01</div><h3>No proven niche</h3><p>The design is lovely, but nobody is actually searching for it. The idea came first, the buyer never did.</p></div>
      <div class="pillar"><div class="num">02</div><h3>It reads as AI art</h3><p>It looks like a generated image, not a product someone pictures in their home, their planner, or their brand.</p></div>
      <div class="pillar"><div class="num">03</div><h3>No real presentation</h3><p>A flat PNG on a white square. No mockup, no context, nothing that makes a browser feel the value.</p></div>
    </div>`},

  {t:'reframe', html:`
    <div class="accentbar pink"></div>
    <div class="big">Fix those three and the same skills you already have start making sales. <span class="hi">That is a system, not a talent.</span></div>`},

  {t:'reframe', html:`
    <div class="kicker">The shift</div>
    <h1>Stop making art you hope sells.<br><span style="color:var(--accent-deep)">Start making products built to.</span></h1>
    <div class="lede">One is a gamble every time. The other is a path you can walk again and again.</div>`},

  {t:'part', html:`
    <div class="accentbar"></div>
    <div class="kicker">Part Two</div>
    <h1>The Prompt-to-Profit system</h1>
    <div class="lede">Three pieces that take you from a blank prompt box to a product that is ready to list.</div>`},

  {t:'pillars', html:`
    <div class="kicker">The three pieces</div>
    <div class="cards">
      <div class="pillar"><div class="num">PIECE 01</div><h3>The Creative AI Prompt Library</h3><p>Prompts engineered to produce sellable, on-trend designs, not random art. The prompt does the heavy lifting so you ship a listing-ready design the same day.</p></div>
      <div class="pillar"><div class="num">PIECE 02</div><h3>Custom GPTs for sellers</h3><p>Purpose-built tools that turn a niche idea into listing-ready assets, so you never stare at an empty prompt box wondering where to start.</p></div>
      <div class="pillar"><div class="num">PIECE 03</div><h3>Evergreen Niche Vaults + mockups</h3><p>Proven niches that sell all year, plus smart-object PSD mockups, so you skip the research and present every product like a premium brand.</p></div>
    </div>`},

  {t:'arc', html:`
    <div class="accentbar"></div>
    <div class="kicker">How it flows</div>
    <h2>One simple path, every time.</h2>
    <div class="arc">
      <span class="step">Pick a proven niche</span><span class="to">&#8594;</span>
      <span class="step">Run the prompt</span><span class="to">&#8594;</span>
      <span class="step">Drop it in a mockup</span><span class="to">&#8594;</span>
      <span class="step">List it</span>
    </div>
    <div class="lede">The same four steps, repeatable, so making your next product stops feeling like starting over.</div>`},

  {t:'part', html:`
    <div class="accentbar"></div>
    <div class="kicker">Part Three</div>
    <h1>What a sellable listing looks like</h1>`},

  {t:'twopanel', html:`
    <div class="kicker">The difference is presentation</div>
    <h2>Same file. Different outcome.</h2>
    <div class="two" style="margin-top:1.6rem">
      <div class="panelcard quiet"><h3>Just the file</h3><p>A flat image on a white background. The buyer has to imagine the value, and most will not bother.</p></div>
      <div class="panelcard"><h3>In a smart-object mockup</h3><p>The same design shown in context, on the mug, the wall, the planner. Now the buyer sees exactly what they are getting, and a $3 file reads as premium.</p></div>
    </div>`},

  {t:'why', html:`
    <div class="accentbar pink"></div>
    <div class="kicker">Why I teach it this way</div>
    <div class="big">I built RhondaJ&#8217;s Creative AI around one idea: <span class="hi">beginners do not need more talent, they need a system that makes the design sellable.</span></div>
    <div class="lede">Everything inside my community, the prompt library, the custom GPTs, the niche and mockup vaults, exists to make that path simple and repeatable.</div>`},

  {t:'recap', html:`
    <div class="accentbar"></div>
    <div class="kicker">The whole method, in one breath</div>
    <ul class="clean">
      <li>Start from a proven, evergreen niche, not a guess.</li>
      <li>Run a prompt built to sell, not just to look good.</li>
      <li>Present it in a mockup so the value is obvious.</li>
      <li>Repeat the same four steps for every product.</li>
    </ul>`},

  {t:'content', html:`
    <div class="accentbar pink"></div>
    <div class="kicker">What you walk away with</div>
    <h2>By the end, you will have more than notes.</h2>
    <div class="cards">
      <div class="pillar"><div class="num">01</div><h3>A product idea you trust</h3><p>Pulled from a proven, evergreen niche, so you are not betting on a guess.</p></div>
      <div class="pillar"><div class="num">02</div><h3>A repeatable path</h3><p>The same four steps you can run for the next product, and the one after that.</p></div>
      <div class="pillar"><div class="num">03</div><h3>A listing that sells</h3><p>Presented in a mockup so a browser instantly sees the value and clicks buy.</p></div>
    </div>`},

  {t:'cta', html:`
    <div class="kicker">Your next step</div>
    <h1>Come build your first sellable product with me.</h1>
    <div class="cta-big">Join RhondaJ&#8217;s Creative AI Community &#8594; the Creative Learning Lab &amp; the AI Profit Society</div>
    <div class="lede">Get the prompt library, the custom GPTs, the niche and mockup vaults, and a room of creators building alongside you.</div>
    <div class="disc">Educational only. This masterclass teaches a creative and selling method. It is not a guarantee of income or results, and your results will vary based on your effort, your niche, and your market.</div>`}
];

const stage=document.getElementById('stage');
stage.innerHTML = S.map((s,i)=>`<section class="slide${i===0?' on':''}" data-t="${s.t}">${s.html}</section>`).join('');
const slides=[...document.querySelectorAll('.slide')];
document.getElementById('tot').textContent=slides.length;
let i=0;
function go(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));document.getElementById('cur').textContent=i+1}
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
</script>
</body>
</html>
