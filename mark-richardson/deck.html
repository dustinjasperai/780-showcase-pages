<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Is Your Remodeling Business Actually Fit to Grow? · Mark Richardson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f7f7; --panel:#eeece4; --rule:#ddd9cd;
    --acc:#283878; --ink:#1b1b1b; --ink-dim:#5a5a5a; --chalk:#f7f7f7; --grey:#4a4a4a;
  }
  html,body{height:100%}
  body{background:#0c0c0c;font-family:'Roboto',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0c0c0c}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Zilla Slab',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.1vw;max-width:88%}
  .t-normal h1{font-size:3.2vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Roboto',sans-serif;font-size:1.4vw;font-weight:600;color:var(--acc);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#2c3a72 0%,#0d0e1c 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:86%;font-style:italic;color:#f2f1ec;font-family:'Zilla Slab',Georgia,serif;font-weight:500}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#2c3a72 0%,#0d0e1c 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:82%;color:#f2f1ec}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#c7cef2;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--ink-dim);font-style:italic;text-align:center;line-height:1.4}
  .t-dark .disc,.t-cta .disc{color:#a9aecb}
  .t-title .disc,.t-normal .disc{text-align:left}
  .vitals-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-vitals{right:7.5%;bottom:8%;width:20vw}
  .corner-vitals{right:6%;bottom:7.5%;width:9vw;opacity:.5}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#8a8a8a;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a8a8a;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#8a8a8a;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Remodeling Mastery</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- vitals motif: an ascending checkup line with a pulse notch, echoing the fitness/health-checkup metaphor -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vitals" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="128" x2="246" y2="128" stroke="#283878" opacity="0.22"/>
    <polyline points="20,110 60,110 76,72 96,132 116,96 148,96 168,50 200,50 216,20 246,20" stroke="#283878" opacity="0.85"/>
    <circle cx="246" cy="20" r="6" fill="none" stroke="#283878" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Is Your Remodeling Business Actually Fit to Grow?',sub:'A masterclass for owners of residential remodeling and design-build firms, built from the 10 Point Fit to Grow checkup.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'Your schedule is full. That does not mean your business is healthy.',body:'A backlog of jobs, a crew that shows up, a reputation that brings referrals. Most remodeling and design-build owners read that as proof the business is fine. Busy and fit are not the same thing.'},
 {t:'dark',title:'A packed calendar can still be hiding a business that is not fit to grow.'},

 {t:'section',idx:'Part One',title:'The Trap'},
 {t:'normal',k:'The busy trap',title:'Nobody teaches you to tell "busy" apart from "healthy."',body:'You learned the trade. You learned to run jobs. Nothing about either one teaches you to diagnose whether the business underneath the schedule can actually take on more without breaking.'},
 {t:'normal',k:'The cost of skipping the checkup',title:'Growth without a checkup usually finds the weak point the hard way.',body:'Cashflow that looks fine until a slow month exposes it. A crew that can run five jobs well and eight jobs badly. An owner who is the only person who can close a sale or solve a problem.'},
 {t:'dark',title:'A full pipeline today does not protect you from an unfit business tomorrow.'},

 {t:'section',idx:'Part Two',title:'The Fit to Grow Method'},
 {t:'normal',k:'Take the checkup',title:'The 10 Point Fit to Grow checkup: 10 questions that predict readiness to grow.',body:'A structured business checkup, not a gut feeling, covering the specific points that determine whether a remodeling or design-build firm can grow without the wheels coming off.'},
 {t:'normal',k:'Build the discipline',title:'The 30-Day Remodeling Business Fitness program.',body:'The checkup tells you where you stand. This turns the diagnosis into 30 days of specific business disciplines, so fitness becomes a habit instead of a one-time score.'},
 {t:'normal',k:'Sell without the hard close',title:'The DB Sales Process: the relationship step most remodelers skip.',body:'A named, structured design-build sales process built around a formal design and feasibility step, the "dating" phase that earns trust before the commitment, instead of a single hard-sell close.'},
 {t:'normal',k:'Get the owner out of the bottleneck',title:'Time Mastery: growth that does not mean more hours for you.',body:'A named framework, from his book Time Mastery, for controlling your day instead of your day controlling you, so growing the business does not just mean the owner working more.'},
 {t:'dark',title:'Fitness is not an accident. It is a checkup, a plan, and a process, run on purpose.'},

 {t:'section',idx:'Part Three',title:'What Fit Actually Produces'},
 {t:'normal',k:'The practice this builds',title:'A business that can say yes to growth and mean it.',body:'A remodeling or design-build firm that knows exactly where it stands on all 10 points, sells through a real process instead of hustle, and does not depend entirely on the owner to hold it together.'},
 {t:'dark',title:'The market does not reward the busiest schedule. It rewards the business that was actually ready.'},
 {t:'normal',k:'Why Mark Richardson',title:'30 years running one of the country\'s largest remodeling organizations.',body:'Mark Richardson spent over 30 years as President and Co-Chairman of Case Design/Remodeling. NAHB Hall of Fame inductee. Ernst & Young Entrepreneur of the Year, Real Estate/Construction. Senior Fellow, Harvard University\'s Joint Center for Housing Studies. Guest lecturer at Georgetown, GW, Maryland, Penn State, and Virginia Tech. Author of three books, including Fit to Grow.'},

 {t:'section',idx:'Your Next Step',title:'Is Your Remodeling Business Fit to Grow?'},
 {t:'normal',k:'Start with the checkup',title:'The 10 Point Fit to Grow checkup.',body:'A structured business checkup covering the points that actually predict whether a remodeling or design-build firm is ready to grow.'},
 {t:'normal',k:'Go deeper',title:'Membership, subscription services and exclusive content.',body:'Additional resources, subscription services and exclusive content are available on request for membership. Contact Mark directly to talk through what fits your business.'},
 {t:'cta',title:'Ready to find out if your business is actually fit to grow?',chips:['Take the 10 Point checkup','Contact Mark directly'],disc:'Educational content for remodeling and design-build firm owners. No income, client, or business-growth result is guaranteed. Results vary by owner, market, and effort.'},
];

const deck=document.getElementById('deck');
function vitals(kind){return `<svg class="vitals-motif ${kind==='title'?'title-vitals':'corner-vitals'}"><use href="#vitals"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Remodeling Mastery <b>&middot; Fit to Grow</b> &middot; Mark Richardson</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=vitals(s.arc);
  else if(s.t==='title') h+=vitals('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
