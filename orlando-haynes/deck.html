<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inside Recruiter - Live Masterclass with Orlando Haynes</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --ink:#1c2733; --panel:#ece7dd; --rule:#d8d0c2;
    --accent:#304254; --accent2:#6b4fa0;
    --head:'Sora',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#cfc9bd;color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 64px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:52px 56px;margin:0 0 22px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent2);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.06;margin:0 0 18px;color:var(--accent)}
  h2{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.12;margin:0 0 16px;color:var(--ink)}
  p{font-size:19px;margin:0 0 14px;max-width:62ch}
  .big{font-size:26px;font-weight:500;color:var(--accent)}
  ul{margin:8px 0 0;padding:0 0 0 2px;list-style:none}
  li{font-size:19px;margin:0 0 13px;padding:0 0 0 30px;position:relative}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;background:var(--accent2)}
  .num{font-family:var(--head);font-weight:800;color:var(--accent2);font-size:15px;letter-spacing:.1em}
  .foot{font-family:var(--head);font-size:13px;color:#8a8578;margin-top:auto;padding-top:26px;letter-spacing:.04em}
  .disc{font-size:14px;color:#6c6657;max-width:66ch;margin-top:18px;line-height:1.5}
  .cta h1{font-size:40px}
  .tag{font-size:17px;color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Orlando Haynes',
    h:'The Inside Recruiter',
    body:'How to go from job seeker to sought after by understanding the hire from the recruiter side of the table.',
    foot:'CareerTALKS' },

  {t:'who', kicker:'Who this is for',
    h:'You are good at the work. The search still feels rigged.',
    list:['You apply, tailor, follow up, and still hear nothing back',
          'You watch less qualified people get picked ahead of you',
          'You are changing lanes and your resume does not tell the new story',
          'You know you could do the job if someone would just look'],
    foot:'The Inside Recruiter' },

  {t:'trap', kicker:'The trap',
    h:'You are optimizing for the wrong reader.',
    body:'Most career advice teaches you to write for yourself: list what you did, polish the wording, hope it lands. But your resume is read by someone whose whole job is to cut the pile down fast. You are being screened before you are ever read.',
    foot:'The Inside Recruiter' },

  {t:'reframe', kicker:'The reframe',
    h:'For twenty years I was the one cutting the pile.',
    body:'I have sat on the hiring side for two decades. I know what gets a candidate shortlisted and what gets them passed over in seconds. The search is not rigged. It is just played from a side you have never been allowed to see.',
    foot:'The Inside Recruiter' },

  {t:'part', kicker:'Part one', h:'Why the pile gets cut.' },

  {t:'point', kicker:'The core problem',
    h:'A recruiter is not reading. They are scanning for a reason to say no.',
    body:'When a role draws two hundred applications, the first pass is subtraction, not selection. If your story is not obvious in one glance, you are not rejected on merit. You are rejected on friction.',
    foot:'The Inside Recruiter' },

  {t:'point', kicker:'The core problem',
    h:'Qualified is the floor, not the edge.',
    body:'Almost everyone who makes the first cut can do the job. What moves you forward is whether the person screening can tell your story to the panel without working for it. Clarity beats credentials at the shortlist stage.',
    foot:'The Inside Recruiter' },

  {t:'point', kicker:'The core problem',
    h:'The best candidate is often the easiest decision.',
    body:'Hiring is risk. The offer tends to go to the person who feels like the safest, clearest yes, not the one with the longest list. Your job is to make the decision easy.',
    foot:'The Inside Recruiter' },

  {t:'part', kicker:'Part two', h:'The Inside Recruiter view.' },

  {t:'pillar', num:'Pillar 01', kicker:'Part two',
    h:'Read the role the way the recruiter wrote it.',
    body:'Every posting is a list of problems someone needs solved. Before you touch your resume, pull the real job out of the words and decide which two or three problems you are the obvious answer to.',
    foot:'The Inside Recruiter' },

  {t:'pillar', num:'Pillar 02', kicker:'Part two',
    h:'Lead with proof that matches, not history that drifts.',
    body:'A recruiter checks whether your proof lines up with their problem. Put the matching evidence first, cut the rest, and your relevance becomes visible in the one glance you actually get.',
    foot:'The Inside Recruiter' },

  {t:'pillar', num:'Pillar 03', kicker:'Part two',
    h:'Become findable before you ever apply.',
    body:'The strongest candidates are often sourced, not sorted. A clear, searchable presence means a recruiter finds you and reaches out, which flips the entire dynamic in your favor.',
    foot:'The Inside Recruiter' },

  {t:'pillar', num:'Pillar 04', kicker:'Part two',
    h:'Give them the story they can defend.',
    body:'Someone has to argue for you in a room you are not in. Hand them one clean line that connects where you have been to where you are going, and you turn a career change from a red flag into a reason.',
    foot:'The Inside Recruiter' },

  {t:'pillar', num:'Pillar 05', kicker:'Part two',
    h:'Negotiate the whole offer, not just the number.',
    body:'Once they want you, the game changes and most people leave value on the table. Frame the ask, expect the counter, and trade across base, bonus, equity, and flexibility instead of fixating on one figure.',
    foot:'The Inside Recruiter' },

  {t:'part', kicker:'Part three', h:'What sought after actually feels like.'},

  {t:'point', kicker:'Part three',
    h:'From chasing jobs to being sought after.',
    body:'You stop firing applications into the void. You apply to fewer roles with a sharper story, recruiters start reaching out, and your interviews feel like a conversation between two people solving the same problem.',
    foot:'The Inside Recruiter' },

  {t:'point', kicker:'Part three',
    h:'Sought after is a position you build, not luck you wait for.',
    body:'Everything above is learnable. It is the same path I have walked people down from job seeker to sought after, and it starts with seeing the hire the way the person hiring sees it.',
    foot:'The Inside Recruiter' },

  {t:'why', kicker:'Why me',
    h:'Orlando Haynes',
    body:'Career coach, talent advisor, and speaker with 20-plus years inside corporate talent acquisition. Author of The Inside Recruiter. Host of the CareerTALKS podcast, 150-plus episodes helping professionals grow in their careers and lives.',
    foot:'CareerTALKS' },

  {t:'cta', kicker:'Your next step',
    h:'Let us build your sought-after story together.',
    tag:'Book a 1-on-1 career coaching call with Orlando at careertalkspodcast.com.',
    disc:'This masterclass is educational. No specific job offer, salary, hiring outcome, or income is promised or guaranteed. Results vary and depend on your own effort, market, and circumstances.',
    foot:'CareerTALKS' }
];

const deck = document.getElementById('deck');
S.forEach(function(s){
  const d = document.createElement('section');
  d.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let html = '';
  if (s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if (s.num) html += '<div class="num">'+s.num+'</div>';
  if (s.t==='title' || s.t==='cta') { if (s.h) html += '<h1>'+s.h+'</h1>'; }
  else if (s.h) html += '<h2>'+s.h+'</h2>';
  if (s.body) html += '<p class="big">'+s.body+'</p>';
  if (s.list) { html += '<ul>'; s.list.forEach(function(i){ html += '<li>'+i+'</li>'; }); html += '</ul>'; }
  if (s.tag) html += '<p class="tag">'+s.tag+'</p>';
  if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  if (s.foot) html += '<div class="foot">'+s.foot+'</div>';
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
