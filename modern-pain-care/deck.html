<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Beyond the Technique: A Whole-Person Way to Reason Through Chronic Pain · Dr. Mark Kargela, Modern Pain Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fafaf9; --panel:#f0f1f4; --rule:#e2e3e7;
    --acc:#0061ff; --acc2:#5b9bff; --ink:#111111;
    --grey:#4a4a48; --dim:#6c6c67; --cream:#f5f5f7;
  }
  html,body{height:100%}
  body{background:#ececeb;font-family:'Newsreader',Georgia,serif;color:var(--grey);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ececeb}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Be Vietnam Pro',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Be Vietnam Pro',sans-serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:-.008em}
  .t-title h1{font-size:4.4vw;max-width:96%;color:var(--ink);text-transform:none}
  .t-normal h1{font-size:3.05vw;max-width:92%}
  .t-normal .body{font-family:'Newsreader',serif;font-size:1.5vw;color:var(--grey);margin-top:3.0vh;max-width:80%;line-height:1.62;font-weight:400}
  .sub{font-family:'Newsreader',serif;font-style:italic;font-size:1.95vw;color:var(--acc);margin-top:3.6vh;max-width:88%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Be Vietnam Pro',sans-serif;font-size:1.05vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.5vw;max-width:94%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc) 55%,var(--acc2));margin-top:3.6vh;border-radius:2px}
  .t-dark{background:radial-gradient(135% 135% at 50% 8%,#1b2740 0%,#0a1020 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:90%;color:var(--cream);text-transform:none}
  .t-cta{background:radial-gradient(135% 135% at 50% 100%,#1b2740 0%,#0a1020 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:88%;color:var(--cream);text-transform:none}
  .t-cta .body{font-family:'Newsreader',serif;color:#c7d2e6;font-size:1.42vw;margin-top:3vh;max-width:74%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc2);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-family:'Be Vietnam Pro',sans-serif;font-size:1.1vw;font-weight:500;letter-spacing:.02em}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-family:'Newsreader',serif;font-size:.86vw;color:#9aa6bd;text-align:center;line-height:1.5}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .domain{display:flex;gap:1.4vw;margin-top:3.4vh;max-width:86%}
  .domain .num{font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:2.2vw;color:var(--acc);line-height:1;min-width:2.6vw}
  .domain .dtxt{font-family:'Newsreader',serif;font-size:1.42vw;color:var(--grey);line-height:1.55}
  .domain .dtxt b{color:var(--ink);font-weight:500}
  .mark{position:absolute;pointer-events:none}
  .title-mark{right:6.5%;bottom:9%;width:22vw;opacity:.95}
  .corner-mark{right:6.5%;bottom:8%;width:8.5vw;opacity:.4}
  .brandline{font-family:'Be Vietnam Pro',sans-serif;font-size:1.15vw;color:var(--grey);margin-top:3.8vh;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(17,17,17,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Be Vietnam Pro',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Be Vietnam Pro',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Be Vietnam Pro',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3.1vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.0vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}.domain .dtxt{font-size:3vw}.domain .num{font-size:5vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Modern Pain Care</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a whole-person reasoning map. four domain nodes (tissue, biology, psychology, context) linking in to one central person node, drawn in brand blue -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mark" viewBox="0 0 200 120">
  <g fill="none" stroke="#0061ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="24" x2="100" y2="60" opacity="0.5"/>
    <line x1="170" y1="24" x2="100" y2="60" opacity="0.5"/>
    <line x1="30" y1="96" x2="100" y2="60" opacity="0.5"/>
    <line x1="170" y1="96" x2="100" y2="60" opacity="0.5"/>
    <circle cx="30" cy="24" r="6.5"/>
    <circle cx="170" cy="24" r="6.5"/>
    <circle cx="30" cy="96" r="6.5"/>
    <circle cx="170" cy="96" r="6.5"/>
    <circle cx="100" cy="60" r="12" fill="#0061ff" fill-opacity="0.12"/>
    <circle cx="100" cy="60" r="4" fill="#0061ff" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Beyond the Technique: A Whole-Person Way to Reason Through Chronic Pain',sub:'For clinicians who are great with acute cases, and keep hitting a wall with the patients whose pain will not settle.',brand:true,mark:'title'},
 {t:'normal',k:'Who this is for',title:'You know your techniques. The chronic patients are the ones who do not fit them.',body:'You can reason through an acute ankle or a fresh disc and get a good result. Then the person whose pain has lasted years walks in, the imaging does not explain it, the last four providers already tried what you were about to try, and the usual playbook quietly runs out. The skill was never the problem. The model you were handed for pain was.'},
 {t:'dark',title:'Most clinicians do not get stuck on chronic pain because they lack a technique. They get stuck because they are still treating it like a tissue problem.'},

 {t:'section',idx:'Part One',title:'Why the Search for a Better Technique Keeps Failing'},
 {t:'normal',k:'The trap',title:'So many methods seem to work because most pain improves on a similar curve.',body:'Adjust, needle, mobilize, release, correct the posture, pick a system and defend it. A lot of it looks like it works, because most pain settles on its own timeline no matter what you did. So we credit the technique, collect a shelf of certifications, and stay convinced the answer is one more course. For chronic pain, it rarely is.'},
 {t:'normal',k:'The cost',title:'When the tissue story does not fit, the patient feels dismissed and you feel stuck.',body:'A person whose pain has outlasted every scan does not need to hear that their MRI looks fine. They have been told. When we only have a tissue explanation, the ones who do not fit it get labelled difficult, bounced between providers, or quietly written off. That is not a hard patient. It is a model that ran out of room.'},
 {t:'dark',title:'Pain is a protective response, not a damage signal. Once you reason from that, the patients who did not fit start to make sense.'},

 {t:'section',idx:'Part Two',title:'The Whole Person Reasoning Framework'},
 {t:'normal',k:'The shift',title:'The answer was never a better technique. It is a better process.',body:'Instead of reaching for the next intervention, you reason through the whole person across four domains, and let what you find decide what the person in front of you actually needs. It is a clinical field guide for the presentations that do not fit a tissue story, built so you always know the next question to ask.'},
 {t:'normal',k:'Domain one',title:'Local Tissue',body:'The layer you already reason well: aggravating and easing factors, irritability, the mechanical picture. It still matters. It is just the start of the map, not the whole of it.'},
 {t:'normal',k:'Domain two',title:'System Biology, the amplifiers',body:'Why the same tissue hurts more on some days than others. The autonomic, immune, endocrine, and gut systems that turn the volume of pain up or down, and the screening that tells you when they are driving the presentation.'},
 {t:'normal',k:'Domain three',title:'Psychology, threat and belief',body:'What the pain means to the person. The threat they attach to it, the beliefs they carry about what it says about their body, and the values that tell you what recovery is actually for. Not soft skills. Core clinical competencies.'},
 {t:'normal',k:'Domain four',title:'Context and the healing environment',body:'The life the pain lives inside: work, relationships, sleep, safety, the systems around the person. The context that either lets recovery happen or quietly blocks it, no matter how good the plan on paper is.'},
 {t:'normal',k:'How it holds together',title:'Four domains, integrated by the person’s lived experience.',body:'The domains are not a checklist to score. They are read together, through the patient’s own story, so the picture stays whole. That is what keeps you from collapsing a complex presentation back into a single tissue label, and what gives the person a plan that fits the life they actually live.'},
 {t:'dark',title:'You are not the technician who fixes the part. You are the guide who helps a person rebuild capacity.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Reason This Way'},
 {t:'normal',k:'In the room',title:'Fewer dead ends, and the patients who used to get written off start to move.',body:'You stop grasping for the intervention that will finally work and start asking the question that finally fits. The chronic caseload that used to drain the clinic becomes the work you are known for. Not because you found a better technique, but because you finally had a process big enough for the problem.'},
 {t:'normal',k:'Why learn this from Dr. Mark Kargela',title:'Twenty years in chronic pain, spent bridging the science and the real clinic.',body:'Mark is a physical therapist, PT, DPT, OCS, FAAOMPT, with more than twenty years treating and teaching chronic pain. He has spent that time closing the gap between modern pain science and what actually happens on a Tuesday afternoon with a hard case, through the Modern Pain podcast, a clinician community, and his mentorship. His conviction is simple: everyone deserves access to quality pain care, and that starts with how their clinician reasons.'},
 {t:'dark',title:'When the process is whole, the patient stops being a puzzle to solve and starts being a person to guide.'},

 {t:'section',idx:'Your Next Step',title:'Keep Reasoning Through the Hard Cases'},
 {t:'normal',k:'Go deeper',title:'The framework, worked cases, and a room of clinicians thinking this way.',body:'This session is the overview. The next step is putting the Whole Person Reasoning Framework to work on your own hard cases, with the reference guide in hand, expert sessions and worked reasoning, and a community of clinicians who are done chasing techniques and want a process that holds.'},
 {t:'cta',title:'Ready to reason through the patients who do not fit the tissue story?',body:'Start with the free Whole Person Reasoning field guide, then go deeper inside the Modern Pain Care mentorship and community.',chips:['Get the free clinical guide','Join the mentorship','Listen to the podcast'],disc:'Educational content for licensed clinicians. Not medical advice and not a substitute for individual clinical judgment. No specific clinical result is guaranteed. Results vary by patient, presentation, and setting.'},
];

const deck=document.getElementById('deck');
function mark(kind){return `<svg class="mark ${kind==='title'?'title-mark':'corner-mark'}"><use href="#mark"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='cta'){
    h+=`<h1>${s.title}</h1>`;
    if(s.body) h+=`<div class="body" style="color:#c7d2e6;text-align:center;max-width:74%">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">${s.chips.map(c=>`<div class="chip">${c}</div>`).join('')}</div>`;
    if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  } else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Modern Pain Care &nbsp;&middot;&nbsp; <b>Dr. Mark Kargela</b></div>`;
  }
  if(s.mark) h+=mark(s.mark);
  else if(s.t!=='dark'&&s.t!=='section'&&s.t!=='cta'&&i>0) h+=mark('corner');
  d.innerHTML=h;
  deck.appendChild(d);
});

let cur=0;const slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('bar'),count=document.getElementById('count'),hint=document.getElementById('hint');
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  if(cur>0&&hint) hint.style.opacity='0';
}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1);
});
show(0);
</script>
</body>
</html>
