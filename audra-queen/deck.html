<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Dance CEO Masterclass · Audra Queen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F5EFE6; --panel:#FBF7F0; --rule:#E6DBCB;
    --accent:#8A4F6D; --ink:#2A2230; --grey:#5E5866; --dim:#9A8FA0; --chalk:#7A506A;
  }
  html,body{height:100%}
  body{background:#EDE4D6;font-family:'Figtree',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#EDE4D6}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.15;letter-spacing:-.005em}
  .t-title h1{font-size:5vw}
  .t-normal h1{font-size:3.4vw;max-width:85%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Figtree',sans-serif;font-size:1.4vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#3A2C39 0%,#241C29 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:88%;font-style:italic;color:#F4EEE6}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#F0E7DA 0%,#E7D8C6 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.2vw;max-width:82%;color:var(--ink)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent);color:var(--accent);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500;background:rgba(138,79,109,.05)}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .lead-motif{position:absolute;pointer-events:none;opacity:.92}
  .title-lead{right:7.5%;bottom:8%;width:19vw}
  .corner-lead{right:6%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(42,34,48,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The Dance CEO</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- lead motif: an owner standing centered under a spotlight - a raised node over a stem over a base line -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lead" viewBox="0 0 220 150">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="20" y1="132" x2="200" y2="132" stroke="#C9A24B" opacity="0.35"/>
    <line x1="110" y1="132" x2="110" y2="58" stroke="#8A4F6D" opacity="0.9"/>
    <circle cx="110" cy="42" r="15" fill="none" stroke="#8A4F6D" stroke-width="2.8"/>
    <path d="M74 30 A46 46 0 0 1 146 30" stroke="#C9A24B" stroke-width="2.2" opacity="0.7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Dance CEO Masterclass',sub:'How to lead your dance business like a CEO, and scale it, without sacrificing yourself to keep it running.',brand:true,lead:'title'},
 {t:'normal',k:'Who this is for',title:'You are the business.',body:'You teach, you schedule, you answer the parents, you cover the fires, and you carry the whole studio in your head. Growth has started to cost you evenings, weekends, and the reason you started.'},
 {t:'dark',title:'You do not have a hustle problem. You have a self-sacrifice problem.'},

 {t:'section',idx:'Part One',title:'The Self-Sacrifice Trap'},
 {t:'normal',k:'The quiet belief',title:'Somewhere you learned the studio only works if you bleed for it.',body:'In the dance world we are trained to give everything and ask for little. That story feels like dedication. In a business, it just means every result depends on you running yourself down.'},
 {t:'normal',k:'The real cost',title:'A studio that runs on your sacrifice cannot grow past you.',body:'When you are the only one holding the standard, more students and more classes just add more weight. You are not scaling a business. You are enlarging a job that is already too heavy.'},
 {t:'dark',title:'Your business is only as successful as you are doing personally.'},

 {t:'section',idx:'Part Two',title:'The Scarcity Story'},
 {t:'normal',k:'Where it hides',title:'Scarcity shows up as underpricing and over-giving.',body:'The belief that there is never enough money, time, or worth is everywhere in dance. It is why owners discount, over-deliver, and flinch at raising a tuition that has not moved in years.'},
 {t:'normal',k:'The shift',title:'You cannot grow a business from a mindset of not enough.',body:'A CEO prices for the value delivered and protects the margin that keeps the doors open. The first real growth lever is not a new tactic. It is dropping the scarcity story you inherited.'},
 {t:'dark',title:'The numbers do not change until the story behind them does.'},

 {t:'section',idx:'Part Three',title:'The Dance CEO Shift'},
 {t:'normal',k:'Pillar one',title:'Owner comes first.',body:'Self-care stops being a reward for later and becomes the strategy. The most protected asset in the business is the person who leads it, because when you are steady, every decision downstream gets steadier.'},
 {t:'normal',k:'Pillar two',title:'Boundaries over people-pleasing.',body:'You lead the studio on your terms instead of everyone else’s. Clear boundaries with parents, students, and staff turn you from the person absorbing every demand into the person setting the standard.'},
 {t:'normal',k:'Pillar three',title:'Live first, work less, still scale.',body:'You build the studio around a CEO calendar and simple systems, so it keeps running when you step back. Growth stops meaning more hours from you, and starts meaning more freedom for you.'},
 {t:'dark',title:'Owner first. Boundaries over pleasing. Live first, work less, still scale.'},

 {t:'section',idx:'Part Four',title:'Life on the Other Side'},
 {t:'normal',k:'The reset in practice',title:'Fewer hours, held boundaries, a business that keeps standing when you sit down.',body:'This is the shift I walk owners through inside my work: the schedule reset, the pricing owned without apology, and the CEO habits that let the studio grow while you get your life back.'},
 {t:'normal',k:'Why me',title:'I have lived both sides of this.',body:'I built a career in dance, then a coaching business helping owners lead theirs, and I have supported over 150 dance business owners through the hardest seasons a studio can face. I coach the shift I had to make myself.'},
 {t:'dark',title:'You did not open a studio to disappear inside it.'},

 {t:'section',idx:'Your next step',title:'Make the Dance CEO Shift'},
 {t:'normal',k:'How I can help',title:'The Dance CEO Method, and a room of owners making the same shift.',body:'This is what I teach inside the Dance CEO Method and the Dance CEO Society: the mindset, the boundaries, and the systems that let you lead a profitable studio without losing yourself to it.'},
 {t:'cta',title:'Ready to lead like a CEO and get your life back?',chips:['Explore the Dance CEO Method','Join the Dance CEO Society'],disc:'Educational content for dance business owners. No income, revenue, or business result is guaranteed. Results vary by owner, studio, and market.'},
];

const deck=document.getElementById('deck');
function lead(kind){return `<svg class="lead-motif ${kind==='title'?'title-lead':'corner-lead'}"><use href="#lead"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Dance <b>CEO</b> · Audra Queen</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.lead) h+=lead(s.lead);
  else if(s.t==='title') h+=lead('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
