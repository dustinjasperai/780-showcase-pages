<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>How to Lead Yoga Retreats That Fill Themselves · Hargobind Khalsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f2e9; --panel:#efe6d5; --rule:#e0d4bf;
    --ink:#2f2f2f; --ink-soft:#5c5346; --dim:#8c8173;
    --accent:#b45a35; --gold:#c79a3d;
  }
  html,body{height:100%}
  body{background:#efe6d5;font-family:'Manrope',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e7dcc7}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Manrope',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.1;letter-spacing:0}
  .t-title h1{font-size:5vw;max-width:92%;font-weight:600}
  .t-normal h1{font-size:3.7vw;max-width:86%}
  .t-normal .body{font-family:'Manrope',sans-serif;font-size:1.44vw;color:var(--ink-soft);margin-top:2.6vh;max-width:74%;line-height:1.6;font-weight:400}
  .sub{font-family:'Manrope',sans-serif;font-size:1.6vw;color:var(--ink-soft);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Manrope',sans-serif;font-size:1.4vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:5.4vw;max-width:92%;font-weight:600}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#7a3220 0%,#2f2018 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4vw;max-width:88%;font-style:italic;color:#f7ece0;font-weight:500}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#b45a35 0%,#7a3220 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.4vw;max-width:86%;font-weight:600;color:#fbf5ec}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid #f2d9b0;color:#fbf5ec;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.22vw;font-weight:600;font-family:'Manrope',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#e9cdb4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .sun{position:absolute;pointer-events:none;opacity:.95}
  .title-sun{right:8%;bottom:9%;width:22vw}
  .corner-sun{right:6.5%;bottom:8%;width:9vw;opacity:.5}
  .brandline{font-family:'Manrope',sans-serif;font-size:1.3vw;color:var(--ink-soft);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(47,47,47,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:8vw}.t-dark h1{font-size:6.4vw}
    .t-cta h1{font-size:7.4vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Retreat Wizard</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- sunrise motif: a rising sun over a horizon line with a few warm rays (Casa Om beach dawn) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="sun" viewBox="0 0 240 150">
  <g fill="none" stroke-width="2.6" stroke-linecap="round">
    <line x1="26" y1="120" x2="214" y2="120" stroke="#c79a3d" opacity="0.45"/>
    <path d="M74 120 A46 46 0 0 1 166 120" stroke="#b45a35" opacity="0.95"/>
    <line x1="120" y1="30" x2="120" y2="14" stroke="#c79a3d" opacity="0.75"/>
    <line x1="70" y1="46" x2="60" y2="34" stroke="#c79a3d" opacity="0.6"/>
    <line x1="170" y1="46" x2="180" y2="34" stroke="#c79a3d" opacity="0.6"/>
    <line x1="44" y1="86" x2="28" y2="80" stroke="#c79a3d" opacity="0.5"/>
    <line x1="196" y1="86" x2="212" y2="80" stroke="#c79a3d" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'How to Lead Yoga Retreats That Fill Themselves',sub:'A live masterclass for yoga teachers ready to make retreats the heart of their work, not a once a year gamble that may or may not sell.',brand:true,sun:'title'},
 {t:'normal',k:'Who this is for',title:'You can hold a room for a week. Filling the room is the part that keeps you up.',body:'You can design a week that changes people. You know how to teach, how to feed a group, how to hold the space. What nobody trained you for is the deposits, the pricing, and the marketing that decide whether the seats are full before you land.'},
 {t:'dark',title:'A half full retreat is not a marketing problem. It is a retreat built without a system.'},

 {t:'section',idx:'Part One',title:'Why Great Retreats Do Not Sell Themselves'},
 {t:'normal',k:'The one off trap',title:'Most retreats are built one at a time, from scratch, on hope.',body:'Every launch starts from zero. A new location, a fresh flyer, a burst of posting, then silence while you wait to see who books. A retreat built that way can only ever be as full as this month of effort, and it leaves nothing behind to make the next one easier.'},
 {t:'normal',k:'The pricing fear',title:'A price set to be liked can lose money in a beautiful place.',body:'Flights, lodging, food, and your own time add up fast. When the number is chosen to avoid a flinch instead of to hold the real cost, the retreat sells and still comes home short. Underpricing does not fill seats, it fills them with a loss you carry quietly.'},
 {t:'dark',title:'The retreat is not the product. The transformation people can feel before they book is the product.'},

 {t:'section',idx:'Part Two',title:'The Retreat Wizard Method'},
 {t:'normal',k:'Dharmify: align first',title:'Start where every full retreat starts, with alignment.',body:'Dharmify is keeping your spirit and your business pointed the same way, so the retreat is honest and profitable at once. When what you sell and what you believe are in total alignment, the offer stops feeling like a pitch and starts feeling like an invitation.'},
 {t:'normal',k:'Hook, Story, Twist, Lesson, Offer',title:'Tell the retreat as a story the right person feels is for them.',body:'People do not book a schedule, they book a feeling and a change. Hook, Story, Twist, Lesson, Offer is how you carry a reader from a scroll to a deposit without a hard sell, by letting them recognise their own moment in the story you tell.'},
 {t:'normal',k:'Guide and hero',title:'You are the guide. The guest is the hero.',body:'The retreat is not about how skilled you are, it is about the transformation the guest is walking toward. When you position yourself as the guide who has made the trip many times, and the guest as the hero of their own week, trust is built before a single email goes out.'},
 {t:'normal',k:'The Retreat Funnel',title:'One retreat is a doorway, not a destination.',body:'A retreat sits inside a larger plan. It can be the front door that leads to your coaching and your next event, or the deep end that a lighter offer feeds into. Knowing where each retreat sits is what turns a string of one offs into a business that compounds.'},
 {t:'dark',title:'Fill one by luck and you start over. Build the system and you fill the next one, and the one after that.'},

 {t:'section',idx:'Part Three',title:'What A Full Retreat Makes Possible'},
 {t:'normal',k:'The leader this builds',title:'Sold out retreats, deposits in early, and a calendar you plan your year around.',body:'Seats fill before you travel. The right people arrive, ready for the work, because the story already told them it was theirs. The week you love to lead becomes the part of your business you can actually count on, instead of the part you hold your breath through.'},
 {t:'dark',title:'A retreat that pays you well is a retreat you can keep giving your whole heart to.'},
 {t:'normal',k:'Why Hargobind Khalsa',title:'Two retreat centers, over 400 retreats, one repeatable method.',body:'Hargobind Khalsa built Casa Om in Puerto Morelos and Casa Om Potomac, and between them has hosted more than 400 retreats. The Retreat Wizard frameworks and the Dharmify practice are what he learned filling and leading those rooms, taught here in full, mindset and mechanics together.'},

 {t:'section',idx:'Your Invitation',title:'Lead Your Next Retreat Like A Wizard'},
 {t:'normal',k:'Where to begin',title:'Start with the Retreat Wizard Blizzard, then go deeper.',body:'The free Retreat Wizard Blizzard hands you the core frameworks for planning and filling a retreat. From there, the Retreat Wizard Coaching takes you all the way, week by week, to a retreat calendar that fills itself and a business that holds you while you hold the room.'},
 {t:'cta',title:'Ready to fill your next retreat?',chips:['Grab the Retreat Wizard Blizzard','Apply for Retreat Wizard Coaching'],disc:'Educational content for yoga teachers and retreat leaders. No income or business result is guaranteed. Results vary by leader, market, and effort.'},
];

const deck=document.getElementById('deck');
function sun(kind){return `<svg class="sun ${kind==='title'?'title-sun':'corner-sun'}"><use href="#sun"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Hargobind Khalsa · <b>Retreat Wizard</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.sun) h+=sun(s.sun);
  else if(s.t==='title') h+=sun('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
