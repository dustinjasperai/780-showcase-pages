<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Builder's Mindset — A Masterclass with Dr. Gena Gorlin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;1,400&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7eef0;        /* warm rose paper, from her site page bg #f0e6e8 */
    --panel:#ffffff;
    --panel2:#fbf5f6;
    --rule:#e8d6da;      /* desaturated rose rule */
    --ink:#363334;       /* her exact body ink */
    --muted:#6f6468;
    --accent:#dd4466;    /* her exact dominant accent */
    --head:'Petrona', Georgia, serif;
    --body:'Mulish', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(54,51,52,.03)}
  .slide.alt{background:var(--panel2)}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:600;font-size:52px;line-height:1.05;margin:0 0 18px;
    letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:36px;line-height:1.12;margin:0 0 16px;
    letter-spacing:-.01em}
  p{font-size:19px;margin:0 0 14px;max-width:62ch}
  p.lead{font-size:22px;color:var(--ink)}
  .muted{color:var(--muted)}
  .big{font-family:var(--head);font-size:30px;line-height:1.2;color:var(--ink);max-width:24ch}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:19px;padding:12px 0 12px 26px;border-top:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:21px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:10px}
  .mode{border:1px solid var(--rule);border-radius:14px;padding:22px;background:var(--bg)}
  .mode h3{font-family:var(--head);font-size:22px;margin:0 0 8px}
  .mode.win{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .mode p{font-size:15px;color:var(--muted);margin:0}
  .foot{font-size:13px;color:var(--muted);margin-top:28px;font-family:var(--body)}
  .num{font-family:var(--head);font-size:15px;color:var(--accent);margin:0 0 10px;font-weight:600}
  .accent{color:var(--accent)}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);
    text-decoration-thickness:2px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const S = [
  {t:'title', html:`
    <div class="kicker">A masterclass with Dr. Gena Gorlin</div>
    <h1>The Builder's Mindset</h1>
    <p class="lead">A new psychology of ambition for the people building hard things.</p>
    <p class="muted">For founders who have hit the milestones and still feel like they are failing.</p>
  `},
  {t:'for', cls:'alt', html:`
    <div class="kicker">Who this is for</div>
    <h2>You shipped it. The relief lasted a day.</h2>
    <p class="lead">You raised the round, hired the team, hit the number. And the quiet voice
      already moved the goalposts: not enough, not yet, not really.</p>
    <p class="muted">If drive and dread have started to feel like the same feeling, this hour is for you.</p>
  `},
  {t:'hook', html:`
    <div class="kicker">The reframe</div>
    <h2>The problem was never your ambition.</h2>
    <p class="big">It is the voice you have put in charge of running it.</p>
    <p class="muted">Most founders are driving their life on one of two default engines. Neither one was built for a builder.</p>
  `},
  {t:'part', cls:'alt', html:`
    <p class="num">Part One</p>
    <h2>The two engines founders run on</h2>
    <p class="lead">Before we name the better way, we have to see the two ways that quietly
      run most ambitious people, and why both of them cost you.</p>
  `},
  {t:'drill', html:`
    <div class="kicker">Engine one</div>
    <h2>The Drill Sergeant</h2>
    <p>Life as a test you are supposed to pass, or a chore someone else prescribed. You push
      through on fear of judgment and prove your worth against a standard you did not choose.</p>
    <p class="muted">It works, for a while. Then it quietly trades your well-being for the next
      milestone, and the milestone never pays you back.</p>
  `},
  {t:'zen', cls:'alt', html:`
    <div class="kicker">Engine two</div>
    <h2>The Zen Master</h2>
    <p>Life as a ride you are being taken on, or a storm to wait out. You lower the stakes,
      accept what is, and protect your peace by letting go of the standard.</p>
    <p class="muted">It soothes, for a while. Then it quietly trades the work that mattered to
      you for calm, and you stop building the thing only you could build.</p>
  `},
  {t:'premise', html:`
    <div class="kicker">The shared mistake</div>
    <h2>Both engines believe the same false thing.</h2>
    <p class="lead">That excellence and well-being are a trade. That you either push hard and
      suffer, or ease off and settle.</p>
    <p>The answer is not to balance the two. It is to reject the premise. Not "yes, and."
      <span class="accent">Neither, nor.</span></p>
  `},
  {t:'part', cls:'alt', html:`
    <p class="num">Part Two</p>
    <h2>The builder's mindset</h2>
    <p class="lead">Treating your life as the ultimate project you are in charge of shaping,
      by your own effort and according to your own chosen vision and values.</p>
  `},
  {t:'builder', html:`
    <div class="kicker">The third engine</div>
    <h2>The Builder</h2>
    <div class="three">
      <div class="mode"><h3>Drill Sergeant</h3><p>Avoid failure. Prove worth. Fear.</p></div>
      <div class="mode"><h3>Zen Master</h3><p>Minimize suffering. Wait it out. Acceptance.</p></div>
      <div class="mode win"><h3>Builder</h3><p>Live fully on your own terms. A positive vision. Rational agency.</p></div>
    </div>
    <p class="foot">The builder achieves what the drill sergeant only promises, and keeps the
      well-being the zen master thought it had to give up.</p>
  `},
  {t:'shift', cls:'alt', html:`
    <div class="kicker">Pillar one</div>
    <h2>The Motivational Shift</h2>
    <p>From proving your worth to serving your life. The question stops being "will this pass
      the test?" and becomes "how did I think this would serve and advance my life?"</p>
    <p class="muted">Same hard work. Opposite fuel. One burns you down; the other builds you up.</p>
  `},
  {t:'why', html:`
    <div class="kicker">Pillar two</div>
    <h2>The Why Recursion</h2>
    <p>Take any standard you are driving yourself toward and ask, "why do I care about this?"
      Then ask it again, and again.</p>
    <ul>
      <li>Land on an arbitrary external standard, and you have found your drill sergeant.</li>
      <li>Reach a genuine, life-serving reason, and you can proceed with real discipline.</li>
    </ul>
  `},
  {t:'moral', cls:'alt', html:`
    <div class="kicker">Pillar three</div>
    <h2>Self-honesty is part of the work</h2>
    <p>Good psychology does not stop at feeling better. It includes moral character as a
      target: seeing yourself clearly, telling yourself the truth, choosing on purpose.</p>
    <p class="lead">The best way to build yourself is by building.</p>
  `},
  {t:'yardstick', html:`
    <div class="kicker">The instrument</div>
    <h2>The builder's yardstick</h2>
    <p>Once the engine changes, the daily choices get a measure. Not "does this look
      impressive?" but "does this serve the life and the work I have actually chosen?"</p>
    <p class="muted">A hire, a raise, a pivot, a Saturday. The yardstick is the same, and it is yours.</p>
  `},
  {t:'part', cls:'alt', html:`
    <p class="num">Part Three</p>
    <h2>Clean ambition, felt from the inside</h2>
    <p class="lead">Not calmer ambition. Cleaner ambition. The same intensity, pointed at
      something you can stand behind, without the dread riding shotgun.</p>
  `},
  {t:'picture', html:`
    <div class="kicker">The shift, lived</div>
    <h2>From running on fear to running on vision</h2>
    <ul>
      <li>The milestone arrives and you actually feel it, instead of bracing for the next one.</li>
      <li>Hard decisions get faster, because the yardstick is clear and it is yours.</li>
      <li>Rest stops feeling like cheating, because it serves the build.</li>
      <li>You stop managing a voice that was never on your side.</li>
    </ul>
  `},
  {t:'me', cls:'alt', html:`
    <div class="kicker">Why me</div>
    <h2>A psychologist for the people who build</h2>
    <p>I am a licensed clinical psychologist and Clinical Associate Professor of Psychology at
      UT Austin. I have spent my practice with ambitious builders, including hundreds of tech
      founders and cofounding teams, many of them backed by Y Combinator and Andreessen
      Horowitz.</p>
    <p class="muted">I write The Psychology of Ambition, co-host The Founder's Mindset podcast,
      and have a forthcoming book with Penguin on all of this.</p>
  `},
  {t:'cta', cls:'alt', html:`
    <div class="kicker">Your next build</div>
    <h2>Build the one project that is actually yours</h2>
    <p class="lead">If this hour named something true, the work is one conversation away.
      Book a first session with me and we will look at the engine you are running on.</p>
    <p class="muted">genagorlin.com</p>
    <p class="foot">Educational only. Nothing here is medical, clinical, or financial advice,
      and no specific outcome, income, role, or result is guaranteed. Results vary from person
      to person.</p>
  `}
];
const wrap = document.getElementById('wrap');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  el.innerHTML = s.html;
  wrap.appendChild(el);
});
</script>
</body>
</html>
