<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 10-Hour Work Month - A Live Masterclass with Laura Anderson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#012316; --panel:#0c3524; --rule:#163c28;
    --accent:#be9549; --ink:#ffffff; --muted:#bcd0c4;
    --serif:'Newsreader',Georgia,serif; --sans:'Public Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 44px;margin:18px 0;min-height:340px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:16px}
  h1{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1.12;margin-bottom:18px}
  h2{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.18;margin-bottom:16px}
  p{font-size:19px;color:var(--ink);max-width:62ch;margin-bottom:12px}
  p.lead{font-size:22px;color:var(--muted)}
  ul{margin:10px 0 0 2px;list-style:none;max-width:62ch}
  li{font-size:19px;padding:9px 0 9px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:18px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  li b{font-family:var(--serif)}
  .num{font-family:var(--serif);font-size:15px;color:var(--accent);font-weight:700}
  .part{align-items:flex-start}
  .part h1{font-size:40px}
  .big{font-size:60px}
  .cta{background:var(--accent);color:#1a1200;border-color:var(--accent)}
  .cta::before{background:#1a1200}
  .cta h1,.cta h2,.cta .eyebrow{color:#1a1200}
  .cta p{color:#2a1f05}
  .disclaimer{font-size:13px;color:#3a2c0a;margin-top:18px;max-width:70ch}
  .pres{font-size:15px;color:var(--muted);margin-top:22px}
  .foot{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 40px}
  .kbd{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Use <span class="kbd">&#8594;</span> / <span class="kbd">&#8592;</span> or scroll. The 10-Hour Work Month &middot; Laura Anderson</div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Laura Anderson', h:'The 10-Hour Work Month',
   p:'How one certified digital trade plus AI can build a real income, without trading your whole life for it.',
   pres:'Presented live by Laura Anderson, creator of the 10hr $10k Work Month and host of The 7-Day Weekend.'},

  {t:'who', eyebrow:'Who this is for', h:'You are in the right room if...',
   list:['You do not have a degree and are tired of being told you need one.',
         'You are trading hours for money and the hours keep going up.',
         'You want location and schedule freedom, not just a slightly better job.',
         'You are willing to learn one real skill and let software carry the rest.']},

  {t:'trap', eyebrow:'The trap', h:'You were told the only way up is more hours.',
   p:'Work harder. Add another shift. Start a side hustle on top of the job that already drains you. Every path you have been handed costs you the one thing you are trying to buy back: your time.',
   lead:'So the harder you push, the further you get from the point.'},

  {t:'hook', eyebrow:'The reframe', h:'More hustle is not the answer. Leverage is.',
   p:'The people living on their own schedule are not working more hours than you. They picked one skill the market already pays for, and they built a system that does most of the work for them.',
   lead:'Time is not the input. A skill plus automation is.'},

  {t:'part', eyebrow:'Part one', h:'Why "make money online" usually fails'},

  {t:'body', eyebrow:'The real reason', h:'It is advice, not a trade.',
   list:['"Make money online" is a wish, not a skill a client can hand you money for.',
         'No specific trade means no specific buyer, so you compete on price and hope.',
         'Even people who learn a skill freeze at the one step that matters: getting paid clients.',
         'And whatever they build runs on their own hours, so it can never actually free them.']},

  {t:'body', eyebrow:'The shift', h:'You do not need an audience or a degree.',
   p:'You need ONE trade that businesses already pay for every single month, a simple way to become the obvious choice for it, and a system that runs the delivery without you.',
   lead:'That is the whole game. The rest of this class is how.'},

  {t:'part', eyebrow:'Part two', h:'The Antiworkaholic Method'},

  {t:'pillar', eyebrow:'Pillar 1', h:'Pick one of the three digital trades',
   p:'Get genuinely good at ONE certifiable trade that companies pay for monthly, instead of being vaguely "into marketing."',
   list:['<b>Meta advertising</b> - running the campaigns, not making the content.',
         '<b>TikTok advertising</b> - the fastest-growing paid channel right now.',
         '<b>Email marketing</b> - the revenue channel every business already owns.']},

  {t:'pillar', eyebrow:'Pillar 2', h:'Position as the go-to person',
   p:'You do not need years of experience to be the obvious choice. You need to be known for one specific trade and show up like the person who owns it.',
   list:['Niche down to one trade so the buyer instantly knows what you do.',
         'Package it as an outcome, not an hourly rate.',
         'Let a clear, narrow promise do the selling before you ever get on a call.']},

  {t:'pillar', eyebrow:'Pillar 3', h:'Book high-paying clients',
   p:'This is the step almost every program skips, and it is the only one that turns a skill into income.',
   list:['Where paying clients actually look, and how to be there.',
         'The pitch and proposal that get a yes without discounting.',
         'Onboarding that makes you look established from client number one.']},

  {t:'pillar', eyebrow:'Pillar 4', h:'Automate and delegate with AI',
   p:'Once the work is coming in, you hand off the doing. AI and a few simple systems run the delivery so the business is not your new full-time job.',
   list:['Use AI to do the heavy lifting on the actual client work.',
         'Turn every task you repeat into a system someone or something else can run.',
         'Keep your own hours down to what fits a life, not a career.']},

  {t:'body', eyebrow:'The model', h:'Why the hours get so small',
   p:'A small number of monthly clients, each on a simple retainer, with AI and systems carrying the delivery. You are managing outcomes a few hours a week, not grinding full-time.',
   lead:'This is a model, not a promise. What you earn depends on the work you put in.'},

  {t:'part', eyebrow:'Part three', h:'What it actually looks like'},

  {t:'body', eyebrow:'A month, not a week', h:'Three afternoons of work. The rest is yours.',
   p:'When the trade is set, the clients are booked, and the delivery runs on systems, a full working month collapses into a handful of focused sessions. That is where the name comes from.',
   lead:'The business is built around the life. Not the other way around.'},

  {t:'body', eyebrow:'A trade, not a course', h:'Certified, and recognized in 51 countries.',
   list:['Professional certification in Meta advertising, TikTok advertising, email marketing, and AI automation.',
         'Credentials recognized in 51 countries, so it reads as a trade, not a hobby.',
         'A private job board of client leads, so the first clients are not left to luck.']},

  {t:'why', eyebrow:'Why learn this from me', h:'I built the method I am teaching you.',
   p:'I am Laura Anderson. I created the 10hr $10k Work Month, I host The 7-Day Weekend podcast, and I have built a large community of antiworkaholics who are doing exactly this. I am not teaching theory. I am teaching the system I run my own life on.'},

  {t:'body', eyebrow:'Be honest with yourself', h:'This is not for everyone.',
   list:['If you want zero effort and instant money, this is not it.',
         'If you will not learn one real skill, the automation has nothing to run.',
         'If you are ready to trade a little focused work for a lot of freedom, keep going.']},

  {t:'recap', eyebrow:'The whole method on one slide', h:'Four pillars.',
   list:['<span class="num">1.</span> Pick one of the three digital trades.',
         '<span class="num">2.</span> Position as the go-to person.',
         '<span class="num">3.</span> Book high-paying clients.',
         '<span class="num">4.</span> Automate and delegate with AI.']},

  {t:'cta', eyebrow:'Your next step', h:'Ready to build your 10-hour work month?',
   p:'Join the Accredited 10hr $10k Work Month Bootcamp and get certified in the trades, the client-booking playbook, the AI systems, and the community that makes it stick.',
   disclaimer:'This masterclass is educational. It is not a guarantee of income or results. Your outcome depends on your effort, your market, and factors outside anyone’s control. Nothing here is financial advice.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'') + (s.t==='part'?' part':'');
  let html = '';
  if (s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if (s.h) html += (s.t==='title'||s.t==='part'||s.t==='cta') ? '<h1'+(s.t==='title'?' class="big"':'')+'>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>';
  if (s.p) html += '<p>'+s.p+'</p>';
  if (s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if (s.list){ html += '<ul>'; for (const li of s.list) html += '<li>'+li+'</li>'; html += '</ul>'; }
  if (s.pres) html += '<div class="pres">'+s.pres+'</div>';
  if (s.disclaimer) html += '<div class="disclaimer">'+s.disclaimer+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') window.scrollBy({top:window.innerHeight*0.85,behavior:'smooth'});
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') window.scrollBy({top:-window.innerHeight*0.85,behavior:'smooth'});
});
</script>
</body>
</html>
