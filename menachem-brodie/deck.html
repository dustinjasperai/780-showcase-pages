<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stronger on the Bike After 40 — The Human Vortex Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16181a; --panel:#211f20; --ink:#f4f6f6; --muted:#9fb0b2;
    --accent:#53cfc7; --pop:#d92e26; --rule:#2d3133;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:48px 44px;margin:18px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  h1,h2,h3{font-family:'Kanit',sans-serif;font-weight:600;line-height:1.08;letter-spacing:.2px}
  .kicker{font-family:'Kanit',sans-serif;font-weight:600;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .cover h1{font-size:60px;font-weight:700}
  .cover .sub{font-size:20px;color:var(--muted);margin-top:22px;max-width:48ch}
  .cover .foot{margin-top:40px;font-family:'Kanit',sans-serif;letter-spacing:1px;color:var(--ink);font-size:15px}
  h2{font-size:38px;margin-bottom:20px}
  .partnum{font-family:'Kanit',sans-serif;font-size:15px;letter-spacing:4px;text-transform:uppercase;color:var(--pop);margin-bottom:14px}
  .part h2{font-size:46px}
  .part .sub{font-size:19px;color:var(--muted);margin-top:16px}
  .body{font-size:19px;color:#dbe3e3;max-width:58ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:18px;padding:14px 0 14px 32px;border-bottom:1px solid var(--rule);position:relative;color:#e4ebeb}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
  .pcard{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .pcard .n{font-family:'Kanit',sans-serif;font-size:26px;color:var(--accent);font-weight:700}
  .pcard .pt{font-family:'Kanit',sans-serif;font-size:19px;margin:6px 0 8px}
  .pcard .pd{font-size:15px;color:var(--muted)}
  .reframe h2{font-size:40px;max-width:20ch}
  .reframe .sub{font-size:20px;color:var(--muted);margin-top:18px;max-width:56ch}
  .cta h2{font-size:44px;color:var(--accent)}
  .cta .sub{font-size:20px;color:#dbe3e3;margin-top:16px;max-width:52ch}
  .disc{margin-top:30px;font-size:13px;color:#7d8c8e;max-width:60ch}
  .idx{position:absolute;right:28px;bottom:18px;font-family:'Kanit',sans-serif;font-size:12px;letter-spacing:2px;color:#55605f}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'cover', kicker:'A Live Masterclass with Menachem Brodie', h:'Stronger on the Bike After 40', sub:'Year-round strength the Human Vortex Method way, for cyclists and triathletes who refuse to fade.', foot:'Human Vortex Training'},
  {t:'list', kicker:'The promise', h:"What you will leave with", items:["Why your power fades after 40, and what actually reverses it","The four-part method that makes strength transfer to the bike","A year-round plan so lifting helps your season instead of wrecking it"]},
  {t:'list', kicker:'Who this is for', h:'This is for you if', items:["You are 40 or older and watching your watts slip","You ride plenty but you are not getting faster","Your low back or knees niggle every big week","You tried gym programs and felt slower, not stronger"]},
  {t:'reframe', kicker:'The trap', h:'You were told to just ride more', sub:'So you added miles. The power still faded, and the aches still showed up. More volume was never the fix.'},
  {t:'reframe', kicker:'The reframe', h:'The limiter is not your engine. It is your structure.', sub:'After 40 you lose fast-twitch fibre and movement quality first. No amount of base miles rebuilds those. The right strength work can.'},
  {t:'part', num:'Part One', h:'Why endurance athletes lose power with age', sub:'And why it is reversible'},
  {t:'list', kicker:'The real story', h:'Three things change after 40', items:["Fast-twitch fibre shrinks the fastest, and that is your punch on climbs and sprints","Tendons and connective tissue get stiffer and slower to adapt","Old asymmetries turn into pain, because you have ridden around them for years"]},
  {t:'body', kicker:'The wrong fix', h:'Why not just lift like everyone else?', body:'Bodybuilding builds muscle you do not use on the bike and fatigue you cannot afford. Random gym days leave you sore for your key rides. Cyclists need a different adaptation, loaded at the right time of year.'},
  {t:'part', num:'Part Two', h:'The Human Vortex Method', sub:'The four pillars that make strength transfer to the bike'},
  {t:'pillars', kicker:'The method', h:'The four pillars', items:[
    {n:'01', pt:'Sport-specific adaptation', pd:'Train the force and the fibre cycling actually uses, not the mirror muscles.'},
    {n:'02', pt:'Movement quality first', pd:'Fix the spine, hip and asymmetry limiters, McGill-informed, before loading heavy.'},
    {n:'03', pt:'Year-round periodization', pd:'Sequence strength to your season so it supports base, build and peak instead of fighting them.'},
    {n:'04', pt:'Built around your body', pd:'Your age, history and schedule set the plan, not a template.'}
  ]},
  {t:'list', kicker:'Pillar three in practice', h:'Strength that follows your season', items:["Base: build the engine and the movement base","Build: add power and force you can put to the pedals","Peak: sharpen, hold, and stay race-ready","Recover: rebuild so next season starts higher"]},
  {t:'part', num:'Part Three', h:'Your riding year, rebuilt', sub:'Inside the Big Gear Blueprint'},
  {t:'list', kicker:'A week in the method', h:'How it runs', items:["Two short, specific strength sessions that leave your rides fresh","Movement work that quietly erases the old niggles","Clear targets, so every session has a reason","Checkpoints that adjust the plan to how you are actually responding"]},
  {t:'list', kicker:'What changes', h:'Where this takes you', items:["You hold power on the climbs instead of fading","The nagging low back and knee issues settle down","You ride into your 50s and 60s stronger, not smaller"]},
  {t:'list', kicker:'Why me', h:'Why Menachem Brodie', items:["NSCA Certified Strength and Conditioning Specialist","USA Cycling Expert-Level Coach and USA Triathlon Certified Coach","McGill Method Certified Practitioner for the lower back","SICI Certified Bike Fitter, coaching since 2008","Author of Strength Training for Cycling Performance"]},
  {t:'body', kicker:'The one idea', h:'Take this with you', body:'You do not need more miles. You need the right strength, built around your body, loaded at the right time of year. That is the Human Vortex Method.'},
  {t:'cta', kicker:'Your next step', h:'Come train with me', sub:'Book a free discovery call and we will map your year, find your limiters, and build the plan that fits your body.', disc:'This masterclass is educational. No income, result, or performance outcome is guaranteed, and results vary from rider to rider. Train within your own medical limits and consult a physician before beginning a new strength program.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck = document.getElementById('deck');
S.forEach(function(s, i){
  const slide = el('div', 'slide ' + s.t);
  if(s.kicker) slide.appendChild(el('div','kicker', s.kicker));
  if(s.t==='cover'){
    slide.appendChild(el('h1',null,s.h));
    slide.appendChild(el('div','sub',s.sub));
    slide.appendChild(el('div','foot',s.foot));
  } else if(s.t==='part'){
    slide.appendChild(el('div','partnum',s.num));
    slide.appendChild(el('h2',null,s.h));
    if(s.sub) slide.appendChild(el('div','sub',s.sub));
  } else if(s.t==='reframe'){
    slide.appendChild(el('h2',null,s.h));
    slide.appendChild(el('div','sub',s.sub));
  } else if(s.t==='body'){
    slide.appendChild(el('h2',null,s.h));
    slide.appendChild(el('div','body',s.body));
  } else if(s.t==='list'){
    slide.appendChild(el('h2',null,s.h));
    const ul=el('ul'); s.items.forEach(function(it){ul.appendChild(el('li',null,it));}); slide.appendChild(ul);
  } else if(s.t==='pillars'){
    slide.appendChild(el('h2',null,s.h));
    const g=el('div','pillars');
    s.items.forEach(function(p){const c=el('div','pcard'); c.appendChild(el('div','n',p.n)); c.appendChild(el('div','pt',p.pt)); c.appendChild(el('div','pd',p.pd)); g.appendChild(c);});
    slide.appendChild(g);
  } else if(s.t==='cta'){
    slide.appendChild(el('h2',null,s.h));
    slide.appendChild(el('div','sub',s.sub));
    slide.appendChild(el('div','disc',s.disc));
  }
  slide.appendChild(el('div','idx', String(i+1).padStart(2,'0') + ' / ' + String(S.length).padStart(2,'0')));
  deck.appendChild(slide);
});
</script>
</body>
</html>
