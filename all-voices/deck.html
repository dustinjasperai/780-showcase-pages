<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Spheres of Authentic Action — A Masterclass with Tekoah Boatner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1626; --panel:#241D30; --rule:#3A3147; --accent:#E8A33D;
    --ink:#F5EFE6; --muted:#B6A9C2;
    --head:'Zilla Slab',Georgia,serif; --body:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:linear-gradient(180deg,var(--panel),#1f1829);border:1px solid var(--rule);
    border-radius:18px;padding:52px 48px;margin:0 0 26px;min-height:420px;display:flex;
    flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(30px,5vw,52px);line-height:1.06;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(24px,3.6vw,38px);line-height:1.12;margin-bottom:14px}
  p{font-size:clamp(16px,1.7vw,19px);line-height:1.62;color:var(--ink);max-width:62ch}
  p+p{margin-top:14px}
  .sub{color:var(--muted);font-size:clamp(17px,2vw,22px);line-height:1.5;margin-top:18px;max-width:60ch}
  .big{font-family:var(--head);font-size:clamp(26px,3.8vw,40px);line-height:1.18;font-weight:600}
  .big .a{color:var(--accent)}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  li{padding-left:22px;position:relative;font-size:clamp(16px,1.7vw,19px);line-height:1.5;color:var(--ink)}
  li:before{content:"";position:absolute;left:0;top:.62em;width:9px;height:9px;border-radius:50%;
    background:var(--accent)}
  .name{color:var(--accent);font-weight:700}
  .pill{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;margin-bottom:18px}
  .num{position:absolute;right:28px;bottom:20px;font-family:var(--head);font-size:13px;color:var(--muted)}
  .spheres{display:flex;align-items:center;justify-content:center;margin:10px 0 4px}
  .disc{color:var(--muted);font-size:14px;line-height:1.5;margin-top:26px;max-width:60ch;border-top:1px solid var(--rule);padding-top:16px}
  .cta-step{font-family:var(--head);font-size:clamp(20px,2.4vw,26px);color:var(--accent);margin-top:8px}
  .lead{font-family:var(--head);font-style:italic;color:var(--muted);font-size:clamp(18px,2.2vw,24px)}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);opacity:.55}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass with Tekoah Boatner · All Voices Coaching',
  h:'The Spheres of Authentic Action',
  sub:'How mission-driven leaders make the hard calls without betraying their values, or burning out.'},

 {t:'statement',kicker:'The promise',
  big:'By the end of this hour you will have a repeatable way to make a hard decision that protects the <span class="a">mission</span> and the <span class="a">people</span>, and does not grind you down.'},

 {t:'list',kicker:'Who this is for',h:'If you lead under pressure, this is for you',
  items:['Executive directors and nonprofit founders carrying payroll and a mission at once',
   'Change agents leading in hostile political and funding landscapes',
   'Leaders of organizations that serve and are led by marginalized communities',
   'Anyone tired of choosing between what they believe and what keeps the lights on']},

 {t:'list',kicker:'The bind you know too well',h:'It usually sounds like this',
  items:['A funder says drop the language or lose the grant',
   'The board splits on whether to soften the mission to stay safe',
   'The budget only balances if someone on the team quietly burns out',
   'You are asked to choose between being honest and being funded']},

 {t:'statement',kicker:'A harder truth',
  big:'Endurance is not a strategy. The leaders who last do not push harder. They <span class="a">decide better</span>.'},

 {t:'text',kicker:'Part one: the core problem',h:'The false binary',
  body:['Almost every hard call in mission work gets framed as either/or. Mission or money. Authenticity or survival. Your values or your funder’s comfort.',
   'The either/or is the trap. It is built by scarcity, by fear, and by who holds the money, and it quietly convinces good leaders that betraying one side is the only grown-up choice.']},

 {t:'text',kicker:'Part one: the core problem',h:'Why the binary wins by default',
  body:['When the pressure is high and the clock is short, the brain reaches for the two options it can already see. Both of them cost you something you care about.',
   'The work is not to pick the less painful loss faster. The work is to find the option the binary hid.']},

 {t:'spheres',kicker:'Part two: the method',h:'Three spheres, one decision',
  sub:'Every hard call moves through three spheres, from the center out. Name them in order and the third option usually appears.'},

 {t:'text',kicker:'Sphere one',h:'Core Values',
  body:['The fundamental principles and the impact that never move. This is the center. Before anything flexes, you name what cannot.',
   'Most leaders skip this step and start negotiating from the outside in, which is how the core quietly gets traded away.']},

 {t:'text',kicker:'Sphere two',h:'Strategic Flexibility',
  body:['Where language and presentation can shift while the core work stays exactly constant. The what holds. The how and the words can move.',
   'This is the sphere funders and boards actually live in, and naming it lets you give real ground without giving up the mission.']},

 {t:'text',kicker:'Sphere three',h:'Creative Possibilities',
  body:['Where constraints stop being walls and start driving invention. The limit that felt like a dead end becomes the shape of a new path.',
   'The third option almost always lives here: a move that honors the core and answers the pressure at the same time.']},

 {t:'text',kicker:'The worked example',h:'The funder ultimatum, run through the spheres',
  body:['Core Values: the people we serve and the truth of their experience do not change. That is fixed.',
   'Strategic Flexibility: the words on the grant report can change. Strategic Possibilities: we keep the work, change the framing, and find a second funder whose values match, so no single funder owns our language again.']},

 {t:'list',kicker:'Part three: in practice',h:'A normal week, run on alignment',
  items:['One protected decision hour, so hard calls are made rested, not at 11pm',
   'Grief, boundaries, and rest treated as leadership skills, not as weakness',
   'Cultures of care instead of cultures of sacrifice',
   'A team that can name the non-negotiable out loud, together']},

 {t:'statement',kicker:'Alignment over endurance',
  big:'Sustainable success comes from aligning operations with values, so the mission and the humans behind it can both <span class="a">thrive</span>, not just survive.'},

 {t:'list',kicker:'Why me',h:'Tekoah Boatner',
  items:['15+ years as a nonprofit executive, including Executive Director of Youth Oasis',
   'Host of the Breaking the Binary podcast for nonprofit leaders and change agents',
   'Author of This Isn’t Normal: A Field Guide to Workplace Trauma and Cultural Repair',
   'Founder of All Voices Coaching, at the intersection of strategy, culture, and equity']},

 {t:'list',kicker:'In one line each',h:'The three spheres, to keep',
  items:['Core Values: name what never moves',
   'Strategic Flexibility: flex the words, hold the work',
   'Creative Possibilities: let the constraint show you the third option']},

 {t:'cta',kicker:'Your next step',h:'Bring your hardest open decision',
  step:'Work it with me inside Leadership Excellence coaching.',
  body:['Pick the one call you have been avoiding. In Leadership Excellence we run it through all three spheres together, and build the decision habit so the next hard call is easier.',
   'All Voices Coaching · allvoicescoaching.com'],
  disc:'Educational content only. No income, outcome, or result is guaranteed. Results vary by leader, organization, and context.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('section','slide');
  if(s.kicker) sl.appendChild(el('div','kicker',s.kicker));
  if(s.t==='title'){sl.appendChild(el('h1',null,s.h)); if(s.sub) sl.appendChild(el('p','sub',s.sub));}
  else if(s.t==='statement'){sl.appendChild(el('div','big',s.big));}
  else if(s.t==='spheres'){
    sl.appendChild(el('div','spheres','<svg width="260" height="200" viewBox="0 0 260 200" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="130" cy="100" r="92" stroke="#3A3147" stroke-width="2"/><circle cx="130" cy="100" r="60" stroke="#B6A9C2" stroke-width="2"/><circle cx="130" cy="100" r="28" fill="#E8A33D" fill-opacity="0.18" stroke="#E8A33D" stroke-width="2"/><text x="130" y="104" text-anchor="middle" font-family="Zilla Slab,serif" font-size="13" fill="#E8A33D">Core</text></svg>'));
    sl.appendChild(el('h2',null,s.h)); if(s.sub) sl.appendChild(el('p','sub',s.sub));
  }
  else if(s.t==='text'){sl.appendChild(el('h2',null,s.h)); s.body.forEach(b=>sl.appendChild(el('p',null,b)));}
  else if(s.t==='list'){sl.appendChild(el('h2',null,s.h)); const ul=el('ul'); s.items.forEach(it=>ul.appendChild(el('li',null,it))); sl.appendChild(ul);}
  else if(s.t==='cta'){
    sl.appendChild(el('h2',null,s.h));
    sl.appendChild(el('div','cta-step',s.step));
    s.body.forEach(b=>sl.appendChild(el('p',null,b)));
    sl.appendChild(el('div','disc',s.disc));
  }
  sl.appendChild(el('div','num',(i+1)+' / '+S.length));
  deck.appendChild(sl);
});
</script>
</body>
</html>
