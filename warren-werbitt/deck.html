<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specialize, Scale, Partner, or Pivot - The Print Whisperer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eceff0; --panel:#fafdfd; --rule:#d7dedf; --ink:#17191d; --muted:#565d60;
    --accent:#1f4e5f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Lato",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 64px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:46px 44px;margin:16px 0;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;top:0;left:0;width:6px;height:100%;background:var(--accent)}
  .reg{position:absolute;top:18px;right:20px;width:16px;height:16px;border-radius:50%;
    background:conic-gradient(var(--accent) 0 25%,transparent 0 50%,var(--accent) 0 75%,transparent 0);
    border:1px solid var(--accent);opacity:.5}
  h1,h2,h3{font-family:"Poppins",system-ui,sans-serif;line-height:1.14;letter-spacing:-.01em}
  .eyebrow{font-family:"Poppins";font-weight:600;font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);margin-bottom:16px}
  .title h1{font-size:46px;font-weight:700;margin-bottom:18px}
  h2{font-size:34px;font-weight:600;margin-bottom:16px}
  h3{font-size:22px;font-weight:600;margin:0 0 6px}
  p{font-size:19px;color:var(--ink);max-width:70ch;margin-bottom:12px}
  p.sub{font-size:21px;color:var(--muted)}
  .lead{font-size:26px;font-weight:400;color:var(--ink)}
  ul{list-style:none;margin:10px 0}
  li{font-size:19px;padding:10px 0 10px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .roads{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
  .road{border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
  .road.pick{border-color:var(--accent);border-width:2px;background:#f4f8f9}
  .road h3{color:var(--accent)}
  .road p{font-size:16px;color:var(--muted);margin:0}
  .big{font-size:40px;font-family:"Poppins";font-weight:700;color:var(--accent)}
  .foot{position:absolute;bottom:16px;left:44px;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);font-family:"Poppins"}
  .disc{font-size:14px;color:var(--muted);max-width:66ch;margin-top:18px}
  .cta h2{font-size:38px}
  .cta .big{font-size:22px;margin-top:8px}
  @media(max-width:640px){.slide{padding:30px 22px}.title h1{font-size:34px}h2{font-size:26px}.roads{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Warren Werbitt',h:'Specialize, Scale, Partner, or Pivot',sub:'The crossroads every print shop owner hits, and the one road that actually pays.'},
  {t:'who',eyebrow:'Who this is for',h:'The owner who is busy and still not winning',body:['You run a print shop. The floor is full, the phone rings, the team is working.','And somehow the profit never shows up the way the volume says it should.','If that is you, this hour is for you.']},
  {t:'trap',eyebrow:'The trap',h:'You said yes to everything',body:['Every job that walked in, you quoted. Every quote you could win, you took.','It felt like growth. It was really just motion.','A shop that does a little of everything competes with everyone and owns nothing.']},
  {t:'reframe',eyebrow:'The hard truth',h:'You do not have a volume problem. You have a lane problem.',lead:'More work will not fix a shop that has not decided what it is best at. It just buries the same margin problem under more hours.'},
  {t:'part',eyebrow:'Part one',h:'Why busy shops stay flat',body:['When you take every job, you price against every competitor, so you price down.','Generalist work is a race to the bottom line, and the bottom line keeps shrinking.','The fix is not more. The fix is a decision.']},
  {t:'part',eyebrow:'Part two',h:'The four roads in front of you',body:['Every owner I work with is standing at the same crossroads, whether they see it or not.','There are four roads out of a flat shop. Only one of them is right for you.']},
  {t:'roads',eyebrow:'The framework',h:'Specialize, Scale, Partner, or Pivot',roads:[
    {h:'Specialize',p:'Own a niche. Win the margin instead of the headcount.',pick:true},
    {h:'Scale',p:'Do more of what you do. Only works if the margin is already there.'},
    {h:'Partner',p:'Share the load with someone whose strengths cover your gaps.'},
    {h:'Pivot',p:'Change the game when the current one has stopped paying.'}]},
  {t:'content',eyebrow:'Before you choose',h:'Three questions decide the road',body:['How much capital do you actually have to work with?','What do you genuinely want your days to look like?','How will you reach the customers that road depends on?'],foot:'Answer these honestly and the road usually chooses itself.'},
  {t:'content',eyebrow:'The road that pays',h:'Why I push owners toward specialize',body:['A specialist is not compared to everyone. You set the price because you are the obvious choice.','I watched a shop go from fighting on every general job to owning one canvas niche.','Same building, same people, far better margins and far steadier revenue.']},
  {t:'statement',eyebrow:'The principle',h:'Price it like a business, not a hobby',lead:'Stop racing to the bottom-line number. Review the spec line by line, ask the qualifying questions, and quote the value. A lane gives you the right to do that.'},
  {t:'content',eyebrow:'What it is not',h:'Specializing is not shrinking',body:['You are not throwing work away. You are deciding what you are known for.','The general work can still come. It just stops setting your prices.','Focus is what lets a small shop out-earn a bigger one.']},
  {t:'part',eyebrow:'Part three',h:'What a decided shop looks like',body:['The quotes get faster because you know your lane cold.','The team gets sharper because they are doing one thing, not ten.','The P&L finally moves, because margin, not motion, is driving it.']},
  {t:'content',eyebrow:'People first',h:'A shop that does not depend on you',body:['Most shop problems are people problems, not machine problems.','Build the mentorship your young staff never got, so the work does not all live in your head.','That is also how you get a shop someone would one day want to buy.']},
  {t:'credibility',eyebrow:'Why listen to me',h:'I ran the shop before I coached it',body:['I spent 27 years building a print company to 120 people before I started advising owners.','I made these calls with my own payroll on the line, not from a slide.','Now I help owners make them faster, and with less to lose.'],foot:'Warren Werbitt, The Print Whisperer'},
  {t:'content',eyebrow:'The recap',h:'Decide, then price, then build',body:['Pick your road. For most shops that is specialize.','Price the lane like a business. Review the spec, quote the value.','Then build the people and the plan so the shop can run and one day sell.']},
  {t:'cta',eyebrow:'Your next step',h:'Let us pick your lane together',lead:'If this hour named something you have been feeling, the next step is a conversation about your shop specifically.',big:'Book a call at theprintwhisperer.com',disc:'This masterclass is for educational purposes only. Every shop is different and results vary. Nothing here is a guarantee of income, margin, or business outcomes.'}
];
const deck=document.getElementById('deck');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t||'');
  let h='<span class="reg"></span>';
  if(s.eyebrow)h+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.t==='title'){h+='<div class="title"><h1>'+esc(s.h)+'</h1></div><p class="sub">'+esc(s.sub)+'</p>';}
  else{h+='<h2>'+esc(s.h)+'</h2>';}
  if(s.lead)h+='<p class="lead">'+esc(s.lead)+'</p>';
  if(s.body){h+='<ul>';s.body.forEach(b=>h+='<li>'+esc(b)+'</li>');h+='</ul>';}
  if(s.roads){h+='<div class="roads">';s.roads.forEach(r=>{h+='<div class="road'+(r.pick?' pick':'')+'"><h3>'+esc(r.h)+'</h3><p>'+esc(r.p)+'</p></div>';});h+='</div>';}
  if(s.big)h+='<div class="big">'+esc(s.big)+'</div>';
  if(s.disc)h+='<p class="disc">'+esc(s.disc)+'</p>';
  if(s.foot)h+='<div class="foot">'+esc(s.foot)+'</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
