<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Becoming a Sleep Consultant · Jayne Havens, Center for Pediatric Sleep Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4f4f2; --panel:#e7edf2; --rule:#d8e0e8;
    --acc:#5289a8; --acc2:#6e88a0; --ink:#3a3a37;
    --grey:#5f5d59; --dim:#8a8a86; --cream:#f4f4f2;
  }
  html,body{height:100%}
  body{background:#e4e9ee;font-family:'Lato',-apple-system,sans-serif;color:var(--grey);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e4e9ee}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Lato',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.13;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:94%;color:var(--grey)}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Lato',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:3.0vh;max-width:76%;line-height:1.66;font-weight:400}
  .sub{font-family:'Playfair Display',serif;font-style:italic;font-size:2.0vw;color:var(--acc);margin-top:3.6vh;max-width:84%;line-height:1.42;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Lato',sans-serif;font-size:1.05vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(135% 135% at 50% 8%,#2c333c 0%,#1b2026 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(135% 135% at 50% 100%,#2c333c 0%,#1b2026 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Lato',sans-serif;color:#dbe3ea;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.62}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.84vw;color:var(--dim);text-align:center;line-height:1.5}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .moon{position:absolute;pointer-events:none}
  .title-moon{right:8%;bottom:9%;width:15vw;opacity:.95}
  .corner-moon{right:7%;bottom:8%;width:7vw;opacity:.5}
  .brandline{font-family:'Lato',sans-serif;font-size:1.1vw;color:var(--grey);margin-top:3.8vh;font-weight:700;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(58,58,55,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Center for Pediatric Sleep Management</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a waning crescent settling toward a soft dawn arc (night to morning), drawn in her slate blue -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="moon" viewBox="0 0 120 120">
  <g fill="none" stroke="#5289a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 26 a34 34 0 1 0 0 68 a26 26 0 1 1 0 -68 Z" opacity="0.9"/>
    <path d="M20 100 a40 40 0 0 1 80 0" opacity="0.45"/>
    <circle cx="38" cy="34" r="1.8" fill="#5289a8" stroke="none" opacity="0.8"/>
    <circle cx="30" cy="52" r="1.4" fill="#5289a8" stroke="none" opacity="0.6"/>
    <circle cx="50" cy="22" r="1.3" fill="#5289a8" stroke="none" opacity="0.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Becoming a Sleep Consultant',sub:'How to turn helping tired families into a real, flexible business you build around your own life.',brand:true,moon:'title'},
 {t:'normal',k:'Who this is for',title:'You do not need a medical degree. You need a method and a plan.',body:'Maybe you found sleep help when you were the exhausted parent, and it changed your whole house. Now you want to do that for other families, on your own schedule. The desire is there. What is missing is a clear path from "I would love to do this" to actually doing it.'},
 {t:'dark',title:'The world is full of exhausted parents. It is short on people trained to actually help them.'},

 {t:'section',idx:'Part One',title:'The Opportunity Nobody Explains'},
 {t:'normal',k:'A real, growing field',title:'Pediatric sleep support is a genuine profession, not a side hobby.',body:'Families search for sleep help every single night, and they want a real human who can guide them, not another blog post. It is work you can do from home, from anywhere, around your own kids. The demand is not the hard part.'},
 {t:'normal',k:'The catch',title:'A certificate on the wall is not the same as a business.',body:'This is where most people stall. They get certified, feel proud, and then freeze, because nobody taught them how to find that first client, what to say, or what to charge. Knowing how to help a family and knowing how to run the practice are two different skills.'},
 {t:'dark',title:'A certification shows you did the work. It does not hand you clients.'},

 {t:'section',idx:'Part Two',title:'The CPSM Success Method'},
 {t:'normal',k:'Client-led, method-agnostic',title:'There is no one-size-fits-all way to teach a child to sleep.',body:'Every family is different, and so is every child. Rather than forcing one branded technique on everyone, you learn several, and you learn to meet each family where they are, in a way that fits their parenting style and comfort level. That is what lets you help the family in front of you, not just the textbook one.'},
 {t:'normal',k:'Two jobs at once',title:'You are training to be a consultant and an owner at the same time.',body:'The CPSM Success Method is built to prepare you for both. One half is the sleep science and the techniques, so you can actually get results. The other half is the business, so you can launch, grow, and even scale a practice that pays you. Skip either half and it does not hold together.'},
 {t:'normal',k:'Where clients come from',title:'Your first clients come from trust, long before they come from ads.',body:'A tired parent hands their child\'s sleep to someone they believe in. That trust is built the honest way, by showing up and being genuinely helpful, through conversations, community, and referrals from families you have already helped. Learn to build that, and the clients start to come.'},
 {t:'normal',k:'You are not alone in it',title:'The fastest way to get stuck is to try to figure it all out by yourself.',body:'This is why mentorship matters more than any single lesson. Having someone experienced to answer the real questions, and a community of consultants who have been exactly where you are, is often what gets you through the first hard client instead of quietly giving up.'},
 {t:'dark',title:'Method-agnostic means you can help the family in front of you, not only the one the method was written for.'},

 {t:'section',idx:'Part Three',title:'What the First Year Can Look Like'},
 {t:'normal',k:'Built around your life',title:'Meaningful work that fits around your family, instead of competing with it.',body:'You set the hours. You choose how many families you take on. For a lot of people this starts in the margins of a full life, a few clients at a time, and grows from there. The point was never to trade one overwhelming schedule for another.'},
 {t:'normal',k:'Income on your terms',title:'A practice you can grow at the pace that is right for you.',body:'Because you own it, you decide how far it goes. Some keep it small and steady alongside everything else. Others build it into their main income and hire help. The method is the same either way: help families well, and let the trust and the referrals compound.'},
 {t:'normal',k:'Why learn this from Jayne Havens',title:'Someone who built the practice first, then the path for others.',body:'Jayne Havens founded Snooze Fest, her own pediatric sleep practice, and then the Center for Pediatric Sleep Management to train and mentor others into the field. She hosts the Becoming a Sleep Consultant podcast, a show about the business of this work, and is known as a trusted voice in the industry. You would be learning the path from someone who has actually walked it.'},
 {t:'dark',title:'You do not have to choose between meaningful work and being there for your kids.'},

 {t:'section',idx:'Your Next Step',title:'Get Certified with CPSM'},
 {t:'normal',k:'Keep going',title:'The full training, the certification, and a mentor in your corner.',body:'The CPSM Sleep Consultant Certification is the complete path: the sleep science, the method-agnostic techniques, the business training, and extended one-on-one mentorship, plus a community of consultants to grow with. Everything you need to go from wanting this to doing it for real.'},
 {t:'cta',title:'Ready to become a certified sleep consultant?',body:'Enroll in the CPSM Sleep Consultant Certification and build the business behind it, with Jayne in your corner.',chips:['Enroll in the certification','Join the free community'],disc:'Educational content for aspiring and practicing sleep consultants. No income or business result is guaranteed. Results vary by person, effort, and market.'},
];

const deck=document.getElementById('deck');
function moon(kind){return `<svg class="moon ${kind==='title'?'title-moon':'corner-moon'}"><use href="#moon"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='cta'){
    h+=`<h1>${s.title}</h1>`;
    if(s.body) h+=`<div class="body" style="color:#dbe3ea;text-align:center;max-width:72%">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">${s.chips.map(c=>`<div class="chip">${c}</div>`).join('')}</div>`;
    if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  } else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Center for Pediatric Sleep Management &nbsp;&middot;&nbsp; <b>Jayne Havens</b></div>`;
  }
  if(s.moon) h+=moon(s.moon);
  else if(s.t!=='dark'&&s.t!=='section'&&s.t!=='cta'&&i>0) h+=moon('corner');
  d.innerHTML=h;
  deck.appendChild(d);
});

let cur=0;const slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('bar'),count=document.getElementById('count'),hint=document.getElementById('hint');
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  if(cur>0&&hint) hint.style.opacity='0';
}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1);
});
show(0);
</script>
</body>
</html>
