<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Freedom Success Formula | Tania M. Adams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf8f4;
    --panel:#f3efe7;
    --ink:#1a2a38;
    --ink-soft:#3c4a57;
    --ink-muted:#6c7680;
    --rule:#e7e0d4;
    --accent:#c8963e;
  }
  html,body{height:100%}
  body{font-family:'Poppins',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:960px}
  .slide.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:52px;line-height:1.1;letter-spacing:-.01em}
  h2{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:38px;line-height:1.18;margin-bottom:20px}
  .sub{font-size:21px;color:var(--ink-soft);line-height:1.5;margin-top:22px;font-weight:300}
  p.body{font-size:20px;color:var(--ink-soft);line-height:1.6;font-weight:300;max-width:46ch}
  ul{list-style:none;margin-top:14px}
  ul li{font-size:19px;color:var(--ink-soft);line-height:1.5;font-weight:300;padding:10px 0 10px 28px;position:relative;border-bottom:1px solid var(--rule)}
  ul li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .part{font-family:'EB Garamond',Georgia,serif;font-size:19px;color:var(--accent);font-weight:500;margin-bottom:10px;letter-spacing:.04em}
  .big{font-family:'EB Garamond',Georgia,serif;font-size:44px;line-height:1.2;font-weight:500;max-width:20ch}
  .byline{margin-top:40px;font-size:16px;color:var(--ink-muted);font-weight:400}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:34px 38px;margin-top:8px}
  .cta-step{font-size:21px;color:var(--ink);font-weight:400;margin:8px 0}
  .disc{font-size:13px;color:var(--ink-muted);line-height:1.5;margin-top:30px;max-width:60ch;font-weight:300}
  .nav{position:fixed;bottom:22px;right:26px;font-size:13px;color:var(--ink-muted);font-family:'Poppins',sans-serif}
  .nav b{color:var(--ink)}
  .hint{position:fixed;bottom:22px;left:26px;font-size:12px;color:var(--ink-muted)}
  @media(max-width:640px){h1{font-size:34px}h2{font-size:27px}.big{font-size:30px}.sub{font-size:18px}p.body,ul li{font-size:16px}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hint">Use arrow keys to navigate</div>
<div class="nav"><b id="cur">1</b> / <span id="tot">1</span></div>
<script>
const S=[
 {t:'title',k:'A live masterclass with Tania M. Adams',h:'The Freedom Success Formula',sub:'Why success stops feeling like freedom for high achievers, and the brain-based change that finally holds under pressure.',by:'Tania M. Adams · ICF (PCC) Executive Coach · Creator of the Identity Agreements model'},
 {t:'who',h:'Who this is for',list:['Founders and entrepreneurs who have built something real','Executives and senior leaders carrying the weight for everyone else','High performers who are successful on paper and still feel the ceiling','People who have done the work and sense there is another layer']},
 {t:'trap',k:'The trap',h:'You did what should have made you free',body:'You built, achieved, and held it together. Yet the same patterns keep returning. You overthink decisions you should be able to make. You push through exhaustion and call it responsibility. You know what needs to change and still get pulled back.'},
 {t:'hook',part:'The reframe',big:'What looks like self-sabotage is usually self-preservation.'},
 {t:'part',part:'Part One',h:'The core problem',body:'The problem is not discipline. It is not strategy. Your brain is still running identity agreements you did not consciously make.'},
 {t:'predict',h:'The brain runs on prediction',body:'It reaches for what feels familiar, efficient, and safe, even when that pattern now costs you in your work, your body, your relationships, and your peace of mind. It is protecting an older model of who you are.'},
 {t:'level',h:'You can work hard on the wrong level for years',body:'When the real issue sits underneath awareness, you can improve your habits and still hit the same ceiling. You can know exactly what needs to change and still not do it. More success on paper, no more freedom inside it.'},
 {t:'part',part:'Part Two',h:'Identity Agreements',body:'An identity agreement is an unconscious commitment about who you have to be in order to stay safe, accepted, or in control. It organises your behaviour beneath awareness.'},
 {t:'form',h:'How an agreement forms',body:'It made sense once, in an earlier environment. It kept you safe, earned approval, or got results. The environment changed. The agreement did not, and it still behaves as though the old world is current.'},
 {t:'show',h:'How agreements show up',list:['Over-functioning, because resting feels unsafe','Pushing through exhaustion and calling it responsibility','Guilt the moment you slow down','The same pattern repeating across work, health, money, and relationships']},
 {t:'part',part:'Part Two',h:'Freedom, redefined',body:'Freedom is not more money, more time, or the right circumstances. In this work, freedom is an internal neurological state: the capacity to stay clear, steady, and functional when the outcome is not yet known.'},
 {t:'freedom2',h:'When that capacity strengthens',body:'Decisions become cleaner. Leadership becomes steadier. Relationships become more honest. Success stops feeling like something you have to force or hold together through pressure alone.'},
 {t:'part',part:'Part Three',h:'The Freedom Success Formula',body:'This is the brain-based blueprint for identity-level change. It makes the hidden architecture visible, then rewires it at the level where change is actually generated.'},
 {t:'step',part:'Step 1',h:'Name the one pattern',body:'We map the single identity agreement organising your behaviour under pressure. One pattern, named precisely, not a list of everything you want to fix.'},
 {t:'step',part:'Step 2',h:'Make the mechanism visible',body:'Once you can see what the agreement is protecting and what it predicts, you stop fighting yourself. The problem gets named properly, so you can work at the right level.'},
 {t:'step',part:'Step 3',h:'Rewire at the identity level',body:'Not another round of discipline, strategy, or positive thinking. We change the agreement itself, so the new behaviour feels safe to the brain and holds when the pressure returns.'},
 {t:'result',h:'On the other side of the rewire',list:['You make the decision without the spiral','Rest stops triggering guilt','Pressure is no longer your main performance tool','Internal freedom and external results stop competing and start arriving together']},
 {t:'why',k:'Why this work',h:'Where this comes from',body:'I am Tania M. Adams, an ICF (PCC) accredited executive and neuroscience-based coach. Eighteen years and more than 3,250 hours coaching executives, founders, and senior leaders sit behind this. My work lives where applied neuroscience, identity-level change, and commercially grounded strategy meet.'},
 {t:'recap',h:'The whole formula in one line',big:'See the agreement, understand what it protects, and rewire it where change is actually made.'},
 {t:'cta',h:'Your next step',steps:['If you recognised your own pattern in this, the next step is a NeuroRewire 30-minute Neural Pattern Mapping conversation.','We identify the one identity agreement currently running the show, and I show you what rewiring it would involve.','Book yours at crazyalwayswins.com.'],disc:'This masterclass is educational. No specific result or income is guaranteed. Results vary and depend on your own effort and circumstances. This work is coaching, not therapy, and is not a substitute for medical, psychological, or financial advice.'}
];
const stage=document.getElementById('stage');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(sl){
 if(sl.t==='title')return `<div class="kicker">${esc(sl.k)}</div><h1>${esc(sl.h)}</h1><div class="sub">${esc(sl.sub)}</div><div class="byline">${esc(sl.by)}</div>`;
 if(sl.t==='hook'||sl.t==='recap')return `${sl.part?`<div class="part">${esc(sl.part)}</div>`:''}<div class="big">${esc(sl.big)}</div>`;
 if(sl.t==='cta'){
   let s=`${sl.k?`<div class="kicker">${esc(sl.k)}</div>`:''}<h2>${esc(sl.h)}</h2><div class="panel">`;
   s+=sl.steps.map(x=>`<div class="cta-step">${esc(x)}</div>`).join('');
   s+=`</div><div class="disc">${esc(sl.disc)}</div>`;return s;
 }
 let s=`${sl.k?`<div class="kicker">${esc(sl.k)}</div>`:''}${sl.part?`<div class="part">${esc(sl.part)}</div>`:''}<h2>${esc(sl.h)}</h2>`;
 if(sl.body)s+=`<p class="body">${esc(sl.body)}</p>`;
 if(sl.list)s+=`<ul>${sl.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 return s;
}
stage.innerHTML=S.map((sl,i)=>`<div class="slide${i===0?' on':''}" data-i="${i}">${render(sl)}</div>`).join('');
document.getElementById('tot').textContent=S.length;
let cur=0;const slides=[...document.querySelectorAll('.slide')];
function go(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((e,i)=>e.classList.toggle('on',i===cur));document.getElementById('cur').textContent=cur+1}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});
document.addEventListener('click',e=>{if(e.clientX<window.innerWidth*0.3)go(cur-1);else go(cur+1)});
</script>
</body>
</html>
