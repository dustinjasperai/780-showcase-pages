<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Control to Influence — a masterclass with Casey O'Roarty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#26151f;        /* ground, derived from brand plum #7d4860 darkened */
    --panel:#321b28;     /* panel, plum family */
    --rule:#4a2c3a;      /* hairline, plum family */
    --ink:#f6eef0;       /* text, derived from brand #f4f0f0 */
    --muted:#c9aebb;     /* muted plum-rose */
    --accent:#b12397;    /* raspberry, brand dominant hex (uses:6) */
    --display:'Poppins',sans-serif;  /* geometric, echoes their Lulo display caps */
    --body:'Mulish',sans-serif;      /* humanist, echoes their Avenir body */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  .slide{display:none;width:100%;height:100%;padding:7vh 9vw;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kicker{font-family:var(--display);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:clamp(11px,1.1vw,14px);color:var(--accent);margin-bottom:28px}
  h1{font-family:var(--display);font-weight:700;line-height:1.02;font-size:clamp(34px,6vw,80px);letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;line-height:1.08;font-size:clamp(26px,4.1vw,52px);letter-spacing:-.005em;max-width:20ch}
  .sub{font-size:clamp(17px,2vw,26px);color:var(--muted);margin-top:24px;max-width:26ch;line-height:1.4}
  p.body{font-size:clamp(16px,1.6vw,21px);line-height:1.6;max-width:42ch;margin-top:20px}
  .big{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,64px);line-height:1.05;max-width:20ch}
  .quote{font-family:var(--display);font-weight:600;font-size:clamp(24px,3.5vw,46px);line-height:1.18;max-width:22ch}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px;max-width:44ch}
  li{position:relative;padding-left:40px;font-size:clamp(16px,1.7vw,22px);line-height:1.4}
  li .n{position:absolute;left:0;top:-2px;font-family:var(--display);font-weight:700;color:var(--accent);font-size:clamp(18px,2vw,26px)}
  li b{font-family:var(--display);font-weight:600}
  li span.d{display:block;color:var(--muted);font-size:clamp(14px,1.35vw,18px);margin-top:4px;line-height:1.45}
  .pillholder{display:flex;gap:16px;margin-top:34px;flex-wrap:wrap}
  .pill{font-family:var(--display);font-weight:600;border:1px solid var(--rule);border-radius:999px;padding:12px 22px;font-size:clamp(14px,1.4vw,19px)}
  .pill.hot{background:var(--accent);border-color:var(--accent);color:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:min(8vw,90px);align-items:start;width:100%}
  .label{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:clamp(12px,1.2vw,15px);margin-bottom:10px}
  .disc{margin-top:38px;color:var(--muted);font-size:clamp(11px,1.05vw,14px);line-height:1.5;max-width:62ch}
  .foot{position:fixed;left:9vw;bottom:4vh;font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--muted)}
  .count{position:fixed;right:9vw;bottom:4vh;font-family:var(--display);font-size:12px;color:var(--muted)}
  .brandline{height:4px;width:84px;background:var(--accent);margin-top:32px;border-radius:2px}
  @media(max-width:760px){.two{grid-template-columns:1fr;gap:26px}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="foot">Joyful Courage &middot; Casey O'Roarty, M.Ed.</div>
<div class="count"><span id="cur">1</span> / <span id="tot">1</span></div>
<script>
const S = [
  {t:'title', k:'A Live Masterclass for Parents of Tweens and Teens',
   h:'From Control to Influence',
   sub:'How to stay connected to your teenager while they pull away, without losing yourself in the process.'},

  {t:'list', k:'The Promise', h:'By the end of this hour you will know',
   items:[
     ['Why the old tools stopped working,','and what adolescence is actually asking of you.'],
     ['How to regulate yourself first,','so the hard moments stop running the house.'],
     ['How to hold a boundary and the relationship at the same time.','']
   ]},

  {t:'list', k:'Who This Is For', h:'You are raising a tween or a teen, and the ground has shifted.',
   items:[
     ['The rules and lectures that used to work now land as eye rolls and slammed doors.',''],
     ['You feel the closeness slipping, and you miss them even when they are in the next room.',''],
     ['You love this kid fiercely, and you are tired of feeling like the bad guy.','']
   ]},

  {t:'big', k:'The Trap', big:'The harder you grip, the faster they pull away.',
   body:'When a teen pushes, the instinct is to tighten the rules and raise the stakes. It feels like doing your job. It is also the exact move that teaches them to hide, to lie, and to wait you out.'},

  {t:'quote', k:'The Reframe',
   quote:'The teen years are not the end of your influence. They are the test of whether it was built on control, or on connection.'},

  {t:'part', k:'Part One', h:'Why control stops working in the teen years'},

  {t:'copy', k:'The Core Problem', h:'Your teen is wired to separate from you. That is the assignment.',
   body:['Adolescence is the developmental job of becoming a separate person. Pushing on limits, testing values, and guarding privacy are not defiance for its own sake. They are how a child practices being an adult.',
         'Control collides head on with that job, so it provokes the very resistance it is trying to stop.']},

  {t:'twoquote', k:'The Power Struggle Loop',
   quote:'Push, resist, escalate, disconnect. Then repeat.',
   body:['You lay down the law. They push back. You raise the consequence. They dig in or go underground. Everyone loses a little trust.',
         'The loop is not a sign you have a bad kid or that you are a bad parent. It is a sign the strategy is matched to the wrong stage.']},

  {t:'part', k:'Part Two', h:'The shift: from control to influence'},

  {t:'pills', k:'The Core Idea', h:'You cannot control a teenager. You can keep your influence.',
   body:'Control is leverage you hold over someone. Influence is the pull of a relationship someone chooses to stay in. One expires the day they are bigger than you. The other can last the rest of your lives.',
   pills:[['Control: fear, leverage, compliance',false],['Influence: trust, connection, cooperation',true]]},

  {t:'list', k:'The Practice: Breath, Body, Balcony', h:'Regulate yourself before you respond to them.',
   items:[
     ['Breath.','One slow exhale that is longer than the inhale. It tells your nervous system you are not actually in danger.'],
     ['Body.','Feel your feet, unclench your jaw, drop your shoulders. You cannot think clearly in a body braced for a fight.'],
     ['Balcony.','Step up to the balcony and look down at the whole scene, then ask the one question that changes everything: what do I want to create here?']
   ]},

  {t:'copy', k:'Positive Discipline for Teens', h:'Kind and firm at the same time. Not kind, then firm when you snap.',
   body:['Kindness without firmness is permissive, and teens feel unheld by it. Firmness without kindness is the control trap. The skill is holding both in the same breath: warm about the person, clear about the limit.',
         'Connection before correction. A teen will not take your guidance through a door you just slammed.']},

  {t:'bigbody', k:'Boundaries WITH Love',
   big:'A boundary is something you keep, not a punishment you deliver.',
   body:'The screen goes off at ten because sleep matters, not to win. You can be completely steady on the limit and completely warm toward the kid who is furious about it. That combination is what builds a teen who can hold their own boundaries one day.'},

  {t:'part', k:'Part Three', h:'At your kitchen table, on a hard Tuesday night'},

  {t:'contrast', k:'Same Limit, Different Move',
   oldlabel:'The old move', old:'"Because I said so. Give me the phone. We are done talking about this."',
   newlabel:'The influence move', newmove:'"I can tell this really matters to you. The answer is still no for tonight, and I want to understand what you were hoping for."',
   body:'Same limit. Same parent. The second version keeps the door open, so the next hard conversation has somewhere to happen.'},

  {t:'list', k:'What Changes First', h:'You will notice it in the small moments.',
   items:[
     ['The fights get shorter, because you stop adding fuel to them.',''],
     ['They start telling you the thing they would have hidden a month ago.',''],
     ['You end the day feeling like their parent again, not their warden.','']
   ]},

  {t:'whoquote', k:'Why Learn This With Me',
   quote:'I have spent twenty years in the mess of this with families, and in my own home.',
   who:[
     "Casey O'Roarty, M.Ed., Positive Discipline Lead Trainer.",
     'Host of the Joyful Courage podcast, twice weekly for parents of tweens and teens.',
     'Author of Joyful Courage: Calming the Drama and Taking Control of YOUR Parenting Journey.',
     'Mother of two who learned every one of these tools the hard way.'
   ]},

  {t:'cta', k:'Keep Going Together', h:'Keep going with me inside Living Joyful Courage.',
   steps:['The membership where parents of tweens and teens get the full Positive Discipline for Teens class, monthly coaching, and a community that is living this alongside you.',
          'besproutable.com/teens'],
   disc:'This masterclass is for educational purposes only. No parenting outcome or result is guaranteed. Results vary from family to family, and every teenager is different. Nothing here is therapy or a substitute for care from a qualified mental health professional. If your child is in crisis, please reach out to a licensed provider.'}
];

function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function liList(items){return '<ul>'+items.map(([a,b])=>`<li><span class="n">&#8226;</span><b>${esc(a)}</b>${b?`<span class="d">${esc(b)}</span>`:''}</li>`).join('')+'</ul>';}
function numList(items){let i=0;return '<ul>'+items.map(([a,b])=>{i++;return `<li><span class="n">${i}</span><b>${esc(a)}</b>${b?`<span class="d">${esc(b)}</span>`:''}</li>`;}).join('')+'</ul>';}

function tpl(s){
  switch(s.t){
    case 'title': return `<div class="kicker">${esc(s.k)}</div><h1>${esc(s.h)}</h1><div class="brandline"></div><p class="sub">${esc(s.sub)}</p>`;
    case 'list':
      // numbered list for The Promise, bullets otherwise
      return `<div class="kicker">${esc(s.k)}</div><h2>${esc(s.h)}</h2>${s.k==='The Promise'?numList(s.items):liList(s.items)}`;
    case 'big': return `<div class="kicker">${esc(s.k)}</div><p class="big">${esc(s.big)}</p><p class="body">${esc(s.body)}</p>`;
    case 'bigbody': return `<div class="kicker">${esc(s.k)}</div><p class="quote">${esc(s.big)}</p><p class="body">${esc(s.body)}</p>`;
    case 'quote': return `<div class="kicker">${esc(s.k)}</div><p class="quote">${esc(s.quote)}</p>`;
    case 'part': return `<div class="label">${esc(s.k)}</div><h1 style="max-width:18ch">${esc(s.h)}</h1><div class="brandline"></div>`;
    case 'copy': return `<div class="kicker">${esc(s.k)}</div><h2>${esc(s.h)}</h2>${s.body.map(p=>`<p class="body">${esc(p)}</p>`).join('')}`;
    case 'twoquote': return `<div class="kicker">${esc(s.k)}</div><div class="two"><div><p class="quote">${esc(s.quote)}</p></div><div>${s.body.map(p=>`<p class="body">${esc(p)}</p>`).join('')}</div></div>`;
    case 'pills': return `<div class="kicker">${esc(s.k)}</div><h2>${esc(s.h)}</h2><p class="body">${esc(s.body)}</p><div class="pillholder">${s.pills.map(([p,hot])=>`<div class="pill${hot?' hot':''}">${esc(p)}</div>`).join('')}</div>`;
    case 'contrast': return `<div class="kicker">${esc(s.k)}</div><div class="two"><div><div class="label">${esc(s.oldlabel)}</div><p class="body">${esc(s.old)}</p><div class="label" style="margin-top:30px">${esc(s.newlabel)}</div><p class="body">${esc(s.newmove)}</p></div><div><p class="body">${esc(s.body)}</p></div></div>`;
    case 'whoquote': return `<div class="kicker">${esc(s.k)}</div><div class="two"><div><p class="quote">${esc(s.quote)}</p></div><div>${liList(s.who.map(w=>[w,'']))}</div></div>`;
    case 'cta': return `<div class="kicker">${esc(s.k)}</div><h2>${esc(s.h)}</h2>${s.steps.map((p,i)=>`<p class="body"${i===1?' style="font-family:var(--display);font-weight:600"':''}>${esc(p)}</p>`).join('')}<p class="disc">${esc(s.disc)}</p>`;
  }
  return '';
}

const stage = document.getElementById('stage');
S.forEach((s,i)=>{const d=document.createElement('section');d.className='slide'+(i===0?' on':'');d.innerHTML=tpl(s);stage.appendChild(d);});
document.getElementById('tot').textContent = S.length;
let idx = 0;
const slides = () => document.querySelectorAll('.slide');
function show(n){const a=slides();idx=Math.max(0,Math.min(a.length-1,n));a.forEach((el,x)=>el.classList.toggle('on',x===idx));document.getElementById('cur').textContent=idx+1;}
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){show(idx+1);e.preventDefault();}if(['ArrowLeft','ArrowUp'].includes(e.key)){show(idx-1);e.preventDefault();}});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.35)show(idx+1);else show(idx-1);});
</script>
</body>
</html>
