<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Music Studio Owner's Exit From Every Task &middot; Grow Your Music Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f8f9; --panel:#e9eef1; --rule:#d6dde1;
    --accent:#1d7fa3; --coral:#c9553b;
    --chalk:#171d24; --grey:#4d5760; --dim:#7c858c;
  }
  html,body{height:100%}
  body{background:#e4e9ec;font-family:'Roboto',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e4e9ec}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .38s ease;
    display:flex;flex-direction:column;justify-content:flex-end;padding:8% 9% 13% 9%}
  .slide.active{opacity:1;visibility:visible}
  .t-normal::after{content:'';position:absolute;left:0;right:0;bottom:0;height:.9vh;background:var(--accent);opacity:.9}
  .kicker{font-family:'Roboto',sans-serif;font-size:.92vw;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'Montserrat',Georgia,sans-serif;font-weight:800;color:var(--chalk);line-height:1.1;letter-spacing:-.005em}
  .t-title{justify-content:center}
  .t-title h1{font-size:4.6vw;max-width:82%;color:var(--chalk)}
  .t-title .sub{font-family:'Roboto',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:3.4vh;max-width:66%;line-height:1.6;font-weight:300}
  .t-normal h1{font-size:2.9vw;max-width:82%;font-weight:600}
  .t-normal .body{font-family:'Roboto',sans-serif;font-size:1.34vw;color:var(--grey);margin-top:2.8vh;max-width:72%;line-height:1.62;font-weight:300}
  .t-section{background:var(--panel);justify-content:center;border-left:1.6vw solid var(--accent)}
  .t-section .idx{font-family:'Roboto',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  .t-section h1{font-size:3.9vw;max-width:78%;font-weight:800}
  .t-hit{background:var(--bg);justify-content:center;align-items:flex-start}
  .t-hit h1{font-size:3vw;max-width:78%;color:var(--accent);line-height:1.16;font-weight:600}
  .t-hit .body{font-family:'Roboto',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3vh;max-width:64%;font-weight:300}
  .t-cta{background:var(--panel);justify-content:center;align-items:center;text-align:center;border-top:1.1vh solid var(--accent)}
  .t-cta h1{font-size:3.5vw;max-width:80%;color:var(--chalk);font-weight:800}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Roboto',sans-serif;border:1.5px solid var(--accent);color:var(--accent);padding:1.2vh 1.8vw;font-size:1.05vw;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .brandline{font-family:'Roboto',sans-serif;font-size:1vw;color:var(--grey);margin-top:3.6vh;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:600}
  .disc{position:absolute;left:9%;right:9%;bottom:4.6vh;font-family:'Roboto',sans-serif;font-size:.8vw;color:var(--dim);line-height:1.45;font-weight:300}
  .t-cta .disc{text-align:center;bottom:3.4vh}
  .steps{position:absolute;pointer-events:none}
  .steps.big{right:5%;top:10%;width:16vw;opacity:.85}
  .steps.small{right:6%;top:11%;width:7vw;opacity:.45}
  .hud{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(23,29,36,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:12px;right:18px;font-family:'Roboto',sans-serif;font-size:11px;letter-spacing:.2em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Roboto',sans-serif;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:11px;left:50%;transform:translateX(-50%);font-family:'Roboto',sans-serif;font-size:10px;color:var(--dim);z-index:20;letter-spacing:.14em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.5vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:2.9vw}
    .t-title .sub{font-size:3.1vw}.t-section h1{font-size:7vw}.t-hit h1{font-size:5.6vw}.t-cta h1{font-size:6.6vw}.chip{font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">Grow Your Music Studio</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ascending SOP-checklist rungs, one motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="steps" viewBox="0 0 200 160">
  <g fill="none" stroke="#40afd7" stroke-linecap="round">
    <path d="M8 148 H52" stroke-width="4"/>
    <rect x="14" y="132" width="10" height="10" rx="2" stroke-width="2.6"/>
    <path d="M60 116 H104" stroke-width="4"/>
    <rect x="66" y="100" width="10" height="10" rx="2" stroke-width="2.6"/>
    <path d="M112 84 H156" stroke-width="4"/>
    <rect x="118" y="68" width="10" height="10" rx="2" stroke-width="2.6"/>
    <path d="M164 52 H192" stroke-width="4"/>
    <circle cx="192" cy="36" r="7" stroke-width="3"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:"The Music Studio Owner's Exit From Every Task",sub:'Why you are still the bottleneck in your own studio, the hiring and SOP system that changes it, and what a studio actually looks like when it can run for a week without you.',brand:true,line:'big'},

 {t:'normal',k:'Who this is for',title:'Owners with at least one hired teacher who still touch every part of the business.',body:'You are not disorganized. You built something real. But hiring, scheduling, billing, and the thousand small decisions still route through you, and every one of them caps how big this can get.'},
 {t:'normal',k:'What you will walk away with',title:'A hiring system and a set of SOPs you can hand someone on day one.',body:'What to eliminate from your own plate before you hire, how to run the hiring process itself, and what has to be written down before a new teacher can run without you standing over them.'},
 {t:'normal',k:'An honest note',title:'This is education, not a promise.',body:'Every studio is different and every market pays differently. What matters is the version of this system that fits your studio and your region.',disc:'Educational content. Nothing here is a promise of income, growth, or business results. No outcome is guaranteed and results vary by studio and market.'},
 {t:'normal',k:'Who is teaching this',title:'Daniel Patterson. Founder of Grow Your Music Studio.',body:"He ran his own studio to six figures on roughly 23 hours a week, then spent since 2015 working with nearly 1,000 studios. Everything in this class comes from Scale Your Studio, the actual system his own studio still runs on, not a theory he read somewhere."},

 {t:'section',idx:'Part One',title:'Why You Are Still Doing Everything Yourself'},
 {t:'normal',k:'It is rarely a hiring problem',title:'Most owners already have people. The work still finds its way back to them.',body:'No written process, no clear handover, no way to check the work without doing it yourself. When nothing is written down, everything defaults back to the one person who knows how it all works.'},
 {t:'hit',title:'A hire you train from memory is a gamble. A hire who runs your SOP is a system.',body:'One of those scales. The other one means training the next person from scratch, every single time.',line:'small'},
 {t:'normal',k:'The quiet cost',title:'Every task you have not written down is a task only you can do.',body:'That caps your studio at whatever one person can carry. It also means a single sick week, a single vacation, turns into a pile of decisions waiting for you to get back.'},
 {t:'normal',k:'What most owners try',title:'Hiring someone good and hoping they figure it out.',body:'It works for a while, for the sharpest hires. Then they leave, and eighteen months of institutional knowledge leaves with them, because none of it was ever written anywhere but your head.'},

 {t:'section',idx:'Part Two',title:'The Hiring and SOP System'},
 {t:'normal',k:'Start by eliminating',title:'Before you hire anyone, name the core functions of the business and what should not be your job.',body:'Most owners hire before they know exactly what they are hiring for. Naming the function first is what makes the hire land right, instead of just adding a second person doing everything.'},
 {t:'normal',k:'The hiring system',title:'A real recruitment process: job postings, interviews, and contracts, ready to use.',body:'Contractor and employee agreements, an interview process that actually screens for the role, and a posting that attracts the right person instead of whoever applies first.'},
 {t:'hit',title:'Your entire business is a collection of parts. It is a system, whether you have written it down or not.',line:'small'},
 {t:'normal',k:'The handover',title:'Onboarding and training, written down once, so it is teachable and not tribal.',body:'The morning routine, the parent conversation, the way a lesson gets rescheduled, the way a complaint gets handled. Written down, it becomes something anyone can learn. Held in your head, it becomes another reason you have to be there.'},

 {t:'section',idx:'Part Three',title:'A Studio That Runs Without You On Site'},
 {t:'normal',k:'Working with your team',title:'Once the system exists, the team runs on it instead of on you.',body:'Decisions stop routing back to the owner by default. The system answers most of the questions before they ever reach you.'},
 {t:'normal',k:'What changes',title:'Fewer fires, fewer things only you can answer, and a week you can actually take off.',body:'Hiring stops being a gamble. Training stops starting from zero every time. And the studio can take on the next teacher, because you finally know what has to be true before you do.'},
 {t:'hit',title:'The goal is not being needed everywhere. It is being replaceable on purpose.',line:'small'},
 {t:'normal',k:'The scaling calendar',title:'A plan for what gets built next, in order, instead of whatever is loudest this week.',body:'Once the foundation, hiring, and training systems exist, the scaling calendar is what turns "we should grow" into an actual sequence of what happens next.'},

 {t:'normal',k:'Where to take it next',title:'The hiring templates, the SOPs, the contracts, and the scaling calendar already exist as a system.',body:'Scale Your Studio is the full six-block stack, built from what Grow Your Music Studio has used with nearly 1,000 studios, with a path into 1:1 coaching if you want it built into your studio directly.'},
 {t:'cta',title:'Write it down. Hand it off. Get your time back.',chips:['Scale Your Studio','Book a scaling call'],brand:true,disc:'Educational content only. No income, growth, or business result is guaranteed. Results vary by studio, team, and market.'},
];

const deck=document.getElementById('deck');
function stepsMark(kind){return `<svg class="steps ${kind==='big'?'big':'small'}" viewBox="0 0 200 160"><use href="#steps"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1>`;
  } else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Grow Your <b>Music Studio</b> &middot; Daniel Patterson</div>`;
  }
  if(s.line) h+=stepsMark(s.line);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
