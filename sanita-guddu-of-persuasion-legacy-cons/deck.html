<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Joy of Giving — a masterclass by Sanita Guddu, Persuasion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0;      /* warm ivory ground (site_scheme: light) */
    --panel:#F2E9DB;   /* soft sand */
    --ink:#2A2622;     /* warm near-black */
    --rule:#E3D6C2;
    --accent:#B5632B;  /* terracotta — the joy-of-giving warmth */
    --accent2:#3E6B5E; /* muted legacy green */
    --serif:"Newsreader",Georgia,serif;
    --sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:64px 56px;margin:0 0 26px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;right:-70px;bottom:-70px;width:200px;height:200px;
    border-radius:50%;border:14px solid var(--rule);opacity:.5} /* the "legacy lens" motif */
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.14;margin-bottom:18px}
  .sub{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--accent2);margin-top:18px}
  p{font-size:19px;line-height:1.6;max-width:62ch;margin-top:14px}
  ul{margin:22px 0 0 0;padding:0;list-style:none;max-width:64ch}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;border-bottom:1px solid var(--rule);position:relative}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:50%;
    border:3px solid var(--accent)}
  .big{font-family:var(--serif);font-size:40px;line-height:1.18;font-weight:400}
  .kicker{font-size:16px;color:var(--accent2);font-weight:600;margin-bottom:10px;
    font-family:var(--sans);text-transform:uppercase;letter-spacing:.1em}
  .brandline{margin-top:36px;font-family:var(--sans);font-size:16px;color:var(--ink)}
  .brandline b{color:var(--accent)}
  .disc{margin-top:26px;font-size:13px;color:#7a7066;max-width:60ch;line-height:1.5}
  .num{position:absolute;top:22px;right:28px;font-size:13px;color:#9a9185;font-family:var(--sans)}
  .cta .big{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass · Persuasion',
    h:'The Joy of Giving',
    sub:'How any charity can grow gifts in wills, without a specialist legacy team',
    brand:'with Sanita Guddu'},

  {t:'audience', kicker:'Who this is for',
    h:'Fundraisers who know legacies matter, but have never been shown how',
    list:['Small charities with no dedicated legacy fundraiser','New legacy leads who inherited the programme and no map','Trustees and teams who want gifts in wills, quietly',"Anyone who finds the will conversation awkward to start"]},

  {t:'trap', kicker:'The trap',
    h:'Legacy giving gets treated as morbid, specialist, and only for the big charities',
    p:'So it sits in a silo nobody owns. The ask never gets made. And the single largest gift your supporters could ever give slips quietly past.'},

  {t:'hook', kicker:'The uncomfortable truth',
    big:'The biggest gift your charity will ever receive is the one you are currently too uncomfortable to ask for.'},

  {t:'p1', kicker:'Part one · the real problem',
    h:'It was never about death. It became about fear.',
    p:'Fear of being morbid. Fear of sounding grabby. Fear you need a legal expert in the room. So the conversation gets avoided, and avoidance is what actually loses the gift.'},

  {t:'cost', kicker:'What avoidance costs',
    h:'Legacies are left on the table by the charities who need them most',
    p:'The supporters who love you most are often the ones who would remember you in their will. If nobody ever invites them to, the money goes elsewhere, and your mission is the quieter for it.'},

  {t:'p2', kicker:'Part two · the method',
    h:'The Joy of Giving',
    sub:'Reframe the whole conversation, and it stops being hard'},

  {t:'pillar', kicker:'Pillar one',
    h:'Lead with joy, not with death',
    p:'A legacy gift is someone looking back on their life and choosing to make a lasting difference. Talk about the change they leave behind, not about dying. The conversation becomes warm, not grim.'},

  {t:'pillar', kicker:'Pillar two',
    h:'Blend legacy into everything you already do',
    p:'Legacy does not need its own department. Woven into your newsletter, your events and your thank-you calls, it becomes one natural option among many. That is how a small team runs legacy without a specialist.'},

  {t:'pillar', kicker:'Pillar three',
    h:'The Legacy Lens',
    sub:'Look at what you already own, through one simple question',
    p:'Every touchpoint you have is a chance to mention gifts in wills. The Legacy Lens is the habit of asking, of this email, this page, this letter: is it quietly doing its legacy job?'},

  {t:'lens', kicker:'The Legacy Lens · 1',
    h:'Your email signature',
    p:'Hundreds of emails leave your charity every week. One warm line about remembering the cause in a will turns routine admin into a gentle, repeated invitation.'},

  {t:'lens', kicker:'The Legacy Lens · 2',
    h:'Your LinkedIn and your comms',
    p:'Your donors really are there, scrolling. A single post about the joy of leaving a gift reaches people a leaflet never will, and starts the conversation before you ever pick up the phone.'},

  {t:'lens', kicker:'The Legacy Lens · 3',
    h:'Your thank-you and stewardship',
    p:'The moment after someone gives is the warmest moment you will ever have with them. A kind, well-timed mention of a lasting gift belongs here, not in a cold mailshot.'},

  {t:'timing', kicker:'When to start the conversation',
    h:'Life writes the will, not you',
    p:'People write and rewrite their will around the big moments: a new home, a new grandchild, a loss, a milestone birthday. Meet those moments with warmth and the conversation feels natural, never pushy.'},

  {t:'p3', kicker:'Part three · what it looks like',
    h:'A small charity, no specialist, more legacy conversations than ever',
    p:'Not a new hire. Not a rebrand. Just a team that leads with joy, blends legacy into what it already sends, and looks at every touchpoint through the lens. The asks get made. The pledges follow.'},

  {t:'shift', kicker:'The shift',
    big:'From a taboo nobody wants to raise, to a conversation your whole team is glad to have.'},

  {t:'why', kicker:'Why listen to me',
    h:'Sanita Guddu',
    p:'Fifteen years in the legacy world. Over one hundred legacy events and two hundred talks in the community. Founder of Persuasion and host of the Legacy Fundraising Chat podcast. I help charities of every size turn gifts in wills from an awkward subject into their warmest conversation.'},

  {t:'recap', kicker:'The method, in one breath',
    h:'Joy, not death. Blended, not siloed. Seen through the lens.',
    list:['Lead every legacy conversation with the joy of giving','Blend legacy into the comms you already send','Run the Legacy Lens across your everyday touchpoints','Meet the life moments that prompt a will']},

  {t:'cta', kicker:'Your next step',
    h:'Bring the joy of giving to your charity',
    big:'Work with Persuasion to build a legacy programme your whole team can run.',
    p:'If this is the conversation your charity has been avoiding, let us start it together.',
    disc:'This masterclass is educational. It shares approaches to legacy fundraising; it is not legal, tax or financial advice, and it makes no guarantee of income or results. Outcomes vary by charity.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'');
  let html='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h && s.t==='title') html+='<h1>'+s.h+'</h1>'; else if(s.h) html+='<h2>'+s.h+'</h2>';
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.big) html+='<p class="big">'+s.big+'</p>';
  if(s.p) html+='<p>'+s.p+'</p>';
  if(s.list){html+='<ul>';s.list.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  if(s.brand) html+='<div class="brandline"><b>Persuasion</b> &middot; '+s.brand+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
