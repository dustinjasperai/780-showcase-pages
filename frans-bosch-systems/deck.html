<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Strength Training Doesn't Transfer | A Frans Bosch Systems Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f7f9f9;
    --panel:#eef2f2;
    --ink:#14201f;
    --ink-soft:#3b4a49;
    --ink-muted:#6c7b7a;
    --accent:#0c8890;
    --accent-deep:#0e848d;
    --rule:#d7e0df;
  }
  html,body{height:100%;}
  body{
    font-family:'Lora',Georgia,serif;
    background:#0b1413;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  .stage{width:100%;max-width:1040px;margin:0 auto;}
  .slide{
    display:none;
    background:var(--bg);
    aspect-ratio:16/9;
    width:100%;
    padding:64px 72px;
    position:relative;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
  }
  .slide.active{display:flex;}
  .eyebrow{font-family:'Mulish',sans-serif;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
  h1{font-family:'Mulish',sans-serif;font-weight:800;font-size:52px;line-height:1.08;color:var(--ink);letter-spacing:-0.01em;margin-bottom:22px;}
  h2{font-family:'Mulish',sans-serif;font-weight:800;font-size:38px;line-height:1.14;color:var(--ink);letter-spacing:-0.01em;margin-bottom:20px;}
  .sub{font-size:23px;line-height:1.5;color:var(--ink-soft);max-width:40ch;}
  .body{font-size:21px;line-height:1.6;color:var(--ink-soft);max-width:46ch;}
  .body p{margin-bottom:14px;}
  ul{list-style:none;margin-top:10px;}
  li{font-size:20px;line-height:1.5;color:var(--ink-soft);padding-left:30px;position:relative;margin-bottom:16px;max-width:44ch;}
  li::before{content:"";position:absolute;left:0;top:13px;width:14px;height:3px;background:var(--accent);border-radius:2px;}
  li strong{color:var(--ink);font-weight:600;font-family:'Mulish',sans-serif;}
  .pillar-n{font-family:'Mulish',sans-serif;font-weight:800;font-size:17px;color:var(--accent);letter-spacing:.14em;margin-bottom:14px;}
  .quote{font-family:'Lora',serif;font-style:italic;font-size:27px;line-height:1.45;color:var(--ink);max-width:42ch;}
  .quote .mark{color:var(--accent);font-style:normal;font-weight:700;}
  .cite{font-family:'Mulish',sans-serif;font-style:normal;font-size:15px;letter-spacing:.04em;color:var(--ink-muted);margin-top:22px;}
  .title-slide{background:var(--bg);}
  .title-slide::before{content:"";position:absolute;left:72px;top:64px;width:64px;height:5px;background:var(--accent);border-radius:3px;}
  .cta-slide{background:var(--ink);}
  .cta-slide .eyebrow{color:#5fd0d6;}
  .cta-slide h2{color:#fff;}
  .cta-slide .body,.cta-slide li{color:#c4d2d1;}
  .cta-slide li strong{color:#fff;}
  .disclaimer{font-family:'Mulish',sans-serif;font-size:13px;line-height:1.5;color:var(--ink-muted);max-width:60ch;margin-top:30px;}
  .cta-slide .disclaimer{color:#8aa09f;}
  .band{display:flex;gap:10px;margin-top:26px;}
  .band span{height:8px;border-radius:4px;}
  .band .a{width:120px;background:var(--accent);}
  .band .b{width:34px;background:var(--accent-deep);opacity:.6;}
  .band .c{width:56px;background:var(--rule);}
  .foot{position:absolute;left:72px;bottom:30px;font-family:'Mulish',sans-serif;font-size:13px;letter-spacing:.08em;color:var(--ink-muted);text-transform:uppercase;}
  .cta-slide .foot{color:#6f8584;}
  .count{position:absolute;right:24px;bottom:22px;font-family:'Mulish',sans-serif;font-size:12px;color:var(--ink-muted);letter-spacing:.1em;z-index:20;}
  .cta-slide .count{color:#6f8584;}
  .nav{position:fixed;inset:0;display:flex;justify-content:space-between;z-index:10;}
  .nav div{flex:1;cursor:pointer;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
  .two .body,.two li{max-width:38ch;}
  .cardbox{background:var(--panel);border-left:4px solid var(--accent);padding:22px 26px;border-radius:4px;}
  .cardbox h3{font-family:'Mulish',sans-serif;font-size:18px;color:var(--ink);margin-bottom:8px;}
  .cardbox p{font-size:17px;line-height:1.45;color:var(--ink-soft);}
  @media (max-width:720px){
    .slide{padding:34px 30px;}
    h1{font-size:30px;}h2{font-size:24px;}.sub{font-size:17px;}.body,li{font-size:16px;}
    .quote{font-size:19px;}.two{grid-template-columns:1fr;gap:18px;}
    .foot{left:30px;}.title-slide::before{left:30px;top:34px;}
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="nav"><div id="prev"></div><div id="next"></div></div>
<div class="count" id="count"></div>

<script>
const S=[
  {t:'title',eyebrow:'A Frans Bosch Systems Masterclass',
   h1:'Why Strength Training Doesn’t Transfer',
   sub:'And the coordination-first fix behind the Frans Bosch method, for coaches and physiotherapists who want gym work to show up on the field.'},

  {t:'body',eyebrow:'What you will leave with',h2:'The hour, in one line',
   body:'<p>A clear way to tell the difference between training that gets an athlete <strong>strong</strong> and training that actually changes how they <strong>move</strong>.</p><p>We will build the lens, name the four things that decide transfer, and look at what it changes on the floor on Monday.</p>'},

  {t:'list',eyebrow:'Who this is for',h2:'If you coach movement, this is for you',
   items:['<strong>Strength & conditioning coaches</strong> whose athletes get strong in the gym but plateau in sprinting, jumping and cutting.',
          '<strong>Sports physiotherapists</strong> rehabbing athletes back to high-intensity movement, not just back to pain-free.',
          '<strong>Athletic development and skills coaches</strong> who feel the gap between the weight room and the sport.']},

  {t:'list',eyebrow:'The trap',h2:'The numbers go up. The sport doesn’t change.',
   items:['The squat, the clean and the bench all climb on the sheet.',
          'On the field the athlete looks the same, or slower, or keeps breaking down in the same place.',
          'So you add more load, more volume, more accessory work. The gap stays open.'],
   foot:'The customer’s world'},

  {t:'quote',eyebrow:'The reframe',
   quote:'The problem is almost never <span class="mark">how much</span> your athlete can lift. It is that strength built on mechanical principles does not organise itself the way the sport demands.',
   cite:'The dark truth most programs never say out loud'},

  {t:'body',eyebrow:'Part one · the core problem',h2:'Strength is not a number. It is an organisation.',
   body:'<p>Classical strength training treats the body like a machine: load a muscle, it gets stronger, the strength shows up everywhere.</p><p>But movement is not built from separate parts. Strength, speed, coordination and skill develop together, structured by motor control and motor learning. Train the parts in isolation and the body has no reason to use them in the pattern that matters.</p>'},

  {t:'two',eyebrow:'Part one · why isolation fails',h2:'The transfer gap',
   left:'<p class="body">Transfer is the whole game: does the work in the gym change the movement in the sport?</p><p class="body">An exercise can look hard, measure well, and transfer almost nothing, because the nervous system learns what you actually practise, not what you intend.</p>',
   right:'<div class="cardbox"><h3>Trains well, transfers little</h3><p>Heavy, isolated, stable, slow. Great numbers, little carryover.</p></div><div class="cardbox" style="margin-top:16px;"><h3>Trains the pattern</h3><p>Built around the coordination the sport actually uses.</p></div>'},

  {t:'body',eyebrow:'Part two · the lens',h2:'Movement as a complex dynamic system',
   body:'<p>Instead of a machine, see the athlete as a self-organising system. Thousands of elements settle into a few stable patterns on their own.</p><p>Your job is not to assemble the movement part by part. It is to read the system and shape the conditions so the right pattern emerges. Four ideas make that practical.</p>',
   band:true},

  {t:'pillar',n:'Pillar one',h2:'Attractors',
   body:'<p>Attractors are the deep, stable coordination patterns the movement keeps returning to: the essential features every good sprinter or jumper shares.</p><p>These are what you protect and strengthen. Train against an attractor and the system fights you. Train with it and change sticks.</p>'},

  {t:'pillar',n:'Pillar two',h2:'Fluctuations',
   body:'<p>Fluctuations are the individual variation around the pattern: the wobble, the quirk, the athlete’s own solution.</p><p>Most coaching tries to sand these off. In a dynamic system they are functional. What looks like an error is often the body solving a problem you have not seen yet.</p>'},

  {t:'pillar',n:'Pillar three',h2:'Muscle slack',
   body:'<p>Before a muscle can transfer force, it has to take up its own slack. That delay is where explosive power leaks away.</p><p>Training to minimise slack, so force transmits instantly through a stiff, connected system, is often the difference between a strong athlete and a fast one.</p>'},

  {t:'pillar',n:'Pillar four',h2:'Training for context',
   body:'<p>The pattern only transfers if it is trained in conditions close enough to the sport: the right speed, the right intention, the right instability.</p><p>Context is not decoration on top of a strength program. It is what decides whether the strength ever reaches the field.</p>'},

  {t:'quote',eyebrow:'Putting it together',
   quote:'Knowing the terminology is not the same as being able to look at a complex athlete and <span class="mark">decide what should change</span>.',
   cite:'Analysis is the skill. The four ideas are how you make the decision.'},

  {t:'list',eyebrow:'Part three · on the floor',h2:'What it changes Monday',
   items:['<strong>Sprinting:</strong> stop chasing a bigger squat; train stiffness and slack so force hits the ground faster.',
          '<strong>Cutting and agility:</strong> protect the attractor, let the athlete’s own fluctuations find the solution.',
          '<strong>Return to sport:</strong> rehab as movement reorganisation, not a checklist of pain-free reps.']},

  {t:'two',eyebrow:'Part three · rehabilitation',h2:'The same lens, applied to injury',
   left:'<p class="body">A dynamic-systems approach reaches into rehab from the earliest stages, not just at return to play.</p><p class="body">The FBS ACL injury work builds the protocol around how high-intensity movement is actually organised, so the knee is ready for the sport, not just the clinic.</p>',
   right:'<div class="cardbox"><h3>Clinic-ready</h3><p>Pain-free, strong on the dynamometer, cleared on a checklist.</p></div><div class="cardbox" style="margin-top:16px;"><h3>Sport-ready</h3><p>Movement reorganised to meet the real demands of the game.</p></div>'},

  {t:'list',eyebrow:'Why this, why us',h2:'Where this method comes from',
   items:['Built by <strong>Frans Bosch</strong>, who has coached elite sprinters and jumpers since 1980 and teaches biomechanics at Fontys University.',
          'Author of <strong>Strength Training and Coordination</strong> and <strong>Anatomy of Agility</strong>, translated into five languages.',
          'Used in the field with national rugby teams, Olympic programs and clubs across the NBA, MLB and NFL.'],
   foot:'Why me'},

  {t:'list',eyebrow:'Avoid these',h2:'The three most common mistakes',
   items:['Judging an exercise by how hard it feels instead of what it transfers.',
          'Coaching the fluctuation out of an athlete who was already solving the problem.',
          'Treating strength, speed and skill as separate projects with separate sessions.']},

  {t:'body',eyebrow:'The recap',h2:'The method in four moves',
   body:'<p>Read the system. Protect the <strong>attractors</strong>. Respect the <strong>fluctuations</strong>. Take up the <strong>slack</strong> and train it in <strong>context</strong>.</p><p>Do that and strength stops being a number on a sheet and starts being movement the sport can use.</p>'},

  {t:'cta',eyebrow:'Take the method further',h2:'Go deeper with the FBS courses',
   body:'<p>This hour is the surface of the system. The full theory and its practical application live in the Frans Bosch Systems courses.</p>',
   items:['<strong>FBS International Course:</strong> the hybrid starting point, online modules plus a live practical weekend.',
          '<strong>FBS Advanced &amp; ACL courses:</strong> movement analysis and rehabilitation, hands-on.',
          '<strong>Start with the books:</strong> Strength Training and Coordination, and Anatomy of Agility.'],
   disc:'This masterclass is educational. It does not guarantee any specific athletic, performance, rehabilitation or business outcome; results vary by individual, sport and application. Always work within your professional scope of practice.'}
];

const stage=document.getElementById('stage');
const counter=document.getElementById('count');
let i=0;

function esc(s){return s;}
function render(s){
  let inner='';
  const foot=s.foot?`<div class="foot">${s.foot}</div>`:'';
  if(s.t==='title'){
    inner=`<div class="slide active title-slide"><div class="eyebrow">${s.eyebrow}</div><h1>${s.h1}</h1><p class="sub">${s.sub}</p><div class="band"><span class="a"></span><span class="b"></span><span class="c"></span></div></div>`;
  }else if(s.t==='body'){
    const band=s.band?`<div class="band"><span class="a"></span><span class="b"></span><span class="c"></span></div>`:'';
    inner=`<div class="slide active"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><div class="body">${s.body}</div>${band}${foot}</div>`;
  }else if(s.t==='list'){
    inner=`<div class="slide active"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>${foot}</div>`;
  }else if(s.t==='quote'){
    inner=`<div class="slide active"><div class="eyebrow">${s.eyebrow}</div><div class="quote">${s.quote}</div><div class="cite">${s.cite}</div></div>`;
  }else if(s.t==='pillar'){
    inner=`<div class="slide active"><div class="pillar-n">${s.n}</div><h2>${s.h2}</h2><div class="body">${s.body}</div></div>`;
  }else if(s.t==='two'){
    inner=`<div class="slide active"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><div class="two"><div>${s.left}</div><div>${s.right}</div></div></div>`;
  }else if(s.t==='cta'){
    inner=`<div class="slide active cta-slide"><div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><div class="body">${s.body}</div><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul><div class="disclaimer">${s.disc}</div></div>`;
  }
  stage.innerHTML=inner;
  counter.textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render(S[i]);}
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')go(i+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);
});
render(S[0]);
</script>
</body>
</html>
