<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Agency Second Brain - ManagedCoder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ecf0fe; --panel:#fbfcff; --rule:#dae0e7; --ink:#33475b;
    --muted:#5b6b7c; --accent:#29868e; --deep:#1f5f66;
    --head:'Poppins',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 72px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:44px 48px;margin:18px 0;min-height:380px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(51,71,91,.03)}
  .slide.cover{background:linear-gradient(180deg,#fbfcff 0%,#e3e9f8 100%);border-color:var(--accent)}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 14px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.08;margin:0 0 16px;color:var(--ink)}
  h2{font-family:var(--head);font-weight:700;font-size:30px;line-height:1.14;margin:0 0 14px;color:var(--ink)}
  p{font-size:19px;line-height:1.6;color:var(--muted);margin:0 0 12px;max-width:46ch}
  .sub{font-size:21px;color:var(--ink);max-width:48ch}
  ul{margin:8px 0 0;padding:0;list-style:none;max-width:52ch}
  li{font-size:18px;line-height:1.5;color:var(--ink);padding:10px 0 10px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:4px;top:18px;width:10px;height:10px;border-radius:3px;background:var(--accent)}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.1;color:var(--ink);max-width:20ch}
  .big .a{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:60ch}
  .grid li{border:1px solid var(--rule);border-radius:10px;background:#f4f7ff}
  .num{font-family:var(--head);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.08em}
  .ladder{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .step{font-family:var(--head);font-weight:600;font-size:15px;color:var(--deep);background:#e8f2f2;
    border:1px solid #bfe0e0;border-radius:999px;padding:8px 14px}
  .disc{font-size:13px;color:#8191a1;margin-top:18px;max-width:60ch;line-height:1.5}
  .foot{font-size:13px;color:#9aa7b4;margin-top:22px;font-family:var(--head);letter-spacing:.04em}
  .pg{font-size:12px;color:#aab6c2;text-align:right;margin:-8px 4px 0}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title', cover:true, k:"A live masterclass for agency owners", h:"Build Your Agency Second Brain", sub:"How to run a 10 to 30 person agency without being the bottleneck."},
  {t:'who', k:"Who this is for", h:"You hired good people. The work still routes through you.", list:["You own a software or digital agency with 10 to 30+ people","Things move when you explain them, and stall when you do not","You are tired of answering the same questions every week","You want the agency to run on a system, not on your memory"]},
  {t:'trap', k:"The trap", h:"The knowledge lives in one place your team cannot reach.", body:"How the agency actually runs, your standards, your formats, the way you scope and report, lives in your head. So every handoff comes back to you. Hiring more people does not fix it. It just adds more people who have to ask."},
  {t:'reframe', k:"The reframe", big:true, h:"Your best senior person is a <span class='a'>document you never wrote.</span>", body:"Delegation is not a hire. It is a system that knows how your agency runs."},
  {t:'part', k:"Part one", h:"Why delegation keeps failing", body:"Not because your people are not capable. Because you are handing them tasks without handing them the context. Judgment lives in your memory, and memory does not scale, does not transfer, and does not show up when you are on vacation."},
  {t:'cost', k:"What it costs", h:"The single point of failure is you.", list:["Quality swings depending on whether you touched it","Onboarding a new hire takes months of you re-explaining","You cannot step away without the work slowing down","The agency is worth less because it depends on one person"]},
  {t:'part', k:"Part two", h:"The method: an Agency Second Brain", body:"Take how the agency runs out of your head and into one shared system your team and your tools both read from. Three moving parts."},
  {t:'pillar', k:"Pillar one", num:"01", h:"The Agency Second Brain", body:"One shared context layer that holds how you actually operate: your services, pricing, client types, tools, and brand voice. Written down once, it becomes the source every teammate and every tool reaches for, instead of reaching for you."},
  {t:'pillar', k:"Pillar two", num:"02", h:"Operating Skills, not one-off asks", body:"Turn each recurring owner task into a reusable Skill: client status reports, proposals and SOWs, meeting notes to tasks, scope watchdog, the weekly team digest. The task gets delegated to a procedure that produces your standard every time, not re-taught from scratch."},
  {t:'grid', k:"The library", h:"35 Skills across 10 operating areas", grid:["Owner direction","Client success","Sales and pipeline","Delivery and scope","Team and leadership","Marketing and voice","Research","Finance","Systems","Events"]},
  {t:'pillar', k:"Pillar three", num:"03", h:"The adoption ladder", body:"You do not flip a switch. You climb a ladder, one rung at a time, starting with a single Skill used by hand on real agency work before anything gets automated."},
  {t:'ladder', k:"The path", h:"Learn to Operate", steps:["Learn","Build a Skill","Build the Brain","Connect","Automate","Delegate","Operate"], body:"Use a Skill manually on real agency data first. Then build the Brain, connect your tools, automate the routine, delegate with confidence, and operate the company on the system."},
  {t:'part', k:"Part three", h:"When the system runs the week, not you", body:"The work produces your standard whether or not you touched it. A new hire reads the Brain instead of booking time with you. You spend your week on the few decisions only you can make."},
  {t:'daylist', k:"Before and after", h:"A week run on a system, not on you", list:["The same client report goes out, in your format, without you writing it","Proposals start from your real scope, not a blank page","The team answers from the Brain, not from your inbox","You close the laptop and the agency keeps moving"]},
  {t:'whyme', k:"Why me", h:"I run a 140 person agency this way.", body:"I grew SJ Innovation from a two person operation into a team of 140 across five locations over 19 years, and today I run it with Claude, Codex and Lovable on exactly this system. This masterclass is the method, not the theory."},
  {t:'leave', k:"What you will leave with", h:"You build it live, in 90 minutes", list:["A working Skill for the one process you are most tired of explaining","Your Agency Brain started from your own company context","The Skills pack to take home to your team","A clear next rung on the ladder"]},
  {t:'cta', k:"Your next step", h:"Join the next live class", body:"Come with one process you are tired of explaining, and leave having turned it into a Skill your team can run without you. Free and live. Reserve your seat at managedcoder.com.", disc:"Educational session only. No income or result is guaranteed. Results vary and depend on your own work, team, and market."}
];
const deck = document.getElementById('deck');
S.forEach(function(s,i){
  const el = document.createElement('section');
  el.className = 'slide' + (s.cover ? ' cover' : '');
  let html = '';
  if(s.k) html += '<div class="kick">'+s.k+'</div>';
  if(s.big){ html += '<div class="big">'+s.h+'</div>'; }
  else if(i===0){ html += '<h1>'+s.h+'</h1>'; }
  else { html += '<h2>'+s.h+'</h2>'; }
  if(s.num) html = html.replace('<div class="kick">'+s.k+'</div>', '<div class="kick"><span class="num">'+s.num+'</span> &nbsp; '+s.k+'</div>');
  if(s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if(s.body) html += '<p>'+s.body+'</p>';
  if(s.list){ html += '<ul>'; s.list.forEach(function(x){ html += '<li>'+x+'</li>'; }); html += '</ul>'; }
  if(s.grid){ html += '<ul class="grid">'; s.grid.forEach(function(x){ html += '<li>'+x+'</li>'; }); html += '</ul>'; }
  if(s.steps){ html += '<div class="ladder">'; s.steps.forEach(function(x){ html += '<span class="step">'+x+'</span>'; }); html += '</div>'; }
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  if(s.cover) html += '<div class="foot">ManagedCoder &nbsp;&middot;&nbsp; Shahed Islam</div>';
  el.innerHTML = html;
  deck.appendChild(el);
  const pg = document.createElement('div'); pg.className='pg'; pg.textContent=(i+1)+' / '+S.length;
  deck.appendChild(pg);
});
</script>
</body>
</html>
