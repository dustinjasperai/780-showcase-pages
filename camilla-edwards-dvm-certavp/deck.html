<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan With Confidence: The SPEEDS Method for First-Opinion Vets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#efecf8;
    --panel:#fbf9ff;
    --rule:#ded9f0;
    --ink:#2f286e;
    --ink-soft:#4a4480;
    --ink-muted:#7a76a0;
    --accent:#ea5291;
  }
  html,body{height:100%;}
  body{
    font-family:'Source Sans 3',-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink-soft);
    -webkit-font-smoothing:antialiased;
  }
  #deck{height:100vh;width:100vw;position:relative;overflow:hidden;}
  .slide{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;justify-content:center;
    padding:7vh 9vw;
  }
  .slide.active{display:flex;}
  .kicker{font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;
    text-transform:uppercase;letter-spacing:.16em;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Nunito',sans-serif;font-weight:800;color:var(--ink);
    font-size:clamp(34px,5.4vw,66px);line-height:1.04;letter-spacing:-.01em;}
  h2{font-family:'Nunito',sans-serif;font-weight:800;color:var(--ink);
    font-size:clamp(28px,3.8vw,46px);line-height:1.1;margin-bottom:22px;}
  .sub{font-family:'Nunito',sans-serif;font-weight:600;color:var(--ink-soft);
    font-size:clamp(18px,2.1vw,26px);margin-top:20px;line-height:1.3;}
  .by{margin-top:36px;font-size:15px;color:var(--ink-muted);font-weight:600;letter-spacing:.02em;}
  p{font-size:clamp(17px,1.7vw,22px);line-height:1.5;max-width:30ch;color:var(--ink-soft);}
  p.wide{max-width:40ch;}
  .big{font-family:'Nunito',sans-serif;font-weight:700;color:var(--ink);
    font-size:clamp(26px,3.3vw,42px);line-height:1.18;max-width:20ch;}
  .big .hl{color:var(--accent);}
  ul{list-style:none;margin-top:10px;}
  li{position:relative;padding-left:34px;margin-bottom:18px;
    font-size:clamp(17px,1.8vw,23px);line-height:1.4;max-width:34ch;color:var(--ink-soft);}
  li::before{content:"";position:absolute;left:0;top:.62em;width:14px;height:2px;background:var(--accent);}
  .quote{font-family:'Nunito',sans-serif;font-weight:600;font-style:normal;color:var(--ink-muted);
    font-size:clamp(18px,2vw,26px);max-width:24ch;line-height:1.35;}
  .steps{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;}
  .step{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:20px 22px;min-width:150px;flex:1 1 150px;}
  .step .n{font-family:'Nunito',sans-serif;font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.1em;}
  .step .t{font-family:'Nunito',sans-serif;font-weight:700;color:var(--ink);font-size:20px;margin:6px 0 6px;}
  .step .d{font-size:15px;color:var(--ink-muted);line-height:1.35;}
  .bio{display:flex;flex-direction:column;gap:16px;max-width:38ch;}
  .bio p{max-width:38ch;}
  .cta-box{background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--accent);
    border-radius:14px;padding:30px 34px;max-width:40ch;margin-top:8px;}
  .disclaimer{margin-top:30px;font-size:13px;color:var(--ink-muted);max-width:52ch;line-height:1.5;}
  .nav{position:fixed;bottom:22px;right:28px;font-family:'Source Sans 3',sans-serif;
    font-size:13px;color:var(--ink-muted);font-weight:600;letter-spacing:.04em;}
  .nav b{color:var(--ink);}
  .hint{position:fixed;bottom:22px;left:28px;font-size:12px;color:var(--ink-muted);}
  @media (max-width:640px){ .slide{padding:8vh 8vw;} p,li{max-width:100%;} }
</style>
</head>
<body>
<div id="deck"></div>
<div class="hint">Use arrow keys or click to advance</div>
<div class="nav"><b id="cur">1</b> / <span id="tot">1</span></div>
<script>
const S = [
  {t:'title',
    kicker:'A live masterclass for first-opinion vets',
    h1:'Scan With Confidence',
    sub:'The SPEEDS Method: a repeatable system for scanning and reporting in everyday first-opinion practice.',
    by:'with Camilla Edwards DVM CertAVP, First Opinion Veterinary Ultrasound' },

  {t:'part',
    kicker:'What this hour gives you',
    h2:'By the end, one thing',
    body:'A repeatable way to pick up the probe, scan the same methodical way every time, and finish knowing you were thorough. Not more images to memorise. A system you can use on your next consult.' },

  {t:'who',
    kicker:'Who this is for',
    big:'You own the machine. You know it can give you answers. So why does picking up the probe still feel like <span class="hl">guessing?</span>' },

  {t:'trap',
    kicker:'If you have ever thought',
    h2:'Sound familiar?',
    bullets:[
      '"I am not sure I am doing it right."',
      '"There is never time to practise properly."',
      '"Did I miss something important?"',
      '"I am not confident enough to charge for scans."' ] },

  {t:'hook',
    kicker:'The real problem',
    big:'It was never your skill. It is that nobody ever gave you a <span class="hl">system.</span>' },

  {t:'part',
    kicker:'Part one',
    h2:'Talent was never the bottleneck',
    body:'The best scanners are not the ones with the steadiest hands. They are the ones following the same order every time, so their eyes know what to expect. That is learnable, and it is the whole premise of what follows.' },

  {t:'part',
    kicker:'Part one',
    h2:'Why ultrasound feels scary',
    body:'Without a structure, every scan is improvised. You sweep around, you see something, and you are left asking "is that normal?" in real time, with a client watching. Guessing is exhausting, and it is why the probe stays in the drawer.' },

  {t:'part',
    kicker:'Part one',
    h2:'Normal comes before pathology',
    body:'You cannot reliably spot the abnormal until you know the normal cold. Most vets try to learn by hunting for disease. That is backwards. Confident scanning starts with knowing exactly what healthy looks like, every single time.' },

  {t:'framework',
    kicker:'Part two: the method',
    h2:'The SPEEDS framework',
    body:'SPEEDS is a repeatable, per-organ checklist of exactly what to assess, in what order, so you scan the same methodical way every time. No improvising. Structure first, so the image finally means something.' },

  {t:'steps',
    kicker:'Part two: how it works',
    h2:'Structure, then an answer',
    steps:[
      { n:'01', t:'Set up', d:'The machine settings and probe approach for the organ in front of you.' },
      { n:'02', t:'Sweep', d:'A fixed order of views, so nothing gets rushed or skipped.' },
      { n:'03', t:'Assess', d:'The specific checklist for that organ: what normal looks like here.' },
      { n:'04', t:'Report', d:'The structured scan becomes a structured, defensible report.' } ] },

  {t:'part',
    kicker:'Part two: the method',
    h2:'One organ, one checklist',
    body:'Take the bladder. With SPEEDS you are not freestyling. You know the settings, the views, and the short list of what normal looks like here, so an abnormal finding stands out instead of hiding.' },

  {t:'trap',
    kicker:'Part two: what trips vets up',
    h2:'The three habits that keep you guessing',
    bullets:[
      'Hunting for pathology before you know normal.',
      'Changing your sweep order every scan.',
      'Practising only when a sick patient forces it.' ] },

  {t:'part',
    kicker:'Part two: the method',
    h2:'The abdominal scan, start to finish',
    body:'The scan you do most is the one you are least sure you finished. The abdominal scanning framework sets the order and completeness of a full sweep, so the three organs vets usually rush never get missed again.' },

  {t:'steps3',
    kicker:'Part two: how confidence is built',
    h2:'Structure, practise, feedback',
    steps:[
      { n:'01', t:'Structure', d:'Learn the repeatable framework first, not a gallery of images to memorise.' },
      { n:'02', t:'Practise', d:'Deliberate reps on your own machine, on real patients, every week.' },
      { n:'03', t:'Feedback', d:'Expert eyes on your own scans, so you fix the right thing fast.' } ] },

  {t:'part',
    kicker:'Part three: what changes',
    h2:'From second-guessing to scanning',
    body:'When you scan the same methodical way every time, the worry drops away. You finish the scan knowing you were thorough. You write the report knowing it holds up. The machine stops being the scary thing in the corner.' },

  {t:'part',
    kicker:'Part three: what changes',
    h2:'Keep the case, keep the revenue',
    body:'Every case you refer out because you were not sure is revenue walking out the door. A scan you perform in practice might be charged at a hundred and fifty to two hundred and fifty pounds. Referring two or three cases a month out is thousands a year your practice never sees. Confidence keeps that in-house.' },

  {t:'part',
    kicker:'Where to start',
    h2:'Start small, start this week',
    body:'You do not need a new machine or a free afternoon. You need a structure and a reason to pick up the probe on the next normal patient. That habit, repeated, is what confidence is made of.' },

  {t:'bio',
    kicker:'Why learn this from me',
    h2:'Camilla Edwards DVM CertAVP',
    bio:[
      'A practising vet and ultrasonographer in small-animal and emergency medicine since 2006.',
      'I founded First Opinion Veterinary Ultrasound in 2018 after years of being asked the same questions in practice after practice.',
      'Everything I teach, build and recommend comes from real clinical experience in the field, built for the realities of first-opinion practice, not the referral centre.' ] },

  {t:'cta',
    kicker:'Your next step',
    h2:'Learn to scan with confidence',
    ctaText:'If this is the way you want to scan, the full SPEEDS training walks you through it organ by organ, with practice and feedback built in, so it actually sticks. Come and learn it with me inside FOVU.',
    disclaimer:'This masterclass is for educational purposes only. It is general veterinary professional education and does not guarantee any clinical, business, or financial outcome. Results vary from practice to practice.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'slide' + (i===0 ? ' active' : '');
  let html = '';
  if (s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if (s.h1) html += `<h1>${s.h1}</h1>`;
  if (s.sub) html += `<div class="sub">${s.sub}</div>`;
  if (s.by) html += `<div class="by">${s.by}</div>`;
  if (s.h2) html += `<h2>${s.h2}</h2>`;
  if (s.big) html += `<div class="big">${s.big}</div>`;
  if (s.body) html += `<p class="wide">${s.body}</p>`;
  if (s.bullets) html += '<ul>' + s.bullets.map(b=>`<li>${b}</li>`).join('') + '</ul>';
  if (s.steps) html += '<div class="steps">' + s.steps.map(st=>`<div class="step"><div class="n">${st.n}</div><div class="t">${st.t}</div><div class="d">${st.d}</div></div>`).join('') + '</div>';
  if (s.bio) html += '<div class="bio">' + s.bio.map(p=>`<p>${p}</p>`).join('') + '</div>';
  if (s.ctaText) html += `<div class="cta-box"><p class="wide">${s.ctaText}</p></div>`;
  if (s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  d.innerHTML = html;
  deck.appendChild(d);
});

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
document.getElementById('tot').textContent = slides.length;
function show(n){
  cur = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,i)=>s.classList.toggle('active', i===cur));
  document.getElementById('cur').textContent = cur+1;
}
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1);
});
document.getElementById('deck').addEventListener('click', ()=>show(cur+1));
</script>
</body>
</html>
