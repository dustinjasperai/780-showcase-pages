<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Business of Getting Booked | Future Voices Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette — brand-derived from future-voices.com (see 01-deep-research.md ## Palette):
     light ground #ffffff, deep-navy ink #001044, brand crimson accent #dd183b (17 uses). */
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#ffffff;
    --panel:#f5f2ee;
    --ink:#001044;
    --ink-soft:#33405f;
    --ink-muted:#6c7691;
    --rule:#c8cdd8;
    --accent:#dd183b;
  }
  html{-webkit-font-smoothing:antialiased;}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--ink);color:var(--ink);}
  .stage{max-width:1120px;margin:0 auto;padding:28px 20px 80px;}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    aspect-ratio:16/9;margin:0 auto 26px;padding:64px 72px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);}
  .kicker{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
  .num{position:absolute;right:28px;bottom:22px;font-size:12px;letter-spacing:.1em;color:var(--ink-muted);}
  .brandmark{position:absolute;right:32px;top:28px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);}
  h1{font-family:'Crimson Text',Georgia,serif;font-size:60px;line-height:1.05;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
  h2{font-family:'Crimson Text',Georgia,serif;font-size:42px;line-height:1.1;font-weight:700;color:var(--ink);margin-bottom:18px;}
  .promise{font-size:23px;color:var(--ink-soft);margin-top:22px;max-width:40ch;line-height:1.5;}
  .lead{font-size:24px;color:var(--ink-soft);line-height:1.5;max-width:46ch;}
  .lead strong{color:var(--ink);font-weight:700;}
  .big{font-family:'Crimson Text',Georgia,serif;font-size:52px;line-height:1.12;color:var(--ink);font-weight:700;max-width:24ch;}
  .part-label{font-family:'Crimson Text',Georgia,serif;font-size:72px;font-weight:700;color:var(--ink);}
  .part-sub{font-size:22px;color:var(--ink-muted);margin-top:14px;}
  ul.points{list-style:none;margin-top:10px;}
  ul.points li{position:relative;padding-left:30px;font-size:21px;color:var(--ink-soft);margin-bottom:16px;line-height:1.45;max-width:44ch;}
  ul.points li::before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;background:var(--accent);}
  .pillar-no{font-family:'Crimson Text',serif;font-size:20px;font-weight:700;color:var(--accent);margin-bottom:6px;}
  .cta-line{font-size:24px;color:var(--ink-soft);margin-top:18px;max-width:46ch;line-height:1.5;}
  .cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-weight:700;font-size:18px;padding:16px 30px;letter-spacing:.01em;}
  .disclaimer{position:absolute;left:72px;right:72px;bottom:26px;font-size:12px;color:var(--ink-muted);line-height:1.5;font-style:italic;}
  .panel{background:var(--panel);border-left:3px solid var(--accent);padding:22px 26px;margin-top:22px;max-width:48ch;}
  .panel p{font-size:20px;color:var(--ink-soft);line-height:1.5;}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:#c8cdd8;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:.06em;}
  @media(max-width:720px){.slide{padding:34px 30px;}h1{font-size:34px;}h2{font-size:28px;}.part-label{font-size:44px;}.big{font-size:30px;}.lead,.promise{font-size:18px;}ul.points li{font-size:16px;}.disclaimer{left:30px;right:30px;}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="hint">Scroll through the slides &nbsp;·&nbsp; Future Voices masterclass</div>
<script>
const S=[
  {t:'title',kicker:'Future Voices Masterclass',h1:'The Business of Getting Booked',promise:'How speakers actually get chosen, taught from the side of the table that books.'},
  {t:'who',kicker:'Who this is for',big:'For speakers who are genuinely good on stage, and still not booked enough.',lead:'If you can hold a room but the enquiries are thin and inconsistent, the problem usually is not your talk.'},
  {t:'trap',kicker:'The old advice',lead:'You were told the same thing everyone was told: <strong>get better on stage, and the bookings will follow.</strong> So you kept polishing the talk and waiting for the phone to ring.'},
  {t:'reframe',kicker:'The hard truth',big:'Being good on stage is not the differentiator anymore.',lead:'The market is full of good speakers. Organisers are not short of talent. They are short of an easy, obvious choice.'},
  {t:'part',kicker:'Part One',label:'Why good speakers stay invisible',sub:'What happens before anyone ever hears you speak.'},
  {t:'points',kicker:'How the decision really gets made',h2:'The shortlist happens without you in the room',points:['A bureau or organiser is handed a brief and a budget, and has to name a speaker fast.','They do not audition forty talks. They reach for the names they can describe in one line.','If they cannot describe you in one line, you are a maybe. Maybes do not get booked.']},
  {t:'points',kicker:'The real gap',h2:'It is a positioning gap, not a performance gap',points:['Most speakers market the topic they love, not the outcome a client is buying.','Fees get guessed instead of set, so the good slots go to someone who looks more certain.','There is no pipeline, so every month starts back at zero.']},
  {t:'part',kicker:'Part Two',label:'The Bureau Insider method',sub:'Four pillars, taught by the people who do the booking.'},
  {t:'pillar',kicker:'Pillar one',no:'01',h2:'The industry, from the inside',lead:'What today’s organisers are actually looking for, drawn from decades inside the bureaus. You stop guessing at the market and start reading it.'},
  {t:'pillar',kicker:'Pillar two',no:'02',h2:'The bureau table',lead:'What separates the speakers who get booked from the ones who do not, straight from the agents who see thousands of them a year. This is the view no one outside the bureau gets.'},
  {t:'pillar',kicker:'Pillar three',no:'03',h2:'Positioning that wins the slot',lead:'Find and articulate one clear authority niche, so clients ask for you by name instead of comparing you to a page of others.'},
  {t:'pillar',kicker:'Pillar four',no:'04',h2:'Fees and pipeline',lead:'Set fees with the confidence of someone who knows the market, and build a steady flow of enquiries so your calendar stops swinging between feast and famine.'},
  {t:'part',kicker:'Part Three',label:'Booked, and booked again',sub:'When positioning, fees and pipeline line up.'},
  {t:'points',kicker:'The shift',h2:'From hoping to be found to being the obvious choice',points:['You are described in one clean line, and that line is the one clients are already searching for.','Bigger stages and higher fees, because you are no longer the cheap safe option.','Rebookings and referrals, because you were easy to recommend in the first place.']},
  {t:'why',kicker:'Why learn it here',h2:'Taught from the side of the table that books',lead:'Future Voices is built by people with more than eighty years of combined bureau and agency experience, running some of the largest speaker agencies in the UK and beyond. You are learning how the booking decision gets made from the people who make it.'},
  {t:'points',kicker:'Make it stick',h2:'A plan you actually act on',points:['A clear, written position you can use in every pitch and profile.','A fee and pipeline plan matched to where you are now.','A short, guided challenge afterward so the work turns into bookings, not notes.']},
  {t:'cta',kicker:'Your next step',h2:'Ready to get booked, not just be good?',line:'Take the next session of the Future Voices Fast Track Bootcamp and build your positioning, fees and pipeline with the people who book speakers for a living.',btn:'Reserve your place',disclaimer:'Educational content only. Future Voices does not guarantee any specific bookings, fees, or income. Results depend on your own effort, market, and circumstances and will vary from speaker to speaker.'}
];
const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title') inner+=`<h1>${s.h1}</h1><p class="promise">${s.promise}</p>`;
  else if(s.t==='who') inner+=`<div class="big">${s.big}</div><p class="lead" style="margin-top:20px">${s.lead}</p>`;
  else if(s.t==='trap'||s.t==='reframe'){ if(s.big) inner+=`<div class="big">${s.big}</div>`; inner+=`<p class="lead" style="margin-top:20px">${s.lead}</p>`; }
  else if(s.t==='part') inner+=`<div class="part-label">${s.label}</div><div class="part-sub">${s.sub}</div>`;
  else if(s.t==='points'){ inner+=`<h2>${s.h2}</h2><ul class="points">${s.points.map(p=>`<li>${p}</li>`).join('')}</ul>`; }
  else if(s.t==='pillar'){ inner+=`<div class="pillar-no">${s.no}</div><h2>${s.h2}</h2><p class="lead">${s.lead}</p>`; }
  else if(s.t==='why') inner+=`<h2>${s.h2}</h2><div class="panel"><p>${s.lead}</p></div>`;
  else if(s.t==='cta'){ inner+=`<h2>${s.h2}</h2><p class="cta-line">${s.line}</p><div class="cta-btn">${s.btn}</div><div class="disclaimer">${s.disclaimer}</div>`; }
  inner+=`<div class="brandmark">Future Voices</div><div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  d.innerHTML=inner;stage.appendChild(d);
});
</script>
</body>
</html>
