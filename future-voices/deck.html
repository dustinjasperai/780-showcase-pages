<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booked · Future Voices Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7;      /* warm off-white ground, from brand probe (light scheme) */
    --panel:#f1eef5;   /* pale plum panel */
    --rule:#d9d2e2;    /* muted plum rule */
    --ink:#1c1a24;     /* near-black plum ink */
    --muted:#5b5566;   /* secondary text */
    --accent:#8a1a9e;  /* deepened form of the site magenta #9b0fb4 */
    --head:'Crimson Pro',Georgia,serif;   /* echoes their Crimson Text */
    --body:'Plus Jakarta Sans',system-ui,sans-serif; /* their own body face */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--rule);font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;padding:32px 16px}
  .deck{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .slide{background:var(--bg);border-radius:18px;padding:76px 74px;min-height:560px;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.04);overflow:hidden}
  .slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-size:14px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--head);font-weight:600;font-size:64px;line-height:1.05;letter-spacing:-.01em;max-width:16ch}
  h2{font-family:var(--head);font-weight:600;font-size:44px;line-height:1.12;max-width:20ch}
  .lede{font-size:23px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:44ch}
  .promise{font-size:26px;line-height:1.45;margin-top:30px;max-width:40ch;font-weight:500}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:20px;max-width:52ch}
  li{font-size:23px;line-height:1.4;padding-left:40px;position:relative;color:#33303c}
  li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:5px;border:2.5px solid var(--accent)}
  li.on::before{background:var(--accent)}
  .num{font-family:var(--head);font-size:20px;font-weight:700;color:var(--accent);letter-spacing:.04em}
  .part-n{font-family:var(--head);font-size:120px;font-weight:700;color:var(--accent);line-height:1;opacity:.16}
  .panel{background:var(--panel);border-radius:14px;padding:34px 38px;margin-top:32px;max-width:56ch}
  .panel p{font-size:22px;line-height:1.5;color:#33303c}
  .quote{font-family:var(--head);font-style:italic;font-size:34px;line-height:1.3;max-width:24ch}
  .attn{font-size:17px;color:var(--muted);margin-top:22px;font-weight:600;letter-spacing:.02em}
  .cred{display:flex;flex-direction:column;gap:14px;margin-top:28px;max-width:56ch}
  .cred .row{font-size:20px;line-height:1.35;color:#33303c}
  .cred .row b{color:var(--ink)}
  .foot{position:absolute;right:40px;bottom:30px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#a79fb0;font-weight:600}
  .disc{font-size:14px;line-height:1.5;color:var(--muted);margin-top:30px;max-width:60ch}
  .cta-step{font-size:24px;font-weight:600;margin-top:24px;color:var(--ink)}
  .cta-step span{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A Future Voices Masterclass', h:'Booked.', promise:'What the people who hire speakers wish you knew about getting chosen.', foot:'Future Voices' },

  {t:'audience', kick:'Who this is for', h:'You can hold a room. You still can’t fill your calendar.', lede:'For experts, keynote and motivational speakers who are good on stage and quietly frustrated that the bookings don’t match the talent.', foot:'Who this is for' },

  {t:'trap', kick:'The trap', h:'You keep working on the talk.', lede:'So you polish the delivery, rebuild the slides, and rehearse the open one more time. Meanwhile the bureaus and event bookers who decide who gets hired have no idea you exist.', foot:'The trap' },

  {t:'reframe', kick:'The reframe', quote:'Getting booked is not a talent problem. It is a positioning and pipeline problem.', attn:'And those can be built on purpose.', foot:'The reframe' },

  {t:'reframe', kick:'The uncomfortable truth', h:'Talent is the price of entry, not the reason you win the slot.', lede:'Every speaker on the shortlist can deliver. The one who gets booked is the one the booker can place in a sentence.', foot:'The reframe' },

  {t:'part', n:'One', kick:'Part One', h:'The Bureau Table', lede:'How the people who actually book speakers decide who gets hired.', foot:'Part One' },

  {t:'content', kick:'Part One · The Bureau Table', h:'What happens before you ever hear about the gig', items:['A client asks a bureau for a speaker on a theme','The agent runs down a mental shortlist of people they can vouch for','Most of the room never makes that list, because the agent can’t place them','The booked speaker is the one who is easy to recommend'], on:3, foot:'The Bureau Table' },

  {t:'content', kick:'Part One · The Bureau Table', h:'The question a booker is really asking', panel:'Not “is this person good?” They assume you’re good. The question is “if I put this name in front of my client, do I look smart?” Everything that follows is about making that a yes.', foot:'The Bureau Table' },

  {t:'part', n:'Two', kick:'Part Two', h:'Positioning to Stand Out', lede:'Own one clear idea, so a bureau can place you in a sentence.', foot:'Part Two' },

  {t:'content', kick:'Part Two · Positioning', h:'The one-idea test', items:['Say what you speak on in one plain sentence','If it needs three, you are three speakers and easy to forget','Narrow beats broad: the specialist gets the call, the generalist gets a maybe','A clear idea is what an agent repeats for you when you are not in the room'], on:2, foot:'Positioning' },

  {t:'content', kick:'Part Two · Positioning', h:'From “I speak about leadership” to something a booker can sell', panel:'Leadership is a category, not a position. The move is to claim the specific angle only you can own, backed by the story only you have. That is the difference between being in the search results and being the pin they stop on.', foot:'Positioning' },

  {t:'part', n:'Three', kick:'Part Two, continued', h:'Fee & Booking Pipeline', lede:'Set a fee you can hold, and build repeatable inbound instead of chasing.', foot:'Fee & Pipeline' },

  {t:'content', kick:'Fee & Pipeline', h:'Your fee is a positioning decision', items:['A fee is a signal before it is a number','Discounting to win the first gig sets the ceiling for the next ten','Bureaus can only place you where your fee says you belong','Hold the fee and let the positioning justify it'], on:3, foot:'Fee & Pipeline' },

  {t:'content', kick:'Fee & Pipeline', h:'Build a pipeline, not a scramble', items:['One clear idea creates repeatable reasons for people to refer you','Warm relationships with agents beat cold applications every time','Every booked talk should seed the next one','Inbound compounds; chasing resets to zero each month'], on:0, foot:'Fee & Pipeline' },

  {t:'part', n:'✓', kick:'Part Three', h:'The booked version of your business', lede:'A speaker the market can find, place, and rebook.', foot:'Part Three' },

  {t:'content', kick:'Part Three · The picture', h:'Six months on', items:['Bookers can describe what you do without you in the room','Your fee holds because your position earns it','Referrals arrive before you go looking','You are choosing stages, not hoping for them'], on:2, foot:'The picture' },

  {t:'cred', kick:'Why Future Voices', h:'Taught from the other side of the table', rows:['<b>Future Voices</b> was built by people who book and represent speakers for a living, not by a single coach guessing at the market.','<b>80+ years</b> of combined bureau and agency experience across the team.','Faculty includes managing directors and chairs of leading UK speaker bureaus and agencies.','You are learning how the industry actually works, straight from the decision-makers.'], foot:'Why Future Voices' },

  {t:'cta', kick:'Your next step', h:'Come and build the booked version of your speaking business.', step:'Join the next <span>Fast Track Bootcamp</span>, or book a discovery call with the Future Voices team.', disc:'This masterclass is educational. It shares the frameworks and industry perspective Future Voices teaches; it is not a guarantee of bookings, fees, or income. Results depend on your own work, market, and circumstances.', foot:'Future Voices' }
];

const el = document.getElementById('deck');
function li(items, on){ return '<ul>'+items.map((x,i)=>`<li class="${i===on?'on':''}">${x}</li>`).join('')+'</ul>'; }
S.forEach(s=>{
  let inner='';
  const kick = s.kick?`<div class="kick">${s.kick}</div>`:'';
  const foot = s.foot?`<div class="foot">${s.foot}</div>`:'';
  if(s.t==='title'){ inner=`${kick}<h1>${s.h}</h1><div class="promise">${s.promise}</div>`; }
  else if(s.t==='part'){ inner=`<div class="part-n">${s.n}</div>${kick}<h2>${s.h}</h2><div class="lede">${s.lede}</div>`; }
  else if(s.t==='reframe'){ inner = s.quote?`${kick}<div class="quote">${s.quote}</div><div class="attn">${s.attn||''}</div>`:`${kick}<h2>${s.h}</h2><div class="lede">${s.lede}</div>`; }
  else if(s.t==='cred'){ inner=`${kick}<h2>${s.h}</h2><div class="cred">${s.rows.map(r=>`<div class="row">${r}</div>`).join('')}</div>`; }
  else if(s.t==='cta'){ inner=`${kick}<h2>${s.h}</h2><div class="cta-step">${s.step}</div><div class="disc">${s.disc}</div>`; }
  else { // audience / trap / content
    inner=`${kick}${s.h?`<h2>${s.h}</h2>`:''}${s.lede?`<div class="lede">${s.lede}</div>`:''}${s.items?li(s.items,s.on):''}${s.panel?`<div class="panel"><p>${s.panel}</p></div>`:''}`;
  }
  const d=document.createElement('div'); d.className='slide'; d.innerHTML=inner+foot; el.appendChild(d);
});
</script>
</body>
</html>
