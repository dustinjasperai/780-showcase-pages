<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Success Plan — A Masterclass for Loan Officers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1d24;      /* their dark scheme (#1a1a1a) shifted toward their measured teal accent */
    --panel:#16303a;   /* tint of the teal ground */
    --rule:#24525f;    /* teal rule */
    --accent:#2f9fcf;  /* their measured link teal #21759b, brightened one step */
    --ink:#eaf2f5;
    --muted:#9fb8c0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;line-height:1.5}
  #stage{max-width:960px;margin:0 auto;padding:48px 28px 96px}
  .slide{min-height:70vh;display:flex;flex-direction:column;justify-content:center;
    border-bottom:1px solid var(--rule);padding:56px 0}
  .kicker{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);font-size:13px;margin-bottom:18px}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:46px;line-height:1.08;margin-bottom:18px}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:32px;line-height:1.12;margin-bottom:16px}
  p{font-size:19px;color:var(--ink);margin-bottom:14px;max-width:48ch}
  p.sub{color:var(--muted);font-size:21px;max-width:52ch}
  ul{list-style:none;margin:10px 0 0;max-width:52ch}
  li{position:relative;padding-left:26px;margin-bottom:12px;font-size:18px}
  li::before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;
    background:var(--accent);border-radius:2px}
  .num{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--accent);
    font-size:15px;letter-spacing:.1em;margin-bottom:10px}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
    padding:26px 28px;margin-top:8px;max-width:54ch}
  .pillar{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;max-width:56ch}
  .pillar .dot{flex:0 0 auto;width:38px;height:38px;border-radius:9px;background:var(--panel);
    border:1px solid var(--accent);color:var(--accent);font-family:'Montserrat';font-weight:800;
    display:flex;align-items:center;justify-content:center}
  .pillar h3{font-family:'Montserrat';font-weight:700;font-size:20px;margin-bottom:4px}
  .pillar p{font-size:17px;color:var(--muted);margin:0}
  .foot{color:var(--muted);font-size:14px;margin-top:22px;max-width:56ch}
  .brand{font-family:'Montserrat';font-weight:700;color:var(--muted);font-size:15px;
    letter-spacing:.04em;margin-top:28px}
  .cta{display:inline-block;margin-top:20px;background:var(--accent);color:#06161c;
    font-family:'Montserrat';font-weight:800;padding:14px 26px;border-radius:10px;
    text-decoration:none;font-size:17px}
  .disc{color:var(--muted);font-size:13px;margin-top:26px;max-width:58ch}
  .daybar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;max-width:56ch}
  .daybar span{background:var(--panel);border:1px solid var(--rule);border-radius:7px;
    padding:8px 12px;font-size:14px;color:var(--ink)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title',
    k:'A live masterclass for loan officers',
    h:'The Daily Success Plan',
    sub:'How top producers add closings every month on referrals alone, working about 32 hours a week.',
    brand:'Carl White · Loan Officer Freedom'},

  {t:'for',
    k:'Who this is for',
    h:'Built for loan officers who are done riding the market',
    list:['Loan officers who want production that does not swing with rates',
          'Team leaders and branch managers building a predictable pipeline',
          'Anyone tired of buying leads and living at their desk to hit a number']},

  {t:'trap',
    k:'The trap',
    h:'You were told the answer was more leads',
    p:'So you bought leads. You chased rates. You answered emails at 9pm and worked weekends when the market was good, then watched it all dry up when rates moved.',
    sub:'The volume went up and down with things you do not control. That is not a business. That is a ride.'},

  {t:'reframe',
    k:'The real problem',
    h:'More leads was never the problem',
    p:'The problem is that your production is random because your activity is random. Good months and bad months come from the same place: whether the right conversations happened that day.',
    panel:'Predictable production does not come from a better lead source. It comes from doing a small number of the right things, every day, on purpose.'},

  {t:'part',
    num:'Part one',
    h:'Why most loan officers stay stuck',
    list:['They wait for leads to show up instead of creating them',
          'They treat agents like a one-time ask instead of a relationship',
          'They are busy all day but cannot tell you what actually moved a loan forward']},

  {t:'reframe',
    k:'The real cost',
    h:'Busy is not the same as productive',
    p:'Most loan officers are not lazy. They are buried. The day fills with rate locks, status calls, and putting out fires, and the one thing that actually creates future loans never gets done.',
    panel:'If the growth activity is the first thing to get bumped when the day gets busy, it will never happen. The plan protects it first, not last.'},

  {t:'part',
    num:'Part two',
    h:'The Daily Success Plan',
    p:'A simple, repeatable roadmap: the right daily activities, the right conversations, and the right follow-up, so referrals flow and loans close without burning out. Three pillars.'},

  {t:'pillars',
    k:'The three pillars',
    h:'Who to call, what to say, how to follow up',
    pillars:[
      {n:'1',title:'The right daily activities',body:'A short, named list of the people worth your time today, so you never open the day wondering who to call.'},
      {n:'2',title:'The right conversations',body:'Proven scripts for referral partners and past clients, so the call is easy to start and easy to repeat.'},
      {n:'3',title:'The right follow-up',body:'A follow-up rhythm that keeps you top of mind with agents long before they have a buyer to send.'}]},

  {t:'framework',
    k:'The follow-up engine',
    h:'The Audition',
    p:'You do not win an agent by asking for referrals. You win them by showing up, consistently and usefully, until sending you business is the obvious choice.',
    panel:'Treat every agent relationship as an audition you keep showing up for. White-glove service and steady contact are the audition. The referrals are the callback.'},

  {t:'framework',
    k:'What to actually say',
    h:'Scripts take the guesswork out',
    p:'You do not have to be clever or pushy. The plan hands you the words for the agent call, the past-client call, and the follow-up, so starting the conversation is never the thing that stops you.',
    sub:'A script you can repeat beats a brilliant line you only use once.'},

  {t:'framework',
    k:'Nobody dials alone',
    h:'Call Stars',
    p:'The hardest part of any plan is making the calls. Call Stars turns the lonely part of the job into a group habit: loan officers get on together and make their follow-up and referral-partner calls side by side.',
    sub:'When the calls stop being optional and lonely, the pipeline stops being a mystery.'},

  {t:'reframe',
    k:'Your warmest market',
    h:'The loans already in your database',
    p:'Every past client is a referral source and a future loan you already earned once. Most loan officers never call them. A steady reconnect rhythm turns your database into repeat and referral business.',
    panel:'You do not need strangers first. You need a reason to call the people who already trust you, on a schedule you keep.'},

  {t:'rhythm',
    k:'A day on the plan',
    h:'The 5-5-5 rhythm',
    p:'The plan is not more hours. It is a handful of deliberate touches, in the same window, every working day.',
    days:['Reach out to new agents','Nurture current partners','Reconnect with past clients','Log what moved forward','Protect the rest of your day']},

  {t:'part',
    num:'Part three',
    h:'The plan, run by a team',
    p:'The same daily rhythm scales to a branch. When a team runs the plan together, production stops depending on one person having a good month.',
    list:['A shared daily activity standard the whole team runs',
          'The Turnaround Committee: a daily huddle that turns denials into approvals',
          'A pipeline you can see, coach, and forecast']},

  {t:'reframe',
    k:'The real promise',
    h:'More production, in about 32 hours',
    p:'The goal was never to grind more. When the right activities are the ones you protect, you can produce more and still get your nights and weekends back.',
    panel:'Working less is not the reward for hitting the number. It is a sign the system, not your hours, is doing the work.'},

  {t:'reframe',
    k:'The honest math',
    h:'Consistency compounds',
    p:'One more solid agent relationship is a handful of extra closings a year. A few of those, built on a daily rhythm you actually keep, is a different business by this time next year.',
    panel:'You do not need a hundred new leads. You need the right small actions, done every day, long enough to compound.'},

  {t:'reframe',
    k:'The honest objection',
    h:'"I do not have time for this"',
    p:'That is exactly why it works. The plan is not another project on top of your day. It is a short, protected block that replaces the busywork that was never going to create a loan anyway.',
    sub:'You already have the time. Right now it is going to the wrong things.'},

  {t:'credibility',
    k:'Why listen to me',
    h:'Carl White',
    list:['Host of Loan Officer Freedom, the number one podcast for loan officers in America',
          'Founder of Mortgage Marketing Animals and The Freedom Club',
          'Nearly two decades helping loan officers produce more while working fewer hours'],
    foot:'This masterclass is the same Daily Success Plan thinking our members run every day.'},

  {t:'cta',
    k:'Your next step',
    h:'Want help building your Daily Success Plan?',
    p:'If you want a plan mapped to your market and your week, let us walk through it together on a free call. No pressure, just a look at what your next 90 days could be.',
    cta:'Book your free Loan Officer Strategy Call',
    brand:'Carl White · Loan Officer Freedom',
    disc:'Educational content only. Examples describe general experience and are not a promise of results. Loan production depends on your market, effort, and conditions. No income or production guarantee is made.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const stage=document.getElementById('stage');
S.forEach(s=>{
  const d=el('section','slide');
  if(s.k)d.appendChild(el('div','kicker',s.k));
  if(s.num)d.appendChild(el('div','num',s.num));
  if(s.h)d.appendChild(el('h1',null,s.h));
  if(s.sub)d.appendChild(el('p','sub',s.sub));
  if(s.p)d.appendChild(el('p',null,s.p));
  if(s.panel)d.appendChild(el('div','panel',s.panel));
  if(s.pillars){s.pillars.forEach(p=>{
    const row=el('div','pillar');
    row.appendChild(el('div','dot',p.n));
    const col=el('div');col.appendChild(el('h3',null,p.title));col.appendChild(el('p',null,p.body));
    row.appendChild(col);d.appendChild(row);});}
  if(s.list){const ul=el('ul');s.list.forEach(i=>ul.appendChild(el('li',null,i)));d.appendChild(ul);}
  if(s.days){const bar=el('div','daybar');s.days.forEach(x=>bar.appendChild(el('span',null,x)));d.appendChild(bar);}
  if(s.foot)d.appendChild(el('div','foot',s.foot));
  if(s.cta)d.appendChild(el('a','cta',s.cta));
  if(s.brand)d.appendChild(el('div','brand',s.brand));
  if(s.disc)d.appendChild(el('div','disc',s.disc));
  stage.appendChild(d);
});
</script>
</body>
</html>
