<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Solo Lawyer's AI Edge · Ernie Svenson · Law Firm Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f9fa; --panel:#eaeef3; --rule:#d3d9e0;
    --acc:#31249f; --chalk:#22242a; --grey:#5a616e; --dim:#9aa0ab;
  }
  html,body{height:100%}
  body{background:#0c0d10;font-family:'Inter',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0c0d10}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;color:var(--chalk);line-height:1.13;letter-spacing:-.006em}
  .t-title h1{font-size:5.0vw;max-width:92%;font-weight:700}
  .t-normal h1{font-size:3.15vw;max-width:85%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.58;font-weight:400}
  .sub{font-family:'Inter',sans-serif;font-size:1.72vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.5;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.28vw;font-weight:600;color:var(--acc);margin-bottom:2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:90%}
  .t-section .rule{width:15vw;height:2px;background:var(--acc);opacity:.85;margin-top:3.4vh}
  .t-dark{background:#1b1547;align-items:center;text-align:center}
  .t-dark h1{font-size:3.55vw;max-width:86%;font-weight:400;color:#f4f3fb;letter-spacing:-.004em}
  .t-cta{background:#1b1547;align-items:center;text-align:center}
  .t-cta .kicker{color:#a99ff0}
  .t-cta h1{font-size:3.7vw;max-width:84%;color:#f4f3fb}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #6b5fd0;color:#f4f3fb;border-radius:100px;padding:1.3vh 1.8vw;font-size:1.2vw;font-weight:500;letter-spacing:.01em}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Inter',sans-serif;font-size:.9vw;color:#8f88b8;font-style:normal;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .corner-motif{position:absolute;pointer-events:none}
  .title-corner{right:7%;bottom:8%;width:16vw;opacity:.9}
  .section-corner{right:6.5%;bottom:8%;width:8vw;opacity:.55}
  .brandline{font-family:'Inter',sans-serif;font-size:1.24vw;color:var(--grey);margin-top:3.6vh;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}.brandline{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Law Firm Autopilot</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- document-corner motif: a clean bracket = the systemized, paperless file -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="corner" viewBox="0 0 200 140">
  <g fill="none" stroke="#31249f" stroke-width="2.4" stroke-linecap="round">
    <path d="M14 44 V14 H44"/>
    <path d="M156 14 H186 V44"/>
    <path d="M186 96 V126 H156"/>
    <path d="M44 126 H14 V96"/>
    <path d="M52 62 H148 M52 82 H120" stroke-width="2" opacity=".7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Solo Lawyer’s AI Edge',sub:'How a one-person firm can out-think, out-run, and out-earn firms ten times its size.',brand:true,corner:'title'},
 {t:'normal',k:'Who this is for',title:'You are the whole firm. That is the problem, and the opportunity.',body:'You do the legal work, the intake, the admin, the billing and the marketing. Every hour you spend on the machinery of the firm is an hour you are not practicing law, or living your life.'},
 {t:'dark',title:'Most solo lawyers are not short on talent. They are short on leverage.'},

 {t:'section',idx:'Part One',title:'Why Big Firms Fumble The Thing You Can Master',corner:'section'},
 {t:'normal',k:'The fear',title:'You keep hearing that AI is coming for lawyers.',body:'The story goes that the big firms with the big budgets will automate everything and leave the solo behind. It is a tidy story. It is also backwards.'},
 {t:'normal',k:'Diffused cluelessness',title:'A big firm buys AI by committee. You can use it by Tuesday.',body:'Large firms roll out expensive tools through committees and vendors, and the knowledge rarely reaches the individual lawyer. A solo tries something on a real matter, sees what works, and keeps it. That speed is an advantage a bigger budget cannot buy.'},
 {t:'normal',k:'The real risk',title:'The threat was never the machine. It was standing still.',body:'The lawyers who fall behind are not the ones who used AI clumsily at first. They are the ones who never started, and kept doing by hand what a good tool could do in seconds.'},
 {t:'dark',title:'AI does not replace a great lawyer. It multiplies one.'},

 {t:'section',idx:'Part Two',title:'AI As Your Force Multiplier',corner:'section'},
 {t:'normal',k:'Start where it is safe',title:'Begin with low stakes. Build reps. Then move up.',body:'You do not hand AI your highest-stakes brief on day one. You start with the small, low-risk work, learn what it does well and where it fails, and earn your way up to the harder tasks. Hands-on beats theory every time.'},
 {t:'normal',k:'Three places it earns its keep',title:'Drafting, summarizing, and preparing.',body:'A fast first draft you sharpen instead of a blank page. Clean summaries of long documents and calls. A sparring partner for preparation, from anticipating the other side to pressure-testing your position before you walk in.'},
 {t:'normal',k:'Hallucination, honestly',title:'AI does not excuse you from checking your work. It never did.',body:'A bad citation is an old problem with a new face, and the fix has not changed: verify the source. Point the tool at your own documents and authorities so the answers are grounded in your matter, not the open internet.'},
 {t:'normal',k:'Keep a hand on the wheel',title:'Automate carefully. Supervise always.',body:'Let AI draft into a folder you review, not straight out the door, and widen what you trust it with only as it earns that trust. The goal is leverage you control, never a black box running your practice.'},
 {t:'dark',title:'The question is not whether AI is good enough. It is whether you are willing to learn it.'},

 {t:'section',idx:'Part Three',title:'The Practice This Builds',corner:'section'},
 {t:'normal',k:'Law Firm Autopilot',title:'A firm that runs on systems, not on your memory.',body:'When the way you work lives in documented steps and checklists instead of your head, the work becomes repeatable, teachable, and finally delegable. AI is the fastest way yet to capture that process knowledge and put it to use.'},
 {t:'normal',k:'What actually changes',title:'Less time on the machinery. More on the law, and your life.',body:'The paperwork moves faster, the routine drafting stops eating your evenings, and the practice stops depending on you being at your desk for it to function. That is the whole point of putting a firm on autopilot.'},
 {t:'dark',title:'The paperless, systems-first, AI-assisted solo is not the underdog anymore. That lawyer is the model.'},
 {t:'normal',k:'Why Ernie',title:'Taught by a lawyer who rebuilt his own practice this way.',body:'Ernie Svenson spent eighteen years as a big-firm litigator, then went solo and paperless and rebuilt his practice to be lean and low-overhead. He now helps solo and small-firm lawyers do the same through the 80/20 Podcast, the 80/20 newsletter, and the Inner Circle.'},

 {t:'cta',k:'Your next step',title:'Ready to put your practice on autopilot?',chips:['Join the Inner Circle','Start with the free AI for Lawyers course'],disc:'Educational content for solo and small-firm lawyers. No specific income, caseload, or business result is guaranteed. Results vary by lawyer, practice area, and effort.'},
];

const deck=document.getElementById('deck');
function corner(kind){return `<svg class="corner-motif ${kind==='title'?'title-corner':'section-corner'}" viewBox="0 0 200 140"><use href="#corner"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Ernie Svenson &middot; <b>Law Firm Autopilot</b></div>`;
    if(s.chips){ h+='<div class="chips">'+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+'</div>'; }
    if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  }
  if(s.corner) h+=corner(s.corner);
  d.innerHTML=h;
  deck.appendChild(d);
});

let cur=0;
const slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('bar');
const count=document.getElementById('count');
const hint=document.getElementById('hint');
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  if(cur>0&&hint) hint.style.opacity='0';
}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1);
});
show(0);
</script>
</body>
</html>
