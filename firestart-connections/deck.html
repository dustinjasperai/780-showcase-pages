<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The First Five Minutes | A Firestart Connections Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#FBF8F4;
    --panel:#F2EBE2;
    --rule:#D9CFC2;
    --ink:#2A2320;
    --dim:#8C857D;
    --accent:#A03B00;
  }
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;}
  .slide{display:none;width:100%;max-width:960px;}
  .slide.on{display:block;animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kicker{font-family:'Inter';font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  .label{font-family:'Inter';font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:14px;}
  h1{font-family:'Spectral';font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.01em;color:var(--ink);margin-bottom:22px;}
  h2{font-family:'Spectral';font-weight:600;font-size:40px;line-height:1.12;letter-spacing:-.01em;color:var(--ink);margin-bottom:18px;}
  h3{font-family:'Spectral';font-weight:600;font-size:30px;line-height:1.15;color:var(--ink);margin-bottom:16px;}
  .sub{font-family:'Spectral';font-size:24px;font-weight:400;line-height:1.4;color:var(--ink);max-width:40ch;}
  p{font-size:20px;line-height:1.6;color:var(--ink);max-width:52ch;margin-bottom:16px;}
  p.dim{color:var(--dim);}
  .big{font-family:'Spectral';font-size:30px;line-height:1.3;color:var(--ink);max-width:36ch;}
  ul{list-style:none;margin-top:10px;}
  li{font-size:20px;line-height:1.5;color:var(--ink);padding-left:26px;position:relative;margin-bottom:14px;max-width:48ch;}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:50%;}
  .pillarno{font-family:'Spectral';font-size:20px;font-weight:600;color:var(--accent);margin-bottom:10px;letter-spacing:.04em;}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:30px 34px;max-width:60ch;}
  .ember{display:inline-block;width:40px;height:4px;background:var(--accent);border-radius:2px;margin-bottom:26px;}
  .arc{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .arc div{font-size:19px;color:var(--ink);padding:12px 18px;background:var(--panel);border-left:3px solid var(--accent);}
  .arc span{color:var(--dim);font-size:15px;}
  .creds li{font-size:18px;}
  .disc{font-family:'Inter';font-size:13px;color:var(--dim);margin-top:26px;max-width:58ch;line-height:1.5;}
  .nav{position:fixed;bottom:22px;right:28px;font-family:'Inter';font-size:13px;color:var(--dim);display:flex;align-items:center;gap:14px;}
  .nav button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:6px 12px;cursor:pointer;}
  .nav button:hover{border-color:var(--accent);color:var(--accent);}
  .count{min-width:52px;text-align:right;}
  .brandfoot{position:fixed;bottom:24px;left:28px;font-family:'Inter';font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  @media(max-width:640px){h1{font-size:38px;}h2{font-size:30px;}h3{font-size:24px;}.sub,.big{font-size:20px;}p,li{font-size:17px;}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandfoot">Firestart Connections</div>
<div class="nav">
  <button id="prev">Prev</button>
  <span class="count" id="count"></span>
  <button id="next">Next</button>
</div>
<script>
const S = [
  {t:'title', kicker:'A Firestart Connections Masterclass', h:'The First Five Minutes', sub:'How to turn any introduction into a real connection, before the small talk even starts.'},

  {t:'promise', label:'The promise', h:'In the next hour', body:'You will learn a repeatable way to create a genuine, memorable connection with almost anyone inside the first five minutes of meeting them. Not a personality trick. A skill you can practice.'},

  {t:'audience', label:'Who this is for', h:'If this sounds like you', bullets:['You are an emerging leader, founder, or professional whose work runs on relationships.','You can carry a meeting, but networking rooms and new people still drain you.','You leave events with a stack of contacts and almost no real connections.']},

  {t:'reframe', label:'The reframe', big:'Small talk is not harmless. It is where most connection quietly goes to die.', body:'Every "how are you, how was your weekend" exchange that stays on the surface is a connection you had the chance to make, and did not. The cost is invisible, which is exactly why it keeps happening.'},

  {t:'part', label:'Part One', h:'Why small talk fails you'},

  {t:'point', h:'The surface-level loop', body:'We ask the same four questions, get one-word answers, feel the dead air, and decide we are just "not good at this." So we prepare lines, perform, and leave more guarded than we arrived. The loop protects us and starves us at the same time.'},

  {t:'point', h:'Connection is a skill, not a trait', body:'The people who connect fast are not born more charming. They are running a method, usually without naming it. That is the good news: anything someone is doing on purpose, you can learn to do on purpose too.'},

  {t:'part', label:'Part Two', h:'The Connection Accelerator Method'},

  {t:'pillar', no:'Pillar 1', h:'Better questions', body:'Trade the autopilot questions for ones that invite a real answer. A single well-aimed question moves a conversation from information to meaning, and tells the other person you are actually interested.'},

  {t:'pillar', no:'Pillar 2', h:'Better listening', body:'Most people listen for their turn to talk. You will practice listening that makes someone feel seen and heard, so they open up faster and trust you sooner.'},

  {t:'pillar', no:'Pillar 3', h:'Storytelling', body:'A short, honest piece of your own story creates emotional connection in seconds. You will build a personal narrative you can share on purpose, instead of hiding behind facts and titles.'},

  {t:'pillar', no:'Pillar 4', h:'Positive energy', body:'The energy you bring into a conversation is contagious. Small, deliberate choices in how you show up change how the whole exchange feels, and how people remember it.'},

  {t:'pillar', no:'Pillar 5', h:'Vulnerability, on purpose', body:'Going deeper does not mean oversharing. You will learn to gauge the right level of disclosure for the moment, so you can be real without being reckless.'},

  {t:'pillar', no:'Pillar 6', h:'Connecting through play', body:'Play lowers the guard faster than almost anything. A little lightness invites the kind of conversation people actually remember and want more of.'},

  {t:'pillar', no:'Pillar 7', h:'Supporting others', body:'The fastest way to be unforgettable is to genuinely champion the person in front of you. You will practice spotting what someone cares about and offering real support for it.'},

  {t:'part', label:'Part Three', h:'What the first five minutes looks like'},

  {t:'walkthrough', label:'The arc', h:'Five minutes, on purpose', arc:[['0 to 1 min','A warm open and one real question, not the weather.'],['1 to 3 min','You listen, reflect back, and share one honest line of your own.'],['3 to 4 min','You go one level deeper, matched to the moment.'],['4 to 5 min','You find what they care about and offer something real.']]},

  {t:'whyme', label:'Why learn this from me', h:'A method, built over decades', creds:['Certified Facilitator of the Xchange Approach to guiding masterful conversations.','20+ years designing connected experiences and coaching teams.','Guided more than 1,000 people around the world to spark real conversations.']},

  {t:'recap', label:'What you are walking away with', h:'The skill, not the script', bullets:['A repeatable way to open, deepen, and land a first conversation.','Seven pillars you can practice one at a time.','The confidence to walk into any room and connect on purpose.']},

  {t:'cta', label:'Where to take this next', h:'Go deeper in The Connection Accelerator', body:'If you want to build this into a skill you own, the next step is a short discovery call to see if The Connection Accelerator is the right fit for you.', cta:'Book a discovery call with Lisa at Firestart Connections.', disc:'This masterclass is educational. No specific result or outcome is guaranteed. Results vary based on your own effort, practice, and circumstances.'}
];

const stage = document.getElementById('stage');
const countEl = document.getElementById('count');
let i = 0;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(s){
  if(s.t==='title') return `<div class="kicker">${esc(s.kicker)}</div><div class="ember"></div><h1>${esc(s.h)}</h1><p class="sub">${esc(s.sub)}</p>`;
  if(s.t==='part') return `<div class="label">${esc(s.label)}</div><div class="ember"></div><h1>${esc(s.h)}</h1>`;
  if(s.t==='promise'||s.t==='point') return `<div class="label">${esc(s.label||'')}</div><h2>${esc(s.h)}</h2><p>${esc(s.body)}</p>`;
  if(s.t==='reframe') return `<div class="label">${esc(s.label)}</div><p class="big">${esc(s.big)}</p><p class="dim" style="margin-top:20px">${esc(s.body)}</p>`;
  if(s.t==='audience'||s.t==='recap'){
    const li = s.bullets.map(b=>`<li>${esc(b)}</li>`).join('');
    return `<div class="label">${esc(s.label)}</div><h2>${esc(s.h)}</h2><ul>${li}</ul>`;
  }
  if(s.t==='pillar') return `<div class="card"><div class="pillarno">${esc(s.no)}</div><h3>${esc(s.h)}</h3><p style="margin-bottom:0">${esc(s.body)}</p></div>`;
  if(s.t==='walkthrough'){
    const rows = s.arc.map(a=>`<div><strong>${esc(a[0])}.</strong> ${esc(a[1])}</div>`).join('');
    return `<div class="label">${esc(s.label)}</div><h2>${esc(s.h)}</h2><div class="arc">${rows}</div>`;
  }
  if(s.t==='whyme'){
    const li = s.creds.map(b=>`<li>${esc(b)}</li>`).join('');
    return `<div class="label">${esc(s.label)}</div><h2>${esc(s.h)}</h2><ul class="creds">${li}</ul>`;
  }
  if(s.t==='cta') return `<div class="label">${esc(s.label)}</div><div class="ember"></div><h2>${esc(s.h)}</h2><p>${esc(s.body)}</p><p class="big" style="color:var(--accent)">${esc(s.cta)}</p><p class="disc">${esc(s.disc)}</p>`;
  return '';
}

function show(n){
  i = Math.max(0, Math.min(S.length-1, n));
  stage.innerHTML = `<div class="slide on">${render(S[i])}</div>`;
  countEl.textContent = (i+1)+' / '+S.length;
}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(i+1);
  if(e.key==='ArrowLeft')show(i-1);
});
show(0);
</script>
</body>
</html>
