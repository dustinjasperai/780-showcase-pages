<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Three-Brain Coach — Abundance Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Chivo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb;        /* light periwinkle wash, from brand body bg #c4cada */
    --panel:#e4e8f2;     /* periwinkle tint */
    --rule:#cfd6e6;      /* periwinkle rule */
    --ink:#1f2430;       /* near-black body */
    --muted:#55607a;     /* muted slate */
    --accent:#0c6ebf;    /* brand blue (dominant) */
    --plum:#53405f;      /* brand plum, framework labels only */
    --head:#0c6ebf;
    --heart:#53405f;
    --gut:#2a7d6f;       /* a calm third tone for the gut mark */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Chivo',system-ui,sans-serif;font-weight:300}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:#fff;border:1px solid var(--rule);border-radius:16px;
    padding:64px 64px;margin:0 0 26px;min-height:560px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(31,36,48,.03)}
  .slide.cover{background:linear-gradient(160deg,#ffffff 0%,var(--panel) 100%)}
  .eyebrow{font-family:'Cabin',sans-serif;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Cabin',sans-serif;font-weight:700;font-size:54px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:'Cabin',sans-serif;font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-.01em}
  .sub{font-size:22px;color:var(--muted);margin-top:22px;font-weight:300;max-width:40ch}
  p{font-size:20px;line-height:1.55;color:var(--ink);margin-top:16px;max-width:60ch}
  .lead{font-size:26px;line-height:1.4}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:20px;line-height:1.5;padding-left:28px;position:relative;margin-bottom:14px;max-width:58ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .brains{display:flex;gap:20px;margin-top:30px;flex-wrap:wrap}
  .brain{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:26px}
  .brain .tag{font-family:'Cabin',sans-serif;font-weight:700;font-size:22px;margin-bottom:8px}
  .brain .tag.h{color:var(--head)} .brain .tag.r{color:var(--heart)} .brain .tag.g{color:var(--gut)}
  .brain .d{color:var(--muted);font-size:17px;line-height:1.45}
  .marks{display:flex;gap:16px;margin-top:28px}
  .dot{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Cabin',sans-serif;font-weight:700;color:#fff;font-size:18px}
  .d-h{background:var(--head)} .d-r{background:var(--heart)} .d-g{background:var(--gut)}
  .kicker{font-family:'Cabin',sans-serif;font-weight:600;color:var(--plum);font-size:17px;letter-spacing:.04em;margin-bottom:10px}
  .part{font-family:'Cabin',sans-serif;font-weight:700;color:var(--accent);font-size:16px;letter-spacing:.14em;text-transform:uppercase}
  .who{font-family:'Cabin',sans-serif;font-weight:700;font-size:28px;line-height:1.25;margin-top:6px}
  .foot{margin-top:40px;color:var(--muted);font-size:16px;font-family:'Cabin',sans-serif;font-weight:500}
  .cta h2{font-size:44px}
  .disc{margin-top:36px;color:var(--muted);font-size:15px;line-height:1.5;max-width:64ch;border-top:1px solid var(--rule);padding-top:18px}
  .num{position:absolute;top:22px;right:28px;color:var(--rule);font-family:'Cabin',sans-serif;font-weight:700;font-size:15px}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'cover',eyebrow:'Abundance Enterprise · A live masterclass for coaches',
  h1:'The Three-Brain Coach',
  sub:'Why your clients know exactly what to do, and still don’t do it, and how to get them unstuck.',
  foot:'With Laura Masters and Amy Mercer · Certified mBIT Master Coaches and Trainers'},

 {t:'promise',part:'What you’ll leave with',
  h2:'By the end of this hour',
  bullets:['Name which of a client’s three brains is actually stuck, live, in the room',
    'Understand why strategy and willpower keep failing the clients who need them most',
    'Have the first move to bring a client’s head, heart and gut back into alignment']},

 {t:'who',part:'Who this is for',
  h2:'This is for coaches whose clients',
  who:'“I know what I should do. I just can’t make myself do it.”',
  p:'Life, executive, and health coaches who give sound guidance to smart, capable people, and then watch nothing change. If that gap is the most frustrating part of your work, you’re in the right room.'},

 {t:'trap',part:'The trap',
  h2:'You’ve done your job perfectly',
  p:'You listened. You asked the right questions. You built a clear plan together and your client left nodding, genuinely committed. A week later they’re back, no further along, a little more ashamed. You add more accountability. It helps for a week. Then the same stall.'},

 {t:'hook',part:'The reframe',
  h2:'It was never a willpower problem.',
  lead:'It was a three-brain problem. Your client agreed with their head. Their gut never said yes, and the gut is where action lives.'},

 {t:'part',part:'Part one',h2:'We coach one brain. Decisions are made by three.'},

 {t:'body',kicker:'The core problem',
  h2:'Single-brain coaching',
  p:'Most coaching speaks to the head: reframe the thought, make a better plan, understand the pattern. But neuroscience now recognises functional neural networks in the heart and the gut as well. When the head commits to something the heart doesn’t value or the gut doesn’t feel safe acting on, the body quietly vetoes it. That veto looks like procrastination, self-sabotage, or “lack of discipline.” It’s none of those.'},

 {t:'part',part:'Part two',h2:'The method: multiple Brain Integration Techniques'},

 {t:'brains',kicker:'The framework',
  h2:'Three brains, three jobs',
  brains:[
   {c:'h',tag:'Head',d:'Cognitive perception. Thinking, analysing, making meaning.'},
   {c:'r',tag:'Heart',d:'Emoting. Relational affect, values, what matters.'},
   {c:'g',tag:'Gut',d:'Mobilisation. Self-preservation, core identity, courage to act.'}]},

 {t:'body',kicker:'Why clients stall',
  h2:'Head says yes. Gut says no.',
  p:'When the three brains disagree, the loudest one wins in the session and the quietest one wins in real life. A client can build a brilliant plan with their head and still not move, because their gut hasn’t been asked, let alone answered. Name the brain that’s actually holding the line and the stall stops being a mystery.'},

 {t:'body',kicker:'The first move',
  h2:'Coherence before strategy',
  p:'Before a client can make an aligned decision, the three brains have to be in coherence: the nervous system settled, each brain able to communicate rather than compete. Regulate first, decide second. This is the step single-brain coaching skips, and it’s why the plan made in a calm room collapses in a stressed week.'},

 {t:'body',kicker:'How you work it',
  h2:'Speak to each brain in its own language',
  bullets:['Head: give it meaning and a frame it can respect',
   'Heart: surface the value underneath, and the one it’s in conflict with',
   'Gut: ask what it needs to feel safe enough to move, then honour the answer']},

 {t:'brains',kicker:'The highest expressions',
  h2:'What each brain gives when it’s aligned',
  marks:true,
  brains:[
   {c:'h',tag:'Creativity',d:'The head’s highest expression: new options, not just analysis.'},
   {c:'r',tag:'Compassion',d:'The heart’s highest expression: for the client and themselves.'},
   {c:'g',tag:'Courage',d:'The gut’s highest expression: the willingness to actually act.'}]},

 {t:'body',kicker:'The outcome',
  h2:'One aligned decision',
  p:'When creativity, compassion and courage line up, the client doesn’t leave with a plan they’ll abandon. They leave with a decision all three brains have signed off on, which is the only kind that survives contact with a hard week. That is what multi-brain aligned decision-making produces, and it’s coachable, step by step.'},

 {t:'part',part:'Part three',h2:'The three-brain method, inside your sessions'},

 {t:'body',kicker:'In the room',
  h2:'The same client, coached three-brain',
  p:'The client who “can’t make themselves do it” is no longer a discipline case. You locate the stuck brain, settle the system into coherence, and walk all three brains to a decision together. The work gets faster and deeper at the same time, because you’re coaching where the decision actually gets made instead of arguing with the head that already agreed.'},

 {t:'why',kicker:'Why learn this from us',
  h2:'Laura Masters and Amy Mercer',
  p:'We’re certified mBIT Master Coaches and Trainers. We spent years in professional learning and educational remediation before building Abundance Enterprise around this method, and we now train and certify coaches to use it. Our certification is recognised by the International Coaching Federation and carries 30 ICF Continuing Education Units.'},

 {t:'path',kicker:'Where this goes next',
  h2:'The mBIT Coach Certification',
  p:'If you want the full method, not just the first move, it’s taught in our ICF accredited mBIT Coach Certification: the complete three-brain process, the coherence work, and the certification exercise where you coach it end to end. You add a neuroscience credential to the practice you already have.'},

 {t:'cta',eyebrow:'Your next step',
  h2:'Bring the three-brain method into your coaching',
  p:'Explore the mBIT Coach Certification and the ICF Level 1 accreditation path at abundanceenterprise.com, or reach out to Laura and Amy directly to find the right starting point for your practice.',
  disc:'This masterclass is educational. It teaches a coaching methodology; it is not therapy or medical advice, and it makes no income or client-outcome guarantees. Results depend on the individual coach and client.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
 const sl=el('div','slide'+(s.t==='cover'?' cover':'')+(s.t==='cta'?' cta':''));
 sl.appendChild(el('div','num',(i+1)+' / '+S.length));
 if(s.eyebrow) sl.appendChild(el('div','eyebrow',s.eyebrow));
 if(s.part) sl.appendChild(el('div','part',s.part));
 if(s.kicker) sl.appendChild(el('div','kicker',s.kicker));
 if(s.h1) sl.appendChild(el('h1',null,s.h1));
 if(s.h2) sl.appendChild(el('h2',null,s.h2));
 if(s.who) sl.appendChild(el('div','who',s.who));
 if(s.sub) sl.appendChild(el('div','sub',s.sub));
 if(s.lead) sl.appendChild(el('p','lead',s.lead));
 if(s.p) sl.appendChild(el('p',null,s.p));
 if(s.bullets){const ul=el('ul');s.bullets.forEach(b=>ul.appendChild(el('li',null,b)));sl.appendChild(ul);}
 if(s.marks){const m=el('div','marks');m.appendChild(el('div','dot d-h','H'));m.appendChild(el('div','dot d-r','He'));m.appendChild(el('div','dot d-g','G'));sl.appendChild(m);}
 if(s.brains){const bw=el('div','brains');s.brains.forEach(b=>{const bx=el('div','brain');bx.appendChild(el('div','tag '+b.c,b.tag));bx.appendChild(el('div','d',b.d));bw.appendChild(bx);});sl.appendChild(bw);}
 if(s.foot) sl.appendChild(el('div','foot',s.foot));
 if(s.disc) sl.appendChild(el('div','disc',s.disc));
 deck.appendChild(sl);
});
</script>
</body>
</html>
