<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet Your Soul Council — A Masterclass with Anne Marie Pizarro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2a0b34;       /* deep plum ground, shade of brand #340e41 */
    --panel:#3a1148;    /* raised panel */
    --rule:#6c5570;     /* muted plum-grey */
    --accent:#ca9daf;   /* brand dusty rose (brand.json, 10 uses) */
    --ink:#f3e9f0;      /* light ink on plum */
    --muted:#c9b7c6;
    --display:"Playfair Display",Georgia,serif;
    --body:"Poppins",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300}
  .wrap{max-width:1040px;margin:0 auto;padding:48px 24px 80px}
  .slide{background:linear-gradient(180deg,var(--panel),var(--bg));border:1px solid var(--rule);
    border-radius:18px;padding:56px 56px;margin:0 0 26px;min-height:460px;position:relative;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .slide::before{content:"";position:absolute;inset:0;background-image:
    radial-gradient(1px 1px at 20% 30%,var(--accent) 50%,transparent 51%),
    radial-gradient(1px 1px at 70% 60%,var(--accent) 50%,transparent 51%),
    radial-gradient(1px 1px at 45% 80%,var(--accent) 50%,transparent 51%),
    radial-gradient(1px 1px at 85% 25%,var(--accent) 50%,transparent 51%);
    opacity:.35;pointer-events:none}
  .eyebrow{font-family:var(--body);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:20px;position:relative}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.05;margin-bottom:18px;position:relative}
  h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.1;margin-bottom:18px;position:relative}
  .sub{font-family:var(--display);font-style:italic;font-weight:500;font-size:22px;color:var(--muted);position:relative}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:40ch;position:relative;margin-bottom:14px}
  ul{list-style:none;position:relative}
  li{font-size:19px;line-height:1.5;padding-left:28px;margin-bottom:14px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:50%;
    background:var(--accent)}
  .pillar{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);margin-bottom:6px}
  .kick{font-family:var(--display);font-style:italic;font-size:30px;line-height:1.3;max-width:28ch;position:relative}
  .foot{position:absolute;bottom:22px;left:56px;font-size:12px;letter-spacing:.1em;color:var(--rule);
    text-transform:uppercase}
  .pagenum{position:absolute;bottom:22px;right:56px;font-size:12px;color:var(--rule)}
  .disc{font-size:13px;color:var(--muted);max-width:60ch;margin-top:22px;line-height:1.5}
  .cta-step{font-family:var(--display);font-weight:700;font-size:30px;color:var(--accent);margin:8px 0}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const BRAND="Body Energy Connection";
const S=[
  {t:'title',eyebrow:'A live masterclass',h:'Meet Your Soul Council',sub:'How to Read Your Own Akashic Records',foot:'Anne Marie Pizarro, RN'},
  {t:'content',eyebrow:'Who this is for',h:'You can feel there is more to the story.',body:[
    'You keep asking other people what to do with your life, your relationships, your work.',
    'Teachers, friends, readers, strangers on the internet.',
    'Everyone but the one source that was built to answer you.']},
  {t:'kick',eyebrow:'The trap',k:'We call it spiritual amnesia: forgetting that your own guidance was always available to you.'},
  {t:'kick',eyebrow:'The reframe',k:'You do not need another person to read you. You can learn to read the Records yourself.'},
  {t:'section',eyebrow:'Part one',h:'What the Akashic Records actually are'},
  {t:'content',eyebrow:'The Soul Map',h:'A readable map, not a mystery.',body:[
    'The Akashic Records hold the story of your soul: its agreements, its patterns, the recurring stories running quietly underneath your choices.',
    'I teach you to read it as what it is, a Soul Map, with structure you can actually follow.']},
  {t:'content',eyebrow:'Why it stays hidden',h:'The stories repeat until you read them.',body:[
    'The same relationship. The same money ceiling. The same point you always stall at.',
    'Those are not bad luck. They are stories written on your map, waiting to be seen and cleared.']},
  {t:'section',eyebrow:'Part two',h:'The method'},
  {t:'framework',eyebrow:'Pillar one',pillar:'The Soul Council',body:[
    'Every person has a council of guides and Record Keepers assigned to them.',
    'You will learn who sits on yours and how to bring a real question to them directly.']},
  {t:'framework',eyebrow:'Pillar two',pillar:'Reading the Soul Map',body:[
    'A repeatable way in: how to open the Records, how to ask so you get a clear answer, and how to recognise the answer when it lands.',
    'The same precision I was trained in as a nurse, applied to the unseen.']},
  {t:'framework',eyebrow:'Pillar three',pillar:'The FLOW method',body:[
    'Freedom, Love, Ownership of Time, and Wellness.',
    'The four-part filter I use to read in alignment, so the guidance moves you toward a life that actually feels like yours.']},
  {t:'section',eyebrow:'Part three',h:'Inside the live session'},
  {t:'content',eyebrow:'Live in the masterclass',h:'You will open your Records and ask one question.',body:[
    'Not theory. We do it together, live.',
    'You leave having asked your Soul Council something that matters to you and received an answer you can act on this week.']},
  {t:'content',eyebrow:'Why me',h:'A nurse who crossed over.',body:[
    'Acute-care nursing for years, then fifteen years building Body Energy Connection.',
    'I have trained more than one hundred people to become Certified Akashic Records Guides, written How to Work with Your Soul Council, and I host the Anneswer podcast.']},
  {t:'content',eyebrow:'Where this goes',h:'From one question to the full practice.',body:[
    'This masterclass is the first step on the same path my guides take: foundations, then the advanced MYSTIC training, then the Akashic Light School.',
    'If reading the Records becomes your work, there is a way to go all the way.']},
  {t:'cta',eyebrow:'Your next step',h:'Come meet your Soul Council.',step:'Register for the live masterclass, then book a session with me.',
    body:['Bring one real question. I will help you open your Records and hear the answer yourself.'],
    disc:'This masterclass is educational and experiential. Spiritual and energetic guidance is not medical, psychological, legal, or financial advice, and individual experiences vary. Nothing here is a guarantee of any specific outcome.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let h='';
  if(s.eyebrow)h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='title'){h+=`<h1>${s.h}</h1><div class="sub">${s.sub}</div>`;}
  else if(s.t==='section'){h+=`<h1>${s.h}</h1>`;}
  else if(s.t==='kick'){h+=`<div class="kick">${s.k}</div>`;}
  else if(s.t==='framework'){h+=`<div class="pillar">${s.pillar}</div>`;if(s.body)h+='<ul>'+s.body.map(b=>`<li>${b}</li>`).join('')+'</ul>';}
  else if(s.t==='cta'){h+=`<h2>${s.h}</h2><div class="cta-step">${s.step}</div>`;if(s.body)h+=s.body.map(b=>`<p>${b}</p>`).join('');if(s.disc)h+=`<div class="disc">${s.disc}</div>`;}
  else {if(s.h)h+=`<h2>${s.h}</h2>`;if(s.body)h+='<ul>'+s.body.map(b=>`<li>${b}</li>`).join('')+'</ul>';}
  h+=`<div class="foot">${BRAND}</div><div class="pagenum">${i+1} / ${S.length}</div>`;
  d.innerHTML=h;deck.appendChild(d);
});
</script>
</body>
</html>
