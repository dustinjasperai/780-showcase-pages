<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signature Leadership - a live masterclass with Jamie Mason Cohen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f6;        /* cool paper, a pale tint of the brand blue #0051c3 */
    --panel:#fafbfd;     /* card, faint cool white */
    --rule:#d7dbe3;      /* cool hairline */
    --ink:#1c1c1c;       /* charcoal ink (brand #404040 deepened for slide contrast) */
    --ink-soft:#4f535c;  /* muted cool gray */
    --accent:#0051c3;    /* brand blue, from brand.json ranked_colors */
    --serif:'Newsreader',Georgia,serif;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 54px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  .kicker{font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-.01em}
  .big{font-family:var(--serif);font-size:40px;line-height:1.14;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin-top:20px}
  p{font-family:var(--sans);font-size:19px;line-height:1.6;color:var(--ink-soft);max-width:62ch;margin-top:16px}
  ul{list-style:none;margin-top:22px;max-width:66ch}
  li{font-family:var(--sans);font-size:19px;line-height:1.5;color:var(--ink);padding:14px 0 14px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li b{font-weight:600}
  li:before{content:"";position:absolute;left:0;top:22px;width:18px;height:2px;background:var(--accent)}
  .num{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
  .part h1{font-size:40px}
  .accent{color:var(--accent)}
  .sig{margin-top:30px}
  .disclaimer{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--ink-soft);margin-top:28px;max-width:58ch}
  .foot{position:absolute;bottom:20px;left:56px;font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9aa0ab}
  .pg{position:absolute;bottom:20px;right:56px;font-family:var(--sans);font-size:12px;color:#9aa0ab}
  @media(max-width:640px){.slide{padding:38px 26px}h1{font-size:34px}h2{font-size:28px}.big{font-size:28px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const SIG = '<span class="sig"><svg width="230" height="46" viewBox="0 0 230 46" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 32 C 26 2, 40 2, 44 22 C 47 38, 58 40, 70 20 C 80 4, 92 6, 92 24 C 92 40, 104 42, 120 16 C 132 -2, 150 6, 150 26 C 150 42, 170 42, 196 14 C 206 4, 220 10, 226 20" stroke="#0051c3" stroke-width="3" stroke-linecap="round"/></svg></span>';

const S=[
 {t:'title', eyebrow:'A live masterclass with Jamie Mason Cohen', h:'Signature Leadership', big:'The leader hiding in your own hand.', sig:true},
 {t:'statement', kicker:'Who this is for', h:'Leaders whose 1:1s feel flat and whose messages are not landing.', p:'You lead a team, a function, or a company. On paper you are doing it right. In the room it feels like something is missing, and you cannot quite name it.'},
 {t:'statement', kicker:'The trap', h:'You read the books. You ran the frameworks. You sat through the 360s.', p:'And you still sound like every other competent leader. The tools were fine. They just were not yours.'},
 {t:'statement', kicker:'The uncomfortable part', h:'Most leadership advice makes you more generic.', p:'Every template you adopt sands off the thing that made people follow you in the first place. The fix is not another framework. It is finding the one you already carry.'},
 {t:'part', num:'Part One', h:'Why your leadership reads as generic'},
 {t:'statement', kicker:'The root', h:'Borrowed authority has a ceiling.', p:'A leader running on someone else’s playbook can be effective and still be unreadable. The team senses the gap between the words and the person, even when nobody says it out loud.'},
 {t:'list', kicker:'What it costs', items:[
   '<b>Flat 1:1s.</b> People give you status, not what they actually need.',
   '<b>Trust that stalls.</b> Congruence is what earns it, and generic reads as guarded.',
   '<b>Messages that slide off.</b> Correct, forgettable, and unacted on.'
 ]},
 {t:'part', num:'Part Two', h:'Signature Leadership: the authentic style you already have'},
 {t:'statement', kicker:'The idea', h:'Your handwriting is a record of how you really lead.', p:'Pace, decisiveness, warmth, how you handle detail and pressure, it is on the page before you have said a word. Read it, and a leader’s authentic style stops being a mystery.', sig:true},
 {t:'pillar', num:'Pillar 1', h:'Read the hand', p:'Forensic handwriting analysis surfaces how you actually think, decide, and relate. In minutes it shows a leader their real strengths and their blind spots, before anyone has sat through a 360.'},
 {t:'pillar', num:'Pillar 2', h:'Name the signature', p:'Most advice hands you a template. This names the leadership style that is already yours, so you stop borrowing someone else’s voice and start leading in your own.'},
 {t:'pillar', num:'Pillar 3', h:'Lead from it under pressure', p:'Saturday Night Leaders: the difference between creative and reactive leadership when the clock never stops, drawn from years inside a live weekly production.'},
 {t:'pillar', num:'Pillar 4', h:'Make it land', p:'The 4C way to shape a message so it moves people to act, whether you are in the room or on a screen.'},
 {t:'part', num:'Part Three', h:'How a signature leader shows up'},
 {t:'list', kicker:'In practice', items:[
   '<b>The generic leader</b> manages to the template and hopes it reads as leadership.',
   '<b>The signature leader</b> knows their own strengths and blind spots, and adjusts in the moment because they can read the room, starting with themselves.'
 ]},
 {t:'list', kicker:'Why listen to me on this', items:[
   'Started out as assistant to the executive producer of Saturday Night Live, learning leadership under a live weekly deadline.',
   'Dale Carnegie Business Training Award recipient and a Certified Leadership Coach with The Leadership Circle.',
   'Two TEDx talks, on leadership and on handwriting, seen 2.3 million and 1.7 million times.',
   'Worked with leaders at Sun Life Financial, Canada Life, Novo Nordisk, and Vistage CEO boards.'
 ]},
 {t:'list', kicker:'What you walk out able to do', items:[
   'Spot a leader’s strengths and blind spots in their handwriting.',
   'Name and lead from your own authentic signature, under pressure.',
   'Shape a message the 4C way so it actually moves people.'
 ]},
 {t:'cta', eyebrow:'Your next step', h:'Read your own leadership signature.',
   p:'Book a Signature Leadership discovery call with Jamie at jamiemasoncohen.com. Bring a sample of your handwriting. You will leave the call already seeing something you lead with that you had never named.',
   disclaimer:'This masterclass is for educational purposes only. No income or result is guaranteed. Results vary by individual, effort, and circumstance.'}
];

function render(s,i,n){
  const pg='<span class="pg">'+(i+1)+' / '+n+'</span>';
  const foot='<span class="foot">Signature Leadership</span>';
  let b='';
  if(s.eyebrow) b+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.kicker) b+='<div class="kicker">'+s.kicker+'</div>';
  if(s.num) b+='<div class="num">'+s.num+'</div>';
  if(s.h){
    const tag=(s.t==='title'||s.t==='part'||s.t==='cta')?'h1':'h2';
    b+='<'+tag+'>'+s.h.replace('more generic','<span class="accent">more</span> generic')+'</'+tag+'>';
  }
  if(s.big) b+='<p class="big">'+s.big+'</p>';
  if(s.p) b+='<p>'+s.p+'</p>';
  if(s.items) b+='<ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  if(s.disclaimer) b+='<p class="disclaimer">'+s.disclaimer+'</p>';
  if(s.sig) b+=SIG;
  return '<section class="slide '+(s.t==='part'?'part':'')+'">'+b+foot+pg+'</section>';
}
const deck=document.getElementById('deck');
deck.innerHTML=S.map((s,i)=>render(s,i,S.length)).join('');
</script>
</body>
</html>
