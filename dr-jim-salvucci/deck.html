<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Three L's of Great Leadership - Dr. Jim Salvucci</title>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1c2b;      /* dark hero ground, brand scheme */
    --panel:#16293b;   /* deeper tint */
    --rule:#284460;    /* rule */
    --accent:#3d9be9;  /* brand sky-blue */
    --steel:#81a5c1;   /* brand link steel */
    --ink:#f4f8fc;
    --mut:#aebfce;
    --head:'Zilla Slab',Georgia,serif;
    --body:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:linear-gradient(180deg,var(--panel),var(--bg));border:1px solid var(--rule);
    border-radius:16px;padding:54px 50px;margin:0 0 26px;min-height:420px;display:flex;
    flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);opacity:.9}
  .num{position:absolute;top:20px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--mut);font-weight:600}
  .k{font-family:var(--body);font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:600;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.12;letter-spacing:-.01em}
  .sub{font-family:var(--head);font-style:italic;font-size:24px;color:var(--steel);margin-top:20px;font-weight:400;line-height:1.3}
  .body{font-size:19px;line-height:1.6;color:var(--ink);margin-top:20px;max-width:62ch;font-weight:400}
  .big{font-family:var(--head);font-weight:500;font-size:46px;line-height:1.12;letter-spacing:-.01em}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px;max-width:66ch}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.5;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:11px;width:11px;height:11px;border-radius:3px;
    background:var(--accent)}
  li b{font-family:var(--head);font-weight:600;color:var(--ink)}
  li span{display:block;color:var(--mut);font-size:16px;margin-top:4px}
  .pre{font-family:var(--head);font-size:15px;color:var(--mut);letter-spacing:.04em;margin-bottom:10px}
  .foot{font-size:13px;color:var(--mut);margin-top:30px}
  .disc{font-size:14px;color:var(--mut);margin-top:26px;max-width:64ch;line-height:1.5}
  .cta .big{color:var(--ink)}
  .accent{color:var(--accent)}
  @media(max-width:620px){.slide{padding:38px 26px;min-height:340px}h1{font-size:36px}h2{font-size:28px}.big{font-size:32px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A Live Masterclass', h:"The Three L's of Great Leadership", sub:"How new managers become leaders people choose to follow.", foot:"Dr. Jim Salvucci, PhD - Guidance for Greatness"},

  {t:'who', k:'Who this is for', h:"You got promoted for being great at the work.", body:"Now you lead the people who do it. This hour is for the new and emerging leader standing at that gap: the best engineer, teacher, nurse, or seller on the team, suddenly responsible for a team."},

  {t:'trap', k:'The trap', h:"Nobody ever taught you to lead.", body:"You were trained for the work for years. For leadership you got a title and a Monday. So you copy the loudest boss you ever had, or you try to be everyone's friend, and you quietly wonder when someone will notice you are improvising."},

  {t:'reframe', k:'The reframe', big:"Great leaders are not born. They are <span class='accent'>taught</span>.", body:"Leadership is not a personality you were handed at birth. It is a practice, and a practice can be learned. That is the whole premise of this hour."},

  {t:'part', k:'Part One', h:"The real problem is not authority. It is trust."},

  {t:'problem', k:'Part One', h:"Control is what you reach for when trust is missing.", body:"A new leader without trust manages by instruction: approve everything, check everything, decide everything. The team does what you say and nothing more. You get compliance, and you mistake it for leadership. Real leadership starts the moment people follow you when they do not have to."},

  {t:'part', k:'Part Two', h:"The framework: Learning, Logic, and Life."},

  {t:'lesson', k:'The first L', h:"Learning", sub:"Great leaders are great teachers.", body:"Your job is not to have every answer. It is to grow the people who will. When you lead by teaching, you multiply yourself, and your team gets stronger whether or not you are in the room."},

  {t:'lesson', k:'The second L', h:"Logic", sub:"Think like a philosopher. Move like a realist.", body:"Reason clearly, weigh the good and the bad honestly, and then decide and act. Good leaders are not the most certain people in the room. They are the ones whose decisions hold up when you ask them why."},

  {t:'lesson', k:'The third L', h:"Life", sub:"Values and earned trust come first.", body:"People do not follow a title. They follow a human being whose values they can predict and whose word they can trust. Character is not the soft part of leadership. It is the foundation the other two Ls stand on."},

  {t:'quote', k:'The throughline', big:"Your WHY plus your HOW are your roadmap.", body:"Mission-based leadership is simply this: get clear on why your team exists, then build the small, repeatable actions that move you there. Purpose without action is a poster. Action without purpose is busywork."},

  {t:'list', k:'How it runs day to day', h:"Purpose, Passion, Precise Action.", list:[
    {b:"Purpose", s:"Name the mission in one sentence your team can repeat."},
    {b:"Passion", s:"Lead with conviction so people know what you stand for."},
    {b:"Precise Action", s:"Turn it into small habits that happen whether or not you feel inspired."}
  ]},

  {t:'part', k:'Part Three', h:"Your first ninety days, led on purpose."},

  {t:'picture', k:'In practice', h:"Lead one conversation differently this week.", body:"Instead of handing out the answer, teach the thinking behind it once. Instead of chasing a decision, say what you are weighing and why. Small, on purpose, repeated. That is how a manager becomes a leader people choose to follow."},

  {t:'habit', k:'Why small beats big', h:"Change that sticks is small and repeated.", body:"You will not become a different leader over a weekend retreat. You become one through tiny changes done consistently: small changes, repeated over time, compound into a brand new way of leading. Start with one."},

  {t:'why', k:'Why listen to me', h:"I spent thirty years learning this the hard way.", body:"I was an English professor, a founding dean, and a C-suite executive before I became a coach. I have led people well and badly, and I wrote the book on it, literally: Greater than Great. Everything in this hour is what I wish someone had taught me on my own first Monday."},

  {t:'recap', k:'The whole hour in three words', h:"Learning. Logic. Life.", body:"Teach your people. Reason before you act. Lead from your values. Do those three, small and repeated, and you will not have to demand that anyone follow you."},

  {t:'cta', cls:'cta', k:'Your next step', big:"Ready to lead with greatness?", body:"If you want help turning this into your own ninety-day plan, book a free thirty-minute conversation and we will map your first steps together.", foot:"Schedule Your Breakthrough at guidanceforgreatness.com", disc:"Educational content only. No income, role, promotion, or result is guaranteed. Results vary and depend on your own effort, context, and circumstances."}
];
const d = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.cls?' '+s.cls:'');
  let h='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.k) h+='<div class="k">'+s.k+'</div>';
  if(s.h) h+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.body) h+='<p class="body">'+s.body+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(it=>{h+='<li><b>'+it.b+'</b><span>'+it.s+'</span></li>';});h+='</ul>';}
  if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=h;
  d.appendChild(el);
});
</script>
</body>
</html>
