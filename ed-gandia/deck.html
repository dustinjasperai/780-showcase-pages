<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Rebundling, a masterclass with Ed Gandia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f7;        /* pale tint of his H1 blue #255b8a, lightened ~94% to white */
    --panel:#f9fcff;     /* near-white, cool, derived from the same blue */
    --ink:#1e1e1e;       /* his body ink */
    --muted:#55606b;
    --rule:#dbe4ec;      /* cool hairline from the blue-paper ground */
    --accent:#255b8a;    /* Gandia blue, his H1 color */
    --signal:#fd6f4a;    /* his signal orange, used sparingly */
    --display:'Antonio', 'Arial Narrow', sans-serif;
    --text:Georgia, 'Times New Roman', serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--text);line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:4px;
    padding:56px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;box-shadow:0 1px 0 rgba(30,30,30,.03)}
  .kick{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;
    font-size:14px;color:var(--accent);font-weight:600;margin-bottom:18px}
  .kick.sig{color:var(--signal)}
  h1{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.02;
    color:var(--accent);letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.06;
    color:var(--ink);margin-bottom:18px}
  .lede{font-size:22px;color:var(--muted);max-width:40ch}
  p.body{font-size:20px;margin:0 0 14px;max-width:62ch}
  p.big{font-size:30px;line-height:1.28;max-width:30ch;color:var(--ink)}
  .mark{color:var(--signal)}
  .edge{position:absolute;left:0;top:40px;bottom:40px;width:4px;background:var(--accent)}
  .edge.sig{background:var(--signal)}
  ul{list-style:none;margin:10px 0 0;max-width:62ch}
  ul li{font-size:19px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  ul li:last-child{border-bottom:none}
  ul li:before{content:"";position:absolute;left:0;top:21px;width:10px;height:10px;
    background:var(--accent);border-radius:2px}
  .num{font-family:var(--display);font-size:16px;color:var(--muted);letter-spacing:.1em;
    position:absolute;right:28px;bottom:20px}
  .cred{display:flex;gap:40px;flex-wrap:wrap;margin-top:14px}
  .cred div{min-width:140px}
  .cred .n{font-family:var(--display);font-size:46px;color:var(--accent);line-height:1}
  .cred .l{font-size:15px;color:var(--muted);margin-top:6px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:64ch;line-height:1.5}
  .foot{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;
    font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<div class="foot">The Great Rebundling &middot; a live masterclass with Ed Gandia</div>
<script>
const S = [
  {t:'title', kick:'A live masterclass for experienced writers',
   h:'The Great Rebundling',
   lede:'How to stay indispensable, and raise your fees, as AI takes your work apart.'},

  {t:'who', kick:'Who this is for',
   big:'You are a good writer with real clients. And lately you can feel the ground moving under the rates you worked years to earn.'},

  {t:'trap', kick:'The trap',
   h:'Racing the machine',
   body:['The instinct, when clients discover AI, is to get faster and cheaper so you still win the work.',
         'That is a race you lose by winning. Every hour you spend competing with a tool on speed is an hour you are not spending where you cannot be copied.']},

  {t:'reframe', kick:'The reframe', sig:true,
   big:'AI is not taking your job. It is taking your job apart. And that is a very different thing.'},

  {t:'part', kick:'Part one', h:'A picture of it',
   body:['Think about the last project a client hired you for. Research, a point of view, a draft, edits, the final call on what to ship, and the trust that you would get it right.',
         'A tool can now do the drafting in minutes. It cannot hold the point of view, make the final call, or carry the trust. Those did not disappear. They came loose, and they are up for grabs.']},

  {t:'part', kick:'Part one', h:'What actually gets unbundled',
   body:['A job is a bundle: production, judgment, trust, accountability, the relationship.',
         'AI is cheap at exactly one strand of that bundle, production. It is not cheap at the rest. When a bundle comes apart, the value does not vanish. It gets rebundled around whoever holds the strands that still matter.']},

  {t:'part', kick:'Part one', h:'The rebundling, in one line',
   big:'When production gets cheap, the work rebundles around judgment, taste, trust and responsibility. The writer who claims that new bundle wins.'},

  {t:'part', kick:'Part two', h:'Two ways the work rebundles',
   body:['Across hundreds of writers, the strands keep rebundling into the same two patterns. Claim either one and you are no longer competing with the tool on price.'],
   list:['The Orchestrator, who directs the outcome',
         'The Judgment Premium, who is paid for the calls a machine cannot make']},

  {t:'pillar', kick:'Pattern one', h:'The Orchestrator', num:'01',
   body:['Your value moves up a level: scoping the outcome, setting the standard, making the tradeoffs, integrating what the tools produce.'],
   list:['Product thinking, not prompting',
         'You direct the work instead of typing every word',
         'The client is buying your judgment on what is worth making, not your keystrokes']},

  {t:'pillar', kick:'Pattern two', h:'The Judgment Premium', num:'02', sig:true,
   body:['When speed is free, the bottleneck moves to the calls a machine cannot make.'],
   list:['Is this accurate, and who is accountable if it is not',
         'Does this protect the brand, or quietly damage it',
         'Is this even the right thing to say right now',
         'That judgment is what clients will pay the premium for']},

  {t:'part', kick:'The method', h:'Find where judgment lives',
   body:['Pick one real client. Ask the question you never ask: what would we make for them if there were no limits of time or budget.',
         'Spend thirty to sixty minutes building a rough version of that with AI, before you quote anything.',
         'Then notice every place the draft falls short. That gap, the thing the tool cannot reach, is exactly where your judgment earns its fee.']},

  {t:'part', kick:'The method', h:'Protect what compounds',
   body:['Push AI into your hardest, most time consuming work. One hour a day. One workflow a week.'],
   list:['Name what compounds in your work: judgment, taste, relationships',
         'Protect those on purpose, and let them grow',
         'Automate the parts that do not compound',
         'Speed buys you room to do the work only you can do']},

  {t:'part', kick:'The payoff', h:'Four ways clients pay for this',
   body:['Once you hold the new bundle, the AI shift stops being a threat to your rate and becomes a second line of revenue.'],
   list:['Done for you, at a higher level',
         'Advisory and strategy, priced on judgment not hours',
         'Training their team to do it well',
         'A productized offer you can sell more than once']},

  {t:'part', kick:'The objection', h:'But my clients just want it cheap',
   body:['Some will. Let them go to the tool, and let the tool teach them what cheap buys.',
         'The clients worth keeping are not buying words by the pound. They are buying the confidence that someone competent is accountable for the outcome. Price that, and the cheap work stops being your problem.']},

  {t:'reframe', kick:'The window', sig:true,
   big:'Right now almost nobody is teaching experienced writers this. I think that window stays open for about a year, and then it is the new normal.'},

  {t:'look', kick:'The repositioned writer', h:'From producer to indispensable',
   body:['The repositioned writer is not cheaper or faster than AI. They are the person a client trusts to decide what is worth making and to stand behind it.',
         'That writer does not lose work to the tool. They use the tool to take on work they could never have reached before, and they charge accordingly.']},

  {t:'cred', kick:'Why listen to me', h:'I have watched this happen up close',
   stats:[['1,600+','writers coached, 14 years'],['1.3M+','podcast downloads, 101 countries'],['2','books on the business of writing']],
   body:['I moved from software sales into freelance writing in 2004, co-wrote The Wealthy Freelancer, and I have spent fourteen years helping writers get better clients and raise their fees. The rebundling is the biggest shift I have seen, and the writers who name it early are the ones who win.']},

  {t:'cta', kick:'Start the rebundling',
   h:'Claim your new bundle',
   body:['If you want help applying this to your own practice, here is the next step.'],
   list:['Grab the free book, AI and the Great Rebundling, at b2blauncher.com',
         'Join the AI Advantage Hub for the playbooks, the workflows and Ed on Tap',
         'Or apply for 90-Day Private Coaching to do it one to one'],
   disc:'Educational content only. No income, revenue, or client result is guaranteed. Results vary and depend on your own work, market, and effort. Nothing here is financial or legal advice.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck = document.getElementById('deck');
S.forEach(function(s){
  const sl = el('div','slide');
  const sig = s.sig ? ' sig' : '';
  sl.appendChild(el('span','edge'+sig));
  if(s.kick) sl.appendChild(el('div','kick'+sig, s.kick));
  if(s.h && s.t==='title') sl.appendChild(el('h1', null, s.h));
  else if(s.h) sl.appendChild(el('h2', null, s.h));
  if(s.lede) sl.appendChild(el('div','lede', s.lede));
  if(s.big) sl.appendChild(el('p','big', s.big));
  if(s.body) s.body.forEach(function(b){ sl.appendChild(el('p','body', b)); });
  if(s.stats){ const w=el('div','cred'); s.stats.forEach(function(st){ const d=el('div'); d.appendChild(el('div','n',st[0])); d.appendChild(el('div','l',st[1])); w.appendChild(d); }); sl.appendChild(w); }
  if(s.list){ const u=el('ul'); s.list.forEach(function(li){ u.appendChild(el('li',null,li)); }); sl.appendChild(u); }
  if(s.disc) sl.appendChild(el('div','disc', s.disc));
  if(s.num) sl.appendChild(el('div','num', s.num));
  deck.appendChild(sl);
});
</script>
</body>
</html>
