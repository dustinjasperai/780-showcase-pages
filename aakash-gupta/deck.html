<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Land an AI PM Role — with Aakash Gupta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#f4f6fb;
    --rule:#dbe2f0;
    --ink:#1d2433;
    --muted:#5a6475;
    --accent:#4472c4;
    --pop:#d9305d;
    --head:"Inter",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--rule);font-family:var(--head);color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{max-width:1120px;margin:0 auto;padding:28px 18px 70px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:16px;
    aspect-ratio:16/9;width:100%;margin:0 0 26px;padding:64px 72px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
    box-shadow:0 1px 0 rgba(29,36,51,.03),0 18px 40px -28px rgba(29,36,51,.35);
  }
  .kick{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;display:flex;align-items:center;gap:10px}
  .kick::before{content:"";width:26px;height:2px;background:var(--accent);display:inline-block}
  h1{font-size:58px;line-height:1.02;font-weight:900;letter-spacing:-.02em;max-width:17ch}
  h2{font-size:40px;line-height:1.08;font-weight:800;letter-spacing:-.015em;max-width:20ch}
  .sub{font-size:21px;line-height:1.45;color:var(--muted);margin-top:22px;max-width:48ch;font-weight:500}
  .lede{font-size:30px;line-height:1.3;font-weight:600;max-width:24ch}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:16px;max-width:52ch}
  li{font-size:21px;line-height:1.4;padding-left:30px;position:relative;color:var(--ink);font-weight:500}
  li::before{content:"";position:absolute;left:0;top:11px;width:11px;height:11px;border-radius:3px;background:var(--accent)}
  li .m{color:var(--muted);font-weight:500}
  .sectionNum{font-family:var(--mono);font-size:15px;color:var(--pop);font-weight:600;margin-bottom:14px;letter-spacing:.06em}
  .stat{display:flex;gap:56px;margin-top:34px;flex-wrap:wrap}
  .stat .n{font-size:72px;font-weight:900;letter-spacing:-.03em;color:var(--accent);line-height:1}
  .stat .n.alt{color:var(--pop)}
  .stat .l{font-size:17px;color:var(--muted);margin-top:8px;max-width:20ch;font-weight:500}
  .pop{color:var(--pop)}
  .accent{color:var(--accent)}
  .strike{text-decoration:line-through;text-decoration-color:var(--pop);text-decoration-thickness:3px;color:var(--muted)}
  .pageno{position:absolute;right:30px;bottom:22px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .brandfoot{position:absolute;left:72px;bottom:22px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
  .cta .btn{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;font-weight:700;font-size:20px;padding:16px 30px;border-radius:10px}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:var(--muted);max-width:60ch;font-family:var(--mono)}
  .cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px;max-width:60ch}
  .cardgrid .c{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:20px 22px}
  .cardgrid .c .t{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.08em;margin-bottom:8px}
  .cardgrid .c .d{font-size:17px;line-height:1.35;font-weight:600}
  @media(max-width:720px){
    .slide{padding:34px 30px;aspect-ratio:auto;min-height:88vh}
    h1{font-size:38px}h2{font-size:30px}.lede{font-size:23px}.stat .n{font-size:52px}.brandfoot{left:30px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title', k:"Live Masterclass", h:"How to Land an AI PM Role",
    sub:"The transition map for product managers in the AI era, from someone who has spent a decade doing the work and 150+ interviews studying who gets hired."},
  {t:'content', k:"Who this is for", lede:"If AI is rewriting product management in real time, this is for you.",
    bullets:[
      "A current PM who can feel the ground shifting and does not want to be caught flat.",
      "A PM who has played with an agent demo but has never shipped one in production.",
      "A career switcher trying to break into product right now, in the hardest market yet."
    ]},
  {t:'content', k:"The trap", lede:"You are running the old playbook perfectly, and it has quietly stopped working.",
    bullets:[
      "You updated the resume and took the certificate everyone recommends.",
      "You applied to 60 or 80 roles and heard almost nothing back.",
      "The playbook that got the last generation of PMs hired is not the one hiring today."
    ]},
  {t:'hook', k:"The reframe", h:"The job you are training for is already changing under you.",
    sub:"The question is no longer how to become a product manager. It is how to become an AI product manager before the window everyone is staring at closes."},
  {t:'stat', k:"Why now", h:"The widest gap the PM market has ever produced.",
    stats:[
      {n:"30%", l:"of open PM roles in 2026 are AI PM roles", alt:false},
      {n:"<5%", l:"of PMs in the market have shipped a working AI agent", alt:true}
    ],
    sub:"Demand is concentrated where supply barely exists. That is the opening, and it is open right now."},
  {t:'section', num:"Part One", h:"Why the old playbook stopped working"},
  {t:'content', k:"The core problem", lede:"A resume full of courses signals exposure, not capability.",
    bullets:[
      "Hiring managers for AI PM roles cannot tell who can actually ship from a list of certificates.",
      "The credential market is crowded. The capability market is nearly empty.",
      "The people getting the offers are the ones who can show, not tell."
    ]},
  {t:'content', k:"The deeper problem", lede:"Everyone is reading the same AI articles. Almost no one has built.",
    bullets:[
      "Reading about agents, evals, and prompting is not the same as having shipped one.",
      "The market is flooded with people who can talk about AI product work.",
      "Being able to point at a thing you built is now the whole differentiator."
    ]},
  {t:'section', num:"Part Two", h:"The AI PM transition, in four moves"},
  {t:'content', k:"Move 1 of 4", h:"Position for where the demand actually is.",
    sub:"Target the AI PM roles that are open and under-supplied, not the generic PM reqs that draw 800 applicants. The gap is your leverage."},
  {t:'content', k:"Move 2 of 4", h:"Capability over credentials. Ship a real agent.",
    sub:"A PM who has built a working agent interviews completely differently from one who has only seen a demo. The build is the proof, and the proof is the edge."},
  {t:'cards', k:"Move 3 of 4", h:"The AI Job Search OS",
    cards:[
      {ct:"Resume", d:"Rewritten for AI PM hiring, not generic PM reqs."},
      {ct:"LinkedIn", d:"Positioned so AI PM recruiters actually find you."},
      {ct:"GitHub", d:"Where the agent you built lives and speaks for you."},
      {ct:"Portfolio", d:"Capability on a page, targeted at the role."}
    ],
    sub:"A system you run on purpose, not a resume you tweak on vibes."},
  {t:'content', k:"Move 4 of 4", h:"Interview like an operator.",
    sub:"Walk in with reps on AI PM questions and a thing you built. Show the work. The certificate stays in the drawer where it belongs."},
  {t:'section', num:"Part Three", h:"What the 12 weeks look like"},
  {t:'content', k:"The arc", lede:"Twelve weeks, run in the order that gets people hired.",
    bullets:[
      "Weeks 1 to 4: PM and AI fundamentals, so the foundation is real.",
      "Weeks 5 to 8: ship a working agent, hands on, the part that breaks and then works.",
      "Weeks 9 to 12: interviews, offers, and a portfolio that proves capability."
    ]},
  {t:'content', k:"Why me", lede:"This is not theory. It is a decade of operating, taught back.",
    bullets:[
      "Growth at thredUP, growth product at Affirm as revenue went from $300M to $1.2B.",
      "VP of Product at Apollo during the run from $750M to $2.5B. Wharton MBA.",
      "150+ practitioner interviews and Product Growth read by 236K+ PMs every week."
    ]},
  {t:'hook', k:"The whole thesis", h:"Build the thing. Then the interviews come.",
    sub:"Everything above collapses into one idea. Capability is scarce, so become the person who demonstrably has it, and let the market do the rest."},
  {t:'content', k:"Recap", lede:"Three things to hold onto.",
    bullets:[
      "The AI PM gap is real and it is open right now.",
      "Capability beats credentials, so ship something you can point at.",
      "The Job Search OS is what makes the whole thing repeatable instead of lucky."
    ]},
  {t:'cta', k:"Your next step", h:"Ready to make the transition?",
    sub:"If you want the structured version of everything here, with live coaching and a cohort that does it with you, apply to the next Land a PM Job cohort.",
    btn:"Apply at landpmjob.com",
    disc:"Educational content only. No income, hiring, or outcome is promised or guaranteed. Results vary and depend on your own effort, background, and the market. Cohort enrollment is by application."}
];

const stage = document.getElementById("stage");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide" + (s.t === "cta" ? " cta" : "");
  let html = "";
  if (s.k) html += '<div class="kick">' + s.k + '</div>';
  if (s.t === "section") {
    html = '<div class="sectionNum">' + s.num + '</div><h1>' + s.h + '</h1>';
  } else {
    if (s.h) html += (s.t === "title" || s.t === "cta" ? '<h1>' + s.h + '</h1>' : '<h2>' + s.h + '</h2>');
    if (s.lede) html += '<div class="lede">' + s.lede + '</div>';
    if (s.stats) {
      html += '<div class="stat">';
      s.stats.forEach(x => { html += '<div><div class="n' + (x.alt ? ' alt' : '') + '">' + x.n + '</div><div class="l">' + x.l + '</div></div>'; });
      html += '</div>';
    }
    if (s.cards) {
      html += '<div class="cardgrid">';
      s.cards.forEach(c => { html += '<div class="c"><div class="t">' + c.ct + '</div><div class="d">' + c.d + '</div></div>'; });
      html += '</div>';
    }
    if (s.bullets) { html += '<ul>'; s.bullets.forEach(b => html += '<li>' + b + '</li>'); html += '</ul>'; }
    if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
    if (s.btn) html += '<div><span class="btn">' + s.btn + '</span></div>';
    if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  }
  html += '<div class="brandfoot">Product Growth · Aakash Gupta</div>';
  html += '<div class="pageno">' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = html;
  stage.appendChild(el);
});
</script>
</body>
</html>
