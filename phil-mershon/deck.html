<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unforgettable: Designing the Emotional Score of Your Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f6fb;      /* his navy lightened to warm paper (site_scheme light) */
    --panel:#ffffff;   /* his page ground */
    --rule:#ccd7e6;    /* navy at low opacity */
    --ink:#15202f;     /* deep navy-ink */
    --muted:#52607a;
    --accent:#002d5b;  /* his exact brand navy */
    --display:'Montserrat',system-ui,sans-serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 48px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(0,45,91,.04)}
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.06;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.12;color:var(--ink)}
  .sub{font-size:19px;color:var(--muted);margin-top:18px;max-width:40ch;line-height:1.5}
  p.lead{font-size:20px;line-height:1.5;color:var(--ink);margin-top:14px;max-width:46ch}
  .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  .big .a{color:var(--accent)}
  ul{margin:22px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.4;color:var(--ink);padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:0}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .m{font-family:var(--display);font-weight:800;color:var(--accent);font-size:22px}
  .by{margin-top:34px;font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink)}
  .by span{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:15px;margin-top:4px}
  .wave{position:absolute;left:0;right:0;bottom:0;height:46px;opacity:.5}
  .num{font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent);
    border:1.5px solid var(--accent);border-radius:999px;width:38px;height:38px;display:flex;
    align-items:center;justify-content:center;margin-bottom:18px}
  .foot{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted);font-family:var(--display);letter-spacing:.08em}
  .cta-note{font-size:14px;color:var(--muted);margin-top:26px;max-width:52ch;line-height:1.5}
  .btn{display:inline-block;margin-top:24px;font-family:var(--display);font-weight:700;font-size:18px;
    background:var(--accent);color:#fff;padding:15px 26px;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* Masterclass deck — Phil Mershon's teaching to HIS audience. His CTA only. */
const WAVE='<svg class="wave" viewBox="0 0 960 46" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 30 Q 24 10 48 30 T 96 30 T 144 18 T 192 30 T 240 8 T 288 30 T 336 22 T 384 30 T 432 6 T 480 30 T 528 20 T 576 30 T 624 12 T 672 30 T 720 24 T 768 30 T 816 10 T 864 30 T 912 20 T 960 30" fill="none" stroke="#002d5b" stroke-width="2"/></svg>';
const S = [
 {t:'title',
  kicker:'A Live Masterclass with Phil Mershon',
  h1:'Unforgettable: Designing the Emotional Score of Your Event',
  sub:'How to stop planning agendas and start composing experiences your attendees still talk about months later.',
  by:'Phil Mershon', byline:'Founder, Unforgettable Experiences. Author of Unforgettable.'},

 {t:'lead',
  kicker:'Who this is for',
  h2:'For the organizer who nails the logistics and still gets a quiet room.',
  lead:'If you run conferences, corporate events, or association gatherings and you want them remembered, not just attended, this hour is for you.'},

 {t:'big',
  kicker:'The trap',
  html:'You planned every minute of the day.<br>By Monday, <span class="a">they had forgotten most of it.</span>'},

 {t:'big',
  kicker:'The reframe',
  html:'Attendees do not remember your agenda.<br>They remember <span class="a">how you made them feel.</span>'},

 {t:'part',
  num:'1',
  kicker:'Part one',
  h2:'The real problem is not logistics. It is the experience.',
  lead:'A flawless schedule can still feel flat. Five quiet forces drain a room, and most of them never show up on a run-sheet.'},

 {t:'list',
  kicker:'The ingredients',
  h2:'Think of an event like baking bread.',
  lead:'Two ingredients decide whether it comes out average, boring, or unforgettable:',
  items:['Content, what you put in front of the room','Connection, what happens between the people in it','How you combine them is the whole craft, not how many sessions you can fit in a day']},

 {t:'part',
  num:'2',
  kicker:'Part two',
  h2:'The 3 M’s of Event Success',
  lead:'Every moment worth designing passes three tests. Miss one and the memory fades.'},

 {t:'list',
  kicker:'The 3 M’s',
  h2:'Memorable',
  lead:'It stands out. It surprises. It engages more than one sense, so it earns a place in long-term memory instead of sliding past.',
  items:['Pattern interrupts over polish','Multi-sensory over slide-heavy','One thing they did not expect beats ten they did']},

 {t:'list',
  kicker:'The 3 M’s',
  h2:'Meaningful',
  lead:'The attendee personally gets value from it. Relevance is not decoration; it is the reason the moment lands for this specific room.',
  items:['Designed for who is actually there','Tied to why they came','Value they can name the next morning']},

 {t:'list',
  kicker:'The 3 M’s',
  h2:'Momentous',
  lead:'You deliberately build the moments that matter most. In my words, do for one what you wish you could do for everyone.',
  items:['Pick the peak moments on purpose','Elevate them past the ordinary','A few designed peaks outlast a day of smooth logistics']},

 {t:'big',
  kicker:'My distinctive lens',
  html:'An event has a tempo, a volume, and a key.<br><span class="a">Event Musicology</span> is how you score it.'},

 {t:'list',
  kicker:'Event Musicology',
  h2:'Music is not background. It is design.',
  lead:'I spent my life on a jazz saxophone, and it taught me more about timing, energy, and reading a room than any textbook. The same levers shape an event:',
  items:['Tempo, when to build energy and when to let the room breathe','Atmosphere, the sound that tells people how to feel before a word is spoken','Cues, using sound to mark the moments you want remembered']},

 {t:'list',
  kicker:'The architecture',
  h2:'The IMPACT Framework',
  lead:'Great experiences are not luck. IMPACT is how I decide where to spend attention so effort lands where it changes how the event is remembered, instead of spreading thin across the whole run-sheet.',
  items:['Where the journey actually turns','Where to invest and where to simplify','A repeatable architecture, not taste on the day']},

 {t:'list',
  kicker:'The full journey',
  h2:'The experience starts before the doors open.',
  lead:'Memory is built across the whole arc, not just show day:',
  items:['The 60 days before, build anticipation on purpose','The event, design the peaks, not just the sessions','The 30 days after, the moments that turn attendees into referrals']},

 {t:'part',
  num:'3',
  kicker:'Part three',
  h2:'What it looks like when it is scored.',
  lead:'A keynote does not just start. The lights, the sound, and the first ninety seconds are composed so the room leans in before the speaker says a word. That is a designed peak, not a happy accident.'},

 {t:'list',
  kicker:'Why me',
  h2:'I have been doing this for a living for 30 years.',
  lead:'',
  items:['Director of Experience behind Social Media Marketing World','Consistent 95% referral scores at that event','Experiences designed for 5,000+ attendees','Hundreds of speakers coached, across corporations, associations, and nonprofits']},

 {t:'list',
  kicker:'What you take away',
  h2:'The whole method, in one view.',
  lead:'',
  items:['The 3 M’s to test any moment, Memorable, Meaningful, Momentous','Event Musicology to score the emotional arc','The IMPACT Framework to decide where to spend your attention']},

 {t:'cta',
  kicker:'Your next step',
  h2:'Let’s design your next event so the room remembers it.',
  lead:'If you want help turning your next conference or corporate event into one people still talk about, book a free discovery call and we will map where your experience is leaking memory and where to score it.',
  btn:'Book a Free Discovery Call',
  disclaimer:'Educational content only. No income, revenue, attendance, or outcome is guaranteed. Results vary based on your event, audience, and execution.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=el('div','slide');
  if(s.kicker)d.appendChild(el('div','kicker',s.kicker));
  if(s.num)d.appendChild(el('div','num',s.num));
  if(s.t==='title'){
    d.appendChild(el('h1',null,s.h1));
    if(s.sub)d.appendChild(el('div','sub',s.sub));
    const by=el('div','by',s.by);by.appendChild(el('span',null,s.byline));d.appendChild(by);
    d.insertAdjacentHTML('beforeend',WAVE);
  } else if(s.t==='big'){
    d.appendChild(el('div','big',s.html));
    d.insertAdjacentHTML('beforeend',WAVE);
  } else if(s.t==='lead'||s.t==='part'){
    if(s.h2)d.appendChild(el('h2',null,s.h2));
    if(s.lead)d.appendChild(el('p','lead',s.lead));
  } else if(s.t==='list'){
    if(s.h2)d.appendChild(el('h2',null,s.h2));
    if(s.lead)d.appendChild(el('p','lead',s.lead));
    const ul=el('ul');(s.items||[]).forEach(it=>ul.appendChild(el('li',null,it)));d.appendChild(ul);
  } else if(s.t==='cta'){
    d.appendChild(el('h2',null,s.h2));
    if(s.lead)d.appendChild(el('p','lead',s.lead));
    const b=el('a','btn',s.btn);b.href='http://cal.com/philmershon/15-minute-discovery-call';d.appendChild(b);
    d.appendChild(el('div','cta-note',s.disclaimer));
    d.insertAdjacentHTML('beforeend',WAVE);
  }
  d.appendChild(el('div','foot','UNFORGETTABLE'));
  deck.appendChild(d);
});
</script>
</body>
</html>
