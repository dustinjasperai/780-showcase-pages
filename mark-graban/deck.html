<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Silence Tax, a Live Masterclass with Mark Graban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f4ef;   /* brand ground (markgraban.com bg) */
    --ink:#20334b;     /* brand dominant navy */
    --rule:#315c8c;    /* brand mid-blue */
    --accent:#a64f5b;  /* brand brick-rose link accent */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e7e3da;color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px;}
  .slide{background:var(--paper);border:1px solid #ddd7ca;border-radius:10px;padding:56px 60px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 #fff inset,0 8px 24px rgba(32,51,75,.06);}
  .eyebrow{font-family:'IBM Plex Sans';font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'IBM Plex Sans';font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'IBM Plex Sans';font-weight:600;font-size:33px;line-height:1.14;margin-bottom:16px}
  p{font-size:19px;line-height:1.6;max-width:62ch;color:#2c3e55}
  p+p{margin-top:14px}
  .lead{font-size:22px;color:var(--ink)}
  .rule{width:64px;height:4px;background:var(--accent);border-radius:3px;margin:8px 0 26px}
  .note{font-size:17px;color:#54657d;margin-top:22px}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 40px;position:relative;border-top:1px solid #e4dfd3;max-width:64ch}
  li:first-child{border-top:none}
  li .n{position:absolute;left:0;top:13px;font-family:'IBM Plex Sans';font-weight:700;color:var(--accent)}
  .big{font-family:'IBM Plex Sans';font-weight:700;font-size:40px;line-height:1.12;color:var(--ink);max-width:21ch}
  .big .hot{color:var(--accent)}
  .pill{display:inline-block;font-family:'IBM Plex Sans';font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--rule);padding:6px 12px;border-radius:999px;margin-bottom:22px;align-self:flex-start}
  .step{background:var(--ink);color:var(--paper);border-radius:10px;padding:22px 26px;margin-top:12px;max-width:60ch;font-size:19px;line-height:1.55}
  .step b{font-family:'IBM Plex Sans'}
  .disclaimer{font-size:13px;color:#6b7a8e;margin-top:24px;max-width:70ch;line-height:1.5}
  .pg{font-family:'IBM Plex Sans';font-size:12px;color:#8a95a4;letter-spacing:.1em;margin-top:30px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:8px}
  .two .box{background:#fff;border:1px solid #e4dfd3;border-radius:8px;padding:22px 24px}
  .two .box h3{font-family:'IBM Plex Sans';font-size:18px;color:var(--rule);margin-bottom:8px}
  .two .box p{font-size:16px}
  @media(max-width:620px){.slide{padding:36px 26px}h1{font-size:34px}h2{font-size:26px}.big{font-size:30px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S=[
  {t:'title', eyebrow:'A live masterclass with Mark Graban', h:'The Silence Tax',
   sub:'Why your improvement efforts stall when people stop speaking up, and the four leader behaviors that bring the problems back into the open.',
   note:'For leaders in healthcare, manufacturing, and technology who are tired of the same problems coming back.'},

  {t:'content', eyebrow:'Who this is for', h:"You have the tools. The results still don't stick.",
   p:["You have run the kaizen events. You have the boards, the metrics, the method. For a while things get better, and then the old problems quietly come back.",
      "If that sounds familiar, the issue is almost never the tools. It is what people are not telling you."]},

  {t:'content', eyebrow:'The trap', h:'Your people see the problems first. Most of it never reaches you.',
   p:["The person closest to the work sees the risk, the workaround, the bad idea about to ship. Then they do the math: is it worth it to say something?",
      "When the answer is no, the problem does not go away. It just goes quiet."]},

  {t:'reframe', pill:'The reframe',
   big:'Silence is not free. You are paying a <span class="hot">tax</span> on everything that goes unsaid.',
   note:'Every unspoken concern, unreported near miss, and unshared idea is a cost you never see on a report.'},

  {t:'list', eyebrow:'Part one, the real problem', h:'People stay quiet for two reasons.',
   items:[{n:'1', text:'<b>Fear.</b> Speaking up has felt unsafe before. Someone got blamed, talked over, or labeled difficult, so now people keep their heads down.'},
          {n:'2', text:'<b>Futility.</b> People spoke up, nothing changed, and they decided it was not worth the breath. This one is quieter and more common than fear.'}]},

  {t:'content', eyebrow:'Part one, the real problem', h:'Most mistakes are system flaws, not bad people.',
   p:["When something goes wrong and the first move is to find who to blame, everyone learns the same lesson: hide the next one.",
      "A learning culture does the opposite. It treats a mistake, and every near miss, as information about the system, so the fix sticks and the reporting continues."]},

  {t:'content', eyebrow:'Part two, the method', h:'Four behaviors that drive out fear and futility.',
   p:["Psychological safety is not a poster or a value on the wall. It is built, or broken, by what leaders do in the small moments. Four behaviors do the work."]},

  {t:'behavior', eyebrow:'Behavior one', h:'Model',
   p:["You go first. You name your own mistake out loud, and you ask for the problem you would rather not hear. People match the level of candor you show, not the one you ask for."]},

  {t:'behavior', eyebrow:'Behavior two', h:'Encourage',
   p:['You actively invite the bad news and the half formed idea. You ask better questions than "any concerns?" and you make it normal to disagree before a decision, not after it fails.']},

  {t:'behavior', eyebrow:'Behavior three', h:'Enable',
   p:["You give people a safe, easy channel and the time to use it. If speaking up means a hard meeting or a long form, it will not happen. Lower the cost of saying something."]},

  {t:'behavior', eyebrow:'Behavior four', h:'Reward',
   p:["You respond so that speaking up was worth it. You thank the messenger, you act, and you close the loop out loud. Futility dies the moment people see that what they said changed something."]},

  {t:'two', eyebrow:'Part two, the method', h:'React less. Improve more.',
   intro:"Fear often hides inside the metrics. When every red number triggers a reaction, people learn to explain away the reds instead of surfacing the truth behind them.",
   boxes:[{h:'Noise', p:'Normal ups and downs. Reacting to it burns trust and teaches people to hide the next dip.'},
          {h:'Signal', p:'A real change worth acting on. You only see it clearly once you stop reacting to the noise.'}]},

  {t:'list', eyebrow:'Part three, what changes', h:'When the tax goes down, here is what you get back.',
   items:[{n:'&bull;', text:'Problems surface while they are still small and cheap to fix.'},
          {n:'&bull;', text:'Near misses get reported instead of buried, so the big failure never happens.'},
          {n:'&bull;', text:'Improvement sticks, because the people doing the work own it.'},
          {n:'&bull;', text:'You hear the thing you needed to hear, on time, from the person who knew.'}]},

  {t:'content', eyebrow:'Why listen to me', h:'I have spent twenty years on this.',
   p:["I am Mark Graban. I help leaders build workplaces where people speak up and improvement sticks, through Lean management, psychological safety, and better use of metrics.",
      "I have worked with hospitals, factories, and technology teams since 2005, and written three Shingo Award winning books, including The Mistakes That Make Us and Measures of Success. The Silence Tax is the work I am best known for."]},

  {t:'content', eyebrow:'Start small this week', h:'One question changes the room.',
   p:['In your next meeting, ask: "What is something we should be talking about that we are not?" Then stay quiet, and reward whoever is brave enough to answer.',
      "That one move, repeated, is where a speak-up culture starts."]},

  {t:'cta', eyebrow:'Work with me', h:'Bring this to your team.',
   p:["If you want to lower the silence tax in your organization, let's talk about where to start, whether that is a keynote, a workshop, or ongoing advising."],
   step:'<b>Next step:</b> Start a short, no obligation conversation about your current challenges at markgraban.com.',
   disclaimer:'This masterclass is educational. No specific result is guaranteed. Results vary based on your context, your leadership, and the work your team puts in.',
   pg:'The Silence Tax, Mark Graban'}
];

function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
const deck=document.getElementById('deck');
S.forEach(s=>{
  let inner='';
  if(s.eyebrow) inner+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.pill) inner+=`<span class="pill">${s.pill}</span>`;
  if(s.t==='title'){
    inner+=`<h1>${s.h}</h1><div class="rule"></div><p class="lead">${s.sub}</p><p class="note">${s.note}</p>`;
  } else if(s.t==='reframe'){
    inner+=`<div class="big">${s.big}</div><p class="note">${s.note}</p>`;
  } else if(s.t==='list'){
    inner+=`<h2>${s.h}</h2><ul>`+s.items.map(i=>`<li><span class="n">${i.n}</span>${i.text}</li>`).join('')+`</ul>`;
  } else if(s.t==='behavior'){
    inner+=`<h2>${s.h}</h2><div class="rule"></div>`+s.p.map(x=>`<p>${x}</p>`).join('');
  } else if(s.t==='two'){
    inner+=`<h2>${s.h}</h2><p>${s.intro}</p><div class="two">`+s.boxes.map(b=>`<div class="box"><h3>${b.h}</h3><p>${b.p}</p></div>`).join('')+`</div>`;
  } else if(s.t==='cta'){
    inner+=`<h1>${s.h}</h1><div class="rule"></div>`+s.p.map(x=>`<p>${x}</p>`).join('')+`<div class="step">${s.step}</div><p class="disclaimer">${s.disclaimer}</p><div class="pg">${s.pg}</div>`;
  } else {
    inner+=`<h2>${s.h}</h2>`+s.p.map(x=>`<p>${x}</p>`).join('');
  }
  const sec=el(`<section class="slide">${inner}</section>`);
  deck.appendChild(sec);
});
</script>
</body>
</html>
