<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inner Shift, a masterclass with Charlotte Ferreux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Chivo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfcfc;        /* her light scheme */
    --paper:#f7f7f8;     /* body ground */
    --panel:#ecf0f1;     /* her light-grey panel */
    --rule:#ebe8de;      /* her warm-beige rule */
    --ink:#2c3e50;       /* her footer slate, dominant dark */
    --muted:#6c6c6c;     /* her body grey */
    --accent:#c1ff72;    /* her signature lime */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Chivo",system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:980px}
  .slide.on{display:block;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-family:"Sora",sans-serif;font-weight:700;font-size:clamp(34px,6vw,64px);line-height:1.05;letter-spacing:-.01em}
  h2{font-family:"Sora",sans-serif;font-weight:700;font-size:clamp(26px,4.2vw,44px);line-height:1.12}
  .eyebrow{font-family:"Sora",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:var(--muted);margin-bottom:22px}
  .lead{font-size:clamp(18px,2.4vw,25px);line-height:1.5;color:var(--ink);font-weight:300;margin-top:22px;max-width:42ch}
  .muted{color:var(--muted)}
  .mark{background:linear-gradient(transparent 62%, var(--accent) 62%);padding:0 .06em}
  .chip{display:inline-block;background:var(--accent);color:var(--ink);font-family:"Sora",sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;padding:6px 14px;border-radius:999px;text-transform:uppercase}
  .part{font-family:"Sora",sans-serif;font-weight:600;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:15px}
  .pillar-no{font-family:"Sora",sans-serif;font-weight:700;font-size:16px;color:var(--ink);background:var(--accent);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:16px;padding:30px 32px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
  .grid .card .k{font-family:"Sora",sans-serif;font-weight:700;font-size:19px}
  .grid .card p{color:var(--muted);font-size:15px;line-height:1.5;margin-top:8px}
  .disc{color:var(--muted);font-size:13px;line-height:1.55;margin-top:26px;max-width:62ch}
  .by{color:var(--muted);margin-top:30px;font-family:"Sora",sans-serif;letter-spacing:.06em}
  ul{margin-top:22px;list-style:none}
  li{font-size:clamp(17px,2.1vw,22px);line-height:1.5;padding-left:26px;position:relative;margin-bottom:14px;font-weight:300}
  li::before{content:"";position:absolute;left:0;top:.6em;width:12px;height:12px;background:var(--accent);border-radius:3px}
  .foot{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 7vw;font-family:"Sora",sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .nav{position:fixed;bottom:16px;right:7vw;display:flex;gap:8px;z-index:5}
  .nav button{font-family:"Sora",sans-serif;border:1px solid var(--rule);background:var(--bg);color:var(--ink);width:38px;height:38px;border-radius:9px;cursor:pointer;font-size:16px}
  .nav button:hover{background:var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<div class="foot"><span>Charlotte Ferreux</span><span>IN Mastery&trade;</span></div>
<div class="nav"><button id="prev" aria-label="previous">&larr;</button><button id="next" aria-label="next">&rarr;</button></div>
<script>
const S=[
 {t:"title", chip:"A live masterclass",
  h:'The Inner Shift.<br>Why high performers plateau, and how to <span class="mark">break the ceiling for good</span>.',
  lead:"For leaders, entrepreneurs and high achievers who have already built success and can feel the next level asking for something more than more effort.",
  by:"With Charlotte Ferreux &middot; IN Mastery&trade;"},

 {t:"list", eyebrow:"Who this is for",
  h:"You are already successful. That is exactly why this matters.",
  items:["You have hit the goals, built the thing, earned the title.",
         "And a quiet ceiling keeps showing up at the same level.",
         "The old answer was always do more, push harder, optimise further.",
         "It is working less and costing more every year."]},

 {t:"lead", eyebrow:"The trap",
  h:"More strategy on top of a maxed-out system just burns the system.",
  lead:"You do not have a knowledge problem. You have read the books, hired the strategists, run the plans. The strategy is not the bottleneck anymore. You are performing at the edge of who you currently are, and that edge is the real ceiling."},

 {t:"big", chip:"The reframe",
  h:'Lasting success does not come from doing more.<br>It comes from <span class="mark">shifting from within</span>.',
  lead:"When you shift from within, your external results recalibrate permanently. The inside is the lever. Everything outside is the readout."},

 {t:"part", n:"Part One", h:"The ceiling is real. The reason is not where you are looking."},

 {t:"lead", eyebrow:"The core problem",
  h:"Your ceiling is set by your identity, your nervous system, and your subconscious.",
  lead:"Not by your calendar or your tactics. Those three run underneath every decision you make, and they will quietly pull you back to the level they were built for, no matter how good the plan on top is."},

 {t:"list", eyebrow:"Why willpower stalls",
  h:"Force moves you for a quarter. Identity holds you for a decade.",
  items:["Push from pressure and the body keeps score. Burnout is the bill.",
         "Old beliefs run faster than new goals. The subconscious always wins the race.",
         "Regulate the system first and the same effort suddenly carries further."]},

 {t:"part", n:"Part Two", h:"The IN Mastery Method: four pillars that move the ceiling."},

 {t:"pillar", no:"1", k:"Optimal Performance & Alignment",
  p:"You build mental, physical, emotional and spiritual performance through discipline and aligned execution. The work still gets done. It gets done from alignment instead of force."},

 {t:"pillar", no:"2", k:"Energetics",
  p:"You regulate the nervous system so decisions get made from power, not pressure. A regulated leader reads the room, holds the hard conversation, and chooses clean under load."},

 {t:"pillar", no:"3", k:"Subconscious Reprogramming",
  p:"You rewire the unconscious beliefs and identity patterns that quietly set your ceiling. Change the identity and the behaviour follows on its own."},

 {t:"pillar", no:"4", k:"Influence & Leadership Mastery",
  p:"You develop communication and embodied authority so you lead from presence. People move because of who you are being, not because of how hard you are pushing."},

 {t:"grid", eyebrow:"How they work together", h:"Four pillars, one integrated system.",
  cards:[{k:"Alignment", p:"Action from alignment, not force."},
         {k:"Energetics", p:"Decisions from power, not pressure."},
         {k:"Reprogramming", p:"A new identity under the behaviour."},
         {k:"Leadership", p:"Authority that comes from presence."}]},

 {t:"part", n:"Part Three", h:"Where leaders land once the inner system is rebuilt."},

 {t:"lead", eyebrow:"On the other side",
  h:"Your life, leadership and work become a natural expression of who you are.",
  lead:"Not something you have to push, hustle or prove. The results still come. They stop costing you the nervous system you need to enjoy them, and they stop sliding back to the old ceiling."},

 {t:"lead", eyebrow:"Why this approach",
  h:"Performance frameworks, met with the inner work most coaching skips.",
  lead:"IN Mastery&trade; blends proven high-performance frameworks with advanced work in subconscious reprogramming, mindset, energetics and healing. It is built for leaders who are done choosing between results and wholeness, and want both to hold permanently."},

 {t:"list", eyebrow:"The shift, in one breath",
  h:"Shift from within. Watch the outside recalibrate.",
  items:["The ceiling is an inner system, not a strategy gap.",
         "Four pillars move the system: Alignment, Energetics, Reprogramming, Leadership.",
         "Move the inside once and the results hold on their own."]},

 {t:"cta", chip:"Your next step",
  h:"Ready to do the inner work behind the next level?",
  lead:"Book a connect call to see if IN Mastery Coaching is the right container for you. We will map where your current ceiling is set and what shifting it would actually look like.",
  disc:"This masterclass is educational. No income, performance, or result is guaranteed. Results vary from person to person and depend on you and your circumstances."}
];

function render(s){
 if(s.t==="title") return `<div class="slide"><div class="chip">${s.chip}</div><h1 style="margin-top:26px">${s.h}</h1><p class="lead">${s.lead}</p><p class="by">${s.by}</p></div>`;
 if(s.t==="part") return `<div class="slide"><p class="part">${s.n}</p><h1 style="margin-top:18px">${s.h}</h1></div>`;
 if(s.t==="lead") return `<div class="slide"><p class="eyebrow">${s.eyebrow}</p><h2>${s.h}</h2><p class="lead">${s.lead}</p></div>`;
 if(s.t==="big") return `<div class="slide"><div class="chip">${s.chip}</div><h1 style="margin-top:24px">${s.h}</h1><p class="lead">${s.lead}</p></div>`;
 if(s.t==="list") return `<div class="slide"><p class="eyebrow">${s.eyebrow}</p><h2>${s.h}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
 if(s.t==="pillar") return `<div class="slide"><div class="pillar-no">${s.no}</div><h2>${s.k}</h2><p class="lead">${s.p}</p></div>`;
 if(s.t==="grid") return `<div class="slide"><p class="eyebrow">${s.eyebrow}</p><h2>${s.h}</h2><div class="grid">${s.cards.map(c=>`<div class="card"><div class="k">${c.k}</div><p>${c.p}</p></div>`).join("")}</div></div>`;
 if(s.t==="cta") return `<div class="slide"><div class="chip">${s.chip}</div><h1 style="margin-top:24px">${s.h}</h1><p class="lead">${s.lead}</p><p class="disc">${s.disc}</p></div>`;
 return `<div class="slide"></div>`;
}
const stage=document.getElementById("stage");let i=0;
function show(){stage.innerHTML=render(S[i]);stage.firstChild.classList.add("on");}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));show();}
document.getElementById("next").onclick=()=>go(1);
document.getElementById("prev").onclick=()=>go(-1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" ")go(1);if(e.key==="ArrowLeft")go(-1);});
show();
</script>
</body>
</html>
