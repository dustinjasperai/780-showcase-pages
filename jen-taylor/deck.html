<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Your Business Around How You're Designed to Work — Jen Taylor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#063d2a; --panel:#0b4d35; --green2:#3fb98a; --gold:#cdb26d;
  --ink:#f3ede0; --muted:#bcccc0; --rule:#1c6346;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#03281b;font-family:'Montserrat',sans-serif;color:var(--ink);padding:40px 16px}
.slide{
  width:960px;max-width:100%;min-height:540px;margin:0 auto 34px;background:var(--bg);
  border:1px solid var(--rule);border-radius:8px;padding:68px 76px;position:relative;
  display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  box-shadow:0 12px 36px rgba(0,0,0,.28);
}
.slide:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gold)}
.kick{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:22px}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:56px;line-height:1.06;color:var(--ink);letter-spacing:.2px}
h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;line-height:1.12;color:var(--gold);margin-bottom:18px}
.lead{font-size:20px;line-height:1.55;color:var(--ink);max-width:40ch;margin-top:20px;font-weight:300}
.sub{font-size:17px;line-height:1.6;color:var(--muted);max-width:52ch;margin-top:16px;font-weight:300}
.big{font-family:'Cormorant Garamond',serif;font-size:46px;line-height:1.14;color:var(--ink);font-weight:500;max-width:24ch}
.big .a{color:var(--green2);font-style:italic}
ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px;max-width:60ch}
li{font-size:18px;line-height:1.5;padding-left:26px;position:relative;font-weight:400;color:var(--ink)}
li:before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;background:var(--gold);border-radius:50%}
li b{color:var(--green2);font-weight:600}
.step{display:flex;gap:20px;align-items:baseline}
.stepno{font-family:'Cormorant Garamond',serif;font-size:66px;color:var(--gold);font-weight:700;line-height:1;min-width:84px}
.flow{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.flow span{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--ink);border:1px solid var(--gold);border-radius:40px;padding:8px 22px;background:var(--panel)}
.four{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
.four div{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:22px 24px}
.four h3{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:26px;font-weight:600;margin-bottom:6px}
.four p{font-size:15px;color:var(--muted);line-height:1.5;font-weight:300}
.pagenum{position:absolute;right:28px;bottom:20px;font-size:12px;letter-spacing:.18em;color:var(--muted)}
.foot{position:absolute;left:76px;bottom:22px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.disc{font-size:13px;color:var(--muted);line-height:1.55;margin-top:22px;max-width:58ch;font-weight:300}
.cta h1{font-size:50px}
.me{font-size:16px;line-height:1.6;color:var(--ink);max-width:54ch;margin-top:18px;font-weight:300}
.quote{font-family:'Cormorant Garamond',serif;font-size:40px;font-style:italic;color:var(--gold);line-height:1.2;max-width:26ch}
@media(max-width:700px){.slide{padding:44px 30px}h1{font-size:38px}.big{font-size:32px}.four{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">A Live Masterclass with Jen Taylor</div>
    <h1>Design Your Business Around How You're Designed to Work</h1>
    <p class="lead">For the established woman entrepreneur whose business is working, but no longer works the way she wants to run it.</p>
    <div class="foot">Jen Taylor Consulting</div>`},

  {t:'who', cls:'', html:`
    <div class="kick">Who this is for</div>
    <h2>You already proved it can work.</h2>
    <ul>
      <li>Your business is successful, but maintaining it takes too much of you.</li>
      <li>You've outgrown your offers, your schedule, or your role.</li>
      <li>You want to work less without automatically assuming that means earning less.</li>
      <li>You're tired of forcing yourself into someone else's business strategy.</li>
    </ul>`},

  {t:'trap', cls:'', html:`
    <div class="kick">The trap</div>
    <p class="big">You did everything the experts told you to do. So why does it still feel <span class="a">wrong</span>?</p>
    <p class="sub">More revenue, a bigger team, another funnel. Each one added weight instead of freedom. The to-do list never ends, and every decision still runs through you.</p>`},

  {t:'reframe', cls:'', html:`
    <div class="kick">The reframe</div>
    <p class="big">The strategy wasn't broken. It was just built for someone else's <span class="a">design</span>.</p>
    <p class="sub">A business can be profitable and still be completely wrong for the person running it. There isn't one right way to build a business. There's a right way to design yours.</p>`},

  {t:'part', cls:'', html:`
    <div class="kick">Part One</div>
    <h1>The core problem</h1>
    <p class="lead">You are running a version of your business you never actually chose. You inherited it, one "should" at a time.</p>`},

  {t:'problem', cls:'', html:`
    <div class="kick">What it costs</div>
    <h2>Being the person every decision depends on.</h2>
    <ul>
      <li><b>Your energy</b> goes to work that drains you, not the work that lights you up.</li>
      <li><b>Your calendar</b> belongs to the business instead of the other way around.</li>
      <li><b>Your growth</b> keeps meaning "more", when what you want is "better".</li>
    </ul>`},

  {t:'question', cls:'', html:`
    <div class="kick">The first question</div>
    <p class="quote">What do you want your business to make possible?</p>
    <p class="sub">Not what should you sell, or when should you scale. The honest version. Everything we design starts here.</p>`},

  {t:'part', cls:'', html:`
    <div class="kick">Part Two</div>
    <h1>The Design Your Business Method</h1>
    <p class="lead">Five steps to redesign a business that already works, without blowing it up and starting over.</p>
    <div class="flow"><span>Align</span><span>Audit</span><span>Architect</span><span>Activate</span><span>Expand</span></div>`},

  {t:'step', cls:'', html:`
    <div class="kick">Step One</div>
    <div class="step"><div class="stepno">01</div><div><h2>Align</h2><p class="sub">Get clear on what you actually want the business to make possible. Choice, freedom, meaningful work, a life outside of it. We define success on your terms before touching a single tactic.</p></div></div>`},

  {t:'step', cls:'', html:`
    <div class="kick">Step Two</div>
    <div class="step"><div class="stepno">02</div><div><h2>Audit</h2><p class="sub">Step out of the business long enough to see it. We look at offers, revenue, the client journey, operations, schedule, capacity, and team, and name what deserves your attention, what can be simplified, and what may need to go.</p></div></div>`},

  {t:'step', cls:'', html:`
    <div class="kick">Step Three</div>
    <div class="step"><div class="stepno">03</div><div><h2>Architect</h2><p class="sub">Design the next version on purpose. The offers, the structure, the role you play. We build the plan around how you are wired to work, not around someone else's template for success.</p></div></div>`},

  {t:'step', cls:'', html:`
    <div class="kick">Step Four</div>
    <div class="step"><div class="stepno">04</div><div><h2>Activate</h2><p class="sub">Implement the changes while the business keeps running, at a pace that supports both the business and the person running it. No burning it down. No six months of chaos.</p></div></div>`},

  {t:'step', cls:'', html:`
    <div class="kick">Step Five</div>
    <div class="step"><div class="stepno">05</div><div><h2>Expand</h2><p class="sub">Grow from a foundation that fits you. A profitable, sustainable business that gives you more of what you built it for in the first place, instead of more to manage.</p></div></div>`},

  {t:'part', cls:'', html:`
    <div class="kick">Part Three</div>
    <h1>Business Intuitive Coaching</h1>
    <p class="lead">Why this works when generic business advice stops being enough. We bring four things together.</p>`},

  {t:'four', cls:'', html:`
    <div class="kick">The four inputs</div>
    <h2>Understand you, then design the business.</h2>
    <div class="four">
      <div><h3>Human Design</h3><p>How you are naturally designed to make decisions, use your energy, communicate, and lead.</p></div>
      <div><h3>Intuition</h3><p>Paying attention to what you already know, but learned to ignore because it didn't match the advice.</p></div>
      <div><h3>Strategy</h3><p>Where you are going, what deserves your attention, and which decisions move you toward the business you want.</p></div>
      <div><h3>Systems</h3><p>The structure, processes, boundaries, and delegation that turn decisions into something sustainable.</p></div>
    </div>`},

  {t:'hd', cls:'', html:`
    <div class="kick">On Human Design</div>
    <p class="quote">This isn't about letting your chart run your business.</p>
    <p class="sub">It's about understanding yourself well enough to build strategies that work with you instead of against you. How you decide, how you use energy, how you lead, and how you recognize the opportunities that are actually right for you.</p>`},

  {t:'picture', cls:'', html:`
    <div class="kick">The redesign</div>
    <h2>A business that works the way you want to run it.</h2>
    <ul>
      <li>Fewer offers, or fewer clients at a higher level of service.</li>
      <li>You out of the day-to-day and further into the CEO seat.</li>
      <li>Systems and structure without a rigid business.</li>
      <li>More space in your schedule, and a business that supports your life instead of competing with it.</li>
    </ul>`},

  {t:'me', cls:'', html:`
    <div class="kick">Why me</div>
    <h2>Jen Taylor</h2>
    <p class="me">Business Intuitive Coach, Certified Director of Operations, and creator of the Design Your Business Method. More than two decades building and running a business in the wedding and events industry taught me what it actually takes to grow, evolve, and lead. Today I help established women entrepreneurs combine Human Design, intuition, strategy, and systems to design businesses around how they want to work, lead, and live.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h1>Start with a conversation.</h1>
    <p class="lead">Book a complimentary Business Call and we'll explore what's working, what's not, and what your business needs next.</p>
    <p class="disc">Educational only. This session shares a framework and approach; it is not business, financial, or legal advice. No income, role, or result is guaranteed, and outcomes vary from one business to the next.</p>
    <div class="foot">jentaylorconsulting.com</div>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'slide ' + (s.cls||'');
  d.innerHTML = s.html + '<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(d);
});
</script>
</body>
</html>
