<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Report Card Assessment Masterclass · Eric Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f8f8; --panel:#ffffff; --rule:#dbe4e6;
    --acc:#2e5b73; --idx:#338854; --chalk:#1c2528; --grey:#45565c; --dim:#7e9096;
  }
  html,body{height:100%}
  body{background:#12181a;font-family:'Rubik',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#12181a}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Poppins',Georgia,serif;font-weight:600;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.9vw;max-width:88%}
  .t-normal h1{font-size:3.1vw;max-width:84%}
  .t-normal .body{font-family:'Rubik',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-family:'Rubik',sans-serif;font-size:1.75vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Rubik',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:linear-gradient(160deg,#1f2d33 0%,#10171a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:86%;font-style:italic;color:#f5f8f8}
  .t-cta{background:linear-gradient(160deg,#1f2d33 0%,#10171a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:82%;color:#f5f8f8}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#bcd4de;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .t-dark .disc,.t-cta .disc{color:#8fa3aa}
  .bench-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-bench{right:6.5%;bottom:7%;width:21vw}
  .corner-bench{right:5.5%;bottom:6.5%;width:9.5vw;opacity:.45}
  .brandline{font-family:'Rubik',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#a8bcc2;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a8bcc2;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#a8bcc2;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">STARFISH COACHING</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- benchmark motif: a scorecard benchmark line with tick marks and a highlighted marker, echoing the Report Card Assessment -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="bench" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="232" height="122" stroke="#2e5b73" opacity="0.22"/>
    <line x1="34" y1="100" x2="226" y2="100" stroke="#2e5b73" opacity="0.55"/>
    <line x1="54" y1="92" x2="54" y2="108" stroke="#2e5b73" opacity="0.5"/>
    <line x1="98" y1="92" x2="98" y2="108" stroke="#2e5b73" opacity="0.5"/>
    <line x1="142" y1="92" x2="142" y2="108" stroke="#2e5b73" opacity="0.5"/>
    <line x1="186" y1="92" x2="186" y2="108" stroke="#2e5b73" opacity="0.5"/>
    <circle cx="142" cy="100" r="8" fill="#338854" opacity="0.9"/>
    <line x1="142" y1="60" x2="142" y2="90" stroke="#338854" opacity="0.75"/>
    <line x1="134" y1="60" x2="150" y2="60" stroke="#338854" opacity="0.75"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Report Card Assessment Masterclass',sub:'A masterclass for owners of general contracting, remodeling, and custom home-building firms.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You know how to build. Diagnosing the business is a different skill.',body:'Bidding, crews, schedules, margins on paper. None of that tells you which part of the business is actually costing you money. Most owners guess at the fix instead of measuring the problem first.'},
 {t:'dark',title:'Guessing at the fix before you have measured the problem is how good contractors stay stuck.'},

 {t:'section',idx:'Part One',title:'The Trap'},
 {t:'normal',k:'The default move',title:'Most owners jump straight to a fix.',body:'Hire another PM. Raise prices. Cut a slow-paying client. Each move might be right, or it might treat a symptom while the real leak stays open. Without a benchmark, there is no way to know which.'},
 {t:'normal',k:'The cost of guessing',title:'A wrong fix costs a year you cannot get back.',body:'Fix the wrong thing and the business looks the same twelve months later, just with a new problem on top of the old one. The fix that works starts with knowing exactly where the business is losing ground.'},
 {t:'dark',title:'A full pipeline does not mean a healthy business. It means a busy one.'},

 {t:'section',idx:'Part Two',title:'The Report Card Assessment'},
 {t:'normal',k:'Benchmark first',title:'The Report Card Assessment: a business measured against real benchmarks.',body:'Every part of the business, pricing, ops, sales, team, client relationships, scored against a benchmark before anything gets recommended. The diagnosis comes first. The plan comes second.'},
 {t:'normal',k:'Build the plan',title:'Custom Tailor: a plan made to measure, never off the rack.',body:'Once the Report Card is done, the plan gets built for that one business, not applied from a franchise curriculum. Crew size, backlog, region, and margin structure differ for every contractor, so the plan has to as well.'},
 {t:'normal',k:'Keep it moving',title:'Goals Lab: accountability so the plan does not go stale.',body:'A recurring accountability structure that keeps the goals from the Custom Tailor plan on track between sessions, instead of getting filed away after the first month.'},
 {t:'dark',title:'A plan without a diagnosis is a guess with better formatting.'},

 {t:'section',idx:'Part Three',title:'A Business Diagnosed Correctly'},
 {t:'normal',k:'The business this builds',title:'A contracting business that knows exactly where it is bleeding, and why.',body:'Every category benchmarked. A plan built for the business in front of you, not a template. Progress tracked against the goals the Report Card actually surfaced.'},
 {t:'dark',title:'The contractors who grow are not the ones who work harder. They are the ones who fix the right thing first.'},
 {t:'normal',k:'Why Eric Lee',title:'Founded 8+ companies himself, not just coached them.',body:'Eric Lee is CEO and Design Director of VictorEric Group, a 55-person design-build firm, and has founded 8+ companies, 4 of which he still actively runs. Featured in Yahoo Finance and GlobeNewswire, with over a decade of coaching experience and 60+ five-star Google reviews.'},

 {t:'section',idx:'Your Next Step',title:'Get An Honest Read On Your Business Before You Get A Plan For It'},
 {t:'normal',k:'Start with the discovery call',title:'The free 30-minute discovery consultation.',body:'A conversation about where your business stands today and what a Report Card Assessment and a Custom Tailor plan would look like applied to it.'},
 {t:'normal',k:'Go deeper',title:'Self Sustaining Business Training and Goals Lab.',body:'An 8-module program for running the business independent of your daily involvement, plus the Goals Lab for ongoing accountability once the plan is in motion.'},
 {t:'cta',title:'Ready to find out what your Report Card would actually say?',chips:['Take the free discovery call','Explore Self Sustaining Business Training'],disc:'Educational content for general contracting, remodeling, and custom home-building business owners. No income, growth, or result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function bench(kind){return `<svg class="bench-motif ${kind==='title'?'title-bench':'corner-bench'}"><use href="#bench"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Starfish Coaching <b>&middot; Report Card Assessment</b> &middot; Eric Lee</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=bench(s.arc);
  else if(s.t==='title') h+=bench('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
