<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Why That Lasts | A Masterclass with Anne Luke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Besley:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f4efe4;
    --panel:#fffdf7;
    --rule:#e4dcc9;
    --ink:#161e2a;
    --ink-soft:#2c3e50;
    --muted:#6b6b6b;
    --accent:#c4731f;
  }
  html,body{height:100%;}
  body{
    font-family:'Besley',Georgia,serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  #stage{width:min(960px,94vw);aspect-ratio:16/9;background:var(--panel);
    border:1px solid var(--rule);box-shadow:0 18px 50px rgba(22,30,42,.10);
    position:relative;overflow:hidden;}
  .slide{position:absolute;inset:0;padding:7% 8%;display:none;flex-direction:column;justify-content:center;}
  .slide.on{display:flex;}
  .kicker{font-family:'Montserrat',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(28px,4.6vw,52px);
    line-height:1.08;letter-spacing:-.01em;color:var(--ink);}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(22px,3.3vw,36px);
    line-height:1.15;color:var(--ink);margin-bottom:18px;}
  .lead{font-size:clamp(17px,2vw,23px);line-height:1.5;color:var(--ink-soft);margin-top:18px;max-width:40ch;}
  p.body{font-size:clamp(15px,1.7vw,20px);line-height:1.55;color:var(--ink-soft);margin-top:12px;max-width:52ch;}
  ul{list-style:none;margin-top:14px;}
  li{font-size:clamp(15px,1.7vw,20px);line-height:1.5;color:var(--ink-soft);padding-left:26px;position:relative;margin:10px 0;max-width:50ch;}
  li::before{content:"";position:absolute;left:0;top:.62em;width:10px;height:2px;background:var(--accent);}
  .steps{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
  .step{font-family:'Montserrat',sans-serif;font-weight:600;font-size:13px;color:var(--ink);
    border:1px solid var(--rule);border-left:3px solid var(--accent);padding:8px 14px;background:var(--bg);}
  .big{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(40px,8vw,96px);color:var(--accent);line-height:1;}
  .sub{font-family:'Montserrat',sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-top:14px;}
  .by{font-family:'Montserrat',sans-serif;font-weight:600;font-size:14px;color:var(--muted);margin-top:28px;}
  .disc{font-family:'Montserrat',sans-serif;font-size:12px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:56ch;}
  .cta-line{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(18px,2.2vw,26px);
    color:var(--ink);margin-top:16px;border-top:2px solid var(--accent);padding-top:16px;display:inline-block;}
  #nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;
    font-family:'Montserrat',sans-serif;font-size:13px;color:var(--muted);}
  #nav button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--rule);
    padding:6px 14px;cursor:pointer;}
  #nav button:hover{border-color:var(--accent);color:var(--accent);}
  .count{font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">Prev</button><span class="count"><span id="cur">1</span> / <span id="tot">1</span></span><button id="next">Next</button></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass for parents', h:'Find the Why That Lasts',
   lead:'How to help your teenager build an internal drive that outlasts the pressure, not just gets through the week.', by:'with Anne Luke'},

  {t:'who', kicker:'Who this is for', h:'If this sounds like your house',
   bullets:['You have a capable teen who seems to be running on fumes, deadlines and your reminders.','You have pushed, bribed, lectured and gone quiet, and nothing sticks for long.','You want them to want it, not just do it because you asked.']},

  {t:'trap', kicker:'The trap', h:'Borrowed motivation always runs out',
   body:'Most teens today are powered by outside pressure: grades, rankings, a parent standing behind them. It works until the parent is not in the room. Then the effort stops, because it was never theirs to begin with.'},

  {t:'hook', kicker:'The reframe', h:'Your teen is not unmotivated',
   lead:'They are running on a motivation that belongs to someone else. The job is not more pressure. It is helping them find a reason that is their own.'},

  {t:'cost', kicker:'What it costs', h:'The quiet cost of borrowed drive',
   body:'A teen who only performs for approval learns to read the room instead of reading themselves. They get good at looking fine. The anxiety, the burnout and the sudden loss of interest show up later, usually right when the stakes get real.'},

  {t:'part', kicker:'Part one', h:'The core problem',
   body:'In modern performance culture, a teen learns to perform for approval long before they ever ask what they actually want. So the drive is fragile. The first real setback, a bad grade, a lost spot, a hard season, and it collapses, because there is no inner reason holding it up.'},

  {t:'part', kicker:'Part one', h:'Why the usual fixes backfire',
   bullets:['Rewards teach them to work for the reward, then stop when it is gone.','Pressure teaches them to avoid your disappointment, not to pursue anything.','Rescuing teaches them that someone else will carry the weight.']},

  {t:'part', kicker:'Part two', h:'The Why framework',
   body:'Over 25,000 conversations with teens and parents, one pattern held: the teens who kept going had found their own "why", the internal reason that fuels ambition and meaningful success. Here is how we help them find it.'},

  {t:'framework', kicker:'Part two', h:'The six outcomes we build toward',
   steps:['Personal Responsibility','Autonomy','Self-Mastery','Resilience','Character','Strength'],
   body:'This is the arc from adolescence to a self-directed young adult. Each stage is teachable, and each one has to be built in order.'},

  {t:'pillar', kicker:'Step one', h:'Personal responsibility',
   body:'Before a teen can own their future, they own their day. Small, kept promises to themselves are where real self-trust starts, long before any big goal.'},

  {t:'pillar', kicker:'Step two', h:'Autonomy and self-mastery',
   body:'They learn to make a decision, sit with the discomfort, and follow through without a parent managing it. This is where the drive stops being yours and starts being theirs.'},

  {t:'pillar', kicker:'Step three', h:'Resilience you can repeat',
   bullets:['Emotional mastery: naming what they feel instead of being run by it.','Values clarification: knowing what actually matters to them.','Stress management and growth mindset: a setback becomes information, not a verdict.']},

  {t:'pillar', kicker:'Step three', h:'A resilience they can channel anywhere',
   body:'The point is a repeatable framework that shows them how to find their most resilient self in any situation, the exam, the tryout, the hard conversation, not just the one we practiced.'},

  {t:'part', kicker:'Part three', h:'What changes at home',
   bullets:['The nagging drops, because the reason to act is now inside them.','They start initiating, finishing, and recovering from setbacks on their own.','You go back to being their parent instead of their project manager.']},

  {t:'looks', kicker:'Part three', h:'What the work actually looks like',
   body:'One-on-one coaching sessions over twelve weeks, built around your teen, with tools they keep using after we are done. Parents stay in the loop without having to run the program.'},

  {t:'parent', kicker:'Your part', h:'Your job changes too',
   body:'You do not have to run the program or become the coach. Your job is to stop being the source of the pressure and start being the steady adult who believes they can carry it. We show you exactly where to step back and where to stay close.'},

  {t:'why', kicker:'Why me', h:'Who is guiding this',
   bullets:['Over 25,000 real conversations with high schoolers and their parents.','A master’s in counseling, and two decades leading an education company helping teens own their future.','A former Division I athlete who knows what internal drive under pressure feels like.']},

  {t:'why', kicker:'The promise', h:'A drive they do not have to be reminded to use',
   lead:'When a teen finds their own why, you stop being the engine. They do. That is the whole point.'},

  {t:'cta', kicker:'Your next step', h:'Work with Anne',
   body:'If you want this for your teen, the next step is a conversation. We look at where your teen is, whether this is the right fit, and what the twelve weeks would look like for them.',
   cta:'Apply for the 12-Week Resiliency Challenge',
   disc:'Educational only. No specific outcome or result is guaranteed. Every teen is different and results vary with effort, fit and circumstances.'}
];

const stage=document.getElementById('stage');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function render(sl){
  let h='';
  if(sl.kicker)h+='<div class="kicker">'+esc(sl.kicker)+'</div>';
  if(sl.t==='title'){h+='<h1>'+esc(sl.h)+'</h1>';if(sl.lead)h+='<div class="lead">'+esc(sl.lead)+'</div>';if(sl.by)h+='<div class="by">'+esc(sl.by)+'</div>';}
  else if(sl.t==='framework'){h+='<h2>'+esc(sl.h)+'</h2>';if(sl.steps){h+='<div class="steps">';sl.steps.forEach(function(s){h+='<span class="step">'+esc(s)+'</span>';});h+='</div>';}if(sl.body)h+='<p class="body">'+esc(sl.body)+'</p>';}
  else if(sl.t==='cta'){h+='<h2>'+esc(sl.h)+'</h2>';if(sl.body)h+='<p class="body">'+esc(sl.body)+'</p>';if(sl.cta)h+='<div class="cta-line">'+esc(sl.cta)+'</div>';if(sl.disc)h+='<div class="disc">'+esc(sl.disc)+'</div>';}
  else{h+='<h2>'+esc(sl.h)+'</h2>';if(sl.lead)h+='<div class="lead">'+esc(sl.lead)+'</div>';if(sl.body)h+='<p class="body">'+esc(sl.body)+'</p>';if(sl.bullets){h+='<ul>';sl.bullets.forEach(function(b){h+='<li>'+esc(b)+'</li>';});h+='</ul>';}}
  return h;
}
let i=0;
stage.innerHTML=S.map(function(sl){return '<div class="slide">'+render(sl)+'</div>';}).join('');
const slides=stage.querySelectorAll('.slide');
document.getElementById('tot').textContent=S.length;
function show(n){i=Math.max(0,Math.min(S.length-1,n));slides.forEach(function(s,k){s.classList.toggle('on',k===i);});document.getElementById('cur').textContent=i+1;}
document.getElementById('next').onclick=function(){show(i+1);};
document.getElementById('prev').onclick=function(){show(i-1);};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
stage.addEventListener('click',function(e){if(e.clientX< window.innerWidth/2)show(i-1);else show(i+1);});
show(0);
</script>
</body>
</html>
