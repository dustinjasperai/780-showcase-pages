<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Repeatable Revenue System — Ray J. Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141d33;        /* deepened derivative of brand navy #1e2b58 */
    --panel:#1e2b58;     /* brand navy, verbatim */
    --rule:#2c3a63;      /* tint between panel and accent */
    --accent:#1f92d1;    /* brand dominant blue, verbatim */
    --ink:#eef3fb;
    --muted:#9fb0cf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c1322;color:var(--ink);font-family:'Montserrat',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 18px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 52px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:'Bebas Neue',sans-serif;letter-spacing:.22em;color:var(--accent);font-size:18px;text-transform:uppercase;margin-bottom:18px}
  h1{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.01em;font-size:68px;line-height:.98;margin-bottom:20px}
  h2{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.01em;font-size:46px;line-height:1.02;margin-bottom:18px}
  p{font-size:20px;color:var(--ink);margin-bottom:14px;max-width:42ch}
  p.lead{font-size:23px;color:var(--muted)}
  .sub{font-size:19px;color:var(--muted);max-width:52ch}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative;max-width:50ch}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  li:last-child{border-bottom:none}
  .big{font-family:'Bebas Neue',sans-serif;font-size:120px;color:var(--accent);line-height:.9;margin-bottom:10px}
  .panel{background:var(--panel);border-radius:10px;padding:26px 28px;margin-top:14px}
  .tag{display:inline-block;font-family:'Bebas Neue',sans-serif;letter-spacing:.16em;color:var(--bg);background:var(--accent);padding:5px 14px;border-radius:6px;font-size:16px;margin-bottom:20px;text-transform:uppercase}
  .cta{font-size:22px;color:var(--ink)}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .pagenum{position:absolute;right:28px;bottom:20px;font-family:'Bebas Neue',sans-serif;color:var(--rule);font-size:20px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Ray J. Green',
    h:'The Repeatable Revenue System',
    sub:'How founder-led B2B service companies and MSPs build a sales engine that runs without the owner in every deal.' },

  {t:'who', eyebrow:'Who this is for',
    h:'You built the business. Now it needs you in every sale.',
    bullets:['You run a B2B service company or an MSP doing real revenue','You are still the best (and often the only) salesperson','Growth feels like it depends on how many hours you personally sell','You want the business to be worth more than your calendar'] },

  {t:'trap', eyebrow:'The trap',
    h:'More leads is the wrong first move.',
    sub:'When sales runs through the founder, pouring leads on top just means more deals waiting on you. The bottleneck is not demand. It is that the selling has never been turned into a system anyone else can run.' },

  {t:'reframe', eyebrow:'The reframe',
    h:'Revenue that depends on you is not an asset. It is a job.',
    sub:'A business that cannot sell without the founder has a ceiling, and that ceiling is your personal bandwidth. The goal of this session is to lift the selling off you and into a repeatable system.' },

  {t:'part', tag:'Part One', h:'The real problem',
    sub:'Why founder-led service businesses stall at a revenue ceiling, no matter how good the work is.' },

  {t:'problem', eyebrow:'The ceiling',
    h:'Three things keep the selling stuck on the founder.',
    bullets:['The offer is custom every time, so only you can scope and price it','The pitch lives in your head, so nobody can repeat it','There is no process, so every deal is handled from scratch'] },

  {t:'part', tag:'Part Two', h:'The Repeatable Revenue System',
    sub:'Three moves that take the selling off the founder and make revenue repeatable. This is the core of everything I teach.' },

  {t:'pillar', eyebrow:'Move 1',
    h:'Productize your expertise.',
    sub:'Turn what you do into a packaged, named offer with a clear scope, a clear outcome, and a clear price. A product can be sold by a process. A custom service can only be sold by you.',
    panel:'One-to-one, build-it-every-time work is what stunts a service business. Productizing is how you add a zero without adding hours.' },

  {t:'pillar', eyebrow:'Move 1 in practice',
    h:'From "it depends" to a thing people can buy.',
    bullets:['Narrow the focus to one buyer and one problem','Name the offer and the outcome it delivers','Fix the scope and the price so it stops being bespoke','Make it something a rep could present without you'] },

  {t:'pillar', eyebrow:'Move 2',
    h:'Build the marketing machine.',
    sub:'A repeatable way to get your productized offer in front of the right buyers, every week, without you doing it by hand. Content, a list, and a simple front door that fills the pipeline.',
    panel:'The machine is what keeps the room full so the sales process always has someone to work.' },

  {t:'pillar', eyebrow:'Move 2 in practice',
    h:'Attention you own, not attention you rent.',
    bullets:['Define the one buyer and where their attention already is','Publish the point of view that only you can','Turn attention into a list you control','Drive that list to one clear next step'] },

  {t:'pillar', eyebrow:'Move 3',
    h:'Install a sales process that runs without you.',
    sub:'A no-friction path from interested to closed that a team can run: a qualification step, a repeatable conversation, pricing for growth, and a way to revive the deals that go quiet.',
    panel:'When the process is written down and the comp plan rewards it, selling stops being a founder task and becomes a function.' },

  {t:'pillar', eyebrow:'Move 3 in practice',
    h:'The founder designs it once. The team runs it daily.',
    bullets:['A qualification step so reps spend time on real buyers','A repeatable sales conversation anyone can be trained on','Pricing built for growth, not just to feel safe','A simple system to revive dead leads instead of chasing new ones'] },

  {t:'part', tag:'Part Three', h:'What it looks like when it runs',
    sub:'The founder moves from doing the selling to owning the system that sells.' },

  {t:'picture', eyebrow:'The outcome',
    h:'You step out of the deal and the revenue keeps coming.',
    bullets:['The offer sells the same way whether or not you are in the room','New reps ramp on a documented process instead of shadowing you','Revenue becomes something you can forecast and grow on purpose','The business is finally worth more than your personal effort'] },

  {t:'why', eyebrow:'Why listen to me',
    h:'I have built and fixed the sales side of a lot of companies.',
    sub:'Former Managing Director of National Small and Midsize Business at the U.S. Chamber of Commerce, where I doubled revenue per sale. Former CEO operator leading turnarounds for investor groups. Sales and sales management expert in residence at the largest IT business mastermind. More than 4,100 founders have built scalable service businesses on this system.' },

  {t:'objection', eyebrow:'If you are thinking it',
    h:'"My work is too custom to productize."',
    sub:'Almost every founder says this, and almost every founder is wrong about it. The custom part is usually the delivery. The offer, the pitch, and the process can be systematized, and that is where repeatable revenue comes from.' },

  {t:'recap', eyebrow:'The roadmap',
    h:'Productize. Build the machine. Install the process.',
    bullets:['Productize your expertise into a packaged offer','Build the marketing machine that keeps the room full','Install a sales process the team runs without you'] },

  {t:'cta', eyebrow:'Your next step',
    h:'Let us map your repeatable revenue system.',
    cta:'If you want help turning your expertise into a repeatable revenue engine, book a 15 minute clarity call and we will look at where the selling is still stuck on you and what to systematize first.',
    disclaimer:'This masterclass is educational. It shares frameworks and approaches, not promises. Results depend on your market, your offer, and your execution. No specific revenue or income outcome is guaranteed.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.tag) html += `<span class="tag">${s.tag}</span>`;
  if (s.eyebrow) html += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.t === 'title') html += `<h1>${s.h}</h1>`;
  else html += `<h2>${s.h}</h2>`;
  if (s.sub) html += `<p class="sub">${s.sub}</p>`;
  if (s.bullets) html += '<ul>' + s.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
  if (s.panel) html += `<div class="panel"><p class="lead">${s.panel}</p></div>`;
  if (s.cta) html += `<p class="cta">${s.cta}</p>`;
  if (s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  html += `<span class="pagenum">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
