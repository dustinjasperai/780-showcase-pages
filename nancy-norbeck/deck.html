<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You Are Not a One-Person Assembly Line — A Restorative Creativity Masterclass with Nancy Norbeck</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f8f6; --panel:#ffffff; --ink:#444341; --muted:#6c6b67;
    --accent:#0056a7; --teal:#00a7bb; --rule:#e4e2db;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 26px;min-height:400px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:'Lora',serif;font-weight:700;font-size:44px;line-height:1.12;color:var(--ink);margin-bottom:18px}
  h2{font-family:'Lora',serif;font-weight:600;font-size:32px;line-height:1.18;margin-bottom:16px}
  .lead{font-size:20px;color:var(--muted);max-width:60ch}
  p{font-size:18px;margin-bottom:14px;max-width:62ch}
  .big{font-family:'Lora',serif;font-weight:600;font-style:italic;font-size:30px;color:var(--accent);line-height:1.25}
  ul{margin:8px 0 0 22px}
  li{font-size:18px;margin-bottom:10px;max-width:60ch}
  .areas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
  .area{border:1px solid var(--rule);border-radius:10px;padding:16px}
  .area .n{font-family:'Lora',serif;font-weight:700;font-size:18px;color:var(--accent)}
  .area .d{font-size:14px;color:var(--muted);margin-top:6px}
  .pill{display:inline-block;font-family:'Lora',serif;font-weight:700;font-size:22px;color:var(--accent);border:1px solid var(--rule);border-radius:999px;padding:6px 18px;margin-bottom:18px}
  .tag{display:inline-block;font-size:13px;color:var(--teal);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
  .cta h2{color:var(--accent)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;border-top:1px solid var(--rule);padding-top:14px;max-width:64ch}
  .num{font-size:13px;color:var(--muted);margin-top:28px}
  @media(max-width:640px){.slide{padding:32px 24px}h1{font-size:32px}h2{font-size:26px}.areas{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kicker">A Live Masterclass with Nancy Norbeck</div>
    <h1>You Are Not a One-Person Assembly Line</h1>
    <p class="lead">How burned-out perfectionists reconnect with the creative spark they were taught to leave behind. One live hour, built on the Restorative Creativity Framework.</p>
    <div class="num">Follow Your Curiosity</div>`},

  {t:'content', cls:'', html:`
    <div class="tag">The promise</div>
    <h2>What you will leave with</h2>
    <ul>
      <li>A clear name for the quiet missing you have felt, and why it is not a flaw.</li>
      <li>The one lock holding your creativity hostage, and the first small key.</li>
      <li>Six places to come home to yourself, not six more things to be good at.</li>
    </ul>`},

  {t:'content', cls:'', html:`
    <div class="tag">Who this is for</div>
    <h2>You did everything right. So why does something feel missing?</h2>
    <p>This is for the people, so often women, who were careful and capable and responsible, and who can feel that a part of them went quiet a long time ago.</p>
    <p>You do not need to call yourself an artist to be in the right room. You just need to suspect there was more of you once.</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">The trap</div>
    <h2>You were taught to leave it behind</h2>
    <p>Most of us learned early that play is for children, and that being creative is something you grow out of if you want to be taken seriously.</p>
    <p>So you cut yourself off from a deeply human part of who you are, quietly, on purpose, because it seemed like the grown-up thing to do.</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">The symptom</div>
    <h2>The days start to blend together</h2>
    <p>You get efficient. You get the things done. And still there is a flatness, a sense that something important is missing even if you cannot quite name it.</p>
    <p>When that happens you can start to feel deflated, which, strangely, makes you easier to subdue.</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">The reframe</div>
    <h2>Creativity is not a hobby you lost. It is a capacity you were trained out of.</h2>
    <p class="big">"The spark we all have as kids is our life energy in motion. It is still there, waiting for us to come home to it."</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">The thesis</div>
    <h2>It is not really about what you make</h2>
    <p>This hour is not about getting better at art, or finishing the novel, or monetizing a hobby.</p>
    <p>It is about reconnection. Creativity is the fastest path back to yourself, and that is the thing you actually ache for.</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">Part One, the real problem</div>
    <h2>Perfectionism is not high standards. It is a lock.</h2>
    <p>Most creative paralysis is not a general failing or proof that you are "just not creative."</p>
    <p>It is almost always one specific lock: a belief you were handed, a fear of being seen, an old rule about what counts as "real" work.</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">Part One, continued</div>
    <h2>One lock is a door, not a verdict</h2>
    <p>When you treat the block as a verdict on who you are, it wins. When you treat it as one lock, it becomes something you can actually work with.</p>
    <p>A lock implies a key. That changes everything about how you approach the thing you keep almost making.</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">Part Two, the framework</div>
    <h2>The Restorative Creativity Framework</h2>
    <p>Six interconnected areas of practice. Not steps to grind through, but places to come back to yourself. We will walk all six, together, live.</p>
    <div class="areas">
      <div class="area"><div class="n">Humanity</div><div class="d">A human capacity, not an output.</div></div>
      <div class="area"><div class="n">Integrity</div><div class="d">Whole, not performing.</div></div>
      <div class="area"><div class="n">Play</div><div class="d">Permission to make badly.</div></div>
      <div class="area"><div class="n">Reconnection</div><div class="d">Back to yourself.</div></div>
      <div class="area"><div class="n">Presence</div><div class="d">Here, now, unfinished.</div></div>
      <div class="area"><div class="n">Community</div><div class="d">Never meant to be alone.</div></div>
    </div>`},

  {t:'content', cls:'', html:`
    <span class="pill">1. Humanity</span>
    <h2>You are not a one-person assembly line</h2>
    <p>Creativity is a fundamental human capacity, not just an artistic practice. When you lose it, you also lose some of your ability to imagine and create change in your own life.</p>
    <p>Reclaiming your humanity means refusing to live like a machine that only produces.</p>`},

  {t:'content', cls:'', html:`
    <span class="pill">2. Integrity</span>
    <h2>Showing up whole</h2>
    <p>Integrity here is not about discipline. It is about letting the real you into the work instead of the polished, acceptable version you learned to perform.</p>
    <p>The work only comes alive when you stop editing yourself out of it.</p>`},

  {t:'content', cls:'', html:`
    <span class="pill">3. Play</span>
    <h2>Send the inner critic off to summer camp</h2>
    <p>Play is not a frill. It is how you build self-trust. When there is nothing to be good at and nothing to prove, the inner critic has nothing to guard.</p>
    <p>Permission to play is permission to begin.</p>`},

  {t:'content', cls:'', html:`
    <span class="pill">4. Reconnection</span>
    <h2>The fastest path back to yourself</h2>
    <p>Reconnection is the heart of the whole thing. The work you keep almost making is usually the exact thread back to the part of you that went quiet.</p>
    <p>You follow the curiosity, imperfectly, and it leads you home.</p>`},

  {t:'content', cls:'', html:`
    <span class="pill">5. Presence</span>
    <h2>Meeting what is quietly calling you</h2>
    <p>You do not need a plan or a finished product. You need a willingness to show up and spend a little time with what has been quietly calling to you.</p>
    <p>Presence is simply being here for it, now, before you know how it ends.</p>`},

  {t:'content', cls:'', html:`
    <span class="pill">6. Community</span>
    <h2>You were never meant to do this alone</h2>
    <p>So much creative shame grows in isolation. In the company of others who are also showing up unfinished, the shame loses its grip.</p>
    <p>A creative sanctuary, not a commitment. Come as you are, as often as it feels right.</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">The method, live</div>
    <h2>One lock, one key</h2>
    <p>In the session we will find your one lock in real time, and name the first small key: the next move so small the inner critic never wakes up to stop it.</p>
    <p>Small is the point. This is how you rebuild trust with yourself, one honest, imperfect move at a time.</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">Part Three, the return</div>
    <h2>Messy, joyful creativity as reconnection</h2>
    <p>You stop waiting to feel ready. You start showing up unfinished and unjudged. The art stand goes back by the desk. A part of your voice that had been hiding comes loose.</p>
    <p>It is time to say "So what?" and do it anyway.</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">Why me</div>
    <h2>Nancy Norbeck, Messy Muse Mentor</h2>
    <p>I am a novelist, singer, and former teacher with an MFA in creative writing and a Master Certified Kaizen-Muse Creativity Coaching credential. For seven years I have hosted the Follow Your Curiosity podcast, talking with ordinary people about extraordinary creativity.</p>
    <p>My work offers a different way back: creativity as the way home to yourself, in a culture that would rather you did not.</p>`},

  {t:'content', cls:'', html:`
    <div class="tag">What I believe</div>
    <h2>Curiosity may have killed the cat. Satisfaction brought it back.</h2>
    <p>You do not have to earn your way back to your own creativity. You only have to follow what you are curious about, and let it be messy on the way.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next step</div>
    <h2>Come find your one lock</h2>
    <p>If this hour named something you have felt for a long time, the next step is a One Lock, One Key illumination session, one focused hour to uncover what is really in the way and the first move to take.</p>
    <p>Or come to the free monthly Creativity Circle and simply show up unfinished, with no pressure and nothing to prove.</p>
    <p class="disclaimer">This masterclass is educational. It shares a creative practice and a way of thinking about your own work. It is not therapy, and no particular outcome or result is guaranteed. Results vary, and what you create, and how, is always your own.</p>`}
];

const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  el.innerHTML = s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
