<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Wall to World — The Author Launchpad Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f6;      /* warm off-white ground (his light scheme) */
    --ink:#020723;        /* his body ink */
    --navy:#050a5c;       /* his heading + button navy (panel/rule) */
    --gold:#fdbe44;       /* his single chromatic accent */
    --muted:#595959;
    --serif:"Source Serif Pro",Georgia,serif;
    --sans:"Source Sans Pro",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e9e6e1;font-family:var(--sans);color:var(--ink)}
  .deck{max-width:1040px;margin:0 auto;padding:32px 16px 72px}
  .slide{
    position:relative;background:var(--paper);border-radius:10px;
    margin:0 0 26px;padding:60px 64px;min-height:520px;
    box-shadow:0 1px 0 rgba(2,7,35,.06),0 18px 44px -26px rgba(2,7,35,.5);
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--navy)}
  .kicker{font-family:var(--sans);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--gold);margin-bottom:18px}
  .kicker b{color:var(--navy)}
  h1{font-family:var(--serif);font-weight:700;font-size:58px;line-height:1.04;color:var(--navy);letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.1;color:var(--navy);margin-bottom:22px}
  .sub{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--ink);margin-top:22px;max-width:30ch}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:62ch;margin-top:14px}
  .lead{font-size:23px}
  .big{font-family:var(--serif);font-size:34px;line-height:1.25;color:var(--navy);max-width:24ch}
  ul{list-style:none;margin-top:18px}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 40px;position:relative;border-top:1px solid rgba(5,10,92,.12);max-width:60ch}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:16px;height:16px;border-radius:50%;
    background:var(--gold);box-shadow:inset 0 0 0 3px var(--paper),0 0 0 2px var(--navy)}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  .card{background:#fff;border:1px solid rgba(5,10,92,.14);border-left:5px solid var(--gold);
    border-radius:8px;padding:20px 22px}
  .card .n{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:15px;letter-spacing:.08em}
  .card h3{font-family:var(--serif);font-size:22px;color:var(--navy);margin:4px 0 8px}
  .card p{font-size:16px;margin:0;color:var(--muted)}
  .rail{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap}
  .phase{flex:1;min-width:210px;background:var(--navy);color:#fff;border-radius:8px;padding:22px 20px}
  .phase .tag{color:var(--gold);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
  .phase h3{font-family:var(--serif);font-size:24px;margin:8px 0 10px;color:#fff}
  .phase p{color:rgba(255,255,255,.86);font-size:15px;margin:0;max-width:none}
  .quote{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1.3;color:var(--navy);max-width:26ch}
  .by{margin-top:22px;font-weight:600;color:var(--muted);font-size:16px;letter-spacing:.02em}
  .cta h2{font-size:46px}
  .btn{display:inline-block;margin-top:26px;background:var(--navy);color:#fff;font-weight:700;
    font-size:19px;padding:16px 34px;border-radius:8px;letter-spacing:.01em}
  .btn b{color:var(--gold)}
  .disc{margin-top:28px;font-size:13px;line-height:1.5;color:var(--muted);max-width:70ch}
  .foot{position:absolute;right:28px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .pageno{position:absolute;left:28px;bottom:20px;font-size:12px;color:var(--muted)}
  @media(max-width:720px){.slide{padding:40px 26px}h1{font-size:40px}h2{font-size:30px}.pillars{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', html:`<div class="kicker">The Author Launchpad&trade; &middot; <b>Live Masterclass</b></div>
   <h1>From Wall to World</h1>
   <div class="sub">How to turn your nonfiction book into a high-ticket business, without chasing more book sales.</div>
   <div class="by">With Chris Trammell &middot; Author &amp; Expert Launch Strategist</div>`},
 {t:'for', html:`<div class="kicker">Who this is for</div>
   <h2>You wrote the book. Now it is sitting on the shelf.</h2>
   <p class="lead">You are a published nonfiction author, coach, or expert. The book is real and it is good. But the income from it is under a few thousand a month, and every piece of advice points the same way: sell more copies.</p>
   <p>So you chase reviews, signings, and launch weeks, and the needle barely moves. The problem is not your book. The problem is that nobody built you a business around it.</p>`},
 {t:'reframe', html:`<div class="kicker">The reframe</div>
   <div class="big">Your book was never the product. It is the doorway. The product is the transformation only you can coach.</div>
   <p>Royalties pay in pennies. Your expertise pays in programs. When we stop selling the book and start selling the system behind it, the same readers become clients worth a thousand times a paperback.</p>`},
 {t:'p1head', html:`<div class="kicker">Part One &middot; <b>The core problem</b></div>
   <h2>The book-sales trap</h2>
   <p class="lead">Book sales are a volume game you cannot win alone. A high-ticket offer is a value game you already have the authority to win.</p>`},
 {t:'p1body', html:`<div class="kicker">Part One</div>
   <h2>Why more copies will not fix it</h2>
   <ul>
     <li>A paperback earns you a coffee. A client earns you a mortgage payment. Same reader, different doorway.</li>
     <li>Readers do not want more information. They want you to walk them through the result your book promised.</li>
     <li>Without a model, every new reader is a dead end instead of the first step into your work.</li>
   </ul>`},
 {t:'asset', html:`<div class="kicker">The real asset</div>
   <div class="quote">"When you shine, I shine."</div>
   <p>The asset is not the pages. It is the mission, the message, and the method inside you. The rest of this masterclass is how we package those three into something people pay to be coached through.</p>`},
 {t:'p2head', html:`<div class="kicker">Part Two &middot; <b>The method</b></div>
   <h2>The Four Pillars</h2>
   <p class="lead">Every author business I build stands on the same four pillars. Miss one and the business wobbles. Build all four and it carries weight.</p>`},
 {t:'pillars', html:`<div class="kicker">The Four Pillars</div>
   <h2>The frame, at a glance</h2>
   <div class="pillars">
     <div class="card"><div class="n">PILLAR 1</div><h3>Discover Your Mission</h3><p>The purpose behind the work, mapped to what your reader is actually reaching for.</p></div>
     <div class="card"><div class="n">PILLAR 2</div><h3>Craft Your Million Dollar Message</h3><p>Who you are, who you serve, your method, and the transformation you deliver.</p></div>
     <div class="card"><div class="n">PILLAR 3</div><h3>Design Your Unique Model</h3><p>The signature framework that makes your expertise scalable and repeatable.</p></div>
     <div class="card"><div class="n">PILLAR 4</div><h3>Monetize With Confidence</h3><p>Deliver the promised result and price it to the life and impact you want.</p></div>
   </div>`},
 {t:'pillar1', html:`<div class="kicker">Pillar One</div>
   <h2>Discover Your Mission</h2>
   <p class="lead">Before a single offer, we find the through-line of your work. What drives you to teach this, and how does that mission line up with what your reader is aspiring toward?</p>
   <p>A mission your reader can feel is what turns a casual browser into someone who wants to be coached by you specifically. This is the foundation every other pillar is poured onto.</p>`},
 {t:'pillar2', html:`<div class="kicker">Pillar Two</div>
   <h2>Craft Your Million Dollar Message</h2>
   <p class="lead">Your message is more than a summary of your book. It is the magnet. We get crisp on who you are, who you serve, the method you use, and the exact outcome you create.</p>
   <p>Nail the message and your marketing stops being a chore. You say one true sentence and the right reader leans in.</p>`},
 {t:'pillar3', html:`<div class="kicker">Pillar Three</div>
   <h2>Design Your Unique Model</h2>
   <p class="lead">Expertise needs a structure to shine. We turn what is in your head and your book into a named, step-by-step model, your signature framework.</p>
   <p>A model is what makes you scalable. It is repeatable, teachable, and ownable, so you are no longer trading raw hours for impact.</p>`},
 {t:'pillar4', html:`<div class="kicker">Pillar Four</div>
   <h2>Monetize With Confidence</h2>
   <p class="lead">Monetization is not just revenue. It is the confidence to reliably deliver what you promise, and to price it to the lifestyle and impact you actually want.</p>
   <p>When you trust your model and your message, selling stops feeling like pressure. It becomes an honest invitation into the result your reader already wants.</p>`},
 {t:'phases', html:`<div class="kicker">The 3-Phase System</div>
   <h2>How we build it, in 90 days</h2>
   <div class="rail">
     <div class="phase"><div class="tag">Phase 1</div><h3>Package</h3><p>Extract your expertise, define your ideal client, core message, and primary offer.</p></div>
     <div class="phase"><div class="tag">Phase 2</div><h3>Market</h3><p>Design your unique revenue roadmap: funnel, email, VSL, and the tech, handled with you.</p></div>
     <div class="phase"><div class="tag">Phase 3</div><h3>Monetize</h3><p>Launch your pilot, learn authentic selling, and turn expertise into natural sales.</p></div>
   </div>`},
 {t:'phase1', html:`<div class="kicker">Phase One &middot; <b>Package</b></div>
   <h2>Get the expertise out of your head</h2>
   <ul>
     <li>Extract the real value from you and the book, not just the table of contents.</li>
     <li>Define the one reader you are built to serve, in plain language.</li>
     <li>Shape your core message and your first flagship offer, ready to take to market.</li>
   </ul>`},
 {t:'phase2', html:`<div class="kicker">Phase Two &middot; <b>Market</b></div>
   <h2>Design your unique revenue roadmap</h2>
   <ul>
     <li>Build the author marketing funnel that brings the right readers to you on repeat.</li>
     <li>Email sequences, a simple VSL script, and social templates that sound like you.</li>
     <li>The tech gets handled, so overwhelm never becomes the reason you stall.</li>
   </ul>`},
 {t:'phase3', html:`<div class="kicker">Phase Three &middot; <b>Monetize</b></div>
   <h2>Launch, sell, and deliver</h2>
   <ul>
     <li>Launch your pilot program to a warm, qualified first group.</li>
     <li>Learn authentic selling that fits your voice, never a high-pressure script.</li>
     <li>Deliver the transformation and let real results create your next wave of clients.</li>
   </ul>`},
 {t:'p3head', html:`<div class="kicker">Part Three &middot; <b>Your first six months</b></div>
   <h2>From a shelf to a business</h2>
   <p class="lead">Six months from now the book is no longer the finish line. It is the front door to a signature program, a steady flow of the right clients, and income that finally matches the work you put into the page.</p>`},
 {t:'whyme', html:`<div class="kicker">Why work with me</div>
   <h2>I coach authors like high performers</h2>
   <p class="lead">I have spent 20 years in sports psychology and athletic coaching, from USA Track &amp; Field athletes to two Ironman finishes of my own, and 15+ years building curriculum and transformational programs.</p>
   <p>I carried that into the business world at Nike and Under Armour, and trained with Tony Robbins, Landmark, and Brendon Burchard. I bring that same performance and curriculum discipline to one thing now: turning your book and expertise into a business only you could build.</p>`},
 {t:'recap', html:`<div class="kicker">Recap</div>
   <div class="big">From Wall to World: mission, message, model, and the confidence to monetize all of it.</div>
   <p>You already did the hard part. You wrote the book and lived the expertise. What is left is the system, and that is exactly what we build together.</p>`},
 {t:'cta', html:`<div class="kicker">Your next step</div>
   <h2>Let's map your Author Launchpad</h2>
   <p class="lead">If you are ready to turn your book into a high-ticket business, book a call and we will map your mission, message, and model, and the 90-day plan to launch it.</p>
   <a class="btn" href="https://www.christrammellcoaching.com/the-author-launchpad">Book a Call &middot; <b>The Author Launchpad&trade;</b></a>
   <div class="disc">For educational purposes only. No income or result is guaranteed. Results vary based on your background, effort, market, and execution. Nothing here is a promise or representation of specific results.</div>`}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'');
  d.innerHTML=s.html
    +'<div class="pageno">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>'
    +'<div class="foot">Chris Trammell Coaching</div>';
  deck.appendChild(d);
});
</script>
</body>
</html>
