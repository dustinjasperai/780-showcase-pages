<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Intrapreneur — A Masterclass for Data &amp; Analytics Leaders · Prakash Baskar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#26272c;        /* datapreneurs.com charcoal */
    --panel:#393e46;     /* datapreneurs.com slate */
    --rule:rgba(255,255,255,0.12);
    --ink:#f4f5f6;
    --muted:#9aa1a8;
    --accent:#fd5f00;    /* datapreneurs.com dominant orange */
    --teal:#00a99d;      /* datapreneurs.com teal, used sparingly */
    --display:'Montserrat',sans-serif;  /* their stack */
    --body:'Roboto',sans-serif;          /* their dominant face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.5}
  .deck{max-width:1080px;margin:0 auto;padding:48px 20px 96px}
  .slide{
    background:linear-gradient(180deg,var(--panel),#2f333b);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:52px 56px;
    margin:0 0 26px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  .kick .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:9px;vertical-align:middle}
  h1{font-family:var(--display);font-weight:800;font-size:54px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.12;margin-bottom:16px}
  .sub{font-size:20px;color:var(--muted);max-width:44ch;margin-bottom:8px}
  .lead{font-size:21px;line-height:1.5;max-width:52ch}
  .big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.2;max-width:40ch;color:var(--ink)}
  .accent{color:var(--accent)}
  ul{list-style:none;margin-top:12px}
  li{font-size:19px;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:60ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:21px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .steps li::before{content:counter(step);counter-increment:step;background:transparent;color:var(--accent);font-family:var(--display);font-weight:800;font-size:17px;top:12px;width:auto;height:auto}
  .steps{counter-reset:step}
  .steps li{padding-left:34px}
  .note{margin-top:26px;font-size:13px;color:var(--muted);max-width:66ch;line-height:1.5}
  .label{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
  .part h1{font-size:46px}
  .part .idx{font-family:var(--display);font-weight:800;font-size:120px;color:rgba(253,95,0,.16);line-height:.8;margin-bottom:10px}
  .cta{background:linear-gradient(180deg,#2f333b,var(--panel))}
  .cta .btn{display:inline-block;margin-top:22px;background:var(--accent);color:#1a1200;font-family:var(--display);font-weight:800;font-size:18px;padding:16px 30px;border-radius:10px;letter-spacing:.01em}
  .foot{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted);font-family:var(--display);letter-spacing:.08em}
  .n{position:absolute;left:26px;bottom:18px;font-size:12px;color:var(--muted);font-family:var(--display)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:14px}
  .card{background:rgba(0,0,0,.18);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
  .card h3{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);margin-bottom:8px}
  .card p{font-size:16px;color:var(--ink);opacity:.92}
  @media(max-width:720px){.slide{padding:34px 26px;min-height:0}h1{font-size:38px}h2{font-size:27px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    k:'A Datapreneurs Masterclass',
    h:'The Intrapreneur',
    sub:'How data and analytics leaders own their careers, lead themselves, and win with data and AI.',
    foot:'Prakash Baskar · Datapreneurs' },

  {t:'promise',
    k:'What you will leave with',
    h:'45 minutes, one operating system for your career',
    pts:[
      'Why your next move depends on something nobody taught you in a data or analytics role.',
      'The three part Intrapreneur system: Mobility Matters, Mobility Planning, and Improve Your Game.',
      'A concrete first step you can take this week, whatever stage you are at.'
    ] },

  {t:'who',
    k:'Who this is for',
    h:'The technically excellent, quietly stuck',
    lead:'You are a senior analyst, a data lead, or a head of analytics. You are very good at the technical work. And yet the next level keeps going to someone else. This room is for you.',
    pts:[
      'You deliver the models, the dashboards, the answers. Recognition lags behind the output.',
      'You suspect the people moving up are not better at the craft. They are doing something you are not.',
      'You want to grow without pretending to be someone you are not.'
    ] },

  {t:'trap',
    k:'The trap',
    h:'The expertise trap',
    big:'You were promoted for being the best at the work. The next move is not about the work at all.',
    lead:'Every data career hits the same wall. The skills that got you here, the technical depth, the right answer, stop being the thing that moves you forward. Nobody says this out loud, so most people respond by going even deeper into the craft. That is the trap.' },

  {t:'hook',
    k:'A harder truth',
    h:'Your career is the one dataset you have never modeled',
    big:'You optimize everything except the system you live inside every day.',
    lead:'You would never let an important business decision run on hope and good intentions. Yet that is exactly how most talented data people run their own careers. They wait to be noticed. Waiting is a losing strategy, and it is an avoidable one.' },

  {t:'part', idx:'01', label:'Part One', h:'Mobility Matters',
    sub:'Why movement, not tenure, is what actually grows a data career.' },

  {t:'content',
    k:'Part One · Mobility Matters',
    h:'Tenure is not a strategy',
    lead:'Careers grow through deliberate movement: new scope, new rooms, new problems. Staying put feels safe and quietly compounds against you.',
    pts:[
      'The three year rule: if a role has stopped teaching you, the clock is already running.',
      'The real cost of staying is invisible. It is the growth, the network, and the options you never built.',
      'Movement is not only changing jobs. It is changing the problems you are trusted with.'
    ] },

  {t:'content',
    k:'Part One · Mobility Matters',
    h:'People Intelligence',
    big:'Careers move on relationships, not output alone.',
    lead:'The work is necessary and it is not sufficient. The people who advance read and tend the relationships around them on purpose.',
    pts:[
      'Managers: give them what they need before they ask, and make your ambition legible.',
      'Peers: your reputation is written by the people beside you, not only above you.',
      'Stakeholders: the business remembers who made them look good with data.'
    ] },

  {t:'part', idx:'02', label:'Part Two', h:'Mobility Planning',
    sub:'Turning movement from an accident into a plan.' },

  {t:'content',
    k:'Part Two · Mobility Planning',
    h:'Developing mobili-sense',
    lead:'Mobili-sense is the judgment to see your options clearly and choose between them on purpose, instead of taking whatever arrives.',
    pts:[
      'Name your real options, including the ones inside your current company.',
      'Weigh each against where you want to be in three years, not three weeks.',
      'Make the choice deliberately, then prepare for it before you need it.'
    ] },

  {t:'content',
    k:'Part Two · Mobility Planning',
    h:'The giving mindset',
    big:'The fastest way up is to make other people more successful first.',
    lead:'Breakthroughs rarely come from asking. They come from a track record of giving that other people want to repay.',
    pts:[
      'Find role models and mentors on purpose, and make it easy to help you.',
      'Lead with contribution. Help solve problems that are not formally yours.',
      'A giving reputation travels further and faster than a resume ever will.'
    ] },

  {t:'part', idx:'03', label:'Part Three', h:'Improve Your Game',
    sub:'Becoming the Intrapreneur and growing the people around you.' },

  {t:'content',
    k:'Part Three · Improve Your Game',
    h:'Tactics, Strategies, Mindsets',
    lead:'Owning your career is a practice with three layers. You work all three at once.',
    cards:[
      ['Tactics','The weekly habits: how you show up, communicate, and make your work visible.'],
      ['Strategies','The quarterly moves: the scope you pursue and the rooms you get into.'],
      ['Mindsets','The inner stance: ownership, a giving mindset, and leading yourself first.']
    ] },

  {t:'content',
    k:'Part Three · Improve Your Game',
    h:'Win with data and AI, then grow your people',
    big:'An Intrapreneur leads themselves first, then multiplies that in others.',
    lead:'This is where it compounds. You stop being the person who has the answer and become the leader who builds the people and systems that produce the answers.',
    pts:[
      'Use data and AI to drive outcomes the business can feel, not just reports it files.',
      'Turn your own operating system into something your team can run.',
      'Growth you can repeat for others is what makes the title permanent.'
    ] },

  {t:'content',
    k:'When the system runs',
    h:'From the person with the answer to the leader who builds them',
    big:'Same skills. A different trajectory.',
    lead:'When the system is running, the change is quiet but unmistakable. You stop waiting to be chosen and start being the obvious choice.',
    pts:[
      'You are in the rooms where the decisions get made, not just the ones where the work gets assigned.',
      'Your name comes up when scope opens, because people already trust how you lead.',
      'The growth is repeatable, so the next move is not luck, it is a pattern.'
    ] },

  {t:'recap',
    k:'The system, in one view',
    h:'The Intrapreneur operating system',
    steps:[
      'Mobility Matters: choose movement over tenure, and tend the relationships that carry it.',
      'Mobility Planning: build mobili-sense and a giving reputation so the right options find you.',
      'Improve Your Game: work tactics, strategies, and mindsets, and grow the people around you.'
    ] },

  {t:'who',
    k:'Why listen to me',
    h:'Prakash Baskar',
    lead:'I spent more than twenty five years in senior leadership across strategy, data, and analytics in global corporations. I was the technically excellent person who was quietly stuck, until I was not.',
    pts:[
      'Author of The Intrapreneur, book one of the Datapreneurs series.',
      'Founder and President of Datapreneurs and Khyanafi.',
      'I now help data and analytics leaders do their best work and own their careers.'
    ] },

  {t:'cta',
    k:'Your next step',
    h:'Keep going with us',
    lead:'If this is the way you want to lead your own career, there are two doors. Join the Datapreneurs Hub to grow alongside other data driven intrapreneurs, or step into the Career Accelerator for personalized coaching and mentoring built on the system you just saw.',
    btn:'Join the Career Accelerator',
    note:'This masterclass is for educational purposes only. It is not financial, legal, or career guarantee advice. Results vary from person to person and depend on your own effort, situation, and timing. No specific outcome, promotion, or income is promised or guaranteed.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t||'') ;
  let html = '';
  if(s.k) html += '<div class="kick"><span class="dot"></span>'+s.k+'</div>';
  if(s.t==='part'){
    if(s.idx) html += '<div class="idx">'+s.idx+'</div>';
    if(s.label) html += '<div class="label">'+s.label+'</div>';
  }
  if(s.h) html += (s.t==='title' ? '<h1>'+s.h+'</h1>' : (s.t==='part' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>'));
  if(s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if(s.big) html += '<p class="big">'+s.big+'</p>';
  if(s.lead) html += '<p class="lead" style="margin-top:14px">'+s.lead+'</p>';
  if(s.cards){
    html += '<div class="two">';
    s.cards.forEach(c=> html += '<div class="card"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div>');
    html += '</div>';
  }
  if(s.pts){
    html += '<ul>';
    s.pts.forEach(p=> html += '<li>'+p+'</li>');
    html += '</ul>';
  }
  if(s.steps){
    html += '<ul class="steps">';
    s.steps.forEach(p=> html += '<li>'+p+'</li>');
    html += '</ul>';
  }
  if(s.btn) html += '<div><span class="btn">'+s.btn+'</span></div>';
  if(s.note) html += '<p class="note">'+s.note+'</p>';
  if(s.foot) html += '<div class="foot">'+s.foot+'</div>';
  html += '<div class="n">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
