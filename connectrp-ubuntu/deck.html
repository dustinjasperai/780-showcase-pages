<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Restorative School: Me, Us, Culture - Connect RP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf3ec; --panel:#fffdfa; --ink:#211c41; --body:#333333;
    --accent:#e85720; --teal:#2f94b1; --rule:#e7e2da;
    --display:'Poppins',system-ui,sans-serif; --text:'Source Sans 3',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--body);font-family:var(--text);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center}
  .slide{display:none;width:min(1040px,92vw);max-height:92vh;overflow:auto;
    background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:clamp(28px,4.5vw,64px);box-shadow:0 24px 60px -34px rgba(33,28,65,.5)}
  .slide.on{display:block;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;color:var(--ink);
    font-size:clamp(30px,5.2vw,58px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;color:var(--ink);
    font-size:clamp(24px,3.6vw,40px);line-height:1.1;margin-bottom:14px}
  p{font-size:clamp(17px,1.7vw,21px);line-height:1.55;max-width:60ch;margin-top:14px}
  .lead{font-size:clamp(19px,2vw,25px);color:var(--ink);font-weight:600}
  .big{font-family:var(--display);font-weight:700;color:var(--accent);
    font-size:clamp(40px,8vw,96px);line-height:1}
  ul{margin:18px 0 0 0;list-style:none;max-width:62ch}
  li{position:relative;padding-left:30px;margin:13px 0;font-size:clamp(16px,1.7vw,20px);line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:.5em;width:12px;height:12px;
    border-radius:50%;border:2.5px solid var(--accent)}
  .step li::before{border-color:var(--teal)}
  .tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:13px;
    color:var(--teal);border:1px solid var(--teal);border-radius:999px;padding:5px 13px;margin-bottom:16px}
  .rings{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px}
  .ring{flex:1;min-width:190px;border:1px solid var(--rule);border-radius:14px;padding:22px}
  .ring .n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.1em;text-transform:uppercase}
  .ring h3{font-family:var(--display);color:var(--ink);font-size:22px;margin:6px 0 8px}
  .ring p{font-size:16px;margin:0}
  .circlewrap{display:flex;align-items:center;justify-content:center;margin-top:24px}
  .circle{position:relative;width:min(360px,70vw);aspect-ratio:1}
  .circle span{position:absolute;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-family:var(--display);font-weight:600;color:var(--ink);text-align:center}
  .c1{inset:0;border:2px solid var(--accent);font-size:15px;align-items:flex-start!important;padding-top:10px;color:var(--accent)}
  .c2{inset:16%;border:2px solid var(--teal);font-size:16px;align-items:flex-start!important;padding-top:10px;color:var(--teal)}
  .c3{inset:36%;border:2px solid var(--ink);background:#fff;font-size:17px}
  .quote{font-family:var(--display);font-weight:600;color:var(--ink);
    font-size:clamp(22px,3vw,34px);line-height:1.25;max-width:24ch}
  .disc{margin-top:26px;font-size:13px;color:#8a8597;max-width:66ch;line-height:1.5}
  .cta-row{margin-top:22px;display:flex;gap:14px;flex-wrap:wrap}
  .btn{font-family:var(--display);font-weight:600;font-size:17px;padding:14px 26px;border-radius:999px}
  .btn.p{background:var(--accent);color:#fff}
  .btn.s{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .foot{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 26px;font-family:var(--display);font-size:12px;color:#9a95a6;letter-spacing:.06em}
  .nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  .nav button{font-family:var(--display);border:1px solid var(--rule);background:#fff;
    color:var(--ink);width:38px;height:34px;border-radius:9px;cursor:pointer;font-size:16px}
  .brand{font-family:var(--display);font-weight:700;color:var(--ink)}
  .brand b{color:var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<div class="foot"><span class="brand">Connect <b>RP</b></span><span id="pg"></span></div>
<div class="nav"><button id="prev">‹</button><button id="next">›</button></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Michelle Stowe · Connect RP',
  h1:'The Restorative School: Me, Us, Culture',
  p:'How Irish schools grow a restorative culture that lasts after the training day ends. It starts with one educator, not one workshop.'},

 {t:'content',tag:'Who this is for',h2:'If any of this sounds like your corridor',
  list:['A teacher giving everything and still managing the same behaviour on repeat','A middle or aspiring leader who believes in relationships but has no shared language for them','A principal who has run RP training before and watched it fade by the summer','A staff that wants connection, not another policy to file away']},

 {t:'quote',tag:'The trap',
  quote:'Most schools try to fix the culture by managing the behaviour. It is the behaviour that is asking for the culture.'},

 {t:'content',tag:'The reframe',h2:'Restorative practice is not an intervention. It is how the school relates.',
  p:'An intervention is something you do to a problem child after it goes wrong. A restorative culture is the ordinary way staff and students speak to each other every day, so far fewer things go wrong in the first place. One is a programme. The other is who the school is.'},

 {t:'section',eyebrow:'Part one',h1:'Why most RP training does not stick',
  p:'Not because the ideas are wrong. Because of where schools start.'},

 {t:'content',tag:'The core problem',h2:'A one-day workshop changes a calendar, not a culture',
  list:['Everyone hears the six principles once, in a hall, in June','They go back to full timetables and old habits reassert within weeks','There is no internal owner, so when the trainer leaves the energy leaves with them','"We did RP" becomes a line in the school plan, not a lived practice']},

 {t:'content',tag:'The shift',h2:'Culture change moves outward, in that order',
  p:'You cannot ask a staff to relate restoratively to students if they have not first felt it themselves. So we build it in three widening circles.',
  circle:true},

 {t:'section',eyebrow:'Part two',h1:'The Connect RP journey',
  p:'Restorative Me, then Restorative Us, then a whole-school culture.'},

 {t:'rings',tag:'The framework',h2:'Three circles, one direction',
  rings:[
   {n:'Circle one',h:'Restorative Me',p:'The individual educator changes their own practice first.'},
   {n:'Circle two',h:'Restorative Us',p:'An internal team carries it across the staffroom.'},
   {n:'Circle three',h:'School Culture',p:'It becomes the ordinary way the school relates.'}]},

 {t:'content',tag:'Circle one · Restorative Me',h2:'Change the educator before the policy',
  p:'Restorative Me is where every lasting culture starts. Three moves, in order:',
  cls:'step',
  list:['Mentor It: self-paced lessons and community cafes that build the language of connection','Resource It: journals, Connect and Reflect exercises and classroom-ready resources','Practise It: Connect Quests you run with your own class and watch relationships shift']},

 {t:'content',tag:'Circle one · the principle underneath',h2:'Connection before curriculum',
  p:'A regulated, connected young person can learn. A dysregulated one cannot, no matter how good the lesson plan is. Connection before curriculum is not soft. It is the precondition for everything else we are paid to do.'},

 {t:'content',tag:'Circle two · Restorative Us',h2:'One trained teacher fades. A team holds.',
  p:'The single biggest reason RP survives in a school is an internal team that owns it. Restorative Us builds that team of four to ten staff, led by someone with the time and heart for it, not simply added to senior leadership.',
  cls:'step',
  list:['Mentor the Journey: orientation, skills cafes and team-leader partnerships','Resource the Implementation: staff CPD, learning communities and a growth plan','Measure Impact: you show the change with your own survey and outcome data']},

 {t:'content',tag:'Circle two · how it keeps going',h2:'The Bee RP Hive',
  p:'Culture needs a rhythm, not a launch. The Bee RP Hive is a set of short gatherings the team leader runs through the year, a cuppa, a biscuit and a protected space to reflect and live the practice together. That is how distributed leadership actually happens: slowly, in community, on your timetable.'},

 {t:'content',tag:'Circle three · School Culture',h2:'When it is the water, not the lesson',
  list:['Staff share one language for repairing harm, from the yard to the staff meeting','Students become RP champions and model it to younger years','Leaders grow the team using the school self-evaluation process they already run','Relationships, not sanctions, carry the hard days']},

 {t:'quote',tag:'The six principles, lived',
  quote:'The goal is not that your staff can name the six principles of restorative practice. It is that a visitor can feel them in the first five minutes.'},

 {t:'section',eyebrow:'Part three',h1:'What a restorative year looks like',
  p:'Not a programme you survive. A practice you keep.'},

 {t:'content',tag:'What changes',h2:'The evidence you will gather yourself',
  list:['Fewer repeat incidents, because harm is repaired rather than parked','Staff wellbeing and morale lift when the relationships underneath them are tended','New and established teachers both reach for the same restorative language','The practice outlives any one champion, because the team and the students carry it']},

 {t:'content',tag:'Why Connect RP',h2:'A teacher at heart, not a consultant parachuting in',
  p:'Michelle Stowe is a teacher turned restorative-practice practitioner and trainer, and the founder of Connect RP. The work is Irish, school-tested and built with a team of practising facilitators and a roster of partner schools, delivered through the UBUNTU learning platform so staff keep the resources long after a training day.'},

 {t:'cta',eyebrow:'Your next step',h1:'Start with one circle',
  p:'If this is the culture you want for your school, you do not have to do it all at once. Begin where every restorative school begins: with Restorative Me, and a conversation about what the full journey could look like for your staff.',
  ctas:['Explore Restorative Me','Book a conversation with Connect RP'],
  disc:'This masterclass is for educational and professional-development purposes only. Outcomes depend on each school context, leadership commitment and implementation; no specific result is guaranteed. Restorative Me, Restorative Us, the Bee RP Hive, Connection before Curriculum and the School Culture Partnership are programmes of Connect RP.'}
];

const stage=document.getElementById('stage'),pg=document.getElementById('pg');
let i=0;
function circleHTML(){return '<div class="circlewrap"><div class="circle">'+
 '<span class="c1">Whole-school culture</span>'+
 '<span class="c2">The staff team</span>'+
 '<span class="c3">One educator</span></div></div>';}
function render(){
 stage.innerHTML='';
 const s=S[i];const d=document.createElement('section');d.className='slide on';
 let h='';
 if(s.eyebrow)h+='<div class="eyebrow">'+s.eyebrow+'</div>';
 if(s.tag)h+='<span class="tag">'+s.tag+'</span>';
 if(s.h1)h+='<h1>'+s.h1+'</h1>';
 if(s.h2)h+='<h2>'+s.h2+'</h2>';
 if(s.quote)h+='<p class="quote">'+s.quote+'</p>';
 if(s.p)h+='<p'+(s.t==='title'?' class="lead"':'')+'>'+s.p+'</p>';
 if(s.circle)h+=circleHTML();
 if(s.rings){h+='<div class="rings">';s.rings.forEach(r=>{h+='<div class="ring"><div class="n">'+r.n+'</div><h3>'+r.h+'</h3><p>'+r.p+'</p></div>';});h+='</div>';}
 if(s.list){h+='<ul'+(s.cls?' class="'+s.cls+'"':'')+'>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
 if(s.ctas){h+='<div class="cta-row">';s.ctas.forEach((c,j)=>h+='<span class="btn '+(j===0?'p':'s')+'">'+c+'</span>');h+='</div>';}
 if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
 d.innerHTML=h;stage.appendChild(d);
 pg.textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
