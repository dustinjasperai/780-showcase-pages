<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Vacation Rental Machine — Short Term Sage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f9;
    --panel:#ffffff;
    --ink:#0d203b;
    --muted:#4a5568;
    --rule:#dde3ea;
    --accent:#e6ad03;
    --serif:'DM Serif Display',Georgia,serif;
    --sans:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:16px;
    padding:52px 54px;
    margin:0 0 22px;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 0 rgba(13,32,59,.03);
  }
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,56px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.6vw,40px);line-height:1.1;margin-bottom:14px}
  .sub{font-size:clamp(17px,2vw,21px);color:var(--muted);line-height:1.5;margin-top:20px;max-width:42ch}
  .lede{font-size:clamp(18px,2.1vw,22px);line-height:1.55;color:var(--ink);max-width:48ch}
  .note{font-size:15px;color:var(--muted);margin-top:18px;line-height:1.5;max-width:52ch}
  ul{list-style:none;margin-top:14px}
  li{font-size:clamp(16px,1.9vw,20px);line-height:1.45;padding:13px 0 13px 30px;border-bottom:1px solid var(--rule);position:relative;color:var(--ink)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:22px;width:11px;height:11px;border-radius:3px;background:var(--accent)}
  .big{font-family:var(--serif);font-size:clamp(40px,7vw,86px);line-height:1;color:var(--accent)}
  .big-label{font-size:17px;color:var(--muted);margin-top:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-top:26px}
  .stat .n{font-family:var(--serif);font-size:clamp(30px,4vw,46px);color:var(--ink);line-height:1}
  .stat .l{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.4}
  .pill{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:rgba(230,173,3,.16);border:1px solid rgba(230,173,3,.5);padding:5px 12px;border-radius:999px;font-weight:700;margin-bottom:20px}
  .num{position:absolute;top:22px;right:26px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:60ch;border-top:1px solid var(--rule);padding-top:16px}
  .cta-step{font-family:var(--serif);font-size:clamp(22px,2.6vw,30px);color:var(--ink);margin-top:10px}
  @media(max-width:620px){.slide{padding:38px 26px;min-height:360px}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'A Short Term Sage Masterclass',h:'The Vacation Rental Machine',sub:'How to build a seven-figure short-term rental business without owning a single property.'},

  {t:'who',kicker:'Who this is for',h:'You want out, not another mortgage',lede:'You want time and financial freedom, and you can see short-term rentals are the vehicle. You just do not want to sink your savings into a down payment, sign for a loan, or wait years to buy your way in.',note:'If that is you, this hour is built for you.'},

  {t:'trap',pill:'The trap',h:'The ownership belief',lede:'Almost everyone thinks the same thing: to make money on Airbnb you first have to buy the property. So they save for a down payment, chase a mortgage, and stall before they ever start.',note:'The capital is the wall. Most people never get past it.'},

  {t:'hook',pill:'The reframe',h:'The asset is the system, not the real estate',lede:'The money in short-term rentals does not come from owning walls. It comes from controlling a great listing and running it well. You can control a property without ever buying it.',note:'Once you see that, the whole game changes.'},

  {t:'part',kicker:'Part one',h:'Why owning is the slow lane',lede:'Buying ties up your cash, your credit, and years of your life in one or two doors. Meanwhile the operators winning on Airbnb are running many listings they do not own, and reinvesting the cash flow instead of the equity.'},

  {t:'list',kicker:'Part one',h:'What really drives a booking',bullets:['The listing: photos, copy, and pricing that win the click','The guest experience that earns five stars and Superhost status','The systems that keep it running whether you are there or not','None of that requires a deed in your name']},

  {t:'part',kicker:'Part two',h:'The VRM Formula',lede:'Vacation Rental Machine is the step-by-step way we started, automated, and scaled from zero to sixty-plus doors. Three moving parts turn a single idea into a machine.'},

  {t:'list',kicker:'Part two · pillar 1',h:'Acquire without owning',bullets:['Rental arbitrage: lease a unit from a landlord, then list it as a short-term rental','Co-hosting: run an owners property and the listing for a share of the revenue','Pitch landlords and co-host clients with a simple, repeatable offer','Low capital in, no mortgage, you can start this month']},

  {t:'list',kicker:'Part two · pillar 2',h:'Systematize to Superhost',bullets:['Build the guest experience that earns five-star reviews on autopilot','Reach Superhost, the top twenty-five percent, so the platform ranks you higher','Turn operations into checklists a cleaner or assistant can follow','Protect the rating that quietly drives your nightly rate']},

  {t:'list',kicker:'Part two · pillar 3',h:'Automate to four hours a week',bullets:['Messaging, pricing, and turnovers handled by tools and templates','Remote management, so a door in another city runs like one next door','A small team doing the hands-on work while you own the system','The business runs on about four hours of your time a week']},

  {t:'list',kicker:'Part two · the result',h:'Then you scale',bullets:['Repeat the acquire-systematize-automate loop on the next door','Add units across more than one market without adding more of your hours','This is how a basement rental becomes sixty-plus doors','Every new listing stacks on the system you already built']},

  {t:'part',kicker:'Part three',h:'From a rented basement to sixty doors',lede:'This is not theory. It is the exact path we walked, and the one thousands of hosts in our community are walking now.'},

  {t:'stats',kicker:'Part three · proof of the model',h:'The machine in numbers',stats:[['0 to 24','doors in 18 months, none of them owned'],['60+','doors across multiple U.S. cities today'],['~4 hrs','a week to keep a portfolio running'],['Top 25%','Superhost ranking the system is built to reach']]},

  {t:'why',kicker:'Why listen to us',h:'We built this the hard way first',lede:'Julian rented his basement to live mortgage free, then interviewed the best hosts on the Short Term Rental Success Stories podcast. Jon went from zero to twenty-four doors in eighteen months while working full time in IT. We teach only what we have run ourselves.',note:'Short Term Sage has grown a community of thousands of hosts since 2019.'},

  {t:'bridge',pill:'The honest part',h:'The model works. The order matters.',lede:'Most people fail here not because the strategy is wrong, but because they try to automate before they have a system, or buy before they have proven the model. Done in the right order, each step pays for the next.',note:'That order is what the VRM Formula is for.'},

  {t:'cta',kicker:'Your next step',h:'Build your Vacation Rental Machine',step:'Join the VRM Formula and we will walk you from your first unit to a system that runs without you.',note:'Everything in this masterclass is one piece of that program.',disc:'Educational only. No income or result is guaranteed. Results vary and depend on your market, your effort, and local laws. The portfolio and income figures shown are our own past results and the experiences of individual hosts, not a promise of what you will earn. Short-term rental businesses carry risk, and local rules and landlord agreements differ by market.'}
];

const total=S.length;
const el=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide';
  const num=`<div class="num">${String(i+1).padStart(2,'0')} / ${total}</div>`;
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${s.kicker}</div>`;
  if(s.pill) inner+=`<div class="pill">${s.pill}</div>`;
  if(s.t==='title') inner+=`<h1>${s.h}</h1>`;
  else inner+=`<h2>${s.h}</h2>`;
  if(s.sub) inner+=`<div class="sub">${s.sub}</div>`;
  if(s.lede) inner+=`<div class="lede">${s.lede}</div>`;
  if(s.bullets){ inner+='<ul>'+s.bullets.map(b=>`<li>${b}</li>`).join('')+'</ul>'; }
  if(s.stats){ inner+='<div class="grid">'+s.stats.map(x=>`<div class="stat"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('')+'</div>'; }
  if(s.step) inner+=`<div class="cta-step">${s.step}</div>`;
  if(s.note) inner+=`<div class="note">${s.note}</div>`;
  if(s.disc) inner+=`<div class="disclaimer">${s.disc}</div>`;
  d.innerHTML=num+inner;
  el.appendChild(d);
});
</script>
</body>
</html>
