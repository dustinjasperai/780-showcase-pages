<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Runs Your Floor — Michelle Pascoe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1416; --panel:#132023; --rule:#1f3236; --accent:#1fb9bf; --ink:#eef5f5; --muted:#9fb6b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Montserrat",system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:"Poppins";font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Poppins";font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:"Poppins";font-weight:600;font-size:34px;line-height:1.12;letter-spacing:-.01em}
  .sub{font-size:20px;color:var(--muted);margin-top:20px;max-width:40ch;line-height:1.5}
  .body{font-size:20px;line-height:1.6;margin-top:18px;max-width:52ch}
  ul{margin-top:22px;list-style:none}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .big{font-family:"Poppins";font-weight:700;font-size:44px;line-height:1.1}
  .big .a{color:var(--accent)}
  .foot{position:absolute;right:28px;bottom:22px;font-size:12px;color:var(--muted);font-family:"Poppins"}
  .num{position:absolute;left:28px;bottom:22px;font-size:12px;color:var(--muted);font-family:"Poppins"}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.5}
  .cta-line{font-family:"Poppins";font-weight:600;font-size:22px;color:var(--accent);margin-top:22px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass for hospitality & club operators',
    h:'Who Runs Your Floor',
    sub:'The managers in the middle decide every guest experience. This is how you build them.'},
  {t:'promise', kick:'What you will leave with',
    h:'One hour, three moves',
    body:'By the end you will know the three moves that turn a good team member into a manager your floor can actually run on, and how to tell who is ready.'},
  {t:'who', kick:'Who this is for',
    h:'Owners and operators of pubs, clubs and gaming venues',
    body:'You carry the standard. You want the floor to run to that standard on the nights you are not there. This is about the layer between you and the frontline.'},
  {t:'trap', kick:'The trap',
    h:'You promoted your best worker and hoped',
    body:'They were brilliant on the floor, so you made them a duty manager. Then they struggled to lead the people they used to work beside, and you quietly picked up the slack again.'},
  {t:'hook', kick:'The uncomfortable truth',
    big:'Your guest experience is not set by <span class="a">you</span>. It is set by whoever is running the floor at 7pm on a Saturday.'},
  {t:'part', kick:'Part one',
    h:'The core problem: the layer nobody develops',
    body:'Venues invest in frontline training and in senior leaders. The duty managers and supervisors in the middle, the ones who actually run each shift, are left to figure it out alone.'},
  {t:'cost', kick:'What it costs you',
    h:'The price of the undeveloped middle',
    list:['Inconsistent nights, because the standard walks out when you do','Your best people leave, because stepping up felt like being set up to fail','You cannot step away, because the floor still needs you in the room']},
  {t:'why', kick:'Why it backfires',
    h:'Great on the floor is not the same as ready to lead it',
    body:'The skills that made someone your best team member are not the skills that make them a leader. Nobody showed them the difference, so they manage tasks and avoid the hard conversations.'},
  {t:'part', kick:'Part two',
    h:'The Middle Management Movement',
    sub:'A clear path that turns supervisors into leaders, so they lead well, not just manage.'},
  {t:'pillar', kick:'Pillar one',
    h:'Buddy to Boss',
    body:'The hardest shift in hospitality: leading the people you used to work beside. Setting standards without losing the team, and delegating the floor instead of carrying it.'},
  {t:'pillar', kick:'Pillar two',
    h:'Lead a multigenerational team',
    body:'Your floor spans several generations at once. We cover what actually keeps younger staff engaged and present, instead of guessing why they leave.'},
  {t:'pillar', kick:'Pillar three',
    h:'Hold the line on boundaries',
    body:'Calm, clear boundaries are what let a manager lead under pressure without burning out or becoming the villain. This is the piece most training skips entirely.'},
  {t:'lens', kick:'The behavioural lens',
    h:'Extended DISC: read the team you already have',
    body:'Fifteen years applying behavioural profiling on hospitality floors. You learn how each person communicates, decides and responds under pressure, so you lead them as they are, not as you assume.'},
  {t:'evidence', kick:'The evidence',
    h:'The gap between how you think the floor runs and how it runs',
    body:'Independent guest-experience audits almost always reveal the same thing: the standard is clear at the top and dissolves in the middle. You cannot fix a layer you cannot see.'},
  {t:'part', kick:'Part three',
    h:'A Saturday night that runs without you',
    sub:'The floor is calm, the team is led, the figures are done, and your phone does not ring.'},
  {t:'standard', kick:'The standard holds',
    big:'Lead well, <span class="a">not just manage</span>.'},
  {t:'why-me', kick:'Why listen to me',
    h:'Michelle Pascoe',
    body:'Founder of Optimum Operating Procedures and Services since 1994, a Certified Speaking Professional, and the creator of the Middle Management Movement. Thirty years helping hospitality, gaming and club venues build the people who run their floors.'},
  {t:'recap', kick:'The three moves',
    h:'What to do with this',
    list:['Stop promoting on floor skill alone; develop the shift into leadership','Give your middle managers the Buddy to Boss transition on purpose','Lead each person as they are, using how they actually communicate and decide']},
  {t:'cta', kick:'Your next step',
    h:'Build the layer that runs your floor',
    cta:'Explore the Middle Management Movement at michellepascoe.com',
    disc:'This masterclass is educational. Nothing in this session is guaranteed and no income or business result is promised. Results vary by venue, team and effort.'}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.h) html += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if(s.big) html += '<div class="big">'+s.big+'</div>';
  if(s.sub) html += '<div class="sub">'+s.sub+'</div>';
  if(s.body) html += '<div class="body">'+s.body+'</div>';
  if(s.list){ html += '<ul>'; s.list.forEach(x=>html+='<li>'+x+'</li>'); html += '</ul>'; }
  if(s.cta) html += '<div class="cta-line">'+s.cta+'</div>';
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  html += '<div class="num">'+(i+1)+' / '+S.length+'</div>';
  html += '<div class="foot">Michelle Pascoe</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
