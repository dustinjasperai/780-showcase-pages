<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life After the Exit — a masterclass by Paul Kuveke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffcf4;        /* their warm cream page ground (brand) */
    --panel:#f6f4e9;     /* their secondary cream panel (brand) */
    --rule:#d9cfb8;      /* hairline, cream/gold family */
    --ink:#171717;       /* their near-black text (brand) */
    --ink-soft:#353d44;  /* their slate text (brand) */
    --navy:#09264b;      /* their deep-navy header (brand) */
    --accent:#c5a059;    /* their gold accent (brand, 24 uses) */
    --display:"EB Garamond", Georgia, serif;
    --body:"Instrument Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 72px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 56px 52px;
    margin:0 0 22px;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .eyebrow{font-family:var(--body);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(38px,6vw,62px);line-height:1.04;color:var(--navy);letter-spacing:.3px}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.5vw,46px);line-height:1.08;color:var(--navy)}
  .lead{font-family:var(--display);font-style:italic;font-size:clamp(22px,3vw,30px);line-height:1.3;color:var(--ink-soft);margin-top:18px}
  p.body{font-size:18px;line-height:1.62;color:var(--ink-soft);margin-top:18px;max-width:62ch}
  .kicker{font-family:var(--display);font-size:20px;color:var(--navy);font-weight:600;margin-top:8px}
  .num{font-family:var(--display);font-size:16px;color:var(--accent);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  ul li{font-size:18px;line-height:1.5;color:var(--ink-soft);padding-left:26px;position:relative}
  ul li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .q{font-family:var(--display);font-style:italic;font-size:clamp(24px,3.4vw,34px);line-height:1.28;color:var(--navy)}
  .terr{display:flex;align-items:baseline;gap:18px}
  .terr .n{font-family:var(--display);font-size:clamp(44px,7vw,78px);color:var(--accent);font-weight:600;line-height:1}
  .steps{display:grid;gap:18px;margin-top:26px}
  .step{border-left:2px solid var(--accent);padding:4px 0 4px 20px}
  .step .st{font-family:var(--display);font-size:24px;color:var(--navy);font-weight:600}
  .step .sd{font-size:16px;color:var(--ink-soft);margin-top:4px}
  .cta h2{color:var(--navy)}
  .cta .act{margin-top:24px;display:inline-block;font-family:var(--body);font-weight:600;font-size:16px;color:var(--bg);background:var(--navy);padding:14px 26px;border-radius:999px}
  .disclaimer{margin-top:26px;font-size:12.5px;line-height:1.5;color:#8a8577;max-width:60ch}
  .brandline{margin-top:20px;font-family:var(--display);font-size:18px;color:var(--ink-soft)}
  .foot{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9a927f;position:absolute;right:26px;bottom:18px;font-weight:600}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass', h1:'Life After the Exit',
    lead:'The five territories you cross when the money is handled, but the meaning is not.' },

  {t:'who', eyebrow:'Who this is for',
    h2:'You built something real. Then it ended.',
    body:'Founders who sold. Executives at the end of a vesting cycle or a long career. Inheritors who woke up responsible for a number they did not build. The spreadsheet part is solved. This is about the part that is not.' },

  {t:'hook', eyebrow:'The part no one warns you about',
    q:'"Everyone keeps congratulating me, and I feel worse than I did before."',
    body:'That is not ingratitude. It is what happens when the thing that organized your days, your identity, and your sense of forward motion quietly disappears on the same day everyone calls it a win.' },

  {t:'promise', eyebrow:'What you will leave with',
    h2:'By the end of this hour.',
    items:['A language for what you are feeling, so it stops being shapeless and nameless','A map of the five territories ahead, and where you are standing in it','One honest next question to carry into your next chapter'] },

  {t:'part', num:'Part One', h2:'The real loss is structure, not money.',
    body:'For years the work told you who you were, what mattered today, and what came next. Remove it and three things go missing at once: identity, rhythm, and direction. Most advice rushes you to a new goal. The work is slower and more honest than that.' },

  {t:'contrast', eyebrow:'Why the usual playbook fails',
    h2:'You cannot productivity your way out of this.',
    body:'A new venture, a packed calendar, a bigger goal. These are the reflexes of a high achiever, and they work right up until the quiet comes back. The reflex that built the success is not the one that carries you through the after.' },

  {t:'questions', eyebrow:'The four questions underneath it',
    items:['Is this it?','Who am I without the work that defined me?','What is this wealth actually for?','Who can I talk to about any of this?'] },

  {t:'part', num:'Part Two', h2:'A map: the Five Territories.',
    body:'The work moves through five territories as they become relevant. Not a linear program, a terrain. You cross them in your own order, at the pace of the work and not the pace of pressure.' },

  {t:'terr', num:'01', h2:'Completion',
    body:'The quiet difficulty of finishing. Even a chosen ending carries a real loss, and naming it is where the work begins.' },
  {t:'terr', num:'02', h2:'Identity',
    body:'Who you are beyond the role, the title, and the brand. Rebuilding a sense of self that does not depend on the next deal.' },
  {t:'terr', num:'03', h2:'External Expectations',
    body:'Managing the assumptions of family, friends, and a culture that thinks the number was the finish line.' },
  {t:'terr', num:'04', h2:'Purpose and Direction',
    body:'Finding what calls you forward when the conventional scripts, retire, relax, repeat, no longer fit who you are.' },
  {t:'terr', num:'05', h2:'Relationship with Wealth',
    body:'Making peace with the new financial reality itself. Stewardship, generosity, and what the wealth is actually for.' },

  {t:'steps', eyebrow:'How the work unfolds',
    h2:'Three movements.',
    steps:[
      ['Clarify','What matters now, and what no longer fits.'],
      ['Reclaim','Your identity beyond the boardroom or the brand.'],
      ['Create','A new vision, and a life driven by values rather than pressure.']
    ] },

  {t:'timing', eyebrow:'When the work lands best',
    h2:'Before, during, or just after.',
    body:'Some come a year out from a sale, wanting to cross the threshold on purpose instead of by accident. Some come in the fog of the first months after. Both work. The earlier the conversation starts, the less disorienting the crossing tends to be.' },

  {t:'what', eyebrow:'What the work actually is',
    h2:'Not therapy. Not financial planning.',
    body:'This is not advice from the outside. It is a walk alongside someone who spent 35 years inside the world of wealth and watched smart, successful people hit this exact wall. "I will not rescue you. I will walk beside you." We move at the pace of the work.' },

  {t:'why', eyebrow:'Why me',
    h2:'Thirty-five years inside the room.',
    body:'I spent 35 years as a wealth advisor, and I founded and sold financial businesses of my own. Credentialed to the back teeth, CPWA, ChFC, CAP, CLU, and I learned that the advisory world is simply not built to hold the identity and meaning side of a transition. So I built something that is.' },

  {t:'posture', eyebrow:'How we would work together',
    h2:'At the pace of the work.',
    body:'Not a curriculum to race through. A walk alongside someone who has sat with hundreds of successful people at exactly this threshold. "I will not rescue you. I will walk beside you." You set the pace, I bring the map and the questions.' },

  {t:'cta', eyebrow:'The next step',
    h2:'Start with a conversation.',
    body:'If any of this landed, the first step is a complimentary 30-minute Clarity Call. No pressure, no pitch. We just look at what is missing and what is possible for your next chapter.',
    act:'Schedule a Clarity Call',
    brandline:'Paul Kuveke  ·  Advisory, Mentoring, Coaching',
    disclaimer:'This masterclass is educational and reflects one practitioner’s experience. It is not financial, legal, tax, or therapeutic advice. No income or result is guaranteed. Results vary from person to person.' }
];

const deck = document.getElementById('deck');
function esc(x){return (x||'').toString();}
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta':'');
  let h = '';
  if(s.eyebrow) h += '<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.num && s.t!=='terr') h += '<div class="num">'+esc(s.num)+'</div>';
  if(s.h1) h += '<h1>'+esc(s.h1)+'</h1>';
  if(s.t==='terr'){
    h += '<div class="terr"><span class="n">'+esc(s.num)+'</span><h2>'+esc(s.h2)+'</h2></div>';
  } else if(s.h2){
    h += '<h2>'+esc(s.h2)+'</h2>';
  }
  if(s.lead) h += '<div class="lead">'+esc(s.lead)+'</div>';
  if(s.q) h += '<div class="q">'+esc(s.q)+'</div>';
  if(s.items){ h += '<ul>'+s.items.map(x=>'<li class="q" style="padding-left:26px">'+esc(x)+'</li>').join('')+'</ul>'; }
  if(s.steps){ h += '<div class="steps">'+s.steps.map(p=>'<div class="step"><div class="st">'+esc(p[0])+'</div><div class="sd">'+esc(p[1])+'</div></div>').join('')+'</div>'; }
  if(s.body) h += '<p class="body">'+esc(s.body)+'</p>';
  if(s.act) h += '<div class="act">'+esc(s.act)+'</div>';
  if(s.brandline) h += '<div class="brandline">'+esc(s.brandline)+'</div>';
  if(s.disclaimer) h += '<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
  h += '<div class="foot">Life After the Exit</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
