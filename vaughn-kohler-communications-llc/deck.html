<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Work Beneath the Work, a live masterclass with Vaughn Kohler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f6f4ef;   /* warm parchment (his light scheme) */
    --panel:#ffffff;
    --ink:#2a2f38;       /* near his body slate #353d4c/#333 */
    --head:#003349;      /* his dominant / H1 color, verbatim */
    --rule:#d9d3c7;      /* warm hairline */
    --accent:#a07b48;    /* his bronze/gold accent, verbatim */
    --muted:#6b7078;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--ground);color:var(--ink);font-family:'Spectral',Georgia,serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:64px 60px;margin:20px 0;min-height:520px;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .slide::before{content:attr(data-kicker);position:absolute;top:26px;left:60px;font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .n{position:absolute;top:26px;right:60px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.12em;color:var(--muted)}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(38px,6vw,64px);line-height:1.03;color:var(--head);letter-spacing:-.01em}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(28px,4.4vw,44px);line-height:1.08;color:var(--head)}
  .sub{font-size:clamp(19px,2.4vw,26px);color:var(--ink);margin-top:22px;max-width:30ch;font-weight:400}
  .lead{font-size:clamp(20px,2.5vw,27px);max-width:34ch}
  .big{font-family:'Oswald',sans-serif;font-weight:500;font-size:clamp(30px,4.6vw,46px);color:var(--head);line-height:1.12;max-width:20ch}
  p.body{font-size:clamp(17px,1.9vw,21px);max-width:52ch;margin-top:18px;color:var(--ink)}
  .section h2{font-size:clamp(34px,5.2vw,56px)}
  .section .part{font-family:'Oswald',sans-serif;font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
  .rule{width:64px;height:3px;background:var(--accent);border:0;margin:26px 0}
  ul{list-style:none;margin-top:22px}
  ul li{font-size:clamp(18px,2vw,23px);padding:14px 0 14px 42px;position:relative;border-top:1px solid var(--rule);max-width:56ch}
  ul li:first-child{border-top:0}
  ul li::before{content:counter(q);counter-increment:q;position:absolute;left:0;top:12px;font-family:'Oswald',sans-serif;font-weight:600;color:var(--accent);font-size:20px}
  .qs{counter-reset:q}
  .quote{font-size:clamp(24px,3.2vw,38px);color:var(--head);font-weight:500;font-style:italic;max-width:24ch;line-height:1.14}
  .cite{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:22px}
  .cta h2{font-size:clamp(32px,4.8vw,52px)}
  .cta .btn{display:inline-block;margin-top:30px;background:var(--head);color:#fff;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.04em;font-size:20px;padding:16px 34px;border-radius:4px;text-decoration:none}
  .disclaimer{margin-top:34px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5;font-family:'Spectral',serif}
  .kv{display:grid;grid-template-columns:1fr;gap:0;margin-top:18px}
  .kv div{border-top:1px solid var(--rule);padding:13px 0;font-size:clamp(16px,1.8vw,20px);max-width:58ch}
  .credit{font-size:16px;color:var(--muted);margin-top:20px;max-width:52ch}
  @media(max-width:640px){.slide{padding:52px 26px;min-height:auto}.slide::before,.n{left:26px}.n{right:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title'},
 {t:'audience'},
 {t:'trap'},
 {t:'hook'},
 {t:'section',part:'Part One',h:'Why more tactics stopped working'},
 {t:'content',kicker:'The tactics ceiling',h:'Every program you bought taught you what to DO.',b:'None of them formed who you are while you were doing it. So the revenue moved and the weight on you did not. That is the ceiling tactics always hit.'},
 {t:'content',kicker:'The gap in the training',h:'You were trained to treat, not to lead.',b:'Clinical training builds an extraordinary clinician. It leaves quiet gaps around identity, leadership, and boundaries. Those gaps, not the workload alone, are what wear a practice owner down.'},
 {t:'quote',q:'As the leader goes, so goes the organization.',cite:'The premise of everything that follows'},
 {t:'section',part:'Part Two',h:'The Work Beneath the Work'},
 {t:'content',kicker:'Formation, not information',h:'Paideia: forming the person, not just informing them.',b:'Information tells you what to do next. Formation changes who is doing it. A practice led by a formed owner grows differently than one run by an exhausted expert following a checklist.'},
 {t:'framework'},
 {t:'content',kicker:'Question one',h:'Who am I?',b:'Underneath the title of owner, physician, or founder is a person. When the role and the person drift apart, every decision gets heavier. Naming who you actually are is where formation starts.'},
 {t:'content',kicker:'Questions two and three',h:'What do I want, and what am I afraid of?',b:'Desire and fear are the real engines behind how you lead, hire, and hold your limits. Most owners have never said either one out loud. Once you do, the pattern in your practice suddenly makes sense.'},
 {t:'content',kicker:'Question four',h:'What is my next step?',b:'Formation is not a mood. It becomes one concrete, honest next step, taken as the leader you are becoming rather than the one who is running on empty.'},
 {t:'section',part:'Part Three',h:'When the leader is formed, the practice follows'},
 {t:'content',kicker:'The shift owners feel',h:'Clean decisions. A steadier team. Growth that stops costing you your peace.',b:'When the leader is formed, the organization stops absorbing the owner’s unspoken fear. Decisions get cleaner, the team steadies, and scale stops feeling like a threat to your life.'},
 {t:'content',kicker:'The compassion multiplier',h:'Big-hearted leadership reaches the bottom line.',b:'Compassion is not soft. It shapes culture, retention, and how an organization performs. It is the throughline of Big-Hearted Leadership, the book I co-wrote with healthcare executive Donn Sorensen.'},
 {t:'why'},
 {t:'recap'},
 {t:'cta',head:'Book a Conversation.',
  body:'If this is the layer you have been missing, let’s talk about what formation looks like for you and your practice.',
  btn:'Book a Conversation with Vaughn',
  href:'https://www.vaughnkohler.com/book-a-call-with-me',
  disclaimer:'Educational content only. This masterclass shares a leadership and formation approach; it is not medical, psychological, financial, or legal advice, and it is not a substitute for professional care. No income or specific result is guaranteed. Results vary from person to person.'}
];

function render(s,i){
  const num='<span class="n">'+(i+1)+' / '+S.length+'</span>';
  if(s.t==='title') return `<section class="slide" data-kicker="A live masterclass with Vaughn Kohler">${num}
    <h1>The Work Beneath the Work</h1>
    <div class="sub">Why the growth of your practice starts with the formation of its leader.</div>
    <hr class="rule"></section>`;
  if(s.t==='audience') return `<section class="slide" data-kicker="Who this is for">${num}
    <h2>For the practice you built that the person leading it hasn’t caught up to.</h2>
    <p class="body">This is for the medical or aesthetic practice owner who has scaled the business, added the team and the systems, and still carries a weight that revenue never touched.</p></section>`;
  if(s.t==='trap') return `<section class="slide" data-kicker="The trap">${num}
    <div class="big">You added the marketing. You added the systems. You added the team.</div>
    <p class="body">The revenue moved. The weight on you did not. So you go looking for the next tactic, and the cycle repeats.</p></section>`;
  if(s.t==='hook') return `<section class="slide" data-kicker="The reframe">${num}
    <div class="quote">Burnout is not a workload problem. It is a formation problem.</div>
    <p class="body">That single reframe is the reason more effort keeps failing, and it is where a different kind of work begins.</p></section>`;
  if(s.t==='section') return `<section class="slide section" data-kicker="Masterclass">${num}
    <div class="part">${s.part}</div><h2>${s.h}</h2><hr class="rule"></section>`;
  if(s.t==='content') return `<section class="slide" data-kicker="${s.kicker}">${num}
    <h2>${s.h}</h2><p class="body">${s.b}</p></section>`;
  if(s.t==='quote') return `<section class="slide" data-kicker="The premise">${num}
    <div class="quote">${s.q}</div><div class="cite">${s.cite}</div></section>`;
  if(s.t==='framework') return `<section class="slide" data-kicker="The framework">${num}
    <h2>The Four Questions</h2>
    <p class="body">Everything meaningful in your leadership flows from honest answers to four questions. This is the diagnostic underneath the whole method.</p>
    <ul class="qs">
      <li>Who am I?</li>
      <li>What do I want?</li>
      <li>What am I afraid of?</li>
      <li>What is my next step?</li>
    </ul></section>`;
  if(s.t==='why') return `<section class="slide" data-kicker="Why me">${num}
    <h2>Why I teach this.</h2>
    <div class="kv">
      <div>A decade as a pastor, then over 1,000 hours coaching clinicians through burnout and leadership.</div>
      <div>Author of Sacred Drive and Overcoming Overwhelm, co-author of Big-Hearted Leadership.</div>
      <div>Host of the Clinician, Heal Thyself podcast, and a mentor inside the Charismedx mastermind for medical and aesthetic entrepreneurs.</div>
    </div>
    <p class="credit">I am not here to hand you another system. I am here to help you become the leader your practice already needs.</p></section>`;
  if(s.t==='recap') return `<section class="slide" data-kicker="The invitation">${num}
    <div class="big">You do not need one more tactic. You need the work beneath the work.</div>
    <p class="body">Who am I. What do I want. What am I afraid of. What is my next step. Answer those honestly, and your practice starts to move with you instead of against you.</p></section>`;
  if(s.t==='cta') return `<section class="slide cta" data-kicker="Your next step">${num}
    <h2>${s.head}</h2>
    <p class="body">${s.body}</p>
    <a class="btn" href="${s.href}">${s.btn}</a>
    <div class="disclaimer">${s.disclaimer}</div></section>`;
  return '';
}
document.getElementById('deck').innerHTML=S.map(render).join('');
</script>
</body>
</html>
