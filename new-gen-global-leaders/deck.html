<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leading Across Generations — New Gen Global Leaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Besley:wght@600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#f7f3ef;
    --ink:#211311;
    --muted:#6b5a55;
    --accent:#370404;
    --hair:#e4dad3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--hair);border-radius:14px;padding:56px 56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide.dark{background:var(--accent);color:#f7ece9;border-color:var(--accent)}
  .slide.panel{background:var(--panel)}
  .eyebrow{font-family:"Besley",serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:20px}
  .slide.dark .eyebrow{color:#e8b7ad}
  h1{font-family:"Besley",serif;font-weight:800;font-size:52px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"Besley",serif;font-weight:700;font-size:34px;line-height:1.1;margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:62ch}
  .slide.dark p{color:#f3e2de}
  p.lead{font-size:22px;color:var(--muted)}
  .slide.dark p.lead{color:#eccbc3}
  .sub{font-size:20px;color:var(--muted);margin-top:6px}
  ul{list-style:none;margin-top:12px}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 30px;border-bottom:1px solid var(--hair);position:relative}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:23px;width:12px;height:12px;background:var(--accent);border-radius:50%}
  .slide.dark li{border-color:rgba(255,255,255,.15)}
  .slide.dark li:before{background:#e8b7ad}
  .pillar{font-family:"Besley",serif;font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
  .num{font-family:"Besley",serif;font-weight:800;font-size:76px;color:var(--accent);opacity:.18;position:absolute;top:28px;right:44px;line-height:1}
  .brandline{margin-top:30px;font-family:"Besley",serif;font-weight:700;letter-spacing:.06em;font-size:14px;color:var(--muted)}
  .disclaimer{margin-top:22px;font-size:13px;color:var(--muted);line-height:1.5;max-width:60ch}
  .cta-steps{margin-top:14px}
  .cta-steps li{border:0;padding:8px 0 8px 30px}
  .pagenum{position:absolute;bottom:20px;right:26px;font-size:12px;color:var(--muted);font-family:"Besley",serif}
  .slide.dark .pagenum{color:#c99a90}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Lillit Cholakian',h:'Leading Across Generations',sub:'How to unite a four-generation team around values that hold, so the generation gap stops costing you people, time and momentum.',brand:'New Gen Global Leaders'},

  {t:'who',eyebrow:'Who this is for',h:'You lead people who grew up in different worlds',p:'If your team spans boomers, Gen X, millennials and Gen Z, you already feel it. What motivates one group lands flat with another. This hour is for the leader who refuses to run four different playbooks to hold one team together.'},

  {t:'trap',eyebrow:'The trap',h:'Managing each generation separately',p:'Most leaders try to decode each generation and manage them one at a time. More surveys, more perks, more workarounds. It is exhausting, it never ends, and the moment the trend shifts you are back to guessing.'},

  {t:'reframe',cls:'dark',eyebrow:'The reframe',h:'The gap was never generational',p:'The friction on your team is not a personality problem or an age problem. It is a values problem. When people cannot see the shared values underneath the work, every difference becomes a fight. Name the values and the differences become range, not division.'},

  {t:'part',cls:'panel',eyebrow:'Part one',h:'Why the usual fixes keep failing'},

  {t:'point',num:'1',eyebrow:'The real problem',h:'Four rulebooks, one team',p:'Each generation brings its own unspoken rules about respect, feedback, loyalty and time. Left unnamed, those rules collide quietly for months before they ever surface as a conflict you can see.'},

  {t:'point',num:'2',eyebrow:'The real problem',h:'Tactics date faster than people',p:'The communication hack that worked last year is already stale. If your leadership is built on tactics, you are always one trend behind your own team. What does not date is a clear set of values everyone can lead from.'},

  {t:'part',cls:'panel',eyebrow:'Part two',h:'The values-based model'},

  {t:'pillar',pillar:'Pillar one',h:'The Leader Within',p:'Before you lead a mixed team you lead yourself. We start with honest self-awareness: naming the self-limiting beliefs that run you, and choosing intentional seasons instead of constant multitasking. A grounded leader reads a room across any generation.'},

  {t:'pillar',pillar:'Pillar two',h:'Take Your Train',p:'No leader builds alone. You take your train and bring others on the journey with you: staff your weaknesses, gather the right collaborators, and build the team around the mission rather than around yourself. This is how trust crosses the age lines.'},

  {t:'pillar',pillar:'Pillar three',h:'Values That Hold',p:'We surface the handful of values that are true across every generation on your team, and make them the operating standard. Timeless, global, generation-proof. Decisions, feedback and hiring all run through them, so the team stops arguing about style and starts aligning on substance.'},

  {t:'connect',cls:'panel',eyebrow:'How it fits together',h:'Self, then team, then standard',p:'The Leader Within steadies you. Take Your Train builds the people around you. Values That Hold give the whole team one language. Each pillar makes the next one possible, and together they turn a generationally split group into one aligned team.'},

  {t:'part',cls:'panel',eyebrow:'Part three',h:'When the model is running on your team'},

  {t:'scene',eyebrow:'In practice',h:'Range instead of division',p:'The twenty-four year old and the fifty-eight year old stop talking past each other because they are both pointed at the same named values. Their differences become useful range: speed and perspective, energy and judgment, on the same side.'},

  {t:'scene',eyebrow:'In practice',h:'Decisions get faster',p:'When everyone knows the values the team leads from, you stop relitigating every call. People make more decisions without you, and they make them the way you would, because the standard is shared and clear.'},

  {t:'why',cls:'panel',eyebrow:'Why learn this from me',h:'I have spent a decade building leaders across generations',p:'I am Lillit Cholakian, founder of New Gen Global Leaders. I am a Certified John C. Maxwell Coach, Speaker and Trainer, a member of the Forbes Coaches Council, and I lead the Next-Gen track at NAWBO-LA. My values-based transformation work is multi-generational, global and timeless, and I have used it with leaders in companies, government, hospitals, schools and more.'},

  {t:'recap',eyebrow:'The model, in one line',h:'Lead yourself, build your people, set values that hold',p:'That is how you lead across generations without running four playbooks: The Leader Within, Take Your Train, and Values That Hold.'},

  {t:'cta',eyebrow:'Your next step',h:'Bring this to your team',sub:'If you want help turning these three pillars into the operating standard for your own multigenerational team, that is exactly what we do inside New Gen Global Leaders through coaching and mastermind programs. Reach out and let us map it to your team.',brand:'New Gen Global Leaders',disclaimer:'This masterclass is for educational purposes only. It shares a leadership framework and ideas, not guaranteed outcomes. Leadership results vary and depend on your own effort, team and circumstances.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.cls?' '+s.cls:'');
  let h='';
  if(s.num) h+='<div class="num">'+s.num+'</div>';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.pillar) h+='<div class="pillar">'+s.pillar+'</div>';
  if(s.h) h+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.sub) h+='<p class="lead">'+s.sub+'</p>';
  if(s.p) h+='<p>'+s.p+'</p>';
  if(s.brand) h+='<div class="brandline">'+s.brand+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  h+='<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
