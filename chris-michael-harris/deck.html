<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Content to Customers Masterclass · Chris Michael Harris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#05050a; --panel:#101019; --rule:#2a2a33;
    --gold:#f0a93c; --sig:#a8a199; --chalk:#edeae4; --grey:#c9c4bc; --dim:#7c766d;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Manrope',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:2.4vh}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:400;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:5vw}
  .t-normal h1{font-size:3.4vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-size:1.85vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Manrope',sans-serif;font-size:1.4vw;font-weight:700;color:var(--sig);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#161018 0%,#020204 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:86%;font-style:italic;color:#f4f1ea}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#161018 0%,#020204 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.2vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--gold);color:#f6d9a8;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .sig-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-sig{right:7.5%;bottom:8%;width:23vw}
  .corner-sig{right:6%;bottom:7.5%;width:10vw;opacity:.42}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--gold);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Business Lounge</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- content-to-customer signal: hollow content nodes tracked by an amber line to a filled customer node -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="sig" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="122" x2="246" y2="122" stroke="#a8a199" opacity="0.35"/>
    <path d="M28 118 L92 96 L156 66 L220 34" stroke="#f0a93c" opacity="0.92"/>
    <circle cx="28" cy="118" r="4.6" fill="none" stroke="#a8a199" stroke-width="2.2"/>
    <circle cx="92" cy="96" r="4.6" fill="none" stroke="#a8a199" stroke-width="2.2"/>
    <circle cx="156" cy="66" r="4.6" fill="none" stroke="#a8a199" stroke-width="2.2"/>
    <circle cx="220" cy="34" r="6.4" fill="#f0a93c" stroke="#f0a93c" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Content to Customers Masterclass',sub:'How to turn the content you already make into customers, using AI the right way.',brand:true,sig:'title'},
 {t:'normal',k:'Who this is for',title:'You are already making the content.',body:'You show up, you post, you record. It just is not turning into customers the way it should. And every week another AI tool promises to be the fix.'},
 {t:'dark',title:'You do not have a content problem, and AI is not the answer. You have a system problem.'},

 {t:'section',idx:'Part One',title:'The Content Treadmill'},
 {t:'normal',k:'Why it feels stuck',title:'More content and more tools, same result.',body:'Posting more and buying every new tool adds work, not customers, because nothing connects what you publish to the people who would actually buy from you.'},
 {t:'normal',k:'The hype tax',title:'Chasing every new tool costs you the thing that compounds.',body:'Each shiny tool resets your attention and your voice. Meanwhile the audience that already follows you never gets walked to a decision, so the trust you built quietly leaks away.'},
 {t:'dark',title:'You are not behind. You are missing the system that turns content into customers.'},

 {t:'section',idx:'Part Two',title:'The Content to Customers Method'},
 {t:'normal',k:'Start from one anchor',title:'One real asset, not a content calendar.',body:'It starts with a single anchor piece that says the one thing only you can say. Everything else gets built from that, so you are never staring at a blank calendar again.'},
 {t:'normal',k:'Multiply with frameworks, not hype',title:'Let AI do the reps. You keep the judgment.',body:'AI turns that one asset into a week of content across your channels. The difference is not a smarter model, it is the framework baked into the generation. You direct, it drafts, your voice stays yours.'},
 {t:'normal',k:'Followers to superfans',title:'Turn a small audience into paying customers.',body:'A few hundred of the right people, walked from watching to trusting to buying, out-earns a huge audience nobody ever asks. Content earns the trust. The path asks for the sale.'},
 {t:'dark',title:'Content should compound into customers. AI multiplies the system. It is not the system.'},

 {t:'section',idx:'Part Three',title:'One Post, One Customer'},
 {t:'normal',k:'Signal over noise',title:'What is coming, what is working, what to ignore.',body:'The weekly discipline is triage. A short list of the few AI and marketing moves worth your time, and permission to ignore the rest. That is what keeps the system running without eating your week.'},
 {t:'normal',k:'The one path',title:'Every piece of content points somewhere.',body:'The fix is rarely more content. It is making sure each piece leads to a single clear next step, so the people who are ready can raise their hand instead of scrolling past you.'},
 {t:'dark',title:'Busy is not the goal. A path from one post to one customer is the goal.'},

 {t:'section',idx:'Why listen to me on this',title:'I Test It With Real Money First'},
 {t:'normal',k:'Why me',title:'I run every move inside a real business before I teach it.',body:'I built and scaled companies before this, and now I test each AI and marketing play with real money first. What you get is only the handful that actually worked, in plain language, no hype and no homework.'},

 {t:'cta',title:'Ready to turn your content into customers?',chips:['Come inside The Business Lounge','Book a strategy call'],disc:'Educational content for business owners. No income, revenue, or business result is guaranteed. Results vary by owner, business, and market.'},
];

const deck=document.getElementById('deck');
function sig(kind){return `<svg class="sig-motif ${kind==='title'?'title-sig':'corner-sig'}"><use href="#sig"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Business <b>Lounge</b> · Chris Michael Harris</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.sig) h+=sig(s.sig);
  else if(s.t==='title') h+=sig('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
