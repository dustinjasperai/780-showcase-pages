<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Layer Is Leaking? - Maria Chisolm, Layers Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf2e3;        /* layers.consulting body ground (cream) */
    --panel:#fbf3e6;     /* raised card */
    --ink:#141414;       /* brand near-black */
    --muted:#5c5247;     /* warm muted */
    --accent:#97698e;    /* layers.consulting CTA button (plum) */
    --rule:#525c49;      /* ranked brand hex (sage) */
    --head:'Hanken Grotesk',system-ui,sans-serif;
    --body:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink)}
  body{font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px}
  .slide{
    position:relative;background:var(--bg);border-radius:14px;
    padding:60px 58px;margin:0 0 26px;min-height:540px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(0,0,0,.05);overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:8px;
    background:linear-gradient(180deg,var(--rule),var(--accent));
  }
  .strata{position:absolute;right:0;top:0;bottom:0;width:120px;display:flex;flex-direction:column;opacity:.14}
  .strata span{flex:1}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.01em;margin-bottom:20px}
  .sub{font-size:23px;line-height:1.5;color:var(--muted);margin-top:18px;max-width:40ch}
  p.lead{font-size:22px;line-height:1.55;max-width:46ch}
  p.lead + p.lead{margin-top:16px}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.12;letter-spacing:-.01em;max-width:24ch}
  .foot{position:absolute;left:58px;bottom:30px;font-family:var(--head);font-size:13px;letter-spacing:.04em;color:var(--muted)}
  .n{position:absolute;right:26px;bottom:26px;font-family:var(--head);font-size:12px;color:var(--muted)}
  ul{list-style:none;margin-top:10px}
  li{font-size:21px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid rgba(82,92,73,.18)}
  li::before{content:"";position:absolute;left:0;top:21px;width:16px;height:4px;border-radius:2px;background:var(--accent)}
  li.on{background:rgba(151,105,142,.07)}
  li .tag{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent);margin-left:10px}
  .layers li{counter-increment:ly}
  .layers li .ly{font-family:var(--head);font-weight:700;color:var(--rule);margin-right:12px}
  .cta h1{font-size:46px}
  .btn{display:inline-block;margin-top:26px;font-family:var(--head);font-weight:700;font-size:19px;
    color:#fff;background:var(--accent);padding:16px 30px;border-radius:10px;letter-spacing:.02em}
  .disc{margin-top:26px;font-size:14px;color:var(--muted);max-width:60ch;line-height:1.5}
  .by{font-size:19px;color:var(--muted);margin-top:14px}
  .hl{color:var(--accent);font-weight:600}
  .strike{text-decoration:line-through;text-decoration-color:var(--rule);color:var(--muted)}
  @media(max-width:620px){.slide{padding:40px 28px;min-height:460px}h1{font-size:36px}.big{font-size:30px}.foot{left:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "Maria Chisolm, M.S., CCC-SLP &middot; Layers Consulting";
const S=[
  {t:'title',
   kicker:'A live masterclass',
   h:'Which Layer Is Leaking?',
   sub:'Building a private practice that runs in layers, not all at once.'},

  {t:'who',
   kicker:'Who this is for',
   h2:'You are a great clinician. The business is the part nobody taught.',
   lead:['You went to graduate school to help people communicate. Not to price sessions, build referral pipelines, read a profit and loss statement, or decide when to hire.',
         'So you are booked solid and still not sure the practice is actually working. That gap is not a you problem. It was simply never on the syllabus.']},

  {t:'hook',
   kicker:'The real trap',
   big:'Most owners try to fix all seven parts of their practice at once. That is why nothing moves.'},

  {t:'reframe',
   kicker:'The hidden cost',
   big:'Every month spent working on the <span class="strike">wrong layer</span> is a month the <span class="hl">real leak keeps draining you.</span>'},

  {t:'part',
   kicker:'Part one',
   h2:'The problem is not effort. It is sequence.',
   lead:['When everything feels broken at the same time, the honest move seems to be working harder on all of it. Marketing, money, hiring, compliance, your own burnout.',
         'But a practice is not one machine. It is a stack of layers, and only one of them is usually the thing holding you back this quarter.']},

  {t:'reframe',
   kicker:'A better question',
   big:'Not <span class="strike">how do I fix everything</span>, but <span class="hl">which layer is leaking right now?</span>'},

  {t:'part',
   kicker:'Part two',
   h2:'The seven layers of a private practice.',
   lead:['This is the Layers framework. Each layer is a part of the practice that can be strong, shaky, or quietly leaking. You read them bottom to top, and you only work on the lowest one that is weak.']},

  {t:'layers',
   kicker:'The Layers framework',
   h2:'Read from the foundation up.',
   items:[
     ['Beginner’s Business','the model, who you serve, how you get paid'],
     ['Legal & Compliance','structure, HIPAA, documentation, insurance'],
     ['Financial Management','pricing, cash flow, knowing your numbers'],
     ['Branding & Marketing','referrals, visibility, a steady pipeline'],
     ['Scaling Strategies','systems, hiring, delegating yourself out'],
     ['Clinical Excellence','the care that earns every referral'],
     ['Personal Growth & Wellness','the owner the practice depends on']
   ]},

  {t:'part',
   kicker:'Why order matters',
   h2:'You cannot market your way out of a money problem.',
   lead:['Pour referrals into a practice that has not priced its services properly and you just get busier at a loss. Hire before your systems exist and you buy yourself chaos.',
         'That is why we read from the foundation up. A higher layer can only hold the weight that the layers beneath it are strong enough to carry.']},

  {t:'diag',
   kicker:'Diagnose',
   h2:'How to find your leaking layer.',
   list:[
     ['Money feels tight even when you are busy','Financial Management'],
     ['Great months and empty months, no middle','Branding & Marketing'],
     ['You are the practice, and you cannot step away','Scaling Strategies'],
     ['A quiet worry that paperwork would not hold up','Legal & Compliance']
   ]},

  {t:'hook',
   kicker:'The shift',
   big:'Fix the lowest leaking layer first and the layers above it get easier on their own.'},

  {t:'part',
   kicker:'Part three',
   h2:'What the first fix actually looks like.',
   lead:['You do not rebuild the whole practice. You pick the one leaking layer, make it boringly solid, and let it hold weight for ninety days before you touch the next one.',
         'That is Plan, Protect, Operate in miniature: decide the change, protect it with a simple system, then run it long enough to trust it.']},

  {t:'card',
   kicker:'A ninety day example',
   h2:'If the leak is Branding & Marketing.',
   items:['Name the one referral source you will deepen','Build a single repeatable outreach rhythm you can keep','Track new referrals weekly, not revenue daily','Leave the other six layers alone until this one holds']},

  {t:'card',
   kicker:'A ninety day example',
   h2:'If the leak is Scaling Strategies.',
   items:['Write down the one task only you can truly do','Document a second task well enough to hand off','Train one person on that single task, not ten','Protect your calendar before you add any new clients']},

  {t:'reframe',
   kicker:'A myth to drop',
   big:'More hours is not a growth strategy. It is just the <span class="hl">same leak</span>, worked harder.'},

  {t:'why',
   kicker:'Why me',
   h2:'I have lived both sides of this.',
   lead:['I am Maria Chisolm, a bilingual speech-language pathologist with eighteen years in practice, an adjunct professor, and Vice President of Education for my state association.',
         'I built Layers Consulting and the Private Practice Collective so allied health owners could learn the business skills most of us never got in graduate school, in the order that actually works.']},

  {t:'recap',
   kicker:'What to take with you',
   h2:'Three things, if you remember nothing else.',
   items:['A practice is layers, not one machine','Only the lowest leaking layer matters this quarter','Fix one, let it hold, then climb']},

  {t:'cta',
   kicker:'Your next step',
   h:'Find your leaking layer with me.',
   by:'Book a consult, or join the free Private Practice Collective, and we will name the one layer to work on first.',
   btn:'Book a consult at layers.consulting',
   disc:'This masterclass is for education only. It is not legal, financial, or clinical advice, and it does not guarantee any particular business or income result. Outcomes vary with your situation, effort, and market.'}
];

function strata(){let s='<div class="strata">';for(let i=0;i<7;i++){const c=i%2?'#525c49':'#97698e';s+=`<span style="background:${c}"></span>`}return s+'</div>'}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide '+(s.t==='cta'?'cta':'');
  let h='';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){h+=`<h1>${s.h}</h1><div class="sub">${s.sub}</div>`;}
  else if(s.t==='cta'){h+=`<h1>${s.h}</h1><div class="by">${s.by}</div><span class="btn">${s.btn}</span><div class="disc">${s.disc}</div>`;}
  else if(s.big){h+=`<div class="big">${s.big}</div>`;}
  else{
    if(s.h2) h+=`<h2>${s.h2}</h2>`;
    if(s.lead) s.lead.forEach(p=>h+=`<p class="lead">${p}</p>`);
    if(s.t==='layers'){h+='<ul class="layers">';s.items.forEach((it,n)=>h+=`<li><span class="ly">${n+1}</span>${it[0]}<br><span style="font-size:16px;color:var(--muted)">${it[1]}</span></li>`);h+='</ul>';}
    if(s.t==='diag'){h+='<ul>';s.list.forEach(it=>h+=`<li>${it[0]}<span class="tag">${it[1]}</span></li>`);h+='</ul>';}
    if((s.t==='card'||s.t==='recap')&&s.items){h+='<ul>';s.items.forEach(it=>h+=`<li>${it}</li>`);h+='</ul>';}
  }
  h+=strata();
  if(s.t!=='title'&&s.t!=='cta') h+=`<div class="foot">${BRAND}</div>`;
  h+=`<div class="n">${i+1} / ${S.length}</div>`;
  el.innerHTML=h;deck.appendChild(el);
});
</script>
</body>
</html>
