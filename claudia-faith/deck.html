<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Your First 100 Paid Subscribers on Substack — Claudia Faith</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf7;
    --panel:#f1ede4;
    --ink:#2a2a28;
    --accent:#5ca99d;
    --rule:#a89f91;
    --muted:#8a8378;
    --display:'Playfair Display',Georgia,serif;
    --body:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .slide{
    min-height:100vh;width:100%;padding:8vh 9vw;
    display:flex;flex-direction:column;justify-content:center;
    border-bottom:1px solid rgba(168,159,145,.28);position:relative;
  }
  .slide .num{position:absolute;top:4vh;right:6vw;font-size:13px;letter-spacing:.14em;color:var(--muted)}
  .kicker{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,68px);line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,4.4vw,48px);line-height:1.1}
  .lead{font-size:clamp(18px,2vw,23px);color:var(--ink);max-width:46ch;margin-top:26px}
  .sub{font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:52ch;margin-top:18px}
  ul{list-style:none;margin-top:30px;max-width:54ch}
  li{font-size:clamp(17px,1.8vw,21px);padding:14px 0 14px 30px;position:relative;border-top:1px solid rgba(168,159,145,.3)}
  li:before{content:"";position:absolute;left:0;top:22px;width:11px;height:11px;background:var(--accent);border-radius:2px}
  .stair{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
  .stair .step{background:var(--panel);border:1px solid rgba(168,159,145,.4);border-radius:10px;padding:18px 22px;flex:1;min-width:150px}
  .stair .step b{font-family:var(--display);font-size:20px;display:block;color:var(--accent)}
  .stair .step span{font-size:15px;color:var(--muted)}
  .stair .arw{align-self:center;color:var(--rule);font-size:22px}
  .stat{display:flex;flex-wrap:wrap;gap:40px;margin-top:40px}
  .stat div{min-width:160px}
  .stat b{font-family:var(--display);font-size:clamp(40px,5vw,60px);color:var(--accent);display:block;line-height:1}
  .stat span{font-size:15px;color:var(--muted);letter-spacing:.04em}
  .phase{background:var(--panel);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:22px 26px;margin-top:20px;max-width:60ch}
  .phase b{font-family:var(--display);font-size:21px;display:block;margin-bottom:6px}
  .phase span{color:var(--muted);font-size:16px}
  .cta{background:var(--panel)}
  .cta .btn{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;font-weight:700;padding:16px 34px;border-radius:999px;font-size:18px;letter-spacing:.02em}
  .disclaimer{margin-top:40px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.6}
  .big{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,56px);line-height:1.12;max-width:20ch}
  .big .a{color:var(--accent)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kicker">A free live masterclass with Claudia Faith</div>
    <h1>Get Your First 100 Paid Subscribers on Substack</h1>
    <p class="lead">The exact system that took my Substack from $17 in month one to consistent $5 to $10k months, taught live in 60 minutes.</p>
    <p class="sub">Berg Studio · Wander Wealth · 34,000+ readers in 158 countries</p>
  `},
  {t:'who', cls:'', html:`
    <div class="kicker">Who this is for</div>
    <h2>You are already writing. It just isn't paying yet.</h2>
    <ul>
      <li>You publish consistently, but your growth has gone flat.</li>
      <li>You have subscribers, but almost none of them pay.</li>
      <li>You are sitting on real expertise with no clear way to monetize it.</li>
    </ul>
    <p class="sub">This is not for brand new writers. It is for writers ready to turn a readership into income.</p>
  `},
  {t:'trap', cls:'', html:`
    <div class="kicker">The trap</div>
    <h2>"Post more, grow more" is why your Substack stays free.</h2>
    <p class="lead">Most writers are told the answer is always more volume. So they write harder, the list creeps up, and the revenue stays at zero.</p>
    <p class="sub">More readers is not the same as more income. A bigger free list that never gets asked is still a free list.</p>
  `},
  {t:'reframe', cls:'', html:`
    <div class="kicker">The reframe</div>
    <p class="big">A free audience isn't an asset until you <span class="a">ask</span> it. Most writers never build the ask.</p>
    <p class="sub">The gap between 34,000 free readers and $0 is not talent or traffic. It is a missing system.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="kicker">Part one</div>
    <h2>The three numbers that decide whether a Substack earns.</h2>
    <p class="lead">Most writers track only one of them, and it is the least important one: raw subscriber count.</p>
  `},
  {t:'numbers', cls:'', html:`
    <div class="kicker">The three numbers</div>
    <ul>
      <li><b>Discovery.</b> How many new readers find you each week, and from where.</li>
      <li><b>Conversion.</b> What share of readers become paying members, and when.</li>
      <li><b>Retention.</b> How long a paying member stays, which is where the real money lives.</li>
    </ul>
    <p class="sub">Fix the order of these and the income follows. Chase subscriber count alone and it never does.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="kicker">Part two</div>
    <h2>The model: Notes, free letter, paid tier, a business on top.</h2>
    <p class="lead">Every piece feeds the next. This is how a Substack compounds instead of plateauing.</p>
    <div class="stair">
      <div class="step"><b>Notes</b><span>where new readers find you</span></div>
      <div class="arw">&rarr;</div>
      <div class="step"><b>Free letter</b><span>where trust is built</span></div>
      <div class="arw">&rarr;</div>
      <div class="step"><b>Paid tier</b><span>where readers become members</span></div>
      <div class="arw">&rarr;</div>
      <div class="step"><b>Business</b><span>products and offers on top</span></div>
    </div>
  `},
  {t:'pillar', cls:'', html:`
    <div class="kicker">Pillar one · Growth that compounds</div>
    <h2>The Notes growth engine.</h2>
    <ul>
      <li>The Notes system that brought in almost half of my subscribers.</li>
      <li>A profile that actually converts a visitor into a reader.</li>
      <li>A 30-minute Sunday batching routine, so growth doesn't eat your week.</li>
    </ul>
  `},
  {t:'pillar', cls:'', html:`
    <div class="kicker">Pillar two · Paid income</div>
    <h2>The paid tier, done properly.</h2>
    <ul>
      <li>Positioning the paid tier so it is an obvious yes, not a guilt trip.</li>
      <li>Pricing it for recurring income, not a one-time bump.</li>
      <li>A paywall formula that never feels salesy, because it reads like the free work.</li>
    </ul>
  `},
  {t:'pillar', cls:'', html:`
    <div class="kicker">Pillar three · A business on top</div>
    <h2>Beyond the paywall.</h2>
    <p class="lead">Once the paid tier is working, the same audience supports products, workshops, and offers that stack on top of the subscription.</p>
    <p class="sub">The newsletter stops being the whole business and becomes the engine that feeds it.</p>
  `},
  {t:'machine', cls:'', html:`
    <div class="kicker">The conversion machine</div>
    <h2>How readers turn into paying members.</h2>
    <ul>
      <li>The 90-day window, when a new reader is most likely to convert.</li>
      <li>The welcome email that does half the selling before you ask for anything.</li>
      <li>The paywall placement that turns a casual reader into a member.</li>
    </ul>
  `},
  {t:'ai', cls:'', html:`
    <div class="kicker">The leverage</div>
    <h2>Written by you, drafted in your voice.</h2>
    <p class="lead">Drift is the writing system I built to learn your voice from your own posts, then draft, headline, and schedule in it.</p>
    <p class="sub">It is how you keep a compounding cadence without burning out, so the engine keeps running even on a busy week.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="kicker">Part three · Your first twelve months</div>
    <h2>Zero to Substack Bestseller, in three phases.</h2>
    <div class="phase"><b>Months 1 to 3 · Foundations that convert</b><span>Full publication audit, positioning, profile rebuild, and the Notes engine switched on.</span></div>
    <div class="phase"><b>Months 4 to 6 · Paid, done properly</b><span>Paid tier positioning, pricing, and the paywall launched.</span></div>
    <div class="phase"><b>Months 7 to 12 · Bestseller, and beyond</b><span>Past 100 paid subscribers, with business layers built on top.</span></div>
  `},
  {t:'why', cls:'', html:`
    <div class="kicker">Why listen to me</div>
    <h2>I did this with no audience and no list.</h2>
    <div class="stat">
      <div><b>$17 &rarr; $5-10k</b><span>first month vs. today, monthly</span></div>
      <div><b>34,000+</b><span>readers, built from zero</span></div>
      <div><b>158</b><span>countries in my readership</span></div>
    </div>
    <p class="sub">Two years ago I published my first post with no idea what I was doing. This masterclass is everything I wish someone had shown me that day.</p>
  `},
  {t:'takeaway', cls:'', html:`
    <div class="kicker">What you walk away with</div>
    <h2>One hour. A clear path. Live.</h2>
    <ul>
      <li>The three numbers to actually track, in the right order.</li>
      <li>The Notes routine that grows the list without eating your week.</li>
      <li>The conversion machine that turns readers into paying members.</li>
    </ul>
  `},
  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next step</div>
    <h2>Ready to grow your Substack into a business?</h2>
    <p class="lead">If your Substack deserves an honest chance this year, apply for The Bestseller Track, my 12-month one-to-one coaching program, limited to five writers at a time.</p>
    <a class="btn" href="https://berg-studio.com/bestseller-track">Apply for The Bestseller Track</a>
    <p class="disclaimer">Educational content only. The results shared here are my own and are not typical. No income, revenue, subscriber, or business outcome is promised or guaranteed. Your results will vary and depend on your work, your niche, and factors outside anyone's control.</p>
  `}
];
const root = document.getElementById('deck');
S.forEach((s,i)=>{
  const sec = document.createElement('section');
  sec.className = 'slide ' + (s.cls||'');
  sec.innerHTML = '<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>' + s.html;
  root.appendChild(sec);
});
</script>
</body>
</html>
