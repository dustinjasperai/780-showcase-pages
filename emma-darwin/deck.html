<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psychic Distance — a masterclass with Emma Darwin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17131f; --panel:#211b2c; --rule:#3b3350; --accent:#c79a4b; --fg:#f3efe6;
    --muted:#b7afc2; --display:'League Spartan',system-ui,sans-serif; --body:'Spectral',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 24px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .k{font-family:var(--display);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:600;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.12;margin-bottom:10px}
  .sub{font-size:21px;color:var(--muted);margin-top:18px;max-width:30ch;font-style:italic}
  p{font-size:20px;line-height:1.5;margin-top:16px;max-width:56ch}
  ul{margin-top:20px;max-width:58ch}
  li{font-size:19px;line-height:1.45;margin:12px 0;list-style:none;padding-left:26px;position:relative}
  li:before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .big{font-size:40px;line-height:1.12;font-family:var(--display);font-weight:500;max-width:22ch}
  .num{font-family:var(--display);font-size:15px;color:var(--muted);position:absolute;top:24px;right:30px;letter-spacing:.1em}
  .dial{display:flex;gap:0;margin-top:30px;border-top:2px solid var(--rule);padding-top:0}
  .rung{flex:1;border-top:3px solid var(--rule);padding:18px 14px 0;position:relative}
  .rung.on{border-top-color:var(--accent)}
  .rung .lab{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .rung .ex{font-size:15px;color:var(--fg);font-style:italic;line-height:1.35}
  .scale{display:flex;justify-content:space-between;font-family:var(--display);font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:14px}
  .cred li:before{background:var(--accent)}
  .cta h1{font-size:46px}
  .disc{font-size:14px;color:var(--muted);margin-top:30px;max-width:60ch;line-height:1.5;font-style:italic}
  .foot{font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.08em;margin-top:26px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',k:'A live masterclass with Emma Darwin',h:'Psychic Distance',s:'The one craft move behind voice, point of view, and show-don’t-tell.'},
 {t:'point',k:'The promise',h:'By the end of this hour',body:'You will be able to name the single thing that makes a scene feel flat or cold, and you will know the one adjustment that fixes it. Not more detail. Not fewer adverbs. One craft move you can make on purpose, in any scene, in any genre.'},
 {t:'point',k:'What we’ll cover',h:'The plan for the hour',body:'',list:['Why “show, don’t tell” keeps letting you down.','What psychic distance actually is, in plain language.','The five rungs of the dial, with the same moment at each.','How it quietly settles point of view, voice, and interiority.','Three moves to take straight into your draft this week.']},
 {t:'who',k:'Who this is for',h:'You can write a sentence. The novel still feels off.',body:'This hour is for novelists and memoir writers whose drafts come back called flat, distant, or cold, and who have been told to add more detail, cut adverbs, or just show, don’t tell. None of that is the real problem.'},
 {t:'trap',k:'The trap',h:'“Show, don’t tell” has been quietly flattening your prose.',body:'Taken as a rule, it tells you to strip out the very narration that lets a reader sit inside a character. So writers delete interiority, over-describe gestures, and still cannot say why the page feels dead.'},
 {t:'reframe',big:'What if the rule is not show vs tell, but how close you stand to the character’s mind?',k:'The reframe'},
 {t:'section',k:'Part one',h:'The idea almost no one teaches by name',body:'Psychic distance, also called narrative distance, is how near or far the narration sits from a character’s consciousness. Not a rule. A dial. In twenty years of teaching, it is the single idea I have seen change writers’ work the fastest. It is roughly 75% of the job.'},
 {t:'point',k:'Part one',h:'Why you have felt it without naming it',body:'Every time a scene made you cry and you did not know why, or a famous book left you cold, distance was doing the work. Naming it is the whole shift. Once a thing has a name, you can reach for it on purpose instead of hoping the draft lands.'},
 {t:'dial',k:'Part two: the method',h:'The dial has rungs. Here is the same moment at five of them.'},
 {t:'point',k:'Part two',h:'Rung by rung, nothing is “better”',body:'Far is not weak and deep is not strong. Each rung does a different job. The craft is choosing the rung the moment needs, then moving on purpose, not drifting between them by accident.'},
 {t:'point',k:'Part two',h:'Point of view is a distance decision',body:'First person, close third, distant third: these are not boxes you pick once. They are starting positions on the same dial. Once you see that, head-hopping, filter words, and “too much backstory” stop being separate problems and become one adjustment.'},
 {t:'point',k:'Part two',h:'Voice lives on the dial too',body:'The narrator’s voice and the character’s voice blend or separate depending on the distance. Move closer and the prose takes on the character’s rhythm and vocabulary. That blend, handled on purpose, is what readers call a strong voice.'},
 {t:'point',k:'Part two',h:'Now “show, don’t tell” makes sense',body:'Telling is just the far end of the dial, and it is useful: it covers ground fast. Showing is the near end. You are not obeying a rule. You are deciding, line by line, how close the reader should stand.'},
 {t:'point',k:'Part two',h:'The mistake that flattens most drafts',body:'The commonest fault is not writing badly. It is sitting at one fixed distance for a whole novel, usually a safe middle one, and never moving. The prose is competent and the reader stays politely outside. The fix is movement, not polish.'},
 {t:'section',k:'Part three',h:'What changes in your next draft',body:'When you can see the dial, revision stops being guesswork. You stop sanding every sentence and start moving the camera. Flat scenes get closer. Rushed scenes step back. The reader finally lands where you meant them to.'},
 {t:'point',k:'Part three',h:'Three moves to try this week',body:'',list:['Find the flattest scene and move one notch closer for its key beat.','Mark where the narrator’s voice and the character’s voice should merge, and let them.','Keep one deliberately distant passage, and notice how much work it quietly does.']},
 {t:'point',k:'Part three',h:'What you’ll leave with',body:'A name for the problem, a dial you can picture, and a way of reading your own pages that you will not be able to switch off. That is the point. Craft you can see is craft you can repeat, book after book.'},
 {t:'cred',k:'Why me',h:'I have spent twenty years on this one question',list:['Author of The Mathematics of Love, A Secret Alchemy, and The Bruegel Boy.','Author of the craft guide Get Started in Writing Historical Fiction.','PhD in Creative Writing, Goldsmiths; taught at Oxford, Goldsmiths, and the Open University.','This Itch of Writing, my craft blog, is approaching its twentieth year and 600+ posts.']},
 {t:'cta',k:'Bring me your pages',h:'Work the dial into your own manuscript',body:'If this hour showed you the dial, the next step is working it into your actual manuscript. I take on a small number of writers for one-to-one mentoring and full manuscript appraisals, reading your work and showing you exactly where the distance is fighting you.',disc:'This masterclass is educational. No particular result is guaranteed. Results vary from writer to writer, and nothing here promises publication, representation, income, or any other outcome.',foot:'Emma Darwin · emmadarwin.com · This Itch of Writing'}
];
function esc(x){return (x||'')}
function render(){
 const d=document.getElementById('deck');
 S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'')+(s.t==='cred'?' cred':'');
  let h='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.k) h+='<div class="k">'+esc(s.k)+'</div>';
  if(s.t==='title'){h+='<h1>'+esc(s.h)+'</h1><div class="sub">'+esc(s.s)+'</div>';}
  else if(s.t==='reframe'){h+='<div class="big">'+esc(s.big)+'</div>';}
  else if(s.t==='dial'){
    h+='<h2>'+esc(s.h)+'</h2>';
    h+='<div class="dial">'+
      '<div class="rung"><div class="lab">Far</div><div class="ex">It was a hard town to grow up in.</div></div>'+
      '<div class="rung"><div class="lab">Outside</div><div class="ex">She walked up the hill to the house.</div></div>'+
      '<div class="rung on"><div class="lab">Closer</div><div class="ex">The hill was steeper than she remembered.</div></div>'+
      '<div class="rung on"><div class="lab">Inside</div><div class="ex">God, the hill. When had it got this long?</div></div>'+
      '<div class="rung on"><div class="lab">Deep</div><div class="ex">Not again. Not this. Keep going.</div></div>'+
      '</div>'+
      '<div class="scale"><span>Narration about the character</span><span>The character’s own mind</span></div>';
  }
  else{
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    if(s.body) h+='<p>'+esc(s.body)+'</p>';
    if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+esc(x)+'</li>');h+='</ul>';}
  }
  if(s.disc){h+='<div class="disc">'+esc(s.disc)+'</div>';}
  if(s.foot) h+='<div class="foot">'+esc(s.foot)+'</div>';
  el.innerHTML=h;
  d.appendChild(el);
 });
}
render();
</script>
</body>
</html>
