<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Writer's Roadmap, a masterclass with Leigh Shulman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f0;        /* warm paper cream, from brand light scheme */
    --panel:#ffffff;
    --rule:#e4d8c8;
    --ink:#2a2420;       /* warm near-black */
    --muted:#6b6258;
    --accent:#b7441d;    /* her dominant terracotta link color */
    --teal:#80bfc5;      /* her footer teal, used for dividers */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Spectral",Georgia,serif;line-height:1.5}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 60px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:18px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(42,36,32,.03)}
  .kicker{font-family:"Spectral";font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Spectral";font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"Spectral";font-weight:600;font-size:34px;line-height:1.12;margin-bottom:16px}
  .sub{font-family:"Spectral";font-weight:400;font-style:italic;font-size:22px;color:var(--muted);margin-bottom:10px}
  p.body{font-size:18px;color:var(--ink);max-width:62ch;margin-top:8px}
  p.body + p.body{margin-top:14px}
  .big{font-family:"Spectral";font-weight:600;font-size:40px;line-height:1.1;max-width:20ch}
  ul{margin:14px 0 0 0;list-style:none}
  li{font-size:19px;padding:12px 0;border-top:1px solid var(--rule);display:flex;gap:14px;align-items:baseline}
  li:first-child{border-top:none}
  li .step{font-family:"Spectral";font-weight:700;color:var(--accent);font-size:20px;min-width:1.6em}
  .pillar-letter{font-family:"Spectral";font-weight:700;font-size:72px;color:var(--accent);line-height:1}
  .divider{height:3px;width:60px;background:var(--teal);margin:4px 0 22px;border-radius:2px}
  .meta{font-size:14px;color:var(--muted);margin-top:26px;font-family:"Spectral"}
  .cta-box{border:2px solid var(--accent);border-radius:12px;padding:20px 24px;margin-top:22px;background:#fff}
  .cta-box .lead{font-family:"Spectral";font-weight:600;font-size:22px}
  .disc{font-size:12.5px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:70ch}
  .num{font-size:13px;color:var(--muted);font-family:"Spectral";letter-spacing:.08em}
  .two{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
  @media(max-width:620px){.slide{padding:34px 24px}h1{font-size:38px}h2{font-size:27px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A free live masterclass with Leigh Shulman',
  h:"Build Your Writer's Roadmap",
  sub:"The one-page plan that turns a someday-book into a finished one.",
  body:"For women writers who keep starting and never quite finish. Live, 60 minutes, bring the book you can't seem to write."},

 {t:'text',kicker:'Who this is for',
  h:"You have the book in you. You just can't seem to get it out.",
  body:["You've started three times. Maybe more. There's a folder of beginnings and no ending.",
        "You are not lazy and you are not out of ideas. You are a capable woman with a real life, trying to write a book in the cracks between everything else."]},

 {t:'text',kicker:'The trap',
  h:"You've been told the problem is discipline.",
  body:["So you've tried the 5am routine, the word-count streak, the writing sprint. It works for a week. Then life happens and the streak breaks and you're back to a blank page and a quiet shame.",
        "Here is the part nobody says out loud: more willpower was never going to fix this."]},

 {t:'big',kicker:'The reframe',
  big:"Finishing a book was never a willpower problem. It's a planning problem."},

 {t:'text',kicker:'Part one: the real problem',
  h:"Writing is taught as craft. It's almost never taught as a plan.",
  body:["Every course teaches you how to write a better sentence, a tighter scene, a stronger hook. All useful. None of it tells you what to do on a random Tuesday when you have forty minutes and no idea which part of the book to touch.",
        "A writing life without a plan runs on mood. And mood is not a strategy."]},

 {t:'text',kicker:'Part one',
  h:"The writers who finish treat it like a business.",
  body:["Not cold, not joyless. The opposite. They decide what they actually want, they name the projects that get them there, and they build a simple plan they can follow when motivation is nowhere to be found.",
        "You already know how to do hard things on a schedule. We're going to point that skill at your book."]},

 {t:'text',kicker:'Part two: the framework',
  h:"The Writer's Roadmap",
  body:["This is the method from my book, and it borrows one tool from the business world: the OGSM. Objective, Goals, Strategy, Measures.",
        "It fits on a single page, and by the end of our hour together you'll have started yours."]},

 {t:'pillar',letter:'O',kicker:'The Writer\'s Roadmap',h:'Objective',
  body:["In one sentence: what does your ideal writing life actually look like? Not the fantasy. The real version you'd be proud of.",
        "This one sentence decides everything after it."]},

 {t:'pillar',letter:'G',kicker:'The Writer\'s Roadmap',h:'Goals',
  body:["The dream projects that support the objective. The memoir. The novel. The essays that get read.",
        "We make them concrete enough to aim at, few enough to finish."]},

 {t:'pillar',letter:'S',kicker:'The Writer\'s Roadmap',h:'Strategy',
  body:["The itemized list of what actually has to happen. This is where a vague wish becomes a set of next actions you can do without deciding anything in the moment.",
        "This is the part that saves you on the forty-minute Tuesday."]},

 {t:'pillar',letter:'M',kicker:'The Writer\'s Roadmap',h:'Measures',
  body:["How you'll know the strategy is working, so you can adjust instead of quit.",
        "Measures turn 'I think I'm behind' into 'here's exactly where I am and what's next.'"]},

 {t:'list',kicker:'Your roadmap, on one page',
  h:"Four questions, one plan you can keep",
  items:[["O","One sentence: your ideal writing life"],
         ["G","The projects that get you there"],
         ["S","The itemized list of what to do"],
         ["M","The feedback that keeps you moving"]]},

 {t:'text',kicker:'Part three: a week in your writing life',
  h:"A week in a roadmapped writing life",
  body:["You sit down, you look at the one page, and you already know what today's forty minutes are for. No negotiating with yourself. No re-reading chapter one for the hundredth time.",
        "The book moves because the next step is always decided before you arrive."]},

 {t:'text',kicker:'Part three',
  h:"What changes when the plan exists",
  body:["The guilt quiets down, because progress is visible. The ideas stop scaring you, because there's a place to put them. And the book stops being a someday and starts being a thing with a shape and a finish line."]},

 {t:'two',kicker:'Why listen to me',
  h:"Leigh Shulman",
  body:["I've spent over twenty years helping writers build a writing life they love. My book, The Writer's Roadmap, became a number one writing how-to. My work has run in The Washington Post, The New York Times, WIRED, and Business Insider.",
        "I run the Inspired Writer Community and lead the Creative Revolution writing retreats. Mostly, I help women who thought they'd missed their chance finally write the book."]},

 {t:'text',kicker:'The honest part',
  h:"The plan is the easy part. Doing it with a guide is the fast part.",
  body:["You can absolutely build your roadmap on your own from the book. Many people do.",
        "If you'd rather not do it alone, that's what I'm here for."]},

 {t:'cta',kicker:'Your next step',
  h:"Let's build your Writer's Roadmap together.",
  body:["If today helped, the next step is a conversation. We'll look at where your book actually is, build out your roadmap, and figure out whether working together one to one is the right move for you.",
        "Book a consultation with me, or come join the Inspired Writer Community and start your plan this week."],
  cta:"Book a consultation with Leigh Shulman",
  disc:"This masterclass is for educational purposes only. It is not a guarantee of publication, income, or any particular result. Every writer's path is different, and outcomes vary based on your own work, circumstances, and effort."}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let html='';
  if(s.kicker) html+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){
    html+=`<h1>${s.h}</h1>`;
    if(s.sub) html+=`<div class="sub">${s.sub}</div>`;
    html+=`<div class="divider"></div>`;
    if(s.body) html+=`<p class="body">${s.body}</p>`;
  } else if(s.t==='big'){
    html+=`<div class="big">${s.big}</div>`;
  } else if(s.t==='pillar'){
    html+=`<div class="two"><div class="pillar-letter">${s.letter}</div><div><h2>${s.h}</h2>`+
      s.body.map(b=>`<p class="body">${b}</p>`).join('')+`</div></div>`;
  } else if(s.t==='list'){
    html+=`<h2>${s.h}</h2><ul>`+s.items.map(it=>`<li><span class="step">${it[0]}</span><span>${it[1]}</span></li>`).join('')+`</ul>`;
  } else if(s.t==='two'){
    html+=`<h2>${s.h}</h2><div class="divider"></div>`+s.body.map(b=>`<p class="body">${b}</p>`).join('');
  } else if(s.t==='cta'){
    html+=`<h2>${s.h}</h2>`+s.body.map(b=>`<p class="body">${b}</p>`).join('');
    html+=`<div class="cta-box"><div class="lead">${s.cta}</div></div>`;
    html+=`<div class="disc">${s.disc}</div>`;
  } else {
    html+=`<h2>${s.h}</h2>`;
    if(s.body) html+=s.body.map(b=>`<p class="body">${b}</p>`).join('');
  }
  html+=`<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
