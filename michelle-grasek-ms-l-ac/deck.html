<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Marketing You Don't Have to Hate · Michelle Grasek, Acupuncture Marketing School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f8f4; --panel:#e8f1e8; --rule:#d4e2d3;
    --acc:#30a860; --ink:#22302a; --body:#45514a; --dim:#7f8a80; --cream:#eef6ee;
  }
  html,body{height:100%}
  body{background:#e4ede2;font-family:'Nunito Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e4ede2}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Nunito Sans',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:92%;font-weight:700}
  .t-normal h1{font-size:3.3vw;max-width:90%;font-weight:500}
  .t-normal .body{font-family:'Nunito Sans',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.62;font-weight:400}
  .sub{font-family:'Frank Ruhl Libre',serif;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:82%;line-height:1.42;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Nunito Sans',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#1c2e21 0%,#0f1a13 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:86%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#1c2e21 0%,#0f1a13 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:var(--cream)}
  .t-cta .body{font-family:'Nunito Sans',sans-serif;color:#cfe3d3;font-size:1.42vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:7.5%;bottom:8%;width:17vw;opacity:.92}
  .corner-mo{right:6.5%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-family:'Nunito Sans',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(34,48,42,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Acupuncture Marketing School</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- meridian motif: acupuncture points along a fine channel, drawn in green -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <g fill="none" stroke="#30a860" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 96 C 44 82, 40 52, 60 44 S 92 34, 100 20" opacity="0.7"/>
    <circle cx="20" cy="96" r="5" fill="#30a860" stroke="none" opacity="0.9"/>
    <circle cx="60" cy="44" r="6" fill="#30a860" stroke="none" opacity="0.95"/>
    <circle cx="100" cy="20" r="5" fill="#30a860" stroke="none" opacity="0.9"/>
    <circle cx="60" cy="44" r="13" opacity="0.5"/>
    <path d="M60 24 V32 M60 56 V64 M40 44 H48 M72 44 H80" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Marketing You Don&#39;t Have to Hate',sub:'How acupuncturists fill the schedule with the kind of genuine, generous marketing that actually feels like you.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You&#39;re excellent at acupuncture. Telling people about it is the part that feels wrong.',body:'You trained for years to be good in the treatment room. Nobody trained you to promote yourself, and most of what gets called marketing feels pushy or salesy. So you do a little, cringe, and quietly stop.'},
 {t:'dark',title:'An open slot in the schedule is rarely a skill problem. It is a visibility problem.'},

 {t:'section',idx:'Part One',title:'Why Good Acupuncturists Stay Invisible'},
 {t:'normal',k:'The avoidance loop',title:'Marketing feels sleazy, so you avoid it, so the calendar keeps its holes.',body:'When the only marketing you have seen is loud, pushy, and hype driven, avoiding it feels like protecting your integrity. But the patients who need you cannot book with someone they have never heard of. The gap in the schedule is the cost of staying quiet.'},
 {t:'normal',k:'The introvert myth',title:'Being an introvert is not a marketing disadvantage.',body:'You do not have to be loud, be on camera every day, or perform to market well. Quiet, thoughtful practitioners are often the most trusted voices in their community. The work is finding the handful of things that fit you, and doing them consistently.'},
 {t:'dark',title:'Your community cannot choose you if they never hear from you.'},

 {t:'section',idx:'Part Two',title:'The Genuine and Generous Method'},
 {t:'normal',k:'Mindset first, the reframe',title:'When marketing is genuine and generous, it stops feeling like selling.',body:'The shift is to stop thinking of marketing as convincing and start thinking of it as serving. You already know acupuncture changes lives. Marketing is simply making sure the people who need that help can find you. When it is honest and useful, it feels like an extension of care, not a sales pitch.'},
 {t:'normal',k:'Talk to one person',title:'Marketing to everyone reaches no one.',body:'The clearer you are about who you help and what you help them with, the more your message lands. When you name the exact person and the exact problem, the right patient reads it and thinks, that is me. Vague and general is what makes marketing feel like shouting into the void.'},
 {t:'normal',k:'Small and consistent',title:'Ten focused minutes a week beats a burst you never repeat.',body:'A big marketing push that you do once and abandon does almost nothing. Small, steady visibility is what compounds. A simple weekly rhythm and a content plan you can actually keep mean you show up before the schedule gets scary, not after.'},
 {t:'normal',k:'Stay in touch until they are ready',title:'Most patients are not ready the first time they find you.',body:'The person who reads your post today may not book for months. A warm, trust building email connection keeps you present until the moment their pain or their timing changes. Simple, genuine emails are how the people who were not ready yet still remember you when they are.'},
 {t:'dark',title:'You do not need to do more marketing. You need to do the marketing that fits you.'},

 {t:'section',idx:'Part Three',title:'What Changes When Marketing Fits You'},
 {t:'normal',k:'The practice this builds',title:'A fuller schedule, more referrals, and patients who trust you before they walk in.',body:'When your marketing is authentic and consistent, the right patients find you, feel like they already know you, and arrive ready to begin. The panic marketing of a slow month disappears, because the visibility never stopped in the first place.'},
 {t:'dark',title:'The goal was never to become a marketer. It was to keep doing acupuncture, fully booked.'},
 {t:'normal',k:'Why Michelle Grasek',title:'Sixteen years in practice, and marketing taught to more than 4,500 acupuncturists.',body:'Michelle built two acupuncture practices from the ground up, in normal times and through a pandemic, and taught marketing at the acupuncture school level for four years. Through the Acupuncture Marketing School and her podcast, she has now helped over 4,500 acupuncturists market in a way that feels like them. This is the method behind all of it.'},

 {t:'section',idx:'Your Next Step',title:'Market Your Practice in a Way That Feels Like You'},
 {t:'normal',k:'Keep going with Michelle',title:'The full system, from your message to a schedule that stays full.',body:'The Acupuncture Marketing School walks you through the whole method step by step, from finding your message to content, email, and consistent visibility, at your own pace. Start with the free resources and the podcast, and go deeper when you are ready.'},
 {t:'cta',title:'Ready to market your practice in a way that finally feels like you?',body:'Take the next step with the Acupuncture Marketing School.',chips:['Explore the Acupuncture Marketing School','Start with the free resources'],disc:'Educational content for licensed and student acupuncturists. No income or patient volume result is guaranteed. Results vary by practitioner, community, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Acupuncture Marketing <b>School</b> · Michelle Grasek</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='title') h+=mo('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
