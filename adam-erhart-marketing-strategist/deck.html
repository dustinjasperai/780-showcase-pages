<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 5-M Agency — A Masterclass with Adam Erhart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#e8f0fa; --panel:#f9fcff; --ink:#1c2838; --ink-soft:#45505d;
    --ink-muted:#69727d; --rule:#cfdcec; --accent:#046bd2; --accent-2:#d5202c;
  }
  html,body{height:100%}
  body{font-family:'Hanken Grotesk',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:5vh 6vw}
  .slide{display:none;width:100%;max-width:1000px}
  .slide.active{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:48px;line-height:1.12;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:34px;line-height:1.18;margin-bottom:18px}
  p{font-size:20px;color:var(--ink-soft);margin-bottom:14px;max-width:50ch}
  p.lead{font-size:23px;color:var(--ink)}
  .big{font-size:26px;color:var(--ink);font-weight:600;font-family:'Poppins',sans-serif}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;color:var(--ink-soft);padding-left:30px;position:relative;margin-bottom:12px}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 34px;margin-top:8px}
  .mrow{display:flex;gap:18px;align-items:flex-start}
  .mtag{font-family:'Poppins',sans-serif;font-weight:700;color:#fff;background:var(--accent);min-width:54px;height:54px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
  .grid5{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .mcard{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px}
  .mcard b{font-family:'Poppins',sans-serif;display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
  .mcard span{font-size:14px;color:var(--ink-muted)}
  .stat{font-family:'Poppins',sans-serif;font-weight:700;font-size:64px;color:var(--accent);line-height:1}
  .disclaimer{font-size:14px;color:var(--ink-muted);margin-top:26px;max-width:62ch;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:14px;font-family:'Poppins',sans-serif;font-weight:600;font-size:19px;color:#fff;background:var(--accent);padding:15px 30px;border-radius:10px;text-decoration:none}
  .byline{font-family:'Poppins',sans-serif;color:var(--ink-muted);font-size:17px;margin-top:26px}
  .byline b{color:var(--ink)}
  #nav{position:fixed;bottom:22px;right:26px;display:flex;gap:10px;align-items:center;font-family:'Poppins',sans-serif;font-size:14px;color:var(--ink-muted);z-index:5}
  #nav button{font-family:'Poppins',sans-serif;border:1px solid var(--rule);background:#fff;color:var(--ink);width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:18px}
  #nav button:hover{border-color:var(--accent);color:var(--accent)}
  #bar{position:fixed;top:0;left:0;height:4px;background:var(--accent);z-index:5;transition:width .3s}
  @media(max-width:680px){h1{font-size:32px}h2{font-size:26px}p,li{font-size:17px}.stat{font-size:46px}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="nav"><span id="count"></span><button onclick="go(-1)">&#8249;</button><button onclick="go(1)">&#8250;</button></div>
<script>
const S = [
  {t:'title', kicker:'A Live Masterclass', h1:'The 5-M Agency', lead:"How to build a lean, profitable marketing agency on real marketing fundamentals, not guru hype.", byline:'with <b>Adam Erhart</b> &middot; Modern Marketing'},
  {t:'text', kicker:'Who this is for', h2:"You can do the work. You just can't make it predictable.", paras:["This is for the freelancer, marketer, or new agency owner who is good at the craft but tired of the feast-and-famine. You land a client, go heads-down, and then look up to an empty pipeline."], big:"The problem was never your talent. It was never having a system to bring in clients on repeat."},
  {t:'text', kicker:'The reframe', h2:"An agency is not a pile of skills. It is a machine.", paras:["Most people try to grow an agency by collecting more tactics: a new ad hack, a new tool, a new platform. More tactics just means more noise."], lead:"A real agency is five simple parts working together. Get those five right and growth stops being a mystery."},
  {t:'list', kicker:"What you'll walk away with", h2:'A blueprint you can run on Monday', items:["The five parts every lean agency needs, in the order to build them.","How to pick one offer and one buyer so you stop competing on price.","The simple backend that follows up for you so no lead slips."]},
  {t:'text', kicker:'The lie to drop first', h2:'You do not need to be a guru to run an agency', paras:["The loudest advice says grow a huge audience, hire fast, and sell giant retainers. That is how most new agency owners burn out before they are profitable."], big:"Lean and focused beats big and busy almost every time."},
  {t:'list', kicker:'Part one &middot; the real problem', h2:'Why most new agencies stay stuck at "busy but broke"', items:["They sell everything, so they are the obvious choice for nothing.","They chase every channel at once and get good at none.","They have no backend, so every month starts at zero."], foot:"None of that is a talent problem. It is a missing structure. Here is the structure."},
  {t:'cards', kicker:'Part two &middot; the framework', h2:"The Marketing Masterplan: the 5 M's", para:"The same system I have used across more than $70,000,000 in marketing campaigns, stripped down to what a lean agency actually needs.", cards:[['Model','what you sell'],['Market',"who it's for"],['Message','what you say'],['Media','where you say it'],['Machine','what converts it']]},
  {t:'m', tag:'1', name:'Model', head:'Start with what you actually sell', body:'Pick one service, one outcome, one type of client. The agencies that stall try to be everything to everyone. A lean agency wins by being the obvious choice for one specific result.'},
  {t:'m', tag:'2', name:'Market', head:'Get obsessed with one buyer', body:'Who are they, what keeps them up at night, and where do they already spend their attention online? You cannot write a message that lands until you can describe the one person it is for.'},
  {t:'m', tag:'3', name:'Message', head:'Say the one thing that makes them lean in', body:'Clear beats clever. Lead with the result and the problem you remove, not your logo or your list of services. If the market cannot repeat your message back, it is not done yet.'},
  {t:'m', tag:'4', name:'Media', head:'Go deep, not wide', body:'Pick one or two channels you can actually commit to and get good at. A one-person agency does not need to be everywhere. It needs to be excellent in one place, consistently.'},
  {t:'m', tag:'5', name:'Machine', head:'Build the backend that runs without you', body:'Landing pages, email automation, a simple CRM. The Machine turns attention into booked calls while you sleep, and it is what separates a lean agency from a stressful freelance job.'},
  {t:'cards', kicker:"The 5 M's together", h2:'One machine, five parts', para:"Each M is simple on its own. The leverage comes from the order: nail the Model, then the Market, then the Message, then the Media, and the Machine ties it together.", cards:[['1 Model','one service, one outcome'],['2 Market','one specific buyer'],['3 Message','the result, said clearly'],['4 Media','one or two channels'],['5 Machine','pages, email, CRM']]},
  {t:'text', kicker:'Part three &middot; the lean agency', h2:'What this looks like for a one-person shop', paras:["With the 5 M's in place you do not need a big team or a big ad budget to start. You need one offer, one buyer, one message, one channel, and one backend doing the follow-up."], big:"That is an agency that pays like a business and runs like a system, not a job that owns you."},
  {t:'text', kicker:'The trap to avoid', h2:'Do not add the sixth M: more', paras:["The moment the first clients come in, the temptation is to add more services, more channels, more tools. That is how a clean machine turns back into chaos.","Protect the five. Get them humming before you add anything."]},
  {t:'text', kicker:'Why listen to me', h2:'I am a marketing strategist first, an agency owner second', paras:["I have built the Modern Marketing channel to over a thousand videos and millions of views, and grown the Agency Accelerator community past 2,900 members.","Everything in the 5 M's is what I actually do, tested against real spend, not theory from a slide."]},
  {t:'stat', kicker:'The receipts', stat:'$70M+', lead:'in marketing campaigns run, which is where the 5 M&rsquo;s were pressure-tested.', para:"The point is not the number. The point is that the system behind it is simple enough to hand to a one-person agency and have it work."},
  {t:'list', kicker:'Where this goes', h2:'Your next 90 days', items:["Lock your Model and Market so you are the obvious choice for one buyer.","Write the Message and pick the one channel you will own.","Stand up the Machine so leads get followed up automatically."], foot:"That is the whole blueprint. Simple is the point."},
  {t:'cta', kicker:'Your next step', h2:'Ready to build your 5-M agency?', para:"If you want the full roadmap, the templates, and a room of agency owners building the same way, come join us inside the Agency Accelerator.", btn_text:'Join the Agency Accelerator', btn_url:'https://www.skool.com/10k-agency-blueprint-1341/about', byline:'Adam Erhart &middot; Modern Marketing &middot; adamerhart.com', disclaimer:"Educational only. The strategies shared here are for information and education. No income or specific result is guaranteed. Results vary and depend on your effort, your market, and your execution."}
];
const stage=document.getElementById('stage');
let i=0;
function esc(x){return x||''}
function slideHTML(s){
  let h='<div class="slide"><div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.t==='title'){h+='<h1>'+s.h1+'</h1><p class="lead">'+s.lead+'</p><div class="byline">'+s.byline+'</div>';}
  else if(s.t==='text'){h+='<h2>'+s.h2+'</h2>';(s.paras||[]).forEach(p=>h+='<p>'+p+'</p>');if(s.lead)h+='<p class="lead">'+s.lead+'</p>';if(s.big)h+='<p class="big">'+s.big+'</p>';}
  else if(s.t==='list'){h+='<h2>'+s.h2+'</h2><ul>';s.items.forEach(it=>h+='<li>'+it+'</li>');h+='</ul>';if(s.foot)h+='<p style="margin-top:18px">'+s.foot+'</p>';}
  else if(s.t==='cards'){h+='<h2>'+s.h2+'</h2><p>'+s.para+'</p><div class="grid5">';s.cards.forEach(c=>h+='<div class="mcard"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>');h+='</div>';}
  else if(s.t==='m'){h+='<div class="kicker" style="margin-top:-6px">The 5 M&rsquo;s &middot; '+s.tag+' of 5</div><h2>'+s.name+'</h2><p class="lead">'+s.head+'</p><div class="panel"><div class="mrow"><div class="mtag">'+s.tag+'</div><div><p style="margin:0">'+s.body+'</p></div></div></div>';}
  else if(s.t==='stat'){h+='<div class="stat">'+s.stat+'</div><p class="lead" style="margin-top:16px">'+s.lead+'</p><p>'+s.para+'</p>';}
  else if(s.t==='cta'){h+='<h2>'+s.h2+'</h2><p>'+s.para+'</p><a class="cta-btn" href="'+s.btn_url+'">'+s.btn_text+'</a><div class="byline">'+s.byline+'</div><p class="disclaimer">'+s.disclaimer+'</p>';}
  return h+'</div>';
}
function render(){
  stage.innerHTML=slideHTML(S[i]);
  stage.firstChild.classList.add('active');
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
  document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
render();
</script>
</body>
</html>
