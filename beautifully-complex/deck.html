<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regulation Before Strategy, A Beautifully Complex Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171a1d;
    --panel:#20252a;
    --rule:#333a40;
    --accent:#6fd993;
    --accent-2:#ff4174;
    --ink:#f2f4f3;
    --muted:#a9b2ac;
    --display:"Bebas Neue", sans-serif;
    --body:"Roboto", sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  body{padding:48px 20px 80px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
  .slide{
    position:relative;
    background:
      radial-gradient(1200px 400px at 12% -10%, rgba(111,217,147,0.06), transparent 60%),
      var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 56px 64px;
    min-height:460px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
  }
  .rule{
    position:absolute;
    top:0;left:0;
    height:4px;width:110px;
    background:var(--accent);
    border-radius:0 0 4px 0;
  }
  .num{
    position:absolute;
    top:22px;right:28px;
    font-family:var(--display);
    letter-spacing:2px;
    font-size:18px;
    color:var(--muted);
  }
  .dot{
    display:inline-flex;align-items:center;gap:10px;
    font-family:var(--body);
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:12px;
    color:var(--accent);
    margin-bottom:22px;
  }
  .dot i{
    width:11px;height:11px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px rgba(111,217,147,0.18);
    display:inline-block;
  }
  h1{
    font-family:var(--display);
    font-weight:400;
    line-height:0.96;
    letter-spacing:1px;
    font-size:clamp(46px,8vw,86px);
    color:var(--ink);
  }
  h2{
    font-family:var(--display);
    font-weight:400;
    line-height:1.0;
    letter-spacing:1px;
    font-size:clamp(34px,5.4vw,58px);
    color:var(--ink);
  }
  .promise, p.body{
    font-family:var(--body);
    font-weight:300;
    font-size:clamp(17px,2.1vw,21px);
    line-height:1.6;
    color:var(--muted);
    max-width:42ch;
    margin-top:22px;
  }
  .lead{color:var(--ink);font-weight:400}
  .accent-word{color:var(--accent)}
  .rose{color:var(--accent-2)}
  .part .tag{
    font-family:var(--display);
    letter-spacing:6px;
    font-size:clamp(18px,3vw,24px);
    color:var(--accent);
    margin-bottom:14px;
  }
  .signal-mark{
    display:flex;align-items:baseline;gap:26px;flex-wrap:wrap;
  }
  .signal-letter{
    font-family:var(--display);
    font-size:clamp(120px,20vw,190px);
    line-height:0.8;
    color:var(--accent);
  }
  .signal-name{
    font-family:var(--display);
    font-size:clamp(34px,5vw,56px);
    letter-spacing:1px;
    color:var(--ink);
  }
  .steps{
    display:flex;gap:9px;margin-top:34px;flex-wrap:wrap;
  }
  .steps span{
    font-family:var(--display);
    font-size:20px;
    letter-spacing:2px;
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--muted);
  }
  .steps span.on{
    color:var(--bg);
    background:var(--accent);
    border-color:var(--accent);
  }
  .list{margin-top:24px;display:flex;flex-direction:column;gap:14px;max-width:52ch}
  .list div{
    font-family:var(--body);
    font-weight:300;
    font-size:clamp(16px,2vw,19px);
    line-height:1.5;
    color:var(--muted);
    padding-left:20px;
    position:relative;
  }
  .list div:before{
    content:"";
    position:absolute;left:0;top:9px;
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
  }
  .cta-actions{margin-top:30px;display:flex;flex-direction:column;gap:12px}
  .cta-primary{
    font-family:var(--display);
    letter-spacing:2px;
    font-size:24px;
    color:var(--bg);
    background:var(--accent);
    padding:16px 26px;
    border-radius:10px;
    align-self:flex-start;
  }
  .cta-secondary{
    font-family:var(--body);
    font-weight:500;
    letter-spacing:1px;
    color:var(--accent);
    font-size:16px;
  }
  .disclaimer{
    margin-top:30px;
    font-family:var(--body);
    font-weight:300;
    font-size:13px;
    line-height:1.6;
    color:var(--muted);
    max-width:56ch;
    border-top:1px solid var(--rule);
    padding-top:16px;
  }
  .cred-facts{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:60ch}
  .cred-facts div{
    font-family:var(--body);font-weight:300;font-size:15px;line-height:1.5;color:var(--muted);
  }
  .cred-facts b{color:var(--ink);font-weight:500;display:block;font-family:var(--display);letter-spacing:1px;font-size:20px;margin-bottom:4px}
  footer{max-width:960px;margin:40px auto 0;text-align:center;color:var(--muted);font-size:12px;font-weight:300;letter-spacing:1px}
  @media(max-width:600px){.slide{padding:40px 28px 48px;min-height:380px}.cred-facts{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<footer>Beautifully Complex, a masterclass with Penny Williams</footer>
<script>
const S = [
  {t:'title',
    kicker:'A Beautifully Complex Masterclass',
    title:'Regulation<br>Before Strategy',
    body:'Why understanding your child’s nervous system changes everything, and how you can start reading behavior differently today.'
  },
  {t:'content',
    kicker:'Who This Is For',
    title:'The Parent<br>Who Has Tried Everything',
    body:'You love a child with ADHD or autism, and you are exhausted. You have read the books, downloaded the checklists, and stayed calm longer than you thought possible. And still, the hard moments keep coming.'
  },
  {t:'content',
    kicker:'The Trap',
    title:'The Spiral<br>That Keeps Failing',
    body:'A reward chart works for a week, then stops. A consequence lands, and the meltdown gets bigger. You try firmer, then softer, then firmer again. The harder you push for better behavior, the further away it seems to move.'
  },
  {t:'content',
    kicker:'The Reframe',
    title:'Behavior Is a Signal,<br>Not Defiance',
    body:'What if the meltdown is not your child working against you. What if it is information. Every hard behavior is your child telling you, in the only language available in that moment, that something is too much.'
  },
  {t:'part',
    tag:'Part One',
    title:'The Core Problem'
  },
  {t:'content',
    kicker:'The Core Problem',
    title:'A Dysregulated Brain<br>Cannot Access Skills',
    body:'When a nervous system is in survival mode, the thinking, planning, and reasoning parts of the brain go quiet. Logic, consequences, and coping strategies live in exactly the part of the brain that is offline in a meltdown. You are not failing. You are asking for skills that are temporarily out of reach.'
  },
  {t:'content',
    kicker:'The Core Problem',
    title:'Regulation Is Required First',
    body:'Regulation is the ground floor. No skill, script, or strategy can take hold until the nervous system feels safe enough to come back online. So we stop trying to fix the behavior first. We start by helping the body settle, and then the child can reach the very skills we were begging for.'
  },
  {t:'part',
    tag:'Part Two',
    title:'The SIGNAL Framework'
  },
  {t:'signal', letter:'S', name:'Spot the State', idx:0,
    body:'Before anything else, identify the child’s nervous-system state. Are they calm, revved up, or shut down. You cannot choose the right response until you can see where the body actually is.'
  },
  {t:'signal', letter:'I', name:'Interpret the Behavior', idx:1,
    body:'Read behavior as communication, not defiance. Ask what this moment is trying to tell you. The behavior is the smoke, not the fire, and it always points to something underneath.'
  },
  {t:'signal', letter:'G', name:'Ground Your Energy', idx:2,
    body:'You regulate yourself before you respond. Your calm nervous system is the tool that helps your child borrow steadiness. You cannot pour co-regulation from an empty, activated place.'
  },
  {t:'signal', letter:'N', name:'Notice Needs & Emotions', idx:3,
    body:'Find the unmet need under the behavior. Hunger, fatigue, sensory overload, fear, or a longing to be understood. Name the emotion, and meet the need instead of arguing with the behavior.'
  },
  {t:'signal', letter:'A', name:'Adjust Expectations & Environment', idx:4,
    body:'Recalibrate the demands and the surroundings. Lower the pile, soften the lights, shorten the ask. When the environment fits the nervous system, cooperation stops being a battle.'
  },
  {t:'signal', letter:'L', name:'Lead with Connection', idx:5,
    body:'Co-regulate and build safety. Connection is not a reward for good behavior, it is the path to it. Lead with warmth, and the relationship becomes the place where real change can grow.'
  },
  {t:'part',
    tag:'Part Three',
    title:'In Real Life'
  },
  {t:'content',
    kicker:'In Real Life',
    title:'The Same Morning,<br>A Different Path',
    body:'Shoes are refusing to go on and the clock is loud. The old path pushes harder and the morning falls apart. The SIGNAL path pauses, spots the overwhelmed state, grounds your own breath, and names the real need. The shoes still go on, but nobody arrives in pieces.'
  },
  {t:'content',
    kicker:'The Turning Point',
    title:'From “He Won’t”<br>to “He Can’t”',
    body:'For my own family, everything shifted the day I stopped hearing my son’s behavior as a choice and started hearing it as a capacity. When he won’t became he can’t, my anger softened into curiosity, and curiosity is where connection begins.'
  },
  {t:'credibility',
    kicker:'Why Learn This With Me',
    title:'I Have Walked This Road',
    facts:[
      {h:'2008', p:'The year my son was diagnosed with ADHD, and the year my search for a better way began.'},
      {h:'375+', p:'Episodes of the Beautifully Complex podcast, exploring how neurodivergent kids truly thrive.'},
      {h:'Thousands', p:'Of families I have supported as a parenting coach and award-winning author.'},
      {h:'Lived', p:'I am neurodivergent myself, and I work as a sociologist studying how people connect.'}
    ]
  },
  {t:'content',
    kicker:'What Becomes Possible',
    title:'Steadier Days,<br>A Stronger Bond',
    body:'When regulation comes first, the hard moments grow shorter and less frightening. You stop bracing for the next storm and start trusting yourself in it. Your child feels understood, and that safety is where their real skills finally get to show up.'
  },
  {t:'cta',
    kicker:'Your Next Step',
    title:'Start Decoding<br>the Signal',
    body:'You do not have to figure out your child’s nervous system alone. Take the free Behavior Decoder Quiz to see what your child’s hardest moments are trying to tell you, then join SIGNAL Parenting to practice the framework step by step.',
    primary:'Take the free Behavior Decoder Quiz',
    secondary:'Or join SIGNAL Parenting to go deeper',
    disclaimer:'This masterclass is educational and reflects one parenting approach. It is not medical, psychological, or therapeutic advice, and it is not a substitute for care from a qualified professional. No outcome or result is guaranteed. Results vary from family to family, because every child is different. If you have concerns about your child’s development or wellbeing, please consult a licensed provider.'
  }
];

const deck = document.getElementById('deck');
const total = S.length;
const letters = ['S','I','G','N','A','L'];

function chrome(i){
  return '<span class="rule"></span><span class="num">'
    + String(i+1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0') + '</span>';
}
function kicker(text){
  return '<div class="dot"><i></i>' + text + '</div>';
}

S.forEach((s,i)=>{
  const sec = document.createElement('section');
  sec.className = 'slide ' + s.t;
  let html = chrome(i);

  if(s.t==='title'){
    html += kicker(s.kicker) + '<h1>' + s.title + '</h1><p class="promise">' + s.body + '</p>';
  } else if(s.t==='part'){
    html += '<div class="tag">' + s.tag + '</div><h1>' + s.title + '</h1>';
  } else if(s.t==='signal'){
    let steps = '<div class="steps">';
    letters.forEach((L,k)=>{ steps += '<span class="' + (k===s.idx?'on':'') + '">' + L + '</span>'; });
    steps += '</div>';
    html += kicker('The SIGNAL Framework')
      + '<div class="signal-mark"><span class="signal-letter">' + s.letter + '</span><span class="signal-name">' + s.name + '</span></div>'
      + '<p class="body">' + s.body + '</p>' + steps;
  } else if(s.t==='credibility'){
    let facts = '<div class="cred-facts">';
    s.facts.forEach(f=>{ facts += '<div><b>' + f.h + '</b>' + f.p + '</div>'; });
    facts += '</div>';
    html += kicker(s.kicker) + '<h2>' + s.title + '</h2>' + facts;
  } else if(s.t==='cta'){
    html += kicker(s.kicker) + '<h1>' + s.title + '</h1><p class="body">' + s.body + '</p>'
      + '<div class="cta-actions"><span class="cta-primary">' + s.primary + '</span>'
      + '<span class="cta-secondary">' + s.secondary + '</span></div>'
      + '<p class="disclaimer">' + s.disclaimer + '</p>';
  } else {
    html += kicker(s.kicker) + '<h2>' + s.title + '</h2><p class="body">' + s.body + '</p>';
  }

  sec.innerHTML = html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
