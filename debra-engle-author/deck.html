<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Writer's Miracle Method — a live masterclass with Debra Landwehr Engle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f4ee;      /* her light ground */
    --panel:#ffffff;
    --rule:#e4ddd0;
    --ink:#1b2a2e;        /* deep teal-slate text */
    --teal:#00728c;       /* her dominant brand color */
    --coral:#f17961;      /* her button accent, used sparingly */
    --muted:#5c6b6f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:"Lato",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:54px 56px;margin:20px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .num{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:16px}
  h1{font-family:"Lora",Georgia,serif;font-weight:700;font-size:46px;line-height:1.12;color:var(--teal);margin-bottom:18px}
  h2{font-family:"Lora",Georgia,serif;font-weight:600;font-size:34px;line-height:1.16;color:var(--ink);margin-bottom:16px}
  h2 .accent{color:var(--teal)}
  p{font-size:19px;color:var(--ink);max-width:42ch;margin-bottom:14px}
  p.lead{font-size:22px;color:var(--muted)}
  .big{font-family:"Lora",Georgia,serif;font-size:40px;line-height:1.18;color:var(--ink);max-width:24ch}
  .big .hl{color:var(--coral)}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;padding:12px 0 12px 30px;border-top:1px solid var(--rule);position:relative;max-width:48ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:50%;background:var(--teal)}
  li.coral:before{background:var(--coral)}
  .pillar{font-family:"Lora",Georgia,serif;font-weight:600;color:var(--teal)}
  .step{display:flex;gap:18px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--rule);max-width:52ch}
  .step .k{font-family:"Lora",Georgia,serif;color:var(--coral);font-size:26px;min-width:40px}
  .creds li:before{background:var(--coral)}
  .cta{background:var(--teal);color:#fff;border-color:var(--teal)}
  .cta .eyebrow{color:#bfe3ec}
  .cta h1{color:#fff}
  .cta p{color:#eaf4f6}
  .cta .step-btn{display:inline-block;margin-top:14px;background:var(--coral);color:#fff;font-weight:700;padding:14px 26px;border-radius:10px;font-size:18px}
  .disclaimer{margin-top:26px;font-size:13px;color:#cfe6eb;max-width:60ch;line-height:1.5}
  .footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="footer">The Writer's Miracle Method &middot; a live masterclass with Debra Landwehr Engle</div>
<script>
const S = [
  {t:"title", eyebrow:"A live masterclass", h1:"The Writer's Miracle Method",
   p:"How to clear the fear that is keeping you from the book you were born to write.",
   by:"with Debra Landwehr Engle"},

  {t:"for", eyebrow:"Who this is for",
   h2:"You have started the book <span class='accent'>more than once</span>.",
   lead:"You know you have something to say. You have the notes, maybe the first chapter. And every time you sit down, something stops you cold."},

  {t:"trap", eyebrow:"The trap",
   big:"So you go looking for <span class='hl'>more craft</span>. Another course, another outline, another book about writing.",
   p:"And none of it touches the thing that actually stopped you."},

  {t:"reframe", eyebrow:"The real problem",
   big:"You do not have a <span class='hl'>writing</span> problem. You have a <span class='hl'>fear</span> problem.",
   p:"Writer's block is not a skills gap. It is self-doubt wearing a costume."},

  {t:"part", eyebrow:"Part one", h1:"The voice that stops you"},

  {t:"content", eyebrow:"The inner critic",
   h2:"Every blocked writer is hearing the same voice.",
   list:["Who are you to write this?","Everyone has already said it better.","You will embarrass yourself.","Finish it and then what?"],
   p:"It feels like truth. It is fear, and fear can be answered."},

  {t:"content", eyebrow:"Why willpower fails",
   h2:"You cannot <span class='accent'>out-discipline</span> fear.",
   p:"Pushing harder makes the voice louder. The writers who finish are not more disciplined. They have a practice that clears the fear before they ever touch the page."},

  {t:"part", eyebrow:"Part two", h1:"The Writer's Miracle Method"},

  {t:"content", eyebrow:"The method",
   h2:"A 30-day practice, built on one daily ritual.",
   p:"Thirty years of writing and forty years with A Course in Miracles taught me the same lesson. The work is not forcing words out. The work is removing what blocks them.",
   p2:"The ritual is the Miracle Meeting. You do it every morning, before you write."},

  {t:"content", eyebrow:"The Miracle Meeting", h2:"Four moves, every morning:",
   steps:[
     ["1","<span class='pillar'>Settle.</span> A few minutes of quiet meditation to drop out of the noise and into the room."],
     ["2","<span class='pillar'>Gratitude.</span> Name what is already good. Gratitude and fear cannot occupy the same breath."],
     ["3","<span class='pillar'>Shift the thought.</span> Catch the fear-based thought, name it, and choose a truer one in its place."],
     ["4","<span class='pillar'>Write from flow.</span> Now you write. Not to prove anything. To tell the truth, one sentence at a time."]
   ]},

  {t:"content", eyebrow:"Move three, up close",
   h2:"Naming the fear is how you <span class='accent'>disarm</span> it.",
   p:"A fear-based thought, said out loud, loses most of its power. In its place you choose a thought you can actually stand on. Over thirty days, that choice becomes a habit, and the habit becomes your default."},

  {t:"content", eyebrow:"Why daily, why 30 days",
   h2:"Trust is built by repetition, not by insight.",
   p:"One brave morning does not change a writer. Thirty of them do. The Method is daily on purpose. You are not learning a concept. You are rewiring the reflex that makes you flinch from the page."},

  {t:"content", eyebrow:"Flow, not force",
   h2:"Writing from freedom feels <span class='accent'>different</span>.",
   list:["You stop editing the sentence before it exists.","You write to discover, not to defend.","The work sounds like you, because fear is not steering.","You finish, because finishing stops being frightening."]},

  {t:"part", eyebrow:"Part three", h1:"A Miracle Meeting morning"},

  {t:"content", eyebrow:"A morning in the Method",
   h2:"Fifteen quiet minutes, then the page.",
   p:"The alarm, the coffee, the Miracle Meeting, the open document. The critic still speaks. You have simply learned to answer it and keep going. That is the whole difference between the writers who finish and the ones who do not."},

  {t:"creds", eyebrow:"Why trust me with this",
   h2:"I have spent a lifetime at the meeting point of writing and fear.",
   list:[
     "Bestselling author of The Only Little Prayer You Need, with a foreword by the Dalai Lama.",
     "Forty years studying A Course in Miracles, twenty years teaching it.",
     "An MFA in Creative Nonfiction and a career of writing for national publications.",
     "Executive director of Story Summit, mentoring writers through classes and retreats."
   ]},

  {t:"content", eyebrow:"The promise",
   h2:"The book is already in you.",
   p:"You do not need to become someone braver before you can write it. You need a practice that clears the fear each morning so the writer you already are can get to work."},

  {t:"cta", eyebrow:"Your next step", h1:"Begin The Writer's Miracle Method",
   p:"Start the 30-day practice and write your next pages with me. If you are ready to clear the fear and finish the book you were born to write, this is where we begin.",
   btn:"Start the Method",
   disclaimer:"This masterclass is for educational purposes only. Writing outcomes vary from person to person and depend on your own effort and circumstances. Nothing here is a guarantee of publication, income, or any specific result."}
];

const deck = document.getElementById('deck');
let n = 0;
for(const s of S){
  n++;
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let html = '<div class="num">' + String(n).padStart(2,'0') + ' / ' + String(S.length).padStart(2,'0') + '</div>';
  if(s.eyebrow) html += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if(s.h1) html += '<h1>' + s.h1 + '</h1>';
  if(s.h2) html += '<h2>' + s.h2 + '</h2>';
  if(s.big) html += '<div class="big">' + s.big + '</div>';
  if(s.lead) html += '<p class="lead">' + s.lead + '</p>';
  if(s.p) html += '<p>' + s.p + '</p>';
  if(s.p2) html += '<p>' + s.p2 + '</p>';
  if(s.by) html += '<p class="lead">' + s.by + '</p>';
  if(s.list){ html += '<ul' + (s.t==='creds'?' class="creds"':'') + '>'; for(const li of s.list) html += '<li>' + li + '</li>'; html += '</ul>'; }
  if(s.steps){ for(const st of s.steps) html += '<div class="step"><div class="k">' + st[0] + '</div><div>' + st[1] + '</div></div>'; }
  if(s.btn) html += '<span class="step-btn">' + s.btn + '</span>';
  if(s.disclaimer) html += '<div class="disclaimer">' + s.disclaimer + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
