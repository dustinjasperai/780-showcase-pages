<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Actors Book Paid Work — a masterclass with Ben Mathews | Acting Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d10;        /* near-black soundstage ground, from their dark site scheme */
    --panel:#16191e;
    --rule:#2a2f37;
    --ink:#ffffff;
    --muted:#9aa4b0;
    --accent:#04c3c9;    /* their brand button cyan (#04c3c9), traceable to ## Palette */
    --glow:#03f8fb;
    --head:'League Spartan',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:linear-gradient(180deg,#0e1115,#0b0d10);border:1px solid var(--rule);border-radius:16px;
    padding:54px 52px;margin:0 0 22px;min-height:360px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;right:38px;top:40px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 22px var(--glow)}
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.1;letter-spacing:-.01em}
  p{font-size:19px;line-height:1.6;color:var(--muted);margin-top:18px;max-width:62ch}
  .big{font-size:40px;font-family:var(--head);font-weight:600;color:var(--ink);line-height:1.15}
  ul{margin-top:22px;list-style:none;display:grid;gap:14px}
  li{font-size:19px;line-height:1.45;padding-left:26px;position:relative;color:#d7dde4}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .pillar{font-family:var(--head);font-weight:700;font-size:44px;color:var(--accent)}
  .disc{margin-top:22px;font-size:13px;color:#6b7580;max-width:66ch}
  .cta-line{font-family:var(--head);font-weight:600;font-size:22px;color:var(--ink);margin-top:20px}
  .num{font-family:var(--head);color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.14em;margin-bottom:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Ben Mathews', h:'How Actors Book Paid Work', p:'The craft-to-career roadmap that takes a trained actor from scattered classes to booked, paid work.'},
  {t:'promise', kicker:'Acting Mastery', h:'What this hour gives you', p:'A clear path built on three pillars: the craft that holds up on camera, the mindset for a career of no, and the opportunity strategy that actually gets you cast. No theory for its own sake.'},
  {t:'who', kicker:'Who this is for', h:'The trained actor who still isn’t booking', p:'You can act. You have done the classes, maybe a degree. And yet the bookings are not matching the talent. This is for you, not for the total beginner.'},
  {t:'trap', kicker:'The trap', h:'So you take another class', p:'When the work does not come, the instinct is to train more craft. Another scene study, another accent course. It feels productive. It rarely changes the booking rate, because craft was never the only thing being tested.'},
  {t:'reframe', kicker:'The hard truth', big:'Talent was never the thing stopping you.', p:'The actors who work are not always the most talented in the room. They are the ones who treat craft, mindset, and opportunity as one system instead of hoping talent alone gets noticed.'},
  {t:'part', num:'PART ONE', h:'Why craft alone is not a career'},
  {t:'body', kicker:'The core problem', h:'The room moved to your bedroom', p:'Most training still prepares you for a casting room. The audition now happens on a camera in your home, on your own, with one take you choose. Craft that is not built for that room quietly loses auditions you never hear back on.'},
  {t:'part', num:'PART TWO', h:'The Breakout Actor Roadmap'},
  {t:'body', kicker:'The framework', h:'One path, three pillars', p:'Instead of collecting unrelated classes, the Roadmap sequences 60+ hours so you always know the next step. It is organised around the three things a working actor cannot skip.'},
  {t:'pillar', num:'PILLAR 01', pillar:'Craft', p:'Technique that holds up on camera, drawn from the Atlantic Theater lineage and rebuilt for the self-tape era. Truthful, repeatable, and specific enough to survive a close-up.'},
  {t:'pillar', num:'PILLAR 02', pillar:'Mindset', p:'A career in acting is a career of hearing no. We train the resilience and the audition psychology that keep you in the game long enough to get the yes, so rejection stops running your decisions.'},
  {t:'pillar', num:'PILLAR 03', pillar:'Opportunity', p:'Auditions, self-tapes, agents and casting relationships are learnable mechanics, not luck. This is the pillar most training leaves out, and it is where bookings actually come from.'},
  {t:'body', kicker:'The shape of change', h:'The 90-Day view', p:'You do not need five more years. A focused actor working the Roadmap with monthly live coaching can make a visible step-change in about 90 days, because the effort finally points in one direction.'},
  {t:'body', kicker:'The practice engine', h:'1,500+ scenes to work', p:'Reading about craft does not build it. You get a library of 1,500+ scenes from film, tv and theatre to rehearse, self-tape, and bring to live coaching, so the practice is never the bottleneck.'},
  {t:'part', num:'PART THREE', h:'What a working actor’s month looks like'},
  {t:'body', kicker:'In practice', h:'Craft, feedback, reps, repeat', p:'A weekly recorded lesson to build technique, a monthly live call to pressure-test it, a monthly workshop with a casting director or agent, and real scenes self-taped and reviewed. Not scattered. Sequenced.'},
  {t:'why', kicker:'Why learn this here', h:'Taught from the casting side of the table', p:'Ben Mathews trained at the Atlantic Theater Company under David Mamet and William H. Macy, and his films have earned more than 25 international awards with screenings at Cannes and Tropfest. You are learning from someone who sits where the casting decisions get made.'},
  {t:'recap', kicker:'The whole thing in one line', big:'Craft. Mindset. Opportunity. As one path.', p:'That is the Breakout Actor Roadmap, and it is why trained actors start booking instead of just training.'},
  {t:'cta', kicker:'Your next step', h:'Join The Breakout Actor Roadmap', cta:'Start inside the online platform at actingmastery.com.au', disc:'For education only. This masterclass teaches a training method; it is not a guarantee of bookings, representation, or income. Results vary by actor, effort, and circumstance.'}
];
const deck=document.getElementById('deck');
for(const s of S){
  const el=document.createElement('section'); el.className='slide';
  let html='';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.num) html+='<div class="num">'+s.num+'</div>';
  if(s.h) html+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.pillar) html+='<div class="pillar">'+s.pillar+'</div>';
  if(s.items){html+='<ul>';for(const it of s.items)html+='<li>'+it+'</li>';html+='</ul>';}
  if(s.p) html+='<p>'+s.p+'</p>';
  if(s.cta) html+='<div class="cta-line">'+s.cta+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=html; deck.appendChild(el);
}
</script>
</body>
</html>
