<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The One Percent Way. A Masterclass with John Lamerton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f8fc; --panel:#ffffff; --rule:#dbe4f0;
    --acc:#273687; --acc2:#2ea3f2; --pop:#ed9200;
    --ink:#1f2a44; --body:#45506a; --dim:#8b97ae; --paper:#f5f8fc;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#e6edf6;font-family:'Source Serif 4',Georgia,serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;
    background:linear-gradient(150% 130% at 8% 0%,#ffffff 0%,var(--bg) 58%)}
  .slide.active{opacity:1}
  .kicker{font-family:'Raleway',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--acc2);margin-bottom:2.6vh}
  h1{font-family:'Raleway',sans-serif;font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:-.005em}
  .t-title h1{font-size:5.1vw;max-width:92%}
  .t-normal h1{font-size:2.9vw;max-width:87%;font-weight:700}
  .t-normal .body{font-family:'Source Serif 4',serif;font-size:1.3vw;color:var(--body);margin-top:3.0vh;max-width:75%;line-height:1.66}
  .sub{font-family:'Source Serif 4',serif;font-style:italic;font-size:1.95vw;color:var(--acc);margin-top:3.6vh;max-width:86%;line-height:1.44}
  .t-section{align-items:flex-start;background:linear-gradient(120deg,#eaf1fb 0%,#f5f8fc 100%)}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.05vw;font-weight:700;color:var(--pop);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:3.9vw;max-width:82%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2) 60%,transparent);margin-top:3.6vh;border-radius:3px}
  .t-dark{background:radial-gradient(130% 150% at 50% 0%,#2b3a72 0%,#1f2a44 74%)}
  .t-dark h1{color:#eef3fb;font-size:3.3vw;max-width:87%;font-weight:700}
  .t-dark .kicker{color:#7fc0f5}
  .t-cta{background:linear-gradient(120deg,#eaf1fb 0%,#f5f8fc 66%)}
  .t-cta h1{color:var(--ink);font-size:3.1vw;max-width:85%}
  .t-cta .body{font-family:'Source Serif 4',serif;color:var(--body);font-size:1.32vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.2vw;margin-top:4.4vh;flex-wrap:wrap}
  .chip{border:1.6px solid var(--acc);color:var(--acc);border-radius:100px;padding:1.4vh 1.9vw;font-family:'Raleway',sans-serif;font-size:1.12vw;font-weight:600;letter-spacing:.01em;background:rgba(39,54,135,.05)}
  .brandline{font-family:'Raleway',sans-serif;font-size:1.1vw;color:var(--body);margin-top:4.2vh;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:800}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:5.0vh;font-family:'Raleway',sans-serif;font-size:.82vw;color:var(--dim);line-height:1.5;max-width:82%;font-weight:400}
  .hud{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.05);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc2);width:0;transition:width .35s ease}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:6.5%;top:50%;transform:translateY(-50%);width:24vw;height:24vw;opacity:.95}
  .corner-mo{right:6%;bottom:8%;width:8vw;height:8vw;opacity:.55}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Raleway',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Raleway',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9.2vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}.disc{font-size:2vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">BIG Idea &middot; John Lamerton</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: the marginal gain. small ascending steps, each one 1% taller than the last, from John's One Percent Way. not a hockey-stick growth arrow. -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <line x1="16" y1="104" x2="112" y2="104" stroke="#8b97ae" stroke-width="1.4" opacity="0.5"/>
  <rect x="20" y="86" width="13" height="18" rx="2" fill="#273687" opacity="0.85"/>
  <rect x="41" y="76" width="13" height="28" rx="2" fill="#273687" opacity="0.9"/>
  <rect x="62" y="64" width="13" height="40" rx="2" fill="#2ea3f2" opacity="0.9"/>
  <rect x="83" y="48" width="13" height="56" rx="2" fill="#2ea3f2" opacity="0.95"/>
  <circle cx="90" cy="40" r="7" fill="#ed9200"/>
  <text x="90" y="43.5" font-family="Raleway,sans-serif" font-size="7" font-weight="800" fill="#fff" text-anchor="middle">1%</text>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',k:'A live masterclass with John Lamerton',title:'The One Percent Way',sub:'How ambitious owners build a business that runs 1% better every week, and ends up running their life a great deal less.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You built a real business. Somewhere along the way it started running you.',body:'You are not a beginner. The business works, the customers are happy, the money comes in. But the hours crept up, the to-do list never empties, and the thing that was meant to give you freedom now needs you for every decision. You do not want to be bigger. You want it to be better, and you want your life back.'},
 {t:'dark',k:'The uncomfortable bit',title:'Most owners are told to grow. Bigger brings more customers, more staff, more stress, and somehow never more time.'},

 {t:'section',idx:'Part One',title:'Why Growth Is The Wrong Goal'},
 {t:'normal',k:'The bigger-is-better lie',title:'More customers, more leads, more staff might be the last thing you actually need.',body:'The default advice is always the same: scale it, grow it, add more. But more revenue that arrives with more stress and less time is not a better business, it is a bigger job. What most owners really want is more profit, more margin, more leverage, more time, and a business that relies less on them. That is a different goal, and it needs a different method.'},
 {t:'normal',k:'The lifestyle business',title:'If you control the business, you control the lifestyle. That is the whole game.',body:'A lifestyle business is not a small ambition. It is a deliberate one: a business designed to deliver the life you actually want, rather than one you serve until you are burnt out. The question stops being how big can this get, and becomes what do I want my week to look like, and how do I build a business that fits inside it.'},
 {t:'normal',k:'Why transformation fails',title:'Big, dramatic overhauls do not stick. Small ones, repeated, quietly compound.',body:'Every January the same thing happens. A grand plan, a burst of effort, and by March it is gone, because heroic change was never built to last a real working year. The owners who pull away are not the ones who transformed overnight. They are the ones who got a little bit better, on purpose, every single week, and let it add up.'},
 {t:'dark',k:'The turn',title:'You do not need to double your effort. You need to get one percent better, and then do it again.'},

 {t:'section',idx:'Part Two',title:'The One Percent Way'},
 {t:'normal',k:'The marginal gain',title:'Improve by one percent a week and the maths does the heavy lifting for you.',body:'British Cycling did not win by finding one magic change. They found hundreds of tiny ones and stacked them. A business is the same. One percent better a week compounds into roughly double in about sixty-nine weeks, without a single dramatic leap. The job is not a breakthrough. It is a steady, never-ending run of small, deliberate gains across finances, marketing, routines and people.'},
 {t:'normal',k:'The 64:20:8 Rule',title:'A tiny slice of what you do drives almost all of what you get. Find it. Protect it.',body:'You know the 80/20 rule: a fifth of your effort creates most of your results. Go one layer deeper and it gets sharper still, a handful of the right moves drive the majority of the outcome. The 64:20:8 Rule is how we hunt that handful down, pour your best hours into it, and give you permission to stop doing the rest.'},
 {t:'normal',k:'The Oh Shit-o-meter',title:'A business that relies less on you starts with knowing who and what it truly relies on.',body:'Picture each person on your team handing in their notice tomorrow. The size of your gut reaction tells you the truth: who is genuinely load-bearing, who is a problem you have been avoiding, and where the business is dangerously balanced on one pair of hands. It is a blunt little tool, and it is where delegating for real begins.'},
 {t:'normal',k:'Routines over willpower',title:'Consistency is not a personality trait. It is a machine you can build on purpose.',body:'Motivation is weather. It comes and goes and you cannot plan around it. So we do not. We build the small routines and repeatable rhythms that make the important work happen whether you feel like it or not. When the system carries the consistency, you stop having to be heroic, and the one percents keep landing week after week.'},
 {t:'dark',k:'The point of all of it',title:'Rest is not the prize you get after the work. It is part of what keeps the business, and you, going.'},

 {t:'section',idx:'Part Three',title:'The Business You Actually Wanted'},
 {t:'normal',k:'What this builds',title:'A business that gets quietly better every week, on a week that finally has room in it.',body:'When you stop chasing bigger and start compounding better, the pressure comes off. Profit and margin tend to rise before revenue does. The business leans on you less because you built it to. And the improvements do not depend on a good mood or a quiet season, because they are small enough to survive an ordinary, busy week. That is the whole promise, and it is a realistic one.'},
 {t:'normal',k:'Why John',title:'A number-one bestselling author and an unashamed anti-guru, allergic to hype and psycho-babble.',body:'I wrote Big Ideas for Small Businesses, which outsold Branson, Sugar and Bannatyne combined, and Routine Machine and Evergreen Assets after it. Jason and I built the Ambitious Lifestyle Business podcast on real owners, not gurus. I am not here to hype you up. I am here to help you improve a real business, one percent at a time, until it gives you the life you started it for.'},

 {t:'section',idx:'Your Next Step',title:'Get One Percent Better'},
 {t:'cta',title:'Want to improve your business one percent at a time, alongside owners doing the same?',body:'If the one percent way is how you want to build from here, the One Percent Club is where it happens, with coaching, the gains library and a room full of ambitious owners.',chips:['Join the One Percent Club','Grab a free chapter first'],disc:'Educational content for ambitious small and lifestyle business owners. No specific business, revenue or income result is guaranteed. Outcomes vary by individual, circumstances and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">BIG <b>Idea</b> &middot; John Lamerton</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='corner') h+=mo('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
