<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Becoming Undivided | A live masterclass with Carolyn Huffman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#26405e;        /* her dominant brand slate */
    --deep:#161e2a;      /* deepest brand navy */
    --ink:#f3f1ec;       /* warm off-white text on dark */
    --muted:#aeb8c6;
    --accent:#e7b09f;    /* her only warm accent, peach-rose */
    --rule:rgba(231,176,159,.28);
  }
  html,body{height:100%}
  body{font-family:'Montserrat',system-ui,sans-serif;background:var(--deep);color:var(--ink);overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:9vh 11vw;background:
      radial-gradient(1200px 700px at 78% 18%, rgba(231,176,159,.10), transparent 60%),
      linear-gradient(160deg,var(--bg),var(--deep));}
  .slide.on{display:flex}
  .kick{font-size:clamp(12px,1.5vw,16px);letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:28px}
  h1{font-weight:700;font-size:clamp(34px,6.6vw,86px);line-height:1.04;letter-spacing:-.01em}
  h1 .a{color:var(--accent)}
  h2{font-weight:600;font-size:clamp(26px,4.4vw,56px);line-height:1.1;letter-spacing:-.005em}
  .sub{font-size:clamp(17px,2.2vw,28px);color:var(--muted);font-weight:400;margin-top:26px;max-width:40ch;line-height:1.5}
  .lead{font-size:clamp(19px,2.5vw,32px);line-height:1.5;max-width:30ch;font-weight:400}
  .lead .a{color:var(--accent);font-weight:600}
  .byline{margin-top:40px;font-size:clamp(14px,1.7vw,19px);color:var(--muted);font-weight:500}
  .byline b{color:var(--ink);font-weight:600}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:20px;max-width:34ch}
  li{position:relative;padding-left:40px;font-size:clamp(17px,2.1vw,26px);line-height:1.4;color:var(--ink)}
  li::before{content:'';position:absolute;left:0;top:.55em;width:16px;height:16px;border:2.5px solid var(--accent);border-radius:50%}
  li .s{display:block;font-size:.8em;color:var(--muted);margin-top:6px;font-weight:400}
  .part{font-size:clamp(14px,1.8vw,20px);letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  .big-q{font-family:'Montserrat';font-style:italic;font-weight:400;font-size:clamp(24px,3.6vw,46px);line-height:1.3;max-width:24ch}
  .cta-row{margin-top:40px;display:flex;flex-direction:column;gap:10px}
  .cta-row .where{font-size:clamp(18px,2.3vw,30px);color:var(--accent);font-weight:700;letter-spacing:.01em}
  .disc{position:absolute;left:11vw;right:11vw;bottom:5.5vh;font-size:clamp(11px,1.25vw,14px);color:var(--muted);line-height:1.5;max-width:70ch}
  .count{position:fixed;right:22px;bottom:16px;font-size:12px;letter-spacing:.14em;color:var(--muted);z-index:9}
  .hint{position:fixed;left:22px;bottom:16px;font-size:12px;letter-spacing:.1em;color:var(--muted);z-index:9;opacity:.7}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:14px;vertical-align:middle}
</style>
</head>
<body>
<div id="stage"></div>
<div class="count" id="count"></div>
<div class="hint">Arrow keys or click to advance</div>
<script>
const S=[
  {t:'title'},
  {t:'promise', kick:'The next hour', h:'How accomplished people find their way <span class="a">back to themselves</span>.'},
  {t:'who', kick:'Who this is for', h:'You have the title, the results, the respect.', sub:'And a quiet, private sense that you are performing a version of yourself you no longer recognize.'},
  {t:'trap', kick:'The trap', lead:'Somewhere along the way you got very, very good at becoming <span class="a">whoever the room needed.</span> It worked. That is the problem.'},
  {t:'reframe', kick:'The reframe', q:'You did not lose yourself. You built a self that could survive. You just forgot it was a costume, and started to believe it was you.'},
  {t:'part', part:'Part One', h:'The Divided Self'},
  {t:'point', kick:'The divided self', h:'A life split in two.', sub:'There is the self you perform, polished and adaptive and tireless. And underneath, the self that keeps getting quieter the better the performance gets.'},
  {t:'point', kick:'The cost', h:'High-achievers pay the highest price.', sub:'Twenty-five years guiding leaders taught me this: the more capable you are, the more the world rewards the contorting, and the harder it is to tell the costume from the person.'},
  {t:'part', part:'Part Two', h:'The Way Back'},
  {t:'list', kick:'The Undivided work', h:'Four movements home.', items:[
    {k:'Intuition', s:'Learning to hear your own signal under the noise.'},
    {k:'Sovereignty', s:'Standing in your own authority instead of auditioning for approval.'},
    {k:'Freely Authentic', s:'Living from the true self, not the performed one.'},
    {k:'Coming home', s:'Reconnecting to who you were created to be.'}]},
  {t:'point', kick:'Movement one', h:'Intuition as your compass.', sub:'Intuition is not a feeling you wait for. It is a trained capacity. I studied the science behind it, and it is the instrument we use to see what you have never been able to name.'},
  {t:'point', kick:'Movement two', h:'Sovereignty.', sub:'You stop asking the room who to be. You decide. Sovereignty is the moment the authority moves back inside you, where it always belonged.'},
  {t:'point', kick:'Movement three', h:'Freely authentic.', sub:'Not a new, better performance. The end of performing. You get to simply exist as yourself, and from there you finally begin to thrive.'},
  {t:'point', kick:'Movement four', h:'Coming home.', sub:'For me this is faith. A return to the person God created you to be, which is the very foundation of the intuitive work I do.'},
  {t:'part', part:'Part Three', h:'Living As One Person'},
  {t:'point', kick:'Undivided living', h:'The same life, lived as one person.', sub:'The same career, the same relationships, the same room. What changes is that there is no longer a gap between who you are and who you let them see.'},
  {t:'why', kick:'Why me', h:'Carolyn Huffman', sub:'Former Chief People Officer, 25+ years guiding leaders through change. ICF-trained coach, Certified Intuitive Coach through Atmana Academy, and a Reiki practitioner. My faith has sustained me my whole life, and it is the foundation of this work.'},
  {t:'recap', kick:'In one line', q:'You do not need to become someone new. You need to come home to the one you set aside.'},
  {t:'cta', kick:'Come home to yourself', h:'Ready to come <span class="a">home?</span>',
   sub:"If this is the work your spirit has been asking for, let's talk about what it looks like for you.",
   where:'freelyauthenticcoaching.com', email:'carolyn@freelyauthenticcoaching.com',
   disc:'This masterclass is offered for educational and personal-growth purposes only. It is not professional mental health care or medical care. No specific result is guaranteed. Results vary by individual.'}
];

const stage=document.getElementById('stage');
function slideHTML(s){
  if(s.t==='title') return `<div class="slide">
    <div class="kick"><span class="dot"></span>A live masterclass</div>
    <h1>Becoming <span class="a">Undivided</span></h1>
    <div class="sub">Coming home to who you were created to be.</div>
    <div class="byline">with <b>Carolyn Huffman</b> &nbsp;&middot;&nbsp; Freely Authentic Coaching</div></div>`;
  if(s.t==='promise') return `<div class="slide"><div class="kick">${s.kick}</div><h1>${s.h}</h1></div>`;
  if(s.t==='who'||s.t==='point'||s.t==='why') return `<div class="slide"><div class="kick">${s.kick}</div><h2>${s.h}</h2>${s.sub?`<div class="sub">${s.sub}</div>`:''}</div>`;
  if(s.t==='trap') return `<div class="slide"><div class="kick">${s.kick}</div><div class="lead">${s.lead}</div></div>`;
  if(s.t==='reframe'||s.t==='recap') return `<div class="slide"><div class="kick">${s.kick}</div><div class="big-q">${s.q}</div></div>`;
  if(s.t==='part') return `<div class="slide"><div class="part">${s.part}</div><h1>${s.h}</h1></div>`;
  if(s.t==='list') return `<div class="slide"><div class="kick">${s.kick}</div><h2>${s.h}</h2><ul>${s.items.map(i=>`<li>${i.k}<span class="s">${i.s}</span></li>`).join('')}</ul></div>`;
  if(s.t==='cta') return `<div class="slide">
    <div class="kick"><span class="dot"></span>${s.kick}</div>
    <h1>${s.h}</h1>
    <div class="sub">${s.sub}</div>
    <div class="cta-row"><div class="where">${s.where}</div><div class="byline">Reach out any time at <b>${s.email}</b></div></div>
    <div class="disc">${s.disc}</div></div>`;
  return `<div class="slide"><h2>${s.h||''}</h2></div>`;
}
stage.innerHTML=S.map(slideHTML).join('');
const slides=[...document.querySelectorAll('.slide')];
let i=0;
function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((el,x)=>el.classList.toggle('on',x===i));document.getElementById('count').textContent=(i+1)+' / '+slides.length;}
show(0);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){show(i+1);e.preventDefault();}else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(i-1);e.preventDefault();}});
stage.addEventListener('click',e=>{const r=stage.getBoundingClientRect();show(e.clientX-r.left<r.width*0.28?i-1:i+1);});
</script>
</body>
</html>
