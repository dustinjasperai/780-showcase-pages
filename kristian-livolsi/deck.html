<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Growth Bottleneck Masterclass · Kristian Livolsi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf9f7; --panel:#f1efec; --rule:#e4e0db;
    --acc:#cc3366; --acc2:#5d999d; --ink:#33373d; --body:#4e4d4e; --dim:#948f8a; --paper:#faf9f7;
  }
  html,body{height:100%}
  body{background:#e9e6e2;font-family:'Montserrat',system-ui,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9e6e2}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{color:var(--ink);line-height:1.08}
  .t-title h1{font-family:'Bebas Neue',sans-serif;font-size:7.2vw;max-width:96%;letter-spacing:.01em;line-height:.96}
  .t-normal h1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:3.2vw;max-width:90%;letter-spacing:-.01em;line-height:1.14}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:78%;line-height:1.7;font-weight:400}
  .sub{font-family:'Montserrat',sans-serif;font-style:italic;font-size:1.9vw;color:var(--acc);margin-top:3.6vh;max-width:88%;line-height:1.4;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:700;color:var(--acc);margin-bottom:2.4vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-family:'Bebas Neue',sans-serif;font-size:6.6vw;max-width:94%;letter-spacing:.01em;line-height:.98}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#3a3d44 0%,#2a2c31 100%);align-items:center;text-align:center}
  .t-dark h1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:3.5vw;max-width:90%;color:var(--paper);line-height:1.16}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#3a3d44 0%,#2a2c31 100%);align-items:center;text-align:center}
  .t-cta h1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:3.6vw;max-width:88%;color:var(--paper);line-height:1.14}
  .t-cta .body{font-family:'Montserrat',sans-serif;color:#ded9e0;font-size:1.4vw;margin-top:3vh;max-width:76%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Montserrat',sans-serif;border:1.5px solid var(--acc);color:var(--paper);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.06vw;font-weight:600;letter-spacing:.03em}
  .chip.alt{border-color:var(--acc2)}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-family:'Montserrat',sans-serif;font-size:.82vw;color:var(--dim);text-align:center;line-height:1.5}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:8%;bottom:9%;width:17vw;opacity:.96}
  .corner-vf{right:6.5%;bottom:7.5%;width:8.5vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.05vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(51,55,61,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Montserrat',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:12vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:10vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Business Growth Mindset</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: five ascending segments (the 5 growth areas); one lit in rose = the bottleneck -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g stroke-linecap="round">
    <rect x="14" y="80" width="14" height="26" rx="3" fill="#5d999d" opacity="0.32"/>
    <rect x="35" y="66" width="14" height="40" rx="3" fill="#5d999d" opacity="0.32"/>
    <rect x="56" y="50" width="14" height="56" rx="3" fill="#cc3366" opacity="0.95"/>
    <rect x="77" y="34" width="14" height="72" rx="3" fill="#5d999d" opacity="0.32"/>
    <rect x="98" y="18" width="14" height="88" rx="3" fill="#5d999d" opacity="0.32"/>
    <circle cx="63" cy="40" r="4.6" fill="#cc3366"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Growth Bottleneck',sub:'Why the area you are working on is almost never the one holding your business back.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'The business grew. The weight grew faster.',body:'Revenue is up. The team is bigger. And somehow more of the business sits on you than it did two years ago. You are working harder than the numbers say you should have to, most days feel like putting out the same few fires, and there is a quiet sense that you are pushing on something that will not move. You are not lazy and you are not short of effort. You are pushing on the wrong thing.'},
 {t:'dark',title:'A business is not held back by everything at once. It is held back by one thing at a time.'},

 {t:'section',idx:'Part One',title:'Why More Effort Stops Working'},
 {t:'normal',k:'The loudest fire',title:'Owners fix the area they enjoy, or the one shouting the loudest.',body:'When growth stalls, the instinct is to do more of what you are already good at. The marketer runs more campaigns. The operator tightens operations. The salesperson sells harder. It feels like progress because you are busy and competent. But if the real constraint is somewhere else, all that effort piles up behind a wall that never moves, and the harder you push, the more stuck it feels.'},
 {t:'normal',k:'The five areas',title:'Every business runs on five areas. Growth moves at the pace of the weakest one.',body:'Leadership, People, Cash Flow, Marketing, and Infrastructure. Every company is some version of these five working together. They do not grow evenly, and at any given time one of them is the ceiling. More marketing cannot fix a delivery problem. More sales cannot fix a cash problem. Until you know which of the five is actually capping you, more effort is just more effort.'},
 {t:'dark',title:'You can only grow as fast as your weakest critical area will let you.'},

 {t:'section',idx:'Part Two',title:'The 5 Critical Growth Areas'},
 {t:'normal',k:'The map',title:'Leadership, People, Cash Flow, Marketing, Infrastructure.',body:'Leadership is your own capacity to think, decide, and steady the ship. People is the team and whether they can carry weight without you. Cash Flow is the oxygen that buys you time and options. Marketing is whether enough of the right people know you exist. Infrastructure is the systems and standards that hold when you are not in the room. Each one can be the thing that lifts the business, or the thing that quietly caps it.'},
 {t:'normal',k:'Find the one',title:'Diagnosis before effort. Name the constraint before you touch the tactics.',body:'The skill is not working harder across all five. It is reading the business honestly enough to name the one area that everything else is waiting on. It is usually not the area you are best at or the one you enjoy, which is exactly why it stays hidden. When you find it and put your effort there, the same work that felt stuck starts to move, because it is finally pushing on the thing that was actually holding the line.'},
 {t:'normal',k:'The order',title:'Attract, Convert, Deliver, Scale. In that order, or it breaks.',body:'Growth has a sequence. Attract the right people, convert them well, deliver so they stay and refer, and only then scale the whole thing up. Most stalls are an owner trying to scale before they can deliver, or pour on marketing before the cash and infrastructure can carry it. When you know your weakest area and where you sit in the order, you stop guessing and start fixing the right thing at the right time.'},
 {t:'dark',title:'Fix the constraint, not the comfortable area. That is the whole game.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Fix The Right One'},
 {t:'normal',k:'The business this builds',title:'Growth that stops adding weight and starts holding its own.',body:'When the real constraint lifts, the whole system loosens. The fires you kept fighting turn out to have had one source. The team can carry more because the thing that jammed them is gone. Growth stops meaning more hours from you and starts meaning a business that runs closer to on its own. You get to lead it instead of hold it up, and the reason you started all of this finally has room to show up.'},
 {t:'dark',title:'Build a business that serves your life, not one that quietly consumes it.'},
 {t:'normal',k:'Why Kristian',title:'Built businesses, lost them, and spent 25 years learning what actually holds them back.',body:'Kristian Livolsi built a hospitality group in his twenties, lost nearly everything, and rebuilt from the bottom into an advisor and mentor to founders and CEOs. Across 25 years and hundreds of businesses in dozens of industries, the same pattern held: growth was almost never blocked by the thing the owner was working on. That lived experience, not theory, is what the 5 Critical Growth Areas and the Business Growth Mindset are built on.'},

 {t:'section',idx:'Your Next Step',title:'Find Your Bottleneck'},
 {t:'normal',k:'Keep going with Kristian',title:'This masterclass is the lens. Applying it to your business is the work.',body:'What you just walked through is how to stop pushing on the wrong area and start growing at the pace your real constraint allows. Doing that in your own business, with your own numbers and someone who has seen the pattern hundreds of times, is what the assessment and the coaching are for. If any of this named something you have been carrying, that is the place to begin.'},
 {t:'cta',title:'Ready to find the one area holding your business back?',body:'Take the next step with Kristian and the Business Growth Mindset team.',chips:['Take the Growth Impact Assessment','Book a fit call'],disc:'Educational content for business owners. No income or business result is guaranteed. Results vary by person, business, and effort.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">KRISTIAN <b>LIVOLSI</b> · BUSINESS GROWTH MINDSET</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map((c,ci)=>`<div class="chip${ci===0?'':' alt'}">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
