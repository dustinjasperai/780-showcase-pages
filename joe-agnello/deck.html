<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>From One Chair to Multiple Shops · Joe Agnello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d0d0d; --panel:#1c2838; --rule:#2c3e50;
    --ink:#ffffff; --accent:#0079fe; --accent2:#0065fc; --grey:#7f8ea1; --dim:#5b6b7d;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.005em}
  .t-title h1{font-size:3.5vw;max-width:88%}
  .t-normal h1{font-size:2.6vw;max-width:84%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.58;font-weight:400}
  .sub{font-family:'Montserrat',sans-serif;font-size:1.6vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:2.75vw;max-width:82%;font-style:italic;color:var(--ink)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3vw;max-width:80%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .skyline-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-skyline{right:6%;bottom:8%;width:15vw}
  .corner-skyline{right:6%;bottom:7%;width:6.4vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500;font-family:'Montserrat',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Montserrat',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Montserrat',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.6vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">The Barber Guru</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- skyline motif: a single bar growing into a row of towers, echoing "City Image" and the
     mastermind's own tagline "From One Chair to Multiple Shops" -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="skyline" viewBox="0 0 260 140">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <rect x="14" y="104" width="16" height="26" fill="#2c3e50" opacity="0.9"/>
    <rect x="42" y="90" width="16" height="40" fill="#2c3e50" opacity="0.9"/>
    <rect x="70" y="76" width="16" height="54" fill="#2c3e50" opacity="0.9"/>
    <rect x="98" y="60" width="16" height="70" fill="#0065fc" opacity="0.95"/>
    <rect x="126" y="44" width="16" height="86" fill="#0065fc" opacity="0.95"/>
    <rect x="154" y="28" width="16" height="102" fill="#0079fe"/>
    <rect x="182" y="10" width="16" height="120" fill="#0079fe"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'From One Chair to Multiple Shops',sub:'A masterclass for barbershop owners on the Marketing, Mindset, and Team systems that took one shop to a 10-11 location chain, not haircutting technique.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You are great behind the chair, or you were, but growing past one location feels like a different job entirely.',body:'Most advice sold to barbershop owners is about technique: better fades, faster cuts, more chairs filled. Almost none of it is about the business underneath the shop: the marketing that fills a new location, the mindset shift from technician to owner, and the team systems that keep barbers from walking to the shop down the block.'},
 {t:'dark',title:'A busier chair does not build a second location. A business does.'},

 {t:'section',idx:'Part One',title:'Why Growth Stalls at One Shop'},
 {t:'normal',k:'Owner thinking vs. technician thinking',title:'The habits that make someone a great barber are not the habits that build a ten-shop chain.',body:'A technician gets paid for the chair they are in today. An owner gets paid for a system that runs whether they are in the building or not: financial discipline, a team that stays, and marketing that brings new clients to a shop the owner has never even opened yet.'},
 {t:'normal',k:'The retention trap',title:'Barbers leave for the next shop that looks like it is going somewhere, not just the one paying a point more commission.',body:'Losing a chair is not usually a pay problem. It is a growth problem: if the owner cannot show the team where the business is headed, the best barbers assume it is not headed anywhere.'},
 {t:'dark',title:'You do not need a better cut. You need a business the team can see growing.'},

 {t:'section',idx:'Part Two',title:'The Barber Guru Systems'},
 {t:'normal',k:'Marketing Secrets',title:'The marketing playbook that kept every new City Image location visible and on-brand while the chain scaled from one shop to 10-11.',body:'Not a generic "post more on Instagram" plan. A repeatable system for launching and marketing a new location, built from the actual marketing Joe used to open those shops, not theory.'},
 {t:'normal',k:'Owner Mindset',title:'"Do not pay yourself a lot in the beginning, and reinvest your money." Business ownership is a mindset before it is a skill.',body:'Build a cash buffer before raising your own pay. Reinvest instead of drawing down. Stack capital during good times so you can move on the right lease when the opportunity shows up. And pick partners who share the identical vision: a purely money-motivated partner does not work.'},
 {t:'normal',k:'Team Builder',title:'"If you want to retain your team, you must show growth." The system for going from solo operator to a team that stays.',body:'Retention comes from visible signals the shop is going somewhere, not just the paycheck: maintenance, community presence, social content, staying relevant. Humanize the team, but never skip the numbers.'},
 {t:'dark',title:'Proven across 10-11 real shops, not one location that got lucky.'},

 {t:'section',idx:'Part Three',title:'Proof It Works'},
 {t:'normal',k:'10-11 locations, 50+ barbers',title:'City Image is the largest privately owned barbershop chain in New Jersey, and one of the top 5 in the U.S.',body:'About three quarters of the barbers on the team earn six figures. City Image was the first barbershop chain in the country to offer its team free health insurance, the same team-first mindset behind the Team Builder system, not just an award line.'},
 {t:'normal',k:'Why Joe Agnello',title:'He has never cut a head of hair. That is the whole point.',body:'Joe left a six-figure corporate job and took $0 salary at first to join his brother\'s shop as the business co-founder. Everything in this masterclass is the business side: the marketing, the money discipline, the team systems, not technique. 2022 Entrepreneur of the Year, Barber Grammys.'},

 {t:'section',idx:'Your Next Step',title:'Start the Process'},
 {t:'normal',k:'How it works',title:'A free discovery call finds where your shop is stuck. The Mastermind builds the marketing, mindset, and team systems that get it unstuck.',body:'Weekly group Zoom coaching with Joe, personalized accountability, and step-by-step systems built for immediate use, not classroom theory.'},
 {t:'cta',title:'Ready to build the business side of your barbershop?',chips:['Book the Free Discovery Call'],disc:'Educational content for barbershop owners. No income, growth, or business result is guaranteed. Results vary by shop, market, and effort.'},
];

const deck=document.getElementById('deck');
function skylineSvg(kind){return `<svg class="skyline-motif ${kind==='title'?'title-skyline':'corner-skyline'}"><use href="#skyline"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Barber <b>Guru</b> &middot; Joe Agnello</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=skylineSvg(s.arc);
  else if(s.t==='title') h+=skylineSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
