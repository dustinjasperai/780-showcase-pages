<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Build a Six-Figure Retirement Without a Six-Figure Salary | A masterclass with Charly Stoever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FBF6EF;
    --panel:#F5ECE0;
    --rule:#E7D8CE;
    --ink:#4C013A;
    --ink-soft:#7A4A6B;
    --ink-muted:#9A7E8D;
    --accent:#FF0080;
    --accent-2:#FF8C00;
    --gold:#F2B705;
  }
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Lato',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vmin}
  .slide{display:none;width:100%;max-width:1040px;animation:fade .35s ease}
  .slide.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1,h2,h3,.kicker,.part-k,.num{font-family:'Poppins',sans-serif}
  .kicker{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-size:clamp(30px,5.4vmin,58px);font-weight:700;line-height:1.08;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-size:clamp(24px,4vmin,40px);font-weight:600;line-height:1.14;margin-bottom:20px}
  .sub{font-size:clamp(17px,2.3vmin,22px);color:var(--ink-soft);line-height:1.5;max-width:760px}
  .lead{font-size:clamp(18px,2.5vmin,24px);color:var(--ink-soft);line-height:1.55;max-width:780px;margin-bottom:14px}
  .big{font-size:clamp(22px,3.2vmin,32px);font-weight:700;font-family:'Poppins';line-height:1.2;color:var(--ink);max-width:820px}
  .accent{color:var(--accent)}
  .accent2{color:var(--accent-2)}
  .part-arc{display:inline-block;width:64px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));margin-bottom:26px}
  .part-k{font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);margin-bottom:16px}
  ul.who{list-style:none;margin-top:10px}
  ul.who li{font-size:clamp(17px,2.3vmin,22px);color:var(--ink-soft);padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:800px}
  ul.who li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--accent),var(--accent-2))}
  .pill{display:flex;gap:22px;align-items:flex-start;max-width:860px}
  .pill .n{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:'Poppins';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center}
  .pill .n.alt{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .pill h2{margin-bottom:10px}
  .cta-box{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:clamp(26px,4vmin,44px);max-width:820px}
  .cta-btn{display:inline-block;margin-top:20px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-family:'Poppins';font-weight:600;font-size:19px;padding:15px 30px;border-radius:999px}
  .disc{font-size:13px;color:var(--ink-muted);line-height:1.5;margin-top:22px;max-width:760px}
  .foot{position:fixed;left:6vmin;bottom:4vmin;font-family:'Poppins';font-size:12px;letter-spacing:.04em;color:var(--ink-muted)}
  .prog{position:fixed;right:6vmin;bottom:4vmin;font-family:'Poppins';font-size:12px;color:var(--ink-muted)}
  .bar{position:fixed;left:0;top:0;height:5px;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--gold));transition:width .3s ease}
  .nav{position:fixed;inset:0;display:flex;z-index:5}
  .nav .z{flex:1;cursor:pointer}
  @media(max-width:640px){.foot,.prog{font-size:11px}.pill{gap:14px}.pill .n{width:46px;height:46px;font-size:19px}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="stage"></div>
<div class="foot">Traveler Charly Money Coaching&reg; &middot; Unicorn Millionaire</div>
<div class="prog" id="prog"></div>
<div class="nav"><div class="z" onclick="go(-1)"></div><div class="z" onclick="go(1)"></div></div>
<script>
const S = [
  {t:'title',
    kicker:'A live masterclass with Charly Stoever',
    h1:'Build a Six-Figure Retirement Without a Six-Figure Salary',
    sub:'For LGBTQ+, BIPOC and first-gen folks who were never handed the money playbook. The map nobody gave us, in one sitting.'},

  {t:'who',
    kicker:'Who this is for',
    h2:'This is for you if',
    items:[
      'You earn a decent living, but money still feels heavy and a little scary.',
      'You are the first in your family to try to build real wealth.',
      'The mainstream money world was never built with you in mind.',
      'You want to retire well, and honestly, you would love to travel while you are at it.']},

  {t:'trap',
    kicker:'The story we were sold',
    big:'You were told the path is simple. Earn six figures first, then you get to retire.',
    lead:'So we grind for the salary. We wait to feel ready. And the wealth we were promised somehow never shows up.'},

  {t:'reframe',
    kicker:'The reframe',
    big:'Retirement was never really about the salary.',
    lead:'It is about what you keep, how it grows, and starting before you feel ready. A $40k earner who invests can retire richer than a $150k earner who never does. The number that matters is not your paycheck.'},

  {t:'part', k:'Part One', h2:'Why the old money story keeps us broke'},

  {t:'reframe',
    kicker:'The real starting line',
    big:'For a lot of us, money was fear, scarcity and shame long before it was ever math.',
    lead:'When you grow up without it, money feels like something that could be taken away any second. That feeling, not the spreadsheet, is what keeps people stuck. The first shift is emotional.'},

  {t:'reframe',
    kicker:'Permission',
    big:'The stock market does not care who you are.',
    lead:'It does not check your name, your pronouns, your zip code or your parents. Compounding works the same for everyone who shows up. What is missing was never your worthiness. It was the map.'},

  {t:'part', k:'Part Two', h2:'The Unicorn Millionaire method'},

  {t:'pillar', n:'1', alt:true,
    h2:'Mindset: from scarcity to expansion',
    sub:'Before the tactics, we rewire the story. Money becomes something safe and even joyful to hold, instead of something you brace against. This is the layer under every number that follows.'},

  {t:'pillar', n:'2',
    h2:'Crush debt and build your credit',
    sub:'The on-ramp. We knock out high-interest debt in an order that actually frees up cash, and we raise your credit so the whole system starts working for you instead of against you.'},

  {t:'pillar', n:'3',
    h2:'Invest for the long game',
    sub:'Time in the market beats a big salary. We treat market crashes as a sale, not a crisis, and we build a simple, boring, automatic portfolio you can hold for decades without panic.'},

  {t:'pillar', n:'4', alt:true,
    h2:'Points hacking: see the world for almost free',
    sub:'My favorite part. We turn the money you already spend into flights, hotels and freedom. You do not have to be rich to travel. You have to be strategic. This is how I became Traveler Charly.'},

  {t:'pillar', n:'5',
    h2:'Diversify your income',
    sub:'One paycheck is a single point of failure. We add streams, from side income to a real business, so your future is never tied to one boss, one company or one salary.'},

  {t:'part', k:'Part Three', h2:'Where this actually takes you'},

  {t:'reframe',
    kicker:'The arc',
    big:'It is not a lottery ticket. It is a sequence.',
    lead:'Debt comes down. Credit goes up. The first dollars get invested. The first trip gets booked on points. And slowly a retirement number that once felt impossible starts to look inevitable. Ordinary income, extraordinary discipline.'},

  {t:'whyme',
    kicker:'Why me',
    h2:'I built this because I lived it',
    sub:'I am a nonbinary Latine money coach and a former stockbroker. My highest salary as a teacher was around $40,000. I backpacked Latin America, learned how money actually works, and in my first year in business I out-earned that salary while finishing grad school. I host the Unicorn Millionaire Podcast, and I coach LGBTQ+, BIPOC and first-gen folks to do the same.'},

  {t:'reframe',
    kicker:'The whole point',
    big:'You do not need a six-figure salary. You need the map, the mindset, and to start now.',
    lead:'Everything above is teachable. Everything above is yours to build. The only thing left is deciding to begin.'},

  {t:'cta',
    kicker:'Your next step',
    h2:'Ready to build your six-figure retirement?',
    sub:'If today lit something up, let us do it together. I coach a small number of people one on one, and I would love to hear your story and where you want to go.',
    btn:'Work with me one on one',
    disc:'This masterclass is educational only. It is not financial, investment or tax advice. No specific financial result, income or investment return is guaranteed. Investing carries risk, including the possible loss of principal. Results vary from person to person.'}
];

const stage=document.getElementById('stage');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// allow inline <span class="accent"> etc. authored above; render trusted strings directly
function render(s){
  if(s.t==='title') return `<div class="kicker">${s.kicker}</div><h1>${s.h1}</h1><p class="sub">${s.sub}</p>`;
  if(s.t==='who') return `<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><ul class="who">${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(s.t==='trap'||s.t==='reframe') return `<div class="kicker">${s.kicker}</div><p class="big" style="margin-bottom:18px">${s.big}</p><p class="lead">${s.lead}</p>`;
  if(s.t==='part') return `<div><span class="part-arc"></span><div class="part-k">${s.k}</div><h1>${s.h2}</h1></div>`;
  if(s.t==='pillar') return `<div class="pill"><div class="n ${s.alt?'alt':''}">${s.n}</div><div><h2>${s.h2}</h2><p class="sub">${s.sub}</p></div></div>`;
  if(s.t==='whyme') return `<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><p class="sub">${s.sub}</p>`;
  if(s.t==='cta') return `<div class="kicker">${s.kicker}</div><div class="cta-box"><h2>${s.h2}</h2><p class="sub">${s.sub}</p><span class="cta-btn">${s.btn}</span><p class="disc">${s.disc}</p></div>`;
  return '';
}
let i=0;
function draw(){
  stage.innerHTML=`<div class="slide on">${render(S[i])}</div>`;
  document.getElementById('prog').textContent=(i+1)+' / '+S.length;
  document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));draw()}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){go(1);e.preventDefault()}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){go(-1);e.preventDefault()}
});
draw();
</script>
</body>
</html>
