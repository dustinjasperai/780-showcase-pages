<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Visibility Ceiling, a Masterclass with Leandra Rose</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,500&family=Albert+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2efeb;        /* her dominant light (brand.json 45 uses) */
    --panel:#f8f2ec;     /* warm cream panel */
    --ink:#2a1f17;       /* her dominant dark / text (57 uses) */
    --body:#595959;      /* her body gray (30 uses) */
    --accent:#7d5a3e;    /* caramel brown (ranked, 6 uses) */
    --gold:#caad8a;      /* sandy gold highlight (ranked, 4 uses) */
    --rule:rgba(42,31,23,.14);
    --head:'Bodoni Moda',Georgia,serif;
    --text:'Albert Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ink)}
  body{font-family:var(--text);color:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 120px}
  .slide{position:relative;background:var(--bg);border-radius:18px;margin:0 0 30px;padding:84px 86px;
    min-height:560px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.28)}
  .slide::after{content:'';position:absolute;left:86px;right:86px;bottom:52px;height:2px;
    background:linear-gradient(90deg,var(--accent),var(--gold) 60%,transparent);opacity:.5}
  .num{position:absolute;top:40px;right:48px;font-size:14px;letter-spacing:.2em;color:var(--accent);font-weight:600}
  .kick{font-size:16px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:26px}
  h1{font-family:var(--head);font-weight:600;color:var(--ink);font-size:64px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;color:var(--ink);font-size:46px;line-height:1.1;letter-spacing:-.005em}
  .lede{font-size:26px;line-height:1.5;color:var(--body);margin-top:30px;max-width:40ch;font-weight:300}
  .big{font-family:var(--head);font-weight:500;font-size:52px;line-height:1.16;color:var(--ink);max-width:22ch}
  .big em{font-style:italic;color:var(--accent)}
  .meta{margin-top:40px;font-size:18px;letter-spacing:.04em;color:var(--ink);font-weight:500}
  .meta span{color:var(--accent)}
  .part-n{font-family:var(--head);font-style:italic;font-size:30px;color:var(--accent);margin-bottom:14px}
  ul{list-style:none;margin-top:34px;display:flex;flex-direction:column;gap:20px;max-width:46ch}
  li{position:relative;padding-left:40px;font-size:23px;line-height:1.45;color:var(--ink);font-weight:300}
  li::before{content:'';position:absolute;left:0;top:13px;width:16px;height:16px;border-radius:50%;
    border:2px solid var(--accent);background:var(--gold)}
  .pillar{font-family:var(--head);font-size:40px;color:var(--ink);font-weight:600}
  .pillar small{display:block;font-family:var(--text);font-size:22px;color:var(--body);font-weight:300;margin-top:18px;line-height:1.5;max-width:38ch}
  .horizon{display:flex;gap:10px;align-items:flex-end;margin-top:40px;height:120px}
  .horizon i{display:block;width:40px;background:var(--accent);border-radius:6px 6px 0 0;opacity:.85}
  .quote{font-family:var(--head);font-style:italic;font-size:40px;line-height:1.28;color:var(--ink);max-width:24ch}
  .disc{margin-top:36px;font-size:14px;line-height:1.6;color:var(--body);max-width:60ch;font-weight:300}
  .ctaline{display:inline-block;margin-top:30px;font-size:22px;font-weight:600;color:var(--accent);
    border:2px solid var(--accent);border-radius:100px;padding:16px 34px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A free live masterclass', h:'The Visibility Ceiling',
   lede:'How your nervous system decides how seen, paid and powerful you let yourself be, and how to raise it.',
   meta:'With <span>Leandra Rose</span> · Sovereign Success'},

  {t:'who', kick:'If this is you', h:'You are good at the work. You know it.',
   lede:'And still, you write a post about your own work on your lunch break and delete it before anyone sees. The sales post you wrote this morning came down an hour later.'},

  {t:'trap', kick:'The trap', big:'It looks like a <em>strategy</em> problem. Or like something is <em>wrong with you</em>.'},

  {t:'reframe', kick:'The reframe', big:'Neither is true. Your nervous system has a visibility ceiling, and you have reached <em>yours</em>.'},

  {t:'part', n:'Part One', h:'Why mindset work has not moved it'},
  {t:'quote', q:'Striving got you here. It will not get you there.'},
  {t:'body', kick:'The real location', h:'The pattern lives in the body',
   lede:'Right at the edge of being seen for your own work, you freeze, get distracted, or slide back into old habits, even though you know better. That pattern lives underneath your thinking. So we do not try to talk our way through it. We work with the body.'},

  {t:'part', n:'Part Two', h:'The Sovereign Success Framework'},
  {t:'pillar', kick:'Pillar one', p:'Soul', s:'Your mission and your values. The work you are actually here to do, named clearly enough to build on.'},
  {t:'pillar', kick:'Pillar two', p:'Somatics', s:'The nervous-system capacity to hold more visibility, money and power, and to actually receive it.'},
  {t:'pillar', kick:'Pillar three', p:'Strategy', s:'Offers, pricing and marketing, built on top of that capacity instead of in place of it.'},
  {t:'quote', q:'Strategy is downstream of capacity. You raise the ceiling first.'},

  {t:'part', n:'The Four Visibility Patterns', h:'The patterns running your business'},
  {t:'body', kick:'See which ones are yours', h:'They have been protecting you all along',
   lede:'Four patterns decide how much attention, money and power your nervous system will let you hold. The part of you that hides, over-works or holds back was keeping you safe. Once you can see it clearly, you can work with it.'},

  {t:'part', n:'Part Three', h:'Somatic Alchemy'},
  {t:'body', kick:'The method', h:'A somatic recalibration',
   lede:'Breathwork, somatic hypnosis and nervous-system work guide your body to feel safe being seen, being paid and receiving more, so it can finally agree with what your soul already knows: you are meant for bigger.'},
  {t:'list', kick:'When the ceiling rises', h:'What changes', items:[
     'You say what you do out loud, to anyone, without shrinking it.',
     'You say your price without the stomach drop.',
     'You sell without cringing at your own words.',
     'You let your work reach the people it was made for.']},

  {t:'whyme', kick:'Your guide', h:'Leandra Rose',
   lede:'After 15 years as a teacher, she has spent more than 10,000 hours in 1:1 sessions with leaders and entrepreneurs. She is the creator of Somatic Alchemy and the founder of Sovereign Success.'},
  {t:'quote', q:'One session shows you where your ceiling is, and gives your body its first taste of the other side.'},

  {t:'cta', kick:'Your next step', h:'Ready to raise your ceiling for good?',
   lede:'The 1:1 Somatic Mentorship is six months of Soul, Somatics and Strategy, by application.',
   cta:'Apply for the 1:1 Somatic Mentorship',
   disc:'This masterclass is for education only. It is not therapy or medical advice. No specific result is guaranteed. Results vary and depend on your own work and circumstances.'}
];

function bars(){let h='';const hts=[34,46,58,72,88,106];for(const v of hts)h+=`<i style="height:${v}px"></i>`;return `<div class="horizon">${h}</div>`;}

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const n = String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  let inner = `<div class="num">${n}</div>`;
  if(s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if(s.t==='title'){ inner += `<h1>${s.h}</h1><div class="lede">${s.lede}</div><div class="meta">${s.meta}</div>${bars()}`; }
  else if(s.t==='trap'||s.t==='reframe'){ inner += `<div class="big">${s.big}</div>`; }
  else if(s.t==='quote'){ inner = `<div class="num">${n}</div><div class="quote">${s.q}</div>`; }
  else if(s.t==='part'){ inner += `<div class="part-n">${s.n}</div><h2>${s.h}</h2>`; }
  else if(s.t==='pillar'){ inner += `<div class="pillar">${s.p}<small>${s.s}</small></div>`; }
  else if(s.t==='list'){ inner += `<h2>${s.h}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`; }
  else if(s.t==='cta'){ inner += `<h2>${s.h}</h2><div class="lede">${s.lede}</div><div class="ctaline">${s.cta}</div><div class="disc">${s.disc}</div>`; }
  else { inner += (s.h?`<h2>${s.h}</h2>`:'') + (s.lede?`<div class="lede">${s.lede}</div>`:''); }
  const d = document.createElement('div'); d.className='slide'; d.innerHTML = inner; deck.appendChild(d);
});
</script>
</body>
</html>
