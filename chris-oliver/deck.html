<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basketball Decision Training — a live masterclass with Chris Oliver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3; --panel:#122b46; --accent:#df6933; --ink:#20242b;
    --panelink:#eef2f7; --rule:#e2ddd3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Raleway",system-ui,sans-serif;line-height:1.5;}
  #deck{max-width:960px;margin:0 auto;padding:30px 18px 70px;}
  .slide{background:#fff;border:1px solid var(--rule);border-radius:12px;
    padding:46px 50px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 2px 18px rgba(18,43,70,.06);}
  .slide.dark{background:var(--panel);color:var(--panelink);border-color:var(--panel);}
  .slide.accentbar{border-left:7px solid var(--accent);}
  .k{font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.17em;text-transform:uppercase;
    font-size:14px;color:var(--accent);margin-bottom:16px;}
  .slide.dark .k{color:var(--accent);}
  h2{font-family:"Oswald",sans-serif;font-weight:700;font-size:40px;line-height:1.08;margin:0 0 18px;
    color:var(--panel);text-transform:uppercase;letter-spacing:.005em;}
  .slide.dark h2{color:#fff;}
  .lead{font-size:21px;line-height:1.5;margin:0 0 10px;}
  .body{font-size:18px;color:#413d35;}
  .slide.dark .body{color:#c9d3df;}
  ul{margin:14px 0 0;padding:0 0 0 20px;}
  li{font-size:18px;margin:0 0 11px;}
  li b{color:var(--panel);}
  .slide.dark li b{color:var(--accent);}
  .title h1{font-family:"Oswald",sans-serif;font-weight:700;font-size:58px;line-height:1.02;
    text-transform:uppercase;margin:0 0 20px;color:#fff;}
  .title .sub{font-size:22px;color:#cdd7e2;max-width:70%;}
  .pageno{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.2em;color:#9a9284;
    text-transform:uppercase;margin-bottom:10px;}
  .disc{font-size:13px;color:#8a8378;margin-top:22px;max-width:80%;}
  .slide.dark .disc{color:#8fa0b4;}
  .cta-step{font-family:"Oswald",sans-serif;font-weight:600;font-size:22px;color:var(--accent);
    margin-top:8px;}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Chris Oliver', h:'Basketball Decision Training',
   sub:'How to make what your players practice actually show up in the game.'},

  {t:'promise', k:'What this hour gives you', h:'The games-based fix',
   b:'A clear, repeatable way to turn flat, repetitive drills into practice that transfers to live play, built on the method coaches from high school to the NBA already use.'},

  {t:'who', k:'Who this is for', h:'Coaches who want transfer',
   pts:['Youth and high-school coaches whose players look great in drills and stall in games',
        'College and pro staffs chasing faster, smarter decisions',
        'Any coach tired of running drills that never reach Friday night']},

  {t:'trap', k:'The trap', h:'Sharp in practice, frozen in the game',
   b:'Your players rep the move perfectly on Tuesday. Then the game speeds up, a defender shows, and they freeze. It is not effort and it is not talent. It is how the practice was built.'},

  {t:'reframe', dark:true, k:'The hard truth', h:'The drill is not the game',
   b:'A drill with no defender, no clock, and no choice trains a motion, not a decision. The game is nothing but decisions. If practice never asks for one, it never prepares your players to make one.'},

  {t:'part', k:'Part one', h:'Why drills do not transfer',
   b:'Blocked, repetitive practice feels productive because it looks clean. But clean reps build a skill your players can only perform in the exact conditions they practiced, which the game never repeats.'},

  {t:'evidence', k:'What the research says', h:'Random beats blocked',
   pts:['Skill is learned inside the context of the game, not separate from it',
        'Variable, messy practice transfers far better than tidy repetition',
        'Decision training is mind training, your players learn to read, not just to move']},

  {t:'part', dark:true, k:'Part two', h:'The method, in four pieces',
   b:'Four ideas stack into one way of coaching. Each one adds decisions back into practice.'},

  {t:'framework', k:'Piece one', h:'The Games Approach', accentbar:true,
   b:'Teach the skill inside game-like play from the start. Progress from guided structure to open play so players build basketball IQ in the conditions they will actually face.'},

  {t:'framework', k:'Piece two', h:'Basketball Decision Training', accentbar:true,
   b:'Put a read inside every rep. The drill itself forces a choice, pass or drive, attack or reset, so players train the decision at the same time as the skill.'},

  {t:'framework', k:'Piece three', h:'The Constraint-Led Approach', accentbar:true,
   b:'Add or remove one rule, a line they must cross, a touch limit, a scoring tweak, and players self-organize a solution. You coach less and they decide more.'},

  {t:'framework', k:'Piece four', h:'Small-Sided Games', accentbar:true,
   b:'Fewer players, less space, more touches. Reducing the game multiplies the number of real decisions each player makes per minute, and the messy reps are the point.'},

  {t:'together', k:'How it fits', h:'One practice, decisions everywhere',
   pts:['Every drill carries a read, so reps and decisions train together',
        'Constraints shape the behavior you want without a single long speech',
        'Small-sided games raise the decision count without adding time']},

  {t:'part', k:'Part three', h:'On the floor, in a real practice',
   b:'This is not more to do. It is the same practice time, rebuilt so every rep trains a decision your players will face on game night.'},

  {t:'plan', k:'The five-drill week', h:'A practice week that transfers',
   pts:['Small-sided reads to open the week',
        'Constraint games that force the choice',
        'Decision shooting, not just shooting',
        'Transition reads at game speed',
        'Live scrimmage that rewards the right decision']},

  {t:'change', dark:true, k:'What changes', h:'Players who read the game',
   b:'Within weeks, players stop waiting for the called play and start solving what the defense gives them. Decision making becomes their best quality, and it shows up when the game speeds up.'},

  {t:'why', k:'Why learn this from me', h:'Chris Oliver',
   pts:['17-year college head coach, over 300 wins at a .750 clip, 3x OUA Coach of the Year',
        'Coached Canada to gold at the 2018 Jones Cup',
        'Consultant to NBA, NCAA, and professional teams and national federations',
        'Founder of Basketball Immersion, a 700-video coach-education community']},

  {t:'proof', k:'Where this lives', h:'A whole community built on it',
   b:'Basketball Immersion is 700-plus videos, 25-plus courses, and weekly masterclasses with top coaches, all built on the games-based, decision-first approach. Coaches from the high-school level to the NBA learn here.'},

  {t:'recap', k:'The one idea', h:'Train decisions, not just drills',
   b:'If practice never asks for a decision, the game will. Build the read into every rep and your players arrive ready to make it.'},

  {t:'cta', k:'Your next step', h:'Bring this to your practices',
   b:'Start with the free 5 Drill Game Based Practice Plan, then join the Basketball Immersion community to put the full method to work with your team.',
   step:'Get the free manual, then join Basketball Immersion',
   disc:'Educational content only. No specific result or outcome is guaranteed. Results vary by coach, team, and context.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'slide' + (s.dark ? ' dark' : '') + (s.accentbar ? ' accentbar' : '') + (s.t === 'title' ? ' dark title' : '');
  let html = '';
  html += '<div class="pageno">' + (i+1).toString().padStart(2,'0') + ' / ' + S.length.toString().padStart(2,'0') + '</div>';
  if (s.k) html += '<div class="k">' + s.k + '</div>';
  if (s.t === 'title') {
    html += '<h1>' + s.h + '</h1>';
    if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  } else {
    html += '<h2>' + s.h + '</h2>';
    if (s.b) html += '<div class="lead body">' + s.b + '</div>';
    if (s.pts) { html += '<ul>'; s.pts.forEach(p => html += '<li>' + p + '</li>'); html += '</ul>'; }
    if (s.step) html += '<div class="cta-step">' + s.step + '</div>';
    if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  }
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
