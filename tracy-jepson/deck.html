<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Path to Profit - A Masterclass with Tracy Jepson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbfbf9; --panel:#f2f4f1; --ink:#1f2433; --ink-soft:#434a5c;
    --rule:#e3e6e1; --accent:#2fae7a; --steel:#26547c; --muted:#7b8192;
  }
  html,body{height:100%}
  body{
    font-family:'Open Sans',system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #stage{position:relative; width:100vw; height:100vh; max-width:1280px; max-height:720px}
  .slide{position:absolute; inset:0; display:none; flex-direction:column;
    justify-content:center; padding:76px 84px; opacity:0; transition:opacity .25s ease}
  .slide.on{display:flex; opacity:1}
  .eyebrow{font-family:'Poppins',sans-serif; font-weight:700; font-size:13px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:22px}
  .part-label{font-family:'Poppins',sans-serif; font-weight:700; font-size:15px;
    letter-spacing:.16em; text-transform:uppercase; color:var(--steel)}
  h1{font-family:'Poppins',sans-serif; font-weight:800; font-size:62px; line-height:1.05;
    letter-spacing:-.01em; color:var(--ink); margin-bottom:24px}
  h2{font-family:'Poppins',sans-serif; font-weight:700; font-size:44px; line-height:1.1;
    letter-spacing:-.01em; color:var(--ink); margin-bottom:20px}
  .lead{font-size:26px; line-height:1.4; color:var(--ink-soft); max-width:62ch}
  .sub{font-size:20px; line-height:1.5; color:var(--muted); margin-top:18px; max-width:60ch}
  .big{font-family:'Poppins',sans-serif; font-weight:800; font-size:52px; line-height:1.12;
    letter-spacing:-.01em; max-width:20ch}
  .big .hl{color:var(--accent)}
  ul{list-style:none; margin-top:14px}
  li{font-size:23px; line-height:1.5; color:var(--ink-soft); padding-left:34px; position:relative; margin-bottom:16px; max-width:58ch}
  li::before{content:""; position:absolute; left:0; top:13px; width:14px; height:14px; border-radius:3px; background:var(--accent)}
  .map{margin-top:30px; display:flex; flex-direction:column; gap:12px; max-width:720px}
  .row{display:flex; align-items:center; gap:18px; background:var(--panel);
    border:1px solid var(--rule); border-left:5px solid var(--accent); border-radius:10px; padding:18px 24px}
  .row .n{font-family:'Poppins',sans-serif; font-weight:800; font-size:22px; color:var(--accent); min-width:30px}
  .row .lab{font-family:'Poppins',sans-serif; font-weight:700; font-size:22px; color:var(--ink)}
  .row .note{font-size:17px; color:var(--muted); margin-left:auto}
  .cred{margin-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:14px 40px; max-width:900px}
  .cred div{font-size:21px; color:var(--ink-soft); padding-left:30px; position:relative}
  .cred div::before{content:""; position:absolute; left:0; top:11px; width:11px; height:11px; border-radius:50%; background:var(--steel)}
  .cta-box{margin-top:26px; font-size:24px; color:var(--ink-soft); max-width:60ch}
  .cta-step{font-family:'Poppins',sans-serif; font-weight:700; font-size:30px; color:var(--steel); margin-top:20px}
  .disclaimer{position:absolute; left:84px; right:84px; bottom:40px; font-size:13px;
    color:var(--muted); line-height:1.5; border-top:1px solid var(--rule); padding-top:14px}
  .brandline{position:absolute; left:84px; bottom:40px; font-family:'Poppins',sans-serif;
    font-weight:600; font-size:14px; color:var(--muted); letter-spacing:.04em}
  #dots{position:absolute; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:5}
  #dots i{width:7px; height:7px; border-radius:50%; background:var(--rule); display:block}
  #dots i.on{background:var(--accent)}
  #count{position:absolute; top:28px; right:34px; font-family:'Poppins',sans-serif;
    font-weight:600; font-size:13px; color:var(--muted); letter-spacing:.08em}
  .nav{position:absolute; top:0; width:38%; height:100%; cursor:pointer; z-index:4}
  .nav.prev{left:0} .nav.next{right:0}
  @media (max-width:820px){
    .slide{padding:42px 34px}
    h1{font-size:40px} h2{font-size:30px} .big{font-size:34px}
    .lead{font-size:20px} li{font-size:18px} .cred{grid-template-columns:1fr}
    .brandline,.disclaimer{left:34px; right:34px}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="count"></div>
  <div class="nav prev" onclick="go(-1)"></div>
  <div class="nav next" onclick="go(1)"></div>
  <div id="dots"></div>
</div>
<script>
const S=[
  {t:'title', eyebrow:'Small Business Big Deal', h:'The Path<br>to Profit',
   lead:'How service owners take profit first, so it stops being whatever is left over.',
   sub:'A live masterclass with Tracy Jepson, Certified Profit First Mastery Professional.'},
  {t:'who', eyebrow:'Who this is for', h:'This is for you if...',
   items:['You run a service-based business, somewhere in your first five years.',
          'You have had good months, even great ones, and still felt broke.',
          'You are tired of guessing whether you can pay yourself this month.',
          'You want a business that is profitable now and sellable later.']},
  {t:'trap', eyebrow:'The trap', big:'Your best month ever.<br>And the account is <span class="hl">still empty.</span>',
   sub:'If that feels familiar, the problem is not how much comes in. It is the order in which it goes out.'},
  {t:'hook', eyebrow:'The hard truth', big:'More revenue will not<br>fix this. It will <span class="hl">make it worse.</span>',
   sub:'Until profit has a place to go before everything else, growth just means bigger bills.'},
  {t:'part', label:'Part One', h:'Why profitable businesses still run out of cash'},
  {t:'body', eyebrow:'Path to Profit', h:'The leftover trap',
   lead:'Most owners pay everyone first, taxes, suppliers, staff, software, and keep whatever is left. Month after month, almost nothing is left.'},
  {t:'body', eyebrow:'Path to Profit', h:'Growth makes it worse',
   lead:'A bigger top line with the same habits means bigger bills and the same empty account. More revenue does not fix a profit problem. It magnifies it.'},
  {t:'part', label:'Part Two', h:'The Path to Profit money map'},
  {t:'map', eyebrow:'The money map', h:'Four accounts, one order',
   rows:[{n:'1', lab:'Profit', note:'taken first'},
         {n:'2', lab:'Owner&rsquo;s pay', note:'you get paid'},
         {n:'3', lab:'Tax', note:'set aside, never touched'},
         {n:'4', lab:'Operating expenses', note:'run on what is left'}]},
  {t:'body', eyebrow:'Path to Profit', h:'Profit comes first',
   lead:'The day the money lands, profit comes out first, into its own account, before a single bill is paid. Profit stops being a hope and becomes a habit.'},
  {t:'rhythm', eyebrow:'The rhythm', h:'Twice a month. Fifteen minutes.',
   lead:'Two short appointments a month to move the money into its accounts. Profit becomes something you do on a schedule, not something you wait to see if there is any of.'},
  {t:'part', label:'Part Three', h:'Your first profit-first month'},
  {t:'body', eyebrow:'Path to Profit', h:'Start small, start now',
   lead:'Month one you take profit even if it is tiny. The habit matters more than the number. The number grows as the system does its job.'},
  {t:'payoff', eyebrow:'The payoff', big:'Profitable now.<br><span class="hl">Sellable later.</span>',
   sub:'Every system you install raises the real value of the company, so one day you own an asset, not just a job.'},
  {t:'cred', eyebrow:'Who is teaching this', h:'Tracy Jepson',
   items:['25 years in small business administration and advisory work.',
          'Certified Profit First Mastery Professional.',
          'CEO of Jepson Solutions, LLC.',
          'Business Made Simple and Certified Value Builder coach.',
          'Host of the Small Business Big Deal podcast.',
          'She coaches the numbers, not the mindset.']},
  {t:'recap', eyebrow:'The whole method, in one line',
   big:'Profit first. Pay yourself.<br>Set aside tax. <span class="hl">Run on the rest.</span>'},
  {t:'cta', eyebrow:'Your next step', h:'Install the Path to Profit in your business.',
   box:'If you want help putting this to work in your own numbers, book a strategy call and we will map your first profit-first month together.',
   step:'Book your strategy call at tracyjepson.com',
   disclaimer:'Educational only. No specific income, profit, or business result is guaranteed. Results vary with your own numbers, effort, and circumstances. Nothing here is individualized financial, tax, or legal advice.'}
];

const stage=document.getElementById('stage');
function el(html){const d=document.createElement('div'); d.className='slide'; d.innerHTML=html; return d;}
function list(items){return '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}

function build(s){
  if(s.t==='title') return el(`<div class="eyebrow">${s.eyebrow}</div><h1>${s.h}</h1>
    <div class="lead">${s.lead}</div><div class="sub">${s.sub}</div><div class="brandline">PATH TO PROFIT</div>`);
  if(s.t==='who') return el(`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2>${list(s.items)}`);
  if(s.t==='trap'||s.t==='hook'||s.t==='payoff') return el(`<div class="eyebrow">${s.eyebrow}</div>
    <div class="big">${s.big}</div><div class="sub">${s.sub}</div>`);
  if(s.t==='part') return el(`<div class="part-label">${s.label}</div><h1 style="margin-top:14px">${s.h}</h1>`);
  if(s.t==='body'||s.t==='rhythm') return el(`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><div class="lead">${s.lead}</div>`);
  if(s.t==='map') return el(`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><div class="map">`+
    s.rows.map(r=>`<div class="row"><span class="n">${r.n}</span><span class="lab">${r.lab}</span><span class="note">${r.note}</span></div>`).join('')+`</div>`);
  if(s.t==='cred') return el(`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><div class="cred">`+
    s.items.map(x=>`<div>${x}</div>`).join('')+`</div>`);
  if(s.t==='recap') return el(`<div class="eyebrow">${s.eyebrow}</div><div class="big">${s.big}</div>`);
  if(s.t==='cta') return el(`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2>
    <div class="cta-box">${s.box}</div><div class="cta-step">${s.step}</div>
    <div class="disclaimer">${s.disclaimer}</div>`);
  return el(`<div class="lead">${s.t}</div>`);
}

let i=0; const slides=S.map(build); slides.forEach(sl=>stage.appendChild(sl));
const dots=document.getElementById('dots'); const count=document.getElementById('count');
S.forEach(()=>{const d=document.createElement('i'); dots.appendChild(d);});
function show(n){
  i=Math.max(0,Math.min(S.length-1,n));
  slides.forEach((sl,k)=>sl.classList.toggle('on',k===i));
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
  count.textContent=(i+1)+' / '+S.length;
}
function go(d){show(i+d);}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') go(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});
show(0);
</script>
</body>
</html>
