<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relaunch Your Career Like a Brand, a live masterclass with Joseph Liu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec;        /* warm cream ground (his light scheme) */
    --panel:#2b4254;     /* slate-navy, his dominant color */
    --ink:#22323f;       /* slate text */
    --muted:#5c6672;
    --accent:#c29047;    /* warm gold, his link/button/H2 accent */
    --line:rgba(43,66,84,.14);
    --disp:'Space Grotesk',system-ui,sans-serif;
    --serif:'Newsreader',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);
    -webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;position:relative;border-bottom:1px solid var(--line)}
  .kicker{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--disp);font-weight:600;font-size:clamp(38px,6.2vw,80px);
    line-height:1.05;letter-spacing:-.015em;color:var(--ink);max-width:16ch}
  h2{font-family:var(--disp);font-weight:600;font-size:clamp(30px,4.4vw,54px);
    line-height:1.08;letter-spacing:-.01em;max-width:20ch}
  .sub{font-size:clamp(20px,2.3vw,29px);line-height:1.45;color:var(--muted);
    margin-top:28px;max-width:34ch;font-weight:400}
  .lead{font-size:clamp(22px,2.5vw,33px);line-height:1.4;max-width:26ch;margin-top:8px}
  ul{list-style:none;margin-top:38px;max-width:40ch}
  li{font-size:clamp(19px,2.1vw,26px);line-height:1.4;padding-left:36px;position:relative;
    margin-bottom:22px;color:var(--ink)}
  li::before{content:'';position:absolute;left:0;top:.62em;width:16px;height:16px;
    border:2.4px solid var(--accent);border-radius:4px}
  li b{font-family:var(--disp);font-weight:600}
  .num{font-family:var(--disp);font-weight:600;color:var(--accent);font-size:.9em;
    margin-right:.5em}
  /* dark panel slides */
  .slide.panel{background:var(--panel);color:#eef1f4;border-bottom-color:rgba(255,255,255,.1)}
  .slide.panel h1,.slide.panel h2{color:#fff}
  .slide.panel .sub,.slide.panel .lead{color:#c5cdd6}
  .slide.panel li{color:#e6eaef}
  .slide.panel .kicker{color:#dbba69}
  /* part divider */
  .part .pn{font-family:var(--disp);font-weight:700;font-size:clamp(16px,2vw,22px);
    letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  /* stage grid */
  .stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;
    margin-top:44px;max-width:60ch}
  .st{border:2px solid var(--line);border-radius:12px;padding:18px 18px}
  .st .sname{font-family:var(--disp);font-weight:600;font-size:20px}
  .st .sd{font-size:16px;color:var(--muted);margin-top:6px;line-height:1.3}
  .st.on{background:var(--accent);border-color:var(--accent)}
  .st.on .sname{color:#fff}.st.on .sd{color:#fbf3e6}
  .st.deep{background:var(--panel);border-color:var(--panel)}
  .st.deep .sname{color:#fff}.st.deep .sd{color:#c5cdd6}
  .foot{position:absolute;left:8vw;bottom:4vh;font-family:var(--disp);font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .cta-line{font-family:var(--disp);font-weight:600;font-size:clamp(22px,2.6vw,30px);
    color:var(--accent);margin-top:34px}
  .disclaimer{font-size:15px;line-height:1.5;color:var(--muted);margin-top:40px;
    max-width:52ch;border-top:1px solid var(--line);padding-top:20px}
  .prog{position:fixed;top:0;left:0;height:4px;background:var(--accent);width:0;z-index:9}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<main id="deck"></main>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Joseph Liu',
   h:'Relaunch Your Career the Way a Strategist Relaunches a Brand',
   sub:'One live hour on the seven stages of every career change, and how to move through them on purpose.'},

  {t:'content', kicker:'Who this is for',
   h:'You look successful. You feel between stages.',
   points:['You are good at what you do, and quietly done with it.',
     'A new title or a lateral move feels like the same job in a year.',
     'You want a change that lasts, not another restart in eighteen months.']},

  {t:'content', kicker:'The trap',
   h:'You keep optimizing a career you have already outgrown.',
   sub:'So the plan becomes a better version of the wrong thing. More responsibility, more money, same quiet feeling on Sunday night.'},

  {t:'panel', kicker:'The reframe',
   h:'You do not have a job problem. You have a positioning problem.',
   sub:'The market cannot place you where you have never told it you belong. That is a brand problem, and brand problems have a method.'},

  {t:'part', pn:'Part One', h:'Why the leap keeps failing'},

  {t:'content', kicker:'The core mistake',
   h:'Most people jump on Departure energy and skip Reflection.',
   points:['They quit or pivot at the moment of maximum frustration.',
     'They land in a role that fits the person they were leaving.',
     'Within a year the doubt is back, and the loop starts again.']},

  {t:'content', kicker:'The cost',
   h:'The burnout loop is expensive.',
   sub:'Exhaustion pushes the leap, the leap lands badly, and the next role restarts the same cycle. The problem was never the job. It was moving without a map.'},

  {t:'part', pn:'Part Two', h:'The 7 Stages of Career Change'},

  {t:'stages', kicker:'The map',
   h:'Name where you actually are.',
   stages:[
     {n:'Status Quo', d:'content, for now'},
     {n:'Doubt', d:'is this it?'},
     {n:'Dismay', d:'quietly checked out'},
     {n:'Mitigation', d:'hobbies fill the gap'},
     {n:'Exhaustion', d:'running on empty'},
     {n:'Departure', d:'the decision to leave'},
     {n:'Reflection', d:'recalibrate', cls:'deep'},
     {n:'Relaunch', d:'new purpose', cls:'on'}]},

  {t:'content', kicker:'The early stages',
   h:'Doubt, Dismay, Mitigation.',
   sub:'This is where most people live for years. They are not failing. They are early in a normal arc, mistaking a stage for a life sentence.'},

  {t:'panel', kicker:'The stage everyone skips',
   h:'Reflection is the real turning point.',
   sub:'Not the dramatic exit. The quiet, deliberate pause where you decide what you now stand for. Skip it, and you relaunch as the old you.'},

  {t:'content', kicker:'What Relaunch requires',
   h:'Clarity, confidence, and courage. All three.',
   points:['<b>Clarity</b> on what you actually want next.',
     '<b>Confidence</b> that you can credibly do it.',
     '<b>Courage</b> to make the move before it feels safe.']},

  {t:'part', pn:'Part Three', h:'Relaunch yourself like a brand'},

  {t:'content', kicker:'The method I know best',
   h:'I spent ten years relaunching products. The moves are the same.',
   sub:'Positioning, message, and visibility. The exact playbook global brands use to reintroduce themselves, applied to a person.'},

  {t:'content', kicker:'Move one, positioning',
   h:'Decide what you now stand for.',
   sub:'Not your history. Your claim. The single space in the market you want to own from here, stated clearly enough that other people can repeat it.'},

  {t:'content', kicker:'Move two, the personal pitch',
   h:'Say it in one line.',
   sub:'If a stranger cannot repeat what you do after one sentence, the market will keep filing you under your old title. Your pitch is the relaunch, compressed.'},

  {t:'content', kicker:'Move three, the personal brand',
   h:'Make the market come to you.',
   points:['Show the new positioning where your future clients already look.',
     'Let the work argue for you, so you are not starting cold every time.',
     'Consistency is the whole trick. A brand is a promise kept in public.']},

  {t:'content', kicker:'The relaunch, in practice',
   h:'Ninety days, done on purpose.',
   sub:'You name your stage, choose your positioning, sharpen the pitch, and put it in front of the right people. The leap stops being a gamble and becomes a plan.'},

  {t:'panel', kicker:'Why me',
   h:'I relaunched my own career before I taught it.',
   points:['Dropped out of medical school, then spent ten years in brand management for Glad, Liquid-Plumr and Haagen-Dazs.',
     'Left the stable job in 2013 to build this. One of the scariest moves I have made.',
     'Thirteen years coaching, a TEDx talk, and the Career Relaunch podcast with professionals from Microsoft to Nike.']},

  {t:'cta', kicker:'Your next step',
   h:'Ready to plan your relaunch?',
   ctaline:'Book a Career Change consultation at josephliu.co',
   sub:'Bring the stage you think you are in. We will map the positioning, the pitch, and the first ninety days together.',
   disclaimer:'This masterclass is educational. It shares a framework and a method only. No specific career, income, or hiring result is guaranteed. Results vary based on your own situation, effort, and choices.'}
];

const deck = document.getElementById('deck');
function esc(x){return x;}
S.forEach(s=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='panel'?' panel':'') + (s.t==='part'?' part panel':'') + (s.t==='cta'?' panel':'');
  let html = '';
  if(s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if(s.t==='part'){ html = `<div class="pn">${s.pn}</div><h1>${s.h}</h1>`; }
  else if(s.t==='title'){ html += `<h1>${s.h}</h1>` + (s.sub?`<div class="sub">${s.sub}</div>`:''); }
  else {
    html += `<h2>${s.h}</h2>`;
    if(s.sub) html += `<div class="sub">${s.sub}</div>`;
    if(s.points){ html += '<ul>' + s.points.map(p=>`<li>${p}</li>`).join('') + '</ul>'; }
    if(s.stages){ html += '<div class="stages">' + s.stages.map(x=>`<div class="st ${x.cls||''}"><div class="sname">${x.n}</div><div class="sd">${x.d}</div></div>`).join('') + '</div>'; }
    if(s.ctaline) html += `<div class="cta-line">${s.ctaline}</div>`;
    if(s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  }
  el.innerHTML = html;
  deck.appendChild(el);
});
window.addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  document.getElementById('prog').style.width=(scrollY/h*100)+'%';
});
</script>
</body>
</html>
