<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Judgment Gap — Amplify Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f0e6; --panel:#ebe4d6; --rule:#d8d2ca;
    --ink:#1e1b18; --muted:#6b6457; --accent:#c6a15b; --deep:#151412;
    --display:"Cormorant Garamond",Georgia,serif; --body:"Figtree",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--deep);color:var(--ink);font-family:var(--body)}
  #deck{max-width:960px;margin:0 auto}
  .slide{background:var(--bg);min-height:92vh;margin:18px 0;padding:72px 68px;
    border:1px solid var(--rule);border-radius:4px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:68px;top:52px;width:46px;height:2px;background:var(--accent)}
  .kick{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    margin-bottom:26px;font-weight:600}
  h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.08;letter-spacing:-.01em}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);margin-top:22px;max-width:40ch}
  .sub{font-size:18px;line-height:1.5;color:var(--muted);margin-top:16px;max-width:46ch}
  .big{font-family:var(--display);font-size:34px;line-height:1.2;max-width:24ch}
  .big .a{color:var(--accent)}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:48ch}
  li{position:relative;padding-left:26px;font-size:19px;line-height:1.45}
  li::before{content:"";position:absolute;left:0;top:11px;width:8px;height:8px;background:var(--accent);border-radius:1px}
  .num{font-family:var(--display);font-size:22px;color:var(--accent);font-weight:700}
  .foot{position:absolute;left:68px;right:68px;bottom:40px;display:flex;justify-content:space-between;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .disc{font-size:13px;color:var(--muted);margin-top:30px;max-width:52ch;line-height:1.5}
  .cta-line{font-size:22px;color:var(--ink);margin-top:20px;font-weight:600}
  .pager{position:fixed;right:16px;bottom:14px;font-size:12px;color:#cfc8ba;background:#1e1b18;
    padding:5px 11px;border-radius:20px;font-family:var(--body);letter-spacing:.08em}
  @media(max-width:700px){.slide{padding:48px 30px}h1{font-size:40px}h2{font-size:30px}.big{font-size:26px}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="pager" id="pager"></div>
<script>
const S=[
  {t:'title',k:'A live masterclass for senior leaders',h:'The Judgment Gap',
   lead:'Why the executives who can use AI themselves will lead the room, and the ones who only talk about it will not.'},

  {t:'who',k:'Who this is for',h:'You know AI matters. You feel a step behind.',
   sub:'You run a team, a function, or a company. You have watched the demos and tried the tools. And you are quietly aware that being able to talk about AI is not the same as being able to lead it.'},

  {t:'trap',k:'The trap',h:'The demo graveyard',
   sub:'A webinar here, a tool trial there, a slide deck of use cases. Impressive in the moment. Then Monday comes, the real decision lands, and nothing you saw actually changes how you make it.'},

  {t:'reframe',k:'The real risk',big:'The risk is not falling behind on <span class="a">tools</span>. It is being asked to lead something you cannot yet do <span class="a">yourself</span>.'},

  {t:'part',k:'Part one',h:'Information is not judgment.',
   sub:'Most AI education hands you more information: what the models are, what they can do, which vendor to pick. None of that is the thing a leader is actually paid for, which is the call.'},

  {t:'thesis',k:'The distinction that changes everything',big:'You can delegate the rollout, the research, the vendor list. You cannot outsource the <span class="a">judgment</span> that makes the final call yours.'},

  {t:'part',k:'Part two',h:'Private fluency before public leadership.',
   sub:'You do not build judgment in a lecture. You build it through guided practice, on the real work already in front of you, in a setting where it is safe to be a beginner before you lead in public.'},

  {t:'pillar',n:'01',h:'Guided practice on real work',
   sub:'We do not use toy examples. We work on the actual decision, document, or workflow on your desk this week, so the fluency transfers to the job the moment you leave the session.'},

  {t:'pillar',n:'02',h:'Calibrating trust',
   sub:'The skill is knowing where AI genuinely helps, where it quietly falls short, and where your judgment still has to carry the call. You leave able to tell the difference on a live decision.'},

  {t:'pillar',n:'03',h:'Repeatable workflows',
   sub:'A single impressive result is a party trick. We turn it into a repeatable way of working you can run again next week without losing authority over the outcome.'},

  {t:'pillar',n:'04',h:'Custom skills, not generic tools',
   sub:'Generic prompts give generic leverage. We build saved, personalized workflows shaped to your real work, so the tool fits the leader rather than the other way round.'},

  {t:'session',k:'What a session actually is',h:'One real decision, coached live.',
   sub:'Not a course to complete. Ninety focused minutes on something that matters to you right now, where you do the thinking and leave with a workflow and the judgment to use it.'},

  {t:'after',k:'What changes',h:'You lead it, you are not led by it.',
   list:['You walk into the board meeting fluent, not rehearsed','You can tell a good AI answer from a confident wrong one','Your team sees a leader who actually uses this, not one who outsourced it','The next AI decision is yours to make, not to approve on faith']},

  {t:'why',k:'Why Leon',h:'Built on real practice, not theory.',
   list:['Founded VoCo, a voice AI company, and exited in 2022','Founder of the Houston AI Club, now more than 5,000 members','25+ speaking engagements across enterprise, defense, finance and tech','Technical depth, translated into the decisions a leader actually faces']},

  {t:'forwho',k:'Fit',h:'Who this works for.',
   list:['Executives and senior leaders making real AI calls','Leaders who want fluency, not another certificate','People willing to practice on their own work, not watch a demo','Teams that need to align fast and lead AI with one voice']},

  {t:'paths',k:'Ways to work together',h:'Three doors, one outcome: your own judgment.',
   list:['Private Executive AI Coaching, one to one on your real decisions','Team Intensive, to rapidly upskill and align your leadership group','AI Build Lab, to identify and develop your internal AI champions']},

  {t:'close',k:'The one line to take with you',big:'Private fluency before <span class="a">public leadership</span>. Build the judgment first. Everything else follows.'},

  {t:'cta',k:'Next step',h:'Start with a conversation.',
   cta:'Request Private Executive AI Coaching at amplifyintelligence.ai',
   disc:'This masterclass is educational. It shares an approach to building executive AI judgment and makes no income, revenue, or business-result guarantee. Outcomes depend on your own work, context, and decisions, and results vary from leader to leader.'}
];

const deck=document.getElementById('deck');
function esc(x){return x||''}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let inner='';
  if(s.k) inner+=`<div class="kick">${esc(s.k)}</div>`;
  if(s.n) inner+=`<div class="num">${esc(s.n)}</div>`;
  if(s.h) inner+= (s.t==='title') ? `<h1>${esc(s.h)}</h1>` : `<h2>${esc(s.h)}</h2>`;
  if(s.big) inner+=`<p class="big">${esc(s.big)}</p>`;
  if(s.lead) inner+=`<p class="lead">${esc(s.lead)}</p>`;
  if(s.sub) inner+=`<p class="sub">${esc(s.sub)}</p>`;
  if(s.list){ inner+='<ul>'; s.list.forEach(x=>inner+=`<li>${esc(x)}</li>`); inner+='</ul>'; }
  if(s.cta) inner+=`<p class="cta-line">${esc(s.cta)}</p>`;
  if(s.disc) inner+=`<p class="disc">${esc(s.disc)}</p>`;
  inner+=`<div class="foot"><span>Amplify Intelligence</span><span>Executive AI Coaching</span></div>`;
  el.innerHTML=inner;
  deck.appendChild(el);
});
const pager=document.getElementById('pager');
function upd(){
  const mid=window.scrollY+window.innerHeight/2;
  const sl=[...document.querySelectorAll('.slide')];
  let n=1; sl.forEach((x,i)=>{ if(x.offsetTop<=mid) n=i+1; });
  pager.textContent=n+' / '+sl.length;
}
window.addEventListener('scroll',upd); window.addEventListener('resize',upd); upd();
</script>
</body>
</html>
