<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voice Actor's Marketing Engine &middot; VO Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7ef;      /* their light site ground, warm cream */
    --panel:#f4ebdc;   /* raised sand panel */
    --ink:#241d16;     /* deep warm brown-black type */
    --ink-soft:#4a3f33;/* body copy on cream */
    --rule:rgba(36,29,22,.14);
    --dim:#8a7a68;     /* muted caption */
    --accent:#e66419;  /* VO Pro orange (brand.json, 38 uses) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Raleway",-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative;width:100%;max-width:960px;aspect-ratio:16/9;
    background:
      radial-gradient(120% 90% at 84% 6%, rgba(230,100,25,.10), transparent 58%),
      var(--bg);
    overflow:hidden;box-shadow:0 0 0 1px var(--rule);
  }
  .slide{position:absolute;inset:0;padding:8% 9%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-family:"Big Shoulders Display",sans-serif;font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;font-size:clamp(12px,1.6vw,16px);color:var(--accent);margin-bottom:1em}
  h1{font-family:"Big Shoulders Display",sans-serif;font-weight:700;line-height:.98;
    font-size:clamp(38px,8vw,86px);letter-spacing:0}
  h2{font-family:"Big Shoulders Display",sans-serif;font-weight:600;line-height:1.02;
    font-size:clamp(28px,5.4vw,54px);letter-spacing:0}
  .lede{font-size:clamp(16px,2.2vw,23px);line-height:1.5;max-width:42ch;margin-top:.85em;color:var(--ink-soft)}
  .rule{width:74px;height:4px;background:var(--accent);margin:1.05em 0;border-radius:2px}
  ul{list-style:none;margin-top:1.1em;max-width:48ch}
  li{position:relative;padding-left:1.7em;margin:.62em 0;font-size:clamp(15px,2vw,21px);line-height:1.4;color:var(--ink-soft)}
  li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .big{font-family:"Big Shoulders Display",sans-serif;font-weight:700;font-size:clamp(70px,17vw,180px);color:var(--accent);line-height:.9;letter-spacing:0}
  .step{display:flex;gap:.85em;align-items:baseline;margin:.5em 0;max-width:50ch}
  .step .n{font-family:"Big Shoulders Display",sans-serif;font-weight:700;color:var(--accent);
    font-size:clamp(18px,2.6vw,30px);min-width:3.2em;letter-spacing:.04em}
  .step .t{font-size:clamp(15px,2vw,21px);line-height:1.38;color:var(--ink-soft)}
  .card .lede{max-width:52ch}
  .cardwrap .inner{background:var(--panel);padding:5.5% 6.5%;border-left:6px solid var(--accent);border-radius:4px}
  .foot{position:absolute;left:9%;bottom:5.5%;font-family:"Big Shoulders Display",sans-serif;
    letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--dim)}
  .disc{font-size:13px;line-height:1.55;color:var(--dim);max-width:56ch;margin-top:1.3em}
  #nav{position:fixed;bottom:14px;right:18px;display:flex;gap:8px;align-items:center;
    font-family:"Big Shoulders Display",sans-serif;font-size:14px;color:var(--dim)}
  #nav button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--rule);
    width:32px;height:32px;cursor:pointer;border-radius:3px}
  #nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  #count{min-width:56px;text-align:center;letter-spacing:.12em}
  .prog{position:fixed;top:0;left:0;height:4px;background:var(--accent);transition:width .2s}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div id="stage" aria-live="polite"></div>
<div id="nav"><button id="prev" aria-label="Previous">&#8592;</button>
<span id="count"></span><button id="next" aria-label="Next">&#8594;</button></div>
<script>
const S=[
 {t:'title', kick:'A free live masterclass with Paul Schmidt',
  h:'The Voice Actor’s Marketing Engine',
  lede:'How working voice actors book clients directly, without waiting on casting sites.'},

 {t:'point', kick:'Who this hour is for',
  h:'You, if you can perform but can’t predict your income',
  list:['A voice actor with real chops who still books inconsistently',
        'Tired of grinding auditions on pay-to-play sites',
        'You want clients you own, not scraps a platform hands out'],
  foot:'VO Pro'},

 {t:'point', kick:'The trap',
  h:'You were told to just keep auditioning',
  list:['Upload more auditions, drop your rate, hope you get picked',
        'The platform keeps the client relationship, you keep the crumbs',
        'More talent has not fixed it, because talent was never the gap'],
  foot:'VO Pro'},

 {t:'reframe', big:'80 / 20',
  lede:'Voiceover is 80% performance and 20% business. The 20% is where the money is, and no one ever taught it to you.'},

 {t:'section', kick:'Part one',
  h:'You don’t have a talent problem',
  lede:'You have a pipeline problem. Talent gets you ready. A pipeline gets you booked, on purpose, again and again.'},

 {t:'point', kick:'The ceiling',
  h:'Why casting sites cap you',
  list:['You compete on price with the entire world',
        'You never actually meet the buyer',
        'The day you stop auditioning is the day the work stops'],
  foot:'VO Pro'},

 {t:'section', kick:'Part two',
  h:'The Marketing Master Plan',
  lede:'A repeatable engine that finds the right clients, keeps you visible, and fills a pipeline you own. Five parts.'},

 {t:'point', kick:'Pillar one',
  h:'Know exactly who you are for',
  list:['Pick a niche where your voice clearly wins',
        'Learn the client avatars who actually buy voiceover',
        'Find them by name, not by guessing'],
  foot:'VO Niche Finder'},

 {t:'point', kick:'Pillar two',
  h:'Reach out so they say yes',
  list:['Messages that feel personal, not like spam',
        'A follow-up sequence that builds trust and authority',
        'Turn a stranger into a first booking'],
  foot:'VO ClientConnect'},

 {t:'point', kick:'Pillar three',
  h:'Be the voice they find',
  list:['Show up when a buyer is already searching',
        'A findable footprint that works while you sleep',
        'Inbound that stacks on top of your outreach'],
  foot:'VO SEO'},

 {t:'point', kick:'Pillar four',
  h:'Win the clients down the street',
  list:['Pitch nearby businesses that need a voice',
        'Land repeat local gigs off-platform',
        'A market your global competitors ignore'],
  foot:'VO Local'},

 {t:'point', kick:'Pillar five',
  h:'Charge what the work is worth',
  list:['Set rates from logic, not from fear',
        'Quote your number without flinching',
        'Raise rates without losing the client'],
  foot:'VO Rates 101'},

 {t:'section', kick:'Part three',
  h:'A week with a pipeline',
  lede:'The engine is not a burst of effort. It is a rhythm you can run in a few hours a week.'},

 {t:'steps', kick:'The weekly rhythm',
  h:'Run it every week',
  steps:[['Mon','Find ten new buyers who fit your niche'],
         ['Tue','Send personal outreach to each one'],
         ['Wed','Follow up and book the conversations'],
         ['Thu','Pitch one local business'],
         ['Fri','Track what worked and refine']],
  foot:'VO Pro'},

 {t:'point', kick:'The shift',
  h:'From waiting to booking',
  list:['Auditions become a bonus, not your lifeline',
        'Income you can actually predict',
        'Clients who come back and refer you'],
  foot:'VO Pro'},

 {t:'card', kick:'Why listen to me',
  h:'25+ years behind the mic',
  lede:'I have been a working voice actor for over 25 years, and I built VO Pro so voice actors could finally learn the business the industry never teaches. This is the exact engine I teach inside the Marketing Master Plan.',
  foot:'Paul Schmidt · VO Pro'},

 {t:'point', kick:'The recap',
  h:'What you leave with today',
  list:['The 80/20 that decides who earns',
        'The five parts of a real marketing engine',
        'A weekly rhythm you can start on Monday'],
  foot:'VO Pro'},

 {t:'cta',
  h:'Come build your engine inside VO Pro',
  lede:'Join VO Pro for the Marketing Master Plan, live coaching, and the community of voice actors doing this together. Or jump on the waitlist for the next live enrollment.',
  disc:'This masterclass is educational. No income, booking, or client result is guaranteed. Results vary and depend on your own work, your market, and your effort.',
  foot:'VO Pro · vopro.pro'}
];

const stage=document.getElementById('stage');
const countEl=document.getElementById('count');
const progEl=document.getElementById('prog');
let i=0;

function render(){
  stage.innerHTML='';
  const s=S[i];
  const el=document.createElement('div');
  el.className='slide on';
  if(s.t==='card') el.classList.add('card','cardwrap');
  let h='';
  const openInner = s.t==='card' ? '<div class="inner">' : '';
  const closeInner = s.t==='card' ? '</div>' : '';
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='reframe'){
    h+='<div class="big">'+s.big+'</div>';
    if(s.lede) h+='<p class="lede" style="margin-top:.7em">'+s.lede+'</p>';
  } else if(s.t==='title'){
    h+='<h1>'+s.h+'</h1><div class="rule"></div>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
  } else if(s.t==='cta'){
    h+='<h2>'+s.h+'</h2><div class="rule"></div>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
    if(s.disc) h+='<p class="disc">'+s.disc+'</p>';
  } else if(s.t==='card'){
    h+=openInner+'<h2>'+s.h+'</h2><div class="rule"></div>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
    h+=closeInner;
  } else {
    if(s.h) h+='<h2>'+s.h+'</h2>';
    if(s.t==='section') h+='<div class="rule"></div>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
    if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
    if(s.steps){s.steps.forEach(x=>h+='<div class="step"><span class="n">'+x[0]+'</span><span class="t">'+x[1]+'</span></div>');}
  }
  if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
  el.innerHTML=h;
  stage.appendChild(el);
  countEl.textContent=(i+1)+' / '+S.length;
  progEl.style.width=((i+1)/S.length*100)+'%';
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(i+1);
  if(e.key==='ArrowLeft')go(i-1);
});
stage.addEventListener('click',e=>{const r=stage.getBoundingClientRect();
  if(e.clientX-r.left>r.width*0.5)go(i+1);else go(i-1);});
render();
</script>
</body>
</html>
