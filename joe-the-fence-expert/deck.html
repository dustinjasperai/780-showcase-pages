<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become the Fence Company Homeowners Find First (Joe Everest)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141414; --panel:#242424; --rule:#3a3a3a; --ink:#f4f1ec;
    --muted:#b8b2aa; --accent:#F2771F;
    --display:'Oswald',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:10px;
    padding:52px 54px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .rail{position:absolute;left:0;right:0;bottom:0;height:10px;
    background:repeating-linear-gradient(90deg,var(--rule) 0 2px,transparent 2px 16px)}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;line-height:1.02;letter-spacing:.01em;
    font-size:54px;text-transform:uppercase}
  h2{font-family:var(--display);font-weight:600;line-height:1.08;font-size:38px;text-transform:uppercase}
  .lede{font-size:21px;line-height:1.5;color:var(--ink);margin-top:20px;max-width:40ch}
  .sub{font-size:18px;line-height:1.55;color:var(--muted);margin-top:16px;max-width:52ch}
  .big{font-size:40px;line-height:1.12;font-family:var(--display);font-weight:600;text-transform:uppercase}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:14px}
  li{font-size:19px;line-height:1.45;padding-left:26px;position:relative;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;background:var(--accent)}
  .kicker{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;
    color:var(--muted);font-size:14px;font-weight:500}
  .part{font-family:var(--display);font-size:120px;font-weight:700;color:var(--rule);line-height:.8}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.5}
  .cta-line{font-size:22px;color:var(--accent);font-family:var(--display);font-weight:600;
    text-transform:uppercase;margin-top:18px}
  .brandfoot{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;
    font-size:12px;color:var(--muted);position:absolute;right:30px;bottom:20px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Joe Everest',h:'Become the Fence Company Homeowners Find First',lede:'How to stop being the cheapest bid and start getting chosen before you ever quote.'},
 {t:'who',eyebrow:'Who this is for',h2:'Fence company owners who are great at the work',sub:'You build the best fence in the county. You show up, you do it right, your crews are solid. And you still spend half your week fighting for jobs on price against guys who cut corners.'},
 {t:'trap',eyebrow:'The trap',big:'Being the best builder in town does not mean anyone finds you first.',sub:'Homeowners searching for a fence have no idea who the best builder is. They call the names they already recognize, and they compare quotes. If you are only one of three bids, you are negotiating from the bottom.'},
 {t:'reframe',eyebrow:'The reframe',big:'The winner of this market is not the cheapest. It is the one people find first.',sub:'When a homeowner already knows you, already trusts you, and came looking for you by name, price stops being the conversation. That is a position you can build on purpose.'},
 {t:'part',n:'01',kicker:'The core problem',h2:'You are invisible to the people ready to buy'},
 {t:'point',eyebrow:'Part one',h2:'Demand is not your problem',sub:'People need fences every day in your market. The work is there. The problem is that when they go looking, your competitors are the ones who show up, and you are a referral away from a conversation that may never happen.'},
 {t:'point',eyebrow:'Part one',h2:'Price is a symptom, not the disease',sub:'When the only thing a homeowner can compare is the number, they compare the number. Underbidding feels like the only lever you have. It is not. The real lever is being known before the quote.'},
 {t:'part',n:'02',kicker:'The system',h2:'How you become the name they find first'},
 {t:'pillar',eyebrow:'Pillar one',h2:'Turn your expertise into your lead engine',sub:'You already know more about fences than anyone your customers will ever meet. Put that knowledge where they are looking. The jobsite answers you give every day are the content that makes a whole region trust you before they call. This is exactly how I took a local fence company national.'},
 {t:'pillar',eyebrow:'Pillar two',h2:'Price for profit, not for the bid war',sub:'When people come to you already sold on you, you can price for the quality you deliver. We will walk through how to present and hold a price that reflects the real work, so you win the right jobs instead of all the cheap ones.'},
 {t:'pillar',eyebrow:'Pillar three',h2:'Build the company that runs past the field',sub:'Getting found and pricing right creates more demand than you can swing a hammer for. The last piece is the team and the systems that let you step out of the field, so the business grows beyond your own two hands.'},
 {t:'part',n:'03',kicker:'The payoff for your company',h2:'A fence company that gets chosen'},
 {t:'point',eyebrow:'Part three',h2:'Booked out, on your terms',sub:'When homeowners come looking for you by name, your calendar fills with the jobs you actually want, at prices that work, months ahead. The cheapest bid down the road stops being your competition.'},
 {t:'why',eyebrow:'Why me',h2:'I did this on my own fence company',sub:'I am a third generation fence builder and president of a family fence company that has been going since 1955. I tripled our revenue and our crew and grew it to serve customers nationwide by doing exactly what this class teaches. I am not a marketer guessing at your world. I am in it.'},
 {t:'recap',eyebrow:'The whole class in one line',big:'Get found first. Price for profit. Build past the field.',sub:'Three moves, in that order. That is how a fence company stops competing on price and starts owning its market.'},
 {t:'cta',eyebrow:'Your next step',h2:'Keep going with me',lede:'If this is the direction you want to grow, come work through it with me inside the Contractor Growth Vault, where I teach the whole system step by step for fence and contractor owners.',cta:'Join me inside the Contractor Growth Vault',disc:'This masterclass is educational. It shares what has worked for my company and the owners I train. No specific revenue, booking, or result is guaranteed. Results vary and depend on your market, your execution, and factors outside anyone’s control.'}
];
const d=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.eyebrow)h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='title'){h+=`<h1>${s.h}</h1>`;if(s.lede)h+=`<p class="lede">${s.lede}</p>`;}
  else if(s.t==='part'){h+=`<div class="part">${s.n}</div><div class="kicker">${s.kicker}</div><h2 style="margin-top:12px">${s.h2}</h2>`;}
  else if(s.big||s.t==='trap'||s.t==='reframe'||s.t==='recap'){if(s.h2)h+=`<h2>${s.h2}</h2>`;if(s.big)h+=`<p class="big">${s.big}</p>`;if(s.sub)h+=`<p class="sub">${s.sub}</p>`;}
  else if(s.t==='cta'){h+=`<h2>${s.h2}</h2>`;if(s.lede)h+=`<p class="lede">${s.lede}</p>`;if(s.cta)h+=`<p class="cta-line">${s.cta}</p>`;if(s.disc)h+=`<p class="disc">${s.disc}</p>`;}
  else {if(s.h2)h+=`<h2>${s.h2}</h2>`;if(s.sub)h+=`<p class="sub">${s.sub}</p>`;if(s.points){h+='<ul>'+s.points.map(p=>`<li>${p}</li>`).join('')+'</ul>';}}
  h+=`<div class="brandfoot">The Fence Expert</div><div class="rail"></div>`;
  el.innerHTML=h;d.appendChild(el);
});
</script>
</body>
</html>
