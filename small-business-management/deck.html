<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the Owner's Trap — Big Sky Way Leadership College</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8;        /* light sky ground, from brand #eef2f5 */
    --panel:#ffffff;
    --ink:#0a2338;       /* dominant deep navy, 34 uses */
    --teal:#234046;      /* header/footer slate-teal */
    --accent:#c26748;    /* Montana terracotta CTA, 21 uses */
    --muted:#55636f;     /* body color rgb(85,99,111) */
    --line:#d7dee4;
    --display:'Quicksand',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--teal);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto}
  .slide{
    position:relative;background:var(--bg);min-height:62vh;
    padding:64px 72px;margin:22px 14px;border-radius:14px;
    box-shadow:0 10px 40px rgba(10,35,56,.18);
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
    background:linear-gradient(90deg,var(--accent) 0 38%,var(--teal) 38% 100%)}
  .slide.title{min-height:76vh;background:var(--ink);color:#eef2f5}
  .slide.title::before{content:"";position:absolute;left:0;right:0;top:46%;height:1px;
    background:rgba(238,242,245,.28)}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  .slide.title .eyebrow{color:#d9a68f}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.05;
    letter-spacing:-.01em;max-width:18ch}
  h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.1;
    max-width:20ch;margin-bottom:18px}
  .pillar{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;
    letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
  p{font-size:19px;line-height:1.55;color:var(--muted);max-width:60ch;margin-top:14px}
  .slide.title p{color:#c7d2da;font-size:22px;max-width:50ch}
  .lead{font-size:24px;color:var(--ink);font-weight:500}
  .big{font-family:var(--display);font-weight:700;font-size:46px;color:var(--ink);
    line-height:1.1;max-width:22ch}
  ul{margin:20px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:10px 0 10px 30px;position:relative;
    max-width:58ch;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;
    border-radius:50%;background:var(--accent)}
  .stat-row{display:flex;gap:40px;flex-wrap:wrap;margin-top:28px}
  .stat b{font-family:var(--display);font-size:44px;color:var(--accent);display:block;line-height:1}
  .stat span{font-size:15px;color:var(--muted);display:block;margin-top:6px;max-width:16ch}
  .kicker{font-family:var(--display);font-weight:600;color:var(--teal);font-size:16px;margin-top:22px}
  .cta-card{background:var(--ink);color:#eef2f5;border-radius:12px;padding:40px 44px;margin-top:8px}
  .cta-card h2{color:#fff}
  .cta-card p{color:#c7d2da}
  .btn{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;
    font-family:var(--display);font-weight:700;font-size:18px;padding:16px 30px;border-radius:8px}
  .disclaimer{font-size:13px;color:#9fb0bb;margin-top:26px;max-width:62ch;line-height:1.5}
  .num{position:absolute;top:26px;right:34px;font-family:var(--display);font-size:13px;
    color:var(--muted);opacity:.6}
  .foot{position:absolute;bottom:22px;left:72px;font-family:var(--display);font-size:13px;
    letter-spacing:.08em;color:var(--muted);opacity:.7}
  .slide.title .foot{color:#9fb0bb;opacity:.9}
  @media(max-width:700px){.slide{padding:40px 28px}h1{font-size:38px}h2{font-size:28px}.big{font-size:32px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const FOOT = "BIG SKY WAY";
const S = [
  {t:'title', eyebrow:"A live masterclass for small business owners",
   h:"Escape the Owner's Trap",
   body:"The simple, human, smart way to build a team your business can actually run on.",
   foot:"BIG SKY WAY LEADERSHIP COLLEGE &middot; DR. CHANCE EATON"},

  {t:'content', num:"02", eyebrow:"What you'll leave with", h:"One hour. Three shifts.",
   bullets:[
     "Why your business can't grow without you, and what's really causing it",
     "The framework for building a team that carries the load instead of adding to yours",
     "A simple first move you can make this week, no reorg required"
   ]},

  {t:'content', num:"03", eyebrow:"Who this is for",
   lead:"You built something real. You also can't step away for a week without things quietly falling apart.",
   body:"If you are the owner who still touches every decision, approves every exception, and feels the whole thing resting on your shoulders, this hour is for you."},

  {t:'content', num:"04", eyebrow:"The trap", h:"It's 11pm and you're still the bottleneck.",
   body:"The team waits on you. Growth has plateaued. You hire good people and still end up redoing the work. Every path forward seems to need more of you, and there is no more of you to give."},

  {t:'content', num:"05", eyebrow:"The hidden cost", h:"What the trap is quietly costing you.",
   bullets:[
     "Your best people leave, because they can't grow around a bottleneck",
     "The rest disengage and wait to be told what to do",
     "You lose market position to businesses that can move without their owner",
     "The work stops being fulfilling, for them and for you"
   ]},

  {t:'content', num:"05", eyebrow:"The reframe",
   big:"Working harder is what built the trap. More hours will not get you out of it.",
   body:"The owner's trap isn't a time problem or an effort problem. It's a health problem, and you can't out-work an unhealthy organization."},

  {t:'content', num:"06", eyebrow:"Part one &middot; the real problem", h:"Healthy beats smart.",
   body:"Most owners try to fix the business by getting smarter: better strategy, better tools, better hires. But a smart business that is unhealthy still stalls. For a company to grow, it has to be healthy first."},

  {t:'content', num:"07", eyebrow:"The myth", h:"The right hire will not save you.",
   body:"Every owner in the trap tries this: find the one great person who fixes everything. Without a clear way to lead and a culture that holds, even your best hire inherits the same chaos and burns out. The system has to change, not just the roster."},

  {t:'content', num:"07", eyebrow:"The symptoms", h:"You already know what unhealthy feels like.",
   bullets:[
     "Siloing and turf wars between people who should be on the same side",
     "Politicking and quiet resentment instead of straight conversations",
     "Overwhelm as the default setting for everyone, you most of all",
     "No clear cultural DNA, so every new hire guesses at how things work here"
   ]},

  {t:'content', num:"08", eyebrow:"Part two &middot; the framework", h:"The Cultural DNA Playbook",
   body:"Culture isn't a poster on the wall. It's the set of unwritten rules that decide how your team behaves when you're not in the room. When you make that DNA explicit, the business stops depending on your presence to function."},

  {t:'content', num:"09", pillar:"Pillar one", h:"Name the DNA.",
   body:"Define, in plain language, how your team actually wins together: how decisions get made, how people treat each other, what good looks like here. What stays in your head can't be delegated. What's written down can."},

  {t:'content', num:"10", pillar:"Pillar two", h:"Build the team around it.",
   body:"Hire, coach, and hold people to the DNA, not to your mood. Humble, hungry, and smart people thrive when the standard is clear and consistent. That's how you stop being the only one who can carry the standard."},

  {t:'content', num:"11", pillar:"Pillar three", h:"Lead the patterns, not the fires.",
   body:"Most repeated problems aren't people problems. They're patterns, and the leader is usually part of the pattern. Seeing your own patterns clearly is the quiet skill that lets you lead past the same fires you've been fighting for years."},

  {t:'content', num:"12", eyebrow:"How we teach it", h:"Simple. Human. Smart.",
   bullets:[
     "Simple. Common-sense tools you can apply the same afternoon",
     "Human. Content that meets your team where they actually are",
     "Smart. Grounded in theory and research, with none of the fluff"
   ]},

  {t:'content', num:"13", eyebrow:"Part three &middot; what changes",
   h:"A business that runs on its team, not its owner.",
   body:"Decisions get made without you in the thread. Good people stay because the standard is clear. Growth stops being a thing that costs you more hours and starts being a thing your organization can carry."},

  {t:'content', num:"14", eyebrow:"And what changes in you",
   big:"You stop being the hardest-working person in a business that needs you less.",
   body:"That is not a loss of control. It is the first time the thing you built can stand on its own, and the first time you can lead it instead of carry it."},

  {t:'content', num:"14", eyebrow:"Why this works", h:"Research-based, built for owners.",
   stats:[
     {b:"97%", s:"agree the education was a valuable investment"},
     {b:"96%", s:"apply the tools within one week"},
     {b:"300+", s:"graduates of the Leading Teams Program"}
   ],
   kicker:"Taught by Dr. Chance Eaton, Ed.D. in Educational Leadership, with a Workforce Development Certificate from the Montana University System."},

  {t:'cta', num:"15", eyebrow:"Your next step",
   h:"Ready to build a business that runs without you?",
   body:"If this hour gave you one shift, the Leading Teams Program is where we do the whole build together: your Cultural DNA, your team, your way out of the trap.",
   btn:"Book a call with Big Sky Way",
   disclaimer:"Educational content only. Examples and outcomes shared are for illustration and are not a guarantee of results. Every business is different, and results vary based on your situation, effort, and execution.",
   foot:"BIG SKY WAY LEADERSHIP COLLEGE"}
];

function esc(x){return x==null?"":x;}
function render(){
  var out="";
  S.forEach(function(sl){
    var cls = sl.t==='title' ? 'slide title' : 'slide';
    out += '<section class="'+cls+'">';
    if(sl.num) out += '<span class="num">'+esc(sl.num)+'</span>';
    if(sl.pillar) out += '<div class="pillar">'+esc(sl.pillar)+'</div>';
    if(sl.eyebrow) out += '<div class="eyebrow">'+esc(sl.eyebrow)+'</div>';
    if(sl.t==='title'){ out += '<h1>'+esc(sl.h)+'</h1>'; }
    if(sl.t==='cta'){
      out += '<div class="cta-card"><h2>'+esc(sl.h)+'</h2><p>'+esc(sl.body)+'</p>';
      out += '<span class="btn">'+esc(sl.btn)+'</span></div>';
    } else {
      if(sl.big) out += '<p class="big">'+esc(sl.big)+'</p>';
      if(sl.h && sl.t!=='title') out += '<h2>'+esc(sl.h)+'</h2>';
      if(sl.lead) out += '<p class="lead">'+esc(sl.lead)+'</p>';
      if(sl.bullets){ out += '<ul>'; sl.bullets.forEach(function(b){out+='<li>'+esc(b)+'</li>';}); out += '</ul>'; }
      if(sl.stats){ out += '<div class="stat-row">'; sl.stats.forEach(function(st){
        out += '<div class="stat"><b>'+esc(st.b)+'</b><span>'+esc(st.s)+'</span></div>';}); out += '</div>'; }
      if(sl.body) out += '<p>'+esc(sl.body)+'</p>';
      if(sl.kicker) out += '<p class="kicker">'+esc(sl.kicker)+'</p>';
    }
    if(sl.disclaimer) out += '<p class="disclaimer">'+esc(sl.disclaimer)+'</p>';
    out += '<div class="foot">'+esc(sl.foot||FOOT)+'</div>';
    out += '</section>';
  });
  document.getElementById('deck').innerHTML = out;
}
render();
var slides=[].slice.call(document.querySelectorAll('.slide')), i=0;
function go(n){i=Math.max(0,Math.min(slides.length-1,n));
  slides[i].scrollIntoView({behavior:'smooth',block:'center'});}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
});
</script>
</body>
</html>
