<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Fill a Home Preschool in 30 Days | A Masterclass with Joy Anderson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf6ec;
    --panel:#fffdf7;
    --ink:#2c2a27;
    --ink-soft:#55504a;
    --muted:#8a8177;
    --rule:#ece2d2;
    --accent:#107d71;
    --accent-2:#e39a2c;
    --head:'Poppins',-apple-system,sans-serif;
    --body:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;position:relative;overflow:hidden}
  .slide{display:none;width:100%;max-width:960px;animation:fade .4s ease}
  .slide.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .kicker.alt{color:var(--accent-2)}
  h1{font-family:var(--head);font-weight:700;font-size:54px;line-height:1.08;letter-spacing:-.015em;color:var(--ink)}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.12;letter-spacing:-.01em;color:var(--ink)}
  .sub{font-size:24px;line-height:1.5;color:var(--ink-soft);margin-top:22px;max-width:40ch}
  .lead{font-size:27px;line-height:1.5;color:var(--ink-soft);margin-top:20px;max-width:44ch}
  ul{list-style:none;margin-top:28px;display:flex;flex-direction:column;gap:16px}
  li{font-size:23px;line-height:1.4;color:var(--ink-soft);padding-left:40px;position:relative}
  li::before{content:'';position:absolute;left:0;top:11px;width:20px;height:20px;border-radius:6px;background:var(--accent);opacity:.9}
  li b{color:var(--ink);font-weight:600;font-family:var(--head)}
  .big{font-family:var(--head);font-weight:700;font-size:72px;line-height:1.05;letter-spacing:-.02em;color:var(--accent)}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent-2);text-decoration-thickness:4px}
  .meta{font-family:var(--head);font-size:17px;color:var(--muted);margin-top:34px;letter-spacing:.02em}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:40px 44px;box-shadow:0 20px 50px rgba(90,64,40,.08);margin-top:26px}
  .note{font-family:var(--head);font-size:15px;color:var(--muted);margin-top:30px;line-height:1.5;max-width:52ch}
  .steps{margin-top:28px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .step{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .step .w{font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);margin-bottom:8px}
  .step .d{font-size:20px;color:var(--ink-soft);line-height:1.4}
  .nav{position:fixed;bottom:26px;right:30px;font-family:var(--head);font-size:14px;color:var(--muted);display:flex;align-items:center;gap:16px;z-index:10}
  .nav button{font-family:var(--head);font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:9px 18px;cursor:pointer}
  .bar{position:fixed;left:0;top:0;height:4px;background:var(--accent);width:0;transition:width .3s;z-index:10}
  .foot{position:fixed;bottom:26px;left:30px;font-family:var(--head);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:10}
  @media (max-width:640px){h1{font-size:36px}h2{font-size:28px}.big{font-size:48px}.sub,.lead{font-size:19px}.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="stage"></div>
<div class="foot">Preschool System &middot; Joy Anderson</div>
<div class="nav"><button onclick="go(-1)">Prev</button><span id="count"></span><button onclick="go(1)">Next</button></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Joy Anderson', h:"How to Fill a Home Preschool in 30 Days", s:"Without begging families to enroll.", meta:'Preschool System &middot; preschoolsystem.com'},
  {t:'promise', k:'What you will leave with', h:"A full roster is a method, not luck", list:["Why the <b>model you choose</b> decides whether your classes fill","The <b>local-marketing</b> moves that create demand in a single neighborhood","How to open a <b>waitlist before</b> you open your doors"]},
  {t:'who', k:'Who this is for', h:"You want income and you want to stay home", s:"You do not want to go back to a job you left, and you do not want to run a home daycare from 6am to 6pm. You want something in between."},
  {t:'trap', k:'The trap', h:"The false choice every mom is handed", list:["Go back to work and put your own kids in care","Or run a home <b>daycare</b>, all day, every day, for daycare money"], note:"Both cost you the exact thing you are trying to protect: time with your own children."},
  {t:'reframe', k:'The reframe', h:"The problem was never demand", s:"There are more families who want quality preschool than there are good preschools. The problem was the model. A preschool is not a daycare."},
  {t:'model', k:'The third option', h:'<span class="strike">A daycare.</span> A preschool.', s:"A few focused hours a day. Real curriculum. Set terms. Premium tuition. Your afternoons back."},
  {t:'part', k:'Part one', h:"Why most home preschools stay half-full", s:"It is almost never the teaching. It is two quiet mistakes."},
  {t:'problem', k:'Mistake one', h:"Waiting to be found", s:"You set up the room, you make a page, and then you wait for families to discover you. Discovery is not a plan. Demand has to be created on purpose."},
  {t:'problem', k:'Mistake two', h:"Pricing like a daycare", s:"Charge daycare rates and you are forced into daycare hours to make it work. Price like a preschool and a few mornings a week becomes a real income."},
  {t:'part', k:'Part two', h:"The Fill-Your-Classes Method", s:"Five moves, in order. This is the part I ran myself for ten years, and the part the 5,000-plus moms I have taught use to fill their first roster."},
  {t:'pillar', k:'Pillar one', h:"Choose the preschool model", list:["Set hours and a real start and end date","A simple curriculum families can see","Enrollment <b>terms</b>, not drop-in care"], note:"This one decision is what lets you charge preschool tuition instead of daycare rates."},
  {t:'pillar', k:'Pillar two', h:"Create local demand on purpose", list:["Host one free <b>community playdate</b>","Partner with three local businesses parents already visit","Let people meet you before they ever enroll"]},
  {t:'pillar', k:'Pillar three', h:"Be visible where moms already are", list:["Your neighborhood <b>mom groups</b> and Nextdoor","Behind-the-scenes of your room and your day","Show the warmth, not a sales pitch"]},
  {t:'pillar', k:'Pillar four', h:"Open a waitlist before day one", s:"You do not open the doors and hope. You collect interested families first, so you open already full and start the next class with a line out the door."},
  {t:'pillar', k:'Pillar five', h:"Price like a preschool", s:"A few hours a day, a premium your families gladly pay because it is education, not babysitting. This is how a home preschool becomes a real income in part-time hours."},
  {t:'part', k:'Part three', h:"What the first 30 days look like", s:"The five moves on a simple timeline."},
  {t:'plan', k:'The 30-day plan', h:"Four weeks to a full class", steps:[["Week 1","Lock your model, hours, and terms"],["Week 2","Host the playdate, set up three local partnerships"],["Week 3","Go visible in the mom groups, open the waitlist"],["Week 4","Confirm your roster, start your first class full"]]},
  {t:'story', k:'Why me', h:"I did this before I taught it", s:"I started my own preschool in 2008 with no guidance, grew it for over ten years, then sold it. I have spent the years since helping more than 5,000 moms start their own. This is the method, not a theory."},
  {t:'recap', k:'The method in one line', h:"Choose the model, create demand, fill a waitlist", s:"Do those in order and a half-full room becomes a full one, in a single neighborhood, in about a month."},
  {t:'cta', k:'Your next step', h:"Start your preschool", s:"Grab my free book, Start Your Preschool, and come see how the full method works inside Preschool All Stars.", note:"Educational only. No specific income or enrollment result is guaranteed. Results vary and depend on your effort, market, and execution."}
];
const stage=document.getElementById('stage'), bar=document.getElementById('bar'), count=document.getElementById('count');
let i=0;
function render(){
  stage.innerHTML='';
  const d=S[i], el=document.createElement('div'); el.className='slide on';
  let html='';
  if(d.k) html+=`<div class="kicker ${d.t==='trap'||d.t==='problem'?'alt':''}">${d.k}</div>`;
  if(d.t==='title'){ html+=`<h1>${d.h}</h1>`; if(d.s)html+=`<div class="lead">${d.s}</div>`; if(d.meta)html+=`<div class="meta">${d.meta}</div>`; }
  else { html+=`<h2>${d.h}</h2>`; if(d.s)html+=`<div class="sub">${d.s}</div>`; }
  if(d.list){ html+='<ul>'+d.list.map(x=>`<li>${x}</li>`).join('')+'</ul>'; }
  if(d.steps){ html+='<div class="steps">'+d.steps.map(x=>`<div class="step"><div class="w">${x[0]}</div><div class="d">${x[1]}</div></div>`).join('')+'</div>'; }
  if(d.note){ html+=`<div class="note">${d.note}</div>`; }
  el.innerHTML=html; stage.appendChild(el);
  bar.style.width=((i+1)/S.length*100)+'%';
  count.textContent=(i+1)+' / '+S.length;
}
function go(n){ i=Math.max(0,Math.min(S.length-1,i+n)); render(); }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); });
document.getElementById('stage').addEventListener('click',()=>go(1));
render();
</script>
</body>
</html>
