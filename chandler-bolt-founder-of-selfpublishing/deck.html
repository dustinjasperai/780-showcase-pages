<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write Your Book In Class - Self-Publishing School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf3ee;
    --panel:#fffdfc;
    --ink:#333333;
    --muted:#666666;
    --rule:#e7e9f0;
    --accent:#ff3e0e;
    --line2:#2ea3f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Open Sans",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }
  #stage{
    width:min(960px,94vw);aspect-ratio:16/9;background:var(--panel);
    border:1px solid var(--rule);border-radius:14px;
    box-shadow:0 18px 50px rgba(20,30,60,.10);
    position:relative;overflow:hidden;
  }
  .slide{position:absolute;inset:0;padding:56px 64px;display:none;flex-direction:column}
  .slide.on{display:flex}
  h1,h2,h3,.eyebrow{font-family:"Poppins",system-ui,sans-serif}
  .eyebrow{color:var(--accent);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin-bottom:18px}
  h1{font-size:46px;line-height:1.08;font-weight:700;letter-spacing:-.01em}
  h2{font-size:34px;line-height:1.14;font-weight:700;letter-spacing:-.01em}
  .promise{font-size:21px;color:var(--muted);margin-top:22px;max-width:40ch;line-height:1.5}
  .big{font-size:40px;line-height:1.15;font-weight:700;font-family:"Poppins",sans-serif;max-width:22ch}
  p.body{font-size:20px;line-height:1.55;color:var(--ink);margin-top:18px;max-width:46ch}
  .spacer{flex:1}
  .partnum{font-family:"Poppins",sans-serif;font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.1em;text-transform:uppercase}
  .tabs{display:flex;gap:10px;margin-top:26px}
  .tab{height:8px;flex:1;background:var(--rule);border-radius:6px}
  .tab.fill{background:var(--accent)}
  ul.steps{margin-top:26px;list-style:none;display:flex;flex-direction:column;gap:16px}
  ul.steps li{display:flex;gap:16px;align-items:flex-start;font-size:20px;line-height:1.4}
  .num{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;font-family:"Poppins",sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:17px}
  .kicker{font-size:16px;color:var(--muted);margin-top:14px}
  .brandline{position:absolute;left:64px;bottom:30px;font-family:"Poppins",sans-serif;font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.04em}
  .spine{position:absolute;right:0;top:0;bottom:0;width:10px;background:var(--accent)}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:52ch;line-height:1.5}
  .cta-step{display:inline-block;margin-top:22px;font-family:"Poppins",sans-serif;font-weight:700;font-size:20px;color:#fff;background:var(--accent);padding:14px 26px;border-radius:10px}
  #nav{position:fixed;bottom:18px;right:22px;font-size:13px;color:var(--muted);font-family:"Poppins",sans-serif}
  #nav b{color:var(--ink)}
  .hint{position:fixed;bottom:18px;left:22px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><b id="cur">1</b> / <span id="tot">1</span></div>
<div class="hint">Use arrow keys to advance</div>
<script>
const S=[
  {t:'title',eyebrow:'Write Your Book In Class',h:'Write the book you keep meaning to write.',promise:'From a blank page to a finished, launched book, using one repeatable system. In this class you will leave with your idea chosen, your book mapped, and your chapters structured.'},
  {t:'content',eyebrow:'Who this is for',h:'For the person who has been "going to write a book" for years.',body:'C-average English students. C-suite executives. Business builders who know they have a book in them. If you have the idea and not the finished book, this hour is built for you.'},
  {t:'statement',eyebrow:'The real problem',big:'You do not have a writing problem. You have a finishing problem.'},
  {t:'statement',eyebrow:'Reframe',big:'Motivation runs out around chapter three. A system does not.'},
  {t:'part',partnum:'Part One',h:'Why most books never get finished.',fill:1},
  {t:'content',eyebrow:'Part One',h:'You started at page one and hoped.',body:'Most first-time authors open a blank document and try to write from the top. With no map, every session starts from zero, the middle sags, and somewhere around chapter three the project quietly dies. It is not a discipline failure. It is a structure failure.'},
  {t:'content',eyebrow:'Part One',h:'The book you never finished is an asset you never built.',body:'A finished book opens doors: readers, authority, passive royalty income, and new customers for whatever you already do. The unfinished draft on your laptop does none of that. The gap between the two is a repeatable process.'},
  {t:'part',partnum:'Part Two',h:'The Write Your Book system.',fill:2},
  {t:'steps',eyebrow:'The 3-action system',h:'Three actions, in order.',steps:[
     ['1','Choose your winning book idea. One idea, none, or a hundred: you will learn which one to write first and why it is the one that moves your life forward.'],
     ['2','Map out your book. Generate every piece of content the book needs and organize it into sections before you write a single chapter.'],
     ['3','Structure your chapters. Turn the map into ordered sections and chapters so the writing becomes filling in a plan, not staring at a blank page.']
  ]},
  {t:'content',eyebrow:'Part Two',h:'Now the writing is the easy part.',body:'Once the idea is chosen and the book is mapped and structured, writing stops being invention and becomes execution. You are following your own blueprint. This is the step that takes people from "someday" to a finished manuscript.'},
  {t:'part',partnum:'Part Three',h:'From finished to launched.',fill:3},
  {t:'content',eyebrow:'Part Three',h:'Finishing is the halfway point.',body:'A manuscript in a drawer changes nothing. The same system carries through to launch: positioning, reviews, and a release that gives the book a real chance to reach readers and rank. The method does not stop at the last page.'},
  {t:'content',eyebrow:'Part Three',h:'A book that works as a business asset.',body:'Done right, a published book earns royalties, builds authority in your field, and generates customers for the work you already do. It keeps paying back long after launch week. That is the difference between writing a book and building an asset.'},
  {t:'content',eyebrow:'Why listen to this',h:'This started the same way yours can.',body:'In 2014 I self-published my first book and it became an Amazon bestseller, then several more. I turned the repeatable process behind them into Self-Publishing School, and we have now helped over 6,000 people on six continents become authors, with a goal of impacting 120,000,000 lives.'},
  {t:'content',eyebrow:'Your path to done',h:'Six steps from idea to asset.',body:'Choose the idea. Map the book. Structure the chapters. Write from the blueprint. Launch with a plan. Use the finished book as an asset. Each step is teachable, and each one is covered in the program this class is the front door to.'},
  {t:'cta',eyebrow:'Your next step',h:'Ready to write your book?',body:'Book a free author strategy call. We will talk through your book and your goals and map out which path fits you best.',step:'Schedule your free author strategy call',disc:'This presentation is for educational purposes only. No specific income or result is guaranteed. Results vary and depend on many factors, including the work you put in.'}
];
const stage=document.getElementById('stage');
stage.innerHTML=S.map((s,i)=>{
  let inner='';
  if(s.t==='title'){inner=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.h}</h1><p class="promise">${s.promise}</p>`;}
  else if(s.t==='statement'){inner=`<div class="eyebrow">${s.eyebrow}</div><div class="spacer"></div><div class="big">${s.big}</div><div class="spacer"></div>`;}
  else if(s.t==='part'){inner=`<div class="partnum">${s.partnum}</div><h2 style="margin-top:14px">${s.h}</h2><div class="tabs">${[1,2,3].map(n=>`<span class="tab ${n<=s.fill?'fill':''}"></span>`).join('')}</div>`;}
  else if(s.t==='steps'){inner=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><ul class="steps">${s.steps.map(p=>`<li><span class="num">${p[0]}</span><span>${p[1]}</span></li>`).join('')}</ul>`;}
  else if(s.t==='cta'){inner=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.h}</h1><p class="body">${s.body}</p><span class="cta-step">${s.step}</span><p class="disc">${s.disc}</p>`;}
  else {inner=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><p class="body">${s.body}</p>`;}
  return `<section class="slide ${i===0?'on':''}"><span class="spine"></span>${inner}<span class="brandline">Self-Publishing School</span></section>`;
}).join('');
document.getElementById('tot').textContent=S.length;
let cur=0;const slides=[...document.querySelectorAll('.slide')];
function go(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((el,i)=>el.classList.toggle('on',i===cur));document.getElementById('cur').textContent=cur+1;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
stage.addEventListener('click',()=>go(cur+1));
</script>
</body>
</html>
