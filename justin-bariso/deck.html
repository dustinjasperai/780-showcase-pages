<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real-World EQ, a masterclass with Justin Bariso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#231b33; --panel:#2d2440; --ink:#fafafa; --accent:#f56514;
    --rule:#443a5a; --muted:#b4acc4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center}
  .kick{font-family:'Inter';font-weight:600;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Spectral';font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Spectral';font-weight:600;font-size:38px;line-height:1.12;margin-bottom:16px}
  p{font-size:20px;line-height:1.55;color:var(--ink);margin-top:14px;max-width:44ch}
  p.lead{font-size:23px;color:var(--muted)}
  .big{font-family:'Spectral';font-weight:500;font-size:30px;line-height:1.3;max-width:40ch}
  ul{margin:18px 0 0 0;padding:0;list-style:none}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 30px;position:relative;
    border-bottom:1px solid var(--rule);max-width:46ch}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;
    border-radius:3px;background:var(--accent)}
  .num{font-family:'Spectral';font-style:italic;color:var(--accent);font-size:22px;margin-right:8px}
  .foot{margin-top:28px;font-size:14px;color:var(--muted)}
  .disc{font-size:15px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .cta h1{font-size:46px}
  .step{font-family:'Spectral';font-size:21px;line-height:1.5;padding:10px 0;border-bottom:1px solid var(--rule)}
  .quote{font-family:'Spectral';font-style:italic;font-size:30px;line-height:1.3;max-width:34ch}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">A live masterclass with Justin Bariso</div>
    <h1>Real-World EQ</h1>
    <p class="lead">The four frameworks that change how you respond under pressure, so emotional intelligence becomes something you use, not something you score.</p>
    <div class="foot">EQ Applied</div>`},

  {t:'who', cls:'', html:`
    <div class="kick">Who this is for</div>
    <h2>For leaders who keep having the same hard moment</h2>
    <p>You read the books. You know the theory. And still, in the meeting, in the late-night email, in the feedback that lands wrong, you react first and regret it after.</p>
    <p>This is for the leader who wants emotional intelligence they can actually reach for in the moment.</p>`},

  {t:'hook', cls:'', html:`
    <div class="kick">The reframe</div>
    <h2>Emotional intelligence is not a score</h2>
    <p class="big">Most training hands you an assessment and a number. A number does not help you at 4 p.m. when the message is already half typed.</p>
    <p>Real-world EQ is a set of small moves you practice until they are habits.</p>`},

  {t:'part', cls:'', html:`
    <div class="kick">Part one</div>
    <h2>The core problem: the gap between knowing and doing</h2>
    <p>Emotions are fast. By the time the thinking part of your brain catches up, you have often already spoken.</p>
    <p>The fix is not more willpower. It is a few simple tools that live in the gap and buy you a second.</p>`},

  {t:'cost', cls:'', html:`
    <div class="kick">Why it matters</div>
    <h2>The moments that cost the most are small</h2>
    <ul>
      <li>The reply you sent angry and spent the week walking back</li>
      <li>The feedback that was right and landed so wrong it was ignored</li>
      <li>The meeting where you misread the room and pushed anyway</li>
    </ul>
    <p>None of these show up on a test. All of them shape whether people trust you.</p>`},

  {t:'part', cls:'', html:`
    <div class="kick">Part two</div>
    <h2>The toolbox: four frameworks you can use today</h2>
    <p>Each one is small on purpose. You can learn it in a minute and reach for it the same afternoon.</p>`},

  {t:'fw1', cls:'', html:`
    <div class="kick">Framework one</div>
    <h2>The 3-Question Rule</h2>
    <p>Before you say the thing, ask three questions in order:</p>
    <ul>
      <li><span class="num">1</span>Does this need to be said?</li>
      <li><span class="num">2</span>Does this need to be said by me?</li>
      <li><span class="num">3</span>Does this need to be said by me, right now?</li>
    </ul>`},

  {t:'fw1b', cls:'', html:`
    <div class="kick">The 3-Question Rule in practice</div>
    <p class="quote">Most of what we regret saying fails the third question, not the first.</p>
    <p>The point is not silence. It is choosing the moment, the messenger, and the timing on purpose instead of on reflex.</p>`},

  {t:'fw2', cls:'', html:`
    <div class="kick">Framework two</div>
    <h2>The Emotional Postmortem</h2>
    <p>After a moment you handled badly, do not just move on. Run a short review:</p>
    <div class="step">What actually happened</div>
    <div class="step">Why it set me off</div>
    <div class="step">The plan so next time is different</div>`},

  {t:'fw2b', cls:'', html:`
    <div class="kick">Why the postmortem works</div>
    <p>A resolution fades by Monday. A postmortem turns one bad moment into a specific plan, so the same trigger does not win twice.</p>
    <p>Over time your reactions stop being surprises and start being data.</p>`},

  {t:'fw3', cls:'', html:`
    <div class="kick">Framework three</div>
    <h2>The Rule of the Chess Player</h2>
    <p>A good chess player does not just make a move. They think about the move after the move.</p>
    <p>Before you act, picture how your words will land on the other person, and what they will likely do next. Empathy becomes anticipation.</p>`},

  {t:'fw3b', cls:'', html:`
    <div class="kick">The chess player in the room</div>
    <p class="quote">You are not trying to win the exchange. You are trying to win the relationship.</p>
    <p>Reading one move ahead is the difference between being right and being heard.</p>`},

  {t:'fw4', cls:'', html:`
    <div class="kick">Framework four</div>
    <h2>Resilience, the fifth element</h2>
    <p>The standard model of emotional intelligence has four abilities. Pressure exposes a fifth one that rarely gets taught: resilience.</p>
    <p>It is the muscle that lets you feel the hit, steady yourself, and keep leading.</p>`},

  {t:'fw4b', cls:'', html:`
    <div class="kick">Building the muscle</div>
    <ul>
      <li>Name the feeling before it names you</li>
      <li>Separate the event from the story you are telling about it</li>
      <li>Choose one small next action you can actually take</li>
    </ul>
    <p>Resilience is not toughness. It is recovery speed, and it is trainable.</p>`},

  {t:'part', cls:'', html:`
    <div class="kick">Part three</div>
    <h2>When four habits become one way of leading</h2>
    <p>Individually these are habits. Together they are a way of leading: fewer reactions you regret, harder conversations that actually land, a team that trusts how you show up.</p>`},

  {t:'why', cls:'', html:`
    <div class="kick">Why learn this here</div>
    <h2>A decade of applying EQ in the real world</h2>
    <p>Justin Bariso writes the emotional intelligence column read by over a million people a month, and his book EQ Applied has been translated into more than a dozen languages.</p>
    <p>The whole focus is the same: not theory, but tools you can use today.</p>`},

  {t:'recap', cls:'', html:`
    <div class="kick">The four tools, in one place</div>
    <ul>
      <li><span class="num">1</span>The 3-Question Rule, for what you are about to say</li>
      <li><span class="num">2</span>The Emotional Postmortem, for what you already did</li>
      <li><span class="num">3</span>The Rule of the Chess Player, for reading the room</li>
      <li><span class="num">4</span>Resilience, for staying in the game under pressure</li>
    </ul>`},

  {t:'invite', cls:'', html:`
    <div class="kick">Go deeper</div>
    <h2>Turn these frameworks into a credential</h2>
    <p>If today was useful, the EQ Applied Certified Professional program takes you through the full toolbox, with a real assessment and a verifiable certificate, so you can apply emotional intelligence with leaders and teams and prove it.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h1>Join the EQ Applied certification</h1>
    <p class="lead">Start with the live masterclass, then enroll in the EQ Applied Certified Professional program at eqapplied.com.</p>
    <p class="disc">Educational content only. No income, role, outcome, or result is guaranteed, and results vary from person to person. Nothing here is a promise of advancement or earnings.</p>
    <div class="foot">EQ Applied, with Justin Bariso</div>`}
];

const deck = document.getElementById('deck');
for (const s of S){
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls || '');
  d.innerHTML = s.html;
  deck.appendChild(d);
}
</script>
</body>
</html>
