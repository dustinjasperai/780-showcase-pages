<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Leaders Your Restaurant Can Run On - A Live Masterclass with Christin Marvin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#212610;        /* harvested dominant olive */
    --panel:#2b3117;     /* +1 lift of the olive */
    --rule:#c7a86a;      /* brass accent, derived warm complement */
    --accent:#c7a86a;
    --text:#f8f5f2;      /* harvested cream */
    --muted:#c9ccbc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{width:100%;max-width:1000px;aspect-ratio:16/10;max-height:100vh;position:relative;padding:0 20px}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7% 9%}
  .slide.on{display:flex}
  .k{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:1.1rem}
  h1{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:clamp(2.1rem,5.4vw,3.7rem);
    line-height:1.04;letter-spacing:-.01em}
  h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(1.8rem,4.6vw,3.1rem);
    line-height:1.08}
  .sub{font-family:"Cormorant Garamond",serif;font-size:clamp(1.2rem,2.5vw,1.7rem);color:var(--muted);
    margin-top:1.1rem;max-width:36ch;font-weight:500}
  p.body{font-size:clamp(1rem,1.7vw,1.18rem);line-height:1.6;color:var(--text);margin-top:1.3rem;
    max-width:48ch}
  .rule{width:54px;height:3px;background:var(--rule);margin:0 0 1.5rem;border-radius:2px}
  ul{margin-top:1.5rem;list-style:none;max-width:46ch}
  li{font-size:clamp(1rem,1.7vw,1.2rem);line-height:1.45;padding:.55rem 0 .55rem 1.5rem;
    position:relative;border-bottom:1px solid rgba(248,245,242,.09)}
  li:before{content:"";position:absolute;left:0;top:1.25rem;width:8px;height:8px;border-radius:50%;
    background:var(--accent)}
  .pillar h2{font-size:clamp(3rem,8vw,5.5rem);color:var(--accent)}
  .note{margin-top:1.8rem;font-size:.95rem;color:var(--muted);letter-spacing:.04em}
  .disc{margin-top:1.6rem;font-size:.74rem;line-height:1.5;color:var(--muted);max-width:52ch;opacity:.85}
  .nav{position:fixed;bottom:18px;right:24px;font-size:.78rem;color:var(--muted);letter-spacing:.1em}
  .brandfoot{position:fixed;bottom:18px;left:24px;font-size:.72rem;color:var(--muted);
    letter-spacing:.18em;text-transform:uppercase}
  .hint{position:fixed;top:18px;right:24px;font-size:.68rem;color:var(--muted);opacity:.6}
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandfoot">Columbine Hospitality</div>
<div class="nav"><span id="n">1</span> / <span id="tot">1</span></div>
<div class="hint">use arrow keys</div>
<script>
const S=[
  {t:'title', k:'A Live Masterclass with Christin Marvin', h:'Build Leaders Your Restaurant Can Run On', sub:'How to scale to your next location without living in the building.'},
  {t:'who', k:'Who this is for', h:'The owner who is the business.', body:'You run one great location. You want a second. But every decision, every fire, and every shift still routes through you.'},
  {t:'who', k:'The trap', h:'The harder you work, the more the business needs you.', body:'Every hour you pour in trains your team to bring you the next problem instead of solving it. Your effort quietly becomes the bottleneck.'},
  {t:'hook', k:'The reframe', h:'You don\'t have a growth problem. You have a leadership-bench problem.', sub:'More hours will not open your next location. A team that can carry it will.'},
  {t:'part', k:'Part one', h:'Why working harder stopped working', body:'The owner-dependent restaurant has a ceiling, and the ceiling is you. When you are the only one who can decide, hire, and hold the standard, growth costs you your health long before it costs you anything else.'},
  {t:'list', k:'The real cost', h:'What owner-dependence takes', items:['The days off you never take','The managers who leave because they were never developed','The second location that stays a someday','The standard that slips the moment you step away']},
  {t:'part', k:'Part two', h:'The Independent Restaurant Framework', sub:'Three pillars, in this order. People first.'},
  {t:'pillar', k:'Pillar one', h:'People', body:'Develop a leadership bench and align them to your values. Hire for the standard, then coach leaders instead of fixing problems. This is the pillar most independents skip, and it is exactly why they stall.'},
  {t:'list', k:'The People pillar, in practice', h:'What developing leaders looks like', items:['Clear standards everyone on the team can name','A coaching rhythm, not a rescue habit','Values used to hire, and to let go','Ownership pushed down to the floor']},
  {t:'pillar', k:'Pillar two', h:'Process', body:'Document the systems and set the operating cadence, the meetings and rhythms, that let a second and third location run consistently without you on every floor.'},
  {t:'list', k:'The Process pillar, in practice', h:'The cadence that holds', items:['A weekly leadership meeting that actually decides','Systems written down, not carried in your head','The numbers reviewed on a set schedule','A new location that opens to the same standard']},
  {t:'pillar', k:'Pillar three', h:'Profit', body:'Read your numbers and protect your margin as you grow, so expansion adds profit instead of chaos. Profit is the result of People and Process done right, never a separate hustle.'},
  {t:'list', k:'Why People comes first', h:'The order is the insight', items:['A developed leader runs the process','A run process protects the profit','Skip People and you are right back on the floor','Coach more, fix less']},
  {t:'part', k:'Part three', h:'What it looks like when it works', body:'A week where the restaurant runs to your standard without you in the building. A manager who handles table 12 because that is what you trained for. A Saturday that is finally yours. And a second location that is a plan, not a wish.'},
  {t:'credibility', k:'Why me', h:'From line cook at 15 to coaching the owners I used to be', body:'Two decades in hospitality, from fine dining to high-volume concepts, line cook to managing partner by 30. Author of Multi-Unit Mastery and The Hospitality Leader\'s Roadmap, and host of the Restaurant Leadership Podcast.'},
  {t:'hook', k:'The promise', h:'Freedom is a built thing.', sub:'Not a day you finally take. A team you finally trust.'},
  {t:'list', k:'The method, in one view', h:'People, Process, Profit', items:['People, a leadership bench aligned to your values','Process, systems and cadence a new location runs on','Profit, margin protected as you scale','All of it, so you can lead without losing yourself']},
  {t:'cta', k:'Your next step', h:'Let\'s map the framework to your restaurant', sub:'Book a free strategy call to find your People, Process, and Profit gaps and build your plan to the next location.', note:'columbinehospitality.com', disc:'This masterclass is educational. No income or business result is guaranteed. Results vary with your market, team, and execution.'}
];
const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'+(i===0?' on':'')+(s.t==='pillar'?' pillar':'');
  let html='';
  if(s.k) html+='<div class="k">'+s.k+'</div>';
  if(s.t==='title'||s.t==='hook'||s.t==='pillar'){
    html+='<div class="rule"></div>';
    html+='<h1>'+s.h+'</h1>';
  } else {
    html+='<div class="rule"></div><h2>'+s.h+'</h2>';
  }
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.body) html+='<p class="body">'+s.body+'</p>';
  if(s.items){html+='<ul>';s.items.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  if(s.note) html+='<div class="note">'+s.note+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  d.innerHTML=html;
  stage.appendChild(d);
});
let cur=0;const slides=document.querySelectorAll('.slide');
document.getElementById('tot').textContent=S.length;
function go(n){slides[cur].classList.remove('on');cur=(n+S.length)%S.length;
  slides[cur].classList.add('on');document.getElementById('n').textContent=cur+1;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1);});
stage.addEventListener('click',()=>go(cur+1));
</script>
</body>
</html>
