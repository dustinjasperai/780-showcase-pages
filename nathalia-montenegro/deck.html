<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Story Voice Method — a masterclass with Nathalia Montenegro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffbeb;      /* warm cream ground (her dominant color) */
    --panel:#f6eed8;   /* deeper warm cream */
    --ink:#2e2a24;     /* her dark text */
    --sage:#465d48;    /* her sage green */
    --accent:#6b8fa8;  /* her signature dusty blue */
    --spark:#f68c49;   /* her warm orange */
    --rule:#e6dcc0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--panel);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
  .slide{display:none;width:min(1040px,94vw);background:var(--bg);border:1px solid var(--rule);
    border-radius:18px;padding:7vh 6vw;min-height:74vh;box-shadow:0 18px 50px rgba(46,42,36,.08);
    flex-direction:column;justify-content:center}
  .slide.on{display:flex;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kick{font-family:"Poppins";font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:.74rem;color:var(--accent);margin-bottom:1.1rem}
  h1{font-family:"Poppins";font-weight:700;font-size:clamp(2.1rem,5.2vw,3.5rem);line-height:1.05;color:var(--ink)}
  h2{font-family:"Poppins";font-weight:600;font-size:clamp(1.6rem,3.8vw,2.5rem);line-height:1.12;color:var(--ink)}
  .sub{font-size:clamp(1.05rem,2vw,1.35rem);color:var(--sage);margin-top:1.4rem;max-width:40ch;line-height:1.5}
  p.body{font-size:clamp(1.05rem,1.9vw,1.3rem);color:var(--ink);margin-top:1.2rem;max-width:46ch;line-height:1.55}
  .big{font-family:"Poppins";font-weight:600;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.12;max-width:20ch}
  .big .hl{color:var(--spark)}
  ul{margin-top:1.6rem;list-style:none;display:flex;flex-direction:column;gap:1rem;max-width:48ch}
  li{position:relative;padding-left:2.2rem;font-size:clamp(1rem,1.8vw,1.22rem);line-height:1.45;color:var(--ink)}
  li .n{position:absolute;left:0;top:0;font-family:"Poppins";font-weight:700;color:var(--accent)}
  li b{color:var(--sage)}
  .mega{font-family:"Poppins";font-weight:700;color:var(--accent);font-size:clamp(3rem,9vw,6rem);line-height:1}
  .cta-steps{margin-top:1.6rem;display:flex;flex-direction:column;gap:.8rem;font-size:1.15rem;color:var(--ink)}
  .disc{margin-top:2.2rem;font-size:.82rem;color:#8a8373;max-width:58ch;line-height:1.4}
  .nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
  .nav button{border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:999px;
    width:40px;height:34px;font-size:1rem;cursor:pointer}
  .brandline{font-family:"Poppins";font-weight:600;color:var(--sage)}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button id="prev">&larr;</button><button id="next">&rarr;</button></div>
<script>
const S=[
  {t:'title', kick:'A live masterclass with Nathalia Montenegro',
   h:'The Story Voice Method',
   sub:'Find the one thread that makes your brand unmistakable, so the right clients recognize you before you ever pitch them.'},

  {t:'who', kick:'Who this is for',
   h:'For founders, experts and creatives with a voice already',
   body:'You post. You have an audience. People tell you they love your work. And yet it still feels scattered, and the pricing still feels like a fight. This hour is for you.'},

  {t:'trap', kick:'The trap',
   h:'So you try to fix it by being louder',
   body:'More posts. Another rebrand. A new logo, a new bio, a new niche. It feels like motion. It rarely moves the business, because it is treating the wrong problem.'},

  {t:'reframe', kick:'The reframe',
   big:'You do not have a visibility problem. You have a <span class="hl">clarity</span> problem.'},

  {t:'part', kick:'Part one', h:'Why your voice is not a business yet'},

  {t:'point', kick:'The core problem',
   h:'A freelancer with better branding',
   body:'When your story has not been excavated, your brand stays a collection of nice posts. You sound like every other expert in your space, so you compete on price instead of on meaning.'},

  {t:'point', kick:'Why louder does not work',
   h:'Volume amplifies whatever is already there',
   body:'If the thread is not clear, posting more just spreads the confusion wider. People follow a way of seeing, not a posting schedule. The way of seeing has to be found first.'},

  {t:'part', kick:'Part two', h:'The Story Voice Method'},

  {t:'point', kick:'Step one',
   h:'Excavate the real story',
   body:'Your positioning is not borrowed from a template. It is already inside your history, your turning points, the thing you keep returning to. Brand therapy starts by reconnecting you with that authentic voice.'},

  {t:'point', kick:'Step two',
   h:'Find the thread',
   body:'Out of the story comes one through-line, the idea everything you make quietly points at. Name it plainly, and suddenly the scattered work reads as one body of work.'},

  {t:'point', kick:'Step three',
   h:'Position from the thread, not the trend',
   body:'Now positioning is a decision, not a guess. You say what you stand for in words only you would use, and the right people feel recognized instead of marketed to.'},

  {t:'part', kick:'Part three', h:'The 5-Layer Brand Structure'},

  {t:'layers', kick:'From a voice to a structure',
   h:'A brand is a stack, not a logo',
   list:[
     {n:'1', b:'Story', x:'the real narrative and voice underneath everything'},
     {n:'2', b:'Positioning', x:'the thread, said out loud, as a claim you can own'},
     {n:'3', b:'Message', x:'the few ideas you repeat until people can repeat them back'},
     {n:'4', b:'Offers', x:'the way the positioning turns into something people buy'},
     {n:'5', b:'Content', x:'the weekly proof that keeps building the perception'}
   ]},

  {t:'point', kick:'Why the order matters',
   h:'Most brands build the stack upside down',
   body:'They start at content and hope a logo will hold it together. Story comes first and structure comes last. When the layers line up, the brand finally generates business instead of just looking good.'},

  {t:'point', kick:'Story, strategy and structure',
   h:'Authentic and strategic are not opposites',
   body:'Strategy is the bridge between who you really are and what the market pays for. You do not have to flatten yourself into one keyword. Your range is the asset once it has a structure to sit in.'},

  {t:'point', kick:'Understood, not just seen',
   h:'When the thread is clear',
   body:'You stop explaining what you do and start being understood. Pricing conversations get easier because you are no longer a commodity. The work feels like yours again, because it is.'},

  {t:'why', kick:'Why me',
   h:'Thirteen years finding the thread for other people',
   body:'I am Nathalia Montenegro, a brand and communication strategist, nine years of that self-employed. I write Diary of a Brand Therapist to more than seven thousand readers. Finding the thread is the whole of what I do.'},

  {t:'recap', kick:'The one thing',
   big:'Find the thread first. Everything else is <span class="hl">structure</span>.'},

  {t:'cta', kick:'Where to go from here',
   h:'Build the whole structure with me',
   steps:['Start with a Brand Clarity session to find your thread together.',
          'Go deeper with the Brand Architecture Intensive or 3-month 1:1 mentoring.',
          'Visit nathaliamontenegro.com to begin.'],
   disc:'This masterclass is educational. No income, revenue or business result is guaranteed. Outcomes vary with your market, your effort and many factors outside any method.'}
];

const stage=document.getElementById('stage');
let i=0;
function esc(x){return x||''}
function render(){
  const s=S[i];
  let inner='';
  if(s.kick) inner+='<div class="kick">'+esc(s.kick)+'</div>';
  if(s.t==='title'){inner+='<h1>'+esc(s.h)+'</h1>'+(s.sub?'<div class="sub">'+esc(s.sub)+'</div>':'');}
  else if(s.t==='reframe'||s.t==='recap'){inner+='<div class="big">'+esc(s.big)+'</div>';}
  else if(s.t==='part'){inner+='<h1>'+esc(s.h)+'</h1>';}
  else if(s.t==='layers'){
    inner+='<h2>'+esc(s.h)+'</h2><ul>';
    s.list.forEach(function(it){inner+='<li><span class="n">'+it.n+'</span><b>'+it.b+'</b>: '+it.x+'</li>';});
    inner+='</ul>';
  }
  else if(s.t==='cta'){
    inner+='<h2>'+esc(s.h)+'</h2><div class="cta-steps">';
    s.steps.forEach(function(st){inner+='<div>&bull; '+st+'</div>';});
    inner+='</div><div class="disc">'+esc(s.disc)+'</div>';
  }
  else {inner+='<h2>'+esc(s.h)+'</h2>'+(s.body?'<p class="body">'+esc(s.body)+'</p>':'');}
  stage.innerHTML='<div class="slide on">'+inner+'</div>';
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.getElementById('next').onclick=function(){go(1)};
document.getElementById('prev').onclick=function(){go(-1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
