<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rep Nobody Trains — Athlete Mental Game Coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0807;
    --panel:#1a1210;
    --rule:#2a1e1b;
    --accent:#d11a2a;
    --ink:#f5f5f3;
    --muted:#a89f9c;
    --head:'Oswald',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 56px;
    margin:0 0 28px;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .kicker{font-family:var(--head);text-transform:uppercase;letter-spacing:.18em;
    font-weight:600;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:54px;line-height:1.04;
    letter-spacing:.01em;text-transform:uppercase}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.1;
    text-transform:uppercase;letter-spacing:.01em}
  .sub{color:var(--muted);font-size:20px;line-height:1.5;margin-top:18px;max-width:40ch}
  p.body{font-size:19px;line-height:1.6;margin-top:16px;max-width:52ch;color:#e7e2e0}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:14px}
  li{font-size:19px;line-height:1.5;padding-left:26px;position:relative;color:#e7e2e0}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:3px;
    background:var(--accent);border-radius:2px}
  .big{font-family:var(--head);font-weight:700;text-transform:uppercase;
    font-size:46px;line-height:1.08;margin-top:8px}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent);
    text-decoration-thickness:4px}
  .on{color:var(--accent)}
  .foot{position:absolute;bottom:22px;left:56px;font-family:var(--head);
    text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--muted)}
  .pageno{position:absolute;bottom:22px;right:56px;font-size:11px;color:var(--muted)}
  .cta .btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;
    font-family:var(--head);text-transform:uppercase;letter-spacing:.08em;font-weight:600;
    padding:16px 30px;border-radius:10px;font-size:17px}
  .disc{color:var(--muted);font-size:13px;line-height:1.5;margin-top:26px;max-width:50ch}
  @media(max-width:640px){h1{font-size:38px}.slide{padding:36px 28px}.foot,.pageno{left:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Live Masterclass with Athlete Mental Game Coaching',
    h:'The Rep Nobody Trains',
    sub:'How to go from chasing the standard to setting it, without more reps in the gym.'},

  {t:'promise', kicker:'What you will leave with',
    h:'A way to train the mental game',
    body:'By the end of this session you will have a repeatable way to build confidence, quiet self-doubt, and let your training show up when it actually counts. Not a pep talk. A method you can practice like any other skill.'},

  {t:'who', kicker:'Who this is for',
    h:'The athlete who freezes',
    body:'You train hard. In practice you look like the player everyone expects. Then the whistle blows, the pressure climbs, and some of that skill quietly disappears. This is for the serious athlete, and the parent who sees it happening and does not know how to help.'},

  {t:'trap', kicker:'The trap',
    h:'More reps in the gym',
    body:'When performance dips, almost everyone reaches for the same answer: train harder, do more reps, add another session. But the problem on game day is rarely a skill problem. It is what happens inside your head in the moment you need the skill most.'},

  {t:'reframe', kicker:'The reframe',
    h:'It is not your skill',
    body:'The thing holding you back is not a missing ability. It is that you have never trained the part of the game that decides whether your ability shows up. Everyone trains the body. Almost no one trains the mind. That is the open rep.'},

  {t:'part', kicker:'Part One',
    h:'The core problem',
    sub:'Chasing the standard versus setting it.'},

  {t:'problem', kicker:'Chasing the standard',
    h:'Playing not to lose your spot',
    body:'When fear runs the show, you play small. You protect your place on the team, avoid the mistake, and hope not to get benched. Your focus is on what you might lose. That is chasing the standard, and it is exhausting, because the pressure never comes from the game. It comes from inside you.'},

  {t:'part', kicker:'Part Two',
    h:'Training the inner game',
    sub:'The five pieces we train, so the mind stops being the weak link.'},

  {t:'pillar', kicker:'Piece One',
    h:'Confidence, built not born',
    body:'Confidence is the piece of the game no one really trains, because most people believe you either have it or you do not. You do not. It is a skill you build with reps, the same way you built your first touch. We train it on purpose instead of waiting to feel it.'},

  {t:'pillar', kicker:'Piece Two',
    h:'Trust under pressure',
    body:'You have already put in the work. Trust is letting that trained skill run without your conscious mind interfering. The athletes who over control, who try to steer every movement, are the ones who tighten up. We train you to trust what you built and get out of your own way.'},

  {t:'pillar', kicker:'Piece Three',
    h:'The three step self doubt process',
    body:'When doubt starts talking, you do three things. Name it, so it stops hiding as the truth. Split it from your next action, so it cannot drive. Then re-anchor on the one rep in front of you. Doubt does not disappear, it just stops being in charge.'},

  {t:'pillar', kicker:'Piece Four',
    h:'Routines, not superstitions',
    body:'A routine is something you control, repeatable and portable, that steadies you before you perform. A superstition is fragile and external, and when it breaks it adds pressure. We build you a real pre-performance routine so you arrive ready instead of hoping.'},

  {t:'pillar', kicker:'Piece Five',
    h:'Nerves into edge',
    body:'Strict expectations and the pressure you put on yourself turn nerves into something that works against you. We reframe that same energy as readiness, and we loosen the grip of the expectations that were only ever making the moment heavier.'},

  {t:'shift', kicker:'The shift',
    h2:'<span class="strike">Chasing</span> the standard, to <span class="on">setting</span> it',
    body:'When the inner game is trained, the whole thing flips. You stop protecting your spot and start raising the level around you. You play free. That is setting the standard, and it is available to any athlete willing to train the rep nobody trains.'},

  {t:'part', kicker:'Part Three',
    h:'What it looks like',
    sub:'The same athlete, with the mind trained.'},

  {t:'picture', kicker:'On game day',
    h:'Your skill, when it counts',
    body:'The player who trains this walks in steadier. The doubt still shows up, it just no longer drives. The routine does its job. The nerves turn into focus. And the skill you built in training is finally the skill that shows up in the game. Nothing was added to your body. The block was removed from your mind.'},

  {t:'why', kicker:'Why Athlete Mental Game Coaching',
    h:'Coached, not theorized',
    body:'Cole Russell is a two time All American and Offensive Player of the Year who now coaches at the college level and across top competitive programs. This is the mental game taught by someone who has lived the pressure and coached athletes through it, built into a system you can actually train.'},

  {t:'recap', kicker:'The pieces',
    h:'What we train',
    items:['Confidence you build, not just feel','Trust in your training under pressure','The three step self doubt process','A routine that steadies, not a superstition','Nerves turned into edge']},

  {t:'cta', kicker:'Your next step',
    h:'Book a free strategy session',
    body:'If you want help training the rep nobody trains, book a free strategy session with Athlete Mental Game Coaching and we will map out where your mental game is costing you and what to train first.',
    disc:'This masterclass is for educational purposes only. Results are not guaranteed and vary by athlete, effort, and situation.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let html = '';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.h) html += '<h1>' + s.h + '</h1>';
  if (s.h2) html += '<div class="big">' + s.h2 + '</div>';
  if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  if (s.body) html += '<p class="body">' + s.body + '</p>';
  if (s.items) html += '<ul>' + s.items.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  if (s.t === 'cta') html += '<div><a class="btn">Book a free strategy session</a></div>';
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  html += '<div class="foot">Athlete Mental Game Coaching</div>';
  html += '<div class="pageno">' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
