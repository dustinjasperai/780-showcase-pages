<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confidence, Clarity and Connection — A Masterclass with Bonnie Bonadeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0d; --panel:#151414; --rule:#2c2b2b;
    --accent:#10aec6; --accent-soft:#52c2c8; --ink:#f4f4f4; --body:#c3c6c6; --dim:#7d8385;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050505;font-family:'Libre Franklin',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.6%;background:var(--bg)}
  .slide.active{opacity:1}
  .kicker{font-family:'Libre Franklin',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Fjalla One',Arial,sans-serif;font-weight:400;color:var(--ink);line-height:1.06;letter-spacing:.002em}
  .t-title h1{font-size:6.6vw;max-width:74%}
  .t-normal h1{font-size:3.9vw;max-width:88%;line-height:1.1}
  .t-normal .body{font-family:'Libre Franklin',sans-serif;font-size:1.26vw;color:var(--body);margin-top:2.9vh;max-width:76%;line-height:1.66;font-weight:400}
  .sub{font-family:'Libre Franklin',sans-serif;font-style:italic;font-size:1.62vw;color:var(--accent-soft);margin-top:3.0vh;max-width:82%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Libre Franklin',sans-serif;font-size:1.05vw;font-weight:700;color:var(--accent);margin-bottom:1.8vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:5.4vw;max-width:86%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.0vh}
  .t-dark{background:radial-gradient(120% 140% at 82% 12%,#132a2e 0%,#0b0b0b 70%)}
  .t-dark h1{color:var(--ink);font-size:4.6vw;max-width:88%;font-weight:400}
  .t-dark h1 .hl{color:var(--accent)}
  .t-cta{background:radial-gradient(120% 140% at 82% 12%,#132a2e 0%,#0b0b0b 70%)}
  .t-cta h1{color:var(--ink);font-size:4.8vw;max-width:86%}
  .t-cta .body{font-family:'Libre Franklin',sans-serif;color:#d8dcdc;font-size:1.3vw;margin-top:2.6vh;max-width:72%;line-height:1.62}
  .chips{display:flex;gap:1.2vw;margin-top:4.0vh;flex-wrap:wrap}
  .chip{border:1.6px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.9vw;font-size:1.1vw;font-weight:600;font-family:'Libre Franklin',sans-serif}
  .brandline{font-family:'Libre Franklin',sans-serif;font-size:1.1vw;color:var(--body);margin-top:3.6vh;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:5.0vh;font-family:'Libre Franklin',sans-serif;font-size:.8vw;color:#6f7577;line-height:1.5;max-width:84%}
  .hud{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:6.5%;top:50%;transform:translateY(-50%);width:22vw;height:22vw;opacity:.95}
  .corner-mo{right:6%;bottom:8%;width:8vw;height:8vw;opacity:.4}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:11vw}.t-normal h1{font-size:7.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.2vw}.t-section h1{font-size:9.2vw}.t-dark h1{font-size:8.0vw}
    .t-cta h1{font-size:8.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}.disc{font-size:2vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">SOS Salon Coaching</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: concentric listening rings, one voice reaching the room -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <g fill="none" stroke="#10aec6" stroke-width="2.2" stroke-linecap="round">
    <circle cx="60" cy="60" r="9" fill="#10aec6" stroke="none" opacity="0.95"/>
    <path d="M78 44 a24 24 0 0 1 0 32" opacity="0.75"/>
    <path d="M90 34 a40 40 0 0 1 0 52" opacity="0.5"/>
    <path d="M42 44 a24 24 0 0 0 0 32" opacity="0.75"/>
    <path d="M30 34 a40 40 0 0 0 0 52" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Confidence, Clarity and Connection.',sub:'The masterclass on leading your salon team like a leader, not just a boss, so your best people stay and your standard holds when you step back.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You are brilliant behind the chair. It is the people side of the salon that keeps you up at night.',body:'You built a salon clients love and a craft nobody questions. But the part that drains you is not the hair. It is the two stylists who are not speaking, the good one who just gave notice, the team that goes quiet the moment you raise something hard. Nobody trained you for that, because it was never taught at the basin.'},
 {t:'dark',title:'You do not have a staff problem. You have a <span class="hl">communication</span> and <span class="hl">leadership</span> gap.'},

 {t:'section',idx:'Part One',title:'Why Hiring Better People Never Fixed It'},
 {t:'normal',k:'The owner who manages by mood',title:'Most owners were never taught to lead, so they lead by reacting.',body:'You are warm until you are frustrated, then you go quiet or you go blunt. You write another policy after every problem and wonder why nothing changes. The team learns to read your mood instead of the standard, and the honest conversations get avoided until they blow up. That is not a character flaw. It is a skill nobody ever handed you.'},
 {t:'normal',k:'The hidden cost',title:'The turnover, the cliques, the tension a client can feel, all trace back to the same gap.',body:'Good stylists leave because they never heard the truth about where they stood or felt anyone was invested in their growth. Small resentments harden into a culture people want out of. And clients feel every bit of it, in the greeting, the consultation, the energy in the room. A revolving door quietly eats your profit, and it convinces you the problem is the people. It rarely is.'},
 {t:'dark',title:'Here is the good news. Soft skills are not personality. They are <span class="hl">teachable</span>.'},

 {t:'section',idx:'Part Two',title:'Leading With Emotional Intelligence: The SOS Way'},
 {t:'normal',k:'Start with your own signal',title:'Before you fix how they communicate, get honest about how you do.',body:'Every owner has a default. Some are too direct and leave a wake they cannot see. Some are so friendly they never actually address the problem. Emotional intelligence starts with naming your own style, so you can choose your response in the hard moment instead of defaulting to it. When the leader gets self aware, the whole room settles, because they finally know which version of you is walking in.'},
 {t:'normal',k:'Coach, do not enforce',title:'Stop handing down policies. Start coaching people to their own answer.',body:'A rule tells someone what to do once. Coaching teaches them to think, so they make the right call the next time you are not in the room. Instead of enforcing, you ask, you listen, you let them arrive at the solution with you. It takes one honest conversation more than a policy does, and it is the difference between a team that complies and a team that owns its work.'},
 {t:'normal',k:'Listen like it is the job',title:'Active listening is the most underrated skill on your floor.',body:'When you truly listen, a stylist feels understood and stays, and a client feels heard and rebooks. Most owners listen to reply, scanning for the moment to fix it. Emotionally intelligent leaders listen to understand first, name what they heard, and only then respond. Train that one habit across the team and half of your service complaints and your staff friction quietly disappear.'},
 {t:'normal',k:'Name the culture out loud',title:'Culture is not a vibe. It is the handful of behaviours you decide to hold.',body:'A team cannot live up to a standard nobody ever put into words. So you name what this salon stands for and what it will not tolerate, and you connect it to the small daily behaviours, the greeting, the handoff, the way feedback is given. When the values are spoken and modelled, people can lead themselves toward them, and you stop being the only one holding the line.'},
 {t:'normal',k:'The conversation you keep avoiding',title:'The hard conversation, handled with emotional intelligence, is where trust is built.',body:'The talk you dread, about the attitude, the lateness, the notice, is the one that actually earns respect when you do it well. Lead with the truth and the care at the same time, be clear about the standard and human about the person, and the conversation stops being a confrontation. Done this way, honesty becomes the thing your team trusts you for, not the thing they brace against.'},
 {t:'dark',title:'You cannot out hire a leadership gap. Lead the people, and the <span class="hl">team holds itself</span>.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Lead This Way'},
 {t:'normal',k:'The salon this builds',title:'A team that wants to stay, a culture clients can feel, and an owner who is not the emergency contact.',body:'When you know your own signal, coach instead of enforce, listen first and name the culture out loud, the whole business feels different. Your best people stay because they are seen and growing. The tension in the back room settles. You stop refereeing every small thing and start leading, and the standard finally holds on the days you are not there. That is a salon you can grow and actually enjoy owning.'},
 {t:'dark',title:'The goal was never one more good hire. It was a team that <span class="hl">trusts how you lead</span>.'},
 {t:'normal',k:'Why Bonnie',title:'Thirty years in the industry, a licensed cosmetologist, and the coach who teaches owners to lead.',body:'Bonnie Bonadeo spent three decades in the beauty industry before building SOS Salon Coaching and the SOS Leadership Academy. She is a licensed cosmetologist, an emotional intelligence and StoryBrand trained business coach, host of the SOS Small Business Success podcast, and a seven time best selling author. Everything in this masterclass comes from that real work with owners and their teams, not from theory.'},

 {t:'section',idx:'Your Next Step',title:'Lead the Team, Keep the People'},
 {t:'normal',k:'Keep going with SOS',title:'From your own communication style to a team that leads itself to the standard.',body:'SOS Salon Coaching walks owners through the whole thing, the self awareness, the coaching habits, the listening, and the culture work that lets you step back without the salon slipping. Whether you start with a strategy conversation or step into the SOS Leadership Academy, the goal is the same, a team that stays, a culture clients feel, and a leader they trust.'},
 {t:'cta',title:'Ready to lead your salon with confidence, clarity and connection?',body:'Take the next step with Bonnie Bonadeo and SOS Salon Coaching.',chips:['Book a strategy conversation','Step into the SOS Leadership Academy','Start with the SOS podcast'],disc:'Educational content for salon and spa owners. No income or business result is guaranteed. Results vary by individual, salon, market, team, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">SOS <b>Salon Coaching</b> · Bonnie Bonadeo</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='corner') h+=mo('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
