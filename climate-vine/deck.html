<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Collaboration Engine — a Climate Vine masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf7;        /* warm off-white — honours Climate Vine's LIGHT scheme */
    --panel:#f2efe6;     /* soft warm panel */
    --ink:#274945;       /* their dominant deep forest green (brand.json, 50 uses) */
    --ink-soft:#3a5d59;  /* their muted green (brand.json) */
    --accent:#e8c53d;    /* saturated gold derived from their #ffed8e accent (59 uses) */
    --accent-soft:#ffed8e;/* their light yellow — used as fills/underlines */
    --serif:'EB Garamond',Georgia,serif;   /* their display serif */
    --sans:'DM Sans',system-ui,sans-serif; /* their UI face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:32px 18px 80px}
  .slide{
    background:var(--bg);border-radius:14px;padding:64px 60px;margin:0 0 26px;
    min-height:520px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(39,73,69,.08);position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent)}
  .kicker{font-family:var(--sans);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:12px;color:var(--ink-soft);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:600;font-size:52px;line-height:1.05;color:var(--ink);margin-bottom:20px}
  h2{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.08;color:var(--ink);margin-bottom:18px}
  h3{font-family:var(--serif);font-weight:500;font-size:27px;color:var(--ink);margin-bottom:10px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:42ch;margin-bottom:14px}
  p.lead{font-size:23px;max-width:46ch}
  .big{font-family:var(--serif);font-size:30px;line-height:1.25;max-width:38ch}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;line-height:1.45;color:var(--ink);padding-left:28px;position:relative;margin-bottom:12px;max-width:44ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;
    background:var(--accent-soft);border:2px solid var(--ink)}
  .pill{display:inline-block;font-family:var(--sans);font-weight:500;font-size:15px;
    background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:5px 14px;margin:4px 6px 4px 0}
  .stat{font-family:var(--serif);font-size:64px;line-height:1;color:var(--ink)}
  .stat small{display:block;font-family:var(--sans);font-size:16px;color:var(--ink-soft);margin-top:8px;font-weight:500}
  .row{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start}
  .row>div{flex:1;min-width:220px}
  .u{background:linear-gradient(transparent 62%,var(--accent-soft) 62%);padding:0 2px}
  .disc{font-size:13px;color:var(--ink-soft);max-width:60ch;margin-top:22px;line-height:1.4}
  .num{font-family:var(--sans);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.1em}
  footer{color:var(--accent-soft);text-align:center;font-family:var(--sans);font-size:13px;padding:8px 0 30px;opacity:.8}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:auto}h1{font-size:38px}h2{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<footer>Climate Vine &middot; a masterclass with Candice Ammori</footer>
<script>
const S=[
 {t:'title',kicker:'A Climate Vine Masterclass',h:'The Collaboration Engine',
  p:'How climate professionals turn the right relationships into funded, shipped climate work. With Candice Ammori, founder of Climate Vine.'},

 {t:'who',kicker:'Who this is for',h:'You are already in the work',
  list:['A policy lead, climate investor, corporate sustainability head, climate-tech founder, scientist or non-profit builder','You are not short on drive, ideas, or even capital','What is missing is the room: the specific people, across disciplines, who turn your work into motion'],
  p:'This session is about the part nobody schedules: who you build with.'},

 {t:'trap',kicker:'The trap',h:'The silo tax',
  lead:'The climate transition is not blocked by a shortage of ideas or money. It is blocked by disconnection.',
  p:'Policy people, investors, operators and scientists solve the same problems in separate rooms. The best answer usually already exists one discipline over, and never gets introduced.'},

 {t:'reframe',kicker:'The reframe',h:'Your network is not a nicety. It is infrastructure.',
  big:'Every funded climate company, every fast policy win, every hire that mattered, traces back to a handful of introductions that happened to land. We are going to stop leaving those to chance.'},

 {t:'part',num:'PART ONE',h:'Why random networking fails climate work'},

 {t:'body',kicker:'Part one',h:'The three ways it breaks',
  list:['Volume over fit: 400 LinkedIn connections, zero collaborators','No shared commitment: a room half-curious and half-committed produces nothing off-the-record','No follow-through: the conference hallway spark dies on the flight home because nothing holds it']},

 {t:'body',kicker:'Part one',h:'The cost of the wrong rooms',
  lead:'Good people, right intentions, wrong rooms.',
  p:'The result is slow. Careers stall a year longer than they should. Companies raise later, or not at all. Solutions that needed a policy expert and an investor in the same conversation simply do not get built.'},

 {t:'part',num:'PART TWO',h:'The Collaboration Engine'},

 {t:'body',kicker:'Part two',h:'From a network you have to a network that works',
  p:'A collaboration engine is a curated group, engineered introductions, and the structure that turns those introductions into real work. Five parts:',
  list:['A committed, vetted network','Engineered match-making','Off-the-record peer groups','Live expert deep dives','A give-first operating rhythm']},

 {t:'body',kicker:'Pillar 1',h:'The Climate Committed Network',
  lead:'The screen is the product.',
  p:'Everyone is admitted by application across policy, investment, corporate, tech, science and non-profit. Because everyone is a committed operator, an introduction is a warm one. You are never the most serious person in the room, and never the only one.'},

 {t:'body',kicker:'Pillar 2',h:'Engineered match-making',
  lead:'Introductions, not mingling.',
  p:'Members are paired by discipline, career stage and goal, so you meet the specific collaborator you need, not whoever happened to be standing there. This is the mechanism most communities leave to luck, and the one that actually compounds.'},

 {t:'body',kicker:'Pillar 3',h:'Peer groups',
  lead:'Small, trusted, off-the-record.',
  p:'Masterminds organised by career stage, where you workshop the real decision in front of you and are held to it between sessions. Candour requires safety, and safety requires a small room of peers who are actually in your seat.'},

 {t:'body',kicker:'Pillar 4',h:'Expert deep dives',
  lead:'Learn from people a few steps ahead.',
  p:'Live, interactive sessions with senior climate leaders and investors on the specific domain in front of you: capital, policy, scaling, science. The teaching layer, always live, never a recording you half-watch.'},

 {t:'body',kicker:'Pillar 5',h:'Give-first, go farther together',
  lead:'The rhythm that makes the rest work.',
  p:'A give-first culture inside long-lasting, trust-based relationships. People help before they are asked, across disciplines and geographies, because that is how the hard problems actually get solved.'},

 {t:'part',num:'PART THREE',h:'Six months inside a committed room'},

 {t:'body',kicker:'Part three',h:'A member arc',
  list:['Month 1: admitted, matched to a first set of high-fit collaborators','Month 2 to 3: a peer group forms; a stalled decision gets unstuck','Month 3 to 4: an expert deep dive reshapes the plan','Month 5 to 6: an introduction becomes a hire, a raise, a policy conversation, or a company']},

 {t:'why',kicker:'Why this, why now',h:'This has been built before',
  row:[{stat:'650+',small:'people convened across the climate ecosystem'},{stat:'$350M+',small:'raised by people in the room'},{stat:'24+',small:'companies started'}],
  p:'Candice Ammori built On Deck Climate Tech into exactly this kind of engine before founding Climate Vine. The method is proven; the room is the point.'},

 {t:'body',kicker:'What this is not',h:'Not another Slack you mute',
  list:['Not a feed to scroll and abandon','Not open-door networking where fit is random','Not a course you watch alone','It is a curated room, engineered introductions, and the structure to act on them']},

 {t:'cta',kicker:'Your next step',h:'Join the next cohort',
  p:'Climate Vine runs as a 10-week cohort with six months of access. Admission is by application so the room stays committed.',
  pills:['Apply at climatevine.co','10-week cohort + 6 months access','Payment plans and need-based scholarships available'],
  disc:'This masterclass is educational. It shares a method for building climate collaborations and makes no guarantee of any specific funding, career, or business outcome. Results depend on your own work and circumstances.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.num) h+=`<div class="num">${s.num}</div>`;
  if(s.h) h+=`<${s.t==='title'?'h1':'h2'}>${s.h}</${s.t==='title'?'h1':'h2'}>`;
  if(s.lead) h+=`<p class="lead"><strong>${s.lead}</strong></p>`;
  if(s.big) h+=`<p class="big">${s.big}</p>`;
  if(s.p) h+=`<p>${s.p}</p>`;
  if(s.list){h+='<ul>';s.list.forEach(x=>h+=`<li>${x}</li>`);h+='</ul>';}
  if(s.row){h+='<div class="row">';s.row.forEach(c=>h+=`<div><div class="stat">${c.stat}<small>${c.small}</small></div></div>`);h+='</div>';}
  if(s.pills){h+='<div style="margin-top:16px">';s.pills.forEach(x=>h+=`<span class="pill">${x}</span>`);h+='</div>';}
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  el.innerHTML=h;deck.appendChild(el);
});
</script>
</body>
</html>
