<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The STEM Teacher Pathway - A Live Masterclass with Naomi Meredith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF0F5;
    --panel:#FFFFFF;
    --ink:#171717;
    --muted:#5c5658;
    --rule:#EEDCE6;
    --accent:#D14084;
    --teal:#2FA98C;
    --display:'Julius Sans One', sans-serif;
    --body:'Josefin Sans', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;line-height:1.5}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;border-bottom:1px solid var(--rule);position:relative}
  .k{font-family:var(--display);letter-spacing:.22em;text-transform:uppercase;
    font-size:14px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,76px);
    line-height:1.05;letter-spacing:.01em}
  h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,52px);
    line-height:1.1;letter-spacing:.01em}
  .sub{font-size:clamp(18px,2.2vw,26px);color:var(--muted);margin-top:18px;max-width:30ch}
  .by{margin-top:40px;font-size:16px;letter-spacing:.04em;color:var(--ink)}
  .by b{color:var(--accent);font-weight:600}
  p.lead{font-size:clamp(19px,2.4vw,30px);max-width:24ch;margin-top:10px;line-height:1.35}
  ul{list-style:none;margin-top:30px;max-width:40ch}
  li{font-size:clamp(17px,2vw,23px);padding:16px 0;border-top:1px solid var(--rule);
    display:flex;gap:16px;align-items:flex-start}
  li:before{content:"";flex:0 0 12px;height:12px;margin-top:9px;background:var(--accent);
    border-radius:2px;transform:rotate(45deg)}
  .stage-year{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--teal);margin-top:14px}
  .quote{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,48px);
    line-height:1.2;max-width:22ch}
  .quote .mark{color:var(--accent)}
  .cta-card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;
    padding:48px;max-width:46ch;margin-top:8px;box-shadow:0 1px 0 var(--rule)}
  .btn{display:inline-block;margin-top:28px;background:var(--ink);color:#fff;
    font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:14px;
    padding:16px 26px;border-radius:3px;text-decoration:none}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:52ch;line-height:1.5}
  .pathbar{display:flex;gap:10px;margin-top:34px;max-width:40ch}
  .pathbar span{flex:1;height:6px;border-radius:3px;background:var(--rule)}
  .pathbar span.on{background:var(--accent)}
  .n{position:absolute;right:8vw;top:7vh;font-family:var(--display);font-size:13px;
    letter-spacing:.2em;color:var(--muted)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title', k:'A free live masterclass', h:'The STEM Teacher Pathway', sub:'Your first weeks in the lab, without the overwhelm.', by:'with Naomi Meredith, The Elementary STEM Coach'},
  {t:'promise', k:'What you will leave with', h:'By the end of this hour', list:['Know exactly what to set up in your STEM lab first','See how to run STEM stations without the chaos','Know your stage on the Pathway and your next move']},
  {t:'list', k:'Who this is for', h:'This is for you if', list:['You were a classroom teacher, and now you teach STEM','You were handed the lab and told good luck','You have plenty of activities and still feel behind']},
  {t:'big', k:'The trap', h:'More lessons is not the answer', p:'So you buy another bundle, pin another idea, and Sunday night still feels like starting from zero.'},
  {t:'big', k:'The reframe', h:'The lab is not the problem', p:'You are not short on activities. You are short on a system. The teacher is the engine, not the worksheets.'},
  {t:'part', k:'Part one', h:'Why great activities still fall apart'},
  {t:'list', k:'Part one', h:'What actually breaks down', list:['No routines, so every lesson resets to chaos','No room setup, so materials eat your time','No throughline, so nothing builds week to week']},
  {t:'part', k:'Part two', h:'The STEM Teacher Pathway'},
  {t:'stage', k:'Stage one', h:'The Investigator', year:'0 to 1 year', p:'Build systems and routines first. Set up the room, lean on ready-made lessons, and get the class working before you build anything original.', on:1},
  {t:'stage', k:'Stage two', h:'The Navigator', year:'2 to 3 years', p:'Now you customize. You run STEM stations, build on what students already know, and start writing lessons that are truly yours.', on:2},
  {t:'stage', k:'Stage three', h:'The Connector', year:'4 plus years', p:'A full year of lessons, a program the school leans on, and room to mentor the next teacher who gets handed the lab.', on:3},
  {t:'big', k:'The key', h:'You cannot skip a stage', p:'Most overwhelm comes from trying to build like a Connector while you are still an Investigator. Find your stage, then take the next step.'},
  {t:'part', k:'Part three', h:'What the first weeks look like'},
  {t:'list', k:'Set up', h:'Set up in week one', list:['A room map that makes materials reachable','STEM and STEAM anchors students actually use','A setup checklist so nothing is forgotten']},
  {t:'list', k:'Manage', h:'Run stations without chaos', list:['Small rotations, one specialist, the whole class building','Clear start and clean-up routines','Challenges matched to the stage your students are in']},
  {t:'quote', q:'Any teacher can learn to use STEM and technology in their classroom effectively.', by:'Naomi Meredith'},
  {t:'list', k:'Why me', h:'Why listen to me', list:['K-5 STEM specialist, 10 plus years in education','M.Ed. in STEM Leadership','Host of The Elementary STEM Coach podcast','I coach elementary STEM teachers around the world']},
  {t:'list', k:'Recap', h:'So, your next move', list:['Set up the room and the routines first','Run stations to manage the whole class','Find your stage on the Pathway and take one step']},
  {t:'cta', k:'Keep going', h:'Keep going with me', p:'If you want the full setup system and the Pathway mapped for your stage, STEM Teacher 101 and my STEM coaching walk you through it step by step.', btn:'Work with Naomi at naomimeredith.com', disc:'This masterclass is for educational purposes only. No specific classroom or income result is guaranteed. Results vary by teacher, school, students, and setting.'}
];
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function li(items){return '<ul>'+items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';}
function pathbar(on){var s='';for(var i=1;i<=3;i++){s+='<span class="'+(i<=on?'on':'')+'"></span>';}return '<div class="pathbar">'+s+'</div>';}
function render(){
  var out='';
  S.forEach(function(s,idx){
    var n='<div class="n">'+(idx+1)+' / '+S.length+'</div>';
    var k=s.k?'<div class="k">'+esc(s.k)+'</div>':'';
    var body='';
    if(s.t==='title'){
      body=k+'<h1>'+esc(s.h)+'</h1>'+(s.sub?'<div class="sub">'+esc(s.sub)+'</div>':'')+(s.by?'<div class="by">with <b>'+esc(s.by.replace(/^with /,''))+'</b></div>':'');
    } else if(s.t==='part'){
      body=k+'<h1>'+esc(s.h)+'</h1>';
    } else if(s.t==='promise'||s.t==='list'){
      body=k+'<h2>'+esc(s.h)+'</h2>'+li(s.list);
    } else if(s.t==='big'){
      body=k+'<h2>'+esc(s.h)+'</h2><p class="lead">'+esc(s.p)+'</p>';
    } else if(s.t==='stage'){
      body=k+'<h2>'+esc(s.h)+'</h2><div class="stage-year">'+esc(s.year)+'</div><p class="lead">'+esc(s.p)+'</p>'+pathbar(s.on);
    } else if(s.t==='quote'){
      body='<div class="quote"><span class="mark">&ldquo;</span>'+esc(s.q)+'<span class="mark">&rdquo;</span></div><div class="by">'+esc(s.by)+'</div>';
    } else if(s.t==='cta'){
      body=k+'<h2>'+esc(s.h)+'</h2><div class="cta-card"><p class="lead">'+esc(s.p)+'</p><a class="btn" href="https://naomimeredith.com">'+esc(s.btn)+'</a><div class="disc">'+esc(s.disc)+'</div></div>';
    }
    out+='<section class="slide">'+n+body+'</section>';
  });
  document.getElementById('deck').innerHTML=out;
}
render();
</script>
</body>
</html>
