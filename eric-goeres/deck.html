<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Owner's Brand Playbook · Eric Goeres, Making Business Fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4f0e8; --panel:#e9e2d4; --rule:#d8ccb8;
    --acc:#7a3140; --ink:#262321; --body:#4a453e; --dim:#8c8375; --cream:#f6f1e8;
  }
  html,body{height:100%}
  body{background:#e5ddcd;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e5ddcd}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.14;letter-spacing:.004em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Libre Caslon Display',serif;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#2c2723 0%,#1b1815 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2c2723 0%,#1b1815 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Inter',sans-serif;color:#e7ddca;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mast{position:absolute;pointer-events:none}
  .title-mast{right:8.6%;bottom:9%;width:20vw;opacity:.9}
  .corner-mast{right:8.2%;bottom:8%;width:11vw;opacity:.5}
  .brandline{font-family:'Inter',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(38,35,33,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Making Business Fun</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- masthead motif: a thin double editorial rule with a bordeaux tick, drawn in accent -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mast" viewBox="0 0 200 60">
  <g fill="none" stroke="#7a3140" stroke-width="2" stroke-linecap="round">
    <path d="M6 20 H194" opacity="0.9"/>
    <path d="M6 30 H150" opacity="0.5"/>
    <path d="M6 40 H110" opacity="0.3"/>
    <circle cx="176" cy="40" r="6" fill="#7a3140" stroke="none" opacity="0.85"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Owner’s Brand Playbook',sub:'How everyday owners build a brand that actually grows the business, using the same craft behind the big brands I ran.',brand:true,mast:'title'},
 {t:'normal',k:'Who this is for',title:'You can run the business. Building a brand that pulls people in is the part no one taught you.',body:'You are an owner whose product or service is genuinely good, and word of mouth does bring people in. But growth feels like pushing. You are the reason it works, and most days the business feels heavier than it should.'},
 {t:'dark',title:'A logo and a busy week are not a brand. A brand is the reason people choose you before they meet you.'},

 {t:'section',idx:'Part One',title:'Why Growth Feels Like Pushing'},
 {t:'normal',k:'The commodity trap',title:'When nobody can say why you are different, price becomes the only argument.',body:'If a customer cannot name in one line what you stand for, they shop you on price and convenience. You end up competing with everyone, discounting to win the sale, and working harder for thinner margins.'},
 {t:'normal',k:'The heavy business',title:'Most owners bolt marketing on at the end, so it never compounds.',body:'A post here, a promo there, a fresh logo every couple of years. None of it points the same direction, so none of it builds on the last thing. The brand lives in your head, not in a system, which is exactly why it all depends on you.'},
 {t:'dark',title:'Eliminate the pain in the business first. The money follows.'},

 {t:'section',idx:'Part Two',title:'The Owner’s Brand Playbook'},
 {t:'normal',k:'Open, from idea to launch',title:'Start from the brand, not the logo.',body:'Open is the path I take founders through: naming, positioning, the offer, the money, and the operations behind it, in that order. Same sequence whether you are starting or resetting, so the brand decisions come before the busywork instead of after it.'},
 {t:'normal',k:'The brand-relationship rule',title:'Everything you say, everywhere, either makes or breaks the relationship.',body:'Every touch is the brand talking: your sign, your reply, your packaging, your follow-up. When they all say the same thing, trust compounds. The masterclass shows you how to make them consistent on purpose, not by accident.'},
 {t:'normal',k:'Position against the obvious',title:'Own one clear idea the others in your market will not claim.',body:'Big brands win a single position and repeat it until it sticks. You will choose the one true thing only you can say, then say it the same way across everything, so people know you before they ever walk in the door.'},
 {t:'normal',k:'Score it monthly',title:'What gets scored gets built.',body:'The last piece is a simple monthly brand-health scorecard: awareness, loyalty, and the handful of numbers that tell you the brand is actually pulling weight. It turns brand from a feeling into something you run on purpose, like every other part of the business.'},
 {t:'dark',title:'Lead with the one strength that has carried you. Recognize it, develop it, and build the brand on it.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Brand Does the Work'},
 {t:'normal',k:'The owner this builds',title:'People arrive already sold, and the business stops leaning entirely on you.',body:'When the brand is clear and consistent, customers choose you before the conversation about price. Referrals get easier, marketing compounds instead of resetting, and the business feels lighter, because the brand is carrying some of the load you used to carry alone.'},
 {t:'dark',title:'The goal was never more noise. It was a business that grows without getting heavier.'},
 {t:'normal',k:'Why Eric Goeres',title:'Built brands at the top, now sized for owners like you.',body:'I ran brand strategy for names like Audi, Volvo and Virgin Atlantic, launched Road and Track and Women’s Health online, and turned businesses around as an owner myself. Making Business Fun is that same craft, made simple, for the everyday business owner.'},

 {t:'section',idx:'Your Next Step',title:'Make the Brand Do the Work'},
 {t:'normal',k:'Keep going with Eric',title:'From one clear brand idea to a business that grows on it.',body:'The masterclass is the map. Working together is where we build your Open plan, sharpen the one position only you can own, and set up the monthly scorecard, so the brand keeps pulling long after the session ends.'},
 {t:'cta',title:'Ready to build a brand that grows the business?',body:'Take the next step with Eric Goeres and Making Business Fun.',chips:['Watch the masterclass','Book a call with Eric'],disc:'Educational content for business owners. No income or business result is guaranteed. Results vary by owner, market, and effort.'},
];

const deck=document.getElementById('deck');
function mast(kind){return `<svg class="mast ${kind==='title'?'title-mast':'corner-mast'}"><use href="#mast"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Making Business <b>Fun</b> · Eric Goeres</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mast) h+=mast(s.mast);
  else if(s.t==='title') h+=mast('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
