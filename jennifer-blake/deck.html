<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Money Faucet Method - Jennifer Blake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161b1a;        /* deep slate ground, darkened from brand #525a59 */
    --panel:#222a28;     /* panel */
    --rule:#525a59;      /* brand dominant, used as rules/borders */
    --accent:#dfff04;    /* her exact CTA lime (brand ranked #3) */
    --ink:#f5f7f5;
    --muted:#aab3b0;
    --display:'League Spartan',system-ui,sans-serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  #deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:52px 48px;
    margin:0 0 22px;
    min-height:440px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);
  }
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:33px;line-height:1.1;margin-bottom:16px}
  .lede{font-size:20px;color:var(--ink);max-width:62ch}
  .sub{font-size:17px;color:var(--muted);max-width:62ch;margin-top:10px}
  ul{list-style:none;margin-top:14px}
  li{position:relative;padding-left:26px;margin:12px 0;font-size:18px;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .pillar{display:flex;gap:18px;align-items:flex-start;margin:16px 0;padding:16px 18px;background:rgba(223,255,4,.05);border-left:3px solid var(--accent);border-radius:6px}
  .pillar .num{font-family:var(--display);font-weight:800;font-size:30px;color:var(--accent);line-height:1}
  .pillar h3{font-family:var(--display);font-weight:700;font-size:21px;margin-bottom:5px}
  .pillar p{font-size:16px;color:var(--muted);max-width:56ch}
  .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.08;max-width:20ch}
  .cred{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
  .cred span{font-size:15px;color:var(--ink);background:rgba(82,90,89,.5);border:1px solid var(--rule);padding:8px 14px;border-radius:20px}
  .cta-btn{display:inline-block;margin-top:24px;font-family:var(--display);font-weight:700;font-size:19px;
    color:#1c2120;background:var(--accent);padding:15px 30px;border-radius:8px;text-decoration:none}
  .disclaimer{font-size:12.5px;color:var(--muted);margin-top:26px;max-width:66ch;line-height:1.5}
  .pgnum{position:absolute;right:22px;bottom:16px;font-family:var(--display);font-size:13px;color:var(--rule)}
  .brandline{position:absolute;right:24px;top:22px;font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title',
   kicker:'A live masterclass with Jennifer Blake',
   h1:'The Money Faucet Method',
   lede:'How to close high-ticket sales in a New York minute, without scripts, pressure, or shouting "buy my program" from the rooftops.'},

  {t:'promise',
   kicker:'The promise',
   h2:'By the end of this hour you will know how to turn selling on, like a faucet.',
   bullets:[
     'Why your revenue feels random even when your content is working.',
     'The three-part system that makes high-ticket sales predictable.',
     'How to close more deals, at higher prices, with conversations that feel good.']},

  {t:'audience',
   kicker:'Who this is for',
   h2:'You already have the attention. The sales are the part that feels random.',
   bullets:[
     'Coaches and course creators getting followers, downloads and DMs, but inconsistent revenue.',
     'Experts whose offers are great, but whose "yes" rate depends on the mood of the week.',
     'Founders who want predictable, high-ticket income they can actually turn on.']},

  {t:'trap',
   kicker:'The trap',
   h2:'You were told the fix was more.',
   lede:'More posts. More funnels. More leads. So you chase traffic and tweak your marketing again.',
   sub:'But you can pour unlimited attention into a bucket with a hole in it. The leak is not the top of the funnel. It is the conversation where interest is supposed to become a paying client.'},

  {t:'cost',
   kicker:'The hidden cost',
   h2:'A conversion leak is the most expensive problem you cannot see.',
   bullets:[
     'Every warm lead who drifts away is revenue you already paid to earn.',
     'You blame the offer, the price, the algorithm. The leak is upstream of all of them.',
     'More traffic just sends more people through the same leak, faster.']},

  {t:'reframe',
   kicker:'The reframe',
   big:'You do not have a marketing problem. You have a sales conversation problem.',
   sub:'More leads will never fix a conversion leak. The good news: the conversation is the one part of your business you can fully control.'},

  {t:'part',
   kicker:'Part one',
   h2:'Why "selling" repels the exact buyers you want.',
   bullets:[
     'High-ticket buyers do not respond to pressure, hype, or a memorized pitch.',
     'The louder you sell, the more you signal that you need the sale more than they need the result.',
     'Scripts make you sound like everyone else in the feed. Real buyers can hear the script.']},

  {t:'myth',
   kicker:'The myth',
   h2:'"I am just not a salesperson."',
   lede:'Selling is not a personality you are born with. It is a skill, and it is a conversation.',
   sub:'The people who close well are not louder or pushier than you. They have simply practiced guiding a decision instead of performing a pitch.'},

  {t:'reframe',
   kicker:'The shift',
   big:'A sale is a conversation, not a pitch.',
   sub:'In a New York minute: direct, warm, and fast. You stop performing and start guiding a decision the buyer already wants to make.'},

  {t:'method',
   kicker:'Part two: the method',
   h2:'The Money Faucet Method',
   intro:'Three pillars that turn selling from a guessing game into a faucet you can turn on.',
   pillars:[
     {n:'1',h:'Create Demand',p:'Position so the right buyers arrive already wanting what you offer. You attract clients instead of chasing them, so the pipeline stops running dry.'},
     {n:'2',h:'Design the Conversation',p:'Build the messaging, funnel and sales conversation that guides a buyer toward a decision, step by step, instead of hoping they figure it out.'},
     {n:'3',h:'Seal the Deal',p:'The close: handle the real objection, ask with confidence, and follow up in a way that feels comfortable, so opportunities become clients consistently.'}]},

  {t:'detail',
   kicker:'Pillar one',
   h2:'Create Demand',
   lede:'Attract clients who already want what you offer.',
   bullets:[
     'Say the one thing your buyer is already thinking, so the right people lean in.',
     'Make your expertise visible as a system, not a stream of random content.',
     'Build demand you can rely on, instead of launching and praying.']},

  {t:'detail',
   kicker:'Pillar two',
   h2:'Design the Conversation',
   lede:'Guide buyers toward a decision through your messaging, funnel and calls.',
   bullets:[
     'Map the path from first touch to "yes" so no warm lead falls through the cracks.',
     'Ask the questions that surface the real goal and the real hesitation.',
     'Let the buyer talk themselves toward the decision, with you steering.']},

  {t:'detail',
   kicker:'Pillar three',
   h2:'Seal the Deal',
   lede:'Turn opportunities into clients, consistently and without the ick.',
   bullets:[
     'Name the objection out loud before it becomes a silent no.',
     'Ask for the sale plainly, with the confidence the buyer is paying you for.',
     'Follow up in a way that feels human, not like a countdown timer.']},

  {t:'detail',
   kicker:'Inside the close',
   h2:'The objection is not a wall. It is the doorway.',
   bullets:[
     'Most "nos" are really an unanswered question or an unspoken fear.',
     'Say it out loud first: "the honest hesitation here is usually the price, right?"',
     'When the buyer feels understood instead of handled, the real conversation starts.']},

  {t:'detail',
   kicker:'After the call',
   h2:'The follow-up that does not feel like chasing.',
   bullets:[
     'A comfortable follow-up keeps the relationship warm without the pressure.',
     'You are not nagging. You are making it easy to say yes when they are ready.',
     'Consistency here is where most of the "lost" revenue actually comes back.']},

  {t:'picture',
   kicker:'Part three: what changes',
   h2:'What a turned-on money faucet looks like.',
   bullets:[
     'You know, before the month starts, roughly where your revenue is coming from.',
     'A "no" is information, not a gut punch. Your close rate stops swinging wildly.',
     'You raise your prices because the conversation, not a discount, carries the sale.',
     'Selling feels like your work, not the part you dread between the work.']},

  {t:'reassure',
   kicker:'One thing to know',
   h2:'Your offer is probably fine. The system around it is what is missing.',
   lede:'You do not need a new program, a bigger audience, or a different personality.',
   sub:'You need Create Demand, Design the Conversation and Seal the Deal working together, so the result you already deliver reaches the people who will pay for it.'},

  {t:'why',
   kicker:'Why learn this from Jen',
   h2:'I have spent 15+ years closing, and teaching people to close.',
   lede:'This is not theory. It is the method behind millions in sales and thousands of entrepreneurs.',
   creds:['Author, Sales in a New York Minute','Co-host, a 3M+ download sales podcast','Helped generate millions in sales','Worked with hundreds of entrepreneurs','Founder, the She Seals the Deal grant']},

  {t:'recap',
   kicker:'Recap',
   h2:'Turn the faucet on in three moves.',
   bullets:[
     'Create Demand so the right buyers arrive already wanting it.',
     'Design the Conversation so interest becomes a decision.',
     'Seal the Deal so the decision becomes consistent revenue.']},

  {t:'cta',
   kicker:'Your next step',
   h2:'Let us turn on your money faucet.',
   lede:'If you want help installing Create Demand, Design the Conversation and Seal the Deal in your business, head to jenniferblake.co and tell me about your offer. We will map it together.',
   btn:'See How We Can Work Together',
   href:'https://www.jenniferblake.co/',
   disclaimer:'This masterclass is educational. It shares the Money Faucet Method and sales principles for learning purposes. It is not a guarantee of income or results. Your outcomes depend on your offer, your market, and the work you put in. Nothing here is financial, legal, or business advice.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='';
  h+='<div class="brandline">Jennifer Blake</div>';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
  if(s.intro) h+='<p class="sub">'+s.intro+'</p>';
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li>'+b+'</li>');h+='</ul>';}
  if(s.pillars){s.pillars.forEach(p=>{h+='<div class="pillar"><div class="num">'+p.n+'</div><div><h3>'+p.h+'</h3><p>'+p.p+'</p></div></div>';});}
  if(s.creds){h+='<div class="cred">';s.creds.forEach(c=>h+='<span>'+c+'</span>');h+='</div>';}
  if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
  if(s.btn) h+='<a class="cta-btn" href="'+s.href+'">'+s.btn+'</a>';
  if(s.disclaimer) h+='<p class="disclaimer">'+s.disclaimer+'</p>';
  h+='<div class="pgnum">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
