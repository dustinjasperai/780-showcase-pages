<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>From Managing Cows to Leading People · Peggy Coffeen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f1e6; --panel:#ffffff; --rule:rgba(13,24,46,.16);
    --accent:#5b7097; --ink:#0d182e; --muted:#59688a; --tint:#9db0cf;
  }
  html,body{height:100%}
  body{background:#e4ddcc;font-family:'Source Sans 3',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e4ddcc}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .42s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Source Sans 3',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Source Serif Pro',serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:-.01em}
  .t-title h1{font-size:4.4vw;max-width:92%}
  .t-title h1 b{color:var(--accent);font-weight:700}
  .t-normal h1{font-size:3.05vw;max-width:88%}
  .t-normal .body{font-family:'Source Sans 3',sans-serif;font-size:1.5vw;color:var(--muted);margin-top:2.6vh;max-width:76%;line-height:1.6;font-weight:400}
  .sub{font-family:'Source Sans 3',sans-serif;font-size:1.6vw;color:var(--muted);margin-top:3.2vh;max-width:80%;line-height:1.55;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Source Sans 3',sans-serif;font-size:1.25vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:var(--accent);margin-top:3.6vh}
  .t-dark{background:linear-gradient(160deg,#12213c 0%,#0a1120 100%);align-items:flex-start;justify-content:center}
  .t-dark h1{font-size:3.6vw;max-width:90%;color:#f6f1e6}
  .t-dark h1 b{color:var(--tint);font-weight:700}
  .t-cta{background:linear-gradient(160deg,#12213c 0%,#0a1120 100%);align-items:flex-start}
  .t-cta h1{font-size:4vw;max-width:86%;color:#f6f1e6}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap}
  .chip{border:1.5px solid var(--tint);color:var(--tint);border-radius:100px;padding:1.3vh 1.7vw;font-family:'Source Sans 3',sans-serif;font-size:1.2vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Source Sans 3',sans-serif;font-size:.9vw;color:var(--tint);font-style:italic;line-height:1.45}
  .brandline{font-family:'Source Sans 3',sans-serif;font-size:1.3vw;color:var(--muted);margin-top:3.6vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .step-motif{position:absolute;pointer-events:none}
  .title-step{right:7%;bottom:8%;width:23vw;opacity:.9}
  .corner-step{right:6%;bottom:7%;width:10vw;opacity:.5}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(13,24,46,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--muted);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Uplevel Dairy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- "uplevel" motif: a baseline and three rising steps to a cap node at the top -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="step" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="16" y1="132" x2="244" y2="132" stroke="#0d182e" opacity="0.28"/>
    <path d="M28 132 L92 132 L92 96 L156 96 L156 60 L220 60 L220 30" stroke="#5b7097" opacity="0.95"/>
    <circle cx="220" cy="30" r="6" fill="none" stroke="#5b7097" stroke-width="3"/>
    <line x1="92" y1="132" x2="92" y2="120" stroke="#0d182e" opacity="0.4"/>
    <line x1="156" y1="96" x2="156" y2="84" stroke="#0d182e" opacity="0.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'From Managing Cows to <b>Leading People</b>',sub:'A live masterclass for dairy owners and managers whose operation has grown past what one person can run alone.',brand:true,step:'title'},
 {t:'normal',k:'Who this is for',title:'You built a dairy that works. Now it depends on you for everything.',body:'You know cows. You built something real. But the herd grew, the team grew, and every decision still runs back through you, so the days keep getting longer instead of easier.'},
 {t:'dark',title:'The problem was never the cows. The job <b>changed</b> underneath you.'},

 {t:'section',idx:'Part One',title:'The Wall Every Growing Dairy Hits'},
 {t:'normal',k:'The doer\'s trap',title:'What made you a great dairyman is now the ceiling.',body:'The hands-on instinct that built this place cannot be in every barn at once. Past a certain size, being the best worker on the farm quietly becomes the thing holding the farm back.'},
 {t:'normal',k:'The real cost',title:'When everything routes through you, the only thing that scales is the hours.',body:'Decisions stack up waiting for you. The team stands by for answers only you have. Growth stops feeling like progress and starts feeling like a heavier version of the same day.'},
 {t:'dark',title:'A bigger herd does not need more of you. It needs a <b>you that leads</b>.'},

 {t:'section',idx:'Part Two',title:'The Three Shifts'},
 {t:'normal',k:'Shift one: management',title:'Hand off the work you believe only you can do.',body:'Leading a growing dairy starts with letting go of the tasks you are best at. Decide what to hand off first, build the roles to catch it, and give people the standard to hit so the work no longer waits on you.'},
 {t:'normal',k:'Shift two: leadership',title:'A team that shows up and stays is built, not hired.',body:'Good people leave dairies where they do not feel seen. Culture, respect, and being clear about what good looks like are what keep a crew. Leadership is the difference between hiring constantly and keeping the ones you trained.'},
 {t:'normal',k:'Shift three: business',title:'Run the numbers like an owner, not only a producer.',body:'The dairy is a business and, for most families, the retirement plan too. Knowing your numbers and making decisions on purpose is what turns a hard-working operation into one that actually builds wealth.'},
 {t:'normal',k:'The family question',title:'Someday the farm has to work without you in it.',body:'When the farm is your 401(k), the next generation has to be able to afford it and run it. The succession conversation is not a someday problem. It is a leadership decision you make now, on purpose.'},
 {t:'dark',title:'Manage the work, lead the people, own the numbers. That is the <b>operator\'s job</b>.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Lead This Way'},
 {t:'normal',k:'The dairy this builds',title:'The operation runs a good day whether or not you are in the barn.',body:'Decisions get made without you. The team owns their roles and holds the standard. You finally get to work on the business, on growth and the next generation, instead of being consumed by it.'},
 {t:'dark',title:'You already have the herd and the people. <b>Leadership</b> is the upgrade.'},
 {t:'normal',k:'Why Peggy',title:'Fifteen years across the table from dairy producers.',body:'Peggy Coffeen spent nine years as an editor and podcast host at Progressive Dairy and has hosted 380-plus Uplevel Dairy episodes with the owners who made this exact shift. This masterclass is what she has learned watching them do it.'},

 {t:'section',idx:'Keep Going',title:'Make the Shift for Real'},
 {t:'normal',k:'Uplevel Dairy',title:'Go from this session to the work that makes it stick.',body:'The Uplevel Dairy podcast, the Young Leaders show, and working with Peggy are how you turn one masterclass into a dairy that leads itself, one shift at a time.'},
 {t:'cta',title:'Ready to lead the dairy you built?',chips:['Work with Peggy','Listen to Uplevel Dairy'],disc:'Educational content for dairy owners and managers. No specific financial or business outcome is guaranteed. Results vary by operation, team, and effort.'},
];

const deck=document.getElementById('deck');
function step(kind){return `<svg class="step-motif ${kind==='title'?'title-step':'corner-step'}"><use href="#step"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Uplevel <b>Dairy</b> · Peggy Coffeen</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.step) h+=step(s.step);
  else if(s.t==='title') h+=step('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
