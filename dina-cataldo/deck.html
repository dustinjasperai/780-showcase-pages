<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Time Peace Masterclass · Dina Cataldo, Be a Better Lawyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#211A18; --panel:#2C2320; --rule:#4A3A34;
    --gold:#CDB968; --rose:#C97865; --chalk:#F7F3EC; --grey:#C9BEB8; --dim:#8F827C;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Manrope',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:2.4vh}
  h1{font-family:'Lora',Georgia,serif;font-weight:600;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.7vw}
  .t-normal h1{font-size:3.2vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Manrope',sans-serif;font-size:1.4vw;font-weight:600;color:var(--rose);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#332723 0%,#0F0C0B 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:86%;font-style:italic;color:#F2E9DE}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:2.9vw;text-align:center;margin-bottom:4.6vh}
  .flowrow{display:flex;gap:1.1vw;justify-content:center;flex-wrap:wrap}
  .flowcard{background:var(--panel);border:1px solid var(--rule);border-radius:.7vw;padding:2.4vh 1.3vw;width:13vw;min-height:15vh;display:flex;flex-direction:column;gap:1vh}
  .flowcard .n{font-family:'Manrope',sans-serif;font-size:2vw;font-weight:700;color:var(--gold);line-height:1}
  .flowcard .l{font-size:1.14vw;font-weight:600;color:var(--chalk);line-height:1.25}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#382B26 0%,#100D0B 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--gold);color:#EBDCAF;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .steps-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-steps{right:7%;bottom:10%;width:16vw}
  .corner-steps{right:6%;bottom:8%;width:8vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--gold);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}.t-flow h1{font-size:4.8vw}
    .flowcard{width:26vw}.flowcard .n{font-size:4vw}.flowcard .l{font-size:2.3vw}.t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 23</div>
<div class="brand-foot">Time Peace for Lawyers™</div>
<div class="hint" id="hint">→ click or arrow keys</div>

<!-- ascending time-peace steps motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="steps" viewBox="0 0 260 110">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M20 96 H80 V66 H140 V38 H200 V14" stroke="#CDB968" opacity="0.85"/>
    <circle cx="200" cy="14" r="6" fill="none" stroke="#CDB968" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Time Peace Masterclass',sub:'How overwhelmed lawyers reclaim their time and restore their peace of mind using the 6-Step Time Peace Process.',brand:true,motif:'title'},
 {t:'normal',k:'Who this is for',title:'Lawyers who have tried every calendar hack and still feel behind.',body:'Firm owners and busy attorneys who have tried time-blocking, delegation, and the unplugged vacation, and found the overwhelm waiting for them when they got back.'},
 {t:'normal',k:'What you’ll walk away with',title:'The real reason the calendar tricks stopped working.',body:'The 6-Step Time Peace Process in one sitting: the diagnosis, the mindset shift underneath it, and the order to make the shifts in.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'Every practice and every lawyer is different. What matters is finding the version of this that fits your week.',disc:'Educational content. Nothing here is a promise of income, hours, or business results. Results vary.'},
 {t:'normal',k:'Who’s teaching this',title:'Dina Cataldo. Former criminal prosecutor, now a Master Certified Coach.',body:'Host of the Be a Better Lawyer podcast, 401 episodes, teaching lawyers to work with their minds instead of just their calendars. Creator of Time Peace for Lawyers™.'},

 {t:'section',idx:'Part One',title:'The "I Have To" Box'},
 {t:'normal',k:'The daily version',title:'The inbox says "I have to." The client says "I have to." The billable hour says "I have to."',body:'Every one of those feels like a fact. Most of them are a thought wearing a fact’s clothes.'},
 {t:'normal',k:'What you already tried',title:'Time-blocking, delegation, the vacation you still checked email on.',body:'Tactics fail here because they manage the calendar, and the calendar was never running the show.'},
 {t:'dark',title:'The calendar was never the problem. The thinking underneath it was.'},
 {t:'normal',k:'The trap, named',title:'Obligation-based thinking: every hour justified by "I have to," never chosen.',body:'When every hour is an obligation, there is no room left to ask what the day is actually for.'},

 {t:'section',idx:'Part Two',title:'Strategic Mindset'},
 {t:'normal',k:'The reframe',title:'Growth doesn’t come from adding more hours. It comes from a different mind running the week.',body:'Strategic Mindset treats the practice, and the week, as something designed on purpose rather than reacted to.'},
 {t:'dark',title:'Busy was never the same thing as at peace.'},
 {t:'normal',k:'What changes first',title:'The decision gets made before the inbox opens, not after.',body:'Once the thinking changes, the same calendar starts producing a different week without a single new app or system.'},

 {t:'section',idx:'Part Three',title:'The 6-Step Time Peace Process'},
 {t:'flow',k:'The process',title:'Six steps from overwhelmed to at peace',items:[
   {n:'01',l:'Name the "Have To"'},{n:'02',l:'Question the Obligation'},{n:'03',l:'Redesign the Week'},
   {n:'04',l:'Align Mindset to Priorities'},{n:'05',l:'Protect the Redesign'},{n:'06',l:'Practice in Peace'}]},
 {t:'normal',k:'Steps 1 and 2',title:'Name the thought before you manage the task.',body:'Every "I have to" gets said out loud, then questioned: is this actually true, or is it the box talking?'},
 {t:'normal',k:'Steps 3 and 4',title:'Redesign the week, then align the mindset that has to hold it.',body:'A new calendar without a new mindset snaps back in a week. Time Peace does both, in order.'},
 {t:'normal',k:'Steps 5 and 6',title:'Protect the redesign, then practice from a place of peace, not survival.',body:'The last step is not a finish line. It is the week you already redesigned, running without the "have to."'},
 {t:'dark',title:'Every lawyer with time peace started as a lawyer who decided the box was optional.'},

 {t:'section',idx:'Where to go next',title:'Two Paths From Here'},
 {t:'normal',k:'Group or one-on-one',title:'Time Peace for Lawyers™, or private coaching, depending on what you need next.',body:'Time Peace for Lawyers™ runs the full process with weekly live coaching calls and a community of lawyers doing it together. Private coaching goes one-on-one on growing the practice itself, with more ease, not more hours.'},
 {t:'cta',title:'Reclaim your time. Restore your peace.',chips:['Book a Strategy Session'],disc:'Educational content only. No income, hours, or business result is guaranteed. Results vary by attorney and practice.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="steps-motif ${kind==='title'?'title-steps':'corner-steps'}"><use href="#steps"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Time Peace for <b>Lawyers™</b> · Dina Cataldo</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
