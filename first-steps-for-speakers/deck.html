<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Local Six-Figure Speaker: a masterclass with Kevin Bracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f5efe0;        /* their body cream */
    --panel:#efe7d4;     /* half-step card */
    --panel-2:#ffffff;
    --ink:#232323;       /* their link/button text */
    --ink-soft:#4a4335;
    --ink-muted:#857a63;
    --gold:#ffce2e;      /* their button/link fill - greatness gold */
    --gold-deep:#e0a500;
    --rule:#ddd2b6;
  }
  html,body{height:100%;}
  body{
    font-family:'Lato',-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  #stage{width:100vw;height:100vh;position:relative;}
  .slide{
    position:absolute;inset:0;display:none;
    flex-direction:column;justify-content:center;
    padding:7vh 9vw;
  }
  .slide.active{display:flex;}
  .kicker{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(11px,1.3vw,15px);
    letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:22px;}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(34px,6.2vw,76px);
    line-height:1.04;letter-spacing:-.015em;color:var(--ink);margin-bottom:26px;}
  h2{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(26px,4.2vw,52px);
    line-height:1.1;letter-spacing:-.01em;color:var(--ink);margin-bottom:22px;}
  p{font-size:clamp(17px,2vw,25px);line-height:1.5;color:var(--ink-soft);max-width:30ch;}
  p.wide{max-width:40ch;}
  .lede{font-size:clamp(19px,2.3vw,30px);color:var(--ink-soft);max-width:34ch;}
  .sub{font-size:clamp(16px,1.9vw,23px);color:var(--ink-muted);margin-top:14px;max-width:38ch;}
  ul{list-style:none;margin-top:10px;}
  li{font-size:clamp(16px,1.9vw,24px);line-height:1.45;color:var(--ink-soft);
    padding-left:30px;position:relative;margin-bottom:16px;max-width:36ch;}
  li::before{content:"";position:absolute;left:0;top:.62em;width:12px;height:12px;
    background:var(--gold);border-radius:2px;transform:rotate(45deg);}
  .big{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(44px,9vw,120px);
    color:var(--gold-deep);line-height:.95;}
  .phase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:16px;max-width:1100px;}
  .card{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:26px 24px;}
  .card .n{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--gold-deep);font-size:14px;letter-spacing:.14em;}
  .card h3{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(18px,2vw,24px);margin:8px 0 10px;color:var(--ink);}
  .card p{font-size:clamp(14px,1.5vw,18px);max-width:none;color:var(--ink-soft);}
  .quote{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(22px,3.4vw,42px);
    line-height:1.2;color:var(--ink);max-width:24ch;}
  .who{margin-top:2px;font-size:clamp(14px,1.5vw,18px);color:var(--ink-muted);font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:.04em;}
  .proof-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:18px;max-width:1150px;}
  .disc{font-size:clamp(12px,1.3vw,15px);color:var(--ink-muted);max-width:60ch;margin-top:30px;line-height:1.5;}
  .title-wrap{max-width:22ch;}
  .byline{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:.06em;color:var(--ink);
    margin-top:30px;font-size:clamp(15px,1.7vw,21px);}
  .byline span{color:var(--gold-deep);}
  .cta-box{background:var(--ink);color:var(--bg);border-radius:14px;padding:4vh 4vw;max-width:30ch;}
  .cta-box h2{color:var(--bg);}
  .cta-box p{color:#e8dcc2;max-width:none;}
  .cta-pill{display:inline-block;background:var(--gold);color:var(--ink);font-family:'Montserrat',sans-serif;
    font-weight:800;padding:14px 26px;border-radius:999px;margin-top:22px;font-size:clamp(15px,1.8vw,21px);}
  .bar{position:fixed;bottom:0;left:0;height:5px;background:var(--gold);transition:width .25s;z-index:5;}
  .nav{position:fixed;bottom:16px;right:22px;font-family:'Montserrat',sans-serif;font-weight:700;
    font-size:13px;color:var(--ink-muted);z-index:5;}
  .hint{position:fixed;bottom:16px;left:22px;font-family:'Montserrat',sans-serif;font-size:12px;color:var(--ink-muted);z-index:5;letter-spacing:.04em;}
  @media(max-width:720px){.phase-grid,.proof-grid{grid-template-columns:1fr;gap:14px;}p,li,.lede{max-width:none;}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar" id="bar"></div>
<div class="nav" id="nav"></div>
<div class="hint">← → to move</div>
<script>
const S=[
  {t:'title',kicker:'A free masterclass with Kevin Bracy',h1:'The Local Six-Figure Speaker',sub:'How to turn your story into a paid speaking business in your own town. Five hours a week. No travel. No stage experience required.',byline:true},

  {t:'who',kicker:'Who this is for',h2:'You already have the part that matters.',who:'THIS IS FOR YOU IF',list:['You have a story or a message people need to hear','You have a full-time job and about five hours a week','You want to speak and get paid, close to home','You have never been booked for a paid gig in your life']},

  {t:'point',kicker:'The trap',h2:'The lie that keeps good speakers broke.',p:'You have been told you need to quit your job, fly across the country, and already be famous before anyone will pay you to speak.',sub:'So you wait. You polish the talk nobody has booked. The message that could change your community stays in your notes app.'},

  {t:'quote',kicker:'The reframe',quote:'The stage you are waiting for is already in your town. The problem was never your talent. It was never having a system.'},

  {t:'part',kicker:'Part one',big:'01',h2:'Why local is the fastest money in speaking.'},

  {t:'point',kicker:'The core problem',h2:'Everyone chases the keynote fantasy.',p:'National keynote fees look huge, so aspiring speakers aim there first and book nothing for years.',sub:'Meanwhile schools, churches, service clubs, chambers, and companies in your own city are paying local speakers every single week. That is the lane nobody teaches, and it is wide open.'},

  {t:'part',kicker:'Part two',big:'02',h2:'The method: Art, Business, Commitment.'},

  {t:'phases',kicker:'The three-phase system',h2:'What the program actually walks you through.',cards:[
    {n:'PHASE 1',h:'The Art',p:'The six components of a talk that moves a room and builds trust fast, so people believe you before you ever mention a fee.'},
    {n:'PHASE 2',h:'The Business',p:'The four cash-flow types of a local speaking business and exactly how the bookings come in.'},
    {n:'PHASE 3',h:'The Commitment',p:'The daily disciplines and mindset that keep you booking, built around the Daily Dozen.'}]},

  {t:'point',kicker:'Phase one: the Art',h2:'A talk is built, not winged.',p:'Most new speakers improvise and hope. We break a paid talk into six components you can assemble on purpose.',sub:'When the structure is right, a room full of strangers trusts you in the first five minutes. That trust is what gets you rebooked and referred.'},

  {t:'point',kicker:'Phase two: the Business',h2:'Four ways a local speaker gets paid.',p:'Keynote fees are only one of four cash-flow types. Most beginners only know that one, so their income stops the moment the talk ends.',sub:'We map all four so a single booking can turn into several paydays from the same room.'},

  {t:'point',kicker:'Phase three: the Daily Dozen',h2:'Doubt is handled daily, not someday.',p:'The reason capable speakers quit is not talent. It is the doubt that creeps in between bookings.',sub:'The Daily Dozen is a short daily set of goal-focused actions that keeps you moving when you cannot yet see the next stage.'},

  {t:'point',kicker:'Getting booked from zero',h2:'The 4 To Get Your Foot In The Door.',p:'When you have no speaking resume, you need a way in. There are four of them, and they work in any town.',sub:'This is how a first-timer books a paid local gig in weeks instead of waiting years to be discovered.'},

  {t:'part',kicker:'Part three',big:'03',h2:'What your first 90 days look like.'},

  {t:'point',kicker:'The first 90 days',h2:'From notes app to paid stage.',p:'A working professional putting in five focused hours a week can have a built talk and real outreach going inside the first month.',sub:'The goal is simple and concrete: your first booked, paid, local engagement, then a repeatable way to land the next one.'},

  {t:'point',kicker:'Why learn this from me',h2:'22 years, and 200-plus speakers later.',p:'I have spoken to millions, from high-school gyms to AT&T Park to a broadcast seen by 460,000 people. I was mentored by Les Brown.',sub:'More to the point, I have personally coached and graduated more than 200 speakers from the ground up. This is the exact path I walk them down.'},

  {t:'quote',kicker:'Scared Great',quote:'Fear does not disappear before you take the stage. You learn to steer it toward greatness.'},

  {t:'proof',kicker:'What students have done',h2:'Real results from the program.',cards:[
    {n:'JOHN H.',h:'Raised his fees',p:'Set his fees with confidence and raised his corporate rate to the $10,000 mark.'},
    {n:'TREY G.',h:'Booked in weeks',p:'Landed multiple paid engagements in less than two months.'},
    {n:'TARA W.',h:'Paid in month two',p:'Booked paid speaking engagements during her second month of coaching.'}]},

  {t:'cta',kicker:'Your first step',h2:'First Steps for Speakers.',p:'The full program: the three-phase method, the Daily Dozen, the four ways to get paid, 39 videos, scripts and templates, a private community, and weekly group calls with me.',pill:'Start your local speaking business',disc:'Educational program only. Results shown are individual student experiences and are not typical or guaranteed; your results will vary and depend on your own effort, market, and circumstances. Nothing here is a promise of income.'}
];

const stage=document.getElementById('stage');
function slideHTML(s){
  if(s.t==='title')return `<div class="title-wrap"><div class="kicker">${s.kicker}</div><h1>${s.h1}</h1><p class="sub">${s.sub}</p><div class="byline">with <span>Kevin Bracy</span> &middot; Coach Greatness</div></div>`;
  if(s.t==='who')return `<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><div class="who">${s.who}</div><ul>${s.list.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(s.t==='point')return `<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><p class="lede">${s.p}</p><p class="sub">${s.sub}</p>`;
  if(s.t==='quote')return `<div class="kicker">${s.kicker}</div><div class="quote">${s.quote}</div>`;
  if(s.t==='part')return `<div class="kicker">${s.kicker}</div><div class="big">${s.big}</div><h2 style="margin-top:14px">${s.h2}</h2>`;
  if(s.t==='phases')return `<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><div class="phase-grid">${s.cards.map(c=>`<div class="card"><div class="n">${c.n}</div><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')}</div>`;
  if(s.t==='proof')return `<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><div class="proof-grid">${s.cards.map(c=>`<div class="card"><div class="n">${c.n}</div><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')}</div>`;
  if(s.t==='cta')return `<div class="cta-box"><div class="kicker" style="color:var(--gold)">${s.kicker}</div><h2>${s.h2}</h2><p>${s.p}</p><div class="cta-pill">${s.pill}</div></div><div class="disc">${s.disc}</div>`;
  return '';
}
let i=0;
function render(){
  stage.innerHTML='';
  S.forEach((s,idx)=>{const d=document.createElement('div');d.className='slide'+(idx===i?' active':'');d.innerHTML=slideHTML(s);stage.appendChild(d);});
  document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
  document.getElementById('nav').textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
stage.addEventListener('click',()=>go(1));
render();
</script>
</body>
</html>
