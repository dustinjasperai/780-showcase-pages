<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Retention Engine - A Masterclass with Tiffany Henderson</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf6f8; --panel:#ffffff; --rule:#f0dbe6;
    --accent:#e8357a; --accent2:#9297b9; --ink:#1a1a1a; --dim:#6b6670;
    --head:'Poppins',system-ui,sans-serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
  #stage{position:relative;height:100vh;width:100vw;display:flex;align-items:center;justify-content:center}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7vh 9vw;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .kick{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:clamp(11px,1.1vw,14px);color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;line-height:1.04;font-size:clamp(34px,6.2vw,76px);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;line-height:1.1;font-size:clamp(28px,4.6vw,54px);letter-spacing:-.01em}
  p.lead{font-size:clamp(17px,1.9vw,24px);line-height:1.5;max-width:60ch;margin-top:22px;color:#2b2730}
  p.sub{font-size:clamp(15px,1.5vw,19px);line-height:1.55;max-width:58ch;margin-top:16px;color:var(--dim)}
  ul{margin-top:26px;max-width:62ch;list-style:none}
  li{font-size:clamp(16px,1.7vw,22px);line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px dashed var(--rule)}
  li:before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;background:var(--accent);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  li b{font-family:var(--head);font-weight:600}
  .big{font-size:clamp(30px,4.4vw,56px);font-family:var(--head);font-weight:600;line-height:1.14;max-width:20ch}
  .big .a{color:var(--accent)}
  .star{width:46px;height:46px;background:var(--accent);margin-bottom:26px;
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .pillar-no{font-family:var(--head);font-weight:700;font-size:clamp(50px,9vw,120px);color:var(--accent2);line-height:.9}
  .present{margin-top:38px;font-family:var(--head);font-weight:600;font-size:clamp(15px,1.5vw,19px)}
  .present span{display:block;color:var(--dim);font-family:var(--body);font-weight:400;font-size:.8em;margin-top:4px}
  .stat{font-family:var(--head);font-weight:700;color:var(--accent);font-size:clamp(40px,7vw,92px);line-height:1}
  .disc{margin-top:28px;font-size:13px;color:var(--dim);max-width:66ch;line-height:1.5}
  .cta-line{display:inline-block;margin-top:26px;font-family:var(--head);font-weight:600;
    font-size:clamp(17px,1.9vw,24px);color:#fff;background:var(--accent);padding:14px 26px;border-radius:40px}
  #bar{position:fixed;left:0;bottom:0;height:5px;background:var(--accent);width:0;transition:width .3s}
  #nav{position:fixed;right:22px;bottom:18px;font-family:var(--head);font-size:13px;color:var(--dim);user-select:none}
  .grid2{display:flex;gap:40px;flex-wrap:wrap;margin-top:24px}
  .grid2 .cell{flex:1 1 240px;border-top:3px solid var(--accent2);padding-top:14px}
  .grid2 .cell h3{font-family:var(--head);font-weight:600;font-size:clamp(17px,1.8vw,22px)}
  .grid2 .cell p{color:var(--dim);font-size:clamp(14px,1.4vw,17px);margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div id="nav"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass for studio owners',
    h:'The Retention Engine',
    lead:'How positive psychology keeps dance families enrolled for a decade, not a season.',
    present:'Tiffany Henderson', presentSub:'Founder, Twinkle Star Dance. Owner of Tiffany’s Dance Academy (8 locations, 2,500+ students). UPenn Master of Applied Positive Psychology.'},

  {t:'whofor', kick:'Who this is for',
    h:'If September feels like starting over',
    lead:'This is for studio owners who can fill a season but watch a third of it walk by spring, and who are tired of buying enrollment back with another discount.'},

  {t:'promise', kick:'What you will leave with',
    h:'Three things, today',
    items:['<b>Why families actually leave,</b> and why it is almost never the price.',
           '<b>The four-pillar class design</b> that engineers a reason to come back.',
           '<b>A strengths-based way to run your studio</b> that keeps staff and parents on your side.']},

  {t:'trap', kick:'The trap',
    h:'The discount treadmill',
    lead:'When retention dips, the reflex is a promo. It works for a month, trains families to wait for the next deal, and quietly tells your team that the studio competes on price. The hole it fills gets deeper every season.'},

  {t:'reframe',
    big:'Enrollment is not a marketing problem. It is a <span class="a">belonging</span> problem.'},

  {t:'part', kick:'Part one', h:'Why families really leave'},

  {t:'problem', kick:'The real reasons',
    h:'It is rarely the tuition',
    items:['The child cannot name one friend in class.',
           'The parent never sees what their child is actually learning.',
           'A hard month arrives and nothing anchors them to staying.',
           'The studio felt like a transaction, so leaving feels like one too.']},

  {t:'insight', kick:'The shift',
    stat:'10 years',
    lead:'The studios that keep a family for a decade are not the cheapest or the flashiest. They are the ones where a child feels known. Belonging is built on purpose, in the room, every single week.'},

  {t:'part', kick:'Part two', h:'The Twinkle Star Method'},

  {t:'pillar', no:'01', kick:'Pillar one', h:'Skill Building',
    sub:'Foundational technique, sequenced so a two-year-old and a pre-teen both leave each class a little more capable than they walked in. Visible progress is the first reason a parent re-enrolls.'},

  {t:'pillar', no:'02', kick:'Pillar two', h:'Center Movement',
    sub:'Group combinations before choreography. Children learn to move as one, which is where the friendships form. A child with a friend in the room does not quit.'},

  {t:'pillar', no:'03', kick:'Pillar three', h:'Just For Fun',
    sub:'Themed, story-driven activities engineered for retention. This is the pillar most studios skip and the one that turns a Tuesday class into the highlight of a child’s week.'},

  {t:'pillar', no:'04', kick:'Pillar four', h:'Showtime',
    sub:'Recital themes, choreography and costume guidance that let every family see the payoff in public. The stage is where the decision to stay another year is quietly made.'},

  {t:'strengths', kick:'The engine underneath',
    h:'Character Strengths Coaching',
    lead:'Built on the VIA Character Strengths and applied positive psychology. Instead of managing problems, you build on what is already strong in each child, each teacher and each parent relationship. Strength-spotting is a retention tool disguised as kindness.'},

  {t:'part', kick:'Part three', h:'What a retention-first studio looks like'},

  {t:'first6', kick:'The first six weeks',
    h:'Belonging, by design',
    grid:[['Week 1', 'Every child is greeted by name and placed with one peer anchor.'],
          ['Weeks 2-4', 'Parents receive one specific thing their child learned, not a newsletter.'],
          ['Weeks 5-6', 'A strength is named out loud for each child, in front of a grown-up who matters.']]},

  {t:'culture', kick:'Your team',
    h:'A culture that keeps teachers, too',
    lead:'The same strengths lens that keeps families keeps staff. Teachers who are coached on what they do well stay longer, and studios do not lose families to a beloved teacher walking out the door.'},

  {t:'whyme', kick:'Why trust this',
    h:'This is not theory',
    items:['<b>8 studio locations</b> and <b>2,500+ students</b> run on this method every week.',
           '<b>300+ studios</b> across four countries license the Twinkle Star curriculum.',
           '<b>A UPenn MAPP</b> grounds it in the science of how belonging actually works.']},

  {t:'recap', kick:'The whole thing in one line',
    big:'Teach the skill. Build the friendship. Name the <span class="a">strength</span>. Keep the family.'},

  {t:'cta', kick:'Your next step',
    h:'Bring the Retention Engine to your studio',
    lead:'If you want a clear read on where your studio is leaking families and what to do about it, the next step is a Report Card With Tiffany: a structured review of your enrollment, retention and studio culture.',
    ctaLine:'Apply for a Report Card With Tiffany',
    disc:'Educational only. No specific enrollment, retention or revenue result is guaranteed. Results vary by studio, market and effort.'}
];

const stage = document.getElementById('stage');
function slideHTML(s){
  if(s.t==='title') return `<div class="star"></div><div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p><div class="present">${s.present}<span>${s.presentSub}</span></div>`;
  if(s.t==='reframe'||s.t==='recap') return `<div class="star"></div><div class="big">${s.big}</div>`;
  if(s.t==='part') return `<div class="kick">${s.kick}</div><h1>${s.h}</h1>`;
  if(s.t==='pillar') return `<div class="kick">${s.kick}</div><div class="pillar-no">${s.no}</div><h2 style="margin-top:10px">${s.h}</h2><p class="sub">${s.sub}</p>`;
  if(s.t==='insight') return `<div class="kick">${s.kick}</div><div class="stat">${s.stat}</div><p class="lead">${s.lead}</p>`;
  if(s.t==='first6') return `<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="grid2">${s.grid.map(c=>`<div class="cell"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>`;
  if(s.items) return `<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(s.t==='cta') return `<div class="star"></div><div class="kick">${s.kick}</div><h2>${s.h}</h2><p class="lead">${s.lead}</p><div><span class="cta-line">${s.ctaLine}</span></div><p class="disc">${s.disc}</p>`;
  return `<div class="kick">${s.kick||''}</div><h2>${s.h||''}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:''}`;
}
stage.innerHTML = S.map((s,i)=>`<section class="slide" data-i="${i}">${slideHTML(s)}</section>`).join('');
const slides=[...document.querySelectorAll('.slide')];
let cur=0;
function show(n){cur=Math.max(0,Math.min(slides.length-1,n));slides.forEach((el,i)=>el.classList.toggle('on',i===cur));
  document.getElementById('bar').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('nav').textContent=(cur+1)+' / '+slides.length;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
stage.addEventListener('click',e=>{show(cur + (e.clientX < innerWidth*0.3 ? -1 : 1));});
show(0);
</script>
</body>
</html>
