<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Strategic Book - a masterclass with Kelly Irving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f0;
  --panel:#fffdf9;
  --ink:#00003c;
  --accent:#ffe64b;
  --orange:#f68d21;
  --rule:#dddddd;
  --dim:#333333;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Mulish',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#stage{position:relative;width:min(96vw,1180px);aspect-ratio:16/9;background:var(--panel);
  border:1px solid var(--rule);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,60,.14);
  overflow:hidden}
.slide{position:absolute;inset:0;padding:8% 9%;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:clamp(11px,1.4vw,15px);font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);margin-bottom:22px}
h1{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:clamp(34px,6.4vw,78px);line-height:1.02;letter-spacing:-.01em}
h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:clamp(26px,4.4vw,54px);line-height:1.08;letter-spacing:-.01em}
.lead{font-size:clamp(16px,2.3vw,29px);line-height:1.5;color:var(--dim);margin-top:26px;max-width:46ch}
.big{font-family:'Newsreader',Georgia,serif;font-size:clamp(24px,4.2vw,50px);line-height:1.16;font-weight:500;max-width:20ch}
mark{background:linear-gradient(180deg,transparent 58%,var(--accent) 58% 92%,transparent 92%);color:inherit;padding:0 .04em}
.sub{margin-top:24px;font-size:clamp(15px,2vw,24px);color:var(--dim);line-height:1.5;max-width:44ch}
.by{margin-top:auto;padding-top:26px;font-size:clamp(13px,1.6vw,19px);font-weight:700;color:var(--ink)}
.by span{color:var(--dim);font-weight:400}
.num{font-family:'Newsreader',serif;font-style:italic;color:var(--orange);font-size:clamp(15px,2vw,22px);margin-bottom:14px;display:block}
.pill{display:inline-block;font-size:clamp(11px,1.4vw,14px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--accent);padding:8px 16px;border-radius:100px;align-self:flex-start;margin-bottom:24px}
.flag{width:56px;height:4px;background:var(--orange);border-radius:3px;margin:22px 0 0}
.section-lead{font-family:'Newsreader',serif;font-size:clamp(18px,2.4vw,30px);color:var(--dim);margin-top:20px;max-width:40ch;line-height:1.4}
.disc{margin-top:22px;font-size:clamp(11px,1.4vw,15px);color:var(--dim);line-height:1.5;max-width:52ch}
.cta-line{font-size:clamp(16px,2.2vw,27px);color:var(--ink);font-weight:700;margin-top:22px;max-width:34ch;line-height:1.4}
.nav{position:absolute;bottom:18px;right:24px;display:flex;gap:10px;align-items:center;z-index:5}
.nav button{font:inherit;font-weight:700;border:1px solid var(--rule);background:var(--bg);color:var(--ink);
  border-radius:100px;padding:8px 16px;cursor:pointer}
.nav button:hover{background:var(--accent)}
.count{position:absolute;bottom:24px;left:28px;font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.08em;z-index:5}
.dots{position:absolute;top:20px;right:26px;display:flex;gap:6px;z-index:5}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--orange)}
</style>
</head>
<body>
<div id="stage">
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
  <div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
</div>
<script>
const S=[
 {t:'title', eyebrow:'A live masterclass', h:"The <mark>Strategic</mark> Book", lead:"How to write a book that grows your business, not one that just sits on a shelf.", by:"Kelly Irving <span>| Book coach, editor, and founder of the Expert Author Community</span>"},
 {t:'promise', eyebrow:'What you will leave with', h2:"One hour. One clear book.", sub:"How to choose, validate and structure the ONE book that builds your authority and brings you clients, before you write a single chapter."},
 {t:'whofor', eyebrow:'Who this is for', big:"For experts and founders who know there is a book in them, and are tired of watching it stay unwritten.", flag:true},
 {t:'trap', eyebrow:'The trap', big:"You finally start writing, pour in months, and end up with a book that says <mark>everything</mark> and sells nothing.", flag:true},
 {t:'reframe', eyebrow:'An uncomfortable truth', h2:"Most experts write the <mark>wrong</mark> book.", sub:"Not a bad book. The wrong one. Written to be finished, not to do a job for the reader or the business."},
 {t:'section', num:'Part One', h2:"Why most business books fail", sectionlead:"It is almost never the writing. It is the thinking that came before it."},
 {t:'point', num:'01', h2:"A book has to do two jobs at once.", sub:"It has to work for your business AND change your reader. Most books pick one and quietly fail at both."},
 {t:'point', num:'02', h2:"The real mistake is rushing to write.", sub:"You cannot outline your way out of a weak idea. Validate the idea first, or you will rewrite it for a year."},
 {t:'section', num:'Part Two', h2:"The Write Book Method", sectionlead:"Where business strategy and reader transformation are built to co-exist. Macro and micro. Big-picture strategy with editorial craft."},
 {t:'pillar', pill:'Pillar 1', h2:"The Book Screen Canvas", sub:"Find and validate your best idea before you draft. Is it commercially viable? Who is the reader, and how do they change by the last page?"},
 {t:'pillar', pill:'Pillar 2', h2:"The strategic spine", sub:"Every chapter earns its place by moving the reader and serving the business. No filler. Not everything you know, only what the book needs."},
 {t:'pillar', pill:'Pillar 3', h2:"The Write Fast Formula", sub:"A five-step structure to outline any chapter in under fifteen minutes, so the writing stops going around in circles."},
 {t:'section', num:'Part Three', h2:"The difference it makes", sectionlead:"The same expert, the same knowledge, a completely different result."},
 {t:'point', num:'03', h2:"An idea validated in an afternoon.", sub:"A structure you can see. Chapters that draft in hours, not weekends lost to the blank page."},
 {t:'point', num:'04', h2:"A book that makes you the obvious choice.", sub:"More credibility, more visibility, and the standing to charge what you are actually worth."},
 {t:'whyme', eyebrow:'Why listen to me', h2:"I help experts write books that matter.", sub:"I have coached authors on more than twenty published business books, from Deep Listening to Career Leap. I missed the memo that business books had to be boring."},
 {t:'recap', eyebrow:'The strategic book, in one line', big:"Validate first. Write to transform. Plant a <mark>flag in the ground</mark> that grows your business for years.", flag:true},
 {t:'next', eyebrow:'Your next step', h2:"Make sure it is the right book, first.", sub:"If you know your book matters, the worst thing you can do is start writing before the idea is right and the structure is set."},
 {t:'invite', eyebrow:'When you are ready', h2:"Let's map your book together.", sub:"The Expert Author Community blends live group coaching, a proven framework and a room of people writing alongside you. It opens only a few times a year."},
 {t:'cta', eyebrow:'Take the next step', ctaline:"Book a clarity call with Kelly, or join the Expert Author Community when the doors next open.", disc:"This masterclass is educational. No specific business result, book sale or income is guaranteed. Results vary with your idea, your market and the work you put in."}
];
const stage=document.getElementById('stage');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
function render(){
  document.querySelectorAll('.slide').forEach(s=>s.remove());
  const s=S[i];
  const el=document.createElement('div');
  el.className='slide on';
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num && s.t==='section') h+=`<span class="num">${s.num}</span>`;
  if(s.pill) h+=`<div class="pill">${s.pill}</div>`;
  if(s.num && s.t!=='section') h+=`<span class="num">${s.num}</span>`;
  if(s.h) h+=`<h1>${s.h}</h1>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.big) h+=`<div class="big">${s.big}</div>`;
  if(s.flag) h+=`<div class="flag"></div>`;
  if(s.sectionlead) h+=`<div class="section-lead">${s.sectionlead}</div>`;
  if(s.lead) h+=`<div class="lead">${s.lead}</div>`;
  if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
  if(s.ctaline) h+=`<div class="cta-line">${s.ctaline}</div>`;
  if(s.by) h+=`<div class="by">${s.by}</div>`;
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  el.innerHTML=h;
  stage.insertBefore(el,stage.firstChild);
  count.textContent=(i+1)+' / '+S.length;
  dots.innerHTML=S.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
stage.addEventListener('click',e=>{if(e.target.closest('.nav'))return;const r=stage.getBoundingClientRect();(e.clientX-r.left)/r.width>0.4?go(1):go(-1);});
render();
</script>
</body>
</html>
