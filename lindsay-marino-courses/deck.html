<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Full-Time Medium — A Masterclass with Lindsay Marino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#f5eeea;        /* her warm blush ground */
    --panel:#fffaf7;     /* lifted warm white */
    --ink:#38383b;       /* her near-black heading color */
    --ink-soft:#56535a;
    --ink-mute:#8a8188;
    --accent:#92dddb;    /* her soft teal */
    --accent-deep:#5bb8b6;
    --rule:#e6dcd4;
  }
  html,body{height:100%;}
  body{
    font-family:'Poppins',-apple-system,sans-serif;
    background:var(--ink);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100vw; height:100vh;
    max-width:1280px; max-height:720px;
    aspect-ratio:16/9;
    background:var(--bg);
    overflow:hidden;
  }
  .slide{
    position:absolute; inset:0;
    padding:64px 84px;
    display:none;
    flex-direction:column;
    justify-content:center;
  }
  .slide.active{ display:flex; }
  .kicker{
    font-size:13px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent-deep); margin-bottom:22px;
  }
  h1{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600; font-size:76px; line-height:1.03; letter-spacing:-.01em;
    color:var(--ink); margin-bottom:24px;
  }
  h2{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600; font-size:52px; line-height:1.08; color:var(--ink); margin-bottom:22px;
  }
  .lede{ font-size:23px; font-weight:300; line-height:1.5; color:var(--ink-soft); max-width:60ch; }
  .sub{ font-size:19px; font-weight:300; line-height:1.55; color:var(--ink-soft); max-width:62ch; }
  .part-no{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:30px; color:var(--accent-deep); margin-bottom:10px; }
  ul{ list-style:none; margin-top:14px; }
  li{ font-size:21px; font-weight:300; color:var(--ink-soft); padding:12px 0 12px 30px; position:relative; border-bottom:1px solid var(--rule); max-width:58ch; }
  li:last-child{ border-bottom:none; }
  li::before{ content:""; position:absolute; left:0; top:21px; width:12px; height:12px; border-radius:50%; background:var(--accent); }
  .pillar-tag{ display:inline-block; font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-deep); margin-bottom:16px; }
  .big-quote{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:46px; line-height:1.18; color:var(--ink); max-width:24ch; }
  .accent-rule{ width:72px; height:3px; background:var(--accent); margin:0 0 28px; }
  .note{ font-size:15px; color:var(--ink-mute); margin-top:26px; max-width:58ch; font-weight:300; }
  .center{ align-items:center; text-align:center; }
  .center .lede, .center .sub{ margin-left:auto; margin-right:auto; }
  .center .accent-rule{ margin-left:auto; margin-right:auto; }
  .cta-step{ font-size:24px; font-weight:500; color:var(--ink); margin:8px 0; }
  .brandline{ position:absolute; bottom:30px; left:84px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); }
  .pagenum{ position:absolute; bottom:30px; right:84px; font-size:13px; color:var(--ink-mute); font-variant-numeric:tabular-nums; }
  .disclaimer{ font-size:13px; color:var(--ink-mute); margin-top:22px; max-width:66ch; font-weight:300; line-height:1.5; }
  #nav{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:20; }
  #nav button{ background:rgba(255,255,255,.14); color:#fff; border:none; width:38px; height:34px; border-radius:7px; font-size:16px; cursor:pointer; }
  #nav button:hover{ background:rgba(255,255,255,.28); }
  @media (max-width:760px){
    h1{ font-size:44px; } h2{ font-size:34px; } .slide{ padding:34px 30px; }
    .lede{ font-size:18px; } li{ font-size:17px; } .big-quote{ font-size:30px; }
    .brandline,.pagenum{ left:30px; right:30px; bottom:16px; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev" aria-label="Previous">&#8249;</button><button id="next" aria-label="Next">&#8250;</button></div>
<script>
const BRAND = "The Full-Time Medium &middot; Lindsay Marino";
const S = [
  {t:'title', html:`
    <div class="kicker">A free masterclass with Lindsay Marino</div>
    <h1>The Full-Time<br>Medium</h1>
    <p class="lede">How to turn your gift into a practice that actually pays the bills, without feeling salesy and without burning yourself out.</p>`},

  {t:'who', html:`
    <div class="accent-rule"></div>
    <h2>This is for you if...</h2>
    <ul>
      <li>You can read, and people feel it, but your calendar swings between fully booked and crickets.</li>
      <li>You still feel a little guilty charging what a reading is worth.</li>
      <li>You are doing this part time and quietly wondering if full time is even possible.</li>
    </ul>`},

  {t:'trap', html:`
    <div class="kicker">The quiet trap</div>
    <h2>You were trained to read.<br>Nobody trained you to run the business.</h2>
    <p class="sub">So the gift grows and the business stays small. You pour yourself into every sitter, then stare at an empty week and wonder what you are doing wrong. Nothing is wrong with your mediumship. The gap is everything that happens around it.</p>`},

  {t:'reframe', html:`
    <div class="big-quote">"Being a gifted medium and running a thriving medium business are two completely different skills."</div>
    <p class="note">One you have spent years developing. The other nobody ever sat you down and taught. That second skill is what this hour is about.</p>`},

  {t:'part', html:`
    <div class="part-no">Part One</div>
    <h2>Why talented mediums stay stuck</h2>
    <p class="sub">It is almost never the ability. It is three invisible leaks that drain a gifted medium's income and energy at the same time.</p>`},

  {t:'problem', html:`
    <div class="pillar-tag">The three leaks</div>
    <ul>
      <li>Feast and famine, because new clients only arrive by word of mouth and you cannot control the tap.</li>
      <li>Undercharging, because you have never built real belief in the value of what you do.</li>
      <li>Hiding, because putting yourself online feels terrifying, so the right people never find you.</li>
    </ul>`},

  {t:'cost', html:`
    <h2>What the leaks really cost</h2>
    <p class="sub">Not just money. They cost you the freedom you got into this work for in the first place, and they keep a gift that could change lives sitting mostly unused. A practice built on the three leaks will always feel heavier than it should.</p>`},

  {t:'part', html:`
    <div class="part-no">Part Two</div>
    <h2>The system that plugs the leaks</h2>
    <p class="sub">Five simple pieces. Each one rests on a spiritual law, so building your business feels like less resistance, not more hustle.</p>`},

  {t:'pillar', html:`
    <div class="pillar-tag">Piece 1 &middot; Scheduling for your lifestyle</div>
    <h2>Build the week around your life, not the other way around</h2>
    <p class="sub">Using the laws of non-resistance and detachment to set a rhythm that protects your energy, so readings feel expansive instead of draining.</p>`},

  {t:'pillar', html:`
    <div class="pillar-tag">Piece 2 &middot; An environment for flow</div>
    <h2>Design a business that is easy to show up to</h2>
    <p class="sub">The law of least effort applied to your tools, your space and your systems, so the work supports your connection to Spirit rather than fighting it.</p>`},

  {t:'pillar', html:`
    <div class="pillar-tag">Piece 3 &middot; Attracting the right clients</div>
    <h2>Be found by the people you are meant to serve</h2>
    <p class="sub">Authentic storytelling and simple audience building, no big ad budget required, so the right sitters come to you already trusting who you are.</p>`},

  {t:'pillar', html:`
    <div class="pillar-tag">Piece 4 &middot; Content that keeps serving</div>
    <h2>Turn your teaching into passive income</h2>
    <p class="sub">Using the laws of intention and compensation to create content and offers that reach far more people than your reading calendar ever could, while you sleep.</p>`},

  {t:'pillar', html:`
    <div class="pillar-tag">Piece 5 &middot; Money mindset</div>
    <h2>Price your worth with the Money Formula</h2>
    <p class="sub">A clear way to decide what to charge and to actually believe in it, so raising your prices feels aligned instead of scary.</p>`},

  {t:'fit', html:`
    <h2>How the five fit together</h2>
    <p class="sub">A protected schedule frees your energy. A low-friction environment keeps you consistent. The right clients find you. Passive content multiplies your reach. And a healthy money mindset lets you receive what all of it is worth. Pull one piece and the others hold. That is a practice, not a hobby.</p>`},

  {t:'picture', html:`
    <div class="kicker">What it looks like</div>
    <h2>A week in a full-time practice</h2>
    <p class="sub">Readings on the days you chose. A waitlist instead of an empty calendar. Income arriving while you are off living your life. The same gift, finally held inside a structure that lets it grow.</p>`},

  {t:'belief', html:`
    <div class="big-quote">"You do not have to choose between your gift and a real living. You were never meant to."</div>
    <p class="note">The mediums who go full time are rarely the most gifted in the room. They are the ones who finally learned the second skill.</p>`},

  {t:'why', html:`
    <div class="kicker">Why learn this from me</div>
    <h2>I am a full-time medium who started exactly where you are</h2>
    <p class="sub">I went from teaching third grade, too afraid to charge for a reading, to working full time as a medium and mentoring over a thousand mediums around the world. I trained with Lisa Williams and Tony Stockwell, and I built these systems because I needed them myself.</p>`},

  {t:'decision', html:`
    <div class="accent-rule"></div>
    <h2>This is not for everyone</h2>
    <p class="sub">If you only want to read for fun, you do not need any of this. But if you feel a pull to do this work full time, to reach more people and to finally receive what your gift is worth, there is a clear next step.</p>`},

  {t:'cta', html:`
    <div class="kicker">Your next step</div>
    <h2>Let's build your full-time practice together</h2>
    <p class="cta-step">Join me inside the Business Mastermind for Spiritual Entrepreneurs, where we put all five pieces in place together.</p>
    <p class="sub">Doors open to a small group a couple of times a year. If you are ready, that is where we start.</p>
    <p class="disclaimer">Educational only. No income or result is guaranteed. Results vary with effort, experience and many factors outside anyone's control.</p>`},
];

const stage=document.getElementById('stage');
stage.innerHTML = S.map((s,i)=>`<section class="slide${i===0?' active':''}" data-i="${i}">
  ${s.html}
  <div class="brandline">${BRAND}</div>
  <div class="pagenum">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>
</section>`).join('');

let cur=0; const slides=[...document.querySelectorAll('.slide')];
function go(n){ cur=Math.max(0,Math.min(S.length-1,n)); slides.forEach((el,i)=>el.classList.toggle('active',i===cur)); }
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(cur+1); if(e.key==='ArrowLeft')go(cur-1); });
stage.addEventListener('click',e=>{ if(e.target.closest('#nav'))return; const r=stage.getBoundingClientRect(); (e.clientX-r.left > r.width*0.5)?go(cur+1):go(cur-1); });
</script>
</body>
</html>
