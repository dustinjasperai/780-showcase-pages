<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Your Inner Medium | A Masterclass with Lindsay Marino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#f5eeea;        /* her warm blush ground */
    --panel:#fffaf7;     /* lifted warm white */
    --ink:#38383b;       /* her near-black heading color */
    --ink-soft:#56535a;
    --ink-mute:#8a8188;
    --accent:#92dddb;    /* her soft teal */
    --accent-deep:#5bb8b6;
    --rule:#e6dcd4;
  }
  html,body{height:100%;}
  body{
    font-family:'Poppins',-apple-system,sans-serif;
    background:var(--ink);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100vw; height:100vh;
    max-width:1280px; max-height:720px;
    aspect-ratio:16/9;
    background:var(--bg);
    overflow:hidden;
  }
  .slide{
    position:absolute; inset:0;
    padding:64px 84px;
    display:none;
    flex-direction:column;
    justify-content:center;
  }
  .slide.active{ display:flex; }
  .kicker{
    font-size:13px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent-deep); margin-bottom:22px;
  }
  h1{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600; font-size:76px; line-height:1.03; letter-spacing:-.01em;
    color:var(--ink); margin-bottom:24px;
  }
  h2{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600; font-size:52px; line-height:1.08; color:var(--ink); margin-bottom:22px;
  }
  .lede{ font-size:23px; font-weight:300; line-height:1.5; color:var(--ink-soft); max-width:60ch; }
  .sub{ font-size:19px; font-weight:300; line-height:1.55; color:var(--ink-soft); max-width:62ch; }
  .part-no{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:30px; color:var(--accent-deep); margin-bottom:10px; }
  ul{ list-style:none; margin-top:14px; }
  li{ font-size:21px; font-weight:300; color:var(--ink-soft); padding:12px 0 12px 30px; position:relative; border-bottom:1px solid var(--rule); max-width:58ch; }
  li:last-child{ border-bottom:none; }
  li::before{ content:""; position:absolute; left:0; top:21px; width:12px; height:12px; border-radius:50%; background:var(--accent); }
  .pillar-tag{ display:inline-block; font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-deep); margin-bottom:16px; }
  .big-quote{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:46px; line-height:1.18; color:var(--ink); max-width:24ch; }
  .accent-rule{ width:72px; height:3px; background:var(--accent); margin:0 0 28px; }
  .note{ font-size:15px; color:var(--ink-mute); margin-top:26px; max-width:58ch; font-weight:300; }
  .center{ align-items:center; text-align:center; }
  .center .lede, .center .sub{ margin-left:auto; margin-right:auto; }
  .center .accent-rule{ margin-left:auto; margin-right:auto; }
  .cta-step{ font-size:24px; font-weight:500; color:var(--ink); margin:8px 0; }
  .brandline{ position:absolute; bottom:30px; left:84px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); }
  .pagenum{ position:absolute; bottom:30px; right:84px; font-size:13px; color:var(--ink-mute); font-variant-numeric:tabular-nums; }
  .disclaimer{ font-size:13px; color:var(--ink-mute); margin-top:22px; max-width:66ch; font-weight:300; line-height:1.5; }
  #nav{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:20; }
  #nav button{ background:rgba(255,255,255,.14); color:#fff; border:none; width:38px; height:34px; border-radius:7px; font-size:16px; cursor:pointer; }
  #nav button:hover{ background:rgba(255,255,255,.28); }
  @media (max-width:760px){
    h1{ font-size:44px; } h2{ font-size:34px; } .slide{ padding:34px 30px; }
    .lede{ font-size:18px; } li{ font-size:17px; } .big-quote{ font-size:30px; }
    .brandline,.pagenum{ left:30px; right:30px; bottom:16px; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev" aria-label="Previous">&#8249;</button><button id="next" aria-label="Next">&#8250;</button></div>
<script>
const BRAND = "Unlock Your Inner Medium &middot; Lindsay Marino";
const S = [
  {t:'title', html:`
    <div class="kicker">A free live masterclass with Lindsay Marino</div>
    <h1>Unlock Your<br>Inner Medium</h1>
    <p class="lede">How to receive real evidence in a reading, a name, a date, a cause of passing, and deliver the healing message with confidence.</p>`},

  {t:'who', html:`
    <div class="accent-rule"></div>
    <h2>This is for you if...</h2>
    <ul>
      <li>You sense more than you can put into words, and it frustrates you.</li>
      <li>You freeze partway through a reading and quietly wonder if you are making it up.</li>
      <li>You have sat in circles and taken classes, and still feel stuck in the same place.</li>
    </ul>`},

  {t:'trap', html:`
    <div class="kicker">The quiet trap</div>
    <h2>You were told it is a gift.<br>So when a reading falls flat, you wonder if yours is broken.</h2>
    <p class="sub">It is not broken. You were handed a gift and never handed a method. Without steps to fall back on, every reading feels like starting from zero, and the nerves win.</p>`},

  {t:'reframe', html:`
    <div class="big-quote">"Mediumship is not a gift you either have or you don't. It is a skill you practice."</div>
    <p class="note">The most consistent mediums are rarely the most gifted in the room. They are the ones working a repeatable method, reading after reading.</p>`},

  {t:'part', html:`
    <div class="part-no">Part One</div>
    <h2>Why readings feel hit or miss</h2>
    <p class="sub">It is almost never the ability. It is three things that quietly stall gifted mediums at exactly the same spot.</p>`},

  {t:'problem', html:`
    <div class="pillar-tag">The three things that stall you</div>
    <ul>
      <li>Reaching for the big message before you have gathered any real evidence.</li>
      <li>No structure to lean on, so nerves take over and the connection tightens.</li>
      <li>Fear of being wrong, which blocks the very information trying to come through.</li>
    </ul>`},

  {t:'cost', html:`
    <h2>What that really costs</h2>
    <p class="sub">A gift that could bring real comfort to grieving people stays small and uncertain. You hold back, you second-guess, and the person in front of you never gets the clear, specific evidence that lets them truly believe their loved one is there.</p>`},

  {t:'part', html:`
    <div class="part-no">Part Two</div>
    <h2>The method: Unlock Your Inner Medium</h2>
    <p class="sub">Three levels, built to be practiced. Each one gives you steps you can repeat, so a reading stops being a leap of faith.</p>`},

  {t:'reframe', html:`
    <div class="big-quote">"Evidence first. Message second."</div>
    <p class="note">The order is the whole fix. Gather the specific details, a name, a date, a cause of passing, and the healing message lands on solid ground.</p>`},

  {t:'pillar', html:`
    <div class="pillar-tag">Level One &middot; Foundations</div>
    <h2>How to receive clear, specific evidence</h2>
    <p class="sub">Breaking a reading into simple, repeatable steps: how to ask, what to look for, and how to let names, dates and details come through cleanly instead of forcing them.</p>`},

  {t:'pillar', html:`
    <div class="pillar-tag">Level Two &middot; The clairs and confidence</div>
    <h2>Find your strongest sense and trust it</h2>
    <p class="sub">Developing your clairvoyance, clairaudience, clairsentience and claircognizance, with creative reading techniques that build real confidence in what you receive.</p>`},

  {t:'pillar', html:`
    <div class="pillar-tag">Level Three &middot; Past the plateau</div>
    <h2>Break the patterns that keep you stuck</h2>
    <p class="sub">The habits that quietly stall development, and the deeper inner work that moves you past the plateau into consistent, flowing readings.</p>`},

  {t:'fit', html:`
    <h2>The evidence ladder</h2>
    <p class="sub">A name. A detail only they would know. A date. A cause of passing. Then the healing message. Each rung makes the next one easier, and makes the reading undeniable for the person sitting with you.</p>`},

  {t:'part', html:`
    <div class="part-no">Part Three</div>
    <h2>What a reading looks like when it flows</h2>
    <p class="sub">Not louder. Steadier. You stop chasing and start receiving.</p>`},

  {t:'picture', html:`
    <div class="kicker">A reading that holds</div>
    <h2>Steady, specific, received</h2>
    <p class="sub">The evidence lands and the sitter knows it is real. The healing message is received the way it was meant to be. You feel calm and clear instead of scrambling, because you are following a method you trust.</p>`},

  {t:'why', html:`
    <div class="kicker">Why learn this from me</div>
    <h2>I teach mediumship the way I taught children</h2>
    <p class="sub">I spent eighteen years in the classroom with a Master's in Education before working full time as a medium. I have worked with over a thousand mediums around the world, and I trained with Lisa Williams and Tony Stockwell. I break development into simple steps because that is how people actually learn.</p>`},

  {t:'belief', html:`
    <div class="big-quote">"She breaks everything down into simple steps, so you take in the new information without feeling overwhelmed."</div>
    <p class="note">Jessica Marie, student. And from Susan Ferraro, student: "Lindsay is clear and to the point, and she is great with experiential exercises, which really matters for learning."</p>`},

  {t:'decision', html:`
    <div class="accent-rule"></div>
    <h2>This is not for everyone</h2>
    <p class="sub">If you only want to dabble, you do not need any of this. But if you feel a real pull to develop, to read with evidence and to sit with grieving people and bring them something undeniable, there is a clear next step.</p>`},

  {t:'cta', html:`
    <div class="kicker">Your next step</div>
    <h2>Let's develop your mediumship with a method</h2>
    <p class="cta-step">Join me inside Unlock Your Inner Medium, where we build all three levels together, with live practice and personal feedback.</p>
    <p class="sub">If you are ready to stop guessing and start practicing a method you can trust, that is where we begin.</p>
    <p class="disclaimer">Educational only. Mediumship development takes practice and results vary with effort, experience and many factors outside anyone's control. Nothing here is a guarantee of any specific outcome.</p>`},
];

const stage=document.getElementById('stage');
stage.innerHTML = S.map((s,i)=>`<section class="slide${i===0?' active':''}" data-i="${i}">
  ${s.html}
  <div class="brandline">${BRAND}</div>
  <div class="pagenum">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>
</section>`).join('');

let cur=0; const slides=[...document.querySelectorAll('.slide')];
function go(n){ cur=Math.max(0,Math.min(S.length-1,n)); slides.forEach((el,i)=>el.classList.toggle('active',i===cur)); }
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(cur+1); if(e.key==='ArrowLeft')go(cur-1); });
stage.addEventListener('click',e=>{ if(e.target.closest('#nav'))return; const r=stage.getBoundingClientRect(); (e.clientX-r.left > r.width*0.5)?go(cur+1):go(cur-1); });
</script>
</body>
</html>
