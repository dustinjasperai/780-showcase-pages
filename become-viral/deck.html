<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Faceless Channel Operating System — Become Viral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0c1e;        /* their hero/footer indigo */
    --panel:#17142e;
    --panel2:#1d1838;
    --rule:#2d2b3d;      /* their slate */
    --ink:#f3f1fb;
    --mut:#a7a2c4;
    --accent:#7c3aed;    /* their exact CTA button violet */
    --proof:#10b981;     /* their revenue/monetized emerald */
    --display:'Syne',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#06050f;color:var(--ink);font-family:var(--body)}
  .stage{max-width:1040px;margin:0 auto;padding:28px 20px 90px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:54px 56px;margin:0 0 22px;min-height:540px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;inset:0;background:
    radial-gradient(900px 360px at 88% -10%, rgba(124,58,237,.16), transparent 60%),
    radial-gradient(700px 320px at -8% 110%, rgba(16,185,129,.10), transparent 60%);
    pointer-events:none}
  .kic{font-family:var(--display);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent)}
  .num{position:absolute;top:22px;right:28px;font-family:var(--display);font-size:12px;color:var(--mut);letter-spacing:.1em}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-.01em;margin:14px 0}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.08;letter-spacing:-.01em;margin:12px 0}
  h3{font-family:var(--display);font-weight:600;font-size:24px;margin:2px 0 6px}
  p{font-size:19px;line-height:1.55;color:var(--ink);max-width:40ch}
  p.lead{font-size:22px;color:var(--mut);max-width:46ch}
  .sub{font-size:18px;color:var(--mut);max-width:50ch;margin-top:10px}
  .big{font-family:var(--display);font-weight:700;font-size:64px;color:var(--proof);line-height:1}
  .rowcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px}
  .card .t{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink)}
  .card .d{font-size:15px;color:var(--mut);margin-top:8px;line-height:1.5}
  .card .pill{display:inline-block;font-family:var(--display);font-size:12px;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;margin-bottom:12px}
  ul{list-style:none;margin-top:18px;display:grid;gap:12px;max-width:52ch}
  ul li{position:relative;padding-left:26px;font-size:18px;color:var(--ink);line-height:1.45}
  ul li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:2px;
    background:var(--accent);transform:rotate(45deg)}
  ul.proof li::before{background:var(--proof)}
  .steps{display:grid;gap:14px;margin-top:22px;max-width:60ch}
  .step{display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:start;
    background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
  .step .n{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent)}
  .step .b strong{font-family:var(--display);font-weight:600;font-size:18px;display:block;color:var(--ink)}
  .step .b span{font-size:15px;color:var(--mut);line-height:1.45}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
  .stat .v{font-family:var(--display);font-weight:700;font-size:34px;color:var(--proof)}
  .stat .l{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.3}
  .quote{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.3;max-width:30ch;color:var(--ink)}
  .cta h2{font-size:46px}
  .ctabtn{display:inline-block;margin-top:24px;font-family:var(--display);font-weight:600;font-size:20px;
    color:#fff;background:var(--accent);border-radius:12px;padding:16px 30px}
  .disc{font-size:13px;color:var(--mut);margin-top:26px;max-width:62ch;line-height:1.5}
  .brand{font-family:var(--display);font-weight:600;letter-spacing:.04em;color:var(--mut);font-size:15px}
  .two{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
  @media(max-width:720px){
    .slide{padding:34px 26px;min-height:auto}
    h1{font-size:36px}h2{font-size:28px}.rowcards,.statgrid{grid-template-columns:1fr 1fr}
    .two{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const S=[
 {t:'title'},
 {t:'agenda'},
 {t:'whatis'},
 {t:'trap'},
 {t:'reframe'},
 {t:'costs'},
 {t:'system'},
 {t:'p1'},
 {t:'p1rules'},
 {t:'p2'},
 {t:'p2rules'},
 {t:'p3'},
 {t:'p3rules'},
 {t:'picture'},
 {t:'student'},
 {t:'whyme'},
 {t:'proof'},
 {t:'cta', disc:'Educational content only. No income or result is guaranteed. Results vary and are not typical. Success depends on effort, experience, niche, and market conditions. See the earnings disclaimer at becomeviral.com.'}
];

function slide(html){return `<section class="slide">${html}</section>`}
const stage=document.getElementById('stage');
let out='';
S.forEach((s,i)=>{
 const n=`<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
 let h='';
 switch(s.t){
  case 'title': h=`${n}<div class="kic">Become Viral &middot; Faceless Channel Academy</div>
    <h1>The Faceless Channel<br>Operating System</h1>
    <p class="lead">Build a YouTube channel that pays you every month. No camera. No editing. No experience.</p>
    <p class="sub">A live masterclass with Devon Canup.</p>`;break;
  case 'agenda': h=`${n}<div class="kic">What we'll cover</div>
    <h2>The next 45 minutes</h2>
    <div class="steps">
      <div class="step"><div class="n">1</div><div class="b"><strong>Why niche selection decides everything</strong><span>The one decision that most faceless channels get wrong before they ever hit record.</span></div></div>
      <div class="step"><div class="n">2</div><div class="b"><strong>The three-part operating system</strong><span>Pick by data, run the pipeline, scale with a team.</span></div></div>
      <div class="step"><div class="n">3</div><div class="b"><strong>The road from month one to monetized</strong><span>And how to decide if the Academy is the right fit for you.</span></div></div>
    </div>`;break;
  case 'whatis': h=`${n}<div class="kic">First, the model</div>
    <div class="two"><div>
      <h2>What "faceless"<br>actually means.</h2>
      <p class="lead">A faceless channel earns from YouTube ad revenue and sponsorships without you ever appearing on camera or editing a frame. Stock and licensed footage, a written script, an AI or hired voiceover, an editor.</p>
      <p class="sub">The channel is a product. Your job is to run the system that produces it.</p>
    </div><div>
      <div class="card"><span class="pill">A real example</span><div class="t">$0 to $13K / month</div><div class="d">A history channel built from zero by one FCA student: one scriptwriter, one editor at $25 a video, an AI voiceover. Month 3 monetized, month 12 at $13,000 a month.</div></div>
    </div></div>`;break;
  case 'trap': h=`${n}<div class="kic">Who this is for</div>
    <h2>You already know<br>faceless YouTube works.</h2>
    <p class="lead">You've seen the revenue screenshots. You believe the model. But you're stuck between conflicting advice, the wrong niche, and the fear of wasting months on a channel that never pays.</p>
    <p class="sub">Every month you spend "researching" is $5K to $15K you will never get back.</p>`;break;
  case 'reframe': h=`${n}<div class="kic">The uncomfortable truth</div>
    <h2>Most faceless channels don't<br>fail at editing.</h2>
    <p class="lead">They fail at the very first decision: the niche. Picked on passion instead of the numbers. By the time you feel the $2 RPMs, you've already burned six months.</p>
    <p class="sub">"I love history" is not a business thesis. An $18 CPM is.</p>`;break;
  case 'costs': h=`${n}<div class="kic">Part One &middot; Why builders stall</div>
    <h2>Five costs nobody<br>warns you about</h2>
    <div class="rowcards">
      <div class="card"><div class="t">Analysis paralysis</div><div class="d">10,000 strategies, zero videos published. Cost: months of lost momentum.</div></div>
      <div class="card"><div class="t">Wrong niche, wrong data</div><div class="d">Chosen because it sounded good, not because the CPMs backed it. Cost: 6+ months in a dead end.</div></div>
      <div class="card"><div class="t">No system, just hustle</div><div class="d">Scripts, edits, uploads, all by hand. That's a second job that doesn't pay yet.</div></div>
      <div class="card"><div class="t">Burned before</div><div class="d">A course that sold hope, not a system. Cost: trust and thousands of dollars.</div></div>
      <div class="card"><div class="t">Doing it alone</div><div class="d">No one to tell you your thumbnail CTR is killing the channel. Cost: every fix takes 3x longer.</div></div>
      <div class="card"><div class="t">The common thread</div><div class="d">None of these are talent problems. They're the absence of a system.</div></div>
    </div>`;break;
  case 'system': h=`${n}<div class="kic">The answer</div>
    <h2>This isn't a course.<br>It's an operating system.</h2>
    <p class="lead">A documented playbook with three moving parts. Run them in order and the channel stops depending on your motivation and starts depending on a process.</p>
    <div class="rowcards">
      <div class="card"><span class="pill">01</span><div class="t">Pick by data</div><div class="d">Niche selection scored on CPM, competition, and demand.</div></div>
      <div class="card"><span class="pill">02</span><div class="t">Run the pipeline</div><div class="d">Scripts, thumbnails, and uploads mapped end to end.</div></div>
      <div class="card"><span class="pill">03</span><div class="t">Scale with a team</div><div class="d">Hire the roles so the channel runs without you.</div></div>
    </div>`;break;
  case 'p1': h=`${n}<div class="kic">Part Two &middot; Pillar One</div>
    <div class="two"><div>
      <h2>Pick your niche<br>with data.</h2>
      <p class="lead">A scoring system built on a database of 300+ validated six-figure channels, ranked by CPM, competition, upload frequency, and estimated monthly income.</p>
      <p class="sub">You don't guess which niche pays. You read it off the board.</p>
    </div><div>
      <div class="card"><span class="pill">The thesis</span><div class="t">CPM first, passion second</div><div class="d">Pick niches where advertisers already pay to reach the audience, not just where you'd enjoy making content. Enjoyment is a tiebreaker, not a strategy.</div></div>
    </div></div>`;break;
  case 'p1rules': h=`${n}<div class="kic">Pillar One &middot; The niche-selection rules</div>
    <h3>Six checks before you record a single video</h3>
    <div class="steps">
      <div class="step"><div class="n">1</div><div class="b"><strong>Start with CPM, not passion</strong><span>Advertiser demand decides the ceiling. Find it first.</span></div></div>
      <div class="step"><div class="n">2</div><div class="b"><strong>Validate against real channels</strong><span>Find five already making money in the niche. Can't find five? It hasn't proven itself.</span></div></div>
      <div class="step"><div class="n">3</div><div class="b"><strong>Score competition by upload recency</strong><span>A lazy 500K channel is weaker competition than a hungry 10K one.</span></div></div>
      <div class="step"><div class="n">4</div><div class="b"><strong>Run the 90-day math first</strong><span>CPM times expected views. If it doesn't hit $3K to $5K by month three, recalibrate.</span></div></div>
      <div class="step"><div class="n">5</div><div class="b"><strong>Filter for evergreen</strong><span>Trends spike and die. Evergreen niches compound into year three.</span></div></div>
      <div class="step"><div class="n">6</div><div class="b"><strong>Study the top ten videos</strong><span>Thumbnails, titles, runtime, retention. The algorithm already told you what works.</span></div></div>
    </div>`;break;
  case 'p2': h=`${n}<div class="kic">Part Two &middot; Pillar Two</div>
    <div class="two"><div>
      <h2>Follow the<br>production pipeline.</h2>
      <p class="lead">Scripts, thumbnails, editing workflows, upload cadences. Every step mapped, so you're running a system instead of reinventing one each week.</p>
      <p class="sub">The thumbnail is the ad. The video is the product. Most people build the product for three weeks and spend twenty minutes on the ad. Flip that ratio.</p>
    </div><div>
      <div class="card"><span class="pill">In the box</span>
        <ul>
          <li>Script frameworks by niche</li>
          <li>Thumbnail formulas with CTR data</li>
          <li>Upload-scheduling templates</li>
        </ul>
      </div>
    </div></div>`;break;
  case 'p2rules': h=`${n}<div class="kic">Pillar Two &middot; How a viral script is built</div>
    <h3>Six things your script should do that most don't</h3>
    <div class="steps">
      <div class="step"><div class="n">1</div><div class="b"><strong>Hook in the first 7 seconds</strong><span>Retention is tracked from frame one. The first line is the whole game.</span></div></div>
      <div class="step"><div class="n">2</div><div class="b"><strong>Promise the payoff, then delay it</strong><span>Curiosity is the engine that drives watch time.</span></div></div>
      <div class="step"><div class="n">3</div><div class="b"><strong>Write for voice, not for reading</strong><span>If it's awkward to say, it's awkward to hear. Read every line out loud.</span></div></div>
      <div class="step"><div class="n">4</div><div class="b"><strong>Use a story spine in the middle</strong><span>Problem, attempt, failure, discovery, result. Even a finance video earns the watch.</span></div></div>
      <div class="step"><div class="n">5</div><div class="b"><strong>End on a re-hook, not a summary</strong><span>New questions generate re-watches. Summaries kill them.</span></div></div>
      <div class="step"><div class="n">6</div><div class="b"><strong>Script the thumbnail moment first</strong><span>Decide the click, then write backward toward it.</span></div></div>
    </div>`;break;
  case 'p3': h=`${n}<div class="kic">Part Two &middot; Pillar Three</div>
    <div class="two"><div>
      <h2>Scale with<br>a team.</h2>
      <p class="lead">Once the channel is monetized, you hire. Editors at $3 to $8 a video, scriptwriters, thumbnail designers. The channel runs. You build the next one.</p>
      <p class="sub">This is the part that makes it faceless and hands-free, not just camera-free.</p>
    </div><div>
      <div class="card"><span class="pill">The hiring kit</span>
        <ul>
          <li>Vetted vendor list</li>
          <li>Hiring SOPs with paid test tasks</li>
          <li>A revision protocol and turnaround standard</li>
        </ul>
      </div>
    </div></div>`;break;
  case 'p3rules': h=`${n}<div class="kic">Pillar Three &middot; Hiring editors who deliver</div>
    <h3>Six rules for building the team</h3>
    <div class="steps">
      <div class="step"><div class="n">1</div><div class="b"><strong>Brief with a reference video</strong><span>"Edit like this" beats twenty bullet points.</span></div></div>
      <div class="step"><div class="n">2</div><div class="b"><strong>Separate the test task from the hire</strong><span>A $15 test clip tells you more than three interviews.</span></div></div>
      <div class="step"><div class="n">3</div><div class="b"><strong>Set a 48-hour turnaround from day one</strong><span>Standards set early become permanent.</span></div></div>
      <div class="step"><div class="n">4</div><div class="b"><strong>Write the revision protocol before you need it</strong><span>Ambiguity costs three extra days per video.</span></div></div>
      <div class="step"><div class="n">5</div><div class="b"><strong>Track metrics, not feelings</strong><span>Videos per week, revision rate, turnaround. Replace on data.</span></div></div>
      <div class="step"><div class="n">6</div><div class="b"><strong>Build the queue before you hire</strong><span>Always have three to five scripts ready. The bottleneck is never the editor.</span></div></div>
    </div>`;break;
  case 'picture': h=`${n}<div class="kic">Part Three &middot; The two paths</div>
    <h2>With the system<br>vs. without it</h2>
    <div class="two" style="margin-top:20px">
      <div class="card"><span class="pill" style="color:var(--mut)">Without a system</span>
        <ul>
          <li>Niche picked on a gut feeling</li>
          <li>200 tutorials that contradict each other</li>
          <li>Eight hours editing every video yourself</li>
          <li>Posting randomly, hoping to get noticed</li>
          <li>Quitting at month four with nothing to show</li>
        </ul>
      </div>
      <div class="card" style="border-color:var(--proof)"><span class="pill" style="color:var(--proof)">With the operating system</span>
        <ul class="proof">
          <li>Niche validated with CPM and competition data</li>
          <li>One playbook, proven across 47+ countries</li>
          <li>Editors hired for $3 to $8 a video</li>
          <li>Upload cadence built for your niche</li>
          <li>Monetized in 30 to 120 days with coaching support</li>
        </ul>
      </div>
    </div>`;break;
  case 'student': h=`${n}<div class="kic">In a student's words</div>
    <div class="two"><div>
      <div class="quote">"Within 2.5 months I got monetized. It's been 7 months and my channel is at 50,000 subscribers. I'm a full-time surgeon, a wife, and a toddler mom."</div>
      <p class="sub" style="margin-top:18px">Vaishnavi B. &middot; $10,000/mo &middot; verified on Trustpilot</p>
    </div><div>
      <div class="card"><span class="pill">The point</span><div class="d">She didn't have more time than you. She had a system that told her exactly what to do next, and a team to hand the work to.</div></div>
    </div></div>`;break;
  case 'whyme': h=`${n}<div class="kic">Why learn this from Devon</div>
    <div class="two"><div>
      <h2>Built in public,<br>with the receipts.</h2>
      <p class="lead">Devon Canup didn't reverse-engineer this from theory. One of his own faceless channels has 41.1M views and $72,364.69 in estimated revenue, and the same playbook now runs daily inside the Academy.</p>
    </div><div>
      <div class="card"><div class="quote">"Volume plus retention plus time equals inevitable."</div><div class="d" style="margin-top:14px">The history-niche thesis, in one line.</div></div>
    </div></div>`;break;
  case 'proof': h=`${n}<div class="kic">The track record</div>
    <h2>What the system<br>has produced</h2>
    <div class="statgrid">
      <div class="stat"><div class="v">1,200+</div><div class="l">students inside the Academy</div></div>
      <div class="stat"><div class="v">$42M+</div><div class="l">generated across student channels</div></div>
      <div class="stat"><div class="v">4.6/5</div><div class="l">across 100+ Trustpilot reviews</div></div>
      <div class="stat"><div class="v">47+</div><div class="l">countries, 20+ niches represented</div></div>
    </div>
    <p class="sub" style="margin-top:28px">Daily live coaching calls with Devon and the team. Call-vault archives. A community of builders executing alongside you.</p>`;break;
  case 'cta': h=`${n}<div class="cta"><div class="kic">Your next step</div>
    <h2>Ready to build a channel<br>that runs without you?</h2>
    <p class="lead">Book a free strategy call. An FCA advisor will look at your situation, your niche ideas, and tell you honestly whether the Faceless Channel Academy is the right fit. If it isn't, they'll tell you that too.</p>
    <span class="ctabtn">Book a Free Strategy Call &rarr;</span>
    <div class="disc">${s.disc}</div>
    <div class="brand" style="margin-top:22px">Become Viral &middot; becomeviral.com</div>
  </div>`;break;
 }
 out+=slide(h);
});
stage.innerHTML=out;
</script>
</body>
</html>
