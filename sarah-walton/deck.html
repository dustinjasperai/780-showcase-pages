<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Inherited Ceiling | A Masterclass with Sarah Walton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#faf6f4;
    --panel:#f3ece9;
    --rule:#dfd3ce;
    --ink:#3f4341;
    --ink-soft:#5a5250;
    --ink-muted:#8a7d79;
    --accent:#6b3f45;
    --accent-soft:#c1ada5;
  }
  html,body{height:100%;}
  body{ font-family:'Quattrocento Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:6vh 7vw; }
  .slide{ display:none; width:100%; max-width:980px; }
  .slide.active{ display:block; animation:fade .4s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  h1{ font-family:'Lora',Georgia,serif; font-weight:600; font-size:clamp(30px,5vw,56px); line-height:1.12; letter-spacing:-0.01em; color:var(--ink); }
  h2{ font-family:'Lora',Georgia,serif; font-weight:600; font-size:clamp(24px,3.6vw,40px); line-height:1.18; color:var(--ink); margin-bottom:22px; }
  .kicker{ font-size:12px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-bottom:20px; }
  p{ font-size:clamp(16px,2vw,21px); line-height:1.6; color:var(--ink-soft); margin-bottom:16px; max-width:40em; }
  .lead{ font-size:clamp(18px,2.3vw,24px); color:var(--ink); }
  ul{ list-style:none; margin-top:10px; }
  li{ font-size:clamp(16px,2vw,21px); line-height:1.5; color:var(--ink-soft); padding-left:26px; position:relative; margin-bottom:14px; max-width:38em; }
  li::before{ content:""; position:absolute; left:0; top:.6em; width:10px; height:10px; border-radius:50%; background:var(--accent-soft); }
  .big{ font-family:'Lora',Georgia,serif; font-weight:600; font-size:clamp(28px,4.4vw,46px); line-height:1.2; color:var(--accent); max-width:16em; }
  .sub{ color:var(--ink-muted); font-size:clamp(15px,1.8vw,19px); }
  .pillar{ display:flex; gap:18px; align-items:baseline; padding:16px 0; border-top:1px solid var(--rule); }
  .pillar .num{ font-family:'Lora',serif; font-size:28px; color:var(--accent); min-width:44px; }
  .pillar .body h3{ font-family:'Lora',serif; font-size:clamp(19px,2.3vw,24px); color:var(--ink); margin-bottom:4px; }
  .pillar .body p{ margin:0; font-size:clamp(15px,1.8vw,18px); }
  .panel{ background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:28px 32px; }
  .title-wrap{ border-left:4px solid var(--accent); padding-left:28px; }
  .promise{ margin-top:22px; font-family:'Lora',serif; font-style:italic; font-size:clamp(18px,2.3vw,24px); color:var(--ink); }
  .who{ display:grid; grid-template-columns:1fr; gap:10px; }
  .disclaimer{ margin-top:26px; font-size:13px; line-height:1.5; color:var(--ink-muted); max-width:44em; }
  .byline{ margin-top:28px; font-size:15px; color:var(--ink-muted); }
  .byline strong{ color:var(--ink); font-weight:700; }
  #nav{ position:fixed; bottom:22px; right:28px; display:flex; align-items:center; gap:16px; font-size:13px; color:var(--ink-muted); font-family:'Quattrocento Sans',sans-serif; }
  #nav button{ font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--rule); border-radius:3px; padding:7px 14px; cursor:pointer; }
  #nav button:hover{ border-color:var(--accent); color:var(--accent); }
  #count{ letter-spacing:0.08em; }
  #bar{ position:fixed; top:0; left:0; height:3px; background:var(--accent); transition:width .3s ease; }
  .mark{ color:var(--accent); font-weight:700; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="nav">
  <button id="prev">Prev</button>
  <span id="count"></span>
  <button id="next">Next</button>
</div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Sarah Walton',
   title:'The Inherited Ceiling',
   p:'Why so many women hit an income wall that has nothing to do with their talent, their hours, or their offer. And the four renegotiations that lift it.',
   promise:'By the end of this hour you will know exactly where your own ceiling was set, and the first renegotiation to make this week.'},

  {t:'who', title:'Who this hour is for',
   lead:'You already have proof you are good at this.',
   items:[
     'You are a woman running a coaching, healing, or service business past the first scramble.',
     'You have repeat clients, referrals, and months that genuinely work. What you do not have is income that climbs the way your effort does.',
     'You have tried more funnels, more offers, more hustle. The number keeps settling back to the same place.'],
   note:'If that is you, the problem is almost never the strategy. It is the ceiling the strategy keeps bumping into.'},

  {t:'section', title:'The trap you are probably in',
   p:'The quiet logic goes like this: if the money is stuck, you must not be working hard enough, or smart enough, or be far enough along yet.',
   lead:'So you add. Another offer, another launch, another late night. And the ceiling does not move, which only seems to prove you need to add more. That is the trap.'},

  {t:'hook', title:'The reframe',
   big:'Your income ceiling is real. It is just not yours. It was inherited.',
   sub:'Most women are running a business on top of a set of money beliefs they never chose, absorbed long before they ever had a business.'},

  {t:'section', k:'Part One', title:'Why effort stops working',
   p:'The first thing we have to name is The Achievement Wound. It is the reason the wins never feel like enough.',
   lead:'Achieve, and the relief lasts about a day. Then the bar moves and you are chasing again. More revenue does not close the gap, because the gap was never about revenue.'},

  {t:'quote', big:'20% of this is strategy. 80% is who you are being while you execute it.',
   sub:'Beliefs shape thoughts, thoughts shape actions, actions shape results. We keep trying to fix the results while leaving the beliefs untouched.'},

  {t:'section', title:'The invisible contract',
   p:'Somewhere early, you signed an agreement about how much a woman like you is allowed to earn, charge, and keep. Nobody handed it to you on paper. You have been honoring it ever since.',
   items:[
     'It shows up as the price you will not say out loud.',
     'As the launch you quietly shrink before anyone sees it.',
     'As the money that comes in and somehow always finds a reason to leave.'],
   note:'You cannot out-strategize a contract you cannot see. So first we read it.'},

  {t:'section', title:'How to read your own contract',
   lead:'Three questions surface most of it fast.',
   items:[
     'What did the women who raised you believe money does to a person?',
     'Where did you first learn that wanting more was greedy, or risky, or unspiritual?',
     'What number, if you charged it today, would feel like you were getting away with something?'],
   note:'The answer to that last one is usually sitting right on top of your ceiling.'},

  {t:'section', k:'Part Two', title:'Wealth Consciousness',
   lead:'Wealth is natural. Scarcity is the interruption.',
   p:'The work is not adding more. It is removing the interruption, so what is already available stops getting blocked. We do that by renegotiating in four specific places.'},

  {t:'pillars', title:'The four renegotiations',
   pillars:[
     {n:'01', title:'Capacity', body:'Raise the ceiling on what you can hold without burning down, so a bigger business does not require a smaller life.'},
     {n:'02', title:'Pricing', body:'Set the number that matches the transformation, and learn to say it without flinching or discounting on instinct.'},
     {n:'03', title:'Positioning', body:'Claim your market plainly, so the right people recognize you instead of you chasing the wrong ones.'},
     {n:'04', title:'Nervous system', body:'Teach your body that more money is safe, so success stops triggering the self-sabotage that pulls you back to the ceiling.'}]},

  {t:'section', title:'Start with capacity, not tactics',
   p:'Before you touch the price or the positioning, you have to be able to hold the bigger version without your life shrinking to make room for it.',
   lead:'Capacity is first because a ceiling raised past what you can carry just becomes the next thing that burns you out. We build the container before we fill it.'},

  {t:'section', title:'Pricing is a sentence you can say calmly',
   p:'The right price is not the one a spreadsheet produces. It is the one that matches the transformation and that you can say out loud without discounting on reflex.',
   lead:'Most underearning is not an offer problem. It is a flinch at the exact moment the number leaves your mouth.'},

  {t:'section', title:'Positioning: claim the market plainly',
   p:'When you are vague about who you are for, you end up chasing the wrong people and convincing instead of attracting.',
   lead:'Claim your market in plain words and the right women recognize themselves in it. Recognition does the selling that persuasion was doing badly.'},

  {t:'section', title:'Why the nervous system is the one everyone skips',
   p:'You can know your price is right and still feel your throat close when you say it. That is not a mindset problem you can think your way out of. It is a safety signal.',
   lead:'When more money reads as dangerous, your system will protect you from it, quietly and reliably. Regulate that, and the other three renegotiations finally hold.'},

  {t:'section', k:'Part Three', title:'Life above the old ceiling',
   items:[
     'You name your price in a normal voice and let the silence sit.',
     'A launch is a decision you make once, not a crisis you survive.',
     'Money comes in and stays, because there is no longer a contract quietly sending it away.',
     'The business grows from the inside out, because how you build it is how you live inside it.']},

  {t:'who', title:'Why I teach this',
   lead:'I did not start here.',
   items:[
     'I ran a $140M P&L in corporate before I ever coached anyone, so I know the strategy side cold.',
     'I also hit my own inherited ceiling at the top of that ladder, and no spreadsheet moved it.',
     'For 17 years I have taught women the work that actually did, through The Game On Girlfriend podcast and inside my programs.'],
   note:'The world is a better place when women have money. That is the whole reason I do this.'},

  {t:'section', title:'Your first renegotiation this week',
   p:'Pick the one place the ceiling is loudest right now: capacity, pricing, positioning, or the nervous system.',
   lead:'Name the inherited belief underneath it in one sentence. Then write the sentence you would say if it were not true. That is the first rewrite, and you can make it before you do anything else.'},

  {t:'cta', title:'Where to go from here',
   p:'If this hour named something true, the next step is the room where we actually do the work, together, over time.',
   lead:'Come find your own contract, and rewrite it in all four places.',
   byline:'Sarah Walton',
   disclaimer:'This masterclass is educational. It is about beliefs, pricing, positioning, and self-regulation, not financial, investment, medical, or psychological advice. Individual results vary and depend on your own work, market, and circumstances. Nothing here is a promise or guarantee of income.'}
];

const stage = document.getElementById('stage');
function render(s){
  if(s.t==='title'){
    return `<div class="title-wrap"><div class="kicker">${s.k}</div><h1>${s.title}</h1><p class="lead" style="margin-top:20px">${s.p}</p><div class="promise">${s.promise}</div></div>`;
  }
  if(s.t==='hook' || s.t==='quote'){
    return `${s.k?`<div class="kicker">${s.k}</div>`:''}${s.title?`<h2>${s.title}</h2>`:''}<p class="big">${s.big}</p>${s.sub?`<p class="sub" style="margin-top:22px">${s.sub}</p>`:''}`;
  }
  if(s.t==='pillars'){
    const rows = s.pillars.map(p=>`<div class="pillar"><div class="num">${p.n}</div><div class="body"><h3>${p.title}</h3><p>${p.body}</p></div></div>`).join('');
    return `<h2>${s.title}</h2>${rows}`;
  }
  let out = '';
  if(s.k) out += `<div class="kicker">${s.k}</div>`;
  if(s.title) out += `<h2>${s.title}</h2>`;
  if(s.lead) out += `<p class="lead">${s.lead}</p>`;
  if(s.p) out += `<p>${s.p}</p>`;
  if(s.items) out += `<ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(s.note) out += `<p style="margin-top:18px"><span class="mark">${s.note}</span></p>`;
  if(s.byline) out += `<div class="byline">A masterclass with <strong>${s.byline}</strong></div>`;
  if(s.disclaimer) out += `<div class="disclaimer">${s.disclaimer}</div>`;
  return out;
}
let i = 0;
function show(n){
  i = Math.max(0, Math.min(S.length-1, n));
  stage.innerHTML = `<div class="slide active">${render(S[i])}</div>`;
  document.getElementById('count').textContent = `${i+1} / ${S.length}`;
  document.getElementById('bar').style.width = `${((i+1)/S.length)*100}%`;
}
document.getElementById('next').onclick = ()=>show(i+1);
document.getElementById('prev').onclick = ()=>show(i-1);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(i+1);
  if(e.key==='ArrowLeft') show(i-1);
});
show(0);
</script>
</body>
</html>
