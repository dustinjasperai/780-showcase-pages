<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 30-Second Story - A Live Masterclass with Sun Yi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;        /* his site body/header bg, rgb(0,0,0) */
    --panel:#0e0e10;     /* a hair above his #0a0a0a button bg */
    --rule:rgba(255,255,255,0.16); /* hairline from his dominant #ffffff */
    --ink:#ffffff;       /* his dominant harvested color */
    --muted:rgba(255,255,255,0.62);
    --accent:#ffffff;    /* single bright = his dominant harvested color */
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .deck{width:100%}
  .slide{
    min-height:100vh;width:100%;padding:8vmin 9vmin;
    display:flex;flex-direction:column;justify-content:center;
    border-bottom:1px solid var(--rule);position:relative;
  }
  .kicker{font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:3vmin}
  h1{font-weight:800;font-size:clamp(38px,8vw,104px);line-height:.98;letter-spacing:-.02em}
  h2{font-weight:800;font-size:clamp(30px,5.4vw,64px);line-height:1.02;letter-spacing:-.015em}
  .lede{font-weight:400;font-size:clamp(19px,2.5vw,30px);line-height:1.4;color:var(--ink);max-width:24ch;margin-top:3.5vmin}
  .body{font-weight:400;font-size:clamp(18px,2.1vw,26px);line-height:1.5;color:var(--muted);max-width:30ch;margin-top:3vmin}
  .num{font-weight:800;font-size:clamp(60px,14vw,180px);line-height:.9;color:var(--accent);opacity:.9}
  .step{display:flex;gap:4vmin;align-items:baseline;padding:3.2vmin 0;border-top:1px solid var(--rule)}
  .step:last-child{border-bottom:1px solid var(--rule)}
  .step .n{font-weight:800;font-size:clamp(26px,4vw,44px);min-width:1.6em;color:var(--accent)}
  .step .t{font-weight:600;font-size:clamp(20px,2.6vw,32px);line-height:1.2}
  .step .t small{display:block;font-weight:400;font-size:.62em;color:var(--muted);margin-top:.6em;line-height:1.4}
  .pillars{display:grid;grid-template-columns:1fr;gap:0;margin-top:4vmin}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:3vmin 0;border-top:1px solid var(--rule)}
  .row:last-child{border-bottom:1px solid var(--rule)}
  .row b{font-weight:800;font-size:clamp(24px,3.4vw,40px)}
  .row span{color:var(--muted);font-size:clamp(16px,1.9vw,22px);max-width:20ch;text-align:right}
  .foot{position:absolute;left:9vmin;bottom:5vmin;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .disc{font-size:14px;line-height:1.6;color:var(--muted);max-width:52ch;margin-top:5vmin;border-top:1px solid var(--rule);padding-top:3vmin}
  .cta-line{font-weight:600;font-size:clamp(20px,2.6vw,30px);color:var(--ink);margin-top:3vmin}
  @media(max-width:640px){.row span{text-align:left;max-width:14ch}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Sun Yi',
   h:'The 30-Second Story',
   lede:'How creators win attention without sounding like everyone else.'},

  {t:'lede', kicker:'Who this is for',
   h:'You know your work is good.',
   body:'You are a creator or a founder. The craft is there. But the feed keeps scrolling right past you, and you cannot tell why.'},

  {t:'lede', kicker:'The trap',
   h:'You were told to "just be authentic."',
   body:'So you posted the honest stuff. The real story. And it still disappeared into the same feed as everyone else.'},

  {t:'big', kicker:'The reframe',
   h:'Authenticity is not the problem.',
   body:'Shapeless authenticity is. A true story with no structure reads like noise. Structure is what makes true land.'},

  {t:'part', kicker:'Part one', num:'01', h:'Why good content gets ignored'},

  {t:'lede', kicker:'Part one',
   h:'Everyone reaches for the same hooks.',
   body:'The same templates, the same "5 tips," the same voice. The feed flattens all of it into one grey blur, yours included.'},

  {t:'lede', kicker:'Part one',
   h:'The real currency is a reframe.',
   body:'People do not stop for new information. They stop when you make them see something they already knew in a way they never had before.'},

  {t:'part', kicker:'Part two', num:'02', h:'The method: micro-storytelling'},

  {t:'steps', kicker:'The micro-story', h:'Three moves, thirty seconds.',
   steps:[
     {n:'1', t:'Name the myth', s:'Start with a belief your audience already holds as obviously true.'},
     {n:'2', t:'Show the contradiction', s:'Offer one well-known example that quietly breaks that belief.'},
     {n:'3', t:'Reveal the truth', s:'Land the reframe. The "I never thought of it that way" moment.'}
   ]},

  {t:'lede', kicker:'The micro-story',
   h:'You are not adding facts.',
   body:'You are rearranging things people already knew, so they finally click together. That click is the reason they follow you.'},

  {t:'part', kicker:'Part two', num:'02', h:'When to be vulnerable'},

  {t:'big', kicker:'The authority-vulnerability principle',
   h:'Authority first. Then vulnerable.',
   body:'A vulnerable story without earned credibility reads as oversharing. The same story, once you have shown you know your craft, reads as trust.'},

  {t:'rows', kicker:'The three pillars', h:'What we actually work on.',
   rows:[
     {b:'Mindset', s:'The inner game of showing up as yourself, on purpose.'},
     {b:'Marketing', s:'How you shape and package the story so it travels.'},
     {b:'Making money', s:'Turning an authentic brand into a real business.'}
   ]},

  {t:'part', kicker:'Part three', num:'03', h:'What a week of practice looks like'},

  {t:'lede', kicker:'Part three',
   h:'You get better by doing, not watching.',
   body:'Every week: bring real work, tell it live, get direct feedback, and revise. Reps and feedback are the whole game. Three months in, you will hear the difference.'},

  {t:'lede', kicker:'Why me',
   h:'I have spent 20 years on this.',
   body:'Over 30,000 students have taken my storytelling course. I speak on stages including TEDx, and I built Night Owl Nation so creators could practise this together, every week.'},

  {t:'rows', kicker:'The takeaways', h:'Three things to keep.',
   rows:[
     {b:'Structure', s:'True plus shape beats true alone, every time.'},
     {b:'Reframe', s:'Rearrange what they know; do not just add facts.'},
     {b:'Order', s:'Earn authority, then let the vulnerable story land.'}
   ]},

  {t:'cta', kicker:'Your next step',
   h:'Keep practising with me.',
   cta:'Join Night Owl Nation and bring a story to the next live session. That is where the reps, the feedback, and the revisions actually happen.',
   disc:'This masterclass is educational. Your results depend on your own work and consistency. Nothing here is a promise or guarantee of income, growth, or any specific outcome.'}
];

const deck = document.getElementById('deck');
function esc(x){return (x||'').toString();}
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if(s.kicker) inner += `<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.num) inner += `<div class="num">${esc(s.num)}</div>`;
  if(s.h) inner += (s.t==='title'||s.t==='part') ? `<h1>${esc(s.h)}</h1>` : `<h2>${esc(s.h)}</h2>`;
  if(s.lede) inner += `<div class="lede">${esc(s.lede)}</div>`;
  if(s.body) inner += `<div class="body">${esc(s.body)}</div>`;
  if(s.steps){ for(const st of s.steps){ inner += `<div class="step"><div class="n">${esc(st.n)}</div><div class="t">${esc(st.t)}<small>${esc(st.s)}</small></div></div>`; } }
  if(s.rows){ inner += `<div class="pillars">`; for(const r of s.rows){ inner += `<div class="row"><b>${esc(r.b)}</b><span>${esc(r.s)}</span></div>`; } inner += `</div>`; }
  if(s.cta) inner += `<div class="cta-line">${esc(s.cta)}</div>`;
  if(s.disc) inner += `<div class="disc">${esc(s.disc)}</div>`;
  inner += `<div class="foot">Night Owl Nation &middot; Sun Yi</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
}
</script>
</body>
</html>
