<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take Back Your Family — a live masterclass with Jeff &amp; Alyssa Bethke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffaf2;        /* their warm cream (brand.json #fffaf2) */
    --panel:#ffffff;
    --ink:#282842;       /* their navy (brand.json #282842) */
    --muted:#69727d;     /* their slate (brand.json #69727d) */
    --accent:#ff6b6b;    /* their dominant coral (brand.json #ff6b6b, 89 uses) */
    --serif:"Newsreader",Georgia,serif;
    --sans:"Hind","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--muted);font-family:var(--sans);color:var(--ink);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
  .slide{
    background:var(--bg);border-radius:18px;margin:0 0 22px;padding:60px 64px;
    min-height:420px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 34px rgba(40,40,66,.12);position:relative;overflow:hidden;
  }
  .slide::after{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent)}
  .kick{font-family:var(--sans);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:500;font-size:58px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1.1;margin-bottom:20px}
  .sub{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--muted);margin-top:18px}
  p.lead{font-size:22px;max-width:40ch}
  ul{list-style:none;margin-top:14px}
  ul li{font-size:21px;padding:10px 0 10px 34px;position:relative;max-width:46ch}
  ul li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:50%;
    background:var(--accent)}
  .part{font-family:var(--serif);font-size:15px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--accent);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:10px}
  .card{background:var(--panel);border-radius:12px;padding:22px 24px;border:1px solid rgba(40,40,66,.08)}
  .card b{font-family:var(--serif);font-size:22px;display:block;margin-bottom:6px}
  .card span{color:var(--muted);font-size:17px}
  .week{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  .day{background:var(--panel);border-radius:12px;padding:18px;text-align:center;border:1px solid rgba(40,40,66,.08)}
  .day b{color:var(--accent);font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .day span{display:block;font-family:var(--serif);font-size:19px;margin-top:8px}
  .foot{position:absolute;bottom:22px;left:64px;color:var(--muted);font-size:14px}
  .disc{margin-top:22px;color:var(--muted);font-size:14px;max-width:62ch;line-height:1.5}
  .big{font-family:var(--serif);font-size:46px;line-height:1.12;max-width:20ch}
  .big em{font-style:normal;color:var(--accent)}
  @media(max-width:720px){.slide{padding:40px 26px}.foot{left:26px}h1{font-size:40px}.grid,.week{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', k:'A live masterclass', h:'Take Back Your Family', s:'How to build your household into a multigenerational team on mission', foot:'Jeff and Alyssa Bethke · Family Teams'},

 {t:'who', k:'Who this is for', h:'For parents who want a home, not a hotel', lead:'If your house sometimes feels like a few people who love each other but mostly share a fridge, a calendar, and a wifi password, this hour is for you.', items:['You love your kids and still feel like you are improvising','You are tired of managing behavior and want to build belonging','You want a family that stays close long after the kids move out']},

 {t:'hook', k:'The honest part', big:'The modern family was handed a job it was <em>never built to do</em>.'},

 {t:'part', part:'Part One', h:'Why the family feels so fragile'},
 {t:'body', k:'The shift nobody voted for', h:'A household shrank into a huddle', lead:'For most of history a family was a multigenerational team: grandparents, parents, kids, aunts, work and worship all under one roof. In a couple of generations that collapsed into two adults, alone, carrying everything a whole household used to carry.'},
 {t:'body', k:'The quiet goal', h:'We aim our families at the exits', lead:'When the whole point is to launch each kid out the door at eighteen, everyone can feel it. The family becomes a launchpad, not a people. So we optimize for the years we have left instead of the generations we could build.'},
 {t:'body', k:'The symptom', h:'So we reach for control', lead:'With no shared mission, closeness has to happen by accident. When it does not, we manage behavior harder. More rules, more screens negotiated, more hoping. Control is what is left when belonging has no structure to grow in.'},

 {t:'part', part:'Part Two', h:'Run your family like a team'},
 {t:'cards', k:'The reframe', h:'Every team has four things', cards:[['A coach','Parents who lead on purpose, not referees breaking up fights.'],['A mission','A shared purpose bigger than the household and its schedule.'],['A playbook','Your values decided once, written down, lived by default.'],['Rhythms','The repeated practices that form culture without willpower.']]},
 {t:'body', k:'Pillar one, the coach', h:'You are the coach, not the manager', lead:'A manager reacts to behavior. A coach develops people toward a game they are all playing together. The same child looks completely different depending on which one is standing on the sideline.'},
 {t:'body', k:'Pillar two, the mission', h:'A family on mission', lead:'Teams cohere around a purpose, not around rules. When your family knows what it exists for, a thousand small decisions get easier, and your kids get something to belong to instead of something to escape.'},
 {t:'body', k:'Pillar three, the playbook', h:'Decide once, not daily', lead:'Most family stress is re-litigating the same decisions every night. A simple family playbook, your values and your non-negotiables written down, turns nightly battles into settled defaults.'},
 {t:'week', k:'Pillar four, the rhythms', h:'Rhythms build culture, not willpower', week:[['Daily','The family table'],['Weekly','Sabbath and rest'],['Often','The blessing'],['Yearly','The feast']], note:'Culture is not what you intend. It is what you repeat.'},
 {t:'body', k:'Built to last', h:'Family Inc., a team that outlives you', lead:'When work, money, and formation happen inside the family instead of being outsourced away from it, you are no longer raising individuals to leave. You are building a multigenerational team that compounds over time.'},

 {t:'part', part:'Part Three', h:'Where this begins in your home'},
 {t:'body', k:'A real week', h:'Smaller than you think', lead:'You do not need a retreat or a sabbatical. You need one table you protect, one rest day you keep, one blessing you speak, and one feast you build a year around. Start one rhythm this week and let it set before you add the next.'},
 {t:'why', k:'Why us', h:'We have lived this one', lead:'We are Jeff and Alyssa Bethke. Jeff has written fourteen books with over a million copies sold, including Take Back Your Family, and together we lead the Family Teams community, where thousands of households are learning to build their family as a team on mission.'},
 {t:'hook', k:'The whole idea in one line', big:'You are not managing individuals. You are <em>coaching a team</em> built to last generations.'},

 {t:'cta', k:'Your next step', h:'Start building your family team', lead:'Begin with our free 5-day family course, then go deeper inside Homeroom. For business-owning dads, Integrated takes it all the way.', disc:'This masterclass is educational. It shares principles and practices for family life; it is not professional, clinical, or financial advice, and it makes no guarantee of any particular outcome. Every family is different and results vary.', foot:'familyteams.com · Family Teams'}
];

const deck=document.getElementById('deck');
function esc(x){return x}
S.forEach(s=>{
  const d=document.createElement('section');d.className='slide';
  let h='';
  if(s.k) h+=`<div class="kick">${s.k}</div>`;
  if(s.t==='title'){ h+=`<h1>${s.h}</h1><div class="sub">${s.s}</div>`; }
  else if(s.t==='part'){ h=`<div class="part">${s.part}</div><h1>${s.h}</h1>`; }
  else if(s.t==='hook'){ h+=`<div class="big">${s.big}</div>`; }
  else if(s.t==='who'||s.t==='body'||s.t==='why'){
     h+=`<h2>${s.h}</h2>`;
     if(s.lead) h+=`<p class="lead">${s.lead}</p>`;
     if(s.items){h+='<ul>';s.items.forEach(i=>h+=`<li>${i}</li>`);h+='</ul>';}
  }
  else if(s.t==='cards'){
     h+=`<h2>${s.h}</h2><div class="grid">`;
     s.cards.forEach(c=>h+=`<div class="card"><b>${c[0]}</b><span>${c[1]}</span></div>`);
     h+='</div>';
  }
  else if(s.t==='week'){
     h+=`<h2>${s.h}</h2><div class="week">`;
     s.week.forEach(w=>h+=`<div class="day"><b>${w[0]}</b><span>${w[1]}</span></div>`);
     h+=`</div><p class="disc">${s.note}</p>`;
  }
  else if(s.t==='cta'){
     h+=`<h2>${s.h}</h2><p class="lead">${s.lead}</p><div class="disc">${s.disc}</div>`;
  }
  if(s.foot) h+=`<div class="foot">${s.foot}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
