<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grad School on Your Terms, a masterclass with Dra. Yvette Martinez-Vu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1E6;      /* warm ivory ground, from book cover + podcast art */
    --panel:#EFE4D2;   /* deeper cream */
    --rule:#D8C3A0;    /* warm tan */
    --ink:#2B2119;     /* deep warm brown */
    --muted:#6A5B49;
    --accent:#BE5A38;  /* terracotta/clay, from podcast cover art */
    --gold:#C98A2B;    /* mustard gold, from book cover */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:54px 52px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center}
  .slide.section{background:var(--panel)}
  h1,h2,h3{font-family:"Spectral",Georgia,serif;font-weight:700;line-height:1.08;letter-spacing:-.01em}
  h1{font-size:46px}
  h2{font-size:34px}
  h3{font-size:24px;font-weight:600}
  .kicker{font-family:"Inter";font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  p{font-size:19px;line-height:1.55;color:var(--ink);max-width:46ch}
  p.lead{font-size:22px;color:var(--muted);margin-top:18px}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:10px 0 10px 26px;position:relative;max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pillar{font-family:"Spectral",serif;font-size:30px;font-weight:700;color:var(--accent)}
  .big{font-size:54px;font-family:"Spectral",serif;font-weight:700;line-height:1.05}
  .rule{height:3px;width:68px;background:var(--gold);margin:20px 0 0}
  .foot{margin-top:28px;font-size:14px;color:var(--muted)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .n{font-family:"Spectral",serif;color:var(--gold);font-size:17px;margin-bottom:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Dra. Yvette Martinez-Vu, PhD',
   h:'Grad School on Your Terms',
   p:'Get into grad school, and through it, without burning out. The Femtoring way, for first-gen students of color.'},

  {t:'content', kicker:'Who this is for',
   h:'You are the first in your family to do this',
   list:['First-gen, low-income, and BIPOC students applying to graduate school',
         'Current master\'s and PhD students who feel stretched thin',
         'Anyone navigating the academy without a roadmap handed down to them']},

  {t:'content', kicker:'The trap',
   h:'Everyone told you the same thing',
   p:'Work harder. Out-hustle everyone. Sleep less. Want it more. So you did, and you are exhausted, and the finish line keeps moving.'},

  {t:'section', kicker:'The reframe',
   big:'The academy was not built for you. Grinding harder is the thing that breaks first-gen students, not the thing that saves them.'},

  {t:'content', kicker:'Part one, the real problem',
   h:'There is a hidden curriculum',
   list:['Nobody explained how admissions, funding, or advising actually work',
         'The isolation is structural, not a personal failing',
         'Hustle culture hides the cost until it arrives all at once']},

  {t:'content', kicker:'Part one',
   h:'Three things no one warns a first-gen student about',
   list:['The unwritten rules matter as much as your grades',
         'You will be asked to shrink parts of who you are',
         'Burnout is treated as the price of admission. It is not.']},

  {t:'section', kicker:'Part two',
   big:'The Femtoring Method',
   p:'Femtoring is mentorship through a compassionate, culturally relevant, community based lens. Support the academy never gave you, turned into a method.'},

  {t:'pillar', n:'F', h:'Fostering Empowerment',
   p:'Start from what you already carry. Name your strengths, your community, and your reasons, so the work is yours and not a performance of someone else\'s path.'},

  {t:'pillar', n:'M', h:'Mastering Tools',
   p:'The concrete how. The before, during, and after of applying, informational interviews, statements of purpose, and a real funding strategy. Demystified.'},

  {t:'pillar', n:'O', h:'Overcoming Roadblocks',
   p:'Plans for the setbacks that will come, rejections, impostor feelings, family and financial pressure, so one hard week does not end the whole journey.'},

  {t:'pillar', n:'ING', h:'Inspiring New Growth',
   p:'Build systems that survive real life and keep growing after you get in, because getting in is the start of the work, not the end of it.'},

  {t:'content', kicker:'The engine underneath',
   h:'Sustainable productivity, paced by energy',
   p:'Not more hours. Work paced to your real energy, rest protected on purpose, and systems built for a neurodivergent, chronically ill, over committed life. Productivity that does not cost you yourself.'},

  {t:'content', kicker:'The anchor',
   h:'Honor your non-negotiables',
   p:'Choose programs and a pace that fit a whole life, family, health, and culture included. You do not have to bend your entire self to what academia expects.'},

  {t:'section', kicker:'Part three',
   big:'Getting in is where the work starts, not where it ends.'},

  {t:'content', kicker:'The roadmap',
   h:'Get in, and stay whole',
   list:['Before: decide if grad school is really for you, and target programs that fit',
         'During: applications, statements, and funding, with templates, not guesswork',
         'After: systems and support that carry you through the degree itself']},

  {t:'content', kicker:'Why learn this from me',
   h:'Dra. Yvette Martinez-Vu, PhD',
   list:['First-gen Chicana, PhD 2016, former Associate Director of the UCSB McNair Scholars Program',
         'Co-author of Is Grad School for Me? (University of California Press, 2024)',
         'Host of the Signal Award winning Grad School Femtoring podcast, 260+ episodes']},

  {t:'content', kicker:'The shift',
   h:'From surviving to femtoring yourself through',
   p:'You stop performing a path that was built for someone else, and start building one that was built for you. That is when getting in, and getting through, finally feel possible.'},

  {t:'cta', kicker:'Your next step',
   h:'Let\'s map your path together',
   p:'Book a consultation, or join the Femtoring Academy, and we will build your plan, at your pace, on your terms.',
   disc:'This masterclass is for educational purposes only. Outcomes vary from person to person, and nothing here guarantees admission, funding, or any specific result.'}
];

const deck = document.getElementById('deck');
for(const s of S){
  const d = document.createElement('section');
  d.className = 'slide' + (s.t==='section'||s.t==='cta' ? ' section':'');
  let html = '';
  if(s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if(s.n) html += '<div class="pillar">'+s.n+'</div>';
  if(s.big) html += '<div class="big">'+s.big+'</div>';
  else if(s.h) html += '<h2>'+s.h+'</h2>';
  if(s.t==='title' && s.h){ d.querySelector; html = html.replace('<h2>'+s.h+'</h2>','<h1>'+s.h+'</h1>'); }
  if(s.p) html += '<p class="lead">'+s.p+'</p>';
  if(s.list){ html += '<ul>'; for(const li of s.list) html += '<li>'+li+'</li>'; html += '</ul>'; }
  if(s.big) html += '<div class="rule"></div>';
  if(s.disc) html += '<div class="disclaimer">'+s.disc+'</div>';
  d.innerHTML = html;
  deck.appendChild(d);
}
</script>
</body>
</html>
