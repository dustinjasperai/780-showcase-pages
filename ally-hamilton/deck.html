<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoga's Healing Power — a masterclass with Ally Hamilton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5;
    --panel:#f9fbfc;
    --rule:#e5e7eb;
    --ink:#1b1e24;
    --accent:#1fa3dd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:52px 48px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:48px;right:48px;top:30px;height:1px;background:var(--rule)}
  .kick{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:"Spectral",Georgia,serif;font-weight:600;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:"Spectral",Georgia,serif;font-weight:600;font-size:34px;line-height:1.12;margin-bottom:14px}
  p{font-size:19px;line-height:1.6;max-width:62ch;color:#2a2e36}
  p.lead{font-size:22px;color:var(--ink)}
  .big{font-family:"Spectral",Georgia,serif;font-style:italic;font-size:40px;line-height:1.15;color:var(--ink)}
  ul{margin:14px 0 0 2px;list-style:none}
  li{font-size:19px;line-height:1.5;padding:9px 0 9px 26px;position:relative;max-width:62ch;color:#2a2e36}
  li::before{content:"";position:absolute;left:0;top:18px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .num{font-family:"Spectral",serif;font-size:15px;color:var(--accent);font-weight:600}
  .sub{margin-top:14px}
  .foot{position:absolute;bottom:22px;left:48px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9aa1ab}
  .cta{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cta::before{background:rgba(255,255,255,.14)}
  .cta h2,.cta h1{color:#fff}
  .cta p{color:#d7dbe2}
  .cta .kick{color:var(--accent)}
  .disc{margin-top:22px;font-size:13px;color:#aab0ba;max-width:60ch;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A Masterclass with Ally Hamilton', h:"Yoga's Healing Power", p:"Looking inward for change, growth, and peace. How to use yoga to heal the patterns you inherited, and finally come home to yourself."},
  {t:'audience', kick:'Who this is for', h2:"The deeply feeling ones", p:"If you feel everything a little more than the people around you, if you have done the workshops and read the books and still hear the old voice at 2am, this hour is for you. You are not too much. You never were."},
  {t:'trap', kick:'The trap', h2:"The self-improvement treadmill", p:"Most of what we are sold says the same thing in different fonts: you are broken, here is the fix. So we chase the next cleanse, the next planner, the next version of ourselves. And the voice that says not enough only gets louder."},
  {t:'reframe', kick:'A different starting line', big:"You do not have to be fixed to begin. Come as you are. We start there."},
  {t:'part', kick:'Part One', h2:"Where the voice comes from", p:"The patterns running your life now were mostly written a long time ago, by people who were handed their own unexamined pain. The first work is not fixing. It is seeing."},
  {t:'problem', kick:'Part One', h2:"Inherited, not chosen", p:"The way you speak to yourself, who you believe you have to be to earn love, what you do with anger, how you handle closeness. You did not invent these. You absorbed them. And what is absorbed can be understood, and slowly, rewritten."},
  {t:'part', kick:'Part Two', h2:"Yoga is the whole system, not the poses", p:"When people hear yoga they picture a shape on a mat. The healing is in the full eight-limbed practice: how you treat yourself and others, the breath, the stillness, the attention. The mat is just the doorway in."},
  {t:'pillar', n:'01', kick:'The method', h2:"Clear seeing", p:"Before you change a single behavior, you name the story: the wound, the inherited pattern, the old voice. Healing follows discernment, not willpower. You cannot release a grip you refuse to look at."},
  {t:'pillar', n:'02', kick:'The method', h2:"The yamas and niyamas as relationship tools", p:"The ethical precepts are not rules to pass or fail. They are ways of relating to yourself and the world, honesty, non-harming, contentment, that surface the patterns that are not serving you so you can choose again."},
  {t:'pillar', n:'03', kick:'The method', h2:"Breath and stillness for a feeling body", p:"A nervous system that learned to brace cannot think its way calm. Breathwork and meditation are how you teach the body that this moment is safe, so the feeling can move through you instead of running you."},
  {t:'pillar', n:'04', kick:'The method', h2:"Rage and grief, witnessed", p:"Strong feeling is not the enemy. Rage can be fuel when it is channeled. Grief is a portal. On the page and on the mat you learn to witness what you feel without being swept away by it."},
  {t:'practice', kick:'Part Three', h2:"What a week of this looks like", list:["A short morning practice that sets the tone instead of the phone","One honest page of writing, no audience, no editing","A precept to carry into the day and notice, not perform","A few minutes of stillness before the old voice gets the first word"]},
  {t:'result', kick:'Part Three', h2:"What changes", p:"Nothing dramatic on the outside at first. Then one day the 2am voice says its old line and you hear it as an echo, not a verdict. You respond to your kid, your partner, your own reflection, from a steadier place. That is the whole thing."},
  {t:'reframe', kick:'The through-line', big:"We are all a lot more the same than we are different. Coming as you are is how you find the others."},
  {t:'why', kick:'Why me', h2:"Ally Hamilton", p:"I co-founded Yogis Anonymous, one of the longest-running online yoga studios on the web, and I have taught this practice to people for over a decade. I studied English and psychology, I write about this every week to a reading community of more than ten thousand people, and I put all of it in my book, Yoga's Healing Power."},
  {t:'why', kick:'Why me', h2:"Where this has shown up", p:"The work has been featured in The New York Times, The Wall Street Journal, Vogue, Self, Shape, and CNN. None of that is the point. The point is that it is ordinary, teachable, and it works when you practice it."},
  {t:'promise', kick:'What you will leave with', h2:"By the end of the hour", list:["A clearer name for the pattern that keeps repeating","The first limb to lean on when the old voice gets loud","A simple daily practice you can start tonight","Permission to stop waiting until you are fixed"]},
  {t:'invite', kick:'The next step', h2:"Keep going with me", p:"If this hour opens something, there is a way to go deeper: ongoing practice inside Yogis Anonymous, and small-group retreats where we do this work in person, together, over several days."},
  {t:'cta', kick:'Come as you are', h2:"Begin where you are", p:"Join the next live session, start a daily practice, and let the healing begin from acceptance instead of shame.", disc:"For education and personal growth only. No specific outcome or result is guaranteed. Results vary and depend on your own practice, history, and circumstances. This is not medical or psychological treatment."}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'');
  let inner = '';
  if(s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if(s.h) inner += `<h1>${s.h}</h1>`;
  if(s.h2) inner += `<h2>${s.h2}</h2>`;
  if(s.big) inner += `<div class="big">${s.big}</div>`;
  if(s.p) inner += `<p class="${s.h?'lead sub':'sub'}">${s.p}</p>`;
  if(s.list){ inner += '<ul>'; s.list.forEach(x=> inner += `<li>${x}</li>`); inner += '</ul>'; }
  if(s.disc) inner += `<div class="disc">${s.disc}</div>`;
  inner += `<div class="foot">Yoga's Healing Power &middot; ${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
