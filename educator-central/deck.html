<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Passion to Program — Kidpreneurs Certified Educator Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0; --panel:#FFFFFF; --rule:#E7DFD3;
    --accent:#EE6C4D; --accent2:#2A9D8F; --ink:#1E2A30; --muted:#5B6B72;
    --head:'Poppins',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  #stage{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
  .slide{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    aspect-ratio:16/9;padding:56px 64px;margin:22px 0;overflow:hidden;
    box-shadow:0 10px 30px rgba(30,42,48,.06);display:flex;flex-direction:column;justify-content:center}
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent)}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin:18px 0 14px}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.1;margin:10px 0 16px}
  p.lead{font-size:22px;line-height:1.5;color:var(--muted);max-width:40ch}
  .bar{width:64px;height:6px;border-radius:6px;background:var(--accent);margin-bottom:8px}
  .brandline{position:absolute;left:64px;bottom:34px;font-family:var(--head);font-weight:600;
    font-size:14px;color:var(--muted);letter-spacing:.04em}
  .num{position:absolute;right:56px;top:44px;font-family:var(--head);font-weight:700;font-size:120px;
    color:var(--accent);opacity:.14;line-height:1}
  ul.pts{list-style:none;margin-top:10px;display:grid;gap:14px;max-width:44ch}
  ul.pts li{position:relative;padding-left:30px;font-size:21px;line-height:1.4}
  ul.pts li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:4px;background:var(--accent2)}
  .part .kicker{color:var(--accent2)}
  .track{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .wk{flex:1 1 140px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:16px 16px 18px}
  .wk .w{font-family:var(--head);font-weight:700;color:var(--accent2);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .wk .c{font-family:var(--head);font-weight:600;font-size:19px;margin-top:6px}
  .pill{display:flex;align-items:baseline;gap:20px}
  .pill .big{font-family:var(--head);font-weight:700;font-size:96px;color:var(--accent);line-height:.9}
  .cred{display:grid;gap:12px;margin-top:14px;max-width:46ch}
  .cred div{font-size:20px}
  .cred b{font-family:var(--head);font-weight:600}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.45}
  .cta h1{color:var(--ink)}
  .cta .go{display:inline-block;margin-top:20px;font-family:var(--head);font-weight:600;font-size:20px;
    color:#fff;background:var(--accent);padding:14px 26px;border-radius:12px}
  .foot{position:absolute;right:56px;bottom:34px;font-family:var(--head);font-size:13px;color:var(--muted)}
  @media(max-width:760px){.slide{padding:32px 28px}h1{font-size:34px}h2{font-size:26px}.num{font-size:70px}.pill .big{font-size:64px}}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const BRAND="Kidpreneurs";
const S=[
 {t:'title',kicker:'A live masterclass for educators',h:'From Passion to Program',lead:'How to launch a credentialed kids-entrepreneurship program in six weeks.'},
 {t:'promise',kicker:'What you will walk out with',h:'The 5Cs, made real',lead:'By the end of this session you will have the exact framework to go from "I would love to teach kids business" to a real, running program with students in it.'},
 {t:'list',kicker:'Who this is for',h:'You already have the hardest part',pts:['Educators and tutors who love working with kids','Parents who want to teach the skills school skips','Anyone who can see that entrepreneurship is really leadership, confidence and problem solving']},
 {t:'list',kicker:'The trap',h:'Passion is not the thing that stops you',pts:['You stall on building a curriculum from a blank page','You are not sure parents and schools will take you seriously','You could teach a great class and still have an empty room']},
 {t:'statement',kicker:'The reframe',h:'You do not need to build a curriculum or a brand from scratch. You need an accredited system.'},
 {t:'part',kicker:'Part one',h:'The real problem'},
 {t:'list',kicker:'Why great educators stall',h:'Three gaps, not a talent problem',pts:['The blank page: months lost building lessons','The credibility gap: no proof a parent recognizes','The empty room: no simple way to fill seats']},
 {t:'part',kicker:'Part two',h:'The 5Cs framework'},
 {t:'pill',n:'1',kicker:'The 5Cs',h:'Curriculum and Courses',lead:'An award-winning curriculum you are trained and licensed to teach, so you never build a lesson from scratch.'},
 {t:'pill',n:'2',kicker:'The 5Cs',h:'Credibility',lead:'Accreditation and a certification exam that credential you, so parents and schools take you seriously from day one.'},
 {t:'pill',n:'3',kicker:'The 5Cs',h:'Coaching',lead:'You are trained to deliver hyper-personalized, one-on-one coaching to young entrepreneurs, not just lecture a class.'},
 {t:'pill',n:'4',kicker:'The 5Cs',h:'Content for Marketing',lead:'Done-for-you marketing content so a new educator can actually fill a program with students.'},
 {t:'pill',n:'5',kicker:'The 5Cs',h:'Community',lead:'A global community of certified educators across more than 22 countries for support and shared practice.'},
 {t:'part',kicker:'Part three',h:'Your first six weeks'},
 {t:'steps',kicker:'The six-week path',h:'Certified, and running',weeks:[['Week 1','Curriculum'],['Week 2','Credibility'],['Week 3','Coaching'],['Week 4','Marketing'],['Week 5','Community'],['Week 6','Launch']]},
 {t:'statement',kicker:'Week six',h:'A real program, with real students, and results parents can see. That is the whole point.'},
 {t:'cred',kicker:'Why Kidpreneurs',h:'A system, already proven',rows:[['Award-winning curriculum','built and refined over years of teaching kids business'],['Accredited','by the Association for Coaching and STEM.org'],['Global','certified educators in more than 22 countries'],['Founded by','Adam and Matthew Toren, authors of Kidpreneurs']]},
 {t:'list',kicker:'Recap',h:'The 5Cs, one more time',pts:['Curriculum and Courses','Credibility and Coaching','Content for Marketing and Community']},
 {t:'cta',kicker:'Your next step',h:'Become a Certified Educator',lead:'Apply for the Kidpreneurs Certified Educator Program and launch your first program in six weeks.',go:'Apply to get certified',disc:'Educational content only. No income or result is guaranteed. Results vary by effort, market and circumstances.'}
];

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function slide(s){
 let inner="";
 if(s.t==='title'){inner=`<div class="bar"></div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.h)}</h1><p class="lead">${esc(s.lead)}</p><div class="brandline">${BRAND}</div>`}
 else if(s.t==='promise'){inner=`<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.h)}</h2><p class="lead">${esc(s.lead)}</p><div class="foot">${BRAND}</div>`}
 else if(s.t==='list'){inner=`<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.h)}</h2><ul class="pts">${s.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><div class="foot">${BRAND}</div>`}
 else if(s.t==='statement'){inner=`<div class="bar"></div><div class="kicker">${esc(s.kicker)}</div><h1 style="font-size:44px;max-width:22ch">${esc(s.h)}</h1><div class="foot">${BRAND}</div>`}
 else if(s.t==='part'){inner=`<div class="part"><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.h)}</h1></div><div class="foot">${BRAND}</div>`}
 else if(s.t==='pill'){inner=`<div class="num">${esc(s.n)}</div><div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.h)}</h2><p class="lead">${esc(s.lead)}</p><div class="foot">${BRAND}</div>`}
 else if(s.t==='steps'){inner=`<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.h)}</h2><div class="track">${s.weeks.map(w=>`<div class="wk"><div class="w">${esc(w[0])}</div><div class="c">${esc(w[1])}</div></div>`).join('')}</div><div class="foot">${BRAND}</div>`}
 else if(s.t==='cred'){inner=`<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.h)}</h2><div class="cred">${s.rows.map(r=>`<div><b>${esc(r[0])}</b>, ${esc(r[1])}.</div>`).join('')}</div><div class="foot">${BRAND}</div>`}
 else if(s.t==='cta'){inner=`<div class="cta"><div class="bar"></div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.h)}</h1><p class="lead">${esc(s.lead)}</p><div class="go">${esc(s.go)}</div><p class="disc">${esc(s.disc)}</p></div><div class="foot">${BRAND}</div>`}
 return `<section class="slide ${s.t}">${inner}</section>`;
}
document.getElementById('stage').innerHTML=S.map(slide).join('');
</script>
</body>
</html>
