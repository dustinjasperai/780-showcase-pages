<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deciding Clearly Under Pressure - A Masterclass with Kirsten Breidenbruch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --ink:#172521; --deep:#2e4942; --accent:#b87e58;
    --muted:#5c6b64; --panelink:#f4f1ea; --rule:#d9d2c4;
    --head:'Josefin Sans',system-ui,sans-serif; --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e7e1d5;font-family:var(--body);color:var(--ink);padding:40px 16px;line-height:1.5}
  .deck{max-width:960px;margin:0 auto}
  .slide{position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:64px 64px;margin:0 auto 26px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden}
  .slide .no{position:absolute;top:22px;right:28px;font-family:var(--head);font-size:13px;
    letter-spacing:.12em;color:var(--muted)}
  .kick{font-family:var(--head);font-size:13px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.08;color:var(--deep);
    letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.12;color:var(--deep);
    letter-spacing:-.01em}
  p{font-size:20px;color:var(--ink);max-width:62ch;margin-top:18px}
  p.lead{font-size:23px;color:var(--muted)}
  .sub{font-size:20px;color:var(--muted);margin-top:22px}
  .by{margin-top:40px;font-family:var(--head);font-size:18px;color:var(--ink)}
  .by span{color:var(--muted);font-size:16px;display:block;margin-top:6px;font-family:var(--body)}
  ul{margin-top:26px;list-style:none}
  ul li{font-size:20px;padding:14px 0 14px 34px;border-top:1px solid var(--rule);position:relative}
  ul li:before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  ul li:last-child{border-bottom:1px solid var(--rule)}
  .big{font-size:46px;font-family:var(--head);font-weight:600;color:var(--deep);line-height:1.12;
    letter-spacing:-.01em;max-width:20ch}
  .accentword{color:var(--accent)}
  /* dark feature panels */
  .slide.panel{background:var(--deep);border-color:var(--deep)}
  .slide.panel h1,.slide.panel h2,.slide.panel .big{color:var(--panelink)}
  .slide.panel p,.slide.panel .sub{color:#cfd8d2}
  .slide.panel .no{color:#9fb0a8}
  .slide.panel .kick{color:var(--accent)}
  .part-label{font-family:var(--head);font-size:15px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:18px}
  .pillarnum{font-family:var(--head);font-size:17px;letter-spacing:.2em;color:var(--accent);
    font-weight:600;margin-bottom:14px}
  .disc{margin-top:30px;font-size:14px;color:var(--muted);max-width:66ch;line-height:1.55}
  .cta-step{margin-top:28px;font-family:var(--head);font-size:22px;color:var(--accent);font-weight:600}
  .foot{margin-top:18px;font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'panel', html:`
    <div class="kick">A live masterclass</div>
    <h1>Deciding Clearly<br>Under Pressure</h1>
    <div class="sub">How high performers make confident decisions, and lead, without burning out.</div>
    <div class="by">Kirsten Breidenbruch<span>Certified Life + Executive Coach, former VP at BlackRock</span></div>`},

  {t:'who', html:`
    <div class="kick">Who this is for</div>
    <h2>Successful on paper. Stuck underneath.</h2>
    <p class="lead">You have the title, the track record, the income. And somewhere along the way the decisions got heavier, the second-guessing got louder, and the energy got thinner.</p>`},

  {t:'trap', html:`
    <div class="kick">The trap</div>
    <h2>You have never worked harder, and never felt less sure.</h2>
    <p>So you do the thing high performers do under pressure. You push harder. You gather more information. You wait until it feels certain. And the certainty never quite arrives.</p>`},

  {t:'reframe', cls:'panel', html:`
    <div class="kick">The reframe</div>
    <div class="big">You do not have a work ethic problem.<br>You have a <span class="accentword">clarity</span> problem.</div>
    <p>More effort on an unclear decision just produces a faster, more exhausting version of the same loop.</p>`},

  {t:'part', cls:'panel', html:`
    <div class="part-label">Part One</div>
    <h1>Why pressure makes smart people overthink</h1>`},

  {t:'point', html:`
    <div class="kick">The core problem</div>
    <h2>Speed feels like progress. It is often avoidance.</h2>
    <p>Under pressure, the instinct is to move faster. But a fast decision made from a noisy, reactive place usually has to be unwound later. The speed was never the thing that mattered.</p>`},

  {t:'point', html:`
    <div class="kick">The cost</div>
    <h2>Decision fatigue is the quiet tax on your best people.</h2>
    <ul>
      <li>Overthinking small calls so there is nothing left for the big ones</li>
      <li>Reacting to the loudest input instead of the right one</li>
      <li>Mistaking busyness for direction, then wondering why you are tired and unfulfilled</li>
    </ul>`},

  {t:'principle', cls:'panel', html:`
    <div class="kick">The governing idea</div>
    <div class="big">Clear direction matters more than <span class="accentword">speed</span>.</div>
    <p>This is not about rushing into the next step. It is about building the internal clarity first, so the next step is obvious and the momentum is sustainable.</p>`},

  {t:'part', cls:'panel', html:`
    <div class="part-label">Part Two</div>
    <h1>The method: Clarity, Mindset, Action</h1>`},

  {t:'pillar', html:`
    <div class="pillarnum">Pillar One</div>
    <h2>Clarity</h2>
    <p class="lead">Get clear on what you actually want and where you are headed.</p>
    <ul>
      <li>Define the values the decision has to honour</li>
      <li>Elevate self-awareness so you can hear your own signal under the noise</li>
      <li>Set an aligned direction instead of chasing the next obvious rung</li>
    </ul>`},

  {t:'pillar', html:`
    <div class="pillarnum">Pillar Two</div>
    <h2>Mindset</h2>
    <p class="lead">Strengthen the internal foundation that supports performance.</p>
    <ul>
      <li>Shift from overthinking to confident, intentional decisions</li>
      <li>Use reflection and mindfulness to steady yourself before you act</li>
      <li>Build the resilience to stay clear when the pressure spikes</li>
    </ul>`},

  {t:'pillar', html:`
    <div class="pillarnum">Pillar Three</div>
    <h2>Action</h2>
    <p class="lead">Translate clarity and mindset into sustainable momentum.</p>
    <ul>
      <li>Co-create a personalised plan you will actually follow</li>
      <li>Build aligned habits instead of relying on willpower</li>
      <li>Move forward intentionally, reviewing what the results tell you</li>
    </ul>`},

  {t:'mindfulness', html:`
    <div class="kick">Where this comes from</div>
    <h2>Mindfulness that was proven in the highest-pressure room there is.</h2>
    <p>This is not abstract wellness. It is self-awareness practised inside a decade on Wall Street, and built into a firm-wide program at one of the largest investment firms in the world. It holds up under real pressure because that is where it was made.</p>`},

  {t:'part', cls:'panel', html:`
    <div class="part-label">Part Three</div>
    <h1>What it looks like in your week</h1>`},

  {t:'example', html:`
    <div class="kick">The shift</div>
    <h2>From a noisy loop to a clear, repeatable process.</h2>
    <ul>
      <li>You notice the loop earlier, before it costs you a day</li>
      <li>You name what you actually want before you weigh the options</li>
      <li>You make the call from a steady place, then move, then review</li>
    </ul>`},

  {t:'whyme', cls:'panel', html:`
    <div class="kick">Why listen to me</div>
    <h2>I made these decisions at the top, then learned to make them clearly.</h2>
    <ul>
      <li>Former VP at BlackRock, a decade in financial services</li>
      <li>Led the firm's mindfulness team and firm-wide initiatives</li>
      <li>Certified Life + Executive Coach, 200+ hours of accredited training</li>
    </ul>`},

  {t:'recap', html:`
    <div class="kick">The three shifts</div>
    <h2>Clarity. Mindset. Action.</h2>
    <p class="lead">Get clear on what you want. Steady the mind that has to decide. Turn it into momentum you can sustain. That is the whole method, and it starts with one clear hour.</p>`},

  {t:'cta', cls:'panel', html:`
    <div class="kick">Start here</div>
    <h2>Start with one clear conversation.</h2>
    <p>If this is the kind of work you want to do, the next step is a complimentary intro call to see if coaching is a fit and map what your three months could look like.</p>
    <div class="cta-step">Book an intro call at wellthbykirsten.com</div>
    <div class="foot">Wellth by Kirsten</div>
    <div class="disc">This masterclass is educational. It is not financial, legal, medical, or mental health advice, and it is not therapy. No income, role, promotion, or result is guaranteed; outcomes vary with each person's situation and effort.</div>`}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' '+s.cls : '');
  el.innerHTML = '<div class="no">'+(i+1)+' / '+S.length+'</div>' + s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
