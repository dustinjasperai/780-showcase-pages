<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Buy a Business, Not a Job · Erik Van Horn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1a1a1a; --panel:#232323; --rule:#3a3a3a;
    --acc:#ed1c24; --ink:#f4f4f2; --body:#c9c9c7; --dim:#8a8a88;
    --steel:#e0554f; --deep:#111111;
  }
  html,body{height:100%}
  body{background:#0f0f0f;font-family:'Montserrat',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f0f0f}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Oswald',Impact,sans-serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:.004em}
  .t-title h1{font-size:5.4vw;max-width:94%;text-transform:uppercase}
  .t-normal h1{font-size:3.3vw;max-width:92%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:78%;line-height:1.62;font-weight:400}
  .sub{font-family:'Montserrat',sans-serif;font-size:1.7vw;color:var(--steel);margin-top:3.6vh;max-width:86%;line-height:1.46;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.0vw;max-width:92%;text-transform:uppercase}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#2a1416 0%,#111 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:90%;color:var(--ink)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#38100f 0%,#120b0b 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:88%;color:var(--ink);text-transform:uppercase}
  .t-cta .body{font-family:'Montserrat',sans-serif;color:#e4dcdc;font-size:1.4vw;margin-top:3vh;max-width:74%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--ink);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mo{position:absolute;pointer-events:none}
  .title-mo{right:7.0%;bottom:8.5%;width:23vw;opacity:.95}
  .corner-mo{right:6.5%;bottom:8%;width:11vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.04em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--steel));width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9.0vw}.t-normal h1{font-size:5.9vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.8vw}.t-section h1{font-size:8.0vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Franchise Secrets</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: one storefront unit multiplying into a row of units, resolving into a rising exit step -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 150 90">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="76" x2="140" y2="76" stroke="#e0554f" stroke-width="1.6" opacity="0.45"/>
    <g stroke="#f4f4f2" stroke-width="1.6" opacity="0.4">
      <rect x="16" y="60" width="14" height="16"/>
      <rect x="40" y="52" width="14" height="24"/>
      <rect x="64" y="44" width="14" height="32"/>
    </g>
    <g stroke="#ed1c24" stroke-width="2" opacity="0.9">
      <rect x="88" y="34" width="14" height="42"/>
      <rect x="112" y="24" width="14" height="52"/>
    </g>
    <path d="M23 60 L119 24" stroke="#ed1c24" stroke-width="2.4" opacity="0.85"/>
    <circle cx="119" cy="24" r="4" fill="#ed1c24" stroke="none" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Buy a Business, Not a Job',sub:'How to build a franchise that runs without you and is worth selling one day, instead of buying yourself the most expensive job you have ever had.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You did the hard part and bought the franchise. Nobody handed you the system that lets you own it instead of work it.',body:'You can run the location and the numbers are real. But you are in it every day, a week away feels impossible, and the freedom the brochure promised never showed up. You did not buy a bad business. You bought one that still depends entirely on you, and no one walked you through the part that fixes that.'},
 {t:'dark',title:'A profitable location you can never step away from is a job with better branding.'},

 {t:'section',idx:'Part One',title:'Why Semi-Absentee Quietly Becomes a Full-Time Job'},
 {t:'normal',k:'The myth',title:'Passive was never a setting you buy. It is something you engineer.',body:'Anything can be semi-absentee if you put the right people and the right systems in first. The mistake is expecting the freedom to arrive on its own after you sign. It does not. Without lead flow, speed to lead, territory checks, and a manager who can actually run the shift, semi-absentee just means you answer the phone from a different room.'},
 {t:'normal',k:'The bottleneck',title:'If the business needs you in it every day, you are both the ceiling and the risk.',body:'When every decision, every fire, and every relationship runs through you, the business cannot grow past your calendar and it cannot survive your absence. That is not a work-ethic problem you can push through. It is a design problem, and it quietly caps what the business can become and what it will ever be worth.'},
 {t:'dark',title:'A buyer is not paying for your hours. They are paying for a business that keeps running after you leave the room.'},

 {t:'section',idx:'Part Two',title:'Buy, Grow, Sell: Own the Asset, Not the Job'},
 {t:'normal',k:'Buy',title:'Buy the business an investor would buy, not the one that only works if you never take a day off.',body:'The decision starts long before opening day. You look at the unit economics, the territory, and how much of the model can run on systems and staff instead of on the owner. A brand you can operate at arm’s length is a different asset than one that needs you behind the counter, even when the discovery day makes them look the same.'},
 {t:'normal',k:'The four phases',title:'Every franchise moves through four phases. Most owners get stuck in the second one.',body:'First you burn through the early fees and losses. Then you stabilize and the business finally works, and this is where most owners stop, because it is comfortable and it pays. Past that sit optimization and then scale or exit. The whole game is refusing to camp in phase two, because a stable owner-run job is exactly what will not sell.'},
 {t:'normal',k:'Systems before scale',title:'Build the systems before you add units, not after the wheels come off.',body:'Lead flow, speed to lead, territory checks, CRM automation, and a general manager who owns the day belong in place before you open the next location. Owners who scale on top of chaos just multiply the chaos. Owners who scale on top of systems multiply the freedom. The order is the whole difference.'},
 {t:'normal',k:'Grow',title:'Let your early units fund the next ones instead of squeezing every dollar out of the first.',body:'Single-unit thinking maximizes today’s profit. Multi-unit thinking uses the first locations to build the team, the systems, and the cash that make the next ones easier and cheaper. You stop being an operator with a good store and start being an investor with a machine that repeats.'},
 {t:'normal',k:'Sell',title:'Enterprise value is built years before the sale, by making yourself optional.',body:'A business sells on how well it runs without the owner, so the work of making yourself replaceable is the work of building what you can sell. Do it early and you also protect yourself at the table, where private equity leans on right-of-first-refusal traps and the second-bite pitch. The owner who built a real asset negotiates from strength.'},
 {t:'dark',title:'One unit is a job. A system you can repeat is a portfolio. A portfolio that runs without you is an exit.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Own an Asset'},
 {t:'normal',k:'The business this builds',title:'Time back, a business that could actually sell, and the freedom you thought the franchise came with.',body:'When the systems carry the day and the team owns the work, you get to step back on purpose instead of hoping nothing breaks. You can add the next location because the first one no longer needs you. And when you are ready, you have something a buyer wants, because it was built to run without you from the start.'},
 {t:'dark',title:'The goal was never one more location. It was a business worth more than the sum of your hours.'},
 {t:'normal',k:'Why Erik Van Horn',title:'Twenty years, six brands, eight states, and the largest podcast in franchising.',body:'Erik has spent two decades as a multi-unit, multi-brand franchisee, and worked every seat around the deal as an operator, regional developer, consultant, and investor. He has helped over a thousand people find and grow the right franchise, and he shares the tactics on Franchise Secrets, the largest podcast in franchising. This class is the method he uses himself.'},

 {t:'section',idx:'Your Next Step',title:'Build the Asset, Not the Job'},
 {t:'normal',k:'Keep going with Erik',title:'From one location to a portfolio you could sell, alongside operators building the exact same way.',body:'Franchise Tribe is where franchisees do this together: the frameworks for buying, growing, and selling, the accountability to actually install the systems, and a room of operators a few steps ahead. Start with the Franchise Secrets podcast, and join the Tribe when you are ready to build the whole thing on purpose.'},
 {t:'cta',title:'Ready to own the business instead of working it?',body:'Take the next step with Erik Van Horn and Franchise Secrets.',chips:['Listen to the Franchise Secrets Podcast','Join Franchise Tribe'],disc:'Educational content for franchise owners and operators. No income, valuation, or business result is guaranteed. Any figures describe past experience and are not a promise of your results, which vary by brand, market, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Franchise <b>Secrets</b> · Erik Van Horn</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='title') h+=mo('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
