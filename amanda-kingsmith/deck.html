<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Yoga Business Blueprint · Amanda Kingsmith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbf6f4; --panel:#f4ebe8; --rule:#e6d4d1;
    --acc:#680a29; --sec:#397d7f; --ink:#2b1a1f; --grey:#5f4a4f; --dim:#a08f8f; --cream:#fbf1ee;
  }
  html,body{height:100%}
  body{background:#1a0510;font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a0510}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Open Sans',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:-.01em}
  .t-title h1{font-size:4.6vw;max-width:92%;font-weight:600}
  .t-normal h1{font-size:3.2vw;max-width:86%}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:80%;line-height:1.62;font-weight:400}
  .sub{font-family:'Newsreader',Georgia,serif;font-size:1.85vw;color:var(--grey);margin-top:3.2vh;max-width:82%;line-height:1.5;font-weight:400;font-style:italic}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.3vw;font-weight:700;color:var(--sec);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:90%;font-weight:600}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(125% 125% at 50% 0%,#4a0a1f 0%,#1a0510 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:88%;font-weight:500;color:var(--cream);letter-spacing:-.005em}
  .t-cta{background:radial-gradient(125% 125% at 50% 100%,#4a0a1f 0%,#1a0510 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:86%;font-weight:600;color:var(--cream)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid #b56b7c;color:#f0d9de;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.22vw;font-weight:600;font-family:'Open Sans',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#c69ba6}
  .t-title .disc,.t-normal .disc{text-align:left}
  .path{position:absolute;pointer-events:none;opacity:.9}
  .title-path{right:7%;bottom:8.5%;width:25vw}
  .corner-path{right:6%;bottom:7%;width:11vw;opacity:.55}
  .brandline{font-family:'Open Sans',sans-serif;font-size:1.25vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(104,10,41,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.6vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The Yoga Business Blueprint</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a single quiet line stepping upward through three points, a business built in stages beyond the studio -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="path" viewBox="0 0 240 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="26" y1="128" x2="214" y2="128" stroke="#680a29" opacity="0.24"/>
    <path d="M30 122 L86 122 L86 92 L146 92 L146 58 L210 58 L210 30" stroke="#680a29" opacity="0.9"/>
    <circle cx="86" cy="92" r="5.5" fill="#397d7f" opacity="0.9"/>
    <circle cx="146" cy="58" r="5.5" fill="#397d7f" opacity="0.9"/>
    <circle cx="210" cy="30" r="6.5" fill="#680a29" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Yoga Business Blueprint',sub:'A live masterclass for yoga teachers who want a real business, one that is not capped by how many classes they can teach.',brand:true,path:'title'},
 {t:'normal',k:'Who this is for',title:'You became a great teacher. Nobody taught you the business.',body:'You trained for hundreds of hours to hold a room and help people change. Then you were handed a schedule and told to fill it. The teaching grew, and the business stayed a guess: what to offer, who it is for, and how to earn a living that does not depend on teaching every hour of the week.'},
 {t:'dark',title:'You are not bad at business. You were handed a schedule and told that was the whole plan.'},

 {t:'section',idx:'Part One',title:'The Studio Ceiling'},
 {t:'normal',k:'The math of a full schedule',title:'There are only so many hours you can stand on a mat.',body:'Income tied to class hours has a hard ceiling, and the ceiling is your own body. Add a class and you add an hour you have to be there for. Teach more to earn more, until there are no hours left and no more of you left to give. A full schedule is a job, not a business.'},
 {t:'normal',k:'The usual advice',title:'Filling more classes is not the way out.',body:'The common fix is more students, more classes, a bigger room. That is the same ceiling built taller. The teachers who get free do something different: they build offers that earn whether or not they are standing in the studio that day.'},
 {t:'dark',title:'A business should keep working on the days you cannot teach. Most teaching never does.'},

 {t:'section',idx:'Part Two',title:'The Yoga Business Blueprint'},
 {t:'normal',k:'Step one, your niche',title:'Stop teaching everyone. Choose who you are for.',body:'Yoga for everyone quietly sells to no one. The first move is to name the specific person you serve best and the change you help them make. A clear niche is not smaller, it is findable, and it is the thing every later decision hangs on.'},
 {t:'normal',k:'Step two, your signature offering',title:'Build one offering that is truly yours.',body:'Not ten scattered workshops you rebuild every month. One signature offering, designed around your niche, that you can teach, improve, and sell again and again. This is the piece that turns a busy teacher into a business with something real to point people toward.'},
 {t:'normal',k:'Step three, beyond the studio',title:'Take the business off the schedule.',body:'There are more ways to earn from your teaching than standing in a studio: online courses, memberships, workshops, and programs that reach people you will never share a room with. A handful of these, chosen on purpose, is how income stops depending on the calendar.'},
 {t:'normal',k:'Step four, elevate your brand',title:'Make the whole thing look like a real business.',body:'When someone finds you online, your brand should read as clear, consistent, and trustworthy within a few seconds. A simple brand audit closes the gap between the teacher you already are and the business a stranger sees, so the right people say yes.'},
 {t:'normal',k:'The through line',title:'One plan, not five side hustles.',body:'Niche, offering, income streams, and brand are not four separate projects. The Blueprint ties them into a single plan on one page: who you serve, what you sell, how you reach them, and what it earns. That is what makes it hold together, and what makes it yours.'},
 {t:'dark',title:'A business built on a plan runs on purpose. A business built on hope runs on you.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The teacher this builds',title:'Steady income, room to breathe, and work that lasts.',body:'You earn from more than the hours you can physically teach. You take the students and clients who are right for you. The business stops being the anxious thing you avoid and becomes something you can actually run, so you keep teaching for decades instead of burning out in a few years.'},
 {t:'dark',title:'A sustainable business is not less yoga. It is what lets you keep teaching at all.'},
 {t:'normal',k:'Why Amanda Kingsmith',title:'Business training and the mat, in one teacher.',body:'Amanda Kingsmith is a 500 hour Registered Yoga Teacher with a business education, a faculty member teaching the Business of Yoga at the Vancouver School of Healing Arts, and host of the M.B.Om podcast with more than 150 interviews with teachers around the world. She teaches the whole picture, the practice and the business, together.'},

 {t:'section',idx:'Your Next Step',title:'Build Your Blueprint'},
 {t:'normal',k:'Where to begin',title:'Start with the free steps, then go deeper.',body:'The free 5 Steps ebook shows you the first moves. The Yoga Business Bootcamp walks the whole Blueprint at your own pace. One to one coaching takes you all the way there, with the accountability to actually finish.'},
 {t:'cta',title:'Ready to build a yoga business that lasts?',chips:['Grab the free 5 Steps ebook','Book a call'],disc:'Educational content for yoga teachers and studio owners. No income or business result is guaranteed. Results vary by person, practice, and effort.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="path ${kind==='title'?'title-path':'corner-path'}"><use href="#path"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Amanda Kingsmith · <b>M.B.Om</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.path) h+=motif(s.path);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
