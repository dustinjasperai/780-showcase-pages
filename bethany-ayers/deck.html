<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Undefined Role — a masterclass with Bethany Ayers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2b2c2c; --panel:#363737; --ink:#f4f3ef; --ink2:#c9cac9;
    --rule:#4a4b4b; --accent:#0e7da6; --accent2:#5bc6e6; --mut:#9a9b9a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,serif}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{position:relative;background:var(--panel);border:1px solid var(--rule);
    border-radius:4px;padding:52px 56px;margin:0 0 22px;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .kick{font-family:"DM Sans",sans-serif;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;font-size:12px;color:var(--accent2);margin:0 0 18px}
  h1{font-family:"DM Sans",sans-serif;font-weight:700;font-size:46px;line-height:1.08;margin:0 0 16px;color:#fff}
  h2{font-family:"DM Sans",sans-serif;font-weight:700;font-size:34px;line-height:1.12;margin:0 0 14px;color:#fff}
  p{font-size:19px;line-height:1.55;color:var(--ink2);margin:0 0 12px;max-width:40em}
  .lead{font-size:22px;color:var(--ink)}
  .big{font-family:"DM Sans",sans-serif;font-weight:700;font-size:40px;line-height:1.12;color:#fff}
  .big .a{color:var(--accent2)}
  ul{margin:10px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;color:var(--ink2);padding:10px 0 10px 26px;position:relative;
    border-top:1px solid var(--rule);max-width:40em}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:9px;height:9px;background:var(--accent2);border-radius:50%}
  .num{font-family:"DM Sans",sans-serif;font-weight:700;color:var(--accent2);font-size:15px;
    letter-spacing:.14em;margin:0 0 10px}
  .tag{font-family:"DM Sans",sans-serif;font-size:14px;color:var(--mut);margin-top:18px}
  .part{background:var(--accent);border-color:var(--deep)}
  .part::before{background:#fff}
  .part .kick{color:#d7f1fa}
  .part h2{color:#ffffff;font-size:38px}
  .part p{color:#e7f6fb}
  .disc{font-size:14px;color:var(--mut);line-height:1.5;margin-top:22px;max-width:46em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', html:`
    <p class="kick">A live masterclass with Bethany Ayers</p>
    <h1>The Undefined Role</h1>
    <p class="lead">How great COOs flip the ambiguity of the job into authored authority, and scale the company from there.</p>
    <p class="tag">The Operations Room</p>`},

  {t:'promise', html:`
    <p class="kick">What you will leave with</p>
    <h2>A role you authored, not one you are waiting to be handed</h2>
    <p>By the end you will know why the COO seat is undefined on purpose, which kind of operator you actually are, and the inner work that lets you lead the second seat with real authority.</p>`},

  {t:'who', html:`
    <p class="kick">Who this is for</p>
    <h2>First-time and scaling COOs</h2>
    <p>You are the operator behind a founder. You own execution across the company, and the mandate keeps shifting under you. You were hired to bring order, and most days you are the one absorbing the chaos.</p>`},

  {t:'trap', html:`
    <p class="kick">The trap</p>
    <h2>Waiting for a job description that never arrives</h2>
    <p>So you try to earn clarity by doing more. You take on every gap, say yes to every fire, and measure yourself by how much you carry. The remit still never gets written, and the harder you work the less defined the role feels.</p>`},

  {t:'hook', html:`
    <p class="kick">The reframe</p>
    <p class="big">The role is undefined. <span class="a">That is not a bug.</span></p>
    <p>It is the whole opportunity. The COO seat is the one role in the company you get to author yourself.</p>`},

  {t:'part', cls:'part', html:`
    <p class="kick">Part one</p>
    <h2>The core problem</h2>
    <p>Why clarity never comes from doing more.</p>`},

  {t:'body', html:`
    <p class="kick">The core problem</p>
    <h2>You cannot out-work an undefined role</h2>
    <p>More output does not resolve ambiguity, it hides it. Every gap you quietly fill becomes an expectation nobody wrote down. The role stays blurry, the load grows, and the authority you need to actually lead never shows up on its own.</p>
    <p>The way out is not a cleaner org chart. It is deciding what the role is, on purpose.</p>`},

  {t:'part', cls:'part', html:`
    <p class="kick">Part two</p>
    <h2>How powerful COOs operate</h2>
    <p>Five shifts, from waiting for the role to authoring it.</p>`},

  {t:'pillar', html:`
    <p class="num">SHIFT 01</p>
    <h2>Flip the ambiguity into authored authority</h2>
    <p>Stop treating the undefined role as a problem to be solved by someone above you. Name what the role is, claim it out loud, and let the definition come from you. Authority follows authorship, not the other way around.</p>`},

  {t:'pillar', html:`
    <p class="num">SHIFT 02</p>
    <h2>Know whether you are an operator, a visionary or a backfiller</h2>
    <p>Operators execute, visionaries set direction, backfillers plug whatever is open. Most COOs are quietly doing all three and resenting two of them. Name your real orientation and build the role around that strength instead of apologising for it.</p>`},

  {t:'pillar', html:`
    <p class="num">SHIFT 03</p>
    <h2>The inner game: exec mindset and confidence</h2>
    <p>The hardest part of the second seat is not the work, it is believing you belong in it. Exec mindset is the quiet certainty that lets you disagree with a founder, hold a hard line, and stop performing competence so you can simply lead.</p>`},

  {t:'pillar', html:`
    <p class="num">SHIFT 04</p>
    <h2>Embodied leadership for operators</h2>
    <p>Under pressure your body decides before your strategy does. Learning to steady your own nervous system is what lets you walk into the room reactive people fear and set the temperature instead of catching theirs. Steadiness is an operating skill.</p>`},

  {t:'pillar', html:`
    <p class="num">SHIFT 05</p>
    <h2>Build the CEO and COO trust that actually scales</h2>
    <p>The relationship is the operating system, not the org chart. Scaling succeeds or fails on trust and psychological safety between the two seats. Get the values and communication aligned and the structure sorts itself out. Get it wrong and no process saves you.</p>`},

  {t:'part', cls:'part', html:`
    <p class="kick">Part three</p>
    <h2>The authored COO, in the real week</h2>
    <p>What changes once you stop waiting for the remit.</p>`},

  {t:'body', html:`
    <p class="kick">What changes</p>
    <h2>From absorbing the chaos to setting the terms</h2>
    <ul>
      <li>You walk into the founder meeting with a point of view, not a status update.</li>
      <li>You say no to the gaps that are not yours, without guilt or a fight.</li>
      <li>You lead from steadiness when the quarter is on fire.</li>
      <li>The company knows what the COO owns, because you decided and said so.</li>
    </ul>`},

  {t:'why', html:`
    <p class="kick">Why me</p>
    <h2>I have sat in the seat you are in</h2>
    <p>I am a COO, CRO and CCO who has scaled start-ups and helped raise over two hundred million from funds like Softbank and Bessemer. I co-host The Operations Room, a podcast for COOs with tens of thousands of operators listening, and I coach first-time and scaling execs into the second seat.</p>`},

  {t:'recap', html:`
    <p class="kick">The five shifts</p>
    <h2>Author the role</h2>
    <ul>
      <li>Flip the ambiguity into authored authority.</li>
      <li>Know which operator you really are.</li>
      <li>Win the inner game of the second seat.</li>
      <li>Lead from a steady body, not a reactive one.</li>
      <li>Build the CEO and COO trust that scales.</li>
    </ul>`},

  {t:'cta', cls:'cta', html:`
    <p class="kick">Your next step</p>
    <h2>Author the role with me</h2>
    <p>If you want to go deeper, my Exec Mentoring and Coaching is six sessions over three months, built around exactly these shifts, for first-time and scaling COOs. The first step is a short chemistry call to see if it fits.</p>
    <p class="lead">Book a chemistry call at operationsroom.co</p>
    <p class="disc">Educational content only. No income, role, outcome, or result is guaranteed. Results vary and depend on your own situation and effort.</p>`}
];

const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  el.innerHTML = s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
