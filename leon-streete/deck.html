<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>More Leads, More Clients — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sansita:wght@700;800&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f2ec;
    --panel:#fffcf7;
    --ink:#23262b;
    --rule:#e6e2dc;
    --accent:#e10707;
    --head:'Sansita', serif;
    --body:'PT Sans', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 48px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.1;margin-bottom:10px}
  .sub{font-size:20px;color:#53585f;margin-top:16px;max-width:40ch}
  .lead{font-size:22px;line-height:1.5;max-width:46ch}
  .big{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.12;max-width:20ch}
  .u{box-shadow:inset 0 -14px 0 rgba(225,7,7,.16)}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.45;padding:12px 0 12px 26px;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:20px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  li b{font-weight:700}
  .phase{font-family:var(--head);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.08em}
  .cred{font-size:19px;line-height:1.5;max-width:44ch}
  .foot{font-size:13px;color:#8a8f96;margin-top:16px}
  .disc{font-size:13px;color:#8a8f96;margin-top:22px;max-width:52ch;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-weight:700;
    font-family:var(--body);font-size:18px;padding:14px 26px;border-radius:9px;text-decoration:none}
  .n{font-size:13px;color:#b4b0a8;align-self:flex-end;margin-top:28px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S=[
  {t:'title', kick:'A Live Masterclass with Leon Streete',
   h:'More Leads,<br>More Clients',
   sub:'The direct-response client system for coaches and consultants who are brilliant at the work and inconsistent at filling the calendar.'},

  {t:'who', kick:'Who this is for',
   big:'You are great at getting results. Getting clients is the part that runs hot and cold.',
   sub:'Coaches, consultants and experts who rely on referrals and word of mouth, and feel it every time the pipeline goes quiet.'},

  {t:'trap', kick:'The trap',
   lead:'So you do more. More posting, more free advice, more "putting yourself out there." It creates activity. It does not create a predictable flow of qualified clients.'},

  {t:'reframe', kick:'The reframe',
   big:'You do not have a coaching problem. You have a <span class="u">marketing</span> problem.',
   sub:'And specifically, you have been doing awareness marketing when your business needs direct response marketing.'},

  {t:'part', phase:'Part One', h:'Why "getting your name out there" quietly starves a coaching business'},

  {t:'list', kick:'Awareness marketing, the hidden cost',
   h:'What awareness marketing never gives you',
   list:['<b>No measurable response.</b> Likes and reach do not book calls.',
         '<b>No system.</b> Every month starts from zero and depends on your mood and your calendar.',
         '<b>No control.</b> When referrals dry up there is no lever to pull.']},

  {t:'list', kick:'The real price',
   h:'So the symptoms show up in the bank account',
   list:['Discounting to close, because the prospect was never sold on the method.',
         'Chasing, following up, hoping.',
         'Feast or famine income that makes it impossible to plan or hire.']},

  {t:'part', phase:'Part Two', h:'The More Leads More Clients Method'},

  {t:'framework', kick:'The 10-step marketing manifesto',
   h:'One repeatable system, three phases',
   list:['<b>Phase 1, Perfect your message.</b> Say the right thing to the right market.',
         '<b>Phase 2, Conversion methods.</b> Turn attention into a measurable response.',
         '<b>Phase 3, Marketing tactics.</b> Put the message in front of more of the right people, on purpose.']},

  {t:'step', kick:'Phase 1',
   h:'Perfect your message',
   lead:'Before any tactic, fix the message-to-market match. Position yourself as the obvious authority for one specific person with one specific problem, so the right coaches read it and think "that is me."'},

  {t:'step', kick:'Phase 2',
   h:'Conversion methods, this is direct response',
   lead:'Every piece of marketing asks for a response you can measure: an opt-in, a reply, a booked call. If you cannot measure the response, you cannot improve it. That single shift is what separates a system from hope.'},

  {t:'step', kick:'Phase 3',
   h:'Marketing tactics',
   lead:'Only now do tactics matter, because now they have something that converts to carry. Leads come in on purpose instead of by luck, and you know which action produced which client.'},

  {t:'list', kick:'A tactic you can use now',
   h:'The Guerrilla Method',
   list:['Start high-intent conversations with the right people, without a big ad budget.',
         'A simple conversation framework that moves from hello to a real diagnosis.',
         'It works on day one, and it compounds once you turn up the volume.']},

  {t:'list', kick:'What direct response really means',
   h:'Ask, measure, improve',
   list:['<b>Ask.</b> Every touch has one clear next step.',
         '<b>Measure.</b> You watch what responds, not what gets applause.',
         '<b>Improve.</b> You double down on what converts and cut what does not.']},

  {t:'part', phase:'Part Three', h:'When the pipeline stops going quiet'},

  {t:'list', kick:'A normal week',
   h:'Predictable, not frantic',
   list:['Qualified conversations arrive every week, from a channel you control.',
         'Breakthrough sessions get booked by people already sold on your method.',
         'You enrol from a position of calm, not discounting from a position of need.']},

  {t:'reframe', kick:'The shift',
   big:'From "I hope this month works out" to "I know where my next clients come from."',
   sub:'That is the whole promise of More Leads, More Clients: a client-getting system you own.'},

  {t:'cred', kick:'Why listen to me',
   h:'A quick word on the method',
   cred:'I have spent 20+ years in marketing, wrote the number 1 Amazon best-selling book More Leads More Clients, hosted the award-winning Business Owner Elevation Podcast, and helped over 500 business owners get more leads consistently. This is the exact system I teach.'},

  {t:'recap', kick:'In one line',
   h:'The whole method',
   list:['<b>Perfect your message</b> so the right coach self-identifies.',
         '<b>Use direct response</b> so every action earns a measurable step.',
         '<b>Add the tactics</b> so the right people see it, on purpose.']},

  {t:'cta', kick:'Your next step',
   h:'Book your free Breakthrough Session',
   lead:'If you want help installing this in your own business, book a free Breakthrough Session and we will map your message, your conversion step, and your first client-getting tactic together.',
   btn:'Book your Breakthrough Session',
   disc:'Educational only. No income or result is guaranteed. Results vary based on your market, your offer, and the work you put in.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var app=document.getElementById('app');
S.forEach(function(s,i){
  var sec=el('section','slide');
  if(s.kick) sec.appendChild(el('div','kick',s.kick));
  if(s.phase) sec.appendChild(el('div','phase',s.phase));
  if(s.h) sec.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));
  if(s.big) sec.appendChild(el('div','big',s.big));
  if(s.lead) sec.appendChild(el('p','lead',s.lead));
  if(s.cred) sec.appendChild(el('p','cred',s.cred));
  if(s.sub) sec.appendChild(el('p','sub',s.sub));
  if(s.list){var ul=el('ul');s.list.forEach(function(x){ul.appendChild(el('li',null,x));});sec.appendChild(ul);}
  if(s.btn) sec.appendChild(el('a','cta-btn',s.btn));
  if(s.disc) sec.appendChild(el('div','disc',s.disc));
  sec.appendChild(el('div','n',(i+1)+' / '+S.length));
  app.appendChild(sec);
});
</script>
</body>
</html>
