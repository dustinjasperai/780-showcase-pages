<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Craft of Dread — A Masterclass with Dr Sanjida O'Connell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wght@8..144,400;8..144,600;8..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5; --panel:#0f2e2e; --rule:#008080; --pop:#ff632d; --ink:#17201f; --muted:#5b6b68;
    --serif:'Roboto Serif',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e7e3dc;color:var(--ink);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{background:var(--bg);border:1px solid #e2ddd3;border-radius:10px;padding:56px 56px;margin:0 0 22px;
    min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rule)}
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--rule);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1.08;color:var(--panel);margin-bottom:16px}
  h2{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.14;color:var(--panel);margin-bottom:14px}
  .sub{font-family:var(--serif);font-size:21px;color:var(--ink);margin-bottom:10px}
  p{font-size:18px;color:var(--ink);margin-bottom:12px;max-width:62ch}
  .lead{font-size:20px}
  .muted{color:var(--muted)}
  ul{margin:8px 0 0 2px;list-style:none}
  li{font-size:18px;color:var(--ink);padding:9px 0 9px 30px;position:relative;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:17px;width:12px;height:12px;background:var(--pop);border-radius:2px;transform:rotate(45deg)}
  .steps li::before{background:var(--rule)}
  .divider{background:var(--panel)}
  .divider::before{background:var(--pop)}
  .divider .kicker{color:var(--pop)}
  .divider h2{color:#fff;font-size:40px}
  .divider p{color:#cfe0dd}
  .big{font-size:40px;font-family:var(--serif);font-weight:700;color:var(--panel);line-height:1.1}
  .pop{color:var(--pop)}
  .foot{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .pill{display:inline-block;background:rgba(0,128,128,.12);color:var(--panel);font-weight:600;
    padding:7px 14px;border-radius:999px;font-size:14px;margin-top:8px}
  .disc{font-size:13px;color:var(--muted);margin-top:20px;max-width:64ch;line-height:1.5}
  .cta h2{color:var(--panel)}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:34px}h2{font-size:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'A live masterclass',h:'The Craft of Dread',sub:'How to write a psychological thriller that grips readers from page one',p:'With Dr Sanjida O’Connell, award-winning novelist and writing mentor'},
  {t:'promise',kicker:'What you will leave with',h:'A method, not a mood',items:['A clear way to build tension that holds across a whole novel','The structure behind a thriller that never sags in the middle','A repeatable craft you can use on the next book, and the one after']},
  {t:'who',kicker:'Who this is for',h:'You have a story that should frighten people',p:'You have a chilling idea and real pages written. You know the premise is good. What you are missing is the craft that turns a good idea into a book a reader cannot put down.'},
  {t:'trap',kicker:'The trap',h:'The idea is not the problem',p:'Most writers can summon a creepy opening. Thirty thousand words in, the dread quietly leaks out of the page and they cannot see where it went, or how to get it back.'},
  {t:'reframe',kicker:'The reframe',h:'Dread is built, not summoned',p:'Suspense is not a feeling you reach for on a good writing day. It is a structure you build on purpose. There are no rules, only suggestions, but there is craft, and craft can be taught.'},
  {t:'divider',kicker:'Part one',h:'Why thrillers lose their grip',p:'The three places tension quietly drains away'},
  {t:'problem',kicker:'The core problem',h:'Writing suspense without a plan',p:'Discovery-writing a thriller is how you end up with a saggy middle. Without a structure to hang the tension on, Act Two drifts, the stakes flatten, and the reader feels it before you do.'},
  {t:'xray',kicker:'The fix, in one image',h:'You would not build a house without a plan',p:'So why write a novel without one? An outline is an X-ray. It shows you the skeleton of the story and tells you, early, whether there is enough structure holding the suspense up. Plan carefully, then let it breathe as you write.'},
  {t:'divider',kicker:'Part two',h:'The Seven Steps to Storytelling',p:'The spine I use for every book I write and every manuscript I mentor'},
  {t:'steps',kicker:'The method',h:'Seven steps, spark to finished draft',steps:['Ideas: finding the premise that will carry a whole book','Outline: the shape before the sentences','Plot: three acts, five core elements, a middle that holds','Characters: people real enough to fear for','Location: place that does the work of dread','Point of view: whose fear are we trapped inside','Editing: cutting until only the tension is left']},
  {t:'deep',kicker:'Step three, plot',h:'The middle that holds',p:'Three-act structure, the five core elements of plot, and a fairytale broken down so you can see the bones. This is where we fix the sag: the inciting incident, the mid-turn twist, and the integration of character and plot so Act Two drives instead of drifts.'},
  {t:'deep',kicker:'Step four, characters',h:'People real enough to fear for',p:'Tension only works if the reader cares who it happens to. We build characters with a worksheet that forces the contradictions, the wants and the fears onto the page, so the danger lands on someone the reader cannot bear to lose.'},
  {t:'deep',kicker:'Step five, location',h:'Set and setting',p:'The distinctive one. I borrow two ideas from psychology: set, the character’s inner state, and setting, the physical place. When you write the room through the character’s dread, the location stops being backdrop and starts generating the fear itself.'},
  {t:'deep',kicker:'Step six, point of view',h:'Whose fear are we in',p:'Suspense is a question of access. Choosing the right distance and the right head, and knowing when to withhold, is how you make a reader complicit, anxious, and unable to look away.'},
  {t:'divider',kicker:'Part three',h:'From method to your manuscript',p:'Where the craft meets your own pages'},
  {t:'worked',kicker:'Demonstrated, not theorised',h:'I show you my own working',p:'I teach by showing the actual process behind my own thrillers, including the short thriller "Meat", step by step, so you see the method make the decisions in real time rather than hearing it described from a distance.'},
  {t:'whyme',kicker:'Why learn this from me',h:'Two decades inside the craft',items:['Winner of the CWA Short Story Dagger; author of twelve traditionally published books','Royal Literary Fund Fellow','Two decades mentoring writers for The Literary Consultancy, Arvon, First Story and the Royal Literary Fund']},
  {t:'kind',kicker:'How I work',h:'Kind, honest, constructive',p:'No gatekeeping and no cruelty. One-to-one feedback that is empathic and specific, on the page in front of us, so you leave knowing exactly what to change and why.'},
  {t:'cta',kicker:'Your next step',h:'Bring me 2,000 words',p:'If you want this craft applied to your own manuscript, book a free 20-minute consultation. We will talk through where your story is, and whether one-to-one coaching is the right next step for it.',pill:'Free 20-minute consultation, no obligation',disc:'This masterclass is educational. No publication, representation or income result is guaranteed. Results vary with the writer, the manuscript and the market.'},
];
const d=document.getElementById('deck');
for(const s of S){
  const el=document.createElement('section');
  el.className='slide'+(s.t==='divider'?' divider':'')+(s.t==='cta'?' cta':'');
  let h='';
  if(s.kicker)h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){h+='<h1>'+s.h+'</h1>';if(s.sub)h+='<div class="sub">'+s.sub+'</div>';if(s.p)h+='<p class="muted">'+s.p+'</p>';}
  else{if(s.h)h+='<h2>'+s.h+'</h2>';}
  if(s.p&&s.t!=='title')h+='<p class="lead">'+s.p+'</p>';
  if(s.items){h+='<ul>';for(const i of s.items)h+='<li>'+i+'</li>';h+='</ul>';}
  if(s.steps){h+='<ul class="steps">';for(const i of s.steps)h+='<li>'+i+'</li>';h+='</ul>';}
  if(s.pill)h+='<div class="pill">'+s.pill+'</div>';
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=h;
  d.appendChild(el);
}
</script>
</body>
</html>
