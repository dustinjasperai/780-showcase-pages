<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dean's Chair — A GradMissions Masterclass with Autumn Lockett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07363c; --panel:#0d454c; --rule:#1f5a61; --accent:#ffc008;
    --ink:#f3f8f8; --muted:#a9c6c9; --head:'Lora',Georgia,serif; --body:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#04282c;color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 18px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:16px;
    padding:52px 48px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:600;font-size:46px;line-height:1.12;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.18;margin-bottom:16px}
  p{font-size:19px;color:var(--ink);max-width:62ch;margin-bottom:14px}
  p.lead{font-size:22px;color:var(--muted)}
  .big{font-family:var(--head);font-size:40px;line-height:1.2}
  .big em{font-style:normal;color:var(--accent)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  li b{font-family:var(--head);font-weight:600;color:#fff}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:26px 28px;margin-top:14px}
  .stat{font-family:var(--head);font-size:58px;color:var(--accent);line-height:1}
  .foot{font-size:12px;color:var(--muted);margin-top:18px}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .cta{font-family:var(--head);font-size:24px;color:#fff;margin-top:10px}
  .pageno{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--rule)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
   kick:'A GradMissions Masterclass with Autumn Lockett',
   h:"The Dean's Chair",
   lead:"What a law or med school admissions committee actually sees in your file, from the person who used to decide."},

  {t:'lead',
   kick:'Who this is for',
   h:"You did everything right. And you are still waiting.",
   p:"You have the GPA. You studied for the test. You wrote the essay three times. And the decisions came back thinner than the work you put in. This room is for applicants who refuse to leave the most important decision of their life to guesswork."},

  {t:'reframe',
   kick:'The hard truth',
   big:"The committee is not reading your <em>stats</em> first. They are reading your <em>story</em>.",
   p:"A strong file with no story gets a polite waitlist. A clear story with honest numbers gets a yes. Most applicants spend 90 percent of their effort on the part the reviewer spends the least time on."},

  {t:'lead',
   kick:'Part one · the real problem',
   h:"Flying blind through a process that rewards clarity.",
   p:"Great applicants are built, not born. The process rewards three things: clarity, structure, and storytelling. Nobody ever taught you those, so you are reverse-engineering them under deadline, alone, from forum threads and a blank page."},

  {t:'stat',
   kick:'The view from the inside',
   stat:'25,000+',
   h:"applications read, from the deciding side of the table.",
   p:"Across more than fifteen years inside law and medical admissions, I read over twenty-five thousand files. Today I will show you what those years taught me about the six minutes your application actually gets."},

  {t:'reframe',
   kick:'What a reviewer does first',
   big:"The first pass is not a <em>score</em>. It is a <em>question</em>: do I believe this person?",
   p:"Before a committee weighs a single number, they decide whether the file in front of them is coherent, honest, and memorable. Everything after that is them looking for reasons to say yes or reasons to stop."},

  {t:'list',
   kick:'Part two · the GradMissions OS',
   h:"Three pillars that make a file impossible to overlook.",
   list:[
     "<b>Clarity.</b> One throughline a tired reviewer can repeat out loud after one read.",
     "<b>Structure.</b> Every piece (essay, resume, letters) pointing at the same throughline, nothing wasted.",
     "<b>Storytelling.</b> A narrative scaffold, not a resume in paragraph form, so the reader remembers you at the table."]},

  {t:'lead',
   kick:'Pillar one · clarity',
   h:"If the reviewer cannot summarize you, they cannot champion you.",
   p:"Admissions is a room of advocates. Someone has to argue for you after you leave. Clarity is giving that person one sentence they can carry. We will build yours live."},

  {t:'lead',
   kick:'Pillar two · structure',
   h:"Your file is one argument, told in five documents.",
   p:"The personal statement, the resume, the letters, the addenda, the secondaries. When they contradict or repeat each other, the reader does the work of reconciling you, and tired readers stop. Structure removes that tax."},

  {t:'lead',
   kick:'Pillar three · storytelling',
   h:"Storycraft: the essay is a scene, not a summary.",
   p:"The strongest personal statements drop the reader into a moment and let the credential arrive as consequence. We take you from blank page to a narrative scaffold the committee cannot put down."},

  {t:'list',
   kick:'The other half of the job',
   h:"Admissions red flags that quietly reject strong applicants.",
   list:[
     "<b>The humble-brag essay</b> that is really a resume with feelings.",
     "<b>The letter you did not steer</b>, so it praises the wrong thing.",
     "<b>The unexplained gap or dip</b> left for the committee to imagine the worst.",
     "<b>The generic why-school paragraph</b> that could be pasted into any application."]},

  {t:'lead',
   kick:'Why these cost you',
   h:"A red flag does not get you a rejection letter. It gets you silence.",
   p:"Reviewers rarely argue about a flagged file. They simply move to the next one. The fix is almost never more achievement. It is removing the reasons to hesitate before you ever submit."},

  {t:'reframe',
   kick:'Part three · the turnaround',
   big:"A 3.9 that kept getting waitlisted became a <em>yes</em> with a scholarship.",
   p:"The numbers did not change. The file did. Same candidate, told clearly, structured around one throughline, written as a story a committee remembered. That is the whole move."},

  {t:'list',
   kick:'What we build together',
   h:"From where you are to an applicant schools cannot ignore.",
   list:[
     "<b>Your throughline</b>, written in one sentence you both believe.",
     "<b>Your file audited</b> the way a committee reads it, flags removed first.",
     "<b>Your essays</b> rebuilt on a narrative scaffold with insider feedback.",
     "<b>A timeline</b> so you move early, when advantage is still cheap."]},

  {t:'lead',
   kick:'Why me',
   h:"I built the team I wish every applicant had.",
   p:"GradMissions is specialists in law, med, essays, and interviews, working from the same framework I used inside the committee. You are not getting a tutor. You are getting the reviewer, before the review."},

  {t:'cta',
   kick:'Your next step',
   h:"Bring me your file.",
   cta:"Book a free 20-minute strategy call with GradMissions.",
   p:"On the call we look at where you are, what a committee would see today, and the one or two moves that would change the read. No pressure, just a clear next step.",
   disc:"Educational masterclass only. No admission, scholarship, or financial result is guaranteed. Results vary by applicant, program, cycle, and the work you put in."}
];

const d=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.kick)h+='<div class="kick">'+s.kick+'</div>';
  if(s.h && (s.t==='title'))h+='<h1>'+s.h+'</h1>';
  else if(s.h && s.t!=='stat')h+='<h2>'+s.h+'</h2>';
  if(s.lead)h+='<p class="lead">'+s.lead+'</p>';
  if(s.big)h+='<p class="big">'+s.big+'</p>';
  if(s.stat)h+='<div class="panel"><div class="stat">'+s.stat+'</div><h2 style="margin-top:10px">'+(s.h||'')+'</h2></div>';
  if(s.p)h+='<p>'+s.p+'</p>';
  if(s.list){let u='<ul>';s.list.forEach(x=>u+='<li>'+x+'</li>');u+='</ul>';h+=u;}
  if(s.cta)h+='<p class="cta">'+s.cta+'</p>';
  if(s.disc)h+='<p class="disc">'+s.disc+'</p>';
  h+='<span class="pageno">'+(i+1)+' / '+S.length+'</span>';
  el.innerHTML=h;d.appendChild(el);
});
</script>
</body>
</html>
