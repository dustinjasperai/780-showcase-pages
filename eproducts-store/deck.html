<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Above Selling — a masterclass with Brannon Beliso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f3f3f3;
    --panel:#ffffff;
    --ink:#141414;
    --ink-soft:#3a3a3a;
    --ink-muted:#6c6660;
    --rule:#e4ded6;
    --accent:#bb1010;
  }
  html,body{height:100%}
  body{
    font-family:'Sora',system-ui,sans-serif;
    background:var(--ink);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  #deck{width:100%;max-width:960px;aspect-ratio:16/9;position:relative;background:var(--bg);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .slide{position:absolute;inset:0;padding:62px 72px;display:none;flex-direction:column;background:var(--bg)}
  .slide.on{display:flex}
  .eyebrow{font-family:'Sora';font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .disp{font-family:'Bebas Neue',sans-serif;line-height:.98;letter-spacing:.01em;color:var(--ink)}
  h1.disp{font-size:92px}
  h2.disp{font-size:66px}
  .sub{font-size:21px;color:var(--ink-soft);margin-top:20px;max-width:40ch;line-height:1.5}
  .big{font-size:40px;font-weight:600;line-height:1.2;color:var(--ink);max-width:24ch}
  .body{font-size:20px;color:var(--ink-soft);line-height:1.6;margin-top:18px;max-width:46ch}
  .spacer{flex:1}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:'Sora';font-size:12px;color:var(--ink-muted);letter-spacing:.04em}
  .mat{height:4px;width:64px;background:var(--accent);margin-bottom:26px}
  .num{font-family:'Bebas Neue';font-size:120px;color:var(--accent);line-height:.8}
  ul.pillars{margin-top:14px;list-style:none}
  ul.pillars li{font-size:21px;color:var(--ink-soft);padding:12px 0 12px 28px;border-bottom:1px solid var(--rule);position:relative}
  ul.pillars li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent)}
  ul.pillars li b{color:var(--ink);font-weight:600}
  .cred{font-size:19px;color:var(--ink-soft);line-height:1.7;max-width:48ch}
  .cred b{color:var(--ink);font-weight:600}
  .cta-line{font-size:24px;color:var(--ink);font-weight:600;margin-top:16px}
  .disc{font-family:'Sora';font-size:12px;color:var(--ink-muted);line-height:1.5;margin-top:22px;max-width:52ch}
  .nav{position:fixed;bottom:18px;right:22px;font-family:'Sora';font-size:13px;color:#cfcac4;z-index:5}
  .nav b{color:#fff}
  .panel{background:var(--panel);border:1px solid var(--rule);padding:30px 34px;margin-top:6px}
  .quote{font-size:30px;font-weight:600;color:var(--ink);line-height:1.3;max-width:28ch}
  @media(max-width:700px){.slide{padding:34px 30px}h1.disp{font-size:52px}h2.disp{font-size:40px}.big{font-size:26px}.sub,.body{font-size:16px}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav"><b id="cur">1</b> / <span id="tot">1</span> &nbsp;·&nbsp; arrow keys</div>
<script>
const S=[
  {t:'title'},
  {t:'section',ey:'Who this is for',h:'If you got into this to change lives',sub:'This hour is for the martial arts school owner who feels trapped chasing enrollments, running discounts, and selling harder every month just to stay full.'},
  {t:'big',ey:'The trap',big:'Most owners were taught to grow a school by selling harder.'},
  {t:'body',ey:'The treadmill',h:'And it works, for a while',body:'Discounts bring bodies in. Contracts hold them past the point they wanted to leave. So you sell harder, discount deeper, and lock people in longer. The treadmill never stops, because none of it earned the loyalty it bought.'},
  {t:'quote',ey:'The reframe',quote:'Contracts do not create loyalty. They postpone the goodbye.'},
  {t:'num',ey:'Part One',num:'01',h:'Why selling harder stops working'},
  {t:'body',ey:'The real reason students leave',h:'Price is the excuse, not the reason',body:'Students rarely quit over money. They quit when they stop feeling served, when the classes go stale, when nobody knows their name. No contract fixes that. It only delays the cancellation and sours the goodbye.'},
  {t:'num',ey:'Part Two',num:'02',h:'The model: Service Above Selling'},
  {t:'body',ey:'The one shift',h:'People above profits',body:'Run the business through service instead of selling. Serve the student so completely that staying is the obvious choice and leaving feels like a loss. The money follows the service. It does not lead it.'},
  {t:'pillars',ey:'The model, in three parts',h:'How service becomes a system',pillars:[
    '<b>Service Above Selling.</b> Every touchpoint serves the student first; enrollment is the byproduct of being served, not the goal of a pitch.',
    '<b>The Unique Service Point.</b> Define the WHY of who you are so your school stands out in your community for something only you offer.',
    '<b>Systems-Based Freedom.</b> Build culture, systems, and a team so the service stays consistent at scale and the school runs without you in every room.'
  ]},
  {t:'body',ey:'Pillar one',h:'Service above selling',body:'No contracts. No belt-testing fees. No enrollment pressure. Just an experience worth staying for. It sounds slower. It compounds faster, because a served student renews themselves and brings their friends.'},
  {t:'body',ey:'Pillar two',h:'Your Unique Service Point',body:'Every school in your town teaches kicks and punches. What do you teach that no one else does? Name the WHY, build the brand on it, and families choose you before they ever compare price.'},
  {t:'body',ey:'Pillar three',h:'Systems-based freedom',body:'Culture you can hand down, systems your team can run, and a staff developed to deliver the same service whether you are on the mat or not. That is the difference between owning a school and being owned by it.'},
  {t:'body',ey:'The retention engine',h:'Rotating Curriculum',body:'A curriculum built to rotate keeps students engaged and progressing, so retention stops being a sales job and becomes a design choice. Engaged students do not need to be sold on staying.'},
  {t:'num',ey:'Part Three',num:'03',h:'What a service-built school looks like'},
  {t:'body',ey:'The result',h:'Full classes you did not have to discount',body:'Retention without contracts. Referrals you did not have to beg for. A team that delivers your service when you are not there. Profit that grew because the student experience did, not because the sales script got sharper.'},
  {t:'cred',ey:'Why listen to me',h:'Brannon Beliso',cred:'8th-degree black belt, 56 years in martial arts, and founder of <b>One Martial Arts</b>: two schools, roughly 800 students, and <b>$2M+ a year</b> built <b>without contracts</b>. This system now runs in <b>130+ schools worldwide</b>. Author of <i>Live, Learn, Grow</i>, TEDx speaker, and host of the Success Never Sleeps podcast.'},
  {t:'body',ey:'Where to go from here',h:'The next step',body:'You can run every idea in this hour on your own. If you want a partner who has built it, I work with a small number of owners one-on-one and in a group to put this model in place in their schools.'},
  {t:'cta',h:'Put this model in<br>your school',line:'Apply to work with Brannon in Wisdom (1-on-1) or Group Mentoring.',body:'Visit brannonbeliso.com to start the conversation.',disc:'No income or result is guaranteed. Results vary from school to school and depend on your market, your effort, and your execution. For educational purposes only.'}
];
const B={name:'Brannon Beliso',brand:"It's Time Mentoring",accent:'#bb1010'};
const deck=document.getElementById('deck');
function foot(){return '<div class="spacer"></div><div class="foot"><span>'+B.name+'</span><span>'+B.brand+'</span></div>';}
function render(){
  deck.innerHTML=S.map((s,i)=>{
    let c='';
    if(s.t==='title'){
      c='<div class="mat"></div><h1 class="disp">Service<br>Above<br>Selling</h1><p class="sub">How to build a profitable martial arts school without contracts, discounts, or the hard sell. A live masterclass for school owners.</p>'+foot();
    } else if(s.t==='section'){
      c='<div class="eyebrow">'+s.ey+'</div><h2 class="disp">'+s.h+'</h2><p class="sub">'+s.sub+'</p>'+foot();
    } else if(s.t==='big'){
      c='<div class="eyebrow">'+s.ey+'</div><div class="mat"></div><p class="big">'+s.big+'</p>'+foot();
    } else if(s.t==='quote'){
      c='<div class="eyebrow">'+s.ey+'</div><div class="spacer"></div><p class="quote">'+s.quote+'</p><div class="spacer"></div><div class="foot"><span>'+B.name+'</span><span>'+B.brand+'</span></div>';
    } else if(s.t==='num'){
      c='<div class="eyebrow">'+s.ey+'</div><div class="spacer"></div><div class="num">'+s.num+'</div><h2 class="disp">'+s.h+'</h2><div class="spacer"></div><div class="foot"><span>'+B.name+'</span><span>'+B.brand+'</span></div>';
    } else if(s.t==='body'){
      c='<div class="eyebrow">'+s.ey+'</div><h2 class="disp">'+s.h+'</h2><p class="body">'+s.body+'</p>'+foot();
    } else if(s.t==='pillars'){
      c='<div class="eyebrow">'+s.ey+'</div><h2 class="disp">'+s.h+'</h2><ul class="pillars">'+s.pillars.map(p=>'<li>'+p+'</li>').join('')+'</ul>'+foot();
    } else if(s.t==='cred'){
      c='<div class="eyebrow">'+s.ey+'</div><h2 class="disp">'+s.h+'</h2><p class="cred">'+s.cred+'</p>'+foot();
    } else if(s.t==='cta'){
      c='<div class="eyebrow">Keep going with Brannon</div><div class="mat"></div><h2 class="disp">'+s.h+'</h2><p class="cta-line">'+s.line+'</p><p class="body">'+s.body+'</p><p class="disc">'+s.disc+'</p>'+foot();
    }
    return '<div class="slide'+(i===0?' on':'')+'" data-i="'+i+'">'+c+'</div>';
  }).join('');
  document.getElementById('tot').textContent=S.length;
}
render();
let cur=0;const slides=()=>document.querySelectorAll('.slide');
function show(n){cur=Math.max(0,Math.min(S.length-1,n));slides().forEach((s,i)=>s.classList.toggle('on',i===cur));document.getElementById('cur').textContent=cur+1;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
deck.addEventListener('click',()=>show(cur+1));
</script>
</body>
</html>
