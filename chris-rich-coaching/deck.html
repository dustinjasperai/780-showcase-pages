<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surviving to Thriving — a live masterclass with Chris Rich</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f1f6; --panel:#fbfdfe; --rule:#d7e3ec;
    --ink:#00508a; --deep:#003a63; --accent:#ff6f00; --muted:#5a6b78;
    --head:'Montserrat',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--deep);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 60px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:46px 44px;margin:16px 0;min-height:360px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .slide.hero{background:linear-gradient(180deg,#ffffff 0%,#f3f6f9 100%);border-color:#d7e2ea}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 14px}
  h1{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.1;color:var(--ink);margin:0 0 16px}
  h2{font-family:var(--head);font-weight:700;font-size:27px;line-height:1.18;color:var(--ink);margin:0 0 14px}
  .big{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.15;color:var(--deep);margin:0}
  .big .a{color:var(--accent)}
  p{font-size:18px;color:#36454f;margin:0 0 12px;max-width:62ch}
  .sub{font-size:19px;color:var(--muted)}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:18px;color:#36454f;padding:10px 0 10px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:18px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .pillar{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--rule)}
  .pillar:first-of-type{border-top:none}
  .pnum{font-family:var(--head);font-weight:800;color:var(--ink);font-size:22px;min-width:34px}
  .pbody b{color:var(--deep)}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
  .step{border:1px solid var(--rule);border-radius:12px;padding:14px}
  .step .w{font-family:var(--head);font-weight:700;color:var(--accent);font-size:13px}
  .step .t{font-weight:600;color:var(--deep);margin-top:6px;font-size:15px}
  .foot{font-size:13px;color:#8a97a0;margin-top:22px;font-family:var(--head);letter-spacing:.04em}
  .cta-note{font-size:13px;color:#8a97a0;margin-top:18px;max-width:64ch}
  .page{font-size:12px;color:#aeb8bf;text-align:right;font-family:var(--head)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Chris Rich', h:'Surviving to Thriving',
   sub:'How to save a mixed-faith marriage without waiting for your spouse to come back.'},

  {t:'who', kicker:'Who this is for', h:'You are the one who still wants to fix it.',
   body:['One of you has stepped away from the faith you built your life around.',
         'You feel reactive, stuck, or disconnected, and you are mostly carrying this alone.',
         'You do not want to leave. You just do not know how to do this well.']},

  {t:'trap', kicker:'The trap', h:'You keep waiting for them to change.',
   sub:'So you stay stuck, because the one thing you are waiting for is the one thing you cannot control.'},

  {t:'reframe', big:true, lead:'The hard truth that is also the good news:',
   big_html:'It only takes <span class="a">one person</span> to change the whole dynamic of a marriage.'},

  {t:'part', kicker:'Part one', h:'The faith split feels like grief. That is not an overreaction.'},

  {t:'content', kicker:'Name it first', h:'You are grieving the life you thought you would have.',
   body:['The shared future, the eternal family, the certainty you planned around.',
         'When grief goes unnamed, it comes out as anger, control, or shutting down.',
         'The work starts here, by letting the grief be real instead of rushing past it.']},

  {t:'content', kicker:'Why couples work stalls', h:'Most help assumes two willing partners.',
   body:['Couples therapy needs both people in the room, ready to change together.',
         'But in a mixed-faith marriage, one of you is often not there yet.',
         'So you need an approach built for the person who shows up: you.']},

  {t:'part', kicker:'Part two', h:'The Surviving to Thriving approach.'},

  {t:'pillars', kicker:'The core principle', h:'Start with you, not with their beliefs.',
   pillars:[
     {n:'1', b:'<b>The one-person rule.</b> You change the pattern by changing your side of it, not by converting or convincing them.'},
     {n:'2', b:'<b>Who do you want to be?</b> You decide your own posture in the marriage, regardless of what they believe or choose.'},
     {n:'3', b:'<b>Grief before strategy.</b> You process the loss honestly so it stops leaking into every conversation.'}
   ]},

  {t:'pillars', kicker:'The three thought-traps', h:'The patterns that wreck these conversations.',
   pillars:[
     {n:'·', b:'<b>Defensiveness.</b> Hearing a difference as an attack, so you argue instead of understand.'},
     {n:'·', b:'<b>Mind-reading.</b> Deciding what they think and feel, then reacting to the story in your head.'},
     {n:'·', b:'<b>Black-and-white thinking.</b> All-in or all-out, when the marriage lives in the middle.'}
   ]},

  {t:'content', kicker:'What replaces them', h:'Curiosity, validation, and emotional safety.',
   body:['You get curious about their actual experience instead of assuming it.',
         'You validate the person without having to agree with the belief.',
         'You build enough safety that hard conversations stop ending in a wall.']},

  {t:'pillars', kicker:'What we rebuild in 12 weeks', h:'Four things, in order.',
   pillars:[
     {n:'1', b:'<b>Handle the hard emotions</b> without exploding or numbing out.'},
     {n:'2', b:'<b>Communicate across the faith gap</b> so you are talking, not bracing.'},
     {n:'3', b:'<b>Reconnect</b> without pretending to agree on what you do not.'},
     {n:'4', b:'<b>Meet your own needs again</b> so you are not running on empty.'}
   ]},

  {t:'part', kicker:'Part three', h:'What this actually looks like.'},

  {t:'steps', kicker:'The renovation', h:'From surviving to thriving.',
   steps:[
     {w:'Weeks 1-3', t:'Name the grief and steady yourself'},
     {w:'Weeks 4-6', t:'Defuse the thought-traps'},
     {w:'Weeks 7-9', t:'Rebuild communication and connection'},
     {w:'Weeks 10-12', t:'Thrive on your terms'}
   ], sub:'Weekly 1:1 Zoom sessions, with support between them.'},

  {t:'content', kicker:'Why me', h:'I have lived this, and I coach it for a living.',
   body:['I am a certified coach and I host The Mixed Faith Relationship Podcast, with hundreds of honest conversations on exactly this.',
         'This is not generic marriage advice. It is built for the specific ache of a mixed-faith marriage.',
         'And it is faith-neutral: the goal is never to get anyone back to church.']},

  {t:'content', kicker:'What becomes possible', h:'Go from grief, anger, and resentment to compassion, confidence, and connection.',
   body:['Not a perfect marriage, and not a spouse who suddenly agrees.',
         'A marriage where you are grounded, clear, and connected, whatever they decide.',
         'You stop waiting for them, and you start living your side of it well.']},

  {t:'cta', kicker:'Your next step', h:'Book a clarity call.',
   sub:'A free, 30-minute conversation about where your marriage is and whether Surviving to Thriving is the right fit.',
   note:'This masterclass is educational and reflects one coach\'s approach. It is not therapy and not a substitute for professional care. Results vary from person to person, and nothing here is promised or guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'title' || s.t === 'cta' ? ' hero' : '');
  let html = '';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.t === 'title' || s.t === 'cta') {
    html += '<h1>' + s.h + '</h1>';
    if (s.sub) html += '<p class="sub">' + s.sub + '</p>';
    if (s.note) html += '<div class="cta-note">' + s.note + '</div>';
  } else if (s.t === 'reframe') {
    if (s.lead) html += '<p class="sub">' + s.lead + '</p>';
    html += '<p class="big">' + s.big_html + '</p>';
  } else {
    if (s.h) html += '<h2>' + s.h + '</h2>';
    if (s.sub) html += '<p class="sub">' + s.sub + '</p>';
    if (s.body) { html += '<ul>'; s.body.forEach(b => html += '<li>' + b + '</li>'); html += '</ul>'; }
    if (s.pillars) s.pillars.forEach(p => html += '<div class="pillar"><div class="pnum">' + p.n + '</div><div class="pbody">' + p.b + '</div></div>');
    if (s.steps) { html += '<div class="steps">'; s.steps.forEach(st => html += '<div class="step"><div class="w">' + st.w + '</div><div class="t">' + st.t + '</div></div>'); html += '</div>'; }
  }
  html += '<div class="page">Surviving to Thriving  ·  ' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
