<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POWER, a live masterclass with Kemi Nekvapil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1E7;        /* cream ground, from POWER cover */
    --panel:#FBF8F1;     /* lighter cream panel */
    --ink:#2A2724;       /* charcoal ink + rule */
    --accent:#B88A2D;    /* metallic gold accent, from cover */
    --sage:#AEB796;      /* soft sage secondary, from cover */
    --muted:#6B6457;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--panel);
    border:1px solid rgba(42,39,36,.10);
    border-left:6px solid var(--accent);
    border-radius:14px;
    padding:52px 54px;
    margin:0 0 26px;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(42,39,36,.04);
  }
  .num{font-family:"Archivo",sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:64px;line-height:1.02;
    letter-spacing:.01em}
  h2{font-family:"Archivo",sans-serif;font-weight:700;font-size:38px;line-height:1.08}
  .kick{font-family:"Archivo",sans-serif;font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;font-size:14px;color:var(--muted);margin-bottom:16px}
  p.lead{font-size:27px;line-height:1.42;margin-top:20px;max-width:40ch}
  p.body{font-size:21px;line-height:1.5;margin-top:16px;color:#3b372f;max-width:52ch}
  .sage{color:var(--sage)}
  .big{font-family:"Archivo",sans-serif;font-weight:800;font-size:52px;line-height:1.05}
  ul{margin-top:22px;list-style:none}
  li{font-size:22px;line-height:1.5;padding:10px 0 10px 30px;position:relative;max-width:54ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;
    background:var(--accent);border-radius:50%}
  .pill{display:inline-block;font-family:"Archivo",sans-serif;font-weight:700;font-size:15px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--panel);background:var(--ink);
    padding:7px 16px;border-radius:999px;margin-bottom:22px;align-self:flex-start}
  .word{font-family:"Archivo",sans-serif;font-weight:800;font-size:30px;color:var(--accent);
    letter-spacing:.04em}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:60ch}
  .cap{font-size:18px;color:var(--muted);margin-top:18px}
  @media(max-width:620px){.slide{padding:34px 26px;min-height:0}h1{font-size:42px}h2{font-size:28px}
    .big{font-size:34px}p.lead{font-size:22px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:"A live masterclass with Kemi Nekvapil",
    h1:"POWER",
    lead:"Building power from the inside out, so you can live and lead without apology." },

  {t:'point',
    kick:"In the next hour",
    h2:"What you will leave with.",
    body:"A clear sense of where your power is actually coming from, the five principles that build the kind that lasts, and one honest practice you can use the moment you close this session." },

  {t:'who',
    kick:"Who this is for",
    h2:"You lead, and you still apologise for taking up space.",
    body:"This is for women executives and entrepreneurs who have the title, the results and the room, and who still feel they have to shrink, over give, or earn the right to be there." },

  {t:'point',
    kick:"The double bind",
    h2:"Assert yourself and you are too much. Hold back and you disappear.",
    body:"Every woman in a senior room knows the trap. The usual advice is to manage how you come across. That is still borrowed power. It keeps you performing for a room instead of leading from inside it." },

  {t:'lead',
    pill:"The reframe",
    big:"The world does not need more busy women.",
    lead:"It needs present and powerful ones. The power you were given can be taken away. The power you build from the inside cannot." },

  {t:'part',
    kick:"Part one",
    h2:"Borrowed power is fragile.",
    body:"Most of us run on power that came from outside us. A title, a boss's approval, a client's yes, being needed. It feels like strength, until the title changes or the approval is withdrawn, and it is gone." },

  {t:'point',
    kick:"The cost",
    h2:"So we over give, and quietly disappear.",
    body:"When power lives outside you, you people please to keep it. You say yes when you mean no. You apologise for your own needs. You get busy instead of present, and the busier you get, the less of you is actually in the room." },

  {t:'framework',
    kick:"Part two",
    h2:"POWER is built from the inside out.",
    body:"Power you cultivate yourself is stronger and more enduring than any that is handed to you. It rests on five principles.",
    words:["Presence","Ownership","Wisdom","Equality","Responsibility"] },

  {t:'principle',
    word:"Presence",
    h2:"Being fully here, not merely busy.",
    body:"Presence is the practice of bringing all of yourself to the moment you are in, instead of leaking your attention across everything you are not. It is where real authority begins." },

  {t:'principle',
    word:"Ownership",
    h2:"Taking responsibility for your choices.",
    body:"Ownership is claiming your decisions, your wants and your story as yours, rather than waiting for permission or handing the pen to someone else." },

  {t:'principle',
    word:"Wisdom",
    h2:"Trusting what you already know.",
    body:"Wisdom is developing the understanding and perspective to lead from discernment rather than fear, and to tell the difference between the two." },

  {t:'principle',
    word:"Equality",
    h2:"Recognising your inherent worth.",
    body:"Equality is knowing you belong in the room on equal footing, not because of what you produce, but because of who you already are." },

  {t:'principle',
    word:"Responsibility",
    h2:"Using your power as a force for good.",
    body:"Responsibility is turning the power you build outward, so that as you rise you make room for the women and the people around you to rise too." },

  {t:'framework',
    kick:"The five together",
    h2:"Present, owned, wise, equal, responsible.",
    body:"No single principle carries it. Held together, they become a way of leading that does not depend on a title, a mood, or who approves of you today.",
    words:["Presence","Ownership","Wisdom","Equality","Responsibility"] },

  {t:'point',
    kick:"The asking",
    h2:"Power asks for what it needs.",
    body:"Women are taught to earn through giving. The gift of asking is the practice of naming your wants and needs and asking for them, plainly, without guilt. Nothing drains inside out power faster than never asking for anything." },

  {t:'looks',
    kick:"Part three",
    h2:"What leading without apology looks like.",
    body:"You stop auditioning for a seat you already hold. You make clean decisions. You ask directly. You are present instead of frantic, and people feel it. Your power stops depending on who is in the room." },

  {t:'credibility',
    kick:"Who is teaching this",
    h2:"Kemi Nekvapil",
    body:"ICF credentialled coach for female executives and entrepreneurs, and a Certified Dare to Lead facilitator. Author of POWER and The Gift of Asking with Penguin, with a foreword by Elizabeth Gilbert, and host of the podcast The Shift Series." },

  {t:'cta',
    kick:"Your next step with Kemi",
    h2:"Work with Kemi.",
    body:"If this is the way you want to lead, there are two ways forward. Book a discovery call for the Powerful Partnership Program, her one to one work, or join the Gift of Asking Program.",
    disc:"This masterclass is for educational purposes only. No income, role, or result is guaranteed. Results vary from person to person, and nothing here is a promise of any particular outcome." }
];

const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide";
  let html = '<div class="num">' + String(i+1).padStart(2,"0") + " / " + String(S.length).padStart(2,"0") + "</div>";
  if (s.pill) html += '<span class="pill">' + s.pill + "</span>";
  if (s.kick) html += '<div class="kick">' + s.kick + "</div>";
  if (s.h1) html += "<h1>" + s.h1 + "</h1>";
  if (s.big) html += '<div class="big">' + s.big + "</div>";
  if (s.h2) html += "<h2>" + s.h2 + "</h2>";
  if (s.word) html += '<div class="word">' + s.word + "</div>";
  if (s.lead) html += '<p class="lead">' + s.lead + "</p>";
  if (s.body) html += '<p class="body">' + s.body + "</p>";
  if (s.words) {
    html += "<ul>";
    s.words.forEach(w => { html += "<li>" + w + "</li>"; });
    html += "</ul>";
  }
  if (s.disc) html += '<div class="disc">' + s.disc + "</div>";
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
