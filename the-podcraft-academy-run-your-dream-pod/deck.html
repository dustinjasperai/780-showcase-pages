<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Most Podcasts Stall — The Podcast Host Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b2432; --panel:#222e40; --panel2:#283650; --rule:#5a687c;
    --accent:#6a1fd6; --accent2:#007db7; --ink:#eef1f6; --muted:#9aa6b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:#0f1521;color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid rgba(90,104,124,.28);
    border-radius:18px;padding:60px 60px;margin:0 0 26px;min-height:560px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .kick.teal{color:var(--accent2)}
  h1{font-weight:900;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-weight:800;font-size:38px;line-height:1.1;letter-spacing:-.01em;margin-bottom:18px}
  .sub{font-size:21px;font-weight:500;color:var(--muted);max-width:42ch}
  .body{font-size:20px;font-weight:400;color:#d7deea;max-width:46ch;margin-top:6px}
  .body.big{font-size:27px;font-weight:600;color:var(--ink);max-width:40ch}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:48ch}
  li{position:relative;padding-left:30px;font-size:19px;color:#d7deea}
  li::before{content:"";position:absolute;left:0;top:11px;width:13px;height:13px;border-radius:3px;background:var(--accent)}
  .note{margin-top:30px;font-size:15px;color:var(--muted);max-width:52ch}
  /* part divider */
  .slide.part{align-items:flex-start;justify-content:center;background:linear-gradient(135deg,#222e40, #1b2432)}
  .slide.part h2{font-size:46px}
  .partno{font-size:120px;font-weight:900;color:rgba(106,31,214,.22);line-height:.8;margin-bottom:10px}
  /* stage rail */
  .rail{display:flex;gap:0;margin-top:34px;flex-wrap:wrap}
  .stage{flex:1 1 160px;background:var(--panel);border:1px solid rgba(90,104,124,.3);border-radius:12px;padding:20px 18px;margin-right:12px;margin-bottom:12px;min-width:150px}
  .stage .n{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--accent2);text-transform:uppercase}
  .stage .t{font-size:20px;font-weight:800;margin-top:8px}
  .stage .d{font-size:14px;color:var(--muted);margin-top:8px}
  /* cards grid */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
  .card{background:var(--panel);border:1px solid rgba(90,104,124,.3);border-radius:14px;padding:24px 20px}
  .card .t{font-size:21px;font-weight:800;color:var(--ink)}
  .card .a{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .card .d{font-size:15px;color:var(--muted);margin-top:10px;line-height:1.45}
  /* meter motif */
  .meter{display:flex;gap:6px;align-items:flex-end;height:46px;margin-bottom:30px}
  .meter i{display:block;width:9px;border-radius:3px;background:var(--accent);opacity:.9}
  .big-stat{font-weight:900;font-size:88px;color:var(--accent);line-height:.9;letter-spacing:-.02em}
  .cta-box{margin-top:30px;background:var(--panel2);border:1px solid rgba(106,31,214,.5);border-radius:14px;padding:26px 28px;max-width:46ch}
  .cta-box .step{font-size:22px;font-weight:800}
  .cta-box .d{font-size:16px;color:var(--muted);margin-top:8px}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .foot{position:absolute;right:26px;bottom:20px;font-size:12px;color:var(--rule);letter-spacing:.08em}
  @media(max-width:720px){
    .slide{padding:40px 28px;min-height:480px}
    h1{font-size:36px}h2{font-size:28px}.cards{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'The Podcast Host',
    h:'Why Most Podcasts Stall',
    sub:'And the execution system that keeps a show launching, growing, and earning. A live masterclass with Colin Gray.'
  },
  {t:'who', kick:'Who this is for',
    h:'If this is you, you are in the right room',
    list:[
      'You launched a show, or you are about to, and you want it to actually last',
      'You have taken the courses and bought the gear, and you are still stuck',
      'You can make one good episode. You cannot yet make fifty',
      'You want the show to grow an audience and one day pay you back'
    ]
  },
  {t:'trap', kick:'The trap',
    h:'You did everything they told you to do',
    body:'You picked a topic. You bought a decent mic. You watched the tutorials and recorded a few episodes. Then life happened, the gap between episodes got longer, and the momentum quietly died.',
    note:'Almost nobody quits podcasting on purpose. They just stop shipping.'
  },
  {t:'hook', kick:'The reframe',
    h:'Podcasting is not a knowledge problem',
    body:'big|You do not need another course. You need a system that keeps you shipping when motivation runs out.',
    note:'Gear, talent, and ideas are not what separate the shows that last from the shows that fade. Consistency is.'
  },
  {t:'part', no:'01', kick:'Part One',
    h:'Why shows stall'
  },
  {t:'problem', kick:'The real reason',
    h:'The problem was never the first episode',
    body:'The first episode is exciting, so it gets made. Episode twelve is a Tuesday with no energy and no plan, so it does not. Without a repeatable process, every episode depends on willpower, and willpower is the one input you cannot schedule.'
  },
  {t:'stat', kick:'The cliff',
    stat:'Ep. 7',
    h:'is where most shows go quiet',
    body:'The drop-off is not about ability. It is the point where novelty wears off and no system has taken its place. The shows that cross it are not more talented. They are more consistent.'
  },
  {t:'part', no:'02', kick:'Part Two',
    h:'The Podcraft system'
  },
  {t:'journey', kick:'The journey',
    h:'Four stages, built in order',
    sub:'A show grows as a sequence of skills, not one lucky launch.',
    stages:[
      {n:'01', t:'Plan & Launch', d:'From idea to a well produced show that is live everywhere.'},
      {n:'02', t:'Produce & Edit', d:'A repeatable workflow so episodes get finished, not abandoned.'},
      {n:'03', t:'Present', d:'Hosting and interview craft that keeps listeners coming back.'},
      {n:'04', t:'Grow & Monetise', d:'Audience growth and revenue, once the habit is solid.'}
    ]
  },
  {t:'cards', kick:'The blueprints',
    h:'Three Mastery blueprints',
    sub:'Each one is an end to end path for a single outcome.',
    cards:[
      {a:'Blueprint 01', t:'Launch', d:'Get the show planned, recorded, and live without stalling halfway.'},
      {a:'Blueprint 02', t:'Grow', d:'Turn a live show into one that steadily adds listeners.'},
      {a:'Blueprint 03', t:'Earn', d:'Build revenue on top of a show that is already consistent.'}
    ]
  },
  {t:'mechanic', kick:'The signature move',
    h:'4-Minute Feedback',
    body:'big|Fast, specific critique on your actual show, in about four minutes.',
    note:'A long course module tells you what good looks like once. Tight, frequent feedback on your own episodes is what actually changes the next one. This is the mechanism that keeps members shipping instead of studying.'
  },
  {t:'cards', kick:'The toolkit', teal:true,
    h:'A tactic for every stage',
    sub:'When you are ready to grow, you pick one and execute, not guess.',
    cards:[
      {a:'45+ tactics', t:'Growth Tactics Databank', d:'Named growth tactics across SEO, social, reviews, and collaborations, each broken into defined steps.'},
      {a:'Sequenced', t:'Growth Roadmaps', d:'Which tactic to run, and when, so effort compounds instead of scattering.'},
      {a:'Monthly', t:'Episode Teardowns', d:'Deep dive critiques of real episodes so you learn from live examples.'}
    ]
  },
  {t:'problem', kick:'The glue', teal:true,
    h:'Accountability is the part nobody sells',
    body:'Every tactic and blueprint above only works if you keep moving. The accountability system tracks your progress and keeps the next episode on the calendar, so the show stops depending on how you feel that week.'
  },
  {t:'part', no:'03', kick:'Part Three', h:'A show that keeps going'
  },
  {t:'looks', kick:'The payoff',
    h:'A show that runs like a habit',
    list:[
      'Episodes ship on a schedule, not on a mood',
      'Growth comes from tactics you chose on purpose, not luck',
      'Your back catalogue works for you while you sleep',
      'And earning becomes a question of when, not if'
    ]
  },
  {t:'whyme', kick:'Why listen to me',
    h:'Colin Gray, The Podcast Host',
    body:'I started The Podcast Host in 2007 and have spent more than fifteen years helping people plan, launch, and grow shows. I co-host the weekly Podcraft podcast, and I built the Podcraft Academy for the people who were tired of learning and ready to actually get it done.',
    note:'This masterclass is a sample of how I teach. The full system lives inside the Academy.'
  },
  {t:'recap', kick:'In one line',
    h:'Consistency beats talent, every time',
    body:'big|Launch it, grow it, and keep it going, with a system that does not rely on willpower.'
  },
  {t:'cta', kick:'Your next step',
    h:'Join the Podcraft Academy',
    step:'Come inside and put the system to work on your own show.',
    stepd:'Get the Launch, Grow, and Earn blueprints, the Growth Tactics Databank, monthly Episode Teardowns, and your own 4-Minute Feedback. Start wherever your show is today.',
    disc:'Educational content only. No income or result is guaranteed. Results vary and depend on the work you put in. Nothing here is financial advice.'
  }
];

function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function bodyHtml(b){
  if(!b) return '';
  if(b.indexOf('big|')===0) return '<p class="body big">'+esc(b.slice(4))+'</p>';
  return '<p class="body">'+esc(b)+'</p>';
}
function meter(){
  var h=[18,30,22,40,28,46,34,24,38,20,44,30];
  return '<div class="meter">'+h.map(function(x){return '<i style="height:'+x+'px"></i>'}).join('')+'</div>';
}
function listHtml(l){return l&&l.length?'<ul>'+l.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>':''}
function render(){
  var out = S.map(function(s,idx){
    var teal = s.teal ? ' teal':'';
    var kick = s.kick ? '<div class="kick'+teal+'">'+esc(s.kick)+'</div>':'';
    var inner='';
    if(s.t==='title'){
      inner = meter()+kick+'<h1>'+esc(s.h)+'</h1><p class="sub">'+esc(s.sub)+'</p>';
    } else if(s.t==='part'){
      inner = '<div class="partno">'+esc(s.no)+'</div>'+kick+'<h2>'+esc(s.h)+'</h2>';
    } else if(s.t==='who'||s.t==='looks'){
      inner = kick+'<h2>'+esc(s.h)+'</h2>'+listHtml(s.list);
    } else if(s.t==='journey'){
      var rail = '<div class="rail">'+s.stages.map(function(st){
        return '<div class="stage"><div class="n">'+esc(st.n)+'</div><div class="t">'+esc(st.t)+'</div><div class="d">'+esc(st.d)+'</div></div>';
      }).join('')+'</div>';
      inner = kick+'<h2>'+esc(s.h)+'</h2>'+(s.sub?'<p class="sub">'+esc(s.sub)+'</p>':'')+rail;
    } else if(s.t==='cards'){
      var cards = '<div class="cards">'+s.cards.map(function(c){
        return '<div class="card"><div class="a">'+esc(c.a)+'</div><div class="t">'+esc(c.t)+'</div><div class="d">'+esc(c.d)+'</div></div>';
      }).join('')+'</div>';
      inner = kick+'<h2>'+esc(s.h)+'</h2>'+(s.sub?'<p class="sub">'+esc(s.sub)+'</p>':'')+cards;
    } else if(s.t==='stat'){
      inner = kick+'<div class="big-stat">'+esc(s.stat)+'</div><h2>'+esc(s.h)+'</h2>'+bodyHtml(s.body);
    } else if(s.t==='cta'){
      inner = kick+'<h2>'+esc(s.h)+'</h2>'+
        '<div class="cta-box"><div class="step">'+esc(s.step)+'</div><div class="d">'+esc(s.stepd)+'</div></div>'+
        '<p class="disc">'+esc(s.disc)+'</p>';
    } else {
      inner = kick+'<h2>'+esc(s.h)+'</h2>'+bodyHtml(s.body)+(s.note?'<p class="note">'+esc(s.note)+'</p>':'');
    }
    return '<section class="slide '+(s.t==='part'?'part':'')+'">'+inner+'<div class="foot">'+String(idx+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div></section>';
  }).join('');
  document.getElementById('deck').innerHTML = out;
}
render();
</script>
</body>
</html>
