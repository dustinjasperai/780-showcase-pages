<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belohnungsbasiertes Training – die volle Tiefe | Leben mit Hunden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#13243A;        /* ground, derived from brand footer #161E2A */
    --panel:#1C3350;     /* panel */
    --rule:#2C4A6B;      /* rule */
    --accent:#DC9E17;    /* brand gold */
    --ink:#F6F3EC;       /* warm off-white */
    --muted:#A9B8CC;
    --disp:'Rajdhani',sans-serif;
    --body:'Open Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);scroll-behavior:smooth}
  #deck{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}
  .slide{scroll-snap-align:start;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:7vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .eyebrow{font-family:var(--disp);letter-spacing:.22em;text-transform:uppercase;font-size:.8rem;
    color:var(--accent);font-weight:600;margin-bottom:1.4rem;display:flex;align-items:center;gap:.6rem}
  .eyebrow::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
  h1{font-family:var(--disp);font-weight:700;font-size:clamp(2.1rem,5.4vw,4rem);line-height:1.04;max-width:16ch}
  h2{font-family:var(--disp);font-weight:700;font-size:clamp(1.7rem,4vw,2.9rem);line-height:1.08;max-width:20ch}
  .lede{font-size:clamp(1.05rem,1.7vw,1.45rem);color:var(--muted);margin-top:1.5rem;max-width:46ch;line-height:1.5}
  .body{font-size:clamp(1rem,1.4vw,1.2rem);margin-top:1.3rem;max-width:52ch;line-height:1.6}
  .pillars{display:grid;gap:1rem;margin-top:1.8rem;max-width:60ch}
  .pill{background:var(--panel);border-left:3px solid var(--accent);padding:1rem 1.2rem;border-radius:4px}
  .pill b{font-family:var(--disp);font-weight:600;font-size:1.25rem;color:var(--ink);letter-spacing:.01em}
  .pill span{display:block;color:var(--muted);margin-top:.3rem;font-size:1rem;line-height:1.5}
  .big{font-family:var(--disp);font-weight:700;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.02;max-width:17ch}
  .tick{color:var(--accent)}
  .num{font-family:var(--disp);color:var(--accent);font-weight:600;font-size:1rem;letter-spacing:.2em;margin-bottom:.8rem}
  .cta{background:var(--panel)}
  .cta h2{color:var(--ink)}
  .disclaimer{margin-top:2rem;color:var(--muted);font-size:.82rem;max-width:60ch;line-height:1.5;border-top:1px solid var(--rule);padding-top:1rem}
  .foot{position:absolute;bottom:3vh;left:9vw;font-family:var(--disp);letter-spacing:.14em;text-transform:uppercase;
    font-size:.72rem;color:var(--muted)}
  .credlist{margin-top:1.4rem;max-width:52ch;line-height:1.7;color:var(--ink)}
  .credlist li{margin-left:1.1rem;margin-bottom:.4rem}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'Kostenlose Live-Masterclass',h:'Belohnungsbasiertes Training – die volle Tiefe',lede:'Warum die meisten „positiven" Trainer:innen nur einen Bruchteil ausschöpfen – und wie professionelles R+ Training wirklich aussieht.'},
 {t:'for',eyebrow:'Für wen das ist',h:'Für Trainer:innen, die mehr wollen als „positiv"',body:'Du arbeitest bereits belohnungsbasiert. Du spürst aber, dass da noch mehr geht: sauberere Mechanik, klarere Kriterien, Hunde, die freudig mitarbeiten statt nur Leckerli abzuwarten. Diese Stunde ist für dich.'},
 {t:'agenda',eyebrow:'Was dich erwartet',h:'In der nächsten Stunde',pillars:[
    ['Das Kernproblem','Warum flaches R+ Training stockt – und was Tiefe wirklich bedeutet.'],
    ['Die vier Konzepte','Shaping, fehlerfreies Lernen, Wahlfreiheit & Kontrolle, Signale als Verstärker.'],
    ['Die Mechanik','Wie du mit PORTL dein Timing schulst, bevor der Hund ins Spiel kommt.']
 ]},
 {t:'trap',eyebrow:'Die Falle',h:'„Positiv" wird oft flach gelernt',body:'Viele lernen belohnungsbasiertes Training als „gib dem Hund ein Leckerli, wenn es klappt". Das funktioniert kurz, und stockt dann. Das Training wird unzuverlässig, der Hund frustriert, und die Methode bekommt zu Unrecht den Ruf, „nicht konsequent genug" zu sein.'},
 {t:'reframe',eyebrow:'Der Perspektivwechsel',big:'Belohnungs&shy;basiert heisst nicht „Leckerli geben".'},
 {t:'reframe2',body:'Es ist ein wissenschaftlich fundiertes System: Verhalten gezielt aufbauen, Fehler vermeiden statt korrigieren, dem Tier Wahlfreiheit und Kontrolle geben. Richtig eingesetzt ist es die zuverlässigste und fairste Art zu trainieren, die es gibt.'},
 {t:'part',num:'Teil Eins',h:'Das Kernproblem: Tiefe statt Oberfläche',lede:'Der Unterschied zwischen einem Hobby-Clicker und professionellem R+ Training liegt nicht in der Freundlichkeit. Er liegt in vier Konzepten.'},
 {t:'cost',eyebrow:'Teil Eins',h:'Was flaches Training kostet',body:'Ohne Plan steigt die Belohnungsrate nie sauber, Kriterien verschwimmen, und der Hund rät. Das Ergebnis: Verhalten, das im Kurs klappt und im Alltag zusammenbricht. Nicht weil R+ nicht funktioniert, sondern weil nur die Oberfläche genutzt wird.'},
 {t:'part',num:'Teil Zwei',h:'Die vier Konzepte',lede:'Worauf professionelles, belohnungsbasiertes Training steht.'},
 {t:'pone',eyebrow:'Konzept 1',h:'Shaping',body:'Verhalten in kleinen Annäherungen aufbauen, mit einem Plan statt mit Zufall. Wer Kriterien bewusst und sauber steigert, bekommt zuverlässiges, stabiles Verhalten, das auch unter Ablenkung hält.'},
 {t:'pone',eyebrow:'Konzept 2',h:'Fehlerfreies Lernen',body:'Die Umgebung so gestalten, dass der Hund gar nicht erst scheitert. Weniger Frust, schnellere Fortschritte und ein Tier, das mit Freude statt mit Vermeidung lernt.'},
 {t:'pone',eyebrow:'Konzept 3',h:'Wahlfreiheit & Kontrolle',body:'Dem Tier echte Mitbestimmung und Kontrollerlebnisse geben. Ein Hund, der mitentscheiden darf, arbeitet entspannter, sicherer und motivierter mit, gerade in schwierigen Situationen.'},
 {t:'pone',eyebrow:'Konzept 4',h:'Signale als Verstärker',body:'Gelernte Signale werden selbst zur Belohnung. So wird dein Training Schritt für Schritt unabhängiger vom Futter und im echten Alltag tragfähig.'},
 {t:'portl',eyebrow:'Teil Zwei – die Mechanik',h:'PORTL: erst die Hand, dann der Hund',body:'Mit dem Trainingsspiel PORTL schulst du Timing, Kriterien und deine Belohnungsrate, ohne Tier, am Tisch. Wenn die Mechanik sitzt, überträgt sie sich auf jeden Hund. Das ist der Schritt, den die meisten überspringen.'},
 {t:'part',num:'Teil Drei',h:'Wie sich das im Training anfühlt',lede:'Ein Hund, der freudig und selbstständig mitarbeitet. Ein:e Trainer:in, die weiss, warum etwas funktioniert und es im nächsten Fall wieder hinbekommt.'},
 {t:'obj',eyebrow:'Die häufigste Frage',h:'„Ist das konsequent genug?"',body:'Ja, und zwar konsequenter als Korrektur. Klare Kriterien, sauberes Timing und Wahlfreiheit erzeugen Verlässlichkeit, ohne dem Hund Angst zu machen. Konsequenz liegt im Plan, nicht im Druck.'},
 {t:'recap',eyebrow:'Zusammengefasst',h:'Die volle Tiefe von R+',pillars:[
    ['Plan statt Zufall','Shaping & fehlerfreies Lernen geben dir verlässliche Ergebnisse.'],
    ['Partner statt Befehlsempfänger','Wahlfreiheit & Kontrolle machen den Hund zum Team-Partner.'],
    ['Alltagstauglich','Signale als Verstärker lösen dich vom Dauer-Futter.']
 ]},
 {t:'cred',eyebrow:'Warum wir',h:'Nadine Hehli & Simone Fasel',body:'Pionierinnen des belohnungsbasierten Trainings im deutschsprachigen Raum.',cred:[
    'Über 15 Jahre Praxis, Wissenschaft und internationale Seminare',
    'Seit 2012 Ausbildung von Trainer:innen, über 200 Absolvent:innen',
    'R+Expert* in Kooperation mit dem BHV e.V.',
    'Hoopers Schweiz: eigener Hundesport, international etabliert seit 2010'
 ]},
 {t:'path',eyebrow:'Der Weg zum Standard',h:'Was R+Expert* ist',body:'Der zweijährige Lehrgang bringt genau diese Konzepte in Theorie und Praxis auf ein anerkanntes, berufliches Niveau, online lernbar mit optionalen Live-Workshops. Die Masterclass ist dein Einstieg in dieses Denken.'},
 {t:'cta',eyebrow:'Dein nächster Schritt',h:'Trainiere R+ auf professionellem Niveau',body:'Wenn du das vollständig lernen und zu einem anerkannten Standard umsetzen möchtest, ist der R+Expert*-Lehrgang der nächste Schritt. Sichere dir deinen Platz auf der Warteliste und sei bei der nächsten Runde dabei.',disclaimer:'For educational purposes only. No specific training or business result is guaranteed. Results vary by dog, handler, and implementation. / Diese Masterclass dient ausschliesslich der Weiterbildung; Ergebnisse variieren je nach Hund, Mensch und Umsetzung.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num) h+=`<div class="num">${s.num}</div>`;
  if(s.big) h+=`<div class="big">${s.big}</div>`;
  if(s.h) h+= (s.t==='title')?`<h1>${s.h}</h1>`:`<h2>${s.h}</h2>`;
  if(s.lede) h+=`<p class="lede">${s.lede}</p>`;
  if(s.body) h+=`<p class="body">${s.body}</p>`;
  if(s.pillars){h+='<div class="pillars">';s.pillars.forEach(p=>{h+=`<div class="pill"><b>${p[0]}</b><span>${p[1]}</span></div>`});h+='</div>';}
  if(s.cred){h+='<ul class="credlist">';s.cred.forEach(c=>{h+=`<li>${c}</li>`});h+='</ul>';}
  if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  h+=`<div class="foot">Leben mit Hunden · R+Expert* · ${i+1}/${S.length}</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
