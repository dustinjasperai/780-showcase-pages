<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The CEO Shift - a ProfitPro masterclass with Des O'Neill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfcfe; --panel:#eef3fb; --rule:#d4ddee; --accent:#0552ba; --ink:#0c0d0e;
    --muted:#4a5366;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:48px 52px;margin:0 0 22px;
         box-shadow:0 1px 2px rgba(5,82,186,.04)}
  .kick{font-family:"Public Sans";font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--accent);margin-bottom:14px}
  h1{font-family:"Libre Caslon Display";font-weight:600;font-size:46px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:"Libre Caslon Display";font-weight:600;font-size:32px;line-height:1.12;letter-spacing:-.01em}
  .lede{font-family:"Libre Caslon Display";font-size:22px;line-height:1.4;color:var(--muted);margin-top:16px}
  p.body{font-size:17px;line-height:1.6;color:#262b36;margin-top:14px;max-width:62ch}
  ul{margin:18px 0 0 0;list-style:none}
  li{font-size:17px;line-height:1.5;color:#262b36;padding:10px 0 10px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:0}
  li:before{content:"";position:absolute;left:0;top:18px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .step{display:flex;gap:18px;align-items:baseline}
  .num{font-family:"Libre Caslon Display";font-weight:600;font-size:40px;color:var(--accent);min-width:54px}
  .title h1{margin-top:8px}
  .by{margin-top:26px;font-weight:600;color:var(--accent)}
  .by small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
  .panel{background:var(--panel);border-radius:10px;padding:22px 24px;margin-top:20px}
  .quote{font-family:"Libre Caslon Display";font-size:24px;line-height:1.35;color:var(--ink)}
  .cite{margin-top:12px;color:var(--muted);font-size:15px}
  .disc{margin-top:22px;color:var(--muted);font-size:13px;line-height:1.5;border-top:1px solid var(--rule);padding-top:16px}
  .cta h1{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A ProfitPro Masterclass', h:'The CEO Shift',
   lede:'How accounting and bookkeeping firm owners stop being the bottleneck and build a profitable, self-managing, built-to-sell firm.',
   by:'Des O’Neill', bysub:'ACCA, CPA, ACA. Founder of ProfitPro. 26 years in and alongside firms of every size.'},

  {t:'who', kick:'Who this is for', h:'You built the firm. Now it runs you.',
   body:'This is for firm owners who are good at the work and tired of being the engine of it. Sole practitioners who want an external reference point. Multi-partner firms that want everyone pulling the same way. Established firms thinking about succession. If taking two days out of your business feels impossible, that is the sign you need this most.'},

  {t:'trap', kick:'The trap', h:'More clients did not buy you more freedom.',
   body:'Every review, every tricky query, every decision still routes through you. So more clients means more hours, not more profit and not more choice. The firm grows and your week gets worse. That is not a work ethic problem. You are working as hard as anyone could.'},

  {t:'hook', kick:'The reframe', h:'You do not have a workload problem. You have a sequence problem.',
   lede:'Most firm owners already own the right tools. They just use them in the wrong order. Do the right things in the wrong sequence and the bottleneck simply moves.'},

  {t:'p1', kick:'Part one, the real problem', h:'The Treadmill',
   body:'On the Treadmill you work in the business instead of on it. Capacity is capped by your own hours, so the only way to grow is to work more. Worse, the firm is not an asset you could sell. It is a job that happens to have your name on the door, and it cannot run a day without you.'},

  {t:'p1b', kick:'Why the usual fixes stall', h:'Hire, hustle, buy software, repeat.',
   body:'The common moves are not wrong, they are just out of order. Hire into a messy client base and you scale the mess. Add software before you fix your processes and you automate confusion. Each fix applied too early just relocates the bottleneck back to you.'},

  {t:'p2', kick:'Part two, the method', h:'The CEO Shift, in order',
   lede:'Six moves, in the sequence that actually compounds. This is the path from technician to owner of a business that works without you.'},

  {t:'step', num:'1', h:'Fix who you serve first',
   body:'The Red Velvet Rope. Before anything else, sort your client base and deal with the D-class clients quietly draining your profit and your energy. You cannot systemize or scale a client list that should not exist. Everything downstream gets easier once this is done.'},

  {t:'step', num:'2', h:'Reprice on value, not hours',
   body:'The Price-Rise Conversation and the Price-Rise Calculator. A calm, non-confrontational way to move clients onto fees that reflect the value you create. For most firms this is where the first large, hidden block of profit is sitting, with no extra staff required.'},

  {t:'step', num:'3', h:'Optimise the six levers',
   body:'The 6 Ps. Run the firm against Profits, People, Cashflows, Growth, Value and Choices. These are the levers a CEO actually pulls. When you manage the firm by these, decisions stop being reactive and start being deliberate.'},

  {t:'step', num:'4', h:'Systemise so it is not you',
   body:'Build the processes and systems of a self-managing firm so delivery, review and client care stop running through your inbox. The goal is simple and specific. The work gets done to standard whether or not you are in the room.'},

  {t:'step', num:'5', h:'Automate with a thinking partner',
   body:'The Thinking Partner approach. Once the base is clean and systemised, AI and automation compress strategic and admin work from hours into minutes. Applied last, in order, it multiplies a working system instead of speeding up a broken one.'},

  {t:'step', num:'6', h:'Build it to sell',
   body:'A firm that runs without you is, by definition, a saleable asset. Built to Sell is not only about selling. It is about owning something valuable enough that staying or selling becomes your choice, on your terms and your timeline.'},

  {t:'p3', kick:'Part three, the result', h:'What a firm looks like after the shift',
   body:'More profit from the clients you already have. Fewer hours tied to delivery. A team that owns the standard. A firm that keeps running when you take two weeks off, and a number on the table if you ever decide to sell. You stop being the best technician in the building and start being its CEO.'},

  {t:'why', kick:'Why listen to this', h:'Des O’Neill',
   body:'An accountant himself, qualified ACCA, CPA and ACA, with 26 years working in and alongside firms from the Big Four to the smallest practice. Across roughly twenty years he has worked closely with thousands of accountancy and bookkeeping firms and seen exactly what the best ones do differently, and in what order.'},

  {t:'proof', kick:'In their words', q:'If you wish to ratchet up your practice, just go.',
   cite:'Eilis Quinlan, accountancy firm owner, on working with Des and ProfitPro.'},

  {t:'proof', kick:'In their words', q:'The topics are relevant to the profession, and the single most valuable part is speaking with other firm owners on the same journey.',
   cite:'Michael Dempsey, ProfitPro member.'},

  {t:'cta', kick:'Your next step', h:'Make the shift with ProfitPro',
   body:'If this is the order your firm needs, the next step is to work it through with Des and the ProfitPro community. Join ProfitPro to get the frameworks, the tools and the room full of firm owners doing the same, or book a call to talk through where your firm is now.',
   disc:'Educational content only. Every firm is different and results vary with your market, your clients and the work you put in. Nothing here is a guarantee of profit, revenue or sale value.'}
];

const el = document.getElementById('deck');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
S.forEach(function(s){
  var d = document.createElement('section');
  d.className = 'slide ' + (s.t==='title'?'title':'') + (s.t==='cta'?' cta':'');
  var html = '';
  if(s.kick) html += '<div class="kick">'+esc(s.kick)+'</div>';
  if(s.t==='step'){
    html += '<div class="step"><div class="num">'+esc(s.num)+'</div><div><h2>'+esc(s.h)+'</h2>';
    if(s.body) html += '<p class="body">'+esc(s.body)+'</p>';
    html += '</div></div>';
  } else if(s.t==='proof'){
    html += '<div class="panel"><div class="quote">“'+esc(s.q)+'”</div><div class="cite">'+esc(s.cite)+'</div></div>';
  } else {
    if(s.h){ html += (s.t==='title'?'<h1>':'<h2>')+esc(s.h)+(s.t==='title'?'</h1>':'</h2>'); }
    if(s.lede) html += '<p class="lede">'+esc(s.lede)+'</p>';
    if(s.body) html += '<p class="body">'+esc(s.body)+'</p>';
    if(s.by) html += '<div class="by">'+esc(s.by)+'<small>'+esc(s.bysub)+'</small></div>';
    if(s.disc) html += '<div class="disc">'+esc(s.disc)+'</div>';
  }
  d.innerHTML = html;
  el.appendChild(d);
});
</script>
</body>
</html>
