<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 10 Minute Writing Life — a masterclass with Heidi Fiedler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f4; --panel:#f3ebe6; --ink:#5f4c4c; --muted:#8a7777;
    --accent:#f08e80; --rule:#e3d6cf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"PT Serif",Georgia,serif;line-height:1.55}
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:54px 50px;margin:0 0 26px;min-height:360px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(95,76,76,.04)}
  .slide.title{background:var(--panel);min-height:440px}
  .slide.cta{background:var(--panel)}
  h1{font-family:"Gilda Display",Georgia,serif;font-weight:400;font-size:46px;line-height:1.1;letter-spacing:.2px}
  h2{font-family:"Gilda Display",Georgia,serif;font-weight:400;font-size:33px;line-height:1.15;margin-bottom:16px}
  .kick{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;font-weight:700}
  .sub{font-size:20px;color:var(--muted);margin-top:16px}
  p{font-size:19px;margin-top:14px;max-width:62ch}
  .lead{font-size:24px;color:var(--ink);max-width:60ch}
  ul{margin:18px 0 0 0;list-style:none;max-width:60ch}
  li{font-size:19px;padding:9px 0 9px 26px;position:relative;border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .big{font-size:30px;font-family:"Gilda Display",serif;line-height:1.25;max-width:24ch}
  .by{margin-top:30px;font-size:17px;color:var(--muted)}
  .em{color:var(--accent)}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:70ch;font-style:italic}
  .n{font-size:13px;color:var(--muted);letter-spacing:.1em;margin-top:28px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:"title", cls:"title", html:`
    <div class="kick">A live masterclass with Heidi Fiedler</div>
    <h1>The 10 Minute Writing Life</h1>
    <div class="sub">How to make real progress on the book you can't find time for, in the time you actually have.</div>
    <div class="by">Heidi Fiedler &middot; writer, editor, author of <em>Quickening</em></div>`},

  {t:"slide", html:`
    <div class="kick">Who this is for</div>
    <h2>You are a writer in a full season of life.</h2>
    <p>You have a story you care about. You also have work, a family, a hundred open tabs, and a calendar that never clears. This hour is for you, not for the version of you with a free weekend that never seems to arrive.</p>`},

  {t:"slide", html:`
    <div class="kick">The trap</div>
    <h2>Waiting for the perfect window.</h2>
    <p>Most writers are not blocked. They are waiting. Waiting for the quiet house, the long afternoon, the retreat, the season when things finally calm down.</p>
    <p>So the notebook stays closed, and the story waits with it.</p>`},

  {t:"slide", html:`
    <div class="kick">The reframe</div>
    <div class="big">The problem was never your discipline. It was the size of the window you were waiting for.</div>`},

  {t:"slide", html:`
    <div class="kick">Part one &middot; the real problem</div>
    <h2>The all-or-nothing writing myth.</h2>
    <p>We are taught that real writing needs big blocks of uninterrupted time. So ten free minutes feels like it isn't worth starting. We scroll instead, and feel worse.</p>
    <p>The truth is the opposite. Ten honest minutes, done often, is how books actually get written.</p>`},

  {t:"slide", html:`
    <div class="kick">The cost</div>
    <h2>What the waiting really takes.</h2>
    <p>It isn't only the lost pages. It is the slow erosion of seeing yourself as a writer at all. Every skipped day quietly rewrites the story into: maybe not me, maybe not now.</p>`},

  {t:"slide", html:`
    <div class="kick">Part two &middot; the method</div>
    <h2>The 10 Minute method.</h2>
    <p>A simple, repeatable way to sit down and make progress, even when you are tired, even when you only have a few minutes, even when you have no idea what to do next.</p>
    <p class="lead">Three moves. That's the whole thing.</p>`},

  {t:"slide", html:`
    <div class="kick">Move one</div>
    <h2>Name where you're stuck.</h2>
    <p>No more staring at a blank page trying to figure out what to do. You name the struggle first, then you get a specific next step for it.</p>
    <ul>
      <li>Hate revising? There's a move for that.</li>
      <li>Can't find the ending? There's a move for that.</li>
      <li>Not sure what your theme is? There's a move for that.</li>
    </ul>`},

  {t:"slide", html:`
    <div class="kick">Move two</div>
    <h2>Set a timer. Ten minutes.</h2>
    <p>Not thirty. Not "the rest of the morning." Ten. Small enough that you can't talk yourself out of it, and short enough that you can do it in a bathrobe, in the car, in the margins of a loud day.</p>`},

  {t:"slide", html:`
    <div class="kick">Move three</div>
    <h2>Call it a win.</h2>
    <p>A page. A paragraph. A single true line. You close the notebook having moved the story forward, and you leave feeling more like a writer than you did ten minutes ago.</p>
    <p>Momentum, it turns out, is built in very small pieces.</p>`},

  {t:"slide", html:`
    <div class="kick">What it unlocks</div>
    <h2>The stuck points, one by one.</h2>
    <ul>
      <li>Revising without dread</li>
      <li>An ending that finally lands</li>
      <li>A theme you can feel underneath the draft</li>
      <li>The confidence to go looking for an agent</li>
    </ul>`},

  {t:"slide", html:`
    <div class="kick">From <em>Quickening</em></div>
    <div class="big">You matter. Your ideas matter. Your experience matters. Right here. Right now. Even in this messy, demanding season of life.</div>`},

  {t:"slide", html:`
    <div class="kick">The posture</div>
    <h2>Ease over perfection.</h2>
    <p>This is not about hustle or pushing harder. It is about making the work light enough to keep returning to, so that you can keep going when life gets hard, which it will.</p>`},

  {t:"slide", html:`
    <div class="kick">Part three &middot; your real week</div>
    <h2>A week in the ten minute life.</h2>
    <p>Monday, a messy first paragraph. Tuesday, you fix the line that bugged you. Wednesday, you skip, and that's fine. Thursday, ten minutes on the ending. Friday, you read it back and it's further along than you thought.</p>
    <p>That is a draft by spring, built out of scraps.</p>`},

  {t:"slide", html:`
    <div class="kick">You don't do it alone</div>
    <h2>The 10 Minute Writing Club.</h2>
    <p>We set a timer together, write for ten minutes, and cheer each other on. Cameras optional, bathrobes welcome. It turns a solitary practice into a standing appointment you actually look forward to.</p>`},

  {t:"slide", html:`
    <div class="kick">Why me</div>
    <h2>Twenty years in the work.</h2>
    <p>I have spent two decades as an editor, shaping hundreds of titles for publishers and authors. I wrote <em>Quickening: The Art of Being a Creative Mother</em>. I have also lived the full, loud season, and learned to write inside it anyway.</p>`},

  {t:"slide", html:`
    <div class="kick">The promise</div>
    <div class="big">More personal than an MFA. More strategic than therapy. A real relationship built around your book and your life.</div>`},

  {t:"slide", html:`
    <div class="kick">Who this is and isn't for</div>
    <h2>An honest filter.</h2>
    <ul>
      <li>For you if you have a story and a full life and are done waiting.</li>
      <li>For you if you want warmth and a plan, not shame and a deadline.</li>
      <li>Not for you if you are looking for a shortcut that skips the writing itself.</li>
    </ul>`},

  {t:"slide", html:`
    <div class="kick">Where this goes next</div>
    <h2>Keep going, with company.</h2>
    <p>If today gave you a way back to the page, there's more where that came from: ongoing coaching built around your manuscript, your pace, and your season, so the ten minutes become chapters.</p>`},

  {t:"cta", cls:"cta", html:`
    <div class="kick">Your next ten minutes</div>
    <h1>Start the book, today.</h1>
    <p class="lead">Grab the <em>What to Do in 10 Minutes</em> workbook, join the next live writing session, and if you want a partner for the whole manuscript, explore working with me one on one.</p>
    <p class="by">helloheidifiedler.com &middot; Scraps: A Creative Mother's Notebook</p>
    <p class="disc">Educational only. No income, outcome, publication, or result is guaranteed; writing results vary with effort, time, and circumstance.</p>`}
];

const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide " + (s.cls || "");
  el.innerHTML = s.html + `<div class="n">${String(i+1).padStart(2,"0")} / ${String(S.length).padStart(2,"0")}</div>`;
  deck.appendChild(el);
});
</script>
</body>
</html>
