<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick the Ego Off the Jobsite, People First Leadership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141619;
  --panel:#1d2024;
  --rule:#2c3036;
  --accent:#116dff;
  --chalk:#eef1f4;
  --dim:#9aa6b2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--chalk);font-family:Inter,system-ui,sans-serif}
.deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:48px 44px;margin:20px 0;min-height:360px;display:flex;flex-direction:column;
  justify-content:center;position:relative;overflow:hidden}
.slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.plate{font-family:Montserrat,sans-serif;font-weight:600;font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);margin-bottom:18px}
h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.01em}
h2{font-family:Montserrat,sans-serif;font-weight:800;font-size:34px;line-height:1.1;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:20px;margin-top:16px;line-height:1.45;max-width:640px}
.lead{font-size:22px;line-height:1.5;margin-top:10px;max-width:660px}
.big{font-family:Montserrat,sans-serif;font-weight:800;font-size:40px;line-height:1.12;max-width:720px}
ul{margin:22px 0 0 0;list-style:none}
li{font-size:19px;line-height:1.5;padding:10px 0 10px 28px;position:relative;max-width:660px}
li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;background:var(--accent);border-radius:2px}
.foot{color:var(--dim);font-size:15px;margin-top:26px}
.brandline{font-family:Montserrat,sans-serif;font-weight:600;color:var(--chalk);font-size:16px;margin-top:30px}
.disc{color:var(--dim);font-size:14px;margin-top:26px;line-height:1.5;max-width:640px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',plate:'People First Leadership · Live Masterclass',
  h1:'Kick the Ego Off the Jobsite',
  sub:'How to lead a construction crew that actually trusts you.',
  brand:'Jonathan Cinelli · PMP, ACC · Host, People First Podcast'},

 {t:'audience',plate:'Who this is for',
  h2:'You run the work. The work is not the hard part.',
  lead:'For construction and project leaders, foremen, PMs, and owners who can build anything except a crew that stays, listens, and leads itself.'},

 {t:'promise',plate:'What you will leave with',
  h2:'A people-first way to lead the people who build.',
  ul:['Why your best people stop listening long before they quit',
      'The three shifts that turn a boss into a leader',
      'A 60 day path to a jobsite that runs on trust, not fear']},

 {t:'trap',plate:'The trap',
  big:'The more in charge you get, the less your crew listens.',
  sub:'So you push harder. You repeat yourself louder. And the good ones go quiet, then they go.'},

 {t:'reframe',plate:'The reframe',
  big:'Your crew does not quit the job. They quit the ego running it.',
  sub:'People leave managers, not companies. On a jobsite, that costs you in turnover, rework, and silence where answers should be.'},

 {t:'part',plate:'Part One',
  h2:'Why good crews stop listening',
  lead:'Command and control feels like leadership. It is really just volume. And volume teaches a crew to wait for orders instead of owning the work.'},

 {t:'cost',plate:'Part One',
  h2:'What it is costing you right now',
  ul:['Turnover: the people you trained walk to the competitor down the road',
      'Rework: nobody flags the problem because nobody feels safe to',
      'You: the bottleneck on every decision, on every site, every day']},

 {t:'part',plate:'Part Two',
  h2:'The People First Approach',
  lead:'Put people before process and before profit, and the process and the profit follow. This is the method under the podcast, the book, and every workshop.'},

 {t:'pillar',plate:'Pillar one',
  h2:'Own your management style',
  lead:'There is a line between confidence and arrogance. Confidence invites the crew in. Arrogance shuts them down. Leading ethically starts with knowing which one you are using.'},

 {t:'pillar',plate:'Pillar two',
  h2:'Trust is the currency of your workforce',
  lead:'Trust is built with a few specific words and one distinction: connection before correction. Correct first and you lose them. Connect first and they will take the correction.'},

 {t:'pillar',plate:'Pillar three',
  h2:'Culture is built by language',
  lead:'Good culture is not a poster in the trailer. It is the words you repeat on site. Simple language, used on purpose, shapes how your people see the work and each other.'},

 {t:'frame',plate:'The through line',
  big:'Kick your ego aside and put people first.',
  sub:'Every pillar is the same move: lead the person in front of you before you manage the task in front of them.'},

 {t:'part',plate:'Part Three',
  h2:'Monday morning on a real jobsite',
  lead:'This is not theory from a classroom. It is what changes in how you run the next toolbox talk, the next mistake, the next hard conversation.'},

 {t:'looks',plate:'On site',
  h2:'From orders to ownership',
  ul:['The toolbox talk becomes a two way conversation, not a broadcast',
      'A mistake becomes a coaching moment, not a blow up',
      'Your foremen start making the call you used to have to make']},

 {t:'shift',plate:'The 60 day shift',
  h2:'Flip the script',
  lead:'Changing how a crew trusts you is a practice, not a pep talk. Over about 60 days of small, repeated shifts, the jobsite starts to lead itself and your calendar starts to clear.'},

 {t:'whyme',plate:'Why listen to me',
  h2:'I was on the tools first.',
  ul:['Licensed 309A electrician who came up through a family business',
      'PMP and ACC coach, trained through the NeuroLeadership Institute',
      'Author of Kick Your Ego Aside and Put People First, host of the People First Podcast']},

 {t:'recap',plate:'The three moves',
  h2:'Lead people first, in three steps',
  ul:['Own your style: confidence, not arrogance',
      'Build trust: connection before correction',
      'Shape culture: simple words, used on purpose']},

 {t:'cta',plate:'Your next step',
  h2:'Build a jobsite your crew does not leave.',
  lead:'If this is the way you want to lead, let us take it from one masterclass to your whole team.',
  brand:'People First Leadership · peoplefirstleadership.ca',
  disc:'This masterclass is educational. No specific business or hiring result is guaranteed. Results vary by leader, team, and company.'}
];
const d=document.getElementById('deck');
for(const s of S){
  const el=document.createElement('section');el.className='slide';
  let html='';
  if(s.plate)html+=`<div class="plate">${s.plate}</div>`;
  if(s.h1)html+=`<h1>${s.h1}</h1>`;
  if(s.h2)html+=`<h2>${s.h2}</h2>`;
  if(s.big)html+=`<div class="big">${s.big}</div>`;
  if(s.lead)html+=`<p class="lead">${s.lead}</p>`;
  if(s.ul)html+='<ul>'+s.ul.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  if(s.sub)html+=`<p class="sub">${s.sub}</p>`;
  if(s.brand)html+=`<div class="brandline">${s.brand}</div>`;
  if(s.disc)html+=`<div class="disc">${s.disc}</div>`;
  el.innerHTML=html;d.appendChild(el);
}
</script>
</body>
</html>
