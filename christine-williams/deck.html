<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Boutique Way to Enroll Premium Clients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alice&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f4; --panel:#f1eaf2; --rule:#c9b4d0;
    --accent:#896595; --accent2:#962547; --ink:#2e2733; --muted:#6c6472;
    --serif:'Alice',Georgia,serif; --sans:'Raleway',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9e2ec;font-family:var(--sans);color:var(--ink);padding:40px 16px}
  .deck{max-width:960px;margin:0 auto}
  .slide{position:relative;background:var(--bg);border:1px solid #e4dbe6;border-radius:18px;
    padding:64px 68px;margin:0 auto 30px;min-height:540px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 12px 34px rgba(102,77,112,.10)}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:20px}
  h1{font-family:var(--serif);font-size:52px;line-height:1.08;color:var(--ink);font-weight:400;margin-bottom:22px}
  h2{font-family:var(--serif);font-size:38px;line-height:1.14;color:var(--ink);font-weight:400;margin-bottom:20px}
  .rule{width:64px;height:3px;background:var(--accent);border-radius:3px;margin:8px 0 26px}
  p.lead{font-size:22px;line-height:1.5;color:var(--muted);max-width:40ch}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);max-width:48ch;margin-bottom:14px}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:14px 18px;margin-bottom:12px;
    background:var(--panel);border-left:3px solid var(--accent);border-radius:8px;max-width:52ch}
  li b{font-family:var(--serif);color:var(--accent2);font-weight:400}
  .big{font-family:var(--serif);font-size:30px;line-height:1.25;color:var(--ink);max-width:36ch}
  .big .hi{color:var(--accent2)}
  .num{font-family:var(--serif);font-size:84px;color:var(--rule);line-height:1;margin-bottom:10px}
  .foot{position:absolute;bottom:26px;left:68px;right:68px;display:flex;justify-content:space-between;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .cta{background:var(--accent);color:#fdfbfe}
  .cta h2,.cta .kicker{color:#fdfbfe}
  .cta .rule{background:#e7d9ec}
  .cta p.body{color:#f1e8f4}
  .disc{font-size:14px;line-height:1.5;color:#e3d4e9;margin-top:22px;max-width:56ch}
  .step{font-size:20px;color:#fdfbfe;background:rgba(255,255,255,.12);border-radius:10px;
    padding:14px 18px;margin-bottom:12px;max-width:46ch;border-left:3px solid #e7d9ec}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Live Masterclass with Christine Williams',
   h:'The Boutique Way to Enroll Premium Clients',
   lead:'How women coaches and wellness practitioners fill a profitable practice through relationships, not the algorithm.'},

  {t:'agenda', kicker:'In the next hour',
   h:'Three things you will leave with',
   list:['<b>Why bigger is not the answer.</b> The real reason great coaches stay stuck below six figures.',
         '<b>The relationship-first system.</b> How to attract, nurture, and enroll without the algorithm.',
         '<b>Your first move.</b> One simple step you can take this week.']},

  {t:'who', kicker:'Who this is for',
   h:'You are great at the work. The calendar still has gaps.',
   body:['You are a certified coach or wellness practitioner. You help people change their lives.',
         'And yet enrollment feels unpredictable. Some months are full, some are quiet, and it never feels in your control.',
         'If that is you, this hour is for you.']},

  {t:'trap', kicker:'The trap',
   h:'You were told the answer was more.',
   body:['More posts. More reels. A bigger list. A louder presence.',
         'So you show up on social media every day, hoping the algorithm rewards you, and feeling invisible when it does not.',
         'The treadmill is exhausting. And it is not filling your programs.']},

  {t:'cost', kicker:'The real cost',
   h:'The treadmill costs more than time.',
   body:['Every hour spent feeding the feed is an hour not spent with the clients you already have, or the life you built this practice for.',
         'And when the posting does not convert, it quietly chips away at your belief. That is the most expensive loss of all.']},

  {t:'reframe', kicker:'A harder truth',
   big:'More followers will not fix an <span class="hi">empty calendar.</span> A bigger audience is not the same as more clients.'},

  {t:'stat', kicker:'Why this matters',
   num:'90%',
   big:'of health and wellness coaches never reach six figures. Almost always because they built on <span class="hi">rented attention</span> instead of real relationships.'},

  {t:'part', kicker:'Part One', h:'The problem is the model, not your effort.',
   body:['Chasing reach means starting from zero every single day. The post disappears, the feed moves on, and you perform again tomorrow.',
         'Relationships compound. A referral, a collaboration, a warm conversation. Those do not reset at midnight.',
         'This is the shift at the heart of Build Better, Not Bigger.']},

  {t:'reframe', kicker:'The myth',
   big:'You do not need to be everywhere. You need to be <span class="hi">in-demand</span> to the right few.'},

  {t:'part', kicker:'Part Two', h:'The Soulful Abundance System',
   body:['A relationship-first way to attract, nurture, and enroll premium clients, built around your strengths and values.',
         'Three parts, none of them dependent on going viral.']},

  {t:'pillar', kicker:'Pillar One', h:'ATTRACT, beyond social media',
   list:['<b>Relationships over algorithms.</b> Referrals, collaborations, and connecting with doctors and holistic practitioners who already serve your people.',
         '<b>Be in-demand.</b> Visibility that comes from trust and reputation, not from posting daily and hoping.']},

  {t:'pillar', kicker:'Pillar Two', h:'NURTURE, your Client-Creating Ecosystem',
   list:['<b>A path, not a funnel.</b> A simple, repeatable way to stay in relationship with the right people until the timing is theirs.',
         '<b>Warmth that scales.</b> Trust built on purpose, so the people who need you remember you when they are ready.']},

  {t:'pillar', kicker:'Pillar Three', h:'Soulful Enrollment',
   list:['<b>Invite, do not pressure.</b> Enroll premium clients through honest, meaningful conversations, not pushy tactics.',
         '<b>Believe first.</b> When you hold belief in the outcome, the invitation feels like service, and clients feel it too.']},

  {t:'reframe', kicker:'The positioning shift', h:'Build Better. Not Bigger.',
   big:'Fewer clients. Higher value. A practice that supports your life instead of <span class="hi">consuming it.</span>'},

  {t:'part', kicker:'Part Three', h:'What a boutique practice looks like',
   body:['Masculine structure and feminine flow. Systems and strategy paired with spaciousness and sustainability.',
         'A $100K to $500K practice that runs on relationships, with room for your family, your wellbeing, and your own work.',
         'Not a seven-figure grind. A business that feels like abundance, not pressure.']},

  {t:'why', kicker:'Why listen to me', h:'I rebuilt this from $25.',
   body:['I am Christine Williams, founder of The Boutique CEO. I have built multiple seven-figure businesses and generated more than three million dollars over thirty years.',
         'There was a season I started over with twenty-five dollars in the bank. I rebuilt on relationships, not reach.',
         'Forbes Coaches Council member. Best-selling author. And still a coach who believes you can build better, not bigger.']},

  {t:'math', kicker:'The boutique math',
   h:'Ten premium clients changes everything.',
   body:['You do not need a thousand followers converting at one percent. You need a handful of the right people saying yes.',
         'A small number of premium clients, served deeply, is a six-figure practice. That is the quiet power of building better, not bigger.']},

  {t:'recap', kicker:'What you are walking away with', h:'Your next three moves',
   list:['<b>Stop performing for the feed.</b> Put your energy into relationships that compound.',
         '<b>Install one simple ecosystem.</b> Attract, nurture, and enroll on repeat.',
         '<b>Enroll with soul.</b> Invite premium clients into the work you were made for.']},

  {t:'cta', kicker:'Your next step', h:'Ready to build better, not bigger?',
   steps:['Book a call to map your Soulful Abundance System.',
          'We will look at your offer, your ideal client, and your relationship-first path to consistent enrollment.',
          'Bring your questions. Leave with a plan.'],
   disc:'This masterclass is educational. No income or specific result is guaranteed. Outcomes vary with your market, your offer, and your effort.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('div','slide'+(s.t==='cta'?' cta':''));
  if(s.kicker) sl.appendChild(el('div','kicker',s.kicker));
  if(s.num) sl.appendChild(el('div','num',s.num));
  if(s.h){ const tag=(s.t==='title')?'h1':'h2'; sl.appendChild(el(tag,null,s.h)); sl.appendChild(el('div','rule')); }
  if(s.lead) sl.appendChild(el('p','lead',s.lead));
  if(s.big) sl.appendChild(el('div','big',s.big));
  if(s.body) s.body.forEach(b=>sl.appendChild(el('p','body',b)));
  if(s.list){ const ul=el('ul'); s.list.forEach(li=>ul.appendChild(el('li',null,li))); sl.appendChild(ul); }
  if(s.steps){ s.steps.forEach(st=>sl.appendChild(el('div','step',st))); }
  if(s.disc) sl.appendChild(el('div','disc',s.disc));
  sl.appendChild(el('div','foot','<span>The Boutique CEO</span><span>'+(i+1)+' / '+S.length+'</span>'));
  deck.appendChild(sl);
});
</script>
</body>
</html>
