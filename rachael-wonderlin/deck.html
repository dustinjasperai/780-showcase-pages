<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embracing Their Reality — a masterclass with Rachael Wonderlin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edeff4;        /* her cool off-white ground, from brand #efeff5 / #f5f5f8 */
    --panel:#f9fafc;
    --panel2:#e3e7ee;
    --ink:#36414d;       /* her slate */
    --muted:#6b7682;
    --rule:#d3d8e0;
    --accent:#f26d68;    /* her coral */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--panel2);
    color:var(--ink);
    font-family:"Source Sans 3",system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .deck{max-width:960px;margin:0 auto;padding:28px 16px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:62px 58px;
    margin:0 0 22px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 18px}
  h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:clamp(34px,5vw,56px);line-height:1.08;margin:0 0 18px}
  h2{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:clamp(26px,3.6vw,40px);line-height:1.12;margin:0 0 16px}
  h3{font-weight:700;font-size:20px;margin:0 0 6px;color:var(--accent)}
  p{font-size:19px;margin:0 0 14px;max-width:62ch}
  .lead{font-size:22px}
  .muted{color:var(--muted)}
  ul{margin:8px 0 0;padding:0;list-style:none;max-width:64ch}
  li{position:relative;padding:12px 0 12px 30px;font-size:19px;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--muted);margin:0 6px 8px 0}
  .quote{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:clamp(24px,3.2vw,34px);line-height:1.25;max-width:26ch}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:10px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .foot{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .disc{font-size:14px;color:var(--muted);max-width:60ch;margin-top:18px}
  .cta{display:inline-block;margin-top:14px;background:var(--accent);color:#fff;font-weight:700;padding:14px 26px;border-radius:10px;font-size:18px;text-decoration:none}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:auto}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title', kicker:'A Dementia By Day masterclass', h1:'Embracing Their Reality',
   lead:'A better way to communicate with people living with dementia, so they feel heard instead of corrected.',
   by:'Rachael Wonderlin, MS Gerontology. Founder, Dementia By Day.'},

  {t:'content', kicker:'The promise', h2:'In the next hour',
   p:['You will learn the method that replaces correcting, distracting, and redirecting with something that actually works: entering the reality of the person in front of you.',
      'It is simple to understand, it changes a shift immediately, and it can be taught to an entire care team.']},

  {t:'pills', kicker:'Who this is for', h2:'If you care for someone with dementia',
   pills:['Memory care teams','Senior living directors','Care partners and aides','Nurses and clinical staff','Families'],
   p:['Whether you lead a community or sit with one person, the method is the same.']},

  {t:'content', kicker:'The moment', h2:'"I need to go home to my mother."',
   p:['Someone you care for says it at 4pm, every day. Their mother passed decades ago. You were trained to tell them the truth, gently: "Your mother isn’t here. You live here now."',
      'Watch what happens next.']},

  {t:'quote', quote:'Every time we correct, we tell a person their reality is wrong.',
   p:['We do it dozens of times a day, with the best intentions. It does not bring them back to our world. It only tells them they are failing, over and over.']},

  {t:'list', kicker:'Part one, the problem', h2:'The three old tools',
   p:['For decades, caregivers were handed the same three responses to a person living in a different reality. All three are still taught today. All three miss.'],
   list:['Reorientation: correct the facts, argue them back to today.',
         'Redirection: change the subject before the feeling lands.',
         'Distraction: pull their attention somewhere else entirely.']},

  {t:'content', kicker:'Why it fails', h2:'Reorientation re-opens the wound',
   p:['Telling someone their mother died is not telling them once. For a person living with dementia, it can be the first time, every time. You are not correcting a fact. You are delivering fresh grief, and asking them to trust you afterward.']},

  {t:'content', kicker:'Why it fails', h2:'Redirecting still says "not now"',
   p:['Distraction and redirection are kinder than arguing, and sometimes they are all you have time for. But the person still feels the door close on what they were trying to say. The need underneath, safety, their mother, going home, never got answered.']},

  {t:'title', kicker:'Part two, the method', h1:'Embracing Their Reality',
   lead:'Stop trying to pull them into our world. Step into theirs, and work from inside it.', by:''},

  {t:'content', kicker:'Pillar 1', h2:'Throw out the word "lying"',
   p:['A person with dementia is not lying when they say their mother is coming. They are telling you what is true for them right now. The moment you stop treating their words as false, your whole response changes.']},

  {t:'content', kicker:'Pillar 2', h2:'Answer the feeling, not the fact',
   p:['"Go home to my mother" is rarely about a street address. It is about safety, comfort, being loved. When you respond to that need, "Tell me about your mom," the behavior you were bracing for often simply dissolves.']},

  {t:'content', kicker:'Pillar 3', h2:'Borrow from improv: "yes, and"',
   p:['Improvisational actors never deny what their partner offers. They accept it and build. Care works the same way. Accept the reality the person hands you, then gently guide the scene from inside it. You are not lying to them. You are joining them.']},

  {t:'content', kicker:'Pillar 4', h2:'Build engagement that fits the person',
   p:['Connection does not stop at conversation. Meaningful, individualized activities, what I call functional life stations, give a person a reason and a role in their day. Engagement is not bingo for everyone. It is the right thing, for this person, within their reality.']},

  {t:'content', kicker:'Pillar 5', h2:'One method, the whole team',
   p:['The approach only holds if everyone uses it. The aide at breakfast, the nurse at noon, the director walking the floor. When a community shares one language for care, residents stop getting three different answers to the same question.']},

  {t:'two', kicker:'Part three, in practice', h2:'The same 4pm, two ways',
   cols:[{h:'Before', p:'"Your mother passed away. You live here now." Tears. A raised voice. Twenty minutes to settle. It happens again tomorrow.'},
         {h:'After', p:'"Your mom. Tell me about her." A story. A smile. A walk to the window together. The need was met, so the behavior had nowhere to go.'}]},

  {t:'list', kicker:'What it unlocks', h2:'When a community embraces their reality',
   p:[], list:['Fewer escalations and less reliance on correction',
               'Calmer residents who feel heard',
               'Staff who feel equipped instead of defeated',
               'Families who trust the care their person receives']},

  {t:'content', kicker:'Why learn this from me', h2:'Rachael Wonderlin',
   p:['Master’s in Gerontology. Founder of Dementia By Day, a dementia-care consulting practice. Author with Johns Hopkins University Press of "When Someone You Know Is Living in a Dementia Care Community" and "Creative Engagement." Host of the Dementia By Day podcast.',
      'I have spent my career inside memory care, teaching this method to teams and families.']},

  {t:'cta', kicker:'Your next step', h2:'Bring Embracing Their Reality to your team',
   p:['If this is how you want your community to communicate, we can train your whole team in it through Dementia By Day School and our consulting work, from a single certification to a full memory-care program.'],
   href:'https://rachaelwonderlin.com/workwithme/', cta:'Work with Dementia By Day',
   disc:'This masterclass is educational. Dementia care is individual; approaches should be adapted to each person and setting, and nothing here is clinical or medical advice or a guarantee of any specific outcome.'}
];

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function slideHTML(s){
  let b='';
  if(s.kicker) b+='<p class="kicker">'+esc(s.kicker)+'</p>';
  if(s.h1) b+='<h1>'+esc(s.h1)+'</h1>';
  if(s.h2) b+='<h2>'+esc(s.h2)+'</h2>';
  if(s.lead) b+='<p class="lead">'+esc(s.lead)+'</p>';
  if(s.quote) b+='<p class="quote">'+esc(s.quote)+'</p>';
  if(s.pills) b+='<div>'+s.pills.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')+'</div>';
  (s.p||[]).forEach(x=>{b+='<p>'+esc(x)+'</p>';});
  if(s.list) b+='<ul>'+s.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(s.cols) b+='<div class="two">'+s.cols.map(c=>'<div class="card"><h3>'+esc(c.h)+'</h3><p class="muted">'+esc(c.p)+'</p></div>').join('')+'</div>';
  if(s.by) b+='<p class="muted">'+esc(s.by)+'</p>';
  if(s.cta) b+='<a class="cta" href="'+s.href+'">'+esc(s.cta)+'</a>';
  if(s.disc) b+='<p class="disc">'+esc(s.disc)+'</p>';
  b+='<span class="foot">Dementia By Day</span>';
  return '<section class="slide">'+b+'</section>';
}
document.getElementById('deck').innerHTML = S.map(slideHTML).join('');
</script>
</body>
</html>
