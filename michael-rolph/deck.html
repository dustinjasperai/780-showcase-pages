<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Fluency for Leaders — Michael Rolph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef4f4; --panel:#fbfdfd; --rule:#dde7e6;
    --ink:#1d1f1e; --muted:#5b625f;
    --accent:#1aa6b0; --coral:#f04b42;
    --head:'Jost',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .num{position:absolute;top:22px;right:28px;font-family:var(--head);font-size:13px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .kick{font-family:var(--head);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;font-weight:600}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:36px;line-height:1.1;letter-spacing:-.01em;margin-bottom:16px}
  .lead{font-size:20px;color:var(--muted);max-width:40ch}
  .big{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.22;max-width:30ch}
  .big .a{color:var(--accent)}
  .big .c{color:var(--coral)}
  p.body{font-size:18px;color:var(--ink);max-width:54ch;margin-top:10px}
  ul{list-style:none;margin-top:14px}
  li{font-size:19px;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:56ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .stage{display:flex;gap:18px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule);max-width:60ch}
  .stage:last-child{border-bottom:none}
  .stage .n{font-family:var(--head);font-weight:700;font-size:26px;color:var(--accent);min-width:34px}
  .stage .t{font-family:var(--head);font-weight:600;font-size:21px}
  .stage .d{font-size:16px;color:var(--muted);margin-top:2px}
  .foot{position:absolute;bottom:22px;left:56px;font-family:var(--head);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .title-slide{background:linear-gradient(180deg,#ffffff 0%,#f4f7f6 100%)}
  .title-slide h1{font-size:62px}
  .cta-slide{border-color:var(--accent)}
  .cta-btn{display:inline-block;font-family:var(--head);font-weight:600;font-size:19px;color:#fff;background:var(--accent);padding:15px 30px;border-radius:999px;margin-top:22px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:62ch;line-height:1.5}
  .hook .big{font-size:34px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass with Michael Rolph',h:'AI Fluency for Leaders',lead:'How senior leaders build real judgment with AI without outsourcing the decision.',foot:'Michael Rolph · AI Executive Coach'},

 {t:'who',kick:'Who this is for',h:'You lead people, not pipelines.',body:'You are a founder, an executive, or a senior leader in an organization that is adopting AI faster than its leadership systems can adapt. You are expected to have answers about AI you were never trained to give.'},

 {t:'trap',kick:'The trap',big:'Everyone is talking about the <span class="a">tools</span>. Almost no one is talking about the <span class="a">judgment</span> it takes to use them well.',body:'So leaders quietly do one of two things: they over-trust the output, or they avoid it and fall behind. Both are expensive.'},

 {t:'reframe',kick:'The reframe',big:'AI adoption does not stall on <span class="c">technology</span>. It stalls on <span class="a">leadership</span>.',body:'This is a human-systems shift. It changes how leaders think, decide, build trust, and communicate. Treat it as a technical project and it breaks on the people.'},

 {t:'part',kick:'Part one',h:'The real problem',body:'The problem is not that you cannot use AI. It is that no one has taught you how to work with it the way you work with a smart, fast, and sometimes confidently wrong advisor.'},

 {t:'list',kick:'What that looks like',h:'The three gaps',items:[
   'Framing: you ask AI the wrong question, so you get a confident answer to a problem you do not have.',
   'Evaluation: you cannot tell when the output is wrong, so you either trust it all or trust none of it.',
   'Translation: even a good answer never becomes a decision your team can act on.']},

 {t:'def',kick:'A working definition',big:'AI fluency is the capability to <span class="a">frame problems</span>, <span class="a">evaluate outputs critically</span>, and <span class="a">integrate AI into real decisions</span> without outsourcing your judgment.',body:'Not coding. Not prompts-as-magic. Judgment, applied to the actual work you do.'},

 {t:'part',kick:'Part two',h:'A path, not a prompt pack',body:'Fluency is built in stages. Each one is a habit, practiced on your real work, until it becomes how you think. There is no standard curriculum. The work starts where you are.'},

 {t:'stages',kick:'The five stages',h:'AI Fluency for Leaders',stages:[
   {n:'1',tt:'Literacy & Mindset',dd:'What the tools can and cannot do, their failure modes, and where bias hides.'},
   {n:'2',tt:'Domain Prompt Design',dd:'Co-creating prompts specific to your work, not borrowed from the internet.'},
   {n:'3',tt:'Critical Overlay',dd:'Source-checking and stress-testing every output before it touches a decision.'},
   {n:'4',tt:'Workflow Integration',dd:'Embedding AI into the recurring cycles where it actually saves you time.'},
   {n:'5',tt:'Share & Scale',dd:'Setting the standard for your team so adoption is ethical, not shadow AI.'}]},

 {t:'focus',kick:'Stage three, up close',big:'The leaders who win are the ones who ask the <span class="a">second question</span>.',body:'The model gives a confident recommendation. Critical Overlay is the discipline of asking what it got wrong, where the data is thin, and what it cannot see about your context.'},

 {t:'focus',kick:'Stage five, up close',big:'The stage most leaders skip: <span class="a">Share & Scale</span>.',body:'When leaders do not set a standard, teams use AI anyway, quietly and inconsistently. Shared guidance turns private shortcuts into an organizational capability you can trust.'},

 {t:'part',kick:'Part three',h:'Culture is the multiplier',body:'Fluency compounds only in a culture where people will tell you the truth. That culture is not announced in a policy. It is built, one leadership behavior at a time.'},

 {t:'earned',kick:'Earned Candor',big:'Belonging is a leadership <span class="a">discipline</span>. Not a <span class="c">program</span>.',body:'You cannot mandate a culture. You can only build the conditions for one, and those conditions are created by how you consistently behave, not by what you declare.'},

 {t:'list',kick:'How candor is earned',h:'It is built in moments',items:[
   'Someone challenges your thinking, and you respond with curiosity instead of defensiveness.',
   'A problem gets surfaced, and the person who raised it is thanked, not punished.',
   'Over time, your team learns that difference is welcome here, so honest thinking shows up.']},

 {t:'why',kick:'Why this, from me',h:'Where the approach comes from',body:'Twenty-five years across Silicon Valley technology leadership, the U.S. Foreign Service in Taiwan, and graduate training in counseling psychology. I have led through change on three continents, and I coach the human side of it because that is the side that actually decides whether AI works.'},

 {t:'list',kick:'What changes for you',h:'After this work',items:[
   'You frame problems for AI with a clear head, and you know when not to use it at all.',
   'You read any output with earned suspicion, so you move faster with less risk.',
   'Your team adopts AI with a shared standard, and trust goes up instead of down.']},

 {t:'cta',kick:'The next step',h:'Let us build your fluency.',body:'If this is the work you want to do, the next step is a conversation. We start with the real leadership challenge in front of you and the outcomes that matter, and we go from there.',btn:'Book a Conversation',foot:'Michael Rolph · AI Executive Coach · michaelrolph.com',disc:'This masterclass is educational. Nothing here is a promise of a specific business, performance, or financial outcome, and no result is guaranteed. Outcomes vary with your context, your team, and the work you put in.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='title'?'title-slide ':'')+(s.t==='cta'?'cta-slide ':'')+(['trap','reframe','def','focus','earned'].includes(s.t)?'hook ':'');
  let h='';
  h+='<span class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</span>';
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  if(s.h) h+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.body) h+='<p class="body">'+s.body+'</p>';
  if(s.items){h+='<ul>';s.items.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.stages){s.stages.forEach(x=>{h+='<div class="stage"><div class="n">'+x.n+'</div><div><div class="t">'+x.tt+'</div><div class="d">'+x.dd+'</div></div></div>';});}
  if(s.btn) h+='<div><span class="cta-btn">'+s.btn+'</span></div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
