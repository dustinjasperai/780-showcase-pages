<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Colour-Confident Maker — A Live Masterclass with Felicia Lo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Mulish:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f4f0;      /* SweetGeorgia warm paper (brand.json bg) */
    --ink:#382f33;        /* SweetGeorgia plum-brown ink (brand.json body) */
    --ink-soft:#705e66;   /* muted mauve-grey (brand.json) */
    --berry:#571340;      /* SweetGeorgia footer berry (brand.json panel) */
    --accent:#cc007b;     /* SweetGeorgia signature magenta (brand.json link) */
    --display:'Spectral',Georgia,serif;
    --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e7e4dd;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:32px 18px 80px}
  .slide{position:relative;background:var(--paper);border-radius:14px;padding:64px 60px;margin:0 0 26px;min-height:540px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(56,47,51,.08),0 18px 40px -28px rgba(56,47,51,.5);overflow:hidden}
  .slide .num{position:absolute;top:22px;right:28px;font-size:12px;letter-spacing:.18em;color:var(--ink-soft);font-weight:600}
  .kicker{font-family:var(--body);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em;color:var(--ink)}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.1;color:var(--ink);margin-bottom:22px}
  .sub{font-family:var(--display);font-style:italic;font-size:23px;color:var(--ink-soft);margin-top:22px;line-height:1.4}
  p,li{font-size:20px;line-height:1.55;color:var(--ink);max-width:40ch}
  ul{list-style:none;margin-top:10px}
  li{position:relative;padding-left:30px;margin:14px 0}
  li::before{content:"";position:absolute;left:0;top:10px;width:13px;height:13px;border-radius:3px;background:var(--accent)}
  .big{font-size:26px;max-width:34ch;line-height:1.45}
  /* dark section-break slide */
  .slide.sec{background:var(--berry);color:var(--paper)}
  .slide.sec h2,.slide.sec h1{color:var(--paper)}
  .slide.sec .kicker{color:#ff8dc9}
  .slide.sec p{color:#f0dfe9}
  /* swatch motif */
  .swatches{display:flex;gap:0;margin:30px 0 8px;border-radius:8px;overflow:hidden;max-width:520px}
  .swatches span{flex:1;height:70px}
  .wheel{display:flex;gap:14px;margin-top:26px}
  .chip{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:13px;text-align:center;line-height:1.2}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
  .card{background:#fff;border:1px solid rgba(56,47,51,.12);border-radius:10px;padding:26px}
  .card h3{font-family:var(--display);font-size:22px;margin-bottom:8px;color:var(--berry)}
  .card p{font-size:17px;color:var(--ink-soft)}
  .cta-steps li::before{background:var(--berry)}
  .disc{margin-top:34px;font-size:13px;color:var(--ink-soft);max-width:60ch;line-height:1.5}
  .credit{font-size:17px;color:var(--ink-soft);margin-top:18px}
  @media(max-width:720px){.slide{padding:40px 26px;min-height:0}h1{font-size:36px}h2{font-size:28px}.two{grid-template-columns:1fr;gap:22px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const ACCENT="#cc007b", BERRY="#571340", GOLD="#d98a2b", TEAL="#2b8a86";
const S = [
  {t:'title',
    kicker:"A live masterclass with Felicia Lo",
    h:"The Colour-Confident Maker",
    sub:"How to combine colours that sing in any craft, without guessing, using the SweetGeorgia Colour System.",
    swatch:true },

  {t:'who',
    kicker:"Who this is for",
    h:"You can make almost anything. The colour is the part that stops you.",
    body:[
      "You knit, spin, weave, or dye, and your hands know what to do.",
      "But the colour choice is where you freeze: which skeins go together, what will turn muddy, whether to trust the combination in your head.",
      "So you reach for the safe neutral again, or you buy the kit someone else already picked."],
    },

  {t:'content',
    kicker:"What the freeze costs",
    h:"The stash grows. The finished pile does not.",
    body:[
      "Skeins you loved in the shop sit unused because you are not sure what to pair them with.",
      "Projects stall at the colour decision, or get knit in the safe neutral you did not really want.",
      "The skill is not more yarn. It is knowing how to combine what you already have."] },

  {t:'sec',
    kicker:"The reframe",
    h:"Colour was never a talent you were born with or without.",
    body:["It is a system you can learn to read. Once you can see how colours relate, the fear goes away and the fun starts."] },

  {t:'section', kicker:"Part one", h:"Why colour feels like luck" },

  {t:'content',
    kicker:"The core problem",
    h:"You were taught the painter's colour wheel. Yarn does not behave like paint.",
    body:[
      "Paint mixes on a flat surface. Yarn mixes in your eye, stitch by stitch, in the light of the room.",
      "A pairing that looks bold on the shelf can go flat in the fabric, because value, not hue, is doing the quiet work.",
      "Most makers never get taught this, so every project becomes a gamble."] },

  {t:'content',
    kicker:"The hidden lever",
    h:"It was almost never the colour. It was the value.",
    body:[
      "Value is how light or dark a colour reads. It is the single biggest reason a combination feels alive or muddy.",
      "Two colours you love can fight because their values are too close. Shift one, and the whole piece resolves."],
    valuebar:true },

  {t:'content',
    kicker:"How muddy happens",
    h:"Three quiet reasons a combination goes flat.",
    body:[
      "The values sit too close together, so the colours blur instead of contrast.",
      "Too many unrelated hues compete, and none of them wins.",
      "There is no anchor colour holding the palette together.",
      "Each one is fixable the moment you can see it."] },

  {t:'section', kicker:"Part two", h:"The SweetGeorgia Colour System" },

  {t:'wheel',
    kicker:"The foundation",
    h:"Every colour starts from three hues.",
    body:["Each foundation colour is built from three main hues arranged on a foundation wheel, so colours from the system combine together effortlessly instead of clashing."] },

  {t:'content',
    kicker:"Elements and Elixirs",
    h:"Clear colours to build on. Complex colours to bring depth.",
    body:[
      "Element colours are clean and crisp, your reliable building blocks.",
      "Elixir colours layer multiple hues for depth and richness, the notes that make a palette feel considered rather than flat.",
      "Learn which to reach for, and when, and you stop buying skeins that fight."] },

  {t:'cards',
    kicker:"The three moves",
    h:"How a colour-confident maker actually decides",
    cards:[
      {h:"See the value", p:"Squint, photograph in greyscale, and read light-to-dark before you fall for the hue."},
      {h:"Anchor three hues", p:"Start from the foundation trio, then add an Elixir for depth. Structure, not guesswork."},
      {h:"Test in the fabric", p:"Swatch the combination in the real stitch and light, not on the shelf, before you commit the project."} ] },

  {t:'content',
    kicker:"A palette, built on purpose",
    h:"Anchor one. Add two. Check the value. Done.",
    body:[
      "Choose an anchor you love, then pull two hues from its foundation trio so they already relate.",
      "Add one Elixir for depth if the palette feels flat.",
      "Read it in greyscale to confirm the values carry. That is a palette you can defend, not guess at."],
    valuebar:true },

  {t:'content',
    kicker:"If you want to go further",
    h:"You can learn to make the colour, not only choose it.",
    body:[
      "The same system runs underneath dyeing your own yarn and fibre.",
      "Immersion and low-water immersion dyeing, from Dyeing to Spin & Knit, let you build the exact colours your projects are missing.",
      "Choosing well comes first; making your own is where it gets addictive."] },

  {t:'sec',
    kicker:"The multicraftual throughline",
    h:"One colour sense. Every craft you touch.",
    body:["Knitting, spinning, weaving, dyeing. The craft changes; the way colour works does not. Learn to see it once and it carries across everything you make."] },

  {t:'section', kicker:"Part three", h:"Colour confidence, in your stash" },

  {t:'content',
    kicker:"The shift",
    h:"From 'I hope this works' to 'I know why this works.'",
    body:[
      "You open your stash and see relationships, not a pile of singles.",
      "You combine colours on purpose, explain why a palette works, and finish projects you are proud to show.",
      "The scary part of making quietly becomes the best part."] },

  {t:'sec',
    kicker:"What today is",
    h:"This is a taste of how the whole thing is taught.",
    body:["One idea, worked end to end. Inside the School, every craft gets this same colour-first treatment, live and in depth."] },

  {t:'credit',
    kicker:"Why learn this here",
    h:"Taught by a dyer who has spent twenty years inside colour.",
    body:[
      "Felicia Lo founded SweetGeorgia in 2005 and has been hand-dyeing yarn and fibre, and teaching colour, ever since.",
      "She wrote Dyeing to Spin & Knit and built the School of SweetGeorgia into a library of 115+ courses for makers who cannot stop at one craft."] },

  {t:'cta',
    kicker:"Your next step",
    h:"Join the next live session of the School of SweetGeorgia.",
    steps:[
      "Bring the project, or the stash, that has been stuck on a colour decision.",
      "Work through the SweetGeorgia Colour System with Felicia, live.",
      "Walk away able to combine colours on purpose, in any craft."],
    close:"schoolofsweetgeorgia.com",
    disc:"Educational masterclass only. Techniques and results vary by maker, materials, and practice; nothing here is a guarantee of any specific outcome." }
];

function slideHTML(s, i){
  const n = `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  const k = s.kicker ? `<div class="kicker">${s.kicker}</div>` : "";
  const body = (s.body||[]).map(p=>`<p>${p}</p>`).join("");
  if(s.t==="title"){
    const sw = s.swatch ? `<div class="swatches">
      <span style="background:${ACCENT}"></span><span style="background:${BERRY}"></span>
      <span style="background:${GOLD}"></span><span style="background:${TEAL}"></span>
      <span style="background:#e4b7cf"></span></div>` : "";
    return `<section class="slide">${n}${k}<h1>${s.h}</h1>${sw}<div class="sub">${s.sub}</div></section>`;
  }
  if(s.t==="section"){
    return `<section class="slide sec">${n}${k}<h1>${s.h}</h1></section>`;
  }
  if(s.t==="sec"){
    return `<section class="slide sec">${n}${k}<h2>${s.h}</h2>${body}</section>`;
  }
  if(s.t==="wheel"){
    const w = `<div class="wheel">
      <div class="chip" style="background:${ACCENT}">Hue 1</div>
      <div class="chip" style="background:${GOLD}">Hue 2</div>
      <div class="chip" style="background:${TEAL}">Hue 3</div>
      <div class="chip" style="background:${BERRY}">Blend</div></div>`;
    return `<section class="slide">${n}${k}<h2>${s.h}</h2>${body}${w}</section>`;
  }
  if(s.t==="content"){
    const vb = s.valuebar ? `<div class="swatches" style="max-width:600px;margin-top:26px">
      <span style="background:#efe6ec"></span><span style="background:#d9a9c6"></span>
      <span style="background:${ACCENT}"></span><span style="background:${BERRY}"></span>
      <span style="background:#2a0f20"></span></div>` : "";
    return `<section class="slide">${n}${k}<h2>${s.h}</h2>${body}${vb}</section>`;
  }
  if(s.t==="who"){
    return `<section class="slide">${n}${k}<h2>${s.h}</h2>${body}</section>`;
  }
  if(s.t==="cards"){
    const c = `<div class="two" style="grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:26px">`
      + s.cards.map(x=>`<div class="card"><h3>${x.h}</h3><p>${x.p}</p></div>`).join("") + `</div>`;
    return `<section class="slide">${n}${k}<h2>${s.h}</h2>${c}</section>`;
  }
  if(s.t==="credit"){
    return `<section class="slide">${n}${k}<h2>${s.h}</h2>${body}</section>`;
  }
  if(s.t==="cta"){
    const steps = `<ul class="cta-steps">`+s.steps.map(x=>`<li>${x}</li>`).join("")+`</ul>`;
    return `<section class="slide">${n}${k}<h2>${s.h}</h2>${steps}<div class="credit">Find the next live session at ${s.close}</div><div class="disc">${s.disc}</div></section>`;
  }
  return `<section class="slide">${n}${k}<h2>${s.h||""}</h2>${body}</section>`;
}
document.getElementById("deck").innerHTML = S.map(slideHTML).join("");
</script>
</body>
</html>
