<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlearn the Rulebook — a masterclass with Lee Griffith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f4;      /* her warm cream ground */
    --panel:#fffaf6;   /* soft cream panel */
    --rule:#e3dcd5;    /* quiet divider */
    --ink:#484b50;     /* her charcoal */
    --accent:#f37758;  /* her coral */
    --dim:#8a8782;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:56px 52px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .kicker{font-family:"Poppins";font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Poppins";font-weight:700;font-size:46px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:"Poppins";font-weight:600;font-size:32px;line-height:1.12;letter-spacing:-.01em}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin-top:16px;max-width:60ch}
  p.lead{font-size:22px}
  .big{font-family:"Poppins";font-weight:700;font-size:40px;line-height:1.1}
  .struck{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:3px}
  ul{margin-top:20px;padding-left:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 26px;border-top:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .num{font-family:"Poppins";font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.1em}
  .foot{position:absolute;bottom:22px;left:52px;font-size:12px;color:var(--dim);letter-spacing:.04em}
  .pageno{position:absolute;bottom:22px;right:52px;font-size:12px;color:var(--dim)}
  .cta{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .cta .kicker{color:var(--accent)}
  .cta h2,.cta .big{color:var(--bg)}
  .cta p{color:#d9d6d2}
  .disclaimer{font-size:13px;color:#b7b3ae;margin-top:28px;max-width:62ch}
  .accent{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Lee Griffith', h:'Unlearn the Rulebook', p:'The three rules quietly running your business, and how to rewrite the first one tonight. For quietly ambitious founders, change-makers and accidental leaders.'},

  {t:'who', kicker:'Who this is for', h:'You did everything the way you were told.', p:'You followed the playbooks. You worked twice as hard to be taken seriously. And somewhere along the way the success started to feel like performing. This hour is for founders and accidental leaders who sense the problem is not a missing tactic.'},

  {t:'trap', kicker:'The trap', h:'So you buy another course.', p:'Another club, another framework, another system that works for someone else. It helps for a week. Then you are back to the same quiet exhaustion, convinced you just need to know a little more. You do not need to know more.'},

  {t:'reframe', kicker:'The reframe', h:'The rules you followed are what got you stuck.', p:'Following the exact rulebooks that created the problem is the reason it keeps repeating. The work is not another rule on top. The work is noticing the rules already running you, and deciding which ones still serve you.'},

  {t:'part', kicker:'Part one', h:'The core problem: a rulebook you never wrote.'},

  {t:'rule', kicker:'What a rule is', h:'A rule is a belief you absorbed and never checked.', p:'"Real founders do not rest." "Be seen in every meeting or be overlooked." "Keep going until it hurts." Nobody handed you these on paper. You inherited them from conditioning you never chose, and now they run your calendar, your standards and your sense of enough.'},

  {t:'levels-intro', kicker:'Where rules hide', h:'The rules live in three places at once.', p:'Most coaching stops at mindset. But a rule you have internalised shows up deeper than a thought. It shapes who you think you are, how you act every day, and the life you have built around it. Change one level and leave the others, and the old rule pulls you back.'},

  {t:'part', kicker:'Part two', h:'The (un)learning method.'},

  {t:'pillar', num:'Level 01', kicker:'The method', h:'Identity', p:'The rules you have internalised about who you have to be. The introvert who forced herself to be loud. The founder who cannot be seen to struggle. Unlearning starts by naming the identity the rule built, and asking whether it is even yours.'},

  {t:'pillar', num:'Level 02', kicker:'The method', h:'Behaviour', p:'How the rule plays out day to day. The over-preparing, the inability to stop, the saying yes you resent. Behaviour is where the rule is most visible and most testable, which makes it the fastest place to run a small experiment against it.'},

  {t:'pillar', num:'Level 03', kicker:'The method', h:'Structure', p:'The work, rhythm and life you have built around the rule. The schedule that assumes you are always available. Rewriting a rule it is only real when the structure around you changes to protect the new one.'},

  {t:'move', kicker:'The move', h:'Notice. Question. Rewrite.', p:'Notice the rule in the moment it fires. Question who wrote it and whether it still serves you. Rewrite it into one you would actually choose, then change one piece of structure so the new rule can hold. That is unlearning, repeated.'},

  {t:'tool', kicker:'The tool', h:'The 30-Day FLIP', p:'Thirty days of prompts to unlearn the lies and reclaim your truth, one rule at a time. It is how you keep the work going after this hour, without adding another course to the pile. We will run the first prompt together, live.'},

  {t:'example', kicker:'A rule, unlearned', h:'"Work twice as hard to be taken seriously."', p:'Notice: it fires every time a decision is questioned. Question: it came from a room you are no longer in. Rewrite: "My judgement is the reason I am in the room." Structure: stop over-preparing for the meetings that do not need it. The identity shifts because the behaviour and the structure did too.'},

  {t:'part', kicker:'Part three', h:'Who you are once the rules are yours again.'},

  {t:'accidental', kicker:'For the accidental leader', h:'You inherited a title and a set of rules with it.', p:'Leading without the rulebook you were handed does not mean leading with none. It means choosing which rules to keep and which to unlearn, so the way you lead finally sounds like you instead of the person who held the role before.'},

  {t:'whyme', kicker:'Why me', h:'I spent thousands chasing the magical solution.', p:'Comms director, then burnout, then years of London clubs and courses looking for the one that would fix it. None did, because the problem was never a missing tactic. I am an ICF accredited coach and NLP practitioner, and the whole of sunday skies is built on the thing that actually worked: unlearning the rulebook and writing my own.'},

  {t:'change', kicker:'What changes', h:'Less performing. More of the thing that feels like you.', p:'Clearer standards you actually chose. Work that fits the life you want instead of the one you inherited. A way of leading and building that does not quietly cost you yourself. The specifics are yours to decide, because they always were.'},

  {t:'notfor', kicker:'Honest caveat', h:'This is not a quick fix.', p:'If you want another rule to follow, this will frustrate you. Unlearning is a practice, not a hack, and it asks you to question things you have held for a long time. That is exactly why it works where the courses did not.'},

  {t:'recap', kicker:'Recap', h:'Three levels, one rule at a time.', p:'Identity, behaviour and structure. Notice, question, rewrite. The rulebook you were handed is the problem, not your discipline. You do not need to know more. You need to unlearn what is keeping you small.'},

  {t:'cta', kicker:'Work with me', h:'Rewrite the rest of the rulebook together.', p:'If this landed, the next step is a coaching call. We map the rules quietly running your business and build the practice of unlearning them, across a planning day or the coaching package. You can start with the 30-Day FLIP for free today.', disclaimer:'This masterclass is educational. No specific result or income is guaranteed. Results vary from person to person and depend on your own work. Nothing here is a substitute for professional advice.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'cta' ? ' cta' : '');
  let inner = '';
  if (s.kicker) inner += '<div class="kicker">' + s.kicker + '</div>';
  if (s.num) inner += '<div class="num">' + s.num + '</div>';
  if (s.t === 'title') inner += '<h1>' + s.h + '</h1>';
  else inner += '<h2>' + s.h + '</h2>';
  if (s.p) inner += '<p class="lead">' + s.p + '</p>';
  if (s.disclaimer) inner += '<div class="disclaimer">' + s.disclaimer + '</div>';
  inner += '<div class="foot">sunday skies</div>';
  inner += '<div class="pageno">' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
