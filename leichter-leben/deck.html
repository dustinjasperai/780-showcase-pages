<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leichter Leben - The Inside-Out Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6ece7;        /* pale warm sand, derived from brand coral #ff6f61 */
    --panel:#fffbf9;     /* soft warm white */
    --rule:#ecdfd6;
    --ink:#141414;       /* brand text */
    --muted:#595959;     /* brand body grey */
    --accent:#1c4c60;    /* brand H1/H2 teal */
    --warm:#ff6f61;      /* brand coral accent */
    --head:'Marcellus',Georgia,serif;
    --body:'Karla',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 56px;margin:0 0 28px;min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(28,76,96,.04);
  }
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--warm);margin:0 0 20px}
  .part-n{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 14px}
  h1{font-family:var(--head);font-weight:700;color:var(--accent);font-size:54px;line-height:1.08;margin:0 0 20px}
  h2{font-family:var(--head);font-weight:600;color:var(--accent);font-size:40px;line-height:1.14;margin:0 0 18px}
  .sub{font-size:21px;color:var(--muted);line-height:1.5;margin:0;max-width:62ch}
  p.body{font-size:19px;color:var(--ink);line-height:1.6;margin:0 0 16px;max-width:64ch}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:12px 0 12px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:4px;top:20px;width:12px;height:12px;border-radius:50%;
    background:var(--warm)}
  .steps li:before{background:var(--accent)}
  .big{font-family:var(--head);font-weight:600;color:var(--accent);font-size:30px;line-height:1.3;max-width:60ch;margin:0}
  .foot{font-size:14px;color:var(--muted);margin-top:28px;max-width:70ch}
  .cta h1{font-size:40px}
  .brandline{font-family:var(--head);font-weight:600;color:var(--warm);letter-spacing:.04em;margin-top:8px}
  @media(max-width:640px){.slide{padding:40px 26px}h1{font-size:32px}h2{font-size:25px}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass with Shailia Stephens',h:'Build a Calm Business From the Inside Out',sub:'The Inside-Out method for coaches and solopreneurs who are done running on pressure, willpower and hustle.'},
 {t:'for',h:'Who this is for',items:[
   'Coaches, mentors and solopreneurs who are already good at what they do.',
   'People who look successful from the outside and feel heavy on the inside.',
   'You who keep adding more discipline, more systems, more hours, and still feel stuck.']},
 {t:'point',kicker:'The trap',h:'The harder you push, the heavier it gets',body:'Most business advice tells you the answer is more: more content, more funnels, more willpower. So you optimise yourself. And the stress just quietly moves into the trunk of the car and rides along.'},
 {t:'point',kicker:'A different idea',h:'The pressure is not coming from your workload',body:'It is coming from the thinking you are doing about your workload. Once you see that clearly, the whole thing gets lighter without you having to change a single thing on your calendar.'},
 {t:'part',n:'Part One',h:'Why working harder keeps you stuck'},
 {t:'point',h:'You cannot out-hustle a busy mind',body:'A racing mind makes everything look urgent and personal. You make tense decisions, you over-prepare, you chase the wrong things fast. Effort is not the problem. The state you are working from is.'},
 {t:'point',h:'Clarity is not something you force',body:'You already know what good decisions feel like: they are quiet, obvious and calm. They do not arrive from gritting your teeth harder. They arrive when your mind settles.'},
 {t:'part',n:'Part Two',h:'The 3 Principles: the Inside-Out Understanding'},
 {t:'point',h:'Your experience is created from the inside out',body:'You are not feeling your clients, your inbox or your launch. You are feeling your thinking about them, moment to moment. That is the whole game, and almost nobody is taught it.'},
 {t:'point',h:'Mind, Thought and Consciousness',body:'Mind is the energy and intelligence behind life. Thought is the power that forms your moment-to-moment experience. Consciousness makes that experience feel real. See how they work together and the ground stops shaking.'},
 {t:'point',h:'Insight does the heavy lifting, not effort',body:'This is not another technique to add to your morning routine. It is a seeing. And a single real insight can change how you show up in your business more than a year of tactics.'},
 {t:'part',n:'Part Three',h:'From pressure to clarity, in four steps'},
 {t:'steps',h:'The four steps',items:[
   'See your current reality clearly, without the story on top of it.',
   'Get honest about the outcome you actually want.',
   'Find inner calm first, before you touch the to-do list.',
   'Create and decide from that clarity, not from pressure.']},
 {t:'point',h:'A lighter week, same business',body:'Same business, different driver. You answer the hard email once instead of ten times in your head. You price from confidence. You sell from service. You close the laptop and you are actually there for dinner.'},
 {t:'point',h:'This is how a business gets lighter',body:'Not by doing less that matters, but by carrying less that does not. Ease is a skill, not a personality. It can be learned, and it compounds.'},
 {t:'point',kicker:'Why me',h:'I ran the other way first',body:'I spent years as a busy online business lady on the fast lane to success, with a trunk full of pressure and stress. A deeper understanding of how the mind works changed that, and my work, completely.'},
 {t:'point',h:'Where this comes from',body:'I am an ICF PCC and Advanced Transformative Coach, a 3 Principles mentor and a trainer for other coaches. This understanding is the foundation under every program I run, from the Insight Circle to one-to-one mentoring.'},
 {t:'cta',kicker:'Your next step',h:'Come back to yourself, then build from there',body:'If this resonated, the clearest next step is a free, no-obligation conversation. We will look at where the pressure is really coming from and what building your business from the inside out would look like for you.',brand:'Leichter Leben · Shailia Stephens',disc:'For education only. Coaching is not therapy or medical care, and no specific income, business or personal result is promised or guaranteed. Individual outcomes vary.'}
];
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.kicker) h+='<p class="kicker">'+s.kicker+'</p>';
  if(s.n) h+='<p class="part-n">'+s.n+'</p>';
  if(s.t==='title'){h+='<h1>'+s.h+'</h1>';if(s.sub)h+='<p class="sub">'+s.sub+'</p>';}
  else if(s.t==='part'){h+='<h1>'+s.h+'</h1>';}
  else {h+='<h2>'+s.h+'</h2>';}
  if(s.body) h+='<p class="body">'+s.body+'</p>';
  if(s.items){const cls=s.t==='steps'?'steps':'';h+='<ul class="'+cls+'">'+s.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';}
  if(s.brand) h+='<p class="brandline">'+s.brand+'</p>';
  if(s.disc) h+='<p class="foot">'+s.disc+'</p>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
