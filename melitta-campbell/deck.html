<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attract Your Dream Clients Without Being Loud (Value Whispering Masterclass)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef4f3; --panel:#fbfdfc; --ink:#333333; --muted:#6b6b72;
  --rule:#d8e3e1; --accent:#009ca6; --accent2:#db0b5b; --gold:#ffa400;
  --head:'Archivo',sans-serif; --body:'Open Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
  padding:54px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
  justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.slide.title{background:linear-gradient(160deg,#ffffff 0%,#f3fafa 100%);border-color:#cfeaec}
.slide.cta{background:linear-gradient(160deg,#ffffff 0%,#fdf2f6 100%);border-color:#f3d4e1}
.kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-size:13px;color:var(--accent);margin-bottom:18px}
h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;margin-bottom:18px}
h2{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.15;margin-bottom:16px}
.lead{font-size:20px;color:var(--ink)}
.sub{font-size:18px;color:var(--muted);margin-top:10px}
p{font-size:18px;color:var(--ink);margin-top:14px;max-width:62ch}
.big{font-family:var(--head);font-weight:700;font-size:30px;line-height:1.25;max-width:20ch}
.big .a{color:var(--accent)}
.steps{display:flex;gap:18px;margin-top:26px;flex-wrap:wrap}
.step{flex:1 1 200px;background:#f6fafa;border:1px solid #d9ecee;border-radius:14px;padding:22px}
.step .n{font-family:var(--head);font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.08em}
.step h3{font-family:var(--head);font-weight:700;font-size:19px;margin:8px 0 6px}
.step p{font-size:15px;color:var(--muted);margin:0}
ul{margin:18px 0 0 0;padding:0;list-style:none}
li{font-size:18px;margin:10px 0;padding-left:26px;position:relative}
li:before{content:"";position:absolute;left:0;top:10px;width:10px;height:10px;border-radius:50%;
  background:var(--accent)}
.sweet{display:flex;align-items:center;justify-content:center;gap:0;margin-top:24px}
.circle{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  text-align:center;font-family:var(--head);font-weight:700;font-size:15px;padding:18px}
.c1{background:rgba(0,156,166,.14);border:2px solid var(--accent);color:#0a6f76;margin-right:-46px}
.c2{background:rgba(219,11,91,.10);border:2px solid var(--accent2);color:#9e0b45;margin-left:-46px}
.pagenum{font-family:var(--head);font-size:12px;color:#b7b4ac;margin-top:28px;letter-spacing:.1em}
.disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.55}
.cta-line{font-family:var(--head);font-weight:700;font-size:22px;color:var(--accent);margin-top:18px}
.brand{font-family:var(--head);font-weight:700;color:var(--muted);font-size:15px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="kicker">A free live masterclass with Melitta Campbell</div>
    <h1>Attract Your Dream Clients Without Being Loud</h1>
    <div class="lead">The Value Whispering way to win the clients you most want to work with, without the hustle, hype or burnout.</div>
    <div class="brand">Value Whispering with Melitta Campbell</div>`},

  {t:'promise', html:`
    <div class="kicker">What you'll leave with</div>
    <h2>In the next hour, you'll learn how to be chosen</h2>
    <ul>
      <li>Why doing more and posting louder has not brought you more dream clients</li>
      <li>How to find the one message that makes the right people lean in</li>
      <li>The three quiet steps that turn your true value into a steady flow of clients</li>
    </ul>`},

  {t:'for', html:`
    <div class="kicker">Who this is for</div>
    <h2>You are brilliant at what you do</h2>
    <p>You are a coach, consultant or expert who gets real results for your clients. But the marketing advice all sounds the same: post more, go live, be everywhere, be louder.</p>
    <p class="sub">It feels exhausting, and it does not feel like you.</p>`},

  {t:'trap', html:`
    <div class="kicker">The trap</div>
    <h2>Being louder is not the answer</h2>
    <p>So you push harder. More content, more platforms, more noise. And still the dream clients do not arrive, while people who are not nearly as good at the work seem to win them easily.</p>`},

  {t:'reframe', html:`
    <div class="kicker">The reframe</div>
    <div class="big">People don't choose the best expert. They choose the one <span class="a">whose value they understand best.</span></div>
    <p class="sub">Clarity beats volume. Every time.</p>`},

  {t:'part', html:`<div class="kicker">Part One</div><h2>Why doing more isn't working</h2>`},

  {t:'p1a', html:`
    <h2>Volume is not the same as clarity</h2>
    <p>More posts do not fix an unclear message, they just repeat it. When people cannot quickly grasp the value you offer, they move on, no matter how often you show up.</p>`},

  {t:'p1b', html:`
    <h2>Your value is obvious to you, and invisible to them</h2>
    <p>You are so close to your work that you skip the very things your dream clients need to hear. The gap is not effort. The gap is translation.</p>`},

  {t:'part2', html:`<div class="kicker">Part Two</div><h2>The Value Whispering Method</h2>
    <p class="sub">You don't need to be loud. You just need to be aligned.</p>`},

  {t:'pillars', html:`
    <div class="kicker">Three quiet steps</div>
    <h2>The method, in one picture</h2>
    <div class="steps">
      <div class="step"><div class="n">STEP 1</div><h3>Value Understanding</h3><p>Find your Value Sweet Spot, where what you do best meets what your dream clients most need.</p></div>
      <div class="step"><div class="n">STEP 2</div><h3>Value Weaving</h3><p>Make that value impossible to miss across your message, offers and content.</p></div>
      <div class="step"><div class="n">STEP 3</div><h3>Self-Leadership</h3><p>Show up consistently with quiet confidence, not noise.</p></div>
    </div>`},

  {t:'sweet', html:`
    <div class="kicker">Step One: Value Understanding</div>
    <h2>Your Value Sweet Spot</h2>
    <div class="sweet">
      <div class="circle c1">What you do best</div>
      <div class="circle c2">What your dream clients need</div>
    </div>
    <p class="sub">The overlap is your message. Everything else is noise.</p>`},

  {t:'weave', html:`
    <div class="kicker">Step Two: Value Weaving</div>
    <h2>Say it once, clearly, everywhere</h2>
    <p>Weave your true value through your words, your offers and your everyday decisions so that the right person understands it in seconds. This is how you stand out without shouting.</p>`},

  {t:'story', html:`
    <div class="kicker">Value Weaving in practice</div>
    <h2>Connect through story, not hype</h2>
    <p>A simple, honest story about the client you help and the change you create will always out-perform a louder claim. It builds trust, and trust is what turns a stranger into a dream client.</p>`},

  {t:'self', html:`
    <div class="kicker">Step Three: Self-Leadership</div>
    <h2>Consistency beats intensity</h2>
    <p>You do not need a bigger audience or a louder voice. You need a simple plan you can follow with confidence and joy, so your marketing keeps working even on the quiet weeks.</p>`},

  {t:'part3', html:`<div class="kicker">Part Three</div><h2>What changes when your value lands</h2>`},

  {t:'shift', html:`
    <h2>From chasing to attracting</h2>
    <p>When your value is clear and woven through everything you do, the right clients start to recognise themselves in your words. You stop chasing, and start choosing.</p>`},

  {t:'flow', html:`
    <div class="kicker">The outcome</div>
    <h2>A steady flow of right-fit clients</h2>
    <ul>
      <li>A message your dream clients instantly understand</li>
      <li>Content you can create without dread or overwhelm</li>
      <li>Enquiries from people who are already a good fit</li>
    </ul>`},

  {t:'why', html:`
    <div class="kicker">Why listen to me</div>
    <h2>Meet Melitta</h2>
    <p>Thirty years in marketing and communications, a TEDx speaker on quiet impact, and the bestselling author of A Shy Girl's Guide to Networking. Host of The Art of Value Whispering podcast, and a multi-award-winning coach to introverted women in business.</p>
    <p class="sub">I built Value Whispering so quiet experts never have to choose between being themselves and being chosen.</p>`},

  {t:'recap', html:`
    <div class="kicker">In summary</div>
    <h2>Three steps, one shift</h2>
    <div class="steps">
      <div class="step"><div class="n">1</div><h3>Understand</h3><p>Find your Value Sweet Spot.</p></div>
      <div class="step"><div class="n">2</div><h3>Weave</h3><p>Make your value impossible to miss.</p></div>
      <div class="step"><div class="n">3</div><h3>Lead</h3><p>Show up with quiet confidence.</p></div>
    </div>`},

  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next step</div>
    <h1>Ready to be chosen?</h1>
    <p>If you would like help putting Value Whispering to work in your own business, book a Business Assessment call with me and we'll map your Value Sweet Spot and your next steps together.</p>
    <div class="cta-line">Book your Business Assessment call at melittacampbell.com</div>
    <p class="disc">This masterclass is for education only. No income, result, or client outcome is guaranteed. Results vary and depend on your own work, market and circumstances.</p>
    <div class="brand">Value Whispering with Melitta Campbell</div>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls||'');
  d.innerHTML = s.html + '<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(d);
});
</script>
</body>
</html>
