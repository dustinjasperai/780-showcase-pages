<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Style Operating System: a masterclass with Samantha Stewart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ee; --panel:#efe7dd; --rule:#e2d6c6; --ink:#2c2622; --muted:#6a5f54;
    --accent:#9c7a53;
    --display:'Spectral',Georgia,serif;
    --body:'Albert Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 24px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:64px 60px;margin:0 0 26px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:60px;top:46px;width:54px;height:2px;background:var(--accent)}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.4vw,60px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(27px,4vw,42px);line-height:1.1;letter-spacing:-.01em}
  .lead{font-size:clamp(18px,2.2vw,23px);color:var(--ink);max-width:40ch;margin-top:22px}
  .sub{font-size:16.5px;color:var(--muted);max-width:52ch;margin-top:18px}
  .big{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(26px,3.6vw,40px);line-height:1.18;max-width:24ch}
  .who{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
  .chip{background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:9px 16px;font-size:14.5px;color:var(--ink)}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:22px 22px}
  .card .n{font-family:var(--display);font-size:22px;color:var(--accent);font-weight:700}
  .card h3{font-family:var(--display);font-weight:600;font-size:21px;margin:6px 0 8px}
  .card p{font-size:15px;color:var(--muted)}
  .steps{margin-top:24px;display:grid;gap:14px}
  .step{display:flex;gap:16px;align-items:flex-start}
  .step .d{flex:0 0 34px;height:34px;border-radius:999px;background:var(--accent);color:#fff;
    font-family:var(--display);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
  .step .t{font-size:17px}
  .step .t b{font-weight:600}
  .credit{display:flex;gap:24px;align-items:center;margin-top:30px;flex-wrap:wrap}
  .credit .ring{width:72px;height:72px;border-radius:999px;border:2px solid var(--accent);
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;color:var(--accent)}
  .credit .meta{font-size:15.5px;color:var(--muted);max-width:46ch}
  .pres{margin-top:30px;font-size:15px;color:var(--muted)}
  .pres b{color:var(--ink);font-weight:600}
  .cta-actions{margin-top:28px}
  .btn{display:inline-block;background:var(--accent);color:#fff;font-weight:600;font-size:17px;
    padding:15px 30px;border-radius:8px;text-decoration:none}
  .disclaimer{margin-top:30px;font-size:12.5px;color:var(--muted);max-width:60ch;line-height:1.5}
  .pg{position:absolute;right:60px;bottom:40px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  @media(max-width:720px){.slide{padding:44px 26px;min-height:440px}.pillars{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kick:'A free live masterclass · Style of Sam',h:'The Style Operating System',lead:'Build a signature style that starts with you, not a capsule template.',pres:'With <b>Samantha Stewart</b> · Luxury &amp; Sustainable Stylist for women over 40'},
  {t:'promise',kick:'What this hour gives you',big:'Your signature style identity, and a system to get dressed in under 10 minutes, without buying anything new.'},
  {t:'who',kick:'Who this is for',h:'You have built the career. Your closet has not caught up.',who:['Doctors &amp; execs','Founders &amp; entrepreneurs','Mentors &amp; leaders','Busy moms over 40'],sub:'High-achieving women who walk into the room capable, and quietly wish they looked as put-together as they are.'},
  {t:'statement',kick:'The hidden cost',h:'The gap is quietly expensive.',sub:'Minutes lost to a crowded closet every morning, money spent on almost-right pieces, and a confidence tax you pay in every room you walk into underdressed for who you have become.'},
  {t:'statement',kick:'The trap',h:'A full closet, and still nothing that feels like you.',sub:'So you buy more. And the pile of almost-right clothes keeps growing, while getting dressed takes longer every morning.'},
  {t:'reframe',kick:'The reframe',big:'Style is a skill and a system. Not innate taste, and not a bigger budget.'},
  {t:'statement',kick:'Part one · the real problem',h:'Outfit formulas hand you someone else’s rules.',sub:'Capsules and ten-item templates work for the person who designed them. They skip the only question that matters: who are you dressing, and for what life?'},
  {t:'statement',kick:'Why it keeps failing',h:'A template cannot know your body, your calendar, or your goals.',sub:'That is why the pieces never quite add up, and why the answer is never one more purchase.'},
  {t:'reframe',kick:'The myth',big:'The right capsule will not fix it. The right system will.'},
  {t:'framework',kick:'Part two · the framework',h:'The Style Operating System',sub:'Four parts that run together, so getting dressed becomes a decision you already made.'},
  {t:'pillars',kick:'The four parts',h:'How the system runs',pillars:[
    {n:'01',h:'Signature Style DNA',p:'Define who you are on sight, so every choice points back to one clear identity.'},
    {n:'02',h:'The Style Equation',p:'Dress the body you have today, with proportion and fit that actually flatter.'},
    {n:'03',h:'Conquer the Color Wheel',p:'The colors that work for you, so everything in the closet finally works together.'},
    {n:'04',h:'Accessory Activation',p:'The fastest lever to elevate what you already own, in under ten minutes.'}
  ]},
  {t:'steps',kick:'Why it is an operating system',h:'The parts compound',steps:[
    {d:'1',t:'<b>Identity first.</b> Your Signature Style DNA sets the direction for everything else.'},
    {d:'2',t:'<b>Then fit and color.</b> The Style Equation and the color work turn direction into choices.'},
    {d:'3',t:'<b>Then speed.</b> Accessory Activation makes those choices fast and repeatable every day.'}
  ]},
  {t:'statement',kick:'Part three · what changes',h:'Dressed in minutes, in clothes that feel like you.',sub:'A smaller, sharper wardrobe. Less spent, fewer mistakes, and a closet you can actually get dressed from.'},
  {t:'statement',kick:'What a working wardrobe feels like',h:'Open the closet and know, in seconds.',sub:'Everything coordinates, everything fits the life you actually live, and getting dressed stops being a decision you dread.'},
  {t:'reframe',kick:'The deeper shift',big:'Your style is your silent introduction. It can open the door before you say a word.'},
  {t:'credit',kick:'Why me',h:'A stylist with a scientist’s precision.',ring:'S',meta:'I am a PharmD turned personal stylist. I bring the precision of a practitioner and over a decade styling hundreds of women, from the garage-sale rack to the boardroom. Style was a skill I learned, which is exactly why I can teach it as a system.'},
  {t:'reframe',kick:'If you are thinking it',big:'“But I am just not a stylish person.” Neither was I. Style is learned, and it can be taught.'},
  {t:'recap',kick:'The recap',h:'What you are walking away with',steps:[
    {d:'✓',t:'<b>Your Signature Style DNA</b>, so you stop guessing.'},
    {d:'✓',t:'<b>The Style Equation and color</b>, so your closet works together.'},
    {d:'✓',t:'<b>Accessory Activation</b>, so mornings take minutes.'}
  ]},
  {t:'cta',kick:'Your next step',h:'Ready to build your own Style Operating System?',sub:'If you want the full system, a step-by-step path, and support along the way, here is where to start.',cta:'Join Elevate Your Style',disc:'This masterclass is for educational purposes only. Personal style is individual; results vary from person to person and no specific outcome is promised or guaranteed.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let html='';
  if(s.kick)html+=`<div class="kick">${s.kick}</div>`;
  if(s.t==='title'){html+=`<h1>${s.h}</h1>`;if(s.lead)html+=`<p class="lead">${s.lead}</p>`;if(s.pres)html+=`<p class="pres">${s.pres}</p>`;}
  else if(s.t==='promise'||s.t==='reframe'){html+=`<p class="big">${s.big}</p>`;}
  else if(s.t==='who'){html+=`<h2>${s.h}</h2>`;if(s.who){html+='<div class="who">'+s.who.map(w=>`<span class="chip">${w}</span>`).join('')+'</div>';}if(s.sub)html+=`<p class="sub">${s.sub}</p>`;}
  else if(s.t==='statement'||s.t==='framework'){html+=`<h2>${s.h}</h2>`;if(s.sub)html+=`<p class="sub">${s.sub}</p>`;}
  else if(s.t==='pillars'){html+=`<h2>${s.h}</h2>`;html+='<div class="pillars">'+s.pillars.map(p=>`<div class="card"><div class="n">${p.n}</div><h3>${p.h}</h3><p>${p.p}</p></div>`).join('')+'</div>';}
  else if(s.t==='steps'||s.t==='recap'){html+=`<h2>${s.h}</h2>`;html+='<div class="steps">'+s.steps.map(st=>`<div class="step"><div class="d">${st.d}</div><div class="t">${st.t}</div></div>`).join('')+'</div>';}
  else if(s.t==='credit'){html+=`<h2>${s.h}</h2>`;html+=`<div class="credit"><div class="ring">${s.ring}</div><div class="meta">${s.meta}</div></div>`;}
  else if(s.t==='cta'){html+=`<h2>${s.h}</h2>`;if(s.sub)html+=`<p class="sub">${s.sub}</p>`;html+=`<div class="cta-actions"><a class="btn" href="#">${s.cta}</a></div>`;if(s.disc)html+=`<p class="disclaimer">${s.disc}</p>`;}
  html+=`<div class="pg">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=html;deck.appendChild(el);
});
</script>
</body>
</html>
