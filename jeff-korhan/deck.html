<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built-In Social — A Masterclass with Jeff Korhan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f3; --panel:#ffffff; --ink:#2b2b2b; --muted:#5d6b73;
    --rule:#405664; --accent:#ba1a00;
    --serif:'Bitter',Georgia,serif; --sans:'Inter',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px}
  .slide{background:var(--panel);border:1px solid #e4e4e0;border-top:5px solid var(--accent);
    border-radius:6px;padding:48px 52px;margin:0 0 26px;min-height:360px;
    display:flex;flex-direction:column;justify-content:center}
  .slide.title{min-height:440px}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    font-size:12px;color:var(--rule);margin-bottom:16px}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.05;color:var(--ink);margin-bottom:18px}
  h2{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.12;color:var(--ink);margin-bottom:18px}
  p{font-size:19px;color:var(--ink);margin-bottom:14px}
  p.lead{font-size:22px;color:var(--muted)}
  ul{margin:10px 0 0 22px}
  li{font-size:19px;margin-bottom:12px}
  .big{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.15;color:var(--ink)}
  .accent{color:var(--accent)}
  .rulebar{width:64px;height:4px;background:var(--rule);margin:22px 0 0}
  .foot{margin-top:28px;font-size:14px;color:var(--muted)}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;border-top:1px solid #e4e4e0;padding-top:16px}
  .by{font-family:var(--sans);font-size:16px;color:var(--rule);font-weight:600;margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass',h:'Built-In Social',lead:'Turn the trust already inside your business into a marketing engine that brings in work on purpose.',by:'With Jeff Korhan, author of Built-In Social'},
 {t:'who',kicker:'Who this is for',h:'Home-service and main-street owners who run on word of mouth.',p:['You do great work. Your customers genuinely like you. Fence, lawn, landscape, trades, local service, the kind of business a neighborhood trusts.','And yet every month, growth comes down to whoever happened to refer you.']},
 {t:'trap',kicker:'The trap',h:'Word of mouth is your best channel, and the one you least control.',p:['When it is busy, you stop marketing. When it is slow, you panic and buy ads to strangers who do not know you yet.','So you pay the most for the coldest leads, and let the warmest trust you already earned walk out the door.']},
 {t:'cost',kicker:'What it costs',h:'The leak is quiet, which is why it is expensive.',p:['Every finished job is a small pile of proof: a happy customer, a before and after, a story worth telling. Most of it is never captured and never shown.','So the next buyer down the street has no idea you exist, and you go buy their attention from scratch.']},
 {t:'hook',kicker:'The reframe',h:'Your problem was never reach. It is that the trust you earn on every job leaks out.',p:['Reaching more strangers is the expensive way to grow. Keeping and compounding the trust you already build is the built-in way.']},
 {t:'objection',kicker:'This old new business',h:'"But digital marketing isn\'t for a business like mine."',p:['It is, when it is built on trust instead of trends. The tools are new. What makes a trade grow has not changed in a hundred years: do good work, be known for it, make it easy to tell others.','New media is just how a traditional business stays findable while staying itself.']},
 {t:'p1',kicker:'Part one',h:'Why word of mouth stalls.',p:['Referrals feel like luck because they are unmanaged. Nobody is asked, nothing is captured, and the proof of your good work stays invisible to the next buyer who is looking for exactly you.']},
 {t:'p1b',kicker:'Part one',h:'Three gaps every owner hits.',ul:['No time: marketing is the thing that happens after the real work, which means never.','No training: you are an operator, not a marketer, and the advice online is written for someone else.','No relevant examples: nobody shows you what this looks like for a business like yours.']},
 {t:'p2',kicker:'Part two',h:'Built-In Social: build the marketing into the business itself.',p:['Not a bolt-on ad budget. A method where every job you already do produces something that earns the next one. Four pillars.']},
 {t:'pillar1',kicker:'Pillar one',h:'The connected-economy shift.',p:['Marketing today is driven by the customer, not the seller. The businesses that win collaborate with trusted customers instead of chasing cold ones. Your job is to earn that trust and make it visible.']},
 {t:'pillar2',kicker:'Pillar two',h:'Make every job a marketing asset.',p:['The built-in method: a simple, repeatable way to turn each completed job into a review, a story, a photo, and a referral ask, without becoming a full-time marketer. Do it weekly, not someday.']},
 {t:'pillar3',kicker:'Pillar three',h:'Trust-based selling: value over price.',p:['Most buyers will spend more than you think when they believe they are getting full value. Name and remove their real fear, which is not getting value, not the sticker. A structured process reassures them the work will deliver.']},
 {t:'pillar4',kicker:'Pillar four',h:'Steps, not stages.',p:['Know when to stop selling and start delivering. Keep everything in motion after the yes, and exceed what you promised, so the trust you just earned turns into the next three jobs.']},
 {t:'method',kicker:'The method on one page',h:'Earn trust, capture it, show it, ask for the next job.',p:['That is the whole loop. Each pillar makes the next one easier, and none of it asks you to become something you are not. It runs on the work you already do.']},
 {t:'p3',kicker:'Part three',h:'What a built-in week looks like.',p:['Monday the last jobs become proof. Midweek that proof goes where the next buyer looks. Every estimate uses the same trust-based steps. The result is a business where the marketing runs because the work runs, not in spite of it.']},
 {t:'proof',kicker:'Why this holds up',h:'This is not a trick. It is how the best trades have always grown.',p:['The difference is doing it on purpose instead of by accident. Deliberate beats lucky, and it keeps working when the ad platforms change the rules again.']},
 {t:'whyme',kicker:'Why learn this from me',h:'I have run the trade, not just taught it.',p:['Ten years as a Fortune 50 sales and marketing executive, then twenty years owning a green-industry business, meeting payroll in a competitive market. I wrote Built-In Social to make modern marketing practical for traditional businesses, and I have taught it to owners across the trades ever since.'],by:'Jeff Korhan, MBA'},
 {t:'recap',kicker:'The whole idea in one line',h:'Stop renting attention from strangers. Build trust into the business so it markets itself.',p:['Reach is expensive and temporary. Built-in trust compounds.']},
 {t:'cta',kicker:'Work with me',h:'Let us install Built-In Social in your business.',p:['If you want the week-by-week system set up for your business, that is what I do with owners one on one.'],foot:'Reach out through jeffkorhan.com to talk about working together.',disc:'This masterclass is educational. It shares a marketing and sales approach, not a promise of specific results. Outcomes vary with your market, your effort, and your execution. No income or results are guaranteed.'}
];
const deck=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='title'?'title':'');
  let html='';
  if(s.eyebrow)html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.kicker)html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){html+='<h1>'+s.h+'</h1>';}else{html+='<h2>'+s.h+'</h2>';}
  if(s.lead)html+='<p class="lead">'+s.lead+'</p>';
  if(s.p)s.p.forEach(x=>html+='<p>'+x+'</p>');
  if(s.ul){html+='<ul>';s.ul.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  if(s.t==='hook'||s.t==='recap')html+='<div class="rulebar"></div>';
  if(s.by)html+='<div class="by">'+s.by+'</div>';
  if(s.foot)html+='<div class="foot">'+s.foot+'</div>';
  if(s.disc)html+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
