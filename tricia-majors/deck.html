<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Present Like a Pro — the PRO Method</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f7;
  --panel:#f2efe9;
  --rule:#e7e4de;
  --ink:#333333;
  --accent:#586884;
  --accent2:#8da4cc;
  --grey:#6f6a63;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
.deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:60px 60px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.kick{font-size:14px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
h1{font-family:'Lora',Georgia,serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
h2{font-family:'Lora',Georgia,serif;font-weight:600;font-size:40px;line-height:1.12;margin-bottom:10px}
.lead{font-size:24px;line-height:1.5;color:var(--grey);margin-top:22px;max-width:40ch}
.big{font-family:'Lora',Georgia,serif;font-style:italic;font-weight:500;font-size:46px;line-height:1.2;color:var(--ink)}
.big .a{color:var(--accent);font-style:normal;font-weight:600}
ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:18px}
li{font-size:22px;line-height:1.4;padding-left:34px;position:relative;color:var(--ink)}
li::before{content:'';position:absolute;left:0;top:10px;width:14px;height:14px;border-radius:50%;background:var(--accent2)}
.pillar{font-family:'Lora',Georgia,serif;font-size:120px;font-weight:700;color:var(--accent);line-height:1;opacity:.9}
.pillarword{font-family:'Lora',Georgia,serif;font-size:46px;font-weight:600;margin-top:4px}
.sub{font-size:22px;line-height:1.5;color:var(--grey);margin-top:18px;max-width:42ch}
.stat{font-family:'Lora',Georgia,serif;font-size:96px;font-weight:700;color:var(--accent);line-height:1}
.src{font-size:15px;color:var(--grey);margin-top:14px;letter-spacing:.02em}
.cta h1{font-size:46px}
.disc{font-size:15px;line-height:1.55;color:var(--grey);margin-top:28px;max-width:60ch}
.brandbar{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-top:30px}
@media(max-width:700px){.slide{padding:40px 30px}h1{font-size:38px}h2{font-size:30px}.big{font-size:32px}.pillar{font-size:84px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'cover', kick:'A live masterclass with Tricia Majors', h:'Present Like a Pro', lead:'The three moves top anchors and executives use to make a room listen.'},
  {t:'promise', kick:'The promise', h:'By the end of this hour', lead:'You will know exactly how to plan, shape and deliver a talk so your point lands the first time, without more slides and without more nerves.'},
  {t:'audience', kick:'Who this is for', h:'Capable people who get talked over', bullets:['You know your material cold','You still watch the room drift','The decision goes to whoever spoke more clearly, not whoever knew more']},
  {t:'trap', kick:'The trap', big:'It does not matter if you are the <span class="a">smartest person in the room</span> if you are not getting your message across.'},
  {t:'reframe', kick:'The hard part', h:'The problem was never your knowledge', lead:'It is that nobody taught you to deliver it. Slides got all your attention. The sixty seconds that decide everything got none.'},
  {t:'stat', kick:'What it costs', stat:'70%', sub:'of the workforce would be more productive with better communication.', src:'Zippia Research'},
  {t:'part', kick:'Part one', h:'Why good people lose the room'},
  {t:'problem', kick:'The three traps', h:'How a strong case falls apart', bullets:['Too much detail, so the point gets buried','Lackluster messaging, so nothing sticks','Awkward delivery, so you read as unsure even when you are not']},
  {t:'part', kick:'Part two', h:'The PRO method'},
  {t:'pillar', kick:'P', letter:'P', word:'Plan', sub:'Build the talk backward from the one business outcome you want. Decide the result first, then earn it line by line.'},
  {t:'pillar', kick:'R', letter:'R', word:'Reflect', sub:'Read your audience and meet them where they already are, psychologically, so you are speaking to their mindset instead of past it.'},
  {t:'pillar', kick:'O', letter:'O', word:'Optimize', sub:'Refine the delivery itself until you project the confidence and competence you have already earned.'},
  {t:'method', kick:'How it fits together', h:'Outcome, then audience, then delivery', lead:'Most people start with their slides. The PRO method starts with the result and ends with the camera. Same material, a completely different room.'},
  {t:'part', kick:'Part three', h:'What changes when you use it'},
  {t:'looks', kick:'After the method', h:'The first sixty seconds change', bullets:['You open on the point, not the preamble','The room leans in instead of checking phones','You sound like the calm person who has done this before']},
  {t:'rehearse', kick:'The newsroom loop', h:'Record, review, refine, repeat', lead:'It is the exact rep-based loop a news director uses to coach an anchor. We run it on you until the talk feels almost boring to deliver. That is when it is ready.'},
  {t:'why', kick:'Why learn this from me', h:'Thirty years on both sides of the camera', bullets:['Anchor and News Director in TV news','Coach to Fortune 100 C-level executives and on-air talent','8,000+ clients across 20+ countries']},
  {t:'recap', kick:'Recap', h:'Plan. Reflect. Optimize.', lead:'Start from the outcome, meet your audience where they are, and deliver with calm command. That is how a capable person finally gets heard.'},
  {t:'cta', kick:'Your next step', h:'Come Present Like a Pro', lead:'If you want the full method, the workbook and personal feedback, join Present Like a Pro.', disc:'This masterclass is educational. No specific career, promotion or business result is guaranteed. Results vary and depend on your own effort and circumstances.', brand:'majorscommunications.com'}
];
const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t === 'cta' ? 'cta' : '');
  let h = '';
  if (s.kick) h += '<div class="kick">'+s.kick+'</div>';
  if (s.t === 'cover') h += '<h1>'+s.h+'</h1><div class="lead">'+s.lead+'</div>';
  else if (s.t === 'trap' || s.t === 'reframe' && s.big) h += '<div class="big">'+(s.big||'')+'</div>';
  if (s.big && s.t !== 'trap') h += '<div class="big">'+s.big+'</div>';
  if (s.t === 'stat') h += '<div class="stat">'+s.stat+'</div><div class="sub">'+s.sub+'</div><div class="src">'+s.src+'</div>';
  if (s.t === 'pillar') h += '<div class="pillar">'+s.letter+'</div><div class="pillarword">'+s.word+'</div><div class="sub">'+s.sub+'</div>';
  if (s.h && s.t !== 'cover') h += '<h2>'+s.h+'</h2>';
  if (s.lead && s.t !== 'cover') h += '<div class="lead">'+s.lead+'</div>';
  if (s.bullets){ h += '<ul>'; for(const b of s.bullets) h += '<li>'+b+'</li>'; h += '</ul>'; }
  if (s.disc) h += '<div class="disc">'+s.disc+'</div>';
  if (s.brand) h += '<div class="brandbar">'+s.brand+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
