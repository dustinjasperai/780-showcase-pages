<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Muscle While You Burn Fat:The Ketogains Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Mulish:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f3;      /* warm off-white:brand probes LIGHT (brand.json site_scheme) */
    --panel:#ffffff;
    --rule:#e4e0da;
    --ink:#1b1b1b;     /* deepened from probed dominant #333333 */
    --muted:#6a655f;
    --accent:#f43e16;  /* Ketogains red-orange:brand.json h2 rgb(244,62,22) + ranked cluster */
    --accent-soft:#fdece7;
    --display:'Oswald',system-ui,sans-serif;
    --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #deck{height:100vh;width:100vw;overflow:hidden;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7vh 9vw;opacity:0;transition:opacity .35s ease}
  .slide.active{display:flex;opacity:1}
  .kicker{font-family:var(--display);text-transform:uppercase;letter-spacing:.18em;
    font-weight:600;font-size:clamp(11px,1.1vw,15px);color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.98;
    letter-spacing:.005em;font-size:clamp(34px,6.4vw,92px)}
  h2{font-family:var(--display);font-weight:600;text-transform:uppercase;line-height:1.02;
    font-size:clamp(26px,4.3vw,58px);letter-spacing:.01em}
  .lede{font-size:clamp(17px,1.9vw,26px);line-height:1.5;max-width:60ch;color:var(--ink);margin-top:22px}
  .sub{font-size:clamp(15px,1.5vw,21px);line-height:1.55;max-width:62ch;color:var(--muted);margin-top:16px}
  .accent{color:var(--accent)}
  .big{font-family:var(--display);font-weight:700;font-size:clamp(40px,8vw,120px);color:var(--accent);line-height:.95}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:16px;max-width:64ch}
  li{position:relative;padding-left:34px;font-size:clamp(15px,1.55vw,21px);line-height:1.45}
  li::before{content:"";position:absolute;left:0;top:.42em;width:14px;height:14px;background:var(--accent);
    clip-path:polygon(0 0,100% 50%,0 100%)}
  li b{font-weight:700}
  .pillar{display:flex;gap:22px;align-items:baseline;margin-top:8px}
  .pillar .num{font-family:var(--display);font-weight:700;font-size:clamp(30px,4vw,56px);color:var(--accent);min-width:1.4em}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
  .card{background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--accent);
    border-radius:4px;padding:26px 24px}
  .card .cnum{font-family:var(--display);font-weight:700;color:var(--accent);font-size:28px}
  .card h3{font-family:var(--display);text-transform:uppercase;font-size:clamp(16px,1.6vw,22px);margin:8px 0 10px;letter-spacing:.02em}
  .card p{color:var(--muted);font-size:clamp(13px,1.25vw,16px);line-height:1.45}
  /* macro-bar motif:from their own calculator world */
  .bars{display:flex;flex-direction:column;gap:18px;margin-top:34px;max-width:52ch}
  .bar{display:flex;align-items:center;gap:16px}
  .bar .lab{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:14px;min-width:150px}
  .bar .track{flex:1;height:18px;background:#ece8e3;border-radius:10px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent);border-radius:10px}
  .bar .fill.soft{background:#f0b4a3}
  .recomp{display:flex;gap:48px;margin-top:40px;flex-wrap:wrap}
  .recomp div{min-width:180px}
  .recomp .t{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted)}
  .recomp .v{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.2vw,46px);margin-top:6px}
  .arrow-dn{color:var(--accent)} .arrow-up{color:var(--ink)}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px;max-width:70ch}
  .who h4{font-family:var(--display);text-transform:uppercase;font-size:16px;letter-spacing:.04em;margin-bottom:14px}
  .who .yes h4{color:var(--accent)}
  .cred{font-size:clamp(16px,1.7vw,23px);line-height:1.55;max-width:60ch;margin-top:22px}
  .cred b{color:var(--accent)}
  .cta-box{margin-top:30px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    padding:30px 32px;max-width:60ch}
  .cta-box .step{font-family:var(--display);text-transform:uppercase;font-size:clamp(18px,2vw,26px);letter-spacing:.02em}
  .cta-box p{color:var(--muted);margin-top:12px;font-size:clamp(14px,1.4vw,18px);line-height:1.5}
  .disclaimer{margin-top:30px;font-size:12px;color:var(--muted);max-width:66ch;line-height:1.5;font-style:italic}
  .nav{position:fixed;bottom:22px;right:28px;display:flex;gap:10px;align-items:center;z-index:20}
  .nav button{font-family:var(--display);background:var(--ink);color:#fff;border:0;width:40px;height:40px;
    border-radius:50%;font-size:18px;cursor:pointer}
  .nav button:disabled{opacity:.3;cursor:default}
  .count{font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.1em}
  .brandmark{position:fixed;top:26px;left:9vw;font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.12em;font-size:14px;z-index:20}
  .brandmark .k{color:var(--accent)}
  .progress{position:fixed;top:0;left:0;height:4px;background:var(--accent);z-index:30;transition:width .3s ease}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="brandmark"><span class="k">KETOGAINS</span> / Metabolic Mastery</div>
<div id="deck"></div>
<div class="nav">
  <span class="count" id="count"></span>
  <button id="prev" aria-label="previous">&#8249;</button>
  <button id="next" aria-label="next">&#8250;</button>
</div>
<script>
const S = [
  {t:'title',
    kicker:'A Live Masterclass with Luis Villaseñor',
    h:'Build Muscle<br>While You Burn Fat',
    sub:'The Ketogains Method for body recomposition on keto. How to get leaner and stronger at the same time, by eating more protein, not less.',
    foot:'Luis Villaseñor, Founder of Ketogains' },

  {t:'content',
    kicker:'Who this is for',
    h:'You did keto. You lost fat.<br>You also lost your strength.',
    lede:'This is for the lifter, the athlete, and the everyday person who went keto, watched the scale drop, and then felt it: flatter muscles, weaker lifts, less in the tank.',
    sub:'Or you have been told the thing everyone repeats: that you cannot build muscle in ketosis. You can. You have just never been shown how.' },

  {t:'content',
    kicker:'The trap',
    h:'The scale moved.<br>So did your muscle.',
    lede:'Most keto advice is built for one outcome only: a lower number on the scale. Nobody tells you that a big part of that number can be the exact tissue that keeps you lean, strong, and metabolically healthy.',
    sub:'Lose muscle, and your maintenance calories fall, your lifts stall, and the weight finds its way back. Smaller is not the same as leaner.' },

  {t:'statement',
    kicker:'The reframe',
    big:'Keto was<br>never the problem.',
    sub:'Your protein was. Mainstream keto keeps protein low on purpose, out of an old fear of being kicked out of ketosis. That single rule is why so many people end up skinny-fat instead of lean and strong.' },

  {t:'content',
    kicker:'Part one: the core problem',
    h:'Protein is not the enemy.',
    lede:'The fear is gluconeogenesis: the idea that extra protein turns to sugar and ends ketosis. In practice, protein is supply-and-demand driven, and for a training body the demand is high.',
    bullets:[
      'Too little protein in a deficit means your body breaks down muscle for fuel.',
      'Less muscle means a slower metabolism and a harder time staying lean.',
      'The result is the classic rebound: you lose weight, then regain it as fat.' ] },

  {t:'content',
    kicker:'Part two: the method',
    h:'The Ketogains Protocol',
    lede:'One system, three levers. Dial all three and the body has every reason to drop fat and hold, or build, muscle at the same time.',
    grid:[
      {n:'01',h:'Lean-mass macros',p:'Protein set by your lean body mass, not scale weight. Fat fuels you. Carbs stay low.'},
      {n:'02',h:'Periodized lifting',p:'Progressive strength work, not endless cardio. The signal that tells your body to keep muscle.'},
      {n:'03',h:'Habit systems',p:'The psychology of adherence. The protocol you actually follow is the one that works.'} ] },

  {t:'bars',
    kicker:'Pillar one: lean-mass macros',
    h:'Protein from your<br>lean body mass.',
    sub:'The Ketogains calculator sets protein from the muscle you carry, then scales it to how hard you train. This is the number mainstream keto gets wrong.',
    bars:[
      {lab:'Low activity', pct:'58%'},
      {lab:'Trains regularly', pct:'76%'},
      {lab:'Trains hard', pct:'95%', soft:false} ],
    note:'Roughly 0.6 to 1.0 g of protein per pound of lean body mass, climbing with your training load.' },

  {t:'statement',
    kicker:'Pillar one: the contrarian truth',
    big:'More protein did not<br>break your ketosis.',
    sub:'It protected your muscle while you were in a deficit. That is the whole difference between losing weight and recomposing your body.' },

  {t:'content',
    kicker:'Pillar two: periodized lifting',
    h:'Lifting is the signal.',
    lede:'Diet decides how much you weigh. Training decides what that weight is made of. Resistance training is the instruction that tells your body to spend fat and spare muscle.',
    bullets:[
      'A structured, periodized block, not random workouts or hours of cardio.',
      'Progressive overload so the stimulus keeps pace with your recovery.',
      'Form and movement quality first, so the work is productive and safe.' ] },

  {t:'content',
    kicker:'Pillar three: habit systems',
    h:'The best protocol is the<br>one you will follow.',
    lede:'Knowledge is not the bottleneck. Adherence is. The Ketogains approach treats habits as a skill you build on purpose.',
    bullets:[
      'Monthly habit sprints that change one behaviour at a time.',
      'An environment designed so the easy choice is the right choice.',
      'Simple tracking that keeps you honest without ruling your life.' ] },

  {t:'recomp',
    kicker:'Part three: the recomposition trade',
    h:'Recomposition, not<br>just weight loss.',
    sub:'Across a focused block, the goal is not the scale. It is the trade: fat down, muscle held or built, strength up. The mirror and the lifts move before the scale does.',
    cols:[
      {t:'Body fat', v:'Down', cls:'arrow-dn'},
      {t:'Lean muscle', v:'Held / up', cls:'arrow-up'},
      {t:'Strength', v:'Up', cls:'arrow-up'} ] },

  {t:'content',
    kicker:'What a week looks like',
    h:'Simple on purpose.',
    lede:'Nothing exotic. The protocol is built to run inside a real life with a job, a family, and a gym you can actually get to.',
    bullets:[
      'Macros dialled to your lean body mass and your goal for the block.',
      'Three to four focused strength sessions, periodized across the weeks.',
      'A weekly check-in to adjust, so progress never stalls for long.' ] },

  {t:'who',
    kicker:'Honest qualification',
    h:'Who this is for.',
    yes:['You lift, or you are willing to start.','You want to be leaner and stronger, not just lighter.','You are ready to eat enough protein to support your training.'],
    no:['You want a quick crash diet with no training.','You are looking for a magic pill or a guarantee.','You are not willing to track anything at all.'] },

  {t:'cred',
    kicker:'Why me',
    h:'Luis Villaseñor',
    body:'I founded <b>Ketogains</b> and I have spent over a decade proving that strength and ketosis belong together. I hold a BS in Sports Nutrition, co-founded <b>DrinkLMNT</b>, and built the Ketogains Protocol and macro method that thousands of people have used to train hard while keto. This masterclass is the method, taught straight.' },

  {t:'content',
    kicker:'Where this lives',
    h:'Metabolic Mastery',
    lede:'Everything you have seen today runs inside Metabolic Mastery: live weekly coaching calls, a growing vault of nutrition and training tutorials, monthly challenges, and a community that holds you to it.',
    sub:'For the people who want the protocol fully personalised, the Ketogains Bootcamp takes it further with certified coaches, weekly feedback, and a periodized training plan built around you.' },

  {t:'cta',
    kicker:'Your next step',
    h:'Ready to recomp on keto?',
    step:'Join Metabolic Mastery and start the method',
    p:'Come into the community, meet the coaches, and take the first week of the protocol. When you are ready for the fully personalised version, the Ketogains Bootcamp is your next step.',
    disclaimer:'Educational content only. Individual results vary and are not guaranteed. This masterclass is not medical, dietary, or fitness advice for any specific person. Consult a qualified healthcare professional before making changes to your diet or training, especially if you have a medical condition.' }
];

const deck = document.getElementById('deck');
function esc(s){return s;}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let html='';
  const kick = s.kicker?`<div class="kicker">${s.kicker}</div>`:'';
  if(s.t==='title'){
    html = kick+`<h1>${s.h}</h1><p class="lede">${s.sub}</p><p class="sub" style="margin-top:34px;font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink)">${s.foot}</p>`;
  } else if(s.t==='statement'){
    html = kick+`<div class="big">${s.big}</div><p class="sub">${s.sub}</p>`;
  } else if(s.t==='content'){
    html = kick+`<h2>${s.h}</h2>`;
    if(s.lede) html+=`<p class="lede">${s.lede}</p>`;
    if(s.bullets){ html+='<ul>'+s.bullets.map(b=>`<li>${b}</li>`).join('')+'</ul>'; }
    if(s.grid){ html+='<div class="grid3">'+s.grid.map(c=>`<div class="card"><div class="cnum">${c.n}</div><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')+'</div>'; }
    if(s.sub) html+=`<p class="sub">${s.sub}</p>`;
  } else if(s.t==='bars'){
    html = kick+`<h2>${s.h}</h2>`+(s.sub?`<p class="sub">${s.sub}</p>`:'');
    html+='<div class="bars">'+s.bars.map(b=>`<div class="bar"><span class="lab">${b.lab}</span><span class="track"><span class="fill${b.soft?' soft':''}" style="width:${b.pct}"></span></span></div>`).join('')+'</div>';
    if(s.note) html+=`<p class="sub">${s.note}</p>`;
  } else if(s.t==='recomp'){
    html = kick+`<h2>${s.h}</h2>`+(s.sub?`<p class="sub">${s.sub}</p>`:'');
    html+='<div class="recomp">'+s.cols.map(c=>`<div><div class="t">${c.t}</div><div class="v ${c.cls}">${c.v}</div></div>`).join('')+'</div>';
  } else if(s.t==='who'){
    html = kick+`<h2>${s.h}</h2><div class="who"><div class="yes"><h4>This is for you if</h4><ul>`+s.yes.map(x=>`<li>${x}</li>`).join('')+`</ul></div><div class="not"><h4>Maybe not if</h4><ul>`+s.no.map(x=>`<li>${x}</li>`).join('')+`</ul></div></div>`;
  } else if(s.t==='cred'){
    html = kick+`<h2>${s.h}</h2><p class="cred">${s.body}</p>`;
  } else if(s.t==='cta'){
    html = kick+`<h2>${s.h}</h2><div class="cta-box"><div class="step">${s.step}</div><p>${s.p}</p></div><p class="disclaimer">${s.disclaimer}</p>`;
  }
  el.innerHTML=html;
  deck.appendChild(el);
});

let cur=0;
const slides=[...document.querySelectorAll('.slide')];
const prev=document.getElementById('prev'), next=document.getElementById('next'),
  count=document.getElementById('count'), progress=document.getElementById('progress');
function show(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,idx)=>s.classList.toggle('active',idx===cur));
  prev.disabled=cur===0; next.disabled=cur===slides.length-1;
  count.textContent=(cur+1)+' / '+slides.length;
  progress.style.width=((cur+1)/slides.length*100)+'%';
}
prev.onclick=()=>show(cur-1); next.onclick=()=>show(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1);
});
show(0);
</script>
</body>
</html>
