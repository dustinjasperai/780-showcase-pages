<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The One Thing: a Higher Months masterclass with Kellie Sanders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#33312c;        /* Kellie's dominant site hue */
    --panel:#3f3c36;     /* raised panel */
    --rule:#564f47;      /* hairline */
    --accent:#6b3f52;    /* her exact button plum */
    --ink:#efe9e1;       /* warm off-white */
    --muted:#c7bcae;     /* muted warm grey */
    --head:'Playfair Display', Georgia, serif;
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    background:linear-gradient(180deg,var(--panel),#36332e);
    border:1px solid var(--rule);border-radius:16px;
    padding:52px 48px;margin:22px 0;min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
  }
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:700;font-size:36px;line-height:1.12;margin:0 0 16px}
  .lead{font-size:20px;line-height:1.5;color:var(--ink);margin:0 0 10px;max-width:60ch}
  .sub{font-size:18px;line-height:1.55;color:var(--muted);margin:8px 0 0;max-width:62ch}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0;border-top:1px solid var(--rule);display:flex;gap:14px}
  li:first-child{border-top:none}
  li .k{font-family:var(--head);color:var(--accent);font-weight:700;min-width:118px}
  .big{font-family:var(--head);font-size:40px;line-height:1.1;color:var(--ink);font-style:italic;font-weight:500}
  .part{font-family:var(--head);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .foot{margin-top:26px;font-size:14px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
  .cta h2{font-size:40px}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:64ch}
  .brandline{font-size:15px;color:var(--muted);margin-top:28px;letter-spacing:.04em}
  @media(max-width:640px){.slide{padding:36px 24px;min-height:360px}h1{font-size:38px}h2{font-size:28px}.big{font-size:30px}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title',
    eyebrow:'A live Higher Months masterclass',
    h1:'The One Thing',
    lead:'Find what is really keeping your fitness business stuck, and fix that first.',
    brand:'With Kellie Sanders  ·  Higher Months' },

  {t:'content',
    eyebrow:'Who this is for',
    h2:'You own the business. You are still doing everything.',
    lead:'A fitness studio, an outdoor group, a PT studio, or an online fitness business with real clients. The kind you built from nothing.',
    sub:'And a number that will not move, no matter how much you change.' },

  {t:'content',
    eyebrow:'The trap',
    h2:'You have tried so many things.',
    lead:'New marketing. New offers. New content. Maybe a whole new way of running the place. New clients come in, a few cancel, and you land back on the same number, still paying yourself last.',
    sub:'So you do more. More classes, more posting, more of you.' },

  {t:'hook',
    eyebrow:'The reframe',
    big:'You are not behind because you are doing too little. You are working hard on the wrong thing.' },

  {t:'part', part:'Part One', h2:'Why more is not working' },

  {t:'content',
    eyebrow:'The real problem',
    h2:'Twenty things could grow your business. One is holding it back.',
    lead:'Change the wrong thing and you go in circles. The income stays the same, and it feels like nothing you try ever lands.',
    sub:'The habits, decisions and standards that got you here will not always get you further.' },

  {t:'content',
    eyebrow:'Why you cannot see it',
    h2:'You cannot fix what you cannot see.',
    lead:'When you are inside the business every day, the one thing holding it back is the hardest thing to spot. You are too close.',
    sub:'Nobody can see their own blind spot. Including me. That is why this works from the outside in.' },

  {t:'list',
    eyebrow:'Where the income is really stuck',
    h2:'It is almost always one of five places.',
    items:[
      ['Leads','not enough of the right people finding you'],
      ['Sales','people enquire, then do not sign up'],
      ['Offer and prices','priced to be compared, not chosen'],
      ['Systems','everything still lands on you'],
      ['A block','a belief or habit you have not noticed yet']
    ] },

  {t:'part', part:'Part Two', h2:'The Higher Months Method' },

  {t:'content',
    eyebrow:'Step one  ·  Clarity',
    h2:'Put the whole business in numbers.',
    lead:'Your income goal, how many clients that takes, what you pay yourself each week, and what your days actually look like. Then we find the one block underneath the numbers, and the ONE thing to fix first.',
    sub:'You leave knowing what to stop, what can wait, and where your hours should go.' },

  {t:'content',
    eyebrow:'Step two  ·  Operate',
    h2:'Stop the habits that keep you stuck.',
    lead:'Running a different offer every time it is quiet. Posting more when you are worried. Saying yes to everything. These feel like effort. They keep you on the same number.',
    sub:'Then we train your focus on the clients and income you want, so the decisions that follow move you toward it.' },

  {t:'content',
    eyebrow:'Step three  ·  Design',
    h2:'Build the business around your life.',
    lead:'Class times, hours and team that fit around school runs, sick days and holidays. Positioning so people choose you instead of shopping on price. Systems so not everything has to be you.',
    sub:'Growing stops meaning more of you.' },

  {t:'content',
    eyebrow:'Step four  ·  Sustain',
    h2:'Make your best month repeatable.',
    lead:'Identify what is actually bringing clients in and keeping them, so you can repeat it instead of chasing the next strategy. Review the numbers every 90 days and set what gets your attention next.',
    sub:'A good month stops being luck. It becomes what your business does.' },

  {t:'hook',
    eyebrow:'The whole method in one line',
    big:'Find the right problem. Fix that first. Everything you were already doing starts to work.' },

  {t:'part', part:'Part Three', h2:'What it looks like' },

  {t:'content',
    eyebrow:'The outcome',
    h2:'Your best month becomes your normal month.',
    lead:'Consistent higher months, because you know what brings clients in and keeps them. Growth that does not need more classes, more pressure, or another list only you can do.',
    sub:'You pay yourself a proper wage, every week, from the business you built.' },

  {t:'content',
    eyebrow:'Why me',
    h2:'Twenty-five years of seeing what owners cannot.',
    lead:'I started selling gym memberships in 2000, then opened three outdoor group fitness businesses and a personal training studio, and wrote and taught the Diploma and Advanced Diploma in fitness business.',
    sub:'I have worked with more than 2,000 women who own fitness businesses, from first-year outdoor groups to studios over a million a year. What I am best known for is seeing the one thing you are too close to see.' },

  {t:'cta',
    eyebrow:'Your next step',
    h2:'Find your one thing.',
    lead:'Come to the live session and we will find what is really keeping your fitness business stuck, and the first thing to change. Then you decide what you want to do next.',
    brand:'Kellie Sanders  ·  Higher Months',
    disc:'Educational only. Examples describe past experiences and are not a promise of results. Outcomes vary with your business, market and effort. No income or results guarantee.' }
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let h = '';
  if (s.eyebrow) h += `<p class="eyebrow">${s.eyebrow}</p>`;
  if (s.t==='part'){ h += `<p class="part">${s.part}</p><h2>${s.h2}</h2>`; }
  else if (s.t==='hook'){ h += `<p class="big">${s.big}</p>`; }
  else if (s.t==='title'){ h += `<h1>${s.h1}</h1><p class="lead">${s.lead}</p><p class="brandline">${s.brand}</p>`; }
  else if (s.t==='list'){
    h += `<h2>${s.h2}</h2><ul>`;
    for (const [k,v] of s.items){ h += `<li><span class="k">${k}</span><span>${v}</span></li>`; }
    h += `</ul>`;
  } else {
    if (s.h2) h += `<h2>${s.h2}</h2>`;
    if (s.lead) h += `<p class="lead">${s.lead}</p>`;
    if (s.sub) h += `<p class="sub">${s.sub}</p>`;
    if (s.brand) h += `<p class="brandline">${s.brand}</p>`;
    if (s.disc) h += `<p class="disc">${s.disc}</p>`;
  }
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
