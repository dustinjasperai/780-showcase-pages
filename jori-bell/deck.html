<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Your Career Like a Product — a live masterclass with Jori Bell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,500;0,600;1,500&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8fb;        /* warm near-white ground (her light #ffffff/#f0f0f0) */
    --panel:#ffffff;
    --rule:#e6ddef;      /* faint violet-gray rule */
    --accent:#b564f7;    /* her documented Substack violet (#b564f7, brand.json) */
    --deep:#6b3fa0;
    --ink:#363737;       /* her dominant text charcoal (#363737, brand.json) */
    --muted:#868787;     /* her gray (#868787) */
    --head:'Petrona',Georgia,serif;
    --body:'Albert Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 56px;margin:22px 0;min-height:360px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(54,55,55,.02)}
  .slide.cover{background:linear-gradient(180deg,#ffffff 0%,#f6eefe 100%);min-height:440px}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:600;font-size:46px;line-height:1.08;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:600;font-size:32px;line-height:1.15;margin:0 0 16px}
  .lead{font-size:20px;color:var(--ink);margin:0 0 10px}
  p{font-size:17px;color:var(--ink);margin:0 0 12px;max-width:62ch}
  .muted{color:var(--muted)}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:17px;padding:10px 0 10px 28px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:4px;top:19px;width:8px;height:8px;border-radius:50%;
    background:var(--accent)}
  .big{font-family:var(--head);font-size:34px;line-height:1.2;font-weight:600;max-width:20ch}
  .em{color:var(--accent);font-style:italic}
  .steps{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .step{flex:1;min-width:150px;border:1px solid var(--rule);border-radius:10px;padding:16px 16px 18px}
  .step .n{font-family:var(--head);font-size:13px;color:var(--accent);font-weight:600}
  .step .t{font-family:var(--head);font-size:20px;font-weight:600;margin:6px 0 4px}
  .step .d{font-size:14px;color:var(--muted)}
  .step.on{background:#f6eefe;border-color:var(--accent)}
  .divider .kick{font-size:13px}
  .divider h2{font-size:40px}
  .cred{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .chip{border:1px solid var(--rule);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch}
  .foot{font-size:13px;color:var(--muted);margin-top:28px}
  .num{position:absolute;top:18px;right:24px;font-size:12px;color:var(--muted);font-family:var(--body)}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'cover', cls:'cover', html:`
    <div class="kick">Product Therapy · live masterclass</div>
    <h1>Run Your Career Like a Product</h1>
    <p class="lead">Executive presence for product leaders who have the title and still feel the doubt.</p>
    <p class="muted">A live 60 minute session with Jori Bell. 15+ years in product at Hampton, Audible, Spotify, SoundCloud, Rolling Stone and AOL.</p>`},

  {t:'who', html:`
    <div class="kick">Who this is for</div>
    <h2>You lead product. You are not sure you are leading yourself.</h2>
    <ul>
      <li>Recently promoted, with scope that grew faster than the playbook</li>
      <li>Newly hired into a role where everyone assumes you already know</li>
      <li>Stuck or quietly reconsidering where this is all going</li>
      <li>Strong at the craft, less sure about the presence the next level needs</li>
    </ul>`},

  {t:'trap', html:`
    <div class="kick">The trap</div>
    <p class="big">You run discovery on the product. You run retros with the team. You have never run either on <span class="em">your own career</span>.</p>`},

  {t:'reframe', html:`
    <div class="kick">A reframe</div>
    <p class="big">Executive presence is not charisma. It is clarity under pressure. And it can be built the same way you build a good product.</p>`},

  {t:'divider', cls:'divider', html:`
    <div class="kick">Part one</div>
    <h2>Why strong product people stall</h2>`},

  {t:'stall', html:`
    <div class="kick">The ceiling</div>
    <p>The craft got you here. Shipping, prioritizing, reading the data. The next level is not more craft.</p>
    <p>It is judgment when the data runs out, presence when the room is tense, and influence you cannot mandate. Nobody promoted you into those. They assumed.</p>`},

  {t:'imposter', html:`
    <div class="kick">The fraud feeling</div>
    <p class="big">The imposter feeling is not a stop sign. For a non technical leader especially, it is the signal that you are operating at a new altitude.</p>
    <p class="muted">The work is learning to lead from it, not waiting for it to disappear.</p>`},

  {t:'divider', cls:'divider', html:`
    <div class="kick">Part two</div>
    <h2>The Product Therapy method</h2>
    <p class="muted">The same loop you run on a product, pointed at your own career and leadership.</p>`},

  {t:'method', html:`
    <div class="kick">The loop</div>
    <h2>Four steps, deliberately small</h2>
    <div class="steps">
      <div class="step"><div class="n">01</div><div class="t">Awareness</div><div class="d">Where are you stuck, where are you energized</div></div>
      <div class="step"><div class="n">02</div><div class="t">Hypotheses</div><div class="d">Name a few real paths forward</div></div>
      <div class="step on"><div class="n">03</div><div class="t">Experiment</div><div class="d">Move 10 percent, measure</div></div>
      <div class="step"><div class="n">04</div><div class="t">Place a Bet</div><div class="d">Commit with evidence</div></div>
    </div>`},

  {t:'awareness', html:`
    <div class="kick">Step one · Awareness</div>
    <h2>Run the retro on yourself</h2>
    <p>Slow down and notice what is working and what is not, the way you would in product discovery. Deep discovery, a career retro, a weekly diary of where the energy goes.</p>
    <p class="muted">The question that starts it: where do you feel stuck, and where do you feel energized?</p>`},

  {t:'hypotheses', html:`
    <div class="kick">Step two · Hypotheses</div>
    <h2>Name the paths, not the answer</h2>
    <p>Instead of chasing one fix, form a few potential paths grounded in your values and goals. Bigger company, smaller company, fractional, a sabbatical, a different kind of scope.</p>
    <p class="muted">You are generating options to test, not picking a winner yet.</p>`},

  {t:'experiment', html:`
    <div class="kick">Step three · Experiment</div>
    <h2>Move 10 percent</h2>
    <p>Bring your incremental product brain to the decision. Define a success metric first, efficiency or happiness, then ask the only question that matters early: how can you move 10 percent in that direction?</p>
    <p class="muted">Small, measured moves tell you what is true before you commit the whole career to it.</p>`},

  {t:'bet', html:`
    <div class="kick">Step four · Place a Bet</div>
    <h2>Commit with evidence</h2>
    <p>By now you are usually ready to commit to a path, knowing it is based on a thoughtful, deliberate process rather than a leap of faith.</p>
    <p class="muted">The unexpected opportunities tend to show up here, six to nine months in, because you were paying attention.</p>`},

  {t:'divider', cls:'divider', html:`
    <div class="kick">Part three</div>
    <h2>In the room, under pressure</h2>`},

  {t:'influence', html:`
    <div class="kick">Influence without authority</div>
    <h2>Earn the yes you cannot mandate</h2>
    <ul>
      <li>Read the room before you defend the roadmap</li>
      <li>Make the trade off visible so the decision belongs to everyone</li>
      <li>Speak to what sales, brand and engineering each actually need</li>
      <li>Let the team tear your strategy apart, on purpose</li>
    </ul>`},

  {t:'presence', html:`
    <div class="kick">Presence in practice</div>
    <h2>Clarity is the whole move</h2>
    <p>Presence is not volume. It is being the clearest person in the room about what matters and why. That is a product skill. You already have it for the roadmap. This points it at how you lead.</p>`},

  {t:'edge', html:`
    <div class="kick">The insider's edge</div>
    <p class="big">This is executive coaching with an insider's edge. A coach who has shipped under pressure, managed the stakeholders and felt the same doubt, not a generalist asking questions from the outside.</p>`},

  {t:'why', html:`
    <div class="kick">Why Jori</div>
    <h2>15+ years in the trenches</h2>
    <p>Consumer product leadership at Hampton, Audible, Spotify, SoundCloud, Rolling Stone and AOL. A coaching and advising blend: real questions when you need to think, a real point of view when you need the insider read.</p>
    <div class="cred">
      <span class="chip">Hampton</span><span class="chip">Audible</span><span class="chip">Spotify</span>
      <span class="chip">SoundCloud</span><span class="chip">Rolling Stone</span><span class="chip">AOL</span>
    </div>`},

  {t:'recap', html:`
    <div class="kick">One idea to keep</div>
    <p class="big">You already know how to grow a product. Point that same discipline at your career, and the presence follows.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h2>Work with Jori</h2>
    <p>If this is the kind of thinking partner you have been missing, the next step is a conversation. Read a little of Product Therapy first to see if we fit, then reach out to talk about coaching.</p>
    <p class="lead">joribell.com · hello@joribell.com</p>
    <p class="disc">This masterclass is educational. It shares a coaching approach and perspective. No income, role, promotion, or outcome is guaranteed, and results vary from person to person.</p>`}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.cls?(' '+s.cls):'');
  el.innerHTML='<div class="num">'+(i+1)+' / '+S.length+'</div>'+s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
