<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Performing, a Live Masterclass with Sonya Choi La Rosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2;
  --panel:#f3efe8;
  --rule:#e4dccf;
  --ink:#37332d;
  --accent:#d1470d;
  --deep:#344398;
  --dim:#706a61;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Mulish',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#deck{}
.slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 9vw;position:relative;border-bottom:1px solid var(--rule);scroll-snap-align:start}
.kicker{font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
.num{font-family:'Gilda Display',Didot,Georgia,serif;font-style:italic;font-size:30px;color:var(--dim);margin-bottom:10px}
h1{font-family:'Gilda Display',Didot,Georgia,serif;font-weight:600;line-height:1.04;letter-spacing:-.01em;font-size:clamp(42px,7vw,88px);color:var(--ink)}
h2{font-family:'Gilda Display',Didot,Georgia,serif;font-weight:600;line-height:1.08;font-size:clamp(34px,5vw,62px);color:var(--ink)}
.sub{font-family:'Gilda Display',Didot,Georgia,serif;font-style:italic;font-size:clamp(20px,2.6vw,30px);color:var(--dim);margin-top:20px;max-width:24ch}
.body{font-size:clamp(17px,1.9vw,22px);line-height:1.65;color:var(--ink);margin-top:26px;max-width:40ch;font-weight:400}
.foot{position:absolute;left:9vw;bottom:5vh;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:600}
.tag{display:inline-block;font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--accent);padding:7px 15px;border-radius:4px;margin-bottom:22px}
ul{list-style:none;margin-top:30px;max-width:46ch}
li{font-size:clamp(16px,1.8vw,21px);line-height:1.5;padding:16px 0 16px 40px;border-top:1px solid var(--rule);position:relative;color:var(--ink)}
li:first-child{border-top:none}
li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:16px;border:2px solid var(--accent);border-radius:50%}
.title h1{font-size:clamp(52px,10vw,132px)}
.ground{background:var(--panel)}
.accentbar{width:70px;height:5px;background:var(--accent);border-radius:3px;margin:28px 0 0}
.deepword{color:var(--deep)}
.cta h1{color:var(--accent)}
.disc{font-size:13px;line-height:1.6;color:var(--dim);margin-top:24px;max-width:52ch;font-weight:400}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
{t:'title', kicker:'A Live Masterclass for Women in Leadership', h:'Stop Performing', sub:'The presence you already have, and how to stop editing it in the room', foot:'with Sonya Choi La Rosa'},
{t:'promise', kicker:'In the next hour', h:'What this hour gives you', points:['Why more confidence is the wrong goal','The three layers that build real leadership presence','How your Human Design makes presence feel like you','A 30-day plan to be seen as the leader you already are']},
{t:'who', kicker:'Who this is for', h:'This is for you if', points:['You are respected for your delivery but overlooked for the role','You soften or edit yourself to fit the room','You have done the confidence work and still feel unseen','You are stepping into a bigger seat and want to arrive as yourself']},
{t:'trap', kicker:'The trap', h:'You were told presence means more', body:'More gravitas. More authority. More polish. So you added. And performing a bigger version of yourself all day is exhausting, and the room still reads it as almost.'},
{t:'reframe', kicker:'The reframe', h:'You do not need more. You need to subtract.', body:'Presence is not something you have or you do not. It is built, from the inside out. The work is removing the toned-down version you have been maintaining, not bolting on a louder one.'},
{t:'cost', kicker:'What it is costing you', h:'The hidden cost', body:'Leadership costs energy. Editing yourself costs more. Every hour spent monitoring how you come across is an hour not spent leading. Self-monitoring is the tax the performed version charges.'},
{t:'part', num:'Part One', h:'Why confidence coaching stalls', body:'Confidence is an output, not an input. Told to feel more confident, you manage the feeling instead of changing what the room actually receives. Presence is built in three layers, and confidence is the result of getting them right.'},
{t:'partintro', num:'Part Two', h:'The 3D Method', sub:'Discover. Define. Design. The order matters, because each layer sets up the next.'},
{t:'framework', tag:'Discover', h:'See how you show up now', body:'Before you change anything, you map it. How you lead, where you hold back, and the gap between how you see yourself and how the room receives you. Clarity is confidence.'},
{t:'framework', tag:'Define', h:'Your leadership identity', body:'This is where Human Design for Leadership comes in. We anchor your identity in how you are actually wired, so your positioning and your throughline feel native, not borrowed from a playbook that is not yours.'},
{t:'framework', tag:'Design', h:'Presence as signal', body:'Now it becomes visible. Style, colour and visibility, chosen on purpose, so what the room sees matches who you are before you say a word.'},
{t:'pillars', kicker:'The system', h:'Five layers, one presence', points:['Operating experience, 25 years leading in the real world','Strategic coaching, so the work is yours','Identity and brand, inside to outside','Style strategy, the visual signal','Human Design, the layer that keeps it authentic']},
{t:'signal', kicker:'The Design layer, in practice', h:'What a room hears before you speak', points:['The Colour Power Framework, what your outfit argues for you','The 3-Piece Rule, instant polish without a new wardrobe','The leadership capsule, built from your strategy','A 30-day visibility plan, so you are seen on purpose']},
{t:'enclothed', kicker:'Why style belongs here', h:'Your style is a leadership argument', body:'Enclothed cognition is real. What you wear changes how you think and how you are read. Most leaders make that argument by accident. You are going to make it on purpose.'},
{t:'before', kicker:'Before', h:'Respected, reliable, overlooked', body:'Doing the work, softening the edges, waiting to be chosen, and wondering why recognition keeps landing somewhere else in the room.'},
{t:'after', kicker:'After', h:'Received as the leader', body:'You walk in as the whole version of yourself. Your identity, your brand and your style say the same thing, and the room receives the leader instead of the edited stand-in.'},
{t:'whyme', kicker:'Why me', h:'Sonya Choi La Rosa', body:'25 years in financial services, GM roles across technology, operations and transformation. ICF credentialed coach, Human Design specialist, and styling credentials through the Academy of Style and Image. I built this because I lived the toned-down version first.'},
{t:'recap', kicker:'What you now have', h:'The throughline', points:['A reframe, subtract the performance','The 3D Method, Discover, Define, Design','Human Design as your identity anchor','Style and visibility as signal, on purpose']},
{t:'cta', kicker:'Your next step', h:'Apply for ASCEND', sub:'The Presence Signature, a six-week private partnership', body:'If this is the work you want to do with me, apply for ASCEND and we will build your presence as one coherent system.', disc:'No specific outcome, title, or result is guaranteed. Results vary and depend on your own effort and circumstances. This masterclass is educational in nature.', foot:'sonyachoilarosa.com'}
];

function el(tag, cls, html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=el('section','slide'+(s.t==='title'||s.t==='partintro'||s.t==='cta'?' ground':'')+(s.t==='title'?' title':'')+(s.t==='cta'?' cta':''));
  if(s.kicker)sec.appendChild(el('div','kicker',s.kicker));
  if(s.num)sec.appendChild(el('div','num',s.num));
  if(s.tag)sec.appendChild(el('span','tag',s.tag));
  if(s.h){sec.appendChild(el(s.t==='title'||s.t==='cta'?'h1':'h2',null,s.h));}
  if(s.t==='title'||s.t==='partintro'||s.t==='reframe')sec.appendChild(el('div','accentbar'));
  if(s.sub)sec.appendChild(el('div','sub',s.sub));
  if(s.body)sec.appendChild(el('div','body',s.body));
  if(s.points){const ul=el('ul');s.points.forEach(p=>ul.appendChild(el('li',null,p)));sec.appendChild(ul);}
  if(s.disc)sec.appendChild(el('div','disc',s.disc));
  if(s.foot)sec.appendChild(el('div','foot',s.foot));
  deck.appendChild(sec);
});
</script>
</body>
</html>
