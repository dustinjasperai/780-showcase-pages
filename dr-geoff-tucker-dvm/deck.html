<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Thriving Horse — a masterclass with Dr Geoff Tucker, DVM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f8; --panel:#fdfefe; --rule:#d9e1ea;
    --ink:#122b46; --muted:#4d5c6d; --accent:#1e73be; --pop:#00d084;
    --serif:"Spectral",Georgia,serif; --sans:"Mulish",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(18,43,70,.03)}
  .slide.cover{background:var(--ink);color:#f7f4ee;border-color:var(--ink)}
  .slide.part{background:var(--ink);color:#f7f4ee;border-color:var(--ink)}
  .slide.cta{background:#0d2036;color:#f7f4ee;border-color:#0d2036}
  .kicker{font-family:var(--sans);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin:0 0 18px}
  .slide.cover .kicker,.slide.part .kicker,.slide.cta .kicker{color:#8ec6f3}
  h1{font-family:var(--serif);font-weight:700;font-size:54px;line-height:1.05;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;margin:0 0 16px;letter-spacing:-.01em}
  .sub{font-family:var(--serif);font-size:23px;line-height:1.4;color:var(--muted);margin:0 0 6px;font-style:italic}
  .slide.cover .sub,.slide.part .sub,.slide.cta .sub{color:#c7d6e6}
  .body{font-size:19.5px;line-height:1.58;max-width:62ch;margin:10px 0 0}
  .slide.cover .body,.slide.part .body,.slide.cta .body{color:#dce6f0}
  ul{margin:14px 0 0;padding:0;list-style:none;max-width:64ch}
  li{position:relative;padding:11px 0 11px 30px;font-size:19px;line-height:1.45;border-top:1px solid var(--rule)}
  li:first-child{border-top:0}
  li:before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .slide.part li,.slide.cta li{border-color:rgba(255,255,255,.14)}
  .slide.part li:before,.slide.cta li:before{background:var(--pop)}
  .byline{margin-top:24px;font-weight:700;font-size:17px}
  .byline span{color:#8ec6f3;font-weight:600}
  .lead{font-size:26px;line-height:1.4;font-family:var(--serif)}
  .strike{text-decoration:line-through;color:#9fb0c0;text-decoration-thickness:2px}
  .hl{color:var(--accent);font-weight:600}
  .slide.part .hl,.slide.cta .hl{color:var(--pop)}
  .disc{margin-top:26px;font-size:13.5px;line-height:1.5;color:#9fb0c0;max-width:70ch}
  .pagenum{position:absolute;right:20px;bottom:14px;font-size:12px;color:var(--rule)}
  .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">The Horse's Advocate &middot; Helping Horses Thrive In A Human World</div>
<script>
const S = [
  {t:'cover', kicker:'A free live masterclass with Dr Geoff Tucker, DVM',
   h:'The Thriving Horse',
   sub:'What 50 years with horses taught me that the feed charts never will.',
   body:'A plain, first-principles hour on keeping a horse genuinely healthy. Not more products. Not more sedation. Fewer, better decisions.',
   byline:'Dr Geoff Tucker, DVM <span>"Doc T", The Horse\'s Advocate</span>'},

  {t:'promise', kicker:'What you will leave with',
   h:'Three levers, one horse',
   body:'By the end of this hour you will know the three things that decide whether a horse thrives, and one change you can make tonight that costs nothing and takes two weeks to show.',
   list:['The forage-first nutrition lever', 'The low-stress mouth and body lever', 'The read-the-horse lever']},

  {t:'who', kicker:'Who this is for',
   h:'The owner who already cares a lot',
   body:'You feed carefully. You call the vet. You buy the supplements. And something still feels off, or you simply suspect there is a better way. This is for the horse person who is willing to question what "normal" care actually does.'},

  {t:'trap', kicker:'The quiet trap',
   h:'We care for horses the way that is easy for us',
   body:'Stalls so they are easy to find. Grain so feeding is quick and they look "shiny". Sedation so the dentist is fast. Each choice is made for human convenience, and the horse quietly pays for all of them at once.'},

  {t:'reframe', kicker:'The reframe',
   h:'Much of what we call normal is working against the horse',
   lead:true,
   body:'The horse evolved for one life. We ask it to live another. The gap between those two lives is where almost every common problem begins, long before it has a name.'},

  {t:'part', kicker:'Part one', h:'The horse you have, and the horse you manage'},

  {t:'content', kicker:'The horse you have',
   h:'Built for forage, movement, and the herd',
   body:'A horse is a trickle-feeding, constantly-moving, deeply social prey animal. Its gut, its teeth, and its nervous system all assume that life. Nothing about it assumes two large meals of grain and a day in a box.'},

  {t:'content', kicker:'The horse we manage',
   h:'What we do instead',
   list:['Grain and sweet feed for energy the horse was never designed to process',
         'Long hours standing still, away from the herd',
         'Routine sedation for care that can often be done calmly without it',
         'Teeth, gut, and behavior treated as three separate problems']},

  {t:'part', kicker:'Part two', h:'The three levers'},

  {t:'content', kicker:'Lever one',
   h:'Forage-first nutrition',
   body:'The No-Grain idea is simple and it unsettles people: most horses do not need grain at all. Hay or pasture, fresh water, and plain salt feed the horse the gut actually evolved for. Grain is optional, and for many horses it is quietly the problem.'},

  {t:'content', kicker:'Lever one, in practice',
   h:'The two-week change you can make tonight',
   body:'Note how your horse looks and acts today. Stop all grain, sweet feed, and added sugar. Feed forage, water, and salt. Watch for fourteen days. Owners routinely report calmer behavior, steadier energy, and a settled gut. It costs nothing to try.'},

  {t:'content', kicker:'Lever two',
   h:'A low-stress mouth and body',
   body:'A horse that fights the dentist is usually a horse in fear, not a horse that needs more drugs. Most horses can have their teeth floated calmly, without sedation, when the handling earns their trust first. Lower stress is not a nicety. It is health.'},

  {t:'content', kicker:'Lever two, in practice',
   h:'Trust before tools',
   body:'The method is handling first, instruments second: a calm approach, time, and reading the horse, so the work gets done without a power struggle. The same principle that makes dentistry calm makes everything else with the horse calmer too.'},

  {t:'content', kicker:'Lever three',
   h:'Read the horse',
   body:'The horse is telling you the truth constantly, in posture, gut sound, appetite, and attention. Most owners were taught to read the symptom and the product label instead. Learning to read the animal is what turns three separate problems back into one horse.'},

  {t:'content', kicker:'The system',
   h:'Helping horses thrive in a human world',
   body:'Nutrition, the mouth and body, and reading the horse are not three hobbies. They are one system. Pull one lever and the others move. This is the whole idea behind everything I teach: care for the horse as one animal, from first principles.'},

  {t:'part', kicker:'Part three', h:'What a thriving horse looks like'},

  {t:'content', kicker:'The outcome',
   h:'Calmer, steadier, and cheaper to keep',
   list:['A settled gut and steady weight on forage, not grain',
         'Care, including dentistry, done with far less stress',
         'Fewer reactive fixes, because you caught things earlier',
         'An owner who makes decisions from understanding, not fear']},

  {t:'content', kicker:'Why listen to me',
   h:'An iconoclast with fifty years in the field',
   body:'I am a Cornell-educated veterinarian who has spent more than fifty years working on horses, much of it with my hands in their mouths. I have changed my mind about a lot of "standard" horse care because the horses kept showing me a better way. I teach what the horses taught me.'},

  {t:'content', kicker:'The gap I fill',
   h:'The missing horse owner\'s manual',
   body:'Nobody ever handed you a trustworthy, first-principles manual for owning a horse, so you were left to trust feed labels and routine. My work, nearly a thousand articles, videos, and live sessions, is that manual, written by someone with no product to sell you.'},

  {t:'recap', kicker:'In one breath',
   h:'Three levers, one horse',
   list:['Feed the horse forage first; grain is optional',
         'Earn trust so care, including the mouth, is low-stress',
         'Learn to read the horse and treat it as one animal']},

  {t:'cta', kicker:'Your next step',
   h:'Start tonight, then go deeper',
   body:'Begin the free Two-Week No-Grain Challenge tonight. It costs nothing and your horse will tell you within fourteen days. When you want the full manual, the courses, the live Rounds, and direct access to me, join Doc T\'s Inner Circle.',
   list:['Free: the Two-Week No-Grain Challenge', 'Go deeper: Doc T\'s Inner Circle'],
   disc:'Educational only. Every horse is different; consult your own veterinarian for your horse. No specific health, behavior, or financial result is guaranteed, and individual results vary.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t==='cover'?'cover':s.t==='part'?'part':s.t==='cta'?'cta':'');
  el.style.position='relative';
  let html='';
  if(s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='cover'||s.h&&(s.t==='cover')) html += '<h1>'+s.h+'</h1>';
  else if(s.h) html += (s.t==='part'||s.t==='cover') ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>';
  if(s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if(s.body) html += '<p class="body'+(s.lead?' lead':'')+'">'+s.body+'</p>';
  if(s.list){ html += '<ul>'; s.list.forEach(it=> html += '<li>'+it+'</li>'); html += '</ul>'; }
  if(s.byline) html += '<div class="byline">'+s.byline+'</div>';
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  html += '<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
