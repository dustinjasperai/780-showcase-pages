<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Get Into Medical Sales | A Masterclass by Samuel Adeyinka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbfaf8;
    --panel:#f2f0f6;
    --rule:#dcd8e6;
    --ink:#0f0920;
    --accent:#cc3366;
    --dim:#6b6478;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:block;width:100%;max-width:960px;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .slide{border-left:6px solid var(--accent);padding-left:38px}
  .k{font-family:'Inter';font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Montserrat';font-weight:800;font-size:60px;line-height:1.05;letter-spacing:-.02em;margin-bottom:24px}
  h2{font-family:'Montserrat';font-weight:700;font-size:40px;line-height:1.12;letter-spacing:-.01em;margin-bottom:20px}
  .s{font-size:24px;line-height:1.5;color:var(--dim);max-width:42ch}
  .b{font-size:22px;line-height:1.6;color:#2c2540;max-width:46ch}
  .b strong{color:var(--ink);font-weight:600}
  .em{color:var(--accent);font-weight:700}
  ul{list-style:none;margin-top:14px}
  li{font-size:22px;line-height:1.4;color:#2c2540;padding:16px 0 16px 40px;border-bottom:1px solid var(--rule);position:relative;max-width:52ch}
  li:last-child{border-bottom:none}
  li .n{position:absolute;left:0;top:16px;font-family:'Montserrat';font-weight:800;color:var(--accent)}
  li b{font-family:'Montserrat';font-weight:700;color:var(--ink);display:block;font-size:23px;margin-bottom:2px}
  .steps li{padding-left:64px}
  .steps li .n{font-size:26px;width:44px;text-align:left}
  .big{font-family:'Montserrat';font-weight:800;font-size:72px;line-height:1.02;letter-spacing:-.02em}
  .note{margin-top:26px;font-size:15px;color:var(--dim);font-style:italic;max-width:60ch;line-height:1.5}
  .card{background:var(--panel);border-radius:16px;padding:34px 38px;margin-left:-38px;border-left:6px solid var(--accent)}
  .foot{position:fixed;left:7vw;bottom:3.4vh;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .nav{position:fixed;right:7vw;bottom:3vh;display:flex;gap:10px;align-items:center}
  .nav button{font-family:'Inter';font-weight:600;font-size:15px;border:1px solid var(--rule);background:#fff;color:var(--ink);width:44px;height:44px;border-radius:10px;cursor:pointer}
  .nav button:hover{border-color:var(--accent);color:var(--accent)}
  .count{font-size:14px;color:var(--dim);min-width:52px;text-align:center}
  @media(max-width:640px){h1{font-size:38px}h2{font-size:28px}.s,.b,li{font-size:18px}.big{font-size:44px}.slide{padding-left:22px;border-left-width:5px}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="foot">A Masterclass by Samuel Adeyinka &middot; Evolve Your Success</div>
<div class="nav"><button id="prev">&#8592;</button><span class="count" id="count"></span><button id="next">&#8594;</button></div>
<script>
const S=[
 {t:'title', k:'A live masterclass', h:'Get Into Medical Sales Without Sales Experience', s:'The path reps actually take from outside the industry to a signed offer, taught live.'},
 {t:'point', k:'Who this is for', h:'You are closer than you think', b:'Nurses, clinicians, grad students, and career changers who want into medical or medical device sales and keep hearing the same thing: <strong>come back when you have sales experience.</strong>'},
 {t:'point', k:'The trap', h:'The application black hole', b:'You found the job. You uploaded the resume. Then nothing. Most openings never see a cold applicant, because the people who get them were <strong>referred before the post went live.</strong>'},
 {t:'reframe', k:'The reframe', h:'Getting hired here is not a resume problem.', s:'It is an access problem. And access is something you can build on purpose.'},
 {t:'section', k:'Part One', h:'Why the applications are not landing'},
 {t:'steps', k:'Three quiet reasons', h:'It is rarely about you', items:[
   ['No warm referral','You are a stranger in a stack of strangers, ranked by a filter.'],
   ['Wrong specialty','Device, pharma, diagnostics, and capital equipment hire very differently.'],
   ['Generic positioning','Your clinical story is an asset, told the wrong way it reads as a risk.']]},
 {t:'point', k:'The specialty point', h:'You are knocking on the wrong door', b:'Medical sales is not one job. The lane you target should match your background and the way that lane actually buys reps. Pick the fit first, and every step after it gets easier.'},
 {t:'section', k:'Part Two', h:'The 4-Step Career Builder Path'},
 {t:'steps', k:'The path', h:'Four steps, in order', items:[
   ['Discover','Find the specialty that fits your background and pays for your goals.'],
   ['Learn','Build the selling skills that specific lane screens for.'],
   ['Access','Warm introductions to the hiring managers who actually decide.'],
   ['Interview','Turn those conversations into more than one real offer.']]},
 {t:'point', k:'Step three, the one that changes everything', h:'We open the doors', b:'The step no amount of solo applying replaces: <span class="em">real introductions to real hiring managers.</span> This is where an outsider becomes a referred candidate, and referred candidates get the interviews.'},
 {t:'point', k:'What we do not stop at', h:'We do not stop until you are hired', b:'The work is not a course you finish and forget. The coaching continues, tied to the outcome, <strong>until you have signed.</strong> That is the promise the path is built around.'},
 {t:'section', k:'Part Three', h:'Then you choose a direction'},
 {t:'steps', k:'The Four Career Pathways', h:'Getting in is step one', items:[
   ['The Architect','Go deep and become the specialist a territory relies on.'],
   ['The Climber','Move up into leadership and manage the reps.'],
   ['The Entrepreneur','Own your book and build something of your own.'],
   ['The Forever','Master the craft and stay great at it for the long game.']]},
 {t:'point', k:'The ninety-day arc', h:'The first ninety days', b:'Week one you name your lane. By week four you sound like an insider. By month three you are in conversations most applicants never reach, because someone opened the door and you were ready to walk through it.'},
 {t:'point', k:'Why listen to me', h:'I have been on both sides of this', b:'<strong>Samuel Adeyinka.</strong> Eighteen years in medical sales, ICF certified coach, and I have trained teams at firms like Siemens Healthineers and Providence. My students are hired at Stryker, Medtronic, and Boston Scientific.'},
 {t:'big', k:'The whole idea', h:'BIG:Access is a skill. It can be taught. And it is faster than applying alone.'},
 {t:'point', k:'The objection', h:'"But I have no network"', b:'Neither did most of the people now selling for the biggest names in the field. The network is not a prerequisite. <strong>Building it is the work,</strong> and it is exactly what this path walks you through.'},
 {t:'steps', k:'The recap', h:'The path in one slide', items:[
   ['Discover','The lane that fits.'],
   ['Learn','The skills it screens for.'],
   ['Access','The introductions that count.'],
   ['Interview','The offers, plural.']]},
 {t:'cta', k:'Your next step', h:'Come to the live session', b:'Bring your background and your questions. Leave knowing your lane, your positioning, and the exact next move to get in front of hiring managers.', note:'This masterclass is educational. No specific job, salary, or result is guaranteed. Outcomes vary with your effort, background, and market.'}
];

const stage=document.getElementById('stage');
function esc(x){return x;}
function slideHTML(o){
  if(o.t==='title') return `<div class="slide"><div class="k">${o.k}</div><h1>${o.h}</h1><div class="s">${o.s}</div></div>`;
  if(o.t==='reframe') return `<div class="slide"><div class="k">${o.k}</div><h1>${o.h}</h1><div class="s">${o.s}</div></div>`;
  if(o.t==='section') return `<div class="slide"><div class="k">${o.k}</div><h1>${o.h}</h1></div>`;
  if(o.t==='point') return `<div class="slide"><div class="k">${o.k}</div><h2>${o.h}</h2><div class="b">${o.b}</div></div>`;
  if(o.t==='big'){const parts=o.h.split('BIG:');return `<div class="slide"><div class="k">${o.k}</div><div class="big">${parts[1]}</div></div>`;}
  if(o.t==='steps'){let li=o.items.map((it,i)=>`<li class="">${o.k==='The Four Career Pathways'?'':`<span class="n">${i+1}</span>`}<b>${it[0]}</b>${it[1]}</li>`).join('');return `<div class="slide"><div class="k">${o.k}</div><h2>${o.h}</h2><ul class="steps">${li}</ul></div>`;}
  if(o.t==='cta') return `<div class="slide"><div class="k">${o.k}</div><h2>${o.h}</h2><div class="card"><div class="b">${o.b}</div></div><div class="note">${o.note}</div></div>`;
  return '';
}
let i=0;
function render(){stage.innerHTML=slideHTML(S[i]);document.getElementById('count').textContent=(i+1)+' / '+S.length;}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
stage.addEventListener('click',e=>{if(!e.target.closest('.nav'))go(1);});
render();
</script>
</body>
</html>
