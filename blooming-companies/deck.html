<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faire Fleurir Votre Entreprise | Blooming Companies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Brand-derived palette: cream ground, deep green dominant, gold accent, slate ink. Font Raleway (brand) + Spectral. */
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#f7f4ec;
    --panel:#efe9dc;
    --green:#007041;
    --accent:#fbb800;
    --ink:#31464c;
    --ink-soft:#4b5a60;
    --rule:#ddd3c0;
  }
  html,body{height:100%;}
  body{
    font-family:'Spectral',Georgia,serif;
    background:var(--ink);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:28px;
  }
  #stage{ width:min(960px,96vw); aspect-ratio:16/9; background:var(--bg);
    border:1px solid var(--rule); position:relative; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .slide{ position:absolute; inset:0; padding:64px 72px; display:none;
    flex-direction:column; }
  .slide.on{ display:flex; }
  .eyebrow{ font-family:'Raleway',sans-serif; font-weight:700; font-size:13px;
    letter-spacing:.16em; text-transform:uppercase; color:var(--green); margin-bottom:18px; }
  h1{ font-family:'Raleway',sans-serif; font-weight:800; font-size:52px; line-height:1.06;
    color:var(--ink); letter-spacing:-.01em; }
  h2{ font-family:'Raleway',sans-serif; font-weight:700; font-size:34px; line-height:1.14;
    color:var(--ink); margin-bottom:16px; }
  .sub{ font-size:23px; color:var(--ink-soft); margin-top:20px; line-height:1.5; max-width:40ch; }
  p{ font-size:21px; color:var(--ink-soft); line-height:1.55; max-width:48ch; margin-bottom:12px; }
  .big{ font-family:'Raleway',sans-serif; font-weight:800; font-size:40px; line-height:1.15;
    color:var(--green); max-width:24ch; }
  ul{ list-style:none; margin-top:14px; }
  li{ font-size:21px; color:var(--ink-soft); line-height:1.5; padding-left:30px; position:relative; margin-bottom:14px; max-width:46ch; }
  li::before{ content:''; position:absolute; left:0; top:11px; width:12px; height:12px;
    border-radius:2px 10px 2px 10px; background:var(--accent); }
  .num{ font-family:'Raleway',sans-serif; font-weight:800; font-size:15px; color:var(--bg);
    background:var(--green); width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
  .spacer{ flex:1; }
  .foot{ font-family:'Raleway',sans-serif; font-size:13px; color:var(--ink-soft); letter-spacing:.04em; }
  .part{ background:var(--green); }
  .part .eyebrow{ color:var(--accent); }
  .part h1{ color:var(--bg); }
  .part .sub{ color:#e7efe9; }
  .center{ align-items:flex-start; justify-content:center; }
  .cta{ background:var(--panel); }
  .disc{ font-family:'Raleway',sans-serif; font-size:12.5px; color:var(--ink-soft);
    line-height:1.5; margin-top:22px; max-width:60ch; border-top:1px solid var(--rule); padding-top:14px; }
  .brandline{ font-family:'Raleway',sans-serif; font-weight:700; font-size:14px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--green); margin-top:26px; }
  .cue{ position:absolute; right:18px; bottom:14px; font-family:'Raleway',sans-serif;
    font-size:12px; color:var(--ink-soft); opacity:.7; }
  .accent-rule{ width:72px; height:5px; background:var(--accent); border-radius:3px; margin:22px 0 0; }
  @media (max-width:640px){ .slide{padding:34px 30px;} h1{font-size:32px;} h2{font-size:24px;}
    .big{font-size:26px;} .sub{font-size:17px;} p,li{font-size:16px;} }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title', eyebrow:'Masterclass en direct', h1:'Faire Fleurir Votre Entreprise',
    sub:"L'entrepreneuriat régénératif : bâtir une entreprise qui dure, comme on cultive un jardin.",
    brand:'Blooming Companies' },

  {t:'promise', eyebrow:'La promesse',
    big:"Et si votre entreprise poussait comme un jardin, au lieu de vous épuiser ?",
    p:"En 60 minutes, une autre logique de croissance : régénérative, vivante, soutenable. Vous repartez avec les trois mouvements à mettre en place." },

  {t:'forwho', eyebrow:'Pour qui', h2:'À qui cette heure est destinée',
    items:["Porteurs de projet, de l'idée au lancement","Entrepreneurs installés qui veulent une transformation durable","Celles et ceux qui atteignent leur limite personnelle et refusent de pousser plus fort"] },

  {t:'trap', eyebrow:'Le piège', h2:'Le conseil que l\'on entend partout',
    p:"« Poussez plus fort. Vendez plus. Scalez. »",
    p2:"On vous dit de traiter votre entreprise comme une machine : plus de carburant, plus de vitesse. Au bout du chemin : le plateau, et l'épuisement." },

  {t:'reframe', eyebrow:'Le retournement',
    big:"Une entreprise n'est pas une machine. C'est un système vivant.",
    p:"Un jardin ne pousse pas en forçant. Il pousse quand le sol, les saisons et la récolte sont en équilibre. Votre entreprise aussi." },

  {t:'part', eyebrow:'Partie 1', h1:'Croître contre le vivant',
    sub:"Pourquoi la logique « machine » finit toujours par appauvrir le sol." },

  {t:'body', eyebrow:'Le problème', h2:'Ce que la logique machine épuise',
    items:["Le fondateur : votre énergie devient le seul moteur","L'équipe : la pression remplace le rythme","Les ressources : on prélève plus qu'on ne régénère"] },

  {t:'body', eyebrow:'La conséquence', h2:'Le plateau n\'est pas un problème de volume',
    p:"Ce n'est pas qu'il manque de clients. C'est que le système n'a plus de quoi se renouveler. On ne sort pas de là en poussant davantage.",
    p2:"On en sort en re-concevant le sol." },

  {t:'part', eyebrow:'Partie 2', h1:'La méthode régénérative',
    sub:"Trois mouvements, tirés des principes de la permaculture appliqués à l'entreprise." },

  {t:'overview', eyebrow:'Vue d\'ensemble', h2:'Trois saisons de croissance',
    items:["Le sol : poser des fondations régénératives","Les saisons : croître au rythme du vivant","La récolte : cultiver des finances saines"] },

  {t:'pillar', num:'1', eyebrow:'Le sol', h2:'Poser des fondations régénératives',
    p:"Avant de chercher la croissance, on clarifie le terrain : vos valeurs, votre talent naturel, la raison d'être du projet.",
    p2:"C'est le travail de LA BOUSSOLE : approcher son projet avec sérénité, pas dans la précipitation." },

  {t:'pillar', num:'2', eyebrow:'Les saisons', h2:'Croître au rythme du vivant',
    p:"Chaque chose a sa saison : semer, entretenir, laisser reposer. On décide en fonction du cycle, pas de la panique.",
    p2:"Les principes de permaculture donnent les règles : coopérer plutôt que forcer, valoriser les ressources renouvelables, viser l'effet maximal avec le moindre épuisement." },

  {t:'example', eyebrow:'Un principe en pratique', h2:'5e principe : les ressources renouvelables',
    p:"« Utiliser et valoriser les services et les ressources renouvelables. »",
    p2:"Dans l'entreprise : s'appuyer sur ce qui se régénère (votre communauté, votre contenu, vos clients ambassadeurs) plutôt que d'acheter sans cesse de la croissance." },

  {t:'pillar', num:'3', eyebrow:'La récolte', h2:'Cultiver des finances saines',
    p:"Faire ses comptes comme on cultive un jardin : mettre l'argent au service de la vie, pas l'inverse.",
    p2:"Les trois leviers de motivation, un système que l'on tient vraiment, et des chiffres que l'on regarde sans se raconter d'histoires." },

  {t:'part', eyebrow:'Partie 3', h1:'À quoi ressemble une entreprise florissante',
    sub:"Ce qui change quand le système se régénère lui-même." },

  {t:'body', eyebrow:'Le résultat', h2:'Une entreprise qui pousse avec vous',
    items:["Elle régénère ses ressources au lieu de les brûler","Elle grandit sans dépendre de votre seule énergie","Elle reste alignée avec le monde que vous voulez voir"] },

  {t:'cred', eyebrow:'Pourquoi moi', h2:'Katell Bosser',
    p:"Entrepreneuse depuis 2008, fondatrice de l'Association Suisse des Mampreneurs, et autrice de Blooming People et Blooming Companies.",
    p2:"Permacultrice d'entreprises florissantes : j'accompagne les fondateurs à faire fleurir leur activité selon les principes du vivant." },

  {t:'step', eyebrow:'Première étape', h2:'Découvrez votre talent naturel',
    p:"Le point de départ est gratuit : un test pour identifier le talent sur lequel bâtir vos fondations.",
    p2:"C'est la graine. Le reste de l'accompagnement fait pousser à partir de là." },

  {t:'cta', eyebrow:'La suite', h1:'Faisons fleurir votre entreprise',
    sub:"Découvrez votre talent naturel, puis rejoignons-nous dans l'accompagnement pour construire votre système régénératif.",
    brand:'Blooming Companies',
    disc:"Contenu fourni à titre éducatif. Les résultats varient selon chaque entreprise ; aucune garantie de revenu ou de résultat n'est donnée. / This masterclass is educational and is not a guarantee of income or results; outcomes vary." }
];

const stage = document.getElementById('stage');
let i = 0;
function esc(x){ return (x||''); }
function render(){
  stage.innerHTML = '';
  S.forEach((s, idx) => {
    const d = document.createElement('div');
    d.className = 'slide' + (idx===i?' on':'') + (s.t==='part'?' part':'') + ((s.t==='cta')?' cta':'') + ((s.t==='promise'||s.t==='reframe')?' center':'');
    let h = '';
    if (s.eyebrow) h += '<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
    if (s.h1) h += '<h1>'+esc(s.h1)+'</h1>';
    if (s.big) h += '<div class="big">'+esc(s.big)+'</div>';
    if (s.num) h += '<div class="num">'+esc(s.num)+'</div>';
    if (s.h2) h += '<h2>'+esc(s.h2)+'</h2>';
    if (s.sub) h += '<div class="sub">'+esc(s.sub)+'</div>';
    if (s.p) h += '<p>'+esc(s.p)+'</p>';
    if (s.p2) h += '<p>'+esc(s.p2)+'</p>';
    if (s.items){ h += '<ul>'; s.items.forEach(it=> h += '<li>'+esc(it)+'</li>'); h += '</ul>'; }
    if (s.t==='title' || s.t==='cta') h += '<div class="accent-rule"></div>';
    if (s.brand) h += '<div class="brandline">'+esc(s.brand)+'</div>';
    if (s.disc) h += '<div class="disc">'+esc(s.disc)+'</div>';
    h += '<div class="cue">'+(idx+1)+' / '+S.length+'</div>';
    d.innerHTML = h;
    stage.appendChild(d);
  });
}
function go(n){ i = Math.max(0, Math.min(S.length-1, n)); render(); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') go(i+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp') go(i-1);
});
stage.addEventListener('click', ()=> go(i+1));
render();
</script>
</body>
</html>
