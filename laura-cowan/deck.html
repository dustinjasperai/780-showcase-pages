<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Two-Hour Practice Masterclass &middot; Laura Cowan, 2-Hour Lifestyle Lawyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f2ece4; --panel:#e4dace; --rule:#cdbfaf;
    --ink:#222739; --accent:#3b489b; --blush:#ff85bc;
    --soft:#4d5266; --dim:#8a8496;
  }
  html,body{height:100%}
  body{background:#d8cec2;font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#d8cec2}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Lora',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.18;letter-spacing:-.004em}
  .t-title h1{font-size:4.3vw;max-width:90%}
  .t-normal h1{font-size:3vw;max-width:84%}
  .t-normal .body{font-size:1.46vw;color:var(--soft);margin-top:2.6vh;max-width:74%;line-height:1.58;font-weight:400}
  .sub{font-size:1.72vw;color:var(--soft);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-size:1.24vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.2vw;max-width:88%}
  .t-section .rule{width:18vw;height:3px;background:linear-gradient(90deg,var(--blush),rgba(255,133,188,0));margin-top:3.6vh}
  .t-quiet{background:var(--ink);align-items:center;text-align:center}
  .t-quiet h1{font-size:3.3vw;max-width:88%;font-style:italic;color:#f6f1ea;font-weight:500}
  .t-quiet .body{color:#bdb9c8;text-align:center;max-width:70%;margin-left:auto;margin-right:auto}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:2.6vw;text-align:center;margin-bottom:4.4vh}
  .flowrow{display:flex;gap:1.1vw;justify-content:center;flex-wrap:wrap}
  .flowcard{background:var(--panel);border:1px solid var(--rule);border-radius:.5vw;padding:2.4vh 1.3vw;width:19vw;min-height:15vh;display:flex;flex-direction:column;gap:1.1vh}
  .flowcard .n{font-family:'Lora',Georgia,serif;font-size:2.2vw;font-weight:700;color:var(--accent);line-height:1}
  .flowcard .l{font-size:1.06vw;font-weight:600;color:var(--ink);line-height:1.3}
  .flowcard .d{font-size:.94vw;font-weight:400;color:var(--soft);line-height:1.45}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--accent);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.16vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.6vh;font-size:.88vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .t-quiet .disc{color:#9c96a8}
  .hours-motif{position:absolute;pointer-events:none}
  .title-hours{right:7.4%;bottom:11%;width:19vw}
  .corner-hours{right:6.4%;bottom:8.4%;width:9vw;opacity:.55}
  .brandline{font-size:1.24vw;color:var(--soft);margin-top:3.6vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(34,39,57,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#6f6a7d;z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6f6a7d;z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#6f6a7d;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.4vw}.t-quiet h1{font-size:5.4vw}.t-flow h1{font-size:4.6vw}
    .flowcard{width:27vw}.flowcard .n{font-size:4.2vw}.flowcard .l{font-size:2.2vw}.flowcard .d{font-size:1.9vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">2-Hour Lifestyle Lawyer</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="hours" viewBox="0 0 300 80">
  <g>
    <rect x="4" y="30" width="292" height="20" rx="4" fill="none" stroke="#3b489b" stroke-width="2" opacity="0.35"/>
    <rect x="28" y="30" width="40" height="20" rx="3" fill="#ff85bc"/>
    <rect x="76" y="30" width="40" height="20" rx="3" fill="#ff85bc"/>
    <line x1="28" y1="62" x2="116" y2="62" stroke="#3b489b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Two-Hour Practice Masterclass',sub:'How an estate planning attorney builds an all-virtual practice that runs on about two focused hours a day, and why the delivery model matters more than the marketing.',brand:true,motif:'title'},

 {t:'normal',k:'Who this is for',title:'Estate planning attorneys who are busy and still not free.',body:'You draft the plans, you take the calls, you chase the signings, and you fund the trusts. The work is meaningful and the calendar owns you anyway. This is for the attorney who wants the practice smaller on purpose, not bigger.'},
 {t:'normal',k:'What you will walk away with',title:'A model for the practice, not another marketing tip.',body:'The three jobs inside every solo practice, which of them you should never be doing personally, and the order to fix them in. One sitting.'},
 {t:'normal',k:'An honest note',title:'This is education, not a promise.',body:'Every practice, state, and market is different, and results depend entirely on what you build and how you run it. Take the model and test it against your own numbers.',disc:'Educational content. Nothing here is a guarantee of income, revenue, or any business result. Results vary.'},
 {t:'normal',k:'Who is teaching this',title:'Laura Cowan. Attorney, CPA, and the founder of 2-Hour Lifestyle Lawyer.',body:'She runs an all-virtual estate planning practice from New York and has built the training that more than 600 attorneys across 35 states now use to run theirs the same way.'},

 {t:'section',idx:'Part One',title:'Why the Traditional Practice Eats the Week'},
 {t:'normal',k:'The daily version',title:'You are not running one job. You are running three.',body:'Finding the next client, converting the one in front of you, and producing the legal work are three different jobs with three different rhythms. Most solos do all three personally, in the same day, interrupted.'},
 {t:'normal',k:'What most attorneys try first',title:'More marketing, longer hours, one more hire.',body:'Each of those adds activity to a week that is already full. None of them changes the shape of the week, because the shape is set by how the work gets delivered, not by how much of it arrives.'},
 {t:'quiet',title:'A full calendar is not a full practice. It is an undelegated one.'},
 {t:'normal',k:'The real constraint',title:'The bottleneck is the attorney, and it always has been.',body:'Every plan waits on the same person. Until the delivery model changes, more leads simply make the queue longer.'},

 {t:'section',idx:'Part Two',title:'The ACE Method'},
 {t:'flow',k:'Three jobs, three systems',title:'Attract. Close. Execute.',items:[
   {n:'A',l:'Attract',d:'Fill the top of the practice on a schedule instead of by referral luck.'},
   {n:'C',l:'Close',d:'Turn a conversation into an engagement with a repeatable process.'},
   {n:'E',l:'Execute',d:'Produce the legal work without it landing on your desk by default.'}]},
 {t:'normal',k:'A is for Attract',title:'The Workshop Marketing Engine.',body:'Educational workshops are the front door. Teaching a room of the right people is the most natural client acquisition an estate planning attorney has, and it can run on a calendar instead of on hope.'},
 {t:'normal',k:'C is for Close',title:'The Peace of Mind Planning Session.',body:'A named, structured consultation replaces the open-ended free meeting. The client gets clarity and a decision in one sitting, and you get a process that produces the same outcome every time.'},
 {t:'normal',k:'E is for Execute',title:'Drafting and document review leave your desk.',body:'This is the letter most attorneys refuse to give up, and it is the one that decides the size of your week. Trained support and done-for-you templates carry the production so the attorney carries the judgment.'},
 {t:'quiet',title:'You do not need more hours. You need fewer of the three jobs.'},

 {t:'section',idx:'Part Three',title:'Inside the Two-Hour Day'},
 {t:'normal',k:'The shape of it',title:'Virtual by design, so the practice fits the life instead of the office lease.',body:'Clients meet you on video, documents move electronically, and the practice is not tied to a room. That is what makes two focused hours a day a real structure rather than a slogan.'},
 {t:'normal',k:'What the two hours are for',title:'Judgment, relationships, and decisions. Nothing else.',body:'The attorney hours go to the client conversation and the legal judgment. Everything that is production work belongs somewhere else, which is exactly why the day can be short and still be serious.',disc:'The two-hour figure describes the model taught in this class. It is not a promise about any individual practice.'},
 {t:'normal',k:'Why this is worth the effort',title:'A smaller practice, built deliberately, is more durable than a bigger one built by accident.',body:'Fewer moving parts, clearer economics, and a delivery model you could hand to someone else. The point is not to work less for its own sake. The point is that the practice stops depending on your endurance.'},
 {t:'normal',k:'Who is already doing it',title:'600 attorneys, 35 states, and a community that answers the technical questions.',body:'The people running this model are not alone with it. Drafting coaches who practice estate planning, implementation help on the systems, and 130 members inside the Collective working on it at the same time.'},
 {t:'quiet',title:'The practice you want is a delivery model, not a bigger to-do list.'},

 {t:'normal',k:'Your next step',title:'Take one letter of ACE and fix it this quarter.',body:'Most attorneys find Execute is the one holding the week hostage. Start there, and Attract stops feeling impossible, because there is finally room for the clients it brings.'},
 {t:'cta',title:'Build the practice around the life.',chips:['Book a call with Laura'],disc:'Educational content only. No income, revenue, or business result is guaranteed. Results vary by practice, market, and execution.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="hours-motif ${kind==='title'?'title-hours':'corner-hours'}" viewBox="0 0 300 80"><use href="#hours"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div><div class="d">${it.d}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Laura Cowan &middot; <b>2-Hour Lifestyle Lawyer</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
