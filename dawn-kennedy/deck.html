<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Whole Decision — Strategic Intelligence for Main Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f2ec;        /* warm paper, from her light brand (#e3dfd9 / #c9c1ae family) */
    --panel:#e9e5db;
    --rule:#c9c1ae;      /* her sand */
    --accent:#035e4d;    /* her deepest saturated brand green */
    --accent2:#9cb8ad;   /* her dominant sage / signature */
    --ink:#1f2a26;       /* near-black, green undertone */
    --muted:#55615b;
    --display:'Josefin Sans',sans-serif;
    --body:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d8d4ca;color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:60px 58px;margin:22px 0;min-height:500px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.04);position:relative}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.02;
    color:var(--ink);letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.08;
    color:var(--ink);margin-bottom:18px;letter-spacing:-.01em}
  .sub{font-size:23px;line-height:1.45;color:var(--muted);margin-top:22px;max-width:40ch}
  p{font-size:21px;line-height:1.5;color:var(--ink);margin-top:16px;max-width:52ch}
  .big{font-family:var(--display);font-weight:600;font-size:44px;line-height:1.12;
    color:var(--accent);max-width:22ch}
  .brand{font-family:var(--display);letter-spacing:.04em;font-size:16px;color:var(--muted);
    margin-top:40px}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:21px;line-height:1.5;margin:14px 0;padding-left:26px;position:relative;max-width:50ch}
  li:before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;
    background:var(--accent2);border-radius:2px}
  .dim{display:flex;align-items:baseline;gap:18px}
  .dim .n{font-family:var(--display);font-weight:700;font-size:72px;color:var(--accent2);line-height:1}
  .dark{background:var(--accent);border-color:var(--accent)}
  .dark h1,.dark h2,.dark p,.dark .big{color:#f4f2ec}
  .dark .eyebrow{color:var(--accent2)}
  .dark .sub{color:#cfe0d9}
  .disc{font-size:14px;color:var(--muted);margin-top:30px;max-width:54ch;font-style:italic}
  .cta{font-family:var(--display);font-weight:600;font-size:20px;color:var(--accent);
    border:2px solid var(--accent);border-radius:8px;padding:14px 26px;display:inline-block;margin-top:26px}
  .num{position:absolute;right:20px;bottom:14px;font-family:var(--display);font-size:12px;color:var(--rule)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', c:`<div class="eyebrow">Strategic Intelligence for Main Street</div>
   <h1>The Whole Decision</h1>
   <div class="sub">How Main Street owners stop guessing on the choices that can make or break the business.</div>
   <div class="brand">A live masterclass with Dawn K. Kennedy</div>`},
 {t:'who', c:`<div class="eyebrow">Who this is for</div>
   <h2>You are the one who has to decide.</h2>
   <p>You run a real business. The call to grow, hire, borrow, take on a partner, or walk away lands on your desk, and the business lives with whatever you choose.</p>
   <p>This hour is for the owner who wants to make those calls with something sturdier than a spreadsheet and a gut feeling.</p>`},
 {t:'trap', c:`<div class="eyebrow">The trap</div>
   <h2>We were handed the wrong tools.</h2>
   <p>Owners are told to navigate with spreadsheets and instinct. So when the stakes are real, we do the honest thing: we guess, carefully, and hope.</p>
   <p>The spreadsheet tells you what happened. Instinct tells you what you want. Neither one shows you the decision you are actually making.</p>`},
 {t:'reframe', dark:true, c:`<div class="eyebrow">The reframe</div>
   <div class="big">The visible question is rarely the whole decision.</div>
   <p>"Should we expand?" is never really about the new location. It is about capacity, timing, cash, and what you are quietly assuming is still true.</p>`},
 {t:'p1head', c:`<div class="eyebrow">Part one</div><h1>The real problem</h1>
   <div class="sub">Why the surface question keeps leading good owners into bad outcomes.</div>`},
 {t:'surface', c:`<h2>The surface question hides three things.</h2>
   <ul>
     <li><b>Capacity.</b> What the business can actually carry right now, not on paper.</li>
     <li><b>Assumptions.</b> The things you believe are still true and have not checked.</li>
     <li><b>Timing.</b> Whether this is the decision for today or a decision for later.</li>
   </ul>
   <p>Answer the visible yes or no and you can still be wrong on all three.</p>`},
 {t:'cost', c:`<div class="eyebrow">What it costs</div>
   <h2>A guess that looks like a plan.</h2>
   <p>The expansion that outruns the cash. The hire the business could not sustain. The partnership nobody pressure-tested. None of them failed at the decision point. They failed at the part of the decision nobody looked at.</p>`},
 {t:'p2head', dark:true, c:`<div class="eyebrow">Part two</div><h1>Strategic Intelligence</h1>
   <div class="sub">A decision-making discipline for seeing the whole decision before your business has to carry it. Four dimensions, every time.</div>`},
 {t:'d1', c:`<div class="dim"><div class="n">1</div><div><h2>Ground truth</h2>
   <p>The financial, operational, and market reality as it actually is. Not the story, not the hope. The numbers and conditions you can stand on.</p></div></div>`},
 {t:'d2', c:`<div class="dim"><div class="n">2</div><div><h2>Context</h2>
   <p>The conditions, dependencies, constraints, and perspectives around the choice. What else moves when this one moves.</p></div></div>`},
 {t:'d3', c:`<div class="dim"><div class="n">3</div><div><h2>Foresight</h2>
   <p>Anticipating the changes, vulnerabilities, and future needs this decision creates. Seeing around the corner before you turn it.</p></div></div>`},
 {t:'d4', c:`<div class="dim"><div class="n">4</div><div><h2>Judgment</h2>
   <p>The capacity to narrow the decision, weigh the tradeoffs, and choose deliberately. The other three dimensions earn you the right to this one.</p></div></div>`},
 {t:'clarity', c:`<div class="eyebrow">The method in motion</div>
   <h2>CLARITY: one decision, worked end to end.</h2>
   <p>The four dimensions are not a checklist you admire. CLARITY walks a single consequential decision all the way through them, so you leave with a choice you can defend and a reason behind it.</p>`},
 {t:'capacity', c:`<div class="eyebrow">Before you commit</div>
   <h2>Capacity before commitment.</h2>
   <p>Most owners decide what they want, then hope the business can carry it. The Capacity Planner flips the order: it asks what the business can sustain first, so the decision fits the business you actually have.</p>`},
 {t:'who_convo', c:`<div class="eyebrow">From the field manual</div>
   <h2>Who belongs in the conversation.</h2>
   <p>Half of a bad decision is the wrong people in the room, or the right people left out. Before you decide, you name the real decision, when it has to be made, and who actually belongs in the conversation.</p>`},
 {t:'p3head', c:`<div class="eyebrow">Part three</div><h1>One real call, run four ways</h1>
   <div class="sub">The same expansion question, walked through all four dimensions.</div>`},
 {t:'worked', c:`<h2>"Should we open a second location?"</h2>
   <ul>
     <li><b>Ground truth:</b> the first location clears a real margin, not a busy one.</li>
     <li><b>Context:</b> the lease, the staffing pipeline, the owner's own hours.</li>
     <li><b>Foresight:</b> what breaks at double the volume, and when.</li>
     <li><b>Judgment:</b> expand now, stage it, or fix the first location first.</li>
   </ul>
   <p>Same question. A decision you can actually stand behind.</p>`},
 {t:'whyme', c:`<div class="eyebrow">Why this, from me</div>
   <h2>I decide inside a living business too.</h2>
   <p>I am an attorney and a business owner. I co-founded and run Convoy Road Coffee Roasters, where every one of these decisions has to hold up beyond the meeting and the spreadsheet. Strategic Intelligence is the discipline I built because the plan was never enough on its own.</p>`},
 {t:'recap', c:`<div class="eyebrow">The whole decision</div>
   <h2>Four dimensions, every consequential call.</h2>
   <ul>
     <li>Ground truth, what is real.</li>
     <li>Context, what is at stake around it.</li>
     <li>Foresight, what is coming.</li>
     <li>Judgment, choose deliberately.</li>
   </ul>
   <p>Move from guessing to knowing.</p>`},
 {t:'cta', c:`<div class="eyebrow">Your next step</div>
   <h2>See where your own decisions stand.</h2>
   <p>Start with the Strategic Intelligence Assessment to find your gaps, then bring a real decision to a Strategic Intelligence Brief and leave with a 90-day roadmap you can act on.</p>
   <span class="cta">Take the Strategic Intelligence Assessment</span>
   <div class="disc">Educational content only. No result is guaranteed. Results vary by business, market, and effort, and no income or outcome is promised.</div>
   <div class="brand">Strategic Intelligence for Main Street. Dawn K. Kennedy.</div>`}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.dark?' dark':'');
  d.innerHTML=(s.c||'')+'<div class="num">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(d);
});
</script>
</body>
</html>
