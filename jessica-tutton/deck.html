<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Scalable Sales System for Course Creators | Jessica Tutton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Neuton:wght@400;700;800&family=Josefin+Sans:wght@400;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf2f7;        /* her soft-pink ground (brand.json #fdf2f7) */
    --panel:#ffffff;
    --rule:#fbdae7;      /* her light pink */
    --ink:#143751;       /* her navy H1 color (brand.json #143751) */
    --muted:#5b6b7a;
    --accent:#de4391;    /* her signature button pink (brand.json #de4391) */
    --gold:#f8a02c;      /* her gold (brand.json #f8a02c) */
    --display:'Neuton',Georgia,serif;
    --label:'Josefin Sans',sans-serif;
    --body:'Raleway',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9c9d8;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:64px 64px;margin:0 0 26px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent)}
  .eyebrow{font-family:var(--label);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.04;color:var(--ink);margin-bottom:18px}
  h2{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.08;color:var(--ink);margin-bottom:16px}
  .promise{font-family:var(--display);font-size:26px;color:var(--accent);font-weight:700}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:62ch}
  .muted{color:var(--muted)}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.4;padding:14px 0 14px 40px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:22px;width:16px;height:16px;border-radius:50%;
    background:var(--accent)}
  li b{font-family:var(--label);font-weight:700}
  .big{font-family:var(--display);font-size:40px;line-height:1.12;font-weight:700}
  .big .hl{color:var(--accent)}
  .part{font-family:var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;font-size:16px;margin-bottom:10px}
  .num{font-family:var(--label);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.1em;margin-bottom:8px}
  .cta h1{color:var(--accent)}
  .disclaimer{margin-top:28px;font-size:13px;color:var(--muted);max-width:68ch;line-height:1.5}
  .kicker{font-family:var(--label);font-weight:600;color:var(--ink);font-size:18px;margin-top:8px}
  .footer-brand{font-family:var(--label);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted);margin-top:34px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Jessica Tutton',
    h1:'The Scalable Sales System for Course Creators',
    promise:'Sell your course every day, even when you’re offline.' },

  {t:'who', eyebrow:'Who this is for',
    h2:'For course creators stuck on the launch rollercoaster',
    lead:'One good month, one quiet one. A launch here, an email campaign there, a few sales trickling in from Instagram. You are not short on effort. You are short on a system.' },

  {t:'reframe', eyebrow:'The real problem',
    big:['It is not your course. It is not your content. ','What is missing is a ','system',' that brings in leads and turns them into buyers on repeat.'] },

  {t:'part', part:'Part One', h2:'The launch rollercoaster' },

  {t:'bullets', eyebrow:'Why the good month never repeats',
    h2:'Three traps that keep course sales inconsistent',
    items:[
      ['Launch-or-nothing','Revenue is bet on a few big launches a year, so the quiet months feel like free-fall.'],
      ['Scattered selling','A campaign here, a promo there, nothing connected, nothing you can rely on.'],
      ['Glued to the feed','Sales depend on you showing up to post, so the business stops the moment you do.'] ] },

  {t:'bullets', eyebrow:'What it costs you',
    h2:'Revenue you pray for instead of plan for',
    items:[
      ['Starting from zero','Every month begins with no pipeline and no predictability.'],
      ['Burnout','The content treadmill never stops, because it is the only thing driving sales.'],
      ['No room to scale','You cannot grow what you cannot repeat.'] ] },

  {t:'part', part:'Part Two', h2:'The Scalable Sales System' },

  {t:'system', eyebrow:'The system',
    h2:'Four revenue-generating funnels, working together',
    lead:'Not one funnel and not one launch. Four funnels that cover list-building, launching, evergreen sales and daily cash, all fed by consistent advertising so new leads arrive every week.' },

  {t:'funnel', num:'Funnel 01', h2:'Dream Lead Funnel',
    lead:'Turn strangers into subscribers with a lead magnet and a low-ticket upsell, so your list grows every single day instead of only on launch week.' },

  {t:'funnel', num:'Funnel 02', h2:'Launch Like a Boss Funnel',
    lead:'Run your live launches on proven sales sequences and fill them with fresh leads, so a launch becomes a repeatable play instead of a once-a-year gamble.' },

  {t:'funnel', num:'Funnel 03', h2:'Evergreen Dream Funnel',
    lead:'An always-selling funnel that converts cold traffic continuously, so your course keeps selling in the weeks and months between launches.' },

  {t:'funnel', num:'Funnel 04', h2:'Profit First Funnel',
    lead:'A low-ticket funnel that generates daily sales and validates new offers, so you always know what your audience will actually buy.' },

  {t:'fuel', eyebrow:'What powers all four',
    h2:'All About Ads: the fuel for every funnel',
    lead:'Smart advertising feeds every funnel with fresh, qualified leads on a budget you control, so the system is never waiting on the algorithm or on your next post.' },

  {t:'part', part:'Part Three', h2:'Inside a business that sells on repeat' },

  {t:'bullets', eyebrow:'Day to day',
    h2:'Sales become something you can plan for',
    items:[
      ['Leads every week','New, qualified people enter your world on repeat, not just during a launch.'],
      ['Launch and evergreen together','You stop choosing between the two and let them compound.'],
      ['Off the content treadmill','The system sells while you are making lunch, not making Reels.'] ] },

  {t:'whyme', eyebrow:'Why learn this from me',
    h2:'I have run this hundreds of times',
    lead:'I spent years running a done-for-you marketing agency before building this system for myself. Over the past 7+ years I have helped hundreds of course creators sell their offers with smart, simple advertising and scalable funnels, launching five- and six-figure programs and building lead-gen systems that keep working while they do the school run.' },

  {t:'recap', eyebrow:'The whole idea in one line',
    big:['Stop launching harder. ','Build a ','system',' that sells your course every day.'] },

  {t:'cta', eyebrow:'Your next step',
    h1:'Build it with me inside Course Sales Academy',
    kicker:'A 12-month mentorship where we build all four funnels together: strategy calls, group coaching, funnel and ad reviews, and the full course library.',
    disclaimer:'This masterclass is educational. It shares the strategies and systems I use with course creators. It is not a guarantee of income or results. Your outcomes depend on your offer, your effort, and many factors outside any program’s control.' }
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bigHtml(parts){
  return parts.map(p => p==='system'||p==='result' ? '<span class="hl">'+esc(p)+'</span>' : esc(p)).join('');
}
const deck = document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.part) h+='<div class="part">'+esc(s.part)+'</div>';
  if(s.num) h+='<div class="num">'+esc(s.num)+'</div>';
  if(s.h1) h+='<h1>'+esc(s.h1)+'</h1>';
  if(s.h2) h+='<h2>'+esc(s.h2)+'</h2>';
  if(s.promise) h+='<div class="promise">'+esc(s.promise)+'</div>';
  if(s.big) h+='<div class="big">'+bigHtml(s.big)+'</div>';
  if(s.lead) h+='<p class="lead">'+esc(s.lead)+'</p>';
  if(s.kicker) h+='<p class="kicker">'+esc(s.kicker)+'</p>';
  if(s.items){ h+='<ul>'; s.items.forEach(it=>{ h+='<li><b>'+esc(it[0])+'.</b> '+esc(it[1])+'</li>'; }); h+='</ul>'; }
  if(s.disclaimer) h+='<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
  if(s.t==='title'||s.t==='cta') h+='<div class="footer-brand">Jessica Tutton &middot; Course Sales Academy</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
