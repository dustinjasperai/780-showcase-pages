<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Full Caseload to Group Practice CEO — Eva Haldis, MS RD LDN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Pontano+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf4f7;
    --panel:#fff8fc;
    --accent:#aa5a9e;
    --deep:#6f3566;
    --spark:#0cc0df;
    --ink:#2b2130;
    --muted:#6d6472;
    --rule:#ecd9ea;
    --head:'Poppins',system-ui,sans-serif;
    --body:'Pontano Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .slide{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:7vh 6vw;border-bottom:1px solid var(--rule)}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:22px;max-width:960px;width:100%;padding:clamp(28px,5vw,64px);box-shadow:0 24px 60px -40px rgba(111,53,102,.45)}
  .kick{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(30px,5.4vw,58px);line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(25px,4vw,42px);line-height:1.1;margin-bottom:16px}
  .sub{font-size:clamp(17px,2.1vw,22px);color:var(--muted);max-width:44ch}
  .big{font-family:var(--head);font-weight:600;font-size:clamp(24px,3.6vw,40px);line-height:1.18;letter-spacing:-.01em}
  .big .hl{color:var(--accent)}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  li{position:relative;padding-left:30px;font-size:clamp(16px,2vw,20px)}
  li::before{content:"";position:absolute;left:0;top:.55em;width:12px;height:12px;border-radius:4px;background:var(--accent)}
  li.spark::before{background:var(--spark)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:26px}
  .tile{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:16px}
  .tile .d{font-family:var(--head);font-weight:600;color:var(--deep);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
  .tile .v{margin-top:6px;font-size:16px;color:var(--ink)}
  .tile.on{background:var(--accent);border-color:var(--accent)}
  .tile.on .d,.tile.on .v{color:#fff}
  .name{margin-top:26px;font-family:var(--head);font-weight:600;font-size:18px;color:var(--deep)}
  .name span{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:15px;margin-top:4px}
  .num{font-family:var(--head);font-weight:700;font-size:clamp(40px,7vw,80px);color:var(--accent);line-height:1}
  .note{margin-top:22px;font-size:14px;color:var(--muted);max-width:54ch}
  .cta-row{margin-top:26px;display:inline-flex;align-items:center;gap:12px;background:var(--accent);color:#fff;font-family:var(--head);font-weight:600;padding:16px 26px;border-radius:999px;font-size:18px}
  .pager{position:fixed;right:16px;bottom:14px;font-family:var(--head);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:6px 12px}
  @media(max-width:600px){.slide{padding:5vh 5vw}}
</style>
</head>
<body>
<main id="deck"></main>
<div class="pager" id="pager"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Eva Haldis, MS RD LDN', h:'From Full Caseload to Group Practice CEO', sub:'How solo dietitians build a team that runs the practice with them, without working more hours.', name:'Eva Haldis, MS RD LDN', role:'Founder of Reclaim Nutrition and host of The RDtoCEO Podcast'},
  {t:'whofor', k:'Who this is for', h:'The dietitian who is fully booked and still stuck', body:['You run a 1:1 private practice and your calendar is full','You want to grow, but there are no more hours to sell','You have thought about hiring, but the math and the fear both stop you']},
  {t:'trap', k:'The trap', h:'Your income is capped by your own two hands', sub:'When every dollar needs you in the room, a full calendar is not freedom. It is the ceiling.'},
  {t:'reframe', k:'The reframe', big:'More clients will not fix a model that only pays when <span class="hl">you</span> are in the room.'},
  {t:'part', k:'Part one', h:'The solo ceiling'},
  {t:'ceiling', k:'Why adding hours stops working', h:'Three limits every solo practice hits', body:['Time: there is a hard cap on billable hours in a week','Energy: the last session of the day is never your best','Risk: if you get sick, the whole practice stops']},
  {t:'goal', k:'The real goal', big:'Build capacity that is <span class="hl">not you</span>, so the practice can grow while you step back.'},
  {t:'part', k:'Part two', h:'The RDtoCEO system'},
  {t:'pillar', k:'Pillar one', h:'Practice-readiness analysis', sub:'Before you add a hire or a service line, you audit the practice on three axes: financial, operational, and strategic. You grow from diagnosis, not from a hunch.'},
  {t:'pillar', k:'Pillar two', h:'Run it off a dashboard', sub:'A group practice is steered by numbers, not vibes. Inquiry tracking, a team KPI dashboard, and a monthly data review tell you what to do next.', body:['Inquiry and intake tracker','Team KPI dashboard','Monthly data review ritual']},
  {t:'pillar', k:'Pillar three', h:'The first hire, done right', sub:'The step most dietitians stall on. You learn when to hire, how payroll and credentialing work for a group, and the compensation model that keeps the math working.', body:['When the numbers say you are ready','Insurance credentialing for a group','A compensation model that pays and profits']},
  {t:'pillar', k:'Pillar four', h:'Lead like a CEO', sub:'A team that feels led stays. You build the mentoring, retention, and referral engine so the practice grows without you chasing every lead.'},
  {t:'recap', k:'How it fits', h:'Diagnose, systematize, hire, lead', body:['Readiness analysis shows you what to build','The dashboard keeps it honest','The first hire adds capacity','CEO leadership keeps the team and the referrals coming']},
  {t:'part', k:'Part three', h:'What it actually looks like'},
  {t:'week', k:'A group-practice week', h:'A calendar that does not need you in every room', tiles:[{d:'Mon',v:'2 client blocks',on:true},{d:'Tue',v:'Team review',on:false},{d:'Wed',v:'Content and referrals',on:false},{d:'Thu',v:'2 client blocks',on:true},{d:'Fri',v:'Off by 3pm',on:false}]},
  {t:'metrics', k:'The numbers you watch', h:'A handful of KPIs, reviewed every month', body:['New inquiries and where they came from','Show rate and conversion on discovery calls','Caseload and capacity across the team','Revenue per clinician and owner profit']},
  {t:'whyme', k:'Why me', h:'I built this inside my own practice', sub:'I grew Reclaim Nutrition from a solo caseload into a multi-clinician group practice over five years, while raising my kids. The systems in this masterclass are the ones I actually use, and I hand you the templates.', name:'Eva Haldis, MS RD LDN', role:'Reclaim Nutrition and The RDtoCEO Podcast'},
  {t:'mistakes', k:'Avoid these', h:'The mistakes that stall a first hire', body:['Hiring before the inquiry volume supports it','No compensation model, so the hire costs you money','Delegating clients without delegating decisions']},
  {t:'first', k:'Start here', h:'Your first move this month', big:'Run the readiness check. Know your true inquiry volume and owner profit <span class="hl">before</span> you hire.'},
  {t:'summary', k:'The path', h:'Solo clinician to practice CEO', body:['See the ceiling for what it is','Build the four-pillar system','Make the first hire on the numbers','Lead a team that grows without you']},
  {t:'cta', k:'Work with me', h:'Build your group practice with RDtoCEO', sub:'If you are ready to grow past the solo ceiling, book a discovery call and we will map your readiness and your first hire together.', cta:'Book a discovery call at rdtoceo.com', note:'This masterclass is educational. No specific result or income is guaranteed, and results vary by practice, market, and effort.'}
];

const deck = document.getElementById('deck');
S.forEach(s => {
  const sec = document.createElement('section');
  sec.className = 'slide';
  const card = document.createElement('div');
  card.className = 'card';
  let html = '';
  if (s.k) html += `<div class="kick">${s.k}</div>`;
  if (s.h) html += `<h${s.t==='title'?1:2}>${s.h}</h${s.t==='title'?1:2}>`;
  if (s.big) html += `<p class="big">${s.big}</p>`;
  if (s.sub) html += `<p class="sub">${s.sub}</p>`;
  if (s.body) html += '<ul>' + s.body.map((b,i)=>`<li class="${i%2?'spark':''}">${b}</li>`).join('') + '</ul>';
  if (s.tiles) html += '<div class="tiles">' + s.tiles.map(t=>`<div class="tile ${t.on?'on':''}"><div class="d">${t.d}</div><div class="v">${t.v}</div></div>`).join('') + '</div>';
  if (s.name) html += `<div class="name">${s.name}<span>${s.role||''}</span></div>`;
  if (s.cta) html += `<div class="cta-row">${s.cta}</div>`;
  if (s.note) html += `<p class="note">${s.note}</p>`;
  card.innerHTML = html;
  sec.appendChild(card);
  deck.appendChild(sec);
});
const pager = document.getElementById('pager');
const sections = [...document.querySelectorAll('.slide')];
const setPager = () => {
  let i = sections.findIndex(sec => sec.getBoundingClientRect().top > window.innerHeight*0.4);
  if (i === -1) i = sections.length;
  pager.textContent = Math.min(Math.max(i,1), sections.length) + ' / ' + sections.length;
};
window.addEventListener('scroll', setPager, {passive:true});
setPager();
</script>
</body>
</html>
