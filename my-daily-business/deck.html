<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Business You Love — a live masterclass with Fiona Killackey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9efe2;
    --panel:#fff9f0;
    --ink:#284a9a;
    --accent:#e74f36;
    --rule:#284a9a;
    --muted:#5c6b86;
    --head:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:960px}
  .slide.on{display:block;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .k{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,6vw,68px);line-height:1.02;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(26px,4.4vw,46px);line-height:1.08;letter-spacing:-.01em}
  p.s{font-size:clamp(17px,2.2vw,23px);line-height:1.5;color:var(--muted);margin-top:22px;max-width:40ch}
  .big{font-family:var(--head);font-weight:700;font-size:clamp(30px,5.2vw,58px);line-height:1.06;letter-spacing:-.01em}
  .big em{font-style:normal;color:var(--accent)}
  ul{list-style:none;margin-top:30px}
  li{font-size:clamp(17px,2.3vw,25px);line-height:1.35;padding:16px 0;border-top:1px solid rgba(40,74,154,.16);display:flex;gap:16px;align-items:baseline}
  li:last-child{border-bottom:1px solid rgba(40,74,154,.16)}
  li .n{font-family:var(--head);font-weight:700;color:var(--accent);font-size:19px;min-width:1.4em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:34px}
  .card{background:var(--panel);border:1px solid rgba(40,74,154,.14);border-radius:14px;padding:22px}
  .card .t{font-family:var(--head);font-weight:600;color:var(--accent);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
  .card .d{margin-top:10px;font-size:16px;color:var(--ink);line-height:1.35}
  .why{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
  .why span{background:var(--panel);border:1px solid rgba(40,74,154,.16);border-radius:999px;padding:10px 18px;font-size:15px}
  .cta h2{font-size:clamp(30px,5vw,56px)}
  .cta .btn{display:inline-block;margin-top:30px;background:var(--ink);color:var(--bg);font-family:var(--head);font-weight:600;font-size:19px;padding:17px 34px;border-radius:12px;text-decoration:none}
  .disc{margin-top:34px;font-size:13px;color:var(--muted);max-width:56ch;line-height:1.5}
  footer{position:fixed;left:7vw;bottom:4vh;font-family:var(--head);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .count{position:fixed;right:7vw;bottom:4vh;font-family:var(--head);font-size:12px;color:var(--muted)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-bottom:28px}
</style>
</head>
<body>
<div id="stage"></div>
<footer>My Daily Business &middot; Fiona Killackey</footer>
<div class="count" id="count"></div>
<script>
const S=[
 {t:'title', k:'A live masterclass with Fiona Killackey', h:'Build a Business You Love', s:'How creative owners grow sustainable profit without scaling the stress.'},
 {t:'promise', k:'What you will leave with', big:'A plan to grow your revenue <em>on purpose</em>, not by working more hours.'},
 {t:'who', k:'Who this is for', h:'Makers, retailers, designers and consultants', s:'Capable, driven owners who are quietly second-guessing every decision, and who want sustainability, not growth for growth\'s sake.'},
 {t:'trap', k:'The trap', big:'You started your business for freedom. Now you work every night and still feel behind.'},
 {t:'reframe', k:'The reframe', big:'More hustle is not the answer. For most creative owners, more hustle <em>is</em> the problem.'},
 {t:'part', k:'Part one', h:'Why growth keeps costing you more', s:'Every new product, platform and promotion adds work. Revenue climbs, but so does the load, until the business owns you.'},
 {t:'content', k:'The busywork spiral', h:'Busy is not the same as profitable', s:'Most owners add. They rarely subtract. The calendar fills with activity that never actually moves the money.'},
 {t:'content', k:'The real cost', big:'Chasing <em>growth for growth\'s sake</em> is how a business you loved becomes a job you resent.'},
 {t:'framework', k:'Part two', h:'Passion. Purpose. Profit.', s:'My method for starting and scaling a business without scaling the stress. Three moves, in order.'},
 {t:'passion', k:'Passion', h:'Start from your Why', s:'Name the real reason you built this. Your Why is the filter every future decision runs through, and it is the first thing owners lose under pressure.'},
 {t:'purpose', k:'Purpose', h:'Get honest about where you are', s:'Before you add anything, see clearly what is working, what is not, and what you are tolerating out of habit.'},
 {t:'audit', k:'The audit', h:'Stop / Keep / Start', items:['Stop the busywork that never pays','Keep the quiet few things that already work','Start the one move that compounds'], note:'You run this on a regular cadence. It is how you grow by subtraction.'},
 {t:'profit', k:'Profit', h:'Map the money, then set the goals', s:'Decide what the business needs to pay you and sustain you first. Then build goals and a marketing plan backwards from that number.'},
 {t:'five', k:'The operating system', h:'Five areas, one sustainable business', cards:[['Marketing','Be known for one clear thing'],['Money','Know your numbers, price for profit'],['Systems','Let the business run without you nightly'],['Content','Create once, use many times'],['Business models','Earn in more than one calm way']]},
 {t:'look', k:'Part three', h:'What a sustainable week looks like', s:'Fewer decisions, clearer priorities, and a rhythm you can keep for years, not a sprint you recover from.'},
 {t:'whyme', k:'Why me', h:'Fiona Killackey', s:'Founder of My Daily Business since 2015. 22+ years across Amazon, Country Road Group and hundreds of small creative brands. Author of Passion. Purpose. Profit. and Business to Brand. Host of one of Australia\'s most listened-to small business podcasts.', chips:['Since 2015','Two books','600+ podcast episodes','Melbourne']},
 {t:'recap', k:'The three moves', h:'Passion, then Purpose, then Profit', items:['Lead every decision with your Why','Grow by subtraction with Stop / Keep / Start','Build the plan backwards from the number that sustains you']},
 {t:'next', k:'Your next step', big:'Pick one thing to <em>stop</em> this week. Then join us inside to do the other two together.'},
 {t:'cta', k:'Come and do the work', h:'Join Sidestep the Hustle', s:'Group coaching for creative owners who want a business they love and the financial security they need.', btn:'Start at mydailybusiness.com', disc:'This masterclass is educational. No specific outcome, revenue or result is guaranteed. Results vary based on your business, market, effort and circumstances.'}
];
const stage=document.getElementById('stage');
const count=document.getElementById('count');
function esc(x){return x==null?'':x}
function render(){
 stage.innerHTML='';
 S.forEach((o,i)=>{
  const d=document.createElement('div');d.className='slide'+(i===0?' on':'');d.dataset.i=i;
  let h='';
  h+='<div class="dot"></div>';
  if(o.k)h+='<div class="k">'+esc(o.k)+'</div>';
  if(o.big)h+='<div class="big">'+o.big+'</div>';
  if(o.h && o.t!=='cta')h+='<h2>'+esc(o.h)+'</h2>';
  if(o.t==='cta')h+='<div class="cta"><h2>'+esc(o.h)+'</h2></div>';
  if(o.s)h+='<p class="s">'+esc(o.s)+'</p>';
  if(o.items){h+='<ul>';o.items.forEach((it,j)=>{h+='<li><span class="n">'+(j+1)+'</span><span>'+esc(it)+'</span></li>'});h+='</ul>'}
  if(o.note)h+='<p class="s">'+esc(o.note)+'</p>';
  if(o.cards){h+='<div class="grid">';o.cards.forEach(c=>{h+='<div class="card"><div class="t">'+esc(c[0])+'</div><div class="d">'+esc(c[1])+'</div></div>'});h+='</div>'}
  if(o.chips){h+='<div class="why">';o.chips.forEach(c=>{h+='<span>'+esc(c)+'</span>'});h+='</div>'}
  if(o.btn)h+='<a class="btn" href="https://www.mydailybusiness.com/groupcoaching">'+esc(o.btn)+'</a>';
  if(o.disc)h+='<div class="disc">'+esc(o.disc)+'</div>';
  d.innerHTML=h;stage.appendChild(d);
 });
 show(0);
}
let cur=0;
function show(i){
 const sl=document.querySelectorAll('.slide');
 if(i<0||i>=sl.length)return;
 sl[cur].classList.remove('on');sl[i].classList.add('on');cur=i;
 count.textContent=(i+1)+' / '+sl.length;
}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
 if(e.key==='ArrowLeft')show(cur-1);
});
document.addEventListener('click',e=>{if(!e.target.closest('a'))show(cur+1)});
render();
</script>
</body>
</html>
