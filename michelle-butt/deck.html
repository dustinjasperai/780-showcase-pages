<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 5 Faces in Every Room - a live masterclass with Michelle Butt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,600;0,700;1,400&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#faf4ee;   /* light tint of her sand #f1ded4 */
    --sand:#f1ded4;     /* her body background */
    --deep:#161e2a;     /* her dark navy heading colour */
    --ink:#393939;      /* her body ink */
    --accent:#3498db;   /* her button blue */
    --serif:'Petrona',Georgia,serif;
    --sans:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 64px}
  .slide{background:var(--ground);border:1px solid rgba(22,30,42,.12);border-radius:10px;
    padding:46px 48px;margin:0 0 20px;min-height:360px;display:flex;flex-direction:column;
    justify-content:center}
  .slide.sand{background:var(--sand);border-color:rgba(22,30,42,.14)}
  .slide.deep{background:var(--deep);color:#eef2f6;border-color:transparent}
  .k{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:16px}
  .slide.deep .k{color:#7fc1ee}
  h1{font-family:var(--serif);font-weight:700;color:var(--deep);font-size:46px;line-height:1.08;
    margin-bottom:14px}
  .slide.deep h1{color:#fff}
  h2{font-family:var(--serif);font-weight:700;color:var(--deep);font-size:32px;line-height:1.12;
    margin-bottom:14px}
  .slide.deep h2{color:#fff}
  .s{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink);opacity:.85;margin-bottom:10px}
  .slide.deep .s{color:#cfe0ee;opacity:.95}
  p.b{font-size:18px;max-width:62ch;margin-top:6px}
  ul{list-style:none;margin-top:10px}
  li{font-size:18px;padding:9px 0 9px 26px;position:relative;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:17px;width:10px;height:10px;border-radius:2px;
    background:var(--accent)}
  .note{margin-top:22px;font-family:var(--sans);font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent)}
  .disc{margin-top:26px;font-size:13px;color:#9fb0c2;max-width:60ch;line-height:1.5}
  .mark{color:var(--accent)}
  .foot{text-align:center;color:#9a8e84;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Facial Intelligence&trade; &middot; At Face Valu &middot; Michelle Butt</div>
<script>
const S=[
  {t:'title', c:'sand', k:'A live masterclass with Michelle Butt',
   h:'The 5 Faces in Every Room',
   s:'How to read anyone’s facial design and connect in seconds',
   note:'Facial Intelligence'},

  {t:'promise', k:'What this hour gives you', h:'You will walk out able to:',
   items:['Spot the five facial archetypes in any room, on any call',
          'Know what someone needs from you before they say it',
          'Change how you speak so the right people actually hear you',
          'Read your own face, and stop fighting your natural wiring']},

  {t:'who', c:'sand', k:'Who this is for', h:'Anyone who has to read people fast',
   items:['Coaches and consultants who want to understand a client in minutes',
          'Sales and networking professionals who live or die on connection',
          'Leaders reading a team they cannot afford to misjudge',
          'Partners and parents who keep missing the person right in front of them']},

  {t:'trap', k:'The trap', h:'You were taught to read what people DO',
   b:'Their words. Their tone. Their body language. The little tells. So you watch, you guess, and you adjust on the fly. It is exhausting, and half the time you still read them wrong.'},

  {t:'reframe', c:'deep', k:'The reframe', h:'Behaviour changes by the minute. The face does not.',
   b:'The person in front of you can fake a smile, mirror your energy, or have a bad day. But the face they were born with, its structure and design, has been telling you who they are the whole time. You were just never taught to read it.'},

  {t:'part', c:'deep', k:'Part One', h:'Why behaviour keeps misleading you'},

  {t:'content', k:'Reading in the moment', h:'Behaviour is a snapshot, not the person',
   b:'When you read tone and body language, you are reading how someone feels in this one moment. Tired, guarded, excited. None of it tells you how they are actually built, so you keep mistaking a mood for a person.'},

  {t:'content', c:'sand', k:'The quiet mistake', h:'You project, then you are surprised',
   b:'With nothing solid to read, you fill the gap with yourself. You assume they think like you, want what you want, hear things the way you do. Then they do not, and the connection quietly breaks.'},

  {t:'content', k:'The cost', h:'What a misread actually costs',
   b:'The client who never booked because you pitched them the way you would want to be pitched. The teammate you keep clashing with. The teenager who shuts the door. Every one of them was readable from the start.'},

  {t:'part', c:'deep', k:'Part Two', h:'The Five Facial Archetypes',
   s:'Built on Five Elements theory and your own facial design'},

  {t:'archetype', k:'Archetype one', h:'The Wood face',
   b:'Driven, sharp, a natural love of learning and a push to grow. Give them the plan and the progress. Wood wants direction, not small talk.'},

  {t:'archetype', c:'sand', k:'Archetype two', h:'The Fire face',
   b:'Warm, expressive, lit up by people and possibility. Give them energy and recognition. Fire connects through enthusiasm, and fades when you flatten the room.'},

  {t:'archetype', k:'Archetype three', h:'The Earth face',
   b:'Steady, loyal, built for trust and belonging. Give them reassurance and time. Earth commits slowly and deeply, and will not be rushed into a yes.'},

  {t:'archetype', c:'sand', k:'Archetype four', h:'The Metal face',
   b:'Precise, principled, quietly exacting. Give them clarity, quality, and a clean standard. Metal respects what is well made and distrusts hype.'},

  {t:'archetype', k:'Archetype five', h:'The Water face',
   b:'Deep, reflective, perceptive beneath the surface. Give them space and meaning. Water opens up when it feels safe, and reads you long before you read it.'},

  {t:'content', c:'sand', k:'Your facial design', h:'Your face is a blueprint, not an accident',
   b:'Every feature, down to the shape of a nose, maps to how you see the world and who you were designed to be. Once a client sees it, their self-image can shift in a single sentence. That is the heart of Facial Intelligence.'},

  {t:'part', c:'deep', k:'Part Three', h:'Reading the room in real time'},

  {t:'content', k:'Masterful Connecting', h:'Match your words to the face',
   b:'Once you can name the archetype in front of you, you stop guessing. You lead a Wood with the plan, a Fire with the vision, an Earth with trust, a Metal with the standard, a Water with the meaning. Same you, five different doors in.'},

  {t:'whyme', c:'sand', k:'Why learn this from me', h:'Michelle Butt',
   b:'Honours linguistics, a Master Coach practice, and two years studying Chinese Face Reading and Five Elements theory with a mentor. I spent over a decade turning all of it into one readable system: the Facial Intelligence body of work.'},

  {t:'cta', c:'deep', k:'Your next step', h:'Come learn your five faces',
   b:'If you want to read the people who matter most, and finally read yourself, book a complimentary connection call and we will map your next step inside the Facial Intelligence Academy.',
   disc:'This masterclass is educational. Facial Intelligence is a communication and self-understanding tool, not a diagnosis or a guarantee of any outcome. Individual results vary.'}
];

const deck=document.getElementById('deck');
for(const x of S){
  const el=document.createElement('section');
  el.className='slide'+(x.c?(' '+x.c):'');
  let html='';
  if(x.k) html+='<div class="k">'+x.k+'</div>';
  if(x.t==='title'){ html+='<h1>'+x.h+'</h1>'; if(x.s) html+='<div class="s">'+x.s+'</div>'; if(x.note) html+='<div class="note">'+x.note+'</div>'; }
  else { html+='<h2>'+x.h+'</h2>'; if(x.s) html+='<div class="s">'+x.s+'</div>'; }
  if(x.b) html+='<p class="b">'+x.b+'</p>';
  if(x.items){ html+='<ul>'; for(const it of x.items){ html+='<li>'+it+'</li>'; } html+='</ul>'; }
  if(x.disc) html+='<div class="disc">'+x.disc+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
}
</script>
</body>
</html>
