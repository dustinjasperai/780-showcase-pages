<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confident Humility — a masterclass for new managers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e7eff8; --panel:#f9fcff; --rule:#cdddee;
    --ink:#1f2d36; --muted:#5a6b78; --accent:#2b7bb9;
    --head:'Urbanist',system-ui,sans-serif; --body:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55}
  #deck{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(31,45,54,.04)}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:60px;line-height:1.02;letter-spacing:-.02em}
  h2{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.08;letter-spacing:-.01em}
  .sub{font-size:22px;color:var(--muted);margin-top:20px;max-width:30em}
  .body{font-size:21px;margin-top:20px;max-width:34em}
  .big{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.18;max-width:24em}
  ul{margin:26px 0 0;padding:0;list-style:none;max-width:40em}
  li{position:relative;font-size:20px;padding:12px 0 12px 34px;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:21px;width:10px;height:10px;
    border-radius:50%;background:var(--accent)}
  .num{font-family:var(--head);font-weight:800;color:var(--accent);font-size:15px;
    margin-right:10px}
  .part{font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent)}
  .title-slide{background:linear-gradient(180deg,#f9fcff 0%,#dbe8f6 100%)}
  .accent-slide{background:var(--accent);color:#fff;border-color:var(--accent)}
  .accent-slide .kicker,.accent-slide .part{color:#cfe4f4}
  .accent-slide .sub,.accent-slide .muted{color:#dceaf5}
  .foot{font-family:var(--head);font-size:14px;color:var(--muted);margin-top:30px;
    letter-spacing:.04em}
  .cta-steps{font-size:21px;margin-top:18px}
  .cta-steps b{font-family:var(--head)}
  .disc{font-size:14px;color:var(--muted);margin-top:30px;max-width:40em;line-height:1.5}
  .lead{font-size:24px;color:var(--muted)}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);opacity:.55}
  @media(max-width:680px){.slide{padding:34px 24px;min-height:auto}h1{font-size:40px}h2{font-size:30px}}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', cls:'title-slide', kicker:'A live masterclass for new &amp; aspiring managers',
    h:'Confident Humility',
    sub:'How to lead in your first year without faking it.'},

  {t:'who', kicker:'Who this is for',
    h:'You were the best at the work. Now you manage the people who do it.',
    body:'This hour is for brand new and soon-to-be managers. The ones who got promoted for being great individual contributors, and were never actually taught how to lead.'},

  {t:'trap', kicker:'The trap',
    big:'The promotion was supposed to feel like a win. Most weeks it feels like impostor syndrome with a full calendar.',
    body:'You are still trying to be the best at the old job while quietly panicking about the new one. Nobody handed you a manual.'},

  {t:'hook', cls:'accent-slide', kicker:'The reframe',
    h:'The job is not a harder version of your old job. It is a different job.',
    sub:'The work that got you promoted is the work you now have to let go of. That is the whole shift, and almost no one says it out loud.'},

  {t:'part', part:'Part One', h:'Why the first year feels impossible'},

  {t:'problem', kicker:'Problem one',
    h:'You think the interruptions are keeping you from the job.',
    big:'The interruptions ARE the job.',
    body:'The questions, the one-on-ones, the unblocking, the feedback. That is not the thing getting in the way of your work. That is your work now.'},

  {t:'problem', kicker:'Problem two',
    h:'You are waiting to feel ready.',
    body:'You will not feel ready. You will decide at seventy-five to eighty percent certainty, act, and adjust. Managers who wait for one hundred percent never move, and their teams stall with them.'},

  {t:'part', part:'Part Two', h:'Confident Humility'},

  {t:'framework', kicker:'The core idea',
    h:'Confidence generates followers. Humility generates disciples.',
    body:'Confidence gets people to do what you say. Humility gets people to think the way you think, so they make good calls when you are not in the room. You need both.'},

  {t:'framework', kicker:'Confident Humility, defined',
    big:'The modesty to know whether you are even the right person to make a decision. Paired with the confidence to make it and own it.',
    body:'That tension is the skill. Hold your answers loosely. Decide firmly.'},

  {t:'part', part:'Part Two', h:'The seven shifts of your first year'},

  {t:'list', kicker:'What actually changes',
    h:'Seven things nobody tells you when you become a manager',
    items:[
      "The job is different from the one you were promoted out of",
      "The distractions are the job, not a detour from it",
      "The feedback you give decides whether the team succeeds",
      "You are not an impostor, you are early",
      "You do not have to know everything",
      "You have to relinquish control and delegate the work",
      "Decide at seventy-five to eighty percent, not one hundred"
    ]},

  {t:'point', kicker:'The skill that scares people most',
    h:'Candid, not cruel.',
    body:'Most new managers are kind and vague, or honest and harsh. The job is to be both candid and kind in the same conversation. Clear is kind. Vague feedback is the unkind option, it just feels nicer in the moment.'},

  {t:'point', kicker:'Where it actually happens',
    h:'The one-on-one is the unit of management.',
    body:'Not the all-hands, not the strategy deck. The recurring one-on-one, run well, with better questions and real listening, is where trust and performance are built. Most people run it as a status update and waste it.'},

  {t:'point', kicker:'Two very different problems',
    h:'Manage high and low performers differently.',
    body:'High performers need direction and room to grow, not management by nagging. Low performers need clarity and a real plan, not avoidance. Treating them the same way loses both.'},

  {t:'point', kicker:'The communication trap',
    h:'The Curse of Knowledge.',
    body:'The better you knew the old job, the worse you are at explaining it to the people now doing it. You skip steps that feel obvious to you and invisible to them. Great managers translate their expertise instead of assuming it transfers.'},

  {t:'part', part:'Part Three', h:'The manager people actually follow'},

  {t:'point', kicker:'The picture',
    h:'A team that runs on your thinking, not your presence.',
    body:'People make good calls without you. Feedback flows both directions. You stop being the bottleneck and start being the multiplier. That is a manager people follow, not one they endure.'},

  {t:'why', kicker:'Why learn this from me',
    h:'I read the whole canon so you do not have to.',
    body:'I read more than seventy management and leadership books a year and have published over one hundred book summaries at Leader &amp; Learner. My job is to compress all of it into the few shifts that actually matter in your first year, and to coach you through them in real time.'},

  {t:'cta', cls:'accent-slide', kicker:'Your next step',
    h:'Become a great manager in your first year, on purpose.',
    steps:'The New Manager Bootcamp is eight weeks of live virtual training plus one-on-one coaching, built on everything in this hour. If you want to stop guessing and start leading, come join the next cohort.',
    disc:'Educational content only. No income, role, promotion, or result is guaranteed. Results vary and depend on your own effort, context, and circumstances.'}
];

const deck = document.getElementById('deck');
S.forEach(s=>{
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let h = '';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.part)   h += '<div class="part">'+s.part+'</div>';
  if(s.h && (s.t==='part')) h += '<h2 style="margin-top:14px">'+s.h+'</h2>';
  else if(s.t==='title') h += '<h1>'+s.h+'</h1>';
  else if(s.h) h += '<h2>'+s.h+'</h2>';
  if(s.big)  h += '<p class="big" style="margin-top:22px">'+s.big+'</p>';
  if(s.sub)  h += '<p class="sub">'+s.sub+'</p>';
  if(s.body) h += '<p class="body">'+s.body+'</p>';
  if(s.items){
    h += '<ul>';
    s.items.forEach((it,i)=>{ h += '<li><span class="num">'+(i+1)+'</span>'+it+'</li>'; });
    h += '</ul>';
  }
  if(s.steps) h += '<p class="cta-steps">'+s.steps+'</p>';
  if(s.foot)  h += '<div class="foot">'+s.foot+'</div>';
  if(s.disc)  h += '<p class="disc">'+s.disc+'</p>';
  sec.innerHTML = h;
  deck.appendChild(sec);
});
</script>
</body>
</html>
