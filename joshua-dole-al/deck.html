<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Memoir That Earns Its Reader — Joshua Doležal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f9fc; --panel:#e6eef7; --rule:#053870; --ink:#053870; --accent:#347cc8;
    --muted:#4a6079; --paper:#ffffff;
    --serif:Georgia,'Times New Roman',serif; --sans:'Cabin',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#dde6f0;color:var(--ink);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px}
  .slide{position:relative;background:var(--bg);border:1px solid #cdd9e8;border-radius:10px;
    padding:60px 64px;margin:22px 0;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden;box-shadow:0 1px 0 #cdd9e8}
  /* manuscript-margin motif */
  .slide:before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1px;background:#c3d2e4}
  .slide:after{content:"";position:absolute;left:38px;top:0;bottom:0;width:1px;background:#e2b9b9;opacity:.55}
  .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:20px}
  h1{font-family:var(--serif);font-size:48px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-size:34px;line-height:1.15;font-weight:700;margin-bottom:16px}
  .sub{font-size:20px;color:var(--muted);margin-top:18px;max-width:40ch}
  p.body{font-size:19px;color:#223b56;margin-top:14px;max-width:52ch}
  .lead{font-family:var(--serif);font-size:26px;color:var(--ink);max-width:46ch;line-height:1.3}
  .accent{color:var(--accent)}
  .strike{text-decoration:line-through;text-decoration-color:#d08a8a;color:var(--muted)}
  ul{margin:20px 0 0 2px;list-style:none}
  li{font-size:19px;color:#223b56;padding:9px 0 9px 26px;position:relative;max-width:50ch}
  li:before{content:"";position:absolute;left:0;top:17px;width:11px;height:2px;background:var(--accent)}
  .part{font-family:var(--serif);font-size:15px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--accent);font-weight:700}
  .big{font-family:var(--serif);font-size:72px;font-weight:700;color:var(--accent);line-height:1}
  .panel{background:var(--panel);border-radius:8px;padding:22px 26px;margin-top:20px;max-width:54ch}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:58ch;line-height:1.45}
  .pg{position:absolute;right:26px;bottom:18px;font-size:12px;color:#98acc4;letter-spacing:.08em}
  .cta-line{font-family:var(--serif);font-size:24px;color:var(--ink);margin-top:10px}
  .btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-weight:600;
    font-size:17px;padding:13px 26px;border-radius:6px;text-decoration:none}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A masterclass with Joshua Doležal · Big Sky Insights',
   h:'The Memoir That Earns Its Reader',
   sub:'How to turn a true story into literature a stranger cannot put down.'},

  {t:'promise', kick:'What you will leave with',
   h:'Three things, by the end of this hour',
   list:['A way to see whether your draft has a spine, or only a pile of true scenes',
         'The exact tools I use to map a book before a word is wasted',
         'A clear sense of what separates a finished draft from a publishable one']},

  {t:'who', kick:'Who this is for',
   h:'You have the story. You are stuck anyway.',
   body:'You are a memoirist or narrative-nonfiction writer, often well into a draft. You have lived the material. And yet the pages feel flat, and no writing group has been able to tell you why.'},

  {t:'trap', kick:'The trap',
   lead:'"Finished" and "publishable" are two different books.',
   body:'Most writers aim for finished: the last chapter written, the word count hit. But an editor does not buy finished. An editor buys a story that holds a reader. That gap is where almost every manuscript stalls.'},

  {t:'reframe', kick:'The real reason drafts stall',
   lead:'A flat draft is almost never a writing problem.',
   body:'It is a structure problem wearing a writing problem as a disguise. When the scenes do not know what is at stake, no amount of beautiful sentences will save them. Fix the structure and the prose has something to carry.'},

  {t:'part', part:'Part One', h:'The core problem: structure before sentences'},

  {t:'point', kick:'What a flat draft signals',
   h:'The scenes do not agree on what the book is about',
   body:'When every chapter is doing its own thing, the reader feels it as drift. The fix is not more words. It is deciding, on purpose, what this book is really about and letting every scene answer to that.'},

  {t:'part', part:'Part Two', h:'The book-mapping method: map it before you write it'},

  {t:'tool', kick:'Tool one',
   h:'The Focus Sentence',
   body:'One sentence that names what the book is about and what is at stake in it. Once you have it, it becomes the test every scene has to pass. Scenes that fail it are cut, and the draft gets lighter and truer at the same time.'},

  {t:'tool', kick:'Tool two',
   h:'The XY Formula',
   body:'A way to hold the outer story (what happens) and the inner story (what it costs the narrator) in the same frame, so the events on the page are always carrying meaning underneath them.'},

  {t:'tool', kick:'Tool three',
   h:'The Freytag Pyramid',
   body:'The old architecture of rising action, turn, and consequence, applied to a true story. It is how you turn a timeline of real events into an arc a reader leans into instead of a list they skim.'},

  {t:'point', kick:'What this gives you',
   h:'A map, before you waste a year',
   body:'With the story core and arc defined, you stop drafting into the dark. You know which scenes earn their place, where the book turns, and what you are building toward. The writing gets faster because it finally knows where it is going.'},

  {t:'part', part:'Part Two, continued', h:'The craft that lifts the prose'},

  {t:'tool', kick:'Craft tool',
   h:'Defamiliarization',
   body:'Making the reader see an ordinary thing as if for the first time. It is how a kitchen, a diagnosis, or a drive home stops being generic and becomes unmistakably yours.'},

  {t:'tool', kick:'Craft tool',
   h:'Extended metaphor',
   body:'A single image, carried through the book, that lets a reader feel the thing you cannot say outright. Used well, it does more work than a chapter of explaining.'},

  {t:'tool', kick:'Craft tool',
   h:'Lyric',
   body:'The music of the sentence: rhythm, compression, the line that lands. This is the layer most self-publishing advice skips entirely, and it is often the difference between competent and memorable.'},

  {t:'philosophy', kick:'The standard I hold',
   lead:'Write for one discerning reader, not a committee.',
   body:'My mentor, the poet Ted Kooser, taught me to write toward one reader whose judgment I trust, and never toward everyone at once. It is the quiet discipline behind work that gets into journals accepting under one percent of what they see.'},

  {t:'part', part:'Part Three', h:'What working together looks like'},

  {t:'loop', kick:'The coaching loop',
   h:'Map, then feedback, then revision, until it holds',
   list:['We map the book together and find the Focus Sentence',
         'You draft; I read the whole manuscript and send an editorial letter',
         'We revise toward the arc, then do it again until the book is ready to go out']},

  {t:'why', kick:'Why me',
   h:'A reader who has been where you are going',
   body:'A memoir with the University of Iowa Press, two books, essays in the Kenyon Review, the Missouri Review, and The Chronicle of Higher Education, and twenty years teaching memoir and narrative medicine. I coach one writer at a time because a workshop cannot read your whole book. I can.'},

  {t:'cta', kick:'Your next step',
   h:'Let us find out what your book is really about',
   ctaline:'Book a free consultation and bring the chapter you are most stuck on.',
   btn:'Book a free consultation',
   disc:'This masterclass is educational. No income, sale, publication, or specific result is guaranteed; outcomes vary with the writer, the manuscript, and the work put in.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const sl = el('div','slide');
  if(s.part){
    sl.appendChild(el('div','part',s.part));
    sl.appendChild(el('h2',null,s.h));
  } else {
    if(s.kick) sl.appendChild(el('div','kick',s.kick));
    if(s.t==='title'){ sl.appendChild(el('h1',null,s.h)); if(s.sub) sl.appendChild(el('div','sub',s.sub)); }
    else if(s.lead){ sl.appendChild(el('div','lead',s.lead)); }
    else if(s.h){ sl.appendChild(el('h2',null,s.h)); }
    if(s.body) sl.appendChild(el('p','body',s.body));
    if(s.list){ const ul=el('ul'); s.list.forEach(x=>ul.appendChild(el('li',null,x))); sl.appendChild(ul); }
    if(s.ctaline) sl.appendChild(el('div','cta-line',s.ctaline));
    if(s.btn) sl.appendChild(el('a','btn',s.btn));
    if(s.disc) sl.appendChild(el('div','disc',s.disc));
  }
  sl.appendChild(el('div','pg',(i+1)+' / '+S.length));
  deck.appendChild(sl);
});
</script>
</body>
</html>
