<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>See It Like a Judge — a masterclass with Tin Man Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080a0c; --panel:#23272f; --rule:#3a3f4d; --accent:#e0a43e;
    --ink:#efece7; --muted:#818898; --head:'Playfair Display',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#050607;color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:64px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;font-weight:600}
  h1{font-family:var(--head);font-weight:700;font-size:48px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;margin-bottom:14px}
  p.lead{font-size:20px;color:var(--ink);max-width:62ch;margin-top:16px}
  p.body{font-size:18px;color:#d7d3cc;max-width:64ch;margin-top:14px}
  .rule{height:2px;width:72px;background:var(--accent);margin:22px 0}
  ul{list-style:none;margin-top:18px}
  ul li{font-size:18px;color:#d7d3cc;padding:10px 0 10px 28px;position:relative;border-bottom:1px solid rgba(58,63,77,.5);max-width:64ch}
  ul li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  ul li b{color:var(--ink);font-weight:600}
  .big{font-family:var(--head);font-size:40px;line-height:1.12;color:var(--ink);max-width:22ch}
  .accent{color:var(--accent)}
  .quote{font-family:var(--head);font-style:italic;font-size:30px;line-height:1.3;color:var(--ink);max-width:28ch}
  .cta-box{border:1px solid var(--accent);border-radius:12px;padding:30px 32px;margin-top:26px;background:rgba(224,164,62,.06)}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .credit{font-size:15px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Tin Man Lee', h:'See It Like a Judge',
   lead:'The seven things that separate an award-winning wildlife image from a merely nice photo, from a photographer who scores 200,000 of them a year.'},

  {t:'who', kick:'Who this is for', h:'You already get the shot.',
   body:'You have the patience, the long lens, and the keeper folder full of sharp, well-exposed wildlife. You have entered the competitions. And still the images that place belong to someone else. This hour is for the serious photographer who is ready to stop guessing why.'},

  {t:'trap', kick:'The trap', h:'You were told it is about the moment.',
   body:'Get closer. Faster glass. Better light. Wait for the behavior. All true, all necessary, and none of it is what a jury actually rewards. The photographers stuck at "good" are usually doing everything right and still missing the one thing that decides it.'},

  {t:'reframe', kick:'The reframe', big:'For years I chased the perfect sighting and the perfect technique. I had the order <span class="accent">completely reversed</span>.'},

  {t:'reframe2', kick:'The reframe', h:'An image is read, not just taken.',
   body:'I spent a career in biomedical imaging before wildlife, studying how the eye and brain process a picture. The award is not won in the field. It is won in how the finished frame is DESIGNED for the way a human being actually sees. That is the inversion this masterclass is built on.'},

  {t:'part', kick:'Part one', h:'Why strong subjects still lose'},

  {t:'list', kick:'Part one', h:'The three quiet killers',
   list:['<b>No single place for the eye to land.</b> A great subject in a frame that does not direct attention reads as busy, not powerful.',
         '<b>Design left to luck.</b> Tension that happened to appear, instead of tension built on purpose.',
         '<b>Shot for the photographer, not the viewer.</b> You know how hard it was to get. The jury only sees the result.']},

  {t:'part', kick:'Part two', h:'The judge’s scorecard'},

  {t:'list', kick:'Part two', h:'The 7-Point Photo Scorecard',
   body:'The seven criteria I run every competition image through, turned into a tool you can run on your own strongest photo.',
   list:['It is the same lens applied to 200,000+ images a year.',
         'It tells you in seconds what a jury sees before it sees anything else.',
         'It turns "I think this one is strong" into a repeatable self-diagnosis.']},

  {t:'list', kick:'Part two', h:'Tension, stacked on purpose',
   body:'Beyond the scorecard sits the construction system: the 12 steps of tension stacking.',
   list:['Build visual tension deliberately instead of hoping a moment delivers it.',
         'Each step is a decision you control, in the field and at the edit.',
         'Stacked together, they are the difference between a lucky frame and a designed one.']},

  {t:'list', kick:'Part two', h:'Designing for how the brain sees',
   body:'The layer underneath both tools, drawn from neuroscience, perception, and art history.',
   list:['Where attention lands first, and how to decide that on purpose.',
         'How the eye travels a frame, and how to lead it.',
         'Why some images feel inevitable and others feel merely correct.']},

  {t:'part', kick:'Part three', h:'What it looks like in your work'},

  {t:'list', kick:'Part three', h:'From keeper folder to a portfolio that places',
   list:['Run your single best image through the scorecard, live.',
         'See the one design change that would have moved it up.',
         'Leave with a method you apply to the next shoot, not a pile of settings.']},

  {t:'why', kick:'Why listen to me', h:'The judge’s chair',
   list:['Smithsonian grand prize (Windland Smith Rice International Awards); image shown at the entrance of the Smithsonian National Museum of Natural History.',
         'Chair of Judges, Nature Photographer of the Year; judge for Bird Photographer of the Year, Nature’s Best Photography Asia, NANPA Showcase and more.',
         'More than 500 national and international awards won by my students.']},

  {t:'quote', kick:'The idea in one line', q:'Run your strongest image through the seven points I score on when I judge, and you will see what the jury saw.'},

  {t:'recap', kick:'Recap', h:'The hour, in three moves',
   list:['See why strong subjects still lose: design, not effort.',
         'Learn the scorecard and the stacking steps you can run yourself.',
         'Apply them to your own image before you leave.']},

  {t:'cta', kick:'Your next step', h:'Come see your work through a judge’s eyes.',
   body:'If this is the way you want to grow, the mentorship is where we do it on your own images, in a small group, with the attention on your photographs.',
   ctatitle:'Apply for the mentorship', ctabody:'A small group, by application, reviewed personally. Everything about how it works, and how to be considered, is on one page.',
   credit:'Tin Man Lee · tinmanlee.com',
   disc:'Educational masterclass only. No income, placement, award, or result is guaranteed; outcomes vary with each photographer’s own practice and effort. Examples reflect past results and are not a promise of future performance.'}
];

function esc(x){return x||''}
function slide(s,i){
  const n = '<div class="num">'+(i+1)+' / '+S.length+'</div>';
  const kick = s.kick ? '<div class="kick">'+esc(s.kick)+'</div>' : '';
  let inner = '';
  if(s.t==='title'){ inner = '<h1>'+esc(s.h)+'</h1><div class="rule"></div><p class="lead">'+esc(s.lead)+'</p>'; }
  else if(s.t==='reframe'){ inner = '<div class="big">'+esc(s.big)+'</div>'; }
  else if(s.t==='part'){ inner = '<h1>'+esc(s.h)+'</h1><div class="rule"></div>'; }
  else if(s.t==='quote'){ inner = '<div class="quote">“'+esc(s.q)+'”</div>'; }
  else if(s.t==='cta'){
    inner = '<h2>'+esc(s.h)+'</h2><p class="body">'+esc(s.body)+'</p>'+
      '<div class="cta-box"><h2 style="font-size:24px;margin-bottom:8px">'+esc(s.ctatitle)+'</h2><p class="body" style="margin-top:4px">'+esc(s.ctabody)+'</p></div>'+
      '<div class="credit">'+esc(s.credit)+'</div><div class="disc">'+esc(s.disc)+'</div>';
  } else {
    if(s.h) inner += '<h2>'+esc(s.h)+'</h2>';
    if(s.big) inner += '<div class="big">'+esc(s.big)+'</div>';
    if(s.body) inner += '<p class="body">'+esc(s.body)+'</p>';
    if(s.list){ inner += '<ul>'; for(const li of s.list){ inner += '<li>'+li+'</li>'; } inner += '</ul>'; }
  }
  return '<section class="slide">'+n+kick+inner+'</section>';
}
document.getElementById('deck').innerHTML = S.map(slide).join('');
</script>
</body>
</html>
