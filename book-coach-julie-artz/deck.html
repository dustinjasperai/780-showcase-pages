<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Bring Your Story World to Life · Julie Artz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,500;0,600;0,700;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1c2838; --panel:#223047; --rule:#45505d;
    --acc:#fec35b; --ink:#f3f1e8; --body:#c3ccd8; --dim:#8793a3; --slate:#e9cf9a;
  }
  html,body{height:100%}
  body{background:#131c28;font-family:'Jost',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#131c28}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Jost',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Gelasio',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:.004em}
  .t-title h1{font-size:6.6vw;max-width:94%}
  .t-normal h1{font-size:4.0vw;max-width:90%}
  .t-normal .body{font-family:'Jost',sans-serif;font-size:1.32vw;color:var(--body);margin-top:3.0vh;max-width:75%;line-height:1.68;font-weight:400}
  .sub{font-family:'Gelasio',serif;font-style:italic;font-size:2.1vw;color:var(--slate);margin-top:3.4vh;max-width:84%;line-height:1.38;font-weight:600}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Jost',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.6vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#15202e 0%,#070c13 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.3vw;max-width:88%;color:#f6f1ea;font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#15202e 0%,#070c13 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.5vw;max-width:86%;color:#f6f1ea;font-weight:600}
  .t-cta .body{font-family:'Jost',sans-serif;color:#e7ded2;font-size:1.36vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:#f6f1ea;border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.0%;bottom:8.0%;width:18vw;opacity:.85}
  .corner-vf{right:6.5%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-family:'Jost',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:10.5vw}.t-normal h1{font-size:6.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.6vw}.t-section h1{font-size:8.4vw}.t-dark h1{font-size:6.8vw}
    .t-cta h1{font-size:7.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Story Scaffolding Method</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a constellation / map drawn in gold on navy, the scaffolding of a story world -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#fec35b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 92 L44 58 L74 74 L102 34" opacity="0.6"/>
    <circle cx="18" cy="92" r="4" fill="#fec35b" stroke="none" opacity="0.9"/>
    <circle cx="44" cy="58" r="4" fill="#fec35b" stroke="none" opacity="0.9"/>
    <circle cx="74" cy="74" r="4" fill="#fec35b" stroke="none" opacity="0.9"/>
    <circle cx="102" cy="34" r="6" fill="#fec35b" stroke="none" opacity="0.95"/>
    <path d="M44 58 L60 22" opacity="0.35"/>
    <circle cx="60" cy="22" r="3" fill="#fec35b" stroke="none" opacity="0.7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Bring Your Story World to Life',sub:'How fiction and memoir writers build a world readers fall into, without drowning in worldbuilding or leaning on tired tropes.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You can write a scene. The world around it still reads like set dressing.',body:'You are a serious writer. The sentences work, the characters have pulse, the pages add up. And still the world they move through feels thin, like a backdrop you painted rather than a place that was always there. You suspect readers can feel the difference, and you are right.'},
 {t:'dark',title:'A map and a glossary are not a world. Readers feel the difference on the first page.'},

 {t:'section',idx:'Part One',title:'Why Most Story Worlds Fall Flat'},
 {t:'normal',k:'The tired-trope trap',title:'A world built from genre defaults is a world the reader has already visited.',body:'When you reach for the usual pieces, the familiar taverns, the chosen one, the generic empire, you borrow worlds the reader has seen a hundred times. Nothing is wrong on the page, and nothing is alive either. Readers do not fall into a place that feels assembled from parts they already own.'},
 {t:'normal',k:'The info-dump reflex',title:'More research is not more world. Often it is the thing stalling the draft.',body:'The opposite failure is hoarding. You build lineages and maps and currencies and histories, and the story never starts because the world is never finished. A world is not a finished encyclopedia you deliver to the reader. It is pressure the reader feels, and most of what you research never needs to reach the page.'},
 {t:'dark',title:'The goal was never a complete world. It was a world that makes THIS story inevitable.'},

 {t:'section',idx:'Part Two',title:'Plan Now, Play Later: an Iterative Way to Build'},
 {t:'normal',k:'Start with the shift, not the map',title:'Build from the one way your world is not the reader’s world.',body:'Before any map, name the core shift: the one or two things that make this world different from the one the reader lives in. Everything else hangs off that lever. A world with a clear shift feels designed with intent. A world built outward from a map feels like a map, because that is what it is.'},
 {t:'normal',k:'Voice and power',title:'Who holds power, and how it is spoken, is most of what a reader feels.',body:'A world comes alive through voice and power dynamics far more than through geography. Who gives orders, who cannot, whose language is the default and whose is policed: these choices put the reader inside the world instead of in front of it. This is the texture that generic worldbuilding skips straight past.'},
 {t:'normal',k:'Culture, class and backstory',title:'Socio-economic pressure is where a world starts bending the plot.',body:'Culture, class, and the backstory of a place are not flavor. They are the forces that squeeze your characters into the decisions that drive the story. When the world applies real pressure, scenes stop being events that happen and start being events that could only happen here, to these people.'},
 {t:'normal',k:'World in service of story',title:'The world earns its place only when it bends plot, theme, and character.',body:'Every world detail has to pay rent. If it does not sharpen the plot, deepen the theme, or press on a character, it is set dressing, however clever. The discipline is not inventing more. It is testing each piece against the story and keeping only what makes the story truer.'},
 {t:'normal',k:'Iterate while you draft',title:'Plan enough to start. Refine the world as the draft teaches you what it needs.',body:'You do not have to choose between planning and discovery. Plan now, play later means building just enough world to begin, then letting the draft show you where the world needs to deepen and where it was never needed at all. The world and the story grow into each other instead of one waiting on the other.'},
 {t:'dark',title:'A world is not what you know about it. It is what the reader cannot stop feeling.'},

 {t:'section',idx:'Part Three',title:'When a World Starts Doing the Work'},
 {t:'normal',k:'The reader-ready world',title:'Scenes where the world does the emotional work for you.',body:'When the world is built this way, it stops being something you explain and starts being something the reader lives in. Tropes show up on purpose, subverted with intent rather than borrowed by habit. The place carries theme, raises stakes, and makes the ending land. That is a reader-ready world, and it is the difference between a manuscript that is competent and one an agent cannot put down.'},
 {t:'normal',k:'Why Julie Artz',title:'A speculative-fiction author and Founding Book Coach who builds worlds for a living.',body:'Julie is an Author Accelerator-certified Founding Book Coach and a published speculative-fiction author who has spent over a decade helping writers across the publishing spectrum, from Big Five to indie, get manuscripts reader-ready. Her Story Scaffolding Method, plan, draft, assess, revise, iterate, is the backbone behind everything in this session.'},

 {t:'section',idx:'Your Next Step',title:'Keep Building With Julie'},
 {t:'normal',k:'Work with Julie',title:'The masterclass is the overview. The mentorship is where your world gets built.',body:'This session shows you the approach. Inside the Story Matters Mentorship, the Story Scaffolding Method gets applied to your actual manuscript, with live coaching and a community of serious writers, from idea all the way to reader-ready. Start with the free Wyrd Words Weekly note each week, and join the mentorship when you are ready to go deeper.'},
 {t:'cta',title:'Ready to build a story world readers fall into?',body:'Take the next step with Julie Artz and the Story Scaffolding Method.',chips:['Join Wyrd Words Weekly','Explore the Story Matters Mentorship'],disc:'Educational content for fiction and memoir writers. No publishing outcome, agent offer, or sales result is guaranteed. Results vary by writer, manuscript, and market.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Story Scaffolding Method · <b>Julie Artz</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
