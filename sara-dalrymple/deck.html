<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The New Rules of Selling, Sara Dalrymple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffdfb;
    --panel:#f3efe8;
    --ink:#17120f;
    --muted:#6b635a;
    --rule:#d8cfc2;
    --accent:#0c5a47;
    --pop:#ce1620;
    --head:'Space Grotesk',system-ui,sans-serif;
    --mono:'Fragment Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--panel);color:var(--ink);font-family:var(--head);-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto}
  .slide{
    background:var(--bg);min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;border-bottom:1px solid var(--rule);position:relative;
  }
  .k{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-size:clamp(34px,6vw,64px);line-height:1.04;font-weight:700;letter-spacing:-.02em;max-width:17ch}
  h2{font-size:clamp(28px,4.4vw,46px);line-height:1.08;font-weight:600;letter-spacing:-.015em;max-width:18ch}
  .sub{font-size:clamp(17px,2.1vw,22px);color:var(--muted);margin-top:22px;max-width:40ch;line-height:1.5;font-weight:400}
  .lead{font-size:clamp(20px,2.6vw,27px);line-height:1.4;max-width:30ch;font-weight:500}
  .big{font-size:clamp(40px,7vw,78px);line-height:1.02;font-weight:700;letter-spacing:-.025em;max-width:15ch}
  .a{color:var(--accent)}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px}
  li{font-size:clamp(17px,2.1vw,21px);line-height:1.35;padding-left:30px;position:relative;max-width:34ch}
  li::before{content:"";position:absolute;left:0;top:.55em;width:12px;height:2px;background:var(--accent)}
  .num{font-family:var(--mono);color:var(--accent);font-size:15px;letter-spacing:.1em}
  .pill{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:7px 12px;border-radius:4px;margin-bottom:22px}
  .foot{position:absolute;left:8vw;bottom:5vh;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
  .disc{font-size:13px;color:var(--muted);margin-top:30px;max-width:46ch;line-height:1.5;font-family:var(--mono)}
  .cta-step{font-size:clamp(19px,2.3vw,24px);margin-top:18px;line-height:1.4;max-width:34ch}
  .prog{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:9;transition:width .2s}
  @media print{.slide{min-height:0;page-break-after:always}}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Sara Dalrymple',
   h:'The New Rules of Selling',
   s:'How women in business make consistent sales in a way that feels natural, not pushy.'},

  {t:'who', k:'Who this is for',
   h:'You are great at the work. The selling is the part nobody taught you.',
   s:'For women running service businesses who are done guessing and winging it with how they promote and sell.'},

  {t:'lead', k:'The story you were sold',
   lead:'You were told that if you just worked hard enough, the right people would notice.'},

  {t:'big', k:'The reframe',
   big:'Hard work <span class="strike">speaks for itself.</span> <span class="a">You do.</span>'},

  {t:'section', pill:'Part one', h:'The merit myth',
   s:'Women do not earn less because they are less capable. We earn less because nobody taught us the tools to ask for what we are worth.'},

  {t:'bullets', k:'What the myth costs you',
   h:'When selling is left to luck',
   items:['Feast or famine months that never feel stable','Quietly undercharging for work you know is good','Waiting to be noticed instead of being found','Selling that feels icky, so you avoid it']},

  {t:'section', pill:'Part two', h:'The 5 Core Principles',
   s:'Selling is a skill, not a personality. These are the repeatable behaviours behind consistent sales, the earning skills you can learn.'},

  {t:'principle', num:'01', h:'Connection',
   s:'Build real relationships with the people you are here to serve, long before the moment of the ask.'},
  {t:'principle', num:'02', h:'Consistency',
   s:'A repeatable sales week, so results stop depending on mood, luck, or a post going viral.'},
  {t:'principle', num:'03', h:'Confidence',
   s:'Promote and ask in your own voice, without the sleaze or the shoulds.'},
  {t:'principle', num:'04', h:'Client Experience',
   s:'An enquiry and onboarding that feels as good as the work itself, so clients say yes and stay.'},
  {t:'principle', num:'05', h:'Clarity',
   s:'Know exactly what you offer and to whom, so the right people self-select in.'},

  {t:'lead', k:'How it fits together',
   lead:'Five principles, one repeatable sales week. Consistent sales, grown without the grind.'},

  {t:'section', pill:'Part three', h:'A sales week that feels like you',
   s:'Not louder selling. Natural selling that you can run every week and actually enjoy.'},

  {t:'big', k:'The new rule',
   big:'Say goodbye to the sleaze and the <span class="a">shoulds.</span>'},

  {t:'who', k:'Why me',
   h:'Twenty years in sales, turned into a method women can use.',
   s:'Author of More Sales Please and writer of The Resourced Way. I teach the behaviours, not the hype.'},

  {t:'bullets', k:'The honest objection',
   h:'But I hate selling',
   items:['You do not hate selling. You hate the pushy version of it.','There is a natural way, and it is a handful of learnable behaviours.','You already have the work and the proof.','What is missing is a way to be found and to ask.']},

  {t:'cta', k:'Your next step',
   h:'Ready to make selling the easy part?',
   step:'If you want help putting the 5 Core Principles to work in your business, enquire about mentoring with Sara at saradalrymple.co.uk.',
   disc:'This masterclass is educational only. It shares principles and behaviours, not promises. Results vary from person to person, and no specific income or outcome is guaranteed.'}
];

const deck = document.getElementById('deck');
function esc(x){return x||''}
S.forEach(sl=>{
  const d=document.createElement('section'); d.className='slide';
  let html='';
  if(sl.k) html+=`<div class="k">${esc(sl.k)}</div>`;
  if(sl.pill) html=`<div class="pill">${esc(sl.pill)}</div>`+html;
  if(sl.t==='title'){html+=`<h1>${esc(sl.h)}</h1><div class="sub">${esc(sl.s)}</div>`;}
  else if(sl.t==='who'){html+=`<h2>${esc(sl.h)}</h2><div class="sub">${esc(sl.s)}</div>`;}
  else if(sl.t==='lead'){html+=`<div class="lead">${esc(sl.lead)}</div>`;}
  else if(sl.t==='big'){html+=`<div class="big">${esc(sl.big)}</div>`;}
  else if(sl.t==='section'){html+=`<h2>${esc(sl.h)}</h2><div class="sub">${esc(sl.s)}</div>`;}
  else if(sl.t==='principle'){html+=`<div class="num">${esc(sl.num)}</div><h2>${esc(sl.h)}</h2><div class="sub">${esc(sl.s)}</div>`;}
  else if(sl.t==='bullets'){html+=`<h2>${esc(sl.h)}</h2><ul>${sl.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;}
  else if(sl.t==='cta'){html+=`<h2>${esc(sl.h)}</h2><div class="cta-step">${esc(sl.step)}</div><div class="disc">${esc(sl.disc)}</div>`;}
  if(sl.t==='title'||sl.t==='cta') html+=`<div class="foot">Sara Dalrymple &middot; saradalrymple.co.uk</div>`;
  d.innerHTML=html; deck.appendChild(d);
});
const prog=document.getElementById('prog');
addEventListener('scroll',()=>{const h=document.body.scrollHeight-innerHeight;prog.style.width=(scrollY/h*100)+'%';});
</script>
</body>
</html>
