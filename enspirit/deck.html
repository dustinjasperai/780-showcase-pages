<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inner Game of Entrepreneurial Performance — a masterclass with Baiju Solanki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf4e8; --panel:#fffaf2; --deep-panel:#f6e9d4;
    --ink:#1b2545; --muted:#5a6079; --rule:#ecdcc2;
    --accent:#fc9400; --blue:#173887;
    --head:'Playfair Display',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 9vw;border-bottom:1px solid var(--rule);position:relative}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:800;font-size:clamp(34px,6vw,70px);line-height:1.04;color:var(--blue);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(28px,4.4vw,50px);line-height:1.08;color:var(--blue)}
  .sub{font-size:clamp(17px,1.9vw,23px);color:var(--muted);margin-top:26px;max-width:40ch}
  .lead{font-size:clamp(19px,2.1vw,26px);color:var(--ink);margin-top:24px;max-width:46ch}
  .part{font-family:var(--body);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:14px;color:var(--muted)}
  .big{font-family:var(--head);font-weight:800;font-size:clamp(40px,8vw,96px);color:var(--accent);line-height:1;margin-top:10px}
  .games{display:grid;gap:18px;margin-top:38px;max-width:60ch}
  .game{background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--accent);border-radius:10px;padding:22px 26px}
  .game h3{font-family:var(--head);font-weight:700;font-size:clamp(22px,2.6vw,30px);color:var(--blue)}
  .game p{color:var(--muted);margin-top:8px;font-size:17px;max-width:52ch}
  .game.blue{border-left-color:var(--blue)}
  ul.points{margin-top:30px;max-width:48ch;list-style:none}
  ul.points li{padding:14px 0 14px 34px;border-top:1px solid var(--rule);position:relative;font-size:clamp(17px,1.9vw,21px)}
  ul.points li:before{content:"";position:absolute;left:0;top:22px;width:14px;height:14px;background:var(--accent);border-radius:3px}
  .credits{display:grid;gap:14px;margin-top:34px;max-width:52ch}
  .credits div{padding-left:22px;border-left:3px solid var(--accent);font-size:clamp(16px,1.8vw,20px);color:var(--ink)}
  .cta-box{margin-top:34px;background:var(--blue);color:#fff;border-radius:14px;padding:34px 38px;max-width:52ch}
  .cta-box h2{color:#fff}
  .cta-box .step{display:inline-block;margin-top:22px;background:var(--accent);color:#1b2545;font-weight:700;padding:14px 26px;border-radius:999px;font-size:18px}
  .disc{margin-top:22px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .num{position:absolute;top:5vh;right:6vw;font-size:13px;color:var(--muted);letter-spacing:.12em}
  .brandline{position:absolute;bottom:4.5vh;left:9vw;font-size:13px;color:var(--muted);letter-spacing:.08em}
  .em{color:var(--accent)}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:3px;color:var(--muted)}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', kicker:"A live masterclass with Baiju Solanki",
   h:"The Inner Game of Entrepreneurial Performance",
   sub:"Why the founders who break through change the game they are playing, not just how hard they play it."},

  {t:'promise', kicker:"What you will leave with",
   h:"One hour. Three games. A clear read on which one is actually capping you.",
   lead:"Not another list of tactics. A way to see where your real ceiling sits, and what to change first so the rest finally moves."},

  {t:'who', kicker:"Who this is for",
   h:"You have built something real. And it has stopped moving.",
   lead:"You are an entrepreneur or business leader who has done the work, read the books, and bought the strategy. Revenue is fine. But you can feel the ceiling, and working more hours is not lifting it."},

  {t:'trap', kicker:"The trap",
   h:"So you reach for another plan.",
   lead:"Another funnel, another system, another course on how to scale. It helps for a few weeks. Then you are back where you started, busier and no freer. The plan was never the thing that was stuck."},

  {t:'reframe', kicker:"The uncomfortable part",
   h:"Your plateau is not a strategy problem. It is a psychology problem.",
   lead:"After twenty years as a performance psychologist, I can tell you the roots of most founder plateaus are not tactical. They live in identity, mindset and self-leadership. That is the part no strategy course touches."},

  {t:'part', part:"Part One", big:"The real ceiling",
   lead:"Most founders are playing all of their energy on the outside of the business and none of it on the inside of themselves."},

  {t:'list', kicker:"What actually caps you",
   h:"The ceiling is almost always one of these.",
   list:[
     "An identity that still belongs to the operator you were three years ago",
     "A self-image that quietly believes this level is as far as someone like you goes",
     "Clarity that is fuzzy, so every decision costs more energy than it should",
     "Accountability you hold for everyone except yourself"
   ]},

  {t:'cost', kicker:"The cost",
   h:"Left alone, it does not stay still.",
   lead:"The business becomes a reflection of the unexamined operator running it. You scale the chaos, not the calm. More revenue, same knot in your stomach on a Sunday night."},

  {t:'part', part:"Part Two", big:"The 3 Games",
   lead:"Every entrepreneur is playing three games at once. Most only ever train for the last one."},

  {t:'games', kicker:"The framework",
   h:"The 3 Games",
   games:[
     {h:"The Inner Game", p:"Mindset. The beliefs, identity and psychology driving you. Where we start, because nothing downstream holds without it.", cls:""},
     {h:"The Game Plan", p:"Strategy. The plan that fits who you actually are and where you want to go, not a template borrowed from someone else's business.", cls:"blue"},
     {h:"The Outer Game", p:"Actions. The execution that compounds, because it is finally built on the right inner game and the right plan.", cls:""}
   ]},

  {t:'why-order', kicker:"Why the order matters",
   h:"Everyone sells you the Outer Game.",
   lead:"Tactics are easy to package, so that is what fills your feed. But actions built on a borrowed identity and a fuzzy plan just help you run faster in the wrong direction. Win the Inner Game first and the other two finally stick."},

  {t:'not', kicker:"To be clear",
   h:"This is not positive thinking.",
   lead:"It is not affirmations or hustle harder. Performance psychology is the practical work of changing the identity and clarity a founder operates from, so that better decisions get easier instead of requiring more willpower."},

  {t:'plan', kicker:"The Game Plan",
   h:"Then the strategy fits the person, not a template.",
   lead:"Once the inner game is steady, we build the plan around who you actually are and where you are genuinely trying to go. That is why borrowed strategies stall and self-fit strategies hold."},

  {t:'inner', kicker:"The Inner Game",
   h:"Change the game, do not grind the old one harder.",
   lead:"This is what Change Your Game means. We rebuild the operator first: the identity, the clarity, the self-leadership. The founder changes, and then the business has no choice but to follow."},

  {t:'human', kicker:"Humanity's edge",
   h:"In the age of AI, the leader is the edge.",
   lead:"AI can run the playbook. It cannot be the leader. Self-leadership, clarity, communication and accountability are the human advantage that no tool replicates. That is the ground the Inner Game is built on."},

  {t:'part', part:"Part Three", big:"What changes",
   lead:"When the inner game shifts, the outer results stop feeling like a fight."},

  {t:'list', kicker:"On the other side",
   h:"What founders describe after the shift.",
   list:[
     "Decisions get faster because the clarity is real, not performed",
     "The business runs on your energy instead of draining it",
     "You lead the room you used to brace for",
     "Growth feels like expansion, not another weight to carry"
   ]},

  {t:'oneshift', kicker:"The pattern",
   h:"The shift is small. The effect is not.",
   lead:"It is rarely a dramatic reinvention. It is one honest change in how the founder sees themselves, and suddenly the plan is obvious and the action is lighter. That is the whole point of changing the game."},

  {t:'whyme', kicker:"Why me",
   h:"Baiju Solanki",
   credits:[
     "Performance psychologist with 20+ years working with senior leaders and founders",
     "TEDx speaker and author of Change Your Game, Play Your Game and Humanity's Edge (Wiley)",
     "Host of The EnSpirit Podcast",
     "Founder of EnSpirit Global and creator of the Change Your Game Accelerator"
   ]},

  {t:'cta', kicker:"Your next move",
   h:"Ready to change your game?",
   lead:"If this is the layer you have been missing, the next step is a conversation. We will look at the game you are playing now and the one you are built for.",
   step:"Book your exploration call with Baiju",
   disc:"This masterclass is educational. No income or result is guaranteed. Results vary and depend on your own circumstances, effort and decisions. Nothing here is financial, legal or professional advice."}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide';
  let inner = `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  if(s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if(s.t==='part'){
    inner += `<div class="part">${s.part}</div><div class="big">${s.big}</div>`;
    if(s.lead) inner += `<p class="lead">${s.lead}</p>`;
  } else if(s.t==='title'){
    inner += `<h1>${s.h}</h1>`;
    if(s.sub) inner += `<p class="sub">${s.sub}</p>`;
  } else if(s.t==='games'){
    inner += `<h2>${s.h}</h2><div class="games">`;
    s.games.forEach(g=>{ inner += `<div class="game ${g.cls}"><h3>${g.h}</h3><p>${g.p}</p></div>`; });
    inner += `</div>`;
  } else if(s.t==='list'){
    inner += `<h2>${s.h}</h2><ul class="points">`;
    s.list.forEach(li=>{ inner += `<li>${li}</li>`; });
    inner += `</ul>`;
  } else if(s.t==='whyme'){
    inner += `<h1>${s.h}</h1><div class="credits">`;
    s.credits.forEach(c=>{ inner += `<div>${c}</div>`; });
    inner += `</div>`;
  } else if(s.t==='cta'){
    inner += `<div class="cta-box"><h2>${s.h}</h2><p class="lead" style="color:#e8ecf7">${s.lead}</p><span class="step">${s.step}</span></div><p class="disc">${s.disc}</p>`;
  } else {
    inner += `<h2>${s.h}</h2>`;
    if(s.lead) inner += `<p class="lead">${s.lead}</p>`;
  }
  inner += `<div class="brandline">EnSpirit Global &middot; Change Your Game</div>`;
  sec.innerHTML = inner;
  deck.appendChild(sec);
});
</script>
</body>
</html>
