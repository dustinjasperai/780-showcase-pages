<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Cash-Pay Content System — A Masterclass for Therapists</title>
<!-- Palette: brand-derived from thelizfernandez.com (dark editorial, #0d0d0d ground, Forum + Barlow).
     Deck tokens: bg #0e0e0e, ink #f4f1ea, rule #2a2a28, accent clay #c08457. One accent, one dominant. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0e0e0e; --panel:#161614; --ink:#f4f1ea; --ink-soft:#c9c4b8;
    --ink-mute:#8a857a; --rule:#2a2a28; --accent:#c08457;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:960px}
  .slide.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:'Barlow';font-weight:600;font-size:13px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:'Forum';font-weight:400;font-size:58px;line-height:1.08;letter-spacing:.005em;margin-bottom:22px}
  h2{font-family:'Forum';font-weight:400;font-size:42px;line-height:1.14;margin-bottom:20px}
  .lead{font-size:23px;line-height:1.5;color:var(--ink-soft);font-weight:300;max-width:760px}
  .sub{font-size:19px;line-height:1.55;color:var(--ink-soft);font-weight:300;max-width:720px;margin-top:14px}
  .rule{height:1px;background:var(--rule);margin:30px 0;width:100%}
  ul{list-style:none;margin-top:12px}
  li{font-size:20px;line-height:1.5;color:var(--ink-soft);font-weight:300;padding:13px 0;border-bottom:1px solid var(--rule);
    display:flex;gap:16px;align-items:baseline}
  li .n{font-family:'Forum';color:var(--accent);font-size:20px;min-width:26px}
  li b{color:var(--ink);font-weight:500}
  .big{font-family:'Forum';font-size:120px;line-height:1;color:var(--accent);display:block;margin-bottom:10px}
  .method{border-left:2px solid var(--accent);padding-left:26px;margin-top:10px}
  .method .k{font-family:'Forum';font-size:34px;color:var(--ink);margin-bottom:8px}
  .quote{font-family:'Forum';font-size:40px;line-height:1.2;color:var(--ink)}
  .disc{font-size:13px;line-height:1.5;color:var(--ink-mute);font-weight:300;margin-top:28px;max-width:720px}
  .cta-line{font-size:22px;color:var(--ink-soft);font-weight:300;margin-top:8px}
  footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
    align-items:center;padding:16px 7vw;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-mute);border-top:1px solid var(--rule)}
  .prog{height:2px;background:var(--accent);position:fixed;top:0;left:0;transition:width .3s}
  .brand{font-family:'Forum';letter-spacing:.04em}
  @media(max-width:640px){h1{font-size:38px}h2{font-size:30px}.lead{font-size:19px}.big{font-size:84px}li{font-size:17px}}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div id="stage"></div>
<footer>
  <span class="brand">Six Figure Therapist</span>
  <span id="pg"></span>
</footer>
<script>
const S = [
  {t:'title',
    eyebrow:'A live masterclass for private-pay therapists',
    h:'The Cash-Pay Content System',
    lead:'How to get your next private-pay clients from Instagram content that sounds like you, even with a small audience.'},

  {t:'promise',
    eyebrow:'The promise',
    h:'By the end of this hour',
    lead:'You will know exactly what to post this week to turn quiet scrolling into inquiries, without becoming an influencer, chasing virality, or waiting until you hit 10,000 followers.'},

  {t:'who',
    eyebrow:'Who this is for',
    h:'The therapist who is doing the work, quietly',
    bullets:[
      ['You are licensed and good at the clinical work, but the referrals are inconsistent.'],
      ['You want cash-pay clients, not another insurance panel.'],
      ['You post sometimes, but it feels performative and nothing comes of it.'],
      ['You do not want to perform. You want people to find you and reach out.']
    ]},

  {t:'trap',
    eyebrow:'The trap',
    h:'You were told to post more',
    lead:'So you post more. Tips, reminders, the occasional reel. It is louder, but the DMs stay empty. The problem was never the frequency. It was that the content was built for the algorithm instead of for the one person who needs you.'},

  {t:'reframe',
    eyebrow:'The reframe',
    quote:'Visibility is not a popularity contest. It is a matching problem.',
    sub:'You do not need more of everyone. You need the right people to feel, in one post, that you understand them, and an easy way for them to raise their hand.'},

  {t:'part',
    eyebrow:'The cost',
    h:'What the quiet account costs',
    lead:'Every month the referrals stay inconsistent, you hold caseload anxiety that has nothing to do with your clinical skill. You discount, you take the insurance client you did not want, you wonder if private pay is even possible for you. It is. The missing piece is not more hustle, it is a method.'},

  {t:'part',
    eyebrow:'Part one',
    h:'Why good therapists stay invisible',
    lead:'Most therapist content does one of two things: it teaches in a voice borrowed from a template, or it broadcasts into the feed hoping someone catches it. Neither builds trust, and trust is the only thing that turns a viewer into a cash-pay inquiry.'},

  {t:'part2head',
    eyebrow:'Part two: the system',
    h:'Three moves, in order',
    lead:'Views, then trust, then the raised hand. Most people skip to selling. The order is the whole method.'},

  {t:'method',
    eyebrow:'Move one',
    k:'Connection Hooks',
    pillar:'Views',
    body:'Get your content in front of more of the right people with openings that create connection instead of clickbait. Hooks that name the private tension your ideal client is already feeling, so an aligned audience grows even from a small following.'},

  {t:'method',
    eyebrow:'Move two',
    k:'The Trust Method',
    pillar:'Inquiries',
    body:'Turn views into people who actually want to work with you. A simple content rhythm that builds recognition and authority over a few posts, so a stranger moves from watching to trusting to thinking, this person gets me.'},

  {t:'method',
    eyebrow:'Move three',
    k:'The Raise Method',
    pillar:'Clients',
    body:'Give interested people an easy way to raise their hand, mostly through Stories, so a warm viewer becomes a booked inquiry. This is the step most therapists are missing entirely, and it is why their best content still produces no clients.'},

  {t:'stack',
    eyebrow:'How the three stack',
    h:'From a scroll to a signed client',
    bullets:[
      ['<b>Connection Hooks</b> bring the right person into the room.'],
      ['<b>The Trust Method</b> makes them feel understood over time.'],
      ['<b>The Raise Method</b> gives them a low-pressure way to reach out.'],
      ['Each move only works because the one before it did.']
    ]},

  {t:'who',
    eyebrow:'In practice',
    h:'What one week actually looks like',
    bullets:[
      ['A few posts built on Connection Hooks, written in your voice, not a swipe file.'],
      ['One or two Trust Method pieces that show how you think, not just what you know.'],
      ['A single Raise Method Story that invites the right person to reach out.'],
      ['No daily posting, no dancing, no pretending to be someone you are not.']
    ]},

  {t:'part',
    eyebrow:'Part three',
    h:'When your content finally sounds like you',
    lead:'Content posted on a rhythm you can keep. Inquiries arriving in the DMs from people who already feel they know you. Consult calls booked straight from a post, without a single cold pitch.'},

  {t:'reframe',
    eyebrow:'The shift',
    quote:'You stop performing for the feed and start speaking to one person.',
    sub:'That is the whole shift. When the right therapist-client reads a post and thinks finally, someone gets it, the inquiry is already halfway to a booking.'},

  {t:'proof',
    eyebrow:'Why me',
    h:'I rebuilt this from zero, on purpose',
    lead:'I grew a multi-six-figure practice with Instagram as my main channel, including my first six-figure year with fewer than 2,000 followers. Then I lost my 10K account overnight and started over, using the new account as a live case study with the same system. Past 4,000 followers, consult calls booked from content, in months.'},

  {t:'ethos',
    eyebrow:'The standard',
    quote:'Content that sounds like you, not a template.',
    sub:'As the eldest daughter of Mexican immigrant farm workers and a first-gen Latina therapist, I built this to close the pay gap for therapists like us, without asking anyone to perform a version of themselves.'},

  {t:'cta',
    eyebrow:'Your next step',
    h:'Make Instagram your referral engine',
    ctaLine:'The 6 Figure Therapist Collective is where we run the full Cash-Pay Content System together over twelve months. If getting cash-pay clients from content that sounds like you is the year you want, this is the room.',
    disc:'Educational only. This masterclass teaches a content and marketing method; it is not therapy, supervision, legal, or financial advice, and it makes no income or results guarantee. Outcomes vary with your market, your offer, and your effort.'}
];

const stage=document.getElementById('stage');
function esc(s){return s;}
function render(o){
  if(o.t==='title') return `<div class="eyebrow">${o.eyebrow}</div><h1>${o.h}</h1><p class="lead">${o.lead}</p>`;
  if(o.t==='promise'||o.t==='trap'||o.t==='part'||o.t==='part2head'||o.t==='proof')
    return `<div class="eyebrow">${o.eyebrow}</div><h2>${o.h}</h2><p class="lead">${o.lead}</p>`;
  if(o.t==='promise2') return '';
  if(o.t==='who'||o.t==='stack'){
    let li=o.bullets.map(b=>`<li><span class="n">&bull;</span><span>${b[0]}</span></li>`).join('');
    return `<div class="eyebrow">${o.eyebrow}</div><h2>${o.h}</h2><ul>${li}</ul>`;
  }
  if(o.t==='reframe'||o.t==='ethos')
    return `<div class="eyebrow">${o.eyebrow}</div><p class="quote">&ldquo;${o.quote}&rdquo;</p><div class="rule"></div><p class="sub">${o.sub}</p>`;
  if(o.t==='method')
    return `<div class="eyebrow">${o.eyebrow} &middot; ${o.pillar}</div><div class="method"><div class="k">${o.k}</div><p class="lead">${o.body}</p></div>`;
  if(o.t==='cta')
    return `<div class="eyebrow">${o.eyebrow}</div><h2>${o.h}</h2><p class="cta-line">${o.ctaLine}</p><p class="disc">${o.disc}</p>`;
  return '';
}
let i=0;
function show(n){
  i=Math.max(0,Math.min(S.length-1,n));
  stage.innerHTML=`<div class="slide on">${render(S[i])}</div>`;
  document.getElementById('prog').style.width=((i+1)/S.length*100)+'%';
  document.getElementById('pg').textContent=(i+1)+' / '+S.length;
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')show(i+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')show(i-1);
});
document.addEventListener('click',e=>{show(i+1)});
show(0);
</script>
</body>
</html>
