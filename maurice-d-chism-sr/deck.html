<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Where, Why, Next Masterclass — Maurice D. Chism, Sr.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#0e1621; --panel:#18222e; --rule:#2b3a4d;
    --accent:#1d67cd; --hi:#116dff;
    --ink:#eef3f8; --muted:#9fb2c4;
  }
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;line-height:1.6;}
  .deck{max-width:1040px;margin:0 auto;padding:40px 24px 80px;}
  .slide{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:56px 0;border-bottom:1px solid var(--rule);}
  .kicker{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:var(--accent);margin-bottom:18px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:58px;line-height:1.04;letter-spacing:.01em;margin-bottom:22px;text-transform:uppercase;}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:38px;line-height:1.1;margin-bottom:20px;text-transform:uppercase;letter-spacing:.01em;}
  p{font-size:20px;color:var(--ink);margin-bottom:16px;max-width:760px;}
  p.sub{color:var(--muted);font-size:21px;}
  ul{list-style:none;margin:14px 0;max-width:760px;}
  li{font-size:20px;color:var(--ink);padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);}
  li::before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;background:var(--accent);}
  .big{font-family:'Oswald',sans-serif;font-weight:700;font-size:80px;color:var(--hi);line-height:1;}
  .step{display:flex;gap:22px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--rule);}
  .step .n{font-family:'Oswald',sans-serif;font-weight:700;font-size:40px;color:var(--accent);min-width:150px;text-transform:uppercase;}
  .step .b{font-size:20px;color:var(--ink);}
  .panel{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);padding:26px 28px;margin-top:18px;}
  .quote{font-family:'Oswald',sans-serif;font-weight:500;font-size:34px;line-height:1.2;color:var(--ink);text-transform:uppercase;letter-spacing:.01em;}
  .cta-note{font-size:14px;color:var(--muted);margin-top:28px;max-width:720px;border-top:1px solid var(--rule);padding-top:18px;}
  .pager{font-family:'Inter';font-size:12px;color:var(--muted);letter-spacing:.1em;margin-top:26px;}
  strong{color:var(--hi);font-weight:600;}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Live Masterclass with Maurice D. Chism, Sr.', h:'The Where, Why, Next Masterclass', p:'How capable people stop stalling and turn the next decision into the next move.', pager:'Well Why Not'},

  {t:'who', kicker:'Who this is for', h:'You already know you are capable of more', bullets:['You have the idea, the skill, and the experience','You keep circling the same decisions without moving','Every stalled month is a month the business does not grow'], sub:'If you are a professional, founder, or small-business owner sitting on ideas you have not executed, this hour is for you.'},

  {t:'hook', kicker:'The reframe', q:'"That will never work."', p:'That is the quiet voice that kills more businesses than any competitor ever has. It does not shout. It just gets you to wait one more week. This masterclass is about silencing it on purpose.'},

  {t:'part', kicker:'Part One', h:'The real problem is not strategy', p:'Most capable people do not fail for lack of a plan. They stall in the gap between knowing what to do and actually doing it. That gap has a name: hesitation dressed up as "being realistic."'},

  {t:'list', kicker:'What hesitation actually costs', h:'The price of waiting', bullets:['Ideas expire while you research them to death','Confidence erodes every time you talk yourself out of a move','Momentum never compounds because nothing ever ships']},

  {t:'part', kicker:'Part Two', h:'The Where, Why, Next method', p:'The way out is not more motivation. It is a repeatable sequence you can run on any stuck decision. Three steps, in order, every time.'},

  {t:'steps', kicker:'The method', h:'Three steps, in order', steps:[
    {n:'Where', b:'Tell yourself the truth about where you actually are right now. No spin, no story. The honest starting line.'},
    {n:'Why', b:'Surface the real reason this matters to you. Your deepest motivation is the fuel that outlasts the fear.'},
    {n:'Next', b:'Commit to one aligned next action. Not the whole plan. The next move you can take this week.'}
  ]},

  {t:'panel', kicker:'Where', h:'Start with the honest truth', p:'You cannot move from a place you refuse to look at. Where asks one question: if nobody was watching and nothing was at stake, what is really going on here?', note:'Most people skip this step and wonder why their goals feel hollow.'},

  {t:'panel', kicker:'Why', h:'Anchor to the motivation that lasts', p:'Discipline built on pressure breaks. Discipline built on a why you actually believe in holds. Why connects the next move to the life you are trying to build.', note:'When the why is clear, the how gets a lot less scary.'},

  {t:'panel', kicker:'Next', h:'One aligned action beats a perfect plan', p:'The whole plan is overwhelming on purpose. Your mind uses it to justify waiting. Next shrinks the decision down to the single move you can make now, so momentum finally starts.', note:'Action creates clarity. Clarity never creates action.'},

  {t:'list', kicker:'The discipline layer', h:'How the method compounds', bullets:['Define meaningful goals, not borrowed ones','Name the internal and external obstacles out loud','Install one daily discipline and protect it','Track progress and celebrate the small wins']},

  {t:'list', kicker:'The two obstacles', h:'What gets in the way', bullets:['Internal: doubt, perfectionism, the "that will never work" voice','External: time, money, people who do not get it','The method handles both by making the next move small enough to take anyway']},

  {t:'part', kicker:'Part Three', h:'What it looks like in motion', p:'Run Where, Why, Next on one stuck decision and you get movement in a week. Run it for a month and hesitation stops being your default. Run it with other capable people and it becomes who you are.'},

  {t:'who', kicker:'Why me', h:'I have had this conversation 598 times', bullets:['Founder of Chism Group since 2012','Certified Master Entrepreneurship Coach','Host of That Will Nevr Work, nearly 600 episodes of candid business conversations'], sub:'I built the Well Why Not method and workbook from everything those conversations taught me about why capable people stall and how they finally move.'},

  {t:'panel', kicker:'The room', h:'You are not meant to do this alone', p:'The WYN Inner Circle is where capable people apply the method together, hold each other accountable, and keep each other moving. Reflection, implementation, and real progress, in good company.', note:'The method works best when you are not the only one running it.'},

  {t:'list', kicker:'What you leave with today', h:'Your takeaways', bullets:['The Where, Why, Next sequence you can run on any decision','A clear read on the obstacle that keeps stopping you','One aligned next action, chosen before you log off']},

  {t:'cta', kicker:'Your next move', h:'Well. Why not?', p:'You already know you are capable of more. The only question left is whether you take the next step or talk yourself out of it one more time.', action:'Book a call with Maurice to map your Where, Why, and Next, or join the WYN Inner Circle and start running the method this week.', disclaimer:'This masterclass is for educational purposes only. It is not financial, legal, or business-results advice, and no specific outcome or income is guaranteed. Results vary based on your effort, situation, and execution.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=el('section','slide');
  if(s.kicker)sec.appendChild(el('div','kicker',s.kicker));
  if(s.t==='title'){sec.appendChild(el('h1',null,s.h));sec.appendChild(el('p','sub',s.p));}
  else if(s.t==='hook'){sec.appendChild(el('div','quote',s.q));sec.appendChild(el('p',null,s.p));}
  else if(s.t==='steps'){sec.appendChild(el('h2',null,s.h));s.steps.forEach(st=>{const d=el('div','step');d.appendChild(el('div','n',st.n));d.appendChild(el('div','b',st.b));sec.appendChild(d);});}
  else if(s.t==='panel'){sec.appendChild(el('h2',null,s.h));sec.appendChild(el('p',null,s.p));const pn=el('div','panel');pn.appendChild(el('p','sub',s.note));sec.appendChild(pn);}
  else if(s.t==='cta'){sec.appendChild(el('h2',null,s.h));sec.appendChild(el('p',null,s.p));const pn=el('div','panel');pn.appendChild(el('p',null,s.action));sec.appendChild(pn);sec.appendChild(el('div','cta-note',s.disclaimer));}
  else{if(s.h)sec.appendChild(el('h2',null,s.h));if(s.p)sec.appendChild(el('p',null,s.p));if(s.bullets){const ul=el('ul');s.bullets.forEach(b=>ul.appendChild(el('li',null,b)));sec.appendChild(ul);}if(s.sub)sec.appendChild(el('p','sub',s.sub));}
  sec.appendChild(el('div','pager',(i+1)+' / '+S.length+(s.pager?('  ·  '+s.pager):'')));
  deck.appendChild(sec);
});
</script>
</body>
</html>
