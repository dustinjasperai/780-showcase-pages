<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fysiologi før psykologi, a BevægelsesMENTOR masterclass with Charlotte Runge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1f3545;        /* Charlotte Runge brand deep slate (extract_brand) */
    --panel:#27455b;     /* lighter slate panel */
    --ink:#eef2f5;
    --muted:#8fa6b5;
    --accent:#ce8c43;    /* her copper/gold accent (extract_brand) */
    --rule:rgba(143,166,181,.28);
    --display:'Literata',Georgia,serif;
    --body:'Figtree',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#12222e;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:64px 64px 58px;
    margin:0 0 26px;
    min-height:560px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);opacity:.9}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:600;font-size:58px;line-height:1.04;letter-spacing:.2px;margin-bottom:22px}
  h2{font-family:var(--display);font-weight:600;font-size:41px;line-height:1.09;margin-bottom:20px}
  h3{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.2;color:var(--accent);margin-bottom:12px}
  p{font-size:19px;line-height:1.62;color:var(--ink);max-width:40em;margin-bottom:14px}
  p.lead{font-size:22px;color:var(--ink)}
  p.sub{font-size:21px;color:var(--muted);font-style:italic;font-family:var(--display)}
  .muted{color:var(--muted)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule);max-width:42em}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:21px;width:10px;height:10px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .pyramid{margin-top:14px}
  .layer{background:var(--panel);border-left:3px solid var(--accent);padding:12px 18px;margin:0 auto 7px;border-radius:6px}
  .layer b{font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink)}
  .layer span{color:var(--muted);font-size:16px}
  .l1{max-width:44%}.l2{max-width:56%}.l3{max-width:68%}.l4{max-width:80%}.l5{max-width:92%}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:10px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:26px}
  .card h3{margin-bottom:10px}
  .foot{position:absolute;bottom:22px;right:30px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .cta .btn{display:inline-block;margin-top:14px;background:var(--accent);color:#1b2a36;font-weight:700;font-family:var(--body);padding:15px 30px;border-radius:8px;font-size:18px}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:46em;line-height:1.5}
  @media(max-width:720px){.slide{padding:38px 28px}h1{font-size:40px}h2{font-size:31px}.two{grid-template-columns:1fr}.l1,.l2,.l3,.l4,.l5{max-width:100%}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
 {t:'title', html:`<div class="kicker">A live BevægelsesMENTOR masterclass</div>
   <h1>Fysiologi før psykologi</h1>
   <p class="sub">Reading children's behaviour through the body, not the will.</p>
   <p class="lead" style="margin-top:26px">With Charlotte Runge, physiotherapist and sports scientist, founder of the BevægelsesMENTOR uddannelse.</p>
   <div class="foot">The Charlotte Runge Method</div>`},

 {t:'promise', html:`<div class="kicker">What this hour gives you</div>
   <h2>By the end, a "difficult" child will look completely different to you</h2>
   <p>You will leave with one lens and three tools: how to read restless, unfocused or explosive behaviour as a nervous-system state, and what to do with your body, the room and the group to bring a child back to calm and ready to learn.</p>
   <p class="sub">Change does not start in the head. It starts in the body.</p>`},

 {t:'forwho', html:`<div class="kicker">Who this is for</div>
   <h2>The adults in the room around the child</h2>
   <ul>
     <li>Pædagoger, teachers and daycare staff who meet dysregulated children every single day</li>
     <li>Therapists and special-needs specialists who want the nervous system under their interventions</li>
     <li>Anyone who has tried every behaviour strategy in the book and still has a child who cannot settle</li>
   </ul>`},

 {t:'trap', html:`<div class="kicker">The trap</div>
   <h2>You were trained to manage the behaviour</h2>
   <p>Rewards, consequences, quiet corners, visual schedules, firm boundaries. They work on the children who were already close to regulated. On the child whose system is genuinely overloaded, they do nothing, and you start to wonder if the problem is you.</p>
   <p class="muted">It is not you. You are working one layer too high.</p>`},

 {t:'reframe', html:`<div class="kicker">The reframe</div>
   <h2>The child is not giving you a hard time. The child is having a hard time.</h2>
   <p class="lead">Behaviour you can see is the top of a stack. Underneath it sits a nervous system that is either regulated or it is not. Reach the physiology and the behaviour changes on its own. Argue with the behaviour and you will fight it all year.</p>`},

 {t:'p1head', html:`<div class="kicker">Part one</div>
   <h2>Why behaviour is the wrong place to start</h2>
   <p>A child who kicks, bolts, melts down or drifts off is not choosing a strategy. The body has moved into a survival state faster than thought can follow. Asking that child to "use their words" is asking a flooded system to do something it physically cannot do yet.</p>`},

 {t:'p1cost', html:`<div class="kicker">What it costs</div>
   <h2>The whole group pays for one unread nervous system</h2>
   <ul>
     <li>One dysregulated child pulls the adult's attention off the other twenty</li>
     <li>The learning environment tips from calm to chaotic in minutes</li>
     <li>The child collects a story about themselves: I am the difficult one</li>
     <li>Staff burn out managing symptoms that never resolve</li>
   </ul>`},

 {t:'p1why', html:`<div class="kicker">The missing literacy</div>
   <h2>Most training skips the layer underneath</h2>
   <p>Pedagogy and psychology both start at thoughts, feelings and choices. Useful, but one floor up from where a struggling child actually is. The piece almost no one is taught is how to read the physical state first, and how to shift it with movement, rhythm and the design of the day.</p>`},

 {t:'p2head', html:`<div class="kicker">Part two</div>
   <h2>The method: physiology first, in five layers</h2>
   <p>Everything I teach in the BevægelsesMENTOR uddannelse sits on one model. It tells you where a child actually is, and therefore what to support first instead of guessing.</p>`},

 {t:'pyramid', html:`<div class="kicker">Framework 1</div>
   <h3>Læringspyramiden, the Learning Pyramid</h3>
   <div class="pyramid">
     <div class="layer l1"><b>1 &middot; The nervous system</b> <span>safe and regulated, or not</span></div>
     <div class="layer l2"><b>2 &middot; Senses</b> <span>the body taking the world in</span></div>
     <div class="layer l3"><b>3 &middot; Motor skills</b> <span>moving with control and ease</span></div>
     <div class="layer l4"><b>4 &middot; Emotional and social</b> <span>feeling, playing, belonging</span></div>
     <div class="layer l5"><b>5 &middot; Cognition and executive function</b> <span>focus, memory, learning</span></div>
   </div>
   <p class="muted" style="margin-top:14px">You cannot teach layer five to a child stuck on layer one. Build from the bottom.</p>`},

 {t:'lege', html:`<div class="kicker">Framework 2</div>
   <h3>Legemodellen, turning theory into play</h3>
   <p>Knowing where a child is only matters if you can act. Legemodellen translates each layer of the pyramid into targeted movement games and play, so you can build the exact layer a child needs, in the room, today, with no equipment and no extra hour in the day.</p>
   <p class="muted">Play is not the reward after the work. For a young nervous system, play is the work.</p>`},

 {t:'regulation', html:`<div class="kicker">Framework 3</div>
   <h2>Two levers you always have: internal and external</h2>
   <div class="two">
     <div class="card"><h3>Internal regulation</h3><p style="font-size:17px">The child's own system: nervous system, senses, motor skills, rhythm and bodily experience. What we build so a child can find calm from the inside.</p></div>
     <div class="card"><h3>External regulation</h3><p style="font-size:17px">What the adult controls: structure, transitions, group size, your own tone and body, the design of the space. Calm the room and you borrow it to the child.</p></div>
   </div>`},

 {t:'p2together', html:`<div class="kicker">How it fits</div>
   <h2>Read the layer, pick the lever, choose the play</h2>
   <p>That is the whole method in one line. The pyramid tells you where the child is. Internal and external regulation tell you which lever to pull. Legemodellen gives you the specific play that pulls it. You stop guessing and start aiming.</p>`},

 {t:'p3head', html:`<div class="kicker">Part three</div>
   <h2>Monday morning, with the lens on</h2>
   <p>Not a theory for a course binder. A way of seeing that changes the next hard moment you walk into.</p>`},

 {t:'p3look', html:`<div class="kicker">In practice</div>
   <h2>The same child, read two ways</h2>
   <div class="two">
     <div class="card"><h3>Before</h3><p style="font-size:17px">"He will not sit still, he disrupts circle time, he needs consequences." The adult braces for a battle and the child feels it.</p></div>
     <div class="card"><h3>After</h3><p style="font-size:17px">"His system is seeking input before he can settle. Two minutes of heavy movement, then circle time." The battle never starts.</p></div>
   </div>`},

 {t:'p3before', html:`<div class="kicker">What changes</div>
   <h2>Calm is not something you demand. It is something you build.</h2>
   <ul>
     <li>You intervene at the physical state, so the behaviour has less to stand on</li>
     <li>You act earlier, before the meltdown, because you can read the build-up</li>
     <li>The child learns their own body instead of a label</li>
     <li>The whole group gets a calmer, more present adult</li>
   </ul>`},

 {t:'whyme', html:`<div class="kicker">Why me</div>
   <h2>Twenty-five years translating the nervous system into practice</h2>
   <p>I am a physiotherapist and sports scientist, and I have spent my career where the body, movement, learning and development meet. In 2014 I built the BevægelsesMENTOR uddannelse to put that knowledge into the hands of the people who are actually with children all day. Thousands of professionals now read behaviour this way.</p>
   <p class="sub">Fra viden til forandring i praksis. From knowledge to change in practice.</p>`},

 {t:'recap', html:`<div class="kicker">What you now have</div>
   <h2>One lens, three frameworks, a different Monday</h2>
   <ul>
     <li>Physiology before psychology: the body state sits under the behaviour</li>
     <li>Læringspyramiden: read which layer the child is actually on</li>
     <li>Internal and external regulation: the two levers you always hold</li>
     <li>Legemodellen: the play that builds the layer the child needs</li>
   </ul>`},

 {t:'cta', html:`<div class="kicker">Your next step</div>
   <h2>Go deeper in the BevægelsesMENTOR uddannelse</h2>
   <p>This hour is the lens. The uddannelse is the full training: sixteen weeks through all five layers, with the tools, the play library and a community of professionals who see children the way you now do. If today changed how one child looks to you, imagine the whole model in your hands.</p>
   <div><a class="btn">See the BevægelsesMENTOR uddannelse</a></div>
   <p class="disclaimer">This is an educational masterclass. It shares a professional framework for understanding children's behaviour and development through the nervous system and movement. It is not medical, psychological or diagnostic advice, and it is not a substitute for individual assessment by a qualified professional. No income or result is guaranteed. Results vary from child to child and from setting to setting.</p>`}
];

const deck = document.getElementById('deck');
S.forEach(s=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  el.innerHTML = s.html || '';
  deck.appendChild(el);
});
</script>
</body>
</html>
