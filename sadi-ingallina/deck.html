<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>What a Climber Is Actually Worth &middot; Grow Your Tree Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d0d0d; --panel:#16240f; --rule:#2a2a24;
    --accent:#feed00; --forest:#1d5b19;
    --chalk:#fafaf9; --grey:#a5a59c; --dim:#6f6f66;
  }
  html,body{height:100%}
  body{background:#050505;font-family:'Poppins',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050505}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .38s ease;
    display:flex;flex-direction:column;justify-content:flex-end;padding:8% 9% 13% 9%}
  .slide.active{opacity:1;visibility:visible}
  /* hi-vis band across the bottom of every content slide, her chipper-decal register */
  .t-normal::after{content:'';position:absolute;left:0;right:0;bottom:0;height:1.1vh;
    background:repeating-linear-gradient(115deg,var(--accent) 0 3.4vw,#0d0d0d 3.4vw 6.8vw)}
  .kicker{font-family:'Poppins',sans-serif;font-size:.92vw;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;color:var(--chalk);line-height:1.04;letter-spacing:.005em;text-transform:uppercase}
  .t-title{justify-content:center}
  .t-title h1{font-size:5.4vw;max-width:80%;color:var(--accent)}
  .t-title .sub{font-family:'Poppins',sans-serif;font-size:1.42vw;color:var(--grey);margin-top:3.4vh;max-width:66%;line-height:1.6;font-weight:300;text-transform:none}
  .t-normal h1{font-size:3.1vw;max-width:82%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.36vw;color:var(--grey);margin-top:2.8vh;max-width:72%;line-height:1.62;font-weight:300}
  .t-section{background:var(--panel);justify-content:center;border-left:1.6vw solid var(--accent)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  .t-section h1{font-size:4.4vw;max-width:76%}
  .t-hit{background:var(--bg);justify-content:center;align-items:flex-start}
  .t-hit h1{font-size:3.4vw;max-width:78%;color:var(--accent);line-height:1.12}
  .t-hit .body{font-family:'Poppins',sans-serif;font-size:1.3vw;color:var(--grey);margin-top:3vh;max-width:64%;font-weight:300;text-transform:none}
  .t-cta{background:var(--panel);justify-content:center;align-items:center;text-align:center;border-top:1.1vh solid var(--accent)}
  .t-cta h1{font-size:4vw;max-width:80%;color:var(--accent)}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Poppins',sans-serif;border:1.5px solid var(--accent);color:var(--accent);padding:1.2vh 1.8vw;font-size:1.05vw;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .brandline{font-family:'Poppins',sans-serif;font-size:1vw;color:var(--grey);margin-top:3.6vh;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:600}
  .disc{position:absolute;left:9%;right:9%;bottom:4.6vh;font-family:'Poppins',sans-serif;font-size:.82vw;color:var(--dim);line-height:1.45;font-weight:300}
  .t-cta .disc{text-align:center;bottom:3.4vh}
  .line{position:absolute;pointer-events:none}
  .line.big{right:5%;top:9%;width:17vw;opacity:.85}
  .line.small{right:6%;top:10%;width:7.4vw;opacity:.4}
  .hud{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(250,250,249,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:12px;right:18px;font-family:'Poppins',sans-serif;font-size:11px;letter-spacing:.2em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Poppins',sans-serif;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:11px;left:50%;transform:translateX(-50%);font-family:'Poppins',sans-serif;font-size:10px;color:var(--dim);z-index:20;letter-spacing:.14em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.5vw}.t-title h1{font-size:9vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:2.9vw}
    .t-title .sub{font-size:3.1vw}.t-section h1{font-size:7.4vw}.t-hit h1{font-size:6vw}.t-cta h1{font-size:7vw}.chip{font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">Grow Your Tree Co.</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- a climbing line running down to a friction hitch, one stroke -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="line" viewBox="0 0 160 260">
  <g fill="none" stroke="#feed00" stroke-linecap="round">
    <path d="M80 4 C80 60 76 94 78 128" stroke-width="3"/>
    <path d="M62 132 H98" stroke-width="2.4" opacity="0.85"/>
    <path d="M62 144 H98" stroke-width="2.4" opacity="0.85"/>
    <path d="M62 156 H98" stroke-width="2.4" opacity="0.85"/>
    <path d="M66 126 C56 140 56 150 66 162" stroke-width="2.2" opacity="0.7"/>
    <path d="M94 126 C104 140 104 150 94 162" stroke-width="2.2" opacity="0.7"/>
    <path d="M78 164 C80 200 74 226 80 254" stroke-width="3"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'What a Climber Is Actually Worth',sub:'Why good climbers leave companies that pay them well, what a written pay scale does to your margin, and how a crew lead ends up running a job site without you standing under the tree.',brand:true,line:'big'},

 {t:'normal',k:'Who this is for',title:'Owners with one to four crews who keep losing people they trained.',body:'You pay fairly. You are not the cheap outfit in town. And every spring somebody good gives notice, takes the training you paid for, and goes eleven miles down the road for a dollar an hour.'},
 {t:'normal',k:'What you will walk away with',title:'A pay scale you can hand someone on day one, and the checklist that says how they move up it.',body:'What a climber costs you per day, what they earn you per day, where the number stops making sense, and what has to be true before you promote anyone.'},
 {t:'normal',k:'An honest note',title:'This is education, not a promise.',body:'Every market pays differently and every company has a different cost base. What matters is the version of these numbers that fits your crews and your region.',disc:'Educational content. Nothing here is a promise of income, retention, or business results. No outcome is guaranteed and results vary by company and market.'},
 {t:'normal',k:'Who is teaching this',title:'Sadi Ingallina. Founder of Ash Tree Enterprises and Grow Your Tree Co.',body:'She started Ash Tree Enterprises and scaled it past $2 million a year, with weeks hitting $45k. Everything in this class is a document her own company still runs on, written after seven years of getting it wrong first.'},

 {t:'section',idx:'Part One',title:'Why Good Climbers Leave'},
 {t:'normal',k:'It is rarely the money',title:'People leave for a dollar an hour because nothing else was holding them.',body:'No written scale, no visible next step, no idea what earns a raise. When pay is the only variable anyone can see, pay is the only variable anyone shops.'},
 {t:'hit',title:'A raise you negotiate is a favour. A raise you publish is a system.',body:'One of those makes people loyal. The other one makes them ask again in six months.',line:'small'},
 {t:'normal',k:'The quiet cost',title:'A climber who leaves takes eighteen months of your training with them.',body:'Then you hire green, slow the crew down, carry the risk while they learn, and pay overtime to cover the gap. The replacement is never the same price as the person.'},
 {t:'normal',k:'What most owners try',title:'Matching the offer, quietly, for one person.',body:'It works for about a season. Then the rest of the crew finds out, because they always find out, and now there is no scale at all, just a rumour about who asked at the right moment.'},

 {t:'section',idx:'Part Two',title:'A Pay Scale That Protects the Margin'},
 {t:'normal',k:'Start at the day',title:'Work out what one person on one crew costs you for one day.',body:'Wages, payroll costs, the truck, the saws, the insurance, and their share of everything that keeps the office open. Until that number exists, every pay conversation is a guess with feelings attached.'},
 {t:'normal',k:'Then the ceiling',title:'Every role has a rate above which the job stops making money.',body:'Knowing the ceiling is what lets you say yes quickly and no honestly. It is also what stops a good year from quietly setting a wage you cannot carry through a slow February.'},
 {t:'normal',k:'Write it down',title:'A published scale: role, rate, and exactly what moves someone to the next line.',body:'Transparent and fair on purpose, because a scale that motivates has to be one people can read. This is the difference between a company that keeps climbers and one that keeps rehiring them.'},
 {t:'hit',title:'Pay is not what somebody talked you into. It is a line on a page you wrote before they walked in.',line:'small'},
 {t:'normal',k:'Promote on skill',title:'A progress checklist, so nobody is promoted for lasting the longest.',body:'Named skills, checked off as they are actually demonstrated, and a signed agreement that lines up pay, performance, responsibility and safety in one place. Promotion stops being guesswork and starts being evidence.'},

 {t:'section',idx:'Part Three',title:'Crews That Run Without You On Site'},
 {t:'normal',k:'The handover',title:'A crew lead can only run a job site if the standard is written somewhere other than your head.',body:'The morning plan, the customer conversation, the go and no-go calls, the way the site is left. Written down once, it becomes teachable. Held in your head, it becomes another reason you have to be there.'},
 {t:'normal',k:'When it goes wrong',title:'A corrective notice is kinder than a bad mood.',body:'Consistent, professional, written, and the same for everybody. Crews forgive a hard standard. What they do not forgive is a standard that changes depending on who is having a rough week.'},
 {t:'hit',title:'The goal is not being liked. It is being predictable. Predictable is what people stay for.',line:'small'},
 {t:'normal',k:'What changes',title:'Fewer callbacks, fewer surprise resignations, and a Monday you do not have to attend.',body:'Rates stop being argued. Promotions stop being political. And the company can take on the next crew, because you finally know what the next crew costs and what it has to bill.'},

 {t:'normal',k:'Where to take it next',title:'The scale, the checklists, the agreements and the notices already exist as documents.',body:'Tree Service Essentials: Complete Blueprint is the full stack, built from what Ash Tree Enterprises runs on, and it comes with an onboarding call so it lands in your company rather than sitting in a folder.'},
 {t:'cta',title:'Pay it right. Write it down. Keep the crew.',chips:['Tree Service Essentials','Book a coaching call'],brand:true,disc:'Educational content only. No income, retention, or business result is guaranteed. Results vary by company, region and cost base.'},
];

const deck=document.getElementById('deck');
function lineMark(kind){return `<svg class="line ${kind==='big'?'big':'small'}" viewBox="0 0 160 260"><use href="#line"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1>`;
  } else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Grow Your <b>Tree Co.</b> &middot; Sadi Ingallina</div>`;
  }
  if(s.line) h+=lineMark(s.line);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
