<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Right-Sized Business — a masterclass with Shira Gill</title>
<style>
  :root{
    --ground:#eae3dc;   /* Shira Gill brand sand (body bg, extract_brand.js) */
    --panel:#fbf6ef;    /* her warm cream */
    --ink:#3b3735;      /* her dominant espresso, 219 uses */
    --rule:#3b373522;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink)}
  body{
    font-family:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:28px 16px;
  }
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .slide{
    background:var(--ground);
    border-radius:4px;
    padding:64px 64px 60px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide.panel{background:var(--panel)}
  .kicker{
    font-family:"Libre Franklin",sans-serif;
    text-transform:uppercase;letter-spacing:.28em;font-size:12px;font-weight:600;
    color:var(--ink);opacity:.55;margin-bottom:22px;
  }
  h1{font-family:"Reckless","Georgia",serif;font-weight:500;font-size:62px;line-height:1.02;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"Reckless","Georgia",serif;font-weight:500;font-size:40px;line-height:1.08;margin-bottom:20px}
  .lead{font-size:21px;line-height:1.5;max-width:40ch}
  .big{font-family:"Reckless","Georgia",serif;font-size:34px;line-height:1.18;max-width:24ch}
  p{font-size:18px;line-height:1.6;max-width:52ch;margin-top:12px}
  ul{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:14px;max-width:54ch}
  li{font-size:19px;line-height:1.45;padding-left:30px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:1.5px;background:var(--ink)}
  .num{font-family:"Reckless","Georgia",serif;font-size:15px;opacity:.5;position:absolute;top:28px;right:34px;letter-spacing:.05em}
  .pair{font-family:"Reckless","Georgia",serif;font-size:22px;margin-bottom:6px}
  .mark{width:46px;height:2px;background:var(--ink);margin:0 0 26px}
  .credit{font-family:"Libre Franklin",sans-serif;font-size:15px;opacity:.6;margin-top:30px;letter-spacing:.04em}
  .cta .lead{font-size:23px}
  .disclaimer{font-size:13px;opacity:.55;line-height:1.5;max-width:60ch;margin-top:34px}
  .foot{font-family:"Libre Franklin",sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-top:20px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A masterclass with Shira Gill',
   h1:'The Right-Sized Business',
   lead:'How to build a creative business that runs on less, not more.'},

  {t:'who', kicker:'Who this is for', panel:true,
   h2:'You built this for freedom.',
   body:'For founders and creatives a few years in: the ones who left the job, hung the shingle, and somewhere along the way ended up with a business that runs them instead of the other way around.'},

  {t:'reframe', kicker:'The promise',
   big:'By the end of this hour you will know exactly what to cut, what to keep, and what to charge.',
   body:'Not more to do. A shorter, clearer list. That is what an edit gives you, and it is what most business advice never will.'},

  {t:'reframe', kicker:'The trap',
   big:'More offers. More platforms. More hustle. And somehow less room to breathe.',
   body:'Every growth playbook you have been handed says the same thing: scale bigger. So you added the course, the membership, the second service, the third channel. The revenue grew and the calm did not.'},

  {t:'reframe', kicker:'The reframe', panel:true,
   big:'The problem was never that you need to do more. It is that no one taught you to edit.',
   body:'The same method that clears a cluttered home clears a cluttered business. You do not need another tactic. You need to decide what stays.'},

  {t:'part', kicker:'Part one', h2:'The cost of the unedited business',
   body:'A business with no edit looks productive from the outside. Inside it is a closet with everything shoved in: offers nobody buys, clients who drain you, systems held together by you personally being awake.'},

  {t:'content',
   h2:'Three signs you have never edited',
   list:['Your calendar is full but your best work keeps slipping to "someday".',
         'You cannot name your single most profitable offer in one sentence.',
         'If you took two weeks off, the business would quietly stop.']},

  {t:'content',
   h2:'The three kinds of clutter in a business',
   list:['Offer clutter: too many things to sell, none of them sharp.',
         'Client clutter: keeping work that drains more than it pays.',
         'Calendar clutter: a week so full there is no room to think.']},

  {t:'part', kicker:'Part two', panel:true,
   h2:'The method: edit, organize, elevate',
   body:'The same three moves I have used for fifteen years to transform homes, applied to the thing you actually run. In order. You cannot organize or elevate what you have not first edited.'},

  {t:'framework', kicker:'Step one', h2:'Edit',
   body:'Strip the business back to what earns and what matters. Cut the offers that do not sell, the clients who cost more than they pay, the commitments you kept out of guilt. Editing is not loss. It is making room for the work only you can do.'},

  {t:'framework', kicker:'Step two', panel:true, h2:'Organize',
   body:'Give every part of the business a home, the way every object in an organized room has one. Systems, pricing, packages, and process so the business runs on a structure instead of on your constant attention.'},

  {t:'content',
   h2:'What to organize first',
   list:['The offer: one flagship, described in a single clear sentence.',
         'The process: the same path every client walks, written down once.',
         'The week: standing blocks for the work only you can do.']},

  {t:'framework', kicker:'Step three', h2:'Elevate',
   body:'Once it is edited and organized, raise it. Position and price the offer so it reads premium, not just busy. Elevate is where a right-sized business stops competing on volume and starts commanding what it is worth.'},

  {t:'content', panel:true,
   h2:'Pricing is an edit too',
   body:'When the offer is edited down to the thing you do best and organized so it runs cleanly, you can finally price it for what it is worth. Elevating the price is not greed. It is the natural result of removing everything that was watering it down.'},

  {t:'part', kicker:'Part three', panel:true,
   h2:'Perfectly enough beats scale bigger',
   body:'A right-sized business is one built deliberately around your talents, your capacity, and the life you actually want. Not the biggest version. The right one.'},

  {t:'content',
   h2:'What right-sized looks like',
   list:['One flagship offer you can describe in a sentence, priced with confidence.',
         'A week with white space in it, on purpose.',
         'Revenue that holds when you step away, because the structure holds.']},

  {t:'proof', kicker:'Why me', panel:true,
   h2:'I have done this with homes and with businesses.',
   body:'I am Shira Gill, a home-organizing expert and three-time bestselling author with Penguin Random House. My work has been featured from Good Morning America to The Wall Street Journal to Vogue, and I have spent fifteen years helping people edit, organize, and elevate their homes, their time, and their work.',
   credit:'Minimalista · Organized Living · LifeStyled'},

  {t:'content',
   h2:'What changes when you right-size',
   body:'You stop measuring the business by how full it is and start measuring it by how well it serves the life around it. The clutter clears. The best work finally gets the room it needed the whole time.'},

  {t:'content',
   h2:'The one question to sit with',
   big:'If I could only keep one offer, which one would I bet the whole business on?',
   body:'Answer that honestly and the editing begins on its own. Everything that is not that offer is either in service of it or on the list to cut.'},

  {t:'cta', kicker:'Your next step', panel:true,
   h2:'Build yours with me.',
   lead:'If you want expert eyes on your business and a clear plan for what is next, my 8-week 1:1 Mentorship is where we edit, organize, and elevate it together.',
   body:'Apply for the 1:1 Mentorship at shiragill.com.',
   disclaimer:'This masterclass is provided for educational purposes only. It is not a guarantee of any specific business or financial result. Outcomes vary based on your market, your effort, and many factors outside anyone's control.',
   foot:'shiragill.com'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.panel ? ' panel' : '') + (s.t === 'cta' ? ' cta' : '');
  let html = '';
  html += '<span class="num">' + String(i + 1).padStart(2, '0') + ' / ' + S.length + '</span>';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.t === 'title') html += '<div class="mark"></div>';
  if (s.h1) html += '<h1>' + s.h1 + '</h1>';
  if (s.h2) html += '<h2>' + s.h2 + '</h2>';
  if (s.big) html += '<div class="big">' + s.big + '</div>';
  if (s.lead) html += '<p class="lead">' + s.lead + '</p>';
  if (s.body) html += '<p>' + s.body + '</p>';
  if (s.list) { html += '<ul>'; s.list.forEach(x => html += '<li>' + x + '</li>'); html += '</ul>'; }
  if (s.credit) html += '<div class="credit">' + s.credit + '</div>';
  if (s.disclaimer) html += '<div class="disclaimer">' + s.disclaimer + '</div>';
  if (s.foot) html += '<div class="foot">' + s.foot + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
