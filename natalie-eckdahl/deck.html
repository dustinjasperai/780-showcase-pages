<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Retainer-Funded Consulting Business · Natalie Eckdahl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fcf5ee; --panel:#f4e8d8; --rule:#e7d9c7;
    --acc:#e60580; --ink:#1c2742; --body:#3a4258; --dim:#9a8f80;
    --gold:#c59d65; --cream:#fffaf3; --navy:#16163f;
  }
  html,body{height:100%}
  body{background:#f2e8db;font-family:'Hanken Grotesk',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f2e8db}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Hanken Grotesk',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Gilda Display',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.14;letter-spacing:.004em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Hanken Grotesk',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Gilda Display',serif;font-size:2.0vw;color:var(--acc);margin-top:3.6vh;max-width:84%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Hanken Grotesk',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),var(--gold) 60%,transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#242a4a 0%,#16163f 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#242a4a 0%,#16163f 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Hanken Grotesk',sans-serif;color:#e7e0ee;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mo{position:absolute;pointer-events:none}
  .title-mo{right:7.5%;bottom:9%;width:20vw;opacity:.95}
  .corner-mo{right:6.5%;bottom:8%;width:10vw;opacity:.5}
  .brandline{font-family:'Hanken Grotesk',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.04em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(28,39,66,.08);z-index:20}
  .hud > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Biz of Nonprofit Consultants</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a steady recurring baseline with even monthly ticks and a calm rising line (recurring revenue) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 140 90">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="72" x2="130" y2="72" stroke="#c59d65" stroke-width="2" opacity="0.85"/>
    <g stroke="#c59d65" stroke-width="2" opacity="0.6">
      <line x1="22" y1="72" x2="22" y2="66"/><line x1="46" y1="72" x2="46" y2="66"/>
      <line x1="70" y1="72" x2="70" y2="66"/><line x1="94" y1="72" x2="94" y2="66"/>
      <line x1="118" y1="72" x2="118" y2="66"/>
    </g>
    <path d="M14 58 L46 50 L78 40 L110 26 L128 20" stroke="#e60580" stroke-width="2.4" opacity="0.95"/>
    <circle cx="128" cy="20" r="4" fill="#e60580" stroke="none" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Retainer-Funded Consulting Business',sub:'How nonprofit consultants replace feast-or-famine project income with predictable recurring revenue, and lead the business as the CEO.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You are great at the work. Building a business that pays you predictably is the part no one taught you.',body:'You are a nonprofit consultant whose clients get real results, and the referrals do come in. But your income rises and falls with project and grant cycles, and when a big engagement ends the revenue ends with it. Every quarter can feel like starting the pipeline over from zero.'},
 {t:'dark',title:'A full project pipeline this quarter is not the same as a business you can count on next quarter.'},

 {t:'section',idx:'Part One',title:'Why Project Work Keeps You on the Treadmill'},
 {t:'normal',k:'The reset to zero',title:'Project income resets to zero every time you deliver.',body:'A project pays once and then it is over. While you are heads-down delivering, you are not selling, so the next gap is already forming behind the current deadline. The better you are at finishing, the faster you arrive back at an empty calendar and a quiet month.'},
 {t:'normal',k:'The hourly ceiling',title:'Charging by the hour caps what you can earn and quietly rewards being slow.',body:'When you bill by the hour or the day, your income is tied to your time, and there are only so many hours. It also punishes your expertise: the faster and better you get, the less you are paid for the same outcome. Nonprofit budgets are fixed, so the hourly conversation almost always ends in a discount.'},
 {t:'dark',title:'You did not go independent to rebuild your income from scratch every few months.'},

 {t:'section',idx:'Part Two',title:'The Retainer Model'},
 {t:'normal',k:'The Retainer Roadmap',title:'Price on the outcome you create, not the hours you log.',body:'A retainer is built around the results a nonprofit needs all year, the fundraising, the strategy, the steady hand in the room, so the relationship and the revenue continue past a single project. You set the offer and the price on value, and the client buys an ongoing outcome instead of a stack of hours.'},
 {t:'normal',k:'The Automatic Yes Framework',title:'The right clients make the retainer easy to hold.',body:'Recurring revenue only feels safe when you actually want to keep the clients. The Automatic Yes is a clear filter for the fit you say yes to on sight, and the boundary that lets you say no to the rest. The wrong client erodes your rate, crowds your calendar, and is the first reason consultants quietly go back to project work.'},
 {t:'normal',k:'Your Next Best Hire',title:'You cannot scale retainers if every deliverable still runs through you.',body:'Retainers grow the number of clients who depend on you every month, and one person cannot be the whole delivery team for long. Your next best hire takes the work you should not be doing, with the systems that keep the quality yours, so you can carry more retained clients without carrying more hours.'},
 {t:'normal',k:'Lead as the CEO',title:'Run the business on a plan, not on whoever emailed last.',body:'The final shift is out of the doer seat and into the owner seat. That means a simple operating rhythm you actually keep: a pipeline you watch, cashflow you can read, and boundaries that protect the deep work. The retainer model is what buys you the room to lead instead of react.'},
 {t:'dark',title:'A retainer is not a bigger invoice. It is a business that keeps running the month you stop selling.'},

 {t:'section',idx:'Part Three',title:'What Changes When Your Revenue Recurs'},
 {t:'normal',k:'The consultant this builds',title:'Predictable income, chosen clients, and room to think like an owner.',body:'When the base of your revenue recurs, you can forecast the year instead of bracing for it. Your calendar fills with clients you chose on purpose, your rate stops being up for debate, and you finally have the mental space to lead the firm, mentor a team, and grow on your terms.'},
 {t:'dark',title:'The goal was never more projects. It was a business that holds.'},
 {t:'normal',k:'Why Natalie Eckdahl',title:'Twenty-five years in business, a decade coaching owners, now focused entirely on nonprofit consultants.',body:'Natalie is an MBA and business strategist who built BizChix into an award-winning podcast and coaching practice over more than a decade, then went all in on the people she is best at serving. Through The Biz of Nonprofit Consultants and the Impact Collective, she now coaches established nonprofit consultants scaling past six figures. This is the model behind that work.'},

 {t:'section',idx:'Your Next Step',title:'Build the Business Behind the Work'},
 {t:'normal',k:'Keep going with Natalie',title:'The full path, from your first retainer to a business that no longer needs you in every meeting.',body:'The Impact Collective is a year-long mastermind and 1:1 coaching program for established nonprofit consultants: a private CEO library on positioning, pricing, hiring and operations, a room of peers at your level, and Natalie in your corner for the decisions that matter most. Start with the podcast, and apply when you are ready to build the whole thing.'},
 {t:'cta',title:'Ready to build a consulting business funded by retainers?',body:'Take the next step with The Biz of Nonprofit Consultants.',chips:['Listen to the podcast','Apply for the Impact Collective'],disc:'Educational content for nonprofit consultants and business owners. No income or business result is guaranteed. Results vary by consultant, niche, and market.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Biz of Nonprofit <b>Consultants</b> · Natalie Eckdahl</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='title') h+=mo('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
