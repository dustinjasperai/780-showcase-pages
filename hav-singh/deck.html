<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Get Paid to Find Property, Compliantly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffdf7;
    --panel:#f5f9f2;
    --ink:#1b2420;
    --muted:#55605a;
    --rule:#e3e7dd;
    --accent:#2f7d50;
    --display:"Space Grotesk",system-ui,sans-serif;
    --body:"Source Serif 4",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(27,36,32,.03)}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.12;margin-bottom:18px}
  p{font-size:20px;line-height:1.5;color:var(--ink);margin-bottom:14px;max-width:40em}
  .muted{color:var(--muted)}
  .big{font-size:26px;line-height:1.35}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;line-height:1.45;padding:12px 0 12px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .rail{display:flex;gap:10px;margin:8px 0 22px;flex-wrap:wrap}
  .rail span{font-family:var(--display);font-weight:600;font-size:14px;padding:8px 14px;border:1px solid var(--rule);border-radius:999px;color:var(--muted)}
  .rail span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stat{font-family:var(--display);font-weight:700;font-size:56px;color:var(--accent);line-height:1}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;max-width:46em;font-style:italic}
  .foot{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:auto;padding-top:28px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A free live masterclass with Hav Singh',h:'Get Paid to Find Property, Compliantly',p:'How to source and sell your first below-market property deal, the hand-held way, without buying any property yourself.'},
 {t:'who',eyebrow:'Who this is for',h:'You want in on property, but not as a landlord.',p:'You do not have a deposit for a buy-to-let. You do not have a portfolio. What you do have is time, a phone, and the willingness to learn a real skill: finding deals that investors will pay you to bring them.',p2:'This hour is for complete beginners. No experience, no money in the deal, no investor network of your own needed to start.'},
 {t:'trap',eyebrow:'The trap',h:'Most people quit before their first cheque.',p:'They watch a few videos, message a couple of estate agents, get ignored, and decide "sourcing does not work."',p2:'It was never the market. It was that nobody showed them the order of operations, and nobody told them the one thing that gets a sourcer shut down.'},
 {t:'reframe',eyebrow:'The reframe',h:'Sourcing is not a hustle. It is a regulated business.',big:'The people who make this a real income treat it like a profession from day one. The people who treat it like a side-hustle get a cease-and-desist. The difference is compliance, and it is learnable in an afternoon.'},
 {t:'part',eyebrow:'Part one',h:'The core problem',p:'A deal is only worth something if an investor can trust it. Trust comes from two things working together: the numbers being real, and the person packaging them being compliant.'},
 {t:'body',eyebrow:'Part one',h:'Why raw leads are worthless',p:'A cheap flat is not a deal. A deal is a cheap flat that has been checked, stacked and packaged so an investor can say yes in ten minutes.',ul:['An address with no due diligence is a guess','A guess an investor has to re-check themselves is not worth paying for','The fee is paid for the checking and packaging, not the finding']},
 {t:'body',eyebrow:'Part one',h:'The thing nobody warns you about',p:'In the UK you cannot legally sell property deals to the public without being registered: a redress scheme, anti-money-laundering supervision, and client-money handling.',p2:'Skip it and the fee is not just at risk, the business is. This is why most beginners stall. We put it first, not last.'},
 {t:'part',eyebrow:'Part two',h:'The Deal Sourcing Growth System',p:'The method I have used across 600+ deals since 2012, broken into four stages anyone can follow in order.'},
 {t:'rail',eyebrow:'The system',h:'Find to paid, in four stages',rail:['Find','Check','Package','Sell'],active:0,p:'Each stage has a job. Skip one and the deal falls over. Run them in order and a complete beginner can take a lead all the way to a paid fee.'},
 {t:'rail',eyebrow:'Stage one',h:'Find',rail:['Find','Check','Package','Sell'],active:0,p:'Where below-market deals actually come from, and the scripts that get estate agents and vendors to call you back instead of ignoring you. Volume is a system, not luck.'},
 {t:'rail',eyebrow:'Stage two',h:'Check',rail:['Find','Check','Package','Sell'],active:1,p:'The compliance and due-diligence pass: is it legal to sell, do the numbers survive scrutiny, and would you put your own name to it? This is the stage that protects your fee and your licence.'},
 {t:'rail',eyebrow:'Stage three',h:'Package',rail:['Find','Check','Package','Sell'],active:2,p:'Turning a checked deal into a one-page proposition an investor can say yes to fast: the comparables, the strategy, the return, the exit. Packaging is where the fee is earned.'},
 {t:'rail',eyebrow:'Stage four',h:'Sell and get paid',rail:['Find','Check','Package','Sell'],active:3,p:'Matching the packaged deal to an investor who wants exactly that, and collecting the sourcing fee. A typical deal carries a £5,000 fee.'},
 {t:'signature',eyebrow:'The difference',h:'Compliance first, not compliance later',big:'Every other course teaches you to find deals and hopes you sort the legal side out eventually. We flip it. You learn to be a compliant sourcer in the first session, because that is the gate everything else runs through.'},
 {t:'engine',eyebrow:'The hand-held part',h:'You do not sell your first deal alone',p:'You find it. A due-diligence team checks it. The deal is packaged and put in front of a network of 4,000 investors. A progression team manages the solicitors and brokers through to completion.',p2:'You find it, we check it, package it and sell it. That is what hand-held means.'},
 {t:'part',eyebrow:'Part three',h:'The first deal is the one you never forget',p:'The first deal is the hard one. After that it is a repeatable process you already trust, because you have run it once with people beside you.'},
 {t:'stat',eyebrow:'The economics',h:'A typical fee, split fairly',stat:'£2,500',p:'A typical sourcing fee is £5,000, split 50/50 when a deal is sold through the network. Your half is £2,500. The model only pays out when you do.'},
 {t:'why',eyebrow:'Why learn it here',h:'600+ deals. £60m+ sold. Since 2012.',p:'This is not theory from someone who did it once. It is the same system, the same checks and the same investor relationships that have sourced and sold property for over a decade, taught step by step.'},
 {t:'recap',eyebrow:'To recap',h:'The order of operations',ul:['Find deals with a system, not luck','Check them so they are compliant and real','Package them so an investor says yes fast','Sell them to the network and collect your fee']},
 {t:'cta',eyebrow:'Your next step',h:'Come to the live session',p:'I will walk through the Find, Check, Package, Sell system live and take your questions. If it is for you, you can join Hold My Hand Sourcing at the end and be hand-held through your first deal.',cta:'Save your free seat at the next live masterclass',disc:'This masterclass is educational. No income, fee or result is guaranteed. Results vary with your market, your effort and your compliance, and nothing here is financial advice.'},
];
const d=document.getElementById('deck');
function esc(x){return (x||'').toString()}
S.forEach((s,i)=>{
 const el=document.createElement('section');el.className='slide';
 let h='';
 if(s.eyebrow)h+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
 if(s.t==='title'){h+='<h1>'+esc(s.h)+'</h1>';}
 else{h+='<h2>'+esc(s.h)+'</h2>';}
 if(s.rail){h+='<div class="rail">'+s.rail.map((r,idx)=>'<span class="'+(idx===s.active?'on':'')+'">'+esc(r)+'</span>').join('')+'</div>';}
 if(s.stat){h+='<div class="stat">'+esc(s.stat)+'</div>';}
 if(s.big){h+='<p class="big">'+esc(s.big)+'</p>';}
 if(s.p){h+='<p>'+esc(s.p)+'</p>';}
 if(s.p2){h+='<p class="muted">'+esc(s.p2)+'</p>';}
 if(s.ul){h+='<ul>'+s.ul.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';}
 if(s.cta){h+='<p class="big" style="color:var(--accent);font-family:var(--display);font-weight:600;margin-top:16px">'+esc(s.cta)+'</p>';}
 if(s.disc){h+='<p class="disc">'+esc(s.disc)+'</p>';}
 h+='<div class="foot">Hold My Hand Sourcing &middot; Deal Sourcing Growth System</div>';
 el.innerHTML=h;d.appendChild(el);
});
</script>
</body>
</html>
