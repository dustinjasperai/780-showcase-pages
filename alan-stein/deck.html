<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Insider's Path to a Senior Role | Alan Stein, Kadima Careers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6fafe; --panel:#ffffff; --ink:#0d2548; --accent:#fdb913;
    --muted:#55617a; --rule:#dbe3ef;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Nunito Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(13,37,72,.04)}
  .kicker{font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;font-size:14px;color:var(--accent);margin:0 0 18px}
  h1{font-family:"Oswald",sans-serif;font-weight:700;font-size:52px;line-height:1.04;
    margin:0 0 20px;letter-spacing:.005em}
  h2{font-family:"Oswald",sans-serif;font-weight:600;font-size:38px;line-height:1.08;margin:0 0 20px}
  p{font-size:20px;line-height:1.55;margin:0 0 16px;color:var(--ink)}
  p.sub{color:var(--muted);font-size:21px}
  .big{font-size:30px;line-height:1.4;font-weight:600}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 40px;position:relative;
    border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:20px;width:14px;height:14px;
    background:var(--accent);border-radius:3px}
  .step{display:flex;align-items:baseline;gap:18px;margin:0 0 10px}
  .letter{font-family:"Oswald",sans-serif;font-weight:700;font-size:92px;color:var(--accent);
    line-height:.9;min-width:80px}
  .stepname{font-family:"Oswald",sans-serif;font-weight:600;font-size:34px}
  .foot{margin-top:28px;color:var(--muted);font-size:15px}
  .metric{font-family:"Oswald",sans-serif;font-weight:700;font-size:72px;color:var(--ink)}
  .metric .unit{color:var(--accent)}
  .cta-box{border:2px solid var(--accent);border-radius:12px;padding:22px 26px;margin-top:18px;
    font-family:"Oswald",sans-serif;font-weight:600;font-size:24px}
  .title-slide{background:var(--ink);color:#fff;border-color:var(--ink)}
  .title-slide .kicker{color:var(--accent)}
  .title-slide h1{color:#fff}
  .title-slide p.sub{color:#c7d2e6}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;margin-top:22px}
  .pagenum{position:absolute}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title-slide', html:`
    <div class="kicker">A Live Masterclass with Alan Stein &middot; Kadima Careers</div>
    <h1>The Insider's Path to a Senior Role at the World's Best Companies</h1>
    <p class="sub">How experienced professionals get hired at Google, Meta, Salesforce and beyond, taught by someone who spent 30 years on the hiring side.</p>`},

  {t:'promise', html:`
    <div class="kicker">What you'll walk away with</div>
    <h2>In the next 60 minutes</h2>
    <ul>
      <li>Why strong, senior people keep getting passed over, and the one shift that fixes it</li>
      <li>The six-step GROWTH Framework for landing a role that pays what you're worth</li>
      <li>How to negotiate the offer up once it lands, from an ex-Google hiring manager</li>
    </ul>`},

  {t:'who', html:`
    <div class="kicker">Who this is for</div>
    <h2>You've done the work. The search still feels broken.</h2>
    <p>You're experienced. You've shipped real results. Yet the roles you actually want feel out of reach, and the process feels like shouting into a void.</p>
    <p class="big">If you're targeting a senior, high-paying role and the old playbook has stopped working, this hour is for you.</p>`},

  {t:'trap', html:`
    <div class="kicker">The trap</div>
    <h2>The portal is where good applications go to disappear</h2>
    <p>You find the role. You polish the resume. You hit submit. Then silence.</p>
    <p>Most experienced professionals run their entire search through the online application, the one channel built to filter you OUT, not to find you.</p>`},

  {t:'reframe', html:`
    <div class="kicker">The reframe</div>
    <h1>The best jobs are never won on the application portal.</h1>
    <p class="sub">They're won by people the hiring manager already wants to talk to, before the role is even posted.</p>`},

  {t:'part', cls:'title-slide', html:`
    <div class="kicker">Part One</div>
    <h1>Why great people get passed over</h1>`},

  {t:'problem', html:`
    <div class="kicker">The real problem</div>
    <h2>It isn't your skills. It's your signal.</h2>
    <p>Having interviewed more than 2,000 people and hired hundreds, I can tell you the gap is almost never talent.</p>
    <p>It's that strong candidates arrive as a faceless resume in a stack of 400, with no clear goal, no insider relationship, and no plan for the interview or the offer. The system reads that as risk.</p>`},

  {t:'part', cls:'title-slide', html:`
    <div class="kicker">Part Two &middot; The System</div>
    <h1>The GROWTH Framework</h1>
    <p class="sub">Six steps I've used to help professionals land roles at the companies everyone else only applies to.</p>`},

  {t:'g', html:`
    <div class="step"><div class="letter">G</div><div class="stepname">Set your Goals</div></div>
    <p>Before you touch a resume, get specific about the roles, the companies, and the compensation band you're aiming for. A search with a target behind it beats a scattershot one every time.</p>`},

  {t:'r', html:`
    <div class="step"><div class="letter">R</div><div class="stepname">Realistically assess your Strengths</div></div>
    <p>Audit the strengths that actually move hiring decisions and build your narrative around them, instead of a generic resume that tries to say everything and lands on nothing.</p>`},

  {t:'o', html:`
    <div class="step"><div class="letter">O</div><div class="stepname">Build Outreach through relationships</div></div>
    <p>Reach hiring managers directly through a deliberate referral and networking engine. This is how you skip the portal and get seen by a human who can actually say yes.</p>`},

  {t:'w', html:`
    <div class="step"><div class="letter">W</div><div class="stepname">Work the system</div></div>
    <p>Hiring is a system with known rules: applicant tracking, recruiter screens, the interview loop. Once you understand how each stage really works, you stop guessing and start steering.</p>`},

  {t:'tt', html:`
    <div class="step"><div class="letter">T</div><div class="stepname">Training and Tenacity for interviews</div></div>
    <p>High-signal interview preparation, plus the persistence to get through the multi-stage loops at companies like Amazon, Meta and Google. Preparation is what turns nerves into evidence.</p>`},

  {t:'h', html:`
    <div class="step"><div class="letter">H</div><div class="stepname">High-impact Negotiating</div></div>
    <p>The offer is where the biggest gains hide. I'll show you how to negotiate it up the way a hiring manager expects you to, calmly and without burning goodwill. This is where the compensation jumps happen.</p>`},

  {t:'part', cls:'title-slide', html:`
    <div class="kicker">Part Three</div>
    <h1>A GROWTH search, from goal to signed offer</h1>`},

  {t:'result', html:`
    <div class="kicker">The outcome we aim for</div>
    <p>When you run the whole GROWTH Framework instead of just one piece of it, the search gets shorter, the roles get better, and the offer gets bigger.</p>
    <p class="metric">$109,000<span class="unit"> avg</span></p>
    <p class="sub">The average compensation increase our private clients have seen within six months of working together.</p>`},

  {t:'whyme', html:`
    <div class="kicker">Why listen to me</div>
    <h2>I spent 30 years on the other side of the table</h2>
    <ul>
      <li>Nearly three decades of leadership at Google, Meta, Salesforce and American Express</li>
      <li>Google's Manager of the Year, 2016; Columbia Business School MBA</li>
      <li>Interviewed 2,000+ people and hired hundreds, so I know exactly what gets a yes</li>
    </ul>`},

  {t:'recap', html:`
    <div class="kicker">Your path</div>
    <h2>GROWTH, start to offer</h2>
    <ul>
      <li>Goals: aim the whole search</li>
      <li>Realistically assess strengths: build the narrative</li>
      <li>Outreach: reach the hiring manager directly</li>
      <li>Work the system: steer every stage</li>
      <li>Training and Tenacity: win the interview</li>
      <li>High-impact Negotiating: land the offer and raise it</li>
    </ul>`},

  {t:'cta', html:`
    <div class="kicker">Your next step</div>
    <h2>Let's map your path to the role you actually want</h2>
    <p>If you'd like to walk through where you are and where the GROWTH Framework could take you, book a free 25-minute discovery call with me.</p>
    <div class="cta-box">Book a Free 25-Min Discovery Call with Alan &middot; kadimacareers.com</div>
    <p class="disc">Educational content only. No income, role, or result is guaranteed. Results vary based on your experience, effort, market conditions and many factors outside any coach's control. The $109,000 figure is a reported average among private clients and is not a promise of any individual outcome.</p>`}
];

const deck = document.getElementById('deck');
S.forEach(function(s){
  const d = document.createElement('section');
  d.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  d.innerHTML = s.html;
  deck.appendChild(d);
});
</script>
</body>
</html>
