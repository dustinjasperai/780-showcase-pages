<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rural Women Dilemma — A Masterclass with Loshni Manikam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Zilla+Slab:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f5;        /* warm off-white ground — honours her LIGHT site scheme */
    --panel:#ffffff;
    --rule:#e6e3d8;
    --ink:#0a2338;       /* her navy body ink */
    --muted:#55636f;     /* her slate */
    --accent:#2e266d;    /* her dominant brand indigo (68 uses) — the one accent */
    --sage:#b7d9c0;      /* her footer sage — a quiet pasture cue */
    --display:'Zilla Slab',Georgia,serif;
    --text:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--text)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(10,35,56,.04)}
  .kicker{font-family:var(--text);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.1;letter-spacing:-.02em}
  h2{font-family:var(--display);font-weight:700;font-size:33px;line-height:1.16;margin-bottom:18px;letter-spacing:-.01em}
  h3{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2;margin-bottom:8px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:62ch;margin-bottom:14px}
  .lead{font-size:21px;color:var(--muted)}
  .sub{font-size:19px;color:var(--muted);margin-top:14px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:18px;line-height:1.55;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:3px;background:var(--sage)}
  li b{color:var(--accent)}
  .num{font-family:var(--display);font-size:15px;color:var(--muted);margin-bottom:10px}
  .pill{display:inline-block;background:var(--sage);color:var(--accent);font-weight:600;
    font-size:13px;padding:6px 14px;border-radius:999px;margin-bottom:20px;letter-spacing:.04em}
  .foot{margin-top:28px;font-size:14px;color:var(--muted)}
  .title-slide{background:linear-gradient(180deg,#ffffff 0%,#f4f6f1 100%);border-color:var(--rule)}
  .title-slide h1{font-size:52px}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .big{font-family:var(--display);font-size:40px;color:var(--accent);line-height:1.15;margin-bottom:10px}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:34px}.title-slide h1{font-size:38px}h2{font-size:27px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title'},
 {t:'whofor'},
 {t:'trap'},
 {t:'reframe'},
 {t:'part',n:'Part One',h:'Why wanting more feels impossible'},
 {t:'problem'},
 {t:'cost'},
 {t:'part',n:'Part Two',h:'The ACT Process: thriving on purpose'},
 {t:'act'},
 {t:'pillar1'},
 {t:'pillar2'},
 {t:'pillar3'},
 {t:'part',n:'Part Three',h:'What the first step actually looks like'},
 {t:'signs'},
 {t:'firststep'},
 {t:'picture'},
 {t:'whyme'},
 {t:'cta',disc:'This masterclass is for education and support only. It is coaching, not counselling or therapy, and it is not a substitute for professional medical or mental health care. No income or result is guaranteed. Results vary from person to person and every situation is different.'}
];

const R={
 title:()=>`<section class="slide title-slide">
   <div class="pill">A live masterclass with Loshni Manikam</div>
   <h1>The Rural Women Dilemma</h1>
   <p class="lead">How to do more for you, without risking your family or your farm.</p>
   <p class="foot">Thriving Farming Women &middot; Fonterra Dairy Woman of the Year 2018</p>
 </section>`,

 whofor:()=>`<section class="slide">
   <div class="kicker">Who this is for</div>
   <h2>You love your family, your farm and your life. And you still want more.</h2>
   <p>This hour is for the farming woman who does everything for everyone, yet quietly
   dreams of something that is just hers. If you have ever felt greedy or guilty for
   wanting more when you already have so much, you are in the right room.</p>
   <p class="sub">You are not alone. So many farming women feel exactly the same.</p>
 </section>`,

 trap:()=>`<section class="slide">
   <div class="kicker">The trap</div>
   <h2>"I should just be grateful."</h2>
   <ul>
     <li>Doing everything for everyone and everything else, with little left for you.</li>
     <li>No real idea what you want anymore, after years of putting the family and farm first.</li>
     <li>Feeling selfish for even asking the question.</li>
     <li>Starting to resent the people you love most, because you are not happy.</li>
   </ul>
   <p class="sub">The trap is not that you want more. The trap is believing you have to choose.</p>
 </section>`,

 reframe:()=>`<section class="slide">
   <div class="kicker">The reframe</div>
   <p class="big">Waiting until you hit the wall is the most expensive plan of all.</p>
   <p>Most of us wait until we are at the top of the cliff before we do anything. Thriving
   is not what you do after a crisis. It is what keeps the crisis from ever arriving, for
   you and for everyone who depends on you.</p>
 </section>`,

 part:(s)=>`<section class="slide">
   <div class="num">${s.n}</div>
   <h1>${s.h}</h1>
 </section>`,

 problem:()=>`<section class="slide">
   <div class="kicker">The real problem</div>
   <h2>No one ever taught you HOW.</h2>
   <p>You have been told to look after yourself, to find balance, to fill your own cup. But
   nobody ever gave you a clear, step-by-step way to actually do it inside a real farming
   life, with the kids, the seasons, the workload and the guilt.</p>
   <p class="sub">So you try, you run out of road, and you give up. That is not a willpower
   problem. It is a missing process.</p>
 </section>`,

 cost:()=>`<section class="slide">
   <div class="kicker">What it costs</div>
   <h2>When you are not thriving, everyone feels it.</h2>
   <p>The short fuse. The flat days. The slow drift away from the woman you want to be for
   your partner and your children. The farm is a demanding business, and it runs best when
   the people in it are well, not just busy.</p>
   <p class="sub">When you thrive, everybody around you benefits. That is not selfish. That
   is leadership.</p>
 </section>`,

 act:()=>`<section class="slide">
   <div class="kicker">The method</div>
   <h2>The ACT Process</h2>
   <p>This is the step-by-step process I teach farming women so they can finally do the
   things that help them thrive, at their own pace, without blowing up family or farm.
   We work it one pillar at a time.</p>
   <ul>
     <li><b>Clarity</b> first: name what makes you thrive, and what gets in the way.</li>
     <li><b>Care</b> next: look after your whole wellbeing before a crisis forces it.</li>
     <li><b>Identity</b> underneath it all: reconnect with who you are beyond the roles.</li>
   </ul>
 </section>`,

 pillar1:()=>`<section class="slide">
   <div class="kicker">Pillar one</div>
   <h3>Clarity-Building</h3>
   <h2>Decide what a thriving life actually means for YOU.</h2>
   <p>Before anything changes, we get honest about two questions: what is it that makes you
   thrive, and what are the obstacles that keep getting in the way? Your definition of a
   successful life is yours to write. Not your mother's, not the district's, yours.</p>
 </section>`,

 pillar2:()=>`<section class="slide">
   <div class="kicker">Pillar two</div>
   <h3>Full Wellness Focus</h3>
   <h2>Look after yourself on purpose, before the cliff.</h2>
   <p>We build wellbeing across the whole of your life, your body, your mind, your
   relationships and your role on the farm, while things are still good. Proactive, not
   reactive. A couple of hours that are completely yours each week is not a luxury. It is
   maintenance on the most important asset the farm has.</p>
 </section>`,

 pillar3:()=>`<section class="slide">
   <div class="kicker">Pillar three</div>
   <h3>Identity Rediscovery</h3>
   <h2>Find the woman underneath the roles.</h2>
   <p>After a decade of being mum, wife and farming partner, it is easy to lose track of who
   you are. We reconnect you with your own passions, your own goals and your own voice, so
   you can be the loving, supportive woman you want to be, without disappearing inside the
   job.</p>
 </section>`,

 signs:()=>`<section class="slide">
   <div class="kicker">A quick self-check</div>
   <h2>The 10 Signs of Struggle</h2>
   <p>In The Rural Women Dilemma I walk through ten signs that tell you it is time to do
   something for yourself. Tonight we will look at the ones that matter most.</p>
   <ul>
     <li>You feel stuck, frustrated or quietly resentful.</li>
     <li>You cannot remember the last thing you did purely for you.</li>
     <li>You feel guilty the moment you even think about it.</li>
     <li>You have no idea what you actually want anymore.</li>
   </ul>
   <p class="sub">If you nodded at even one, you are not broken. You are ready.</p>
 </section>`,

 firststep:()=>`<section class="slide">
   <div class="kicker">The first step</div>
   <h2>The critical first step out of the cycle.</h2>
   <p>You do not need to change your whole life this week. You need one clear first step,
   taken with a little support and accountability so you do not quietly give up again. That
   is where the work begins, and it is smaller than you think.</p>
   <p class="sub">This life is not a dress rehearsal. This is it. So why not give it your
   best shot?</p>
 </section>`,

 picture:()=>`<section class="slide">
   <div class="kicker">A week with room for you</div>
   <h2>A life you love, and a farm that is better for it.</h2>
   <ul>
     <li>Reading a book, undisturbed. A coffee with a friend. A weekend off-farm.</li>
     <li>Knowing what you want, and having a process to move toward it at your pace.</li>
     <li>Being the happy, patient, supportive woman you want to be, most of the time.</li>
     <li>A tribe of farming women on the same journey, so you never do it alone.</li>
   </ul>
 </section>`,

 whyme:()=>`<section class="slide">
   <div class="kicker">Why me</div>
   <h2>I have lived this dilemma.</h2>
   <p>I am a mum, a wife and a farming partner. Eleven years ago I was lost, stuck and
   guilty for wanting more. I went on a long personal development journey, trained as a
   coach and facilitator, and have spent the last eight years helping farming women thrive.
   In 2018 I was named Fonterra Dairy Woman of the Year for this work.</p>
   <p class="sub">I built the process I wish someone had handed me back then.</p>
 </section>`,

 cta:(s)=>`<section class="slide title-slide">
   <div class="pill">Your next step</div>
   <h1>Ready to take your first step?</h1>
   <p class="lead">If tonight resonated, let's talk about what thriving could look like for
   you. Book a one-on-one coaching conversation with me, or join the Thrive Tribe waitlist
   to be first in when the doors open.</p>
   <p class="foot">Thriving Farming Women &middot; thrivingfarmingwomen.com</p>
   <p class="disc">${s.disc}</p>
 </section>`
};

document.getElementById('deck').innerHTML = S.map(s=>R[s.t](s)).join('');
</script>
</body>
</html>
