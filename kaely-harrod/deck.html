<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 Steps to a Successful and Sustainable Doula Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ecf4f1;        /* soft teal-tinted white, derived from her teal #108e88 / mint #b9f5d8 (light-scheme brand) */
    --panel:#ffffff;
    --rule:#e7e2db;
    --ink:#2a2f31;
    --muted:#6b6f70;
    --accent:#108e88;    /* Kaely's dominant teal (brand.json, 95 uses) */
    --accent2:#f49097;   /* her coral, used sparingly */
    --display:'Oswald',sans-serif;
    --body:'Alegreya Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 56px;margin:0 0 26px;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .horizon{height:3px;width:74px;background:var(--accent);border-radius:3px;margin:0 0 22px}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 16px}
  h1{font-family:var(--display);font-weight:700;font-size:48px;line-height:1.06;letter-spacing:.5px;margin:0 0 18px}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1;margin:0 0 16px}
  .lede{font-size:21px;line-height:1.5;color:var(--ink);max-width:62ch}
  .muted{color:var(--muted)}
  p{font-size:19px;line-height:1.55;max-width:64ch;margin:0 0 14px}
  ul{list-style:none;margin:10px 0 0;padding:0;max-width:66ch}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:4px;top:21px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .step-no{font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent2);letter-spacing:.14em;text-transform:uppercase}
  .big{font-size:56px}
  .foot{position:absolute;left:56px;bottom:22px;font-family:var(--display);font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .pageno{position:absolute;right:56px;bottom:22px;font-family:var(--display);font-size:12px;color:var(--muted)}
  .title-wrap h1{font-size:60px}
  .present{margin-top:20px;font-size:18px;color:var(--muted)}
  .disc{font-size:14px;line-height:1.5;color:var(--muted);max-width:70ch;margin-top:22px;border-top:1px solid var(--rule);padding-top:16px}
  .cta-line{font-family:var(--display);font-weight:600;font-size:22px;color:var(--accent);margin-top:10px}
  @media(max-width:640px){
    .slide{padding:34px 24px;min-height:360px}
    h1,.title-wrap h1{font-size:36px}.big{font-size:40px}h2{font-size:27px}
    .foot,.pageno{left:24px;right:24px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND="Harrod Doula Services";
const S=[
  {t:'title',eyebrow:'Free live masterclass',h:'3 Steps to a Successful and Sustainable Doula Business',
   lede:'How to build a doula business that pays you well and that you can actually keep doing, without burning out by year two.',
   present:'Live with Kaely Harrod, Harrod Doula Services'},

  {t:'promise',eyebrow:'What you will leave with',h:'A business you can sustain',
   body:'By the end of this hour you will know exactly what to fix first so your doula work supports your life instead of swallowing it.',
   list:['A clear picture of why more births has not fixed your income','The three moves that make a doula business sustainable','Your own next 90 days, planned around your life first']},

  {t:'who',eyebrow:'Who this is for',h:'The doula who is good at the work and tired of the math',
   body:'You love supporting families. You are booking births. And still the numbers feel tight and the on-call life is wearing you down. This is for you.',
   list:['You are a working doula, not just thinking about it','You are booking clients but not keeping enough of the money','You have wondered, quietly, how long you can keep this pace']},

  {t:'hook',eyebrow:'The honest part',h:'More births will not save you',
   lede:'The doula who burns out is almost never the one with too few clients. She is the one with too many, priced too low, on-call all the time. Volume is the trap. Structure is the way out.'},

  {t:'part',eyebrow:'Part one',h:'The core problem',
   body:'Most doula businesses are built by saying yes. Yes to every birth, every price, every last-minute ask. It feels like growth. It is actually the fastest road to quitting.'},

  {t:'problem',eyebrow:'The real math',h:'Underpriced, over-committed, unsustainable',
   list:['Packages priced for hours, not for the on-call life they really cost','Every new client stacked on top, with no ceiling and no recovery','A calendar that fills before the income does','So the only lever left feels like take on even more']},

  {t:'part',eyebrow:'Part two',h:'The 3 steps',
   body:'This is the framework I teach doulas inside the Doula Biz Blueprint. Three steps, in order. Skip one and the business stays fragile.'},

  {t:'step',no:'Step one',h:'Build your business',
   body:'Set the foundation that lets everything else hold: your offer, your boundaries, and the simple systems that stop every booking from being built from scratch.',
   list:['Decide what you actually sell, and to whom','Boundaries that protect your on-call life before clients test them','Systems so the admin stops eating your evenings']},

  {t:'step',no:'Step two',h:'Getting clients and packages right',
   body:'This is where sustainability is won or lost. Packages are not a price list. They are the promise that this work can pay you for a decade.',
   list:['Price for the on-call reality, not the visible hours','Build packages that pay, so you need fewer clients, not more','Charge what the work is worth, without scaring the right clients off']},

  {t:'step',no:'Step three',h:'Avoiding burnout',
   body:'The part nobody plans for and everybody needs. A pace you can keep, so you are still doing this, and still loving it, years from now.',
   list:['A workload with a ceiling you set on purpose','Recovery built into the calendar, not borrowed from your family','Enough margin that one hard month does not end the business']},

  {t:'idea',eyebrow:'The idea underneath all three',h:'Sustainable: sustained, supported, upheld',
   lede:'A sustainable doula business is one that holds you up instead of wearing you down. Every one of the three steps exists to make the business able to be sustained, by you, for the long run.'},

  {t:'idea',eyebrow:'How I plan it',h:'Start with your life, not your goals',
   body:'Most business plans start with a revenue number and then ask you to bend your life around it. We do it the other way. Name the life you want first, then build the doula business that fits inside it. That order is the whole difference.'},

  {t:'part',eyebrow:'Part three',h:'What a sustainable practice looks like',
   body:'Here is what changes when the three steps are in place and the business is built to last.'},

  {t:'picture',eyebrow:'A sustainable week',h:'On-call, not overrun',
   list:['Fewer clients, each one paying what the work is worth','Space between births instead of a wall of them','Packages that sell themselves because they are clear','Evenings and weekends that still belong to you']},

  {t:'why',eyebrow:'Why listen to me',h:'I have built the business I am describing',
   body:'I am Kaely Harrod. I have supported families in the perinatal space for over 12 years and built a thriving doula business out of the same three steps I just walked you through. I teach them every week on the Doula Tips and Tits podcast and inside my coaching, because I did not want another good doula to quit over something fixable.'},

  {t:'invite',eyebrow:'Your invitation',h:'Keep going with me',
   body:'If today named something you have been feeling, there is a clear next step. Inside my coaching we take your business through all three steps, in order, with the packages and the pacing built for your life.',
   cta:'Bring your business to the Doula Biz Blueprint and coaching',
   disc:'This masterclass is for education only. It is not a guarantee of income or business results. Outcomes depend on your own work, market, and circumstances.'},

  {t:'cta',eyebrow:'Your next step',h:'Build a doula business you can keep',
   body:'Join me inside the Doula Biz Blueprint and coaching, and let us make your business sustainable, step by step.',
   cta:'Save your seat and work with Kaely',
   disc:'Educational content only. No income or results are promised or guaranteed. Every doula business is different and your results will be your own.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='title'?' title-wrap':'');
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.no) h+=`<div class="step-no">${s.no}</div>`;
  h+='<div class="horizon"></div>';
  if(s.h) h+= (s.t==='title'||s.t==='hook'||s.t==='idea') ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`;
  if(s.lede) h+=`<p class="lede">${s.lede}</p>`;
  if(s.body) h+=`<p>${s.body}</p>`;
  if(s.list){h+='<ul>';s.list.forEach(x=>h+=`<li>${x}</li>`);h+='</ul>';}
  if(s.present) h+=`<div class="present">${s.present}</div>`;
  if(s.cta) h+=`<div class="cta-line">${s.cta}</div>`;
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  h+=`<div class="foot">${BRAND}</div><div class="pageno">${i+1} / ${S.length}</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
