<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reality By Divine Design — a live masterclass with Alysa Rushton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7fb; --panel:#ffffff; --rule:#ece3ec;
    --accent:#c12e92; --plum:#893b6e; --ink:#2e2535; --muted:#6c6270;
    --display:'Raleway',system-ui,sans-serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:0 0 26px;min-height:460px;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 18px 46px -34px rgba(137,59,110,.45);
  }
  .glow{position:absolute;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(193,46,146,.16),rgba(193,46,146,0) 70%);
    top:-120px;right:-80px;pointer-events:none}
  .num{position:absolute;top:26px;right:34px;font-family:var(--display);font-weight:900;
    font-size:54px;color:var(--rule);line-height:1}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:900;font-size:50px;line-height:1.05;color:var(--ink);margin-bottom:18px}
  h2{font-family:var(--display);font-weight:900;font-size:34px;line-height:1.12;color:var(--ink);margin-bottom:16px}
  .sub{font-size:19px;color:var(--muted);max-width:40ch}
  p.lead{font-size:18px;color:var(--ink);max-width:54ch;margin-top:6px}
  ul{list-style:none;margin-top:14px;max-width:58ch}
  li{position:relative;padding-left:26px;margin-bottom:13px;font-size:17px;color:var(--ink)}
  li:before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:50%;
    background:var(--accent)}
  .pill{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;
    color:var(--plum);background:rgba(137,59,110,.10);border-radius:999px;padding:6px 14px;margin-bottom:20px}
  .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1.1;color:var(--plum);max-width:22ch}
  .el{border-left:3px solid var(--accent);padding-left:18px;margin:10px 0}
  .el h3{font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink)}
  .el p{font-size:16px;color:var(--muted)}
  .cta h2{color:var(--accent)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.45}
  .title-slide{align-items:flex-start}
  .title-slide h1{font-size:62px}
  .hashtag{font-family:var(--display);font-weight:900;color:var(--accent)}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<footer>Reality By Divine Design &middot; a live masterclass with Alysa Rushton</footer>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Alysa Rushton',h:'Reality By Divine Design',sub:'The energy-first path to manifesting the life you actually came here for.'},
  {t:'who',eyebrow:'Who this is for',h:'You have done all the work.',lead:"The vision board is on the wall. You journal. You affirm. You have read the books and watched the trainings. And still, something feels flat, stuck, or quietly empty.",},
  {t:'trap',eyebrow:'The trap',h:'Doing more mindset work on an empty field.',lead:"When manifesting does not land, almost everyone reaches for the same fix: think harder, want it more, believe better. So you pile more effort onto a field that was never the problem."},
  {t:'reframe',eyebrow:'The reframe',big:'Manifestation was never a thinking problem. It is an energy event.'},
  {t:'part',pill:'Part One',h:'You cannot create from a blocked field.',lead:"Your energy is the medium everything you want has to travel through. When it is dense, scattered, or running on other people, mindset work just decorates the surface. Nothing moves."},
  {t:'point',eyebrow:'The missing variable',h:'Energy is the part no one taught you to work with.',lead:"Most manifestation teaching stops at the mind. The step underneath it, clearing and activating your own energy, is the step that makes the rest actually work."},
  {t:'principle',eyebrow:'The principle',h:'#LitFromWithin',lead:"Being so filled up with your own divine light that you stop reaching outside yourself to feel whole. From there, you are not chasing a reality. You are radiating one."},
  {t:'part',pill:'Part Two',h:'Reality By Divine Design, the method.',lead:"A repeatable way to clear what is blocking you and activate your own light, built from four moving parts that stack in every activation."},
  {t:'el',eyebrow:'Element one',title:'Channeled training',body:'The teaching for the shift, delivered as transmission, not just information, so it lands at the level it needs to.'},
  {t:'el',eyebrow:'Element two',title:'SoundBath',body:'Crystal-bowl sound used to clear the dense, stuck energy that talking and thinking cannot reach.'},
  {t:'el',eyebrow:'Element three',title:'Experiential activation',body:'A guided exercise where you feel your own light come back online, in your body, in real time.'},
  {t:'el',eyebrow:'Element four',title:'Integration and attunement',body:'Anchoring the new frequency so it holds after the session ends, instead of fading by the weekend.'},
  {t:'how',eyebrow:'How it works',h:'Clear, then activate, then create.',lead:"Each activation runs the same arc: clear the block, come back online, and create from a full field. Stacked over time, your baseline moves, and so does what you can hold."},
  {t:'part',pill:'Part Three',h:'Life, lit from within.',lead:"Not a one-time high. A steady way of living where you are sourced from the inside, your decisions get clearer, and the things you want start meeting you halfway."},
  {t:'me',eyebrow:'Why me',h:'Alysa Rushton',lead:"Energy intuitive, ascension guide, and retreat host. I teach Conscious Life Creation and Divine Self Activation, and I train others in this work through the Divine Light Energy Healers Academy. I am not a guru. I help you remember your own power."},
  {t:'paths',eyebrow:'Two ways to go deeper',h:'Where to go from here.',lead:"If this is your path, there are two doors.",items:['Reality By Divine Design: the full energy-activation series, to practice this for yourself.','The Divine Light Energy Healers Academy: certification, for those called to do this work for others.']},
  {t:'cta',eyebrow:'Your next step',h:'Create your reality by design.',lead:"If something in you recognized this, that is the signal. Choose your door and begin.",disclaimer:'This masterclass is for educational and personal-development purposes only. It is not medical, psychological, or financial advice, and it is not a substitute for professional care. No specific outcome, result, or income is promised or guaranteed; individual experiences vary.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'')+(s.t==='title'?' title-slide':'');
  let html='<span class="glow"></span><span class="num">'+String(i+1).padStart(2,'0')+'</span>';
  if(s.pill) html+='<span class="pill">'+s.pill+'</span>';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.big){ html+='<div class="big">'+s.big+'</div>'; }
  if(s.h){ const tag=(s.t==='title')?'h1':'h2'; html+='<'+tag+'>'+(s.h.replace('#LitFromWithin','<span class=\"hashtag\">#LitFromWithin</span>'))+'</'+tag+'>'; }
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
  if(s.title){ html+='<div class="el"><h3>'+s.title+'</h3><p>'+s.body+'</p></div>'; }
  if(s.items){ html+='<ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(s.disclaimer) html+='<div class="disclaimer">'+s.disclaimer+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
