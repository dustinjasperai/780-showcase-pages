<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Six-Figure Designer: a live masterclass with Öykün Yılmaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3;
    --ink:#20242a;
    --accent:#3c434c;
    --panel:#ecebe7;
    --muted:#6b6f75;
    --rule:#d7d5ce;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--panel);
    color:var(--ink);
    font-family:"Spline Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    position:relative;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:4px;
    aspect-ratio:16/9;
    margin:0 0 22px;
    padding:60px 64px;
    display:flex;flex-direction:column;justify-content:center;
    overflow:hidden;
  }
  .kicker{
    font-family:"Bricolage Grotesque",sans-serif;
    font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px;
    display:flex;align-items:center;gap:12px;
  }
  .kicker::before{content:"";width:34px;height:2px;background:var(--accent);display:inline-block}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:58px;line-height:1.02;letter-spacing:-.02em;margin-bottom:18px}
  h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:40px;line-height:1.06;letter-spacing:-.015em;margin-bottom:16px}
  .lede{font-size:21px;line-height:1.5;color:var(--muted);max-width:40ch}
  .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:150px;line-height:.9;color:var(--accent);opacity:.12;position:absolute;right:40px;bottom:-14px}
  .part{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  ul{list-style:none;margin-top:10px}
  li{font-size:22px;line-height:1.35;padding:14px 0;border-top:1px solid var(--rule);display:flex;gap:16px;align-items:baseline}
  li:last-child{border-bottom:1px solid var(--rule)}
  li .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--accent);font-size:16px;min-width:26px}
  .quote{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:44px;line-height:1.08;letter-spacing:-.015em;max-width:20ch}
  .note{font-size:15px;color:var(--muted);margin-top:26px;max-width:52ch;line-height:1.5}
  .pillar{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .foot{position:absolute;left:64px;bottom:26px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .page{position:absolute;right:64px;bottom:26px;font-size:12px;color:var(--muted);font-family:"Bricolage Grotesque",sans-serif}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .cta-step{font-size:24px;line-height:1.4;margin-top:8px}
  @media(max-width:720px){
    .slide{padding:34px 30px}
    h1{font-size:38px}h2{font-size:28px}.quote{font-size:30px}.big{font-size:90px}
    .foot,.page{left:30px;right:30px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:"Designer Mindset · A live masterclass with Öykün Yılmaz",
    h:"The Six-Figure Designer",
    lede:"Why your best work isn't paying you yet, and the skills that change it."},

  {t:'list',
    kicker:"What you'll leave with",
    h:"In the next hour",
    list:[
      "Why great design skill stopped being what pays",
      "The three skills that actually move your income",
      "A way to price on value instead of hours",
      "A simple habit that ends the feast and famine cycle"]},

  {t:'lede',
    kicker:"Who this is for",
    h:"You're good. You're just underpaid.",
    lede:"This is for the designer whose work is genuinely strong and whose income does not reflect it yet. If you are still learning the craft, come back later. This is the next problem."},

  {t:'quote',
    kicker:"The trap",
    q:"Amazing designers struggle to get by while average designers earn $100k, $500k, a million a year.",
    note:"The difference between them is almost never talent. It is a set of skills nobody taught you in design."},

  {t:'quote',
    kicker:"The hard truth",
    q:"Your Figma skills got you this far. They won't take you the rest of the way.",
    note:"Not because the craft stops mattering. Because the craft was never the thing standing between you and the income you want."},

  {t:'part', part:"Part One", h:"Why skill stopped paying",
    lede:"The bottleneck moved, and most designers are still pushing on the wrong one."},

  {t:'lede',
    kicker:"The real bottleneck",
    h:"The work is not the problem",
    lede:"You keep investing in better craft because craft is what got rewarded in school and on dribbble. But clients do not pay for pixels. They pay for judgment, trust, and the confidence that you will solve their problem. Those are different skills, and they are learnable."},

  {t:'lede',
    kicker:"Why now",
    h:"AI is commoditizing execution",
    lede:"As tools do more of the pushing and nudging, the part of the job that stays valuable is the human part: understanding the problem, making the call, and getting someone to say yes. The designers who thrive sell that, not the hours."},

  {t:'part', part:"Part Two", h:"The Designer Mindset method",
    lede:"Three skills. Learnable. They compound."},

  {t:'pillar',
    pillar:"Skill One",
    h:"Charge more, on value",
    lede:"Stop quoting hours. Price the outcome your client actually buys. The same project, framed around the result, is worth multiples of the same project framed around your time. Most of your raise is hiding in how you talk about the work."},

  {t:'pillar',
    pillar:"Skill Two",
    h:"Zero client days",
    lede:"The cycle that keeps you broke: you chase work when idle, land a client, then stop talking to everyone else until the project ends and you panic again. The fix is one habit. You are always available. You are always talking to someone new. Today's conversation becomes next quarter's client."},

  {t:'pillar',
    pillar:"Skill Three",
    h:"The human skills",
    lede:"Communication, negotiation, confidence, leadership. The skills that let you lead a client instead of taking orders, hold your price without flinching, and be the person in the room they trust with the decision."},

  {t:'lede',
    kicker:"How they fit",
    h:"One reinforces the next",
    lede:"Confidence lets you charge more. Charging more buys you the room to never go quiet on new conversations. A full calendar of conversations means you never negotiate from fear. The three are a loop, not a list."},

  {t:'part', part:"Part Three", h:"The method in a real week",
    lede:"Not theory. A week, a conversation, a price held."},

  {t:'list',
    kicker:"Zero client days, lived",
    h:"A week that ends the panic",
    list:[
      "One message to someone new, every working day",
      "One piece of your thinking, shared regularly",
      "Connections kept warm even while fully booked",
      "A calendar that never empties, so you never price from fear"]},

  {t:'quote',
    kicker:"The pricing conversation",
    q:"Can you do it cheaper?",
    note:"The answer that keeps the client and the price: your number reflects the outcome, not the hours. Said with confidence, it moves the conversation from cost to value. That sentence is a skill, and you can practice it."},

  {t:'lede',
    kicker:"Why me",
    h:"I have run this from both sides",
    lede:"25 years as a designer and ex-developer, work in the App Store, TechCrunch, and The Sunday Times, clients from Adobe to Turkcell, and millions earned solo and inside an agency. Designer Mindset is now over 1,000 designers building a business from their skills, together."},

  {t:'list',
    kicker:"Recap",
    h:"The three that change your income",
    list:[
      "Charge more, priced on value",
      "Zero client days, so you never go quiet",
      "The human skills AI cannot do for you"]},

  {t:'cta',
    kicker:"Your next step",
    h:"Keep going with Designer Mindset",
    step:"Join the free tier, sit in the live sessions, and when you're ready, step into the Six-Figure Designer programme.",
    disc:"Educational only. No income or specific result is guaranteed. Results vary by person, market, and effort."}
];

function esc(x){return (x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.part) inner+=`<div class="part">${esc(s.part)}</div>`;
  if(s.pillar) inner+=`<div class="pillar">${esc(s.pillar)}</div>`;
  if(s.h) inner+= s.t==='title' ? `<h1>${esc(s.h)}</h1>` : `<h2>${esc(s.h)}</h2>`;
  if(s.q) inner+=`<div class="quote">${esc(s.q)}</div>`;
  if(s.lede) inner+=`<p class="lede">${esc(s.lede)}</p>`;
  if(s.list){inner+='<ul>';s.list.forEach((li,n)=>{inner+=`<li><span class="n">${n+1}</span><span>${esc(li)}</span></li>`});inner+='</ul>'}
  if(s.note) inner+=`<p class="note">${esc(s.note)}</p>`;
  if(s.step) inner+=`<p class="cta-step">${esc(s.step)}</p>`;
  if(s.disc) inner+=`<p class="disc">${esc(s.disc)}</p>`;
  if(s.part||s.t==='title') inner+=`<div class="big">${String(i+1).padStart(2,'0')}</div>`;
  inner+=`<div class="foot">Designer Mindset</div><div class="page">${i+1} / ${S.length}</div>`;
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
