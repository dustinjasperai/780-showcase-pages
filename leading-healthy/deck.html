<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 5 Distinctives of a Healthy Leader | Leading Healthy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Mulish:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#343855;        /* their dominant navy (brand.json) */
    --panel:#2b2e47;     /* deeper navy derived from ground */
    --ink:#edeef0;        /* their pale grey */
    --ink-soft:#c5c8d6;
    --ink-muted:#8d91a8;
    --accent:#fccb0a;     /* their gold (brand.json) */
    --rule:#474b68;
  }
  html,body{height:100%;}
  body{ background:var(--bg); color:var(--ink); font-family:'Mulish',system-ui,sans-serif; font-weight:300; overflow:hidden; }
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .slide{ display:none; width:min(1040px,92vw); max-height:92vh; padding:64px 72px; }
  .slide.active{ display:block; animation:fade .4s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .eyebrow{ font-family:'Cabin',sans-serif; font-weight:600; font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin-bottom:26px; }
  h1{ font-family:'Cabin',sans-serif; font-weight:700; font-size:54px; line-height:1.08; letter-spacing:-.01em; margin-bottom:22px; }
  h2{ font-family:'Cabin',sans-serif; font-weight:700; font-size:40px; line-height:1.12; letter-spacing:-.01em; margin-bottom:22px; }
  h3{ font-family:'Cabin',sans-serif; font-weight:600; font-size:26px; line-height:1.2; margin-bottom:14px; }
  p{ font-size:21px; line-height:1.6; color:var(--ink-soft); max-width:40ch; margin-bottom:16px; }
  p.lead{ font-size:24px; color:var(--ink); max-width:34ch; }
  .big{ font-family:'Cabin',sans-serif; font-weight:700; font-size:46px; line-height:1.15; letter-spacing:-.01em; max-width:20ch; }
  .accent{ color:var(--accent); }
  .meta{ margin-top:40px; font-family:'Cabin',sans-serif; font-weight:500; font-size:16px; color:var(--ink-muted); letter-spacing:.02em; }
  .kicker{ font-family:'Cabin',sans-serif; font-weight:600; font-size:120px; line-height:1; color:var(--panel); -webkit-text-stroke:1px var(--accent); margin-bottom:8px; }
  ul{ list-style:none; max-width:46ch; }
  li{ font-size:20px; line-height:1.5; color:var(--ink-soft); padding:14px 0 14px 28px; border-bottom:1px solid var(--rule); position:relative; }
  li::before{ content:""; position:absolute; left:0; top:24px; width:10px; height:10px; background:var(--accent); border-radius:2px; }
  li:last-child{ border-bottom:none; }
  li b{ color:var(--ink); font-family:'Cabin',sans-serif; font-weight:600; }
  .rule{ width:64px; height:3px; background:var(--accent); margin:0 0 28px; }
  .progress{ display:flex; gap:12px; margin-top:34px; }
  .progress span{ font-family:'Cabin',sans-serif; font-weight:600; font-size:15px; color:var(--ink); }
  .progress .dim{ color:var(--ink-muted); font-weight:400; }
  .disclaimer{ margin-top:34px; font-size:14px; line-height:1.5; color:var(--ink-muted); max-width:58ch; }
  .pager{ position:fixed; bottom:22px; right:28px; font-family:'Cabin',sans-serif; font-size:13px; letter-spacing:.08em; color:var(--ink-muted); }
  .brandmark{ position:fixed; bottom:22px; left:28px; font-family:'Cabin',sans-serif; font-weight:600; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-muted); }
  .brandmark b{ color:var(--accent); font-weight:700; }
  @media (max-width:640px){
    .slide{ padding:40px 28px; } h1{ font-size:34px; } h2{ font-size:28px; } .big{ font-size:30px; } .kicker{ font-size:72px; } p,li{ font-size:17px; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandmark"><b>Leading</b> Healthy</div>
<div class="pager" id="pager"></div>
<script>
const S = [
  {t:'title' },
  {t:'who' },
  {t:'trap' },
  {t:'hook' },
  {t:'part', n:'Part One', h:'The problem nobody puts on the whiteboard' },
  {t:'ceiling' },
  {t:'cost' },
  {t:'part', n:'Part Two', h:'The marks of a healthy leader' },
  {t:'mark', n:'01', h:'Know who you are', p:'Self-awareness is the leader’s first instrument. We use the Enneagram as a mirror so you can see your real wiring, your blind spots, and the patterns you lead out of without noticing.' },
  {t:'mark', n:'02', h:'Accept who you aren’t', p:'Healthy leaders stop auditioning for a version of themselves that was never going to last. Naming what is not yours to carry is where the exhaustion starts to lift.' },
  {t:'mark', n:'03', h:'Understand who you need to be', p:'Clarity on calling and direction. Who does this season actually ask you to become, and what has to change in how you lead to get there.' },
  {t:'mark', n:'04', h:'Lead with emotional intelligence', p:'Self-awareness without the muscle to manage it is just insight. Emotional intelligence is the daily practice that turns what you know about yourself into how you show up for your people.' },
  {t:'mark', n:'05', h:'Build rhythm, not balance', p:'Balance is a myth that keeps leaders feeling like they are failing. Rhythm is real: a sustainable cadence of work, rest, and renewal that a vision can actually run on for years.' },
  {t:'part', n:'Part Three', h:'What changes when the leader gets healthy' },
  {t:'week' },
  {t:'ripple' },
  {t:'whyme' },
  {t:'recap' },
  {t:'cta', disc:'This masterclass is for educational purposes only. No specific business, financial, or personal result is guaranteed. Results vary by individual and situation.' }
];

function render(i){
  const s = S[i];
  let html = '';
  switch(s.t){
    case 'title':
      html = `<div class="eyebrow">A live masterclass</div>
        <h1>The 5 Distinctives<br>of a <span class="accent">Healthy</span> Leader</h1>
        <p class="lead">Why a compelling vision and a strategic plan are not enough, and what to build first.</p>
        <div class="meta">With Michael Beaumont &nbsp;&middot;&nbsp; Leading Healthy</div>`;
      break;
    case 'who':
      html = `<div class="eyebrow">Who this is for</div>
        <h2>You built the vision. You built the plan.</h2>
        <ul>
          <li>Owners and executives carrying the weight of the whole thing</li>
          <li>Pastors and nonprofit leaders pouring out faster than they refill</li>
          <li>Leaders who look like they have it together and feel quietly drained</li>
        </ul>`;
      break;
    case 'trap':
      html = `<div class="eyebrow">The trap</div>
        <p class="lead">So you did the work everyone told you to do. The strategy is sharp. The team is in place. The numbers are moving.</p>
        <p class="lead">And you are more tired than you have ever been.</p>`;
      break;
    case 'hook':
      html = `<div class="rule"></div>
        <div class="big">A compelling vision run by an <span class="accent">unhealthy leader</span> still fails.</div>
        <p style="margin-top:28px">It just fails slower, and it takes the leader down with it.</p>`;
      break;
    case 'part':
      html = `<div class="kicker">${s.n.split(' ')[1]==='One'?'01':s.n.split(' ')[1]==='Two'?'02':'03'}</div>
        <div class="eyebrow">${s.n}</div>
        <h2>${s.h}</h2>`;
      break;
    case 'ceiling':
      html = `<h2>Competence has a ceiling</h2>
        <p>Most leadership advice is about getting from good to great. More skill, more systems, more influence.</p>
        <p class="lead">But great is not the top of the mountain. There is a level above it, and almost nobody is coached toward it.</p>
        <div class="meta">Good &nbsp;&rarr;&nbsp; Great &nbsp;&rarr;&nbsp; <span class="accent" style="color:var(--accent)">Healthy</span></div>`;
      break;
    case 'cost':
      html = `<h2>What an unhealthy leader quietly costs</h2>
        <ul>
          <li>The team inherits the leader’s anxiety, whether or not a word is said</li>
          <li>Culture drifts, because culture is the soul of the organization and the soul takes its cues from the top</li>
          <li>Home pays the bill for what work could not hold</li>
        </ul>`;
      break;
    case 'mark':
      html = `<div class="eyebrow">Distinctive ${s.n}</div>
        <h2>${s.h}</h2>
        <p class="lead">${s.p}</p>`;
      break;
    case 'week':
      html = `<h2>The difference you can feel in ninety days</h2>
        <ul>
          <li>You lead out of self-awareness instead of reflex</li>
          <li>You carry what is yours to carry and hand back what is not</li>
          <li>You build a rhythm the vision can run on, so the drive stops costing you your health</li>
        </ul>`;
      break;
    case 'ripple':
      html = `<div class="eyebrow">The ripple</div>
        <div class="big">A healthy leader makes a <span class="accent">healthy team</span> possible, and a healthy team is the only thing that builds a healthy culture.</div>
        <p style="margin-top:26px">It starts with one person, and that person is you.</p>`;
      break;
    case 'whyme':
      html = `<div class="eyebrow">Why I teach this</div>
        <h2>Michael Beaumont</h2>
        <p>Nearly three decades leading organizations, including fourteen years as a nonprofit CEO. I learned this the hard way: an exhausted leader with a vibrant vision.</p>
        <ul>
          <li>Master’s Degree in Leadership</li>
          <li>LifePlan Coach, The Paterson Center for LifePlanning</li>
          <li>Strat/Op certified &nbsp;&middot;&nbsp; Enneagram Certified Advanced Instructor</li>
        </ul>`;
      break;
    case 'recap':
      html = `<div class="eyebrow">The whole idea in one line</div>
        <div class="big">Stop leading harder.<br>Start <span class="accent">leading healthy</span>.</div>
        <div class="meta">Good &nbsp;&rarr;&nbsp; Great &nbsp;&rarr;&nbsp; Healthy</div>`;
      break;
    case 'cta':
      html = `<div class="eyebrow">If this named something you feel</div>
        <h2>Let’s build your plan</h2>
        <p class="lead">The next step is a conversation. We map where you are today and what a healthier way of leading would look like for you, through leadership coaching or a LifePlan.</p>
        <div class="meta">Start at leadinghealthy.org</div>
        <p class="disclaimer">${s.disc}</p>`;
      break;
  }
  document.getElementById('stage').innerHTML = `<div class="slide active">${html}</div>`;
  document.getElementById('pager').textContent = (i+1) + ' / ' + S.length;
}
let idx = 0;
render(idx);
function go(d){ idx = Math.max(0, Math.min(S.length-1, idx+d)); render(idx); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); go(1); }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(-1); }
});
document.getElementById('stage').addEventListener('click', ()=>go(1));
</script>
</body>
</html>
