<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Founder's Path: a masterclass for emerging franchisors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e2043;        /* i9-navy, their dominant ground */
    --panel:#141c43;     /* their second navy */
    --rule:rgba(229,229,231,0.14); /* from their #e5e5e7 */
    --accent:#f15a29;    /* their one brand orange */
    --ink:#f4f6fb;
    --muted:#aeb6c9;
    --head:'Bebas Neue', Impact, sans-serif;
    --body:'Instrument Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#070f23;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  .deck{max-width:1080px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:16px;
    padding:56px 60px;margin:0 0 22px;min-height:440px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::after{content:"";position:absolute;left:60px;right:60px;bottom:30px;height:1px;background:var(--rule)}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:400;letter-spacing:.01em;line-height:.98;
    font-size:clamp(44px,7vw,92px);text-transform:uppercase}
  h2{font-family:var(--head);font-weight:400;line-height:1.0;font-size:clamp(34px,5vw,60px);
    text-transform:uppercase;letter-spacing:.01em}
  .sub{font-size:19px;color:var(--muted);margin-top:20px;max-width:62ch;line-height:1.5}
  .lead{font-size:22px;line-height:1.5;max-width:64ch;margin-top:8px}
  .big{font-family:var(--head);font-size:clamp(80px,14vw,180px);color:var(--accent);line-height:.9}
  .partno{font-family:var(--head);font-size:26px;color:var(--accent);letter-spacing:.08em}
  ul{margin:26px 0 0;padding:0;list-style:none;max-width:66ch}
  li{position:relative;padding-left:30px;margin:0 0 16px;font-size:19px;line-height:1.45;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:2px;background:var(--accent)}
  li b{color:var(--accent);font-weight:600}
  .pillar{display:flex;gap:22px;align-items:baseline}
  .pillar .num{font-family:var(--head);font-size:64px;color:var(--accent);line-height:.8;min-width:72px}
  .stat{display:flex;gap:40px;flex-wrap:wrap;margin-top:26px}
  .stat div{min-width:150px}
  .stat .n{font-family:var(--head);font-size:56px;color:var(--ink)}
  .stat .l{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .cta h2{color:var(--ink)}
  .cta .btn{display:inline-block;margin-top:26px;background:var(--accent);color:#11162b;
    font-weight:700;padding:16px 30px;border-radius:10px;font-size:18px;letter-spacing:.02em}
  .disc{font-size:13px;color:var(--muted);margin-top:28px;max-width:70ch;line-height:1.5}
  .count{position:absolute;top:28px;right:34px;font-family:var(--head);font-size:18px;color:var(--muted);opacity:.6}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* All slide copy lives in const S. Single-quoted {t:'...'} type keys. */
const S = [
  {t:'title', kicker:'A live masterclass for emerging franchisors', h:'The Founder’s Path', sub:'What it actually takes to scale a franchise system past the wall that stalls almost everyone, from a founder who built one to 900+ locations and sold it.'},

  {t:'who', kicker:'Who this is for', h:'You own the system, not just a location', sub:'For franchisor founders somewhere between unit 0 and unit 50, who proved the concept works and now have to build the company around it.'},

  {t:'trap', kicker:'The trap', h:'You became the bottleneck', lead:'The thing that got you here, doing everything yourself, personally, with relentless standards, is the exact thing that stops you at unit 20. You did not sign up to approve every franchisee’s invoices forever.'},

  {t:'reframe', kicker:'The reframe', big:'10 → 50', sub:'Most franchise systems stall somewhere between unit 10 and unit 50. Not because the concept failed. Because the founder never stopped being the company.'},

  {t:'part', no:'Part One', h:'The real problem is not sales'},
  {t:'body', kicker:'Part One', h:'You scaled the concept, not the company', bullets:[
    'Selling the next franchise is the part everyone obsesses over. It is rarely what breaks you.',
    'What breaks you is <b>support debt</b>: every franchisee you add leans on systems that only exist in your head.',
    'At a handful of units you can absorb that by working harder. At 20+, working harder is what keeps you stuck.'
  ]},

  {t:'part', no:'Part Two', h:'The Three P’s'},
  {t:'body', kicker:'Part Two', h:'What carried me through, named', lead:'The three things that decide whether a founder clears the wall. Not slogans, the actual job of each one.'},
  {t:'pillar', kicker:'Part Two · 1 of 3', num:'P1', h:'Passion', lead:'Passion is not the pitch deck energy. It is what is left on the days the model breaks and a franchisee is on the phone angry. It is the fuel you spend in the valleys, so protect it.'},
  {t:'pillar', kicker:'Part Two · 2 of 3', num:'P2', h:'Perseverance', lead:'Perseverance is running with your head down through the valley you cannot see the end of. Every scaling system has them. The founders who make it simply expected the valley and kept building.'},
  {t:'pillar', kicker:'Part Two · 3 of 3', num:'P3', h:'Purpose', lead:'Purpose is the standard that does not bend as you multiply units. It is what a franchisee 1,000 miles away feels when they follow your system. Without it, scale just multiplies drift.'},

  {t:'body', kicker:'Part Two · the hire', h:'Hire to your weaknesses', bullets:[
    'My most expensive early mistake: I hired on a budget to protect cash, and I hired to my strengths.',
    '<b>Hire to your weaknesses</b>, and hire them earlier than feels comfortable. The first corporate hires set the ceiling for every franchisee’s support.',
    'If you hire C players to save money, you get C results across every unit at once.'
  ]},

  {t:'body', kicker:'Part Two · the timing', h:'How and when to franchise', bullets:[
    'Franchising replicates a system, not a hustle. If it only works because you are standing in it, it is not ready to replicate yet.',
    'Know the difference between a <b>great location</b> and a <b>repeatable system</b> before you sell unit two.',
    'Prepare for the peaks and valleys on purpose. The founders who get blindsided are the ones who assumed it was all peaks.'
  ]},

  {t:'part', no:'Part Three', h:'What it looks like when it works'},
  {t:'body', kicker:'Part Three', h:'The company runs the standard, not you', bullets:[
    'Your systems live on paper and in people, not in your head. A franchisee can get a clean answer without texting you.',
    'You spend your week on the next 40 units, not the last franchisee’s invoice.',
    'The brand feels the same in a market you have never visited. That is purpose, operationalised.'
  ]},
  {t:'credibility', kicker:'Why listen to me', h:'I built one, and I sold it', lead:'I started i9 Sports and franchised it into the first and largest youth-sports league brand in the country. Then I lived every wall in this masterclass on the way up.', stats:[['900+','communities'],['2M+','participants'],['30+','states'],['Exit','to private equity']]},

  {t:'cta', kicker:'Your next step with EFB', h:'Bring your system to the room', lead:'If you are an emerging franchisor founder who wants a founder who has cleared these walls, and a small room of peers doing the same, the EFB Founders Club is where that happens.', btn:'Apply to the EFB Founders Club', disc:'Educational only. This masterclass shares one founder’s experience building and scaling a franchise system. No specific result is guaranteed. Results vary and depend on your market, your execution, and many factors outside any program’s control.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'cta' ? ' cta' : '');
  let inner = '<span class="count">' + String(i+1).padStart(2,'0') + '</span>';
  if (s.kicker) inner += '<div class="kicker">' + s.kicker + '</div>';
  if (s.t === 'title') { inner += '<h1>' + s.h + '</h1>'; if (s.sub) inner += '<p class="sub">' + s.sub + '</p>'; }
  else if (s.t === 'reframe') { inner += '<div class="big">' + s.big + '</div>'; if (s.sub) inner += '<p class="sub">' + s.sub + '</p>'; }
  else if (s.t === 'part') { inner += '<div class="partno">' + s.no + '</div><h2>' + s.h + '</h2>'; }
  else if (s.t === 'pillar') { inner += '<div class="pillar"><div class="num">' + s.num + '</div><div><h2>' + s.h + '</h2><p class="lead">' + s.lead + '</p></div></div>'; }
  else if (s.t === 'credibility') {
    inner += '<h2>' + s.h + '</h2><p class="lead">' + s.lead + '</p><div class="stat">';
    s.stats.forEach(x => inner += '<div><div class="n">' + x[0] + '</div><div class="l">' + x[1] + '</div></div>');
    inner += '</div>';
  }
  else if (s.t === 'cta') { inner += '<h2>' + s.h + '</h2><p class="lead">' + s.lead + '</p><span class="btn">' + s.btn + '</span>'
      + '<p class="disc">' + s.disc + '</p>'; }
  else { inner += '<h2>' + s.h + '</h2>'; if (s.lead) inner += '<p class="lead">' + s.lead + '</p>'; if (s.bullets){ inner += '<ul>'; s.bullets.forEach(b => inner += '<li>' + b + '</li>'); inner += '</ul>'; } if (s.sub) inner += '<p class="sub">' + s.sub + '</p>'; }
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
