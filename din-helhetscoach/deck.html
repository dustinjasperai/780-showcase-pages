<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The ANSVARS Method, a live masterclass with Gunnar Karlin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcfcfc; --panel:#f2f4f7; --rule:#dfe3e8; --ink:#0a0a0a;
    --muted:#4a5560; --accent:#2980b9; --accent2:#e74c3c;
    --serif:'Spectral',Georgia,serif; --sans:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9edf1;color:var(--ink);font-family:var(--sans);line-height:1.5;padding:28px 16px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:52px 56px;min-height:420px;display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden}
  .slide.dark{background:var(--ink);color:#f3f5f7;border-color:var(--ink)}
  .slide.dark .muted{color:#aeb7c0}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  .slide.dark .eyebrow{color:#7fb6dd}
  h1{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1.12;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.16;margin-bottom:14px}
  p{font-size:19px;color:var(--muted);max-width:60ch;margin-top:10px}
  .slide.dark p{color:#c9d1d8}
  .lead{font-size:22px;color:var(--ink)}
  .slide.dark .lead{color:#f3f5f7}
  .rule{width:64px;height:4px;background:var(--accent);border-radius:3px;margin:22px 0}
  ul{margin-top:18px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:12px}
  li{font-size:18px;color:var(--ink);padding-left:26px;position:relative}
  li:before{content:"";position:absolute;left:0;top:10px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .stepnum{font-family:var(--serif);font-weight:700;font-size:16px;color:#fff;background:var(--accent);
    width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;letter-spacing:.02em}
  .steplabel{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent2);margin-bottom:8px}
  .kicker{font-family:var(--sans);font-size:15px;color:var(--muted);margin-top:28px}
  .brandline{position:absolute;top:26px;right:40px;font-family:var(--sans);font-weight:700;
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .cta-steps{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .disclaimer{margin-top:30px;font-size:13px;color:var(--muted);max-width:66ch;line-height:1.5}
  .pagefoot{position:absolute;bottom:22px;left:56px;font-size:12px;color:var(--muted);letter-spacing:.05em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Gunnar Karlin',
   h1:'How a Conversation Becomes Change',
   p:'The ANSVARS method, for coaches who want more than a diploma.'},

  {t:'audience',eyebrow:'Who this is for',
   h2:'You finished the training. Now you are in the room.',
   p:'This hour is for newly trained and aspiring coaches who know the theory, believe in the work, and still freeze when a real client sits in front of them.',
   items:['You have done a coaching course or two','You can set a goal and ask good questions','But in a live session you are not always sure what to do next']},

  {t:'reframe',dark:true,eyebrow:'The honest part',
   h2:'If you freeze, it is not a confidence problem.',
   p:'It is a method problem. Most coach training hands you a toolbox and a diploma, but never one clear model for what happens, in order, inside a single conversation. So you improvise, and improvising is exhausting.'},

  {t:'part',eyebrow:'Part one',
   h2:'The core problem: goals sit on top of patterns.',
   p:'A client walks in with a goal. Underneath it sits an old pattern, a story about themselves formed long before you met. Coach the goal and ignore the pattern, and the pattern wins every time.'},

  {t:'point',eyebrow:'Part one',
   h2:'Pure goal coaching treats the symptom.',
   p:'Push hard on action alone and the client complies for two weeks, then quietly drifts back. They did not lack willpower. The conversation never reached the thing actually holding them in place.',
   items:['Goals get set, then slip','The client blames themselves','You feel like you are pushing a rock uphill']},

  {t:'point',eyebrow:'Part one',
   h2:'Pure insight never moves anyone either.',
   p:'Swing the other way, all understanding and no action, and the client feels seen but nothing changes in their week. Real change needs both halves in one room: understand the pattern, then act on it.'},

  {t:'part',eyebrow:'Part two',
   h2:'The ANSVARS model.',
   p:'One method that holds both halves. Seven steps, built over thirty years of coaching athletes, parents, leaders and teams. Ansvar is the Swedish word for responsibility, and the model gives a conversation a spine you can follow every time.'},

  {t:'step',num:'A',label:'Anknytning',stepword:'The bond',
   p:'Start with attachment. How does this person relate, trust, and protect themselves? The bond sets the terms for everything that follows, so you read it first.'},

  {t:'step',num:'N',label:'Nulage',stepword:'Where they are',
   p:'Map the present situation honestly, without rushing to fix it. What is true right now, in their words, before any goal is named.'},

  {t:'step',num:'S',label:'Schematerapi',stepword:'The patterns',
   p:'Surface the schema, the old self story running underneath. This is the therapeutic half most coaching skips, and it is where the goal is quietly being blocked.'},

  {t:'step',num:'V',label:'Varde',stepword:'What change is worth',
   p:'Name the value and the payoff. Why does this change matter enough to be worth the discomfort of actually doing it? Motivation lives here, not in the action step.'},

  {t:'step',num:'A',label:'Agera',stepword:'Act',
   p:'Only now do you move to action, and because the pattern and the value are already on the table, the action sticks instead of sliding off.'},

  {t:'step',num:'R',label:'Reflektera',stepword:'Reflect',
   p:'Come back and review what happened. Reflection is where a one off session becomes a learning loop the client can run on their own.'},

  {t:'step',num:'S',label:'Summering',stepword:'Consolidate',
   p:'Summarize and close. Consolidate the insight into something the client can carry out of the room and repeat without you.'},

  {t:'part',eyebrow:'Part three',
   h2:'One goal, walked through all seven steps.',
   p:'Live in the masterclass, we take one everyday goal, a client who wants to stop overworking, and walk it through all seven steps so you can hear the difference between coaching the goal and coaching the whole person.'},

  {t:'point',eyebrow:'Part three',
   h2:'Knowledge, then motivation, then action.',
   p:'That is the order the model protects, every time. When a conversation moves in that order, the client leaves not just motivated but changed, and they come back.'},

  {t:'why',eyebrow:'Why learn it from Gunnar',
   h2:'Thirty years, one model.',
   p:'Gunnar Karlin started in mental training for athletes in the early seventies, football players, NHL hockey players, golfers, and spent three decades coaching leaders, parents and teams. The ANSVARS model is the distillation of all of it into something you can actually teach and use.',
   items:['Developmental psychology, neuroscience and pedagogy in one frame','Built in the field, not the lecture hall','Now taught as a full Helhetscoach certification']},

  {t:'audience',eyebrow:'Where this goes',
   h2:'From certified to genuinely capable.',
   p:'Learn the model and you stop improvising. You get a spine for every session, a language for what you are doing, and a path toward certifying as a Helhetscoach, a coach who can work at the border of coaching and therapy with confidence.'},

  {t:'cta',eyebrow:'Your next step',
   h2:'Join the live masterclass.',
   p:'Bring one client you are stuck with. Leave with a method you can use in your very next session.',
   steps:['Reserve your seat for the live masterclass','Walk one real goal through all seven ANSVARS steps with Gunnar','If it fits, take the next step toward your Helhetscoach certification'],
   disclaimer:'This masterclass is educational and for professional development only. Coaching is not therapy, counselling or medical treatment, and nothing here is a diagnosis. No specific result or income is guaranteed. Results vary and depend on the individual. If you or a client needs clinical care, consult a licensed professional.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.dark?' dark':'');
  let html='';
  if(s.eyebrow) html+='<div class="brandline">Din Helhetscoach</div><div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){ html+='<h1>'+s.h1+'</h1><div class="rule"></div><p class="lead">'+s.p+'</p>'; }
  else if(s.t==='step'){
    html+='<div class="stepnum">'+s.num+'</div><div class="steplabel">'+s.label+'</div><h2>'+s.stepword+'</h2><p>'+s.p+'</p>';
  }
  else if(s.t==='cta'){
    html+='<h2>'+s.h2+'</h2><p class="lead">'+s.p+'</p><div class="cta-steps"><ul>';
    s.steps.forEach(x=>html+='<li>'+x+'</li>');
    html+='</ul></div><div class="disclaimer">'+s.disclaimer+'</div>';
  }
  else {
    if(s.h2) html+='<h2>'+s.h2+'</h2>';
    if(s.p) html+='<p>'+s.p+'</p>';
    if(s.items){ html+='<ul>'; s.items.forEach(x=>html+='<li>'+x+'</li>'); html+='</ul>'; }
  }
  html+='<div class="pagefoot">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
