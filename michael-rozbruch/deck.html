<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The 7-Figure Tax Resolution Practice Blueprint - Roz Strategies</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F7F6F2;        /* warm ivory ground (from brand off-white #f6f7f7, gold-and-white brand) */
    --ink:#1D2327;       /* near-black ink (brand dominant text) */
    --panel:#111827;     /* deep navy-black authority band (brand button/link) */
    --accent:#B08021;    /* refined gold (documented brand accent) */
    --rule:#DCDCDE;      /* light grey rule (brand) */
    --muted:#5B6168;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px;}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:64px 60px;
    margin:0 0 26px;
    min-height:440px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide.band{background:var(--panel);color:var(--bg);border-color:var(--panel);}
  .slide.band .eyebrow{color:var(--accent);}
  .slide.band h2,.slide.band h1{color:#F7F6F2;}
  .eyebrow{
    font-family:'Inter';font-weight:600;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px;
  }
  h1{font-family:'Playfair Display';font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em;}
  h2{font-family:'Playfair Display';font-weight:700;font-size:34px;line-height:1.12;}
  .lead{font-size:20px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:40ch;}
  .band .lead{color:#D7DBE2;}
  p.body{font-size:18px;line-height:1.6;margin-top:18px;max-width:52ch;}
  .rule{height:3px;width:64px;background:var(--accent);border-radius:2px;margin:0 0 26px;}
  ul.points{list-style:none;margin-top:26px;}
  ul.points li{
    font-size:19px;line-height:1.45;padding:16px 0 16px 44px;position:relative;
    border-top:1px solid var(--rule);
  }
  .band ul.points li{border-top:1px solid rgba(255,255,255,.14);}
  ul.points li:last-child{border-bottom:1px solid var(--rule);}
  .band ul.points li:last-child{border-bottom:1px solid rgba(255,255,255,.14);}
  ul.points li .n{
    position:absolute;left:0;top:15px;font-family:'Playfair Display';font-weight:700;
    color:var(--accent);font-size:20px;
  }
  .stepnum{font-family:'Playfair Display';font-weight:800;font-size:20px;color:var(--accent);margin-bottom:10px;}
  .pagefoot{position:absolute;right:28px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:.06em;}
  .band .pagefoot{color:#7C8291;}
  .brandmark{font-family:'Playfair Display';font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.04em;}
  .disclaimer{font-size:13px;color:var(--muted);line-height:1.5;margin-top:26px;max-width:60ch;}
  .cta-line{font-size:20px;font-weight:600;margin-top:22px;color:var(--ink);}
  .band .cta-line{color:#F7F6F2;}
  .big-quote{font-family:'Playfair Display';font-weight:700;font-size:30px;line-height:1.25;max-width:24ch;}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
    eyebrow:'Roz Strategies / Live Masterclass',
    h1:'The 7-Figure Tax Resolution Practice Blueprint',
    lead:'How to attract premium, pay-in-advance IRS-problem clients, without competing on price for commodity tax prep.' },

  {t:'who',
    eyebrow:'Who this is for',
    h2:'You can already do the work.',
    body:'This is for CPAs, Enrolled Agents and tax attorneys who can resolve an IRS case in their sleep, but whose income still lives and dies by tax season. The skill was never the problem. The pipeline is.' },

  {t:'trap',
    eyebrow:'The trap',
    h2:'Every April it resets to zero.',
    body:'You grind through the season, the returns go out the door, and the revenue goes quiet until next year. So you take on more low-fee prep work to fill the gap, which means more hours for the same commodity price. The treadmill speeds up. The practice does not grow.' },

  {t:'band-reframe',
    eyebrow:'The reframe',
    quote:'You are a commodity tax preparer until you own a system for getting resolution clients. Then you are the authority they pay in advance.' },

  {t:'part',
    stepnum:'Part One',
    h2:'Where premium clients actually come from',
    body:'Taxpayers with an urgent IRS problem are already out there, already afraid, and already willing to pay a premium to make it stop. The question is never demand. It is a reliable way to put yourself in front of them before anyone else does.' },

  {t:'points',
    eyebrow:'Part One',
    h2:'Three sources, hiding in plain sight',
    points:[
      'Your own book of business: clients and former clients who already owe, or will.',
      'A professional referral pipeline: preparers, attorneys, bookkeepers and lenders who meet these taxpayers first.',
      'Federal tax lien marketing: reaching people the moment the IRS makes their problem public.' ] },

  {t:'points',
    eyebrow:'Part One',
    h2:'Why most practices never tap it',
    points:[
      'They wait until after tax season, when the urgent cases have already gone elsewhere.',
      'They market the service like tax prep: price-first, feature-first, forgettable.',
      'They have no system, so client flow is luck, not a process they control.' ] },

  {t:'part',
    stepnum:'Part Two',
    h2:'The system: market, sell, price',
    body:'A resolution practice runs on four repeatable disciplines. None of them is the tax code. Together they are the machine that turns a licensed professional into a sought-after authority.' },

  {t:'points',
    eyebrow:'Part Two / Pillar 1',
    h2:'Marketing Mastery',
    points:[
      'Direct-response campaigns written for frightened taxpayers, not accountants.',
      'A repeatable lead engine instead of hoping for referrals.',
      'Done-for-you assets so the marketing runs whether or not you feel like a marketer.' ] },

  {t:'points',
    eyebrow:'Part Two / Pillar 2',
    h2:'Sales Mastery: the One-Call Close',
    points:[
      'A structured consultation that earns trust fast and ends in a decision.',
      'Objection handling for the three fears every IRS-problem client carries.',
      'Framing the fee as relief, so price is the easy part of the conversation.' ] },

  {t:'points',
    eyebrow:'Part Two / Pillar 3',
    h2:'Client Control Mastery',
    points:[
      'A 14-touch-point assurance system that keeps anxious clients calm and current.',
      'Correspondence that protects the engagement and your time.',
      'Fewer fires, fewer refunds, more referrals from clients who felt handled.' ] },

  {t:'points',
    eyebrow:'Part Two / Pillar 4',
    h2:'The premium-fee method',
    points:[
      'Separate the investigation phase from the resolution phase of every engagement.',
      'Charge a flat, pay-in-advance fee for each, so cash comes in before the work.',
      'Price so the average engagement is worth real money, not another hourly discount.' ] },

  {t:'band-stat',
    eyebrow:'What it adds up to',
    quote:'Fewer clients. Higher fees. Paid in advance. Income that does not stop when tax season does.' },

  {t:'part',
    stepnum:'Part Three',
    h2:'What it looks like in a real case',
    body:'Theory is cheap. So we walk one all the way through: a taxpayer who owes the IRS, from the first call to a resolved engagement, and where the premium fee is set along the way.' },

  {t:'points',
    eyebrow:'Part Three',
    h2:'A $75,000 tax-debt engagement',
    points:[
      'The intake call: qualifying the problem and setting the investigation fee.',
      'Transcript review and financial analysis: what the IRS already knows.',
      'The four ways the case can resolve, and choosing the path that fits the taxpayer.' ] },

  {t:'why',
    eyebrow:'Why learn this here',
    h2:'Built by the person who built the niche.',
    body:'Michael Rozbruch ran his own tax resolution firm for 16 years and helped 14,000 taxpayers resolve IRS problems. For the past 12 years he has taught CPAs, EAs and attorneys the exact client-acquisition, pricing and case systems behind that work. This masterclass is the short version of that playbook.' },

  {t:'recap',
    eyebrow:'The blueprint, in one slide',
    h2:'Three moves out of the trap',
    points:[
      'Find the premium clients who are already looking for you.',
      'Run the market-sell-price system instead of leaving it to luck.',
      'Charge flat, pay-in-advance fees for high-value work you already know how to do.' ] },

  {t:'cta',
    eyebrow:'Your next step',
    h2:'Build the practice you actually want to run.',
    ctaline:'Go deeper with the full Tax Resolution Domination System and the Roz Strategies community.',
    body:'Take the blueprint from this session and install the complete system: the campaigns, the scripts, the pricing and the case templates, with coaching alongside it.',
    disclaimer:'This training is educational. Revenue examples and case studies are individual results and are not guarantees. Your results depend on your experience, your market and your execution. No outcome is promised or implied.' },
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.t && s.t.indexOf('band') === 0 ? ' band' : '');
  let html = '';
  if (s.eyebrow) html += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if (s.stepnum) html += '<div class="stepnum">' + s.stepnum + '</div>';
  if (s.quote) html += '<div class="rule"></div><div class="big-quote">' + s.quote + '</div>';
  if (s.h1) html += '<h1>' + s.h1 + '</h1>';
  if (s.h2) html += '<h2>' + s.h2 + '</h2>';
  if (s.lead) html += '<div class="lead">' + s.lead + '</div>';
  if (s.body) html += '<p class="body">' + s.body + '</p>';
  if (s.points) {
    html += '<ul class="points">';
    s.points.forEach((p, n) => { html += '<li><span class="n">' + (n+1) + '</span>' + p + '</li>'; });
    html += '</ul>';
  }
  if (s.ctaline) html += '<div class="cta-line">' + s.ctaline + '</div>';
  if (s.disclaimer) html += '<div class="disclaimer">' + s.disclaimer + '</div>';
  if (i === 0) html += '<div class="pagefoot brandmark">Roz Strategies</div>';
  else html += '<div class="pagefoot">Roz Strategies / The 7-Figure Tax Resolution Practice Blueprint</div>';
  sec.innerHTML = html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
