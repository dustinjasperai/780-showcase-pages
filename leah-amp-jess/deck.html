<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clarity. Momentum. Strategy. A Masterclass with Leah Selfe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f1; --panel:#ffffff; --rule:#ece4da;
    --acc:#ff9b85; --acc2:#63bfb5; --pop:#f3c444;
    --ink:#3d3d3d; --body:#5a544e; --dim:#a89f95; --cream:#fbf7f1;
    --deep:#3d3d3d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#efe7db;font-family:'Poppins',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;
    background:radial-gradient(130% 120% at 20% 6%,#fffdf9 0%,var(--bg) 60%)}
  .slide.active{opacity:1}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:92%}
  .t-normal h1{font-size:2.95vw;max-width:86%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.26vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.7;font-weight:300}
  .sub{font-family:'Fraunces',serif;font-style:italic;font-size:2.0vw;color:var(--acc);margin-top:3.6vh;max-width:84%;line-height:1.42;font-weight:500}
  .t-section{align-items:flex-start;background:linear-gradient(120deg,#fff2ec 0%,#fbf7f1 100%)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.05vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:3.8vw;max-width:82%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2) 60%,transparent);margin-top:3.6vh;border-radius:3px}
  .t-dark{background:radial-gradient(130% 150% at 50% 0%,#4a4a4a 0%,#333333 72%)}
  .t-dark h1{color:var(--cream);font-size:3.3vw;max-width:86%;font-style:italic}
  .t-dark .kicker{color:var(--acc)}
  .t-cta{background:radial-gradient(120% 150% at 78% 10%,#fff2ec 0%,#fbf7f1 66%)}
  .t-cta h1{color:var(--ink);font-size:3.15vw;max-width:84%}
  .t-cta .body{font-family:'Poppins',sans-serif;color:var(--body);font-size:1.3vw;margin-top:3vh;max-width:70%;line-height:1.62;font-weight:300}
  .chips{display:flex;gap:1.2vw;margin-top:4.4vh;flex-wrap:wrap}
  .chip{border:1.5px solid var(--acc);color:var(--ink);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:500;letter-spacing:.01em;background:rgba(255,155,133,.08)}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.12vw;color:var(--body);margin-top:4.2vh;font-weight:500;letter-spacing:.13em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:5.0vh;font-family:'Poppins',sans-serif;font-size:.82vw;color:var(--dim);line-height:1.5;max-width:82%;font-weight:300}
  .hud{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.05);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:7%;top:50%;transform:translateY(-50%);width:22vw;height:22vw;opacity:.95}
  .corner-mo{right:6%;bottom:8%;width:8vw;height:8vw;opacity:.6}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}.disc{font-size:2vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">The Productivity Queen</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: the three-beat cadence, Clarity to Momentum to Strategy, a calm left-to-right rhythm, not a grind-upward arrow -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <line x1="20" y1="60" x2="100" y2="60" stroke="#ff9b85" stroke-width="2.2" opacity="0.45"/>
  <circle cx="24" cy="60" r="9" fill="#ff9b85" opacity="0.9"/>
  <circle cx="60" cy="60" r="9" fill="#63bfb5" opacity="0.9"/>
  <circle cx="96" cy="60" r="9" fill="#f3c444" opacity="0.95"/>
  <circle cx="60" cy="60" r="30" fill="none" stroke="#63bfb5" stroke-width="1.1" opacity="0.35"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Clarity. Momentum. Strategy.',sub:'How to get your service business moving again, without adding a single hour to your week.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You are booked, respected, a few years in, and quietly stuck in your own business.',body:'The client work gets done, because it always does. It is your own business that keeps waiting: the offer you meant to fix, the system you keep meaning to build, the growth that never quite gets its turn. You are not short on ability. You are short on a week that has room for the business itself.'},
 {t:'dark',k:'The real problem',title:'Being busy is not the same as moving. Most owners are worn out by work that was never the point.'},

 {t:'section',idx:'Part One',title:'Why Good Owners Stay Stuck'},
 {t:'normal',k:'The hustle lie',title:'You were sold hustle. Hustle made you tired. It did not make you further along.',body:'More hours, earlier mornings, one more productivity app. The promise was that effort alone would move things, so when it did not, it felt like your fault. It was not. Hustle is a volume strategy, and you cannot out-volume a week that has no room left in it.'},
 {t:'normal',k:'The bottleneck',title:'The whole business waits on the one person who never has any time. That person is you.',body:'Every decision, every next step, every unfinished project routes back through you. So the business can only move as fast as your most overloaded week allows, which means it mostly does not move at all. The constraint is not effort or talent. It is that everything is stacked on a single pair of hands.'},
 {t:'normal',k:'The template trap',title:'Templates, morning routines and generic advice do not survive a real working day.',body:'The advice assumes a tidy, empty calendar you have never once had. So the colour-coded plan lasts until the first client fire, and then it is gone. What actually holds is not a borrowed system. It is a small rhythm built around the real shape of your week and your actual bottleneck.'},
 {t:'dark',k:'The turn',title:'You do not need more motivation. You need a rhythm your real week can actually hold.'},

 {t:'section',idx:'Part Two',title:'The C.M.S. Method'},
 {t:'normal',k:'One / Clarity',title:'Decide what the business genuinely needs this week, and stop everything that is not that.',body:'Before any new system, we get honest about the one or two things that would actually move the business now, and name the busywork quietly eating the rest of the time. Clarity is subtraction first. Most owners do not need to do more. They need permission to stop carrying what was never moving them forward.'},
 {t:'normal',k:'Two / Momentum',title:'Build a weekly rhythm that moves the business whether or not you feel like it.',body:'Motivation is weather. Rhythm is a structure that works in any weather. We set a repeatable weekly cadence with protected time for your own business, so progress stops depending on a good mood or a quiet week. Small, consistent, defended blocks beat a heroic burst every single time.'},
 {t:'normal',k:'Three / Strategy',title:'Solve your specific bottleneck, not a generic one from somebody else’s business.',body:'This is where the plan gets personal. We look at your actual constraint, the real reason the business is stuck, and build the next few moves around that, not around a framework designed for a different owner in a different market. Strategy that fits gets done. Strategy that is borrowed sits in a document.'},
 {t:'normal',k:'The part no template gives you',title:'Accountability: someone who checks the plan actually got done, not just written.',body:'A plan you make alone is a plan you can quietly renegotiate at 9pm. So the method is built on real accountability: monthly Get It Done work sessions and live hot-seat coaching, where the plan is watched, the excuses lose their power, and the thing you keep putting off finally moves. That follow-through is the whole difference.'},
 {t:'dark',k:'Permission',title:'Rest is not the reward you earn after the work. Rest is part of what keeps the work sustainable.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'What this builds',title:'A business that moves forward on an ordinary week, without you burning out to push it.',body:'When the priorities are clear, the rhythm is protected, and someone is holding you to it, the business stops living in the someday pile. Projects finish. The offer gets fixed. Growth gets its turn on the calendar, because you built a week with room for it, instead of waiting for a quiet season that never arrives.'},
 {t:'normal',k:'Why Leah',title:'Ten years running events for thousands of people, rebuilt into a coach who makes the plan happen.',body:'I spent a decade running large-scale events and operations, then rebuilt from redundancy as a virtual assistant, then an OBM, and now The Productivity Queen. I am not here to hype you up. I am here to get inside the business, find what is actually keeping you stuck, and make sure you leave with a plan you will genuinely execute.'},

 {t:'section',idx:'Your Next Step',title:'Get Moving with Leah'},
 {t:'cta',title:'Ready to stop being the bottleneck in your own business?',body:'If you want the clarity, the rhythm and the accountability that makes it stick, here is where to start.',chips:['Join b!tch, you better work','Book a Fuck Yeah Session'],disc:'Educational content for women running service-based businesses. No specific business, revenue or income result is guaranteed. Outcomes vary by individual, circumstances and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Productivity <b>Queen</b> &middot; Leah Selfe</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='corner') h+=mo('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
