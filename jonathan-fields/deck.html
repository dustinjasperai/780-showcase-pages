<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 2x20 Method - A Live Masterclass with Jonathan Fields</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf7; --panel:#f1efe9; --ink:#1c2b33; --muted:#5b6b73;
    --accent:#085079; --accent2:#ffe165; --rule:#d9d4c8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Open Sans",sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 22px;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:"Hanken Grotesk",sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Hanken Grotesk",sans-serif;font-weight:800;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"Hanken Grotesk",sans-serif;font-weight:700;font-size:34px;line-height:1.1;margin-bottom:18px}
  .sub{font-size:21px;color:var(--muted);max-width:40ch}
  .lead{font-size:26px;font-weight:500;max-width:30ch}
  .presenter{margin-top:30px;font-family:"Hanken Grotesk",sans-serif;font-weight:600;font-size:16px;color:var(--ink)}
  .big{font-family:"Hanken Grotesk",sans-serif;font-weight:800;font-size:40px;line-height:1.12;letter-spacing:-.01em;max-width:24ch}
  .mark{background:linear-gradient(transparent 62%, var(--accent2) 62%);padding:0 2px}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:20px;width:10px;height:10px;border-radius:3px;background:var(--accent)}
  li b{font-family:"Hanken Grotesk",sans-serif}
  .buckets{display:flex;gap:16px;margin-top:14px}
  .bucket{flex:1;background:var(--panel);border-radius:12px;padding:24px}
  .bucket .bt{font-family:"Hanken Grotesk",sans-serif;font-weight:700;font-size:19px;color:var(--accent);margin-bottom:8px}
  .bucket .bd{font-size:15px;color:var(--muted)}
  .steps{display:flex;gap:12px;margin-top:18px}
  .step{flex:1;text-align:center}
  .step .n{font-family:"Hanken Grotesk",sans-serif;font-weight:800;font-size:30px;color:var(--accent)}
  .step .l{font-size:14px;color:var(--muted);margin-top:6px}
  .section-k{font-family:"Hanken Grotesk",sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--muted)}
  .section-h{font-family:"Hanken Grotesk",sans-serif;font-weight:800;font-size:46px;margin-top:10px}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .cta-line{font-family:"Hanken Grotesk",sans-serif;font-weight:700;font-size:22px;color:var(--accent);margin-top:10px}
  .pagefoot{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", kicker:"A Good Life Project live masterclass",
   h1:"The 2x20 Method",
   sub:"How to design your next 20 years in the next 2, without blowing up the life you have built.",
   presenter:"with Jonathan Fields"},

  {t:"who", kicker:"Who this is for",
   lead:"You are somewhere in the middle. The old scripts, climb, acquire, achieve, got you here and quietly stopped working. You do not want a crisis. You want a next chapter you actually choose."},

  {t:"list", kicker:"The midlife trap", h2:"Three myths keep you waiting",
   items:[
     ["The leap myth","Change has to mean quit, move, start over. So you never start."],
     ["The someday myth","You will design the next chapter once things finally calm down."],
     ["The passion myth","Find the one true thing and the rest falls into place."]
   ]},

  {t:"statement", kicker:"The reframe",
   big:'A full life can still feel flat. That is not a character flaw. It is a <span class="mark">design problem</span>, and design problems have methods.'},

  {t:"section", k:"Part One", h:"The real question"},

  {t:"statement", kicker:"The question behind the method",
   big:"What could you learn, do, or build over the next two years that would center the next twenty around simplicity, meaning, and joy?"},

  {t:"who", kicker:"Why two years",
   lead:"Twenty years is too far away to feel. Two years is close enough to act on and long enough to matter. You design the twenty by running the two."},

  {t:"who", kicker:"Your three guiding words",
   lead:"Simplicity. Meaning. Joy. Those are mine. Yours might be three completely different words. They become the filter you run every decision and every experiment through."},

  {t:"section", k:"Part Two", h:"The method"},

  {t:"buckets", kicker:"First, check your buckets", h2:"The Good Life Buckets",
   note:"Your emptiest bucket drags the other two down. Most midlife flatness is one bucket that quietly ran dry over a decade.",
   cols:[
     ["Vitality","Your state of mind and body. Energy, health, resilience, outlook."],
     ["Connection","The depth and quality of your relationships, from the most intimate to the communal."],
     ["Contribution","The work and the giving that are genuinely aligned with who you are."]
   ]},

  {t:"steps", kicker:"The engine of the method", h2:"Experiments, not leaps",
   note:"You do not bet the house. You run a small, reversible test, keep what feels alive, and drop what does not.",
   steps:[["2 wk","a tiny test"],["2 mo","a real trial"],["2 qtr","a commitment"],["2 yr","a direction"]]},

  {t:"list", kicker:"Why experiments work", h2:"What each experiment reveals",
   items:[
     ["Who you are","When you strip away other people's expectations."],
     ["What you want","Not what you are supposed to want."],
     ["What matters most","For this season, which is not the last one."]
   ]},

  {t:"who", kicker:"You do not do it alone",
   lead:"A circle of 8 to 10 people in the same season, learning the same method and using the same language, running experiments in parallel. The circle is what turns a good intention into actual follow-through."},

  {t:"section", k:"Part Three", h:"A year of experiments"},

  {t:"who", kicker:"A year into your 2x20",
   lead:"You have run a dozen small experiments. A few became real. Your calendar looks different. The flat feeling is gone, because you are building toward something you chose on purpose."},

  {t:"who", kicker:"Why I teach this",
   lead:"I am Jonathan Fields. I built Good Life Project, wrote How to Live a Good Life, and created the Sparketype. I built the 2x20 method because I needed it myself. Now, a hundred million listens later, it is what I teach."},

  {t:"cta", kicker:"Your next step",
   h1:"Design your next chapter, on purpose.",
   ctaLine:"Join the Midlife Design Lab and start your first 2-year experiment inside a circle.",
   disc:"This masterclass is for education and personal growth. It is not financial, medical, or career advice. No specific income, result, or outcome is guaranteed, and results vary from person to person. Your next chapter is yours to design."}
];

function esc(s){return s;}
const deck=document.getElementById("deck");
S.forEach((s,i)=>{
  const d=document.createElement("div");d.className="slide";let h="";
  if(s.t==="title"){h=`<div class="kicker">${s.kicker}</div><h1>${s.h1}</h1><div class="sub">${s.sub}</div><div class="presenter">${s.presenter}</div>`;}
  else if(s.t==="who"){h=`<div class="kicker">${s.kicker}</div><div class="lead">${s.lead}</div>`;}
  else if(s.t==="statement"){h=`<div class="kicker">${s.kicker}</div><div class="big">${s.big}</div>`;}
  else if(s.t==="section"){h=`<div class="section-k">${s.k}</div><div class="section-h">${s.h}</div>`;}
  else if(s.t==="list"){let li=s.items.map(it=>`<li><b>${it[0]}.</b> ${it[1]}</li>`).join("");h=`<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><ul>${li}</ul>`;}
  else if(s.t==="buckets"){let b=s.cols.map(c=>`<div class="bucket"><div class="bt">${c[0]}</div><div class="bd">${c[1]}</div></div>`).join("");h=`<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><div class="buckets">${b}</div><div class="sub" style="margin-top:20px">${s.note}</div>`;}
  else if(s.t==="steps"){let st=s.steps.map(x=>`<div class="step"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join("");h=`<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><div class="steps">${st}</div><div class="sub" style="margin-top:22px">${s.note}</div>`;}
  else if(s.t==="cta"){h=`<div class="kicker">${s.kicker}</div><h1>${s.h1}</h1><div class="cta-line">${s.ctaLine}</div><div class="disc">${s.disc}</div>`;}
  d.innerHTML=h;deck.appendChild(d);
  const f=document.createElement("div");f.className="pagefoot";f.textContent=`The 2x20 Method  ·  ${i+1} / ${S.length}`;deck.appendChild(f);
});
</script>
</body>
</html>
