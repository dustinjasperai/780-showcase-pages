<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profitable Event Method — a masterclass with Mechelle Barras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f6f2ea;
    --panel:#ece2d0;
    --rule:#ddd2bd;
    --ink:#1b2a48;
    --accent:#b5893f;
    --gold:#c8a45c;
    --soft:#4a556f;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;}
  .slide{display:none;width:100%;max-width:960px;animation:fade .4s ease;}
  .slide.on{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  .kicker .dia{color:var(--ink);}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:60px;line-height:1.04;letter-spacing:-.01em;margin-bottom:22px;}
  h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:42px;line-height:1.08;margin-bottom:20px;}
  h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px;line-height:1.15;margin-bottom:12px;color:var(--ink);}
  p{font-size:20px;line-height:1.6;color:var(--soft);max-width:44ch;margin-bottom:16px;}
  p.lead{font-size:23px;color:var(--ink);max-width:46ch;}
  .sub{font-family:'Inter';font-size:16px;color:var(--soft);letter-spacing:.01em;}
  ul{list-style:none;margin-top:10px;}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.5;color:var(--soft);margin-bottom:15px;max-width:48ch;}
  li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;background:var(--gold);transform:rotate(45deg);}
  li b{color:var(--ink);font-weight:600;}
  .partnum{font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
  .rule{width:64px;height:2px;background:var(--gold);margin:26px 0;}
  .big{font-family:'Cormorant Garamond',serif;font-size:120px;font-weight:700;letter-spacing:.06em;color:var(--ink);line-height:1;}
  .big span{color:var(--accent);}
  .cardrow{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px;}
  .card{background:var(--panel);border:1px solid var(--rule);padding:20px 18px;}
  .card .n{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--accent);margin-bottom:6px;}
  .card p{font-size:15px;margin:0;color:var(--soft);}
  .present{margin-top:34px;padding-top:22px;border-top:1px solid var(--rule);font-size:16px;color:var(--ink);}
  .present b{font-weight:600;}
  .disc{font-size:13px;color:#8a7f6a;margin-top:22px;max-width:52ch;line-height:1.5;}
  .cta-line{font-size:22px;color:var(--ink);margin-top:8px;}
  footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;font-size:12px;color:#9a8f79;letter-spacing:.04em;}
  .dot{display:inline-block;width:6px;height:6px;background:var(--gold);transform:rotate(45deg);margin:0 6px;}
  .prog{position:fixed;top:0;left:0;height:3px;background:var(--accent);transition:width .3s;z-index:9;}
  .nav{position:fixed;bottom:14px;right:24px;display:flex;gap:8px;z-index:10;}
  .nav button{font-family:'Inter';background:var(--panel);border:1px solid var(--rule);color:var(--ink);width:34px;height:34px;cursor:pointer;font-size:15px;}
  .nav button:hover{background:var(--gold);color:#fff;border-color:var(--gold);}
  @media(max-width:640px){h1{font-size:38px;}h2{font-size:30px;}.big{font-size:74px;}p{font-size:17px;}.cardrow{grid-template-columns:1fr;}li{font-size:17px;}}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div id="stage"></div>
<div class="nav"><button onclick="go(-1)">&#8249;</button><button onclick="go(1)">&#8250;</button></div>
<footer><span>The Profitable Event Method</span><span>Mechelle Barras <span class="dot"></span> Residency Aesthetics</span></footer>
<script>
const S=[
 {t:'title',h:`<div class="kicker">A live masterclass <span class="dia">&#9670;</span> Residency Aesthetics</div>
   <h1>The Profitable Event<br>Method</h1>
   <p class="lead">How med spa owners turn one polished night into a quarter of revenue, without discounting the brand.</p>
   <div class="present"><b>Presented by Mechelle Barras</b>, RN &middot; founder of Residency Aesthetics &middot; host of the Mindset Great podcast</div>`},
 {t:'promise',h:`<div class="kicker">What you will leave with</div>
   <h2>By the end of this hour</h2>
   <ul>
     <li>A clear picture of why <b>one event</b> can out-earn a month of flash sales.</li>
     <li>The <b>WRAPPED Method</b> for building an event that sells without feeling salesy.</li>
     <li>The five moving parts of a <b>profitable and polished</b> med spa event.</li>
     <li>A simple way to turn one-night attendees into <b>long-term members</b>.</li>
   </ul>`},
 {t:'audience',h:`<div class="kicker">Who this is for</div>
   <h2>You do beautiful clinical work.<br>The calendar still swings.</h2>
   <p class="lead">You are a med spa owner. Your results are real and your clients love you. But revenue spikes when you promote and sags when you stop, and you are tired of being the busiest person in a business that still feels fragile.</p>
   <p>If that is you, the fix is not another discount. It is a repeatable event you can run on demand.</p>`},
 {t:'trap',h:`<div class="kicker">The trap</div>
   <h2>The discount treadmill</h2>
   <p class="lead">Most med spas grow the only way they were shown: run a special, drop the price, fill a few chairs, then do it again next month.</p>
   <ul>
     <li>It trains your best clients to <b>wait for the next sale</b>.</li>
     <li>It fills rooms with <b>price shoppers</b>, not members.</li>
     <li>It quietly eats the <b>margin</b> you opened the spa to earn.</li>
   </ul>`},
 {t:'darkreframe',h:`<div class="partnum">The real problem</div>
   <h2>Your problem was never traffic,<br>or skill.</h2>
   <p class="lead">It is that you have no repeatable, high-margin moment you can create on purpose. So growth depends on how hard you personally push each month.</p>
   <div class="rule"></div>
   <p>An event, run properly, is that moment. It manufactures demand instead of buying it back with discounts.</p>`},
 {t:'part1',h:`<div class="big">Part <span>One</span></div>
   <h2 style="margin-top:24px;">Why the specials model caps you</h2>`},
 {t:'problem',h:`<div class="kicker">Part One <span class="dia">&#9670;</span> the ceiling</div>
   <h2>Feast, then famine</h2>
   <p class="lead">A promotion borrows revenue from your future. The rush feels good, then the calendar empties and you reach for the next markdown to fill it.</p>
   <p>Nothing compounds. Every month you start the climb again from the bottom, and the brand you are building never gets to feel premium.</p>`},
 {t:'margin',h:`<div class="kicker">Part One <span class="dia">&#9670;</span> the math</div>
   <h2>What a discount really costs</h2>
   <ul>
     <li>A 20% price cut can erase most of the <b>profit</b> on a treatment, not just a slice of it.</li>
     <li>Discount clients show a lower <b>rebook</b> and lifetime value than full-price ones.</li>
     <li>The client's mental price of your work <b>resets down</b>, and it is hard to move back up.</li>
   </ul>
   <p>You cannot discount your way to a premium brand. The exit or scale you want needs the opposite.</p>`},
 {t:'reframe',h:`<div class="kicker">The shift</div>
   <h2>An event is not a party.<br>It is a sales system.</h2>
   <p class="lead">A polished event gathers the right people, tells a story, builds desire in the room, and gives them one clean reason to commit at full price that night.</p>
   <p>Done once, it is a nice evening. Built as a method, it is a channel you can run every quarter.</p>`},
 {t:'part2',h:`<div class="big">Part <span>Two</span></div>
   <h2 style="margin-top:24px;">The WRAPPED Method</h2>`},
 {t:'framework',h:`<div class="kicker">The method</div>
   <h2>W.R.A.P.P.E.D.</h2>
   <p class="lead">With Residency Aesthetics, Profitable and Polished Events are Delivered.</p>
   <p>It is the system I built running seven figures of my own med spa events, then taught to owners who wanted the room to sell for them. It runs in five moving parts.</p>`},
 {t:'plan',h:`<div class="partnum">Phase one</div>
   <h3>Plan the profit before the date</h3>
   <p class="lead">Every WRAPPED event starts on paper, not on the calendar. You choose one hero offer, set the full-price number you will present, and back into how many guests and how many yeses make the night worth doing.</p>
   <p>If the math does not work on paper, you fix the offer, not the price.</p>`},
 {t:'fill',h:`<div class="partnum">Phase two</div>
   <h3>Fill the room with the right people</h3>
   <p class="lead">You do not need a crowd. You need the right thirty. WRAPPED uses your list, your past clients, and a warm plus-one invite so the room is full of people already primed to buy, not bargain hunters chasing a deal.</p>`},
 {t:'room',h:`<div class="partnum">Phase three</div>
   <h3>Choreograph the night</h3>
   <p class="lead">Polished is a feeling, and it is designed. The arrival, the demo, the story you tell, the moment you make the offer: each is placed so that buying feels like the natural next step, never a pitch dropped on the room.</p>`},
 {t:'convert',h:`<div class="partnum">Phase four</div>
   <h3>Make the offer, in the room</h3>
   <p class="lead">The night has one job: a clean, full-price offer with a reason to say yes tonight and a simple way to book on the spot. No markdown, no pressure, just a decision made easy while desire is highest.</p>`},
 {t:'after',h:`<div class="partnum">Phase five</div>
   <h3>Wrap them into members</h3>
   <p class="lead">The event does not end when guests leave. WRAPPED turns one night into recurring revenue: a membership or package path, a follow-up sequence, and a reason to return, so a single evening keeps paying for the whole quarter.</p>`},
 {t:'part3',h:`<div class="big">Part <span>Three</span></div>
   <h2 style="margin-top:24px;">Putting it to work</h2>`},
 {t:'contains',h:`<div class="kicker">Part Three <span class="dia">&#9670;</span> the anatomy</div>
   <h2>What a profitable event contains</h2>
   <div class="cardrow">
     <div class="card"><div class="n">01</div><p>One hero offer, priced at full value, with the night's math done first.</p></div>
     <div class="card"><div class="n">02</div><p>A curated guest list of primed clients and their plus-ones.</p></div>
     <div class="card"><div class="n">03</div><p>A choreographed run of show that makes buying feel effortless.</p></div>
   </div>
   <div class="cardrow">
     <div class="card"><div class="n">04</div><p>A clean in-room offer with an easy way to commit that night.</p></div>
     <div class="card"><div class="n">05</div><p>A follow-up that wraps attendees into memberships and returns.</p></div>
     <div class="card"><div class="n">06</div><p>A template you keep, so the next event is faster than the last.</p></div>
   </div>`},
 {t:'whyme',h:`<div class="kicker">Why me</div>
   <h2>I built this the hard way</h2>
   <p class="lead">I spent twenty years in law enforcement and retired as a police sergeant before I ever touched aesthetics. Then I reinvented, became an RN and licensed esthetician, and co-built Pure Image Laser and Spa into a seven-figure company.</p>
   <p>Residency Aesthetics is the guide I never had. The WRAPPED Method is what I wish someone had handed me on day one.</p>`},
 {t:'shift',h:`<div class="kicker">The one shift</div>
   <h2>Stop discounting demand.<br>Start creating it.</h2>
   <p class="lead">A med spa that can run a profitable, polished event on demand never has to fear a slow month again. That is the difference between a busy owner and a business that can scale, sell, or simply breathe.</p>`},
 {t:'cta',h:`<div class="kicker">Where to take this next</div>
   <h2>Build your first WRAPPED event with me</h2>
   <p class="lead">If you want help turning this into a real event on your calendar, that is exactly the work I do with med spa owners inside Residency Aesthetics coaching.</p>
   <div class="cta-line"><b>Reach out at residencyaesthetics.com to start the conversation.</b></div>
   <p class="disc">This masterclass is educational. It shares a method and a framework, not a promise. No specific revenue or result is guaranteed. Results vary with your market, your offer, and the work you put in.</p>`}
];
let i=0;
function render(){
 const st=document.getElementById('stage');
 st.innerHTML='<div class="slide on">'+S[i].h+'</div>';
 document.getElementById('prog').style.width=((i)/(S.length-1)*100)+'%';
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){go(1);e.preventDefault();}
 if(e.key==='ArrowLeft'||e.key==='PageUp'){go(-1);e.preventDefault();}
});
document.getElementById('stage').addEventListener('click',e=>{if(!e.target.closest('a,button'))go(1);});
render();
</script>
</body>
</html>
