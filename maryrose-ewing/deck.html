<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The One-Sentence Pitch — a masterclass with Maryrose Ewing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efece3; --panel:#fdfcf8; --ink:#2e3532; --muted:#6b726d;
    --rule:rgba(46,53,50,.14); --accent:#f15b2a; --deep:#223029;
    --head:'Manrope',system-ui,sans-serif; --body:'Spectral',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--deep);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    background:var(--bg);border-radius:14px;margin:22px 0;padding:60px 58px;
    min-height:430px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 var(--rule),0 24px 60px -40px rgba(0,0,0,.5);
    position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.04;letter-spacing:-.02em;color:var(--deep)}
  h2{font-family:var(--head);font-weight:800;font-size:38px;line-height:1.08;letter-spacing:-.015em;color:var(--deep)}
  .lead{font-size:23px;line-height:1.5;color:var(--ink);margin-top:20px;max-width:30em}
  .sub{font-size:18px;color:var(--muted);margin-top:26px;font-family:var(--head);font-weight:500}
  .big{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.1;letter-spacing:-.02em;color:var(--deep);max-width:16em}
  .divider{background:var(--deep)}
  .divider::before{background:var(--accent)}
  .divider .kick{color:var(--accent)}
  .divider h2{color:#fbfaf7}
  .divider .sub{color:rgba(251,250,247,.72)}
  ul{list-style:none;margin-top:24px;display:grid;gap:16px}
  li{font-size:21px;line-height:1.4;padding-left:34px;position:relative}
  li b{font-family:var(--head);font-weight:800;color:var(--deep)}
  li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:14px;
    border-radius:50%;background:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px}
  .box{border:1px solid var(--rule);border-radius:10px;padding:22px 24px;background:#fff}
  .box .t{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .box .v{font-size:20px;line-height:1.4}
  .box.dim .v{color:var(--muted);font-style:italic}
  .proverb{font-family:var(--head);font-weight:800;font-size:30px;color:var(--accent);margin-top:8px}
  .steps{display:grid;gap:14px;margin-top:22px}
  .step{display:flex;gap:18px;align-items:baseline}
  .step .n{font-family:var(--head);font-weight:800;font-size:22px;color:var(--accent);min-width:1.4em}
  .step .x{font-size:21px;line-height:1.4}
  .cta{background:var(--deep)}
  .cta::before{background:var(--accent)}
  .cta h2,.cta h1{color:#fbfaf7}
  .cta .lead{color:rgba(251,250,247,.9)}
  .cta .do{display:inline-block;margin-top:26px;font-family:var(--head);font-weight:800;
    font-size:20px;color:var(--deep);background:var(--accent);padding:14px 26px;border-radius:9px;text-decoration:none}
  .disc{font-size:13px;line-height:1.5;color:rgba(251,250,247,.6);margin-top:30px;max-width:40em;font-family:var(--head);font-weight:500}
  .foot{font-family:var(--head);font-weight:700;font-size:13px;color:var(--muted);
    position:absolute;right:30px;bottom:22px;letter-spacing:.04em}
  .cta .foot{color:rgba(251,250,247,.5)}
  @media(max-width:640px){.slide{padding:40px 26px}h1{font-size:36px}h2{font-size:28px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">A live masterclass</div>
    <h1>The One-Sentence Pitch</h1>
    <p class="lead">How experts turn a complex idea into a sentence anyone can repeat.</p>
    <p class="sub">With Maryrose Ewing, The Ewing School</p>`},

  {t:'who', cls:'', html:`
    <div class="kick">Who this is for</div>
    <h2>You know your work matters. You watch people's eyes glaze when you explain it.</h2>
    <p class="lead">For founders, scientists, and executives whose ideas are too important to be misunderstood.</p>`},

  {t:'hook', cls:'', html:`
    <div class="kick">The hard truth</div>
    <p class="big">The best idea in the room rarely wins. The clearest one does.</p>`},

  {t:'divider', cls:'divider', html:`
    <div class="kick">Part One</div>
    <h2>Why smart people lose the room</h2>
    <p class="sub">The problem is not confidence. It is translation.</p>`},

  {t:'point', cls:'', html:`
    <div class="kick">The curse of knowledge</div>
    <h2>You were rewarded for depth.</h2>
    <p class="lead">The more you know, the harder it becomes to say it simply. You cannot remember what it was like to not know. That is not a flaw in you. It is a predictable trap, and it has a way out.</p>`},

  {t:'gap', cls:'', html:`
    <div class="kick">The gap</div>
    <h2>What you said is not what they heard.</h2>
    <div class="two">
      <div class="box"><div class="t">What you said</div><div class="v">A dense, caveated, accurate paragraph.</div></div>
      <div class="box dim"><div class="t">What they kept</div><div class="v">Almost none of it.</div></div>
    </div>`},

  {t:'point', cls:'', html:`
    <div class="kick">Whose job is it</div>
    <p class="big">The burden of clarity is on you, not your audience.</p>
    <p class="lead">When Richard Feynman wanted to explain why the shuttle failed, he dropped an O-ring into a glass of ice water on live television. One idea. One picture. Everybody understood.</p>`},

  {t:'divider', cls:'divider', html:`
    <div class="kick">Part Two</div>
    <h2>The method: Identify, Clarify, Simplify</h2>
    <p class="sub">Three moves that take a tangled idea down to one sentence.</p>`},

  {t:'steps', cls:'', html:`
    <div class="kick">The method</div>
    <h2>From everything you could say to the one thing they need.</h2>
    <div class="steps">
      <div class="step"><span class="n">1</span><span class="x"><b>Identify.</b> Choose the single Big Idea. One thing you want them to remember, not five.</span></div>
      <div class="step"><span class="n">2</span><span class="x"><b>Clarify.</b> Strip the jargon. Use active voice. Say what you actually mean.</span></div>
      <div class="step"><span class="n">3</span><span class="x"><b>Simplify.</b> Boil it to one sentence a third-grader could repeat back to you.</span></div>
    </div>`},

  {t:'point', cls:'', html:`
    <div class="kick">The test</div>
    <h2>If a third-grader can repeat it, a boardroom can remember it.</h2>
    <p class="lead">The sentence is not dumbed down. It is distilled. Every word earns its place, and nothing is left for the listener to reconstruct.</p>`},

  {t:'divider', cls:'divider', html:`
    <div class="kick">Part Two, continued</div>
    <h2>Make it stick: the Proverb framework</h2>
    <p class="sub">A sentence people remember is a sentence people repeat for you.</p>`},

  {t:'list', cls:'', html:`
    <div class="kick">Be Clear, Be Simple, Be Memorable</div>
    <h2>Engineer a line that travels.</h2>
    <ul>
      <li><b>Be Clear.</b> No jargon, active voice, one thought per line.</li>
      <li><b>Be Simple.</b> Short, grade-school words. Aim for under seven.</li>
      <li><b>Be Memorable.</b> Use repetition, a picture, or the unexpected.</li>
    </ul>`},

  {t:'quote', cls:'', html:`
    <div class="kick">You already know ones that worked</div>
    <p class="proverb">"Yes we can."</p>
    <p class="proverb">"Keep it simple."</p>
    <p class="lead">None of these explain everything. Each one carries one idea so well that it moves on its own.</p>`},

  {t:'divider', cls:'divider', html:`
    <div class="kick">Part Three</div>
    <h2>When the one sentence does the work</h2>`},

  {t:'ba', cls:'', html:`
    <div class="kick">Before and after</div>
    <h2>Same idea. One of them gets funded.</h2>
    <div class="two">
      <div class="box dim"><div class="t">Before</div><div class="v">"We leverage a proprietary machine-learning layer to optimize cross-functional workflow efficiency at scale."</div></div>
      <div class="box"><div class="t">After</div><div class="v">"We help busy teams finish the work they keep putting off."</div></div>
    </div>`},

  {t:'pillars', cls:'', html:`
    <div class="kick">The Ewing School pillars</div>
    <h2>Clarity is built on four things.</h2>
    <ul>
      <li><b>Useful.</b> Understand what your audience needs and how you help.</li>
      <li><b>Clear.</b> Know what you want to say and how to say it.</li>
      <li><b>Confident.</b> Feel at home speaking in any room.</li>
      <li><b>Authentic.</b> Let your own voice and personality show.</li>
    </ul>`},

  {t:'why', cls:'', html:`
    <div class="kick">Why me</div>
    <h2>I help people make progress on what they have to say.</h2>
    <p class="lead">I'm Maryrose Ewing, CEO and coach at The Ewing School. I spent years turning complex policy and research into messages people actually remember, and I now coach founders and executives to do the same. Clarity and confidence are trainable. That is the whole job.</p>`},

  {t:'recap', cls:'', html:`
    <div class="kick">The one thing to keep</div>
    <p class="big">Identify the idea. Clarify the words. Simplify to one sentence they can repeat.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h2>Let's find your one sentence.</h2>
    <p class="lead">If you have a pitch, a talk, or a launch coming up, book a free consultation and we'll work on the single sentence it should turn on.</p>
    <a class="do" href="https://ewingschool.com">Book a free consultation at ewingschool.com</a>
    <p class="disc">Educational content only. No income, role, outcome, or result is guaranteed. Results vary and depend on your own effort, audience, and circumstances.</p>
    <div class="foot">The Ewing School</div>`},
];

const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  el.innerHTML = s.html + (s.cls && (s.cls.includes('divider')||s.cls.includes('cta')) ? '' : '<div class="foot">The Ewing School</div>');
  deck.appendChild(el);
});
</script>
</body>
</html>
