<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Story That Gets In | Invictus Prep Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #fdfcff;
    --panel: #efeaee;
    --ink: #2a2430;
    --ink-soft: #4a4350;
    --ink-muted: #8a8191;
    --rule: #ddd3dc;
    --accent: #521248;
  }
  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--ink); font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); }
  .deck { max-width: 960px; margin: 0 auto; }
  .slide {
    position: relative; background: var(--bg); aspect-ratio: 16/9; width: 100%;
    padding: 64px 72px 56px 84px; display: flex; flex-direction: column;
    justify-content: center; overflow: hidden; border-bottom: 1px solid var(--ink);
  }
  .slide::before { content:''; position:absolute; left:34px; top:64px; bottom:56px; width:3px; background: var(--accent); border-radius:3px; }
  .kicker { font-size: 14px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  .slide h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 52px; line-height: 1.08; letter-spacing: -.01em; color: var(--ink); }
  .slide h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; line-height: 1.14; color: var(--ink); margin-bottom: 26px; }
  .sub { font-size: 23px; color: var(--ink-soft); margin-top: 24px; max-width: 80%; line-height: 1.5; }
  .snum { font-family: 'Fraunces', Georgia, serif; font-size: 20px; color: var(--accent); font-weight: 600; margin-bottom: 14px; letter-spacing:.04em; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 18px; margin-top: 6px; }
  li { font-size: 22px; color: var(--ink-soft); line-height: 1.4; padding-left: 34px; position: relative; max-width: 86%; }
  li::before { content:''; position:absolute; left:0; top:11px; width:14px; height:14px; border:3px solid var(--accent); border-radius:50%; }
  li strong { color: var(--ink); font-weight: 700; }
  .big { font-family:'Fraunces',Georgia,serif; font-size: 60px; line-height:1.06; color: var(--ink); font-weight:600; }
  .big .a { color: var(--accent); font-style: italic; }
  .panel { background: var(--panel); border-radius: 16px; padding: 34px 38px; margin-top: 10px; }
  .disclaimer { font-size: 14px; color: var(--ink-muted); margin-top: 28px; max-width: 78%; line-height: 1.5; }
  .ctaline { display:inline-block; margin-top:26px; font-size:21px; font-weight:700; color:#fff; background:var(--accent); border-radius:100px; padding:15px 30px; }
  .foot { position:absolute; left:84px; right:72px; bottom:26px; display:flex; justify-content:space-between; font-size:13px; letter-spacing:.06em; color:var(--ink-muted); text-transform:uppercase; }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A free live masterclass with Liza Libes, Invictus Prep',
    title:'The Story That Gets In',
    sub:'How to write a college application that admissions officers actually remember, from a Columbia-trained writer.' },

  {t:'content', kicker:'Who this is for',
    title:'If this is your family, you are in the right room',
    points:['You have a strong, hard-working student and you still feel invisible in the pile.','You have been told to "stand out" and nobody can tell you how.','You want help that respects who your kid actually is, not a template that flattens them.'] },

  {t:'content', kicker:'The trap',
    title:'The arms race you were handed',
    points:['Every family is chasing the same scores, the same clubs, the same "impressive" resume.','Top schools now reject thousands of near-perfect applicants every year.','So stronger stats do not fix the real problem. They just raise the price of entry.'] },

  {t:'big', kicker:'The reframe',
    html:'Stats get you <span class="a">considered.</span><br>A story gets you <span class="a">chosen.</span>' },

  {t:'content', kicker:'Why this is true',
    title:'An admissions officer is a reader',
    points:['They read hundreds of files in a season, late at night, fast.','Numbers blur together. A real person on the page does not.','The question in their head is simple: do I remember this student tomorrow?'] },

  {t:'section', n:'Part One', label:'The core problem', title:'Your application is a pile of parts, not a person' },

  {t:'content', kicker:'Part One',
    title:'The résumé problem',
    points:['Essays, activities and recommendations are usually written in isolation.','Each one is fine on its own. Together they do not add up to anyone.','A reader cannot hold ten disconnected facts. They can hold one person.'] },

  {t:'big', kicker:'Part One',
    html:'The goal is not to <span class="a">list</span> more.<br>It is to <span class="a">mean</span> one thing.' },

  {t:'section', n:'Part Two', label:'The method', title:'The three-in-one way we build an application that reads as one person' },

  {t:'content', kicker:'Part Two, pillar one',
    title:'Narrative building',
    points:['Start from the student, not the schools. Find the one true through-line.','Line up essays, activities and recommendations behind that single spine.','Now every part is saying the same thing about the same person.'] },

  {t:'content', kicker:'Part Two, pillar two',
    title:'The essay only you could write',
    points:['Authentic over impressive. We write the real student, not what a committee "wants".','Concrete, voiced, specific. The craft a working writer brings to the page.','If your essay could have someone else’s name on it, it is not done.'] },

  {t:'content', kicker:'Part Two, pillar three',
    title:'A major with a destination',
    points:['Career coaching so the application points somewhere real.','When the direction is honest, the whole story becomes believable.','This is the difference between "I did a lot" and "I am going somewhere".'] },

  {t:'big', kicker:'Part Two',
    html:'One spine. One voice.<br>One <span class="a">unforgettable</span> application.' },

  {t:'section', n:'Part Three', label:'The same student, read two ways', title:'What changes when the story is right' },

  {t:'content', kicker:'Part Three',
    title:'Before and after, on the same student',
    points:['Before: a capable kid who sounds like every other capable kid.','After: a specific person a reader can picture, argue for, and remember.','Same grades. Same activities. A completely different read.'] },

  {t:'content', kicker:'Part Three',
    title:'What we have seen it do',
    points:['Students placed at Harvard, Yale, Princeton, MIT and Columbia.','Hundreds of families coached through the process.','A method built by an author and an English major, not a test-prep script.'] },

  {t:'content', kicker:'Why Invictus',
    title:'Who is teaching this',
    points:['Liza Libes: BA and MA in English from Columbia, published poet and novelist.','A college-readiness team with graduate degrees from elite institutions.','We believe you can achieve almost anything if you believe in your own potential. That is where the name Invictus comes from.'] },

  {t:'cta', kicker:'Your next step',
    title:'Build your student’s real story with us',
    body:'If the authentic-story approach is right for your family, the College Readiness program walks your student through all three pillars from first draft to submission. The best place to start is a free trial call.',
    cta:'Book your free trial call at invictusprep.org',
    disclaimer:'Educational content only. Admissions outcomes depend on many factors outside any program’s control, and no result is promised or guaranteed. Past student placements are examples, not predictions of your result.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide';
  let inner = '';
  if (s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if (s.t === 'title') {
    inner += `<h1>${s.title}</h1>`;
    if (s.sub) inner += `<div class="sub">${s.sub}</div>`;
  } else if (s.t === 'section') {
    inner += `<div class="snum">${s.n}</div><h1>${s.title}</h1><div class="sub">${s.label}</div>`;
  } else if (s.t === 'big') {
    inner += `<div class="big">${s.html}</div>`;
  } else if (s.t === 'cta') {
    inner += `<h1>${s.title}</h1><div class="panel"><div class="sub" style="margin-top:0;max-width:100%">${s.body}</div></div>`;
    inner += `<span class="ctaline">${s.cta}</span>`;
    inner += `<div class="disclaimer">${s.disclaimer}</div>`;
  } else {
    inner += `<h2>${s.title}</h2>`;
    if (s.points) inner += '<ul>' + s.points.map(p => `<li>${p}</li>`).join('') + '</ul>';
  }
  inner += `<div class="foot"><span>Invictus Prep</span><span>${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span></div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
