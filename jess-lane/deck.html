<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Design for the Future of Work — The Full Cup Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f2;        /* her cream ground */
    --panel:#eef0f6;     /* soft indigo-cream tint */
    --ink:#2f3a60;       /* her deep indigo */
    --accent:#2f3a60;    /* her one dominant brand hex */
    --muted:#6a7290;
    --line:#d8dbe7;
    --head:'Urbanist',system-ui,sans-serif;  /* her heading face */
    --body:'Poppins',system-ui,sans-serif;   /* her body face */
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--line);border-radius:18px;
    padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(47,58,96,.04)}
  .slide.alt{background:var(--panel)}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;margin:0 0 16px;letter-spacing:-.01em}
  .sub{font-size:19px;line-height:1.55;color:var(--muted);margin:0 0 10px;max-width:46ch}
  p{font-size:18px;line-height:1.6;margin:0 0 12px;max-width:52ch}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:18px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--line);max-width:54ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .stage{font-family:var(--head);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
  .big{font-size:58px}
  .cta h1{font-size:48px}
  .foot{font-family:var(--body);font-size:14px;color:var(--muted);margin-top:26px}
  .disc{font-size:13px;color:var(--muted);margin-top:18px;max-width:60ch;line-height:1.5}
  .pg{font-family:var(--body);font-size:12px;color:var(--muted);text-align:right;margin:-8px 4px 0}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',cls:'alt',kick:'A LIVE MASTERCLASS WITH JESS LANE',h:'Career Design for the Future of Work',sub:'The Full Cup Method for designing and launching your next chapter, on purpose.'},
  {t:'promise',kick:'WHAT YOU WILL LEAVE WITH',h:'By the end of this training',list:['Why the resume-and-apply reflex quietly fails senior leaders','The four stages of the Full Cup Method, start to finish','A clear first step to design your next chapter instead of waiting for it']},
  {t:'who',cls:'alt',kick:'WHO THIS IS FOR',h:'This is for you if',list:['You are a senior leader who is done climbing a ladder that keeps moving','You were laid off, or you are quietly ready, and the next obvious job looks like the last one','You want to design what is next, not just find another seat']},
  {t:'trap',kick:'THE REFLEX',h:'When the chapter ends, most leaders reach for the resume',p:['Polish the resume. Update the title. Start applying. It feels productive, so we do it first.',"The trouble is it starts with the market and the job board, and it asks you to be a slightly better version of the role you just left."]},
  {t:'reframe',cls:'alt',kick:'THE HARD TRUTH',h:'The ladder you were climbing is already gone',p:['Work is changing at a scale we have not seen in a century. The 30-year, one-ladder career is not coming back.','The leaders who thrive will not compete with AI or wait for permission. They will design work around what only they can do.']},
  {t:'part',kick:'PART ONE',h:'Why the old playbook fails'},
  {t:'content',kick:'THE PROBLEM',h:'Market-first thinking makes you interchangeable',p:['Lead with the resume and you describe yourself in the market’s language, next to everyone else who held that title.',"Lead with your life and you describe something no one can copy. That is the whole difference."]},
  {t:'content',cls:'alt',kick:'THE COST',h:'What the old reflex actually costs you',list:['You take the next role that looks like the last, then feel the same drift a year in','You negotiate from fear instead of from a validated direction','You hand your runway to a search instead of a design']},
  {t:'part',cls:'alt',kick:'PART TWO',h:'The Full Cup Method'},
  {t:'content',kick:'THE CORE IDEA',h:'Start with you, not the job market',p:['The Full Cup Method is the only career design framework built on Master’s level psychology, two decades of Fortune 500 go-to-market, and future of work intelligence.','It runs in four stages. The order is the point.']},
  {t:'stage',kick:'STAGE ONE',s:'Assess and Reflect',h:'Develop your Blueprint of One',list:['The themes that keep showing up across your career','The values you will not trade','The skills only you combine, and the impact you are built to make'],foot:'Credentials come later. This is what makes you irreplaceable.'},
  {t:'stage',cls:'alt',kick:'STAGE TWO',s:'Align and Define',h:'Map the opportunities that fit the blueprint',list:['Match real directions to what Stage One surfaced','Validate demand and pricing in the market','Apply Fortune 500 go-to-market strategy to your own positioning']},
  {t:'stage',kick:'STAGE THREE',s:'Test and Build',h:'Prototype before you commit years',list:['Position and test the direction in the real world','Run a 90-day validation while you are still employed','Remove the guesswork before you ever hand in the badge']},
  {t:'stage',cls:'alt',kick:'STAGE FOUR',s:'Launch Your Exit Plan',h:'Build the architecture of the leap',list:['A timeline you can actually act on','A financial runway with a real month-count','The activation steps that turn a plan into a launch']},
  {t:'content',kick:'THE CHECKLIST',h:'Six things that should exist before you leave',list:['A named direction, validated against real demand','A runway with a specific number of months','A positioning narrative with proof points','At least one real engagement that confirms interest','Relationships you activated on purpose','Your first 90 days already scheduled']},
  {t:'part',kick:'PART THREE',h:'Life first, and the work follows'},
  {t:'content',cls:'alt',kick:'THE SHIFT',h:'Lead with your life, not your resume',p:['Non-linear is the new normal. Fractional work, more than one income stream, a mission-driven pivot, these are viable now, not reckless.','Your judgment, intuition and creativity become the premium. The method helps you build around them instead of apologizing for them.']},
  {t:'why',kick:'WHY LISTEN TO ME',h:'I designed my own exit the hard way first',p:['I spent 20-plus years leading marketing and growth for Fortune 500 and high-growth tech brands, and helped take a company to unicorn status. Then I was laid off, right before the holidays, at 41.','So I went and earned a Master’s in Psychology and built the method I wish I had that year. The Full Cup Co. is what came out of it.']},
  {t:'recap',cls:'alt',kick:'THE RECAP',h:'The next chapter is designed, not discovered',list:['Start with you, the Blueprint of One, not the job board','Validate and prototype before you leap','Launch on a plan, with runway and a direction you believe in']},
  {t:'cta',cls:'cta',kick:'YOUR NEXT STEP',h:'Design your next chapter',p:['If you want help running your own exit through the Full Cup Method, book a free strategy call with me at fullcupco.com.','We will map where you are and what your Strategic Executive Exit could look like.'],disc:'This training is educational. No income, role, or outcome is guaranteed. Results vary and depend on your own circumstances, effort, and decisions.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.cls||'');
  let html='';
  if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
  if(s.stage||s.s){ if(s.s) html+='<div class="stage">'+s.s+'</div>'; }
  if(s.h) html+=(s.t==='title'||s.t==='reframe'?'<h1'+(s.t==='reframe'?' class="big"':'')+'>':'<h1>')+s.h+'</h1>';
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.p){ s.p.forEach(x=>html+='<p>'+x+'</p>'); }
  if(s.list){ html+='<ul>'; s.list.forEach(x=>html+='<li>'+x+'</li>'); html+='</ul>'; }
  if(s.foot) html+='<div class="foot">'+s.foot+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
  const pg=document.createElement('div'); pg.className='pg'; pg.textContent=(i+1)+' / '+S.length; deck.appendChild(pg);
});
</script>
</body>
</html>
