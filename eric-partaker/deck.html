<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale in Parallel — The Peak-Performance CEO Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#f7f8fb;
    --rule:#e4e7ee;
    --ink:#282828;
    --muted:#555555;
    --accent:#3399da;
    --navy:#1c244b;
    --display:'Encode Sans Condensed',system-ui,sans-serif;
    --body:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#d9dde6;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:6px;aspect-ratio:16/9;margin:0 0 24px;padding:64px 72px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 1px 3px rgba(28,36,75,.06);
  }
  .kick{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:14px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;color:var(--navy);line-height:1.02;
    font-size:64px;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;color:var(--navy);line-height:1.05;
    font-size:44px;letter-spacing:-.01em;margin-bottom:20px}
  p{font-size:21px;line-height:1.5;color:var(--ink);max-width:40ch}
  p.lead{font-size:25px;color:var(--muted)}
  .promise{margin-top:24px;font-size:22px;color:var(--muted);max-width:46ch}
  .num{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);
    border:2px solid var(--accent);border-radius:50%;width:46px;height:46px;
    display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.4;color:var(--ink);padding:12px 0;border-top:1px solid var(--rule);
    display:flex;gap:14px;align-items:baseline}
  li:last-child{border-bottom:1px solid var(--rule)}
  li b{font-family:var(--display);color:var(--navy);font-weight:600;min-width:26px}
  .track{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
  .track .col{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:24px}
  .track h3{font-family:var(--display);color:var(--navy);font-size:22px;margin-bottom:8px}
  .track p{font-size:17px;color:var(--muted)}
  .big{font-family:var(--display);font-weight:700;color:var(--navy);font-size:88px;line-height:.95}
  .reframe h2{font-size:52px;max-width:20ch}
  .cta{background:var(--navy)}
  .cta .kick{color:var(--accent)}
  .cta h2{color:#ffffff}
  .cta p{color:#e4e7ee}
  .cta .step{margin-top:24px;font-family:var(--display);font-weight:600;font-size:24px;color:#ffffff}
  .cta .disc{margin-top:auto;font-size:13px;color:#9aa2c0;max-width:60ch;line-height:1.5;padding-top:28px}
  .credit li b{color:var(--accent)}
  .footeric{position:absolute;bottom:22px;right:32px;font-family:var(--display);
    font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#aab0bd}
  .slide.cta .footeric{color:#6f78a0}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title',kick:'A live masterclass with Eric Partaker',h:'Scale in Parallel',
   promise:'How to grow the CEO as fast as the company, so the founder stops being the ceiling.'},

  {t:'who',kick:'Who this is for',h:'You built something real. And it all still runs through you.',
   lead:'Founders and CEOs past the scrappy stage: real revenue, a real team, and a nagging sense that the business now moves at the speed of your own bandwidth.'},

  {t:'reframe',kick:'The uncomfortable part',h:'Your company outgrew you, and nobody told you.',
   lead:'The org chart grew. The seat did not. So every decision, every bottleneck, every ceiling traces back to the same place.'},

  {t:'part',num:'1',kick:'Part one',h:'The leader-company gap',
   lead:'You scaled the company faster than you scaled yourself. That gap is the real growth constraint, and no new hire closes it for you.'},

  {t:'list',kick:'Why the usual fixes stall',h:'More of the same does not move the ceiling',
   items:[['1','Hire more people, and more decisions still route back to you.'],
          ['2','Add more systems, and you become the operator of the systems.'],
          ['3','Work more hours, and the business inherits your exhaustion.']]},

  {t:'lead',kick:'The shift',h:'Fix the seat, not just the structure',
   lead:'When the person in the CEO seat levels up, everything downstream changes: clarity, delegation, standards, energy. The company can only scale as far as its CEO does.'},

  {t:'part',num:'2',kick:'Part two',h:'The Three-Pillar CEO Model',
   lead:'The model behind everything I coach. Three pillars, run at the same time, never one before the others.'},

  {t:'list',kick:'Scale in parallel',h:'Three pillars, one operator',
   items:[['A','Scale Your Company: the growth constraint, the operating rhythm, the numbers.'],
          ['B','Become a Great CEO: leadership, delegation, the standards you hold.'],
          ['C','Become a Peak Performer: the health, focus and resilience it all runs on.']]},

  {t:'part',num:'3',kick:'The engine',h:'The 3 Alarms',
   lead:'The daily operating system underneath peak performance. Instead of one alarm to wake up, you wake up to three versions of yourself, every day.'},

  {t:'list',kick:'The 3 Alarms',h:'Who you wake up as',
   items:[['1','The healthiest you: energy is the input to every other output.'],
          ['2','The wealthiest you: mastery and contribution in the work that matters.'],
          ['3','The most loving you: the relationships that outlast any company.']]},

  {t:'lead',kick:'How it works',h:'Champions, not resolutions',
   lead:'Each alarm is anchored to a role model you choose, a champion proof of who you are becoming. Identity first, behaviour second. That is what makes it stick when the pressure comes.'},

  {t:'part',num:'IPA',kick:'The three keys',h:'Identity. Productivity. Antifragility.',
   lead:'The three levers of peak performance, in order. Get them in sequence and output compounds.'},

  {t:'list',kick:'IPA',h:'The three keys, unpacked',
   items:[['I','Identity: decide who you are, and behaviour follows the identity.'],
          ['P','Productivity: protect the few hours that actually move the company.'],
          ['A','Antifragility: build a CEO who gets stronger under load, not just survives it.']]},

  {t:'track',kick:'Part three: the parallel-scaling CEO',h:'Two tracks, moving together',
   cols:[['The company','A clear constraint, an operating rhythm the team runs without you, and numbers you can read at a glance.'],
         ['The CEO','Sharper identity, protected focus, and the resilience to hold standards when the quarter gets hard.']]},

  {t:'lead',kick:'The result',h:'The founder stops being the ceiling',
   lead:'When both tracks move in parallel, growth stops depending on your personal bandwidth. The business scales because the person running it did first.'},

  {t:'credit',kick:'Why me',h:'I have sat in this seat',
   items:[['','Early team at Skype, then McKinsey, then co-founded and scaled Chilango.'],
          ['','Named CEO of the Year at the 2019 Business Excellence Forum.'],
          ['','Author of The 3 Alarms; I now coach founders and CEOs on exactly this.']]},

  {t:'lead',kick:'The path',h:'Scale the company and the CEO at the same time',
   lead:'That is the whole method: the Three-Pillar model, the 3 Alarms, and IPA, run in parallel until the seat is as big as the company needs it to be.'},

  {t:'cta',kick:'Your next step',h:'Ready to scale in parallel?',
   lead:'If you want to work through this on your own business, the Founder & CEO Accelerator is the ten-week live cohort where we build it out together.',
   step:'Apply for the Founder & CEO Accelerator at ericpartaker.com',
   disc:'This masterclass is for educational purposes only. It is not financial, legal, or business advice, and no specific result, income, or outcome is guaranteed. Results vary and depend on many factors outside any program.'}
];

const deck=document.getElementById('deck');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
S.forEach(function(s){
  const d=document.createElement('div');
  d.className='slide '+s.t;
  let h='';
  if(s.kick) h+='<div class="kick">'+esc(s.kick)+'</div>';
  if(s.num) h+='<div class="num">'+esc(s.num)+'</div>';
  if(s.t==='title'){h+='<h1>'+esc(s.h)+'</h1>'; if(s.promise)h+='<p class="promise">'+esc(s.promise)+'</p>';}
  else if(s.h){h+='<h2>'+esc(s.h)+'</h2>';}
  if(s.lead) h+='<p class="lead">'+esc(s.lead)+'</p>';
  if(s.items){h+='<ul>';s.items.forEach(function(it){h+='<li><b>'+esc(it[0])+'</b><span>'+esc(it[1])+'</span></li>';});h+='</ul>';}
  if(s.cols){h+='<div class="track">';s.cols.forEach(function(c){h+='<div class="col"><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p></div>';});h+='</div>';}
  if(s.step) h+='<div class="step">'+esc(s.step)+'</div>';
  if(s.disc) h+='<div class="disc">'+esc(s.disc)+'</div>';
  h+='<div class="footeric">Eric Partaker</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
