<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Portfolio Sets Your Price, a Masterclass with D'Arcy Benincosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f1;        /* warm cream ground, from her editorial-luxury brand */
    --panel:#f3ece3;     /* curated paper panel */
    --rule:#e6dcce;      /* hairline */
    --ink:#2a1f18;       /* espresso text */
    --soft:#6d5d4f;      /* muted warm grey */
    --accent:#a53a0a;    /* her documented brand rust (brand.json #a53a0a) */
    --display:"Playfair Display",Georgia,serif;
    --body:"Jost",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;line-height:1.5}
  #deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:4px;
    padding:64px 60px;margin:0 0 22px;min-height:66vh;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .num{position:absolute;top:26px;right:30px;font-family:var(--display);font-style:italic;
    color:var(--accent);opacity:.5;font-size:15px;letter-spacing:.04em}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,64px);line-height:1.04;
    letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--display);font-weight:700;font-size:clamp(27px,4vw,42px);line-height:1.1;
    margin-bottom:20px}
  .lede{font-size:clamp(18px,2.2vw,23px);color:var(--soft);max-width:30ch;line-height:1.45}
  p.body{font-size:clamp(16px,1.7vw,19px);color:var(--ink);max-width:62ch;margin-bottom:16px}
  .sig{font-family:var(--display);font-style:italic;font-size:19px;color:var(--soft);margin-top:30px}
  .hr{height:1px;background:var(--rule);width:100%;margin:26px 0}
  .accentbar{width:64px;height:3px;background:var(--accent);margin:0 0 26px}
  ul{list-style:none;margin:10px 0 0}
  li{position:relative;padding:14px 0 14px 34px;border-top:1px solid var(--rule);
    font-size:clamp(16px,1.7vw,19px);max-width:64ch}
  li:first-child{border-top:0}
  li .ix{position:absolute;left:0;top:14px;font-family:var(--display);font-style:italic;
    color:var(--accent);font-size:17px}
  li b{font-weight:600}
  .big{font-family:var(--display);font-weight:700;font-size:clamp(40px,8vw,88px);
    color:var(--accent);line-height:1;letter-spacing:-.02em}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:30px 32px}
  .quote{font-family:var(--display);font-style:italic;font-size:clamp(22px,3vw,33px);
    line-height:1.3;max-width:24ch}
  .disc{font-size:13px;color:var(--soft);line-height:1.5;margin-top:26px;max-width:70ch}
  .cta-btn{display:inline-block;margin-top:14px;background:var(--accent);color:#fff;
    font-weight:600;letter-spacing:.03em;padding:15px 30px;border-radius:3px;text-decoration:none;
    font-size:16px}
  .brand{font-family:var(--display);letter-spacing:.02em}
  @media(max-width:720px){.slide{padding:44px 26px}.two{grid-template-columns:1fr;gap:24px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title',k:'A live masterclass with D’Arcy Benincosa',h:'Your Portfolio Sets Your Price',
   s:'How curated, luxury-level work turns a talented photographer into a 5-figure booking.'},

  {t:'who',k:'Who this is for',h:'You can shoot. You’re just not getting paid like it.',
   body:['You are a talented photographer who books steadily, yet the clients paying 5 figures keep choosing someone whose work is not objectively better than yours.',
   'This hour is for the photographer who is ready to stop competing on price and start being chosen for the feeling their work gives.']},

  {t:'trap',k:'The trap',h:'More sessions is not the answer.',
   body:['The usual advice is to shoot more, post more, discount to fill the calendar. So you do, and you end up busier, more exhausted, and still priced like everyone else.',
   'Volume is the trap. It hides the one lever that actually moves your price.']},

  {t:'reframe',k:'The reframe',quote:'Luxury clients do not buy your skill. They buy what your portfolio makes them feel they are becoming.'},

  {t:'part',k:'Part one',h:'The real problem is signal, not talent.',
   body:['A high-end client cannot judge your technical skill. What they can read, instantly, is whether your portfolio looks like the life they want.',
   'When your gallery is a mix of everything you have ever shot, it signals "safe and affordable." A curated, intentional body of work signals "this is the one." Same camera, same you, a completely different price.']},

  {t:'list',k:'Part one',h:'What a scattered portfolio quietly costs you',
   items:[['The wrong yes','You attract the clients who shop on price, because that is who your mixed gallery speaks to.'],
   ['The invisible ceiling','Your rates stall, not because you are not good, but because nothing signals that you are worth more.'],
   ['The comparison game','You end up competing on packages and discounts instead of being the obvious, only choice.']]},

  {t:'part',k:'Part two',h:'The Profitable Portfolio method',
   body:['Curation is not deleting your worst images. It is deliberately building a body of work that sets a price in the client’s mind before you ever send a quote.',
   'Here is the method I used to go from a scattered shooter to a destination photographer, broken into the pieces you can act on this week.']},

  {t:'list',k:'Part two · the method',h:'The five levers of a price-setting portfolio',
   items:[['Curation','Show one clear story, not everything. A tight, intentional gallery reads as expensive before a word about price is spoken.'],
   ['Posing','Direct your subjects so every frame looks effortless and editorial, the quiet marker of high-end work.'],
   ['Signature style','A consistent, recognizable edit so a client can spot your work across a room. Style is what they cannot get anywhere else.'],
   ['Pricing psychology','Position and present your rates so the number reads as an investment, not a cost.'],
   ['Client experience','Design a luxury experience end to end so referrals and repeat bookings compound on their own.']]},

  {t:'two-quote',k:'Part two · curation',quote:'Your portfolio is the price tag clients read before they ever ask what you charge.',
   body:['Every image you show is a vote for the kind of client you want. Curation is choosing, on purpose, which votes to cast.',
   'When the story is clear, the premium client sees themselves in it and self-selects. You stop convincing and start being chosen.']},

  {t:'list',k:'Part two · signature style',h:'Why a signature style raises your floor',
   items:[['Recognition','A consistent edit makes your work identifiable, and identifiable work is referable.'],
   ['Scarcity','If your look lives only with you, there is no comparison shopping on style.'],
   ['Trust','Consistency tells a nervous high-end client exactly what they will receive, which is what lets them say yes to a big number.']]},

  {t:'part',k:'Part two · pricing psychology',h:'Your number is a story, not a cost.',
   body:['A luxury client is not comparing your price to the photographer down the road. They are comparing it to the feeling your portfolio just gave them.',
   'Present the investment the way a designer presents a gown: as the natural price of the experience they already want. The curated work does that framing for you, so the number reads as obvious instead of high.']},

  {t:'list',k:'Part two · client experience',h:'The experience that compounds your bookings',
   items:[['The welcome','A considered inquiry and onboarding tells a high-end client they chose correctly before the shoot ever happens.'],
   ['The day','Direction and calm on set produce the effortless frames that become your next portfolio, and your next referral.'],
   ['The after','A luxury delivery and follow-up turns one 5-figure client into three, without spending a dollar on ads.']]},

  {t:'part',k:'Part three',h:'When the gallery closes the client before the call',
   body:['When your gallery is curated, styled, and unmistakably yours, the conversation changes. Inquiries arrive already sold on the feeling and far less sensitive to price.',
   'You raise your rates and the right clients keep coming, because the work is doing the persuading before the call even starts.']},

  {t:'list',k:'Do this first',h:'Three moves you can make this week',
   items:[['Cut to the story','Pull your public gallery down to the fifteen images that sell the client you actually want. Hide the rest.'],
   ['Name your look','Write one sentence describing your signature style, then edit your next session to match it exactly.'],
   ['Lead with the feeling','Rewrite your inquiry reply to speak to the experience and the outcome before you ever mention a package.']]},

  {t:'list',k:'Part three',h:'The shift you are building toward',
   items:[['Before','A full calendar of price-shoppers, rates that will not move, and a gallery that says "safe."'],
   ['After','Fewer, better clients at 5-figure numbers, booked by a portfolio that signals "the one" on sight.']]},

  {t:'credibility',k:'Why listen to me',h:'I built this the brave way.',
   body:['I left a government job that capped me at $50,000 a year while I was making only $16,000 from photography. I decided to play it brave.',
   'My first year full time, I took that business from $16,000 to $120,000 in revenue in eleven months. Since then I have built three six-figure businesses and one seven-figure business, and taught this method to thousands of photographers and creative entrepreneurs.'],
   sig:'D’Arcy Benincosa, #playitbrave'},

  {t:'two-stat',k:'The proof is in the work',stat:'$16k → $120k',statcap:'My own revenue, in eleven months, once the portfolio did the selling.',
   body:['2,410+ students taught. 170+ photographers and creative entrepreneurs coached one on one.',
   'Not because they bought more gear or shot more weddings, but because they curated work that set a higher price.']},

  {t:'list',k:'Recap',h:'What to take from this hour',
   items:[['Price is signal','Curation, not talent, is what moves your number in a luxury client’s mind.'],
   ['Style is your moat','A signature look removes you from the comparison game entirely.'],
   ['The portfolio sells first','Build the gallery that does the persuading, and the premium clients self-select.']]},

  {t:'cta',k:'Your next step',h:'Ready to build a portfolio that sets your price?',
   body:['If you want help applying this to your own work, this is exactly what we do inside my coaching and the Self Made Mastermind: curate the portfolio, lock in your signature style, and raise your rates with the work to back it.'],
   link:'https://darcybenincosa.com/coaching',linklabel:'Work with D’Arcy',
   disc:'This masterclass is educational. It shares the method and my own results. No income or specific result is guaranteed. Results vary and depend on your market, your effort, and many factors outside this masterclass. Nothing here is financial advice.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  const num=String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  let inner='<span class="num">'+num+'</span>';
  if(s.k) inner+='<div class="kicker">'+s.k+'</div>';
  if(s.t==='title'){
    inner+='<div class="accentbar"></div><h1>'+s.h+'</h1><p class="lede">'+s.s+'</p>';
  } else if(s.t==='reframe'){
    inner+='<p class="quote">“'+s.quote+'”</p>';
  } else if(s.t==='two-quote'){
    inner+='<div class="two"><p class="quote" style="color:var(--accent)">“'+s.quote+'”</p><div>'+
      s.body.map(b=>'<p class="body">'+b+'</p>').join('')+'</div></div>';
  } else if(s.t==='two-stat'){
    inner+='<div class="two"><div class="panel"><div class="big">'+s.stat+'</div><p class="body" style="margin-top:14px;color:var(--soft)">'+s.statcap+'</p></div><div>'+
      '<h2 style="font-size:clamp(22px,3vw,32px)">The work does the selling.</h2>'+s.body.map(b=>'<p class="body">'+b+'</p>').join('')+'</div></div>';
  } else if(s.t==='list'){
    inner+='<h2>'+s.h+'</h2><ul>'+s.items.map((it,n)=>'<li><span class="ix">0'+(n+1)+'</span><b>'+it[0]+'.</b> '+it[1]+'</li>').join('')+'</ul>';
  } else if(s.t==='credibility'){
    inner+='<h2>'+s.h+'</h2>'+s.body.map(b=>'<p class="body">'+b+'</p>').join('')+'<p class="sig">'+s.sig+'</p>';
  } else if(s.t==='cta'){
    inner+='<div class="accentbar"></div><h2>'+s.h+'</h2>'+s.body.map(b=>'<p class="body">'+b+'</p>').join('')+
      '<div><a class="cta-btn" href="'+s.link+'">'+s.linklabel+'</a></div>'+
      '<p class="disc">'+s.disc+'</p>';
  } else { // who / trap / part
    inner+='<h2>'+s.h+'</h2>'+s.body.map(b=>'<p class="body">'+b+'</p>').join('');
  }
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
