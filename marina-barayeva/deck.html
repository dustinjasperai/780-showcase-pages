<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Big Idea - a masterclass with Marina Barayeva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2;
  --panel:#f1ebe0;
  --rule:#e3dccd;
  --ink:#1a1a1a;
  --dim:#6b6b6b;
  --accent:#C0432B;
  --serif:'Spectral',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 8vw}
.slide{width:100%;max-width:980px;display:none;animation:fade .45s ease}
.slide.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.k{font-family:var(--sans);font-weight:700;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:1.4rem}
.k .dim{color:var(--dim)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.04;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.1;letter-spacing:-.01em}
.sub{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--dim);font-size:clamp(1.1rem,2.2vw,1.5rem);margin-top:1.4rem;max-width:34ch}
.body{font-size:clamp(1.05rem,1.7vw,1.28rem);line-height:1.6;color:#2a2a2a;margin-top:1.6rem;max-width:56ch}
.body.tight{margin-top:1.1rem}
ul{list-style:none;margin-top:1.8rem;display:grid;gap:1rem;max-width:60ch}
li{position:relative;padding-left:1.7rem;font-size:clamp(1.02rem,1.6vw,1.22rem);line-height:1.5;color:#2a2a2a}
li:before{content:"";position:absolute;left:0;top:.55em;width:.6rem;height:.6rem;background:var(--accent);border-radius:50%}
li b{font-weight:700;color:var(--ink)}
.num{font-family:var(--serif);font-size:clamp(3.4rem,9vw,6.5rem);font-weight:400;color:var(--accent);line-height:1;margin-bottom:1rem}
.big{font-family:var(--serif);font-size:clamp(2rem,4.6vw,3.2rem);line-height:1.14;font-weight:500;max-width:20ch}
.big .em{color:var(--accent);font-style:italic}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:clamp(1.6rem,3vw,2.6rem)}
.foot{margin-top:2rem;font-size:.92rem;color:var(--dim);max-width:52ch;line-height:1.5}
.pillar-name{font-family:var(--serif);font-weight:600;color:var(--accent);font-size:clamp(1.6rem,3.4vw,2.4rem)}
.lead{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:clamp(1.2rem,2.4vw,1.7rem);line-height:1.4;max-width:30ch}
.cta-lines{margin-top:1.8rem;display:grid;gap:.9rem;max-width:40ch}
.cta-lines div{font-size:clamp(1.05rem,1.7vw,1.25rem);line-height:1.5}
.cta-lines b{color:var(--accent)}
.discl{margin-top:2.4rem;font-size:.82rem;color:var(--dim);max-width:56ch;line-height:1.55}
.site{margin-top:1.4rem;font-family:var(--sans);font-weight:700;letter-spacing:.02em;font-size:1.05rem}
.rule{width:64px;height:3px;background:var(--accent);margin:1.6rem 0 0}
#hud{position:fixed;left:0;right:0;bottom:0;height:3px;background:var(--rule)}
#bar{height:100%;width:0;background:var(--accent);transition:width .3s}
#count{position:fixed;bottom:16px;right:22px;font-family:var(--sans);font-size:.78rem;letter-spacing:.14em;color:var(--dim)}
#nav{position:fixed;bottom:14px;left:22px;font-size:.78rem;color:var(--dim);letter-spacing:.06em}
kbd{font-family:var(--sans);background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:1px 6px;color:var(--ink)}
.byline{margin-top:2.6rem;font-family:var(--sans);font-size:.95rem;color:var(--dim);letter-spacing:.02em}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"><div id="bar"></div></div>
<div id="count"></div>
<div id="nav">Use <kbd>&larr;</kbd> <kbd>&rarr;</kbd> or click</div>
<script>
const S = [
  {t:"title", k:"A live masterclass", h:"The Big Idea", sub:"Why the best talks are built on one idea, not more slides - and how to find yours.", byline:"With Marina Barayeva - Public Speaking &amp; TEDx Coach"},

  {t:"content", k:"Who this is for", h:"You have a message. It just isn&rsquo;t landing yet.", body:"You are an entrepreneur, a leader, a changemaker. You know your field cold. You have spoken before. And still the room nods politely, forgets the talk by the parking lot, and nobody asks you back. This hour is about fixing that at the root."},

  {t:"content", k:"The trap", h:"So you add more.", body:"More slides. More frameworks. More stories crammed into twenty minutes. It feels like progress. It is the opposite. Every extra idea you add makes the one that mattered harder to find, and the audience leaves with none of them."},

  {t:"reframe", k:"The real reason", big:"A forgettable talk is almost never a <span class='em'>delivery</span> problem. It is a <span class='em'>focus</span> problem.", foot:"Nerves, slides, and gestures get all the attention because they are visible. But a calm, polished speaker with no single idea is still forgettable. My own 2019 TEDx taught me that the hard way."},

  {t:"section", num:"One", h:"The Core Problem", lead:"Why expertise alone does not make you memorable."},

  {t:"content", k:"Part one", h:"Expertise is not a message.", body:"You were rewarded your whole career for knowing more than the room. On a stage, that instinct works against you. The audience cannot hold everything you know. They can hold one thing. The speaker who decides what that one thing is wins the room. The one who tries to say it all loses it."},

  {t:"content", k:"Part one", h:"The &ldquo;Only I&hellip;&rdquo; test.", body:"Finish this sentence out loud: &ldquo;Only I&hellip;&rdquo; If you cannot complete it in a way that is true, specific, and yours, you do not yet have a big idea, you have a topic. And if you do not know what sets you apart, you do not really have a personal brand either.", foot:"This is the first thing we work on together, before a single slide exists."},

  {t:"section", num:"Two", h:"The Method", lead:"Three moves that turn what you know into a talk people repeat."},

  {t:"pillar", k:"The method - move 1", name:"Find Your Big Idea", body:"We dig past the topic to the one ownable idea you are meant to be known for. Not &ldquo;public speaking.&rdquo; Not &ldquo;marketing.&rdquo; The single sentence only you can say, sharpened until it is impossible to misremember."},

  {t:"pillar", k:"The method - move 2", name:"Shape It Into a Signature Talk", body:"An idea is not a talk. We build the structure around a story so the idea carries - a beginning that earns attention, a middle that proves the point, an ending that sends people out changed. This is the framework I use for writing the story itself."},

  {t:"pillar", k:"The method - move 3", name:"Deliver It With Confidence", body:"Only now do we work on the stage: structure you can feel under you, delivery that serves the idea instead of decorating it. Confidence is what is left when you are no longer hoping the audience remembers everything, because you built the talk so they remember one thing."},

  {t:"content", k:"The whole point", h:"A good speech comes full circle.", body:"From you, the speaker who speaks with impact, to the audience whose lives are changed, to the many others who want the same result. That circle is what grows a business. It does not start with charisma. It starts with the idea."},

  {t:"content", k:"After the talk", h:"One idea, said everywhere.", body:"The big idea does not stay on the stage. It becomes how you introduce yourself, what your content returns to, the reason a stranger remembers you a week later.", list:["<b>Clarity of direction</b> - you know what you want to be known for","<b>The right rooms</b> - two or three places your audience already gathers, not all of them","<b>Proof on display</b> - your talks, writing, and results, working as evidence","<b>Consistency</b> - the same idea, aligned across every place you show up"]},

  {t:"section", num:"Three", h:"When the Idea Lands", lead:"The speaker who owns one idea, and where it takes them."},

  {t:"content", k:"What changes", h:"You stop competing on content.", body:"When you own an idea, you are no longer one more knowledgeable person in a crowded field. You are the person associated with that idea. The TEDx stage becomes reachable. Invitations start to find you. The talk does the selling before you ever pitch."},

  {t:"cred", k:"Why me", h:"I learned this by getting it wrong.", body:"I am Marina Barayeva - a former portrait photographer who built an international business from Beijing, and host of the Marketing for Creatives podcast. My 2019 TEDx underperformed with content I believed in. That failure sent me into what actually makes a talk land. Everything in this hour came out of it.", foot:"I now coach entrepreneurs, leaders and changemakers to find their big idea and get on the stages that matter."},

  {t:"content", k:"Before you build anything", h:"Where are you right now?", body:"Every speaker is at one of a few stages, and the wrong next move wastes months. Naming your stage tells you what actually moves you forward - and what to stop doing.", list:["<b>Finding your footing</b> - you speak, but the message drifts","<b>Sharpening</b> - you have talks, not yet one signature idea","<b>Scaling</b> - the idea is clear, now it needs bigger rooms"], foot:"My free guide, Level Up Your Public Speaking, walks through all of them."},

  {t:"reframe", k:"If you take one thing", big:"Do not try to be <span class='em'>unforgettable.</span> Be <span class='em'>rememberable</span> for one thing.", foot:"That is the whole method. Find the idea. Build the talk around it. Deliver it so it survives the walk to the car."},

  {t:"cta", k:"Work with me", h:"Find your big idea.", lines:["<b>Find Your Big Idea</b> - three sessions to uncover and sharpen the one idea you are meant to be known for","<b>TED Talk Coaching</b> - full development of a signature talk, from structure to the stage","<b>Speaking Strategy Session</b> - one focused call on your topic, structure, or TEDx application"], site:"marinabarayeva.com/coaching", discl:"This masterclass is educational. No specific speaking result, TEDx placement, or business outcome is guaranteed. Results vary and depend on your own work, message, and effort."}
];

const stage=document.getElementById('stage');
function esc(x){return x||''}
function render(d){
  let h='';
  const k = d.k ? `<div class="k">${d.k}</div>` : '';
  if(d.t==='title'){
    h=`${k}<h1>${d.h}</h1>${d.sub?`<div class="sub">${d.sub}</div>`:''}<div class="rule"></div>${d.byline?`<div class="byline">${d.byline}</div>`:''}`;
  }else if(d.t==='section'){
    h=`<div class="num">${d.num}</div><h2>${d.h}</h2>${d.lead?`<div class="lead">${d.lead}</div>`:''}`;
  }else if(d.t==='reframe'){
    h=`${k}<div class="big">${d.big}</div>${d.foot?`<div class="foot">${d.foot}</div>`:''}`;
  }else if(d.t==='pillar'){
    h=`${k}<div class="panel"><div class="pillar-name">${d.name}</div><div class="body tight">${d.body}</div></div>`;
  }else if(d.t==='cred'){
    h=`${k}<h2>${d.h}</h2><div class="body">${d.body}</div>${d.foot?`<div class="foot">${d.foot}</div>`:''}`;
  }else if(d.t==='cta'){
    h=`${k}<h2>${d.h}</h2><div class="cta-lines">${d.lines.map(l=>`<div>${l}</div>`).join('')}</div><div class="site">${d.site}</div><div class="discl">${d.discl}</div>`;
  }else{
    h=`${k}<h2>${d.h}</h2>${d.body?`<div class="body">${d.body}</div>`:''}${d.list?`<ul>${d.list.map(l=>`<li>${l}</li>`).join('')}</ul>`:''}${d.foot?`<div class="foot">${d.foot}</div>`:''}`;
  }
  return `<div class="slide">${h}</div>`;
}
stage.innerHTML = S.map(render).join('');
const slides=[...document.querySelectorAll('.slide')];
let i=0;
function show(n){
  i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,x)=>s.classList.toggle('on',x===i));
  document.getElementById('bar').style.width=((i+1)/slides.length*100)+'%';
  document.getElementById('count').textContent=(i+1)+' / '+slides.length;
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){show(i+1);e.preventDefault()}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){show(i-1)}
  if(e.key==='Home'){show(0)} if(e.key==='End'){show(slides.length-1)}
});
stage.addEventListener('click',e=>{
  const x=e.clientX/window.innerWidth; show(x<0.28?i-1:i+1);
});
show(0);
</script>
</body>
</html>
