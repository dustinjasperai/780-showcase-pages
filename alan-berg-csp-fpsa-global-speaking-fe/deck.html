<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Stop Selling, Start Booking · Alan Berg, Wedding Business Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbf7f4; --panel:#f4ebe6; --rule:#e4d7cf;
    --acc:#671148; --ink:#2a1522; --body:#5a4652; --dim:#9a8f93; --cream:#fbf6f2; --gold:#b8862f;
  }
  html,body{height:100%}
  body{background:#efe6df;font-family:'Open Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe6df}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Montserrat',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.12;letter-spacing:-.005em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%;font-weight:600}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.64;font-weight:400}
  .sub{font-family:'Montserrat',serif;font-size:1.9vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:700;color:var(--gold);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#521038 0%,#2a0a1c 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream);font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#521038 0%,#2a0a1c 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Open Sans',sans-serif;color:#ecd9e4;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--gold);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.5%;bottom:8%;width:15vw;opacity:.85}
  .corner-vf{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Open Sans',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(42,21,34,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Wedding Business Solutions</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: two overlapping wedding rings, drawn in plum -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rings" viewBox="0 0 140 100">
  <g fill="none" stroke="#671148" stroke-width="2.4">
    <circle cx="56" cy="52" r="34" opacity="0.9"/>
    <circle cx="90" cy="52" r="34" opacity="0.62"/>
    <path d="M56 16 l6 10 h-12 z" fill="#b8862f" stroke="none" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Stop Selling, Start Booking',sub:'How wedding pros turn more of the inquiries they already get into booked weddings, by helping couples buy the way they want to buy.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'The inquiries come in. Too many of them go quiet.',body:'You run a good wedding business and the inquiries do arrive. But too many open with "what is your price?", a lot of them ghost after the first reply, and the ones you win, you often win by quietly dropping your number. A slow month feels like it is one "you are too expensive" away.'},
 {t:'dark',title:'A full inbox of inquiries is not the same as a full calendar of booked weddings.'},

 {t:'section',idx:'Part One',title:'Why Couples Go Quiet'},
 {t:'normal',k:'The real problem',title:'You do not have a lead problem. You have a conversion problem.',body:'When bookings are slow, the reflex is to chase more inquiries. But the inquiries you already have are the ones slipping away, in the reply, on the price question, in the silence after the quote. Fixing that is faster and cheaper than finding new couples, and it is the part almost nobody works on.'},
 {t:'normal',k:'Why they ghost',title:'Couples go quiet when the reply makes them work, or makes them feel sold.',body:'Today\'s couples decide fast and move on quietly. A slow reply, an answer that is only a price, or a message that pushes for the booking all give them a reason to keep scrolling. They are not rude. They just found an easier conversation somewhere else.'},
 {t:'dark',title:'The booking is usually won or lost in the first message back, long before the price.'},

 {t:'section',idx:'Part Two',title:'Stop Selling and Help Them Buy'},
 {t:'normal',k:'Help them buy',title:'Sell the way today\'s couples actually want to buy.',body:'The shift at the center of everything: stop selling at a couple and start helping them buy. Ask about their day before their budget, listen more than you pitch, and guide the decision instead of pushing for it. When the conversation feels like help, the couple stays in it.'},
 {t:'normal',k:'Talk less, book more',title:'The pro who talks less books more.',body:'Most pros lose the booking by talking through it. Ask better questions and then be quiet. The couple will tell you what matters to them, what they are worried about, and exactly what it takes to win the booking, if you leave enough room for them to say it.'},
 {t:'normal',k:'The price question',title:'Answer "how much?" without leading with price.',body:'"How much?" is not really a question about money, it is a question about whether you are worth a conversation. Answer it with a question of your own, learn what the day is about, then reveal price inside that context. That is how you hold your rate instead of discounting to win.'},
 {t:'normal',k:'Why they ghost, part two',title:'The first response decides whether they ever answer.',body:'Speed and warmth in the very first reply are what bring a quiet couple back. A same-day message that opens a conversation, then a light follow-up that adds something instead of nagging, turns "they ghosted me" into a booked call. Silence is usually a message you did not send, not a couple who was never going to book.'},
 {t:'dark',title:'Help a couple buy, and price quietly stops being the whole conversation.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Stop Selling'},
 {t:'normal',k:'What this builds',title:'Fewer inquiries lost, more weddings booked, and a rate you hold.',body:'When the first reply opens a conversation and the price question is handled with confidence, you convert far more of the inquiries you already get. The calendar fills with couples who chose you, not the cheapest date open, and a quiet stretch stops feeling like a crisis, because your process is holding, not your willingness to cut.'},
 {t:'dark',title:'The goal was never more leads. It was more of your leads saying yes.'},
 {t:'normal',k:'Why Alan Berg',title:'The wedding industry\'s first Certified Speaking Professional, and 30 years inside this business.',body:'Alan spent 11-plus years as Vice President of Sales at The Knot, and now consults for WeddingPro, WeddingWire, and The Knot. He has written 15 books, including Stop Selling and Help Them Buy, Shut Up and Sell More, and Why Are They Ghosting Me?, and hosts the Wedding Business Solutions podcast, heard in more than 135 countries. This is the method behind all of it.'},

 {t:'section',idx:'Your Next Step',title:'Book the Inquiries You Already Have'},
 {t:'normal',k:'Keep going with Alan',title:'Go deeper on the method, with Alan himself.',body:'The podcast and the books give you the ideas. The Wedding Lead Conversion Mastermind and private sales training are where Alan works the method through with your business directly, on your real inquiries, your real price question, and your own follow-up. That is where it turns into booked weddings.'},
 {t:'cta',title:'Ready to turn more inquiries into booked weddings?',body:'Take the next step with Alan Berg and Wedding Business Solutions.',chips:['Join a Wedding Lead Conversion Mastermind','Book private sales training'],disc:'Educational content for wedding and event professionals. No income or booking result is guaranteed. Results vary by business, market, and season.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#rings"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Wedding Business <b>Solutions</b> · Alan Berg</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
