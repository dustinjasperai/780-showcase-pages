<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Confident CFO — a masterclass for therapists in private practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ef;        /* warm off-white, from brand #f2efeb */
    --panel:#ece2d2;     /* warm sand, from brand #ebe0cf */
    --ink:#111432;       /* deep navy, top-ranked brand color */
    --muted:#5b5a6b;
    --accent:#e0a52c;    /* gold, from brand #eeb53c / #ebb345 */
    --teal:#0a7488;      /* calm teal secondary, from brand #08708a */
    --head:'Libre Franklin',system-ui,sans-serif;
    --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto}
  .slide{
    background:var(--bg);min-height:94vh;margin:22px auto;padding:7vh 7vw;
    display:flex;flex-direction:column;justify-content:center;
    border-radius:10px;box-shadow:0 18px 50px rgba(17,20,50,.28);position:relative;
  }
  .kicker{font-family:var(--head);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    font-size:.78rem;color:var(--teal);margin-bottom:1.1rem}
  .num{position:absolute;top:3.2vh;right:4vw;font-family:var(--head);font-weight:600;
    font-size:.8rem;color:var(--muted);letter-spacing:.08em}
  h1{font-family:var(--head);font-weight:800;line-height:1.04;font-size:clamp(2.4rem,6vw,4.1rem);
    color:var(--ink);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:800;line-height:1.08;font-size:clamp(1.9rem,4.4vw,3rem);
    color:var(--ink);letter-spacing:-.01em}
  .lead{font-size:clamp(1.15rem,2.1vw,1.5rem);line-height:1.5;color:var(--ink);margin-top:1.4rem;max-width:40ch}
  .sub{font-size:clamp(1rem,1.7vw,1.2rem);line-height:1.55;color:var(--muted);margin-top:1.1rem;max-width:52ch}
  .rule{height:5px;width:88px;background:var(--accent);border-radius:3px;margin:0 0 1.6rem}
  .big{font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.3;color:var(--ink);font-weight:700;
    font-family:var(--head);max-width:30ch}
  ul{margin-top:1.6rem;list-style:none}
  li{font-size:clamp(1.05rem,1.9vw,1.35rem);line-height:1.4;color:var(--ink);
    padding:.55rem 0 .55rem 2.2rem;position:relative;max-width:44ch}
  li::before{content:"";position:absolute;left:0;top:1.15rem;width:12px;height:12px;
    background:var(--accent);border-radius:3px}
  .step{display:flex;gap:1.1rem;align-items:baseline;padding:.5rem 0}
  .step b{font-family:var(--head);color:var(--teal);font-weight:800;font-size:1.15rem;min-width:7.5rem}
  .step span{font-size:clamp(1.02rem,1.8vw,1.3rem);color:var(--ink);line-height:1.4}
  .quote{font-family:var(--head);font-weight:600;font-size:clamp(1.4rem,2.8vw,2rem);line-height:1.3;
    color:var(--ink);max-width:28ch}
  .cite{margin-top:1.3rem;color:var(--muted);font-size:1rem}
  .title-wrap{border-left:7px solid var(--accent);padding-left:2rem}
  .who b{color:var(--teal);font-family:var(--head);font-weight:800}
  .disc{font-size:.92rem;color:var(--muted);line-height:1.5;margin-top:1.8rem;max-width:60ch}
  .cta-row{margin-top:1.8rem;font-family:var(--head);font-weight:800;font-size:clamp(1.2rem,2.2vw,1.6rem);color:var(--teal)}
  .panel{background:var(--panel);border-radius:10px;padding:2rem 2.2rem;margin-top:1.6rem;max-width:46ch}
  .foot{position:absolute;bottom:3vh;left:7vw;font-family:var(--head);font-weight:600;
    font-size:.82rem;color:var(--muted);letter-spacing:.06em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A masterclass for therapists in private practice',
   h1:'The Confident CFO',
   lead:'How therapists go from money avoidance to calm, clear control of their practice finances.',
   foot:'Linzy Bonham · Money Skills for Therapists'},

  {t:'who', kicker:'Who this is for',
   h2:'You are great with clients. Avoidant with your numbers.',
   who:'This is for the therapist who built a practice that serves clients beautifully, and quietly isn’t sure it serves <b>you</b> financially.'},

  {t:'trap', kicker:'The trap',
   h2:'The two-step money dance.',
   bullets:[
     'One week you obsessively worry about money.',
     'The next you avoid the numbers altogether.',
     'You are a capable, highly skilled professional, and nobody ever taught you the money side of running a business.']},

  {t:'hook', kicker:'A reframe',
   big:'The problem was never the spreadsheet. It is the money story underneath it.',
   sub:'Most money advice hands you one more system. It fails because the shame and avoidance it is built on top of never get touched.'},

  {t:'part', kicker:'Part one', h2:'The real problem is money shame.'},

  {t:'points', kicker:'Part one',
   h2:'Why therapists specifically.',
   bullets:[
     'You were trained to care for people, not to price, budget, and forecast.',
     'Money shame makes the numbers feel dangerous, so you look away.',
     'Avoidance removes clarity, and without clarity every decision feels anxious.']},

  {t:'points', kicker:'Part one',
   h2:'What the avoidance quietly costs.',
   bullets:[
     'Fees that never get raised and a salary you never actually pay yourself.',
     'No buffer, so every slow month feels like a crisis.',
     'Tax season as panic instead of a plan.',
     'Resentment toward the practice you worked so hard to build.']},

  {t:'part', kicker:'Part two', h2:'The method: spreadsheet and heart.'},

  {t:'steps', kicker:'Part two',
   h2:'The 4-step framework.',
   steps:[
     ['Commit','Rewrite the money story first. The emotional reset that makes every system actually stick.'],
     ['Clarify','See your numbers without flinching. Know the few key numbers that run your practice.'],
     ['Adjust','Pay yourself a real salary. Build the budget and the tax reserve on purpose.'],
     ['Implement','Give every dollar a job. Lock in simple systems and a review rhythm you can keep.']]},

  {t:'focus', kicker:'Step one · Commit',
   quote:'If you do not revise your money story, you will not permanently change your behavior around money.',
   cite:'The emotional work comes first. Then the spreadsheet holds.'},

  {t:'points', kicker:'Step two · Clarify',
   h2:'See where your money is at.',
   bullets:[
     'A tracking system that fits how your brain actually works.',
     'The handful of numbers that tell you the truth about your practice.',
     'Looking at the numbers becomes neutral instead of scary.']},

  {t:'points', kicker:'Step three · Adjust',
   h2:'Make the money work for you.',
   bullets:[
     'Pay yourself first, on a schedule, like the professional you are.',
     'A budget that funds your life, not just the business.',
     'Taxes set aside before they are due, so there is no scramble.']},

  {t:'points', kicker:'Step four · Implement',
   h2:'Every dollar gets a job.',
   bullets:[
     'Savings goals your money is actively working toward.',
     'A monthly review that takes minutes, not dread.',
     'A support team and tools so you are not doing it alone.']},

  {t:'part', kicker:'Part three', h2:'Life as the confident CFO.'},

  {t:'points', kicker:'Part three',
   h2:'From confusion to calm.',
   bullets:[
     'You look forward to working on your finances instead of hiding from them.',
     'You understand your numbers, so your decisions feel grounded.',
     'A smile in your bank account, because the money finally has a plan.']},

  {t:'focus', kicker:'Why me',
   quote:'I am half therapist, half bookkeeper. The perfect mix of spreadsheet and heart.',
   cite:'Linzy Bonham, trauma therapist turned money coach, daughter of an accountant. Host of the Money Skills for Therapists podcast, and the guide for more than 700 therapists over the last six years.'},

  {t:'who', kicker:'Is this you?',
   h2:'Who this is for.',
   who:'For therapists ready to stop avoiding and start leading as the <b>confident CFO</b> of their own practice. Not a quick fix, and not more shame. A calmer, clearer relationship with your money.'},

  {t:'cta', kicker:'Your next step',
   h2:'Come learn the money skills.',
   lead:'Join Linzy live to begin the shift from money confusion and shame to calm and confidence.',
   ctarow:'Save your free spot in the live workshop series',
   disc:'Educational only. This masterclass shares financial-management skills and mindset tools for private practice. It is not financial, tax, legal, or investment advice, and it makes no income or results guarantees. Individual results vary.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  if(s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){
    inner += `<div class="title-wrap"><h1>${s.h1}</h1><p class="lead">${s.lead}</p></div>`;
  } else if(s.t==='part'){
    inner += `<div class="rule"></div><h2>${s.h2}</h2>`;
  } else if(s.t==='hook'){
    inner += `<div class="rule"></div><p class="big">${s.big}</p><p class="sub">${s.sub}</p>`;
  } else if(s.t==='who'){
    if(s.h2) inner += `<div class="rule"></div><h2>${s.h2}</h2>`;
    inner += `<p class="lead who">${s.who}</p>`;
  } else if(s.t==='trap' || s.t==='points'){
    inner += `<div class="rule"></div><h2>${s.h2}</h2><ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
  } else if(s.t==='steps'){
    inner += `<div class="rule"></div><h2>${s.h2}</h2><div class="panel">${s.steps.map(x=>`<div class="step"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`;
  } else if(s.t==='focus'){
    inner += `<div class="rule"></div><p class="quote">${s.quote}</p><p class="cite">${s.cite}</p>`;
  } else if(s.t==='cta'){
    inner += `<div class="rule"></div><h2>${s.h2}</h2><p class="lead">${s.lead}</p><div class="cta-row">${s.ctarow}</div><p class="disc">${s.disc}</p>`;
  }
  if(s.foot) inner += `<div class="foot">${s.foot}</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
