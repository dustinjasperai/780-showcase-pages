<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Memoir Masterplan — a masterclass with Samantha Clark</title>
<!--
  Palette (traceable to 01-deep-research.md ## Palette, from extract_brand.js brand.json):
  ground #f5f3ee (paper), panel #ffffff, rule #d7dbdf, text #1f2a33 (slate),
  accent #365d7d (sea-slate, the single ranked brand hex from samanthaclark.net).
  Type: Josefin Sans (her own site display face) over Spectral (literary serif body).
  Thesis: a quiet, slow, Orkney-spare masterclass on planning a memoir, not a finish-fast webinar.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f5f3ee;
    --panel:#ffffff;
    --rule:#d7dbdf;
    --text:#1f2a33;
    --muted:#5c6b76;
    --accent:#365d7d;
    --display:'Josefin Sans',sans-serif;
    --body:'Spectral',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ground);color:var(--text);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:64px 56px;
    margin:0 0 28px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .slide::before{
    content:"";position:absolute;left:56px;right:56px;top:40px;height:1px;background:var(--rule);opacity:.6;
  }
  .kicker{font-family:var(--display);text-transform:uppercase;letter-spacing:.22em;font-size:13px;color:var(--accent);font-weight:600;margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.14;margin-bottom:18px}
  p{font-size:21px;line-height:1.55;color:var(--text);max-width:40em;margin-bottom:14px}
  p.sub{color:var(--muted);font-size:23px}
  .lead{font-size:26px;line-height:1.5}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:21px;line-height:1.5;padding-left:28px;position:relative;margin-bottom:14px;max-width:40em}
  li::before{content:"";position:absolute;left:0;top:13px;width:12px;height:1px;background:var(--accent)}
  .big{font-size:40px;line-height:1.16;font-family:var(--display);font-weight:600}
  .byline{margin-top:28px;font-family:var(--display);letter-spacing:.04em;color:var(--muted);font-size:17px}
  .cta{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cta .kicker{color:#cfe0ee}
  .cta h2,.cta p,.cta li{color:#fff}
  .cta li::before{background:#cfe0ee}
  .disclaimer{margin-top:26px;font-family:var(--display);font-size:13px;letter-spacing:.03em;color:#cfe0ee;max-width:42em}
  .foot{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;padding:10px 0 40px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">The Artist's Writing Coach &middot; Samantha Clark</div>
<script>
const S=[
  {t:'title'},
  {t:'agenda',k:'Who this is for',h:'For the writer who keeps starting and stalling',b:[
    'You are an artist, or a memoir and creative nonfiction writer, with a life worth putting on the page.',
    'You have notes, fragments, maybe three false starts. What you do not have is a way through.'
  ]},
  {t:'problem',k:'The trap',h:'You have pages. You do not have a plan.',p:'Most memoirs stall in the same place. Not because the writer lacks talent or a story, but because a draft without a shape quickly feels overwhelming, so you put it down, and the months pass.'},
  {t:'reframe',k:'The reframe',big:'Talent was never the missing piece. A map was.',p:'Writing a true book is slow work. It asks for reflection and care. Given a plan to write forward from, that slowness becomes steady progress instead of a loop of restarts.'},
  {t:'part',k:'Part one',h:'Why the book keeps stalling'},
  {t:'problem',k:'Part one',h:'Three quiet reasons',b:[
    'You are writing fast, trying to force a shape that only reflection can reveal.',
    'You are holding the whole book in your head at once, which no one can carry.',
    'You feel self conscious, so the honest material stays off the page.'
  ]},
  {t:'problem',k:'Part one',h:'Writing is how you see',p:'Writing is a tremendous tool for reflection. It slows us down and pins the thought onto the page so you can examine it. Before it is a book, your writing is how you work out what the book is actually about.'},
  {t:'problem',k:'Part one',h:'The cost of going fast',p:'Rushed, a memoir becomes a list of things that happened. The meaning, the part only you can see, needs time and quiet to surface. Speed is exactly what buries it.'},
  {t:'part',k:'Part two',h:'The Memoir Masterplan',p:'A slow, reflective method for planning the shape of your book first, so the pages have somewhere to go. Four movements, in order.'},
  {t:'pillar',k:'Movement one',h:'Write to see',p:'Begin not with chapters but with reflection on the page. Writing slowly lets the real subject surface, the thing underneath the events, before you commit to a structure.'},
  {t:'pillar',k:'Movement two',h:'Map before you draft',p:'Lay out the shape of the whole book while it is still small enough to hold. With a map in front of you, you can write forward confidently instead of restarting, and you can see the end from the beginning.'},
  {t:'pillar',k:'Movement three',h:'Writing as invitation',p:'Treat your language, spoken or written, as an invitation and a conversation, a way to build a readership around your work. Held that way, the self consciousness eases and the honest material finally lands on the page.'},
  {t:'pillar',k:'Movement four',h:'Slow, steady practice',p:'Creative work is slow work. It takes patience, persistence and perseverance. A gentle, regular pace, with careful listening and quiet challenge, is what carries a long book all the way to its last page.'},
  {t:'part',k:'Part three',h:'When the shape holds'},
  {t:'outcome',k:'Part three',h:'What a mapped book feels like',b:[
    'You open the file and know exactly what today is for.',
    'The overwhelm is gone, because the whole is on the map, not in your head.',
    'You are writing forward, toward an ending you can already see.'
  ]},
  {t:'outcome',k:'Part three',h:'What changes for you',p:'The book stops being a weight you carry and becomes a practice you return to. Slowly, reliably, the pages accumulate, and one day the last one is written.'},
  {t:'credibility',k:'Why me',h:'Thirty years of making, one book of my own',b:[
    'The Clearing, my memoir of art, family and mental health, published by Little, Brown.',
    'A thirty year exhibiting practice, including residencies with the Royal Scottish Academy.',
    'The Lifeboat, my weekly letter to thousands of artists and writers.'
  ],byline:'Samantha Clark, The Artist’s Writing Coach'},
  {t:'recap',k:'The method, in one line',big:'Plan the shape first, slowly, and the book finishes itself.'},
  {t:'cta',k:'The invitation',h:'Plan the book only you can write',p:'If you want a map for your memoir and a slow, steady way to finish it, let us talk. Book a free discovery call and we will look at where your book is and what the next pass could be.',li:[
    'A free, unhurried discovery call to start.',
    'Slow Coach mentoring and the Memoir Masterplan when the fit is right.'
  ],disc:'This masterclass is educational. No specific result is guaranteed. Results vary from writer to writer, and nothing here is a promise of publication or income.'},
];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const deck=document.getElementById('deck');
S.forEach(function(s){
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let html='';
  if(s.t==='title'){
    html+='<div class="kicker">A free live masterclass</div>';
    html+='<h1>The Memoir Masterplan</h1>';
    html+='<p class="sub">How to plan the book only you can write, and actually finish it.</p>';
    html+='<div class="byline">With Samantha Clark &middot; The Artist’s Writing Coach</div>';
  }else{
    if(s.k)html+='<div class="kicker">'+esc(s.k)+'</div>';
    if(s.big){html+='<p class="big">'+esc(s.big)+'</p>';}
    if(s.h)html+='<h2>'+esc(s.h)+'</h2>';
    if(s.p)html+='<p class="lead">'+esc(s.p)+'</p>';
    if(s.b){html+='<ul>'+s.b.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';}
    if(s.li){html+='<ul>'+s.li.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';}
    if(s.byline)html+='<div class="byline">'+esc(s.byline)+'</div>';
    if(s.disc)html+='<div class="disclaimer">'+esc(s.disc)+'</div>';
  }
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
