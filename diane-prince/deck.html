<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Exit-Ready Agency · Diane Prince</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#141A26; --panel:#1D2536; --rule:#2A3348;
    --gold:#C9A24E; --sage:#8FA6A0; --chalk:#F1EEE4; --grey:#C6CCDA; --dim:#6C7690;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Manrope',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:2.4vh}
  h1{font-family:'Literata',Georgia,serif;font-weight:500;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.7vw}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-size:1.85vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Manrope',sans-serif;font-size:1.4vw;font-weight:600;color:var(--sage);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#20293c 0%,#0B0F17 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:86%;font-style:italic;color:#F3F0E7}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#20293c 0%,#0B0F17 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--gold);color:#EAD6A6;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .rise-motif{position:absolute;pointer-events:none;opacity:.92}
  .title-rise{right:7.5%;bottom:8%;width:22vw}
  .corner-rise{right:6%;bottom:7.5%;width:10vw;opacity:.42}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--gold);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Exit-Ready Agency</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ascending line rising in stages to a small pennant at the peak: scale, then exit -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rise" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="136" x2="246" y2="136" stroke="#8FA6A0" opacity="0.35"/>
    <path d="M28 128 L78 104 L128 112 L172 66 L210 40" stroke="#C9A24E" opacity="0.92"/>
    <path d="M38 128 L84 108 L132 116 L176 74 L214 50" stroke="#F1EEE4" opacity="0.12"/>
    <path d="M210 40 L228 34 L224 52 Z" fill="#C9A24E" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Exit-Ready Agency',sub:'How founders of recruiting and staffing firms build a company worth buying, not just a job worth keeping.',brand:true,rise:'title'},
 {t:'normal',k:'Who this is for',title:'You built a book of business. Not yet a company.',body:'You bring in the placements, you know every client relationship, and the agency runs because you show up every day. That is a demanding job with good margins, not a company someone else could step into or buy.'},
 {t:'dark',title:'If the agency stops the day you stop, you do not own a company. You own a very demanding job.'},

 {t:'section',idx:'Part One',title:'The Founder-Dependent Agency'},
 {t:'normal',k:'Why growth alone does not fix it',title:'More placements without a plan just adds more of you.',body:'Every new client and every new recruiter adds decisions only you can make. Revenue climbs, but the agency gets more dependent on you, not less.'},
 {t:'normal',k:'The real cost',title:'A founder-dependent agency is hard to finance, hard to hand off, and hard to sell for what it should be worth.',body:'Buyers, banks, and even your own future self pay for predictable, transferable revenue. An agency that only works with you in it every day does not qualify, no matter the top line.'},
 {t:'dark',title:'Growth and exit-readiness are not the same project. Most agencies only ever run the first one.'},

 {t:'section',idx:'Part Two',title:'The Scale-to-Exit Sequence'},
 {t:'normal',k:'Pillar One',title:'Vision, mission, and core values.',body:'Before you scale anything, define what the agency is actually for. Every later decision, who you hire, which clients you keep, what you sell it as, traces back to this.'},
 {t:'normal',k:'Pillar Two',title:'Niche selection, decided on facts, not feelings.',body:'A structured way to choose or validate your specialty using real data on demand, margin, and competition, not the niche that simply feels most familiar.'},
 {t:'normal',k:'Pillar Three',title:'Profitability modeling across every service line.',body:'Know which parts of the business actually make money before you pour more recruiters, more marketing, or more of your own hours into growing them.'},
 {t:'normal',k:'Pillar Four',title:'Anchor client acquisition.',body:'Build the handful of client relationships stable enough to anchor the agency through a leadership transition, a slow quarter, or a sale, not just the next placement.'},
 {t:'normal',k:'Pillar Five',title:'Lead generation and sales, systematized.',body:'Turn new business from something only the founder can close into a system a sales process and a team can run without you on every call.'},
 {t:'normal',k:'Pillar Six',title:'Exit strategy planning, from day one.',body:'Most owners start thinking about an exit the year they want one. This builds the exit into the plan from the beginning, so the agency is buyable whenever you decide it is time.'},
 {t:'dark',title:'Six pillars. One agency that works whether or not you are the one running it.'},

 {t:'section',idx:'Part Three',title:'What It Looks Like'},
 {t:'normal',k:'The shift',title:'The agency starts running on systems, not on your memory.',body:'Placements still happen, clients still get served, but the decisions live in a process instead of in your head. That is what a buyer, a bank, or a successor is actually paying for.'},
 {t:'normal',k:'Why Diane',title:'She has done this from the inside, twice.',body:'Diane built a title-insurance staffing agency from the ground up and sold it to a public company for $28 million in about six years. She has since co-founded and exited several more staffing and recruiting firms, through 9/11 and the 2008 downturn, and now runs Recruiting Agency 360 for owners who want the same outcome.'},

 {t:'section',idx:'Your next step',title:'Talk to Diane'},
 {t:'normal',k:'How I can help',title:'Recruiting Agency 360.',body:'Inside RA360: weekly live group calls with other recruiting and staffing founders, a private community, unlimited async support between calls, and the modules and templates for each pillar above, business plan, pricing, contracts, and compensation included. One price covers up to three people on your team.'},
 {t:'cta',title:'Ready to build the agency someone else could run, and you could sell?',chips:['Talk to Diane about RA360','Explore Recruiting Agency 360'],disc:'Educational content for recruiting and staffing agency founders. No income, revenue, or exit outcome is guaranteed. Results vary by agency, market, and execution.'},
];

const deck=document.getElementById('deck');
function rise(kind){return `<svg class="rise-motif ${kind==='title'?'title-rise':'corner-rise'}"><use href="#rise"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Exit-Ready <b>Agency</b> · Diane Prince</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.rise) h+=rise(s.rise);
  else if(s.t==='title') h+=rise('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
