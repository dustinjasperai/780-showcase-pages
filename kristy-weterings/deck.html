<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Careers Without Starting Over — a masterclass with Kristy Weterings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2e8;        /* her dominant warm ivory ground */
    --panel:#f6f2e9;     /* soft cream panel */
    --ink:#313131;       /* her dominant charcoal text */
    --muted:#6c665c;     /* warm grey, derived from ink over ivory */
    --rule:#ddc7b9;      /* her blush/tan hairline */
    --accent:#cc3366;    /* her own button/CTA raspberry */
    --display:'Cormorant Garamond', Georgia, serif;
    --body:'Inter', -apple-system, Helvetica, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{max-width:1040px;margin:0 auto;padding:28px 20px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:64px 68px;margin:22px 0;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:600;font-size:64px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:44px;line-height:1.08;margin-bottom:18px}
  .lede{font-family:var(--display);font-style:italic;font-size:30px;line-height:1.25;color:var(--muted);margin-top:20px}
  p{font-size:19px;line-height:1.62;max-width:60ch;color:var(--ink)}
  p+p{margin-top:16px}
  .muted{color:var(--muted)}
  .big{font-family:var(--display);font-size:40px;line-height:1.15;max-width:20ch}
  ul{list-style:none;margin-top:22px;max-width:64ch}
  li{position:relative;padding-left:30px;margin:14px 0;font-size:19px;line-height:1.55}
  li:before{content:"";position:absolute;left:0;top:12px;width:16px;height:2px;background:var(--accent)}
  .step{font-family:var(--display);font-size:22px;color:var(--accent);font-weight:600;letter-spacing:.02em}
  .underline{background-image:linear-gradient(var(--accent),var(--accent));
    background-size:100% 2px;background-repeat:no-repeat;background-position:0 92%;padding-bottom:2px}
  .foot{position:absolute;left:68px;right:68px;bottom:26px;display:flex;justify-content:space-between;
    font-size:12px;letter-spacing:.04em;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
  .foot .who{font-weight:600;color:var(--ink)}
  .center{align-items:center;text-align:center}
  .center p,.center ul{margin-left:auto;margin-right:auto}
  .disclaimer{font-size:13px;line-height:1.5;color:var(--muted);max-width:70ch;margin-top:24px}
  .cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-weight:600;
    font-size:17px;padding:15px 30px;border-radius:8px;text-decoration:none}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 34px;margin-top:24px;max-width:70ch}
  .grid .step{margin-bottom:2px}
  .nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(49,49,49,.9);
    color:#f7f2e8;font-size:13px;padding:8px 16px;border-radius:20px;font-family:var(--body)}
  @media(max-width:720px){.slide{padding:40px 26px}h1{font-size:42px}h2{font-size:32px}.foot{left:26px;right:26px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav" id="nav"></div>
<script>
const S = [
  {t:'title'},
  {t:'section', kicker:'Who this is for',
    h:'You look successful on paper. Inside, you feel done.',
    lede:'The promotions came. The salary came. And somewhere along the way the work stopped fitting who you actually are.'},
  {t:'body', kicker:'The trap',
    h:'The false choice keeping you stuck',
    p:['Most ambitious women think the only two options are: push through and stay quietly unhappy, or blow it all up and start again from zero.',
       'So they wait. They tell themselves it is not that bad, or that it is too late, or too risky, or too expensive to change now.',
       'Neither option is the real one.']},
  {t:'quote', big:'You are not stuck. You just have not been shown how to get clear yet.'},
  {t:'body', kicker:'Part one, the real problem',
    h:'It was never about the job title',
    p:['Career dissatisfaction almost never comes from the surface reasons, the boss, the hours, the pay.',
       'It comes from misalignment. Your day is spent on the things that drain you, and almost none of it on the talents that actually give you energy.',
       'Change the title without changing that, and eighteen months later you are stuck in a nicer office.']},
  {t:'body', kicker:'Part one',
    h:'Why another course or a bigger push will not fix it',
    p:['You do not have a motivation problem. You are one of the most driven people you know.',
       'What you are missing is clarity, a way to see your own talents, energy and direction from the outside, and a plan that builds on everything you have already earned instead of throwing it away.']},
  {t:'two',
    kicker:'The reframe',
    h:'You do not start over. You build on what is already yours.',
    left:['Starting over','Quit with no plan','Ignore a decade of skill','Chase someone else’s passion','Hope it works out'],
    right:['Building on','Move with a mapped plan','Put your real talents to work','Follow your own direction','Know why, then act']},
  {t:'section', kicker:'Part two, the method',
    h:'The 5 Conscious Steps',
    lede:'The path I walk every client through, from that first foggy where do I even start to a clear, realistic next step.'},
  {t:'step', n:'Step 1', h:'Get to Know Yourself',
    p:['We start with who you actually are, not who you were told to be. Your real identity, your natural talents, and the work that genuinely energizes you.',
       'This is where the TalentScan comes in, so this is grounded in something concrete instead of a vague gut feeling.']},
  {t:'step', n:'Step 2', h:'Master Your Mindset',
    p:['The fears, the self-doubt and the old stories are what keep smart women in careers they have outgrown.',
       'We name them, challenge the negative self-talk and the fear of getting it wrong, and take their power away.']},
  {t:'step', n:'Step 3', h:'Dream Big',
    p:['Before we get practical, we let your imagination off the leash.',
       'We picture what is actually possible when your brain stops leading with what is safe, because you cannot build a life bigger than the one you will let yourself imagine.']},
  {t:'step', n:'Step 4', h:'Ask Yourself Why',
    p:['We connect the change to something deeper than a new job, your purpose, your values, and how you want to be remembered.',
       'This is what turns a career move into a life that finally lines up.']},
  {t:'step', n:'Step 5', h:'Take Action',
    p:['Clarity means nothing without movement. We let go of perfectionism and take small, deliberate steps, adjusting as we go.',
       'You do not wait for the perfect moment. You start, and the path becomes clear as you walk it.']},
  {t:'body', kicker:'The tool',
    h:'The TalentScan',
    p:['Most people try to think their way to a new career. The TalentScan lets you see it instead.',
       'It maps your natural talents, what gives you energy and what drains it, and translates that into the kinds of work and roles that genuinely fit you.',
       'It is the difference between guessing and having something real to build a plan on.']},
  {t:'body', kicker:'Part three, life on the other side',
    h:'From exhausted to aligned',
    p:['On the other side of this is not just a different job. It is work that uses the best of you and a life that has room to breathe.',
       'And you do not have to choose between the two things you were told were opposites.'],
    tag:'You do not have to choose between purpose and pay.'},
  {t:'body', kicker:'Why me',
    h:'I have walked this exact path',
    p:['I followed the script too, the right studies, the right jobs, the correct path, and felt completely lost while everything looked fine from the outside.',
       'I retrained in coaching, psychology and meditation and became a certified career coach. I was named one of the Top 16 Coaches in Amsterdam for 2024.',
       'I have since helped over 100 women around the world, and 90 percent of them went on to find work that actually fits.']},
  {t:'quote', big:'Confidence is built, not found. So is a career that fits.'},
  {t:'cta',
    h:'Your next step',
    p:['If this is landing, the next step is simple. Let us look at where you are and map what a real change could look like for you, together, on a free clarity call.'],
    btn:'Book a free clarity call',
    disc:'This masterclass is for education only. No specific job, income or result is guaranteed. Results vary and depend on your own situation and the work you put in.'}
];

const WHO = 'Kristy Weterings, Certified Career Coach';
const stage = document.getElementById('stage');

function foot(i){
  return '<div class="foot"><span class="who">'+WHO+'</span><span>'+ (i+1) +' / '+ S.length +'</span></div>';
}
function esc(x){return x;}

S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide' + ((s.t==='quote'||s.t==='title'||s.t==='cta')?' center':'');
  let h = '';
  if(s.t==='title'){
    h += '<div class="kicker">A live masterclass</div>';
    h += '<h1>Change Careers<br>Without Starting Over</h1>';
    h += '<p class="lede">How ambitious women find work that truly fits, without throwing away everything they have built.</p>';
    h += '<p class="muted" style="margin-top:34px;font-size:16px">'+WHO+'</p>';
  } else if(s.t==='section'){
    h += '<div class="kicker">'+s.kicker+'</div>';
    h += '<h2>'+s.h+'</h2>';
    if(s.lede) h += '<p class="lede">'+s.lede+'</p>';
  } else if(s.t==='body'){
    h += '<div class="kicker">'+s.kicker+'</div>';
    h += '<h2>'+s.h+'</h2>';
    s.p.forEach(x=> h += '<p>'+x+'</p>');
    if(s.tag) h += '<p class="lede"><span class="underline">'+s.tag+'</span></p>';
  } else if(s.t==='quote'){
    h += '<p class="big"><span class="underline">'+s.big+'</span></p>';
  } else if(s.t==='two'){
    h += '<div class="kicker">'+s.kicker+'</div>';
    h += '<h2>'+s.h+'</h2>';
    h += '<div class="grid">';
    h += '<div><div class="step">'+s.left[0]+'</div></div><div><div class="step">'+s.right[0]+'</div></div>';
    for(let k=1;k<s.left.length;k++){ h += '<div class="muted">'+s.left[k]+'</div><div>'+s.right[k]+'</div>'; }
    h += '</div>';
  } else if(s.t==='step'){
    h += '<div class="step">'+s.n+'</div>';
    h += '<h2>'+s.h+'</h2>';
    s.p.forEach(x=> h += '<p>'+x+'</p>');
  } else if(s.t==='cta'){
    h += '<div class="kicker">Where to go from here</div>';
    h += '<h2>'+s.h+'</h2>';
    s.p.forEach(x=> h += '<p>'+x+'</p>');
    h += '<a class="cta-btn" href="https://kristyweterings.com/clarity-call/">'+s.btn+'</a>';
    h += '<p class="disclaimer">'+s.disc+'</p>';
  }
  h += foot(i);
  d.innerHTML = h;
  stage.appendChild(d);
});
document.getElementById('nav').textContent = 'Scroll through all '+S.length+' slides';
</script>
</body>
</html>
