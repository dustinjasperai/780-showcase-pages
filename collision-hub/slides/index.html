<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collision Hub webinar deck</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e1622;font-family:system-ui,sans-serif}
#stage{position:absolute;inset:0 0 56px 0}
iframe{width:100%;height:100%;border:0;background:#fff}
#bar{position:absolute;left:0;right:0;bottom:0;height:56px;background:#0e1622;color:#dfe7f0;
display:flex;align-items:center;justify-content:center;gap:18px}
button{font:600 15px system-ui;background:#cb1c1c;color:#fff;border:0;border-radius:6px;
padding:9px 18px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#count{font-variant-numeric:tabular-nums;letter-spacing:1px;min-width:92px;text-align:center}
</style></head><body>
<div id="stage"><iframe id="f" src="01.html" title="slide"></iframe></div>
<div id="bar">
<button id="prev">Prev</button>
<span id="count">1 / 24</span>
<button id="next">Next</button>
</div>
<script>
var slides=["01.html","02.html","03.html","04.html","05.html","06.html","07.html","08.html","09.html","10.html","11.html","12.html","13.html","14.html","15.html","16.html","17.html","18.html","19.html","20.html","21.html","22.html","23.html","24.html"];var i=0;var f=document.getElementById('f');
var c=document.getElementById('count');var p=document.getElementById('prev');var nx=document.getElementById('next');
function show(){f.src=slides[i];c.textContent=(i+1)+' / '+slides.length;p.disabled=i==0;nx.disabled=i==slides.length-1;}
p.onclick=function(){if(i>0){i--;show();}};
nx.onclick=function(){if(i<slides.length-1){i++;show();}};
document.addEventListener('keydown',function(e){if(e.key=='ArrowRight')nx.onclick();if(e.key=='ArrowLeft')p.onclick();});
show();
</script></body></html>
