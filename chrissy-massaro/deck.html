<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Clinical Reasoning Masterclass — Confident Care Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yrsa:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f4;
    --ink:#2a2324;
    --accent:#13416c;
    --panel:#eef4fa;
    --rule:#d9d2c6;
    --head:'Yrsa', Georgia, serif;
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:58px 60px;
    margin:0 0 22px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;color:var(--ink)}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;color:var(--ink)}
  p.lead{font-size:20px;line-height:1.5;margin-top:18px;max-width:62ch;color:var(--ink)}
  p.sub{font-size:17px;line-height:1.55;margin-top:14px;max-width:62ch;color:#4a4340}
  .accentword{color:var(--accent)}
  .rule{height:3px;width:64px;background:var(--accent);border-radius:3px;margin:22px 0 0}
  ul{margin:22px 0 0 2px;list-style:none;display:grid;gap:14px}
  li{font-size:18px;line-height:1.45;padding-left:26px;position:relative;max-width:64ch}
  li:before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:50%;
    background:var(--accent)}
  .panel{background:var(--panel);border-radius:12px;padding:26px 28px;margin-top:22px}
  .pillarnum{font-family:var(--head);font-weight:700;font-size:15px;color:var(--accent);
    letter-spacing:.08em;text-transform:uppercase}
  .present{margin-top:26px;font-size:16px;color:#4a4340}
  .present b{color:var(--ink);font-weight:600}
  .chain{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .chain span{background:#fff;border:1px solid var(--rule);border-radius:999px;
    padding:9px 16px;font-size:15px;font-weight:500}
  .chain .arrow{border:none;background:none;color:var(--accent);font-weight:700;padding:9px 2px}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:#6a635f;max-width:70ch}
  .pg{position:absolute;right:26px;bottom:20px;font-size:12px;color:#b9b1a4;
    font-family:var(--body)}
  .brandfoot{position:absolute;left:60px;bottom:20px;font-size:12px;color:#b9b1a4;
    letter-spacing:.05em}
  @media(max-width:640px){.slide{padding:38px 26px;min-height:360px}h1{font-size:34px}h2{font-size:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A live masterclass for ICU nurses',
   h:'Stop Memorizing.<br><span class="accentword">Start Understanding.</span>',
   sub:'The clinical reasoning that turns an ICU shift from survival into confidence.',
   present:'Chrissy Massaro, MSN, CRNA &middot; Confident Care Academy'},

  {t:'who',
   kicker:'Who this is for',
   h:'If you learned the tasks but not the why.',
   bullets:[
     'New ICU nurses who passed every checkoff and still feel behind at the bedside',
     'Nurses studying for the CCRN who are tired of flashcards that do not stick',
     'Aspiring CRNAs who want to walk into the interview actually understanding the physiology'],
   present:'One live hour. Bring your real questions.'},

  {t:'trap',
   kicker:'The trap',
   h:'You memorized the dose. Then the protocol ran out.',
   sub:'The patient crashed in a way the checklist did not cover, and memorized steps do not help when you do not understand what is driving the numbers in front of you.'},

  {t:'reframe',
   kicker:'The reframe',
   h:'Confidence is not recall. It is <span class="accentword">understanding</span>.',
   sub:'The calm nurse in the room is not the one who memorized more. It is the one who understands the mechanism well enough to reason through a situation they have never seen before.'},

  {t:'part',
   kicker:'Part one',
   h:'Nursing school taught you tasks, not the why.',
   sub:'That is not a knock on you or on school. It is how the training is built. The gap shows up later, under pressure, and it is completely fixable.'},

  {t:'content',
   kicker:'The core problem',
   h:'Memorized knowledge evaporates under stress.',
   bullets:[
     'Facts held without a mechanism have nothing to hang on when the moment gets loud',
     'You end up pattern-matching to protocols instead of reasoning from cause',
     'When the patient falls outside the protocol, there is nothing underneath to fall back on']},

  {t:'content',
   kicker:'The moment it clicks',
   h:'"I wish I had understood this when I was an ICU nurse."',
   sub:'That sentence is why Confident Care Academy exists. When the physiology finally connected in CRNA school, every bedside decision that used to feel like guessing suddenly had a reason behind it.'},

  {t:'part',
   kicker:'Part two',
   h:'The method: understand the mechanism, and the decision becomes obvious.',
   sub:'We teach three domains as one connected system, not three stacks of facts.'},

  {t:'pillar',
   num:'Pillar one',
   kicker:'Physiology',
   h:'Read the body as a system.',
   sub:'Hemodynamics is not a set of numbers to memorize. It is a reasoning chain, and once you can read it, the numbers tell you what the patient needs.',
   chain:['MAP','preload','afterload','contractility','the decision']},

  {t:'pillar',
   num:'Pillar two',
   kicker:'Pharmacology',
   h:'Know why the drug works, not just the dose.',
   sub:'Start at the smooth muscle and the receptor, and the right pressor, the right titration, and the reason stop being something you look up and start being something you understand.'},

  {t:'pillar',
   num:'Pillar three',
   kicker:'Clinical reasoning',
   h:'Trace every action back to its mechanism.',
   sub:'When each thing you do is connected to why you are doing it, you can reason forward into a situation you have never seen, instead of searching your memory for a matching protocol.'},

  {t:'content',
   kicker:'Worked live',
   h:'One crashing patient, worked backward.',
   sub:'In the live hour we take a patient on pressors who is still deteriorating, and we walk it backward from the action to the physiology, so you can see exactly how understanding replaces panic.'},

  {t:'stages',
   kicker:'The path',
   h:'The same physiology, understood deeper at every stage.',
   sub:'You do not relearn it from zero each step. You deepen the same understanding as you grow.',
   chain:['New ICU nurse','CCRN','CRNA admissions','Anesthesia','Practicing CRNA']},

  {t:'part',
   kicker:'Part three',
   h:'At the bedside, when the shift gets hard.',
   sub:'This is the difference understanding makes the moment a patient starts to turn.'},

  {t:'content',
   kicker:'The change',
   h:'You reason. You do not panic-recall.',
   bullets:[
     'You see a number move and you know what is driving it',
     'You titrate with a reason, not a memorized rule you are hoping applies',
     'You stay calm, because understanding is steadier than memory']},

  {t:'why',
   kicker:'Why learn this here',
   h:'Taught by clinicians who lived the gap.',
   sub:'Chrissy Massaro is a cardiac anesthesia CRNA in New York City who started as a cardiovascular ICU nurse at the Hospital of the University of Pennsylvania. Confident Care Academy now teaches 1,400+ ICU nurses, residents, and CRNAs the understanding she wished she had had at the bedside.',
   present:'Confident Care Academy &middot; clinical education that connects the why'},

  {t:'recap',
   kicker:'In one line',
   h:'Understand the mechanism, and confidence follows.',
   chain:['Physiology','Pharmacology','Clinical reasoning']},

  {t:'cta',
   kicker:'Your next step',
   h:'Start understanding.',
   sub:'Join the Confident Care Academy membership to keep learning the why behind critical care, or come work through live, high-fidelity cases with us at the next Confident Care Experience.',
   present:'confidentcareacademy.com',
   disc:'Educational content only. This masterclass is for professional development and does not constitute medical advice or clinical protocol. Outcomes vary by individual; no specific result, exam score, or career outcome is guaranteed. Always follow your facility policies and licensed scope of practice.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.kicker) html += '<div class="kick">'+s.kicker+'</div>';
  if(s.num) html += '<div class="pillarnum">'+s.num+'</div>';
  if(s.h){ html += (s.t==='title'||s.t==='who'||s.t==='trap'||s.t==='reframe'||s.t==='cta') ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>'; }
  if(s.t==='title'||s.t==='part'||s.t==='reframe'||s.t==='pillar') html += '<div class="rule"></div>';
  if(s.sub) html += '<p class="lead">'+s.sub+'</p>';
  if(s.bullets){ html += '<ul>'; s.bullets.forEach(b=>html+='<li>'+b+'</li>'); html += '</ul>'; }
  if(s.chain){ html += '<div class="chain">'; s.chain.forEach((c,j)=>{ if(j) html+='<span class="arrow">&rarr;</span>'; html+='<span>'+c+'</span>'; }); html += '</div>'; }
  if(s.present) html += '<div class="present"><b>'+s.present+'</b></div>';
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  html += '<div class="brandfoot">Confident Care Academy</div>';
  html += '<div class="pg">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
