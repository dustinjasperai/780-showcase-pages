<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built Around You: A Strengths-First College Masterclass with Ranna Patel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F0; --panel:#EFE7D7; --ink:#2A2520; --muted:#6B6256;
    --rule:#D8CDB8; --accent:#8C5A2B;
    --head:'Newsreader',Georgia,serif; --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto}
  .slide{
    background:var(--bg);min-height:62vh;padding:64px 72px;
    display:flex;flex-direction:column;justify-content:center;gap:18px;
    border-bottom:1px solid var(--rule);position:relative;
  }
  .kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:62ch}
  p.muted{color:var(--muted)}
  .lead{font-size:22px;line-height:1.5}
  ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:6px}
  li{font-size:19px;line-height:1.5;padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pill{display:inline-block;align-self:flex-start;background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:6px 16px;font-size:14px;color:var(--muted);font-weight:500}
  .big{font-family:var(--head);font-weight:700;font-size:60px;line-height:1.05;letter-spacing:-.02em}
  .accent{color:var(--accent)}
  .title-slide{background:var(--panel)}
  .cta-slide{background:var(--ink);color:var(--bg)}
  .cta-slide .kicker{color:#E0B878}
  .cta-slide h1,.cta-slide p{color:var(--bg)}
  .num{position:absolute;top:22px;right:28px;font-size:13px;color:var(--muted);font-family:var(--body)}
  .disclaimer{font-size:13px;color:#B7AE9C;max-width:60ch;margin-top:10px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px}
  .card h3{font-family:var(--head);font-size:21px;margin-bottom:8px}
  .card p{font-size:16px;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Free Live Masterclass with Ranna Patel',
   h:'Built Around You',
   p:'The strengths-first path to the right college. For students and the families who love them.'},

  {t:'who', kicker:'Who this is for',
   h:'If you are a parent of a high schooler aiming high',
   p:'This is for families who want their student to reach a selective university, a direct Business or Medical program, or an Honors college, and who want the process to feel calm, clear, and genuinely theirs.'},

  {t:'promise', kicker:'What you will leave with',
   h:'A different way to plan',
   list:['A clear read on the one strength your student should build the whole application around.',
         'A proactive year-by-year timeline so senior fall is calm, not a scramble.',
         'A sense of what admissions officers actually reward right now.']},

  {t:'trap', kicker:'The trap',
   h:'The rankings arms race',
   p:'More APs. Higher scores. One more activity. Families are told that admission is a game of stacking credentials, so they optimize for a leaderboard instead of for the student standing in front of them.'},

  {t:'reframe', kicker:'A harder truth',
   big:'The students who get in are not the ones with the most on paper. They are the ones who know their story.'},

  {t:'part', kicker:'Part One', h:'The core problem',
   p:'On paper, every strong applicant looks the same: good grades, a few activities, a tidy resume. Admissions officers read thousands of them. Sameness is invisible.'},

  {t:'point', kicker:'Why it matters',
   h:'Fit is what gets rewarded',
   p:'Selective schools are not ranking applicants by credential count. They are asking a simple question: does this student belong here, and will they add something only they can add? That is a question about fit and about story, not about rank.'},

  {t:'cost', kicker:'The real cost',
   big:'A year spent chasing someone else’s definition of impressive is a year not spent becoming who they already are.'},

  {t:'part', kicker:'Part Two', h:'The strengths-first method',
   p:'Instead of chasing the leaderboard, we build the whole plan around who your student actually is. Four pieces, in order.'},

  {t:'pillar', kicker:'Pillar One', h:'Strengths-discovery intake',
   p:'Before a single college is named, we find out who the student really is. An extensive questionnaire and real, unhurried conversations surface the talents and interests they often cannot see in themselves yet.'},

  {t:'pillar', kicker:'Pillar Two', h:'The proactive timeline',
   p:'We map the full multi-year runway: test planning, course selection, and extracurricular choices, so junior year sets up a calm senior fall instead of a scramble. Early and intentional beats late and frantic every time.'},

  {t:'pillar', kicker:'Pillar Three', h:'What colleges actually reward',
   p:'I attend admissions conferences and talk directly with current admissions representatives about how they read applications now. Your plan tracks what this cycle rewards, not advice from a decade ago.'},

  {t:'pillar', kicker:'Pillar Four', h:'Choosing the right offer',
   p:'Admission is a step on a longer journey, not the finish line. When the offers arrive, we weigh them against the student your family knows, so the final choice fits the person, not just the name on the sweatshirt.'},

  {t:'part', kicker:'Part Three', h:'A calm year and a true application',
   p:'A student who can tell the story only they can tell. A family that feels in control of the timeline. Applications that read like a real person, not a template.'},

  {t:'point', kicker:'For the student',
   h:'Confidence, not a costume',
   p:'When the plan is built on a real strength, students stop performing a version of themselves they think colleges want. They write, interview, and decide from a place they can actually stand behind.'},

  {t:'cards', kicker:'In practice',
   h:'From panic to a plan',
   cards:[
     {h:'Before', p:'More credentials, late nights, a resume that looks like everyone else’s, and a senior-year scramble.'},
     {h:'After', p:'A clear strength, a proactive timeline, and an application built around who your student truly is.'}
   ]},

  {t:'why', kicker:'Why me', h:'Twenty years in the room',
   list:['I taught at some of the Bay Area’s most competitive private schools, so I know the students and the pressure firsthand.',
         'I hold a Certificate in College Admissions and Career Planning from UC Berkeley Extension.',
         'My students have earned admission to highly selective universities, direct Business and Medical programs, and Honors colleges.']},

  {t:'close-reframe', kicker:'The whole idea in one line',
   big:'Stop building an application to beat the rankings. Start building one around who your student is.'},

  {t:'cta', kicker:'Your next step',
   h:'Come to the live masterclass',
   p:'I will walk you through the strengths-first method step by step and answer your questions live. Bring your student if you can.',
   action:'Reserve your seat at rannapatel.com',
   disclaimer:'Educational information only. No outcome, admission, scholarship, or result is guaranteed. Results vary by student.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta-slide':'');
  let html = '';
  if(s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if(s.h) html += `<h1>${s.h}</h1>`;
  if(s.big) html += `<div class="big">${s.big}</div>`;
  if(s.p) html += `<p class="lead">${s.p}</p>`;
  if(s.list){ html += '<ul>' + s.list.map(x=>`<li>${x}</li>`).join('') + '</ul>'; }
  if(s.cards){ html += '<div class="two">' + s.cards.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('') + '</div>'; }
  if(s.action){ html += `<span class="pill">${s.action}</span>`; }
  if(s.disclaimer){ html += `<p class="disclaimer">${s.disclaimer}</p>`; }
  html += `<div class="num">${i+1} / ${S.length}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
