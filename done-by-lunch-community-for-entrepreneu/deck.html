<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grow a Lead-Generating YouTube Channel in 90 Minutes a Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f9fa;
    --panel:#ffffff;
    --panel2:#e4e7eb;
    --cream:#f2f2ed;
    --ink:#1c2143;
    --body:#3b3b3b;
    --muted:#545861;
    --rule:#e4e7eb;
    --lime:#cff464;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--body);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #deck{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
  .slide{
    min-height:100vh;
    scroll-snap-align:start;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 7vw;
    position:relative;
    border-bottom:1px solid var(--rule);
  }
  .slide.cream{background:var(--cream)}
  .inner{width:100%;max-width:1000px}

  /* corner motif: RoE lever + progress arc */
  .corner{
    position:absolute;top:34px;right:40px;
    display:flex;align-items:center;gap:14px;
    z-index:5;
  }
  .chip{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--lime);color:var(--ink);
    font-weight:800;font-size:12px;letter-spacing:.12em;
    padding:8px 14px;border-radius:999px;text-transform:uppercase;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ink)}
  .arc{width:44px;height:44px}
  .arc circle{fill:none;stroke-width:5}
  .arc .track{stroke:var(--panel2)}
  .arc .fill{stroke:var(--ink);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}

  .pagenum{
    position:absolute;bottom:30px;left:40px;
    font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--muted);
  }
  .brandmark{
    position:absolute;bottom:30px;right:40px;
    font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;
  }

  .kicker{
    display:inline-block;font-size:13px;font-weight:800;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink);margin-bottom:22px;
    padding-bottom:7px;border-bottom:3px solid var(--lime);
  }
  .part{
    font-size:14px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;
    color:var(--muted);margin-bottom:18px;
  }

  h1.title{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-weight:700;color:var(--ink);line-height:1.02;letter-spacing:-.02em;
    font-size:clamp(38px,6vw,74px);
  }
  h2.title{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-weight:600;color:var(--ink);line-height:1.06;letter-spacing:-.015em;
    font-size:clamp(30px,4.4vw,52px);
  }
  .subtitle{
    margin-top:26px;font-size:clamp(18px,2vw,23px);font-weight:500;color:var(--body);
    line-height:1.5;max-width:760px;
  }
  .body{
    margin-top:24px;font-size:clamp(17px,1.7vw,21px);font-weight:400;color:var(--body);
    line-height:1.6;max-width:760px;
  }
  .body .hl{
    background:linear-gradient(transparent 62%, var(--lime) 62%);
    color:var(--ink);font-weight:700;padding:0 2px;
  }

  ul.steps{margin-top:28px;list-style:none;max-width:820px}
  ul.steps li{
    display:flex;gap:16px;align-items:flex-start;
    padding:15px 0;border-top:1px solid var(--rule);
    font-size:clamp(16px,1.6vw,19px);line-height:1.45;color:var(--body);
  }
  ul.steps li:last-child{border-bottom:1px solid var(--rule)}
  ul.steps .n{
    flex:0 0 auto;width:30px;height:30px;border-radius:8px;
    background:var(--lime);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:14px;
  }
  ul.steps b{color:var(--ink);font-weight:800}

  /* divider slides */
  .slide.divider{background:var(--ink)}
  .slide.divider .part{color:var(--lime)}
  .slide.divider h2.title{color:#ffffff}
  .slide.divider .body{color:#d6d9e6}
  .slide.divider .brandmark,.slide.divider .pagenum{color:#8b90aa}
  .slide.divider .arc .track{stroke:#343a63}
  .slide.divider .arc .fill{stroke:var(--lime)}

  /* framework card */
  .fw{
    display:inline-flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--rule);
    padding:10px 18px;border-radius:12px;margin-bottom:24px;
    font-weight:700;color:var(--ink);letter-spacing:.02em;
  }
  .fw .lever{
    width:26px;height:14px;border-radius:999px;background:var(--panel2);position:relative;
  }
  .fw .lever::after{content:"";position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--lime)}

  /* title slide time-block motif */
  .timeblock{
    margin-top:44px;display:flex;gap:10px;align-items:center;
  }
  .timeblock .seg{height:12px;border-radius:4px;background:var(--panel2)}
  .timeblock .seg.on{background:var(--lime)}
  .timeblock .lbl{margin-left:14px;font-weight:800;color:var(--ink);letter-spacing:.04em;font-size:15px}

  .cta-actions{margin-top:34px;display:flex;flex-wrap:wrap;gap:16px}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    font-weight:800;font-size:17px;padding:16px 26px;border-radius:12px;text-decoration:none;
  }
  .btn.primary{background:var(--lime);color:var(--ink)}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
  .disclaimer{
    margin-top:40px;font-size:13px;line-height:1.55;color:var(--muted);
    max-width:720px;border-top:1px solid var(--rule);padding-top:16px;
  }

  .hint{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;
    opacity:.7;z-index:20;
  }
  @media (max-width:640px){
    .corner{top:18px;right:18px}
    .pagenum,.brandmark{bottom:16px}
    .pagenum{left:20px}.brandmark{right:20px}
  }
</style>
</head>
<body>
<div id="deck"></div>
<div class="hint">Scroll or use arrow keys</div>
<script>
const S = [
  {t:'title',
    eyebrow:'A Done By Lunch Masterclass with Jerry Potter',
    title:'Grow a Lead-Generating YouTube Channel in 90 Minutes a Week',
    subtitle:'Leverage over volume. A small, deliberate set of the right videos that becomes an evergreen lead machine for your business.',
    timeblock:true
  },
  {t:'content',
    kicker:'Who this is for',
    title:'You want leads from YouTube. You do not want a second full-time job.',
    body:'This is for online entrepreneurs and business owners who want consistent, warm leads from YouTube without living on the platform. The trap you have been sold is that the answer is always <span class="hl">more</span>. More videos, more posting, more hours you simply do not have.'
  },
  {t:'content',
    kicker:'The hard truth',
    title:'More content is the problem, not the solution.',
    body:'The content treadmill does not compound. It resets every Monday. Adding volume to a channel with no leverage only multiplies the effort. It never multiplies the return.'
  },
  {t:'divider',
    part:'Part One',
    title:'The core problem',
    body:'Before you make another video, you have to see where your effort has really been going.'
  },
  {t:'content',
    part:'Part One',
    title:'Most of your effort goes to the 80% that never compounds.',
    body:'Eighty percent of the ideas you could film are merely OK. They earn a few views, then disappear. The <span class="hl">20% that actually builds audience, authority and income</span> gets buried under everything else you keep producing.'
  },
  {t:'content',
    part:'Part One',
    fw:'RoE',
    kicker:'The master filter',
    title:'Meet Return On Effort.',
    body:'RoE is the one question every decision passes through. Not "will this get views," but <span class="hl">"is this the highest-leverage use of the little time I have."</span> Your effort is your scarcest asset. Spend it like it.'
  },
  {t:'content',
    part:'Part One',
    fw:'RoE',
    title:'The discipline to ignore 80% of the OK ideas so the main 20% can work.',
    body:'RoE is not doing more, faster. It is doing less, on purpose. When you protect the few high-leverage moves, a small deliberate set of videos will out-earn a channel that posts every single day.'
  },
  {t:'divider',
    part:'Part Two',
    title:'The frameworks',
    body:'Five named moves that turn a little effort into a lot of leverage.'
  },
  {t:'content',
    part:'Part Two',
    fw:'The Magnetic 8 + Endless Click Playbook',
    title:'Make the eight videos your buyers already search for.',
    body:'Identify the eight strategic topics your ideal clients are already looking for. Get these right and they train the algorithm and convert viewers into clients. <span class="hl">The right 8 videos work forever.</span>'
  },
  {t:'content',
    part:'Part Two',
    fw:'Unique Premise',
    title:'Be the only logical choice, not one more voice.',
    body:'A channel premise so distinctive that your audience shares your content for you. Without it, you blend in. With it, the right person cannot look away.'
  },
  {t:'content',
    part:'Part Two',
    fw:'Irresistible Packaging',
    title:'Win the click before you win the view.',
    body:'Titles and thumbnails are the real gatekeepers. A thumbnail 10% better can mean far more views on the very same video. Package the click first, then earn the watch.'
  },
  {t:'content',
    part:'Part Two',
    fw:'Need Magnets',
    title:'Turn every video into a doorway, not a dead end.',
    body:'The lead-capture framework that replaces the traditional lead magnet, so a video converts viewers into leads. Every upload becomes a way in, on every video, not just a view count.'
  },
  {t:'content',
    part:'Part Two',
    fw:'Hook & Hold',
    title:'Earn the next thirty seconds, then hold to the finish.',
    body:'The scriptwriting framework for high-retention videos. Open with a hook that buys attention, then hold it all the way to your call to action so viewers are still there when it matters.'
  },
  {t:'content',
    part:'Part Two',
    fw:'HLA',
    title:'Build High Leverage Assets, not disposable posts.',
    body:'HLA are pieces of content that keep working long after you publish. One well-made video can generate leads for years. <span class="hl">That is what makes 90 minutes a week possible.</span>'
  },
  {t:'content',
    kicker:'The weekly rhythm',
    title:'What 90 minutes a week actually buys you.',
    steps:[
      ['1','<b>Choose</b> the next topic from your Magnetic 8, filtered by RoE.'],
      ['2','<b>Script</b> it with Hook &amp; Hold so it holds attention to the end.'],
      ['3','<b>Package</b> it with an irresistible title and thumbnail.'],
      ['4','<b>Place</b> your Need Magnet, then let the asset compound while you run your business.']
    ]
  },
  {t:'content',
    kicker:'The mindset',
    title:'Eliminate the Perfection Paradox. Show up as your Authentic Self.',
    body:'Perfection is the enemy of leverage. Published and useful beats polished and never posted. And the channel that sounds like the real you is the one strangers trust enough to buy from.'
  },
  {t:'divider',
    part:'Part Three',
    title:'What it looks like in practice.',
    body:'A short, deliberate library of videos, each doing a job. New buyers find you through search, watch, and raise their hand, week after week, from work you already finished. That is a lead machine, not a treadmill.'
  },
  {t:'content',
    kicker:'Why listen to me',
    title:'I am Jerry Potter.',
    body:'A twenty-plus year broadcast professional and content educator. I built Done By Lunch on one idea, Return On Effort, and I have helped <span class="hl">over 1 million people through YouTube</span>. I do not teach you to live on the platform. I teach you to let a few right videos work for you.'
  },
  {t:'content',
    kicker:'The whole system',
    title:'The right few videos, working forever.',
    body:'You do not need more content. You need leverage. RoE to choose it, the Magnetic 8 to be found, Packaging to be clicked, Hook &amp; Hold to be watched, Need Magnets to convert. <span class="hl">All in 90 minutes a week.</span>'
  },
  {t:'cta',
    kicker:'Your next step',
    title:'Come build your lead machine with us.',
    body:'Join the free Done By Lunch Community for Entrepreneurs, then step into the YT90 Activation Lab to install this exact system over eight weeks with support the whole way.',
    actions:[
      ['Join the Done By Lunch Community','primary'],
      ['Step into the YT90 Activation Lab','ghost']
    ],
    disclaimer:'This masterclass is educational only. Results vary based on your effort, your market and your execution. Nothing here is a promise or guarantee of income or of any specific result.'
  }
];

const deck = document.getElementById('deck');
const total = S.length;
const CIRC = 2 * Math.PI * 18;

function arc(i){
  const pct = (i+1)/total;
  return `<svg class="arc" viewBox="0 0 44 44" aria-hidden="true">
    <circle class="track" cx="22" cy="22" r="18"></circle>
    <circle class="fill" cx="22" cy="22" r="18"
      stroke-dasharray="${CIRC}" stroke-dashoffset="${(CIRC*(1-pct)).toFixed(1)}"></circle>
  </svg>`;
}
function chip(){
  return `<span class="chip"><span class="dot"></span>90 min / week</span>`;
}
function corner(i,withChip){
  return `<div class="corner">${withChip?chip():''}${arc(i)}</div>`;
}

function render(s,i){
  const sec = document.createElement('section');
  sec.className = 'slide';
  const pageTag = `<div class="pagenum">${String(i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>`;
  const brand = `<div class="brandmark">Done By Lunch</div>`;

  if(s.t==='title'){
    let seg='';
    for(let k=0;k<6;k++){seg+=`<div class="seg ${k<1?'on':''}" style="width:${k===0?'88px':'44px'}"></div>`;}
    sec.innerHTML = corner(i,false) +
      `<div class="inner">
        <div class="kicker">${s.eyebrow}</div>
        <h1 class="title">${s.title}</h1>
        <p class="subtitle">${s.subtitle}</p>
        <div class="timeblock">${seg}<span class="lbl">One focused block. That is the whole week.</span></div>
      </div>` + pageTag + brand;
    return sec;
  }

  if(s.t==='divider'){
    sec.className='slide divider';
    sec.innerHTML = corner(i,false) +
      `<div class="inner">
        <div class="part">${s.part}</div>
        <h2 class="title">${s.title}</h2>
        ${s.body?`<p class="body">${s.body}</p>`:''}
      </div>` + pageTag + brand;
    return sec;
  }

  if(s.t==='cta'){
    sec.className='slide cream';
    const acts = (s.actions||[]).map(a=>`<span class="btn ${a[1]}">${a[0]}</span>`).join('');
    sec.innerHTML = corner(i,true) +
      `<div class="inner">
        <div class="kicker">${s.kicker}</div>
        <h2 class="title">${s.title}</h2>
        <p class="body">${s.body}</p>
        <div class="cta-actions">${acts}</div>
        <p class="disclaimer">${s.disclaimer}</p>
      </div>` + pageTag + brand;
    return sec;
  }

  // content
  const head = [];
  if(s.part) head.push(`<div class="part">${s.part}</div>`);
  if(s.fw) head.push(`<div class="fw"><span class="lever"></span>${s.fw}</div>`);
  if(s.kicker) head.push(`<div class="kicker">${s.kicker}</div>`);
  let mid = `<h2 class="title">${s.title}</h2>`;
  if(s.body) mid += `<p class="body">${s.body}</p>`;
  if(s.steps){
    mid += '<ul class="steps">' + s.steps.map(st=>`<li><span class="n">${st[0]}</span><span>${st[1]}</span></li>`).join('') + '</ul>';
  }
  sec.innerHTML = corner(i,true) +
    `<div class="inner">${head.join('')}${mid}</div>` + pageTag + brand;
  return sec;
}

S.forEach((s,i)=>deck.appendChild(render(s,i)));

// arrow-key navigation
let idx = 0;
const slides = () => Array.from(deck.querySelectorAll('.slide'));
function go(n){
  const els = slides();
  idx = Math.max(0, Math.min(els.length-1, n));
  els[idx].scrollIntoView({behavior:'smooth'});
}
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(idx+1);}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(idx-1);}
  if(e.key==='Home'){e.preventDefault();go(0);}
  if(e.key==='End'){e.preventDefault();go(S.length-1);}
});
// track scroll position so keys stay in sync
let ticking=false;
deck.addEventListener('scroll',()=>{
  if(ticking) return;
  ticking=true;
  requestAnimationFrame(()=>{
    const els=slides();
    const mid=deck.scrollTop + window.innerHeight/2;
    for(let k=0;k<els.length;k++){
      if(els[k].offsetTop<=mid && els[k].offsetTop+els[k].offsetHeight>mid){idx=k;break;}
    }
    ticking=false;
  });
});
</script>
</body>
</html>
