<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Aligned Business - a masterclass with Tara Kirby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1E8; --panel:#EFE6D7; --rule:#D9C9B2; --ink:#2B2622; --accent:#B5584B;
    --muted:#6f655c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:54px 50px;margin:0 0 26px;min-height:360px;display:flex;flex-direction:column;justify-content:center}
  .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 18px}
  h1{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:58px;line-height:1.04;margin:0 0 16px;letter-spacing:-.01em}
  h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:40px;line-height:1.1;margin:0 0 16px}
  p{font-size:19px;line-height:1.6;margin:0 0 12px;max-width:62ch;color:#3a332d}
  .lead{font-size:22px;color:var(--ink)}
  .rule{height:1px;background:var(--rule);border:0;margin:22px 0}
  ul{margin:10px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:64ch}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .big{font-family:"Cormorant Garamond",serif;font-size:46px;line-height:1.08;color:var(--ink)}
  .big .a{color:var(--accent)}
  .disc{font-size:14px;color:var(--muted);margin-top:18px;max-width:70ch}
  .foot{font-size:13px;color:var(--muted);margin-top:26px;letter-spacing:.04em}
  .num{font-size:13px;color:var(--muted);margin-bottom:10px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S=[
  {t:'title',
   kick:'A free masterclass with Tara Kirby',
   h:'The Aligned Business',
   p:'How to build real wealth without burning out, for the mom who refuses to let her business run her life.'},

  {t:'who',
   kick:'Who this is for',
   h2:'If you are doing everything, and you are still exhausted',
   p:'You started this business for freedom. Somewhere along the way it started asking for more hours, more launches, more hustle, and giving you less of the life it was supposed to buy. This is for the woman entrepreneur who knows there has to be another way.'},

  {t:'trap',
   kick:'The trap',
   h2:'The hustle promise',
   p:'Work harder. Post more. Add another funnel. Scale, scale, scale. The whole industry sells the same answer, and it is the reason so many talented women are quietly burning out while their revenue plateaus.',
   list:['More effort has stopped moving the number.','Rest feels like falling behind.','You are the bottleneck, and you are tired.']},

  {t:'cost',
   kick:'The hidden cost',
   h2:'The business was supposed to buy the life',
   p:'Instead it quietly took the mornings, the energy for your kids, the version of you that felt calm and creative. The cruel part is that working harder is making it worse, not better.'},

  {t:'reframe',
   kick:'The real problem',
   big:'You do not have a strategy problem. You have an <span class="a">alignment</span> problem.'},

  {t:'reframe2',
   kick:'The real problem',
   h2:'Your revenue ceiling is a nervous-system ceiling',
   p:'You cannot scale sustainably from a dysregulated, depleted place. When your nervous system is in survival mode, every decision gets harder, every launch costs more, and the business feels heavy no matter how good the strategy is. The fix is not more hustle. It is coming back into alignment first.'},

  {t:'part',
   num:'PART ONE',
   kick:'The core problem',
   h2:'Hustle scales your exhaustion, not your wealth',
   p:'When the business is built on force, growth multiplies the force. You add clients and you add overwhelm at the same rate. That is why the next six-figure jump keeps costing you more than it gives back.'},

  {t:'part',
   num:'PART ONE',
   kick:'The core problem',
   h2:'Alignment is a business model, not a mood',
   p:'Alignment is not about affirmations. It is a way of building: offers that fit who you actually are, a schedule built around your real energy, and decisions made from self-trust instead of panic. Done right, it is the most profitable thing you will ever do.'},

  {t:'part',
   num:'PART ONE',
   kick:'The core problem',
   h2:'Self-trust is the skill nobody taught you',
   p:'Most of the second-guessing, the over-asking, the endless course-buying comes from one place: not trusting your own read on your own business. Rebuild that, and your decisions get faster, cleaner, and far cheaper.'},

  {t:'part',
   num:'PART TWO',
   kick:'The method',
   h2:'The DREAM Method',
   p:'This is the method I used to build a six-figure business on part-time hours, and the one I now certify other coaches to teach. It rests on four practices. The masterclass walks through each one with the actual steps.'},

  {t:'pillar',
   num:'PART TWO - PRACTICE 1',
   kick:'Regulate',
   h2:'A regulated nervous system',
   p:'Before strategy, regulation. Simple breathwork and daily practices that move you out of survival mode, so you can make clear decisions and hold a bigger vision without the spiral.'},

  {t:'pillar',
   num:'PART TWO - PRACTICE 2',
   kick:'Align',
   h2:'Energy aligned to your cycle',
   p:'You are not a machine that outputs the same every day. We plan launches, content, and deep work around your natural energy cycles, so the work lands when you are actually resourced to do it.'},

  {t:'pillar',
   num:'PART TWO - PRACTICE 3',
   kick:'Offer',
   h2:'Soul-led offers that actually sell',
   p:'Offers built from your real gifts and your clients real desires, priced for profit, so selling stops feeling like convincing and starts feeling like an invitation.'},

  {t:'pillar',
   num:'PART TWO - PRACTICE 4',
   kick:'Sustain',
   h2:'Wealth that does not cost your life',
   p:'Part-time hours, more than one income stream, and a business that keeps running when you step away. This is wealth redefined on your own terms, which is the whole point.'},

  {t:'part',
   num:'PART THREE',
   kick:'The aligned week',
   h2:'A week that runs on alignment',
   p:'Imagine a week planned around your energy instead of against it. Fewer, better offers. Decisions made from calm. A launch that does not leave you flat for a month afterward. The number grows, and so does the life around it.'},

  {t:'part',
   num:'PART THREE',
   kick:'Redefine wealth on your own terms',
   h2:'Wealth that includes your life',
   p:'Real wealth is not just the revenue line. It is the Tuesday afternoon with your kids, the launch you ran without dread, the morning you woke up excited about the work again. You get to define what rich actually means for you, and then build for that.'},

  {t:'walk',
   kick:'What you will walk away with',
   h2:'By the end of this session',
   p:'You will be able to name exactly where your business is out of alignment, see what it is quietly costing you, and know the first practice to put in place this week.',
   list:['The one place your energy is leaking the most.','A simpler offer shape that fits who you are.','A first step you can take before you close this page.']},

  {t:'why',
   num:'PART THREE',
   kick:'Why me',
   h2:'I have lived both versions',
   p:'I am Tara Kirby, a mom of three. I left everything, built the DREAM Method, and grew a six-figure coaching business working part-time from home. Now I host the Wealthy Momma podcast and lead the Dream Maker Society, helping women build wealth on their own terms. I teach this because I needed it first.'},

  {t:'cta',
   kick:'Your next step',
   h2:'Come build your aligned business',
   p:'In the free masterclass I will walk you through the DREAM Method step by step, and show you where your own business is out of alignment and what to do first. Bring the business you already have. Leave with a way to grow it that does not cost you your life.',
   cta:'Join the masterclass inside the Dream Maker Society',
   disc:'Educational only. No income or result is guaranteed. Results vary and depend on your own effort, market, and circumstances.',
   foot:'The DREAM Method  /  Dream Maker Society  /  Tara Kirby'}
];

function esc(x){return x==null?'':x;}
const app=document.getElementById('app');
app.innerHTML=S.map(function(s){
  var parts=['<section class="slide">'];
  if(s.num)parts.push('<div class="num">'+esc(s.num)+'</div>');
  if(s.kick)parts.push('<div class="kick">'+esc(s.kick)+'</div>');
  if(s.h)parts.push('<h1>'+esc(s.h)+'</h1>');
  if(s.h2)parts.push('<h2>'+esc(s.h2)+'</h2>');
  if(s.big)parts.push('<div class="big">'+esc(s.big)+'</div>');
  if(s.p)parts.push('<p class="lead">'+esc(s.p)+'</p>');
  if(s.list){parts.push('<ul>');s.list.forEach(function(i){parts.push('<li>'+esc(i)+'</li>');});parts.push('</ul>');}
  if(s.cta)parts.push('<hr class="rule"><p class="lead" style="color:var(--accent);font-weight:600">'+esc(s.cta)+'</p>');
  if(s.disc)parts.push('<div class="disc">'+esc(s.disc)+'</div>');
  if(s.foot)parts.push('<div class="foot">'+esc(s.foot)+'</div>');
  parts.push('</section>');
  return parts.join('');
}).join('');
</script>
</body>
</html>
