<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak Without Fear, From the Inside Out — Dr. Doreen Downing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Overpass:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f1ee; --panel:#fbfdfc; --rule:#d2e0dc; --ink:#243433;
    --muted:#5c6b69; --accent:#326e6e; --coral:#ec645c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Overpass",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vmin}
  .slide{display:none;width:min(1040px,94vw);background:var(--panel);border:1px solid var(--rule);
    border-radius:14px;padding:7vmin 7vmin;box-shadow:0 18px 50px rgba(36,52,51,.07)}
  .slide.on{display:block;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kick{font-family:"Oswald",sans-serif;letter-spacing:.22em;text-transform:uppercase;
    font-size:14px;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:"Oswald",sans-serif;font-weight:700;font-size:clamp(30px,5.4vw,58px);line-height:1.06;letter-spacing:.005em}
  h2{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(24px,4vw,40px);line-height:1.12}
  .rule{height:3px;width:68px;background:var(--accent);border-radius:3px;margin:22px 0}
  p{font-size:clamp(17px,2.1vw,22px);line-height:1.5;color:var(--muted);max-width:40ch}
  p.lead{color:var(--ink);font-weight:500}
  .big{font-size:clamp(22px,3vw,30px);color:var(--ink);max-width:30ch}
  ul{list-style:none;margin-top:8px}
  li{font-size:clamp(17px,2.1vw,21px);line-height:1.45;color:var(--ink);padding:10px 0 10px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:44ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .num{font-family:"Oswald",sans-serif;color:var(--coral);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
  .coral{color:var(--coral)}
  .strike{text-decoration:line-through;text-decoration-color:var(--coral);text-decoration-thickness:3px;color:var(--muted)}
  .who{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
  .who span{font-size:15px;background:#eef3f2;color:var(--accent);border:1px solid #d8e6e4;padding:7px 13px;border-radius:999px;font-weight:600}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:54ch;line-height:1.4}
  .cta-line{font-family:"Oswald",sans-serif;font-weight:600;color:var(--accent);font-size:clamp(18px,2.3vw,24px);margin-top:6px}
  footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
    align-items:center;padding:14px 22px;font-size:12px;color:var(--muted)}
  .nav{display:flex;gap:8px}
  .nav button{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    background:var(--panel);border:1px solid var(--rule);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
  .nav button:hover{border-color:var(--accent);color:var(--accent)}
  .brand{font-family:"Oswald",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="stage"></div>
<footer>
  <span class="brand">Find Your Voice &middot; Change Your Life</span>
  <span class="nav"><button onclick="go(-1)">Prev</button><span id="count"></span><button onclick="go(1)">Next</button></span>
</footer>
<script>
const S=[
  {t:'title',kick:'A Live Training with Dr. Doreen Downing',h:'Speak Without Fear, From the Inside Out',sub:'Why the shaky voice, the pounding heart, and the blank mind are not a flaw in you, and the seven shifts that settle them.'},
  {t:'who',kick:'Who this is for',h:'If speaking up still makes your body brace',who:['The meeting that tightens your chest','The toast you dread for weeks','Going blank the moment eyes turn to you','A voice that shakes and gives you away'],sub:'You are not shy and you are not broken. Your body is protecting you, and it can learn a new response.'},
  {t:'big',kick:'The trap',h:'You have tried the tips',big:'Breathe. Picture them in their underwear. Just practice more. And still, the second it is your turn, the heart pounds and the words scatter.'},
  {t:'big',kick:'A harder truth',h:'Technique was never the missing piece',big:'You cannot out-rehearse a nervous system that is on alert. The fear is older and deeper than your slides.'},
  {t:'part',kick:'Part One',h:'The real problem',sub:'Two things are happening at once, and neither is about your words.'},
  {t:'big',kick:'One: the body',h:'A body on alert',big:'To the nervous system, every pair of eyes can read like a threat. The shake, the flush, the blank are survival responses, not evidence that you are bad at this.'},
  {t:'big',kick:'Two: the mask',h:'A self you are hiding',big:'Most of us walk in trying to perform a more impressive version of ourselves. The effort of the mask is exhausting, and audiences feel the distance.'},
  {t:'part',kick:'Part Two',h:'The Find Your Voice Method',sub:'Seven shifts, worked from the inside out. Settle the body first, then let the real you be seen.'},
  {t:'secret',n:'Secret 1',h:'Calm the nervous system first',sub:'Before a single word, learn to down-regulate the body so it stops reading the room as danger.'},
  {t:'secret',n:'Secret 2',h:'Speak from a centered, grounded body',sub:'Stay rooted in yourself instead of leaning into the audience for approval. Center is where a steady voice lives.'},
  {t:'secret',n:'Secret 3',h:'Get comfortable being looked at',sub:'Attention is not attack. We practice receiving it until being seen feels safe rather than exposing.'},
  {t:'secret',n:'Secret 4',h:'Listen while you speak',sub:'Speaking becomes a relationship, not a performance. When you stay with your listeners, the pressure to be perfect drops away.'},
  {t:'secret',n:'Secret 5',h:'Let your authentic self be seen',sub:'This is your Essence, the calm core underneath the mask. Speaking from it is what makes a person magnetic.'},
  {t:'secret',n:'Secret 6',h:'Build real presence with the room',sub:'Relational presence is a felt connection, created on purpose. It is the difference between talking at people and being with them.'},
  {t:'secret',n:'Secret 7',h:'Say what is true, as you',sub:'Confidence is not volume. It is the quiet certainty of saying what you mean in your own voice.'},
  {t:'big',kick:'The shift',h:'From performance to presence',big:'You were never meant to deliver a performance. You were meant to be present, as yourself. That is the whole move.'},
  {t:'part',kick:'Part Three',h:'When the fear lets go',sub:'Not a louder you. A steadier one.'},
  {t:'who',kick:'On the other side',h:'When the body is settled and the mask is off',who:['A voice that holds steady','Words that arrive when you need them','Connection instead of dread','You actually enjoy being heard'],sub:'The goal is not zero nerves. It is a body you can steady and a self you can trust in the room.'},
  {t:'why',kick:'Why me',h:'Dr. Doreen Downing',sub:'A psychologist who spent years helping people transform the fear of speaking. Training Director of Speaking Circles International, host of the Find Your Voice, Change Your Life podcast, and author of Essential Speaking: The 7-Step Guide to Finding Your Real Voice. I know the pounding heart from the inside. I built this method because I lived it.'},
  {t:'cta',kick:'Your next step',h:'Start finding your voice',cta:'Download the free 7-Step Guide to Fearless Speaking, then book your Anxiety Breakthrough Session.',disc:'This training is educational. No income or result is guaranteed. Results vary from person to person and depend on your own effort and circumstances.'}
];
const stage=document.getElementById('stage');
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('section');
    d.className='slide'+(i===cur?' on':'');
    let h='';
    if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
    if(s.n) h+='<div class="num">'+s.n+'</div>';
    if(s.h) h+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
    h+='<div class="rule"></div>';
    if(s.big) h+='<p class="big">'+s.big+'</p>';
    if(s.who){h+='<div class="who">';s.who.forEach(w=>h+='<span>'+w+'</span>');h+='</div>';}
    if(s.sub) h+='<p class="lead">'+s.sub+'</p>';
    if(s.cta) h+='<p class="cta-line">'+s.cta+'</p>';
    if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
    d.innerHTML=h;
    stage.appendChild(d);
  });
  document.getElementById('count').textContent=(cur+1)+' / '+S.length;
}
let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,cur+n));render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')go(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(-1)});
render();
</script>
</body>
</html>
