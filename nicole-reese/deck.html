<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Beautiful Communities Quietly Fall Apart — Terrenity Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfaf4;      /* warm near-white (brand #fdfaf4) */
    --panel:#ede3cc;   /* sand (brand #ede3cc) */
    --ink:#2a1209;     /* espresso (brand #2a1209) */
    --accent:#7b3f6e;  /* plum (brand #7b3f6e) */
    --accent2:#1e6b6b; /* teal (brand #1e6b6b) */
    --muted:#6d5a4a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Lato",sans-serif;line-height:1.5}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;border-bottom:1px solid rgba(42,18,9,.12);position:relative}
  .slide.alt{background:var(--panel)}
  .num{position:absolute;top:4.5vh;right:8vw;font-family:"Syne";font-weight:700;
    font-size:.8rem;letter-spacing:.18em;color:var(--accent)}
  .eyebrow{font-family:"Syne";font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    font-size:.78rem;color:var(--accent);margin-bottom:1.3rem}
  h1{font-family:"Syne";font-weight:800;font-size:clamp(2.1rem,5.2vw,3.9rem);line-height:1.05;
    letter-spacing:-.01em;max-width:19ch}
  h2{font-family:"Syne";font-weight:700;font-size:clamp(1.6rem,3.8vw,2.7rem);line-height:1.12;
    max-width:21ch;margin-bottom:1rem}
  p{font-size:clamp(1.05rem,1.7vw,1.35rem);max-width:42ch;color:var(--ink)}
  .rule{width:64px;height:3px;background:var(--accent);margin:1.5rem 0}
  .by{margin-top:2.4rem;font-family:"Syne";font-weight:700;letter-spacing:.04em}
  .by b{color:var(--accent)}
  .pillar{font-family:"Syne";font-weight:800;color:var(--accent);
    font-size:clamp(1.7rem,4vw,2.8rem);line-height:1.1;margin-bottom:1rem;display:block}
  ul{list-style:none;margin-top:1.3rem;max-width:42ch}
  li{position:relative;padding-left:1.7rem;margin:.7rem 0;font-size:clamp(1.02rem,1.6vw,1.28rem)}
  li:before{content:"";position:absolute;left:0;top:.55em;width:9px;height:9px;
    background:var(--accent);border-radius:50%}
  .stats{display:flex;gap:3vw;flex-wrap:wrap;margin-top:1.8rem}
  .stats b{display:block;font-family:"Syne";font-weight:800;font-size:clamp(2rem,4vw,3.1rem);color:var(--accent2)}
  .stats small{color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-size:.72rem}
  .gens{display:flex;gap:2.4rem;flex-wrap:wrap;margin-top:1.6rem}
  .gens div{flex:1 1 210px;border-top:3px solid var(--accent);padding-top:.9rem}
  .gens h3{font-family:"Syne";font-weight:800;font-size:1.3rem;color:var(--accent)}
  .gens p{font-size:1rem;color:var(--muted);max-width:26ch}
  .cta{background:var(--ink);color:var(--bg)}
  .cta .eyebrow{color:#d9a7cc}
  .cta h1{color:var(--bg)}
  .cta p{color:#efe3d6}
  .btn{display:inline-block;margin-top:2rem;font-family:"Syne";font-weight:700;
    background:var(--accent);color:#fff;text-decoration:none;padding:.9rem 1.8rem;border-radius:3px}
  .disc{margin-top:2.4rem;font-size:.82rem;color:#c6b8a9;max-width:54ch;line-height:1.45}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass', h1:'Why Beautiful Communities Quietly Fall Apart',
    sub:'And the people-first design that makes a village actually hold.',
    by:'with <b>Nicole Reese</b>, Terrenity'},

  {t:'point', num:'01', eyebrow:'Who this is for',
    h2:'You want to start, finance, or hold together an intentional community.',
    p:'Maybe you have the vision. Maybe you already have the land. What you are missing is the thing that decides whether any of it survives: aligned people who stay.'},

  {t:'point', num:'02', eyebrow:'The trap',
    h2:'The land is the easy part. The people are the whole thing.',
    p:'Founders pour years into a site, architects, and a pretty render. Then they cannot get anyone to truly commit, and the few who do quietly drift away.'},

  {t:'stat', num:'03', eyebrow:'What six years in the field showed',
    h2:'The prettiest communities I visited were the ones quietly dying.',
    p:'I kept arriving at places that looked beautiful from the outside and were falling apart from the inside.',
    stats:[{b:'40+',s:'Villages visited'},{b:'12',s:'Countries'},{b:'6 yrs',s:'In the field'}]},

  {t:'point', num:'04', eyebrow:'Part one: the core problem',
    h2:'"Build it and they will come" is the number one killer.',
    p:'Vision holders buy the land, work with architects, and then spend years unsuccessfully trying to get people to buy in. The order is backwards.'},

  {t:'quote', num:'05', eyebrow:'The hard line',
    h1:'Without community-led development, the project is just a lifestyle real-estate development.'},

  {t:'point', num:'06', eyebrow:'The real scarcity',
    h2:'Founders say their number one need is capable, aligned members.',
    p:'Not capital. Not land. People. Because pooled people are pooled capital, pooled talent, and pooled motivation.'},

  {t:'title', num:'07', kicker:'Part two: the method', h1:'The People-First Route',
    sub:'Five foundations, built in the right order, that let a community hold together long enough to finish anything.'},

  {t:'pillar', num:'08', eyebrow:'Foundation one', pillar:'People before land.',
    p:'Recruit and align the founding group first. The land is chosen to fit the people, not the other way around.'},

  {t:'pillar', num:'09', eyebrow:'Foundation two', pillar:'Governance and agreements.',
    p:'Decide how decisions get made, how ownership works, and who holds what, before conflict forces a messy answer.'},

  {t:'pillar', num:'10', eyebrow:'Foundation three', pillar:'Member vetting and fit.',
    p:'A real vetting system, not vibes. The wrong five people can unwind what the right fifty built.'},

  {t:'pillar', num:'11', eyebrow:'Foundation four', pillar:'Conflict navigation.',
    p:'Community brings everyone\'s shadows to the surface. A mediation toolkit, scripts, and a way to close a conflict well are not optional.'},

  {t:'pillar', num:'12', eyebrow:'Foundation five', pillar:'Leadership succession.',
    p:'Plan for intergenerational leadership early, or the project stalls the moment its first stewards burn out or move on.'},

  {t:'gen', num:'13', eyebrow:'A map for your project',
    h2:'Three generations of community. Where does yours sit?',
    gens:[{g:'1.0',p:'Tech-avoidant retreats, off the grid and off the map.'},
          {g:'2.0',p:'Cozy escapes built for the fortunate few.'},
          {g:'3.0',p:'Solarpunk enclaves that integrate modern technology.'}]},

  {t:'point', num:'14', eyebrow:'The timeline truth',
    h2:'Plan for about ten years to establish and mature.',
    p:'Most founders underestimate the arc by half. Designing for the long horizon is what separates a village from a burnout.'},

  {t:'point', num:'15', eyebrow:'What a village that holds looks like',
    h2:'A community that holds through its first hard winter.',
    p:'People who chose each other on purpose, agreements they trust, and a way through conflict that keeps them at the table.'},

  {t:'point', num:'16', eyebrow:'Before you build',
    h2:'Run the Village Diagnostic across all five foundations.',
    p:'Assess readiness honestly before you spend a dollar on land. Clarity instead of wishful thinking.'},

  {t:'list', num:'17', eyebrow:'Why listen to me',
    h2:'I left my job in 2021 to study this full-time.',
    items:['Seven years in urban sustainability and community organizing first',
      '40+ villages documented across 12 countries over six years',
      'Certified in Ecovillage Design by the Global Ecovillage Network',
      '5,900+ readers follow the research every week']},

  {t:'cta', kicker:'Your next step', h1:'Ready to design a village that actually holds?',
    p:'Apply to work with Terrenity and build your project people-first, from the foundations up.',
    btn:'Apply to work together', href:'https://www.terrenity.org',
    disc:'This masterclass is educational. Building an intentional community is long, demanding work, and no specific outcome, timeline, or financial result is promised or guaranteed. Every community and context is different.'}
];

const root = document.getElementById('deck');
S.forEach((s,i)=>{
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.t==='cta'?' cta':'') + (i%2===1 && s.t!=='cta'?' alt':'');
  let h = '';
  if(s.num) h += '<span class="num">'+s.num+'</span>';
  else h += '<span class="num">Terrenity</span>';
  if(s.kicker) h += '<div class="eyebrow">'+s.kicker+'</div>';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.pillar) h += '<span class="pillar">'+s.pillar+'</span>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.t==='title') h += '<div class="rule"></div>';
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.p) h += '<p>'+s.p+'</p>';
  if(s.sub) h += '<p>'+s.sub+'</p>';
  if(s.stats){ h += '<div class="stats">'; s.stats.forEach(x=>{ h += '<div><b>'+x.b+'</b><small>'+x.s+'</small></div>'; }); h += '</div>'; }
  if(s.gens){ h += '<div class="gens">'; s.gens.forEach(x=>{ h += '<div><h3>'+x.g+'</h3><p>'+x.p+'</p></div>'; }); h += '</div>'; }
  if(s.items){ h += '<ul>'; s.items.forEach(x=>{ h += '<li>'+x+'</li>'; }); h += '</ul>'; }
  if(s.by) h += '<div class="by">'+s.by+'</div>';
  if(s.btn) h += '<a class="btn" href="'+s.href+'">'+s.btn+'</a>';
  if(s.disc) h += '<p class="disc">'+s.disc+'</p>';
  sec.innerHTML = h;
  root.appendChild(sec);
});
</script>
</body>
</html>
