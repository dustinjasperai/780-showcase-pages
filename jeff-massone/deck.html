<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Before the Title — Prepared Leader Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4eee1;        /* ivory paper derived from brand gold #d69b00 (light scheme) */
    --panel:#fffdf6;     /* warm panel, gold-family tint */
    --ink:#223c60;       /* brand deep navy */
    --slate:#607593;     /* brand slate blue */
    --rule:#e7dcc4;      /* gold-tinted rule */
    --accent:#d69b00;    /* brand dominant gold */
    --head:'Newsreader',Georgia,serif;
    --body:'Open Sans',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:440px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(34,60,96,.03);
  }
  .num{position:absolute;top:22px;right:28px;font-size:12px;letter-spacing:.16em;color:var(--slate);font-weight:600}
  .eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.12;margin-bottom:14px}
  .sub{font-size:20px;color:var(--slate);line-height:1.45;margin-top:18px;max-width:40ch}
  p.lead{font-size:20px;line-height:1.5;color:var(--ink);max-width:52ch}
  ul{list-style:none;margin-top:20px}
  li{font-size:19px;line-height:1.4;padding:14px 0 14px 34px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:22px;width:14px;height:14px;border-radius:3px;background:var(--accent)}
  .big{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.14;max-width:22ch}
  .partnum{font-family:var(--head);font-size:120px;font-weight:700;color:var(--accent);opacity:.18;line-height:1}
  .room{font-family:var(--head);font-size:30px;color:var(--accent);font-weight:600;margin-bottom:10px}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:22px 24px;margin-top:22px}
  .card b{color:var(--accent)}
  .footer{position:absolute;bottom:20px;left:56px;font-size:12px;letter-spacing:.14em;color:var(--slate);text-transform:uppercase}
  .disclaimer{font-size:13px;color:var(--slate);line-height:1.5;margin-top:26px;max-width:56ch}
  .cta-line{font-size:22px;color:var(--ink);font-weight:600;margin-top:16px}
  .accentbar{width:56px;height:5px;background:var(--accent);border-radius:3px;margin:22px 0 4px}
  @media(max-width:620px){.slide{padding:38px 26px}h1{font-size:38px}.big{font-size:30px}.partnum{font-size:84px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND="Prepared Leader Consulting";
const S=[
 {t:'title'},
 {t:'who'},
 {t:'point',eyebrow:'The promise you were sold',h:'You were told the work would speak for itself.',sub:'It does not. Not on its own. The best work in the building still needs someone in the right room saying your name.'},
 {t:'reframe',big:'Your reputation is decided in rooms you are not in.'},
 {t:'part',n:'1',label:'Part One',h:'The three rooms where your next promotion is actually decided.'},
 {t:'room',room:'The Calibration Meeting',h:'Managers across teams compare their people and agree on ratings and promotion candidates.',sub:'If your manager walks in with vague language about you, you lose before the conversation starts.'},
 {t:'room',room:'The Talent Review',h:'Senior leaders identify the high-potential people and decide who gets pulled into stretch opportunities.',sub:'You are either a name they already trust, or a name nobody brings up.'},
 {t:'room',room:'Succession Planning',h:'Leadership maps who is next for roles that have not opened yet.',sub:'The roles you want are being assigned long before they are posted.'},
 {t:'point',eyebrow:'The quiet cost',h:'Great work, done quietly, is invisible work.',sub:'The ability to sound confident is not the same as the ability to create clarity. And being overworked is not the same as being valued.'},
 {t:'part',n:'2',label:'Part Two',h:'How to become undeniable in all three rooms, without playing politics.'},
 {t:'tactic',eyebrow:'Tactic One',h:'Equip your manager.',sub:'Every quarter, send your manager a short note they can carry straight into the room.',card:['Your biggest deliverable','The business impact, quantified','A senior stakeholder who saw it','A hard problem only you solved']},
 {t:'point',eyebrow:'Tactic Two',h:'Cultivate external advocates.',sub:'Build one real relationship with a senior leader outside your direct chain. After cross-functional work, send a short recap of the outcome. Now someone can speak for you when you are not in the room.'},
 {t:'point',eyebrow:'Tactic Three',h:'Write your one-line summary.',sub:'A short, memorable descriptor of your value that leaders repeat as shorthand. "The one who lands the complex programs through the regulatory minefield." Give them the line so they do not have to invent one.'},
 {t:'reframe',big:'You do not need more confidence. You need a scoreboard.'},
 {t:'part',n:'3',label:'Part Three',h:'What leading before the title looks like in your first ninety days.'},
 {t:'point',eyebrow:'The first 90 days',h:'Preparation, underway before the opportunity.',list:['Pick the role you are preparing for, not the one you have','Send the first quarterly update to your manager','Name and reach one external advocate','Draft the one-line summary and test it','Show up in the room through the people who are in it']},
 {t:'why'},
 {t:'point',eyebrow:'The idea in one line',h:'When the opportunity comes, preparation should already be underway.',sub:'Leadership development begins before the title. That is the whole game.'},
 {t:'cta',h:'Start preparing before the title arrives.',lead:'If you want help applying this to your own situation, come work with me. We start with a conversation about where you are and where you are trying to go.',disclaimer:'This masterclass is for educational purposes only. No specific result is guaranteed. Results vary and depend on your own effort and circumstances, including any promotion, raise, or career outcome.'},
];
function render(){
 const d=document.getElementById('deck');
 S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  const num=`<div class="num">${String(i+1).padStart(2,'0')} / ${S.length}</div>`;
  const foot=`<div class="footer">${BRAND}</div>`;
  let h='';
  if(s.t==='title'){
   h=`<div class="eyebrow">A live masterclass</div>
      <h1>Lead Before<br>the Title</h1>
      <div class="accentbar"></div>
      <p class="sub">How high performers get seen and promoted in the rooms they are not in.</p>`;
  }else if(s.t==='who'){
   h=`<div class="eyebrow">Who this is for</div>
      <h2>You are very good at your job. That has stopped being enough.</h2>
      <ul>
       <li>You deliver, you carry the invisible load, and you keep getting passed over.</li>
       <li>You watch louder people get promoted on talk, not results.</li>
       <li>You want to advance without turning into someone who plays office games.</li>
      </ul>`;
  }else if(s.t==='point'){
   h=`<div class="eyebrow">${s.eyebrow||''}</div><h2>${s.h}</h2>`;
   if(s.sub)h+=`<p class="lead">${s.sub}</p>`;
   if(s.list){h+='<ul>'+s.list.map(x=>`<li>${x}</li>`).join('')+'</ul>';}
  }else if(s.t==='reframe'){
   h=`<div class="accentbar"></div><div class="big">${s.big}</div>`;
  }else if(s.t==='part'){
   h=`<div class="partnum">${s.n}</div><div class="eyebrow">${s.label}</div><h2>${s.h}</h2>`;
  }else if(s.t==='room'){
   h=`<div class="room">${s.room}</div><h2>${s.h}</h2><p class="sub">${s.sub}</p>`;
  }else if(s.t==='tactic'){
   h=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2><p class="lead">${s.sub}</p>
      <div class="card"><b>The quarterly update</b><ul>${s.card.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  }else if(s.t==='why'){
   h=`<div class="eyebrow">Why listen to me</div>
      <h2>I spent twenty years inside corporate America before I taught any of this.</h2>
      <p class="lead">I made the early-career mistakes first. I learned how the rooms actually work, then built Prepared Leader Consulting to teach it. I am a John Maxwell Team certified coach, and I work with ambitious professionals one on one and in small groups.</p>`;
  }else if(s.t==='cta'){
   h=`<div class="eyebrow">Your next step</div>
      <h2>${s.h}</h2>
      <p class="lead">${s.lead}</p>
      <div class="cta-line">preparedleaderconsulting.com</div>
      <p class="disclaimer">${s.disclaimer}</p>`;
  }
  el.innerHTML=num+h+foot;
  d.appendChild(el);
 });
}
render();
</script>
</body>
</html>
