<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standout Systems — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9fafb; --panel:#ffffff; --rule:#e5e7eb;
  --ink:#030712; --muted:#6b7280;
  --accent:#7c3aed; --accent2:#00d6c1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Mulish',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.deck{max-width:960px;margin:0 auto;padding:48px 24px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 2px rgba(3,7,18,.04)}
h1,h2,h3,.kicker{font-family:'Hanken Grotesk',sans-serif}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
h1{font-size:52px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
h2{font-size:34px;line-height:1.12;font-weight:600;letter-spacing:-.01em}
h3{font-size:22px;font-weight:600;margin-bottom:10px}
.sub{font-size:20px;color:var(--muted);margin-top:20px;max-width:40ch}
.lead{font-size:22px;max-width:46ch}
.big{font-size:40px;line-height:1.15;font-weight:600;font-family:'Hanken Grotesk',sans-serif;max-width:22ch}
.presenter{margin-top:34px;font-size:16px;color:var(--muted)}
.presenter b{color:var(--ink);font-weight:600}
ul{list-style:none;margin-top:22px}
li{position:relative;padding:14px 0 14px 34px;border-top:1px solid var(--rule);font-size:19px;max-width:54ch}
li:before{content:"";position:absolute;left:0;top:22px;width:14px;height:2px;background:var(--accent)}
.num li{padding-left:50px}
.num li:before{content:counter(n);counter-increment:n;top:12px;left:0;width:28px;height:28px;background:rgba(124,58,237,.1);color:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;font-family:'Hanken Grotesk',sans-serif}
.num{counter-reset:n}
.quote{font-family:'Hanken Grotesk',sans-serif;font-size:36px;line-height:1.25;font-weight:600;max-width:24ch}
.quote .cite{display:block;font-family:'Mulish',sans-serif;font-size:16px;font-weight:500;color:var(--muted);margin-top:24px}
.tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--accent2);text-transform:uppercase;margin-bottom:14px}
.frame .def{font-size:20px;color:var(--muted);margin-top:14px;max-width:50ch}
.disc{font-size:14px;color:var(--muted);margin-top:28px;max-width:60ch;line-height:1.5}
.cta .lead{margin-top:10px}
.step{margin-top:26px}
.step a{color:var(--accent);font-weight:600;text-decoration:none}
.footer-note{font-size:14px;color:var(--muted);margin-top:18px}
.pill{display:inline-block;padding:6px 14px;border:1px solid var(--rule);border-radius:999px;font-size:14px;color:var(--muted);margin:6px 8px 0 0}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
{t:'title', cls:'', html:`<div class="kicker">A Standout Systems Masterclass</div><h1>Standout Systems</h1><p class="sub">How senior AI and ML engineers get seen, promoted, and paid, without playing the interview-cram game.</p><p class="presenter"><b>Dr Teodora Szasz</b><br>PhD. Staff-level ML scientist. Still building clinical AI in industry.</p>`},

{t:'who', cls:'', html:`<div class="kicker">Who this is for</div><h2>You are great at the work. You are quiet in the rooms that decide your career.</h2><ul><li>Senior AI and ML engineers and data scientists who keep shipping while someone less capable gets promoted.</li><li>Principal and staff engineers ready to lead, not just contribute.</li><li>Strong technical people who go flat the moment the stakes get high.</li></ul>`},

{t:'hook', cls:'', html:`<div class="kicker">The trap</div><p class="big">You do not rise to the occasion. You fall to the level of your systems.</p><p class="sub">Most engineers believe better work speaks for itself. It does not. The ones who get ahead are not louder or smarter. They run a system for being seen.</p>`},

{t:'part', cls:'', html:`<div class="tag">Part One</div><h2>Why brilliant engineers stall out.</h2>`},

{t:'list', cls:'', html:`<h3>Three quiet reasons</h3><ul><li><b>Untranslated, not underqualified.</b> Your real expertise never gets stated in the language the room is listening for.</li><li><b>Invisible by default.</b> The work is deep, but nobody outside your team sees you think.</li><li><b>You freeze when it counts.</b> The interview, the review, the negotiation. Your best self never shows up.</li></ul>`},

{t:'quote', cls:'', html:`<p class="quote">You are not underqualified for AI. You are untranslated.<span class="cite">The gap is rarely skill. It is the translation of what you already know.</span></p>`},

{t:'part', cls:'', html:`<div class="tag">Part Two</div><h2>The Standout Systems.</h2><p class="sub">Three repeatable systems, so being seen stops depending on how you feel that day.</p>`},

{t:'frame', cls:'frame', html:`<div class="tag">System 01</div><h3>Translation</h3><p class="def">Take the expertise you already have and translate it into AI-relevant language and context. You are not starting over. You are re-stating. This is how a decade of real work finally reads as AI-ready to the people deciding.</p>`},

{t:'frame', cls:'frame', html:`<div class="tag">System 02</div><h3>The Feynman Method for career growth</h3><p class="def">Curiosity-driven exploration, borrowed from how the best learning systems work, turned into a visible-learning habit that compounds. The discomfort you feel learning something new is not a bug. It is the signal.</p>`},

{t:'list', cls:'num', html:`<h3>The four steps</h3><ul class="num"><li>Pick a concept in your field you do not fully understand.</li><li>Teach it simply, in public. A post, a Slack thread, a meeting.</li><li>Find the gaps you cannot explain, and go relearn them.</li><li>Simplify with analogies until a smart outsider gets it.</li></ul>`},

{t:'frame', cls:'frame', html:`<div class="tag">System 03</div><h3>The 7 F's of Stress</h3><p class="def">Physiology over psychology. When the lizard brain takes over in a high-stakes moment, you do not think your way back. You move your way back, with one trained physical cue.</p>`},

{t:'list', cls:'', html:`<h3>Know your pattern under pressure</h3><ul><li><b>Fight</b> fills the room. <b>Flight</b> goes silent or leaves.</li><li><b>Freeze</b> is analysis paralysis. <b>Fawn</b> agrees, then self-judges.</li><li><b>Filibuster</b> talks to fill silence. <b>Fantasize</b> rehearses the worst case.</li><li><b>Freak Out</b> is the body. Flushing, trembling, racing heart.</li></ul>`},

{t:'quote', cls:'', html:`<p class="quote">It is hard to think yourself into calm. It is easier to move yourself into it.<span class="cite">One grounding move, trained in low-stakes rooms, ready for the high-stakes one.</span></p>`},

{t:'part', cls:'', html:`<div class="tag">Part Three</div><h2>Your first 90 days as a standout.</h2>`},

{t:'list', cls:'', html:`<h3>The standout version of you</h3><ul><li>Your expertise is stated in the language the room rewards, so the right people finally get what you do.</li><li>You publish and teach on a cadence, so your name travels past your own team.</li><li>You walk into interviews, reviews, and negotiations grounded, not guessing.</li></ul>`},

{t:'why', cls:'', html:`<div class="kicker">Why me</div><h2>Career advice from someone who still builds the AI.</h2><p class="lead">I build clinical AI for a living. A PhD, multiple patents in medical imaging, foundation models for cardiac ultrasound, and over a decade in the field. I coach a small number of senior technical people through their next move, one on one, from the same side of the table you are on.</p><p class="footer-note">Standout Systems by Teodora. Real AI strategy from a PhD still building in industry.</p>`},

{t:'cta', cls:'cta', html:`<div class="kicker">Your next move</div><h2>Make your next career move with intention.</h2><p class="lead">If this is the year you stop being the best-kept secret on your team, let's build your Standout System together.</p><div class="step"><span class="pill">Work with me 1:1</span><span class="pill">Join Standout Systems at teodoracoach.substack.com</span></div><p class="disc">Educational content only. No income, role, promotion, or result is guaranteed. Results vary and depend on your own effort, situation, and timing.</p>`}
];
const deck = document.getElementById('deck');
S.forEach(s=>{const d=document.createElement('section');d.className='slide '+(s.cls||'');d.innerHTML=s.html;deck.appendChild(d);});
</script>
</body>
</html>
