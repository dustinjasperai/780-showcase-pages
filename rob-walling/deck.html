<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap Your SaaS To Profit, a masterclass with Rob Walling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f4ef;
    --panel:#ffffff;
    --rule:#e4e0d6;
    --ink:#1b1d22;
    --muted:#5c5f68;
    --accent:#c8930b;
    --accent2:#8a6d10;
    --head:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(27,29,34,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* stair-step motif: three rising blocks in the top-left, echoing the Stair Step Method */
  .slide::before{content:'';position:absolute;top:0;left:0;height:14px;width:14px;background:var(--accent);
    box-shadow:20px 0 0 0 var(--accent),20px -12px 0 0 var(--accent2),40px 0 0 0 var(--accent),
    40px -12px 0 0 var(--accent2),40px -24px 0 0 var(--ink)}
  .kick{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);font-weight:700;margin-bottom:22px;font-family:var(--body)}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.07;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:37px;line-height:1.13;margin:0 0 20px;letter-spacing:-.01em}
  h3{font-family:var(--head);font-weight:600;font-size:27px;line-height:1.18;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:46ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent2);font-weight:600}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:14px;height:14px;border-radius:3px;
    border:3px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-family:var(--body)}
  .big{font-family:var(--head);font-size:92px;line-height:1.02;font-weight:700;letter-spacing:-.02em}
  .strike{color:transparent;-webkit-text-stroke:2px #1b1d2255;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:6px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:210px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent2);font-size:22px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:56px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-family:var(--head);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:auto;font-family:var(--body)}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:62ch;line-height:1.45;font-family:var(--body)}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent2)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px;font-family:var(--body)}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:36px}h2{font-size:27px}.big{font-size:56px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">MicroConf · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'Bootstrap Your SaaS To Profit',p:'How to build a profitable software business step by step, without raising a dime and without giving your company away.',pres:'With <b>Rob Walling</b>, founder of MicroConf and TinySeed'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why most first SaaS attempts stall','It is almost never the idea. It is starting at the hardest possible step.'],['A lower-risk path to your first revenue','The order to build in so cash flow arrives before the hard part.'],['Your own next step','The one small product you could ship first, on a platform that already has buyers.']]},
 {t:'audience',kick:'Who this is for',h:'You can build it. Getting it off the ground is the part that keeps stalling.',p:'Founders and would-be founders who want a real software business but do not want to raise venture money, chase a unicorn, or hand their company to investors.',who:'<b>The trap:</b> you try to build a full SaaS as your first move, spend a year on it, and launch to silence because there was no audience and no cash flow to carry you.'},
 {t:'reframe',kick:'The reframe',big1:'Raise a round.',big2:'<span class="em">Bootstrap</span> it.',p:'Raising money buys you runway and a boss. Bootstrapping the right way buys you skills, cash flow, and control. You do not need permission or capital to start. You need a first product small enough to actually finish.'},
 {t:'part',kick:'Part one',h:'Why the first SaaS usually stalls.'},
 {t:'point',kick:'The core problem',h:'Most founders start at the top of the stairs.',p:'A full recurring-revenue SaaS is the hardest thing to build and the slowest to pay you. Starting there, with no audience and no income, is why so many first attempts run out of money, time, and morale before they ever find traction.'},
 {t:'framework',kick:'The core problem',h:'Two ways up.',row:[['The raise-first path','You trade equity and control for runway, then owe someone a big outcome you may not want.'],['The stair-step path','You build a small product that pays you now, and climb to a real SaaS on skills and cash you already earned.']],p:'One path bets everything on a single leap. The other lets each step fund and de-risk the next.'},
 {t:'point',kick:'The core problem',h:'You need cash flow before you need a SaaS.',p:'The thing that kills a first product is not a weak idea, it is running out of time. A small product that earns money early buys you the runway, the confidence, and the audience to build something bigger. Revenue first, complexity later.'},
 {t:'part',kick:'Part two',h:'The system: the Stair Step Method.'},
 {t:'framework',kick:'The method',h:'Three steps, in order.',row:[['Step 1: one small product','A single, mostly one-time-sale product on a platform that already has buyers, marketed through one channel.'],['Step 2: stack until it frees you','Double down on what worked, add a second and third, until the income replaces your job and buys your time.'],['Step 3: build the SaaS','Now build the recurring-revenue product, on skills, cash, and an audience you already have.']],p:'Each step earns you the right, and the resources, to attempt the next. Nobody skips straight to Step 3.'},
 {t:'cycle',kick:'Step one, in practice',h:'How to ship your first small product.',steps:['Pick a platform that already has buyers: an app store, a marketplace, a plugin ecosystem','Find one narrow, real problem those buyers already pay to solve','Build the smallest version that solves it, and charge for it','Pick a single marketing channel and work only that one until it produces'],p:'One product, one platform, one channel. The constraint is the point: it is small enough to finish and simple enough to learn from.'},
 {t:'point',kick:'The craft',h:'Start where the demand already lives.',p:'The fastest first win is a product inside a marketplace that already sends you buyers, so you are learning to build and sell without also having to invent an audience from scratch. Borrow the platform is distribution while you earn your own.'},
 {t:'point',kick:'The craft',h:'One channel, done consistently.',p:'You do not have to be brilliant at marketing. You have to pick one channel that fits your product and show up in it consistently while everyone else is dabbling in five. Consistency in one place beats being clever in all of them.'},
 {t:'skills',kick:'The craft',h:'What any builder can learn.',li:[['Validating real demand','Telling a problem people pay to solve from one that only sounds good.'],['Shipping small','Cutting scope to the version you can actually finish and sell.'],['Working one channel','The repeatable habit of showing up in a single channel until it pays.']]},
 {t:'part',kick:'Part three',h:'What this builds for you.'},
 {t:'looks',kick:'The outcome',h:'A profitable software business, on your terms.',li:[['Revenue you own','A product that pays you, funded by customers instead of investors.'],['Control kept','No board, no forced outcome, no giving the company away to grow it.'],['A real SaaS, de-risked','You reach Step 3 with skills, cash, and an audience already in hand.']]},
 {t:'truefans',kick:'The thesis',h:'You do not need a unicorn.',p:'A calm, profitable SaaS that pays you well and answers to no one is not the consolation prize. For most founders it is the actual goal. You get there by climbing steps that each pay their own way, not by betting the house on one leap.',who:'<b>Principle:</b> stay small on purpose so you can stay in control, and let profit, not funding, be the fuel.'},
 {t:'whyme',kick:'Why Rob',h:'A founder who built this way, then taught it.',li:[['Six companies, mostly bootstrapped','Including one SaaS grown and sold without venture funding.'],['MicroConf and TinySeed','The conference, community, and fund built for self-funded SaaS founders.'],['Startups For The Rest Of Us','Hundreds of episodes and the book The SaaS Playbook, teaching this path in the open.']]},
 {t:'cta',kick:'Your next step',h:'Ready to climb the first step?',ctas:['<b>Join the MicroConf community</b> to build alongside other bootstrapped founders.','<b>Start with the SaaS Launchpad course</b> if you want the full idea-to-launch path first.'],disc:'This masterclass is educational. It shares frameworks and approaches for building a software business; it is not advice for your specific situation and not a guarantee of any particular result. Outcomes vary by founder, product, and market.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`+(s.who?`<div class="who">${s.who}</div>`:'')}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
