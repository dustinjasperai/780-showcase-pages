<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Package a Money-Coaching Program That Sells · Tess Wicks, Wander Wealthy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1a2528; --panel:#24383c; --rule:#3a5359;
    --acc:#c79633; --ink:#f2ece0; --body:#c3ccca; --dim:#7f8f90; --cream:#f4efe3;
  }
  html,body{height:100%}
  body{background:#0f1719;font-family:'Raleway',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1719}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Raleway',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.004em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Raleway',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Playfair Display',serif;font-style:italic;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#22383e 0%,#0e1618 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#22383e 0%,#0e1618 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Raleway',sans-serif;color:#e7ddca;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mast{position:absolute;pointer-events:none}
  .title-mast{right:8.6%;bottom:9%;width:20vw;opacity:.9}
  .corner-mast{right:8.2%;bottom:8%;width:11vw;opacity:.5}
  .brandline{font-family:'Raleway',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(242,236,224,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Wander Wealthy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ledger motif: three thin gold rules with a struck coin, drawn in accent -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mast" viewBox="0 0 200 60">
  <g fill="none" stroke="#c79633" stroke-width="2" stroke-linecap="round">
    <path d="M6 20 H194" opacity="0.9"/>
    <path d="M6 30 H150" opacity="0.5"/>
    <path d="M6 40 H110" opacity="0.3"/>
    <circle cx="176" cy="40" r="6" fill="#c79633" stroke="none" opacity="0.85"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Package a Money-Coaching Program That Sells',sub:'How a money coach turns scattered advice into one signature program that attracts paying clients and prices with confidence.',brand:true,mast:'title'},
 {t:'normal',k:'Who this is for',title:'You can coach. Packaging it into something people can actually buy is the part no one taught you.',body:'You know how to help someone with their money. Clients get real results when they work with you. But every week starts from scratch, the offer keeps changing, and enrolling someone feels like convincing instead of inviting.'},
 {t:'dark',title:'A calendar of discovery calls is not a business. A program people can buy is.'},

 {t:'section',idx:'Part One',title:'Why It Feels Like Starting Over Every Week'},
 {t:'normal',k:'The winging-it trap',title:'When every session is improvised, there is nothing to sell.',body:'If your coaching lives in your head, each client is a custom build and each week is a blank page. You cannot name what you deliver in one line, so prospects cannot picture it either, and the conversation slides straight to price and doubt.'},
 {t:'normal',k:'The visibility trap',title:'More free content, and still the wrong room.',body:'Posting more often feels like progress, but most of it attracts other coaches, not the people who would pay you. Without a clear method and a content plan pointed at buyers, the audience grows while the calendar stays empty.'},
 {t:'dark',title:'You do not need more clients yet. You need one program worth selling.'},

 {t:'section',idx:'Part Two',title:'The Wealthy Coach Blueprint'},
 {t:'normal',k:'Build the framework',title:'Package your method into one signature framework.',body:'The Coaching Framework Builder turns everything you already do into a named, repeatable path a client can see themselves walking. Once your coaching has a shape, you stop reinventing every session and you finally have a program to put a price on.'},
 {t:'normal',k:'Attract the right clients',title:'Content that pulls in buyers, not lurkers.',body:'The Client Attraction Content Matrix gives you months of content with a job to do: prove the problem, prove the method, prove it works, and invite. It speaks to the person ready to pay, so the audience you build is the audience you can enroll.'},
 {t:'normal',k:'Price with confidence',title:'Price it to sell with ease.',body:'The Pricing Formula sets your number off the outcome you create, not the fear in your stomach. You learn to name the price, hold it on the call, and let the value carry the yes, instead of discounting your way to a client who never valued it.'},
 {t:'dark',title:'Price off the outcome you create, not the fear in your stomach.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Have a Program'},
 {t:'normal',k:'The coach this builds',title:'A real program, a fuller calendar, prices that hold.',body:'With a named framework, content that attracts buyers, and a price you can say out loud, enrolling stops feeling like convincing. You show up to calls with something to offer, clients know exactly what they are buying, and the business finally runs on a system instead of your hustle.'},
 {t:'dark',title:'The goal was never busier. It was a business that holds together.'},
 {t:'normal',k:'Why Tess Wicks',title:'I built the practice before I taught the blueprint.',body:'I grew my own financial-coaching practice, the CFO Method, working one on one with high earners, then packaged how I did it into the Wealthy Coach Blueprint. On the Wander Wealthy podcast I have spent years in the details of building a money-coaching business, so this is the path I actually walked, not theory.'},

 {t:'section',idx:'Your Next Step',title:'Build the Program'},
 {t:'normal',k:'Keep going with Tess',title:'From one signature framework to a business that sells it.',body:'The masterclass is the map. Inside the Wealthy Coach Blueprint we build your framework, set up the content that attracts paying clients, and lock in a price you can hold, so your coaching keeps enrolling long after the session ends.'},
 {t:'cta',title:'Ready to package a program that sells?',body:'Take the next step with Tess Wicks and the Wealthy Coach Blueprint.',chips:['Watch the masterclass','Join the Wealthy Coach Blueprint'],disc:'Educational content for money coaches. No income or business result is guaranteed. Results vary by coach, market, and effort.'},
];

const deck=document.getElementById('deck');
function mast(kind){return `<svg class="mast ${kind==='title'?'title-mast':'corner-mast'}"><use href="#mast"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Wander <b>Wealthy</b> · Tess Wicks</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mast) h+=mast(s.mast);
  else if(s.t==='title') h+=mast('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
