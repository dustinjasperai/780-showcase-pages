<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gentle is the New Advanced — a masterclass with J. Brown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ec; --panel:#efe9df; --rule:#e2d9c9;
    --accent:#e35502; --ink:#2a2621; --mut:#6c655c;
    --head:"Spectral",Georgia,serif; --body:"Open Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deckwrap{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:60px 58px;margin:0 0 26px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .slide.center{align-items:flex-start}
  .num{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:26px}
  .k{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em;max-width:18ch}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.12;max-width:20ch}
  .big{font-family:var(--head);font-weight:500;font-size:40px;line-height:1.18;max-width:22ch}
  .rule{width:60px;height:3px;background:var(--accent);border-radius:2px;margin:22px 0}
  .sub{font-size:19px;line-height:1.6;color:var(--mut);max-width:40ch;margin-top:14px}
  ul{list-style:none;margin-top:30px;max-width:44ch}
  li{font-size:20px;line-height:1.5;padding:14px 0 14px 26px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:0}
  li::before{content:"";position:absolute;left:0;top:23px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .quote{font-family:var(--head);font-style:italic;font-weight:400;font-size:34px;line-height:1.3;max-width:26ch}
  .cite{margin-top:24px;font-size:15px;letter-spacing:.06em;color:var(--mut)}
  .cred{font-size:20px;line-height:1.6;color:var(--ink);max-width:42ch;margin-top:10px}
  .cred strong{color:var(--accent);font-weight:600}
  .disc{margin-top:34px;font-size:13px;line-height:1.6;color:var(--mut);max-width:50ch;border-top:1px solid var(--rule);padding-top:18px}
  .cta-h{font-family:var(--head);font-weight:600;font-size:46px;line-height:1.1;max-width:18ch}
  .step{display:inline-block;margin-top:26px;font-size:18px;font-weight:600;color:var(--accent);letter-spacing:.02em}
  @media(max-width:720px){.slide{padding:40px 26px;min-height:380px}h1{font-size:38px}h2{font-size:30px}.big,.cta-h{font-size:30px}.quote{font-size:26px}}
</style>
</head>
<body>
<div class="deckwrap" id="deck"></div>
<script>
const S=[
  {t:'title',k:'A live masterclass with J. Brown',h:'Gentle is the New Advanced',sub:'How to teach yoga that heals, by letting the breath lead the practice.'},

  {t:'list',k:'Who this is for',h:'For teachers who feel the strain',list:["You were trained to cue poses, not people","Your classes get harder, and so does the teaching","You sense the breath matters more than the shape","You want to teach for the long run, not burn out"]},

  {t:'big',k:'The trap',big:'You were taught that a better class means a harder class.'},

  {t:'big',k:'The reframe',big:'Harder is not advanced. Harder is just harder.'},

  {t:'big',k:'Part one',big:'Achievement yoga quietly wears down the people who teach it, and the people who practice it.'},

  {t:'list',k:'The cost',h:'What the pose-first model leaves behind',list:["Students chasing shapes their bodies do not want","Teachers measuring class by difficulty, not by care","Injury and burnout treated as the price of progress","A practice that gets abandoned the moment it stops feeling good"]},

  {t:'big',k:'Part two',big:'There is an older, gentler way, and it is the advanced one.'},

  {t:'quote',q:'Yoga practice was never a linear progression toward some unknown thing. It is a process of learning how to take care of yourself.',cite:'The lineage of TKV Desikachar and T. Krishnamacharya'},

  {t:'list',k:'The method',h:'Gentle is the New Advanced',sub:'Four moves that turn pose-first teaching into breath-first teaching.',list:["Let the breath lead, and the body organizes around it","Sequence from the breath, not toward a shape","Teach the person in front of you, not the standard","Measure a class by ease and feeling well"]},

  {t:'big',k:'The mechanic',big:'Everything in the body organizes around the breath. Ujjayi is the thread the whole practice hangs on.'},

  {t:'list',k:'Breath-first in practice',h:'How a breath-led class actually runs',list:["Set the breath before the first movement","Move only as far as the breath stays smooth","Use the pose to deepen the breath, never the reverse","End calmer than you started, every time"]},

  {t:'big',k:'How it is learned',big:'Not a cohort drill. A relationship, built through mentorship inside a small group.'},

  {t:'list',k:'The learning arc',h:'From roots to your own voice',sub:'The path, in plain order.',list:["Origins and purpose: where yoga actually comes from","The texts and the practice: asana, pranayama, meditation","Teaching principles: assessment, adaptation, relationship","Direction: finding your own creative, intuitive voice"]},

  {t:'list',k:'Part three',h:'What changes when you teach this way',list:["Students stay, because the practice keeps feeling good","You teach from the breath, so you stop running on fumes","Your classes become yours, not a franchise script","Yoga becomes something they do for life"]},

  {t:'cred',k:'Why me',h:'A quiet yoga revolution, based in healing',cred:"I am J. Brown. I founded Abhyasa Yoga Center, host the <strong>J. Brown Yoga Talks</strong> podcast, and have spent years moving from conventional studio training toward one-to-one mentorship. I teach <strong>breath-centered, therapeutic yoga</strong> in the Desikachar lineage, and I train the teachers who want to teach it."},

  {t:'big',k:'The whole idea',big:'Slower is stronger. Gentle is advanced. The breath leads.'},

  {t:'cta',k:'Train with me',ctah:'Train to teach the gentle way',sub:'My Deep Learning teacher training is live online and in person, built on individual mentorship inside a group. 200, 300, and 500-hour paths.',step:'Next step: join the next Deep Learning teacher training at jbrownyoga.com',disc:'This masterclass is educational. No income, enrollment, or health result is guaranteed. Results vary from teacher to teacher and student to student. Nothing here is medical advice.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var deck=document.getElementById('deck');
S.forEach(function(s,i){
  var sl=el('section','slide center');
  sl.appendChild(el('div','num','Slide '+(i+1)+' / '+S.length));
  if(s.k)sl.appendChild(el('div','k',s.k));
  if(s.t==='title'){sl.appendChild(el('h1',null,s.h));sl.appendChild(el('div','rule'));if(s.sub)sl.appendChild(el('div','sub',s.sub));}
  else if(s.t==='big'){sl.appendChild(el('div','big',s.big));}
  else if(s.t==='quote'){sl.appendChild(el('div','quote','&ldquo;'+s.q+'&rdquo;'));if(s.cite)sl.appendChild(el('div','cite',s.cite));}
  else if(s.t==='cred'){sl.appendChild(el('h2',null,s.h));sl.appendChild(el('div','rule'));sl.appendChild(el('div','cred',s.cred));}
  else if(s.t==='cta'){sl.appendChild(el('div','cta-h',s.ctah));sl.appendChild(el('div','rule'));if(s.sub)sl.appendChild(el('div','sub',s.sub));if(s.step)sl.appendChild(el('div','step',s.step));if(s.disc)sl.appendChild(el('div','disc',s.disc));}
  else{ if(s.h)sl.appendChild(el('h2',null,s.h)); sl.appendChild(el('div','rule')); if(s.sub)sl.appendChild(el('div','sub',s.sub)); if(s.list){var ul=el('ul');s.list.forEach(function(x){ul.appendChild(el('li',null,x));});sl.appendChild(ul);} }
  deck.appendChild(sl);
});
</script>
</body>
</html>
