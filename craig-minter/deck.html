<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profitable Practice Masterclass · Craig Minter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f7fc; --panel:#ffffff; --rule:#dde3f0;
    --accent:#1f398f; --green:#1f9d63;
    --ink:#16224d; --ink-soft:#45507a; --dim:#7a83a6;
  }
  html,body{height:100%}
  body{background:#e6eaf3;font-family:'Nunito',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e6eaf3}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Open Sans',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Open Sans',sans-serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:-.01em}
  .t-title h1{font-size:4.7vw}
  .t-normal h1{font-size:3.3vw;max-width:86%}
  .t-normal .body{font-family:'Nunito',sans-serif;font-size:1.5vw;color:var(--ink-soft);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-family:'Nunito',sans-serif;font-size:1.8vw;color:var(--ink-soft);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.35vw;font-weight:700;color:var(--green);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#22357e 0%,#16224d 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:86%;color:#f4f6fc}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#22357e 0%,#16224d 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:82%;color:#f4f6fc}
  .t-cta .kicker{color:#9fb0e6}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #9fb0e6;color:#dfe6fb;border-radius:100px;padding:1.3vh 1.7vw;font-family:'Open Sans',sans-serif;font-size:1.2vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Nunito',sans-serif;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#7d8bc0}
  .t-title .disc,.t-normal .disc{text-align:left}
  .allo-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-allo{right:7%;bottom:8%;width:23vw}
  .corner-allo{right:6%;bottom:7.5%;width:10vw;opacity:.5}
  .brandline{font-family:'Open Sans',sans-serif;font-size:1.3vw;color:var(--ink-soft);margin-top:3.4vh;font-weight:500;letter-spacing:.01em}
  .brandline b{color:var(--accent);font-weight:700}
  .pillars{display:flex;gap:1.4vw;margin-top:3.4vh;flex-wrap:wrap}
  .pillar{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--green);border-radius:6px;padding:2vh 1.6vw;font-family:'Open Sans',sans-serif;font-size:1.24vw;font-weight:600;color:var(--ink)}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(22,34,77,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Open Sans',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Open Sans',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Open Sans',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}.pillar{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Healthy Business Lab</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- income splitting into labelled cash bands, rising to a profit band: Profit First allocation motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="allo" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="16" y1="138" x2="244" y2="138" stroke="#1f398f" opacity="0.35"/>
    <rect x="34"  y="104" width="30" height="34" rx="3" fill="#1f398f" opacity="0.22"/>
    <rect x="82"  y="86"  width="30" height="52" rx="3" fill="#1f398f" opacity="0.34"/>
    <rect x="130" y="66"  width="30" height="72" rx="3" fill="#1f398f" opacity="0.46"/>
    <rect x="178" y="40"  width="30" height="98" rx="3" fill="#1f9d63" opacity="0.8"/>
    <path d="M40 60 H210" stroke="#1f9d63" opacity="0.7" stroke-dasharray="2 6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Profitable Practice Masterclass',sub:'How to turn a busy allied health practice into a genuinely profitable one, by fixing your relationship with money first and then the system that holds it.',brand:true,allo:'title'},

 {t:'normal',k:'Who this is for',title:'Your clinic is full. Your bank account is not.',body:'You are booked out, the team is busy, and the work is good. Yet at the end of the month there is far less left than the effort says there should be. More clients has not turned into more money in your pocket.'},
 {t:'dark',title:'You do not have a revenue problem. You have a money problem.'},

 {t:'section',idx:'Part One',title:'The Busy But Broke Trap'},
 {t:'normal',k:'Why more clients does not help',title:'Growth without a money system just moves more cash through the same leaks.',body:'When there is no plan for where money goes, a bigger practice simply has bigger bills, bigger tax surprises, and the same thin buffer. Volume magnifies the leak instead of sealing it.'},
 {t:'normal',k:'The quiet cost',title:'The pressure follows you home.',body:'Health owners carry the weight of payroll, of the tax bill they are not sure is covered, of paying everyone but themselves last. It is a heavy way to run something you built to help people.'},
 {t:'dark',title:'Most practices are not underpriced. They are unmanaged at the money layer.'},

 {t:'section',idx:'Part Two',title:'Financial Brain Care'},
 {t:'normal',k:'Your unique money code',title:'The way you handle money was set long before you opened the practice.',body:'Every owner carries a money archetype and a set of quiet stories about spending, saving, charging, and worth. That code runs in the background and caps the business without you noticing. We name it first, because the numbers never move until it does.'},
 {t:'normal',k:'Mindset before spreadsheet',title:'Fix the driver, then fix the dashboard.',body:'Discounting out of guilt, avoiding the bank balance, reinvesting every dollar so nothing is ever left: these are money-code habits, not maths. Financial Brain Care is the work of clearing them so a good system can actually hold.'},
 {t:'dark',title:'You cannot out-earn a money story that says the profit is not yours to keep.'},

 {t:'section',idx:'Part Three',title:'Profit First For Practices'},
 {t:'normal',k:'Pay yourself first',title:'Take profit off the top, then run the practice on what is left.',body:'Income is split into purpose-built accounts the day it arrives, so profit, tax, and pay are set aside before the practice spends a cent. You stop hoping something is left over and start deciding what is, in advance.'},
 {t:'normal',k:'The timing lever',title:'When money moves matters as much as how much.',body:'Small changes to when bills are paid and receivables are collected smooth the cashflow that keeps owners awake. It is the difference between a practice that feels tight every fortnight and one that runs with a buffer.'},
 {t:'dark',title:'Profit is a habit you build into the system, not a number you hope for at year end.'},

 {t:'section',idx:'Part Four',title:'Growth That Does Not Rest On You'},
 {t:'normal',k:'The People Plan',title:'A team that owns outcomes, not tasks you re-check.',body:'Profit that only exists while you work more is not really profit. The People Plan puts the right people in the right roles with the culture and communication to run the day, so the practice grows without pulling more hours out of you.'},
 {t:'dark',title:'Mindset, money system, and team. That is the Money Growth Code working together.'},

 {t:'section',idx:'Your next step',title:'The Million Dollar Business Transformation'},
 {t:'normal',k:'How the work runs',title:'Diagnose, develop, then optimise.',pillars:['Diagnose & Discover','Develop & Implement','Celebrate & Optimise'],body:'We start with full financial clarity and the direction the numbers point to, build and install the money mindset, cashflow, and team plan together, then keep refining as the practice becomes the vehicle for the life you wanted from it.'},
 {t:'normal',k:'Why me',title:'A CPA who works on how you feel about money, not just the ledger.',body:'I am a Certified Practising Accountant and one of nine Mastery-level Profit First Professionals in Australia, and I have spent decades inside allied health. The Healthy Business Lab exists because the owners I met were great clinicians who had never been shown the money side of ownership.'},
 {t:'cta',title:'Ready to make your practice as healthy as the work you do?',chips:['Book a Financial Therapy Session','Start the transformation'],disc:'Educational content for allied health and wellness business owners. No income, revenue, or business result is guaranteed. Outcomes vary by owner, practice, and market.'},
];

const deck=document.getElementById('deck');
function allo(kind){return `<svg class="allo-motif ${kind==='title'?'title-allo':'corner-allo'}"><use href="#allo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.pillars) h+=`<div class="pillars">`+s.pillars.map(p=>`<div class="pillar">${p}</div>`).join('')+`</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Healthy Business <b>Lab</b> · Craig Minter</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.allo) h+=allo(s.allo);
  else if(s.t==='title') h+=allo('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
