<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Profitable Testing Practice — a masterclass for testing psychologists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5F0; --panel:#FAFCF8; --ink:#272727; --muted:#6b6b6b;
    --accent:#2ca449; --deep:#206e32; --rule:#e4e4df;
    --head:'Lora',Georgia,serif; --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 80px;}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 52px;margin:0 0 22px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin:0 0 18px;}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;margin:0 0 18px;}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.12;margin:0 0 20px;}
  .sub{font-size:21px;color:var(--muted);line-height:1.5;margin:0;}
  .body{font-size:20px;line-height:1.6;margin:0;max-width:46ch;}
  ul{margin:8px 0 0;padding:0;list-style:none;}
  li{font-size:20px;line-height:1.5;padding:14px 0 14px 34px;position:relative;border-top:1px solid var(--rule);}
  li:first-child{border-top:none;}
  li:before{content:"";position:absolute;left:4px;top:22px;width:12px;height:12px;border-radius:3px;background:var(--accent);}
  .section .kicker{color:var(--deep);}
  .section{background:var(--ink);color:#fff;}
  .section h2{color:#fff;}
  .section .sub{color:#cfcfcf;}
  .num{font-family:var(--head);font-weight:700;color:var(--accent);font-size:17px;letter-spacing:.1em;margin:0 0 14px;text-transform:uppercase;}
  .disc{margin-top:26px;font-size:14px;color:var(--muted);line-height:1.5;border-top:1px solid var(--rule);padding-top:16px;max-width:60ch;}
  .foot{font-size:13px;color:var(--muted);margin-top:22px;}
  @media(max-width:620px){.slide{padding:32px 24px}h1{font-size:34px}h2{font-size:27px}.body,li,.sub{font-size:18px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass for testing psychologists', h:'The Profitable Testing Practice', sub:'How to build an assessment practice that scales without burning out your calendar.'},
  {t:'agenda', h:'What we will cover', list:['Why assessment economics are different from therapy','The four levers that actually move your income','What a scaled testing week looks like','Where to start this month']},
  {t:'who', h:'Who this is for', list:['Licensed psychologists and neuropsychologists who do assessment','Practice owners adding or growing testing services','Clinicians who are booked out but not paid what the work is worth']},
  {t:'trap', h:'The trap', body:'You trained for years to do excellent assessment. Then the practice filled up, the report backlog grew, and your income stopped climbing with the effort. More cases did not mean more money.'},
  {t:'hook', h:'The uncomfortable truth', body:'Assessment is not therapy, and running it like a therapy practice is exactly what keeps it small. The economics are different, so the playbook has to be different too.'},
  {t:'section', num:'Part one', h:'Why assessment practices stall', sub:'The structural reasons, before any tactics.'},
  {t:'problem', h:'No recurring clients, no compounding', body:'A therapy caseload compounds week over week. An assessment practice starts from zero on every intake, so growth comes from what you charge, how fast you finish, and who does the work, not from stacking standing appointments.'},
  {t:'problem', h:'Three numbers most practices never track', list:['Your fee versus the local market band','Hours per completed case','Labor-to-revenue as you add staff']},
  {t:'section', num:'Part two', h:'The four levers', sub:'The ones that are specific to testing.'},
  {t:'framework', h:'Lever one: fee positioning', body:'Because there are no ongoing clients, you can raise fees now and the next intake simply pays the new rate. Survey the local band by assessment type and move to the top of it. Most practices sit well under market and never check.'},
  {t:'framework', h:'Lever two: battery architecture', body:'Pull your last five to ten reports and read the battery like a schedule. Front-load the high-demand executive tasks, watch the afternoon subtests for fatigue dips, and rotate or trim what is not earning its hour. Fewer hours per case, same quality.'},
  {t:'framework', h:'Lever three: the psychometrist model', body:'Past solo, your own time is the ceiling. Bringing in psychometrists to administer testing moves your hours to interpretation and report writing, where the value really is. Watch labor-to-revenue as you add each person.'},
  {t:'framework', h:'Lever four: report systems', body:'The backlog is where profit and sanity leak out. Templates, a scoring workflow, and a protected writing block turn a two-week report into a two-day one, and clear the queue that is quietly capping your intake.'},
  {t:'section', num:'Part three', h:'Inside a scaled testing week', sub:'A week on the new model.'},
  {t:'list', h:'The scaled testing week', list:['Fees set at the top of your market band','A battery trimmed to the hours it actually needs','Technicians running administration','Reports finished the same week they are scored']},
  {t:'proof', h:'Why me', body:'I am Dr. Jeremy Sharp. I built the Colorado Center for Assessment & Counseling from a solo practice in 2009 to more than twenty clinicians, and I host Let's Talk Testing, the podcast for testing psychologists, with hundreds of episodes on exactly this.'},
  {t:'list', h:'What you will leave with', list:['A fee you can defend and raise','A shorter, smarter battery','A staffing plan that fits your numbers','A report process that clears the backlog']},
  {t:'cta', h:'Your next step', body:'If you want the full playbook, join Craft, the membership and mastermind community for testing psychologists. We map your fees, your battery, and your staffing together.', disc:'This masterclass is educational. No income or specific result is guaranteed. Results vary by practice, market, and effort.'}
];
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function li(items){return '<ul>'+items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';}
function render(){
  var deck=document.getElementById('deck');
  deck.innerHTML=S.map(function(s){
    var cls='slide'+(s.t==='section'?' section':'');
    var h='';
    if(s.num){h+='<p class="num">'+esc(s.num)+'</p>';}
    if(s.kicker){h+='<p class="kicker">'+esc(s.kicker)+'</p>';}
    if(s.t==='title'){h+='<h1>'+esc(s.h)+'</h1>';}else{h+='<h2>'+esc(s.h)+'</h2>';}
    if(s.sub){h+='<p class="sub">'+esc(s.sub)+'</p>';}
    if(s.body){h+='<p class="body">'+esc(s.body)+'</p>';}
    if(s.list){h+=li(s.list);}
    if(s.disc){h+='<p class="disc">'+esc(s.disc)+'</p>';}
    if(s.t==='cta'){h+='<p class="foot">thetestingpsychologist.com</p>';}
    return '<section class="'+cls+'">'+h+'</section>';
  }).join('');
}
render();
</script>
</body>
</html>
