<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Courageous Price · Kristin Crockett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fdf6f9; --panel:#f7e9f0; --rule:#ecd7e2;
    --accent:#ec3092; --accent-2:#f76a8f; --ink:#212121; --ink-soft:#5a4f56;
  }
  html,body{height:100%}
  body{background:#efe1e8;font-family:'Newsreader',Georgia,serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe1e8}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.06vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--ink);line-height:1.12;letter-spacing:-.005em}
  .t-title h1{font-size:5vw;font-weight:800;letter-spacing:-.01em}
  .t-title h1 b{color:var(--accent);font-weight:800}
  .t-normal h1{font-size:3.3vw;max-width:90%;font-weight:700}
  .t-normal h1 b{color:var(--accent);font-weight:700}
  .t-normal .body{font-family:'Newsreader',Georgia,serif;font-size:1.62vw;color:var(--ink-soft);margin-top:2.6vh;max-width:80%;line-height:1.55;font-weight:400}
  .sub{font-family:'Newsreader',Georgia,serif;font-size:1.9vw;color:var(--ink-soft);margin-top:3.2vh;max-width:82%;line-height:1.45;font-weight:400}
  .t-section{align-items:flex-start;background:linear-gradient(120deg,#fdf6f9 0%,#f7e9f0 100%)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.25vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:92%;font-weight:800}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#7a144a 0%,#3d0a26 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:90%;color:#fdeef5;font-weight:700}
  .t-dark h1 b{color:var(--accent-2)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#7a144a 0%,#3d0a26 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:88%;font-weight:800;color:#fdeef5}
  .t-cta h1 b{color:var(--accent-2)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Montserrat',sans-serif;border:1.6px solid var(--accent-2);color:#fdeef5;border-radius:100px;padding:1.3vh 1.9vw;font-size:1.16vw;font-weight:600;letter-spacing:.04em}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Montserrat',sans-serif;font-size:.9vw;color:#e9c4d8;font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--ink-soft)}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.28vw;color:var(--ink-soft);margin-top:3.4vh;font-weight:600;letter-spacing:.04em}
  .brandline b{color:var(--accent);font-weight:700}
  .motif{position:absolute;pointer-events:none}
  .title-motif{right:7%;bottom:8%;width:24vw;opacity:.95}
  .corner-motif{right:6.5%;bottom:7.5%;width:10vw;opacity:.5}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(122,20,74,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.14em;color:#a9889a;z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a9889a;z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Montserrat',sans-serif;font-size:11px;color:#a9889a;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.7vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3.2vw}
    .sub{font-size:3.5vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.7vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The Courageous Price</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: worth rising. a coin/price mark lifting through an open ring, the belief-to-price bridge -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mark" viewBox="0 0 260 200">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="130" cy="104" r="80" stroke="#ec3092" opacity="0.18"/>
    <circle cx="130" cy="104" r="56" stroke="#ec3092" opacity="0.38"/>
    <circle cx="130" cy="104" r="34" stroke="#ec3092" opacity="0.80"/>
    <path d="M130 126 L130 80" stroke="#ec3092" opacity="0.95"/>
    <path d="M112 98 L130 80 L148 98" stroke="#ec3092" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Courageous <b>Price</b>',sub:'A live masterclass on the money story running underneath what you charge, and how to rewire it so your prices finally match the value you deliver.',brand:true,motif:'title'},
 {t:'normal',k:'Who this is for',title:'You are great at the work. You still <b>undercharge</b> for it.',body:'The results are real. The clients are happy. But when it is time to name the number you round down, add a discount nobody asked for, or brace before you say it out loud. If the ceiling on your income is a feeling and not your skill, this hour is for you.'},
 {t:'dark',title:'You do not have a pricing problem. You have a <b>worth</b> problem.'},

 {t:'section',idx:'Part One',title:'The Story Running Underneath Your Prices'},
 {t:'normal',k:'Why it happens',title:'Nobody ever coached the <b>money story</b>.',body:'You were taught the craft, the delivery, the way to help people. The one thing that quietly decides your income, the beliefs you carry about money, visibility, and what you are worth, you were left to sort out alone. So the price conversation arrives and you have no system for it, only nerves.'},
 {t:'normal',k:'The hidden cost',title:'Undercharging does not stay small. It <b>compounds</b>.',body:'Every rounded-down number is not one lost sale, it is a lower ceiling you carry into the next offer, and the next, and the next. The discount becomes the habit, the habit becomes the brand, and a business built on your gifts quietly funds everyone but you. The number is never really about the number.'},
 {t:'dark',title:'Your prices are a <b>mirror</b>, not a market rate.'},

 {t:'section',idx:'Part Two',title:'The Courageous Destiny Methodology'},
 {t:'normal',k:'The system',title:'Four moves that turn worth into a <b>number</b>.',body:'The Courageous Destiny Methodology is how I take a woman from bracing before she says her price to naming it without flinching. It runs in four moves: Design the offer, Align the price, Rewire the belief, and Expand the system. Motivation fades by Tuesday. A method holds up in the room where the number gets said.'},
 {t:'normal',k:'Move one · Design',title:'Design the offer and the <b>number</b> on purpose.',body:'Most undercharging starts with a fuzzy offer, because a blurry promise can only ask for a timid price. Design means getting clear on exactly what you deliver, who it is for, and the income the offer is actually built to carry, so the price has something solid to stand on.'},
 {t:'normal',k:'Move two · Align',title:'Align the price to the <b>value</b>, not the fear.',body:'When the offer is clear, the price and the message line up behind the real transformation instead of the hour it takes you. Align is where what you charge, how you talk about it, and the result you create finally tell the same story, so the number stops feeling like a stretch and starts feeling like the truth.'},
 {t:'normal',k:'Move three · Rewire',title:'Rewire the <b>beliefs</b> that keep the price low.',body:'This is the heart of it. Underneath every timid price is a belief about money, visibility, and worth that you did not choose and never questioned. Rewire is the inner work that changes the belief at the root, so raising your price stops feeling like a risk you have to survive and starts feeling like a decision you already made.'},
 {t:'normal',k:'Move four · Expand',title:'Expand the <b>systems</b> that hold the new revenue.',body:'A higher price you cannot deliver on is a trap. Expand builds the structure, the offers, and the rhythm that let the new number become normal instead of a one-time spike, so growth is something your business is built to hold rather than something you white-knuckle.'},
 {t:'dark',title:'Design the offer, align the price, <b>rewire the belief</b>, expand the system.'},

 {t:'section',idx:'Part Three',title:'When the Number Stops Scaring You'},
 {t:'normal',k:'The shift',title:'The price gets bigger. The <b>flinch</b> goes away.',body:'Nothing about the market changes. Your work was always worth it. What changes is you: you name the number, you let the silence sit, and you stop apologizing for the value you already deliver. The women who do this do not just charge more, they finally run a business that pays them like the asset it is.'},
 {t:'normal',k:'Why me',title:'I rewired my own <b>relationship with money</b> first.',body:'I rebuilt my own health, tripled my own sales, and changed the story I told myself about worth before I ever coached anyone through it. Since then I have built Courageous Destiny to help women do the same, and I am on a mission to walk more than ten thousand of them through it. This is lived, not theory.'},
 {t:'dark',title:'The money story is <b>rewritable</b>. That is the whole point.'},

 {t:'section',idx:'Your next step',title:'Rewire Your Money Story With Me'},
 {t:'normal',k:'Where this goes',title:'MONETIZE.',body:'This masterclass is the map. MONETIZE is where we walk the four moves through your own offer, your own price, and your own beliefs, with group coaching, private time, and a room of women doing the same work, until charging what you are worth stops being an idea and becomes how you run. That is where the shift becomes yours.'},
 {t:'cta',title:'Ready to charge what your work is actually <b>worth</b>?',chips:['Apply for MONETIZE','Join the RISE community'],disc:'Educational content for women entrepreneurs and business owners. No specific income or result is guaranteed. Results vary by person, offer, effort, and circumstance.'},
];

const deck=document.getElementById('deck');
function mark(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#mark"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Kristin Crockett · <b>Courageous Destiny</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=mark(s.motif);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
