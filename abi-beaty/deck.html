<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Clarity Practice - a live masterclass with Abi Beaty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palette derived from abigailbeaty.com (brand.json): navy ground #163056,
       rose accent #cd2480, blush #faece6. Not the #14202E house chassis. */
    --bg:#163056;
    --panel:#1c3a63;
    --rule:#2b4a78;
    --accent:#cd2480;
    --blush:#faece6;
    --ink:#f3f6fb;
    --muted:#aec0d8;
    --display:'Poppins',system-ui,sans-serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:#0e2041;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:16px;
    padding:62px 60px;margin:0 0 22px;min-height:540px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;left:60px;top:0;width:var(--pline,0);height:4px;background:var(--accent);
    transition:width .3s;
  }
  .kicker{font-family:var(--display);font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  .part-no{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    font-size:13px;color:var(--blush);margin-bottom:14px}
  h1{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.08;letter-spacing:-.01em}
  .sub{font-size:22px;color:var(--muted);margin-top:22px;max-width:30ch;line-height:1.4}
  p.body{font-size:21px;line-height:1.55;color:var(--ink);max-width:46ch;margin-top:8px}
  p.body + p.body{margin-top:18px}
  .lead{font-size:27px;line-height:1.4;color:var(--blush);max-width:40ch;font-weight:500}
  ul{list-style:none;margin-top:14px;max-width:48ch}
  ul li{position:relative;padding-left:30px;font-size:20px;line-height:1.5;margin-bottom:16px;color:var(--ink)}
  ul li::before{content:"";position:absolute;left:0;top:11px;width:13px;height:13px;border-radius:50%;
    border:2px solid var(--accent)}
  .pillar-num{font-family:var(--display);font-weight:700;font-size:72px;color:var(--panel);
    -webkit-text-stroke:1.5px var(--accent);line-height:1;margin-bottom:10px}
  .tag{display:inline-block;background:var(--panel);border:1px solid var(--rule);color:var(--blush);
    font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    padding:7px 14px;border-radius:999px;margin-bottom:26px;width:fit-content}
  .cta-box{background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:30px 34px;
    margin-top:26px;max-width:40ch}
  .cta-box .step{font-family:var(--display);font-weight:600;font-size:22px;color:var(--blush)}
  .disclaimer{margin-top:30px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .pg{position:absolute;right:26px;bottom:20px;font-family:var(--display);font-size:12px;color:var(--rule);
    letter-spacing:.1em}
  .brandline{position:absolute;left:60px;bottom:22px;font-family:var(--display);font-size:12px;
    color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  @media(max-width:720px){
    .slide{padding:44px 26px;min-height:460px}
    h1{font-size:40px}h2{font-size:30px}.sub{font-size:19px}p.body,.lead{font-size:18px}
    .brandline,.slide::before{left:26px}
  }
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
/* The coach's own masterclass. No sender, no ads strategy, no booking tool but her own next step. */
const S = [
  {t:'title', kicker:'A live masterclass with Abi Beaty',
   h:'The Clarity Practice',
   sub:'Finding what comes next, through your own values.'},

  {t:'who', kicker:'Who this hour is for',
   lead:'You built a life that looks like success. You are quietly ready for one that feels like it.',
   body:['You are accomplished. The title, the income, the respect are real.',
         'And still there is a quiet question you have not said out loud: is this it, and is it mine?']},

  {t:'who', kicker:'And who it is not for',
   lead:'This is not a motivational hour, and it is not a quick fix.',
   body:['If you want someone to hand you a five-step plan and a pep talk, there are easier rooms.',
         'This hour is for people willing to ask harder questions than "what is the next promotion."']},

  {t:'reframe', kicker:'The quiet discomfort',
   lead:'The discomfort is not a problem to fix. It is a signal you have outgrown someone else’s definition of enough.',
   body:['Most high performers answer it by adding more. More scope, more goals, another rung.',
         'More of the wrong thing never starts to feel like the right one.']},

  {t:'part', n:'The cost of waiting', h:'What another borrowed year costs',
   body:['Another year optimizing a life that is not quite yours is not neutral. It is a year of energy, attention, and self-trust spent on the wrong scoreboard.',
         'The question is rarely "can I change." It is "how long will I keep performing a success I have already outgrown."']},

  {t:'part', n:'Part One', h:'Why "more" stopped working',
   body:['Somewhere along the way your success got measured against values that were never yours. A parent’s. An industry’s. An old version of you.',
         'You can hit every target on that scorecard and still feel off, because the scorecard is borrowed.']},

  {t:'reframe', kicker:'The real work',
   lead:'Clarity is not advice and it is not therapy. It is a dedicated space where the right questions surface answers that are already yours.',
   body:['Therapy heals what hurt you. Consulting hands you someone else’s plan.',
         'This is the third thing: your own judgment, reconnected.']},

  {t:'part', n:'Part Two', h:'The Clarity Practice',
   body:['Four moves, in order. Not a system to follow forever, a practice you return to at every real crossroads.']},

  {t:'pillar', num:'01', h:'Name your values',
   body:['Before any decision, get honest about what actually matters to you now, not a decade ago.',
         'When your choices and your values are out of alignment, you feel it long before you can explain it. We make it explicit.']},

  {t:'pillar', num:'02', h:'Surface the assumption',
   body:['Under every stuck place is a quiet assumption running the show: "I can’t," "it’s too late," "people like me don’t."',
         'Named out loud, most of them do not survive the daylight.']},

  {t:'pillar', num:'03', h:'Ask the better question',
   body:['The fastest route to clarity is rarely a new answer. It is a sharper question.',
         'We trade "what should I do" for the questions that make your own next step obvious.']},

  {t:'pillar', num:'04', h:'Lead as a practice',
   body:['Leadership is a practice. So is living well.',
         'You do not arrive at clarity once. You build a way of returning to it, so the next crossroads is far less frightening.']},

  {t:'reframe', kicker:'In practice',
   lead:'Picture the accomplished leader who finally admits the role everyone envies is not the one she wants.',
   body:['She does not blow up her life. She names the two values she had been ignoring, catches the assumption that it was "too late," and chooses one honest step from there.',
         'That is the whole move. Small, self-authored, and hers.']},

  {t:'part', n:'Part Three', h:'Clarity you can act on this week',
   body:['Not a five-year plan you will abandon by spring.',
         'One honest next step, chosen from your own values, that you can take this week, and a practice for finding the one after it.']},

  {t:'who', kicker:'What you leave with',
   lead:'One hour, three things you can keep.',
   body:['A clearer read on the values actually driving your decisions.',
         'The one assumption that has been quietly keeping you in place, named.',
         'A next step that is yours, and a practice for finding the one after it.']},

  {t:'who', kicker:'Why me',
   lead:'Thirty years leading inside demanding organizations, and a military background that taught me what steadiness under pressure really costs.',
   body:['Enterprise technology and marketing. Senior rooms, hard decisions, real stakes. An MBA, coach training through iPEC, and ICF credentialing underway.',
         'I have sat where you are sitting. I will not hand you my answers. I will help you find yours.']},

  {t:'cta', kicker:'Your next step',
   lead:'If any of this landed, let’s have one real conversation.',
   step:'Book a discovery call with Abi Beaty at abigailbeaty.com',
   body:['A short call to see what you are really navigating and whether working together is the right fit. No pressure, no script.'],
   disclaimer:'This masterclass is for education and reflection only. It is not therapy, medical, financial, or legal advice, and no specific career, income, or life outcome is promised or guaranteed. Results depend on your own circumstances and choices.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  el.style.setProperty('--pline', Math.round(((i+1)/S.length)*100) + '%');
  let h = '';
  if (s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if (s.n) h += '<div class="part-no">'+s.n+'</div>';
  if (s.num) h += '<div class="pillar-num">'+s.num+'</div>';
  if (s.t === 'title') h += '<h1>'+s.h+'</h1>';
  else if (s.h) h += '<h2>'+s.h+'</h2>';
  if (s.sub) h += '<p class="sub">'+s.sub+'</p>';
  if (s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if (s.body) s.body.forEach(b => h += '<p class="body">'+b+'</p>');
  if (s.step) h += '<div class="cta-box"><div class="step">'+s.step+'</div></div>';
  if (s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  h += '<div class="brandline">Abi Beaty &middot; Leadership &amp; Life Coaching</div>';
  h += '<div class="pg">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
