<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Content Universe — a live masterclass with Carla Contreras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,600;0,700;1,500&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f7f6;        /* her warm off-white (brand.json footer ground) */
    --panel:#ffffff;     /* her body bg */
    --ink:#1d1d1d;       /* her h2 ink (dominant family #212121) */
    --muted:#5c5a57;
    --rule:#e4e0db;
    --accent:#f80d28;    /* her exact brand red (brand.json ranked_colors) */
    --head:'Petrona', Georgia, serif;
    --body:'Figtree', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:54px 56px;margin:0 0 22px;min-height:360px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .k{font-family:var(--body);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin:0 0 16px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,5.4vw,60px);line-height:1.04;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(28px,4vw,44px);line-height:1.08;margin:0 0 18px;letter-spacing:-.01em}
  .sub{font-family:var(--head);font-style:italic;font-weight:500;font-size:clamp(18px,2.2vw,24px);color:var(--muted);margin:0 0 10px}
  p.body{font-size:clamp(17px,1.7vw,20px);line-height:1.55;color:#36342f;margin:10px 0 0;max-width:46ch}
  ul{margin:14px 0 0;padding:0;list-style:none;max-width:48ch}
  li{font-size:clamp(16px,1.6vw,19px);line-height:1.5;padding:12px 0 12px 30px;border-top:1px solid var(--rule);position:relative;color:#36342f}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .foot{margin-top:26px;font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .disc{margin-top:22px;font-size:12.5px;line-height:1.5;color:#8a8783;max-width:60ch}
  .rings{position:absolute;right:-70px;bottom:-70px;width:260px;height:260px;opacity:.1}
  .rings span{position:absolute;border:2px solid var(--accent);border-radius:50%;inset:0}
  .rings span:nth-child(2){inset:38px}
  .rings span:nth-child(3){inset:76px}
  .pagefoot{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<div class="pagefoot">Carla Contreras &middot; a live masterclass</div>
<script>
const S = [
  {t:'title', k:'A free live masterclass', h:'Build Your Content Universe', sub:'The Substack that pays you back every time you press publish.', foot:'With Carla Contreras', rings:true},
  {t:'who', h:'This is for you if...', list:['You publish consistently, but it is not turning into subscribers or income.','You are spread across five platforms and none of them compound.','You know your work is good, and you are tired of shouting into the void.']},
  {t:'trap', h:'The trap you were handed', body:'You were told the answer is more content. So you post more, in more places, more often. And the harder you work, the more you build on rented ground, and the less any single piece is worth.'},
  {t:'reframe', k:'The real problem', h:'It is not a content problem', body:'It is a system problem. Scattered content disappears the week you make it. A Content Universe takes the same work and makes it compound.'},
  {t:'part', k:'Part one', h:'Why publishing feels like it pays nothing'},
  {t:'point', h:'Rented vs owned', body:'Social feeds are rented. The algorithm decides who sees you, and the day it changes, your audience is gone. Your Substack is owned. Those readers are yours, and nobody can take them.'},
  {t:'point', h:'Scattered vs compounding', body:'A post on Monday is dead by Friday. A Content Universe takes that same hour of work and makes every piece feed the next, so your library grows in value instead of vanishing.'},
  {t:'part', k:'Part two', h:'The Content Universe method'},
  {t:'pillar', k:'Move one', h:'Claim your digital home', body:'Make Substack the center. Not another channel to feed, but the owned home every other piece points back to, built with strategy and intention instead of guesswork.'},
  {t:'pillar', k:'Move two', h:'Get everything in its place', body:'Like a chef sets a mise-en-place: your podcast, your Pinterest, your notes, each one prepped with a job, each one handing the reader to the next. Nothing random, nothing wasted.'},
  {t:'pillar', k:'Move three', h:'Get paid to publish', body:'Turn attention into paid subscribers and enrollments. Build the paid tier, the offers, and the path, so that pressing publish becomes the same motion as getting paid.'},
  {t:'detail', h:'What goes in the home', list:['A Substack built on strategy, not a blank page.','A promise your reader recognizes in seconds.','Paid tiers that reward your best work.','A publishing rhythm you can actually keep.']},
  {t:'part', k:'Part three', h:'A compounding week, in practice'},
  {t:'picture', h:'One hour, paid back for months', body:'You write once. The piece lives in your owned home, feeds the podcast, seeds the Pinterest, and earns from the paid tier. The same hour keeps paying you back long after you press publish.'},
  {t:'proof', k:'From my own work', h:'Same creative, a system that compounds', body:'When I moved my work into this system and started publishing through Substack, my own podcast grew roughly 999%. Nothing about the creative changed. The system did.'},
  {t:'whyme', k:'Why me', h:'I build content like a kitchen', body:'I have spent 25 years as a food creative, chef, stylist and art director for brands like Bobbi Brown and the Food Network. Everything prepped, everything with a purpose. That is how I build a Content Universe too.'},
  {t:'recap', h:'The three moves', list:['Claim your digital home.','Get everything in its place.','Get paid to publish.']},
  {t:'cta', k:'Your next step', h:'Build your Content Universe with me', body:'If you want help building this for your own work, the next step is the Build Your Brand on Substack intensive, where we do it together.', disc:'This masterclass is educational. No income, role, or result is guaranteed. Results vary and depend on your own work, audience, and circumstances.', foot:'Carla Contreras &middot; carlacontreras.com'}
];
const deck = document.getElementById('deck');
S.forEach(function(s){
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.k) html += '<div class="k">'+s.k+'</div>';
  if(s.t==='title'){ html += '<h1>'+s.h+'</h1>'; } else { html += '<h2>'+s.h+'</h2>'; }
  if(s.sub) html += '<div class="sub">'+s.sub+'</div>';
  if(s.body) html += '<p class="body">'+s.body+'</p>';
  if(s.list){ html += '<ul>'; s.list.forEach(function(i){ html += '<li>'+i+'</li>'; }); html += '</ul>'; }
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  if(s.foot) html += '<div class="foot">'+s.foot+'</div>';
  if(s.rings) html += '<div class="rings"><span></span><span></span><span></span></div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
