<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muscle Is the Retirement Plan | Physical Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f1f5fd;
    --panel:#ffffff;
    --ink:#111418;
    --ink-soft:#333a44;
    --ink-muted:#5b6472;
    --rule:#5b6472;
    --accent:#2168f3;
    --accent-soft:#e7effe;
  }
  html,body{height:100%;}
  body{font-family:'Poppins',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;}
  .slide{display:none;width:100%;max-width:1040px;}
  .slide.on{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .eyebrow{font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(34px,6vw,64px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px;}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(26px,4vw,40px);line-height:1.12;margin-bottom:20px;}
  .sub{font-size:clamp(18px,2.2vw,24px);color:var(--ink-soft);font-weight:500;}
  .body{font-size:clamp(17px,1.9vw,21px);color:var(--ink-soft);line-height:1.6;max-width:760px;}
  .body p{margin-bottom:14px;}
  .lead{font-size:clamp(20px,2.6vw,30px);color:var(--ink);font-weight:600;line-height:1.3;max-width:820px;}
  ul.points{list-style:none;margin-top:12px;}
  ul.points li{position:relative;padding-left:30px;margin-bottom:14px;font-size:clamp(16px,1.8vw,20px);color:var(--ink-soft);line-height:1.5;}
  ul.points li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:2px;}
  .phases{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px;}
  .phase{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 16px;}
  .phase .bar{height:6px;border-radius:3px;background:var(--accent-soft);margin-bottom:14px;position:relative;overflow:hidden;}
  .phase .bar span{position:absolute;inset:0;background:var(--accent);}
  .phase .wk{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px;}
  .phase .nm{font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;margin-bottom:8px;}
  .phase .ds{font-size:14px;color:var(--ink-soft);line-height:1.45;}
  .stat{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(48px,9vw,96px);color:var(--accent);line-height:1;margin-bottom:16px;}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:clamp(28px,4vw,46px);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;}
  .tile{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px;}
  .tile .th{font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;margin-bottom:6px;}
  .tile .td{font-size:15px;color:var(--ink-soft);line-height:1.5;}
  .disclaimer{margin-top:28px;font-size:13px;color:var(--ink-muted);line-height:1.5;max-width:720px;}
  .cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;padding:16px 30px;border-radius:10px;text-decoration:none;}
  footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);}
  .brandmark{font-weight:700;color:var(--ink);}
  .nav{display:flex;gap:10px;align-items:center;}
  .nav button{font-family:'Montserrat',sans-serif;background:var(--panel);border:1px solid var(--rule);color:var(--ink);border-radius:7px;width:34px;height:34px;cursor:pointer;font-size:16px;}
  .nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .count{min-width:64px;text-align:center;}
  @media(max-width:720px){.phases{grid-template-columns:1fr 1fr;}.grid2{grid-template-columns:1fr;}#stage{padding:7vh 7vw 90px;}}
</style>
</head>
<body>
<div id="stage"></div>
<footer>
  <span class="brandmark">Physical Structure &nbsp;&middot;&nbsp; Age Strong, Live Long</span>
  <span class="nav"><button onclick="go(-1)">&#8592;</button><span class="count" id="count"></span><button onclick="go(1)">&#8594;</button></span>
</footer>
<script>
const S=[
  {t:'title',eyebrow:'A masterclass for adults 45 and older',h:'Muscle Is the Retirement Plan',sub:'The 48-Week Blueprint to age strong, stay sharp, and keep your independence after 45.'},
  {t:'content',eyebrow:'Who this is for',h:'You are 45 or older, and you have felt it.',lead:'The step you lost. The energy that fades by mid-afternoon. The nagging sense that your body is quietly negotiating terms you never agreed to.',sub:'You are not looking for a bootcamp. You are looking for the decades ahead to be strong ones.'},
  {t:'content',eyebrow:'The trap',h:'You have been told the wrong story.',body:['"Slow down." "Take it easy." "That is just what happens at your age."','So people do less. They walk more and lift nothing. They trade the gym for the couch and call it being careful.','Being careful is exactly how you lose the one thing that was protecting you.']},
  {t:'statement',eyebrow:'The reframe',lead:'The real risk is not getting older. It is getting weaker. And weakness is the one part of aging you get to vote on.'},
  {t:'part',eyebrow:'Part One',h:'Why strength is the whole game after 45',sub:'Before the plan, the problem nobody names.'},
  {t:'stat',eyebrow:'Sarcopenia',stat:'3 to 8%',sub:'Muscle you lose every decade after 30, accelerating after 60. Left alone, that is up to half your muscle gone by your 80s. The medical name for it is a disease.'},
  {t:'content',eyebrow:'Muscle as armor',h:'Muscle is your suit of armor for aging.',body:['Strength is not vanity. The muscle you keep protects far more than your mirror:'],points:['Mobility, balance, and the fall you never take','Metabolism and blood-sugar control','Bone density and joint stability','Cognitive function and emotional well-being','The confidence to keep living on your own terms']},
  {t:'content',eyebrow:'Why the usual approach fails',h:'Random workouts do not reverse decline.',body:['A class here, a long walk there, a treadmill with no plan. It feels like effort, so it feels like progress.','But muscle only responds to progressive, measured load. Without a structure that tests, adjusts, and builds, you maintain the decline instead of reversing it.']},
  {t:'part',eyebrow:'Part Two',h:'The Function-Health-Fitness-Performance Continuum',sub:'A complete model, not a workout of the day.'},
  {t:'content',eyebrow:'Six specialized pillars',h:'Everything your aging body actually needs.',body:['Training for 45+ is not one thing. The Continuum covers six:'],points:['Posture and spine strength, endurance, and mobility','Skeletal muscle building, the direct answer to sarcopenia','Cardiorespiratory conditioning','Balance, agility, and multiplane functional movement','Post-physical-therapy fitness training','Athletic performance for those who still compete']},
  {t:'content',eyebrow:'The Five Foundational Elements',h:'The plan before the plan.',body:['Every blueprint starts with these, so training has direction instead of being busywork:'],points:['Mission: why this matters to you, specifically','Goal planning for both health and the way you want to look','A strategic framework to get there','Standards: the weekly tactical actions you hold','Mental preparation to make it stick']},
  {t:'part',eyebrow:'Part Three',h:'The 48-Week Blueprint',sub:'A testable year, with a map, built for adults 45 and older.'},
  {t:'phases',eyebrow:'Four 12-week phases',h:'A year, broken into wins.',phases:[
    {wk:'Weeks 1-12',fill:'25%',nm:'Setting the Stage',ds:'Build foundational capacity and adherence. Two resistance and mobility sessions plus two Zone 2 cardio sessions a week. Habits and nutrition awareness.'},
    {wk:'Weeks 13-24',fill:'50%',nm:'Win Stacking',ds:'Reassess goals and progress volume. Body composition and aerobic testing. A session with a board-certified health and wellness coach.'},
    {wk:'Weeks 25-36',fill:'75%',nm:'Building and Optimization',ds:'More Zone 2, HIIT introduced to raise VO2 max. Medical-grade nutrition counseling with a registered dietitian nutritionist.'},
    {wk:'Weeks 37-48',fill:'100%',nm:'Performance and What is Next',ds:'Retest every metric, execute a real performance goal, and build the plan that keeps you here for good.'}
  ]},
  {t:'content',eyebrow:'What makes it work',h:'You cannot improve what you do not measure.',body:['This is not a program you finish and forget. You test at the start, retest through every phase, and watch the numbers move:'],points:['Strength and body composition','Aerobic capacity and VO2 max','Balance, mobility, and function','A performance goal you actually hit by week 48']},
  {t:'content',eyebrow:'The prescription',h:'It is less than you think, done right.',body:['The work that reverses the trend is simple and sustainable:'],points:['Two to three strength sessions a week, 20 to 30 minutes','Five to eight compound movements, progressed over time','Roughly one gram of protein per pound of ideal bodyweight','Consistency measured in decades, not weeks']},
  {t:'content',eyebrow:'Why me',h:'I practice what I prescribe.',body:['I founded Physical Structure in 1992 and have coached adults 45 and older privately ever since, in Manhattan and the Hamptons.','I am a two-time Ironman finisher, a fifteen-time Half Ironman finisher, a former college wrestler, and I took up Brazilian Jiujitsu at 55. Strategic aging is not a theory I sell. It is the life I live, and the one I help you build.']},
  {t:'cta',eyebrow:'Your next step',h:'Book your free Strategy Session.',sub:'We map your baseline, your goals, and whether the 48-Week Blueprint is the right fit. No pressure, just a plan.',btn:'Schedule your Strategy Session',disclaimer:'This masterclass is educational. It is not medical advice, and it is not a treatment plan. No specific result is guaranteed. Results vary from person to person and depend on your effort, health history, and consistency. Consult your physician before beginning any exercise or nutrition program.'}
];
let i=0;const stage=document.getElementById('stage'),count=document.getElementById('count');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pts(a){return a?('<ul class="points">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'):'';}
function bod(a){return a?('<div class="body">'+a.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>'):'';}
function render(){
  let s=S[i],h='';
  const eye=s.eyebrow?'<div class="eyebrow">'+esc(s.eyebrow)+'</div>':'';
  if(s.t==='title'){h=eye+'<h1>'+esc(s.h)+'</h1><div class="sub">'+esc(s.sub)+'</div>';}
  else if(s.t==='part'){h=eye+'<h1>'+esc(s.h)+'</h1><div class="sub">'+esc(s.sub)+'</div>';}
  else if(s.t==='statement'){h=eye+'<div class="lead">'+esc(s.lead)+'</div>';}
  else if(s.t==='stat'){h=eye+'<div class="stat">'+esc(s.stat)+'</div><div class="sub">'+esc(s.sub)+'</div>';}
  else if(s.t==='phases'){h=eye+'<h2>'+esc(s.h)+'</h2><div class="phases">'+s.phases.map(p=>'<div class="phase"><div class="bar"><span style="width:'+p.fill+'"></span></div><div class="wk">'+esc(p.wk)+'</div><div class="nm">'+esc(p.nm)+'</div><div class="ds">'+esc(p.ds)+'</div></div>').join('')+'</div>';}
  else if(s.t==='cta'){h=eye+'<h1>'+esc(s.h)+'</h1><div class="sub">'+esc(s.sub)+'</div><a class="cta-btn" href="https://physicalstructure.net/contact/">'+esc(s.btn)+'</a><div class="disclaimer">'+esc(s.disclaimer)+'</div>';}
  else{h=eye+(s.h?'<h2>'+esc(s.h)+'</h2>':'')+(s.lead?'<div class="lead">'+esc(s.lead)+'</div>':'')+bod(s.body)+pts(s.points)+(s.sub?'<div class="sub" style="margin-top:18px">'+esc(s.sub)+'</div>':'');}
  stage.innerHTML='<div class="slide on">'+h+'</div>';
  count.textContent=(i+1)+' / '+S.length;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
stage.addEventListener('click',()=>go(1));
render();
</script>
</body>
</html>
