<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train, Fuel and Recover Through Perimenopause | Element Sports Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f9fb;
    --panel:#eef2f6;
    --ink:#1e3348;
    --ink-soft:#44566a;
    --muted:#7c8a99;
    --rule:#d7dee6;
    --accent:#385675;
    --deep:#1e3348;
  }
  html,body{height:100%}
  body{background:var(--deep);font-family:'Barlow',system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(100vw,1180px);aspect-ratio:16/9;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .slide{position:absolute;inset:0;padding:68px 84px;display:none;flex-direction:column}
  .slide.on{display:flex}
  .k{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:58px;line-height:1.04;letter-spacing:.005em;color:var(--ink);text-transform:uppercase}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:42px;line-height:1.08;color:var(--ink);text-transform:uppercase;letter-spacing:.01em}
  .sub{font-size:25px;line-height:1.45;color:var(--ink-soft);margin-top:22px;max-width:80%;font-weight:300}
  .big{font-family:'Oswald',sans-serif;font-weight:600;font-size:46px;line-height:1.14;color:var(--ink);max-width:90%}
  .big .a{color:var(--accent)}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px}
  li{font-size:26px;line-height:1.4;color:var(--ink-soft);padding-left:40px;position:relative;font-weight:400}
  li::before{content:'';position:absolute;left:0;top:13px;width:16px;height:16px;border-radius:4px;background:var(--accent)}
  p.body{font-size:27px;line-height:1.5;color:var(--ink-soft);margin-top:24px;max-width:84%;font-weight:400}
  .note{margin-top:auto;font-size:19px;line-height:1.5;color:var(--muted);border-top:1px solid var(--rule);padding-top:20px;max-width:88%;font-style:italic}
  .mntr{display:flex;gap:18px;margin-top:40px}
  .mntr .cell{flex:1;background:var(--panel);border-left:5px solid var(--accent);padding:28px 22px}
  .mntr .cell .l{font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;color:var(--ink);text-transform:uppercase}
  .glyph{font-family:'Oswald',sans-serif;font-weight:700;font-size:150px;line-height:1;color:var(--accent);opacity:.18;position:absolute;right:70px;bottom:40px}
  .foot{margin-top:auto;font-family:'Oswald',sans-serif;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);padding-top:18px}
  .title-wrap{flex:1;display:flex;flex-direction:column;justify-content:center}
  .cta-box{margin-top:30px;display:inline-block;align-self:flex-start;background:var(--accent);color:#fff;font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;letter-spacing:.03em;padding:18px 34px;text-transform:uppercase}
  .disc{margin-top:auto;font-size:15px;line-height:1.5;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px;max-width:92%}
  .pierce{position:absolute;top:0;left:0;width:10px;height:100%;background:var(--accent)}
  #nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;font-family:'Oswald',sans-serif;color:#cdd6e0;font-size:14px;letter-spacing:.1em;z-index:5}
  #nav button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:18px;width:40px;height:40px;cursor:pointer;border-radius:50%}
  @media(max-width:720px){.slide{padding:38px 40px}h1{font-size:38px}h2{font-size:30px}.sub{font-size:19px;max-width:100%}.big{font-size:30px}li,p.body{font-size:19px}.mntr{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">&#8249;</button><span id="count"></span><button id="next">&#8250;</button></div>
<script>
const S = [
  {t:'title', k:'A Live Masterclass', h:'Train, Fuel and Recover Through Perimenopause Without Losing Your Edge', s:'The whole-athlete way to keep getting stronger when your physiology changes.', f:'Tenille Hoogland · Element Sports Coaching'},
  {t:'who', h:'Who this is for', b:['You run, cycle or race triathlon','You are moving through perimenopause or menopause','You are training hard and the results stopped following'], note:'If you want to feel good, confident and strong, you are in the right room. This is not just for elite athletes.'},
  {t:'trap', h:'The trap', body:'You do what always worked. Train harder, eat a little less, push through. It worked at 35. Now it leaves you flat, heavy legged and wrecked for days.'},
  {t:'reframe', k:'The reframe', big:'You are not getting slower because you are older. You are training <span class="a">against</span> your physiology instead of with it.'},
  {t:'part', k:'Part One', h:'The core problem', s:'Why the old playbook backfires in midlife.'},
  {t:'problem', h:'Your body changed the rules', b:['Shifting estrogen and progesterone change how you adapt, recover and fuel','The same intensity now costs more and returns less','Under fueling and over training feel like discipline but drive the plateau']},
  {t:'problem', h:'One lever is not the answer', body:'Looking at only nutrition, only training, or only hormones leaves you filling in the gaps. The levers move together, or they quietly undo each other.'},
  {t:'part', k:'Part Two', h:'The MNTR system', s:'Mindset, Nutrition, Training and Recovery, coached as one.'},
  {t:'framework', h:'MNTR', cells:['Mindset','Nutrition','Training','Recovery'], note:'One integrated system, held in the context of female physiology. I do not coach disciplines, workouts or metrics in isolation. I coach the whole athlete.'},
  {t:'pillar', k:'M', h:'Mindset', body:'How you show up on the days the data looks off. Confidence that is built through the work, not borrowed from a good week.'},
  {t:'pillar', k:'N', h:'Nutrition', body:'Fueling for your physiology so strength and energy hold, instead of eating like a smaller, younger athlete and wondering why you stalled.'},
  {t:'pillar', k:'T', h:'Training', body:'Intensity with intention, matched to where your hormones are right now, not a generic plan running on repeat.'},
  {t:'pillar', k:'R', h:'Recovery', body:'Recovery respected and built in, not skipped or borrowed from sleep. This is where the adaptation actually happens.'},
  {t:'part', k:'Part Three', h:'How you put it to work', s:'The ACT loop.'},
  {t:'step', k:'A', h:'Awareness and Acknowledgement', body:'Learn how your body responds now to training, nutrition and recovery. Name what has changed, without judgment.'},
  {t:'step', k:'C', h:'Connect', body:'Identify the changes that matter most and prioritize them. Stop pouring effort into the wrong lever.'},
  {t:'step', k:'T', h:'Take Action', body:'Apply it and adjust. Optimal health and sport performance do not happen accidentally. It takes intention and action.'},
  {t:'proof', h:'What changes for you', b:['Training that finally fits the body you have now','Energy back, strength back, confidence back','A plan that keeps adapting as hormones, goals and life change']},
  {t:'whyme', h:'Why work with me', body:'I coach women in triathlon, cycling and running with the same standard of care, grounded in female physiology. I know what it means to push hard, and what happens when that approach stops working.', f:'Tenille Hoogland · Element Sports Coaching'},
  {t:'cta', h:'Train with your body, not against it', body:'Join Team Element and get the whole-athlete MNTR system built around you, with coaching, live sessions and a community of women doing the same.', cta:'Start at elementsportscoaching.com', disc:'Educational content only. No specific result or performance outcome is guaranteed. Results vary by individual, effort, health history and consistency. Consult your physician before starting any new training or nutrition program.'}
];

const stage = document.getElementById('stage');
function esc(x){return x;}
function render(s){
  if(s.t==='title') return `<div class="pierce"></div><div class="title-wrap"><div class="k">${s.k}</div><h1>${s.h}</h1><div class="sub">${s.s}</div></div><div class="foot">${s.f}</div>`;
  if(s.t==='reframe') return `<div class="pierce"></div><div class="k">${s.k}</div><div class="title-wrap"><div class="big">${s.big}</div></div>`;
  if(s.t==='part') return `<div class="pierce"></div><div class="title-wrap"><div class="k">${s.k}</div><h1>${s.h}</h1><div class="sub">${s.s}</div></div>`;
  if(s.t==='framework'){
    const cells = s.cells.map(c=>`<div class="cell"><div class="l">${c[0]}</div><div style="font-size:19px;color:var(--ink-soft);margin-top:6px">${c}</div></div>`).join('');
    return `<div class="pierce"></div><div class="k">The system</div><h1>${s.h}</h1><div class="mntr">${cells}</div><div class="note">${s.note}</div>`;
  }
  if(s.t==='pillar') return `<div class="pierce"></div><h2>${s.h}</h2><p class="body">${s.body}</p><div class="glyph">${s.k}</div>`;
  if(s.t==='step') return `<div class="pierce"></div><div class="k">Step ${s.k}</div><h2>${s.h}</h2><p class="body">${s.body}</p><div class="glyph">${s.k}</div>`;
  if(s.t==='cta') return `<div class="pierce"></div><div class="k">Your next step</div><h1>${s.h}</h1><p class="body">${s.body}</p><div class="cta-box">${s.cta}</div><div class="disc">${s.disc}</div>`;
  // who / trap / problem / proof / whyme
  let inner = `<div class="pierce"></div>`;
  if(s.k) inner += `<div class="k">${s.k}</div>`;
  inner += `<h2>${s.h}</h2>`;
  if(s.body) inner += `<p class="body">${s.body}</p>`;
  if(s.b) inner += `<ul>${s.b.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(s.note) inner += `<div class="note">${s.note}</div>`;
  if(s.f) inner += `<div class="foot">${s.f}</div>`;
  return inner;
}
let i=0;
function show(){
  stage.innerHTML = `<div class="slide on">${render(S[i])}</div>`;
  document.getElementById('count').textContent = (i+1)+' / '+S.length;
}
function go(d){ i=Math.max(0,Math.min(S.length-1,i+d)); show(); }
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
stage.addEventListener('click',e=>{if(e.clientX > window.innerWidth/2)go(1);else go(-1);});
show();
</script>
</body>
</html>
