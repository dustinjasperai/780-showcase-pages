<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freedom by Creation — The Moment of Action Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3eff9;        /* pale rebeccapurple wash, from her #663399, light scheme */
    --panel:#fffefb;     /* warm near-white */
    --rule:#e4dcf0;      /* soft lavender hairline */
    --ink:#2e2e2e;       /* her near-black */
    --muted:#6b6459;
    --accent:#663399;    /* her footer brand color (rebeccapurple) */
    --gold:#ffcc00;      /* her dominant site hue, thin threshold motif only */
    --display:'Fredoka',system-ui,sans-serif;
    --body:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 48px;margin:0 0 24px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:56px;top:34px;width:64px;height:3px;
    background:var(--gold);border-radius:2px}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.14;letter-spacing:-.01em}
  .lede{font-size:20px;line-height:1.5;color:var(--ink);margin-top:20px;max-width:46ch}
  .muted{color:var(--muted)}
  .big{font-size:40px;font-family:var(--display);font-weight:600;line-height:1.14;max-width:22ch}
  ul{margin-top:22px;list-style:none}
  li{font-size:19px;line-height:1.45;padding-left:28px;position:relative;margin-bottom:14px;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .step{font-family:var(--display);font-weight:600;color:var(--accent);font-size:15px;letter-spacing:.06em}
  .pillar-num{font-family:var(--display);font-weight:700;font-size:15px;color:var(--gold);
    background:var(--ink);display:inline-block;padding:4px 12px;border-radius:999px;margin-bottom:16px}
  .foot{position:absolute;right:56px;bottom:30px;font-family:var(--display);font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .cta{background:var(--ink);color:var(--bg)}
  .cta::before{background:var(--gold)}
  .cta h1{color:#fff}
  .cta .lede{color:#efe9e0}
  .cta .btn{display:inline-block;margin-top:26px;background:var(--gold);color:var(--ink);
    font-family:var(--display);font-weight:600;font-size:18px;padding:15px 26px;border-radius:10px}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:#c9c1b4;max-width:52ch}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}
  .card{border:1px solid var(--rule);border-radius:12px;padding:22px}
  .card h3{font-family:var(--display);font-weight:600;font-size:18px;color:var(--accent);margin-bottom:8px}
  .card p{font-size:16px;line-height:1.45;color:var(--ink)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'Freedom by Creation',h:'The Moment of Action',lede:'A live masterclass for smart women over 50 on moving forward the moment it gets real, not once you finally feel ready.',foot:'With Karen Theimer'},
  {t:'who',eyebrow:'Who this is for',h:'You are capable. You are not stuck for lack of ability.',lede:'You are a woman over 50 who has built a life, raised a family, run businesses or careers. You can see your next chapter clearly. You just keep not starting it.'},
  {t:'trap',eyebrow:'The trap',h:'You are waiting to feel ready.',lede:'More research. One more course. After the holidays. When things calm down. The plan keeps getting better and the start keeps getting later.'},
  {t:'reframe',eyebrow:'The reframe',big:'You do not have a confidence problem. You have a moment-of-action problem.',lede:'Confidence is supposed to arrive after you act, not before. Waiting for it keeps you in the loop.'},
  {t:'part',eyebrow:'Part One',h:'The core problem: The Hesitation.'},
  {t:'content',eyebrow:'The Hesitation',h:'The freeze is a pattern, not a personality.',lede:'The Hesitation is the overthinking and decision-looping that shows up the instant a decision becomes real. It feels like wisdom. It is usually the brakes.'},
  {t:'content',eyebrow:'Why the usual advice fails',h:'Clarity and confidence advice talks to your mind. The freeze lives in your body.',lede:'When the moment of action arrives, your nervous system reads it as risk and pulls you back into planning. No amount of mindset talk reaches a body that feels unsafe.'},
  {t:'part',eyebrow:'Part Two',h:'The method: Freedom by Creation.'},
  {t:'pillar',num:'Pillar 01',h:'The Moment of Action',lede:'Learn to recognize the exact instant intention turns into movement, the point where you have always retreated. You cannot move through what you cannot see.'},
  {t:'pillar',num:'Pillar 02',h:'Grounded Momentum',lede:'Regulate the body first with breath so action feels safe enough to take. A settled nervous system is what lets you step forward instead of researching one more time.'},
  {t:'pillar',num:'Pillar 03',h:'Aligned action, compounded',lede:'One real action, taken on purpose, becomes evidence you can trust yourself. Self-trust is built from action taken, never summoned from thin air before it.'},
  {t:'content',eyebrow:'The sequence',h:'Breath, then one aligned action, then momentum.',lede:'This is the order that works, every time:',
    items:['Settle the body before you decide, so the moment of action does not read as danger','Take one small aligned action while you are regulated','Let the proof of that action build the trust that carries the next one']},
  {t:'part',eyebrow:'Part Three',h:'The body-first way, lived out.'},
  {t:'twocol',eyebrow:'Before and after',h:'The same decision, two different bodies.',
    cards:[{h:'In The Hesitation',p:'The decision appears. The body tightens. You open a new tab, ask three more people, and promise to start after the holidays.'},
           {h:'In Grounded Momentum',p:'The decision appears. You breathe and settle. You take the one next step while it is still small, and the step after it gets easier.'}]},
  {t:'content',eyebrow:'Why me',h:'I have spent 20 years helping women feel safe in their own bodies.',lede:'I am a Registered Massage Therapist, breathwork facilitator and holistic nutritionist. I rebuilt my own life at 40 and again through a cancer diagnosis. I teach the body-first way through hesitation because I have had to live it.',foot:'Karen Theimer'},
  {t:'content',eyebrow:'What becomes possible',h:'A next chapter you actually start.',lede:'Not a tidier plan. The real thing, begun, while you are still regulated enough to keep going.'},
  {t:'recap',eyebrow:'The method, in one view',h:'Freedom by Creation.',
    items:['The Moment of Action: see the instant you freeze','Grounded Momentum: regulate the body so action feels safe','Aligned action, compounded: build self-trust from steps taken']},
  {t:'cta',eyebrow:'Your next step',h:'Book your free Moment of Action call.',lede:'If you are done waiting to feel ready, we will find the one place you keep freezing and the first aligned action to move through it.',btn:'Book at karentheimer.com',
    disc:'This masterclass is for educational purposes only. Individual results vary and nothing here is a promise or guarantee of any particular outcome.'}
];
const deck=document.getElementById('deck');
for(const s of S){
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'');
  let html='';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.num) html+='<div class="pillar-num">'+s.num+'</div>';
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  else if(s.h && (s.t==='title')) html+='<h1>'+s.h+'</h1>';
  else if(s.h) html+='<h2>'+s.h+'</h2>';
  if(s.lede) html+='<p class="lede">'+s.lede+'</p>';
  if(s.items){html+='<ul>';for(const it of s.items)html+='<li>'+it+'</li>';html+='</ul>';}
  if(s.cards){html+='<div class="two">';for(const c of s.cards)html+='<div class="card"><h3>'+c.h+'</h3><p>'+c.p+'</p></div>';html+='</div>';}
  if(s.btn) html+='<div class="btn">'+s.btn+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  if(s.foot) html+='<div class="foot">'+s.foot+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
}
</script>
</body>
</html>
