<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neurempathy — The Science of a Message People Repeat | Keynote Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5eedd;      /* warm cream, a low-saturation tint of their brand gold #e0ac2b */
    --panel:#fffdf6;   /* near-white warmed toward the same gold */
    --ink:#282828;     /* their dominant ink */
    --muted:#5c5a54;
    --rule:#e6e1d6;
    --accent:#e0ac2b;  /* their signature brand gold (brand.json, 68 uses) */
    --display:'Bebas Neue', Impact, sans-serif;
    --body:'Lora', Georgia, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 24px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:64px 60px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .eyebrow{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-size:20px;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:1.02;
    font-size:68px;margin-bottom:16px}
  h2{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:1.05;
    font-size:46px;margin-bottom:18px}
  p{font-size:22px;line-height:1.5;color:var(--ink);max-width:40em;margin-bottom:14px}
  p.lead{font-size:26px}
  p.muted{color:var(--muted)}
  .brandline{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-size:18px;margin-top:28px}
  .big{font-size:80px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:22px;line-height:1.45;padding:12px 0 12px 30px;position:relative;
    border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;
    background:var(--accent);border-radius:2px}
  .pillar{display:flex;gap:18px;align-items:baseline;padding:14px 0;border-top:1px solid var(--rule)}
  .pillar .n{font-family:var(--display);font-size:40px;color:var(--accent);min-width:54px}
  .pillar .t{font-size:22px}
  .pillar .t b{font-family:var(--display);font-weight:400;letter-spacing:.03em;font-size:26px;display:block}
  .disclaimer{font-size:15px;color:var(--muted);margin-top:26px;max-width:46em;line-height:1.5}
  .cta-step{font-size:24px;color:var(--ink);margin-top:8px}
  .slidenum{font-family:var(--display);letter-spacing:.1em;color:var(--muted);font-size:15px;
    margin-top:30px}
  @media(max-width:640px){
    .slide{padding:40px 26px;min-height:320px}
    h1{font-size:44px}h2{font-size:32px}.big{font-size:52px}p{font-size:19px}
  }
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Jon Cook', h1:'Neurempathy',
   sub:'The science of a message people repeat.', brand:'Keynote Content'},

  {t:'point', eyebrow:'The promise', h2:'In the next hour',
   body:'Why some talks get quoted for weeks while others are forgotten by the parking lot, and how to build the kind people repeat on purpose.'},

  {t:'point', eyebrow:'Who this is for', h2:'You already know your subject',
   body:'Experts, consultants and advisors who have the expertise and the stage time. What is missing is a message that actually lands and spreads once you step off.'},

  {t:'point', eyebrow:'The trap', h2:'You did everything right',
   body:'You tightened the deck. You rehearsed the delivery. The room nodded. And a week later, almost no one can tell a colleague what you actually said.'},

  {t:'hook', eyebrow:'A harder truth', big:'Delivery was never the problem.',
   body:'Your message reached their ears. It never reached the part of the brain that decides what to remember and repeat.'},

  {t:'point', eyebrow:'Part one', h2:'The core problem',
   body:'Almost every expert talk aims at one of two targets. The mind, or the emotions. Pick one and you lose half the room.'},

  {t:'point', eyebrow:'The mind-only talk', h2:'Respected, not remembered',
   body:'All logic, data and frameworks. The audience agrees with you in the moment, then nothing moves. Being right is not the same as being repeatable.'},

  {t:'point', eyebrow:'The emotion-only talk', h2:'Felt, not trusted',
   body:'All story and energy. The room feels something, then doubts it later because there was nothing underneath to hold the feeling up.'},

  {t:'hook', eyebrow:'The missing idea', big:'Reach both at once.',
   body:'A message engineered to meet the mind and the emotions in the same moment is the one that survives the walk to the car.'},

  {t:'point', eyebrow:'Part two', h2:'Neurempathy',
   body:'Behavioral neuroscience plus actionable empathy. A way to build a message that connects with an audience’s mind and emotions at the same time, on purpose, not by luck.'},

  {t:'point', eyebrow:'Why it is different', h2:'Built, not guessed',
   body:'This approach was developed through more than 10,000 hours and 50,000 dollars of behavioral science research, so the message is engineered rather than hoped for.'},

  {t:'framework', eyebrow:'Part three', h2:'The Expert Elevation Method',
   lead:'Three pillars that turn one idea into a signature message you own.',
   pillars:[
     {n:'I', title:'Story', line:'Know your purpose. Find the one message only you can make, using the Neurempathy approach to frame it.'},
     {n:'II', title:'Systems', line:'Own your processes. Build the delivery and the responsible AI behind it so your message scales instead of stalling.'},
     {n:'III', title:'Stages', line:'Speak with conviction. Carry the message from the page to the stage so it lands every time you stand up.'}
   ]},

  {t:'point', eyebrow:'Pillar one, Story', h2:'Know your purpose',
   body:'Before a single slide, you settle the one thing you want remembered. The Advisory Story Model shapes your own story so it carries authority instead of just credentials.'},

  {t:'point', eyebrow:'Pillar two, Systems', h2:'Own your processes',
   body:'A repeatable way to build and refine the message, with AI used as a tool and never as your voice. Visibility work like answer and generative engine optimization makes the right people find it.'},

  {t:'point', eyebrow:'Pillar three, Stages', h2:'Speak with conviction',
   body:'The same message, delivered so the room leans in and quotes you afterward. Conviction is what a well-built message gives you for free.'},

  {t:'point', eyebrow:'The AI-forward edge', h2:'A message AI cannot copy',
   body:'When every competitor sounds generated, the human expert with a science-built message becomes the obvious, and un-copyable, choice.'},

  {t:'point', eyebrow:'The payoff', h2:'When a message truly lands',
   body:'People lean in while you speak. They quote you to a colleague the next day. The follow-up conversations come to you, because the message did the work before you asked for anything.'},

  {t:'point', eyebrow:'Why me', h2:'Where this comes from',
   body:'A creative-director and copywriting career on major brands, graduate study in counseling, postgraduate study in behavioral neuroscience, and close to 1,500 experts coached one on one, from bestselling authors to Fortune 100 executives.'},

  {t:'point', eyebrow:'Recap', h2:'The one thing to keep',
   body:'A forgettable talk is not a delivery problem. Build the message to reach the mind and the emotions at once, and people carry it for you.'},

  {t:'cta', eyebrow:'Make it yours', h2:'Build a message people repeat',
   step:'If you want help shaping yours, the next step is a conversation about your message and your goals through Keynote Content.',
   disclaimer:'This masterclass is educational. It shares a method and a point of view, not a promise of results. Outcomes vary with your own work, audience and market. Nothing here is a guarantee of income, booking, or business results.',
   brand:'Keynote Content'}
];

const deck = document.getElementById('deck');
S.forEach((s, i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if (s.t==='title'){
    html += '<h1>'+s.h1+'</h1>';
    if (s.sub) html += '<p class="lead">'+s.sub+'</p>';
    if (s.brand) html += '<div class="brandline">'+s.brand+'</div>';
  } else if (s.t==='hook'){
    html += '<h2 class="big">'+s.big+'</h2>';
    if (s.body) html += '<p class="lead muted">'+s.body+'</p>';
  } else if (s.t==='framework'){
    html += '<h2>'+s.h2+'</h2>';
    if (s.lead) html += '<p class="lead">'+s.lead+'</p>';
    s.pillars.forEach(p=>{
      html += '<div class="pillar"><div class="n">'+p.n+'</div><div class="t"><b>'+p.title+'</b>'+p.line+'</div></div>';
    });
  } else if (s.t==='cta'){
    html += '<h2>'+s.h2+'</h2>';
    html += '<p class="cta-step">'+s.step+'</p>';
    html += '<div class="disclaimer">'+s.disclaimer+'</div>';
    if (s.brand) html += '<div class="brandline">'+s.brand+'</div>';
  } else {
    if (s.h2) html += '<h2>'+s.h2+'</h2>';
    if (s.body) html += '<p>'+s.body+'</p>';
  }
  html += '<div class="slidenum">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
