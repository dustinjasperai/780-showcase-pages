<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Signature Talk — Jessica Rasdall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffdfb;
    --panel:#faf4f8;
    --ink:#211b1f;
    --muted:#6b6168;
    --accent:#c61080;
    --deep:#632e8b;
    --rule:#ece3ea;
    --head:'Montserrat',system-ui,sans-serif;
    --body:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#efe8ec}
  body{font-family:var(--body);color:var(--ink);padding:28px 16px}
  .deck{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:60px 58px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden;
    box-shadow:0 1px 0 rgba(33,27,31,0.03);
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--accent),var(--deep))}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:33px;line-height:1.14;letter-spacing:-.01em}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);margin-top:18px;max-width:62ch}
  .sub{font-size:17px;color:var(--muted);margin-top:14px;font-style:italic}
  .by{font-family:var(--head);font-weight:600;font-size:15px;color:var(--deep);margin-top:34px;letter-spacing:.02em}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:14px;max-width:64ch}
  li{font-size:19px;line-height:1.45;padding-left:30px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .divider .kicker{font-size:13px}
  .divider h1{color:var(--deep)}
  .phase-no{font-family:var(--head);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase}
  .big{font-family:var(--head);font-weight:800;font-size:60px;color:var(--deep);line-height:1;margin:6px 0 20px}
  .quote h2{font-size:38px;color:var(--ink)}
  .quote .accentword{color:var(--accent)}
  .stat{font-family:var(--head);font-weight:800;color:var(--accent)}
  .cta .lead{font-size:20px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:30px;border-top:1px solid var(--rule);padding-top:16px;font-style:normal;max-width:68ch}
  .panel{background:var(--panel);border-radius:10px;padding:22px 26px;margin-top:22px}
  .n{font-size:14px;color:var(--muted);font-family:var(--head);position:absolute;right:26px;bottom:20px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', c:`<div class="kicker">A free live masterclass</div>
   <h1>The Signature Talk</h1>
   <p class="lead">How to turn your story into a talk that books clients, not just applause.</p>
   <div class="by">with Jessica Rasdall, The Public Speaking Strategist</div>`},
 {t:'promise', c:`<div class="kicker">What you'll walk away with</div>
   <h2>By the end of the next hour</h2>
   <ul>
     <li>Why most talks get compliments and no clients, and the one thing that changes it.</li>
     <li>The four phase Signature Framework that turns a talk into a decision.</li>
     <li>How to use the story you already have as the hook that makes the room lean in.</li>
   </ul>`},
 {t:'who', c:`<div class="kicker">Who this is for</div>
   <h2>You already speak, or you know you should</h2>
   <p class="lead">You are a creative entrepreneur or small business owner. You get on stages, podcasts, and workshops, or you want to. People tell you that you are good. It just is not turning into clients yet.</p>`},
 {t:'trap', c:`<div class="kicker">The moment</div>
   <h2>You nailed it. And then nothing happened.</h2>
   <p class="lead">You finished the talk. People clapped. Someone said "that was amazing." You went home proud, and your calendar stayed exactly as empty as it was before you walked on stage.</p>`},
 {t:'hook', c:`<div class="kicker">The reframe</div>
   <h2>A standing ovation is the most expensive form of <span class="accentword">silence</span>.</h2>
   <p class="lead">Applause feels like the win. It is not. A talk is not a performance you survive. It is a decision you lead the room toward.</p>`},
 {t:'divider1', c:`<div class="kicker">Part one</div><h1>Why great talks don't book clients</h1>`},
 {t:'problem', c:`<div class="kicker">Three reasons</div>
   <h2>It is not your delivery</h2>
   <ul>
     <li>You were taught to be interesting, not to move people to act.</li>
     <li>You teach everything you know, so the room leaves full and never needs you.</li>
     <li>There is no structure carrying a stranger from "who is this" to "I want her help."</li>
   </ul>`},
 {t:'realissue', c:`<div class="kicker">The real issue</div>
   <h2>You learned to perform. Nobody taught you to convert.</h2>
   <p class="lead">Confidence and polish are table stakes. The speakers who build a business from the stage are running a structure on purpose. That structure is learnable, and it is what the rest of this is about.</p>`},
 {t:'divider2', c:`<div class="kicker">Part two</div><h1>The Signature Framework</h1>`},
 {t:'frameworkoverview', c:`<div class="kicker">Four phases</div>
   <h2>A talk that sells moves in four steps</h2>
   <ul>
     <li>Hook them to the edge of their seat.</li>
     <li>Build the case.</li>
     <li>Serve from the stage.</li>
     <li>Leave a lasting impact.</li>
   </ul>
   <div class="sub">Miss one and the talk informs instead of enrolls.</div>`},
 {t:'phase1', c:`<div class="phase-no">Phase one</div><div class="big">Hook</div>
   <h2>Get them to the edge of their seat</h2>
   <p class="lead">Open on tension, not a teaching point. Make the room wonder where this is going before you explain a single thing. If you lose them in the first two minutes, nothing after it lands.</p>`},
 {t:'phase2', c:`<div class="phase-no">Phase two</div><div class="big">Build the case</div>
   <h2>Make the problem impossible to ignore</h2>
   <p class="lead">Before any solution, the room has to feel the cost of staying where they are. You are not stacking facts. You are building the reason this matters to them, today.</p>`},
 {t:'phase3', c:`<div class="phase-no">Phase three</div><div class="big">Serve</div>
   <h2>Teach the shift, not the whole playbook</h2>
   <p class="lead">Give them the one reframe that changes how they see the problem. Real value, generously. Serving from the stage is what earns the right to make an ask, and it is what most speakers skip straight past.</p>`},
 {t:'phase4', c:`<div class="phase-no">Phase four</div><div class="big">Impact</div>
   <h2>Leave them with a next step, not just a feeling</h2>
   <p class="lead">A lasting impact is a clear invitation. The room has felt the problem and seen the shift. Now you hand them the one thing to do next, and you make it easy to say yes.</p>`},
 {t:'story', c:`<div class="kicker">The thread that ties it together</div>
   <h2>Your story is the hook</h2>
   <p class="lead">The fastest way to the edge of their seat is the thing you have lived. Turn your mess into a message, and that message becomes the opening nobody else in your field can copy. It is the most distinctive asset you own.</p>`},
 {t:'divider3', c:`<div class="kicker">Part three</div><h1>When the Framework is running</h1>`},
 {t:'whatchanges', c:`<div class="kicker">The shift</div>
   <h2>The talk becomes a lead engine</h2>
   <p class="lead">Every stage, podcast, and workshop stops being a nice moment and starts filling the top of your funnel. The same talk, built on the Framework, works whether there are twelve people in the room or twelve hundred.</p>`},
 {t:'whyme', c:`<div class="kicker">Why listen to me</div>
   <h2>I have spent 17 years on this</h2>
   <ul>
     <li>Over <span class="stat">15,000</span> young adults heard my story before I ever charged for a word of it.</li>
     <li>Featured on ABC 20/20, Katie Couric, The Today Show, Netflix, and Good Morning America, and a best selling author.</li>
     <li>Clients I have coached on this Framework have seen on stage conversion rates as high as <span class="stat">97 to 100%</span>.</li>
   </ul>`},
 {t:'recap', c:`<div class="kicker">In one slide</div>
   <h2>Hook, build the case, serve, impact. On your story.</h2>
   <p class="lead">That is the difference between a talk people enjoy and a talk that books clients. The structure is simple. Running it on purpose is the work.</p>`},
 {t:'cta', c:`<div class="kicker">Your next step</div>
   <h2>Let's build your signature talk</h2>
   <p class="lead">If you want help turning your story into a talk that books clients, take the speaking strategy quiz and see where to start, or apply to work with us at thepublicspeakingstrategist.com.</p>
   <div class="by">Jessica Rasdall, The Public Speaking Strategist</div>
   <p class="disclaimer">This masterclass is for educational purposes only. No income or client result is guaranteed. Results vary and depend on your own effort, offer, and market.</p>`}
];

const d=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  const cls=s.t.startsWith('divider')?'slide divider':(s.t==='hook'?'slide quote':(s.t==='cta'?'slide cta':'slide'));
  el.className=cls;
  el.innerHTML=(s.c||'')+'<div class="n">'+(i+1)+' / '+S.length+'</div>';
  d.appendChild(el);
});
</script>
</body>
</html>
