<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run the Business, Not Just the Work — a masterclass for agency owners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#002c5f;        /* harvested dominant navy */
    --panel:#001f44;     /* darkened navy step */
    --rule:rgba(255,255,255,0.14);
    --accent:#5867dd;    /* harvested indigo */
    --ink:#eef1f6;
    --muted:#a9b6cd;
    --head:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto}
  .slide{
    position:relative;background:var(--bg);min-height:62vh;
    padding:64px 72px;border-bottom:1px solid var(--rule);
    display:flex;flex-direction:column;justify-content:center;gap:18px;
  }
  .kick{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent)}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.05;max-width:20ch}
  h2{font-family:var(--head);font-weight:600;font-size:32px;line-height:1.1;max-width:24ch}
  p{font-size:19px;line-height:1.55;color:var(--ink);max-width:62ch}
  .muted{color:var(--muted)}
  ul{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:6px}
  li{font-size:19px;line-height:1.45;padding-left:26px;position:relative;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;
    background:var(--accent);border-radius:2px}
  .tiles{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
  .tile{background:var(--panel);border:1px solid var(--rule);border-radius:10px;
    padding:20px 22px;min-width:200px;flex:1}
  .tile h3{font-family:var(--head);font-size:21px;font-weight:600;margin-bottom:6px}
  .tile p{font-size:15px;color:var(--muted)}
  .num{font-family:var(--head);color:var(--accent);font-weight:700;font-size:15px;
    letter-spacing:.12em}
  .big{font-size:58px;line-height:1.02}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);
    text-decoration-thickness:4px;opacity:.55}
  .foot{position:absolute;bottom:20px;left:72px;right:72px;display:flex;justify-content:space-between;
    font-size:12px;color:var(--muted);font-family:var(--head);letter-spacing:.08em}
  .disc{font-size:13px;color:var(--muted);max-width:70ch;margin-top:10px}
  @media(max-width:640px){.slide{padding:40px 28px}h1{font-size:32px}h2{font-size:24px}.big{font-size:38px}.foot{left:28px;right:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* Masterclass deck — Drew McLellan / Agency Management Institute.
   The coach teaching his own audience. No trace of ads strategy or any outside vendor. */
const S = [
  {t:'title', kick:'A live masterclass for agency owners',
    h:'Run the Business, Not Just the Work',
    p:'The money side of agency ownership: how to build an agency that is profitable, less dependent on you, and worth something the day you want to sell it.'},

  {t:'who', kick:'Who this is for',
    h:'The owner who is busy, respected, and quietly unsure',
    p:'You run a small-to-midsize agency. The work is good. Clients stay. And yet the bank balance never quite matches how hard everyone is working. This hour is for you.'},

  {t:'trap', kick:'The trap',
    h:'Busy became the plan',
    p:'Most agencies are run from the project list, not the P&L. We chase the next deadline, hire when we feel underwater, and tell ourselves a bigger month is coming. Revenue grows. The owner does not get freer or richer.'},

  {t:'reframe', kick:'The reframe',
    h:'"Busy" is not the same as "profitable"',
    p:'A fully booked agency can still be a poorly run business. Two agencies with the same revenue can have wildly different owner incomes. The difference is never talent. It is whether the owner leads from the numbers.'},

  {t:'part', num:'PART ONE', h:'The three questions most owners cannot answer',
    list:[
      'What is our AGI, and is it growing faster than our payroll?',
      'How much of our capacity are we actually billing?',
      'After everyone is paid, what is left for the owner, honestly?'
    ],
    p:'If any of these made you pause, that is the opportunity. Not a talent problem. A visibility problem.'},

  {t:'point', kick:'Why it happens',
    h:'Nobody trained you to run the business',
    p:'You were trained to do great creative, strategy, or client service. Then you became the owner, and the business side is learned the expensive way: through cash-flow scares and a draw that never grows. That gap is normal. It is also fixable.'},

  {t:'part', num:'PART TWO', h:'An agency owner’s financial command center',
    p:'This is the framework I teach agency owners every day. Four dials you watch instead of the project list. Together they turn a busy agency into a profitable, sellable one.'},

  {t:'tiles', kick:'The four dials',
    tiles:[
      {h:'AGI', p:'Agency gross income, what you keep after pass-through costs. The real top line to grow.'},
      {h:'Utilization', p:'How much of the team’s billable capacity is actually billed. Where margin leaks first.'},
      {h:'Owner profit', p:'What is left for you after a real salary. The number that says the business works.'},
      {h:'Sellability', p:'How little the agency depends on you day to day. What a buyer will one day pay for.'}
    ]},

  {t:'point', kick:'Dial one',
    h:'Grow AGI, not just revenue',
    p:'Revenue flatters you; AGI tells the truth. When you manage to AGI, you stop celebrating big invoices that are mostly media costs or subcontractors passing through, and start pricing for the value your team actually creates.'},

  {t:'point', kick:'Dial two',
    h:'Watch utilization before you hire',
    p:'The reflex when you feel underwater is to hire. Often the capacity is already there, just unbilled or aimed at the wrong work. Reading utilization first is how you protect margin and stop hiring away your own profit.'},

  {t:'point', kick:'Dial three',
    h:'Pay yourself first, on purpose',
    p:'A real owner salary plus a healthy profit is not greedy. It is the scoreboard. An agency that cannot pay its owner well is not a business yet; it is a demanding job you created for yourself.'},

  {t:'point', kick:'Dial four',
    h:'Build it to run without you',
    p:'The most valuable agency is the one that barely needs the founder in the room. Documented ways of working, a team that decides without you, clients loyal to the shop and not just to you. That is freedom now and a sale price later.'},

  {t:'report', kick:'How you keep score',
    h:'One dashboard, read every month',
    p:'You do not need to become an accountant. You need a simple report card you look at every month, the same few ratios each time, so trends show up while they are still cheap to fix.',
    list:[
      'Set a target for each of the four dials',
      'Read the actuals on the same day every month',
      'Fix the one dial that is furthest off, then repeat'
    ]},

  {t:'point', kick:'What changes',
    h:'From working in it to working on it',
    p:'When the numbers lead, the arguments get easier. Which clients to keep, when to raise prices, who to hire, what to say no to. The agency stops happening to you and starts answering to you.'},

  {t:'part', num:'PART THREE', h:'Your agency ninety days from now',
    p:'Not a new tool and not a reorg. The same agency, led from four dials and a monthly report card instead of the project list.'},

  {t:'point', kick:'The shift you feel',
    h:'A quieter month end',
    p:'Pricing conversations get easier because you know your real margins. You hire from capacity, not panic. You take a proper salary. And slowly the agency stops needing you in every room, which is the first thing a future buyer looks for.'},

  {t:'credibility', kick:'Why listen to me',
    h:'I have run this from both chairs',
    p:'I started my own agency in 1995 and still own it. For years through Agency Management Institute I have run owner peer groups and AMI’s annual Agency Edge research, so the benchmarks here are not theory; they are what hundreds of agencies actually look like under the hood.'},

  {t:'point', kick:'The honest part',
    h:'This is a discipline, not a hack',
    p:'No single tactic fixes an agency’s economics. Leading from these four dials, month after month, does. It is slower than a silver bullet and far more durable. Results vary with the work you put in; nothing here is guaranteed.'},

  {t:'cta', kick:'Your move as the owner',
    h:'Run your agency like the asset it is',
    p:'If you want help turning these four dials into your own monthly habit, with a room of non-competing owners doing the same, that is exactly what an AMI Owner Peer Group is for.',
    cta:'Next step: explore an AMI Owner Peer Group at agencymanagementinstitute.com',
    disc:'Educational content only. No income, revenue, or results are guaranteed; outcomes vary by agency, market, and effort. Figures discussed are illustrative, not promises.'}
];

const deck = document.getElementById('deck');
function esc(x){return x}
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.kick) inner += '<div class="kick">'+s.kick+'</div>';
  if (s.num) inner += '<div class="num">'+s.num+'</div>';
  if (s.t === 'title') inner += '<h1 class="big">'+s.h+'</h1>';
  else if (s.h && (s.t === 'part')) inner += '<h1>'+s.h+'</h1>';
  else if (s.h) inner += '<h2>'+s.h+'</h2>';
  if (s.p) inner += '<p>'+s.p+'</p>';
  if (s.list){ inner += '<ul>'; s.list.forEach(x => inner += '<li>'+x+'</li>'); inner += '</ul>'; }
  if (s.tiles){ inner += '<div class="tiles">'; s.tiles.forEach(t => inner += '<div class="tile"><h3>'+t.h+'</h3><p>'+t.p+'</p></div>'); inner += '</div>'; }
  if (s.cta) inner += '<p style="color:var(--accent);font-family:var(--head);font-weight:600;font-size:21px">'+s.cta+'</p>';
  if (s.disc) inner += '<p class="disc">'+s.disc+'</p>';
  inner += '<div class="foot"><span>Agency Management Institute</span><span>'+(i+1)+' / '+S.length+'</span></div>';
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
