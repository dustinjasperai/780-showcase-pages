<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The 4-Step Model Masterclass &middot; Peter Kourounis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F9F9F6; --panel:#EFEEE7; --rule:#DEDCD2;
    --acc:#D9720F; --deep:#14233B; --ink:#1F1F32; --dim:#5A5B6E; --paper:#FAF8F3;
  }
  html,body{height:100%}
  body{background:#EAE8DF;font-family:'IBM Plex Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#EAE8DF}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Fira Sans',-apple-system,sans-serif;font-weight:700;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.6vw;max-width:88%}
  .t-normal h1{font-size:2.75vw;max-width:84%}
  .t-normal .body{font-size:1.4vw;color:#3E3F52;margin-top:2.6vh;max-width:74%;line-height:1.56;font-weight:400}
  .sub{font-size:1.5vw;color:#3E3F52;margin-top:3.2vh;max-width:76%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'IBM Plex Sans',sans-serif;font-size:1.3vw;font-weight:600;color:var(--deep);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:3.85vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:linear-gradient(180deg,var(--deep) 0%,#0B1220 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.1vw;max-width:82%;font-style:italic;color:var(--paper)}
  .t-cta{background:linear-gradient(180deg,var(--deep) 0%,#0B1220 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.35vw;max-width:80%;color:var(--paper)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#FBE7D2;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .t-cta .disc{color:#CBD2DE}
  .motif{position:absolute;pointer-events:none;opacity:.9}
  .title-motif{right:7%;bottom:9%;width:11vw}
  .corner-motif{right:6%;bottom:7.5%;width:5.5vw;opacity:.6}
  .brandline{font-size:1.2vw;color:#3E3F52;margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(31,31,50,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.3vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.1vw}.t-dark h1{font-size:5.1vw}
    .t-cta h1{font-size:5.7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Sign Shop Consulting</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- growth-stair motif: an ascending bar mark tied to the 9-location scale-up story -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="stair" viewBox="0 0 200 160">
  <g fill="none" stroke-linecap="round">
    <rect x="20" y="120" width="26" height="30" fill="#14233B" opacity="0.22"/>
    <rect x="58" y="95" width="26" height="55" fill="#14233B" opacity="0.35"/>
    <rect x="96" y="65" width="26" height="85" fill="#14233B" opacity="0.5"/>
    <rect x="134" y="30" width="26" height="120" fill="#D9720F"/>
    <circle cx="147" cy="20" r="7" fill="#D9720F"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:"The 4-Step Model Masterclass",sub:"For sign and print shop owners, taught by the owner who scaled one shop to 9 franchised locations before FASTSIGNS bought the franchise rights.",brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You know money is leaking somewhere. You just can’t point to where.',body:'You run a good shop. Jobs go out the door, customers come back, the lights stay on. But at the end of the month the margin is thinner than it should be, and nobody can point to the exact place it went. That’s not a mystery. It’s four specific, fixable places, and most shops never name them.'},
 {t:'dark',title:'A shop doesn’t leak money in general. It leaks in four specific places.'},

 {t:'section',idx:'Part One',title:'The Four Places It Leaks'},
 {t:'normal',k:'Leak one: pricing',title:'Underpriced jobs quietly eat the whole month’s margin.',body:'A job that wins the bid but doesn’t protect margin isn’t a win, it’s a leak with a customer attached. Most shops price to win, not to profit, and never notice until the numbers are added up.'},
 {t:'normal',k:'Leak two: follow-up',title:'Weak lead follow-up loses jobs that were never actually lost.',body:'A lead that goes quiet isn’t always a lost cause. It’s often just a lead nobody followed up with on a real schedule. That’s not a marketing problem. It’s a process problem, and it’s fixable.'},
 {t:'normal',k:'Leak three and four: sales and production',title:'An inconsistent sales process and production that runs through you.',body:'When every rep sells a little differently, results depend on who picked up the phone. And when every job still needs you personally to move it forward, the shop can’t grow past what you can personally touch.'},
 {t:'dark',title:'You don’t fix a leak by working harder. You fix it by naming exactly where it is.'},

 {t:'section',idx:'Part Two',title:'The 4-Step Model, Named'},
 {t:'normal',k:'The four steps',title:'Marketing. Execution of Leads. Sales. Execution of Jobs.',body:'One model, four stages, each one a place revenue either moves forward or leaks out. Marketing brings people in. Execution of Leads turns them into booked jobs. Sales makes the process repeatable. Execution of Jobs is where the job actually gets priced and delivered for real margin.'},
 {t:'normal',k:'Pricing for real margin',title:'The fix for leak one lives inside Execution of Jobs.',body:'A pricing approach built to protect margin on every job, not just win the next bid. Once it’s a system instead of a gut call, the leak closes.'},
 {t:'normal',k:'A repeatable sales process',title:'One process, followed by everyone, not a personality-dependent pitch.',body:'When the sales process is written down and followed the same way every time, results stop depending on which rep answered the phone that day.'},
 {t:'dark',title:'You don’t fix a shop by hiring smarter people. You fix it by giving them a system they can’t improvise their way around.'},

 {t:'section',idx:'Part Three',title:'What Running On The Model Looks Like'},
 {t:'normal',k:'The number, seen early',title:'A shop running the model catches a leak while it’s still small.',body:'Instead of finding out at month end that jobs have been quietly underpriced for weeks, the pricing system flags it as it happens, while it’s still a small correction, not a quarter of thin margins.'},
 {t:'normal',k:'Why Peter Kourounis',title:'He ran this inside his own shop before he taught it to anyone else.',body:'Peter built SignMeUp from one location into 9 franchised locations across 3 states, then sold the franchise rights to FASTSIGNS International. This is the same model that made that scale possible, not theory borrowed from outside the trade.'},

 {t:'section',idx:'Your Next Step',title:'Find Your Own Leaks'},
 {t:'normal',k:'Weekly Coaching',title:'Four Zoom calls a month, KPI reviews across every business segment.',body:'Ongoing accountability on the 4-Step Model applied to your own shop, month over month, not a one-time diagnostic that gets filed away.'},
 {t:'normal',k:'Start with a free consult',title:'A short conversation to see where your shop’s leaks actually are.',body:'No pressure, no pitch deck. Just a quick, free consult about where the model above would apply first to your specific shop.'},
 {t:'cta',title:'Ready to find your shop’s leaks?',chips:['Book a Free Consult','Ask About Weekly Coaching'],disc:'Educational content for sign and print shop owners. No income or business result is guaranteed. Results vary by shop, market, and execution.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#stair"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Sign Shop <b>Consulting</b> &middot; Peter Kourounis</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=motif(s.arc);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
