<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 7 Types of Rest — A Masterclass with Dr. Saundra Dalton-Smith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241a17;        /* deep warm espresso, darkened from her #5b2f2c brown ground */
    --panel:#33241f;     /* panel */
    --rule:#4a362f;      /* hairline rule */
    --accent:#7f022b;    /* deep wine — from brand.json ranked_colors */
    --camel:#bc9978;     /* warm camel — from site SVG fills */
    --ink:#f3ece3;       /* warm off-white text */
    --muted:#c9b6a8;     /* muted warm */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:48px 44px;margin:0 0 22px;min-height:380px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:'Inter';font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--camel);margin-bottom:16px}
  h1{font-family:'Fahkwang';font-weight:600;font-size:46px;line-height:1.08;margin-bottom:18px}
  h2{font-family:'Fahkwang';font-weight:600;font-size:32px;line-height:1.14;margin-bottom:16px}
  p{font-size:19px;line-height:1.55;color:var(--ink);max-width:62ch;margin-bottom:12px}
  p.lead{font-size:22px;color:var(--muted)}
  .kicker{font-family:'Fahkwang';font-size:15px;color:var(--camel);margin-top:20px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:9px 0 9px 26px;position:relative;max-width:62ch}
  li::before{content:"";position:absolute;left:0;top:18px;width:9px;height:9px;border-radius:50%;
    background:var(--accent)}
  .num{font-family:'Fahkwang';font-size:14px;color:var(--camel);border:1px solid var(--rule);
    border-radius:999px;padding:4px 12px;display:inline-block;margin-bottom:16px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .cta-step{font-family:'Fahkwang';font-size:21px;color:var(--camel);margin-top:12px}
  .presenter{font-size:16px;color:var(--muted);margin-top:26px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass', h:'The 7 Types of Rest',
   lead:'Why you are still exhausted after a full night of sleep, and the framework that fixes the right kind of tired.',
   presenter:'With Dr. Saundra Dalton-Smith, board-certified physician and creator of the 7 Types of Rest'},

  {t:'content', eyebrow:'Who this is for', h:'You did everything right, and you are still running on empty',
   body:['You sleep. You take the vacation. You book the massage. And within a week the heavy, foggy, irritable tired is back.',
         'This is for coaches, wellness professionals, and leaders who keep meeting that same exhaustion in themselves, and in the people they serve.']},

  {t:'content', eyebrow:'The reframe', h:'Being tired is not a sleep problem',
   body:['We were taught that rest means one thing: sleep. So when sleep does not fix it, we assume something is wrong with us.',
         'Nothing is wrong with you. You are resting in one category and running a deficit in the others.']},

  {t:'section', num:'Part One', h:'The single-rest trap',
   body:['When rest means only sleep, every other kind of depletion has nowhere to go.']},

  {t:'content', eyebrow:'The cost', h:'What a rest deficit actually looks like',
   body:['It shows up as brain fog that coffee cannot lift, resentment you cannot explain, creativity that has gone quiet, and a body that aches without a reason.',
         'People push harder, sleep more, and feel worse, because more of the wrong rest never repays the real debt.']},

  {t:'section', num:'Part Two', h:'The 7 Types of Rest',
   body:['Seven distinct restorative needs. Most people are depleted in six of them and only know how to fix one.']},

  {t:'type', num:'Rest 1', h:'Physical rest',
   body:['Passive recovery like sleep and napping, plus active recovery like stretching, breathwork, and relaxation.'],
   tell:'The tell: you sleep enough hours and still wake up sore and heavy.'},

  {t:'type', num:'Rest 2', h:'Mental rest',
   body:['Quieting a mind stuck in constant thinking, problem-solving, and decision-making.'],
   tell:'The tell: you lie down exhausted and your brain will not stop narrating.'},

  {t:'type', num:'Rest 3', h:'Emotional rest',
   body:['Having the space to feel and express honestly, without performing or managing everyone else first.'],
   tell:'The tell: you are the strong one for everybody and have nowhere to set it down.'},

  {t:'type', num:'Rest 4', h:'Spiritual rest',
   body:['A deep sense of belonging, love, purpose, and connection to something beyond the to-do list.'],
   tell:'The tell: you are productive and still feel strangely empty.'},

  {t:'type', num:'Rest 5', h:'Social rest',
   body:['Time with the people who pour back into you, instead of only the people who draw from you.'],
   tell:'The tell: you are surrounded by people and still feel drained by them.'},

  {t:'type', num:'Rest 6', h:'Sensory rest',
   body:['Relief from the constant input of screens, bright light, noise, and three conversations at once.'],
   tell:'The tell: by evening you crave a dark, silent room more than anything else.'},

  {t:'type', num:'Rest 7', h:'Creative rest',
   body:['Renewing inspiration and wonder through beauty, nature, art, and spaces that let you imagine again.'],
   tell:'The tell: every idea feels forced and nothing excites you the way it used to.'},

  {t:'section', num:'Part Three', h:'Find the deficit, not the symptom',
   body:['You do not need more rest. You need the right kind.']},

  {t:'content', eyebrow:'The method', h:'Rest Deficit Analysis',
   body:['Instead of chasing symptoms, you diagnose which of the seven types is actually depleted, then build a plan that restores that one first.',
         'Fix the right deficit and the fog, the resentment, and the flatness lift together, usually faster than people expect.']},

  {t:'content', eyebrow:'What changes', h:'Rested in a way sleep alone never gave you',
   body:['Energy that survives a hard week. Focus that returns without a fight. Feeling like yourself in your own life again.',
         'And for the people you coach and lead, a language for exhaustion that finally explains what they have been feeling.']},

  {t:'content', eyebrow:'Why this framework', h:'Built by a physician, not a trend',
   body:['Dr. Saundra Dalton-Smith is a board-certified internal medicine physician and work-life integration researcher.',
         'The 7 Types of Rest grew out of clinical practice and research, reached millions through a TEDx talk and the bestseller Sacred Rest, and is now taught inside organizations worldwide.']},

  {t:'content', eyebrow:'The opportunity', h:'This is teachable, and your clients need it',
   body:['The reason most wellbeing advice fails is that it treats rest as one thing. The seven-type model gives you a diagnostic and a plan.',
         'If helping people recover the right kind of rest is the work you want to do, there is a path to teach this framework under license.']},

  {t:'cta', eyebrow:'Your next step', h:'Become a Certified 7 Types of Rest Facilitator',
   step:'Book a call to join the next certification cohort and bring the 7 Types of Rest to the people you serve.',
   disclaimer:'This masterclass is educational. The 7 Types of Rest is a wellbeing framework and is not medical, psychological, or mental-health treatment, and it is not a substitute for care from a licensed professional. No specific outcome, income, or result is promised or guaranteed; individual results vary.'}
];

const deck = document.getElementById('deck');
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.eyebrow) html += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num) html += `<span class="num">${s.num}</span>`;
  if(s.t==='title'){
    html += `<h1>${s.h}</h1>`;
    if(s.lead) html += `<p class="lead">${s.lead}</p>`;
    if(s.presenter) html += `<div class="presenter">${s.presenter}</div>`;
  } else {
    html += `<h2>${s.h}</h2>`;
  }
  if(s.body){ for(const b of s.body) html += `<p>${b}</p>`; }
  if(s.tell) html += `<div class="kicker">${s.tell}</div>`;
  if(s.step) html += `<div class="cta-step">${s.step}</div>`;
  if(s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
