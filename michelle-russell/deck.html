<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retirement Rescue - A BNB-Boss Masterclass with Michelle Russell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8eef7;        /* light tint of brand blue #0051c3, from Palette */
    --panel:#fbfcff;
    --rule:#e3ddd1;
    --ink:#0f2a44;       /* deep navy ink */
    --muted:#5b7fa6;     /* blue-slate secondary */
    --accent:#0051c3;    /* brand blue, brand.json ranked_colors */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(15,42,68,.03)}
  .slide.title{background:var(--ink);color:#fff;border-color:var(--ink)}
  .slide.dark{background:var(--ink);color:#f3f6fb;border-color:var(--ink)}
  .eyebrow{font-family:"DM Sans";font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  .slide.title .eyebrow,.slide.dark .eyebrow{color:#7fb0ff}
  h1{font-family:"DM Serif Display";font-weight:400;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"DM Serif Display";font-weight:400;font-size:38px;line-height:1.1;margin-bottom:16px}
  .lede{font-size:21px;line-height:1.5;color:var(--muted);max-width:30em}
  .slide.title .lede,.slide.dark .lede{color:#b9cae2}
  p{font-size:19px;line-height:1.55;max-width:34em;margin-bottom:14px}
  ul{list-style:none;margin:10px 0 0}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.5;margin-bottom:14px;max-width:34em}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:2px;background:var(--accent)}
  .doors{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
  .door{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:22px}
  .door .n{font-family:"DM Serif Display";font-size:30px;color:var(--accent)}
  .door h3{font-size:19px;margin:6px 0 8px}
  .door p{font-size:16px;color:var(--muted);margin:0}
  .kicker{font-size:17px;color:var(--muted);margin-top:18px}
  .foot{font-size:14px;color:var(--muted);margin-top:26px;max-width:40em;line-height:1.5}
  .cta-steps{font-size:19px;line-height:1.5;margin-top:8px}
  .pres{margin-top:30px;font-size:17px;color:#b9cae2}
  .pres b{color:#fff;font-weight:700}
  @media(max-width:720px){.slide{padding:34px 26px;min-height:0}h1{font-size:38px}h2{font-size:30px}.doors{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", eyebrow:"A BNB-Boss Masterclass", h:"Retirement Rescue",
   lede:"How to build a short-term rental income floor that replaces your paycheck.",
   pres:"With <b>Michelle Russell</b>, founder of The Prosperity Process and host of BNB-Boss"},

  {t:"promise", eyebrow:"What you will walk away with",
   h:"A plan, not a pep talk",
   bullets:["The three ways into short-term rentals, including the two that need no property of your own",
            "How to pick the door that fits the cash and the time you actually have",
            "Why corporate and mid-term stays steady the income most hosts leave on the table",
            "What a realistic first 90 days looks like"]},

  {t:"plain", eyebrow:"Who this is for",
   h:"You did the right things, and the math still does not add up",
   p:["You worked, you saved, you were careful. Then you ran the retirement numbers and the gap was bigger than anyone warned you about.",
      "The usual answer is save harder and wait longer. For a lot of people that answer ran out of road years ago."]},

  {t:"dark", eyebrow:"The reframe",
   h:"A second job is not a retirement plan",
   p:["Trading more hours for more money does not fix a retirement gap. It just moves the exhaustion forward.",
      "What closes the gap is income that keeps paying after you stop clocking in. That is a different kind of asset, and you can start building it now."]},

  {t:"plain", eyebrow:"Part one - the core problem",
   h:"Saving alone is too slow on its own",
   p:["A savings balance grows in a straight line. It depends entirely on how much you can set aside and how many years you have left.",
      "An income floor is different. It is money that arrives every month from an asset you control, whether or not you worked that month."]},

  {t:"plain", eyebrow:"The question that changes everything",
   h:"Stop asking how much you have saved",
   p:["Start asking a better question: how much dependable monthly income can you build between now and the day you want to stop working?",
      "That is the number that actually decides whether you can retire. And short-term rentals are one of the fastest honest ways to move it."]},

  {t:"plain", eyebrow:"Part two - the method",
   h:"The Prosperity Process",
   p:["This is the step-by-step path I teach: treat short-term rental income as a repeatable process, not a lucky break or a hustle you have to babysit.",
      "It starts by choosing your door in, builds a single property or contract that works, then repeats the pattern until the income floor is tall enough to stand on."]},

  {t:"doors", eyebrow:"The three doors in",
   h:"You have more than one way to start",
   doors:[{n:"1", h:"Arbitrage", p:"Lease a unit, then rent it short-term. No purchase, no mortgage."},
          {n:"2", h:"Co-hosting", p:"Run other owners' listings for a share of the revenue. No property at all."},
          {n:"3", h:"Ownership", p:"Buy a property and self-manage it for the full upside."}],
   kicker:"Two of the three doors need no property of your own. That is the part most people never hear."},

  {t:"plain", eyebrow:"Door one",
   h:"Arbitrage, in plain terms",
   p:["You lease a property the normal way, with the landlord's permission to rent it short-term, then you furnish it and host it.",
      "Your job is the deal and the guest experience. The biggest lever is learning to find and negotiate the right unit with the right landlord, which is a skill, not luck."]},

  {t:"plain", eyebrow:"Door two",
   h:"Co-hosting, in plain terms",
   p:["Plenty of owners have a property and no desire to manage it. Co-hosting means you run the listing, the pricing, and the guests, and you keep a share.",
      "It is the lowest-cost door in. You are selling your management, not your capital, so you can start while you learn the rest."]},

  {t:"plain", eyebrow:"Door three",
   h:"Ownership, in plain terms",
   p:["When you own the property you keep the full income and the appreciation. It asks for more capital up front and more patience.",
      "This is usually the door people grow into once the first two have funded it, not the one they have to start with."]},

  {t:"plain", eyebrow:"Choosing",
   h:"Pick the door that fits your cash and your time",
   p:["There is no best door. There is the door that matches what you have today.",
      "Short on cash and rich on time, co-host. Some cash and some time, arbitrage. Capital ready and patient, own. We map yours in the session."]},

  {t:"plain", eyebrow:"The part most hosts miss",
   h:"Corporate and mid-term stays steady the income",
   p:["Nightly vacation bookings swing with the season and the calendar. Corporate and traveling-professional guests book for weeks or months.",
      "Blending mid-term stays into the mix trades a little peak-night upside for occupancy you can count on, which is exactly what an income floor needs."]},

  {t:"plain", eyebrow:"Part three - what it looks like",
   h:"An income floor you can stand on",
   p:["One working property or contract is proof. A handful of them, run on the same pattern, is a floor that pays whether or not you show up that month.",
      "That is the whole point of Retirement Rescue. Not a windfall, a floor. Built on purpose, kept on purpose."]},

  {t:"dark", eyebrow:"Why listen to me",
   h:"I have been in this for decades",
   p:["I am Michelle Russell, founder of The Prosperity Process, an investor, author and speaker. I host the BNB-Boss and Short Term Rental Revenue podcasts.",
      "I built this teaching the long way, through real short-term and long-term rentals, so that people from every walk of life could build income that outlasts a paycheck."]},

  {t:"plain", eyebrow:"The myths to drop",
   h:"What stops most people is not money",
   bullets:["You do not need to buy a property to start. Two of the three doors prove it.",
            "You do not need a dozen units. You need one that works, then the pattern.",
            "You do not need to be young. You need dependable income, and that has no age limit."]},

  {t:"plain", eyebrow:"Your first 90 days",
   h:"Where to actually begin",
   bullets:["Choose your door based on your real cash and time, not a fantasy version",
            "Get one unit, contract, or co-hosting client live and hosting",
            "Blend in a mid-term or corporate stay to steady the occupancy",
            "Run the same pattern again, and let the floor start to rise"]},

  {t:"cta", eyebrow:"Your next step",
   h:"Build your income floor with me",
   p:["If today connected some dots, the next step is to keep building with support instead of alone.",
      "Start with a course track that matches your door, or join the Monthly Mastermind to build it with me every month."],
   disclaimer:"This masterclass is educational and is not financial, investment, legal, or tax advice. No specific income or result is guaranteed. Results vary based on your market, your effort, local rules, and factors outside anyone's control."}
];

const deck = document.getElementById("deck");
for (const s of S){
  const el = document.createElement("section");
  el.className = "slide " + (s.t==="title"?"title":(s.t==="dark"?"dark":(s.t==="cta"?"cta":"")));
  let html = "";
  if (s.eyebrow) html += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.t==="title"){ html += `<h1>${s.h}</h1>`; if(s.lede) html += `<div class="lede">${s.lede}</div>`; if(s.pres) html += `<div class="pres">${s.pres}</div>`; }
  else { html += `<h2>${s.h}</h2>`; }
  if (s.p) for (const para of s.p) html += `<p>${para}</p>`;
  if (s.bullets){ html += "<ul>"; for(const b of s.bullets) html += `<li>${b}</li>`; html += "</ul>"; }
  if (s.doors){ html += '<div class="doors">'; for(const d of s.doors) html += `<div class="door"><div class="n">${d.n}</div><h3>${d.h}</h3><p>${d.p}</p></div>`; html += "</div>"; }
  if (s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if (s.disclaimer) html += `<div class="foot">${s.disclaimer}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
</content>
