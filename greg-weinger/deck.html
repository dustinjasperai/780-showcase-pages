<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 3 Moments That Determine Advancement — Greg Weinger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f0e6;        /* cream ground, lightened from brand #f3e6d8 */
    --panel:#efe7d8;     /* warm off-white panel */
    --ink:#3b3429;       /* espresso, brand dominant */
    --ink2:#6b4423;      /* saddle brown, brand secondary */
    --accent:#e2b13c;    /* gold, brand button color */
    --rule:#d8cab2;
    --muted:#7a6f5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Lora",Georgia,serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }
  .deck{width:min(960px,94vw)}
  .slide{
    display:none;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:64px 66px;
    min-height:560px;
    position:relative;
    box-shadow:0 18px 50px rgba(59,52,41,.10);
  }
  .slide.active{display:flex;flex-direction:column;justify-content:center}
  .kicker{
    font-family:"Jost",system-ui,sans-serif;
    text-transform:uppercase;letter-spacing:.22em;font-size:12.5px;font-weight:600;
    color:var(--ink2);margin-bottom:22px;display:flex;align-items:center;gap:12px;
  }
  .kicker::before{content:"";width:34px;height:2px;background:var(--accent);display:inline-block}
  h1{font-family:"Jost",system-ui,sans-serif;font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:"Jost",system-ui,sans-serif;font-weight:600;font-size:34px;line-height:1.14;margin-bottom:18px}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:40ch}
  .lead.wide{max-width:52ch}
  p.body{font-size:18.5px;line-height:1.55;color:var(--ink);max-width:48ch;margin-top:14px}
  .sub{font-size:16px;color:var(--muted);margin-top:26px;font-style:italic}
  .big{font-family:"Jost",system-ui,sans-serif;font-weight:700;font-size:60px;line-height:1;color:var(--accent);margin-bottom:10px}
  ul{list-style:none;margin-top:10px}
  ul li{font-size:19px;line-height:1.4;padding:14px 0 14px 34px;position:relative;border-top:1px solid var(--rule);max-width:50ch}
  ul li:first-child{border-top:none}
  ul li::before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;background:var(--accent);border-radius:50%}
  ul li b{font-family:"Jost",system-ui,sans-serif;font-weight:600}
  .num{font-family:"Jost",system-ui,sans-serif;font-weight:700;font-size:15px;color:var(--ink2);letter-spacing:.14em}
  .moment h2{margin-top:6px}
  .title-slide h1{font-size:54px;max-width:18ch}
  .byline{font-family:"Jost",system-ui,sans-serif;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:34px}
  .cta-slide{text-align:left}
  .disclaimer{position:absolute;left:66px;right:66px;bottom:26px;font-size:12.5px;color:var(--muted);line-height:1.45;font-style:italic}
  .foot{position:absolute;right:30px;bottom:22px;font-family:"Jost",system-ui,sans-serif;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;font-family:"Jost",system-ui,sans-serif}
  .nav button{background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit}
  .nav button:disabled{opacity:.35;cursor:default}
  .count{font-size:13px;color:var(--ink2);letter-spacing:.1em}
  .accentword{color:var(--ink2);font-style:italic}
</style>
</head>
<body>
  <div class="deck" id="deck"></div>
  <div class="nav">
    <button id="prev">Prev</button>
    <span class="count" id="count"></span>
    <button id="next">Next</button>
  </div>
<script>
const S = [
  {t:'title', kicker:'A masterclass for introverted leaders', h1:'The 3 Moments That Determine Advancement', sub:'How introverted leaders get promoted without pretending to be someone else.', byline:'Greg Weinger · Powerful Introvert'},

  {t:'point', kicker:'Who this is for', h2:'You do the best work in the room.', body:'And you have watched someone louder get promoted for it. You are the manager or senior individual contributor who thinks carefully, writes clearly, and goes quiet in the meeting where it counts. You are not short on talent. You are short on a way to be seen for it.'},

  {t:'point', kicker:'The trap', h2:'You have been handed the wrong fix.', body:'Be more confident. Develop executive presence. Speak up more. So you push against your own nature, perform a version of yourself that drains you, and the promotion still goes to someone else. The advice was never built for how you actually work.'},

  {t:'hook', kicker:'The reframe', big:'Not a confidence problem.', h2:'A strategy problem.', body:'Being overlooked as an introvert is not a personal flaw you need to fix. It is a system mismatch. The system rewards visibility, and no one ever taught you how to be visible on quiet terms. That is learnable. Performing extroversion is not the answer, and it never was.'},

  {t:'part', num:'PART ONE', h1:'The System Mismatch', sub:'The three lies the system tells introverted leaders.'},

  {t:'point', kicker:'Lie one', h2:'“Just be more confident.”', body:'Confidence is not what gets noticed. Decision makers do not promote a feeling. They promote evidence delivered at the right time. You can feel calm and still be invisible, or feel nervous and still make your case. Confidence is a byproduct of the right play, not the price of entry.'},

  {t:'point', kicker:'Lie two', h2:'“Develop executive presence.”', body:'Presence as performance is exhausting, and people can feel the effort. When you borrow someone else\'s style, you read as a copy rather than a leader. Your real presence comes from depth and judgment, the two things you already have, used where they are visible.'},

  {t:'point', kicker:'Lie three', h2:'“Speak up more.”', body:'Volume without the right moment is noise. Talking more does not build a case, it dilutes one. The leaders who get promoted are not the ones who say the most. They are the ones who say the decisive thing in the moment that counts.'},

  {t:'list', kicker:'The full map', h2:'Four things holding introverted leaders back', items:[
    ['Invisibility','Your best thinking happens before and after the meeting, where no one sees it.'],
    ['Translation','You do the work but never put language around its value, so others take the credit for naming it.'],
    ['Timing','You wait for the perfect, complete answer and miss the window where input actually moves the decision.'],
    ['Self-cost','You spend your energy imitating extroverts, which leaves nothing for the work that is actually yours to do.']
  ]},

  {t:'part', num:'PART TWO', h1:'The 3 Moments That Determine Advancement', sub:'A visibility system built on preparation, precision, and depth. No performing. No becoming someone else.'},

  {t:'moment', num:'MOMENT ONE', h2:'Preparation', body:'Advancement is decided before the room, not inside it. You turn your quiet strength, the thinking you already do alone, into a prepared point of view that is ready the instant it is needed. Introverts win the preparation moment by default once they stop treating it as homework and start treating it as the work.'},

  {t:'moment', num:'MOMENT TWO', h2:'Precision', body:'You do not need to say more. You need to say the one thing that changes the decision, at the moment it is still open. Precision is the introvert\'s native advantage: fewer words, higher signal, placed where it lands. This is how a quiet person becomes the most memorable voice in the meeting.'},

  {t:'moment', num:'MOMENT THREE', h2:'Depth', body:'Over weeks and months, depth compounds into a reputation. When your contributions are consistently the most considered ones, people stop needing you to be loud. They come to you. Depth is the moment that turns a single good meeting into the case for a promotion.'},

  {t:'point', kicker:'The thesis', h2:'You are not running the wrong race. You are running the wrong play.', body:'Preparation, precision, and depth are not consolation prizes for people who cannot network. They are the actual levers of advancement, and they are the ones you are already built for. The goal is never to become someone else. It is to be seen, fully, as who you already are.'},

  {t:'part', num:'PART THREE', h1:'The Same You, Finally Seen', sub:'The same person, the same strengths, now visible where it counts.'},

  {t:'list', kicker:'The shift', h2:'Before and after', items:[
    ['Before','Best idea arrives the morning after the meeting, in an email no one reads.'],
    ['After','A prepared point of view, ready in the room, delivered in two precise sentences.'],
    ['Before','Energy spent imitating the loudest person, and running on empty by Thursday.'],
    ['After','Energy spent on the work only you can do, and a reputation that speaks before you do.']
  ]},

  {t:'point', kicker:'Why listen to me', h2:'I spent 25 years doing this the hard way.', body:'I rose to the executive level of software companies as an introvert, most of those years in denial about it. For the past two years I have interviewed the most effective introverted leaders I could find on The Introverted Leader podcast. This masterclass is the strategy I wish someone had handed me at the start.'},

  {t:'point', kicker:'The path', h2:'The 90-Day Promotion Sprint', body:'When you want to run this for real, I work with a small number of people one to one: four calls over ninety days to build your case for promotion and make it with confidence. It is the three moments, applied to your actual situation, your actual role, and your actual next conversation.'},

  {t:'cta', kicker:'Your next move', h1:'Ready to run the right play?', body:'The next step is a single conversation. Tell me what is going on at work, and we will map where your three moments are hiding and how to make them count. No performing required.', sub:'Start by telling me where you are stuck.', disclaimer:'This masterclass is educational. No promotion, raise, or specific result is guaranteed. Results vary based on your own situation, role, and effort.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (i===0?' active':'') + (s.t==='title'?' title-slide':'') + (s.t==='moment'?' moment':'') + (s.t==='cta'?' cta-slide':'');
  let html = '';
  if(s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if(s.num) html += `<div class="num">${s.num}</div>`;
  if(s.big) html += `<div class="big">${s.big}</div>`;
  if(s.h1) html += `<h1>${s.h1}</h1>`;
  if(s.h2) html += `<h2>${s.h2}</h2>`;
  if(s.items){
    html += '<ul>';
    s.items.forEach(it=> html += `<li><b>${it[0]}.</b> ${it[1]}</li>`);
    html += '</ul>';
  }
  if(s.body) html += `<p class="body wide">${s.body}</p>`;
  if(s.sub && s.t!=='title') html += `<div class="sub">${s.sub}</div>`;
  if(s.t==='title'){ html += `<div class="sub">${s.sub}</div>`; html += `<div class="byline">${s.byline}</div>`; }
  if(s.disclaimer){ html += `<div class="disclaimer">${s.disclaimer}</div>`; }
  html += `<div class="foot">Powerful Introvert</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});

let idx = 0;
const slides = [...document.querySelectorAll('.slide')];
const count = document.getElementById('count');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
function show(n){
  idx = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,i)=> s.classList.toggle('active', i===idx));
  count.textContent = (idx+1) + ' / ' + slides.length;
  prev.disabled = idx===0; next.disabled = idx===slides.length-1;
}
prev.onclick = ()=>show(idx-1);
next.onclick = ()=>show(idx+1);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(idx+1);
  if(e.key==='ArrowLeft') show(idx-1);
});
show(0);
</script>
</body>
</html>
