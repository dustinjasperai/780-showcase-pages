<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Keys to Happiness in VetMed · Dr. Cari Wise, DVM · Joyful DVM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f8fb; --panel:#eef3f8; --rule:#dce6f0;
    --acc:#0a5c9e; --green:#1f5b39; --ink:#12314f; --body:#3d4a58; --dim:#8fa2b4; --cream:#eef5fb;
  }
  html,body{height:100%}
  body{background:#e6edf4;font-family:'Raleway',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e6edf4}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Raleway',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:.004em}
  .t-title h1{font-size:5.9vw;max-width:95%;font-weight:700}
  .t-normal h1{font-size:3.8vw;max-width:92%;font-weight:600}
  .t-normal .body{font-family:'Raleway',sans-serif;font-size:1.36vw;color:var(--body);margin-top:3.0vh;max-width:78%;line-height:1.62;font-weight:400}
  .sub{font-family:'Playfair Display',serif;font-size:2.3vw;color:var(--acc);margin-top:3.2vh;max-width:88%;line-height:1.34;font-weight:600;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.1vw;font-weight:700;color:var(--green);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.2vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#0d2a45 0%,#08192b 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.3vw;max-width:88%;color:var(--cream);font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#0d2a45 0%,#08192b 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.5vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Raleway',sans-serif;color:#cfe0ee;font-size:1.36vw;margin-top:3vh;max-width:74%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:7.5%;bottom:9%;width:18vw;opacity:.9}
  .corner-mo{right:6.5%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-family:'Raleway',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(10,92,158,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9.4vw}.t-normal h1{font-size:6.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.8vw}.t-section h1{font-size:8.2vw}.t-dark h1{font-size:6.8vw}
    .t-cta h1{font-size:7.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Joyful DVM</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a clinical pulse line that steadies and lifts into an upward arc, drawn in brand blue -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 140 120">
  <g fill="none" stroke="#0a5c9e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 84 L34 84 L42 60 L52 100 L62 72 L72 84 L86 84" opacity="0.85"/>
    <path d="M86 84 Q108 84 128 40" opacity="0.55"/>
    <circle cx="128" cy="40" r="5" fill="#1f5b39" stroke="none" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Keys to Happiness in VetMed',sub:'A live masterclass for veterinary professionals on staying in a career you love, without losing yourself to it.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You went into veterinary medicine to help animals. Nobody warned you how much the job would ask of you.',body:'You are the vet, the tech, or the manager who still cares deeply, and who is also tired in a way sleep does not fix. The angry client, the packed board, the case that did not go the way you wanted. This hour is not about pushing through any of it harder. It is about changing your relationship to all of it.'},
 {t:'dark',title:'Burnout in VetMed is rarely about the hours. It is about what we believe those hours mean.'},

 {t:'section',idx:'Part One',title:'Why VetMed Wears Good People Down'},
 {t:'normal',k:'The story underneath the exhaustion',title:'The exhaustion is real. The story we tell about it is what makes it feel permanent.',body:'Two people can work the same shift, see the same difficult client, and walk out feeling completely differently. The events are the same. What differs is the meaning each person gave them. When the meaning is "this is being done to me," every hard day stacks into evidence that the career itself is the problem.'},
 {t:'normal',k:'The trap of waiting',title:'Most advice tells you to wait for the schedule, the practice, or the people to change.',body:'So you wait. You wait for a lighter caseload, a better boss, a kinder client base. Sometimes those things improve, and you feel better for a while. But the relief is always on loan, because it depends on circumstances you do not control. There is a version of this that does not require anything outside of you to change first.'},
 {t:'dark',title:'There are no victims in VetMed. That is not a criticism. It is the most freeing sentence in this whole hour.'},

 {t:'section',idx:'Part Two',title:'The Three Keys'},
 {t:'normal',k:'Key one, own your emotion',title:'Your feelings come from your thoughts, not from the client in room three.',body:'The client did not make you anxious. The board did not make you dread the day. A thought about them did, and thoughts can be examined. When you learn to see the thought sitting between the event and the feeling, you get the one thing burnout convinces you that you have lost: a choice in how you experience your own day.'},
 {t:'normal',k:'Key two, drop the victim identity',title:'The packed schedule and the hard client are neutral events. You are the one who assigns them meaning.',body:'This is not about blame, and it is not about pretending the day was easy. It is about taking back authorship. The moment a difficult shift stops being something happening TO you and becomes something you are interpreting, you move from stuck to able to respond. That shift is the whole game.'},
 {t:'normal',k:'Key three, become empowered',title:'Your only job is to keep making the next right decision for you.',body:'Empowerment in VetMed is not a motivational poster. It is boundaries you actually hold, hard conversations you stop avoiding, and a definition of your worth that is not up for a vote from your caseload. You do not have to fix your whole career this week. You have to make the next honest choice, and then the one after that.'},
 {t:'normal',k:'The tool underneath',title:'The lever for all three keys is perspective, and the practice is the high value conversation.',body:'What you focus on, you create more of. Perspective is what calibrates your entire emotional experience of this work, so it is where we start. Then it gets concrete: the raise you have not asked for, the boundary you have not set, the truth you have not said out loud. Those high value conversations are where perspective becomes a life that actually feels different.'},
 {t:'dark',title:'You cannot always change the room you are standing in. You can always change who you are being while you stand in it.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Hold The Keys'},
 {t:'normal',k:'In the practice',title:'The same job, carried completely differently.',body:'The caseload does not magically shrink. But the vet who owns her emotion does not carry room three into room four. She sets the boundary without guilt, has the conversation without dread, and goes home with something left for her own life. Nothing about the medicine changed. Everything about the experience of practising it did.'},
 {t:'normal',k:'Beyond the practice',title:'From wondering if you should leave VetMed to choosing, on purpose, how you stay.',body:'Some people use this work to redesign their role, their hours, or their whole path. Others simply stop dreading Monday. Either way it becomes a decision you are making rather than a sentence you are serving, and that is the difference between a career that drains you and one that is genuinely yours.'},
 {t:'normal',k:'Why Dr. Cari Wise',title:'A veterinarian who nearly left, a certified life coach who found the way back.',body:'Dr. Cari Wise practised for over twenty years and hit burnout early enough to know it from the inside. She is a DVM, holds a masters in education, and is a certified life coach and Quantum Human Design specialist. Through the Joyful DVM Podcast and Vet Life Academy she has walked more than twenty thousand veterinary professionals through exactly these keys.'},

 {t:'section',idx:'Your Next Step',title:'The Keys Are Learnable, and You Can Start Now'},
 {t:'cta',title:'Ready to practise VetMed on your own terms?',body:'Vet Life Academy is where these keys become a daily practice, with the Vet Life Reboot course, live masterclasses, and a community of veterinary professionals doing the same work. Come see if it is the right next step for you.',chips:['Join Vet Life Academy','Start with the free podcast'],disc:'Educational content for veterinary professionals. Nothing here is medical, mental-health, or career advice, and no specific wellbeing, career, or income outcome is guaranteed. Results vary by person and effort. If you are in crisis, please contact a licensed professional or an emergency service.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Joyful DVM · <b>Vet Life Academy</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='title') h+=mo('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
