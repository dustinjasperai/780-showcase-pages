<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Return on Hygiene · Rachel Wall · Inspired Hygiene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0E1A20; --panel:#152530; --rule:#20353F;
    --mint:#63C9AE; --blush:#E79E8E; --chalk:#EFEAE1; --grey:#93A6A6; --dim:#586C6C;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Assistant',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .serif{font-family:'Literata',Georgia,serif}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);margin-bottom:2.4vh}
  h1{font-family:'Literata',serif;font-weight:600;color:var(--chalk);line-height:1.12;letter-spacing:-.005em}
  .t-title h1{font-size:5.2vw;line-height:1.05}
  .t-normal h1{font-size:3.3vw;max-width:85%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.5;font-weight:300}
  .sub{font-size:1.82vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.45;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Literata',serif;font-size:1.5vw;color:var(--blush);margin-bottom:2vh;font-style:italic}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--mint),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#122029 0%,#080F13 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4vw;max-width:86%;font-style:italic;font-weight:500;color:#DDEAE3}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:2.9vw;text-align:center;margin-bottom:4.6vh}
  .flowrow{display:flex;gap:1.1vw;justify-content:center;flex-wrap:wrap}
  .flowcard{background:var(--panel);border:1px solid var(--rule);border-radius:.7vw;padding:2.4vh 1.3vw;width:13vw;min-height:15vh;display:flex;flex-direction:column;gap:1vh}
  .flowcard .n{font-family:'Literata',serif;font-size:2vw;color:var(--blush);line-height:1}
  .flowcard .l{font-size:1.12vw;font-weight:600;color:var(--chalk);line-height:1.25}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#123028 0%,#080F13 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.4vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--mint);color:#BEEBDC;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .spk{position:absolute;pointer-events:none;opacity:.95}
  .title-spk{right:9%;bottom:10%;width:15vw}
  .corner-spk{right:6.5%;bottom:9%;width:7vw;opacity:.55}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--blush);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--mint);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.3vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}.t-flow h1{font-size:4.8vw}
    .flowcard{width:26vw}.flowcard .n{font-size:4vw}.flowcard .l{font-size:2.3vw}.t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 23</div>
<div class="brand-foot">Inspired Hygiene</div>
<div class="hint" id="hint">→ click or arrow keys</div>

<!-- sparkle motif (fresh / clean / shine) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="spk" viewBox="0 0 180 170">
  <g stroke-linejoin="round">
    <path d="M90 20 Q97 78 152 85 Q97 92 90 150 Q83 92 28 85 Q83 78 90 20 Z" fill="#63C9AE" opacity="0.9"/>
    <path d="M150 26 Q153 44 171 47 Q153 50 150 68 Q147 50 129 47 Q147 44 150 26 Z" fill="#E79E8E" opacity="0.85"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Return on Hygiene',sub:'How practice owners turn the hygiene department into the healthiest part of the practice: better periodontal care, a stronger team, and patients who stay well.',brand:true,spk:'title'},
 {t:'normal',k:'Who this is for',title:'Owners who know hygiene matters, and suspect it’s being left on autopilot.'},
 {t:'normal',k:'What you’ll walk away with',title:'A healthier hygiene department, start to finish.',body:'Better perio care, assisted hygiene, and the systems that support both.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'Every practice is different. What works is the version of these systems that fits yours.',disc:'Coaching and training are educational and are not a guarantee of production, revenue, or business results. Results vary by practice.'},
 {t:'normal',k:'Who’s teaching this',title:'Rachel Wall, RDH, Inspired Hygiene.',body:'A hygienist turned coach and author of Return on Hygiene, named a Top 25 Woman in Dentistry, host of the Inspired Hygiene Podcast.'},

 {t:'section',idx:'One',title:'The Overlooked Department'},
 {t:'normal',k:'The gap',title:'In most practices, hygiene runs on habit, not on a plan.'},
 {t:'dark',title:'Hygiene is not the cleaning appointment. It’s the health of the practice.'},

 {t:'section',idx:'Two',title:'Periodontal Care Done Right'},
 {t:'normal',k:'Perio',title:'Most practices under-diagnose the disease their patients actually have.'},
 {t:'dark',title:'Better care is the strategy. Everything healthy follows from it.'},

 {t:'section',idx:'Three',title:'Assisted Hygiene & The Team'},
 {t:'normal',k:'Assisted',title:'Assisted hygiene, done well, means better care, not rushed care.'},
 {t:'normal',k:'Team',title:'A confident hygiene team is your best patient-education engine.'},
 {t:'normal',k:'Systems',title:'Systems are what let great hygiene happen on every chair, every day.'},

 {t:'section',idx:'Four',title:'The Return-on-Hygiene Path'},
 {t:'flow',k:'The path',title:'The Return-on-Hygiene Path',items:[
   {n:'01',l:'See the Department'},{n:'02',l:'Perio Done Right'},{n:'03',l:'Assisted Hygiene'},
   {n:'04',l:'Build the Team'},{n:'05',l:'Watch the Right Numbers'},{n:'06',l:'Deliver Better Care'}]},
 {t:'normal',k:'The difference',title:'Built for your hygiene department, not a template dropped on top of it.'},
 {t:'dark',title:'A healthy hygiene department is the quiet engine of a healthy practice.',disc:'Educational content, not a guarantee of results. Outcomes vary by practice.'},

 {t:'section',idx:'Five',title:'Return on Hygiene, Continued'},
 {t:'normal',k:'Free',title:'Keep learning, free.',body:'The Inspired Hygiene Podcast and e-zine, plus free hygiene workshops.'},
 {t:'normal',k:'Talk it through',title:'A free conversation.',body:'Mapped to your hygiene department, your team, your patients.'},
 {t:'cta',title:'Give your hygiene department the care it deserves.',chips:['Grab the free resources','Book a free conversation'],disc:'Coaching and training are educational and are not a guarantee of production, revenue, or results. Results vary.'},
];

const deck=document.getElementById('deck');
function spk(kind){return `<svg class="spk ${kind==='title'?'title-spk':'corner-spk'}"><use href="#spk"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx serif">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Inspired <b>Hygiene</b> · Return on Hygiene</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.spk) h+=spk(s.spk);
  else if(s.t==='title') h+=spk('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
