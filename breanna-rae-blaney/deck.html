<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Integrative Wealth Advisor | Anya Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e0e;        /* brand body bg rgb(14,14,14) */
    --panel:#161616;
    --rule:#2a2a2a;
    --accent:#b18840;    /* brand gold/bronze link color */
    --accent2:#1c3802;   /* brand dark green */
    --ink:#f4f1ea;
    --muted:#9a948a;
    --display:'Bodoni Moda',Georgia,serif;
    --body:'Archivo',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:4px;padding:64px 58px;margin:0 0 22px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;top:0;left:0;width:64px;height:3px;background:var(--accent)}
  .kicker{font-family:var(--body);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;font-weight:600}
  h1{font-family:var(--display);font-weight:500;font-size:54px;line-height:1.07;letter-spacing:.2px;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:500;font-size:38px;line-height:1.14;margin-bottom:18px}
  .lead{font-size:19px;line-height:1.6;color:var(--ink);max-width:44ch}
  .muted{color:var(--muted)}
  .big{font-family:var(--display);font-size:44px;line-height:1.16;font-weight:500;max-width:20ch}
  .rule{height:1px;background:var(--rule);margin:26px 0;width:100%}
  ul{list-style:none;margin-top:10px}
  li{font-size:18px;line-height:1.5;padding:14px 0 14px 26px;border-bottom:1px solid var(--rule);position:relative}
  li::before{content:"";position:absolute;left:0;top:22px;width:10px;height:1px;background:var(--accent)}
  li:last-child{border-bottom:0}
  li b{font-weight:700}
  .presenter{margin-top:34px;font-size:15px;color:var(--muted);letter-spacing:.02em}
  .frame{display:flex;gap:30px;flex-wrap:wrap}
  .frame .col{flex:1;min-width:210px}
  .num{font-family:var(--display);font-size:30px;color:var(--accent);font-weight:600}
  .col h3{font-family:var(--display);font-weight:500;font-size:22px;margin:6px 0 8px}
  .disclaimer{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:26px;max-width:62ch}
  .cta-line{font-family:var(--display);font-size:24px;color:var(--accent);margin-top:14px}
  .slide-no{position:absolute;bottom:20px;right:26px;font-size:11px;color:var(--rule);letter-spacing:.2em}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:420px}h1{font-size:36px}h2{font-size:28px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',kicker:'A live masterclass for financial advisors',h:'The Integrative Wealth Advisor',lead:'How the best advisors differentiate by connecting money with meaning.',presenter:'Breanna Rae Blaney / Anya Institute for Human Revolution'},
  {t:'content',kicker:'Who this is for',h:'The advisor who refuses to compete on returns and fees.',lead:'You are good at the technical work. You also sense that the next decade of advising will be won somewhere else, in the conversation your clients are actually trying to have.'},
  {t:'content',kicker:'The trap',h:'Your clients can get a portfolio anywhere.',lead:'Returns converge. Fees compress. Planning software is a commodity. When every advisor sounds the same, price becomes the only visible difference, and that is a race you do not want to win.'},
  {t:'big',kicker:'The uncomfortable truth',big:'Clients rarely leave for better performance. They leave because they never felt understood.'},
  {t:'content',kicker:'The shift',h:'From accumulation to alignment.',lead:'The job is no longer only to grow the number. It is to help a person use their resources to build a life that means something. That is the work most plans quietly skip.'},
  {t:'content',kicker:'Part one: the core problem',h:'Advice has been commoditized from the outside in.',lead:'Robo tools, index products and AI summaries now do the mechanics. What they cannot do is sit with a human being and help them decide what the money is for. That gap is your opening.'},
  {t:'content',kicker:'Part one',h:'The real conversation your clients are having.',lead:'"Can I actually use this to live the life I want?" "Am I being responsible, or just hoarding?" "What is all of this for?" Clients bring these to you whether or not your process has room for them.'},
  {t:'content',kicker:'Part two: the method',h:'The Integrative Wealth approach.',lead:'A structured way to advise the whole person, not just the portfolio. Five differentiators turn a vague idea, "be more human," into something you can actually run with clients.'},
  {t:'list',kicker:'Differentiator one',h:'Ecosystemic view of wealth.',items:['<b>Money is one system inside a life</b>, not the whole of it.','Health, relationships, purpose and time are part of the balance sheet.','You advise on how the capital serves the whole, not the number in isolation.']},
  {t:'list',kicker:'Differentiator two',h:'Identity-led strategy.',items:['<b>Strategy starts with who the client is becoming</b>, not a risk questionnaire.','Decisions anchor to identity and values, so they hold under pressure.','Plans the client actually keeps, because they recognize themselves in them.']},
  {t:'list',kicker:'Differentiator three',h:'Whole-person advising.',items:['<b>You meet the human, not just the account holder.</b>','The fears and hopes behind the money become part of the work.','This is where trust, retention and referrals are really made.']},
  {t:'frame',kicker:'Differentiators four and five',h:'Proven tools, structured depth.',cols:[{n:'04',title:'Proven tools',body:'The IWA Operating System gives you repeatable frameworks and client conversations, so the human side stops being improvised.'},{n:'05',title:'Structured depth',body:'A clear arc for each relationship, so going deeper feels like a process you lead, not a risk you take.'}]},
  {t:'content',kicker:'The client frame',h:'Revolutionary Wealth.',lead:'A way of teaching clients that money is an instrument of meaning and legacy, not accumulation for its own sake. When the client changes how they relate to money, they change how they relate to you.'},
  {t:'content',kicker:'Part three: in practice',h:'The same client meeting, run two ways.',lead:'Version one: performance review, rebalancing, next steps. Version two: the same numbers, opened with "what is this money for in the next ten years?" One is a report. The other is a relationship.'},
  {t:'list',kicker:'What the advisor gains',h:'Differentiate on the conversation, not the fee.',items:['<b>Deeper trust</b> that is hard for a competitor or a robo tool to copy.','<b>Higher retention and more referrals</b>, because clients feel seen.','<b>A practice that is yours</b>, not an interchangeable version of everyone else.']},
  {t:'content',kicker:'Why learn this from me',h:'I built this from inside the industry.',lead:'I spent over a decade at Dimensional Fund Advisors, where I directed the Life, Invested advisor-education program, before building the Anya Institute. I combine institutional finance with more than a thousand hours of human-development training.'},
  {t:'frame',kicker:'The path',h:'The Evolution Model.',cols:[{n:'01',title:'Awakening',body:'See the gap between what clients need and what the industry gives them.'},{n:'02',title:'Experience',body:'Practice the Integrative Wealth approach in your own conversations.'},{n:'03',title:'Certification',body:'Master the operating system and earn the designation.'},{n:'04',title:'Stewardship',body:'Lead the human side of wealth with your clients, for good.'}]},
  {t:'content',kicker:'Recap',h:'The one idea worth keeping.',lead:'When advice is commoditized, the differentiated advisor is the one who helps a client align money with meaning. The skill is learnable, and it is the most durable edge you can build.'},
  {t:'cta',kicker:'Your next step',h:'Become an Integrative Wealth Advisor.',lead:'If this is the kind of advisor you want to be, the Integrative Wealth Advisor Certification is where you build the skill in full, with a cohort of advisors doing the same.',cta:'Book an Integrative Wealth interest call to see if the next cohort is a fit.',disclaimer:'This masterclass is educational. It shares a professional approach to advising and does not provide individualized financial, legal or investment advice. No specific business, income or client result is guaranteed. Results vary by advisor and effort.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let html='';
  if(s.kicker) html+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){
    html+=`<h1>${s.h}</h1><p class="lead">${s.lead}</p><div class="presenter">${s.presenter}</div>`;
  } else if(s.t==='big'){
    html+=`<p class="big">${s.big}</p>`;
  } else if(s.t==='list'){
    html+=`<h2>${s.h}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  } else if(s.t==='frame'){
    html+=`<h2>${s.h}</h2><div class="rule"></div><div class="frame">${s.cols.map(c=>`<div class="col"><div class="num">${c.n}</div><h3>${c.title}</h3><p class="lead muted" style="font-size:16px">${c.body}</p></div>`).join('')}</div>`;
  } else if(s.t==='cta'){
    html+=`<h2>${s.h}</h2><p class="lead">${s.lead}</p><p class="cta-line">${s.cta}</p><p class="disclaimer">${s.disclaimer}</p>`;
  } else {
    html+=`<h2>${s.h}</h2><p class="lead">${s.lead}</p>`;
  }
  html+=`<div class="slide-no">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
