<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The SpendFirst Practice · Kelsa Dickey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f7fb; --panel:#ecedf6; --rule:#dcdef0;
    --ink:#1a1e37; --accent:#293678; --grey:#565b73; --dim:#8b90a8;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Quicksand',sans-serif;font-weight:700;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.7vw;max-width:90%}
  .t-normal h1{font-size:2.8vw;max-width:85%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.6;font-weight:400}
  .sub{font-family:'Inter',sans-serif;font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.9vw;max-width:88%}
  .t-section .rule{width:16vw;height:4px;border-radius:4px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:3vw;max-width:84%;color:var(--ink)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.3vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:600;background:#fff}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .fwd-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-fwd{right:6.5%;bottom:9%;width:15vw}
  .corner-fwd{right:6%;bottom:7%;width:7vw;opacity:.5}
  .brandline{font-family:'Inter',sans-serif;font-size:1.2vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .amt{display:flex;gap:1.2vw;margin-top:3.6vh;flex-wrap:wrap}
  .amt .cell{background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:2.2vh 1.8vw}
  .amt .n{font-family:'Quicksand',sans-serif;font-size:2vw;font-weight:700;color:var(--accent)}
  .amt .l{font-size:1vw;color:var(--grey);margin-top:.6vh;letter-spacing:.02em}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600;font-family:'Inter',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700;font-family:'Inter',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Inter',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.6vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.4vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:6vw}.chip{font-size:2.6vw}.amt .n{font-size:5vw}.amt .l{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Financial Coach Academy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- forward-step motif: a clean line that steps up and forward to a dot, echoing SpendFirst's "what's coming, am I ready" forward view over a backward audit -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="fwd" viewBox="0 0 260 110">
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 92 H74 V64 H134 V38 H196 V16" stroke="#dcdef0"/>
    <path d="M134 38 H196 V16" stroke="#293678"/>
    <circle cx="196" cy="16" r="7" fill="#293678" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The SpendFirst Practice',sub:'A live masterclass for people who want to become financial coaches: how to build a practice around a method clients actually follow, so they stay, get results, and refer.',brand:true,arc:'title'},

 {t:'normal',k:'Who this is for',title:'You want to coach people through money. The question is what you actually hand them.',body:'Most new financial coaches come in with empathy, a spreadsheet, and a monthly check-in. That is enough to sign a first few clients. It is not enough to keep them, and keeping them is the whole business.'},
 {t:'dark',title:'Accountability is a service. A method is a business.'},

 {t:'section',idx:'Part One',title:'Why Good Coaches Lose Clients'},
 {t:'normal',k:'The willpower trap',title:'Clients do not quit their money because they lack discipline. They quit because they cannot see what is coming.',body:'When a client only ever looks backward, at where the money already went, every session is a confession. It feels like failure, so they cancel. The problem was never their discipline. It was that no one gave them a way to see the next paycheck before it arrived.'},
 {t:'normal',k:'What that means for you',title:'A coach who sells accountability is only as good as the client\'s worst week.',body:'If your value is checking in, then the client who misses two check-ins decides they are the problem and disappears. Retention is not about being more motivating. It is about handing them a system that keeps working on the weeks you are not in the room.'},
 {t:'dark',title:'You do not need more willpower from your clients. You need to give them visibility.'},

 {t:'section',idx:'Part Two',title:'The SpendFirst Method'},
 {t:'normal',k:'A different question',title:'SpendFirst starts with a forward question, not a backward one.',body:'Not "where did my money go," but "what is coming, and am I ready for it." You map the client\'s real paychecks against what each one has to cover, so every dollar has a job before it is spent. The shift from backward to forward, from monthly to paycheck by paycheck, is the whole method.'},
 {t:'normal',k:'AmountLeft',title:'The client always knows one number: what is safe to spend right now.',body:'Instead of tracking every past transaction, the client sees a running AmountLeft, the money that is genuinely free after everything coming up is accounted for. It is simple enough to actually use, which is why people follow it when a budget on a wall gets ignored. Visibility, not restriction.'},
 {t:'normal',k:'Why it retains',title:'A method that shows progress gives the client a reason to stay past the hard month.',body:'When a client can see the next three paychecks and watch the plan hold, coaching stops being a confession and becomes a scoreboard. That is what turns a three-session client into a year-long one, and a year-long one into a referral.'},

 {t:'section',idx:'Part Three',title:'Building It Into a Real Practice'},
 {t:'normal',k:'The Builder',title:'A method makes clients stay. The Builder is how the business around it gets built on purpose.',body:'Before the clients come, eight decisions quietly set the ceiling on the practice: the business model, the exact client you serve, how you package and price, how you sell without being pushy, and how you earn beyond one on one. Most coaches back into these by accident. Choosing them on purpose is the difference between a hobby and a practice.'},
 {t:'normal',k:'What the first 90 days look like',title:'A designed practice is boring in the best way: the same method, delivered the same way, every time.',body:'A repeatable intake, a repeatable first-session map, a repeatable check-in rhythm built around AmountLeft. When the delivery is a system instead of an improvisation, quality stops depending on your mood, and the practice can hold more clients without falling apart.'},
 {t:'normal',k:'Why Kelsa',title:'She built the practice from scratch first, then the method, then the school.',body:'Kelsa Dickey left a corporate accounting and advisory career in 2010 and built Fiscal Fitness PHX out of a home office. The SpendFirst method came out of real client work: her clients have paid off more than $38 million in debt and saved over $112 million, not by getting more disciplined, but because the system finally showed them what was coming. Financial Coach Academy is where she now teaches coaches to run it.'},
 {t:'dark',title:'The clients came for the coaching. They stayed for the method.'},

 {t:'section',idx:'Your Next Step',title:'Learn to Run the Method'},
 {t:'normal',k:'How the Academy works',title:'Financial Coach Academy is the full training: the SpendFirst method, The Builder, and a year of live coaching to get your practice off the ground.',body:'Thirty lessons that walk through every phase of launching a financial coaching business, monthly live coaching calls across the year, and the specialty tracks for coaches who want to go deeper. You keep access to the materials for as long as the program is live.'},
 {t:'cta',title:'Ready to build a coaching practice that clients do not quit?',chips:['Join the Financial Coach Academy','Start with the free workshop'],disc:'Educational content for people building a financial coaching practice. No income, enrollment, or client result is guaranteed. Results vary by person, market, and effort.'},
];

const deck=document.getElementById('deck');
function fwdSvg(kind){return `<svg class="fwd-motif ${kind==='title'?'title-fwd':'corner-fwd'}"><use href="#fwd"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Financial Coach <b>Academy</b> &middot; Kelsa Dickey</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=fwdSvg(s.arc);
  else if(s.t==='title') h+=fwdSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
