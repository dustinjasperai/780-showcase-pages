<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Strategically, Not Endlessly — Dr. Stacey Ishman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8eef2;      /* brand ground #ecf0f1, nudged toward brand blue */
    --panel:#fbfdfe;   /* faint blue-white, off pure white */
    --ink:#1b2733;     /* deepened brand slate */
    --muted:#595959;   /* brand slate gray */
    --rule:#dfe6ec;
    --accent:#1981de;  /* brand blue */
    --mint:#8ce2c8;    /* brand mint */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Lora',Georgia,serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(960px,94vw);aspect-ratio:16/10;background:var(--panel);
         border:1px solid var(--rule);border-radius:14px;position:relative;
         box-shadow:0 12px 40px rgba(27,39,51,.08);overflow:hidden}
  .slide{position:absolute;inset:0;padding:64px 72px;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kicker{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:.14em;
          text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:44px;line-height:1.08;margin-bottom:18px}
  h2{font-family:'Montserrat',sans-serif;font-weight:600;font-size:30px;line-height:1.14;margin-bottom:16px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:62ch;margin-bottom:12px}
  p.sub{color:var(--muted);font-size:21px}
  ul{list-style:none;margin-top:8px}
  li{font-size:19px;line-height:1.45;padding-left:28px;position:relative;margin-bottom:12px;max-width:60ch}
  li::before{content:'';position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .big{font-family:'Montserrat',sans-serif;font-weight:700;font-size:58px;color:var(--accent);line-height:1}
  .name{font-family:'Montserrat',sans-serif;font-weight:600;color:var(--muted);font-size:18px;margin-top:28px}
  .tag{display:inline-block;background:var(--mint);color:#0f3d30;font-family:'Montserrat',sans-serif;
       font-weight:600;font-size:14px;padding:6px 14px;border-radius:999px;margin-bottom:22px;align-self:flex-start}
  .disc{font-size:13px;color:var(--muted);font-family:'Montserrat',sans-serif;margin-top:22px;max-width:60ch}
  .nav{position:absolute;bottom:16px;right:22px;font-family:'Montserrat',sans-serif;font-size:13px;color:var(--muted)}
  .dot{position:absolute;bottom:18px;left:24px;font-family:'Montserrat',sans-serif;font-size:12px;color:var(--muted);letter-spacing:.08em}
  button.edge{position:absolute;top:0;height:100%;width:16%;border:0;background:transparent;cursor:pointer}
  #prev{left:0}#next{right:0}
</style>
</head>
<body>
<div id="stage">
  <button class="edge" id="prev" aria-label="Previous"></button>
  <button class="edge" id="next" aria-label="Next"></button>
  <div class="nav" id="nav"></div>
  <div class="dot">Dr. Stacey Ishman, MD</div>
</div>
<script>
const S = [
  {t:'title', k:'A Masterclass for Academic Physicians',
   h:'Work Strategically, Not Endlessly',
   p:'How to design a path to promotion and a national reputation without adding a single hour to your week.',
   name:'Dr. Stacey Ishman, MD, MPH, FACS, FAAP'},

  {t:'who', k:'Who this is for',
   h:'The faculty member who did everything right',
   p:'You are early to mid career. You trained for over a decade. You are good in the clinic and good in the lab. And somehow you are the busiest you have ever been and the least sure your career is actually moving.'},

  {t:'trap', k:'The trap',
   h:'More effort is not moving the needle',
   p:'The service asks keep coming. The inbox never empties. Committees fill the calendar. You keep saying yes because saying no feels risky, and the work that would actually get you promoted keeps sliding to next month.'},

  {t:'reframe', k:'The hard truth',
   h:'You will not be passed over because you cannot do the work',
   p:'Most faculty leave or stall around year three, long before they hit full stride at year five. Not because they cannot operate or cannot publish. Because no one ever taught them to design a strategic academic career. The scoreboard is hidden, and effort is not what it measures.'},

  {t:'part', k:'Part one', h:'Advancement is a design problem, not an hours problem'},

  {t:'scoreboard', k:'The hidden scoreboard',
   h:'Your promotion committee reads a portfolio, not your week',
   p:'They do not see the nights and weekends. They see a record: publications that build a line of work, a reputation beyond your own institution, teaching and service that is legible on paper. When you aim at the record instead of the hours, the same week produces a different career.'},

  {t:'part', k:'Part two', h:'The framework: five pillars of a designed career'},

  {t:'pillar', k:'Pillar one', h:'Time management',
   p:'Reclaim time from reactive work and build protected focus periods for the high-impact work that compounds. The calendar is the first draft of the career.'},

  {t:'pillar', k:'Pillar two', h:'Boundary setting',
   p:'Learn the strategic no: declining requests without damaging the relationships you need. A good no protects the yes that matters.'},

  {t:'pillar', k:'Pillar three', h:'Career strategy',
   p:'Align what you do on an ordinary Tuesday with where you want to be in five years: promotion, a funded line of research, a leadership seat. Daily work, pointed at the goal.'},

  {t:'pillar', k:'Pillar four', h:'Priority clarification',
   p:'Separate the activities that genuinely advance a career from the ones that only consume time but feel productive. Most calendars are full of the second kind.'},

  {t:'pillar', k:'Pillar five', h:'System building',
   p:'Build the tracking that makes promotion inevitable: a running record of projects, talks, and accomplishments, assembled the way a committee reads it, not scrambled together the month it is due.'},

  {t:'part', k:'Part three', h:'What a designed year looks like'},

  {t:'picture', k:'The designed year',
   h:'Fewer things, aimed better',
   p:'Protected blocks for the work that counts. A short list of commitments that each build the record. A portfolio that grows on its own because the system captures it. The same clinical and research load, producing visible advancement instead of quiet exhaustion.'},

  {t:'rep', k:'The reputation engine',
   h:'National visibility, by design',
   p:'A reputation beyond your institution is not luck and it is not for the self-promoting few. It is a handful of deliberate moves repeated: the right talks, the right collaborations, the right lines of work made visible. Designed, not hoped for.'},

  {t:'why', k:'Why listen to me',
   h:'I climbed this ladder, then mapped it',
   p:'Triple board certified in otolaryngology, complex pediatric otolaryngology, and sleep medicine. 25 years on faculty at Johns Hopkins, Cincinnati, and Wisconsin. NIH funded, 231 publications, Past President of the International Surgical Sleep Society, and Chair of the Board of Governors of the American Academy of Otolaryngology. I did not read about this path. I walked it, and I learned where it wastes people.'},

  {t:'dept', k:'For chairs and departments',
   h:'The year-three cliff is a budget line',
   p:'It costs roughly a million dollars to recruit and train one surgeon, who reaches full stride around year five. Lose them at year three and the investment never pays back. Faculty do not leave because they cannot perform. They leave because no one taught them to design the path. Retain even one and the work pays for itself many times over.'},

  {t:'recap', k:'The whole idea in one line',
   h:'Work strategically, not endlessly',
   p:'Do more of what matters by doing less of what does not. Academic advancement is a design problem. Once you treat it like one, the career starts to move on the hours you already have.'},

  {t:'cta', k:'Your next step',
   h:'Let us design your path',
   p:'If this is the career you want to build, the next step is a short, no-pressure conversation about where you are and where you want to be.',
   name:'Schedule an Exploratory Call at amedsg.com',
   disc:'Educational content only. Every physician and department is different; individual outcomes vary and no specific result, promotion, or financial return is guaranteed.'}
];

const stage=document.getElementById('stage'),nav=document.getElementById('nav');
let i=0;
function build(){
  S.forEach((s,idx)=>{
    const d=document.createElement('div');d.className='slide'+(idx===0?' on':'');
    let html='';
    if(s.k) html+='<div class="'+(s.t==='title'||s.t==='cta'?'tag':'kicker')+'">'+s.k+'</div>';
    if(s.t==='title'){html+='<h1>'+s.h+'</h1>';}
    else if(s.t==='part'){html+='<h2 style="font-size:38px">'+s.h+'</h2>';}
    else {html+='<h2>'+s.h+'</h2>';}
    if(s.p) html+='<p'+(s.t==='title'?' class="sub"':'')+'>'+s.p+'</p>';
    if(s.name) html+='<div class="name">'+s.name+'</div>';
    if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
    d.innerHTML=html;
    stage.insertBefore(d,stage.querySelector('.nav'));
  });
}
function show(n){const sl=stage.querySelectorAll('.slide');i=(n+sl.length)%sl.length;
  sl.forEach((s,x)=>s.classList.toggle('on',x===i));
  nav.textContent=(i+1)+' / '+sl.length;}
build();show(0);
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
</script>
</body>
</html>
