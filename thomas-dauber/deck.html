<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The $110M Playbook for the One-Person Shop — Tom Dauber</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf8f3; --ink:#072136; --accent:#0c3c60; --panel:#d8e8f2;
  --muted:#4a4f5c; --rule:rgba(7,33,54,.14);
  --head:'Newsreader',Georgia,serif; --body:'Libre Franklin',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#e8e3da;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
.slide{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:10px;
  aspect-ratio:16/9;margin:0 0 30px;padding:70px 76px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 18px 50px rgba(7,33,54,.10)}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--accent)}
.tier{position:absolute;right:66px;bottom:60px;display:flex;flex-direction:column;gap:7px;opacity:.5}
.tier i{display:block;height:10px;border-radius:3px;background:var(--accent)}
.tier i:nth-child(1){width:130px;opacity:.35}
.tier i:nth-child(2){width:96px;opacity:.6}
.tier i:nth-child(3){width:62px}
.kick{font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
h1{font-family:var(--head);font-weight:600;font-size:60px;line-height:1.05;letter-spacing:-.01em;max-width:15ch}
h2{font-family:var(--head);font-weight:600;font-size:44px;line-height:1.1;max-width:18ch}
.lead{font-family:var(--head);font-weight:500;font-size:34px;line-height:1.28;color:var(--ink);max-width:22ch;font-style:italic}
.sub{font-size:24px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:34ch;font-weight:400}
.big{font-family:var(--head);font-weight:700;font-size:118px;line-height:1;color:var(--accent)}
.stat-row{display:flex;gap:54px;margin-top:40px;flex-wrap:wrap}
.stat .n{font-family:var(--head);font-weight:700;font-size:72px;color:var(--accent);line-height:1}
.stat .l{font-size:18px;color:var(--muted);margin-top:8px;max-width:16ch}
.list{margin-top:34px;display:flex;flex-direction:column;gap:20px;max-width:30ch}
.list .li{display:flex;gap:18px;align-items:flex-start;font-size:23px;line-height:1.38;color:var(--ink)}
.list .li b{font-weight:600}
.num{flex-shrink:0;width:38px;height:38px;border-radius:9px;background:var(--panel);color:var(--accent);
  font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;font-family:var(--head)}
.cakewrap{display:flex;gap:46px;align-items:center;margin-top:30px}
.cake{display:flex;flex-direction:column;gap:10px}
.cake .layer{border-radius:8px;padding:20px 30px;color:#fff;font-family:var(--head);font-weight:600;font-size:26px}
.cake .top{background:var(--accent);width:300px}
.cake .base{background:var(--ink);width:420px;padding-top:30px;padding-bottom:30px}
.cakenote{max-width:26ch;font-size:21px;line-height:1.45;color:var(--muted)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;
  border-top:1px solid var(--rule);padding-top:22px;font-size:15px;color:var(--muted);letter-spacing:.02em}
.foot b{color:var(--ink);font-weight:600}
.panel{background:var(--panel);border-radius:10px;padding:34px 38px;margin-top:30px;max-width:40ch}
.panel .q{font-family:var(--head);font-style:italic;font-size:30px;line-height:1.3;color:var(--ink)}
.disc{font-size:15px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:62ch}
.cta-b{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;font-weight:600;font-size:22px;
  padding:16px 34px;border-radius:100px}
.page{position:absolute;right:30px;top:26px;font-size:13px;color:var(--muted);letter-spacing:.14em}
@media(max-width:720px){.slide{padding:40px 34px}h1{font-size:40px}h2{font-size:30px}.big{font-size:74px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "Abundant Vision Philanthropic Consulting · Tom Dauber";
const S = [
  {t:"cover", kick:"A live masterclass for small nonprofits",
   h:"The $110M Playbook for the One-Person Shop",
   sub:"How small nonprofits close major gifts without a big team, a database, or a glossy case for support."},

  {t:"forwho", kick:"Who this is for",
   h:"You run the whole thing.",
   sub:"Executive directors and development leaders at small and medium nonprofits who know major gifts matter, but have no gift officer and no playbook to start."},

  {t:"trap", kick:"The trap",
   lead:"“Major gifts need a big team and a big budget, so we’ll get to them later.”",
   sub:"So you stay stuck on events and grants, and the one revenue source that actually scales never gets built."},

  {t:"reframe", kick:"The reframe",
   h:"A major gift is closed in a conversation, not a campaign.",
   sub:"It is not about sales pressure. It is about leadership presence, clarity, and discipline."},

  {t:"part", kick:"Part one", h:"Why the asking feels so hard"},

  {t:"body", kick:"The real barrier",
   h:"Projection.",
   sub:"Most leaders assume a donor’s capacity or willingness based on their own relationship with money. You shrink the ask before the donor ever hears it."},

  {t:"body", kick:"The second barrier",
   h:"You lead with mechanisms, not vision.",
   sub:"Classrooms, scholarships, line items. Donors do not fund mechanisms. They fund the generational change those mechanisms create."},

  {t:"part", kick:"Part two", h:"The method: enterprise strategy, small enough to carry"},

  {t:"cake", kick:"The two-tiered cake",
   h:"Plan a campaign donors believe in.",
   base:"The Vision", top:"The Plan",
   note:"The base tier is the vision: how a gift creates meaningful, lasting change. The top tier is the execution plan: exactly how the money delivers on that promise. Everything else, the printed folders and the kickoff dinners, is just icing."},

  {t:"steps", kick:"The 20 questions, distilled",
   h:"Answer these before you start.",
   items:[
     ["01","<b>Why major gifts, why now?</b> Name the outcome a transformational gift unlocks."],
     ["02","<b>Who owns the relationships?</b> A major gift is a person’s job, not a committee’s."],
     ["03","<b>What is the vision?</b> The change a donor is funding, in one sentence."],
     ["04","<b>How will you remember?</b> Every conversation recorded, or it did not happen."]
   ]},

  {t:"body", kick:"The discipline nobody teaches",
   h:"If it’s not recorded, it didn’t happen.",
   sub:"Capture each visit as soon as it ends: what the donor values, their motivation, the next step and its date. Objective notes, not opinions. This is the memory a small shop usually loses."},

  {t:"steps", kick:"The donor path",
   h:"How a relationship becomes a gift.",
   items:[
     ["①","<b>Identify and qualify.</b> The right people, real capacity and interest."],
     ["②","<b>Cultivate.</b> Real conversations, on their terms, over time."],
     ["③","<b>Ask as a leader.</b> Clear, confident, tied to the vision."],
     ["④","<b>Steward.</b> Deliver on the promise, then do it again."]
   ]},

  {t:"panel", kick:"The mindset",
   q:"“You didn’t get into this work to raise money. You did it to change the world. Major gifts are how you fund the change for the long term.”",
   sub:"Abundance over scarcity. Presence over pressure."},

  {t:"part", kick:"Part three", h:"A one-person shop, fully funded"},

  {t:"body", kick:"The shift",
   h:"One leader, one disciplined pipeline.",
   sub:"Not a bigger team. A clear vision, a handful of qualified relationships, honest records, and the confidence to make the ask. That is a major-gift program a small shop can actually run."},

  {t:"whyme", kick:"Why learn this from Tom",
   h:"Built in the room, not the textbook.",
   stats:[["$110M+","in fundraising initiatives led"],["4,000+","donor meetings completed"],["167","major gifts personally closed"]],
   sub:"Two decades leading advancement at The Ohio State University and OhioHealth, now bringing that same strategy to nonprofits of every size."},

  {t:"body", kick:"The promise",
   h:"Scale should never dictate potential.",
   sub:"The expertise large institutions pay for, made small enough for your shop to carry and start using this quarter."},

  {t:"cta", kick:"Your next step",
   h:"Start your major-gift program.",
   sub:"Book a free consultation and we will map the first vision, the first relationships, and the first ask together.",
   cta:"Grow Your Nonprofit",
   disc:"Educational content only. No fundraising outcome, revenue figure, or result is guaranteed; every organization’s results vary with its mission, donors, and effort."}
];

function slideHTML(s, i){
  const page = String(i+1).padStart(2,"0");
  let inner = "";
  if(s.t==="cover"){
    inner = `<div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="sub">${s.sub}</div>`;
  } else if(s.t==="part"){
    inner = `<div class="kick">${s.kick}</div><h1>${s.h}</h1>`;
  } else if(s.t==="trap"||s.t==="reframe"){
    inner = `<div class="kick">${s.kick}</div>${s.lead?`<div class="lead">${s.lead}</div>`:`<h1>${s.h}</h1>`}${s.sub?`<div class="sub">${s.sub}</div>`:""}`;
  } else if(s.t==="forwho"||s.t==="body"){
    inner = `<div class="kick">${s.kick}</div><h1>${s.h}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:""}`;
  } else if(s.t==="cake"){
    inner = `<div class="kick">${s.kick}</div><h2>${s.h}</h2>
      <div class="cakewrap"><div class="cake"><div class="layer top">${s.top}</div><div class="layer base">${s.base}</div></div>
      <div class="cakenote">${s.note}</div></div>`;
  } else if(s.t==="steps"){
    const li = s.items.map(it=>`<div class="li"><span class="num">${it[0]}</span><span>${it[1]}</span></div>`).join("");
    inner = `<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="list">${li}</div>`;
  } else if(s.t==="panel"){
    inner = `<div class="kick">${s.kick}</div><div class="panel"><div class="q">${s.q}</div></div>${s.sub?`<div class="sub">${s.sub}</div>`:""}`;
  } else if(s.t==="whyme"){
    const st = s.stats.map(x=>`<div class="stat"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join("");
    inner = `<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="stat-row">${st}</div><div class="sub">${s.sub}</div>`;
  } else if(s.t==="cta"){
    inner = `<div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="sub">${s.sub}</div>
      <div><span class="cta-b">${s.cta}</span></div><div class="disc">${s.disc}</div>`;
  }
  const tier = `<div class="tier"><i></i><i></i><i></i></div>`;
  const foot = `<div class="foot"><span><b>${BRAND.split(" · ")[0]}</b></span><span>Tom Dauber</span></div>`;
  return `<section class="slide"><div class="page">${page}</div>${inner}${tier}${foot}</section>`;
}
document.getElementById("deck").innerHTML = S.map(slideHTML).join("");
</script>
</body>
</html>
