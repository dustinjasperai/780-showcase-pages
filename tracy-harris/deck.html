<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Freedom Filled Membership Model — Mums With Hustle</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f4;
  --panel:#ffffff;
  --ink:#1f2f4d;
  --accent:#c06a50;
  --peach:#dea290;
  --deep:#1f2f4d;
  --rule:#ece3db;
  --grey:#5a5750;
  --dim:#938c83;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Poppins',sans-serif;color:var(--ink);padding:26px 0 60px}
.deck{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:22px}
.slide{position:relative;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--rule);
  border-radius:16px;padding:66px 74px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 12px 34px rgba(31,47,77,.07)}
.kicker{font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);margin-bottom:26px}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:56px;line-height:1.05;
  letter-spacing:-.015em;color:var(--ink)}
h2{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:42px;line-height:1.1;
  letter-spacing:-.01em;color:var(--ink)}
.sub{font-size:26px;line-height:1.45;color:var(--grey);margin-top:22px;max-width:88%}
.body{font-size:23px;line-height:1.55;color:var(--grey);margin-top:24px;max-width:90%}
.pts{list-style:none;margin-top:28px;display:flex;flex-direction:column;gap:15px}
.pts li{font-size:22px;color:var(--ink);padding-left:40px;position:relative;line-height:1.4}
.pts li::before{content:"";position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:50%;
  background:var(--peach);box-shadow:inset 0 0 0 4px var(--panel),0 0 0 1.5px var(--accent)}
.foot{margin-top:auto;padding-top:26px;display:flex;align-items:center;gap:14px;font-family:'Poppins',sans-serif;
  font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.foot .dot{width:8px;height:8px;border-radius:50%;background:var(--peach)}
.mark{position:absolute;top:60px;right:74px}
.mark svg{display:block}
/* title */
.slide.title{background:linear-gradient(160deg,#fffdfb,#f6efe8)}
.slide.title h1{font-size:70px}
.slide.title .brand{margin-top:auto;font-family:'Poppins',sans-serif;font-weight:600;font-size:19px;
  letter-spacing:.04em;color:var(--ink)}
.slide.title .brand span{color:var(--accent)}
/* dark part-dividers */
.slide.part{background:var(--deep);border-color:var(--deep);justify-content:center}
.slide.part .num{font-family:'Poppins',sans-serif;font-weight:600;font-size:17px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--peach);margin-bottom:20px}
.slide.part h2{color:#fdf6f0;font-size:52px;max-width:82%}
.slide.part .rule{width:96px;height:5px;background:var(--peach);border-radius:3px;margin-top:30px}
.slide.reframe{background:var(--deep);border-color:var(--deep);justify-content:center}
.slide.reframe h1{color:#fdf6f0;font-size:56px;max-width:92%}
.slide.reframe h1 em{font-style:normal;color:var(--peach)}
.slide.reframe .sub{color:#e4d8ce;margin-top:26px}
/* pillar */
.slide.pillar{flex-direction:row;align-items:center;gap:52px}
.slide.pillar .n{font-family:'Playfair Display',serif;font-weight:800;font-size:150px;line-height:.9;
  color:var(--peach);flex-shrink:0;letter-spacing:-.03em}
.slide.pillar .col h2{font-size:44px}
.slide.pillar .col .body{margin-top:20px}
/* credibility */
.slide.credibility{background:linear-gradient(160deg,#fffdfb,#f6efe8)}
.slide.credibility .big{font-family:'Playfair Display',serif;font-weight:800;font-size:38px;color:var(--accent);
  margin-top:8px}
/* cta */
.slide.cta{background:var(--deep);border-color:var(--deep);justify-content:center}
.slide.cta .kicker{color:var(--peach)}
.slide.cta h1{color:#fdf6f0;font-size:58px}
.slide.cta .body{color:#e7dbd1}
.slide.cta .pill{display:inline-block;margin-top:30px;font-family:'Poppins',sans-serif;font-weight:600;
  font-size:22px;color:var(--deep);background:var(--peach);border-radius:100px;padding:16px 34px;letter-spacing:.01em}
.slide.cta .disc{margin-top:auto;font-size:14px;line-height:1.5;color:#b6a69b;max-width:88%}
@media(max-width:720px){
  .slide{padding:34px 30px;aspect-ratio:auto;min-height:460px}
  h1{font-size:34px}.slide.title h1{font-size:40px}.slide.reframe h1,.slide.cta h1{font-size:34px}
  h2{font-size:28px}.slide.part h2{font-size:32px}
  .sub{font-size:19px;max-width:100%}.body{font-size:18px;max-width:100%}.pts li{font-size:18px}
  .slide.pillar{flex-direction:column;align-items:flex-start;gap:14px}.slide.pillar .n{font-size:88px}
  .mark{display:none}
}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const LOOP = '<svg width="60" height="34" viewBox="0 0 60 34" fill="none"><path d="M30 5c-11 0-20 5.4-20 12s9 12 20 12 20-5.4 20-12" stroke="var(--peach)" stroke-width="3" stroke-linecap="round"/><path d="M44 3 L50 8 L44 13" stroke="var(--peach)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
const S = [
  {t:'title', kicker:'A free live masterclass for mums in business', h:'The Freedom Filled Membership Model', sub:'How to turn a business that trades your hours for money into one that pays you every month, so your income grows while your calendar clears.'},
  {t:'who', kicker:'Who this is for', h:'You are booked out, and stuck', body:'This is for women running a coaching, service, or course business who are good at what they do, fully booked, and quietly aware that the only way to earn more is to work more.', pts:['Your income is capped by your hours','Every launch starts you back at zero','The business needs you in the room to run']},
  {t:'trap', kicker:'The trap', h:'You did not build freedom. You built a busier job.', body:'Selling more of your time, or launching harder every quarter, just adds hours you do not have. The hustle scales, the freedom does not, and the business you started for your family now competes with it.'},
  {t:'reframe', h:'A business paid by the hour <em>has a ceiling.</em>', sub:'Recurring revenue does not. Income that renews on its own is what turns effort into freedom instead of into a heavier week.'},
  {t:'part', num:'Part One', h:'Why more launches will not fix it'},
  {t:'content', kicker:'The core problem', h:'You are renting your income', body:'When money only arrives while you are actively selling or delivering, you never own it. Stop for a season and it stops with you. That is not a pricing problem or a traffic problem. It is a model problem.', pts:['Every dollar depends on your presence','Growth means more hours, not more leverage','Time off costs you income directly']},
  {t:'content', kicker:'The cost of the capped model', h:'The launch roller-coaster', body:'Launch, exhale, panic that revenue just went quiet, launch again. It feels like progress and it is really a treadmill. The fix is not a better launch. It is a model where revenue keeps arriving after the launch is over.'},
  {t:'part', num:'Part Two', h:'The Freedom Filled Membership Model'},
  {t:'framework', kicker:'The method', h:'Build once, get paid on repeat', body:'The Freedom Filled Membership Model turns your expertise into a recurring offer that renews every month. It runs on five moves, in order. Get them right and revenue compounds instead of resetting.'},
  {t:'pillar', n:'01', h:'Pick the recurring outcome', body:'Choose one ongoing result your people will happily pay for month after month. Recurring revenue needs a recurring reason, not a one-time fix they buy once and leave.'},
  {t:'pillar', n:'02', h:'Design a one-to-many offer', body:'Shape the delivery so serving ten members costs you barely more time than serving one. This is where your hours come back: the offer, not your calendar, does the scaling.'},
  {t:'pillar', n:'03', h:'Build the on-ramp', body:'Create a simple, repeatable way for the right people to discover you and say yes, so new members arrive without you selling from scratch every single week.'},
  {t:'pillar', n:'04', h:'Fill it from your audience', body:'Turn the audience you already have, your content, your podcast, your community, into a steady flow into the membership. Warm attention converts far better than cold.'},
  {t:'pillar', n:'05', h:'Engineer the renewal', body:'The real profit lives in month two and beyond. Design the experience and the wins so members stay, because a membership that renews itself is the whole point.'},
  {t:'content', kicker:'The move under all five', h:'Lead it like a CEO, not a hustler', body:'A membership that depends on you doing everything is just a subscription to your own exhaustion. Put systems and a small team around it so it runs to standard on the days you are being a mum, not a marketer.'},
  {t:'part', num:'Part Three', h:'A business that runs without you'},
  {t:'content', kicker:'What changes', h:'You become optional, on purpose', body:'The work still happens, to standard, on the days you step away. Income stops depending on your presence. That is the moment the stress drops and the freedom the brand name promised finally shows up in your actual week.'},
  {t:'content', kicker:'What compounding looks like', h:'Revenue that starts the month already earned', body:'Instead of opening each month at zero, you open it with members already paying. New joins add to a base that is already there, so growth stacks instead of resetting.', pts:['Predictable monthly income','Growth that builds on last month','Time off that no longer costs you revenue']},
  {t:'credibility', kicker:'Why listen to me', h:'I built this around my kids', big:'100K community, 6,000+ students', body:'I started Mums With Hustle in 2015 after being told I could not have both a career and my family. I built it into a community of over 100,000, taught more than 6,000 students, and grew the Mums With Hustle Podcast past a million downloads, all while working around my two children. The Freedom Filled Membership Model is how I did it. (My own figures.)'},
  {t:'recap', kicker:'The whole model, in one line', h:'Build once, get paid on repeat', body:'Pick the recurring outcome. Design a one-to-many offer. Build the on-ramp. Fill it from your audience. Engineer the renewal. Five moves that trade a capped, hour-by-hour business for income that renews while you live your life.'},
  {t:'cta', kicker:'Your next step', h:'Build your Freedom Filled membership', body:'If you want help turning your expertise into a membership that renews, apply for the Freedom Filled Mastermind. We map the model to your business and the first move to make.', pill:'Apply for the Freedom Filled Mastermind', disclaimer:'Educational content only. No specific income or revenue result is guaranteed. Outcomes vary based on your business, your effort, your audience, and market conditions.'}
];

function render(s){
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let inner = '';
  if(s.t==='title'){
    inner += '<div class="mark">'+LOOP+'</div>';
    if(s.kicker) inner += '<div class="kicker">'+s.kicker+'</div>';
    inner += '<h1>'+s.h+'</h1>';
    if(s.sub) inner += '<div class="sub">'+s.sub+'</div>';
    inner += '<div class="brand">Mums With Hustle <span>&middot;</span> Tracy Harris</div>';
  } else if(s.t==='part'){
    inner += '<div class="num">'+s.num+'</div><h2>'+s.h+'</h2><div class="rule"></div>';
  } else if(s.t==='reframe'){
    inner += '<h1>'+s.h+'</h1>'+(s.sub?'<div class="sub">'+s.sub+'</div>':'');
  } else if(s.t==='pillar'){
    inner += '<div class="n">'+s.n+'</div><div class="col"><h2>'+s.h+'</h2><div class="body">'+s.body+'</div></div>';
  } else if(s.t==='cta'){
    inner += '<div class="kicker">'+s.kicker+'</div><h1>'+s.h+'</h1>';
    inner += '<div class="body">'+s.body+'</div>';
    if(s.pill) inner += '<div><span class="pill">'+s.pill+'</span></div>';
    inner += '<div class="disc">'+s.disclaimer+'</div>';
  } else {
    inner += '<div class="mark">'+LOOP+'</div>';
    if(s.kicker) inner += '<div class="kicker">'+s.kicker+'</div>';
    inner += '<h2>'+s.h+'</h2>';
    if(s.big) inner += '<div class="big">'+s.big+'</div>';
    if(s.body) inner += '<div class="body">'+s.body+'</div>';
    if(s.pts){ inner += '<ul class="pts">'; s.pts.forEach(p=>inner+='<li>'+p+'</li>'); inner += '</ul>'; }
    inner += '<div class="foot"><span class="dot"></span>Mums With Hustle</div>';
  }
  el.innerHTML = inner;
  return el;
}
const deck = document.getElementById('deck');
S.forEach(s => deck.appendChild(render(s)));
</script>
</body>
</html>
