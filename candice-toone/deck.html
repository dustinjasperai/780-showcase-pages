<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defying Gravity — a masterclass for wives | Candice Toone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcf3e3;        /* honey cream ground, lightened from their #ffce74 honey family */
    --panel:#fffdf8;     /* warm off-white panel, same honey tint */
    --rule:#f3e2c4;      /* honey-tinted rule, lightened from #ffce74 */
    --ink:#414042;       /* their dominant color */
    --muted:#69727d;     /* their ranked slate */
    --accent:#f2ac45;    /* their ranked honey-gold */
    --accent-2:#ffce74;  /* their ranked light honey */
    --display:'Quicksand',system-ui,sans-serif;
    --body:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);
       display:flex;align-items:center;justify-content:center;min-height:100vh}
  .stage{width:min(960px,94vw);aspect-ratio:16/10;background:var(--panel);
    border:1px solid var(--rule);border-radius:18px;position:relative;overflow:hidden;
    box-shadow:0 18px 60px rgba(65,64,66,.10)}
  .slide{position:absolute;inset:0;padding:7% 8%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin:0 0 14px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,4.4vw,3.1rem);line-height:1.08;margin:0 0 .5em}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,3.3vw,2.2rem);line-height:1.14;margin:0 0 .5em}
  p{font-size:clamp(1rem,1.7vw,1.22rem);line-height:1.55;margin:.3em 0;max-width:34ch}
  .big{font-size:clamp(1.25rem,2.4vw,1.7rem);line-height:1.4;max-width:30ch}
  ul{margin:.4em 0 0;padding:0;list-style:none;max-width:40ch}
  li{font-size:clamp(1rem,1.7vw,1.2rem);line-height:1.5;padding:9px 0 9px 30px;position:relative}
  li::before{content:"";position:absolute;left:0;top:1.0em;width:13px;height:13px;
    background:var(--accent);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  .sub{color:var(--muted);font-style:italic}
  .by{font-family:var(--display);font-weight:600;color:var(--muted);margin-top:1.4em;font-size:1rem;font-style:normal}
  .hex{position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;opacity:.14;
    background:var(--accent-2);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  .disc{color:var(--muted);font-size:.86rem;font-style:italic;max-width:46ch;margin-top:1.3em}
  .cta-line{font-family:var(--display);font-weight:700;color:var(--accent);font-size:clamp(1.2rem,2.4vw,1.6rem);margin-top:.3em}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;
    font-family:var(--display);font-size:.9rem;color:var(--muted)}
  .nav button{font-family:var(--display);font-weight:600;border:1px solid var(--rule);background:var(--panel);
    color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer}
  .count{min-width:54px;text-align:center}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="hex"></div></div>
<div class="nav"><button id="prev">Back</button><span class="count" id="count"></span><button id="next">Next</button></div>
<script>
const S = [
  {t:'title', kicker:'A masterclass for wives', h:'Defying Gravity',
   sub:'How a wife rebuilds her marriage by coming back to herself', by:'with Candice Toone'},

  {t:'promise', kicker:'What this hour is for', h:'You are going to leave with a way to feel steady at home, whether or not he has changed a thing yet.',
   sub:'No ultimatums. No waiting on him. A path that starts with you.'},

  {t:'who', kicker:'Who this is for', h:'The wife who is tiptoeing.',
   bullets:['You hold your breath, waiting for the other shoe to drop','You have read the books and tried the scripts','You love him, and you still feel alone in it','You are tired of feeling like your happiness lives in his hands']},

  {t:'trap', kicker:'The trap', h:'You have been working on the wrong person.',
   p:'Five therapists. Advice from everyone. Years of trying to get him to be different so you could finally relax. And still the same knot in your chest.'},

  {t:'reframe', kicker:'The reframe', h:'The problem was never that you have not tried hard enough on him.',
   big:'The problem is that somewhere in the trying, you lost the one person this marriage still needs most. You.'},

  {t:'part', kicker:'Part one', h:'The core problem',
   p:'Your marriage still needs the very first thing you brought to it. The woman living deep inside you, whose dreams and desires got buried.'},

  {t:'mvp', kicker:'The sneakiest enemy', h:'MVP: making him your Most Valuable Person to the point that your whole state of mind runs on his mood.',
   p:'When his bad day becomes your bad day on repeat, you hand him the thermostat for your entire home.'},

  {t:'part', kicker:'Part two', h:'Defying gravity',
   p:'They say a bee should not be able to fly. It flies anyway. They say a marriage like yours cannot change unless he changes first. It can. And it starts with one person in the room.'},

  {t:'pillar', kicker:'Pillar one', h:'Your worth is non-negotiable.',
   p:'It does not rise and fall with what he implies about you on a hard day. You get to stop auditioning for a value you already have.'},

  {t:'pillar', kicker:'Pillar two', h:'Your peace does not depend on his mood.',
   p:'The Reaction Sequence: the quiet beat between what he does and what you do next is yours. That beat is where a stable home is built.'},

  {t:'pillar', kicker:'Pillar three', h:'You can love him and still disagree with the behavior.',
   p:'Loving someone unconditionally is not the same as approving of everything. You get to do both, out loud, without it blowing up the house.'},

  {t:'pillar', kicker:'Pillar four', h:'Come back to the woman living deep inside you.',
   p:'Her dreams did not die. They got buried under managing everyone else. Part of this work is digging her back out.'},

  {t:'tool', kicker:'A tool you can use tonight', h:'20 Seconds of Courage.',
   p:'Most of the change you want is on the other side of one 20-second act of courage, repeated. Not a confrontation. A small, honest move toward yourself.'},

  {t:'tool', kicker:'A tool you can use tonight', h:'Take off the Toddler Goggles.',
   p:'When you read his worst behavior as a grown man choosing to wound you, everything feels personal. Seeing the scared, limited part underneath changes what you do with it, without excusing it.'},

  {t:'part', kicker:'Part three', h:'What a stable home looks like',
   bullets:['You stop bracing for his mood before he walks in','You say the true thing in 20 seconds and let it land','You feel like yourself again, in your own kitchen','The connection you wanted starts to return, because you did']},

  {t:'why', kicker:'Why me', h:'I have stood where you are standing.',
   p:'Disconnected, afraid, convinced it was on him to fix. Five therapists did not move it. Coming back to myself did. Now I walk women through the same climb inside a community we call the Swarm Sisters.'},

  {t:'shift', kicker:'The shift', h:'You are not waiting for him anymore.',
   big:'You are rebuilding the home from the inside out, starting with the one brick that was always yours to place.'},

  {t:'how', kicker:'How we do this together', h:'Defying Gravity Rising',
   bullets:['Live group coaching calls twice a week','On-demand coaching when you are mid-moment','The full curriculum and the member podcast','A room full of women climbing the same hill']},

  {t:'cta', kicker:'Your next step', h:'Ready to rise?',
   cta:'Come build the stable home you were told could not happen.',
   p:'If today landed, the next step is to come inside Defying Gravity Rising and do the work with me and the Swarm Sisters.',
   disc:'This masterclass is educational and is not therapy or medical advice. Nothing here is a guaranteed result. Results vary from person to person.'}
];

const stage=document.getElementById('stage');
let i=0;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  const s=S[i];
  let h='<div class="hex"></div><div class="slide on">';
  if(s.kicker) h+='<p class="kicker">'+esc(s.kicker)+'</p>';
  if(s.h) h+= (s.t==='title'||s.t==='reframe'||s.t==='shift') ? '<h1>'+esc(s.h)+'</h1>' : '<h2>'+esc(s.h)+'</h2>';
  if(s.sub) h+='<p class="sub big">'+esc(s.sub)+'</p>';
  if(s.big) h+='<p class="big">'+esc(s.big)+'</p>';
  if(s.p) h+='<p>'+esc(s.p)+'</p>';
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li>'+esc(b)+'</li>');h+='</ul>';}
  if(s.cta) h+='<p class="cta-line">'+esc(s.cta)+'</p>';
  if(s.by) h+='<p class="by">'+esc(s.by)+'</p>';
  if(s.disc) h+='<p class="disc">'+esc(s.disc)+'</p>';
  h+='</div>';
  stage.innerHTML=h;
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
