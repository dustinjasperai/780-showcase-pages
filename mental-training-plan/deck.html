<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Focus Cycle — A Mental Training Plan Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101217;        /* deepened neutral-black from their dark scheme / #282626 */
    --panel:#181b22;
    --rule:#272b34;
    --ink:#f4f6fb;
    --muted:#aab2c2;
    --accent:#1d2cf3;    /* their vivid electric blue, exact ranked hex */
    --serif:'Playfair Display',Georgia,serif;
    --sans:'Inter',system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;border-bottom:1px solid var(--rule);position:relative}
  .kick{font-family:var(--sans);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:1.4rem}
  h1{font-family:var(--serif);font-weight:800;font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,4.4vw,3rem);line-height:1.1;letter-spacing:-.01em}
  .sub{font-size:clamp(1.05rem,1.9vw,1.5rem);color:var(--muted);margin-top:1.5rem;max-width:30ch}
  .lead{font-size:clamp(1.15rem,2.1vw,1.7rem);max-width:34ch;margin-top:1.3rem;color:var(--ink)}
  .part{font-family:var(--sans);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
  ul{list-style:none;margin-top:1.8rem;display:grid;gap:1rem;max-width:40ch}
  li{position:relative;padding-left:1.6rem;font-size:clamp(1rem,1.7vw,1.3rem);color:var(--ink)}
  li::before{content:'';position:absolute;left:0;top:.55em;width:.6rem;height:.6rem;background:var(--accent);border-radius:1px}
  .cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:2.4rem;max-width:62rem}
  .cycle .step{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:1.6rem}
  .cycle .n{font-family:var(--serif);font-weight:800;color:var(--accent);font-size:1.5rem}
  .cycle .st{font-family:var(--serif);font-weight:700;font-size:1.3rem;margin:.4rem 0 .5rem}
  .cycle .sd{color:var(--muted);font-size:.98rem}
  .big{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,4vw,3rem);max-width:24ch;line-height:1.12}
  .accentword{color:var(--accent)}
  .credit{color:var(--muted);margin-top:1.6rem;font-size:1.05rem;max-width:40ch}
  .cta-btn{display:inline-block;margin-top:2rem;background:var(--accent);color:#fff;font-weight:600;
    padding:.95rem 1.8rem;border-radius:8px;text-decoration:none;font-size:1.05rem}
  .disc{margin-top:2.4rem;color:var(--muted);font-size:.82rem;max-width:46ch;border-top:1px solid var(--rule);padding-top:1.1rem}
  .pg{position:absolute;bottom:2.2rem;right:9vw;color:var(--rule);font-size:.8rem;font-weight:600;letter-spacing:.1em}
  .brandmark{position:absolute;top:2.4rem;left:9vw;color:var(--muted);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
</style>
</head>
<body>
<main id="deck"></main>
<script>
/* The Focus Cycle masterclass — Ben Carnes / Mental Training Plan. Coach-owned content. */
const S=[
  {t:'title', kick:'A Mental Training Plan Masterclass with Ben Carnes',
   h:'Train the Mind Like You Train the Body',
   sub:'The Focus Cycle: how to stay confident, composed, and locked in when the moment gets big.'},

  {t:'who', part:'Who this is for',
   h:'You train hard. You still tighten up when it counts.',
   lead:'You have done the reps. Your body knows what to do. Then the big moment arrives and your mind takes the wheel.'},

  {t:'trap', part:'The trap',
   h:'You have been told to "just relax" and "be confident."',
   lead:'Nobody ever showed you how. Relax is not a skill. Confidence on command is.'},

  {t:'reframe', part:'The real problem',
   big:'Talent is not what fails under pressure. Your <span class="accentword">untrained mind</span> is.'},

  {t:'part', part:'Part One', h:'Why the big moment breaks good athletes'},

  {t:'point', part:'Part One',
   h:'Pressure does not make you worse.',
   lead:'Losing focus does. And the slip follows a pattern you can learn to see coming.'},

  {t:'point', part:'Part One',
   h:'Confidence and composure are skills, not personality traits.',
   lead:'So the real question is simple. How do you train them the same way you train strength and speed?'},

  {t:'part', part:'Part Two', h:'The Focus Cycle'},

  {t:'cycle', part:'Part Two', h:'One loop you can run on demand',
   steps:[
     {n:'01', st:'Recognize', sd:'Catch the slip early. The tight chest, the racing thoughts, the replay of the last mistake.'},
     {n:'02', st:'Reset', sd:'Reset in real time with trained tools: breathing, muscle control, self-talk, a reset routine.'},
     {n:'03', st:'Lock Back In', sd:'Refocus on the one thing that matters now. The next pitch, the next rep, the next shot.'}
   ]},

  {t:'point', part:'Part Two: Recognize',
   h:'You cannot fix what you do not notice.',
   lead:'Step one is awareness under fire. We train athletes to spot the first signal of a slip before it becomes a spiral.'},

  {t:'point', part:'Part Two: Reset',
   h:'You get about five seconds. Use them.',
   lead:'Breathing, muscle control, self-talk and a reset routine are not someday tools. They are trained responses you fire in the moment.'},

  {t:'point', part:'Part Two: Lock Back In',
   h:'Bring yourself back to one thing.',
   lead:'Your Go-To Statement is a personal line you rehearse so a trained response is ready the instant pressure spikes.'},

  {t:'point', part:'The tool',
   h:'The Go-To Statement',
   lead:'One rehearsed sentence that pulls you out of the spiral and back onto the next rep. Simple, personal, and trained until it is automatic.'},

  {t:'point', part:'The diagnostic',
   h:'You cannot train what you have not measured.',
   lead:'The Mental Game X-Ray gives a five minute snapshot of where confidence, focus and motivation are leaking, so training aims at the real gap.'},

  {t:'part', part:'Part Three', h:'What a trained athlete does differently'},

  {t:'point', part:'Part Three',
   h:'The athlete who used to unravel resets in one breath.',
   lead:'They play the next rep clean. The team that used to fold holds its edge when the game gets heavy.'},

  {t:'why', part:'Why me',
   h:'Ben Carnes',
   credit:'Fifteen plus years coaching the mental game. A former teacher and coach who built the Focus Cycle from one question: how do you train composure like a skill? Programs that run it have won state and national titles, athletes have broken out of slumps, and whole cultures have shifted toward confidence.'},

  {t:'point', part:'The difference',
   h:'This is a system, not a pep talk.',
   lead:'Mental training you can coach. A repeatable loop a team can run in minutes a week, the same way you run a strength program.'},

  {t:'point', part:'Recap',
   h:'Recognize. Reset. Lock back in.',
   lead:'Backed by the Mental Game X-Ray and your Go-To Statement. That is the Focus Cycle, on demand.'},

  {t:'cta', kick:'Your next step',
   h:'Ready to train the mind like you train the body?',
   lead:'Book your free discovery call and we will map your Focus Cycle together.',
   btn:'Schedule your free discovery call',
   disc:'This masterclass is for educational purposes only. It is not medical or psychological treatment. Results vary from athlete to athlete and are not guaranteed.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let body='';
  if(s.kick) body+=`<div class="kick">${s.kick}</div>`;
  if(s.part) body+=`<div class="part">${s.part}</div>`;
  if(s.h) body+= (s.t==='part') ? `<h2 style="margin-top:.8rem">${s.h}</h2>` : `<h1>${s.h}</h1>`;
  if(s.sub) body+=`<p class="sub">${s.sub}</p>`;
  if(s.lead) body+=`<p class="lead">${s.lead}</p>`;
  if(s.big) body+=`<p class="big">${s.big}</p>`;
  if(s.credit) body+=`<p class="credit">${s.credit}</p>`;
  if(s.steps){
    body+='<div class="cycle">'+s.steps.map(x=>`<div class="step"><div class="n">${x.n}</div><div class="st">${x.st}</div><div class="sd">${x.sd}</div></div>`).join('')+'</div>';
  }
  if(s.btn) body+=`<a class="cta-btn" href="https://calendly.com/mental-tr-plan/20-minute-free-consultation-call">${s.btn}</a>`;
  if(s.disc) body+=`<div class="disc">${s.disc}</div>`;
  body+=`<div class="brandmark">Mental Training Plan</div>`;
  body+=`<div class="pg">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=body;
  deck.appendChild(el);
});
</script>
</body>
</html>
