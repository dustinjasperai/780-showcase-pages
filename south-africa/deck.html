<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The South African Seller's Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b2f32;      /* Insaka deep teal ground */
    --panel:#116267;   /* Insaka dominant brand teal */
    --accent:#fdd72b;  /* Insaka brand yellow */
    --accent2:#f28815; /* Insaka orange */
    --muted:#d6e6e7;   /* Insaka pale teal */
    --ink:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:linear-gradient(180deg,rgba(17,98,103,.35),rgba(11,47,50,.2));border:1px solid rgba(214,230,231,.14);border-radius:18px;padding:52px 48px;margin:22px 0;min-height:70vh;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-family:"Bebas Neue",sans-serif;letter-spacing:.14em;font-size:20px;color:var(--accent);margin-bottom:16px}
  h1{font-family:"Bebas Neue",sans-serif;font-weight:400;letter-spacing:.01em;font-size:clamp(40px,6vw,78px);line-height:.98}
  h2{font-family:"Bebas Neue",sans-serif;font-weight:400;letter-spacing:.01em;font-size:clamp(30px,4.4vw,52px);line-height:1.02;margin-bottom:18px}
  p{font-size:clamp(17px,1.9vw,21px);line-height:1.55;color:var(--muted);max-width:40em}
  p.lead{color:var(--ink);font-size:clamp(19px,2.2vw,24px)}
  .big{color:var(--accent)}
  .rule{height:4px;width:68px;background:var(--accent);border-radius:3px;margin:22px 0}
  ul{list-style:none;margin-top:10px}
  li{position:relative;padding:12px 0 12px 40px;font-size:clamp(16px,1.9vw,20px);color:var(--muted);border-bottom:1px solid rgba(214,230,231,.1)}
  li::before{content:"";position:absolute;left:0;top:19px;width:16px;height:16px;background:var(--accent);border-radius:3px}
  .lv{display:flex;align-items:baseline;gap:18px}
  .lv .n{font-family:"Bebas Neue",sans-serif;font-size:clamp(54px,9vw,120px);color:var(--panel);line-height:.8;-webkit-text-stroke:2px var(--accent)}
  .foot{font-size:14px;color:rgba(214,230,231,.6);margin-top:26px}
  .card{background:var(--panel);border-radius:14px;padding:26px 28px;margin-top:14px}
  .disc{font-size:13px;color:rgba(214,230,231,.55);margin-top:28px;max-width:46em;line-height:1.5}
  .cta-line{font-family:"Bebas Neue",sans-serif;font-size:clamp(26px,3.4vw,40px);color:var(--accent);margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:"A FREE LIVE MASTERCLASS WITH WARRICK KERNES", h:"The South African Seller's Playbook",
   lead:"How to go from no store to a sales-ready online business, the South African way. Find a winning product, build the store, and get your first real sales.", foot:"Insaka eCommerce Academy"},

  {t:'bullets', eyebrow:"WHO THIS IS FOR", h:"You want to sell online. You just want it to actually work.",
   bullets:[
     "You are brand new, with no products and no store yet, and you are ready to start.",
     "You have a store live already, but the orders are slow and you are not sure why.",
     "You are selling, and now you want to grow it into a real business."
   ], foot:"If any of those is you, this hour is built for you."},

  {t:'statement', eyebrow:"THE TRAP", h:"Most South African sellers do not fail from lack of effort.",
   lead:"They pour months into a logo, a theme, a name, and a storefront nobody visits. The work feels like progress. The sales never come. Then they decide “online does not work here” and quit."},

  {t:'statement', eyebrow:"THE REFRAME", h:"A store is not a business. A selling system is.",
   lead:"The sellers who make it do not start with the prettiest shop. They start with the right product, a store built to convert, and a deliberate way to bring buyers in. Everything else is decoration."},

  {t:'statement', eyebrow:"PART ONE: THE REAL PROBLEM", h:"It almost always starts with the product.",
   lead:"The number one reason a South African store never makes a first sale is the wrong product. Not enough demand, margins too thin, or something a local buyer can get cheaper and faster somewhere else.",
   body:"Get the product right and everything downstream gets easier. Get it wrong and no amount of marketing saves it."},

  {t:'statement', eyebrow:"PART ONE: THE REAL PROBLEM", h:"Then it is the gap between a store and a sale.",
   lead:"Even with a good product, most stores leak at every step: a page that does not build trust, a checkout that loses people, no local payment option they recognise, and no plan to get traffic in the first place.",
   body:"Each leak looks small. Together they are the whole difference between a hobby and an income."},

  {t:'statement', eyebrow:"PART TWO: THE PATH", h:"Five levels, from zero to scaled.",
   lead:"This is the exact climb I take every seller through at Insaka. Each level only matters once the one before it is solid. You are never guessing what comes next."},

  {t:'level', n:"01", h:"Foundations for Success", lead:"Choose a product people actually want. Sort suppliers, importing and the basics before you spend a cent on a store."},
  {t:'level', n:"02", h:"Building Your Online Store", lead:"Stand up a real store on Shopify or your own site, with payments and fulfilment that work for South African buyers."},
  {t:'level', n:"03", h:"Improving and Optimising", lead:"Turn visitors into buyers. Build trust, fix the product pages, and remove the friction that quietly kills sales."},
  {t:'level', n:"04", h:"Growing Your Online Sales", lead:"Bring in traffic on purpose, with Facebook, Google, SEO, email and the marketplaces like Takealot."},
  {t:'level', n:"05", h:"Scaling Your Business", lead:"Build the team, the finances, the stock and the systems so the store grows without running you into the ground."},

  {t:'card', eyebrow:"PART THREE: THE FINISH LINE", h:"A sales-ready South African store.",
   card:"A proven product. A store built to convert. Local payments buyers trust. A marketplace presence on Takealot where the buyers already are. And a repeatable way to bring new customers in every week.",
   foot:"That is the finish line of this masterclass, and the starting line of a real business."},

  {t:'bullets', eyebrow:"WHY LISTEN TO ME", h:"I have built this in South Africa, not just taught it.",
   bullets:[
     "In eCommerce since 2008. Founded Action Gear, South Africa's first GoPro retailer.",
     "Over R130 million in personal online sales, with stores taken from zero to over R20 million a year.",
     "Shopify Top Education Partner, and I have helped more than 100,000 South African online sellers."
   ]},

  {t:'statement', eyebrow:"THE WHOLE THING IN ONE BREATH", h:"Right product. Store that converts. Traffic on purpose.",
   lead:"Nail those three and you have a selling system, not just a storefront. The five levels are simply how you build each one in the right order."},

  {t:'cta', eyebrow:"YOUR NEXT STEP", h:"Ready to build your sales-ready store?",
   lead:"eCommerce Next Level is the complete step-by-step program that takes you from no experience to a store that sells, with the full 5-level path, the tools, and support the whole way.",
   ctaLine:"Join eCommerce Next Level and start today.",
   disc:"Educational content only. No income or result is guaranteed. Results vary and depend on your own effort, product, market and execution. Figures shown are the presenter's own documented results and are not typical."}
];

function slideHTML(s){
  const eye = s.eyebrow ? `<div class="eyebrow">${s.eyebrow}</div>` : '';
  const foot = s.foot ? `<div class="foot">${s.foot}</div>` : '';
  if(s.t==='title') return `${eye}<h1>${s.h}</h1><div class="rule"></div><p class="lead">${s.lead}</p>${foot}`;
  if(s.t==='statement') return `${eye}<h2>${s.h}</h2><p class="lead">${s.lead}</p>${s.body?`<p>${s.body}</p>`:''}`;
  if(s.t==='bullets') return `${eye}<h2>${s.h}</h2><ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>${foot}`;
  if(s.t==='level') return `${eye}<div class="lv"><div class="n">${s.n}</div><div><h2>${s.h}</h2><p class="lead">${s.lead}</p></div></div>`;
  if(s.t==='card') return `${eye}<h2>${s.h}</h2><div class="card"><p class="lead" style="color:#fff">${s.card}</p></div>${foot}`;
  if(s.t==='cta') return `${eye}<h1>${s.h}</h1><div class="rule"></div><p class="lead">${s.lead}</p><div class="cta-line">${s.ctaLine}</div><p class="disc">${s.disc}</p>`;
  return '';
}
document.getElementById('deck').innerHTML = S.map(s=>`<section class="slide">${slideHTML(s)}</section>`).join('');
</script>
</body>
</html>
