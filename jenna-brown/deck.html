<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Neuro Alchemy Method - Jenna Brown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ef;        /* her warm cream ground (light scheme, from #e6e6dc) */
    --panel:#ffffff;
    --ink:#2b2b2d;       /* her dominant near-black */
    --muted:#55636f;     /* her slate */
    --rule:#e3ddd4;      /* hairline from her cream */
    --accent:#ff50a8;    /* her signature hot pink */
    --display:'Prata',Georgia,serif;
    --sans:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:64px 60px;margin:0 0 30px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 40px rgba(43,43,45,.05)}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1}
  .sub{font-family:var(--display);font-weight:500;font-size:26px;color:var(--muted);margin-top:18px;font-style:italic}
  .lede{font-size:21px;line-height:1.6;color:var(--ink);font-weight:300;margin-top:10px;max-width:40ch}
  .body{font-size:19px;line-height:1.65;color:var(--ink);font-weight:300;margin-top:20px;max-width:46ch}
  .byline{margin-top:40px;font-size:16px;letter-spacing:.04em;color:var(--muted)}
  .byline b{color:var(--ink);font-weight:600}
  ul{margin-top:24px;list-style:none;max-width:48ch}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.5;font-weight:300;margin-bottom:16px}
  li:before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .num{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);border:1.5px solid var(--accent);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
  .kicker{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .part{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
  .disclaimer{margin-top:30px;font-size:13px;line-height:1.6;color:var(--muted);max-width:60ch;font-weight:300}
  .count{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;margin:-14px 6px 26px 0}
  .cta-line{font-family:var(--display);font-size:24px;color:var(--ink);margin-top:10px}
  hr.r{border:none;border-top:1px solid var(--rule);margin:30px 0 0;max-width:220px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Jenna Brown',h1:'The Neuro Alchemy Method',sub:'Rewire the subconscious blocks capping you at six figures',byline:'With <b>Jenna Brown</b> &middot; Wealth &amp; Business Mentor for Women Coaches'},

 {t:'promise',kicker:'What you will walk away with',h2:'One hour. Three shifts. A clearer path to 20K months.',bullets:['Why your income keeps hitting the same ceiling even when your strategy is solid','The exact subconscious patterns that quietly cap what you let yourself earn','A live clearing of one money block, worked in the room, using the Neuro Alchemy Method']},

 {t:'who',part:'Who this is for',h2:'The woman coach who has already done the work.',body:'You have a real offer, real results, and you have taken the courses. On paper you should be scaling. Instead you keep landing back at the same revenue, raising prices feels like a threat, and visibility makes you want to hide. This hour is for you.'},

 {t:'trap',part:'The trap',h2:'You keep buying more strategy for an internal problem.',body:'Another funnel. Another framework. Another launch plan. Each one works for a while, then the old number pulls you back. The issue was never the plan. It is the set-point running underneath it.'},

 {t:'reframe',kicker:'The reframe',h2:'Your income is a thermostat, not a ladder.',lede:'A ladder says: do more, climb higher. A thermostat says: you will unconsciously cool things back down the moment you pass the number you believe you are allowed to hold. Scaling is a set-point problem first and a strategy problem second.'},

 {t:'part',part:'Part One',h2:'The subconscious revenue ceiling',body:'Most of what drives your money behavior was decided before you ever ran a business. The pricing you avoid, the follow-up you forget, the launch you quietly self-sabotage. These are not discipline failures. They are the nervous system protecting an old identity.'},

 {t:'why',kicker:'Why willpower fails',h2:'You cannot out-discipline a protective pattern.',body:'Willpower runs on the conscious mind. Your money set-point runs on the subconscious, and it is far older and far stronger. This is why the mindset journaling helps for a week and then fades. To move the number you have to work at the level the pattern actually lives on.'},

 {t:'framework',part:'Part Two',h2:'The Neuro Alchemy Method',lede:'A fusion of clinical subconscious tools and feminine energetics, built for business. Four moves that reset what you are able to hold and keep.'},

 {t:'pillar',num:'1',kicker:'Pillar One',h2:'The Money Set-Point',body:'We find the specific ceiling you default to and the story holding it in place. Naming it is the first move. You cannot shift a number you have never actually looked at.'},

 {t:'pillar',num:'2',kicker:'Pillar Two',h2:'Rapid Clearing',body:'Using RRT, NLP and hypnosis, we neutralize the charge on the blocks that run the ceiling: imposter feelings, the fear of being seen, the overwhelm that shows up right before a jump. This is the live, felt part of the method.'},

 {t:'pillar',num:'3',kicker:'Pillar Three',h2:'Wealth Embodiment',body:'Money Codes and Confidence Codes. We install the identity that can comfortably hold the next level, because health and self-worth are the real keys to wealth. You stop chasing the number and start becoming the person it belongs to.'},

 {t:'pillar',num:'4',kicker:'Pillar Four',h2:'Aligned Scaling',body:'Now the strategy lands. We line up the external moves, offers, visibility, sales, with the internal shift, so growth feels like ease and alignment instead of hustle. Internal and external, together. That is how 20K months become normal.'},

 {t:'part',part:'Part Three',h2:'Inside your next level of wealth',body:'Pricing your offer at its real value without the flinch. Selling from calm instead of scarcity. Showing up visible because being seen no longer costs you anything. The month you used to hope for becoming the month you expect.'},

 {t:'shift',kicker:'The shift',h2:'From forcing growth to allowing it.',bullets:['Raising prices feels like a decision, not a risk','Launches run without the pre-launch dread','The income ceiling you kept hitting stops being the ceiling']},

 {t:'whyme',part:'Why me',h2:'I built this because I lived it.',body:'Five years ago I was in a friend’s guest bedroom with two kids and a thousand-dollar car, fighting for my life in a hospital bed. I rebuilt everything by changing what ran underneath the business first. Trained in RRT, NLP, hypnosis and EFT, I now mentor women to scale internally and externally. Money belongs in the hands of women.'},

 {t:'recap',kicker:'The one hour, recapped',h2:'The ceiling is internal. The method is specific.',bullets:['Part One: the subconscious revenue ceiling and why willpower cannot move it','Part Two: the four moves of the Neuro Alchemy Method','Part Three: what aligned scaling to 20K months actually looks like']},

 {t:'cta',eyebrow:'Your next step',h1:'Ready to clear the path?',cta:'If today opened something, the next step is the Sacred Scaling Mastermind, where we do this work together over the months it takes to make 20K months your normal.',sub:'Apply at iamjennabrown.com',disclaimer:'This masterclass is for education only. It is not financial, medical, or psychological advice and is not a substitute for professional care. No income, earnings, or specific results are promised or guaranteed. Individual results vary and depend on many factors outside any program.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.count!==false){}
  if(s.eyebrow)h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.part)h+='<div class="part">'+s.part+'</div>';
  if(s.kicker)h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.num)h+='<div class="num">'+s.num+'</div>';
  if(s.h1)h+='<h1>'+s.h1+'</h1>';
  if(s.h2)h+='<h2>'+s.h2+'</h2>';
  if(s.sub)h+='<div class="sub">'+s.sub+'</div>';
  if(s.lede)h+='<div class="lede">'+s.lede+'</div>';
  if(s.cta)h+='<div class="cta-line">'+s.cta+'</div>';
  if(s.body)h+='<div class="body">'+s.body+'</div>';
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li>'+b+'</li>');h+='</ul>';}
  if(s.byline)h+='<div class="byline">'+s.byline+'</div>';
  if(s.disclaimer)h+='<hr class="r"><div class="disclaimer">'+s.disclaimer+'</div>';
  el.innerHTML='<div class="count">'+(i+1)+' / '+S.length+'</div>'+h;
  deck.appendChild(el);
});
</script>
</body>
</html>
