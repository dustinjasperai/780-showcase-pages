<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Unstoppable Executive — a live masterclass with Colin Hiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7f8;        /* light ground, from site site_scheme:light */
    --panel:#ffffff;
    --ink:#292d38;       /* dominant slate, 75 uses */
    --muted:#6b7280;
    --rule:#e4e6ea;
    --accent:#01b2f7;    /* the site's only chromatic colour */
    --display:'Questrial',system-ui,sans-serif;
    --body:'Cabin',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 56px 52px;
    margin:0 0 26px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .eyebrow{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:400;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.1;margin-bottom:18px}
  h3{font-family:var(--body);font-weight:700;font-size:20px;margin-bottom:10px}
  p{font-size:19px;line-height:1.62;color:var(--ink);max-width:60ch;margin-bottom:14px}
  p.lead{font-size:22px;color:var(--muted)}
  .kicker{font-family:var(--display);font-size:16px;color:var(--muted);margin-bottom:28px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 34px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent)}
  .pill{display:inline-block;font-family:var(--body);font-weight:600;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:5px 14px;margin-bottom:22px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:8px}
  .cell{border:1px solid var(--rule);border-radius:10px;padding:22px}
  .cell h3{color:var(--ink)}
  .cell.bad h3{color:var(--muted)}
  .cell.good{border-color:var(--accent)}
  .ring{position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:2px solid var(--rule)}
  .ring::after{content:"";position:absolute;inset:34px;border-radius:50%;border:2px solid var(--rule)}
  .ring::before{content:"";position:absolute;inset:68px;border-radius:50%;border:3px solid var(--accent)}
  .big{font-family:var(--display);font-size:72px;color:var(--accent);line-height:1;margin-bottom:10px}
  .note{font-size:14px;color:var(--muted);margin-top:22px;max-width:62ch}
  .cta h1{font-size:46px}
  .step{font-family:var(--display);font-size:15px;color:var(--accent);margin-bottom:14px;letter-spacing:.04em}
  @media(max-width:640px){
    .slide{padding:36px 26px}
    h1{font-size:38px}.cta h1{font-size:34px}h2{font-size:28px}.two{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:'title'},
  {t:'who'},
  {t:'trap'},
  {t:'reframe'},
  {t:'part',n:'Part One',h:'The real problem is not discipline',p:'If willpower worked, every high performer would already have the habits they want. They do not, because willpower is the wrong tool. Habits sit downstream of two things you can actually change: your identity and your environment.'},
  {t:'identity'},
  {t:'environment'},
  {t:'part',n:'Part Two',h:'The system, three frameworks',p:'This is the method behind the programs, built over thirty years of working with executives and elite performers. Each framework does one job.'},
  {t:'f1'},
  {t:'f2'},
  {t:'f3'},
  {t:'part',n:'Part Three',h:'What a rebuilt week looks like',p:'You do not add more to the calendar. You redesign a few anchor points so the new identity has somewhere to live, and the environment does the remembering for you.'},
  {t:'week'},
  {t:'why'},
  {t:'recap'},
  {t:'cta',disc:'Educational content only. No result is guaranteed. Results vary with effort, circumstances and consistency.'}
];

function el(html){const d=document.createElement('div');d.className='slide';d.innerHTML=html;return d;}

const R={
  title:()=>`<div class="ring"></div>
    <div class="eyebrow">A live masterclass with Colin Hiles</div>
    <h1>The Unstoppable Executive</h1>
    <p class="lead">How high performers rebuild their habits without relying on willpower.</p>`,
  who:()=>`<div class="eyebrow">Who this is for</div>
    <h2>You are not lazy. You are busy and human.</h2>
    <p>This hour is for executives and senior leaders who keep setting the same goals, start strong on Monday, and are back to the old pattern by Tuesday.</p>
    <p>You have already proven you can perform. What you have not been handed is a way to make the right behaviour automatic.</p>`,
  trap:()=>`<div class="pill">The trap</div>
    <h2>"I just need to be more disciplined."</h2>
    <p>Every productivity book you have read quietly assumes the same thing: that if you wanted it badly enough, you would grind it out.</p>
    <p>So when the habit slips, you blame yourself. You promise to try harder next week. And the cycle repeats, because effort was never the missing piece.</p>`,
  reframe:()=>`<div class="ring"></div>
    <div class="eyebrow">The reframe</div>
    <h2>Willpower is a battery, not a character trait.</h2>
    <p>It drains through the day. By the evening, the exact moment your good habits need it most, there is nothing left. Relying on it guarantees the relapse.</p>
    <p class="lead">So we stop relying on it.</p>`,
  part:(s)=>`<div class="step">${s.n}</div><h2>${s.h}</h2><p>${s.p}</p>`,
  identity:()=>`<div class="eyebrow">Lever one</div>
    <h2>Habits are a reflection of your identity.</h2>
    <p>New results flow from new habits, and new habits flow from a new identity. You do not "do" the behaviour of someone fit, focused and in control. You first decide you are that person, and the behaviour follows.</p>
    <p>Change the sentence you use about yourself and you change what feels natural to do.</p>`,
  environment:()=>`<div class="eyebrow">Lever two</div>
    <h2>Let the brain be lazy, on purpose.</h2>
    <p>Your brain is wired to take the easy path. Instead of fighting that, we design the environment so the right choice is the easy one and the wrong choice is a hassle.</p>
    <p>This is the escape from the "It must be me" trap. It was never you. It was a setup that made the old habit effortless.</p>`,
  f1:()=>`<div class="step">Framework 1</div>
    <h2>The Science of Behavioural Change</h2>
    <p>A step-by-step way to install a behaviour so it survives a bad week: name the identity, shrink the first action, and engineer the cue so the environment starts it for you.</p>
    <ul><li>Decide who this makes you</li><li>Make the first step almost too small to skip</li><li>Put the cue where you cannot miss it</li></ul>`,
  f2:()=>`<div class="step">Framework 2</div>
    <h2>The MASTERS framework</h2>
    <p>The antidote to procrastination, the number one dream stealer. We walk the seven sources of influence that quietly drive behaviour, then flip the ones working against you.</p>
    <p>When all seven pull the same direction, the thing you have been avoiding stops feeling like a fight.</p>`,
  f3:()=>`<div class="step">Framework 3</div>
    <h2>The Science of Goal Setting</h2>
    <p>Clarity plus "why power." One clear number one goal, the real reason underneath it, and a ninety day structure so progress is visible instead of vague.</p>
    <ul><li>One goal, not ten</li><li>A reason strong enough to get you out of bed</li><li>Ninety days, broken into weekly wins</li></ul>`,
  week:()=>`<h2>The same week, redesigned</h2>
    <div class="two">
      <div class="cell bad"><h3>Running on willpower</h3>
        <p>Wake, grab the phone, react to the inbox. Promise to train later. Decide dinner at 7pm on an empty tank. Relapse by Tuesday.</p></div>
      <div class="cell good"><h3>Running on identity + design</h3>
        <p>Move first, before any decision. Deep work with the phone in the drawer. A hard stop at the end of the day. Three anchors, the rest looks after itself.</p></div>
    </div>`,
  why:()=>`<div class="ring"></div>
    <div class="eyebrow">Why listen to me</div>
    <h2>Thirty years turning this into a method.</h2>
    <p>I have spent three decades blending the art and science of behavioural change, and I have taught it to leaders and teams at Barclays, GSK, Deloitte, Unilever and BT, among others.</p>
    <p>The frameworks in this hour are the same ones those executives used. Nothing here is theory I have not watched work in a real calendar.</p>`,
  recap:()=>`<div class="eyebrow">In one breath</div>
    <h2>Stop recruiting willpower. Rebuild the identity and redesign the environment.</h2>
    <ul><li>Decide who you are becoming</li><li>Make the right behaviour the easy one</li><li>One goal, ninety days, weekly wins</li></ul>`,
  cta:(s)=>`<div class="ring"></div>
      <div class="step">Your next step</div>
      <h1>Ready to rebuild it properly?</h1>
      <p>If you want the full system, with the frameworks, the workbooks and my support alongside you, that is the Life Mastery Programme.</p>
      <p class="lead">Come and build the next ninety days with me.</p>
      <p class="note">${s.disc}</p>`
};

const deck=document.getElementById('deck');
S.forEach(s=>{ deck.appendChild(el(R[s.t](s))); });
</script>
</body>
</html>
