<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideas Get You Booked, a masterclass with Alex Merry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1A37;
    --panel:#12264A;
    --rule:#25396180;
    --ink:#F3F1E7;
    --muted:#AEB9CE;
    --accent:#F6C402;
    --accent2:#1863DC;
    --head:'Raleway',system-ui,sans-serif;
    --body:'Roboto',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(0,0,0,.34);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* spotlight motif: a gold beam from the top-right edge of the stage, and the lit mark */
  .slide::before{content:'';position:absolute;top:-160px;right:-40px;width:340px;height:340px;
    background:radial-gradient(circle at 70% 30%,rgba(246,196,2,.20),rgba(246,196,2,0) 62%);pointer-events:none}
  .slide::after{content:'';position:absolute;top:30px;right:32px;width:12px;height:12px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 6px rgba(246,196,2,.16)}
  .kick{font-family:var(--head);font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:800;font-size:62px;line-height:1.04;margin:0 0 18px;letter-spacing:-.015em;color:var(--ink)}
  h2{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.09;margin:0 0 20px;letter-spacing:-.01em;color:var(--ink)}
  h3{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:47ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 42px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:4px;top:23px;width:14px;height:14px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(246,196,2,.16)}
  li b{font-weight:700}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:104px;line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .strike{color:transparent;-webkit-text-stroke:2px #F3F1E766;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:6px;background:var(--accent);transform:rotate(-2deg);border-radius:3px}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:25px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .who{font-size:19px;color:var(--muted);margin-top:auto;padding-top:22px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:64ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:40px}h2{font-size:30px}.big{font-size:60px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">MicDrop · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'Ideas Get You Booked',p:'How founders turn one sharp idea into a steady stream of high-stakes speaking opportunities.',pres:'With <b>Alex Merry</b>, founder of MicDrop and TEDxClapham'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why great speakers get picked','The real reason an organiser says yes, and it is not your story.'],['The idea worth building a stage around','How to find the one message the right room will pay to hear.'],['A pipeline, not a one-off','How a single talk turns into the next three.']]},
 {t:'audience',kick:'Who this is for',h:'You have the credibility. You are still waiting to be asked.',p:'Founders, scale-up leaders and consultants who are brilliant in the room they already own, and want the stage, the podcast and the keynote to start coming to them, on the strength of what they think.',who:'<b>The trap:</b> you keep polishing how you tell your story, while the people getting booked are the ones with a sharper idea.'},
 {t:'reframe',kick:'The reframe',big1:'Tell a better story.',big2:'Own a sharper <span class="em">idea</span>.',p:'Your story might get you noticed. It is your idea that gets you booked. Organisers do not book a biography, they book a point of view their audience needs to hear. The work is not more polish on the telling, it is a stronger thing to say.'},
 {t:'stakes',kick:'The stakes',h:'A vague message is an empty calendar.',p:'When your message could belong to any of a hundred capable people, you are a nice-to-have. The founders who get booked, quoted and paid are not louder, they are clearer about the one idea they own, and everyone else defaults to whoever is obvious.'},
 {t:'part',kick:'Part one',h:'Why the right people never get asked.'},
 {t:'point',kick:'The core problem',h:'You are speaking wherever you are invited.',p:'Most leaders take the stages that come to them and hope one lands. Without a deliberate choice of message and audience, every talk starts from zero and none of them compound into the next opportunity.'},
 {t:'point',kick:'The core problem',h:'Story-first advice quietly caps you.',p:'The default coaching is to be more vulnerable, more polished, more you. It helps you connect, but it does not answer the organiser question, which is why this room, right now, needs to hear from you specifically.'},
 {t:'signs',kick:'The core problem',h:'The signs you are leading with the wrong thing.',li:[['You get great feedback and no bookings','The talk lands in the room and nothing follows it.'],['Your bio does the heavy lifting','You are chosen for your title, not your point of view.'],['Every talk starts from scratch','No throughline, so no momentum from one stage to the next.']]},
 {t:'part',kick:'Part two',h:'The Speaker Snapshot.'},
 {t:'framework',kick:'The model',h:'Speaker market fit, in four moves.',row:[['Clarity','Find the market that pays and the one idea it needs.'],['Credibility','Become the obvious choice, not a capable option.'],['Demand','Build a pipeline that compounds instead of one-off gigs.'],['Deliver','Convert the room into the next opportunity.']],p:'The right message, for the right audience, at the right time. Miss the fit and even a great talk goes nowhere.'},
 {t:'point',kick:'Move one: clarity',h:'Find the market that pays.',p:'Before the talk, the choice: which audience has a problem your idea solves, and the budget and stages to match. Speaker market fit is picking that room on purpose instead of speaking anywhere that will have you.'},
 {t:'point',kick:'Move two: credibility',h:'Become the obvious choice.',p:'Assemble the proof, the positioning and the one signature idea that make an organiser pick you without looking for a second option. Credibility is not your CV, it is being known for a specific thing worth booking.'},
 {t:'point',kick:'Move three: demand',h:'Build a pipeline that compounds.',p:'One talk should create the next three. A repeatable way to turn each appearance into referrals, follow-on invitations and inbound, so your calendar fills forward instead of resetting after every event.'},
 {t:'point',kick:'Move four: deliver',h:'Convert every opportunity.',p:'Design the talk so the room takes the next step, the intro, the funding conversation, the client call, not just the applause. A talk that moves people is the start of the pipeline, not the end of the work.'},
 {t:'part',kick:'Part three',h:'What changes when the idea leads.'},
 {t:'looks',kick:'The outcome',h:'The same expertise, finally getting asked.',li:[['You are known for one idea','Organisers can say in a sentence why the room needs you.'],['The stages start coming to you','Each talk seeds the next, so the pipeline runs forward.'],['Speaking becomes a growth engine','The room converts into funding, clients and reputation.']]},
 {t:'whyme',kick:'Why Alex',h:'A curator and operator, not a performance coach.',li:[['Founder of TEDxClapham','I choose and shape talks from the organiser side of the table, so I know why a yes happens.'],['A former startup COO','I treat speaking as go-to-market, a pipeline to build, not a performance to survive.'],['Ideas that moved rooms','Talks I have worked on have gone viral, shifted legislation and helped founders raise over 300 million pounds.']]},
 {t:'cta',kick:'Your next step',h:'Ready to own the idea that gets you booked?',ctas:['<b>Book a call with Alex</b> to map the one idea your market will pay to hear.','<b>Join MicDrop</b>, the community of founders building their way to sought-after speaker.'],disc:'This masterclass is educational. It shares frameworks and approaches for speaking and thought leadership; it is not advice for your specific situation and not a guarantee of bookings, income or any particular result. Outcomes vary.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
