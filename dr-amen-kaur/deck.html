<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capable, Driven, Still Stuck — A Masterclass with Dr. Amen Kaur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4;      /* her site ground (brand.json) */
    --ink:#2f4858;     /* her dominant slate-teal (brand.json) */
    --muted:#43515c;   /* her muted slate (brand.json) */
    --cream:#e8dccb;   /* her warm cream accent (brand.json) */
    --tan:#d6cbb9;     /* her warm tan (brand.json) */
    --display:'Spectral',Georgia,serif;
    --body:'Jost',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--cream);border-radius:4px;
    padding:64px 60px;margin:0 0 26px;min-height:540px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
  }
  .slide.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.dark .eyebrow{color:var(--tan)}
  .slide.dark .rule{background:var(--tan)}
  .eyebrow{font-family:var(--body);font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--muted)}
  .rule{width:54px;height:2px;background:var(--cream);margin:18px 0 26px}
  h1{font-family:var(--display);font-weight:500;font-size:62px;line-height:1.04;letter-spacing:.2px}
  h2{font-family:var(--display);font-weight:500;font-size:46px;line-height:1.08}
  h3{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.14;margin-bottom:6px}
  .sub{font-family:var(--body);font-weight:300;font-size:21px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:40ch}
  .slide.dark .sub{color:var(--cream)}
  .lead{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.3;max-width:24ch}
  p.body{font-size:19px;line-height:1.6;font-weight:300;margin-top:16px;max-width:52ch;color:var(--muted)}
  .slide.dark p.body{color:var(--cream)}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:60ch}
  li{font-size:19px;line-height:1.5;font-weight:300;padding-left:26px;position:relative;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:1px;background:var(--ink);opacity:.6}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:30px}
  .cell{border:1px solid var(--cream);border-radius:3px;padding:18px 14px}
  .cell .n{font-family:var(--display);font-size:22px;color:var(--muted)}
  .cell .t{font-size:15px;margin-top:8px;font-weight:400}
  .phases{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;margin-top:26px;max-width:64ch}
  .phase{display:flex;gap:14px;align-items:baseline;font-size:17px;font-weight:300;color:var(--muted)}
  .phase b{font-family:var(--display);font-size:22px;color:var(--ink);font-weight:500;min-width:28px}
  .cred{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;margin-top:28px;max-width:60ch}
  .cred div{font-size:18px;font-weight:300;color:var(--muted);padding-left:22px;position:relative}
  .cred div::before{content:"";position:absolute;left:0;top:11px;width:10px;height:1px;background:var(--cream)}
  .pagenum{position:absolute;bottom:22px;right:26px;font-size:12px;letter-spacing:.1em;color:var(--muted);opacity:.6}
  .disclaimer{font-size:13px;line-height:1.5;color:var(--cream);margin-top:30px;max-width:60ch;opacity:.85}
  .cta-line{font-family:var(--body);font-weight:400;font-size:20px;margin-top:22px;color:var(--cream)}
  @media(max-width:720px){.slide{padding:44px 26px;min-height:auto}h1{font-size:40px}h2{font-size:32px}.grid5{grid-template-columns:1fr 1fr}.phases,.cred{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',cls:'dark',eyebrow:'A live masterclass with Dr. Amen Kaur',h:'Capable. Driven.<br>Still Stuck.',sub:'Why high-achieving women stop trusting themselves to start over, and the first step back.'},

  {t:'statement',eyebrow:'Who this is for',lead:'You are capable, driven, and have achieved real success. And you still feel stuck when it comes to your next move.',body:'You have tried mindset work, willpower, and strategy. You know by now that is not the missing piece. You keep telling yourself you are not ready yet, even though you know exactly what you want.'},

  {t:'statement',cls:'dark',eyebrow:'The reframe',lead:'Somewhere along the way, even the most capable people stop trusting themselves to begin again.',body:'Success can quietly erode your belief that you are capable of starting over. The block is rarely the skills. It is the relationship with yourself.'},

  {t:'section',eyebrow:'Part One',h:'Why the usual fixes stop working'},

  {t:'content',h3:'Willpower has a ceiling',body:'Willpower and strategy alone do not hold under pressure. Once you are already successful, the mindset tips and the push-through methods quietly stop working, because they were never reaching the layer the pattern actually lives in.'},

  {t:'content',h3:'The achievement paradox',body:'The more you achieve, the more you have to protect, and the less you trust yourself to risk beginning again. High achievement and self-doubt are not opposites. They often grow together.'},

  {t:'content',h3:'The pattern underneath',body:'There is a hidden emotional pattern that makes capable people delay decisions they already know how to make. It convinces you that you are not ready yet, and it runs below conscious thought, which is exactly why thinking harder has not moved it.'},

  {t:'section',eyebrow:'Part Two',h:'The Human Intelligence Framework'},

  {t:'framework3',eyebrow:'Three moves',h2:'See it. Release it. Compound it.',items:[
    {n:'01',title:'See the pattern',desc:'Name the exact nervous system and emotional pattern keeping you stuck, instead of fighting a symptom.'},
    {n:'02',title:'Let go of the limitation',desc:'Update the brain’s self-perception at the root using research-backed methods, not affirmations.'},
    {n:'03',title:'Build and compound on your value',desc:'Log real evidence of your value daily until self-trust becomes the default, not the exception.'}
  ]},

  {t:'five',eyebrow:'One aligned system',h2:'Five intelligences, working together',body:'Lasting change comes from alignment, bringing these into one system instead of letting them fight each other.',cells:[
    {n:'I',t:'Nervous System'},{n:'II',t:'Emotional'},{n:'III',t:'Intuitive'},{n:'IV',t:'Cognitive'},{n:'V',t:'Action'}
  ]},

  {t:'phases',eyebrow:'The arc of the work',h2:'The 7 Phases of Self-Mastery',phases:[
    {n:'1',txt:'The Return, a new sense of purpose'},
    {n:'2',txt:'Nervous System Intelligence, new confidence'},
    {n:'3',txt:'Emotional Intelligence, new freedom'},
    {n:'4',txt:'Intuitive Intelligence, new self-belief'},
    {n:'5',txt:'Cognitive Intelligence, new clarity'},
    {n:'6',txt:'Action Intelligence, renewed motivation'},
    {n:'7',txt:'The Compounding Return, a lasting legacy'}
  ]},

  {t:'statement',cls:'dark',eyebrow:'The shift',lead:'Alignment is the point. Not more effort.',body:'When your nervous system, emotions, intuition, cognition, and energy stop fighting each other, the decision you have been delaying stops feeling like a risk. It starts feeling like a return.'},

  {t:'section',eyebrow:'Part Three',h:'After the pattern breaks'},

  {t:'list',eyebrow:'What changes',h2:'From proving your worth to knowing it',items:[
    'You trust your own judgment again, after years of overriding it to keep achieving.',
    'The decisions you kept postponing get made, without the familiar delay.',
    'You move from waiting until you feel ready to building because you already are.',
    'Confidence stops being a performance and becomes something you can feel.'
  ]},

  {t:'credibility',eyebrow:'Why learn this from me',h2:'Dr. Amen Kaur',cred:[
    '25 plus years helping ambitious people set and hit big goals',
    'Former Partner at a FTSE 250 company leading growth',
    'Coach, scientist, and researcher in human change',
    'Over 1,000 people coached',
    '216 episodes of the podcast, rated 4.8 stars',
    'The method built through my own burnout and back'
  ]},

  {t:'statement',cls:'dark',eyebrow:'The one line to keep',lead:'The block is never the skills. It is the relationship with yourself.',body:'Everything in this masterclass is one way of rebuilding that relationship, on purpose, with a process you can follow.'},

  {t:'cta',cls:'dark',eyebrow:'Continue the work',h:'BEYOND',sub:'Rebuild who you are after a big life change. A four-month immersion in the full Human Intelligence Framework, with a live mastermind, direct mentorship, and the daily tools that make it stick.',cta:'Join BEYOND at amenkaur.com/beyond',disclaimer:'This masterclass is educational. No specific result is guaranteed. Results vary from person to person and depend on many factors outside any program. It shares a framework and a way of thinking about change, not a promise of outcomes. Nothing here is medical, psychological, or financial advice.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('section','slide'+(s.cls?(' '+s.cls):''));
  if(s.eyebrow)sl.appendChild(el('div','eyebrow',s.eyebrow));
  if(s.eyebrow)sl.appendChild(el('div','rule'));
  if(s.t==='title'){sl.appendChild(el('h1',null,s.h));if(s.sub)sl.appendChild(el('div','sub',s.sub));}
  else if(s.t==='section'){sl.appendChild(el('h2',null,s.h));}
  else if(s.t==='statement'){sl.appendChild(el('div','lead',s.lead));if(s.body)sl.appendChild(el('p','body',s.body));}
  else if(s.t==='content'){sl.appendChild(el('h3',null,s.h3));if(s.body)sl.appendChild(el('p','body',s.body));}
  else if(s.t==='framework3'){sl.appendChild(el('h2',null,s.h2));const u=el('ul');s.items.forEach(it=>{const li=el('li',null,'<b style="font-family:var(--display);color:var(--ink)">'+it.title+'.</b> '+it.desc);u.appendChild(li);});sl.appendChild(u);}
  else if(s.t==='five'){sl.appendChild(el('h2',null,s.h2));if(s.body)sl.appendChild(el('p','body',s.body));const g=el('div','grid5');s.cells.forEach(c=>{const d=el('div','cell');d.appendChild(el('div','n',c.n));d.appendChild(el('div','t',c.t));g.appendChild(d);});sl.appendChild(g);}
  else if(s.t==='phases'){sl.appendChild(el('h2',null,s.h2));const g=el('div','phases');s.phases.forEach(p=>{const d=el('div','phase');d.appendChild(el('b',null,p.n));d.appendChild(el('span',null,p.txt));g.appendChild(d);});sl.appendChild(g);}
  else if(s.t==='list'){sl.appendChild(el('h2',null,s.h2));const u=el('ul');s.items.forEach(it=>u.appendChild(el('li',null,it)));sl.appendChild(u);}
  else if(s.t==='credibility'){sl.appendChild(el('h2',null,s.h2));const g=el('div','cred');s.cred.forEach(c=>g.appendChild(el('div',null,c)));sl.appendChild(g);}
  else if(s.t==='cta'){sl.appendChild(el('h2',null,s.h));if(s.sub)sl.appendChild(el('div','sub',s.sub));if(s.cta)sl.appendChild(el('div','cta-line',s.cta));if(s.disclaimer)sl.appendChild(el('div','disclaimer',s.disclaimer));}
  sl.appendChild(el('div','pagenum',(i+1)+' / '+S.length));
  deck.appendChild(sl);
});
</script>
</body>
</html>
