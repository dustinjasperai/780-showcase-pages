<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 5 Shifts to a Happy Home After Divorce — Erin Breeze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef4f2; --panel:#fbfdfc; --rule:#d8e4e1;
    --accent:#0e7a7a; --accent-soft:#0e7a7a1a; --ink:#1f2a2a; --muted:#5b6a6a;
    --serif:'Instrument Serif',Georgia,serif;
    --sans:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 56px 52px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:400;font-size:62px;line-height:1.02;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:400;font-size:42px;line-height:1.06;margin-bottom:10px}
  .lede{font-size:22px;line-height:1.45;color:var(--ink);margin-top:18px;max-width:40ch}
  .sub{font-size:19px;line-height:1.5;color:var(--muted);margin-top:14px;max-width:52ch}
  p.body{font-size:19px;line-height:1.55;color:var(--ink);margin-top:14px;max-width:54ch}
  .pagetag{position:absolute;right:26px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .partnum{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--accent);margin-bottom:6px}
  ul.list{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:14px;max-width:56ch}
  ul.list li{font-size:19px;line-height:1.45;padding-left:30px;position:relative}
  ul.list li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .shiftnum{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);font-family:var(--serif);font-size:28px;margin-bottom:14px}
  .big{font-family:var(--serif);font-size:46px;line-height:1.08;max-width:22ch}
  .cols{display:flex;gap:40px;margin-top:26px;flex-wrap:wrap}
  .col{flex:1;min-width:220px}
  .col h3{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--accent);margin-bottom:8px;text-transform:uppercase}
  .col p{font-size:17px;line-height:1.5;color:var(--muted)}
  .disclaimer{font-size:13px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:60ch;border-top:1px solid var(--rule);padding-top:16px}
  .cta-line{font-size:21px;line-height:1.5;margin-top:16px;max-width:46ch}
  .nav{position:fixed;left:0;right:0;bottom:0;background:#fffefbcc;backdrop-filter:blur(6px);
    border-top:1px solid var(--rule);text-align:center;padding:9px;font-size:13px;color:var(--muted)}
  @media(max-width:620px){.slide{padding:38px 26px}h1{font-size:44px}h2{font-size:32px}.big{font-size:34px}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav">A live masterclass with Erin Breeze &middot; Happy Home</div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass for moms after divorce',
   h1:'The 5 Shifts to a Happy Home After Divorce',
   lede:'How to release the fury, calm the chaos, and build a home your kids love coming back to, no matter what is happening at the other house.'},

  {t:'who',eyebrow:'Who this is for',
   h2:'If one text can still pull you back in',
   body:'This is for the mom who looks fine on the outside and is still exhausted on the inside. You are holding the household, the kids, the logistics, and a running argument in your head that will not quiet down. You do not need more venting. You need a way through.'},

  {t:'trap',eyebrow:'The trap',
   h2:'Waiting for the other house to change',
   body:'Most advice tells you to survive it, document everything, and brace for the next conflict. So you wait. You wait for your ex to be accountable, to apologize, to finally see it your way. And while you wait, the years go by and the weight never lifts.'},

  {t:'reframe',eyebrow:'The reframe',
   big:'Your divorce is not the end of your story. It is a divine disruption that starts the next one.',
   sub:'A disruption is not damage to survive. It is the opening to rebuild your identity and your home on purpose.'},

  {t:'part',partnum:'Part One',h2:'Why you feel stuck',
   body:'Being stuck is not a character flaw and it is not forever. It has a shape, and once you can see the shape, you can step out of it.'},

  {t:'symptoms',eyebrow:'The 4 signals of being stuck',
   h2:'You might be here if',
   list:['You feel unsure of who you are now, measuring your life against your ex or other families',
         'You replay the same conversations, still angry or hurt months or years later',
         'You carry guilt about the kids and worry about their future',
         'You feel you cannot move forward until your ex is accountable']},

  {t:'cost',eyebrow:'What it costs',
   h2:'The spiral taxes the whole house',
   body:'When a mom is stuck in the spiral, the kids feel it, the home feels tense, and every handoff becomes a braced moment. The work is not about your ex at all. It is about taking your peace back so the home can settle.'},

  {t:'part',partnum:'Part Two',h2:'The 5 Shifts',
   body:'These are the five moves I walk moms through. They are not a mood. They are a method, built from twenty years of conflict work and a decade of living this myself.'},

  {t:'shift',num:'1',eyebrow:'Shift one',
   h2:'Celebrate your marriage as complete',
   body:'Complete is not the same as failed. When you can honor what the marriage was and name that its season is over, the fury loses its fuel. This is the shift that frees you to be open to who you are now.'},

  {t:'shift',num:'2',eyebrow:'Shift two',
   h2:'Escape the blame and shame spirals',
   body:'You learn to catch the four signals the moment they start, interrupt the replay, and stop handing your day to a conversation that already happened. The spiral stops being automatic.'},

  {t:'shift',num:'3',eyebrow:'Shift three',
   h2:'Protect the peace in your home',
   body:'This is conflict transformation applied at your own front door. You set boundaries that hold and you disarm triggers fast, so one message or one handoff does not derail your whole day, no matter what is said.'},

  {t:'shift',num:'4',eyebrow:'Shift four',
   h2:'Lead your family with calm strength',
   body:'Your kids do not need you to be unbothered. They need you to be steady. When you lead from calm strength you become the safe center of the home, and you show them what resilience actually looks like.'},

  {t:'shift',num:'5',eyebrow:'Shift five',
   h2:'Design the happy home on purpose',
   body:'You stop defaulting into a reactive life and start building the home you actually want: the rhythms, the repair, the space your kids love coming back to. This is conscious family design, and it is yours to create.'},

  {t:'part',partnum:'Part Three',h2:'On the other side of the spiral',
   body:'This is not a fantasy of a conflict-free co-parenting life. It is calmer, clearer, and more connected, with you at the center of it.'},

  {t:'after',eyebrow:'A week in the calmer home',
   h2:'Steady, not braced',
   cols:[
     {h:'Mornings',p:'The handoff happens and your day keeps moving. The text lands and you answer on your time.'},
     {h:'The kids',p:'They stop managing your mood and start being kids again, in a home that feels safe.'},
     {h:'You',p:'You recognize yourself again. The next chapter stops being a threat and starts being a plan.'}]},

  {t:'why',eyebrow:'Why me',
   h2:'I have done this work at both scales',
   body:'I spent more than twenty years in conflict transformation, leading an international nonprofit and guiding organizations through their hardest transitions across some of the most divided places on earth. Then my own divorce asked me to use every bit of it at home. I am a mom of two girls, a child of divorce myself, and the guide to more than three thousand moms building happier homes.'},

  {t:'path',eyebrow:'The path',
   h2:'You do not have to wait to feel like yourself',
   body:'The five shifts are learnable, and you can start the first one this week. You do not need your ex to change and you do not need to have it all figured out. You need the first shift and a place to practice it.'},

  {t:'cta',eyebrow:'Your next step',
   h2:'Create your happy home',
   ctaline:'If you are ready to stop carrying divorce as a daily weight and start leading your family forward, join me inside Happy Home and we will take the first shifts together.',
   disclaimer:'This masterclass is for education and support only. It is not legal, financial, medical, or mental-health advice, and it is not a substitute for professional care. No specific outcome or result is guaranteed. Results vary, and every family is different.'}
];

const deck=document.getElementById('deck');
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.partnum) h+=`<div class="partnum">${esc(s.partnum)}</div>`;
  if(s.num) h+=`<div class="shiftnum">${esc(s.num)}</div>`;
  if(s.h1) h+=`<h1>${esc(s.h1)}</h1>`;
  if(s.h2) h+=`<h2>${esc(s.h2)}</h2>`;
  if(s.big) h+=`<div class="big">${esc(s.big)}</div>`;
  if(s.lede) h+=`<div class="lede">${esc(s.lede)}</div>`;
  if(s.body) h+=`<p class="body">${esc(s.body)}</p>`;
  if(s.sub) h+=`<div class="sub">${esc(s.sub)}</div>`;
  if(s.list){h+='<ul class="list">';s.list.forEach(li=>h+=`<li>${esc(li)}</li>`);h+='</ul>';}
  if(s.cols){h+='<div class="cols">';s.cols.forEach(c=>h+=`<div class="col"><h3>${esc(c.h)}</h3><p>${esc(c.p)}</p></div>`);h+='</div>';}
  if(s.ctaline) h+=`<div class="cta-line">${esc(s.ctaline)}</div>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  h+=`<div class="pagetag">${i+1} / ${S.length}</div>`;
  d.innerHTML=h;deck.appendChild(d);
});
</script>
</body>
</html>
