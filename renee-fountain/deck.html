<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What an Agent Sees First: A Masterclass with Renee Fountain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe4;        /* parchment ground (Gryphon Quill book-world) */
    --panel:#fbf7ee;     /* lighter manuscript page */
    --rule:#d8ccb4;      /* faint margin rule */
    --ink:#23201b;       /* dark ink text */
    --muted:#6a6355;     /* pencil-grey */
    --accent:#7a2e2a;    /* oxblood: the editor's red-pen correction mark */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Spline Sans",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:48px 52px;margin:0 0 28px;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:"Spline Sans";font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:16px}
  h1{font-family:"Literata";font-weight:800;font-size:44px;line-height:1.1;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"Literata";font-weight:700;font-size:32px;line-height:1.15;margin-bottom:16px}
  .lead{font-family:"Literata";font-size:21px;font-style:italic;color:var(--muted);margin-bottom:10px}
  p{font-size:18px;margin-bottom:14px;max-width:68ch}
  ul{margin:8px 0 8px 2px;list-style:none}
  li{font-size:18px;padding:10px 0 10px 28px;position:relative;border-bottom:1px solid var(--rule);max-width:70ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:18px;width:12px;height:2px;background:var(--accent)}
  .big{font-family:"Literata";font-size:30px;font-weight:600;line-height:1.25;color:var(--ink);max-width:24ch}
  .big .mark{color:var(--accent)}
  .pill{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:40px;padding:4px 14px;margin-bottom:18px}
  .num{font-family:"Literata";font-weight:800;font-size:17px;color:var(--accent);margin-right:8px}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .foot{font-size:13px;color:var(--muted);letter-spacing:.04em;margin-top:30px}
  .slide.title{background:var(--ink);color:var(--bg)}
  .slide.title::before{background:var(--accent)}
  .slide.title h1{color:var(--bg)}
  .slide.title .lead{color:#c9bfa8}
  .slide.title .kicker{color:#d7a99f}
  .slide.cta{background:var(--ink);color:var(--bg)}
  .slide.cta h2{color:var(--bg)}
  .slide.cta p{color:#d7cdba}
  .slide.cta .kicker{color:#d7a99f}
  .cue{font-family:"Literata";font-style:italic;color:var(--accent);font-size:19px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
 {t:'title', kicker:'A live masterclass with Renee Fountain · Gryphon Quill',
  h1:'What an Agent Sees First',
  lead:'The ninety seconds that decide whether your manuscript gets read, and how to win them.'},

 {t:'who', kicker:'Who this is for',
  h2:'You have a finished draft and a dream. You also have a drawer full of silence.',
  body:['You have written the book. Maybe you have queried. The replies, if they come, are kind and vague: not quite right for my list.',
        'You start to wonder if the work is the problem, or if you are.',
        'Here is the part no one tells you from the outside of the desk: most passed-over manuscripts are not bad. They are undecided in the first five pages.']},

 {t:'hook', kicker:'The uncomfortable reframe',
  big:['An agent does not read your book.',' We read your <span class="mark">first five pages</span>, and decide whether the rest has earned our afternoon.'],
  body:['I have spent more than thirty years on the other side of the submission pile, at Simon and Schuster, at Harcourt, as a scout, and since 2014 as an agent.',
        'That is not gatekeeping for its own sake. It is the exact filter your reader at the bookstore uses too. Learn to pass it, and you are not writing for agents anymore. You are writing for anyone who picks the book up.']},

 {t:'part', kicker:'Part One', h2:'Why good manuscripts get passed over',
  body:['It is almost never the idea. It is four quiet problems that all read the same from my chair: the voice has not arrived yet.']},

 {t:'list', kicker:'Part One', h2:'The four quiet problems',
  items:['No inciting incident. Nothing is really happening in the first ten pages, so the promise of the book is still a rumour.',
         'Loose writing and bad pacing. Excessive description buries the scene that matters.',
         'Story for story’s sake. Scenes that are lovely and do not move anything.',
         'An overwritten query. If I am reading a three page query, I already assume the manuscript is overwritten too.']},

 {t:'line', kicker:'Part One', big:['The test I use on every scene:',' if you take it out and the story <span class="mark">still makes sense</span>, it was never essential.'],
  body:['You cannot run that test on your own book at first. You have been living inside it so long you cannot see the forest for the trees. The skill is learning to read your pages the way a stranger will.']},

 {t:'part', kicker:'Part Two', h2:'The agent-side read, in three passes',
  body:['This is the method I use on client manuscripts. Three passes, in this order, because fixing them out of order wastes your time.']},

 {t:'list', kicker:'Part Two · Pass one', h2:'Make the first five pages inevitable',
  items:['Open on a person wanting something, in motion, under pressure. Not weather. Not a map of the world.',
         'Put the inciting incident where the reader can feel it, early, even in a slow burn.',
         'Voice is style under control. The first page is where I decide you have it.']},

 {t:'list', kicker:'Part Two · Pass two', h2:'Cut for the whole, not the line',
  items:['Read for the big picture first: is every scene necessary and productive?',
         'Reorganise, add, or delete at the structural level before you polish a single sentence.',
         'Tight writing is the art of word choice. Fewer, truer words read as confidence.']},

 {t:'list', kicker:'Part Two · Pass three', h2:'Query like the book is already strong',
  items:['Two hundred fifty to three hundred fifty words. One page. No more.',
         'Premise, stakes, and who you are, in that order. Platform only if it is genuinely strong.',
         'The query is a sample of your judgement. Restraint on the page signals restraint in the book.']},

 {t:'part', kicker:'Part Three', h2:'What actually stops you from sending it',
  body:['You can know all of this and still not submit. That is not a craft problem. That is the part I had to name before my own clients would move.']},

 {t:'line', kicker:'Part Three · The Fear Trifecta', big:['Three fears, ','<span class="mark">one disguise.</span>'],
  body:['What if it is terrible. What if they reject it. What if I am not the kind of person who gets to do this. Those feel like three different walls. They are one wall wearing three coats, and the wall is the fear of being seen.']},

 {t:'line', kicker:'Part Three · The Fear Trifecta', big:['You do not have to kill the fear.',' You have to <span class="mark">let it sit there</span> and send the pages anyway.'],
  body:['The fear will blink alongside the cursor at every draft. Writers do not stall because they are lazy. They stall because sending the work is the moment of being seen. Name that, and the submission stops being a referendum on your worth.']},

 {t:'line', kicker:'Part Three · On rejection', big:['My fantastic is ','<span class="mark">someone else’s meh.</span>'],
  body:['A pass is a report on one reader’s taste and one list’s timing. It is not a verdict on the book. The writers who get published are rarely the least afraid. They are the ones who kept sending readable pages into the subjective weather of this industry.']},

 {t:'why', kicker:'Why learn this from me',
  h2:'Thirty years reading the pile, so you do not have to guess what is on the other side.',
  items:['Editor at Simon and Schuster and at Harcourt; former television network book scout.',
         'Working literary agent since 2014; President of Gandolfo Helin and Fountain Literary Management.',
         'Developmental editor at Gryphon Quill and faculty at The Manuscript Academy.',
         'I read manuscripts for a living. This masterclass is that read, handed to you.']},

 {t:'cta', kicker:'Your next step',
  h2:'Bring me your first five pages and your query.',
  body:['If you want a working agent and developmental editor to read your manuscript the way the desk will, that is exactly what I do at Gryphon Quill.',
        'Start where it counts: a query or first-pages critique, or a full developmental edit when you are ready to make the whole book inevitable.',
        'Find the services and book your read at reneefountain.com.'],
  disc:'Educational only. No outcome, agent-offer, or publication result is promised or guaranteed; publishing outcomes vary and depend on many factors outside any editor’s control.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t || '');
  let h = '';
  if (s.kicker) h += '<div class="kicker">' + s.kicker + '</div>';
  if (s.h1) h += '<h1>' + s.h1 + '</h1>';
  if (s.h2) h += '<h2>' + s.h2 + '</h2>';
  if (s.lead) h += '<div class="lead">' + s.lead + '</div>';
  if (s.big) h += '<div class="big">' + s.big.join('') + '</div>';
  if (s.body) s.body.forEach(p => h += '<p>' + p + '</p>');
  if (s.items){ h += '<ul>'; s.items.forEach(it => h += '<li>' + it + '</li>'); h += '</ul>'; }
  if (s.disc) h += '<div class="disc">' + s.disc + '</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
