<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Practice CEO Shift, Cecilia Mannella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#271524;      /* deep aubergine, her dominant heading color */
    --panel:#3d2a3a;       /* muted plum panel */
    --ink:#f5f3f7;         /* lilac-white text */
    --muted:#cabad7;       /* soft lilac */
    --accent:#c4891c;      /* gold */
    --rule:#55384f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#1b0e19;color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:32px 18px 80px}
  .slide{background:var(--ground);border:1px solid var(--rule);border-radius:14px;
    padding:52px 56px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .kicker{font-family:'Inter';font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin-bottom:20px}
  h1{font-family:'Fraunces';font-weight:600;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:'Fraunces';font-weight:600;font-size:36px;line-height:1.12;margin-bottom:14px}
  .sub{font-size:19px;color:var(--muted);margin-top:18px;max-width:40ch;line-height:1.5}
  .body{font-size:19px;line-height:1.6;margin-top:14px;max-width:52ch}
  .body p{margin-top:14px}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  li{font-size:18.5px;line-height:1.45;padding-left:26px;position:relative;max-width:54ch}
  li:before{content:"";position:absolute;left:0;top:10px;width:10px;height:10px;
    background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .domains{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
  .domain{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
  .domain b{font-family:'Fraunces';font-weight:600;font-size:21px;color:var(--accent);display:block;margin-bottom:6px}
  .domain span{font-size:16px;color:var(--muted);line-height:1.45}
  .meta{margin-top:30px;font-size:16px;color:var(--muted)}
  .big{font-family:'Fraunces';font-size:40px;line-height:1.1;font-weight:500;max-width:22ch}
  .foot{margin-top:28px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px;max-width:60ch}
  .cta h2{font-size:40px}
  .num{font-family:'Fraunces';font-size:15px;color:var(--accent);position:absolute;top:22px;right:28px;opacity:.75}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'A live masterclass with Cecilia Mannella, RSW, RCC',
   title:'The Practice CEO Shift',
   sub:'How Canadian therapy practice owners grow revenue beyond the clinical hour, without losing the clinical values that built the practice.'},

  {t:'who',kicker:'Who this is for',
   title:'You built something real',
   body:['You are a Canadian therapy practice owner. Maybe you are solo and building toward a team, maybe you already lead a group of clinicians.',
         'You are good at the work. The caseload is full. And still, the growth feels capped and the weight of the business sits on you.']},

  {t:'trap',kicker:'The trap',
   title:'The clinical-hour ceiling',
   body:['Every dollar in your practice is tied to an hour of your own time. When your calendar is full, your income has nowhere left to go.',
         'So you add more hours. Then more admin. Then the burnout you help your clients avoid starts showing up in you.']},

  {t:'reframe',kicker:'The reframe',
   big:'A practice that only grows when you work more is a job, not a business.'},

  {t:'part',kicker:'Part one',title:'Why hard work stops paying',
   body:['Clinical skill is why clients stay. It is not why a practice scales.',
         'Scaling asks a different question: how does the practice create value when you are not the one in the room? That is an ownership question, not a clinical one, and most owners were never taught it.']},

  {t:'cost',kicker:'The hidden cost',title:'What the ceiling really costs',
   body:['It is not only revenue. It is the associate you cannot afford to hire, the clients you cannot serve, the time you cannot take back.',
         'The practice needs its owner to step out of every seat. The owner needs permission, and a map, to do it.']},

  {t:'framework',kicker:'Part two',title:'The Sustainable Practice CEO Framework',
   sub:'Four domains that move you from doing the work to owning the practice. We walk through each one today.'},

  {t:'domains',kicker:'The four domains',title:'The shift, in four moves',
   domains:[
     ['Purpose','Growth that stays aligned with your values and your own definition of success, so bigger never means off-course.'],
     ['Profit','Defensible pricing and revenue built beyond the clinical hour, in a Canadian tax and practice context.'],
     ['People','Hiring, leading and keeping a clinician team with integrity, so the caseload is not all yours.'],
     ['Process','Systems and structure that let the practice run well when you are not in every seat.']]},

  {t:'domain1',kicker:'Domain one, Purpose',title:'Decide what growth is for',
   body:['Before the spreadsheets, the direction. What does a successful practice let your life look like?',
         'When purpose is clear, every later decision, who to hire, what to charge, what to build, has a test to pass.']},

  {t:'domain2',kicker:'Domain two, Profit',title:'Build revenue past your calendar',
   body:['Price so the work is defensible, not discounted out of guilt. Then add income that is not tied to your own clinical hour: associates, programs, group offers.',
         'This is where the ceiling finally lifts, because the practice earns while you are not personally billing.']},

  {t:'domain3',kicker:'Domain three, People',title:'A team you can actually lead',
   body:['Associates do not fix an overloaded owner by themselves. Leadership does.',
         'Hire for fit, onboard with structure, and lead with the same integrity you bring to the therapy room. A team that stays is the real growth engine.']},

  {t:'domain4',kicker:'Domain four, Process',title:'Make yourself removable',
   body:['Document the handful of systems the practice runs on, intake, billing, supervision, hiring, so they do not live only in your head.',
         'The goal is simple and freeing: the practice keeps serving clients well on the weeks you step away.']},

  {t:'picture',kicker:'Part three',title:'The practice on the other side',
   body:['A full caseload you no longer carry alone. Revenue that grows when you add value, not only hours.',
         'A practice that runs on its systems and its people, and an owner who finally has room to lead it.']},

  {t:'stages',kicker:'The transition',title:'From clinician to Practice CEO',
   bullets:['Clinician: the practice is your calendar.',
            'Owner-operator: you run it and still work in it.',
            'Practice CEO: you lead it, and it grows without you in every seat.']},

  {t:'why',kicker:'Why learn this from me',title:'I built the practice I am describing',
   body:['Over seventeen years I grew a solo counselling practice into a seven-figure group practice with twenty clinicians, here in Canada, as a registered clinician myself.',
         'I made the ceiling mistakes first. The framework is the path I wish I had been handed years earlier.']},

  {t:'myths',kicker:'What holds owners back',title:'The three myths of the ceiling',
   bullets:['"If I was just a better clinician, it would grow." Skill keeps clients; it does not scale a business.',
            '"Hiring will only create more work." Unled hiring does. Led hiring frees you.',
            '"Marketing myself betrays the work." Being findable by the people who need you is an extension of care.']},

  {t:'first',kicker:'Where to start',title:'Your first move this week',
   body:['Name the one domain where your ceiling is loudest right now: Purpose, Profit, People or Process.',
         'Pick a single change inside it. The shift is not one giant leap, it is the first honest decision an owner makes.']},

  {t:'recap',kicker:'The map',title:'The four domains, together',
   domains:[
     ['Purpose','Growth aligned with your values.'],
     ['Profit','Revenue beyond the clinical hour.'],
     ['People','A clinician team you lead well.'],
     ['Process','Systems that run without you.']]},

  {t:'cta',kicker:'Your next step',title:'Ready to make the shift?',
   body:['If this is the work you are ready for, let us map your practice against the four domains together and find where your growth is actually stuck.',
         'Book a fit call with me and we will look at your next move as a Practice CEO.'],
   note:'Educational content only. Every practice is different; results vary and are not guaranteed. Nothing here is financial, legal, tax or clinical advice.'}
];

const d=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'||s.t==='cta'){
    h+='<h1>'+(s.title||'')+'</h1>';
  } else if(s.title){ h+='<h2>'+s.title+'</h2>'; }
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.body){ h+='<div class="body">'+s.body.map(p=>'<p>'+p+'</p>').join('')+'</div>'; }
  if(s.bullets){ h+='<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>'; }
  if(s.domains){ h+='<div class="domains">'+s.domains.map(x=>'<div class="domain"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>'; }
  if(s.note){ h+='<div class="foot">'+s.note+'</div>'; }
  el.innerHTML=h;
  d.appendChild(el);
});
</script>
</body>
</html>
