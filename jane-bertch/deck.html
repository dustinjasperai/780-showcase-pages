<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pirouette — a masterclass with Jane Bertch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffbf5; --panel:#f3ece1; --ink:#3f2c23; --accent:#b11043; --sage:#aaac98;
    --head:'Alegreya',Georgia,serif; --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);border-radius:14px;margin:22px 0;padding:64px 60px;
    min-height:460px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(63,44,35,.08),0 18px 40px rgba(63,44,35,.10);
    position:relative;overflow:hidden;
  }
  .slide::after{content:"";position:absolute;right:-70px;bottom:-70px;width:200px;height:200px;
    border:2px solid var(--sage);border-radius:50%;opacity:.35}
  .k{font-family:var(--body);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.08;margin-bottom:12px}
  .lede{font-family:var(--head);font-style:italic;font-size:26px;line-height:1.3;color:var(--ink);opacity:.9;margin-top:10px}
  p{font-size:19px;line-height:1.6;max-width:44ch;margin-top:14px}
  .big{font-size:22px;max-width:46ch}
  ul{margin:20px 0 0 0;list-style:none;max-width:52ch}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 26px;border-top:1px solid rgba(63,44,35,.12);position:relative}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border:2px solid var(--accent);border-radius:50%}
  li b{font-family:var(--head);font-weight:700}
  .season{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
  .season div{flex:1 1 180px;background:var(--panel);border-radius:10px;padding:18px 18px 20px;border-left:3px solid var(--accent)}
  .season h3{font-family:var(--head);font-size:21px;margin-bottom:6px}
  .season span{font-size:15px;line-height:1.45;opacity:.85}
  .flow{display:flex;gap:10px;align-items:center;margin-top:24px;flex-wrap:wrap}
  .flow span{background:var(--panel);border-radius:999px;padding:10px 20px;font-family:var(--head);font-weight:700;font-size:19px}
  .flow em{color:var(--accent);font-style:normal;font-weight:700}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);opacity:.55}
  .num{font-family:var(--head);font-size:15px;color:var(--sage);font-weight:700;margin-bottom:10px;letter-spacing:.12em}
  .cta{background:var(--ink);color:var(--bg)}
  .cta::after{border-color:rgba(255,251,245,.25)}
  .cta .k{color:var(--bg)}
  .cta h2{color:var(--bg)}
  .cta p{color:var(--bg);opacity:.92}
  .pill{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-weight:700;
    padding:14px 26px;border-radius:999px;font-size:17px}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;opacity:.7;max-width:60ch}
  .foot{position:absolute;left:60px;bottom:22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title',
    k:'A live masterclass with Jane Bertch',
    h:'The Pirouette',
    lede:'How accomplished women build their next chapter without starting over.'},

  {t:'promise',
    k:'What this hour gives you',
    h:'A clearer next move.',
    p:'You will leave knowing which season of reinvention you are actually in, the one turn that is yours to make next, and why you do not have to burn down what you built to make it.'},

  {t:'who',
    k:'Who this is for',
    h:'You have already built something.',
    p:'A business, a career, a life abroad, a reputation. You are smart, driven, and proud of it. And lately a quieter question keeps showing up: what is next, and is it allowed to be different?'},

  {t:'trap',
    k:'The trap',
    h:'Stay, or blow it all up.',
    p:'Most advice hands you two doors. Keep doing the thing that works and quietly outgrow it, or throw it all away and start from zero. Both feel wrong, so most women do neither, and the in-between stretches on.'},

  {t:'reframe',
    k:'The real problem',
    h:'Nobody prepared you for the in-between.',
    p:'The problem was never a lack of ambition. It is that the middle of a reinvention, the pause before the next chapter, has no map. So capable women treat a normal, necessary season as proof that something is wrong with them.'},

  {t:'part',
    num:'PART ONE',
    h:'Reinvention is not starting over.',
    p:'We have been sold reinvention as a demolition: quit, pivot hard, reinvent from scratch. That story is exciting and it is mostly false. It throws away the exact foundation that makes your next move possible.'},

  {t:'big',
    k:'The cost of the demolition story',
    h:'Starting over wastes what you earned.',
    p:'Twenty years of built judgment, relationships, taste, and credibility do not transfer to a blank page. When you start over, you pay for them twice. The women who reinvent well do the opposite: they turn from a standing position.'},

  {t:'part',
    num:'PART TWO',
    h:'A turn, not a leap.',
    p:'A pirouette is a turn executed from the ground you are already standing on. That is the model: reinvention as a controlled turn built on what you have already accomplished, at any point, at any age.'},

  {t:'thesis',
    k:'The thesis',
    h:'You have earned the right to turn.',
    lede:'Every woman has earned the right to reinvent herself, at any point, at any age, building on the foundation of what she has already accomplished.'},

  {t:'seasons',
    k:'The framework',
    h:'Reinvention has three seasons.',
    p:'The next move only gets clear once you know which season you are actually in. Most of the stuckness is trying to act out of the wrong one.'},

  {t:'season',
    k:'Season one',
    h:'Pause and realign.',
    s1:'Pause & Realign', d1:'Step back and hear yourself think before the next chapter. The in-between is the work, not a detour around it.',
    s2:'You are Already Building', d2:'You know the direction. Now you go further, faster, alongside a room of women who get it.',
    s3:'You are About to Begin', d3:'There is an idea in you. The season is about getting into the right place, and company, to grow it.'},

  {t:'method',
    k:'How the turn is made',
    h:'Clarify. Explore. Test. Refine.',
    p:'Every turn, in any season, runs through the same four moves. This is the engine underneath the seasons.'},

  {t:'flow',
    k:'The four moves',
    h:'The engine of a clean turn.',
    f1:'Clarify', f2:'Explore', f3:'Test', f4:'Refine',
    p:'Get honest about what actually matters now. Widen the options before you narrow them. Try the next move in the real world at small scale. Then refine with real information, not fear.'},

  {t:'detail',
    num:'CLARIFY and EXPLORE',
    h:'Decide from clarity, not pressure.',
    list:[
      "<b>Clarify</b> what you want this chapter to be, separate from what you are already good at.",
      "<b>Explore</b> more options than feel comfortable, before the fear narrows them for you.",
      "Name the foundation you are turning from, so you build on it instead of abandoning it."
    ]},

  {t:'detail',
    num:'TEST and REFINE',
    h:'Make the turn survivable.',
    list:[
      "<b>Test</b> the next move at a scale small enough to be wrong without losing what you built.",
      "<b>Refine</b> using what the real world gives back, not the story in your head at 2am.",
      "Repeat the turn deliberately, so reinvention becomes a skill instead of a crisis."
    ]},

  {t:'part',
    num:'PART THREE',
    h:'What the turn looks like.',
    p:'Not a dramatic before-and-after. A woman who keeps what she built, adds a chapter that is unmistakably hers, and stops apologizing for wanting more at this stage of her life.'},

  {t:'why',
    k:'Why listen to me',
    h:'I built it from zero. In French. As a foreigner.',
    p:'I moved to Paris and built La Cuisine from nothing, in a language and a culture that were not mine. I wrote The French Ingredient about that. I hold an Executive Masters from INSEAD in coaching and consulting for change. Reinvention is not a theory I read. It is the thing I did, and now teach.'},

  {t:'room',
    k:'You do not turn alone',
    h:'A small room of women who get it.',
    p:'The turn is faster and far less lonely in company: a curated group of women who have built, pivoted, and figured things out the hard way, who will challenge your thinking and tell you what is actually working.'},

  {t:'cta',
    k:'Your next step',
    h:'Find your season. Make your turn.',
    p:'If this is the chapter you have been circling, the next step is simple: come find your season, and let us build the turn that is yours. Explore the retreats, the Paris Pirouette, and working together at janebertch.com.',
    pill:'Start at janebertch.com',
    disc:'This masterclass is educational. No income, role, or result is guaranteed. Results vary and depend on your own circumstances, decisions, and work.'}
];

const deck = document.getElementById('deck');
function esc(x){return x||''}
S.forEach(function(s){
  var el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'');
  var h = '';
  if(s.num){ h += '<div class="num">'+esc(s.num)+'</div>'; }
  if(s.k){ h += '<div class="k">'+esc(s.k)+'</div>'; }
  if(s.t==='title'){ h += '<h1>'+esc(s.h)+'</h1>'; }
  else if(s.h){ h += '<h2>'+esc(s.h)+'</h2>'; }
  if(s.lede){ h += '<div class="lede">'+esc(s.lede)+'</div>'; }
  if(s.p){ h += '<p class="'+(s.t==='big'?'big':'')+'">'+esc(s.p)+'</p>'; }
  if(s.t==='season'){
    h += '<div class="season">'
      + '<div><h3>'+esc(s.s1)+'</h3><span>'+esc(s.d1)+'</span></div>'
      + '<div><h3>'+esc(s.s2)+'</h3><span>'+esc(s.d2)+'</span></div>'
      + '<div><h3>'+esc(s.s3)+'</h3><span>'+esc(s.d3)+'</span></div>'
      + '</div>';
  }
  if(s.t==='flow'){
    h += '<div class="flow"><span><em>'+esc(s.f1)+'</em></span><span>'+esc(s.f2)
      +'</span><span>'+esc(s.f3)+'</span><span>'+esc(s.f4)+'</span></div>';
  }
  if(s.list){ h += '<ul>'; s.list.forEach(function(li){ h += '<li>'+li+'</li>'; }); h += '</ul>'; }
  if(s.pill){ h += '<div class="pill">'+esc(s.pill)+'</div>'; }
  if(s.disc){ h += '<div class="disc">'+esc(s.disc)+'</div>'; }
  h += '<div class="foot">The Pirouette &middot; Jane Bertch</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
