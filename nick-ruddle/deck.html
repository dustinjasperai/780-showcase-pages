<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Self-Operating Landscape Business — Nick Ruddle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --rule:#dae0e7; --ink:#111d2c;
    --muted:#566981; --accent:#54a630;
    --head:'Spectral',Georgia,serif; --body:'Manrope',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:48px 20px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:20px;margin-top:20px;max-width:46ch}
  .lead{font-size:21px;margin-top:18px;max-width:52ch}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.12;max-width:20ch}
  ul{margin-top:24px;list-style:none;display:flex;flex-direction:column;gap:14px}
  li{position:relative;padding-left:30px;font-size:19px;max-width:54ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:3px;
    background:var(--accent);border-radius:2px}
  .pillar-no{font-family:var(--head);font-size:15px;color:var(--accent);font-weight:700;
    letter-spacing:.08em;margin-bottom:10px}
  .note{margin-top:26px;color:var(--muted);font-size:15px;max-width:58ch}
  .disc{margin-top:28px;color:var(--muted);font-size:13.5px;max-width:60ch;
    border-top:1px solid var(--rule);padding-top:16px}
  .foot{position:absolute;right:26px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:.03em}
  .hr{height:3px;width:68px;background:var(--accent);border-radius:2px;margin-top:22px}
  @media(max-width:640px){.slide{padding:40px 28px}h1{font-size:34px}h2{font-size:26px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kick:'A Live Masterclass with Nick Ruddle',h:'The Self-Operating Landscape Business',sub:'How UK landscape owners build a company that runs without them in every job.',foot:'Landscape Business Mastery'},

  {t:'who',kick:'Who this is for',h:'The owner who built it, and now carries it',lead:'You run an established landscape business. The work is good and the order book is full. But every quote, every problem and every client who matters still comes through you.'},

  {t:'hook',kick:'The hard truth',big:'If it all needs you, you don’t own a business. You own a job.',note:'A good one, often a well-paid one. But a job you can never put down, sell, or step back from.'},

  {t:'part',kick:'Part One',h:'The core problem is dependency, not effort',lead:'Most owners try to escape the pressure by working harder inside the business. That only teaches the business to lean on you more. The harder you push, the deeper the dependency.'},

  {t:'list',kick:'What dependency costs you',h:'The signs you already know',items:['Long hours that never actually drop','Full order book, margins still thin','Nothing moves cleanly when you are away','The value is in your head, not the company']},

  {t:'part',kick:'Part Two',h:'Owner-Run to Self-Operating',lead:'The way out is not another push. It is building four things into the business so it holds the line when you step back. This is the Landscape Business Mastery framework.'},

  {t:'pillar',no:'Pillar One',h:'Systems that hold without you',lead:'The repeatable work of a landscape business, from quoting to site handover, written down and owned by the team, not stored in your head. Systemised step by step so the standard stays high when you are not watching.'},

  {t:'pillar',no:'Pillar Two',h:'Landscape financial mastery',lead:'Where a full diary still loses money: pricing, recoverable hours, and cash flow through the season. Read the real numbers of a landscape firm and run it for profit, not just for turnover.'},

  {t:'pillar',no:'Pillar Three',h:'A high-performing landscape team',lead:'Hire, train and keep crews and leaders who deliver your standard without you on the tools. Delivery stops depending on the owner and starts depending on the system.'},

  {t:'pillar',no:'Pillar Four',h:'Landscape sales and marketing',lead:'A predictable way to attract the right clients and win the right work, so the pipeline is not feast or famine and not riding on you alone to sell.'},

  {t:'part',kick:'How the pillars fit',h:'A sequence, not a scramble',lead:'Systems create the standard. Financial mastery protects the profit. The team carries the delivery. Sales keeps the right work coming. Each one removes a job that only you could do.'},

  {t:'who',kick:'Part Three',h:'What a self-operating week looks like',lead:'Your name is not on every job tile. The crew leaders handle site. The numbers are read without you pulling them. You work on the business, take real time off, and the standard still holds.'},

  {t:'list',kick:'What it gives the owner back',h:'Why this is worth building',items:['A business that is worth something without you in it','Time off that does not cost you money','A team that owns the standard','Profit you can see and plan around']},

  {t:'cred',kick:'Why me',h:'The coach the UK landscape industry already listens to',items:['Coaching landscape businesses across the UK since 2007','10,000+ coaching hours in this one trade','Certified Business Coach (ActionCOACH) and SYSTEMologist','Pro Landscaper Business Awards judge and FutureScape speaker','Author of Landscape Business Mastery']},

  {t:'who',kick:'Peers, not theory',h:'The Landscape Business Mastery Board',lead:'An invitation-only board for landscape owners doing real revenue. Real data, real peers, relentless accountability, so you build the self-operating business alongside others doing the same.'},

  {t:'who',kick:'Start here',h:'One question to sit with',lead:'Could your landscape business run for two weeks without you, at the standard your clients expect? Your honest answer is the size of the opportunity.'},

  {t:'cta',kick:'Your next step',h:'Build the business that runs without you',lead:'If you want a clear path from owner-run to self-operating, book a discovery call with Nick and we will map where your business is and the first systems to build.',cta:'Book a discovery call with Nick Ruddle',disc:'Educational only. No income or result is guaranteed. Results vary and depend on your market, your team and the work you put in.',foot:'Landscape Business Mastery'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=el('div','slide');
  if(s.kick)d.appendChild(el('div','kick',s.kick));
  if(s.t==='hook'){
    d.appendChild(el('div','big',s.big));
    if(s.note)d.appendChild(el('div','note',s.note));
  } else if(s.t==='pillar'){
    if(s.no)d.appendChild(el('div','pillar-no',s.no));
    d.appendChild(el('h2',null,s.h));
    if(s.lead)d.appendChild(el('div','lead',s.lead));
  } else {
    if(s.h){const H=el(s.t==='title'?'h1':'h2',null,s.h);d.appendChild(H);}
    if(s.t==='title')d.appendChild(el('div','hr'));
    if(s.sub)d.appendChild(el('div','sub',s.sub));
    if(s.lead)d.appendChild(el('div','lead',s.lead));
    if(s.items){const ul=el('ul');s.items.forEach(i=>ul.appendChild(el('li',null,i)));d.appendChild(ul);}
    if(s.cta)d.appendChild(el('div','big','→ '+s.cta));
    if(s.disc)d.appendChild(el('div','disc',s.disc));
  }
  if(s.foot)d.appendChild(el('div','foot',s.foot));
  deck.appendChild(d);
});
</script>
</body>
</html>
