<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Established Vineyards Decline — a live session with Fritz Westover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b2126; --panel:#232b31; --rule:#38444d;
    --accent:#7fa3c6; --ink:#eef2f5; --mut:#9aa7b0; --deep:#0f1418;
    --disp:'Spectral',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--deep);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{max-width:1040px;margin:0 auto;padding:28px 20px 72px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:22px 0;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);opacity:.9}
  .k{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--disp);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--disp);font-weight:600;font-size:38px;line-height:1.12;letter-spacing:-.01em}
  .s{color:var(--mut);font-size:21px;line-height:1.55;margin-top:22px;max-width:46em}
  .big{font-family:var(--disp);font-size:34px;line-height:1.25;color:var(--ink);margin-top:10px}
  ul{list-style:none;margin-top:28px;display:grid;gap:16px}
  li{display:flex;gap:16px;font-size:20px;line-height:1.5;color:var(--ink)}
  li .d{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--panel);border:1px solid var(--accent);color:var(--accent);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:3px}
  .num{font-family:var(--disp);font-size:88px;font-weight:700;color:var(--accent);line-height:1}
  .cred{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
  .cred div{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
  .cred b{font-family:var(--disp);font-size:30px;color:var(--ink);display:block}
  .cred span{color:var(--mut);font-size:15px}
  .disc{margin-top:28px;color:var(--mut);font-size:14px;line-height:1.5;border-top:1px solid var(--rule);padding-top:16px;max-width:52em}
  .cta-step{font-family:var(--disp);font-size:26px;color:var(--accent);margin-top:18px}
  .foot{position:absolute;right:26px;bottom:20px;color:var(--mut);font-size:12px;letter-spacing:.04em}
  .count{position:absolute;left:26px;bottom:20px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title', k:'A live session for winegrape growers',
    h:'Why Established Vineyards Decline',
    s:'And the season-long diagnostic that catches it before harvest. Live with Fritz Westover.'},
  {t:'who', k:'Who this is for',
    h:'Growers already in the ground',
    s:'You planted. You spray, you prune, you watch the weather. This is for the grower whose block is in the ground and who wants it producing for decades, not quietly slipping by year seven.'},
  {t:'trap', k:'The trap',
    h:'You can do everything right and still lose ground',
    s:'The spray program is on schedule. The canopy looks fine from the truck. And yet a block starts giving you less, and nobody can tell you exactly why. That is not bad luck. It is a diagnosis that has not happened yet.'},
  {t:'hook', k:'The hard part',
    h:'Decline is rarely one thing, and it is almost always found too late',
    big:'By the time a vine looks sick, the cause has usually been working on it for one to three seasons.'},
  {t:'p1', k:'Part one',
    h:'Treating symptoms is not the same as diagnosing',
    s:'Most growers react. A leaf yellows, so they feed. Vigor drops, so they prune differently. Each move treats a symptom while the real cause keeps going. The grower who wins reads the vine like a chart and asks what it is telling them first.'},
  {t:'cost', k:'The real cost',
    h:'A declining block charges you before it ever shows in yield',
    s:'Lost tons are the last stage, not the first. Before that you pay in uneven ripening, replant costs, and years of a block underperforming while you guess. Diagnosis is cheap. Guessing is what is expensive.'},
  {t:'frame', k:'Part two',
    h:'The season-long diagnostic',
    s:'Instead of one panic inspection when something looks wrong, you run four honest reads across the season. Each window asks a different question of the vine. Together they catch decline early enough to change the outcome.'},
  {t:'list', k:'The four windows', h:'One season, four reads',
    l:['Dormant: trunk and structure, where trunk disease hides',
       'Bloom: nutrient status and canopy balance',
       'Veraison: vigor and disease pressure under load',
       'Post-harvest: the decline diagnostic and next-season plan']},
  {t:'pill', k:'Window one', num:'01',
    h:'Dormant: read the trunk',
    s:'The structure tells you more with no leaves on it. This is where trunk diseases announce themselves to anyone looking, and where most growers never look.'},
  {t:'pill', k:'Window two', num:'02',
    h:'Bloom: read the feeding',
    s:'Nutrient status and canopy balance set the ceiling for the whole year. A read here is a decision, not a guess, about what the vine actually needs rather than what the calendar says.'},
  {t:'pill', k:'Window three', num:'03',
    h:'Veraison: read it under load',
    s:'With fruit on the vine and heat on the block, weakness shows. Vigor patterns and disease pressure at veraison are the clearest early signal of a block starting to slip.'},
  {t:'pill', k:'Window four', num:'04',
    h:'Post-harvest: the diagnostic',
    s:'After the fruit is off, you diagnose the season honestly and write next year before you forget it. This is the Vineyard Rx read: what declined, why, and the first three moves to reverse it.'},
  {t:'soil', k:'Underneath all four',
    h:'The living system below the vine',
    s:'Soil and the vine microbiome are the foundation the whole season sits on. You cannot diagnose a canopy while ignoring the root zone feeding it. The best read starts in the ground.'},
  {t:'list', k:'The quiet ones', h:'Three decline signals most growers miss until harvest',
    l:['A trunk cross-section that was never checked in the dormant window',
       'Nutrient drift that the calendar spray program hides',
       'Vigor falling off in one part of a block while the rest looks fine']},
  {t:'after', k:'Part three',
    h:'What it looks like when you diagnose on cadence',
    s:'You stop reacting. Each season you already know the three questions to ask and when to ask them. Problems get caught while they are still cheap to fix, and the block you planted keeps producing the way you meant it to.'},
  {t:'cred', k:'Why me',
    h:'This is the read I have run for 25 years',
    cred:[['25 years','hands-on viticulture, US and abroad'],
          ['Penn State','BS Horticulture, MS Plant Pathology'],
          ['5 states','1,000+ acres advised directly'],
          ['39 states','growers reached across 9 countries']]},
  {t:'community', k:'You are not guessing alone',
    h:'Growers never have to grow alone',
    s:'The hardest part of diagnosis is a second set of eyes. A community of growers and a place to bring your block questions turns a lonely guess into a shared read. That is the whole point of the work I do.'},
  {t:'recap', k:'Take this home',
    h:'Four windows. Four questions. One healthy block.',
    s:'Dormant, bloom, veraison, post-harvest. Run the read every season and you will catch decline while it is still a decision and not a loss.'},
  {t:'cta', k:'Your next step',
    h:'Bring your vineyard to the next live session',
    step:'Join the Virtual Viticulture Academy and put your block questions in front of a viticulturist, live.',
    disc:'Educational content only. No income or result is guaranteed. Results vary with site, season, variety, and the effort you put in. Nothing here is a promise about your specific vineyard.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var stage=document.getElementById('stage');
S.forEach(function(s,i){
  var d=el('div','slide');
  if(s.k)d.appendChild(el('div','k',s.k));
  if(s.num)d.appendChild(el('div','num',s.num));
  if(s.h)d.appendChild(el(i===0?'h1':'h2',null,s.h));
  if(s.big)d.appendChild(el('div','big',s.big));
  if(s.s)d.appendChild(el('div','s',s.s));
  if(s.step)d.appendChild(el('div','cta-step',s.step));
  if(s.l){var ul=el('ul');s.l.forEach(function(it,n){var li=el('li');li.appendChild(el('span','d',String(n+1)));li.appendChild(el('span',null,it));ul.appendChild(li);});d.appendChild(ul);}
  if(s.cred){var c=el('div','cred');s.cred.forEach(function(p){var box=el('div');box.appendChild(el('b',null,p[0]));box.appendChild(el('span',null,p[1]));c.appendChild(box);});d.appendChild(c);}
  if(s.disc)d.appendChild(el('div','disc',s.disc));
  d.appendChild(el('div','count',(i+1)+' / '+S.length));
  d.appendChild(el('div','foot','Vineyard Underground'));
  stage.appendChild(d);
});
</script>
</body>
</html>
