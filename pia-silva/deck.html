<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 3-Day Brand - A No BS Masterclass with Pia Silva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf8;        /* her light scheme, warm paper */
    --panel:#f0efe9;     /* soft paper tint */
    --ink:#1e1d1d;       /* her near-black */
    --muted:#6b6966;
    --accent:#72f8c1;    /* her mint, verbatim from brand.json */
    --rule:#1e1d1d;
    --display:'Instrument Serif', Georgia, serif;
    --body:'Manrope', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);
    border:1.5px solid var(--ink);
    border-radius:4px;
    padding:56px 52px;
    margin:0 0 22px;
    min-height:440px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .num{position:absolute;top:18px;right:22px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .kicker{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);font-weight:700;margin-bottom:18px}
  .kicker b{background:var(--accent);padding:2px 8px;border-radius:3px}
  h1{font-family:var(--display);font-weight:400;font-size:62px;line-height:1.02;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.06;margin-bottom:16px}
  .lede{font-size:21px;line-height:1.5;color:var(--ink);max-width:40ch;margin-top:18px}
  .sub{font-size:17px;line-height:1.6;color:var(--muted);max-width:52ch;margin-top:14px}
  .mark{background:var(--accent);padding:1px 6px;border-radius:3px}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  li{font-size:19px;line-height:1.4;padding-left:30px;position:relative}
  li::before{content:"";position:absolute;left:0;top:9px;width:13px;height:13px;background:var(--accent);border:1.5px solid var(--ink);border-radius:2px}
  .big{font-family:var(--display);font-size:120px;line-height:.9;color:var(--ink)}
  .big .mark{font-size:120px}
  .shift{display:flex;align-items:baseline;gap:18px}
  .shift .n{font-family:var(--display);font-size:72px;color:var(--accent);-webkit-text-stroke:1.5px var(--ink);line-height:1}
  .stack{display:grid;gap:8px;margin-top:10px}
  .stack .line{font-family:var(--display);font-size:46px;line-height:1.05}
  .foot{font-size:14px;color:var(--muted);margin-top:30px;max-width:60ch}
  .cta h2{font-size:52px}
  .cta .step{display:inline-block;margin-top:22px;border:1.5px solid var(--ink);border-radius:3px;padding:14px 22px;font-weight:700;font-size:18px;background:var(--accent)}
  .disc{font-size:12px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:66ch}
  .credit{font-size:16px;line-height:1.7;color:var(--ink);margin-top:14px}
  @media(max-width:620px){.slide{padding:38px 26px;min-height:0}h1{font-size:40px}h2{font-size:32px}.big,.big .mark{font-size:76px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'A live No BS masterclass',h:'The 3-Day Brand',lede:'How expert service providers deliver premium work in days, not months - and get paid in full, upfront.',sub:'With Pia Silva, founder of No BS Mastery and Worstofall Design.'},

  {t:'audience',kicker:'Who this is for',h:'You run a small branding, design, or consulting shop.',sub:'You are great at the work. The problem is not your talent. The problem is the model you deliver it in: long projects, endless revisions, and a calendar that fills up faster than your bank account.'},

  {t:'trap',kicker:'The trap',h:'The project treadmill',lede:'Win the pitch. Write the free proposal. Scope the months-long project. Absorb the revisions. Chase the final invoice. Start again.',sub:'Every new client makes you busier, not richer. So the only way you know to grow is to hire - and now you manage people instead of doing the work you are good at.'},

  {t:'reframe',kicker:'The uncomfortable part',h:'It is not a pricing problem. It is a delivery problem.',sub:'Raising your rates inside a months-long, revision-heavy model just means you are underpaid for longer. The thing that has to change first is HOW the work is delivered.'},

  {t:'part',kicker:'Part one',h:'Why the long project quietly kills your margin',sub:'Three leaks almost every expert service business lives with.'},
  {t:'list',kicker:'The three leaks',h:'Where the money goes',items:['Free proposals - you do the thinking before anyone pays','Open-ended revisions - scope creep with no meter running','Months of calendar time - held hostage by one slow client']},

  {t:'part',kicker:'Part two',h:'The No BS Business Model',sub:'Three shifts that let you charge more, deliver faster, and work with clients less than half the time - with no employees.'},
  {t:'shift',n:'01',h:'A paid Lead Product',sub:'Replace the free proposal with a small, paid first step. The client pays to start. You never give away the thinking again, and only serious buyers get through.'},
  {t:'shift',n:'02',h:'Intensive delivery',sub:'Compress months of work into a focused 1 to 3 day intensive. Full payment upfront, a fixed scope, and a finished deliverable at the end. No revision spiral, no chasing invoices.'},
  {t:'shift',n:'03',h:'A referral engine',sub:'Grow from happy clients and relationships, not a content treadmill. When the work is this good and this fast, referrals do the selling for you.'},

  {t:'method',kicker:'The signature move',h:'Brandshrink and Brandup',sub:'The intensive format in practice: the client says YES all day long, and walks out with a finished brand strategy, website, and materials - in days, instead of a project that drags for a quarter.'},
  {t:'show',kicker:'Inside a 3-day intensive',h:'One intensive. A finished brand.',stack:['Day 1 - strategy and positioning','Day 2 - design and messaging','Day 3 - build and launch']},

  {t:'part',kicker:'Part three',h:'Fewer clients. Higher prices. More of your life back.',sub:'When delivery is fast and paid upfront, you need fewer clients to hit your number. That is how you work less without earning less.'},
  {t:'big',kicker:'The shift in one line',big:'Charge more.',line2:'Deliver faster.',line3:'Hire no one.'},

  {t:'credit',kicker:'Why listen to me',h:'I run the model I teach.',credit:'I built Worstofall Design on the intensive model, wrote Badass Your Brand on it, and teach it inside No BS Mastery. This is not theory - it is how my own business runs.'},

  {t:'recap',kicker:'The recap',h:'The No BS Business Model',items:['Paid lead product - get paid to start','Intensive delivery - days, not months, paid upfront','Referral engine - grow without the content grind']},

  {t:'cta',kicker:'Your next step',h:'Ready to build the No BS way?',sub:'If you want help installing this in your own business, apply to join No BS Mastery and we will map your first paid lead product and intensive together.',step:'Apply to No BS Mastery',disc:'Educational content only. No earnings or results are promised or guaranteed; outcomes vary with your market, offer, and effort. Examples reflect one business and are not a prediction of your results.'}
];

const d=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='cta'?'cta':'');
  let html='<div class="num">'+String(i+1).padStart(2,'0')+' / '+S.length+'</div>';
  if(s.kicker) html+='<div class="kicker"><b>'+s.kicker+'</b></div>';
  if(s.t==='title'){ html+='<h1>'+s.h+'</h1>'; if(s.lede)html+='<p class="lede">'+s.lede+'</p>'; if(s.sub)html+='<p class="sub">'+s.sub+'</p>'; }
  else if(s.t==='big'){ html+='<div class="big">'+s.big+'<br>'+s.line2+'<br><span class="mark">'+s.line3+'</span></div>'; }
  else if(s.t==='shift'){ html+='<div class="shift"><div class="n">'+s.n+'</div><div><h2>'+s.h+'</h2><p class="sub">'+s.sub+'</p></div></div>'; }
  else if(s.t==='show'){ html+='<h2>'+s.h+'</h2><div class="stack">'+s.stack.map(x=>'<div class="line">'+x+'</div>').join('')+'</div>'; }
  else if(s.t==='list'||s.t==='recap'){ html+='<h2>'+s.h+'</h2><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  else if(s.t==='credit'){ html+='<h2>'+s.h+'</h2><p class="credit">'+s.credit+'</p>'; }
  else if(s.t==='cta'){ html+='<h2>'+s.h+'</h2>'; if(s.sub)html+='<p class="sub">'+s.sub+'</p>'; html+='<span class="step">'+s.step+'</span><p class="disc">'+s.disc+'</p>'; }
  else { html+='<h2>'+s.h+'</h2>'; if(s.lede)html+='<p class="lede">'+s.lede+'</p>'; if(s.sub)html+='<p class="sub">'+s.sub+'</p>'; }
  el.innerHTML=html;
  d.appendChild(el);
});
</script>
</body>
</html>
