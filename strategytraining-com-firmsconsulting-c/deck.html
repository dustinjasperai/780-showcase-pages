<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>How Strategy Partners Actually Think · Kris Safarova, StrategyTraining.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf8f4; --panel:#f1ece3; --rule:#e2dad0;
    --acc:#d8613c; --ink:#141210; --body:#4b4640; --dim:#8a8175; --cream:#faf8f4;
  }
  html,body{height:100%}
  body{background:#efe8dc;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe8dc}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Cardo',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.16;letter-spacing:.002em}
  .t-title h1{font-size:4.6vw;max-width:94%;font-weight:700}
  .t-normal h1{font-size:3.0vw;max-width:90%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Cardo',serif;font-style:italic;font-size:1.9vw;color:var(--acc);margin-top:3.6vh;max-width:86%;line-height:1.45;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#211a13 0%,#141210 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:88%;color:var(--cream);font-weight:400}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#211a13 0%,#141210 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Inter',sans-serif;color:#e7ded2;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.84vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .gr-motif{position:absolute;pointer-events:none}
  .title-gr{right:7.2%;bottom:8.5%;width:18vw;opacity:.9}
  .corner-gr{right:6.5%;bottom:7.5%;width:8.5vw;opacity:.45}
  .brandline{font-family:'Inter',sans-serif;font-size:1.1vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.04em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(20,18,16,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.8vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">StrategyTraining.com</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: an issue tree, a root question decomposed into MECE branches, drawn in terracotta. their actual method, not a generic shape -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gr" viewBox="0 0 120 120">
  <g fill="none" stroke="#d8613c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 60 H40" opacity="0.9"/>
    <path d="M40 60 V26 H70" opacity="0.7"/>
    <path d="M40 60 V94 H70" opacity="0.7"/>
    <path d="M40 60 H70" opacity="0.7"/>
    <rect x="6" y="52" width="9" height="16" rx="2" fill="#d8613c" stroke="none" opacity="0.95"/>
    <rect x="70" y="19" width="30" height="14" rx="2" opacity="0.9"/>
    <rect x="70" y="53" width="30" height="14" rx="2" opacity="0.9"/>
    <rect x="70" y="87" width="30" height="14" rx="2" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'How Strategy Partners Actually Think',sub:'The first-principles method that ex-McKinsey, BCG and Bain partners use to break any business problem, taught so anyone can learn it, no pedigree required.',brand:true,gr:'title'},
 {t:'normal',k:'Who this is for',title:'You have memorized every framework and still freeze the moment a real problem lands on the page.',body:'You are an aspiring consultant or an ambitious operator. You know the profitability tree, the 4Ps, the market-entry checklist. But a framework tells you what to name, not how to think, and a real problem never arrives labeled. When the page is blank, recall is not the skill you need.'},
 {t:'dark',title:'Frameworks are what you memorize. Strategy is how you reason. The two are not the same thing.'},

 {t:'section',idx:'Part One',title:'Why Framework Recall Runs Out'},
 {t:'normal',k:'The memorization trap',title:'A framework is an answer someone else already found. Strategy is finding the answer nobody has yet.',body:'Frameworks are compressed hindsight, useful once you know which one fits. But the hard part of any real problem is deciding what actually matters before a framework can help, and that decision is exactly the part memorization skips. So you reach for a tool and hope the problem matches it.'},
 {t:'normal',k:'The blank page',title:'The gap is not knowledge. It is a method for thinking when nothing is labeled yet.',body:'Partners are not smarter about frameworks than you are. They have a repeatable way to walk into an unfamiliar problem, break it down from what is true, and build toward an answer under real uncertainty. That method is learnable, and it is the whole difference.'},
 {t:'dark',title:'You cannot memorize your way to judgment. You can only practice the way judgment is built.'},

 {t:'section',idx:'Part Two',title:'The Way Partners Actually Reason'},
 {t:'normal',k:'One, start from first principles',title:'Before any framework, ask what is actually true here, and build up from there.',body:'A partner strips the problem back to what is known, what is assumed, and what would have to be true for each path to work. You are no longer matching the situation to a template. You are reasoning from the ground up, which is why the method holds even when the problem is one you have never seen.'},
 {t:'normal',k:'Two, lead with a hypothesis',title:'Take a position early, then structure the problem to prove or kill it.',body:'Instead of boiling the ocean, a partner commits to a likely answer on day one and lays out the issues that would confirm or break it, cleanly separated so nothing overlaps and nothing is missed. The structure is in service of a hypothesis, not a substitute for having one.'},
 {t:'normal',k:'Three, run it like a real engagement',title:'Work the problem the way a study actually runs, from scoping to the answer.',body:'Real strategy is not a single clever slide. It is scoping the question, managing the analysis, reading the numbers, and moving the people who have to act on it. Practicing on recreated versions of real McKinsey, BCG and Bain studies is how you learn the whole arc, not just the interview version of it.'},
 {t:'normal',k:'Four, storyboard the answer',title:'Decide the story before you build the analysis, so the work points somewhere.',body:'A partner sketches the argument first, the handful of things that must be true for the recommendation to hold, and then does only the analysis that tests them. The result is work that leads to a decision instead of a deck that lists everything you looked at.'},
 {t:'dark',title:'First principles, a hypothesis, the full engagement, a clear story. That is the method under the method.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Think This Way'},
 {t:'normal',k:'The strategist this builds',title:'You walk into an unfamiliar problem with a method instead of a memory, and you are calm because of it.',body:'The case interview stops being a test of recall and becomes a demonstration of how you reason. And it does not stop there. The same method is what you use on the job, in the boardroom, and on the next problem no framework was written for. That is what actually transfers.'},
 {t:'dark',title:'The goal was never to sound like a consultant. It was to think like one.'},
 {t:'normal',k:'Why Kris Safarova',title:'A strategist who teaches the real method, with the partners who used it, and who learned it without a pedigree herself.',body:'Kris Safarova is founder of FIRMSconsulting and StrategyTraining.com, home to thousands of in-depth studies produced with former McKinsey, BCG and Bain partners. She is a bestselling author of more than twenty strategy books and host of The Strategy Skills podcast. She started at twenty-five as a receptionist with no degree, which is why the whole method is built to be learnable by anyone willing to do the work.'},

 {t:'section',idx:'Your Next Step',title:'Learn to Think Like a Partner'},
 {t:'normal',k:'Keep going with Kris',title:'Practice the method on real studies, at your own pace, with the partners who used it.',body:'StrategyTraining.com is where you go deeper: full recreated studies from scoping to recommendation, taught by former partners, so the first-principles method becomes something you can actually do and not just something you have seen. Start there and build from the case interview all the way to the boardroom.'},
 {t:'cta',title:'Ready to learn how strategy partners actually think?',body:'Go deeper with Kris Safarova on StrategyTraining.com.',chips:['Start on StrategyTraining.com','Explore the mentoring programs'],disc:'Educational content for aspiring consultants and operators building strategy skills. No career, hiring, or income result is guaranteed. Outcomes vary by individual, effort, and circumstance.'},
];

const deck=document.getElementById('deck');
function gr(kind){return `<svg class="gr-motif ${kind==='title'?'title-gr':'corner-gr'}"><use href="#gr"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Strategy<b>Training</b>.com · Kris Safarova</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.gr) h+=gr(s.gr);
  else if(s.t==='title') h+=gr('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
