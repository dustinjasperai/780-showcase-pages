<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prosody: The Craft That Fixes a Flat Song, A Masterclass with Andrea Stolpe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Alice&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f3;
    --panel:#f2ece2;
    --rule:#e3d8c8;
    --ink:#231e1a;
    --muted:#5d565d;
    --accent:#983e1f;
    --display:'Cormorant Garamond', Georgia, serif;
    --body:'Alice', Georgia, serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center}
  .slide.cover{background:var(--panel)}
  .kick{font-family:var(--body);text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.05;margin:0 0 20px}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;margin:0 0 18px}
  .partno{font-family:var(--display);font-size:120px;font-weight:600;color:var(--accent);line-height:1;margin:0 0 10px}
  p{font-size:21px;margin:0 0 16px;max-width:40em}
  p.lead{font-size:25px;color:var(--ink)}
  .sub{color:var(--muted);font-size:19px}
  ul{font-size:21px;margin:10px 0 0;padding-left:0;list-style:none;max-width:40em}
  li{padding:12px 0;border-bottom:1px solid var(--rule)}
  li b{font-family:var(--display);font-weight:600;color:var(--accent)}
  .rule{width:64px;height:3px;background:var(--accent);margin:0 0 26px}
  .disc{color:var(--muted);font-size:15px;margin-top:26px;max-width:46em}
  .credits li{display:flex;gap:14px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'cover', kick:'A free live masterclass with Andrea Stolpe',
   h:'Prosody: Why Your Songs Feel Flat, and the Craft That Fixes It',
   p:'Sixty minutes on the one thing most songwriters are never taught to control. Live, with time to bring your own song.'},

  {t:'who', kick:'Who this is for',
   h:'For the writer who did everything right, and the song still does not land.',
   p:'You have the melody. You have the idea. You have sat with it for weeks. And something about it still feels flat, and nobody can tell you why.'},

  {t:'trap', kick:'The trap',
   h:'You were told to wait for inspiration.',
   p:'So you wait. You chase a better line, a cooler chord, a clever twist. When the song still misses, you decide maybe you just are not talented enough. That conclusion is wrong, and it is costing you songs.'},

  {t:'reframe', kick:'The reframe',
   h:'The problem was never your talent.',
   p:'It is that no one taught you the part of songwriting you can actually control. A flat song is almost never a talent problem. It is a craft problem, and craft can be learned, diagnosed, and fixed.'},

  {t:'part', kick:'Part One', no:'1', h:'Why songs feel flat'},

  {t:'content', kick:'Part One',
   h:'A flat song is words and music pulling in opposite directions.',
   p:'When the lyric says one thing and the melody, rhythm, and chords say another, the listener feels the mismatch without being able to name it. The song reads as unconvincing. The fix is not a better idea. It is alignment.'},

  {t:'content', kick:'Part One',
   h:'Inspiration is not a method.',
   p:'Inspiration gives you a start. It will not finish a song, and it will not tell you why a finished one is not working. For that you need a way to look under the hood, on demand, whether or not the muse showed up today.'},

  {t:'part', kick:'Part Two', no:'2', h:'Prosody, the craft you control'},

  {t:'content', kick:'Part Two',
   h:'Prosody is the agreement of words and music.',
   p:'It is the master principle of my teaching. When the musical and lyrical elements agree, they feed off one another, and the song becomes more purposeful, more believable, and more potent. Prosody is what you are hearing when a simple song hits hard.'},

  {t:'list', kick:'Part Two',
   h:'The four things you can always control',
   p:'When a song is not working, you do not wait. You diagnose it against four elements, and you adjust the one that is fighting the lyric.',
   list:['<b>Melody</b> the shape and pitch of the line',
         '<b>The words</b> what is literally being said',
         '<b>The rhythm</b> how the syllables move in time',
         '<b>The chords</b> the harmony underneath it all']},

  {t:'content', kick:'Part Two',
   h:'Specificity: the furniture in a song.',
   p:'There is a boat, powder blue, and the oars are solid wood. That is how a listener believes you. Get specific early, and stay specific a little longer than you feel comfortable doing. Vague is the enemy of felt.'},

  {t:'content', kick:'Part Two',
   h:'Momentum keeps the listener moving.',
   p:'Great songs never stall. Momentum is the forward energy that carries a listener from the first line to the last, and it is a lens you can use to find exactly where a song loses them.'},

  {t:'content', kick:'Part Two',
   h:'Separate brainstorming from editing.',
   p:'The writer who cannot finish is usually doing both at once, judging every idea the moment it arrives. Keep the two phases apart, write daily in short focused sessions, and craft stops depending on mood.'},

  {t:'part', kick:'Part Three', no:'3', h:'Your songs, diagnosed'},

  {t:'content', kick:'Part Three',
   h:'You stop guessing and start diagnosing.',
   p:'Bring a song that feels flat. We run it against the four controllable elements, find the line where the words and music disagree, and make the one change that aligns them. The difference is immediate and you can hear it.'},

  {t:'content', kick:'Part Three',
   h:'Ten steps, from blank page to finished story.',
   p:'My book, Popular Lyric Writing, lays out ten steps to effective storytelling, the same process taught at Berklee, USC Thornton, and Belmont. In the masterclass you see how the first steps turn a vague idea into a specific, singable scene.'},

  {t:'why', kick:'Why learn this from me',
   h:'Andrea Stolpe',
   p:'Twenty-plus years writing, teaching, and diagnosing songs.',
   list:['Berklee College of Music graduate; Nashville staff writer since 1998',
         'Credits with Faith Hill, Julianne Hough, and Jimmy Wayne',
         'Helped design the songwriting curriculum at USC Thornton; teaches at Berklee and Belmont',
         'Berklee Exemplary Faculty Award; Music Educator Grammy nominations; Gold Telly',
         'Author of Popular Lyric Writing: 10 Steps to Effective Storytelling']},

  {t:'recap', kick:'The method in one line',
   h:'You do not need more secrets. You need prosody, specificity, and the reps.',
   p:'Songwriting is a craft you can control. Once you can diagnose a song instead of hoping for one, every song you write gets better on purpose.'},

  {t:'invite', kick:'The mentorship',
   h:'Keep working with me.',
   p:'If you want the craft held to your own songs, week after week, my Platinum Mentorship is one-on-one work with me on a small, capped roster of writers. The masterclass is the first hour. The mentorship is the rest of the climb.'},

  {t:'cta', cls:'cover', kick:'Your next step',
   h:'Bring your songs. Let us make them land.',
   p:'Apply for the Platinum Mentorship or explore the programs at andreastolpe.com.',
   disc:'This masterclass is educational. No income, chart position, placement, or career result is guaranteed. Results vary and depend on your own practice and circumstances.'}
];

const deck = document.getElementById('deck')
S.forEach(function(s){
  const el = document.createElement('section')
  el.className = 'slide ' + (s.cls || '')
  let html = ''
  if(s.kick){ html += '<div class="kick">'+s.kick+'</div>' }
  if(s.no){ html += '<div class="partno">'+s.no+'</div>' }
  if(s.h && (s.t==='title')){ html += '<h1>'+s.h+'</h1>' } else if(s.h){ html += '<h2>'+s.h+'</h2>' }
  if(s.t!=='part' && s.t!=='title'){ html += '<div class="rule"></div>' }
  if(s.p){ html += '<p class="'+((s.t==='title')?'lead':'')+'">'+s.p+'</p>' }
  if(s.list){
    const cls = (s.t==='why') ? 'credits' : ''
    html += '<ul class="'+cls+'">'
    s.list.forEach(function(i){ html += '<li>'+i+'</li>' })
    html += '</ul>'
  }
  if(s.disc){ html += '<p class="disc">'+s.disc+'</p>' }
  el.innerHTML = html
  deck.appendChild(el)
})
</script>
</body>
</html>
