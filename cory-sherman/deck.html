<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The A.G.E.N.T Advantage — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f7f2ea;      /* warm cream, from the site ground */
    --ink:#211d1a;         /* charcoal body text */
    --panel:#262320;       /* deep warm charcoal for dark slides */
    --accent:#b5552f;      /* warm clay accent (derived; brand is monochrome) */
    --muted:#6f6659;
    --line:#d8cebc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    font-family:'Source Sans Pro',system-ui,sans-serif;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  #stage{
    width:min(96vw,1040px);
    aspect-ratio:16/9;
    background:var(--ground);
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    border-radius:6px;
  }
  .slide{
    position:absolute;inset:0;
    padding:7% 8%;
    display:none;
    flex-direction:column;
    justify-content:center;
  }
  .slide.on{display:flex}
  h1{font-family:'Prata',Georgia,serif;font-weight:400;line-height:1.08;color:var(--ink)}
  h2{font-family:'Prata',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.12}
  .kicker{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:1.1rem}
  .lede{font-size:1.4rem;line-height:1.5;color:var(--muted);margin-top:1.4rem;max-width:30ch}
  p.body{font-size:1.25rem;line-height:1.55;color:var(--ink);margin-top:1rem;max-width:42ch}
  ul{margin-top:1.3rem;list-style:none;display:grid;gap:.85rem;max-width:44ch}
  ul li{font-size:1.18rem;line-height:1.4;padding-left:1.5rem;position:relative;color:var(--ink)}
  ul li::before{content:"";position:absolute;left:0;top:.55em;width:.6rem;height:.6rem;background:var(--accent);border-radius:1px}
  .big{font-size:clamp(2.1rem,5vw,3.4rem)}
  .xl{font-size:clamp(2.6rem,6.5vw,4.6rem)}
  .letter{font-family:'Prata',Georgia,serif;color:var(--accent);font-size:clamp(3rem,9vw,6rem);line-height:1}
  .step-row{display:flex;align-items:baseline;gap:1.4rem}
  .step-row .meaning{font-family:'Prata',Georgia,serif;font-size:clamp(1.8rem,4vw,2.8rem);color:var(--ink)}
  .dark{background:var(--panel)}
  .dark h1,.dark h2,.dark p.body,.dark li{color:var(--ground)}
  .dark .lede{color:#cdbfa8}
  .quote{font-family:'Prata',Georgia,serif;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.25;color:var(--ground);max-width:24ch}
  .sig{margin-top:2rem;font-size:1rem;color:var(--muted);letter-spacing:.04em}
  .dark .sig{color:#b7a98f}
  .rule{width:64px;height:3px;background:var(--accent);margin:1.4rem 0}
  .spine{display:flex;gap:.5rem;margin-top:1.6rem}
  .spine span{font-family:'Prata',Georgia,serif;font-size:1.5rem;color:var(--line)}
  .spine span.hot{color:var(--accent)}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.4rem 2.4rem;margin-top:1.6rem;max-width:40ch}
  .stat b{display:block;font-family:'Prata',Georgia,serif;font-size:2.2rem;color:var(--accent);line-height:1}
  .stat span{font-size:1rem;color:var(--muted)}
  .disclaimer{font-size:.82rem;line-height:1.4;color:var(--muted);margin-top:1.8rem;max-width:52ch}
  .cta-steps{margin-top:1.3rem;display:grid;gap:.7rem;max-width:40ch}
  .cta-steps div{font-size:1.2rem;color:var(--ground)}
  .cta-steps b{color:var(--accent)}
  #nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;color:#d8cebc;font-size:.85rem;font-family:'Source Sans Pro',sans-serif}
  #nav button{background:transparent;border:1px solid #6f6659;color:#d8cebc;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem}
  #dots{display:flex;gap:6px}
  #dots i{width:7px;height:7px;border-radius:50%;background:#55504a;display:inline-block}
  #dots i.on{background:var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">&#8592;</button><span id="count"></span><button id="next">&#8594;</button></div>
<script>
const S = [
  {t:'title', cls:'dark', h:'The A.G.E.N.T Advantage',
   lede:'How top agents win the hard conversations, with composure instead of scripts.',
   sig:'A live masterclass with Cory Sherman, REALTOR &amp; KWU Certified Instructor'},

  {t:'who', kicker:'Who this is for', h:'Every deal you lose, you lose in a conversation.',
   body:'For real estate agents and team leaders who negotiate price, repairs, commissions and buyer expectations under real pressure, and want to stop leaving their client’s money on the table.'},

  {t:'trap', kicker:'The trap', h:'You were trained on scripts.',
   body:'Scripts are fine until the room gets emotional. A frustrated seller, a defensive buyer’s agent, an inspection that blows up the deal. That is exactly the moment a memorized line falls apart, and most agents react instead of respond.'},

  {t:'hook', cls:'dark',
   quote:'The most expensive word in a negotiation is “Sure.”',
   body:'Reflexive agreement, conceding just to keep the peace, is where agents quietly give away their client’s money. The deals do not fall apart loudly. They leak.'},

  {t:'part', kicker:'Part one', h:'Negotiation is emotional before it is tactical.'},

  {t:'content', kicker:'The real problem', h:'Tactics fail when your nervous system takes over.',
   bullets:['Under pressure you default to fight, fold or freeze, not strategy.',
            'The other side is reacting too, so positions harden and nobody solves anything.',
            'A script cannot read the room. You can, once you know how to stay grounded.']},

  {t:'content', kicker:'Know your default', h:'Turtle, Puppy Dog, or Lion?',
   bullets:['The Turtle withdraws and avoids the hard ask, so the client pays for it.',
            'The Puppy Dog over-accommodates and says “Sure” to keep everyone happy.',
            'The Lion pushes hard and wins the point but can lose the relationship.',
            'Step one is recognizing your own posture before it costs you the deal.']},

  {t:'part', cls:'dark', kicker:'Part two', h:'The A.G.E.N.T Framework',
   lede:'Five steps that turn a high-pressure conversation into a win-win close.'},

  {t:'step', letter:'A', meaning:'Awareness',
   body:'Recognize you are in a conflict and choose your response. The moment you name it, you stop reacting on autopilot.'},

  {t:'step', letter:'G', meaning:'Ground Yourself',
   body:'Manage your own emotional response first. Get clear on what you want, why you want it, and your BATNA before you say a word.'},

  {t:'step', letter:'E', meaning:'Empathize',
   body:'Understand what is actually driving the other side, their needs, interests and fears. You cannot solve a problem you have not heard.'},

  {t:'step', letter:'N', meaning:'Navigate',
   body:'Collaborate toward interest-based, win-win solutions instead of trading positions. This is where composure turns into leverage.'},

  {t:'step', letter:'T', meaning:'Tie It All Together',
   body:'Turn the agreement into clear, accountable terms. Get it in writing so the win survives the drive home.'},

  {t:'recap', kicker:'The spine', h:'Five steps you can run in any room.',
   body:'Awareness. Ground. Empathize. Navigate. Tie it together. Not a script to memorize, a sequence to think through, every time the stakes are real.',
   spine:true},

  {t:'part', kicker:'Part three', h:'The framework, inside a deal that almost died.'},

  {t:'content', kicker:'In the field', h:'The inspection that could have killed the deal.',
   bullets:['Awareness: name it as a negotiation, not a fight to win.',
            'Ground: know your client’s real must-haves and walk-away point.',
            'Empathize: hear what the other side is truly worried about.',
            'Navigate and tie it together: build the repair credit everyone can sign.']},

  {t:'content', kicker:'In the field', h:'The commission conversation.',
   bullets:['The Puppy Dog discounts the second it gets uncomfortable.',
            'Grounded, you can hold your value and explain it without apology.',
            'Empathy reframes price as the cost of the outcome they actually want.',
            'You keep the fee and keep the relationship.']},

  {t:'why', cls:'dark', kicker:'Why learn this from me', h:'I negotiate for a living, then I teach it.',
   body:'I came into real estate in 2017 from bartending and the service world, not finance. I built a business on emotional intelligence and real conversations, and now I teach it on stage and on Zoom.',
   stats:[['225+','closed transactions'],['$85M+','in sales volume'],['14,000','attendees at a recent keynote'],['KW MAPS','Fast Track Coach, KWU Certified']]},

  {t:'shift', kicker:'The shift', h:'Go deeper, not wider.',
   body:'The agents who last are not the ones with the most scripts. They are the ones who can stay calm, read people, and build agreements that hold. Learn from the field, not just the stage.'},

  {t:'cta', cls:'dark', kicker:'Your next step', h:'Bring the A.G.E.N.T Advantage to your next negotiation.',
   steps:[['Join the next live','A.G.E.N.T Advantage cohort'],
          ['Or bring the workshop','to your team or brokerage'],
          ['Start where every deal does','the hard conversation'],
          ['Find it all at','agentadvantagehq.com']],
   disclaimer:'This masterclass is for educational purposes only. Results vary and depend on individual effort, market conditions and many factors outside any trainer’s control. Nothing here is a guarantee of income, commissions, or any specific outcome.'}
];

const stage = document.getElementById('stage');
function slideHTML(s){
  let inner = '';
  if(s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){
    inner += `<h1 class="xl">${s.h}</h1>`;
    if(s.lede) inner += `<div class="lede">${s.lede}</div>`;
    if(s.sig) inner += `<div class="sig">${s.sig}</div>`;
  } else if(s.t==='hook'){
    inner += `<div class="quote">${s.quote}</div><div class="rule"></div>`;
    if(s.body) inner += `<p class="body">${s.body}</p>`;
  } else if(s.t==='step'){
    inner += `<div class="step-row"><span class="letter">${s.letter}</span><span class="meaning">${s.meaning}</span></div>`;
    inner += `<p class="body">${s.body}</p>`;
  } else if(s.t==='why'){
    inner += `<h2 class="big">${s.h}</h2>`;
    if(s.body) inner += `<p class="body">${s.body}</p>`;
    if(s.stats){ inner += '<div class="stat-grid">'; s.stats.forEach(x=>{inner+=`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`;}); inner += '</div>'; }
  } else if(s.t==='cta'){
    inner += `<h2 class="big">${s.h}</h2><div class="cta-steps">`;
    s.steps.forEach(x=>{inner+=`<div>${x[0]} <b>${x[1]}</b></div>`;});
    inner += `</div><div class="disclaimer">${s.disclaimer}</div>`;
  } else {
    inner += `<h2 class="big">${s.h}</h2>`;
    if(s.lede) inner += `<div class="lede">${s.lede}</div>`;
    if(s.body) inner += `<p class="body">${s.body}</p>`;
    if(s.bullets){ inner += '<ul>'; s.bullets.forEach(b=>inner+=`<li>${b}</li>`); inner += '</ul>'; }
    if(s.spine){ inner += '<div class="spine"><span class="hot">A</span><span class="hot">G</span><span class="hot">E</span><span class="hot">N</span><span class="hot">T</span></div>'; }
  }
  const dark = s.cls==='dark' ? ' dark' : '';
  return `<div class="slide${dark}" data-i>${inner}</div>`;
}
stage.innerHTML = S.map(slideHTML).join('');
const slides = [...document.querySelectorAll('.slide')];
let i = 0;
const dots = document.createElement('span'); dots.id='dots';
slides.forEach(()=>dots.insertAdjacentHTML('beforeend','<i></i>'));
document.getElementById('nav').insertBefore(dots, document.getElementById('count'));
function show(n){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((el,k)=>el.classList.toggle('on', k===i));
  [...dots.children].forEach((d,k)=>d.classList.toggle('on', k===i));
  document.getElementById('count').textContent = (i+1)+' / '+slides.length;
}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
show(0);
</script>
</body>
</html>
