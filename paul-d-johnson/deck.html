<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THRIVE in the God Zone, a masterclass with Paul D. Johnson</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f6;      /* light desaturated tint of his accent #186aa0 over white */
    --panel:#ffffff;
    --rule:#dbe4ea;
    --ink:#363636;     /* dominant text, brand.json #363636 */
    --muted:#6b6b6b;   /* brand.json #666666 */
    --accent:#186aa0;  /* his own link blue, brand.json */
    --head:'Newsreader',Georgia,serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #deck{height:100vh;display:flex;align-items:center;justify-content:center}
  .slide{display:none;width:100%;max-width:1040px;min-height:600px;margin:0 auto;padding:72px 84px;
    background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    box-shadow:0 24px 60px rgba(54,54,54,.08);position:relative}
  .slide.on{display:block}
  .kick{font-size:14px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--head);font-weight:600;font-size:58px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:42px;line-height:1.12;margin-bottom:22px}
  .lede{font-size:24px;line-height:1.5;color:var(--muted);margin-top:24px;max-width:46ch}
  .big{font-family:var(--head);font-weight:500;font-size:40px;line-height:1.25;max-width:22ch}
  .big .a{color:var(--accent);font-style:italic}
  p{font-size:22px;line-height:1.6;color:var(--ink);margin-top:18px;max-width:52ch}
  ul{margin-top:22px;list-style:none}
  li{font-size:22px;line-height:1.5;padding-left:34px;position:relative;margin-bottom:18px;max-width:50ch}
  li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:5px;border:2.5px solid var(--accent)}
  .pillar{font-family:var(--head);font-size:30px;font-weight:600;color:var(--accent);margin-top:8px}
  .rule{height:2px;background:var(--rule);margin:30px 0;max-width:120px}
  .foot{position:absolute;left:84px;right:84px;bottom:34px;display:flex;justify-content:space-between;
    align-items:center;font-size:14px;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px}
  .brandmark{font-weight:700;letter-spacing:.02em;color:var(--ink)}
  .brandmark .z{color:var(--accent)}
  .disc{font-size:15px;color:var(--muted);line-height:1.5;margin-top:26px;max-width:60ch}
  .cta-step{font-family:var(--head);font-size:34px;font-weight:600;color:var(--accent);margin-top:18px}
  .nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;z-index:20}
  .nav button{font-family:var(--body);font-size:15px;font-weight:600;color:#fff;background:var(--accent);
    border:0;border-radius:100px;padding:10px 20px;cursor:pointer}
  .nav .count{font-size:14px;color:var(--muted)}
  @media (max-width:720px){.slide{padding:48px 32px}h1{font-size:40px}h2{font-size:30px}.foot{position:static;margin-top:40px}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav"><button id="prev">Prev</button><span class="count" id="count"></span><button id="next">Next</button></div>
<script>
const S=[
  {t:'title', kick:'A live masterclass with Paul D. Johnson',
    h:'THRIVE in the God Zone',
    lede:'How believers live in hope with amazing productivity and supernatural achievement.' },

  {t:'audience', kick:'Who this is for',
    h:'For the believer who is busy, faithful, and still stuck.',
    lede:'You pray. You work hard. You love God. And yet the results feel capped, and the striving never quite ends.' },

  {t:'trap', kick:'The trap',
    h2:'You were told to just try harder.',
    p:'So you added more discipline, more hustle, more early mornings. The tank keeps draining, and the breakthrough you are believing for stays one step away. That is not a faith problem. It is an engine problem.' },

  {t:'reframe', kick:'A different way to see it',
    big:'Hustle and faith were never meant to be the <span class="a">same engine</span>.' },

  {t:'premise', kick:'The premise',
    h2:'The promises of God are testable.',
    p:'I trained as an engineer and an economist before I trained anyone in faith. What I found about the Bible is that the works and the promises of God are testable, and they pass the test. THRIVE is what happens when you run that test on purpose.' },

  {t:'part', kick:'Part one',
    h:'Why productivity breaks down.' },

  {t:'body', kick:'Part one',
    h2:'Striving in your own power.',
    p:'Most of us try to achieve first and invite God in later. We set the goal, then ask Him to bless it. The order is backwards, and it is exactly why the effort feels heavy and the fruit feels thin.' },

  {t:'body', kick:'Part one',
    h2:'What common teaching gets wrong.',
    p:'The usual answer is more grind or more positive thinking. Neither one connects your daily action to the one voice that can actually multiply it. You do not need more willpower. You need a different starting point.' },

  {t:'part', kick:'Part two',
    h:'The THRIVE framework.' },

  {t:'overview', kick:'Part two',
    h2:'Three moving parts.',
    p:'THRIVE runs on three components. Each one is testable, and each one builds on the one before it.',
    pillars:["God's Touch","Amazing Daily Habits","Empowered Actions"] },

  {t:'body', kick:'Component one',
    h2:"God's Touch",
    p:'It starts with hearing God’s voice on the specific goal in front of you. Not a general quiet time, a specific word for a specific decision. This is the first of the three methods: hear God’s voice, operate in His power and authority, and serve with His love.' },

  {t:'body', kick:'Component two',
    h2:'Amazing Daily Habits',
    p:'The word you receive becomes a daily rhythm. One Kingdom goal, aligned habits around it, and a short review that tests what God said against what actually happened. This is where hope stops being a feeling and becomes a practice.' },

  {t:'body', kick:'Component three',
    h2:'Empowered Actions',
    p:'Then you act, in His power and authority rather than your own effort. One empowered action at a time, tested and adjusted. Small, faithful, measurable steps are what compound into supernatural achievement.' },

  {t:'methods', kick:'The structure',
    h2:'A trilogy of trilogies.',
    p:'The methods that carry all three components:',
    pillars:["Hear God’s Voice","Operate in His Power & Authority","Serve with His Love"] },

  {t:'part', kick:'Part three',
    h:'Living in the God Zone.' },

  {t:'outcome', kick:'Part three',
    h2:'The goals you were made for.',
    p:'When the engine is right, the goals change shape:',
    pillars:["See the Unseeable","Touch the Intangible","Achieve the Improbable"] },

  {t:'body', kick:'Part three',
    h2:'Achievement that overflows.',
    p:'THRIVE is not achievement for its own sake. You receive amazing wisdom, live with inspired purpose, and prosper through trouble, so that what God builds in you serves the people around you. That is the God Zone.' },

  {t:'whyme', kick:'Why listen to me',
    h2:'Paul D. Johnson',
    p:'Interdisciplinary master’s in engineering, economics, and business from UCLA. Former technology consultant, college instructor, and real estate developer, then a live TV and radio host and ministry leader. Today I host The God Zone Show and train believers to THRIVE. I bring a testable, systems mind to a life of faith.' },

  {t:'recap', kick:'The path',
    h2:'The THRIVE path, in one line.',
    p:'Hear the voice. Build the habit. Take the empowered action. Test the promise, then do it again. Hope becomes productivity, and productivity becomes achievement that lasts.' },

  {t:'cta', kick:'Your next step',
    h:'Bring one impossible goal.',
    step:'Book a free 48-minute Reveal Coaching Session',
    lede:'We will find where you are, hear what God is saying about your goal, and map your first THRIVE plan together.',
    disc:'This masterclass is for educational and inspirational purposes only. It is not professional, financial, or medical advice, and it is not a guarantee of any specific result. Outcomes vary by individual.' }
];

const deck = document.getElementById('deck');
deck.innerHTML = S.map((s,i) => {
  let inner = '';
  if (s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if (s.h) inner += `<h1>${s.h}</h1>`;
  if (s.h2) inner += `<h2>${s.h2}</h2>`;
  if (s.big) inner += `<div class="big">${s.big}</div>`;
  if (s.lede) inner += `<div class="lede">${s.lede}</div>`;
  if (s.p) inner += `<p>${s.p}</p>`;
  if (s.pillars) { inner += '<div class="rule"></div>' + s.pillars.map(x=>`<div class="pillar">${x}</div>`).join(''); }
  if (s.step) inner += `<div class="cta-step">${s.step}</div>`;
  if (s.disc) inner += `<div class="disc">${s.disc}</div>`;
  inner += `<div class="foot"><span class="brandmark">THRIVE in the God <span class="z">Zone</span></span><span>Paul D. Johnson</span></div>`;
  return `<section class="slide${i===0?' on':''}" data-i="${i}">${inner}</section>`;
}).join('');

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
const count = document.getElementById('count');
function show(n){ cur=Math.max(0,Math.min(slides.length-1,n)); slides.forEach((el,i)=>el.classList.toggle('on',i===cur)); count.textContent=(cur+1)+' / '+slides.length; }
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')show(cur+1); if(e.key==='ArrowLeft')show(cur-1); });
show(0);
</script>
</body>
</html>
