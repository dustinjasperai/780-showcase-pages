<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The One Call Sale: A Masterclass with Ari Galper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">family=Inter:wght@400;500;600;700<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf8;        /* brand light scheme ground */
    --ink:#092e64;       /* brand dominant navy (#092e64, 34 uses) */
    --panel:#f0f1f5;     /* cool navy-tint panel */
    --accent:#cc3366;    /* brand rose/magenta link accent */
    --muted:#5b6478;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.55}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:#fff;border:1px solid #e7e7e1;border-radius:14px;padding:54px 56px;margin:22px 0;
    min-height:430px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 #efeee8}
  .slide.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .slide.accentbar{border-top:6px solid var(--accent)}
  .kicker{font-family:'Libre Baskerville',Georgia,serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  .slide.dark .kicker{color:#ff9bbf}
  h1{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.02em}
  h2{font-family:'Libre Baskerville',Georgia,serif;font-weight:600;font-size:34px;line-height:1.14;letter-spacing:-.01em;margin-bottom:14px}
  p{font-size:20px;color:var(--muted);max-width:68ch;margin-top:10px}
  .slide.dark p{color:#c9d2e6}
  .lede{font-size:23px;color:var(--ink)}
  .slide.dark .lede{color:#fff}
  .big{font-size:40px;font-family:'Libre Baskerville',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.15}
  .slide.dark .big{color:#fff}
  ul{margin:18px 0 0 0;padding:0;list-style:none}
  li{font-size:20px;color:var(--ink);padding:12px 0 12px 34px;position:relative;border-bottom:1px solid #eee}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .slide.dark li{color:#eef2fb;border-color:#1b3c72}
  .num{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.1em}
  .presenter{font-family:'Libre Baskerville',Georgia,serif;font-weight:500;font-size:18px;color:var(--ink);margin-top:26px}
  .facts{display:flex;gap:34px;flex-wrap:wrap;margin-top:22px}
  .fact{min-width:150px}
  .fact b{display:block;font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:40px;color:var(--accent)}
  .fact span{font-size:16px;color:var(--muted)}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;font-style:italic}
  .cta-line{font-family:'Libre Baskerville',Georgia,serif;font-weight:600;font-size:22px;color:var(--accent);margin-top:18px}
  .pageftr{font-family:'Libre Baskerville',Georgia,serif;font-size:12px;color:#9aa0b0;text-align:center;margin-top:30px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="pageftr">A masterclass by Ari Galper · Unlock The Game</div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Ari Galper',
    h:'The One Call Sale',
    lede:'How to close high-ticket clients in a single trusted conversation. No pressure, no closing techniques, no follow-up.',
    presenter:'Presented by Ari Galper, creator of Unlock The Game and author of six books on trust-based selling.'},

  {t:'who', kicker:'Who this is for',
    h:'For the owner who is great at the work, and tired of the chase',
    p:'This is for business owners, consultants, and advisors selling considered, high-value services with long sales cycles. You are good at what you do. What drains you is the chasing: the follow-ups, the "let me think about it", the deals that quietly go cold.',
    list:['You sell something that genuinely helps people','Your buyers take time and talk to several people','You dislike feeling pushy, so you hold back, and deals stall']},

  {t:'trap', kicker:'The trap', h:'You were taught to follow up. So you follow up.',
    p:'Every traditional system tells you the same thing: stay persistent, keep the cadence, handle the objection, ask for the close one more time. So the calendar fills with follow-up reminders, and the best prospects go quiet anyway.',
    big:'The harder you push for the yes, the faster trust leaves the room.'},

  {t:'reframe', dark:true, kicker:'The real problem',
    h:'We are in a Trust Recession',
    p:'Two decades of over-marketing and pressure tactics have collapsed the trust between buyers and sellers. Buyers now assume every seller has a hidden agenda, so the moment they sense pressure, they protect themselves and disappear.',
    lede:'Trust is now the only currency that moves a high-ticket sale. Pressure spends it.'},

  {t:'p1', kicker:'Part one', h:'The hidden agenda', num:'01',
    p:'The pressure your prospect feels does not come from your words. It comes from your goal. When your real aim is to make the sale, the prospect feels it under everything you say, and they brace against it.',
    list:['Your agenda: get the sale','Their experience: being sold to','The result: polite distance, then silence']},

  {t:'p1b', kicker:'Part one', h:'What chasing actually costs',
    p:'Chasing does not just waste time. It positions you below the buyer, as someone who needs the deal more than they do. That position is the opposite of the one that earns trust, and it is self-inflicted.',
    big:'Nobody trusts the person who is chasing them.'},

  {t:'p2', dark:true, kicker:'Part two', h:'Unlock The Game', num:'02',
    p:'The shift is not a new script. It is a new goal. You move your focus off making the sale and onto finding the truth: is this genuinely a fit, or not? When the truth becomes the goal, the pressure vanishes, because you are no longer attached to the outcome.',
    lede:'Change the goal from the sale to the truth, and everything downstream changes.'},

  {t:'method', kicker:'Part two', h:'The One Call Sale road map',
    p:'Trusted selling collapses a long, multi-step cycle into one honest conversation. Here is the shape of that conversation.',
    list:['Open on their problem, not your pitch','Ask the questions that surface the real truth','Let them conclude whether it fits, out loud','Make the decision now, together, or part as friends']},

  {t:'pillarA', kicker:'The pillars', h:'Get to the truth, fast', num:'i',
    p:'Deep, empathic questions do in one call what months of follow-up cannot. You are not qualifying them. You are helping both of you see clearly whether this is right, which is the most respectful thing a seller can do.'},

  {t:'pillarB', kicker:'The pillars', h:'No pressure, no closing', num:'ii',
    p:'There is no close because there is nothing to overcome. When trust is built and the fit is real, the decision is the natural next step, not a hurdle you push them over. Closing tactics are what you need only when trust is missing.'},

  {t:'pillarC', kicker:'The pillars', h:'No follow-up', num:'iii',
    p:'The One Call Sale is named for what it removes. When the truth is reached in the conversation, there is nothing to chase afterward. You either have a client, or you have your time back. Both are wins.'},

  {t:'authority', dark:true, kicker:'Part three', h:'Become the trusted authority',
    p:'When you sell this way, something compounds. You stop being one more option in a comparison and become a category of one: the person buyers seek out because they already trust you. You stop pursuing clients, and clients begin to pursue you.',
    lede:'Trusted authority is what turns one good conversation into a stream of inbound ones.'},

  {t:'look', kicker:'Inside a trusted practice', h:'A week without the chase',
    p:'The follow-up list is gone. The calendar holds fewer calls, and the calls that remain are with people who are ready to decide. The work feels like the work again, not like selling.',
    list:['Fewer calls, each with a genuine buyer','Decisions reached in the conversation, not weeks later','Referrals, because trust is what people repeat']},

  {t:'whyme', kicker:'Why trust me on this', h:'Where this comes from',
    p:'I spent over a decade building enterprise sales programs for companies including Qualcomm and UPS before developing Unlock The Game, the trust-based approach I have taught for twenty-five years.',
    facts:[['25','years teaching trust-based selling'],['6','books published'],['1','honest conversation']]},

  {t:'recap', kicker:'In one idea', h:'Trust is the sale',
    p:'Stop chasing the yes. Change your goal from the sale to the truth, ask the questions that reveal it, and let the right people decide in a single conversation. That is The One Call Sale.',
    big:'When you stop selling, people start buying.'},

  {t:'cta', accentbar:true, kicker:'Your next step',
    h:'Want to go deeper into The One Call Sale?',
    p:'If this way of selling resonates, the next step is a short, no-pressure conversation, exactly the kind this masterclass is about. Claim your free books and schedule your complimentary consultation.',
    cta:'Claim your free books and book your complimentary consultation at arigalper.com',
    disc:'Educational content only. No income, revenue, or result is guaranteed. Individual results vary and depend on your own effort, market, and offer.'}
];

function render(){
  const deck=document.getElementById('deck');
  S.forEach(function(s,i){
    const el=document.createElement('section');
    el.className='slide'+(s.dark?' dark':'')+(s.accentbar?' accentbar':'');
    let html='';
    if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
    if(s.num) html+='<div class="num">'+s.num+'</div>';
    if(s.t==='title'){ html+='<h1>'+s.h+'</h1>'; }
    else if(s.h){ html+='<h2>'+s.h+'</h2>'; }
    if(s.lede) html+='<p class="lede">'+s.lede+'</p>';
    if(s.p) html+='<p>'+s.p+'</p>';
    if(s.big) html+='<p class="big">'+s.big+'</p>';
    if(s.list){ html+='<ul>'; s.list.forEach(function(x){html+='<li>'+x+'</li>';}); html+='</ul>'; }
    if(s.facts){ html+='<div class="facts">'; s.facts.forEach(function(f){html+='<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>';}); html+='</div>'; }
    if(s.presenter) html+='<div class="presenter">'+s.presenter+'</div>';
    if(s.cta) html+='<div class="cta-line">'+s.cta+'</div>';
    if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
    el.innerHTML=html;
    deck.appendChild(el);
  });
}
render();
</script>
</body>
</html>
