<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pass on the Mindset, Not the Memorization | All In PM Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f6f7;
    --panel:#fbfcff;
    --stage:#14103a;
    --accent:#2c22a9;
    --ink:#0f0f0f;
    --ink-soft:#3a3a48;
    --muted:#8a8a95;
    --rule:#dbdbdb;
  }
  html,body{height:100%}
  body{background:var(--stage);font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:8.5vh 9vw;opacity:0;transition:opacity .5s ease;pointer-events:none;background:var(--bg)}
  .slide.active{opacity:1;pointer-events:auto}
  .kicker{font-family:'Space Grotesk',sans-serif;font-size:1.05vw;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin-bottom:3.2vh}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:4.3vw;line-height:1.08;
    letter-spacing:-.015em;color:var(--ink);max-width:20ch}
  .sub{font-family:'Inter',sans-serif;font-weight:500;font-size:1.7vw;line-height:1.5;
    color:var(--ink-soft);margin-top:3.4vh;max-width:34ch}
  .body{font-family:'Inter',sans-serif;font-weight:400;font-size:1.55vw;line-height:1.62;
    color:var(--ink-soft);margin-top:3.4vh;max-width:41ch}
  .brandline{font-family:'Space Grotesk',sans-serif;font-size:1.15vw;font-weight:600;letter-spacing:.03em;
    color:var(--accent);margin-top:5vh}
  .brandline b{font-weight:700}
  /* section slides */
  .t-section{background:var(--panel)}
  .t-section .idx{font-family:'Space Grotesk',sans-serif;font-size:1.15vw;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  .t-section h1{font-size:5.1vw}
  .t-section .rule{width:8.5vw;height:4px;background:var(--accent);border-radius:3px;margin-top:4vh}
  /* dark reframe slides */
  .t-dark{background:var(--stage)}
  .t-dark h1{color:#f2f1fb;font-weight:600;font-size:3.9vw;max-width:25ch}
  .t-dark .kicker{color:#a9a2f0}
  /* cta */
  .t-cta{background:var(--panel)}
  .chips{display:flex;gap:1.4vw;margin-top:4.6vh;flex-wrap:wrap}
  .chip{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.3vw;color:#fff;background:var(--accent);
    border-radius:100px;padding:1.5vh 2.2vw}
  .disc{font-family:'Inter',sans-serif;font-size:.95vw;line-height:1.5;color:var(--muted);
    margin-top:6vh;max-width:54ch}
  /* 50/50 split motif */
  .split{position:absolute;right:7vw;bottom:8.5vh;width:15vw;height:8vw;opacity:.95}
  .t-title .split{right:8vw;bottom:11vh;width:20vw;height:10.5vw;opacity:1}
  .t-dark .split .a{fill:#2b2660}
  .t-dark .split .b{fill:#a9a2f0}
  .t-dark .split text{fill:#f2f1fb}
  /* chrome */
  #hud{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:18px;
    padding:16px 26px;z-index:20;pointer-events:none}
  #track{flex:1;height:3px;background:rgba(15,15,15,.12);border-radius:3px;overflow:hidden}
  #bar{height:100%;width:0;background:var(--accent);transition:width .5s ease}
  #count{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
  .nav{position:fixed;top:0;height:100vh;width:14vw;z-index:15;cursor:pointer;background:transparent;border:0}
  #prev{left:0}#next{right:0}
  #hint{position:fixed;right:26px;bottom:34px;font-family:'Inter',sans-serif;font-size:12px;
    letter-spacing:.08em;color:var(--muted);z-index:20;transition:opacity .4s}
  @media(max-width:760px){h1{font-size:7.4vw}.sub,.body{font-size:3.4vw}.kicker{font-size:2.6vw}
    .t-section h1{font-size:8.6vw}.chip{font-size:3vw}.disc{font-size:2.4vw}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="split" viewBox="0 0 240 128">
  <rect class="a" x="6" y="20" width="104" height="88" rx="10" fill="#dfe0ee"/>
  <rect class="b" x="130" y="20" width="104" height="88" rx="10" fill="#2c22a9"/>
  <text x="58" y="76" font-family="Space Grotesk, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#8a8a95">A</text>
  <text x="182" y="76" font-family="Space Grotesk, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#ffffff">B</text>
</symbol></svg>

<div id="deck"></div>
<div id="hud"><div id="track"><div id="bar"></div></div><div id="count">01 / 01</div></div>
<button id="prev" class="nav" aria-label="Previous"></button>
<button id="next" class="nav" aria-label="Next"></button>
<div id="hint">Use arrow keys &rarr;</div>
<script>
const S = [
 {t:'title',title:'Pass on the Mindset, Not the Memorization',sub:'How PMP candidates clear the exam by thinking like the ideal project manager, not by memorizing the process charts.',brand:true,split:true},
 {t:'normal',k:'Who this is for',title:'You have studied for weeks and the scores still will not move.',body:'You know the material. You have watched the videos and read the guide twice. Yet the practice questions keep coming back wrong, and exam day feels like a coin flip you cannot afford to lose.'},
 {t:'normal',k:'The real cost',title:'The problem is almost never how much you know.',body:'Most candidates who stall are not short on content. They are answering the questions the wrong way, reading for facts when the exam is testing judgment. More hours spent the same way just cements the habit.'},
 {t:'dark',title:'The PMP does not test what you memorized. It tests how you would decide.'},

 {t:'section',idx:'Part One',title:'Why Memorization Betrays You'},
 {t:'normal',k:'The trap',title:'The exam is written to punish recall.',body:'PMI does not ask you to name a formula. It drops you into a messy situation and asks what a good project manager does next. If your instinct is to recall a definition, the answer choices are built to catch exactly that.'},
 {t:'normal',k:'Why harder studying backfires',title:'Grinding more questions rehearses the same mistake.',body:'When you do not know the underlying thinking, another hundred questions just teach you to be wrong faster. The plateau is not a signal to study more. It is a signal to study differently.'},
 {t:'dark',title:'Two answers look right on purpose. Memorization cannot tell them apart. A mindset can.'},

 {t:'section',idx:'Part Two',title:'The Ideal PMP Perspective'},
 {t:'normal',k:'The core shift',title:'Answer as the ideal project manager, every time.',body:'There is one consistent point of view the exam rewards: proactive, servant-led, collaborative, always addressing the root cause before the symptom. Once you adopt it as a lens, whole clusters of questions start pointing the same direction.'},
 {t:'normal',k:'Breaking 50/50 paralysis',title:'When two answers both look right, choose on principle.',body:'The exam writes two defensible options and lets you stall between them. The tie-breaker is not a fact. It is asking which choice the ideal project manager makes first, and that question resolves the split almost every time.'},
 {t:'normal',k:'Reading for the trap',title:'Spot the words that flip the answer.',body:'A handful of loaded words quietly change what a vague question is really asking. Learn to see them and a confusing stem turns clear, because you are reading for the decision being tested, not the noise around it.'},
 {t:'normal',k:'Study to your wiring',title:'Match the method to how you actually learn.',body:'People do not all absorb this the same way. Finding your learning style, and building the plan around it, is why the same weekly hours produce a very different score. The plan bends to you, not the other way around.'},
 {t:'dark',title:'Once the lens is yours, you are not guessing between A and B. You are choosing.'},

 {t:'section',idx:'Part Three',title:'What Exam Day Looks Like'},
 {t:'normal',k:'A plan for the clock',title:'Order and pace the questions on purpose.',body:'Which questions you take first, how long you let one hold you, and when you move on are decisions you make before you sit down, not in a panic at question 140. A calm sequence is worth points on its own.'},
 {t:'normal',k:'Rehearse under real conditions',title:'Practice the way you will perform.',body:'A large, realistic question bank and timed reps turn the strategy into reflex. By exam day the format holds no surprises, and your attention is free for the judgment the questions are actually testing.'},
 {t:'normal',k:'Why learn this from me',title:'I built the whole method around the thinking, not the cramming.',body:'I am a PMP-certified instructor, and All In PM Prep has helped more than 10,000 students pass, at a 5.0 instructor rating. Every lesson, the live weekly coaching, and the simulator exist to build the perspective, because that is what actually moves the score.'},
 {t:'dark',title:'No memorization. No fluff. Just the thinking that gets you certified.'},

 {t:'section',idx:'Your next step',title:'Start Thinking Like a PMP'},
 {t:'normal',k:'How the program helps',title:'Everything in one place, with a coach beside you.',body:'The All-In-One PMP course walks you through the mindset, the question techniques, and the exam-day plan, backed by live weekly coaching and a full simulator. You can try it free for ten days before you commit to a thing.'},
 {t:'cta',title:'Ready to pass on judgment instead of luck?',chips:['Start your free 10-day trial','Enroll in the All-In-One PMP course'],disc:'Educational content for PMP candidates. PMP and PMI are marks of the Project Management Institute. No exam result or certification is guaranteed. Results vary by candidate, starting point, and preparation.'},
];

const deck=document.getElementById('deck');
function split(){return '<svg class="split"><use href="#split"/></svg>'}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">All In <b>PM Prep</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.split||s.t==='title') h+=split();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
