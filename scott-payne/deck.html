<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pass the PMP by Thinking Like PMI — a masterclass with Scott Payne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9fd; --panel:#ffffff; --rule:#e4e2ef;
    --accent:#161058; --deep:#0c0940; --ring:#e23b4e;
    --ink:#15102e; --muted:#5d5878;
    --head:'Sora',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);
    display:flex;align-items:center;justify-content:center}
  .deck{width:100%;max-width:960px;aspect-ratio:16/9;position:relative;
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    box-shadow:0 18px 60px rgba(22,16,88,.10);overflow:hidden}
  .slide{position:absolute;inset:0;padding:64px 72px;display:none;
    flex-direction:column;justify-content:center;gap:18px}
  .slide.on{display:flex}
  .kick{font-family:var(--head);font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--accent)}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;
    color:var(--deep);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.1;
    color:var(--deep)}
  p{font-size:21px;line-height:1.5;color:var(--ink);max-width:48ch}
  .muted{color:var(--muted)}
  .big{font-size:30px;line-height:1.35;font-weight:500;max-width:40ch}
  ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:6px}
  li{font-size:21px;line-height:1.4;padding-left:30px;position:relative;max-width:46ch}
  li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;
    border-radius:50%;border:2px solid var(--ring)}
  .rail{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .step{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--rule);
    border-radius:10px;padding:14px 16px}
  .step b{font-family:var(--head);color:var(--accent);font-size:15px;display:block}
  .step span{font-size:16px;color:var(--ink)}
  .stat{display:flex;gap:40px;flex-wrap:wrap;margin-top:8px}
  .stat div{min-width:150px}
  .stat b{font-family:var(--head);font-size:44px;color:var(--accent);display:block;line-height:1}
  .stat span{font-size:16px;color:var(--muted)}
  .strike{text-decoration:line-through;color:var(--muted);text-decoration-color:var(--ring)}
  .a{color:var(--accent)}
  .q{background:var(--bg);border-left:4px solid var(--ring);border-radius:0 10px 10px 0;
    padding:18px 22px;font-size:20px;line-height:1.45;max-width:52ch}
  .cta-box{background:var(--deep);color:#fff;border-radius:12px;padding:26px 30px;max-width:52ch}
  .cta-box h2{color:#fff}
  .cta-box p{color:#d9d6ef}
  .site{font-family:var(--head);font-weight:600;color:#fff;font-size:22px;margin-top:6px}
  .disc{font-size:13px;color:var(--muted);margin-top:14px;max-width:60ch}
  .nav{position:absolute;bottom:16px;right:22px;font-family:var(--head);font-size:13px;
    color:var(--muted);display:flex;gap:14px;align-items:center}
  .nav button{font:inherit;color:var(--accent);background:none;border:1px solid var(--rule);
    border-radius:7px;padding:3px 10px;cursor:pointer}
  .brandmark{position:absolute;top:22px;left:72px;font-family:var(--head);font-weight:600;
    font-size:14px;color:var(--muted);letter-spacing:.04em}
</style>
</head>
<body>
<div class="deck" id="deck">
  <div class="brandmark">All In PM Prep</div>
  <div class="nav"><button onclick="go(-1)">Prev</button><span id="count"></span><button onclick="go(1)">Next</button></div>
</div>
<script>
const S=[
  {t:'title', kick:'A live masterclass with Scott Payne',
    h:'Pass the PMP by Thinking Like PMI',
    p:'Not by memorizing the PMBOK. By learning how PMI wants a project manager to think.'},
  {t:'who', kick:'Who this is for',
    h:'You have put in the hours',
    big:'You have read the PMBOK, maybe sat the exam once, and the situational questions still feel like guesswork.'},
  {t:'trap', kick:'The trap',
    h:'More content is not the answer',
    p:'Everyone says memorize the process groups and grind two thousand questions. So you do. And you still miss the ones that decide pass or fail.'},
  {t:'reframe', kick:'The uncomfortable truth',
    big:'The PMP does not test what you memorized. It tests how PMI wants you to think.'},
  {t:'agenda', kick:'What this hour covers',
    h:'Three things',
    items:['Why smart, prepared people still fail','The PMI mindset, and how to decode any question with it','The exact path from today to a first-attempt pass']},
  {t:'part', kick:'Part one', h:'Why smart people fail'},
  {t:'point', kick:'The real gap',
    h:'Recall is not judgment',
    p:'Most questions give you four answers that are all technically correct. Memorization cannot choose between them. The PMI mindset can.'},
  {t:'part', kick:'Part two', h:'The PMI mindset'},
  {t:'pillar', kick:'Pillar one',
    h:'Think like the PM PMI describes',
    p:'Before you read the answers, know what a PMI-style project manager would do: servant leader, proactive, people first, process second. That stance answers more questions than any memorized formula.'},
  {t:'pillar', kick:'Pillar two',
    h:'The Red Circle Technique',
    p:'Put a red circle around what the question is actually asking. The key word (first, next, best, most) collapses four right-looking answers down to one.'},
  {t:'demo', kick:'Watch it work',
    h:'One question, decoded',
    q:'"A key stakeholder is unhappy with progress. What should you do FIRST?" Circle FIRST. Now only one answer can come before the others, and the mindset tells you it is the one where you go and listen.'},
  {t:'pillar', kick:'Pillar three',
    h:'Stories, not abstraction',
    p:'Agile, Waterfall and Hybrid stop being confusing when each one is a story you can picture. When the concept is concrete, the exam question is easy.'},
  {t:'part', kick:'Part three', h:'The path to exam day'},
  {t:'plan', kick:'The guided plan',
    h:'Six modules, one clear order',
    steps:[['Wk 1','Fundamentals'],['Wk 2','Waterfall'],['Wk 3','Agile'],['Wk 4','Advanced & Hybrid'],['Wk 5','Exam-day strategy'],['Wk 6','Full exam mastery']]},
  {t:'proof', kick:'The results',
    h:'The method holds up',
    stats:[['99.61%','first-attempt pass rate (504 of 506)'],['10,000+','students coached'],['15+ yrs','running real projects']]},
  {t:'why', kick:'Why me',
    h:'You are not studying alone',
    items:['35 PMI contact hours, built in order','2,200+ practice questions and full mock exams','Weekly live coaching with Scott and the team']},
  {t:'recap', kick:'What changes today',
    h:'Stop memorizing. Start deciding.',
    items:['Read every question for what it is really asking','Answer from the PMI mindset, not a flashcard','Follow one ordered plan instead of random studying']},
  {t:'cta', kick:'Your next step',
    h:'Ready to pass on your first attempt?',
    p:'Book a call or enroll in the All-In-One PMP course and get the full mindset method, the guided plan, and weekly live coaching.',
    site:'allinpmprep.com',
    disc:'This masterclass is for educational purposes only. Results vary from person to person and no passing outcome is guaranteed.'}
];
const deck=document.getElementById('deck');
S.forEach((s)=>{
  const el=document.createElement('section');
  el.className='slide';
  let html='';
  if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='cta'){
    if(s.h) html+='<h2>'+s.h+'</h2>';
    html+='<div class="cta-box"><p>'+s.p+'</p><div class="site">'+s.site+'</div></div>';
    html+='<div class="disc">'+s.disc+'</div>';
    el.innerHTML=html;deck.appendChild(el);return;
  }
  if(s.h) html+=(s.t==='title'?'<h1>'+s.h+'</h1>':'<h2>'+s.h+'</h2>');
  if(s.big) html+='<p class="big">'+s.big+'</p>';
  if(s.p) html+='<p>'+s.p+'</p>';
  if(s.q) html+='<div class="q">'+s.q+'</div>';
  if(s.items){html+='<ul>';s.items.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  if(s.steps){html+='<div class="rail">';s.steps.forEach(x=>html+='<div class="step"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>');html+='</div>';}
  if(s.stats){html+='<div class="stat">';s.stats.forEach(x=>html+='<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>');html+='</div>';}
  el.innerHTML=html;
  deck.appendChild(el);
});
let idx=0;const slides=[...document.querySelectorAll('.slide')];
const count=document.getElementById('count');
function show(){slides.forEach((s,i)=>s.classList.toggle('on',i===idx));count.textContent=(idx+1)+' / '+slides.length;}
function go(d){idx=Math.max(0,Math.min(slides.length-1,idx+d));show();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
show();
</script>
</body>
</html>
