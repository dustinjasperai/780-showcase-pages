<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enlightened Mathematics - A Live Masterclass with Adam Wes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05080c;        /* their near-black ground */
    --panel:#10141c;     /* lift off the ground */
    --rule:#2a2f3a;
    --ink:#fbe8c2;       /* their dominant warm cream */
    --muted:#b9b09a;
    --accent:#d6b77d;    /* their gold */
    --glow:#62f7ff;      /* their cyan link, used sparingly */
    --head:'Cinzel', Georgia, serif;
    --body:'Mulish', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:linear-gradient(180deg,#0a0e15,var(--panel));border:1px solid var(--rule);border-radius:14px;
    padding:52px 48px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(214,183,125,0.14),transparent 70%);pointer-events:none}
  .kick{font-family:var(--body);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.1;color:var(--ink)}
  h2{font-family:var(--head);font-weight:600;font-size:31px;line-height:1.16;color:var(--ink);margin-bottom:14px}
  .promise{font-family:var(--head);font-weight:500;font-size:26px;line-height:1.34;color:var(--ink)}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:62ch;margin-top:12px}
  p .hi{color:var(--ink)}
  p .gold{color:var(--accent)}
  ul{margin:18px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;color:var(--muted);padding:10px 0 10px 26px;position:relative;max-width:64ch}
  li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border:1px solid var(--accent);transform:rotate(45deg)}
  li b{color:var(--ink);font-weight:600}
  .part{font-family:var(--head);font-size:22px;color:var(--glow);letter-spacing:.04em;margin-bottom:8px}
  .big{font-family:var(--head);font-weight:600;font-size:36px;line-height:1.18;color:var(--ink)}
  .sub{font-size:17px;color:var(--muted);margin-top:14px}
  .cta h2{font-size:36px}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:#7b8291;max-width:60ch}
  .n{position:absolute;bottom:18px;right:24px;font-size:12px;color:#5c6372;letter-spacing:.1em}
  .brand{position:absolute;bottom:18px;left:24px;font-size:12px;color:#5c6372;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kick:'The School of Futuristic Intelligence',h:'Enlightened Mathematics',promise:'Seeing the Thing: a live hour on mathematics as a direct experience of beauty, not a page of symbols.'},
 {t:'promise',kick:'What this hour gives you',promise:'By the end you will have perceived a mathematical object directly, as self-evident and beautiful, before a single formula is written.'},
 {t:'who',kick:'Who this is for',h:'For the math-curious, the teachers, and the seekers',p:'If some part of you has always suspected mathematics is beautiful, but school handed you rules to memorize and called it math, this hour is for you. No background required. Only attention.'},
 {t:'reframe',part:'The reframe',big:'You were not bad at math. You were shown the symbol and never the thing.',sub:'The notation was the map. Almost no one was ever shown the territory.'},
 {t:'part',part:'Part One',big:'The core problem: symbol-first schooling'},
 {t:'content',kick:'Part One',h:'Math arrived as notation to push around',p:'From the start it was symbols and procedures, graded for speed and correctness. The structure underneath, the thing the symbols point at, stayed invisible. So the subject felt arbitrary, and many of us quietly decided it was not for us.'},
 {t:'content',kick:'Part One',h:'The beauty was there the whole time',p:'A mathematical object is not the formula that describes it. It is a structure you can perceive directly, the way you perceive a piece of music or the shape of a shell. When you see it first, the symbols stop being a wall and become a language for something you already understand.'},
 {t:'part',part:'Part Two',big:'The method: Direct Perception'},
 {t:'content',kick:'Pillar 1',h:'Direct Perception',p:'See the structure first, self-evidently, and only then describe it with mathematics. Understanding stops being memory and becomes recognition. This is the center of everything that follows.'},
 {t:'content',kick:'Pillar 2',h:'Mathematical Coding',p:'We build the idea live in code. A Julia set, a Goldberg polyhedron, trigonometry as waves and parametric curves: abstract structure becomes something you can watch, zoom, and move. You do not take the result on faith. You see it form.'},
 {t:'content',kick:'Pillar 3',h:'Autotelic Engagement',p:'Mathematics done the way you dance or paint: for the discovery and the joy of it, not for a grade. When the motive is delight rather than fear, attention deepens and the mind quiets enough to perceive.'},
 {t:'content',kick:'Pillar 4',h:'The sequence',p:'Every piece of the method runs the same path:',li:['<b>Theory</b>, just enough to orient','<b>Live construction</b>, building the object in front of you','<b>Coding practice</b>, making it move and respond','<b>Creative expression</b>, where it becomes yours']},
 {t:'part',part:'Part Three',big:'Seeing it for yourself'},
 {t:'content',kick:'Seen directly',h:'A Julia set, alive',p:'Complex numbers stop being an exam topic. You watch a living boundary emerge from a single rule, color it, and zoom into detail that never ends. Iteration becomes something you feel, not a definition you recite.'},
 {t:'content',kick:'Seen directly',h:'Polyhedra and polar curves',p:'A polyhedron becomes an object of contemplation, its symmetry something you perceive whole. Polar and parametric curves draw themselves and reveal the quiet order inside trigonometry. Structure, not drudgery.'},
 {t:'whyme',kick:'Why me',h:'Adam Wes - The Bhakti Math Guru',p:'I hold a degree in physics, began programming as a teenager, and once built a national tutoring agency of more than 250 educators. I have taught over 8,000 hours of mathematics and physics, and my contemplative math animations have reached more than 15 million people. For two decades the question has been the same: how do we let someone <span class="hi">see</span> mathematics.'},
 {t:'content',kick:'The shift',h:'From memorizing to seeing',p:'Once you have perceived one object directly, the posture generalizes. You stop bracing for the next procedure and start looking for the structure. That shift is what this hour is designed to hand you.'},
 {t:'content',kick:'The method, together',h:'Perceive, build, express',p:'Direct Perception gives you the thing. Mathematical Coding lets you build it. Autotelic engagement keeps you in it for the love of it. The sequence turns a single insight into a practice you can continue.'},
 {t:'content',kick:"What's next",h:'Continue the study',p:'If the hour opens something, there is a path onward: the live Enlightened Mathematics cohort, the self-paced course, and private apprenticeship for those who want to go deep. The masterclass is simply the doorway.'},
 {t:'cta',kick:'Begin',h:'Step into Enlightened Mathematics',p:'Join the next live session and start seeing mathematics as it actually is: structure, light, and beauty you can perceive for yourself.',disc:'Educational program. Mathematics and meditation instruction only. Outcomes depend on individual practice and effort; no specific result is promised or guaranteed.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.kick)h+='<div class="kick">'+s.kick+'</div>';
  if(s.part)h+='<div class="part">'+s.part+'</div>';
  if(s.t==='title'){h+='<h1>'+s.h+'</h1>';if(s.promise)h+='<p class="promise" style="margin-top:22px">'+s.promise+'</p>';}
  else if(s.t==='promise'){h+='<div class="promise">'+s.promise+'</div>';}
  else if(s.t==='reframe'||s.t==='part'){h+='<div class="big">'+s.big+'</div>';if(s.sub)h+='<div class="sub">'+s.sub+'</div>';}
  else{if(s.h)h+='<h2>'+s.h+'</h2>';if(s.p)h+='<p>'+s.p+'</p>';}
  if(s.li){h+='<ul>'+s.li.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="brand">Enlightened Mathematics</div><div class="n">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=h;deck.appendChild(d);
});
</script>
</body>
</html>
