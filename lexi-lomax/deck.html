<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Make More Money Without More Hours · Lexi Lomax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FAF8F4; --panel:#FFFFFF; --rule:#E7E3DA;
    --acc:#5F74A6; --acc-soft:#8794B8; --deep:#2E3854;
    --ink:#20232B; --grey:#55596A; --dim:#9AA0AE;
  }
  html,body{height:100%}
  body{background:#EDEAE3;font-family:'Poppins',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#EDEAE3}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.005em}
  .t-title h1{font-size:3.9vw;max-width:90%}
  .t-normal h1{font-size:3.0vw;max-width:86%}
  .t-normal .body{font-size:1.48vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.6;font-weight:300}
  .sub{font-size:1.7vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:300}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.3vw;font-weight:600;color:var(--acc-soft);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:90%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh;border-radius:3px}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#3A466A 0%,#232B42 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:88%;font-style:italic;font-weight:400;color:#F4F5FA}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#3A466A 0%,#232B42 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:84%;color:#F4F5FA}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #A9B7DA;color:#DCE3F2;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:#B9C0D4;font-style:italic;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .brandline{font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .line-motif{position:absolute;pointer-events:none}
  .title-line{right:8.4%;bottom:9%;width:24vw}
  .corner-line{right:7%;bottom:7.5%;width:11vw;opacity:.7}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Lexi Lomax</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- "one right line" motif: a single periwinkle rule that steps up to one marked point -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="oneline" viewBox="0 0 260 120">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="104" x2="246" y2="104" stroke="#8794B8" opacity="0.35"/>
    <path d="M28 104 L108 104 L108 66 L188 66 L188 30" stroke="#5F74A6" opacity="0.95"/>
    <circle cx="188" cy="30" r="6" fill="none" stroke="#5F74A6" stroke-width="2.8"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Make More Money Without More Hours Behind the Chair',sub:'A masterclass for salon owners who are done trading time for money.',brand:true,line:'title'},
 {t:'normal',k:'Who this is for',title:'You own the salon. You are also its busiest chair.',body:'You built a real business, and you are still the person it depends on most. The books are full, the days are long, and the only way you know to earn more is to add more hours you do not have.'},
 {t:'dark',title:'You do not have an income problem. You have a "more hours is the only lever" problem.'},

 {t:'section',idx:'Part One',title:'Why More Hours Stops Working'},
 {t:'normal',k:'The ceiling',title:'There are only so many hours behind the chair.',body:'When your income is tied to your own two hands, your earnings have a hard ceiling and your calendar sets it. You can raise your prices a little and work a little later, and then you are out of room.'},
 {t:'normal',k:'The owner trap',title:'When you are the top earner, the salon cannot grow past you.',body:'Every good month runs through your hands, so every time you step away the numbers dip. That is not a business that pays you back. That is a job you happen to own.'},
 {t:'dark',title:'More appointments is not a growth plan. It is a burnout plan.'},

 {t:'section',idx:'Part Two',title:'The Few Right Things'},
 {t:'normal',k:'A few right things',title:'Growth is a few right moves, not one silver bullet and not more hustle.',body:'Owners who finally get their time back did not do a hundred things. They did a small handful of the right things, on purpose, and let the rest go. That is the whole shift.'},
 {t:'normal',k:'Your numbers',title:'Start with the handful of numbers that actually move your take-home.',body:'Average ticket, retail per visit, rebooking rate, and the split between the hours you work and the hours your team works. Most owners have never looked at these on one page. Once you do, the right moves get obvious.'},
 {t:'normal',k:'Pricing',title:'Price it right once, and it earns on every appointment after.',body:'A pricing structure set with intention keeps paying you long after the afternoon you built it. It is the rare lever you pull a single time that shows up in every single ticket.'},
 {t:'normal',k:'Retail',title:'Retail is income you earn while you sleep.',body:'Recommended well, product is service, not a hard sell. It is revenue that does not cost you another minute in the chair, and most salons leave nearly all of it on the table.'},
 {t:'normal',k:'Your team',title:'A team that runs the floor is what takes you off the chair.',body:'Hiring, keeping, and trusting good people is the move that turns your salon into something that runs without you standing in it. This is the hard one, and it is the one that changes everything.'},
 {t:'dark',title:'The salon that runs without you is the one that finally pays you more.'},

 {t:'section',idx:'Part Three',title:'A Salon That Pays You Back'},
 {t:'normal',k:'The owner this builds',title:'More take-home, fewer hours, a business that no longer depends on your hands.',body:'You keep the chair you love and lose the chair you resent. Your income stops rising and falling with your own stamina, and the salon keeps earning on the days you are not in it.'},
 {t:'dark',title:'You did not open a salon to work more. You opened it to build something.'},
 {t:'normal',k:'Why Lexi Lomax',title:'Eighteen years behind the chair, and a team of nearly twenty.',body:'Lexi Lomax built and still owns a salon, learned this the hard way as a self-described reformed workaholic, and now coaches salon owners on the 10 Minute Beauty Business Podcast and inside her programs. She teaches the exact systems that took her off the chair.'},

 {t:'section',idx:'Your Next Step',title:'Put the Systems In'},
 {t:'normal',k:'SalonMINDS',title:'The room where salon owners install this together.',body:'SalonMINDS is the mastermind where owners work these moves in real time, with monthly live coaching, weekly support, and hot seats on the exact numbers in your salon. The point is not more information. It is finally doing the few right things with people who keep you to it.'},
 {t:'cta',title:'Ready to make more without more hours?',chips:['Join SalonMINDS','Start with a masterclass'],disc:'Educational content for salon owners and beauty professionals. No income or business result is guaranteed. Results vary by owner, salon, and market.'},
];

const deck=document.getElementById('deck');
function line(kind){return `<svg class="line-motif ${kind==='title'?'title-line':'corner-line'}" viewBox="0 0 260 120"><use href="#oneline"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Lexi <b>Lomax</b> · Salon Business Coach</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.line) h+=line(s.line);
  else if(s.t==='title') h+=line('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
