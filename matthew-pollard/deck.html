<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Introvert's Edge — A Masterclass with Matthew Pollard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15131A;
    --panel:#211E29;
    --rule:#39353F;
    --accent:#F0502E;
    --amber:#E8B23A;
    --ink:#F4F1EC;
    --muted:#A7A2B0;
    --display:"Space Grotesk",system-ui,sans-serif;
    --body:"Spline Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .slide{display:none;width:min(1040px,92vw);padding:56px 60px;animation:fade .35s ease}
  .slide.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.08;letter-spacing:-.01em}
  .sub{font-size:21px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:40ch}
  .lead{font-size:23px;line-height:1.55;margin-top:20px;max-width:46ch}
  .rule{height:3px;width:68px;background:var(--accent);margin:26px 0;border-radius:2px}
  ul{list-style:none;margin-top:26px}
  li{position:relative;padding-left:34px;font-size:20px;line-height:1.5;margin-bottom:18px;max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  .steps{counter-reset:s;margin-top:26px}
  .steps li{padding-left:56px}
  .steps li:before{content:counter(s);counter-increment:s;background:var(--panel);border:1px solid var(--rule);color:var(--amber);font-family:var(--display);font-weight:700;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;top:-2px;font-size:16px}
  .tag{font-family:var(--display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .big{font-family:var(--display);font-weight:700;font-size:64px;line-height:1.02;letter-spacing:-.02em;margin-top:8px}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 34px;margin-top:26px}
  .disc{font-size:13px;color:var(--muted);margin-top:30px;max-width:60ch;line-height:1.5}
  .cta-note{font-family:var(--display);font-weight:600;font-size:24px;color:var(--amber);margin-top:22px}
  #hud{position:fixed;bottom:22px;right:28px;font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.08em}
  #bar{position:fixed;bottom:0;left:0;height:4px;background:var(--accent);transition:width .3s}
  .foot{position:fixed;bottom:22px;left:28px;font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rule)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div class="foot">The Introvert's Edge</div>
<div id="hud"></div>
<script>
const S=[
  {t:'title',eyebrow:'A Live Masterclass with Matthew Pollard',h:"The Introvert's Edge",sub:"How to win high-value clients without acting like an extrovert."},
  {t:'content',eyebrow:'What we will cover',h:"A system, not a personality transplant",bullets:["Why the usual sales advice backfires for introverts","The 7-Step Sales Process you can run on repeat","How a single true story closes the right clients","What Rapid Growth looks like, the introvert's way"]},
  {t:'content',eyebrow:'Who this is for',h:"The quiet operator who sells their own work",lead:"Real estate brokers, coaches, lawyers, consultants, ghostwriters. You are good at what you do. You just dread the part where you are told to be louder, pitch harder, and work the room."},
  {t:'content',eyebrow:'The trap',h:"You have been handed the wrong playbook",lead:"Network more. Follow up harder. Nail the elevator pitch. It drains you, it feels fake, and the results do not match the effort. So you quietly decide selling is just not your thing."},
  {t:'hook',tag:'The reframe',big:"The problem is not that you are an introvert.",sub:"It is that you have been copying extroverts."},
  {t:'section',eyebrow:'Part One',h:"Why extrovert tactics fail introverts"},
  {t:'content',eyebrow:'Part One',h:"Personality is not repeatable",bullets:["Pressure-based closing breaks the trust you are good at building","Winging each conversation burns the energy you do not have to spare","The contrived pitch makes you sound like everyone else"],lead:"When selling depends on charisma, the introvert loses a game built for someone else."},
  {t:'hook',tag:'The shift',big:"Process beats personality.",sub:"Stop leaning on how you feel in the room. Lean on a system that works whether you feel on or not."},
  {t:'section',eyebrow:'Part Two',h:"The 7-Step Sales Process"},
  {t:'steps',eyebrow:'The system',h:"Seven steps, start to close",steps:["Establish trust and set a clear agenda","Ask probing questions and genuinely listen","Make sure you are speaking to the decision maker","Sell with a story, not a pitch","Answer objections with stories, not pressure","Take their temperature with a simple trial close","Assume the sale and ask"]},
  {t:'content',eyebrow:'Step 4, expanded',h:"Sell with a story",lead:"A laser-sharp true story does the persuading for you. Told well, it makes the right prospect say I want that before you ever quote a price. This is the heart of the Build Your Story Playbook method."},
  {t:'content',eyebrow:'The foundation',h:"Own a niche so your message lands",lead:"When you try to be for everyone, you compete on price. When you own a niche, your story and your pricing finally make sense to the person hearing them. Differentiation is what makes the whole system work."},
  {t:'section',eyebrow:'Part Three',h:"Selling without the performance"},
  {t:'content',eyebrow:'The after',h:"Calm, on your terms",lead:"You stop performing and start running a process. Conversations feel like conversations. You win better clients at better prices, without pretending to be someone you are not."},
  {t:'cred',eyebrow:'Why listen to me',h:"Matthew Pollard",lead:"An introvert with a learning disability who knocked on 93 doors to make a first sale, then built the system that made me the number one salesperson at the largest sales company in the Southern Hemisphere.",bullets:["The Introvert's Edge book series, 125,000+ copies in 17 languages (my figures)","Named Sales Kickoff Speaker of the Year by Selling Power Magazine","Founder of National Introverts Week"]},
  {t:'content',eyebrow:'The idea',h:"Rapid Growth, the introvert's way",lead:"You do not need to become an extrovert to grow. You need systems that leverage your natural strengths so you can win on your own terms."},
  {t:'cta',eyebrow:'Your next step',h:"Keep building the system",cta:"Join the Rapid Growth Academy and install the full 9-week blueprint.",disc:"This masterclass is educational. Any results, figures, and stories shared are illustrative and specific to the people involved. Results vary and are not guaranteed, and nothing here is a promise of income or sales."}
];
const stage=document.getElementById('stage');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function render(sl){
  let h='';
  if(sl.eyebrow)h+=`<div class="eyebrow">${esc(sl.eyebrow)}</div>`;
  if(sl.t==='title'){h+=`<h1>${esc(sl.h)}</h1><div class="rule"></div><div class="sub">${esc(sl.sub)}</div>`;}
  else if(sl.t==='hook'){h+=`<div class="tag">${esc(sl.tag)}</div><div class="big">${esc(sl.big)}</div>`+(sl.sub?`<div class="sub">${esc(sl.sub)}</div>`:'');}
  else if(sl.t==='section'){h+=`<h2>${esc(sl.h)}</h2><div class="rule"></div>`;}
  else if(sl.t==='steps'){h+=`<h2>${esc(sl.h)}</h2><ul class="steps">`+sl.steps.map(x=>`<li>${esc(x)}</li>`).join('')+`</ul>`;}
  else if(sl.t==='cta'){h+=`<h2>${esc(sl.h)}</h2><div class="rule"></div><div class="cta-note">${esc(sl.cta)}</div><div class="disc">${esc(sl.disc)}</div>`;}
  else{h+=`<h2>${esc(sl.h)}</h2><div class="rule"></div>`;if(sl.lead)h+=`<div class="lead">${esc(sl.lead)}</div>`;if(sl.bullets)h+=`<ul>`+sl.bullets.map(x=>`<li>${esc(x)}</li>`).join('')+`</ul>`;}
  return `<div class="slide active">${h}</div>`;
}
let i=0;
function show(){stage.innerHTML=render(S[i]);document.getElementById('hud').textContent=(i+1)+' / '+S.length;document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));show();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
stage.addEventListener('click',()=>go(1));
show();
</script>
</body>
</html>
