<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Your Next Chapter - a masterclass with Selina Barker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b1b1b; --panel:#262626; --rule:#3a3a3a;
    --ink:#f6f6f4; --muted:#b7b4ad;
    --accent:#ffe94d; --coral:#fd7169;
    --head:'Poppins',system-ui,sans-serif; --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 48px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center}
  .slide.title{background:linear-gradient(150deg,#1b1b1b 0%, #2a2a2a 100%);border-color:var(--accent)}
  .slide.cta{border-color:var(--coral)}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.12;margin:0 0 16px}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin:0 0 14px;max-width:62ch}
  p.lead{font-size:22px;color:var(--muted)}
  .big{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.1}
  .big .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--coral)}
  .big .hl{color:var(--accent)}
  ul{margin:8px 0 0;padding:0 0 0 2px;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 40px;position:relative;border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:18px;width:16px;height:16px;border-radius:4px;background:var(--accent)}
  li b{font-family:var(--head)}
  .tanks{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
  .tank{flex:1;min-width:180px;background:#1f1f1f;border:1px solid var(--rule);border-radius:12px;padding:18px}
  .tank .lbl{font-family:var(--head);font-weight:700;color:var(--accent);margin-bottom:8px}
  .num{font-family:var(--head);font-weight:800;font-size:64px;color:var(--coral);line-height:1}
  .foot{font-size:13px;color:var(--muted);margin-top:28px;font-family:var(--head);letter-spacing:.04em}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:22px;border-top:1px solid var(--rule);padding-top:16px;max-width:70ch}
  .btn{display:inline-block;font-family:var(--head);font-weight:800;background:var(--accent);color:#1b1b1b;
    padding:16px 30px;border-radius:999px;font-size:18px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="kick">A live masterclass with Selina Barker</div>
    <h1>Design Your Next Chapter</h1>
    <p class="lead">How to change career without burning out again, and build a life that actually fits you.</p>
    <div class="foot">Live, 60 minutes, with time for your questions</div>`},

  {t:'who', cls:'', html:`
    <div class="kick">Who this is for</div>
    <h2>You are good at your job. That is part of the problem.</h2>
    <p>This is for the big-hearted, ambitious people who have climbed the ladder and quietly realised it is leaning against the wrong wall.</p>
    <p>The high-achievers who want to do work that matters without running on empty. The multi-passionate. The ones who are done pretending they are fine.</p>`},

  {t:'trap', cls:'', html:`
    <div class="kick">The trap</div>
    <h2>You keep waiting to feel ready.</h2>
    <p>So you push a bit harder, book a holiday, promise yourself you will figure it out "once things calm down."</p>
    <p>They do not calm down. Another year passes. The treadmill keeps moving, and so does the quiet feeling that you were made for something that fits you better.</p>`},

  {t:'reframe', cls:'', html:`
    <div class="kick">The reframe</div>
    <div class="big">You are not <span class="strike">lazy</span>. You are <span class="hl">burnt out</span>.</div>
    <p style="margin-top:22px">There is a difference, and it changes everything. Laziness has no cure. Burnout does. And you cannot think your way out of it with the same tired brain that got you here.</p>`},

  {t:'part1', cls:'', html:`
    <div class="kick">Part one, the real problem</div>
    <h2>Running on empty is a decision-making problem.</h2>
    <p>When your tanks are empty, every career choice looks either terrifying or impossible. You are not short on ambition. You are short on fuel.</p>
    <p>That is why the "just make a plan" advice never sticks. The plan is not the first step.</p>`},

  {t:'committee', cls:'', html:`
    <div class="kick">Part one, continued</div>
    <h2>Meet your Shitty Committee.</h2>
    <p>It is the pack of inner voices that meet, usually at 11pm, to remind you that you are too old, too late, too responsible, too lucky-to-have-a-job to want more.</p>
    <p>Everyone has one. The problem is not that it exists. The problem is that you have been letting it chair the meeting.</p>`},

  {t:'cheerleader', cls:'', html:`
    <div class="kick">Part one, continued</div>
    <h2>And meet your Wise Cheerleader.</h2>
    <p>It is the steadier voice underneath, the one that says: or we could design the next chapter on purpose this time. One step. Starting with a plan, not a panic.</p>
    <p>The work is not silencing the Committee. It is learning to turn its volume down, and your Cheerleader's volume up.</p>`},

  {t:'framework', cls:'', html:`
    <div class="kick">Part two, the method</div>
    <h2>Four moves to design the next chapter.</h2>
    <ul>
      <li><b>One.</b> Name your Shitty Committee so it stops running the show.</li>
      <li><b>Two.</b> Turn up your Wise Cheerleader and let it lead.</li>
      <li><b>Three.</b> Refill your physical, mental and emotional energy.</li>
      <li><b>Four.</b> Design a career and life you love, as a deliberate project.</li>
    </ul>`},

  {t:'move1', cls:'', html:`
    <div class="kick">Move one</div>
    <h2>Name the voices.</h2>
    <p>Written down, the Committee loses most of its power. "I am too old to start over" becomes a sentence you can question instead of a fact you obey.</p>
    <p>We will do this live, together, with the exact prompts I use with private clients.</p>`},

  {t:'move2', cls:'', html:`
    <div class="kick">Move two</div>
    <h2>Turn up the Cheerleader.</h2>
    <p>Your Wise Cheerleader is not blind optimism. It is the part of you that has already survived every hard thing on your list so far.</p>
    <p>You will leave knowing how to reach it on command, especially on the days the Committee is loud.</p>`},

  {t:'move3', cls:'', html:`
    <div class="kick">Move three</div>
    <h2>Refill the three tanks.</h2>
    <p>Energy is not one thing. It is three, and most people are bankrupt in at least one.</p>
    <div class="tanks">
      <div class="tank"><div class="lbl">Physical</div>Sleep, movement, food, rest that actually rests you.</div>
      <div class="tank"><div class="lbl">Mental</div>Focus, space to think, fewer open loops.</div>
      <div class="tank"><div class="lbl">Emotional</div>Connection, creativity, solitude, adventure.</div>
    </div>`},

  {t:'move4', cls:'', html:`
    <div class="kick">Move four</div>
    <h2>Treat your life like your greatest creative project.</h2>
    <p>Your life is your greatest creative project. Not a problem to fix, a project to design, with drafts, with intention, and with full permission to make it yours.</p>
    <p>From a full tank, with the Committee quiet, the next step stops being terrifying and starts being obvious.</p>`},

  {t:'picture', cls:'', html:`
    <div class="kick">Part three, what it looks like</div>
    <h2>A chapter you chose, on purpose.</h2>
    <p>Not a reckless leap and not another decade of quietly waiting. A clear next step, a plan you believe, and the energy to actually walk it.</p>
    <p>That is what designing the chapter gives you: momentum you can feel, not just a prettier to-do list.</p>`},

  {t:'ritual', cls:'', html:`
    <div class="kick">How we keep it going</div>
    <h2>Stop and plan, four times a year.</h2>
    <p>The people who change their lives are not more disciplined. They just stop, reflect and plan on purpose, instead of letting another year happen to them.</p>
    <p>It is a simple ritual of goodbye and hello, and once you have it, you have it for life.</p>`},

  {t:'whyme', cls:'', html:`
    <div class="kick">Why listen to me</div>
    <h2>I have helped people do this for nearly twenty years.</h2>
    <p>I wrote Burnt Out, the six-step guide to thriving in a fast-paced world. I have coached people at Google, Apple and UN Women, as well as artists, authors and leaders across tech, finance, music and the creative industries.</p>
    <p>This masterclass is the honest, human start of that same work.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h1>Ready to design your next chapter?</h1>
    <p>If today lit something up, the Big Coaching Journey is where we do the full work together: six months, one to one, to design a career and life you love.</p>
    <a class="btn" href="https://selinabarker.com/the-big-coaching-journey">Explore the Big Coaching Journey</a>
    <div class="disc">Educational masterclass only. No income, role, career outcome or result is guaranteed. Results vary from person to person and depend on your own circumstances and effort.</div>
    <div class="foot">Selina Barker, Career and Life Design Coach</div>`}
];
const d = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  el.innerHTML = s.html;
  d.appendChild(el);
});
</script>
</body>
</html>
