<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Art That Sells — the masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf6f0;        /* Lilla's cream ground */
    --panel:#fffdf9;     /* lifted cream */
    --ink:#2f180d;       /* her dark-brown h2 */
    --muted:#6d5544;
    --gold:#dec158;      /* her gold */
    --accent:#e74343;    /* her dominant coral red */
    --display:'Bodoni Moda',Georgia,serif;
    --body:'Alegreya',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid #efe4d6;border-radius:14px;
    padding:52px 54px;margin:22px 0;box-shadow:0 1px 0 #efe4d6;min-height:420px;
    display:flex;flex-direction:column;justify-content:center}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:54px;line-height:1.05;letter-spacing:-.5px}
  h2{font-family:var(--display);font-weight:700;font-size:36px;line-height:1.1;margin-bottom:14px}
  .promise{font-family:var(--display);font-style:italic;font-weight:500;font-size:24px;color:var(--muted);margin-top:18px}
  p{font-size:19px;color:#3d2a1c;margin-top:14px;max-width:62ch}
  .lead{font-size:22px}
  ul{margin:18px 0 0 22px}
  li{font-size:19px;margin:10px 0;color:#3d2a1c}
  .big{font-family:var(--display);font-weight:700;font-size:40px;color:var(--accent);margin-top:10px}
  .by{margin-top:26px;font-weight:600;color:var(--ink)}
  .by span{color:var(--muted);font-weight:400}
  .rule{height:4px;width:64px;background:var(--gold);border-radius:3px;margin:22px 0}
  .pillar{display:inline-block;font-family:var(--display);font-weight:700;color:var(--accent);
    font-size:20px;border:2px solid var(--gold);border-radius:999px;padding:4px 16px;margin-bottom:8px}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;max-width:66ch}
  .cta h2{color:var(--accent)}
  .foot{color:var(--muted);font-size:13px;text-align:center;margin-top:30px}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:38px}h2{font-size:28px}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<div class="foot">Lilla Rogers &middot; Make Art That Sells</div>
<script>
const S=[
 {t:'title',kicker:'A masterclass with Lilla Rogers',
  h1:'Make Art That Sells',
  promise:'How to make work that art directors and manufacturers actually buy.',
  by:'Lilla Rogers','sub':'Artist, author and former top art agent'},

 {t:'who',kicker:'Who this is for',
  h2:'You can draw. The work still is not selling.',
  p:['This is for artists and illustrators who make beautiful work but keep hearing silence from art directors, licensing scouts and publishers.',
     'You have the skill. What you are missing is the thing that turns a lovely portfolio into a portfolio that gets bought.']},

 {t:'trap',kicker:'The trap',
  h2:'You were told: build a gorgeous portfolio and the work will come.',
  p:['So you polished your technique, filled an Instagram grid, and waited.',
     'The waiting is the trap. A portfolio built to impress other artists is not the same as a portfolio built to get hired.']},

 {t:'reframe',kicker:'The reframe',
  h2:'Beautiful is not the same as bought.',
  p:['Art directors and manufacturers are not scoring your technique. They are asking one quiet question: does this fit a market, and does it feel alive?',
     'I spent forty years as an art agent answering that question every single day. Here is what actually moves a buyer.']},

 {t:'reasons',kicker:'The reframe',
  h2:'Three things a buyer scans for.',
  ul:['Fit. Does this belong to a market I am actually shopping for.',
      'Feeling. Does it feel alive, or is it technically fine and flat.',
      'Freshness. Is it answering the brief the market is asking for now.']},

 {t:'part',kicker:'Part one',
  h2:'Why strong work gets passed over.',
  p:['Three reasons, over and over:']},

 {t:'reasons',kicker:'Part one',
  h2:'The three quiet no’s.',
  ul:['No market fit. The work is lovely but it does not belong to any market a buyer is shopping for.',
      'No joy. It is technically correct and emotionally flat, and buyers can feel the difference instantly.',
      'No trend awareness. It is answering a brief the market stopped asking for two years ago.']},

 {t:'part',kicker:'Part two',
  h2:'The Make Art That Sells method.',
  p:['Four things I teach, drawn from four decades of assigning paid commercial art.']},

 {t:'pillar',pillar:'Pillar 1',
  h2:'People buy your joy.',
  p:['The consumer does. The manufacturer does. The art director does. They can sense it in your work.',
     'Most of the method is helping you find the place of joy in your own art-making, because that is the thing a buyer is actually responding to.']},

 {t:'pillar',pillar:'Pillar 2',
  h2:'Start with the Mini.',
  p:['Every assignment opens with a Mini: a low-pressure, just-for-fun exercise of a little research and a lot of play, before any finished piece.',
     'It loosens you up and it is where the freshest, most commercial ideas almost always come from.']},

 {t:'pillar',pillar:'Pillar 3',
  h2:'Make for the hot markets.',
  p:['Home decor, editorial, children’s books, stationery, toys, surface and pattern. Each is a real market with its own buyers and its own brief.',
     'When you make work aimed at a market instead of at nobody in particular, you stop guessing and start fitting.']},

 {t:'pillar',pillar:'Pillar 4',
  h2:'Build a portfolio the agent way.',
  p:['Not twenty pieces that show off. A tight set of pieces built to specific assignments, the way a working agent would brief you.',
     'That is a portfolio a buyer can say yes to on the spot.']},

 {t:'part',kicker:'Part two',
  h2:'How the four fit together.',
  p:['Joy is the fuel. The Mini is the on-ramp. The hot markets are the target. The portfolio is the proof.',
     'Run them in order and you are no longer making art and hoping. You are making art for a buyer.']},

 {t:'part',kicker:'Part three',
  h2:'What changes when you work this way.',
  p:['You stop making art and hoping. You start making art for a buyer, with joy still in it, and the yes rate changes.']},

 {t:'reasons',kicker:'Part three',
  h2:'The shift.',
  ul:['From making work to impress other artists, to making work a buyer can say yes to.',
      'From a scattered grid, to a tight set aimed at real markets.',
      'From waiting to be discovered, to knowing exactly who your work is for.']},

 {t:'reasons',kicker:'Part three',
  h2:'What you walk away with.',
  ul:['A clear read on which hot markets your work actually belongs in.',
      'A repeatable way to start a piece so the joy survives to the finished art.',
      'A portfolio built the way an agent would brief it, ready to send.']},

 {t:'why',kicker:'Why me',
  h2:'Forty years in the buyer’s chair.',
  p:['I ran one of the best-known illustration agencies in the world and assigned commercial art every day, so I know what is selling in which market right now.',
     'I have illustrated for the New York Times, the Grammys and Anna Wintour, and mentored artists like Lisa Congdon, Helen Dardik and Mike Lowery.']},

 {t:'cta',kicker:'Your next step',
  h2:'Make art that sells, on purpose.',
  p:['If you want me in your corner, this is exactly what we do together inside my programs: find your joy, aim it at a hot market, and build the portfolio that gets you hired.'],
  disc:'This masterclass is educational. It shares a creative-career method and makes no guarantee of income, sales, representation or specific results. Outcomes vary with each artist’s work, market and effort.'}
];
const d=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.promise) h+='<div class="promise">'+s.promise+'</div>';
  if(s.pillar) h+='<div class="pillar">'+s.pillar+'</div>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.t==='title'||s.t==='part') h+='<div class="rule"></div>';
  if(s.ul){h+='<ul>';s.ul.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.p) s.p.forEach((x,i)=>h+='<p'+(i===0?' class="lead"':'')+'>'+x+'</p>');
  if(s.by) h+='<div class="by">'+s.by+'<br><span>'+(s.sub||'')+'</span></div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=h;
  d.appendChild(el);
});
</script>
</body>
</html>
