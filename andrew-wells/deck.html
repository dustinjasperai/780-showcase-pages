<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Functional Medicine, Simplified · Dr. Andrew Wells, Simplified Functional Medicine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#eef4fb; --panel:#fbfdff; --rule:#d7e2f1;
    --ink:#0f3a6b; --acc:#2f5aae; --gold:#f9ae01; --body:#38465f; --dim:#8794a8;
  }
  html,body{height:100%}
  body{background:#e0e9f5;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e0e9f5}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:-.006em}
  .t-title h1{font-size:4.7vw;max-width:92%}
  .t-normal h1{font-size:3.15vw;max-width:90%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Newsreader',serif;font-size:1.95vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.34;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.05vw;font-weight:600;color:var(--gold);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:3.6vh}
  .t-dark{background:linear-gradient(150% 130% at 50% 12%,#123f74 0%,#0c2c55 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:88%;color:#ffffff}
  .t-cta{background:linear-gradient(150% 130% at 50% 100%,#123f74 0%,#0c2c55 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:86%;color:#ffffff}
  .t-cta .body{font-family:'Inter',sans-serif;color:#d7e2f2;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--gold);color:#ffffff;border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.84vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .cl-motif{position:absolute;pointer-events:none}
  .title-cl{right:7.5%;bottom:8%;width:16vw;opacity:.95}
  .corner-cl{right:6.5%;bottom:7.5%;width:8vw;opacity:.55}
  .brandline{font-family:'Inter',sans-serif;font-size:1.12vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.04em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(15,58,107,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Simplified Functional Medicine</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: crossing strokes (complexity) gathering into one clean upward line (simplified) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="simp" viewBox="0 0 120 120">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 96 C34 84 30 60 44 58" stroke="#2f5aae" stroke-width="2" opacity="0.35"/>
    <path d="M22 100 C46 92 40 54 52 54" stroke="#2f5aae" stroke-width="2" opacity="0.35"/>
    <path d="M32 104 C58 96 52 50 60 50" stroke="#2f5aae" stroke-width="2" opacity="0.35"/>
    <path d="M60 50 L60 20" stroke="#f9ae01" stroke-width="3" opacity="0.95"/>
    <path d="M50 32 L60 18 L70 32" stroke="#f9ae01" stroke-width="3" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Functional Medicine, Simplified',sub:'How a chiropractor adds a cash based functional medicine practice in 30 days, without the complexity.',brand:true,cl:'title'},
 {t:'normal',k:'Who this is for',title:'You are great at adjustments. The schedule still owns your week.',body:'You are the chiropractor patients trust, and your hands have carried the practice for years. But volume caps you, insurance keeps shrinking the visit, and the patients who need the most help need something adjustments alone cannot give them. You have felt for a while that there is a bigger way to serve them.'},
 {t:'dark',title:'Most chiropractors never add functional medicine. Not because it does not work, because it looks impossible to start.'},

 {t:'section',idx:'Part One',title:'Why Functional Medicine Feels Out of Reach'},
 {t:'normal',k:'The complexity trap',title:'The usual path buries you before you see a single patient.',body:'The common way in is a stack of certifications, a hundred lab markers, and protocols so detailed you would need a second full time job to run them. It is built to look impressive, and it is exactly why most chiropractors sign up, feel overwhelmed, and quietly shelve it. Complexity is not depth. It is the thing standing between you and the patient.'},
 {t:'normal',k:'What patients actually need',title:'Chronic patients do not need more data. They need a clear path.',body:'The patient with fatigue, gut issues, or stubborn weight has usually already been through the system and come out with a folder of normal results and no answers. What moves them is not another panel. It is a simple, believable plan they can follow and a practitioner who can explain the why in plain language.'},
 {t:'dark',title:'You do not need to know everything. You need to simplify the right things.'},

 {t:'section',idx:'Part Two',title:'The 5 Fundamentals of Health'},
 {t:'normal',k:'Fundamental 1',title:'Optimized nutrition and gut health.',body:'The gut is the gateway to total health, so this is where the work starts. Before chasing exotic causes, you restore digestion and correct the deficiencies that quietly drive most chronic symptoms. Get this right and a surprising number of complaints begin to resolve on their own.'},
 {t:'normal',k:'Fundamental 2',title:'Quality movement and physical vitality.',body:'Motion is life. This is not about punishing exercise, it is about consistent, sustainable movement that keeps the metabolism and nervous system working the way they were built to. It is the fundamental patients can start the same day, which makes it a powerful first win.'},
 {t:'normal',k:'Fundamental 3',title:'Restorative sleep and recovery.',body:'You do not heal when you hustle, you heal when you rest. Tissue repair and hormone regulation happen in deep sleep, so protecting sleep quality is one of the highest leverage changes a patient can make, and one most doctors skip straight past.'},
 {t:'normal',k:'Fundamental 4',title:'Stress resilience and emotional well-being.',body:'You cannot treat the body without supporting the mind. Chronic stress keeps the nervous system stuck in a state where healing simply does not happen. Giving patients real tools to shift out of that state is often the difference between a plan that stalls and one that holds.'},
 {t:'normal',k:'Fundamental 5',title:'Smart supplementation and gentle detoxification.',body:'Support the body natural systems, do not overload them. Instead of a shelf of random bottles, this is targeted supplementation matched to what the person in front of you actually needs, and a gentle approach to reducing the load their body is carrying.'},
 {t:'dark',title:'Five fundamentals a patient can understand, not a hundred markers they cannot.'},

 {t:'section',idx:'Part Three',title:'Inside Your Simplified Practice'},
 {t:'normal',k:'Enrollment without the ick',title:'You present care plans with the patient, never sell to them.',body:'High ticket care does not have to feel pushy. When you show a patient a clear plan built on the five fundamentals and let them choose it with you, enrollment stops feeling like a pitch and starts feeling like the natural next step in their care. The trust you already have is what makes it work.'},
 {t:'normal',k:'The practice this builds',title:'A cash based practice that finally rewards your best work.',body:'Instead of trading more hours for shrinking reimbursements, you help fewer patients more deeply and get paid for the outcome, not the visit code. The same hands, the same chair, with a second engine underneath the practice that does not depend on volume.'},
 {t:'dark',title:'The goal was never to stop adjusting. It was to finally treat the whole patient, and be paid for it.'},
 {t:'normal',k:'Why Simplified Functional Medicine',title:'We built this because we needed it ourselves.',body:'Simplified Functional Medicine comes from doctors who have owned and run integrated clinics for over a decade and coached hundreds of practitioners through this exact transition. Everything here is the simplified version we wished we had at the start, the five fundamentals and the 30 day path, so you can add functional medicine without new credentials, new staff, or a new full time job.'},

 {t:'section',idx:'Your Next Step',title:'Add Functional Medicine, The Simple Way'},
 {t:'cta',title:'Ready to build your functional medicine practice?',body:'Book a discovery call with Simplified Functional Medicine and we will map the simplest path to launch yours.',chips:['Schedule a discovery call','See the 30 day launch path'],disc:'Educational content for licensed practitioners. No income, patient, or practice result is guaranteed. Results vary by practitioner, patient, and market. Nothing here is medical advice.'},
];

const deck=document.getElementById('deck');
function cl(kind){return `<svg class="cl-motif ${kind==='title'?'title-cl':'corner-cl'}"><use href="#simp"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Simplified <b>Functional Medicine</b> · Dr. Andrew Wells</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.cl) h+=cl(s.cl);
  else if(s.t==='title') h+=cl('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
