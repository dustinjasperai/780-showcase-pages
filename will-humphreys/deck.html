<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rockstar Team | Will Humphreys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f2f4; --panel:#ffffff; --rule:#dcdcdc; --ink:#0b0b0b;
    --muted:#55585c; --accent:#d81f2a;
    --display:'Inter Tight',system-ui,sans-serif; --body:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:900px;margin:0 auto;padding:40px 22px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    padding:54px 52px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:20px}
  .num{position:absolute;top:26px;right:30px;font-family:var(--display);font-weight:700;
    font-size:12px;color:var(--rule)}
  h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.02;letter-spacing:-.02em}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-.01em}
  .sub{font-size:22px;line-height:1.45;color:var(--muted);margin-top:22px;max-width:46ch}
  p.body{font-size:20px;line-height:1.5;margin-top:18px;max-width:52ch}
  .lead{font-size:26px;line-height:1.4;max-width:48ch}
  .accentbar{width:64px;height:5px;background:var(--accent);border-radius:3px;margin-top:28px}
  ul{margin-top:22px;list-style:none}
  li{font-size:20px;line-height:1.45;padding-left:28px;position:relative;margin-bottom:14px;max-width:50ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .pill{display:inline-block;font-family:var(--display);font-weight:700;font-size:14px;
    letter-spacing:.04em;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;
    padding:7px 16px;margin:6px 8px 0 0}
  .big{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;color:var(--accent)}
  .foot{margin-top:30px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted)}
  .disclaimer{margin-top:26px;font-size:14px;line-height:1.4;color:var(--muted);max-width:60ch;font-family:var(--display);font-weight:500}
  .cta{background:var(--ink);color:var(--bg)}
  .cta .eyebrow{color:var(--accent)}
  .cta h2,.cta h1{color:var(--bg)}
  .cta .sub,.cta p.body{color:#cfd1d3}
  .btn{display:inline-block;margin-top:30px;font-family:var(--display);font-weight:700;font-size:18px;
    background:var(--accent);color:#fff;padding:16px 30px;border-radius:6px}
  @media(max-width:620px){.slide{padding:38px 26px}h1{font-size:38px}h2{font-size:27px}.big{font-size:54px}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass for practice owners',h1:'The Rockstar Team',sub:'How to hire and build a physical therapy team that runs your clinic, makes it sellable, and does not need you in every room.',foot:'Presented by Will Humphreys, PT · Healthcare Business Academy'},

  {t:'who',eyebrow:'Who this is for',h2:'You own the clinic. You are also the bottleneck.',body:'This is for the PT practice owner who has one or more locations, a schedule that is full, and a nagging feeling that if you stepped away for 30 days the whole thing would wobble. You did not open a clinic to become its full-time hiring manager, biller, and firefighter.'},

  {t:'trap',eyebrow:'The trap',h2:'We were taught to treat hiring as an emergency.',body:'A therapist quits. Caseloads back up. So you post a job, take the first licensed body who answers, and hope. Six months later they leave too, and the cycle restarts. Hiring reactively is the single most expensive habit in practice ownership, and almost nobody was taught another way in PT school.'},

  {t:'reframe',eyebrow:'The reframe',lead:'Your most profitable growth lever is not more marketing. It is the team you hire.',sub:'More patients into a clinic that already depends on you just buys you a busier prison. The owners who get their life back build a team first.'},

  {t:'part',eyebrow:'Part one',h2:'Why the "warm body" hire keeps failing',body:'When you hire out of panic, you select for availability instead of alignment. You get someone who can do the job but does not own the outcome. The fix is not working harder on interviews. It is building a repeatable system that attracts rockstars before you need them and vets for fit, not just a license.'},

  {t:'framework',eyebrow:'Part two · the system',h2:'The Rockstar Recruiter system',body:'The method behind 1,000+ hires across PT clinics. Three moving parts that turn hiring from an emergency into an engine:',pills:['Attract on purpose','Vet for fit, not license','Structure the offer to retain']},

  {t:'step',eyebrow:'Part two · step one',h2:'Attract on purpose',body:'Rockstars are not reading job boards. You build a job advertisement and a presence that speaks to what a great PT actually wants (growth, mentorship, autonomy) so the right people raise their hand before a seat is even open. A pipeline, not a panic post.'},

  {t:'step',eyebrow:'Part two · step two',h2:'Vet for fit, not a license',body:'A license tells you they can treat. It tells you nothing about whether they will own their caseload, protect your culture, or stay. A structured vetting process screens for the traits that actually predict a long, profitable tenure, before you make the offer, not after.'},

  {t:'step',eyebrow:'Part two · step three',h2:'Structure the offer to retain',body:'The salary and bonus you design is the difference between a hire who stays two years and one who stays six months. You learn to build an offer that retains your next rockstar without breaking the bank, so you stop paying to re-hire the same seat.'},

  {t:'pillars',eyebrow:'Part two · the frame',h2:'Vision · Profit · People',body:'Every decision runs through three pillars. A clear owner vision for the life the clinic should fund. Healthy profit so growth is sustainable. And a team of people who run the business so it is no longer built around you.'},

  {t:'leverage',eyebrow:'Part two · the multiplier',h2:'You do not have to hire it all locally',body:'Front desk, scheduling, billing, and follow-up do not need to sit in your building. Vetted virtual team members take the admin load off your clinicians so your licensed people work at the top of their license and your overhead drops. The team gets bigger; the payroll does not have to.'},

  {t:'picture',eyebrow:'Part three · the clinic without you',h2:'The clinic holds without you',body:'When the team is built on purpose, you take a two-week trip and revenue does not dip. New therapists are productive in weeks, not quarters. And the asset you have been building finally has value to someone other than you.'},

  {t:'exit',eyebrow:'Part three · the payoff',h2:'A team is what makes a practice sellable',body:'A practice that depends on the owner is a job, not an asset. A practice that runs on a team is something a buyer will pay a premium for. This is the same path that led to an exit at three times the national-average valuation.'},

  {t:'whyme',eyebrow:'Why me',h2:'I have made every one of these hires, and plenty of mis-hires.',body:'I am Will Humphreys, PT. I built a private practice to multiple locations, exited at 3x the national average, and have spent the years since helping owners hire and build teams across hundreds of clinics. The Rockstar Recruiter system is what I wish someone had handed me on day one of ownership.',foot:'Will Humphreys, PT · Host of the Will Power Podcast'},

  {t:'recap',eyebrow:'The one idea',lead:'Build the team first. The freedom, the margin, and the sellable asset all follow from it.',sub:'Marketing fills a clinic. A team is what lets you leave the building.'},

  {t:'cta',eyebrow:'Your next step',h2:'Build your Rockstar team',body:'If you want help turning hiring from an emergency into a system in your own clinic, the next step is a short conversation to see where your team has gaps and whether the Rockstar Recruiter system is a fit.',cta:'Book a call with Healthcare Business Academy',disclaimer:'Educational only. This masterclass shares a framework and real experience; it is not a guarantee of any income, valuation, or hiring result. Outcomes vary by clinic, market, and execution.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  h+='<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.lead) h+='<div class="lead">'+s.lead+'</div>';
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.body) h+='<p class="body">'+s.body+'</p>';
  if(s.pills){h+='<div>';s.pills.forEach(p=>h+='<span class="pill">'+p+'</span>');h+='</div>';}
  if(s.t==='reframe'||s.t==='recap') h+='<div class="accentbar"></div>';
  if(s.cta) h+='<span class="btn">'+s.cta+'</span>';
  if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
