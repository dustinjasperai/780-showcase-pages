<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AI-Powered Appraisal Business | The Appraiser Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6ede1; --panel:#fffdf9; --rule:#e8d9c4;
    --ink:#313030; --muted:#69727d; --accent:#e58233; --slate:#33373d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--slate);font-family:'Lato',Arial,sans-serif;color:var(--ink);
    padding:40px 16px;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    aspect-ratio:16/9;padding:58px 64px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:64px;bottom:40px;width:46px;height:4px;
    background:var(--accent)}
  .slide.title,.slide.part,.slide.cta{background:var(--panel)}
  .tag{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:46px;line-height:1.08;
    color:var(--ink);letter-spacing:-.01em}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:34px;line-height:1.14;
    color:var(--ink)}
  .big{font-family:'Montserrat',sans-serif;font-weight:800;font-size:40px;line-height:1.1}
  .sub{font-size:20px;color:var(--muted);margin-top:18px;max-width:40ch}
  .lede{font-size:22px;color:var(--ink);margin-top:14px;max-width:46ch}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:14px}
  li{font-size:20px;padding-left:26px;position:relative;max-width:50ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;
    background:var(--accent);border-radius:2px}
  .kicker{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--accent);
    font-size:15px;letter-spacing:.14em;text-transform:uppercase}
  .partnum{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;
    color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
  .by{margin-top:30px;font-size:17px;color:var(--muted);font-weight:700}
  .card{background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--accent);
    border-radius:8px;padding:22px 26px;margin-top:20px;max-width:52ch}
  .card .q{font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px}
  .card .a{color:var(--muted);font-size:17px;margin-top:6px}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .week{display:flex;gap:8px;margin-top:24px}
  .col{flex:1;text-align:center}
  .colh{font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .bar{height:14px;border-radius:3px;margin:4px 0;background:var(--rule)}
  .bar.on{background:var(--accent)}
  .foot{position:absolute;right:64px;bottom:40px;font-family:'Montserrat',sans-serif;
    font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em}
  @media(max-width:640px){.slide{padding:34px 28px}h1{font-size:30px}h2{font-size:24px}
    .big{font-size:26px}.sub,.lede{font-size:17px}li{font-size:16px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", tag:"A free live masterclass", h:"The AI-Powered Appraisal Business",
    sub:"The first, highest-leverage ways to put AI to work in your appraisal business, without giving up the judgment the job depends on.",
    by:"with The Appraiser Coach"},

  {t:"who", tag:"Who this is for",
    h:"The appraiser who owns the business, not just the orders.",
    lede:"Residential appraisers running their own shop who are tired of trading more hours for the same income, and who can feel the market changing under their feet."},

  {t:"trap", tag:"The trap",
    h:"You are not short on demand. You are short on hours.",
    bullets:["Sixty-hour weeks that cap what you can ever earn.","Fee pressure, faster turn times, and AVMs squeezing the middle.","The quiet worry that the work itself is about to change."]},

  {t:"reframe", kicker:"The real stakes",
    big:"The threat is not AI. It is the appraiser across town who learns it first.",
    sub:"Appraisers who figure out AI first will have an enormous edge. The rest will spend the next few years competing on price."},

  {t:"part", num:"Part One", h:"The core problem"},

  {t:"body", tag:"Part One",
    h:"AI is being sold to you two wrong ways.",
    bullets:["“It will replace you.” It will not. It cannot sign your report or carry your license.","“Ignore it, it is a toy.” Also wrong, and more expensive every month.","The truth sits in the middle, and almost nobody is teaching it to appraisers."]},

  {t:"body", tag:"Part One",
    h:"The cost is the hours you never get back.",
    lede:"Every hour spent on research you could automate, comments you rewrite from scratch, and client back-and-forth is an hour stolen from inspections, from growth, and from your family."},

  {t:"part", num:"Part Two", h:"The method"},

  {t:"body", tag:"Part Two",
    h:"Where AI actually saves an appraiser hours.",
    bullets:["Research and data gathering before you ever open the file.","Drafting clear, defensible commentary in your own voice.","Client and lender communication that used to eat your afternoons.","Workflow glue that moves a job from order to delivery."]},

  {t:"body", tag:"Part Two, the RACE method",
    h:"Most appraisers prompt AI wrong. Here is the fix.",
    lede:"The RACE method is how you communicate with AI so you get sharp, usable output instead of generic slop.",
    cards:[{q:"Vague ask in",a:"A generic, lifeless draft you throw away."},{q:"Role, context, and the exact ask, the RACE way",a:"Usable output in your voice, in seconds."}]},

  {t:"body", tag:"Part Two, the guardrail",
    h:"AI assists your judgment. It never replaces it.",
    lede:"You stay the appraiser of record. The method is built so every output passes through your expertise and your USPAP responsibility before it ever leaves your desk."},

  {t:"part", num:"Part Three", h:"The first 90 days"},

  {t:"body", tag:"Part Three, the Prometheus plan",
    h:"Build it so it compounds.",
    bullets:["Days 1 to 30: one workflow, automated end to end, so you feel the time back.","Days 31 to 60: your voice and templates, so output sounds like you.","Days 61 to 90: stack the next two workflows and measure the hours returned."]},

  {t:"week", tag:"Your week, redesigned",
    h:"From sixty-hour weeks to twenty.",
    sub:"Same income first. Then more, because the hours you win go back into the business."},

  {t:"body", tag:"Why listen to me",
    h:"I rebuilt my own appraisal business the hard way.",
    bullets:["Appraising since 1996; sold my firm in 2021 and still appraise today.","Went from sixty-hour weeks under six figures to a far shorter week and a seven-figure practice.","Taught more than 1,300 appraisers since 2010 through The Appraiser Coach."]},

  {t:"reframe", kicker:"The one thing to remember",
    big:"First movers win this. The window is open now.",
    sub:"The appraisers who build these habits this year will look back on it as the cheapest edge they ever bought."},

  {t:"cta", tag:"Your next step",
    h:"Put this to work with me.",
    lede:"If you want the full build, the workflows, the RACE method templates, and the 90-day plan, come work with me inside The Appraiser Coach.",
    steps:["Join the community and start with the AI Academy.","Ready to go faster? The Dream Team Mastermind and private coaching take you all the way."],
    disc:"Educational content only. Results vary and depend on your market, your effort, and your business. Nothing here is a guarantee of income or specific results."}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('div','slide '+(s.t==='title'?'title':s.t==='part'?'part':s.t==='cta'?'cta':''));
  if(s.tag) sl.appendChild(el('div','tag',s.tag));
  if(s.kicker) sl.appendChild(el('div','kicker',s.kicker));
  if(s.num) sl.appendChild(el('div','partnum',s.num));
  if(s.h) sl.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));
  if(s.big) sl.appendChild(el('div','big',s.big));
  if(s.lede) sl.appendChild(el('div','lede',s.lede));
  if(s.sub) sl.appendChild(el('div','sub',s.sub));
  if(s.bullets){const ul=el('ul');s.bullets.forEach(b=>ul.appendChild(el('li',null,b)));sl.appendChild(ul);}
  if(s.cards){s.cards.forEach(c=>{const cd=el('div','card');cd.appendChild(el('div','q',c.q));cd.appendChild(el('div','a',c.a));sl.appendChild(cd);});}
  if(s.steps){const ul=el('ul');s.steps.forEach(b=>ul.appendChild(el('li',null,b)));sl.appendChild(ul);}
  if(s.t==='week'){
    const w=el('div','week');
    const cols=[["Before",[1,1,1,1,0]],["After",[1,1,0,0,0]]];
    cols.forEach(([name,rows])=>{const c=el('div','col');c.appendChild(el('div','colh',name));
      rows.forEach(r=>c.appendChild(el('div','bar'+(r?' on':''))));w.appendChild(c);});
    sl.appendChild(w);
  }
  if(s.by) sl.appendChild(el('div','by',s.by));
  if(s.disc) sl.appendChild(el('div','disc',s.disc));
  sl.appendChild(el('div','foot','The Appraiser Coach'));
  deck.appendChild(sl);
});
</script>
</body>
</html>
