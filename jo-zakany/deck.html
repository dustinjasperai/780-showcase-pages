<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excellence Over Perfection | MindfulOpus Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #f4f7f5;
    --panel: #ffffff;
    --rule: #dfe6e2;
    --ink: #101816;
    --ink-soft: #24332f;
    --ink-muted: #5c6b66;
    --accent: #8fd0c8;
    --deep: #24332f;
  }
  html, body { height:100%; }
  body {
    font-family: 'Source Sans 3', -apple-system, sans-serif;
    background: var(--deep);
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .stage { width:100%; max-width:1100px; aspect-ratio:16/9; position:relative; }
  .slide {
    position:absolute; inset:0; display:none;
    flex-direction:column; justify-content:center;
    background: var(--bg); padding:72px 84px;
    border:1px solid var(--rule);
  }
  .slide.on { display:flex; }
  .slide.title, .slide.cta { background: var(--deep); color:#f4f7f5; }
  .slide.title h1, .slide.cta h1 { color:#f4f7f5; }
  .slide.title .accent-rule, .slide.cta .accent-rule { background: var(--accent); }
  .kicker { font-size:14px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color: var(--ink-muted); margin-bottom:22px; }
  .slide.title .kicker, .slide.cta .kicker { color: var(--accent); }
  h1 { font-family:'Source Serif 4', Georgia, serif; font-size:52px; font-weight:700; line-height:1.1; color:var(--ink); letter-spacing:-0.015em; }
  h2 { font-family:'Source Serif 4', Georgia, serif; font-size:40px; font-weight:700; line-height:1.14; color:var(--ink); letter-spacing:-0.01em; margin-bottom:22px; }
  .lead { font-size:23px; line-height:1.5; color:var(--ink-soft); max-width:40ch; }
  p { font-size:21px; line-height:1.55; color:var(--ink-soft); max-width:46ch; margin-bottom:14px; }
  .accent-rule { width:72px; height:5px; background:var(--accent); border-radius:3px; margin:26px 0; }
  ul { list-style:none; margin-top:10px; }
  li { font-size:21px; line-height:1.4; color:var(--ink-soft); padding:12px 0 12px 30px; position:relative; border-bottom:1px solid var(--rule); max-width:44ch; }
  li:before { content:""; position:absolute; left:0; top:21px; width:12px; height:12px; border-radius:50%; background:var(--accent); }
  .big { font-family:'Source Serif 4', Georgia, serif; font-size:44px; font-weight:600; line-height:1.18; color:var(--ink); letter-spacing:-0.01em; max-width:20ch; }
  .sub { font-size:19px; color:var(--ink-muted); margin-top:18px; }
  .meta { font-size:18px; color:var(--ink-muted); margin-top:30px; }
  .strike { color:var(--ink-muted); text-decoration:line-through; }
  .on-accent { color:var(--deep); background:var(--accent); padding:2px 10px; border-radius:4px; }
  .grade { font-family:'Source Serif 4', Georgia, serif; font-size:120px; font-weight:700; color:var(--accent); line-height:1; }
  .disc { font-size:15px; color:#aab8b3; margin-top:26px; max-width:52ch; line-height:1.5; }
  .nav { position:fixed; bottom:18px; right:24px; font-family:'Source Sans 3',sans-serif; font-size:13px; color:#9fb0ab; }
  .wheel { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; }
  .seg { font-size:17px; padding:10px 16px; border:1px solid var(--rule); border-radius:999px; color:var(--ink-soft); background:var(--panel); }
  .seg.hl { background:var(--accent); color:var(--deep); border-color:var(--accent); font-weight:700; }
  @media (max-width:640px){ .slide{padding:34px 30px;} h1{font-size:30px;} h2{font-size:25px;} .big{font-size:26px;} p,li,.lead{font-size:16px;} .grade{font-size:72px;} }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="nav" id="nav"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="kicker">MindfulOpus Masterclass</div>
    <h1>Excellence Over Perfection</h1>
    <div class="accent-rule"></div>
    <p class="lead">The sustainable path to your best performances, for classical musicians who are tired of the grind.</p>
    <div class="meta">With Jo Zakany, Cleveland Orchestra violist and certified well-being coach</div>
  `},
  {t:'promise', cls:'', html:`
    <div class="kicker">What you will leave with</div>
    <h2>One hour, three shifts</h2>
    <ul>
      <li>A way to practice and perform at a high level without burning out</li>
      <li>A grading practice that replaces perfectionism with curiosity</li>
      <li>A simple picture of a musical life that is more than music</li>
    </ul>
  `},
  {t:'who', cls:'', html:`
    <div class="kicker">Who this is for</div>
    <h2>You love the music. The grind is costing you.</h2>
    <p>Students, freelancers, and professionals who were raised on the idea that more hours and higher standards are always the answer.</p>
    <p>The practice room feels heavy. Auditions wreck your sleep. You wonder how long you can keep this up.</p>
  `},
  {t:'trap', cls:'', html:`
    <div class="kicker">The trap</div>
    <p class="big">You were taught that to give less than 100 percent is to fail. So you give 110, and call the exhaustion dedication.</p>
  `},
  {t:'hook', cls:'', html:`
    <div class="kicker">A harder truth</div>
    <p class="big">Perfectionism is not high standards. It is shame wearing a nicer outfit.</p>
    <div class="sub">Excellence is rooted in curiosity. Perfection is rooted in shame. They feel similar and they end very differently.</div>
  `},
  {t:'part1', cls:'', html:`
    <div class="kicker">Part one</div>
    <h2>The core problem</h2>
    <p>Classical training rewards the chase for 100 percent. But a number you can never reach becomes a number that quietly runs your life.</p>
  `},
  {t:'cost', cls:'', html:`
    <div class="kicker">What it costs</div>
    <h2>When your worth equals your last performance</h2>
    <ul>
      <li>Injury, because recovery feels like laziness</li>
      <li>Burnout, because rest was never on the schedule</li>
      <li>Joylessness, because nothing is ever quite good enough</li>
    </ul>
  `},
  {t:'part2', cls:'', html:`
    <div class="kicker">Part two</div>
    <h2>The framework</h2>
    <p>Four shifts that let you keep the standards and lose the self-punishment. None of them ask you to care less about the music.</p>
  `},
  {t:'pillar1', cls:'', html:`
    <div class="kicker">Shift one</div>
    <h2>Grade at 92, not 100</h2>
    <p>After a performance, give it an honest grade. Most strong work lands between 80 and 95. Done well is better than perfect and never finished.</p>
    <div class="sub">Excellence over perfection, made into a daily habit.</div>
  `},
  {t:'pillar2', cls:'', html:`
    <div class="kicker">Shift two</div>
    <h2>The Well-Being Wheel</h2>
    <p>Music is one slice of a whole life, not the entire pie. When the other slices are starved, the music suffers too.</p>
    <div class="wheel">
      <span class="seg hl">Music</span><span class="seg">Body</span><span class="seg">Rest</span><span class="seg">Relationships</span><span class="seg">Curiosity</span>
    </div>
  `},
  {t:'pillar3', cls:'', html:`
    <div class="kicker">Shift three</div>
    <h2>You are not your last note</h2>
    <p>Detach your worth from the outcome. A missed entrance is information, not a verdict on who you are.</p>
  `},
  {t:'pillar4', cls:'', html:`
    <div class="kicker">Shift four</div>
    <h2>Train like the athlete you are</h2>
    <p>Elite athletes schedule recovery, sleep, and support on purpose. Musicians are athletes of the small muscles. Build the same infrastructure.</p>
  `},
  {t:'tool', cls:'', html:`
    <div class="kicker">A decision tool</div>
    <h2>The diving board</h2>
    <p>Facing a big change? Ask one question. Is the fear crystal clear blue water, just the nerves of jumping into something good?</p>
    <p>Or is it toxic muck, a sign this is the wrong fit, a square peg in a round hole?</p>
  `},
  {t:'reframe', cls:'', html:`
    <div class="kicker">The reframe</div>
    <p class="big">You do not have to give up your humanity for <span class="strike">perfection</span> <span class="on-accent">your artistry</span>.</p>
  `},
  {t:'practice', cls:'', html:`
    <div class="kicker">Part three</div>
    <h2>What a sustainable week looks like</h2>
    <ul>
      <li>Focused practice blocks with real breaks between them</li>
      <li>One scheduled recovery block you protect like a rehearsal</li>
      <li>A short grade and a note of what you learned, not what you failed</li>
    </ul>
  `},
  {t:'season', cls:'', html:`
    <div class="kicker">Over a season</div>
    <p class="big">Fewer collapses. Steadier auditions. A career you can still love in twenty years.</p>
  `},
  {t:'whyme', cls:'', html:`
    <div class="kicker">Why listen to me</div>
    <h2>I lived both sides of this</h2>
    <p>Twenty years as a violist with The Cleveland Orchestra, won at twenty-one, inside the most competitive corner of this field.</p>
    <p>Then burnout, and a way back through yoga and coaching. Certified health and well-being coach through Duke Integrative Medicine, and a registered yoga teacher.</p>
  `},
  {t:'recap', cls:'', html:`
    <div class="kicker">The whole idea, once more</div>
    <h2>Keep the standards. Lose the shame.</h2>
    <ul>
      <li>Grade at 92, with curiosity</li>
      <li>Feed the whole wheel, not just the music</li>
      <li>Separate your worth from the outcome</li>
      <li>Recover on purpose</li>
    </ul>
  `},
  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next step</div>
    <h1>Work with me</h1>
    <div class="accent-rule"></div>
    <p class="lead">If this is the way you want to make music, let us build it into your real weeks together. Book a free consultation and we will map your first shift.</p>
    <div class="meta">mindfulopus.com</div>
    <div class="disc">Educational content only. Individual results vary and nothing here is a guarantee of any specific outcome, audition result, or income. Coaching is not medical or mental health care.</div>
  `}
];
const stage=document.getElementById('stage');
stage.innerHTML=S.map((s,i)=>`<div class="slide ${s.cls||''} ${i===0?'on':''}" data-i="${i}">${s.html}</div>`).join('');
let cur=0;const slides=[...document.querySelectorAll('.slide')];const nav=document.getElementById('nav');
function show(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((el,i)=>el.classList.toggle('on',i===cur));nav.textContent=(cur+1)+' / '+S.length;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
stage.addEventListener('click',()=>show(cur+1));
show(0);
</script>
</body>
</html>
