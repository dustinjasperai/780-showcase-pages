<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Stop Restricting, Start Building · Coach Jeanine Escobar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#161616; --panel:#201E1E; --rule:#2E2A2A;
    --acc:#C8102E; --idx:#E08792; --chalk:#FAF8F6; --grey:#C9C4C0; --dim:#8A817C;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Lato',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Lato',sans-serif;font-size:1.04vw;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;color:var(--chalk);line-height:1.02;letter-spacing:.005em}
  .t-title h1{font-size:6.6vw;max-width:92%}
  .t-normal h1{font-size:5vw;max-width:90%}
  .t-normal .body{font-family:'Lato',sans-serif;font-size:1.52vw;color:var(--grey);margin-top:2.8vh;max-width:76%;line-height:1.58;font-weight:300}
  .sub{font-family:'Lato',sans-serif;font-size:1.72vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Lato',sans-serif;font-size:1.18vw;font-weight:700;color:var(--idx);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:7vw;max-width:92%}
  .t-section .rule{width:17vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#2A1416 0%,#0C0B0B 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:5.4vw;max-width:90%;color:#FBF4F2}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2A1416 0%,#0C0B0B 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:6vw;max-width:88%}
  .chips{display:flex;gap:1.1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Lato',sans-serif;border:1.5px solid var(--acc);color:#F6CAD0;border-radius:100px;padding:1.3vh 1.8vw;font-size:1.16vw;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Lato',sans-serif;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45;font-weight:300}
  .t-title .disc,.t-normal .disc{text-align:left}
  .step-motif{position:absolute;pointer-events:none;opacity:.92}
  .title-steps{right:7%;bottom:8%;width:26vw}
  .corner-steps{right:6%;bottom:7.5%;width:12vw;opacity:.5}
  .brandline{font-family:'Lato',sans-serif;font-size:1.24vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.03em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Lato',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:400}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Lato',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.8vw}.t-title h1{font-size:11vw}.t-normal h1{font-size:8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:10vw}.t-dark h1{font-size:8vw}
    .t-cta h1{font-size:10vw}.chip{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Esco Elite</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- phases motif: five rising steps, the last one crowned in accent (fat loss earned last) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="steps" viewBox="0 0 300 150">
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="138" x2="288" y2="138" stroke="#C9C4C0" opacity="0.22"/>
    <rect x="22"  y="112" width="40" height="26" rx="3" stroke="#C9C4C0" opacity="0.45"/>
    <rect x="74"  y="92"  width="40" height="46" rx="3" stroke="#C9C4C0" opacity="0.55"/>
    <rect x="126" y="70"  width="40" height="68" rx="3" stroke="#E08792" opacity="0.8"/>
    <rect x="178" y="46"  width="40" height="92" rx="3" stroke="#C8102E" opacity="0.95"/>
    <rect x="230" y="20"  width="40" height="118" rx="3" fill="#C8102E" opacity="0.14" stroke="#C8102E"/>
    <circle cx="250" cy="14" r="6" fill="#C8102E" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Stop Restricting. Start Building.',sub:'A live masterclass for women in perimenopause and menopause who are done starving and still stuck.',brand:true,steps:'title'},
 {t:'normal',k:'Who this is for',title:"You're disciplined. The scale still won't move.",body:'You count the calories, you do the cardio, you cut the carbs again. In your 30s that worked. Now you do everything right and your body does the opposite.'},
 {t:'dark',title:'The problem was never your discipline. It was the strategy you were handed.'},

 {t:'section',idx:'Part One',title:'Why Restriction Backfires in Menopause'},
 {t:'normal',k:'The hormone shift',title:'Less estrogen changes the whole equation.',body:'As estrogen falls, your body stores fat differently, loses muscle faster, and recovers slower. The plan that worked at 35 is now fighting a body that no longer runs on those rules.'},
 {t:'normal',k:'The restriction trap',title:'Eat less and do more, and your body defends the fat.',body:'A deep deficit stacked on endless cardio reads as a threat. Metabolism dials down, muscle burns off for energy, and the little you lose comes back the moment real life returns.'},
 {t:'dark',title:'You cannot starve your way through menopause. You have to build your way through it.'},

 {t:'section',idx:'Part Two',title:'The Esco Elite Method'},
 {t:'normal',k:'Pillar one',title:'Macros that work with your body.',body:'Custom targets set by your phase, your hormones, and your goal, with enough protein and fuel to hold onto muscle. Not another blanket cut that leaves you hungry and smaller-but-softer.'},
 {t:'normal',k:'Pillar two',title:'Progressive strength, not endless cardio.',body:'Lifting that rebuilds the muscle menopause quietly takes away, programmed for a real schedule and real equipment, and getting a little stronger every week.'},
 {t:'normal',k:'Pillar three',title:'The mindset that closes the gap.',body:'The identity and habit work that keeps the results after the program ends, so you stop living between restart Mondays and start trusting what you build.'},

 {t:'section',idx:'Part Three',title:'The Elite Phases System'},
 {t:'normal',k:'The order is the secret',title:'Fat loss is a phase you earn, not where you start.',body:'Almost every plan opens with the deepest cut. The Elite Phases System does the opposite, on purpose, and that order is exactly why the results hold instead of rebounding.'},
 {t:'normal',k:'Phases one to three',title:'Stabilize, build, then recompose.',body:'Stabilization steadies hormones, sleep, stress, and your relationship with food, with no restriction. Build restores metabolism with strategic fuel. Recomposition adds muscle and drops fat at once, the most transformative phase of all.'},
 {t:'normal',k:'Phases four and five',title:'Fat loss last. Then maintenance for good.',body:'Only once your body is ready does a strategic, sustainable deficit begin. Maintenance then holds the result through a changed identity, not white-knuckle willpower.',steps:'corner'},
 {t:'dark',title:'Build first, and fat loss stops being a fight you lose every January.'},

 {t:'section',idx:'Life After the Diet Cycle',title:'The Woman This Builds'},
 {t:'normal',k:'The result',title:'Stronger, fueled, and off the diet cycle.',body:'A woman who lifts, eats enough, and trusts her body again, because she finally has a method built for this stage of life instead of a punishment borrowed from her 30s.'},
 {t:'normal',k:'Why Coach Jeanine',title:'She built this for the woman she used to be.',body:'Jeanine Escobar lost 100 pounds, gained it back, and broke the cycle only when she stopped restricting and started building. NASM certified in fitness and nutrition and a menopause specialist, now 48 and in the best shape of her life.'},

 {t:'cta',title:'Ready to build instead of starve?',chips:['Book a free consult','Apply for Esco Elite coaching'],disc:'Educational content for women in perimenopause and menopause. Not medical advice, and no specific weight-loss or health result is guaranteed. Results vary by individual, effort, and health status. Consult your physician before starting any nutrition or exercise program.'},
];

const deck=document.getElementById('deck');
function steps(kind){return `<svg class="step-motif ${kind==='title'?'title-steps':'corner-steps'}"><use href="#steps"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Esco <b>Elite</b> · Coach Jeanine Escobar</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.steps) h+=steps(s.steps);
  else if(s.t==='title') h+=steps('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
