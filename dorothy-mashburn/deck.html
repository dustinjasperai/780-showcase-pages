<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Paid What You Are Worth · Dorothy Mashburn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1b1917; --panel:#242019; --rule:#3a352d;
    --acc:#3d63c9; --ink:#f5f2ec; --body:#c9c3ba; --dim:#8b847a; --slate:#aab2c8;
  }
  html,body{height:100%}
  body{background:#0f0e0d;font-family:'Heebo',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f0e0d}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Sora',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Sora',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.08;letter-spacing:-.01em}
  .t-title h1{font-size:6.2vw;max-width:95%}
  .t-normal h1{font-size:3.7vw;max-width:92%}
  .t-normal .body{font-family:'Heebo',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.66;font-weight:300}
  .sub{font-family:'Heebo',sans-serif;font-size:2.0vw;color:var(--slate);margin-top:3.4vh;max-width:84%;line-height:1.4;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Sora',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:5.2vw;max-width:93%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#242433 0%,#141312 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.0vw;max-width:90%;color:#f6f2ea;font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#242433 0%,#141312 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.3vw;max-width:88%;color:#f6f2ea;font-weight:700}
  .t-cta .body{font-family:'Heebo',sans-serif;color:#e7e0d5;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6;font-weight:300}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:#f6f2ea;border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.5%;bottom:8.5%;width:17vw;opacity:.9}
  .corner-vf{right:6.5%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-family:'Sora',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(245,242,236,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:10vw}.t-normal h1{font-size:6.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.0vw}.t-section h1{font-size:8vw}.t-dark h1{font-size:6.4vw}
    .t-cta h1{font-size:7.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Salary Negotiations Made Simple</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: an offer letter with the number rising, drawn in royal blue -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#3d63c9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="26" y="18" width="60" height="78" rx="4" opacity="0.75"/>
    <path d="M36 38 H72 M36 50 H72 M36 62 H60" opacity="0.5"/>
    <path d="M64 84 L82 66 L100 84" opacity="0.9"/>
    <circle cx="82" cy="58" r="6" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Paid What You Are Worth',sub:'How a high achiever turns a job offer into the number they actually deserve, using the same discipline that closes deals in the boardroom.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You are the one who makes everyone else look good. You are also the one still underpaid for it.',body:'You deliver. You are the person the team leans on and the reason the numbers land. And still the raise is smaller than it should be, the promotion keeps slipping, and the offer that finally comes in is thousands below what the role is worth. You did the hard part. The pay did not follow.'},
 {t:'dark',title:'Being excellent at the work was never the same skill as being paid for it.'},

 {t:'section',idx:'Part One',title:'Why Great People Leave Money on the Table'},
 {t:'normal',k:'The number problem',title:'Most people negotiate against their old salary. That is the wrong anchor.',body:'When you tie your next number to what you made before, you carry every past underpayment forward into the new role. The question is not what you used to earn. It is what this role is worth to the company that is hiring for it. Anchor to the future, not the past.'},
 {t:'normal',k:'The fear',title:'You stay quiet because you do not want to seem greedy or difficult.',body:'Almost everyone who is underpaid is underpaid politely. The worry that asking makes you look ungrateful is exactly what keeps good people small. Hiring managers expect a counter. Silence is not read as gracious. It is read as agreement with the first, lowest number.'},
 {t:'normal',k:'The missing playbook',title:'Confidence is not a plan. You need to know what to say, and when.',body:'The advice to just believe in yourself does not survive contact with a real offer call. What changes the outcome is knowing what is actually negotiable beyond base pay, which words open the conversation, and how to hold the room when the pressure lands. That is a repeatable process, not a personality.'},
 {t:'dark',title:'The offer is not the end of the process. It is the moment your real leverage begins.'},

 {t:'section',idx:'Part Two',title:'The 7-Step Salary Negotiation Formula'},
 {t:'normal',k:'Step one, know your number',title:'Walk in with a researched target, not a hopeful guess.',body:'Before any conversation you set a specific, defensible number built on market data and the value of the role, with a floor you will not cross. A clear target does the quiet work of the whole negotiation, because you can only ask for what you have already decided you are worth.'},
 {t:'normal',k:'The salary history redirect',title:'When they ask what you made before, you have a way to move forward instead of back.',body:'The what did you make question is banned in more than twenty states, and answering it anchors you to your smallest past self. You will have language ready to redirect it to your target for this role, warmly and without friction, so the conversation stays pointed at the future.'},
 {t:'normal',k:'VIBE over duties',title:'Prove your value in the language the business already cares about.',body:'Listing your tasks makes you a cost. VIBE means Value based, Impact driven, Business focused Examples: the specific, dollar aware wins you created. When you speak in the terms the company uses to measure everything else, a bigger number stops sounding like a favor and starts sounding like math.'},
 {t:'normal',k:'The brand that resonates',title:'You get the offer, and the raise, when the room already rates you.',body:'The best negotiation starts long before the call. When your manager can name the results you own, you are the person they fight to keep and promote at the calibration meeting you never see. Building that brand on purpose is part of the formula, not an accident of being liked.'},
 {t:'normal',k:'The conversation',title:'Anchor high, stay steady, and let the silence do its job.',body:'You open with your researched number, you hold it without apologizing, and you treat the pause after the ask as theirs to fill, not yours. Steadiness under pressure is a skill you can practice, and it is the difference between hoping for more and calmly securing it.'},
 {t:'dark',title:'A negotiation is not a fight. It is a professional making a clear, well built case for a fair number.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Run the Play'},
 {t:'normal',k:'The outcome',title:'The same role, the same you, tens of thousands of dollars apart.',body:'This is not about a different job. It is about the same offer, negotiated instead of accepted. Clients have moved a single conversation by fifty thousand dollars, and turned an offer into more than double their old pay, because they asked with a plan instead of taking the first number in relief.'},
 {t:'normal',k:'Why Dorothy Mashburn',title:'A dealmaker who negotiates for a living, teaching you to negotiate for yourself.',body:'Dorothy is a corporate procurement leader who has led more than six hundred negotiations worldwide, trained at Harvard and Berkeley, and helped clients secure over six million dollars in additional compensation. She brings the exact discipline she uses on multimillion dollar contracts to the one deal that pays for your life: your own.'},

 {t:'section',idx:'Your Next Step',title:'Where You Go From Here'},
 {t:'normal',k:'Keep going with Dorothy',title:'The formula, applied to your offer, with a coach who has closed the deals.',body:'The masterclass is the map. Working together is where the seven steps get built around your role, your number, and your next conversation. Start with the free 7 Step Salary Negotiation training, then book a call when you are ready to walk into your negotiation with a plan.'},
 {t:'cta',title:'Ready to be paid what you are actually worth?',body:'Take the next step with Dorothy Mashburn and Salary Negotiations Made Simple.',chips:['Get the free 7-Step training','Book a discovery call'],disc:'Educational content for professionals negotiating their compensation. No income or salary result is guaranteed. Outcomes vary by role, market, employer, and individual circumstances.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Salary Negotiations <b>Made Simple</b> · Dorothy Mashburn</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
