<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Soft Life Business — Angie Diary Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Mulish:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe3; --panel:#fbf7ee; --rule:#e4dccb; --ink:#26302b; --accent:#2e4942;
    --muted:#6a6f64;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;line-height:1.5}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;border-bottom:1px solid var(--rule);position:relative}
  .eyebrow{font-family:"Jost",sans-serif;letter-spacing:.22em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.6rem}
  h1{font-family:"Jost",sans-serif;font-weight:600;font-size:clamp(2.1rem,5.4vw,4rem);
    line-height:1.08;letter-spacing:-.01em;max-width:18ch}
  h2{font-family:"Jost",sans-serif;font-weight:500;font-size:clamp(1.6rem,3.6vw,2.6rem);
    line-height:1.15;max-width:20ch}
  p{font-size:clamp(1.05rem,1.5vw,1.3rem);max-width:40ch;color:var(--ink);margin-top:1.4rem}
  p.lead{font-size:clamp(1.2rem,1.9vw,1.5rem);max-width:34ch}
  .muted{color:var(--muted)}
  .horizon{height:1px;background:var(--accent);width:84px;margin:2rem 0}
  .pillars{display:flex;flex-direction:column;gap:1rem;margin-top:2rem;max-width:40ch}
  .pillar{display:flex;gap:1rem;align-items:baseline}
  .pillar .n{font-family:"Jost",sans-serif;color:var(--accent);font-weight:600;font-size:1.1rem;min-width:2.2rem}
  .pillar .t{font-family:"Jost",sans-serif;font-size:1.15rem}
  .big{font-family:"Jost",sans-serif;font-weight:600;font-size:clamp(2.4rem,6vw,4.6rem);color:var(--accent);line-height:1}
  .brand{font-family:"Jost",sans-serif;letter-spacing:.14em;text-transform:uppercase;
    font-size:.78rem;color:var(--muted);position:absolute;bottom:5vh;left:9vw}
  .cta-box{margin-top:2.4rem;padding:1.6rem 1.8rem;background:var(--panel);
    border:1px solid var(--rule);border-left:3px solid var(--accent);max-width:44ch}
  .cta-box .step{font-family:"Jost",sans-serif;font-size:1.3rem;color:var(--accent)}
  .disclaimer{margin-top:2rem;font-size:.82rem;color:var(--muted);max-width:52ch;line-height:1.5}
  ul.points{margin-top:1.6rem;max-width:42ch;list-style:none}
  ul.points li{padding:.6rem 0 .6rem 1.4rem;border-bottom:1px solid var(--rule);position:relative;font-size:1.1rem}
  ul.points li:before{content:"";position:absolute;left:0;top:1.15rem;width:8px;height:8px;background:var(--accent);border-radius:50%}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S = [
  {t:"title", eyebrow:"A free masterclass", h:"The Soft Life Business",
   p:"How to build a digital-products business that keeps selling while you live your life."},

  {t:"section", eyebrow:"Who this is for", h:"You started this to get your time back.",
   p:"And somewhere along the way you built yourself another job. More posts, more launches, more hours. The freedom you were promised keeps moving further away."},

  {t:"hook", eyebrow:"The real problem", h:"It was never about working harder.",
   p:"It is that every single sale still runs through you. If you stop, the money stops. That is not a business. That is a wage with extra steps."},

  {t:"section", eyebrow:"Part one", h:"The faster hamster wheel",
   p:"Going online did not fix the problem. It just made the wheel spin faster. Trading hours for money looks the same whether the storefront is physical or digital."},

  {t:"statement", big:"Your time should not be the product.",
   p:"The whole point of a digital product is that it is not tied to your calendar. Built once, it can sell at any hour, to anyone, without your presence."},

  {t:"section", eyebrow:"Part two", h:"The Soft Life method",
   p:"A business that respects your life, or nothing. Four pieces turn a digital product into a system that runs on a few hours a week.",
   pillars:[["01","An offer people actually want"],["02","Content that feeds the funnel"],["03","A system that sells on autopilot"],["04","The owner mindset"]]},

  {t:"section", eyebrow:"Pillar one", h:"The irresistible offer",
   p:"Before funnels, before content, before anything: one digital product that solves a real, specific problem for a specific person. We find the idea, shape the promise, and price it so it is an easy yes."},

  {t:"section", eyebrow:"Pillar two", h:"Content that feeds the funnel",
   p:"You do not need a huge audience and you do not need paid ads to start. You need content that does a job: it brings the right people in and warms them up so the sale is already half made."},

  {t:"section", eyebrow:"Pillar three", h:"The autopilot system",
   p:"This is where the soft life is built. A simple funnel plus a few automations that take someone from a first touch to a purchase without you being in the room. The notification lands while you are at dinner."},

  {t:"section", eyebrow:"Pillar four", h:"From employee brain to owner brain",
   p:"The hardest shift is the quietest one. You stop measuring the day in hours worked and start measuring it in systems built. This is the mindset that lets you close the laptop and trust the machine."},

  {t:"statement", big:"A few hours a week.",
   p:"When the offer, the content, and the system are in place, the work changes shape. You spend your time improving the engine, not being the engine."},

  {t:"section", eyebrow:"Part three", h:"What a soft-life day looks like",
   p:"You check in once. You answer a handful of people. You create one piece of content because you want to, not because the month depends on it. The system handled the rest overnight."},

  {t:"section", eyebrow:"Why me", h:"I built this from the inside",
   p:"I left a corporate job, tested digital products until one worked, and built a business I run in under four hours a day. More than two hundred clients have now used this same method to launch their own."},

  {t:"section", eyebrow:"Objection", h:"“But I do not have an audience.”",
   p:"Good. Most of the people who get this working did not either. A small, specific audience built around one clear offer beats a big, vague one every time. You start where you are."},

  {t:"section", eyebrow:"Objection", h:"“Isn’t this just passive-income hype?”",
   p:"No. Passive income is the result, not the method. There is real work up front: the offer, the content, the system. What is different is that the work compounds instead of repeating."},

  {t:"section", eyebrow:"Your first move", h:"One product, one simple funnel",
   p:"You do not build the whole machine at once. You launch one digital product and one simple path to buy it. Everything else is added on top of something that already works."},

  {t:"recap", eyebrow:"The method, in one view", h:"Four pieces, one soft life",
   points:["An offer people actually want","Content that feeds the funnel","A system that sells on autopilot","The owner mindset that lets you let go"]},

  {t:"section", eyebrow:"Where this goes next", h:"Soft Life Era",
   p:"If you want the full path, step by step, with the templates and the support to build it, that is what Soft Life Era is: a guided program to launch and automate your first digital offer."},

  {t:"cta", eyebrow:"Your next step", h:"Come build your soft life",
   step:"Join the next session and start with your first offer.",
   disclaimer:"This masterclass is for education only. It shares a method and a personal experience; it is not a promise or guarantee of income or results. Outcomes depend on your own work, market, and circumstances, and results vary from person to person."}
];

const app = document.getElementById("app");
function esc(x){return (x||"")}
S.forEach(s=>{
  const d=document.createElement("section");
  d.className="slide";
  let html="";
  if(s.eyebrow) html+=`<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.h) html+= (s.t==="title") ? `<h1>${esc(s.h)}</h1>` : `<h2>${esc(s.h)}</h2>`;
  if(s.big){ html+=`<div class="horizon"></div><div class="big">${esc(s.big)}</div>`; }
  if(s.p) html+=`<p class="${s.t==='title'?'lead':''}">${esc(s.p)}</p>`;
  if(s.pillars){ html+=`<div class="pillars">`+s.pillars.map(p=>`<div class="pillar"><span class="n">${p[0]}</span><span class="t">${p[1]}</span></div>`).join("")+`</div>`; }
  if(s.points){ html+=`<ul class="points">`+s.points.map(p=>`<li>${esc(p)}</li>`).join("")+`</ul>`; }
  if(s.step){ html+=`<div class="cta-box"><div class="step">${esc(s.step)}</div></div>`; }
  if(s.disclaimer){ html+=`<div class="disclaimer">${esc(s.disclaimer)}</div>`; }
  html+=`<div class="brand">Angie Diary</div>`;
  d.innerHTML=html;
  app.appendChild(d);
});
</script>
</body>
</html>
