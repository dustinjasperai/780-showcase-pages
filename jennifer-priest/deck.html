<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Belief Underneath the Number | A Masterclass with Jennifer Priest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#faf8f3;
    --panel:#f0ede6;
    --ink:#1e1a36;
    --ink-soft:#4a4660;
    --ink-muted:#7a7690;
    --rule:#d9d2c4;
    --accent:#d4a85a;
  }
  html,body{height:100%;}
  body{
    font-family:'Figtree',-apple-system,sans-serif;
    background:var(--ink);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  #stage{
    width:min(96vw,1040px);
    aspect-ratio:16/9;
    background:var(--bg);
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
  }
  .slide{
    position:absolute; inset:0;
    padding:7% 8%;
    display:none;
    flex-direction:column; justify-content:center;
  }
  .slide.on{ display:flex; }
  .eyebrow{ font-size:1.05vw; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:1.4em; }
  h1{ font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:4.4vw; line-height:1.08; letter-spacing:-.01em; }
  h2{ font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:3.1vw; line-height:1.14; margin-bottom:.5em; }
  .sub{ font-family:'Newsreader',Georgia,serif; font-size:1.9vw; color:var(--ink-soft); margin-top:1em; font-weight:400; }
  p.body{ font-size:1.5vw; color:var(--ink-soft); line-height:1.5; max-width:40em; }
  p.body + p.body{ margin-top:.8em; }
  .big{ font-family:'Newsreader',Georgia,serif; font-size:3.6vw; line-height:1.2; color:var(--ink); max-width:24em; }
  .big .hl{ color:var(--accent); }
  .kicker{ font-size:1.2vw; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-muted); }
  .part-n{ font-family:'Newsreader',Georgia,serif; font-size:7vw; color:var(--accent); line-height:1; margin-bottom:.1em; }
  ul.steps{ list-style:none; margin-top:1.2em; }
  ul.steps li{ font-size:1.6vw; color:var(--ink-soft); padding:.55em 0 .55em 1.6em; border-bottom:1px solid var(--rule); position:relative; }
  ul.steps li:last-child{ border-bottom:none; }
  ul.steps li::before{ content:""; position:absolute; left:0; top:1.1em; width:.6em; height:.6em; background:var(--accent); border-radius:50%; }
  ul.steps li b{ color:var(--ink); font-weight:600; }
  .bold-row{ display:flex; gap:3%; margin-top:1.4em; }
  .bold-card{ flex:1; background:var(--panel); padding:1.5em 1.4em; border-top:3px solid var(--accent); }
  .bold-card .l{ font-family:'Newsreader',serif; font-size:3vw; color:var(--accent); line-height:1; }
  .bold-card .n{ font-weight:700; font-size:1.25vw; color:var(--ink); margin:.5em 0 .3em; }
  .bold-card .d{ font-size:1.1vw; color:var(--ink-soft); line-height:1.4; }
  .cred{ display:flex; flex-wrap:wrap; gap:.7em; margin-top:1.4em; }
  .cred span{ background:var(--panel); border:1px solid var(--rule); color:var(--ink-soft); font-size:1.15vw; font-weight:500; padding:.5em .9em; }
  .cta-steps{ margin-top:1.1em; font-size:1.55vw; color:var(--ink-soft); }
  .disc{ margin-top:auto; font-size:.95vw; color:var(--ink-muted); line-height:1.5; max-width:46em; border-top:1px solid var(--rule); padding-top:1em; }
  .pager{ position:absolute; bottom:2.6%; right:3.4%; font-size:1vw; color:var(--ink-muted); font-weight:600; letter-spacing:.08em; }
  .brandline{ position:absolute; bottom:2.6%; left:3.4%; font-size:1vw; color:var(--ink-muted); font-weight:600; letter-spacing:.08em; }
  .nav{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:10; }
  .nav button{ font-family:'Figtree',sans-serif; font-size:13px; font-weight:600; color:#fff; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28); padding:7px 16px; border-radius:30px; cursor:pointer; }
  .nav button:hover{ background:rgba(255,255,255,.26); }
  @media (max-width:760px){
    .eyebrow{font-size:2.4vw;} h1{font-size:8vw;} h2{font-size:6vw;} .sub{font-size:4vw;}
    p.body{font-size:3.4vw;} .big{font-size:6.6vw;} .part-n{font-size:16vw;}
    ul.steps li{font-size:3.6vw;} .bold-card .l{font-size:7vw;} .bold-card .n{font-size:3vw;}
    .bold-card .d{font-size:2.6vw;} .cred span{font-size:3vw;} .cta-steps{font-size:3.6vw;}
    .disc{font-size:2.3vw;} .pager,.brandline{font-size:2.4vw;}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A live masterclass for coaches and course creators',
    h1:'The Belief Underneath the Number',
    sub:'Why your business keeps resetting to the same ceiling, and the first two steps of the BOLD Framework to move it. With Jennifer Priest.' },
  {t:'statement', eyebrow:'What you will walk away with',
    big:'A clear read on the one belief that is actually capping your business, and the first two steps to move it.' },
  {t:'lead', eyebrow:'Who this is for',
    h2:'Coaches and course creators who are stuck at the same number.',
    body:['You are good at what you do. Clients get results. The work is real.',
          'And still, the revenue keeps resetting to the same ceiling, no matter which new launch or funnel you try.'] },
  {t:'lead', eyebrow:'The trap',
    h2:'You keep buying the next strategy.',
    body:['Another course. Another launch formula. Another funnel template.',
          'Each one works for a while, then stops, and you are back where you started, now also tired and a little more skeptical.'] },
  {t:'statement', eyebrow:'The reframe',
    big:'The ceiling is not in your marketing. It is in a <span class="hl">belief you have not cleared yet.</span>' },
  {t:'part', n:'01', kicker:'Part One', h2:'Why the tactics keep failing' },
  {t:'lead',
    h2:'A strategy cannot outrun a belief.',
    body:['When part of you does not believe the next level is safe, allowed, or yours, you will quietly protect the current one.',
          'You underprice. You stall the launch. You stay busy with the wrong work. The tactic was never the problem.'] },
  {t:'lead',
    h2:'This is why more tactics make it worse.',
    body:['Every new strategy adds pressure without touching the thing holding the line.',
          'Mindset work and business acumen are not two separate projects. They have to move together, in order.'] },
  {t:'part', n:'02', kicker:'Part Two', h2:'The BOLD Framework' },
  {t:'bold', eyebrow:'The order matters',
    h2:'Belief first. Outcome second. Then the business.',
    cards:[
      { l:'B', n:'Beliefs', d:'Surface and clear the hidden belief capping the business, using Integrative NLP.' },
      { l:'O', n:'Outcomes', d:'Get specific on the real outcome you are building toward, not a vague bigger.' },
      { l:'...', n:'Then the build', d:'Only now do we touch the systems, offers, and marketing, aligned to the first two.' }
    ] },
  {t:'lead', eyebrow:'BOLD, step one',
    h2:'Beliefs',
    body:['We find the belief running underneath the pattern. Usually it is not the one you would guess.',
          'As a Master Practitioner of NLP, Hypnosis, and MER, this is the part of the work I am built for. One surfaced belief can move a business that has been stuck for years.'] },
  {t:'lead', eyebrow:'BOLD, step one',
    h2:'How a belief caps revenue.',
    body:['A belief like "charging more makes me greedy" does not show up as a thought. It shows up as a price that never rises and a calendar that never clears.',
          'Clear it, and the numbers you were forcing start to feel normal.'] },
  {t:'lead', eyebrow:'BOLD, step two',
    h2:'Outcomes',
    body:['Once the belief is cleared, we define the outcome with precision. Not "grow the business." The exact shape of the next level, in your own terms.',
          'This is what makes the later tactics obvious instead of overwhelming.'] },
  {t:'lead', eyebrow:'Mindset and acumen, together',
    h2:'Then, and only then, the business.',
    body:['With the belief cleared and the outcome set, the systems and offers almost design themselves, because they are no longer fighting an internal brake.',
          'Your work, your way. A business built to fit the coach, not the other way around.'] },
  {t:'part', n:'03', kicker:'Part Three', h2:'What this looks like for you' },
  {t:'lead',
    h2:'The shift in practice.',
    body:['One coach stops relaunching the same offer and finally names the outcome she actually wants. The next decision gets simple.',
          'The point is not a new tactic. It is removing the thing that made every tactic underperform.'] },
  {t:'cred', eyebrow:'Why me',
    h2:'I bring the mindset work and the business acumen in one place.',
    body:['I have spent years helping coaches and course creators find what is blocking their results and move it out of the way.'],
    tags:['Army veteran','Master Practitioner, NLP','Hypnosis and MER','Framework Collective','Mindset and business, together'] },
  {t:'lead', eyebrow:'Recap',
    h2:'Belief, Outcome, then the build.',
    body:['If you have been stuck at the same number, the fix is probably not the next funnel.',
          'It is the belief underneath the number, cleared first, in that order.'] },
  {t:'cta',
    eyebrow:'Your next step',
    h2:'Work the full BOLD Framework with me.',
    steps:'If this landed, the Framework Collective is where we run all of it together, mindset and business acumen, with support when you need it. Apply at jenniferppriest.com.',
    disc:'This masterclass is for educational purposes only. No income or result is guaranteed. Results vary based on your situation, effort, and many factors outside any framework. Nothing here is financial, legal, or psychological advice.' }
];

const stage = document.getElementById('stage');
let i = 0;

function slideHTML(s, idx){
  let inner = '';
  if(s.t==='title'){
    inner = `<div class="eyebrow">${s.eyebrow}</div><h1>${s.h1}</h1><div class="sub">${s.sub}</div>`;
  } else if(s.t==='statement'){
    inner = `${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<div class="big">${s.big}</div>`;
  } else if(s.t==='lead'){
    inner = `${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<h2>${s.h2}</h2>${(s.body||[]).map(p=>`<p class="body">${p}</p>`).join('')}`;
  } else if(s.t==='part'){
    inner = `<div class="kicker">${s.kicker}</div><div class="part-n">${s.n}</div><h2>${s.h2}</h2>`;
  } else if(s.t==='bold'){
    inner = `${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<h2>${s.h2}</h2><div class="bold-row">${s.cards.map(c=>`<div class="bold-card"><div class="l">${c.l}</div><div class="n">${c.n}</div><div class="d">${c.d}</div></div>`).join('')}</div>`;
  } else if(s.t==='cred'){
    inner = `${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<h2>${s.h2}</h2>${(s.body||[]).map(p=>`<p class="body">${p}</p>`).join('')}<div class="cred">${s.tags.map(t=>`<span>${t}</span>`).join('')}</div>`;
  } else if(s.t==='cta'){
    inner = `<div class="eyebrow">${s.eyebrow}</div><h2>${s.h2}</h2><p class="cta-steps">${s.steps}</p><div class="disc">${s.disc}</div>`;
  }
  const brand = `<div class="brandline">Jennifer Priest</div><div class="pager">${idx+1} / ${S.length}</div>`;
  return `<div class="slide" data-i="${idx}">${inner}${brand}</div>`;
}

stage.innerHTML = S.map((s,idx)=>slideHTML(s,idx)).join('');
const slides = [...stage.querySelectorAll('.slide')];
function show(n){ i=Math.max(0,Math.min(S.length-1,n)); slides.forEach((el,x)=>el.classList.toggle('on',x===i)); }
function go(d){ show(i+d); }
window.go = go;
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); });
stage.addEventListener('click',e=>{ if(!e.target.closest('.nav'))go(1); });
show(0);
</script>
</body>
</html>
