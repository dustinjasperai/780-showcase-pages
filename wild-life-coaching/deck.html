<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Coaching Business the WILD Way — Calvin Coyles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f8f6;      /* brand warm off-white */
    --panel:#eefcf5;   /* pale tint of brand green #01d893 */
    --ink:#0f131a;     /* brand dominant dark */
    --muted:#4a5560;
    --accent:#01d893;  /* brand vivid green */
    --accent2:#08c6bd; /* brand teal */
    --rule:rgba(15,19,26,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:#ffffff;border:1px solid var(--rule);border-radius:18px;padding:52px 56px;margin:22px 0;box-shadow:0 1px 0 rgba(15,19,26,.03),0 18px 40px -28px rgba(15,19,26,.35);aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .slide.tint{background:var(--panel)}
  .slide.dark{background:var(--ink);color:#f3f6f4}
  .slide.dark .kicker{color:var(--accent)}
  .slide.dark .muted{color:#aeb9bf}
  .kicker{font-family:'Montserrat';font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent2);margin:0 0 18px}
  h1{font-family:'Montserrat';font-weight:800;font-size:46px;line-height:1.05;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:'Montserrat';font-weight:700;font-size:32px;line-height:1.1;margin:0 0 16px;letter-spacing:-.01em}
  .lead{font-size:20px;line-height:1.5;color:var(--muted);margin:0 0 10px;max-width:40em}
  .big{font-family:'Montserrat';font-weight:700;font-size:30px;line-height:1.28;margin:0;max-width:24em}
  .big .a{color:var(--accent2);background:linear-gradient(transparent 62%, rgba(1,216,147,.28) 62%)}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{position:relative;padding:12px 0 12px 30px;font-size:19px;line-height:1.4;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .num{font-family:'Montserrat';font-weight:800;font-size:15px;color:var(--accent2);letter-spacing:.12em;margin-bottom:10px}
  .stage{display:flex;gap:14px;align-items:baseline;margin:0 0 6px}
  .stage b{font-family:'Montserrat';font-weight:800;font-size:22px}
  .foot{margin-top:auto;padding-top:22px;font-size:13px;color:var(--muted);font-family:'Montserrat';font-weight:600;letter-spacing:.04em}
  .cta-btn{display:inline-block;margin-top:14px;background:var(--accent);color:#04231a;font-family:'Montserrat';font-weight:700;font-size:18px;padding:14px 26px;border-radius:999px;text-decoration:none}
  .disc{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:18px;max-width:48em}
  .pill{display:inline-block;font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;margin-bottom:16px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:"A live masterclass with Calvin Coyles",
   h:"Build a Coaching Business the WILD Way",
   sub:"How to turn your calling into a $100K+ lifestyle coaching business by aligning who you are before you chase another tactic.",
   foot:"Wild Success"},

  {t:'list',
   kicker:"Who this is for",
   h:"You already feel the calling. The business has not caught up.",
   list:[
     "Aspiring coaches ready to start a real coaching, consulting or mentoring business from scratch.",
     "Coaches already working with clients but stuck on inconsistent, unpredictable revenue.",
     "Corporate professionals who want to leave the 9 to 5 for a high ticket lifestyle business."],
   foot:"Who this is for"},

  {t:'big',
   kicker:"The trap",
   big:"You were told the problem was your <span class='a'>funnel</span>. So you bought another tactic, another template, another course. And the revenue stayed just as unpredictable.",
   foot:"The trap"},

  {t:'reframe',
   kicker:"The reframe",
   h:"The bottleneck is not your strategy.",
   sub:"It is the gap between the business you say you want and the identity you are quietly running. Tactics cannot close a gap that lives inside the person using them.",
   foot:"The reframe"},

  {t:'part',
   num:"PART ONE",
   h:"Why most coaching businesses stall",
   sub:"Three internal barriers do more damage than any missing funnel.",
   foot:"Part One"},

  {t:'list',
   kicker:"Part One",
   h:"The three things that actually stall you",
   list:[
     "Self sabotage: you hesitate to charge, to sell, to be visible, right when it matters.",
     "Procrastination: busywork feels safer than the few moves that would move revenue.",
     "Perfectionism: the offer is never quite ready, so it never quite ships."],
   foot:"Part One"},

  {t:'big',
   kicker:"Part One",
   big:"A new tactic on top of an <span class='a'>old identity</span> produces a better looking business that still does not grow.",
   foot:"Part One"},

  {t:'part',
   num:"PART TWO",
   h:"The WILD Method",
   sub:"A mindset first, three stage path from a scattered effort to an aligned business. Vision, then Alignment, then Strategy, in that order.",
   foot:"Part Two"},

  {t:'stage',
   kicker:"The WILD Method",
   label:"Stage 1",
   title:"Vision",
   sub:"Define what success actually means to you, not a borrowed template of someone else's life. A vision you did not choose will never pull you through the hard parts.",
   foot:"WILD Method"},

  {t:'stage',
   kicker:"The WILD Method",
   label:"Stage 2",
   title:"Alignment",
   sub:"Examine whether your beliefs and identity support that vision, and clear what does not. This is the NLP work: rewire the self sabotage, the hesitation and the perfectionism before you scale them.",
   foot:"WILD Method"},

  {t:'stage',
   kicker:"The WILD Method",
   label:"Stage 3",
   title:"Strategy",
   sub:"Only now do you choose strategy, and you match it to how you actually think, decide and grow. Aligned strategy gets executed. Borrowed strategy gets abandoned.",
   foot:"WILD Method"},

  {t:'part',
   num:"PART THREE",
   h:"The WILD M.B.A.",
   sub:"The method becomes a business. A rock solid foundation, then a growth engine, then the support to keep it running.",
   foot:"Part Three"},

  {t:'list',
   kicker:"Part Three",
   h:"The growth engine, four moving parts",
   list:[
     "Marketing and Lead Gen: a repeatable way to put your work in front of the right people.",
     "Sales and Conversion: enrolment conversations that feel like service, not pressure.",
     "Delivery and Scaling: results clients can feel, delivered in a way that does not consume you.",
     "Mindset and Performance: the alignment work, kept alive as the business grows."],
   foot:"Part Three"},

  {t:'big',
   kicker:"Part Three",
   big:"Foundations first, then the engine, then a <span class='a'>WILD A.I business coach</span> in your corner between sessions. Structure, not scramble.",
   foot:"Part Three"},

  {t:'list',
   kicker:"Inside a WILD business",
   h:"A WILD business, running the way you meant it to",
   list:[
     "Predictable enrolments instead of feast and famine months.",
     "Premium pricing you can hold, because the identity holding it is settled.",
     "A calmer week, because strategy fits how you work rather than fighting it."],
   foot:"Inside a WILD business"},

  {t:'reframe',
   kicker:"Why me",
   h:"Calvin Coyles",
   sub:"NLP trainer and personal transformation coach, author of WILD Success, and host of The Wild Success Show. I have spent years helping driven people align identity to vision, and built Wild Success into an eight figure personal development company doing exactly that.",
   foot:"Why me"},

  {t:'big',
   kicker:"The recap",
   big:"Vision tells you where. Alignment makes you the person who can go there. <span class='a'>Strategy</span> is what you do once those two agree.",
   foot:"The recap"},

  {t:'cta',
   kicker:"Your next step",
   h:"Build yours the WILD way",
   sub:"If you want to turn your calling into a $100K+ lifestyle coaching business, apply for the WILD M.B.A. and book a strategy call with the Wild Success team. We will map your Vision, your Alignment and your first Strategy moves together.",
   btn:"Apply for the WILD M.B.A.",
   disc:"This masterclass is educational and is not financial or business advice. No specific income or result is guaranteed. Results vary based on your effort, your market and your circumstances.",
   foot:"Wild Success"}
];

function esc(x){return x==null?'':x}
function render(){
  const root=document.getElementById('deck');
  root.innerHTML=S.map(s=>{
    if(s.t==='title') return `<section class="slide tint"><p class="kicker">${esc(s.kicker)}</p><h1>${esc(s.h)}</h1><p class="lead">${esc(s.sub)}</p><div class="foot">${esc(s.foot)}</div></section>`;
    if(s.t==='part') return `<section class="slide dark"><p class="num">${esc(s.num)}</p><h1>${esc(s.h)}</h1><p class="lead muted">${esc(s.sub)}</p><div class="foot">${esc(s.foot)}</div></section>`;
    if(s.t==='big') return `<section class="slide"><p class="kicker">${esc(s.kicker)}</p><p class="big">${esc(s.big)}</p><div class="foot">${esc(s.foot)}</div></section>`;
    if(s.t==='reframe') return `<section class="slide tint"><p class="kicker">${esc(s.kicker)}</p><h2>${esc(s.h)}</h2><p class="lead">${esc(s.sub)}</p><div class="foot">${esc(s.foot)}</div></section>`;
    if(s.t==='stage') return `<section class="slide"><p class="kicker">${esc(s.kicker)}</p><div class="stage"><span class="pill">${esc(s.label)}</span></div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.sub)}</p><div class="foot">${esc(s.foot)}</div></section>`;
    if(s.t==='list') return `<section class="slide"><p class="kicker">${esc(s.kicker)}</p><h2>${esc(s.h)}</h2><ul>${s.list.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><div class="foot">${esc(s.foot)}</div></section>`;
    if(s.t==='cta') return `<section class="slide tint"><p class="kicker">${esc(s.kicker)}</p><h1>${esc(s.h)}</h1><p class="lead">${esc(s.sub)}</p><a class="cta-btn" href="https://business.wildsuccess.com/">${esc(s.btn)}</a><p class="disc">${esc(s.disc)}</p><div class="foot">${esc(s.foot)}</div></section>`;
    return '';
  }).join('');
}
render();
</script>
</body>
</html>
