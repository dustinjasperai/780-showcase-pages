<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mental Load, Out of Your Head — a Mockingbird Learning masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fefbf6;      /* her cream ground */
  --panel:#f6efe4;   /* a hair deeper warm off-white */
  --rule:#e4d9c7;
  --ink:#281a1a;     /* her warm near-black */
  --slate:#1f3141;   /* her H1 slate */
  --accent:#b35532;  /* her terracotta — 14 uses in brand.json */
  --muted:#6f6058;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Lato",system-ui,sans-serif;line-height:1.5}
.deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
.slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.slide .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:900;margin-bottom:18px}
.slide h1{font-family:"Libre Baskerville",Georgia,serif;font-weight:700;color:var(--slate);font-size:46px;line-height:1.12;letter-spacing:-.01em}
.slide h2{font-family:"Libre Baskerville",Georgia,serif;font-weight:700;color:var(--slate);font-size:34px;line-height:1.18;margin-bottom:14px}
.slide p{font-size:20px;color:var(--ink);margin-top:14px;max-width:46ch}
.slide p.lead{font-size:23px}
.slide .big{font-family:"Libre Baskerville",Georgia,serif;font-size:40px;color:var(--accent);line-height:1.2;font-weight:700}
.slide ul{margin:18px 0 0 0;list-style:none}
.slide li{font-size:20px;padding:12px 0 12px 34px;border-bottom:1px solid var(--rule);position:relative}
.slide li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:2px}
.slide .two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.col{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:24px}
.col h3{font-family:"Libre Baskerville",serif;color:var(--slate);font-size:22px;margin-bottom:8px}
.col p{font-size:17px;margin-top:6px}
.slide.cover{background:var(--slate);border-color:var(--slate)}
.slide.cover .kick{color:#e9b9a6}
.slide.cover h1{color:#fefbf6;font-size:52px}
.slide.cover p{color:#e7ddd2}
.slide.dark{background:var(--ink);border-color:var(--ink)}
.slide.dark h1,.slide.dark h2{color:#fefbf6}
.slide.dark p{color:#e7ddd2}
.slide.accent{background:var(--accent);border-color:var(--accent)}
.slide.accent h1,.slide.accent h2{color:#fff}
.slide.accent p{color:#fde9e1}
.num{position:absolute;top:22px;right:28px;font-size:13px;color:var(--muted);letter-spacing:.1em}
.step{font-family:"Libre Baskerville",serif;font-size:60px;color:var(--accent);opacity:.25;position:absolute;top:28px;left:40px}
.cta-box{margin-top:26px;padding:22px 24px;background:var(--panel);border:1px solid var(--rule);border-radius:12px}
.cta-box .act{font-family:"Libre Baskerville",serif;font-size:24px;color:var(--slate)}
.disc{font-size:14px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.5}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'cover', cls:'cover', html:`<div class="kick">A Mockingbird Learning masterclass</div><h1>The Mental Load, Out of Your Head</h1><p class="lead">How to stop being the only one who remembers everything, without adding one more thing to your list.</p>`},

  {t:'who', html:`<div class="kick">Who this is for</div><h2>You run the home in your head.</h2><p>You are the one who remembers the dentist, the gift, the permission slip, the thing that is almost out. You have tried the apps, the lists, the "just ask me and I will help." And somehow it is all still yours.</p><p>This hour is for the woman who is tired of managing the help.</p>`},

  {t:'trap', cls:'dark', html:`<div class="kick">The trap</div><h2>"Just tell me what to do."</h2><p>It sounds like help. But if you have to notice it, hold it, and hand it out, you still own it. Delegating tasks does not share the load. It just makes you the manager of it.</p>`},

  {t:'reframe', cls:'accent', html:`<div class="kick">The reframe</div><h1>It was never about the dishes.</h1><p>The imbalance is not a chore problem. It is a system problem, built on a double standard about whose job the home is. Fix the chore list and it grows back. Fix the system and it stays shared.</p>`},

  {t:'part', html:`<span class="step">Part One</span><div class="kick">Part one</div><h1>Why the load stays invisible.</h1><p>Before you can share it, you both have to be able to see it. Most couples are only ever arguing about half of it.</p>`},

  {t:'halves', html:`<div class="kick">The load has two halves</div><h2>Cognitive labor and emotional labor.</h2><div class="two"><div class="col"><h3>Cognitive</h3><p>Managing tasks, planning ahead, coordinating, remembering the details. The running to-do list that never ends.</p></div><div class="col"><h3>Emotional</h3><p>Caring for the emotional life of the home. Anticipating needs, soothing hurt feelings, keeping the peace.</p></div></div><p>Couples split chores and wonder why it still feels uneven. The second half never got named.</p>`},

  {t:'list', html:`<div class="kick">The running list</div><h2>Every cross-off makes a new one.</h2><p>If your list never ends, that is because it cannot. The list is not a system for sharing the load. It is a record that you are still carrying it. We will replace it with something that does not live in one person's head.</p>`},

  {t:'test', cls:'dark', html:`<div class="kick">A simple test</div><h1>Could you leave for a week?</h1><p>If you had to drop everything and go for seven days, would your partner know how to keep it all running? The gap between "yes" and "no" is the size of the load you are carrying alone.</p>`},

  {t:'whytips', html:`<div class="kick">Why tips fail</div><h2>You do not need another tip.</h2><p>Tips manage the load for a week. Then life gets busy and it all slides back to you, because nothing underneath it changed. We are not here to help you cope better. We are here to get rid of the double standard so it does not come back.</p>`},

  {t:'part2', html:`<span class="step">Part Two</span><div class="kick">Part two</div><h1>The method: awareness, responsibility, systems.</h1><p>Three moves, in this order. Skip the first and the rest will not hold.</p>`},

  {t:'p1', html:`<div class="kick">Move one</div><h2>Shared awareness.</h2><p>You both see the whole load, both halves, exactly as it is distributed today, and you name the impact out loud. No blame, no scorekeeping. Just the first honest picture of who is actually carrying what.</p>`},

  {t:'p2', html:`<div class="kick">Move two</div><h2>Shared responsibility.</h2><p>Ownership, not help. When your partner owns a domain, they own the noticing and the remembering too, not just the doing when asked. This is where the double standard gets dismantled, piece by piece.</p>`},

  {t:'p3', html:`<div class="kick">Move three</div><h2>Shared systems.</h2><p>You build a way of running the home that does not depend on your memory. Systems that anyone can pick up, so the load has somewhere to live other than your head. Sustainable, not heroic.</p>`},

  {t:'root', cls:'accent', html:`<div class="kick">The difference</div><h1>We start at the root.</h1><p>Most help starts with the chore list. We start with why it was not shared in the first place. Get the system and the double standard right, and the chores take care of themselves.</p>`},

  {t:'part3', html:`<span class="step">Part Three</span><div class="kick">Part three</div><h1>What a shared home feels like.</h1><p>Not a perfectly even ledger. A home where the weight of running it does not sit on one person by default.</p>`},

  {t:'after', html:`<div class="kick">On the other side</div><h2>The head finally goes quiet.</h2><ul><li>You are not the only one who knows how it all works</li><li>Help you did not have to ask for</li><li>Fewer silent resentments, fewer "I did not know"s</li><li>Time and attention back for what is actually yours</li></ul>`},

  {t:'why', html:`<div class="kick">Why me</div><h2>A lawyer, a writer, and a mother.</h2><p>I am Kelsey Baker. I write Mockingbird Musings on the laws, the policies, and the patriarchal systems that shape women's lives at home and at work. I bring that same systems lens to the mental load, which is why my work starts where the imbalance actually begins.</p>`},

  {t:'cta', cls:'cta', html:`<div class="kick">Your next step</div><h1>Ready to get it out of your head?</h1><p>If this is the work you want to do, my four-week program, Mental Load in Balance, walks you and your partner through all three moves, step by step.</p><div class="cta-box"><div class="act">Join Mental Load in Balance &rarr; mockingbirdlearning.com</div></div><p class="disc">Educational only. Every home is different and results vary from couple to couple. No specific outcome, relationship result, or timeline is guaranteed.</p>`}
];

const d=document.getElementById('deck')
S.forEach((s,i)=>{
  const el=document.createElement('section')
  el.className='slide'+(s.cls?' '+s.cls:'')
  el.innerHTML=(i>0?'<span class="num">'+(i+1)+' / '+S.length+'</span>':'')+s.html
  d.appendChild(el)
})
</script>
</body>
</html>
