<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Give Away Your Legos — a masterclass with Molly Graham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3f0;
    --panel:#fdfcfa;
    --rule:#e2dcd4;
    --ink:#222222;
    --accent:#1921e4;
    --accent2:#52c18e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Instrument Sans',system-ui,Arial,sans-serif;
    font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .deck{max-width:960px;margin:0 auto;padding:24px 20px 80px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:18px;
    padding:56px 52px;
    margin:20px 0;
    min-height:70vh;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    scroll-snap-align:start;
  }
  .kick{
    font-family:'Instrument Sans';font-weight:600;font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    margin-bottom:18px;
  }
  h1,h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;line-height:1.05;color:var(--ink)}
  h1{font-size:clamp(42px,7vw,76px)}
  h2{font-size:clamp(30px,4.6vw,50px)}
  .sub{font-size:clamp(18px,2.4vw,23px);color:#4a4a4a;margin-top:22px;max-width:44ch}
  .body{font-size:clamp(17px,2vw,20px);color:#3a3a3a;margin-top:20px;max-width:56ch}
  ul{margin:26px 0 0;padding:0;list-style:none;max-width:60ch}
  li{position:relative;padding:14px 0 14px 42px;border-top:1px solid var(--rule);font-size:clamp(16px,1.9vw,19px)}
  li:first-child{border-top:none}
  li b{color:var(--ink)}
  li::before{
    content:"";position:absolute;left:0;top:18px;width:16px;height:16px;
    border-radius:4px;background:var(--accent);
  }
  li:nth-child(even)::before{background:var(--accent2)}
  .num{
    position:absolute;top:26px;right:34px;font-family:'Instrument Serif';font-style:italic;
    font-size:19px;color:#b8afa4;
  }
  .lede{font-family:'Instrument Serif';font-style:italic;font-size:clamp(24px,3.4vw,38px);line-height:1.25;color:var(--ink);max-width:24ch}
  .phase{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
  .phase div{flex:1 1 180px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:18px 20px}
  .phase span{display:block;font-family:'Instrument Serif';font-size:26px;color:var(--accent)}
  .phase p{font-size:15px;color:#4a4a4a;margin-top:6px}
  .cta{background:var(--ink);border-color:var(--ink)}
  .cta .kick{color:var(--accent2)}
  .cta h2,.cta .body{color:#f7f3f0}
  .btn{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;
    font-family:'Instrument Sans';font-weight:600;font-size:18px;text-decoration:none;
    padding:16px 30px;border-radius:10px}
  .disclaimer{margin-top:34px;font-size:13px;color:#9a9a9a;max-width:60ch;line-height:1.5}
  .brandline{text-align:center;color:#b8afa4;font-size:13px;margin-top:10px;font-family:'Instrument Sans'}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="brandline">Glue Club &middot; glueclub.com</div>
<script>
const S = [
  {t:'title', k:'A Glue Club masterclass', h:'Give Away Your Legos', sub:'How to scale yourself, and your team, through hypergrowth without holding on so tight that you slow the whole thing down.'},

  {t:'who', k:'Who this is for', h:'You are leading through fast growth.', body:'You run a function at a company that is doubling, or about to. The team you knew by name is now a team you barely recognize. The work that made you great is the work you can no longer do yourself, and nobody handed you a manual for that.'},

  {t:'trap', k:'The trap', h:'So you hold on tighter.', body:'When things speed up, the instinct is to grab more Legos, review more work, and stay in every decision. It feels responsible. It is the single most common way strong leaders quietly become the bottleneck of the company they are trying to grow.'},

  {t:'reframe', k:'The reframe', lede:'Your job inside a scaling company is to make yourself irrelevant as fast as possible.'},

  {t:'section', k:'Part one', h:'Why scaling breaks the people who are best at their jobs.'},

  {t:'point', k:'The pile of Legos', h:'Growth is a pile of Legos.', body:'Picture the company as one giant pile of Legos. Early on you are holding a huge share of them. Every time the company grows, someone new arrives, and the only way to make room is to hand some of your Legos to them. It looks like loss. It is actually how you get to build the bigger thing.'},

  {t:'point', k:'The counter-intuitive math', h:'More people does not mean less work for you.', body:'Adding people does not shrink your pile so you can coast. It means the entire company can do more, and it means your job has to change every few months. If you want to grow as fast as the company, you have to give away your job on that same clock.'},

  {t:'point', k:'The part nobody warns you about', h:'The hard part is emotional.', body:'Handing off the work you are proud of triggers real grief, real anxiety, and a quiet fear that you are becoming unnecessary. That monster never fully goes away. The skill is not eliminating it, it is naming it, normalizing it for your team, and moving anyway.'},

  {t:'section', k:'Part two', h:'The framework: how to actually give away your Legos.'},

  {t:'pillars', k:'Four moves', h:'What giving away your Legos looks like in practice.', pts:[
    '<b>Give away your job every few months.</b> Treat your role as something you are constantly training someone else to do. If you are irreplaceable, you are stuck.',
    '<b>Manage the what, not the how.</b> Set the outcome, name one clear owner, and let them find the path. Controlling how work gets done only makes the company slower.',
    '<b>Redefine the job as making people better.</b> Management is not hoarding answers or power. It is convening the right people and developing them so the pile keeps getting built without you.',
    '<b>Build your peer bench on purpose.</b> The role gets lonely as your internal peers disappear. The leaders who last deliberately build a support network outside their own walls.'
  ]},

  {t:'phases', k:'The map', h:'Every phase of scale breaks differently.', body:'What you do has to change at each threshold. Most leadership advice ignores that these are different jobs.'},

  {t:'point', k:'Hiring is compounding', h:'The first 100 hires define the next 200.', body:'Early hires are the strongest predictor of every hire after them. High performers refer high performers, and weak ones quietly reset the bar downstream. Who you let in early is the culture, long before any values deck says so.'},

  {t:'point', k:'Decisions as experiments', h:'Trade certainty for speed.', body:'You will never have perfect information at this pace. Treat the big calls as experiments you learn from, communicate honest doubt when you have it, and keep the organization moving instead of waiting to be sure.'},

  {t:'section', k:'Part three', h:'What changes when you get this right.'},

  {t:'point', k:'The payoff', h:'A calm operator, and a team that compounds.', body:'When you give away your Legos on purpose, the work outgrows you in the best way. People around you get visibly better, decisions stop routing through you, and you get your attention back for the bigger problems only you can see. The company speeds up because you let go, not in spite of it.'},

  {t:'why', k:'Why me', h:'I have done this at the deep end.', body:'My team at Google went from about 25 to 125 in nine months. I spent four-plus years at Facebook as it grew from around 500 people to over 5,500. I helped build Quip, and led operations through scale after that. I am not teaching theory. I am teaching what I had to learn, painfully, in real time.'},

  {t:'bridge', k:'Where we go deep', h:'This is the work inside Glue Club.', body:'Glue Club is a community of mid-career leaders navigating exactly this: rapid scale, change, and the emotional weight that comes with it. Live sessions, peer circles, and coaching, so you are not doing the hardest job of your career alone.'},

  {t:'cta', k:'Your next step', h:'Come build with us.', body:'If you are in the middle of scaling yourself and your team, apply to join the next Glue Club new-member group. You will get the frameworks, the peers, and the room to figure out your next hand-off before it becomes a crisis.', btn:'Apply to Glue Club', disc:'This masterclass is educational. No specific career, hiring, or business result is guaranteed. Results vary and depend on your own situation and effort.'}
];

const P = [
  {n:'30-50', d:'From a family to a company. The way you all worked stops scaling.'},
  {n:'50-200', d:'Foundation phase. Hiring quality becomes the whole game.'},
  {n:'200-750', d:'The growth spurt. It demands more mature, less hands-on leadership.'},
  {n:'750+', d:'Identity shifts from the whole company to your team.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'cta' ? ' cta' : '');
  let html = '';
  if (s.k) html += '<div class="kick">' + s.k + '</div>';
  if (s.h && (s.t === 'title')) html += '<h1>' + s.h + '</h1>';
  else if (s.h) html += '<h2>' + s.h + '</h2>';
  if (s.lede) html += '<p class="lede">' + s.lede + '</p>';
  if (s.sub) html += '<p class="sub">' + s.sub + '</p>';
  if (s.body) html += '<p class="body">' + s.body + '</p>';
  if (s.pts) {
    html += '<ul>';
    s.pts.forEach(p => html += '<li>' + p + '</li>');
    html += '</ul>';
  }
  if (s.t === 'phases') {
    html += '<div class="phase">';
    P.forEach(p => html += '<div><span>' + p.n + '</span><p>' + p.d + '</p></div>');
    html += '</div>';
  }
  if (s.btn) html += '<a class="btn" href="https://glueclub.com/application">' + s.btn + '</a>';
  if (s.disc) html += '<p class="disclaimer">' + s.disc + '</p>';
  if (s.t !== 'title' && s.t !== 'cta') html += '<div class="num">' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
