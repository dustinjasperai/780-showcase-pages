<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Your First (Or Next) 100 Members — A Live Masterclass with Elizabeth Henson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f1ee;      /* brand cream (brand.json) */
    --panel:#ffffff;   /* warm white */
    --ink:#363636;     /* brand charcoal (dominant) */
    --muted:#676767;   /* brand grey */
    --accent:#656f59;  /* brand sage */
    --tint:#f6d0b8;    /* brand peach highlight */
    --rule:#dcdad3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Roboto",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:48px 20px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(54,54,54,.03)}
  .eyebrow{font-family:"Roboto";font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Italiana",serif;font-weight:400;font-size:62px;line-height:1.04;letter-spacing:.01em;margin-bottom:20px}
  h2{font-family:"Italiana",serif;font-weight:400;font-size:40px;line-height:1.1;margin-bottom:22px}
  p{font-size:20px;line-height:1.6;color:var(--ink);max-width:68ch;margin-bottom:16px}
  p.muted{color:var(--muted)}
  .lead{font-size:24px;line-height:1.5}
  .tag{display:inline-block;background:var(--tint);color:var(--ink);font-weight:500;font-size:15px;padding:6px 14px;border-radius:999px;margin-top:8px}
  ul{list-style:none;margin:10px 0 0}
  li{position:relative;font-size:20px;line-height:1.5;padding:12px 0 12px 34px;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .steps li:before{background:transparent;border:2px solid var(--accent);top:17px}
  .num{font-family:"Italiana",serif;color:var(--accent);font-size:22px;margin-right:10px}
  .title-slide{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .title-slide h1{color:var(--bg)}
  .title-slide .eyebrow{color:var(--tint)}
  .title-slide p{color:#e9e7e1}
  .present{margin-top:30px;font-size:18px;color:#cfccc4}
  .present b{color:var(--bg);font-weight:500}
  .big{font-family:"Italiana",serif;font-size:46px;line-height:1.12;margin-bottom:18px}
  .foot{font-size:14px;color:var(--muted);margin-top:26px;max-width:70ch}
  .cta-slide{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cta-slide h2{color:#fff}
  .cta-slide p{color:#eef0ea}
  .cta-btn{display:inline-block;margin-top:14px;background:#fff;color:var(--accent);font-weight:700;font-size:19px;padding:15px 30px;border-radius:8px;text-decoration:none}
  .pill{font-size:14px;color:var(--muted);letter-spacing:.04em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass', h1:'Get Your First (Or Next) 100 Members',
   sub:'The community-based marketing method for creative entrepreneurs who want marketing to feel easy again.',
   present:'Elizabeth Henson &middot; Host of The Messy Success Podcast'},

  {t:'promise', eyebrow:'What you will walk away with', h2:'By the end of this hour you will have a plan, not a to-do list',
   bullets:[
     'The one shift that turns a quiet audience into an active, buying community',
     'My five-step method for growing your next 100 engaged members',
     'How to make brand, marketing, sales and impact work together instead of pulling against each other']},

  {t:'who', eyebrow:'Who this is for', h2:'This is for you if you are building something real',
   bullets:[
     'Coaches, creatives and service providers with a group, list or podcast',
     'Membership and community owners who want deeper engagement, not just more followers',
     'Busy entrepreneurs who are done chasing the algorithm and want a calmer way to grow']},

  {t:'trap', eyebrow:'The trap', h2:'You have been told growth is a volume problem',
   lead:'So you post more, add another funnel, buy another course of systems. The work piles up and the engagement stays flat. It is exhausting, and it quietly tells you that you are the problem.',
   tag:'You are not the problem. The approach is.'},

  {t:'reframe', eyebrow:'The reframe', big:'You do not have a traffic problem. You have a community problem.',
   body:'Attention you rent disappears the moment you stop paying for it. A community you build keeps showing up, keeps talking, and keeps bringing the next person in. Community is not one more task on the list. It is a way of being.'},

  {t:'part', label:'Part One', h2:'Why renting attention keeps you stuck'},

  {t:'body', eyebrow:'Part One', h2:'The feed is designed to keep you renting',
   lead:'Every platform wants you dependent on it. More reach next month means more posting, more spend, more chasing. Nothing compounds, because you never actually own the relationship with the person on the other side.',
   bullets:[
     'Reach resets to zero the week you go quiet',
     'A like is not a relationship, and a follower is not a member',
     'The people most likely to buy from you are strangers to each other']},

  {t:'body', eyebrow:'Part One', h2:'An engaged community compounds',
   lead:'When people feel they belong somewhere, they stay, they talk to each other, and they invite the next person in. That is marketing that gets easier over time instead of harder.',
   tag:'The communities I run hold around 60% active engagement.'},

  {t:'part', label:'Part Two', h2:'The community-based marketing method'},

  {t:'body', eyebrow:'Part Two', h2:'The four keys of an easy, profitable business',
   lead:'Most growth advice fixes one key and ignores the rest. The method is to align all four so they pull in the same direction.',
   bullets:[
     'Brand, so the right people recognise themselves in you',
     'Marketing, so the community grows without you grinding',
     'Sales, so belonging turns into enrolling, naturally',
     'Impact, so the results keep the community alive']},

  {t:'steps', eyebrow:'Part Two', h2:'My five-step growth method',
   steps:[
     'Get clear on one community goal, not ten',
     'Build the action plan that fits the season you are in',
     'Engage with intention every day, in small repeatable ways',
     'Turn that engagement into real business impact',
     'Celebrate the win, then run it again']},

  {t:'body', eyebrow:'Part Two', h2:'Inspired action beats more to-do lists',
   lead:'This is not about doing more. It is about doing the few things that build belonging, consistently, from your true voice. Messy and real will always out-grow polished and distant.',
   tag:'Progress over polish. That is messy success.'},

  {t:'part', label:'Part Three', h2:'Your next 100 members, in real life'},

  {t:'body', eyebrow:'Part Three', h2:'From quiet audience to active community',
   lead:'Picture your next 100 members arriving already warm: they found you, they felt the room, they engaged before you ever asked for anything. By the time you make an offer, they are leaning in.',
   bullets:[
     'A community that welcomes and sells for you',
     'Members who refer the next members',
     'Launches that feel like invitations, not pushes']},

  {t:'body', eyebrow:'Why me', h2:'I have been doing this in the open for years',
   lead:'I host The Messy Success Podcast with more than 220 episodes, I run communities at around 60% active engagement, and I have guided entrepreneurs to book out their services and grow communities that keep paying them back. I teach exactly what I do.',
   tag:'Community-based marketing and leadership'},

  {t:'cta', eyebrow:'Your next step', h2:'Let us build your next 100 members together',
   body:'If this is the way you want to grow, the Community Growth Lab is where we do it step by step, with my method and my support. Book a quick call and we will map your community plan.',
   btn:'Book a call',
   foot:'This masterclass is educational. No income or result is guaranteed. Results vary from person to person and depend on your own work.'}
];

const deck = document.getElementById('deck');
function esc(x){return (x||'')}
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide';
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.t==='title'){
    d.classList.add('title-slide');
    h+=`<h1>${esc(s.h1)}</h1><p class="lead">${esc(s.sub)}</p><div class="present"><b>${esc(s.present)}</b></div>`;
  } else if(s.t==='part'){
    h=`<div class="eyebrow">${esc(s.label)}</div><h2>${esc(s.h2)}</h2>`;
  } else if(s.t==='reframe'){
    h+=`<div class="big">${esc(s.big)}</div><p>${esc(s.body)}</p>`;
  } else if(s.t==='cta'){
    d.classList.add('cta-slide');
    h+=`<h2>${esc(s.h2)}</h2><p>${esc(s.body)}</p><a class="cta-btn" href="#">${esc(s.btn)}</a>`
      +`<p class="foot" style="color:#eef0ea">${esc(s.foot)}</p>`;
  } else {
    if(s.h1) h+=`<h1>${esc(s.h1)}</h1>`;
    if(s.h2) h+=`<h2>${esc(s.h2)}</h2>`;
    if(s.big) h+=`<div class="big">${esc(s.big)}</div>`;
    if(s.lead) h+=`<p class="lead">${esc(s.lead)}</p>`;
    if(s.body) h+=`<p>${esc(s.body)}</p>`;
    if(s.steps){h+='<ul class="steps">';s.steps.forEach((x,i)=>h+=`<li><span class="num">${i+1}</span>${esc(x)}</li>`);h+='</ul>';}
    if(s.bullets){h+='<ul>';s.bullets.forEach(x=>h+=`<li>${esc(x)}</li>`);h+='</ul>';}
    if(s.tag) h+=`<div><span class="tag">${esc(s.tag)}</span></div>`;
  }
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
