<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your First 100 Members — A Masterclass with Elizabeth Henson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ece7dd;        /* her warm cream, deepened to a sand ground */
    --panel:#faf8f3;     /* warm off-white panel */
    --ink:#363636;       /* her charcoal */
    --muted:#676767;     /* her grey */
    --accent:#656f59;    /* her sage */
    --soft:#f6d0b8;      /* her blush, soft-fill only */
    --rule:#d9d6cf;
    --display:'Italiana', serif;
    --body:'Roboto', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(54,54,54,.02);
  }
  .eyebrow{font-family:var(--body);font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:400;font-size:56px;line-height:1.05;letter-spacing:.01em}
  h2{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.1;margin-bottom:18px}
  h3{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin-bottom:14px}
  p{font-size:19px;line-height:1.65;color:var(--ink);max-width:62ch;margin-bottom:16px}
  p.lead{font-size:22px;color:var(--muted)}
  .sub{font-size:20px;color:var(--muted);margin-top:14px;max-width:60ch}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:64ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:20px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .cover{align-items:flex-start}
  .cover h1{font-size:68px;margin-bottom:10px}
  .byline{margin-top:28px;font-size:16px;letter-spacing:.04em;color:var(--muted)}
  .byline strong{color:var(--ink);font-weight:500}
  .part .kicker{font-family:var(--body);font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--muted);margin-bottom:12px}
  .part h2{font-size:48px}
  .big{font-family:var(--display);font-size:46px;line-height:1.12;max-width:20ch}
  .rings{display:flex;gap:10px;margin-top:26px;align-items:center}
  .ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
  .ring.fill{background:var(--accent)}
  .stepno{font-family:var(--display);font-size:22px;color:var(--accent);margin-bottom:6px}
  .quote{font-family:var(--display);font-size:38px;line-height:1.25;max-width:24ch}
  .soft-chip{display:inline-block;background:var(--soft);color:var(--ink);font-weight:400;
    padding:4px 14px;border-radius:999px;font-size:14px;letter-spacing:.03em;margin-bottom:22px}
  .disc{margin-top:26px;font-size:14px;color:var(--muted);max-width:66ch;line-height:1.5}
  .cta-line{font-family:var(--display);font-size:30px;color:var(--accent);margin-top:18px}
  .pagefoot{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);padding:14px;background:linear-gradient(180deg,rgba(242,241,238,0),var(--bg) 60%)}
  @media (max-width:640px){
    .slide{padding:36px 26px}
    h1{font-size:40px}.cover h1{font-size:46px}h2{font-size:30px}.part h2{font-size:34px}.big,.quote{font-size:30px}
    p,li{font-size:17px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="pagefoot" id="foot">Community-Based Marketing &middot; Elizabeth Henson</div>
<script>
const S = [
  {t:'cover', eyebrow:'A Free Masterclass', h1:'Your First 100 Members',
   sub:'How creative entrepreneurs grow with community-based marketing, not the algorithm.',
   byline:'With <strong>Elizabeth Henson</strong> &middot; Host of the Messy Success Podcast'},

  {t:'who', eyebrow:'Who this is for', h2:'This is for you if',
   items:[
     'You are a creative entrepreneur pouring hours into content and getting crickets back.',
     'You know word of mouth sells your work better than any ad ever could.',
     'You want people to rave about your business so you do not have to.',
     'You are ready to build something that keeps growing while you sleep.']},

  {t:'trap', eyebrow:'The trap', big:'You post every day. The algorithm decides who sees it. Usually almost no one.',
   sub:'So you post more. Louder. More often. And the treadmill never stops, because you never actually owned the audience in the first place.'},

  {t:'reframe', soft:'The real problem', quote:'You do not have a content problem. You have a community problem.',
   sub:'Content rents you attention. A community owns it. One of those compounds.'},

  {t:'part', kicker:'Part One', h2:'Renting attention versus owning it',
   sub:'Why working harder on the feed keeps you stuck.'},

  {t:'body', h3:'The algorithm is a landlord',
   p:'Every post is rent you pay for a few minutes of borrowed reach. Stop paying and the reach disappears. You can do everything right and still start from zero tomorrow, because the platform owns the relationship, not you.',
   p2:'That is why the most consistent creators still feel like they are shouting into a void. The model is the problem, not the effort.'},

  {t:'body', h3:'More content is not the answer',
   p:'When reach drops, the instinct is to make more. But volume feeds the same borrowed system. The creators who break out stop trying to win the feed and start gathering their people into a space they actually control.',
   p2:'A hundred people who know you, trust you, and talk to each other will out-earn ten thousand passive followers every time.'},

  {t:'part', kicker:'Part Two', h2:'Community-Based Marketing',
   sub:'The method behind the growth.'},

  {t:'reframe', soft:'The philosophy', quote:'Building community is not a to-do list. It is a way of being.',
   sub:'When your marketing is relationship, selling stops feeling like selling. The community does the convincing for you.'},

  {t:'framework', eyebrow:'The 5-step framework', h2:'Grow and lead a profitable community',
   sub:'The same path inside the Community Growth Lab. Five moves, in order, so marketing finally feels easy.',
   items:[
     'Set the foundation: who you gather and the one outcome you lead them toward.',
     'Optimize the space so it brings in the right people on its own.',
     'Fuel it with content and a newsletter that pull people in and keep them close.',
     'Lead and nurture so members show up, contribute, and stay.',
     'Turn engagement into offers, so the community becomes revenue.']},

  {t:'step', no:'Step 02', h3:'Build a space that works without you',
   p:'Most groups are ghost towns because they were set up as a billboard, not a lead engine. We rebuild yours so the welcome, the prompts, and the pathways quietly turn a browser into a member and a member into a buyer, every single day.'},

  {t:'step', no:'Step 03', h3:'Content and newsletter that pull people in',
   p:'You do not need to post more. You need the right few things that give people a reason to join, a reason to stay, and a reason to tell a friend. We pair an owned newsletter with simple community content so your growth is never at the mercy of one platform again.'},

  {t:'step', no:'Step 04', h3:'Lead, so the community leads itself',
   p:'A healthy community has rhythm: rituals, recognition, and conversations that happen whether or not you are online. That is what takes you from running a group to leading a movement, and it is what makes the whole thing feel light instead of heavy.'},

  {t:'milestone', eyebrow:'The threshold', big:'Your first 100 members',
   sub:'A hundred engaged people is the tipping point. Below it you are pushing. Above it the community starts to carry its own momentum, and referrals start doing the marketing for you.',
   rings:true},

  {t:'body', h3:'How the first 100 come fast',
   p:'There are simple short-term moves that fill a new community in under a week, and long-term habits that keep it growing for years. You use both. The sprint gets you to critical mass. The system keeps you there.',
   p2:'That is the difference between a launch that spikes and fades and a community that compounds.'},

  {t:'part', kicker:'Part Three', h2:'When your community becomes the engine',
   sub:'What changes once the room is full and warm.'},

  {t:'body', h3:'One engine, many doors',
   p:'An engaged community does not sell one thing. It supports memberships, programs, products, and launches, all from the same warm room of people who already trust you. Diverse revenue stops being a scramble and starts being a natural next yes.',
   p2:'This is marketing that keeps working while you sleep, because it runs on relationship, not reach.'},

  {t:'why', eyebrow:'Why me', h3:'I built my business on this',
   p:'I am Elizabeth Henson, host of the Messy Success Podcast and the founder of the Community Growth Lab. I have helped creative entrepreneurs and million-dollar brands grow engaged communities that book out their services and multiply their revenue, by being real and building community on purpose.',
   p2:'Community-based marketing is not a tactic I picked up. It is how I grew, and it is what I teach.'},

  {t:'recap', eyebrow:'The one idea', quote:'Stop feeding the algorithm. Build the community.',
   sub:'Own your audience, lead it well, and your marketing compounds instead of resetting every morning.'},

  {t:'cta', eyebrow:'Your next step', h2:'Let us build your community',
   p:'If you are ready to grow with community-based marketing instead of fighting the feed, the Community Growth Lab is where we do it together: the 5-step framework, the templates, and the coaching to get you to your first 100 and beyond.',
   ctaLine:'Book a call or join the Community Growth Lab.',
   disc:'Educational content only. Results depend on your own effort, offer, and market; nothing here is a guarantee of income or specific outcomes.'}
];

const deck = document.getElementById('deck');
function esc(s){return s==null?'':s;}
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let h = '';
  if(s.eyebrow) h += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.soft) h += `<span class="soft-chip">${esc(s.soft)}</span>`;
  if(s.kicker) h += `<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.h1) h += `<h1>${esc(s.h1)}</h1>`;
  if(s.h2) h += `<h2>${esc(s.h2)}</h2>`;
  if(s.no) h += `<div class="stepno">${esc(s.no)}</div>`;
  if(s.h3) h += `<h3>${esc(s.h3)}</h3>`;
  if(s.big) h += `<div class="big">${esc(s.big)}</div>`;
  if(s.quote) h += `<div class="quote">${esc(s.quote)}</div>`;
  if(s.items){ h += '<ul>'; s.items.forEach(it=> h += `<li>${esc(it)}</li>`); h += '</ul>'; }
  if(s.p) h += `<p>${esc(s.p)}</p>`;
  if(s.p2) h += `<p>${esc(s.p2)}</p>`;
  if(s.rings){ h += '<div class="rings">'; for(let r=0;r<10;r++){ h += `<span class="ring${r<4?' fill':''}"></span>`; } h += '</div>'; }
  if(s.sub) h += `<p class="sub">${esc(s.sub)}</p>`;
  if(s.byline) h += `<div class="byline">${s.byline}</div>`;
  if(s.ctaLine) h += `<div class="cta-line">${esc(s.ctaLine)}</div>`;
  if(s.disc) h += `<div class="disc">${esc(s.disc)}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
