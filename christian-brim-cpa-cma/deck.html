<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Keep the Craft, Keep the Money · Christian Brim · The Profitable Creative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1c2c44; --panel:#223350; --rule:#33456190;
    --acc:#c9a66b; --cream:#f6f1e7; --ink:#f6f1e7; --grey:#c3cbd8; --dim:#8592a6;
  }
  html,body{height:100%}
  body{background:#131f30;font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#131f30}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Oswald',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Oswald',sans-serif;font-weight:600;color:var(--cream);line-height:1.1;letter-spacing:.005em}
  .t-title h1{font-size:4.4vw;max-width:93%;text-transform:uppercase;letter-spacing:.01em}
  .t-normal h1{font-size:3.0vw;max-width:88%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.7vh;max-width:77%;line-height:1.56;font-weight:400}
  .sub{font-family:'Montserrat',sans-serif;font-size:1.62vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Oswald',sans-serif;font-size:1.3vw;font-weight:600;color:var(--acc);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:93%;text-transform:uppercase}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#26395a 0%,#121d2e 100%);align-items:center;text-align:center}
  .t-dark h1{font-family:'Montserrat',sans-serif;font-weight:400;font-style:italic;font-size:3.2vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#26395a 0%,#121d2e 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:88%;text-transform:uppercase}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Oswald',sans-serif;border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.3vh 1.9vw;font-size:1.18vw;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
  .chip.solid{background:var(--acc);border-color:var(--acc);color:#2a2010}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Montserrat',sans-serif;font-size:.9vw;color:var(--dim);text-align:center;line-height:1.42}
  .t-title .disc,.t-normal .disc{text-align:left}
  .stat-row{display:flex;gap:3.4vw;margin-top:4.2vh}
  .stat .n{font-family:'Oswald',sans-serif;font-size:2.9vw;font-weight:700;color:var(--acc);line-height:1}
  .stat .l{font-family:'Montserrat',sans-serif;font-size:1.0vw;color:var(--grey);margin-top:1vh;letter-spacing:.02em;max-width:12vw}
  .arch{position:absolute;pointer-events:none;right:7%;bottom:8.5%;width:20vw;opacity:.95}
  .corner-arch{position:absolute;pointer-events:none;right:6%;bottom:7.5%;width:9vw;opacity:.42}
  .brandline{font-family:'Oswald',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(246,241,231,.09);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Oswald',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}.stat .n{font-size:6vw}.stat .l{font-size:2.4vw;max-width:26vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Profitable Creative</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- profit-first allocation motif: a stack of allocation bars, the top slice (profit) taken first, marked gold -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arch" viewBox="0 0 240 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="26" width="160" height="20" rx="3" fill="#c9a66b" stroke="#c9a66b"/>
    <rect x="40" y="58" width="160" height="18" rx="3" stroke="#f6f1e7" opacity="0.55"/>
    <rect x="40" y="86" width="160" height="18" rx="3" stroke="#f6f1e7" opacity="0.4"/>
    <rect x="40" y="114" width="160" height="18" rx="3" stroke="#f6f1e7" opacity="0.28"/>
    <path d="M22 36 L34 36" stroke="#c9a66b"/>
    <path d="M22 36 L28 30 M22 36 L28 42" stroke="#c9a66b"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Keep the Craft. Keep the Money.',sub:'A live masterclass for creative business owners on pricing for the value you create and taking your profit first, so a business you love finally pays you what it is worth. With Christian Brim, CPA/CMA.',brand:true,arch:true},
 {t:'normal',k:'Who this is for',title:'You are brilliant at the work. The bank account does not show it yet.',body:'You do beautiful work, your clients are thrilled, your calendar is full, and somehow the profit never matches the talent in the room. You are not bad at the craft. You were just never shown how the money part is supposed to work.'},
 {t:'dark',title:'Being busy and being profitable are not the same thing. Most creatives only ever get taught the first one.'},

 {t:'section',idx:'Part One',title:'Why Great Creatives Stay Broke'},
 {t:'normal',k:'The passion-versus-profit myth',title:'You were told you had to choose: the work you love, or real money.',body:'So you priced low to keep the work coming, treated whatever was left at the end of the month as profit, and told yourself that is just how creative businesses go. None of that is true. It is a story, and it is an expensive one.'},
 {t:'normal',k:'The hourly trap',title:'Billing by the hour quietly caps what your talent can earn.',body:'Hourly pricing pays you for time, not for the result you create, so the better and faster you get, the less you make. Your best, most valuable work ends up being your cheapest work.'},
 {t:'dark',title:'Pricing is driven by the buyer and the value they receive. Not by your hours, and not by what you think you are allowed to charge.'},

 {t:'section',idx:'Part Two',title:'The Two Systems That Change the Numbers'},
 {t:'normal',k:'Value pricing · what it is',title:'Price the transformation, not the timesheet.',body:'Value pricing sets your fee against the outcome the client actually walks away with. The exact same work, priced against the result instead of the clock, is worth many times what it is worth on an hourly invoice.'},
 {t:'normal',k:'Value pricing · how to find it',title:'Your clients will tell you what your work is really worth.',body:'Ask them what problem your work solved and what it would have cost to get it wrong. Their answers surface the value you have been quietly giving away, and hand you the exact language to charge for it.'},
 {t:'normal',k:'Profit First for Creatives · the flip',title:'Take your profit first. Run the business on what is left.',body:'Most owners hope profit is whatever survives the month. Profit First flips it: profit comes out first, into its own account, and the business learns to run on the rest. This is that method, adapted for how creative businesses actually earn and spend.'},
 {t:'normal',k:'Profit First for Creatives · why it holds',title:'Systems do not kill creativity. They protect it.',body:'When the money runs on a system, you stop making fear-based decisions and get your head back for the work. Process is what buys you the creative space. It does not take it away.'},
 {t:'dark',title:'Profit is not what is left over when the passion is done. Profit is what keeps the passion alive.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Run It'},
 {t:'normal',k:'The shift, in practice',title:'Same talent, same clients, a very different set of numbers.',body:'The work does not change. What changes is what you charge for it, what you keep from it, and how it feels to run the place, once your pricing and your profit are on purpose instead of by accident.'},
 {t:'normal',k:'Why Christian Brim',title:'A CPA who does only this, for people who do what you do.',body:'Twenty-five years as a CPA and CMA, a firm built specifically for the creative industries, and the number one bestselling book Profit First for Creatives. He hosts The Profitable Creative because he believes the work and the money were never meant to be enemies.',stats:[['No. 1','bestseller, Profit First for Creatives'],['25+','years as a CPA / CMA'],['Creatives','the only industry he serves']]},
 {t:'dark',title:'The most creative thing you can do for your business is to finally make it profitable.'},

 {t:'section',idx:'Your Next Step',title:'Make the Work Pay'},
 {t:'normal',k:'Where to start',title:'See what your pricing and profit could actually look like.',body:'Value pricing and Profit First are how creative owners stop leaving money on the table and start paying themselves like the work deserves. The first step is a straight conversation about where your numbers are right now.'},
 {t:'cta',title:'Ready to keep the craft and the money?',chips:['Book a call with Christian','Read Profit First for Creatives'],disc:'Educational content for creative business owners. No income or business result is guaranteed. Outcomes vary by business, market, pricing, and starting conditions.'},
];

const deck=document.getElementById('deck');
function arch(){return `<svg class="arch"><use href="#arch"/></svg>`}
function cornerArch(){return `<svg class="corner-arch"><use href="#arch"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.stats) h+=`<div class="stat-row">`+s.stats.map(st=>`<div class="stat"><div class="n">${st[0]}</div><div class="l">${st[1]}</div></div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">The Profitable <b>Creative</b> · Christian Brim</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map((c,ci)=>`<div class="chip ${ci===0?'solid':''}">${c}</div>`).join('')+`</div>`;
  }
  if(s.arch) h+=arch();
  else if(s.t==='title') h+=arch();
  else if(s.t==='normal') h+=cornerArch();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
