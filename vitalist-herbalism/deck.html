<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Medicine Growing Where You Live — A Vitalist Herbalism Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#274620;        /* John's body/footer forest green (brand.json) */
    --panel:#20381a;     /* darker forest, derived from --bg */
    --accent:#a5b8a3;    /* his link sage (brand.json) */
    --accent2:#667665;   /* his header sage (brand.json) */
    --ink:#f3efe3;       /* warm paper text for legibility on the dark ground */
    --muted:#c4cfbf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--panel);color:var(--ink);font-family:"Montserrat",sans-serif;
    font-weight:300;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{display:flex;flex-direction:column}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;
    justify-content:center;padding:9vh 9vw;position:relative;
    background:var(--bg);border-bottom:1px solid rgba(165,184,163,.18)}
  .slide:nth-child(even){background:var(--panel)}
  .kicker{font-family:"Julius Sans One",sans-serif;letter-spacing:.32em;font-size:.82rem;
    text-transform:uppercase;color:var(--accent);margin-bottom:1.6rem}
  h1{font-family:"Julius Sans One",sans-serif;font-weight:400;line-height:1.08;
    font-size:clamp(2.1rem,5.4vw,4.1rem);letter-spacing:.01em}
  h2{font-family:"Julius Sans One",sans-serif;font-weight:400;line-height:1.12;
    font-size:clamp(1.7rem,4vw,3rem);letter-spacing:.01em}
  .sub{font-size:clamp(1.05rem,1.7vw,1.35rem);color:var(--muted);margin-top:1.5rem;
    max-width:40ch;font-weight:300}
  .statement h2{max-width:20ch}
  ul{list-style:none;margin-top:2.2rem;max-width:44ch}
  li{position:relative;padding-left:1.9rem;margin:1.05rem 0;font-size:clamp(1rem,1.5vw,1.2rem);
    color:var(--ink);font-weight:300}
  li::before{content:"";position:absolute;left:0;top:.62em;width:1.1rem;height:1px;
    background:var(--accent)}
  .sprig{width:42px;height:1px;background:var(--accent);position:relative;margin-bottom:2rem}
  .sprig::before,.sprig::after{content:"";position:absolute;width:11px;height:1px;
    background:var(--accent);top:0;left:14px;transform-origin:left center}
  .sprig::before{transform:rotate(-32deg)} .sprig::after{transform:rotate(32deg)}
  .section h2{font-size:clamp(2rem,5vw,3.6rem)}
  .num{font-family:"Julius Sans One",sans-serif;color:var(--accent2);font-size:.8rem;
    letter-spacing:.2em;position:absolute;bottom:4vh;right:9vw}
  .cta{background:var(--panel)}
  .cta .steps{margin-top:2rem;max-width:46ch}
  .cta .steps li::before{background:var(--accent2)}
  .disc{margin-top:3rem;font-size:.78rem;color:var(--muted);max-width:52ch;line-height:1.6;
    border-top:1px solid rgba(165,184,163,.22);padding-top:1.2rem;font-weight:300}
  .byline{margin-top:1.4rem;font-family:"Julius Sans One",sans-serif;letter-spacing:.14em;
    font-size:.9rem;color:var(--accent)}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title', k:'A Live Masterclass', h:'The Medicine Growing Where You Live', s:'An introduction to bioregional, vitalist herbalism.', by:'with John J. Slattery'},
  {t:'statement', h:'You were told the plants you need grow somewhere else.', s:'In a rainforest. In China. In a supplement bottle. Almost never where you actually live.'},
  {t:'list', k:'This is for you if', h:'You feel the pull, but not the footing', list:["You love plants, but freeze when it is time to actually use one","You have taken courses and still cannot confidently work with what grows near you","You want a practice rooted in your own landscape, not a national catalog"]},
  {t:'statement', h:'So you collect more information.', s:'More herbs, more protocols, more certificates. And the plants outside your door stay strangers.'},
  {t:'statement', h:'The problem was never how much you know.', s:'It is that you were taught herbalism for a place you have never been.'},
  {t:'section', k:'Part One', h:'Why imported herbalism keeps you stuck'},
  {t:'list', k:'The core problem', h:'A recipe is not a relationship', list:["A recipe assumes a plant you may never meet","It skips the one skill that travels with you: reading a plant yourself","Memorized protocols fall apart the moment life does not match the chart"]},
  {t:'statement', h:'A plant is not a pill.', s:'It has qualities, warming or cooling, moistening or drying. So do you. Herbalism is the art of matching them.'},
  {t:'section', k:'Part Two', h:'The framework: bioregional, vitalist practice'},
  {t:'list', k:'Pillar One', h:'Bioregional Herbalism', list:["Begin with the plants of your own landscape, the ones you can visit again and again","Build a living materia medica from relationship, not from a textbook","The desert taught me this. Your region will teach you."]},
  {t:'list', k:'Pillar Two', h:'Vitalist Principles and Practices', list:["Support the body's own vital force instead of fighting the symptom","Work with the whole person and their terrain","Let the plant meet the person, not just the complaint"]},
  {t:'list', k:'Pillar Three', h:'Plant Energetics: Attuning to Ourselves', list:["Read a plant by its qualities: warming, cooling, moist, dry","Match those qualities to a person's constitution and tissue state","Train your own senses as the first instrument"]},
  {t:'list', k:'Pillar Four', h:'One Plant a Month, for a Year', list:["Study a single plant deeply each month, in the field and in practice","Twelve plants you truly know beat a hundred names you memorized","Depth and rhythm, the way a practice is actually built"]},
  {t:'section', k:'Part Three', h:'What a year of this looks like'},
  {t:'list', k:'The practice', h:'From overwhelmed to rooted', list:["You walk your own landscape and recognize medicine","You can explain why a plant fits a person, in plain language","You have a practice you can stand on, and keep growing"]},
  {t:'statement', h:'I have spent decades in the field.', s:'Author of Southwest Foraging and Southwest Medicinal Plants, learning from the land, from indigenous elders, and from clinical practice.'},
  {t:'statement', h:'You do not need another certificate.', s:'You need to know your plants. That is what we build together.'},
  {t:'cta', k:'Your next step', h:'Join the next Vitalist Herbalism cohort', s:'A twelve month journey into the living medicine of your own bioregion.', steps:["Reserve your place in the upcoming cohort","Start with one plant, and one season","Build a practice rooted where you live"], disc:'This masterclass is educational and is not medical advice. No result is guaranteed. Results vary from person to person.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function list(items){const u=el('ul'); items.forEach(x=>u.appendChild(el('li',null,x))); return u;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=el('section','slide '+(s.t==='cta'?'cta':s.t==='statement'?'statement':s.t==='section'?'section':''));
  if(s.t!=='statement') sec.appendChild(el('div','sprig'));
  if(s.k) sec.appendChild(el('div','kicker',s.k));
  if(s.t==='title'){ sec.appendChild(el('h1',null,s.h)); if(s.s)sec.appendChild(el('p','sub',s.s)); if(s.by)sec.appendChild(el('div','byline',s.by)); }
  else if(s.t==='section'){ sec.appendChild(el('h2',null,s.h)); }
  else { sec.appendChild(el('h2',null,s.h)); if(s.s)sec.appendChild(el('p','sub',s.s)); }
  if(s.list) sec.appendChild(list(s.list));
  if(s.steps){ const u=list(s.steps); u.className='steps'; sec.appendChild(u); }
  if(s.disc) sec.appendChild(el('p','disc',s.disc));
  sec.appendChild(el('div','num',String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')));
  deck.appendChild(sec);
});
</script>
</body>
</html>
