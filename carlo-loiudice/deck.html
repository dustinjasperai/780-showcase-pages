<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authentic Speaker Practice — Carlo Loiudice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f6f3; --panel:#ffffff; --ink:#14261c; --body:#231f20;
    --muted:#4f5655; --accent:#009bb9; --rule:#14261c;
    --display:'Montserrat',system-ui,sans-serif; --text:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:var(--text)}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid rgba(20,38,28,.10);border-radius:14px;
    padding:52px 54px;margin:20px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(20,38,28,.04)}
  .kick{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;color:var(--ink);font-size:46px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;color:var(--ink);font-size:33px;line-height:1.12}
  .sub{font-size:19px;color:var(--muted);margin-top:18px;max-width:40ch;line-height:1.5}
  .big{font-family:var(--display);font-weight:800;color:var(--ink);font-size:40px;line-height:1.1}
  .big .a{color:var(--accent)}
  p.body{font-size:19px;color:var(--body);margin-top:16px;max-width:46ch;line-height:1.55}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:16px}
  li{font-size:19px;color:var(--body);padding-left:20px;position:relative;line-height:1.45;max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  li b{font-family:var(--display);color:var(--ink);font-weight:700}
  .lever{font-family:var(--display);font-weight:800;font-size:30px;color:var(--ink)}
  .lever .n{color:var(--accent);margin-right:10px}
  .quote{font-family:var(--display);font-weight:700;font-size:30px;color:var(--ink);line-height:1.2;max-width:24ch}
  .rule{height:3px;width:64px;background:var(--accent);margin:8px 0 0;border-radius:2px}
  .who{font-size:20px;color:var(--body);line-height:1.5;max-width:44ch}
  .cta h2{font-size:38px}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:52ch;line-height:1.5}
  .foot{margin-top:22px;font-family:var(--display);font-weight:700;color:var(--ink);font-size:16px}
  .foot span{color:var(--accent)}
  .n-of{position:absolute;bottom:14px;right:22px;font-size:11px;color:var(--muted);font-family:var(--display);letter-spacing:.1em}
  .slide{position:relative}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kick:"A live masterclass with Carlo Loiudice",
   h:"Authentic Speaker Practice",
   sub:"How to speak with intention, authority and presence when the pressure is on."},

  {t:'who', kick:"Who this is for",
   who:"You know your material. You have done the work. And still, in the moments that decide how you are seen, the pitch, the board update, the room that goes quiet, something tightens and the real you disappears."},

  {t:'hook', big:"You don't need to sound confident. You need to be <span class=\"a\">solid</span>."},

  {t:'section', kick:"Part one", h:"The core problem"},

  {t:'point', h:"Rehearsing more is why you freeze",
   body:"The usual advice is to prepare harder: more rehearsal, more slides, a tighter script. So you memorise. Then one interruption lands off script and the whole thing falls apart, because a performance only holds while nothing goes wrong."},

  {t:'point', h:"Pressure does not attack your words",
   body:"It attacks your presence. When the stakes rise, your breath shortens, your voice climbs, your body braces. No amount of rehearsed wording fixes that, because the problem was never the words."},

  {t:'section', kick:"Part two", h:"The Authentic Speaker Practice"},

  {t:'point', h:"Coaching, acting craft, guided practice",
   body:"This is the method I use in every one to one path. It does not build a performance for you to replicate. It trains how you actually communicate when the pressure is on, so you become more solid instead of only seeming confident. It works on three levers."},

  {t:'lever', n:"01", k:"Intention",
   body:"The purpose beneath every message. Name why you are really speaking, and your voice, your body and your structure start to organise themselves around it. This is where every session begins."},

  {t:'lever', n:"02", k:"Authority",
   body:"The presence that lets you hold a room. Not volume, not posturing. The calm that comes from being genuinely grounded, so people read you as a leader before you have said anything clever."},

  {t:'lever', n:"03", k:"Engagement",
   body:"The relationship with the audience. Turning a one way delivery into a connection that keeps people with you to the last line, because they can feel you are speaking to them and not at them."},

  {t:'list', kick:"What the method works on", h:"Three concrete dimensions", items:[
    "<b>Message structure</b>: saying the one thing that matters, in an order people can follow.",
    "<b>Voice, body and presence</b>: the instrument, trained the way an actor trains it.",
    "<b>The relationship with the audience</b>: reading the room and staying with it under pressure."]},

  {t:'section', kick:"Part three", h:"What solid looks like"},

  {t:'point', h:"Solid, not performed",
   body:"When the three levers are in place, interruptions stop rattling you, silence stops frightening you, and you sound like yourself at your most grounded. You are not acting confident. You are present, and the room feels it."},

  {t:'quote', quote:"People do not remember your slides. They remember how solid you were when it counted."},

  {t:'cred', kick:"Why me",
   h:"A working actor, not a slide deck",
   body:"I have spent 25 years on stage and screen and moved to Berlin to build this work. I am an ICF certified coach, and I bring the actor's craft, learning to be real under pressure, to professionals, managers and leaders. The method comes from the stage, where there is nowhere to hide."},

  {t:'list', kick:"In one line", h:"Intention, authority, presence", items:[
    "<b>Intention</b> gives your words a reason the room can feel.",
    "<b>Authority</b> lets you hold the room without forcing it.",
    "<b>Engagement</b> keeps them with you to the end."]},

  {t:'cta', kick:"Your next step",
   h:"Let's find your solid",
   body:"If this is the version of speaking you want, the next step is a short conversation about where you freeze and what would change it.",
   next:"Book your free 15 minute consultation at carloloiudice.com",
   disc:"Educational content only. No income or result is guaranteed. Results vary and depend on the individual, their effort and their circumstances."}
];

function esc(x){return x==null?"":x}
function render(){
  const root=document.getElementById('deck');
  S.forEach((s,i)=>{
    const d=document.createElement('section');
    d.className='slide'+(s.t==='cta'?' cta':'');
    let html='';
    if(s.kick) html+='<div class="kick">'+esc(s.kick)+'</div>';
    if(s.t==='title'){ html+='<h1>'+esc(s.h)+'</h1><div class="rule"></div><div class="sub">'+esc(s.sub)+'</div>'; }
    else if(s.t==='who'){ html+='<h2>'+esc(s.kick? '' : '')+'</h2><div class="who">'+esc(s.who)+'</div>'; }
    else if(s.t==='hook'){ html='<div class="big">'+esc(s.big)+'</div>'; }
    else if(s.t==='section'){ html+='<h1>'+esc(s.h)+'</h1><div class="rule"></div>'; }
    else if(s.t==='point'){ html+='<h2>'+esc(s.h)+'</h2><p class="body">'+esc(s.body)+'</p>'; }
    else if(s.t==='lever'){ html+='<div class="lever"><span class="n">'+esc(s.n)+'</span>'+esc(s.k)+'</div><div class="rule"></div><p class="body">'+esc(s.body)+'</p>'; }
    else if(s.t==='list'){ html+='<h2>'+esc(s.h)+'</h2><ul>'+(s.items||[]).map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
    else if(s.t==='quote'){ html='<div class="quote">'+esc(s.quote)+'</div>'; }
    else if(s.t==='cred'){ html+='<h2>'+esc(s.h)+'</h2><p class="body">'+esc(s.body)+'</p>'; }
    else if(s.t==='cta'){ html+='<h2>'+esc(s.h)+'</h2><p class="body">'+esc(s.body)+'</p><div class="foot"><span>&rarr;</span> '+esc(s.next)+'</div><div class="disc">'+esc(s.disc)+'</div>'; }
    html+='<div class="n-of">'+(i+1)+' / '+S.length+'</div>';
    d.innerHTML=html;
    root.appendChild(d);
  });
}
render();
</script>
</body>
</html>
