<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devenir Fleuriste Indépendant — Masterclass, Académie Florale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcfaf7;        /* brand body ground (brand.json, light scheme) */
    --panel:#f7f2ed;     /* brand warm cream panel */
    --ink:#1e0d01;       /* brand dominant espresso */
    --body:#272727;      /* brand body text */
    --muted:#4a4a4c;     /* brand muted */
    --accent:#fc4a00;    /* brand vivid orange accent */
    --display:'Playfair Display',Georgia,serif;
    --sans:'Onest',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--body);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    position:relative;background:var(--bg);border-radius:10px;
    aspect-ratio:16/9;width:100%;margin:0 0 22px;padding:64px 72px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 1px 0 rgba(30,13,1,.12);
  }
  .slide::before{content:"";position:absolute;left:72px;top:46px;width:48px;height:3px;background:var(--accent);opacity:.9}
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:14px}
  h1{font-family:var(--display);font-weight:700;color:var(--ink);font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;color:var(--ink);font-size:38px;line-height:1.1;margin-bottom:18px}
  .lede{font-size:21px;line-height:1.5;color:var(--body);max-width:46ch;margin-top:16px}
  .sub{font-size:19px;color:var(--muted);margin-top:14px}
  ul{list-style:none;margin-top:20px;display:grid;gap:14px}
  li{font-size:19px;line-height:1.45;color:var(--body);padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  li b{color:var(--ink);font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:18px}
  .card{background:var(--panel);border-radius:8px;padding:22px 24px}
  .card h3{font-family:var(--display);font-size:22px;color:var(--ink);margin-bottom:8px}
  .card p{font-size:16px;color:var(--muted);line-height:1.45}
  .big{font-family:var(--display);font-size:44px;color:var(--ink);line-height:1.08;max-width:22ch}
  .divider .kicker{color:var(--accent)}
  .divider h2{font-size:46px}
  .foot{position:absolute;right:30px;bottom:22px;font-size:13px;color:var(--muted);letter-spacing:.04em}
  .pagenum{position:absolute;left:34px;bottom:22px;font-size:13px;color:var(--muted)}
  .title h1{font-size:60px;max-width:20ch}
  .byline{margin-top:26px;font-size:18px;color:var(--ink);font-weight:600}
  .byline span{color:var(--muted);font-weight:400}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:20px;max-width:62ch}
  .cta h2{font-size:44px}
  .ctabtn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-weight:600;font-size:19px;padding:15px 30px;border-radius:999px}
  @media(max-width:720px){.slide{padding:34px 28px}.title h1{font-size:34px}h1{font-size:32px}h2{font-size:26px}.big{font-size:28px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',kicker:'Masterclass en direct, Académie Florale',h1:'Devenir Fleuriste Indépendant',
   byline:'Vivre de la fleur, sans forcément ouvrir de boutique.',author:'Avec Sybile Loppé'},

  {t:'content',kicker:'La promesse',h2:'Ce que vous repartez avec',
   bullets:[
     'Une vision claire du métier de fleuriste indépendant, au-delà du comptoir.',
     'Les trois leviers de revenu que personne ne vous montre : atelier à domicile, événementiel, abonnements.',
     'La première brique concrète pour démarrer, même en reconversion totale.']},

  {t:'content',kicker:'À qui je parle',h2:'Trois profils, une même envie',
   bullets:[
     '<b>La reconversion</b> : vous partez de zéro, et vous pensez parfois qu’il est trop tard.',
     '<b>La fleuriste salariée</b> : vous maîtrisez la technique, mais pas l’indépendance.',
     '<b>La candidate libre</b> : vous préparez le CAP seule et cherchez une méthode.']},

  {t:'big',kicker:'Le piège',big:'On vous a vendu une seule route : passez le diplôme, puis tenez une boutique.',
   sub:'Alors la plupart attendent le bon diplôme, le bon local, le bon moment. Et ce moment n’arrive jamais.'},

  {t:'big',kicker:'Le recadrage',big:'Le diplôme n’est pas le métier. La boutique n’est pas la seule porte.',
   sub:'Le vrai métier, c’est construire une activité florale durable, à votre image. Cela s’apprend.'},

  {t:'divider',kicker:'Partie une',h2:'Le vrai problème'},

  {t:'content',kicker:'Pourquoi tant de reconversions calent',h2:'La technique seule ne suffit pas',
   bullets:[
     'On apprend à faire un bouquet, jamais à calculer un prix, une marge, un devis.',
     'On apprend l’art floral, jamais le positionnement ni la visibilité.',
     'Résultat : de belles mains, et aucune activité derrière.']},

  {t:'content',kicker:'L’économie réelle du métier',h2:'Ce qu’une boutique ne montre pas',
   bullets:[
     'Plusieurs sources de revenus, pas une caisse unique : mariages, événementiel, abonnements, ateliers.',
     'Des charges maîtrisées quand on démarre depuis chez soi.',
     'Une clientèle choisie, construite autour de votre style, pas subie au comptoir.']},

  {t:'divider',kicker:'Partie deux',h2:'La méthode : six modules'},

  {t:'content',kicker:'L’architecture',h2:'Six modules pour en vivre',
   bullets:[
     '<b>Fondamentaux du métier</b> : la réalité du terrain et les piliers d’une activité viable.',
     '<b>Botanique</b> : comprendre la fleur pour la travailler et la conserver.',
     '<b>Techniques florales</b> : outils, préparation, composition, emballage.',
     '<b>Art floral</b> : styles, occasions, votre signature créative.',
     '<b>Vente et relation client</b> : prix, marges, TVA, devis mariage.',
     '<b>Marketing et visibilité</b> : positionnement, Instagram, partenariats, abonnements.']},

  {t:'twocard',kicker:'Le vrai avantage (1/2)',h2:'Vente et relation client',
   cards:[
     {h:'Ce que vous apprenez',p:'Conseiller un client, calculer vos prix et vos marges, gérer la TVA et la facturation, établir un devis de mariage.'},
     {h:'Pourquoi c’est décisif',p:'C’est la différence entre une passion qui coûte et une activité qui vous fait vivre.'}]},

  {t:'twocard',kicker:'Le vrai avantage (2/2)',h2:'Marketing et visibilité',
   cards:[
     {h:'Ce que vous apprenez',p:'Définir votre client idéal, construire votre identité, une stratégie Instagram sereine, des partenariats locaux et des abonnements floraux.'},
     {h:'Pourquoi c’est décisif',p:'C’est ce qui remplit votre agenda sans boutique de rue, et vous rend indépendante pour de bon.'}]},

  {t:'content',kicker:'Vous n’êtes jamais seule',h2:'Trois piliers d’accompagnement',
   bullets:[
     '<b>Formation évolutive</b> : un parcours qui grandit avec vous, accessible à vie.',
     '<b>Mentorat personnalisé</b> : coaching individuel, questions en direct, analyse de vos projets.',
     '<b>La communauté</b> : un réseau de pairs, présent sept jours sur sept.']},

  {t:'divider',kicker:'Partie trois',h2:'À quoi ça ressemble'},

  {t:'content',kicker:'Le parcours',h2:'90 jours, puis 2 ans',
   bullets:[
     'Un cœur de formation en 90 jours pour poser des bases solides.',
     '2 ans de mentorat pour vous accompagner jusqu’au premier client et au-delà.',
     'Des journées en présentiel pour les grandes pièces, structures et événementiel.']},

  {t:'content',kicker:'Qui vous accompagne',h2:'Sybile Loppé',
   bullets:[
     'Fleuriste diplômée, CAP et Brevet Professionnel, plus de 8 ans de métier.',
     'Ancienne maître d’apprentissage : j’ai formé, j’ai corrigé, j’ai vu ce qui bloque.',
     'La note de 5/5 sur 18 avis, avec des élèves en France, en Belgique et en Suisse.']},

  {t:'cta',kicker:'La prochaine étape',h2:'Réservez votre appel découverte offert',
   lede:'On regarde ensemble votre projet, et si l’Académie Florale est la bonne route pour vous. Sans engagement.',
   btn:'Devenir Fleuriste Indépendant',
   disc:'Contenu éducatif et informatif. Aucune garantie de revenu, de résultat ou de réussite commerciale n’est donnée ni implicite ; les résultats dépendent de votre travail, de votre marché et de votre situation. For reference only: educational content, results are not guaranteed and vary by individual.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('section','slide '+s.t);
  if(s.kicker) sl.appendChild(el('div','kicker',s.kicker));
  if(s.t==='title'){
    sl.appendChild(el('h1',null,s.h1));
    if(s.byline) sl.appendChild(el('div','byline',s.byline));
    if(s.author) sl.appendChild(el('div','sub',s.author));
  } else if(s.t==='big'){
    sl.appendChild(el('div','big',s.big));
    if(s.sub) sl.appendChild(el('div','sub',s.sub));
  } else if(s.t==='divider'){
    sl.appendChild(el('h2',null,s.h2));
  } else if(s.t==='twocard'){
    if(s.h2) sl.appendChild(el('h2',null,s.h2));
    const two=el('div','two');
    s.cards.forEach(c=>{const cd=el('div','card');cd.appendChild(el('h3',null,c.h));cd.appendChild(el('p',null,c.p));two.appendChild(cd);});
    sl.appendChild(two);
  } else if(s.t==='cta'){
    sl.appendChild(el('h2',null,s.h2));
    if(s.lede) sl.appendChild(el('div','lede',s.lede));
    if(s.btn) sl.appendChild(el('span','ctabtn',s.btn));
    if(s.disc) sl.appendChild(el('div','disc',s.disc));
  } else {
    if(s.h2) sl.appendChild(el('h2',null,s.h2));
    if(s.lede) sl.appendChild(el('div','lede',s.lede));
    if(s.bullets){const ul=el('ul');s.bullets.forEach(b=>ul.appendChild(el('li',null,b)));sl.appendChild(ul);}
  }
  sl.appendChild(el('div','pagenum',(i+1)+' / '+S.length));
  sl.appendChild(el('div','foot','Académie Florale'));
  deck.appendChild(sl);
});
</script>
</body>
</html>
