<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Think Like a Nurse · Damion Jenkins, MSN, RN · The Nurse Speak®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f8fb; --panel:#ffffff; --rule:#dde5ec;
    --ink:#21304a; --accent:#e8815f; --accent2:#2f7d75; --muted:#5a6b82;
  }
  html,body{height:100%}
  body{background:#dfe4ea;font-family:'Lato',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dfe4ea}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Fira Sans',Helvetica,sans-serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:-.008em}
  .t-title h1{font-size:4.5vw;max-width:90%}
  .t-normal h1{font-size:3.2vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--muted);margin-top:2.6vh;max-width:76%;line-height:1.56;font-weight:400}
  .sub{font-size:1.68vw;color:var(--muted);margin-top:3.2vh;max-width:80%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Fira Sans',sans-serif;font-size:1.32vw;font-weight:700;color:var(--accent2);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:90%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh;border-radius:3px}
  .t-dark{background:var(--ink);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:88%;font-style:italic;font-weight:500;color:#eef2f7}
  .t-cta{background:radial-gradient(130% 130% at 50% 0%,#28395a 0%,#1a2740 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:#f4f7fb}
  .t-cta .sub{color:#c4cddb}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:#f7d9cd;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.22vw;font-weight:600}
  .steps{display:flex;gap:0;margin-top:3.6vh;flex-wrap:wrap;max-width:92%}
  .step{display:flex;align-items:center;font-size:1.16vw;font-weight:600;color:var(--ink)}
  .step .n{display:inline-flex;align-items:center;justify-content:center;width:2.2vw;height:2.2vw;border-radius:50%;background:var(--accent2);color:#fff;font-size:1.02vw;margin-right:.7vw}
  .step .arw{color:var(--accent);margin:0 1vw;font-weight:700}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:#9fb0c4;font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#9aa9bd}
  .arc-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-arc{right:7%;bottom:8%;width:23vw}
  .corner-arc{right:6%;bottom:7.5%;width:10vw;opacity:.5}
  .brandline{font-size:1.3vw;color:var(--muted);margin-top:3.4vh;font-weight:400;letter-spacing:.01em}
  .brandline b{color:var(--accent2);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(33,48,74,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--muted);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}.step{font-size:2.6vw}.step .n{width:5vw;height:5vw;font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The Nurse Speak®</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- answer-path motif: a question node, a reasoning arc, an answer node -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arc" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="128" x2="246" y2="128" stroke="#2f7d75" opacity="0.3"/>
    <path d="M46 122 Q130 30 214 122" stroke="#e8815f" opacity="0.95"/>
    <circle cx="46" cy="122" r="5.5" fill="none" stroke="#2f7d75" stroke-width="2.6"/>
    <circle cx="214" cy="122" r="5.5" fill="#e8815f" stroke="#e8815f" stroke-width="2.6"/>
    <text x="34" y="150" font-family="Fira Sans" font-size="15" fill="#2f7d75" opacity="0.7">Q</text>
    <text x="206" y="150" font-family="Fira Sans" font-size="15" fill="#e8815f" opacity="0.9">A</text>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Think Like a Nurse',sub:'A live masterclass for nursing students and NCLEX retakers: how to reason your way to the right answer on any question, even the ones you have never seen.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You have studied harder than anyone. You still freeze on the questions.',body:'You have read the content, watched the videos, and answered thousands of practice questions. Then the real question comes with two answers that both look right, and your mind goes blank.'},
 {t:'dark',title:'The NCLEX is not a knowledge test. It is a decision test. More content is not the fix.'},

 {t:'section',idx:'Part One',title:'Why Smart Students Fail'},
 {t:'normal',k:'The memorizing trap',title:'You cannot memorize your way through a judgment exam.',body:'The NCLEX does not ask you to recall a fact. It puts you at the bedside and asks what a safe nurse does next. If your only tool is recall, an unfamiliar question has nowhere to go.'},
 {t:'normal',k:'The two-right-answers problem',title:'On most questions, several answers are true. Only one is safest.',body:'That is the moment students lose. Not because they do not know the content, but because nobody taught them how to choose between options that are all technically correct.'},
 {t:'normal',k:'What anxiety really is',title:'Test anxiety is usually a strategy gap wearing a disguise.',body:'When you do not have a repeatable way to break a question down, every question feels like a coin flip. Give the mind a method to run, and the panic has somewhere to go.'},
 {t:'dark',title:'You do not need to know more. You need to read the question like a nurse, not like a student.'},

 {t:'section',idx:'Part Two',title:'The Think Like a Nurse Method'},
 {t:'normal',k:'The perspective shift',title:'Stop answering as a student. Start reasoning as the nurse in the room.',body:'This is the shift the whole method turns on. A student asks what the book said. A nurse asks who is least safe, what could hurt this patient first, and what has to happen now. The question reads differently the moment you stand in the room.'},
 {t:'normal',k:'The backbone',title:'The Nursing Process is your reasoning frame for every question.',body:'Assess, analyze, diagnose, plan, implement, evaluate. Most wrong answers are the right action taken at the wrong step. When you know which step the question is really asking about, the option that fits jumps out.'},
 {t:'normal',k:'The engine',title:'A six-step process for critical thinking, run on every question.',body:'A repeatable path from the moment you read the stem to the moment you commit to an answer. Same steps every time, so an unfamiliar topic is just familiar reasoning applied to new content.',steps:['Read the stem','Find who is at risk','Name the real question','Weigh the options','Rule the wrong ones out','Commit']},
 {t:'normal',k:'The GOOD and the NOPE',title:'A simple filter for the two answers that both look right.',body:'Every option is either defensible under the situation, a GOOD, or something you can reject on sight, a NOPE. Learning to label options fast is how you get from two plausible answers down to the one safe one.'},
 {t:'normal',k:'Reading the level',title:'Know what the question is testing, and answer at that level.',body:'Some questions test a fact. Most test judgment. When you can read the difficulty a question is written at, you stop over thinking the easy ones and stop under thinking the hard ones.'},
 {t:'dark',title:'Answers you can defend beat answers you happened to remember.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The student this builds',title:'Calm, methodical, and hard to rattle on exam day.',body:'When every question runs through the same reasoning, you walk in with a plan instead of a prayer. New question types, Next Gen formats, topics you barely covered, the method holds because it was never about the content in the first place.'},
 {t:'normal',k:'Why Damion Jenkins',title:'Twenty years at the bedside and in the classroom, taught in the open.',body:'Damion Jenkins, MSN, RN, has spent two decades as a nurse, academic educator, and NCLEX prep expert, and has run The Nurse Speak and its Strategies for Success program since 2016, teaching thousands of nurses to think their way through the exam instead of memorizing it.'},

 {t:'section',idx:'Your Next Step',title:'Learn the Whole Method'},
 {t:'normal',k:'Strategies for Success',title:'The full program, at the depth that fits you.',body:'The self-paced program walks you through the perspective shift, the six-step process, the GOOD and NOPE filter, and question leveling, with a live retake cohort for repeat test-takers and one-to-one tutoring when you want a coach in your corner until you pass.'},
 {t:'cta',title:'Ready to walk into the NCLEX able to reason through anything?',sub:'Start with The Nurse Speak Strategies for Success program, or book an inquiry call with Damion to find the right fit.',chips:['Explore the program','Book an inquiry call'],disc:'Educational content for nursing students and NCLEX candidates. No score, pass, or exam result is guaranteed. Results vary by student, effort, and preparation.'},
];

const deck=document.getElementById('deck');
function arc(kind){return `<svg class="arc-motif ${kind==='title'?'title-arc':'corner-arc'}"><use href="#arc"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.steps) h+=`<div class="steps">`+s.steps.map((c,j)=>`<div class="step"><span class="n">${j+1}</span>${c}</div>`+(j<s.steps.length-1?`<span class="arw">&rarr;</span>`:``)).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">The Nurse Speak® · <b>Damion Jenkins, MSN, RN</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=arc(s.arc);
  else if(s.t==='title') h+=arc('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
