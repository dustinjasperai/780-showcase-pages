<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build an Offer People Sell Themselves On | Michael Maidens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;800&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ecf0f1;        /* brand exact ranked hex #2 (light panel) */
    --panel:#f8fcfc;     /* soft mint-white tint off the brand accent family */
    --ink:#131b1e;       /* brand near-black header */
    --muted:#4a5559;
    --rule:#dfe6e6;
    --accent:#aed9d8;    /* brand CTA mint/teal, ranked hex #4 */
    --accent-deep:#2f3336;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:56px 56px 52px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-bottom:18px}
  h1{font-family:"Libre Franklin",serif;font-weight:800;font-size:46px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:"Libre Franklin",serif;font-weight:800;font-size:34px;line-height:1.1;margin-bottom:16px}
  h3{font-family:"Libre Franklin",serif;font-weight:600;font-size:22px;margin-bottom:10px}
  p{font-size:18px;line-height:1.62;color:var(--muted);font-weight:300;max-width:62ch}
  p.lead{font-size:21px;color:var(--ink);font-weight:400}
  .big{font-family:"Libre Franklin",serif;font-weight:800;font-size:40px;line-height:1.12;letter-spacing:-.01em}
  .accentbar{height:6px;width:64px;background:var(--accent);border-radius:4px;margin:22px 0 0}
  ul{list-style:none;margin-top:20px;display:grid;gap:12px}
  li{font-size:18px;line-height:1.5;color:var(--ink);padding-left:30px;position:relative;font-weight:400}
  li:before{content:"";position:absolute;left:0;top:9px;width:14px;height:14px;background:var(--accent);border-radius:50%}
  .step{display:flex;gap:20px;align-items:flex-start;margin-top:8px}
  .step .k{font-family:"Libre Franklin",serif;font-weight:800;font-size:40px;color:var(--accent);line-height:1;min-width:58px}
  .title-slide{background:var(--ink);color:#fff;border:none}
  .title-slide h1{color:#fff;font-size:54px}
  .title-slide .eyebrow{color:var(--accent)}
  .title-slide p{color:#c7d0d2}
  .mint-slide{background:var(--accent);border:none}
  .mint-slide .big,.mint-slide h2,.mint-slide p{color:var(--ink)}
  .gap{display:flex;align-items:center;gap:14px;margin-top:28px}
  .gap .dot{width:18px;height:18px;border-radius:50%;background:var(--ink)}
  .gap .dot.b{background:var(--accent-deep)}
  .gap .ln{flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,transparent 14px 24px)}
  .gap .lbl{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .disclaimer{font-size:13px;color:var(--muted);font-weight:300;margin-top:26px;max-width:70ch;line-height:1.5}
  .cta-slide{background:var(--ink);color:#fff;border:none}
  .cta-slide h2,.cta-slide h1{color:#fff}
  .cta-slide p{color:#c7d0d2}
  .cta-btn{display:inline-block;margin-top:24px;background:var(--accent);color:var(--ink);font-weight:600;font-size:18px;padding:16px 34px;border-radius:10px;font-family:"Figtree"}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A free live masterclass',h1:'Build an Offer People Sell Themselves On',p:'The belief-first way to package your expertise so the right people say yes, without the salesy feel. With Michael Maidens, The Offer Academy.'},
  {t:'promise',eyebrow:'What you walk away with',h2:'By the end of this session',list:['A clear read on why your offer feels hard to sell right now','The 5-part structure behind offers people buy on their own','One rewrite you can make to your current offer today']},
  {t:'content',eyebrow:'Who this is for',h2:'You have the knowledge. Selling it is the part that aches.',p:'You are a course creator, coach or expert. You know your material changes lives. But every launch, the selling feels pushy, and you quietly dread it. This is for you.'},
  {t:'content',eyebrow:'The trap',h2:'You were told to sell harder.',p:'More scarcity. More urgency. More "just close them." So selling started to feel like something you do TO people instead of FOR them, and it drains you every single time.'},
  {t:'reframe',eyebrow:'The reframe',big:'We can’t sell anything to anyone. They sell it to themselves.',p:'Your job is not to convince. Your job is to build an offer so aligned with what the buyer already believes that saying yes feels obvious to them.'},
  {t:'part',eyebrow:'Part one',h2:'Why the best offers feel effortless',p:'An irresistible offer is not louder. It is clearer. It meets people at a belief they already hold and shows them the bridge to where they want to be.'},
  {t:'gap',eyebrow:'The core idea',h2:'The transformation gap',p:'Every buyer stands at point A and wants point B. The offer’s whole job is to make that bridge feel real, specific and safe to cross. Name both points and the gap closes.'},
  {t:'part',eyebrow:'Part two',h2:'The 5-Part Offer Creation Framework',p:'This is the architecture under every offer I build. Five moves, in order, each doing one job the one before it cannot.'},
  {t:'step',k:'1',h3:'Alignment',p:'Connect on shared values, story and language first. Before anyone buys, they need to feel you are speaking to them, not at them.'},
  {t:'step',k:'2',h3:'Inspiration',p:'Move from the head to the heart. Case studies and transformation stories make the result feel possible for this person, not just for someone luckier.'},
  {t:'step',k:'3',h3:'Clarity',p:'Now go from heart to head. Spell out deliverables, bonuses and exactly where the journey starts and ends. Clarity dissolves the logical objections.'},
  {t:'step',k:'4',h3:'Opportunity',p:'The mechanics: pricing, payment options, the structure. Framed so the choice that is best for them is also the easy one to make.'},
  {t:'step',k:'5',h3:'Invitation',p:'A real call to action with an authentic deadline. Most people decide close to a deadline, so give them an honest one, never a fake one.'},
  {t:'content',eyebrow:'The thread through all five',h2:'Belief-centric marketing',p:'Every move above works only when it is anchored to a belief the audience already holds. Align the message to their core beliefs and the offer stops feeling like a pitch and starts feeling like the truth.'},
  {t:'content',eyebrow:'A rule most people get wrong',h2:'Bonuses answer the next objection, not a random want.',p:'A good bonus removes the obstacle the buyer hits AFTER the core transformation. Stacked-for-the-sake-of-it bonuses cheapen the offer. Purposeful ones make it inevitable.'},
  {t:'part',eyebrow:'Part three',h2:'Your offer, rebuilt in your own voice',p:'You do not need a bigger audience or a louder launch. You need an offer built in this order, in your own authentic voice.'},
  {t:'content',eyebrow:'The shift',h2:'From "how do I convince them" to "how do I help them decide".',p:'When the offer carries the belief, the inspiration, the clarity and the invitation, you get to stop performing and simply hold the door open.'},
  {t:'content',eyebrow:'Why me',h2:'I have built this with offers for over a decade.',p:'Former software developer and tennis coach, now 85+ product launches in. I help knowledge-based business owners find their true value and authentic voice, and build offers that attract the customers they actually want.'},
  {t:'content',eyebrow:'Recap',h2:'The whole method, in one line',p:'Align, inspire, clarify, give the opportunity, invite. Anchor every step to what your buyer already believes. Then let them sell themselves.'},
  {t:'cta',eyebrow:'Your next step',h2:'Ready to build the offer people say yes to?',p:'Come inside The Offer Academy and build your irresistible offer with me, step by step.',btn:'Join The Offer Academy',disclaimer:'This masterclass is for educational purposes only. No income or result is guaranteed. Results vary and depend on your own work, market and execution.'}
];
const wrap=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  let cls='slide';
  if(s.t==='title')cls+=' title-slide';
  if(s.t==='reframe')cls+=' mint-slide';
  if(s.t==='cta')cls+=' cta-slide';
  d.className=cls;
  let h='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.eyebrow)h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1)h+='<h1>'+s.h1+'</h1>';
  if(s.big)h+='<div class="big">'+s.big+'</div>';
  if(s.h2)h+='<h2>'+s.h2+'</h2>';
  if(s.t==='step'){h+='<div class="step"><div class="k">'+s.k+'</div><div><h3>'+s.h3+'</h3><p>'+s.p+'</p></div></div>';}
  else{
    if(s.h3)h+='<h3>'+s.h3+'</h3>';
    if(s.p)h+='<p'+((s.t==='title'||s.t==='reframe')?' class="lead"':'')+'>'+s.p+'</p>';
  }
  if(s.list){h+='<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  if(s.t==='title'||s.t==='part')h+='<div class="accentbar"></div>';
  if(s.t==='gap')h+='<div class="gap"><div class="dot"></div><span class="lbl">Where they are</span><div class="ln"></div><span class="lbl">Where they want to be</span><div class="dot b"></div></div>';
  if(s.btn)h+='<div><span class="cta-btn">'+s.btn+'</span></div>';
  if(s.disclaimer)h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  d.innerHTML=h;
  wrap.appendChild(d);
});
</script>
</body>
</html>
