<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winning Premium Clients Without Chasing Them — Charlotte Lloyd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9eef3;        /* light navy tint derived from her hero navy + brand gray (brand.json) */
    --panel:#fbfcfd;
    --ink:#0d4262;       /* deep navy — her hero ground (brand.json) */
    --ink-soft:#3a5a72;
    --rule:#d9d4c9;
    --accent:#fec84b;    /* gold — her h2/brand accent (brand.json) */
    --accent-deep:#082c42;
    --head:'Poppins',system-ui,sans-serif;
    --body:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--accent-deep);font-family:var(--body);color:var(--ink)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px}
  .slide{position:relative;background:var(--bg);border-radius:14px;padding:64px 64px;margin:0 0 26px;
    min-height:540px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 18px 50px rgba(8,44,66,.22)}
  .slide .sig{position:absolute;top:30px;right:34px;width:10px;height:10px;border-radius:50%;
    background:var(--accent);box-shadow:-20px 0 0 -3px var(--rule),-40px 0 0 -3px var(--rule)}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:12px;color:var(--ink-soft)}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;margin:18px 0 14px;color:var(--ink)}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;margin:14px 0 12px;color:var(--ink)}
  .lede{font-size:21px;line-height:1.5;color:var(--ink-soft);max-width:30ch}
  p{font-size:18px;line-height:1.55;color:var(--ink-soft);max-width:46ch;margin-top:10px}
  .rule{width:64px;height:4px;background:var(--accent);border-radius:3px;margin:6px 0 4px}
  .part{font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent-deep);background:var(--accent);
    display:inline-block;padding:7px 14px;border-radius:999px}
  ul{margin:16px 0 0 0;list-style:none;max-width:48ch}
  li{position:relative;padding-left:26px;font-size:18px;line-height:1.5;color:var(--ink-soft);margin:12px 0}
  li:before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .pillar-no{font-family:var(--head);font-weight:700;font-size:72px;color:var(--rule);line-height:1}
  .dark{background:var(--ink)}
  .dark h1,.dark h2{color:#fff}
  .dark .lede,.dark p{color:#cfe0ec}
  .dark .kicker{color:var(--accent)}
  .big{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.1;color:#fff;max-width:20ch}
  .big .a{color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .card h3{font-family:var(--head);font-size:19px;color:var(--ink);margin-bottom:6px}
  .card p{font-size:15.5px;margin-top:4px}
  .cta{background:var(--ink)}
  .btn{display:inline-block;margin-top:22px;background:var(--accent);color:var(--accent-deep);
    font-family:var(--head);font-weight:700;font-size:18px;padding:16px 28px;border-radius:999px}
  .disclaimer{margin-top:26px;font-size:13px;color:#9fb6c6;max-width:52ch}
  .cred{display:flex;gap:40px;margin-top:26px;flex-wrap:wrap}
  .cred div{max-width:16ch}
  .cred b{font-family:var(--head);font-size:30px;color:var(--ink);display:block}
  .cred span{font-size:14px;color:var(--ink-soft)}
  @media(max-width:640px){.slide{padding:40px 28px;min-height:auto}h1{font-size:34px}.big{font-size:36px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title'},
  {t:'trap'},
  {t:'reframe'},
  {t:'part',label:'Part One',h:'Why brilliant experts stay invisible'},
  {t:'text',k:'The ceiling',h:'Referrals are a great day. They are a terrible plan.',
    p:'Word of mouth rewards the work you already did. It cannot be turned up when you need more clients, and it quietly caps the kind of client who ever hears your name.'},
  {t:'text',k:'The wrong fix',h:'More hustle is not the answer.',
    p:'Most advice tells experts to grind harder: send 200 cold messages, chase, pressure, close. Premium buyers feel it instantly, and it repels the exact clients you want.'},
  {t:'part',label:'Part Two',h:'The Authority Conversion Architecture'},
  {t:'archi'},
  {t:'pillar',no:'01',k:'Pillar one',h:'Signal Intelligence',
    p:'Learn to read the buying signals a prospect is already giving you: the reply, the profile view, the saved post, the question under the question. You stop guessing who is ready and start reading it.'},
  {t:'pillar',no:'02',k:'Pillar two',h:'Conversion Infrastructure',
    p:'Build the simple system that captures interest and moves a prospect toward a decision, so warm attention never leaks away between a first touch and a booked conversation.'},
  {t:'pillar',no:'03',k:'Pillar three',h:'Precision Closing',
    p:'Run buyer-led conversations that close high-ticket work without a single pushy tactic. The buyer talks themselves into the decision because the conversation is built around them.'},
  {t:'text',k:'How it fits',h:'One architecture, not three tricks.',
    p:'Signals tell you who to focus on. Infrastructure makes sure their attention is never wasted. Precision Closing turns the conversation into a client. Together they replace luck with a system.'},
  {t:'part',label:'Part Three',h:'Running the architecture, week to week'},
  {t:'text',k:'The calm pipeline',h:'Predictable clients, without the chase.',
    p:'Instead of hoping a referral lands this month, you have a steady, repeatable path: the right prospects notice you, the right conversations get booked, and closing feels like a fit rather than a fight.'},
  {t:'cards'},
  {t:'cred'},
  {t:'text',k:'Who this is for',h:'Established experts ready for a system.',
    p:'This is built for coaches, consultants and fractional executives who are already excellent at the work and want client acquisition to stop depending on luck. It is not a hustle program and it is not for beginners chasing a quick trick.'},
  {t:'cta',disc:'This masterclass is educational. No income or result is guaranteed. Results vary and depend on your own work, offer and market.'}
];

function esc(x){return (x||'').toString()}
function render(s){
  if(s.t==='title') return `<div class="slide"><span class="sig"></span>
    <span class="kicker">Live Masterclass with Charlotte Lloyd</span>
    <h1>How to Win Premium Clients Without Chasing Them</h1>
    <div class="rule"></div>
    <p class="lede">The Authority Conversion Architecture: a calm, buyer-led system for predictable high-ticket clients.</p></div>`;
  if(s.t==='trap') return `<div class="slide"><span class="sig"></span>
    <span class="kicker">For established coaches, consultants and fractional executives</span>
    <h2>You are brilliant at the work. So why do clients still arrive by luck?</h2>
    <p>You deliver results your clients rave about. Yet the next client still depends on a referral, a lucky introduction, or a post that happened to travel. The quality of your work and the reliability of your pipeline are two different problems.</p></div>`;
  if(s.t==='reframe') return `<div class="slide dark"><span class="sig"></span>
    <span class="kicker">The reframe</span>
    <div class="big">Selling premium is not about being louder. It is about being <span class="a">impossible to ignore</span> to the right buyer.</div></div>`;
  if(s.t==='part') return `<div class="slide dark"><span class="sig"></span>
    <span class="part">${esc(s.label)}</span>
    <h2 style="margin-top:22px">${esc(s.h)}</h2></div>`;
  if(s.t==='text') return `<div class="slide"><span class="sig"></span>
    <span class="kicker">${esc(s.k)}</span><h2>${esc(s.h)}</h2><div class="rule"></div><p>${esc(s.p)}</p></div>`;
  if(s.t==='archi') return `<div class="slide"><span class="sig"></span>
    <span class="kicker">The method</span><h2>Three moves that replace referral luck</h2>
    <div class="rule"></div>
    <ul><li><b>Signal Intelligence:</b> read who is actually ready to buy.</li>
    <li><b>Conversion Infrastructure:</b> never waste warm attention.</li>
    <li><b>Precision Closing:</b> close high-ticket without pressure.</li></ul></div>`;
  if(s.t==='pillar') return `<div class="slide"><span class="sig"></span>
    <div class="pillar-no">${esc(s.no)}</div>
    <span class="kicker">${esc(s.k)}</span><h2>${esc(s.h)}</h2><div class="rule"></div><p>${esc(s.p)}</p></div>`;
  if(s.t==='cards') return `<div class="slide"><span class="sig"></span>
    <span class="kicker">A week inside the system</span><h2>The pipeline, running quietly</h2>
    <div class="grid">
      <div class="card"><h3>You get noticed</h3><p>The right prospects see the right positioning and raise a hand first.</p></div>
      <div class="card"><h3>You read the signal</h3><p>You know who is ready and spend your time only there.</p></div>
      <div class="card"><h3>You have the conversation</h3><p>A buyer-led call where the fit is obvious to both sides.</p></div>
      <div class="card"><h3>You enrol the client</h3><p>No chasing, no discounting, no pressure. A clean yes.</p></div>
    </div></div>`;
  if(s.t==='cred') return `<div class="slide"><span class="sig"></span>
    <span class="kicker">Why learn this from me</span><h2>Two decades closing at the highest level</h2>
    <div class="rule"></div>
    <p>I spent years as a Regional Director in sales at the Financial Times and generated more than twenty million dollars in B2B revenue, then built my own seven-figure consulting business, primarily through LinkedIn. This is the system I used.</p>
    <div class="cred">
      <div><b>$20M+</b><span>B2B revenue generated</span></div>
      <div><b>20+ yrs</b><span>at the top of sales</span></div>
      <div><b>7-figure</b><span>consulting business, built on LinkedIn</span></div>
    </div></div>`;
  if(s.t==='cta') return `<div class="slide cta"><span class="sig"></span>
    <span class="kicker">Your next step</span>
    <h2 style="color:#fff">Ready to build your own predictable pipeline?</h2>
    <p style="color:#cfe0ec">Bring your questions to the live room, then book a short introductory call to see how the Authority Conversion Architecture fits your business.</p>
    <span class="btn">Book your introductory call</span>
    <div class="disclaimer">${esc(s.disc)}</div></div>`;
  return '';
}
document.getElementById('deck').innerHTML = S.map(render).join('');
</script>
</body>
</html>
