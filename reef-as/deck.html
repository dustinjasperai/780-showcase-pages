<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Emotion Exchange — Mad Genius Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090f; --panel:#121725; --rule:#253049; --accent:#0072ef;
    --ink:#f5f5f7; --muted:#9aa3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 48px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .eyebrow{font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:46px;line-height:1.06;letter-spacing:-.01em;margin-bottom:16px}
  h2{font-family:'Montserrat',sans-serif;font-weight:800;font-size:34px;line-height:1.1;margin-bottom:14px}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:62ch}
  p.sub{color:var(--muted);font-size:19px;margin-top:6px}
  .big{font-family:'Montserrat',sans-serif;font-weight:800;font-size:40px;line-height:1.12;letter-spacing:-.01em}
  ul{list-style:none;margin-top:14px}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:3px}
  .num{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;color:var(--accent);margin-bottom:10px}
  .foot{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--muted);letter-spacing:.08em;font-family:'Montserrat',sans-serif}
  .disclaimer{margin-top:22px;font-size:13px;color:var(--muted);max-width:70ch}
  .cta-line{font-family:'Montserrat',sans-serif;font-weight:600;color:var(--accent);font-size:20px;margin-top:14px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A Mad Genius Masterclass',h:'The Emotion Exchange',sub:'How health and wellness experts become the voice people remember and act on.'},
 {t:'promise',eyebrow:'What this hour gives you',h:'A new way to be heard',body:'You already know your craft. In the next hour you will learn why knowledge alone does not move people, and the exact shift that makes an audience feel, trust, and buy.'},
 {t:'for',eyebrow:'Who this is for',h:'You are the most knowledgeable person in the room',body:'And they still scroll past. You have the credentials, the results, and the content. Yet the feed rewards people with half your expertise and twice your presence.'},
 {t:'hook',eyebrow:'The uncomfortable truth',big:'Information does not move people. Emotion does.',sub:'Every time you lead with facts, you are competing on the one thing your audience can get anywhere.'},
 {t:'part',num:'Part One',h:'The Information Trap'},
 {t:'body',eyebrow:'Why experts get ignored',h:'Expertise makes you accurate, not unforgettable',body:'We are trained to inform. So we open with the what and the how, and we save the feeling for never. But people do not remember what you taught them. They remember how you made them feel while you taught it.'},
 {t:'body',eyebrow:'The cost',h:'The quiet price of being forgettable',body:'Fewer bookings. Flat launches. Talks that get polite applause and no action. It is not a knowledge gap. It is an emotion gap, and it is fixable.'},
 {t:'part',num:'Part Two',h:'The Emotion Exchange Method'},
 {t:'body',eyebrow:'The core idea',big:'Communication is not an information exchange. It is an emotion exchange.',sub:'Five moves turn what you already know into something people feel.'},
 {t:'pillar',num:'01',h:'Persona Development',body:'Find the most distinctive, expressive version of you, the one that has been hiding under years of professional conditioning, and let it lead the room.'},
 {t:'pillar',num:'02',h:'Disruptive Messaging',body:'Break the pattern your audience expects. A message that interrupts the scroll earns the attention that a polished, predictable one never will.'},
 {t:'pillar',num:'03',h:'Audience Investment',body:'Move people from informed to invested. When an audience feels something is at stake for them, they lean in, they stay, and they act.'},
 {t:'pillar',num:'04',h:'Emotional Storytelling',body:'Carry your point inside a story that makes people feel it in their body. The idea they feel is the idea they keep.'},
 {t:'pillar',num:'05',h:'Performance Mastery',body:'Borrow the craft of the stage and the camera. Presence, timing, and delivery are learnable skills, and they are what separate the expert nobody notices from the one everybody quotes.'},
 {t:'part',num:'Part Three',h:'When the Room Leans In'},
 {t:'body',eyebrow:'The shift',h:'From the smartest in the room to the most felt',body:'Your talks land. Your posts get saved and sent. Strangers who have never met you feel like they already know you, and they show up ready to work with you.'},
 {t:'why',eyebrow:'Why learn this from me',h:'A psychiatrist who also performs',body:'I am a double board certified psychiatrist with a background in neuroscience and existential psychology, and an award winning television host, writer, and actor. The Emotion Exchange is where the science of why people feel meets the craft of how to deliver it.'},
 {t:'cta',eyebrow:'Your next step',h:'Unlock your Mad Genius',body:'If you are ready to become the most distinctive voice in your field, the Mad Genius programs are where we build it together, step by step.',cta:'Apply to work with Mad Genius',disc:'Educational content only. No income, revenue, or specific result is guaranteed. Results vary based on your effort, experience, and market.'}
];
const d=document.getElementById('deck');
S.forEach((s,i)=>{
 const el=document.createElement('section');el.className='slide';
 let h='';
 if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
 if(s.num && s.t==='part') h+=`<div class="num">${s.num}</div>`;
 if(s.num && (s.t==='pillar')) h+=`<div class="num">${s.num}</div>`;
 if(s.big) h+=`<div class="big">${s.big}</div>`;
 if(s.h) h+= s.t==='title'?`<h1>${s.h}</h1>`:`<h2>${s.h}</h2>`;
 if(s.sub) h+=`<p class="sub">${s.sub}</p>`;
 if(s.body) h+=`<p>${s.body}</p>`;
 if(s.items){h+='<ul>';s.items.forEach(x=>h+=`<li>${x}</li>`);h+='</ul>';}
 if(s.cta) h+=`<div class="cta-line">${s.cta}</div>`;
 if(s.disc) h+=`<div class="disclaimer">${s.disc}</div>`;
 h+=`<div class="foot">Mad Genius &nbsp;&middot;&nbsp; ${i+1} / ${S.length}</div>`;
 el.innerHTML=h;d.appendChild(el);
});
</script>
</body>
</html>
