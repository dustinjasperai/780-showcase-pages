<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Evolved Method — a live masterclass for veterinarians</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f5;        /* warm off-white, from her white body ground warmed toward brand sand #e1dbc8 */
    --panel:#eaf3ef;     /* brand mint #d0ebe3 lightened */
    --sand:#e1dbc8;      /* her button ground, used directly */
    --accent:#2e6b5e;    /* brand mint #d0ebe3/#cdece4 darkened + saturated to AA strength */
    --ink:#1c2b27;       /* near-black warmed toward teal */
    --muted:#595959;     /* her body-text grey */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Poppins",system-ui,sans-serif;line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 72px}
  .slide{background:#ffffff;border:1px solid #e7e4da;border-radius:14px;
    padding:44px 48px;margin:22px 0;box-shadow:0 1px 0 rgba(28,43,39,.04)}
  .slide.title{background:var(--accent);color:#f6fbf9;border-color:var(--accent)}
  .slide.hook{background:var(--ink);color:#f3f6f4;border-color:var(--ink)}
  .kick{font-family:"Poppins";font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 14px}
  .slide.title .kick,.slide.hook .kick{color:#bfe0d6}
  h1,h2,h3{font-family:"Libre Baskerville",Georgia,serif;font-weight:700;margin:0 0 16px;line-height:1.18}
  h1{font-size:40px}
  h2{font-size:28px}
  h3{font-size:20px}
  p{font-size:17px;color:var(--ink);margin:0 0 14px}
  .slide.title p,.slide.hook p{color:#eaf3ef}
  .lead{font-size:19px}
  .muted{color:var(--muted)}
  ul{margin:8px 0 0;padding:0 0 0 20px}
  li{font-size:17px;margin:0 0 10px}
  .num{font-family:"Libre Baskerville",serif;font-size:26px;color:var(--accent);margin:0 0 6px}
  .ecg{height:40px;width:100%;margin:10px 0 2px;display:block}
  .pill{display:inline-block;background:var(--panel);color:var(--accent);
    font-weight:600;font-size:13px;padding:5px 12px;border-radius:999px;margin:2px 6px 2px 0}
  .disclaimer{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.5}
  .cta-line{font-family:"Libre Baskerville",serif;font-size:22px;color:#f6fbf9;margin:10px 0 4px}
  .foot{max-width:960px;margin:0 auto;padding:0 20px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<div class="foot">The Evolved Vets &middot; Dr. Bethany Weinheimer, DVM</div>
<script>
const S=[
  {t:'title', kick:'A live masterclass for veterinarians', h:'The Evolved Method',
   p:'Reviving the veterinarian, not just the patient. A live session for women in veterinary medicine ready to recover from burnout and build a career that feels as good on the inside as it looks on the outside.',
   ecg:true},

  {t:'content', kick:'Who this is for', h:'You still love medicine. You just cannot keep surviving it.',
   p:'This is for the veterinarian who:',
   bullets:[
     'Feels anxiety and dread in her body before a shift.',
     'Leaves work drained and carries the emotional toll home for days.',
     'Wonders if she is really making the impact she dreamed of, stuck in assembly-line medicine.'],
   foot:'You are not broken, and you are not alone. There is a life on the other side of this.'},

  {t:'content', kick:'The trap', h:'You were told the fix was more discipline.',
   p:'Set better boundaries. Manage your time. Maybe change jobs, or leave the profession entirely. You tried the boundaries. You read the books. For a week or two it helped, and then the dread came back.',
   foot:'That is not a willpower failure. It is a sign the real problem was never on your calendar.'},

  {t:'hook', kick:'The reframe', h:'Burnout is not a scheduling problem. It is a nervous-system problem.',
   p:'Emergency medicine trains your body to live in survival mode. The alarm that keeps you sharp on a crashing patient never fully stands down, so it runs your whole life. You cannot think your way out of a state your body is stuck in.'},

  {t:'content', kick:'Part one, the core problem', h:'Survival mode becomes your baseline.',
   p:'When the nervous system stays switched on, exhaustion stops being a bad week and becomes who you think you are. Your beliefs harden around it: I have to carry this. Rest is for people who care less. If I slow down it all falls apart.',
   foot:'Those beliefs feel like truth. They are survival-mode software, and software can be rewritten.'},

  {t:'content', kick:'Part one, the root cause', h:'Two things are out of alignment.',
   p:'Your physiology, stuck in a stress response that never resets. And your values, buried under everyone else’s expectations until the work no longer connects to why you became a veterinarian in the first place.',
   foot:'Fix one without the other and the relief never lasts. The Evolved Method works on both.'},

  {t:'framework', kick:'Part two, the framework', h:'The Evolved Method',
   p:'A three-phase path that bridges the science of stress with the art of a sustainable career. Grounded in neuroscience, emotional intelligence, and veterinary leadership.',
   pills:['Meditation','Elevation','Integration']},

  {t:'phase', kick:'Phase one', num:'1', h:'Meditation, create safety in the body',
   p:'Before any mindset work, we settle the nervous system and build a connection to what lives in the subconscious brain. You cannot reframe a belief while your body is still bracing for the next code. Safety comes first.'},

  {t:'phase', kick:'Phase two', num:'2', h:'Elevation, rewire survival-mode beliefs',
   p:'Using the principles of neuroplasticity, we find the root belief driving the burnout and rewire it. This is where I have to carry everything becomes I get to choose what I carry, at the level your brain actually believes it.'},

  {t:'phase', kick:'Phase three', num:'3', h:'Integration, protect your energy for good',
   p:'We turn the shift into habits, feelings, and systems that protect your energy, plus the personalized somatic tools that reset your nervous system in real time, on a real shift, not just on a meditation cushion.'},

  {t:'content', kick:'Your compass', h:'Your values are the way back.',
   p:'Burnout is, underneath everything, a values misalignment. When we uncover your unique values they become the compass that tells you which opportunities to say yes to and which drain you. Alignment is not a feeling you wait for. It is a decision you can learn to make.'},

  {t:'content', kick:'The shift', h:'Energy over effort.',
   p:'You were taught to lead from effort: push harder, give more, run on fumes and call it dedication. An evolved vet leads from energy instead. The same career, the same patients, a completely different experience of doing the work.'},

  {t:'content', kick:'Part three, the result', h:'A regulated veterinarian is a better one.',
   p:'You still run the crash cart. You are still brilliant at your job. The difference is that you come home with something left for your own life. The dread quiets. The impact you wanted is finally something you can feel, not just something you perform.'},

  {t:'content', kick:'Why me', h:'I have run the code on myself.',
   p:'I am Dr. Bethany Weinheimer, an emergency veterinarian. I have opened and managed more than 15 multi-million-dollar hospitals and developed dozens of veterinary leaders. I also hit the bottom of burnout myself and nearly walked away from medicine.',
   foot:'I built The Evolved Vets so the way back I had to find alone is a path you can walk on purpose.'},

  {t:'content', kick:'Who this is not for', h:'Honesty first.',
   p:'This is not a quick hack, and it is not a reason to blame your hospital for everything. It is for the veterinarian willing to do real inner work over real time. If you want someone to tell you the answer is simply a new job, this is not it.'},

  {t:'cta', kick:'Your next step', h:'Start your reset.',
   ctaLine:'Book your free Alignment Call with Dr. Beth.',
   p:'We will look at where you are, what is actually driving the burnout, and whether the Code Blue Coaching journey is the right fit for you. No pressure, just a real conversation.',
   disclaimer:'Educational content only. The Evolved Method is a coaching program, not medical, psychological, or mental-health treatment. Coaching outcomes vary from person to person and no specific result is promised or guaranteed. If you are in crisis, please contact a licensed professional or an emergency service.'}
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const ECG='<svg class="ecg" viewBox="0 0 600 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20 H230 l12 -14 l14 28 l12 -24 l10 18 H330 l16 -16 l14 16 H600" fill="none" stroke="#bfe0d6" stroke-width="2.5"/></svg>';
const deck=document.getElementById('deck');
S.forEach(function(s){
  const el=document.createElement('section');
  el.className='slide'+(s.t==='title'?' title':'')+(s.t==='hook'?' hook':'')+(s.t==='cta'?' title':'');
  let h='';
  if(s.kick) h+='<p class="kick">'+esc(s.kick)+'</p>';
  if(s.num) h+='<div class="num">'+esc(s.num)+'</div>';
  if(s.h) h+=(s.t==='title'||s.t==='cta'?'<h1>':'<h2>')+esc(s.h)+(s.t==='title'||s.t==='cta'?'</h1>':'</h2>');
  if(s.ctaLine) h+='<p class="cta-line">'+esc(s.ctaLine)+'</p>';
  if(s.p) h+='<p class="'+(s.t==='title'||s.t==='cta'?'lead':'')+'">'+esc(s.p)+'</p>';
  if(s.bullets){h+='<ul>';s.bullets.forEach(function(b){h+='<li>'+esc(b)+'</li>';});h+='</ul>';}
  if(s.pills){s.pills.forEach(function(p){h+='<span class="pill">'+esc(p)+'</span>';});}
  if(s.foot) h+='<p class="muted">'+esc(s.foot)+'</p>';
  if(s.ecg) h+=ECG;
  if(s.disclaimer) h+='<p class="disclaimer">'+esc(s.disclaimer)+'</p>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
