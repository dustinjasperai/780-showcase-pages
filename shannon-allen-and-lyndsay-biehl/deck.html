<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Plan Like a CEO, Farm Like a Boss · The Dirt on Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Familjen+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbf3e8; --panel:#f4e6d4; --rule:#e7d2b8;
    --acc:#e1722f; --ink:#3f2113; --body:#5c4530; --dim:#9a7f63; --cream:#fbf3e8;
  }
  html,body{height:100%}
  body{background:#f0e2cf;font-family:'Familjen Grotesk',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f0e2cf}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Familjen Grotesk',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:5.2vw;max-width:92%}
  .t-normal h1{font-size:3.4vw;max-width:90%}
  .t-normal .body{font-family:'Familjen Grotesk',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.62;font-weight:400}
  .sub{font-family:'Newsreader',serif;font-size:2.1vw;color:var(--acc);margin-top:3.4vh;max-width:82%;line-height:1.4;font-weight:400;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Familjen Grotesk',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:5.0vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#3a2415 0%,#241609 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#3a2415 0%,#241609 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.0vw;max-width:84%;color:var(--cream)}
  .t-cta .body{font-family:'Familjen Grotesk',sans-serif;color:#efd9c1;font-size:1.42vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.5%;bottom:8%;width:15vw;opacity:.92}
  .corner-vf{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.55}
  .brandline{font-family:'Familjen Grotesk',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.04em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(63,33,19,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Dirt on Flowers</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a single line-drawn sprout, two leaves on a stem, drawn in terracotta (rows in the field) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#e1722f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 104 V44" opacity="0.9"/>
    <path d="M60 70 C60 54 46 46 32 46 C32 62 44 70 60 70 Z" opacity="0.85"/>
    <path d="M60 60 C60 44 74 36 88 36 C88 52 76 60 60 60 Z" opacity="0.85"/>
    <circle cx="60" cy="34" r="7" opacity="0.9"/>
    <path d="M40 108 H80" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Plan Like a CEO, Farm Like a Boss',sub:'How to turn a beautiful flower farm into a business that actually pays you.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You can grow the flowers. Making the farm pay you is the part no one taught you.',body:'Your blooms are gorgeous, the market table sells out, and the weddings keep coming. But somehow, at the end of the season, there is almost nothing left. The growing was never the problem. The business behind it is.'},
 {t:'dark',title:'A sold-out market table is not the same as a farm that pays you.'},

 {t:'section',idx:'Part One',title:'Why Beautiful Farms Go Broke'},
 {t:'normal',k:'10 percent flowers, 90 percent dirt',title:'Growing the flowers is the easy 10 percent.',body:'The other 90 percent is pricing, the numbers, marketing, labor, and knowing when to say no. That is the part that decides whether a farm survives, and it is the part almost nobody teaches, because it is not the pretty part.'},
 {t:'normal',k:'The preference trap',title:'Most farms are run on preference, not on profit.',body:'We grow what we love, price by what feels polite, and say yes to every request. The beds fill up, the calendar fills up, and the farm quietly fills up with work that does not actually pay. Busy starts to feel like the same thing as successful.'},
 {t:'dark',title:'You did not start a farm to work harder every year for less.'},

 {t:'section',idx:'Part Two',title:'Run the Farm Like a CEO'},
 {t:'normal',k:'Decide on profit, not preference',title:'A CEO chooses crops and customers by what pays.',body:'Same beds, same hours, but planted and sold around margin instead of around what is fun to grow. The prettiest crop and the profitable crop are not always the same one, and knowing the difference is most of the job.'},
 {t:'normal',k:'The five pillars',title:'A farm runs on five things, and each one on purpose.',body:'Business and accounting, sales and marketing, growing and farming, efficiency, and mindset. Most farmers run one of these well and hope the other four sort themselves out. A farm that pays you runs all five on purpose.'},
 {t:'normal',k:'Price like you mean it',title:'If the price scares you a little, it is probably close to right.',body:'Price on your real costs plus a profit you can live on, not on what you are afraid the customer will say. A full calendar at the wrong price is not a good year. It is just a tiring one.'},
 {t:'normal',k:'Protect the grower',title:'Boundaries are a business decision, not a luxury.',body:'This is the honest part nobody puts on Instagram: the burnout, the seasons that fail, the family time the farm quietly eats. A plan and a real price protect the grower, not just the harvest. The farm needs you to still want to do this next year.'},
 {t:'dark',title:'Profit is not greed. It is what lets you do this again next season.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Farm Like a Boss'},
 {t:'normal',k:'The farm this builds',title:'Fewer crops, better customers, and money left at the end of the season.',body:'You grow less of what does not pay and more of what does. You sell to people who value the work instead of haggling with people who do not. And a quiet month stops being a crisis, because the plan and the pricing are holding, not just your willingness to hustle harder.'},
 {t:'dark',title:'The goal was never more flowers. It was a farm that pays you to keep going.'},
 {t:'normal',k:'Why Shannon and Lyndsay',title:'Two working flower farmers who learned this the hard way.',body:'Shannon grew Bloom Hill Farm from a quarter acre to eighteen acres, starting with zero farming knowledge. Lyndsay has worked with plants since she was sixteen and runs Wildroot Flower Co. The Dirt on Flowers is the honest version of how a beautiful farm becomes a real business.'},

 {t:'section',idx:'Your Next Step',title:'Farm Like It Is a Business'},
 {t:'normal',k:'Keep going with The Dirt on Flowers',title:'The whole system, from your first profitable season to a farm that lasts.',body:'The Insiders is where the five pillars become templates, real numbers, and monthly coaching with two farmers who have done it. Start free with the podcast, and join The Insiders when you are ready to run the whole thing on purpose.'},
 {t:'cta',title:'Ready to build a flower farm that pays you?',body:'Take the next step with The Dirt on Flowers.',chips:['Listen to the podcast','Join The Insiders'],disc:'Educational content for working and aspiring flower farmers. No income or profit result is guaranteed. Results vary by farm, market, region, and season.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Dirt on <b>Flowers</b> · Shannon &amp; Lyndsay</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
