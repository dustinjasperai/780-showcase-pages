<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Authority Voice: a masterclass with Janeen Vosper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1b1a4c; --panel:#232160; --rule:#3a3780;
    --accent:#e26a28; --ink:#ffffff; --ink-soft:#d7d6ea; --ink-muted:#9a99c4;
  }
  html,body{height:100%}
  body{font-family:'Work Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:980px}
  .slide.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:20px}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:clamp(34px,6vw,64px);line-height:1.08;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:clamp(26px,4.2vw,44px);line-height:1.15;margin-bottom:20px}
  .lead{font-size:clamp(18px,2.4vw,24px);color:var(--ink-soft);line-height:1.55;max-width:760px}
  .underline{box-shadow:inset 0 -.42em 0 rgba(226,106,40,.35)}
  ul{list-style:none;margin-top:14px}
  li{font-size:clamp(17px,2.1vw,22px);color:var(--ink-soft);line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:12px;height:2px;background:var(--accent)}
  li b{color:var(--ink);font-weight:600}
  .big{font-family:'Newsreader',Georgia,serif;font-size:clamp(40px,8vw,96px);font-weight:700;color:var(--accent);line-height:1}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 34px;margin-top:10px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .two .panel{margin-top:0}
  .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px}
  .disc{font-size:13px;color:var(--ink-muted);line-height:1.5;margin-top:26px;max-width:700px}
  .cta-line{display:inline-block;margin-top:14px;font-size:clamp(18px,2.3vw,22px);color:var(--ink);font-weight:600;border-bottom:2px solid var(--accent);padding-bottom:4px}
  #nav{position:fixed;bottom:22px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px;font-family:'Work Sans',sans-serif}
  #nav button{background:var(--panel);border:1px solid var(--rule);color:var(--ink-soft);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px}
  #nav button:hover{border-color:var(--accent);color:var(--ink)}
  #count{font-size:13px;color:var(--ink-muted);letter-spacing:.08em;min-width:62px;text-align:center}
  .brandmark{position:fixed;top:22px;left:28px;font-family:'Spectral',serif;font-size:14px;letter-spacing:.06em;color:var(--ink-muted)}
  .brandmark b{color:var(--ink)}
  @media(max-width:680px){.two{grid-template-columns:1fr}#stage{padding:8vh 7vw 12vh}}
</style>
</head>
<body>
<div class="brandmark"><b>Speech Perfect</b> &middot; Janeen Vosper</div>
<div id="stage"></div>
<div id="nav"><button id="prev" aria-label="Previous">&#8592;</button><span id="count"></span><button id="next" aria-label="Next">&#8594;</button></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Janeen Vosper', h1:'The Authority Voice', lead:'How to sell and speak as the trusted expert in your field, without ever sounding "salesy".'},

  {t:'who', kicker:'Who this is for', h2:'You are brilliant at the work. Selling it is the part you dread.', lead:'This is for consultants, professionals and business owners who know their craft cold, yet go quiet the moment it is time to pitch, present, or ask for the sale.'},

  {t:'trap', kicker:'The trap', h2:'The best expert in the room rarely wins the room.', lead:'The person who speaks with confidence and sells without apology is the one people remember, trust, and buy from. Expertise alone stays invisible.'},

  {t:'reframe', kicker:'The reframe', h1:'Selling is not pushing.', lead:'Done well, selling is the most generous form of service. It helps the right person say yes to the help they already need. That shift changes everything that follows.'},

  {t:'part', kicker:'Part one', h2:'Why "good" people stay quiet', lead:'The real problem is not skill. It is the belief that selling and self-promotion are pushy, so you soften, hedge, and wait to be chosen.'},

  {t:'cost', kicker:'The cost', h2:'The silent expert', lead:'Every week the quiet expert loses work to someone less qualified but more willing to speak up. The gap is not talent. It is voice.', big:'', bigcap:''},

  {t:'part', kicker:'Part two', h2:'The Good Girls Do Sell method', lead:'Five shifts that let you sell and speak as yourself: authentic, clear, and unmistakably the authority.'},

  {t:'pillar', tag:'Shift one', h2:'Sell from service, not a script', lead:'Lead with the outcome your buyer wants, not a pitch. When the conversation is about them, "selling" stops feeling like selling and starts feeling like help.'},

  {t:'pillar', tag:'Shift two', h2:'Your voice is your authority', lead:'Pace, pause and tone carry more credibility than the words. We cut the filler words and nervous habits that quietly tell people you are unsure.'},

  {t:'pillar', tag:'Shift three', h2:'Phrase and word anchors', lead:'Prepare the few lines that must land. The way you describe what you do, the way you handle the price question, so the right words arrive under pressure.'},

  {t:'pillar', tag:'Shift four', h2:'Own your speaking space', lead:'Stance, stillness and purposeful gesture tell a room you belong at the front of it. Presence is a skill, not a personality type, and it is teachable.'},

  {t:'pillar', tag:'Shift five', h2:'Rapport before you pitch', lead:'Connect first, convert second. A short, genuine moment of rapport earns you the right to make the ask, and it makes the yes feel easy.'},

  {t:'part', kicker:'Part three', h2:'The authority voice, applied', lead:'Put the five shifts together and the same expert, with the same offer, becomes the obvious choice.'},

  {t:'ba', kicker:'Before and after', h2:'Same expertise, different outcome', two:[
    {tag:'Before', body:'Waits to be noticed. Discounts to win. Freezes when asked "so what do you do?" and leaves the room forgettable.'},
    {tag:'After', body:'Speaks with calm authority. Names the value. Answers the price question cleanly and is remembered as the expert to call.'}
  ]},

  {t:'why', kicker:'Why learn this from Janeen', h2:'Three decades of selling and speaking', lead:'Janeen Vosper founded Speech Perfect in 2007 after 20+ years as General Manager of Sales for a national, multi-million-dollar business. She is a Fellow of ITC and an ITC Corporate Trainer, host of the We Are Women podcast, and author of Good Girls Do Sell and Being Unstoppable.'},

  {t:'recap', kicker:'The method, in one view', h2:'Five shifts to the authority voice', lead:'Sell from service. Use your voice. Anchor the words that matter. Own the space. Build rapport first. That is how authentic people sell more and speak as the authority.'},

  {t:'cta', kicker:'Your next step', h1:'Ready to find your authority voice?', lead:'If you want to sell and speak as the expert you already are, the next step is a short conversation about where your voice is costing you work, and how quickly that can change.', cta:'Book a call with Janeen at janeenvosper.com', disc:'This masterclass is educational. It shares communication and sales strategies, not income, revenue, or business-result guarantees. Outcomes depend on your own effort, market and circumstances.'}
];

const stage=document.getElementById('stage');
let i=0;
function render(){
  const s=S[i];
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${s.kicker}</div>`;
  if(s.h1) inner+=`<h1>${s.h1}</h1>`;
  if(s.h2) inner+=`<h2>${s.h2}</h2>`;
  if(s.tag && !s.h2) inner+=`<div class="tag">${s.tag}</div>`;
  if(s.tag && s.h2) inner=inner.replace('<h2>',`<div class="tag">${s.tag}</div><h2>`);
  if(s.lead) inner+=`<p class="lead">${s.lead}</p>`;
  if(s.two){ inner+='<div class="two">'; s.two.forEach(p=>{inner+=`<div class="panel"><div class="tag">${p.tag}</div><p class="lead">${p.body}</p></div>`;}); inner+='</div>'; }
  if(s.cta) inner+=`<div><span class="cta-line">${s.cta}</span></div>`;
  if(s.disc) inner+=`<p class="disc">${s.disc}</p>`;
  stage.innerHTML=`<div class="slide on">${inner}</div>`;
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
