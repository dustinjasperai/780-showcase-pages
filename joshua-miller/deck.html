<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Human Intelligence Advantage — Joshua Miller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Zilla+Slab:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131210; --panel:#1e1c18; --ink:#f4f1ea; --rule:#35322c;
    --accent:#e02b20; --muted:#9a948a;
    --head:'Montserrat',system-ui,sans-serif; --body:'Zilla Slab',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center}
  .kick{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.05;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.1;margin:0 0 16px}
  p{font-size:20px;line-height:1.5;margin:0 0 14px;max-width:44ch}
  .lead{font-size:24px;color:var(--ink)}
  .big{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.12;max-width:20ch}
  .a{color:var(--accent)}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.4;padding:10px 0;border-bottom:1px solid var(--rule);
    display:flex;gap:14px}
  li b{font-family:var(--head);color:var(--accent);min-width:1.4em}
  .two{display:flex;gap:28px;flex-wrap:wrap}
  .two .col{flex:1;min-width:220px;border-top:3px solid var(--accent);padding-top:14px}
  .foot{font-family:var(--head);font-size:12px;color:var(--muted);letter-spacing:.06em;
    margin-top:28px;text-transform:uppercase}
  .disc{font-size:14px;color:var(--muted);max-width:60ch;margin-top:18px}
  .cta h1{color:var(--ink)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass for senior leaders',
   h:'The Human Intelligence Advantage',
   p:'Leading When the Machine Can Think For You.',
   foot:'Joshua Miller · Master Certified Executive Coach (ICF)'},

  {t:'intro', kick:'Who this is for',
   h:'You ship more decisions, faster than ever.',
   p:'You run teams that lean on AI for the analysis, the draft, the recommendation. The work looks sharper. And a quiet voice keeps asking the same question: were those decisions actually yours?'},

  {t:'hook', kick:'The uncomfortable part',
   big:'AI doesn\'t replace leaders. It reveals which ones were <span class="a">replaceable.</span>'},

  {t:'part', kick:'Part One', h:'The problem: Cognitive Atrophy',
   p:'The erosion of thinking, judgment, and decision ownership that happens quietly, while your output has never looked better.'},

  {t:'statement', kick:'The core idea',
   big:'<span class="strike">Better outputs.</span> <span class="a">Worse thinking.</span>',
   p:'Cognitive Atrophy is what happens when convenience replaces cognitive effort. Remove the friction from the work and you remove the mental engagement that kept your judgment sharp.'},

  {t:'list', kick:'The Cognitive A.T.R.O.P.H.Y. Model', h:'Seven signals of decline',
   items:[
     ['A','Automation Dependence'],
     ['T','Thinking Reduction'],
     ['R','Reasoning Decline'],
     ['O','Ownership Erosion'],
     ['P','Pattern Reliance'],
     ['H','Human Judgment Weakens'],
     ['Y','Yielding to the Machine']
   ]},

  {t:'split', kick:'Two leaders are emerging',
   left:['Uses AI to think','Accepts the recommendation, loses the reasoning, cannot reconstruct the call later.'],
   right:['Uses AI to sharpen thinking','Keeps a hand on the judgment, knows where the tool stopped and they started.']},

  {t:'statement', kick:'Why this matters now',
   big:'By 2027, most executive decisions will lean on AI.',
   p:'Which makes human judgment, empathy, and ethics the thing that actually separates one leader from the next. The question is whose judgment is left to tell the difference.'},

  {t:'part', kick:'Part Two', h:'The cure: the three capabilities AI can\'t replace',
   p:'The Human Intelligence Advantage is built on three capabilities that build in sequence. Together they are the one thing a machine cannot do for you.'},

  {t:'list', kick:'The Human Intelligence Advantage', h:'Awareness · Adaptability · Authenticity',
   items:[
     ['1','Awareness: understanding yourself before you automate'],
     ['2','Adaptability: flexing through uncertainty with curiosity'],
     ['3','Authenticity: leading with what makes you irreplaceably human']
   ]},

  {t:'detail', kick:'Capability one', h:'Awareness',
   p:'Understanding yourself before you automate. Most leaders hand a decision to AI before they have named what they actually believe about it. Awareness is the habit of surfacing your own reasoning first, so the tool serves your judgment instead of standing in for it.'},

  {t:'detail', kick:'Capability two', h:'Adaptability',
   p:'Flexing through uncertainty with curiosity. The leaders who thrive treat a changing landscape as a question to explore, not a threat to defend against. Adaptability keeps you moving when the map the machine drew stops matching the ground.'},

  {t:'detail', kick:'Capability three', h:'Authenticity',
   p:'Leading with what makes you irreplaceably human. Empathy, ethics, the ability to own a hard call in front of people who will live with it. This is the ground AI cannot stand on, and it is where your authority as a leader actually lives.'},

  {t:'part', kick:'Part Three', h:'Three practices, not a motivational idea',
   p:'Repeatable moves that turn the framework into a habit you can measure, the kind you still run on a Friday afternoon when the quarter is on fire.'},

  {t:'detail', kick:'Practice one', h:'The Removal Test',
   p:'Take one real decision you made with AI. Close every tab and rebuild it out loud: three questions, no tool open. Then score it against four points, so you leave with a number you can retest in ninety days, not a feeling.'},

  {t:'detail', kick:'Practice two', h:'Decision Tracing',
   p:'Make your reasoning visible in ninety seconds. What shaped the conclusion, which assumptions you leaned on, where the AI informed the call and where you actually decided. One rep, one measure, each week.'},

  {t:'detail', kick:'Practice three', h:'The Final Signature',
   p:'AI can analyze and recommend. It cannot own the consequences. The Final Signature is the single question that keeps every decision yours: if this goes wrong, can I explain, in my own words, why I chose it?'},

  {t:'why', kick:'Why learn this from me', h:'Twenty-five years inside the room',
   p:'I have coached leaders at Google, Amazon, PayPal, Deloitte, Cisco, the NFL, and the U.S. Navy. Before coaching I led creative strategy for Fortune 100 brands. I am a Master Certified Executive Coach, a TEDx speaker, and the LinkedIn Learning instructor whose AI-era judgment curriculum has reached more than a million learners.'},

  {t:'recap', kick:'The advantage, in one line',
   big:'Lead what AI <span class="a">can\'t.</span>',
   p:'Diagnose the atrophy. Build the three capabilities. Keep your signature on every decision that matters.'},

  {t:'cta', cls:'cta', kick:'Your next step', h:'Request a strategy call',
   p:'If you want to bring the Human Intelligence Advantage to yourself or your leadership team, request a strategy call and we will map where your judgment is strong, where it has thinned, and what a focused engagement would look like.',
   disc:'This masterclass is educational. No income, role, promotion, or business result is guaranteed. Results vary and depend on your own effort, context, and circumstances.'}
];

const deck = document.getElementById('deck');
function esc(x){return x||''}
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide '+(s.cls||'');
  let h='';
  if(s.kick) h+='<div class="kick">'+esc(s.kick)+'</div>';
  if(s.h) h+='<h1>'+esc(s.h)+'</h1>';
  if(s.big) h+='<div class="big">'+esc(s.big)+'</div>';
  if(s.items){h+='<ul>';s.items.forEach(it=>{h+='<li><b>'+esc(it[0])+'</b><span>'+esc(it[1])+'</span></li>'});h+='</ul>'}
  if(s.left&&s.right){
    h+='<div class="two"><div class="col"><h2>'+esc(s.left[0])+'</h2><p>'+esc(s.left[1])+'</p></div>'+
       '<div class="col"><h2>'+esc(s.right[0])+'</h2><p>'+esc(s.right[1])+'</p></div></div>';
  }
  if(s.p) h+='<p class="lead">'+esc(s.p)+'</p>';
  if(s.disc) h+='<div class="disc">'+esc(s.disc)+'</div>';
  if(s.foot) h+='<div class="foot">'+esc(s.foot)+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
