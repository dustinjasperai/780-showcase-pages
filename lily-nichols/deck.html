<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Prenatal Nutrition Gap — a masterclass with Lily Nichols, RDN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F2; --panel:#F0EBE0; --rule:#D9D0BF; --ink:#2E2A24; --accent:#6B7A4F;
    --muted:#6D665A;
    --head:'Lora',Georgia,serif; --body:'Nunito Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  #deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:46px 48px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative}
  .slide::after{content:"";position:absolute;left:48px;right:48px;bottom:26px;height:1px;
    background:var(--rule)}
  .slide .num{position:absolute;right:26px;bottom:20px;font-size:12px;color:var(--muted);
    letter-spacing:.08em}
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.12;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:32px;line-height:1.18;margin-bottom:16px}
  p.sub{font-size:19px;color:var(--muted);max-width:60ch;margin-bottom:10px}
  p.body{font-size:18px;max-width:62ch;margin-bottom:12px}
  ul{list-style:none;margin:10px 0 0;max-width:62ch}
  li{position:relative;padding-left:26px;font-size:18px;margin:12px 0}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:2px;background:var(--accent)}
  .plate{display:flex;gap:10px;margin-top:20px;max-width:62ch}
  .plate div{flex:1;border:1px solid var(--rule);border-radius:8px;padding:14px;background:var(--panel);
    font-size:15px}
  .plate b{display:block;font-family:var(--head);font-size:22px;color:var(--accent)}
  .present{font-size:16px;color:var(--muted);margin-top:22px}
  .cta h2{color:var(--accent)}
  .note{font-size:13px;color:var(--muted);margin-top:22px;max-width:64ch;line-height:1.45}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass for practitioners', h:'The Prenatal Nutrition Gap',
   s:'What standard training leaves out, and how to become the specialist your clients cannot find.',
   present:'Presented live by Lily Nichols, RDN, CDE'},

  {t:'who', k:'Who this is for', h:'For the clinician who keeps hitting the edge of the guidelines',
   s:'Dietitians, nurses, midwives, physician assistants and physicians who care for pregnant clients and sense that the standard prenatal advice is not the full picture.'},

  {t:'point', k:'The trap', h:'You followed the guidelines. The guidelines were built for a different goal.',
   s:'Conventional prenatal nutrition aims for "adequate" intake across food groups. Your clients are asking for optimal, for themselves and for their babies.'},

  {t:'hook', k:'The reframe', h:'Adequate is not the same as optimal',
   s:'Most prenatal nutrition guidance optimizes to prevent a deficiency. It rarely asks what actually builds a healthy pregnancy. That gap is where a specialist lives.'},

  {t:'section', k:'Part one', h:'Why the conventional picture is incomplete'},

  {t:'point', k:'The core problem', h:'High-carb, low-fat, food-group-based',
   s:'Conventional prenatal guidance leans high-carbohydrate and low-fat, and counts servings from food groups or fortified foods. A close read of the research points the other way.',
   b:['Protein needs in pregnancy are higher than the standard model assumes',
      'Nutrient density, not food-group checkboxes, is what mother and baby draw on',
      'Fortification fills gaps on paper that real food fills better in practice']},

  {t:'point', k:'What gets missed', h:'The cost of the gap',
   s:'When the model is wrong, the everyday clinical calls drift: carbohydrate load, protein, the fats inside protein sources, and when a supplement is genuinely needed versus assumed.'},

  {t:'section', k:'Part two', h:'The Real Food method'},

  {t:'point', k:'Framework 1', h:'Reverse-engineer from the requirement to the food',
   s:'Start from the micronutrients a pregnancy actually demands, then trace them back to the whole foods that carry them. Build the plate from the requirement down, not from a servings chart up.'},

  {t:'plate', k:'Framework 2', h:'The Prenatal Plate',
   s:'A concrete way to translate the method onto a plate your client can picture.',
   plate:[['1/4','Protein, with the fats that come with it'],
          ['1/2','Non-starchy vegetables'],
          ['1/4','Concentrated carbohydrate: fruit, legumes, starch']]},

  {t:'point', k:'Framework 3', h:'Supplements where food genuinely falls short',
   s:'Supplementation is a targeted decision, not a default. The method tells you where real food covers the requirement and where it honestly does not.'},

  {t:'point', k:'Applied', h:'Real food for gestational diabetes',
   s:'The same method reshapes the hardest case. A blood-sugar-stabilizing, lower-carbohydrate real-food approach departs from the conventional high-carb prescription, and clients can actually live on it.'},

  {t:'section', k:'Part three', h:'Seeing what the standard panel misses'},

  {t:'point', k:'Assessment', h:'Beyond the routine prenatal labs',
   s:'A specialist reads assessment and symptoms together to find where a client needs more support, long before the standard panel would flag it.',
   b:['Read intake and symptoms as signal, not noise',
      'Know which markers matter and which mislead in pregnancy',
      'Turn the picture into a plan the client will follow']},

  {t:'point', k:'Myths vs research', h:'Updating the picture without alarming the client',
   s:'Part of specializing is communicating the updated evidence calmly, so a client trusts the change instead of fearing it.'},

  {t:'point', k:'In practice', h:'What a prenatal-nutrition specialist actually does',
   s:'You stop guessing at the edges of your training and start making confident, evidence-based calls that other clinicians refer to you for.'},

  {t:'who', k:'Why me', h:'Lily Nichols, RDN, CDE',
   s:'Registered Dietitian/Nutritionist and Certified Diabetes Educator. Author of Real Food for Pregnancy, with over 930 citations, and Real Food for Gestational Diabetes. I have spent my career turning the prenatal research into something practitioners can actually use.'},

  {t:'cta', k:'Become the specialist', h:'Go deeper: the Institute for Prenatal Nutrition',
   s:'If you want to make this your specialty, the Institute for Prenatal Nutrition is the 18-week mentorship where practitioners earn the Specialist in Prenatal Nutrition credential. Applications open once a year.',
   note:'Educational only. This masterclass is for professional education and is not medical advice or a substitute for individualized clinical judgment. No outcome, income, or practice-growth result is promised or guaranteed; results vary.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'');
  let html = '';
  if(s.k) html += '<div class="kick">'+s.k+'</div>';
  if(s.t==='title'){ html += '<h1>'+s.h+'</h1>'; }
  else { html += '<h2>'+s.h+'</h2>'; }
  if(s.s) html += '<p class="sub">'+s.s+'</p>';
  if(s.plate){ html += '<div class="plate">'; s.plate.forEach(p=>{ html += '<div><b>'+p[0]+'</b>'+p[1]+'</div>'; }); html += '</div>'; }
  if(s.b){ html += '<ul>'; s.b.forEach(x=>{ html += '<li>'+x+'</li>'; }); html += '</ul>'; }
  if(s.present) html += '<p class="present">'+s.present+'</p>';
  if(s.note) html += '<p class="note">'+s.note+'</p>';
  html += '<span class="num">'+(i+1)+' / '+S.length+'</span>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
