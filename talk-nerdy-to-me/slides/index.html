<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 01 - The Holistic Accountant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0d2c44;font-family:system-ui,Segoe UI,Roboto,sans-serif}
.stage{position:relative;height:100%;display:flex;flex-direction:column}
iframe{flex:1;width:100%;border:0;background:#123c59}
.bar{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 16px;
background:#0d2c44;color:#eaf2fb;font-size:.9rem;letter-spacing:.04em}
button{background:#046bd2;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:.9rem;
font-weight:600;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.count{min-width:88px;text-align:center;color:#9fb8d0}
</style></head><body>
<div class="stage">
  <iframe id="f" src="01.html" title="webinar slide"></iframe>
  <div class="bar">
    <button id="prev">Prev</button>
    <span class="count"><span id="n">1</span> / 25</span>
    <button id="next">Next</button>
  </div>
</div>
<script>
var total=25,i=1,f=document.getElementById('f'),n=document.getElementById('n'),
p=document.getElementById('prev'),x=document.getElementById('next');
function pad(v){return (v<10?'0':'')+v;}
function go(){f.src=pad(i)+'.html';n.textContent=i;p.disabled=(i<=1);x.disabled=(i>=total);}
p.onclick=function(){if(i>1){i--;go();}};
x.onclick=function(){if(i<total){i++;go();}};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){if(i<total){i++;go();}}
  if(e.key==='ArrowLeft'){if(i>1){i--;go();}}
});
go();
</script></body></html>
