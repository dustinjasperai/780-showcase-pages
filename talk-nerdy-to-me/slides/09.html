<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide 09 - The Holistic Accountant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --accent: #0586ff; --tint: #38beff; --green: #61b750; --ink: #333333; --bg: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Rubik', system-ui, sans-serif; color: var(--ink); background: var(--bg);
    display: flex; align-items: center; justify-content: center; }
  .slide { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; padding: 6% 7%;
    display: flex; flex-direction: column; justify-content: center; position: relative;
    border-top: 10px solid var(--accent); }
  .kicker { text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; font-weight: 700;
    color: var(--accent); margin-bottom: 1rem; }
  h1 { font-size: clamp(1.6rem, 4.4vw, 2.9rem); font-weight: 700; line-height: 1.1;
    color: var(--ink); margin-bottom: 1.4rem; max-width: 24ch; }
  ul { list-style: none; }
  li { font-size: clamp(1rem, 2vw, 1.3rem); font-weight: 400; line-height: 1.5;
    padding-left: 1.6rem; position: relative; margin-bottom: .6rem; color: var(--ink); }
  li::before { content: ""; position: absolute; left: 0; top: .6em; width: .7rem; height: .7rem;
    border-radius: 50%; background: var(--tint); }
  .num { position: absolute; bottom: 4%; right: 7%; font-size: .8rem; color: #9aa6b2; font-weight: 500; }
  .brand { position: absolute; bottom: 4%; left: 7%; font-size: .8rem; color: #9aa6b2; font-weight: 500; }
  .title-slide h1 { color: var(--accent); }
</style>
</head>
<body>
  <section class="slide">
    <div class="kicker">The system</div>
    <h1>Become the advisor on retainer</h1>
    <ul>
      <li>Reposition from compliance to holistic advisory</li>
      <li>The relationship, and the fee, change together</li>
    </ul>
    <div class="brand">The Holistic Accountant &middot; Seth David</div>
    <div class="num">09 / 25</div>
  </section>
</body>
</html>
