<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Talent-First Advancement Shop, a masterclass with Annie Bastida Quade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7f7;
    --panel:#ffffff;
    --rule:#dfe6e6;
    --ink:#14313a;
    --muted:#4c5a5e;
    --accent:#5aa06a;
    --accent2:#2c6a54;
    --head:'Newsreader',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:64px 74px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 22px 54px rgba(20,49,58,.09);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* bench motif: a short upright bar on the left edge, teal into green */
  .slide::before{content:'';position:absolute;top:56px;bottom:56px;left:0;width:6px;
    background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:0 6px 6px 0}
  .kick{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:60px;line-height:1.04;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:600;font-size:42px;line-height:1.08;margin:0 0 20px}
  h3{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:46ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent2);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:16px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px}
  .big{font-family:var(--head);font-size:112px;line-height:1.0;font-weight:700}
  .strike{color:transparent;-webkit-text-stroke:2px #14313a55;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent2);font-size:26px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:56px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent2);color:#fff;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:26px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:62ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent2)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:40px}h2{font-size:30px}.big{font-size:66px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Advancement Talent Co. · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Talent-First Advancement Shop',p:'How to break your fundraising records by keeping the fundraisers you already have.',pres:'With <b>Annie Bastida Quade</b>, Founder, Advancement Talent Co.'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why your best years and your worst turnover arrive together','The link nobody on the leadership team is measuring.'],['A talent-first way to run the shop','Hiring, keeping and growing the people who raise the money.'],['The first move you can make this quarter','One role, one retention change, one number to watch.']]},
 {t:'audience',kick:'Who this is for',h:'You lead an advancement shop. And you are always rehiring.',p:'Advancement leaders, directors and talent or people leaders in university and nonprofit fundraising, where the goals keep rising and the team keeps turning over.',who:'<b>The trap:</b> you chase a bigger year while the people who could deliver five of them walk out the door.'},
 {t:'reframe',kick:'The reframe',big1:'A donor problem.',big2:'No. A <span class="em">people</span> problem.',p:'Every empty seat resets relationships, pipeline and momentum. You do not have a fundraising gap. You have a retention gap wearing a fundraising costume.'},
 {t:'part',kick:'Part one',h:'Why the records never come.'},
 {t:'point',kick:'The core problem',h:'The revolving door is your strategy, by accident.',p:'A gift officer often moves on inside a couple of years. Each exit hands the next hire a cold portfolio and restarts the relationship clock, so the shop runs hard and stays in place.'},
 {t:'point',kick:'The core problem',h:'An empty seat is not a saving.',p:'An open gift-officer role is stalled relationships, a portfolio nobody is working, and momentum leaking every month it stays vacant. The cost is real even though it never lands on a budget line.'},
 {t:'point',kick:'The core problem',h:'Donor-first thinking quietly starves the team.',p:'When every plan starts and ends with major donors and this year’s number, the people work becomes the thing you get to later. Later never comes, and the turnover it causes costs you the donors too.'},
 {t:'framework',kick:'The core problem',h:'The donor sprint vs. the long game.',row:[['The sprint','Raise as much as possible, as fast as possible. Big years, exhausted teams, a reset every time someone leaves.'],['The long game','Advancing Excellence: build the shop for durability, so results compound instead of restarting.']],p:'Sustainability over rapid gains is the whole argument.'},
 {t:'part',kick:'Part two',h:'The talent-first shop.'},
 {t:'pillars',kick:'The talent-first pillars',h:'Four moves, in order.',li:[['Hire for the bench','Recruit for the seat after next, so a resignation is a plan, not a crisis.'],['Onboard to contribute','Get a new fundraiser into real relationships early, not lost in orientation.'],['Retain on purpose','The moves that beat the two-year exit, made before the resignation, not after.'],['Develop, so they grow here','Give your best people a reason to build their career inside your shop.']]},
 {t:'steps',kick:'Retain on purpose',h:'What keeping people actually takes.',steps:['Name the two-year risk before it shows up in an inbox','Give ownership early, not after they have proven it twice','Make growth a visible path, not a private hope','Fix the manager, not just the perks','Measure engagement like you measure dollars raised']},
 {t:'point',kick:'Advancing Excellence',h:'Engagement is a fundraising metric.',p:'Employee engagement is not an HR nicety sitting off to the side. Engaged teams keep relationships warm, keep donors longer, and produce the years that make the headlines. Culture is pipeline.'},
 {t:'network',kick:'One connected team',h:'One pipeline, not four.',p:'Annual giving, alumni relations, advancement marketing and major gifts are one engagement pipeline, not four departments competing for the same relationship. Merge them and the donor experience stops leaking between the seams.',who:'<b>Principle:</b> integrate the engagement pipeline first, then staff it as one team.'},
 {t:'part',kick:'Part three',h:'What a talent-first shop looks like.'},
 {t:'looks',kick:'The outcome',h:'The shop that keeps its people.',li:[['Departures are planned for','A resignation triggers a plan, not a scramble.'],['Relationships survive the org chart','Donors stay warm because the team stays.'],['Results compound','Good years build on each other instead of resetting to zero.']]},
 {t:'whyme',kick:'Why Annie',h:'Someone who has run the play.',li:[['AVP, Advancement Strategy & Engagement, UTEP','Leads talent, engagement and growth strategy for Institutional Advancement.'],['Three record fundraising years, with rising engagement','The records came with the team, not at its expense.'],['Founder, Advancement Talent Co.','The community for talent leaders in fundraising and higher ed.']]},
 {t:'cta',kick:'Your next step',h:'Ready to build a shop that keeps its people?',ctas:['<b>Join the Advancement Talent Consortium</b> and build the talent-first shop alongside peers who lead the same rooms.'],disc:'This masterclass is educational. It shares frameworks and approaches for building and retaining advancement teams; it is not advice for your specific organization and not a guarantee of any particular fundraising or retention result. Outcomes vary.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
