<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Getting Signed · A Masterclass with Crystal Wright</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#F3E8E4;
    --panel:#FCF6F3;
    --ink:#1E1915;
    --ink-soft:#4a433c;
    --ink-muted:#8a7c74;
    --rule:#E7D4CC;
    --accent:#6E2B3A;
  }
  html,body{ height:100%; }
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--ink);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #stage{
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:var(--ink);
  }
  .slide{
    width:min(1120px,94vw);
    aspect-ratio:16/9;
    max-height:94vh;
    background:var(--bg);
    border:1px solid var(--rule);
    padding:72px 84px;
    display:none;
    flex-direction:column;
    position:relative;
    box-shadow:0 24px 80px rgba(0,0,0,.45);
  }
  .slide.active{ display:flex; }
  .kicker{ font-family:'Inter',sans-serif; font-size:13px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:26px; }
  h1{ font-family:'Bodoni Moda',Georgia,serif; font-weight:700; font-size:68px; line-height:1.02; letter-spacing:-.01em; color:var(--ink); margin-bottom:22px; }
  h2{ font-family:'Bodoni Moda',Georgia,serif; font-weight:600; font-size:46px; line-height:1.08; color:var(--ink); margin-bottom:20px; }
  .sub{ font-size:22px; color:var(--ink-soft); line-height:1.5; max-width:38ch; }
  .lead{ font-size:24px; color:var(--ink-soft); line-height:1.5; max-width:46ch; }
  .foot{ position:absolute; left:84px; bottom:52px; font-size:13px; color:var(--ink-muted); letter-spacing:.04em; }
  .num{ position:absolute; right:84px; bottom:52px; font-size:12px; color:var(--ink-muted); }
  .part{ font-family:'Bodoni Moda',serif; font-size:19px; font-weight:600; letter-spacing:.04em; color:var(--accent); text-transform:uppercase; }
  ul{ list-style:none; margin-top:10px; }
  li{ font-size:22px; color:var(--ink-soft); line-height:1.45; padding-left:30px; position:relative; margin-bottom:18px; max-width:44ch; }
  li::before{ content:''; position:absolute; left:0; top:14px; width:12px; height:1px; background:var(--accent); }
  .big{ font-family:'Bodoni Moda',serif; font-size:40px; line-height:1.14; color:var(--ink); max-width:24ch; }
  .accentword{ color:var(--accent); font-style:italic; }
  .pillar-no{ font-family:'Bodoni Moda',serif; font-size:30px; color:var(--accent); font-weight:600; margin-bottom:8px; }
  .rail{ display:flex; gap:40px; margin-top:8px; }
  .rail div{ flex:1; }
  .rail .label{ font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:8px; }
  .rail .val{ font-family:'Bodoni Moda',serif; font-size:34px; color:var(--ink); line-height:1.1; }
  .disclaimer{ font-size:14px; color:var(--ink-muted); line-height:1.5; max-width:60ch; margin-top:26px; font-style:italic; }
  .cta-step{ font-size:22px; color:var(--ink-soft); line-height:1.5; max-width:46ch; margin-top:6px; }
  .nav{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:14px; align-items:center; z-index:10; }
  .nav button{ font-family:'Inter',sans-serif; font-size:13px; color:#d9cdbb; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); padding:7px 14px; cursor:pointer; border-radius:2px; }
  .nav button:hover{ background:rgba(255,255,255,.14); }
  .nav .count{ font-size:12px; color:#9a8f80; }
  @media (max-width:720px){ .slide{ padding:40px 34px; } h1{ font-size:40px; } h2{ font-size:30px; } .sub,.lead,li,.cta-step{ font-size:17px; } .foot,.num{ left:34px; right:34px; bottom:30px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav">
  <button id="prev">Prev</button>
  <span class="count" id="count"></span>
  <button id="next">Next</button>
</div>
<script>
const S=[
  {t:'title', kicker:'A Masterclass with Crystal Wright',
   h1:'Getting Signed',
   sub:'How working hair and makeup artists get agency representation and raise their day rates.',
   foot:'Crystal Wright Live Academies'},

  {t:'who', kicker:'Who this is for',
   h2:'You are already good enough.',
   bullets:['You book work, but your day rate has not moved in years.',
            'You watch less talented artists get signed and booked while you wait.',
            'You want editorial, celebrity, film and TV, not just another salon day.']},

  {t:'lead', kicker:'The trap',
   big:'You were told that if you are <span class="accentword">talented enough</span>, the right people will find you.',
   lead:'So you keep perfecting your kit, posting your work, and waiting to be discovered.'},

  {t:'lead', kicker:'The reframe',
   big:'Agencies do not sign the best artist in the room. They sign the most <span class="accentword">representable</span> one.',
   lead:'Talent gets you in the door. Positioning, approach and reputation are what actually get you signed.'},

  {t:'part', part:'Part One', h2:'Why talent stalls at salon rates'},

  {t:'who', kicker:'Part One',
   h2:'Three things keep you stuck.',
   bullets:['No agency-ready positioning: your book and your story do not tell an agent what you are worth.',
            'No rate strategy: you quote the same number you quoted three years ago.',
            'No reputation system: the right people do not know your name when it counts.']},

  {t:'part', part:'Part Two', h2:'The Agency Playbook'},

  {t:'who', kicker:'Part Two',
   h2:'The system, in four moves.',
   bullets:['Package what an agent can actually sell.',
            'Approach the right people the right way.',
            'Build a reputation that becomes revenue.',
            'Price and negotiate like a represented artist.']},

  {t:'pillar', kicker:'Part Two', no:'01',
   h2:'Package your portfolio',
   lead:'Build the book, the comp card and the story an agent can sell on sight. This is the difference between "nice work" and "we can place you."'},

  {t:'pillar', kicker:'Part Two', no:'02',
   h2:'Approach the agency',
   lead:'The six-phase approach: who to contact, what to send, and the exact words to use, including what to say when the first answer is no.'},

  {t:'pillar', kicker:'Part Two', no:'03',
   h2:'Reputation becomes revenue',
   lead:'The reputation audit that tells you if you are actually ready, and how to make editors, producers and photographers remember your name.'},

  {t:'pillar', kicker:'Part Two', no:'04',
   h2:'Price like a pro',
   lead:'Deal memos, negotiation and rate strategy. How artists go from $500 days to $1,500 days, and eventually $3,500 days, without apologizing for it.'},

  {t:'part', part:'Part Three', h2:'When the positioning clicks'},

  {t:'rail', kicker:'Part Three',
   h2:'The same artist, repositioned.',
   rail:[{label:'Before', val:'$90 shampoo and blow-dry'},
         {label:'After positioning', val:'$1,200 for a CD cover'},
         {label:'Signed and booked', val:'$2,500 editorial day'}],
   lead:'These are real moves from artists who learned to be represented, not just talented.'},

  {t:'who', kicker:'Why learn this from me',
   h2:'I signed the artists you have heard of.',
   bullets:['25 years as a celebrity styling agent and President of Crystal Agency in Los Angeles.',
            'Represented Neeko (Halle Berry, Pink, Tyra Banks) and Reann Silva (Beauty Blender), among others.',
            'Author of The Hair, Makeup and Fashion Styling Career Guide, foreword by Bobbi Brown.']},

  {t:'cta', kicker:'Your next step',
   h2:'Learn the whole system.',
   step:'If you want it step by step, the Win Now Mentorship walks you through every move, module by module. When you are ready to move fast with me directly, Power X coaching is one on one.',
   disclaimer:'This masterclass is educational. It shares strategies and real examples from a 25 year career; it is not a promise of specific results. Outcomes vary by artist, market, effort and timing. No income or representation is guaranteed.',
   foot:'Crystal Wright Live Academies'}
];

const stage=document.getElementById('stage');
let i=0;
function esc(s){return s;}
function build(){
  stage.innerHTML='';
  S.forEach((s,idx)=>{
    const d=document.createElement('div');
    d.className='slide'+(idx===i?' active':'');
    let html='';
    if(s.kicker) html+=`<div class="kicker">${s.kicker}</div>`;
    if(s.part) html+=`<div class="part">${s.part}</div>`;
    if(s.h1) html+=`<h1>${s.h1}</h1>`;
    if(s.h2) html+=`<h2>${s.h2}</h2>`;
    if(s.big) html+=`<div class="big">${s.big}</div>`;
    if(s.no) html+=`<div class="pillar-no">${s.no}</div>`;
    if(s.bullets){ html+='<ul>'; s.bullets.forEach(b=>html+=`<li>${b}</li>`); html+='</ul>'; }
    if(s.rail){ html+='<div class="rail">'; s.rail.forEach(r=>html+=`<div><div class="label">${r.label}</div><div class="val">${r.val}</div></div>`); html+='</div>'; }
    if(s.lead) html+=`<p class="lead">${s.lead}</p>`;
    if(s.sub) html+=`<p class="sub">${s.sub}</p>`;
    if(s.step) html+=`<p class="cta-step">${s.step}</p>`;
    if(s.disclaimer) html+=`<p class="disclaimer">${s.disclaimer}</p>`;
    if(s.foot) html+=`<div class="foot">${s.foot}</div>`;
    html+=`<div class="num">${idx+1} / ${S.length}</div>`;
    d.innerHTML=html;
    stage.appendChild(d);
  });
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
}
function go(n){ i=Math.max(0,Math.min(S.length-1,n)); build(); }
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(i+1); if(e.key==='ArrowLeft')go(i-1); });
build();
</script>
</body>
</html>
