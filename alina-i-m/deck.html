<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Aligned Brand — a masterclass with Alina Mihai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c3540;        /* deep teal ground, from brand #223f4f */
    --panel:#223f4f;     /* her dominant */
    --rule:#55616c;      /* her slate */
    --accent:#c86153;    /* her terracotta */
    --ink:#f4ede4;       /* warm off-white on teal */
    --muted:#aeb8bd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Lato',sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid rgba(85,97,108,.5);border-radius:14px;
    padding:60px 58px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 18px 40px rgba(0,0,0,.28)}
  .slide.title{background:linear-gradient(160deg,#223f4f 0%,#172c35 100%);min-height:560px}
  .eyebrow{font-family:'Lato';font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:'Playfair Display',serif;font-weight:700;font-size:40px;line-height:1.1;margin-bottom:18px}
  h3{font-family:'Playfair Display',serif;font-weight:500;font-size:27px;line-height:1.2;margin-bottom:10px}
  p{font-size:20px;line-height:1.6;color:var(--ink);max-width:40em;margin-bottom:14px}
  p.lead{font-size:23px;color:var(--ink)}
  .sub{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:26px;color:var(--muted);margin-top:18px}
  .big{font-size:30px;line-height:1.35;font-weight:300}
  .accent{color:var(--accent)}
  ul{list-style:none;margin:16px 0 0}
  li{font-size:21px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid rgba(85,97,108,.4);max-width:44em}
  li:before{content:"";position:absolute;left:0;top:21px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .num{font-family:'Playfair Display',serif;font-size:19px;color:var(--accent);font-weight:700;margin-bottom:6px}
  .pill{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:999px;
    padding:9px 18px;font-size:15px;font-weight:700;letter-spacing:.04em;margin:8px 10px 0 0}
  .arch{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:22px}
  .arch div{border:1px solid rgba(85,97,108,.5);border-radius:10px;padding:20px 22px}
  .arch h4{font-family:'Playfair Display',serif;font-size:22px;color:var(--accent);margin-bottom:6px}
  .arch span{font-size:17px;color:var(--muted)}
  .brand{margin-top:34px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .cta .btn{display:inline-block;background:var(--accent);color:#17242b;font-weight:700;
    padding:16px 30px;border-radius:10px;font-size:19px;letter-spacing:.02em;margin-top:18px}
  .disc{font-size:14px;color:var(--muted);margin-top:30px;max-width:46em;line-height:1.5}
  .n{position:absolute;top:18px;right:26px;font-size:13px;color:var(--rule);letter-spacing:.1em}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Alina Mihai',h1:'The Aligned Brand',sub:'How to attract your people by becoming more of yourself',brand:'EMBODY · Transformation through Branding'},
 {t:'promise',eyebrow:'What you will walk away with',h2:'By the end of this hour',items:['A clear read on why your current brand feels off, even after a redesign','Your own essence, message and client experience mapped in one line each','The archetype lens that sets your voice and your visuals','A first honest draft of the brand only you could build']},
 {t:'who',eyebrow:'Who this is for',h2:'This is for you if',items:['You coach, heal, teach or guide, and your work is deeply personal','You have rebranded before and it still does not feel like you','You have too many offers and no single through line','You want clients who already get you, not clients you have to convince']},
 {t:'trap',eyebrow:'The trap',h2:'Most of us brand from the outside in',p:'We copy a coach we admire. We chase the posting hack. We pick a palette we saw do well for someone else. And we end up with a brand that works beautifully for that other person, and quietly repels the people who were meant for us.'},
 {t:'hook',eyebrow:'The reframe',big:'The problem was never your logo or how often you post. It is that your brand was never built from <span class="accent">you</span> in the first place.'},
 {t:'shift',eyebrow:'The shift',h2:'Inside out, not outside in',p:'An aligned brand starts from who you already are, your essence, and works outward into message, visuals and experience. Everything stays congruent, because it all grows from the same root.'},
 {t:'part',num:'Part One',h2:'The real problem is incongruence'},
 {t:'body',eyebrow:'Part One',h3:'When your brand is not rooted in you',p:'Incongruence is subtle and expensive. It shows up as the wrong clients, as resistance to your pricing, and as the slow burnout of performing a version of yourself that was never really you.',items:['Wrong fit clients who drain you','Pricing you keep apologizing for','Content that feels like a costume','A nagging sense that you are hiding']},
 {t:'body',eyebrow:'Part One',h3:'Aligned clients recognize aligned brands',p:'The people meant for you are reading for congruence, whether they could name it or not. When who you are and how you show up finally match, the right people feel it and lean in.'},
 {t:'part',num:'Part Two',h2:'The Aligned Brand, in three moves'},
 {t:'pillar',num:'Pillar One',h2:'Discover your Essence',p:'Before a single design choice, we surface the raw material: your personality, your values, your beliefs, your quirks, your mission, and the archetype you naturally lead from. This is the root the whole brand grows from.'},
 {t:'arch',eyebrow:'The lens',h2:'Lead from your archetype',p:'Your archetype sets your voice, your visuals and the promise you make. A few of the ones we work with:',arch:[['The Magician','transformation and vision'],['The Ruler','structure and authority'],['The Creator','originality and craft'],['The Lover','intimacy and devotion']]},
 {t:'pillar',num:'Pillar Two',h2:'Clarify your Message',p:'Now we turn essence into words. Who you serve, the change you create, and why it matters, said in your own language instead of borrowed industry phrases. This becomes your positioning and your website copy.'},
 {t:'body',eyebrow:'Pillar Two',h3:'The test of a clear message',p:'A clear message makes the right person say "that is me" and the wrong person move on without resentment. If everyone is a maybe, the message is still borrowed.'},
 {t:'pillar',num:'Pillar Three',h2:'Design your Client Experience',p:'Finally we build the journey: the value ladder from first touch to your signature offer, and the experience at each step. This is where a brand stops being a look and starts being a business that converts and delivers.'},
 {t:'part',num:'Part Three',h2:'When your brand finally sounds like you'},
 {t:'body',eyebrow:'Part Three',h3:'You, embodied',p:'Congruence is not a style. It is the felt sense that the person, the message and the experience are one thing. You stop performing, you show up as yourself, and the brand finally does the work of attracting instead of convincing.'},
 {t:'why',eyebrow:'Why me',h2:'Hi, I am Alina',p:'I am an intuitive brand strategist and the founder of Transformation through Branding. For two decades I have helped coaches, healers and educators find their voice and build brands rooted in who they really are, combining embodiment and energy work with practical strategy and design.'},
 {t:'recap',eyebrow:'The arc',h2:'From the inside out',items:['Essence: who you already are','Message: said in your own words','Experience: the journey that converts','Congruence: the brand that attracts your people']},
 {t:'cta',eyebrow:'Your next step',h2:'Build the brand only you could build',p:'If you want help taking this from a first draft to a finished, aligned brand, the Personal Brand Accelerator is my nine month program for exactly this. Apply for a brand clarity call and we will see if it is a fit.',btn:'Apply for a Brand Clarity Call',brand:'EMBODY · Alina Mihai',disc:'This masterclass is educational. No specific income, client, or business result is guaranteed. Results vary and depend on your own work, your market, and your circumstances.'}
];
const d=document.getElementById('deck');
S.forEach((s,i)=>{
 const el=document.createElement('section');
 el.className='slide '+(s.t==='title'?'title':'')+(s.t==='cta'?'cta':'');
 let h='<span class="n">'+(i+1)+' / '+S.length+'</span>';
 if(s.eyebrow)h+='<div class="eyebrow">'+s.eyebrow+'</div>';
 if(s.num)h+='<div class="num">'+s.num+'</div>';
 if(s.h1)h+='<h1>'+s.h1+'</h1>';
 if(s.sub)h+='<div class="sub">'+s.sub+'</div>';
 if(s.h2)h+='<h2>'+s.h2+'</h2>';
 if(s.h3)h+='<h3>'+s.h3+'</h3>';
 if(s.big)h+='<p class="big">'+s.big+'</p>';
 if(s.p)h+='<p class="lead">'+s.p+'</p>';
 if(s.items){h+='<ul>';s.items.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
 if(s.arch){h+='<div class="arch">';s.arch.forEach(a=>h+='<div><h4>'+a[0]+'</h4><span>'+a[1]+'</span></div>');h+='</div>';}
 if(s.btn)h+='<div><span class="btn">'+s.btn+'</span></div>';
 if(s.brand)h+='<div class="brand">'+s.brand+'</div>';
 if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
 el.innerHTML=h;
 d.appendChild(el);
});
</script>
</body>
</html>
