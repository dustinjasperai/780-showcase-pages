<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale Your Solo RIA With Relentless Simplicity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfd; --panel:#f1f2f7; --rule:#d7dae6;
    --ink:#071031; --accent:#0224a0; --rust:#a0441c; --muted:#4a5270;
    --display:'Montserrat',system-ui,sans-serif; --body:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 24px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 52px;margin:0 0 22px;min-height:360px;display:flex;flex-direction:column;
    justify-content:center}
  .slide.part{background:var(--panel)}
  .kick{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.12;
    margin-bottom:16px}
  .part h2{font-size:42px}
  p{font-size:21px;line-height:1.5;color:var(--muted);max-width:40ch}
  p.lead{font-size:24px;color:var(--ink)}
  .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.12;color:var(--ink)}
  .big .a{color:var(--accent)}
  .big .r{color:var(--rust)}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;line-height:1.4;color:var(--ink);padding:14px 0;border-top:1px solid var(--rule);
    display:flex;gap:14px}
  li:first-child{border-top:0}
  li b{font-family:var(--display);font-weight:700;color:var(--accent);flex:0 0 auto}
  .num{font-family:var(--display);font-weight:800;color:var(--rule);font-size:15px;
    letter-spacing:.14em;text-transform:uppercase}
  .foot{margin-top:28px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted)}
  .disc{margin-top:22px;font-size:14px;color:var(--muted);max-width:52ch;line-height:1.45}
  .cta h1{color:var(--accent)}
  .rule{height:2px;width:64px;background:var(--rust);margin:4px 0 22px;border:0}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">A live masterclass for independent financial advisors</div>
    <h1>Scale Your Solo RIA With Relentless Simplicity</h1>
    <hr class="rule">
    <p class="lead">Grow a lean, profitable firm by removing complexity, not adding to it.</p>
    <div class="foot">With Michael Reynolds, CFP · Ops &amp; Impact</div>`},

  {t:'trap', cls:'', html:`
    <div class="kick">Who this is for</div>
    <h2>You went independent to own your time.</h2>
    <p class="lead">Then the firm filled your week. More clients, more tools, more process, and
    somewhere in there the freedom you started for went quiet.</p>`},

  {t:'reframe', cls:'', html:`
    <div class="kick">The reframe</div>
    <p class="big">The usual advice is <span class="r">hire, add tools, chase AUM.</span><br>
    It is the fastest way to rebuild the job you left.</p>`},

  {t:'part', cls:'part', html:`
    <div class="num">Part One</div>
    <h2>The complexity trap</h2>
    <p class="lead">Why a growing solo firm quietly turns its owner into the bottleneck.</p>`},

  {t:'point', cls:'', html:`
    <div class="kick">The weight problem</div>
    <h2>Every addition has a cost you do not see on the invoice.</h2>
    <p>Each new client, tool, and bespoke process adds weight. A one-person firm can carry only
    so much before the owner becomes the single point of failure for everything.</p>`},

  {t:'list', cls:'', html:`
    <div class="kick">Where advisors over-engineer</div>
    <h2>The four places complexity hides.</h2>
    <ul>
      <li><b>01</b>A tool for every job, most of them half used.</li>
      <li><b>02</b>A custom process where a simple one would do.</li>
      <li><b>03</b>Saying yes to every service a client could want.</li>
      <li><b>04</b>Doing by hand what could run on its own.</li>
    </ul>`},

  {t:'part', cls:'part', html:`
    <div class="num">Part Two</div>
    <h2>Relentless simplicity</h2>
    <p class="lead">The operating principle that keeps a lifestyle practice lean and profitable.</p>`},

  {t:'list', cls:'', html:`
    <div class="kick">The three biases</div>
    <h2>Run every decision through these.</h2>
    <ul>
      <li><b>Simplicity</b>Resist over-engineering. The simpler option is usually the right one.</li>
      <li><b>Efficiency</b>Efficiency in pursuit of effectiveness, never busywork for its own sake.</li>
      <li><b>Action</b>Take action even when it is not perfect. Done and adjusting beats stalled.</li>
    </ul>`},

  {t:'point', cls:'', html:`
    <div class="kick">The two levers</div>
    <h2>Ops and Impact.</h2>
    <p class="lead">Ops is the operations, process, and technology that let one person run lean.
    Impact is the marketing that brings the right clients in. Most advisors over-invest in one
    and starve the other.</p>`},

  {t:'point', cls:'', html:`
    <div class="kick">The marketing edge</div>
    <h2>The part most advisors never actually use.</h2>
    <p>Before the RIA there were twenty three years of running a marketing agency. The lesson
    that carried over: a solo advisor needs only a handful of content moves done consistently to
    keep a calendar full. Not funnels hype. The few things that work.</p>`},

  {t:'point', cls:'', html:`
    <div class="kick">Practical AI</div>
    <h2>Leverage a one-person firm could not buy before.</h2>
    <p>The concrete workflows that give a solo advisor real time back: drafting the newsletter,
    prepping the review, triaging the inbox. A small firm that punches above its headcount.</p>`},

  {t:'part', cls:'part', html:`
    <div class="num">Part Three</div>
    <h2>The lifestyle practice</h2>
    <p class="lead">What it looks like when the firm serves the life, not the other way around.</p>`},

  {t:'point', cls:'', html:`
    <div class="kick">The picture</div>
    <h2>Deliberately small. Quietly profitable.</h2>
    <p class="lead">A short list of tools, a repeatable week, and marketing that compounds while
    you are with clients. Margin stays high because the overhead never crept in.</p>`},

  {t:'list', cls:'', html:`
    <div class="kick">What changes</div>
    <h2>The week after you simplify.</h2>
    <ul>
      <li><b>Fewer tools</b>The stack earns its place or it goes.</li>
      <li><b>A repeatable week</b>The same rhythm instead of a new fire daily.</li>
      <li><b>Marketing that compounds</b>A few moves, done consistently.</li>
      <li><b>Time back</b>The reason you went independent in the first place.</li>
    </ul>`},

  {t:'point', cls:'', html:`
    <div class="kick">The decision you keep facing</div>
    <h2>Should I hire?</h2>
    <p>Usually the honest answer is remove and automate first. Payroll is the most expensive,
    least reversible complexity a solo firm can take on. We walk through when it is actually
    time, and the lean alternative for every other case.</p>`},

  {t:'why', cls:'', html:`
    <div class="kick">Why me</div>
    <h2>Michael Reynolds, CFP</h2>
    <p>A practicing financial advisor and solo RIA owner. Twenty three years running, then
    selling, a marketing agency. Founded my RIA in 2019. Host of the Ops and Impact podcast,
    member of NAPFA and the XY Planning Network. I coach advisors on the firm I actually run.</p>`},

  {t:'recap', cls:'', html:`
    <div class="kick">The three decisions</div>
    <h2>What you leave with.</h2>
    <ul>
      <li><b>01</b>What to stop doing.</li>
      <li><b>02</b>Which handful of tools actually earn their place.</li>
      <li><b>03</b>Where practical AI reclaims your week.</li>
    </ul>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h1>Keep it simple. Keep it yours.</h1>
    <p class="lead">Bring the questions from your own firm to free monthly Open Office Hours, or
    join the Ops and Impact community to put relentless simplicity to work with other independent
    advisors.</p>
    <div class="foot">michaelreynolds.com · Ops &amp; Impact</div>
    <p class="disc">Educational only. No income, client, or result is guaranteed. Results vary by
    firm, market, and the effort you put in. Nothing here is investment, legal, or tax advice.</p>`},
];
const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  el.innerHTML = s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
