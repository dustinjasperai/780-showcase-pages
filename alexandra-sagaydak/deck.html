<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Business-Obsessed Method — Alexandra Sagaydak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafcfc;        /* her body background (brand.json) */
    --panel:#dce8e8;     /* her dominant pale-teal surface */
    --ink:#093e3f;       /* her heading teal */
    --ink2:#123133;      /* her body ink */
    --mute:#4d6b6c;
    --accent:#00d2c4;    /* her link teal — the one bright hue */
    --line:#bcd3d3;
    --display:'Plus Jakarta Sans',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink2);font-family:var(--body)}
  #deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:#ffffff;border:1px solid var(--line);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(9,62,63,.04)}
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;color:var(--ink);font-size:46px;line-height:1.05;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;color:var(--ink);font-size:32px;line-height:1.12;
    margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--ink2);margin-bottom:14px;max-width:62ch}
  .lead{font-size:22px;color:var(--mute)}
  .big{font-size:27px;line-height:1.4;color:var(--ink);font-weight:500}
  ul{list-style:none;margin:10px 0 0}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.55;margin-bottom:14px;color:var(--ink2)}
  li:before{content:"";position:absolute;left:4px;top:11px;width:9px;height:9px;border-radius:2px;
    background:var(--accent)}
  .panel{background:var(--panel);border-radius:10px;padding:22px 24px;margin-top:8px}
  .quote{font-family:var(--display);font-weight:600;font-size:26px;color:var(--ink);line-height:1.3}
  .num{font-family:var(--display);font-weight:800;color:var(--accent);font-size:15px;
    letter-spacing:.1em;margin-bottom:10px}
  .stat-row{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}
  .stat{flex:1 1 180px;background:var(--panel);border-radius:10px;padding:20px 22px}
  .stat b{display:block;font-family:var(--display);font-weight:800;color:var(--ink);font-size:30px}
  .stat span{font-size:15px;color:var(--mute)}
  .foot{font-size:14px;color:var(--mute);margin-top:22px;line-height:1.5}
  .btn{display:inline-block;font-family:var(--display);font-weight:700;background:var(--ink);
    color:#eafbf9;padding:15px 26px;border-radius:9px;font-size:18px;margin-top:10px}
  .by{font-family:var(--display);font-weight:600;color:var(--mute);font-size:17px;margin-top:22px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass',h:'The Business-Obsessed Method',
  lead:'How customer success professionals go from overlooked to indispensable, by tying the work to revenue.',
  by:'Alexandra Sagaydak, former Chief Customer Officer'},

 {t:'bullets',kicker:'What you will walk out with',h:'Four things you can use on Monday',
  bullets:['The money math that reprices your week.','The money sentence that makes leadership act.','The calendar move that stops the drift.','A promotion case built on numbers, not stories.']},

 {t:'audience',kicker:'Who this is for',h:'Different titles, same movie.',
  p:'You are in customer success, onboarding, support, or account management.',
  bullets:['Customers who always want something.','Leadership that always wants more revenue.','Nobody telling you how to connect the two.'],
  foot:'Everyone measures you on NRR, churn, and time-to-value. No one hands you the formula.'},

 {t:'reframe',kicker:'The uncomfortable part',h:'"Be more strategic."',
  big:'That was the whole feedback. No plan. No budget. No coaching. Just a promotion quietly held back, and a word nobody defined.'},

 {t:'reframe',kicker:'The reframe',h:'Being customer-obsessed is what is holding you back.',
  p:'Doing more for customers feels like the job. But more tickets closed, more trainings run, and more hand-holding reads to leadership as a cost that keeps growing.',
  big:'No one cares about your challenges. Start with numbers.'},

 {t:'bullets',kicker:'The trap',h:'The work that disappears',
  p:'These are the hours that keep revenue safe and growing. None of them are ever counted in those words.',
  bullets:['The at-risk account you quietly saved last quarter.','The onboarding you reworked so three teams actually adopted.','The renewal you teed up six months early.','The expansion you flagged before sales saw it.']},

 {t:'part',num:'Part one',h:'Why customer success reads as a cost center',
  p:'Your calendar is full of work that protects revenue and creates revenue. The problem is that none of it is ever counted in those words, so it looks like overhead instead of growth.'},

 {t:'bullets',kicker:'The pattern',h:'What that costs you',
  bullets:['Your wins get attributed to sales or product.','Your asks for headcount or tools stall.','Your reviews praise your attitude, not your impact.','Your promotion case has stories, not numbers.']},

 {t:'part',num:'Part two',h:'The Business-Obsessed Method',
  p:'Three moves that translate everything you already do into the language leadership acts on. You do not change the work. You change how the work is counted and said out loud.'},

 {t:'pillar',num:'Move 1',h:'The money math',
  p:'Price every activity in your week against your salary and against what it earned. Once the hours carry a number, the trade-offs become obvious to everyone, including you.',
  quote:'6 hours of repeat trainings = 6 upsell calls you did not make.'},

 {t:'pillar',num:'Move 2',h:'The money sentence',
  p:'One sentence that makes a room lean in, because it opens on the number and ends on a deadline. Say it in reviews, in escalations, and in your own one-on-ones.',
  quote:'I have X customers, combined ARR of Y, and it is blocking Z by [date].'},

 {t:'bullets',kicker:'Drilled live',h:'Say it out loud until it is yours',
  p:'The sentence only works when it is automatic. In a live room we run it with volunteers, camera on, with corrections mid-sentence. The awkward first pass is part of it.',
  bullets:['Pick a real account and a real block.','Open on the number, not the backstory.','End on a date, so it becomes a decision.','Watch it once, then do it yourself.']},

 {t:'pillar',num:'Move 3',h:'The calendar move',
  p:'Put the revenue outcome in the meeting title, not the activity. Then use a simple script for the moment a manager drops a random task on you, so your time keeps mapping to the number.',
  quote:'Revenue goes in the title. The task that does not move it gets a script, not a yes.'},

 {t:'bullets',kicker:'Put together',h:'The method in one flow',
  bullets:['Count the week in money (the math).','Say the impact in one line (the sentence).','Protect the calendar against drift (the move).','Repeat it until leadership repeats it back.']},

 {t:'part',num:'Part three',h:'When the numbers start speaking for you',
  p:'The work does not get louder. It gets legible. Leadership starts describing your team in revenue terms, which is the moment the promotion conversation changes.'},

 {t:'bullets',kicker:'The shift',h:'From overlooked to indispensable',
  bullets:['NRR becomes a line you own, not one you react to.','Churn conversations start before the risk, not after.','Your name comes up in the revenue meeting, not just the support one.','You are paid for the number you move, not the hours you log.']},

 {t:'proof',kicker:'Why me',h:'I built this method on myself first.',
  p:'Years ago I was the CSM who got talked over in every exec meeting. I rebuilt how I counted and said my work, and it moved my career.',
  stats:[['Intern → CCO','my own path in B2B SaaS'],['107% → 124%','NRR I grew'],['2.8% → under 1%','churn I cut'],['50+','CSMs coached']]},

 {t:'cta',kicker:'Your next step',h:'Want this applied to your own accounts?',
  p:'In a 1:1 session we take your real customers, your real numbers, and your next review, and we build your money math, your money sentence, and your calendar move together.',
  btn:'Book a 1:1 session',
  disc:'Educational content only. Outcomes depend on your role, your accounts, and your own effort. No income, promotion, or result is guaranteed. Results vary.'}
];

const D=document.getElementById('deck');
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
S.forEach(s=>{
  const sl=el('div','slide');
  if(s.kicker)sl.appendChild(el('div','kicker',s.kicker));
  if(s.num)sl.appendChild(el('div','num',s.num));
  if(s.h)sl.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));
  if(s.lead)sl.appendChild(el('p','lead',s.lead));
  if(s.p)sl.appendChild(el('p',null,s.p));
  if(s.big)sl.appendChild(el('p','big',s.big));
  if(s.quote){const q=el('div','panel');q.appendChild(el('div','quote',s.quote));sl.appendChild(q);}
  if(s.bullets){const u=el('ul');s.bullets.forEach(b=>u.appendChild(el('li',null,b)));sl.appendChild(u);}
  if(s.stats){const r=el('div','stat-row');s.stats.forEach(st=>{const c=el('div','stat');c.appendChild(el('b',null,st[0]));c.appendChild(el('span',null,st[1]));r.appendChild(c);});sl.appendChild(r);}
  if(s.by)sl.appendChild(el('div','by',s.by));
  if(s.btn)sl.appendChild(el('div','btn',s.btn));
  if(s.foot)sl.appendChild(el('div','foot',s.foot));
  if(s.disc)sl.appendChild(el('div','foot',s.disc));
  D.appendChild(sl);
});
</script>
</body>
</html>
