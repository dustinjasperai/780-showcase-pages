<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Compassion Exchange — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ef;        /* warm paper (light scheme, from brand.json) */
    --panel:#ffffff;
    --rule:#e4e7eb;      /* their neutral grey, verbatim */
    --ink:#2a2622;       /* warm near-black */
    --muted:#6b645c;
    --accent:#6b20ad;    /* their brand purple, ranked #2 in brand.json */
    --wash:#efe7f6;      /* 92%-light tint of the same purple */
    --display:'Newsreader', Georgia, serif;
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#2a2622;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
  .slide{
    display:none;width:min(1040px,94vw);aspect-ratio:16/9;background:var(--bg);
    border-radius:18px;padding:7% 8%;position:relative;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.35);flex-direction:column;justify-content:center;
  }
  .slide.on{display:flex}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:clamp(11px,1.3vw,14px);color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:500;line-height:1.02;letter-spacing:-.01em;
    font-size:clamp(34px,6.4vw,76px);max-width:16ch}
  h2{font-family:var(--display);font-weight:500;line-height:1.06;letter-spacing:-.01em;
    font-size:clamp(28px,4.8vw,54px);max-width:18ch}
  .lede{font-family:var(--display);font-weight:400;font-style:italic;color:var(--muted);
    font-size:clamp(18px,2.5vw,30px);margin-top:22px;max-width:26ch;line-height:1.3}
  p.body{font-size:clamp(16px,1.9vw,22px);line-height:1.5;color:var(--ink);margin-top:20px;max-width:34ch}
  .big{font-family:var(--display);font-weight:500;font-size:clamp(40px,8vw,104px);line-height:.98;
    letter-spacing:-.02em;max-width:13ch}
  .foot{position:absolute;left:8%;right:8%;bottom:5.5%;display:flex;justify-content:space-between;
    align-items:center;font-size:clamp(10px,1.2vw,13px);color:var(--muted);
    border-top:1px solid var(--rule);padding-top:12px}
  .foot b{color:var(--ink);font-weight:600}
  .pillars{display:flex;gap:18px;margin-top:30px;flex-wrap:wrap}
  .pill{flex:1 1 200px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:22px 20px}
  .pill .n{font-family:var(--display);color:var(--accent);font-size:28px;font-weight:600}
  .pill h3{font-size:clamp(16px,1.8vw,20px);margin:8px 0 6px;font-weight:600}
  .pill p{font-size:clamp(13px,1.4vw,15px);color:var(--muted);line-height:1.45}
  .traits{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:30px}
  .traits .t{background:var(--panel);border:1px solid var(--rule);border-radius:11px;
    padding:16px 12px;font-weight:500;font-size:clamp(12px,1.35vw,16px);text-align:center}
  .traits .t.hot{background:var(--wash);border-color:var(--accent);color:var(--accent);font-weight:600}
  .quoteword{font-family:var(--display);font-weight:600;color:var(--accent);
    font-size:clamp(44px,9vw,120px);letter-spacing:-.02em}
  .credit{margin-top:26px;display:flex;gap:14px;align-items:baseline}
  .credit .c-name{font-weight:600;font-size:clamp(16px,1.9vw,22px)}
  .credit .c-role{color:var(--muted);font-size:clamp(13px,1.5vw,16px)}
  .cta-steps{margin-top:26px;display:flex;flex-direction:column;gap:12px;max-width:40ch}
  .cta-steps .s{display:flex;gap:14px;align-items:flex-start;font-size:clamp(15px,1.8vw,20px)}
  .cta-steps .s span{color:var(--accent);font-family:var(--display);font-weight:600}
  .btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-weight:600;
    padding:15px 28px;border-radius:999px;font-size:clamp(15px,1.8vw,19px)}
  .disclaimer{margin-top:22px;font-size:clamp(11px,1.2vw,13px);color:var(--muted);max-width:48ch;line-height:1.45}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:9}
  .nav button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);
    border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer}
  .count{position:fixed;top:18px;right:22px;color:rgba(255,255,255,.55);font-size:13px;z-index:9}
</style>
</head>
<body>
<div class="stage"><div id="deck"></div></div>
<div class="count" id="count"></div>
<div class="nav"><button onclick="go(-1)">&larr;</button><button onclick="go(1)">&rarr;</button></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass', h:'Why Compassionate Leadership Never Sticks',
   lede:'And the operating system that makes it last.', brand:'The Compassion Exchange',
   who:'With Jane and Nigel Kilpatrick'},

  {t:'who', kicker:'Who this is for',
   h:'For leaders who mean it, and still revert under pressure.',
   body:'You are not short on good intentions. You are short on a method that survives a hard week, a difficult person, and your own tired nervous system.'},

  {t:'trap', kicker:'The trap',
   big:'You read the book. You felt it. Then Monday happened.'},

  {t:'reframe', kicker:'The reframe',
   h:'Most leadership training is temporary by design.',
   body:'It targets your intentions. Pressure targets your body. That is why the change fades by Friday, and why trying harder has never been the fix.'},

  {t:'part', kicker:'Part one', h:'The real problem is not willpower.'},

  {t:'point', kicker:'The real problem',
   h:'Under threat, you lead from your oldest program.',
   body:'When the stakes rise, the nervous system reaches for fear, control, and self-protection. Compassion is the first thing it drops. No amount of wanting to be kinder overrides that in the moment.'},

  {t:'point', kicker:'The real problem',
   h:'So "be more compassionate" quietly fails.',
   body:'Advice aimed at the conscious mind cannot reach the part of you that is already reacting. The gap between the leader you intend to be and the one who shows up under load is a physiology gap, not a character flaw.'},

  {t:'part', kicker:'Part two', h:'The Compassionate Operating System'},

  {t:'pillars', kicker:'How the change holds', h:'Three layers, working together.',
   pills:[
     {n:'01', h:'Behavioural science', p:'The real mechanics of how leaders change, so new responses are built, not merely resolved.'},
     {n:'02', h:'Nervous-system regulation', p:'You learn to settle your own state first, so compassion is available exactly when pressure would usually take it.'},
     {n:'03', h:'Practical reps', p:'Repetition with peers until the compassionate response is the automatic one, not the heroic one.'}
   ]},

  {t:'traits', kicker:'The blueprint', h:'Compassion is ten trainable traits, not a personality.',
   list:['Trust','Honesty','Tolerance','Gentleness','Self-Compassion','Generosity','Open-Mindedness','Patience','Resilience','Defencelessness'],
   hot:'Defencelessness'},

  {t:'point', kicker:'The trait most skip',
   h:'Self-Compassion comes first.',
   body:'You cannot pour compassion from an empty, self-critical tank. The leaders who last are not the hardest on themselves. They are the ones who stopped treating self-criticism as a performance strategy.'},

  {t:'spotword', kicker:'The trait leaders resist most', word:'Defencelessness',
   body:'Leading without armour is not weakness. It is the end of the exhausting performance of certainty, and it is where trust in a room actually begins.'},

  {t:'part', kicker:'Part three', h:'A regulated week, in real decisions.'},

  {t:'point', kicker:'In practice',
   h:'Regulate first. Then lead.',
   body:'The difference is small and it changes everything: the 11pm reactive email becomes the 9am clear one. Same honesty, less harm. Over a quarter, that is a different culture.'},

  {t:'credit', kicker:'Why this, why us',
   h:'This was lived before it was taught.',
   body:'The Compassionate Operating System came out of a real arc from burnout and toxic, fear-driven leadership to a human one, then was rebuilt into a system other leaders can follow.',
   people:[{name:'Nigel Kilpatrick', role:'Author, The 10 Traits of a Compassionate Leader'},
           {name:'Jane Kilpatrick', role:'Co-founder, The Compassion Exchange'}]},

  {t:'recap', kicker:'The whole idea in one line',
   big:'Compassion is not soft. It is an operating system you can train.'},

  {t:'cta', kicker:'Your next step', h:'Keep practising it, with other leaders.',
   steps:['Start your 7-day free trial of The Compassion Exchange.',
          'Score yourself against the 10 traits.',
          'Build the missing ones with the community, in reps, not resolutions.'],
   btn:'Start your 7-day free trial', brand:'The Compassion Exchange',
   disclaimer:'This masterclass is educational. No specific outcome or result is guaranteed, and results vary by leader, team, and context.'}
];

const deck = document.getElementById('deck');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function footer(s){return '<div class="foot"><span><b>The Compassion Exchange</b></span><span>Compassionate leadership, made to last</span></div>';}
function slideHTML(s){
  let c='';
  if(s.t==='title') c=`<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.h)}</h1><div class="lede">${esc(s.lede)}</div><div class="credit"><span class="c-name">${esc(s.brand)}</span><span class="c-role">${esc(s.who)}</span></div>`;
  else if(s.t==='trap'||s.t==='recap') c=`<div class="kicker">${esc(s.kicker)}</div><div class="big">${esc(s.big)}</div>`;
  else if(s.t==='part') c=`<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.h)}</h1>`;
  else if(s.t==='pillars'){let p=s.pills.map(x=>`<div class="pill"><div class="n">${esc(x.n)}</div><h3>${esc(x.h)}</h3><p>${esc(x.p)}</p></div>`).join('');c=`<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.h)}</h2><div class="pillars">${p}</div>`;}
  else if(s.t==='traits'){let g=s.list.map(x=>`<div class="t${x===s.hot?' hot':''}">${esc(x)}</div>`).join('');c=`<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.h)}</h2><div class="traits">${g}</div>`;}
  else if(s.t==='spotword') c=`<div class="kicker">${esc(s.kicker)}</div><div class="quoteword">${esc(s.word)}</div><p class="body">${esc(s.body)}</p>`;
  else if(s.t==='credit'){let pl=s.people.map(x=>`<div class="credit"><span class="c-name">${esc(x.name)}</span><span class="c-role">${esc(x.role)}</span></div>`).join('');c=`<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.h)}</h2><p class="body">${esc(s.body)}</p>${pl}`;}
  else if(s.t==='cta'){let st=s.steps.map((x,i)=>`<div class="s"><span>${i+1}</span>${esc(x)}</div>`).join('');c=`<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.h)}</h2><div class="cta-steps">${st}</div><div class="btn">${esc(s.btn)}</div><div class="disclaimer">${esc(s.disclaimer)}</div>`;}
  else c=`<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.h)}</h2><p class="body">${esc(s.body)}</p>`;
  return `<div class="slide">${c}${footer(s)}</div>`;
}
deck.innerHTML = S.map(slideHTML).join('');
const slides=[...document.querySelectorAll('.slide')];
let i=0;
function show(n){slides[i].classList.remove('on');i=Math.max(0,Math.min(slides.length-1,n));slides[i].classList.add('on');document.getElementById('count').textContent=(i+1)+' / '+slides.length;}
function go(d){show(i+d);}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
show(0);
</script>
</body>
</html>
