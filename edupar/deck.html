<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Homeschooling in Italy: The First-Year Plan | Erika Di Martino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #f7f8f5;
    --panel: #ffffff;
    --ink: #2b2d2b;
    --ink-soft: #4b4f4a;
    --ink-muted: #7c817a;
    --rule: #d8ded2;
    --accent: #1c8e37;
  }
  html, body { height:100%; }
  body {
    font-family:'Source Sans Pro', -apple-system, system-ui, sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #deck { width:100vw; height:100vh; position:relative; }
  .slide {
    position:absolute; inset:0; display:none;
    flex-direction:column; justify-content:center;
    padding:7vh 9vw; opacity:0; transition:opacity .25s ease;
  }
  .slide.on { display:flex; opacity:1; }
  .eyebrow { font-family:'Barlow',sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:.16em; font-size:clamp(11px,1.3vw,15px); color:var(--accent); margin-bottom:18px; }
  h1 { font-family:'Barlow',sans-serif; font-weight:700; line-height:1.08;
    font-size:clamp(30px,5.4vw,66px); letter-spacing:-.01em; max-width:17ch; }
  h2 { font-family:'Barlow',sans-serif; font-weight:700; line-height:1.12;
    font-size:clamp(26px,4.2vw,50px); letter-spacing:-.01em; max-width:19ch; }
  .sub { font-size:clamp(16px,2.1vw,25px); color:var(--ink-soft); margin-top:22px; max-width:34ch; line-height:1.5; }
  .lede { font-size:clamp(17px,2.3vw,28px); color:var(--ink-soft); line-height:1.55; max-width:30ch; }
  .presenter { margin-top:34px; font-family:'Barlow',sans-serif; font-weight:600;
    font-size:clamp(14px,1.7vw,20px); color:var(--ink); }
  .presenter span { color:var(--ink-muted); font-weight:400; display:block; font-family:'Source Sans Pro',sans-serif; margin-top:4px; }
  ul { list-style:none; margin-top:10px; max-width:30ch; }
  li { position:relative; padding-left:34px; margin:16px 0; font-size:clamp(16px,2vw,24px); color:var(--ink-soft); line-height:1.45; }
  li::before { content:""; position:absolute; left:0; top:.6em; width:16px; height:3px; background:var(--accent); border-radius:2px; }
  .step-no { font-family:'Barlow',sans-serif; font-weight:700; color:var(--accent);
    font-size:clamp(14px,1.6vw,19px); letter-spacing:.14em; text-transform:uppercase; margin-bottom:14px; }
  .step-body { font-size:clamp(16px,2.1vw,26px); color:var(--ink-soft); line-height:1.5; max-width:32ch; margin-top:6px; }
  .part-num { font-family:'Barlow',sans-serif; font-weight:700; font-size:clamp(48px,11vw,150px);
    color:var(--rule); line-height:.9; margin-bottom:10px; }
  .why-grid { display:flex; flex-wrap:wrap; gap:14px 40px; margin-top:26px; max-width:40ch; }
  .why-grid div { font-size:clamp(15px,1.9vw,22px); color:var(--ink-soft); position:relative; padding-left:22px; }
  .why-grid div::before { content:""; position:absolute; left:0; top:.55em; width:10px; height:10px; border-radius:50%; background:var(--accent); }
  .cta-box { margin-top:8px; }
  .cta-step { display:inline-block; font-family:'Barlow',sans-serif; font-weight:700;
    background:var(--accent); color:#fff; padding:14px 26px; border-radius:8px;
    font-size:clamp(15px,1.9vw,22px); margin-top:24px; }
  .disclaimer { margin-top:40px; font-size:clamp(11px,1.2vw,13px); color:var(--ink-muted);
    max-width:52ch; line-height:1.5; border-top:1px solid var(--rule); padding-top:16px; }
  .kicker { font-family:'Barlow',sans-serif; font-weight:600; color:var(--ink-muted);
    font-size:clamp(13px,1.5vw,18px); margin-top:20px; max-width:34ch; line-height:1.5; }
  .nav { position:fixed; bottom:20px; right:26px; font-family:'Barlow',sans-serif;
    font-size:13px; color:var(--ink-muted); display:flex; gap:16px; align-items:center; z-index:10; }
  .nav button { font:inherit; border:1px solid var(--rule); background:var(--panel);
    color:var(--ink); border-radius:6px; padding:5px 11px; cursor:pointer; }
  .nav button:hover { border-color:var(--accent); color:var(--accent); }
  .brandmark { position:fixed; bottom:20px; left:26px; font-family:'Barlow',sans-serif;
    font-weight:700; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-muted); z-index:10; }
  .brandmark b { color:var(--accent); }
  .progress { position:fixed; top:0; left:0; height:3px; background:var(--accent); transition:width .25s ease; z-index:10; }
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<div id="deck"></div>
<div class="brandmark"><b>EDUpar</b> &middot; Erika Di Martino</div>
<div class="nav"><button onclick="go(-1)">Prev</button><span id="count"></span><button onclick="go(1)">Next</button></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A live masterclass',
    h1:'Start Homeschooling in Italy',
    sub:'The First-Year Plan: the legal path, your approach, and a rhythm that actually lasts.',
    presenter:'With Erika Di Martino', presenterSub:'Mother of five never-schooled children. Founder of the EDUpar network.' },

  {t:'statement',
    eyebrow:'What you will leave with',
    h2:'By the end of this hour you will know what to do first, what is legal, and how to begin without the overwhelm.' },

  {t:'list',
    eyebrow:'This is for you if',
    h2:'You are standing at the edge of the decision.',
    items:['Your child is bored, anxious, or unhappy at school.','You are considering parental education but do not know if it is even allowed.','You keep researching and freezing, because every source says something different.'] },

  {t:'lede',
    eyebrow:'The trap',
    lede:'You have read forty articles and you are more confused than when you started. Everyone has an opinion. Nobody gives you the order of operations.' },

  {t:'lede',
    eyebrow:'The reframe',
    lede:'The question was never whether you are capable of educating your own child. The question is that no one in Italy hands you the map.' },

  {t:'part', num:'01', h2:'Why the first year feels impossible.' },

  {t:'statement',
    eyebrow:'The real first year',
    h2:'In year one it is the parent who transforms, not the child.',
    kicker:'You are learning the law, choosing a pedagogy, and rebuilding your week all at once. That is three jobs, and school taught you none of them.' },

  {t:'why',
    eyebrow:'The three fears that freeze parents',
    h2:'Name them, and they get smaller.',
    cells:['Is this actually legal?','Will my child fall behind?','Am I enough to do this?'] },

  {t:'part', num:'02', h2:'The First Steps method.' },

  {t:'step', no:'Step One', h2:'Know the law.',
    body:'File your dichiarazione di educazione parentale and understand the annual exam. Once you know your rights and duties, the fear of "is this allowed" disappears for good.' },

  {t:'step', no:'Step Two', h2:'Choose your approach, before you start.',
    body:'National curriculum with the yearly exam, unschooling, Montessori, or Steiner. You can change later, but begin with clarity. This one decision removes most of the daily chaos.' },

  {t:'step', no:'Step Three', h2:'Build your network.',
    body:'Homeschooling in Italy fails from isolation, not from bad teaching. Forty-plus regional groups mean your family is never figuring it out alone.' },

  {t:'step', no:'Step Four', h2:'Pace yourself.',
    body:'The first year is a transition, not a sprint. Patience with your child, and even more with yourself, is the skill that makes everything else work.' },

  {t:'part', num:'03', h2:'What a real homeschooling year looks like.' },

  {t:'statement',
    eyebrow:'A week, not a timetable',
    h2:'It is a rhythm built around passion, autonomy, and time with others, not school rebuilt at your kitchen table.' },

  {t:'statement',
    eyebrow:'For the children school hurt',
    h2:'For a child carrying bullying, anxiety, or a neurodivergent mind, an individual path is not a luxury. It is the point.' },

  {t:'why',
    eyebrow:'Why learn this from me',
    h2:'I have lived every step you are about to take.',
    cells:['Five children, none ever in school','Twenty-plus years of parental education','Author of the Italian manual on it','Founder of the EDUpar network since 2011'] },

  {t:'statement',
    eyebrow:'You do not do it alone',
    h2:'EDUpar is the community and resources; EDUlearn is the academy for ages six to seventeen.',
    kicker:'Regional groups, two hundred-plus video lessons, and answers within a day, plus inspiring teachers for the families who want the academic path handled.' },

  {t:'list',
    eyebrow:'The First Steps, in one slide',
    h2:'This is the whole plan.',
    items:['Know the law and file your declaration.','Choose the approach that fits your family.','Get into a network so you are never alone.','Pace the first year as a transition.'] },

  {t:'cta',
    eyebrow:'Your next step',
    h2:'Start your first year with a plan, not a panic.',
    ctaStep:'Join EDUpar and begin your plan',
    disclaimer:'This masterclass is educational. Every family and every child is different, and homeschooling outcomes vary with your situation and effort. Nothing here is a guarantee of academic or any other result. This is not legal advice; always verify current requirements with your local school authority.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i) => {
  const el = document.createElement('section');
  el.className = 'slide'; el.dataset.i = i;
  let h = '';
  if (s.eyebrow) h += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.t === 'title') {
    h += `<h1>${s.h1}</h1><div class="sub">${s.sub}</div>`;
    h += `<div class="presenter">${s.presenter}<span>${s.presenterSub}</span></div>`;
  } else if (s.t === 'part') {
    h = `<div class="part-num">${s.num}</div><h2>${s.h2}</h2>`;
  } else if (s.t === 'lede') {
    h += `<div class="lede">${s.lede}</div>`;
  } else if (s.t === 'list') {
    h += `<h2>${s.h2}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  } else if (s.t === 'step') {
    h = `<div class="step-no">${s.no}</div><h2>${s.h2}</h2><div class="step-body">${s.body}</div>`;
  } else if (s.t === 'why') {
    h += `<h2>${s.h2}</h2><div class="why-grid">${s.cells.map(x=>`<div>${x}</div>`).join('')}</div>`;
  } else if (s.t === 'statement') {
    h += `<h2>${s.h2}</h2>` + (s.kicker?`<div class="kicker">${s.kicker}</div>`:'');
  } else if (s.t === 'cta') {
    h += `<h2>${s.h2}</h2><div class="cta-box"><div class="cta-step">${s.ctaStep}</div></div>`;
    h += `<div class="disclaimer">${s.disclaimer}</div>`;
  }
  el.innerHTML = h;
  deck.appendChild(el);
});

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
const prog = document.getElementById('prog');
const count = document.getElementById('count');
function show(n){
  cur = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,i)=>s.classList.toggle('on', i===cur));
  prog.style.width = ((cur+1)/slides.length*100)+'%';
  count.textContent = (cur+1)+' / '+slides.length;
}
function go(d){ show(cur+d); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') { e.preventDefault(); go(1); }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') { e.preventDefault(); go(-1); }
});
document.getElementById('deck').addEventListener('click', e=>{ if(!e.target.closest('.nav')) go(1); });
show(0);
</script>
</body>
</html>
