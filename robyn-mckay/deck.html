<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Healer to Boardroom — A Masterclass with Dr. Robyn McKay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#e9eff3;
    --panel:#fbfdfe;
    --ink:#1c2733;
    --ink-soft:#44525e;
    --rule:#9da8ad;
    --accent:#024b76;
    --deep:#023353;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:1000px}
  .slide.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.22em;font-size:14px;font-weight:600;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.01em;color:var(--ink);margin-bottom:20px}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:40px;line-height:1.1;color:var(--ink);margin-bottom:18px}
  p{font-size:21px;color:var(--ink-soft);max-width:48ch;margin-bottom:14px}
  p.lead{font-size:24px;color:var(--ink)}
  .rule{width:64px;height:3px;background:var(--accent);margin:0 0 26px}
  ul{list-style:none;margin-top:10px}
  li{font-size:21px;color:var(--ink-soft);padding:12px 0 12px 30px;position:relative;border-bottom:1px solid #e4e9ed;max-width:46ch}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  li b{color:var(--ink);font-weight:600}
  .big{font-family:'Oswald',sans-serif;font-weight:700;font-size:72px;color:var(--accent);line-height:1;margin-bottom:18px}
  .quote{font-family:'Oswald',sans-serif;font-weight:500;font-size:40px;line-height:1.2;color:var(--ink);max-width:20ch}
  .quote span{color:var(--accent)}
  .cite{margin-top:18px;font-size:16px;color:var(--rule);font-family:'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase}
  .cta h1{color:var(--accent)}
  .disclaimer{margin-top:28px;font-size:14px;color:var(--rule);max-width:60ch;line-height:1.5}
  .part .big{font-size:120px;opacity:.14;position:absolute;top:-30px;left:-6px}
  .part{position:relative;padding-top:40px}
  .nums{display:flex;gap:40px;margin-top:10px;flex-wrap:wrap}
  .num b{display:block;font-family:'Oswald',sans-serif;font-size:46px;color:var(--accent);font-weight:700;line-height:1}
  .num span{font-size:15px;color:var(--ink-soft)}
  #prog{position:fixed;bottom:0;left:0;height:4px;background:var(--accent);transition:width .3s}
  #hud{position:fixed;bottom:16px;right:22px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.16em;color:var(--rule)}
  @media(max-width:640px){h1{font-size:38px}h2{font-size:28px}.big{font-size:52px}.quote{font-size:28px}p{font-size:17px}li{font-size:17px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="prog"></div>
<div id="hud"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kicker">A live masterclass with Dr. Robyn McKay</div>
    <h1>From Healer to Boardroom</h1>
    <p class="lead">How transformational coaches attract and sign corporate clients using spiritual intelligence.</p>
    <div class="cite">Spiritually Intelligent Leader</div>
  `},
  {t:'promise', cls:'', html:`
    <div class="kicker">What you will walk away with</div>
    <div class="rule"></div>
    <ul>
      <li>Why your best work stays <b>invisible</b> to corporate buyers, and the one shift that changes it</li>
      <li>The three capacities a boardroom actually pays a coach for</li>
      <li>A positioning you can use this week to open a corporate conversation</li>
    </ul>
  `},
  {t:'who', cls:'', html:`
    <div class="kicker">Who this is for</div>
    <h2>The soulful coach who is ready for bigger rooms</h2>
    <p>You are a transformational coach, healer, or spiritual entrepreneur. Your clients get real results. And yet the corporate contracts, the ones with budget and scale, keep going to someone louder and less gifted than you.</p>
  `},
  {t:'trap', cls:'', html:`
    <div class="kicker">The trap</div>
    <h2>Certified, and still invisible</h2>
    <p>You collected the trainings. You did the inner work. You can feel exactly what a leader needs the moment they walk in. But the people with the budget never hear about you, and when they do, the language does not land.</p>
  `},
  {t:'reframe', cls:'', html:`
    <div class="kicker">The reframe</div>
    <p class="quote">It is not a <span>spirituality</span> problem.<br>It is a <span>translation</span> problem.</p>
  `},
  {t:'reframe2', cls:'', html:`
    <p class="lead">Corporate buyers are not allergic to depth. They are allergic to words they cannot put in a budget. The work is to keep the soul and change the sentence.</p>
  `},
  {t:'part1', cls:'part', html:`
    <div class="big">01</div>
    <div class="kicker">Part one</div>
    <h2>The certification treadmill</h2>
    <p>The industry sells coaches more certifications as the answer to more income. It is the wrong ladder. Another credential does not make a CFO return your email.</p>
  `},
  {t:'problem', cls:'', html:`
    <div class="kicker">Why it keeps happening</div>
    <div class="rule"></div>
    <ul>
      <li>You market on <b>modality</b> ("I am certified in X") instead of on the <b>outcome</b> a leader can feel</li>
      <li>You price for individuals, so corporate never sees a reason to engage you</li>
      <li>You wait to be discovered instead of building quiet, deliberate authority</li>
    </ul>
  `},
  {t:'part2', cls:'part', html:`
    <div class="big">02</div>
    <div class="kicker">Part two</div>
    <h2>The Spiritually Intelligent Leader</h2>
    <p>Spiritual intelligence is whole-brain: intellect, emotion, and soul, working together. It is the instrument that lets you read a room and a leader at the same time. Here is what the boardroom pays for.</p>
  `},
  {t:'pillar1', cls:'', html:`
    <div class="kicker">Capacity one</div>
    <h2>Clarity under pressure</h2>
    <p>Leaders are drowning in noise and fear. The coach who can create one clear next step in a high-stakes room is worth more than any framework. This is intellect and intuition, together.</p>
  `},
  {t:'pillar2', cls:'', html:`
    <div class="kicker">Capacity two</div>
    <h2>Intuition they can trust</h2>
    <p>You already sense what is unsaid. Translated into the language of leadership, that becomes insight an executive will pay to access, not "woo" they have to explain to their board.</p>
  `},
  {t:'pillar3', cls:'', html:`
    <div class="kicker">Capacity three</div>
    <h2>Leadership with soul</h2>
    <p>Performance without meaning burns people out. You bring the part the consultants cannot: a way of leading that is human, grounded, and sustainable. That is the whole-brain edge.</p>
  `},
  {t:'integrate', cls:'', html:`
    <p class="quote">I can work with your mind and your emotions. I cannot help you truly transform <span>unless I know your soul.</span></p>
    <div class="cite">The whole-brain approach</div>
  `},
  {t:'part3', cls:'part', html:`
    <div class="big">03</div>
    <div class="kicker">Part three</div>
    <h2>From invisible to hired</h2>
    <p>Three moves take you from overlooked to retained. None of them require you to abandon who you are.</p>
  `},
  {t:'move1', cls:'', html:`
    <div class="kicker">Move one</div>
    <h2>Reposition the outcome</h2>
    <p>Lead with what a leader will feel and do differently, not with your modality. The same gift, said in the language of the room.</p>
  `},
  {t:'move2', cls:'', html:`
    <div class="kicker">Move two</div>
    <h2>Open the corporate conversation</h2>
    <p>You do not pitch. You start a conversation a decision maker wants to continue, built on the credibility you already have.</p>
  `},
  {t:'move3', cls:'', html:`
    <div class="kicker">Move three</div>
    <h2>Design the pilot engagement</h2>
    <p>A small, well-scoped first engagement de-risks the yes and becomes the proof that earns the contract. Quiet authority compounds.</p>
  `},
  {t:'whyme', cls:'', html:`
    <div class="kicker">Why listen to me</div>
    <h2>Twelve years of quiet corporate yeses</h2>
    <div class="nums">
      <div class="num"><b>12</b><span>years signing corporate clients</span></div>
      <div class="num"><b>PhD</b><span>counseling psychology</span></div>
      <div class="num"><b>F100</b><span>leaders advised</span></div>
    </div>
    <p style="margin-top:22px">A psychologist who has sat in Fortune 100 rooms and built an international practice, teaching the exact bridge from the healing room to the boardroom.</p>
  `},
  {t:'recap', cls:'', html:`
    <div class="kicker">The whole idea, in one line</div>
    <p class="quote">Keep the soul.<br><span>Change the sentence.</span><br>Win the room.</p>
  `},
  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next step</div>
    <h1>Work with me</h1>
    <p class="lead">If you are ready to attract corporate clients without losing what makes your work yours, apply to the Corporate Client Attraction Mastermind.</p>
    <p class="disclaimer">This masterclass is educational. No income, role, or result is guaranteed. Results vary based on your market, your effort, and many factors outside any program's control.</p>
  `}
];
const stage=document.getElementById('stage');
stage.innerHTML=S.map((s,i)=>`<section class="slide ${s.cls||''}" data-i="${i}">${s.html}</section>`).join('');
const slides=[...document.querySelectorAll('.slide')];
let i=0;
function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((el,k)=>el.classList.toggle('on',k===i));
  document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';
  document.getElementById('hud').textContent=(i+1).toString().padStart(2,'0')+' / '+slides.length.toString().padStart(2,'0');}
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
addEventListener('click',e=>{show(i+(e.clientX<innerWidth*0.3?-1:1));});
show(0);
</script>
</body>
</html>
