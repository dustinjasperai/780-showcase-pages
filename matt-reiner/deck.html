<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The FutureProof Firm | Matt Reiner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#ffffff;
    --panel:#f4f6f7;
    --rule:#dfe5e5;
    --ink:#15302e;
    --ink-soft:#355451;
    --ink-muted:#6c8683;
    --accent:#22a9a0;
  }
  html,body{height:100%}
  body{font-family:'Open Sans',-apple-system,sans-serif;background:var(--panel);color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{max-width:1040px;margin:0 auto;padding:28px 20px 90px}
  .slide{display:none;background:var(--bg);border:1px solid var(--rule);border-radius:14px;min-height:560px;padding:58px 62px;position:relative;box-shadow:0 1px 0 rgba(21,48,46,.03)}
  .slide.active{display:block}
  .eyebrow{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:46px;line-height:1.1;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:34px;line-height:1.15;margin-bottom:20px}
  .lead{font-size:21px;color:var(--ink-soft);line-height:1.55;max-width:40ch}
  p{font-size:19px;color:var(--ink-soft);line-height:1.6;max-width:46ch;margin-bottom:14px}
  .sub{font-size:16px;color:var(--ink-muted);font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:.04em;margin-top:8px}
  .part{font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted)}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;color:var(--ink-soft);line-height:1.5;padding-left:26px;position:relative;margin-bottom:14px;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:2px;background:var(--accent)}
  .big{font-family:'Montserrat',sans-serif;font-weight:700;font-size:58px;color:var(--accent);line-height:1;margin:6px 0 14px}
  .pillarnum{font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;color:var(--accent);letter-spacing:.1em;margin-bottom:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
  .cell{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px}
  .cell .k{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--ink);font-size:18px;margin-bottom:8px}
  .cell .v{font-size:15px;color:var(--ink-muted);line-height:1.45}
  .flow{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
  .flow span{font-family:'Montserrat',sans-serif;font-weight:600;font-size:16px;background:var(--panel);border:1px solid var(--rule);border-radius:40px;padding:10px 18px;color:var(--ink)}
  .flow span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .disc{font-size:13px;color:var(--ink-muted);line-height:1.5;max-width:60ch;margin-top:26px;font-style:italic}
  .cta-line{font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;color:var(--ink);margin-top:10px}
  footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:var(--bg);border-top:1px solid var(--rule);font-family:'Montserrat',sans-serif}
  .brandmark{font-weight:700;font-size:14px;color:var(--ink);letter-spacing:.02em}
  .brandmark .dot{color:var(--accent)}
  .nav{display:flex;align-items:center;gap:14px}
  .nav button{font-family:'Montserrat',sans-serif;font-weight:600;font-size:14px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer}
  .nav button:disabled{opacity:.3;cursor:default}
  .count{font-size:13px;color:var(--ink-muted)}
  @media(max-width:680px){.slide{padding:40px 26px;min-height:480px}h1{font-size:32px}h2{font-size:26px}.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="stage"></div>
<footer>
  <div class="brandmark">The FutureProof Advisor<span class="dot"> ·</span> Matt Reiner</div>
  <div class="nav">
    <button id="prev">Prev</button>
    <span class="count" id="count"></span>
    <button id="next">Next</button>
  </div>
</footer>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Matt Reiner',h:'The FutureProof Firm',lead:'How to scale past your next $100M in AUM without adding bodies.'},
 {t:'who',eyebrow:'Who this is for',h:'The advisor whose firm grew faster than its systems',lead:'You built real AUM. The work that got you here is now the work keeping you stuck.'},
 {t:'trap',eyebrow:'The trap',h:'You added clients. Then you added hours. Then you stopped growing.',lead:'Every new relationship bought you more admin, more meetings, more things only you can do. Growth started to feel like punishment.'},
 {t:'reframe',eyebrow:'The reframe',h:'The problem was never capacity. It was the parameters.',lead:'In Star Trek, the no-win test is only unbeatable if you accept the rules. The advisor who scales changes the rules instead of grinding harder inside them.'},
 {t:'part',part:'Part One',h:'Why "add staff" stops working'},
 {t:'body',eyebrow:'The math of hiring',h:'Headcount scales cost in lockstep with revenue',bullets:['Every seat you add takes a bite out of margin and a bite out of your week','The firm gets bigger without getting more valuable','You become the bottleneck AND the most expensive employee']},
 {t:'body',eyebrow:'The alternative',h:'Create capacity without proportional cost',lead:'Leverage and technology let one advisor serve more households at a higher standard. Change the parameters, and the firm scales without the owner in every seat.'},
 {t:'part',part:'Part Two',h:'The Three Pillars of a FutureProof Firm'},
 {t:'pillar',num:'Pillar 01',h:'Mindset',lead:'Stop thinking like the best technician in the building and start thinking like the owner of a system. Growth is a design problem, not an effort problem.'},
 {t:'pillar',num:'Pillar 02',h:'Leverage',lead:'Build people and technology that do the repeatable work, so your time is spent only where your judgement is the product.'},
 {t:'pillar',num:'Pillar 03',h:'Process',lead:'Make the firm repeatable. When the work is standardized, it can be delegated, measured, and improved without you watching it.'},
 {t:'moves',eyebrow:'From pillars to practice',h:'Three moves that create capacity this quarter'},
 {t:'move',eyebrow:'Move one',h:'Relay realistic expectations',lead:'Set a defined client-communication cadence so service stops happening at random.',grid:[['Monthly','a short written update'],['Quarterly','a video review'],['Annually','one in-person meeting']]},
 {t:'body',eyebrow:'Move two',h:'Standardize the process',bullets:['Onboarding runs the same way every time','Portfolio construction follows a rule set, not a mood','Meeting prep is a checklist, not a scramble','What is standardized can finally be handed off']},
 {t:'body',eyebrow:'Move three',h:'Integrate your tech',bullets:['Connect CRM, calendar, portfolio, and custodian','Kill the manual re-entry that falls between systems','Let the stack carry the busywork so the team carries the clients']},
 {t:'part',part:'Part Three',h:'Rolling it out without betting the firm'},
 {t:'flow',eyebrow:'The rollout method',h:'Launch, Learn, Iterate, Scale',lead:'Run the change as an experiment that does not need to succeed. Small launch, honest learning, tighten, then scale what works.',steps:['Launch','Learn','Iterate','Scale']},
 {t:'why',eyebrow:'Why this method',h:'Built in a real firm, not a slide deck',bullets:['Grew Capital Investment Advisors from $800M to $8.1B in AUM across five offices','15+ years scaling wealth-management practices','Named InvestmentNews 40-Under-40','Host of the FutureProof Advisor Podcast and two-time bestselling author']},
 {t:'picture',eyebrow:'The firm on the other side',h:'A firm that runs without you in every seat',lead:'More households served, better service, protected margin, and an owner whose calendar is finally spent on growth and judgement, not admin.'},
 {t:'cta',eyebrow:'Your next step',h:'Build your FutureProof Firm',ctaline:'If you are ready to take control of your growth, let us start the conversation.',sub:'Bring your firm to a working session with Matt and the FutureProof Advisor team.',disc:'Educational content only. No income, outcome, or performance result is guaranteed. Results vary and depend on your own firm, market, and effort.'}
];
const stage=document.getElementById('stage');
let i=0;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){
  stage.innerHTML='';
  S.forEach((s,idx)=>{
    const d=document.createElement('div');
    d.className='slide'+(idx===i?' active':'');
    let html='';
    if(s.eyebrow)html+=`<div class="eyebrow">${esc(s.eyebrow)}</div>`;
    if(s.part)html+=`<div class="part">${esc(s.part)}</div><h2 style="margin-top:14px">${esc(s.h)}</h2>`;
    else if(s.t==='title')html+=`<h1>${esc(s.h)}</h1>`;
    else if(s.num){html+=`<div class="pillarnum">${esc(s.num)}</div><h2>${esc(s.h)}</h2>`;}
    else html+=`<h2>${esc(s.h)}</h2>`;
    if(s.lead)html+=`<p class="lead">${esc(s.lead)}</p>`;
    if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+=`<li>${esc(b)}</li>`);html+='</ul>';}
    if(s.grid){html+='<div class="grid3">';s.grid.forEach(g=>html+=`<div class="cell"><div class="k">${esc(g[0])}</div><div class="v">${esc(g[1])}</div></div>`);html+='</div>';}
    if(s.steps){html+='<div class="flow">';s.steps.forEach((st,k)=>html+=`<span class="${k===0?'on':''}">${esc(st)}</span>`);html+='</div>';}
    if(s.ctaline)html+=`<div class="cta-line">${esc(s.ctaline)}</div>`;
    if(s.sub)html+=`<div class="sub">${esc(s.sub)}</div>`;
    if(s.disc)html+=`<div class="disc">${esc(s.disc)}</div>`;
    d.innerHTML=html;
    stage.appendChild(d);
  });
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
  document.getElementById('prev').disabled=i===0;
  document.getElementById('next').disabled=i===S.length-1;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render()}
document.getElementById('prev').onclick=()=>go(i-1);
document.getElementById('next').onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
stage.addEventListener('click',e=>{if(!e.target.closest('button'))go(i+1)});
render();
</script>
</body>
</html>
