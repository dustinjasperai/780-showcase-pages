<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn One Customer Into Twenty — Emily Gibson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8eff5;
    --panel:#fcfdfe;
    --rule:#dbe3ea;
    --ink:#2a2d34;
    --muted:#6b7480;
    --accent:#2b7bb9;
    --accent-soft:#eaf3fa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:54px 56px;margin:22px 0;box-shadow:0 1px 3px rgba(42,45,52,.04);min-height:360px;display:flex;flex-direction:column;justify-content:center}
  .slide.title{min-height:520px;justify-content:center;background:linear-gradient(180deg,#ffffff 0%,var(--accent-soft) 100%)}
  .kicker{font-family:"Manrope";font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Noto Serif";font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"Noto Serif";font-weight:600;font-size:34px;line-height:1.15;margin-bottom:14px}
  .lede{font-size:21px;line-height:1.5;color:var(--muted);margin-top:18px;max-width:30em}
  p.body{font-size:19px;line-height:1.6;max-width:34em;margin-top:10px}
  p.body + p.body{margin-top:14px}
  .big{font-family:"Noto Serif";font-weight:700;font-size:40px;line-height:1.1;color:var(--accent)}
  ul{list-style:none;margin-top:18px}
  li{font-size:19px;line-height:1.55;padding:12px 0 12px 44px;position:relative;border-bottom:1px solid var(--rule);max-width:36em}
  li:last-child{border-bottom:none}
  li .n{position:absolute;left:0;top:10px;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
  li b{font-weight:700}
  .step{font-family:"Noto Serif";font-weight:600;color:var(--accent)}
  .present{display:flex;align-items:baseline;gap:14px;margin-top:30px;color:var(--muted);font-size:17px}
  .present b{color:var(--ink);font-weight:700}
  .mathrow{display:flex;align-items:center;gap:18px;margin-top:24px;flex-wrap:wrap}
  .mathrow .cell{background:var(--accent-soft);border-radius:12px;padding:20px 26px;font-family:"Noto Serif";font-weight:700;font-size:30px;color:var(--accent)}
  .arrow{font-size:26px;color:var(--muted)}
  .disclaimer{font-size:14px;color:var(--muted);line-height:1.5;margin-top:26px;max-width:40em}
  .cta-btn{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;font-weight:700;font-size:19px;padding:16px 30px;border-radius:10px;text-decoration:none}
  .pagenum{font-size:13px;color:var(--muted);margin-top:26px;letter-spacing:.08em}
  @media(max-width:640px){.slide{padding:36px 26px}h1{font-size:38px}h2{font-size:27px}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'A Live Class for Network Marketers',h1:'Turn One Customer Into Twenty',lede:'The simple, repeatable systems that grow a network marketing team in 30 days or less, without chasing, spamming, or burning out.',present:'Emily Gibson · Master Certified Trauma-Informed Coach · Host of Beyond the Rank'},

  {t:'who',kicker:'Who this is for',h2:'If you are the one holding it all together',body:['You are a network marketer or social seller who has done the work. You post, you message, you follow up, you show up on every team call.','And still the growth feels heavy, slow, and completely dependent on you.','This class is for the leader who is ready to be the architect of a system instead of the engine that can never stop.']},

  {t:'trap',kicker:'The trap',h2:'You were told the answer was more',body:['Post more. Message more. Go live more. Recruit harder. Follow up until they block you.','So you did. And the harder you pushed, the more fragile the whole thing felt.','More effort was never the missing piece.']},

  {t:'reframe',kicker:'The reframe',h2:'It was the right things in the wrong order',body:['Most network marketers are solving the wrong problems in the wrong sequence. They chase visibility before they have a system, and automation before they have a process worth automating.','The fix is not working harder. It is running the three systems that make a business grow on purpose.']},

  {t:'part',kicker:'Part One',h2:'The core problem: you are the system'},

  {t:'content',kicker:'Part One',h2:'When you stop, everything stops',body:['I once built a team of twenty thousand people. I was proud of it, and I was also the single point of failure. I was the system. The day I slowed down, the business slowed down with me.','That is how a team leader becomes a team martyr. Nothing in the business can duplicate, because the one thing it runs on is you.']},

  {t:'content',kicker:'Part One',h2:'The hidden cost',body:['A business that only works when you are on means you can never actually leave. Not for a weekend, not for your family, not for your own health.','The goal was never a bigger to-do list. It was a business that grows while you become someone you are proud of.']},

  {t:'part',kicker:'Part Two',h2:'The three systems that do the growing'},

  {t:'system',kicker:'System one',h2:'Three-Step Recruiting',body:['Attract, qualify, and enroll without chasing a single person.'],steps:[['Attract','People raise their hand because of what you share, so you stop cold messaging strangers.'],['Qualify','A simple step lets the wrong-fit people opt themselves out before you ever get on a call.'],['Enroll','You have an enrollment conversation with someone who already wants what you have.']]},

  {t:'system',kicker:'System two',h2:'Three-Step Duplication',body:['Build a team that replicates, so growth is not chained to you.'],steps:[['Teach','A new person learns one simple process the first week they join, not a 40-step binder.'],['Do','They run it on real prospects right away and get an early win.'],['Hand off','They teach the same process to their first person, and the system copies itself down the line.']]},

  {t:'system',kicker:'System three',h2:'Four-Step Follow-Up',body:['Most sales live in the follow-up. This is how you do it with timing and consistency, and without feeling pushy.'],steps:[['Right timing','You follow up on a rhythm, not a whim, so nothing goes cold.'],['Consistent message','Every touch points at the same clear next step.'],['Authentic tone','You sound like a human being, not a sales script.'],['Clean close','You make the ask once, clearly, and let them decide.']]},

  {t:'math',kicker:'The outcome',h2:'One customer into twenty',body:['These three systems compound. One happy customer, followed up well, becomes referrals and a first team member, who runs the same duplicatable process.'],math:['1 customer','20 in 30 days']},

  {t:'part',kicker:'Part Three',h2:'A business that grows at a calm pace'},

  {t:'content',kicker:'Part Three',h2:'When the systems carry the weight, not you',body:['Sustainable growth is not only a marketing problem, it is a nervous-system one. When your business runs on chasing and urgency, your body lives in it too.','The systems above are built to lower the pressure, not raise it. You grow from a calm, repeatable rhythm instead of a constant scramble.']},

  {t:'why',kicker:'Why listen to me',h2:'I have built this the hard way and the sustainable way',body:['Nearly a decade coaching leaders and network marketers. A downline of roughly twenty thousand people built the old exhausting way, before I rebuilt everything on systems.','Master Certified Trauma-Informed Coach, host of the Beyond the Rank podcast, and the person thousands of network marketers trust to turn complexity into a plan they can actually run.']},

  {t:'recap',kicker:'The system, in one view',h2:'Three systems, one calm business',steps:[['Recruiting','Attract, qualify, enroll without chasing.'],['Duplication','A process your team can copy the first week.'],['Follow-Up','Timing, consistency, and authenticity that closes.']]},

  {t:'cta',kicker:'Your next step',h2:'Come build your systems with me',body:['If you want the full walk-through and the templates, come to my free live class. I teach these exact systems in real time, and you leave with the first one ready to run.'],cta:'Come to my free class',disclaimer:'This class is educational. No income or rank result is guaranteed. Results vary and depend on your effort, your market, your company, and many factors outside any coach control.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t==='title'?'title':'');
  let h='';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.h1) h+=`<h1>${s.h1}</h1>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.lede) h+=`<p class="lede">${s.lede}</p>`;
  if(s.body) s.body.forEach(p=>h+=`<p class="body">${p}</p>`);
  if(s.steps){h+='<ul>';s.steps.forEach((st,j)=>h+=`<li><span class="n">${j+1}</span><b class="step">${st[0]}.</b> ${st[1]}</li>`);h+='</ul>';}
  if(s.math){h+='<div class="mathrow">';s.math.forEach((m,j)=>{h+=`<div class="cell">${m}</div>`;if(j<s.math.length-1)h+='<span class="arrow">&rarr;</span>';});h+='</div>';}
  if(s.present) h+=`<div class="present"><b>${s.present}</b></div>`;
  if(s.cta) h+=`<a class="cta-btn" href="#">${s.cta}</a>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  if(s.t!=='title') h+=`<div class="pagenum">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
