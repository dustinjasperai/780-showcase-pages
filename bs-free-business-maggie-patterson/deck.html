<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staying Solo - The Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f5;
    --panel:#ffffff;
    --rule:#ece2dc;
    --ink:#1b141c;
    --muted:#6a6069;
    --accent:#e40047;
    --accent2:#7a1ba8;
    --head:'Montserrat',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(960px,94vw);aspect-ratio:16/9;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:0 18px 50px rgba(27,20,28,.08);position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;padding:64px 72px;display:none;flex-direction:column;justify-content:center;gap:18px}
  .slide.on{display:flex}
  .eyebrow{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent)}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.1;letter-spacing:-.01em}
  h3{font-family:var(--head);font-weight:700;font-size:22px}
  p{font-size:20px;line-height:1.5;color:#2c2430;max-width:40ch}
  p.lead{font-size:23px}
  .big{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  .accent{color:var(--accent)}
  .accent2{color:var(--accent2)}
  ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:6px}
  li{font-size:20px;line-height:1.4;padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:11px;height:11px;border-radius:3px;background:var(--accent)}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
  .pill{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .pill .k{font-family:var(--head);font-weight:800;font-size:22px;color:var(--accent2)}
  .pill .v{font-size:16px;color:var(--muted);margin-top:8px;line-height:1.4}
  .rule{height:4px;width:68px;background:var(--accent);border-radius:3px}
  .foot{position:absolute;left:72px;bottom:28px;font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .pg{position:absolute;right:28px;bottom:26px;font-size:12px;color:var(--muted)}
  .disc{font-size:13px;color:var(--muted);max-width:52ch;line-height:1.45;margin-top:12px}
  .qs{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .qs span{font-size:19px;color:#2c2430}
  .cta-box{margin-top:10px;display:inline-flex;align-items:center;gap:12px;font-family:var(--head);font-weight:800;font-size:22px;color:#fff;background:var(--accent);padding:16px 26px;border-radius:999px;width:max-content}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  .nav button{font-family:var(--head);font-weight:700;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S=[
  {t:'title',eyebrow:'A free live masterclass',h:'Staying Solo',sub:'How to build a predictable, profitable and peaceful service business - without scaling into a team you never wanted.',by:'With Maggie Patterson, BS-Free Business'},
  {t:'who',eyebrow:'Who this is for',h:'For the established solo owner.',p:'You are a consultant, creative, strategist or micro-agency owner. The work is good and the clients are real. You are just tired of being told the only way up is to hire, grow a team and build an agency you never actually wanted.',foot:'Not for people looking to scale to a 30-person shop. This is the opposite of that.'},
  {t:'trap',eyebrow:'The trap',h:'You were sold one version of success.',p:'More clients. More team. More overhead. A bigger logo on a bigger door. And somehow, after all of it, the same take-home pay and a lot less of your life.'},
  {t:'hook',eyebrow:'The reframe',big:'Growth is not the goal. A business that pays you well and gives you your life back is.'},
  {t:'section',eyebrow:'Part one',h:'The real problem is not that you are too small.',p:'It is that the business was built to grow, not to pay you. Size hides the leaks. Staying solo exposes them, and then fixes them.'},
  {t:'body',eyebrow:'The treadmill',h:'Busy is not the same as profitable.',ul:['More clients means more delivery, more admin, more fires','A team adds payroll before it adds freedom','Revenue goes up and the owner keeps the smallest slice']},
  {t:'statement',eyebrow:'The thesis',big:'Boring is not the enemy. Boring is the goal.',p:'Predictable beats exciting. Calm days and sound sleep come from a business that is simple on purpose.'},
  {t:'section',eyebrow:'Part two',h:'The Staying Solo Framework',p:'Three pillars that turn a busy solo business into a calm, profitable one. You do not need more. You need these three working together.'},
  {t:'pillars',eyebrow:'The three pillars',h:'Salary. Strategy. Space.',pills:[['Salary','Pay yourself well, consistently, and with confidence. The business exists to pay you first.'],['Strategy','Focus only on what actually works. Cut the offers and marketing that do not make money.'],['Space','Build breathing room so you can run the business sustainably instead of being the bottleneck.']]},
  {t:'body',eyebrow:'Pillar one - Salary',h:'Pay yourself first, on purpose.',ul:['Set the number you need to take home, then design the business around it','Price so one good client funds real profit, not just more work','Confidence comes from a number you can count on, not a bigger roster']},
  {t:'body',eyebrow:'Pillar two - Strategy',h:'Do less, but only the parts that pay.',ul:['List every offer and marketing channel, then find the few that actually earn','Retire the ones that drain time and return little','A small, sharp menu converts better than a big, noisy one']},
  {t:'body',eyebrow:'Pillar three - Space',h:'Capacity is the real currency.',ul:['Protect the hours that do the paid work and the thinking','Breathing room is what lets you raise prices and say no','A booked-solid calendar with no space is a trap, not a win']},
  {t:'body',eyebrow:'The starting point',h:'We do not mess with what is working.',p:'Every reset starts with four honest questions:',ul:['What is working right now?','What is not?','What is actually making money?','What is quietly eating your time?']},
  {t:'section',eyebrow:'Part three',h:'Calm days, steady money, your life back.',p:'Not a bigger business. A quieter, steadier one that you would happily run for another ten years.'},
  {t:'body',eyebrow:'The payoff',h:'Predictable. Profitable. Peaceful.',ul:['Revenue you can forecast instead of hope for','A take-home that finally matches the effort','Calm days, sound sleep, and no manufactured drama']},
  {t:'statement',eyebrow:'The objection',big:'But will staying small cap my income?',p:'No. Raising prices, cutting waste and protecting capacity lifts the owner profit. Headcount is not the lever. Margin is.'},
  {t:'who',eyebrow:'Why listen to me',h:'I have only ever done this.',p:'I am Maggie Patterson. Twenty-five years in client services, twenty running my own business, and since 2016 I have worked only with service business owners - hundreds of solo providers and micro-agency owners. I wrote the book Staying Solo and host the Staying Solo podcast.',foot:'I am not a scale guru who pivoted. Small on purpose is the whole point.'},
  {t:'body',eyebrow:'The recap',h:'Three moves, one peaceful business.',ul:['Salary - design the business to pay you first','Strategy - keep only what works','Space - guard the capacity that makes it sustainable']},
  {t:'statement',eyebrow:'One last thing',big:'The quiet business is the strong business.',p:'When nothing is on fire, you can finally see clearly, charge properly and choose your clients.'},
  {t:'cta',eyebrow:'Your next step',h:'Want help building yours?',p:'If you are an established owner who wants a predictable, profitable and peaceful solo business, let us map it out together. Book a call and we will look at your Salary, Strategy and Space, and whether the Paid and Peaceful Mastermind is the right fit.',cta:'Book a call with Maggie',disc:'This masterclass is educational only. It is not a guarantee of income or results, and outcomes vary by business, effort and market. Nothing here is financial, legal or tax advice.'}
];
const stage=document.getElementById('stage');let i=0;
function slideHTML(s,n){
  let inner='';
  if(s.eyebrow)inner+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='title'){inner+=`<h1>${s.h}</h1><div class="rule"></div><p class="lead">${s.sub}</p><h3 style="color:var(--muted);font-weight:700;margin-top:6px">${s.by}</h3>`;}
  else if(s.t==='hook'||s.t==='statement'){inner+=`<div class="big">${s.big}</div>`;if(s.p)inner+=`<p class="lead">${s.p}</p>`;}
  else if(s.t==='pillars'){inner+=`<h2>${s.h}</h2><div class="pillars">`+s.pills.map(p=>`<div class="pill"><div class="k">${p[0]}</div><div class="v">${p[1]}</div></div>`).join('')+`</div>`;}
  else{if(s.h)inner+=`<h2>${s.h}</h2>`;if(s.p)inner+=`<p class="lead">${s.p}</p>`;if(s.ul)inner+=`<ul>`+s.ul.map(x=>`<li>${x}</li>`).join('')+`</ul>`;if(s.qs)inner+=`<div class="qs">`+s.qs.map(x=>`<span>${x}</span>`).join('')+`</div>`;if(s.foot)inner+=`<p style="font-size:15px;color:var(--muted);margin-top:8px">${s.foot}</p>`;}
  if(s.t==='cta'){inner+=`<div class="cta-box">${s.cta}</div><div class="disc">${s.disc}</div>`;}
  inner+=`<div class="foot">Staying Solo &middot; BS-Free Business</div><div class="pg">${n+1} / ${S.length}</div>`;
  return inner;
}
function render(){stage.innerHTML='';const d=document.createElement('div');d.className='slide on';d.innerHTML=slideHTML(S[i],i);stage.appendChild(d);}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
