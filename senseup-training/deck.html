<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Sensory Strategies Stop Working: SenseUp Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfcfa;
    --panel:#eef3ec;
    --rule:#cdddcf;
    --ink:#22332c;
    --muted:#555656;
    --accent:#ff914d;
    --green:#71a97a;
    --display:'Quicksand',system-ui,sans-serif;
    --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d8e0d6;color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:18px;
    aspect-ratio:16/9;
    padding:56px 64px;
    margin:0 0 26px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
    box-shadow:0 10px 30px rgba(34,51,44,.08);
  }
  .slide::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent);
  }
  .bands{position:absolute;right:-60px;bottom:-60px;width:240px;height:240px;opacity:.14;
    background:
      radial-gradient(circle at 30% 30%, var(--accent) 0 18%, transparent 19%),
      repeating-linear-gradient(180deg,var(--green) 0 14px,transparent 14px 44px);
    border-radius:50%;}
  .kicker{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.1;margin-bottom:18px}
  .promise{font-size:22px;color:var(--muted);margin-top:22px;max-width:34ch;line-height:1.45}
  p.lead{font-size:22px;line-height:1.5;max-width:40ch;color:var(--ink)}
  p.sub{font-size:19px;line-height:1.5;color:var(--muted);margin-top:14px;max-width:46ch}
  ul{list-style:none;margin-top:10px}
  ul li{font-size:21px;line-height:1.35;padding:12px 0 12px 42px;position:relative;border-bottom:1px solid var(--rule)}
  ul li:last-child{border-bottom:none}
  ul li::before{content:"";position:absolute;left:8px;top:19px;width:14px;height:14px;border-radius:4px;background:var(--green)}
  ul li b{font-family:var(--display);font-weight:700}
  .layers li::before{background:var(--accent)}
  .big{font-size:60px;font-family:var(--display);font-weight:700;line-height:1.02;max-width:20ch}
  .part{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
  .cta h2{font-size:42px}
  .cta .step{display:inline-block;margin-top:24px;font-family:var(--display);font-weight:700;font-size:22px;
    color:var(--bg);background:var(--ink);padding:16px 30px;border-radius:999px}
  .disclaimer{position:absolute;left:64px;right:64px;bottom:26px;font-size:13px;color:var(--muted);line-height:1.4}
  .foot{position:absolute;left:64px;bottom:22px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--green);letter-spacing:.08em}
  .n{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:8px}
  .two .box{background:var(--panel);border-radius:14px;padding:22px 24px}
  .two .box h3{font-family:var(--display);font-weight:700;font-size:21px;margin-bottom:8px}
  .two .box p{font-size:17px;color:var(--muted);line-height:1.45}
  .credit .lead{font-size:20px}
  @media(max-width:700px){.slide{padding:30px 26px}h1{font-size:34px}.big{font-size:38px}h2{font-size:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass for paediatric OTs', h:'Why Sensory Strategies Stop Working', promise:'What the latest nervous-system and trauma research means for the hardest children on your caseload.'},

  {t:'who', kicker:'Who this is for', lead:'The paediatric OT who has thought, "I know the strategies. Why are they not translating?"', sub:'You support children where regulation, sensory processing, motor planning, trauma history and participation are all interacting at once.'},

  {t:'who', kicker:'The trap', lead:'You are using evidence-informed strategies. You see moments of regulation, engagement and organisation.', sub:'And yet progress is inconsistent, what helps one day does not help the next, and carryover into everyday function stays limited.'},

  {t:'hook', big:'This is not a knowledge gap. It is a reasoning gap.'},

  {t:'part', part:'Part One', h:'The core problem'},

  {t:'who', kicker:'Bottom-up and top-down', lead:'Neither bottom-up nor top-down reasoning alone tells the whole story.', sub:'A child can organise beautifully in the session and still cannot access the same capacity at home or at school. The strategy was never the whole answer.'},

  {t:'who', kicker:'The missing foundation', lead:'Before the sensory input lands, the nervous system decides whether the child is safe enough to use it.', sub:'Autonomic state, co-regulation and lived experience sit underneath every sensory response. Skip that layer and the best strategy stalls.'},

  {t:'part', part:'Part Two', h:'The SenseUp Model 360'},

  {t:'who', kicker:'One framework for the whole case', lead:'A five-layer, bidirectional way to reason through complex presentations.', sub:'You reason up from nervous-system state to participation, and back down from a stuck occupation to the layer that is actually holding it. That is the 360.'},

  {t:'layers', kicker:'The five layers', h:'From safety to participation', items:[
    '<b>Foundation.</b> Nervous-system safety: autonomic state, polyvagal theory, co-regulation, trauma',
    '<b>Level 1.</b> Integrated sensory processing: vestibular, proprioception, interoception, tactile',
    '<b>Level 2.</b> Sensory-motor integration: body awareness, postural control, motor planning',
    '<b>Level 3.</b> Perceptual-motor skills: motor skills, visual-spatial, attention and language',
    '<b>Level 4.</b> Occupational participation: toileting, mealtimes, sleep, learning, relationships'
  ]},

  {t:'who', kicker:'Foundation layer', lead:'Nervous-system safety comes first.', sub:'Polyvagal state, co-regulation, attachment and a trauma-informed lens. Regulation is not a strategy you add on top. It is the ground everything else is built on.'},

  {t:'who', kicker:'Levels one and two', lead:'Then sensory processing, then sensory-motor integration.', sub:'Once the system is safe enough, you can read the seven sensory systems honestly, and see how body awareness, postural control and motor planning build on them.'},

  {t:'who', kicker:'Levels three and four', lead:'Perceptual-motor skills, then occupational participation.', sub:'The point of the climb is the top layer: toileting, mealtimes, sleep, learning and relationships. The occupation is the goal, not the sensory score.'},

  {t:'who', kicker:'Why bidirectional', lead:'You can start anywhere and reason in both directions.', sub:'A child stuck at mealtimes can be traced down to an interoception or a safety question. A dysregulated system can be traced up to the occupations it is blocking.'},

  {t:'part', part:'Part Three', h:'In the room on Monday'},

  {t:'tools', kicker:'Two tools you can use this week', h:'Reasoning you can hold in your hand', items:[
    '<b>The body check-in.</b> A prompt that brings the child’s internal state into the reasoning before you choose an input.',
    '<b>The integration question.</b> A second prompt that connects what happens in the session to the occupation it needs to reach.'
  ]},

  {t:'who', kicker:'A complex case, re-reasoned', lead:'A long referral, several diagnoses, interventions that have not quite landed.', sub:'Instead of adding another strategy, you walk the layers. You find where the case is actually stuck, and you can explain the reasoning to the family and to funding bodies with the evidence behind it.'},

  {t:'credit', kicker:'Who is teaching this', h:'Kerry Evetts', lead:'Occupational therapist with nearly three decades of paediatric clinical experience, creator of The SenseUp Approach and the SenseUp Model 360.', sub:'"I do the research so you do not have to. When you understand the neuroscience, it becomes so much easier to understand the child’s behaviours."'},

  {t:'who', kicker:'What you leave with', lead:'Current evidence translated into practice, a framework, and two tools.', sub:'A clearer clinical explanation for why a strategy appears inconsistent, and what needs to shift for more reliable carryover across every setting that matters.'},

  {t:'cta', kicker:'Your next step', h:'Go deeper with the SenseUp Approach', step:'Explore The SenseUp Approach Course', disclaimer:'This masterclass is for the professional development and clinical reasoning of occupational therapists and allied health professionals. It is educational and does not constitute medical advice or guarantee specific clinical outcomes. Results vary with each child, clinician and context.'}
];

const deck = document.getElementById('deck');
function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}
S.forEach((s,i)=>{
  let inner='';
  const foot='<div class="foot">SENSEUP TRAINING</div><div class="n">'+(i+1)+' / '+S.length+'</div><div class="bands"></div>';
  if(s.t==='title'){
    inner='<div class="kicker">'+s.kicker+'</div><h1>'+s.h+'</h1><div class="promise">'+s.promise+'</div>'+foot;
  }else if(s.t==='hook'){
    inner='<div class="big">'+s.big+'</div>'+foot;
  }else if(s.t==='part'){
    inner='<div class="part">'+s.part+'</div><h2 style="margin-top:12px">'+s.h+'</h2>'+foot;
  }else if(s.t==='layers'||s.t==='tools'){
    inner='<div class="kicker">'+s.kicker+'</div><h2>'+s.h+'</h2><ul class="'+(s.t==='layers'?'layers':'')+'">'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+foot;
  }else if(s.t==='credit'){
    inner='<div class="kicker">'+s.kicker+'</div><h2>'+s.h+'</h2><p class="lead">'+s.lead+'</p><p class="sub">'+s.sub+'</p>'+foot;
  }else if(s.t==='cta'){
    inner='<div class="kicker">'+s.kicker+'</div><h2>'+s.h+'</h2><div class="step">'+s.step+'</div><div class="disclaimer">'+s.disclaimer+'</div><div class="foot">SENSEUP TRAINING</div><div class="n">'+(i+1)+' / '+S.length+'</div>';
  }else{
    inner='<div class="kicker">'+s.kicker+'</div><p class="lead">'+s.lead+'</p>'+(s.sub?'<p class="sub">'+s.sub+'</p>':'')+foot;
  }
  const cls='slide'+(s.t==='cta'?' cta':'')+(s.t==='credit'?' credit':'');
  const node=el('<div class="'+cls+'"></div>');
  node.innerHTML=inner;
  deck.appendChild(node);
});
</script>
</body>
</html>
