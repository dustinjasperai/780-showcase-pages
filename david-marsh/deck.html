<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Team That Thrives Without You — House of Leadership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15161a; --panel:#23242b; --rule:#33343d;
    --ink:#e7e8ec; --muted:#a7a596; --accent:#978e79;
    --head:'Spectral',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0d0e11;color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:14px;padding:56px 56px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .slide::before{content:"";position:absolute;left:56px;top:40px;width:46px;height:2px;background:var(--accent);opacity:.9}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:600;font-size:46px;line-height:1.08;margin:.1em 0 .25em}
  h2{font-family:var(--head);font-weight:500;font-size:34px;line-height:1.14;margin:.1em 0 .4em}
  p{font-size:19px;line-height:1.5;color:var(--ink);max-width:62ch;margin:.3em 0}
  p.lead{font-size:22px;color:var(--ink)}
  p.muted{color:var(--muted)}
  ul{margin:.4em 0;padding:0;list-style:none;max-width:64ch}
  li{font-size:19px;line-height:1.45;padding:10px 0 10px 26px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:2px;background:var(--accent)}
  li b{font-family:var(--head);font-weight:600}
  .num{font-family:var(--head);font-size:15px;color:var(--accent);letter-spacing:.12em}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .box{border:1px solid var(--rule);border-radius:10px;padding:22px}
  .box h3{font-family:var(--head);font-weight:600;font-size:20px;margin:0 0 8px}
  .box p{font-size:16px;margin:0}
  .cta{background:var(--panel)}
  .cta .big{font-family:var(--head);font-size:40px;line-height:1.1;margin:.1em 0 .3em}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch}
  .foot{position:absolute;right:56px;bottom:30px;font-size:12px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'House of Leadership · A live masterclass', h:'Build a Team That Thrives Without You', p:'The leaders who get promoted are not the ones who solve everything. They are the ones whose teams keep moving when they step away. Here is how to become one of them.', foot:'David Marsh'},

  {t:'who', kicker:'Who this is for', h:'You lead a team, and lately it all runs through you', p:'New managers, leaders stepping up to senior roles, and anyone whose good team has quietly gone quiet. If you are the first call for every decision, the bottleneck is not your team. It is the system around them, and that is fixable.'},

  {t:'trap', kicker:'The trap', h:'Being needed feels like leadership', p:'Every question you answer, every fire you put out, every "I will just do it myself" feels like value. It is also the exact habit that keeps your team dependent and keeps you stuck in the work instead of leading it.'},

  {t:'reframe', kicker:'The reframe', h:'From helper to enabler', p:'The helper asks "how can I help right now?" The enabler asks "how do I design this so they solve it without me next time?" One keeps you central. The other sets you free. This masterclass is about making that one shift.'},

  {t:'part', kicker:'Part one', h:'The core problem: the accountability gap', p:'Talented teams rarely stall for lack of skill. They stall because ownership gets fuzzy, loops stay open, and nobody is quite sure who has what. Work slips, feedback stalls, and you fill the gap by doing more. The gap is the real problem.'},

  {t:'cost', kicker:'The hidden cost', h:'When you are the single point of failure', p:'Three things happen to a team built around one person. Decisions wait for you. Problems hide until they are expensive. And the truth stops reaching you, because it is easier for everyone to say it is fine.'},

  {t:'lies', kicker:'The team-truth problem', h:'Your team is lying to you, and you taught them how', p:'Not dishonesty. Learned self-protection. Four phrases you hear every week are often the opposite of what is true, and each one is a habit a leader accidentally trained.'},

  {t:'lieslist', kicker:'The four lies', h:'What they say, and what it means', list:[
    '<b>"It is fine."</b> Said when speaking up has cost them before.',
    '<b>"No questions."</b> Said when questions were once brushed aside.',
    '<b>"Great idea."</b> Said when input was asked for after the decision was already made.',
    '<b>"Friday is fine."</b> Said when a no drew a bad reaction last time.']},

  {t:'part', kicker:'Part two', h:'The shift: build systems, not heroics', p:'Enabler leadership is not working harder on behalf of your team. It is building the small structures that let the team carry the load, so your judgement goes to the few things only you can do.'},

  {t:'systems', kicker:'Systems over heroics', h:'Design the answer once', p:'A decision guide, a simple response framework, a shared FAQ. Each one turns a question you answer ten times into a question the team answers itself. Boundaries are not saying no to people. They are saying yes to your highest-value work.'},

  {t:'pause', kicker:'In the moment', h:'Pause and coach, instead of rescue', p:'When someone brings you a problem, the rescue reply is "I will handle it." The coaching reply is "what have you tried, and what is blocking you?" Same thirty seconds. One builds dependence. The other builds capability.'},

  {t:'part', kicker:'Part three', h:'The 3 moves that close the accountability gap', p:'Three repeatable moves you can run this week. None of them require authority you do not already have.'},

  {t:'move', kicker:'Move one', h:'Make ownership visible', p:'One clearly named owner per piece of work, not a group that assumes someone else has it. Diffused ownership is how accountability quietly disappears. A name on it is how it comes back.'},

  {t:'move', kicker:'Move two', h:'Close every loop', p:'End every meeting with fifteen seconds of clarity: who is doing what, by when, and how we will follow up. Clarity beats charisma every time. Nothing that is written down and owned falls through.'},

  {t:'move', kicker:'Move three', h:'Coach responsibility, do not assign blame', p:'Swap "why did you not do this?" for "what got in the way, and how do we remove it next time?" The first makes people hide. The second makes them own it. Accountability creates freedom, it does not remove it.'},

  {t:'contrast', kicker:'Why this works', h:'Accountability culture, not blame culture', two:[
    {h3:'Blame culture', p:'Mistakes get hidden. People fear failure, so they play small and the real issues surface late, when they are expensive.'},
    {h3:'Accountability culture', p:'Mistakes surface early. People fear stagnation, not punishment, so problems get solved while they are still cheap.'}]},

  {t:'picture', kicker:'A team that thrives without you', h:'A week that routes itself', p:'Decisions get made at the right level without you. Problems reach you early, as a heads-up and not a crisis. People tell you what is actually going on. You spend your time on strategy, growth, and the handful of calls only you can make.'},

  {t:'pillars', kicker:'How House of Leadership builds it', h:'Four pillars, every week', list:[
    '<b>Build knowledge</b> through real examples and easy-to-use frameworks.',
    '<b>Shape mindset</b>: confidence, resilience, and self-awareness under pressure.',
    '<b>Nurture relationships</b> and learn alongside a community of leaders.',
    '<b>Lead effectively</b>: turn ideas into action with practical tools.']},

  {t:'whyme', kicker:'Why me', h:'Twenty years leading teams, not lecturing about them', p:'I went from engineer to director across fast-moving tech organisations and startups, leading large teams through growth and change, and I am still in the work today. I am a certified coach with the Coaching Academy. Titles do not make leaders. Character and clarity do.'},

  {t:'cta', cls:'cta', kicker:'Your next step', h:'Lead yourself first, so you can lead others with clarity', html:'<div class="big">Book a free discovery call</div><p>Bring the team that runs through you. We will map the loops to close and the ownership to hand back, and build a plan to make your team thrive without you in the room.</p><p class="disc">Educational content only. No income, role, promotion, or result is guaranteed. Outcomes vary with your team, your context, and the work you put in.</p>', foot:'House of Leadership'}
];

const deck = document.getElementById('deck');
function esc(x){return x;}
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.cls?(' '+s.cls):'');
  let h='';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){ h+='<h1>'+s.h+'</h1>'; if(s.p) h+='<p class="lead">'+s.p+'</p>'; }
  else if(s.html){ if(s.h) h+='<h2>'+s.h+'</h2>'; h+=s.html; }
  else { if(s.h) h+='<h2>'+s.h+'</h2>'; }
  if(s.p && s.t!=='title' && !s.html) h+='<p>'+s.p+'</p>';
  if(s.list){ h+='<ul>'; s.list.forEach(li=>h+='<li>'+li+'</li>'); h+='</ul>'; }
  if(s.two){ h+='<div class="two">'; s.two.forEach(b=>h+='<div class="box"><h3>'+b.h3+'</h3><p>'+b.p+'</p></div>'); h+='</div>'; }
  if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
