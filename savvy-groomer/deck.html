<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Groomer's Pricing Blueprint — Savvy Groomer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;1,6..12,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161e2a;        /* their dark navy hero ground (brand.json, dominant, 18 uses) */
    --panel:#1e2836;     /* a lifted navy panel derived from the ground */
    --ink:#f3f5f7;       /* light text for the dark ground */
    --muted:#aeb6c2;     /* muted light gray */
    --accent:#38a8c3;    /* their teal accent (brand.json, 17 uses) */
    --rule:#2c3a4d;
    --display:'Fjalla One',system-ui,sans-serif;
    --body:'Nunito Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 52px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:48px;line-height:1.06;color:var(--ink);margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.12;color:var(--ink);margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--muted);margin-bottom:12px;max-width:62ch}
  p.lead{font-size:22px;color:var(--ink)}
  .big{font-family:var(--display);font-weight:700;font-size:40px;color:var(--ink);line-height:1.1}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:10px 0 10px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:64ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:18px;width:14px;height:14px;border-radius:3px;background:var(--accent)}
  .step{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.1em;margin-bottom:10px}
  .brandline{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted)}
  .foot{position:absolute;bottom:18px;right:26px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch;font-style:italic}
  .cta .big{color:var(--accent)}
  .stages{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
  .stage{flex:1;min-width:210px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:20px}
  .stage h3{font-family:var(--display);font-size:22px;color:var(--ink);margin-bottom:6px}
  .stage span{color:var(--accent);font-family:var(--display);font-weight:700}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A Savvy Groomer Masterclass with River Lee',
   h1:'Raise Your Prices Without Losing Your Clients',
   p:'The Groomer’s Pricing Blueprint: how to charge what your work is worth and keep the clients you love.'},

  {t:'who', kick:'Who this is for',
   h2:'You can groom. Nobody taught you the business.',
   lead:'This is for the groomer who is fully booked, exhausted, and still somehow broke at the end of the month.',
   bullets:['You own a job, not a business.','You are working more dogs for less money than you should be.','You know you need to raise prices but have no idea where to start.']},

  {t:'trap', kick:'The trap',
   h2:'How most groomers set their prices',
   bullets:['Asked around on Facebook what others charge.','Picked a number that felt "fair" or "reasonable".','Priced to undercut your last boss.','Raised prices once and still did not move the needle.']},

  {t:'reframe', kick:'The hard truth',
   h1:'Picking a number out of thin air is not a strategy.',
   p:'Cookie cutter prices do not work, because they are built on somebody else’s costs, somebody else’s clients, and somebody else’s goals. Not yours.'},

  {t:'part', kick:'Part One', h2:'The real problem is not your prices. It is your numbers.',
   p:'You cannot price a business you have never measured. Most groomers have never once added up what they actually invested, what they actually earn per hour, or what they actually need to take home.'},

  {t:'cost', kick:'What under-pricing really costs',
   bullets:['More dogs on the table to make the same money.','No cushion for a slow week, an injury, or a sick pet.','Nothing set aside for the day you cannot physically groom anymore.','Burnt out, broke, and resentful of a business you built.']},

  {t:'partintro', kick:'Part Two', h2:'The Pricing Blueprint',
   p:'Six moves that take you from guessing to a pricing structure built on your business, your model, your numbers, and the psychology that actually keeps clients.'},

  {t:'step', step:'Step 1', h2:'Know your numbers',
   p:'Get the full picture of what you have invested into your business and your education, and get clear on what you actually want your future to look like.'},

  {t:'step', step:'Step 2', h2:'Get realistic about your earnings',
   p:'Step up as an owner. Figure out what you need to earn and the formula to get there, so you can finally feel proud of your own paycheck.'},

  {t:'step', step:'Step 3', h2:'Understand your value',
   p:'See exactly what you bring to the table so you can build a pricing structure that makes sense for you and for your soulmate clients.'},

  {t:'step', step:'Step 4', h2:'Implement your plan',
   p:'Guided action steps to evaluate and tweak your plan, fit it to your long term goals, and account for inflation so the increase lasts.'},

  {t:'step', step:'Step 5', h2:'Communicate the increase',
   p:'Tell your clients in a way that is receptive and avoids rejection, using language that respects the relationship you have built.'},

  {t:'step', step:'Step 6', h2:'Handle client reactions with confidence',
   p:'Predict the reactions, answer the objections, and keep your clients. You retain the relationships and your prices hold.'},

  {t:'after', kick:'Part Three', h2:'More money, fewer dogs, weekends back',
   bullets:['More money for fewer dogs a day.','Weekends back, and a schedule that fits your life.','Clients who stay after the increase, not leave.','A business that supports your life instead of the other way around.']},

  {t:'stages', kick:'The bigger roadmap', h2:'Survive, Live, Thrive',
   p:'Pricing is the first move. It feeds a simple progression every groomer can climb.',
   stages:[['Survive','Cover your costs and stop bleeding money.'],['Live','Pay yourself a real, reliable wage.'],['Thrive','Build savings, freedom, and a plan for the day you stop grooming.']]},

  {t:'whyme', kick:'Why listen to me', h2:'I built it broke, then rebuilt it on purpose.',
   p:'I opened a grooming salon days before my son was born and built it into a six figure business with a team. I am a Certified Feline Master Groomer. I sold the salon, lived through the hardest seasons of my life, and rebuilt everything around one rule.',
   lead:'I refuse to live a life that supports my business. I will only build a business that supports my life.'},

  {t:'recap', kick:'The blueprint, in one slide', h2:'From guessing to a plan',
   bullets:['Know your numbers.','Get realistic about earnings.','Understand your value.','Implement, communicate, and hold the line.']},

  {t:'cta', kick:'Your next step', h1:'Let’s increase your prices the right way.',
   p:'Join The Savvy Groomer and get the full Pricing Blueprint, the scripts, and the community that keeps you accountable.',
   big:'Start with The Savvy Groomer Circle at savvygroomer.com',
   disc:'Educational content only. Results depend on your own business, effort, and market. No income or earnings are promised or guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='cta'?'cta':'');
  let h='';
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  if(s.step) h+='<div class="step">'+s.step+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.p) h+='<p>'+s.p+'</p>';
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li>'+b+'</li>');h+='</ul>';}
  if(s.stages){h+='<div class="stages">';s.stages.forEach(x=>h+='<div class="stage"><h3><span>'+x[0]+'</span></h3><p>'+x[1]+'</p></div>');h+='</div>';}
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="foot">Savvy Groomer &middot; '+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
