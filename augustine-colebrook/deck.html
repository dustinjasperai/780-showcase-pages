<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>How to Open and Run a Birth Center · Augustine Colebrook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f2ea; --panel:#efe7d8; --rule:#d9cdb8;
    --ink:#2e2633; --accent:#b8862b; --plum:#71607d; --green:#3f7652;
    --chalk:#2e2633; --grey:#5f5647; --dim:#9a8f7d;
  }
  html,body{height:100%}
  body{background:#2a241d;font-family:'Jost',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2a241d}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.17;letter-spacing:-.004em}
  .t-title h1{font-size:4.3vw;max-width:90%}
  .t-normal h1{font-size:3.2vw;max-width:85%}
  .t-normal .body{font-size:1.48vw;color:var(--grey);margin-top:2.6vh;max-width:75%;line-height:1.56;font-weight:300}
  .t-normal .list{margin-top:2.6vh;max-width:78%;display:flex;flex-direction:column;gap:1.5vh}
  .t-normal .list div{font-size:1.32vw;color:var(--grey);font-weight:300;line-height:1.4;padding-left:1.4vw;position:relative}
  .t-normal .list div::before{content:'';position:absolute;left:0;top:.62vw;width:.55vw;height:.55vw;background:var(--accent);border-radius:50%}
  .sub{font-size:1.75vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.48;font-weight:300}
  .t-section{align-items:flex-start;background:linear-gradient(105deg,var(--panel) 0%,var(--bg) 70%)}
  .t-section .idx{font-family:'Jost',sans-serif;font-size:1.32vw;font-weight:600;color:var(--plum);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:90%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-feature{background:radial-gradient(130% 130% at 50% 0%,var(--panel) 0%,#e6d9c2 100%);align-items:center;text-align:center}
  .t-feature h1{font-size:3.6vw;max-width:88%;font-style:italic;color:var(--ink)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,var(--panel) 0%,#e6d9c2 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.2vw;font-weight:500;background:rgba(184,134,43,.06)}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .motif{position:absolute;pointer-events:none}
  .title-motif{right:7%;bottom:8%;width:23vw;opacity:.95}
  .corner-motif{right:6%;bottom:7%;width:9vw;opacity:.5}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(46,38,51,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .t-normal .list div{font-size:2.8vw}.sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-feature h1{font-size:5.8vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Midwifery Wisdom Collective</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: an archway (the door of a birth center) with a rising threshold line -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arch" viewBox="0 0 240 170">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="16" y1="150" x2="224" y2="150" stroke="#71607d" opacity="0.4"/>
    <path d="M52 150 L52 78 Q120 8 188 78 L188 150" stroke="#b8862b" opacity="0.95"/>
    <path d="M74 150 L74 92 Q120 44 166 92 L166 150" stroke="#3f7652" opacity="0.35"/>
    <circle cx="120" cy="150" r="4.5" fill="none" stroke="#b8862b" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'How to Open and Run a Birth Center',sub:'A live masterclass for midwives and maternity practice owners ready to build a birth center that lasts longer than its founder.',brand:true,motif:'title'},
 {t:'normal',k:'Who this is for',title:'You can catch a baby. Running a birth center is a different job.',body:'You trained for years to attend birth safely. Nobody trained you to model a budget, read a state licensing rule, hire a second midwife, or plan the day you step back. That is the job that decides whether the center survives.'},
 {t:'feature',title:'Most birth centers do not close for clinical reasons. They close because the business underneath them was never built.'},

 {t:'section',idx:'Part One',title:'Why Good Midwives Lose Their Centers'},
 {t:'normal',k:'The clinical trap',title:'Skill at the bedside does not pay the rent.',body:'A center can run beautiful, safe births and still run out of money. Careful clients, slow insurance, thin margins, and a founder who does every role at once. Excellence in the birth room is necessary and it is not enough on its own.'},
 {t:'normal',k:'The cost of guessing',title:'The expensive mistakes happen before the doors open.',body:'A price the numbers cannot support, a regulation missed until an inspector finds it, a lease signed before the break-even was known. These are quiet at first and they compound, and by the time they show up in the bank account they are hard to undo.'},
 {t:'feature',title:'A birth center priced and staffed on hope runs on the founder’s savings until the savings run out.'},

 {t:'section',idx:'Part Two',title:'The Birth Center Incubator Method'},
 {t:'normal',k:'Pillar One',title:'Validate it and fund it, before you commit.',body:'The first work is honest arithmetic, not vision boards.',list:['Concept validation and an honest founder-capacity assessment','Business models, pricing, budgeting, and break-even analysis','Ownership structures, governance, and where the funding actually comes from']},
 {t:'normal',k:'Pillar Two',title:'Meet the regulations on purpose, not by accident.',body:'Birth center rules are written state by state, and they decide what you can build.',list:['State-by-state birth center regulations and how to research your own','Governance and the compliance systems a license depends on','Building the paperwork before an inspector asks for it']},
 {t:'normal',k:'Pillar Three',title:'Build a center that runs without you in every room.',body:'Operations are what turn a heroic founder into a stable business.',list:['Operations, standard procedures, and compliance systems','Staffing models, scheduling, retention, and burnout prevention','A team that can hold a shift you are not standing in']},
 {t:'normal',k:'Pillar Four',title:'Track what matters, and plan the handoff early.',body:'The founders who last are the ones who built for the day they leave.',list:['Key performance indicators and real financial tracking','Succession planning for founders and lead midwives','Exit strategies, so the center outlives any one person']},
 {t:'feature',title:'A birth center you can hand to someone else is the only kind that was ever really built.'},

 {t:'section',idx:'Part Three',title:'The Center That Stays Open'},
 {t:'normal',k:'The center this builds',title:'Staffed, licensed, solvent, and no longer resting on one person.',body:'A center that prices its care to survive, staffs so the founder can sleep, keeps its own books, and knows its own numbers. That is a birth center that can grow, and one that can be handed on.'},
 {t:'feature',title:'Communities do not keep the birth centers they love. They keep the ones that were built to stay open.'},
 {t:'normal',k:'Why Augustine Colebrook',title:'Two decades at the bedside, taught as a business.',body:'Augustine Colebrook, MA, MCHS, retired CPM, has spent 20 years attending births in hospitals, birth centers, and homes across the US and abroad. She founded the Midwifery Wisdom Collective and now teaches midwives, practice owners, and birth center administrators the business she had to learn the hard way.'},

 {t:'section',idx:'Your Next Step',title:'Build Yours With a Method Behind You'},
 {t:'normal',k:'The Birth Center Incubator',title:'The full program, from concept to succession.',body:'Eight sessions across two parts, live and then yours to keep, covering validation, regulation, business models, ownership, operations, staffing, financial tracking, and the exit plan. Built for midwives opening a center, midwives already in the process, and operators of centers that are struggling.'},
 {t:'normal',k:'Inside the Collective',title:'A community of midwives building real practices.',body:'Beyond the Incubator, the Midwifery Wisdom Collective carries continuing education, the graduate-to-midwife Fellowship, and a working community of birth professionals, so the learning does not stop when the doors open.'},
 {t:'cta',title:'Ready to build a birth center that outlives its founder?',chips:['Join the Birth Center Incubator','Explore the Midwifery Wisdom Collective'],disc:'Educational content for midwives and maternity practice owners. No clinical, licensing, income, or business result is guaranteed. Outcomes vary by practitioner, state, market, and circumstances.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}" viewBox="0 0 240 170"><use href="#arch"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.list) h+=`<div class="list">`+s.list.map(x=>`<div>${x}</div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Midwifery <b>Wisdom Collective</b> · Augustine Colebrook, MA, MCHS</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
