<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Without Burning Out: The 4 Permissions - KC Carter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1512; --panel:#241c17; --rule:#3a2d24; --accent:#eb5014;
    --ink:#f5efe9; --muted:#c9bcb2;
    --head:'Lora',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f0c0a;color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 52px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;
    background:radial-gradient(circle,rgba(235,80,20,0.22),transparent 70%);pointer-events:none}
  .kicker{font-family:var(--body);text-transform:uppercase;letter-spacing:.18em;
    font-size:12px;font-weight:600;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.1;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.15;margin-bottom:16px}
  p{font-size:19px;color:var(--muted);max-width:60ch;margin-bottom:14px}
  .lede{font-size:22px;color:var(--ink)}
  ul{list-style:none;margin:10px 0}
  li{font-size:19px;color:var(--ink);padding:12px 0 12px 26px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  li b{font-family:var(--head);font-weight:600}
  li span{display:block;color:var(--muted);font-size:16px;margin-top:3px}
  .big{font-family:var(--head);font-size:40px;font-weight:700;color:var(--ink);line-height:1.12}
  .big .a{color:var(--accent)}
  .tag{font-family:var(--head);font-style:italic;font-size:21px;color:var(--accent)}
  .foot{position:absolute;bottom:22px;left:52px;font-size:12px;color:#8a7d72;letter-spacing:.04em}
  .disc{font-size:13px;color:#8a7d72;margin-top:22px;max-width:62ch}
  .num{position:absolute;bottom:22px;right:52px;font-size:12px;color:#6f635a}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:380px}h1{font-size:34px}h2{font-size:26px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with KC Carter', h:'Lead Without Burning Out', lede:'The 4 Permissions for leaders under pressure.', tag:'Epic Leadership'},
  {t:'promise', kicker:'The promise', h:'One steady hour', body:['In the next sixty minutes you will leave with the 4 Permissions, a way to lead from steadiness instead of overwhelm.','And one practice you can use the moment the next hard day starts.']},
  {t:'who', kicker:'Who this is for', h:'You are scaling something real', body:['You run a team, a function, or a company that is growing.','The results keep coming. So does the cost.','You are the one holding it together, and quietly running on empty.']},
  {t:'cost', kicker:'What it is costing', h:'Growth has a hidden tax', body:['The late nights you told yourself were temporary are now just how you work.','The parts of you that built the thing are the parts you have least time for.','You are succeeding in a way that does not feel like success.']},
  {t:'trap', kicker:'The trap', h:'You have been told the answer is more', body:['More hours. More discipline. More grind until it clicks.','So you work harder, and the depletion just scales with the growth.','Nobody hands a leader permission to do it differently.']},
  {t:'reframe', kicker:'The reframe', big:'This is not a time problem.<br>It is a <span class="a">permission</span> problem.', body:['The leaders who last are not the ones who pushed hardest.','They are the ones who gave themselves permission to lead from steadiness instead of overwhelm.']},
  {t:'part', kicker:'Part one', h:'Why willpower keeps failing you', body:['Force works until the next deadline, then it collapses.','You cannot grind your way to a steady nervous system, and a leader runs on their nervous system.','A depleted leader makes depleted decisions, and the whole team feels it.']},
  {t:'laws', kicker:'A different mechanism', h:'Change can be compassionate', body:['Lasting change is built on self-compassion, not self-punishment.','That is the premise of the 7 Compassionate Laws of Personal Change: you move faster when you stop fighting yourself.','What if change were fun instead of forced?']},
  {t:'framework', kicker:'Part two', h:'The 4 Permissions', lede:'A leadership operating system, not a wellness break.'},
  {t:'p1', kicker:'Permission 1', h:'Permission to Chill', body:['Clear the noise first. Settle the nervous system before you decide anything.','Not softer decisions. Sharper ones.','One daily practice from the This Epic Life meditation sets this up.']},
  {t:'p2', kicker:'Permission 2', h:'Permission to Feel All the Feels', body:['Emotion is data, not noise.','The steadiest leaders read the signal their body is sending instead of armoring over it.','This is how you read a room, and yourself, under pressure.']},
  {t:'p3', kicker:'Permission 3', h:'Permission to Glow in the Dark', body:['Do what you came to do, with witnesses, despite the fear that never fully leaves.','This is self-actualized leadership when it is hard, not when it is easy.','The glow is not a mood. It holds under fire.']},
  {t:'p4', kicker:'Permission 4', h:'Permission to Glow in the Light', body:['Trade competition for collaboration.','A leader who has stopped protecting themselves can finally build with everyone around them.','I, to You, to We.']},
  {t:'practice', kicker:'How it becomes real', h:'A daily practice, not a weekend high', body:['The permissions are not a one-time insight. They are reps.','The This Epic Life meditation practice is how thousands of leaders keep them alive between the hard days.','Small, daily, repeatable. That is why it holds.']},
  {t:'part3', kicker:'Part three', h:'What changes when you lead this way', lede:'Not a softer leader. A steadier one.'},
  {t:'look', kicker:'On the inside', h:'From exhausted to steady', body:['Decisions get cleaner because the person making them is settled.','The team stops absorbing your depletion and starts matching your steadiness.','Growth stops costing you the things you grew it for.']},
  {t:'contrast', kicker:'The shift', big:'From <span class="a">I got this</span>, alone,<br>to <span class="a">we got this</span>, together.', body:['The burned-out leader carries it all. The steady leader builds carriers.']},
  {t:'proof', kicker:'Why me', h:'I built this inside real growth', body:['I helped grow a team from 40 people and 40 million in sales to over 900 people and 450 million in eight years.','We won awards for our culture. The signs of burnout were still everywhere.','I built the 4 Permissions so rapid growth would stop requiring it. I now coach leaders at Amazon, AT&T, eXp Realty and Edward Jones with it.']},
  {t:'invite', kicker:'The invitation', h:'Give yourself the first permission', body:['You do not have to overhaul anything today.','You just have to decide you are allowed to lead from steadiness.','Everything in the 4 Permissions starts with that one yes.']},
  {t:'cta', kicker:'Your next hour', h:'Let us map your permissions together', body:['If this is the way you want to lead, the next step is a conversation.','We will look at where you are depleting and which permission you are withholding.'], tag:'Book a time with KC Carter at epicleadership.org', disc:'Educational content only. Shared for learning, not as financial, medical, or professional advice. No income or result is guaranteed. Results vary from person to person.'}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section'); el.className='slide';
  let html='';
  if(s.kicker) html+=`<div class="kicker">${s.kicker}</div>`;
  if(s.h) html+= (s.t==='title') ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`;
  if(s.lede) html+=`<p class="lede">${s.lede}</p>`;
  if(s.big) html+=`<div class="big">${s.big}</div>`;
  if(s.body){ if(s.body.length>1 && (s.t==='who'||s.t==='trap'||s.t==='part'||s.t==='p1'||s.t==='p2'||s.t==='p3'||s.t==='p4'||s.t==='look'||s.t==='proof'||s.t==='cta')){
      html+='<ul>'+s.body.map(b=>`<li>${b}</li>`).join('')+'</ul>';
    } else { html+=s.body.map(b=>`<p>${b}</p>`).join(''); } }
  if(s.tag) html+=`<p class="tag">${s.tag}</p>`;
  if(s.disc) html+=`<p class="disc">${s.disc}</p>`;
  if(s.t==='title') html+=`<div class="foot">Epic Leadership</div>`;
  html+=`<div class="num">${i+1}</div>`;
  el.innerHTML=html; deck.appendChild(el);
});
</script>
</body>
</html>
