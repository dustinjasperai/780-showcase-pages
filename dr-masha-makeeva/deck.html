<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The In-Demand HBOT Practice · Dr. Masha Makeeva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fafafa; --panel:#ffffff; --rule:#e4e4ea;
    --acc:#2b328e; --lime:#bcdf51; --ink:#23264d; --body:#3a3a42; --dim:#8b8b95; --deep:#1a1c3a;
  }
  html,body{height:100%}
  body{background:#e6e6ea;font-family:'Lato',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e6e6ea}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Lato',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Lato',sans-serif;font-weight:700;color:var(--ink);line-height:1.12;letter-spacing:-.006em}
  .t-title h1{font-size:4.7vw;max-width:94%;font-weight:900;color:var(--deep)}
  .t-normal h1{font-size:3.2vw;max-width:90%}
  .t-normal .body{font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:80%;line-height:1.62;font-weight:400}
  .sub{font-family:'Lato',sans-serif;font-size:1.9vw;color:var(--acc);margin-top:3.4vh;max-width:86%;line-height:1.4;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Lato',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:92%;font-weight:900;color:var(--deep)}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),var(--lime));margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#2b328e 0%,#171a3a 74%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:90%;color:#f4f5ff;font-weight:700}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2b328e 0%,#171a3a 72%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:88%;color:#f7f8ff;font-weight:900}
  .t-cta .body{color:#d6d9f2;font-size:1.42vw;margin-top:3vh;max-width:76%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--lime);color:#f7f8ff;border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.0vh;font-size:.82vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .t-cta .disc{color:#a9adcf}
  .brandline{font-family:'Lato',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:400;letter-spacing:.03em}
  .brandline b{color:var(--acc);font-weight:700}
  .hbot-motif{position:absolute;pointer-events:none}
  .title-hbot{right:6.4%;bottom:7.5%;width:19vw;opacity:.95}
  .corner-hbot{right:6.0%;bottom:7.0%;width:9vw;opacity:.5}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(43,50,142,.12);z-index:20}
  .hud > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--lime));width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Dr. Masha Makeeva</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- HBOT motif: concentric pressure rings (the chamber) over three ordered protocol bars (time, sequence, apply) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="hbot" viewBox="0 0 120 120">
  <g fill="none" stroke="#2b328e" stroke-width="1.6" stroke-linecap="round">
    <circle cx="60" cy="46" r="34" opacity="0.85"/>
    <circle cx="60" cy="46" r="24" opacity="0.55"/>
    <circle cx="60" cy="46" r="14" opacity="0.4"/>
    <circle cx="60" cy="46" r="4.5" fill="#bcdf51" stroke="none" opacity="0.9"/>
  </g>
  <g stroke-linecap="round">
    <rect x="20" y="92" width="80" height="4.4" rx="2.2" fill="#2b328e" opacity="0.85"/>
    <rect x="20" y="101" width="58" height="4.4" rx="2.2" fill="#2b328e" opacity="0.55"/>
    <rect x="20" y="110" width="36" height="4.4" rx="2.2" fill="#bcdf51" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The In-Demand HBOT Practice',sub:'How to integrate hyperbaric oxygen therapy into your clinic safely, sequence it with red light and PEMF, and turn it into your most requested service, without guesswork or a chamber that sits half-used.',brand:true,bp:'title'},
 {t:'normal',k:'Who this is for',title:'You believe in HBOT. The chamber is in the room. It still is not pulling its weight.',body:'You are a practitioner or clinic owner who has seen what hyperbaric oxygen can do. Maybe you already own a chamber, maybe you are about to invest in one. Either way the question is the same: how do you use it safely, position it clearly, and keep it booked, instead of letting an expensive box sit idle between the occasional client?'},
 {t:'dark',title:'Owning a chamber and running HBOT well are not the same thing.'},

 {t:'section',idx:'Part One',title:'Why a Good Therapy Ends Up Underused'},
 {t:'normal',k:'The half-used chamber',title:'Most clinics run HBOT at a fraction of its capacity, and it is rarely the equipment holding it back.',body:'A single chamber can serve a full schedule, yet many run at thirty percent or less. The therapy works, but the practice never built the protocols, the client conversation, or the confidence to use it fully. So it becomes a nice-to-have in the corner rather than a service people come in specifically to book.'},
 {t:'normal',k:'What uncertainty costs',title:'Without clear protocols and safety, you hedge, and clients feel the hesitation.',body:'When you are unsure about indications, contraindications, timing and dose, you undersell the therapy and overthink every session. Clients can sense uncertainty, and uncertainty does not get referred. The ceiling is not demand for HBOT. It is the gap between owning the tool and knowing exactly how to apply it.'},
 {t:'dark',title:'A therapy you are unsure how to use safely is a therapy you will always underprescribe.'},

 {t:'section',idx:'Part Two',title:'Time, Sequence, Apply'},
 {t:'normal',k:'One, time it',title:'The same session helps or does little, depending on when it lands.',body:'Timing is the first lever. When HBOT sits in relation to activity, recovery, other therapies and the client goal changes what it does. Getting the timing right is the difference between a session that moves the needle and one that just fills an hour. This is where a real protocol starts, not with the chamber, with the plan around it.'},
 {t:'normal',k:'Two, sequence it',title:'HBOT, red light and PEMF do more together, in the right order, than any of them alone.',body:'Regenerative tools are not interchangeable and they are not additive by accident. Photobiomodulation and PEMF each prepare or extend what hyperbaric oxygen does, but only in a deliberate order. Sequencing the stack is what turns three separate machines into one coherent program a client can feel, and can tell people about.'},
 {t:'normal',k:'Three, apply it',title:'Safe, individualized protocols are what let you use the chamber with confidence.',body:'Application is indications, contraindications, dose and the individual in front of you. With safety and protocol design handled, you stop hedging. You can build a clear program for a goal, explain it plainly, and run the chamber at full capacity because you know exactly why each session is there. Confidence is a protocol, not a personality trait.'},
 {t:'dark',title:'Protocols are what let a careful clinician become a busy one.'},

 {t:'section',idx:'Part Three',title:'What Changes When HBOT Is Run on Purpose'},
 {t:'normal',k:'The practice this builds',title:'A signature service people book by name, not a machine that waits for a slow day.',body:'When the timing, the sequence and the protocols hold, HBOT stops being an add-on and becomes a reason people choose your practice. The chamber fills, the outcomes get more consistent, and clients tell other clients. You are no longer selling a session. You are running a program you can stand behind and repeat.'},
 {t:'dark',title:'The goal was never to own a chamber. It was to build a service that carries your practice.'},
 {t:'normal',k:'Why Dr. Masha',title:'A board-certified naturopathic doctor who rebuilt her own health with these tools, then went back to teach the protocols.',body:'Dr. Masha Makeeva is a Canadian Board-Certified Naturopathic Doctor, an IBUM certified HBOT instructor and International Hyperbaric Association faculty, with over sixteen years in hyperbaric and regenerative medicine. She learned firsthand that these therapies work only when timed, sequenced and applied correctly, and now trains practitioners and clinic owners to do exactly that.'},

 {t:'section',idx:'Your Next Step',title:'Learn the Protocols, Then Use Them'},
 {t:'normal',k:'Go deeper with the training',title:'Hands-on certification and a guided mentorship take you from theory to a running program.',body:'The HBOT Certification Course gives you hands-on chamber training, safety protocols and IBUM certification. The six-week HBOT Implementation Mentorship then walks you through building tailored protocols for your own clients and integrating red light and PEMF, so what you learn actually reaches the chamber.'},
 {t:'cta',title:'Ready to run HBOT with real confidence?',body:'Join the HBOT Certification Course or apply for the HBOT Implementation Mentorship Program with Dr. Masha, and build a service your practice can be known for.',chips:['Join the HBOT Certification Course','Apply for the Mentorship'],disc:'Educational content for health practitioners and clinic owners. Not medical advice. HBOT must be delivered within appropriate safety protocols and scope of practice. No clinical or business outcome is guaranteed; results vary by patient, practice and how the protocols are applied.'},
];

const deck=document.getElementById('deck');
function bp(kind){return `<svg class="hbot-motif ${kind==='title'?'title-hbot':'corner-hbot'}"><use href="#hbot"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Dr. Masha <b>Makeeva</b> · Hyperbaric &amp; regenerative medicine education</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.bp) h+=bp(s.bp);
  else if(s.t==='title') h+=bp('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
