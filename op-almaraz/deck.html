<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Estate Channel &middot; O.P. Almaraz, Restoration Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f1e8; --panel:#e9e2d3; --rule:#d9d0bd;
    --ink:#2a2622; --accent:#882021; --gold:#a9822f;
    --soft:#55504a; --dim:#8c847a;
  }
  html,body{height:100%}
  body{background:#dcd4c2;font-family:'Instrument Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dcd4c2}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .38s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.8%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Instrument Sans',sans-serif;font-size:1vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.18;letter-spacing:-.006em}
  .t-title h1{font-size:4.2vw;max-width:88%}
  .t-normal h1{font-size:2.8vw;max-width:84%}
  .t-normal .body{font-size:1.42vw;color:var(--soft);margin-top:2.6vh;max-width:74%;line-height:1.62;font-weight:400}
  .sub{font-size:1.62vw;color:var(--soft);margin-top:3.2vh;max-width:78%;line-height:1.55;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Instrument Sans',sans-serif;font-size:1.2vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:3.9vw;max-width:88%}
  .t-section .rule{width:20vw;height:3px;background:linear-gradient(90deg,var(--accent),rgba(136,32,33,0));margin-top:3.6vh}
  .t-quiet{background:var(--ink);align-items:center;text-align:center}
  .t-quiet h1{font-size:3.1vw;max-width:82%;color:#f5f1e8;font-weight:500;margin-left:auto;margin-right:auto}
  .t-quiet .body{color:#c9beac;text-align:center;max-width:70%;margin-left:auto;margin-right:auto}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:2.4vw;text-align:center;margin-bottom:4.2vh;margin-left:auto;margin-right:auto}
  .flowrow{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
  .flowcard{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:.2vw;padding:2.3vh 1.2vw;width:17.6vw;min-height:15vh;display:flex;flex-direction:column;gap:1vh}
  .flowcard .n{font-family:'Newsreader',Georgia,serif;font-size:1.9vw;font-weight:600;color:var(--gold);line-height:1}
  .flowcard .l{font-size:1.02vw;font-weight:700;color:var(--ink);line-height:1.3}
  .flowcard .d{font-size:.92vw;font-weight:400;color:var(--soft);line-height:1.45}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.3vw;max-width:82%;margin-left:auto;margin-right:auto}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:2px solid var(--accent);color:var(--accent);border-radius:.2vw;padding:1.3vh 1.7vw;font-size:1.1vw;font-weight:700;letter-spacing:.03em}
  .disc{position:absolute;left:8.8%;right:8.8%;bottom:4.4vh;font-size:.84vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .t-quiet .disc{color:#a89d89}
  .divider{position:absolute;pointer-events:none}
  .title-divider{right:7.2%;bottom:11%;width:22vw}
  .corner-divider{right:6.2%;bottom:8%;width:10vw;opacity:.65}
  .brandline{font-size:1.2vw;color:var(--soft);margin-top:3.6vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(42,38,34,.09);z-index:20}
  .hud > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#8a7f6f;z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8a7f6f;z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#8a7f6f;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.8vw}.t-normal h1{font-size:4.9vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.2vw}.t-quiet h1{font-size:5.2vw}.t-flow h1{font-size:4.4vw}
    .flowcard{width:38vw}.flowcard .n{font-size:3.8vw}.flowcard .l{font-size:2.2vw}.flowcard .d{font-size:1.9vw}
    .t-cta h1{font-size:6.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">Restoration Mastery</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="divider" viewBox="0 0 320 60">
  <line x1="6" y1="30" x2="150" y2="30" stroke="#8c847a" stroke-width="2" stroke-dasharray="6 7" opacity="0.55"/>
  <circle cx="164" cy="30" r="5" fill="#882021"/>
  <line x1="178" y1="30" x2="314" y2="30" stroke="#882021" stroke-width="2.4" opacity="0.85"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Estate Channel',sub:'The second client channel almost no restoration owner ever opens: private-pay, high-net-worth work found through estate managers and property managers, built on discretion and response speed instead of insurance-panel volume.',brand:true,motif:'title'},

 {t:'normal',k:'Who this is for',title:'Owners of independent restoration companies who compete entirely on claim volume.',body:'Every job runs through an adjuster. Every price gets compared. Your growth ceiling is set by how many claims land on your desk this month, and that number is not yours to control. This class is for the owner who suspects there is a second client sitting outside that system entirely.'},
 {t:'normal',k:'What most owners never see',title:'A restoration client who never files a claim at all.',body:'Some homes, and the people who manage them, do not go through insurance for a water or fire loss. They call someone directly, they pay directly, and they never enter the price comparison the rest of your business lives inside.'},
 {t:'normal',k:'An honest note',title:'This is education, not a promise.',body:'Every market, portfolio and relationship is different. Nothing here is a guarantee that any particular estate manager, property manager or private client will send work to any company. Take the map and test it against your own market.',disc:'Educational content. Nothing here is a guarantee of income, revenue, referrals, or any business result. Results vary.'},
 {t:'normal',k:'Who is teaching this',title:'O.P. Almaraz. Restoration Mastery.',body:'Alongside my partner Tim, I run Allied Restoration, a Southern California restoration company built over more than two decades. Inside it sits a private client division that runs on confidentiality agreements and serves high-net-worth homeowners and their estate managers. This class is built on that division.'},

 {t:'section',idx:'Part One',title:'There Are Two Restoration Economies'},
 {t:'normal',k:'The one you already know',title:'The claim economy runs on volume and price.',body:'An adjuster assigns or approves the job. The homeowner rarely picks you for any reason beyond being told to, being fastest to answer, or being cheapest. Your margin gets set by what the carrier will pay, not by what the work is worth.'},
 {t:'normal',k:'What most owners try',title:'More leads, more trucks, another sales hire.',body:'All three add cost to a business whose ceiling is still set by claim volume and adjuster relationships neither of which you fully control. None of it opens a second kind of client.'},
 {t:'quiet',title:'A homeowner who pays you directly never has to justify the price to anyone but themselves.'},
 {t:'normal',k:'The one almost nobody opens',title:'The private economy runs on trust and discretion, not price.',body:'A high-net-worth homeowner, or the estate manager who runs their property, is not shopping three bids. They are protecting a home, a schedule and often a reputation, and they will pay for a vendor who can be trusted with all three.'},

 {t:'section',idx:'Part Two',title:'The Channel: Estate Managers, Discretion, Speed'},
 {t:'flow',k:'How the private economy actually works',title:'Gatekeepers. Discretion. Speed. Referral.',items:[
   {n:'01',l:'Estate & property managers',d:'The people who call first when something goes wrong inside a managed property.'},
   {n:'02',l:'Confidentiality as the entry ticket',d:'A signed agreement offered before it is asked for, standard practice, not a special case.'},
   {n:'03',l:'Response speed as the differentiator',d:'A gatekeeper who cannot wait screens on who answers fastest, not who is cheapest.'},
   {n:'04',l:'Referral compounding',d:'One kept promise inside a managed portfolio becomes the next property, and the one after that.'}]},
 {t:'normal',k:'Channel step one',title:'Estate and property managers are the real gatekeepers.',body:'They are not the homeowner, but they are the person who gets the call the moment something goes wrong, and they are judged on who they bring in. Building a relationship with a handful of them opens a portfolio, not a single home.'},
 {t:'normal',k:'Channel step two',title:'Offer discretion before it is asked for.',body:'A confidentiality agreement, offered as a standard document rather than a concession, tells a gatekeeper who is protecting a private client that you already understand what they need. Claim-side vendors almost never think to offer it at all.'},
 {t:'normal',k:'Channel step three',title:'Speed is the entire sales pitch.',body:'A property manager with water spreading through a home is not comparing estimates. They are asking who can be there fastest and be trusted not to make the situation worse. A real, kept response standard is the whole conversation.'},
 {t:'normal',k:'Channel step four',title:'One relationship becomes a portfolio.',body:'An estate or property manager who trusts you on one address usually manages several. A single kept promise compounds into repeat calls across an entire portfolio, without another dollar spent finding the next job.'},
 {t:'quiet',title:'Four things build this channel. None of them is an advertisement. All of them are trust.'},

 {t:'section',idx:'Part Three',title:'Running Both Economies At Once'},
 {t:'normal',k:'The day-to-day shape of it',title:'The claim side keeps the trucks full. The private side keeps the margin.',body:'You do not have to choose one. The claim economy fills the schedule and keeps the crews working. The private channel adds a smaller number of jobs that pay directly, at a margin the claim side can never offer, without competing with it for the same client.'},
 {t:'normal',k:'Why this is credible',title:'Allied Restoration runs both today.',body:'The company Tim and I operate does claim-funded restoration work and runs a private client division serving high-net-worth homeowners under signed confidentiality agreements. This is not a theory. It is how our own company is actually built.'},
 {t:'normal',k:'Your next step',title:'Find the estate and property managers already inside your market.',body:'You do not need a new marketing budget to start. You need a short list of the estate and property managers who already work your service area, and a standard you can promise and keep the first time one of them calls.'},
 {t:'cta',title:'Talk through what opening a private client channel would take for your company.',chips:['Book a consultation with O.P. and Tim'],disc:'Educational content only. No income, revenue, referral volume, or client acceptance is guaranteed. Results vary by market, company, and execution.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="divider ${kind==='title'?'title-divider':'corner-divider'}" viewBox="0 0 320 60"><use href="#divider"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div><div class="d">${it.d}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">O.P. Almaraz &middot; <b>Restoration Mastery</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
