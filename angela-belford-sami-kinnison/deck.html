<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Invisible Edge — Be Freaking Awesome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f6f4;        /* teal-tinted paper, derived from brand teal on light scheme */
    --panel:#fdfefe;
    --rule:#e2ebe8;
    --ink:#23302f;       /* deep teal-charcoal, derived from brand teal */
    --muted:#5c6b69;
    --accent:#2a8a86;    /* Be Freaking Awesome brand teal (#2a8a86) */
    --accent-soft:#e3efee;
    --display:'Playfair Display',Georgia,serif;
    --body:'Montserrat',-apple-system,Segoe UI,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(35,48,47,.03)}
  .slide.cover{background:linear-gradient(180deg,#fdfefe 0%,#e7f0ee 100%)}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.12;margin-bottom:18px}
  .sub{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.3;color:var(--muted);margin-top:22px}
  p{font-size:19px;line-height:1.62;color:var(--ink);max-width:62ch;margin-bottom:16px}
  p.lead{font-size:21px}
  .muted{color:var(--muted)}
  .edge{height:3px;width:64px;background:var(--accent);border-radius:3px;margin:0 0 26px}
  .rule-line{display:flex;align-items:center;gap:14px;margin:30px 0 6px}
  .rule-line .bar{flex:1;height:1px;background:var(--rule)}
  .rule-line .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:0;top:21px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .beliefs li:before{background:var(--accent-soft);border:2px solid var(--accent);width:11px;height:11px;top:19px}
  .big{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.14;letter-spacing:-.01em}
  .quote{font-family:var(--display);font-style:italic;font-weight:500;font-size:28px;line-height:1.34;color:var(--ink)}
  .part .num{font-family:var(--display);font-size:20px;color:var(--accent);letter-spacing:.05em;margin-bottom:10px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:10px}
  .two .col h3{font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .two .col p{font-size:17px}
  .pagefoot{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:34px}
  .cta h2{font-size:40px}
  .cta .step{display:inline-block;margin-top:20px;padding:15px 30px;background:var(--accent);color:#fff;
    border-radius:999px;font-weight:600;font-size:17px;letter-spacing:.01em}
  .disclaimer{font-size:13px;line-height:1.6;color:var(--muted);margin-top:30px;max-width:66ch}
  .brandmark{font-family:var(--display);font-weight:600;font-size:15px;color:var(--accent);letter-spacing:.02em}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'cover',
   kicker:'A Be Freaking Awesome Masterclass',
   h1:'The Invisible Edge',
   sub:'Why your best effort keeps hitting the same wall, and the belief underneath it that mindset and strategy never reach.',
   foot:'With Angela Belford and Sami Kinnison'},

  {t:'list', edge:true, h2:'What you will walk out with',
   items:[
     'Why the pattern you keep repeating is not a discipline or a knowledge problem',
     'Where that pattern actually lives, and why your thinking brain cannot reach it',
     'The seven beliefs that quietly run most leaders, and how to tell which one is running you',
     'A clear first move to work with the belief instead of white knuckling the behavior']},

  {t:'prose', kicker:'Who this is for',
   ps:[
     ['lead','You are capable. You have read the books, done the retreats, hired the coach, built the plan. From the outside it looks handled.'],
     ['lead','And still the same thing shows up. The hard conversation you keep softening. The decision you keep circling. The version of yourself that goes quiet in the room where it matters most.'],
     ['muted','If you have ever thought "I know exactly what to do, so why do I keep not doing it," this hour is for you.']]},

  {t:'quote', edge:true,
   quote:'Trying to think your way out of a body held belief is like trying to turn the lights on by rearranging the furniture.',
   after:'The pattern is not a thinking problem. It is a belief your nervous system has been holding onto. That is why more information has never been enough to move it.'},

  {t:'part', num:'Part One', title:'The reason it keeps coming back'},

  {t:'prose', h2:'You have already tried the top floor',
   ps:[
     ['','Most growth work lives in the thinking brain. Mindset. Strategy. Willpower. Self awareness. Better systems. All of it useful, and all of it operating a level above where the pattern is stored.'],
     ['','So you get temporary lift, and then the old response returns under pressure, because the part driving it never heard the new plan.']]},

  {t:'split', tagL:'The surface', tagR:'The underneath',
   colLh:'What you manage', colLp:'The calendar, the message, the team, the offer, the next quarter. The capable, visible, hard working part of you.',
   colRh:'What runs you', colRp:'A belief formed long before any of this, held as a physical sensation, firing a protective response the moment the stakes feel high.',
   foot:'The edge is invisible because it sits under the part you have spent years sharpening.'},

  {t:'part', num:'Part Two', title:'The Invisible Edge'},

  {t:'prose', h2:'The belief is in the body',
   ps:[
     ['lead','A belief is not a sentence you can argue with. It is a sensation. A tightening in the chest before the honest ask. A flatness before the stage. A pull to over explain, to smooth it over, to disappear for a beat.'],
     ['','The Invisible Edge locates where that belief lives as a physical sensation, and works directly with the sensation through a structured, body based process, instead of debating the thought on top of it.']]},

  {t:'prose', kicker:'Why this reaches what coaching usually cannot',
   ps:[
     ['lead','This is about something running underneath the capable part. Something that mindset, strategy, willpower, and self awareness alone cannot reach.'],
     ['','When you work at the level the belief is actually stored, the pattern stops needing to be managed. It is not suppressed harder. It is resolved, and the energy you spent holding it comes back to you.']]},

  {t:'beliefs', h2:'The seven core beliefs',
   intro:'Nearly every stuck leadership pattern traces back to one of these, held not as an idea but as a felt truth:',
   items:['I am enough','I am worthy','I am valuable','I am lovable','I trust myself','I have what it takes','I belong']},

  {t:'prose', h2:'How one belief writes a pattern',
   ps:[
     ['','Take "I have to earn my worth." On the surface it looks like drive. Underneath, it quietly decides that you cannot charge the full number, cannot stop proving, cannot let the work be enough.'],
     ['','Name the belief, feel where it lives, and the behavior it was protecting loses its grip. You are not forcing a new habit on top of an old fear. You are changing what the nervous system believes is true.']]},

  {t:'list', edge:true, h2:'The work, step by step',
   items:[
     '<strong>Surface it.</strong> Find the recurring pattern and the exact moment it fires',
     '<strong>Locate it.</strong> Feel where the belief lives in the body as a physical sensation',
     '<strong>Map it.</strong> Trace it back to which of the seven core beliefs is driving',
     '<strong>Resolve it.</strong> Work with the sensation through the structured process until the charge releases',
     '<strong>Integrate it.</strong> Anchor the new truth so the old response stops running the room']},

  {t:'part', num:'Part Three', title:'What changes when the belief moves'},

  {t:'prose', h2:'What changes when the belief moves',
   ps:[
     ['','The hard conversation gets lighter because the fear underneath it is no longer firing. The price gets said out loud without flinching. The quiet in the big room turns into presence.'],
     ['muted','Clients describe it as finally being able to act like the person they already knew they were. Same skills, same experience, but the thing that kept pulling them back is simply not there anymore.']]},

  {t:'prose', kicker:'Why us', h2:'Angela Belford and Sami Kinnison',
   ps:[
     ['','A mother and daughter who built Be Freaking Awesome around one idea: real change happens below the strategy. Angela brings decades in business strategy and two books, Be Freaking Awesome and Traveling Light. Sami brings the communication and nervous system work.'],
     ['muted','More than 230 episodes of the Be Freaking Awesome Podcast, not scripted and not polished, figuring it out in real time and out loud, the same way this work actually happens.']]},

  {t:'recap', tag:'Remember this',
   big:'Pattern, then belief, then sensation.<br>Work the sensation, and the pattern lets go.',
   foot:'You do not need more willpower. You need to reach the level the belief is actually stored, and give it something truer to hold.'},

  {t:'cta',
   brand:'Be Freaking Awesome',
   h2:'Ready to find the belief behind your pattern?',
   body:'If one belief has been quietly running the room, the next step is a conversation about which one, and what it would take to resolve it inside the Invisible Edge coaching work.',
   step:'Book a conversation with Be Freaking Awesome',
   disclaimer:'This masterclass is educational and is not therapy. No income or specific result is guaranteed. Results vary based on your own situation, effort, and circumstances.'}
];

function paras(ps){return ps.map(([c,txt])=>`<p class="${c}">${txt}</p>`).join('');}

const R = {
  cover:(s)=>`<div class="slide cover"><div class="kicker">${s.kicker}</div><h1>${s.h1}</h1><div class="sub">${s.sub}</div><div class="pagefoot">${s.foot}</div></div>`,
  list:(s)=>`<div class="slide">${s.edge?'<div class="edge"></div>':''}<h2>${s.h2}</h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`,
  prose:(s)=>`<div class="slide">${s.kicker?`<div class="kicker">${s.kicker}</div>`:''}${s.h2?`<h2>${s.h2}</h2>`:''}${paras(s.ps)}</div>`,
  quote:(s)=>`<div class="slide">${s.edge?'<div class="edge"></div>':''}<div class="quote">${s.quote}</div><p class="muted" style="margin-top:26px">${s.after}</p></div>`,
  part:(s)=>`<div class="slide part"><div class="num">${s.num}</div><div class="big">${s.title}</div></div>`,
  split:(s)=>`<div class="slide"><div class="rule-line"><span class="tag">${s.tagL}</span><span class="bar"></span><span class="tag">${s.tagR}</span></div><div class="two"><div class="col"><h3>${s.colLh}</h3><p>${s.colLp}</p></div><div class="col"><h3>${s.colRh}</h3><p>${s.colRp}</p></div></div><p class="muted" style="margin-top:28px">${s.foot}</p></div>`,
  beliefs:(s)=>`<div class="slide"><h2>${s.h2}</h2><p class="muted">${s.intro}</p><ul class="beliefs">${s.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`,
  recap:(s)=>`<div class="slide"><div class="rule-line"><span class="tag">${s.tag}</span><span class="bar"></span></div><div class="big" style="font-size:34px">${s.big}</div><p class="muted" style="margin-top:26px">${s.foot}</p></div>`,
  cta:(s)=>`<div class="slide cta"><div class="brandmark">${s.brand}</div><h2>${s.h2}</h2><p class="muted">${s.body}</p><div class="step">${s.step}</div><div class="disclaimer">${s.disclaimer}</div></div>`
};

const stage = document.getElementById('stage');
stage.innerHTML = S.map(s => R[s.t](s)).join('');
</script>
</body>
</html>
