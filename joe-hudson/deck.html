<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feel Over Figure — A Live Masterclass with Joe Hudson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9edf2;        /* pale tint of brand slate #34465c (site_scheme light) */
    --panel:#fbfcfd;
    --ink:#16222f;       /* brand deep navy */
    --rule:#34465c;      /* brand dominant slate */
    --accent:#f5931b;    /* brand orange accent */
    --muted:#5c6b7a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--rule);color:var(--ink);font-family:"Spectral",Georgia,serif}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);border-radius:14px;margin:0 0 22px;padding:60px 56px;
    min-height:430px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(0,0,0,.04);position:relative;overflow:hidden;
  }
  .eyebrow{font-family:"Poppins",sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Poppins",sans-serif;font-weight:700;font-size:52px;line-height:1.05;
    color:var(--ink);margin-bottom:14px;letter-spacing:-.02em}
  h2{font-family:"Poppins",sans-serif;font-weight:600;font-size:34px;line-height:1.12;
    color:var(--ink);margin-bottom:16px;letter-spacing:-.01em}
  .promise{font-size:24px;line-height:1.4;color:var(--rule)}
  p.body{font-size:22px;line-height:1.5;color:var(--rule);max-width:46ch}
  p.body + p.body{margin-top:14px}
  .big{font-family:"Spectral",serif;font-style:italic;font-size:34px;line-height:1.28;color:var(--ink);max-width:24ch}
  .part-num{font-family:"Poppins",sans-serif;font-weight:700;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .centers{display:flex;flex-direction:column;gap:18px;margin-top:8px}
  .center{display:flex;align-items:flex-start;gap:16px}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--accent);margin-top:9px;flex:none}
  .center h3{font-family:"Poppins",sans-serif;font-weight:600;font-size:22px;color:var(--ink)}
  .center span{font-size:19px;color:var(--muted);line-height:1.4}
  ul.view{list-style:none;margin-top:6px}
  ul.view li{font-size:21px;line-height:1.5;color:var(--rule);padding-left:18px;position:relative;margin-bottom:8px}
  ul.view li::before{content:"";position:absolute;left:0;top:13px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  ul.view li b{font-family:"Poppins",sans-serif;font-weight:600;color:var(--ink)}
  .disclaimer{font-family:"Poppins",sans-serif;font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:26px;max-width:60ch}
  .cta-step{font-family:"Poppins",sans-serif;font-weight:600;font-size:20px;color:var(--accent);margin-top:12px}
  .pagefoot{font-family:"Poppins",sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);position:absolute;right:28px;bottom:20px}
  .brandline{font-family:"Poppins",sans-serif;font-size:13px;color:var(--muted);margin-top:22px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Joe Hudson · Art of Accomplishment',
   h1:'Feel Over Figure', promise:'Why your best decisions don’t come from your head, and how to train the ones that do.'},

  {t:'who', eyebrow:'Who this is for',
   h2:'For founders and leaders winning on paper and still feeling stuck',
   body:['You are good at your job. The company works. And something underneath still feels off, heavy, or flat.',
         'This hour is about the part of performance nobody put on your roadmap.']},

  {t:'trap', eyebrow:'The trap',
   h2:'You tried the obvious fix first',
   body:['More effort. More systems. More discipline. Another framework for your calendar.',
         'The stuck feeling did not move. It rarely does, because you have been solving the wrong layer.']},

  {t:'reframe',
   big:'What if the thing in your way was never a strategy problem? What if it is the emotion you keep skipping past?'},

  {t:'part', part:'Part One', h2:'Why effort stops working'},

  {t:'point', eyebrow:'The core problem',
   h2:'High performers are trained to figure',
   body:['Feeling looks like a detour, so we override the one signal that actually knows the way.',
         'The result is a leader who can analyze anything and still cannot tell what they truly want.']},

  {t:'reframe',
   big:'We can only rise to the height of our lowest system.'},

  {t:'part', part:'Part Two', h2:'The three centers'},

  {t:'centers', eyebrow:'The foundational model',
   h2:'Head, heart, and gut',
   centers:[
     {k:'Head', v:'Cognitive capacity. Your ability to see what is true and false in every perspective.'},
     {k:'Heart', v:'Emotional capacity. Your ability to welcome emotion without repression or collapse.'},
     {k:'Gut', v:'Nervous-system capacity. Your ability to feel the simple pleasure of being alive, and the next right move.'}
   ]},

  {t:'point', h2:'Lasting change uses all three',
   body:['Most leadership advice trains the head alone. That is why the insight never quite becomes a change.',
         'When the three centers line up, the effort drops and the clarity arrives.']},

  {t:'part', part:'Part Three', h2:'Feel over figure, in practice'},

  {t:'view', eyebrow:'The VIEW framework',
   h2:'How you stay connected under pressure',
   items:[
     {k:'Vulnerability', v:'saying the true thing, even when it is a little scary.'},
     {k:'Impartiality', v:'not needing the other person, or yourself, to be any different.'},
     {k:'Empathy', v:'being with what someone feels without getting lost in their story.'},
     {k:'Wonder', v:'being curious without needing an answer.'}
   ]},

  {t:'point', eyebrow:'A live practice',
   h2:'Try it in sixty seconds',
   body:['Name the feeling you have been managing all week. Stop managing it for one minute.',
         'Do not fix it or explain it. Just let it be there, and notice what it has been trying to tell you.']},

  {t:'point', eyebrow:'The shift',
   h2:'From figure to feel',
   body:['This is one of the seven patterns that quietly run a life: Feel over Figure.',
         'Once you can see the pattern, you get to choose it, instead of it choosing you.']},

  {t:'credibility', eyebrow:'Why me',
   h2:'Thirty years inside this work',
   body:['A background in venture capital, then three decades studying psychology, neuroscience, and contemplative practice.',
         'Today this is the work behind many of Silicon Valley’s most driven founders and teams at companies like OpenAI, Google, and Apple.']},

  {t:'point', eyebrow:'The path from here',
   h2:'A path, not a pep talk',
   body:['The Connection Course builds the foundation through live partner practice.',
         'The Master Class takes you through all seven patterns over eight weeks, with real people, in a real room.']},

  {t:'cta', eyebrow:'Your next step',
   h2:'Go deeper in the Master Class',
   step:'Join the next live cohort of the Master Class, or start with the Connection Course.',
   body:['If this hour moved something, the work goes much further when it is live, guided, and practiced with others.'],
   disclaimer:'This masterclass is educational. It is not therapy, medical, or financial advice, and it makes no guarantee of any specific outcome, income, or result. Individual experiences vary.'}
];

const deck = document.getElementById('deck');
function esc(x){return (x||'').toString();}
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide';
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.part) h+=`<div class="part-num">${esc(s.part)}</div>`;
  if(s.h1) h+=`<h1>${esc(s.h1)}</h1>`;
  if(s.promise) h+=`<div class="promise">${esc(s.promise)}</div>`;
  if(s.h2) h+=`<h2>${esc(s.h2)}</h2>`;
  if(s.big) h+=`<div class="big">${esc(s.big)}</div>`;
  if(s.centers){
    h+='<div class="centers">';
    s.centers.forEach(c=>{h+=`<div class="center"><span class="dot"></span><div><h3>${esc(c.k)}</h3><span>${esc(c.v)}</span></div></div>`;});
    h+='</div>';
  }
  if(s.items){
    h+='<ul class="view">';
    s.items.forEach(it=>{h+=`<li><b>${esc(it.k)}</b>: ${esc(it.v)}</li>`;});
    h+='</ul>';
  }
  if(s.body){ s.body.forEach(p=>{h+=`<p class="body">${esc(p)}</p>`;}); }
  if(s.step) h+=`<div class="cta-step">${esc(s.step)}</div>`;
  if(s.brand) h+=`<div class="brandline">${esc(s.brand)}</div>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  h+=`<div class="pagefoot">Art of Accomplishment · ${i+1} / ${S.length}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
