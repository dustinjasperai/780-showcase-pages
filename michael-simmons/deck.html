<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Blockbuster Method — Thought Leader School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfb;        /* their body background (brand.json) */
    --panel:#ffffff;
    --rule:#e4e7e9;
    --ink:#1b1f24;
    --ink2:#444444;      /* their body ink */
    --accent:#1bb0ce;    /* their 22-use teal (brand.json) */
    --navy:#101728;      /* their navy (brand.json) */
    --head:'Manrope',system-ui,sans-serif;
    --body:'Raleway',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(16,23,40,.04)}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;color:var(--ink);
    letter-spacing:-.015em}
  h2{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.12;color:var(--ink);
    letter-spacing:-.01em;margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--ink2);max-width:62ch;margin-top:14px}
  .lead{font-size:22px;color:var(--ink)}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px}
  li{position:relative;padding-left:40px;font-size:19px;line-height:1.5;color:var(--ink2);max-width:60ch}
  li .n{position:absolute;left:0;top:0;font-family:var(--head);font-weight:800;color:var(--accent);
    font-size:19px}
  li b{color:var(--ink);font-weight:700}
  .title-slide{background:var(--navy);border-color:var(--navy)}
  .title-slide .kicker{color:var(--accent)}
  .title-slide h1{color:#ffffff;font-size:52px}
  .title-slide p{color:#c7cdd6}
  .title-slide .by{margin-top:34px;font-family:var(--head);font-weight:600;color:#ffffff;font-size:17px}
  .title-slide .by span{color:var(--accent)}
  .cta-slide{background:var(--navy);border-color:var(--navy);text-align:left}
  .cta-slide .kicker{color:var(--accent)}
  .cta-slide h2{color:#ffffff}
  .cta-slide p{color:#c7cdd6}
  .cta-btn{display:inline-block;margin-top:26px;font-family:var(--head);font-weight:700;
    background:var(--accent);color:var(--navy);padding:15px 30px;border-radius:10px;font-size:18px}
  .disclaimer{margin-top:30px;font-size:13px;color:#8a93a0;max-width:70ch;line-height:1.5}
  .pill{display:inline-block;font-family:var(--head);font-weight:700;font-size:13px;
    color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:6px 14px;
    margin-top:4px;align-self:flex-start}
  .quote{font-size:24px;line-height:1.4;color:var(--ink);font-weight:500;max-width:64ch}
  .cite{margin-top:18px;font-family:var(--head);font-weight:600;color:var(--ink2);font-size:16px}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:380px}h1{font-size:34px}.title-slide h1{font-size:38px}h2{font-size:26px}p,li{font-size:17px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   k:'A Thought Leader School Masterclass',
   h:'The Blockbuster Method',
   p:'How to write articles that travel to millions and build a thought-leadership platform that enrolls clients for you.',
   by:'Taught by Michael Simmons'},

  {t:'who',
   k:'Who this is for',
   h:'You have real expertise. Almost no one has heard it.',
   p:'You are an expert, a founder, a coach or an author with ideas worth spreading. You write and you post, but your best thinking disappears into the feed while people with half your depth get the audience.'},

  {t:'trap',
   k:'The trap',
   h:'More content is not the answer.',
   p:'The advice everyone gives is to publish more and be consistent. So you do, and nothing compounds. The problem was never your effort or even your ideas. It is that your ideas were never engineered to travel.'},

  {t:'reframe',
   k:'The reframe',
   h:'A blockbuster is built, not stumbled into.',
   p:'The articles that reach millions are not luck and they are not louder. They are structured so a stranger grasps the idea in seconds, feels compelled to share it, and remembers who wrote it. That structure can be learned.'},

  {t:'part',
   k:'Part one',
   h:'Content versus ideas that travel',
   p:'Content fills a slot. An idea that travels does three jobs at once: it earns attention from people who have never heard of you, transfers credibility while they read, and leaves them wanting more of you. Most writing does the first and skips the other two.'},

  {t:'part',
   k:'Part one',
   h:'Why most experts never compound',
   p:'Depth without a system to surface it stays invisible. The Five Hour Rule is the habit underneath everything I teach: protect about five hours a week to learn deliberately, then turn what you learn into ideas other people can use. Compounding knowledge is what gives you something worth going viral.'},

  {t:'pillars-intro',
   k:'Part two',
   h:'The Blockbuster Method',
   p:'This is the step-by-step system I have used to write articles read by tens of millions of people. Five pillars take a raw insight and turn it into an article engineered to spread.',
   pill:'The #1 mental model for viral writing'},

  {t:'pillar',
   k:'Pillar one',
   h:'The Seed',
   p:'Mine your own expertise for the one seminal idea only you can tell. Not a hot take. The counterintuitive truth you have earned the right to say, the thing you would defend in a room full of experts.'},

  {t:'pillar',
   k:'Pillar two',
   h:'The Mental Model',
   p:'Wrap the idea in a mental model so a stranger grasps it instantly. A clean frame, a vivid name, a before and after. This is what makes a deep idea feel simple, and simple is what gets shared.'},

  {t:'pillar',
   k:'Pillar three',
   h:'The Hook',
   p:'Earn the first sentence without resorting to clickbait. The headline and opening make a specific promise your expertise can actually keep, so the right reader leans in and the wrong one scrolls past.'},

  {t:'pillar',
   k:'Pillar four',
   h:'The Blockbuster Structure',
   p:'Build the article so credibility compounds paragraph by paragraph. Proof, story and framework in the order that keeps a reader moving and leaves them trusting you by the end, not just entertained.'},

  {t:'pillar',
   k:'Pillar five',
   h:'Distribution',
   p:'Turn one article into reach. The same seminal idea becomes a newsletter, a thread, a talk and a post, each sending readers back to the one place where they can go deeper with you.'},

  {t:'part',
   k:'Part three',
   h:'When an idea starts traveling',
   p:'One blockbuster idea brings in readers who have never heard of you. Your newsletter keeps them. A share of them raise their hand to work with you. That is the platform flywheel: write, reach, enroll, repeat.'},

  {t:'why',
   k:'Why me',
   h:'I have run this thousands of times.',
   pts:[
     {n:'01',b:'Tens of millions of reads.',x:'My articles have been read by tens of millions of people and published in Fortune, Business Insider, Forbes and Inc.'},
     {n:'02',b:'100,000+ subscribers.',x:'The Blockbuster Blueprint newsletter reaches a six-figure audience of writers and experts every week.'},
     {n:'03',b:'A recognized track record.',x:'Ernst and Young Entrepreneur of the Year, with work taught inside companies and universities.'}
   ]},

  {t:'quote',
   k:'A student result',
   q:'"As a direct result of enrolling in Thought Leader School, I was able to land a $60,000 client."',
   cite:'Fernando Colosimo, Coach'},

  {t:'objection',
   k:'The objection',
   h:'"But I am not a writer, and AI writes everything now."',
   p:'Exactly backwards. When anyone can generate words, the scarce thing is a seminal idea and a mental model worth spreading. AI is leverage on top of that, not a replacement for it. In AI Thought Leader School I teach you to pair the method with AI so you produce more of your best thinking, not more noise.'},

  {t:'path',
   k:'The path forward',
   h:'Three tracks, one platform',
   pts:[
     {n:'01',b:'AI Blockbuster.',x:'Produce high-quality, high-quantity articles that travel, with AI doing the heavy lifting and you keeping the rigor.'},
     {n:'02',b:'6-Figure Prompt Newsletter.',x:'Build the publishing engine that turns readers into a list and a list into revenue.'},
     {n:'03',b:'Human Superintelligence.',x:'Use the Five Hour Rule and mental models to keep generating ideas worth spreading.'}
   ]},

  {t:'recap',
   k:'Recap',
   h:'The whole method in one line',
   p:'Find the seminal idea only you can tell, wrap it in a mental model, hook the right reader, structure it so credibility compounds, and distribute it everywhere. Do that on repeat and the platform builds itself.'},

  {t:'cta',
   k:'Your next step',
   h:'Ready to write your first blockbuster?',
   p:'If you want the full method, the templates and the live classes, apply to Thought Leader School and we will map your first blockbuster idea together.',
   btn:'Apply to Thought Leader School',
   disc:'This masterclass is educational and reflects one practitioner approach. It is not financial, legal or business advice, and it makes no income or results guarantees. Individual results vary and depend on your own effort, market and execution.'}
];

const deck = document.getElementById('deck');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
S.forEach(function(s){
  const d = document.createElement('section');
  d.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta-slide':'');
  let html = '';
  if(s.k) html += '<div class="kicker">'+esc(s.k)+'</div>';
  if(s.t==='title'){
    html += '<h1>'+esc(s.h)+'</h1>';
    if(s.p) html += '<p class="lead">'+esc(s.p)+'</p>';
    if(s.by) html += '<div class="by">'+esc(s.by).replace('Michael Simmons','<span>Michael Simmons</span>')+'</div>';
  } else if(s.t==='quote'){
    html += '<div class="quote">'+esc(s.q)+'</div>';
    if(s.cite) html += '<div class="cite">'+esc(s.cite)+'</div>';
  } else if(s.t==='cta'){
    html += '<h2>'+esc(s.h)+'</h2>';
    if(s.p) html += '<p>'+esc(s.p)+'</p>';
    if(s.btn) html += '<span class="cta-btn">'+esc(s.btn)+'</span>';
    if(s.disc) html += '<div class="disclaimer">'+esc(s.disc)+'</div>';
  } else {
    if(s.h) html += '<h2>'+esc(s.h)+'</h2>';
    if(s.p) html += '<p>'+esc(s.p)+'</p>';
    if(s.pill) html += '<span class="pill">'+esc(s.pill)+'</span>';
    if(s.pts){
      html += '<ul>';
      s.pts.forEach(function(it){
        html += '<li><span class="n">'+esc(it.n)+'</span><b>'+esc(it.b)+'</b> '+esc(it.x)+'</li>';
      });
      html += '</ul>';
    }
  }
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
