<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Head-Hunted - The G.E.T.H.I.R.E.D Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe2;        /* warm ivory, tinted from her gold #c6ab75 + warm grey #e4e2e2 */
    --panel:#fffcf5;     /* soft cream panel */
    --soft:#efe7d6;      /* deeper gold tint panel */
    --ink:#141414;       /* from her near-black #111111 */
    --muted:#8a8a8a;     /* from her #757575 */
    --rule:#e4e2e2;      /* her warm grey */
    --accent:#c6ab75;    /* her brand gold, ranked_colors */
    --accent-deep:#a8894f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:58px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-bottom:20px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:60px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;line-height:1.1;margin-bottom:22px}
  .lede{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:var(--muted);margin-top:22px;line-height:1.35}
  p{font-size:18px;line-height:1.6;max-width:62ch;color:#2b2b2b}
  p + p{margin-top:14px}
  .rungs{list-style:none;margin:22px 0 0}
  .rungs li{position:relative;padding:16px 0 16px 46px;border-top:1px solid var(--rule);font-size:18px}
  .rungs li:last-child{border-bottom:1px solid var(--rule)}
  .rungs li .k{position:absolute;left:0;top:14px;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent-deep);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
  .rungs li b{font-weight:600}
  .big{font-family:'Cormorant Garamond',serif;font-size:120px;font-weight:600;color:var(--accent);line-height:1}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:34px}
  .card{background:var(--soft);border-radius:12px;padding:26px 28px}
  .card h3{font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:8px}
  .card p{font-size:16px}
  .tag{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
  .cta h1{font-size:52px;margin-bottom:18px}
  .btn{display:inline-block;margin-top:26px;background:var(--accent);color:#1a1405;font-weight:600;padding:16px 34px;border-radius:999px;font-size:17px;text-decoration:none}
  .disc{margin-top:28px;font-size:13px;color:var(--muted);max-width:70ch;line-height:1.5}
  .num{color:var(--accent-deep);font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.2em;position:absolute;right:30px;bottom:22px}
  .quiet{color:var(--muted)}
  @media(max-width:720px){.slide{padding:38px 26px;min-height:380px}h1{font-size:40px}h2{font-size:30px}.two{grid-template-columns:1fr}.big{font-size:84px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', h:`<div class="slide"><div class="eyebrow">A Live Masterclass with Danielle Cobo</div>
   <h1>Get Head-Hunted.</h1>
   <p class="lede">The G.E.T.H.I.R.E.D Method for landing the medical sales role you actually want, without ever "applying online" again.</p>
   <div class="num">01</div></div>`},

 {t:'for', h:`<div class="slide"><div class="eyebrow">Who this is for</div>
   <h2>You are good at the job. The job search makes you feel like you are not.</h2>
   <p>This is for the medical, pharma, and device sales professional who is ready for the next role: breaking in, getting back in after a layoff, or moving up to the territory you deserve.</p>
   <p>You know you can carry a bag and crush a number. But the online application black hole, the silent recruiters, and the "we went another direction" emails have you second-guessing a career you have earned.</p>
   <div class="num">02</div></div>`},

 {t:'reframe', h:`<div class="slide" style="background:#141414;color:#f3efe6;border-color:#141414">
   <div class="eyebrow" style="color:var(--accent)">The hard truth</div>
   <h2 style="color:#fff">The best rep rarely gets the job. The most findable, most prepared candidate does.</h2>
   <p style="color:#d8d2c6;max-width:60ch">Hiring managers are not sorting for the most talented person in the market. They are choosing from the handful of people who showed up credible, referred, and ready. Talent you already have. Being chosen is a system, and the system can be learned.</p>
   <div class="num">03</div></div>`},

 {t:'p1_head', h:`<div class="slide"><div class="tag">Part One - The real problem</div>
   <h2>Applying online is not a strategy. It is a lottery you keep losing.</h2>
   <p>Most reps run the same loop: scroll job boards, fire off applications, tweak the resume, wait. Then do it again, a little more discouraged each round.</p>
   <p>The loop feels like effort, so it feels like progress. It is neither. It hands your career to a tracking system and a stranger who skims for six seconds.</p>
   <div class="num">04</div></div>`},

 {t:'p1_cost', h:`<div class="slide"><div class="tag">Part One</div>
   <div class="two" style="align-items:center">
     <div><div class="big">6s</div><p class="quiet">Roughly how long a resume is scanned before a keep-or-cut decision.</p></div>
     <div><h2 style="font-size:32px">The cost is not just time.</h2>
       <p>Every week in the black hole is a week of lower confidence, weaker negotiating position, and a growing story that something is wrong with you. Nothing is wrong with you. Your approach is pointed at the wrong door.</p></div>
   </div>
   <div class="num">05</div></div>`},

 {t:'p1_truth', h:`<div class="slide"><div class="tag">Part One</div>
   <h2>The roles you want are filled before they are ever posted.</h2>
   <p>Device and pharma teams hire through referral, reputation, and the reps already on their radar. By the time a role hits the job board, a shortlist usually exists.</p>
   <p class="lede">So the goal is not to apply harder. It is to become the person the role comes looking for.</p>
   <div class="num">06</div></div>`},

 {t:'p2_intro', h:`<div class="slide" style="background:var(--soft)"><div class="tag">Part Two - The method</div>
   <h2>G.E.T.H.I.R.E.D is how you stop applying and start getting chosen.</h2>
   <p>It is the exact system behind the candidates who get head-hunted into medical sales: clarity on the target, a brand recruiters find, a search that works the hidden market, and interviews you walk into already in the lead.</p>
   <p class="quiet">Five moves. Run in order, they compound.</p>
   <div class="num">07</div></div>`},

 {t:'p2_rungs', h:`<div class="slide"><div class="tag">Part Two - The five rungs</div>
   <h2>The climb, in order.</h2>
   <ul class="rungs">
     <li><span class="k">1</span><b>Clarity</b> - name the exact role, company type, and territory worth your next two years.</li>
     <li><span class="k">2</span><b>Brand</b> - turn your track record into a profile recruiters surface and trust.</li>
     <li><span class="k">3</span><b>Search</b> - work the hidden market through people, not portals.</li>
     <li><span class="k">4</span><b>Interview</b> - the H.I.R.E. approach that makes you the obvious choice.</li>
     <li><span class="k">5</span><b>First 90</b> - the 30-60-90 plan that proves you were the right hire.</li>
   </ul>
   <div class="num">08</div></div>`},

 {t:'p2_clarity', h:`<div class="slide"><div class="tag">Rung 1 - Clarity</div>
   <h2>You cannot be head-hunted for a role you cannot name.</h2>
   <p>Before a single outreach, we get specific: capital equipment or pharma or device, the company stage that fits your style, the territory and comp structure that actually move your life forward.</p>
   <p>Clarity is what makes every later step sharp. Vague candidates get ignored. Specific candidates get remembered.</p>
   <div class="num">09</div></div>`},

 {t:'p2_brand', h:`<div class="slide"><div class="tag">Rung 2 - Brand</div>
   <h2>Your experience is an asset. Right now it is sitting in a drawer.</h2>
   <p>Fifteen years of President's Club numbers mean nothing to a recruiter who never finds them. We rebuild the resume and the LinkedIn profile so your results are the first thing a hiring manager sees, and so you show up when they search their market.</p>
   <p>This is the difference between chasing recruiters and having them open your profile first.</p>
   <div class="num">10</div></div>`},

 {t:'p2_search', h:`<div class="slide"><div class="tag">Rung 3 - Search</div>
   <h2>Work the hidden market through people, not portals.</h2>
   <p>We build a targeted list of the companies and leaders worth your energy, then open warm conversations with them before any role is posted. Referred candidates skip the line everyone else is standing in.</p>
   <div class="num">11</div></div>`},

 {t:'p2_interview', h:`<div class="slide"><div class="tag">Rung 4 - Interview (the H.I.R.E. approach)</div>
   <div class="two">
     <div class="card"><h3>Hook</h3><p>Open with the number and the story that makes you memorable in the first two minutes.</p></div>
     <div class="card"><h3>Impact</h3><p>Translate your track record into their quota, their territory, their problem.</p></div>
     <div class="card"><h3>Rapport</h3><p>Read the room with DiSC, and sell the way the buyer in front of you needs to buy.</p></div>
     <div class="card"><h3>Execute</h3><p>Close the interview like a call: clear next step, confident ask, no fade-out.</p></div>
   </div>
   <div class="num">12</div></div>`},

 {t:'p2_first90', h:`<div class="slide"><div class="tag">Rung 5 - First 90</div>
   <h2>Walk in with a 30-60-90 plan and you have already won the room.</h2>
   <p>The strongest candidates do not promise they will ramp fast. They show exactly how: the accounts to open first, the relationships to build, the early wins that prove the hire. It is the move that turns a final interview into an offer.</p>
   <div class="num">13</div></div>`},

 {t:'p3_look', h:`<div class="slide" style="background:var(--soft)"><div class="tag">Part Three - What changes for you</div>
   <h2>From "please consider me" to "when can you start."</h2>
   <p>Run in order, G.E.T.H.I.R.E.D changes the whole posture of a search. You stop sending applications into silence and start having real conversations with leaders who already see you as a fit. The offer stops being a hope and becomes a negotiation.</p>
   <div class="num">14</div></div>`},

 {t:'p3_grit', h:`<div class="slide"><div class="tag">Part Three - The thing underneath</div>
   <h2>Grit is the engine. The method just points it.</h2>
   <p>A job search tests resilience more than talent. The reason most people quit the right strategy too early is the seven roadblocks in my book, Unstoppable Grit: fear, comparison, perfectionism, and the rest.</p>
   <p>We name them out loud in this masterclass, because the candidate who keeps going when it gets quiet is the candidate who gets hired.</p>
   <div class="num">15</div></div>`},

 {t:'p3_whyme', h:`<div class="slide"><div class="tag">Why listen to me</div>
   <h2>I did this in the arena, not the classroom.</h2>
   <p>Four consecutive President's Club awards as a rep in capital equipment sales. Then a Fortune 500 sales leader who took a bottom-ranked team to number one in the nation, through downsizing, restructuring, and a new product every quarter.</p>
   <p>I carried the bag, hit the targets, and later hired and promoted the reps who did it too. I know what the person across the interview table is actually listening for.</p>
   <div class="num">16</div></div>`},

 {t:'recap', h:`<div class="slide"><div class="eyebrow">The one thing to take with you</div>
   <h2>Stop applying. Start getting chosen.</h2>
   <p>Clarity, Brand, Search, Interview, First 90. The same system that gets medical sales reps head-hunted into the roles they actually want, built on a career that lived every pressure-packed minute of it.</p>
   <div class="num">17</div></div>`},

 {t:'cta', h:`<div class="slide cta"><div class="eyebrow">Your next step</div>
   <h1>Ready to go from stuck to head-hunted?</h1>
   <p>If you want the full G.E.T.H.I.R.E.D system applied to your specific search, the Career &amp; Sales Acceleration Program is where we build it together: clarity, brand, search, interview prep, and your first-90 plan, coached end to end.</p>
   <a class="btn" href="https://www.daniellecobo.com/careercoachingprograms">Explore the Career &amp; Sales Acceleration Program</a>
   <p class="disc">Educational content only. No income or result is guaranteed. Results vary based on your effort, experience, and market conditions.</p>
   <div class="num">18</div></div>`}
];

document.getElementById('deck').innerHTML = S.map(s=>s.h).join('');
</script>
</body>
</html>
