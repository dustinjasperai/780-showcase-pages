<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The First 60 Seconds - 30 Minutes to President's Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f5;        /* warm white ground, from site_scheme:light */
    --panel:#f2f1ec;     /* light panel */
    --ink:#141414;       /* near-black ink, from ranked #222222 */
    --muted:#55554e;
    --accent:#fce552;    /* 30MPC signature button yellow */
    --indigo:#3d4d91;    /* 30MPC ranked indigo, for depth/contrast */
    --rule:#141414;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 120px}
  .slide{background:var(--bg);border:2px solid var(--ink);border-radius:6px;padding:56px 52px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:6px 6px 0 var(--indigo)}
  .slide.dark{background:var(--indigo);color:#fff;border-color:var(--indigo);box-shadow:6px 6px 0 var(--ink)}
  .slide.hero{background:var(--accent);border-color:var(--ink);box-shadow:8px 8px 0 var(--ink)}
  .kicker{font-family:"DM Sans";font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:13px;color:var(--muted);margin-bottom:18px}
  .slide.dark .kicker{color:#d9dcf2}
  h1{font-family:"Anton";font-weight:400;font-size:62px;line-height:.98;letter-spacing:.5px;text-transform:uppercase}
  h2{font-family:"Anton";font-weight:400;font-size:40px;line-height:1.02;letter-spacing:.4px;text-transform:uppercase;margin-bottom:20px}
  h3{font-family:"Anton";font-weight:400;font-size:26px;letter-spacing:.3px;text-transform:uppercase;margin-bottom:10px}
  p{font-size:20px;line-height:1.5;max-width:44ch;margin-bottom:14px}
  p.lead{font-size:24px;max-width:42ch}
  .mark{background:var(--accent);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .slide.dark .mark{color:var(--ink)}
  ul{list-style:none;margin:8px 0}
  li{font-size:20px;line-height:1.45;margin-bottom:14px;padding-left:30px;position:relative;max-width:46ch}
  li::before{content:"";position:absolute;left:0;top:9px;width:14px;height:14px;background:var(--accent);border:2px solid var(--ink)}
  .slide.dark li::before{border-color:#fff}
  .script{font-family:"DM Sans";background:var(--panel);border-left:6px solid var(--accent);padding:18px 22px;margin:10px 0;font-size:19px;line-height:1.5;max-width:52ch}
  .slide.dark .script{background:rgba(255,255,255,.08);color:#fff}
  .who{font-size:22px;font-weight:700;max-width:46ch}
  .sub{color:var(--muted);font-size:20px;max-width:46ch;margin-top:8px}
  .slide.hero .sub{color:#1a1a1a}
  .credit{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px}
  .credit span{background:var(--panel);border:2px solid var(--ink);padding:8px 14px;font-weight:700;font-size:16px;color:var(--ink)}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.4}
  .cta-btn{display:inline-block;background:var(--ink);color:var(--accent);font-family:"Anton";text-transform:uppercase;letter-spacing:.5px;font-size:24px;padding:16px 30px;margin-top:10px;border-radius:4px;text-decoration:none;width:fit-content}
  .n{font-family:"Anton";color:var(--indigo);font-size:22px;margin-right:10px}
  .pagefoot{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'hero', kicker:'A live masterclass',
    h:'The First<br>60 Seconds',
    sub:'How to turn a cold call into a booked meeting, using the exact words that work, not the theory.'},

  {t:'who', kicker:'Who this is for',
    h:'For reps who <span class="mark">dread</span> the dial',
    who:'B2B sales reps, SDRs and AEs who have to cold call and hate every second of it, plus the managers tired of watching pipeline dry up.',
    sub:'If your team threw its 1972 sales training in the trash and still gets hung up on, this is for you.'},

  {t:'trap', kicker:'The trap',
    h:'You have 7 seconds<br>and you are wasting them',
    paras:['You open with "How are you doing today?" and the prospect already knows it is a cold call. The wall goes up before you say a single useful word.',
           'Then you talk faster, pitch harder, and get hung up on. It is not that you are bad on the phone. Your first sentence is doing the damage.']},

  {t:'hook', cls:'dark', kicker:'The reframe',
    h:'Cold calling is not dead.<br>Your opener is.',
    paras:['The channel still books meetings every day. What stopped working is the polite, product-first opener every rep was taught. Fix the first 60 seconds and the same list starts converting.']},

  {t:'part', cls:'dark', part:'Part One',
    h:'Why most cold calls die in the first 10 seconds'},

  {t:'reflex', kicker:'The core problem',
    h:'They say no<br>before they say hello',
    paras:['A cold call triggers a knee-jerk reflex. "Not interested" is not a real objection, it is a reflex to make the call end.',
           'Every second you spend fighting that reflex head-on confirms you are exactly the interruption they wanted to escape.']},

  {t:'data', kicker:'The evidence',
    h:'This is not opinion',
    lead:'These tactics were pulled from an analysis of roughly <span class="mark">300 million cold calls</span> and from 300+ President\'s Club sellers who came on the show to explain exactly what they say.',
    sub:'We reverse-engineered what the top 1% do differently in the opening seconds, then turned it into scripts anyone can run.'},

  {t:'part', cls:'dark', part:'Part Two',
    h:'The First 60 Seconds framework'},

  {t:'pillar', n:'01', kicker:'The framework', h:'The Opener',
    paras:['Skip "How are you today?". Earn the next 30 seconds with a permission-based pattern interrupt that respects their time and says plainly why you called.'],
    scripts:['"Hey Jordan, I know I caught you out of the blue. Can I take 30 seconds to tell you why I called, and then you can tell me to buzz off?"']},

  {t:'pillar', n:'02', kicker:'The framework', h:'The Problem Proposition',
    paras:['Do not pitch the product. Name the pain your best customers had before they found you. The prospect should feel understood before they feel sold to.'],
    scripts:['"Most sales leaders we talk to are watching reps freeze on the opener and blame the list. Sound familiar, or are you already on top of it?"']},

  {t:'pillar', n:'03', kicker:'The framework', h:'The Mr. Miyagi Method',
    paras:['Do not fight the knee-jerk "I am not interested". Sort every objection into one of three types, agree first, then redirect with a talk track built for that type.'],
    scripts:['"Totally fair, most people say that before they know why I called. If it is still a no in 20 seconds, I will let you go for good."']},

  {t:'pillar', n:'04', kicker:'The framework', h:'How to Be a Machine',
    paras:['The framework only pays off at volume. Gatekeeper scripts, a voicemail that actually earns callbacks, and a dial rhythm that turns more dials into more live connects.']},

  {t:'transcript', cls:'dark', kicker:'Put together', h:'60 seconds, start to finish',
    scripts:['"Hey Jordan, I know I caught you cold. 30 seconds and then you can tell me to buzz off?"',
             '"Most sales leaders we talk to have reps freezing on the opener. Is that you, or are you already on top of it?"',
             '"Totally fair. If it is a no in 20 seconds I will let you go. Worth a quick look?"'],
    paras:['Same call, same list. A different first 60 seconds.']},

  {t:'part', cls:'dark', part:'Part Three',
    h:'Inside a rep\'s best week on the phone'},

  {t:'after', kicker:'The payoff', h:'What actually<br>changes',
    bullets:['The opener buys 30 more seconds instead of a dial tone.',
             'Objections get redirected instead of argued, so more calls stay alive.',
             'More live connects turn into booked meetings on the calendar.',
             'The rep stops dreading the phone because they finally know what to say.']},

  {t:'why', kicker:'Why learn it here', h:'The people who<br>wrote the playbook',
    paras:['Armand Farrokh, former VP of Sales, and Nick Cegelski, a three-time number one enterprise seller, host the number one sales podcast and wrote the book on cold calling.'],
    credits:['300+ President\'s Club sellers','#1 sales podcast','Cold Calling Sucks, 100K+ copies','Built on 300M calls of data']},

  {t:'recap', kicker:'The framework, in one screen', h:'The First 60 Seconds',
    bullets:['<b>The Opener</b> earns the next 30 seconds.',
             '<b>The Problem Proposition</b> names the pain, not the product.',
             '<b>The Mr. Miyagi Method</b> disarms the reflex objection.',
             '<b>How to Be a Machine</b> makes it pay off at volume.']},

  {t:'cta', cls:'hero', kicker:'Your next step', h:'Get the full playbook',
    sub:'This masterclass is a taste of Cold Calls to President\'s Club, our course with 50+ scripts, 18+ objection talk tracks, and real call reviews. Lifetime access, and a 30-day guarantee that it books you at least one more meeting.',
    ctaText:'Enroll at 30mpc.com', ctaHref:'https://www.30mpc.com/course/cold-calls-to-presidents-club',
    disc:'Educational content only. No income, quota, or result is guaranteed. Results vary based on your market, effort, and execution. Frameworks and figures shown are 30 Minutes to President\'s Club teaching examples.'}
];

function slideHTML(s){
  const cls = 'slide' + (s.cls ? (' ' + s.cls) : '');
  let inner = '';
  const kick = s.part || s.kicker;
  if (kick) inner += `<div class="kicker">${(s.n && !s.part) ? `<span class="n">${s.n}</span>` : ''}${kick}</div>`;
  if (s.h) {
    const tag = (s.t === 'title' || s.t === 'part') ? 'h1' : (s.t === 'pillar' ? 'h3' : 'h2');
    inner += `<${tag}>${s.h}</${tag}>`;
  }
  if (s.lead) inner += `<p class="lead">${s.lead}</p>`;
  if (s.who) inner += `<p class="who">${s.who}</p>`;
  (s.paras || []).forEach(p => inner += `<p>${p}</p>`);
  (s.scripts || []).forEach(q => inner += `<div class="script">${q}</div>`);
  if (s.bullets) inner += '<ul>' + s.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
  if (s.credits) inner += '<div class="credit">' + s.credits.map(c => `<span>${c}</span>`).join('') + '</div>';
  if (s.sub) inner += `<p class="sub">${s.sub}</p>`;
  if (s.ctaText) inner += `<a class="cta-btn" href="${s.ctaHref}">${s.ctaText}</a>`;
  if (s.disc) inner += `<p class="disc">${s.disc}</p>`;
  return `<div class="${cls}">${inner}</div>`;
}

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const wrap = document.createElement('div');
  wrap.innerHTML = slideHTML(s);
  deck.appendChild(wrap.firstChild);
  const foot = document.createElement('div');
  foot.className = 'pagefoot';
  foot.textContent = `30 Minutes to President's Club  .  ${String(i + 1).padStart(2, '0')} / ${String(S.length).padStart(2, '0')}`;
  deck.appendChild(foot);
});
</script>
</body>
</html>
