<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profit-First Flower Farm: Cost Every Stem, Price for Margin, Pay Yourself · Jerry Kasprzak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#eef3f0; --panel:#103a33; --rule:#d9e3dd;
    --ink:#1f2a27; --accent:#0a9488; --accent2:#b5622f; --dim:#6b7a74; --grey:#3c4a45;
    --onpine:#eef3f0; --pinepop:#e0915c; --pineteal:#4fc2b4; --pinedim:#9fb3ab;
  }
  html,body{height:100%}
  body{background:#0b1512;font-family:'Raleway',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1512}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Raleway',sans-serif;font-size:1.05vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Spectral',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:.002em}
  .t-title h1{font-size:4.1vw;max-width:94%}
  .t-normal h1{font-size:2.95vw;max-width:90%}
  .t-normal .body{font-family:'Raleway',sans-serif;font-size:1.32vw;color:var(--grey);margin-top:2.6vh;max-width:78%;line-height:1.64;font-weight:400}
  .sub{font-family:'Raleway',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.54;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.2vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.2vw;max-width:92%}
  .t-section .rule{width:14vw;height:3px;background:var(--accent2);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:3.05vw;max-width:88%;color:var(--onpine)}
  .t-dark h1 .hl{color:var(--pinepop)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.4vw;max-width:84%;color:var(--onpine)}
  .t-cta .kicker{color:var(--pineteal)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--pineteal);color:var(--onpine);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.06vw;font-weight:600;font-family:'Raleway',sans-serif;letter-spacing:.03em}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Raleway',sans-serif;font-size:.82vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-cta .disc{color:var(--pinedim)}
  .t-title .disc,.t-normal .disc{text-align:left}
  .brandline{font-family:'Raleway',sans-serif;font-size:1.14vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:700}
  .motif{position:absolute;pointer-events:none}
  .title-motif{right:7%;bottom:9%;width:12vw;opacity:.92}
  .corner-motif{right:7.2%;bottom:8%;width:5vw;opacity:.42}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--pinedim);z-index:20;font-weight:600;font-family:'Raleway',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--pinedim);z-index:20;font-weight:700;font-family:'Raleway',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--pinedim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Raleway',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:6vw}.chip{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">FarmerFloristU &middot; Profit-First Flower Business</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: one fine-line stem over a ledger rule. one clean living line, one accounting line, never clip-art florals. -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="motif" viewBox="0 0 120 200">
  <g fill="none" stroke="#0a9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 30 L60 132"/>
    <path d="M60 66 C76 60 86 64 92 54"/>
    <path d="M60 92 C44 86 34 90 28 80"/>
  </g>
  <circle cx="60" cy="24" r="8" fill="#b5622f"/>
  <g stroke="#1f2a27" stroke-width="2" opacity=".38" stroke-linecap="round">
    <path d="M26 156 L94 156"/>
    <path d="M26 174 L94 174"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Profit-First Flower Farm',sub:'A live masterclass for flower farmers on building a farm that does three things from day one: generates profit, sustains itself, and pays you a real wage, by costing every crop to the labor and pricing every stem for margin.',brand:true},

 {t:'normal',k:'Who this is for',title:'You can grow a beautiful season. The part that keeps you up at night is whether any of it actually paid you.',body:'You know how to grow. What you do not have is a clear read on what each crop really costs you, which stems make money, or whether the season paid you a wage or just paid the seed bill. The flowers were never the problem. The numbers are a black box.'},
 {t:'dark',title:'Most flower farms do not fail because the flowers are bad. They fail because the grower never gets <span class="hl">paid</span> while the beds still look full.'},

 {t:'section',idx:'Part One',title:'Why A Beautiful Season Still Does Not Pay'},
 {t:'normal',k:'The feels-worth-it price',title:'You price a bouquet on what it feels worth, not on what it actually cost you to grow.',body:'A price set by feel is a guess, and a guess almost always lands under the real cost. Two farms can sell the same bouquet, and one is building a business while the other is quietly subsidizing every stem, because neither ever put a costed number on it. Pricing by feel is how a full market table still ends the year in the red.'},
 {t:'normal',k:'The cost nobody counts',title:'Your own labor is the cost that never makes it into the price, so the farm runs on it.',body:'Seed and amendments are easy to see. The hours you spend seeding, weeding, harvesting, and selling are not, so they get left out of the price and paid for out of your own time instead. That is why so many farms look busy and full and still cannot pay the grower. The margin was real, it just went to unpaid labor.'},
 {t:'dark',title:'Volume feels like progress. <span class="hl">Margin per stem</span> is the whole game.'},

 {t:'section',idx:'Part Two',title:'The Profit-First Model, Costed To The Stem'},
 {t:'normal',k:'One · The three non-negotiables',title:'Build the farm so that from day one it generates profit, sustains itself, and pays you.',body:'Profit is the starting constraint, not whatever is left over after the season. You design the model around those three jobs first, then choose what to grow and how to sell it to serve them, instead of growing everything and hoping the numbers work out. That one reordering is what separates a farm from an expensive hobby.'},
 {t:'normal',k:'Two · True cost, crop by crop',title:'Cost every crop down to the labor, so you know the real margin of each stem before you plant it.',body:'The cost analysis breaks each crop into its true cost, including the hours, so a dahlia and a zinnia stop being the same line in your head and become two very different margins on paper. Now you are not guessing which crops carry the farm. You know, and you can plan the beds around the answer.'},
 {t:'normal',k:'Three · Price every stem for margin',title:'Turn a feels-worth-it price into a costed one, then price for the margin the farm needs.',body:'Once each crop has a real cost, the price stops being a feeling and becomes a decision. You set prices that cover the true cost and leave the margin the business needs to pay you, and you can hold that price with confidence because you can see exactly what sits underneath it.'},
 {t:'normal',k:'Four · Permission for profit',title:'Grow the crops that pay, on purpose, and stop apologizing for pricing to profit.',body:'Passion and under-pricing are why this segment burns out. Permission for profit is the reframe that a grower is allowed, and required, to prioritize profit, so you plant more of what pays, less of what does not, and price like a business that intends to still be here next season.'},
 {t:'dark',title:'Cost each crop, price every stem, grow what pays. That is the difference between <span class="hl">a hobby that sells flowers</span> and a farm that pays you.'},

 {t:'section',idx:'Part Three',title:'From Full Beds To A Farm That Pays'},
 {t:'normal',k:'A costed season',title:'The shift is from a season you hope paid off to a season you costed on purpose.',body:'You are not becoming an accountant. You are running your own farm off a costed number instead of a feeling, so every planting, pricing, and selling call is made on real margin. The beds can look exactly as full as they do now. The difference is that at the end of the season, the farm actually paid you.'},
 {t:'normal',k:'Why Jerry Kasprzak',title:'A working flower farmer teaching the numbers side of the business he runs himself.',body:'Jerry grows at Porch and Prairie Flowers, hosts the Profit-First Flower Business podcast, and built the cost-per-crop spreadsheets growers use to find the real margin on their farms. This is taught from the numbers he runs on his own farm, which is why it is built around what a grower actually needs to see to get paid.'},

 {t:'section',idx:'Your Next Step',title:'Run Your Farm On The Numbers'},
 {t:'normal',k:'Where the method lives',title:'The full model, from the three non-negotiables to true-cost analysis to pricing for margin, is FarmerFloristU.',body:'It is the school where the whole profit-first system lives: the business courses, the cost-analysis spreadsheets and templates, and the masterclass that turns these numbers into the way you run the farm, so profit-first is not a one-time exercise but how you plant and price from now on.'},
 {t:'cta',k:'FarmerFloristU',title:'Ready to build a flower farm that generates profit, sustains itself, and pays you?',chips:['Explore FarmerFloristU','Listen to the Profit-First Flower Business podcast'],disc:'Educational content for flower farmers and market growers. No income, profit, or business result is guaranteed. Results vary by farm, market, and effort.'},
];

const deck=document.getElementById('deck');
function motifSvg(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}" viewBox="0 0 120 200"><use href="#motif"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">FarmerFlorist<b>U</b> &middot; Jerry Kasprzak</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=motifSvg('title');
  else if(s.t==='normal' && (i%3===0)) h+=motifSvg('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
