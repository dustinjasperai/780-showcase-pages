<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>La fin des revenus en dents de scie · Daniel Desjardins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#14110d; --panel:#1e1913; --rule:#3a2f24;
    --terra:#c17a3a; --burnt:#8b5527; --cream:#f5f0e8; --grey:#c9bfb0; --dim:#8a7d6c;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Hanken Grotesk',-apple-system,sans-serif;color:var(--cream);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);margin-bottom:2.4vh}
  h1{font-family:'Marcellus',Georgia,serif;font-weight:600;color:var(--cream);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.7vw}
  .t-normal h1{font-size:3.3vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.56;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.48;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Hanken Grotesk',sans-serif;font-size:1.32vw;font-weight:600;color:var(--burnt);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--terra),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#2a2013 0%,#0b0906 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;font-style:italic;color:#f7f2ea}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2a2013 0%,#0b0906 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--terra);color:#e7c9a3;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.42}
  .t-title .disc,.t-normal .disc{text-align:left}
  .align-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-align{right:7.5%;bottom:8%;width:22vw}
  .corner-align{right:6%;bottom:7.5%;width:10vw;opacity:.42}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--terra);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--terra);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">MCA</div>
<div class="hint" id="hint">&rarr; clique ou fleches</div>

<!-- alignment motif: scattered marks resolving into one aligned axis toward a node -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="align" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="120" x2="246" y2="120" stroke="#8b5527" opacity="0.45"/>
    <line x1="40" y1="112" x2="92" y2="98" stroke="#f5f0e8" opacity="0.14"/>
    <path d="M30 120 L104 92 L168 70 L224 44" stroke="#c17a3a" opacity="0.92"/>
    <circle cx="224" cy="44" r="5" fill="none" stroke="#c17a3a" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'La fin des revenus en dents de scie',sub:'Comment installer un moteur de revenus previsibles, stables et humains, sans te faire violence pour reussir.',brand:true,rise:'title'},
 {t:'normal',k:'Pour qui',title:'Tu as l’expertise. Pas encore la stabilite.',body:'Un mois tu fais 5 000 $ et tu te sens riche. Le mois suivant, le silence radio. Cette insecurite te garde eveillee la nuit, et la seule idee de te vendre te donne la nausee.'},
 {t:'dark',title:'Ce n’est pas toi le probleme. C’est un moteur mal aligne.'},

 {t:'section',idx:'Partie 1',title:'L’audit de toxicite'},
 {t:'normal',k:'Pourquoi forcer ne marche plus',title:'Travailler plus fort est en train de tuer ton entreprise.',body:'Le Hustle et le High Ticket agressif qu’on t’a appris te poussent a crier plus fort que les autres. Pour une accompagnante de cœur, ce chemin mene droit au burn-out, pas a la liberte.'},
 {t:'normal',k:'La volonte a credit',title:'Batir ton entreprise sur la discipline est un piege.',body:'La volonte finit toujours par s’epuiser. Ton Ecologie Interieure, elle, est un carburant inepuisable : quand ton entreprise avance avec ta nature au lieu de contre elle, l’energie revient.'},
 {t:'dark',title:'Crier plus fort n’attire pas tes clients. Ca t’eteint a petit feu.'},

 {t:'section',idx:'Partie 2',title:'Le Moteur de Croissance Alignee™'},
 {t:'normal',k:'Pilier 1 · Ton alignement',title:'Une entreprise qui te ressemble vraiment.',body:'Tout part de la : reconnecter a qui tu es pour construire ton offre et ton marketing a 100 % alignes avec toi. C’est ce qui rend tout le reste leger plutot que force.'},
 {t:'normal',k:'Pilier 2 · Ton Offre Antidote™',title:'Une offre anti-douleur, pas une vitamine.',body:'La raison numero un pour laquelle un prospect dit je vais y penser : ton offre ressemble a une vitamine, agreable mais optionnelle. L’Offre Antidote repond a une douleur reelle, et elle se vend sans pression.'},
 {t:'normal',k:'Pilier 3 · Ton plan',title:'Savoir exactement quoi faire, et dans quel ordre.',body:'Fini de sauter d’une strategie a la mode a l’autre. Un plan simple et sequence, construit sur tes forces, remplace la dispersion par une direction claire.'},
 {t:'normal',k:'Pilier 4 · Ton systeme de vente',title:'Vendre sans te sentir comme un requin.',body:'Un systeme d’attraction naturel amene les bonnes personnes a toi et les guide jusqu’au oui, en respectant ton systeme nerveux. La vente devient une conversation, pas une chasse.'},
 {t:'dark',title:'Alignement, Offre Antidote, Plan, Systeme de vente. Le moteur complet.'},

 {t:'section',idx:'Partie 3',title:'Du magnetisme, pas de la chasse'},
 {t:'normal',k:'L’attraction alignee',title:'Attirer tes clients ideaux sans courir apres eux.',body:'Quand ton message vient de ton alignement, tes clients ideaux se reconnaissent et viennent. Tu arretes de te deguiser pour suivre les tendances et tu laisses le magnetisme faire le travail.'},
 {t:'normal',k:'Des revenus previsibles',title:'Savoir combien tu dois vendre chaque mois.',body:'Un moteur, c’est de la mecanique, pas de la chance. Tu sais ce qui entre, tu sais ce que ca produit, et les montagnes russes financieres laissent place a une stabilite que tu peux planifier.'},
 {t:'dark',title:'Arrete de planifier ta lutte. Commence a planifier ta fluidite.'},

 {t:'section',idx:'Ton prochain pas',title:'Batis ton Moteur avec moi'},
 {t:'normal',k:'Comment je peux t’aider',title:'L’accompagnement Moteur de Croissance Alignee™.',body:'Sur 7 mois, en groupe ou en VIP, on installe tes quatre piliers ensemble : ton alignement, ton Offre Antidote, ton plan et ton systeme de vente. Un accompagnement humain, pour une entreprise qui te ressemble.'},
 {t:'cta',title:'Prete a sortir des dents de scie ?',chips:['Regarde la masterclass','Reserve ton appel diagnostique'],disc:'Contenu educatif pour entrepreneurs, coachs et therapeutes. Educational content only. No income or business result is guaranteed. Results vary by person, situation and market.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="align-motif ${kind==='title'?'title-align':'corner-align'}"><use href="#align"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Moteur de Croissance <b>Alignee</b> · Daniel Desjardins</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.rise) h+=motif(s.rise);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
