<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brotherhood Is the Medicine - Sacred Sons Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1510;        /* deep warm charcoal-brown, from brand #222222/#3a3532 */
    --panel:#272019;     /* raised earthen panel */
    --rule:#3a3532;      /* warm dark brown hairline (brand.json 16 uses) */
    --accent:#b7932b;    /* ember gold - Sacred Sons accent (brand.json 36 uses) */
    --accent-soft:#caa84e;
    --ink:#ece4d7;       /* warm bone/parchment text */
    --muted:#a99c89;     /* dim earth */
    --serif:'Playfair Display',Georgia,serif;
    --sans:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .deck{width:min(960px,100%);}
  .slide{
    position:relative;background:linear-gradient(170deg,#1f1913 0%,#140f0b 100%);
    border:1px solid var(--rule);border-radius:14px;
    padding:60px 64px;margin:0 auto 26px;min-height:540px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  /* hearth / circle motif */
  .slide::after{
    content:"";position:absolute;right:-120px;top:50%;transform:translateY(-50%);
    width:360px;height:360px;border-radius:50%;
    border:1px solid rgba(183,147,43,.16);
    box-shadow:0 0 0 22px rgba(183,147,43,.05), inset 0 0 60px rgba(183,147,43,.06);
    pointer-events:none;
  }
  .slide::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,var(--accent),transparent);
  }
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.28em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:700;font-size:54px;line-height:1.05;letter-spacing:.3px;margin-bottom:18px}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;margin-bottom:20px}
  .lead{font-size:20px;line-height:1.55;color:var(--ink);max-width:40ch;font-weight:300}
  .sub{font-size:17px;line-height:1.6;color:var(--muted);max-width:46ch;font-weight:300;margin-top:8px}
  p.body{font-size:18px;line-height:1.6;color:var(--ink);max-width:44ch;font-weight:300;margin-top:6px}
  ul{list-style:none;margin-top:18px;max-width:46ch}
  ul li{position:relative;padding-left:26px;margin-bottom:14px;font-size:17px;line-height:1.5;color:var(--ink);font-weight:300}
  ul li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(183,147,43,.14)}
  ul li b{font-weight:600;color:var(--accent-soft)}
  .pillarnum{font-family:var(--serif);font-size:15px;color:var(--accent);letter-spacing:.2em;margin-bottom:10px}
  .title-meta{margin-top:30px;font-size:15px;color:var(--muted);letter-spacing:.12em;font-weight:400}
  .title-meta b{color:var(--ink);font-weight:500}
  .cta-steps{margin-top:22px}
  .cta-steps div{font-size:18px;color:var(--ink);margin-bottom:12px;font-weight:300}
  .cta-steps span{color:var(--accent);font-weight:600;margin-right:10px}
  .disclaimer{margin-top:30px;font-size:12px;line-height:1.5;color:#7d7261;max-width:52ch;font-weight:300}
  .foot{position:absolute;left:64px;bottom:26px;font-size:12px;color:#6f6456;letter-spacing:.18em;text-transform:uppercase}
  .count{position:absolute;right:30px;bottom:26px;font-size:12px;color:#6f6456;font-family:var(--serif)}
  @media(max-width:640px){.slide{padding:40px 28px;min-height:460px}h1{font-size:38px}h2{font-size:28px}.slide::after{display:none}.foot{left:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A Live Masterclass',h1:'Brotherhood Is the Medicine',lead:'Why the deepest growth a man can make is one he cannot make alone.',meta:'With <b>Adam Jackson</b> &middot; Sacred Sons &middot; Built on the Seven Pillars of Embodiment'},

 {t:'who',kicker:'Who This Is For',h2:'You did everything right. Something is still missing.',body:'You are capable. You provide. On paper the life works. And still there is a quiet distance, from your own fire, from the people closest to you, from the man you know you are underneath the role you play all day.'},

 {t:'trap',kicker:'The Trap',h2:'So you try to fix it the way you fix everything.',body:'Alone. A new routine. More discipline. Another book, another cold plunge, another self-optimization stack. It works for a week, and then the old distance comes back. The strategy that built your success is the one thing that cannot reach this.'},

 {t:'reframe',kicker:'The Reframe',h2:'You do not have a discipline problem. You have a witness problem.',body:'A man changes in front of other men, not in private. Growth that nobody sees does not hold. For most of human history this was obvious. We have simply forgotten the room where it happens.'},

 {t:'part',kicker:'Part One',h2:'The isolated man',body:'The modern man is more connected and more alone than any generation before him. He has followers and no brothers, mentors on a screen and no circle in the room. Information is everywhere. Initiation is nowhere.'},

 {t:'cost',kicker:'The Cost',h2:'What isolation quietly takes',bullets:[
   'The <b>body</b> armors over. Stress has nowhere to discharge, so it lives in the jaw, the shoulders, the sleep.',
   'The <b>relationship</b> flattens. You manage the people you love instead of meeting them.',
   'The <b>fire</b> dims. Purpose becomes performance, and performance becomes exhaustion.'
 ]},

 {t:'part',kicker:'Part Two',h2:'The Seven Pillars of Embodiment',body:'This is the path we walk men through, one pillar at a time, in the body and in a circle of other men. Not theory about masculinity. A practice of it.'},

 {t:'pillar',num:'Pillar One',h2:'Illumination',body:'The warrior who can hold a clean line. Learning to set a boundary without apology and without aggression, so your yes and your no both mean something again.'},
 {t:'pillar',num:'Pillar Two',h2:'Synthesis',body:'Creativity, ritual, and decisive action. Turning what you feel into what you build, so your inner life actually moves into the world instead of circling inside you.'},
 {t:'pillar',num:'Pillar Three',h2:'Inner Essence',body:'Reconnecting with the self underneath the performance. The man who was there before the roles, the titles, and the armor, and who is still waiting to be lived.'},
 {t:'pillar',num:'Pillar Four',h2:'Leadership',body:'Turning private purpose into community impact. Not leading because of a title, but because your presence makes the room safer and more honest.'},
 {t:'pillar',num:'Pillar Five',h2:'Acknowledgement',body:'Generative presence. The practice of truly seeing another man, and letting yourself be seen, which is the exact thing isolation trains us out of.'},
 {t:'pillar',num:'Pillar Six',h2:'Nourishment',body:'The capacity to receive. Most men only know how to give and to push. Here you learn the harder strength, to let support and vulnerability in without collapsing.'},
 {t:'pillar',num:'Pillar Seven',h2:'Devotion',body:'The grounding force that holds the whole practice together. What you are loyal to when no one is watching, and what you return to when the week knocks you off center.'},

 {t:'lived',kicker:'Part Three',h2:'The pillars are lived in a circle, not read in a chair',body:'Every pillar is practiced with other men, in movement, breath, and honest speech. That is the mechanism. The circle is what turns an insight into a change that is still there a year from now.'},

 {t:'why',kicker:'Why Sacred Sons',h2:'This is the work we have held with thousands of men',bullets:[
   'The largest modern men&rsquo;s work community in the world, built over years of in-person gatherings.',
   'Immersions, Leadership Training, and the Founder&rsquo;s Circle, a full path from first weekend to deep leadership.',
   'A brotherhood men travel across the world to stand inside, and keep returning to.'
 ]},

 {t:'path',kicker:'How To Begin',h2:'You do not have to leap. You have to walk in.',cta:[
   ['Start','Come to an Immersion. Two days, a city near you, open to any man.'],
   ['Deepen','Enter Leadership Training. Ten weeks on the Seven Pillars, then four days in person.'],
   ['Lead','Walk the path toward the Founder&rsquo;s Circle and lead a circle of your own.']
 ]},

 {t:'cta',kicker:'Your Next Step',h1:'Find your circle.',lead:'The man you are looking to become is not hiding in another book. He is waiting for a room of other men. Come stand in one.',steps:[
   ['&rarr;','Join the next Sacred Sons Immersion, or apply for Leadership Training, at sacredsons.com']
 ],disclaimer:'This masterclass is for educational and personal-development purposes only. Sacred Sons offers experiential men&rsquo;s work, not therapy, medical, or mental-health treatment, and makes no guarantee of any specific outcome. Your results depend on your own participation.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.num) h+=`<div class="pillarnum">${s.num}</div>`;
  if(s.h1) h+=`<h1>${s.h1}</h1>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.lead) h+=`<p class="lead">${s.lead}</p>`;
  if(s.body) h+=`<p class="body">${s.body}</p>`;
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+=`<li>${b}</li>`);h+='</ul>';}
  if(s.cta){h+='<div class="cta-steps">';s.cta.forEach(c=>h+=`<div><span>${c[0]}</span>${c[1]}</div>`);h+='</div>';}
  if(s.steps){h+='<div class="cta-steps">';s.steps.forEach(c=>h+=`<div><span>${c[0]}</span>${c[1]}</div>`);h+='</div>';}
  if(s.meta) h+=`<div class="title-meta">${s.meta}</div>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  h+=`<div class="foot">Sacred Sons</div><div class="count">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=h;deck.appendChild(el);
});
</script>
</body>
</html>
