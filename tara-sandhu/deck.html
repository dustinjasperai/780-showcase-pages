<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Right Turn — A Live Masterclass with Tara Sandhu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffcf3;        /* her cream body background */
    --panel:#fff8e9;     /* a hair deeper, same cream family */
    --ink:#2d3436;       /* her dominant slate text */
    --rule:#2d3436;
    --accent:#f23c74;    /* her link magenta */
    --muted:#6b6f70;
    --display:'Playfair Display',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 72px}
  .slide{
    background:var(--bg);
    border:1px solid rgba(45,52,54,.12);
    border-radius:14px;
    padding:56px 52px;
    margin:0 0 20px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide.alt{background:var(--panel)}
  .slide.turn{background:var(--ink);color:var(--bg)}
  .slide.turn .kick,.slide.turn .muted{color:rgba(255,252,243,.72)}
  .kick{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,62px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.4vw,40px);line-height:1.1;letter-spacing:-.01em}
  h3{font-family:var(--display);font-weight:600;font-size:22px;margin-bottom:6px}
  .lead{font-size:clamp(17px,2.3vw,22px);margin-top:20px;max-width:34ch}
  .turn .lead{max-width:40ch}
  p.body{font-size:17px;margin-top:14px;max-width:56ch;color:var(--ink)}
  .turn p.body{color:rgba(255,252,243,.9)}
  .num{font-family:var(--display);font-size:16px;color:var(--accent);font-weight:600}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  ul li{font-size:17px;padding-left:26px;position:relative;max-width:56ch}
  ul li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
  .mark{color:var(--accent);font-weight:600}
  .tag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:14px}
  .fw h2 .mark{display:block}
  .price-row{display:flex;flex-wrap:wrap;gap:16px;margin-top:26px}
  .price{flex:1 1 220px;border:1px solid rgba(45,52,54,.16);border-radius:12px;padding:20px 22px;background:var(--panel)}
  .price .amt{font-family:var(--display);font-size:30px;font-weight:700;color:var(--accent)}
  .price .lab{font-size:14px;color:var(--muted);margin-top:4px}
  .disc{font-size:12.5px;color:var(--muted);margin-top:28px;max-width:60ch;line-height:1.55}
  .foot{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:34px;font-weight:600}
</style>
</head>
<body>
<main id="deck" aria-label="The Right Turn masterclass deck"></main>
<script>
const S = [
  {t:'title', cls:'turn', kick:'A live masterclass with Tara Sandhu',
    h1:'The Right Turn',
    lead:'How women in corporate build a consulting business that pays in both freedom and income.' },

  {t:'who', tag:'Who this is for',
    h2:'You are good at what you do. You are also done.',
    body:'Senior in your field. Underused and over it. Quietly wondering whether consulting is the move, and whether you could actually pull it off.',
    bullets:['You have the expertise. You have had it for years.',
             'What you do not have is a path out that does not feel like a gamble.',
             'So you wait to feel ready. Ready never shows up on its own.'] },

  {t:'reframe', cls:'turn', tag:'The reframe',
    h2:'Consulting is not a leap. It is a turn.',
    body:'You do not have to quit and hope. You do not have to burn the boat. You make one clear turn, with a map, and you keep your footing the whole way.' },

  {t:'cost', alt:true, tag:'The cost of waiting',
    h2:'Another year in a role you have outgrown.',
    body:'The waiting is not free. It is a year of your rate going uncharged, your expertise going unsold, and someone with half your experience billing three times your hourly for the same advice.' },

  {t:'section', tag:'Part one',
    h2:'The real problem is not your skills.',
    body:'You have more than enough. The move stalls on three unanswered questions, and almost nobody answers them in the right order.',
    bullets:['Is consulting actually right for me and my life?',
             'What exactly do I sell, and for how much?',
             'How do I land the first client without begging?'] },

  {t:'point', tag:'Problem, up close',
    h2:'You undercharge because you are guessing.',
    body:'With no framework, you price off what feels safe, which is always too low. Low pricing does not just cost income. It tells good clients you are not the expert you are.' },

  {t:'point', alt:true, tag:'Problem, up close',
    h2:'You wait for permission that never comes.',
    body:'The first client feels like a wall. It is not. It is a short sequence of specific moves, and once you see them you stop waiting to be chosen and start choosing.' },

  {t:'section', cls:'turn', tag:'Part two',
    h2:'The Right Turn method',
    body:'Four moves, in order. Each one removes a reason you have been standing still.',
    bullets:['Decide, so you move with conviction, not hope.',
             'Position, so your expertise becomes a sellable offer.',
             'Price, so your number holds.',
             'First yes, so the business becomes real.'] },

  {t:'fw', tag:'Move one', h3:'Decide',
    h2:'Clarity before you build.',
    body:'The Foundations work: an honest read on whether consulting fits your life, your money goals, and the hours you actually want. We make the decision on purpose, so it stops renting space in your head.' },

  {t:'fw', alt:true, tag:'Move two', h3:'Position',
    h2:'From resume to offer.',
    body:'Your corporate expertise is not an offer yet. We turn it into one specific, named thing a buyer can say yes to, aimed at the people already looking for exactly that.' },

  {t:'fw', cls:'turn', tag:'Move three', h3:'The Pricing Power Framework',
    h2:'Price from value, not hours.',
    body:'The centerpiece. You stop pricing off your old salary math and start pricing off the outcome you create. A number you can say out loud, and hold, without flinching.' },

  {t:'point', tag:'Pricing, up close',
    h2:'The Pricing Power Playbook',
    body:'Anchor the number to the result. Justify it in the buyer’s language. Then hold it in the room when the pause comes. Pricing you can stand behind is a skill, and it is teachable.' },

  {t:'fw', alt:true, tag:'Move four', h3:'The First Yes Action Plan',
    h2:'Turn expertise into a signed engagement.',
    body:'The concrete steps from "I could do this" to a first paying client: who to talk to, what to say, and how to make the ask so the yes feels easy for both of you.' },

  {t:'section', tag:'Part three',
    h2:'What it looks like on the other side.',
    body:'Not a second job with a worse boss. A business that pays in money and in time, built to fit the life you are actually trying to have.' },

  {t:'point', cls:'turn', tag:'The model',
    h2:'A full calendar on fewer hours.',
    body:'The freedom-and-income model: a focused working week, premium pricing doing the heavy lifting, and real room left over. You replace the salary without replacing the hours.' },

  {t:'whyme', alt:true, tag:'Why me',
    h2:'I made this exact turn.',
    body:'I led risk and compliance at Stripe, Plaid, Gusto, and Mercury. Then I built Kinara Solutions, my own consulting business, to 2 million dollars in under two years on a 25-hour week. The Right Turn is the path I used, written down so you do not have to guess your way through it.' },

  {t:'recap', tag:'The whole turn',
    h2:'Four moves. One clear path.',
    bullets:['Decide with conviction.',
             'Position your expertise as an offer.',
             'Price it with the Pricing Power Framework.',
             'Land the first yes, and make it real.'] },

  {t:'cta', cls:'turn', kick:'Take your right turn',
    h1:'Ready to make the turn?',
    lead:'Start where you are. Every path leads to the same destination.',
    prices:[
      { amt:'$349', lab:'Execution Deep Dive · 7-module self-paced course' },
      { amt:'$4,750', lab:'Acceleration Intensive + Coaching · personalized guidance' }
    ],
    disc:'Educational content only. Results depend on your effort, experience, market, and many factors outside any program’s control. Nothing here is a promise or guarantee of income or specific results. Your outcomes will vary.',
    foot:'taketherightturn.com' }
];

const deck = document.getElementById('deck');
function esc(s){return s==null?'':s;}
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls?(' '+s.cls):'') + (s.alt?' alt':'') + (s.t==='fw'?' fw':'');
  let h = '';
  if(s.kick) h += '<div class="kick">'+esc(s.kick)+'</div>';
  if(s.tag) h += '<div class="tag">'+esc(s.tag)+'</div>';
  if(s.h3) h += '<h3>'+esc(s.h3)+'</h3>';
  if(s.h1) h += '<h1>'+esc(s.h1)+'</h1>';
  if(s.h2) h += '<h2>'+esc(s.h2)+'</h2>';
  if(s.lead) h += '<p class="lead">'+esc(s.lead)+'</p>';
  if(s.body) h += '<p class="body">'+esc(s.body)+'</p>';
  if(s.bullets){ h += '<ul>'; s.bullets.forEach(b=>{ h += '<li>'+esc(b)+'</li>'; }); h += '</ul>'; }
  if(s.prices){ h += '<div class="price-row">'; s.prices.forEach(p=>{ h += '<div class="price"><div class="amt">'+esc(p.amt)+'</div><div class="lab">'+esc(p.lab)+'</div></div>'; }); h += '</div>'; }
  if(s.disc) h += '<div class="disc">'+esc(s.disc)+'</div>';
  if(s.foot) h += '<div class="foot">'+esc(s.foot)+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
