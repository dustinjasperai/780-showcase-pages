<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>What Makes a Master Teacher · Hannah Teutscher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f3ec; --panel:#fcfbf6; --rule:#e3e0d5;
    --acc:#bdda00; --ink:#26282a; --body:#4a4c50; --dim:#8b8c83; --char:#24262a; --cream:#f6f5ef;
  }
  html,body{height:100%}
  body{background:#eceadf;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eceadf}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:2.6vh;display:flex;align-items:center;gap:.7vw}
  .kicker::before{content:'';width:1.7vw;height:3px;background:var(--acc);border-radius:2px;flex-shrink:0}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.11;letter-spacing:.002em}
  .hl{background:linear-gradient(180deg,transparent 58%,var(--acc) 58%,var(--acc) 92%,transparent 92%);padding:0 .1em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:75%;line-height:1.62;font-weight:400}
  .sub{font-family:'Playfair Display',serif;font-style:italic;font-size:2.0vw;color:var(--char);margin-top:3.4vh;max-width:84%;line-height:1.4;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.05vw;font-weight:700;color:var(--ink);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:.7vw}
  .t-section .idx::before{content:'';width:2.4vw;height:3px;background:var(--acc);border-radius:2px}
  .t-section h1{font-size:4.9vw;max-width:92%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh;border-radius:2px}
  .t-dark{background:var(--char);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream);font-style:italic;font-weight:500}
  .t-dark .accbar{width:9vw;height:4px;background:var(--acc);border-radius:3px;margin-bottom:4vh}
  .t-cta{background:var(--char);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Inter',sans-serif;color:#dcdbd2;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.6px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:600}
  .chip.solid{background:var(--acc);color:var(--char)}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.82vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .t-cta .disc{color:#a9a89e}
  .brandline{font-family:'Inter',sans-serif;font-size:1.12vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.04em}
  .brandline b{color:var(--ink);font-weight:700}
  .vf-motif{position:absolute;pointer-events:none;right:7.2%;bottom:8%;width:15vw;opacity:.95}
  .corner-vf{right:6.5%;bottom:7.5%;width:7vw;opacity:.6}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(38,40,42,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Performance Fit Pilates · Hannah Teutscher</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a studio barre, one horizontal rail with three marked positions, drawn in lime -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 130 90">
  <g fill="none" stroke="#bdda00" stroke-width="3" stroke-linecap="round">
    <line x1="14" y1="40" x2="116" y2="40"/>
    <line x1="26" y1="40" x2="26" y2="74"/>
    <line x1="104" y1="40" x2="104" y2="74"/>
  </g>
  <g fill="#26282a">
    <circle cx="40" cy="40" r="4.4"/><circle cx="65" cy="40" r="4.4"/><circle cx="90" cy="40" r="4.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'What Makes a <span class="hl">Master</span> Teacher',sub:'The art and the science of teaching movement, so the room actually changes, not just moves.',brand:true,vf:true},
 {t:'normal',k:'Who this is for',title:'You know the exercises. Teaching them so people change is a different skill.',body:'You are a Pilates, Barre or movement teacher, and you know the repertoire cold. But there is a gap between running a class and teaching one. The best teachers are not the ones who know the most exercises. They are the ones whose rooms feel different, and that is a craft you can actually learn.'},
 {t:'dark',title:'Anyone can call the moves. A master teacher changes what happens in the room.'},

 {t:'section',idx:'Part One',title:'The Part Training Leaves Out'},
 {t:'normal',k:'The gap nobody names',title:'Most teacher trainings hand you the repertoire and skip the teaching.',body:'You leave certified in the exercises and the anatomy, then stand in front of a real room and realise nobody taught you the actual job: reading people, choosing your words, holding attention, building trust. That is not a personality you are born with. It is a craft, and it can be taught.'},
 {t:'normal',k:'Where new teachers freeze',title:'When the room does not follow, we reach for more cues instead of better ones.',body:'The instinct is to add: more corrections, more words, more exercises. But a room that is not with you does not need more information. It needs a teacher who can feel what is happening and adjust. When I started teaching I felt underprepared and overwhelmed, and no amount of extra repertoire fixed it. Learning to teach did.'},
 {t:'dark',title:'The exercises were never the hard part. Teaching them is.'},

 {t:'section',idx:'Part Two',title:'How a Master Teacher Actually Teaches'},
 {t:'normal',k:'One · Teach the person, not the plan',title:'The plan is a starting point. The person in front of you is the class.',body:'A master teacher walks in with a plan and then reads the room: who is tired, who is guarding an old injury, who checked out three cues ago. Then they teach who is actually there. The plan serves the person. When you teach the room in front of you instead of the routine on your card, people feel seen, and a seen room trusts you.'},
 {t:'normal',k:'Two · Cue from both sources',title:'The art and the science are two halves of one cue.',body:'I came to Pilates from a professional dance career, so I teach movement from both sources at once. The art is grace, posture and musicality: how a movement should feel and look. The science is what the body is actually doing underneath. A cue that carries both, the feeling and the mechanism, is the one that finally lands, where ten technical corrections did not.'},
 {t:'normal',k:'Three · Build the room before you correct',title:'People take a correction from a teacher they already trust, and almost no one else.',body:'A powerful learning environment comes before any technical fix. If the room trusts you, one small cue changes everything. If it does not, the most accurate correction in the world bounces off. Master teachers earn that trust first, on purpose, and only then start refining. Get the order wrong and you spend the whole class pushing.'},
 {t:'dark',title:'Read the person. Cue from both sources. Build the room first. That order is the craft.'},

 {t:'section',idx:'Part Three',title:'The Room That Actually Changes'},
 {t:'normal',k:'What this changes',title:'The same hour, taught with the craft, becomes a class people reorganise their week around.',body:'Nothing about your repertoire has to change. What changes is how you run it: you read the room, you cue from both sources, you teach who is there. Students feel the difference even when they cannot name it, they come back, they bring friends, and teaching stops feeling like a performance you have to survive.'},
 {t:'dark',title:'Let yourself be a student again. It is the one habit every master teacher keeps.'},
 {t:'normal',k:'Why Hannah',title:'Two decades on both sides of the studio, from the stage to the teacher chair.',body:'I am Hannah Teutscher, founder of Performance Fit Pilates in Nuremberg. I trained and performed as a professional ballet dancer before spending 20 years teaching dance, Pilates, Yoga and Barre. I built Train the Trainers and the Pilates Exchange podcast because the art and the business of teaching are exactly what my own training left out, and they are what I now help other teachers master.'},

 {t:'section',idx:'Your Next Step',title:'Keep Learning the Craft'},
 {t:'normal',k:'Where teachers go from here',title:'Train the Trainers is the ongoing room where this craft gets built, with feedback.',body:'The masterclass is the map. Train the Trainers is where you walk it: real feedback on your own teaching, live calls, a vault of workbooks and outlines, and Coaches Corner, a community of teachers working on the same craft. It is the mentorship I wish I had in my first year, so you do not have to teach your way out of the gap alone.'},
 {t:'cta',title:'Ready to teach like a master?',body:'Join the free live masterclass, then keep going inside Train the Trainers.',chips:['Join the free live masterclass','Apply to Train the Trainers'],disc:'Educational content for movement teachers. No teaching, enrollment or income result is guaranteed. Results vary by teacher, studio, and effort.'},
];

const deck=document.getElementById('deck');
function vf(){return `<svg class="vf-motif"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='dark') h+=`<div class="accbar"></div>`;
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Performance Fit Pilates · <b>Hannah Teutscher</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map((c,ci)=>`<div class="chip${ci?' solid':''}">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
