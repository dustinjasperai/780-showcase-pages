<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Foam-Free Bloom Method | Lily Roden Floral Education</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2;      /* warm ivory ground, from her light studio scheme */
    --panel:#f1eae0;   /* soft sand panel */
    --rule:#575757;    /* charcoal ink, her dominant brand hex */
    --ink:#575757;
    --muted:#8a827a;
    --accent:#b98a6d;  /* deepened terracotta-taupe, from her #d4c4b7 */
    --serif:'EB Garamond',Georgia,serif;
    --sans:'Nunito Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  #deck{max-width:960px;margin:0 auto;padding:28px 18px 60px}
  .slide{background:var(--bg);border:1px solid #e6ddd0;border-radius:14px;padding:56px 54px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--panel);opacity:.55;z-index:0}
  .slide > *{position:relative;z-index:1}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:600;font-size:52px;line-height:1.08;letter-spacing:.3px}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.14;margin-bottom:14px}
  .sub{font-family:var(--serif);font-style:italic;font-size:23px;color:var(--muted);margin-top:18px}
  p.body{font-size:18px;margin-top:14px;max-width:62ch}
  ul{margin:16px 0 0 2px;list-style:none}
  li{font-size:18px;padding:9px 0 9px 26px;position:relative;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:17px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pillar{font-family:var(--serif);font-weight:600;font-size:22px;color:var(--ink)}
  .num{font-family:var(--serif);font-size:15px;color:var(--accent);font-weight:600;letter-spacing:.08em;margin-bottom:10px}
  .rule{height:2px;width:64px;background:var(--accent);margin:22px 0 0}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;max-width:66ch;line-height:1.5}
  .cta-step{font-family:var(--serif);font-size:24px;margin-top:10px}
  footer.mark{font-family:var(--serif);font-size:14px;color:var(--muted);margin-top:30px;letter-spacing:.04em}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass for florists',h:'The Foam-Free Bloom Method',sub:'How to build lush, movement-filled florals without foam, and charge what they are worth.'},
  {t:'promise',eyebrow:'In the next hour',h:'What you will walk away with',body:'A clear picture of how a bouncy, bloom-forward bouquet and a foam-free compote are actually built so they hold their shape, and how I price that work so the studio keeps its margin. No fluff, just the method I use every week.'},
  {t:'audience',h:'If this is you, you are in the right room',body:'You love the airy, garden-style look. You want bloom-forward, bouncy arrangements that feel alive. But your hand-tied bouquets flatten by the reception, your installations lean on foam, and you quietly suspect you are charging too little for the hours you put in.'},
  {t:'notfor',eyebrow:'An honest note',h:'This is not a shortcut',body:'If you want a hack that skips the craft, this will frustrate you. This is for florists who want to understand why a design holds, so they can repeat it on any stem, in any season, at any scale.'},
  {t:'trap',eyebrow:'The moment every florist knows',h:'It looked perfect in the studio',body:'You build something gorgeous, photograph it, deliver it. By the reception the blooms have slumped, the greens have swallowed the flowers, and it reads flat in every photo the couple keeps forever. You blame the heat, the flowers, the drive. It was none of those.'},
  {t:'reframe',eyebrow:'The hard truth',h:'Foam feels like control. It is quietly costing you.',body:'Foam flattens movement, dates the look, and trains clients to expect cheap, generic flowers. The designers whose work looks effortless are not using more foam. They are using better mechanics. Structure is a skill, not a brick of green.'},
  {t:'part',num:'Part One',h:'The real problem is mechanics, not flowers',body:'Most florists were taught to build around foam. So when the foam goes, the whole arrangement goes with it. The fix is not more product. It is learning how movement, weight, and water actually hold a design together.'},
  {t:'myth',eyebrow:'What foam hides',h:'Three habits foam lets you skip',body:'Foam lets you avoid the three things that actually make a design last and sell.',bul:['How weight and balance hold a shape without a brick','How water mechanics keep blooms fresh past the ceremony','How negative space lets each flower breathe and read']},
  {t:'part',num:'Part Two',h:'The method, in four pillars',body:'This is the system I teach, pulled straight from the way I build in my own studio.'},
  {t:'framework',num:'Pillar One',pillar:'Foam-Free Mechanics',body:'Two practical ways to build an intentional, movement-filled, sturdy bouquet, plus foam-free compotes, runners, and large-scale installation that hold their shape all day. Structure from technique, not foam.'},
  {t:'framework',num:'Pillar Two',pillar:'Bloom-Focused Design',body:'Bloom-heavy, minimal-greens, bouncy and airy. How to let the flowers lead so the work reads as lush and garden-grown instead of filled-in and flat.'},
  {t:'framework',num:'Pillar Three',pillar:'Color Blending & Stem Processing',body:'Palettes that read across a room, and the stem processing that makes them last past the ceremony. The unglamorous craft that separates a pro from a hobbyist.'},
  {t:'framework',num:'Pillar Four',pillar:'Pricing & the Profitable Studio',body:'Recipes and proposals that protect your margin, so the beautiful work you just learned to build actually pays you. Design and business are the same lesson.'},
  {t:'part',num:'Part Three',h:'When the mechanics finally hold',body:'A bouquet that moves and holds. A compote with real dimension and no foam. An arch that reads as a garden, not a frame. The work looks the same at the reception as it did in your studio.'},
  {t:'shift',eyebrow:'What changes for your clients',h:'They feel the difference before they can name it',body:'Garden-grown movement photographs differently. Couples stop comparing you on price and start booking you for the look only you make. That is how a studio raises its rates without an argument.'},
  {t:'why',eyebrow:'Why learn this from me',h:'I built this in my own studio, petal by petal',body:'I am Lily Roden. I came to flowers as a way to breathe during a hard season, and built a Southern California wedding studio around one belief: there is purpose in every petal. This is the exact method I use and teach, and it is what I teach florists through my courses, recipe books, and The Floral Club.'},
  {t:'purpose',eyebrow:'The purpose behind it',h:'Every petal gives back',body:'A portion of everything this studio earns supports the education of children in my birth country, El Salvador. When florists learn this method and grow, that mission grows with them. That is why I teach it openly.'},
  {t:'recap',eyebrow:'The method, in one view',h:'Four pillars, one result',body:'Put together, they are how you build work that holds and sells.',bul:['Foam-Free Mechanics, for structure that lasts','Bloom-Focused Design, for the garden-grown look','Color Blending & Stem Processing, for longevity','Pricing & the Profitable Studio, for the margin']},
  {t:'cta',eyebrow:'Your next step',h:'Come build with me',step:'Start with the Bloom-Focused Bundle, or join us in person at The Floral Club. Either way, you leave with a method you can build and price with confidence.',disc:'Educational content only. Floral design and pricing outcomes depend on your market, effort, and execution; no specific income or business result is promised or guaranteed. Results vary.'}
];
const deck=document.getElementById('deck');
for(const s of S){
  const el=document.createElement('section');el.className='slide';
  let html='';
  if(s.eyebrow)html+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num)html+=`<div class="num">${s.num}</div>`;
  if(s.h)html+= (s.t==='title')?`<h1>${s.h}</h1>`:`<h2>${s.h}</h2>`;
  if(s.pillar)html+=`<div class="pillar">${s.pillar}</div>`;
  if(s.sub)html+=`<div class="sub">${s.sub}</div>`;
  if(s.body)html+=`<p class="body">${s.body}</p>`;
  if(s.bul){html+='<ul>';for(const b of s.bul)html+=`<li>${b}</li>`;html+='</ul>';}
  if(s.step)html+=`<div class="cta-step">${s.step}</div>`;
  if(s.t==='framework'||s.t==='title')html+=`<div class="rule"></div>`;
  if(s.disc)html+=`<div class="disclaimer">${s.disc}</div>`;
  if(s.t==='cta')html+=`<footer class="mark">Lily Roden Floral Education</footer>`;
  el.innerHTML=html;deck.appendChild(el);
}
</script>
</body>
</html>
