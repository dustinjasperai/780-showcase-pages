<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profit Killers Masterclass · Kelly Smith, Projected Growth Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#201D1A; --panel:#2A2620; --rule:#463F35;
    --gold:#B08D3D; --emerald:#3E8368; --chalk:#FAF7F0; --grey:#CBC4B8; --dim:#8A8276;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Public Sans',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:2.4vh}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.4vw}
  .t-normal h1{font-size:3.1vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Public Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--emerald);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#2E2A23 0%,#0E0C0A 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:86%;font-style:italic;color:#F2ECDD}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:2.7vw;text-align:center;margin-bottom:4.2vh}
  .flowrow{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
  .flowcard{background:var(--panel);border:1px solid var(--rule);border-radius:.7vw;padding:2.2vh 1.2vw;width:15.4vw;min-height:13vh;display:flex;flex-direction:column;gap:1vh}
  .flowcard .n{font-family:'Public Sans',sans-serif;font-size:1.7vw;font-weight:700;color:var(--gold);line-height:1}
  .flowcard .l{font-size:1.08vw;font-weight:600;color:var(--chalk);line-height:1.28}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#33291F 0%,#0F0D0A 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--gold);color:#E8D9AE;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .steps-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-steps{right:7%;bottom:10%;width:15vw}
  .corner-steps{right:6%;bottom:8%;width:7.5vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--gold);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.6vw}.t-flow h1{font-size:4.6vw}
    .flowcard{width:27vw}.flowcard .n{font-size:3.8vw}.flowcard .l{font-size:2.2vw}.t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 23</div>
<div class="brand-foot">Projected Growth Consulting</div>
<div class="hint" id="hint">→ click or arrow keys</div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="steps" viewBox="0 0 260 110">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M20 96 H80 V66 H140 V38 H200 V14" stroke="#B08D3D" opacity="0.85"/>
    <circle cx="200" cy="14" r="6" fill="none" stroke="#B08D3D" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Profit Killers Masterclass',sub:'The revenue leaks quietly draining plastic surgery and medical spa practices, and the KPI-first system to find and fix them.',brand:true,motif:'title'},
 {t:'normal',k:'Who this is for',title:'Practice owners growing by instinct, not by measurement.',body:'Plastic surgery and medical spa owners who have added staff, run more promotions, and spent more on marketing, and still can’t point to the one number that explains this month’s revenue.'},
 {t:'normal',k:'What you’ll walk away with',title:'The diagnostic lens behind two decades of practice turnarounds.',body:'Where profit typically hides in an elective practice, in one sitting: the categories, why they get missed, and the baseline number to start tracking first.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'Every practice is different, and results depend on execution. What matters is finding the version of this diagnosis that fits your practice.',disc:'Educational content. Nothing here is a promise of income, growth percentage, or business results. Results vary by practice.'},
 {t:'normal',k:'Who’s teaching this',title:'Kelly Smith. 20+ years in the cosmetic and aesthetic industry.',body:'Founder and CEO of Projected Growth Consulting, working with elective medical practices since 2011. Author of Top 10 Profit Killers for Plastic Surgeons and Medical Spas.'},

 {t:'section',idx:'Part One',title:'Where the Profit Hides'},
 {t:'normal',k:'The daily version',title:'Revenue grows for a while. Then it plateaus, and nobody can say exactly why.',body:'More staff gets hired. More promotions get run. More gets spent on marketing. The plateau usually isn’t a single crisis, it’s several small leaks running at once.'},
 {t:'normal',k:'What you already tried',title:'More spend, more promotions, more hours on the calendar.',body:'Tactics fail here because they add activity, and activity was never the same thing as a measured system.'},
 {t:'dark',title:'You don’t have a marketing problem. You have a measurement problem.'},
 {t:'flow',k:'The categories',title:'Where the profit hides, named',items:[
   {n:'01',l:'Team Sales Performance'},{n:'02',l:'Website Conversion'},{n:'03',l:'Marketing & Payroll Spend'},
   {n:'04',l:'Sales Event Execution'},{n:'05',l:'Staff Training'},{n:'06',l:'Social Media Marketing'}]},
 {t:'normal',k:'Why they get missed',title:'Each leak looks small on its own. Together, they explain the plateau.',body:'A practice can be busy, fully booked, and still leaking profit in three or four of these categories at once, because nobody is tracking any of them against a number.'},

 {t:'section',idx:'Part Two',title:'The KPI Baseline'},
 {t:'normal',k:'The reframe',title:'You can’t fix a leak you haven’t measured.',body:'The 7-Figure All-In-One KPI Tracking Tool exists for one reason: most elective practices track top-line revenue and nothing underneath it.'},
 {t:'dark',title:'The number you start watching changes the decisions you make.'},
 {t:'normal',k:'What changes first',title:'A baseline gets set before a new tactic gets added.',body:'Once the baseline exists, the same team and the same calendar start producing a different month, without a single new hire.'},

 {t:'section',idx:'Part Three',title:'The 90-Day Accelerator'},
 {t:'normal',k:'The structure',title:'Weekly coaching, aimed at the categories that actually move revenue.',body:'The MedSpa Growth Accelerator runs weekly live coaching directly on lead conversion, sales structures, membership programs, and social-media systems, once the baseline is set.'},
 {t:'normal',k:'The aim',title:'Kelly Smith’s programs are built around a 30% growth target in 90 days.',body:'Stated as her program’s aim, not a guarantee. The categories and the baseline come first; the target follows from fixing what the baseline finds.',disc:'Educational content. Individual results vary and are not guaranteed.'},
 {t:'dark',title:'Every practice that fixed a leak started as a practice that finally measured it.'},
 {t:'normal',k:'Who’s done this before',title:'6,000+ elective medical practices since 2011.',body:'Medical spas, plastic surgeons, dermatologists, and wellness centers. Kelly Smith’s own published figures cite $250 million in additional revenue created across that client base, and an average sales event of $62,000.',disc:'Figures are Kelly Smith’s own published claims about her client base, not a projection for any individual practice.'},

 {t:'section',idx:'Where to go next',title:'Two Paths From Here'},
 {t:'normal',k:'Diagnose or accelerate',title:'The free KPI Tool, or the MedSpa Growth Accelerator, depending on where you are.',body:'The KPI Tool sets your own baseline first. The Accelerator runs the full 90-day structure with weekly live coaching once you’re ready to move on what the baseline finds.'},
 {t:'cta',title:'Find the leak. Then fix it.',chips:['Book Free Success Call'],disc:'Educational content only. No income, growth percentage, or business result is guaranteed. Results vary by practice.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="steps-motif ${kind==='title'?'title-steps':'corner-steps'}"><use href="#steps"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Kelly Smith · <b>Projected Growth Consulting</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
