<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Obvious Choice · Ryan Spanger, The Business of Video Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#182338; --panel:#223052; --rule:#3a4a6b;
    --acc:#789fbd; --ink:#f2f5fa; --body:#c3cddd; --dim:#8793a8; --cream:#eef3f9;
  }
  html,body{height:100%}
  body{background:#0f1626;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1626}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Jost',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Jost',sans-serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.004em}
  .t-title h1{font-size:5.0vw;max-width:94%;font-weight:700}
  .t-normal h1{font-size:3.0vw;max-width:90%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.35vw;color:var(--body);margin-top:3.0vh;max-width:78%;line-height:1.64;font-weight:400}
  .sub{font-family:'Jost',sans-serif;font-style:italic;font-size:1.85vw;color:var(--acc);margin-top:3.6vh;max-width:86%;line-height:1.44;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Jost',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#223052 0%,#111a2b 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:88%;color:var(--cream);font-weight:500}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#223052 0%,#111a2b 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Inter',sans-serif;color:#dbe4ee;font-size:1.35vw;margin-top:3vh;max-width:74%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.84vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .gr-motif{position:absolute;pointer-events:none}
  .title-gr{right:7.2%;bottom:8.5%;width:17vw;opacity:.9}
  .corner-gr{right:6.5%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-family:'Inter',sans-serif;font-size:1.1vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.04em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.8vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">The Business of Video Production</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: two viewfinder corner brackets framing a single focus dot, drawn in the accent. his world (the frame, the lens), one focal point per slide -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gr" viewBox="0 0 120 120">
  <g fill="none" stroke="#789fbd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 40 V24 H38" opacity="0.9"/>
    <path d="M98 40 V24 H82" opacity="0.9"/>
    <path d="M22 80 V96 H38" opacity="0.9"/>
    <path d="M98 80 V96 H82" opacity="0.9"/>
    <circle cx="60" cy="60" r="4.2" fill="#789fbd" stroke="none"/>
    <circle cx="60" cy="60" r="12" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Obvious Choice',sub:'How video production company owners win better clients without competing on price, so you choose the work instead of chasing the lowest quote.',brand:true,gr:'title'},
 {t:'normal',k:'Who this is for',title:'You make excellent video. Somehow the conversation still comes back to price.',body:'You run a real production company. The work is strong and your clients are happy. But too many new leads open with what is your day rate, and every project turns into a quote against three other shops. Winning by being the cheapest was never the plan.'},
 {t:'dark',title:'Being the best on the shoot does not matter if the client only ever compares you on price.'},

 {t:'section',idx:'Part One',title:'Why Good Producers Get Compared on Price'},
 {t:'normal',k:'The commodity trap',title:'When you sell video, you sound like every other vendor, so the buyer sorts on the one thing that looks different: the number.',body:'If your pitch is about your gear, your crew, and your storytelling, you have described what every other production company also says. With nothing else to weigh, the buyer falls back on price. The problem is not your work. It is that nothing tells them why you are the obvious choice.'},
 {t:'normal',k:'They already decided to buy',title:'By the time they reach you, they are not deciding whether to use video. They are choosing who.',body:'A prospect researching production companies has already sold themselves on video. Spending the call convincing them that video works wastes the one thing that actually wins the job: showing you understand the business result they are really buying.'},
 {t:'dark',title:'You cannot out-shoot a positioning problem. Better footage will not fix why they compare you on price.'},

 {t:'section',idx:'Part Two',title:'How to Become the Obvious Choice'},
 {t:'normal',k:'Move one, give them what they want',title:'Lead with the business result they are buying, not with your craft.',body:'Most clients are not searching for a storyteller. They are trying to train staff, launch a product, or win trust. When you open with the outcome they care about and show you can get them there, you stop sounding like a vendor and start sounding like the answer. Craft becomes the proof, not the pitch.'},
 {t:'normal',k:'Move two, win the vendor comparison',title:'Give the buyer a reason to pick you that has nothing to do with your rate.',body:'Since they have already chosen video, your job is to be the clear, safe, obvious choice among the options in front of them. That comes from understanding their world, asking sharper questions than anyone else on their list, and making the decision feel easy. Price stops being the tiebreaker because you were never the same as the others.'},
 {t:'normal',k:'Move three, deliver like fine dining',title:'Treat delivery like a great restaurant, where every detail is the reputation.',body:'One over-salted dish can sink a restaurant no matter how good the kitchen is. Delivery works the same way. Anticipate what the client will need, sweat the small things, and make the whole process feel effortless for them. That is what turns a single project into repeat work and referrals, the clients you never have to compete for.'},
 {t:'dark',title:'Win better clients on positioning, keep them on delivery, and the price conversation quietly disappears.'},

 {t:'section',idx:'Part Three',title:'When You Are the Obvious Choice'},
 {t:'normal',k:'The producer this builds',title:'Better briefs, higher rates, and clients who come back without a beauty parade.',body:'When you are the obvious choice, the leads that reach you already want you, not three quotes. You set the rate to the value you deliver instead of the going market floor. And because delivery is dialled in, the best clients stay and send you others just like them.'},
 {t:'dark',title:'The goal was never to be the cheapest bid. It was to be the one they actually want.'},
 {t:'normal',k:'Why Ryan Spanger',title:'Twenty years building a production company that brands like BMW and IBM chose, now taught to owners like you.',body:'Ryan founded Dream Engine in 2002 and has produced video for BMW, IBM, and Moet et Chandon alongside universities, government, and healthcare. He shares what actually works on The Business of Video Production Podcast and mentors video production company owners around the world. This masterclass is that experience, distilled.'},

 {t:'section',idx:'Your Next Step',title:'Become the Obvious Choice'},
 {t:'normal',k:'Keep going with Ryan',title:'The full path from competing on price to being the clear first choice.',body:'Start with the free Business of Video Production Framework, Ryan’s ten step map for the business behind the camera. Then work with Ryan directly in his mastermind for video production company owners, where you put the positioning, the client work, and the delivery systems in place with him beside you.'},
 {t:'cta',title:'Ready to stop competing on price?',body:'Take the next step with Ryan Spanger and The Business of Video Production.',chips:['Download the free Framework','Join the video production mastermind'],disc:'Educational content for video production company owners. No specific income, client, or revenue result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function gr(kind){return `<svg class="gr-motif ${kind==='title'?'title-gr':'corner-gr'}"><use href="#gr"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Business of Video <b>Production</b> · Ryan Spanger</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.gr) h+=gr(s.gr);
  else if(s.t==='title') h+=gr('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
