<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing Power - a live masterclass with Ryan Koral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2ea;        /* Studio Sherpas body ground (brand.json) */
    --panel:#efe6d6;     /* Studio Sherpas footer tan */
    --ink:#1c1b17;       /* Studio Sherpas heading near-black */
    --slate:#404655;     /* Studio Sherpas body text */
    --accent:#f15b46;    /* Studio Sherpas button coral */
    --deep:#c7442f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:24px 18px 64px}
  .slide{background:var(--bg);border:1px solid rgba(28,27,23,.12);border-radius:14px;
    padding:52px 46px;margin:18px 0;min-height:320px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(28,27,23,.04)}
  .slide.title{background:var(--ink);color:var(--bg);min-height:440px}
  .slide.section{background:var(--accent);color:#fff}
  .slide.cta{background:var(--panel)}
  .kick{font-family:'Montserrat';font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  .slide.title .kick,.slide.section .kick{color:rgba(255,255,255,.85)}
  h1{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(40px,7vw,76px);
    line-height:1.02;letter-spacing:.01em;text-transform:uppercase}
  h2{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(30px,5vw,52px);
    line-height:1.06;text-transform:uppercase}
  .lead{font-size:clamp(17px,2.2vw,22px);color:var(--slate);margin-top:18px;max-width:46ch}
  .slide.title .lead,.slide.section .lead{color:rgba(255,255,255,.92)}
  .big{font-size:clamp(22px,3vw,30px);font-weight:600;margin-top:16px;max-width:40ch}
  ul{margin:22px 0 0 0;list-style:none}
  li{position:relative;padding:12px 0 12px 34px;font-size:clamp(16px,2vw,20px);
    border-top:1px solid rgba(28,27,23,.1)}
  li:before{content:"";position:absolute;left:0;top:19px;width:16px;height:4px;
    background:var(--accent);border-radius:2px}
  .num{font-family:'Anton';color:var(--accent);font-size:22px;margin-bottom:6px}
  .foot{font-size:12px;color:var(--slate);margin-top:26px;letter-spacing:.04em}
  .disc{font-size:12px;color:var(--slate);margin-top:22px;max-width:60ch;line-height:1.5}
  .brandrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* The masterclass, already built. Ryan Koral teaching his own audience. */
const S = [
  {t:'title', kick:'A live masterclass with Ryan Koral',
    h:'Pricing Power',
    lead:'How video business owners charge what they are worth and keep more of it. Live, free, no gear talk.'},
  {t:'who', kick:'Who this is for',
    h:'The busy, under-paid studio',
    lead:'You can shoot. Your clients are happy. But the calendar is full and the bank account still does not add up.'},
  {t:'point', kick:'The trap',
    h:'More clients is the wrong fix',
    big:'When money is tight the reflex is to take more work at the same price. That is how a good videographer stays busy and broke for years.'},
  {t:'point', kick:'The reframe',
    h:'You do not have a volume problem',
    big:'You have a pricing problem. And pricing is a positioning problem, not a number you pick.'},
  {t:'section', kick:'Part one', h:'The core problem'},
  {t:'point', kick:'Vendor vs strategist',
    h:'Same shoot, two prices',
    big:'A vendor quotes a day rate and competes on price. A strategist scopes the outcome and is worth investing in. The footage is identical. The invoice is not.'},
  {t:'point', kick:'Why it never ends',
    h:'The feast-or-famine treadmill',
    big:'Booked solid, then two dead months, then panic discounting to fill the gap. Volume keeps the treadmill spinning. Positioning steps you off it.'},
  {t:'section', kick:'Part two', h:'The Pricing Power method'},
  {t:'framework', kick:'The four pillars',
    h:'What we actually change',
    items:['Pricing Power: price the outcome, not the day',
           'Make more, keep more: protect the margin',
           'Off the treadmill: a steady client rhythm',
           'Owner, not operator: build the systems']},
  {t:'pillar', num:'01', kick:'Pillar one', h:'Pricing Power',
    big:'Reframe from vendor to strategist. A paid discovery or strategy session becomes the front door, so the client is already investing before a camera comes out.'},
  {t:'pillar', num:'02', kick:'Pillar two', h:'Make more, keep more',
    big:'Raise the price without losing the client, then cut the work that quietly kills your margin. Profit is what you keep, not what you bill.'},
  {t:'pillar', num:'03', kick:'Pillar three', h:'Off the treadmill',
    big:'A consistent, non-salesy way to stay in front of the right buyers so the next project is lined up before the current one wraps. Fewer, better-priced clients.'},
  {t:'pillar', num:'04', kick:'Pillar four', h:'Owner, not operator',
    big:'Systems and delegation so the business runs without you being the bottleneck, and supports your life instead of consuming it.'},
  {t:'section', kick:'Part three', h:'The profitable studio'},
  {t:'point', kick:'The profitable month',
    h:'Fewer days, more profit',
    big:'A month with a handful of premium projects and real time off beats a month jammed with low-dollar work. The goal is profit per project, not projects per month.'},
  {t:'point', kick:'The first move',
    h:'Start with one discovery call',
    big:'Before you touch your rate card, put a paid discovery step in front of your next proposal and watch how the conversation changes.'},
  {t:'why', kick:'Why listen to me', h:'Ryan Koral',
    items:['20+ years running Tell Studios, a seven-figure production company',
           'Host of the Grow Your Video Business podcast, 500+ episodes, 1M+ downloads',
           'I coach video business owners inside the Studio Sherpas Mastermind'],
    lead:'I am a few steps up the trail, turning around to hand you the shortcuts.'},
  {t:'cta', kick:'Your next step', h:'Find your Pricing Power',
    big:'Take the free Pricing Power Quiz at studiosherpas.com, then come find me in the Studio Sherpas Mastermind when you are ready to scale.',
    disc:'This masterclass is educational. It is not financial advice and no specific income or result is promised or guaranteed. Results vary by business, market, and effort.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let html = '';
  if (s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if (s.num) html += '<div class="num">'+s.num+'</div>';
  if (s.t === 'title' || s.t === 'section') html += '<h1>'+s.h+'</h1>';
  else html += '<h2>'+s.h+'</h2>';
  if (s.big) html += '<p class="big">'+s.big+'</p>';
  if (s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if (s.items){ html += '<ul>'; for (const it of s.items) html += '<li>'+it+'</li>'; html += '</ul>'; }
  if (s.t === 'why') html += '<div class="brandrow">Studio Sherpas</div>';
  if (s.disc) html += '<p class="disc">'+s.disc+'</p>';
  if (s.t === 'cta') html += '<div class="foot">studiosherpas.com</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
