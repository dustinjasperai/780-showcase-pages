<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The New Midwifery | A Masterclass with Margo Blackstone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1a1216;       /* deep plum-charcoal, from their #262626 warmed to the magenta */
    --panel:#241a20;    /* raised panel */
    --rule:#3a2b32;     /* hairline */
    --ink:#f3ece9;      /* warm off-white */
    --ink-soft:#cdbfc4; /* muted */
    --accent:#9e1d53;   /* their exact logo magenta */
    --gold:#dc9e53;     /* their exact secondary */
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:8vmin 11vmin;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  /* candlelight glow */
  .slide::before{content:'';position:absolute;top:-18%;right:-8%;width:60vmin;height:60vmin;
    background:radial-gradient(circle,rgba(220,158,83,.16),transparent 62%);pointer-events:none;z-index:0}
  /* spiral / path rule */
  .spine{position:absolute;left:11vmin;top:8vmin;bottom:8vmin;width:2px;
    background:linear-gradient(var(--accent),rgba(158,29,83,0));opacity:.6}
  .inner{position:relative;z-index:1;max-width:1040px}
  .kicker{font-size:1.05rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:2.4vmin}
  h1{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:7.6vmin;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:5.4vmin;line-height:1.1;margin-bottom:2.4vmin}
  .lead{font-size:2.5vmin;line-height:1.5;color:var(--ink-soft);margin-top:3vmin;max-width:60ch}
  .accent{color:var(--accent)}
  .gold{color:var(--gold)}
  .em{font-family:'EB Garamond',Georgia,serif;font-style:italic;color:var(--gold)}
  ul{list-style:none;margin-top:3.4vmin;display:flex;flex-direction:column;gap:2.1vmin}
  li{font-size:2.5vmin;line-height:1.4;padding-left:3.4vmin;position:relative;color:var(--ink);max-width:64ch}
  li::before{content:'';position:absolute;left:0;top:1.05vmin;width:1.3vmin;height:1.3vmin;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(158,29,83,.16)}
  li b{color:var(--ink);font-weight:700}
  li span{color:var(--ink-soft)}
  .part-no{font-family:'EB Garamond',serif;font-style:italic;font-size:3vmin;color:var(--gold);margin-bottom:1.2vmin}
  .big{font-family:'EB Garamond',Georgia,serif;font-size:6.4vmin;line-height:1.12;font-weight:500}
  .note{margin-top:4vmin;font-size:1.7vmin;color:var(--ink-soft);max-width:70ch;line-height:1.5}
  .cta-actions{margin-top:4vmin;display:flex;flex-direction:column;gap:1.4vmin}
  .cta-actions .step{font-size:2.6vmin;color:var(--ink)}
  .cta-actions .step b{color:var(--gold)}
  .pill{display:inline-block;margin-top:3vmin;background:var(--accent);color:#fff;font-weight:700;
    font-size:2.2vmin;padding:1.6vmin 3.4vmin;border-radius:100px;font-family:'DM Sans',sans-serif}
  .who-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.4vmin;margin-top:3.4vmin}
  .who-grid .cell{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:3vmin 3.2vmin}
  .who-grid .cell .t{font-family:'EB Garamond',serif;font-size:2.9vmin;color:var(--gold);margin-bottom:1vmin}
  .who-grid .cell p{font-size:2vmin;color:var(--ink-soft);line-height:1.42}
  #nav{position:fixed;bottom:3.2vmin;right:4vmin;z-index:5;display:flex;align-items:center;gap:2.2vmin;
    font-family:'DM Sans',sans-serif;font-size:1.7vmin;color:var(--ink-soft)}
  #nav button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);width:4.6vmin;height:4.6vmin;
    border-radius:50%;font-size:2.2vmin;cursor:pointer;transition:.2s}
  #nav button:hover{border-color:var(--accent);color:var(--gold)}
  .brandfoot{position:fixed;bottom:3.6vmin;left:4vmin;z-index:5;font-family:'EB Garamond',serif;
    font-style:italic;font-size:2vmin;color:var(--ink-soft)}
  .progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:6;transition:width .3s}
  @media(max-width:760px){h1{font-size:9vmin}.lead,li,.cta-actions .step{font-size:3.4vmin}}
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<div id="stage"></div>
<div class="brandfoot">Indie Birth &middot; The New Midwifery</div>
<div id="nav"><span id="count"></span><button onclick="go(-1)" aria-label="Previous">&#8249;</button><button onclick="go(1)" aria-label="Next">&#8250;</button></div>
<script>
const S=[
 {t:'title', kicker:'A Live Masterclass with Margo Blackstone',
  h:'The New Midwifery', lead:'How to become an independent birth worker women seek out, and actually get paid for the sacred work you are called to do.'},

 {t:'promise', kicker:'What this hour is for',
  h2:'You were called to catch babies, not to fit inside a system that was never built for birth.',
  lead:'In the next hour I want to show you the model my partner and I have taught for over twenty years: how to protect physiological birth, serve as an autonomous practitioner, and build a practice that pays you well. On your terms.'},

 {t:'audience', kicker:'Who this is for',
  h2:'If any of these is you, you are in the right room.',
  who:[['The quietly called','You have felt, for a long time, that you are meant to serve women in birth. You have not yet found an honest path in.'],
       ['The new doula','You trained, you are certified, and now you are wondering why no one taught you how to actually make a living.'],
       ['The aspiring midwife','You want to serve outside the hospital, autonomously, and you cannot find a school that trains the whole person.'],
       ['The birth worker in between','You are good at the work and tired of agencies that take your clients, set your rates, and control your care.']]},

 {t:'trap', kicker:'The trap',
  h2:'The path you were handed.',
  bullets:['A weekend certification, then a directory listing, and the vague promise that clients will find you.',
           '<b>Agencies</b> that route you work, then keep most of the fee and all of the relationship.',
           'A model of birth built around <span>observation, intervention, and the clock</span>, not around the woman.',
           'And business, the part that decides whether you can keep doing this at all, taught by no one.']},

 {t:'reframe', kicker:'The real problem',
  big:'The problem is not that you are <span class="accent">under-certified.</span><br>It is that no one taught you to be <span class="gold">independent.</span>',
  lead:'Every gap above has the same root. You were trained to be a technician inside someone else\'s system, instead of a sovereign practitioner who can stand on her own.'},

 {t:'part', partno:'Part One', h2:'Why birth needs a new kind of practitioner'},

 {t:'problem', kicker:'Part One',
  h2:'Birth got institutionalized. So did the people who serve it.',
  bullets:['For a century, birth moved out of the home and into a system optimized for liability, not for the woman.',
           'The training followed. It produces people who can chart and assist, and who wait for permission.',
           'Two things were lost along the way, and getting them back is the whole of this work.']},

 {t:'problem2', kicker:'Part One',
  h2:'The two things that were lost.',
  bullets:['<b>The craft of protecting a physiological birth.</b> <span>Most workers have never been taught what actually helps labor unfold, or what quietly stalls it.</span>',
           '<b>The path to an independent, paid practice.</b> <span>Almost no training treats your livelihood as part of the calling. So gifted women burn out or quit.</span>']},

 {t:'part', partno:'Part Two', h2:'The New Midwifery model'},

 {t:'pillar', partno:'Pillar One', kicker:'Part Two',
  h2:'Protect the physiological birth.',
  lead:'The oldest, most overlooked skill in the room. Birth is a physiological process with its own intelligence. Your first job is to guard the conditions that let it work.'},

 {t:'detail', kicker:'Pillar One, in practice',
  h2:'Work with the body, not against it.',
  bullets:['<b>Guard the space.</b> <span>Private, safe, and unobserved. A watched labor is a stalled labor.</span>',
           '<b>Protect the hormones.</b> <span>Oxytocin, melatonin, and beta-endorphins do the work. Bright light, noise, and questions shut them down.</span>',
           '<b>Engage the primal brain.</b> <span>Dim light, quiet, and safety let the thinking brain step back so labor can lead.</span>',
           '<b>Know the cost of interruption.</b> <span>Every unnecessary intervention has a ripple. Naming it is how you protect against it.</span>']},

 {t:'pillar', partno:'Pillar Two', kicker:'Part Two',
  h2:'Serve as an autonomous practitioner.',
  lead:'Sovereignty is not just for the mother. It is for you. The New Midwifery trains a whole person who can hold the room on her own, outside the hospital and outside the agency.'},

 {t:'detail', kicker:'Pillar Two, in practice',
  h2:'What autonomy actually means.',
  bullets:['<b>You set the terms of care.</b> <span>Your philosophy, your scope, your relationship with each woman.</span>',
           '<b>You answer to the woman, not an institution.</b> <span>Care organized around her, not around a policy manual.</span>',
           '<b>You carry the whole role.</b> <span>Clinical judgment, presence, and the confidence to stand in it. That is what a school should build, and most do not.</span>']},

 {t:'pillar', partno:'Pillar Three', kicker:'Part Two',
  h2:'Build a practice that pays you well.',
  lead:'The half of this calling nobody teaches. You can be devoted to sacred work and be well paid for it. Those are not in tension. They are the same practice, built on purpose.'},

 {t:'detail', kicker:'Pillar Three, in practice',
  h2:'The business is part of the calling.',
  bullets:['<b>A brand that is yours.</b> <span>Your name and your philosophy, not an agency\'s.</span>',
           '<b>Offers and ideal clients.</b> <span>Clear on what you provide and exactly who it is for.</span>',
           '<b>Systems and foundations.</b> <span>A website, an online presence, and a simple structure so the work is sustainable.</span>',
           '<b>Money, faced honestly.</b> <span>Pricing and financial management, so a full calendar means a real living.</span>']},

 {t:'part', partno:'Part Three', h2:'When the New Midwifery is working'},

 {t:'looks', kicker:'Part Three',
  h2:'A practice on your own terms.',
  bullets:['A steady stream of aligned women who found <b>you</b>, because your work is unmistakably yours.',
           'Births you protect rather than manage, in spaces you help create.',
           'Income that is real and predictable, because the business was built on purpose, not left to chance.',
           'And the freedom of answering to the woman in front of you, and to no one else.']},

 {t:'why', kicker:'Why learn this from us',
  h2:'Two mothers, two midwives, twenty years.',
  lead:'My partner and I have twelve children and over two decades of midwifery between us. I keep a small home-birth practice, and together we rebuilt our eight-year-old midwifery school from the ground up to train exactly this: the whole, independent, well-supported birth worker.'},

 {t:'recap', kicker:'The model, in one breath',
  h2:'The New Midwifery.',
  bullets:['<b>Protect</b> the physiological birth.',
           '<b>Serve</b> as an autonomous practitioner.',
           '<b>Build</b> a practice that pays you well.']},

 {t:'cta', kicker:'Where to begin',
  h2:'Come and learn the whole of it.',
  steps:[['Start free','Take the free Sacred Doula workshop and learn how to protect a physiological birth this week.'],
         ['Go all in','Join the next cohort of the Indie Birth School of New Midwifery, or the Sacred Sisterhood Doula Training and Business Accelerator.']],
  pill:'Begin with the free workshop',
  note:'This masterclass is educational. No specific income, birth outcome, or result is guaranteed. Results vary with your effort, experience, and circumstances, and nothing here is medical advice.'}
];

const stage=document.getElementById('stage');
function esc(x){return x==null?'':x}
function render(){
 stage.innerHTML=S.map((s,i)=>{
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.partno && s.t==='part') inner+=`<div class="part-no">${esc(s.partno)}</div>`;
  if(s.h) inner+=`<h1>${esc(s.h)}</h1>`;
  if(s.h2) inner+=`<h2>${esc(s.h2)}</h2>`;
  if(s.big) inner+=`<div class="big">${esc(s.big)}</div>`;
  if(s.lead) inner+=`<p class="lead">${esc(s.lead)}</p>`;
  if(s.who) inner+=`<div class="who-grid">${s.who.map(c=>`<div class="cell"><div class="t">${c[0]}</div><p>${c[1]}</p></div>`).join('')}</div>`;
  if(s.bullets) inner+=`<ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
  if(s.steps) inner+=`<div class="cta-actions">${s.steps.map(st=>`<div class="step"><b>${st[0]}.</b> ${st[1]}</div>`).join('')}</div>`;
  if(s.pill) inner+=`<div class="pill">${esc(s.pill)}</div>`;
  if(s.note) inner+=`<div class="note">${esc(s.note)}</div>`;
  const spine = s.t==='title'||s.t==='part' ? '' : '<div class="spine"></div>';
  return `<div class="slide" data-i="${i}">${spine}<div class="inner">${inner}</div></div>`;
 }).join('');
}
let cur=0;
function show(n){
 cur=Math.max(0,Math.min(S.length-1,n));
 document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('on',i===cur));
 document.getElementById('count').textContent=(cur+1)+' / '+S.length;
 document.getElementById('prog').style.width=((cur+1)/S.length*100)+'%';
}
function go(d){show(cur+d)}
render();show(0);
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(1);
 if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
});
document.getElementById('stage').addEventListener('click',e=>{if(!e.target.closest('#nav'))go(1)});
</script>
</body>
</html>
