<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career 911 - The Personality-Driven Path to Your Next Level</title>
<link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7faff; --panel:#eaf2fb; --rule:#cfe0f2; --ink:#15293d;
    --muted:#4a6079; --deep:#00457a; --accent:#2ea3f2;
    --head:'ABeeZee',sans-serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:#ffffff;border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 10px 30px rgba(0,69,122,.06)}
  .kicker{font-family:var(--head);letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-size:58px;line-height:1.05;color:var(--deep);margin-bottom:14px}
  h2{font-family:var(--head);font-size:36px;line-height:1.12;color:var(--deep);margin-bottom:16px}
  .sub{font-size:20px;color:#3a5168;max-width:46ch}
  .who{margin-top:26px;font-size:17px;color:var(--deep);font-weight:600}
  ul{list-style:none;margin-top:10px}
  li{position:relative;padding:12px 0 12px 34px;font-size:19px;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:20px;width:12px;height:12px;
    border-radius:50%;background:var(--accent)}
  .brave{display:flex;align-items:center;gap:28px}
  .letter{font-family:var(--head);font-size:30px;color:#fff;background:var(--deep);
    min-width:190px;height:150px;border-radius:16px;display:flex;align-items:center;
    justify-content:center;text-align:center;padding:12px;box-shadow:0 8px 20px rgba(0,69,122,.18)}
  .quote h2{font-size:44px;max-width:20ch}
  .cta{background:linear-gradient(135deg,#00457a,#2ea3f2);color:#fff;border:none}
  .cta .kicker{color:#cfe8ff}
  .cta h2{color:#fff}
  .cta .sub{color:#eaf4ff}
  .note{margin-top:28px;font-size:13px;color:#dbeeff;max-width:60ch;line-height:1.5}
  .foot{max-width:1040px;margin:0 auto;padding:0 20px;color:#7d93a8;font-size:13px}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:40px}h2{font-size:28px}
    .brave{flex-direction:column;align-items:flex-start}.letter{min-width:0;width:100%;height:90px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Fly High Coaching &middot; Career 101</div>
<script>
const S = [
  {t:'title', kicker:'Live Masterclass', h:'Career 911',
    sub:'The Personality-Driven Path to Your Next Career Level',
    who:'With Porschia Parker-Griffin, MS, PCC'},
  {t:'points', kicker:'The promise', h:'By the end of this session',
    points:['You will know the real reason your career has plateaued',
      'You will see how your personality shapes your next move',
      'You will have the shape of a 90-day plan built around you']},
  {t:'points', kicker:'Who this is for',
    h:'You are good at your job. The next level still feels stuck.',
    points:['You have done the resume, the applications, the networking',
      'The callbacks or promotions are not matching the work you put in',
      'You suspect the problem is not effort, but you cannot name it']},
  {t:'reframe', kicker:'The reframe', h:'You do not have a resume problem.',
    sub:'A strong resume that still stalls is almost always a personality blind spot: how you are showing up, reading rooms, and positioning your work.'},
  {t:'points', kicker:'Part one: the real problem',
    h:'The five challenges that quietly hold professionals back',
    points:['Chasing tactics instead of a plan built around you',
      'Positioning that does not match how you actually operate',
      'Decisions stalled by factors you have never named',
      'A career plan borrowed from someone wired differently',
      'Effort rising while momentum flattens']},
  {t:'reframe', kicker:'The hidden cost',
    h:'Another year of effort without a read is another year on the plateau.',
    sub:'The plateau is rarely a ceiling on your ability. It is an unread pattern.'},
  {t:'reframe', kicker:'Why tactics do not fix it',
    h:'More tactics on the wrong foundation only move you faster in the wrong direction.',
    sub:'The lift to the next level comes from seeing your own pattern first, then building the plan from it.'},
  {t:'section', kicker:'Part two: the method', h:'The BRAVE Process',
    sub:'An empowering way to move through your career and business to reach your goals. Three stages.'},
  {t:'brave', letter:'Discover', h:'Discover what it takes to reach the next level',
    sub:'Read how you are actually wired, using MBTI, the Energy Leadership Index, and Hogan, so the plan fits you, not a template.'},
  {t:'brave', letter:'Breakthrough', h:'Breakthrough what has been stopping you',
    sub:'Name the personality blind spots and the underlying factors that have quietly kept you from acting, then clear them.'},
  {t:'brave', letter:'Create', h:'Create the plan that moves you forward',
    sub:'Build a customized career plan and the next 90 days of action, aligned to how you lead and decide.'},
  {t:'points', kicker:'The engine',
    h:'What a personality read surfaces that a resume never will',
    points:['Where your natural strengths are being underused',
      'The situations that drain and derail you',
      'How you are perceived versus how you intend',
      'The decisions you quietly avoid, and why']},
  {t:'reframe', kicker:'Fit over formula',
    h:'Your career plan should fit how you are wired.',
    sub:'The same move that frees one person traps another. The read is what tells you which is which.'},
  {t:'reframe', kicker:'What changes', h:'From stuck to a clear next move',
    sub:'Clarity on the real blocker, a plan that fits you, and momentum you can feel in weeks, not years.'},
  {t:'points', kicker:'Your 90 days, concretely',
    h:'A customized plan, not a checklist',
    points:['Your profile mapped to your target role or next level',
      'The two or three shifts that matter most for you',
      'A 90-day sequence you will actually follow']},
  {t:'quote', h:'Plateaued is not permanent. It is usually unread.',
    sub:'The read is the work.'},
  {t:'points', kicker:'Why me', h:'Porschia Parker-Griffin, MS, PCC',
    points:['Masters in Industrial and Organizational Psychology',
      'Professional Certified Coach, MBTI Master Practitioner, Hogan certified',
      'Recognized by LinkedIn as a Career Expert and Top Voice',
      'Host of the Career 101 podcast']},
  {t:'reframe', kicker:'Recap', h:'See the pattern, clear the block, build the plan',
    sub:'Discover, Breakthrough, Create. That is the path the BRAVE Process walks with you.'},
  {t:'reframe', kicker:'Two paths', h:'Keep guessing, or get the read',
    sub:'One more year of effort on an unread pattern, or a plan built around how you are actually wired.'},
  {t:'cta', kicker:'Your next step', h:'Book a career strategy call',
    sub:'We will read where you are, name the real blocker, and map your next 90 days together.',
    note:'This masterclass is educational only. No specific result, promotion, salary, or outcome is promised or guaranteed. Results vary by individual, effort, and circumstances.'}
];

function el(tag, cls, html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function render(){
  const deck=document.getElementById('deck');
  S.forEach(function(s){
    const sl=el('div','slide'+(s.t==='cta'?' cta':'')+(s.t==='quote'?' quote':''));
    if(s.kicker)sl.appendChild(el('div','kicker',s.kicker));
    if(s.t==='title'){
      sl.appendChild(el('h1',null,s.h));
      if(s.sub)sl.appendChild(el('div','sub',s.sub));
      if(s.who)sl.appendChild(el('div','who',s.who));
    } else if(s.t==='brave'){
      const wrap=el('div','brave');
      wrap.appendChild(el('div','letter',s.letter));
      const col=el('div');
      col.appendChild(el('h2',null,s.h));
      if(s.sub)col.appendChild(el('div','sub',s.sub));
      wrap.appendChild(col);
      sl.appendChild(wrap);
    } else {
      if(s.h)sl.appendChild(el('h2',null,s.h));
      if(s.sub)sl.appendChild(el('div','sub',s.sub));
      if(s.points){const ul=el('ul');s.points.forEach(function(p){ul.appendChild(el('li',null,p));});sl.appendChild(ul);}
      if(s.note)sl.appendChild(el('div','note',s.note));
    }
    deck.appendChild(sl);
  });
}
render();
</script>
</body>
</html>
