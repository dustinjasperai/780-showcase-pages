<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Decision-Driven Dojo, Chief Master Greg Moody, Ph.D.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141210;        /* warm near-black, from his #111111 warmed to his #3a2c08 */
    --panel:#1f1b12;     /* panel */
    --rule:#3a2c08;      /* his dark gold-brown, used as the belt-stripe hairline */
    --accent:#c9930a;    /* his dominant brand gold (53 uses on mastermoody.com) */
    --ink:#ece7dd;       /* warm off-white, from his #e8e8e8 */
    --muted:#8a8276;     /* muted, from his #888888 */
    --head:'Oswald',system-ui,sans-serif;
    --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0d0b09;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 18px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 52px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:52px;top:46px;width:54px;height:4px;background:var(--accent);border-radius:2px}
  .slide.cover::before,.slide.reframe::before,.slide.part::before{display:none}
  .kick{font-family:var(--head);text-transform:uppercase;letter-spacing:.18em;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:14px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.04;letter-spacing:.005em;margin:18px 0 10px}
  h2{font-family:var(--head);font-weight:600;font-size:36px;line-height:1.1;margin:0 0 18px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:62ch;margin:0 0 14px}
  p.sub{color:var(--muted);font-size:21px}
  ul{list-style:none;margin:10px 0 0;padding:0}
  li{font-size:20px;line-height:1.45;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:20px;width:14px;height:4px;background:var(--accent);border-radius:2px}
  li b{font-family:var(--head);font-weight:600;letter-spacing:.01em}
  .cover{align-items:flex-start}
  .cover h1{font-size:68px;margin-top:8px}
  .cover .by{margin-top:26px;color:var(--muted);font-size:18px;line-height:1.5}
  .cover .by b{color:var(--ink);font-family:var(--head);font-weight:600}
  .reframe{background:linear-gradient(160deg,#1a1510,#0f0c09);border-color:var(--accent)}
  .reframe h2{font-size:46px;color:var(--ink);max-width:20ch}
  .reframe .accent{color:var(--accent)}
  .part{background:var(--panel)}
  .part .num{font-family:var(--head);font-weight:700;font-size:20px;color:var(--accent);letter-spacing:.2em}
  .part h2{font-size:48px;margin-top:10px}
  .stat-row{display:flex;flex-wrap:wrap;gap:28px 48px;margin-top:14px}
  .stat b{display:block;font-family:var(--head);font-weight:700;font-size:40px;color:var(--accent);line-height:1}
  .stat span{color:var(--muted);font-size:15px;letter-spacing:.03em}
  .cta{background:var(--panel);border-color:var(--accent)}
  .cta .step{font-size:20px;color:var(--ink);margin-top:8px}
  .disclaimer{margin-top:28px;font-size:13px;line-height:1.5;color:var(--muted);max-width:66ch;border-top:1px solid var(--rule);padding-top:16px}
  .pg{position:absolute;right:52px;bottom:34px;font-family:var(--head);font-size:13px;color:var(--muted);letter-spacing:.1em}
  @media(max-width:640px){.slide{padding:40px 26px}h1{font-size:40px}.cover h1{font-size:46px}h2{font-size:28px}p,li{font-size:18px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'cover', kick:'A live masterclass for martial arts school owners', h:'The Decision-Driven Dojo', sub:"Why your school grows, or stalls, on the decisions you don't even notice you're making.", by:"With <b>Chief Master Greg Moody, Ph.D.</b><br>8th Degree Black Belt. Licensed counselor. Eight-time National School of the Year."},
  {t:'content', kick:'What you walk away with', h2:"One hour. Three shifts.", p:["By the end of this session you will see the real lever behind a growing school, and it is not another marketing tactic."], li:["<b>The decision tax</b> that is quietly capping your enrollment","<b>A 5-step way to decide</b> your hardest calls without second-guessing","<b>Retention as leadership</b>, so students stay because of who you are"]},
  {t:'content', kick:'Who this is for', h2:"You, if this sounds familiar", li:["You run a good school and teach great classes, but growth has gone flat","You have tried more ads, more offers, more hours, and the needle barely moves","You make most of the big calls alone, and some of them keep coming back to bite you"]},
  {t:'content', kick:'The trap', h2:"You have been told it is a marketing problem", p:["So you spend on another funnel, another promo, another platform. Some of it works for a month. Then you are flat again, and now you are tired and a little more broke.","Here is the part nobody says out loud. The ceiling was never the market."]},
  {t:'reframe', h2:'Your school’s ceiling is not the market. It is the <span class="accent">decisions</span> you make about it.'},
  {t:'part', num:'PART ONE', h2:'The invisible decision tax'},
  {t:'content', kick:'The core problem', h2:"Every school pays a decision tax", p:["A decision tax is the slow, compounding cost of deciding by habit, by mood, or by whoever asked last. You rarely see it as one thing. You feel it as churn, as a bad hire you kept too long, as pricing you never raised, as a program you should have cut."],},
  {t:'content', kick:'Where it hides', h2:"Four calls that make or break a school", li:["<b>Hiring</b>: who you bring onto the mat, and who you keep","<b>Pricing</b>: what you charge, and when you finally raise it","<b>Expansion</b>: the second location, the bigger lease, the new program","<b>Saying no</b>: the student, the parent, the opportunity that is not yours"]},
  {t:'part', num:'PART TWO', h2:'Deciding how to decide'},
  {t:'content', kick:'Decision psychology', h2:"You have a decision pattern", p:["Most owners decide the same way every time without knowing it. That pattern served you once. At your current size it is the thing holding the school down.","The first move is simply to see it."]},
  {t:'content', kick:'The Decision Pattern Diagnostic', h2:"Name the pattern, see the tax", li:["Every owner runs one of a handful of decision archetypes","Each archetype has a signature blind spot and a recurring cost","Once you can name yours, you can decide around it on purpose instead of by reflex"]},
  {t:'content', kick:'The 5-Step Decision Checklist', h2:"A repeatable way to decide under pressure", li:["<b>Frame</b> the real decision, not the one shouting loudest","<b>Surface</b> the outcome you actually want for the school","<b>Separate</b> the facts from the fear","<b>Stress-test</b> the choice against your worst week, not your best","<b>Commit</b>, set the review date, and stop relitigating it"]},
  {t:'part', num:'PART THREE', h2:'The leadership that makes it stick'},
  {t:'content', kick:'The Six Pillars of Leadership', h2:"Retention is a leadership problem", p:["Students do not stay for a curriculum. They stay for who you are on the floor. Leadership is not a thing you do, it is a set of skills you develop."], li:["Vision, self-esteem, communication","Respect, honesty, discipline"]},
  {t:'content', kick:'Why it compounds', h2:"Culture is a decision you make daily", p:["When your team sees you decide with discipline, they decide with discipline. When students feel that steadiness, they renew without being sold. The same pillars that build a black belt build a school that lasts."]},
  {t:'content', kick:'What it looks like', h2:"A reactive week vs a decided one", li:["Reactive: you firefight, you discount to keep a family, you keep a weak instructor because replacing them is hard","Decided: you run the calls through the checklist, you hold the price, you lead the team instead of chasing them","Same school, same market. Different owner at the controls."]},
  {t:'credibility', kick:'Why listen to me', h2:"I have run the experiment on myself", p:["I have spent nearly four decades on the floor and in the research. I built this method because I needed it for my own schools first."], stats:[["20","Books, four #1 bestsellers"],["18,000+","Students taught"],["1,800+","Black belts produced"],["8x","National School of the Year"]]},
  {t:'content', kick:'The recap', h2:"The three shifts", li:["See the <b>decision tax</b> you are already paying","Run your hardest calls through <b>one checklist</b>","Lead the <b>six pillars</b> so retention takes care of itself"]},
  {t:'cta', kick:'Your Fit Conversation', h2:"Let us look at your school", step:"If you want to find the decision tax in your own numbers, the next step is a Fit Conversation. Twenty minutes. You tell me what you are working on, and I will tell you honestly whether I am the right fit to help.", action:"Schedule a Fit Conversation with Greg", thesis:"Discipline is the foundation.", disc:"This masterclass is educational. It shares a method and a way of thinking, not a promise of income or enrollment. No specific result is guaranteed. Results vary from school to school and depend on your market, your team, and the work you put in."}
];

function esc(x){return x;}
const d=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+s.t;
  let h='';
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='cover'){
    h+='<h1>'+s.h+'</h1>';
    if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
    if(s.by) h+='<div class="by">'+s.by+'</div>';
  } else if(s.t==='reframe'){
    h+='<h2>'+s.h2+'</h2>';
  } else if(s.t==='part'){
    h+='<div class="num">'+s.num+'</div><h2>'+s.h2+'</h2>';
  } else if(s.t==='cta'){
    h+='<h2>'+s.h2+'</h2>';
    if(s.step) h+='<p class="step">'+s.step+'</p>';
    if(s.action) h+='<p style="font-family:var(--head);font-weight:600;font-size:24px;color:var(--accent);margin-top:18px">'+s.action+'</p>';
    if(s.thesis) h+='<p class="sub" style="margin-top:20px;font-style:italic">'+s.thesis+'</p>';
    h+='<div class="disclaimer">'+s.disc+'</div>';
  } else {
    if(s.h2) h+='<h2>'+s.h2+'</h2>';
    if(s.p) s.p.forEach(x=>h+='<p>'+x+'</p>');
    if(s.stats){h+='<div class="stat-row">';s.stats.forEach(st=>h+='<div class="stat"><b>'+st[0]+'</b><span>'+st[1]+'</span></div>');h+='</div>';}
    if(s.li){h+='<ul>';s.li.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  }
  h+='<div class="pg">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  el.innerHTML=h;
  d.appendChild(el);
});
</script>
</body>
</html>
