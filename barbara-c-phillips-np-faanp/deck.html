<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Your Own Doors &middot; The Operational Path to Owning an Independent NP Practice &middot; with Barbara C. Phillips, NP, FAANP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ee;        /* warm neutral paper ground (from research ## Palette) */
    --panel:#e6eeed;     /* pale teal-washed paper for step cards */
    --ink:#16302f;       /* deep teal-black display + headings */
    --ink-soft:#3a4f4d;  /* body copy on paper */
    --rule:rgba(22,48,47,.14);
    --dim:#7d908d;       /* muted caption / foot */
    --accent:#0f766e;    /* deep clinical teal */
    --accent-deep:#0b5c55;/* darker teal for small legible type */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Inter",-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative;width:100%;max-width:960px;aspect-ratio:16/9;
    background:
      radial-gradient(120% 90% at 84% 6%, rgba(15,118,110,.15), transparent 58%),
      var(--bg);
    overflow:hidden;box-shadow:0 0 0 1px var(--rule);
  }
  .slide{position:absolute;inset:0;padding:8% 9%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-family:"Inter",sans-serif;font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;font-size:clamp(11px,1.5vw,15px);color:var(--accent-deep);margin-bottom:1em}
  h1{font-family:"Newsreader",Georgia,serif;font-weight:600;line-height:1.04;
    font-size:clamp(34px,6.6vw,70px);letter-spacing:-.015em}
  h2{font-family:"Newsreader",Georgia,serif;font-weight:600;line-height:1.08;
    font-size:clamp(25px,4.7vw,47px);letter-spacing:-.01em}
  .lede{font-size:clamp(16px,2.15vw,22px);line-height:1.5;max-width:46ch;margin-top:.9em;color:var(--ink-soft)}
  .rule{width:74px;height:5px;background:var(--accent);margin:1.05em 0;border-radius:3px}
  ul{list-style:none;margin-top:1.1em;max-width:52ch}
  li{position:relative;padding-left:1.7em;margin:.62em 0;font-size:clamp(15px,2vw,21px);line-height:1.42;color:var(--ink-soft)}
  li::before{content:"";position:absolute;left:.05em;top:.5em;width:11px;height:11px;background:var(--accent);border-radius:50%}
  .big{font-family:"Newsreader",Georgia,serif;font-weight:700;font-size:clamp(60px,14vw,150px);color:var(--accent);line-height:.9;letter-spacing:-.02em}
  .cardwrap .inner{background:var(--panel);padding:5.5% 6.5%;border-left:6px solid var(--accent);border-radius:5px}
  .foot{position:absolute;left:9%;bottom:5.5%;font-family:"Inter",sans-serif;
    letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--dim)}
  .disc{font-size:13px;line-height:1.55;color:var(--dim);max-width:60ch;margin-top:1.3em}
  #nav{position:fixed;bottom:14px;right:18px;display:flex;gap:8px;align-items:center;
    font-family:"Inter",sans-serif;font-size:14px;color:var(--dim)}
  #nav button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--rule);
    border-radius:6px;padding:5px 11px;cursor:pointer}
  #nav button:hover{border-color:var(--accent-deep);color:var(--accent-deep)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">Prev</button><span id="count"></span><button id="next">Next</button></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass with Barbara C. Phillips, NP, FAANP',h:'Open Your Own Doors',lede:'The operational, step-by-step path a nurse practitioner actually walks to own an independent practice, from someone who has walked it since 2006.'},
 {t:'promise',h:'What you will leave with',ul:['A clear picture of the real sequence to opening your own practice, in the order it actually happens','Which decisions come first, and which ones people burn months on out of order','The confidence to treat your practice as a business you own, not a job you keep asking permission for']},
 {t:'who',kick:'Who this is for',h:'You are already the clinician. That was never in question.',lede:'You can assess, diagnose, and carry a patient further than most. What no program taught you is how any of that becomes a practice with your name over the door and your decisions running it.'},
 {t:'hook',kick:'The reframe',h:'You do not need more clinical hours. You need the business path.',lede:'Most NPs wait to feel ready to own something before they start. Ready never arrives on its own. It comes from working the launch in the right order, one concrete step at a time.'},
 {t:'part',kick:'Part one',h:'Why most NP practice plans stall'},
 {t:'content',h:'The three quiet stalls',ul:['It stays someday: no start date, no first document, so the plan never leaves the notebook','The everything model: "I will see whoever walks in" is a practice built for no one in particular','The identity block: "I am a clinician, not a business owner," so you self-reject before a single patient does']},
 {t:'content',h:'Working harder is not the missing piece',lede:'You already outwork almost everyone. Another double shift does not turn your license into a practice you own. A sequence does: decide the practice, build the legal and financial base, get credentialed and enrolled, then open, in that order.'},
 {t:'part',kick:'Part two',h:'The path: the NPBO 10 Steps'},
 {t:'card',kick:'Step one',h:'Decide the practice you are actually building',lede:'Name the patients you are best placed to serve and the model that fits your life: cash-pay, insurance, telehealth, or a hybrid. A practice you have defined beats a practice you are still imagining.'},
 {t:'card',kick:'Step two',h:'Build the legal and business foundation',lede:'Choose your entity, register the business, and set up the bank account and bookkeeping before money moves. The parts that feel intimidating are the most learnable, and doing them first is what makes everything after it real.'},
 {t:'card',kick:'Step three',h:'Credentialing and your regulatory footing',lede:'Get your NPI and state requirements in order, and put any collaborative or supervisory agreement your state asks for in writing early. This is the step people underestimate, and it sets the timeline for everything else.'},
 {t:'content',kick:'Step four',h:'Get enrolled to actually get paid',ul:['Start Medicare and payer enrollment early, because the paperwork moves slowly and gates your first revenue','Fill out the applications correctly the first time so you are not re-submitting for months','Understand the difference between being credentialed and being enrolled, because they are not the same thing']},
 {t:'content',kick:'Step five',h:'The systems that let you run it',lede:'Choose the charting and practice-management tools you will actually use, set up scheduling and documentation, and decide how you will handle billing. This is the machinery that turns an open door into a practice that runs.'},
 {t:'content',kick:'Step six',h:'Open the doors, and keep them open',ul:['Bring in your first patients from the audience and referral relationships you built along the way','Watch your cashflow closely in the first months, because that is where new practices either steady or stumble','Treat the first quarter as a business owner, reading your own numbers, not just seeing patients']},
 {t:'part',kick:'Part three',h:'What the first year can look like'},
 {t:'content',h:'The shift you feel first',ul:['A practice you can describe in one sentence, to a patient or a banker','A first month where the revenue is yours, not a paycheck someone else decided','A calendar that finally has your business on it, not just someone else’s schedule']},
 {t:'why',kick:'Why learn this from me',h:'A nurse practitioner who built the practice herself',lede:'I am Barbara C. Phillips, a practicing NP since 1988 and a Fellow of the American Association of Nurse Practitioners. I opened my own primary-care practice, then built NPBO so no clinician has to guess their way through the business side. I have done the credentialing, the enrollment, and the open-the-doors work myself, so I can walk you through the actual turns instead of the theory.'},
 {t:'recap',h:'The whole path in one breath',ul:['Decide the practice, so you build for someone real','Foundation, credentialing, and enrollment, in the order that actually clears','Systems and open doors, run as a business you own']},
 {t:'cta',kick:'Your next step',h:'Build your own independent practice, step by step',lede:'If you want the full path with me, the workbook, the sequence, and a private community of other NP owners, the NPBO Practice Startup System is where we build your plan together. Come work it with me and open your own doors.',disc:'This masterclass is educational. No specific income, revenue, patient-volume, or business result is guaranteed. Outcomes vary and depend on you, your state, your market, and the work you put in. Nothing here is legal, tax, or regulatory advice; confirm your own state’s requirements.'}
];
const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='slide'+(i===0?' on':'');
  let h='';
  if(s.kick)h+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='part'){h+='<div class="big">'+(i)+'</div><h2 style="margin-top:.2em">'+s.h+'</h2>';}
  else if(s.t==='title'){h+='<h1>'+s.h+'</h1><div class="rule"></div>'+(s.lede?'<div class="lede">'+s.lede+'</div>':'');}
  else if(s.t==='card'){h+='<div class="cardwrap"><div class="inner"><h2>'+s.h+'</h2>'+(s.lede?'<div class="lede">'+s.lede+'</div>':'')+'</div></div>';}
  else{h+='<h2>'+s.h+'</h2><div class="rule"></div>';if(s.lede)h+='<div class="lede">'+s.lede+'</div>';}
  if(s.ul){h+='<ul>'+s.ul.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="foot">Barbara C. Phillips, NP, FAANP &middot; NPBO</div>';
  d.innerHTML=h;stage.appendChild(d);
});
let cur=0;const slides=[...stage.children];const count=document.getElementById('count');
function show(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,i)=>s.classList.toggle('on',i===cur));count.textContent=(cur+1)+' / '+S.length;}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
stage.addEventListener('click',e=>{if(e.clientX> stage.getBoundingClientRect().left+stage.clientWidth/2)show(cur+1);else show(cur-1);});
show(0);
</script>
</body>
</html>
