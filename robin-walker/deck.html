<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Why Your Business Plan Never Sticks · Robin Walker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbfaf7; --panel:#f1f0ea; --rule:#e4e1d7;
    --ink:#0d1a4d; --accent:#ff7078; --dim:#6b6f7d;
  }
  html,body{height:100%}
  body{background:#e8e6df;font-family:'PT Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e8e6df}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'PT Sans',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.2vh}
  h1{font-family:'PT Serif',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:-.004em}
  .t-title h1{font-size:4.3vw;max-width:90%}
  .t-normal h1{font-size:3.15vw;max-width:86%}
  .t-normal .body{font-family:'PT Sans',sans-serif;font-size:1.46vw;color:var(--dim);margin-top:2.6vh;max-width:75%;line-height:1.56;font-weight:400}
  .sub{font-family:'PT Sans',sans-serif;font-size:1.7vw;color:var(--dim);margin-top:3.0vh;max-width:78%;line-height:1.48;font-weight:400}
  /* section: a planner index-tab strip */
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'PT Sans',sans-serif;font-size:1.28vw;font-weight:700;color:#fff;background:var(--accent);
    display:inline-block;padding:1.1vh 1.5vw 1.1vh;border-radius:10px 10px 0 0;margin-bottom:0;letter-spacing:.12em;text-transform:uppercase}
  .t-section .tabwrap{border-top:3px solid var(--accent);padding-top:3vh;margin-top:0;width:74%}
  .t-section h1{font-size:4.6vw;max-width:92%}
  /* reframe: full navy field, paper type */
  .t-reframe{background:var(--ink);align-items:center;text-align:center}
  .t-reframe h1{font-family:'PT Serif',serif;font-size:3.5vw;max-width:84%;font-style:italic;font-weight:400;color:#fbfaf7}
  .t-reframe .mark{width:4.4vw;height:3px;background:var(--accent);margin:0 auto 4vh}
  /* cta */
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--ink);color:var(--ink);border-radius:100px;padding:1.3vh 1.7vw;font-family:'PT Sans',sans-serif;font-size:1.16vw;font-weight:700}
  .chip:first-child{background:var(--accent);border-color:var(--accent);color:#fff}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.6vh;font-family:'PT Sans',sans-serif;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.42}
  .t-title .disc,.t-normal .disc{text-align:left}
  .brandline{font-family:'PT Sans',sans-serif;font-size:1.28vw;color:var(--dim);margin-top:3.6vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--ink);font-weight:700}
  /* type-card: named planning type */
  .t-type h1{font-size:2.9vw}
  .t-type .letter{font-family:'PT Serif',serif;font-size:2.2vw;font-weight:700;color:#fff;background:var(--accent);
    width:4.4vw;height:4.4vw;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:2.4vh}
  .t-type .body{font-family:'PT Sans',sans-serif;font-size:1.42vw;color:var(--dim);margin-top:2.2vh;max-width:74%;line-height:1.55}
  .corner-tab{position:absolute;right:0;top:16%;width:2.2vw;height:11vh;background:var(--accent);border-radius:8px 0 0 8px;opacity:.9}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(13,26,77,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:13px;right:18px;font-family:'PT Sans',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'PT Sans',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'PT Sans',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-reframe h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}.t-type .letter{width:11vw;height:11vw;font-size:5vw}.t-type .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">Women's Business Workshop</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'Why Your Business Plan Never Sticks',sub:'A live masterclass for women business owners who have made plans before and watched them fall apart by February.',brand:true},
 {t:'normal',k:'Who this is for',title:'You are not short on ideas. You are short on a plan that lasts.',body:'You run a real business. You have written the goals, filled the planner, started the year sure this time would be different. By spring it is back to putting out fires and hoping the good months carry the slow ones.'},
 {t:'reframe',title:'You do not have a discipline problem. You have a planning type you have never named.'},

 {t:'section',idx:'Part One',title:'Why Plans Fall Apart'},
 {t:'normal',k:'The real reason',title:'Most plans fail because they fight how you actually think.',body:'The template you downloaded was built for someone else. When a plan asks you to work in a way that is not natural to you, you do not stick with it. You quietly abandon it and blame yourself.'},
 {t:'normal',k:'The cost of winging it',title:'A reactive year is an expensive year.',body:'When every week is decided by whatever is loudest, the important work keeps sliding. You stay busy, you stay tired, and the business grows by accident instead of on purpose.'},
 {t:'reframe',title:'A plan that works against your brain loses every single time.'},

 {t:'section',idx:'Part Two',title:'The 6 Business Planning Types'},
 {t:'normal',k:'The framework',title:'There are six ways women plan. None of them is wrong.',body:'Each type is a protective pattern, not a flaw. Once you know which one is yours, you stop forcing a system that was never going to fit and start building one that does. Here are the six.'},
 {t:'type',letter:'1',title:'The Sticky Note Strategist',body:'Ideas for days. On your desk, in your Notes app, from a podcast this morning. The problem is not a shortage of vision, it is that nothing is captured in one place long enough to act on.'},
 {t:'type',letter:'2',title:'The One-Day-at-a-Time Operator',body:'Always busy, always reacting, always sure the planning will happen once things slow down. They never slow down, so the plan never comes and the same fires burn every week.'},
 {t:'type',letter:'3',title:'The Avoider',body:'Planning keeps getting pushed to next week because something more urgent always appears. The delay is not laziness, it is discomfort, and the uncertainty it leaves behind quietly grows into anxiety.'},
 {t:'type',letter:'4',title:'The Perfectionist Planner',body:'You love a beautiful, detailed plan. The trouble comes at follow-through, where too many competing goals and too much preparation stall the actual doing. The plan looks finished long before anything ships.'},
 {t:'type',letter:'5',title:'The Partner Planner',body:'You think best out loud and move fastest with someone holding you to it. Clarity comes easily in the room. The momentum is what fades once the accountability goes quiet.'},
 {t:'type',letter:'6',title:'The Wing-It Free Spirit',body:'You trust your instincts and resist structure because plans feel like a box. The freedom is real, and so is the ceiling you hit when the whole business lives only in your head.'},
 {t:'reframe',title:'Your type is not the problem to fix. It is the starting line to build from.'},

 {t:'section',idx:'Part Three',title:'Planning That Actually Fits You'},
 {t:'normal',k:'Fit the plan to the type',title:'The right plan meets you where you already work.',body:'A Sticky Note Strategist needs one place to land her ideas. A Wing-It Free Spirit needs a light structure, not a rigid one. When the plan fits the type, follow-through stops taking willpower and starts feeling obvious.'},
 {t:'normal',k:'The quarterly rhythm',title:'Ninety days at a time, not one overwhelming year.',body:'A year is too far away to steer by. A quarter is close enough to see and short enough to adjust. Plan in ninety-day blocks, sit down every quarter to reset, and the plan becomes a living thing instead of a document you forget.'},
 {t:'normal',k:'Why Robin',title:'Twenty years of building businesses, taught in plain language.',body:'Robin Walker is a fifth-generation entrepreneur with two decades of business ownership, a business advisor with the Illinois SBDC, and an instructor at McHenry County College. She built her own businesses while raising a family, which is exactly why her planning work is built for real life, not a whiteboard.'},
 {t:'reframe',title:'The goal was never a perfect plan. It is a plan you actually follow.'},

 {t:'section',idx:'Your Next Step',title:'Find Your Type, Build Your Plan'},
 {t:'cta',title:'Ready to plan in a way that finally sticks?',chips:['Take the 6 Business Planning Types quiz','Book a strategy call with Robin','Join the Impact Business Circle'],disc:'Educational content for women business owners. No income or business result is guaranteed. Results vary by owner, market, and follow-through.'},
];

const deck=document.getElementById('deck');
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){
    h=`<div class="tabwrap"><span class="idx">${s.idx}</span></div><h1>${s.title}</h1>`;
  } else if(s.t==='type'){
    h=`<div class="letter">${s.letter}</div>`;
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    h+=`<div class="corner-tab"></div>`;
  } else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.t==='reframe') h=`<div class="mark"></div>`+h;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Women's <b>Business Workshop</b> · Robin Walker</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
