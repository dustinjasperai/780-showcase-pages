<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getting More Done for the Glory of God — a live masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbf9;      /* near-white, softened from their #ffffff ground */
    --panel:#e5f2f1;   /* their pale-teal wash, verbatim from brand.json */
    --ink:#323232;     /* their dominant charcoal, verbatim */
    --muted:#5f6b6a;   /* muted teal-gray */
    --accent:#009688;  /* their brand teal, verbatim from brand.json */
    --accent-deep:#00695f;
    --rule:rgba(50,50,50,.14);
    --head:'Spectral',Georgia,serif;
    --body:'Inter',-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1120px;margin:0 auto}
  .slide{min-height:88vh;display:flex;flex-direction:column;justify-content:center;
    padding:76px 72px;border-bottom:1px solid var(--rule);position:relative}
  .kick{font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(40px,6vw,74px);line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(30px,4.4vw,50px);line-height:1.1}
  h1 .a,h2 .a{color:var(--accent)}
  .lede{font-size:clamp(19px,2.2vw,26px);line-height:1.5;color:var(--muted);margin-top:26px;max-width:40ch}
  .body{font-size:clamp(18px,2vw,23px);line-height:1.6;margin-top:22px;max-width:46ch}
  .sig{margin-top:40px;font-size:18px;color:var(--muted)}
  .sig b{color:var(--ink);font-weight:600}
  .divider{background:var(--ink);color:var(--bg)}
  .divider .kick{color:#7fd8ce}
  .divider h1{color:var(--bg)}
  .divider h1 .a{color:#7fd8ce}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
  .card{background:var(--panel);border:1px solid rgba(0,150,136,.22);border-radius:16px;padding:26px 28px}
  .card .n{font-family:var(--head);font-size:22px;font-weight:700;color:var(--accent)}
  .card .t{font-size:21px;font-weight:600;margin-top:8px}
  .card .d{font-size:16px;line-height:1.5;color:var(--muted);margin-top:8px}
  .practice{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-top:18px;padding:18px 0;border-top:1px solid var(--rule)}
  .practice:first-of-type{border-top:none}
  .practice .num{font-family:var(--head);font-size:34px;font-weight:700;color:var(--accent);line-height:1}
  .practice .pt{font-size:22px;font-weight:600}
  .practice .pd{font-size:17px;color:var(--muted);margin-top:5px;line-height:1.5}
  .path{margin-top:44px}
  .facts{margin-top:28px;font-size:19px;line-height:1.8}
  .facts li{list-style:none;padding-left:30px;position:relative}
  .facts li::before{content:'';position:absolute;left:0;top:12px;width:12px;height:12px;border:2px solid var(--accent);border-radius:50%}
  .cta-box{background:var(--panel);border-radius:20px;padding:40px 44px;margin-top:34px;border:1px solid rgba(0,150,136,.25)}
  .cta-btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-weight:600;
    font-size:20px;padding:16px 34px;border-radius:100px}
  .disclaimer{margin-top:30px;font-size:13px;line-height:1.6;color:#8b938f;max-width:60ch}
  .pagefoot{position:absolute;bottom:26px;right:72px;font-size:13px;color:#a7aeac;letter-spacing:.04em}
  .brandfoot{position:absolute;bottom:26px;left:72px;font-size:13px;color:#a7aeac;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  @media(max-width:680px){.pillars{grid-template-columns:1fr}.slide{padding:56px 30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* Reagan Rose's masterclass — his content, his CTA. Zero trace of any vendor. */
const S = [
  {t:'title',
    kick:'A live masterclass · Redeeming Productivity',
    h:'Getting More Done for the <span class="a">Glory of God</span>',
    lede:'The biblical why, and the practical how, of productivity for the Christian.',
    sig:'<b>Reagan Rose</b> · Author of <i>Redeeming Productivity</i> · Host of The Redeeming Productivity Show' },

  {t:'content',
    kick:'Who this is for',
    h:'You love God. You still feel behind.',
    body:'You want to steward your time well. But every productivity book asks you to filter out a godless worldview to get to the tips. This hour is built the other way around, for the believer who wants to be faithful, not just busy.' },

  {t:'content',
    kick:'The trap',
    h:'The apps worked. For about a week.',
    body:'New planner, earlier alarm, cleaner inbox. The system holds for a few days, then the guilt creeps back in. We assume the problem is our discipline, so we go looking for a better technique. It is almost never the technique.' },

  {t:'divider',
    kick:'The real problem',
    h:'You were handed a <span class="a">how</span> with no <span class="a">why</span>.',
    lede:'Secular productivity has no answer to the only question that lasts: productive for what?' },

  {t:'content',
    kick:'A better picture',
    h:'Productivity was never about the assembly line.',
    body:'Before spreadsheets, the word pointed to crop yield. To fruit. Jesus said it plainly: "By this my Father is glorified, that you bear much fruit" (John 15:8). You were not made to produce output. You were made to bear fruit for God.' },

  {t:'divider',
    kick:'Part One',
    h:'The Why: <span class="a">Five Pillars</span>',
    lede:'Five truths that turn productivity from performance into worship.' },

  {t:'pillars',
    kick:'The Five Pillars of Christian Productivity',
    h:'Where a faithful life gets its footing.',
    cards:[
      {n:'01 · Origin', t:'You belong to God', d:'You are not your own. Your time is entrusted, not owned.'},
      {n:'02 · Purpose', t:'You exist to glorify God', d:'The point of the work is not the work. It is His glory.'},
      {n:'03 · Content', t:'You were saved to bear fruit', d:'Good works were prepared for you to walk in. Fruit is the aim.'},
      {n:'04 · Source', t:'You are uniquely gifted', d:'Your gifts are not generic. Productivity means using yours.'}
    ] },

  {t:'content',
    kick:'Pillar Five',
    h:'You will give an <span class="a">account</span>.',
    body:'One day the talents get counted. That is not a threat, it is a clarity. When you know your time will be reviewed by the One who gave it, the noise falls away and the few things that matter get loud. This is the pillar that changes how you plan a Tuesday.' },

  {t:'divider',
    kick:'Part Two',
    h:'The How: <span class="a">Five Practices</span>',
    lede:'The theology has to touch the calendar. Here is where it lands.' },

  {t:'practices',
    kick:'The Five Practices',
    h:'From conviction to calendar.',
    rows:[
      {num:'1', pt:'Craft your morning routine', pd:'Order the first hour around God first: time, Word, and work before the world gets a vote.'},
      {num:'2', pt:'Get organized', pd:'A trusted system for what is on your plate, so your mind can rest and your hands can work.'},
      {num:'3', pt:'Track your commitments', pd:'Say yes on purpose. Keep your word because your word is a stewardship too.'},
      {num:'4', pt:'Set your goals', pd:'Aim at fruit, not just motion. Fewer goals, chosen well, pursued with others.'},
      {num:'5', pt:'Write your well done', pd:'The capstone: name the faithful life, then work backward into this season.'}
    ] },

  {t:'content',
    kick:'The signature practice',
    h:'Start at the <span class="a">end</span>.',
    body:'Most goal-setting starts with this year. Yours starts with the words "well done, good and faithful servant," and asks what kind of life earns them. Define that, and this quarter almost sets itself. This is Write Your Well Done, and it reorders everything upstream of it.' },

  {t:'divider',
    kick:'Part Three',
    h:'What it looks like <span class="a">lived</span>.',
    lede:'Not a frantic week that gets more done. A faithful week that bears more fruit.' },

  {t:'content',
    kick:'The redeemed week',
    h:'Same hours. Different aim.',
    body:'Mornings start with the Word instead of the feed. The task list serves the calling instead of the anxiety. You still work hard, maybe harder, but the striving is gone, because you already know Whose you are and what the work is for. That is the whole promise of this hour.' },

  {t:'content',
    kick:'Who is teaching this',
    h:'Reagan Rose',
    facts:[
      'Author of <i>Redeeming Productivity: Getting More Done for the Glory of God</i> (Moody Publishers)',
      'Host of The Redeeming Productivity Show',
      'Graduate of The Master\'s Seminary',
      'Teaching a community of 25,000+ believers on stewarding their time'
    ] },

  {t:'content',
    kick:'Where this goes next',
    h:'You do not build this <span class="a">alone</span>.',
    body:'The whole system, the Five Pillars and the Five Practices, is what we build together over nine weeks in the Redeeming Productivity Academy. It is called Waypoints to Well Done: a step-by-step path, a private community of believers, goal challenges, and the planner and templates to run it all.' },

  {t:'cta',
    kick:'Your next step',
    h:'Start your <span class="a">Waypoints to Well Done</span>.',
    body:'Join the Redeeming Productivity Academy and build a God-honoring productivity system with other believers, one waypoint at a time.',
    btn:'Join the Academy',
    disclaimer:'This masterclass is for educational and discipleship purposes. It offers biblical principles and practical tools for stewarding your time; it is not a guarantee of any particular outcome, income, or result. Fruitfulness is God\'s to give.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'divider' ? ' divider' : '') + (s.t === 'cta' ? ' cta' : '');
  let inner = '';
  if (s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if (s.h) inner += (s.t === 'title' || s.t === 'divider' || s.t === 'cta' ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`);
  if (s.lede) inner += `<div class="lede">${s.lede}</div>`;
  if (s.body) inner += `<div class="body">${s.body}</div>`;
  if (s.cards) {
    inner += '<div class="pillars">' + s.cards.map(c =>
      `<div class="card"><div class="n">${c.n}</div><div class="t">${c.t}</div><div class="d">${c.d}</div></div>`).join('') + '</div>';
  }
  if (s.rows) {
    inner += s.rows.map(r =>
      `<div class="practice"><div class="num">${r.num}</div><div><div class="pt">${r.pt}</div><div class="pd">${r.pd}</div></div></div>`).join('');
  }
  if (s.facts) {
    inner += '<ul class="facts">' + s.facts.map(f => `<li>${f}</li>`).join('') + '</ul>';
  }
  if (s.sig) inner += `<div class="sig">${s.sig}</div>`;
  if (s.t === 'cta') {
    inner += `<div class="cta-box"><div class="body" style="margin-top:0">${s.body}</div><span class="cta-btn">${s.btn}</span></div>`;
    inner += `<div class="disclaimer">${s.disclaimer}</div>`;
  }
  if (i === 0) {
    // path motif on the title slide only, drawn from "Waypoints"
    inner += `<svg class="path" width="260" height="96" viewBox="0 0 260 110" fill="none">
      <path d="M20 96 H80 V66 H140 V38 H200 V14" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="200" cy="14" r="6" fill="none" stroke="var(--accent)" stroke-width="3.2"/></svg>`;
  }
  inner += `<div class="brandfoot">Redeeming Productivity</div><div class="pagefoot">${i + 1} / ${S.length}</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
