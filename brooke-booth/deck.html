<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The One Thing That Changes a Mixed Faith Marriage</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f1;
  --panel:#fffdf7;
  --rule:#e4ddcf;
  --ink:#2d2a26;
  --muted:#6f6a62;
  --accent:#fab702;
  --gold:#b07d05;
  --teal:#015c61;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'PT Sans',sans-serif;-webkit-font-smoothing:antialiased}
#deck{max-width:1040px;margin:0 auto;padding:40px 22px 90px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:60px 62px;margin:22px 0;
  box-shadow:0 18px 44px rgba(90,64,40,.07);position:relative;overflow:hidden}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
.kick{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
h1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:38px;line-height:1.12}
.sub{font-size:23px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:92%}
.arc{display:inline-block;margin-top:34px}
.arc svg{display:block}
ul{list-style:none;margin-top:26px}
li{font-size:22px;line-height:1.45;padding:14px 0 14px 40px;position:relative;border-bottom:1px solid var(--rule)}
li:last-child{border-bottom:none}
li::before{content:'';position:absolute;left:4px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.big{font-family:'Montserrat',sans-serif;font-weight:700;font-size:44px;line-height:1.14;color:var(--teal)}
.part{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.disc{font-size:16px;color:var(--muted);margin-top:28px;line-height:1.5;border-top:1px solid var(--rule);padding-top:20px}
.step{font-family:'Montserrat',sans-serif;font-weight:700;font-size:26px;color:var(--teal);margin-top:24px}
.title .slide{padding:84px 62px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live class for Latter-day Saint couples', h:'The One Thing That Changes a Mixed Faith Marriage', s:'How to rebuild love and connection when one of you has had a faith transition, without either of you having to pretend.'},
  {t:'who', k:'Who this is for', h:'You love each other. The faith gap is the thing in the room.', s:'One of you has changed your relationship with the Church. You are not trying to win the argument anymore. You just want to feel close again.', b:['The believing spouse who feels like they are losing their partner','The transitioning spouse who feels judged in their own home','Couples who are not in crisis, but are quietly drifting']},
  {t:'trap', k:'The trap', h:'You keep trying to change what your spouse believes.', s:'It is the most natural thing in the world to do. It is also the one move that guarantees more distance. The harder you push for them to see it your way, the further apart you get.'},
  {t:'reframe', k:'The hard truth', h:'You cannot argue someone back into connection.', s:'And you were never supposed to. The leverage was never your spouse. It was the thoughts you are having about the gap between you.'},
  {t:'part', n:'Part One', h:'Why faith differences feel like the end'},
  {t:'problem', k:'The real problem', h:'It is not the belief. It is the meaning you attach to it.', s:'A mixed faith marriage does not hurt because two people believe different things. It hurts because of what each person decides the difference means about love, loyalty, and the future.'},
  {t:'problem', k:'The spiral', h:'The story runs on repeat.', b:['"If they really loved me, they would still believe."','"If they respected me, they would stop trying to fix me."','"We are raising the kids in two different worlds."','Every conversation starts already losing.']},
  {t:'part', n:'Part Two', h:'The mechanism that actually moves it'},
  {t:'mechanism', k:'The shift', h:'The only person you can change is you.', s:'And it turns out that is more than enough. When you change the thought patterns feeding your own misery, the whole dynamic between you shifts, even before your spouse does anything differently.'},
  {t:'pillars', k:'The method', h:'12 skills for a loving mixed faith marriage', s:'This is the heart of the work. Not a debate strategy. A set of skills you can practice on your own, starting tonight. Here are four of them.'},
  {t:'skill', k:'Skill', h:'Hold different beliefs without the distance', s:'How to stay warm and connected with someone who sees the biggest questions in life differently than you do.'},
  {t:'skill', k:'Skill', h:'Speak up without it turning into a fight', s:'How to say the hard, true thing about what you need, in a way your spouse can actually hear.'},
  {t:'skill', k:'Skill', h:'Navigate family, holidays and the kids', s:'The flashpoints. How to handle Sunday, the extended family, and parenting across belief without re-litigating it every week.'},
  {t:'skill', k:'Skill', h:'Rebuild closeness and trust', s:'How intimacy and trust come back once the relationship stops being a referendum on who is right.'},
  {t:'part', n:'Part Three', h:'On the other side of the gap'},
  {t:'looks', k:'The outcome', h:'A marriage that holds, with the difference still in it.', s:'Not a marriage where the faith gap disappeared. A marriage where it stopped running the house. Where you can disagree on Sunday and still reach for each other on Monday.'},
  {t:'whyme', k:'Why me', h:'I am not teaching you from the outside.', s:'Born and raised in the Church. BYU, a mission, a temple marriage, kids. Then my own faith transition, inside my own marriage. I have lived the exact thing you are living, and I coach from the other side of it.'},
  {t:'recap', k:'What you leave with', h:'Three things to take home tonight', b:['Why trying to change your spouse has been backfiring','The one shift that changes the dynamic without waiting on them','Four of the twelve skills, ready to practice this week']},
  {t:'cta', k:'Your next step', h:'Let us talk about your marriage, specifically.', s:'If tonight landed, the next step is a free, no pressure conversation about where you two are and whether coaching is the right fit.', step:'Book your free consultation'},
];
const deck = document.getElementById('deck');
function esc(x){return x;}
S.forEach(function(sl){
  const el = document.createElement('section');
  el.className = 'slide ' + sl.t;
  let html = '';
  if(sl.k) html += '<div class="kick">'+sl.k+'</div>';
  if(sl.n) html += '<div class="part">'+sl.n+'</div>';
  if(sl.t==='mechanism'){ html += '<div class="big">'+sl.h+'</div>'; }
  else if(sl.n && sl.h){ html += '<h2 style="margin-top:12px">'+sl.h+'</h2>'; }
  else if(sl.t==='title'){ html += '<h1>'+sl.h+'</h1>'; }
  else { html += '<h2>'+sl.h+'</h2>'; }
  if(sl.s) html += '<div class="sub">'+sl.s+'</div>';
  if(sl.b){ html += '<ul>'; sl.b.forEach(function(x){ html += '<li>'+x+'</li>'; }); html += '</ul>'; }
  if(sl.step) html += '<div class="step">'+sl.step+'</div>';
  if(sl.t==='cta') html += '<div class="disc">This class is educational. No specific outcome or result is guaranteed. Results vary from couple to couple and depend on your own situation and effort.</div>';
  if(sl.t==='title' || sl.t==='reframe'){ html += '<div class="arc"><svg width="240" height="70" viewBox="0 0 240 70" fill="none"><path d="M10 60 Q70 6 118 34" stroke="#015c61" stroke-width="4" stroke-linecap="round"/><path d="M230 60 Q170 6 122 34" stroke="#fab702" stroke-width="4" stroke-linecap="round"/><circle cx="120" cy="35" r="6" fill="#b07d05"/></svg></div>'; }
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
