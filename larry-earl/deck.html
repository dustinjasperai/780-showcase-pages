<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The OPOP Employer-Sales Masterclass &middot; Dr. Larry Earl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f2ea; --panel:#ffffff; --rule:#ded6c4;
    --sienna:#b5651d; --steel:#2f4858; --ink:#23281f; --grey:#5b5344; --dim:#8c8368;
  }
  html,body{height:100%}
  body{background:#181410;font-family:'IBM Plex Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#181410}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--sienna);margin-bottom:2.4vh}
  h1{font-family:'Petrona',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.4vw}
  .t-normal h1{font-size:3vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.75vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'IBM Plex Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--steel);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.2vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--sienna),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#3a2f22 0%,#181410 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3vw;max-width:82%;font-style:italic;color:#f4ede0;font-weight:400}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#2b2418 0%,#181410 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.5vw;max-width:82%;color:#f7f1e3}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--sienna);color:#f0dcc3;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#9c9484}
  .t-title .disc,.t-normal .disc{text-align:left}
  .motif{position:absolute;pointer-events:none;opacity:.9}
  .title-motif{right:7.5%;bottom:8%;width:15vw}
  .corner-motif{right:6%;bottom:7.5%;width:7vw;opacity:.4}
  .brandline{font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--sienna);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--sienna);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#bfb49b;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#bfb49b;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#bfb49b;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.4vw}.t-dark h1{font-size:5.2vw}.t-cta h1{font-size:6.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">OPOP &middot; NAOHP</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- clipboard / checklist motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="clipboard" viewBox="0 0 200 220">
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="30" y="26" width="140" height="176" rx="10" stroke="#b5651d" opacity="0.85"/>
    <rect x="70" y="14" width="60" height="24" rx="6" stroke="#2f4858" opacity="0.8"/>
    <path d="M58 92 l16 16 32-34" stroke="#2f4858" opacity="0.85"/>
    <line x1="118" y1="98" x2="146" y2="98" stroke="#ded6c4" opacity="0.9"/>
    <path d="M58 140 l16 16 32-34" stroke="#2f4858" opacity="0.55"/>
    <line x1="118" y1="146" x2="146" y2="146" stroke="#ded6c4" opacity="0.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The OPOP Employer-Sales Masterclass',sub:'How independent urgent care owners turn occupational medicine into real employer contracts, not just another exam room. Built from the same 5-session framework and market data used inside OPOP.',brand:true,motif:'title'},
 {t:'normal',k:'Who this is for',title:'Independent urgent care owners adding occupational medicine as a service line.',body:'You already run urgent care well. Occmed is not more of the same. It is sold to employers, not treated one patient at a time, and that is where most owners get stuck.'},
 {t:'normal',k:'What you’ll walk away with',title:'A clear read on how employer occmed contracts actually get won.',body:'The same employer-sales logic taught inside OPOP’s 5 sessions, narrowed to the exact decision point of adding occmed to an existing urgent care business.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'Every practice, market, and payer mix is different. What matters is the version of this that fits yours.',disc:'Educational content. Nothing here is a promise of income, contracts, or business results. Results vary and no outcome is guaranteed.'},
 {t:'normal',k:'Who’s teaching this',title:'Dr. Larry Earl, MD. President and CEO of NAOHP.',body:'Owned and operated multi-site, multi-state urgent care and occupational medicine centers for over 40 years, including 17 years running Immediate Medical Care Centers in northern New Jersey, sold to Concentra. Now personally consults for practices from independent owners to billion-dollar health systems.'},

 {t:'section',idx:'Part One',title:'The Employer-Sales Gap'},
 {t:'normal',k:'Where it actually breaks',title:'Most owners treat occmed like more urgent care.',body:'Urgent care is built to serve whoever walks in. Occmed is built to be sold, in advance, to an employer’s HR or safety director, before a single worker ever visits the clinic.'},
 {t:'normal',k:'What most owners try first',title:'A new sign, a biller, and a generic marketing push.',body:'None of that opens a conversation with the employers who actually sign workers’ comp, DOT, and on-site clinic contracts. It fills the schedule with walk-ins, not employer accounts.'},
 {t:'dark',title:'Occmed isn’t urgent care with a different name on the door. It’s sold to employers, not treated one patient at a time.'},
 {t:'normal',k:'The real cost',title:'A service line that never breaks even.',body:'Without an employer-sales motion, the occmed line stays a cost center: staffed and equipped, but never carrying the contract volume that makes it profitable.'},

 {t:'section',idx:'Part Two',title:'The OPOP Framework'},
 {t:'normal',k:'Sessions 1 and 2',title:'Needs Assessment and the Financial Deep Dive.',body:'Before any sales motion starts, OPOP reviews where the occmed line actually stands today: what it costs, what it earns, and where the real gap between the two comes from.'},
 {t:'normal',k:'The data behind it',title:'The Occmed Market Analyzer.',body:'A market-sizing tool that projects potential annual occmed revenue for a defined service area, so a sales and marketing budget is set from a real number, not a guess.'},
 {t:'normal',k:'Sessions 3 through 5',title:'Service line, staffing, technology.',body:'What employer-facing services to add or cut, who on the team actually sells and services those accounts, and what technology supports the volume once contracts start landing.'},
 {t:'dark',title:'A market analysis without a sales motion behind it is just a number on a page.'},

 {t:'section',idx:'Part Three',title:'Built By Someone Who Sold One'},
 {t:'normal',k:'The shift',title:'Forty years of building it, then selling it.',body:'Most advice on occmed growth comes from consultants who never owned the P&L. This comes from an owner who built a multi-site urgent care and occmed group and sold it to Concentra, one of the same national chains independent owners now compete against.'},
 {t:'normal',k:'What that looks like',title:'Employer contracts landing on a schedule you can see coming.',body:'Not a lucky referral here and there. A repeatable motion: size the market, decide what to sell, staff it, and go after the accounts that are actually there to win.'},

 {t:'section',idx:'Beyond the Masterclass',title:'Take the Employer-Sales Motion Further'},
 {t:'normal',k:'Free, then deeper',title:'Start with the masterclass. Go deeper with OPOP.',body:'Then, for owners who want hands-on help landing the first contracts: the 12-Week Occmed Sales Consulting and Coaching program, through naohp.com.'},
 {t:'cta',title:'Build the employer-sales motion your occmed line is missing.',chips:['Explore OPOP','Visit naohp.com'],disc:'Educational content only. No income, contract, or business result is guaranteed. Results vary by practice and market.'},
];

const deck=document.getElementById('deck');
function motifIcon(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#clipboard"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">OPOP &middot; <b>NAOHP</b> &middot; Dr. Larry Earl</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motifIcon(s.motif);
  else if(s.t==='title') h+=motifIcon('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
