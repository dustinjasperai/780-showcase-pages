<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconstruction, Not Recovery - A Midlife Clarity Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F2E8;      /* their light warm cream ground (oklch 0.955/79) */
    --panel:#FFFFFF;   /* white panel */
    --ink:#1B1E24;     /* their deep cool ink (oklch 0.16/260) */
    --rule:#D8C9A8;    /* tan rule, derived from their gold (oklch 0.638/82) */
    --accent:#357B8C;  /* their one chromatic brand color, muted teal (oklch 0.585/217.5) */
    --muted:#6B6456;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:0 1px 2px rgba(27,30,36,.04)}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:20px}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:34px;line-height:1.14;margin-bottom:18px}
  .sub{font-size:20px;color:var(--muted);margin-top:22px;max-width:62ch;line-height:1.5;font-weight:300}
  p{font-size:19px;line-height:1.6;max-width:64ch;color:var(--ink);font-weight:300;margin-top:14px}
  .lead{font-size:23px;line-height:1.5;font-weight:400}
  ul{list-style:none;margin-top:20px}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 34px;position:relative;border-top:1px solid var(--rule);max-width:64ch;font-weight:300}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .big{font-family:'Playfair Display',Georgia,serif;font-size:40px;line-height:1.16;font-weight:600;max-width:20ch}
  .branch{display:flex;gap:18px;margin-top:26px;flex-wrap:wrap}
  .branch .b{flex:1 1 220px;border-left:3px solid var(--accent);padding:4px 0 4px 18px}
  .branch .b h3{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;margin-bottom:8px}
  .branch .b span{font-size:16px;color:var(--muted);line-height:1.45;font-weight:300}
  .foot{position:absolute;bottom:20px;left:56px;font-size:13px;color:var(--muted);letter-spacing:.04em}
  .num{position:absolute;bottom:20px;right:56px;font-size:13px;color:var(--rule);font-weight:600}
  .cta h2{font-size:38px}
  .disc{font-size:13px;color:var(--muted);margin-top:28px;max-width:70ch;line-height:1.5;font-weight:300}
  .em{color:var(--accent)}
  .title-slide{background:var(--ink);border-color:var(--ink)}
  .title-slide h1,.title-slide .sub{color:var(--bg)}
  .title-slide .kicker{color:var(--rule)}
  .title-slide .foot{color:var(--rule)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'slide title-slide', html:`
    <div class="kicker">A Midlife Clarity Masterclass</div>
    <h1>Reconstruction,<br>Not Recovery</h1>
    <div class="sub">How to stop trying to get your old life back, and start building the one that actually fits now.</div>
    <div class="foot">Ellen Scherr &middot; Life Branches</div>`},

  {t:'promise', cls:'slide', html:`
    <div class="kicker">What you'll leave with</div>
    <h2>One hour. Three things you can use the same day.</h2>
    <ul>
      <li>A name for what is actually happening to you, so it stops feeling like you are falling apart.</li>
      <li>A simple map of the three moves that get women through the messy middle of midlife.</li>
      <li>One honest first step you can take this week, without waiting to feel ready.</li>
    </ul>
    <div class="num">02</div>`},

  {t:'who', cls:'slide', html:`
    <div class="kicker">Who this is for</div>
    <h2>You are 40-something, and something feels off.</h2>
    <p>The marriage ended, or the kids left, or the career you built stopped fitting. On paper you are fine. Inside, you keep waiting to feel like yourself again.</p>
    <p>You are not in crisis. You are in transition. Those are not the same thing, and almost nobody tells you the difference.</p>
    <div class="num">03</div>`},

  {t:'trap', cls:'slide', html:`
    <div class="kicker">The trap</div>
    <p class="lead">Most midlife advice makes you one quiet promise:</p>
    <div class="big">"We'll help you get back to the woman you used to be."</div>
    <p>It sounds like comfort. It is actually the thing keeping you stuck.</p>
    <div class="num">04</div>`},

  {t:'reframe', cls:'slide', html:`
    <div class="kicker">The hard reframe</div>
    <div class="big">That woman doesn't exist anymore. And chasing her is why you feel lost.</div>
    <p>Midlife is not a breakdown of the old you. It is the start of a different one. Recovery tries to restore what was. <span class="em">Reconstruction builds what is next.</span></p>
    <div class="num">05</div>`},

  {t:'part1', cls:'slide', html:`
    <div class="kicker">Part One &middot; The real problem</div>
    <h2>Your nervous system is running a transition with no map.</h2>
    <p>Hormones shift. Roles fall away. The people-pleasing that ran the first half of your life stops paying off. All of it at once, and no instructions.</p>
    <p>So you read it as "I am broken." It is not brokenness. It is a stage, and stages have an order.</p>
    <div class="num">06</div>`},

  {t:'alone', cls:'slide', html:`
    <div class="kicker">The thing nobody says out loud</div>
    <div class="big">"I thought I was the only one."</div>
    <p>It is the sentence I hear most. The anger, the grief, the strange numbness, the wanting more and feeling guilty for it. It is not a flaw in you. It is the terrain. You are just the first person who said it out loud.</p>
    <div class="num">07</div>`},

  {t:'why-fails', cls:'slide', html:`
    <div class="kicker">Why the usual advice fails</div>
    <h2>"Find yourself again" has no steps.</h2>
    <p>It is a feeling dressed up as a plan. You cannot act on it, so you wait, and waiting becomes another year in a life you have already outgrown.</p>
    <p>Clarity is not a mood you stumble into. It is a sequence you walk.</p>
    <div class="num">08</div>`},

  {t:'part2', cls:'slide', html:`
    <div class="kicker">Part Two &middot; The Life Branches Approach</div>
    <h2>Three moves, in order. Not a ten-step program.</h2>
    <div class="branch">
      <div class="b"><h3>Release</h3><span>What you are ready to leave behind.</span></div>
      <div class="b"><h3>Rediscover</h3><span>What you actually want now.</span></div>
      <div class="b"><h3>Redirect</h3><span>Where you are ready to go next.</span></div>
    </div>
    <p>A tree does not recover its old leaves. It drops them, and it branches. Same move, same order.</p>
    <div class="num">09</div>`},

  {t:'release', cls:'slide', html:`
    <div class="kicker">Move One &middot; Release</div>
    <h2>Name what you are ready to put down.</h2>
    <p>Old expectations. Roles you took on at 25 and never questioned. The version of you that kept everyone else comfortable. You do not "let go" by force. You name it honestly, and you give yourself permission to grieve it.</p>
    <p>Grief is not weakness here. It is the doorway. You cannot want something new while you are still gripping the old.</p>
    <div class="num">10</div>`},

  {t:'rediscover', cls:'slide', html:`
    <div class="kicker">Move Two &middot; Rediscover</div>
    <h2>Separate what you want from what you were told to want.</h2>
    <p>After decades of "shoulds," your real wants get quiet. This move is the work of turning the volume back up: your actual priorities, your curiosity, the things that light you up when nobody is watching or judging.</p>
    <p>You are not being selfish. You are collecting the raw material for the next version of your life.</p>
    <div class="num">11</div>`},

  {t:'redirect', cls:'slide', html:`
    <div class="kicker">Move Three &middot; Redirect</div>
    <h2>Turn clarity into one decision you can act on.</h2>
    <p>Insight that never moves is just a prettier way of staying stuck. Redirect is where it becomes real: a boundary you set, a decision you stop deferring, a first concrete step toward where you are going.</p>
    <p>You do not need the whole staircase. You need the next stair, taken on purpose.</p>
    <div class="num">12</div>`},

  {t:'assessment', cls:'slide', html:`
    <div class="kicker">Where you start</div>
    <h2>First, find out which branch you are actually on.</h2>
    <p>Most women do not know whether they are still in Release or already reaching for Redirect, so they push for action before they are ready and it does not hold.</p>
    <p>The Midlife Clarity Assessment names your stage on the map, so the work you do next is the work that actually fits where you are.</p>
    <div class="num">13</div>`},

  {t:'part3', cls:'slide', html:`
    <div class="kicker">Part Three &middot; The six-week shift</div>
    <h2>Clarity comes before confidence. Not the other way around.</h2>
    <p>You have been waiting to feel ready. Ready never shows up first. You get clear on the next move, you make it, and the confidence arrives after, built from evidence that you can.</p>
    <p>Six weeks from now the goal is not a finished life. It is a woman who knows which direction she is walking and why.</p>
    <div class="num">14</div>`},

  {t:'before-after', cls:'slide', html:`
    <div class="kicker">The shift</div>
    <ul>
      <li>From "I just want to feel normal again" to "I know what I am building."</li>
      <li>From waiting for certainty to making the next clear move.</li>
      <li>From "I thought I was the only one" to a plan with an order to it.</li>
    </ul>
    <div class="num">15</div>`},

  {t:'why-me', cls:'slide', html:`
    <div class="kicker">Why listen to me</div>
    <h2>I am not teaching this from the outside.</h2>
    <p>I went back to school at 46 to become a therapist while my 18-year marriage was ending and I was solo-parenting two kids. I rebuilt my life from the ground up, and then I built the map I wish I had been handed.</p>
    <p>I write from inside the experience, not from clinical distance. That is the whole point of Life Branches.</p>
    <div class="num">16</div>`},

  {t:'objection', cls:'slide', html:`
    <div class="kicker">"Isn't this just therapy?"</div>
    <h2>No. Therapy looks back. This looks forward.</h2>
    <p>Therapy helps you understand how you got here, and it matters. The Life Branches Approach is a forward map: name the stage, do the three moves, leave with a direction. It is clarity and action, built on real clinical insight.</p>
    <div class="num">17</div>`},

  {t:'recap', cls:'slide', html:`
    <div class="kicker">The whole thing, in one breath</div>
    <div class="big">Release what is over. Rediscover what you want. Redirect toward it.</div>
    <p>You are not falling apart. You are between branches. And there is an order to finding the next one.</p>
    <div class="num">18</div>`},

  {t:'cta', cls:'slide cta', html:`
    <div class="kicker">Your next step</div>
    <h2>Find out which branch you are on.</h2>
    <p>If something in this hit close, start with the Midlife Clarity Assessment at lifebranches.com. It names where you actually are, so your next move is the right one for this stage, not the last one.</p>
    <p class="lead">You cannot go back. You can branch forward.</p>
    <div class="disc">Educational content only. Nothing here is medical, psychological, or financial advice, and no specific outcome or result is guaranteed. Every woman's midlife transition is her own; your results will vary.</div>
    <div class="foot">Ellen Scherr &middot; Life Branches &middot; lifebranches.com</div>`}
];
const deck = document.getElementById('deck');
S.forEach(s => {
  const d = document.createElement('section');
  d.className = s.cls || 'slide';
  d.innerHTML = s.html;
  deck.appendChild(d);
});
</script>
</body>
</html>
