<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Genius Trap - A Live Masterclass with Adam Quiney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17120e; --panel:#241a12; --rule:#3a2a1c; --accent:#e0772c; --ink:#efe7dd;
    --muted:#b9a99a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto}
  .slide{min-height:88vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 7vw;border-bottom:1px solid var(--rule);position:relative}
  .k{font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:1.4rem}
  h1{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:clamp(2.6rem,7vw,5rem);
    line-height:1.03;letter-spacing:-.01em}
  h2{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:clamp(2rem,4.6vw,3.3rem);
    line-height:1.08;letter-spacing:-.01em}
  .sub{font-size:clamp(1.05rem,2vw,1.4rem);line-height:1.5;color:#e4d8cb;margin-top:1.6rem;max-width:30ch}
  .title .sub{max-width:34ch}
  ul{list-style:none;margin-top:2rem;max-width:40ch}
  li{font-size:clamp(1.05rem,1.9vw,1.35rem);line-height:1.45;padding:.85rem 0 .85rem 1.6rem;
    border-top:1px solid var(--rule);position:relative;color:#e9decd}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:1.45rem;width:.6rem;height:.6rem;
    background:var(--accent);border-radius:50%}
  .part h2{font-size:clamp(2.4rem,6vw,4.2rem)}
  .part .accentbar{width:64px;height:4px;background:var(--accent);margin-bottom:2rem}
  .frame{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:clamp(1.8rem,4vw,3rem)}
  .frame h2{color:var(--ink)}
  .em{color:var(--accent)}
  .disc{margin-top:2.4rem;font-size:.8rem;line-height:1.5;color:#9c8f80;max-width:52ch}
  .foot{position:absolute;bottom:3vh;left:7vw;font-size:.75rem;letter-spacing:.12em;
    text-transform:uppercase;color:#7d7265}
  .title{min-height:100vh}
  .title h1{font-size:clamp(3rem,9vw,6.4rem)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', k:'A live masterclass for the smartest person in the room', h:'The Genius Trap', sub:'Why the smartest leaders stay stuck, and how to lead from your Zone of Genius.'},
  {t:'hook', k:'The promise', h:'A different kind of hour', sub:'Not more tools. A hard look at the one thing actually keeping you stuck, and the shift that frees it.'},
  {t:'who', k:'Who this is for', h:'You are the one everyone relies on', list:['You have always been the smartest person in the room','People bring you the hard problems and you solve them','And quietly, you are exhausted, and a little trapped']},
  {t:'hook', k:'The uncomfortable part', h:'Your intelligence got you here. It is also the ceiling.', sub:'The thing that made you exceptional is now the thing keeping you stuck.'},
  {t:'part', k:'Part one', h:'The trap', sub:'What actually keeps smart leaders stuck.'},
  {t:'list', k:'What most leadership training gets wrong', h:'More tools is the trap, not the cure', list:['Smart people are trained to collect answers, frameworks, certifications','So the reflex to feeling stuck is to add one more','But the pile of tools is the problem, not the solution','You cannot think your way out of a trap your thinking built']},
  {t:'list', k:'The trap', h:'You have been performing so long you forgot it was armor', list:['Being the smartest meant always having the answer','So you lead from doing, never from being','The armor keeps you safe, and keeps you capped','Underneath it, your actual gift stays hidden']},
  {t:'part', k:'Part two', h:'Your Zone of Genius', sub:'The shift is not more doing. It is who you are being.'},
  {t:'frame', k:'The core idea', h:'Genius is who you are <span class="em">being</span>, not what you are doing', sub:'Your Zone of Genius is a function of your essence, your unique way of being. It is never a function of what you are doing, and it is always available while you do whatever is in front of you.'},
  {t:'frame', k:'Genius and shadow', h:'Every light casts a shadow', sub:'The thing you hate most about yourself is the shadow of your gift. You reclaim the gift by tracing the shadow back to the light that casts it, not by fixing the flaw.'},
  {t:'list', k:'Owning your genius', h:'Stop dimming your light', list:['You were taught that owning your gift is arrogant, or sets you up to be torn down','So you hide it, over-emphasize it, or apologize for it','Each of those is a way of leading at half power','The work is owning the gift and leading through the reaction it creates']},
  {t:'part', k:'Part three', h:'What changes when you drop the armor', sub:'Leading from essence, in the room you are already in.'},
  {t:'list', k:'In practice', h:'The shift, made real', list:['You stop managing how you are seen and start leading from who you are','The reaction you used to avoid becomes the work, not the threat','Your gift stops being a liability and becomes the point','You lead at full power, with less armor and far less effort']},
  {t:'list', k:'Two kinds of leaders', h:'Adding versus becoming', list:['One keeps adding tools, techniques, and credentials','The other changes who they are being','Only one of them ever stops being exhausted']},
  {t:'list', k:'The three moves', h:'What we covered', list:['Name the trap: your intelligence is the ceiling, not the engine','Find the gift hidden in your shadow','Own it, and lead through the reaction']},
  {t:'cred', k:'Why me', h:'I built this for the smartest person in the room', sub:'I am a former lawyer and software developer turned executive mentor. I work with leaders and coaches whose intelligence is the very thing holding them back, and I have spent years helping them lead from their Zone of Genius rather than their armor.'},
  {t:'cta', k:'Your next step', h:'Come do the work', sub:'If this is the conversation you have been missing, join the waitlist and book a time to talk about The Intensive. We work on who you are being, not on more tools.', disc:'This masterclass is educational and reflects one approach to leadership development. No income or specific result is guaranteed. Results vary and depend on your own effort, context, and circumstances.'}
];
function esc(x){return x;}
function render(){
  const root=document.getElementById('deck');
  S.forEach(s=>{
    const sec=document.createElement('section');
    sec.className='slide '+s.t;
    let html='';
    if(s.k) html+='<div class="k">'+s.k+'</div>';
    if(s.t==='part') html+='<div class="accentbar"></div>';
    const tag=(s.t==='title')?'h1':'h2';
    if(s.t==='frame'){
      html='<div class="frame">'+(s.k?'<div class="k">'+s.k+'</div>':'')+'<h2>'+s.h+'</h2>'+(s.sub?'<p class="sub">'+s.sub+'</p>':'')+'</div>';
      sec.innerHTML=html; root.appendChild(sec); return;
    }
    if(s.h) html+='<'+tag+'>'+s.h+'</'+tag+'>';
    if(s.sub) html+='<p class="sub">'+s.sub+'</p>';
    if(s.list){ html+='<ul>'; s.list.forEach(it=>html+='<li>'+it+'</li>'); html+='</ul>'; }
    if(s.disc) html+='<p class="disc">'+s.disc+'</p>';
    sec.innerHTML=html;
    root.appendChild(sec);
  });
}
render();
</script>
</body>
</html>
