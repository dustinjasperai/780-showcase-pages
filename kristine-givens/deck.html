<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is Your Franchise Model Actually Sustainable? — Kristine Givens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eff1e6;        /* her page cream */
    --panel:#ffffff;
    --rule:#d9dcc9;      /* muted cream */
    --ink:#0f1928;       /* her dominant navy */
    --muted:#4a5565;
    --accent:#0d628f;    /* her teal link color */
    --display:'EB Garamond', Georgia, serif;
    --body:'Montserrat', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:52px 54px;margin:0 0 22px;min-height:430px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(15,25,40,.03)}
  .num{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .num::after{content:"";display:block;width:34px;height:2px;background:var(--accent);margin-top:8px;opacity:.5}
  h1{font-family:var(--display);font-weight:600;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.1;margin-bottom:6px}
  .lead{font-family:var(--display);font-size:24px;line-height:1.35;color:var(--muted);margin-top:18px}
  p{font-size:17px;line-height:1.6;color:var(--muted);margin-top:14px;max-width:62ch}
  .kicker{font-family:var(--body);font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  ul{margin:18px 0 0 0;list-style:none}
  li{font-size:18px;line-height:1.5;color:var(--ink);padding:14px 0 14px 26px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;border:2px solid var(--accent);border-radius:2px}
  li b{font-weight:600}
  li span{display:block;font-size:14px;color:var(--muted);margin-top:4px;font-weight:400}
  .pill{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:6px 14px;margin-bottom:22px}
  .big{font-size:46px;line-height:1.08}
  .step{font-family:var(--body);font-size:20px;font-weight:600;color:var(--ink);margin-top:22px}
  .step b{color:var(--accent);font-weight:600}
  .disclaimer{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:28px;padding-top:16px;border-top:1px solid var(--rule);max-width:70ch}
  .foot{font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:28px}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:34px}h2{font-size:27px}.big{font-size:32px}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S=[
  {t:'title', pill:'A live masterclass for franchisors', h:'Is Your Franchise Model Actually Sustainable?', lead:'The financial-viability questions most franchisors skip, from a CPA who has also owned a franchise.', foot:'Kristine Givens · Franchise Advisory Services & Education'},

  {t:'who', num:'Who this is for', h:'You are adding units. You are not sure the math still works.', ps:['You run an emerging or established franchise. Demand looks healthy, the pipeline of candidates is real, and the pressure is always the same: sell the next territory, open the next location, grow the count.']},

  {t:'who', num:'Who this is for', h:'The question that keeps getting pushed off', ps:['Does each unit actually clear once you strip out the excitement of growth? Most franchisors answer that far too late, after the system is already built around the wrong assumption.']},

  {t:'reframe', num:'The reframe', h:'Growth can hide a model that does not pay.', hclass:'big', ps:['Adding locations makes the top line look alive. It can also bury weak unit economics under volume until a few franchisees start to struggle, renewals wobble, and the system you built to scale starts working against you.']},

  {t:'problem', num:'Part one · the core problem', h:'Everyone will sell you more units. Almost no one checks the model underneath them.', ps:['The franchise world is built to help you expand: more leads, more territories, more development. That work matters. It also assumes the thing you are multiplying is sound.']},

  {t:'problem', num:'Part one · the core problem', h:'Scaling does not fix a weak unit. It multiplies it.', ps:['If a single location is only marginally profitable, ten of them are ten marginal problems, not a healthy system. The model has to work at one before it is allowed to work at fifty.']},

  {t:'cost', num:'Part one · the cost', h:'What an unsustainable model costs you later', bullets:[{b:'Frustrated franchisees', s:'Unhappy owners are not good for the system. They renew less, refer less, and operate off-standard.'},{b:'Drift across locations', s:'Without a model that holds, every unit solves problems its own way and the brand experience splinters.'},{b:'A valuation built on sand', s:'Buyers and lenders look straight through unit count to unit economics. So should you.'}]},

  {t:'framework', num:'Part two · the framework', h:'The Franchise Sustainability Check', ps:['Before you scale, four things have to be true at the same time. Most reviews look at one and call it done. We will walk all four.'], bullets:[{b:'1. Unit economics that actually clear'},{b:'2. An operations manual that holds at scale'},{b:'3. Franchisee training that sticks'},{b:'4. The right franchisee, standards, and vendor control'}]},

  {t:'pillar', num:'Pillar one', h:'Model the economics the way a CFO would', ps:['We model and analyze the financial viability of a single unit first: real revenue ramp, real cost structure, the royalty and fee load, and what the owner actually takes home in year one and year three.','If the unit does not clear a healthy margin on its own, no amount of development spend makes the system sustainable. This is the number everything else depends on.']},

  {t:'pillar', num:'Pillar two', h:'An operations manual that survives contact with scale', ps:['The manual is where consistency lives or dies. We review organizational gaps, the operations manual, quality standards, and the vendor network, then tighten the few things that actually move the brand experience across every location.']},

  {t:'pillar', num:'Pillar three', h:'Training is a profit lever, not an onboarding checkbox', ps:['Franchisee training can make or break a franchise. Effective training means your methods are communicated clearly and consistently across all locations, so the customer gets the same experience everywhere and the franchisee actually succeeds.','When gaps show up across the network, that is the signal the training program is due for an overhaul, not the franchisees.']},

  {t:'pillar', num:'Pillar four', h:'The right franchisee, the right standards, the right communication', ps:['Define the ideal franchisee profile so you recruit owners who can run the model, set the communication standards that keep the network aligned, and hold the vendor relationships that protect your quality and your margins.']},

  {t:'close', num:'Part three · what becomes possible', h:'A system you can defend to a franchisee, a lender, or a buyer', ps:['When the four hold together, scaling stops being a leap of faith. You can show a candidate why the unit works, show a lender why the system is sound, and grow the count knowing each new unit strengthens the model instead of straining it.']},

  {t:'why', num:'Why me', h:'I have sat on every side of this table', ps:['I started as a tax consultant at Ernst & Whinney, then built and sold a boutique accounting firm serving affluent families and single-family offices to a global financial institution. After that I invested in and operated a national franchise as a franchisee.','So I read a franchise model the way a CFO reads a P&L, and I know what it feels like to actually run a unit. Results-focused, no-nonsense. That is the lens I bring to your system.']},

  {t:'recap', num:'The check, in one line', h:'Sustainable before scalable', ps:['Unit economics that clear, an operations manual that holds, training that sticks, and the right owners under standards you control. Get those four right and growth finally works for you.']},

  {t:'cta', kicker:'Your next step', h:'Let us pressure-test your model before you scale it.', ps:['If you are preparing to add units, or you suspect the economics are not as healthy as the growth looks, let us run your model through the Sustainability Check together.'], step:'Schedule a consultation at <b>kristinegivens.com</b>', disclaimer:'This masterclass is for educational purposes only. It is not financial, legal, tax, or investment advice, and it is not an offer to sell or the solicitation of an offer to buy a franchise. No specific financial result is guaranteed. Results vary and depend on many factors outside any advisor’s control.', foot:'Kristine Givens · Franchise Advisory Services & Education'}
];

const deck=document.getElementById('deck');
for(const s of S){
  const sec=document.createElement('section');
  sec.className='slide'+(s.t==='cta'?' cta':'');
  let html='';
  if(s.pill) html+='<div class="pill">'+s.pill+'</div>';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.num) html+='<div class="num">'+s.num+'</div>';
  if(s.t==='title'){
    html+='<h1>'+s.h+'</h1>';
  } else {
    html+='<h2'+(s.hclass?' class="'+s.hclass+'"':'')+'>'+s.h+'</h2>';
  }
  if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
  if(s.ps) for(const p of s.ps) html+='<p>'+p+'</p>';
  if(s.bullets){ html+='<ul>'; for(const b of s.bullets){ html+='<li><b>'+b.b+'</b>'+(b.s?'<span>'+b.s+'</span>':'')+'</li>'; } html+='</ul>'; }
  if(s.step) html+='<div class="step">'+s.step+'</div>';
  if(s.disclaimer) html+='<p class="disclaimer">'+s.disclaimer+'</p>';
  if(s.foot) html+='<div class="foot">'+s.foot+'</div>';
  sec.innerHTML=html;
  deck.appendChild(sec);
}
</script>
</body>
</html>
