<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Teacher-to-VA Path - A Free Live Masterclass with Arianna Vernier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffdfb;
  --panel:#f3fbfb;
  --rule:#e6d8e6;
  --ink:#292929;
  --muted:#69727d;
  --accent:#c451ac;
  --accent2:#12afa6;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Open Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(18px,4vw,64px)}
.slide{
  display:none;width:min(1040px,100%);max-height:100%;overflow:auto;
  background:var(--bg);
}
.slide.on{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-family:'Montserrat';font-weight:700;font-size:clamp(12px,1.4vw,15px);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1{font-family:'Montserrat';font-weight:800;letter-spacing:-.015em;line-height:1.04;font-size:clamp(34px,6vw,72px)}
h2{font-family:'Montserrat';font-weight:700;letter-spacing:-.01em;line-height:1.08;font-size:clamp(28px,4.4vw,52px)}
h3{font-family:'Montserrat';font-weight:700;font-size:clamp(19px,2.2vw,26px);letter-spacing:-.005em}
p{font-size:clamp(16px,1.9vw,22px);line-height:1.5;color:var(--ink)}
.lead{font-size:clamp(18px,2.3vw,27px);line-height:1.45;color:var(--muted)}
.em{color:var(--accent)}
.em2{color:var(--accent2)}
.mt1{margin-top:14px}.mt2{margin-top:22px}.mt3{margin-top:34px}.mt4{margin-top:48px}
.eyebrow{display:inline-block;font-family:'Montserrat';font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);background:var(--panel);border:1.5px solid var(--rule);border-radius:100px;padding:8px 18px}
.rule{height:4px;width:76px;background:var(--accent);border-radius:100px;margin:26px 0}
.grid{display:grid;gap:18px;margin-top:30px}
.card{background:var(--panel);border:1.5px solid var(--rule);border-radius:20px;padding:clamp(20px,2.4vw,30px)}
.card h3{color:var(--ink)}
.card p{color:var(--muted);font-size:clamp(15px,1.7vw,19px);margin-top:8px}
.num{font-family:'Montserrat';font-weight:800;color:var(--accent);font-size:clamp(30px,3.4vw,42px);line-height:1}
ul{list-style:none;margin-top:26px;display:grid;gap:16px}
li{position:relative;padding-left:40px;font-size:clamp(16px,1.9vw,22px);line-height:1.42}
li::before{content:'';position:absolute;left:0;top:.36em;width:18px;height:18px;border-radius:6px;border:2.5px solid var(--accent)}
li b{font-weight:700}
.big{font-size:clamp(26px,3.6vw,44px);font-family:'Montserrat';font-weight:700;line-height:1.12;letter-spacing:-.01em}
.presenter{margin-top:44px;display:flex;align-items:center;gap:16px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.presenter b{font-family:'Montserrat';font-weight:700;font-size:clamp(15px,1.7vw,19px)}
.presenter span{color:var(--muted);font-size:clamp(13px,1.5vw,16px)}
.cta-btn{display:inline-block;margin-top:34px;background:var(--accent);color:#fff;font-family:'Montserrat';font-weight:700;font-size:clamp(16px,1.9vw,21px);border-radius:100px;padding:16px 34px}
.fine{margin-top:34px;font-size:13px;line-height:1.5;color:var(--muted);max-width:720px}
.pfor{display:grid;gap:14px;margin-top:30px}
.pfor div{background:var(--panel);border-left:4px solid var(--accent);border-radius:0 14px 14px 0;padding:16px 22px;font-size:clamp(16px,1.9vw,21px)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:16px;padding:16px}
nav button{border:none;background:var(--panel);border:1.5px solid var(--rule);color:var(--ink);font-family:'Montserrat';font-weight:700;border-radius:100px;padding:10px 20px;cursor:pointer;font-size:14px}
nav button:hover{border-color:var(--accent);color:var(--accent)}
.dots{display:flex;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--rule);cursor:pointer}
.dots i.on{background:var(--accent);width:22px;border-radius:100px}
.count{position:fixed;top:16px;right:20px;font-family:'Montserrat';font-weight:700;font-size:13px;color:var(--muted)}
.brandmark{position:fixed;top:16px;left:20px;font-family:'Montserrat';font-weight:800;font-size:14px;letter-spacing:.02em;color:var(--accent)}
</style>
</head>
<body>
<div class="brandmark">Virtual Assistant Mama</div>
<div class="count" id="count"></div>
<div id="stage"></div>
<nav>
  <button id="prev">Back</button>
  <div class="dots" id="dots"></div>
  <button id="next">Next</button>
</nav>
<script>
const S = [
  {t:'title',
   k:'A free live masterclass',
   h:'The Teacher-to-VA Path',
   s:'How burnt-out moms and teachers replace a full income from home, using the skills they already have.',
   presenter:'Arianna Vernier'},

  {t:'who',
   k:'Who this is for',
   h:'You are in the right room if...',
   items:[
     'You are a teacher or a mom who is exhausted and stretched thin.',
     'You want to work from home and actually be there for your kids.',
     'You keep hearing "become a virtual assistant" but have no idea where to start.',
     'You are worried you do not have any "real" skills that someone would pay for.']},

  {t:'trap',
   k:'The trap',
   h:'You think you have to start over.',
   s:'Go back to school. Earn another certificate. Learn to code. Build a whole new skill set from scratch before anyone would ever hire you. That belief is the single biggest thing keeping capable women stuck in a job that is burning them out.'},

  {t:'reframe',
   k:'The reframe',
   big:'You do not have a skills problem. You have a packaging problem.',
   s:'The work businesses pay virtual assistants to do is work you already do every single day. Nobody ever showed you how to name it, package it, and put a price on it. That is what today is for.'},

  {t:'story',
   k:'Why I can promise you that',
   h:'I did this the scary way.',
   s:'I was a burnt-out teacher. I found virtual assisting the day my water broke with my daughter, and within six months I had replaced my teaching income, from home, around a newborn. I am not special. I just had a method. I have taught that same method to moms and teachers ever since.'},

  {t:'part',
   n:'Part One',
   h:'The skills gap that is not real.'},

  {t:'looks',
   k:'Part One',
   h:'You are already doing the work.',
   s:'Look at a normal week as a teacher or a mom. Now look at what a business actually hires a VA for. It is the same list.',
   grid:[
     {n:'', h:'Organizing', p:'Lesson plans, calendars, a whole household. That is project and inbox management.'},
     {n:'', h:'Communicating', p:'Parents, kids, staff, all day. That is client email and customer support.'},
     {n:'', h:'Creating', p:'Slides, worksheets, newsletters. That is Canva, social posts, and simple design.'},
     {n:'', h:'Juggling', p:'Ten things at once with no dropped balls. That is exactly what an overwhelmed owner needs.'}]},

  {t:'part',
   n:'Part Two',
   h:'The Teacher-to-VA method.'},

  {t:'looks',
   k:'The method, in three moves',
   h:'From your kitchen table to your first paying client.',
   grid:[
     {n:'01', h:'Package what you know', p:'Turn the skills you already have into a clear service and a rate.'},
     {n:'02', h:'Find the right clients', p:'Know exactly where to look, how to pitch, and which offers are scams.'},
     {n:'03', h:'Build it around your life', p:'Set it up simply, deliver, and keep clients so the income is steady.'}]},

  {t:'pillar',
   n:'01',
   h:'Package what you already know.',
   s:'We start with an inventory of what you can already do, not what you wish you could do. Then we turn the strongest ones into a named service, a simple package, and a rate you are not scared to say out loud.',
   items:[
     '<b>Skills inventory:</b> the honest list of what you are already great at.',
     '<b>Service packaging:</b> shape those skills into one clear offer.',
     '<b>Your rate:</b> price it so the numbers actually work for your family.']},

  {t:'pillar',
   n:'02',
   h:'Find the right clients (and skip the scams).',
   s:'Most people fail here because they do not know where to look, so they wait to be found. You will not wait. You will know the specific places business owners hire VAs, how to reach out without feeling salesy, and how to spot the work-from-home scams that prey on beginners.',
   items:[
     '<b>Where they are:</b> the real places owners go looking for help.',
     '<b>How to reach out:</b> a pitch that sounds like you, not a script.',
     '<b>Scam radar:</b> the red flags that keep your time and money safe.']},

  {t:'pillar',
   n:'03',
   h:'Build a business that fits around your kids.',
   s:'A first client is exciting. A steady income is the goal. We set up the boring-but-important pieces once, fit the work into naptimes and school hours, and treat that first client so well that they stay and they refer.',
   items:[
     '<b>Simple setup:</b> the tools, the contract, the onboarding, done once.',
     '<b>Your schedule:</b> the work fits your family, not the other way around.',
     '<b>Keep and grow:</b> retention and referrals turn one client into a roster.']},

  {t:'looks',
   k:'Part Three',
   h:'What this actually looks like.',
   s:'This is not a someday plan. It is a normal week for the women who follow the method.',
   grid:[
     {n:'', h:'The hours', p:'Focused work in the pockets of your day, not another 9-to-5.'},
     {n:'', h:'The work', p:'Tasks you are already good at, done for people who are grateful for the help.'},
     {n:'', h:'The point', p:'Income you brought in yourself, from home, with your kids nearby.'}]},

  {t:'reframe',
   k:'The mindset that carries it',
   big:'Done is better than qualified.',
   s:'You will never feel one hundred percent ready. The women who make this work are not the most qualified. They are the ones who packaged what they had and reached out anyway. Readiness is a decision, not a certificate.'},

  {t:'whyme',
   k:'Who is teaching you',
   h:'Arianna Vernier',
   s:'Former teacher, mom of two, and the founder of Virtual Assistant Mama. I have spent years teaching burnt-out teachers and moms the exact path I used, through my podcast, my book, the Virtual Assistant Mama Academy, and my Scaling Mastermind. This masterclass is the front door to all of it.',
   items:[
     'The Virtual Assistant Mama Podcast, hours of free training.',
     'The Virtual Assistant Mama Academy, the full step-by-step course.',
     'The Scaling Mastermind, for VAs ready to grow past the solo grind.']},

  {t:'recap',
   k:'The whole method on one page',
   h:'Remember these three moves.',
   grid:[
     {n:'01', h:'Package what you know', p:'Your existing skills, named, packaged, and priced.'},
     {n:'02', h:'Find the right clients', p:'The right places, a real pitch, and a scam radar.'},
     {n:'03', h:'Build around your life', p:'Set it up once, deliver, keep clients, and grow.'}]},

  {t:'next',
   k:'Your next step',
   h:'You do not have to figure this out alone.',
   s:'You just saw the whole path. The next step is to walk it with the templates, the client sources, and the support already built for you, so you are not guessing at any of it.'},

  {t:'cta',
   k:'Take the next step',
   h:'Join the Virtual Assistant Mama Academy.',
   s:'Everything from today, expanded into the full step-by-step system: package your skills, land your first client, and build a business that fits around your family.',
   btn:'Start with the free workshop',
   fine:'Educational content only. No specific income or result is guaranteed. Results vary and depend on your effort, your situation, and the work you put in. Arianna Vernier and Virtual Assistant Mama share what has worked for them and their students; they do not promise you will earn any particular amount.'}
];

function render(s){
  if(s.t==='title'){
    return `<div class="slide-inner">
      <div class="kicker">${s.k}</div>
      <h1 class="mt2">${s.h}</h1>
      <p class="lead mt3">${s.s}</p>
      <div class="presenter"><span class="dot"></span><div><b>${s.presenter}</b><br><span>Founder, Virtual Assistant Mama</span></div></div>
    </div>`;
  }
  if(s.t==='who'){
    return `<div class="kicker">${s.k}</div><h2 class="mt2">${s.h}</h2>
      <div class="pfor pfor2"><div class="pfor">${s.items.map(i=>`<div>${i}</div>`).join('')}</div></div>`;
  }
  if(s.t==='trap'){
    return `<div class="kicker">${s.k}</div><h2 class="mt2">${s.h}</h2><div class="rule"></div><p class="lead">${s.s}</p>`;
  }
  if(s.t==='reframe'){
    return `<div class="kicker">${s.k}</div><div class="big mt3">${s.big}</div><p class="lead mt3">${s.s}</p>`;
  }
  if(s.t==='story'){
    return `<div class="kicker">${s.k}</div><h2 class="mt2">${s.h}</h2><div class="rule"></div><p class="lead">${s.s}</p>`;
  }
  if(s.t==='part'){
    return `<div class="eyebrow">${s.n}</div><h1 class="mt3">${s.h}</h1>`;
  }
  if(s.t==='pillar'){
    return `<div class="kicker">Pillar ${s.n}</div><h2 class="mt2">${s.h}</h2><p class="lead mt2">${s.s}</p>
      <ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  }
  if(s.t==='looks'||s.t==='recap'){
    const cards=s.grid.map(c=>`<div class="card">${c.n?`<div class="num">${c.n}</div>`:''}<h3 class="${c.n?'mt2':''}">${c.h}</h3><p>${c.p}</p></div>`).join('');
    const cols=s.grid.length>=4?'repeat(2,1fr)':'repeat(3,1fr)';
    return `<div class="kicker">${s.k}</div><h2 class="mt2">${s.h}</h2>${s.s?`<p class="lead mt2">${s.s}</p>`:''}
      <div class="grid" style="grid-template-columns:${cols}">${cards}</div>`;
  }
  if(s.t==='whyme'){
    return `<div class="kicker">${s.k}</div><h2 class="mt2">${s.h}</h2><p class="lead mt2">${s.s}</p>
      <ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  }
  if(s.t==='next'){
    return `<div class="kicker">${s.k}</div><h2 class="mt2">${s.h}</h2><div class="rule"></div><p class="lead">${s.s}</p>`;
  }
  if(s.t==='cta'){
    return `<div class="kicker">${s.k}</div><h1 class="mt2">${s.h}</h1><p class="lead mt3">${s.s}</p>
      <div class="cta-btn">${s.btn}</div><div class="fine">${s.fine}</div>`;
  }
  return '';
}

const stage=document.getElementById('stage');
const dotsEl=document.getElementById('dots');
const countEl=document.getElementById('count');
let i=0;
S.forEach((s,idx)=>{
  const d=document.createElement('div');
  d.className='slide'+(idx===0?' on':'');
  d.innerHTML=render(s);
  stage.appendChild(d);
  const dot=document.createElement('i');
  if(idx===0)dot.className='on';
  dot.onclick=()=>go(idx);
  dotsEl.appendChild(dot);
});
const slides=[...document.querySelectorAll('.slide')];
const dotList=[...dotsEl.children];
function go(n){
  i=Math.max(0,Math.min(S.length-1,n));
  slides.forEach((el,idx)=>el.classList.toggle('on',idx===i));
  dotList.forEach((el,idx)=>el.classList.toggle('on',idx===i));
  countEl.textContent=(i+1)+' / '+S.length;
}
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
go(0);
</script>
</body>
</html>
