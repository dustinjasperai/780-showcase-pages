<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Business Behind the Mission / Catalina Parker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161e2a;        /* her footer navy, site_scheme dark */
    --panel:#22303f;     /* half-step panel */
    --rule:#3e4f59;      /* her button slate */
    --accent:#77856b;    /* her sage green */
    --ink:#f2efe8;       /* warm cream ink */
    --muted:#aab3ad;     /* desaturated sage-grey */
    --head:'Montserrat',system-ui,sans-serif;
    --body:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:linear-gradient(180deg,var(--panel),#1b2634);border:1px solid var(--rule);
    border-radius:16px;padding:52px 56px;margin:0 0 26px;min-height:420px;display:flex;
    flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.05;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.1;margin:0 0 16px}
  .big{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.12;margin:0}
  p{font-size:21px;line-height:1.5;margin:0 0 14px;max-width:46ch}
  .lead{font-size:24px;color:var(--ink)}
  ul{margin:10px 0 0;padding:0;list-style:none}
  li{font-size:21px;line-height:1.45;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid #2c3a49}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:4px;top:20px;width:12px;height:12px;background:var(--accent);
    border-radius:3px;transform:rotate(45deg)}
  li b{font-family:var(--head);font-weight:700}
  .num{font-family:var(--head);font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.1em}
  .stat{font-family:var(--head);font-weight:800;font-size:56px;color:var(--accent);line-height:1;margin:0 0 8px}
  .foot{font-family:var(--head);font-size:13px;color:var(--muted);letter-spacing:.08em;
    text-transform:uppercase;margin-top:auto;padding-top:26px}
  .cta p{font-size:22px}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:60ch;font-style:italic}
  .by{font-family:var(--head);font-weight:600;color:var(--muted);font-size:17px;letter-spacing:.04em}
  strong.a{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">A live masterclass with Catalina Parker</div>
    <h1>The Business Behind the Mission</h1>
    <p class="lead">Why talented nonprofit consultants stay underpaid, and the five-foundation fix.</p>
    <div class="foot">Relatable Nonprofit</div>`},

  {t:'who', cls:'', html:`
    <div class="kick">Who this is for</div>
    <h2>You left the mission side to go independent.</h2>
    <p>You have the expertise, the network, and at least one client. What you do not have is a
    business that pays you what the work is worth. If you love the mission and still kind of hate
    the job, you are in the right room.</p>`},

  {t:'trap', cls:'', html:`
    <div class="kick">The trap</div>
    <h2>You priced yourself off your old salary.</h2>
    <p>So you said yes to everything, scoped nothing, and discounted because "they're a nonprofit."
    Now you are busy and broke, and the freedom you left for feels further away than when you had a job.</p>`},

  {t:'reframe', cls:'', html:`
    <div class="kick">The reframe</div>
    <p class="big">That is not a talent problem.<br>It is a <strong class="a">business structure</strong> problem.</p>
    <p style="margin-top:22px">You are excellent at the work. Nobody taught you to build the business around it.</p>`},

  {t:'part', cls:'', html:`
    <div class="num">PART ONE</div>
    <h2>Why mission-driven experts undercharge.</h2>
    <p>Three quiet beliefs keep good consultants cheap. None of them is a number.</p>`},

  {t:'reasons', cls:'', html:`
    <div class="kick">The three stories we tell ourselves</div>
    <ul>
      <li><b>"They're a nonprofit."</b> So you absorb the discount the sector assumes.</li>
      <li><b>"It feels greedy."</b> So you shrink the quote before they can.</li>
      <li><b>"I don't know what's normal."</b> So you copy an old salary and hope.</li>
    </ul>`},

  {t:'cost', cls:'', html:`
    <div class="kick">What it compounds into</div>
    <h2>Underpricing is not humble. It is a slow close.</h2>
    <p>I know, because I did it first. Program officer at a major foundation at 24, then burned out
    into panic attacks. I went independent, undercharged for a year, and almost quit. The fix was
    never working harder. It was building the business properly.</p>`},

  {t:'part', cls:'', html:`
    <div class="num">PART TWO</div>
    <h2>The Business Roadmap.</h2>
    <p>A consulting business stands on five foundations, built in order. Skip one and the whole
    thing wobbles.</p>`},

  {t:'five', cls:'', html:`
    <div class="kick">The five foundations</div>
    <ul>
      <li><b>Offers</b>: your niche, your services, and how they are priced.</li>
      <li><b>Marketing</b>: positioning and lead generation that fit the mission.</li>
      <li><b>Sales</b>: a pipeline and a yes without the ick.</li>
      <li><b>Client delivery</b>: onboarding, scope, and communication.</li>
      <li><b>Operations</b>: financials and the backend that keep it running.</li>
    </ul>`},

  {t:'f', cls:'', html:`
    <div class="num">FOUNDATION 1 / OFFERS</div>
    <h2>Stop selling hours. Sell an outcome.</h2>
    <p>Pick a niche you can own, define a small set of services, and price them for the result the
    client gets, not the time you spend. Pricing for results beats pricing for time, every time.</p>`},

  {t:'f', cls:'', html:`
    <div class="num">FOUNDATION 2 / MARKETING</div>
    <h2>Marketing that fits the mission.</h2>
    <p>You do not need to be loud or salesy to be found. You need clear positioning, one reliable
    way to show up, and content that sounds like you. Mission-aligned marketing out-earns hype in
    this sector because your buyers can smell the hype.</p>`},

  {t:'f', cls:'', html:`
    <div class="num">FOUNDATION 3 / SALES</div>
    <h2>A pipeline, not a scramble.</h2>
    <p>Most consultants "do sales" only when the bank account dips. We build a simple, repeatable
    pipeline so there is always a next conversation, and a way to say your real rate out loud and
    handle the budget pushback without folding.</p>`},

  {t:'f', cls:'', html:`
    <div class="num">FOUNDATION 4 / CLIENT DELIVERY</div>
    <h2>Scope it, or it will scope you.</h2>
    <p>The fastest path to burnout is a project with no edges. Defined scope, a real onboarding, and
    boundaries you actually keep are what let you deliver great work and still have a life.</p>`},

  {t:'f', cls:'', html:`
    <div class="num">FOUNDATION 5 / OPERATIONS</div>
    <h2>The backend that makes it a business.</h2>
    <p>Know your numbers, your costs, and your runway. A few simple systems for contracts, invoicing,
    and cash flow turn a string of gigs into a company you can plan around.</p>`},

  {t:'pricing', cls:'', html:`
    <div class="kick">The piece nobody teaches</div>
    <h2>How to actually set your rate.</h2>
    <ul>
      <li><b>Audit</b>: look honestly at your current services, clients, and rates.</li>
      <li><b>Calculate</b>: start from your income goal, your costs, and your billable hours to find your floor.</li>
      <li><b>Communicate</b>: say the number with a straight face and hold it in the room.</li>
    </ul>`},

  {t:'data', cls:'', html:`
    <div class="kick">From the State of Nonprofit Consulting report</div>
    <p class="stat">$100 to $149</p>
    <p>the most common hourly rate among nonprofit consultants, with about 55% charging between $100
    and $199 an hour. Most people are guessing at this number. This is the only report that actually
    asked. We will build your rate from your goal and your costs, not from a rumor.</p>`},

  {t:'part', cls:'', html:`
    <div class="num">PART THREE</div>
    <h2>Life on the other side of the structure.</h2>`},

  {t:'end', cls:'', html:`
    <div class="kick">The other side</div>
    <ul>
      <li>A rate that covers your costs and hits your income goal, said without flinching.</li>
      <li>A pipeline that fills itself, so you choose clients instead of chasing them.</li>
      <li>Scoped projects, kept boundaries, and a week you recognize as your own.</li>
      <li>A real business behind the mission, not a job you gave yourself.</li>
    </ul>`},

  {t:'why', cls:'', html:`
    <div class="kick">Why me</div>
    <h2>I built the thing I am teaching you.</h2>
    <p>I am Catalina Parker. Foundation program officer at 24, burned out, then built Relatable
    Nonprofit into nearly a million dollars in revenue since 2021 and mentored 170+ nonprofit
    consultants. Master's in nonprofit management from Columbia. I am not selling a dream. I am
    handing you the roadmap I had to build the hard way.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h2>Build it with me, in the Mentorship.</h2>
    <p>Six months, one-on-one, walking the five foundations in order until the business is actually
    built. If that is the year you are ready for, apply and book a call with me and we will see if
    it is a fit.</p>
    <p style="font-family:var(--head);font-weight:700;color:var(--accent);margin-top:10px">Apply for The Mentorship at relatablenonprofit.com</p>
    <p class="disc">Educational only. No income, role, or result is guaranteed. Your outcomes depend
    on your own work, market, and circumstances, and results vary from person to person.</p>`}
];

const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  el.innerHTML = s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
