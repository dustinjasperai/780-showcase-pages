<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Own Your Next Move: The Power of Three | Mindful Limitless Living</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1d0e03;        /* her dominant dark brown ground */
    --panel:#2a1a0d;     /* lifted brown, derived from ground */
    --ink:#fff6ef;       /* her warm cream */
    --muted:#c9b7a7;     /* muted cream */
    --accent:#014b3f;    /* her deep-teal button color */
    --accent-soft:#2f6d60;
    --display:'Questrial',sans-serif;
    --body:'Raleway',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{
    background:var(--panel);
    border:1px solid rgba(255,246,239,0.08);
    border-radius:14px;
    padding:64px 56px;
    margin:0 0 28px;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .eyebrow{font-family:var(--body);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--accent-soft);margin-bottom:22px}
  h1{font-family:var(--display);font-size:52px;line-height:1.08;font-weight:400;margin-bottom:18px}
  h2{font-family:var(--display);font-size:38px;line-height:1.12;font-weight:400;margin-bottom:16px}
  p{font-size:20px;line-height:1.6;color:var(--muted);max-width:62ch;margin-bottom:14px}
  p.lead{color:var(--ink);font-size:23px}
  .rule{width:64px;height:3px;background:var(--accent);border-radius:2px;margin:10px 0 26px}
  ul{list-style:none;margin:10px 0}
  li{font-size:20px;line-height:1.5;color:var(--ink);padding:14px 0 14px 26px;position:relative;
    border-bottom:1px solid rgba(255,246,239,0.07)}
  li:before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;background:var(--accent);border-radius:50%}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
  .three .col{background:rgba(1,75,63,0.14);border:1px solid rgba(1,75,63,0.4);border-radius:10px;padding:22px}
  .three .col .k{font-family:var(--display);font-size:22px;color:var(--ink);margin-bottom:8px}
  .three .col .v{font-size:15px;color:var(--muted)}
  .big{font-family:var(--display);font-size:46px;line-height:1.1}
  .foot{position:absolute;bottom:22px;left:56px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft)}
  .pagenum{position:absolute;bottom:22px;right:56px;font-size:12px;color:var(--muted)}
  .cta-box{background:rgba(1,75,63,0.18);border:1px solid var(--accent);border-radius:10px;padding:22px;margin-top:20px}
  .cta-box .step{font-family:var(--display);font-size:24px;color:var(--ink);margin-bottom:6px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;max-width:70ch;line-height:1.5}
  .brandline{font-family:var(--display);font-size:16px;color:var(--muted);letter-spacing:.06em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Susan Chu',h:'Own Your Next Move',sub:'The Power of Three: build the leadership narrative that earns your next role, before you have the title.',brand:'Mindful Limitless Living'},
 {t:'bullets',eyebrow:'Who this is for',h:'You are already operating at a high level',p:'This hour is for senior leaders standing at an inflection point:',items:[
   'You are up for a bigger seat and want to show up as that leader now',
   'You are leading through change, restructuring, or a new mandate',
   'You are ready for the board to see your trajectory, not just your title']},
 {t:'statement',eyebrow:'The trap',big:'Most leaders wait to be handed the title before they let themselves lead like the person who holds it.',sub:'So they stay quiet in the room where the decision gets made.'},
 {t:'statement',eyebrow:'The reframe',big:'It was never a skills gap. It is a narrative gap.',sub:'You have the experience. What is missing is a clear story that connects where you have been, what you lead with now, and where you are headed.'},
 {t:'section',eyebrow:'Part one',h:'Why presence keeps getting mistaken for polish'},
 {t:'bullets',eyebrow:'The core problem',h:'Executive presence is a story, not a style',p:'Posture, pace, and polish do not move a board. Clarity does. When your narrative is fragmented, three things happen:',items:[
   'Your past reads as a list of jobs instead of a thesis',
   'Your present gets defined by your current title, not your capability',
   'Your future stays invisible, so no one positions you for it']},
 {t:'section',eyebrow:'Part two',h:'The Power of Three'},
 {t:'three',eyebrow:'The method',h:'One story, three moves',cols:[
   {k:'Past',v:'The experience you undervalue. We mine it for the thesis that has run through your whole career.'},
   {k:'Present',v:'The capability you actually lead with, named plainly, so it stops hiding behind your job description.'},
   {k:'Future',v:'The role you are stepping into, positioned so the room can see the trajectory.'}]},
 {t:'bullets',eyebrow:'Power of Three, Past',h:'Mine the experience you undervalue',p:'The parts of your history you treat as background are usually where your distinctive value lives.',items:[
   'Name the through-line that connects your moves, not the moves themselves',
   'Turn a career list into a point of view',
   'Reclaim the decisions that only you would have made']},
 {t:'bullets',eyebrow:'Power of Three, Present',h:'Lead with the capability, not the title',p:'Your title describes your box. Your capability describes your value. Leaders who name the second stop waiting for permission.',items:[
   'Say what you are reliably the person in the room for',
   'Separate the work you do from the judgment you bring',
   'Make your present legible to people who decide your next seat']},
 {t:'bullets',eyebrow:'Power of Three, Future',h:'Position the trajectory, out loud',p:'Boards and sponsors back a direction they can see. The future move has to be spoken before it can be offered.',items:[
   'Frame the next role as a continuation, not a leap',
   'Give sponsors language they can repeat for you when you are not in the room',
   'Close the gap between how you see yourself and how you are positioned']},
 {t:'statement',eyebrow:'In the room',big:'The same three moves work at the board table, in the interview, and in the succession conversation.',sub:'One narrative, told cleanly, in every room where your next move gets decided.'},
 {t:'section',eyebrow:'Part three',h:'Leading people through what you are absorbing yourself'},
 {t:'bullets',eyebrow:'The inflection point',h:'Change does not break organizations',p:'They struggle when leaders underestimate the human capacity required to absorb it. You cannot carry a team through a transition you have not named for yourself.',items:[
   'Recalibrate your own narrative first, then lead the change',
   'Give your people a story they can stand inside',
   'Make decisions with clarity while the ground is still moving']},
 {t:'bullets',eyebrow:'Why Susan',h:'Built from inside the seat, not beside it',p:'Susan Chu spent 25+ years as a global executive, from the EU in Brussels to Chief Administrative Officer roles across North America, Europe, and Asia-Pacific.',items:[
   'ICF-certified executive coach and Certified High Performance Coach',
   'Forbes Coaches Council member; MS in Organization Development, Johns Hopkins',
   'Author of Own Your Next Move: career transitions, executive presence, leadership impact']},
 {t:'statement',eyebrow:'What you leave with',big:'A leadership narrative you can own out loud.',sub:'Past, present, and future, connected into one story that earns the room before you have the title.'},
 {t:'cta',eyebrow:'Your next step',h:'Own your next move',step:'Book a strategy session with Susan',sub:'We map your Power of Three and the move in front of you, and whether the Executive Ascend path is the right fit.',brand:'Mindful Limitless Living',disclaimer:'This masterclass is educational. No specific promotion, income, or career result is guaranteed. Results vary by individual and circumstance.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='title'){h+=`<h1>${s.h}</h1><div class="rule"></div><p class="lead">${s.sub}</p><div class="brandline">${s.brand}</div>`}
  else if(s.t==='section'){h+=`<h2>${s.h}</h2><div class="rule"></div>`}
  else if(s.t==='statement'){h+=`<div class="big">${s.big}</div><div class="rule"></div><p>${s.sub||''}</p>`}
  else if(s.t==='three'){h+=`<h2>${s.h}</h2><div class="rule"></div><div class="three">${s.cols.map(c=>`<div class="col"><div class="k">${c.k}</div><div class="v">${c.v}</div></div>`).join('')}</div>`}
  else if(s.t==='cta'){h+=`<h2>${s.h}</h2><div class="rule"></div><div class="cta-box"><div class="step">${s.step}</div><p>${s.sub}</p></div><div class="brandline">${s.brand}</div><p class="disclaimer">${s.disclaimer}</p>`}
  else {h+=`<h2>${s.h}</h2><div class="rule"></div>`;if(s.p)h+=`<p class="lead">${s.p}</p>`;if(s.items)h+=`<ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`}
  h+=`<div class="foot">Own Your Next Move</div><div class="pagenum">${i+1} / ${S.length}</div>`;
  d.innerHTML=h;deck.appendChild(d);
});
</script>
</body>
</html>
