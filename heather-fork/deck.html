<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Crossing: A Masterclass by Heather Fork, MD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe6;      /* warm cream ground, tinted from her gold #8c7d57 (her light scheme) */
    --panel:#fffdf9;   /* warm panel, not pure white */
    --ink:#222120;     /* her exact text hex */
    --muted:#6b645b;
    --rule:#e6ddcb;    /* warm neutral from the gold family */
    --accent:#f27967;  /* her exact brand coral */
    --gold:#8c7d57;    /* her gold, labels/rules only */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:26px 0;box-shadow:0 1px 0 rgba(34,33,32,.02),0 18px 40px -30px rgba(34,33,32,.35)}
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    font-weight:700;margin:0 0 18px}
  h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:52px;line-height:1.04;
    margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:36px;line-height:1.1;
    margin:0 0 16px}
  .sub{font-size:21px;line-height:1.5;color:var(--muted);margin:0 0 10px;max-width:40ch}
  p{font-size:19px;line-height:1.62;margin:0 0 14px;max-width:62ch}
  .lead{font-size:23px;line-height:1.5}
  .big h2{font-size:40px;line-height:1.12}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;border-top:1px solid var(--rule);
    position:relative}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:21px;width:9px;height:9px;border-radius:50%;
    background:var(--accent)}
  .step{display:flex;gap:22px;align-items:flex-start}
  .stepletter{font-family:"DM Serif Display",Georgia,serif;font-size:72px;line-height:.9;
    color:var(--accent);min-width:70px}
  .pathrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .pill{border:1px solid var(--rule);border-radius:999px;padding:9px 16px;font-size:15px;
    font-weight:500;color:var(--muted)}
  .pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .byline{font-size:16px;color:var(--muted);margin-top:26px}
  .footnote{font-size:14px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:70ch}
  .accentbar{height:5px;width:64px;background:var(--accent);border-radius:3px;margin:0 0 26px}
  .cta{font-family:"DM Serif Display",Georgia,serif;font-size:21px;color:var(--ink);
    border:1.5px solid var(--accent);border-radius:12px;padding:16px 22px;display:inline-block;margin-top:8px}
  .num{font-size:14px;color:var(--muted);text-align:right;margin:-28px 0 0}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass', title:'The Crossing',
   sub:'The five step path out of clinical medicine, without throwing away your career.',
   byline:"Heather Fork, MD  ·  Doctor's Crossing"},

  {t:'std', eyebrow:'Who this is for', h:'You are a good doctor. You are also quietly done.',
   body:['Maybe it is burnout. Maybe it is the admin, the schedule, the feeling that this is not the life you signed up for. You are not broken and you are not alone.'],
   bullets:['You think about leaving clinical work more than you admit out loud.',
            'You cannot picture what else you would even do.',
            'And you cannot afford to get this wrong.']},

  {t:'std', eyebrow:'The trap', h:'"I can’t just quit."',
   body:['Every physician I meet is caught between two sentences. "I can’t keep doing this" and "I can’t just walk away from everything I built." Both feel true. So you stay, and another year goes by.'],
   lead:'The trap is not your job. The trap is believing the only two options are grind it out or blow it all up.'},

  {t:'big', eyebrow:'The real risk',
   h:'The risk is not leaving medicine. The risk is staying on autopilot for another ten years because no one showed you a safe way out.',
   body:['There is a third option between staying miserable and quitting recklessly. It has steps. You can start it this month without telling a soul.']},

  {t:'part', eyebrow:'Part One', title:'Why good physicians stay stuck'},

  {t:'std', eyebrow:'The core problem', h:'Three things keep smart physicians frozen',
   bullets:['Identity. Being a doctor is not what you do, it is who you are. Changing it feels like losing yourself.',
            'Sunk cost. Eleven years and six figures of training scream that you have to stay.',
            'No map. You were never taught there is a method for this, so the whole thing looks like a cliff.']},

  {t:'std', eyebrow:'The two wrong moves', h:'White knuckle, or free fall',
   body:['The white knuckle. You decide to just tough it out. Resilience hacks, a new gratitude journal, one more schedule change. The feeling always comes back.',
         'The free fall. One bad call shift and you nearly hand in your notice with no plan, no runway, and no idea what is next. Fear pulls you right back.'],
   lead:'Neither is a strategy. Both are what happens when you have no process.'},

  {t:'big', eyebrow:'The reframe',
   h:'Career change is not a leap. It is a process you can run on purpose.',
   body:['When you treat it as a staged project instead of a single terrifying jump, the fear drops and the options get clear. That process has a name.'],
   pills:['Commitment','Assessment','Research','Preparation','Execution']},

  {t:'part', eyebrow:'Part Two', title:'The C A R P E path'},

  {t:'std', eyebrow:'The method', h:'C A R P E',
   body:['Five stages I walk every physician through. You do not skip ahead and you do not have to do it alone. Each stage removes one reason you have been stuck.'],
   pillson:['C ommitment','A ssessment','R esearch','P reparation','E xecution']},

  {t:'step', eyebrow:'The C A R P E path', L:'C', h:'Commitment',
   body:['You decide the change is real and worth a defined block of time. Not a someday wish, an actual project with a start date. Nothing else works until this is settled.']},

  {t:'step', eyebrow:'The C A R P E path', L:'A', h:'Assessment',
   body:['We map what you are actually good at and what you actually value, separate from your specialty. Most physicians have never done this on purpose. It is where the real options appear.']},

  {t:'step', eyebrow:'The C A R P E path', L:'R', h:'Research',
   body:['You explore the paths that fit the map, from the inside, talking to people doing the work. You rule options in and out with evidence instead of fear.']},

  {t:'step', eyebrow:'The C A R P E path', L:'P', h:'Preparation',
   body:['The nonclinical resume, the LinkedIn profile, the network, the skills gap. The unglamorous work that makes you a credible candidate for a role you have never held.']},

  {t:'step', eyebrow:'The C A R P E path', L:'E', h:'Execution',
   body:['You make the move, with a plan for the money, the timing, and the people around you. By now it is the logical next step, not a leap in the dark.']},

  {t:'std', eyebrow:'Your realistic timeline', h:'Three to four months, not three to four years',
   body:['Most physicians I work with move through the Carpe Diem path over three to four months of focused, part time work, with follow up as needed. You keep your income while you build the exit.'],
   bullets:['Weeks 1 to 4. Commitment and Assessment. The fog lifts and real options show up.',
            'Weeks 4 to 10. Research and early Preparation. You narrow to a path and start building the case.',
            'Weeks 10 onward. Preparation and Execution. Resume, network, interviews, the move.']},

  {t:'std', eyebrow:'Why listen to me', h:'I made this crossing myself.',
   body:['I am Heather Fork, MD. I practiced dermatology for nine years in Austin before I admitted it was not the life I wanted. I did not blow it up. I found the steps, walked them, and built a life I love.',
         'I have been a coach longer than I was a dermatologist, and I have helped hundreds of physicians find their own path forward through the Carpe Diem program, the podcast, and the courses.']},

  {t:'std', eyebrow:'The two things you are thinking', h:'"I’ll waste my training." "It’s too late."',
   body:['You will not waste it. The judgment, the work ethic, the ability to make decisions under pressure, those travel with you into every path we find. Nothing is thrown away.',
         'It is not too late. The physicians I see happiest on the other side almost always say the same thing. They only wish they had started the process sooner.']},

  {t:'big', eyebrow:'Your first step',
   h:'Commitment is a decision, and you can make it today.',
   body:['You do not need the whole plan to start. You need to decide that exploring this is worth a defined block of your time. Everything in C A R P E follows from that one yes.']},

  {t:'cta', eyebrow:'Where to go from here', h:'Let us map your crossing together.',
   body:['If you are ready to stop circling the same question, the next step is a Carpe Diem consultation. We look at where you are, where you want to be, and whether the Carpe Diem program is the right way to get you there.'],
   button:'Book your Carpe Diem consultation at doctorscrossing.com',
   disclaimer:'Educational content only. No result is guaranteed. Results vary by individual circumstances, effort, and market conditions. This is not a promise of any specific job or income.'}
];

function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function paras(a){return (a||[]).map(p=>`<p>${esc(p)}</p>`).join('')}
function bullets(a){return a?`<ul>${a.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}
function pills(a,on){return a?`<div class="pathrow">${a.map(p=>`<span class="pill${on?' on':''}">${esc(p)}</span>`).join('')}</div>`:''}

function render(){
  const deck = document.getElementById('deck');
  let n = 0;
  deck.innerHTML = S.map(s=>{
    n++;
    let inner = '';
    const eb = s.eyebrow?`<p class="eyebrow">${esc(s.eyebrow)}</p>`:'';
    const lead = s.lead?`<p class="lead">${esc(s.lead)}</p>`:'';
    if(s.t==='title'){
      inner = `<div class="accentbar"></div>${eb}<h1>${esc(s.title)}</h1>
        <p class="sub">${esc(s.sub)}</p><p class="byline">${esc(s.byline)}</p>`;
    } else if(s.t==='part'){
      inner = `${eb}<h1>${esc(s.title)}</h1>`;
    } else if(s.t==='big'){
      inner = `<div class="big">${eb}<h2>${esc(s.h)}</h2></div>${paras(s.body)}${pills(s.pills,false)}`;
    } else if(s.t==='step'){
      inner = `${eb}<div class="step"><div class="stepletter">${esc(s.L)}</div>
        <div><h2>${esc(s.h)}</h2>${paras(s.body)}</div></div>`;
    } else if(s.t==='cta'){
      inner = `<div class="accentbar"></div>${eb}<h2>${esc(s.h)}</h2>${paras(s.body)}
        <div class="cta">${esc(s.button)}</div>
        <p class="footnote">${esc(s.disclaimer)}</p>`;
    } else { /* std */
      inner = `${eb}<h2>${esc(s.h)}</h2>${paras(s.body)}${bullets(s.bullets)}${pills(s.pills,false)}${pills(s.pillson,true)}${lead}`;
    }
    return `<section class="slide">${inner}<p class="num">${n} / ${S.length}</p></section>`;
  }).join('');
}
render();
</script>
</body>
</html>
