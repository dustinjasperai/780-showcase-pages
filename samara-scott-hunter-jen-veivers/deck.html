<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price for Profit — a Salon Rising masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Chivo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1ea;        /* Salon Rising warm cream (site ground) */
    --panel:#fbf8f2;     /* warm off-white from the same cream family, never stark #fff */
    --panel2:#f1ece2;
    --ink:#2b2b2b;        /* site heading charcoal */
    --muted:#6c6c6c;      /* site body text */
    --accent:#34495e;     /* site link slate */
    --sage:#d9ded4;       /* site pale sage tint */
    --rule:#e4ddd1;
    --head:'Playfair Display',Georgia,serif;
    --body:'Chivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1080px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.1;margin-bottom:16px}
  h3{font-family:var(--head);font-weight:600;font-size:26px;margin-bottom:8px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:40em;margin-bottom:12px}
  p.sub{font-size:22px;color:var(--muted)}
  .lead{font-size:30px;line-height:1.3;font-family:var(--head);font-weight:500}
  ul{list-style:none;margin:14px 0 0}
  li{font-size:21px;line-height:1.45;padding:12px 0 12px 34px;position:relative;border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:4px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pill{display:inline-block;background:var(--sage);color:#2b3a30;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:7px 14px;border-radius:999px;margin-bottom:18px}
  .big{font-family:var(--head);font-size:120px;line-height:1;color:var(--accent);font-weight:700}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:10px}
  .card{background:var(--panel2);border:1px solid var(--rule);border-radius:12px;padding:24px}
  .card h3{font-size:22px;color:var(--accent)}
  .card p{font-size:17px;color:var(--muted);margin:0}
  .dark{background:var(--accent);color:#fff;border-color:var(--accent)}
  .dark h1,.dark h2,.dark .lead{color:#fff}
  .dark .kick{color:var(--sage)}
  .dark p{color:#e8ecf1}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;max-width:42em;margin-top:22px;border-top:1px solid var(--rule);padding-top:16px}
  .cta-steps li:before{background:#fff}
  .dark li{border-color:rgba(255,255,255,.18)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* Salon Rising — "Price for Profit" live masterclass deck.
   Built entirely from Salon Rising's own IP (The Rising Method). The coach teaches her
   own audience and ends on her own call to action. */
const S = [
  {t:'title', num:'01', kick:'A free live masterclass with Salon Rising',
   h:'Price for Profit',
   sub:'How to run your salon on real numbers, so being fully booked finally means being paid.'},

  {t:'content', num:'02', kick:'Who this is for',
   h:'You are busy. You are tired. And the bank account does not match the diary.',
   p:'This is for the salon owner whose column is full, whose team is flat out, and who still cannot say, with certainty, whether this week actually made money. If that is you, you are in the right room.'},

  {t:'dark', num:'03', kick:'The reframe',
   h:'Busy is not the same as profitable.',
   p:'Most salon owners grow by adding more. More clients, more hours, more staff. But you can add all of that and keep the same thin margin, or a worse one. Profit is not what is left over. It is something you price in on purpose.'},

  {t:'section', num:'04', pill:'Part one', h:'Why the numbers slip',
   sub:'Three quiet leaks that drain a fully booked salon.'},

  {t:'content', num:'05', kick:'Leak one',
   h:'You priced by looking sideways.',
   p:'Most prices are set by glancing at the salon down the road, not by what a service actually costs you to deliver. The moment your costs move, and they always move, that price is wrong and you do not feel it until the end of the year.'},

  {t:'content', num:'06', kick:'Leak two',
   h:'The hidden costs nobody counts.',
   p:'Product used per service. The no-shows. The rebookable that never gets rebooked. The junior time on a senior price. Each one is small. Together they are the difference between a good month and a flat one.'},

  {t:'content', num:'07', kick:'Leak three',
   h:'The owner wage you keep skipping.',
   p:'You pay the team, the rent, the suppliers, the tax. Then you pay yourself whatever is left, which is often nothing. A salon that cannot pay its owner a real wage is not profitable yet, no matter how full it looks.'},

  {t:'section', num:'08', pill:'Part two', h:'The Rising Method',
   sub:'The system from sixteen years of running a real salon, La Sorella, on the Gold Coast.'},

  {t:'content', num:'09', kick:'Pillar one',
   h:'Know your number.',
   p:'Before you touch a price, you work out what this business has to earn, each week, to cover everything and pay you properly. That single figure, your earnings target, is the one most owners have never calculated. Everything else hangs off it.'},

  {t:'content', num:'10', kick:'Pillar two',
   h:'Price for true cost, then margin.',
   p:'We build each service price up from what it really costs you to deliver, in product and in time, and then add the margin on purpose. Not a guess, not a match of the salon next door. A price you can defend because you know exactly what sits underneath it.'},

  {t:'content', num:'11', kick:'Pillar three',
   h:'Build a team that stays.',
   p:'Profit you priced in only holds if the people stay. The hard conversations, the roles, the culture that keeps good stylists from walking. A stable team is a financial decision, not just a nice one.'},

  {t:'content', num:'12', kick:'Pillar four',
   h:'Keep the clients you already have.',
   p:'The cheapest client to book is the one who already loves you. Retention, rebooking and the rhythm of looking after your regulars protect the revenue you worked so hard to win, before you spend a cent chasing new faces.'},

  {t:'section', num:'13', pill:'Part three', h:'A salon that pays its owner',
   sub:'What a week looks like when the numbers lead.'},

  {t:'twocard', num:'14', kick:'Before and after',
   h:'The same diary. A different outcome.',
   cards:[
     {h:'Before', p:'Fully booked, unsure if it paid. Prices set by feel. Owner paid last, and least.'},
     {h:'After', p:'Same column, known margin on every service. A real owner wage, planned, not hoped for.'}
   ]},

  {t:'content', num:'15', kick:'Why listen to me',
   h:'Built by women who run salons.',
   p:'I am Samara Scott-Hunter. I have owned La Sorella, an award winning Gold Coast salon, since 2008, from solo chair to a full team. The Rising Method is not theory. It is the version that includes the years I got the numbers wrong, so you do not have to.'},

  {t:'content', num:'16', kick:'The takeaway',
   h:'Profit is a decision you make at the price list.',
   p:'You do not need more clients to be paid. You need your number, honest costs, a team that stays and clients who come back. Price for that on purpose and the fully booked diary finally means what it should.'},

  {t:'cta', num:'17', kick:'Your next step',
   h:'Learn the whole method.',
   p:'The Rising Method walks you through your numbers, your pricing and your team, step by step, built for real Australian salons.',
   steps:['Join the waitlist for The Rising Method at salonrising.com',
          'Or work one to one with Samara over twelve weeks',
          'Start with the free guides and Salon Rising: The Podcast'],
   disc:'This masterclass is educational. It shares the approach used at La Sorella and does not guarantee any financial result. Every salon is different and outcomes vary with your market, costs and effort.'}
];

const deck = document.getElementById('deck');
S.forEach(function(s){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='dark'?' dark':'') + (s.t==='cta'?' dark':'');
  let html = '<span class="num">'+s.num+'</span>';
  if(s.pill) html += '<span class="pill">'+s.pill+'</span>';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.t==='title'){ html += '<h1>'+s.h+'</h1>'; if(s.sub) html += '<p class="sub">'+s.sub+'</p>'; }
  else if(s.t==='section'){ html += '<h2>'+s.h+'</h2>'; if(s.sub) html += '<p class="sub">'+s.sub+'</p>'; }
  else if(s.t==='twocard'){ html += '<h2>'+s.h+'</h2><div class="two">'; s.cards.forEach(function(c){ html += '<div class="card"><h3>'+c.h+'</h3><p>'+c.p+'</p></div>'; }); html += '</div>'; }
  else if(s.t==='cta'){ html += '<h2>'+s.h+'</h2>'; if(s.p) html += '<p>'+s.p+'</p>'; html += '<ul class="cta-steps">'; s.steps.forEach(function(x){ html += '<li>'+x+'</li>'; }); html += '</ul>'; if(s.disc) html += '<div class="disc">'+s.disc+'</div>'; }
  else { html += '<h2>'+s.h+'</h2>'; if(s.p) html += '<p>'+s.p+'</p>'; }
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
