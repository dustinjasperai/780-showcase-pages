<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>How to Sell So It Doesn't Feel Like Selling · 30 Minutes to President's Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf9f4; --panel:#ffffff; --rule:#e4e2d8;
    --ink:#1c1c1c; --accent:#3d4d91; --spark:#fce552;
    --grey:#4c5566; --dim:#9aa2ad;
  }
  html,body{height:100%}
  body{background:#e8e6df;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dedbd2}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'DM Sans',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'Oswald',sans-serif;font-weight:700;color:var(--ink);line-height:1.06;letter-spacing:.004em;text-transform:none}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-title .bar{width:16vw;height:.9vh;background:var(--spark);margin-top:3.2vh}
  .t-normal h1{font-size:3.35vw;max-width:88%}
  .t-normal .body{font-family:'DM Sans',sans-serif;font-size:1.52vw;color:var(--grey);margin-top:2.8vh;max-width:78%;line-height:1.6;font-weight:400}
  .sub{font-family:'DM Sans',sans-serif;font-size:1.62vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'DM Sans',sans-serif;font-size:1.24vw;font-weight:700;color:var(--accent);margin-bottom:2.2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:5.0vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:var(--spark);margin-top:3.6vh}
  .t-dark{background:#1c1c1c;align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:88%;color:#faf9f4;line-height:1.16}
  .t-dark .accentxt{color:var(--spark)}
  .t-cta{background:#1c1c1c;align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:#ffffff}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'DM Sans',sans-serif;border:2px solid var(--spark);color:var(--spark);border-radius:100px;padding:1.3vh 1.8vw;font-size:1.2vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-family:'DM Sans',sans-serif;font-size:.92vw;color:rgba(250,249,244,.72);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .brandline{font-family:'DM Sans',sans-serif;font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .motif{position:absolute;pointer-events:none;right:7%;bottom:8%;width:20vw;opacity:.9}
  .corner-motif{position:absolute;pointer-events:none;right:6%;bottom:7.4%;width:8.5vw;opacity:.42}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(61,77,145,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'DM Sans',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.7vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 18</div>
<div class="brand-foot">30 Minutes to President's Club</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: two conversation bubbles on a baseline (discovery = a conversation, not a pitch) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="motif" viewBox="0 0 260 150">
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 30 h150 a14 14 0 0 1 14 14 v42 a14 14 0 0 1 -14 14 h-92 l-24 22 v-22 h-24 a14 14 0 0 1 -14 -14 v-42 a14 14 0 0 1 14 -14 Z" stroke="#3d4d91" opacity="0.9"/>
    <line x1="48" y1="52" x2="150" y2="52" stroke="#3d4d91" opacity="0.5"/>
    <line x1="48" y1="70" x2="120" y2="70" stroke="#3d4d91" opacity="0.5"/>
    <circle cx="214" cy="112" r="18" fill="#fce552" stroke="none" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:"How to Sell So It Doesn't Feel Like Selling",sub:'A live masterclass on running discovery so the buyer does the talking, opens up on their own, and sells themselves before you ever pitch. For B2B sellers who are done sounding like sellers.',brand:true,motif:true},
 {t:'normal',k:'Who this is for',title:"You're good in the room. The trouble starts before the room.",body:"You can handle a demo and you can close when the deal is real. But too many calls go quiet early, the buyer gives you happy ears, and by the time you find out nothing was there, the quarter is half gone. The skill that fixes that is discovery, and almost nobody was actually taught it."},
 {t:'normal',k:'The quiet tell',title:'The second a call feels like a pitch, the buyer stops telling you the truth.',body:"People can feel when they are being sold. The walls go up, the answers get shorter, and you start guessing. Great sellers never trigger that reflex. The call feels like a conversation with someone sharp, so the buyer keeps talking, and the truth keeps coming."},
 {t:'dark',title:"The best sellers don't sound like sellers. They sound like <span class=\"accentxt\">the smartest person the buyer spoke to all week.</span>"},

 {t:'section',idx:'Part One',title:'Why Selling Feels Like Selling'},
 {t:'normal',k:'The default move',title:'We were trained to pitch, so we pitch too early and too much.',body:"The instinct is to prove value by talking: features, use cases, the deck. But every sentence you spend pitching is a sentence the buyer is not spending telling you what actually matters. You fill the silence, and you lose the one thing discovery is for."},
 {t:'normal',k:'What it costs',title:'Happy ears feel great and end in no decision.',body:"When you do not surface the real problem, the deal does not die loudly. It stalls. It slips a quarter, then goes dark, then closes lost to no decision. The pipeline looks full and converts like it is empty, because the pain was never made real enough to act on."},
 {t:'dark',title:"People don't buy because you pitched well. They buy because they <span class=\"accentxt\">felt understood.</span>"},

 {t:'section',idx:'Part Two',title:'The No-Nonsense Method'},
 {t:'normal',k:'The Problem Proposition',title:'Open on the problem, in their words, not on your product.',body:"Instead of leading with what you sell, you name the exact problem the buyer actually feels, dangerously specific and in their own language, and then show how you solve it in one sentence. Get the problem right and the buyer leans in, because it sounds like you have been inside their world."},
 {t:'normal',k:'Labels and questions',title:'Make it a conversation with labels and calibrated questions.',body:"You mirror the buyer's own words back as a label, then ask a calibrated question that invites them to keep going. It does not feel like an interrogation and it does not feel like a pitch. It feels like thinking out loud with someone who gets it, and that is when the real problem finally comes out."},
 {t:'normal',k:'The First 60 Seconds',title:'Earn the right to keep talking, with tone, not tricks.',body:"The opening seconds decide whether the buyer leans in or checks out, and tone carries more of that than the words do. An honest, low-pressure open gives you permission to keep going, so the conversation starts on trust instead of on a script the buyer has heard a hundred times."},
 {t:'normal',k:'The Mr. Miyagi Method',title:'Handle objections by absorbing them, not fighting them.',body:"When the objection comes, the reflex is to rebut. The better move is to absorb it, acknowledge it, and redirect, using a talk track built for the type of objection it is. You stop arguing with the buyer and start solving with them, which is the whole point of not sounding like a seller."},
 {t:'dark',title:"Discovery isn't asking more questions. It's asking <span class=\"accentxt\">the one that makes them lean in.</span>"},

 {t:'section',idx:'Part Three',title:'When The Buyer Sells Themselves'},
 {t:'normal',k:'The no-pitch call',title:'The buyer does most of the talking, and closes part of the deal for you.',body:"Run this way, a discovery call sounds calm. The buyer describes the problem in vivid detail, agrees it is worth fixing, and starts asking how it would work, all before you have really pitched. The deal moves because the person who has to buy it has already talked themselves most of the way there."},
 {t:'normal',k:'Why 30MPC',title:'Built from 1,000+ discovery calls and 300+ top-1% reps.',body:"30 Minutes to President's Club is the top-ranked B2B sales podcast, hosted by Armand Farrokh and Nick Cegelski, and the tactics here come from breaking down 1,000+ real calls and interviewing 300+ top-1% sellers at companies like Salesforce, Gong, and Outreach. It is the method behind the bestselling book Cold Calling Sucks. No theory, just what the best reps actually say."},
 {t:'cta',title:'Ready to sell in a way that doesn’t feel like selling?',chips:['Get the Discovery course','Explore all 30MPC courses'],disc:'Educational content for B2B sales professionals and teams. No income, quota, or hiring result is guaranteed. Outcomes vary by person, role, market, and effort.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="${kind==='title'?'motif':'corner-motif'}"><use href="#motif"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.t==='title') h+=`<div class="bar"></div>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">30 Minutes to <b>President's Club</b> &middot; Armand Farrokh &amp; Nick Cegelski</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
