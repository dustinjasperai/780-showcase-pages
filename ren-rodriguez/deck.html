<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Neuroscience of Influence, a masterclass with René Rodriguez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f2;
    --panel:#ffffff;
    --rule:#dcd9cf;
    --ink:#2c3848;
    --head-ink:#37465a;
    --muted:#6b7382;
    --accent:#c81a17;
    --accent2:#37465a;
    --head:'Fjalla One',system-ui,sans-serif;
    --body:'PT Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 20px 50px rgba(44,56,72,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* "the frame" motif: thin accent brackets framing the slide, top-right and bottom-left */
  .slide::before{content:'';position:absolute;top:26px;right:26px;width:54px;height:54px;
    border-top:3px solid var(--accent);border-right:3px solid var(--accent);opacity:.55;pointer-events:none}
  .slide::after{content:'';position:absolute;bottom:26px;left:26px;width:54px;height:54px;
    border-bottom:3px solid var(--accent);border-left:3px solid var(--accent);opacity:.55;pointer-events:none}
  .kick{font-family:var(--head);font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:400;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:400;font-size:64px;line-height:1.04;margin:0 0 18px;letter-spacing:0;color:var(--head-ink)}
  h2{font-family:var(--head);font-weight:400;font-size:46px;line-height:1.08;margin:0 0 20px;letter-spacing:0;color:var(--head-ink)}
  h3{font-family:var(--head);font-weight:400;font-size:30px;line-height:1.15;margin:0 0 12px;color:var(--head-ink)}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:47ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 42px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:4px;top:23px;width:13px;height:13px;border-radius:3px;
    background:var(--accent)}
  li b{font-weight:700}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:104px;line-height:1;font-weight:400;letter-spacing:0;color:var(--head-ink)}
  .strike{color:transparent;-webkit-text-stroke:2px #37465a66;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:6px;background:var(--accent);transform:rotate(-2deg);border-radius:3px}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:25px;font-weight:400;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .who{font-size:19px;color:var(--muted);margin-top:auto;padding-top:22px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:64ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:700}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:700;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:42px}h2{font-size:31px}.big{font-size:60px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">AMPLIFII · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Neuroscience of Influence',p:'Why people say yes, and how any leader can engineer it, using the science behind AMPLIFII.',pres:'With <b>René Rodriguez</b>, author of Amplify Your Influence'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why people really say yes','The decision happens inside a frame, before they hear your argument.'],['Your three stories','The signature, core and why stories that move people to act.'],['Influence you can repeat','A system, not a personality trait, so it works when you are not in the room.']]},
 {t:'audience',kick:'Who this is for',h:'You are right, and they still are not moving.',p:'Leaders, executives and sales professionals who know their material cold, and still watch good ideas stall, strong pitches get a polite no, and teams nod in the room and then not change.',who:'<b>The trap:</b> you keep sharpening the argument, when the listener already decided inside a frame you never set.'},
 {t:'reframe',kick:'The reframe',big1:'A better argument.',big2:'Own the <span class="em">frame</span>.',p:'A stronger case rarely changes a made-up mind. People decide inside a frame the brain builds first, then hunt for reasons to justify it. Influence is not louder logic, it is setting that frame on purpose.'},
 {t:'stakes',kick:'The stakes',h:'Motivation fades. Behavior is the real test.',p:'A motivational hit feels good and changes nothing by Monday. The leaders who actually move people are not more inspiring in the moment, they are deliberate about the frame and the story that make the new behavior feel like the obvious choice.'},
 {t:'part',kick:'Part one',h:'Why good ideas stall.'},
 {t:'point',kick:'The core problem',h:'You are persuading with information.',p:'The default move is to add more, more data, more slides, more reasons. But the brain does not weigh facts neutrally, it filters them through whatever frame is already running. More information poured into the wrong frame just gets discounted.'},
 {t:'point',kick:'The core problem',h:'Charisma is the wrong target.',p:'Being told to be more confident or more polished treats influence as a personality you either have or fake. It is really a set of mechanics from behavioral neuroscience, which means it can be learned, taught, and repeated on purpose.'},
 {t:'signs',kick:'The core problem',h:'The signs you are leading with the wrong thing.',li:[['You win the logic and lose the yes','Airtight case, polite no.'],['People agree, then do not change','Nods in the room, nothing by Monday.'],['It works only when you are on','Influence tied to your energy, not to a system.']]},
 {t:'part',kick:'Part two',h:'The AMPLIFII system.'},
 {t:'framework',kick:'The model',h:'Influence, in three moves.',row:[['The frame','Set the context the decision happens inside, before the ask.'],['The story matrix','Signature, core and why stories that carry the belief.'],['Behavioral motivators','Trigger the action, not just the agreement.']],p:'Own your backstory to build the frame, then use the right story to move the right person.'},
 {t:'point',kick:'Move one: the frame',h:'Set the frame before the ask.',p:'Own your backstory and decide the context first, what this is really about, why now, and why you. When the frame is set, your argument lands inside it instead of fighting it.'},
 {t:'point',kick:'Move two: the story matrix',h:'Three stories, on purpose.',p:'A signature story that earns the frame, a core story that carries your belief, and a why story that moves the listener to act. Mapped in advance, so you are never reaching for the right one in the moment.'},
 {t:'point',kick:'Move three: motivators',h:'Turn agreement into action.',p:'Agreement is cheap, behavior is the outcome. Use the motivators the brain actually responds to, so people do not just nod, they move, and the change holds after you leave the room.'},
 {t:'part',kick:'Part three',h:'What changes when you own the frame.'},
 {t:'looks',kick:'The outcome',h:'The same expertise, finally landing.',li:[['The yes comes before the argument','You set the frame, so the case lands with the grain.'],['People act, not just agree','The story and the motivator carry it into behavior.'],['It works without you in the room','A repeatable system your team can run too.']]},
 {t:'whyme',kick:'Why René',h:'A behavioral scientist, not a hype man.',li:[['Thirty years in behavioral neuroscience','Three decades turning the science of decisions into practical influence for leaders and sellers.'],['Taught to over 100,000 people','The AMPLIFII system has been run with executives, sales teams and leaders worldwide.'],['A WSJ best-selling author','Amplify Your Influence was named Best Business Book of 2022.']]},
 {t:'cta',kick:'Your next step',h:'Ready to own the frame?',ctas:['<b>Join the AMPLIFY mentorship</b> to build your frame and your story matrix with René every month.','<b>Bring AMPLIFII to your team</b> so influence becomes a system, not a solo act.'],disc:'This masterclass is educational. It shares frameworks and approaches for communication and influence; it is not advice for your specific situation and not a guarantee of any particular outcome, income, or result. Outcomes vary.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
