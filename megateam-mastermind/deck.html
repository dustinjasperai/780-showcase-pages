<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Double Your Team's Net Profit While Working Less · John Tiller, MegaTeam Mastermind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0c1a34; --panel:#15253f; --rule:#1d2b44;
    --accent:#eece96; --ink:#f4ecda; --grey:#c8d2e0; --dim:#7d8aa0; --cream:#f4ecda;
  }
  html,body{height:100%}
  body{background:#06101f;font-family:'Montserrat',Helvetica,sans-serif;color:var(--grey);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06101f}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.12;letter-spacing:.004em}
  .t-title h1{font-size:4.5vw;max-width:96%;color:var(--ink);text-transform:none}
  .t-normal h1{font-size:3.05vw;max-width:92%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:3.0vh;max-width:80%;line-height:1.68;font-weight:400}
  .sub{font-family:'Playfair Display',serif;font-style:italic;font-size:1.85vw;color:var(--accent);margin-top:3.6vh;max-width:88%;line-height:1.44;font-weight:600}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.05vw;font-weight:600;color:var(--accent);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:94%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--accent) 62%,#b98a4a);margin-top:3.6vh;border-radius:2px}
  .t-dark{background:radial-gradient(140% 140% at 50% 6%,#16294a 0%,#08132a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:90%;color:var(--cream);text-transform:none}
  .t-cta{background:radial-gradient(140% 140% at 50% 100%,#16294a 0%,#08132a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:90%;color:var(--cream);text-transform:none}
  .t-cta .body{font-family:'Montserrat',sans-serif;color:#dbe3ef;font-size:1.38vw;margin-top:3vh;max-width:76%;line-height:1.64}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:500;letter-spacing:.02em}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-family:'Montserrat',sans-serif;font-size:.84vw;color:#8fa0b6;text-align:center;line-height:1.5}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mark{position:absolute;pointer-events:none}
  .title-mark{right:7.2%;bottom:11%;width:22vw;opacity:.95}
  .corner-mark{right:6.6%;bottom:8%;width:9vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.12vw;color:var(--grey);margin-top:3.8vh;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(238,206,150,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Montserrat',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.8vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.0vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">MegaTeam Mastermind</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a health-score gauge settling on the profit-and-freedom dial, drawn in his champagne gold on a navy face -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mark" viewBox="0 0 200 120">
  <g fill="none" stroke="#eece96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 96 A76 76 0 0 1 176 96" opacity="0.9"/>
    <path d="M40 96 L100 44" stroke="#eece96" stroke-width="4" opacity="0.95"/>
    <circle cx="100" cy="96" r="6" fill="#eece96" stroke="none" opacity="0.95"/>
    <path d="M100 44 l6 -2" opacity="0"/>
    <circle cx="176" cy="96" r="3.4" fill="#b98a4a" stroke="none" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Double Your Team’s Net Profit While Working Less',sub:'For real estate team leaders who built a team, and somewhere along the way became the busiest, most tired person in it.',brand:true,mark:'title'},
 {t:'normal',k:'Who this is for',title:'You built the team. Now the team runs on you.',body:'You went from producing agent to team leader because you wanted more: more income, more impact, more life. Then the pager never stopped. Every deal, every hire, every fire drill routes back to you. Production is up and somehow the profit is thin and the calendar is fuller than when you sold houses yourself. The team was supposed to buy your time back. Right now it is spending it.'},
 {t:'dark',title:'Most team leaders do not stall because they are bad at real estate. They stall because they are still the operating system the whole team runs on.'},

 {t:'section',idx:'Part One',title:'Why Growing the Team Quietly Shrinks the Profit'},
 {t:'normal',k:'The trap',title:'More agents, more volume, and a thinner check at the end of the month.',body:'Volume is the number everyone brags about. Net profit is the number that actually feeds your family. When you scale headcount without scaling the systems underneath it, the splits, the staff, the tools, and the leads eat the growth. You added production and added cost at the same rate, so you are running a bigger, louder business for close to the same take home.'},
 {t:'normal',k:'The cost',title:'When every decision needs you, you are the ceiling on the whole team.',body:'If nothing closes, hires, or gets fixed without your say so, the team can only grow as fast as your calendar allows. That is why the harder you push, the more fragile it feels. You cannot take a real vacation, you cannot get sick, and the business you built to give you freedom has quietly become the thing you can never step away from.'},
 {t:'dark',title:'The goal was never a bigger team. It was a team that produces more while needing you less.'},

 {t:'section',idx:'Part Two',title:'The MegaTeam Method: Systems, Support, and Strategy'},
 {t:'normal',k:'Start here, score the team',title:'You cannot fix the bottleneck until you can see it.',body:'Before you change anything, you measure. The MegaTeam Health Score looks honestly at the team across the parts that decide whether it scales: the systems, the roles, the profit per producer, and the leadership load sitting on you. Growth is almost always capped by one bottleneck at a time. Naming that single constraint is the first real move, and it is usually not the one you were worried about.'},
 {t:'normal',k:'Pillar one, systems',title:'Build the operating systems so the business does not live in your head.',body:'Every repeatable part of the team, lead follow up, transaction coordination, onboarding, the weekly rhythm, becomes a documented system that runs the same way whether or not you are in the room. This is what turns a group of agents who depend on you into a business that produces without you touching every piece. The freedom you want lives inside the systems you have not built yet.'},
 {t:'normal',k:'Pillar two, support',title:'Get the right people in the right roles, so you can finally let go.',body:'Overwhelmed team leaders are usually doing three jobs that were never theirs to keep. You define the roles the team actually needs, hire and develop the people to own them, and build a culture where they take real responsibility. People over profits is not a slogan here, it is the mechanism: when the right people own the right seats, the profit follows and your plate clears.'},
 {t:'normal',k:'Pillar three, strategy',title:'Run to a Growth Game Plan, not to whatever is loudest today.',body:'Instead of reacting to the market and your inbox, you run the team to a clear, sequenced plan built around one goal: more net profit with less of your personal time in the machine. You know your numbers, you know the next move, and you make decisions against the plan instead of the panic. Growth stops being something you hope for and becomes something you engineer.'},
 {t:'dark',title:'Systems so it runs without you. The right people to run it. A plan that points every week at profit and freedom.'},

 {t:'section',idx:'Part Three',title:'When the Team Runs Without You'},
 {t:'normal',k:'The shift',title:'The same team, more profit per producer, and your evenings back.',body:'This is the change leaders describe once the pieces are in place. Production is steady or growing, but now more of it survives to the bottom line, because the systems and roles carry the load you used to carry alone. You step out of the day to day operating, the team keeps performing, and for the first time the phone not ringing on a Saturday is a good sign instead of a scary one.'},
 {t:'normal',k:'On your terms',title:'A business that funds the life, instead of consuming it.',body:'The point was never to be the hardest working person in the county. It was to build something that produces real profit and gives you the time, and the legacy, you got into this for. Built by design instead of by default, the team becomes an asset that serves your life, your family, and the community you want to keep serving for the next twenty five years.'},
 {t:'normal',k:'Why learn this from John Tiller',title:'A team leader who built the mega team first, then the method.',body:'John Tiller has spent more than twenty five years in real estate and built F4 Realty in Richmond into a team responsible for over a billion dollars in career sales and more than four thousand families served. He learned the systems, support, and strategy the hard way, running the team himself. Now, through MegaTeam Mastermind, he teaches other team leaders to scale profit and get their freedom back without burning their life down to do it.'},
 {t:'dark',title:'You do not have to choose between a profitable team and a life outside of it. Built right, the team gives you both.'},

 {t:'section',idx:'Your Next Step',title:'Go Deeper Inside MegaTeam Mastermind'},
 {t:'normal',k:'Keep going',title:'The full method, live coaching, and a room of team leaders doing the same work.',body:'This session is the overview. MegaTeam Mastermind is where you put the whole method to work: score your team, build the systems and roles, and run your Growth Game Plan with John and a community of team leaders scaling profit and reclaiming their time alongside you.'},
 {t:'cta',title:'Ready to scale your team’s profit and get your freedom back?',body:'Start with your MegaTeam Health Score and a strategy call with John to map the one bottleneck holding your profit down, and the plan to fix it.',chips:['Get your MegaTeam Health Score','Book a strategy call'],disc:'Educational content for real estate team leaders and brokers. No income or business result is guaranteed. Results vary by person, effort, team, and market.'},
];

const deck=document.getElementById('deck');
function mark(kind){return `<svg class="mark ${kind==='title'?'title-mark':'corner-mark'}"><use href="#mark"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='cta'){
    h+=`<h1>${s.title}</h1>`;
    if(s.body) h+=`<div class="body" style="color:#dbe3ef;text-align:center;max-width:76%">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">${s.chips.map(c=>`<div class="chip">${c}</div>`).join('')}</div>`;
    if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  } else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">MegaTeam Mastermind &nbsp;&middot;&nbsp; <b>John Tiller</b></div>`;
  }
  if(s.mark) h+=mark(s.mark);
  else if(s.t!=='dark'&&s.t!=='section'&&s.t!=='cta'&&i>0) h+=mark('corner');
  d.innerHTML=h;
  deck.appendChild(d);
});

let cur=0;const slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('bar'),count=document.getElementById('count'),hint=document.getElementById('hint');
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  if(cur>0&&hint) hint.style.opacity='0';
}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1);
});
show(0);
</script>
</body>
</html>
