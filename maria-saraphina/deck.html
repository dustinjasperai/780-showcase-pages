<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Spiritual MBA — A Live Masterclass with Maria Saraphina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f1;        /* warm cream ground, from her dominant gold tint */
    --panel:#f2ead9;     /* gold family panel */
    --rule:#e0d2ad;      /* gold hairline */
    --ink:#1a202c;       /* her h1 color */
    --muted:#5c5648;
    --accent:#8d5cff;    /* her link purple, verbatim from brand probe */
    --gold:#d4b456;      /* her dominant brand gold */
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Montserrat', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#ece3d2;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    min-height:540px;margin:0 0 26px;padding:60px 62px;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  /* the single thin gold alignment line / meridian motif */
  .slide:before{content:"";position:absolute;left:62px;top:52px;width:46px;height:2px;background:var(--gold)}
  .slide.title:before,.slide.part:before,.slide.cta:before{display:none}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:600;font-size:60px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.1;margin-bottom:18px}
  .lead{font-family:var(--serif);font-style:italic;font-size:28px;line-height:1.3;color:var(--muted)}
  p.body{font-size:18px;line-height:1.6;color:#3a3630;max-width:42ch;margin-top:6px}
  p.body + p.body{margin-top:14px}
  .num{font-family:var(--serif);font-size:22px;color:var(--gold);font-weight:600}
  ul{list-style:none;margin-top:18px;display:grid;gap:12px;max-width:52ch}
  ul li{font-size:17px;line-height:1.5;color:#3a3630;padding-left:24px;position:relative}
  ul li:before{content:"";position:absolute;left:0;top:11px;width:10px;height:2px;background:var(--gold)}
  .pillar-k{font-family:var(--serif);font-size:30px;color:var(--ink);margin-bottom:10px}
  .title{background:linear-gradient(135deg,#fbf8f1 0%,#f4ecda 100%)}
  .title h1{font-size:72px}
  .title .promise{margin-top:22px;font-family:var(--serif);font-style:italic;font-size:26px;color:var(--muted);max-width:30ch}
  .part{background:var(--ink);color:#f7f2e7}
  .part .eyebrow{color:var(--gold)}
  .part h2{color:#fdfcf8;font-size:46px;margin:0}
  .part .sub{margin-top:14px;color:#cfc6b4;font-size:18px;max-width:44ch}
  .cta{background:linear-gradient(160deg,#241c3f 0%,#1a202c 100%);color:#f7f2e7;text-align:left}
  .cta .eyebrow{color:var(--gold)}
  .cta h2{color:#fdfcf8;font-size:48px}
  .cta .step{margin-top:20px;display:inline-block;border:1px solid var(--gold);color:#fdfcf8;
    padding:14px 26px;border-radius:40px;font-weight:500;letter-spacing:.02em}
  .cta .disclaimer{margin-top:34px;font-size:12.5px;line-height:1.5;color:#9a9282;max-width:56ch}
  .who{font-family:var(--serif);font-size:30px;line-height:1.25;color:var(--ink);max-width:24ch}
  .byline{margin-top:20px;font-size:15px;color:var(--muted);letter-spacing:.02em}
  .credit h2{margin-bottom:10px}
  .pagefoot{position:absolute;right:26px;bottom:20px;font-size:12px;color:#b9ad92;letter-spacing:.14em}
  @media(max-width:620px){
    .slide{padding:40px 30px;min-height:460px}
    h1,.title h1{font-size:44px}h2,.part h2,.cta h2{font-size:32px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A Live Masterclass with Maria Saraphina',
   h1:'The Spiritual MBA',
   promise:'Energetic alignment and real business strategy, taught live, in one room.'},

  {t:'who', eyebrow:'Who this is for',
   who:'For founders and creators who already have the success, and still feel a quiet gap where the meaning should be.',
   byline:'If you are intuitive and analytical at once, and you value depth over noise, you are in the right room.'},

  {t:'content', eyebrow:'The trap',
   h2:'You optimized everything.',
   body:['The funnel. The team. The offer. The calendar. You did the work every business book told you to do, and most of it worked.',
         'And the restlessness did not move. If anything, hitting the goals made it louder.']},

  {t:'content', eyebrow:'The reframe',
   h2:'This was never a strategy problem.',
   body:['More tactics on top of a misaligned foundation just makes the misalignment faster and more expensive.',
         'The plateau you feel is an alignment problem. It has a different cause, and a different fix.']},

  {t:'part', eyebrow:'Part One', h2:'Why more strategy stops working',
   sub:'The point where optimization quietly turns into avoidance.'},

  {t:'content', eyebrow:'The symptom',
   h2:'Doing more, feeling less.',
   body:['You scaled the business around who you were three years ago. You are not that person now.',
         'So every new tactic is solving the wrong question with more effort. The engine runs hot and the driver is somewhere else.']},

  {t:'content', eyebrow:'The real cause',
   h2:'The business and the self drifted apart.',
   body:['Your offers, your messaging, and your systems still carry an old identity. The work no longer feels like you, so it takes more force to move it.',
         'Alignment is not a soft idea here. It is the difference between pushing the business and being carried by it.']},

  {t:'part', eyebrow:'Part Two', h2:'The method: Energetic Alignment and Mastery',
   sub:'EAM, the framework underneath The Spiritual MBA. Six work areas, worked in order.'},

  {t:'content', eyebrow:'How the method moves',
   h2:'Cut to the cause, not the symptom.',
   body:['Most coaching manages symptoms. EAM locates the underlying energetic cause of a challenge and dissolves it, so the fix holds instead of resetting every quarter.',
         'We work six areas, each with its own outcome.']},

  {t:'pillar', eyebrow:'Work area one', num:'01', k:'Core Identity Clarification',
   body:['Name clearly who you are at this stage of your evolution, not the version the business was built around. Everything downstream depends on this being current.']},

  {t:'pillar', eyebrow:'Work area two', num:'02', k:'Soul Alignment',
   body:['Refine the offers, the messaging, and the systems until the work feels authentically yours again. Alignment you can feel in the calendar, not just the journal.']},

  {t:'pillar', eyebrow:'Work area three', num:'03', k:'Energetic Block Removal',
   body:['Clear the resistance patterns and the outdated identities that quietly cap the business. This is the part other strategy work skips, and it is usually the lever.']},

  {t:'pillar', eyebrow:'Work area four', num:'04', k:'Flow-Centric Strategy',
   body:['Rebuild the processes so they produce better results with less force. Strategy and energy stop fighting each other and start compounding.']},

  {t:'pillar', eyebrow:'Work area five', num:'05', k:'Leadership Presence',
   body:['Embody a calm, magnetic authority that does not run on adrenaline. Your team and your market feel the difference before you say a word.']},

  {t:'pillar', eyebrow:'Work area six', num:'06', k:'Legacy Building',
   body:['Turn the business into a vehicle for the impact and the freedom you actually came here for. The point was never the plateau.']},

  {t:'part', eyebrow:'Part Three', h2:'What alignment looks like',
   sub:'Less force. More flow. The same ambition, carried differently.'},

  {t:'content', eyebrow:'The shift',
   h2:'The work starts to feel like you again.',
   body:['Decisions get faster because they stop being arguments with yourself. The offers get cleaner. The restlessness resolves into direction.',
         'This is the intersection most coaching misses: strategy without energy stalls, and energy without strategy drifts. The method holds both.']},

  {t:'credit', eyebrow:'Your guide',
   h2:'Maria Saraphina',
   body:['Spiritual business coach, energy worker, and EAM mentor. Creator of The Spiritual MBA, a training that brings the rigor of a business education to the inner work most founders are never taught.',
         'She works at the intersection of business strategy and energetic alignment, because the founders she serves need both.']},

  {t:'content', eyebrow:'In one line',
   h2:'Align the self, and the strategy finally lands.',
   body:['That is the whole masterclass. The rest is the order you work it in, and the method that makes it hold.']},

  {t:'cta', eyebrow:'Your next step',
   h2:'Begin with an Aligned Energetic Reset.',
   step:'Book your Aligned Energetic Reset',
   disclaimer:'This masterclass is offered for educational purposes only. It is not financial, legal, medical, or psychological advice, and it makes no income or outcome guarantees. Results vary from person to person.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let inner = '';
  if (s.eyebrow) inner += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if (s.t === 'title') {
    inner += '<h1>' + s.h1 + '</h1>';
    inner += '<div class="promise">' + s.promise + '</div>';
  } else if (s.t === 'who') {
    inner += '<div class="who">' + s.who + '</div>';
    inner += '<div class="byline">' + s.byline + '</div>';
  } else if (s.t === 'part') {
    inner += '<h2>' + s.h2 + '</h2>';
    if (s.sub) inner += '<div class="sub">' + s.sub + '</div>';
  } else if (s.t === 'pillar') {
    inner += '<div class="num">' + s.num + '</div>';
    inner += '<div class="pillar-k">' + s.k + '</div>';
    (s.body||[]).forEach(p => inner += '<p class="body">' + p + '</p>');
  } else if (s.t === 'cta') {
    inner += '<h2>' + s.h2 + '</h2>';
    inner += '<div class="step">' + s.step + '</div>';
    inner += '<div class="disclaimer">' + s.disclaimer + '</div>';
  } else {
    inner += '<h2>' + s.h2 + '</h2>';
    (s.body||[]).forEach(p => inner += '<p class="body">' + p + '</p>');
  }
  inner += '<div class="pagefoot">' + String(i+1).padStart(2,'0') + ' / ' + String(S.length).padStart(2,'0') + '</div>';
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
