<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Spare-Room Microgreens Business · Brian Faulkner, Microgreens Entrepreneur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4f7ef; --panel:#e8f0dd; --rule:#d3e2c3;
    --acc:#018401; --ink:#232a22; --body:#43503f; --dim:#7d8a76; --cream:#f7faf2;
  }
  html,body{height:100%}
  body{background:#e9efe0;font-family:'Poppins',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9efe0}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Oswald',sans-serif;font-size:1.05vw;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Oswald',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.1;letter-spacing:.004em;text-transform:none}
  .t-title h1{font-size:5.0vw;max-width:94%;font-weight:600}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Poppins',sans-serif;font-size:1.7vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.45;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Oswald',sans-serif;font-size:1.15vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#28331f 0%,#161d10 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#28331f 0%,#161d10 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Poppins',sans-serif;color:#dfe8d3;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .sprout-motif{position:absolute;pointer-events:none}
  .title-sprout{right:7%;bottom:7%;width:15vw;opacity:.92}
  .corner-sprout{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Oswald',sans-serif;font-size:1.2vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(35,42,34,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.6vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Microgreens Entrepreneur</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- sprout motif: a single seedling breaking soil, drawn in the brand green -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="sprout" viewBox="0 0 120 120">
  <g fill="none" stroke="#018401" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 104 V56" opacity="0.9"/>
    <path d="M60 66 C44 66 34 56 32 40 C50 40 60 50 60 66 Z" opacity="0.85"/>
    <path d="M60 60 C76 60 86 48 88 32 C70 32 60 44 60 60 Z" opacity="0.85"/>
    <path d="M30 104 H90" opacity="0.5"/>
    <path d="M38 110 H82" opacity="0.3"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Spare-Room Microgreens Business',sub:'How to build a real, profitable microgreens business from one small room. No land, no greenhouse, no big investment.',brand:true,motif:'title'},
 {t:'normal',k:'Who this is for',title:'You want real income from microgreens. You just do not have a farm.',body:'You have seen microgreens sell for good money at the market and to restaurants. But every guide seems to assume you have land, a greenhouse, or thousands to spend on gear. So the idea stays an idea.'},
 {t:'dark',title:'The thing between you and a microgreens income was never space or money.'},

 {t:'section',idx:'Part One',title:'Why Most Microgreens Attempts Stall'},
 {t:'normal',k:'Growing by guesswork',title:'Without a system, every tray is an experiment.',body:'You sow, you wait, you hope. One crop molds, another bolts, the timing never lines up, and you cannot promise a chef the same trays every week. Inconsistent growing is the first thing that kills a young microgreens business.'},
 {t:'normal',k:'No home for the harvest',title:'Growing them is the easy half. Selling them is the half nobody plans.',body:'Plenty of people can grow a nice tray of pea shoots. Far fewer know who buys them, at what price, and how to land that first standing order. Without a market, even a perfect crop just wilts in the fridge.'},
 {t:'dark',title:'A spare room can out-earn a greenhouse, if what happens inside it is planned.'},

 {t:'section',idx:'Part Two',title:'The Spare-Room System'},
 {t:'normal',k:'The Growing Matrix',title:'A day-by-day plan for every crop, so nothing is left to memory.',body:'The Growing Matrix maps the most popular varieties across their full cycle: when to sow, when to keep them dark, when to bring light, how much to water, and the exact day to harvest. Follow the grid and production becomes repeatable instead of a gamble.'},
 {t:'normal',k:'The Four Market Channels',title:'Four proven places to sell, and how to open each one.',body:'Restaurants, retail and grocery, farmers markets, and a weekly subscription box. Each channel has its own way in, its own pricing, and its own rhythm. Knowing all four means a slow week in one is covered by the others, and the calendar stays full.'},
 {t:'normal',k:'The 8ft by 8ft model',title:'One small room, costed to the watt, run like a real operation.',body:'The setup that fits a spare bedroom: racks, light, airflow, and a schedule that turns trays over week after week. Cost the seed density and the electricity before you commit, so you know your margin on day one instead of hoping for it.'},
 {t:'dark',title:'Profitable is not about scale. It is about a small space run with a system.'},

 {t:'section',idx:'Part Three',title:'What a Working Spare Room Looks Like'},
 {t:'normal',k:'The business this builds',title:'Steady trays, standing orders, and a margin you can actually see.',body:'When the growing is systematized and the four channels are open, the guesswork drops out. You harvest to real orders, you know your numbers, and a spare room quietly turns into a dependable monthly income, without land, staff, or a greenhouse.'},
 {t:'dark',title:'You do not need more room. You need a system for the room you already have.'},
 {t:'normal',k:'Why Brian Faulkner',title:'A qualified horticulturist who built this in his own spare room.',body:'Brian is a degree-qualified horticulturist who spent years in professional growing, then built a real microgreens business selling to restaurants, shops, and markets out of a single 8ft by 8ft room. The Microgreens Entrepreneur podcast and the Blueprint course come straight from doing it.'},

 {t:'section',idx:'Your Next Step',title:'Grow a Business, Not Just Microgreens'},
 {t:'normal',k:'Keep going with Brian',title:'Start free, then get the full system when you are ready.',body:'The free mini course shows you whether this is for you. The Microgreens Business Blueprint is the complete path from an empty room to earning money growing and selling microgreens, with the Growing Matrix, the market channels, and the student community.'},
 {t:'cta',title:'Ready to build a microgreens business from one small room?',body:'Take the next step with Microgreens Entrepreneur.',chips:['Start the free mini course','Get the Microgreens Business Blueprint'],disc:'Educational content for aspiring and working microgreens growers. No income result is guaranteed. Results vary by grower, market, and effort.'},
];

const deck=document.getElementById('deck');
function sprout(kind){return `<svg class="sprout-motif ${kind==='title'?'title-sprout':'corner-sprout'}"><use href="#sprout"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Microgreens <b>Entrepreneur</b> · Brian Faulkner</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=sprout(s.motif);
  else if(s.t==='title') h+=sprout('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
