<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Amplified Growth System — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#eef3f8;
    --rule:#d5dde6;
    --ink:#2f3337;
    --muted:#6a7177;
    --accent:#2175b8;
    --head:'Roboto Condensed', system-ui, sans-serif;
    --body:'Open Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);scroll-snap-type:y mandatory;overflow-y:scroll;scroll-behavior:smooth}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:7vh 9vw;border-bottom:1px solid var(--rule);position:relative}
  .kick{font-family:var(--head);text-transform:uppercase;letter-spacing:.16em;font-size:.82rem;color:var(--accent);font-weight:700;margin-bottom:1.1rem}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(2.2rem,6vw,4.1rem);line-height:1.03;letter-spacing:-.01em;margin-bottom:1.1rem}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(1.7rem,4.2vw,2.8rem);line-height:1.08;margin-bottom:1rem}
  p{font-size:clamp(1.02rem,1.6vw,1.28rem);line-height:1.5;max-width:46ch;color:var(--ink)}
  p.lead{color:var(--muted)}
  .big{font-size:clamp(1.4rem,3vw,2rem);line-height:1.25;max-width:30ch;font-weight:600}
  ul{list-style:none;margin-top:1.2rem;max-width:52ch}
  li{position:relative;padding-left:1.7rem;margin:.7rem 0;font-size:clamp(1rem,1.5vw,1.2rem);line-height:1.4}
  li::before{content:"";position:absolute;left:0;top:.55em;width:.62rem;height:.62rem;background:var(--accent);border-radius:2px}
  .num{font-family:var(--head);font-weight:700;color:var(--accent);font-size:1rem;letter-spacing:.14em;text-transform:uppercase}
  .pillar{display:flex;gap:1rem;align-items:baseline;margin:.6rem 0;max-width:54ch}
  .pillar b{font-family:var(--head);color:var(--accent);min-width:2.1rem;font-size:1.3rem}
  .pillar span{font-size:clamp(1rem,1.5vw,1.18rem);line-height:1.4}
  .foot{position:absolute;bottom:3.2vh;left:9vw;font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;font-size:.7rem;color:var(--muted)}
  .cta{background:var(--panel)}
  .cta h1{color:var(--ink)}
  .btn{display:inline-block;margin-top:1.4rem;font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--accent);color:#fff;padding:.9rem 1.6rem;border-radius:6px;font-size:1rem}
  .disc{margin-top:1.8rem;font-size:.82rem;color:var(--muted);max-width:52ch;line-height:1.45}
  .panel{background:var(--panel);border-radius:10px;padding:1.6rem 1.8rem;max-width:50ch;margin-top:1rem}
</style>
</head>
<body>
<main id="app"></main>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kick">A Masterclass for Accountants, CFOs &amp; Advisors</div>
    <h1>Escape the 1:1 Trap</h1>
    <p class="lead">How advisors build a scalable, profitable practice and finally grow past trading hours for dollars, using the Amplified Growth System.</p>
    <div class="foot">Growth Amplifiers &middot; Kenny Harper</div>`},

  {t:'audience', cls:'', html:`
    <div class="kick">Who this is for</div>
    <h2>You are great at the work. Growth is the part nobody taught you.</h2>
    <ul>
      <li>Accountants, bookkeepers, fractional CFOs and profit advisors</li>
      <li>Consultants and coaches who sell their expertise one client at a time</li>
      <li>Advisors who want to move from 1:1 delivery to a 1:many model</li>
      <li>Owners who are tired of reinventing the wheel for every new client</li>
    </ul>`},

  {t:'trap', cls:'', html:`
    <div class="kick">The trap</div>
    <h2>Your calendar is full, and that is exactly the problem.</h2>
    <p>Every new client is another slot of your time. Referrals come in waves you cannot predict. The only way you know how to earn more is to work more. The practice runs on you, so it can never outgrow you.</p>`},

  {t:'reframe', cls:'', html:`
    <div class="kick">The reframe</div>
    <p class="big">More clients is not the goal. A business that grows without more of your hours is the goal.</p>
    <p class="lead" style="margin-top:1.2rem">If adding revenue always means adding hours, you do not have a business yet. You have a very demanding job you created for yourself.</p>`},

  {t:'part', cls:'', html:`
    <div class="num">Part One</div>
    <h1>The ceiling is the model, not the effort.</h1>
    <p class="lead">Working harder inside a 1:1 model only raises the ceiling an inch. The leverage is in changing the model itself.</p>`},

  {t:'costs', cls:'', html:`
    <div class="kick">The three hidden costs of 1:1</div>
    <ul>
      <li><b>Income capped by hours.</b> Your revenue stops the moment your calendar fills.</li>
      <li><b>Feast and famine leads.</b> Referral-only growth means you cannot turn demand up when you need it.</li>
      <li><b>No asset.</b> Nothing you build compounds, because every result lives in your head and your hours.</li>
    </ul>`},

  {t:'part', cls:'', html:`
    <div class="num">Part Two</div>
    <h1>The Amplified Growth System</h1>
    <p class="lead">A simple five-pillar framework that turns a 1:1 practice into a scalable advisory business, one pillar at a time.</p>`},

  {t:'pillar', cls:'', html:`
    <div class="kick">Pillar 1</div>
    <h2>Goals &amp; Execution</h2>
    <p>Get clear on the one number that matters this quarter and the few actions that actually move it. Most advisors are busy; few are focused. Direction first, discipline second.</p>`},

  {t:'pillar', cls:'', html:`
    <div class="kick">Pillar 2</div>
    <h2>Sales &amp; Marketing</h2>
    <p>Build a repeatable way to attract ideal clients and enroll them with confidence, so growth stops depending on who happens to refer you this month. Consistent client flow, not guesswork.</p>`},

  {t:'pillar', cls:'', html:`
    <div class="kick">Pillar 3</div>
    <h2>Team &amp; Synergy</h2>
    <p>Decide what only you can do, then build the team and roles to carry the rest. A 1:many model is impossible while you are the only person who can deliver the work.</p>`},

  {t:'pillar', cls:'', html:`
    <div class="kick">Pillar 4</div>
    <h2>Scalable Systems</h2>
    <p>Turn your best thinking into documented processes, templates and a simple delivery playbook. When the method lives in a system instead of your memory, it can serve ten clients as easily as one.</p>`},

  {t:'pillar', cls:'', html:`
    <div class="kick">Pillar 5</div>
    <h2>Cash &amp; Profits</h2>
    <p>Price for the outcome you create, protect your margins, and build profit into the model on purpose. Growth that does not improve your take-home is just a bigger, busier version of the trap.</p>`},

  {t:'cycle', cls:'', html:`
    <div class="kick">The operating rhythm</div>
    <h2>The 7-Step Amplified Growth Cycle</h2>
    <p class="lead">The pillars are the map. The cycle is how you run it every quarter so chaos turns into consistent, compounding growth.</p>`},

  {t:'cyclelist', cls:'', html:`
    <div class="kick">The cycle, step by step</div>
    <div class="pillar"><b>1</b><span><b>Fuel</b>: reconnect to why this matters, so the energy is there to lead.</span></div>
    <div class="pillar"><b>2</b><span><b>Focus</b>: choose the one area of the business that needs you most.</span></div>
    <div class="pillar"><b>3</b><span><b>Prioritize</b>: rank the issues and opportunities by real impact.</span></div>
    <div class="pillar"><b>4</b><span><b>Plan</b>: set specific goals and the exact actions to reach them.</span></div>
    <div class="pillar"><b>5</b><span><b>Execute</b>: sharpen the disciplines that get things actually done.</span></div>
    <div class="pillar"><b>6</b><span><b>Measure</b>: track a Growth Scorecard of the metrics that predict results.</span></div>
    <div class="pillar"><b>7</b><span><b>Review</b>: reflect, learn, and feed it back into the next cycle.</span></div>`},

  {t:'part', cls:'', html:`
    <div class="num">Part Three</div>
    <h1>What 1:many looks like.</h1>
    <p class="lead">Same expertise. A model that no longer depends on filling every hour of your week.</p>`},

  {t:'after', cls:'', html:`
    <div class="kick">On the other side of the system</div>
    <ul>
      <li>A clear niche and a signature offer that scales past one-to-one</li>
      <li>Consistent client flow you can rely on instead of waiting on referrals</li>
      <li>A team and systems that deliver your method without you in every seat</li>
      <li>Profit built into the model, and your calendar back under your control</li>
    </ul>`},

  {t:'why', cls:'', html:`
    <div class="kick">Why listen to me</div>
    <h2>I built this for advisors, because generic business advice does not fit how we grow.</h2>
    <p>I am Kenny Harper, co-founder of Growth Amplifiers and author of The Amplified Advisor. As a Certified Magnetic Marketing Advisor I have spent years helping accountants, advisors and consultants simplify, scale and keep more profit without burning out, using the exact system in this masterclass.</p>`},

  {t:'signature', cls:'', html:`
    <div class="kick">The core idea to take with you</div>
    <p class="big">Package your expertise into a signature offer and a system that runs without you. That is how an advisor finally escapes the 1:1 trap.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h1>Book your Amplified Business Breakthrough Session</h1>
    <p>Bring your practice as it is today. Together we will find the biggest bottleneck holding your growth back and map the first pillar to fix, so you leave with a clear plan to scale past 1:1.</p>
    <a class="btn" href="https://growthamplifiers.com/breakthrough-offer/">Apply for your Breakthrough Session</a>
    <p class="disc">Educational content only. This masterclass shares a framework and general strategies for growing an advisory business. No income, revenue, or result is guaranteed. Individual results vary and depend on your own effort, market, and circumstances.</p>`}
];

const app = document.getElementById('app');
for (const s of S){
  const sec = document.createElement('section');
  sec.className = 'slide ' + (s.cls || '');
  sec.innerHTML = s.html;
  app.appendChild(sec);
}
</script>
</body>
</html>
