<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The 5-Star Planner · Heather Hoesch Olsen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* Brand-derived (brand.json, plannerlifeacademy.com): dominant #41453c, sage #bed2c7,
       near-white #fefefe. Deck ground warmed to ivory; accent = deeper sage from #bed2c7. */
    --bg:#f7f5ef; --panel:#e9efe9; --rule:#cdd8cf;
    --acc:#6f8a7a; --sec:#41453c; --ink:#3a3e35; --grey:#5c6157; --dim:#9aa197; --cream:#f4f1e8;
  }
  html,body{height:100%}
  body{background:#2c2f28;font-family:'Raleway',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2c2f28}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Raleway',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--sec);line-height:1.12;letter-spacing:.004em}
  .t-title h1{font-size:5.6vw;max-width:94%;font-weight:700}
  .t-normal h1{font-size:3.5vw;max-width:88%}
  .t-normal .body{font-family:'Raleway',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:80%;line-height:1.7;font-weight:400}
  .sub{font-family:'Playfair Display',Georgia,serif;font-size:2.05vw;color:var(--grey);margin-top:3.0vh;max-width:86%;line-height:1.44;font-weight:500;font-style:italic}
  .brandline{font-family:'Raleway',sans-serif;font-size:1.15vw;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-top:4.4vh;font-weight:600}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.2vw;max-width:92%;font-weight:700}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .num{font-family:'Playfair Display',Georgia,serif;font-size:1.5vw;font-weight:600;color:var(--acc);letter-spacing:.1em;margin-bottom:1.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#414539 0%,#2c2f28 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:90%;font-weight:500;color:var(--cream);letter-spacing:.004em}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#414539 0%,#2c2f28 100%);align-items:center;text-align:center}
  .t-cta .kicker{color:#bed2c7}
  .t-cta h1{font-size:4.3vw;max-width:88%;font-weight:600;color:var(--cream)}
  .chips{display:flex;gap:1vw;margin-top:4.4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid #8aa798;color:#e7efe8;border-radius:100px;padding:1.3vh 1.9vw;font-size:1.2vw;font-weight:600;font-family:'Raleway',sans-serif;letter-spacing:.02em}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#9fb0a3}
  .t-title .disc,.t-normal .disc{text-align:left}
  .flourish{position:absolute;pointer-events:none;opacity:.5}
  .title-fl{right:7%;bottom:8%;width:22vw}
  .corner-fl{right:6%;bottom:7%;width:9vw;opacity:.34}
  .progress{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0;transition:width .45s ease;z-index:5}
  .meta{position:absolute;right:2.4vw;top:2.4vh;font-family:'Raleway',sans-serif;font-size:.86vw;letter-spacing:.14em;color:var(--dim);font-weight:600;z-index:5}
  .t-dark .meta,.t-cta .meta{color:#8f9a8c}
  .nav{position:absolute;inset:0;display:flex;z-index:4}
  .nav>div{flex:1;cursor:pointer}
  .hint{position:absolute;right:2.4vw;bottom:2.6vh;font-family:'Raleway',sans-serif;font-size:.86vw;letter-spacing:.12em;color:var(--dim);z-index:5;transition:opacity .4s}
</style>
</head>
<body>
<div class="stage">
  <div class="deck" id="deck"></div>
</div>
<svg width="0" height="0" style="position:absolute"><symbol id="fl" viewBox="0 0 200 120">
  <g fill="none" stroke="#6f8a7a" stroke-width="1.4" stroke-linecap="round">
    <path d="M20 100 C60 100 70 30 100 30 C130 30 140 100 180 100"/>
    <path d="M100 30 C96 18 90 10 78 8"/><path d="M100 30 C104 18 110 10 122 8"/>
    <circle cx="100" cy="30" r="3.4" fill="#6f8a7a" stroke="none"/>
  </g>
</symbol></svg>
<div class="progress" id="bar"></div>
<div class="meta" id="count"></div>
<div class="hint" id="hint">Use arrow keys</div>
<div class="nav"><div id="prev"></div><div id="next"></div></div>
<script>
const S=[
 {t:'title',title:'The 5-Star Planner',sub:'A live masterclass for wedding planners on the hospitality and systems that build a premium, profitable planning business, not just a prettier one.',brand:true,path:'title'},

 {t:'normal',k:'Who this is for',title:'You plan beautiful weddings. You are still treated like a vendor.',body:'You show up early, stay late, and hold the whole day together. Yet couples compare you on price, ask you to come down, and forget the person who made the day feel effortless. The design is dialed in. The part that makes couples pay a premium and rave for years was never something anyone taught you.'},

 {t:'dark',title:'Couples do not book you for the flowers. They book you for how safe and cared for you make them feel. That is a skill, and it can be taught.'},

 {t:'section',idx:'Part One',title:'The Vendor Trap'},
 {t:'normal',k:'The real competition',title:'You are not competing on design. You are competing on how the whole thing feels.',body:'Every planner in your market has a beautiful portfolio. That is table stakes, not a differentiator. What a couple actually remembers is whether they felt held at every step, from the first inquiry to the last dance. Planners who win the premium are selling the experience of being taken care of, not the moodboard.'},
 {t:'normal',k:'The discount spiral',title:'Cutting your price is not a booking strategy.',body:'When a yes feels uncertain, the easy move is to drop the number. It works once, and it teaches the couple you were overpriced to begin with. Discounting trains your best inquiries to haggle and quietly caps your income. The way out is not a lower price. It is a clearer reason your service is worth more.'},
 {t:'dark',title:'Underpricing does not just cost you money. It tells the couple you are a helper, not the person running their day.'},

 {t:'section',idx:'Part Two',title:'The Planner Life Method'},
 {t:'normal',k:'Pillar one, the foundation',title:'Plan every wedding from a system, not from scratch.',num:'01',body:'A repeatable planning process, from ceremony to rehearsal to the wedding day itself, is what turns a talented planner into a business. When the workflow is documented, nothing falls through the cracks, the day runs calm, and you can hand off pieces without lowering the standard. This is the backbone everything else sits on.'},
 {t:'normal',k:'Pillar two, the business',title:'Run it like a business, not an expensive hobby.',num:'02',body:'Contracts that protect you, vendor relationships that send you couples, and a team you can onboard without redoing their work. The planners who last are the ones who treat the business behind the weddings as seriously as the weddings themselves. Systems here are what let hospitality scale instead of burning you out.'},
 {t:'normal',k:'Pillar three, pricing and sales',title:'Price for the service you actually deliver, and hold it.',num:'03',body:'Most planners guess at pricing, then defend the number when a couple pushes. Pricing confidence comes from knowing exactly what your 5-star service covers and being able to say it out loud. Lead the sales conversation, frame the value instead of apologizing for the cost, and the right couples say yes at the right price.'},
 {t:'normal',k:'Pillar four, the experience',title:'Hospitality is the product. Everything else is delivery.',num:'04',body:'Onboarding that makes a couple exhale, communication that anticipates their worry before they voice it, and a calm hand through every hard moment. This is the pillar that separates a vendor from the person a family trusts with the biggest day of their life. It is also what turns one couple into three referrals.'},
 {t:'normal',k:'Pillar five, the craft',title:'The details couples never see are the ones they feel.',num:'05',body:'The tactile craft, from design to the small mechanics of a flawless day, is what makes the whole thing look effortless. Mastering the craft is not about doing more. It is about the quiet competence that lets a couple stop worrying and simply be present at their own wedding.'},
 {t:'normal',k:'The through line',title:'One method, from first inquiry to lifelong referral.',body:'The foundation, the business, pricing, the experience, and the craft are not five separate tactics. They are one path a couple travels: found by a planner with a real system, sold by the confidence of clear pricing, held by 5-star hospitality, and turned into a referral by how the whole thing felt. That is the difference between a busy planner and a premium one.'},
 {t:'dark',title:'Talent gets you the inquiry. Hospitality and a system get you the premium, the referral, and the business that lasts.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The planner this builds',title:'Booked at your price, on referrals you can count on.',body:'You stop discounting to win and stop guessing where the next couple comes from. The inquiries that land already understand your value, the calls end in yes more often, and your best couples become the reason strangers reach out. The business stops feeling like luck and starts feeling like something you run on purpose.'},
 {t:'dark',title:'You already have the talent and the taste. What changes is that you finally get paid what the experience is worth.'},
 {t:'normal',k:'Why Heather',title:'Twenty years, 800 weddings, and the method behind them.',body:'Heather Hoesch Olsen has planned more than 800 weddings across 20 plus years as lead planner of Heather Hoesch Events, and has spent over a decade mentoring planners around the world. She hosts the Planner Life Podcast and teaches the Planner Life Method through Planner Life Academy, the exact system above, to a global community of planners.'},

 {t:'section',idx:'Your Next Step',title:'Become the 5-Star Planner'},
 {t:'normal',k:'Where to begin',title:'Learn the method, then let Heather walk you through it.',body:'The Planner Life Academy course and certification lay out the full method, pillar by pillar, in Heather’s own words. The Planner Life Podcast goes deeper every week. And when you are ready to install the whole thing in your own business, Heather coaches planners through it directly.'},
 {t:'cta',k:'Planner Life Academy',title:'Ready to run a 5-star, premium planning business?',chips:['Join Planner Life Academy','Work with Heather 1:1'],disc:'Educational content for wedding planners and creative business owners. No income or business result is guaranteed. Results vary by person, market, and effort.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="flourish ${kind==='title'?'title-fl':'corner-fl'}"><use href="#fl"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    if(s.num) h+=`<div class="num">${s.num}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Heather Hoesch Olsen · Planner Life Academy</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.path) h+=motif('title');
  else if(s.t==='section') h+=motif('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
