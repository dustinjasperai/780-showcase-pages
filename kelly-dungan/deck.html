<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reclaim the Art of Perinatal Nursing - A Masterclass with Kelly Dungan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f0e6;
    --panel:#ece2d2;
    --rule:#d9cdba;
    --ink:#1c2838;
    --accent:#34495e;
    --blush:#f1e1d3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Crimson Text",Georgia,serif}
  .deck{scroll-snap-type:y mandatory;overflow-y:auto;height:100vh}
  section.slide{
    scroll-snap-align:start;min-height:100vh;width:100%;
    display:flex;flex-direction:column;justify-content:center;
    padding:7vh 9vw;position:relative;border-bottom:1px solid var(--rule);
  }
  section.slide.dark{background:var(--ink);color:var(--bg)}
  section.slide.panel{background:var(--panel)}
  .eyebrow{font-family:"Crimson Text",serif;font-style:italic;letter-spacing:.02em;
    color:var(--accent);font-size:clamp(14px,1.6vw,20px);margin-bottom:1.2rem}
  section.slide.dark .eyebrow{color:var(--blush)}
  h1{font-family:"Playfair Display",serif;font-weight:700;line-height:1.04;
    font-size:clamp(34px,6.2vw,76px);letter-spacing:-.01em}
  h2{font-family:"Playfair Display",serif;font-weight:600;line-height:1.08;
    font-size:clamp(28px,4.6vw,54px)}
  p.lead{font-size:clamp(18px,2.2vw,28px);line-height:1.5;max-width:60ch;margin-top:1.4rem}
  p.sub{font-size:clamp(16px,1.5vw,21px);line-height:1.5;max-width:58ch;margin-top:1rem;color:var(--accent)}
  section.slide.dark p.sub{color:var(--blush)}
  ul{margin-top:1.6rem;max-width:62ch;list-style:none}
  li{font-size:clamp(17px,1.9vw,24px);line-height:1.4;padding:.55rem 0 .55rem 1.6rem;
    position:relative;border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:1.25rem;width:.7rem;height:.7rem;
    border-radius:50%;background:var(--accent)}
  section.slide.dark li{border-color:rgba(241,225,211,.25)}
  section.slide.dark li:before{background:var(--blush)}
  .wave{position:absolute;left:9vw;bottom:5vh;width:140px;height:18px;opacity:.65}
  .num{position:absolute;right:9vw;bottom:5vh;font-size:13px;letter-spacing:.2em;color:var(--accent)}
  section.slide.dark .num{color:var(--blush)}
  .kicker{font-family:"Playfair Display",serif;font-size:clamp(20px,2.4vw,30px);color:var(--accent);margin-bottom:.6rem}
  .pillar-no{font-family:"Playfair Display",serif;font-size:clamp(40px,7vw,96px);color:var(--blush);line-height:1}
  .disc{font-size:14px;line-height:1.5;max-width:60ch;margin-top:2rem;color:var(--accent)}
  .byline{margin-top:2.4rem;font-style:italic;font-size:clamp(16px,1.6vw,22px)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<svg width="0" height="0"><symbol id="w" viewBox="0 0 140 18"><path d="M0 9 Q 17.5 0 35 9 T 70 9 T 105 9 T 140 9" fill="none" stroke="currentColor" stroke-width="2"/></symbol></svg>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass for labor & delivery nurses',h:'Reclaim the Art of Perinatal Nursing',byline:'with Kelly Dungan, RN, CNE, CPM. Nurse educator and Whidbey midwife.'},
 {t:'promise',eyebrow:'What this hour is for',h:'The physiologic birth skills the hospital trained out of you, brought back to the bedside.',sub:'You will leave with concrete, hands-on skills you can use on your next shift, inside your unit, without waiting for anyone to change the protocol.'},
 {t:'who',eyebrow:'Who this is for',h:'The nurse who came for the birth.',sub:'Labor and delivery nurses who still believe birth is something to be protected, not just managed, and who want their skills and their spark back.'},
 {t:'trap',panel:true,eyebrow:'The honest part',h:'You did not lose heart. The unit trained it out of you.',sub:'Monitors, protocols, short staffing and pace slowly replace the hands-on art with task completion. Then the exhaustion sets in and you wonder if it is you.'},
 {t:'reframe',dark:true,eyebrow:'The reframe',h:'Burnout is not a character flaw. It is a nervous system under siege and a skill set gone unused.',sub:'Both are reversible. That is the whole premise of this class.'},
 {t:'part',eyebrow:'Part one',h:'The core problem: physiology meets protocol'},
 {t:'point',eyebrow:'What actually happens in the room',h:'Physiologic birth runs on a hormonal blueprint.',sub:'Oxytocin, adrenaline and the physical mechanics of the pelvis are a choreography. Interrupt the choreography and labor stalls, then the cascade of interventions begins.'},
 {t:'point',panel:true,eyebrow:'The quiet cost',h:'And the nurse at the bedside loses the moves.',sub:'Positioning, patience, hands that know what to feel for. Skills that were once the heart of the work quietly fall out of practice when nobody protects the time for them.'},
 {t:'part',eyebrow:'Part two',h:'The BirthWise Nurse method'},
 {t:'pillar',no:'01',eyebrow:'Pillar one',h:'Physiologic skills at the bedside',sub:'Pelvic mechanics, positioning and physiologic labor support you can use inside the room you already work in. The hands-on art, made practical again.'},
 {t:'pillar',no:'02',panel:true,eyebrow:'Pillar two',h:'Protect the hormonal blueprint inside protocol',sub:'How to guard undisturbed labor and the physiologic cascade even when the unit, the clock and the chart are pulling the other way.'},
 {t:'pillar',no:'03',eyebrow:'Pillar three',h:'Regulate your own nervous system first',sub:'The Groundwork practices: somatic awareness, debriefing hard births and staying steady through a shift so the work stops costing you more than it gives.'},
 {t:'pillar',no:'04',panel:true,eyebrow:'Pillar four',h:'Become a change agent on your unit',sub:'Systems thinking, advocacy and the language of culture change, so one regulated, skilled nurse can shift how a whole floor holds birth.'},
 {t:'part',eyebrow:'Part three',h:'Inside a BirthWise shift'},
 {t:'picture',eyebrow:'A shift, reimagined',h:'Same unit. Same protocol. A different nurse in the room.',sub:'You read the labor, not just the strip. You offer a position instead of a drug first. You stay regulated when the room gets loud. The outcome is different, and so are you at the end of it.'},
 {t:'why',dark:true,eyebrow:'Why learn this from me',h:'Twenty years, two worlds of birth.',sub:'Community midwife and hospital nurse educator. I have taught over 4,000 nurses, and my work has been featured at state AWHONN conferences, the GOLD Labor and Delivery Symposium, and the Spinning Babies Confluence as an approved trainer.'},
 {t:'movement',eyebrow:'The bigger why',h:'We are building the culture of birth we want to belong to.',sub:'One reclaimed skill, one regulated nurse, one changed unit at a time. That is the movement, and you are exactly who it needs.'},
 {t:'fit',panel:true,eyebrow:'An honest fit check',h:'Who this serves best',sub:'This is for nurses who want to stay in the work and change it from the inside. It is not a shortcut out of nursing and not a quick fix for a broken system.'},
 {t:'deeper',eyebrow:'If you want to go all the way',h:'BirthWise Nurse: a twelve month mentorship.',sub:'A small cohort, capped at eight, moving through the full method together with live calls, a workbook, continuing education credits and a community of nurses doing the same work. Not a sea of faces over a screen.'},
 {t:'cta',eyebrow:'Your next step',h:'Join the next BirthWise Nurse cohort.',sub:'Reclaim the art, resource yourself, and change your corner of birth. Message me or visit kellydungan.com to find the next cohort and apply.',disc:'This masterclass is educational. It supports your clinical practice and does not replace your facility policy, your license scope, or physician and midwife orders. No specific clinical or career result is guaranteed. Results vary with each nurse, unit and situation.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide'+(s.dark?' dark':'')+(s.panel?' panel':'');
  let html='';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.no) html+='<div class="pillar-no">'+s.no+'</div>';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'||s.t==='promise'||s.t==='who'||s.t==='trap'||s.t==='reframe'||s.t==='picture'||s.t==='why'||s.t==='movement'||s.t==='fit'||s.t==='deeper'||s.t==='cta'){
    html+='<h1>'+s.h+'</h1>';
  } else {
    html+='<h2>'+s.h+'</h2>';
  }
  if(s.byline) html+='<div class="byline">'+s.byline+'</div>';
  if(s.sub) html+='<p class="sub">'+s.sub+'</p>';
  if(s.disc) html+='<p class="disc">'+s.disc+'</p>';
  html+='<svg class="wave"><use href="#w"></use></svg>';
  html+='<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  sec.innerHTML=html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
