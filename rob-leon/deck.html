<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Five Promises - A Live Masterclass for MSP Owners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe8df;        /* warm paper, light tint of his #47403e brown-grey */
    --panel:#fbf8f4;     /* warm off-white panel (derived, not pure white) */
    --rule:#e0d8cd;
    --ink:#47403e;       /* his dominant heading color */
    --muted:#8a827d;
    --accent:#38b6ff;    /* his one site accent (link blue) */
    --sans:'Work Sans',system-ui,sans-serif;
    --serif:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--serif)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(71,64,62,.03)}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--sans);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--sans);font-weight:700;font-size:32px;line-height:1.12;margin-bottom:14px}
  p{font-size:21px;line-height:1.5;margin-top:14px;max-width:62ch}
  .lead{font-size:24px}
  .big{font-size:30px;line-height:1.3}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  li{font-size:21px;line-height:1.4;padding-left:30px;position:relative}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .num{font-family:var(--sans);font-weight:700;color:var(--accent);font-size:15px;
    letter-spacing:.1em;margin-bottom:10px}
  .rule{height:1px;background:var(--rule);margin:26px 0}
  .foot{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:30px}
  .cta h1{font-size:40px}
  .disc{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:28px;max-width:60ch;line-height:1.5}
  .brandline{font-family:var(--sans);font-weight:600;font-size:14px;color:var(--muted);
    letter-spacing:.04em;margin-top:24px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A live masterclass for MSP owners',
    h1:'The Five Promises',
    p:'How to run a simpler, more profitable MSP without adding a single new service.',
    brand:'The MSP Playbook' },

  {t:'agenda',
    eyebrow:'What we will cover',
    h2:'One hour, three moves.',
    p:'Why adding services quietly caps your margin. The five promises underneath every MSP. And how to run the whole business through a single filter so it gets simpler as it grows.' },

  {t:'who',
    eyebrow:'Who this is for',
    h2:'If you own a small MSP and it keeps getting heavier, not lighter.',
    p:'You added services to grow. Every one came with more tools, more tickets, more things only you understand. Revenue went up and the business got harder to run. This hour is for owners who want the opposite: growth that makes the business calmer.' },

  {t:'trap',
    num:'THE TRAP',
    h2:'More services was supposed to mean more growth.',
    p:'So you kept saying yes. New line here, new product there. Now the stack is a mile wide, onboarding takes forever, and you are the only one who can hold it all together. The complexity you added to grow is the thing capping your margin and your time.' },

  {t:'reframe',
    num:'THE REFRAME',
    h2:'You do not have a services problem. You have a design problem.',
    p:'The size, the chaos, and the margin of your MSP are not fate. They are the result of decisions you can make differently. You cannot redesign a business you cannot see clearly. So first we make it simple enough to see.' },

  {t:'part', num:'PART ONE', h1:'The complexity tax' },

  {t:'body',
    h2:'Every service you run is really a delivery mechanism, not a promise.',
    p:'Help desk, compliance, backups, AI projects: owners think of these as the things they sell. They are not. They are just how you keep an underlying promise. When you manage the mechanisms instead of the promises, the menu grows forever and nothing feels finished.' },

  {t:'body',
    h2:'The menu-driven MSP never feels finished.',
    p:'When the business is a list of services, there is always one more to add, one more tool to learn, one more thing that only runs because you are in the room. The list has no natural edge. That is why it keeps getting heavier.' },

  {t:'part', num:'PART TWO', h1:'The five promises' },

  {t:'body',
    h2:'Underneath everything, an MSP makes exactly five promises.',
    p:'Not fifty services. Five promises. Reduce the whole business to these and the picture gets simple enough to run on purpose.',
    list:[
      'Keep us working. Technology should enable work, not interrupt it.',
      'Fix problems quickly. What matters is how fast normal business resumes.',
      'Help us make good technology decisions, without needing to be technical.',
      'Protect us from expensive technology mistakes. Clients buy confidence, not security.',
      'Handle technology so we do not have to think about it.'
    ] },

  {t:'body',
    num:'THE ONE FILTER',
    h2:'Run every decision through one question.',
    p:'Does this help us keep one of our five promises? If yes, it earns a place. If no, it is noise, and noise is what you cut. New tools, new service lines, new hires: all of them pass through the same gate.' },

  {t:'body',
    h2:'This is how you simplify without losing clients.',
    p:'You are not dropping what matters to them. You are naming what you were always really selling and organizing the business around it. Sales get easier because the promise is clear. Onboarding speeds up because the shape is repeatable. Delivery stops depending on you.' },

  {t:'body',
    num:'A WORKING EXAMPLE',
    h2:'Pick one promise and watch the noise fall away.',
    p:'Take "protect us from expensive mistakes." Every security tool, backup, and review now has a job you can explain to a client in one sentence. The things that keep no promise become easy to drop. That is simplification you can actually defend.' },

  {t:'part', num:'PART THREE', h1:'What a designed MSP looks like' },

  {t:'body',
    h2:'Predictable, repeatable, and no longer on your shoulders.',
    p:'A simpler menu becomes recurring revenue you can forecast. A clear promise becomes a repeatable process your team can run. And a repeatable process is the only thing that lets you delegate and finally step out of the bottleneck.' },

  {t:'body',
    num:'WHY ME',
    h2:'I have spent nearly thirty years inside this.',
    p:'I have worked with MSP owners for almost three decades and written The MSP Playbook for the ones who want to grow without adding complexity. The goal was never to build the biggest MSP. It is to build the right one. The five promises are how I help owners do that.' },

  {t:'body',
    h2:'Success does not come from more hustle.',
    p:'It comes from smarter design. If your MSP feels heavier every year, the answer is almost never one more service. It is a simpler business built on purpose around the promises your clients actually pay for.' },

  {t:'cta',
    eyebrow:'Your next step',
    h1:'Let us design your simpler MSP.',
    p:'Book a discovery call and we will map your business against the five promises and name the first three things to simplify.',
    cta:'Book a Discovery Call',
    disc:'Educational content only. No income or result is guaranteed. Results vary by business, effort, and market.',
    brand:'The MSP Playbook' }
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let h = '';
  if (s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if (s.num) h += '<div class="num">'+s.num+'</div>';
  if (s.h1) h += '<h1>'+s.h1+'</h1>';
  if (s.h2) h += '<h2>'+s.h2+'</h2>';
  if (s.p) h += '<p'+(s.t==='title'?' class="lead"':'')+'>'+s.p+'</p>';
  if (s.list){ h += '<ul>'; for (const i of s.list) h += '<li>'+i+'</li>'; h += '</ul>'; }
  if (s.cta) h += '<div class="brandline">'+s.cta+'</div>';
  if (s.disc) h += '<div class="disc">'+s.disc+'</div>';
  if (s.brand) h += '<div class="foot">'+s.brand+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
