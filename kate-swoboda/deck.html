<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Courage Gap - CLCC Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf3f7; --panel:#ffffff; --ink:#3b424a; --muted:#6b7179;
    --accent:#ff3399; --lime:#cff400; --line:#ecd9e6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:'Lora',serif;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
  .slide{display:none;width:min(1120px,94vw);aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(59,66,74,.10);padding:6% 7%;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
  .slide.on{display:flex;}
  .kick{font-family:'Poppins',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px;}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(28px,4.4vw,56px);line-height:1.05;letter-spacing:-.01em;}
  h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(22px,3.1vw,38px);line-height:1.1;margin-bottom:14px;}
  .sub{font-size:clamp(16px,1.9vw,22px);color:var(--muted);margin-top:18px;max-width:42ch;}
  .body{font-size:clamp(15px,1.7vw,20px);line-height:1.5;margin-top:14px;max-width:48ch;}
  ul{list-style:none;margin-top:18px;}
  li{font-size:clamp(15px,1.7vw,20px);line-height:1.35;padding-left:30px;position:relative;margin:12px 0;max-width:48ch;}
  li:before{content:"";position:absolute;left:0;top:.55em;width:12px;height:12px;background:var(--lime);border:2px solid var(--ink);border-radius:3px;}
  .big{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(40px,8vw,120px);color:var(--accent);line-height:1;}
  .pagenum{position:absolute;bottom:22px;right:30px;font-family:'Poppins',sans-serif;font-size:12px;color:var(--muted);}
  .tag{position:absolute;bottom:22px;left:30px;font-family:'Poppins',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .bar{height:6px;width:64px;background:var(--lime);border:2px solid var(--ink);border-radius:4px;margin-top:22px;}
  .pair{display:flex;gap:16px;align-items:center;margin-top:8px;}
  .chip{font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink);}
  .move{font-family:'Poppins',sans-serif;font-weight:700;color:var(--accent);font-size:clamp(16px,2vw,22px);margin-top:16px;}
  .disc{font-size:13px;color:var(--muted);line-height:1.45;margin-top:16px;max-width:60ch;}
  .nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-family:'Poppins',sans-serif;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav">Use the arrow keys to move through the deck</div>
<script>
const S = [
 {t:'title', kick:'A live CLCC masterclass', h:'The Courage Gap', sub:'Why new coaches freeze, and the 4-step habit that lets you coach with real depth.'},
 {t:'audience', kick:'Who this is for', h:'For coaches who want depth', body:'Aspiring and newly certified coaches who are done with scripts and formulas and want the inner skill to coach anyone, through anything.'},
 {t:'promise', kick:'The promise', h:'You will leave able to name your freeze point and the one move that unlocks it.', bar:true},
 {t:'kate', kick:'Your guide', h:'Kate Swoboda', body:'Author of The Courage Habit, creator of Your Courageous Life, and Director of the Credentialed Life Coach Collective, an ICF accredited coach training program.'},
 {t:'why', kick:'The real problem', h:'New coaches do not stall for lack of information.', body:'They freeze. At four predictable fear points that no amount of extra content will fix.'},
 {t:'habit-intro', kick:'The foundation', h:'Courage is a habit, not a trait.', body:'Grounded in CBT and ACT: you interrupt the old fear response and replace it with a courage response, until courage becomes the habit.'},
 {t:'habit-four', kick:'The Courage Habit', h:'Four steps', list:['Access the Body','Listen Without Attachment','Reframe Limiting Stories','Create Community']},
 {t:'freeze1', kick:'Freeze point 1', h:'The Impostor Freeze', sub:'It sounds like: who am I to coach anyone?'},
 {t:'move1', kick:'The move', h:'Reframe Limiting Stories', move:'You name the fear story, then choose the truer story you will act from.'},
 {t:'freeze2', kick:'Freeze point 2', h:'The Emotion Freeze', sub:'It sounds like: I lock up when a client cries or gets angry.'},
 {t:'move2', kick:'The move', h:'Access the Body', move:'You settle your own nervous system first, so you can stay present with theirs.'},
 {t:'freeze3', kick:'Freeze point 3', h:'The Fixer Freeze', sub:'It sounds like: I jump in and advise instead of coaching.'},
 {t:'move3', kick:'The move', h:'Listen Without Attachment', move:'You let go of needing to fix, and the real coaching finally has room to happen.'},
 {t:'freeze4', kick:'Freeze point 4', h:'The Alone Freeze', sub:'It sounds like: I am practising in a vacuum with no feedback.'},
 {t:'move4', kick:'The move', h:'Create Community', move:'You build the peer and mentor circle that turns practice into mastery.'},
 {t:'diagnose', kick:'Self diagnosis', h:'Which freeze is costing you the most right now?', body:'Pick one. That is your growth edge, and your Courage Habit move is already on the table.'},
 {t:'depth', kick:'The shift', h:'Coaching with depth vs coaching from a script', body:'A script runs out the moment a client surprises you. Depth never does, because it works with what is actually in the room.'},
 {t:'cringe', kick:'The standard', h:'Coaching without the cringe', body:'Skill, depth, and courage. Not scripts, not formulas, not six figure promises.'},
 {t:'scope', kick:'The craft', h:'Coaching vs therapy, done with skill', body:'You will know your scope, hold it cleanly, and send clients onward when the work is not yours to do.'},
 {t:'predatory', kick:'Protect yourself', h:'How to spot predatory coach training', body:'Look for Level 1 ICF accreditation or higher. Never settle for a CCE only badge dressed up as a credential.'},
 {t:'model', kick:'Where depth is built', h:'Courage plus Coaching plus Community', body:'The CLCC model: an in person retreat, distance learning, a personal growth mastermind, and real peer coaching hours.'},
 {t:'path', kick:'The credential path', h:'Level 1 ICF, concentrations, ACC', body:'Executive, Health and Wellness, Somatic and Nervous System, and Career concentrations, with a clear path to the ICF ACC credential.'},
 {t:'fit', kick:'Honest fit', h:'Who thrives here, and who does not', body:'This is for people who want to go deep and be changed by the work. It is not a weekend badge or a shortcut.'},
 {t:'cta', kick:'Your next step', h:'Come see the depth training up close.', body:'Join the Collective to get the catalogue, or book a consult to talk through whether CLCC is your fit.', disc:'This masterclass is educational. No income, credential, or client result is guaranteed. Results vary by person, effort, and circumstances. CLCC is an ICF accredited coach training program; ICF credentialing has its own separate requirements.'},
 {t:'close', kick:'Credentialed Life Coach Collective', h:'Become a life changing coach.', sub:'And the first life you change will be your own.'}
];
const stage = document.getElementById('stage');
stage.innerHTML = S.map((s,i)=>{
  let inner = '';
  if(s.kick) inner += '<div class="kick">'+s.kick+'</div>';
  if(s.big) inner += '<div class="big">'+s.big+'</div>';
  if(s.h) inner += (s.t==='title'?'<h1>'+s.h+'</h1>':'<h2>'+s.h+'</h2>');
  if(s.sub) inner += '<div class="sub">'+s.sub+'</div>';
  if(s.body) inner += '<div class="body">'+s.body+'</div>';
  if(s.move) inner += '<div class="move">'+s.move+'</div>';
  if(s.list){ inner += '<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(s.bar) inner += '<div class="bar"></div>';
  if(s.disc) inner += '<div class="disc">'+s.disc+'</div>';
  inner += '<div class="tag">The Courage Gap</div>';
  inner += '<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
  return '<section class="slide'+(i===0?' on':'')+'">'+inner+'</section>';
}).join('');
let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
function show(n){ slides[cur].classList.remove('on'); cur=(n+slides.length)%slides.length; slides[cur].classList.add('on'); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(cur+1);
  if(e.key==='ArrowLeft') show(cur-1);
});
stage.addEventListener('click',()=>show(cur+1));
</script>
</body>
</html>
