<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Do People Experience You? A Masterclass with Dr. Kym Harris-Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241526;
    --panel:#33203A;
    --rule:#4E3356;
    --accent:#CBA14B;
    --text:#F4ECE2;
    --dim:#C6B3C4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:52px 48px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide:before{content:"";position:absolute;top:0;left:0;width:6px;height:100%;background:var(--accent)}
  .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:700;font-size:46px;line-height:1.1;margin-bottom:18px}
  h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:34px;line-height:1.15;margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--text);margin-bottom:14px;max-width:70ch}
  p.sub{color:var(--dim);font-size:20px}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative;color:var(--text)}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:0;top:20px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pillar{font-family:'Bodoni Moda',Georgia,serif;color:var(--accent);font-size:30px;margin-bottom:10px}
  .big{font-family:'Bodoni Moda',Georgia,serif;font-size:40px;line-height:1.15;color:var(--text)}
  .mark{color:var(--accent)}
  .foot{position:absolute;bottom:18px;right:26px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .disclaimer{margin-top:20px;font-size:14px;color:var(--dim);line-height:1.5;max-width:68ch}
  .cover{min-height:540px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
 {t:'title',k:"A Leadership Masterclass with Dr. Kym Harris-Lee",h:"How Do People Experience You?",s:"The quiet shift that moves accomplished leaders from competent to bold.",cover:true},
 {t:'audience',k:"Who this is for",h:"You have earned your seat at the table.",body:["You are a mid to senior leader, and a woman who has climbed through competence, hard work, and confidence.","You deliver. People trust your results.","And still, the next level of impact feels like it is waiting just out of reach."]},
 {t:'trap',k:"The trap",h:"You did everything you were told to do.",body:["Work harder. Prove yourself. Let the results speak.","That is exactly how you got here.","It is also why the climb has quietly stalled, and no one has told you the real reason."]},
 {t:'reframe',k:"The reframe",h:"Competence is more than performance.",s:"What got you here will not get you there. Somewhere along the way, confidence became your ceiling."},
 {t:'problem1',k:"Part one",h:"Advancement is not an output problem.",body:["Early in a career, success runs on skill and effort.","At the senior level, that currency changes.","You are no longer measured only on what you produce. You are measured on how you are experienced in every room."]},
 {t:'problem2',k:"The real gatekeeper",h:"They are not evaluating your work. They are reading your presence.",body:["Decisions about your next role happen in conversations you are not in.","What travels into those rooms is not your task list. It is the experience of you that people carry.","Presence, not output, is what gets sponsored."]},
 {t:'cost',k:"The cost of being misread",h:"When you are unseen, you are unselected.",body:["Capable leaders get overlooked for the stretch role, the sponsorship, the seat.","For women of color especially, microinequities add a tax that competence alone cannot pay.","The answer is not shrinking, and it is not performing someone else. It is being experienced, on purpose."]},
 {t:'framework',k:"Part two",h:"The M.O.R.E.&reg; Mindset",s:"A four part way to lead so that the experience you create matches the leader you already are."},
 {t:'pillar',k:"Pillar one",pillar:"Maximum Self-Awareness",body:["Know, with precision, how you are experienced by stakeholders, peers, and direct reports.","This is not self-criticism. It is data.","You cannot manage an impression you cannot see."]},
 {t:'pillar',k:"Pillar two",pillar:"Optimal Optimism",body:["Lead from a resourced, forward leaning outlook, especially under pressure.","Optimism here is not denial. It is the posture that keeps a room moving toward what is possible.","People feel your steadiness before they hear your plan."]},
 {t:'pillar',k:"Pillar three",pillar:"Rich Relationships",body:["Relationships are your richest currency.","Influence is built in the connections you invest in long before you need them.","The leaders who rise are rarely the loudest. They are the most trusted."]},
 {t:'pillar',k:"Pillar four",pillar:"Empathetic Engagement",body:["Lead others by understanding their experience, not just directing their work.","When people feel understood, they give you their best thinking and their loyalty.","Empathy is not soft. It is how real influence compounds."]},
 {t:'question',k:"The one question",h:"How do people experience you?",s:"Ask it honestly, and the whole path from competent to bold opens up."},
 {t:'bold',k:"Bold authenticity",h:"Bring the best version of you. Without the armor.",body:["You do not have to choose between being yourself and being effective.","Bold authenticity means leading from who you actually are, with the self awareness to make that land.","It is the perspective of someone who has been there, used on purpose."]},
 {t:'boldask',k:"The Bold Ask",h:"Ask for what you want, strategically.",body:["Most capable leaders wait to be noticed. Bold leaders make a clear, well framed ask.","The Bold Ask is how you turn presence into advancement, on your terms.","Visibility is not vanity. It is how the right people know what you are ready for."]},
 {t:'practice',k:"Part three",h:"How the room changes around you",body:["You walk into the room already composed, already read as the leader in it.","You build alliances that carry your name into decisions you are not in.","You delegate with confidence, so your impact multiplies instead of maxing out."]},
 {t:'shift',k:"The shift",h:"From confident to bold.",body:["Confident: you trust yourself.","Bold: you are trusted, chosen, and sponsored, because people experience the leader you are.","That is not a personality you are missing. It is a practice you can build."]},
 {t:'whyme',k:"Why listen to me",h:"Dr. Kym Harris-Lee",body:["Board certified executive coach, and faculty at Smith College Executive Education.","Former talent and HR leadership at The Home Depot, Cox Enterprises, the University of Miami, and Emory University.","Doctorate in Organizational Leadership. Creator of the M.O.R.E.&reg; Mindset methodology, and coach to leaders and women of color across the country."]},
 {t:'community',k:"You do not do this alone",h:"Brilliant women, rising together.",body:["The work lands faster in community: a circle of women who own their power, lead with purpose, and dominate with grace.","Shared truths, time tested strategies, and a room that cheers you on.","Your health, wellness, and well being come first. Results follow."]},
 {t:'path',k:"The path forward",h:"Make the experience you create a choice.",body:["Start with the honest answer to the one question.","Build the four pillars of the M.O.R.E.&reg; Mindset into how you lead.","Make the Bold Ask, and let the right rooms experience the leader you already are."]},
 {t:'recap',k:"In one page",h:"Competent to bold",body:["Presence, not output, is what gets sponsored at the senior level.","The M.O.R.E.&reg; Mindset builds the experience you create, on purpose.","Bold authenticity and the Bold Ask turn that presence into advancement."]},
 {t:'cta',k:"Your next step",h:"Ready to be experienced as the leader you already are?",body:["If this is the level you are reaching for, let us talk about what the path looks like for you.","Begin a conversation with Dr. Kym Harris-Lee and explore the coaching and the BOLD Mastermind."],disclaimer:"Educational content only. No specific result, promotion, or income is guaranteed. Results vary based on individual effort, circumstances, and many factors outside any program's control."}
];
const deck=document.getElementById('deck');
S.forEach(function(sl){
  const d=document.createElement('section');
  d.className='slide'+(sl.cover?' cover':'');
  let html='';
  if(sl.k){html+='<div class="kicker">'+sl.k+'</div>';}
  if(sl.h){html+='<h1>'+sl.h+'</h1>';}
  if(sl.pillar){html+='<div class="pillar">'+sl.pillar+'</div>';}
  if(sl.s){html+='<p class="sub">'+sl.s+'</p>';}
  if(sl.body){html+='<ul>'+sl.body.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';}
  if(sl.disclaimer){html+='<p class="disclaimer">'+sl.disclaimer+'</p>';}
  html+='<div class="foot">Dr. Kym Harris-Lee &middot; The M.O.R.E.&reg; Mindset</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
