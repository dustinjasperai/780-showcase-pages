<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The 4 Pillars of Due Diligence Masterclass · Jordan Berry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f9fb; --panel:#e9f1f6; --rule:#d6e0e7;
    --deep:#02304a; --ink:#1a2530; --accent:#0a78b5; --tint:#58afdd; --highlight:#ec7100;
    --chalk:#ffffff; --grey:#41505c; --dim:#7a8894;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Sora',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.13;letter-spacing:-.015em}
  .t-title h1{font-size:4.6vw}
  .t-normal h1{font-size:3.2vw;max-width:86%}
  .t-normal .body{font-size:1.48vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.56;font-weight:400}
  .sub{font-size:1.72vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Sora',sans-serif;font-size:1.32vw;font-weight:600;color:var(--tint);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh;border-radius:3px}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#063f5e 0%,var(--deep) 70%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:88%;color:var(--chalk);font-weight:500}
  .t-dark h1 .a{color:var(--tint)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#063f5e 0%,var(--deep) 72%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:var(--chalk)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--tint);color:#dff0fa;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.18vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#8ca7b8}
  .t-title .disc,.t-normal .disc{text-align:left}
  .meter{position:absolute;pointer-events:none}
  .title-meter{right:7%;bottom:8%;width:24vw;opacity:.95}
  .corner-meter{right:6%;bottom:7%;width:11vw;opacity:.5}
  .brandline{font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.01em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Laundromat Resource</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- turns-per-day gauge / ledger motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="meter" viewBox="0 0 260 150">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M26 128 A104 104 0 0 1 234 128" stroke="#d6e0e7"/>
    <path d="M26 128 A104 104 0 0 1 150 34" stroke="#0a78b5"/>
    <line x1="130" y1="128" x2="182" y2="70" stroke="#ec7100" stroke-width="4"/>
    <circle cx="130" cy="128" r="7" fill="#0a78b5" stroke="none"/>
    <circle cx="150" cy="34" r="5" fill="none" stroke="#58afdd" stroke-width="3"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'How to Vet a Laundromat Before You Buy',sub:'The 4 Pillars of Due Diligence: the disciplined way to know what a store really earns before you own it.',brand:true,meter:'title'},
 {t:'normal',k:'Who this is for',title:'You are about to spend six figures on someone else’s numbers.',body:'You found a laundromat for sale, the seller handed you a tidy spreadsheet, and it looks great. First-time buyers make the deal on that page. That is exactly where first deals go wrong.'},
 {t:'dark',title:'The seller’s numbers are a story. The real numbers are <span class="a">somewhere else</span>.'},

 {t:'section',idx:'Part One',title:'Why First Deals Go Wrong'},
 {t:'normal',k:'The trap',title:'Most first laundromats are bought on the seller’s word.',body:'A pro forma, a verbal on the collections, a photo of a busy Saturday. None of it is verified, and the excitement of a first deal fills in the rest. Hope is doing the underwriting.'},
 {t:'normal',k:'The cost',title:'Overpay once and you carry the loss for years.',body:'A laundromat is priced off its income. Believe an inflated number and you pay for revenue that was never there, then spend seasons trying to grow into a price you should not have paid.'},
 {t:'dark',title:'You do not buy a laundromat. You buy its <span class="a">numbers</span>. Verify them first.'},

 {t:'section',idx:'Part Two',title:'The 4 Pillars of Due Diligence'},
 {t:'normal',k:'Pillar 1',title:'Verify the income, not the seller’s story.',body:'What the store actually earns, proven independently. Coin collections over time and the utility record, not the number written on the listing. If the income cannot be verified, it does not count in your offer.'},
 {t:'normal',k:'Pillar 1, deeper',title:'The water meter does not lie.',body:'Every wash uses water, so the utility history is a fingerprint of real volume. Line it up against the claimed revenue and the truth of the store starts to show, well before you ever wire a deposit.'},
 {t:'normal',k:'Pillar 2',title:'Verify the real expenses.',body:'Utilities, rent, insurance, repairs, and the lease terms that drive them. Owners quietly leave costs off the sheet. Knowing what actually goes out each month is half of knowing what the store is worth.'},
 {t:'normal',k:'Pillar 3',title:'Read the store’s trajectory.',body:'Lease runway, competition down the street, the neighborhood, and whether volume is climbing or fading. A store on the way down and a store on the way up can look identical for one month.'},
 {t:'normal',k:'Pillar 4',title:'Find the value-add upside.',body:'Pricing left untouched, the wrong equipment mix, dead hours, no wash-and-fold, thin marketing. The plan for after you buy is where a fair deal becomes a good one. You want upside you can actually reach.'},
 {t:'dark',title:'Income, expenses, trajectory, upside. Miss one pillar and the deal can turn on you.'},

 {t:'section',idx:'Part Three',title:'Reading the Store Like an Owner'},
 {t:'normal',k:'The one number',title:'Turns per day tells you if a store is winning.',body:'It is the average number of times each machine runs in a day. Learn to estimate it from utilities and collections and you can size a store’s real health in an afternoon, whether you are buying it or fixing it.'},
 {t:'normal',k:'Put it together',title:'Run any listing through the four pillars.',body:'Income proven, expenses confirmed, trajectory read, upside mapped. When all four line up you have a real offer. When one does not, you either re-price the deal or you walk. That discipline is the whole edge.'},
 {t:'normal',k:'Why me',title:'I have bought these stores, and I am licensed to broker them.',body:'I own multiple laundromats and hold a commercial real estate license, and I built Laundromat Resource, the podcast and community, so buyers stop learning this the expensive way. This is the process I use on my own deals.'},

 {t:'section',idx:'Your next step',title:'Buy Your First Laundromat the Right Way'},
 {t:'normal',k:'How I can help',title:'The full process, step by step.',body:'90 Days to Your First Laundromat walks the four pillars across 11 modules, with the tools for each phase of the buy. The community and coaching are there when your first real listing lands. All of it from working stores, not theory.'},
 {t:'cta',title:'Ready to vet your first deal with confidence?',chips:['Start the 90 Days course','Book a coaching call'],disc:'Educational content for aspiring laundromat owners. No income, revenue, or investment result is guaranteed. Results vary by market, deal, and execution.'},
];

const deck=document.getElementById('deck');
function meter(kind){return `<svg class="meter ${kind==='title'?'title-meter':'corner-meter'}"><use href="#meter"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Laundromat <b>Resource</b> · Jordan Berry</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.meter) h+=meter(s.meter);
  else if(s.t==='title') h+=meter('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
