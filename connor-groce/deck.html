<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Own the Franchise, Not the Job — Franchise Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1ece4;
    --panel:#faf7f2;
    --rule:#e0d8cc;
    --ink:#2a2623;
    --muted:#6f655d;
    --accent:#463939;
    --display:'Montserrat',system-ui,sans-serif;
    --body:'Source Sans Pro',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:48px 52px;margin:20px 0;box-shadow:0 1px 0 rgba(42,38,35,.04);min-height:320px;display:flex;flex-direction:column;justify-content:center}
  .slide .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin:0 0 14px}
  h1,h2,h3{font-family:var(--display);color:var(--ink);margin:0 0 14px;line-height:1.12}
  h1{font-size:46px;font-weight:800}
  h2{font-size:32px;font-weight:700}
  h3{font-size:22px;font-weight:700}
  p{font-size:19px;margin:0 0 12px;max-width:62ch}
  .lead{font-size:22px;color:var(--muted)}
  .sub{font-size:19px;color:var(--muted);margin-top:6px}
  ul{margin:8px 0 0;padding:0 0 0 22px}
  li{font-size:19px;margin:0 0 10px;max-width:60ch}
  .accentbar{height:6px;width:64px;background:var(--accent);border-radius:3px;margin:0 0 22px}
  .big{font-size:40px;font-family:var(--display);font-weight:800;line-height:1.1}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}
  .step{border:1px solid var(--rule);border-radius:10px;padding:18px}
  .step .n{font-family:var(--display);font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.08em}
  .step h3{font-size:19px;margin:6px 0 8px}
  .step p{font-size:16px;color:var(--muted)}
  .section .accentbar{margin-bottom:18px}
  .section h2{font-size:38px}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:22px;max-width:70ch}
  .foot{font-family:var(--display);font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.1em;text-transform:uppercase}
  .cta .big{color:var(--accent)}
  .slidenum{position:static;font-size:12px;color:var(--muted);font-family:var(--display);letter-spacing:.1em;margin-top:26px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
   eyebrow:'Franchise Gateway Live Masterclass',
   h1:'Own the Franchise, Not the Job',
   sub:'Building a franchise portfolio through executive ownership',
   note:'With Connor Groce, founder of Franchise Gateway'},

  {t:'promise',
   eyebrow:'What you leave with',
   h2:'In the next hour',
   bullets:[
     'How to choose the right franchise out of hundreds, instead of guessing',
     'How to fund it without draining your savings',
     'How to build it so it runs without you, and set up the next one']},

  {t:'point',
   eyebrow:'Who this is for',
   h2:'If you are done waiting for the 9-to-5 to pay off',
   bullets:[
     'Professionals ready to trade a salary for an asset they own',
     'Would-be owners overwhelmed by too many franchise brands',
     'Current owners who want to scale past a single location']},

  {t:'point',
   eyebrow:'The trap',
   h2:'Most people buy themselves a job',
   p:'They sign the franchise paperwork, then end up working sixty hours a week behind the counter. The business they bought for freedom turns into a shift that never ends. That is not ownership. That is a job with extra risk.'},

  {t:'reframe',
   eyebrow:'The reframe',
   big:'A franchise is not a job you buy. It is an asset you build.',
   sub:'Everything in the next hour follows from that one shift.'},

  {t:'point',
   eyebrow:'Part One: the real problem',
   h2:'Why most first-time owners stall',
   bullets:[
     'They pick a brand on emotion, not on fit with their goals and capital',
     'They run out of money because there was never a funding plan',
     'They get trapped inside the day-to-day and can never step out or step up']},

  {t:'point',
   eyebrow:'Part One: the cost of guessing',
   h2:'Hundreds of brands, one wrong bet',
   p:'There are hundreds of franchise brands competing for your signature, and every one of them looks good on a discovery call. Picking on a glossy brochure instead of on fit is how a six-figure decision goes sideways before you ever open the doors.'},

  {t:'section',
   eyebrow:'Part Two: the method',
   h2:'Identify. Evaluate. Capitalize.',
   sub:'The repeatable process behind every good acquisition.'},

  {t:'steps',
   eyebrow:'The method, step by step',
   h2:'Three moves, in order',
   steps:[
     {n:'01 IDENTIFY',h:'Find the three that fit',p:'Refine a field of hundreds of franchises down to the three that match your goals, your skills, and your capital.'},
     {n:'02 EVALUATE',h:'Narrow to the one',p:'Pressure-test the three on unit economics, owner validation, brand, and territory until the best fit is obvious.'},
     {n:'03 CAPITALIZE',h:'Fund it right',p:'Structure the financing and lender introductions so you buy without draining your savings.'}]},

  {t:'point',
   eyebrow:'Part Two: how to evaluate',
   h2:'The three-legged stool',
   bullets:[
     'The brand: proven unit economics and owners who would buy in again',
     'The territory: real demand where you actually want to operate',
     'You: the fit between the role, your capital, and the life you want']},

  {t:'point',
   eyebrow:'Part Two: executive ownership',
   h2:'Buy it so it runs without you',
   p:'Install management from day one instead of becoming the manager. You protect your time, you keep cash flow working for you, and you stay the owner rather than the operator.'},

  {t:'point',
   eyebrow:'Part Two: the portfolio',
   h2:'Then you stack the next one',
   p:'Once the first unit runs without you, the freed time and cash flow fund the second. Repeat it and you are not a franchisee with one location. You are an owner with a portfolio across verticals.'},

  {t:'point',
   eyebrow:'Part Three: your first ninety days',
   h2:'From salary to first acquisition',
   bullets:[
     'Month one: clarity on the right opportunity and the capital to reach it',
     'The first acquisition, set up to run under management',
     'The next opportunity, funded by the first']},

  {t:'point',
   eyebrow:'Part Three: the three pillars',
   h2:'How the work is supported',
   bullets:[
     'Career Transition: a clear path out of employment and into ownership',
     'Clarity and Strategy: cut through the noise and make informed decisions',
     'Community Support: you do not do it alone, you build alongside other owners']},

  {t:'point',
   eyebrow:'Why me',
   h2:'I built the map I did not have',
   p:'As a student I walked to the bank and wired $4,900 to buy into a holiday-lighting franchise. Inside eighteen months we doubled the brand prior first-year revenue record. Then I hired management, stepped into executive ownership, and used what that freed up to make more acquisitions across several verticals.'},

  {t:'point',
   eyebrow:'Recap',
   h2:'The whole method on one slide',
   bullets:[
     'Identify the right franchise, Evaluate down to the one, Capitalize it',
     'Run it under management so you own an asset, not a job',
     'Reinvest the time and cash flow into the next acquisition']},

  {t:'cta',
   eyebrow:'Your next step',
   big:'Let us find your first opportunity',
   p:'Book a free strategy session with Franchise Gateway. We will refine your search to the three opportunities that best suit you and map the path to the one.',
   note:'connorgroce.com / Franchise Gateway',
   disclaimer:'Educational only. Franchise ownership involves risk and results vary by owner, brand, market, and effort. Nothing here is a guarantee of income or results.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t==='cta'?'cta ':'')+(s.t==='section'?'section ':'');
  let html='';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1){html+='<div class="accentbar"></div><h1>'+s.h1+'</h1>';}
  if(s.big){html+='<div class="accentbar"></div><div class="big">'+s.big+'</div>';}
  if(s.h2){html+=(s.t==='section'?'<div class="accentbar"></div>':'')+'<h2>'+s.h2+'</h2>';}
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.note && s.t!=='cta') html+='<p class="lead">'+s.note+'</p>';
  if(s.p) html+='<p>'+s.p+'</p>';
  if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul>';}
  if(s.steps){html+='<div class="steps">';s.steps.forEach(st=>{html+='<div class="step"><div class="n">'+st.n+'</div><h3>'+st.h+'</h3><p>'+st.p+'</p></div>';});html+='</div>';}
  if(s.disclaimer) html+='<div class="disclaimer">'+s.disclaimer+'</div>';
  if(s.note && s.t==='cta') html+='<div class="foot">'+s.note+'</div>';
  html+='<div class="slidenum">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
