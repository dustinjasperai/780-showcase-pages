<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a First Draft That Reads Like a Third Draft - Sammi LaBue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafafa; --panel:#f1ece3; --ink:#404040; --mute:#6f6a63;
    --accent:#3a90bb; --teal:#94d1cb; --line:#e3ddd2;
    --serif:'Spectral',Georgia,serif; --sans:'Jost','Trebuchet MS',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);
       -webkit-font-smoothing:antialiased;line-height:1.5}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--line);border-radius:14px;
         padding:52px 56px;margin:0 0 22px;min-height:430px;display:flex;
         flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide.title{background:var(--panel)}
  .slide.part{background:var(--panel)}
  .slide.cta{background:var(--panel)}
  .k{font-family:var(--sans);font-weight:600;letter-spacing:.18em;text-transform:uppercase;
     font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1.08;
     letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.14;margin-bottom:16px}
  .sub{font-size:21px;color:var(--mute);font-style:italic;max-width:58ch}
  .body{font-size:19px;max-width:60ch;margin-top:6px}
  .body + .body{margin-top:14px}
  ul{list-style:none;margin-top:20px;max-width:60ch}
  li{font-size:19px;padding:12px 0 12px 30px;border-bottom:1px solid var(--line);position:relative}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:21px;width:14px;height:2px;background:var(--accent)}
  .partnum{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.2em;
           color:var(--accent);text-transform:uppercase;margin-bottom:14px}
  .rule{width:64px;height:3px;background:var(--teal);margin:4px 0 22px;border-radius:2px}
  .q{font-size:26px;line-height:1.3;max-width:54ch}
  .credit{font-family:var(--sans);font-size:15px;color:var(--mute);margin-top:30px;letter-spacing:.02em}
  .disc{font-family:var(--sans);font-size:13px;color:var(--mute);margin-top:26px;max-width:66ch;line-height:1.55}
  .tenet{font-family:var(--sans);font-weight:600;color:var(--accent);font-size:15px;
         letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
  .foot{font-family:var(--sans);font-size:13px;color:var(--mute);position:absolute;bottom:20px;right:24px;letter-spacing:.04em}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title',
   k:'A free live masterclass with Sammi LaBue',
   h:'Write a First Draft That Reads Like a Third Draft',
   sub:'How to plan a novel so the first pass comes out polished, and build a writing practice you actually keep.',
   credit:'Sammi LaBue, Fledgling Writing Workshops'},

  {t:'who', cls:'',
   k:'Who this hour is for',
   h:'For the writer who keeps meaning to start.',
   body:'You have always wanted to write a book. Maybe you have a few chapters, maybe just a feeling. This hour is for aspiring novelists and begin-againers: people with a real story and no map for getting it onto the page.'},

  {t:'trap', cls:'',
   k:'The trap',
   h:'Waiting to feel ready is the thing stopping you.',
   body:'So you over-research. You rewrite chapter one for the ninth time. You wait for a clear weekend, a burst of talent, the right mood. None of it arrives, and the draft stays unwritten.',
   list:['Rewriting the opening instead of moving forward','Researching as a way to avoid drafting','Treating writing as a mood, not a practice']},

  {t:'reframe', cls:'part',
   k:'The reframe',
   q:'A finished book was never about talent. It is about a practice you can return to, and a plan you made once.'},

  {t:'part', cls:'part',
   partnum:'Part One',
   h:'The real reason drafts die.',
   body:'Most drafts do not die from bad sentences. They die in the gap between sessions, when the blank page gets a little scarier each time you avoid it.'},

  {t:'content', cls:'',
   k:'Part One',
   h:'The blank-page spiral.',
   body:'Perfectionism tells you the words have to be good before they exist. So you stall, judge the little you wrote, and come back less often. The practice erodes, and the story goes quiet.'},

  {t:'content', cls:'',
   k:'Part One',
   h:'What finishing actually asks of you.',
   list:['A plan you can trust, so drafting is not guessing','A practice you can keep, so momentum survives a bad day','Permission to sound like yourself on the page']},

  {t:'part', cls:'part',
   partnum:'Part Two',
   h:'The Fledgling method: three tenets.',
   body:'Everything I teach sits on three tenets. They are how a writing practice survives real life, and how a first draft starts reading like a third.'},

  {t:'tenet', cls:'',
   tenet:'Tenet one',
   h:'Tenderness.',
   body:'Build a practice you can return to without shame. A missed day is not a verdict on whether you are a writer. Momentum beats guilt every time, and a kind practice is the one you actually keep.'},

  {t:'tenet', cls:'',
   tenet:'Tenet two',
   h:'Playfulness.',
   body:'Follow the prompt and the voice, not the outline police. Authenticity sells, inspires, and frees. The pages that sound most like you are the ones readers cannot put down, so we write toward that on purpose.'},

  {t:'tenet', cls:'',
   tenet:'Tenet three',
   h:'Resourcefulness.',
   body:'Plan the shape of the novel before you draft it. When you know where the story is going, the first pass comes out closer to a third. This is the heart of my Flight Behavior planning work.'},

  {t:'content', cls:'',
   k:'Part Two',
   h:'The daily-prompt practice.',
   body:'One prompt a day turns writing from an event into a habit. In Flight Behavior, six weeks of small, kind sessions add up to roughly 20,000 words of a planned draft. Not from willpower. From showing up.'},

  {t:'content', cls:'',
   k:'Part Two',
   h:'What "plan it once" looks like.',
   list:['Find the true center of your story before chapter one','Map the turns so drafting is filling in, not inventing','Leave room for discovery, so it never feels airless']},

  {t:'part', cls:'part',
   partnum:'Part Three',
   h:'When the practice finally carries you.',
   body:'A writer who was stuck at chapter three now opens the document most mornings. The pages are flawed and alive, and they do not need to be rewritten ten times, because the plan already did that work.'},

  {t:'content', cls:'',
   k:'Part Three',
   h:'From blank page to a draft that holds.',
   body:'You stop negotiating with yourself about whether today counts. The practice carries you, the plan steers you, and the voice is unmistakably yours. That is a first draft that reads like a third.'},

  {t:'why', cls:'',
   k:'Why learn this from me',
   h:'Sammi LaBue.',
   body:'I founded Fledgling Writing Workshops in 2016 and have worked with more than 2,500 writers. TimeOut NY named us one of the best writing workshops in NYC.',
   list:['MFA, Vermont College of Fine Arts','Author of Words in Progress, a guided journal (DK, 2020)','Work in The Sun, Slate, Literary Hub, Glamour, and HuffPost']},

  {t:'content', cls:'',
   k:'The path',
   h:'Where this leads.',
   list:['The Fledgling Course: begin, or begin again','Flight Behavior: plan the novel','Migration: write the self and the memoir','Carrier: submit your work for publication']},

  {t:'recap', cls:'part',
   k:'In one line',
   q:'Tenderness keeps the practice. Playfulness keeps the voice. Resourcefulness plans the book. Together they finish the draft.'},

  {t:'cta', cls:'cta',
   k:'Your next step',
   h:'Come write with us.',
   body:'If this is the practice you have been missing, join Flight Behavior for the six-week planned draft, or book one-on-one manuscript coaching and we will shape your pages together.',
   credit:'Fledgling Writing Workshops, with Sammi LaBue',
   disc:'Educational content only. No income, publication, or result is guaranteed, and outcomes vary with each writer and project.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  let html = '';
  if (s.partnum) html += '<div class="partnum">'+s.partnum+'</div>';
  if (s.k) html += '<div class="k">'+s.k+'</div>';
  if (s.tenet) html += '<div class="tenet">'+s.tenet+'</div>';
  if (s.h) html += '<h1 style="font-size:'+(s.t==='title'?46:34)+'px">'+s.h+'</h1>';
  if (s.cls && (s.t==='part'||s.t==='reframe'||s.t==='recap')) html += '<div class="rule"></div>';
  if (s.q) html += '<p class="q">'+s.q+'</p>';
  if (s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if (s.body) html += '<p class="body">'+s.body+'</p>';
  if (s.list){ html += '<ul>'; for (const it of s.list) html += '<li>'+it+'</li>'; html += '</ul>'; }
  if (s.credit) html += '<div class="credit">'+s.credit+'</div>';
  if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
