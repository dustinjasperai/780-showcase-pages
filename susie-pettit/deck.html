<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Calm Mom Method — Susie Pettit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f9fc;
    --panel:#eef3fb;
    --rule:#d3dfef;
    --ink:#13203e;
    --body:#455671;
    --accent:#fca9bb;
    --deep:#2a4072;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--body);font-family:'Inter',system-ui,sans-serif;line-height:1.5}
  h1,h2,.kick,.num{font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:7vh 8vw;border-bottom:1px solid var(--rule)}
  .inner{max-width:940px;width:100%}
  .kick{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--deep);font-family:'Inter',sans-serif;font-weight:600;margin-bottom:1.1rem}
  .kick .dot{color:var(--accent)}
  h1{font-size:clamp(2.2rem,5.4vw,4rem);line-height:1.08;letter-spacing:-.01em;margin-bottom:1.1rem}
  h2{font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.14;margin-bottom:1.1rem}
  .sub{font-size:clamp(1.05rem,1.8vw,1.35rem);color:var(--body);max-width:40ch}
  .lead{font-size:clamp(1.15rem,2vw,1.5rem);color:var(--ink);max-width:36ch;font-weight:500}
  .mark{background:linear-gradient(transparent 62%,var(--accent) 62%)}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:3px;color:var(--deep);opacity:.65}
  ul{list-style:none;margin-top:1.4rem;display:grid;gap:.75rem}
  li{padding-left:1.4rem;position:relative;color:var(--body);font-size:clamp(1rem,1.6vw,1.2rem)}
  li::before{content:'';position:absolute;left:0;top:.62em;width:.55rem;height:.55rem;border-radius:50%;background:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:2.2rem 2.4rem}
  .num{font-size:3.2rem;color:var(--accent);line-height:1}
  .pillar{display:grid;grid-template-columns:auto 1fr;gap:1.6rem;align-items:start}
  .flow{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin-top:1.4rem}
  .chip{background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:.7rem 1.3rem;color:var(--ink);font-weight:600}
  .arrow{color:var(--accent);font-weight:700;font-size:1.4rem}
  .stat{display:flex;gap:2.4rem;flex-wrap:wrap;margin-top:1.6rem}
  .stat b{display:block;font-family:Georgia,serif;font-size:2rem;color:var(--ink)}
  .stat span{font-size:.95rem;color:var(--body)}
  .foot{margin-top:2rem;font-size:.85rem;color:var(--body);opacity:.8}
  .cta .panel{border-color:var(--accent)}
  .disc{margin-top:1.6rem;font-size:.82rem;color:var(--body);opacity:.75;max-width:52ch}
  .brand{margin-top:1.3rem;font-size:.9rem;color:var(--deep);font-weight:600}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', kick:'Love Your Life <span class="dot">&bull;</span> Susie Pettit',
   h:'The Calm Mom Method',
   lead:'How to parent your teen from your own regulation, not their behavior.'},

  {t:'promise', kick:'What you&rsquo;ll walk away with',
   h:'One hour, one shift',
   items:['Why the harder you try to control your teen, the worse it feels','The five pillars that make the teen years calmer and closer','A daily practice you can start the second this ends']},

  {t:'who', kick:'Who this is for',
   h:'The mom who feels like she&rsquo;s walking on eggshells',
   sub:'You love your teenager. You also brace yourself before every conversation, and you&rsquo;re tired of being the only calm one, or the one who snaps.'},

  {t:'trap', kick:'The trap',
   h:'You&rsquo;ve tried every strategy to manage their behavior',
   sub:'Charts, consequences, the right consequence for the right thing. And the mood in the house still turns on a dime that you can&rsquo;t predict.'},

  {t:'reframe', kick:'The hard truth',
   h:'You can&rsquo;t <span class="strike">control your teenager</span>',
   lead:'And trying to is the exact thing that&rsquo;s exhausting you.'},

  {t:'truth', kick:'The one lever',
   h:'There is one thing you&rsquo;re 100% in charge of',
   lead:'How you <span class="mark">respond</span>. Everything in the teen years moves downstream of that.'},

  {t:'part', kick:'Part one', h:'Why reacting backfires'},

  {t:'point', kick:'Reaction vs response',
   h:'Reacting teaches them to hide',
   sub:'When your reaction is bigger than their problem, they stop bringing you the problem. Responding keeps the door open, which is the whole game in the teen years.'},

  {t:'part', kick:'Part two', h:'The Five Pillars of Parenting Teens'},

  {t:'pillar', num:'1', h:'Kindness',
   sub:'To them, and to you. Look back at how you were disciplined, then choose on purpose how you want to show up now.'},

  {t:'pillar', num:'2', h:'Curiosity',
   sub:'Swap &ldquo;how dare you&rdquo; for &ldquo;I wonder why.&rdquo; If they&rsquo;re acting badly, they&rsquo;re feeling badly, and curiosity is how you find the feeling.'},

  {t:'pillar', num:'3', h:'Unconditional love',
   sub:'Love them for who they are, not how they performed today. Your job is to be their biggest cheerleader, loudest on the hard days.'},

  {t:'pillar', num:'4', h:'Start over daily',
   sub:'A beginner&rsquo;s mind about your own triggers and about a brain that is still being built. Yesterday doesn&rsquo;t get a vote in this morning.'},

  {t:'pillar', num:'5', h:'Emotional responsibility',
   sub:'The thoughts you think create the feelings you feel. Your calm is yours to manage, never something your teen owes you.'},

  {t:'model', kick:'The tool underneath it',
   h:'The Thought Model',
   flow:['A moment happens','Your thought','Your feeling','Your response'],
   sub:'Nothing your teen does reaches your response without passing through a thought you get to choose.'},

  {t:'part', kick:'Part three', h:'Popcorn Parenting, the daily practice'},

  {t:'practice', kick:'A real Tuesday',
   h:'Stay sane and raise resilient teens',
   items:['You feel the flare, and you name the thought before the words','You get curious out loud instead of correcting','You repair fast when you miss, and you start over the next day']},

  {t:'why', kick:'Why listen to me',
   h:'I&rsquo;ve lived this five times over',
   sub:'I&rsquo;m a mom of five sons, ages 20 to 26, a certified life and parenting coach, and I&rsquo;ve been teaching this work for over 20 years.',
   stat:[['Top 1%','globally ranked podcast'],['415+','episodes of the show'],['140+','countries listening']]},

  {t:'recap', kick:'The whole thing in one line',
   h:'Change the mom, and the teen years change',
   lead:'You don&rsquo;t need a new way to control your teenager. You need a calmer you, and a method to get there.'},

  {t:'cta', kick:'Your next step',
   h:'Come do this work with me',
   sub:'Book a free clarity call, or join the Love Your Life School and start with the Five Pillars this week.',
   brand:'Susie Pettit &bull; Love Your Life &bull; smbwell.com',
   disc:'This masterclass is educational. No specific parenting outcome or result is guaranteed. Results vary from family to family.'}
];

const deck = document.getElementById('deck');
S.forEach(s=>{
  const sec=document.createElement('section');
  sec.className='slide '+s.t;
  let h='<div class="inner">';
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  if(s.num){
    h+='<div class="pillar"><div class="num">'+s.num+'</div><div>';
    h+='<h2>'+s.h+'</h2>';
    if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
    h+='</div></div>';
  } else {
    if(s.h){ h+= (s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>'); }
    if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
    if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
    if(s.items){ h+='<ul>'; s.items.forEach(i=>h+='<li>'+i+'</li>'); h+='</ul>'; }
    if(s.flow){ h+='<div class="flow">'; s.flow.forEach((f,i)=>{ h+='<span class="chip">'+f+'</span>'; if(i<s.flow.length-1) h+='<span class="arrow">&rarr;</span>'; }); h+='</div>'; }
    if(s.stat){ h+='<div class="stat">'; s.stat.forEach(x=>h+='<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'); h+='</div>'; }
  }
  if(s.brand) h+='<div class="brand">'+s.brand+'</div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  h+='</div>';
  sec.innerHTML=h;
  deck.appendChild(sec);
});
</script>
</body>
</html>
