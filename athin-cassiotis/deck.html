<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Business Growth MBA | A Masterclass with Athin Cassiotis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#eaf0f7;
    --panel:#ffffff;
    --rule:#d4dde8;
    --ink:#1a1a1a;
    --accent:#1863dc;
    --muted:#5b6572;
    --tint:#f4f8fd;
  }
  html,body{height:100%;}
  body{
    font-family:'Roboto',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:4vh 4vw;}
  .slide{
    width:100%;max-width:1000px;height:100%;max-height:640px;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:4px;
    box-shadow:0 18px 60px rgba(20,40,80,.10);
    position:relative;
    display:none;
    flex-direction:column;
    padding:52px 60px;
    overflow:hidden;
  }
  .slide.on{display:flex;}
  /* blueprint left rail */
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);}
  .num{position:absolute;top:26px;right:32px;font-family:'Roboto Condensed',sans-serif;font-weight:500;font-size:13px;letter-spacing:.18em;color:var(--muted);}
  .kick{font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:13px;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:60px;line-height:1.02;letter-spacing:-.01em;margin-bottom:22px;}
  h2{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.005em;margin-bottom:20px;}
  .sub{font-size:23px;font-weight:300;color:var(--muted);line-height:1.4;max-width:44ch;}
  .lede{font-size:22px;font-weight:400;line-height:1.5;max-width:52ch;color:var(--ink);}
  .lede.b{border-left:3px solid var(--accent);padding-left:22px;}
  ul{list-style:none;margin-top:8px;}
  ul li{position:relative;padding-left:30px;font-size:20px;line-height:1.4;margin-bottom:16px;max-width:50ch;font-weight:400;}
  ul li::before{content:"";position:absolute;left:0;top:12px;width:11px;height:11px;background:var(--accent);border-radius:2px;transform:rotate(45deg);}
  ul li b{font-weight:700;}
  .big{font-size:30px;font-weight:300;line-height:1.4;max-width:24ch;color:var(--ink);}
  .big b{font-weight:700;color:var(--accent);}
  /* pillar */
  .pill-n{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:96px;line-height:.85;color:var(--tint);position:absolute;right:48px;bottom:34px;letter-spacing:-.03em;}
  .pill-n span{color:var(--accent);}
  .tag{display:inline-block;font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:5px 11px;margin-bottom:20px;}
  .grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;}
  .cellitem{background:var(--tint);border:1px solid var(--rule);border-radius:3px;padding:14px 14px 16px;}
  .cellitem .c-n{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--accent);letter-spacing:.1em;}
  .cellitem .c-t{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:19px;margin-top:4px;letter-spacing:.01em;}
  .foot{position:absolute;left:60px;bottom:30px;font-family:'Roboto Condensed',sans-serif;font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted);}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;max-width:62ch;font-weight:300;margin-top:22px;}
  .cta-row{margin-top:8px;}
  .cta-row .step{font-size:22px;font-weight:500;line-height:1.5;max-width:46ch;}
  .cta-row .step b{color:var(--accent);font-weight:700;}
  /* nav */
  #bar{position:fixed;left:0;bottom:0;height:4px;background:var(--accent);width:0;transition:width .25s ease;z-index:10;}
  #hint{position:fixed;bottom:14px;right:20px;font-family:'Roboto Condensed',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);z-index:10;}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:9;cursor:pointer;}
  #prev{left:0;} #next{right:0;}
  @media (max-width:720px){
    .slide{padding:34px 30px;max-height:none;}
    h1{font-size:40px;} h2{font-size:30px;} .sub{font-size:19px;} .lede{font-size:19px;}
    .grid8{grid-template-columns:repeat(2,1fr);} .pill-n{font-size:64px;right:26px;}
    .num{right:20px;}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="prev" class="nav"></div>
<div id="next" class="nav"></div>
<div id="bar"></div>
<div id="hint">Click or use arrow keys</div>
<script>
const S=[
  {t:'title', k:'A Live Masterclass with Athin Cassiotis', h:'The Business Growth MBA', sub:'The 8 levers that actually grow a business, without needing to know everything about business.'},

  {t:'audience', k:'Who this is for', h:'You built the business. Now it runs you.', bullets:[
    'You are a business owner doing solid revenue, but growth has flattened and every extra dollar costs more hours.',
    'You are the busiest person in the company and the bottleneck for every real decision.',
    'You never went to business school, and most advice you hear is motivation, not a method.']},

  {t:'trap', k:'The trap', h:'Nobody taught you to run a business.', lede:'You got great at your craft, your trade, your service. That is what got you here. Then, almost overnight, you were handed a second job, running the business itself, and no one ever taught you how. So you run it the only way you can. On instinct, and on effort.'},

  {t:'reframe', k:'The reframe', big:'More hours is not a growth plan. It is a <b>busier prison.</b> Growth is a strategy problem, not an effort problem.'},

  {t:'problem', k:'Part one, the real problem', h:'Why good businesses stall', lede:'A stalled business is almost never lazy. It is unmodelled. Decisions get made reactively, marketing runs on hope, sales runs on discounting, and the numbers only get looked at when something breaks. An MBA is not a piece of paper. It is a system for making those exact decisions on purpose, in the right order.'},

  {t:'framework', k:'Part two, the system', h:'The Business Growth MBA System', sub:'A full MBA in strategic management, distilled into 8 levers an owner can actually pull. Master a few of them and growth stops being a mystery.', cells:[
    {n:'01',c:'Strategy'},{n:'02',c:'Planning'},{n:'03',c:'Branding'},{n:'04',c:'Marketing'},
    {n:'05',c:'Sales'},{n:'06',c:'Numbers'},{n:'07',c:'Systems & AI'},{n:'08',c:'Leadership'}]},

  {t:'pillar', tag:'Lever 01', h:'Strategy', lede:'Decide where you play and how you win before you spend another dollar competing. Most owners skip this and end up busy in a game they never chose. Pick the game first.', n:'01'},

  {t:'pillar', tag:'Lever 02', h:'Planning', lede:'A strategy nobody schedules is a wish. Planning turns the direction into a 12-month picture and this quarter into a handful of moves that actually get done.', n:'02'},

  {t:'pillar', tag:'Lever 03', h:'Branding', lede:'Branding is not a logo. It is the reason a buyer picks you and stops asking about price. When the story is clear, the discount conversation quietly disappears.', n:'03'},

  {t:'pillar', tag:'Lever 04', h:'Marketing', lede:'Leads should arrive on a system, not on a good week. A few channels, run properly and measured, beat ten channels run on hope. Predictable beats loud.', n:'04'},

  {t:'pillar', tag:'Lever 05', h:'Sales', lede:'A repeatable process converts more of the leads you already have, without dropping your price to do it. Most growth is hiding in the sales you are already close to.', n:'05'},

  {t:'pillar', tag:'Lever 06', h:'Numbers', lede:'You do not need to love spreadsheets. You need the handful of numbers that actually run the business, watched often enough to steer by them instead of guessing.', n:'06'},

  {t:'pillar', tag:'Lever 07', h:'Systems & AI', lede:'If it lives only in your head, it is a job, not an asset. Systems, now sharpened with AI, let the business make good decisions when you are not in the room.', n:'07'},

  {t:'pillar', tag:'Lever 08', h:'Leadership', lede:'Growth needs a team that owns outcomes, not one that waits for you. Leadership is what lets you step up out of the business instead of further into it.', n:'08'},

  {t:'compound', k:'Part three, how it fits together', h:'The levers compound', lede:'Pulled in order, each lever multiplies the next. Strategy makes marketing cheaper. Systems make sales repeatable. Numbers tell you which lever to pull next. That is the whole difference between a business that is merely busy and one that is genuinely growing.'},

  {t:'kingdom', k:'The bigger game', h:'From one business to a kingdom', lede:'A business run on a system throws off profit you can redeploy, into new offers, new streams, and assets that pay you whether you show up or not. That is how a single business becomes a diversified kingdom of wealth, and how growth quietly turns into freedom.'},

  {t:'looks', k:'What the first 90 days look like', h:'Where you start', bullets:[
    '<b>Weeks 1 to 2.</b> Pick the game. Get the strategy and the 12-month plan on one page.',
    '<b>Weeks 3 to 8.</b> Fix the single most broken lever first, usually marketing, sales or numbers.',
    '<b>Weeks 9 to 12.</b> Systemise what is now working so it holds without you in every decision.']},

  {t:'why', k:'Why I teach it this way', h:'I learned it the hard way, then the formal way.', lede:'I left school early, then went back and earned an MBA majoring in strategic management and entrepreneurship. I have worked with brands like Kmart, Target, Coles, Westfield and the Department of Defence, and coached thousands of business owners. As an NLP Master Practitioner, I also know that the mindset under the strategy is what makes any of it stick.'},

  {t:'cta', k:'Where to go from here', h:'Your next step', step:'If this is the way you want to grow, the next move is simple. <b>Book a free 15-minute Growth Session</b> and we will find the one lever holding your business back right now, or grab the <b>9 Keys to Business Growth Mastery</b> to start today.', disc:'This masterclass is educational. No specific result, revenue or income is guaranteed. Results vary and depend on your market, your effort and how you apply what you learn.'}
];

const stage=document.getElementById('stage');
const bar=document.getElementById('bar');
let i=0;

function esc(s){return s;}
function render(s,idx,total){
  const num='<div class="num">'+String(idx+1).padStart(2,'0')+' / '+total+'</div>';
  let inner='';
  if(s.t==='title'){
    inner='<div class="kick">'+s.k+'</div><h1>'+s.h+'</h1><div class="sub">'+s.sub+'</div>';
  }else if(s.t==='reframe'){
    inner='<div class="kick">'+s.k+'</div><div style="flex:1;display:flex;align-items:center;"><div class="big">'+s.big+'</div></div>';
  }else if(s.t==='framework'){
    let g='<div class="grid8">';
    s.cells.forEach(c=>{g+='<div class="cellitem"><div class="c-n">'+c.n+'</div><div class="c-t">'+c.c+'</div></div>';});
    g+='</div>';
    inner='<div class="kick">'+s.k+'</div><h2>'+s.h+'</h2><div class="sub" style="margin-bottom:6px;">'+s.sub+'</div>'+g;
  }else if(s.t==='pillar'){
    inner='<span class="tag">'+s.tag+'</span><h1>'+s.h+'</h1><div class="lede b" style="margin-top:6px;">'+s.lede+'</div><div class="pill-n"><span>'+s.n+'</span></div>';
  }else if(s.t==='cta'){
    inner='<div class="kick">'+s.k+'</div><h2>'+s.h+'</h2><div class="cta-row"><div class="step">'+s.step+'</div></div><div class="disc">'+s.disc+'</div>';
  }else if(s.bullets){
    let u='<ul>';s.bullets.forEach(b=>{u+='<li>'+b+'</li>';});u+='</ul>';
    inner='<div class="kick">'+s.k+'</div><h2>'+s.h+'</h2>'+u;
  }else{
    inner='<div class="kick">'+s.k+'</div><h2>'+s.h+'</h2><div class="lede">'+s.lede+'</div>';
  }
  return '<div class="slide on">'+num+inner+'</div>';
}
function show(n){
  i=Math.max(0,Math.min(S.length-1,n));
  stage.innerHTML=render(S[i],i,S.length);
  bar.style.width=((i+1)/S.length*100)+'%';
}
function next(){show(i+1);} function prev(){show(i-1);}
document.getElementById('next').addEventListener('click',next);
document.getElementById('prev').addEventListener('click',prev);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();}
});
show(0);
</script>
</body>
</html>
