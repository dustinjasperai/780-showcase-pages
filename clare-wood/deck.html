<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intentional Profit — A Masterclass with Clare Wood, CPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffbf9;        /* her off-white */
    --panel:#ffffff;
    --ink:#19168b;       /* her dominant deep indigo = accent */
    --rule:#e7e3f5;      /* tint of her indigo */
    --cream:#fff5e9;     /* her warm cream callout */
    --muted:#5b5a7e;     /* muted indigo-grey for body */
    --display:'Playfair Display',Georgia,serif;
    --body:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px;}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:18px;
    padding:52px 54px;
    margin:0 0 22px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(25,22,139,0.04);
  }
  .eyebrow{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--ink);opacity:.7;margin-bottom:18px;}
  h1{font-family:var(--display);font-weight:800;font-size:58px;line-height:1.02;letter-spacing:-.01em;margin-bottom:18px;}
  h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.1;margin-bottom:16px;}
  .lead{font-size:20px;line-height:1.5;color:var(--muted);max-width:40ch;}
  .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.12;max-width:20ch;}
  ul{list-style:none;margin-top:10px;}
  li{font-size:19px;line-height:1.45;color:var(--ink);padding:14px 0;border-bottom:1px solid var(--rule);display:flex;gap:16px;align-items:flex-start;}
  li:last-child{border-bottom:none;}
  li .n{font-family:var(--display);font-weight:700;color:var(--ink);opacity:.45;min-width:34px;}
  li .b{color:var(--muted);font-size:16px;display:block;margin-top:3px;font-weight:400;}
  li strong{font-weight:600;color:var(--ink);}
  .callout{background:var(--cream);border-radius:14px;padding:26px 30px;font-size:20px;line-height:1.45;color:var(--ink);max-width:44ch;}
  .foot{margin-top:30px;font-size:14px;color:var(--muted);}
  .credit{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;}
  .credit .big{font-size:30px;}
  .disclaimer{font-size:12px;color:var(--muted);opacity:.85;margin-top:26px;max-width:60ch;line-height:1.5;}
  .pagenum{font-size:12px;color:var(--muted);opacity:.5;margin-top:26px;letter-spacing:.1em;}
  .ctabtn{display:inline-block;margin-top:22px;background:var(--ink);color:#fff;font-weight:600;font-size:18px;padding:16px 30px;border-radius:999px;}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Clare Wood, CPA',h1:'Intentional Profit',lead:'How service and creative business owners decide the profit they want first, then build the business around it.'},

 {t:'list',eyebrow:'Who this is for',h2:'This is for you if...',items:[
   {k:'',h:'You have good months and still wonder where the money went.',b:'Revenue is up. The bank account does not seem to show it.'},
   {k:'',h:'You run a service or creative business.',b:'An agency, a studio, a practice. You sell your time and your team.'},
   {k:'',h:'You quietly dread looking at the numbers.',b:'Not because you cannot do it, because no one made it simple.'}
 ]},

 {t:'big',eyebrow:'The story you were sold',big:'"Grow your revenue, and the profit will follow."'},

 {t:'lead',eyebrow:'What actually happens',h2:'Bigger months. The same leftovers.',lead:'More clients means more delivery, more team, more spend. The business gets busier and the take-home barely moves. Profit keeps arriving as whatever happens to be left at the end. Usually, that is not much.'},

 {t:'big',eyebrow:'The reframe',big:'Profit is not what is left over. If it is leftovers, there is never any left.'},

 {t:'lead',eyebrow:'Part one, the real problem',h2:'Profit by accident',lead:'Most owners never decide a profit number. So pricing, hiring and spending all get set without one, and the business quietly optimises for revenue and busyness instead of for what you keep.'},

 {t:'list',eyebrow:'Part one',h2:'Why the profit vanishes',items:[
   {k:'01',h:'Pricing set by feel, not by the numbers.',b:'Rates that cover costs but were never built to leave a margin.'},
   {k:'02',h:'No profit target to plan against.',b:'You cannot hit a number you never named.'},
   {k:'03',h:'Avoidance.',b:'The longer the numbers feel scary, the less often you look, and the less control you have.'}
 ]},

 {t:'lead',eyebrow:'Part two, the method',h2:'Intentional Profit',lead:'A way to put profit back in the driver seat. You decide the profit you want, then reverse-engineer the business to deliver it. It pairs real financial rigour with the mindset shifts that make it stick.'},

 {t:'list',eyebrow:'Part two, pillar one',h2:'Decide the profit first',items:[
   {k:'',h:'Name the take-home profit you are building the business to produce.',b:'A real number, for the life you want, not the amount left after everything else.'},
   {k:'',h:'Then work backwards.',b:'Pricing, team and spend all get set to serve that number.'}
 ]},

 {t:'list',eyebrow:'Part two, pillar two',h2:'Know your numbers, without shame',items:[
   {k:'',h:'Clarity.',b:'You deserve to understand your own financials. No jargon, no overwhelm.'},
   {k:'',h:'Simplicity.',b:'A short list of numbers that actually tell you what is going on.'}
 ]},

 {t:'list',eyebrow:'Part two, pillar three',h2:'The 15-minute Money Meeting',items:[
   {k:'',h:'A weekly ritual, not a year-end panic.',b:'Fifteen minutes, once a week, with the numbers that matter.'},
   {k:'',h:'Profit becomes a habit.',b:'Small, regular decisions beat one big reckoning at tax time.'}
 ]},

 {t:'list',eyebrow:'Part two, pillar four',h2:'Pay yourself first, then fund the fun',items:[
   {k:'',h:'Profit with purpose.',b:'You take your share before the business spends its way through it.'},
   {k:'',h:'Fun funds.',b:'Money set aside on purpose for the life the business is meant to pay for.'}
 ]},

 {t:'list',eyebrow:'Part two, pillar five',h2:'Confident cashflow',items:[
   {k:'',h:'A simple forecast.',b:'See the money coming before it arrives, so bills stop being a surprise.'},
   {k:'',h:'The anxiety goes quiet.',b:'Decisions get calmer when you can see three months out.'}
 ]},

 {t:'callout',eyebrow:'Part three, what changes',h2:'What it looks like on the other side',callout:'You open the numbers without flinching. You pay yourself consistently. A good month actually shows up in your account, because you decided it would before the month began.'},

 {t:'credit',eyebrow:'Why learn this from me',h2:'Clare Wood, CPA',creditlines:[
   'Certified Practising Accountant with 25+ years in business and over a decade in corporate finance.',
   'Best-selling author of Intentional Profit and host of The Intentional Money Show.',
   'I have helped hundreds of service-business owners grow their profit, some doubling, tripling and more.'
 ]},

 {t:'big',eyebrow:'The idea in one line',big:'Decide the profit you want. Then build the business around it.'},

 {t:'cta',eyebrow:'Your next step',h2:'Grow your profit on purpose',lead:'If you want help making profit intentional in your business, book a free discovery call and we will map your next step together. This masterclass is educational and not financial, accounting or investment advice. No specific income or result is guaranteed. Results vary from business to business.',cta:'Book a free discovery call'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='title'){h+=`<h1>${s.h1}</h1><p class="lead">${s.lead}</p>`;}
  else if(s.t==='big'){h+=`<p class="big">${s.big}</p>`;}
  else if(s.t==='lead'){h+=`<h2>${s.h2}</h2><p class="lead">${s.lead}</p>`;}
  else if(s.t==='list'){h+=`<h2>${s.h2}</h2><ul>`+s.items.map(it=>`<li>${it.k?`<span class="n">${it.k}</span>`:''}<span><strong>${it.h}</strong>${it.b?`<span class="b">${it.b}</span>`:''}</span></li>`).join('')+`</ul>`;}
  else if(s.t==='callout'){h+=`<h2>${s.h2}</h2><div class="callout">${s.callout}</div>`;}
  else if(s.t==='credit'){h+=`<h2 class="big">${s.h2}</h2><ul>`+s.creditlines.map(l=>`<li><span>${l}</span></li>`).join('')+`</ul>`;}
  else if(s.t==='cta'){h+=`<h2>${s.h2}</h2><p class="lead">${s.lead}</p><span class="ctabtn">${s.cta}</span>`;}
  h+=`<div class="pagenum">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=h;deck.appendChild(el);
});
</script>
</body>
</html>
