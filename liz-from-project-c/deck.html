<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Going Solo Without Going Broke — a live masterclass with Project C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf7;      /* warm white, from their light scheme + #f5f6f8 panel */
    --panel:#f5f6f8;   /* their light panel */
    --ink:#15171a;     /* their dominant ink */
    --muted:#4a4f5c;
    --rule:rgba(21,23,26,.14); /* their hairline rule */
    --accent:#fe6b41;  /* their coral accent */
    --navy:#003a5d;    /* their deep navy, for depth */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Fraunces',Georgia,serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto}
  .slide{min-height:86vh;display:flex;flex-direction:column;justify-content:center;padding:72px 64px;border-bottom:1.5px solid var(--rule);position:relative}
  .kicker{font-size:14px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .dateline{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:600;font-size:clamp(44px,8vw,92px);line-height:1.02;letter-spacing:-.015em}
  h2{font-family:'Anton',Impact,sans-serif;font-weight:600;font-size:clamp(32px,5vw,58px);line-height:1.08;letter-spacing:-.012em}
  .lede{font-size:clamp(20px,2.4vw,27px);line-height:1.5;color:var(--muted);margin-top:26px;max-width:40ch}
  .big{font-size:clamp(26px,3.4vw,40px);line-height:1.32;max-width:24ch;font-weight:600}
  .big .a{color:var(--accent)}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px;max-width:52ch}
  li{font-size:clamp(18px,2vw,23px);line-height:1.4;padding-left:30px;position:relative;color:var(--ink)}
  li::before{content:'';position:absolute;left:0;top:.6em;width:13px;height:13px;border:2.5px solid var(--accent);border-radius:3px}
  li b{font-weight:700}
  li span{display:block;color:var(--muted);font-size:.86em;margin-top:4px;padding:0}
  .part{color:var(--navy)}
  .num{font-family:'Anton',Impact,sans-serif;font-weight:600;font-size:clamp(60px,12vw,150px);line-height:.9;color:var(--accent);opacity:.9}
  .panel{background:var(--panel);border-radius:18px;padding:40px 44px;margin-top:30px;border:1.5px solid var(--rule)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:34px}
  .cardx{background:var(--panel);border:1.5px solid var(--rule);border-radius:14px;padding:26px}
  .cardx h3{font-family:'Anton',Impact,sans-serif;font-weight:600;font-size:24px;letter-spacing:-.005em;margin-bottom:10px}
  .cardx p{font-size:17px;line-height:1.4;color:var(--muted)}
  .cardx .n{color:var(--accent);font-weight:700;font-size:15px;letter-spacing:.06em}
  .dark{background:var(--ink);color:var(--bg)}
  .dark .lede{color:#c9ced8}
  .dark h1,.dark h2{color:var(--bg)}
  .dark .big .a{color:var(--accent)}
  .foot{position:absolute;left:64px;bottom:30px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .foot .b{color:var(--accent)}
  .disclaimer{font-size:13px;line-height:1.5;color:var(--muted);margin-top:30px;max-width:60ch}
  .cta-row{margin-top:30px;display:flex;flex-direction:column;gap:14px;max-width:46ch}
  .cta-row .step{font-size:clamp(19px,2.2vw,25px);font-weight:600}
  .cta-row .step span{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title'},
  {t:'who'},
  {t:'hook'},
  {t:'pointc'},
  {t:'partintro', n:'01', part:'Part One', title:'Ruthlessly prioritize'},
  {t:'content', kicker:'Part One', h:'Pick the one driver for THIS stage',
   lede:'Most independents try to do everything at once and run out of road. The first move is subtraction.',
   items:[
     ['Name the single metric your current stage lives or dies on','Subscribers, paid conversions, or one anchor sponsor. Not all three.'],
     ['Cut the work that does not move it','The podcast, the merch, the second platform can wait for the next stage.'],
     ['Protect a weekly maker block','The business dies when the reporting stops. Priority one is staying a journalist.']
   ]},
  {t:'partintro', n:'02', part:'Part Two', title:'Grow audience AND revenue'},
  {t:'content', kicker:'Part Two', h:'Audience without revenue is a hobby',
   lede:'Project C research on independent journalists shows the ones who last stack a few models, not one.',
   items:[
     ['Reader revenue','Free list first, then a paid tier for the people who cannot not pay.'],
     ['Sponsorship and underwriting','One aligned partner can underwrite a beat, the way grants underwrite ours.'],
     ['Products and services','A workshop, a database, a cohort. Your expertise, packaged.']
   ]},
  {t:'contentcards', kicker:'Part Two', h:'The overlooked openings',
   cards:[
     ['Niche authority','A small, specific audience pays more than a large, general one.'],
     ['Owned list','Rented reach on a platform is borrowed. An email list is yours.'],
     ['Repeatable format','A format readers expect is easier to sell than a one-off.']
   ]},
  {t:'partintro', n:'03', part:'Part Three', title:'Build systems that last'},
  {t:'content', kicker:'Part Three', h:'A one-person newsroom needs operations',
   lede:'The difference between a burst and a business is boring: systems you can run on a bad week.',
   items:[
     ['A publishing cadence you can keep','Sustainable beats ambitious. Readers reward showing up.'],
     ['A simple money system','Know your runway, your rates, and when a no is the right answer.'],
     ['A network for the work you do not do','You do not have to hire. You do have to know who to call.']
   ]},
  {t:'content', kicker:'Part Three', h:'Beat the burnout before it beats you',
   lede:'Ambition is not the enemy. An unsustainable pace is. The goal is a career, not a sprint.',
   items:[
     ['Design the week around energy, not guilt',''],
     ['Build in the recovery, on purpose',''],
     ['Measure the life, not just the launch','']
   ]},
  {t:'framework'},
  {t:'whyme'},
  {t:'recap'},
  {t:'cta', disc:'This masterclass is educational. No result is guaranteed. Results vary and depend on your own work, market, and circumstances, and no specific income is promised. Project C teaches methods and shares what its research and community have learned.'}
];

const MC = "A live masterclass with Project C";

function foot(){ return '<div class="foot"><span class="b">Project C</span> &middot; Going Solo</div>'; }

function render(s){
  if(s.t==='title') return `<section class="slide">
    <div class="dateline">${MC}</div>
    <h1>Going Solo<br>Without<br>Going <span style="color:var(--accent)">Broke</span></h1>
    <p class="lede">The business of independent journalism, and the part no newsroom and no J-school ever taught you.</p>
    ${foot()}</section>`;
  if(s.t==='who') return `<section class="slide">
    <div class="kicker">Who this is for</div>
    <h2>If you are eyeing the door</h2>
    <ul>
      <li><b>Staff reporters weighing the jump</b><span>You can see the newsroom shrinking. You are not sure the solo math works.</span></li>
      <li><b>New independents stuck at passion-project income</b><span>The work is good. The money has stalled. You are doing everything yourself.</span></li>
      <li><b>Laid-off journalists who refuse to leave the craft</b><span>You want to keep reporting. You need it to pay the rent.</span></li>
    </ul>
    ${foot()}</section>`;
  if(s.t==='hook') return `<section class="slide dark">
    <div class="kicker">The hard part</div>
    <p class="big">You do not have a talent problem.<br>You have a <span class="a">business-model</span> problem.</p>
    <p class="lede">Going independent on instinct is how brilliant reporters end up with a big audience and an empty bank account. The craft was never the gap.</p>
    ${foot()}</section>`;
  if(s.t==='pointc') return `<section class="slide">
    <div class="kicker">The method</div>
    <h2>Aim for Point C</h2>
    <p class="lede">Do not try to leap straight to the finished media empire. Aim for the next stage you can actually reach, then the one after that. That staged build is the whole method behind Going Solo.</p>
    <div class="panel"><p class="big" style="font-size:clamp(22px,2.6vw,30px)">Point A is the newsroom. Point Z is the dream. <span class="a">Point C is where you go next.</span></p></div>
    ${foot()}</section>`;
  if(s.t==='partintro') return `<section class="slide">
    <div class="num">${s.n}</div>
    <div class="kicker part">${s.part}</div>
    <h2>${s.title}</h2>
    ${foot()}</section>`;
  if(s.t==='content'){
    const items = s.items.map(([a,b])=>`<li><b>${a}</b>${b?`<span>${b}</span>`:''}</li>`).join('');
    return `<section class="slide">
      <div class="kicker">${s.kicker}</div>
      <h2>${s.h}</h2>
      <p class="lede">${s.lede}</p>
      <ul>${items}</ul>
      ${foot()}</section>`;
  }
  if(s.t==='contentcards'){
    const cards = s.cards.map(([h,p],i)=>`<div class="cardx"><div class="n">0${i+1}</div><h3>${h}</h3><p>${p}</p></div>`).join('');
    return `<section class="slide">
      <div class="kicker">${s.kicker}</div>
      <h2>${s.h}</h2>
      <div class="grid">${cards}</div>
      ${foot()}</section>`;
  }
  if(s.t==='framework') return `<section class="slide">
    <div class="kicker">The operating model</div>
    <h2>Five jobs of an independent</h2>
    <div class="grid">
      <div class="cardx"><div class="n">01</div><h3>Prioritize</h3><p>One driver per stage.</p></div>
      <div class="cardx"><div class="n">02</div><h3>Grow audience &amp; revenue</h3><p>Stack a few models, not one.</p></div>
      <div class="cardx"><div class="n">03</div><h3>Build systems</h3><p>Operations you can run on a bad week.</p></div>
      <div class="cardx"><div class="n">04</div><h3>Lead</h3><p>You are the editor and the publisher now.</p></div>
      <div class="cardx"><div class="n">05</div><h3>Beat the burnout</h3><p>Pace it for a career.</p></div>
    </div>
    ${foot()}</section>`;
  if(s.t==='whyme') return `<section class="slide">
    <div class="kicker">Why Project C</div>
    <h2>The home for creator journalists</h2>
    <ul>
      <li><b>250+ independent journalists in the community</b><span>Legal office hours, a workshop library, and people building right alongside you.</span></li>
      <li><b>200+ reporters through Going Solo</b><span>The eight-week workshop this masterclass is drawn from.</span></li>
      <li><b>Original field research</b><span>The Top 50 Creator Journalists list and the News Ecosystem Map.</span></li>
      <li><b>Backed by the people funding the future of news</b><span>Programs built with Google News Initiative, Microsoft, CUNY, and the Knight Center.</span></li>
    </ul>
    ${foot()}</section>`;
  if(s.t==='recap') return `<section class="slide dark">
    <div class="kicker">The whole thing in one line</div>
    <p class="big">Treat going independent like a <span class="a">staged business build</span>, not a leap, and it can actually pay.</p>
    ${foot()}</section>`;
  if(s.t==='cta') return `<section class="slide">
    <div class="kicker">Your next stage</div>
    <h2>Keep going</h2>
    <div class="cta-row">
      <div class="step"><span>1.</span> Start with the weekly dispatch at projectc.com</div>
      <div class="step"><span>2.</span> Join the next Going Solo cohort</div>
      <div class="step"><span>3.</span> Or book a discovery call about 1:1 coaching</div>
    </div>
    <p class="disclaimer">${s.disc}</p>
    ${foot()}</section>`;
  return '';
}
document.getElementById('deck').innerHTML = S.map(render).join('');
</script>
</body>
</html>
