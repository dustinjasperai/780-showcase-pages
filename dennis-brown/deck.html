<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The No Cold Calling Freight Broker · Dennis Brown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fcfcfc; --panel:#212c3f; --rule:#dedfe1;
    --ink:#212529; --oxblood:#5b0101; --harbor:#0a4254; --dim:#6f7681;
  }
  html,body{height:100%}
  body{background:#0d0f12;font-family:'IBM Plex Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0f12}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
    display:flex;flex-direction:column;justify-content:center;padding:9.5% 12% 8% 12%}
  .slide.active{opacity:1;visibility:visible}
  .hairline{position:absolute;left:12%;right:12%;top:7.2%;height:1px;background:var(--rule)}
  .runhead{position:absolute;left:12%;top:4.4%;font-size:.86vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .runfoot{position:absolute;right:12%;top:4.4%;font-size:.86vw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--oxblood)}
  .kicker{font-size:.98vw;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--harbor);margin-bottom:2.4vh}
  h1{font-family:'Libre Baskerville',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.22;letter-spacing:-.004em}
  .t-title h1{font-size:4.3vw;max-width:92%}
  .t-normal h1{font-size:2.7vw;max-width:86%}
  .t-normal .body{font-size:1.36vw;color:#43484f;margin-top:2.8vh;max-width:80%;line-height:1.68;font-weight:300}
  .sub{font-size:1.6vw;color:#43484f;margin-top:3.2vh;max-width:78%;line-height:1.56;font-weight:300}
  .t-section{background:var(--bg);justify-content:center}
  .t-section .idx{font-family:'IBM Plex Sans',sans-serif;font-size:1.02vw;font-weight:600;color:var(--oxblood);margin-bottom:2.2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:3.8vw;max-width:88%;font-style:italic}
  .t-section .bar{width:9vw;height:3px;background:var(--oxblood);margin-top:3.6vh}
  .t-dark{background:var(--panel);align-items:flex-start}
  .t-dark h1{font-size:3.1vw;max-width:86%;color:#f4f5f7}
  .t-dark .hairline{background:rgba(255,255,255,.16)}
  .t-dark .runhead{color:#8f9aad}.t-dark .runfoot{color:#c99}
  .t-cta{background:var(--panel)}
  .t-cta h1{font-size:3.5vw;max-width:86%;color:#f4f5f7}
  .t-cta .hairline{background:rgba(255,255,255,.16)}
  .t-cta .runhead{color:#8f9aad}.t-cta .runfoot{color:#c99}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap}
  .chip{border:1px solid rgba(255,255,255,.4);color:#eef0f4;padding:1.2vh 1.5vw;font-size:1.12vw;font-weight:500}
  .disc{position:absolute;left:12%;right:12%;bottom:4vh;font-size:.82vw;color:#9aa4b4;line-height:1.5;max-width:76%}
  .t-normal .disc,.t-title .disc{color:var(--dim)}
  .brandline{font-size:1.16vw;color:#43484f;margin-top:3.6vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--oxblood);font-weight:600}
  .reply{position:absolute;pointer-events:none}
  .reply-title{right:9%;bottom:9%;width:20vw;opacity:.95}
  .reply-corner{right:9%;bottom:7%;width:9vw;opacity:.5}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--oxblood);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:13px;right:18px;font-size:12px;letter-spacing:.14em;color:#7c848f;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7c848f;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#7c848f;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .slide{padding:13% 8% 11% 8%}.hairline{left:8%;right:8%}.runhead{left:8%}.runfoot{right:8%}
    .kicker{font-size:2.4vw}.runhead,.runfoot{font-size:2vw}
    .t-title h1{font-size:7.4vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:2.9vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.4vw}.t-dark h1{font-size:5.4vw}
    .t-cta h1{font-size:6.2vw}.chip{font-size:2.5vw}.disc{left:8%;right:8%;font-size:1.9vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Freight Broker Boot Camp</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- the reply: an arrow that comes back to you -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="reply" viewBox="0 0 240 140">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 30 C120 6 214 40 206 82 C200 114 140 124 78 116" stroke="#5b0101" opacity="0.9"/>
    <path d="M96 100 L74 116 L94 132" stroke="#5b0101" opacity="0.9"/>
    <line x1="24" y1="30" x2="24" y2="120" stroke="#0a4254" opacity="0.32"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',rh:'Freight Broker Boot Camp',rf:'Masterclass',title:'The No Cold Calling Freight Broker',sub:'How to land shippers with research, follow up and referrals instead of two hundred dials a day.',brand:true,reply:'title'},
 {t:'normal',rh:'Start here',rf:'01',k:'Who this is for',title:'You have the authority. You do not have the shippers.',body:'Maybe you just got your MC number. Maybe you have been at this a year and covered a few loads. Either way the freight is not coming in on its own, and every piece of advice you have been given comes down to the same thing: get on the phone and call more people.'},
 {t:'dark',rh:'Reframe',rf:'02',title:'I have not made a cold call in over a decade. I still get shippers.'},

 {t:'section',rh:'Part one',rf:'03',idx:'Part one',title:'Why the Dial Grind Fails Most Brokers'},
 {t:'normal',rh:'Part one',rf:'04',k:'The math of the grind',title:'Two hundred dials to find one person willing to talk.',body:'It is not that cold calling never works. It is that it works at a rate that quits on you first. Most new brokers run out of nerve, or time, long before the numbers turn. The strategy assumes an endless supply of both.'},
 {t:'normal',rh:'Part one',rf:'05',k:'The other problem',title:'You are calling people you know nothing about.',body:'No idea what they ship, who moves it now, or whether they are unhappy about it. So the call has nowhere to go. A shipper does not owe you a conversation, and a stranger with no reason to be interesting will not get one.'},
 {t:'normal',rh:'Part one',rf:'06',k:'What actually opens doors',title:'Attention is earned before contact, not during it.',body:'Every shipper who ever became a real customer of mine came from the same place: I knew something specific about their business before I ever reached out, and I kept showing up after the first no. That is not a personality trait. It is a process.'},
 {t:'dark',rh:'Reframe',rf:'07',title:'Do the homework first and the call stops being cold.'},

 {t:'section',rh:'Part two',rf:'08',idx:'Part two',title:'The System That Replaced the Phone'},
 {t:'normal',rh:'Part two',rf:'09',k:'One, the winning sales mindset',title:'Decide you are not asking for a favour.',body:'Most brokers sound apologetic because they secretly believe they are interrupting. You are not. You are offering to solve a capacity problem that costs that company real money. Everything downstream, the tone, the follow up, the price conversation, changes once that is settled.'},
 {t:'normal',rh:'Part two',rf:'10',k:'Two, fill the funnel with research',title:'Know the company before you know the contact.',body:'Owler for company intelligence, Feedly for what is happening to them right now, LinkedIn for the people, Hunter and Lusha for reaching them. Ten minutes of this makes the difference between a stranger and someone who noticed. Leverage the modern sales technology. It is all sitting there.'},
 {t:'normal',rh:'Part two',rf:'11',k:'Three, the winning cold outreach formula',title:'One relevant sentence beats a whole pitch.',body:'Lead with something true about their freight, not about you. Say what you can specifically do for that lane. Ask for one small next step. The formula is short on purpose, because the goal of the first contact is a second contact, not a load.'},
 {t:'normal',rh:'Part two',rf:'12',k:'Four, social selling',title:'Be visible where they already are.',body:'Build a profile that says what you handle, grow the network deliberately, post enough that people know you exist, engage before you ask. Done properly, connections turn into conversations that never needed a cold call. I built twenty million a year in recurring revenue this way.'},
 {t:'normal',rh:'Part two',rf:'13',k:'Five, the fortune is in the follow up',title:'Almost nobody says yes on contact one.',body:'Most brokers stop at two touches. The business is in touches three through eight, spread over months, each one carrying something new. Handle the objection by listening properly, showing you understood, answering plainly, and confirming you both agree. Then follow up again.'},
 {t:'normal',rh:'Part two',rf:'14',k:'Six, referrals and retention',title:'The cheapest shipper you will ever get is the one you already serve.',body:'Serve the freight exceptionally, ask at the right moment, make it worth their while, use the network you have, and measure whether it is working. Retention and referral compound quietly while everyone else is still dialling.'},
 {t:'dark',rh:'Reframe',rf:'15',title:'Research. Reach out. Follow up. Serve. Ask. That is the whole system.'},

 {t:'section',rh:'Part three',rf:'16',idx:'Part three',title:'The Day the Freight Starts Coming to You'},
 {t:'normal',rh:'Part three',rf:'17',k:'The change',title:'Fewer conversations, and the ones you have are with the right people.',body:'You stop measuring your day in dials and start measuring it in real conversations. The pace feels slower. The results are not. And it is sustainable, which matters more than anything else in a business most people quit inside two years.'},
 {t:'normal',rh:'Part three',rf:'18',k:'Why listen to me',title:'I did this from zero, and then I sold the company.',body:'I became a freight broker in 2003 without knowing what one was. I built Logistic Dynamics to over two hundred million dollars in sales and sold it in 2016. I have taught more than ten thousand students in sixteen countries since. I am telling you what I actually did, including the part where I stopped picking up the phone first.'},
 {t:'dark',rh:'Reframe',rf:'19',title:'The brokers who last are the ones who built a process instead of a habit.'},

 {t:'section',rh:'Next',rf:'20',idx:'Your next step',title:'Learn the Whole System'},
 {t:'cta',rh:'Next',rf:'21',title:'Ready to stop cold calling?',chips:['Freight Broker Boot Camp','Sales Accelerator','Listen to the podcast'],disc:'Educational content for freight brokers and freight agents. Nothing here is a guarantee of income, revenue, shipper counts or business results. Results vary by person, market and effort.'},
];

const deck=document.getElementById('deck');
function reply(kind){return `<svg class="reply ${kind==='title'?'reply-title':'reply-corner'}" viewBox="0 0 240 140"><use href="#reply"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h=`<div class="runhead">${s.rh||''}</div><div class="runfoot">${s.rf||''}</div><div class="hairline"></div>`;
  if(s.t==='section'){ h+=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="bar"></div>`; }
  else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Freight Broker <b>Boot Camp</b> · Dennis Brown</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.reply) h+=reply(s.reply);
  else if(s.t==='section') h+=reply('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
