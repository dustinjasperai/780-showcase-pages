<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Your Baby Really Wakes Up — A Masterclass with Alexis Dubief</title>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1437;
  --panel:#141f4d;
  --rule:#2a3568;
  --accent:#f08432;
  --chalk:#f4efe6;
  --dim:#a7b0cf;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--chalk);font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:7vh 9vw;max-width:1100px;margin:0 auto}
.slide.on{display:flex;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kick{font-size:14px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:26px}
h1{font-family:'Yeseva One',Georgia,serif;font-weight:400;line-height:1.07;letter-spacing:-.01em;color:var(--chalk)}
.slide h1{font-size:clamp(34px,6vw,70px)}
.sub{font-size:clamp(18px,2.4vw,27px);color:var(--dim);margin-top:26px;max-width:30ch;line-height:1.4}
.body{font-size:clamp(17px,2.1vw,24px);line-height:1.56;color:var(--chalk);margin-top:28px;max-width:40ch}
ul{list-style:none;margin-top:30px;max-width:46ch}
li{font-size:clamp(16px,2vw,22px);line-height:1.4;color:var(--chalk);padding-left:34px;position:relative;margin-bottom:18px}
li::before{content:'';position:absolute;left:0;top:.55em;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(240,132,50,.18)}
.note{margin-top:30px;font-size:clamp(14px,1.7vw,18px);color:var(--dim);font-style:italic;max-width:44ch;line-height:1.5}
/* part divider */
.slide.part{align-items:flex-start}
.slide.part h1{font-size:clamp(40px,8vw,96px)}
.slide.part .kick{font-size:17px}
/* title */
.slide.title h1{font-size:clamp(40px,8.2vw,92px);max-width:16ch}
.slide.title::after{content:'';position:absolute;left:9vw;bottom:14vh;width:120px;height:5px;background:var(--accent);border-radius:3px}
/* credibility + cta panel */
.slide.cta,.slide.credibility{background:
  radial-gradient(1200px 500px at 85% 0%, rgba(240,132,50,.10), transparent 60%),var(--bg)}
.ctabtns{margin-top:30px}
.lamp{position:absolute;right:7vw;top:8vh;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(240,132,50,.55), rgba(240,132,50,0) 68%);filter:blur(2px)}
/* nav */
#nav{position:fixed;bottom:22px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px;z-index:10}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.dot.on{background:var(--accent);transform:scale(1.35)}
button.arrow{background:var(--panel);color:var(--chalk);border:1px solid var(--rule);border-radius:100px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
button.arrow:hover{border-color:var(--accent)}
.count{position:fixed;top:20px;right:26px;font-size:13px;letter-spacing:.14em;color:var(--dim);z-index:10}
</style>
</head>
<body>
<div id="stage"></div>
<div class="count" id="count"></div>
<div id="nav">
  <button class="arrow" id="prev">Prev</button>
  <div class="dots" id="dots"></div>
  <button class="arrow" id="next">Next</button>
</div>
<script>
const S = [
  {t:'title', kick:"A LIVE MASTERCLASS WITH ALEXIS DUBIEF", h:"Why Your Baby Really Wakes Up", sub:"And how to pick the sleep method that actually fits your child"},
  {t:'who', kick:"WHO THIS IS FOR", h:"If you are up multiple times a night", bul:["Parents of babies, toddlers, and preschoolers, roughly 3 months to 5 years","You have tried bits of everything and nothing has stuck","You do not want to be handed one rigid method and told to push through"]},
  {t:'trap', kick:"THE TRAP", h:"The internet turned baby sleep into a war", body:"One camp says never let them cry. The other says cry it out or nothing works. So you are stuck, exhausted, and quietly sure you are doing it wrong. You are not. Almost nobody explains why your baby is waking in the first place."},
  {t:'reframe', kick:"THE REFRAME", h:"It is not a bad baby. It is a sleep prop.", body:"Your baby is not broken and you are not failing. Night waking is almost always a learned association, something your baby needs from you to fall asleep and cannot recreate alone at 3am. Once you see that, the whole thing becomes fixable."},
  {t:'part', kick:"PART ONE", h:"The real reason babies wake"},
  {t:'content', h:"Every baby falls asleep with associations", body:"A sleep association is whatever your baby connects with falling asleep: a person, a motion, a sound, a feed. Some of these help. Some of these are the reason you are awake at 3am."},
  {t:'content', h:"Sustainable vs unsustainable props", bul:["Sustainable: things that stay all night on their own, like white noise or a dark room","Unsustainable: things your baby cannot redo alone, like rocking, feeding to sleep, or being held","Babies wake between sleep cycles all night long. That part is completely normal.","The trouble starts only when they need an unsustainable prop to get back down"]},
  {t:'content', h:"This is why the 3am wakeups happen", body:"Your baby drifts up between cycles, reaches for the prop that put them down, cannot recreate it alone, and calls for you. Fix the association and most of the wakeups solve themselves. This is the lever the whole method pulls."},
  {t:'part', kick:"PART TWO", h:"The method, matched to your baby"},
  {t:'content', h:"There is no single right method", body:"Anyone selling you one method for every baby is selling you their method, not your baby. What works is matching the approach to your child's age and temperament, and to how much crying your family can tolerate. There are about seven real options."},
  {t:'content', kick:"FREE WINS FIRST", h:"Start with the Sleep Power Tools", bul:["White noise that runs all night","A short, consistent wind-down","An age-appropriate nap and bedtime schedule","A dark, boring sleep space","Dropping the one prop that cannot travel through the night"], note:"Many families get most of the way there on these alone, before any training begins."},
  {t:'content', h:"The gentle path: SWAP", body:"A Sleep With Assistance Plan. You stay involved and slowly reduce the help your baby needs, over days to weeks. More patience, less crying. Best when you want a gradual transition and have the runway for it."},
  {t:'content', h:"The direct path: SLIP", body:"A Sleep Learning Independence Plan. You give your baby room to learn to settle, with timed check-ins or without, over a short and bounded stretch. Faster results, a harder few nights. Best when you need change soon and your baby is ready."},
  {t:'content', h:"How to choose your path", bul:["Your baby's age and temperament","How much crying your family can genuinely tolerate","How quickly you need things to change","Whether you can hold a gentle plan steady for weeks"], note:"The right method is the one you will actually follow through on."},
  {t:'part', kick:"PART THREE", h:"Putting the plan into practice"},
  {t:'content', h:"The first few nights", body:"You set up the power tools, pick your path, and keep every step the same each night. Consistency is the active ingredient. Some nights are easier than others, and that is expected, not a sign it is failing."},
  {t:'content', h:"When it wobbles", bul:["Teething, travel, and illness will interrupt. That is normal.","Go back to the same plan once the disruption passes.","Resist adding a new prop to get through a hard night.","Small, boring consistency beats a dramatic new fix."]},
  {t:'credibility', kick:"WHY LISTEN TO ME", h:"I have spent years on exactly this", body:"I am Alexis Dubief. I wrote Precious Little Sleep, I host the Precious Little Sleep podcast, and I have worked with thousands of families. Everything here is built on research, hundreds of studies, paired with what actually holds up in real homes."},
  {t:'recap', kick:"THE WHOLE THING IN THREE STEPS", h:"Diagnose, choose, hold", bul:["Diagnose the unsustainable sleep prop that is causing the wakeups","Choose the gentle (SWAP) or direct (SLIP) path that fits your baby and your family","Hold the same steps every night while the new habit forms"]},
  {t:'cta', kick:"YOUR NEXT STEP", h:"Let us build your baby's plan together", body:"If you want this mapped to your exact situation, the next step is a 1:1 sleep consultation. Or join the Community for ongoing support and live help.", bul:["Book a sleep consultation for a custom plan","Join the Community for live help and resources","Read the book if you want to start on your own"], note:"This masterclass is educational. No specific result or timeline is guaranteed. Every baby and family is different and results vary."}
];

const stage=document.getElementById('stage');
const dotsEl=document.getElementById('dots');
const countEl=document.getElementById('count');
let i=0;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  stage.innerHTML='';
  const s=S[i];
  const el=document.createElement('section');
  el.className='slide on '+s.t;
  let html='';
  if(s.t==='title'||s.t==='cta'||s.t==='credibility') html+='<div class="lamp"></div>';
  if(s.kick) html+='<div class="kick">'+esc(s.kick)+'</div>';
  if(s.h) html+='<h1>'+esc(s.h)+'</h1>';
  if(s.sub) html+='<div class="sub">'+esc(s.sub)+'</div>';
  if(s.body) html+='<div class="body">'+esc(s.body)+'</div>';
  if(s.bul){html+='<ul>';s.bul.forEach(b=>html+='<li>'+esc(b)+'</li>');html+='</ul>';}
  if(s.note) html+='<div class="note">'+esc(s.note)+'</div>';
  el.innerHTML=html;
  stage.appendChild(el);
  dotsEl.innerHTML=S.map((_,k)=>'<span class="dot'+(k===i?' on':'')+'"></span>').join('');
  countEl.textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
render();
</script>
</body>
</html>
