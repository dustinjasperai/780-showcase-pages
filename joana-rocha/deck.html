<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Chosen, a masterclass with Joana Rocha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16141b;
    --panel:#211d29;
    --rule:#35303f;
    --ink:#f6f4ee;
    --muted:#a59fb3;
    --accent:#caa4fe;
    --accent2:#d5f95f;
    --head:'Poppins',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(0,0,0,.45);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* progress motif: a lavender rule filling in from the left, and one lit mark at the head */
  .slide::before{content:'';position:absolute;top:54px;left:-6%;right:30%;height:2px;
    background:linear-gradient(90deg,rgba(202,164,254,0),var(--accent) 80%,var(--accent));pointer-events:none}
  .slide::after{content:'';position:absolute;top:47px;right:28%;width:14px;height:14px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 6px rgba(202,164,254,.16)}
  .kick{font-family:var(--head);font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:800;font-size:60px;line-height:1.05;margin:0 0 18px;letter-spacing:-.015em;color:var(--ink)}
  h2{font-family:var(--head);font-weight:700;font-size:43px;line-height:1.10;margin:0 0 20px;letter-spacing:-.01em;color:var(--ink)}
  h3{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:47ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  .em2{color:var(--accent2)}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 42px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:4px;top:23px;width:13px;height:13px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(202,164,254,.16)}
  li b{font-weight:700}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:92px;line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .strike{color:transparent;-webkit-text-stroke:2px #f6f4ee66;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:6px;background:var(--accent);transform:rotate(-2deg);border-radius:3px}
  .row{display:flex;gap:18px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:170px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:20px 22px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:21px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:16px;margin:0}
  .who{font-size:19px;color:var(--muted);margin-top:auto;padding-top:22px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:66ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:38px}h2{font-size:29px}.big{font-size:52px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">TechTalk · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'Get Chosen',p:'How to land a tech role when you are not the obvious pick, by positioning yourself to employers instead of just applying harder.',pres:'With <b>Joana Rocha</b>, co-founder of TechTalk'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why more applications will not fix it','The real reason capable people get overlooked, and it is not your skills.'],['How hiring managers actually decide','What a recruiter looks for in the first few seconds, from someone who did the hiring.'],['A way to position on purpose','How to make yourself the obvious choice across the whole path from CV to offer.']]},
 {t:'audience',kick:'Who this is for',h:'You are qualified. You are still invisible.',p:'Career switchers, immigrants, and people from non-traditional backgrounds who can do the job but keep getting passed over, and are tired of advice that assumes you already fit the typical profile.',who:'<b>The trap:</b> you treat it as a skills problem, so you take another course and send more applications, and the silence stays exactly the same.'},
 {t:'reframe',kick:'The reframe',big1:'Apply to more jobs.',big2:'Position yourself to get <span class="em">chosen</span>.',p:'Getting hired is not a qualification problem, it is a positioning problem. The people who break through are not always the most skilled, they are the ones an employer can instantly understand and say yes to.'},
 {t:'stakes',kick:'The stakes',h:'Being overlooked is expensive.',p:'Every month of silence costs confidence, money, and momentum, and it tempts you to shrink your goals to whatever will just say yes. Positioning is what turns a capable-but-invisible candidate into an obvious one, and it can be learned.'},
 {t:'part',kick:'Part one',h:'Why applying more only stalls you.'},
 {t:'point',kick:'The core problem',h:'You are competing on the wrong axis.',p:'When you lead with duties and qualifications, you look like everyone else in the pile. Employers do not hire the longest list of skills, they hire the person whose story most clearly fits the problem they are trying to solve.'},
 {t:'point',kick:'The core problem',h:'The decision happens in seconds.',p:'A recruiter skims a CV in a handful of seconds and a LinkedIn profile in fewer. If your positioning is not obvious in that glance, you are filtered out before anyone reads the detail you were counting on.'},
 {t:'signs',kick:'The core problem',h:'The signs you are under-positioned.',li:[['You apply and hear nothing','Strong background, no replies. The filter is happening before a human reads it.'],['You get interviews but not offers','You can do the work, but the story never quite lands in the room.'],['You blend into the pile','Nothing on the page tells them in one line why you, specifically.']]},
 {t:'part',kick:'Part two',h:'The Five Pillars, through the recruiter\'s eyes.'},
 {t:'framework',kick:'The method',h:'One path from overlooked to offer.',row:[['CV','Written for the recruiter, not the archive.'],['LinkedIn','The profile that surfaces you.'],['Networking','The door most people skip.'],['Applications','Target, do not spray.'],['Interviews','Tell the story that lands.']],p:'Five pillars, one thread: at every step you are positioning to how hiring managers actually decide, not guessing at it.'},
 {t:'point',kick:'Pillar one: CV',h:'A CV written for the person skimming it.',p:'An ATS-proof CV built around what a recruiter scans for first, that positions you against the role instead of listing everything you have ever done. The goal is one clear reason to keep reading, not a complete archive.'},
 {t:'point',kick:'Pillar two: LinkedIn',h:'A profile that surfaces and sells.',p:'Recruiters search and skim LinkedIn before they ever reply. A profile that shows up for the right roles and tells a coherent story in the first glance does more for you than another certificate does.'},
 {t:'point',kick:'Pillar three: networking',h:'The door most applicants never open.',p:'Most tech roles are filled through relationships, not the apply button. You will see how to open real doors from a cold start, which is exactly the route that works when you do not already fit the network.'},
 {t:'point',kick:'Pillar four: applications',h:'Target ten, not two hundred.',p:'Spraying the same CV at every opening trains you to be ignored. A focused application strategy, tailored to a shortlist of roles you actually fit, beats volume every time and costs you far less energy.'},
 {t:'point',kick:'Pillar five: interviews',h:'Tell the story that gets a yes.',p:'The interview is not a quiz, it is where you make it easy to picture you in the role. Strategic storytelling and a little structure turn a nervous answer into a clear reason to choose you.'},
 {t:'point',kick:'The thread',h:'Position on purpose, at every step.',p:'The candidates who get chosen are not gaming the system, they are making the employer\'s decision obvious. When every pillar points at the same clear story, a hiring manager can say yes without having to work for it.'},
 {t:'part',kick:'Part three',h:'What changes when you position on purpose.'},
 {t:'looks',kick:'The outcome',h:'From overlooked to obvious.',li:[['The replies start','A CV and profile built to be seen get past the first filter instead of dying in it.'],['The story lands','You walk into interviews with one clear reason to choose you, and it holds.'],['You stop shrinking your goal','You go after the role you actually want, positioned to get it, not the one that will just take you.']]},
 {t:'whyme',kick:'Why Joana',h:'Coached from the hiring side, not the sidelines.',li:[['I have done the hiring','Around four years as a hiring manager, so this is what actually moves a decision, not guesswork.'],['I built the whole path','I grew TechTalk and teach the Five Pillars from CV to offer, the same path that has placed people at companies like Google, Salesforce and HubSpot.'],['I was the non-obvious candidate','I came to the UK on a work visa and went from intern to director in four years by positioning, not by fitting the mold.']]},
 {t:'cta',kick:'Your next step',h:'Ready to become the obvious choice?',ctas:['<b>Book a free strategy call</b> and we will map where your positioning is leaking offers.','<b>Join TechTalk</b>, the community and coaching that walks you through all five pillars.'],disc:'This masterclass is educational. It shares job-search principles and frameworks; it is not a guarantee of any job, offer, salary or outcome, and results vary from person to person. Your results depend on your own effort, background and the market.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
