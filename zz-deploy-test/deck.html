<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>How to Value and Successfully Sell Businesses · Joe Caffrey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#111731; --panel:#1A2142; --rule:#262F58;
    --acc:#7FA6F0; --idx:#9BB0D6; --chalk:#F5F6FA; --grey:#C6CDE0; --dim:#6C7BA3;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Montserrat',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Spectral',Georgia,serif;font-weight:400;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.3vw;max-width:88%}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#232C5A 0%,#0B0F22 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:86%;font-style:italic;color:#F0F2F9}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#232C5A 0%,#0B0F22 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#C9DBF9;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .arc-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-arc{right:7.5%;bottom:8%;width:22vw}
  .corner-arc{right:6%;bottom:7.5%;width:10vw;opacity:.4}
  .brandline{font-size:1.32vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Worldwide Business Brokers</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- deal arc motif: two baseline nodes joined by a rising arc, diamond at the apex -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arc" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="128" x2="246" y2="128" stroke="#9BB0D6" opacity="0.35"/>
    <path d="M46 122 Q130 34 214 122" stroke="#7FA6F0" opacity="0.9"/>
    <path d="M56 122 Q130 48 204 122" stroke="#F5F6FA" opacity="0.12"/>
    <circle cx="46" cy="122" r="5" fill="none" stroke="#7FA6F0" stroke-width="2.6"/>
    <circle cx="214" cy="122" r="5" fill="none" stroke="#7FA6F0" stroke-width="2.6"/>
    <rect x="123" y="46" width="14" height="14" transform="rotate(45 130 53)" fill="none" stroke="#7FA6F0" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'How to Value and Successfully Sell Businesses',sub:'A masterclass for business brokers and intermediaries working the $250K to $25M market.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You carry the listing. You carry the risk.',body:'You broker Main Street and lower middle market businesses. Every listing costs you months of work before a dollar of commission arrives, and the listings that never close cost the most.'},
 {t:'dark',title:'Most listings do not die at the closing table. They die on the day they are priced.'},

 {t:'section',idx:'Part One',title:'Why Listings Die'},
 {t:'normal',k:'The overpriced listing',title:'An overpriced business does not sell slowly. It does not sell at all.',body:'Buyers in this market are careful and lenders are strict. A price the numbers cannot support stops both cold. The listing sits, the seller loses faith, and the broker does the waiting.'},
 {t:'normal',k:'The cost of guesswork',title:'Every dead listing spends your two scarcest assets.',body:'Time and credibility. A year on a listing that never closes pays nothing, and a seller who watched it sit tells other owners exactly how it went.'},
 {t:'dark',title:'A listing priced on hope is a year of unpaid work.'},

 {t:'section',idx:'Part Two',title:'The Valuation-First Method'},
 {t:'normal',k:'Value it right',title:'A defendable valuation is the foundation of the whole deal.',body:'Not a number that flatters the seller into signing, a number you can walk a buyer, a lender, and a skeptical seller through line by line. When the price holds up, the deal keeps moving.'},
 {t:'normal',k:'Price this market',title:'Businesses from $250K to $25M trade by their own rules.',body:'Main Street and lower middle market companies do not price like real estate and do not price like public companies. Valuing them well takes a method built for exactly this market.'},
 {t:'normal',k:'Run a process',title:'Successful sales follow a process, not a personality.',body:'From engagement to marketing to buyer qualification to due diligence to close, every stage has work that must happen in order and happen right. A process the broker controls is what carries a deal through.'},
 {t:'normal',k:'Paper the deal',title:'The right documents, ready before you need them.',body:'Engagement letters, confidentiality agreements, offer frameworks, closing checklists. Brokers who work from a complete set of forms spend their energy on the deal instead of reinventing paperwork.'},
 {t:'dark',title:'Value it right and run the process, and closings stop depending on luck.'},

 {t:'section',idx:'Part Three',title:'What It Looks Like'},
 {t:'normal',k:'The broker this builds',title:'Fewer dead listings, stronger conversations, deals that close.',body:'A broker who can defend a valuation takes better listings, walks away from the wrong ones, and earns the kind of seller trust that brings the next deal in the door.'},
 {t:'dark',title:'The market does not pay brokers for listings. It pays for closings.'},
 {t:'normal',k:'Why Joe Caffrey',title:'Two decades of deals, taught in the open.',body:'Joe Caffrey, CBI, has brokered businesses for more than 20 years and founded Worldwide Business Brokers in 2001. He teaches the full method, backs it with a library of about three dozen brokerage forms, and leads The Brokers Roundtable, the broker community Circle.so profiled as a community spotlight.'},

 {t:'section',idx:'Your Next Step',title:'Learn the Whole Method'},
 {t:'normal',k:'The flagship course',title:'Learn How to Value and Successfully Sell Businesses.',body:'Five modules and roughly 50 hours covering the full arc of valuing and selling businesses in the $250K to $25M market, with the WBBCC credential path, the brokerage forms library, a full year inside The Brokers Roundtable, and a money back guarantee.'},
 {t:'normal',k:'The Brokers Roundtable',title:'A working room for working brokers.',body:'Group coaching, weekly office hours, monthly live interviews with industry pros, and The Thursday Special, a small group session with Joe. Membership is $175 a quarter.'},
 {t:'cta',title:'Ready to price and sell with a method behind you?',chips:['Explore the flagship course','Join The Brokers Roundtable'],disc:'Educational content for business brokers and intermediaries. No income, commission, or deal result is guaranteed. Results vary by broker, market, and deal flow.'},
];

const deck=document.getElementById('deck');
function arc(kind){return `<svg class="arc-motif ${kind==='title'?'title-arc':'corner-arc'}"><use href="#arc"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Worldwide <b>Business Brokers</b> · Joe Caffrey, CBI</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=arc(s.arc);
  else if(s.t==='title') h+=arc('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
