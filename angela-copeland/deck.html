<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breaking The Rules: The Job Search That Actually Works — Copeland Coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf4f0; --panel:#fffcfa; --ink:#17120e; --muted:#5a5248;
    --accent:#ff3300; --rule:rgba(23,18,14,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;box-shadow:0 10px 34px rgba(23,18,14,.05)}
  .kick{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    font-size:15px;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:40px;line-height:1.08;margin-bottom:18px}
  .accent{color:var(--accent)}
  p{font-size:22px;line-height:1.5;color:var(--muted);margin-top:16px;max-width:92%}
  .lead{font-size:26px;color:var(--ink);font-weight:500}
  ul{margin:20px 0 0 0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:14px 0 14px 40px;position:relative;border-top:1px solid var(--rule)}
  li:before{content:'';position:absolute;left:0;top:22px;width:18px;height:18px;border-radius:5px;
    border:2.5px solid var(--accent)}
  li b{font-weight:600}
  .big{font-family:'Oswald',sans-serif;font-weight:700;font-size:88px;line-height:1;color:var(--accent)}
  .foot{position:absolute;bottom:22px;left:60px;right:60px;display:flex;justify-content:space-between;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    border-top:1px solid var(--rule);padding-top:14px}
  .disc{font-size:15px;color:var(--muted);margin-top:22px;line-height:1.45;max-width:94%}
  .pill{display:inline-block;font-family:'Oswald',sans-serif;font-weight:600;background:var(--accent);
    color:#fff;border-radius:100px;padding:12px 26px;font-size:20px;margin-top:26px;letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A free masterclass with Angela Copeland', h:'Breaking The Rules:<br>The Job Search That <span class="accent">Actually Works</span>', p:'How to stop firing applications into the void and get in front of the people who actually do the hiring.'},
  {t:'who', kick:'Who this is for', h:'You have done everything right.', p:'You have a strong resume. You tailor every application. You hit submit, again and again. And you hear nothing back. This hour is for you.'},
  {t:'trap', kick:'The trap', h:'You were told to follow the rules.', p:'Build the perfect resume. Apply to everything online. Wait patiently. Those rules were written for a different job market. Today they lead straight into a black hole.'},
  {t:'hook', kick:'The hard truth', h:'Your resume did not get <span class="accent">rejected.</span>', p:'It got ignored. On a popular role, hundreds of applications land in a system a hiring manager may never open. Doing the same thing harder will not change the result.'},
  {t:'stat', kick:'The black hole', big:'0', p:'The number of replies most online applications ever receive. Not because you are not qualified. Because the front door is jammed, and almost nobody uses the side door.'},
  {t:'part', kick:'Part one', h:'Why applying online fails.', p:'The online portal is designed to screen people OUT at scale. It rewards keywords, not the right person. The more you lean on it, the more invisible you become.'},
  {t:'body', kick:'The real question', h:'So what works instead?', p:'The people who land the good roles are rarely the best at applying. They are the best at getting around the application entirely. That is a skill, and it can be taught.'},
  {t:'part', kick:'Part two', h:'The three moves that <span class="accent">break the rules.</span>', p:'This is the method I teach my clients. It is not luck and it is not who you already know. It is three deliberate moves, in order.'},
  {t:'pillar', kick:'Move one', h:'Build a brand they find first.', p:'Personal branding is not a buzzword. It is making sure that when someone searches your name or your field, they find a clear, credible story about the value you bring. You stop chasing attention and start attracting it.'},
  {t:'pillar', kick:'Move two', h:'Reach out before the job is posted.', p:'The best roles are filled through people, not portals. I show you how to find the actual decision maker and send the one message that starts a conversation, long before the listing goes live or the flood of applicants arrives.'},
  {t:'list', kick:'What that message is not', h:'It is not begging for a job.', items:['<b>Not</b> please consider my attached resume', '<b>Not</b> a cold pitch about what you need', '<b>Yes</b> a short, human note about the value you would bring', '<b>Yes</b> a question that is easy to say yes to']},
  {t:'pillar', kick:'Move three', h:'Turn the conversation into an offer.', p:'Once you are in the room, the rules change again. I walk you through interviewing like a peer, not a supplicant, and negotiating the offer so you leave with what the role is actually worth.'},
  {t:'list', kick:'The full arc', h:'From invisible to in demand.', items:['<b>Target</b> the role you actually want, not every role', '<b>Brand</b> yourself so the right people find you', '<b>Reach out</b> directly to the decision maker', '<b>Interview</b> as an equal and negotiate the offer']},
  {t:'part', kick:'Part three', h:'A real search, from stuck to hired.', p:'A client stops refreshing the inbox. They pick ten companies they truly want. They send ten thoughtful messages. Within weeks they are having conversations no job board would ever have handed them.'},
  {t:'why', kick:'Why listen to me', h:'I broke these rules myself.', p:'I once snuck onto a graduate campus I did not attend just to get an interview. I have coached job seekers for over ten years, written Breaking The Rules and Getting The Job, and shared this method on TEDx, in my Career Corner column, and on the Copeland Coaching Podcast.'},
  {t:'body', kick:'The shift', h:'Stop waiting. Start reaching.', p:'Applying online is waiting. Reaching out is working. Only one of them puts you in front of a human who can say yes. Everything I teach is built to get you there faster.'},
  {t:'recap', kick:'What you now know', h:'The rules, rewritten.', items:['The portal is a black hole, so stop living in it', 'Your brand is the side door people find first', 'A single direct message can outrun a hundred applications', 'The offer is won in the conversation, not the form']},
  {t:'invite', kick:'Work with us', h:'Let us do this together.', p:'If you want help applying this to your own search, the next step is a conversation with me and my team at Copeland Coaching. We will look at where you are stuck and map the moves that fit your field.'},
  {t:'cta', kick:'Your next step', h:'Break the rules. <span class="accent">Get the job.</span>', p:'Book a career coaching conversation with Copeland Coaching and bring the role you actually want. We will build your plan from there.', pill:'copelandcoaching.com', disc:'This masterclass is educational. No job offer, interview, or specific result is guaranteed. Results vary based on your field, effort, and circumstances. Nothing here is a promise of employment.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.kick) inner += '<div class="kick">' + s.kick + '</div>';
  if (s.big) inner += '<div class="big">' + s.big + '</div>';
  if (s.h) inner += (s.t === 'title' ? '<h1>' + s.h + '</h1>' : '<h2>' + s.h + '</h2>');
  if (s.p) inner += '<p' + (s.t === 'title' ? ' class="lead"' : '') + '>' + s.p + '</p>';
  if (s.items) { inner += '<ul>'; s.items.forEach(it => inner += '<li>' + it + '</li>'); inner += '</ul>'; }
  if (s.pill) inner += '<div><span class="pill">' + s.pill + '</span></div>';
  if (s.disc) inner += '<div class="disc">' + s.disc + '</div>';
  inner += '<div class="foot"><span>Copeland Coaching</span><span>' + (i + 1) + ' / ' + S.length + '</span></div>';
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
