<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 4 Business Strategies — Henriette Danel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F3EF;        /* warm off-white ground, from her light site */
    --panel:#FBF8F5;
    --ink:#3A2F38;       /* plum-leaning ink */
    --muted:#6B5F66;
    --accent:#6E4A6B;    /* plum, from her purple/lavender event brand */
    --soft:#D6BEB7;      /* measured dusty-rose secondary */
    --rule:#E6DCD6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Josefin Sans',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(58,47,56,.03)}
  .eyebrow{font-family:'Josefin Sans',sans-serif;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--accent);font-weight:600;margin:0 0 18px}
  h1{font-family:'Lora',serif;font-weight:600;font-size:46px;line-height:1.1;margin:0 0 18px}
  h2{font-family:'Lora',serif;font-weight:600;font-size:34px;line-height:1.15;margin:0 0 16px}
  p,li{font-size:20px;line-height:1.55;color:var(--ink);margin:0 0 14px}
  .muted{color:var(--muted)}
  .lede{font-size:24px}
  .big{font-family:'Lora',serif;font-style:italic;font-size:30px;line-height:1.3;color:var(--accent)}
  ul{margin:8px 0 0;padding-left:0;list-style:none}
  ul li{position:relative;padding-left:30px}
  ul li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;
    border-radius:3px;background:var(--accent)}
  .num{font-family:'Lora',serif;font-size:72px;color:var(--soft);line-height:1;margin:0 0 8px}
  .band{display:flex;gap:10px;margin:22px 0 0}
  .band span{flex:1;height:8px;border-radius:4px;background:var(--rule)}
  .band span.on{background:var(--accent)}
  .foot{margin-top:28px;font-size:14px;color:var(--muted);font-family:'Josefin Sans',sans-serif}
  .cta h1{color:var(--accent)}
  .disc{margin-top:22px;font-size:13px;color:var(--muted);line-height:1.5;max-width:640px}
  .byline{font-size:15px;color:var(--muted);margin-top:26px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass', h1:'The 4 Business Strategies',
   p:'How service-based women attract high-paying clients continuously, without marketing every single day.',
   byline:'with Henriette Danel · Business &amp; Client Attraction Coach'},

  {t:'who', eyebrow:'Who this is for', h2:'You are a service-based woman who sells her expertise',
   p:'Coaches, consultants, freelancers, designers, photographers, virtual assistants, therapists. You are good at the work. Getting a steady flow of the right clients is the part that keeps you up at night.'},

  {t:'trap', eyebrow:'Sound familiar', h2:'The feast-or-famine loop',
   list:['Some months you sign clients. Some months are dead quiet.',
         'You are out on social media and networking every day, and still hear crickets.',
         'You keep hunting for one more tool or tactic, and none of it quite sticks.',
         'Everyone is telling you what to do, and it is exhausting.']},

  {t:'reframe', eyebrow:'The real reason', big:'It is not that you are not working hard enough. It is that you are working on everything.',
   p:'Scattered effort feels productive and converts poorly. Attention spread across ten half-built tactics never compounds into a system that brings clients in on repeat.'},

  {t:'part', eyebrow:'Part one', h1:'Why more marketing is not the answer',
   p:'Doing more is the trap. The women who attract high-paying clients continuously are not doing more. They run a focused, repeatable system, and they run it on purpose.'},

  {t:'promise', eyebrow:'The shift', h2:'From doing everything to four strategies',
   p:'Everything I teach comes down to four business strategies. Each one has a job. Together they turn client attraction from a guessing game into something you can run again and again.',
   band:4, on:0},

  {t:'part', eyebrow:'Part two', h1:'The 4 Business Strategies', p:'The method, one strategy at a time.'},

  {t:'strat', num:'01', eyebrow:'Strategy one', h2:'Visibility',
   p:'Being seen by the right people, not all the people. Most women are visible to the wrong audience and invisible to their actual buyer. Visibility done well means the people who can pay you know you exist.', band:4, on:0},

  {t:'strat', num:'02', eyebrow:'Strategy two', h2:'Attraction',
   p:'Drawing in high-paying clients instead of chasing them. When your message speaks to what your buyer already feels, the right people lean in and the wrong-fit ones filter themselves out. You stop convincing and start attracting.', band:4, on:1},

  {t:'strat', num:'03', eyebrow:'Strategy three', h2:'Relationship',
   p:'Building the trust that makes people buy. People buy once they feel understood, not when you feel understood. Relationship is how a stranger becomes someone ready to say yes to a premium offer.', band:4, on:2},

  {t:'strat', num:'04', eyebrow:'Strategy four', h2:'Transformation',
   p:'Delivering the result that keeps them, and brings you the next client. Great delivery is a growth strategy: it creates the referrals, testimonials and repeat work that make the first three strategies easier every time.', band:4, on:3},

  {t:'thread', eyebrow:'How they connect', big:'One repeatable strategy you run three or four times a year.',
   p:'You do not need to market yourself daily. When the four strategies work together, you have a plug-and-play way to bring in clients whenever you want more, without burning out.'},

  {t:'part', eyebrow:'Part three', h1:'When attracting clients stops being a guessing game', p:'Simple, on purpose.'},

  {t:'before', eyebrow:'The change', h2:'Before and after',
   list:['Before: posting constantly, hoping something lands. After: a clear message the right buyer recognises.',
         'Before: feast-or-famine months. After: a system you can run on repeat.',
         'Before: competing on price. After: attracting clients who happily pay premium.']},

  {t:'whyme', eyebrow:'Why learn this from me', h2:'I take the complicated and make it simple',
   p:'My strength is taking anything complicated, pulling it apart, and putting it back together so it is easy to understand and actually do.',
   list:['TEDx and public speaker, and an author.',
         'Host of The Entrepreneurial Success Podcast, four years running.',
         'Eight years coaching service-based women across the UK, Europe, USA, Canada, South Africa and Dubai.']},

  {t:'principle', eyebrow:'The one line to remember', big:'People buy from you once they feel understood, not when you feel understood.'},

  {t:'mistakes', eyebrow:'Avoid these', h2:'Three things that keep clients away',
   list:['Trying to be everywhere instead of being clear somewhere.',
         'Talking about your process before you have named their problem.',
         'Discounting to win a client you could have attracted at full price.']},

  {t:'recap', eyebrow:'Recap', h2:'The 4 Business Strategies',
   list:['Visibility: be seen by the right people.',
         'Attraction: draw them in instead of chasing.',
         'Relationship: build the trust that converts.',
         'Transformation: deliver the result that compounds.'], band:4, on:3},

  {t:'cta', eyebrow:'Your next step', h1:'Ready to build your system?',
   p:'If you want help turning these four strategies into your own repeatable client-attraction system, the next step is a free VIP session with me. We look at where your clients are coming from now and map the fastest path to more of the right ones.',
   byline:'Book your free VIP session at henriettedanel.com',
   disc:'This masterclass is educational. Results vary and depend on your own effort, offer and market. Nothing here is a promise or guarantee of income or any specific result.'}
];

const deck = document.getElementById('deck');
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta'?' cta':'');
  let h = '';
  if(s.eyebrow) h += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num) h += `<div class="num">${s.num}</div>`;
  if(s.h1) h += `<h1>${s.h1}</h1>`;
  if(s.h2) h += `<h2>${s.h2}</h2>`;
  if(s.big) h += `<p class="big">${s.big}</p>`;
  if(s.p) h += `<p class="${s.t==='who'||s.t==='promise'?'lede':''}">${s.p}</p>`;
  if(s.list){ h += '<ul>'; for(const li of s.list) h += `<li>${li}</li>`; h += '</ul>'; }
  if(s.band){ let b='<div class="band">'; for(let i=0;i<s.band;i++) b += `<span class="${i<= (s.on??-1)?'on':''}"></span>`; b+='</div>'; h+=b; }
  if(s.byline) h += `<div class="byline">${s.byline}</div>`;
  if(s.disc) h += `<div class="disc">${s.disc}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
