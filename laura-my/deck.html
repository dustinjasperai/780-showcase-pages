<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teach the Yoga People Actually Need | Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#f4f2ef;
    --panel:#ffffff;
    --ink:#2c2a2e;
    --ink-soft:#54505a;
    --ink-muted:#857f8c;
    --accent:#685c72;
    --accent-deep:#4e4557;
    --rule:#e6e1da;
  }
  html,body{height:100%;}
  body{
    font-family:'Poppins',-apple-system,sans-serif;
    background:var(--accent-deep);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .stage{
    width:100%; max-width:960px; aspect-ratio:16/9;
    background:var(--bg);
    position:relative; overflow:hidden;
    box-shadow:0 24px 70px rgba(40,34,45,.45);
    border-radius:4px;
  }
  .slide{
    position:absolute; inset:0;
    padding:72px 80px;
    display:none; flex-direction:column; justify-content:center;
  }
  .slide.on{display:flex;}
  .eyebrow{font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:22px;}
  h1{font-family:'Crimson Text',Georgia,serif; font-weight:700; font-size:54px; line-height:1.08; color:var(--ink); letter-spacing:-.01em;}
  h2{font-family:'Crimson Text',Georgia,serif; font-weight:600; font-size:38px; line-height:1.15; color:var(--ink); margin-bottom:18px;}
  .sub{font-size:20px; color:var(--ink-soft); margin-top:22px; line-height:1.5; max-width:40ch;}
  p{font-size:18px; color:var(--ink-soft); line-height:1.6; max-width:52ch;}
  p+p{margin-top:14px;}
  .big{font-family:'Crimson Text',Georgia,serif; font-size:40px; line-height:1.2; color:var(--ink); max-width:24ch;}
  .big .hl{color:var(--accent); font-style:italic;}
  .part{font-family:'Crimson Text',Georgia,serif; font-weight:600;}
  .part .num{display:block; font-size:15px; letter-spacing:.3em; color:var(--accent); font-family:'Poppins',sans-serif; font-weight:600; margin-bottom:16px;}
  .part .t{font-size:46px; color:var(--ink);}
  ul{list-style:none; margin-top:10px;}
  li{font-size:18px; color:var(--ink-soft); padding:11px 0 11px 30px; position:relative; border-bottom:1px solid var(--rule); line-height:1.4;}
  li:last-child{border-bottom:none;}
  li::before{content:''; position:absolute; left:4px; top:19px; width:8px; height:8px; background:var(--accent); border-radius:50%;}
  li b{color:var(--ink); font-weight:600;}
  .pillars{display:grid; grid-template-columns:1fr 1fr; gap:14px 34px; margin-top:8px;}
  .pillar{padding:16px 18px; background:var(--panel); border:1px solid var(--rule); border-left:3px solid var(--accent); border-radius:3px;}
  .pillar h3{font-family:'Crimson Text',serif; font-size:21px; color:var(--ink); margin-bottom:5px; font-weight:600;}
  .pillar span{font-size:14px; color:var(--ink-muted); line-height:1.45; display:block;}
  .quote{font-family:'Crimson Text',Georgia,serif; font-style:italic; font-size:30px; line-height:1.3; color:var(--ink); max-width:30ch;}
  .cite{font-family:'Poppins',sans-serif; font-style:normal; font-size:15px; color:var(--ink-muted); margin-top:20px; letter-spacing:.02em;}
  .cta-steps{margin-top:26px;}
  .cta-steps .s{display:flex; gap:14px; align-items:baseline; padding:12px 0; border-top:1px solid var(--rule); font-size:18px; color:var(--ink-soft);}
  .cta-steps .s b{color:var(--ink);}
  .cta-steps .s .n{color:var(--accent); font-weight:600; font-family:'Crimson Text',serif; font-size:22px;}
  .site{margin-top:28px; font-size:17px; color:var(--accent-deep); font-weight:600; letter-spacing:.01em;}
  .disc{position:absolute; left:80px; right:80px; bottom:30px; font-size:11px; color:var(--ink-muted); line-height:1.4;}
  .credit{display:flex; gap:28px; margin-top:26px; flex-wrap:wrap;}
  .credit div{font-size:15px; color:var(--ink-soft);}
  .credit b{display:block; font-family:'Crimson Text',serif; font-size:30px; color:var(--accent); font-weight:700;}
  .nav{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:16px; align-items:center; font-family:'Poppins',sans-serif; font-size:13px; color:#d9d3df;}
  .nav button{background:rgba(255,255,255,.14); color:#fff; border:none; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer;}
  .nav button:hover{background:rgba(255,255,255,.28);}
  .count{min-width:54px; text-align:center;}
  @media(max-width:720px){ .slide{padding:34px 30px;} h1{font-size:32px;} .part .t{font-size:30px;} h2{font-size:26px;} .big{font-size:26px;} .pillars{grid-template-columns:1fr;} .disc{left:30px; right:30px;} }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="nav"><button id="prev">&#8249;</button><span class="count" id="count"></span><button id="next">&#8250;</button></div>
<script>
const S = [
  {t:'title', eyebrow:'Bristol School of Yoga  ·  A masterclass for teachers',
   h1:'Teach the Yoga People Actually Need',
   sub:'The science of pain, trauma and the nervous system that your first training never had time for.'},

  {t:'lead', eyebrow:'Who this is for',
   h2:'For the teacher who qualified, then met real bodies.',
   p:['You finished your 200 hours. You can hold a room, cue a flow, keep a healthy class safe and moving.',
      'Then a student arrives with a chronic back injury. Or a panic response on the mat. Or a body that simply will not do what the manual assumed. And the script quietly runs out.']},

  {t:'big', eyebrow:'The honest part',
   big:['The gap is not your talent. It is that <span class="hl">nobody taught you the science</span> of the bodies that need you most.']},

  {t:'part', num:'Part One', title:'The core problem'},

  {t:'lead', eyebrow:'What most trainings skip',
   h2:'Healthy-body yoga, taught to a world of real bodies.',
   p:['Most foundational trainings spend their hours on asana, sequencing and philosophy. Pain science, fascia, trauma and the nervous system get a mention, if that.',
      'So teachers do one of two things with the students who need the most care: avoid them, or wing it. Both cost you the work you are actually here to do.']},

  {t:'list', eyebrow:'The students in front of you',
   h2:'The people generic classes were not built for.',
   items:[['People in persistent pain','who were told to rest, and got weaker and more afraid.'],
          ['Anxious and trauma-carrying students','for whom a standard class can feel unsafe.'],
          ['Hypermobile and injured bodies','that a one-size cue can quietly harm.'],
          ['Menopausal and changing bodies','asking questions the 200hr never answered.']]},

  {t:'part', num:'Part Two', title:'The method'},

  {t:'big', eyebrow:'The through-line',
   big:['Explain the <span class="hl">movement science and the neurology</span> without losing the soul of yoga.']},

  {t:'pillars', eyebrow:'What you actually learn to teach',
   h2:'Four bodies of knowledge, built for teaching.',
   pillars:[
     ['Movement science and fascia','Fascia, hypermobility and biomechanics, so you can see why a body moves the way it does and adapt with intent.'],
     ['The nervous system','Teaching for anxiety and trauma, the vagus nerve, breath and bandhas, grounded in neurology and biology, taught trauma-sensitively.'],
     ['Restorative and somatic yoga','How to down-regulate a nervous system on purpose, and give students a reset they can feel.'],
     ['Adapting for every body','Posture adaptation with props and optional hands-on, plus creative sequencing that keeps your own voice.']
   ]},

  {t:'lead', eyebrow:'Why evidence-based matters',
   h2:'Confidence comes from knowing why, not just what.',
   p:['When you understand pain science, you stop fearing the student in pain. When you understand the nervous system, you can teach calm instead of hoping for it.',
      'The science is learnable. Once you have it, you can teach the bodies that walk in, not the body the manual assumed.']},

  {t:'quote',
   quote:'Laura has an unbelievable ability to explain complex movement science and the neurology without losing the soul of yoga.',
   cite:'A 300hr Advanced Training graduate'},

  {t:'part', num:'Part Three', title:'The teacher you become'},

  {t:'list', eyebrow:'The teacher on the other side',
   h2:'What changes when you have the science.',
   items:[['You take any body','without the quiet panic, because you understand what is in front of you.'],
          ['You teach specialist work','pain, trauma, restorative, menopause, the rooms that are genuinely under-served.'],
          ['You build a real income','specialist skills let you teach the people who need you, and be paid properly for it.']]},

  {t:'lead', eyebrow:'The Independent Teacher’s Path',
   h2:'From qualified, to the teacher people seek out.',
   p:['This is the difference between another drop-in instructor and a specialist that students, studios and GPs refer to by name.',
      'The science is the credibility. The specialism is the career. That is the path this training is built to put you on.']},

  {t:'credit', eyebrow:'Who is teaching this',
   h2:'Laura Gilmore',
   p:['27 years of teaching, 30+ years of practice, and the founder of Bristol School of Yoga since 2008. Trauma-informed, evidence-based, and still in love with the tradition.'],
   credit:[['27','years teaching'],['2008','Bristol School of Yoga'],['300hr','Advanced Training']]},

  {t:'cta', eyebrow:'Begin the advanced training',
   h2:'Train to teach the yoga people actually need.',
   steps:[['1','Explore the ','300 Hour Advanced Yoga Teacher Training',', six modules across the science of real bodies.'],
          ['2','Download the ','free prospectus',' to see the full curriculum and dates.'],
          ['3','Book a ','free 15-minute call',' to talk through whether it is the right next step for you.']],
   site:'lauragilmoreyoga.co.uk',
   disc:'Educational content only. Yoga teaching outcomes, professional recognition and income vary from teacher to teacher; nothing here is a guarantee of any professional or financial result. Always teach within your scope and refer to medical professionals where appropriate.'}
];

const stage=document.getElementById('stage');
function esc(s){return s;}
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='slide'+(i===0?' on':''); d.dataset.i=i;
    let h='';
    if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
    if(s.t==='title'){ h+='<h1>'+s.h1+'</h1><div class="sub">'+s.sub+'</div>'; }
    else if(s.t==='lead'||s.t==='list'||s.t==='pillars'||s.t==='credit'){
      if(s.h2) h+='<h2>'+s.h2+'</h2>';
      if(s.p) s.p.forEach(x=>h+='<p>'+x+'</p>');
      if(s.items){ h+='<ul>'; s.items.forEach(it=>h+='<li><b>'+it[0]+'</b>, '+it[1]+'</li>'); h+='</ul>'; }
      if(s.pillars){ h+='<div class="pillars">'; s.pillars.forEach(p=>h+='<div class="pillar"><h3>'+p[0]+'</h3><span>'+p[1]+'</span></div>'); h+='</div>'; }
      if(s.credit){ h+='<div class="credit">'; s.credit.forEach(c=>h+='<div><b>'+c[0]+'</b>'+c[1]+'</div>'); h+='</div>'; }
    }
    else if(s.t==='big'){ h+='<div class="big">'+s.big[0]+'</div>'; }
    else if(s.t==='part'){ h+='<div class="part"><span class="num">'+s.num+'</span><span class="t">'+s.title+'</span></div>'; }
    else if(s.t==='quote'){ h+='<div class="quote">“'+s.quote+'”</div><div class="cite">'+s.cite+'</div>'; }
    else if(s.t==='cta'){
      h+='<h2>'+s.h2+'</h2><div class="cta-steps">';
      s.steps.forEach(st=>h+='<div class="s"><span class="n">'+st[0]+'</span><span>'+st[1]+'<b>'+st[2]+'</b>'+st[3]+'</span></div>');
      h+='</div><div class="site">'+s.site+'</div><div class="disc">'+s.disc+'</div>';
    }
    d.innerHTML=h; stage.appendChild(d);
  });
}
let cur=0;
function show(n){ const sl=stage.querySelectorAll('.slide'); cur=Math.max(0,Math.min(S.length-1,n)); sl.forEach((x,i)=>x.classList.toggle('on',i===cur)); document.getElementById('count').textContent=(cur+1)+' / '+S.length; }
render(); show(0);
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')show(cur+1); if(e.key==='ArrowLeft')show(cur-1); });
stage.addEventListener('click',e=>{ const r=stage.getBoundingClientRect(); (e.clientX-r.left > r.width/2)?show(cur+1):show(cur-1); });
</script>
</body>
</html>
