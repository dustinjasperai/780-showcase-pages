<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitter to Better | A Masterclass with India Kern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#222d36; --panel:#2b3a42; --rule:#3b4b55;
    --accent:#f4ad24; --ink:#f4f1ea; --muted:#9fb0ba;
    --head:'Raleway',system-ui,sans-serif; --body:'Lato',system-ui,sans-serif;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
  #stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 6vw}
  .slide{display:none;max-width:900px;width:100%}
  .slide.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:clamp(34px,6vw,62px);line-height:1.08;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(26px,4vw,42px);line-height:1.14;margin-bottom:20px}
  p.lead{font-size:clamp(18px,2.2vw,24px);color:var(--ink)}
  p.body{font-size:clamp(16px,1.9vw,20px);color:var(--muted);margin-top:14px}
  .big{font-family:var(--head);font-weight:800;font-size:clamp(40px,8vw,88px);line-height:1.02;color:var(--ink)}
  .big .a{color:var(--accent)}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:4px}
  ul{list-style:none;margin-top:22px}
  li{font-size:clamp(17px,2vw,22px);padding:14px 0 14px 44px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li .n{position:absolute;left:0;top:12px;font-family:var(--head);font-weight:800;color:var(--accent);font-size:20px}
  .panel{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);padding:26px 30px;border-radius:6px;margin-top:10px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;border-top:1px solid var(--rule);padding-top:16px;font-style:italic}
  .nav{position:fixed;bottom:20px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px;font-family:var(--head);font-size:13px;color:var(--muted)}
  .nav button{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:8px 16px;font-family:var(--head);font-weight:600;cursor:pointer}
  .nav button:hover{border-color:var(--accent);color:var(--accent)}
  .dots{letter-spacing:2px}
  .brandline{font-family:var(--head);font-weight:600;color:var(--muted);font-size:15px;margin-top:30px}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav">
  <button id="prev">Prev</button>
  <span class="dots"><span id="pos">1</span> / <span id="tot">0</span></span>
  <button id="next">Next</button>
</div>
<script>
const S=[
  {t:'title', k:'A live masterclass with India Kern', h:'Bitter to Better', b:'The five shifts that turn divorce from the end of one life into the start of a better one.'},
  {t:'promise', k:'The promise', h:'By the end of this hour, you will see the path, not just the pain.', b:'You will know the five shifts that move a person from stuck and angry to steady and rebuilding, and which one to start with this week.'},
  {t:'who', k:'Who this is for', h:'You did not choose this chapter. You still get to choose how it ends.', b:'For anyone in the middle of a divorce, or standing in the wreckage after one, who is tired of feeling angry, stuck, and afraid of what comes next.'},
  {t:'trap', k:'The trap', h:'Everyone hands you logistics. Almost no one helps you heal.', b:'Lawyers, mediators, custody calendars, and spreadsheets. They matter. But none of them touch the part that keeps you up at 2am: the fear, the anger, and the question of who you are now.'},
  {t:'moment', k:'The 2am question', h:'It is not the paperwork that wakes you up.', b:'It is the replay. The what-ifs. The fear that the best part of your life is already behind you. That is the part we work on here, because that is the part that decides everything else.'},
  {t:'hook', big:true, k:'The truth no one says out loud', h:'HOOK'},
  {t:'part', k:'Part one', h:'The real problem is not the divorce. It is staying bitter about it.', b:'Bitterness feels like protection. It is actually a cage. It keeps you reliving the worst day on a loop, and it quietly decides your next year for you. The work is not pretending it did not hurt. The work is choosing which direction the hurt points you.'},
  {t:'cost', k:'What bitterness costs', h:'Every month you stay bitter is a month you do not get back.', b:'It leaks into your parenting, your sleep, your next relationship, your health. Nobody tells you that healing is a decision with steps. It is. And the sooner you start, the more of your life you keep.'},
  {t:'framework', k:'Part two: the path', h:'The Divorce Survival Kit', b:'Five shifts, in order, that move you from surviving to rebuilt. This is the arc I walk every client through.', pts:[
    ['1','Life Transitions, seeing divorce as a passage you move through, not a verdict on your worth.'],
    ['2','Roadblocks to Avoid, the common traps that keep good people stuck for years.'],
    ['3','Creating a New Norm, rebuilding daily life and the version of you that lives it.'],
    ['4','Fear versus Faith, the one decision that shapes every other one.'],
    ['5','Forgiveness, the release that finally sets the weight down, for you, not for them.']
  ]},
  {t:'module', k:'Shift one', h:'Life Transitions', b:'Divorce is not a verdict on your worth. It is a transition, and transitions have a shape: an ending, a messy middle, and a new beginning. When you can name where you are in that shape, the ground stops feeling like it is falling out from under you.'},
  {t:'module', k:'Shift two', h:'Roadblocks to Avoid', b:'There are a handful of traps that keep good people stuck for years: revenge, replaying, comparing, and waiting for an apology that may never come. We name them plainly so you can see them coming and step around them.'},
  {t:'module', k:'Shift three', h:'Creating a New Norm', b:'You are not rebuilding the old life. You are building a new one, on purpose. New rhythms, new small rituals, a new picture of a good Tuesday. This is where life starts to feel like yours again.'},
  {t:'deep', k:'Shift four, the pivot', h:'Fear versus Faith', b:'This is the shift most people get stuck on, so we spend the most time here. Fear asks what else could go wrong. Faith asks what could go right if you let it. Every decision in your divorce, about the kids, the money, the future, is really this one question underneath. Learn to spot which one is driving, and the rest gets lighter.'},
  {t:'forgive', k:'Shift five, the release', h:'Forgiveness is for you.', b:'Forgiveness is not saying it was okay. It is refusing to let it own the rest of your story. It is the last shift because it is the one that frees you to build what comes next. Most people think they cannot. Then they do, and everything opens up.'},
  {t:'tools', k:'What you leave with', h:'The 6 Divorce Survival Tools', b:'Not theory. A kit for the hard days.', pts:[
    ['', 'Emotional support that steadies you when it all floods in.'],
    ['', 'Organization that makes the chaos smaller and manageable.'],
    ['', 'The mindset shifts that change how the whole thing feels.'],
    ['', 'A clear action plan so you always know the next right step.'],
    ['', 'Clarity on what you actually want on the other side.'],
    ['', 'Community, so you stop carrying this one alone.']
  ]},
  {t:'kids', k:'If you are a parent', h:'Your kids are watching how you rebuild.', b:'They are not learning from the divorce. They are learning from how you carry it. When they watch you choose better, they learn that hard things do not get the last word. That is one of the quietest, most lasting gifts of doing this work.'},
  {t:'picture', k:'What better looks like', h:'This is not back to normal. It is forward to new.', b:'You wake up and the first thought is not the divorce. You make a decision from faith instead of fear. You laugh without it feeling like a betrayal of your own grief. That is better. It is reachable, and it has a path.'},
  {t:'whyme', k:'Why me', h:'I am India Kern, and I have walked people through this for years.', b:'I am a Certified Divorce Coach and the host of The Divorce Recovery Podcast. I built the Divorce Survival Kit and the Higher Road group because the same five shifts kept turning bitter into better, over and over. I am not here to fix you. You are not broken. I am here to walk the path with you.'},
  {t:'cta', k:'Your next step', h:'Choose better, with a guide.', b:'If today landed, the next step is simple. Book a call with me, or join the Higher Road group coaching, and we will walk the full Divorce Survival Kit together, at your pace.', disc:'This masterclass is educational and reflects one coach approach to divorce recovery. It is not therapy, legal, or financial advice. Individual results vary and are not guaranteed.'}
];
const stage=document.getElementById('stage');
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===0?' on':'');
    let html='';
    if(s.k) html+='<div class="kicker">'+s.k+'</div>';
    if(s.t==='hook'){
      html+='<div class="big">Divorce can make you <span class="strike">bitter</span><br>or it can make you <span class="a">better</span>.</div>';
      html+='<p class="body">You decide which divorce this becomes. Not today, maybe. But eventually, and on purpose.</p>';
    } else if(s.t==='title'){
      html+='<h1>'+s.h+'</h1><p class="lead">'+s.b+'</p>';
    } else {
      html+='<h2>'+s.h+'</h2>';
      if(s.b) html+='<p class="'+(s.t==='who'||s.t==='part'?'lead':'body')+'">'+s.b+'</p>';
    }
    if(s.pts){
      html+='<ul>';
      s.pts.forEach(p=>{ html+='<li>'+(p[0]?'<span class="n">'+p[0]+'</span>':'<span class="n">'+'•'+'</span>')+p[1]+'</li>'; });
      html+='</ul>';
    }
    if(s.t==='whyme') html+='<div class="brandline">India Kern &middot; The Divorce Recovery Podcast</div>';
    if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
    d.innerHTML=html;
    stage.appendChild(d);
  });
  document.getElementById('tot').textContent=S.length;
}
let cur=0;
function show(n){
  const slides=document.querySelectorAll('.slide');
  cur=Math.max(0,Math.min(S.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
  document.getElementById('pos').textContent=cur+1;
}
render();
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
</script>
</body>
</html>
