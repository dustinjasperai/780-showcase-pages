<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Business Development Ecosystem, Kristin Harad, Full Advisor Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Petrona:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FAF6F2; --panel:#F1E7ED; --rule:#E3D2DD;
    --plum:#6D175C; --orange:#F46E0F; --ink:#241820; --grey:#6B5760; --dim:#9C8890;
  }
  html,body{height:100%}
  body{background:#15080F;font-family:'Petrona',Georgia,serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#15080F}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .disp{font-family:'Montserrat',Arial,sans-serif}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--plum);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',Arial,sans-serif;font-weight:700;color:var(--ink);line-height:1.12;letter-spacing:-.01em}
  h1 .a{color:var(--plum)}
  .t-title h1{font-size:4.7vw}
  .t-normal h1{font-size:3vw;max-width:86%}
  .t-normal .body{font-family:'Petrona',serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.5;font-weight:400}
  .sub{font-family:'Petrona',serif;font-size:1.7vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.45;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.3vw;font-weight:600;color:var(--orange);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--orange),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#7A2069 0%,#3E0C33 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:84%;font-weight:500;color:#FBEFF7}
  .t-dark .disc{color:#D9AECB}
  .t-flow .kicker{text-align:center}
  .t-flow h1{font-size:2.7vw;text-align:center;margin-bottom:4.6vh}
  .flowrow{display:flex;gap:1.1vw;justify-content:center;flex-wrap:wrap}
  .flowcard{background:var(--panel);border:1px solid var(--rule);border-radius:.7vw;padding:2.4vh 1.3vw;width:15vw;min-height:15vh;display:flex;flex-direction:column;gap:1vh}
  .flowcard .n{font-family:'Montserrat',sans-serif;font-size:1.9vw;font-weight:800;color:var(--orange);line-height:1}
  .flowcard .l{font-family:'Petrona',serif;font-size:1.15vw;font-weight:500;color:var(--ink);line-height:1.3}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#8A2372 0%,#3E0C33 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:82%;color:#FBEFF7}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--orange);color:#FBD9BC;border-radius:100px;padding:1.3vh 1.6vw;font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Petrona',serif;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .loop{position:absolute;pointer-events:none;opacity:.95}
  .title-loop{right:6.5%;bottom:7%;width:22vw}
  .corner-loop{right:5.5%;bottom:6.5%;width:10vw;opacity:.5}
  .brandline{font-family:'Petrona',serif;font-size:1.25vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.01em}
  .brandline b{color:var(--plum);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--orange);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.14em;color:#C7A9BC;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C7A9BC;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Montserrat',sans-serif;font-size:11px;color:#C7A9BC;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.4vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.4vw}.t-dark h1{font-size:5.6vw}.t-flow h1{font-size:4.6vw}
    .flowcard{width:27vw}.flowcard .n{font-size:3.8vw}.flowcard .l{font-size:2.2vw}.t-cta h1{font-size:6.4vw}.chip{font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 24</div>
<div class="brand-foot">Full Advisor Coaching</div>
<div class="hint" id="hint">→ click or arrow keys</div>

<!-- feedback-loop motif: marketing to sales to client experience and back -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="loop" viewBox="0 0 260 220">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M60 60 A80 80 0 1 1 55 175" stroke="#6D175C" opacity="0.85"/>
    <path d="M55 175 L38 158 M55 175 L74 165" stroke="#6D175C" opacity="0.85"/>
    <circle cx="60" cy="60" r="9" fill="#6D175C" stroke="none"/>
    <circle cx="170" cy="46" r="9" fill="#F46E0F" stroke="none"/>
    <circle cx="196" cy="150" r="9" fill="#6D175C" stroke="none" opacity="0.6"/>
    <path d="M69 58 C110 40 150 40 168 46" stroke="#F46E0F" opacity="0.85"/>
    <path d="M178 52 C196 80 200 112 196 141" stroke="#F46E0F" opacity="0.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Business Development Ecosystem',sub:'Why marketing, sales, and client experience are one system, not three separate jobs.',brand:true,loop:'title'},
 {t:'normal',k:'Who this is for',title:'Solo advisors and advisory teams who already have clients and a practice.',body:'Just no system connecting how they get clients, close them, and keep them.'},
 {t:'normal',k:'What you’ll walk away with',title:'A different way to see your own business development.',body:'The reframe, the three pillars, and the feedback loop that ties them together.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'Every practice is different. What matters is the version of this that fits yours.',disc:'Coaching is educational and is not a guarantee of revenue, client growth, or business results. Results vary by advisor.'},
 {t:'normal',k:'Who’s teaching this',title:'Kristin Harad, CFP®, founder of Full Advisor Coaching.',body:'Years in financial-services marketing at Visa, Charles Schwab, and JPMorgan Chase, then she built VitaVie Financial Planning, a fee-only RIA, from zero to six figures in under three years, and sold it. Coaching advisors full time since 2014. Host of Full Advisor Coaching, the podcast, a Kitces Top 5 pick in practice management.'},

 {t:'section',idx:'Part One',title:'The Silo Trap'},
 {t:'normal',k:'The trap',title:'Most practices run marketing, sales, and client experience as three separate jobs.'},
 {t:'normal',k:'The tell',title:'A client win never makes it back into the next pitch.',body:'A lost prospect never makes it back into who gets targeted next. Each department works blind to the other two.'},
 {t:'dark',title:'If your marketing, sales, and client experience never talk to each other, you don’t have a system. You have three separate guesses.'},

 {t:'section',idx:'Part Two',title:'The Business Development Ecosystem'},
 {t:'normal',k:'The reframe',title:'Marketing, sales, and client experience aren’t three departments.',body:'They’re one continuous ecosystem, not the traditional linear model most practices default to.'},
 {t:'flow',k:'The three pillars',title:'Three pillars, one feedback loop',items:[
   {n:'01',l:'Marketing, lead generation'},{n:'02',l:'Sales, conversion'},{n:'03',l:'Client Experience, retention'}]},
 {t:'normal',k:'01 · Marketing',title:'Lead generation is the front door, not the whole system.',body:'It has to hand off cleanly to what happens next, or the leads it generates go nowhere.'},
 {t:'normal',k:'02 · Sales',title:'Conversion continues the marketing story. It doesn’t reset it.',body:'A prospect sold twice, once by the marketing, then again from scratch in the sales conversation, is a prospect you lose.'},
 {t:'normal',k:'03 · Client Experience',title:'Retention is raw material for the next round of marketing and sales.',body:'What you learn from client conversations sharpens your next pitch and your next campaign.'},
 {t:'dark',title:'Insights from client interactions inform your marketing and strengthen your sales conversations. That’s the loop most practices never close.'},

 {t:'section',idx:'Part Three',title:'Version 2.0'},
 {t:'normal',k:'The bigger goal',title:'It’s not just a bigger firm. It’s a firm that gives you your life back too.',body:'Personal fulfillment and firm growth aren’t opposites. Version 2.0 treats them as the same project.'},
 {t:'normal',k:'The proof',title:'Built the ecosystem inside her own RIA first.',body:'VitaVie Financial Planning went from zero to six figures in under three years, before Kristin ever taught this framework to anyone else.'},
 {t:'normal',k:'The difference',title:'Built for your practice, not a template dropped on top of it.'},

 {t:'section',idx:'Building It On Purpose',title:'Two Ways to Start Mapping Your Own Ecosystem'},
 {t:'normal',k:'Free',title:'Map your own ecosystem.',body:'The Business Development Ecosystem map, a free download showing where your marketing, sales, and client experience actually connect, or don’t.'},
 {t:'normal',k:'Talk it through',title:'A conversation about your practice.',body:'Solo Advisor Coaching for individual advisors, Enterprise Team Coaching for multi-advisor firms. Your numbers, your team, your timeline.'},
 {t:'cta',title:'Build the ecosystem, on purpose.',chips:['Map your ecosystem','Request a call'],disc:'Coaching is educational and is not a guarantee of revenue or business results. Results vary by advisor.'},
];

const deck=document.getElementById('deck');
function loopSvg(kind){return `<svg class="loop ${kind==='title'?'title-loop':'corner-loop'}"><use href="#loop"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx disp">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else if(s.t==='flow'){
    h+=`<h1>${s.title}</h1><div class="flowrow">`+s.items.map(it=>`<div class="flowcard"><div class="n">${it.n}</div><div class="l">${it.l}</div></div>`).join('')+`</div>`;
  }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Full Advisor <b>Coaching</b> · The Business Development Ecosystem</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.loop) h+=loopSvg(s.loop);
  else if(s.t==='title') h+=loopSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
