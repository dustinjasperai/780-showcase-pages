<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Photography Business, Built to Last · Summer Grace, The Summer School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#131212; --panel:#1e1b19; --rule:#3a3330;
    --acc:#c9a15e; --ink:#f5f2ea; --body:#d8d2c9; --dim:#8a827c; --cream:#f5f2ea;
  }
  html,body{height:100%}
  body{background:#0d0c0c;font-family:'Work Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0c0c}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Work Sans',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:.004em}
  .t-title h1{font-size:5.0vw;max-width:92%}
  .t-normal h1{font-size:3.4vw;max-width:88%}
  .t-normal .body{font-size:1.5vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.62;font-weight:400}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.2vw;color:var(--acc);margin-top:3.2vh;max-width:80%;line-height:1.42;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Work Sans',sans-serif;font-size:1.2vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.0vw;max-width:92%}
  .t-section .rule{width:15vw;height:1px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#241d15 0%,#0e0d0c 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:86%;font-style:italic;color:var(--cream);font-weight:500}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#241d15 0%,#0e0d0c 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.0vw;max-width:84%;color:var(--cream)}
  .t-cta .body{color:#e7e1d6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.6vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .iris-motif{position:absolute;pointer-events:none}
  .title-iris{right:8%;bottom:8%;width:15vw;opacity:.85}
  .corner-iris{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Work Sans',sans-serif;font-size:1.2vw;color:var(--body);margin-top:3.6vh;font-weight:500;letter-spacing:.06em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(245,242,234,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">The Summer School</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- aperture-iris motif: a simple lens iris drawn in gold -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="iris" viewBox="0 0 120 120">
  <g fill="none" stroke="#c9a15e" stroke-width="1.5" stroke-linecap="round">
    <circle cx="60" cy="60" r="40" opacity="0.85"/>
    <path d="M60 20 L88 74 M60 20 L32 74 M96 52 L36 78 M96 52 L60 96 M24 52 L84 78 M24 52 L60 96" opacity="0.5"/>
    <circle cx="60" cy="60" r="15" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Photography Business, Built to Last',sub:'How photographers go from a first booking to a business that runs without them.',brand:true,iris:'title'},
 {t:'normal',k:'Who this is for',title:'You can take the photo. The business is the part no one taught you.',body:'You are a photographer who can shoot beautifully and maybe stay booked, but the business behind it feels held together by hand. Pricing is a guess, the calendar is the whole plan, and a slow season is a real fear.'},
 {t:'dark',title:'A full calendar is not the same as a business that lasts.'},

 {t:'section',idx:'Part One',title:'Why a Booked Calendar Still Leaves You Stuck'},
 {t:'normal',k:'The craft-first trap',title:'Getting better at the work does not build the business.',body:'Most photographers pour their growth into the craft, the gear, the editing, the feed. The images get stronger and the business stays exactly as fragile as it was, because none of that is a system for booking, pricing, or keeping the money.'},
 {t:'normal',k:'The missing half',title:'Behind every booked photographer is a business nobody set up.',body:'Bookings come in, but there is no pricing logic, no client system, no plan for where the money goes. So the year is busy and the bank account is thin, and it all depends on you personally showing up for one more shoot.'},
 {t:'dark',title:'You did not pick up a camera to buy yourself a second job.'},

 {t:'section',idx:'Part Two',title:'The Summer School Method'},
 {t:'normal',k:'Stage one, get consistently booked',title:'A brand, a price, and a way to bring clients in on purpose.',body:'The foundation: a brand that attracts the right couples, pricing built on what the work is worth, and a real lead system, including the Instagram and ManyChat flow that turns a following into inquiries. This is where a beginner goes from hoping to booked.'},
 {t:'normal',k:'Stage two, the studio that runs without you',title:'Systems and a team, so the business is not just you.',body:'Once the bookings are steady, the work becomes the systems: the client experience, the workflow, outsourcing the parts that drain you, and building a small team. The studio starts to run on process instead of on your personal willpower.'},
 {t:'normal',k:'Stage three, built to last',title:'More than one way the business makes money, and a plan for the long run.',body:'The durable stage: diversifying income beyond shooting alone, through products, services, events, and teaching, and finally planning for the long run, savings and retirement included. This is the part almost no photographer is ever shown.'},
 {t:'dark',title:'A business that lasts is designed on purpose, not stumbled into.'},

 {t:'section',idx:'Part Three',title:'When the Business Is Built'},
 {t:'normal',k:'The photographer this builds',title:'Booked, calm, and no longer one slow season from trouble.',body:'A photographer who has built all three stages stops trading every hour for the next booking. The income is steadier and comes from more than one place, the studio survives a quiet month, and the work is finally a business, not a beautiful gamble.'},
 {t:'dark',title:'The goal was never just more weddings. It was a life the work can hold up.'},
 {t:'normal',k:'Why Summer Grace',title:'Built from nineteen, taught from the first booking to the last stage.',body:'Summer Grace started her photography business at nineteen and built it into a luxury wedding studio and an education brand, The Summer School. She teaches both halves of the arc, getting booked and building something durable, to photographers who want the same.'},

 {t:'section',idx:'Your Next Step',title:'Build the Business Behind the Photos'},
 {t:'normal',k:'Keep going with Summer',title:'Two rooms, for exactly where you are.',body:'Summer School 101 is the foundation for photographers who need to get booked: brand, pricing, client experience, and the lead system. Summer School 102 takes an established photographer into systems, team, diversified income, and planning for the long run. The membership is the lighter door into both.'},
 {t:'cta',title:'Ready to build a business your photography can hold up?',chips:['Explore Summer School 101','Step up with Summer School 102'],disc:'Educational content for working and aspiring photographers. No income or booking result is guaranteed. Results vary by photographer, market, and season.'},
];

const deck=document.getElementById('deck');
function iris(kind){return `<svg class="iris-motif ${kind==='title'?'title-iris':'corner-iris'}"><use href="#iris"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Summer <b>School</b> · Summer Grace</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.iris) h+=iris(s.iris);
  else if(s.t==='title') h+=iris('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
