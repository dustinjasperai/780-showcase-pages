<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Professional Tree Business · Chris Francis, Tree Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#15181c; --panel:#1e232b; --rule:#333b45;
    --acc:#3d81d4; --acc2:#15529d; --ink:#eef2f7; --body:#b7c1cd; --dim:#6d7784; --cream:#f4f7fb;
  }
  html,body{height:100%}
  body{background:#0f1216;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1216}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ink);line-height:1.06;letter-spacing:.004em;text-transform:uppercase}
  .t-title h1{font-size:5.4vw;max-width:94%}
  .t-normal h1{font-size:3.5vw;max-width:92%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400;text-transform:none}
  .sub{font-family:'Inter',sans-serif;font-size:1.7vw;color:var(--acc);margin-top:3.2vh;max-width:84%;line-height:1.45;font-weight:500;text-transform:none}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.0vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#1b2530 0%,#0d1013 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#1b2530 0%,#0d1013 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.0vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Inter',sans-serif;color:#d7dee6;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .rings-motif{position:absolute;pointer-events:none}
  .title-rings{right:7%;bottom:7%;width:20vw;opacity:.85}
  .corner-rings{right:6%;bottom:7%;width:10vw;opacity:.5}
  .brandline{font-family:'Inter',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em;text-transform:none}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(238,242,247,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Tree Business</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- growth-rings motif: concentric arborist tree-rings, drawn in the brand blue -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rings" viewBox="0 0 120 120">
  <g fill="none" stroke="#3d81d4" stroke-width="1.6" stroke-linecap="round">
    <circle cx="60" cy="60" r="8" opacity="0.95"/>
    <circle cx="60" cy="60" r="18" opacity="0.8"/>
    <circle cx="60" cy="60" r="29" opacity="0.62"/>
    <circle cx="60" cy="60" r="41" opacity="0.44"/>
    <circle cx="60" cy="60" r="54" opacity="0.28"/>
    <circle cx="61.5" cy="58" r="3" fill="#3d81d4" stroke="none" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Professional Tree Business',sub:'How a certified tree company charges for its expertise, builds a crew that stays, and stops competing as the cheapest truck in town.',brand:true,rings:'title'},
 {t:'normal',k:'Who this is for',title:'You can drop the tree. Running it like a business is the part nobody taught you.',body:'You are good in the field and the calls come in. But too many of them open with "what is your price," the season runs you instead of the other way around, and the whole thing still depends on you being on every job.'},
 {t:'dark',title:'A truck full of work is not the same as a business that pays you.'},

 {t:'section',idx:'Part One',title:'Why Good Tree Companies Stay Stuck'},
 {t:'normal',k:'The free quote',title:'A free quote turns your expertise into a commodity.',body:'When every estimate is free, the homeowner treats your assessment like everyone else’s, and the job goes to whoever guesses lowest. You are a Board Certified Master Arborist competing on price with a guy and a chainsaw.'},
 {t:'normal',k:'The owner trap',title:'If it all runs through you, you do not own a business. You own a job.',body:'The quoting, the crew, the problems, the callbacks, all of it lands on you. Growing just means more of you, until there is none of you left. That is the ceiling most tree companies never get past.'},
 {t:'dark',title:'You did not get certified to be the cheapest option in the driveway.'},

 {t:'section',idx:'Part Two',title:'Running Like a Professional'},
 {t:'normal',k:'The estimate is the first product',title:'Charge for the assessment, and everything changes.',body:'A professional arborist evaluation is worth money, so charge for it. The paid assessment screens out the price shoppers, positions you as the expert before a single cut, and turns a free quote into the first paid step of the relationship.'},
 {t:'normal',k:'Business Fundamentals',title:'The backbone: licensing, insurance, structure, and the money.',body:'Professional is not a logo, it is the boring backbone. The right licenses and insurance, a real business structure, and finances you actually understand are what let you take the big job, hire the good climber, and sleep at night.'},
 {t:'normal',k:'A crew that stays',title:'Build a crew that stays, in a trade where nobody does.',body:'The difference between a professional operation and a revolving door is what you offer the crew. Employee versus contractor done right, plus real benefits like paid time off, health care, and a retirement match, turn tree work into a career people keep.'},
 {t:'normal',k:'Safety as a system',title:'Safety is not red tape. It is how the professional operation runs.',body:'ANSI standards and OSHA compliance are not paperwork, they are the system that keeps your people whole, your insurance affordable, and your name the one homeowners trust. The safe crew is the profitable, insurable, referable crew.'},
 {t:'dark',title:'Professional is not what you call yourself. It is how the whole operation runs.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Run It Like a Professional'},
 {t:'normal',k:'The business this builds',title:'Fewer price shoppers, better crews, and a business that survives a day off.',body:'When you charge for the expertise and build the operation behind it, you attract the homeowners who want the certified pro, keep the people who do the work, and step off the truck without the whole thing wobbling. The season stops running you.'},
 {t:'dark',title:'The goal was never more jobs. It was a business worth owning.'},
 {t:'normal',k:'Why Chris Francis',title:'Board Certified Master Arborist, master’s in arboriculture, 20+ years running a real crew.',body:'Chris Francis is a Board Certified Master Arborist with a master’s in arboriculture and urban forestry, who built and still runs a professional tree care company. Tree Business is where he teaches owners what he had to learn the hard way.'},

 {t:'section',idx:'Your Next Step',title:'Run the Professional Tree Business'},
 {t:'normal',k:'Keep going with Chris',title:'From charging for the first assessment to a business that runs itself.',body:'This masterclass is the start. Tree Business is the courses, the mentoring, and the coaching that take you from a truck and a chainsaw to a professional operation that pays you, not just the equipment.'},
 {t:'cta',title:'Ready to run the professional tree business?',body:'Take the next step with Chris Francis and Tree Business.',chips:['Explore the Tree Business courses','Book a coaching consultation'],disc:'Educational content for tree care business owners. No income or business result is guaranteed. Results vary by operator, market, and effort.'},
];

const deck=document.getElementById('deck');
function rings(kind){return `<svg class="rings-motif ${kind==='title'?'title-rings':'corner-rings'}"><use href="#rings"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Tree <b>Business</b> · Chris Francis</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.rings) h+=rings(s.rings);
  else if(s.t==='title') h+=rings('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
