<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sustainable Songwriter — A Masterclass with Gary Grundei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf2f5;        /* rose-white, derived from their pink accent #cc3366 + #fff9f9 ground */
    --panel:#ffffff;
    --ink:#2b2b2b;       /* from body #333333 */
    --muted:#69727d;     /* site muted grey */
    --accent:#cc3366;    /* their link/accent pink */
    --accent2:#51729b;   /* their slate-blue H2 */
    --rule:#f0dbe3;
    --display:"Special Elite",monospace;
    --body:"Raleway","Lato",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .kicker{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin-bottom:22px}
  .num{font-family:var(--display);font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:400;font-size:46px;line-height:1.12;letter-spacing:.01em;margin-bottom:22px}
  h2{font-family:var(--display);font-weight:400;font-size:33px;line-height:1.18;margin-bottom:20px}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);font-weight:400;max-width:44ch}
  p{font-size:18px;line-height:1.62;color:#413e3c;max-width:60ch;margin-bottom:14px}
  .big{font-size:25px;line-height:1.4;font-weight:500;max-width:32ch;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:18.5px;line-height:1.5;padding:13px 0 13px 30px;position:relative;border-top:1px solid var(--rule);max-width:62ch}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:21px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .pillar{font-family:var(--display);color:var(--accent2);font-size:15px;letter-spacing:.06em;margin-bottom:8px}
  .title-slide{background:linear-gradient(180deg,#ffffff 0%,#fff2f6 100%);border-color:#f0dfe6}
  .title-slide h1{font-size:52px}
  .promise{font-size:20px;color:var(--accent2);margin-top:8px;font-family:var(--display)}
  .byline{margin-top:34px;font-size:16px;color:var(--muted)}
  .byline strong{color:var(--ink);font-weight:600;font-family:var(--body)}
  .hook{background:#2b2b2b;border-color:#2b2b2b}
  .hook h2,.hook .kicker{color:#fff}
  .hook .kicker{color:#f2a9c2}
  .hook p{color:#e9e4e0}
  .cta-slide{background:linear-gradient(180deg,#ffffff 0%,#fff2f6 100%);border-color:#f0dfe6}
  .cta-btn{display:inline-block;margin-top:10px;font-family:var(--display);font-size:17px;
    background:var(--accent);color:#fff;padding:15px 30px;border-radius:9px;letter-spacing:.03em}
  .disclaimer{margin-top:28px;font-size:13.5px;line-height:1.55;color:var(--muted);max-width:72ch}
  @media(max-width:680px){.slide{padding:38px 26px}h1{font-size:36px}.title-slide h1{font-size:40px}h2{font-size:27px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',c:"title-slide",html:`
   <div class="kicker">A live songwriting masterclass</div>
   <h1>The Sustainable Songwriter</h1>
   <div class="promise">Write, finish, and self-produce an original song every week, without waiting for inspiration or a studio.</div>
   <div class="byline">with <strong>Gary Grundei</strong> &middot; golden lotus studio</div>`},

 {t:'promise',k:"What this hour is",html:`
   <h2>One practice, four moving parts.</h2>
   <p>In the next hour I am going to show you the practice I teach songwriters inside golden lotus studio: how to generate a new song every week, how to actually finish the ones you start, how to record and produce them yourself at home, and how to keep it all going in community.</p>
   <p class="big">By the end you will have a way to write that does not depend on inspiration showing up.</p>`},

 {t:'audience',k:"Who this is for",html:`
   <h2>You already have the songs in you.</h2>
   <p>This is for songwriters at any level who love writing but keep hitting the same walls: a folder full of half-finished tunes, a blank page you only face when inspiration happens to arrive, and the sense that finishing and recording a song takes money, gear, or permission you do not have yet.</p>
   <p class="big">You do not need more talent. You need a practice you can keep.</p>`},

 {t:'trap',k:"The trap",html:`
   <h2>Why the songs stay unfinished</h2>
   <ul>
     <li>You wait for inspiration, so writing is rare and unpredictable instead of a habit.</li>
     <li>You chase perfect, so songs get abandoned the moment they stop matching the version in your head.</li>
     <li>You believe recording needs a real studio, so your finished songs never leave your phone.</li>
     <li>You write alone, so no one catches you when you stall and no deadline is ever real.</li>
   </ul>`},

 {t:'hook',c:"hook",k:"The reframe",html:`
   <h2>Inspiration is not a plan.</h2>
   <p>Done is better than perfect. Art is never finished, only abandoned.</p>
   <p>The songwriters who build a real body of work are not more gifted than you. They have a weekly practice that keeps generating, keeps finishing, and carries the song all the way to a recording they are proud to share.</p>`},

 {t:'problem',k:"Part One",html:`<div class="num">Part One</div><h2>The real problem is sustainability.</h2>
   <p>Most songwriting advice teaches you how to write one good song. That is a craft problem, and craft is learnable.</p>
   <p>But one good song does not make you a songwriter. A practice does. The problem is not that you cannot write. It is that you have no system that makes you write, finish, and record on a cadence you can sustain for years.</p>`},

 {t:'problem2',k:"Part One",html:`<h2>Willpower and one-off courses run out.</h2>
   <p>A weekend workshop gives you a spark and then leaves you alone with the same blank page on Monday. Motivation fades. Gear tutorials pile up unwatched in a browser tab.</p>
   <p class="big">What lasts is a rhythm, a way to finish, and a room full of people writing alongside you.</p>`},

 {t:'myth',k:"Part One",html:`<h2>The myth that keeps you stuck</h2>
   <p>The myth is that real songs come from rare moments of genius, and that your job is to wait, deserve, and eventually catch one.</p>
   <p>The truth is quieter and far more useful: songs come from showing up to the page on a schedule, with a method in hand, and being willing to finish something ordinary so the extraordinary ones have somewhere to land.</p>`},

 {t:'framework',k:"Part Two",html:`<div class="num">Part Two</div><h2>The Sustainable Songwriting practice</h2>
   <p>Four pillars I teach inside golden lotus studio. Together they turn songwriting from something you wait for into something you do, every single week.</p>`},

 {t:'pillar1',k:"Part Two &middot; Pillar 1",html:`
   <div class="pillar">Generate on a cadence</div>
   <h2>Write a new song from scratch, every week.</h2>
   <p>This is the engine of the Friday Afternoon Songwriting Club: a fresh set of writing prompts and compositional methods each week, so you walk out of every session with a first draft of an original song.</p>
   <p>No waiting for inspiration. The prompt is the inspiration, and the cadence makes writing a habit instead of a lucky accident.</p>`},

 {t:'pillar2',k:"Part Two &middot; Pillar 2",html:`
   <div class="pillar">Finish, do not perfect</div>
   <h2>Work with what you already started.</h2>
   <p>You will learn why songs stall and how to work with unfinished material: techniques to spark creativity when you are stuck, and the moves that take a half-written tune across the line.</p>
   <p>The goal is not a flawless song. It is a finished one, because a finished song teaches you ten times what a perfect idea in your head ever will.</p>`},

 {t:'pillar3',k:"Part Two &middot; Pillar 3",html:`
   <div class="pillar">Self-produce it</div>
   <h2>Record and produce your own music at home.</h2>
   <p>This is the Compose Yourself, Record Yourself, Produce Yourself path: a creative, contemplative approach to the tech, so you can capture your song in GarageBand or Logic Pro without a studio, an engineer, or anyone's permission.</p>
   <p>When you can produce yourself, a finished song becomes a recording you can actually share, not a voice memo that disappears.</p>`},

 {t:'pillar4',k:"Part Two &middot; Pillar 4",html:`
   <div class="pillar">Sustain it in community</div>
   <h2>You were never meant to do this alone.</h2>
   <p>The Sustainable Songwriting Collective is the room that keeps the practice alive: two weekly co-writing sessions, monthly song circles with real feedback, office hours for theory and tech, and a private forum of musicians writing right alongside you.</p>
   <p>Community is what turns a good month into a durable creative life.</p>`},

 {t:'loop',k:"How it fits",html:`<h2>The weekly loop</h2>
   <ul>
     <li>Generate a first draft from a prompt (Pillar 1).</li>
     <li>Use finishing techniques to complete it instead of abandoning it (Pillar 2).</li>
     <li>Record and produce it yourself at home (Pillar 3).</li>
     <li>Bring it to the circle for feedback, then start again next week (Pillar 4).</li>
   </ul>
   <p>Four pillars, one repeating loop. That loop is the practice.</p>`},

 {t:'vision',k:"Part Three",html:`<div class="num">Part Three</div><h2>What a sustainable year looks like</h2>
   <p>Imagine a Friday that always ends with a new song. A catalog that grows by dozens of finished tunes instead of stalling at the same three. Recordings you are proud to send to a friend, a sync library, or a release.</p>
   <p class="big">Not one burst of inspiration. A body of work.</p>`},

 {t:'shift',k:"Part Three",html:`<h2>From waiting to writing</h2>
   <ul>
     <li>Before: you write when you feel like it. After: you write every week, on purpose.</li>
     <li>Before: songs pile up half-done. After: you have a way to finish them.</li>
     <li>Before: your recordings live on your phone. After: you produce them yourself and share them.</li>
     <li>Before: you create alone. After: you create inside a community that keeps you going.</li>
   </ul>`},

 {t:'whyme',k:"Why me",html:`<h2>Why learn this with me</h2>
   <p>I am Gary Grundei, a professional songwriter, composer and teacher, and the founder of golden lotus studio. My music has been featured by NPR, MTV, the Kennedy Center and the Denver Center for the Performing Arts, and I have composed for stage, film and podcasts and performed with artists from Meredith Monk to my own band, High Fiction.</p>
   <p>I have taught at Naropa University, Occidental College and Ohio State, and since 2018 I have built golden lotus studio into a supportive online home where songwriters of every level write, finish and produce their own music together.</p>`},

 {t:'cta',c:"cta-slide",k:"Your next song",html:`
   <h2>Start the practice this week.</h2>
   <p>If this is the way you want to write, come write with us. The Sustainable Songwriting Collective runs live every week, and you can begin with a free trial month and feel what a weekly practice is actually like.</p>
   <a class="cta-btn" href="https://goldenlotusstudio.com/sscfull/">Join the Sustainable Songwriting Collective</a>
   <div class="disclaimer">This masterclass is for educational purposes only. Songwriting, creative, and career outcomes vary from person to person and depend on your own effort, practice and circumstances. No particular artistic, audience, or income result is guaranteed. Results vary.</div>`}
];
const d=document.getElementById('deck');
S.forEach((s)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.c||'');
  let head=s.k?('<div class="kicker">'+s.k+'</div>'):'';
  el.innerHTML=head+s.html;
  d.appendChild(el);
});
</script>
</body>
</html>
