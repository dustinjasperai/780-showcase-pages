<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fale Menos, Comunique Mais - Carla Rocha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf1f2;        /* light slate-teal tint of brand #3b657c/#59af9c (site_scheme: light) */
    --panel:#f9fbfb;
    --rule:#d8e2e2;
    --ink:#3e3e3b;        /* brand dominant text hex */
    --muted:#6d6d6d;
    --accent:#3b657c;     /* brand footer slate teal-blue */
    --accent-soft:#59af9c;/* brand teal-green, sparing */
    --serif:'League Spartan',Georgia,serif;
    --sans:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#2c2c2a;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    position:relative;background:var(--bg);border-radius:14px;
    aspect-ratio:16/9;margin:0 0 26px;padding:64px 72px;overflow:hidden;
    box-shadow:0 10px 34px rgba(0,0,0,.22);display:flex;flex-direction:column;justify-content:center;
  }
  .slide::after{/* soundwave motif */
    content:"";position:absolute;left:72px;bottom:46px;width:132px;height:16px;
    background:
      repeating-linear-gradient(90deg,var(--accent) 0 3px,transparent 3px 9px);
    -webkit-mask:linear-gradient(90deg,#000,#000);opacity:.5;
    clip-path:polygon(0 50%,4% 30%,8% 60%,12% 10%,16% 70%,20% 40%,24% 85%,28% 25%,32% 65%,36% 45%,40% 75%,44% 20%,48% 55%,52% 35%,56% 80%,60% 30%,64% 60%,68% 15%,72% 70%,76% 40%,80% 65%,84% 50%,100% 50%);
  }
  .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--serif);font-size:62px;line-height:1.02;color:var(--ink);margin-bottom:18px;font-weight:400}
  h2{font-family:var(--serif);font-size:42px;line-height:1.08;color:var(--ink);margin-bottom:20px;font-weight:400}
  .lead{font-size:23px;line-height:1.5;color:var(--muted);max-width:30ch;font-weight:300}
  .body{font-size:21px;line-height:1.6;color:var(--ink);max-width:40ch;font-weight:300}
  .body.big{font-size:27px;max-width:34ch;color:var(--ink);font-weight:400}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;line-height:1.5;color:var(--ink);padding-left:28px;position:relative;margin-bottom:16px;font-weight:300;max-width:42ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .num{font-family:var(--serif);font-size:19px;color:var(--accent);margin-right:10px}
  .brand{margin-top:30px;font-size:15px;letter-spacing:.04em;color:var(--muted)}
  .pillar{display:flex;gap:18px;margin-bottom:18px;align-items:flex-start}
  .pillar .tag{font-family:var(--serif);font-size:26px;color:var(--accent);min-width:150px}
  .pillar .txt{font-size:18px;line-height:1.5;color:var(--ink);font-weight:300;max-width:34ch}
  .quote{font-family:var(--serif);font-size:40px;line-height:1.18;color:var(--ink);max-width:24ch;font-weight:400}
  .quote .em{font-style:italic;color:var(--accent)}
  .cta h2{font-size:46px}
  .disclaimer{margin-top:24px;font-size:13px;line-height:1.5;color:var(--muted);max-width:52ch;font-weight:300}
  .credwrap{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:14px;max-width:46ch}
  .credwrap span{font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:40px;padding:6px 14px;font-weight:400}
  .pagenum{position:absolute;right:30px;bottom:26px;font-size:13px;color:#b8b8b8}
  @media(max-width:720px){
    .slide{padding:34px 30px}
    h1{font-size:38px}h2{font-size:30px}.quote{font-size:28px}
    .pillar{flex-direction:column;gap:4px}.pillar .tag{min-width:0}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
   h:'Fale Menos,<br>Comunique Mais',
   lead:'How professionals get heard by saying less.',
   kicker:'A masterclass with Carla Rocha',
   brand:'Carla Rocha Comunicação'},

  {t:'std',kicker:'What you will leave with',
   h:'Three things, by the end of the hour',
   list:['A simple way to cut a message down to what actually lands.',
         'One story, built with the método ROCHA, that you can use on Monday.',
         'A way to use your voice and presence so people lean in, not out.']},

  {t:'std',kicker:'Who this is for',
   h:'You already know your subject',
   body:'You are a professional or a leader. You present, you run meetings, you give feedback. You are not short on things to say. You are short on being heard.'},

  {t:'std',kicker:'The trap',
   h:'So you add more',
   body:'More slides. More data. More words, in case something sticks. You walk out having said everything, and the room remembers almost none of it.'},

  {t:'quote',
   q:'The problem was never that you said <span class="em">too little</span>.',
   sub:'It is that nothing had room to be heard.'},

  {t:'part',num:'Part One',h:'Noise is the real cost'},

  {t:'std',kicker:'The core problem',
   h:'More information is not more communication',
   body:'Every extra sentence competes with the one that mattered. When everything is emphasized, nothing is. The listener does the editing you refused to do, and they edit out the wrong parts.'},

  {t:'quote',
   q:'Stop asking <span class="em">what else can I say</span>.',
   sub:'Start asking what I can take away.'},

  {t:'part',num:'Part Two',h:'The method: Fale Menos, Comunique Mais'},

  {t:'std',kicker:'Why story first',
   h:'People remember stories, not bullet points',
   body:'Facts inform. Stories are what people carry out of the room and repeat later. The método ROCHA is how you find yours and make it land, on purpose, not by luck.'},

  {t:'std',kicker:'The método ROCHA',
   h:'Five steps to a story that works',
   list:['Find the real moments worth telling.',
         'Catalogue them so you are never scrambling for one.',
         'Choose the one story that serves this room.',
         'Shape it so the point is unmistakable.',
         'Deliver it so it is felt, not just heard.']},

  {t:'pillars',kicker:'The academy, in three pillars',
   h:'How a communicator is built',
   rows:[
     ['Organizar','Structure the message and the approach so the point is clear before you open your mouth.'],
     ['Colorir','Your personal brand, your story (método ROCHA), and the room-reading to improvise when it matters.'],
     ['Entregar','Voice, posture, presence and fluency. The part most people skip, and the part the room feels first.']
   ]},

  {t:'std',kicker:'The radio principle',
   h:'Captivate like on the radio',
   body:'On radio there are no slides and no eye contact. Only a voice, and the choice to keep listening. Thirty years taught me what holds attention with nothing to hide behind: fewer words, carried well. Bring that to the room and the slides stop doing the work for you.'},

  {t:'part',num:'Part Three',h:'What changes in the room'},

  {t:'std',kicker:'The shift',
   h:'The same meeting, run differently',
   body:'You open with one story, not an agenda. You make one point, not nine. You stop early. The decision gets made in the room, because for once there was room to decide.'},

  {t:'cred',kicker:'Why me',
   h:'Thirty years of being listened to',
   body:'I spent nearly three decades on the radio before founding Carla Rocha Comunicação in 2015. Since then my team and I have trained leaders and teams at:',
   logos:['Vodafone','Deloitte','BNP','Jerónimo Martins','Banco de Portugal','MEO','Santander']},

  {t:'std',kicker:'Start today',
   h:'One habit to begin with',
   body:'Before your next meeting, write the single sentence you want remembered. Then cut everything that does not earn its place next to it. Say less. Communicate more.'},

  {t:'cta',kicker:'Your next step',
   h:'Learn the whole method',
   body:'The Academia Fale Menos Comunique Mais takes you through all three pillars, live, over twelve weeks, with the método ROCHA, a workbook and the book to keep.',
   action:'Join the next edition at carlarocha.pt',
   disclaimer:'This masterclass is educational. No specific career, business or income result is guaranteed. Results vary and depend on the work you put in.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('div','slide '+(s.t==='cta'?'cta':''));
  if(s.kicker)sl.appendChild(el('div','kicker',s.kicker));
  if(s.t==='title'){
    sl.appendChild(el('h1',null,s.h));
    sl.appendChild(el('div','lead',s.lead));
    sl.appendChild(el('div','brand',s.brand));
  }else if(s.t==='part'){
    sl.appendChild(el('div','kicker',s.num));
    sl.appendChild(el('h2',null,s.h));
  }else if(s.t==='quote'){
    sl.appendChild(el('div','quote',s.q));
    if(s.sub)sl.appendChild(el('div','body','<br>'+s.sub));
  }else if(s.t==='pillars'){
    sl.appendChild(el('h2',null,s.h));
    s.rows.forEach(r=>{
      const p=el('div','pillar');
      p.appendChild(el('div','tag',r[0]));
      p.appendChild(el('div','txt',r[1]));
      sl.appendChild(p);
    });
  }else if(s.t==='cred'){
    sl.appendChild(el('h2',null,s.h));
    sl.appendChild(el('div','body',s.body));
    const w=el('div','credwrap');
    s.logos.forEach(l=>w.appendChild(el('span',null,l)));
    sl.appendChild(w);
  }else if(s.t==='cta'){
    sl.appendChild(el('h2',null,s.h));
    sl.appendChild(el('div','body big',s.body));
    sl.appendChild(el('div','brand','<strong style="color:var(--accent)">'+s.action+'</strong>'));
    sl.appendChild(el('div','disclaimer',s.disclaimer));
  }else{
    if(s.h)sl.appendChild(el('h2',null,s.h));
    if(s.body)sl.appendChild(el('div','body big',s.body));
    if(s.list){const u=el('ul');s.list.forEach(li=>u.appendChild(el('li',null,li)));sl.appendChild(u);}
  }
  if(s.t!=='title')sl.appendChild(el('div','pagenum',(i+1)+' / '+S.length));
  deck.appendChild(sl);
});
</script>
</body>
</html>
