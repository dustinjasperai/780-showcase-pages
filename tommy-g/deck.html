<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Losing Your Temper — a masterclass with Tommy Geary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b1a17;        /* dark charcoal ground, from site_scheme:dark */
    --panel:#26241f;     /* warm graphite panel */
    --rule:#3a362c;      /* muted rule */
    --accent:#f5b138;    /* his dominant brand hex (brand.json) */
    --ink:#f6f2e9;       /* warm off-white */
    --muted:#b7b1a3;     /* muted ink */
    --head:'Poppins',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{width:100%}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;border-bottom:1px solid var(--rule);position:relative;scroll-snap-align:start}
  .deck{scroll-snap-type:y proximity}
  .eyebrow{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.04;
    letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(1.6rem,4vw,2.8rem);line-height:1.1}
  .lead{font-size:clamp(1.1rem,2.2vw,1.5rem);color:var(--muted);max-width:40ch;margin-top:1.6rem}
  .big{font-size:clamp(1.8rem,4.6vw,3.2rem);font-family:var(--head);font-weight:600;max-width:20ch;line-height:1.12}
  .ember{width:64px;height:4px;background:var(--accent);border-radius:3px;margin:0 0 2.2rem}
  .grid{display:grid;gap:1.1rem;margin-top:2.2rem;max-width:46rem}
  .row{display:flex;gap:1.1rem;align-items:flex-start;background:var(--panel);
    border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;padding:1.2rem 1.4rem}
  .row .n{font-family:var(--head);font-weight:700;color:var(--accent);font-size:1.3rem;min-width:1.4ch}
  .row h3{font-family:var(--head);font-weight:600;font-size:1.15rem;margin-bottom:.25rem}
  .row p{color:var(--muted);font-size:.98rem}
  .pillar{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:2rem}
  .pillar .tag{font-family:var(--head);color:var(--accent);font-weight:600;font-size:.8rem;
    letter-spacing:.1em;text-transform:uppercase}
  .pillar h2{margin:.5rem 0 1rem}
  ul{list-style:none;margin-top:1rem;max-width:44rem}
  ul li{position:relative;padding-left:1.6rem;margin-bottom:.7rem;color:var(--ink);font-size:1.05rem}
  ul li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;background:var(--accent);
    border-radius:2px}
  .kicker{font-family:var(--head);font-weight:600;color:var(--muted);font-size:1rem;margin-top:2rem}
  .quote{font-family:var(--head);font-weight:600;font-size:clamp(1.5rem,3.6vw,2.4rem);
    max-width:24ch;line-height:1.2}
  .quote span{color:var(--accent)}
  .cta-box{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:2.4rem;
    max-width:40rem}
  .btn{display:inline-block;font-family:var(--head);font-weight:600;background:var(--accent);
    color:#1b1a17;padding:.95rem 1.8rem;border-radius:10px;margin-top:1.6rem;text-decoration:none}
  .disclaimer{color:var(--muted);font-size:.8rem;margin-top:2rem;max-width:42rem;line-height:1.5}
  .pg{position:absolute;right:8vw;bottom:5vh;font-family:var(--head);color:var(--muted);font-size:.78rem}
  .credit h2{margin-bottom:1rem}
  .credit p{color:var(--muted);max-width:44ch;margin-bottom:.8rem;font-size:1.05rem}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Tommy Geary', h1:'Stop Losing Your Temper',
    lead:'The 3 shifts that keep high-achieving men calm, clear, and connected at home.' },

  {t:'who', eyebrow:'Who this is for',
    big:'You bring your A-game to work. Then you go 0 to 100 at home.',
    lead:'For high achievers, executives, and dads who are winning at work and still losing it at bedtime.' },

  {t:'trap', eyebrow:'The trap',
    big:'That fire got you where you are. At home, it is costing you.',
    lead:'The same intensity that drives your results makes your kids flinch and your wife brace. After an outburst or two, respect quietly erodes.' },

  {t:'hook', eyebrow:'The reframe',
    quote:'Anger isn’t your fault. <span>But it is your responsibility.</span>',
    lead:'You did not choose the wiring. You do choose what you do with it. That is the whole difference.' },

  {t:'cost', eyebrow:'Part one: the real problem',
    h2:'Willpower is not the issue',
    lead:'You are not an angry person who needs to try harder. You are a stretched person with no system for the moment the threshold gets crossed.',
    list:['Work stress follows you through the front door','You hit a threshold, then go 0 to 100 in an instant','You apologize, promise to do better, and repeat it next week'] },

  {t:'mech', eyebrow:'Part one: the real problem',
    h2:'What is actually under the anger',
    lead:'Anger is a messenger, not the message. Underneath almost every blow-up is one of two things:',
    list:['A boundary of yours got crossed','A value of yours got stepped on'],
    kicker:'Learn to read the signal and you stop reacting to it.' },

  {t:'frame', eyebrow:'Part two: the method',
    big:'The three pillars of a durable dad.',
    lead:'Everything I coach lives in these three. One informs the next.' },

  {t:'pillar', tag:'Pillar one', h2:'Productivity',
    list:['Develop a clear vision and real priorities','Manage distractions and procrastination','Stop people-pleasing that drains your week'],
    kicker:'A man with margin has something left to give at home.' },

  {t:'pillar', tag:'Pillar two', h2:'Relationships',
    list:['Manage anger and build emotional awareness','Communicate with your spouse with a level head','Live authentically instead of performing'],
    kicker:'Your biggest productivity lever is alignment with your wife.' },

  {t:'pillar', tag:'Pillar three', h2:'Personal energy',
    list:['Find healthier ways to unplug than numbing out','Practice slowing down before the threshold','Protect diet, exercise, and sleep as inputs'],
    kicker:'Calm is a capacity. You build it, you do not summon it.' },

  {t:'shift', eyebrow:'The 3 shifts, up close', h2:'Shift 1: Read what is under it',
    lead:'Before you respond, get curious. Empathy and curiosity tell you which boundary or value just got hit, so you answer the real thing instead of the noise.' },

  {t:'shift', eyebrow:'The 3 shifts, up close', h2:'Shift 2: Neutralize the trigger',
    lead:'Catch the body before the words. Somatic awareness and a deliberate slow-down give you the half-second between stimulus and reaction, which is where all of your power is.' },

  {t:'shift', eyebrow:'The 3 shifts, up close', h2:'Shift 3: Lead with your heart',
    lead:'Steady is not soft. You can be assertive without being a jerk, put your foot down without losing your temper, and still be the calm center of the room.' },

  {t:'picture', eyebrow:'Part three: dad mode on purpose',
    big:'Work mode to dad mode, on purpose.',
    lead:'You shut off the workday at the door. You are present at dinner. The little things stop setting you off, and your kids get a different set of memories of you.' },

  {t:'credit', eyebrow:'Why me',
    h2:'Tommy Geary',
    paras:['I coach dads for a living, and what we do when we are angry is the number one thing the men I work with want to change.',
      'I left a successful but hollow corporate career, went deep in the outdoors, and then trained in emotional processing, somatic awareness, Internal Family Systems, yoga, and coaching so I could help other men do this work.',
      'I am a husband and a father of two. I have had my own toothbrush-across-the-bathroom moment. There is a better way to lead, and this is how I teach it.'] },

  {t:'recap', eyebrow:'The through-line',
    big:'Patience, presence, and putting your foot down.',
    lead:'Three pillars, three shifts, one outcome: a steadier man at home without losing the edge that makes you good.' },

  {t:'isthisyou', eyebrow:'Is this you',
    h2:'If any of this landed',
    list:['You are winning at work and tense at home','You go 0 to 100 faster than you want to admit','You want your kids to remember you steady, not scary'],
    kicker:'Then the next step is a conversation.' },

  {t:'cta', eyebrow:'Your next step',
    h2:'Work with me',
    lead:'If you want help making these shifts stick, let us talk about coaching. We will look at where you are, what is under the anger, and whether my 4-month 1:1 coaching is the right fit for you.',
    btn:'Start the conversation',
    disclaimer:'This masterclass is educational. It is not therapy and it is not a substitute for mental health care. Coaching outcomes vary from person to person and depend on the work you put in. No specific result is promised or guaranteed.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const sec = document.createElement('section');
  sec.className = 'slide';
  let h = '';
  if (s.eyebrow) h += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.t === 'title') { h = `<div class="ember"></div>` + h + `<h1>${s.h1}</h1>`; }
  else if (s.t === 'hook') { h += `<p class="quote">${s.quote}</p>`; }
  else if (s.big) { h += `<p class="big">${s.big}</p>`; }
  else if (s.h2) { h += `<h2>${s.h2}</h2>`; }
  if (s.lead) h += `<p class="lead">${s.lead}</p>`;
  if (s.list) { h += '<ul>' + s.list.map(x => `<li>${x}</li>`).join('') + '</ul>'; }
  if (s.paras) { h += '<div class="credit">' + s.paras.map(p => `<p>${p}</p>`).join('') + '</div>'; }
  if (s.kicker) h += `<p class="kicker">${s.kicker}</p>`;
  if (s.btn) h += `<a class="btn" href="#">${s.btn}</a>`;
  if (s.disclaimer) h += `<p class="disclaimer">${s.disclaimer}</p>`;
  if (s.t === 'pillar') { sec.innerHTML = `<div class="pillar"><div class="tag">${s.tag}</div><h2>${s.h2}</h2>` +
    (s.list ? '<ul>' + s.list.map(x => `<li>${x}</li>`).join('') + '</ul>' : '') +
    (s.kicker ? `<p class="kicker">${s.kicker}</p>` : '') + `</div><div class="pg">${i+1} / ${S.length}</div>`; deck.appendChild(sec); return; }
  if (s.t === 'cta') { sec.innerHTML = `<div class="cta-box">` + h + `</div><div class="pg">${i+1} / ${S.length}</div>`; deck.appendChild(sec); return; }
  h += `<div class="pg">${i+1} / ${S.length}</div>`;
  sec.innerHTML = h;
  deck.appendChild(sec);
});
</script>
</body>
</html>
