<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Predictably Close 10 Loans a Month — Loan Officer Leadership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf6; --panel:#ffffff; --cream:#e5dfce; --ink:#1a1a1a;
    --navy:#1b3a6b; --deep:#0e2040; --rule:#d9dfe8; --accent:#c9a84c; --slate:#5c6b80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  h1,h2,h3,.eyebrow{font-family:'Inter Tight',sans-serif;color:var(--deep);letter-spacing:-.01em}
  .eyebrow{font-size:.82rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:1.3rem}
  h1{font-size:clamp(2.2rem,5.4vw,4.1rem);font-weight:800;line-height:1.04}
  h2{font-size:clamp(1.7rem,3.8vw,2.9rem);font-weight:700;line-height:1.1}
  h3{font-size:clamp(1.15rem,2vw,1.5rem);font-weight:700;color:var(--navy)}
  p{font-size:clamp(1.02rem,1.5vw,1.28rem);max-width:60ch;color:#30363f}
  p.lead{font-size:clamp(1.2rem,2vw,1.6rem);color:var(--ink)}
  .sub{margin-top:1.3rem}
  .big{font-size:clamp(2.6rem,6vw,4.6rem);font-weight:800;color:var(--deep);line-height:1.02}
  .navybg{background:var(--deep)}
  .navybg h1,.navybg h2,.navybg h3,.navybg .big{color:#ffffff}
  .navybg p{color:#cdd6e4}
  .navybg .eyebrow,.navybg .kicker{color:var(--accent)}
  .rule{width:64px;height:4px;background:var(--accent);border:0;margin:1.5rem 0}
  ul{list-style:none;margin-top:1.3rem;max-width:62ch}
  li{font-size:clamp(1.02rem,1.6vw,1.3rem);padding:.6rem 0 .6rem 2.1rem;position:relative;color:#30363f;border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:1.15rem;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .navybg li{color:#cdd6e4;border-color:#20365e}
  .pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:1.7rem;max-width:70ch}
  .pill{background:rgba(255,255,255,.04);border:1px solid #20365e;border-left:4px solid var(--accent);padding:1rem 1.25rem;border-radius:4px}
  .pill .n{font-family:'Inter Tight';font-weight:800;color:var(--accent);font-size:.9rem;letter-spacing:.1em}
  .pill h3{margin:.15rem 0 .3rem;color:#fff}
  .pill p{font-size:.96rem;color:#cdd6e4}
  .kicker{font-family:'Inter Tight';font-weight:700;color:var(--navy);font-size:1rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.8rem}
  .foot{position:absolute;left:9vw;bottom:4vh;font-size:.78rem;color:var(--slate);letter-spacing:.04em}
  .navybg .foot{color:#8ea0bb}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:1.5rem 1.7rem;margin-top:1.3rem;max-width:60ch}
  .src{font-size:.78rem;color:var(--slate);margin-top:1rem}
  .disclaimer{font-size:.84rem;color:#8ea0bb;margin-top:1.8rem;max-width:62ch;border-top:1px solid #20365e;padding-top:1.1rem}
  .cta-btn{display:inline-block;margin-top:1.5rem;background:var(--accent);color:var(--deep);font-family:'Inter Tight';font-weight:700;
    padding:.9rem 1.8rem;border-radius:5px;text-decoration:none;font-size:1.05rem}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', navy:true, eyebrow:"Live Masterclass · Loan Officer Leadership",
   h:"How to Predictably Close 10 Loans a Month",
   lead:"Without more leads, lower rates, or cold-calling agents.",
   sub:"One hour, live, with Steve Kyles. 24 years in the mortgage business, host of the Loan Officer Leadership Podcast.",
   foot:"It's not the rates. It's not the leads. So what is it?"},

  {t:'who', eyebrow:"This is for you if",
   h:"You are working hard and the month still feels like a gamble.",
   bullets:[
     "You close two loans or fewer in most months.",
     "A good month is almost always followed by a slow one.",
     "You are tired of buying leads that go nowhere.",
     "You have started to believe the rates are the problem."]},

  {t:'reframe', navy:true, eyebrow:"The reframe",
   big:"It's not the rates. It's not the leads.",
   sub:"Same market. Same rates. Some loan officers are still closing every single month, and they are not working harder than you. The difference is what they do, and the order they do it in."},

  {t:'stat', eyebrow:"The gap, in one number",
   h:"7 in 10 loan officers close two loans or fewer a month.",
   lead:"The top 4% close ten or more. Same market. Same rates.",
   card:"If you fixed just one of the things that separate those two groups, how many more loans a month is that for you? One? Two? Now multiply it by twelve. That is what the gap is costing you every year.",
   src:"Source: ModelMatch, loan officers with at least one closed loan in the trailing 12 months, 2026."},

  {t:'body', kicker:"Part One",
   h:"Why your month feels like a roller coaster.",
   sub:"Most of us were taught to fix a slow month with more. More calls. More leads. More hours. More spend. So when production dips, you pour in more effort, close a few, and the cycle starts over.",
   sub2:"The trouble is that more is not a system. It is a reaction. And a business built on reaction can never tell you what next month looks like."},

  {t:'body', kicker:"Part One",
   h:"You are building on things you do not control.",
   sub:"Rates move. Lead quality swings. The market shifts under you. When your production depends on those, your income depends on them too, and no amount of effort makes it predictable.",
   lead2:"Predictable production comes from inputs you actually control: who you decide to be, the math of your week, the database you already have, and the calls you already could make."},

  {t:'pillars', navy:true, eyebrow:"The system",
   h:"The Predictable Income Model",
   sub:"A repeatable way to make next month decided before it starts. Not motivation. A handful of right things, run in the right order, every single week.",
   pills:[
     {n:"01", h:"Identity", p:"Who you decide to be before the month begins."},
     {n:"02", h:"The Math", p:"The conversations this week that equal next month's closings."},
     {n:"03", h:"The Database", p:"Your next loans are already in it."},
     {n:"04", h:"The Calendar", p:"A few right things, in the right order, every week."},
     {n:"05", h:"The First Call Framework", p:"The conversation that turns a contact into an application."},
     {n:"06", h:"The Weekly Huddle", p:"The rhythm and accountability that keep it running."}]},

  {t:'body', kicker:"Pillar 01 · Identity",
   h:"Decide the number before the month starts.",
   sub:"The loan officers who close predictably do not wait to see how a month goes. They decide who they are and what they produce first, and then they build the week that delivers it. Identity is not a pep talk. It is the decision that everything else hangs on."},

  {t:'body', kicker:"Pillar 02 · The Math",
   h:"You cannot hit a number you have never counted.",
   sub:"There is a simple math to your production: how many conversations this week turn into applications, and how many applications turn into closings. Once you know your numbers, next month stops being a mystery and becomes a calculation you run on purpose."},

  {t:'body', kicker:"Pillar 03 · The Database",
   h:"Your next loans are already in your database.",
   sub:"Buying more leads feels like progress, but the people most likely to do a loan with you are the ones who already know you. The relationships you have built are the steady pipeline you have been missing. The work is not finding new strangers. It is working the people you already have, in order."},

  {t:'body', kicker:"Pillar 04 · The Calendar",
   h:"Build the week around what actually closes loans.",
   sub:"Busy is not the same as productive. Rate quotes, call-backs, chasing appraisals: that is a full calendar and an empty pipeline. The calendar pillar puts the few activities that actually produce loans first, every week, so the important work happens before the day fills up with noise."},

  {t:'body', kicker:"Pillar 05 · The First Call Framework",
   h:"What to say so it sounds like you and still gets the commitment.",
   sub:"A script read word for word sounds like a script, and people hear it. The First Call Framework is how to open the call back to a warm contact so it sounds like a real conversation, and still moves to a clear next step and an application. It is the difference between just checking in and a loan in process."},

  {t:'body', kicker:"Pillar 06 · The Weekly Huddle",
   h:"What keeps the system running when motivation fades.",
   sub:"A system you run alone is a system you eventually stop running. The weekly rhythm, the huddle, and the accountability around it are what turn five good days into a habit that holds through every kind of market. This is the pillar that makes the other five permanent."},

  {t:'who', navy:true, kicker:"Part Three",
   h:"What your next 90 days can look like.",
   bullets:[
     "The roller coaster stops. A good month is not followed by a slow one.",
     "Your phone rings when rates move, because your pipeline is built on relationships, not headlines.",
     "The last week of the month is calm. You know how it ends before it starts.",
     "More loans in less time, and your evenings back."]},

  {t:'body', eyebrow:"Why listen to me",
   h:"I teach this because I run it.",
   sub:"24 years in the mortgage business. 489 episodes of the Loan Officer Leadership Podcast. More than a thousand loan officers coached. In 2025 I sat down at a cold desk with no pipeline and rebuilt my own production on this exact model. No theory and no motivation speech. Just what works, and what to do first.",
   lead2:"My rule through every hard season has been the same: get better, not bitter."},

  {t:'cta', navy:true, eyebrow:"Your next step",
   h:"Pick the one or two things to fix first, and start Monday.",
   sub:"If today showed you the gap, the next step is the system that closes it. Start with the 5-Day Predictable Producer Challenge, or book a call and we will map your next 90 days together.",
   cta:"Start the 5-Day Challenge",
   cta_href:"https://loanofficerleadership.com/",
   disclaimer:"This masterclass is educational. It shares the methods and systems Steve Kyles teaches loan officers. It is not a guarantee of income or results. Your results depend on your market, your effort, and your execution. Nothing here is financial, legal, or compliance advice."}
];

function esc(x){return (x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const deck = document.getElementById('deck');
S.forEach(s=>{
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.navy ? ' navybg' : '');
  let html = '';
  if(s.eyebrow) html += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.kicker) html += `<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.big) html += `<p class="big">${esc(s.big)}</p>`;
  if(s.h) html += `<h2>${esc(s.h)}</h2>`;
  if(s.big||s.h) html += `<hr class="rule">`;
  if(s.lead) html += `<p class="lead sub">${esc(s.lead)}</p>`;
  if(s.sub) html += `<p class="sub">${esc(s.sub)}</p>`;
  if(s.sub2) html += `<p class="sub">${esc(s.sub2)}</p>`;
  if(s.lead2) html += `<p class="lead sub">${esc(s.lead2)}</p>`;
  if(s.card) html += `<div class="card"><p>${esc(s.card)}</p></div>`;
  if(s.bullets){ html += '<ul>'; s.bullets.forEach(b=>html+=`<li>${esc(b)}</li>`); html += '</ul>'; }
  if(s.pills){ html += '<div class="pillars">'; s.pills.forEach(p=>html+=`<div class="pill"><div class="n">${esc(p.n)}</div><h3>${esc(p.h)}</h3><p>${esc(p.p)}</p></div>`); html += '</div>'; }
  if(s.src) html += `<p class="src">${esc(s.src)}</p>`;
  if(s.cta) html += `<a class="cta-btn" href="${esc(s.cta_href)}">${esc(s.cta)}</a>`;
  if(s.disclaimer) html += `<p class="disclaimer">${esc(s.disclaimer)}</p>`;
  if(s.foot) html += `<div class="foot">${esc(s.foot)}</div>`;
  sec.innerHTML = html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
