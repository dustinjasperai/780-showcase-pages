<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Studio Designed on Purpose | A Masterclass with Deborah Laws</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#232e26;        /* deepened sage, from brand #3d493a */
    --panel:#2d3b31;     /* sage panel */
    --rule:#3d493a;      /* brand dominant sage, verbatim */
    --ink:#faf4f6;       /* brand blush off-white, verbatim */
    --ink-soft:#c4ccc0;  /* muted blush-sage */
    --ink-dim:#8f9a8b;   /* dim sage-grey */
    --accent:#bd7e65;    /* brand terracotta, verbatim */
    --plum:#50305f;      /* brand plum, verbatim */
  }
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
  #deck{width:100vw;height:100vh;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:8vh 10vw;opacity:0;transition:opacity .45s ease}
  .slide.active{display:flex;opacity:1}
  /* architectural rule-line motif: a fine framing line, vision/architecture/systems */
  .slide::before{content:"";position:absolute;left:10vw;top:7vh;width:56px;height:2px;background:var(--accent);opacity:.9}
  .slide::after{content:"";position:absolute;left:10vw;right:10vw;bottom:7vh;height:1px;
    background:linear-gradient(90deg,var(--rule),transparent)}
  .kicker{font-family:'Inter',sans-serif;font-size:clamp(11px,1.2vw,14px);font-weight:600;
    text-transform:uppercase;letter-spacing:.2em;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Poppins',sans-serif;font-weight:600;line-height:1.14;letter-spacing:-.01em}
  .body{font-family:'Inter',sans-serif;color:var(--ink-soft);line-height:1.6;
    font-size:clamp(16px,1.5vw,21px);max-width:60ch;margin-top:22px;font-weight:400}
  .sub{font-family:'Inter',sans-serif;color:var(--ink);font-size:clamp(15px,1.4vw,19px);
    margin-top:16px;max-width:58ch}
  /* title */
  .t-title h1{font-size:clamp(32px,5.6vw,68px);font-weight:700;max-width:18ch}
  .t-title .sub{color:var(--ink-soft);margin-top:26px}
  .brandline{margin-top:34px;font-family:'Inter',sans-serif;font-size:14px;letter-spacing:.03em;
    color:var(--ink-dim)}
  .brandline b{color:var(--accent);font-weight:600}
  /* section dividers */
  .t-section{justify-content:center}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:clamp(13px,1.4vw,16px);font-weight:600;
    letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  .t-section h1{font-size:clamp(30px,4.8vw,58px);font-weight:700;max-width:20ch}
  .t-section .rule{width:120px;height:3px;background:var(--accent);margin-top:28px;border-radius:2px}
  /* normal content */
  .t-normal h1{font-size:clamp(24px,3.4vw,42px);max-width:22ch}
  /* dark reframe */
  .t-dark{background:var(--panel)}
  .t-dark h1{font-size:clamp(26px,3.8vw,48px);font-weight:600;max-width:22ch;color:var(--ink)}
  .t-dark::before{background:var(--plum);opacity:1}
  /* pillar tag */
  .pillar{display:inline-flex;align-items:baseline;gap:14px;margin-bottom:8px}
  .pillar .letter{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(40px,6vw,80px);
    color:var(--accent);line-height:.9}
  .pillar .word{font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(20px,2.4vw,30px);
    color:var(--ink);letter-spacing:.02em}
  .starsrow{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
  .starsrow span{font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;
    padding:7px 14px;border:1px solid var(--rule);border-radius:999px;color:var(--ink-soft)}
  .starsrow span.on{color:var(--bg);background:var(--accent);border-color:var(--accent)}
  /* cta */
  .t-cta h1{font-size:clamp(28px,4.2vw,52px);font-weight:700;max-width:20ch}
  .chips{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}
  .chip{font-family:'Inter',sans-serif;font-weight:600;font-size:clamp(14px,1.4vw,17px);
    padding:14px 24px;border-radius:10px;background:var(--accent);color:var(--bg)}
  .chip.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink)}
  .disc{margin-top:36px;font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-dim);
    max-width:60ch;line-height:1.5;font-style:italic}
  /* chrome */
  #ui{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06);z-index:20}
  #bar{height:100%;width:0;background:var(--accent);transition:width .35s ease}
  #count{position:fixed;right:18px;bottom:16px;font-family:'Inter',sans-serif;font-size:12px;
    letter-spacing:.08em;color:var(--ink-dim);z-index:20}
  #nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:20}
  #nav button{width:38px;height:30px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);
    border-radius:7px;cursor:pointer;font-size:15px}
  #nav button:hover{border-color:var(--accent);color:var(--accent)}
  #hint{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);font-family:'Inter',sans-serif;
    font-size:12px;color:var(--ink-dim);z-index:20;transition:opacity .4s}
  @media(max-width:640px){.slide{padding:10vh 8vw}.slide::before{left:8vw}.slide::after{left:8vw;right:8vw}}
</style>
</head>
<body>
<div id="deck"></div>
<div id="ui"><div id="bar"></div></div>
<div id="count"></div>
<div id="hint">Use arrow keys or click to move through</div>
<div id="nav"><button id="prev">&#8249;</button><button id="next">&#8250;</button></div>

<script>
const S=[
 {t:'title',title:'The Studio Designed on Purpose',
  sub:'How to build a dance studio that runs on systems and leadership, so it grows without running you into the ground.',
  brand:true},

 {t:'normal',k:'Who this is for',title:'For the studio owner who is doing everything, and still feels behind.',
  body:'You teach, you cover the front desk, you chase the late payments, you write the newsletter at 11pm. The studio is full of life. It is also full of you. This hour is for the owner who is ready to stop being the only thing holding it together.'},

 {t:'normal',k:'The trap',title:'More students will not fix a studio that depends on you.',
  body:'When the answer to every good year is "work more hours," growth just buys you a busier version of the same problem. Another class means another thing only you can run. The ceiling was never enrollment. The ceiling is you.'},

 {t:'dark',title:'Your studio does not have a growth problem. It has a design problem.'},

 {t:'section',idx:'Part One',title:'Why Passion Is Not a System'},
 {t:'normal',k:'The honest starting point',title:'Successful studios are built, not just loved.',
  body:'Hard work and passion get a studio open and keep it alive. They do not make it stable. A studio that lasts needs vision, architecture, systems, and a leader who keeps learning. Passion is the fuel. It was never meant to be the engine.'},
 {t:'normal',k:'The cost of running on you',title:'When it all lives in your head, nothing is safe.',
  body:'If the enrollment process, the retention plan, and the team standards only exist because you remember them, then a sick week, a burnt-out term, or a growth spurt can undo months of work. What is not written down cannot be handed off, protected, or improved.'},
 {t:'dark',title:'A studio built on the owner has one true limit. The owner.'},

 {t:'section',idx:'Part Two',title:'The S.T.A.R.S Method'},
 {t:'normal',k:'The framework',title:'Five parts that turn a studio into a business.',
  body:'S.T.A.R.S is the operating system I teach inside Dance Business Lab. Each part is a lever you can pull on purpose instead of hoping the term goes well. Together they let the studio run on structure, not on adrenaline.',
  stars:['S','T','A','R','S']},
 {t:'normal',title:'Strategy',pillar:'S',
  body:'Plan the year, protect your time, and grow the numbers on purpose. Strategy is the difference between reacting to whatever the term throws at you and deciding, in advance, what this year is actually for.'},
 {t:'normal',title:'Team',pillar:'T',
  body:'Lead yourself first, then the business, then the people. A studio scales the moment your teachers can carry classes and culture without you standing in every room. That starts with clear standards, not with hiring more hands.'},
 {t:'normal',title:'Attract',pillar:'A',
  body:'Turn enrollment into a system instead of a seasonal panic. Visibility, a steady flow of inquiries, and consistency mean new families arrive all year, not just in September. You stop hoping the next intake fills itself.'},
 {t:'normal',title:'Retention',pillar:'R',
  body:'Keep the families you already worked so hard to win. Retention planning, real numbers you actually watch, multi-class enrollment, and a culture families do not want to leave. Kept students are the cheapest growth a studio ever gets.'},
 {t:'normal',title:'Systems',pillar:'S',
  body:'Reduce the admin, automate the repeatable, and give the profit room to grow. Systems are what let you step back without the whole thing wobbling. This is where the calm, and the margin, finally show up.'},
 {t:'dark',title:'Five levers. One operating system. A studio that finally runs on structure, not on stamina.'},

 {t:'section',idx:'Part Three',title:'Business Happiness, By Design'},
 {t:'normal',k:'Time and freedom',title:'A studio you can step away from without it slipping.',
  body:'The point of the systems is not more admin. It is a business that keeps its standards when you take a real weekend, a proper holiday, or a day to just teach the class you love. Freedom is the return on the work you put in now.'},
 {t:'normal',k:'Income and impact',title:'Calm profit, not just a fuller timetable.',
  body:'Profit that comes from margin and retention is steadier than profit chased through endless new sign-ups. A studio designed on purpose earns more and asks less of you, which is the whole point of running one in the first place.'},
 {t:'normal',k:'Why me',title:'I built this from inside the industry, not beside it.',
  body:'I am Deborah Laws. I am an ISTD examiner, the author of a number one bestselling dance business planner, host of The Ultimate Dance Business Podcast, and I mentor a global community of over 150 studio owners through Dance Business Lab. The S.T.A.R.S Method is the system I use with them every day.'},

 {t:'section',idx:'Your next step',title:'Design Yours On Purpose'},
 {t:'cta',title:'Book your Evolution Call and map your first 90 days.',
  chips:['Book your Evolution Call','Follow The Ultimate Dance Business Podcast'],
  disc:'Educational content for dance studio owners. No income, revenue, or business result is guaranteed. Results vary by studio, owner, and market.'},
];

const deck=document.getElementById('deck');
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`;
  } else if(s.pillar){
    h+=`<div class="pillar"><span class="letter">${s.pillar}</span><span class="word">${s.title}</span></div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
  } else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.stars){ h+=`<div class="starsrow">`+s.stars.map((x,i)=>`<span class="${i===0?'on':''}">${x}</span>`).join('')+`</div>`; }
    if(s.brand) h+=`<div class="brandline">Dance Business <b>Lab</b> &middot; Deborah Laws</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map((c,i)=>`<div class="chip ${i>0?'ghost':''}">${c}</div>`).join('')+`</div>`;
  }
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
document.getElementById('deck').addEventListener('click',()=>go(cur+1));
go(0);
</script>
</body>
</html>
