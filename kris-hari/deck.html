<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tech Sales Climb — a live masterclass with Higher Levels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#151617; --panel:#1f2022; --rule:#2d2f31; --accent:#017aff; --ink:#eef0f2; --muted:#a6abb0;
    --display:'Familjen Grotesk',system-ui,sans-serif; --body:'Roboto',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0d0e;color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:16px;padding:52px 48px;margin:0 0 20px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:20px;right:24px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .k{font-family:var(--display);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.02em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.1;letter-spacing:-.01em;margin-bottom:16px}
  p{font-size:19px;color:#d4d8db;margin-bottom:14px;max-width:62ch}
  .big{font-size:27px;color:var(--ink);line-height:1.35}
  .accent{color:var(--accent)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;color:#d4d8db;padding:12px 0 12px 42px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li .rung{position:absolute;left:0;top:12px;font-family:var(--display);font-weight:700;color:var(--accent);font-size:17px}
  li strong{color:var(--ink);font-weight:600}
  .ladder{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .ladder .step{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px}
  .ladder .step.top{border-color:var(--accent)}
  .ladder .step b{font-family:var(--display);display:block;color:var(--ink);font-size:20px;margin-bottom:4px}
  .ladder .step span{font-size:14px;color:var(--muted)}
  .section-slide{background:linear-gradient(180deg,#171a1d,#121314)}
  .section-slide h1{font-size:40px}
  .cta-slide{background:linear-gradient(160deg,#10243f,#141516);border-color:#1d3a5c}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:70ch;line-height:1.5}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', k:'A live masterclass with Higher Levels', h:'The Tech Sales <span class="accent">Climb</span>', html:`<p class="big">How to break into tech sales with no degree and no sales background, land the SDR role, and keep climbing to a six-figure AE seat.</p><p>Taught live by reps who still carry quota.</p>`},

  {t:'content', k:'Who this is for', h:'If you want in, and then up', html:`<ul><li><span class="rung">01</span><strong>The career-changer</strong> with no tech background who keeps hearing "tech sales" and does not know where to start.</li><li><span class="rung">02</span><strong>The new SDR</strong> who got in and now wants the AE promotion, not another year of cold calls.</li><li><span class="rung">03</span><strong>The rep who is stuck</strong> doing the activity but not seeing the climb.</li></ul>`},

  {t:'content', k:'The trap', h:'Everyone sells the door. Nobody shows the stairs.', html:`<p class="big">You can find a hundred people promising to get you a tech sales job fast.</p><p>So you grind for the offer, you get in, and then the real question lands: now what? Nobody prepared you for the job you actually have, or the one you want next.</p>`},

  {t:'title', k:'The reframe', h:'Getting hired is the <span class="strike">finish line</span>', html:`<p class="big">It is the starting line. The money, the freedom, the title you actually want, all of it sits one or two levels above where you land. This session is about the whole climb.</p>`},

  {t:'section', k:'Part One', h:'Why most break-in advice quietly fails'},

  {t:'content', k:'Part One', h:'Speed without a system', html:`<p>The fast-job-in-35-days pitch optimizes for one thing: an offer, any offer. It gets you a seat and leaves you there.</p><p>What it skips: picking the right company, ramping fast enough to survive the first quarter, and building the case for your next promotion from day one. Those are the parts that decide whether tech sales becomes a career or a six-month detour.</p>`},

  {t:'content', k:'Part One', h:'Three gaps that stall people', html:`<ul><li><span class="rung">1</span><strong>The wrong first seat.</strong> A bad territory or a broken sales org can sink a great rep.</li><li><span class="rung">2</span><strong>No ramp plan.</strong> The first 90 days decide your reputation; most people improvise them.</li><li><span class="rung">3</span><strong>No promotion case.</strong> The AE jump goes to whoever built the evidence, not whoever waited.</li></ul>`},

  {t:'section', k:'Part Two', h:'The path: break in, then climb'},

  {t:'content', k:'Part Two · The break-in path', h:'Seven steps to the SDR seat', html:`<ul><li><span class="rung">1</span><strong>Understand the SDR role</strong> and what tech sales actually rewards.</li><li><span class="rung">2</span><strong>Essential entry-level skills</strong> so you sound like a rep, not an applicant.</li><li><span class="rung">3</span><strong>Resume and LinkedIn</strong> rebuilt to pass the real screen.</li><li><span class="rung">4</span><strong>Pick the right companies</strong>, not just the ones hiring.</li><li><span class="rung">5</span><strong>Land interviews</strong> through outreach that works on hiring managers.</li><li><span class="rung">6</span><strong>Crush the process</strong>, mock calls and all.</li><li><span class="rung">7</span><strong>Negotiate your pay</strong> instead of taking the first number.</li></ul>`},

  {t:'content', k:'Part Two · The climb', h:'The ascension: SDR to AE to top performer', html:`<p>The break-in path gets you in. The climb is a separate skill set, and it is the part Higher Levels is built around.</p><div class="ladder"><div class="step"><b>SDR</b><span>Ramp fast, hit activity, learn the product and the buyer.</span></div><div class="step"><b>AE</b><span>Own pipeline, run discovery, close. The promotion you plan for from day one.</span></div><div class="step top"><b>Top AE</b><span>Enterprise deals, President's Club, the seat you actually came for.</span></div></div>`},

  {t:'content', k:'Part Two · The engine room', h:'The skills that move you up a level', html:`<ul><li><span class="rung">A</span><strong>Territory planning</strong> so your pipeline is a plan, not luck.</li><li><span class="rung">B</span><strong>Cold calling and prospecting</strong> that books qualified meetings, not voicemails.</li><li><span class="rung">C</span><strong>The SDR to AE case</strong>, built deliberately: the metrics, the relationships, the timing.</li></ul>`},

  {t:'content', k:'Part Two · Mindset', h:'Staying sane while you climb', html:`<p class="big">Tech sales is a grind of rejection. The reps who climb are not the ones who feel it least; they are the ones with a system for resetting fast.</p><p>We teach the resilience habits as explicitly as the scripts, because burnout ends more careers than quota does.</p>`},

  {t:'section', k:'Part Three', h:'What the climb looks like in practice'},

  {t:'content', k:'Part Three', h:'A path you can see', html:`<p>From outside, tech sales looks like one leap. From inside, it is a sequence of small, visible levels, each with a skill to learn and a piece of evidence to build.</p><p>When you can see the next level, the work stops feeling random. You are not just hoping for a promotion; you are completing the checklist that earns it.</p>`},

  {t:'content', k:'Part Three · Why learn it here', h:'Taught by reps still in the seat', html:`<p>Your instructors are not retired. They are active and recent President's Club SDRs and AEs who still carry quota at fast-growing software companies.</p><p>The scripts, the territory plans, and the promotion cases are the ones working right now, delivered live three times a week so you can ask about your real deal, your real interview, your real manager.</p>`},

  {t:'content', k:'Recap', h:'The whole climb, in one path', html:`<ul><li><span class="rung">01</span>Break in with a seven-step path, not a lucky application.</li><li><span class="rung">02</span>Ramp and survive the first quarter on purpose.</li><li><span class="rung">03</span>Build the AE promotion case from day one.</li><li><span class="rung">04</span>Keep climbing to the top-performer seat you came for.</li></ul>`},

  {t:'cta', k:'Your next step', h:'Come climb with us', html:`<p class="big">Join Tech Sales Ascension and get the full path, the live weekly mentoring, and the instructors who are still in the seat.</p><p>Bring the role you want. We will show you the levels between here and there.</p><p class="disc">Educational content only. Higher Levels does not guarantee a job, a salary, a promotion, or any specific income or result. Outcomes vary and depend on your effort, your market, and factors outside anyone's control.</p>`}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  let cls='slide';
  if(s.t==='section') cls+=' section-slide';
  if(s.t==='cta') cls+=' cta-slide';
  el.className=cls;
  const num=`<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  const k=s.k?`<div class="k">${s.k}</div>`:'';
  const h=s.h?(s.t==='title'||s.t==='cta'?`<h1>${s.h}</h1>`:`<h2>${s.h}</h2>`):'';
  el.innerHTML=num+k+h+(s.html||'');
  deck.appendChild(el);
});
</script>
</body>
</html>
