<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Luxury Framework - The Level Up Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241d19;        /* their dominant brand hex (espresso ground) */
    --panel:#2e2621;     /* derived lift of the ground */
    --deep:#1a1512;      /* derived deeper shade */
    --accent:#5b4f44;    /* their button hex (taupe) */
    --ink:#efe7dd;       /* warm cream neutral, readable on espresso */
    --muted:#b6a996;     /* muted warm neutral */
    --display:'Playfair Display', Georgia, serif;
    --body:'Open Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--deep);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    background:var(--bg);
    border:1px solid #3a2f28;
    border-radius:10px;
    padding:64px 58px;
    margin:0 0 22px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:58px;top:40px;width:46px;height:1px;background:var(--accent);opacity:.9}
  .k{font-family:var(--body);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--muted);margin-bottom:26px}
  h1{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1}
  .s{font-family:var(--display);font-style:italic;font-weight:400;font-size:23px;color:var(--muted);margin-top:20px;max-width:30ch}
  p.b{font-size:19px;line-height:1.6;color:var(--ink);margin-top:22px;max-width:52ch}
  ul{list-style:none;margin-top:26px}
  ul li{font-size:19px;line-height:1.5;padding:14px 0 14px 30px;border-top:1px solid #3a2f28;position:relative;max-width:48ch}
  ul li:first-child{border-top:none}
  ul li::before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;border:1px solid var(--accent);border-radius:50%}
  .note{margin-top:30px;font-size:13px;line-height:1.5;color:var(--muted);max-width:56ch;font-family:var(--body)}
  .num{position:absolute;right:54px;bottom:40px;font-family:var(--display);font-size:15px;color:#4a3f36}
  .cta h1{font-size:50px}
  .cta{background:var(--panel)}
  @media(max-width:680px){.slide{padding:40px 26px;min-height:420px}h1{font-size:38px}.cta h1{font-size:34px}h2{font-size:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', k:'The Level Up Co.', h:'The Luxury Framework', s:'How wedding photographers and filmmakers break into the high-end market', note:'A live masterclass with Taylor Petrinovich and Kelley Gilster'},
  {t:'promise', k:'What you will walk away with', h:'A clear path into luxury', items:['Why talent alone does not book luxury weddings','The three pillars that move you into the high-end tier','The referral engine that puts you in front of luxury couples']},
  {t:'audience', k:'Who this is for', h:'You are good, and you are busy', items:['Shooting 25 or more weddings a year','Booked, but priced like everyone else','Ready for fewer weddings and more income']},
  {t:'trap', k:'The trap', h:'The commodity middle', s:'More weddings, more hours, the same prices.', b:'Volume is the only lever the middle of the market gives you, and volume is exactly what burns talented creatives out.'},
  {t:'reframe', k:'The reframe', h:'Luxury is not a better photo', b:'The high-end market does not buy megapixels or more coverage. It buys trust, taste, and the people who vouch for you. That is a different game than the one most of us learned.'},
  {t:'part', k:'Part one', h:'Why talent does not book luxury', s:'The positioning gap'},
  {t:'point', h:'Luxury couples never see you', b:'They are not searching the way everyone else does. They are handed a short list by their planner and their venue. If you are not on that list, your work is never even considered, no matter how good it is.'},
  {t:'part', k:'Part two', h:'The Luxury Framework', s:'The three pillars we teach'},
  {t:'pillar', k:'Pillar one', h:'Luxury positioning', b:'Who the luxury couple actually is, what they buy on, and how to craft a brand and portfolio that signals the tier, even before you have shot a luxury wedding.'},
  {t:'pillar', k:'Also inside pillar one', h:'Brand and portfolio', b:'Crafting a high-end brand and curating a luxury portfolio even without luxury experience, so your work looks the part before the bookings catch up to it.'},
  {t:'pillar', k:'Pillar two', h:'Finding your tribe', b:'The wedding-planner referral engine. How to build real, reciprocal relationships with the planners and venues who gate the high end, so you become the vendor they recommend by name.'},
  {t:'pillar', k:'Pillar three', h:'Pricing and proposals', b:'How to raise prices the right way, build proposals that justify premium fees, and run a booking process that converts luxury inquiries instead of scaring them off.'},
  {t:'point', k:'The booking room', h:'Where most deals are lost', b:'The luxury inquiry is won or lost in the first reply and the proposal. We walk through the exact booking process that holds the premium instead of discounting it away.'},
  {t:'point', k:'It compounds', h:'One planner changes a season', b:'A single high-end planner relationship can reshape a whole year of bookings. A handful of them replaces the volume grind entirely.'},
  {t:'part', k:'Part three', h:'What it looks like', s:'Fewer weddings, chosen on purpose'},
  {t:'point', h:'Ten, not twenty-five', b:'Ten luxury weddings can out-earn twenty-five mid-market ones, with half the shoots and a calendar you actually get to choose.'},
  {t:'whyme', k:'Why learn this from us', h:'We shoot this tier', items:['Taylor raised her own weddings from $4,500 to $18,000 in three years','Kelley is a decade-plus luxury filmmaker and the creator of Illume LUTs','280-plus episodes of the Level Up podcast with the wedding-creative community']},
  {t:'point', k:'The method is teachable', h:'A system, not a personality', b:'Everything here is a repeatable process. It works whether you shoot film or photo, in a major market or a small one.'},
  {t:'cta', k:'Your next step', h:'Come build your luxury path with us', s:'Join us inside The Level Up Co. and put the Luxury Framework to work in your own business.', note:'This masterclass is educational only. Nothing here is a guaranteed result or guaranteed income. Results vary by effort, market, and execution.'}
];
const deck=document.getElementById('deck');
S.forEach(function(sl,i){
  const el=document.createElement('section');
  el.className='slide'+(sl.t==='cta'?' cta':'');
  let html='';
  if(sl.k) html+='<div class="k">'+sl.k+'</div>';
  if(sl.h) html+=(sl.t==='title'||sl.t==='cta')?'<h1>'+sl.h+'</h1>':'<h2>'+sl.h+'</h2>';
  if(sl.s) html+='<div class="s">'+sl.s+'</div>';
  if(sl.b) html+='<p class="b">'+sl.b+'</p>';
  if(sl.items){html+='<ul>';sl.items.forEach(function(it){html+='<li>'+it+'</li>';});html+='</ul>';}
  if(sl.note) html+='<div class="note">'+sl.note+'</div>';
  html+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
