<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The RiskAbility Factor — a masterclass with Tom LeNoble</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef4f9; --panel:#f7fbfe; --rule:#d5e2ec;
  --accent:#3fa6df; --deep:#1f6690; --ink:#151515; --muted:#51606d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Open Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
.slide{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:16px;
  aspect-ratio:16/9;margin:20px 0;padding:58px 64px;display:flex;flex-direction:column;
  box-shadow:0 10px 34px rgba(31,102,144,.07);overflow:hidden}
.kick{font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
h1{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
h2{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:38px;line-height:1.12}
.lead{font-size:23px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:44ch}
.big{font-family:'Spectral',Georgia,serif;font-size:58px;line-height:1.06;font-weight:600}
.big .a{color:var(--accent)}
.part{justify-content:center}
.part .no{font-family:'Spectral',serif;font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:var(--deep);font-weight:600;margin-bottom:14px}
ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
li{position:relative;padding-left:40px;font-size:22px;line-height:1.4;max-width:48ch}
li::before{content:'';position:absolute;left:0;top:9px;width:18px;height:18px;border-radius:5px;border:2.4px solid var(--accent)}
li.on::before{background:var(--accent)}
.cols{display:flex;gap:28px;margin-top:30px}
.col{flex:1;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:26px}
.col .t{font-family:'Spectral',serif;font-size:24px;font-weight:600;color:var(--deep);margin-bottom:10px}
.col p{font-size:19px;line-height:1.45;color:var(--muted)}
.move{display:flex;align-items:baseline;gap:20px}
.move .n{font-family:'Spectral',serif;font-size:30px;color:var(--accent);font-weight:700;flex-shrink:0}
.foot{position:absolute;left:64px;right:64px;bottom:26px;display:flex;justify-content:space-between;
  font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px;letter-spacing:.02em}
.horizon{position:absolute;right:52px;bottom:70px;width:200px;height:72px;opacity:.9}
.credit{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.credit p{font-size:19px;line-height:1.45;color:var(--muted);max-width:54ch}
.step{margin-top:24px;font-size:24px;line-height:1.5;max-width:46ch}
.disc{margin-top:26px;font-size:14px;line-height:1.5;color:var(--muted);max-width:62ch;border-top:1px solid var(--rule);padding-top:14px}
.center{height:100%;justify-content:center}
@media(max-width:720px){.slide{padding:34px 30px;aspect-ratio:auto;min-height:72vh}
  h1{font-size:34px}.big{font-size:38px}.cols{flex-direction:column}.foot{position:static;margin-top:24px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass', h:'The RiskAbility Factor',
   lead:'How accomplished leaders turn risk avoidance into opportunity activation.',
   fa:'With Tom LeNoble', fb:'Opening Pathways'},
  {t:'list', kick:'Who this is for', h:'Accomplished. Aware. At a turning point.',
   items:['Founders with quiet self-doubt behind real success',
          'Executives questioning identity or the next move',
          'Leaders reinventing after illness, exit, or a long chapter ending',
          'Nonprofit and mission leaders carrying heavy decisions alone']},
  {t:'statement', kick:'The trap', h:'You have won. And you have never felt more cautious.',
   lead:'The more you build, the more there is to protect, and the quieter the voice that says do something new gets.'},
  {t:'hook', big:'Success quietly trains you to <span class="a">stop taking risks.</span>',
   lead:'That is the thing almost nobody warns you about at the top.'},
  {t:'part', no:'Part One', h:'The core problem'},
  {t:'cols', kick:'Risk avoidance in disguise', h:'It rarely looks like fear. It looks like wisdom.',
   cols:[{t:'Freeze', p:'You call it waiting for the right time. The right time never arrives on its own.'},
         {t:'Over-manage', p:'You pour energy into the thing you already run well, because it is safe and it works.'},
         {t:'Wait', p:'You keep the next chapter as a someday, never a plan with a first step.'}]},
  {t:'statement', kick:'The cost', h:'The cost is not a failure. It is a chapter you never start.',
   lead:'Years pass in a holding pattern that feels responsible from the inside.'},
  {t:'part', no:'Part Two', h:'RiskAbility'},
  {t:'statement', kick:'The reframe', h:'Resilience is a skill, not a trait.',
   lead:'RiskAbility is the trainable capacity to take the right risk under uncertainty. You do not wait to feel brave. You practice three moves until courage becomes a habit.'},
  {t:'move', n:'01', h:'See the risk clearly',
   lead:'Separate the real risk from the imagined one. Most of what keeps an accomplished leader stuck is a story about risk, not the risk itself.'},
  {t:'move', n:'02', h:'Size it down',
   lead:'You do not need the leap. You need the smallest brave step that is still real, the one you can take this week without betting everything.'},
  {t:'move', n:'03', h:'Activate before certainty',
   lead:'Act before you feel ready, then let the evidence come back. Confidence is built from motion, not found before it.'},
  {t:'list', kick:'The Five-Year Forward Blueprint', h:'Zoom out, then zoom in.',
   items:['Zoom out to a vision for the whole of your life, not just the career',
          'Zoom in to blueprint the next five years into concrete moves',
          'Use the lookback to adjust the plan instead of abandoning it']},
  {t:'statement', kick:'The Haystack Method', h:'You cannot blueprint forward while carrying the past.',
   lead:'Resentment and regret quietly veto new risks. Letting go is a leadership skill: find the needle that matters, set the haystack down, and move lighter.'},
  {t:'part', no:'Part Three', h:'What the shift looks like'},
  {t:'cols', kick:'What changes', h:'From protecting the position to building the next one.',
   cols:[{t:'Before', p:'Busy, capable, and privately stalled. Every option stays open and nothing gets chosen.'},
         {t:'After', p:'A clear five-year blueprint and a first brave step already in motion this week.'}]},
  {t:'credit', kick:'Why listen to me', h:'I have run the extreme version of this decision.',
   paras:['I have been told three times I had six months to live, and I have led my own life with metastatic cancer for more than fourteen years.',
          'I built and led inside MCI, Walmart.com, Palm, and Facebook, and I now serve as CEO of the Academy for Coaching Excellence and a leadership coach with the Miller Center at Santa Clara University.']},
  {t:'recap', kick:'The three moves', h:'RiskAbility, in one picture.',
   items:['See the risk clearly','Size it down to the smallest brave step','Activate before you feel certain']},
  {t:'cta', kick:'Your next move', h:"Let's blueprint your next five years.",
   step:'If you are a leader at a turning point, reach out through tomlenoble.com to start a confidential advising conversation.',
   disc:'This masterclass is educational. No specific result is guaranteed. Results vary with your situation, effort, and circumstances, and nothing here is financial, legal, or medical advice.'}
];

const HORIZON = `<svg class="horizon" viewBox="0 0 260 110" fill="none"><path d="M12 96 H80 V66 H150 V38 H212 V14" stroke="#3fa6df" stroke-width="3" stroke-linecap="round"/><circle cx="212" cy="14" r="6" fill="none" stroke="#3fa6df" stroke-width="3.2"/></svg>`;
function foot(){return `<div class="foot"><span>The RiskAbility Factor</span><span>Tom LeNoble</span></div>`;}
function kick(s){return s.kick?`<div class="kick">${s.kick}</div>`:'';}

function render(s){
  switch(s.t){
    case 'title': return `${kick(s)}<h1>${s.h}</h1><div class="lead">${s.lead}</div>${HORIZON}
      <div class="foot"><span>${s.fa}</span><span>${s.fb}</span></div>`;
    case 'list': return `${kick(s)}<h2>${s.h}</h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>${foot()}`;
    case 'statement': return `${kick(s)}<h2>${s.h}</h2><div class="lead">${s.lead}</div>${foot()}`;
    case 'hook': return `<div class="center" style="display:flex;flex-direction:column"><div class="big">${s.big}</div><div class="lead">${s.lead}</div></div>${foot()}`;
    case 'part': return `<div class="part" style="height:100%"><div class="no">${s.no}</div><h1>${s.h}</h1></div>${foot()}`;
    case 'cols': return `${kick(s)}<h2>${s.h}</h2><div class="cols">${s.cols.map(c=>`<div class="col"><div class="t">${c.t}</div><p>${c.p}</p></div>`).join('')}</div>${foot()}`;
    case 'move': return `<div class="kick">RiskAbility, move ${s.n}</div><div class="move"><div class="n">${s.n}</div><h2>${s.h}</h2></div><div class="lead" style="max-width:54ch">${s.lead}</div>${foot()}`;
    case 'credit': return `${kick(s)}<h2>${s.h}</h2><div class="credit">${s.paras.map(p=>`<p>${p}</p>`).join('')}</div>${foot()}`;
    case 'recap': return `${kick(s)}<h2>${s.h}</h2><ul>${s.items.map(i=>`<li class="on">${i}</li>`).join('')}</ul>${foot()}`;
    case 'cta': return `<div class="cta center" style="display:flex;flex-direction:column">${kick(s)}<h1>${s.h}</h1><div class="step">${s.step}</div><div class="disc">${s.disc}</div></div>`;
  }
  return '';
}

const deck = document.getElementById('deck');
S.forEach(s=>{const d=document.createElement('section');d.className='slide'+(s.t==='part'?' part':'');d.innerHTML=render(s);deck.appendChild(d);});
let i=0;const slides=[...document.querySelectorAll('.slide')];
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' '){i=Math.min(i+1,slides.length-1);slides[i].scrollIntoView({behavior:'smooth',block:'center'});e.preventDefault();}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){i=Math.max(i-1,0);slides[i].scrollIntoView({behavior:'smooth',block:'center'});e.preventDefault();}
});
</script>
</body>
</html>
