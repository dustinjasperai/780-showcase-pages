<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Confident Knee MRI Report : Radiology Seminars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e6edf6; --panel:#ffffff; --ink:#0a1628; --muted:#2d3748;
    --accent:#0072ce; --deep:#003087; --amber:#fab64d; --rule:#d4deec;
    --display:'Sora',sans-serif; --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 44px;margin:0 0 22px;position:relative;overflow:hidden;
    box-shadow:0 1px 2px rgba(10,22,40,.04);
  }
  /* reading-room imaging-grid motif */
  .slide::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(var(--rule) 1px,transparent 1px),
      linear-gradient(90deg,var(--rule) 1px,transparent 1px);
    background-size:34px 34px;
    mask-image:linear-gradient(135deg,rgba(0,0,0,.14),transparent 46%);
    -webkit-mask-image:linear-gradient(135deg,rgba(0,0,0,.14),transparent 46%);
  }
  .slide>*{position:relative}
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:16px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.02em}
  h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.14;letter-spacing:-.01em}
  .sub{font-size:19px;color:var(--muted);margin-top:16px;max-width:60ch}
  .body{font-size:18px;color:var(--muted);margin-top:14px;max-width:62ch}
  ul{list-style:none;margin-top:22px;display:grid;gap:12px}
  li{font-size:18px;color:var(--ink);padding-left:30px;position:relative}
  li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;
    border-radius:3px;background:var(--accent)}
  .title-slide{padding:72px 44px}
  .title-slide h1{font-size:54px}
  .part{background:var(--ink);border-color:var(--ink)}
  .part::before{opacity:.18;
    background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px)}
  .part .kicker{color:var(--amber)}
  .part h2{color:#fff}
  .cta{background:var(--ink);border-color:var(--ink);text-align:center;padding:64px 44px}
  .cta::before{opacity:.16}
  .cta h2{color:#fff}
  .cta .sub{color:#c7d4e6;margin-left:auto;margin-right:auto}
  .cta .action{display:inline-block;margin-top:26px;font-family:var(--display);font-weight:700;
    font-size:18px;color:var(--ink);background:var(--amber);padding:14px 26px;border-radius:10px}
  .disc{margin-top:26px;font-size:13px;color:#9db2cc;max-width:60ch;margin-left:auto;margin-right:auto}
  .foot{max-width:960px;margin:8px auto 40px;padding:0 20px;font-size:13px;color:var(--muted);
    font-family:var(--display);letter-spacing:.04em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Radiology Seminars · CPD accredited live teaching</div>
<script>
const S=[
  {t:'title', kicker:'Live Masterclass with Radiology Seminars', h:'The Confident Knee MRI Report', sub:'A systematic method for menisci, ligaments and cartilage, from image to clinical decision.'},
  {t:'promise', h:'By the end of this hour', list:['A repeatable search you can run on every knee MRI','The confidence to commit to a report instead of hedging it','A clear path from the finding to the clinical decision']},
  {t:'who', h:'Who this is for', list:['Radiology trainees building reporting confidence','Reporting radiographers extending into MSK','Consultants who want a cleaner, teachable system']},
  {t:'trap', h:'The trap', body:'Most of us learned knee MRI by pattern-spotting: scroll until something looks wrong. It works until the list is long, the study is subtle, or the clinician asks what the finding actually means.'},
  {t:'reframe', h:'Confidence is not volume', body:'Reading more scans does not make a report surer. A repeatable search does. The radiologists who trust their reports are running the same structured pass on every study.'},
  {t:'part', kicker:'Part one', h:'Why the report hedges'},
  {t:'list', h:'Three reasons reports hedge', list:['No fixed order, so findings get missed and then second-guessed','The finding is described but never carried to a decision','Normal variants read as pathology under time pressure']},
  {t:'part', kicker:'Part two', h:'The systematic knee MRI pass'},
  {t:'list', h:'The pass, in order', list:['Menisci: body, roots and the structured search for tears','Cruciates and collaterals: continuity, fibre pattern, avulsion','Cartilage and subchondral bone: the surfaces that change management','Extensor mechanism and effusion: the quick confirm']},
  {t:'detail', h:'Menisci first, always', body:'Start where the misses cost the most. A fixed menisci search, identical every study, means a tear is never found by luck and never missed by rush.'},
  {t:'detail', h:'Ligaments: read the fibres, not the feel', body:'Continuity, fibre pattern and the secondary signs. A structured ligament read turns "probably intact" into a line you can stand behind.'},
  {t:'detail', h:'Cartilage changes the plan', body:'The surfaces are where the report meets the clinic. Grade them consistently and the orthopaedic decision follows from your words.'},
  {t:'part', kicker:'Part three', h:'From image to clinical decision'},
  {t:'detail', h:'Every finding earns a sentence', body:'A finding without a consequence is noise. The method carries each one through to what it means for the patient and the next step.'},
  {t:'case', h:'Worked live, on real cases', body:'We take real knee MRIs through the pass together, in real time, with your questions. That is how the method sticks: on the scans you actually report, not on a slide.'},
  {t:'whyme', h:'Why learn it live', body:'Radiology Seminars teaches with practising consultants, case-based and live, with real-time Q&A. Every session is taught by a clinician who practises what they teach.'},
  {t:'next', h:'Where this goes next', body:'The masterclass is the start. The MSK Fellowship and Community carries the same method across the whole joint, with mentoring, case discussions and a fellowship certificate.'},
  {t:'cta', h:'Join the next live session', sub:'Bring a knee MRI you are unsure about. We will report it together.', action:'Register for the live masterclass at radiologyseminars.com', disc:'Educational content for radiologists and reporting radiographers. No diagnostic or clinical result is guaranteed. Results vary with each learner and each case.'}
];
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function li(items){return '<ul>'+items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';}
const deck=document.getElementById('deck');
S.forEach(function(s){
  const d=document.createElement('section');
  let cls='slide';
  if(s.t==='title') cls+=' title-slide';
  if(s.t==='part') cls+=' part';
  if(s.t==='cta') cls+=' cta';
  d.className=cls;
  let html='';
  if(s.kicker) html+='<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.t==='title'){ html+='<h1>'+esc(s.h)+'</h1>'; }
  else if(s.h){ html+='<h2>'+esc(s.h)+'</h2>'; }
  if(s.sub) html+='<p class="sub">'+esc(s.sub)+'</p>';
  if(s.body) html+='<p class="body">'+esc(s.body)+'</p>';
  if(s.list) html+=li(s.list);
  if(s.action) html+='<div class="action">'+esc(s.action)+'</div>';
  if(s.disc) html+='<p class="disc">'+esc(s.disc)+'</p>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
