<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future-Fit Culture - A Masterclass with Geoff Marlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --ink:#2d3748;
  --muted:#4a5568;
  --accent:#0d5b97;
  --deep:#0a456f;
  --rule:#d7e3f0;
  --head:'Lora',Georgia,serif;
  --body:'Public Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
#deck{width:100%}
.slide{
  min-height:100vh;width:100%;
  display:flex;flex-direction:column;justify-content:center;
  padding:9vh 9vw;border-bottom:1px solid var(--rule);position:relative;
}
.slide .num{position:absolute;top:4.2vh;right:9vw;font-size:13px;letter-spacing:.14em;color:var(--muted);opacity:.7}
.k{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
h1{font-family:var(--head);font-weight:600;font-size:clamp(34px,6.2vw,74px);line-height:1.04;letter-spacing:-.01em}
h2{font-family:var(--head);font-weight:600;font-size:clamp(28px,4.6vw,52px);line-height:1.08;letter-spacing:-.01em}
.lede{font-size:clamp(18px,2.1vw,26px);line-height:1.5;color:var(--muted);max-width:40ch;margin-top:26px}
.p{font-size:clamp(17px,1.7vw,21px);line-height:1.6;max-width:46ch;margin-top:22px;color:var(--ink)}
.sub{font-size:clamp(15px,1.5vw,18px);color:var(--muted);margin-top:30px;letter-spacing:.01em}
ul{list-style:none;margin-top:30px;max-width:48ch}
li{position:relative;padding-left:30px;margin:16px 0;font-size:clamp(16px,1.7vw,21px);line-height:1.45}
li::before{content:"";position:absolute;left:0;top:.62em;width:11px;height:2px;background:var(--accent)}
.habit{display:flex;gap:26px;align-items:baseline;max-width:52ch;margin-top:26px}
.habit .n{font-family:var(--head);font-size:clamp(40px,6vw,68px);color:var(--rule);font-weight:600;line-height:1;flex:none;width:1.6em}
.habit .hx{font-family:var(--head);font-size:clamp(22px,3vw,34px);font-weight:600}
.habit .hp{font-size:clamp(15px,1.6vw,19px);color:var(--muted);line-height:1.5;margin-top:8px}
.divider{background:var(--deep);color:#eaf2fb;border-bottom:1px solid var(--deep)}
.divider .k{color:#9cc4e6}
.divider h2{color:#ffffff}
.divider .lede{color:#cfe0f1}
.title{background:linear-gradient(180deg,#ffffff 0%,var(--bg) 100%)}
.cta{background:var(--panel)}
.three{display:flex;gap:30px;flex-wrap:wrap;margin-top:36px}
.three .q{flex:1 1 220px;border-top:3px solid var(--accent);padding-top:16px}
.three .q b{font-family:var(--head);font-size:clamp(20px,2.4vw,28px);display:block}
.three .q span{color:var(--muted);font-size:15px;line-height:1.5;display:block;margin-top:8px}
.disc{font-size:13px;color:var(--muted);margin-top:34px;max-width:52ch;line-height:1.5;opacity:.85}
.byline{font-size:clamp(15px,1.5vw,18px);color:var(--muted);margin-top:30px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title',
    k:'A live masterclass with Geoff Marlow',
    h:'How to Build a Future-Fit Culture',
    lede:'Innovation, agility and adaptiveness, built by the people who already work for you.'},

  {t:'audience',
    k:'Who this is for',
    h:'For leaders who have tried this before',
    list:['CEOs and founders who feel the culture lagging the strategy','Heads of people, culture and transformation','Leaders who have run the programs and not seen the change stick']},

  {t:'trap',
    k:'The honest starting point',
    h:'You rolled out the values. Ran the survey. Hired the firm.',
    p:'A year later, the slides look great and almost nothing has actually moved. The meetings feel the same. The good people are still quietly working around the system.'},

  {t:'reframe',
    k:'The reframe',
    h:'The problem was never your people.',
    p:'It is the five habits running underneath the program, inherited from a century of management thinking. Until you see them, every new initiative gets quietly absorbed and neutralised.'},

  {t:'divider', cls:'divider',
    k:'Part one',
    h:'Why culture programs fail',
    lede:'Culture is not a thing you install. It is a thing that grows.'},

  {t:'immune',
    k:'The core problem',
    h:'Your legacy culture behaves like an immune system',
    p:'It preserves the status quo while actively stifling, smothering and strangling innovation, agility and adaptiveness. A culture program is a transplant. The immune system attacks it on contact.'},

  {t:'emergent',
    k:'The core problem',
    h:'Culture is emergent, not designed',
    p:'It arises from the real actions and interactions of real people, every day. That is why it cannot be dictated from the top or bought from outside. It can only be cultivated from within.'},

  {t:'divider', cls:'divider',
    k:'Part two',
    h:'The Five Fatal Habits',
    lede:'The recurring habits that have killed culture change for forty years. Learn to spot each one in your own organisation.'},

  {t:'habit',
    k:'Fatal habit one',
    hx:'"One Best Way" thinking',
    hp:'A legacy of century-old Scientific Management. Overcoming it lets an organisation leverage its own unique opportunities, for greater success with less effort and risk.', n:'01'},

  {t:'habit',
    k:'Fatal habit two',
    hx:'"All or Nothing" thinking',
    hp:'A hangover from the Strategic Planning era. Overcoming it lets far more people make pragmatic, low-risk, high-leverage, iterative contributions.', n:'02'},

  {t:'habit',
    k:'Fatal habit three',
    hx:'Leadership that creates followers',
    hp:'The quiet cap on most organisations. Overcoming it develops the organisation\'s own capacity for future-fit leadership at every level.', n:'03'},

  {t:'habit',
    k:'Fatal habit four',
    hx:'Wasting people\'s strengths',
    hp:'The most common and most expensive waste there is. Overcoming it unleashes the collective human capacity for innovation, agility and adaptiveness.', n:'04'},

  {t:'habit',
    k:'Fatal habit five',
    hx:'"Hired help that hinders"',
    hp:'A century of cookie-cutter consulting. Overcoming it frees you from the most debilitating reinforcement of the other four habits.', n:'05'},

  {t:'divider', cls:'divider',
    k:'Part three',
    h:'The future-fit alternative',
    lede:'What you build instead, and how.'},

  {t:'three',
    k:'What future-fit means',
    h:'Three qualities, not a poster',
    three:[['Innovation','The habit of finding and leveraging your own best opportunities.'],['Agility','Many people making small, fast, low-risk moves, not one big reorg.'],['Adaptiveness','A culture that keeps reforming itself as the world keeps changing.']]},

  {t:'within',
    k:'How it actually happens',
    h:'Led, guided and delivered from within',
    p:'Not another top-down rollout. Change spreads through informal, low-threat, one-to-one conversations. You discover rather than tell, creating the conditions for people to reach their own aha moments and carry the change themselves.'},

  {t:'looks',
    k:'A culture that reforms itself',
    h:'The organisation starts changing itself',
    list:['Leaders grow more leaders instead of more followers','People bring their real strengths to the work','Small improvements compound instead of stalling','The culture adapts without waiting for the next big program']},

  {t:'whyme',
    k:'Why learn this here',
    h:'Forty years of practice-based evidence',
    p:'I have spent roughly four decades helping organisations across Europe, Asia and the US create future-fit cultures of innovation, agility and adaptiveness. Not cookie-cutter projects. The patterns in this session are what actually worked, and what did not.',
    byline:'Geoff Marlow'},

  {t:'cta', cls:'cta',
    k:'Start where you are',
    h:'Start building your future-fit culture',
    p:'If you want help applying this inside your own organisation, book a call and we will map where your five habits are showing up and where to start.',
    sub:'Book a call with Geoff | geoffmarlow.com',
    disc:'This masterclass is educational. No income, role, or business result is guaranteed. Results vary with your organisation, your people, and the work you put in.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide'+(s.cls?' '+s.cls:'');
  let html='<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if(s.k) html+='<div class="k">'+s.k+'</div>';
  if(s.h) html+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.lede) html+='<div class="lede">'+s.lede+'</div>';
  if(s.p) html+='<div class="p">'+s.p+'</div>';
  if(s.list){html+='<ul>';s.list.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  if(s.three){html+='<div class="three">';s.three.forEach(q=>html+='<div class="q"><b>'+q[0]+'</b><span>'+q[1]+'</span></div>');html+='</div>';}
  if(s.t==='habit'){html+='<div class="habit"><div class="n">'+s.n+'</div><div><div class="hx">'+s.hx+'</div><div class="hp">'+s.hp+'</div></div></div>';}
  if(s.byline) html+='<div class="byline">'+s.byline+'</div>';
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  sec.innerHTML=html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
