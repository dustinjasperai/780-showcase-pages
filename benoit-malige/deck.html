<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Second Life - a live masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116;        /* brand-derived dark ground (site_scheme: dark) */
    --panel:#171B22;
    --rule:#242A33;
    --ink:#F2F4F7;
    --muted:#9AA4B2;
    --accent:#1EAAFF;    /* brand blue, extract_brand.js rgb(30,170,255) */
    --coral:#E28A7C;     /* brand coral, extract_brand.js */
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 20px}
  h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:52px;line-height:1.04;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:38px;line-height:1.1;margin:0 0 16px;letter-spacing:-.01em}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:40ch;margin:0 0 10px}
  .muted{color:var(--muted)}
  p{font-size:18px;line-height:1.6;color:var(--muted);max-width:52ch}
  .big{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:40px;line-height:1.18;letter-spacing:-.01em;color:var(--ink);max-width:24ch}
  .part{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral);font-weight:600;margin:0 0 14px}
  .ledger{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:26px;max-width:640px}
  .ledger div{padding:18px 20px;font-size:16px;line-height:1.45}
  .ledger .col-head{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;border-bottom:1px solid var(--rule)}
  .ledger .r{border-top:1px solid var(--rule)}
  .ledger .left{border-right:1px solid var(--rule);color:var(--muted)}
  .ledger .right{color:var(--ink)}
  .pillars{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:14px;max-width:640px}
  .pillars li{border-left:2px solid var(--accent);padding:4px 0 4px 18px}
  .pillars .n{font-family:"Newsreader",serif;font-size:19px;color:var(--ink);font-weight:600;display:block;margin-bottom:3px}
  .pillars .d{font-size:16px;color:var(--muted);line-height:1.5}
  .mirror{display:flex;gap:16px;align-items:baseline;margin:10px 0}
  .mirror .idx{font-family:"Newsreader",serif;font-size:30px;color:var(--accent);min-width:48px}
  .num{font-family:"Newsreader",serif;font-size:15px;color:var(--muted);position:absolute;right:30px;bottom:22px;letter-spacing:.08em}
  .cta-steps{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:12px;max-width:560px}
  .cta-steps li{display:flex;gap:14px;align-items:baseline;font-size:18px;color:var(--ink)}
  .cta-steps .b{color:var(--accent);font-family:"Newsreader",serif}
  .disclaimer{margin-top:30px;font-size:12.5px;color:var(--muted);max-width:60ch;line-height:1.5;border-top:1px solid var(--rule);padding-top:16px}
  .accentword{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Benoit Malige', title:'The Second Life',
   lead:'Why the self that built your success became your ceiling, and how to find the one underneath.'},

  {t:'promise', eyebrow:'What you walk out with',
   h2:'A map of the self you never chose, and the practice that replaces it.',
   p:'In ninety live minutes you will see the three mirrors that wrote your current identity, and leave with the exact daily practice I run with private clients to re-author it.'},

  {t:'who', eyebrow:'Who this is for',
   h2:'You won the game and feel almost nothing.',
   p:"You hit the number. Built the thing. Got the freedom. And the quiet feeling is not relief, it is that you are performing a life you never actually chose. This is for founders and high performers in exactly that gap."},

  {t:'trap', eyebrow:'The trap',
   big:'So you do the only thing you know how to do. You optimize harder.',
   p:'Another goal, another system, another version of the same self. The achievement moves. The emptiness does not. Because the problem was never performance. It is who is doing the performing.'},

  {t:'cost', eyebrow:'The cost',
   big:'The performed self is expensive.',
   p:'It shows up as the achievement that never quite lands, the relationships you manage instead of live, and the slow suspicion that none of this was ever yours to begin with.'},

  {t:'hook', eyebrow:'The reframe',
   big:'Your personality is a lie.',
   p:'A composite of survival strategies, other people’s opinions, and cultural baggage. The self that won your first life is a first draft, and it was written by everyone but you.'},

  {t:'part', part:'Part One', h2:'You are running someone else’s script.',
   p:'Everything you believe about who you are, what you are capable of, and what you deserve was formed through three distorted lenses. Before you can author a life, you have to see who has been holding the pen.'},

  {t:'mirrors-intro', eyebrow:'The Three Mirrors',
   big:'Everything you believe about yourself came through three distorted lenses.'},

  {t:'mirror', eyebrow:'The Three Mirrors / 01', h2:'Parents',
   p:'The childhood survival patterns you built to stay safe and loved. The first and deepest draft, laid down long before you could consent to it.'},

  {t:'mirror', eyebrow:'The Three Mirrors / 02', h2:'Institutions',
   p:'School and work handed you a definition of success and told you it was your own ambition. Most of your goals are inherited, not chosen.'},

  {t:'mirror', eyebrow:'The Three Mirrors / 03', h2:'Culture',
   p:'The projections you absorbed about what a life is worth, running quietly underneath every choice you think you are making freely.'},

  {t:'firstdraft', eyebrow:'The Three Mirrors',
   big:'The first draft. Written by everyone but you.'},

  {t:'part', part:'Part Two', h2:'How you re-author it.',
   p:'Insight is not change. You already understand your patterns. The work is a written, repeatable practice that closes the distance between who you know you are and how you actually live.'},

  {t:'ledger', eyebrow:'The Double Entry Protocol',
   h2:'One entry for the old draft. One for the self you choose.',
   p:'A daily fifteen minute writing practice, rooted in neuroscience. Adapted from double-entry accounting, it tracks the future version of you emerging into the present, every single day.'},

  {t:'pillars', eyebrow:'The Clear Mirror Framework',
   h2:'Three tools that bypass the conditioned mind.',
   pillars:[
     {n:'The Full Body Yes Test', d:'Could you sustain this until you die and still feel alive? Answer with your body, not your mind.'},
     {n:'The Origin Audit', d:'Trace each choice: is it running toward meaning, or away from fear?'},
     {n:'The Ten Mirror Questions', d:'Prompts built to surface the truth underneath the performance.'}
   ]},

  {t:'pillars', eyebrow:'The Identity Atlas and The Contract',
   h2:'Make it measurable. Make it binding.',
   pillars:[
     {n:'The Identity Atlas', d:'Track the gap between the self you state and the self you live, in your own language over time.'},
     {n:'The Contract', d:'A witnessed commitment, signed at the start. The Second Life begins when you pick up the pen.'}
   ]},

  {t:'part', part:'Part Three', h2:'What the second life looks like.',
   p:'Not a new morning routine. This is what happens when the author changes, not just the habits.'},

  {t:'whatchanges', eyebrow:'The second life',
   h2:'What changes.',
   p:'The performing stops. Decisions get quiet and clean because they come from you, not from the mirrors. Work stops being a costume, and the freedom you built finally has someone to belong to.'},

  {t:'why', eyebrow:'Why I teach this',
   h2:'I built the first life, then walked out of it.',
   p:'A seven figure business by my mid thirties, then I left it to take this apart in public. The Second Life now reaches more than thirty thousand readers, and I run this same work privately with founders who already have everything the first draft promised.'},

  {t:'cta', eyebrow:'Your next step', title:'Start your second life.',
   lead:'Join the live masterclass, then keep going with the sixty day Second Life Protocol or private work.',
   steps:[
     {b:'1', x:'Attend the live masterclass and map your three mirrors.'},
     {b:'2', x:'Start The Double Entry Protocol the same day.'},
     {b:'3', x:'Choose your path: the sixty day protocol or private advisory.'}
   ],
   disclaimer:'This masterclass is educational. No specific financial, professional, or personal result is guaranteed. Results vary and depend entirely on your own effort and circumstances. This is not therapy or medical advice.'}
];

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const deck = document.getElementById('deck');
let n = 0;
for(const s of S){
  n++;
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '';
  if(s.eyebrow) h += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.part) h += `<div class="part">${esc(s.part)}</div>`;
  if(s.title) h += `<h1>${esc(s.title)}</h1>`;
  if(s.h2) h += `<h2>${esc(s.h2)}</h2>`;
  if(s.big) h += `<div class="big">${esc(s.big)}</div>`;
  if(s.lead) h += `<div class="lead">${esc(s.lead)}</div>`;
  if(s.mirrors){
    for(const m of s.mirrors){
      h += `<div class="mirror"><div class="idx">${esc(m.i)}</div><div><div class="pillars"><li style="border:none;padding:0"><span class="n">${esc(m.n)}</span><span class="d">${esc(m.d)}</span></li></div></div></div>`;
    }
    if(s.foot) h += `<p style="margin-top:18px;color:var(--ink)">${esc(s.foot)}</p>`;
  }
  if(s.t==='ledger'){
    if(s.p) h += `<p>${esc(s.p)}</p>`;
    h += `<div class="ledger">`+
      `<div class="col-head left">The first draft</div>`+
      `<div class="col-head right">The self you choose</div>`+
      `<div class="r left">What I was told to want</div>`+
      `<div class="r right">What I would choose on my own</div>`+
      `<div class="r left">Who I perform as</div>`+
      `<div class="r right">Who I am underneath it</div>`+
      `</div>`;
  } else if(s.p && s.t!=='ledger' && !s.mirrors){
    h += `<p>${esc(s.p)}</p>`;
  }
  if(s.pillars){
    h += `<ul class="pillars">`;
    for(const p of s.pillars) h += `<li><span class="n">${esc(p.n)}</span><span class="d">${esc(p.d)}</span></li>`;
    h += `</ul>`;
  }
  if(s.steps){
    h += `<ul class="cta-steps">`;
    for(const st of s.steps) h += `<li><span class="b">${esc(st.b)}</span><span>${esc(st.x)}</span></li>`;
    h += `</ul>`;
  }
  if(s.disclaimer) h += `<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  h += `<div class="num">${String(n).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
