<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Pattern, A Masterclass with Shimon Perry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f2;      /* his body off-white */
    --panel:#ffffff;
    --rule:#dde1e6;    /* his pale grey */
    --ink:#0f1a2a;     /* his dominant navy */
    --muted:#586173;   /* his slate */
    --accent:#2f55e4;  /* his own CTA blue */
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --text:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:64px 60px;margin:0 0 28px;min-height:520px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:26px;right:30px;font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .kicker{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:64px;line-height:1.02;letter-spacing:-0.02em;margin-bottom:22px}
  h2{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.08;letter-spacing:-0.015em;margin-bottom:20px}
  .sub{font-size:23px;line-height:1.45;color:var(--muted);max-width:30ch;font-weight:500}
  .lead{font-size:26px;line-height:1.5;max-width:34ch}
  ul{list-style:none;margin-top:14px}
  li{font-size:21px;line-height:1.5;padding:14px 0 14px 34px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:16px;height:2px;background:var(--accent)}
  .presenter{margin-top:34px;font-size:17px;color:var(--muted);font-weight:600;letter-spacing:.01em}
  .section h2{font-size:52px}
  .section .kicker{color:var(--muted)}
  .pattern{display:flex;gap:7px;margin-top:30px}
  .pattern i{display:block;width:40px;height:3px;background:var(--rule);border-radius:2px}
  .pattern i.on{background:var(--accent)}
  .big{font-size:30px;line-height:1.4;max-width:30ch;font-weight:500}
  .cta{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .cta .kicker{color:#8fa0ff}
  .cta h2{color:#ffffff}
  .cta li{border-top-color:rgba(255,255,255,.14);color:#dde1e6}
  .cta li::before{background:#8fa0ff}
  .cta .book{display:inline-block;margin-top:30px;font-family:var(--display);font-weight:600;font-size:22px;color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:14px 30px}
  .disc{margin-top:28px;font-size:13px;line-height:1.5;color:#8893a8;max-width:62ch}
  .foot{text-align:center;color:var(--muted);font-size:14px;letter-spacing:.04em;padding-top:8px}
  @media(max-width:680px){.slide{padding:40px 26px;min-height:440px}h1{font-size:42px}h2{font-size:32px}.section h2{font-size:38px}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<div class="foot">Find the Pattern &middot; A masterclass with Shimon Perry</div>
<script>
const S=[
  {t:'title',k:'A masterclass for senior professionals at a turning point',h:'Find the Pattern',s:'Why strong leaders stall at a turning point, and how to name the one thing that is actually in the way.',by:'Shimon Perry, Leadership Coach, ICF ACC'},
  {t:'point',k:'Who this is for',h:'You are doing well, and something still needs to change.',b:['You are stepping into a bigger role, with more visibility and more at stake.','Your career looks right on paper and feels wrong inside.','You keep landing in the same pattern with a boss or a team.','You are weighing a promotion, or a move out of corporate.']},
  {t:'point',k:'The trap',h:'The decision you keep putting off is a symptom.',lead:'The cause is a pattern you cannot see from inside it. So you read more, plan more, and wait for the moment to feel ready. It does not come.'},
  {t:'section',k:'Part One',h:'You have run out of road on self-awareness.'},
  {t:'point',k:'The core problem',h:'Knowing is not the blocker.',lead:'You already know what you should probably do. More insight has stopped moving you. At a certain level, another book or framework is not what gets you unstuck.'},
  {t:'point',k:'The core problem',h:'The verdict you gave yourself.',lead:'The story you decided about yourself, long before you walked into the room, quietly runs the room. Most stalls are a verdict, not a skill gap.'},
  {t:'point',k:'The core problem',h:'Patterns repeat.',lead:'What stalls a leader shows up again and again. With a boss. In how decisions get made. Most of all, in the decisions that get avoided. The pattern is the real work.'},
  {t:'section',k:'Part Two',h:'The method: find the pattern, then break it.',pat:true},
  {t:'point',k:'Step one',h:'Start where you are.',lead:'Name the role and the one thing you keep coming back to. Agree, plainly, on what a good outcome actually looks like for you. Not for the org chart. For you.'},
  {t:'point',k:'Step two',h:'Find the pattern.',lead:'The repeating move you cannot see from the inside, said out loud by someone who has sat in the seat. This is the turn. You cannot change a pattern you have never named.'},
  {t:'point',k:'Step three',h:'Pick concrete moves.',lead:'One or two things to try this week. Practiced at work, where it counts, not rehearsed in theory. Small, specific, and yours.'},
  {t:'point',k:'Step four',h:'Review and adjust.',lead:'Each week starts with what actually happened. What worked becomes the base for the next move. What did not gets replaced. Change gets built, one practice at a time.'},
  {t:'point',k:'Why it holds',h:'Insight, a rewritten verdict, then a practiced move.',lead:'This is change management applied to one person. Not a motivational hit that fades by Monday. A pattern named, a story corrected, and new behavior that survives contact with a hard week.'},
  {t:'section',k:'Part Three',h:'Inside a real career move.'},
  {t:'point',k:'The leadership story',h:'Senior moves are won on the story you bring into the room.',lead:'Not on the credentials already on the page. We shape the story, then prepare for the conversations and the interviews that decide it. When it counts, that is money time.'},
  {t:'point',k:'The shift',h:'From stuck to clear.',b:['Before: over-preparing, re-reading, waiting to feel ready, managing the same knot.','After: clear on the next move, and clear on the handful of moves that get there.','The difference is not more information. It is the pattern, named and worked.']},
  {t:'point',k:'Why me',h:'I have carried the role, not just studied it.',b:['20+ years leading customer success and go-to-market teams in tech, including Kenshoo (Skai) and Sellics.','Prosci certified in change management. Adjunct professor at Yeshiva University (Katz) and Queens College.','Mentor to founders at the QUAY Startup Accelerator.','I ask the questions that get you to your own answer, and when it helps, I tell you directly what I have seen work.']},
  {t:'point',k:'The one idea',h:'Find the pattern. Rewrite the verdict. Practice the move.',lead:'That is the whole method. Everything else is reps.'},
  {t:'cta',k:'Start where you are',h:'Book a free 20-minute call.',b:['We look at the role, and the one thing you keep coming back to.','We agree on what a good outcome would look like for you.','No pitch. If it is a fit, we talk about working together.'],book:'shimonperry.com',disc:'This masterclass is for educational purposes only. Coaching is a thinking and development partnership, not advice, therapy, or a guarantee of any specific career, financial, or performance outcome. Results vary by individual.'}
];
const deck=document.getElementById('deck');
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
S.forEach((s,i)=>{
  const n=document.createElement('section');
  n.className='slide'+(s.t==='section'?' section':'')+(s.t==='cta'?' cta':'');
  let h='<span class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</span>';
  if(s.k) h+='<div class="kicker">'+esc(s.k)+'</div>';
  if(s.t==='title'){
    h+='<h1>'+esc(s.h)+'</h1><p class="sub">'+esc(s.s)+'</p><div class="presenter">'+esc(s.by)+'</div>';
  } else if(s.t==='section'){
    h+='<h2>'+esc(s.h)+'</h2>';
    if(s.pat) h+='<div class="pattern"><i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i></div>';
  } else {
    h+='<h2>'+esc(s.h)+'</h2>';
    if(s.lead) h+='<p class="lead">'+esc(s.lead)+'</p>';
    if(s.big) h+='<p class="big">'+esc(s.big)+'</p>';
    if(s.b){h+='<ul>';s.b.forEach(x=>h+='<li>'+esc(x)+'</li>');h+='</ul>';}
    if(s.book) h+='<span class="book">'+esc(s.book)+'</span>';
    if(s.disc) h+='<p class="disc">'+esc(s.disc)+'</p>';
  }
  n.innerHTML=h;
  deck.appendChild(n);
});
</script>
</body>
</html>
