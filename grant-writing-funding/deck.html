<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Grant Writer to Full-Time Income, a masterclass with Holly Rustick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#29160c;        /* brand dominant brown */
    --panel:#3a2417;     /* brown lifted one step */
    --ink:#e8e5de;       /* brand cream */
    --muted:#c7bdb0;
    --accent:#7e9bd3;    /* brand periwinkle */
    --rule:rgba(232,229,222,.16);
    --serif:"DM Serif Display",Georgia,serif;
    --sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:48px 46px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .num{position:absolute;top:20px;right:24px;font-size:12px;letter-spacing:.14em;
    color:var(--muted);text-transform:uppercase}
  .kick{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
    margin:0 0 18px;font-weight:600}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,56px);line-height:1.04;
    margin:0 0 18px}
  h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.6vw,40px);line-height:1.08;
    margin:0 0 16px}
  p{font-size:clamp(16px,1.9vw,20px);line-height:1.5;margin:0 0 14px;max-width:62ch;color:var(--ink)}
  p.lead{color:var(--muted)}
  .rule{height:2px;background:linear-gradient(90deg,var(--accent),transparent);
    width:120px;margin:4px 0 24px;border-radius:2px}
  ul{margin:8px 0 0;padding:0;list-style:none;max-width:66ch}
  li{position:relative;padding:12px 0 12px 30px;border-top:1px solid var(--rule);
    font-size:clamp(15px,1.8vw,19px);line-height:1.45}
  li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:2px;background:var(--accent)}
  .step{display:flex;gap:16px;align-items:baseline;padding:11px 0;border-top:1px solid var(--rule)}
  .step b{font-family:var(--serif);color:var(--accent);font-size:22px;min-width:38px}
  .big{font-family:var(--serif);font-size:clamp(40px,6vw,76px);line-height:1;color:var(--accent);margin:6px 0 10px}
  .foot{font-size:13px;color:var(--muted);margin-top:26px}
  .disc{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:64ch}
  .cta-slide{background:linear-gradient(160deg,#3a2417,#29160c)}
  .tag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--bg);background:var(--accent);padding:6px 12px;border-radius:999px;font-weight:600}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
    kick:"A live masterclass with Holly Rustick",
    h:"From Grant Writer to a Full-Time Freelance Income",
    p:"How to turn the skill you already have into income that replaces your paycheck, writing grants part time, from home."},
  {t:'who',
    kick:"Who this is for",
    h:"You can win the money. You just can't pay yourself with it yet.",
    p:"You write strong grants. Clients and nonprofits trust you. But the income is sporadic, the pricing is a guess, and there is no reliable way to turn this skill into a salary you can count on."},
  {t:'trap',
    kick:"The trap",
    h:"Being great at the grant is not the same as running the business.",
    p:"Most grant writers get better and better at the craft and stay stuck on the business. More free proposals, more 'just help us out,' more hours, and the income never becomes predictable."},
  {t:'reframe',
    kick:"The reframe",
    h:"A skill is not a business. A full-time income is a system.",
    p:"You do not need to write more grants for free to prove yourself. You need a repeatable system that turns the skill into packages, a pipeline, and paying clients on a schedule."},
  {t:'part',
    kick:"Part one",
    h:"The real problem: you never set your number.",
    p:"Without a clear income target, you price by feel, say yes to the wrong work, and can never tell whether a month was a good one. Everything downstream drifts because the first number was never named."},
  {t:'system',
    kick:"The path",
    h:"The five-step freelance income system",
    steps:[
      ["1","Know Your Number: set the income you are replacing and the business foundation under it."],
      ["2","Package for Profit: offers, pricing, and retainer models instead of one-off favors."],
      ["3","Build Your 30-Day Pipeline: a repeatable way to find and reach the right clients."],
      ["4","Sales: discovery calls and an ethical way to turn conversations into signed work."],
      ["5","Client Delivery: onboarding, delivery, and retention so clients stay and refer."]]},
  {t:'module',
    kick:"Step one",
    h:"Know Your Number",
    p:"Start from the salary you want to replace, divide by your average grant fee, and you have the number of funded grants your year actually needs. Now pricing and pipeline have a target to serve.",
    foot:"The math you will work live in the masterclass."},
  {t:'module',
    kick:"Step two",
    h:"Package for Profit",
    p:"Stop quoting per proposal. Build offers and retainer models that pay you for the outcome and the ongoing relationship, so a single strong grant can become months of predictable revenue."},
  {t:'module',
    kick:"Step three",
    h:"Build Your 30-Day Pipeline",
    p:"A pipeline is not luck. It is a repeatable 30-day motion: identify the organizations that need you, reach out on a schedule, and keep enough conversations moving that the next client is never a surprise."},
  {t:'module',
    kick:"Step four",
    h:"Sales, without the ick",
    p:"The discovery call is where a nonprofit decides whether to trust you with their funding. A simple, honest structure lets you qualify fit, name your price without flinching, and close the right clients."},
  {t:'module',
    kick:"Step five",
    h:"Client Delivery that keeps them",
    p:"Onboarding, clear delivery, and retention turn one project into a roster. The goal is not the next scramble for work. It is clients who renew, refer, and keep your pipeline warm for you."},
  {t:'craft',
    kick:"Under the business, the craft",
    h:"A repeatable formula for the grant itself",
    p:"The income system sits on top of a dependable writing method: start from the funder's own RFP as your template, research the real need and problem statement, and build the proposal the funder is already asking for. The craft stays teachable and repeatable, grant after grant."},
  {t:'week',
    kick:"A week in the work",
    h:"A full-time week, part-time hours",
    steps:[
      ["Mon","Pipeline: outreach to new organizations and follow-ups."],
      ["Tue","Discovery calls and proposals in progress."],
      ["Wed","Deep writing block on the active grant."],
      ["Thu","Client delivery, reviews, and reporting."],
      ["Fri","Package and price the next month of work."]]},
  {t:'why',
    kick:"Why listen to me",
    h:"I have spent 20+ years inside this work.",
    p:"I am a grant writer, a bestselling author, and the host of a top-ranked grant writing podcast with over 700,000 listens. I built this system because I needed it myself, then taught it to thousands of writers.",
    foot:"Holly Rustick, Grant Writing & Funding"},
  {t:'movement',
    kick:"The bigger picture",
    h:"The $1 Billion for Good Movement",
    p:"My students are chasing a collective goal: win one billion dollars in grants for good causes and build thirty million in grant writing businesses by 2030.",
    big:"$336M+",
    bigsub:"in grants won by the community so far, with millions more in freelance income built on top of it."},
  {t:'objection',
    kick:"The honest question",
    h:"Is there really enough work?",
    p:"Organizations need funding every single year, and most cannot write for it themselves. The shortage is not demand. It is writers who know how to run this as a business instead of a side hustle."},
  {t:'path',
    kick:"Your next step",
    h:"You already have the skill. Now build the system.",
    p:"Set your number, package your offer, fill a 30-day pipeline, and deliver work clients keep paying for. That is the difference between writing grants and earning a living from them."},
  {t:'cta',
    kick:"Join me live",
    tag:"Next live session",
    h:"Build your full-time freelance income with me.",
    p:"Come to the live masterclass, work your own number in real time, and leave with the first 30 days of your pipeline mapped. If it is a fit, I will show you how the full program carries it the rest of the way.",
    disc:"Educational content only. No income, earnings, or result is guaranteed. Results vary and depend on your effort, market, and many factors outside anyone's control."}
];

function esc(s){return s==null?"":String(s)}
function slideHTML(s,i){
  const n='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  const kick=s.kick?'<div class="kick">'+esc(s.kick)+'</div>':'';
  const tag=s.tag?'<div style="margin-bottom:16px"><span class="tag">'+esc(s.tag)+'</span></div>':'';
  const head='<h1>'+esc(s.h)+'</h1>';
  const rule='<div class="rule"></div>';
  let body='';
  if(s.p) body+='<p>'+esc(s.p)+'</p>';
  if(s.steps){
    body+='<div>';
    for(const st of s.steps){ body+='<div class="step"><b>'+esc(st[0])+'</b><div>'+esc(st[1])+'</div></div>'; }
    body+='</div>';
  }
  if(s.list){ body+='<ul>'; for(const it of s.list){ body+='<li>'+esc(it)+'</li>'; } body+='</ul>'; }
  if(s.big) body+='<div class="big">'+esc(s.big)+'</div>';
  if(s.bigsub) body+='<p class="lead">'+esc(s.bigsub)+'</p>';
  if(s.foot) body+='<div class="foot">'+esc(s.foot)+'</div>';
  if(s.disc) body+='<div class="disc">'+esc(s.disc)+'</div>';
  const cls='slide'+(s.t==='cta'?' cta-slide':'');
  return '<section class="'+cls+'">'+n+tag+kick+head+rule+body+'</section>';
}
document.getElementById('deck').innerHTML=S.map(slideHTML).join('');
</script>
</body>
</html>
