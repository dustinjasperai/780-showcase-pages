<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Designed to Fit - A Work Life by Design Masterclass with Melissa Marsden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:ital,wght@0,300;0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#5d1140;      /* dominant brand colour (117 uses) */
    --plum-deep:#2b0f20; /* ink on cream */
    --cream:#f1e9e3;     /* warm cream panel */
    --terra:#b77039;     /* terracotta accent */
    --mist:#95a5a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#efe7e0;color:var(--plum-deep);font-family:"Mulish",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin:0 0 22px;box-shadow:0 10px 34px rgba(43,15,32,.14);display:flex;flex-direction:column;justify-content:center;padding:7% 8%}
  .slide .num{position:absolute;top:18px;right:22px;font-size:12px;letter-spacing:.14em;color:var(--mist);font-weight:600}
  .slide .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;margin-bottom:18px}
  h1,h2,h3{font-family:"Marcellus",Georgia,serif;font-weight:400;line-height:1.08;letter-spacing:.005em}
  /* grounds */
  .on-cream{background:var(--cream);color:var(--plum-deep)}
  .on-cream .kicker{color:var(--terra)}
  .on-plum{background:var(--plum);color:var(--cream)}
  .on-plum .kicker{color:var(--terra)}
  .on-plum h1,.on-plum h2,.on-plum h3{color:#fff}
  .rule{width:64px;height:3px;background:var(--terra);border:0;margin:0 0 22px}
  /* cover */
  .cover h1{font-size:60px;margin:6px 0 14px}
  .cover .sub{font-size:22px;max-width:30ch;line-height:1.4;color:var(--cream)}
  .cover .by{margin-top:34px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:700}
  .section h2{font-size:46px}
  .section .lead{margin-top:16px;font-size:19px;max-width:44ch;line-height:1.5}
  .point h2{font-size:38px;margin-bottom:14px}
  .point p{font-size:19px;max-width:48ch;line-height:1.55}
  .point p+p{margin-top:14px}
  ul.clean{list-style:none;margin-top:10px}
  ul.clean li{font-size:19px;line-height:1.5;padding-left:30px;position:relative;margin:12px 0;max-width:46ch}
  ul.clean li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border:2px solid var(--terra);border-radius:50%}
  .pillars h2{font-size:34px;margin-bottom:8px}
  .pnum{font-family:"Marcellus",serif;font-size:30px;color:var(--terra)}
  .pillars h3{font-size:26px;margin:4px 0 8px}
  .pillars p{font-size:18px;line-height:1.5;max-width:52ch}
  .quote blockquote{font-family:"Marcellus",serif;font-size:34px;line-height:1.25;max-width:24ch}
  .quote .cite{margin-top:22px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra);font-weight:700}
  .why h2{font-size:36px;margin-bottom:16px}
  .cta h2{font-size:46px;margin-bottom:14px}
  .cta p{font-size:20px;max-width:42ch;line-height:1.5}
  .cta .step{margin-top:20px;display:inline-block;font-size:16px;font-weight:800;letter-spacing:.06em;background:var(--terra);color:#fff;padding:14px 26px;border-radius:999px}
  .disclaimer{margin-top:26px;font-size:12.5px;line-height:1.5;color:var(--cream);opacity:.78;max-width:56ch}
  @media(max-width:640px){
    .cover h1{font-size:38px}.section h2{font-size:32px}.point h2{font-size:28px}
    .cta h2{font-size:32px}.quote blockquote{font-size:24px}.slide{padding:9% 8%}
  }
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:"cover", bg:"on-plum", kicker:"A Work Life by Design masterclass",
   h1:"Designed to Fit",
   sub:"Build a business around the life you actually want, not a life squeezed around the business.",
   by:"With Melissa Marsden"},

  {t:"point", bg:"on-cream", kicker:"Who this is for",
   h2:"You are a heart-led founder",
   paras:["You started this to build something that mattered and to live on your own terms.",
          "You are good at the work. The question is whether the business is being built around your life, or your life is quietly bending around the business."]},

  {t:"point", bg:"on-cream", kicker:"The trap",
   h2:"You built it. Now it runs you.",
   paras:["The calendar fills. The team needs you. The next launch is already here.",
          "Somewhere along the way the business stopped being the thing you designed and became the thing you serve."]},

  {t:"quote", bg:"on-plum",
   quote:"Rather than looking outward to predict the outcome, you turn inward to your identity. You base the decision on who you are, or who you want to be.",
   cite:"Adam Grant"},

  {t:"point", bg:"on-cream", kicker:"The reframe",
   h2:"More hustle will not fix it",
   paras:["A business that was never designed around you cannot be worked harder into fitting you.",
          "It has to be designed. On purpose. The same way a great workplace is designed, not left to happen by accident."]},

  {t:"section", bg:"on-plum", kicker:"Part one",
   h2:"A business built by default",
   lead:"Most founders inherit their business model, their week and their definition of success. Default is the real problem, not effort."},

  {t:"list", bg:"on-cream", kicker:"What default looks like",
   h2:"The symptoms",
   items:["Your week is a reaction to everyone else's priorities.",
          "Growth means more hours, so success quietly starts to cost you.",
          "You are the bottleneck, and you are also exhausted.",
          "You cannot remember the last decision you made from your values rather than the pressure."]},

  {t:"point", bg:"on-cream", kicker:"The cost",
   h2:"Autopilot has a price",
   paras:["Running on autopilot does not just risk burnout. It slowly disconnects the business from the reason you started it.",
          "The fix is not a new funnel or a harder quarter. It is a design decision."]},

  {t:"section", bg:"on-plum", kicker:"Part two",
   h2:"The Work Life by Design method",
   lead:"Three shifts that turn a business you serve into a business designed to serve the life you want."},

  {t:"pillars", bg:"on-cream", kicker:"Shift one", pnum:"01",
   h3:"Find your North Star",
   p:"Before strategy, get clarity on purpose and values, and on how you want to feel. Your North Star is the fixed point every later decision is measured against, so you stop optimising a business you never actually chose."},

  {t:"pillars", bg:"on-cream", kicker:"Shift two", pnum:"02",
   h3:"Align hearts, bodies and minds",
   p:"The same principle that builds a magnetic workplace builds a magnetic business. When how people feel, how they work and how they think are aligned, the business stops fighting itself and performance follows the design."},

  {t:"pillars", bg:"on-cream", kicker:"Shift three", pnum:"03",
   h3:"Build vision into strategy and systems",
   p:"Translate the North Star into a strategy, and the strategy into systems that run without you holding every thread. This is how you grow without the growth landing back on your own hours."},

  {t:"point", bg:"on-plum", kicker:"How it fits together",
   h2:"One blueprint",
   paras:["North Star sets the direction. Alignment makes the business cohere. Systems carry the load.",
          "Designed together, they are the difference between a business that fits your life and one that consumes it."]},

  {t:"section", bg:"on-plum", kicker:"Part three",
   h2:"Ambition, by design",
   lead:"Not less ambition. Ambition that finally has a shape you chose."},

  {t:"list", bg:"on-cream", kicker:"A business designed to fit",
   h2:"The shift you feel",
   items:["Your week reflects your priorities first, then everyone else's.",
          "Growth adds capacity, not just hours on your own calendar.",
          "Decisions trace back to your North Star, so they are faster and they hold.",
          "The business can run and keep its soul while you step back."]},

  {t:"why", bg:"on-plum", kicker:"Why me",
   h2:"Melissa Marsden",
   items:["More than 20 years designing high-performing environments for corporate and government organisations through my studio COMUNiTI.",
          "Three-time Telstra Business Women's Awards finalist, recognised in the Innovation Category for my workplace strategy framework.",
          "Author of The Next Workplace, and host of the Work Life by Design podcast.",
          "I now bring that same design discipline to founders who want a business that fits their life."]},

  {t:"cta", bg:"on-plum", kicker:"Design yours on purpose",
   h2:"Design yours on purpose",
   p:"If you are ready to stop serving the business and start designing one that fits your life, this is the work I do with founders inside Work Life by Design.",
   step:"Join the next group coaching intake",
   disclaimer:"This masterclass is educational. It shares a framework and my own experience. It is not a guarantee of any particular business or financial result. Outcomes vary with your market, your effort and your circumstances."}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide '+s.t+' '+s.bg;
  let inner = '<span class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</span>';
  if(s.kicker) inner += '<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='cover'){
    inner += '<h1>'+s.h1+'</h1><hr class="rule"><div class="sub">'+s.sub+'</div><div class="by">'+s.by+'</div>';
  } else if(s.t==='section'){
    inner += '<h2>'+s.h2+'</h2><div class="lead">'+s.lead+'</div>';
  } else if(s.t==='point'){
    inner += '<h2>'+s.h2+'</h2><hr class="rule">'+s.paras.map(p=>'<p>'+p+'</p>').join('');
  } else if(s.t==='list'){
    inner += '<h2>'+s.h2+'</h2><ul class="clean">'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  } else if(s.t==='pillars'){
    inner += '<div class="pnum">'+s.pnum+'</div><h3>'+s.h3+'</h3><p>'+s.p+'</p>';
  } else if(s.t==='quote'){
    inner += '<blockquote>'+s.quote+'</blockquote><div class="cite">'+s.cite+'</div>';
  } else if(s.t==='why'){
    inner += '<h2>'+s.h2+'</h2><ul class="clean">'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  } else if(s.t==='cta'){
    inner += '<h2>'+s.h2+'</h2><p>'+s.p+'</p><span class="step">'+s.step+'</span><div class="disclaimer">'+s.disclaimer+'</div>';
  }
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
