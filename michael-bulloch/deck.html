<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Complete Man — Men to Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f3f4f6;
    --panel:#e7e9ee;
    --ink:#1a1a1a;
    --muted:#4a4f57;
    --rule:#cfd4db;
    --accent:#2f3e4e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ground);color:var(--ink);font-family:"Newsreader",Georgia,serif}
  .deck{max-width:1040px;margin:0 auto}
  .slide{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 7vw;border-bottom:1px solid var(--rule);position:relative;
  }
  .kicker{font-family:"DM Sans",sans-serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:.78rem;color:var(--accent)}
  h1{font-family:"DM Sans",sans-serif;font-weight:800;font-size:clamp(2.4rem,6vw,4.4rem);
    line-height:1.02;letter-spacing:-.02em;margin:.5rem 0}
  h2{font-family:"DM Sans",sans-serif;font-weight:800;font-size:clamp(1.8rem,4vw,3rem);
    line-height:1.05;letter-spacing:-.015em;margin:.4rem 0}
  .sub{font-size:clamp(1.15rem,2.1vw,1.6rem);color:var(--muted);max-width:42ch;margin-top:.9rem}
  p.body{font-size:clamp(1.1rem,1.9vw,1.45rem);line-height:1.5;max-width:46ch;margin-top:1rem}
  ul{list-style:none;margin-top:1.4rem;display:grid;gap:.7rem;max-width:48ch}
  li{font-size:clamp(1.05rem,1.8vw,1.35rem);line-height:1.4;padding-left:1.6rem;position:relative}
  li:before{content:"";position:absolute;left:0;top:.62em;width:.6rem;height:.6rem;
    background:var(--accent)}
  .num{font-family:"DM Sans",sans-serif;font-weight:800;color:var(--accent);
    font-size:clamp(2.6rem,7vw,5rem);line-height:1}
  .pillar{display:flex;align-items:baseline;gap:1.2rem}
  .foot{position:absolute;bottom:3.2vh;left:7vw;font-family:"DM Sans",sans-serif;
    font-weight:500;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stack{display:grid;gap:.45rem;margin-top:1.4rem}
  .stack .row{display:flex;align-items:center;gap:1rem;font-family:"DM Sans",sans-serif;
    font-weight:700;font-size:clamp(1.1rem,2vw,1.5rem)}
  .stack .row span{color:var(--accent);width:1.6rem}
  .disc{font-size:.92rem;color:var(--muted);max-width:52ch;margin-top:1.6rem;font-style:italic}
  .cta-line{font-family:"DM Sans",sans-serif;font-weight:800;font-size:clamp(1.3rem,2.6vw,2rem);
    color:var(--accent);margin-top:1.1rem}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'Men to Mastery · A live masterclass',h:'The Complete Man',
   sub:'Mastering all six pillars of your life without trading one for another.'},

  {t:'who',kicker:'Who this is for',h:'The man who is winning at work',
   body:'You are ambitious. You build, you provide, you perform. From the outside it looks like it is all working. This hour is for the part of you that knows that is only half the story.'},

  {t:'trap',kicker:'The trap',h:'One pillar carries all the weight',
   body:'Most high performers pour everything into a single area and quietly let the rest erode. The body slips. The marriage goes thin. Purpose turns into noise. And it happens so slowly that you call it normal.'},

  {t:'reframe',kicker:'The reframe',h:'Winning in one area is not a life that works.',
   sub:'A full bank account next to an empty everything-else is not success. It is a trade you never agreed to make.'},

  {t:'part',kicker:'Part one',h:'Why single-domain men break',
   body:'When one pillar becomes your whole identity, every other part of life becomes a cost to be minimized. The math feels efficient. It is the exact math that hollows a man out.'},

  {t:'cost',kicker:'The cost of the trade',h:'What the trade actually buys',
   list:['The work gets the best of you; your family gets what is left.','Health becomes the thing you will fix "later."','Meaning gets outsourced to the next goal.','Rest feels like failure, so you never actually recover.']},

  {t:'part',kicker:'Part two',h:'The 6 Pillars',
   sub:'Six areas of a man\'s life, run not one at a time, but as one connected system.'},

  {t:'pillar',num:'01',h:'Mind',body:'Clarity and discipline. The ability to think straight under load and decide without flinching.'},
  {t:'pillar',num:'02',h:'Body',body:'Energy and vitality. The physical base that every other pillar borrows from.'},
  {t:'pillar',num:'03',h:'Soul',body:'Purpose and meaning. The reason underneath the effort, so the effort is not hollow.'},
  {t:'pillar',num:'04',h:'World',body:'Relationships, family and legacy. The people your life is actually for.'},
  {t:'pillar',num:'05',h:'Work',body:'Vocation and contribution. Not just income, but the mark your work leaves.'},
  {t:'pillar',num:'06',h:'Play',body:'Joy, recreation and adventure. The part most driven men cut first and miss most.'},

  {t:'integrate',kicker:'The principle',h:'Run all six as one system',
   body:'The pillars are not a checklist you rotate through. They feed each other. A strong body sharpens the mind. A clear soul steadies the work. When one is handled on purpose, the others get easier. That is mastery, and it is the opposite of balance-as-juggling.'},

  {t:'tenet',kicker:'The operating mindset',h:'FITFO',
   sub:'Figure It The Full Way Out. Ownership is the tenet underneath all six pillars. No one is coming to run your life for you, and that is good news, because it means it is yours to run.'},

  {t:'part',kicker:'Part three',h:'A week that finally holds',
   body:'A man running all six pillars does not do more. He does the right things on purpose. The week has room in it. The wins at work no longer cost him at home. He is harder to knock over, because he is not standing on one leg.'},

  {t:'why',kicker:'Why learn this here',h:'Built from the work, not a theory',
   body:'Men to Mastery is 120-plus podcast episodes, a private Tribe of men doing this together, and years of coaching ambitious men through exactly this shift. The 6 Pillars are the system that came out of that work.'},

  {t:'recap',kicker:'The whole man, in one view',h:'Six pillars. One life.',
   stack:[['01','Mind'],['02','Body'],['03','Soul'],['04','World'],['05','Work'],['06','Play']]},

  {t:'cta',kicker:'Your next step',h:'Go from one pillar to all six',
   body:'If you want help building this into your own life, the next step is the 12-month Men to Mastery private coaching. It is an application, because the work is personal and the room is small.',
   cta:'Apply to work with me inside Men to Mastery',
   disc:'This masterclass is educational. It is not financial, medical, legal, or therapeutic advice, and it makes no guarantee of any specific result. Outcomes vary and depend on the work you put in.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide';
  let html='';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='pillar'){
    html+='<div class="pillar"><div class="num">'+s.num+'</div><h2>'+s.h+'</h2></div>';
    if(s.body) html+='<p class="body">'+s.body+'</p>';
  } else {
    html+=(i===0?'<h1>':'<h2>')+s.h+(i===0?'</h1>':'</h2>');
    if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
    if(s.body) html+='<p class="body">'+s.body+'</p>';
  }
  if(s.list){ html+='<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(s.stack){ html+='<div class="stack">'+s.stack.map(r=>'<div class="row"><span>'+r[0]+'</span>'+r[1]+'</div>').join('')+'</div>'; }
  if(s.cta) html+='<div class="cta-line">'+s.cta+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  html+='<div class="foot">Men to Mastery · The 6 Pillars</div>';
  sec.innerHTML=html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
