<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Becoming the CEO Your Company Now Needs — Mike Lewis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ecebe4; --panel:#f3f1ea; --ink:#121418; --accent:#232730;
    --muted:#6b6e76; --rule:#d7d4c7;
    --serif:"Newsreader",Georgia,serif; --sans:"Geist",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  #deck{max-width:1120px;margin:0 auto;padding:40px 22px 90px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 22px;min-height:432px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .k{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em;max-width:20ch}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-.01em;max-width:22ch}
  .sub{font-size:20px;line-height:1.5;color:#2c2f36;margin-top:22px;max-width:46ch}
  .p{font-size:19px;line-height:1.6;color:#2c2f36;margin-top:16px;max-width:52ch}
  ul{list-style:none;margin-top:24px;max-width:54ch}
  li{font-size:19px;line-height:1.45;padding:12px 0 12px 26px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:0}
  li::before{content:"";position:absolute;left:0;top:21px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .big{font-family:var(--serif);font-weight:700;font-size:62px;line-height:1.02;letter-spacing:-.02em;max-width:16ch}
  .part .k{color:var(--accent)}
  .part h2{font-size:30px;color:var(--muted);font-weight:400}
  .part h1{margin-top:6px}
  .lab{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px;max-width:60ch}
  .cell{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
  .cell b{font-family:var(--serif);font-size:22px;display:block;margin-bottom:6px}
  .cell span{font-size:16px;color:#2c2f36;line-height:1.4}
  .foot{position:absolute;left:60px;bottom:22px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
  .num{position:absolute;right:26px;bottom:22px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .disc{margin-top:26px;font-size:14px;color:var(--muted);line-height:1.5;max-width:56ch;border-top:1px solid var(--rule);padding-top:16px}
  .cta h1{font-size:58px}
  @media(max-width:640px){.slide{padding:38px 26px}h1,.cta h1{font-size:34px}.big{font-size:40px}h2{font-size:28px}.grid4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', k:"A live masterclass with Mike Lewis",
    h:"Becoming the CEO Your Company Now Needs",
    sub:"The operator's playbook for the founder-to-CEO transition. Built from twenty years of building, exiting, and scaling real companies."},

  {t:'list', k:"Who this is for",
    h:"You already built the thing. Now the job is changing under you.",
    list:["Founders past product-market fit, scaling a real team","Leaders who feel every decision still routes through them","CEOs on paper who are still operating like the first employee"]},

  {t:'big', k:"The trap", big:"The job changed and nobody handed you the new one."},

  {t:'p', k:"The trap, continued",
    h:"You were hired for one job. You now have a different one.",
    p:"At first you were the inventor, spotting the need no one else saw and doing whatever it took. That is what got you here. It is also the exact habit that makes you the bottleneck now. The company does not need more of your output. It needs you to build the machine that produces it without you."},

  {t:'part', k:"Part one", h2:"The real problem", h:"You scaled the product. You did not scale yourself."},

  {t:'list', k:"The symptoms",
    h:"The view from inside the bottleneck",
    list:["The team waits for you before they move","Your calendar is reactive, set by whoever asked last","The board meeting feels like a performance, not a plan","You are busiest right before every milestone that matters"]},

  {t:'big', k:"A better operating system", big:"Be. Do. Have."},

  {t:'p', k:"Be. Do. Have.",
    h:"Most founders run the loop backwards.",
    p:"The default is Have, then Do, then Be: once I raise the round, then I will act like a CEO, then I will feel like one. That loop makes your identity a hostage to the next milestone, which is why it never arrives. Flip it. Decide who you are choosing to be, let that drive what you do, and the results follow. This is how you stay ambitious without letting achievement define you."},

  {t:'p', k:"On your team",
    h:"Expectations are crap. Agreements are gold.",
    p:"Almost every time you are disappointed in someone, it traces back to an expectation you never said out loud, not a failure on their part. Expectations are private and assumed. Agreements are explicit and mutual. Trade one for the other and most of the friction on your team simply stops, because now everyone knows what true looks like."},

  {t:'p', k:"When you communicate",
    h:"Get your why's and what's in the right order.",
    p:"Before anyone cares about your solution, they have to care about the problem. Founders invert this constantly, leading investors and their own teams straight into the what. Start with the why, earn the problem, and the what lands on prepared ground. It is the difference between a pitch that convinces and one that is merely heard."},

  {t:'part', k:"Part two", h2:"The operating system", h:"Four moves that turn a founder into a CEO."},

  {t:'grid', k:"The system",
    h:"What we work on, in order",
    cells:[["Leverage","Build the team and delegate real ownership, so you stop being the single point of failure."],["Milestone","Pick the one milestone that matters, then work backward to what has to be true."],["GTM","Diagnose the growth system end to end instead of patching the loudest leak."],["Team","Hire ahead of the need and build the leadership bench the next stage requires."]]},

  {t:'p', k:"Leverage",
    h:"Stop being the bottleneck.",
    p:"Leverage is not doing more. It is building people and systems that own outcomes without you in the room. The test is simple: if you took a two-week silence, what would break? Everything that breaks is a place you have not yet built leverage. We make that list short on purpose."},

  {t:'p', k:"Milestone",
    h:"Pick the one that matters. Work backward.",
    p:"Raise, profitability, or acquisition, there is usually one milestone that defines the next chapter. Name it, then ask what has to be true for it to happen, and keep asking until the answer is a list of things you can actually do this quarter. Most founders carry ten priorities. CEOs carry one, in depth."},

  {t:'p', k:"Go to market",
    h:"Diagnose the whole system, not the loudest leak.",
    p:"Growth is a system: who the customer is, the problem they feel, the positioning, how demand gets created, and the playbook that makes a sale repeatable. When it stalls, the instinct is to fix the loudest part. The operator's move is to read the whole system first, because the real constraint is rarely where the noise is."},

  {t:'p', k:"Team",
    h:"Hire ahead of the stage you are in.",
    p:"The team that got you here is not automatically the team that gets you there, and the hardest judgment is knowing the difference without burning the loyalty that built the company. We work on the bench the next stage needs, the leaders you promote, and the ones you hire over, done with candor and care."},

  {t:'big', k:"How we start", big:"Three hours on foot. No deck. No laptop."},

  {t:'p', k:"The hike",
    h:"The real problem is rarely the one on the agenda.",
    p:"Every engagement starts the same way, on foot, walking, with no slides between us. It is the fastest way I know to get past the tidy version of the problem to the actual one. Once we both see it clearly, the frameworks above are just how we go get it."},

  {t:'part', k:"Part three", h2:"On the other side of the jump", h:"A week in the life, once you have made the move."},

  {t:'list', k:"After the shift",
    h:"What changes when you make the move",
    list:["Your week is built around the one milestone, not the inbox","The team owns outcomes and brings you decisions, not tasks","The board meeting is a plan you already believe in","You are building the company instead of being consumed by it"]},

  {t:'p', k:"Why listen to me",
    h:"I have done this from the operator's seat.",
    p:"I founded and exited three companies, and I led product at Airbnb, scaling Airbnb for Work from nothing to a real business. I am not coaching from a book I read. I coach a small number of founders at a time, in the room, because the founder-to-CEO jump is the one I have actually made and watched others make."},

  {t:'cta', k:"Work with me",
    h:"Ready to make the jump from founder to CEO?",
    sub:"This masterclass is the map. If you want a guide for the territory, apply to work with me directly at mikelewis.me.",
    disc:"This masterclass is educational. No income, role, or business result is guaranteed. Results vary and depend on your own effort, team, market, and circumstances."}
];

const deck = document.getElementById('deck');
S.forEach(function(s,i){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='part'?' part':'') + (s.t==='cta'?' cta':'');
  let h = '';
  if(s.k) h += '<div class="k">'+s.k+'</div>';
  if(s.t==='part' && s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.big) h += '<div class="big">'+s.big+'</div>';
  if(s.h) h += (s.t==='title'||s.t==='cta'||s.t==='part') ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>';
  if(s.sub) h += '<div class="sub">'+s.sub+'</div>';
  if(s.p) h += '<div class="p">'+s.p+'</div>';
  if(s.list){ h += '<ul>'; s.list.forEach(function(x){ h += '<li>'+x+'</li>'; }); h += '</ul>'; }
  if(s.cells){ h += '<div class="grid4">'; s.cells.forEach(function(c){ h += '<div class="cell"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>'; }); h += '</div>'; }
  if(s.disc) h += '<div class="disc">'+s.disc+'</div>';
  h += '<div class="foot">mikelewis.me</div><div class="num">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
