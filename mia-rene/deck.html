<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The God-Centered Business, a masterclass with Mia Rene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf0f4;        /* pale blush ground, derived from her dominant brand pink #f94faa */
    --panel:#fffafc;     /* warm pink-tinted white */
    --blush:#f6e6ec;     /* card tint from her pink family */
    --ink:#3a2e33;       /* warm near-black */
    --muted:#7c6f73;     /* warm grey, from her #606060 family */
    --accent:#d1437f;    /* deepened brand pink, from her dominant #f94faa */
    --gold:#c79a3a;      /* from her gold #f0ce63 */
    --rule:#ecdfe4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Raleway",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 72px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 60px;margin:20px 0;box-shadow:0 1px 0 rgba(58,46,51,.03),0 18px 40px -30px rgba(58,46,51,.35);min-height:440px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide.title{background:linear-gradient(160deg,#fffafc 0%,var(--blush) 100%)}
  .kicker{font-family:"Raleway";font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  .kicker .num{color:var(--muted);margin-right:14px}
  h1{font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(32px,5vw,54px);line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"Playfair Display",serif;font-weight:600;font-size:clamp(26px,3.6vw,40px);line-height:1.12;letter-spacing:-.01em}
  .lede{font-size:clamp(17px,2vw,21px);color:var(--muted);margin-top:22px;max-width:46ch}
  .body{font-size:18px;margin-top:22px;max-width:58ch}
  .body p+p{margin-top:14px}
  .keyline{width:64px;height:3px;background:var(--accent);border-radius:3px;margin:22px 0 2px}
  .keyline.gold{background:var(--gold)}
  ul.points{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:62ch}
  ul.points li{padding-left:30px;position:relative;font-size:18px}
  ul.points li:before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .fourfear{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
  .fourfear .card{background:var(--blush);border:1px solid var(--rule);border-radius:12px;padding:20px 22px}
  .fourfear .card .n{font-family:"Playfair Display",serif;font-size:22px;color:var(--accent);font-weight:700}
  .fourfear .card h3{font-family:"Playfair Display",serif;font-weight:600;font-size:20px;margin:4px 0 8px}
  .fourfear .card p{font-size:15px;color:var(--muted)}
  .pill{display:inline-block;font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--accent);background:var(--blush);border:1px solid var(--rule);padding:6px 14px;border-radius:999px;margin-bottom:22px;width:fit-content}
  .verse{font-family:"Playfair Display",serif;font-style:italic;font-size:clamp(20px,2.6vw,26px);line-height:1.35;max-width:42ch;color:var(--ink)}
  .verse .ref{display:block;font-style:normal;font-family:"Raleway";font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-top:18px}
  .two{display:grid;grid-template-columns:1fr;gap:10px}
  .two .label{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted);margin-bottom:8px}
  .cta .btn{display:inline-block;margin-top:28px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;letter-spacing:.02em;padding:16px 34px;border-radius:999px;text-decoration:none;width:fit-content}
  .disclaimer{margin-top:26px;font-size:12.5px;color:var(--muted);max-width:60ch;line-height:1.45}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:16px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted);letter-spacing:.04em}
  .brandname{font-family:"Playfair Display",serif;font-weight:600;color:var(--ink)}
  @media(max-width:720px){.slide{padding:38px 26px}.fourfear{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   pill:'A LIVE MASTERCLASS WITH MIA RENE',
   h:'The God-Centered Business',
   lede:'How faith-led women move past the fear that keeps them small and build a business that actually lasts.'},

  {t:'who',
   kicker:'Who this is for',
   h:'You already feel the calling. You just keep hitting the same wall.',
   points:[
     'You are a woman of faith with a real business and a real message.',
     'You have done the courses, the strategy, the planner. The work is not the problem.',
     'Every time you get close to the next level, something in you pulls back.',
     'You wonder if wanting more is even allowed when God is supposed to be the center.'
   ]},

  {t:'cost',
   kicker:'The quiet cost',
   h:'The gap between your calling and your output has a name.',
   body:[
     'It is the podcast episode you did not publish. The offer you kept cheap. The call you did not ask for.',
     'None of that is a strategy problem. Every one of them is a fear decision wearing a reasonable disguise.',
     'Add them up over a year and you can see the exact size of the business fear has let you build.'
   ]},

  {t:'reframe',
   kicker:'The hard truth',
   verse:'The thing holding your business back is almost never the strategy. It is the fear you have quietly agreed to live with.',
   note:'Most coaching tries to fix your funnel. We start with the ceiling you cannot see.'},

  {t:'myth',
   kicker:'The myth we are leaving behind',
   h:'More strategy is not the thing standing between you and the next level.',
   body:[
     'If information were the answer, you would already be there. You have never been short on tactics.',
     'The women who break through are not the ones with the best funnel. They are the ones who stopped letting fear vote.',
     'So we are going to do the deeper work first, and then the strategy finally gets to do its job.'
   ]},

  {t:'part',
   kicker:'Part One',
   label:'THE REAL CEILING',
   h:'Fear is not a feeling to manage. It is a decision you keep making.',
   body:[
     'Fear does not show up wearing a name tag. It shows up as "I will launch when it is ready." As "I do not want to be salesy." As "who am I to charge that."',
     'Left unexamined, it sets the exact size of your business and tells you the number was your idea.',
     'You cannot out-strategy a ceiling you have not named. So first, we name it.'
   ]},

  {t:'framework-intro',
   kicker:'Part Two: the framework',
   h:'The four fears that stall faith-led women in business',
   lede:'My Overcome Fear framework. Four fears, named plainly, each one met with what Scripture actually says about it.'},

  {t:'fourfear',
   kicker:'The Overcome Fear framework',
   h:'Name it, then move through it',
   cards:[
     {n:'01',k:'Fear of rejection',d:'The quiet "what will they think" that keeps your offer vague and your voice small. We separate your worth from their yes.'},
     {n:'02',k:'Fear of failure',d:'The belief that one wrong move disqualifies you. We trade perfect for faithful and let data, not shame, lead the next step.'},
     {n:'03',k:'Fear of success',d:'The one nobody admits: the worry that growth will cost your peace, your family, your faith. We build a business that protects all three.'},
     {n:'04',k:'Fear of being seen',d:'The fear behind public speaking and posting. We turn visibility into service, so showing up stops feeling like exposure.'}
   ]},

  {t:'deepen',
   kicker:'Fear 01, up close',
   h:'Rejection feels like a verdict. It is only information.',
   body:[
     'When you fear rejection, you keep your message soft enough that nobody could ever say no to it, and nobody ever says yes either.',
     'A clear offer will get told no. That is not failure, that is the offer doing its job of finding the right people.',
     'Your worth was settled long before anyone saw your pricing page. We build from that, not toward it.'
   ]},

  {t:'deepen2',
   kicker:'Fear 03, up close',
   h:'The fear of success is the one keeping most of you stuck.',
   body:[
     'You are not afraid you will fail. Deep down you are afraid you will succeed and lose yourself doing it.',
     'So you self-sabotage right at the threshold and call it being responsible.',
     'God-centered success means the growth and the peace are not a trade. You get to have both, on purpose.'
   ]},

  {t:'verse',
   verse:'For God has not given us a spirit of fear, but of power and of love and of a sound mind.',
   ref:'2 Timothy 1:7'},

  {t:'pivot',
   kicker:'Part Two, continued',
   label:'FROM HUSTLE TO SURRENDER',
   h:'I built the six-figure version the hustle way first. It nearly broke me.',
   body:[
     'I hit a six-figure month and a wall of burnout in the same season. I had the revenue and none of the peace.',
     'What rebuilt the business was not a new tactic. It was putting God back at the center and letting that reorder everything else.',
     'That is the shift this masterclass is really about. The strategy works a lot better once the center is right.'
   ]},

  {t:'system',
   kicker:'God Centered Success',
   h:'What changes when God is the center, not the afterthought',
   points:[
     'Your offer gets clear because you stop hiding behind modest.',
     'Your visibility becomes service, so a podcast or a post stops feeling like bragging.',
     'Your pricing reflects the transformation, not your fear of being too much.',
     'Your growth has guardrails, so more clients does not mean less of your life.'
   ]},

  {t:'visibility',
   kicker:'Where it gets practical',
   h:'This is why your voice is the fastest path in.',
   body:[
     'Once fear of being seen loses its grip, being heard becomes the easiest marketing you own.',
     'A weekly podcast or a simple message, shared consistently, lets the right women find you and trust you before you ever ask for anything.',
     'The mechanics are simple. Everything upstream of them is what we fixed first.'
   ]},

  {t:'part',
   kicker:'Part Three',
   label:'A BUSINESS THAT CAN HOLD YOUR LIFE',
   h:'A business that grows on purpose, at the pace your faith and family can hold.',
   body:[
     'This is not about doing more. It is about doing the right few things without the fear tax you have been quietly paying.',
     'The women who do this stop launching from panic and start building from conviction.',
     'The podcast, the offer, the audience: all of it gets easier when the fear is no longer driving.'
   ]},

  {t:'why',
   kicker:'Why me',
   h:'Mia Rene',
   body:[
     'Faith and business coach, host of the God Centered Success podcast, and founder of the Faith and Business Movement.',
     'I went from losing my college fund at 17 and deciding to rely only on myself, to a six-figure online business, to burnout, to rebuilding everything with God at the center.',
     'Now I help faith-led women entrepreneurs do the same: move past fear and build a business that honors their calling and their family.'
   ]},

  {t:'bridge',
   kicker:'The invitation',
   verse:'You do not need more hustle. You need to stop letting fear set the size of your calling.',
   note:'If this is the work you are ready for, here is the next step.'},

  {t:'cta',
   kicker:'Your next step',
   h:'Come build the God-centered version with me.',
   body:[
     'Faith and Business Breakthrough is my application-only coaching for women ready to move past fear and grow a business rooted in faith.',
     'If today named something real for you, apply and let us talk about what breaking through looks like for you.'
   ],
   btn:'Apply for Faith & Business Breakthrough',
   disclaimer:'This masterclass is for education and encouragement only. It is not a guarantee of income or business results, which vary based on many factors including your effort, market, and circumstances. Nothing here is financial, legal, or professional advice.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const n = String(i+1).padStart(2,'0');
  const total = String(S.length).padStart(2,'0');
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t==='title'?'title':'') + (s.t==='cta'?' cta':'');
  let inner = '';
  if(s.pill) inner += `<span class="pill">${s.pill}</span>`;
  if(s.kicker) inner += `<div class="kicker"><span class="num">${n} / ${total}</span>${s.kicker}</div>`;
  if(s.label) inner += `<div class="two"><div class="label">${s.label}</div>${s.h?`<h2>${s.h}</h2>`:''}<div class="keyline"></div></div>`;
  else if(s.h && s.t==='title') inner += `<h1>${s.h}</h1>`;
  else if(s.h) inner += `<h2>${s.h}</h2>`;
  if(s.lede) inner += `<p class="lede">${s.lede}</p>`;
  if(s.verse) inner += `<div class="keyline gold"></div><p class="verse">${s.verse}${s.ref?`<span class="ref">${s.ref}</span>`:''}</p>`;
  if(s.body) inner += `<div class="body">${s.body.map(p=>`<p>${p}</p>`).join('')}</div>`;
  if(s.points) inner += `<ul class="points">${s.points.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  if(s.cards){ inner += `<div class="fourfear">${s.cards.map(c=>`<div class="card"><div class="n">${c.n}</div><h3>${c.k}</h3><p>${c.d}</p></div>`).join('')}</div>`; }
  if(s.note) inner += `<p class="lede" style="margin-top:20px">${s.note}</p>`;
  if(s.btn) inner += `<a class="btn" href="#">${s.btn}</a>`;
  if(s.disclaimer) inner += `<p class="disclaimer">${s.disclaimer}</p>`;
  inner += `<div class="foot"><span class="brandname">Mia Rene &middot; God Centered Success</span><span>${n} / ${total}</span></div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
