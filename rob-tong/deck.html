<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 4-Drill Practice — a Youth Baseball Edge masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8f3; --panel:#ffffff; --rule:#d7e0cf;
    --accent:#2b821d; --ink:#11577e; --text:#1f2a1c; --muted:#5c6b55;
    --display:'Montserrat',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-left:6px solid var(--accent);
    border-radius:10px;padding:40px 44px;margin:0 0 20px;position:relative;
    background-image:repeating-linear-gradient(to bottom,transparent,transparent 37px,#eef2ea 37px,#eef2ea 38px);
    background-position:0 92px}
  .slide .num{position:absolute;top:16px;right:22px;font-family:var(--display);font-weight:700;
    font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .kick{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:14px}
  h1{font-family:var(--display);font-weight:800;color:var(--ink);font-size:46px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;color:var(--ink);font-size:30px;line-height:1.12}
  .sub{font-size:20px;color:var(--muted);margin-top:16px;font-weight:600}
  .body{font-size:19px;margin-top:16px;max-width:58ch}
  .part{text-align:center;border-left-color:var(--ink);background-image:none}
  .part h2{font-size:34px;color:var(--accent)}
  .part .kick{color:var(--ink)}
  .pillar h2{font-size:26px}
  .pillar .tag{font-family:var(--display);font-weight:800;color:var(--accent);font-size:15px;
    letter-spacing:.08em;text-transform:uppercase}
  .cta{border-left-color:var(--ink)}
  .cta .body{font-size:20px}
  .disc{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted);max-width:60ch}
  .title-slide{background-image:none;border-left-width:10px;padding:64px 44px}
  .brandline{margin-top:28px;font-family:var(--display);font-weight:700;color:var(--ink);font-size:16px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', k:'Youth Baseball Edge masterclass',
    h:'The 4-Drill Practice',
    s:'How to develop better youth ballplayers in the time you already have',
    brand:'A live masterclass with Rob Tong'},

  {t:'who', k:'Who this is for',
    h:'The volunteer running Tuesday night',
    b:'Youth baseball coaches, and the parents who help run practice. One hour, maybe ninety minutes, a dozen kids, and no time to waste on things that do not work.'},

  {t:'who', k:'The trap',
    h:'So you add another drill',
    b:'Then another. You collect drills the way other coaches do, practice creeps toward ninety minutes, and on Saturday the same mistakes keep showing up.'},

  {t:'reframe', k:'The hard reframe',
    h:'More drills is the problem, not the fix',
    b:'Volume feels like coaching. It is not. Most of what fills a youth practice never shows up in an actual game. Busy is not the same as better.'},

  {t:'part', k:'Part one', h:'Why practice stops transferring'},

  {t:'who', k:'The equal-time myth',
    h:'Thirds do not win games',
    b:'Split the hour into equal parts hitting, throwing, and fielding, and you spend most of it on reps that barely move the score. Equal time is a scheduling habit, not a plan.'},

  {t:'framework', k:'Framework', tag:'The 80/20 Practice Rule',
    h:'A small slice drives most of the result',
    b:'A handful of the things you could work on produce almost all of what wins youth games. Find that slice. Give it the clock. Let the rest go.'},

  {t:'framework', k:'The filter', tag:'The Saturday test',
    h:'If it does not show up in a game, it comes out of practice',
    b:'One question for every drill on your plan. Does this appear on Saturday? If the honest answer is no, it does not earn a spot on Tuesday.'},

  {t:'part', k:'Part two', h:'The method'},

  {t:'framework', k:'The core idea', tag:'The Only 4 Drills',
    h:'You do not need a library',
    b:'You need the four movements a game actually tests, run with purpose, every single practice. Fewer drills, taught well, beat a binder of drills taught in a rush.'},

  {t:'pillar', k:'Pillar one', tag:'Subtract to the four',
    h:'Cut the pile down to what transfers',
    b:'Start by removing, not adding. Keep only what survives the Saturday test. Four drills run with full attention develop players faster than twelve run in a blur.'},

  {t:'pillar', k:'Pillar two', tag:'Rep the right mechanics',
    h:'Right behavior, not more reps',
    b:'Teach what elite infielders actually do. Funnel the routine groundball into your body instead of backhanding it. The win is the correct movement, repeated, not a bigger pile of repetitions.'},

  {t:'pillar', k:'Pillar three', tag:'Coach the words',
    h:'Drop the cues that hurt',
    b:'Throw strikes and get more hits tell a young player nothing he can actually do. Precise language gives him one clear action for the next pitch. The words you pick change the result.'},

  {t:'pillar', k:'Pillar four', tag:'Separate classroom from field',
    h:'Teach the idea off the clock',
    b:'Borrow from the college programs. Explain the concept before practice so field time is spent moving, not standing in a line being talked at. Protect the reps.'},

  {t:'part', k:'Part three', h:'Tuesday night, rebuilt'},

  {t:'who', k:'The rebuild',
    h:'A sixty-minute practice that actually develops players',
    b:'Four drills. The right words. Every kid moving the whole time. You walk off the field knowing exactly what got better and what to work on next.'},

  {t:'who', k:'Why I teach this',
    h:'I learned it the hard way',
    b:'I am Rob Tong, a dad of seven. I started coaching tee-ball knowing almost nothing and found out fast that youth baseball is drowning in drills and bad information. Youth Baseball Edge is where I cut the noise down to what works.'},

  {t:'who', k:'On the other side',
    h:'What changes for your team',
    b:'A practice plan you can run without second-guessing it, players who get visibly better week to week, and your evenings back. Simpler for you, better for them.'},

  {t:'cta', k:'Where to start',
    h:'Take the method to your team',
    b:'Start free with the guide: The Only Drills You Will Ever Need. There are only four. Then bring the whole method to your team with GamePlan, my coaching app for practice plans and drills.',
    disc:'Educational content only. No outcome is guaranteed. Results vary by player, age, effort, and reps. This masterclass is taught live.'}
];

const deck=document.getElementById('deck');
S.forEach((sl,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(sl.t==='title'?'title-slide':sl.t);
  let html='<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(sl.k) html+='<div class="kick">'+sl.k+'</div>';
  if(sl.tag) html+='<div class="tag">'+sl.tag+'</div>';
  html+= (sl.t==='title') ? '<h1>'+sl.h+'</h1>' : '<h2>'+sl.h+'</h2>';
  if(sl.s) html+='<div class="sub">'+sl.s+'</div>';
  if(sl.b) html+='<div class="body">'+sl.b+'</div>';
  if(sl.brand) html+='<div class="brandline">'+sl.brand+'</div>';
  if(sl.disc) html+='<div class="disc">'+sl.disc+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
