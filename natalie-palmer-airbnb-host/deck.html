<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Host Like A Mother Method | Natalie Palmer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --cream:#fffaf1;
    --panel:#fffdf8;
    --rule:#ece2cf;
    --ink:#3a2f17;
    --ink-soft:#6f6346;
    --gold:#bd9b29;
    --terra:#db523a;
    --blush:#ffdbd6;
  }
  html,body{height:100%}
  body{
    font-family:'Poppins',-apple-system,sans-serif;
    background:var(--cream);
    color:var(--ink);
    overflow:hidden;
  }
  #deck{position:relative;width:100vw;height:100vh}
  .slide{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    padding:8vh 10vw;
    opacity:0;
    transition:opacity .35s ease;
  }
  .slide.active{display:flex;opacity:1}
  .eyebrow{
    font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
    margin-bottom:22px;
  }
  h1{font-family:'Bree Serif',Georgia,serif;font-weight:400;font-size:clamp(34px,6vw,68px);line-height:1.08;letter-spacing:-.01em;color:var(--ink)}
  h2{font-family:'Bree Serif',Georgia,serif;font-weight:400;font-size:clamp(28px,4.6vw,50px);line-height:1.12;color:var(--ink);margin-bottom:22px}
  .sub{font-size:clamp(17px,2.1vw,24px);color:var(--ink-soft);font-weight:300;line-height:1.5;margin-top:26px;max-width:30ch}
  p.body{font-size:clamp(16px,1.9vw,22px);color:var(--ink-soft);font-weight:300;line-height:1.6;max-width:40ch;margin-bottom:14px}
  ul{list-style:none;margin-top:10px}
  li{font-size:clamp(16px,1.9vw,22px);color:var(--ink-soft);font-weight:300;line-height:1.5;padding-left:30px;position:relative;margin-bottom:16px;max-width:42ch}
  li::before{content:"";position:absolute;left:0;top:.6em;width:12px;height:12px;border-radius:50%;background:var(--terra)}
  .phase-num{font-family:'Bree Serif',serif;font-size:clamp(15px,1.7vw,18px);color:var(--terra);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
  .big-quote{font-family:'Bree Serif',serif;font-size:clamp(28px,4.4vw,52px);line-height:1.18;color:var(--ink);max-width:22ch}
  .accentbar{width:64px;height:6px;background:var(--gold);border-radius:3px;margin-bottom:34px}
  .presenter{margin-top:40px;font-size:15px;color:var(--ink-soft);font-weight:400}
  .presenter strong{color:var(--ink);font-weight:600}
  .part-label{display:flex;align-items:center;gap:18px}
  .part-label .dot{width:14px;height:14px;background:var(--terra);border-radius:50%}
  .cardrow{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:26px 24px;max-width:17ch;box-shadow:0 2px 0 var(--blush)}
  .card h3{font-family:'Bree Serif',serif;font-weight:400;font-size:20px;color:var(--terra);margin-bottom:10px}
  .card p{font-size:15px;color:var(--ink-soft);font-weight:300;line-height:1.45}
  .disclaimer{margin-top:34px;font-size:13px;color:var(--ink-soft);font-weight:300;max-width:52ch;line-height:1.5;font-style:italic}
  .cta-btn{display:inline-block;margin-top:30px;background:var(--terra);color:#fff;font-weight:600;font-size:18px;padding:16px 34px;border-radius:999px;letter-spacing:.01em}
  .nav{position:fixed;bottom:22px;right:28px;font-size:13px;color:var(--ink-soft);font-family:'Poppins',sans-serif;font-weight:400;z-index:10}
  .progress{position:fixed;bottom:0;left:0;height:5px;background:var(--gold);transition:width .3s ease;z-index:10}
  .hint{position:fixed;bottom:22px;left:28px;font-size:12px;color:var(--ink-soft);opacity:.7;z-index:10}
</style>
</head>
<body>
<div id="deck"></div>
<div class="progress" id="prog"></div>
<div class="nav" id="nav"></div>
<div class="hint">Use arrow keys or click to advance</div>
<script>
const S = [
  {t:'title'},
  {t:'audience',eyebrow:'Who this is for',h2:'For the host who feels chained to the listing',body:[
    'You hosted for freedom. For a little extra income, maybe a lot.',
    'New or experienced, one property or five, this is for the host who wants the income without being on call around the clock.']},
  {t:'trap',eyebrow:'The trap',h2:'Somewhere along the way, you became the front desk',body:[
    'The 11pm "how do I work the TV" message.',
    'The last-minute cleaner scramble. The pricing you are guessing at.',
    'The vacation you cannot take because nobody else knows how your place runs.']},
  {t:'dark',dark:'The problem was never your effort. It is that you built yourself a job, not a system.'},
  {t:'part',part:'Part One',h2:'Why hosting harder caps your income'},
  {t:'problem',eyebrow:'The core problem',h2:'Three things quietly eat all your time',cards:[
    {h:'Guest messages',p:'The same questions, answered by hand, at every hour.'},
    {h:'Turnovers',p:'Chasing cleaners, checking photos, hoping it is ready.'},
    {h:'Pricing',p:'Nightly rates set by gut feel, leaving money on the table.'}]},
  {t:'ceiling',eyebrow:'The ceiling',h2:'You cannot scale a property you have to babysit',body:[
    'Every new listing adds the same manual load on top of the last one.',
    'So most hosts stall at one or two, convinced the only lever left is working more hours.',
    'There is another lever. It is the system.']},
  {t:'part',part:'Part Two',h2:'The Host Like A Mother Method'},
  {t:'method',eyebrow:'The method',h2:'Five phases, built to run without you on-site',body:[
    'The same roadmap I use to run my own listings remotely, in a few hours a week.',
    'It takes a host from overwhelm to a calm, fully-booked business.']},
  {t:'phase',phase:'Phase 0',h2:'Millionaire Mindset',body:[
    'Before the property, the owner. The money beliefs and ownership habits that let you treat hosting like the asset it is, not a side hustle you are apologizing for.']},
  {t:'phase',phase:'Phase 1',h2:'Get The Property',body:[
    'Financing and deal analysis that works for any market and budget.',
    'Including the fastest on-ramp of all: co-hosting a property you do not even own, with the exact owner-pitch and contract I use.']},
  {t:'phase',phase:'Phase 2',h2:'Get The Systems',body:[
    'The heart of it. Design, SOPs, automations, saved-reply scripts and turnover checklists.',
    'This is the phase that turns a 40-hour job into a few hours a week you can do from your phone.']},
  {t:'phase',phase:'Phase 3',h2:'Get The Bookings',body:[
    'Calendar optimization, pricing strategy and the listing tweaks that keep you booked at higher rates while the hosts around you discount.']},
  {t:'phase',phase:'Phase 4',h2:'Protect It',body:[
    'Guest screening, the right insurance, and the legal protection that keeps one bad booking from undoing a year of work.']},
  {t:'part',part:'Part Three',h2:'What it actually looks like'},
  {t:'week',eyebrow:'A week in the life',h2:'A few hours, from wherever you are',body:[
    'Check-ins handle themselves. Guests get answers before they have to ask.',
    'Your cleaner runs off a checklist, not a phone call.',
    'You glance at the numbers over coffee, and get on with your day.']},
  {t:'whyme',eyebrow:'Why me',h2:'I built this because I needed it',body:[
    'I put my family\'s Big Bear cabin on Airbnb in 2017. A few years later it was my full-time career.',
    'Today I run about ten listings remotely as a stay-at-home mom, I am a long-time Superhost and an Airbnb Ambassador, and I share the whole playbook on No Vacancy, a top 1% podcast.']},
  {t:'recap',eyebrow:'The whole method',h2:'From overwhelm to fully booked',body:[
    'Mindset. Property. Systems. Bookings. Protection.',
    'Five phases, one calm business you actually own your time inside of.']},
  {t:'cta',eyebrow:'Your next step',h1:'Ready to host like a mother?',
    body:['If you want the full roadmap, with my systems, scripts and templates and weekly live coaching, applications for the Host Like A Mother mentorship are open.'],
    cta:'Apply for the mentorship',
    disclaimer:'This masterclass is for education only. No income or booking result is guaranteed. Results vary with your market, your property and the work you put in.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide';
  let html='';
  if(s.t==='title'){
    html=`<div class="accentbar"></div>
      <div class="eyebrow">A free masterclass</div>
      <h1>The Host Like A<br>Mother Method</h1>
      <div class="sub">How to run a fully-booked Airbnb in a few hours a week, from anywhere.</div>
      <div class="presenter">with <strong>Natalie Palmer</strong> &middot; Host With Natalie</div>`;
  } else if(s.t==='dark'){
    html=`<div class="big-quote">${s.dark}</div>`;
  } else if(s.t==='part'){
    html=`<div class="part-label"><span class="dot"></span><div class="eyebrow" style="margin:0">${s.part}</div></div><h1 style="margin-top:24px">${s.h2}</h1>`;
  } else if(s.t==='cta'){
    html=`<div class="accentbar"></div>
      <div class="eyebrow">${s.eyebrow}</div>
      <h1>${s.h1}</h1>
      <p class="body" style="margin-top:22px">${s.body.join(' ')}</p>
      <a class="cta-btn">${s.cta}</a>
      <div class="disclaimer">${s.disclaimer}</div>`;
  } else {
    if(s.eyebrow) html+=`<div class="eyebrow">${s.eyebrow}</div>`;
    if(s.phase) html+=`<div class="phase-num">${s.phase}</div>`;
    if(s.h2) html+=`<h2>${s.h2}</h2>`;
    if(s.body) html+=`<div>${s.body.map(b=>`<p class="body">${b}</p>`).join('')}</div>`;
    if(s.cards) html+=`<div class="cardrow">${s.cards.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')}</div>`;
  }
  d.innerHTML=html;
  deck.appendChild(d);
});

let cur=0;
const slides=[...document.querySelectorAll('.slide')];
const nav=document.getElementById('nav');
const prog=document.getElementById('prog');
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  nav.textContent=`${cur+1} / ${slides.length}`;
  prog.style.width=`${((cur+1)/slides.length)*100}%`;
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
  if(e.key==='ArrowLeft')show(cur-1);
});
document.addEventListener('click',e=>{ if(!e.target.closest('a')) show(cur+1); });
show(0);
</script>
</body>
</html>
