<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Modern Automated Balloon Business - Balloon Artist College</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1e1a24; --panel:#2a2430; --rule:#40384a;
    --ink:#f5f1ec; --muted:#b9b1bf; --accent:#ff5d73;
    --head:'Poppins',sans-serif; --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#15121b;color:var(--ink);font-family:var(--body);display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(960px,94vw);aspect-ratio:16/9;background:var(--bg);border:1px solid var(--rule);border-radius:18px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .slide{position:absolute;inset:0;padding:8% 9%;display:none;flex-direction:column;justify-content:center;gap:18px}
  .slide.on{display:flex}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent)}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(28px,4.4vw,52px);line-height:1.04}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(24px,3.4vw,40px);line-height:1.08}
  p{font-size:clamp(15px,1.7vw,20px);line-height:1.5;color:var(--ink);max-width:40ch}
  p.muted{color:var(--muted)}
  .big{font-family:var(--head);font-weight:700;font-size:clamp(26px,3.6vw,44px);line-height:1.1}
  .accent{color:var(--accent)}
  ul{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:6px}
  li{font-size:clamp(15px,1.7vw,20px);line-height:1.4;padding-left:26px;position:relative;color:var(--ink);max-width:44ch}
  li:before{content:"";position:absolute;left:0;top:.55em;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .dot{display:inline-block;width:46px;height:46px;border-radius:50%;background:var(--accent);opacity:.9;margin-bottom:6px}
  .part{font-family:var(--head);font-weight:700;font-size:clamp(30px,4.6vw,56px);line-height:1.05}
  .brandline{font-family:var(--head);font-weight:600;color:var(--muted);font-size:14px;letter-spacing:.04em}
  .disc{color:var(--muted);font-size:13px;line-height:1.5;max-width:60ch}
  .cta-box{display:inline-block;font-family:var(--head);font-weight:700;background:var(--accent);color:#1b0d12;padding:14px 22px;border-radius:12px;font-size:clamp(16px,2vw,22px)}
  #nav{position:absolute;bottom:14px;right:18px;font-family:var(--head);font-size:12px;color:var(--muted);letter-spacing:.1em}
  .hint{position:absolute;bottom:14px;left:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass', h:'The Modern Automated Balloon Business', p:'How to get paid on the Mondays you don’t work.', brand:'With Zivi Kivi · Balloon Artist College'},
  {t:'who', kicker:'Who this is for', h:'For balloon artists who are great at the craft and still broke between gigs.', p:'If you can build the garland but the income disappears the second the event ends, this is for you.'},
  {t:'trap', kicker:'The trap', h:'You’re booked out every weekend.', p:'So why is the bank account empty again by Tuesday?'},
  {t:'reframe', kicker:'The real problem', big:'The problem was never your balloons. It’s that every dollar stops the moment the event ends.'},
  {t:'part1', part:'Part One', h:'The Gig Treadmill'},
  {t:'c1', kicker:'The treadmill', h:'Trading hours for gigs has a hard ceiling.', list:['You can only be at so many events in a weekend.','Every dollar is one-off and starts from zero on Monday.','More bookings means more exhaustion, not more freedom.']},
  {t:'c2', kicker:'The ceiling', h:'Your calendar is the cap on your income.', p:'When the only way to earn more is to work another event, the business owns you. The fix is not more gigs. It is a second kind of income.'},
  {t:'part2', part:'Part Two', h:'The Automated Balloon Business'},
  {t:'fast', kicker:'Fast Money, Slow Money', h:'Fund the business with gig cash while you build the asset that compounds.', p:'Fast money is the event work that pays today. Slow money is the recurring layer you build on top, so the business keeps earning between events.'},
  {t:'s1', kicker:'System one', h:'Productized offers', p:'Turn your best work into set packages people can choose and buy without a custom quote every time. Predictable to sell, predictable to deliver.'},
  {t:'s2', kicker:'System two', h:'The recurring layer', p:'A membership or subscription built on what you already know, so money arrives on a schedule instead of only when you show up to an event.'},
  {t:'s3', kicker:'System three', h:'Get off the truck', p:'Build a small crew and simple SOPs so the business can deliver without you at every setup. That is what turns a job into a business.'},
  {t:'price', kicker:'Price Clinic', h:'Price like a business, not a hobby.', p:'Most balloon artists undercharge, so margin vanishes the moment they try to grow. Rebuild your packages so the numbers survive scale.'},
  {t:'part3', part:'Part Three', h:'What it looks like when it runs'},
  {t:'month', kicker:'A different month', big:'A month that pays you whether or not you work the weekend.', p:'Gigs are still there when you want them. They are no longer the only thing keeping the lights on.'},
  {t:'why', kicker:'Why listen to this', h:'This is the path I actually walked.', list:['Built balloon art, a tiny niche, into a $1M micro-niche business.','145 episodes of the Balloon Artist Podcast, since 2016.','Balloon Artist College: the systems taught to balloon pros worldwide.']},
  {t:'move', kicker:'Your first move', h:'Pick one recurring offer and build it this month.', p:'You do not have to rebuild everything. One productized offer and one recurring layer is enough to start stepping off the treadmill.'},
  {t:'recap', kicker:'Recap', h:'The craft got you here. The business model takes you further.', list:['Stop running only on one-off gig income.','Add productized offers and a recurring layer.','Build a crew so it runs without you at every event.']},
  {t:'cta', kicker:'Your next step', h:'Build your automated balloon business with me.', p:'Join the Modern Automated Balloon Business Course inside Balloon Artist College, or book a call with our team to map your first recurring offer.', cta:'Join the Modern Automated Balloon Business Course', disc:'This masterclass is educational. Results vary and are not guaranteed. Your outcome depends on your own effort, offer, and market. No income is promised or guaranteed.', brand:'Balloon Artist College'}
];
const stage=document.getElementById('stage');
function esc(x){return (x||'')}
S.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='slide'+(i===0?' on':'');
  let h='';
  if(s.kicker) h+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.part) h+=`<div class="dot"></div><div class="part">${esc(s.part)}</div>`;
  if(s.h) h+=`<h${s.part?2:1}>${esc(s.h)}</h${s.part?2:1}>`;
  if(s.big) h+=`<div class="big">${esc(s.big)}</div>`;
  if(s.list){h+='<ul>'+s.list.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';}
  if(s.p) h+=`<p${s.t==='title'?'':' class="muted"'}>${esc(s.p)}</p>`;
  if(s.cta) h+=`<div><span class="cta-box">${esc(s.cta)}</span></div>`;
  if(s.disc) h+=`<p class="disc">${esc(s.disc)}</p>`;
  if(s.brand) h+=`<div class="brandline">${esc(s.brand)}</div>`;
  d.innerHTML=h; stage.appendChild(d);
});
const nav=document.createElement('div'); nav.id='nav'; stage.appendChild(nav);
const hint=document.createElement('div'); hint.className='hint'; hint.textContent='Use arrow keys'; stage.appendChild(hint);
let cur=0; const slides=[...stage.querySelectorAll('.slide')];
function show(n){cur=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('on',i===cur));nav.textContent=(cur+1)+' / '+slides.length;}
show(0);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
stage.addEventListener('click',e=>{const r=stage.getBoundingClientRect();show(e.clientX-r.left>r.width/2?cur+1:cur-1);});
</script>
</body>
</html>
