<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pentagon Framework — A Runaway Vows Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#13181b;        /* brand charcoal (ranked #1) */
    --panel:#061c33;     /* brand deep navy (ranked #2) */
    --ink:#eaebe8;       /* brand off-white (ranked #3) */
    --muted:#9aa0a6;
    --accent:#c9a15a;    /* champagne, derived from their luxury wedding-film brand */
    --serif:'Prata',Georgia,serif;
    --sans:'Jost',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#05080a;color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1120px;margin:0 auto}
  .slide{
    position:relative;width:100%;aspect-ratio:16/9;background:var(--bg);
    margin:26px 0;border-radius:6px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    padding:84px 92px;box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .slide::before,.slide::after{content:'';position:absolute;left:46px;right:46px;height:18px;pointer-events:none}
  .slide::before{top:28px;border-top:1px solid rgba(234,235,232,.10)}
  .slide::after{bottom:28px;border-bottom:1px solid rgba(234,235,232,.10)}
  .corner{position:absolute;width:26px;height:26px;border:1.5px solid var(--accent);opacity:.65}
  .c1{top:40px;left:40px;border-right:0;border-bottom:0}
  .c2{top:40px;right:40px;border-left:0;border-bottom:0}
  .c3{bottom:40px;left:40px;border-right:0;border-top:0}
  .c4{bottom:40px;right:40px;border-left:0;border-top:0}
  .kicker{font-size:15px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--serif);font-weight:600;font-size:74px;line-height:1.04;letter-spacing:.005em}
  h2{font-family:var(--serif);font-weight:600;font-size:52px;line-height:1.1}
  .sub{font-size:25px;color:var(--muted);margin-top:26px;max-width:80%;line-height:1.5;font-weight:400}
  .body{font-size:24px;line-height:1.6;color:#cfd3d6;margin-top:28px;max-width:74%;font-weight:400}
  .cover-foot{position:absolute;bottom:64px;left:92px;font-size:19px;letter-spacing:.08em;color:var(--ink)}
  .cover-foot span{color:var(--muted)}
  .part{font-family:var(--serif);font-style:italic;font-size:30px;color:var(--accent);margin-bottom:18px}
  .pillar-n{font-family:var(--serif);font-size:110px;line-height:.9;color:var(--accent);opacity:.9}
  .pillar-row{display:flex;align-items:flex-start;gap:54px}
  ul{list-style:none;margin-top:34px}
  li{font-size:25px;line-height:1.5;color:#cfd3d6;padding-left:34px;position:relative;margin-bottom:20px;max-width:80%}
  li::before{content:'';position:absolute;left:0;top:13px;width:16px;height:16px;border:1.5px solid var(--accent);transform:rotate(45deg)}
  .cta-card{background:var(--panel);margin:-10px 0;padding:40px 48px;border-radius:6px;border:1px solid rgba(201,161,90,.35);max-width:88%}
  .cta-url{font-family:var(--serif);font-size:40px;color:var(--accent);margin-top:22px}
  .disc{position:absolute;bottom:30px;left:92px;right:92px;font-size:13px;color:#6b7076;line-height:1.45;font-weight:400}
  .counter{position:absolute;bottom:34px;right:50px;font-size:13px;color:#4a4f53;letter-spacing:.1em}
  @media print{.slide{page-break-after:always;margin:0;border-radius:0}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'cover', kicker:'A Runaway Vows Masterclass', title:'The Pentagon Framework', sub:'How to book 25+ luxury weddings a year without an ad budget.', foot:'Jake Weisler & Nate Teahan'},
  {t:'who', kicker:'Who this is for', title:'You can already shoot a beautiful film.', body:'You are a wedding filmmaker who delivers work you are proud of. The problem is not your craft. It is that the calendar is not full at the price you want, and every booking still feels like a hustle.'},
  {t:'who', kicker:'The trap', title:'So you do what everyone tells you to do.', body:'Post more. Discount to win the booking. Chase every inquiry. Run a few ads. You stay busy, and you stay stuck at the same rate.'},
  {t:'who', kicker:'The reframe', title:'More content and more ads will not fix an under positioned film business.', body:'Luxury couples are not comparing your footage. They are buying a feeling and a level of trust. Win that, and price stops being the conversation.'},
  {t:'section', part:'Part One', title:'Why filmmakers stay stuck at the commodity rate.'},
  {t:'who', kicker:'The commodity trap', title:'When couples cannot tell you apart, they choose on price.', body:'A gorgeous reel is table stakes now. If your positioning, your offer, and your experience look like everyone else, the only lever left is a lower number.'},
  {t:'who', kicker:'What luxury couples actually buy', title:'Status, story, and certainty.', body:'The premium client pays to feel understood, to trust the day will be captured, and to own something they will show for the rest of their lives. That is a decision you can engineer.'},
  {t:'section', part:'Part Two', title:'The Pentagon Framework', sub:'Five sides to booking luxury weddings on craft, not spend.'},
  {t:'pillar', n:'01', title:'Positioning', body:'Pick the couple you are for and build every touchpoint around them, so the right client self selects and the wrong one screens out.'},
  {t:'pillar', n:'02', title:'The signature film', body:'A repeatable creative standard, from the 4 piece kit to the coverage map to controlled light, so every film reads as luxury, not luck.'},
  {t:'pillar', n:'03', title:'The pricing ladder', body:'Package so the premium tier is the obvious yes. This is how we went from 500 dollars to over 10,000 dollars a wedding without begging for the booking.'},
  {t:'pillar', n:'04', title:'The referral engine', body:'Planners, venues, and past couples sending you the next booking, so the calendar fills without chasing leads or grinding content.'},
  {t:'pillar', n:'05', title:'The experience', body:'An inquiry to delivery journey so good that couples feel it was worth every dollar and tell everyone, which feeds the referral engine.'},
  {t:'section', part:'Part Three', title:'When the five sides connect, the calendar fills itself.'},
  {t:'who', kicker:'The outcome', title:'Booked out, at the rate you set.', body:'25 plus weddings a year from couples who found you, trusted you, and never asked for a discount. A film business, not a weekend hustle.'},
  {t:'cred', kicker:'Why listen to us', title:'Jake Weisler & Nate Teahan', items:['Named among the Top 18 Wedding Videographers in the U.S.','1,000+ weddings booked, 15+ years behind the lens','Featured in People, Brides, and Wedding Chicks','2,000+ filmmakers taught through Runaway Vows worldwide']},
  {t:'who', kicker:'The one idea', title:'Craft gets you the booking. The Pentagon keeps the calendar full.', body:'You do not need a bigger ad budget. You need the five sides working together.'},
  {t:'cta', kicker:'Your next step', title:'Go deeper inside Year One.', body:'Wedding Videography: Year One walks you through all five sides, step by step, with the full Runaway Vows system. For hands on coaching, apply for the Runaway Workshop.', url:'runawayvows.com', disclaimer:'This masterclass is for educational purposes only. Results depend on your own effort, market, and execution. No income or booking results are guaranteed.'},
];
const frame = '<span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>';
function esc(x){return x}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  let inner='';
  if(s.t==='cover'){
    inner=`<div class="kicker">${s.kicker}</div><h1>${s.title}</h1><div class="sub">${s.sub}</div>
      <div class="cover-foot">${s.foot} <span>&nbsp;·&nbsp; Runaway Vows</span></div>`;
  } else if(s.t==='section'){
    inner=`<div class="part">${s.part}</div><h1>${s.title}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:''}`;
  } else if(s.t==='pillar'){
    inner=`<div class="kicker">The Pentagon Framework</div><div class="pillar-row"><div class="pillar-n">${s.n}</div>
      <div><h2>${s.title}</h2><div class="body" style="margin-top:20px;max-width:100%">${s.body}</div></div></div>`;
  } else if(s.t==='cred'){
    inner=`<div class="kicker">${s.kicker}</div><h2>${s.title}</h2><ul>${s.items.map(it=>`<li>${it}</li>`).join('')}</ul>`;
  } else if(s.t==='cta'){
    inner=`<div class="kicker">${s.kicker}</div><h1>${s.title}</h1>
      <div class="cta-card"><div class="body" style="margin-top:0;max-width:100%">${s.body}</div><div class="cta-url">${s.url}</div></div>
      <div class="disc">${s.disclaimer}</div>`;
  } else {
    inner=`<div class="kicker">${s.kicker}</div><h2>${s.title}</h2><div class="body">${s.body}</div>`;
  }
  deck.insertAdjacentHTML('beforeend',
    `<section class="slide">${frame}${inner}<div class="counter">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div></section>`);
});
</script>
</body>
</html>
