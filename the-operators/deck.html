<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surviving Private Investment - The Operators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1A2B; --panel:#13273A; --rule:#26425C; --accent:#C8A15A;
    --ink:#EAF0F5; --muted:#9FB2C2;
    --serif:'Zilla Slab',Georgia,serif; --sans:'Archivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 120px}
  .slide{background:linear-gradient(180deg,var(--panel),#0f2032);border:1px solid var(--rule);
    border-radius:14px;padding:56px 56px 52px;margin:0 0 26px;min-height:420px;display:flex;
    flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;height:100%;width:4px;background:var(--accent)}
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.12;margin-bottom:16px}
  .sub{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted);margin-top:20px;max-width:32ch}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:60ch;margin-top:14px}
  p.muted{color:var(--muted)}
  ul{margin:18px 0 0 0;list-style:none;max-width:62ch}
  li{font-size:18px;line-height:1.5;color:var(--ink);padding:12px 0 12px 26px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:2px;background:var(--accent)}
  li b{color:var(--accent);font-weight:600}
  .byline{margin-top:36px;font-size:15px;color:var(--muted);letter-spacing:.04em}
  .big{font-family:var(--serif);font-size:40px;line-height:1.15;font-weight:600;max-width:24ch}
  .part-num{font-family:var(--serif);font-size:88px;color:var(--rule);font-weight:700;line-height:1}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);line-height:1.5;max-width:64ch;border-top:1px solid var(--rule);padding-top:16px}
  .cta-step{display:inline-block;margin-top:24px;font-family:var(--sans);font-weight:600;font-size:18px;
    color:var(--bg);background:var(--accent);padding:14px 26px;border-radius:8px}
  .foot{text-align:center;color:var(--muted);font-size:13px;padding:8px 0 40px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">The Operators &middot; Private Equity Value Creation</div>
<script>
const S=[
  {t:'title',
   kicker:'A masterclass for PE-backed operators',
   h1:'Surviving Private Investment',
   sub:'The first-year value-creation playbook for leaders of private-equity-backed companies',
   byline:'Kit Lisle &middot; The Operators'},

  {t:'who',
   kicker:'Who this is for',
   h2:'You just took the check. Now the clock is running.',
   p:'This is for the three people who feel it first when a fund takes control:',
   li:['<b>The founder</b> who stayed on as CEO and now answers to a board that did not exist last quarter.',
       '<b>The incumbent executive</b> who ran the company one way for years and is suddenly measured a new way.',
       '<b>The recruited operator</b> brought in from a bigger company to hit a number on someone else’s timeline.']},

  {t:'reframe',
   kicker:'The reframe',
   big:'The deal did not end the day it closed. That was the starting gun.',
   p:'Most operators think the hard part was getting acquired. The hard part is the three to four years that follow, on a clock you did not set.'},

  {t:'part', num:'01', kicker:'Part one', h2:'Private Equity Culture Shock'},

  {t:'content',
   kicker:'What changes on day one',
   h2:'A new language, overnight',
   p:'Nobody hands you the glossary. The shock shows up as:',
   li:['New <b>acronyms</b> and reporting cadences that assume you already know them.',
       'New <b>expectations</b> for pace, margin, and cash that were never on your old scorecard.',
       'New <b>timelines, processes, and protocols</b> that treat speed as the default, not the exception.']},

  {t:'content',
   kicker:'The reality nobody says out loud',
   h2:'Why the pressure is real, not personal',
   p:'A fund makes no money while it holds the business. During the hold, profit pays down the debt used to buy you. The fund only wins at exit.',
   li:['Average PE-backed executive tenure runs <b>three to four years</b>.',
       'That window, not the fiscal year, is the real deadline.',
       'You are being asked to build and grow faster than you ever have, because the math demands it.']},

  {t:'part', num:'02', kicker:'Part two', h2:'The Value Creation Levers'},

  {t:'content',
   kicker:'Lever 2 &middot; strategy',
   h2:'The investment thesis is the map',
   p:'Before you optimize anything, make the sponsor say the quiet part out loud. Ask them, plainly:',
   li:['Where do you see this business <b>today</b>?',
       'Where do you want to take it, and <b>why</b>?',
       'What is the <b>path</b> to get there?'],
   after:'Value creation is simply the journey from that thesis to the agreed end point. Every lever below serves it.'},

  {t:'content',
   kicker:'Lever 1 &middot; communications',
   h2:'Communication is a value-creation lever',
   p:'The operators who keep their seats are the ones who communicate deliberately in three directions:',
   li:['<b>Up</b> to the board, so there are no surprises in the numbers.',
       '<b>Down</b> to management, so the thesis becomes the team’s plan.',
       '<b>Out</b> to customers and stakeholders, so growth has a story.']},

  {t:'content',
   kicker:'Lever 4 &middot; growth',
   h2:'Organic growth, RevOps, and go-to-market',
   p:'Multiple expansion gets talked about. Durable value is built on organic growth you can defend.',
   li:['A repeatable go-to-market motion, not a heroic quarter.',
       'Revenue operations that make the pipeline legible to the board.',
       'Pricing and retention treated as levers, not afterthoughts.']},

  {t:'content',
   kicker:'Lever 4 &middot; the engine room',
   h2:'Systems, processes, and technology',
   p:'You cannot grow twice as fast on processes built for half the size.',
   li:['Map the value stream and cut the steps that add cost, not value.',
       'Put in systems that survive the next hire and the next acquisition.',
       'Instrument the business so data, not anecdote, drives the next move.']},

  {t:'content',
   kicker:'Lever 5 &middot; M&A',
   h2:'M&A strategy and integration',
   p:'For most theses, inorganic growth is on the table. The value is won or lost in the integration, not the deal memo.',
   li:['Buy for the thesis, not for the logo.',
       'Integrate people and systems on a plan, before the synergies decay.',
       'Know which acquisitions the board will actually fund, and when.']},

  {t:'content',
   kicker:'The lever behind every lever',
   h2:'Human capital',
   p:'Every thesis is executed by a team. Getting the right leaders into the right seats early is the highest-leverage move you make.',
   li:['Assess the team you inherited against the plan you signed up for.',
       'Fill the gaps before the board notices them.',
       'Build the bench that a buyer will pay a premium for.']},

  {t:'content',
   kicker:'Where it all points',
   h2:'Exit readiness starts on day one',
   p:'The end point is not a surprise. It is the thesis, made real, on a schedule.',
   li:['Run the business so it is always one clean story away from a sale.',
       'Retire the risks a diligence team would find, before they do.',
       'Make the growth durable enough to survive the next owner.']},

  {t:'part', num:'03', kicker:'Part three', h2:'What the first year looks like'},

  {t:'content',
   kicker:'The first ninety days',
   h2:'Move deliberately, not just fast',
   li:['Get the thesis in writing and align on the scoreboard that matters.',
       'Pick the two or three levers that move this business, and ignore the rest.',
       'Over-communicate up, down, and out while trust is still being built.']},

  {t:'content',
   kicker:'Why operators solve this together',
   h2:'The cases you cannot Google',
   p:'The hardest calls are not in a playbook. They are the strategic, value-creation, and interpersonal dilemmas that keep you up at night.',
   li:['You bring the real case to a room of operators who have lived it.',
       'You get counsel from people with no stake in your board politics.',
       'You leave with a next move, not just sympathy.']},

  {t:'credibility',
   kicker:'Why me',
   h2:'Kit Lisle',
   p:'Founder of The Operators, the peer community for the private-equity ecosystem, and Chairman of Acclaro Growth Partners. Host of the Private Equity Value Creation Podcast.',
   p2:'The Operators exists because no network was built for the people actually running PE-backed companies. So I built one, around the eleven levers and the cases that decide whether a thesis lands.'},

  {t:'cta',
   kicker:'Your next step',
   h2:'Bring your first-year case to the room',
   p:'If you are inside a PE-backed company right now, you do not have to run the thesis alone. Join the operators working these levers every month, and bring the case that is keeping you up at night to the Strategic Growth Council.',
   step:'Explore The Operators &rarr; theoperators.pe',
   disc:'Educational content only. No outcome, return, or financial result is promised or guaranteed. Every business and investment thesis is different, and results vary. Nothing here is investment, legal, or tax advice.'}
];

const deck=document.getElementById('deck');
function esc(x){return x||''}
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide';
  let h='';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){
    h+=`<h1>${s.h1}</h1><div class="sub">${s.sub}</div><div class="byline">${s.byline}</div>`;
  }else if(s.t==='part'){
    h+=`<div class="part-num">${s.num}</div><h2 style="margin-top:14px">${s.h2}</h2>`;
  }else if(s.t==='reframe'){
    h+=`<div class="big">${s.big}</div>`+(s.p?`<p class="muted">${s.p}</p>`:'');
  }else if(s.t==='credibility'){
    h+=`<h2>${s.h2}</h2><p>${s.p}</p>`+(s.p2?`<p class="muted">${s.p2}</p>`:'');
  }else if(s.t==='cta'){
    h+=`<h2>${s.h2}</h2><p>${s.p}</p><span class="cta-step">${s.step}</span><div class="disc">${s.disc}</div>`;
  }else{
    if(s.h2) h+=`<h2>${s.h2}</h2>`;
    if(s.p) h+=`<p>${s.p}</p>`;
    if(s.li){h+='<ul>'+s.li.map(x=>`<li>${x}</li>`).join('')+'</ul>';}
    if(s.after) h+=`<p class="muted">${s.after}</p>`;
  }
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
