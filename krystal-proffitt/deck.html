<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Binge-Worthy Podcast, a masterclass with Krystal Proffitt</title>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf5f2; --panel:#fffdfc; --rule:#f1e4e0; --ink:#292929;
    --muted:#6f6a66; --accent:#ff5757;
    --display:'Karla',system-ui,sans-serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deckwrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:56px 52px;margin:20px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(41,41,41,.02)}
  .k{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;margin:0 0 18px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.12;margin:0 0 16px}
  p{font-size:19px;line-height:1.6;margin:0 0 14px;max-width:60ch}
  .sub{color:var(--muted);font-size:20px}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 34px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li b{font-family:var(--display)}
  li:before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.12}
  .big .a{color:var(--accent)}
  .foot{margin-top:22px;color:var(--muted);font-size:15px}
  .disc{color:var(--muted);font-size:14px;line-height:1.5;margin-top:18px;max-width:64ch}
  .n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.06em}
  @media(max-width:620px){.slide{padding:36px 24px}h1{font-size:34px}h2{font-size:26px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deckwrap" id="deck"></div>
<script>
const S=[
  {t:'title', k:'A live masterclass with Krystal Proffitt',
    h:'The Binge-Worthy Podcast',
    s:'How to launch and sustain a show your ideal listener binges, without burning out.'},

  {t:'promise', k:'What you will leave with',
    h:'A podcast you can actually keep going',
    s:'By the end you will have the plan, the system, and the repurposing workflow that turn podcasting from a weekly scramble into something you can keep up for years.'},

  {t:'who', k:'Who this is for', h:'You, if any of this sounds familiar',
    list:[
      "You want to start a podcast but the gear and the tech have you frozen.",
      "You started one and it quietly died around episode ten.",
      "You are consistent for a month, then life happens and the show goes dark.",
      "You know you have something to say. You just need a system to say it on repeat."
    ]},

  {t:'trap', k:'The trap', h:'Everyone sells you the gear first',
    s:'Pick this microphone. Buy that software. Follow this launch checklist. So you buy the gear, record a handful of episodes on willpower, and then the hardest part shows up: next week, and the week after that.',
    foot:'The gear was never the problem. Keeping it going is.'},

  {t:'reframe', k:'The reframe',
    big:'A podcast is not a hobby you squeeze in. It is a <span class="a">system</span> you can repeat.',
    s:'Hobbies run on motivation, and motivation runs out. Systems run on a plan and a repeatable workflow. That is the whole difference between a show that lasts and a show that fades.'},

  {t:'part', k:'Part one', h:'Why most podcasts quit',
    s:'It is almost never about talent or topic. Three things quietly kill a new show, and all three are fixable before you ever hit record.'},

  {t:'list', k:'Part one', h:'The three things that end a show',
    list:[
      "<b>No plan.</b> Every episode starts from a blank page, so every episode costs you a full day you do not have.",
      "<b>No clarity on who it is for.</b> When you talk to everyone, no one binges, and you lose the motivation to keep going.",
      "<b>No repurposing.</b> You pour hours into one episode, use it once, and start from zero again next week."
    ]},

  {t:'part', k:'Part two', h:'The system: my 6-step content process',
    s:'This is the same path I have used across more than a thousand episodes. Strategy first, gear last. Each step removes one of the reasons shows quit.'},

  {t:'list', k:'Part two', h:'The 6 steps',
    list:[
      "<b>Discovery.</b> The what, the who, and the why, before any tech.",
      "<b>Content and format.</b> Choose the shape of your show and plan your first 20 episodes.",
      "<b>Collateral and design.</b> The small set of brand pieces that make you look ready.",
      "<b>Platform.</b> Set up hosting and distribution once, the simple way.",
      "<b>Launching.</b> A launch plan that builds momentum instead of pressure.",
      "<b>Create, publish, rinse and repeat.</b> The weekly rhythm you can actually sustain."
    ]},

  {t:'part', k:'Part two', h:'The piece that changes everything',
    big:'One episode. <span class="a">A whole week of content.</span>',
    s:'This is Radical Repurposing, and it is the heart of the whole method. You make the thing once, then it earns its keep all week.'},

  {t:'list', k:'Part two', h:'What one episode becomes',
    list:[
      "<b>Monday.</b> Record one focused episode.",
      "<b>Tuesday.</b> Cut two or three short clips from it.",
      "<b>Wednesday.</b> Send the email that points to it.",
      "<b>Thursday.</b> Post the reel.",
      "<b>Friday.</b> Share the carousel or the quote.",
      "Same message, five places, zero extra recording. That is how you show up everywhere without making more."
    ]},

  {t:'reframe', k:'Part two', h:'Consistency without the treadmill',
    s:'When one recording feeds the whole week, consistency stops depending on how motivated you feel. The system carries it. That is what lets a solo creator keep a show alive long after the launch buzz is gone.'},

  {t:'part', k:'Part three', h:'What a kept-up show looks like',
    s:'When the plan, the clarity, and the repurposing are in place, the thing most people never reach becomes normal: a back catalogue worth binging, an audience that grows, and a show that pays you back.'},

  {t:'list', k:'Part three', h:'What changes for you',
    list:[
      "A library of episodes a new listener can binge, not a graveyard of three.",
      "A clear next step for every listener, so the show actually grows your business.",
      "A weekly rhythm that fits your real life, not one that competes with it.",
      "A show you are proud of a year from now, because you are still making it."
    ]},

  {t:'credibility', k:'Why listen to me', h:'I have kept a show going for years',
    list:[
      "Host of The Proffitt Podcast, past 1,000 published episodes.",
      "Amazon best-selling author of Start a Binge-Worthy Podcast.",
      "Taught thousands of creators to launch and sustain their own shows.",
      "Spoken on podcasting at Podcast Movement and the Ramsey Solutions Influencer Event."
    ],
    foot:'I am not here to sell you gear. I am here to hand you the system I actually use.'},

  {t:'cta', k:'Your next step', h:'Build a show you can keep',
    s:'If this is the way you want to podcast, strategy first and sustainable for the long run, come build it with me inside Proffitt Podcasting. We take these steps together, from your first plan to a show that keeps itself going.',
    foot:'Join Proffitt Podcasting and start your show the sustainable way.',
    disc:'This masterclass is educational. No income or result is guaranteed. Results vary based on your effort, your audience, and how you apply what you learn.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var deck=document.getElementById('deck');
S.forEach(function(s,i){
  var sl=el('div','slide');
  if(s.k)sl.appendChild(el('div','k',s.k));
  if(s.h && s.t==='title')sl.appendChild(el('h1',null,s.h));
  else if(s.h)sl.appendChild(el('h2',null,s.h));
  if(s.big)sl.appendChild(el('div','big',s.big));
  if(s.s)sl.appendChild(el('p','sub',s.s));
  if(s.list){var ul=el('ul');s.list.forEach(function(li){ul.appendChild(el('li',null,li));});sl.appendChild(ul);}
  if(s.foot)sl.appendChild(el('div','foot',s.foot));
  if(s.disc)sl.appendChild(el('div','disc',s.disc));
  sl.appendChild(el('div','n',(i+1)+' / '+S.length));
  deck.appendChild(sl);
});
</script>
</body>
</html>
