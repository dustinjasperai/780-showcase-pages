<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Premium Daycare Masterclass - Dom Hodgson</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf7;        /* warm paper (his light scheme) */
    --panel:#ffffff;
    --rule:#e4e0d8;
    --ink:#2b333f;       /* his charcoal-navy */
    --muted:#6a7180;
    --accent:#f58900;    /* his signal orange */
    --head:'Poppins',system-ui,sans-serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #deck{max-width:1040px;margin:0 auto;padding:28px 20px 72px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:52px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(43,51,63,.04)}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:33px;line-height:1.14;margin-bottom:14px}
  .lead{font-size:20px;line-height:1.5;color:var(--ink);max-width:46ch}
  .sub{font-size:18px;line-height:1.55;color:var(--muted);max-width:52ch;margin-top:14px}
  p.body{font-size:18px;line-height:1.6;max-width:56ch;margin-top:12px}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px;max-width:60ch}
  li{position:relative;padding-left:30px;font-size:18px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:3px;background:var(--accent)}
  li b{font-family:var(--head);font-weight:600}
  .big{font-size:60px;font-family:var(--head);font-weight:700;color:var(--accent);line-height:1}
  .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
  .tier{border:1px solid var(--rule);border-radius:12px;padding:22px}
  .tier.top{border-color:var(--accent);background:#fff7ec}
  .tier .name{font-family:var(--head);font-weight:700;font-size:20px}
  .tier .note{color:var(--muted);font-size:15px;margin-top:6px}
  .foot{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);
    padding:9px;background:rgba(251,250,247,.9);border-top:1px solid var(--rule)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;max-width:62ch;line-height:1.5}
  .cta-line{font-family:var(--head);font-weight:600;font-size:21px;color:var(--ink);margin-top:20px}
  .num{font-family:var(--head);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.1em}
</style>
</head>
<body>
<div id="deck"></div>
<div class="foot">The Premium Daycare Masterclass &middot; Dom Hodgson &middot; Pet Business Marketing</div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Dom Hodgson',
   h:'The Premium Daycare',
   lead:'How to turn an ordinary dog daycare into a premium, high-margin destination that owners book out and clients happily pay more for.'},

  {t:'content', kicker:'Who this is for',
   h:'You run the place. You love the dogs. You are exhausted.',
   body:'This is for dog daycare, boarding and pet resort owners who are fully booked and still not making the money the hours deserve. You have built something real. It just does not pay you like it should yet.'},

  {t:'content', kicker:'The trap',
   h:'More dogs is not the answer you were sold.',
   body:'Every extra dog is more staff, more space, more risk and more of you. Growth that only comes from volume has a ceiling, and most owners hit it long before the business pays them properly.'},

  {t:'content', kicker:'The reframe',
   h:'A daycare is not a kennel. It is an experience.',
   body:'The moment clients stop buying "a place to leave the dog" and start buying an experience they trust and brag about, price stops being the conversation. That shift is a decision you make on purpose, not a thing you hope for.'},

  {t:'section', num:'PART ONE', h:'Why busy daycares stay broke'},

  {t:'content', kicker:'The commodity problem',
   h:'If you look like every other daycare, you get priced like every other daycare.',
   body:'When a buyer cannot tell you apart from the place down the road, the only lever left is price, and it only goes down. The fix is not a better advert. It is being genuinely different in a way the client can feel.'},

  {t:'content', kicker:'The margin problem',
   h:'Full does not mean profitable.',
   body:'A single flat day-rate caps what every client can ever spend with you. The owners who pay themselves well are not busier. They simply give clients a way to spend more with them, on purpose.'},

  {t:'section', num:'PART TWO', h:'The three moves'},

  {t:'content', kicker:'Move one - Disnify the experience',
   h:'Design the day like a theme park, not a holding pen.',
   body:'Disney does not sell rides. It sells theming, story and signature moments. Applied to a daycare, that means a handful of deliberate wow moments through the day that clients see, photograph and talk about. That is what makes premium feel earned instead of expensive.'},

  {t:'content', kicker:'Move one in practice',
   h:'What a signature moment looks like.',
   body:'The themed report card at pickup. The enrichment session clients can watch. The arrival ritual the dog clearly loves. None of these cost much. All of them make the price feel obvious.'},

  {t:'tiers', kicker:'Move two - Good, Better, Best',
   h:'Give clients a way to spend more.',
   note:'Most owners only ever sell the base day. A simple three-tier ladder lets the clients who want more pay you more, without a single extra dog through the door.'},

  {t:'content', kicker:'Move two in practice',
   h:'The top tier is where the business is won.',
   body:'A premium tier does not need to suit everyone. It needs to exist. The ten to twenty percent of clients who always want the best for their dog will self-select into it, and that is where your margin quietly lives.'},

  {t:'content', kicker:'Move three - Infrastructure first',
   h:'Install one high-value asset a month.',
   body:'Instead of chasing more clients, you build the business one asset at a time: a recurring-revenue offer, a premium package, a system that runs without you. Each one lifts revenue or hands you back time, and they compound.'},

  {t:'content', kicker:'Move three in practice',
   h:'Enrichment as the engine.',
   body:'An enrichment-led day is the clearest premium asset of all. It is better for the dogs, it is visibly different from the field, and it justifies a rate the commodity daycare down the road can never charge.'},

  {t:'section', num:'PART THREE', h:'A daycare that finally pays you'},

  {t:'content', kicker:'The shift',
   h:'Same number of dogs. A business that finally pays you.',
   body:'Nothing here depends on taking more dogs or working more hours. It depends on being worth more per client and building the assets that let you step back. That is a premium daycare.'},

  {t:'content', kicker:'Why me',
   h:'I have built this from the inside.',
   body:'I started Pack Leader Dog Adventures in 2011, wrote five books on running a pet business the premium way, and now coach daycare and resort owners across the UK and the US through the Poodle to Pitbull podcast and the Dog Daycare Success Academy. This masterclass is the short version of what I teach them.'},

  {t:'cta', kicker:'Your next step',
   h:'Build your premium daycare with me.',
   cta:'Join the Dog Daycare Success Academy waiting list at petbusinessmarketing.com, and come to the next live masterclass.',
   disclaimer:'This masterclass is educational. No specific income or result is guaranteed. Results vary and depend on your own market, pricing and execution. Examples shown are illustrative.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if (s.num) html += '<div class="num">'+s.num+'</div>';
  if (s.t === 'section'){
    html += '<h1>'+s.h+'</h1>';
  } else if (s.t === 'title'){
    html += '<h1>'+s.h+'</h1><p class="lead">'+s.lead+'</p>';
  } else if (s.t === 'tiers'){
    html += '<h2>'+s.h+'</h2><p class="sub">'+s.note+'</p>'+
      '<div class="tiers">'+
      '<div class="tier"><div class="name">Good</div><div class="note">The base day. What everyone already sells.</div></div>'+
      '<div class="tier"><div class="name">Better</div><div class="note">Add-ons and enrichment the keen clients want.</div></div>'+
      '<div class="tier top"><div class="name">Best</div><div class="note">The premium tier. Where your margin lives.</div></div>'+
      '</div>';
  } else if (s.t === 'cta'){
    html += '<h2>'+s.h+'</h2><div class="cta-line">'+s.cta+'</div>'+
      '<div class="disclaimer">'+s.disclaimer+'</div>';
  } else {
    html += '<h2>'+s.h+'</h2>';
    if (s.body) html += '<p class="body">'+s.body+'</p>';
  }
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
