<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Business Only You Can Run | Wessal Khader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1a1a1a;
    --panel:#242422;
    --rule:#6b705c;
    --accent:#b0b59f;
    --ink:#f4f1ef;
    --ink-soft:#cfccc4;
    --ink-muted:#8f8d84;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  #deck{position:relative;height:100vh;width:100vw;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:8vh 9vw;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .k{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(34px,6vw,76px);line-height:1.05;letter-spacing:-.01em;color:var(--ink)}
  h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(28px,4.6vw,54px);line-height:1.1;color:var(--ink);margin-bottom:18px}
  .sub{font-size:clamp(16px,2vw,22px);color:var(--ink-soft);margin-top:26px;max-width:40ch}
  .body{font-size:clamp(16px,1.9vw,22px);color:var(--ink-soft);margin-top:16px;max-width:52ch}
  ul{list-style:none;margin-top:26px;max-width:54ch}
  li{position:relative;padding-left:30px;margin-bottom:16px;font-size:clamp(15px,1.8vw,21px);color:var(--ink-soft)}
  li::before{content:"";position:absolute;left:0;top:.65em;width:12px;height:2px;background:var(--accent)}
  .big{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(30px,5.4vw,66px);line-height:1.12;color:var(--ink);max-width:22ch}
  .accent{color:var(--accent)}
  .part{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(40px,7vw,96px);color:var(--accent);line-height:1}
  .part .lead{display:block;font-family:'Work Sans',sans-serif;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:18px;font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:30px 34px;margin-top:26px;max-width:58ch}
  .disc{font-size:13px;color:var(--ink-muted);margin-top:30px;max-width:60ch;line-height:1.6}
  .cta-step{font-size:clamp(16px,2vw,22px);color:var(--ink);margin-top:20px;font-weight:600}
  .nav{position:fixed;bottom:22px;right:28px;font-size:12px;color:var(--ink-muted);letter-spacing:.08em;font-family:'Work Sans',sans-serif}
  .foot{position:fixed;bottom:22px;left:28px;font-size:12px;color:var(--ink-muted);letter-spacing:.14em;text-transform:uppercase}
  @media(max-width:640px){.slide{padding:7vh 7vw}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="foot">Unfazed Founder&trade;</div>
<div class="nav"><span id="pg">1</span> / <span id="tot"></span></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="k">A live masterclass with Wessal Khader</div>
    <h1>Find the Business<br>Only You Can Run</h1>
    <div class="sub">Sixty live minutes on building a True-to-You business, not another copy of someone else's funnel.</div>`},

  {t:'who', html:`
    <div class="k">Who this is for</div>
    <h2>If you've started, stopped, and restarted more than once</h2>
    <div class="body">This is for early-stage digital founders building online, or restarting with intention. Service providers, consultants, coaches, digital products, affiliate, e-commerce. Freedom seekers, not get-rich-quick seekers.</div>`},

  {t:'trap', html:`
    <div class="k">The trap</div>
    <h2>You keep copying people who aren't you</h2>
    <div class="body">You buy the course, you clone the funnel, you post the way the guru says to post. It works for them. It stalls for you. And every time it stalls, you quietly wonder if the problem is you.</div>`},

  {t:'reframe', cls:'reframe', html:`
    <div class="k">The reframe</div>
    <div class="big">The algorithm doesn't want the business <span class="accent">only you</span> can run.</div>
    <div class="sub">It rewards the copy. Your people are waiting for the original.</div>`},

  {t:'part', html:`<div class="part"><span class="lead">Part One</span>The Copycat Trap&trade;</div>`},

  {t:'copycat', html:`
    <div class="k">The Copycat Trap&trade;</div>
    <h2>Borrowed playbooks, borrowed results</h2>
    <div class="body">The Copycat Trap is chasing the algorithm and copying gurus instead of building something only you can run. It feels safe because someone else already proved it. It fails because it was built on their superpower, their season, their life. Not yours.</div>`},

  {t:'why-stall', html:`
    <div class="k">Why it stalls</div>
    <h2>A plan built on strengths you don't have</h2>
    <ul>
      <li>Their funnel assumes their audience, not the one you can actually reach.</li>
      <li>Their pace assumes their bandwidth, not your season of life.</li>
      <li>Their offer assumes their expertise, not the thing you are genuinely great at.</li>
    </ul>`},

  {t:'part', html:`<div class="part"><span class="lead">Part Two</span>The True-to-You Method&trade;</div>`},

  {t:'tty', html:`
    <div class="k">The True-to-You Method&trade;</div>
    <h2>One filter for every decision</h2>
    <div class="body">Before any strategy, run it through one question: is this True-to-You? Does it fit your superpower, your season, your capacity, your values, and the life you are actually building? If not, it is someone else's business wearing your name.</div>`},

  {t:'ppm', html:`
    <div class="k">Step one</div>
    <h2>Personal Power Mapping&trade;</h2>
    <div class="body">Extract the superpower you already have and name the kryptonite that keeps draining you. We build the business on the strength, and we design around the drain instead of pretending it isn't there.</div>`},

  {t:'buyer', html:`
    <div class="k">Step two</div>
    <h2>The Buyer Bio Framework&trade;</h2>
    <div class="body">Define the one buyer you are genuinely aligned to serve. Not the biggest market, not the trendiest niche. The person your superpower was built for, described clearly enough that your words finally sound like theirs.</div>`},

  {t:'models', html:`
    <div class="k">Step three</div>
    <h2>From Ideas to Viable Models&trade;</h2>
    <div class="body">Turn the problem you solve into a paid path. We look at the top five business models and pick the one that fits your bandwidth and your season, not the one a guru is selling this quarter.</div>`},

  {t:'launch', html:`
    <div class="k">Step four</div>
    <h2>IG Launch Insurance&trade;</h2>
    <div class="body">De-risk the launch so it does not live or die on whether one reel goes viral. A launch should be a system you can repeat on a quiet week, not a prayer you say on a loud one.</div>`},

  {t:'part', html:`<div class="part"><span class="lead">Part Three</span>When Nothing Is Borrowed</div>`},

  {t:'after', html:`
    <div class="k">On the other side</div>
    <h2>A business that fits your life, not the feed</h2>
    <ul>
      <li>You post from your own voice, because the strategy was built on it.</li>
      <li>You sell to one aligned buyer who recognizes themselves in your words.</li>
      <li>You run a model that fits the week you actually have, not the week a guru pretends to have.</li>
    </ul>`},

  {t:'week', html:`
    <div class="k">A True-to-You week</div>
    <h2>Fewer moves, more of them yours</h2>
    <div class="body">You stop auditioning for the algorithm and start building for the person you can serve best. The work gets quieter and the results get steadier, because for the first time nothing is borrowed.</div>`},

  {t:'whyme', html:`
    <div class="k">Why me</div>
    <h2>I built, and exited, before I taught</h2>
    <div class="body">I'm Wessal Khader. Twenty-plus years building and exiting eight and nine figure companies. I created the Founder's Table&trade; because I couldn't find a place where real, ethical people go to build profitable businesses without dancing for the algorithm. So I built it.</div>`},

  {t:'recap', html:`
    <div class="k">The whole method in one breath</div>
    <h2>Map it, aim it, model it, launch it</h2>
    <ul>
      <li>Map your superpower, neutralize your kryptonite.</li>
      <li>Aim at the one buyer you are built to serve.</li>
      <li>Pick the model that fits your season.</li>
      <li>Launch on a system, not on luck.</li>
    </ul>`},

  {t:'cta', cls:'cta', html:`
    <div class="k">Your next step</div>
    <h1>A seat at the<br>Founder's Table&trade;</h1>
    <div class="panel">If today resonated, the Founder's Table&trade; is where we do this work together: live execution workshops, a network of real founders, and the full True-to-You build, step by step.</div>
    <div class="cta-step">Join us at unfazedfounder.com</div>
    <div class="disc">Educational content only. Nothing here is financial, legal, or business advice, and no specific income, revenue, or result is guaranteed. Results vary and depend on your own effort, market, and circumstances.</div>`}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{const d=document.createElement('section');d.className='slide '+(s.cls||'');d.innerHTML=s.html;if(i===0)d.classList.add('on');deck.appendChild(d);});
document.getElementById('tot').textContent=S.length;
let idx=0;const slides=[...document.querySelectorAll('.slide')];
function go(n){slides[idx].classList.remove('on');idx=Math.max(0,Math.min(S.length-1,n));slides[idx].classList.add('on');document.getElementById('pg').textContent=idx+1;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){go(idx+1);}else if(e.key==='ArrowLeft'){go(idx-1);}});
deck.addEventListener('click',()=>go(idx+1));
</script>
</body>
</html>
