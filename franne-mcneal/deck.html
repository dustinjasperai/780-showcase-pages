<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The One Number · Franne McNeal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FFFFFF; --panel:#F7F7F7; --rule:#DDDDDD;
    --ink:#0A0A0A; --accent:#1FD55F; --grey:#5A5A5A; --dim:#8A8A8A;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Poppins',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Libre Caslon Condensed',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.2vw;max-width:88%}
  .t-normal h1{font-size:3.1vw;max-width:84%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.42vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.58;font-weight:400}
  .sub{font-family:'Poppins',sans-serif;font-size:1.7vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:3.3vw;max-width:82%;font-style:italic;color:var(--ink)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:80%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.88vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .tick-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-tick{right:7%;bottom:10%;width:16vw}
  .corner-tick{right:6%;bottom:7%;width:7vw;opacity:.6}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.25vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500;font-family:'Poppins',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Poppins',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Poppins',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Significant Business Results</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- tick motif: a single rising tick-mark line, echoing "The One Number" and a value-growth chart -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="tick" viewBox="0 0 260 60">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <line x1="10" y1="48" x2="250" y2="48" stroke="#DDDDDD" opacity="0.7"/>
    <polyline points="10,48 70,40 130,30 190,16 250,8" stroke="#1FD55F" opacity="0.9"/>
    <circle cx="250" cy="8" r="5" fill="#1FD55F" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The One Number',sub:'A masterclass for architecture, engineering, and construction firm owners on the single metric that reveals whether you built an asset, or just a very demanding job.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You built a firm doing $1M to $20M a year. Could you say what it is worth without you in it?',body:'Revenue answers "how busy is the firm." It does not answer "what does this firm sell for, or run without me." Most AEC owners have never separated those two questions.'},
 {t:'dark',title:'Revenue tells you how busy the firm is. It says nothing about whether the firm is worth anything without you in it.'},

 {t:'section',idx:'Part One',title:'Why Owner-Dependency Hides on the P&L'},
 {t:'normal',k:'The studio bottleneck',title:'Every design sign-off, every client call, every change order still runs through you.',body:'In architecture that shows up as design review. In engineering it is the principal fielding every technical question. In construction it is every change-order call landing on one desk. None of it shows up as a cost line. All of it shows up the day you try to step back.'},
 {t:'normal',k:'No answer to "what if I stepped away"',title:'A firm that cannot run a normal month without you is not a business. It is a very well-paid job.',body:'Ask a $1M-$20M AEC owner what their firm would be worth on the open market, or what happens to backlog if they take eight weeks off, and most cannot answer either question with a number.'},
 {t:'dark',title:'A number you cannot name is a number you cannot manage.'},

 {t:'section',idx:'Part Two',title:'The Owner’s Metric: The One Number'},
 {t:'normal',k:'One number, two answers',title:'The One Number is the single metric that tells you both what the firm is worth, and how free you actually are.',body:'Instead of tracking a dozen KPIs that all describe activity, The One Number is built to answer the two questions that actually matter to an owner: is this firm building value, and is it building me a life. Full calculation taught inside the program.'},
 {t:'normal',k:'Why it works for AEC specifically',title:'Project-based firms hide owner-dependency inside utilization and backlog, not on a P&L.',body:'Generic small-business metrics were not built for a firm where every dollar comes from a project the owner is personally entangled in. The One Number is built around that AEC-specific reality: fee structure, project concentration, and how much of the firm’s judgment lives in one person’s head.'},
 {t:'normal',k:'The 5 P’s',title:'Scaling an AEC firm is a small set of decisions, not a hundred tactics.',body:'Franne teaches The 5 P’s, her own five-part framework for where an owner’s focus, productivity, and growth attention should go as the firm grows past founder-run. Getting this short list right is what moves The One Number; getting distracted by everything else is what keeps it flat.'},
 {t:'normal',k:'N.E.R.V.E.S.',title:'Changing how the firm runs is a leadership problem before it is a systems problem.',body:'Franne also teaches N.E.R.V.E.S., her own named framework for staying calm, confident, and courageous through the pressure points of running, and eventually exiting, a firm. The systems only stick if the owner can hold steady while they go in.'},
 {t:'dark',title:'You do not fix The One Number with a pep talk. You fix it by moving decisions off your desk, on purpose.'},

 {t:'section',idx:'Part Three',title:'What Moving The Number Looks Like'},
 {t:'normal',k:'A documented result',title:'A 25-person architecture firm doubled net margin in 18 months.',body:'Working with Franne, the firm rebuilt fee discipline and studio leadership so decisions no longer ran exclusively through the founder. Net margin doubled over the engagement. Results vary by firm, market, and effort.'},
 {t:'normal',k:'Why Franne McNeal',title:'35 years advising AEC owners, and a credential from outside the coaching world.',body:'Franne McNeal, MBA, led the Goldman Sachs 10,000 Small Businesses program in Philadelphia, a competitive-admission cohort for established small-business owners, before founding Significant Business Results. She is a Certified Value Builder Advisor and has advised architecture, engineering, and construction firm owners for 35-plus years.'},

 {t:'section',idx:'Your Next Step',title:'Find Your Own Number'},
 {t:'normal',k:'How the advisory works',title:'Three tiers, built around where your firm actually is.',body:'Foundation finds the profit leaks and the few moves that matter most. Growth strengthens margin and leadership so decisions stop running through you alone. Enterprise prepares the firm for a transition, a sale, or a partner buy-in, on your timeline.'},
 {t:'cta',title:'Ready to find your number?',chips:['Take the Value Builder Assessment','Book a Discovery Call'],disc:'Educational content for architecture, engineering, and construction firm owners. No revenue, valuation, or growth result is guaranteed. Results vary by firm, market, and effort.'},
];

const deck=document.getElementById('deck');
function tickSvg(kind){return `<svg class="tick-motif ${kind==='title'?'title-tick':'corner-tick'}"><use href="#tick"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Significant Business <b>Results</b> &middot; Franne McNeal</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=tickSvg(s.arc);
  else if(s.t==='title') h+=tickSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
