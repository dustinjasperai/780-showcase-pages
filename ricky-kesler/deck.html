<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Building Traffic That Lasts · Ricky Kesler · Income School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7fafc; --panel:#ffffff; --rule:#e3e8ef;
    --ink:#262a4a; --acc:#0056a7; --acc2:#1daeef; --grey:#5b6472; --dim:#9aa3b2;
    --deep:#262a4a;
  }
  html,body{height:100%}
  body{background:#e9edf2;font-family:'Newsreader',Georgia,serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9edf2}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Outfit',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Outfit',sans-serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:-.015em}
  .t-title h1{font-size:5vw;max-width:94%;font-weight:700}
  .t-title .sub{font-size:1.7vw}
  .t-normal h1{font-size:3vw;max-width:88%}
  .t-normal .body{font-family:'Newsreader',serif;font-size:1.55vw;color:var(--grey);margin-top:2.8vh;max-width:78%;line-height:1.55;font-weight:400}
  .sub{font-family:'Newsreader',serif;font-size:1.7vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.46;font-weight:400}
  .bar{width:7vw;height:5px;background:var(--acc);border-radius:2px;margin-bottom:3vh}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Outfit',sans-serif;font-size:1.25vw;font-weight:600;color:var(--acc);margin-bottom:1.6vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:90%}
  .t-section .rule{width:12vw;height:5px;background:var(--acc2);border-radius:2px;margin-top:3.4vh}
  .t-dark{background:var(--deep);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:88%;font-weight:500;color:#fff;letter-spacing:-.006em}
  .t-dark .a{color:var(--acc2)}
  .t-cta{background:var(--deep);align-items:center;text-align:center}
  .t-cta h1{font-size:3.5vw;max-width:86%;color:#fff}
  .t-cta .a{color:var(--acc2)}
  .chips{display:flex;gap:1.1vw;margin-top:4.4vh;flex-wrap:wrap}
  .chip{border:1px solid var(--acc);color:var(--ink);border-radius:100px;padding:1.4vh 1.9vw;font-family:'Outfit',sans-serif;font-size:1.15vw;font-weight:500;letter-spacing:.01em}
  .chip b{color:var(--acc);font-weight:600}
  .t-cta .chips{justify-content:center}
  .stack{display:flex;flex-direction:column;gap:2.2vh;margin-top:4vh;max-width:84%}
  .step{display:flex;gap:1.5vw;align-items:baseline}
  .step .n{font-family:'Outfit',sans-serif;font-size:1.55vw;font-weight:700;color:var(--acc);min-width:2.2vw}
  .step .st{font-family:'Newsreader',serif;font-size:1.5vw;color:var(--grey);font-weight:400;line-height:1.5}
  .step .st b{color:var(--ink);font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-family:'Outfit',sans-serif;font-size:.9vw;color:rgba(255,255,255,.62);text-align:center;line-height:1.45}
  .brandline{font-family:'Outfit',sans-serif;font-size:1.25vw;color:var(--grey);margin-top:3.8vh;font-weight:400;letter-spacing:.05em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:600}
  .t-cta .brandline{color:rgba(255,255,255,.8)}
  .t-cta .brandline b{color:var(--acc2)}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(38,42,74,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Outfit',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Outfit',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Outfit',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.7vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}.t-cta h1{font-size:6.6vw}
    .chip{font-size:2.7vw}.brandline{font-size:2.7vw}.step .n,.step .st{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Income School</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'Building Traffic That Lasts',sub:'How to grow a blog or YouTube channel that keeps earning for years, built on genuinely helpful content and no tricks.',brand:true},

 {t:'normal',k:'Who this is for',title:'You have published. The traffic still is not coming.',body:'You started a site or a channel. You did the work, you hit publish, and Google and YouTube stayed quiet. You are not lazy and you are not missing some secret. You were just never shown how search actually decides who wins. If that is you, this hour is built for you.'},
 {t:'normal',k:'The advice you were given',title:'Chase the algorithm. Build backlinks. Buy the tools.',body:'The make money online world sells hacks. Backlink schemes, paid keyword tools, thin articles pumped out at volume, and the promise that passive income is one trick away. Most of it either does not work or stops working the next time Google changes its mind.'},
 {t:'dark',title:'Durable traffic is not <span class="a">hacked</span>. It is <span class="a">earned</span>, one genuinely helpful answer at a time.'},

 {t:'section',idx:'Part One',title:'Why Most Content Never Ranks'},
 {t:'normal',k:'The competition trap',title:'You are writing for searches you can never win',body:'Most new creators aim at the biggest, most obvious keywords, the exact terms that huge established sites already own. You can write the best article in the world and still sit on page four, because you picked a fight you were never going to win. The problem is almost never your writing. It is the target.'},
 {t:'normal',k:'The algorithm chase',title:'Tricks age badly. Helpfulness does not.',body:'Every backlink scheme and clever loophole has a shelf life. When the next update lands, the sites built on tricks fall off a cliff. The pages that keep ranking are the ones that genuinely answer the question better than anyone else. We taught this for years before Google made helpful content its official standard.'},
 {t:'dark',title:'Google does not owe you traffic. It rewards the page that <span class="a">best answers</span> the search.'},

 {t:'section',idx:'Part Two',title:'The Method: Find It, Win It, Answer It'},
 {t:'normal',k:'Alphabet Soup',title:'Find the questions people are actually typing',body:'Instead of paying for a keyword tool, you type a seed topic into Google followed by each letter of the alphabet and read back the autocomplete. Those are real phrases real people are searching for right now. It is free, it is manual, and it surfaces the specific questions the big tools smooth over.'},
 {t:'normal',k:'Search Analysis',title:'Do not just find a keyword. Judge whether you can win it.',body:'Before you write a word, look at what already ranks for that phrase. When the current results are thin, off topic, or old forum threads, that is a search a brand new site can win. Picking responsive, low competition topics is the single decision that separates traffic from silence.'},
 {t:'normal',k:'Helpful Content',title:'Be the best answer on the page',body:'Once you have a topic you can win, the job is simple to say and hard to fake: fully answer the question, better than every result above you. No keyword stuffing, no filler, no schemes. Write the page you wish you had found. That is the whole ranking strategy, and it is the one that lasts.'},
 {t:'normal',k:'Beyond the blog',title:'The same method builds a YouTube channel',body:'Search rewards helpfulness on video too. Choose a channel topic with real demand, make the video types that topic actually calls for, and build the handful of skills that let you execute. The same honest approach, a second traffic source, and more than one way to earn from it.'},
 {t:'normal',k:'The 24-month path',title:'A realistic timeline, not an overnight promise',chips:['<b>Month 1</b> &nbsp;your first small win','<b>Middle</b> &nbsp;traffic compounds','<b>~Month 24</b> &nbsp;a real income'],body:'This is the honest version. A staged plan that treats a first few dollars as a milestone worth celebrating, then builds compounding traffic toward replacing a full time income over about two years. Slower than the hype, and far more likely to still be standing.'},
 {t:'dark',title:'The people who win are not the fastest. They are the ones still <span class="a">publishing</span> in month eighteen.'},

 {t:'section',idx:'Part Three',title:'From First Post To Real Traffic'},
 {t:'normal',k:'A repeatable week',title:'A loop you can run for years',steps:[['1','<b>Find a topic you can win.</b> Alphabet Soup for the questions, Search Analysis to confirm the results are beatable.'],['2','<b>Answer it better than anyone.</b> One genuinely helpful piece, fully worked, no shortcuts.'],['3','<b>Publish and repeat.</b> Move to the next winnable topic while the last one starts to compound.']]},
 {t:'normal',k:'Why listen to us',title:'We taught this before it was the consensus',body:'We have been building niche sites since 2010 and grew Income School into a company that teaches this full time. We were teaching genuinely helpful content long before Google made it the official rule. Nothing here is theory borrowed from a guru. It is the method we use ourselves and teach inside Project 24.'},
 {t:'dark',title:'You do not need another hack. You need a topic you can win and the patience to <span class="a">answer it well</span>.'},

 {t:'cta',title:'Want the whole system, step by step? Start free with Income School, then build it with us inside Project 24.',brandcta:true,disc:'This masterclass is educational. It shares a method, not a promise of results. No income or business result is guaranteed. Results vary by person, niche, effort, and time.'},
];

const deck=document.getElementById('deck');
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`;
  } else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    else if(s.t==='normal') h+=`<div class="bar"></div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
    if(s.steps) h+=`<div class="stack">`+s.steps.map(st=>`<div class="step"><div class="n">${st[0]}</div><div class="st">${st[1]}</div></div>`).join('')+`</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Income School &middot; with <b>Ricky Kesler</b></div>`;
    if(s.brandcta) h+=`<div class="brandline">incomeschool.com &middot; <b>Start for free</b></div>`;
  }
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
