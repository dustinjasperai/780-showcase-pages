<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win the Work Without Pitching — a masterclass by Blair Enns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f8f8f6;      /* their warm off-white */
    --panel:#ffffff;
    --ink:#092439;         /* their deep navy */
    --muted:#5c6b78;
    --rule:#d1dae0;        /* their pale slate */
    --accent:#20507d;      /* their slate-blue */
    --serif:'Libre Baskerville', Georgia, serif;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ground);color:var(--ink);font-family:var(--sans)}
  body{padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:34px}
  .slide{
    width:100%;max-width:960px;aspect-ratio:16/9;background:var(--panel);
    border:1px solid var(--rule);border-radius:10px;
    padding:64px 72px;display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(9,36,57,.03);
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1.1;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.15}
  .sub{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--muted);margin-top:18px;line-height:1.4}
  .body{font-size:19px;line-height:1.6;color:var(--ink);margin-top:20px;max-width:62ch}
  .note{font-size:16px;color:var(--muted);margin-top:16px;font-style:italic}
  .foot{position:absolute;left:72px;bottom:40px;font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .num{font-family:var(--serif);font-size:16px;color:var(--accent);letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:14px}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px}
  li{font-size:19px;line-height:1.5;padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .four{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .fcard{border:1px solid var(--rule);border-radius:8px;padding:20px 22px;background:var(--ground)}
  .fcard .k{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--accent)}
  .fcard .v{font-size:15px;line-height:1.5;color:var(--ink);margin-top:8px}
  .step{margin-top:24px;display:inline-block;align-self:flex-start;font-family:var(--sans);
    font-weight:600;font-size:18px;color:var(--panel);background:var(--accent);
    padding:14px 26px;border-radius:8px}
  .disc{position:absolute;left:72px;right:72px;bottom:30px;font-size:12px;line-height:1.5;color:var(--muted)}
  .pageno{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--rule)}
  @media (max-width:720px){.slide{padding:38px 30px;aspect-ratio:auto;min-height:72vw}
    h1{font-size:32px}h2{font-size:26px}.four{grid-template-columns:1fr}.foot,.disc{position:static;margin-top:22px;left:auto}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass', h:'Win the Work Without Pitching',
   sub:'How experts sell by leading the conversation, not by presenting harder',
   foot:'Blair Enns · Win Without Pitching'},

  {t:'who', kicker:'Who this is for', h:'For the firm that is done auditioning',
   list:['Creative and design firm owners','Independent consultants and expert advisors',
     'Anyone tired of pitching, discounting, and spec work to win the work']},

  {t:'trap', kicker:'The trap', h:'You were taught to win by presenting',
   body:'Send the proposal. Build the deck. Show your thinking for free. Then wait, and hope you are the one they liked who also came in cheapest.',
   note:'It feels like selling. It is really auditioning.'},

  {t:'point', kicker:'The hard truth', h:'Pitching trains clients to treat you like a vendor',
   body:'Every free presentation quietly says the same thing: my expertise is worth nothing until you approve it. So clients do the natural thing and shop you on price.'},

  {t:'section', num:'Part One', h:'The real problem is your posture',
   sub:'Not your work. Your position in the room.'},

  {t:'point', h:'The vendor presents. The expert diagnoses.',
   body:'A doctor does not pitch you three treatment decks and then discount the surgery. They ask questions, diagnose, and prescribe. You are the expert. The sale should look like that.'},

  {t:'point', h:'Stop pitching. Start diagnosing.',
   body:'The moment you lead with questions instead of answers, the power in the conversation moves to you. You stop competing and start prescribing.'},

  {t:'section', num:'Part Two', h:'The Four Conversations',
   sub:'The entire sale, reframed as four conversations that you lead'},

  {t:'four', h:'The Four Conversations',
   items:[
     {k:'1. Probative', v:'Earn the right to lead. Show expertise so they want your guidance.'},
     {k:'2. Qualifying', v:'Decide together if this is a fit, before anyone invests more.'},
     {k:'3. Value', v:'Uncover the outcome they truly want, and what it is worth.'},
     {k:'4. Closing', v:'Secure the commitment. No pressure, no discount, no spec.'}
   ]},

  {t:'point', kicker:'Conversation One', h:'Probative: earn the right to lead',
   body:'Before anything else, show you understand their world better than they expected. Expertise, shown generously, is what earns you the lead in the conversation that follows.'},

  {t:'point', kicker:'Conversation Two', h:'Qualifying: decide if it fits',
   body:'Not every client is your client. Qualifying out the wrong fits early is exactly what lets you charge more and do better work for the right ones.'},

  {t:'point', kicker:'Conversation Three', h:'Value: price the outcome, not the hours',
   body:'Talk about money early. Uncover what the result is genuinely worth to them, then price that outcome. The billable hour caps your value at the clock.'},

  {t:'point', kicker:'Pricing Creativity', h:'Three options. One page. No pitch.',
   body:'Give them a tiered proposal with three options, so the choice becomes which, not whether. Anchor high, keep it to a page, and let them choose.'},

  {t:'point', kicker:'Conversation Four', h:'Closing: secure the commitment',
   body:'When you have diagnosed and priced the outcome, closing is not persuasion. It is confirming a decision you both already reached together.'},

  {t:'section', num:'Part Three', h:'What changes when you lead',
   sub:'When you stop pitching and start leading'},

  {t:'point', h:'You win more of the right work',
   body:'Fewer proposals. Higher close rates. Better-fit clients. And prices set by the value of the outcome, instead of by the hours it happened to take.'},

  {t:'point', kicker:'The Perpetual Pipeline', h:'Demand that comes to you',
   body:'When you lead with expertise, demand starts arriving on its own. Qualified prospects show up already wanting to work with you, instead of being chased.'},

  {t:'why', kicker:'Why me', h:'Blair Enns',
   body:'Founder of Win Without Pitching, and author of The Win Without Pitching Manifesto and Pricing Creativity. For two decades I have helped creative firms and expert advisors stop pitching and start winning the work as the expert in the room.'},

  {t:'cta', kicker:'Go deeper', h:'Win your next clients as the expert',
   body:'If this is how you want to win your next clients, the next step is simply a conversation.',
   step:'Book a coaching call with Win Without Pitching',
   disc:'Educational content only. No income, revenue, or business result is guaranteed. Outcomes vary and depend on many factors, including your own effort, offer, and market.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}

function render(){
  const deck=document.getElementById('deck');
  S.forEach((s,i)=>{
    const d=el('div','slide');
    if(s.kicker) d.appendChild(el('div','kicker',s.kicker));
    if(s.num) d.appendChild(el('div','num',s.num));
    if(s.t==='title'){
      d.appendChild(el('h1',null,s.h));
      if(s.sub) d.appendChild(el('div','sub',s.sub));
      if(s.foot) d.appendChild(el('div','foot',s.foot));
    } else if(s.t==='section'){
      d.appendChild(el('h2',null,s.h));
      if(s.sub) d.appendChild(el('div','sub',s.sub));
    } else if(s.t==='who'){
      d.appendChild(el('h2',null,s.h));
      const ul=el('ul'); s.list.forEach(x=>ul.appendChild(el('li',null,x))); d.appendChild(ul);
    } else if(s.t==='four'){
      d.appendChild(el('h2',null,s.h));
      const g=el('div','four');
      s.items.forEach(it=>{const c=el('div','fcard'); c.appendChild(el('div','k',it.k)); c.appendChild(el('div','v',it.v)); g.appendChild(c);});
      d.appendChild(g);
    } else if(s.t==='cta'){
      d.appendChild(el('h2',null,s.h));
      if(s.body) d.appendChild(el('div','body',s.body));
      if(s.step) d.appendChild(el('div','step',s.step));
      if(s.disc) d.appendChild(el('div','disc',s.disc));
    } else { // point, trap, why
      d.appendChild(el('h2',null,s.h));
      if(s.body) d.appendChild(el('div','body',s.body));
      if(s.note) d.appendChild(el('div','note',s.note));
    }
    d.appendChild(el('div','pageno',(i+1)+' / '+S.length));
    deck.appendChild(d);
  });
}
render();
</script>
</body>
</html>
