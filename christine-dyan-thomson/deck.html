<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindset First — A Live Masterclass with Christine Dyan Thomson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ee;        /* warm ivory ground */
    --panel:#f2e9da;     /* warm parchment panel */
    --ink:#4b3a32;       /* warm espresso, from site probe */
    --rule:#4b3a32;      /* rule = ink */
    --muted:#8a7768;     /* muted espresso */
    --accent:#c1962e;    /* manipura gold (solar-plexus) */
    --accent-soft:#e7cf94;
    --head:'Unbounded', system-ui, sans-serif;
    --body:'Newsreader', Georgia, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e9e0d2;color:var(--ink);font-family:var(--body)}
  .deck{max-width:1120px;margin:0 auto;padding:32px 18px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid #e4d8c4;
    border-radius:18px;padding:64px 62px;margin:22px 0;min-height:600px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 10px 34px rgba(75,58,50,.08);
  }
  /* solar-plexus core light motif */
  .slide::after{
    content:"";position:absolute;right:-140px;top:50%;transform:translateY(-50%);
    width:420px;height:420px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(193,150,46,.20) 0%, rgba(193,150,46,.06) 45%, rgba(193,150,46,0) 70%);
  }
  .slide > *{position:relative;z-index:1}
  .kick{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent)}
  .num{position:absolute;top:26px;right:30px;font-family:var(--head);font-size:12px;
    letter-spacing:.12em;color:var(--muted);z-index:2}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.04;
    letter-spacing:-.01em;margin:18px 0 20px}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.08;margin:14px 0 18px}
  .lead{font-size:27px;line-height:1.4;max-width:40ch}
  p.body{font-size:22px;line-height:1.5;max-width:44ch;color:#5c4a3f;margin-top:14px}
  .em{color:var(--accent);font-style:italic}
  .big{font-family:var(--head);font-weight:700;font-size:72px;line-height:1;color:var(--ink)}
  .rule{width:64px;height:4px;background:var(--accent);border-radius:3px;margin:8px 0 22px}
  ul.pillars{list-style:none;margin-top:22px;display:grid;gap:16px;max-width:46ch}
  ul.pillars li{background:var(--panel);border-left:5px solid var(--accent);
    border-radius:10px;padding:18px 20px;font-size:21px;line-height:1.4}
  ul.pillars li b{font-family:var(--head);font-weight:600;font-size:15px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink);display:block;margin-bottom:4px}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
  .steps div{background:var(--panel);border-radius:12px;padding:22px}
  .steps b{font-family:var(--head);color:var(--accent);font-size:30px;display:block}
  .steps span{font-size:18px;line-height:1.35;color:#5c4a3f;display:block;margin-top:8px}
  .quote{font-size:34px;line-height:1.28;max-width:30ch;font-weight:500}
  .who{display:grid;gap:12px;margin-top:22px;max-width:44ch}
  .who div{font-size:21px;line-height:1.4;padding-left:26px;position:relative}
  .who div::before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;
    border-radius:50%;background:var(--accent)}
  .cta-box{background:var(--ink);color:var(--bg);border-radius:16px;padding:38px 40px;max-width:52ch;margin-top:24px}
  .cta-box .btn{display:inline-block;margin-top:18px;background:var(--accent);color:#2a2019;
    font-family:var(--head);font-weight:600;font-size:19px;padding:14px 26px;border-radius:10px}
  .disc{font-size:14px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:60ch}
  .foot{position:absolute;left:62px;bottom:28px;font-family:var(--head);font-size:12px;
    letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .cover{background:linear-gradient(160deg,#fbf7ef 0%,#f3ead9 100%)}
  .cover h1{font-size:66px}
  @media(max-width:720px){
    .slide{padding:40px 26px;min-height:460px}
    h1,.cover h1{font-size:40px}h2{font-size:30px}.big{font-size:52px}.quote{font-size:26px}
    .steps{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<footer style="max-width:1120px;margin:0 auto;padding:8px 24px 48px;font-family:'Newsreader',Georgia,serif;font-size:13px;line-height:1.5;color:#8a7768">
Educational disclaimer: This masterclass is for educational purposes only. No income or result is guaranteed. Results vary and depend on your own work, market and circumstances. It shares a method and a mindset, not a promise of earnings.
</footer>
<script>
const COACH = "Christine Dyan Thomson";
const BRAND = "The Manipura Centre";
const S = [
  {t:'cover', kick:'A live masterclass with '+COACH, h:'Mindset First',
   lead:'The real reason business coaching isn’t working for your nutrition practice, and the shift that finally moves your income.'},

  {t:'title', kick:'Who this is for', h:'You are great at the work. You are still undercharging.',
   who:['You are a dietitian with real results for your clients.',
        'You have taken the business courses and you know the strategy.',
        'And your rates have barely moved in years.']},

  {t:'lead', kick:'The trap', h:'More strategy has not fixed it.',
   body:'You bought the funnel course. You learned the marketing. You keep collecting tactics. And the number you charge still makes your stomach drop. So you tell yourself you need one more system.'},

  {t:'quote', kick:'The reframe', q:'It was never a strategy problem. It is a worth problem.',
   sub:'That is the whole reason the tactics have not landed.'},

  {t:'part', kick:'Part one', h:'The money story underneath',
   body:'Before we touch a single tactic, we name what is actually running the pricing decision.'},

  {t:'lead', kick:'It all works', h:'Everything works. So why do people quit?',
   body:'Every program works. Every strategy works. People do not fail because the thing was wrong. They stop working it. The worst sentence you can say is “it did not work.” The freeing one is “I did not keep working it.” That is where your power is.'},

  {t:'lead', kick:'The undercharging reflex', h:'Imposter syndrome is not your weakness.',
   body:'It is the sign you are standing at the edge of your next level. Dietitians undercharge because they price from fear, not from evidence. We change what the price is coming from.'},

  {t:'part', kick:'Part two', h:'The Mindset First Approach',
   body:'The method behind six and seven figure nutrition businesses. Three pillars, in order, mindset first.'},

  {t:'pillars', kick:'The three pillars', h:'Mindset, then productivity, then marketing.',
   items:[['Mindset','Clear the worth and money block so you can charge from evidence, not fear.'],
          ['Productivity','Protect your time and capacity so growth does not cost you your life.'],
          ['Marketing','Attract aligned clients who are a fit, so selling stops feeling like convincing.']]},

  {t:'lead', kick:'Radical self responsibility', h:'From “it did not work” to “what can I do differently.”',
   body:'When you own the result, you get to change it. This one shift ends the program hopping and the blaming of niches, algorithms and markets. You stop looking for the next tactic and start finishing the one in front of you.'},

  {t:'lead', kick:'Confidence on facts, not feelings', h:'Keep an evidence journal.',
   body:'Your confidence cannot run on how you feel on a Tuesday. It has to run on facts. Write down every client win, every result, every breakthrough. When it is time to name your price, you read the evidence instead of the fear.'},

  {t:'part', kick:'Part three', h:'What changes once worth leads',
   body:'What shifts in your nutrition business once the mindset goes first.'},

  {t:'lead', kick:'Charging what you are worth', h:'You raise your rate and nobody blinks.',
   body:'Because you are pricing from evidence and speaking to aligned clients, the number stops being a fight. You say it plainly. The right people say yes. The wrong fit was never your client anyway.'},

  {t:'lead', kick:'An aligned, values led business', h:'Manipura. Your center of personal power.',
   body:'The Manipura Centre is named for the solar plexus, the seat of confidence and worth. A dietitian who owns that builds a business that reflects her values, not one that copies everyone else in the feed.'},

  {t:'why', kick:'Why me', h:'I have walked hundreds of dietitians through this.',
   who:['Registered Dietitian, Certified Life Coach, and Money Mindset Mentor.',
        'Founder of '+BRAND+' and host of the Make More Money as a Dietitian podcast.',
        'I have mentored hundreds of dietitians on everything from pricing to purpose.']},

  {t:'quote', kick:'The shift', q:'Do the mindset first. Then the tactics finally land.',
   sub:'That is the order almost nobody teaches, and it is the whole difference.'},

  {t:'cta', kick:'Your next step', h:'Let us map your plan.',
   body:'If this is the work you are ready for, book a free consultation. We will look at where you are, what is not working, and what charging what you are worth would actually mean for your business.',
   btn:'Book your free consultation', foot:BRAND,
   disc:'Educational disclaimer: this masterclass is for educational purposes only. No income or result is guaranteed. Results vary and depend on your own work, market and circumstances. It shares a method and a mindset, not a promise of earnings.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cover'?' cover':'');
  let inner = `<span class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span>`;
  if(s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if(s.t==='cover'){ inner += `<h1>${s.h}</h1><div class="rule"></div><p class="lead">${s.lead}</p>`; }
  else if(s.t==='quote'){ inner += `<div class="rule"></div><p class="quote em">${s.q}</p><p class="body">${s.sub||''}</p>`; }
  else if(s.t==='part'){ inner += `<h2>${s.h}</h2><div class="rule"></div><p class="body">${s.body||''}</p>`; }
  else if(s.t==='pillars'){ inner += `<h2>${s.h}</h2><div class="rule"></div><ul class="pillars">`+
      s.items.map(it=>`<li><b>${it[0]}</b>${it[1]}</li>`).join('')+`</ul>`; }
  else if(s.t==='title'||s.t==='who'||s.t==='why'){ inner += `<h2>${s.h}</h2><div class="rule"></div><div class="who">`+
      (s.who||[]).map(w=>`<div>${w}</div>`).join('')+`</div>`; }
  else if(s.t==='cta'){ inner += `<h1>${s.h}</h1><div class="rule"></div>`+
      `<div class="cta-box"><p style="font-size:21px;line-height:1.45">${s.body}</p>`+
      `<span class="btn">${s.btn}</span></div>`+
      `<p class="disc">${s.disc}</p>`+
      `<div class="foot">${s.foot}</div>`; }
  else { inner += `<h2>${s.h}</h2><div class="rule"></div><p class="body">${s.body||''}</p>`; }
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
