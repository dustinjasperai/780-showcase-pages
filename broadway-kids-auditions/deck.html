<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broadway Kids Auditions — The Right Song Books the Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfdfe; --panel:#eef9fb; --ink:#0f3a40; --muted:#4a6a70;
    --rule:#cfe9ed; --accent:#32bac8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Source Sans 3",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px}
  .slide{background:#fff;border:1px solid var(--rule);border-radius:18px;
    padding:48px 44px;margin:22px 0;box-shadow:0 10px 30px rgba(15,58,64,.05);
    position:relative;overflow:hidden}
  .slide.title{background:
    radial-gradient(900px 320px at 20% 0%, rgba(50,186,200,.22), transparent 60%),#fff}
  .k{font-family:"Poppins",sans-serif;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin:0 0 14px}
  h1{font-family:"Poppins",sans-serif;font-weight:800;font-size:42px;line-height:1.08;
    margin:0 0 16px;letter-spacing:-.01em}
  h2{font-family:"Poppins",sans-serif;font-weight:700;font-size:30px;line-height:1.12;
    margin:0 0 14px}
  .sub{font-size:19px;color:var(--muted);margin:0 0 6px;max-width:62ch}
  ul{margin:14px 0 0;padding:0 0 0 2px;list-style:none}
  li{position:relative;padding:9px 0 9px 30px;font-size:18px;border-top:1px solid var(--rule)}
  li:first-child{border-top:0}
  li:before{content:"";position:absolute;left:4px;top:18px;width:10px;height:10px;
    border-radius:50%;background:var(--accent)}
  .note{margin-top:18px;font-size:15px;color:var(--muted)}
  .pill{display:inline-block;font-family:"Poppins",sans-serif;font-weight:600;font-size:13px;
    color:var(--ink);background:var(--panel);border:1px solid var(--rule);
    border-radius:999px;padding:6px 14px;margin:0 8px 8px 0}
  .big{font-family:"Poppins",sans-serif;font-weight:800;font-size:54px;color:var(--accent);
    line-height:1}
  .disc{margin-top:20px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);
    padding-top:14px;max-width:70ch}
  .n{position:absolute;right:26px;top:22px;font-family:"Poppins",sans-serif;font-weight:600;
    font-size:12px;color:var(--rule)}
  .cta h1{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title', k:'Broadway Kids Auditions', h:'The Right Song Books the Room',
    sub:'How young performers actually get cast, and the one choice most families get wrong. A live session for parents of performers ages 8 to 18.'},

  {t:'who', k:'Who this is for', h:'You have a talented kid. They keep getting cut.',
    sub:'This is for parents of performers ages 8 to 18 who are putting in the work, taking the lessons, showing up to every call, and still watching their child get passed over.',
    list:['Your child has real ability and loves to perform',
          'They train hard but the callbacks are not coming',
          'You are not sure what is actually going wrong in the room']},

  {t:'who', k:'What this costs a kid', h:'It is not just a lost role.',
    sub:'Every unexplained cut chips at a young performer. The child starts to believe they are not good enough, when the truth is almost always smaller and very fixable.',
    list:['Talent stays, confidence quietly erodes',
          'Families spend more on lessons chasing the wrong fix',
          'The joy that started all of this starts to fade']},

  {t:'reframe', k:'The hard truth', h:'Most kids are not cut for a lack of talent. They are cut for the wrong song.',
    sub:'In the first sixteen bars, a casting director already knows whether a child fits the role. Talented kids lose that moment every day because the material was never right for them.'},

  {t:'part', k:'Part one', h:'The sixteen-bar trap',
    sub:'A young performer gets a short window to show who they are. Three things quietly sink them before they ever finish:',
    list:['A song written for an adult voice, shrunk onto a child',
          'Material the child does not actually understand or connect to',
          'A cut that trails off instead of landing on a strong button'],
    note:'None of these are talent problems. They are choices, and choices can be fixed.'},

  {t:'part', k:'Part one', h:'Why more lessons rarely fix it',
    sub:'When a child keeps getting cut, the instinct is to add classes. But more reps on the wrong material only polishes the wrong choice. The lever that moves is what the child brings into the room.'},

  {t:'part', k:'Part two', h:'What we teach at BKA, in three pillars',
    sub:'Everything we do with a young performer sits on three pillars. Together they are the difference between a kid who is overlooked and a kid the room remembers.'},

  {t:'framework', k:'Pillar one', h:'The Right Skills',
    sub:'Real technique across voice, acting and dance, built for where the child is developmentally, not adult training scaled down.',
    list:['Vocal work from musical directors with real Broadway audition experience',
          'Acting and scene study matched to the child’s age and range',
          'Dance drawn from actual Broadway choreography']},

  {t:'framework', k:'Pillar two', h:'The Confidence To Excel',
    sub:'A self-assured child with a well chosen song beats a technically perfect but anxious one in the room, every time. We build that confidence on purpose.',
    list:['Developing each performer’s individual strengths, not a template',
          'Preparing a child to own the room, not just survive it',
          'Confidence that holds up inside and outside the audition']},

  {t:'framework', k:'Pillar three', h:'A Nurturing Space, and a Door to the Industry',
    sub:'A supportive place to discover their artistic voice, connected directly to the people who cast.',
    list:['Showcases in front of working casting directors, agents and managers',
          'The BKA Talent Database, surfaced to industry professionals',
          'The Call Board, so your family is never guessing alone']},

  {t:'deep', k:'The choice that changes everything', h:'The right material, chosen on purpose',
    sub:'This is the work BKA is known for: matching the right song, scene and monologue to the right child at the right stage, from a curated library handpicked for young performers.',
    list:['A ballad that genuinely fits their voice and range',
          'A comedic monologue they understand and can play',
          'A cut that ends strong and shows who they are']},

  {t:'deep', k:'Age appropriate, on purpose', h:'The song that books a sixteen year old can sink a ten year old.',
    sub:'Material has to grow with the child. What reads as charming at ten reads as unprepared at sixteen, and the reverse is just as true. A rep book is built, not borrowed.'},

  {t:'deep', k:'Technique that serves the song', h:'Skill is in service of the story, never the show-off.',
    sub:'The strongest young auditions are not the loudest or the highest. They are the clearest. We train technique so it disappears into an honest, specific performance the room believes.'},

  {t:'deep', k:'Confidence you can see', h:'The kid who owns the room, before a note is sung',
    sub:'Casting remembers how a child made them feel. Walk-in, slate, eye contact and recovery are teachable, and they often decide the read as much as the singing does.'},

  {t:'deep', k:'What the room sees', h:'Casting decides in about ninety seconds.',
    sub:'Agents, managers and casting directors form a read fast. When the material fits the child and the child is confident, that ninety seconds works for you instead of against you.'},

  {t:'part', k:'Part three', h:'When the song, the skill and the confidence line up',
    sub:'A performer who walks in with the right song, the technique to deliver it, and the confidence to be themselves is a performer the room wants to see again.',
    list:['The right material, chosen for this child, this year',
          'Technique that serves the song instead of showing off',
          'A kid who leaves the room proud, booked or not']},

  {t:'part', k:'Part three', h:'A season, not a single audition',
    sub:'Booking is rarely one perfect day. It is a prepared child showing up again and again with material that fits, building a track record the industry starts to recognize.'},

  {t:'cred', k:'Why BKA', h:'The people in the room with your child',
    sub:'Broadway Kids Auditions is led by Artistic Director Kurt Domoney, a sought after audition and repertoire coach for young performers, with a coaching team of working Broadway professionals.',
    list:['Coaches who work on and audition for Broadway',
          'A curated, age-appropriate library built for young performers',
          'Direct showcases and a talent database connected to the industry']},

  {t:'cred', k:'Built around access', h:'Trained performers, meet the people who cast',
    sub:'BKA is structured as a bridge: our showcases put your child in front of working casting directors, agents and managers, and the Call Board keeps your family guided between them.',
    list:['Agent, manager and casting-director showcases in NYC',
          'The BKA Talent Database, seen by industry professionals',
          'Ongoing guidance so you are never navigating this alone']},

  {t:'cta', k:'Your next step', h:'Let us build your child’s audition the right way',
    sub:'If your performer is talented and still getting cut, the fastest change is almost always the material and the confidence behind it. That is what we do, every day, in New York City.',
    list:['Book a private audition-coaching consult with a BKA coach',
          'Or join the next BKA Summer Intensive, live in NYC'],
    disc:'Educational only. No booking, casting, representation, income or result is guaranteed. Every young performer is different and results vary. Broadway Kids Auditions coaches and prepares performers; it does not promise auditions or roles.'}
];

const app = document.getElementById('app');
S.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'slide ' + (s.t === 'title' ? 'title' : (s.t === 'cta' ? 'cta' : ''));
  let html = '<div class="n">' + (i + 1) + ' / ' + S.length + '</div>';
  if (s.k) html += '<p class="k">' + s.k + '</p>';
  html += (s.t === 'title' ? '<h1>' : '<h2>') + s.h + (s.t === 'title' ? '</h1>' : '</h2>');
  if (s.sub) html += '<p class="sub">' + s.sub + '</p>';
  if (s.list) { html += '<ul>'; s.list.forEach(x => html += '<li>' + x + '</li>'); html += '</ul>'; }
  if (s.note) html += '<p class="note">' + s.note + '</p>';
  if (s.disc) html += '<p class="disc">' + s.disc + '</p>';
  d.innerHTML = html;
  app.appendChild(d);
});
</script>
</body>
</html>
