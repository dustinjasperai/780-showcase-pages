<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Reactive Trap — ResponseABLE Parenting Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ee; --panel:#fffdf9; --ink:#1b1a18; --muted:#5d584f;
    --rule:#d9d3c7; --accent:#2042b1; --deep:#15307f; --accent-soft:#e7ecf8;
    --serif:'Spectral',Georgia,serif; --sans:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .k{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.14;letter-spacing:-.01em}
  .lead{font-size:20px;color:var(--muted);margin-top:20px;max-width:62ch}
  .body{font-size:18px;color:var(--ink);margin-top:18px;max-width:62ch}
  ul{margin-top:20px;max-width:60ch}
  li{font-size:18px;margin:0 0 12px;padding-left:26px;position:relative;list-style:none}
  li:before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:2px;
    background:var(--accent)}
  .pillar{display:flex;align-items:flex-start;gap:26px}
  .letter{font-family:var(--serif);font-weight:700;font-size:92px;line-height:.9;color:var(--accent)}
  .pillar .txt{padding-top:8px}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--deep);font-weight:600;
    font-size:14px;padding:6px 14px;border-radius:999px;margin-bottom:18px}
  .big{font-family:var(--serif);font-size:40px;line-height:1.1;font-weight:600;max-width:20ch}
  .strike{text-decoration:line-through;text-decoration-color:var(--rule);color:var(--muted)}
  .em{color:var(--accent)}
  .foot{margin-top:28px;font-size:13px;color:var(--muted);letter-spacing:.04em}
  .cta .body{margin-top:14px}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);
    padding-top:16px;max-width:64ch}
  .n{font-size:13px;color:var(--muted);letter-spacing:.1em;margin-top:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    k:'A live masterclass with Becky Jennings',
    h:'The Reactive Trap',
    b:'How to respond instead of react to your child with ADHD, even on the nights willpower runs out.'},

  {t:'agenda',
    k:'Who this is for',
    h:'If you have promised yourself you would not yell again, and then did',
    items:[
      'Parents of a child with ADHD, stuck in the same bedtime and homework blowups',
      'You have tried the charts, the rewards, the consequences, and nothing holds',
      'You do not want to manage your child. You want to feel steady with them'
    ]},

  {t:'trap',
    k:'The trap',
    h:'You think the problem is your child’s behavior. It is the loop you are both caught in.',
    b:'Trigger, reaction, guilt, repeat. By 8pm you are running on an empty tank and reacting from it. That is not a character flaw. It is a nervous system doing exactly what an unregulated one does.'},

  {t:'reframe',
    tag:'The reframe',
    big:'You do not lack <span class="strike">willpower</span>. You lack a <span class="em">system</span>.'},

  {t:'point',
    k:'Part one: the core problem',
    h:'Why willpower fails in an ADHD home',
    items:[
      'ADHD turns ordinary moments into high demand moments: transitions, waiting, being told no',
      'Willpower is the first thing to go when your own system is flooded',
      'So the plan you made at a calm 10am is gone by a loud 6pm, every time',
      'The fix is not more trying. It is a system that does not depend on you being calm by luck'
    ]},

  {t:'point',
    k:'Part one: the core problem',
    h:'This is not behavior modification',
    b:'Sticker charts and consequence ladders try to manage the child from the outside. They assume the child could comply if they wanted to. In an ADHD home the skill is often missing, not the will. So the child fails the chart, you feel like you failed too, and the loop tightens.'},

  {t:'reframe',
    tag:'The shift',
    big:'The parent’s own regulation is the <span class="em">intervention</span>.'},

  {t:'section',
    k:'Part two',
    h:'The ResponseA.B.L.E. Method',
    b:'Four steps that build a response where a reaction used to be. You will leave today with the first two already started.'},

  {t:'pillar', letter:'A',
    k:'Step one',
    h:'Identify the pattern',
    b:'Name the exact trigger and reaction loop that plays out in your home. Not “he is difficult,” but the specific four seconds: what happens, what you feel, what you do. You cannot interrupt a pattern you cannot see.'},

  {t:'pillar', letter:'B',
    k:'Step two',
    h:'Build a family code',
    b:'Create a small, pre-agreed system that interrupts the pattern before it fires. A word, a move, an off-ramp everyone knows in advance. The decision is made once, in calm, so no one has to make it in the storm.'},

  {t:'pillar', letter:'L',
    k:'Step three',
    h:'Learn by rehearsal',
    b:'Practice the new response when nothing is wrong, so it is available when everything is. Calm under pressure is not a personality trait. It is a rehearsed skill, for you and for your child.'},

  {t:'pillar', letter:'E',
    k:'Step four',
    h:'Equip the skill underneath',
    b:'Behind most “misbehavior” sits an underdeveloped skill: starting a task, waiting, naming a feeling. You build that skill directly, so the behavior changes because the child is now able, not just afraid of the consequence.'},

  {t:'point',
    k:'Part three: a steadier home',
    h:'A week later, the same bedtime goes differently',
    items:[
      'The trigger still comes. You see it a beat earlier',
      'The family code gives everyone a move that is not a blowup',
      'You respond from a rehearsed place instead of an empty one',
      'Your child borrows your steadiness. Cooperation follows connection, in that order'
    ]},

  {t:'point',
    k:'Part three: a steadier home',
    h:'This is the work I teach every day',
    b:'I am Becky Jennings. I am a certified parent coach trained through the Jai Institute for Parenting, with ADHD behavior training recognized by CHADD. I am also a mom raising a son with ADHD, who learned the hard way that willpower was never going to be enough. The ResponseA.B.L.E. Method is what I built instead.'},

  {t:'recap',
    k:'The method, in one breath',
    h:'Identify the pattern. Build the code. Learn by rehearsal. Equip the skill.',
    b:'Respond instead of react. Heal yourself, and the connection with your child follows.'},

  {t:'cta',
    k:'Your next step',
    h:'Keep going with me',
    b:'If today gave you the first two steps, the full ResponseA.B.L.E. Method, the Listening Formula, and the Fast Way To Regulate challenge live inside my program, with weekly live coaching so you are not building this alone.',
    cta:'Join ResponseABLE Parenting at responseableparenting.com',
    disc:'This masterclass is educational and reflects one coaching approach. It is not therapy or medical advice. No specific result is guaranteed. Results vary from family to family.'}
];

function el(tag, cls, html){const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;}

const deck = document.getElementById('deck');
S.forEach(s=>{
  const sl = el('div','slide '+(s.t==='cta'?'cta':''));
  if(s.k) sl.appendChild(el('div','k',s.k));
  if(s.tag) sl.appendChild(el('span','tag',s.tag));
  if(s.big){ sl.appendChild(el('div','big',s.big)); }
  if(s.h){ sl.appendChild(el(s.t==='title'?'h1':'h2',null,s.h)); }
  if(s.b){ sl.appendChild(el('div',s.t==='title'?'lead':'body',s.b)); }
  if(s.items){ const ul=el('ul'); s.items.forEach(i=>ul.appendChild(el('li',null,i))); sl.appendChild(ul); }
  if(s.t==='pillar'){
    const wrap=el('div','pillar');
    wrap.appendChild(el('div','letter',s.letter));
    const txt=el('div','txt');
    // move existing children into txt layout
    while(sl.childNodes.length){ txt.appendChild(sl.childNodes[0]); }
    wrap.appendChild(txt);
    sl.appendChild(wrap);
  }
  if(s.cta) sl.appendChild(el('div','body','<strong>'+s.cta+'</strong>'));
  if(s.disc){
    sl.appendChild(el('div','disc',s.disc));
  }
  deck.appendChild(sl);
});
</script>
</body>
</html>
