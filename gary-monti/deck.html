<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Chaos to Clarity — A Masterclass with Gary Monti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,800;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8;
    --panel:#e7ecf1;
    --rule:#c9d3db;
    --ink:#182a4a;
    --muted:#5c6470;
    --accent:#d66421;
    --serif:'Spectral',Georgia,serif;
    --sans:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 52px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:26px;font-family:var(--sans);font-size:13px;letter-spacing:.14em;color:var(--muted)}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:800;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:38px;line-height:1.1}
  .sub{font-family:var(--serif);font-style:italic;font-size:23px;color:var(--muted);margin-top:22px;line-height:1.35}
  p.body{font-size:20px;line-height:1.5;color:var(--ink);margin-top:20px;max-width:44ch}
  ul{margin-top:26px;list-style:none;display:flex;flex-direction:column;gap:16px}
  li{font-size:21px;line-height:1.35;padding-left:30px;position:relative}
  li:before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .legs{display:flex;gap:18px;margin-top:30px;flex-wrap:wrap}
  .leg{flex:1;min-width:210px;background:var(--panel);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:26px 22px}
  .leg h3{font-family:var(--serif);font-size:23px;margin-bottom:10px}
  .leg p{font-size:16px;color:var(--muted);line-height:1.4}
  .big{font-family:var(--serif);font-size:44px;font-weight:800;line-height:1.08;max-width:20ch}
  .cite{font-size:15px;color:var(--muted);margin-top:28px;font-family:var(--sans)}
  .disc{font-size:13px;color:var(--muted);margin-top:34px;line-height:1.45;max-width:60ch;font-family:var(--sans)}
  .kicker{font-family:var(--sans);font-size:18px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Gary Monti',h:'From Chaos to Clarity',sub:'Why change really sticks, and why the step-by-step checklist was never the hard part.'},
 {t:'who',eyebrow:'Who this is for',h:'You are the one steering the change.',body:'You are a leader driving a real transition: a new system, a restructure, a merger, a new way of working. The plan is sound. The project is running. And the team keeps drifting back to the old way.'},
 {t:'point',eyebrow:'The trap',h:'You were told change is a process problem.',body:'Pick a framework, run the eight steps, manage the timeline. So you did. And the resistance showed up anyway, quiet and immovable, long after the rollout was "done".'},
 {t:'reframe',eyebrow:'The reframe',big:'Change does not fail on the plan. It fails on the people and the politics.',kicker:'Everything that follows is built on that one idea.'},
 {t:'section',eyebrow:'Part one',h:'The core problem'},
 {t:'point',h:'The plan lives in one world. The people live in another.',body:'A change plan is rational. It assumes everyone wants the same outcome and will act on it. The workplace is not rational in that way. People bring their own definitions of what "success" even means.'},
 {t:'list',eyebrow:'What actually stalls change',h:'The resistance you can feel but cannot see',items:['Private disagreement about what winning looks like','Political cost no one will say out loud','Old habits that felt safe and worked before','A team pulling in sixteen directions at once']},
 {t:'point',h:'Push harder on the process and it digs in deeper.',body:'More meetings, more dashboards, more pressure. None of it touches the real driver, so none of it moves the people. The project finishes and the change quietly does not.'},
 {t:'section',eyebrow:'Part two',h:'The Business Triad'},
 {t:'framework',eyebrow:'The framework',h:'Change sticks when all three legs move together.',legs:[{h:'The business case',p:'The why, the numbers, the plan that justifies the change in the first place.'},{h:'The project',p:'The timeline, the work, the delivery that most teams already manage well.'},{h:'The people and the politics',p:'The human and political reality that decides whether any of it survives contact.'}]},
 {t:'point',h:'Most plans only fix one leg.',body:'They pour everything into the business case and the project, and treat the people and politics as a footnote. That footnote is where the change goes to die.'},
 {t:'point',eyebrow:'The mechanism',h:'There are sixteen definitions of "success" in the room.',body:'People walk in with genuinely different ideas of what a good outcome is. Surface those definitions and the hidden conflict becomes visible, which is the first moment you can actually weave the team together instead of fighting it.'},
 {t:'point',eyebrow:'The diagnostic',h:'First, find where the instability really is.',body:'Before you prescribe anything, you measure. Score the business across the areas where turbulence actually comes from, so you are working on the real source of the chaos and not the loudest symptom.'},
 {t:'section',eyebrow:'Part three',h:'Change that finally holds'},
 {t:'list',eyebrow:'From chaos to clarity and calm',h:'The shift you are aiming for',items:['Decisions that stop looping back on themselves','Diverse views woven into one goal, not a tug of war','Change that holds after the project team leaves','Clarity and calm where there used to be noise']},
 {t:'point',eyebrow:'Why me',h:'Forty years inside other people’s chaos.',body:'I founded the Center for Managing Change in 1984 and have worked in change and project management since 1979, across banking, pharma, construction, automotive and more. The Business Triad came out of watching which changes survived and which ones did not.'},
 {t:'recap',eyebrow:'In one line',big:'Lead the people and the politics, and the plan finally gets to work.',kicker:'That is the whole method.'},
 {t:'cta',eyebrow:'Your next step',h:'Bring the Business Triad to your own change.',body:'If you are steering a transition right now and want the people-and-politics leg handled as seriously as the plan, let’s talk about working together through the Center for Managing Change.',cite:'Gary Monti, Center for Managing Change · ctrchg.com',disc:'This masterclass is educational. It shares a method and a point of view, not a promise of specific results. Outcomes depend on your own organization, people and circumstances. No income or result is guaranteed.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let h='';
  const num='<div class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</div>';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){h+='<h1>'+s.h+'</h1>'+(s.sub?'<div class="sub">'+s.sub+'</div>':'');}
  else if(s.t==='section'){h+='<h1>'+s.h+'</h1>';}
  else if(s.t==='reframe'||s.t==='recap'){h+='<div class="big">'+s.big+'</div>'+(s.kicker?'<div class="kicker">'+s.kicker+'</div>':'');}
  else if(s.t==='framework'){h+='<h2>'+s.h+'</h2><div class="legs">'+s.legs.map(l=>'<div class="leg"><h3>'+l.h+'</h3><p>'+l.p+'</p></div>').join('')+'</div>';}
  else if(s.t==='list'){h+='<h2>'+s.h+'</h2><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  else if(s.t==='cta'){h+='<h2>'+s.h+'</h2>'+(s.body?'<p class="body">'+s.body+'</p>':'')+(s.cite?'<div class="cite">'+s.cite+'</div>':'')+(s.disc?'<div class="disc">'+s.disc+'</div>':'');}
  else {h+=(s.h?'<h2>'+s.h+'</h2>':'')+(s.body?'<p class="body">'+s.body+'</p>':'');}
  d.innerHTML=num+h;deck.appendChild(d);
});
</script>
</body>
</html>
