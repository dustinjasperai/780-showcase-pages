<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Leading Alone, a masterclass with Tracy Avin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3ECDC;
    --panel:#FFFDF7;
    --rule:#DFD6C1;
    --ink:#1F3A2C;
    --muted:#5C6A5C;
    --accent:#11674A;
    --accent2:#B7CBB3;
    --head:'Newsreader',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(31,58,44,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* circle / table motif: a ring of peers in the top-right, not a podium */
  .slide::before{content:'';position:absolute;top:-58px;right:-58px;width:150px;height:150px;border-radius:50%;
    border:2px solid var(--accent2)}
  .slide::after{content:'';position:absolute;top:24px;right:24px;width:14px;height:14px;border-radius:50%;
    background:var(--accent)}
  .kick{font-family:var(--body);font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:600;font-size:62px;line-height:1.04;margin:0 0 18px;letter-spacing:-.015em}
  h2{font-family:var(--head);font-weight:600;font-size:44px;line-height:1.09;margin:0 0 20px;letter-spacing:-.01em}
  h3{font-family:var(--head);font-weight:500;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:47ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 42px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:4px;top:23px;width:16px;height:16px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:700}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:112px;line-height:1;font-weight:600;letter-spacing:-.02em}
  .strike{color:transparent;-webkit-text-stroke:2px #1F3A2C55;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:6px;background:var(--accent);transform:rotate(-2deg);border-radius:3px}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:25px;font-weight:600;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .who{font-size:19px;color:var(--muted);margin-top:auto;padding-top:22px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:64ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:40px}h2{font-size:30px}.big{font-size:66px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">TroopHR · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'Stop Leading Alone',p:'How the best HR leaders make the hard calls with a trusted circle behind them.',pres:'With <b>Tracy Avin</b>, founder of TroopHR'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why the HR seat isolates you','Named, so you can stop treating it as a personal failing.'],['The calls you should never make alone','The three decisions that quietly cost leaders the most.'],['The room to make them in','What a trusted peer circle actually does for a hard call.']]},
 {t:'audience',kick:'Who this is for',h:'You are the one everyone turns to. And you have no one to turn to.',p:'Heads of people, HR leaders and fractional CPOs, often the only HR voice in the room, carrying the highest-stakes decisions in the company with no peer inside it to think them through.',who:'<b>The trap:</b> the seat that makes you the answer for everyone leaves you with nowhere to take your own questions.'},
 {t:'reframe',kick:'The reframe',big1:'A personal flaw.',big2:'It is <span class="em">structural</span>.',p:'The isolation is not a weakness. It is built into the job. Most HR leaders are an island of one inside their own org, and no amount of grit changes the org chart. The fix is a room, not more resolve.'},
 {t:'stakes',kick:'The stakes',h:'The lonely calls are the expensive ones.',p:'A restructure, a comp decision, an exec conflict. The choices with the biggest downside are exactly the ones you cannot preview with anyone inside the building, so they get made alone and second-guessed for months.'},
 {t:'part',kick:'Part one',h:'Why the HR seat isolates you.'},
 {t:'point',kick:'The core problem',h:'You became the one with all the answers.',p:'When something hard happens to people, it comes to you. Leadership wants a plan, employees want a person, and both assume you already know. The role rewards you for having the answer and quietly leaves you with no one to ask.'},
 {t:'point',kick:'The core problem',h:'The hardest calls cannot be run past anyone internally.',p:'You cannot sanity-check a layoff with the team being cut, or a leveling decision with the person being leveled, or a conflict with the executive it involves. The stakes rise exactly as your options for counsel disappear.'},
 {t:'signs',kick:'The core problem',h:'The signs you are leading alone.',li:[['You rehearse decisions in your own head','Because there is no one in the building you can think out loud with.'],['You carry the weight home','The calls follow you past the workday and no one else is holding them.'],['You are guessing at the norm','No peer benchmark, so you cannot tell if your call is standard or an outlier.']]},
 {t:'framework',kick:'The core problem',h:'Island vs. circle.',row:[['Island of one','You decide alone, with no precedent and no second opinion. Every hard call is a fresh guess.'],['A trusted circle','You decide with peers who have sat in your exact chair. The call gets pressure-tested before it lands.']],p:'The whole shift is moving your hardest decisions out of the first column and into the second.'},
 {t:'part',kick:'Part two',h:'How the best HR leaders decide.'},
 {t:'levers',kick:'The model',h:'A trusted circle, in three layers.',li:[['The squad','A small, vetted peer cohort that pressure-tests the call before you make it.'],['Answers on demand','A forum and a practical library, so you are never starting a hard decision from a blank page.'],['Precedent','Years of how other leaders handled the same call, searchable when you need it.']]},
 {t:'point',kick:'Layer one: the squad',h:'A handful of peers who have sat in your chair.',p:'A small, vetted group of HR leaders who are not in your company and not in your reporting line, so you can say the real thing and get an honest read. This is where a hard call gets stress-tested before it becomes a decision.'},
 {t:'point',kick:'Layer two: answers on demand',h:'Never start a hard call from a blank page.',p:'A trusted network to post the question to, and a practical library to pull from, so the first draft of your thinking already has other people in it. Speed on the easy calls buys you attention for the hard ones.'},
 {t:'point',kick:'Layer three: precedent',h:'Someone has almost always made this call before.',p:'Years of leaders working through restructures, comp resets and messy exits, kept and searchable. You stop reinventing the response to a problem the field has already solved a dozen ways.'},
 {t:'part',kick:'Part three',h:'What changes when you stop deciding alone.'},
 {t:'looks',kick:'The outcome',h:'The same seat, carried differently.',li:[['You walk in with a sounding board behind you','The hard conversation is not the first time the idea has been heard.'],['You decide faster and doubt it less','A pressure-tested call is one you can actually stand behind.'],['The weight is shared','You stop being the only person in the world holding your hardest decisions.']]},
 {t:'whyme',kick:'Why Tracy',h:'A leader who built the room she needed.',li:[['Founder of TroopHR','A vetted community of 1,600+ HR leaders, from startups to the Fortune 500.'],['Built on connection, not headcount','Over 80% of members renew every year; most join by referral from a peer.'],['Ten years in the room','From quarterly dinners for heads of people in 2013 to a community launched in 2020.']]},
 {t:'cta',kick:'Your next step',h:'Ready to stop leading alone?',ctas:['<b>Apply to join TroopHR</b> and find the peer circle behind your next hard call.','<b>Bring a question</b> to your first squad and see what deciding with a room feels like.'],disc:'This masterclass is educational. It shares frameworks and approaches for HR leadership and peer support; it is not advice for your specific situation and not a guarantee of any particular result. Outcomes vary.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
