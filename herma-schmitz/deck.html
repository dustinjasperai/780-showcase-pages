<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Language of Leadership — Executive Coaching Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e8;
    --panel:#fffdf9;
    --rule:#e4dccf;
    --ink:#23301f;
    --dim:#5d6b55;
    --accent:#2E5339;
    --accent-2:#c49a6c;
    --serif:'EB Garamond',Georgia,serif;
    --sans:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
  #stage{position:relative;height:100vh;width:100%;overflow:hidden}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:7vh 9vw;background:var(--bg)}
  .slide.on{animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.05;color:var(--ink)}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,4.2vw,3rem);line-height:1.1;color:var(--ink)}
  .sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,2.4vw,1.6rem);color:var(--dim);margin-top:1.4rem;max-width:40ch}
  p.body{font-size:clamp(1.05rem,2.1vw,1.35rem);line-height:1.6;color:var(--ink);margin-top:1.4rem;max-width:46ch}
  ul{margin-top:1.6rem;max-width:48ch;list-style:none}
  li{font-size:clamp(1rem,2vw,1.28rem);line-height:1.5;padding-left:1.6rem;position:relative;margin-bottom:1rem;color:var(--ink)}
  li:before{content:'';position:absolute;left:0;top:.6em;width:.7rem;height:.7rem;background:var(--accent-2);border-radius:2px}
  .big{font-family:var(--serif);font-size:clamp(1.8rem,4.6vw,3.2rem);line-height:1.2;max-width:24ch;color:var(--ink)}
  .big .hi{color:var(--accent);font-style:italic}
  .part{font-family:var(--serif);font-size:clamp(1.1rem,2.4vw,1.5rem);color:var(--accent-2);font-style:italic;margin-bottom:.8rem}
  .rule{width:64px;height:3px;background:var(--accent);margin:0 0 2rem}
  .two{display:flex;gap:4vw;margin-top:2rem;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:2rem;max-width:22ch}
  .card h3{font-family:var(--serif);font-size:1.4rem;color:var(--accent);margin-bottom:.7rem;font-weight:600}
  .card p{font-size:1rem;line-height:1.5;color:var(--dim)}
  .meta{font-family:var(--serif);font-size:clamp(1.3rem,3vw,2rem);color:var(--ink);line-height:1.4;max-width:30ch}
  .cta-line{font-family:var(--sans);font-weight:700;font-size:clamp(1.1rem,2.4vw,1.5rem);color:var(--accent);margin-top:1.8rem}
  .disclaim{font-size:.82rem;color:var(--dim);margin-top:2.4rem;max-width:52ch;line-height:1.5}
  .num{position:absolute;bottom:3.5vh;right:9vw;font-size:.8rem;color:var(--dim);letter-spacing:.1em}
  .brand{position:absolute;top:5vh;left:9vw;font-family:var(--serif);font-size:.95rem;color:var(--dim);letter-spacing:.04em}
  .nav{position:fixed;bottom:3vh;left:9vw;display:flex;gap:.6rem;z-index:5}
  .nav button{font-family:var(--sans);font-size:.8rem;border:1px solid var(--rule);background:var(--panel);
    color:var(--ink);padding:.5rem .9rem;border-radius:3px;cursor:pointer}
  .nav button:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S=[
 {t:'title', h:`<div class="kicker">A Masterclass with Herma Schmitz</div>
   <h1>The Language of<br>Leadership</h1>
   <div class="sub">Why the words you use, in the room and in your own head, decide whether people follow you.</div>`},

 {t:'audience', h:`<div class="kicker">Who this is for</div>
   <div class="rule"></div>
   <h2>Leaders already carrying real weight</h2>
   <p class="body">You run a team, a division, a company, or a board. You are good at the work. This hour is about the one layer under the work that almost nobody coaches: the conversations that leadership actually lives inside.</p>`},

 {t:'trap', h:`<div class="kicker">The trap</div>
   <div class="rule"></div>
   <p class="big">You have the strategy right. You have the people. And still something keeps <span class="hi">stalling</span> between the plan and how it lands.</p>`},

 {t:'hook', h:`<div class="kicker">A harder reframe</div>
   <div class="rule"></div>
   <p class="big">Your team is not resisting your plan. They are responding to your <span class="hi">language</span>, out loud and unspoken.</p>`},

 {t:'part', h:`<div class="part">Part One</div><h1>Leadership Is Carried in Language</h1><div class="rule" style="margin-top:2rem"></div>`},

 {t:'twoconv', h:`<div class="kicker">The core idea</div>
   <h2>Every leader runs two conversations</h2>
   <div class="two">
     <div class="card"><h3>The public one</h3><p>What you say in the room: the way you frame a decision, a setback, a person, a possibility.</p></div>
     <div class="card"><h3>The private one</h3><p>What you say in your own head about yourself, your people, and what is really possible here.</p></div>
   </div>
   <p class="body">Leadership is grounded in both. Change either and the room changes.</p>`},

 {t:'motivate', h:`<div class="kicker">Why it matters</div>
   <div class="rule"></div>
   <p class="big">The same situation, named two different ways, will <span class="hi">motivate</span> a team or quietly <span class="hi">demotivate</span> it. Most leaders never hear their own framing.</p>`},

 {t:'part', h:`<div class="part">Part Two</div><h1>The Ontological Shift</h1><div class="rule" style="margin-top:2rem"></div>`},

 {t:'pillar1', h:`<div class="part">Pillar 1</div>
   <h2>Leadership is a way of being</h2>
   <p class="body">Grounded in ontology, the study of being, this work treats leadership not as a set of tactics but as who you are being in a moment, which shows up first in how you speak. Transformation starts when you can finally see the structure shaping your behaviour.</p>`},

 {t:'pillar2', h:`<div class="part">Pillar 2</div>
   <h2>The conversation in your head</h2>
   <p class="body">Before a word reaches the room, you have already told yourself a story about what is happening. That private narrative sets your tone, your patience, and your ceiling. We make it visible so it stops running you.</p>`},

 {t:'pillar3', h:`<div class="part">Pillar 3</div>
   <h2>The conversation in the room</h2>
   <p class="body">How you speak decides what becomes possible for the people around you. The right distinction, offered at the right moment, opens a door a whole team will walk through. The wrong one closes it before anyone notices.</p>`},

 {t:'pillar4', h:`<div class="part">Pillar 4</div>
   <h2>Language as a tool for change</h2>
   <p class="body">Once you can hear both conversations, language becomes something you use on purpose: to shift a stuck narrative, reframe a challenge your team has written off, and generate possibility where there was none an hour ago.</p>`},

 {t:'part', h:`<div class="part">Part Three</div><h1>What Begins to Change</h1><div class="rule" style="margin-top:2rem"></div>`},

 {t:'structural', h:`<div class="kicker">What surfaces first</div>
   <h2>The unspoken dynamics get named</h2>
   <p class="body">Teams, boards, and family enterprises carry patterns nobody says out loud. Naming them, with speed and without blame, is what creates alignment, even among people who walked in on opposite sides.</p>`},

 {t:'breakthrough', h:`<div class="kicker">What this feels like</div>
   <div class="rule"></div>
   <p class="big">Many leaders hear the one distinction that changes everything in the <span class="hi">first session</span>, because the shift is in perception, not effort.</p>`},

 {t:'assignments', h:`<div class="kicker">How it holds</div>
   <h2>Insight becomes performance</h2>
   <p class="body">Every session ends with work you take back into the real meetings and real relationships. That is the bridge from a good conversation to a measurable change in how you lead and how your people respond.</p>`},

 {t:'whyme', h:`<div class="kicker">Why listen to this</div>
   <h2>Four decades inside the room</h2>
   <ul>
     <li>Executive coaching and transformational leadership since 1987.</li>
     <li>Programs attended by executives and teams across 250+ companies.</li>
     <li>Alignment work with C-suites, boards, and family enterprises across many nations.</li>
     <li>A body of language-based method developed and refined over 40 years.</li>
   </ul>`},

 {t:'recap', h:`<div class="kicker">In one line</div>
   <div class="rule"></div>
   <p class="big">Lead the two conversations, the one in the room and the one in your head, and you change what your people believe is <span class="hi">possible</span>.</p>`},

 {t:'cta', h:`<div class="kicker">Where to begin</div>
   <h2>Start with a single conversation</h2>
   <p class="meta">If this is the layer you want to work on, the first step is a free 30 minute consultation with the Executive Coaching Group.</p>
   <div class="cta-line">Request a free 30 minute consultation at executivecoachgroup.com</div>
   <p class="disclaim">Educational content only. No specific result, outcome, or performance improvement is guaranteed; results vary by individual, team, and organization. Nothing here is professional, legal, or financial advice.</p>`}
];

let i=0;
const stage=document.getElementById('stage');
function render(){
  const s=S[i];
  stage.innerHTML=`<div class="slide on"><div class="brand">Executive Coaching Group</div>${s.h}<div class="num">${i+1} / ${S.length}</div></div>`;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(1);
  if(e.key==='ArrowLeft')go(-1);
});
render();
</script>
</body>
</html>
