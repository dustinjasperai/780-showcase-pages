<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Keys to the Ladies&#39; Room &middot; Adri Miller-Heckman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FAF7F1; --panel:#FFFFFF; --rule:#E6DECF;
    --acc:#01B8C2; --idx:#5B8A8C; --ink:#2B3636; --soft:#5B6B6B; --dim:#8FA3A3;
    --chalk:#FAF7F1; --grey:#C9D9D9;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Jost',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.4vw;max-width:88%}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--soft);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--soft);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Jost',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#3B4E4E 0%,#1B2424 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:86%;font-style:italic;color:var(--chalk)}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#3B4E4E 0%,#1B2424 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:82%;color:var(--chalk)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#CFF1F3;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .arc-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-arc{right:7.5%;bottom:8%;width:20vw}
  .corner-arc{right:6%;bottom:7.5%;width:9vw;opacity:.5}
  .brandline{font-size:1.32vw;color:var(--soft);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">femXadvisor</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- open-threshold motif: a simple doorway line with a small dot, nod to the book's own reframe -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arc" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="128" x2="246" y2="128" stroke="#5B8A8C" opacity="0.3"/>
    <path d="M60 128 L60 40 L200 40 L200 128" stroke="#01B8C2" opacity="0.85"/>
    <circle cx="200" cy="40" r="5" fill="none" stroke="#01B8C2" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:"title",title:"The Keys to the Ladies&#39; Room",sub:"A live masterclass on winning, and keeping, women clients.",brand:true,arc:"title"},

 {t:"normal",k:"Who this is for",title:"You already know how to sell. That is not what is costing you the client.",body:"You have the training, the process, the pitch that closes plenty of prospects. There is one client relationship that keeps slipping through it anyway."},

 {t:"dark",title:"Most advisors do not lose women clients on the numbers. They lose them on the conversation."},

 {t:"section",idx:"Part One",title:"Why the Generic Pitch Falls Short"},
 {t:"normal",k:"The trap",title:"A pitch built for everyone convinces almost no one.",body:"The standard advisor process was built around one kind of conversation. Run it on a client who wants something different from that conversation, and it reads as exactly what it is: generic."},
 {t:"normal",k:"The cost",title:"Every mismatched pitch costs a referral, not just a client.",body:"Women investors are among the fastest-growing client segments in the industry, and word of a stodgy, transactional pitch travels through exactly the relationships that would otherwise have sent referrals your way."},
 {t:"dark",title:"One of the fastest-growing client segments in the industry is still being sold to like it is 1995."},

 {t:"section",idx:"Part Two",title:"The Keys to the Ladies&#39; Room Method"},
 {t:"normal",k:"The reframe",title:"Replace the pitch with a conversation, not a script that begs.",body:"The reframe behind The Keys to the Ladies&#39; Room: an authentic, compelling, motivating process that replaces boring, transactional messaging built for a different client entirely."},
 {t:"normal",k:"The Savvy Women Seminar mindset",title:"Trade the lecture for a room that talks back.",body:"The traditional financial seminar lectures at a room. The Savvy Women Seminar approach is built to be edgy and interactive, designed to build relationships and inspire action, not to read slides at people."},
 {t:"normal",k:"Close with a softer touch",title:"A close that sounds like a conversation, not a countdown.",body:"The same reframe applied to the closing conversation itself: time-tested scripts that replace pressure with relationship, taught as a repeatable pattern, not a personality trait you either have or do not."},
 {t:"dark",title:"A relationship-first process does not lose the close. It earns it earlier."},

 {t:"section",idx:"Part Three",title:"What Changes in the Practice"},
 {t:"normal",k:"The advisor this builds",title:"More referrals, from the clients you already have.",body:"The Savvy Women Seminar approach is built specifically to strengthen existing client relationships and generate meaningfully more referrals, not just to open new conversations."},
 {t:"dark",title:"The industry does not pay advisors for pitches. It pays for relationships that refer."},
 {t:"normal",k:"Why Adri Miller-Heckman",title:"Trained the trainers, then built the model.",body:"Adri Miller-Heckman was a Smith Barney National Training Officer and Director of National Sales for Citigroup Women and Co. before founding femXadvisor in 2004 to teach this same reframe to advisors directly."},

 {t:"section",idx:"Your Next Step",title:"Take the Method Further"},
 {t:"normal",k:"GROWTH Coaching",title:"The full model, taught step by step.",body:"Monthly 1:1 coaching, bi-weekly group coaching calls, three in-person two-day retreats a year, twelve training modules, and the scripts, templates and systems behind all of it."},
 {t:"normal",k:"PREMIER Coaching and Mastermind",title:"For advisors who want direct, ongoing access.",body:"Everything in GROWTH, plus monthly mastermind calls, three live mastermind retreats a year, bi-weekly 1:1 time directly with Adri, and 24/7 access."},
 {t:"cta",title:"Ready to bring more women clients, and more referrals, into your practice?",chips:["Take the femXadvisor quiz","Book a free strategy session"],disc:"Educational content for financial advisors. No income, AUM, or referral result is guaranteed. Results vary by advisor, practice, and market."},
];

const deck=document.getElementById("deck");
function arc(kind){return `<svg class="arc-motif ${kind==="title"?"title-arc":"corner-arc"}"><use href="#arc"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="slide t-"+s.t;
  let h="";
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==="section"){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline"><b>femXadvisor</b> &middot; Adri Miller-Heckman</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join("")+`</div>`;
  }
  if(s.arc) h+=arc(s.arc);
  else if(s.t==="title") h+=arc("title");
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll(".slide")];
let cur=0;const bar=document.getElementById("bar");const count=document.getElementById("count");const hint=document.getElementById("hint");
function pad(n){return String(n).padStart(2,"0")}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle("active",i===cur));
  bar.style.width=((cur+1)/slides.length*100)+"%";
  count.textContent=pad(cur+1)+" / "+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("prev").onclick=()=>go(cur-1);
document.addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown"," ","PageDown"].includes(e.key)){e.preventDefault();go(cur+1)}
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==="Home")go(0); if(e.key==="End")go(slides.length-1);
});
go(0);
</script>
</body>
</html>
