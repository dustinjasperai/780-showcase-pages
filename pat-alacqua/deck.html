<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Windshield Business — a masterclass with Pat Alacqua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06233f;
    --panel:#0d3357;
    --rule:#374e6544;
    --accent:#3cb8b9;
    --ink:#eaf2f7;
    --dim:#9fb6c4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Lato',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(960px,94vw);aspect-ratio:16/9;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:clamp(28px,5vw,64px);position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  #stage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  h1,h2,.ey,.big{font-family:'Source Sans Pro',system-ui,sans-serif}
  .ey{text-transform:uppercase;letter-spacing:.14em;font-size:clamp(11px,1.5vw,14px);color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-size:clamp(28px,5vw,54px);line-height:1.04;font-weight:700;letter-spacing:-.01em}
  .sub{margin-top:18px;font-size:clamp(15px,2.2vw,22px);color:var(--dim);max-width:30ch}
  .big{font-size:clamp(22px,3.8vw,40px);line-height:1.18;font-weight:600;max-width:24ch}
  h2{font-size:clamp(22px,3.3vw,36px);font-weight:700;margin-bottom:10px}
  .lead{font-size:clamp(15px,2vw,20px);color:var(--dim);max-width:46ch;line-height:1.5}
  ul{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:14px}
  li{font-size:clamp(15px,2.1vw,22px);padding-left:30px;position:relative;line-height:1.35}
  li::before{content:"";position:absolute;left:0;top:.55em;width:12px;height:12px;border:2px solid var(--accent);border-radius:3px}
  li b{color:var(--ink);font-weight:700}
  .quote{font-family:'Source Sans Pro',sans-serif;font-size:clamp(22px,3.4vw,38px);line-height:1.2;font-weight:600}
  .by{margin-top:18px;color:var(--accent);font-size:clamp(13px,1.6vw,16px);letter-spacing:.04em}
  .foot{position:absolute;right:22px;bottom:16px;color:var(--dim);font-size:12px;letter-spacing:.08em}
  .disc{margin-top:22px;font-size:12px;color:var(--dim);max-width:52ch;line-height:1.5}
  .cta-line{margin-top:20px;font-size:clamp(16px,2.2vw,22px);color:var(--accent);font-weight:700}
  #nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;color:var(--dim);font-size:13px;font-family:'Lato',sans-serif}
  #nav button{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>
<div id="nav"><button id="prev">Prev</button><span id="count"></span><button id="next">Next</button></div>
<script>
const S=[
 {t:'title',ey:'A live masterclass with Pat Alacqua',h:'The Windshield Business',sub:'How to scale without the company depending on you.'},
 {t:'big',ey:'The promise',big:'In the next hour you will leave with the forward-looking system that stops every decision from routing back through you.'},
 {t:'list',ey:'Who this is for',h:'You built something that works. Now it all runs through you.',items:['You are a founder or CEO whose company outgrew the way you first ran it','Growth is good, but every real decision still lands on your desk','You are steering next quarter off last month numbers']},
 {t:'quote',ey:'The real problem',q:'You do not have a growth problem. You have a steering problem.',by:'Pat Alacqua'},
 {t:'big',ey:'The reframe',big:'A growing company run off last month numbers is a company driven by looking in the rear-view mirror.'},
 {t:'part',ey:'Part one',h:'Where growth breaks',lead:'It is almost never the strategy. It is that the business was built to need you in the room for every call.'},
 {t:'list',ey:'The three bottlenecks',h:'What actually routes back to you',items:['<b>Decisions</b> wait for your yes','<b>Information</b> lives in your head, not a system','<b>Time</b> runs out before the important work starts']},
 {t:'quote',ey:'The shift',q:'You do not need more information. You need to get clear on what you already know.',by:'The whittler principle'},
 {t:'big',ey:'The method',big:'A whittler carves off everything that is not needed until the thing he pictured is all that is left. That is what we do to a hard decision.'},
 {t:'part',ey:'Part two',h:'The 3Cs decision engine',lead:'A repeatable way to take any messy challenge to a clear, backed decision, in minutes instead of months.'},
 {t:'list',ey:'The three Cs',h:'Clarify, Chart, Co-Align',items:['<b>Clarify</b> the real issue under the noise','<b>Chart</b> the path into concrete next steps','<b>Co-Align</b> the people who have to carry it']},
 {t:'detail',ey:'C one',h:'Clarify',lead:'Strip the challenge down to the one real issue. Work backward from what you already know until what you do not know becomes a short list of questions you can go answer.'},
 {t:'detail',ey:'C two',h:'Chart',lead:'Turn the clear issue into a path. Concrete steps, owners, and the order they happen in, so the decision survives contact with a normal week.'},
 {t:'detail',ey:'C three',h:'Co-Align',lead:'Get every person who has to act understanding the same direction and backing it. A decision nobody owns is a decision that quietly dies.'},
 {t:'part',ey:'Part three',h:'Windshield Planning',lead:'Stop reporting on the road behind you. Build a monthly rhythm that looks forward through the glass.'},
 {t:'list',ey:'Three phases',h:'Calibrate, Install, Transfer',items:['<b>Calibrate</b> the 6 to 8 forces that actually move your business','<b>Install</b> decision thresholds the team can act on','<b>Transfer</b> the monthly meeting until your leaders own it']},
 {t:'detail',ey:'The instrument panel',h:'The 6 to 8 forces',lead:'Name the small set of outside and inside forces that decide your next two quarters. Track the trend, not the noise, and tie each one to a decision you would make if it moves.'},
 {t:'detail',ey:'The rhythm',h:'One hour, once a month, looking forward',lead:'A single forward-looking meeting, twelve times a year, built on your planning assumptions instead of last month actuals. The team walks out with decisions made, not a report reviewed.'},
 {t:'quote',ey:'What it adds up to',q:'When the system carries the next decision, the business stops depending on you and starts scaling past you.',by:'Entrepreneur to Enterprise'},
 {t:'detail',ey:'Why listen to me',h:'I have run this from the inside',lead:'I started a company at 24, built it into an internationally recognized brand, and sold it to a private equity firm, with systems that outlasted the sale. I work as the operator in the room, not a consultant who hands you a binder.'},
 {t:'cta',ey:'Your next step',h:'Scope the Windshield system for your company',lead:'If the forward-looking rhythm is what your business is missing, the next step is a short conversation to scope it to your team and your forces.',cta:'Start with the free 30-minute diagnostic, then book a conversation with Pat.',disc:'Educational only. No specific business result or revenue outcome is guaranteed. Results vary with your market, your team, and the work you put in.'}
];
const stage=document.getElementById('stage');const countEl=document.getElementById('count');let i=0;
function render(){
 const s=S[i];let h='';
 if(s.ey)h+=`<div class="ey">${s.ey}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1>`+(s.sub?`<div class="sub">${s.sub}</div>`:'');}
 else if(s.t==='big'){h+=`<div class="big">${s.big}</div>`;}
 else if(s.t==='quote'){h+=`<div class="quote">&ldquo;${s.q}&rdquo;</div>`+(s.by?`<div class="by">${s.by}</div>`:'');}
 else if(s.t==='part'){h+=`<h2>${s.h}</h2>`+(s.lead?`<div class="lead">${s.lead}</div>`:'');}
 else if(s.t==='detail'){h+=`<h2>${s.h}</h2>`+(s.lead?`<div class="lead">${s.lead}</div>`:'');}
 else if(s.t==='list'){if(s.h)h+=`<h2>${s.h}</h2>`;h+='<ul>'+s.items.map(x=>`<li>${x}</li>`).join('')+'</ul>';}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+(s.lead?`<div class="lead">${s.lead}</div>`:'')+(s.cta?`<div class="cta-line">${s.cta}</div>`:'')+(s.disc?`<div class="disc">${s.disc}</div>`:'');}
 h+=`<div class="foot">Pat Alacqua</div>`;
 stage.innerHTML=h;countEl.textContent=(i+1)+' / '+S.length;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
stage.addEventListener('click',()=>go(1));
render();
</script>
</body>
</html>
