<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Retention Moment, a MATRI masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f2ea;        /* warm ivory ground, from MATRI light scheme (#f6f6f6 off-white) */
    --panel:#fffdf6;     /* panel, distinct warm off-white */
    --rule:#e3dccf;      /* hairline rule */
    --ink:#161e2a;       /* MATRI measured H1 navy */
    --body:#2c3e50;      /* MATRI dominant slate */
    --accent:#d5a131;    /* MATRI gold (14 uses) */
    --accent2:#e95525;   /* MATRI warm orange, sparing emphasis */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--body);font-family:'Hanken Grotesk',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  #stage{width:min(960px,94vw);aspect-ratio:16/10;background:var(--panel);
    border:1px solid var(--rule);border-radius:14px;box-shadow:0 18px 48px rgba(22,30,42,.12);
    position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;padding:7% 8%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-family:'Hanken Grotesk';font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Fraunces';font-weight:600;color:var(--ink);font-size:clamp(28px,4.4vw,48px);line-height:1.1}
  h2{font-family:'Fraunces';font-weight:600;color:var(--ink);font-size:clamp(23px,3.3vw,36px);line-height:1.15;margin-bottom:14px}
  p{font-size:clamp(15px,1.9vw,20px);line-height:1.5;max-width:46ch}
  p.sub{margin-top:16px;color:var(--body)}
  .big{font-family:'Fraunces';font-weight:600;color:var(--accent);font-size:clamp(46px,10vw,104px);line-height:1}
  ul{margin-top:18px;list-style:none;display:flex;flex-direction:column;gap:12px}
  li{position:relative;padding-left:26px;font-size:clamp(15px,1.9vw,20px);line-height:1.4;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:22px}
  .pill{border:1px solid var(--rule);border-radius:10px;padding:16px 18px;background:var(--bg)}
  .pill b{font-family:'Fraunces';color:var(--ink);font-size:20px;display:block;margin-bottom:5px}
  .pill span{font-size:14px;line-height:1.4}
  .moments{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap}
  .moment{flex:1;min-width:150px;border-top:3px solid var(--accent);padding-top:12px}
  .moment b{font-family:'Fraunces';color:var(--ink);font-size:18px;display:block;margin-bottom:6px}
  .moment span{font-size:14px;line-height:1.4}
  .foot{position:absolute;left:8%;bottom:4.5%;font-size:12px;letter-spacing:.08em;color:#9a9284;text-transform:uppercase}
  .disc{margin-top:18px;font-size:13px;color:#8c8578;max-width:52ch;line-height:1.45}
  nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
  button{font-family:'Hanken Grotesk';border:1px solid var(--rule);background:var(--panel);color:var(--ink);
    border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
  #count{font-size:13px;color:#9a9284}
  .cta h1{color:var(--ink)} .cta .accentline{color:var(--accent2);font-family:'Fraunces';font-size:clamp(18px,2.4vw,24px);margin-top:14px}
</style>
</head>
<body>
<div id="stage"></div>
<nav><button id="prev">Prev</button><span id="count"></span><button id="next">Next</button></nav>
<script>
const S = [
  {t:'title', kick:'A live masterclass for people leaders', h:'The Retention Moment', s:'Why your most experienced parents leave around parental leave, and the system that keeps them. Presented by Sophie Maunder, founder of MATRI.'},
  {t:'audience', kick:'Who this is for', h:'HR and people leaders who are quietly losing good people', s:'If experienced talent keeps slipping away around pregnancy, leave and return, this hour is for you. Not soft wellbeing. The retention case, with the numbers behind it.'},
  {t:'trap', kick:'The trap', h:'Your parental-leave policy is probably fine', s:'Most organisations have adequate leave policy and still lose people. So leaders assume the policy is the lever. It is not. Policy is table stakes, not the reason someone stays.'},
  {t:'reframe', kick:'The reframe', h:'Parental leave is not an HR process. It is a retention moment.', s:'Handled as paperwork, it quietly erodes confidence, capability and trust. Handled as a transition, it becomes the moment you keep experienced talent and strengthen the organisation.'},
  {t:'stat', kick:'The core problem', big:'85%', s:'of mothers leave the full-time workforce within three years of their first child. Most of them never planned to.'},
  {t:'stat', kick:'The core problem', big:'1 in 5', s:'Only one in five women say they feel confident returning to their role after maternity leave. 56% of men taking paternity leave report feeling anxious about going back.'},
  {t:'stat', kick:'The cost to business', big:'£647m', s:'UK businesses are estimated to lose over £647 million each year in recruitment costs and lost productivity linked to inadequate support for working parents.'},
  {t:'point', kick:'Part one', h:'This transition is not just logistical', s:'It affects confidence, identity, ambition, relationships and performance. Often long before someone actually leaves, and long after they return. The gap is human, so the support has to be human.'},
  {t:'moments3', kick:'Where it breaks', h:'Three moments decide whether they come back', m:[['Pre-leave','Handover, disclosure and the quiet decision about whether they even intend to return.'],['During leave','Loss of connection and confidence, the slow drift from the role and the team.'],['Before return','Lowest confidence, hardest logistics, and the most avoidable attrition of all.']]},
  {t:'framework', kick:'Part two: the MATRI approach', h:'Policy-led compliance to people-led outcomes', s:'MATRI sits alongside your policies and benefits and fills the gap between policy and lived experience. It is built on four pillars, because these are what research shows actually drive whether a parent stays.'},
  {t:'pillars', kick:'The Four Pillar Approach', h:'Confidence, clarity, communication, connection', p:[['Confidence','Rebuilt at the points it drops hardest, so capable people stop counting themselves out.'],['Clarity','A clear map of the transition, so the path back is visible and planned, not improvised.'],['Communication','The real conversations: handover, manager check-ins, the flexible-working ask, the return week.'],['Connection','A professional community so no one goes through the transition feeling alone or invisible.']]},
  {t:'point', kick:'Pillar in practice: confidence', h:'Confidence is a skill, not a mood', s:'It is rebuilt with preparation and the right conversations at the right moments. When confidence holds, capable people stop quietly removing themselves from the roles they have earned.'},
  {t:'point', kick:'Pillar in practice: communication', h:'The conversations most people avoid', s:'How to disclose, how to run a clean handover, how to ask for flexibility without apology, and how a manager opens the return week. Scripts and tools, so it is consistent, not left to luck.'},
  {t:'manager', kick:'The multiplier', h:'Train the people around the parent', s:'Retention is a two-sided system: parent and manager. A great policy and an unprepared manager still loses you the person. MATRI equips managers to handle disclosure, leave planning, the return conversation and clear expectations, consistently across the organisation.'},
  {t:'journey', kick:'Part three: the shift', h:'An eighteen-month journey, not a single touchpoint', s:'Live group coaching mapped to pre-leave, during leave and before return. On-demand content for the practical questions. Expert sessions and a professional community throughout. Fathers included, because parental transitions do not affect one person alone.'},
  {t:'point', kick:'What changes', h:'From a leak you cannot see to a moment you can win', s:'Experienced people return and stay. Confidence and engagement come back faster. Managers handle the transition well instead of hoping. The business keeps the talent it already paid to develop.'},
  {t:'whyme', kick:'Why MATRI', h:'Led by someone who lived it at board level', s:'Sophie Maunder is a parental-transition coach with a senior leadership background in high-pressure environments. She navigated pregnancy, leave and return while operating at board level, then retrained as an executive coach and built MATRI to close the gap she saw repeatedly: talented parents leaving not for lack of ambition, but for lack of structured support.'},
  {t:'proof', kick:'Recognition', h:'Built with organisations, recognised by the industry', s:'MATRI has been recognised at the Personnel Today Awards 2026 and the This Can Happen Awards Global 2026, and works in partnership with organisations across sectors to protect retention through the parental-leave transition.'},
  {t:'point', kick:'The opportunity', h:'This is a moment you can actually control', s:'You cannot stop people becoming parents. You can decide whether that moment costs you your best people or keeps them. That decision is made in the support you put around the transition.'},
  {t:'cta', kick:'Your next step', h:'Bring MATRI to your organisation', accent:'Start a conversation about supporting your working parents.', s:'Book a conversation with Sophie to map the Four Pillar Approach onto your organisation and your people.', disc:'This masterclass is educational. No specific retention or business outcome is guaranteed. Results vary by organisation, workforce and context.'}
];

const stage=document.getElementById('stage');
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(sl){
  let inner='';
  const kick = sl.kick? `<div class="kick">${esc(sl.kick)}</div>`:'';
  if(sl.t==='stat'){
    inner = kick + `<div class="big">${esc(sl.big)}</div><p class="sub">${esc(sl.s)}</p>`;
  } else if(sl.t==='pillars'){
    inner = kick + `<h2>${esc(sl.h)}</h2><div class="pillars">`+
      sl.p.map(x=>`<div class="pill"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')+`</div>`;
  } else if(sl.t==='moments3' || sl.t==='journey' && sl.m){
    inner = kick + `<h2>${esc(sl.h)}</h2><div class="moments">`+
      (sl.m||[]).map(x=>`<div class="moment"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')+`</div>`;
  } else if(sl.t==='cta'){
    inner = kick + `<h1>${esc(sl.h)}</h1><div class="accentline">${esc(sl.accent)}</div>`+
      `<p class="sub">${esc(sl.s)}</p><div class="disc">${esc(sl.disc)}</div>`;
  } else if(sl.t==='title'){
    inner = kick + `<h1>${esc(sl.h)}</h1><p class="sub">${esc(sl.s)}</p>`;
  } else {
    inner = kick + `<h2>${esc(sl.h)}</h2><p>${esc(sl.s)}</p>`;
  }
  inner += `<div class="foot">MATRI · In support of the working parent</div>`;
  return `<div class="slide on ${sl.t==='cta'?'cta':''}">${inner}</div>`;
}
let i=0;
function show(){stage.innerHTML=render(S[i]);document.getElementById('count').textContent=(i+1)+' / '+S.length;}
document.getElementById('next').onclick=()=>{i=Math.min(S.length-1,i+1);show();};
document.getElementById('prev').onclick=()=>{i=Math.max(0,i-1);show();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();});
show();
</script>
</body>
</html>
