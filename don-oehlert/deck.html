<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Message Map — a masterclass for senior executives 45+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb; --panel:#eceef5; --rule:#d8dbe8; --ink:#1a1a22; --muted:#55596b;
    --accent:#2e3561;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Albert Sans",system-ui,sans-serif}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;border-bottom:1px solid var(--rule);position:relative}
  .k{font-family:"Albert Sans",sans-serif;font-weight:600;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin:0 0 20px}
  h1{font-family:"Newsreader",Georgia,serif;font-weight:700;font-size:clamp(34px,6vw,68px);
    line-height:1.04;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,44px);
    line-height:1.1;margin:0 0 16px;letter-spacing:-.01em}
  p{font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:var(--muted);max-width:42ch;margin:0 0 14px}
  .big{color:var(--ink);font-size:clamp(20px,2vw,26px);max-width:46ch}
  ul{list-style:none;padding:0;margin:18px 0 0;max-width:48ch}
  li{font-size:clamp(16px,1.5vw,20px);line-height:1.5;padding:14px 0;border-top:1px solid var(--rule);
    color:var(--ink);display:flex;gap:14px}
  li .n{font-family:"Albert Sans",sans-serif;font-weight:600;color:var(--accent);font-size:14px;padding-top:3px;min-width:26px}
  .num{font-family:"Albert Sans",sans-serif;position:absolute;top:5vh;right:9vw;color:var(--rule);font-size:13px;letter-spacing:.2em}
  .title-wrap{max-width:60ch}
  .lede{font-size:clamp(18px,1.7vw,22px);color:var(--ink);max-width:44ch}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
  .disc{font-size:13px;color:var(--muted);margin-top:28px;max-width:60ch;line-height:1.5}
  .foot{font-family:"Albert Sans",sans-serif;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);position:absolute;bottom:5vh;left:9vw}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass · for senior executives 45+',
    h:'The Message Map',
    sub:'How accomplished leaders turn a career of quiet wins into a story that lands the next role.',
    foot:'eCareerCoaching · Don Oehlert' },

  {t:'who', k:'Who this is for',
    h:'You have done remarkable work.',
    lede:'Director and above. Twenty years of results. And a search that has gone quiet in a way it never did before.',
    sub:'This hour is for the senior leader who is qualified, respected, and somehow still being overlooked.' },

  {t:'trap', k:'The trap',
    h:'So you do more of what used to work.',
    sub:'More applications. A longer resume. A wider net. The search becomes a numbers game, and the numbers keep saying no.',
    big:'The harder you push on volume, the more you sound like everyone else.' },

  {t:'reframe', k:'The reframe',
    h:'The market does not reward the most qualified. It rewards the clearest.',
    sub:'A long search is almost never a value problem. It is a message problem.',
    big:'If your value is not obvious in seconds, it is lost in the noise.' },

  {t:'part', k:'Part one', h:'Signal, not volume.',
    sub:'The senior executive market responds to signal. Clarity beats completeness. Your job is not to sound more impressive. It is to become easier to understand, easier to refer, and easier to hire.' },

  {t:'list', k:'Part one', h:'Where accomplished searches break',
    list:[
      ['01','Volume over strategy, so every application reads as noise'],
      ['02','Value described in duties instead of outcomes'],
      ['03','A career story so long it starts to sound defensive'],
      ['04','Every capability listed at once, so nothing lands'],
      ['05','Networking asks too soft to act on']
    ] },

  {t:'part', k:'Part two', h:'The Message Map',
    sub:'One page that makes your value legible in seconds. It is the spine of everything else: your resume, your LinkedIn, your referral asks, your interviews.' },

  {t:'list', k:'Part two · the components', h:'What goes on the map',
    list:[
      ['1','Target role, stated plainly'],
      ['2','Target business situation you fit'],
      ['3','Core value: what you help organizations do'],
      ['4','Top three proof points, quantified'],
      ['5','Leadership pattern: how you create results'],
      ['6','Current positioning: why you, why now']
    ] },

  {t:'proof', k:'Part two · proof over responsibility',
    h:'Lead with the number, not the title.',
    strike:'Led cross-functional operational improvement initiatives',
    lede:'Cut cycle time from 21 days to 9.',
    sub:'A hiring committee remembers results. Responsibilities blur together. Proof does not.' },

  {t:'list', k:'Part two · the three clarifications', h:'What you must convey immediately',
    list:[
      ['1','The expensive business problem you solve'],
      ['2','The measurable outcomes you create'],
      ['3','Why you, and why right now']
    ] },

  {t:'diag', k:'Part two · the conversion diagnostic',
    h:'Find the exact place your search is breaking.',
    list:[
      ['→','No interviews points to weak positioning on LinkedIn'],
      ['→','Finalist without an offer points to unclear differentiation'],
      ['→','Referrals that stall point to a value line too vague to repeat']
    ],
    sub:'Fix the layer that is actually broken, not the whole search at once.' },

  {t:'part', k:'Part three', h:'The seven-day rebuild',
    sub:'Sixty to ninety minutes a day: choose your lane, fix the top third, build your proof points, craft your referral asks, run targeted outreach, have real conversations, and read the market signal.' },

  {t:'big', k:'Part three',
    h:'From supplicant to viable candidate.',
    big:'Tell your career story in two minutes. Brand your entire skill set in ten words. Say it the same clear way everywhere.' },

  {t:'big', k:'Part two · the test',
    h:'The ten-word test.',
    big:'If a busy peer cannot repeat what you do in ten words, your network cannot refer you. Clarity is what travels.' },

  {t:'list', k:'Part three · referral language', h:'Give your network something to act on',
    list:[
      ['Soft','Keep me in mind if anything comes up'],
      ['Clear','I help ops teams cut cost and cycle time; who do you know scaling that now']
    ],
    sub:'A specific ask is a gift. It tells the person exactly who to think of and what to say.' },

  {t:'list', k:'Part three · what changes', h:'What clarity actually buys you',
    list:[
      ['01','Recruiters finish reading the top third'],
      ['02','Referrals arrive already pointed at the right role'],
      ['03','Interviews turn on your proof, not your tenure'],
      ['04','The quiet stretches stop feeling like a verdict']
    ] },

  {t:'reframe', k:'Part three · the mindset',
    h:'The quiet is not a verdict on your worth.',
    sub:'It is feedback on your message. And a message is something you can fix this week.',
    big:'Age is not the liability. An unclear story is.' },

  {t:'who', k:'Why this, from me',
    h:'Twenty-two years. 850+ executives.',
    lede:'I have spent two decades helping managers and above get seen for what they are actually worth.',
    sub:'The leaders who land fastest are rarely the most decorated. They are the clearest about the value they carry into the room.' },

  {t:'cta', k:'Your next step',
    h:'Build your Message Map with me.',
    sub:'If this is the hour your search turns from quiet to clear, book a short fit call and we will map your positioning together.',
    cta:'Book your fit call with Don',
    disc:'Educational only. No specific job placement, income, or result is guaranteed; outcomes vary with your experience, market, and effort. eCareerCoaching · Don Oehlert.',
    foot:'eCareerCoaching · Don Oehlert' }
];

function esc(x){return x==null?'':x;}
const app = document.getElementById('app');
S.forEach((s,i)=>{
  const sec = document.createElement('section');
  sec.className='slide';
  let html = '';
  html += `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  if(s.k) html += `<p class="k">${esc(s.k)}</p>`;
  if(s.t==='title'){ html += `<div class="title-wrap"><h1>${esc(s.h)}</h1><p class="lede">${esc(s.sub)}</p></div>`; }
  else { if(s.h) html += `<h2>${esc(s.h)}</h2>`; }
  if(s.lede) html += `<p class="lede">${esc(s.lede)}</p>`;
  if(s.strike) html += `<p class="big"><span class="strike">${esc(s.strike)}</span></p>`;
  if(s.list){ html += '<ul>'; s.list.forEach(it=> html += `<li><span class="n">${esc(it[0])}</span><span>${esc(it[1])}</span></li>`); html += '</ul>'; }
  if(s.big) html += `<p class="big">${esc(s.big)}</p>`;
  if(s.sub && s.t!=='title') html += `<p>${esc(s.sub)}</p>`;
  if(s.disc) html += `<p class="disc">${esc(s.disc)}</p>`;
  if(s.foot) html += `<div class="foot">${esc(s.foot)}</div>`;
  sec.innerHTML = html;
  app.appendChild(sec);
});
</script>
</body>
</html>
