<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How High Performers Actually Learn and Change | Patrick J. Healy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#f5f3ee;        /* warm light linen, from brand light ground + stone #c5c1b9 */
    --panel:#e9e6dd;     /* step down from stone */
    --ink:#1b1d24;       /* near-black brand ink lab(5.23 -1.16 -6.21) */
    --ink-soft:#44464f;
    --ink-muted:#73747c;
    --rule:#d8d4ca;      /* muted stone divider */
    --accent:#2f49c2;    /* deepened brand blue lab(49.24 12.46 -72.77) ~ #2b4fd6 */
    --accent-soft:#eceaf6;
  }
  html,body{height:100%;}
  body{
    font-family:'Figtree',-apple-system,system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  h1,h2,h3,.kicker{font-family:'Outfit',sans-serif;}
  #stage{width:100%; max-width:1000px; aspect-ratio:16/9; position:relative; padding:0 20px;}
  .slide{
    position:absolute; inset:0; margin:0 20px;
    display:none; flex-direction:column; justify-content:center;
    padding:64px 72px;
    background:transparent;
  }
  .slide.on{display:flex;}
  .kicker{font-size:13px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-bottom:22px;}
  .slide h1{font-size:52px; font-weight:700; line-height:1.08; letter-spacing:-0.02em; margin-bottom:22px;}
  .slide h2{font-size:38px; font-weight:600; line-height:1.14; letter-spacing:-0.015em; margin-bottom:20px;}
  .slide .sub{font-size:22px; color:var(--ink-soft); line-height:1.5; max-width:40ch;}
  .slide p{font-size:21px; color:var(--ink-soft); line-height:1.55; max-width:46ch; margin-bottom:14px;}
  .slide .lead{font-size:26px; color:var(--ink); line-height:1.4; max-width:42ch;}
  .quote{font-size:30px; font-weight:500; line-height:1.3; color:var(--ink); max-width:40ch; border-left:4px solid var(--accent); padding-left:26px;}
  ul{list-style:none; margin-top:10px;}
  li{font-size:21px; color:var(--ink-soft); line-height:1.5; margin-bottom:14px; padding-left:28px; position:relative; max-width:48ch;}
  li::before{content:""; position:absolute; left:0; top:13px; width:9px; height:9px; background:var(--accent); border-radius:50%;}
  .section-num{font-size:15px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:14px;}
  .section h1{font-size:60px;}
  .cred{display:grid; grid-template-columns:repeat(2,1fr); gap:14px 34px; margin-top:12px; max-width:52ch;}
  .cred div{font-size:19px; color:var(--ink-soft); line-height:1.4; padding-left:24px; position:relative;}
  .cred div::before{content:""; position:absolute; left:0; top:10px; width:7px; height:7px; background:var(--accent); border-radius:50%;}
  .title-wrap .brand{margin-top:30px; font-size:18px; color:var(--ink-muted); font-weight:500;}
  .title-wrap .brand strong{color:var(--ink);}
  .disc{margin-top:26px; font-size:14px; color:var(--ink-muted); line-height:1.5; max-width:54ch;}
  .cta-line{display:inline-block; margin-top:18px; font-family:'Outfit',sans-serif; font-size:22px; font-weight:600; color:#fff; background:var(--accent); padding:14px 28px; border-radius:8px;}
  .stage-footer{position:fixed; bottom:20px; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:0 34px; font-family:'Figtree',sans-serif; font-size:13px; color:var(--ink-muted);}
  .dots{display:flex; gap:7px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--rule);}
  .dot.on{background:var(--accent);}
  .nav{cursor:pointer; user-select:none; color:var(--ink-muted); font-size:13px;}
  .nav:hover{color:var(--accent);}
  @media (max-width:720px){
    .slide{padding:34px 30px;}
    .slide h1{font-size:32px;} .section h1{font-size:38px;}
    .slide h2{font-size:26px;} .slide .sub{font-size:18px;} .slide p,li{font-size:17px;}
    .quote{font-size:22px;} .lead{font-size:20px;} .cred{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div class="stage-footer">
  <span class="nav" onclick="go(-1)">&larr; prev</span>
  <span class="dots" id="dots"></span>
  <span class="nav" onclick="go(1)">next &rarr;</span>
</div>
<script>
const S = [
  {t:'title', h:'How High Performers Actually Learn and Change',
    sub:'A whole-person, evidence-based method for professionals who want to think more clearly and perform with intention.',
    brand:'A masterclass with <strong>Patrick J. Healy</strong>, PJH Learning + Performance' },

  {t:'content', kicker:'Who this is for',
    h:'You are capable, driven, and already working hard.',
    body:['You are a professional or leader who wants to grow, make a change, or perform at a higher level.',
          'You do not need more motivation. You need an approach that actually holds.'] },

  {t:'content', kicker:'The trap',
    h:'You have tried the systems.',
    body:['The productivity apps, the habit trackers, the push-harder advice.',
          'It works for a week, then quietly fades, and you are back where you started, wondering what is wrong with your discipline.'] },

  {t:'quote', kicker:'The real problem',
    quote:'The problem is not your discipline. It is that you are trying to change in a way your brain and body were never built to sustain.' },

  {t:'section', num:'Part One', h:'Why change does not stick' },

  {t:'content', kicker:'Insight is not change',
    h:'Knowing better is not the same as doing better.',
    body:['We forget most of what we learn within days unless we use it on purpose.',
          'Advice you nod along to on a podcast disappears by Monday. Lasting change needs the right conditions, not just the right idea.'] },

  {t:'content', kicker:'Willpower runs out',
    h:'Willpower is a battery, not a strategy.',
    body:['Follow-through is powered by sleep, energy, and stress load long before it is powered by grit.',
          'When the body is depleted, the best plan in the world collapses by 3pm.'] },

  {t:'section', num:'Part Two', h:'The Whole-Person Performance Method' },

  {t:'content', kicker:'Pillar 1',
    h:'Learn the way your brain actually works.',
    body:['Retrieval, spaced reflection, and deliberate practice are how adults really encode change.',
          'We build your growth around how learning works, so it compounds instead of evaporating.'] },

  {t:'content', kicker:'Pillar 2',
    h:'Power the system.',
    quote:'Stress, sleep, energy, and physical health are inseparable from performance.',
    body:['We treat your body as a performance input, not a side topic, because it is what carries every plan through the week.'] },

  {t:'content', kicker:'Pillar 3',
    h:'Ask the real question.',
    body:['Reflective inquiry cuts through the noise to the thing that is actually in the way.',
          'If you knew the answer, what would it be? What if there were no limits? What is the real issue here?'] },

  {t:'content', kicker:'Pillar 4',
    h:'Build the accountability loop.',
    body:['Practical strategy plus a weekly accountability structure is what turns intention into done.',
          'Clear next steps, honest check-ins, and small adjustments week over week.'] },

  {t:'section', num:'Part Three', h:'The method in your week' },

  {t:'content', kicker:'A week in the method',
    h:'Small, deliberate, repeatable.',
    body:['One clear focus for the week, grounded in a real question.',
          'Practice built the way the brain learns, protected energy to carry it, and a check-in that keeps you honest.'] },

  {t:'content', kicker:'What changes',
    h:'From stuck to moving.',
    body:['Clearer thinking, steadier energy, and follow-through that does not depend on a burst of motivation.',
          'You stop restarting and start building on last week.'] },

  {t:'cred', kicker:'Why this method',
    h:'A learning scientist, not a slogan.',
    items:['Dartmouth College, B.A. Economics and Government',
           'M.Ed, Harvard Graduate School of Education, learning neuroscience',
           'Designed learning at the IMF, Harvard Business School Online, and Wayfair',
           'ICF Associate Certified Coach (ACC)',
           'ATD Certified Professional in Talent Development (CPTD)',
           'ACE Personal Trainer and NASM Nutrition Coach'] },

  {t:'content', kicker:'The method, in one line',
    h:'Learn right, power the system, ask the real question, and close the loop.',
    body:['Four pillars, built on how people actually learn and perform.',
          'That is the difference between another system you abandon and a change that holds.'] },

  {t:'cta', kicker:'Your next step',
    h:'Ready to apply this to your own performance?',
    body:['If this is the way you want to work, the next step is a conversation.'],
    cta:'Book a free intro call',
    disc:'This masterclass is educational. Individual results vary, and nothing here is a guarantee of any specific outcome.' }
];

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
let i = 0;

function render(){
  stage.innerHTML = '';
  const s = S[i];
  const d = document.createElement('div');
  d.className = 'slide on' + (s.t==='section'?' section':'') + (s.t==='title'?' title-wrap':'');
  let html = '';
  if (s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if (s.num) html += '<div class="section-num">'+s.num+'</div>';
  if (s.h) html += (s.t==='section'||s.t==='title') ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>';
  if (s.sub) html += '<div class="sub">'+s.sub+'</div>';
  if (s.quote) html += '<div class="quote">'+s.quote+'</div>';
  if (s.body) html += s.body.map(p=>'<p>'+p+'</p>').join('');
  if (s.items) html += '<div class="cred">'+s.items.map(x=>'<div>'+x+'</div>').join('')+'</div>';
  if (s.cta) html += '<div><span class="cta-line">'+s.cta+'</span></div>';
  if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  if (s.brand) html += '<div class="brand">'+s.brand+'</div>';
  d.innerHTML = html;
  stage.appendChild(d);
  dotsEl.innerHTML = S.map((_,n)=>'<span class="dot'+(n===i?' on':'')+'"></span>').join('');
}
function go(n){ i = Math.max(0, Math.min(S.length-1, i+n)); render(); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
render();
</script>
</body>
</html>
