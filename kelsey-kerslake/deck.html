<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Life-First Business · Kelsey Kerslake, The Aligned Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f0ec; --panel:#efe3dc; --rule:#e6d7d3;
    --acc:#e08dd0; --ink:#2a2230; --body:#4d4350; --dim:#948896; --cream:#f7efe9;
  }
  html,body{height:100%}
  body{background:#ece0d9;font-family:'Jost',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ece0d9}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Jost',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.1;letter-spacing:.004em}
  .t-title h1{font-size:5.6vw;max-width:94%}
  .t-normal h1{font-size:3.7vw;max-width:90%}
  .t-normal .body{font-family:'Jost',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.66;font-weight:400}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.3vw;color:var(--acc);margin-top:3.2vh;max-width:82%;line-height:1.36;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Jost',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:5.2vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#332839 0%,#221b28 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.1vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#332839 0%,#221b28 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.1vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Jost',sans-serif;color:#e9ddea;font-size:1.4vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .al-motif{position:absolute;pointer-events:none}
  .title-al{right:8%;bottom:9%;width:13vw;opacity:.95}
  .corner-al{right:7%;bottom:8%;width:7vw;opacity:.6}
  .brandline{font-family:'Jost',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.06em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(42,34,48,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9.2vw}.t-normal h1{font-size:6.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.4vw}.t-section h1{font-size:7.8vw}.t-dark h1{font-size:6.6vw}
    .t-cta h1{font-size:7.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">The Aligned Business</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- aligned motif: two offset strokes settling into one true vertical line, drawn in brand pink -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="al" viewBox="0 0 120 120">
  <g fill="none" stroke="#e08dd0" stroke-width="2" stroke-linecap="round">
    <path d="M42 16 C34 42, 34 78, 42 104" opacity="0.55"/>
    <path d="M78 16 C86 42, 86 78, 78 104" opacity="0.55"/>
    <line x1="60" y1="10" x2="60" y2="110" opacity="0.95"/>
    <circle cx="60" cy="60" r="5.5" fill="#e08dd0" stroke="none" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Life-First Business',sub:'How to build a sustainable six-figure business that is designed around your life, not the other way around.',brand:true,al:'title'},
 {t:'normal',k:'Who this is for',title:'You built the business. Somewhere along the way it started running you.',body:'You are an expert with a real audience and real revenue. But the calendar fills with launches, the to-do list never empties, and the growth advice everywhere is the same word: more. You did not start this to hand your life over to it, yet that is quietly what happened.'},
 {t:'dark',title:'A bigger business you do not enjoy running is not the goal you signed up for.'},

 {t:'section',idx:'Part One',title:'Why More Rarely Feels Like Enough'},
 {t:'normal',k:'The scale-at-all-costs trap',title:'The whole industry is selling the same thing: bigger.',body:'Bigger launches, bigger numbers, seven figures by next year. It is loud, it is everywhere, and it quietly assumes the answer to every problem is more volume. So you add another offer, another launch, another late night, and the business grows while the life it was supposed to fund gets thinner.'},
 {t:'normal',k:'Revenue is not the same as alignment',title:'You can hit the number and still feel further from the point.',body:'A six-figure year built on work that drains you is not a win you get to keep. When the model is bolted onto someone else strategy instead of your own life and values, every good month costs a little more of you. The growth is real. So is the resentment underneath it.'},
 {t:'dark',title:'Success that costs you the life you wanted is just a nicer looking version of stuck.'},

 {t:'section',idx:'Part Two',title:'The Aligned Business Method'},
 {t:'normal',k:'Pillar one, Life-First Design',title:'Start from the life you want, then build the business to fit it.',body:'Most people design the business first and try to squeeze a life into whatever is left. Life-First Design flips the order. You name the life, the schedule, and the income that would actually feel sustainable, then reverse engineer a six-figure model to fit inside it. The business becomes the vehicle, not the destination.'},
 {t:'normal',k:'Pillar two, The Art of Becoming',title:'You grow the business by becoming the person your next level requires.',body:'Every new level of the business asks for a new version of you: how you make decisions, hold boundaries, and lead. The Art of Becoming is the inner work that comes before the tactics, an identity shift and future-self leadership. You stop waiting to feel ready and start operating as the owner the next chapter needs.'},
 {t:'normal',k:'Pillar three, Aligned Marketing',title:'Attract clients from your values and your voice, not from hustle.',body:'Marketing built on love and genuine connection outlasts marketing built on pressure. Aligned Marketing means offers and messaging that come from what you actually believe, run on self-accountability instead of adrenaline. It is quieter, it is more you, and it brings in the right people without asking you to burn out to be seen.'},
 {t:'dark',title:'Alignment is not doing less. It is doing what is yours, on purpose, and letting the rest go.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Business Is Aligned'},
 {t:'normal',k:'The owner this builds',title:'A six-figure business that supports your life instead of consuming it.',body:'When the model is designed around your life, the good months stop costing you the evenings and the weekends. You lead from your future self instead of reacting from the tired one. The work feels like yours again, the income is sustainable rather than white-knuckled, and growth stops being something you brace for.'},
 {t:'dark',title:'The goal was never a bigger business. It was a business that gives your life back.'},
 {t:'normal',k:'Why Kelsey Kerslake',title:'Thirteen years, a multi-six-figure agency, and the method behind The Aligned Business.',body:'Kelsey built and grew a multi-six-figure branding agency, earned a master degree in brand strategy, and became a certified life and business coach before creating The Aligned Business and its podcast. The Aligned Business Method and The Art of Becoming are the systems she used to trade the grind for a business that actually fits her life, now taught to owners doing the same.'},

 {t:'section',idx:'Your Next Step',title:'Build the Business Around Your Life'},
 {t:'normal',k:'Keep going with Kelsey',title:'From your first life-first shifts to a business that runs in alignment.',body:'Start with the free Life-First training for the three shifts that make a six-figure business sustainable. When you are ready to do the deeper identity and business work together, The Art of Becoming is the six-month immersive, and The Aligned Business Academy is where the foundations live.'},
 {t:'cta',title:'Ready to build a six-figure business that fits your life?',body:'Take the next step with The Aligned Business.',chips:['Watch the free Life-First training','Explore The Art of Becoming'],disc:'Educational content for business owners. No income or revenue result is guaranteed. Outcomes vary by owner, offer, and market.'},
];

const deck=document.getElementById('deck');
function al(kind){return `<svg class="al-motif ${kind==='title'?'title-al':'corner-al'}"><use href="#al"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Aligned <b>Business</b> · Kelsey Kerslake</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.al) h+=al(s.al);
  else if(s.t==='title') h+=al('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
