<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profitable Alterations Studio · Nadine Bozeman, Secrets of a Bridal Seamstress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fefaf1; --panel:#f3ead9; --rule:#e6dcc7;
    --acc:#d6746d; --ink:#35604f; --body:#4a5b52; --dim:#9a8f80; --cream:#fefaf1;
    --deep:#35604f;
  }
  html,body{height:100%}
  body{background:#efe6d6;font-family:'Quicksand',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe6d6}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Quicksand',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.13;letter-spacing:.004em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Quicksand',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.66;font-weight:500}
  .sub{font-family:'DM Serif Display',serif;font-style:italic;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:82%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Quicksand',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(135% 135% at 50% 8%,#3d6d5a 0%,#2c4f41 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(135% 135% at 50% 100%,#3d6d5a 0%,#2c4f41 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Quicksand',sans-serif;color:#e9e0cf;font-size:1.4vw;margin-top:3vh;max-width:70%;line-height:1.62;font-weight:500}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #f0b7af;color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .st-motif{position:absolute;pointer-events:none}
  .title-st{right:7.2%;bottom:8%;width:17vw;opacity:.92}
  .corner-st{right:6.5%;bottom:7.5%;width:8.5vw;opacity:.5}
  .brandline{font-family:'Quicksand',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(53,96,79,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Secrets of a Bridal Seamstress</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- atelier motif: a needle drawing a running-stitch seam, in dusty rose -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="st" viewBox="0 0 140 120">
  <g fill="none" stroke="#d6746d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 84 C 34 60, 60 60, 86 84" opacity="0.85" stroke-dasharray="9 8"/>
    <path d="M86 84 L120 40" opacity="0.9"/>
    <circle cx="122" cy="36" r="3.4" fill="#d6746d" stroke="none" opacity="0.9"/>
    <path d="M120 40 l6 -14" opacity="0.7"/>
    <circle cx="8" cy="84" r="2.6" opacity="0.8"/>
    <circle cx="47" cy="70" r="2.2" opacity="0.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Profitable Alterations Studio',sub:'How to turn a gift for sewing into a booked-out bridal studio that pays you well, without living at the machine.',brand:true,st:'title'},
 {t:'normal',k:'Who this is for',title:'You can do the work. The business is the part no one taught you.',body:'You are a bridal seamstress and the sewing is genuinely good. Brides find you, the dresses turn out beautifully, and the referrals come. But the pricing is a guess, the calendar runs you instead of the other way around, and the slow season always feels one quiet week away from a problem.'},
 {t:'dark',title:'Being brilliant at the sewing and being paid like it are two different skills.'},

 {t:'section',idx:'Part One',title:'Why Talented Seamstresses Stay Underpaid'},
 {t:'normal',k:'The craft was the easy part',title:'Sewing school taught you the dress. Nobody taught you the studio.',body:'You spent years mastering the needle and none learning to price, package, and protect your time. So the most skilled person in the room quietly becomes the cheapest, because skill and confidence are not the same thing, and the business side was never part of the training.'},
 {t:'normal',k:'The per-alteration trap',title:'When you charge by the alteration, you get haggled by the alteration.',body:'Quoting a hem here and a bustle there teaches every bride that your number is a menu to negotiate. The work grows, the timeline slips, and the total never reflects the hours or the expertise. You end up busy, tired, and still wondering where the money went.'},
 {t:'dark',title:'You did not pour years into your craft to become the cheapest pins in town.'},

 {t:'section',idx:'Part Two',title:'The 6-Figure Method'},
 {t:'normal',k:'Fitting packages change everything',title:'Price the whole fitting, not the seam.',body:'A fitting package sells the bride the entire journey from first pin to final press, at one confident price she says yes to up front. It raises the average ticket, ends the line-by-line haggling, and tells her exactly what to expect. This one shift is the difference between a hobby that pays a little and a studio that pays well.'},
 {t:'normal',k:'The deposit and the calendar',title:'A studio runs on a system, not on adrenaline.',body:'The package is booked with a deposit, so the calendar fills with committed brides instead of maybes, and you stop chasing payment after the dress is done. A booked, deposited calendar is what lets you plan a season, hire help, and take a weekend, without the panic that drives discount pricing.'},
 {t:'normal',k:'Seasonal savings',title:'Build a studio that pays you through the slow months too.',body:'Bridal is seasonal, and fear of the quiet stretch is exactly what makes seamstresses undercharge when they are busy. When you price for the whole year and save through the peak on purpose, the off-season stops being a threat, and you get to hold your rate from confidence instead of cutting it from worry.'},
 {t:'normal',k:'Boundaries that hold',title:'Confidence is the real profit lever.',body:'Knowledge leads to confidence, and confidence leads to actually delighting in the work. Clear boundaries and calm scripts let you handle the hardest bride without dropping your price or your standards. When you believe in what you are selling, the number stops being a thing you apologize for.'},
 {t:'dark',title:'Profit is not a bigger workload. It is a better system around the same two hands.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Studio Runs on a System'},
 {t:'normal',k:'The studio this builds',title:'Fewer rush jobs, better brides, and a rate you stop flinching at.',body:'When you sell packages and hold the number, you attract the brides who want you specifically, not the cheapest hem in town. The calendar fills at a price that actually funds the business, the slow season is planned for instead of feared, and the work finally feels like the profession it is.'},
 {t:'dark',title:'The goal was never more dresses. It was work that pays what your skill is worth.'},
 {t:'normal',k:'Why Nadine',title:'A DIY, overwhelmed side-hustle turned into a modern, professional studio.',body:'Nadine built Sweet Francis Sewing Co from an insecure side hustle into a professional bridal alterations studio that attracts dream clients, then created Secrets of a Bridal Seamstress to teach the business she had to learn the hard way. This method is the exact path she now shares with seamstresses everywhere.'},

 {t:'section',idx:'Your Next Step',title:'Build the Studio You Actually Wanted'},
 {t:'normal',k:'Keep going together',title:'You have the talent. This is the business to put around it.',body:'Inside Secrets of a Bridal Seamstress, the method becomes a plan: your fitting packages, your pricing, your calendar, and a room full of seamstresses building the same thing. The path that works best for you, because your business is as unique as you are.'},
 {t:'cta',title:'Ready to build a studio that pays you what your work is worth?',body:'Come build it with Secrets of a Bridal Seamstress.',chips:['Listen to the podcast','Join the membership'],disc:'Educational content for working and aspiring bridal seamstresses. No income or business result is guaranteed. Results vary by seamstress, market, and season.'},
];

const deck=document.getElementById('deck');
function st(kind){return `<svg class="st-motif ${kind==='title'?'title-st':'corner-st'}"><use href="#st"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Secrets of a Bridal <b>Seamstress</b> · Nadine Bozeman</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.st) h+=st(s.st);
  else if(s.t==='title') h+=st('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
