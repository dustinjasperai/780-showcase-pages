<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarity Under Pressure — a Leader Unlock masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Hanken+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#363737; --panel:#3f4140; --ink:#f3f1ec; --muted:#b8b6b0;
    --rule:#545553; --accent:#0284c7; --deep:#0284c7;
    --display:'Spectral',Georgia,serif; --body:'Hanken Grotesque',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.15;margin-bottom:14px}
  h3{font-family:var(--display);font-weight:600;font-size:25px;margin-bottom:8px}
  p{font-size:19px;color:var(--ink);margin-bottom:14px;max-width:62ch}
  p.sub{font-size:22px;color:var(--muted)}
  .lead{font-size:21px}
  ul{list-style:none;margin:10px 0 0}
  li{position:relative;padding-left:30px;font-size:19px;margin-bottom:14px;max-width:62ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:2px;background:var(--accent)}
  li strong{color:#fff}
  .big{font-family:var(--display);font-size:38px;line-height:1.14;font-weight:600}
  .rule{height:2px;width:56px;background:var(--accent);margin:22px 0}
  .tag{font-size:15px;color:var(--muted)}
  .frame h2 em{font-style:italic;color:var(--accent)}
  .cta{background:#0284c7;color:#f6fbff;border-color:#0284c7}
  .cta h1{color:#ffffff}
  .cta .kicker{color:#cdeaf8}
  .cta p{color:#eaf6fd}
  .cta .rule{background:#bfe6f6}
  .disc{font-size:13px;color:#bfe0f1;margin-top:26px;max-width:70ch}
  .num{font-family:var(--display);font-size:16px;color:var(--accent);font-weight:600;margin-bottom:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kicker">Leader Unlock, a live masterclass</div>
    <h1>Clarity Under Pressure</h1>
    <div class="rule"></div>
    <p class="sub">How to lead with character when the weight is heavy, and not burn out or harden over.</p>
    <p class="tag">With Chris Antonelli</p>`},

  {t:'promise', cls:'', html:`
    <div class="kicker">What this hour gives you</div>
    <h2>You will leave with three things</h2>
    <ul>
      <li>A way to read the pressure you are under without it reading you.</li>
      <li>The Stewardship Model, a steadier way to hold the room you have been placed in.</li>
      <li>A 24-hour practice you can use on the next hard decision, tonight.</li>
    </ul>`},

  {t:'who', cls:'', html:`
    <div class="kicker">Who this is for</div>
    <h2>The leader who carries it quietly</h2>
    <p class="lead">You stepped into a bigger role. More people, more weight, higher stakes. And somewhere in there the honest conversations got fewer.</p>
    <p>Everyone assumes you have it handled. Most days you do. But there is a load you are not telling anyone about, and no obvious place to set it down.</p>`},

  {t:'trap', cls:'', html:`
    <div class="kicker">The trap</div>
    <h2>Two bad exits</h2>
    <p>Under sustained pressure, most leaders drift toward one of two exits. Both feel like strength.</p>
    <ul>
      <li>You burn out. You keep absorbing until there is nothing left to give the people in front of you.</li>
      <li>You harden. You stop feeling the weight by stopping feeling, and the humanity that made you worth following goes quiet.</li>
    </ul>`},

  {t:'reframe', cls:'frame', html:`
    <div class="kicker">The reframe</div>
    <h2>The real risk is not <em>failing</em>. It is <em>hardening</em>.</h2>
    <p class="lead">Failing a decision is recoverable. Losing your soul in the role is the quiet failure nobody schedules a review for.</p>
    <p>Clarity is what keeps you from both exits. Not more hustle, not thicker skin. A clear head and a soft heart, held at the same time.</p>`},

  {t:'part', cls:'', html:`
    <div class="num">Part One</div>
    <h2>Why clarity collapses under pressure</h2>
    <p class="lead">Pressure does not make you dumber. It narrows you. Your attention collapses to the loudest threat, and the loudest threat is usually not the most important one.</p>`},

  {t:'p1a', cls:'', html:`
    <h3>You start running on an old measurement system</h3>
    <p>Under stress your nervous system reaches for the oldest file it has: the version of you that failed, that got held back, that did not belong. It measures today's room with yesterday's ruler.</p>
    <p>That is what people call imposter syndrome. It is not a confidence problem. It is an outdated measurement system still running in the background.</p>`},

  {t:'p1b', cls:'', html:`
    <h3>The cost is your attention</h3>
    <p>When the old ruler is running, your attention turns inward: Do I belong here? Can they tell? That is attention stolen from the only place it is useful, which is the person and the decision in front of you.</p>
    <p>Pressure wins the moment you start managing your image instead of the room.</p>`},

  {t:'part2', cls:'', html:`
    <div class="num">Part Two</div>
    <h2>The Stewardship Model</h2>
    <p class="lead">The way through is not to feel more confident. It is to change what the role is for. You are not here to prove you belong. You are here to steward the room you have been placed in.</p>`},

  {t:'p2a', cls:'', html:`
    <h3>Step one, retire the old ruler</h3>
    <p>Name the alarm when it fires. "That is the old measurement system, not the facts." You do not argue with it. You notice it, and you set the ruler down.</p>`},

  {t:'p2b', cls:'', html:`
    <h3>Step two, turn outward</h3>
    <p>Ask one question: what does the person across from me actually need right now? Stewardship moves your attention off yourself and onto the room. The fraud feeling cannot survive a genuine question about someone else.</p>`},

  {t:'p2c', cls:'', html:`
    <h3>Step three, use what you were given</h3>
    <p>You have hard-won experience: the struggles, the failures, the recovery. Refusing to use it in the name of humility is not humility. It is mismanagement. You steward the room by spending what you have on the people in it.</p>`},

  {t:'triad', cls:'', html:`
    <div class="kicker">The three that hold it together</div>
    <h2>Clarity, character, steady direction</h2>
    <ul>
      <li><strong>Clarity</strong>, so you can see the real decision under the loud one.</li>
      <li><strong>Character</strong>, so the people you lead can predict you under pressure.</li>
      <li><strong>Steady direction</strong>, so the team has a fixed point when the ground moves.</li>
    </ul>`},

  {t:'character', cls:'', html:`
    <h3>Character is just you, repeated</h3>
    <p>People do not follow your best day. They follow your average one. Character under pressure is simply being the same person in the hard room that you are in the easy one.</p>
    <p>That predictability is what lets a team relax enough to do real work. A soft heart and a strong spine are not opposites. The best leaders carry both.</p>`},

  {t:'direction', cls:'', html:`
    <h3>Steady direction beats constant motion</h3>
    <p>When things get hard, the instinct is to manage the change: more updates, more meetings, more motion. But teams do not calm down around activity. They calm down around a fixed point.</p>
    <p>Your job under pressure is not to manage the change. It is to lead the transformation, by being the one thing that is not moving.</p>`},

  {t:'part3', cls:'', html:`
    <div class="num">Part Three</div>
    <h2>Monday morning, weight still there</h2>
    <p class="lead">A model you cannot use is just a nice feeling. Here is the practice you can run on the next hard decision.</p>`},

  {t:'p3a', cls:'', html:`
    <h3>The 24-hour practice</h3>
    <ul>
      <li>Name the decision in one sentence, out loud. Pressure hides the real decision inside a pile of urgent ones.</li>
      <li>Ask who this is actually for, and what they need from you. Steward the room.</li>
      <li>Sleep on it once if you can. Give grounded hope 24 hours to answer before fear does.</li>
    </ul>`},

  {t:'p3b', cls:'', html:`
    <h3>Three questions that restart clarity</h3>
    <ul>
      <li>What is actually true here, as opposed to what I am afraid is true?</li>
      <li>If I were mentoring someone I love through this, what would I tell them to do?</li>
      <li>What would the steadiest version of me do in the next ten minutes?</li>
    </ul>`},

  {t:'hope', cls:'frame', html:`
    <div class="kicker">The posture under all of it</div>
    <h2>Grounded hope, not hype</h2>
    <p class="lead">Hype is optimism that has never been tested. Grounded hope is the kind that has been through the worst and still chooses to lead toward something.</p>
    <p>It is quieter, and it holds. That is the leader people actually want in the room when it gets hard.</p>`},

  {t:'whyme', cls:'', html:`
    <div class="kicker">Why I teach this</div>
    <h2>I have led from both ends of it</h2>
    <p>I spent nearly 30 years in tech leadership, including as a Director of Business Strategy at Microsoft, and more than 20 years as a pastor. I have also led from the other end: there was a season I was homeless and in active addiction, sleeping in my truck.</p>
    <p>I write from the intersection of meeting rooms, living rooms, and hospital rooms, because that is where leadership actually gets carried.</p>`},

  {t:'recap', cls:'', html:`
    <div class="kicker">What to take with you</div>
    <h2>The whole thing in one line</h2>
    <p class="big">You do not overcome the weight by getting stronger. You overcome it by becoming a better steward of the room you have been placed in.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kicker">Where to go from here</div>
    <h1>Keep leading with clarity</h1>
    <div class="rule"></div>
    <p class="sub">If this is the way you want to lead, the Executive Momentum Mentorship is where we do it together, month after month: bi-weekly sessions, real decisions, steady direction.</p>
    <p>Start a conversation at leaderunlock.com. Read the free weekly essays while you think about it.</p>
    <p class="disc">Educational content only. Leadership outcomes depend on your own context, effort, and circumstances. No income, title, promotion, or result is guaranteed. Results vary from leader to leader.</p>`}
];
const deck = document.getElementById('deck');
S.forEach(s => {
  const sec = document.createElement('section');
  sec.className = 'slide ' + (s.cls || '');
  sec.innerHTML = s.html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
