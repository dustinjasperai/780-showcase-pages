<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholars Get Dollars | A Masterclass with Melissa A. Rowe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#edf3f3;
    --panel:#fbfdfc;
    --ink:#135875;
    --ink-soft:#2f4a55;
    --body:#36474c;
    --muted:#6f7c80;
    --accent:#2d7d89;
    --rule:#d6e3e2;
  }
  html,body{height:100%;}
  body{
    font-family:'Karla',-apple-system,sans-serif;
    background:var(--bg); color:var(--body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;}
  .slide{display:none;width:100%;max-width:960px;}
  .slide.active{display:block;animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kicker{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Spectral',Georgia,serif;font-size:52px;line-height:1.1;color:var(--ink);font-weight:700;letter-spacing:-.01em;}
  h2{font-family:'Spectral',Georgia,serif;font-size:38px;line-height:1.18;color:var(--ink);font-weight:700;margin-bottom:22px;letter-spacing:-.01em;}
  .lead{font-size:23px;line-height:1.5;color:var(--ink-soft);margin-top:24px;max-width:40ch;}
  p.body{font-size:20px;line-height:1.6;color:var(--body);max-width:52ch;margin-bottom:14px;}
  .big{font-family:'Spectral',Georgia,serif;font-size:40px;line-height:1.25;color:var(--ink);font-weight:700;max-width:22ch;}
  .big .hl{color:var(--accent);}
  ul.marks{list-style:none;margin-top:10px;}
  ul.marks li{font-size:20px;line-height:1.5;color:var(--body);padding:11px 0;border-bottom:1px solid var(--rule);display:flex;gap:16px;align-items:baseline;}
  ul.marks li:last-child{border-bottom:none;}
  ul.marks .ltr{font-family:'Spectral',serif;font-weight:700;color:var(--accent);font-size:26px;flex:0 0 28px;}
  ul.marks .lbl{color:var(--ink);font-weight:700;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px;}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px 24px;}
  .card .n{font-family:'Spectral',serif;font-size:22px;font-weight:700;color:var(--accent);margin-bottom:8px;}
  .card p{font-size:17px;line-height:1.5;color:var(--body);}
  .steps{margin-top:14px;}
  .steps .step{display:flex;gap:18px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule);}
  .steps .step:last-child{border-bottom:none;}
  .steps .yr{font-family:'Spectral',serif;font-weight:700;color:var(--accent);font-size:19px;flex:0 0 130px;}
  .steps .d{font-size:18px;line-height:1.5;color:var(--body);}
  .stat{font-family:'Spectral',serif;font-size:72px;font-weight:700;color:var(--accent);line-height:1;}
  .statline{font-size:21px;color:var(--ink-soft);margin-top:14px;max-width:40ch;line-height:1.5;}
  .bio{font-size:19px;line-height:1.6;color:var(--body);max-width:52ch;margin-top:8px;}
  .bio strong{color:var(--ink);}
  .cta-list{list-style:none;margin-top:22px;}
  .cta-list li{font-size:21px;line-height:1.5;color:var(--ink);padding:12px 0;border-bottom:1px solid var(--rule);font-weight:700;}
  .disclaimer{font-size:14px;line-height:1.5;color:var(--muted);margin-top:30px;max-width:60ch;font-style:italic;}
  .credit{font-family:'Spectral',serif;font-size:19px;color:var(--ink-soft);margin-top:30px;}
  .credit .name{color:var(--ink);font-weight:700;}
  nav{position:fixed;bottom:22px;right:26px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);font-weight:700;}
  nav button{font-family:inherit;font-weight:700;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:7px;width:40px;height:38px;cursor:pointer;font-size:17px;}
  nav button:hover{border-color:var(--accent);color:var(--accent);}
  .count{min-width:52px;text-align:center;}
  @media(max-width:640px){
    #stage{padding:5vh 7vw;}
    h1{font-size:34px;}h2{font-size:27px;}.lead{font-size:19px;}
    p.body{font-size:17px;}.big{font-size:28px;}.stat{font-size:52px;}
    .cols{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="stage"></div>
<nav>
  <button id="prev" aria-label="Previous">&#8592;</button>
  <span class="count"><span id="cur">1</span> / <span id="tot">1</span></span>
  <button id="next" aria-label="Next">&#8594;</button>
</nav>
<script>
const S=[
 {t:'title',k:'A masterclass for parents',h:'Scholars Get Dollars',lead:'How to position your child as the student scholarship panels say yes to, and write the essays that bring in the money.'},
 {t:'problem',k:'Who this is for',c:'<h2>This is for the parent who refuses to send their child into debt</h2><p class="body">You have a smart, hard-working kid. Good grades. Real activities. And a growing fear in the back of your mind that none of it will add up to enough money for college.</p><p class="body">The average family now sends a child into more than $30,000 of student loan debt. It does not have to be yours.</p>'},
 {t:'statement',k:'The hard truth',c:'<p class="big">Scholarships do not reward the best student. They reward the most <span class="hl">fundable</span> one.</p><p class="body" style="margin-top:24px;">Grades get your child considered. A clear profile and a clear story get your child funded. Those are two different games, and almost nobody teaches the second one.</p>'},
 {t:'problem',k:'Part one: the problem',c:'<h2>Why straight-A students still graduate with debt</h2><p class="body">It is almost never about the grades. Three things quietly cost families the money:</p><ul class="marks"><li><span class="ltr">1</span><span><span class="lbl">They start late and spray-and-pray.</span> Hundreds of random applications, senior year, under deadline panic.</span></li><li><span class="ltr">2</span><span><span class="lbl">They look like everyone else on paper.</span> No distinct profile a panel can fall in love with.</span></li><li><span class="ltr">3</span><span><span class="lbl">Their essays list accomplishments.</span> A resume in paragraph form never moves a committee to write a check.</span></li></ul>'},
 {t:'statement',k:'Part one',c:'<p class="big">A scholarship panel is not grading an application.</p><p class="body" style="margin-top:22px;">They are choosing a person to <strong>invest in</strong>. Once you see the money that way, everything about how you prepare your child changes.</p>'},
 {t:'section',k:'Part two: the method',c:'<h2>The SCHOLAR Profile</h2><p class="body">Scholarships fund a profile, not a GPA. Over years of coaching students to more than twelve million dollars in awards, the same seven marks show up again and again in the students who get funded.</p>'},
 {t:'framework',k:'The SCHOLAR Profile',c:'<h2>What panels are really looking for</h2><ul class="marks"><li><span class="ltr">S</span><span><span class="lbl">Studious</span>: curious and consistent, not just high-scoring.</span></li><li><span class="ltr">C</span><span><span class="lbl">Community-minded</span>: shows up for people beyond themselves.</span></li><li><span class="ltr">H</span><span><span class="lbl">Holistically developed</span>: a whole person, not a transcript.</span></li><li><span class="ltr">O</span><span><span class="lbl">Organized</span>: manages deadlines, documents, and themselves.</span></li></ul>'},
 {t:'framework',k:'The SCHOLAR Profile',c:'<h2>The marks that win the money</h2><ul class="marks"><li><span class="ltr">L</span><span><span class="lbl">Leader</span>: has taken real responsibility for an outcome.</span></li><li><span class="ltr">A</span><span><span class="lbl">And willing to go beyond</span>: does more than what is required.</span></li><li><span class="ltr">R</span><span><span class="lbl">Relationship builder</span>: has people who can speak to their potential.</span></li></ul><p class="body" style="margin-top:18px;">Seven marks. Every one of them can be built on purpose, starting years before the first deadline.</p>'},
 {t:'content',k:'The SCHOLAR Score',c:'<h2>Know where your child stands today</h2><p class="body">Before you chase a single application, you need an honest read: where is your child already showing scholarship potential, and which marks still need attention?</p><p class="body">The SCHOLAR Score turns those seven marks into strengths, gaps, and the exact next step for your child&rsquo;s current grade.</p>'},
 {t:'content',k:'Part two: pillar two',c:'<h2>Where the real money actually is</h2><p class="body">Most families burn their energy on a handful of giant national scholarships every other family is also chasing. The money your child can actually win is somewhere else.</p><div class="cols"><div class="card"><div class="n">Built to win</div><p>Local, identity-based, essay-driven, and renewable awards matched to who your child is.</p></div><div class="card"><div class="n">A real pipeline</div><p>A steady, organized list worked over years, not a panic sprint in senior spring.</p></div></div>'},
 {t:'content',k:'Part two: pillar three',c:'<h2>The essay that brings in the most dollars</h2><p class="body">This is where the money is won or lost. A winning scholarship essay is not a list of achievements. It is a clear story that connects three things a panel can invest in:</p><ul class="marks"><li><span class="ltr">1</span><span><span class="lbl">Who they are</span>: the origin that shaped them.</span></li><li><span class="ltr">2</span><span><span class="lbl">What they have done</span>: the evidence that it is real.</span></li><li><span class="ltr">3</span><span><span class="lbl">Where they are going</span>: the vision the money makes possible.</span></li></ul>'},
 {t:'statement',k:'The story',c:'<p class="big">When a panel can see <span class="hl">who, what, and where next</span> in one clear line, they stop reading applications and start writing checks.</p>'},
 {t:'plan',k:'Part three: the plan',c:'<h2>Your child&rsquo;s path, grade by grade</h2><div class="steps"><div class="step"><span class="yr">9th &amp; 10th</span><span class="d">Build the SCHOLAR marks on purpose. Start the story early.</span></div><div class="step"><span class="yr">11th</span><span class="d">Score the profile, build the targeted scholarship pipeline, draft the core story.</span></div><div class="step"><span class="yr">12th</span><span class="d">Submit from strength, on time, with essays that are already tested.</span></div></div>'},
 {t:'stat',k:'What is possible',c:'<div class="stat">$12M+</div><p class="statline">in scholarships won by students using this approach, including Gates Millennium recipients and full rides at Yale, UPenn, Cornell, Howard, and Morehouse.</p>'},
 {t:'bio',k:'Why me',c:'<h2>Why I can teach this</h2><p class="bio">I am <strong>Melissa A. Rowe</strong>, founder of Capture Greatness and author of <em>Scholars Get Dollars</em>. I came to this work as a writer first, as director of the Temple Writing Academy and through workshops here and abroad.</p><p class="bio">WHYY named me an American Graduate Champion for my work with students from under-resourced schools. And I am a mom who wanted more for my child without wrecking our own finances. This is the method I wish every family had.</p>'},
 {t:'content',k:'The path',c:'<h2>The whole method, in one line</h2><p class="body">Score the profile. Build the seven marks. Target the right money. Tell the story that funds it. Submit from strength.</p><p class="body">That is how a family gets a child to college on scholarships, not debt.</p>'},
 {t:'cta',k:'Your next step',c:'<h2>Start here</h2><ul class="cta-list"><li>Take the free SCHOLAR Score quiz and see where your child stands today.</li><li>Read <em>Scholars Get Dollars</em> for the full method.</li><li>Join the Capture Greatness email community for the weekly scholarship plan.</li></ul><p class="disclaimer">This masterclass is for educational purposes only. Scholarship outcomes vary by student and circumstance, and no specific award, admission, or financial result is promised or guaranteed.</p><div class="credit"><span class="name">Melissa A. Rowe, M.Ed.</span> &middot; Capture Greatness</div>'}
];
const stage=document.getElementById('stage');
let i=0;
function render(){
  stage.innerHTML='';
  const s=S[i];
  const d=document.createElement('div');
  d.className='slide active';
  let inner='';
  if(s.k)inner+=`<div class="kicker">${s.k}</div>`;
  if(s.h)inner+=`<h1>${s.h}</h1>`;
  if(s.lead)inner+=`<p class="lead">${s.lead}</p>`;
  if(s.c)inner+=s.c;
  d.innerHTML=inner;
  stage.appendChild(d);
  document.getElementById('cur').textContent=i+1;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
document.getElementById('tot').textContent=S.length;
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(i+1);
  if(e.key==='ArrowLeft')go(i-1);
});
stage.addEventListener('click',()=>go(i+1));
render();
</script>
</body>
</html>
