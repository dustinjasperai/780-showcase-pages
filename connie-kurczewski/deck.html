<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Transferring the Trust Masterclass · Elevated Practice Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#16211C; --panel:#1E2B24; --rule:#2C3B33;
    --gold:#C9A467; --sage:#9FB3A6; --chalk:#F3F1EA; --grey:#C7D0C9; --dim:#7C8A81;
  }
  html,body{height:100%}
  body{background:#000;font-family:'IBM Plex Sans',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:2.4vh}
  h1{font-family:'Noto Serif Display',Georgia,serif;font-weight:400;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.7vw}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-size:1.46vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'IBM Plex Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--sage);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#22332B 0%,#0B120E 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:86%;font-style:italic;color:#F2EFE6}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#22332B 0%,#0B120E 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--gold);color:#EAD9B8;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .pillar-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-pillar{right:7.5%;bottom:8%;width:20vw}
  .corner-pillar{right:6%;bottom:7.5%;width:9vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--gold);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Elevated Practice Consulting</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- five-pillar motif: five vertical lines under one horizontal beam, the shortest dashed -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="pillars" viewBox="0 0 260 150">
  <g fill="none" stroke-linecap="round">
    <line x1="14" y1="34" x2="246" y2="34" stroke="#C9A467" stroke-width="3"/>
    <line x1="40" y1="34" x2="40" y2="128" stroke="#9FB3A6" stroke-width="3" opacity="0.85"/>
    <line x1="90" y1="34" x2="90" y2="128" stroke="#9FB3A6" stroke-width="3" opacity="0.85"/>
    <line x1="140" y1="34" x2="140" y2="128" stroke="#9FB3A6" stroke-width="3" opacity="0.85"/>
    <line x1="190" y1="34" x2="190" y2="128" stroke="#9FB3A6" stroke-width="3" opacity="0.85"/>
    <line x1="220" y1="34" x2="220" y2="110" stroke="#C9A467" stroke-width="3" stroke-dasharray="3 7" opacity="0.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Transferring the Trust Masterclass',sub:'How dermatology and aesthetic practice owners step back from daily operations, without the practice losing a step, in one hour.',brand:true,climb:'title'},
 {t:'normal',k:'Who this is for',title:'You built the practice. Now the practice cannot run without you in it.',body:'You are an excellent clinician and a strong owner. The catch is that every decision, every exception, and every "just check with me first" still runs through you, every single day.'},
 {t:'normal',k:'The trap',title:'Working harder will not fix a structural problem.',body:'Every owner eventually hits the same wall: the practice is capped by how much of you it can consume. Longer hours do not lift that ceiling. A better-built structure does.'},
 {t:'dark',title:'You do not have a staffing problem. You have a practice that depends on you.'},

 {t:'section',idx:'Part One',title:'The Practice That Depends On You'},
 {t:'normal',k:'The real cap',title:'The most capable owner in the building is often the most trapped.',body:'When every standard, every judgment call, and every "how do we handle this" waits on you, the practice cannot outgrow your calendar. Your skill built this practice. Your presence alone will not free it.'},
 {t:'normal',k:'The shift',title:'Stop being the standard. Start building a practice that holds one.',body:'The owners who break through are not working more hours in the chair. They embedded the standard into the team and the systems, so it holds whether or not they are in the building that day.'},
 {t:'dark',title:'Trust is not something you give once. It is something you transfer, deliberately, on purpose.'},

 {t:'section',idx:'Part Two',title:'Transferring the Trust'},
 {t:'normal',k:'Pillar one',title:'Office-manager development.',body:'Your office manager becomes a real second-in-command, someone who can run the daily operation and make the calls you currently make yourself.'},
 {t:'normal',k:'Pillar two',title:'Clinical-team training.',body:'The clinical team is trained to hold your standards without you personally checking every chart, every room, every day.'},
 {t:'normal',k:'Pillar three',title:'Policy enforcement.',body:'Written policy the team actually follows, so consistency stops depending on whether you happened to walk past.'},
 {t:'normal',k:'Pillar four',title:'Patient-focused marketing.',body:'Marketing built around the patient experience you actually deliver, not a generic lead-gen script that promises something the practice cannot back up.'},
 {t:'normal',k:'Pillar five',title:'A consistent patient experience.',body:'The same standard of care from first contact through follow-up, no matter which team member the patient reaches that day.'},
 {t:'dark',title:'Five pillars, built deliberately, are what let a practice run without you in every room.'},

 {t:'section',idx:'Part Three',title:'What This Looks Like'},
 {t:'normal',k:'The result',title:'The same practice you built, minus the bottleneck.',body:'You keep the clinical vision and the standards you set. What changes is everything around it: a team that runs the daily operation, and a practice that holds its standard whether or not you are in the building.'},
 {t:'normal',k:'Why me',title:'25 years inside medical and aesthetic practice management.',body:'I am Connie Kurczewski, founder of Elevated Practice Consulting. Dermatologists including Dr. Kim Nichols, Dr. Aanand Geria, and Dr. Ife Rodney have used Transferring the Trust to build practices that no longer depend on them for every decision.'},

 {t:'section',idx:'Your next step',title:'A Private Strategy Call'},
 {t:'normal',k:'How we begin',title:'A conversation about your practice, and where the trust has not yet transferred.',body:'We look at what is holding the practice to you today and map the specific shifts, pillar by pillar, that let your team carry it. If it is a fit, we talk about working together. My roster stays small on purpose.'},
 {t:'cta',title:'Book a Private Strategy Call.',chips:['Book a Private Strategy Call','Explore Elevated Practice Consulting'],disc:'Educational content for dermatology and aesthetic practice owners only. No income, revenue, or business result is guaranteed. Results vary by owner, practice, and market.'},
];

const deck=document.getElementById('deck');
function pillars(kind){return `<svg class="pillar-motif ${kind==='title'?'title-pillar':'corner-pillar'}"><use href="#pillars"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Elevated Practice Consulting &middot; <b>Connie Kurczewski</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.climb) h+=pillars(s.climb);
  else if(s.t==='title') h+=pillars('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
