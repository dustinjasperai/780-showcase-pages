<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Optometrist's Money Blind Spot · Evon Mendrin, CFP, CSLP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f2ec; --panel:#ffffff; --rule:#dfe1e6;
    --acc:#ee6c4d; --ink:#26303f; --steel:#3d5a80; --chalk:#f4efe6; --dim:#8b8676;
  }
  html,body{height:100%}
  body{background:#26303f;font-family:'Lato',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1f2733}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.2vw;max-width:90%}
  .t-normal h1{font-size:3.15vw;max-width:86%;font-weight:500}
  .t-normal .body{font-size:1.48vw;color:var(--steel);margin-top:2.6vh;max-width:76%;line-height:1.55;font-weight:400}
  .sub{font-size:1.72vw;color:var(--steel);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start;background:linear-gradient(180deg,#f7f4ee 0%,#efeae0 100%)}
  .t-section .idx{font-family:'Lato',sans-serif;font-size:1.32vw;font-weight:700;color:var(--steel);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:90%;font-weight:500}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#33404f 0%,#212a37 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.65vw;max-width:88%;color:var(--chalk);font-weight:400}
  .t-dark h1 em{font-style:italic;color:#f3b3a1}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#33404f 0%,#212a37 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:var(--chalk);font-weight:500}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:#f4efe6;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.2vw;font-weight:700}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:#c7cdd6;font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .ledger{position:absolute;pointer-events:none}
  .title-ledger{right:7%;bottom:8%;width:23vw;opacity:.95}
  .corner-ledger{right:6%;bottom:7.5%;width:10vw;opacity:.5}
  .brandline{font-size:1.28vw;color:var(--steel);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#aeb6c2;z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#aeb6c2;z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#aeb6c2;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">Optometry Wealth Advisors</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- balance-sheet motif: two columns (Practice | Personal) bracketed into one baseline -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ledger" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="60" y1="26" x2="60" y2="112" stroke="#3d5a80" opacity="0.5"/>
    <line x1="200" y1="26" x2="200" y2="112" stroke="#3d5a80" opacity="0.5"/>
    <line x1="40" y1="44" x2="80" y2="44" stroke="#3d5a80" opacity="0.35"/>
    <line x1="40" y1="64" x2="80" y2="64" stroke="#3d5a80" opacity="0.35"/>
    <line x1="40" y1="84" x2="80" y2="84" stroke="#3d5a80" opacity="0.35"/>
    <line x1="180" y1="44" x2="220" y2="44" stroke="#3d5a80" opacity="0.35"/>
    <line x1="180" y1="64" x2="220" y2="64" stroke="#3d5a80" opacity="0.35"/>
    <line x1="180" y1="84" x2="220" y2="84" stroke="#3d5a80" opacity="0.35"/>
    <path d="M60 118 Q130 140 200 118" stroke="#ee6c4d" opacity="0.95"/>
    <circle cx="130" cy="132" r="5" fill="none" stroke="#ee6c4d" stroke-width="2.6"/>
    <line x1="130" y1="118" x2="130" y2="127" stroke="#ee6c4d" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Optometrist’s Money Blind Spot',sub:'A masterclass for practice-owning optometrists: how to plan your practice and your personal finances as one system, starting with the six-figure student-loan decision.',brand:true,ledger:'title'},

 {t:'normal',k:'Who this is for',title:'You run the practice and the household. Most advice only looks at half.',body:'You own, or you are buying into, an optometry practice. You carry six-figure school debt, you set your own pay, and you make the tax and buy-in calls. And the advice you can find treats your practice books and your personal money as two separate files.'},
 {t:'dark',title:'Your practice and your personal finances are not two problems. They are <em>one balance sheet.</em>'},

 {t:'section',idx:'Part One',title:'The Two-Worlds Problem'},
 {t:'normal',k:'The split',title:'Most financial advice treats your practice and your life as separate worlds.',body:'One person does the practice books. Another sells you a product for retirement. Nobody sits at the intersection, where owner pay, taxes, debt, and personal goals actually meet. That gap is where optometrists quietly leave money, and safety, on the table.'},
 {t:'normal',k:'The starting line',title:'You started six figures behind, and four years late.',body:'Optometry school adds four to five years and, for most ODs, one hundred thousand dollars or more in student debt, while other graduates were already earning and investing. That head start you never got is the first thing every plan has to reckon with.'},
 {t:'normal',k:'Where the two worlds meet',title:'Your biggest decisions touch both sides at once.',body:'How you pay yourself, how the practice is taxed, whether you buy in and on what terms. Each one moves the practice and the household together. Decide them one at a time, in isolation, and the pieces can work against each other.'},
 {t:'dark',title:'Optimize one side on its own, and you can quietly lose on the other.'},

 {t:'section',idx:'Part Two',title:'Planning It As One System'},
 {t:'normal',k:'Start with the loans',title:'The student-loan decision is itself a six-figure decision.',body:'Forgiveness and income-driven repayment, aggressive payoff, or refinancing are not equal, and the right answer depends on your income, your practice plans, and your family. Run the numbers the wrong way and it can cost more than a year of take-home pay. This is where a real plan starts.'},
 {t:'normal',k:'Pay and taxes as one lever',title:'Owner pay, entity, and taxes are a single decision, not three.',body:'How you take money out of the practice drives your tax bill, your retirement options, and what actually lands in the household. Set them together and you keep more of every dollar you already earn, before you invest a cent.'},
 {t:'normal',k:'Fund the future',title:'Build wealth without starving the practice.',body:'Cash flow has to serve the practice and the household at the same time: reserves, retirement contributions, and the personal goals that made ownership worth it. One plan decides how each dollar is used, so nothing important gets crowded out.'},
 {t:'normal',k:'Every stage',title:'Associate, new owner, established owner, exit. Each has its own playbook.',body:'The money moves that fit an associate paying down loans are not the moves that fit an owner planning a sale. Planning at every stage means the decision in front of you today still makes sense against the exit you want years from now.'},
 {t:'dark',title:'When the practice and the household share <em>one plan,</em> your decisions compound instead of competing.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The owner this builds',title:'Decisions made with the whole picture in front of you.',body:'Debt on a deliberate path instead of a guess. A tax bill you planned for. Pay, savings, and the practice pulling in the same direction. The same income, organized so it actually builds toward the life you want.'},
 {t:'dark',title:'Confidence is not a feeling. It is <em>knowing the numbers</em> behind your next decision.'},
 {t:'normal',k:'Why Evon Mendrin',title:'A fee-only, fiduciary planner who works only with optometrists.',body:'Evon Mendrin, CFP and CSLP, founded Optometry Wealth Advisors and hosts The Optometry Money Podcast. Fee-only and fiduciary means no products and no commissions, only advice in your interest, from someone who plans at the intersection of your practice and your personal finances every day.'},

 {t:'section',idx:'Your Next Step',title:'Plan It As One'},
 {t:'normal',k:'Ongoing planning',title:'Ongoing planning and investment management, one flat fee.',body:'A single monthly engagement covering the practice and the household together: student loans, taxes, owner pay, investing, and the big practice decisions as they come. Flat monthly pricing, no product sales, and no asset minimums.'},
 {t:'normal',k:'Or start smaller',title:'Just want the loan question answered first? Start there.',body:'Refract Your Student Loans is a standalone, one-time analysis of your repayment strategy, for optometrists who want the six-figure decision handled before anything else. It is the simplest way to see what a real plan does.'},
 {t:'cta',title:'Ready to plan your practice and your life as one system?',chips:['Book an intro call','Start with a student-loan analysis'],disc:'Educational content for optometrists. No specific financial, tax, loan, or investment result is guaranteed. Results vary by individual circumstances, and this presentation is not personalized advice.'},
];

const deck=document.getElementById('deck');
function ledger(kind){return `<svg class="ledger ${kind==='title'?'title-ledger':'corner-ledger'}"><use href="#ledger"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Optometry <b>Wealth Advisors</b> · Evon Mendrin, CFP, CSLP</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.ledger) h+=ledger(s.ledger);
  else if(s.t==='title') h+=ledger('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
