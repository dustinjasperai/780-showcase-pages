<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create What's Next — A Retirement Wisdom Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Mulish:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Palette (traceable to 01-deep-research.md ## Palette / brand.json):
     ground #fbf4e6 = a warm cream derived from their pale-gold #ffdead (navajo white, brand.json);
     panel #fffdf7 (same cream, near-white); ink/rule #114071 (their brand navy);
     accent #b6872c (their own CTA fill). Type: Lora display + Mulish body (their site face). */
  :root{
    --bg:#fbf4e6; --panel:#fffdf7; --ink:#114071; --accent:#b6872c;
    --muted:#5a6475; --rule:#114071;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border-radius:14px;padding:64px 64px 56px;margin:0 0 28px;
    box-shadow:0 1px 0 rgba(17,64,113,.06),0 18px 40px -28px rgba(17,64,113,.28);
    border:1px solid rgba(17,64,113,.07);min-height:460px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-family:"Mulish";font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Lora",Georgia,serif;font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:"Lora",Georgia,serif;font-weight:600;font-size:38px;line-height:1.14;margin-bottom:18px}
  .lead{font-size:21px;line-height:1.55;color:var(--muted);max-width:40em;font-weight:400}
  .big{font-family:"Lora",Georgia,serif;font-size:44px;line-height:1.18;font-weight:500;max-width:22em}
  .underline{display:inline-block;border-bottom:4px solid var(--accent);padding-bottom:4px}
  .promise{font-size:24px;line-height:1.5;color:var(--ink);max-width:34em;margin-top:6px;font-weight:600}
  .sig{margin-top:34px;font-size:16px;color:var(--muted)}
  .sig b{color:var(--ink);font-weight:800}
  ul{list-style:none;margin-top:10px}
  li{font-size:22px;line-height:1.5;padding:14px 0;border-top:1px solid rgba(17,64,113,.12);display:flex;gap:16px;align-items:baseline}
  li:first-child{border-top:none}
  li .n{font-family:"Lora",serif;color:var(--accent);font-weight:600;font-size:22px;min-width:1.4em}
  li .t{font-weight:400;color:var(--muted)}
  li .t b{color:var(--ink);font-weight:800}
  .pillar{font-size:23px;line-height:1.55;color:var(--muted);max-width:38em}
  .pillar b{color:var(--ink);font-weight:800}
  .stat{font-family:"Lora",serif;font-size:72px;font-weight:600;color:var(--accent);line-height:1}
  .creds{columns:2;column-gap:40px;margin-top:8px}
  .creds li{font-size:18px;padding:9px 0}
  .cta-line{font-size:22px;line-height:1.55;color:var(--muted);max-width:34em;margin-top:8px}
  .disclaimer{margin-top:40px;font-size:13px;line-height:1.5;color:#8a93a3;max-width:46em;border-top:1px solid rgba(17,64,113,.12);padding-top:16px}
  .page{position:absolute;top:22px;right:28px;font-size:12px;color:#a7adb8;font-weight:600}
  .slide{position:relative}
  @media (max-width:640px){.slide{padding:40px 28px}h1{font-size:34px}h2{font-size:28px}.big{font-size:30px}.creds{columns:1}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Retirement Wisdom Masterclass', h:'Create What’s Next',
   promise:'The five things work gave you, and how to replace the four that money can’t.',
   sig:'with <b>Joe Casey</b> &middot; Retirement Wisdom'},

  {t:'who', kicker:'Who this is for', h:'Retiring, but not done yet.',
   lead:'You did the hard part. The number works, the plan is in place, you can afford to stop. The question that keeps you up isn’t whether you can retire. It’s what a 20-year retirement is actually for.'},

  {t:'trap', kicker:'The trap', h:'You planned the money. Nobody planned the Monday mornings.',
   lead:'Every hour of your working life was planned for you. Then one Friday it stops, and the calendar goes blank. The relief is real for a while. Then the quiet sets in.'},

  {t:'hook', big:'A 20-year retirement is a <span class="underline">terrible thing to waste.</span>',
   lead:'The real risk in retirement isn’t running out of money. For most people who planned well, it’s running out of meaning.'},

  {t:'part', kicker:'Part One', h:'Financial readiness is not life readiness.'},

  {t:'stat', kicker:'The honeymoon period', stat:'2.5 years',
   lead:'Research finds new retirees spend on average about two and a half years in a honeymoon period before they decide what’s next. Spent on purpose, it’s a runway. Drifted through, it becomes the shape of the whole retirement.'},

  {t:'five', kicker:'What work really gave you', h:'A paycheck was only one of five things.',
   items:[
     {n:'1', b:'A paycheck.', t:'The one thing your financial plan actually replaces.'},
     {n:'2', b:'Structure.', t:'A reason the day had a shape.'},
     {n:'3', b:'Purpose.', t:'Work that mattered to someone besides you.'},
     {n:'4', b:'Connection.', t:'People you saw without having to schedule it.'},
     {n:'5', b:'Identity.', t:'An answer to “so what do you do?”'}
   ],
   lead:'Your plan covered number one. The next four are the ones that decide whether the 20 years feel like freedom or like drift.'},

  {t:'part', kicker:'Part Two', h:'The four pillars money can’t buy back.'},

  {t:'pillar', kicker:'Pillar one', h:'Structure',
   pillar:'Freedom with no frame is just an empty week. The work isn’t to fill the calendar, it’s to build a rhythm you’d choose on purpose, so Tuesday means something again without a boss deciding what.'},

  {t:'pillar', kicker:'Pillar two', h:'Purpose',
   pillar:'Purpose doesn’t retire. It relocates. The task is to find the work, paid or not, that still makes you feel useful to someone, and to take it as seriously as you took the career.'},

  {t:'pillar', kicker:'Pillar three', h:'Connection',
   pillar:'Most of your relationships were handed to you by a workplace. When that ends, connection becomes something you have to design, not something that just shows up at your desk.'},

  {t:'pillar', kicker:'Pillar four', h:'Identity',
   pillar:'For 30 years the title answered the question of who you were. When it goes, a lot of people quietly lose themselves for a while. Rebuilding an identity that isn’t your old role is the deepest part of this work.'},

  {t:'part', kicker:'Part Three', h:'How you actually find it: pilots, not five-year plans.'},

  {t:'method', kicker:'The method', h:'You can’t think your way to what’s next.',
   lead:'Nobody figures out the rest of their life on a notepad. You find it by trying. We run small, low-stakes pilots, real experiments in the real world, and let your own experience tell you what fits before you commit to anything.'},

  {t:'pilot', kicker:'What a pilot looks like', h:'Small bets, real feedback.',
   lead:'A month volunteering before you decide it’s your cause. Two days a week consulting before you call yourself retired-ish. A class before you declare a new passion. Each pilot answers a question that no amount of planning could.'},

  {t:'picture', kicker:'A week on purpose', h:'A week you designed on purpose.',
   lead:'Not busy for the sake of busy. A shape you chose: things that give you structure, work that gives you purpose, people who give you connection, and a clear sense of who you are now. That is a retirement worth the 20 years.'},

  {t:'why', kicker:'Why learn this from me', h:'I’ve studied this, and I’ve lived it.',
   creds:[
     'Master’s in Gerontology, USC',
     'Master’s in Executive Coaching, Middlesex University',
     '26 years in Human Resources at Merrill Lynch',
     'Retired early at 52 to build this practice',
     'Certified Retirement Coach (Retirement Options)',
     'Certified Designing Your Life coach'
   ],
   lead:'I spent a career helping people navigate the biggest transitions of their working lives, then walked through this one myself. This is the part of retirement I know best.'},

  {t:'recap', kicker:'The takeaway', h:'Don’t drift through the best years you bought.',
   lead:'You spent decades earning this time. Structure, purpose, connection, identity: plan the four that money can’t, and the 20 years become the best chapter, not the longest intermission.'},

  {t:'cta', kicker:'Create what’s next', h:'Let’s design your next chapter.',
   ctaline:'If you’re retiring but not done yet, let’s have a conversation about what’s next for you and how to build it on purpose. Book a call with me at Retirement Wisdom and we’ll start with your what’s next.',
   disclaimer:'This masterclass is for educational purposes only. It is not financial, legal, tax, or medical advice. Every person’s retirement is different and individual results vary. Nothing here is a guarantee of any particular outcome.'}
];

function el(tag, cls, html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('section','slide');
  sl.appendChild(el('div','page',(i+1)+' / '+S.length));
  if(s.kicker)sl.appendChild(el('div','kicker',s.kicker));
  if(s.h)sl.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));
  if(s.promise)sl.appendChild(el('div','promise',s.promise));
  if(s.big)sl.appendChild(el('div','big',s.big));
  if(s.stat)sl.appendChild(el('div','stat',s.stat));
  if(s.items){const ul=el('ul');s.items.forEach(it=>{const li=el('li');li.appendChild(el('span','n',it.n));li.appendChild(el('span','t','<b>'+it.b+'</b> '+it.t));ul.appendChild(li);});sl.appendChild(ul);}
  if(s.creds){const ul=el('ul','creds');s.creds.forEach(c=>{const li=el('li');li.appendChild(el('span','t',c));ul.appendChild(li);});sl.appendChild(ul);}
  if(s.pillar)sl.appendChild(el('div','pillar',s.pillar));
  if(s.lead)sl.appendChild(el('div','lead',s.lead));
  if(s.ctaline)sl.appendChild(el('div','cta-line',s.ctaline));
  if(s.sig)sl.appendChild(el('div','sig',s.sig));
  if(s.disclaimer)sl.appendChild(el('div','disclaimer',s.disclaimer));
  deck.appendChild(sl);
});
</script>
</body>
</html>
