<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Whole-Systems Hotel — a Whole Systems Hospitality masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0e7;        /* pale sage paper, from her regenerative brand world */
    --panel:#f8faf3;
    --rule:#d2d8c6;
    --ink:#1f2a24;       /* deep forest-charcoal */
    --muted:#55615a;
    --accent:#2f5a43;    /* regenerative forest green */
    --clay:#b06a3c;      /* warm clay, motif only */
    --display:'Spectral', Georgia, serif;
    --body:'Hanken Grotesk', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 72px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(31,42,36,.03);
  }
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.04;margin:0 0 16px;letter-spacing:.2px}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.12;margin:0 0 14px}
  .lead{font-size:20px;line-height:1.5;color:var(--muted);max-width:52ch;margin:0}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:56ch}
  .big{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.15;max-width:22ch;color:var(--ink)}
  ul{margin:14px 0 0;padding:0;list-style:none;max-width:60ch}
  li{position:relative;padding:12px 0 12px 30px;border-top:1px solid var(--rule);font-size:18px;line-height:1.5}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:20px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .pillar{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);margin:0 0 6px}
  .part{font-family:var(--display);font-size:72px;font-weight:700;color:var(--clay);opacity:.9;margin:0 0 8px}
  .foot{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--rule);
    text-align:center;font-size:12px;color:var(--muted);padding:9px}
  .count{font-family:var(--body);font-size:12.5px;color:var(--muted);letter-spacing:.12em;margin-top:26px}
  .cta-note{font-size:13px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .brandline{font-family:var(--display);font-size:22px;color:var(--accent);margin-top:10px}
  .nodes{display:flex;gap:10px;margin:18px 0 0}
  .nodes span{width:14px;height:14px;border-radius:50%;background:var(--accent)}
  .nodes span:nth-child(2){background:var(--clay)}
  .nodes span:nth-child(3){background:var(--ink)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<div class="foot">Whole Systems Hospitality &nbsp;&middot;&nbsp; A live masterclass for hotel leaders</div>
<script>
const S=[
  {t:'title',
   kicker:'A live masterclass for hotel leaders',
   h1:'The Whole-Systems Hotel',
   lead:'Turning sustainability into guest loyalty, resilience, and performance. Taught live, from the whole-systems method.'},

  {t:'who',
   kicker:'Who this is for',
   h2:'Owners and operators who are done treating sustainability as a side project.',
   p:'If you run a hotel or a management company and you keep hearing that you "need a sustainability plan," this hour is for you. We are going to make it mean something your guests actually feel.'},

  {t:'trap',
   kicker:'The trap',
   big:'A coordinator, a binder, and a certificate on the wall.',
   p:'That is how most properties "do" sustainability. One person, one project, one framed logo at the front desk. It checks a box. It rarely changes anything a guest remembers.'},

  {t:'hook',
   kicker:'The uncomfortable part',
   big:'A certificate does not change how a guest feels about their stay.',
   p:'And it does not change your P&L either. If sustainability lives in a silo, it stays a cost. The question is not how to get certified. It is how to make it reach the guest and the bottom line.'},

  {t:'part', part:'01', kicker:'Part one', h2:'The core problem is structure, not effort.'},

  {t:'problem',
   kicker:'Silos',
   h2:'Housekeeping, F&B, energy, procurement. Four teams, four plans, one disconnected hotel.',
   p:'Each department optimizes alone. Nobody owns the loop between them. So the linen program, the kitchen, the energy retrofit, and the buying decisions never add up to a story a guest can see.'},

  {t:'problem2',
   kicker:'The cost of the silo',
   h2:'Effort leaks out between the gaps.',
   p:'Money gets spent, and the guest experience barely moves. Staff burn out re-doing work. The property looks busy on sustainability and feels no different to stay in. That gap is the real problem, and it is fixable.'},

  {t:'part', part:'02', kicker:'Part two', h2:'The whole-systems method.'},

  {t:'frame',
   kicker:'Whole-systems thinking',
   big:'A hotel is one living system, not a checklist.',
   p:'A change in housekeeping ripples into guest comfort. A kitchen decision ripples into waste and into story. Procurement ripples into both. Design sustainability into the loop and it stops being a project. It becomes how the hotel runs.',
   nodes:true},

  {t:'pillar',
   kicker:'The three systems',
   pillar:'People',
   h2:'Culture and capability that make it stick.',
   p:'The method starts with your team, not a vendor. When the people running the floor understand why, the practices survive the next management change. This is where most plans quietly die, so it is where we start.'},

  {t:'pillar',
   kicker:'The three systems',
   pillar:'Planet',
   h2:'Regenerative operations, past do-less-harm.',
   p:'Reducing impact is the floor. The goal is operations that actively restore, from regenerative food and beverage to true wellness for guests and staff. That is the part guests feel and talk about.'},

  {t:'pillar',
   kicker:'The three systems',
   pillar:'Performance',
   h2:'How green work compounds into loyalty.',
   p:'Run as one system, sustainability stops being a line item and becomes a reason guests return and a buffer when things go wrong. People, planet, and performance are not three initiatives. They are one system measured three ways.'},

  {t:'regen',
   kicker:'Regenerative practice',
   h2:'Do less harm is not the finish line.',
   p:'Regenerative means the property leaves its community and its ecology better than it found them. It sounds lofty. In practice it is a set of concrete operating choices across food, water, energy, and sourcing that a team can actually run.'},

  {t:'future',
   kicker:'Future-ready',
   h2:'Build it into the team, not into a consultant.',
   p:'Through Train-the-Trainer and workshops, the method becomes your people’s default way of working. The point is for it to keep working long after any outside help has gone. Capability is what makes it durable.'},

  {t:'part', part:'03', kicker:'Part three', h2:'What it looks like in a real property.'},

  {t:'picture',
   kicker:'The whole-systems hotel',
   h2:'Three systems moving together.',
   ul:['The team can explain why, not just what, so practices outlast the next reshuffle',
       'Operations actively restore rather than merely reduce, and guests notice',
       'Sustainability shows up as loyalty and resilience, not as a cost center']},

  {t:'picture2',
   kicker:'What changes',
   big:'The same effort, finally pointed in one direction.',
   p:'Nothing here asks for a bigger budget first. It asks for the loop to be connected. When it is, the work you are already doing starts reaching the guest and the P&L at the same time.'},

  {t:'why',
   kicker:'Why me',
   h2:'Two decades connecting these dots for real properties.',
   p:'I have spent roughly twenty years in hospitality sustainability and operational transformation, working across GSTC, EarthCheck, Green Key Global, WELL Health-Safety, TRUE Zero Waste, LEED, and ISO 14001 and 20121. Whole Systems Hospitality is where that method, and the community around it, lives.'},

  {t:'recap',
   kicker:'In one line',
   big:'Three systems. One hotel. Run them together.',
   p:'People, planet, and performance are the same system. The hotels that treat them that way win the guest and the decade.',
   nodes:true},

  {t:'cta',
   kicker:'Your next step',
   h2:'Bring the whole-systems method into your property.',
   p:'If this is how you want your hotel to run, the next step is the Whole Systems Hospitality certification training, or a fractional engagement where we build the method into your team directly.',
   brand:'Whole Systems Hospitality',
   disclaimer:'Educational content only. No income, revenue, or results guarantees are made or implied. Outcomes vary by property, market, and execution.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.part) h+=`<div class="part">${s.part}</div>`;
  if(s.h1) h+=`<h1>${s.h1}</h1>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.pillar) h+=`<div class="pillar">${s.pillar}</div>`;
  if(s.big) h+=`<div class="big">${s.big}</div>`;
  if(s.lead) h+=`<p class="lead">${s.lead}</p>`;
  if(s.p) h+=`<p>${s.p}</p>`;
  if(s.ul){ h+='<ul>'; s.ul.forEach(li=>h+=`<li>${li}</li>`); h+='</ul>'; }
  if(s.nodes) h+='<div class="nodes"><span></span><span></span><span></span></div>';
  if(s.brand) h+=`<div class="brandline">${s.brand}</div>`;
  if(s.disclaimer) h+=`<div class="cta-note">${s.disclaimer}</div>`;
  h+=`<div class="count">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
