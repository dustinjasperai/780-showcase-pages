<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fearless Formula Masterclass | Henry Ammar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15181C;      /* from brand.json site_scheme: dark */
    --panel:#1E232A;
    --rule:#2C333C;
    --accent:#E8A43C;  /* warm resolute amber, derived from his bold dark-scheme impact brand */
    --ink:#F4F1EA;
    --muted:#A7AEB8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Montserrat",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:54px 48px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:"Antonio",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-size:15px;font-weight:600;margin-bottom:18px}
  h1{font-family:"Antonio",sans-serif;font-weight:700;font-size:64px;line-height:1.02;letter-spacing:.01em}
  h2{font-family:"Antonio",sans-serif;font-weight:700;font-size:44px;line-height:1.05;margin-bottom:14px}
  h3{font-family:"Antonio",sans-serif;font-weight:600;font-size:30px;line-height:1.1;margin-bottom:10px;color:var(--accent)}
  p{font-size:20px;color:var(--ink);max-width:62ch;margin-bottom:14px}
  p.lead{font-size:24px;color:var(--muted)}
  .promise{font-size:26px;color:var(--muted);margin-top:22px;max-width:60ch}
  .meta{margin-top:30px;font-family:"Antonio",sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:16px;color:var(--muted)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:21px;padding:10px 0 10px 30px;position:relative;max-width:64ch}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .step{font-family:"Antonio",sans-serif;color:var(--accent);font-size:20px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
  .pagenum{position:absolute;right:26px;bottom:18px;font-family:"Antonio",sans-serif;color:var(--rule);font-size:15px;letter-spacing:.1em}
  .disclaimer{margin-top:26px;font-size:14px;color:var(--muted);max-width:66ch;line-height:1.5}
  .cta-line{font-family:"Antonio",sans-serif;color:var(--accent);font-size:22px;letter-spacing:.06em;margin-top:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", eyebrow:"Live Masterclass with Henry Ammar", h1:"The Fearless Formula", promise:"The evidence based blueprint to go from fear to freedom.", meta:"Resolve the past. Master the present. Reprogram the future."},

  {t:"who", eyebrow:"Who this is for", h2:"You are already successful. You still feel capped.", lead:"This is for leaders, founders, and high performers who have done well on paper and know, quietly, that they are built for more.", bullets:["You hit the goal and the stuck feeling does not leave.","You are tired of settling for good enough.","You can feel a bigger version of your work that you have not stepped into yet."]},

  {t:"trap", eyebrow:"The trap", h2:"So you do the obvious thing. You push harder.", lead:"More hours. More discipline. Another system. And it works for a while, until the same ceiling shows up again, wearing a different outfit."},

  {t:"reframe", eyebrow:"The reframe", h2:"It is not your effort that is capping you.", lead:"It is the fear running underneath the decisions you keep almost making. Most leaders never name it, so they manage the symptoms instead of resolving the cause."},

  {t:"part", step:"Part One", h2:"The fears you never named", lead:"The real cost of leaving them in the dark."},

  {t:"point", eyebrow:"The core problem", h3:"Unseen fear writes your decisions", p:"The fears formed long before you led anything still sit in the room during your biggest calls. They show up as hesitation, over control, people pleasing, or the quiet no to the bigger opportunity.", bullets:["You call it being realistic. Often it is fear with a resume.","The pattern repeats because the root was never touched."]},

  {t:"point", eyebrow:"The core problem", h3:"Autopilot is a decade on repeat", p:"Left alone, the pattern does not just slow you down for a quarter. It quietly runs the same year, again, for ten and twenty years, while you tell yourself the timing is almost right."},

  {t:"part", step:"Part Two", h2:"The Fearless Formula", lead:"A three part process, built from 26 years of studying human behavior and the subconscious mind."},

  {t:"point", eyebrow:"Pillar one", h3:"Resolve the Past", p:"You cannot lead your future with power while you are still dragging the past into the room. The first move is to find and release the specific patterns and fears that are steering you without your permission."},

  {t:"point", eyebrow:"Pillar one, in practice", h3:"Clear the root, not the symptom", p:"This is not rehearsing the story one more time. It is a trauma informed, step by step process for releasing the psychological blocks underneath the behavior, so the pattern loses its grip instead of being managed forever."},

  {t:"point", eyebrow:"Pillar two", h3:"Master the Present", p:"Fearless is not the absence of fear. It is the ability to stay in command of yourself while it is present. You learn to regulate the state you lead from, on demand, in the exact moments that used to run you."},

  {t:"point", eyebrow:"Pillar two, in practice", h3:"Lead from a chosen state", p:"When your nervous system is no longer driving the meeting, the call, or the decision, your judgment comes back online. You respond from who you choose to be instead of reacting from an old script."},

  {t:"point", eyebrow:"Pillar three", h3:"Reprogram the Future", p:"Willpower fades. Reprogramming lasts. The final move is to reprogram the subconscious toward the future you actually want, using the same science of the mind, so the new way of leading becomes automatic."},

  {t:"point", eyebrow:"Pillar three, in practice", h3:"Make the new normal stick", p:"Real change is not a motivated weekend. It is an identity your mind defends on its own. This is where the shift stops being something you force and starts being who you are."},

  {t:"part", step:"Part Three", h2:"What fearless leadership looks like", lead:"When the formula is applied, the day to day changes."},

  {t:"point", eyebrow:"The after", h3:"The ceiling moves", p:"You make the bold call without the two week stall. You stop shrinking the vision to fit the fear. The confidence is not a performance. It is what is left when the inner blocks are gone.", bullets:["Decisions get cleaner and faster.","The impact you were built for stops being theoretical."]},

  {t:"point", eyebrow:"The method", h3:"A 4 step process you keep", p:"You do not leave with motivation. You leave with a repeatable, evidence based process you can run yourself any time you feel stuck again. That is the difference between a short term fix and a tool for life."},

  {t:"whyme", eyebrow:"Why learn this here", h3:"Henry Ammar", p:"26 plus years obsessively studying human behavior, the subconscious mind, and peak performance, synthesizing hypnosis, neuro linguistic programming, and neuroscience into simplified frameworks.", bullets:["Has guided executives, founders, and world changers through this exact work.","Host of the top ranked podcast Making It Happen, reaching audiences of tens of thousands."]},

  {t:"recap", eyebrow:"The formula, in one line", h2:"Resolve the past. Master the present. Reprogram the future.", lead:"Name the fear, take back command, and build the future on purpose instead of on autopilot."},

  {t:"cta", eyebrow:"Your next step", h2:"Go deeper than one masterclass can take you.", p:"If today opened something up, the next step is to do this work with me directly, in a room built for leaders who are serious about becoming fearless.", cta:"Apply to work with Henry inside the Inner Circle Experience.", disclaimer:"This masterclass is educational and is not therapy, medical, or mental health treatment. No specific financial, professional, or personal result is guaranteed. Results vary and depend on the individual and the work they do."}
];

const d = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide";
  let html = "";
  if (s.eyebrow) html += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.step) html += `<div class="step">${s.step}</div>`;
  if (s.h1) html += `<h1>${s.h1}</h1>`;
  if (s.h2) html += `<h2>${s.h2}</h2>`;
  if (s.h3) html += `<h3>${s.h3}</h3>`;
  if (s.promise) html += `<p class="promise">${s.promise}</p>`;
  if (s.lead) html += `<p class="lead">${s.lead}</p>`;
  if (s.p) html += `<p>${s.p}</p>`;
  if (s.bullets) html += "<ul>" + s.bullets.map(b => `<li>${b}</li>`).join("") + "</ul>";
  if (s.cta) html += `<div class="cta-line">${s.cta}</div>`;
  if (s.meta) html += `<div class="meta">${s.meta}</div>`;
  if (s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  html += `<div class="pagenum">${String(i + 1).padStart(2, "0")} / ${String(S.length).padStart(2, "0")}</div>`;
  el.innerHTML = html;
  d.appendChild(el);
});
</script>
</body>
</html>
