<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Mindful Frenectomy Provider | A Masterclass with Dr. Chelsea Pinto, DDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#f7f3ee;
    --panel:#fffdfa;
    --rule:#e4dccf;
    --ink:#2a2622;
    --ink-soft:#4f4842;
    --ink-muted:#8a7f74;
    --accent:#a85c54;
    --accent-soft:#c48f88;
  }
  html,body{height:100%;}
  body{
    font-family:'Hanken Grotesk',-apple-system,sans-serif;
    background:#ece5db;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:32px 16px;
  }
  .stage{ width:100%; max-width:960px; }
  .slide{
    position:relative;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    aspect-ratio:16/9;
    padding:64px 72px;
    display:none;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 20px 60px -30px rgba(42,38,34,.35);
  }
  .slide.active{ display:flex; }
  .kicker{
    font-family:'Hanken Grotesk',sans-serif; font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:.16em; color:var(--accent);
    display:flex; align-items:center; gap:12px; margin-bottom:26px;
  }
  .kicker::before{ content:""; width:28px; height:2px; background:var(--accent); display:inline-block; }
  h1{ font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:52px; line-height:1.08; letter-spacing:-.015em; color:var(--ink); max-width:16ch; }
  h2{ font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:38px; line-height:1.14; letter-spacing:-.01em; color:var(--ink); max-width:20ch; }
  .sub{ font-family:'Hanken Grotesk',sans-serif; font-size:21px; line-height:1.5; color:var(--ink-soft); margin-top:24px; max-width:40ch; font-weight:400; }
  .lead{ font-family:'Newsreader',Georgia,serif; font-size:30px; line-height:1.34; color:var(--ink); max-width:24ch; font-weight:500; }
  .lead .em{ color:var(--accent); }
  .body{ font-size:20px; line-height:1.55; color:var(--ink-soft); max-width:44ch; margin-top:8px; }
  .meta{ margin-top:auto; font-family:'Hanken Grotesk',sans-serif; font-size:16px; color:var(--ink-muted); }
  .meta strong{ color:var(--ink); font-weight:600; }
  ul.points{ list-style:none; margin-top:14px; display:flex; flex-direction:column; gap:16px; max-width:42ch; }
  ul.points li{ font-size:19px; line-height:1.45; color:var(--ink-soft); padding-left:26px; position:relative; }
  ul.points li::before{ content:""; position:absolute; left:0; top:11px; width:9px; height:9px; border-radius:50%; background:var(--accent-soft); }
  ul.points li strong{ color:var(--ink); font-weight:600; }
  .pillar-no{ font-family:'Newsreader',serif; font-size:17px; font-weight:600; color:var(--accent); letter-spacing:.04em; }
  .quote{ font-family:'Newsreader',Georgia,serif; font-size:34px; line-height:1.3; color:var(--ink); max-width:26ch; font-weight:500; }
  .quote .em{ color:var(--accent); }
  .credit{ margin-top:22px; font-family:'Hanken Grotesk',sans-serif; font-size:16px; color:var(--ink-muted); }
  .cta h2{ font-size:44px; }
  .cta .step{ display:flex; gap:14px; align-items:baseline; margin-top:18px; font-size:20px; color:var(--ink-soft); max-width:42ch; }
  .cta .step span{ color:var(--accent); font-weight:700; font-family:'Newsreader',serif; }
  .disclaimer{ margin-top:auto; font-family:'Hanken Grotesk',sans-serif; font-size:13px; line-height:1.45; color:var(--ink-muted); max-width:62ch; border-top:1px solid var(--rule); padding-top:16px; }
  .brandline{ position:absolute; top:28px; right:40px; font-family:'Hanken Grotesk',sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-muted); }
  .nav{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; font-family:'Hanken Grotesk',sans-serif; color:var(--ink-muted); font-size:14px; }
  .nav button{ font-family:inherit; font-size:14px; color:var(--ink); background:var(--panel); border:1px solid var(--rule); border-radius:8px; padding:9px 18px; cursor:pointer; }
  .nav button:hover{ border-color:var(--accent); color:var(--accent); }
  .count{ letter-spacing:.08em; }
  @media (max-width:720px){
    .slide{ padding:36px 32px; }
    h1{ font-size:34px; } h2{ font-size:27px; } .lead,.quote{ font-size:23px; } .sub{ font-size:17px; } .body{ font-size:16px; }
    ul.points li{ font-size:16px; } .brandline{ right:20px; top:18px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div id="deck"></div>
  <div class="nav">
    <button id="prev">&larr; Prev</button>
    <div class="count"><span id="cur">1</span> / <span id="tot">0</span></div>
    <button id="next">Next &rarr;</button>
  </div>
</div>
<script>
const S = [
  {t:'title',
    kicker:'A Live Masterclass for Providers',
    h1:'The Mindful Frenectomy Provider',
    sub:'How to assess infant tongue and lip ties with confidence, and know when not to pick up the laser.',
    meta:'With <strong>Dr. Chelsea Pinto, DDS, CLC</strong> &nbsp;&middot;&nbsp; Founder, the Infant Frenectomy Protocol' },

  {t:'promise',
    kicker:'What this hour gives you',
    lead:'Leave able to tell a <span class="em">true functional tie</span> from normal anatomy, and to defend either decision to the family in front of you.',
    body:'No homework, no sales pitch for a scalpel. Just the assessment thinking that medical and dental school never taught you.' },

  {t:'audience',
    kicker:'Who this is for',
    h2:'Any provider in infant and toddler oral function.',
    points:[
      '<strong>Dentists, DMDs and physicians (ENT)</strong> adding frenectomy to their practice, or rethinking how they already do it.',
      '<strong>IBCLCs, OTs, PTs, SLPs and bodyworkers</strong> who refer for release and want to refer well.',
      '<strong>New and established providers alike.</strong> No prerequisites, and no assumption you were taught this properly.'
    ] },

  {t:'trap',
    kicker:'The world you practice in',
    h2:'The field split in two, and left you in the middle.',
    body:'One camp releases every baby it sees. The other calls the whole thing a fad. You are left afraid of both mistakes at once: cutting a tie that was never there, and missing one that was.',
    meta:'Both camps are loud. Neither one is teaching you how to decide.' },

  {t:'hook',
    kicker:'The reframe',
    quote:'The most skilled thing you can do is often <span class="em">not pick up the laser.</span>',
    credit:'There are days I do not reach for my surgical laser a single time. That restraint is the skill, not the absence of one.' },

  {t:'part', no:'Part One', h2:'Why the controversy exists.',
    body:'Infant tongue tie assessment is not properly covered in medical school or dental school. So providers fill the gap two ways, both from lack of training: overdiagnosis and overtreatment, or dismissal and missed cases.' },

  {t:'points-slide',
    kicker:'Part One',
    h2:'The real problem is not the procedure. It is the assessment.',
    points:[
      'True ties affect roughly <strong>5 to 10% of babies</strong>, yet some providers surgically treat nearly every one they see. That is the red flag.',
      '<strong>Honoring normalcy</strong> is a clinical skill: most frenula are normal tissue and need nothing.',
      'A frenectomy is warranted only with a <strong>true functional need</strong>, feeding, not the appearance of the tissue.'
    ] },

  {t:'part', no:'Part Two', h2:'The Infant Frenectomy Protocol.',
    body:'A research-backed, mindfulness-based approach to assess and treat infant and toddler tongue and lip ties: anatomically and physiologically guided care, built on four pillars.' },

  {t:'pillar', no:'Pillar One', h2:'Mindful assessment.',
    body:'A structured classification and functional exam that tells you when intervention is needed, and just as often, when it is not. Intentional case selection is where good outcomes begin.' },

  {t:'pillar', no:'Pillar Two', h2:'Collaborative, family-centered care.',
    body:'You are one seat at the table with lactation, OT and PT, chiropractic and craniosacral work, and speech. Referring before you release keeps families informed and empowered, never overwhelmed.' },

  {t:'pillar', no:'Pillar Three', h2:'Comfort-focused technique.',
    body:'When a release is truly indicated: CO2 laser technique, minimal invasiveness, and a calm, comfort-first room. Done properly, the procedure is minimal and supports feeding, sleep and digestion.' },

  {t:'pillar', no:'Pillar Four', h2:'Mindful post-op and healing.',
    body:'Wound healing and mindful post-op care, supported by photobiomodulation (PBM) light therapy. The work does not end when the laser switches off; recovery is part of the protocol.' },

  {t:'part', no:'Part Three', h2:'A real day in a mindful practice.',
    body:'A schedule of careful assessments and only a few true releases. Families who leave understanding what you found and why. A practice known for getting it right, not for getting it done.' },

  {t:'points-slide',
    kicker:'Why it compounds',
    h2:'Accurate assessment is also how you are trusted.',
    points:[
      'Overtreatment burns the trust of families and referring colleagues.',
      'Missed ties harm babies who genuinely needed help.',
      '<strong>Both failures come from the same gap:</strong> no training in how to assess. Close the gap and you become the provider other providers send families to.'
    ] },

  {t:'evidence',
    kicker:'This is evidence-based',
    h2:'Grounded in the literature, not opinion.',
    body:'The protocol leans on current research, including the Cordray et al. (2023) meta-analysis of 39 high-quality studies on tongue-tie release, and the published literature supporting the PBM wavelengths used in practice.',
    meta:'Curious, authentic, and willing to collaborate. That is what the research rewards.' },

  {t:'whyme',
    kicker:'Why learn this from me',
    h2:'Dr. Chelsea Pinto, DDS, CLC',
    points:[
      'DDS, USC Ostrow School of Dentistry, with a post-graduate general residency; Certified Lactation Counselor.',
      'Ten years and thousands of infants assessed and treated in infant-toddler oral function.',
      'Founder of the Infant Frenectomy Protocol and an internationally recognized speaker on this exact question.'
    ] },

  {t:'quote-slide',
    kicker:'The belief underneath it all',
    quote:'<span class="em">Conservative care is not a limitation.</span> It is a commitment to doing right by every baby and every family that walks through the door.',
    credit:'Dr. Chelsea Pinto' },

  {t:'cta',
    kicker:'From curious to confident',
    h2:'Become the informed, mindful, trusted provider in your area.',
    steps:[
      ['1','Join the Infant Frenectomy Protocol Course: 23 modules, 27 hours, 5.5 hours of virtual shadowing, 5-year access.'],
      ['2','Want it tailored to your cases? Book a 1:1 mentorship call and we map it to your practice.']
    ],
    disclaimer:'Educational content for licensed and training healthcare providers. This masterclass is for professional education only and is not medical, clinical, or business advice, and does not establish a provider-patient or supervisory relationship. Clinical outcomes depend on each patient, each provider, and individual case factors; no specific result is promised or guaranteed. Follow your own scope of practice, licensure, and local regulations.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'slide' + (i===0 ? ' active':'') + (s.t==='cta'?' cta':'');
  let html = '<div class="brandline">Infant Frenectomy Protocol</div>';
  if(s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){ html += '<h1>'+s.h1+'</h1><div class="sub">'+s.sub+'</div><div class="meta">'+s.meta+'</div>'; }
  else if(s.t==='promise'){ html += '<div class="lead">'+s.lead+'</div><div class="body">'+s.body+'</div>'; }
  else if(s.t==='hook'){ html += '<div class="quote">'+s.quote+'</div><div class="credit">'+s.credit+'</div>'; }
  else if(s.t==='quote-slide'){ html += '<div class="quote">'+s.quote+'</div><div class="credit">'+s.credit+'</div>'; }
  else if(s.t==='part'||s.t==='pillar'){ if(s.no) html += '<div class="pillar-no">'+s.no+'</div>'; html += '<h2>'+s.h2+'</h2><div class="body">'+s.body+'</div>'; }
  else if(s.t==='cta'){
    html += '<h2>'+s.h2+'</h2>';
    s.steps.forEach(st=>{ html += '<div class="step"><span>'+st[0]+'</span><div>'+st[1]+'</div></div>'; });
    html += '<div class="disclaimer">'+s.disclaimer+'</div>';
  }
  else { if(s.h2) html += '<h2>'+s.h2+'</h2>'; if(s.body) html += '<div class="body">'+s.body+'</div>';
    if(s.points){ html += '<ul class="points">'; s.points.forEach(p=> html += '<li>'+p+'</li>'); html += '</ul>'; }
    if(s.meta) html += '<div class="meta">'+s.meta+'</div>'; }
  d.innerHTML = html;
  deck.appendChild(d);
});
let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
document.getElementById('tot').textContent = slides.length;
function go(n){ slides[cur].classList.remove('active'); cur=(n+slides.length)%slides.length; slides[cur].classList.add('active'); document.getElementById('cur').textContent=cur+1; }
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(cur+1); if(e.key==='ArrowLeft')go(cur-1); });
</script>
</body>
</html>
