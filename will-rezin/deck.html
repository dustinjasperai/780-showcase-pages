<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What To Do When Trauma Shows Up In the Room — Trauma and Somatics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1; --panel:#eceae3; --ink:#171b26; --muted:#5b6472; --rule:#94a3b8;
    --accent:#047857; --accent2:#3c977e;
    --head:'Newsreader',Georgia,serif; --body:'Plus Jakarta Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--bg);border:1px solid #e2e0d8;border-radius:16px;padding:54px 58px;margin:0 0 22px;
    min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--rule);font-weight:600}
  .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:500;font-size:clamp(34px,5vw,58px);line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:500;font-size:clamp(28px,3.6vw,42px);line-height:1.12;letter-spacing:-.01em}
  .sub{font-size:clamp(17px,1.9vw,21px);color:var(--muted);margin-top:20px;max-width:40ch;line-height:1.5}
  .lead{font-size:clamp(19px,2.1vw,24px);line-height:1.5;max-width:46ch;margin-top:8px}
  .part{font-family:var(--head);font-size:clamp(15px,1.6vw,18px);letter-spacing:.04em;color:var(--accent);font-weight:600}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:52ch}
  li{position:relative;padding-left:30px;font-size:clamp(16px,1.7vw,19px);line-height:1.45}
  li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px rgba(4,120,87,.12)}
  li b{font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
  .tile{background:var(--panel);border:1px solid #e2e0d8;border-radius:12px;padding:20px 22px}
  .tile .t{font-family:var(--head);font-size:20px;color:var(--accent);margin-bottom:6px}
  .tile .d{font-size:15px;color:var(--muted);line-height:1.4}
  .big{font-family:var(--head);font-size:clamp(30px,4vw,48px);line-height:1.1;max-width:22ch}
  .accentword{color:var(--accent)}
  .cred{margin-top:24px;display:grid;gap:10px;max-width:50ch}
  .cred div{font-size:clamp(15px,1.7vw,18px);line-height:1.45}
  .cta-box{margin-top:26px;background:var(--ink);color:#f6f5f1;border-radius:12px;padding:22px 26px;max-width:46ch}
  .cta-box .go{font-family:var(--head);font-size:22px;color:#6ee7b7}
  .disc{margin-top:22px;font-size:13px;color:var(--muted);line-height:1.5;max-width:60ch}
  .brandline{position:absolute;bottom:22px;left:58px;font-size:12px;letter-spacing:.14em;color:var(--rule);font-weight:600;text-transform:uppercase}
  @media(max-width:640px){.slide{padding:38px 26px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', kick:'A LIVE MASTERCLASS WITH WILL REZIN',
    h:"What To Do When Trauma Shows Up In the Room",
    sub:"The somatic skills experienced coaches are missing. Not what trauma is. What to do when it walks into your session."},

  {t:'who', kick:'Who this is for',
    h:"You guide people for a living.",
    lead:"Coaches, facilitators and leaders who already hold real conversations. You are not a therapist, and you do not want to be one. You just want to know what to do when the body takes over the room."},

  {t:'trap', kick:'The trap',
    h:"You know the theory. You freeze when it is live.",
    lead:"You have read about the nervous system. Then a client goes blank, or floods, or gets very still, and the frameworks go quiet right when you need them most."},

  {t:'hook', kick:'The reframe',
    big:"Trauma already shows up in your sessions. You just do not have the language for it yet."},

  {t:'part', part:'PART ONE', h:"Why understanding is not enough"},

  {t:'problem', kick:'The core problem',
    h:"A client goes quiet. The session stops.",
    lead:"Most coaches talk to fill the silence, or push for insight. Both pull the client further out of their body. The skill is not another question. It is knowing what the quiet is, and what it needs."},

  {t:'part', part:'PART TWO', h:"The container comes first"},

  {t:'pillars', kick:'The container',
    h:"Safety, Belonging, Dignity",
    list:["<b>Safety</b>, so the nervous system can stop bracing and actually settle.",
          "<b>Belonging</b>, so the client does not have to perform or manage you.",
          "<b>Dignity</b>, so nothing that surfaces is treated as a problem to fix.",
          "Before any technique, you build the conditions. The container is the method."]},

  {t:'map', kick:'Read states, not stories',
    h:"The nervous system has a map.",
    list:["<b>Ventral</b>, <b>Sympathetic</b>, <b>Dorsal</b>: the three states a client moves between, moment to moment.",
          "<b>Neuroception</b>: the body decides safe or unsafe before the mind does.",
          "<b>Co-regulation</b>: your regulated system is the fastest way their system finds the ground.",
          "You learn to read the state in the room, not just the story being told."]},

  {t:'responses', kick:'The four survival responses',
    h:"Fight, Flight, Freeze, Fawn.",
    grid:[["Fight","needs a boundary held, firmly and kindly."],
          ["Flight","needs an exit and something to orient toward."],
          ["Freeze","needs slow, grounded contact, no pushing."],
          ["Fawn","needs permission to have a need at all."]]},

  {t:'part', part:'PART THREE', h:"The practitioner's toolkit"},

  {t:'awareness', kick:'Awareness comes first',
    h:"See it before you try to shift it.",
    list:["<b>Tracking</b>: following the small signals, breath, posture, pace, color.",
          "<b>Attunement</b>: staying with the client's experience instead of your agenda.",
          "<b>Window of Tolerance</b>: telling, live, whether a client is learning or overwhelmed."]},

  {t:'action', kick:'Then action',
    h:"A few moves, used well.",
    list:["<b>Resourcing</b>: helping the body find what already steadies it.",
          "<b>Grounding, Self-Contact, Orienting</b>: simple somatic moves that bring a client back.",
          "You do not need fifty techniques. You need a handful you can trust under pressure."]},

  {t:'self', kick:'Your own system',
    h:"Stay regulated while they do not.",
    lead:"The hardest skill is not for the client. It is staying grounded while someone dysregulates in front of you. Polyvagal mapping, turned inward, so you are the steady thing in the room."},

  {t:'session', kick:'The quiet, revisited',
    h:"The same moment, handled.",
    lead:"The client goes quiet. This time you notice the shift, soften your pace, name nothing, offer ground. The session does not stop. It deepens. That is the whole difference, and it is a learnable skill."},

  {t:'why', kick:'Why learn this from me',
    h:"I have spent a decade teaching exactly this.",
    cred:["Somatic Experiencing Practitioner and Certified Professional Coach, trained in Peter Levine's work and Stanley Keleman's formative psychology.",
          "Over 500 practitioners trained across 28 countries since 2020.",
          "The advanced work, Attachment and Somatics, is co-developed with Kate Appleton, a Licensed Professional Counselor with 50 years of clinical experience."]},

  {t:'what', kick:'The full training',
    h:"The Trauma and Somatics Certificate.",
    list:["12 weeks, live. Ten group classes on Zoom, Tuesdays, plus six self-paced modules.",
          "Experiential, with live demonstration and supervision on your real client work.",
          "You leave able to recognize trauma, read the body, and know what to do when it shows up."]},

  {t:'cta', kick:'Your next step',
    h:"Join the next live cohort.",
    lead:"If you want the full, certified version of what we practiced today, book a call and we will see if it is the right fit for your work.",
    go:"Book a call for the Trauma and Somatics Certificate",
    disc:"This masterclass is professional education for coaches and facilitators. It is not therapy, diagnosis, or clinical treatment, and it is not a substitute for care from a licensed professional. No income or result is guaranteed. Results vary and depend on your own practice and context."}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var deck=document.getElementById('deck');
S.forEach(function(s,i){
  var sl=el('div','slide');
  sl.appendChild(el('div','num',(i+1)+' / '+S.length));
  if(s.kick) sl.appendChild(el('div','kick',s.kick));
  if(s.part) sl.appendChild(el('div','part',s.part));
  if(s.h) sl.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));
  if(s.sub) sl.appendChild(el('div','sub',s.sub));
  if(s.big) sl.appendChild(el('div','big',s.big));
  if(s.lead) sl.appendChild(el('div','lead',s.lead));
  if(s.list){var ul=el('ul');s.list.forEach(function(x){ul.appendChild(el('li',null,x));});sl.appendChild(ul);}
  if(s.grid){var g=el('div','grid2');s.grid.forEach(function(p){var t=el('div','tile');t.appendChild(el('div','t',p[0]));t.appendChild(el('div','d',p[1]));g.appendChild(t);});sl.appendChild(g);}
  if(s.cred){var c=el('div','cred');s.cred.forEach(function(x){c.appendChild(el('div',null,x));});sl.appendChild(c);}
  if(s.go){var b=el('div','cta-box');b.appendChild(el('div','go',s.go));sl.appendChild(b);}
  if(s.disc) sl.appendChild(el('div','disc',s.disc));
  sl.appendChild(el('div','brandline','Trauma and Somatics'));
  deck.appendChild(sl);
});
</script>
</body>
</html>
