<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Brilliant Jerk to Inspiring Leader - Dr. Katrina Burrus, PhD, MCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe8; --panel:#ffffff; --panel-2:#ece5d8;
    --ink:#262321; --muted:#6b6560; --rule:#d9d2c6;
    --accent:#12616b; --deep:#0c474e;
    --head:'Spectral',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 64px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:52px 52px;margin:18px 0;min-height:480px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:600;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.12;letter-spacing:-.01em}
  .sub{font-family:var(--head);font-style:italic;font-size:21px;color:var(--muted);margin-top:18px;max-width:34em}
  p.body{font-size:19px;color:var(--ink);margin-top:16px;max-width:36em}
  .note{font-size:17px;color:var(--muted);margin-top:14px;max-width:36em}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px}
  li{font-size:19px;padding-left:28px;position:relative;max-width:36em}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .big{font-family:var(--head);font-weight:500;font-size:40px;line-height:1.14;letter-spacing:-.01em;max-width:20em}
  .big .a{color:var(--accent)}
  .cols{display:flex;gap:18px;margin-top:26px;flex-wrap:wrap}
  .col{flex:1 1 240px;background:var(--panel-2);border-radius:10px;padding:22px}
  .col h3{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .col p{font-size:17px}
  .num{font-family:var(--head);font-size:15px;color:var(--accent);font-weight:600;letter-spacing:.12em;margin-bottom:10px}
  .credit{font-size:17px;color:var(--muted);margin-top:22px}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;border-top:1px solid var(--rule);padding-top:16px;max-width:40em}
  .cta-btn{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;padding:14px 26px;border-radius:9px;text-decoration:none}
  .pageno{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:'A LIVE MASTERCLASS',
    h:'From Brilliant Jerk to Inspiring Leader',
    sub:'Turning your most talented, most difficult people into the ones everyone wants to follow.',
    note:'With Dr. Katrina Burrus, PhD, MCC. Switzerland’s first ICF Master Certified Coach.' },

  {t:'who',
    kick:'Who this hour is for',
    h:'You lead, or you manage, someone brilliant and hard to work with.',
    list:['A team leader or founder with an A-player who leaves damage behind them',
          'An executive who senses people have gone quiet around them',
          'An HR or people leader weighing whether to coach or to let them go',
          'The talented, difficult performer who already knows, and wants to change'] },

  {t:'reframe',
    kick:'The trap',
    big:'You think you have two options. Fix them until they resist, or move them out and lose the brilliance. Both cost you the thing you hired them for.' },

  {t:'reframe',
    kick:'The reframe',
    big:'A brilliant jerk is not a broken person. They are a <span class="a">coachable one.</span>' },

  {t:'part',
    num:'PART ONE',
    h:'What a brilliant jerk actually is',
    note:'Name it precisely and it stops being a personality verdict and starts being a pattern you can work with.' },

  {t:'pillar',
    num:'THE DEFINITION',
    h:'Competent, successful, and experienced as abrasive.',
    body:'What separates a brilliant jerk from a plain one is results. They have earned real success, so the behaviour gets tolerated, and the cost stays hidden in plain sight.' },

  {t:'pillar',
    num:'WHERE IT COMES FROM',
    h:'The ego is attached to results, recognition and being right.',
    body:'That drive is often set early in life. This is not an excuse for the behaviour. It is the lever, because it tells you exactly what the person is really trying to protect.' },

  {t:'pillar',
    num:'THE HIDDEN COST',
    h:'The room goes quiet, and the best people leave first.',
    body:'People stop challenging them, so the decisions get worse. Your strongest colleagues have the most options, so they are the ones who walk. The brilliance ends up trapped inside one person.' },

  {t:'part',
    num:'PART TWO',
    h:'The strengths-based turn',
    note:'My method does not try to sand the person down. It redirects the same drive toward the one thing that gives them more of what they want: people who choose to follow.' },

  {t:'pillar',
    num:'PRINCIPLE 1',
    h:'Build on the strengths, not the list of faults.',
    body:'Start from what makes them formidable. You redirect the drive, you do not try to break it. A leader who feels attacked defends; a leader who feels seen moves.' },

  {t:'pillar',
    num:'PRINCIPLE 2',
    h:'Make the wake visible.',
    body:'Brilliant jerks rarely see the impact they leave behind. Coaching holds up the mirror using their own goals, so the feedback lands as useful data instead of as judgement.' },

  {t:'pillar',
    num:'PRINCIPLE 3',
    h:'Attach the change to what they already want.',
    body:'Tie new behaviour to results, recognition and influence, the things they chase anyway. Followership is not a soft ask once they see it gets them more of all three.' },

  {t:'pillar',
    num:'PRINCIPLE 4',
    h:'Engaged followership is the real measure.',
    body:'The goal is not a quieter person. It is a leader people choose to follow, not merely comply with. That is the shift that keeps the talent and heals the team at the same time.' },

  {t:'cols',
    kick:'The method, in one view',
    h:'From friction to followership',
    cols:[['NAME THE PATTERN','Describe the behaviour as a pattern with a payoff, never as a character flaw.'],
          ['MIRROR THE IMPACT','Show the wake, measured against their own stated goals.'],
          ['REDIRECT THE DRIVE','Point the same energy at earning followership, not control.'],
          ['HOLD THE LINE','Keep the accountability specific, visible and theirs to own.']] },

  {t:'part',
    num:'PART THREE',
    h:'What it looks like in ninety days',
    note:'This is what leaders and their teams tend to notice when the turn takes hold. Every situation differs.' },

  {t:'pillar',
    num:'THE PICTURE',
    h:'The meeting changes first.',
    body:'People start speaking up again because the cost of doing so has dropped. The leader keeps the standards and the edge, and begins to spend that edge on the team instead of on the room.' },

  {t:'reframe',
    kick:'The one question',
    big:'Before you decide what to do with your brilliant jerk, ask what their drive is actually trying to get. Almost always, it is to matter.' },

  {t:'credit',
    kick:'Why listen to me on this',
    h:'Dr. Katrina Burrus, PhD, MCC',
    credit:'Switzerland’s first ICF Master Certified Coach. Thirty years coaching the C-suite of Nestlé, Novartis, UBS, CERN, UNAIDS and the United Nations. Author of Managing Brilliant Jerks and Global Nomadic Leaders, and host of the Excellent Executive Coaching podcast.' },

  {t:'who',
    kick:'Take these three with you',
    h:'If you remember nothing else',
    list:['A brilliant jerk is a coachable pattern, not a fixed verdict',
          'You redirect the drive toward followership, you do not break it',
          'The measure of success is people who choose to follow, and A-players who stay'] },

  {t:'cta',
    kick:'Bring me your hardest case',
    h:'Bring the hardest case in your organisation.',
    body:'If you lead someone brilliant and difficult, or you are that leader, book a confidential executive coaching consultation with me and we will map the first ninety days together.',
    btn:'Book a consultation with Dr. Burrus',
    disc:'This masterclass is educational and reflects one coach’s professional experience. No income, outcome, promotion or result is guaranteed. Results vary by leader and organisation.' }
];

function esc(s){return s;}
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.num) html += '<div class="num">'+s.num+'</div>';
  if(s.t==='title'){
    html += '<h1>'+s.h+'</h1>';
    if(s.sub) html += '<div class="sub">'+s.sub+'</div>';
    if(s.note) html += '<p class="note">'+s.note+'</p>';
  } else if(s.t==='reframe'){
    html += '<div class="big">'+s.big+'</div>';
  } else if(s.t==='cols'){
    if(s.h) html += '<h2>'+s.h+'</h2>';
    html += '<div class="cols">';
    s.cols.forEach(c=>{ html += '<div class="col"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div>'; });
    html += '</div>';
  } else if(s.t==='credit'){
    html += '<h2>'+s.h+'</h2><p class="credit">'+s.credit+'</p>';
  } else if(s.t==='cta'){
    html += '<h2>'+s.h+'</h2>';
    if(s.body) html += '<p class="body">'+s.body+'</p>';
    if(s.btn) html += '<a class="cta-btn" href="https://mkbconseil.ch/">'+s.btn+'</a>';
    if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  } else {
    if(s.h && (s.t==='part')) html += '<h2>'+s.h+'</h2>';
    else if(s.h) html += '<h2>'+s.h+'</h2>';
    if(s.body) html += '<p class="body">'+s.body+'</p>';
    if(s.note) html += '<p class="note">'+s.note+'</p>';
    if(s.list){ html += '<ul>'; s.list.forEach(x=>{ html += '<li>'+x+'</li>'; }); html += '</ul>'; }
  }
  html += '<div class="pageno">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
