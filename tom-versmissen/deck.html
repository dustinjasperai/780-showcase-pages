<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Become a Job-Ready Creative Strategist - Creative Strategy Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#f6f4f0;      /* CSC warm off-white ground (2nd harvested warm tint) */
    --panel:#ffffff;   /* CSC card */
    --rule:#e2e8f0;    /* CSC slate divider */
    --ink:#0f172b;     /* CSC near-black heading slate */
    --muted:#6a7282;   /* CSC muted slate */
    --accent:#f99c00;  /* CSC custom amber */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:64px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 2px rgba(15,23,43,.04)}
  .kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  h2{font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-.015em}
  .sub{font-size:21px;font-weight:500;color:var(--muted);margin-top:20px;max-width:30ch;line-height:1.4}
  .big{font-size:30px;font-weight:600;line-height:1.3;max-width:24ch}
  .big .a{color:var(--accent)}
  p.body{font-size:20px;font-weight:500;color:var(--ink);line-height:1.5;margin-top:18px;max-width:40ch}
  ul{margin-top:26px;list-style:none;display:flex;flex-direction:column;gap:16px}
  li{font-size:20px;font-weight:600;line-height:1.35;padding-left:34px;position:relative}
  li:before{content:"";position:absolute;left:0;top:9px;width:14px;height:14px;border-radius:4px;background:var(--accent)}
  li span{display:block;font-weight:500;color:var(--muted);font-size:17px;margin-top:4px}
  .num{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.1em}
  .ladder{display:flex;flex-direction:column;gap:14px;margin-top:28px}
  .rung{border:1px solid var(--rule);border-radius:12px;padding:20px 24px}
  .rung b{font-size:22px;font-weight:800}
  .rung em{display:block;font-style:normal;color:var(--muted);font-size:17px;font-weight:500;margin-top:4px}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;margin-top:28px;max-width:56ch;font-weight:500}
  .cta-line{font-size:24px;font-weight:700;margin-top:18px;color:var(--accent)}
  .pageno{font-size:12px;color:var(--muted);text-align:right;margin-top:40px;font-weight:600;letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', k:'Creative Strategy Club', h:'Become a Job-Ready Creative Strategist', sub:'Learn the craft, build your career, and operate alongside working strategists at every level.'},
  {t:'promise', k:'What you will leave with', h:'The craft that makes you hireable', body:'Not another tactic dump. By the end you will see the exact three moves a working creative strategist makes, and where your first opportunity comes from.'},
  {t:'who', k:'Who this is for', h:'Three people in one room', items:[
    {b:'Beginners', s:'You want your first creative strategy opportunity.'},
    {b:'Working strategists', s:'You want to get exceptional at the craft and accelerate.'},
    {b:'Operators', s:'You want sharper peers and a higher level to play at.'}
  ]},
  {t:'trap', k:'The trap', h:'You have watched a thousand ads.', body:'You can tell which ones are good. You still freeze when it is your turn to make one. Watching is not the craft.'},
  {t:'reframe', k:'The hard truth', big:'A certificate does not make you hireable. The <span class="a">craft</span> does.'},
  {t:'part', num:'PART ONE', h:'The core problem'},
  {t:'body', k:'Why most people stall', h:'Tactics without a craft', body:'Most training teaches hooks and formats in isolation, so you collect tips you cannot apply. A creative strategist is hired for a repeatable way of thinking, not a folder of swipe files.'},
  {t:'part', num:'PART TWO', h:'The craft, in three moves'},
  {t:'pillar', num:'MOVE 01', h:'Understand customers', body:'Find the insight beneath the click. Who the customer really is, what they already believe, and what would actually move them. The insight is where every good ad starts.'},
  {t:'pillar', num:'MOVE 02', h:'Build better concepts', body:'Turn research into briefs, hooks, and angles. Convert the raw insight into testable creative a brand can put into production, not a vague idea.'},
  {t:'pillar', num:'MOVE 03', h:'Improve performance', body:'Read the results, learn fast, and sharpen the next test. Hear what the numbers are telling you and feed each learning back into the next round of creative.'},
  {t:'body', k:'How they connect', h:'It is a loop, not a checklist', body:'Insight feeds concepts, concepts get tested, results sharpen the next insight. Run the loop well and you get better every single week. That is the whole job.'},
  {t:'part', num:'PART THREE', h:'From beginner to placed'},
  {t:'ladder', k:'A real career path', h:'Three stages, one craft', ladder:[
    {b:'Academy', e:'Become job-ready and pursue your first opportunity.'},
    {b:'Operators', e:'Become exceptional at the craft and accelerate your career.'},
    {b:'Elite', e:'Exceptional peers, insight, and talent. Qualification only.'}
  ]},
  {t:'who', k:'Inside the Academy', h:'How you actually get job-ready', items:[
    {b:'The Fundamentals Course', s:'The craft, taught in order, from insight to test.'},
    {b:'Weekly group calls and feedback', s:'Real eyes on your real work, every week.'},
    {b:'A portfolio and a community', s:'Proof you can do the work, and strategists to do it beside.'}
  ]},
  {t:'body', k:'The outcome', h:'Job-ready, placed, and still leveling up', body:'This is how someone goes from watching ads to landing a role. One member, Bram, landed an in-house role at a skincare brand. The craft travels with you after that.'},
  {t:'why', k:'Why Creative Strategy Club', h:'Built by people doing the work', body:'CSC was founded by Tom Versmissen after building ecommerce businesses and seeing how central creative strategy had become to growth. It is led by working strategists, Felicia, Nina, and Bart among them, not lecturers.'},
  {t:'recap', k:'Remember this', h:'Three moves', items:[
    {b:'Understand', s:'Find the insight beneath the click.'},
    {b:'Build', s:'Turn research into briefs, hooks, and angles.'},
    {b:'Improve', s:'Read results, learn fast, sharpen the next test.'}
  ]},
  {t:'cta', k:'Your next step', h:'Find your level and start', cta:'Join the Academy at Creative Strategy Club', disc:'Educational content only. No income, placement, or result is guaranteed. Outcomes vary by effort, experience, and market. Bram’s role is one member’s experience, not a promise.'}
];
function esc(x){return x;}
function render(){
  const d=document.getElementById('deck');
  S.forEach(function(s,i){
    const el=document.createElement('section');el.className='slide';
    let html='';
    if(s.k) html+='<div class="kicker">'+s.k+'</div>';
    if(s.num) html+='<div class="num">'+s.num+'</div>';
    if(s.t==='title'){html+='<h1>'+s.h+'</h1>';if(s.sub)html+='<div class="sub">'+s.sub+'</div>';}
    else if(s.t==='reframe'){html+='<div class="big">'+s.big+'</div>';}
    else if(s.t==='part'){html+='<h2>'+s.h+'</h2>';}
    else if(s.t==='cta'){html+='<h2>'+s.h+'</h2>';html+='<div class="cta-line">'+s.cta+'</div>';html+='<div class="disc">'+s.disc+'</div>';}
    else{html+='<h2>'+s.h+'</h2>';}
    if(s.body) html+='<p class="body">'+s.body+'</p>';
    if(s.items){html+='<ul>';s.items.forEach(function(it){html+='<li>'+it.b+'<span>'+it.s+'</span></li>';});html+='</ul>';}
    if(s.ladder){html+='<div class="ladder">';s.ladder.forEach(function(r){html+='<div class="rung"><b>'+r.b+'</b><em>'+r.e+'</em></div>';});html+='</div>';}
    html+='<div class="pageno">CREATIVE STRATEGY CLUB  /  '+(i+1)+' of '+S.length+'</div>';
    el.innerHTML=html;d.appendChild(el);
  });
}
render();
</script>
</body>
</html>
