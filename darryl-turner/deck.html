<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Leader's Life Masterclass · Darryl Turner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f9fb; --panel:#eaeef3; --rule:#d7dee6;
    --accent:#3e506d; --accent2:#0073e5; --ink:#23282e; --grey:#565f6b; --dim:#8b95a3;
  }
  html,body{height:100%}
  body{background:#12161c;font-family:'Source Sans Pro',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#12161c}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);margin-bottom:2.4vh}
  h1{font-family:'Merriweather',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.18;letter-spacing:-.005em}
  .t-title h1{font-size:4.3vw}
  .t-normal h1{font-size:2.9vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-size:1.7vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Source Sans Pro',sans-serif;font-size:1.4vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.1vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent2),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#2c3a52 0%,#141c2a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:2.9vw;max-width:80%;font-style:italic;color:#eef1f6;font-weight:400;font-family:'Merriweather',Georgia,serif}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1f2a3d 0%,#12161c 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.5vw;max-width:82%;color:#f3f5f8}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent2);color:#cfe0f7;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#9aa4b3}
  .t-title .disc,.t-normal .disc{text-align:left}
  .step-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-step{right:7.5%;bottom:9%;width:19vw}
  .corner-step{right:6%;bottom:7.5%;width:8.5vw;opacity:.35}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent2);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#aab4c4;z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#aab4c4;z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#aab4c4;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.3vw}.t-section h1{font-size:6.4vw}.t-dark h1{font-size:5vw}.t-cta h1{font-size:6.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The Leader's Life</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ascending step-line / open-node motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="step" viewBox="0 0 260 130">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M14 108 H70 V78 H126 V50 H182 V22 H236" stroke="#3e506d" opacity="0.85"/>
    <circle cx="236" cy="22" r="7" fill="none" stroke="#0073e5" stroke-width="3.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:"The Leader's Life Masterclass",sub:'What a title company owner needs to run the business, not just the sales floor: the five issues that matter this quarter, a company that outlasts its founder, and a vision worth revisiting on purpose.',brand:true,step:'title'},
 {t:'normal',k:'Who this is for',title:'Title, escrow, and settlement company owners running the business, not just the sales team.',body:'Owners who have already built the sales engine, or trained their reps on someone else\'s system, and now spend most of their week reacting to whatever problem is loudest that day.'},
 {t:'normal',k:'What you\'ll walk away with',title:'A clear, honest read on where an owner\'s time actually leaks.',body:'Three real practices for running the ownership side of a title company: managing a short list of issues on purpose, building a company that does not depend on you personally, and keeping the long-term vision current instead of set-and-forgotten.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'Every company, market, and owner is different. What matters is the version of this that fits yours.',disc:'Educational content. Nothing here is a promise of income, hours, or business results. Results vary and no outcome is guaranteed.'},
 {t:'normal',k:'Who\'s teaching this',title:'Darryl Turner. 30+ years in the title insurance industry.',body:'Creator of the NDC™ Sales Process in 1994, the first complete sales system built for title insurance. 1,000+ title companies and 6,000+ sales reps trained. The Leader\'s Life is his separate, invite-only program for the owner\'s chair, not the sales floor.'},

 {t:'section',idx:'Part One',title:'Managing Your Rolling-5'},
 {t:'normal',k:'Where it actually breaks',title:'A title company owner\'s problem list never gets shorter, it just gets louder.',body:'Staffing, a rate change, a slow underwriter, a rep who is about to leave. Every one of them feels urgent. Most owners run the week on whichever one shouted last.'},
 {t:'normal',k:'What most owners try first',title:'Longer hours, not a shorter list.',body:'The instinct is to try to hold everything in your head at once. The Rolling-5 is a named practice for narrowing an overwhelming list down to the five issues that actually deserve this quarter\'s attention, and rotating them on purpose as they resolve.'},
 {t:'dark',title:'An owner managing thirty problems is really managing zero of them well.'},
 {t:'normal',k:'The real cost',title:'The issue that never makes the list is the one that eventually becomes the crisis.',body:'Without a deliberate short list, the loudest problem always wins, and the quietly important one, like succession or a key hire, keeps getting pushed to next quarter.'},

 {t:'section',idx:'Part Two',title:'A Company That Outlasts Its Founder'},
 {t:'normal',k:'The tension',title:'Most title company owners are the single point of failure in their own business.',body:'The relationships, the underwriter contacts, the institutional memory of how the company actually runs, all of it usually lives in one person\'s head.'},
 {t:'normal',k:'The real skill',title:'Succession planning built while you\'re still in the chair, not after you\'ve decided to leave.',body:'The Leader\'s Life treats succession as an ongoing leadership practice: developing the staff who could eventually carry more, and making the decisions that matter for where the company goes, not just how it runs today.'},
 {t:'dark',title:'A company that only works because you show up every day is not an asset. It is a job you can never leave.'},

 {t:'section',idx:'Part Three',title:'Revitalizing Vision and Developing the Bench'},
 {t:'normal',k:'The shift',title:'The vision you set five years ago is not automatically the right one today.',body:'Goals and dreams for the company change as the market, the team, and the owner change. The Leader\'s Life treats revisiting vision as a regular practice, not a one-time exercise from the company\'s early days.'},
 {t:'normal',k:'What that looks like',title:'Finding and developing the staff who can eventually own more of the business.',body:'Not hiring more people to do the same work. Developing the specific people who can take on real decisions, so growth stops depending entirely on the owner\'s own hours.'},
 {t:'dark',title:'The goal was never just more transactions. It was a company worth having built, and a life to go with it.'},

 {t:'section',idx:'The application',title:'Lead the Company, Not Just the Sales Floor'},
 {t:'normal',k:'Free, then deeper',title:'Start with the masterclass. Go deeper through The Leader\'s Life.',body:'The Leader\'s Life is invite-only and built around each leader\'s own set of conditions, no two plans are ever the same. Owners ready for that level of work can apply directly through darrylturner.com.'},
 {t:'cta',title:'Build the company. Build the life that comes with it.',chips:['Apply to The Leader\'s Life','Learn more at darrylturner.com'],disc:'Educational content only. No income, hours, or business result is guaranteed. Results vary by company and market.'},
];

const deck=document.getElementById('deck');
function stepMotif(kind){return `<svg class="step-motif ${kind==='title'?'title-step':'corner-step'}"><use href="#step"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The <b>Leader's Life</b> · Darryl Turner</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.step) h+=stepMotif(s.step);
  else if(s.t==='title') h+=stepMotif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
