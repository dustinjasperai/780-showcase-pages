<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#050505;}
.slide{position:relative;width:1280px;height:720px;background:#050505;color:#fff;
 font-family:'Open Sans',Arial,sans-serif;overflow:hidden;padding:76px 90px;}
.slide::before{content:'';position:absolute;top:0;left:0;width:10px;height:100%;
 background:#41c1f8;}
.kick{font-family:'Open Sans';letter-spacing:.22em;text-transform:uppercase;
 font-size:17px;font-weight:700;color:#41c1f8;margin-bottom:22px;}
.ttl{font-family:'Bebas Neue',Arial,sans-serif;font-weight:400;line-height:.98;
 font-size:76px;letter-spacing:.01em;color:#fff;margin-bottom:40px;}
.title .ttl{font-size:96px;}
.lines{max-width:980px;}
.lines p{font-size:27px;line-height:1.5;color:#e9e9e9;margin-bottom:16px;}
.grid-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;max-width:1040px;}
.grid-wrap p{font-size:23px;line-height:1.4;color:#e9e9e9;background:#111111;
 border-left:4px solid #41c1f8;padding:16px 20px;margin:0;}
.model .lines p{background:#111111;border-left:4px solid #41c1f8;padding:16px 22px;
 font-size:25px;}
.cta .ttl,.title .ttl{color:#41c1f8;}
.foot{position:absolute;bottom:40px;left:90px;right:90px;display:flex;
 justify-content:space-between;align-items:center;}
.brand{font-family:'Bebas Neue';letter-spacing:.14em;font-size:22px;color:#999999;}
.brand b{color:#41c1f8;font-weight:400;}
.pg{font-family:'Open Sans';font-size:15px;color:#999999;letter-spacing:.08em;}
.disclaimer .lines p{font-size:22px;color:#999999;}
</style></head><body><section class="slide body">
  <div class="kick">The real constraint</div>
  <h1 class="ttl">It is rarely the loud problem</h1>
  <div class="lines"><p>The thing screaming for attention is usually a symptom.</p><p>The constraint is quiet, structural, and one level upstream.</p><p>A diagnosis finds it. A playbook guesses at it.</p></div>
  <div class="foot">
    <div class="brand">POWERED BY <b>FITFILLIATE</b></div>
    <div class="pg">06 / 25</div>
  </div>
</section></body></html>
