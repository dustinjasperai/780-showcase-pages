<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Strategic Partner · Eric Rozenberg · Event Business Formula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf6ef; --panel:#ffffff; --rule:#ece4d6;
    --acc:#ff8c03; --navy:#002f47; --ink:#243642; --grey:#4f5b63; --dim:#93a0a8;
  }
  html,body{height:100%}
  body{background:#efe9de;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe9de}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--navy);line-height:1.12;letter-spacing:-.01em}
  .t-title h1{font-size:4.1vw;max-width:92%}
  .t-normal h1{font-size:3.0vw;max-width:87%}
  .t-normal .body{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.7vh;max-width:76%;line-height:1.56;font-weight:400}
  .sub{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.72vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.28vw;font-weight:600;color:var(--acc);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#013a58 0%,#002133 100%);align-items:center;text-align:center}
  .t-dark h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;font-style:italic;font-size:3.3vw;max-width:88%;color:#f4f8fb}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#ffffff 0%,#f6efe3 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:86%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Montserrat',sans-serif;border:1.5px solid var(--navy);color:var(--navy);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.16vw;font-weight:500}
  .chip.solid{background:var(--acc);border-color:var(--acc);color:#3a2100}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Plus Jakarta Sans',sans-serif;font-size:.9vw;color:var(--dim);text-align:center;line-height:1.42}
  .t-title .disc,.t-normal .disc{text-align:left}
  .stat-row{display:flex;gap:3.4vw;margin-top:4vh}
  .stat .n{font-family:'Montserrat',sans-serif;font-size:2.9vw;font-weight:700;color:var(--acc);line-height:1}
  .stat .l{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.02vw;color:var(--grey);margin-top:1vh;letter-spacing:.02em}
  .arch{position:absolute;pointer-events:none;right:7%;bottom:8.5%;width:22vw;opacity:.95}
  .corner-arch{position:absolute;pointer-events:none;right:6%;bottom:7.5%;width:10vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.24vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.01em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,47,71,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Montserrat',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.4vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}.stat .n{font-size:6vw}.stat .l{font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Event Business Formula</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- growth-architecture motif: three rising columns (Foundations, Customers, Growth) rising to a seat at the table -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="arch" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="132" x2="246" y2="132" stroke="#002f47" opacity="0.35"/>
    <rect x="34" y="96" width="34" height="36" stroke="#002f47" opacity="0.55"/>
    <rect x="96" y="72" width="34" height="60" stroke="#002f47" opacity="0.7"/>
    <rect x="158" y="42" width="34" height="90" stroke="#002f47" opacity="0.9"/>
    <path d="M18 118 L51 100 L113 76 L175 46" stroke="#ff8c03" opacity="0.95"/>
    <circle cx="175" cy="46" r="6" fill="#ff8c03"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Strategic Partner',sub:'How the best event businesses stop being treated as vendors and start being trusted at the C-level. A live masterclass for owners in the Meetings and Events industry.',brand:true,arch:true},
 {t:'normal',k:'Who this is for',title:'You run a great event business, and clients still treat you like a line item.',body:'You deliver flawless events, your clients are happy, and yet you keep getting price-shopped, put out to RFP, and asked to justify your fee. The work is excellent. The position you negotiate from is not.'},
 {t:'dark',title:'The problem was almost never your work. It was where you were standing in the conversation.'},

 {t:'section',idx:'Part One',title:'Why Great Event Pros Get Price-Shopped'},
 {t:'normal',k:'The order-taker trap',title:'When you lead with logistics, you get judged on logistics.',body:'A client hands you a brief, you execute it beautifully, and because you entered the room as the person who books the venue and runs the schedule, you get compared on price. Excellence at the wrong table still gets discounted.'},
 {t:'normal',k:'The cost of that chair',title:'Order-takers get RFP’d. Partners get called first.',body:'The difference between a vendor and a partner is rarely skill. It is whether you were in the room when the business objective was set, or handed the objective after someone else decided it.'},
 {t:'dark',title:'Nobody negotiates the price of a partner. They negotiate the price of a vendor.'},

 {t:'section',idx:'Part Two',title:'From Vendor to Strategic Partner'},
 {t:'normal',k:'Start with the why',title:'The fastest way to change your chair is to change the first question you ask.',body:'Ask about the business objective and the why of the meeting before you talk logistics, and you are immediately seen as someone who understands the business, not just the event. That single shift is what moves you to the C-level table.'},
 {t:'normal',k:'The Growth Architecture · Foundations',title:'Foundations: build a business, not a busy calendar.',body:'Pricing, positioning, and an offer that lets you charge for the outcome you create, so the company stands on more than the owner’s hustle and a full inbox.'},
 {t:'normal',k:'The Growth Architecture · Customers',title:'Customers: a repeatable way to win the right clients.',body:'A predictable path to the clients who value strategy and pay for it, instead of chasing every RFP that lands and competing on price with everyone else who chased it too.'},
 {t:'normal',k:'The Growth Architecture · Growth',title:'Growth: scale past yourself.',body:'The team, the delegation, and the accountability that let the business grow without the owner sitting in the middle of every single event.'},
 {t:'dark',title:'A strategic partner charges for the outcome. A vendor discounts for the work.'},

 {t:'section',idx:'Part Three',title:'Same Talent, A Different Table'},
 {t:'normal',k:'The shift, in practice',title:'Same talent, a different chair, a different number.',body:'The events do not change. The conversation, the fees, and the repeat business do, once clients experience you as the person who protects their objective rather than the one who quotes on their brief.'},
 {t:'normal',k:'Why Eric Rozenberg',title:'Built it, exited it, and now teaches only this.',body:'Two decades producing award-winning meetings and events in more than 50 countries, a 7-figure event business built and exited, the first European to chair the International Board of MPI, and host of The Business of Meetings podcast.',stats:[['50+','countries, 736 events produced'],['7-figure','event business built and exited'],['240+','Business of Meetings episodes']]},
 {t:'dark',title:'The industry does not need more logistics. It needs more owners who lead.'},

 {t:'section',idx:'Your Next Step',title:'Sit at the Table'},
 {t:'normal',k:'Where to start',title:'See whether your business is ready to make the shift.',body:'The Event Business Growth Architecture is how owners move from order-taker to strategic partner, and from booked-solid-but-stuck to a business that scales. The first step is a straight conversation about where your business is right now.'},
 {t:'cta',title:'Ready to be the partner your clients call first?',chips:['Book a fit call with Eric','Explore Event Business Formula'],disc:'Educational content for owners in the Meetings and Events industry. No income or business result is guaranteed. Outcomes vary by business, market, and starting conditions.'},
];

const deck=document.getElementById('deck');
function arch(){return `<svg class="arch"><use href="#arch"/></svg>`}
function cornerArch(){return `<svg class="corner-arch"><use href="#arch"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.stats) h+=`<div class="stat-row">`+s.stats.map(st=>`<div class="stat"><div class="n">${st[0]}</div><div class="l">${st[1]}</div></div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Event Business <b>Formula</b> · Eric Rozenberg</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map((c,ci)=>`<div class="chip ${ci===0?'solid':''}">${c}</div>`).join('')+`</div>`;
  }
  if(s.arch) h+=arch();
  else if(s.t==='title') h+=arch();
  else if(s.t==='normal') h+=cornerArch();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
