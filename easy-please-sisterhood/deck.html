<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earn More by Doing Less — A Masterclass with Jennifer Barrett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F1;
  --panel:#F2E9DC;
  --rule:#2E2A26;
  --ink:#2E2A26;
  --muted:#6B6258;
  --accent:#E05A47;
  --deep:#9E3B2C;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;line-height:1.5}
.slide{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 9vw;border-bottom:1px solid rgba(46,42,38,.08);position:relative}
.kick{font-family:"Mulish";font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(40px,7vw,86px);line-height:1.04;letter-spacing:-.01em}
h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(30px,4.6vw,54px);line-height:1.08;margin-bottom:10px}
.sub{font-size:clamp(18px,2.1vw,25px);color:var(--muted);margin-top:26px;max-width:40ch}
.body{font-size:clamp(17px,1.8vw,21px);margin-top:22px;max-width:52ch;color:#423c34}
.petal{width:64px;height:4px;background:var(--accent);border-radius:4px;margin:30px 0 0}
ul{list-style:none;margin-top:30px;max-width:56ch}
li{font-size:clamp(17px,1.8vw,21px);padding:16px 0 16px 34px;border-top:1px solid rgba(46,42,38,.12);position:relative;color:#423c34}
li:before{content:"";position:absolute;left:0;top:24px;width:14px;height:14px;background:var(--accent);border-radius:50%}
li b{font-family:"Mulish";font-weight:700;color:var(--ink)}
.num{font-family:"DM Serif Display",serif;font-size:clamp(60px,10vw,120px);color:var(--panel);line-height:.8}
.part .kick{color:var(--deep)}
.cta{background:var(--panel)}
.cta .step{font-size:clamp(20px,2.4vw,28px);margin-top:18px;max-width:46ch;color:var(--ink)}
.disc{margin-top:40px;font-size:14px;color:var(--muted);max-width:60ch;line-height:1.55}
.foot{position:absolute;bottom:26px;left:9vw;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A Live Masterclass with Jennifer Barrett', h:'Earn More by Doing Less', sub:'The Focus to Flourish method for women scaling a business past six figures without burning out.'},
  {t:'content', kick:'The promise', h:'One hour. A shorter to-do list and a bigger number.', body:'By the end of this live session you will know the two or three things in your business that actually grow revenue, the work you can stop this week, and how to build a calendar that earns more while asking less of you.'},
  {t:'who', kick:'Who this is for', h:'You are already succeeding. You are also exhausted.', body:'You run a business doing six figures and climbing. You hit new revenue highs and feel further from rest, not closer to it. This hour is for the woman who wants the next level of income to cost her fewer hours, not more.'},
  {t:'content', kick:'Sound familiar', h:'None of this is a time-management problem.', list:['You are busy from the moment you open your laptop, yet the needle barely moves','You under-charge and over-deliver, then wonder why you are tired','Rest feels like something you have to earn back after the launch','Every coach in your feed says the answer is to do more']},
  {t:'content', kick:'The trap', h:'You were sold "work hard, play hard."', body:'The whole category sells the same thing: scale bigger, launch more, add more content, more hustle. So you keep adding. The to-do list grows faster than the revenue, and ease starts to feel like a reward you will allow yourself someday later.'},
  {t:'content', kick:'The reframe', h:'More revenue is not more hours.', body:'The women quietly out-earning you are not working more than you. They are working on fewer things that actually move money, and they have stopped doing most of the rest. Growth is a focusing problem, not an effort problem.'},
  {t:'part', kick:'Part One', h:'Why doing more quietly caps your income', num:'01'},
  {t:'content', kick:'Human giver syndrome', h:'The belief that your worth is what you give.', body:'High-achieving women are taught, early and deeply, that their value comes from how much they give, serve, and carry. In a business that shows up as under-charging, over-delivering, and saying yes to work that does not grow anything. It feels like generosity. It functions like a ceiling.'},
  {t:'content', kick:'The cost', h:'Busy is not the same as productive.', body:'A full calendar feels like progress, so it is rarely questioned. But most of what fills it protects you from the few hard, high-leverage decisions that would actually change your revenue. Doing less is uncomfortable precisely because it removes the hiding place.'},
  {t:'part', kick:'Part Two', h:'The Focus to Flourish method', num:'02'},
  {t:'framework', kick:'Pillar one', h:'Find your needle-movers', body:'In almost every business, two or three activities generate the overwhelming majority of the revenue. We name yours explicitly, with numbers, so you stop treating every task as equally urgent.', list:['Map where revenue actually comes from, not where effort goes','Name the 2-3 moves that compound','Make everything else optional']},
  {t:'framework', kick:'Pillar two', h:'Cut the giver-overwork', body:'Once the needle-movers are clear, the rest becomes visible as what it is: expensive busywork. We decide what to stop, what to delegate, and what to deliberately do at 80 percent.', list:['Stop the work that protects you from the hard decisions','Delegate or delete, not "do it faster"','Reset pricing so your worth is not measured in hours']},
  {t:'framework', kick:'Pillar three', h:'Design the Easy Please week', body:'Doing less is a structure, not a mood. We build a week around a few protected focus blocks and real off-time, so ease is scheduled instead of hoped for.', list:['Focus blocks for the needle-movers, defended','Protected off-time that is not negotiable','A rhythm of support so you are not carrying it alone']},
  {t:'part', kick:'Part Three', h:'Your Easy Please business, in real life', num:'03'},
  {t:'content', kick:'A week, redrawn', h:'Three moves, not thirty.', body:'Picture the week after this work: a handful of focus blocks on the things that compound, the busywork handed off or dropped, and your Fridays actually yours. The number goes up because your attention finally landed where it pays.'},
  {t:'content', kick:'The shift', h:'Fewer moves. More money. Your evenings back.', body:'When the week is built around the few things that grow revenue and the rest is cut, the result is not just more income. It is income that no longer costs you your evenings, your health, or the reason you started. That is what flourishing is supposed to mean.'},
  {t:'content', kick:'What you will walk away with', h:'You leave this session with a plan, not a pep talk.', list:['Your two or three real needle-movers, named','A short list of what to stop or hand off this week','The first draft of an Easy Please week you can defend']},
  {t:'content', kick:'Why me', h:'I have built this on purpose, for women like you.', body:'I am Jennifer Barrett, a business coach for women entrepreneurs and a Hello Seven Certified Coach, with coaching training from the Hudson Institute and Brown University and years as a marketing and management consultant before this. I built the Easy Please Sisterhood and the Focus to Flourish method around one idea: you can do less and still win.'},
  {t:'cta', kick:'Your next step', h:'Ready to earn more by doing less?', step:'Book a strategy session with me and we will map your needle-movers and the first things to cut, together.', disc:'This masterclass is educational. No specific income or result is guaranteed. Outcomes vary and depend on your own business, effort, and circumstances.'}
];
const deck = document.getElementById('deck');
deck.innerHTML = S.map(function(s){
  var cls = 'slide ' + (s.t==='part'?'part':'') + (s.t==='cta'?' cta':'');
  var h = '';
  if(s.kick){ h += '<div class="kick">'+s.kick+'</div>'; }
  if(s.t==='part' && s.num){ h += '<div class="num">'+s.num+'</div>'; }
  if(s.t==='title'){ h += '<h1>'+s.h+'</h1>'; } else { h += '<h2>'+s.h+'</h2>'; }
  if(s.t==='title'){ h += '<div class="petal"></div>'; }
  if(s.sub){ h += '<div class="sub">'+s.sub+'</div>'; }
  if(s.body){ h += '<div class="body">'+s.body+'</div>'; }
  if(s.list){ h += '<ul>'+s.list.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>'; }
  if(s.step){ h += '<div class="step">'+s.step+'</div>'; }
  if(s.disc){ h += '<div class="disc">'+s.disc+'</div>'; }
  h += '<div class="foot">Easy Please &middot; Jennifer Barrett</div>';
  return '<section class="'+cls+'">'+h+'</section>';
}).join('');
</script>
</body>
</html>
