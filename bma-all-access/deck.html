<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install the Brand OS — a masterclass with Stephen Houraghan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette derived from brandmasteracademy.com (see 01-deep-research.md ## Palette):
     ground #0d0d0d (site bg, dark scheme), ink #eeeeec (site headings),
     muted #a9a9a3 (site dominant grey), accent #ff0097 (site link magenta).
     Type: Fraunces (their display serif) + Inter (their body). */
  :root{
    --bg:#0d0d0d;
    --panel:#16181c;
    --ink:#eeeeec;
    --muted:#a9a9a3;
    --rule:#2a2d33;
    --accent:#ff0097;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px 60px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:20px}
  .kicker.muted{color:var(--muted)}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:54px;line-height:1.04;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:38px;line-height:1.1;margin-bottom:22px}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:62ch;margin-bottom:14px}
  p strong,li strong{color:var(--ink);font-weight:600}
  .lead{font-size:22px;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:18px;line-height:1.5;color:var(--muted);padding:12px 0 12px 30px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:19px;width:9px;height:9px;background:var(--accent);border-radius:2px}
  .steps{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
  .step{flex:1 1 180px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:20px}
  .step .n{font-family:'Fraunces',serif;font-size:15px;color:var(--accent);font-weight:600;margin-bottom:8px}
  .step .t{color:var(--ink);font-weight:600;font-size:17px;margin-bottom:6px}
  .step .d{color:var(--muted);font-size:14px;line-height:1.45}
  .loop{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .loop span{background:var(--bg);border:1px solid var(--rule);border-radius:999px;padding:10px 18px;font-size:15px;color:var(--ink);font-weight:500}
  .loop span b{color:var(--accent)}
  .big{font-family:'Fraunces',serif;font-size:88px;line-height:1;color:var(--accent);font-weight:700;margin-bottom:8px}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);line-height:1.5;max-width:70ch}
  .ladder{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .rung{display:flex;align-items:center;gap:16px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:14px 18px}
  .rung .lvl{font-family:'Fraunces',serif;font-weight:700;color:var(--accent);width:44px;font-size:18px}
  .rung .lbl{color:var(--ink);font-weight:600;font-size:17px}
  .rung .sub{color:var(--muted);font-size:14px;margin-left:auto;text-align:right}
  .cta-line{font-size:22px;color:var(--ink);font-weight:600;margin-top:8px}
  .foot{position:absolute;bottom:18px;right:26px;font-size:12px;color:var(--rule);letter-spacing:.12em;text-transform:uppercase}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:36px}h2{font-size:28px}p{font-size:17px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Stephen Houraghan',
    h:'Install the Brand OS',
    p:'How freelance brand designers and strategists stop selling one off deliverables and start installing a system clients pay strategist rates for.' },

  {t:'promise', kicker:'The promise',
    h:'By the end of this hour',
    p:'You will see brand strategy the way operational brands actually use it: as a system with stages, models and a decision process you can install on any brand you touch. And you will see why that one shift is what moves you from priced by the hour to paid as the strategist.',
    lead:'Same craft you already have. A structure that finally makes it pay.' },

  {t:'who', kicker:'Who this is for',
    h:'You already do good work',
    p:'This is for freelance brand designers, strategists, marketers and small agency owners who can build a beautiful brand, but keep getting hired for the logo and the deck instead of the strategy.',
    lead:'If you are trading polished files for hours, this is for you.' },

  {t:'trap', kicker:'The trap',
    h:'The deliverable trap',
    p:'You hand over a gorgeous strategy document. The client nods. Then nothing happens with it. Three months later they are back asking for a new logo, and you are quoting by the hour again.',
    li:['You get judged on the file, not the thinking behind it','Every project starts from a blank page, so nothing compounds','You compete on price with anyone who owns the same software'] },

  {t:'reframe', kicker:'The reframe',
    h:'Strategy is not a document. It is a system.',
    p:'The reason your strategy dies in a slide deck is that a document is a snapshot. It cannot make decisions after you leave the room. What operational brands actually run on is a system: a defined structure that keeps making the right call as the brand grows. That system is what you should be installing, and charging for.' },

  {t:'part', kicker:'Part one', h:'Why good strategy stops working',
    p:'A one off strategy project answers this quarter\'s questions and then goes stale. The market moves, the team changes, new offers launch, and the beautiful deck has no answer for any of it. So the brand drifts back to guesswork and the strategist gets forgotten.' },

  {t:'content', kicker:'Part one', h:'The cost of no system',
    li:['Decisions get re-litigated every time someone new joins','Positioning slowly blurs because nothing locks it in place','The founder cannot see what to do next, so momentum stalls','And you, the strategist, are out of the room the moment the file is delivered'] },

  {t:'shift', kicker:'Part one', h:'What changes when it is a system',
    p:'The work does not get harder. It gets structured. The same thinking you already do stops living in a file nobody opens and starts running the brand day to day.',
    li:['A snapshot document becomes a living structure the brand runs on','A one off project becomes a role you keep inside the business','Blank page every time becomes a model you reach for','Priced by the hour becomes paid for the outcome'] },

  {t:'part', kicker:'Part two', h:'The Brand OS',
    p:'A Brand Operating System is the structure operational brands run on to move from strategy to action. Instead of one document, you install a system with defined stages, models and a repeatable decision process. This is the shift from being a project consultant to being the person who stays inside the business.',
    lead:'Here is the system I teach, called BrandOPRA: Brand OS for pros.' },

  {t:'stages', kicker:'The Brand OS', h:'Four lifecycle stages',
    p:'Every brand sits somewhere on this path. The system tells you which stage a brand is in and what work matters there, so you always know what to do next.',
    steps:[
      {n:'01',t:'Core',d:'Define identity and offers. Get the foundation right.'},
      {n:'02',t:'Grow',d:'Find the right customers and convert them.'},
      {n:'03',t:'Scale',d:'Expand traction and operations without losing the plot.'},
      {n:'04',t:'Legacy',d:'Consolidate and future proof what you built.'} ] },

  {t:'models', kicker:'The Brand OS', h:'Sixteen strategy models',
    p:'Across the four stages sit sixteen strategy models, one for each major brand challenge, from validation and positioning to employer branding and brand extension. You do not reinvent your approach every project. You reach for the model that fits the challenge in front of you.',
    lead:'One system. Sixteen reusable answers.' },

  {t:'example', kicker:'The Brand OS', h:'One model, in practice',
    p:'Take positioning. Instead of a workshop that produces a statement and stops, the positioning model gives you a repeatable way to find the space a brand can own, test it, lock the decision, and hand the business a rule it keeps using long after the engagement. That is what a model is: a reusable answer to a recurring question.',
    lead:'Sixteen of these, and you never start from a blank page again.' },

  {t:'loop', kicker:'The Brand OS', h:'The Decision Loop',
    p:'Every model runs the same four step loop. It is what turns a strategy opinion into a locked decision the brand can act on, and it is why the work keeps producing value after you leave the room.',
    loop:['Discover','Diagnose','Decide','Deploy'] },

  {t:'part', kicker:'Part three', h:'When strategy becomes a system you run',
    p:'When you install a Brand OS instead of delivering a document, the relationship changes. You are not the vendor who made the file. You are the operator who keeps the brand making good decisions, and that is a role worth a retainer, not a one off invoice.' },

  {t:'ladder', kicker:'Part three', h:'A path, not a leap',
    p:'You do not learn this all at once. There is a defined progression from foundation to mastery, the same way you would learn a language, ending in certification.',
    ladder:[
      {lvl:'A1',lbl:'Strategy Foundation',sub:'the fundamentals'},
      {lvl:'A2',lbl:'Strategy Impact',sub:'make it land'},
      {lvl:'B1',lbl:'Strategy Development',sub:'build the system'},
      {lvl:'B2',lbl:'Workshop Delivery',sub:'run the room'},
      {lvl:'C1',lbl:'Brand Consulting',sub:'lead the engagement'},
      {lvl:'C2',lbl:'Advanced Strategy',sub:'certified mastery'} ] },

  {t:'value', kicker:'Part three', h:'From hired gun to trusted strategist',
    p:'This is the real move. When you can install a system and stand behind it, you stop being the person who is briefed and start being the person who is asked. That is the difference between charging for hours and charging for outcomes.',
    lead:'Same skill you already have, positioned as a system worth strategist rates.' },

  {t:'outcome', kicker:'Part three', h:'And the market comes looking',
    p:'When you finish the path you are certified, and certified strategists get listed in a directory where businesses go to find someone who can do exactly this. The system does not just change how you work. It changes how clients find you in the first place.',
    lead:'You build the skill, and the skill gets you found.' },

  {t:'whyme', kicker:'Why me', h:'Stephen Houraghan',
    p:'I am a brand strategist and consultant, founder of Brand Master Academy and BrandBuildr.ai, and I built a brand strategy agency before that. On the Brand Master Podcast I have sat with people like Marty Neumeier and Seth Godin, and through the academy I have helped tens of thousands of strategists turn brand building into a system they can repeat.',
    lead:'I teach this because the brand education gap is real, and closing it is the whole point.' },

  {t:'cta', kicker:'Your next step', h:'Install the system',
    ctaline:'Explore the A1 to C2 path and install the Brand OS inside BMA All Access.',
    p:'If the deliverable trap sounds familiar, the fix is not another logo project. It is a system you can install on every brand you touch, for the rest of your career.',
    disclaimer:'This masterclass is educational. It shares a framework and an approach. No specific income, client or business result is guaranteed. Results vary with the work you put in.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '';
  if (s.kicker) h += `<div class="kicker${s.t==='who'||s.t==='content'?'':''}">${s.kicker}</div>`;
  if (s.t === 'title') { h += `<h1>${s.h}</h1>`; }
  else { h += `<h2>${s.h}</h2>`; }
  if (s.p) h += `<p>${s.p}</p>`;
  if (s.lead) h += `<p class="lead">${s.lead}</p>`;
  if (s.li) h += '<ul>' + s.li.map(x=>`<li>${x}</li>`).join('') + '</ul>';
  if (s.steps) h += '<div class="steps">' + s.steps.map(x=>`<div class="step"><div class="n">${x.n}</div><div class="t">${x.t}</div><div class="d">${x.d}</div></div>`).join('') + '</div>';
  if (s.loop) h += '<div class="loop">' + s.loop.map((x,j)=>`<span><b>${j+1}.</b> ${x}</span>`).join('') + '</div>';
  if (s.ladder) h += '<div class="ladder">' + s.ladder.map(x=>`<div class="rung"><div class="lvl">${x.lvl}</div><div class="lbl">${x.lbl}</div><div class="sub">${x.sub}</div></div>`).join('') + '</div>';
  if (s.ctaline) h += `<div class="cta-line">${s.ctaline}</div>`;
  if (s.disclaimer) h += `<div class="disclaimer">${s.disclaimer}</div>`;
  h += `<div class="foot">Brand Master Academy</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
