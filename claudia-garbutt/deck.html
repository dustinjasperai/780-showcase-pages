<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Biology of Sustainable High Performance — Wired For Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffaf5;        /* her cream ground (brand.json, light scheme) */
    --panel:#ffffff;
    --ink:#2c3949;       /* her dominant navy (26 uses) */
    --muted:#5c6673;
    --rule:#e3ded6;
    --accent:#1863dc;    /* her signal blue (13 uses) */
    --accent2:#20c4d9;   /* her bio-teal (3 uses) — biology motif, used sparingly */
    --display:'Cormorant Garamond', Georgia, serif;
    --body:'Raleway', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:64px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.12}
  .promise{font-family:var(--body);font-size:20px;color:var(--muted);margin-top:22px;max-width:30em;line-height:1.5}
  .lead{font-family:var(--body);font-size:22px;line-height:1.5;max-width:32em;margin-top:8px}
  .big{font-family:var(--display);font-weight:700;font-size:62px;line-height:1.06;max-width:16em}
  .part{font-family:var(--body);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    font-size:14px;color:var(--muted)}
  .part-title{font-family:var(--display);font-weight:700;font-size:48px;margin-top:14px}
  ul{list-style:none;margin-top:26px}
  li{font-size:20px;line-height:1.5;padding-left:34px;position:relative;margin-bottom:16px;max-width:34em}
  li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:50%;
    background:var(--accent2)}
  .filter{font-family:var(--display);font-size:30px;font-weight:700;color:var(--accent)}
  .by{font-family:var(--body);font-size:17px;color:var(--muted);margin-top:30px;font-weight:600}
  .cred{font-size:19px;line-height:1.55;max-width:32em;margin-top:10px}
  .cta h1{font-size:50px}
  .disclaimer{font-family:var(--body);font-size:13px;color:var(--muted);margin-top:34px;
    line-height:1.5;max-width:40em;border-top:1px solid var(--rule);padding-top:16px}
  .n{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'Wired For Success · Live masterclass',
    h:'The Biology of Sustainable High Performance',
    promise:'How to perform at your peak without burning out, by working with how your brain and body actually operate.',
    by:'with Claudia Garbutt, molecular biologist and high-performance coach'},

  {t:'lead', kick:'Who this is for',
    h:'Winning on paper, running on empty',
    lead:'This is for the ambitious entrepreneur whose business is finally working, and who is quietly more exhausted than ever. If you are successful and depleted at the same time, you are in the right room.'},

  {t:'lead', kick:'The trap',
    h:'You were told the answer was more discipline',
    lead:'So you push harder, sleep less, and add another productivity system. For a while it works. Then the results start costing more energy than they return, and pushing harder stops paying off.'},

  {t:'big', kick:'The reframe', big:'Burnout is not a willpower problem. It is a biology problem.'},

  {t:'part', part:'Part One', title:'Why grinding against your biology stops working'},

  {t:'lead', kick:'What is actually happening',
    h:'Your nervous system is stuck in threat mode',
    lead:'Chronic grind keeps your stress physiology switched on. When your body reads life as a constant emergency, the systems you perform with, focus, memory, mood, and decision making, are the first to degrade. You are not weak. You are dysregulated.'},

  {t:'lead', kick:'The high achiever tax',
    h:'The harder you push against your wiring, the less you get back',
    lead:'Willpower draws on the same depleted system you are already overdrawing. That is why the standard advice, just be more disciplined, quietly makes high performers worse over time.'},

  {t:'big', kick:'A better model',
    big:'Your brain and body are not obstacles to manage. They are the system you perform through.'},

  {t:'part', part:'Part Two', title:'The Wired For Success method'},

  {t:'big', kick:'The thesis', big:'Work WITH your biology, not against it.',
    sub:'Real performance lives at the intersection of physiology and psychology. Change the biology and the mindset follows.'},

  {t:'lead', kick:'Two systems do the work',
    h:'Sustainable Growth, then the Golden Habit Model',
    lead:'First we define success so it cannot quietly bankrupt you. Then we build the daily habits that make it automatic, using how your brain actually forms behaviour.'},

  {t:'lead', kick:'System one',
    h:'Sustainable Growth',
    lead:'Achieve your goals without sacrificing your health, your relationships, or your happiness along the way. Success is not success if it costs you the life you were trying to build. We set targets by what they must not cost, not only by what they produce.'},

  {t:'lead', kick:'System two',
    h:'The Golden Habit Model',
    lead:'The habits that actually stick all pass three filters. Most advice gives you habits that fail two of them, which is why they never last.'},

  {t:'filter', kick:'Filter one', f:'WANT to do',
    lead:'It has to be rewarding. If your brain does not get something it enjoys, it will not repeat the behaviour, no matter how good the habit looks on paper.'},

  {t:'filter', kick:'Filter two', f:'CAN do',
    lead:'It has to fit the life and routine you already have. Friction kills habits faster than motivation can build them, so we design for your real schedule, not an ideal one.'},

  {t:'filter', kick:'Filter three', f:'Will be EFFECTIVE',
    lead:'It has to move the needle. We choose the highest leverage habit for your wellbeing and performance, not the most impressive looking one. Small input, outsized return.'},

  {t:'lead', kick:'Putting it together',
    h:'A week your nervous system can actually keep',
    lead:'When habits are things you want to do, can do, and that genuinely work, consistency stops taking willpower. Recovery becomes part of the plan, movement becomes active rest, and your baseline energy climbs instead of eroding.'},

  {t:'part', part:'Part Three', title:'Performance that pays you back'},

  {t:'lead', kick:'The shift',
    h:'More output, less depletion',
    lead:'You make decisions from a regulated nervous system instead of a frayed one. The work still gets done, often more of it, but it stops quietly costing you your health and the people you love.'},

  {t:'cred', kick:'Why listen to me',
    h:'I teach the mechanisms, not motivation',
    cred:'I am a molecular biologist who studied human brain cells, survived leukemia, and now coaches driven entrepreneurs on the science of staying happy, healthy, and productive. On the Wired For Success podcast I have recorded 260 plus episodes with leading scientists and founders, ranking in the global top 1.5 percent. This is evidence based, not hype based.'},

  {t:'cta', kick:'Your next step',
    h:'Build performance that lasts',
    lead:'If you want help applying this to your own business and biology, start a conversation with me. We will look at where you are grinding against your wiring and design the first few Golden Habits around your real life.',
    cta:'Start a conversation at wiredforsuccess.solutions',
    disclaimer:'This masterclass is for educational purposes only. It is not medical, psychological, or financial advice, and it is not a substitute for care from a qualified professional. No specific result or income is guaranteed. Results vary from person to person.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'cta' ? ' cta' : '');
  let html = '';
  if (s.kick) html += `<div class="kick">${s.kick}</div>`;
  if (s.t === 'title') {
    html += `<h1>${s.h}</h1>`;
    if (s.promise) html += `<div class="promise">${s.promise}</div>`;
    if (s.by) html += `<div class="by">${s.by}</div>`;
  } else if (s.t === 'big') {
    html += `<div class="big">${s.big}</div>`;
    if (s.sub) html += `<div class="promise">${s.sub}</div>`;
  } else if (s.t === 'part') {
    html += `<div class="part">${s.part}</div><div class="part-title">${s.title}</div>`;
  } else if (s.t === 'filter') {
    html += `<div class="filter">${s.f}</div><div class="lead">${s.lead}</div>`;
  } else if (s.t === 'cred') {
    html += `<h2>${s.h}</h2><div class="cred">${s.cred}</div>`;
  } else if (s.t === 'cta') {
    html += `<h1>${s.h}</h1><div class="lead">${s.lead}</div>`;
    if (s.cta) html += `<div class="by">${s.cta}</div>`;
    if (s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  } else {
    html += `<h2>${s.h}</h2>`;
    if (s.lead) html += `<div class="lead">${s.lead}</div>`;
    if (s.items) html += '<ul>' + s.items.map(x => `<li>${x}</li>`).join('') + '</ul>';
  }
  html += `<div class="n">${i + 1} / ${S.length}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
