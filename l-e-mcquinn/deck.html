<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Creative Trenches — a masterclass with L.E. McQuinn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Karla:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#211A2E; --panel:#2E2541; --rule:#4A3B66; --accent:#E7B45A; --text:#F3EEF8;
    --muted:#C9BEDA;
    --display:"Playfair Display",Georgia,serif;
    --body:"Karla",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-weight:300;line-height:1.55}
  .slide{min-height:100vh;width:100%;scroll-snap-align:start;display:flex;flex-direction:column;
    justify-content:center;padding:8vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.4rem;display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:"";width:34px;height:1px;background:var(--accent);display:inline-block}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.04;
    letter-spacing:-.5px}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.1;
    margin-bottom:1.1rem}
  .lede{font-family:var(--display);font-style:italic;font-weight:500;color:var(--muted);
    font-size:clamp(1.3rem,2.4vw,1.8rem);margin-top:1.4rem;max-width:40ch}
  p{font-size:clamp(1rem,1.5vw,1.18rem);color:var(--text);max-width:54ch;margin-top:1rem}
  p.sub{color:var(--muted)}
  .big{font-family:var(--display);font-size:clamp(2.2rem,5vw,3.6rem);font-weight:600;line-height:1.12;max-width:18ch}
  ul{margin-top:1.4rem;max-width:56ch;list-style:none}
  li{position:relative;padding-left:1.8rem;margin:.9rem 0;font-size:clamp(1rem,1.5vw,1.15rem)}
  li::before{content:"\25D0";position:absolute;left:0;color:var(--accent);font-size:.9rem;top:.15rem}
  .num{font-family:var(--display);color:var(--accent);font-size:1.1rem;font-weight:600;margin-bottom:.5rem;letter-spacing:.1em}
  .moon{position:absolute;top:7vh;right:9vw;color:var(--accent);opacity:.55;font-size:1.4rem}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:2.2rem 2.4rem;margin-top:1.6rem;max-width:58ch}
  .foot{position:absolute;bottom:4vh;left:9vw;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.7}
  .disc{font-size:.82rem;color:var(--muted);max-width:60ch;margin-top:2rem;opacity:.8;line-height:1.5}
  .cta{display:inline-block;margin-top:1.8rem;font-family:var(--body);font-weight:600;letter-spacing:.04em;
    border:1px solid var(--accent);color:var(--accent);padding:.9rem 1.8rem;border-radius:999px;text-decoration:none}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:1.8rem;max-width:70ch}
  .cell{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:1.4rem}
  .cell h3{font-family:var(--display);color:var(--accent);font-size:1.5rem;font-weight:600;margin-bottom:.4rem}
  .cell p{font-size:.95rem;margin-top:0}
  @media(max-width:640px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<footer class="disc" style="padding:4vh 9vw;border-top:1px solid var(--rule)">Educational content only. No result is guaranteed. Results vary from writer to writer and depend entirely on your own work. Nothing here is a promise of publication, representation, sales, or income.</footer>
<script>
const S = [
  {t:"title", kicker:"A live masterclass with L.E. McQuinn", h:"The Creative Trenches", lede:"How to finish and edit the novel you already started."},
  {t:"who", kicker:"Who this is for", h:"For the dreamer with a half-written manuscript.", p:"You started the book. You believe in it. But somewhere past the opening chapters it went quiet, and you are not sure the story you meant to tell is the one on the page. This hour is for you."},
  {t:"hook", kicker:"The honest part", big:"You don't have a writing problem. You have an editing problem.", p:"Almost nobody is blocked on new words. They are blocked on the messy middle, the fortieth rewrite of chapter one, and the fear that the draft is not good enough to fix."},
  {t:"who", kicker:"What it costs", h:"The book that stays in the drawer.", p:"Every month the draft sits unfinished is a month the readers who need your story never get to read it. The cost is not just yours. It is theirs too."},
  {t:"part", num:"PART ONE", h:"The first draft is not the book.", p:"The draft is you figuring out what the story is. The book is what you make in the edit. When writers treat the rough draft as the finished thing, they either abandon it or polish sentences while the real problems sit untouched underneath."},
  {t:"trap", kicker:"The trap", h:"Line-editing too early.", p:"Rewriting the opening paragraph for the hundredth time feels like progress. It is not. It is the thing we do to avoid the harder, braver work of looking at the whole shape of the story."},
  {t:"part", num:"PART TWO", h:"Five moves from inside the trenches.", p:"This is the sequence I use on my own manuscripts and with the writers I coach. It runs macro to micro on purpose: you fix what the book is before you fix how it sounds."},
  {t:"pillar", num:"MOVE 01", h:"Protect the creative energy first.", p:"Rest is not the reward for finishing. It is the prerequisite for the flow that lets you finish. Daily habits and a monthly honest check-in keep your actions pointed at the book you actually want to write."},
  {t:"pillar", num:"MOVE 02", h:"Write for processing fluency.", p:"On the page your words carry everything that tone and body language carry in conversation. Clear prose lets a reader move effortlessly through your sentences and straight into the moment. If they stop to decode, they stop feeling."},
  {t:"pillar", num:"MOVE 03", h:"Cut the filter words.", p:"“She saw,” “she heard,” “she felt” hold the reader one step back from the character. Delete the filter and put them directly inside the experience. It is the fastest way to make a scene land harder."},
  {t:"who", kicker:"On the page", h:"Watch the distance disappear.", p:"“She saw the letter shaking in his hand” becomes “The letter shook in his hand.” Same moment, half a step closer, and now the reader is standing in the scene instead of watching it from the doorway."},
  {t:"pillar", num:"MOVE 04", h:"The Three-Category second draft.", p:"Before you touch a single sentence, sort every note into three piles and revise in this order."},
  {t:"grid", kicker:"The revision roadmap", h:"Plot. Pacing. Characterization.", cells:[
    {k:"Plot",v:"Does each turn earn the next one?"},
    {k:"Pacing",v:"Where does the reader quietly drift?"},
    {k:"Characterization",v:"Who changes, and do we feel why?"}
  ], p:"Line-editing waits until these three are settled. Macro before micro, every time."},
  {t:"pillar", num:"MOVE 05", h:"Earn the next page with tension.", p:"Ask every scene one question: what is making the reader want to read on? Even a happy beat needs an open loop underneath it, a worry, a question, a small mystery. Lose that and you lose them, no matter how pretty the prose."},
  {t:"part", kicker:"How they fit", h:"The order is the whole trick.", p:"Energy, then clarity, then the macro pass, then tension, then the line. Most writers do it backwards and wonder why the polishing never ends. Run it in order and the book closes itself."},
  {t:"part", num:"PART THREE", h:"The draft that finally holds.", p:"A manuscript that is actually finished, not endlessly circled. A draft you can hand to a reader without apologizing for it. The quiet confidence of knowing the story holds, because you fixed it in the right order."},
  {t:"why", kicker:"Why me", h:"I am in the trenches with you.", p:"I am L.E. McQuinn. I published my debut contemporary romance, Reality With You, and I write the unfiltered diary of that journey to more than two thousand readers at DREAMIST. I hold multiple coaching certifications and I have coached dozens of writers through exactly this. I teach it because I am still doing it."},
  {t:"cta", kicker:"Your next step", h:"Let's finish your book together.", p:"If you want a second set of eyes on your manuscript and a clear plan to finish and edit it, this is what I do one-to-one with writers.", cta:"Work with me", disclaimer:"Educational content only. No result is guaranteed. Results vary from writer to writer and depend entirely on your own work. Nothing here is a promise of publication, representation, sales, or income."}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section'); el.className='slide';
  let html='<div class="moon">☾</div>';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.num) html+='<div class="num">'+s.num+'</div>';
  if(s.h && s.t!=='hook') html+='<h'+(s.t==='title'?'1':'2')+'>'+s.h+'</h'+(s.t==='title'?'1':'2')+'>';
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.lede) html+='<div class="lede">'+s.lede+'</div>';
  if(s.cells){ html+='<div class="grid3">'; s.cells.forEach(c=>{html+='<div class="cell"><h3>'+c.k+'</h3><p>'+c.v+'</p></div>';}); html+='</div>'; }
  if(s.p) html+='<p'+(s.t==='who'||s.t==='hook'?' class="sub"':'')+'>'+s.p+'</p>';
  if(s.cta) html+='<a class="cta" href="#">'+s.cta+'</a>';
  if(s.disclaimer) html+='<div class="disc">'+s.disclaimer+'</div>';
  html+='<div class="foot">The Creative Trenches · L.E. McQuinn · '+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=html; deck.appendChild(el);
});
</script>
</body>
</html>
