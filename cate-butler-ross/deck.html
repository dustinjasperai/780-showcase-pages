<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Read Magnet Method - A Live Masterclass with Cate Butler Ross</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f5f0; --panel:#ffffff; --ink:#40495b; --rule:#d8c3b9;
    --accent:#567aa0; --accent2:#d992bf; --muted:#7a8293;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Lato",system-ui,sans-serif;line-height:1.55}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .k{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:1.4rem}
  h1{font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.04;color:var(--ink)}
  h2{font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(1.9rem,4.4vw,3.1rem);line-height:1.1;color:var(--ink)}
  .sub{font-size:clamp(1.1rem,2.1vw,1.5rem);color:var(--accent);font-family:"Playfair Display",serif;font-style:italic;margin-top:1.3rem;max-width:40ch}
  .body{font-size:clamp(1.05rem,1.7vw,1.35rem);margin-top:1.6rem;max-width:46ch;color:var(--ink)}
  .foot{position:absolute;bottom:4vh;left:9vw;font-size:.85rem;color:var(--muted);letter-spacing:.04em}
  .num{position:absolute;top:4vh;right:9vw;font-size:.8rem;color:var(--muted)}
  ul{list-style:none;margin-top:2rem;max-width:48ch}
  li{font-size:clamp(1.05rem,1.8vw,1.4rem);padding:.85rem 0 .85rem 1.6rem;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:1.45rem;width:.6rem;height:.6rem;background:var(--accent);border-radius:50%}
  .pillars li:before{background:var(--accent2)}
  .quote h2{max-width:22ch}
  .quote .sub{color:var(--muted);font-style:italic}
  .title-slide{background:linear-gradient(180deg,#ffffff 0%,var(--bg) 100%)}
  .title-slide h1{font-size:clamp(2.8rem,8vw,5.4rem)}
  .cta{background:var(--panel)}
  .disc{margin-top:2.4rem;font-size:.82rem;color:var(--muted);max-width:52ch;line-height:1.5}
  .mark{color:var(--accent)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title', k:'A Live Masterclass', h:'The Read Magnet Method', sub:'Write the book that turns readers into clients.', foot:'with Cate Butler Ross, founder of The Luminous'},
  {t:'statement', k:'Who this is for', h:'You already know there is a book in you.', body:'You have the experience, the clients, and the stories. What you do not have yet is a book that does something for the business once it is written.'},
  {t:'statement', k:'The trap', h:'Most authority books get read and then forgotten.', body:'They earn a kind comment and a place on a shelf. They do not earn a single call. A book that only gets read is a vanity project wearing a business suit.'},
  {t:'list', k:'Three books that do not sell', h:'The ones most experts write by accident', list:['The memoir no buyer actually asked for','The textbook that reads like a manual','The everything book that speaks to no one']},
  {t:'quote', h:'A good book gets read. A Read Magnet gets you hired.', sub:'That one difference changes every decision about the book.'},
  {t:'statement', k:'The reframe', h:'Readership is a vanity metric. Conversion is the job.', body:'The real question is not how do I write a good book. It is how do I write a book that moves the right reader to reach out. That is a Read Magnet.'},
  {t:'statement', k:'Part one', h:'The strategic hook', body:'Before a word is written, the book needs a hook that makes it inevitable: one sharp promise to one specific reader. Broad books get polite nods. Narrow books get clients.'},
  {t:'list', k:'The niche advantage', h:'Why a narrower book out-sells a broad one', list:['It names one reader and speaks only to them','It lets you own an angle no one else can claim','It gives every chapter a job in the sale','It makes the invitation to work with you obvious']},
  {t:'statement', k:'Part two', h:'The Read Magnet Method', body:'A book becomes a Read Magnet when three things are built in on purpose: the right story, the right structure, and the reader-to-client switch.'},
  {t:'pillars', k:'The method', h:'Three things built in on purpose', list:['Soul Story: the one true story that positions you and calls in your soul tribe','The Blueprint: a chapter by chapter architecture where every chapter earns its place','The Switch: the invitations and proof that move a reader to reach out']},
  {t:'statement', k:'Pillar one', h:'Soul Story', body:'The story you are slightly afraid to tell is usually the one that does the work. Told with craft, it builds trust faster than any credential, and it calls in the readers who were already your people.'},
  {t:'statement', k:'Pillar two', h:'The Book Blueprint', body:'A book is architecture before it is writing. Concept, outline, and strategic positioning come first, so the writing is the easy part and nothing on the page is there by accident.'},
  {t:'statement', k:'Pillar three', h:'The reader-to-client switch', body:'A Read Magnet does not end with the last chapter. It carries the invitations, the proof, and the next step that turn a reader quietly nodding along into a reader asking how to work with you.'},
  {t:'statement', k:'Part three', h:'A book that reads like you and sells like you', body:'A finished book that reads like you at your best and works like your most generous sales conversation, on repeat, without you in the room.'},
  {t:'list', k:'What changes', h:'When the book is a Read Magnet', list:['The right readers arrive already trusting you','Discovery calls start warmer and shorter','You stop explaining your value and start choosing clients','One book keeps working long after launch week']},
  {t:'statement', k:'Why me', h:'Twenty years turning experience into words that land.', body:'A features writer and commissioning editor for Woman & Home and Country Living, I have written for David Attenborough, Sharon Osbourne and Mary Berry. Since 2013 I have helped coaches and founders write books that do real work, and I wrote Soul Story so more people could do the same.'},
  {t:'quote', h:'Your book should be the hardest working member of your team.', sub:'A Read Magnet is how you give it a quota.'},
  {t:'cta', k:'Your next step', h:'Let us plan your Read Magnet', sub:'If you are ready to write the book that turns readers into clients, the next step is a conversation about your book and the angle only you can own.', body:'Book a call with me at The Luminous to map your Book Blueprint.', disc:'This masterclass is educational. No income or business result is guaranteed. Results vary and depend on your own work, your market, and many factors outside any teacher\'s control.'}
];
function esc(x){return (x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function render(){
  const root=document.getElementById('deck');
  S.forEach((s,i)=>{
    const sec=document.createElement('section');
    let cls='slide';
    if(s.t==='title')cls+=' title-slide';
    if(s.t==='quote')cls+=' quote';
    if(s.t==='pillars')cls+=' pillars';
    if(s.t==='cta')cls+=' cta';
    sec.className=cls;
    let html='';
    if(s.k)html+='<div class="k">'+esc(s.k)+'</div>';
    if(s.t==='title'){html+='<h1>'+esc(s.h)+'</h1>';}
    else if(s.t==='quote'){html+='<h2>'+esc(s.h)+'</h2>';}
    else{html+='<h2>'+esc(s.h)+'</h2>';}
    if(s.sub)html+='<div class="sub">'+esc(s.sub)+'</div>';
    if(s.body)html+='<div class="body">'+esc(s.body)+'</div>';
    if(s.list){html+='<ul>';s.list.forEach(it=>{html+='<li>'+esc(it)+'</li>';});html+='</ul>';}
    if(s.disc)html+='<div class="disc">'+esc(s.disc)+'</div>';
    if(s.foot)html+='<div class="foot">'+esc(s.foot)+'</div>';
    html+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
    sec.innerHTML=html;
    root.appendChild(sec);
  });
}
render();
</script>
</body>
</html>
