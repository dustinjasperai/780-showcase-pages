<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Found by the Machines — a masterclass by Erica Julson, The Unconventional RD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f1;        /* warm off-white, from her #ffffff ground warmed toward sand #d3cfb6 */
    --panel:#ffffff;
    --ink:#1d3b3a;       /* her dominant deep pine-teal */
    --accent:#008e8a;    /* her teal */
    --spot:#f26087;      /* her coral, emphasis marks only */
    --muted:#4f6b6a;
    --rule:#d7e0de;
    --sand:#d3cfb6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:52px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 2px rgba(29,59,58,.04)}
  .eyebrow{font-family:"League Spartan",sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"League Spartan",sans-serif;font-weight:800;font-size:46px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"League Spartan",sans-serif;font-weight:700;font-size:33px;line-height:1.1;margin-bottom:18px}
  p{font-size:19px;line-height:1.55;color:var(--muted);max-width:60ch;margin-bottom:14px}
  p.lead{font-size:21px;color:var(--ink)}
  .big{font-family:"League Spartan",sans-serif;font-weight:700;font-size:28px;color:var(--ink);line-height:1.2;max-width:24ch}
  ul{list-style:none;margin:10px 0 0}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.5;color:var(--ink);margin-bottom:14px;max-width:58ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:11px;height:11px;border-radius:3px;background:var(--accent)}
  li .k{font-weight:700;font-family:"League Spartan",sans-serif}
  .phase{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
  .num{flex:none;width:46px;height:46px;border-radius:12px;background:var(--ink);color:var(--bg);font-family:"League Spartan",sans-serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
  .phase h3{font-family:"League Spartan",sans-serif;font-weight:700;font-size:21px;color:var(--ink);margin-bottom:4px}
  .phase span{font-size:17px;color:var(--muted);line-height:1.45;display:block;max-width:52ch}
  /* answer-card motif: content surfacing as a recommended answer */
  .card{background:var(--bg);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;padding:18px 20px;margin-top:20px;max-width:60ch}
  .card .q{font-size:15px;color:var(--muted);margin-bottom:6px}
  .card .a{font-size:18px;color:var(--ink);line-height:1.4}
  .card .src{font-size:13px;color:var(--accent);font-weight:700;font-family:"League Spartan",sans-serif;margin-top:10px;letter-spacing:.03em}
  .mark{color:var(--spot);font-weight:700}
  .cover{background:var(--ink);border-color:var(--ink)}
  .cover .eyebrow{color:var(--sand)}
  .cover h1{color:#ffffff;font-size:52px}
  .cover p{color:#cfe0de}
  .cover .brand{margin-top:auto;font-family:"League Spartan",sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--sand)}
  .closer{background:var(--ink);border-color:var(--ink)}
  .closer .eyebrow{color:var(--sand)}
  .closer h2{color:#ffffff}
  .closer p{color:#cfe0de}
  .btn{display:inline-block;margin-top:14px;background:var(--accent);color:#ffffff;font-family:"League Spartan",sans-serif;font-weight:700;font-size:18px;letter-spacing:.02em;padding:14px 26px;border-radius:10px;text-decoration:none}
  .disc{margin-top:22px;font-size:13px;color:#9fb7b5;max-width:62ch;line-height:1.5}
  .credit{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
  .stat{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:16px 20px}
  .stat b{font-family:"League Spartan",sans-serif;font-size:30px;color:var(--accent);display:block}
  .stat span{font-size:15px;color:var(--muted)}
  .foot{text-align:center;font-size:13px;color:#9fb7b5;padding-top:8px}
  @media(max-width:640px){.slide{padding:34px 24px;min-height:auto}h1{font-size:34px}.cover h1{font-size:38px}h2{font-size:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">The Unconventional RD &middot; Search Savvy &middot; a live masterclass</div>
<script>
const S=[
 {t:'cover',eyebrow:'A live masterclass for food & nutrition pros',h1:'Found by the Machines',p:'How to keep your content recommended as search moves from Google to AI, and turn that traffic back into income.',brand:'Erica Julson, MS, RDN &middot; The Unconventional RD'},

 {t:'plain',eyebrow:'What this hour covers',h2:'The search ground is moving under you',bodies:['For fifteen years the game was simple: rank on Google, get the click, grow your list. That game is quietly ending.','In the next hour I will show you what answer engines changed, the method I use to stay recommended through the shift, and how found traffic still becomes income on the other side.']},

 {t:'list',eyebrow:'Who this is for',h2:'If you have built anything online, this is you',items:[['Registered dietitians & nutritionists','with a blog, a site, or digital products that depend on search traffic.'],['Food bloggers & wellness creators','whose income rises and falls with how findable their content is.'],['Pros who did SEO "right"','and are watching the clicks slip anyway.']]},

 {t:'big',eyebrow:'The trap',big:'You did everything the SEO guides told you to. The traffic is still slipping. It is not your content. It is where the answer now lives.'},

 {t:'card',eyebrow:'The dark reframe',h2:'The click is disappearing',p:'Someone types your exact question. The answer engine writes a tidy paragraph, cites a couple of sources, and the person never opens a single post. Ranking number one does not mean being found anymore.',card:{q:'"best protein for runners over 40"',a:'A clean 4-sentence answer, sourced to whoever the machine trusts most on this topic.',src:'0 clicks to the pages behind it'}},

 {t:'plain',eyebrow:'Part one',h2:'From a list of links to a single answer',bodies:['Classic SEO optimized to be one of ten blue links. The reader did the choosing.','Answer engines do the choosing for them. They read the whole web, decide who to trust on a topic, and hand back one recommendation. You are either the source it names or you are invisible, and there is no page two to hide on.']},

 {t:'twocol',eyebrow:'The distinction most people miss',h2:'SEO gets you ranked. AEO gets you recommended.',left:{h:'SEO (classic)',items:['Compete for a link on the results page','Win the click, then win the reader','Optimized for the crawler + the human']},right:{h:'AEO (answer engine optimization)',items:['Be the source the machine trusts','Get quoted inside the answer itself','Structured so AI can read, trust, cite you']}},

 {t:'plain',eyebrow:'The cost of waiting',h2:'Invisible happens quietly',bodies:['Nothing breaks. No error, no penalty email. Your rankings can even hold while your traffic bleeds, because the answer is being served above you.','By the time the drop shows up in your income, you are a year behind the pros who adapted early. The window to be the trusted source on your topics is open right now, while most of your field has not moved.']},

 {t:'phases',eyebrow:'Part two: the method',h2:'The REPS+ method',sub:'My framework for getting content found and recommended, rebuilt for the AI era. The "+" is the shift everything else in nutrition SEO has not made yet.',phases:[['R','Research first','Start from what people actually ask and what the machines already surface, before you write a word. Demand before production, always.'],['E','Execute','Build the content and the page to match that demand, in the format the answer wants.'],['P','Promote','Earn the signals and mentions that tell the engines you are worth trusting on this topic.'],['S','Stand out','Be the clearest, most citable answer in your niche, not the longest post.']]},

 {t:'phase-plus',eyebrow:'The "+" that changes everything',h2:'Make yourself the machine\'s answer',plus:[['AI Operating System','The tools and repeatable workflows one person uses to research, draft and optimize without a team.'],['Make your site AI-ready (AEO)','Structure the site and its content so answer engines, not just Google, can read, trust and recommend it.']]},

 {t:'big',eyebrow:'The principle under all of it',big:'Research the keyword first. Then build the content to match the demand. Never brainstorm a topic and go hunting for keywords afterward.'},

 {t:'plain',eyebrow:'Part three',h2:'Found traffic is only half the job',bodies:['Getting recommended by the machines fills the top of your world with the right people. That is the hard half, and most teaching stops there.','The other half is turning those readers into buyers, on purpose, while you sleep.']},

 {t:'list',eyebrow:'The revenue track',h2:'Turn attention into income',items:[['Grow your email list','so you own the audience the machines sent you, not rent it.'],['Sell digital products','package what you already know into something that sells without a call.'],['Set up evergreen funnels','so the enrollment keeps happening after the launch is over.']]},

 {t:'card',eyebrow:'A day on the new engine',h2:'When it is working',p:'A dietitian asks the answer engine a question in your niche, and your work is the source it names. A slice of those readers join your list that week. A slice of those buy. None of it needed you to be online at that moment.',card:{q:'"how to start a nutrition blog that gets found"',a:'Recommended answer built on content from The Unconventional RD.',src:'Found &rarr; list &rarr; buyer'}},

 {t:'credit',eyebrow:'Why listen to me',h2:'I have been the unconventional one since 2010',p:'I left clinical dietetics to build an online business the long way, and I have spent fifteen years teaching other food and nutrition pros to do the same. When search started moving to AI, I rebuilt the whole method instead of defending the old one.',stats:[['15+ yrs','building blogs, courses & memberships'],['1,000+','wellness pros taught inside my programs'],['RDN','registered dietitian, not a generic marketer']]},

 {t:'plain',eyebrow:'Recap',h2:'The whole hour in four lines',bodies:['Search is moving from a list of links to a single recommended answer.','SEO gets you ranked; AEO gets you recommended, and that is now the game.','REPS+ is how you become the source the machine trusts on your topics.','Found traffic becomes income on purpose, through a list, products and evergreen funnels.']},

 {t:'cta',eyebrow:'Come be unconventional with me',h2:'Rebuild your search engine for the AI era',p:'Search Savvy is where food and nutrition pros rebuild their whole search and income engine for the AI era, with me, over the next few months. If today reframed how you think about being found, that is where we go deep.',cta:'Join Search Savvy',disc:'Educational content only. No income or results are promised or guaranteed; outcomes vary with your market, effort, and execution.'}
];

const esc=s=>s;
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cover'?' cover':'')+(s.t==='cta'?' closer':'');
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='cover'){ h+=`<h1>${s.h1}</h1><p class="lead">${s.p}</p><div class="brand">${s.brand}</div>`; }
  else if(s.t==='big'){ h+=`<div class="big">${s.big}</div>`; }
  else if(s.t==='plain'){ h+=`<h2>${s.h2}</h2>`; (s.bodies||[]).forEach(b=>h+=`<p>${b}</p>`); }
  else if(s.t==='list'){ h+=`<h2>${s.h2}</h2><ul>`; s.items.forEach(it=>h+=`<li><span class="k">${it[0]}.</span> ${it[1]}</li>`); h+='</ul>'; }
  else if(s.t==='twocol'){ h+=`<h2>${s.h2}</h2><div style="display:flex;gap:28px;flex-wrap:wrap;margin-top:8px">`;
     [s.left,s.right].forEach((c,i)=>{ h+=`<div style="flex:1;min-width:220px"><div class="phase"><div class="num" style="${i?'':'background:var(--accent)'}">${i?'AEO':'SEO'}</div><div><h3>${c.h}</h3></div></div><ul>`; c.items.forEach(x=>h+=`<li>${x}</li>`); h+='</ul></div>'; });
     h+='</div>'; }
  else if(s.t==='phases'){ h+=`<h2>${s.h2}</h2><p>${s.sub}</p>`; s.phases.forEach(p=>h+=`<div class="phase"><div class="num">${p[0]}</div><div><h3>${p[1]}</h3><span>${p[2]}</span></div></div>`); }
  else if(s.t==='phase-plus'){ h+=`<h2>${s.h2}</h2>`; s.plus.forEach(p=>h+=`<div class="phase"><div class="num" style="background:var(--spot)">+</div><div><h3>${p[0]}</h3><span>${p[1]}</span></div></div>`); }
  else if(s.t==='card'){ h+=`<h2>${s.h2}</h2><p>${s.p}</p><div class="card"><div class="q">${s.card.q}</div><div class="a">${s.card.a}</div><div class="src">${s.card.src}</div></div>`; }
  else if(s.t==='credit'){ h+=`<h2>${s.h2}</h2><p>${s.p}</p><div class="credit">`; s.stats.forEach(st=>h+=`<div class="stat"><b>${st[0]}</b><span>${st[1]}</span></div>`); h+='</div>'; }
  else if(s.t==='cta'){ h+=`<h2>${s.h2}</h2><p>${s.p}</p><a class="btn" href="https://www.theunconventionalrdbb.com/search-savvy-membership/">${s.cta}</a><div class="disc">${s.disc}</div>`; }
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
