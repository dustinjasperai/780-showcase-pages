<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fully Booked, Still Broke — The Confidence Project Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f9;        /* warm near-white ground, from light site scheme */
    --panel:#f1e8ef;     /* soft orchid-tinted panel */
    --ink:#33343b;       /* probed ink */
    --muted:#756e6e;     /* probed warm grey */
    --rule:#d9c7d6;      /* orchid-grey hairline */
    --accent:#b87daf;    /* her dominant brand orchid (#b87daf, 32 uses) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:#ffffff;border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 26px;min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(51,52,59,.03);
  }
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:52px;line-height:1.07;letter-spacing:-.01em}
  h2{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:38px;line-height:1.12;margin-bottom:10px}
  .lede{font-size:21px;color:var(--muted);margin-top:18px;max-width:30em;line-height:1.5}
  p.body{font-size:19px;line-height:1.6;margin-top:14px;max-width:34em}
  .big{font-family:"Newsreader",Georgia,serif;font-size:34px;line-height:1.25;font-style:italic;color:var(--ink);max-width:24em}
  ul{margin:20px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:34em}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:21px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .steps{display:flex;gap:16px;margin-top:26px;flex-wrap:wrap}
  .step{flex:1;min-width:210px;background:var(--panel);border-radius:12px;padding:22px 20px}
  .step .n{font-family:"Newsreader",serif;font-size:15px;color:var(--accent);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .step h3{font-family:"Newsreader",serif;font-size:24px;margin:6px 0 8px}
  .step p{font-size:15.5px;color:var(--muted);line-height:1.45}
  .kicker{font-size:17px;color:var(--accent);font-weight:600;margin-bottom:10px;letter-spacing:.02em}
  .foot{margin-top:28px;font-size:14px;color:var(--muted);max-width:40em;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;font-weight:600;
    font-size:18px;padding:15px 30px;border-radius:999px;text-decoration:none}
  .slide.title{background:linear-gradient(180deg,#fff 0%,var(--panel) 100%)}
  .slide.cta{background:var(--panel)}
  .num{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted);opacity:.7}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'The Confidence Project · Live Masterclass',
   h:'Fully Booked, Still Broke',
   lede:'How to run your fitness business the way you program a client, so the money finally matches the work.'},

  {t:'who', eyebrow:'Who this is for',
   h:'You coach for a living. You are great at it.',
   body:'This is for women in the fitness industry who are booked solid, working harder every month, and still somehow keeping less than they should. If the training is dialed in but the business feels like guesswork, you are in the right room.'},

  {t:'trap', eyebrow:'The trap',
   big:'You keep adding clients to fix a money problem that more clients will never fix.'},

  {t:'reframe', eyebrow:'The reframe',
   h:'A bigger calendar just hides the leak.',
   body:'When the numbers are a mystery, every new client adds hours, stress, and admin on top of a system that already was not paying you properly. The fix is not more. The fix is clarity.'},

  {t:'part', kicker:'Part One', h:'You were trained to coach bodies, never books.',
   body:'Nobody handed you a business education with your certification. So pricing happens by feel, expenses live in your head, and "profit" is whatever is left in the account on the 30th. That is not a discipline problem. It is a systems gap.'},

  {t:'cost', eyebrow:'What the gap costs you',
   h:'Three quiet leaks',
   list:['Pricing by vibes, so you undercharge the clients who value you most.',
         'No clear read on what is actually profitable versus just busy.',
         'A schedule built around demand instead of around the life you wanted.']},

  {t:'twobusy', eyebrow:'Two kinds of busy',
   big:'Busy that builds something, and busy that just fills the calendar. Most trainers cannot tell which one they are living in, because the numbers are not in front of them.'},

  {t:'method', eyebrow:'Part Two · The method',
   h:'Assess. Program. Progress.',
   body:'You already run this loop with every client. We are going to run it on your business. Same discipline, same honesty with the numbers, same patience with the progression.',
   steps:[
     {n:'Step 1', t:'Assess', p:'Get the real numbers in front of you and find the one bottleneck throttling the whole business.'},
     {n:'Step 2', t:'Program', p:'Build the plan: pricing, systems, and a money setup you can actually read.'},
     {n:'Step 3', t:'Progress', p:'Implement over 90 days and adjust like a training block, not a crash diet.'}
   ]},

  {t:'assess', kicker:'Assess', h:'You cannot program what you have not assessed.',
   body:'Before a single change, we run a diagnostic on income, pricing, and workload. Most owners discover their bottleneck is not sales at all. It is one price, one offer, or one hour of the week doing none of the work.'},

  {t:'program', kicker:'Program', h:'Build the plan on purpose.',
   body:'Now we design it: what you charge, what you stop offering, which systems get built once so they run without you. The goal is a business that pays you more for fewer moving parts, not a longer to-do list.'},

  {t:'money', eyebrow:'The money system',
   h:'Financially Fit: read your finances in minutes a week.',
   body:'The reason most trainers avoid their numbers is that the numbers are a mess. So we set up a simple, color-coded money system that turns the books into a few minutes of clarity each week, for people who would rather coach than crunch numbers.'},

  {t:'progress', kicker:'Progress', h:'Small, honest adjustments beat big resets.',
   body:'You would never tell a client to overhaul everything in week one. The business works the same way. Over 90 days we move one lever at a time and let the data, not the panic, decide the next move.'},

  {t:'objection', eyebrow:'If you are thinking it',
   big:'"I am just not a numbers person." Neither are most of my clients on day one. That is exactly why the system is built to take minutes, not hours.'},

  {t:'picture', eyebrow:'Part Three · What it looks like',
   h:'What changes when the system is in place',
   list:['Profit you can actually see, not guess at.',
         'Pricing you can defend because you know what the work is worth.',
         'A schedule you designed, with paid time off that was planned, not stolen.']},

  {t:'whyme', eyebrow:'Why me',
   h:'I have run the business you are trying to fix.',
   body:'I owned an all-women strength and conditioning gym, I have an MBA, and I spent 15+ years in this industry before stepping back to coach the business side full time through The Confidence Project. I am not teaching theory. I am teaching the system I needed when I was in it.'},

  {t:'recap', eyebrow:'The whole thing in one slide',
   h:'Assess, then Program, then Progress.',
   body:'Find the bottleneck. Build the plan. Run it for 90 days like a program, not a resolution. That is how a fully booked trainer finally gets paid like one.'},

  {t:'cta', eyebrow:'Your next step',
   h:'Ready to run the numbers?',
   body:'If you want help turning this into a plan for your business, the next step is a Business Diagnostic, a focused look at your income, pricing, and workload with a written plan for where to go next.',
   btn:'Start with a Business Diagnostic',
   disclaimer:'Educational only. No specific income or result is guaranteed. Results vary and depend on your market, your offer, and your own implementation. This masterclass shares frameworks and examples, not a promise of earnings.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'slide ' + (s.t === 'title' ? 'title' : (s.t === 'cta' ? 'cta' : ''));
  let html = '';
  if (s.eyebrow) html += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.h) html += (s.t === 'title' ? '<h1>' + s.h + '</h1>' : '<h2>' + s.h + '</h2>');
  if (s.lede) html += '<p class="lede">' + s.lede + '</p>';
  if (s.big) html += '<p class="big">' + s.big + '</p>';
  if (s.body) html += '<p class="body">' + s.body + '</p>';
  if (s.list) { html += '<ul>'; s.list.forEach(x => html += '<li>' + x + '</li>'); html += '</ul>'; }
  if (s.steps) { html += '<div class="steps">'; s.steps.forEach(st =>
      html += '<div class="step"><div class="n">' + st.n + '</div><h3>' + st.t + '</h3><p>' + st.p + '</p></div>'); html += '</div>'; }
  if (s.btn) html += '<a class="cta-btn" href="https://christinamontalvo.com/workwithme/">' + s.btn + '</a>';
  if (s.disclaimer) html += '<div class="foot">' + s.disclaimer + '</div>';
  html += '<div class="num">' + (i + 1) + ' / ' + S.length + '</div>';
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
