<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cohesive Full-Funnel - a masterclass by FullFunnel.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8f5; --panel:#ebf3ec; --rule:#2c2c2c; --ink:#1c2320; --accent:#09a64c;
    --muted:#4a554e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,sans-serif;line-height:1.5}
  .slide{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:7vh 8vw;border-bottom:1px solid rgba(44,44,44,.08)}
  .inner{width:100%;max-width:980px}
  h1,h2,h3,.kicker{font-family:"Sora",system-ui,sans-serif}
  .kicker{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:1.1rem}
  h1{font-size:clamp(2.2rem,5.4vw,3.9rem);line-height:1.04;font-weight:700;letter-spacing:-.015em}
  h2{font-size:clamp(1.7rem,3.8vw,2.7rem);line-height:1.1;font-weight:600;letter-spacing:-.01em;margin-bottom:1.3rem}
  h3{font-size:1.05rem;font-weight:600;color:var(--accent);margin-bottom:.4rem}
  p{font-size:clamp(1.05rem,1.7vw,1.3rem);color:var(--muted);max-width:60ch;margin-bottom:1rem}
  p.lead{color:var(--ink);font-size:clamp(1.2rem,2.1vw,1.55rem)}
  .sub{font-size:clamp(1.05rem,1.8vw,1.35rem);color:var(--muted);margin-top:1.4rem;max-width:62ch}
  .present{margin-top:2.4rem;font-size:1rem;color:var(--ink);font-weight:600}
  .present span{color:var(--muted);font-weight:400}
  ul{list-style:none;margin-top:.6rem}
  li{position:relative;padding-left:1.5rem;margin-bottom:.85rem;font-size:clamp(1.02rem,1.6vw,1.22rem);color:var(--ink);max-width:66ch}
  li::before{content:"";position:absolute;left:0;top:.6em;width:.55rem;height:.55rem;background:var(--accent);border-radius:2px}
  li b{font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.6rem}
  .card{background:var(--panel);border:1px solid rgba(9,166,76,.18);border-radius:12px;padding:1.3rem}
  .card h3{margin-bottom:.5rem}
  .card p{font-size:1rem;margin:0}
  .bands{margin-top:1.8rem}
  .band{background:var(--panel);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:1rem 1.3rem;margin-bottom:.7rem}
  .band:nth-child(1){width:100%}
  .band:nth-child(2){width:78%}
  .band:nth-child(3){width:54%}
  .band b{font-family:"Sora",sans-serif;font-weight:600}
  .stat{display:flex;gap:2.4rem;flex-wrap:wrap;margin-top:1.8rem}
  .stat div{min-width:150px}
  .stat b{font-family:"Sora",sans-serif;font-size:2.4rem;font-weight:700;color:var(--accent);display:block;line-height:1}
  .stat span{font-size:.98rem;color:var(--muted)}
  .section-slide .inner{border-top:3px solid var(--accent);padding-top:1.6rem}
  .cta .inner{background:var(--panel);border-radius:16px;padding:3rem;border:1px solid rgba(9,166,76,.2)}
  .steps{font-size:clamp(1.05rem,1.7vw,1.3rem);color:var(--ink);margin:.6rem 0}
  .disc{margin-top:2.2rem;font-size:.86rem;color:var(--muted);max-width:64ch;line-height:1.5}
  .nums{font-family:"Sora",sans-serif;color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', html:`
    <div class="kicker">A FullFunnel.io Masterclass</div>
    <h1>The Cohesive Full-Funnel</h1>
    <p class="sub">How to blend demand generation and account-based marketing so 20%+ of your target accounts engage, and you predictably land and expand 5-figure deals.</p>
    <div class="present">Andrei Zinkevich &amp; Vladimir Blagojevic <span>/ Founders, FullFunnel.io</span></div>
  `},
  {t:'who', html:`
    <div class="kicker">Who this is for</div>
    <h2>Built for high-ACV, long-cycle B2B</h2>
    <p class="lead">If you lead marketing or revenue at a B2B tech or service company with 5-6 figure deal sizes, a buying committee, and a sales cycle measured in months, this is for you.</p>
    <p>You do not need a big team. Our own program runs on two people. What you need is a system that works the way your buyers actually buy.</p>
  `},
  {t:'trap', html:`
    <div class="kicker">The trap</div>
    <h2>You were told to capture demand</h2>
    <p class="lead">Run ads to cold traffic. Gate an e-book. Pass the form-fills to sales. Send the webinar list to the SDRs. Publish a weekly SEO post and wait.</p>
    <p>So you did it. And most of the budget quietly evaporated, because only a small slice of your market is actively buying right now.</p>
  `},
  {t:'reframe', html:`
    <div class="kicker">The uncomfortable truth</div>
    <h2>A download is not a buying intent</h2>
    <p class="lead">Five-figure buyers do not fill out a form and get nurtured into a deal by a five-email sequence.</p>
    <p class="lead">They ask the people they trust. They decide as a committee. And they buy from the brands they already know, like, and trust before a sales call ever happens.</p>
  `},
  {t:'section', cls:'section-slide', html:`
    <div class="kicker">Part One</div>
    <h2>Why the old playbook leaks</h2>
    <p>Five common motions, and the reason each one underperforms for complex B2B.</p>
  `},
  {t:'leaks', html:`
    <div class="kicker">The five leaks</div>
    <h2>Where the budget goes to die</h2>
    <ul>
      <li><b>Ads straight to a demo or trial.</b> Non-intent channels reach buyers who are not in market, so you come late and look like a commodity.</li>
      <li><b>Gated content to a nurture sequence.</b> A download signals curiosity, not a decision.</li>
      <li><b>Me-too SEO.</b> Keyword-driven content your buyers scroll past.</li>
      <li><b>Pitch webinars.</b> Nobody signs up to watch 60 minutes of product features.</li>
      <li><b>Spray-and-pray social.</b> Company news and links that deliver zero value to a buyer.</li>
    </ul>
  `},
  {t:'reality', html:`
    <div class="kicker">The buying reality</div>
    <h2>Most of the market is not buying today</h2>
    <p class="lead">At any moment only a small fraction of your accounts are in an active buying cycle.</p>
    <p>The rest are forming opinions long before they raise a hand. If you only chase the ones ready now, you fight every competitor on price at the worst possible moment.</p>
  `},
  {t:'section', cls:'section-slide', html:`
    <div class="kicker">Part Two</div>
    <h2>The Cohesive Full-Funnel Model</h2>
    <p>One brand journey toward one prioritized account list. Not two separate motions.</p>
  `},
  {t:'core', html:`
    <div class="kicker">The core idea</div>
    <h2>Demand gen and ABM are one motion</h2>
    <p class="lead"><b>Demand generation</b> creates awareness and demand across your whole target market.</p>
    <p class="lead"><b>Account-based marketing</b> warms up and activates the accounts that engage.</p>
    <p>Stop running them as rival teams. Point both at the same prioritized list, and the funnel stops leaking at the seams.</p>
  `},
  {t:'lists', html:`
    <div class="kicker">Account segmentation</div>
    <h2>Three lists, not one blast</h2>
    <p>Divide qualified accounts dynamically by revenue potential, vendor awareness, and evidence of need.</p>
    <div class="bands">
      <div class="band"><b>Cluster ICP</b> - fits your profile, but is not aware of you yet. Create awareness here.</div>
      <div class="band"><b>Future Pipeline</b> - engaged with your content, need not yet known. Nurture and qualify.</div>
      <div class="band"><b>Active Focus</b> - high intent and in market. Activate with your sharpest plays.</div>
    </div>
  `},
  {t:'tiers', html:`
    <div class="kicker">Personalization that scales</div>
    <h2>Tier the effort to the opportunity</h2>
    <div class="grid">
      <div class="card"><h3>Tier 1</h3><p>One-to-one, highly personalized campaigns for your most valuable accounts.</p></div>
      <div class="card"><h3>Tier 2</h3><p>Vertical and job-role personalization for clusters of similar accounts.</p></div>
      <div class="card"><h3>Tier 3</h3><p>Vertical-based personalization at scale across the broader list.</p></div>
    </div>
  `},
  {t:'pillars', html:`
    <div class="kicker">The 8 Pillars of ABM</div>
    <h2>What a real program is built on</h2>
    <ul>
      <li>Goal setting and the revenue math behind it</li>
      <li>A sharp ICP and buying-committee map</li>
      <li>Account list building from real signals</li>
      <li>Research and value-proposition mapping</li>
      <li>Development of the activation playbooks</li>
      <li>Team and skillset, Tech stack, and Reporting that ties back to pipeline</li>
    </ul>
  `},
  {t:'pilot', html:`
    <div class="kicker">The pilot framework</div>
    <h2>Start small: 1-1-1-1-1-1-1-10</h2>
    <p class="lead">One market. One vertical. One SDR. One marketer. One intent source. One warm-up tactic. One tier. A maximum of ten accounts.</p>
    <p>You do not need budget approval for a new department to prove this. You need one focused pilot you can learn from and then scale.</p>
  `},
  {t:'warmup', html:`
    <div class="kicker">The 4 warm-up plays</div>
    <h2>How engaged accounts get warm</h2>
    <div class="grid">
      <div class="card"><h3>Content collaboration</h3><p>Co-create with voices your buyers already trust.</p></div>
      <div class="card"><h3>Virtual events</h3><p>Educational sessions that earn attention, not pitches.</p></div>
      <div class="card"><h3>Social engagement</h3><p>Show up natively where your buyers research.</p></div>
      <div class="card"><h3>Demand-gen advertising</h3><p>Reach the target list with value, not a cold demo ask.</p></div>
    </div>
  `},
  {t:'section', cls:'section-slide', html:`
    <div class="kicker">Part Three</div>
    <h2>From one pilot to a revenue engine</h2>
    <p>How the model compounds from a first pilot into a repeatable, evergreen motion.</p>
  `},
  {t:'stages', html:`
    <div class="kicker">The 3 stages of ABM</div>
    <h2>Pilot, operations, scale</h2>
    <ul>
      <li><b>Pilot.</b> Run the 1-1-1-1-1-1-1-10 program on a single channel and prove the motion.</li>
      <li><b>Operations.</b> Document the playbooks so the process no longer lives in your head.</li>
      <li><b>Scale.</b> Extend across verticals and teams, with sales and marketing on one list.</li>
    </ul>
  `},
  {t:'good', html:`
    <div class="kicker">The payoff</div>
    <h2>A process you can repeat on purpose</h2>
    <p class="lead">Higher sales acceptance and reply rates, because teams reach out to accounts that already know the brand.</p>
    <p>Shorter sales cycles, higher ACV, and a pipeline you can forecast, not one you hope refills itself each quarter.</p>
  `},
  {t:'why', html:`
    <div class="kicker">Why learn this from us</div>
    <h2>We run this on ourselves</h2>
    <p>FullFunnel.io started as an unknown brand in September 2020. Using the full-funnel model, with two people, we built:</p>
    <div class="stat">
      <div><b>174</b><span>opportunities generated</span></div>
      <div><b>72</b><span>five-figure inbound opportunities in 12 months</span></div>
      <div><b>40K+</b><span>LinkedIn following</span></div>
      <div><b>100+</b><span>B2B companies advised since 2017</span></div>
    </div>
    <p class="sub">These are our own documented results. Your numbers will depend on your market, offer, and execution.</p>
  `},
  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next step</div>
    <h2>Build your full-funnel ABM program</h2>
    <p class="steps">1. Pick one market and ten accounts.</p>
    <p class="steps">2. Point demand gen and ABM at the same list.</p>
    <p class="steps">3. Run the pilot, document it, then scale.</p>
    <p class="lead" style="margin-top:1.4rem">Want help building it with your team? Start inside the <b>Full-Funnel Academy</b>, or book an <b>ABM consulting</b> call with us at fullfunnel.io.</p>
    <p class="disc">Educational content only. No income, role, or business result is guaranteed. Results vary with your market, offer, team, and execution.</p>
  `}
];
const root = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  const inner = document.createElement('div');
  inner.className = 'inner';
  inner.innerHTML = s.html;
  el.appendChild(inner);
  root.appendChild(el);
}
</script>
</body>
</html>
