<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Strong Man — A Masterclass with Matt Hallock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0b0a; --panel:#171310; --rule:#2d241c;
    --accent:#a08070; --accent-hi:#c0a090; --text:#ece0d2; --muted:#9c8f80;
    --head:'Zilla Slab', Georgia, serif; --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--bg); color:var(--text); font-family:var(--body);}
  .deck{max-width:960px; margin:0 auto; padding:28px 20px 80px;}
  .slide{background:var(--panel); border:1px solid var(--rule); border-radius:14px;
    padding:44px 44px 40px; margin:16px 0; min-height:360px; display:flex; flex-direction:column;
    justify-content:center; position:relative;}
  .kick{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent);
    font-weight:600; margin-bottom:16px;}
  h1{font-family:var(--head); font-weight:700; font-size:46px; line-height:1.05; letter-spacing:-.01em;}
  h2{font-family:var(--head); font-weight:600; font-size:32px; line-height:1.1; margin-bottom:14px;}
  p{font-size:18px; line-height:1.55; color:var(--text); max-width:58ch; margin-top:10px;}
  .sub{color:var(--muted); font-size:20px; margin-top:14px;}
  .n{color:var(--accent-hi); font-family:var(--head); font-weight:700;}
  ul{margin:16px 0 0 0; padding:0; list-style:none;}
  li{font-size:18px; line-height:1.5; padding:12px 0 12px 20px; border-left:2px solid var(--accent);
    margin:10px 0; color:var(--text);}
  li b{color:var(--accent-hi); font-family:var(--head);}
  .foot{position:absolute; bottom:16px; left:44px; font-size:12px; color:var(--muted); letter-spacing:.04em;}
  .pg{position:absolute; bottom:16px; right:44px; font-size:12px; color:var(--muted);}
  .disc{font-size:13px; color:var(--muted); margin-top:22px; max-width:62ch; line-height:1.5;}
  .cta{font-family:var(--head); font-weight:600; font-size:20px; color:var(--bg);
    background:var(--accent); display:inline-block; padding:12px 22px; border-radius:8px; margin-top:20px;}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A LIVE MASTERCLASS FOR CHRISTIAN HUSBANDS', h:'The Strong Man',
   sub:'Why serving her more is quietly killing the attraction, and the three shifts that bring it back.'},
  {t:'agenda', kick:'WHAT WE WILL COVER', h:'Three shifts, one hour',
   items:[
     '<b>Identity.</b> Why your worth cannot keep living in her mood.',
     '<b>The three men.</b> Which one you have become, and which one she needs.',
     '<b>The method.</b> How a strong man tells the truth without a fight.'
  ]},
  {t:'who', kick:'WHO THIS IS FOR', h:'You have done everything right. It is not working.',
   b:'You pray. You provide. You serve. You keep the peace. And somewhere along the way your wife stopped looking at you the way she used to. You are not a bad husband. You were handed the wrong script.'},
  {t:'cost', kick:'WHAT IS AT STAKE', h:'Nobody drifts back by accident',
   b:'A marriage does not usually end in a fight. It ends in a slow quiet, two people being polite in the same house. The good news is that the same slow drift runs in reverse the moment one of you changes. In a marriage, that one is almost always the husband.'},
  {t:'trap', kick:'THE TRAP', h:'The script you were handed',
   b:'Be nicer. Serve harder. Avoid conflict. Wait on God. It sounds holy. But a man who leads from fear of losing her teaches her that he cannot be trusted to lead at all.'},
  {t:'reframe', kick:'THE REFRAME', h:'The opposite of neediness is not silence.',
   b:'Most husbands swing between two failures: chasing her approval, or going quiet to keep the peace. Both read as weakness. The way out is not a third gear of effort. It is a different man.'},
  {t:'part', kick:'PART ONE', h:'The core problem: a borrowed identity',
   b:'When your sense of yourself depends on her mood, every hard conversation becomes a negotiation for your own worth. You cannot lead a marriage from a place you are still trying to earn.'},
  {t:'dna', kick:'PART ONE', h:'DNA of a Man',
   b:'Your masculinity is not the problem in your marriage. Hiding it is. God-given masculinity is the root that rebuilds your mind, your marriage, and your mission. Identity comes from how He made you, not from how well you perform.'},
  {t:'part', kick:'PART TWO', h:'The Three-Man Framework',
   b:'Every husband is living as one of three men. Naming yours is the first honest thing you can do today.'},
  {t:'men', kick:'PART TWO', h:'Which man is she married to?',
   items:[
     '<b>The needy man.</b> Chases her approval and serves from fear. She feels the pull and backs away.',
     '<b>The silent man.</b> Withdraws, keeps the peace, slowly disappears. She stops expecting anything.',
     '<b>The strong man.</b> Honest and direct. Leads without controlling. She can finally lean on him.'
  ]},
  {t:'snare', kick:'PART TWO', h:'The Servanthood Snare',
   b:'Serving your wife more, from insecurity, does not fix a passionless marriage. It confirms it. Service is good. Service used to buy her approval is a transaction, and she feels it before you do.'},
  {t:'part', kick:'PART THREE', h:'How the strong man speaks',
   b:'Strength is not volume and it is not silence. It is a way of telling the truth that makes you safe to be close to. Four moves.'},
  {t:'method', kick:'THE METHOD', h:'Truth. Ownership. Invitation. Release.',
   items:[
     '<b>Truth.</b> Say the real thing, plainly, without a speech.',
     '<b>Ownership.</b> Name your part first. No scorekeeping.',
     '<b>Invitation.</b> Invite her in instead of issuing a verdict.',
     '<b>Release.</b> Let go of controlling her answer. A strong man can hear a no.'
  ]},
  {t:'faith', kick:'PART THREE', h:'Bold, proactive faith',
   b:'Peter did not grow bolder by waiting. The same faith that steps out of the boat is the faith that shows up in your marriage. A husband who moves in confident faith becomes a man his wife can respect again.'},
  {t:'proof', kick:'THE PATTERN I SEE', h:'What changes first',
   b:'It is never the grand gesture. It is the first honest sentence said without flinching. The first decision led without a committee. She notices the steadiness before she can name it, and the steadiness is what desire grows back around.'},
  {t:'picture', kick:'NINETY DAYS FROM NOW', h:'The man who comes home',
   b:'You say the hard thing without rehearsing it for a week. You stop managing her moods. You lead a decision and she exhales because someone finally did. Desire does not come back because you begged for it. It comes back because you became someone worth desiring.'},
  {t:'whyme', kick:'WHY LISTEN TO ME', h:'I lost all of it, then rebuilt it.',
   b:'Ten years ago my health, my finances, my living situation, and my marriage collapsed at the same time. My wife was not sure she would ever like me again, let alone want me. I have spent the years since rebuilding that marriage and teaching other Christian husbands the path I had to find the hard way.'},
  {t:'cta', kick:'YOUR NEXT STEP', h:'Become the strong man your marriage needs.',
   b:'If you are ready to stop performing and start leading, the next step is a conversation. Book a call and we will look honestly at where your marriage is and whether the Masculine Husband path is right for you.',
   cta:'Book a call with Matt',
   disc:'Educational only. No specific result, reconciliation, or outcome in your marriage is promised or guaranteed. Every marriage is different and results vary.'}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('div'); d.className='slide';
  let html = '';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.t==='title') html += '<h1>'+s.h+'</h1>'; else html += '<h2>'+s.h+'</h2>';
  if(s.sub) html += '<div class="sub">'+s.sub+'</div>';
  if(s.b) html += '<p>'+s.b+'</p>';
  if(s.items){ html += '<ul>'; s.items.forEach(it=> html += '<li>'+it+'</li>'); html += '</ul>'; }
  if(s.cta) html += '<div class="cta">'+s.cta+'</div>';
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  html += '<div class="foot">Man Warrior King &middot; Matt Hallock</div>';
  html += '<div class="pg">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
