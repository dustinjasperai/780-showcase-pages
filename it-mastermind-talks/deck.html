<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Nine Keys to a Sellable IT Services Firm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b1016;
    --panel:#141c26;
    --rule:#243143;
    --ink:#eef2f6;
    --muted:#9fb0c0;
    --accent:#ef683f;
    --accent2:#188bf6;
    --head:'Chakra Petch',Georgia,serif;
    --body:'Montserrat',-apple-system,sans-serif;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{display:none;width:min(1120px,92vw);height:min(630px,86vh);background:var(--panel);
    border:1px solid var(--rule);border-radius:18px;padding:72px 84px;position:relative;
    flex-direction:column;justify-content:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .slide.on{display:flex}
  .slide::before{content:'';position:absolute;left:0;top:28px;bottom:28px;width:5px;border-radius:5px;background:var(--accent)}
  .kick{font-family:var(--head);font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:26px}
  h1{font-family:var(--head);font-size:58px;line-height:1.06;font-weight:700;letter-spacing:-.01em}
  h2{font-family:var(--head);font-size:40px;line-height:1.12;font-weight:600;letter-spacing:-.005em}
  .lede{font-size:26px;line-height:1.45;color:var(--muted);margin-top:26px;max-width:46ch}
  .body{font-size:23px;line-height:1.5;color:var(--ink);margin-top:24px;max-width:50ch}
  .present{margin-top:40px;font-size:19px;color:var(--muted);letter-spacing:.02em}
  .present b{color:var(--ink);font-weight:600}
  ul{margin-top:28px;list-style:none;max-width:52ch}
  li{font-size:23px;line-height:1.4;color:var(--ink);padding-left:34px;position:relative;margin-bottom:20px}
  li::before{content:'';position:absolute;left:0;top:12px;width:14px;height:14px;border-radius:4px;background:var(--accent)}
  li.b2::before{background:var(--accent2)}
  .big{font-family:var(--head);font-size:46px;line-height:1.1;font-weight:700;color:var(--ink);max-width:40ch}
  .big .a{color:var(--accent)}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
  .key{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:20px 18px}
  .key .n{font-family:var(--head);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .key .k{font-size:21px;font-weight:600;color:var(--ink);margin-top:8px}
  .centre{margin-top:22px;font-family:var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;font-size:16px}
  .stat{display:flex;gap:48px;margin-top:38px;flex-wrap:wrap}
  .stat .v{font-family:var(--head);font-size:50px;font-weight:700;color:var(--accent)}
  .stat .l{font-size:17px;color:var(--muted);margin-top:6px;max-width:16ch}
  .disc{position:absolute;left:84px;right:84px;bottom:30px;font-size:13px;color:var(--muted);line-height:1.4}
  .cta-line{font-size:25px;color:var(--ink);margin-top:26px;max-width:46ch}
  .cta-line b{color:var(--accent);font-weight:600}
  #nav{position:fixed;bottom:18px;right:26px;font-family:var(--head);font-size:13px;letter-spacing:.1em;color:var(--muted)}
  #prog{position:fixed;left:0;top:0;height:3px;background:var(--accent);width:0;transition:width .2s}
</style>
</head>
<body>
<div id="prog"></div>
<div id="stage"></div>
<div id="nav"><span id="cur">1</span> / <span id="tot">1</span></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass for IT services founders',
   h:'The Nine Keys to a Sellable IT Services Firm',
   lede:'How founders build a firm with transferable value, not just a bigger job.',
   present:'Presented live by <b>Ian Markram</b>, Loading Growth'},

  {t:'content', kick:'Who this is for',
   h:'You run an IT services or SI firm',
   body:'One to 200 staff. You compete with Accenture and Deloitte every week, you win on skill, and the whole thing still runs through you.'},

  {t:'content', kick:'The trap',
   h:'You grew it by being the best person in every room',
   list:['You are in every important deal','You are the final sign off on delivery','The firm cannot take a week off without you','And quietly, that is exactly what caps what it is worth']},

  {t:'reframe', kick:'The reframe',
   big:'Revenue is not value. A firm that runs on you is a job you cannot quit, and a buyer will not pay for a <span class="a">job</span>.'},

  {t:'section', kick:'Part one', h:'Why most IT services firms are unsellable'},

  {t:'content', kick:'Founder dependency',
   h:'The firm is you, wearing a company name',
   body:'When the relationships, the pricing instinct, and the quality control all live in the founder, there is nothing to transfer. Growth just adds more things that depend on one person.'},

  {t:'content', kick:'The valuation reality',
   h:'Two firms, same revenue, very different worth',
   list:['The multiple is set by how little the firm needs you','Utilisation and margin decide the number, not headline revenue','A dependent firm sells at a discount, if it sells at all','This is the EBIT math your accountant is not tracking']},

  {t:'section', kick:'Part two', h:'The Nine Keys'},

  {t:'content', kick:'The model',
   h:'Nine levers, one centre',
   body:'Every IT services firm runs on nine Keys. Score each one honestly and you can see exactly where value is leaking. Shareholder Value sits at the centre of all nine.'},

  {t:'keys', kick:'The Nine Keys',
   items:[['Loading','Growth'],['Loading','Sales'],['Loading','Clients'],['Loading','Rates'],['Loading','Services'],['Growing','IP'],['Growing','A Team'],['Growing','Leaders'],['Growing','Market']],
   centre:'Shareholder Value at the centre of every Key'},

  {t:'content', kick:'Where value leaks',
   h:'Two Keys quietly cap most firms',
   list:['Rates, because work is priced on hours, not on the outcome and the value delivered','Leaders, because there is no bench, so the founder stays the bottleneck','Fix those two and the whole valuation moves']},

  {t:'section', kick:'Part three', h:'The firm that runs without you'},

  {t:'content', kick:'Operator to owner',
   h:'You stop being the firm',
   body:'The leadership bench carries delivery. You move from doing the work to owning the asset. The firm keeps running, and winning, on a week you are not there.'},

  {t:'content', kick:'Leverage, not hours',
   h:'The leveraged consultancy',
   body:'Professional services does not go headless, it goes leveraged. Productise the IP, price on value, build the team that delivers it without you. That is what wins the AI era.'},

  {t:'content', kick:'The outcome',
   h:'An exit on your terms',
   body:'A firm that runs without you is a firm a buyer will pay a real multiple for. Whether you sell or not, you finally own an asset instead of a job.'},

  {t:'cred', kick:'Why listen to me',
   h:'I have built this, and coached it',
   stats:[['$230M','combined value of six client firms that have exited'],['120+','IT services and SI firms coached over ten years'],['1','firm I built and sold myself, to NTT Data']]},

  {t:'content', kick:'The promise',
   h:'Leave today with your firm scored',
   body:'You will know your number on all nine Keys, and the one or two that are quietly holding down what your firm is worth.'},

  {t:'cta', kick:'Your next step',
   h:'Score your firm on the Nine Keys',
   ctaLine:'Take the free <b>IT Service Roadmap scorecard</b>, then book a strategy call to walk through your results and the path through Everest.',
   disc:'This masterclass is educational. It is not financial, legal, or investment advice, and it is not a guarantee of any specific revenue, valuation, or exit outcome. Results vary by firm.'},
];

const stage = document.getElementById('stage');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (i === 0 ? ' on' : '');
  let html = s.kick ? `<div class="kick">${s.kick}</div>` : '';
  if (s.t === 'title') {
    html += `<h1>${s.h}</h1>` + (s.lede ? `<div class="lede">${s.lede}</div>` : '') + (s.present ? `<div class="present">${s.present}</div>` : '');
  } else if (s.t === 'section') {
    html += `<h1>${s.h}</h1>`;
  } else if (s.t === 'reframe') {
    html += `<div class="big">${s.big}</div>`;
  } else if (s.t === 'keys') {
    html += `<h2>Nine levers, one centre</h2><div class="keys">` +
      s.items.map(it => `<div class="key"><div class="n">${it[0]}</div><div class="k">${it[1]}</div></div>`).join('') +
      `</div>` + (s.centre ? `<div class="centre">${s.centre}</div>` : '');
  } else if (s.t === 'cred') {
    html += `<h2>${s.h}</h2><div class="stat">` +
      s.stats.map(st => `<div><div class="v">${st[0]}</div><div class="l">${st[1]}</div></div>`).join('') + `</div>`;
  } else if (s.t === 'cta') {
    html += `<h1>${s.h}</h1>` + (s.ctaLine ? `<div class="cta-line">${s.ctaLine}</div>` : '') + (s.disc ? `<div class="disc">${s.disc}</div>` : '');
  } else {
    html += `<h2>${s.h}</h2>`;
    if (s.body) html += `<div class="body">${s.body}</div>`;
    if (s.list) html += `<ul>` + s.list.map((li, k) => `<li class="${k % 2 ? 'b2' : ''}">${li}</li>`).join('') + `</ul>`;
  }
  el.innerHTML = html;
  stage.appendChild(el);
});

let cur = 0;
const slides = document.querySelectorAll('.slide');
document.getElementById('tot').textContent = slides.length;
function show(n) {
  cur = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle('on', i === cur));
  document.getElementById('cur').textContent = cur + 1;
  document.getElementById('prog').style.width = ((cur + 1) / slides.length * 100) + '%';
}
show(0);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { show(cur + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); e.preventDefault(); }
});
document.getElementById('stage').addEventListener('click', () => show(cur + 1));
</script>
</body>
</html>
