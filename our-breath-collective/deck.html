<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Principles Under Every Breath — Our Breath Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Zilla+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbf9; --panel:#ffffff; --rule:#e4e6e8; --ink:#17202a; --muted:#5b6672;
    --accent:#f06254;   /* brand dominant (brand.json ranked #1, 42 uses) */
    --accent2:#224869;  /* brand secondary (brand.json ranked #3) */
    --sans:'Montserrat',system-ui,sans-serif;   /* stands in for proxima-nova */
    --serif:'Zilla Slab',Georgia,serif;         /* stands in for adelle */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--serif)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 30px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(23,32,42,.03);position:relative;scroll-margin-top:20px}
  .breathline{height:0;border:0;border-top:2px solid var(--accent);width:78px;margin:0 0 26px;border-radius:2px}
  .kick{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--sans);font-weight:800;font-size:52px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1.14;letter-spacing:-.01em}
  h3{font-family:var(--sans);font-weight:700;font-size:19px}
  p{font-size:20px;line-height:1.5;color:var(--ink);margin-top:16px;max-width:46ch}
  p.lead{font-size:23px;color:var(--muted)}
  .big{font-family:var(--sans);font-weight:800;font-size:44px;line-height:1.08;letter-spacing:-.01em}
  .em{color:var(--accent)}
  .cover{background:linear-gradient(180deg,#0f1c28 0%,#1a3350 100%);color:#f4f1ea;border-color:#0f1c28}
  .cover .kick{color:#ffb3aa}
  .cover h1{color:#fff;font-size:58px}
  .cover p{color:#d7dee6}
  .meta{font-family:var(--sans);font-weight:600;font-size:15px;color:#aeb9c6;margin-top:40px;letter-spacing:.02em}
  ul{list-style:none;margin-top:26px}
  li{font-size:20px;line-height:1.4;padding:14px 0 14px 34px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:0}
  li::before{content:"";position:absolute;left:0;top:22px;width:14px;height:2px;background:var(--accent);border-radius:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:22px 24px}
  .card .n{font-family:var(--sans);font-weight:800;color:var(--accent2);font-size:14px;letter-spacing:.1em}
  .card h3{margin-top:8px}
  .card p{font-size:16px;margin-top:8px;color:var(--muted);max-width:none}
  .part{font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2)}
  .disc{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:34px;max-width:62ch;line-height:1.5}
  .cta-btn{display:inline-block;font-family:var(--sans);font-weight:700;font-size:18px;color:#fff;background:var(--accent);padding:16px 30px;border-radius:10px;margin-top:30px}
  .credit{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
  .tag{font-family:var(--sans);font-size:14px;color:var(--accent2);background:#eef2f6;border:1px solid #dce4ec;padding:7px 13px;border-radius:20px}
  .foot{position:absolute;bottom:20px;right:26px;font-family:var(--sans);font-size:12px;color:#b7bfc8;letter-spacing:.05em}
  @media(max-width:680px){.slide{padding:36px 26px}h1{font-size:38px}.cover h1{font-size:40px}h2{font-size:26px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* Masterclass deck — THE COACH'S live class to THEIR audience. Rendered from S. */
const S=[
  {t:'title',cover:1,kick:'A free live class for aspiring breathwork facilitators',
   h1:'The Principles Under Every Breath',
   lead:"Why the best facilitators don't master one technique. They master what runs underneath all of them.",
   meta:'Reis Paluso  ·  Our Breath Collective  ·  Breath School'},

  {t:'who',kick:'Who this is for',
   h2:'You already feel the power of breath. Now you want to teach it.',
   items:['Yoga teachers and bodyworkers ready to add breathwork with real depth',
          'Athletes, artists, and coaches who use breath and want to guide others',
          'Practitioners who have taken a course, but freeze when a session goes off-script']},

  {t:'point',kick:'The trap',
   h2:"You collected techniques. You still don't feel ready to lead.",
   body:['A weekend certification hands you a protocol and a script. Then a real person sits in front of you, breathing in a way the script never covered, and you are guessing.',
         'More techniques do not fix that. A deeper foundation does.']},

  {t:'big',kick:'The uncomfortable truth',
   big:"A technique is a script. And a script breaks the moment a real person doesn't fit it.",
   body:['The facilitators people trust are not running scripts. They understand what breath is doing in the body, so they can adapt in the moment.']},

  {t:'section',part:'Part One',h2:'The core problem: method-first training',
   body:['Most breathwork education is organised around a brand of technique. It teaches the "what" and the "how" of one style, and almost none of the "why."',
         'So the day the technique does not land, there is nothing underneath to fall back on.']},

  {t:'point',kick:'Why it fails',
   h2:'One method cannot serve every nervous system.',
   body:['The same fast, activating breath that frees one person can overwhelm another. Without understanding the principles at work, you cannot tell which is which until it is too late.'],
   lead:"The fix isn't a better technique. It's seeing what every technique is actually doing."},

  {t:'section',part:'Part Two',h2:'The principles that run underneath every method',
   lead:'At Our Breath Collective we take a multidisciplinary, human-centric approach: instead of one school, we teach the principles that run through all of them. Here are four.'},

  {t:'grid',kick:'The foundation, four pillars',
   cards:[
     {n:'01',h3:'Physiology & chemistry',p:'Why breath changes how you feel, from the inside. The real mechanism behind every technique.'},
     {n:'02',h3:'Nervous system & neuroscience',p:'How breath up-regulates and down-regulates state, so you can steer it on purpose.'},
     {n:'03',h3:'Biomechanics of breathing',p:'How the body is actually built to breathe, and what to watch for in the room.'},
     {n:'04',h3:'The art of teaching',p:'Set and setting, cueing and language, holding space safely. Where knowledge becomes facilitation.'}]},

  {t:'point',kick:'Principle in practice',
   h2:'When you understand the "why," you stop guessing.',
   body:['Once you can read what a breath pattern is doing to the nervous system, you can choose the next cue on purpose, not from a script. That is the difference between running a session and holding one.']},

  {t:'point',kick:'The personalization layer',
   h2:'The Breathprint: read the person, not the protocol.',
   body:['Everyone carries a unique breathing pattern tied to how their nervous system responds. We call it your Breathprint. Learning to read it is how you match the practice to the person in front of you.'],
   lead:'This is why the same technique helps one person and hurts another.'},

  {t:'point',kick:'When it gets big',
   h2:'Holding space is a skill, not a personality trait.',
   body:['Real sessions bring up emotion, resistance, and the occasional strong release. Safety, boundaries, and integration are things you can be taught, so you can stay steady and keep the room safe when it matters most.']},

  {t:'section',part:'Part Three',h2:'Inside a session you actually lead',
   items:['You notice how someone is breathing before you cue anything',
          'You choose a direction from principles, and adjust it live as they respond',
          'You hold the space safely when emotion or resistance shows up',
          'People leave feeling met, not processed through a template']},

  {t:'credit',kick:"Who's teaching this",h2:'Reis Paluso',
   body:['Co-founder of Our Breath Collective and lead of Breath School. A student, facilitator, and guide of the breath who has trained directly under many of the foundational teachers in the field.'],
   tags:['Studied under Wim Hof','Jack Feldman','Peter Litchfield','Dan Brulé','Jill Miller','Brian Mackenzie','Certified Breathing Behavior Analyst','Level 2 Wim Hof Instructor']},

  {t:'point',kick:'The path from here',
   h2:'From practitioner to facilitator people can trust.',
   body:['Principles you understand, a personalization lens you can apply, and enough real practice that you can lead a room without a script. That is what we build, over four months, inside Breath School.']},

  {t:'grid',kick:'The three shifts',
   cards:[
     {n:'FROM',h3:'Collecting techniques',p:'Learning one branded style after another.'},
     {n:'TO',h3:'Understanding principles',p:'Knowing what every technique is actually doing.'},
     {n:'FROM',h3:'Running a protocol',p:'Hoping the script fits the person.'},
     {n:'TO',h3:'Reading the Breathprint',p:'Matching the practice to the person, live.'}]},

  {t:'point',kick:'For the people you guide',
   h2:'This is what your clients actually feel.',
   body:['A session that meets them where they are, moves at their pace, and leaves them calmer, clearer, and trusting you enough to come back. That trust is built on your foundation, not your script.']},

  {t:'cta',cover:1,kick:'Your next step',
   h1:'Learn the principles. Become the facilitator people trust.',
   body:['Breath School is a four-month immersion into the foundations under every method, the Breathprint, and real, hands-on facilitation. When you are ready to teach breathwork for real, this is where you begin.'],
   cta:{label:'Explore Breath School',href:'https://ourbreathcollective.com/courses/teacher-training/'},
   disc:'This class is educational. It is not medical advice and does not guarantee any specific health, business, or income outcome. Breathwork is a practice; results vary by individual. Always work within your training and scope, and refer to qualified professionals when appropriate.'}
];

const deck=document.getElementById('deck');
function esc(s){return s;}
S.forEach(s=>{
  const sec=document.createElement('section');
  sec.className='slide'+(s.cover?' cover':'');
  let h='';
  if(s.part) h+=`<div class="part">${s.part}</div>`;
  else if(s.kick) h+=`<div class="kick">${s.kick}</div>`;
  h+='<hr class="breathline">';
  if(s.h1) h+=`<h1>${s.h1}</h1>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.big) h+=`<p class="big">${s.big}</p>`;
  if(s.lead) h+=`<p class="lead">${s.lead}</p>`;
  if(s.body) s.body.forEach(p=>h+=`<p>${p}</p>`);
  if(s.items){h+='<ul>';s.items.forEach(it=>h+=`<li>${it}</li>`);h+='</ul>';}
  if(s.cards){h+='<div class="grid">';s.cards.forEach(c=>h+=`<div class="card"><div class="n">${c.n}</div><h3>${c.h3}</h3><p>${c.p}</p></div>`);h+='</div>';}
  if(s.tags){h+='<div class="credit">';s.tags.forEach(t=>h+=`<span class="tag">${t}</span>`);h+='</div>';}
  if(s.cta) h+=`<a class="cta-btn" href="${s.cta.href}">${s.cta.label}</a>`;
  if(s.disc) h+=`<p class="disc">${s.disc}</p>`;
  if(!s.cover) h+='<span class="foot">Our Breath Collective</span>';
  sec.innerHTML=h;
  deck.appendChild(sec);
});
const slides=[...document.querySelectorAll('.slide')];let i=0;
function go(n){i=Math.max(0,Math.min(slides.length-1,n));slides[i].scrollIntoView({behavior:'smooth',block:'center'});}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){e.preventDefault();go(i+1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(i-1);}
});
</script>
</body>
</html>
