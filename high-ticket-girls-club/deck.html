<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Shelby Way - She Sells Remote Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef6f3; --panel:#ffffff; --ink:#1d1b1d; --accent:#b8ece3;
    --rule:#d7e6e0; --muted:#5f6a66;
    --display:'EB Garamond', Georgia, serif;
    --body:'Josefin Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300}
  #deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:60px 58px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .tag{font-family:var(--body);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--muted);margin-bottom:22px}
  .tag .dot{display:inline-block;width:30px;height:2px;background:var(--accent);
    vertical-align:middle;margin-right:12px}
  h1{font-family:var(--display);font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.14;margin-bottom:18px}
  .lede{font-size:22px;line-height:1.5;font-weight:300;max-width:40ch;margin-top:20px}
  .sub{font-size:19px;line-height:1.55;color:var(--muted);max-width:52ch;margin-top:14px}
  p{font-size:19px;line-height:1.6;max-width:56ch;margin-top:16px}
  ul{list-style:none;margin-top:22px;max-width:60ch}
  li{font-size:20px;line-height:1.4;padding:14px 0 14px 34px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:16px;height:2px;background:var(--accent)}
  li b{font-weight:600}
  .big{font-family:var(--display);font-size:40px;line-height:1.2;font-weight:600;max-width:24ch}
  .big .a{background:linear-gradient(transparent 62%, var(--accent) 62%)}
  .num{font-family:var(--display);font-size:64px;color:var(--accent);font-style:italic;
    -webkit-text-stroke:1px var(--ink);margin-bottom:8px}
  .cta h1{font-size:46px}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
  .pillars div{border:1px solid var(--rule);border-radius:12px;padding:18px 20px}
  .pillars h3{font-family:var(--display);font-size:22px;font-weight:600}
  .pillars p{font-size:16px;color:var(--muted);margin-top:6px}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;max-width:62ch;line-height:1.5}
  .kick{font-family:var(--display);font-style:italic;font-size:24px;color:var(--muted);margin-top:16px}
  footer{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:18px}
</style>
</head>
<body>
<div id="deck"></div>
<footer>She Sells Remote &middot; The Shelby Way</footer>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="tag"><span class="dot"></span>A Free Live Masterclass with Shelby Sapp</div>
    <h1>How Women Break Into<br>High-Ticket Sales</h1>
    <div class="lede">The Shelby Way: how everyday women learn to close high-ticket offers and get placed, with no degree and no sales background.</div>`},

  {t:'who', cls:'', html:`
    <div class="tag"><span class="dot"></span>Who this is for</div>
    <h2>If any of this is you, you are in the right room.</h2>
    <ul>
      <li>You are tired of a 9-5 that caps what you can earn.</li>
      <li>You want a real skill, not another side hustle.</li>
      <li>You do not have a degree or a sales background, and you are done being told you need one.</li>
      <li>You want to work from anywhere, on your terms, around women doing the same.</li>
    </ul>`},

  {t:'trap', cls:'', html:`
    <div class="tag"><span class="dot"></span>The trap</div>
    <h2>Trading hours for a paycheck has a ceiling, and you can feel it.</h2>
    <p>You can be smart, driven, and great with people, and still be stuck inside a salary that someone else decides. The problem was never your work ethic. The problem is that the highest-paid skill in business was never taught to you.</p>`},

  {t:'reframe', cls:'', html:`
    <div class="tag"><span class="dot"></span>The reframe</div>
    <div class="big">Closing is not a personality you are born with. It is a <span class="a">skill you can be taught</span>.</div>
    <div class="sub">Every top closer you have ever seen followed a structure. Once you can see the structure, you can learn it.</div>`},

  {t:'part', cls:'', html:`
    <div class="tag"><span class="dot"></span>Part One</div>
    <h1>The hidden role nobody told you about</h1>`},

  {t:'role', cls:'', html:`
    <div class="tag"><span class="dot"></span>Remote high-ticket closing</div>
    <h2>Businesses have more demand than they can call back.</h2>
    <p>Coaches, agencies, and programs selling offers of three thousand dollars and up need people to take those calls and help the right buyers say yes. That person is the closer. It is remote, it is commission, and the companies are hiring faster than there are trained women to fill the seats.</p>`},

  {t:'women', cls:'', html:`
    <div class="tag"><span class="dot"></span>Why women win here</div>
    <h2>High-ticket sales rewards trust, listening, and real conversation.</h2>
    <p>This is not pushy, cold, or sleazy. The best closers make the buyer feel understood and help them make a decision they already wanted to make. That is a room women tend to own.</p>`},

  {t:'part', cls:'', html:`
    <div class="tag"><span class="dot"></span>Part Two</div>
    <h1>The Shelby Way</h1>
    <div class="sub">The four things that take a complete beginner to a placed, paid closer.</div>`},

  {t:'pillars', cls:'', html:`
    <div class="tag"><span class="dot"></span>The four pillars</div>
    <h2>Train. Coach. Place. Belong.</h2>
    <div class="pillars">
      <div><h3>Train</h3><p>A step-by-step path from zero to confident on a live call.</p></div>
      <div><h3>Coach</h3><p>Weekly hot-seat reviews of real calls, so you improve on reps, not theory.</p></div>
      <div><h3>Place</h3><p>The Placement Portal connects certified women with companies hiring closers.</p></div>
      <div><h3>Belong</h3><p>The largest all-women sales community, so you are never doing it alone.</p></div>
    </div>`},

  {t:'pillar1', cls:'', html:`
    <div class="num">01</div>
    <h2>Scripts and structure</h2>
    <p>You will never again wonder what to say. You learn a repeatable call structure, the questions that uncover what the buyer actually wants, and how to guide the conversation from hello to a clear decision.</p>`},

  {t:'pillar2', cls:'', html:`
    <div class="num">02</div>
    <h2>Tonality and objections</h2>
    <p>Most sales are lost in how something is said, not what is said. You learn the tonality that keeps a call calm and confident, and how to handle the handful of objections you will hear again and again, without pressure.</p>`},

  {t:'pillar3', cls:'', html:`
    <div class="num">03</div>
    <h2>Live reps, reviewed</h2>
    <p>Skill comes from reps. Every week you bring real calls to a hot-seat review and get told exactly what to keep and what to change. This is the fastest way to go from stiff and scripted to natural and closing.</p>`},

  {t:'pillar4', cls:'', html:`
    <div class="num">04</div>
    <h2>Placement, not just a certificate</h2>
    <p>A certificate you cannot use is worthless. When you certify, you get access to the Placement Portal, a running list of companies looking for closers, with the scripts and frameworks to walk in ready. The point is a seat, not a PDF.</p>`},

  {t:'gameplan', cls:'', html:`
    <div class="tag"><span class="dot"></span>The 5-step gameplan</div>
    <h2>How the next 12 weeks actually go.</h2>
    <ul>
      <li><b>One.</b> Learn the fundamentals and the call structure.</li>
      <li><b>Two.</b> Drill tonality and objection handling until it is yours.</li>
      <li><b>Three.</b> Take live reps and get them reviewed each week.</li>
      <li><b>Four.</b> Certify, then open the Placement Portal.</li>
      <li><b>Five.</b> Land a seat and keep leveling up inside the community.</li>
    </ul>`},

  {t:'day', cls:'', html:`
    <div class="tag"><span class="dot"></span>Remote, on your terms</div>
    <h2>A placed closer's week.</h2>
    <p>A few hours a day. Calls booked for you by the company. A community chat open on the second screen. No commute, no ceiling, no asking permission to log off. The work is the conversations, and you got good at those on purpose.</p>`},

  {t:'community', cls:'', html:`
    <div class="tag"><span class="dot"></span>The room</div>
    <div class="big">The largest <span class="a">all-women</span> high-ticket sales community there is.</div>
    <div class="sub">Referrals, encouragement, and real talk from women who were exactly where you are now, a few months ahead of you.</div>`},

  {t:'whyme', cls:'', html:`
    <div class="tag"><span class="dot"></span>Why me</div>
    <h2>I built this because I lived it.</h2>
    <p>I started in door-to-door sales at eighteen and became the first woman to own a million-dollar sales team in my company. Then I moved everything remote. I built She Sells so the women coming behind me would get the training, the connections, and the community I had to piece together alone.</p>
    <div class="kick">Shelby Sapp, founder of She Sells Remote</div>`},

  {t:'mindset', cls:'', html:`
    <div class="tag"><span class="dot"></span>One last thing</div>
    <div class="big">The skill opens the door. Your <span class="a">mindset</span> is what walks you through it.</div>
    <div class="sub">You do not need to be fearless. You need a skill you trust and a room that has your back. We give you both.</div>`},

  {t:'cta', cls:'cta', html:`
    <div class="tag"><span class="dot"></span>Your next step</div>
    <h1>Come learn The Shelby Way, live.</h1>
    <p>Join the free live masterclass and see exactly how women with no sales background become certified, placed remote closers.</p>
    <p><b>Save your seat at shesellsremote.com.</b></p>
    <div class="disc">This masterclass is for educational purposes only. No income, role, or result is guaranteed. Results vary and depend on your effort, experience, and market conditions. This is not a get-rich-quick program.</div>`}
];
const deck = document.getElementById('deck');
S.forEach(s => {
  const sec = document.createElement('section');
  sec.className = 'slide ' + (s.cls || '');
  sec.innerHTML = s.html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
