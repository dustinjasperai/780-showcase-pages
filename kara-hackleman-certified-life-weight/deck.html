<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You Are Not Broken — A Concierge Weight Loss Masterclass with Kara Hackleman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf7f2;        /* her page cream (brand.json ground) */
    --panel:#f7ede4;     /* warm tint of the cream, for cards */
    --ink:#2b2320;       /* warm near-black */
    --muted:#7a6a5d;     /* warm grey-brown */
    --rule:#e7d5c4;      /* soft terracotta hairline */
    --accent:#c78a5d;    /* her dominant brand terracotta (brand.json) */
    --accent-soft:#f0dcc9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Poppins",system-ui,sans-serif;font-weight:300;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    width:min(960px,94vw);aspect-ratio:16/9;background:var(--bg);
    border:1px solid var(--rule);border-radius:18px;
    box-shadow:0 24px 70px -40px rgba(120,80,45,.45);
    position:relative;overflow:hidden;
  }
  .slide{position:absolute;inset:0;padding:6.2% 7.4%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-family:"Alegreya Sans",serif;font-weight:800;font-size:clamp(30px,5.4vw,58px);line-height:1.03;letter-spacing:-.01em}
  h2{font-family:"Alegreya Sans",serif;font-weight:800;font-size:clamp(24px,3.9vw,40px);line-height:1.08;letter-spacing:-.01em}
  .kicker{font-family:"Poppins";font-weight:600;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--accent)}
  .sub{font-size:clamp(15px,1.9vw,20px);color:var(--muted);font-weight:400;margin-top:.7em;max-width:46ch;line-height:1.5}
  .lead{font-size:clamp(18px,2.4vw,26px);line-height:1.4;font-weight:400;max-width:42ch}
  .lead b, .lead strong{font-weight:600;color:var(--accent)}
  ul{list-style:none;margin-top:1.1em;display:grid;gap:.72em;max-width:50ch}
  li{position:relative;padding-left:1.5em;font-size:clamp(14px,1.7vw,19px);line-height:1.42;color:var(--ink)}
  li:before{content:"";position:absolute;left:0;top:.62em;width:.5em;height:.5em;border-radius:50%;background:var(--accent)}
  li span{color:var(--muted)}
  .num{font-family:"Alegreya Sans";font-weight:800;color:var(--accent-soft);font-size:clamp(60px,12vw,150px);line-height:.8}
  .partrow{display:flex;align-items:baseline;gap:.5em}
  .horizon{height:2px;width:120px;background:linear-gradient(90deg,var(--accent),transparent);margin:1.1em 0 0}
  .credit{margin-top:1.4em;font-size:14px;color:var(--muted);letter-spacing:.02em}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:1.1em 1.2em}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em;margin-top:1.1em}
  .grid3 .card h3{font-family:"Alegreya Sans";font-weight:700;font-size:clamp(15px,1.9vw,21px);color:var(--accent)}
  .grid3 .card p{font-size:clamp(12px,1.4vw,15px);color:var(--muted);margin-top:.35em;line-height:1.4}
  .disc{font-size:12px;color:var(--muted);margin-top:1.2em;max-width:56ch;line-height:1.45}
  .cta-line{margin-top:1em;font-size:clamp(16px,2vw,22px);font-weight:500}
  .cta-line b{color:var(--accent)}
  #hud{position:absolute;bottom:14px;right:20px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  #brand{position:absolute;bottom:14px;left:20px;font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:500}
  #nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  #nav button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);border-radius:9px;padding:8px 15px;font-family:"Poppins";font-size:13px;cursor:pointer}
  #nav button:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="stage"><div id="brand">Concierge Weight Loss</div><div id="hud"></div></div>
<div id="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S=[
 {t:'title',
  h:"You Are Not Broken.",
  sub:"A live masterclass on losing weight for good by changing how you think, not by dieting harder. Hosted by Kara Hackleman, Certified Life and Weight Loss Coach.",
  credit:"Concierge Weight Loss"},

 {t:'content',kicker:"Who this is for",
  h:"You have lost the same 20 pounds five times.",
  lead:"You are not lazy and you are not out of options. You have done the plans, the points, the fasts. Each one worked, until the day it quietly stopped. This hour is for you."},

 {t:'content',kicker:"The trap",
  h:"Every diet asks you to white knuckle it.",
  lead:"Restrict, resist, repeat. The plan runs on willpower, so the moment life gets hard the plan is the first thing to go. Then you blame yourself, and the cycle starts again."},

 {t:'content',kicker:"The reframe",
  h:"The problem was never your willpower.",
  lead:"It was the <b>thought underneath it.</b> You have been trying to lose weight from a place of I am broken and I need fixing. You cannot punish your way to a body you love."},

 {t:'content',kicker:"What you will leave with",
  h:"Three shifts, one hour.",
  body:["Why diets keep failing you, and why that is not a character flaw",
        "The one mindset shift that makes weight loss feel like discovery instead of self repair",
        "A simple method built on self acceptance, managing your thoughts, and a few habits you keep forever"]},

 {t:'section',num:"01",h:"Why diets keep failing you."},

 {t:'content',kicker:"Part One",
  h:"You have been losing weight from self rejection.",
  lead:"When the goal comes from I hate how I look, the plan is a punishment. Punishment is not sustainable. The weight comes back because the story underneath it never changed."},

 {t:'content',kicker:"Part One",
  h:"The mental weight comes first.",
  lead:"Food chatter, cravings, the constant negotiating in your head. Emotional eating is not weakness. It is a thought and a feeling looking for relief. Quiet the chatter and the food loosens its grip."},

 {t:'content',kicker:"Part One",
  h:"All or nothing is the real diet.",
  lead:"One off plan meal becomes I blew it, so I will start Monday. The all or nothing rule, not the cookie, is what stalls you. Diet burnout is the predictable end of a plan you were never meant to keep."},

 {t:'section',num:"02",h:"The shift, from fixing to growing."},

 {t:'content',kicker:"Part Two",
  h:"Fixing to Growing.",
  lead:"You are already whole. You are not a project to repair, you are a person choosing to grow. Move from scarcity, I am not enough, to <b>abundance, I am enough and I am choosing more.</b>"},

 {t:'content',kicker:"Part Two",
  h:"Check your why before your what.",
  lead:"Is this goal coming from self criticism, or from curiosity? Let go of the shoulds and choose what you actually want. A goal you want, you keep. A goal you should, you quit."},

 {t:'content',kicker:"Part Two",
  h:"The three patterns quietly running the show.",
  grid:[["Perfectionism","If it is not perfect, why bother. So one slip ends the whole week."],
        ["People pleasing","You eat to keep the peace and put everyone else first."],
        ["Procrastination","I will start when things settle down. Things never fully settle."]],
  note:"Name the pattern and it loses its power over your plate."},

 {t:'section',num:"03",h:"The method that lasts."},

 {t:'content',kicker:"Part Three",
  h:"Three elements, done together.",
  grid:[["Self acceptance","Start from whole, not from shame. The foundation everything sits on."],
        ["Thought management","Notice the thought, question it, choose a better one. No calorie counting required."],
        ["Habit building","A few easy habits you actually keep, layered in one at a time."]]},

 {t:'content',kicker:"Part Three",
  h:"Manage thoughts, not macros.",
  lead:"You do not need another tracker. You need to catch the thought that drives the choice. Change the thought, the choice changes, and the result follows on its own."},

 {t:'content',kicker:"Part Three",
  h:"Keep the foods you love.",
  lead:"No food groups cut, no shakes, no pills. Just a handful of habits that fit the life you already live, so the weight you lose is weight you keep off for good."},

 {t:'content',kicker:"A week in the shift",
  h:"What this actually feels like.",
  body:["A craving shows up and you get curious instead of guilty",
        "An off plan dinner is just dinner, not a reason to quit",
        "You make the next choice from I am enough, not from I blew it",
        "The scale stops being the referee of your whole day"]},

 {t:'credibility',kicker:"Why listen to me",
  h:"I lost 60 pounds the day I stopped trying to fix myself.",
  lead:"I am Kara Hackleman, a Certified Life and Weight Loss Coach. I spent years dieting from self rejection. Everything changed when I learned to lose the mental weight first. Now I coach women to do the same, for good.",
  credit:"Kara Hackleman, Concierge Weight Loss"},

 {t:'recap',kicker:"The whole hour in one line",
  h:"You are not broken.",
  body:["Diets fail because they run on shame and willpower",
        "The shift is from fixing yourself to growing yourself",
        "The method is self acceptance, thought management, and easy habits you keep"]},

 {t:'cta',kicker:"Your next step",
  h:"Ready to lose it for good?",
  ctaLine:"Take the <b>Next Step Quiz</b> to find your overeating pattern, then book a free <b>Success Call</b> to map your personal plan.",
  disc:"This masterclass is educational and is not medical or nutritional advice. No particular weight loss result is guaranteed and results vary from person to person. Talk with your own healthcare provider before making changes.",
  credit:"Concierge Weight Loss  .  coachingkara.com"}
];

const stage=document.getElementById('stage');
const hud=document.getElementById('hud');
let i=0;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rich(s){ // allow only <b>/<strong> we authored
  return esc(s).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>')
               .replace(/&lt;strong&gt;/g,'<strong>').replace(/&lt;\/strong&gt;/g,'</strong>');
}
function render(){
  document.querySelectorAll('.slide').forEach(n=>n.remove());
  const s=S[i];const d=document.createElement('div');d.className='slide on';
  let html='';
  if(s.kicker) html+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.t==='title'){
    html+=`<h1>${rich(s.h)}</h1><div class="horizon"></div>`;
    if(s.sub) html+=`<p class="sub">${rich(s.sub)}</p>`;
    if(s.credit) html+=`<p class="credit">${esc(s.credit)}</p>`;
  } else if(s.t==='section'){
    html+=`<div class="partrow"><span class="num">${esc(s.num)}</span></div><h1>${rich(s.h)}</h1><div class="horizon"></div>`;
  } else {
    html+=`<h2>${rich(s.h)}</h2>`;
    if(s.lead) html+=`<div class="horizon"></div><p class="lead" style="margin-top:1em">${rich(s.lead)}</p>`;
    if(s.body){html+='<ul>';s.body.forEach(b=>html+=`<li>${rich(b)}</li>`);html+='</ul>';}
    if(s.grid){html+='<div class="grid3">';s.grid.forEach(g=>html+=`<div class="card"><h3>${esc(g[0])}</h3><p>${esc(g[1])}</p></div>`);html+='</div>';}
    if(s.note) html+=`<p class="sub" style="margin-top:1em">${rich(s.note)}</p>`;
    if(s.ctaLine) html+=`<p class="cta-line">${rich(s.ctaLine)}</p>`;
    if(s.disc) html+=`<p class="disc">${esc(s.disc)}</p>`;
    if(s.credit) html+=`<p class="credit">${esc(s.credit)}</p>`;
  }
  d.innerHTML=html;stage.appendChild(d);
  hud.textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
