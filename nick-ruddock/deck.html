<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Lead the Club, Not Just the Coaching · Nick Ruddock, Gymnastics Leaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4f7f9; --panel:#e8eef1; --rule:#d7dee2;
    --acc:#00a4e6; --ink:#073b50; --body:#052a38; --dim:#47616b; --chalk:#f4f7f9;
  }
  html,body{height:100%}
  body{background:#dfe6ea;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dfe6ea}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Manrope',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Manrope',sans-serif;font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:-.01em}
  .t-title h1{font-size:5.0vw;max-width:92%}
  .t-normal h1{font-size:3.2vw;max-width:90%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Inter',sans-serif;font-size:1.7vw;color:var(--dim);margin-top:3.2vh;max-width:82%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Manrope',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh;border-radius:3px}
  .t-dark{background:linear-gradient(160deg,#073b50 0%,#052a38 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--chalk);font-weight:700}
  .t-cta{background:linear-gradient(160deg,#073b50 0%,#052a38 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--chalk)}
  .t-cta .body{font-family:'Inter',sans-serif;color:#dfe6ea;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--chalk);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .layers-motif{position:absolute;pointer-events:none}
  .title-lyr{right:7.5%;bottom:9%;width:17vw;opacity:.9}
  .corner-lyr{right:6.5%;bottom:7.5%;width:9vw;opacity:.5}
  .brandline{font-family:'Manrope',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.03em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(7,59,80,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.6vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Gymnastics Leaders</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- leadership-layers motif: stacked horizontal bars, internal beneath external -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lyr" viewBox="0 0 120 120">
  <g fill="none" stroke="#00a4e6" stroke-width="3" stroke-linecap="round">
    <path d="M24 42 H96" opacity="0.9"/>
    <path d="M18 60 H102" opacity="0.7"/>
    <path d="M30 78 H90" opacity="0.5"/>
    <circle cx="60" cy="24" r="6" opacity="0.85"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Lead the Club, Not Just the Coaching',sub:'How gymnastics club owners turn leadership into a set of trainable behaviours, so the club grows stronger without running you into the ground.',brand:true,lyr:'title'},
 {t:'normal',k:'Who this is for',title:'You built a good club. Nobody ever trained you to lead it.',body:'You are a club owner or head coach whose gymnasts progress and whose coaching is genuinely strong. But you carry the rest of it too: the staffing, the standards, the hard conversations, the late nights. It quietly feels like the whole club runs on you, and only you.'},
 {t:'dark',title:'Working harder is not the same as leading better. More hours will not close a leadership gap.'},

 {t:'section',idx:'Part One',title:'Why Great Coaching Is Not Enough'},
 {t:'normal',k:'The real ceiling',title:'A club rises to the level of its leadership, not the level of its best coach.',body:'Excellent coaching gets your gymnasts a long way. But the club\'s ceiling is set by how it is led: whether standards hold when you are not on the floor, whether your coaches keep growing, whether decisions are clear enough that the team can act without you. That is a leadership question, not a coaching one.'},
 {t:'normal',k:'Promoted by accident',title:'Most owners were the best coach, so they were handed the club.',body:'The responsibility arrived. The training to actually lead it never did. That gap does not show up on the competition floor. It shows up as burnout, as good coaches leaving, and as the conversations you keep putting off because no one ever showed you how to have them well.'},
 {t:'dark',title:'Leadership is not a title you were given. It is a behaviour you can train.'},

 {t:'section',idx:'Part Two',title:'The Leadership Layers'},
 {t:'normal',k:'The framework',title:'Leadership runs in two layers: how you lead yourself, and how you lead everyone else.',body:'The Leadership Layers split the job into Internal Leadership, how you lead yourself, and External Leadership, how you lead the club. Most owners try to fix the external first, the staffing and the systems, while the internal is still shaky. It never quite holds. The internal layer comes first, and everything external is built on top of it.'},
 {t:'normal',k:'Internal Leadership',title:'Internal: how you lead yourself.',body:'Clarity on how you make decisions, which standards you will not drop, and how you show up when the week is going badly. When the leader is clear and steady, the team reads that and gets clear too. When the leader wavers or avoids, the team reads that just as fast.'},
 {t:'normal',k:'External Leadership',title:'External: how you lead the club.',body:'How you develop capable coaches, put systems in place that hold without you standing over them, and set standards a team can actually follow week to week. This is the layer where a club stops depending on your physical presence to keep its level.'},
 {t:'normal',k:'What holds a club up',title:'Four things every high-performing club has in place.',body:'Clear leadership, strong people, effective systems, and consistent standards. Miss one and the other three strain to make up for it, which is exactly what burns an owner out. The Layers are how you build all four on purpose, in the order that actually works.'},
 {t:'dark',title:'A club that only works when you are in the building is a job, not an organisation.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Lead in Layers'},
 {t:'normal',k:'The club this builds',title:'Coaches who hold the line, conversations that happen early, and a club that keeps its level when you step back.',body:'When the internal layer is clear and the external layer is built on it, standards hold without you chasing them, the hard conversations happen before they fester, and the club keeps performing on the weeks you are away. You lead the organisation instead of being consumed by it.'},
 {t:'dark',title:'The goal was never to work more hours. It was to build something that holds.'},
 {t:'normal',k:'Why Nick Ruddock',title:'Elite performance, brought to how clubs are led.',body:'Nick has developed gymnasts and coaches from grassroots to international level, worked with 25 national federations, and served as a technical expert for European Gymnastics. Gymnastics Leaders is where he brings that same high-performance approach to the part no one trains owners for: leading the club itself.'},

 {t:'section',idx:'Your Next Step',title:'Lead the Club You Built'},
 {t:'normal',k:'Where this goes next',title:'See where your club stands, then close the gap with a plan.',body:'The path starts with the High Performance Health Check, an honest read on where your club sits across the six pillars of sustainable success. From there, the Leadership Layers work closes the biggest gap first, with coaching and accountability as you put it into practice, so leadership becomes sustainable instead of exhausting.'},
 {t:'cta',title:'Ready to lead the club, not just coach it?',body:'Start with the High Performance Health Check, then go deeper inside Gymnastics Leaders.',chips:['Take the High Performance Health Check','Join Gymnastics Leaders'],disc:'Educational content for gymnastics club owners, directors, and head coaches. No specific business or performance result is guaranteed. Results vary by club, team, market, and the work you put in.'},
];

const deck=document.getElementById('deck');
function lyr(kind){return `<svg class="layers-motif ${kind==='title'?'title-lyr':'corner-lyr'}"><use href="#lyr"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Gymnastics <b>Leaders</b> · Nick Ruddock</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.lyr) h+=lyr(s.lyr);
  else if(s.t==='title') h+=lyr('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
