<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth in Reverse, a masterclass with Chenell Basilio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f6;
    --panel:#ffffff;
    --rule:#e2e6ec;
    --ink:#1a1a1a;
    --muted:#5c6570;
    --accent:#ef5028;
    --accent2:#ff6a3c;
    --head:'Barlow',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(30,40,60,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* reverse motif: an accent bar at top-right, pointing back to the left */
  .slide::before{content:'';position:absolute;top:0;right:0;height:5px;width:46%;
    background:linear-gradient(270deg,var(--accent),var(--accent2));border-radius:0 0 0 6px}
  .kick{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:60px;line-height:1.04;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:600;font-size:42px;line-height:1.08;margin:0 0 20px}
  h3{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:44ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:16px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px}
  .big{font-family:var(--head);font-size:120px;line-height:.98;font-weight:700}
  .strike{color:transparent;-webkit-text-stroke:2px #1a1a1a44;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:210px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:26px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:56px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:auto}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:40px}h2{font-size:30px}.big{font-size:74px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Growth in Reverse · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'Growth in Reverse',p:'How to reverse-engineer the newsletters that already grew, and copy the one lever that actually moved the needle.',pres:'A live session from <b>Growth in Reverse</b>, hosted by Chenell Basilio'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['How to read a newsletter backward','Start from one that already won and trace it back to the move that mattered.'],['The one lever doing the heavy lifting','Not ten tactics at once. The single channel worth going all in on.'],['A teardown you can run this week','The exact steps, so you can do it on your own list on Monday.']]},
 {t:'audience',kick:'Who this is for',h:'You read every growth tip. The number still is not moving.',p:'Newsletter creators with a real list and real content, who have tried the referral hacks, the pop-ups and the cross-promos, and still cannot tell which one is actually working.',who:'<b>The trap:</b> you collect more tactics, copy more threads, chase more channels, and growth stays flat because nothing tells you which lever mattered.'},
 {t:'reframe',kick:'The reframe',big1:'Guessing.',big2:'Or <span class="em">reverse-engineered</span>.',p:'Most advice is forward guessing, copied from someone who got lucky once. Reverse-engineering starts from a newsletter that already grew, works backward, and finds the move you can actually repeat. That gap is the whole method.'},
 {t:'part',kick:'Part one',h:'Why most newsletter advice fails.'},
 {t:'point',kick:'The core problem',h:'You are collecting tactics, not levers.',p:'A tactic is a trick that worked for someone, somewhere, once. A lever is the thing that actually carried the growth. Ten tactics with no way to tell them apart is why you stay busy and flat at the same time.'},
 {t:'point',kick:'The core problem',h:'The winners already ran the experiment.',p:'The fastest newsletters spent years and real money finding what works. You do not have to guess or start from zero. You can start from their result, work backward, and skip straight to the lever that paid off.'},
 {t:'framework',kick:'The core problem',h:'Guessing forward vs. reverse-engineering.',row:[['Guessing forward','You try a tactic you read about and hope it moves. If it does, you cannot say why.'],['Reverse-engineering','You start from a newsletter that grew, isolate the one lever, and copy the mechanic that produced it.']],p:'One is hope. The other is a repeatable read you can run on any newsletter, including your own.'},
 {t:'part',kick:'Part two',h:'The three places every lever hides.'},
 {t:'cycle',kick:'The method',h:'How to reverse-engineer any newsletter.',steps:['Pick a newsletter that already won in your space','Work backward from its size to the moments it jumped','Isolate the one lever that carried the growth','Find the exact mechanic behind it, not the vague version','Test that single mechanic on your own list and measure it'],p:'The skill is not knowing a hundred tactics. It is finding the one that mattered and being able to prove it.'},
 {t:'point',kick:'Lever one',h:'Acquisition: find the channel doing the work.',p:'In a real teardown it is rarely everything at once. It is one Reddit comment that drove fifteen hundred subscribers, or one pop-up adding fifty a day. The move is to find the single channel carrying the growth and go all in, instead of spreading thin across ten.'},
 {t:'point',kick:'Lever two',h:'Retention: stop the leak before you scale.',p:'Adding subscribers into a leaky list is pouring water into a bucket with holes. The quiet levers are the ones that keep people opening: a skip a month link instead of an unsubscribe, a steady sending cycle, subject lines pulled from your own broadcast data rather than guesses.'},
 {t:'framework',kick:'Lever three',h:'Monetization: the order the best ones follow.',row:[['First, sponsors','Sponsorship revenue that climbs as the list grows, priced to the audience you actually reach.'],['Then, your own offer','A community or product that turns the audience you built into revenue you own.']],p:'The mistake is skipping to the offer before the list is big enough, or leaving money on the table by never sequencing it at all.'},
 {t:'part',kick:'Part three',h:'Working backward, on your own list.'},
 {t:'looks',kick:'The outcome',h:'One lever you can actually see.',li:[['A read instead of a guess','You can point to the one move carrying your growth, and the ones quietly wasting your time.'],['Focus instead of scatter','You go all in on the channel that works, and stop maintaining nine that do not.'],['A repeatable process','Every time a newsletter blows up, you can reverse-engineer it and steal the lever for yourself.']]},
 {t:'whyme',kick:'Why Growth in Reverse',h:'Forty hours a week, spent working backward.',li:[['A teardown, every single week','Each issue breaks down the real growth of a creator with tens of thousands of subscribers.'],['Read by tens of thousands of creators','The most detailed newsletter growth breakdowns on the internet, worked backward from the numbers.'],['The method is the whole brand','Growth in Reverse is not a list of tips. It is one repeatable way to read what actually worked.']]},
 {t:'cta',kick:'Your next step',h:'Want to go deeper on your own list?',ctas:['<b>Join Growth In Reverse Pro</b> for live coaching, the teardowns, and a room of creators working backward with you.','Bring the one newsletter you wish you could reverse-engineer, and we will start there.'],disc:'This masterclass is educational. It shares frameworks and approaches for growing a newsletter; it is not advice for your specific situation and not a guarantee of any particular result. Outcomes vary by newsletter and effort.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
