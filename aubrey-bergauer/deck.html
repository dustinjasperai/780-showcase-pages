<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeping Patrons for the Long Haul — Aubrey Bergauer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --stage:#f8fafb;
    --panel:#f1f5f7;
    --rule:#dbe6eb;
    --ink:#121212;
    --muted:#4a5a60;
    --accent:#73c1d9;
    --accent-ink:#2f8aa8;
    --display:'Jost',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--stage);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 64px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:20px 0;min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .kicker{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent-ink);margin-bottom:18px}
  .stageno{font-family:var(--display);font-weight:700;font-size:13px;color:var(--accent-ink);
    letter-spacing:.08em;margin-bottom:14px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:33px;line-height:1.12;margin-bottom:16px}
  p{font-size:19px;line-height:1.55;color:var(--muted);max-width:62ch;margin-bottom:12px}
  p.lead{font-size:21px;color:var(--ink)}
  .big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.2;color:var(--ink);max-width:24ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding-left:26px;position:relative;margin-bottom:12px;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:2px;background:var(--accent)}
  .title-slide{min-height:520px}
  .title-slide h1{font-size:58px}
  .promise{font-size:22px;color:var(--ink);max-width:48ch;margin-top:8px}
  .by{margin-top:30px;font-family:var(--display);font-weight:500;font-size:16px;color:var(--muted);letter-spacing:.04em}
  .baseline{display:flex;gap:10px;margin-top:26px}
  .baseline span{height:4px;border-radius:3px;background:var(--rule)}
  .baseline span.on{background:var(--accent)}
  .metric{font-family:var(--display);font-weight:700;font-size:40px;color:var(--accent-ink);margin:4px 0}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;max-width:66ch;line-height:1.45}
  .cta-step{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);margin-top:8px}
  .tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:14px;color:var(--accent-ink);
    border:1px solid var(--accent);border-radius:999px;padding:5px 14px;margin-bottom:18px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A live masterclass',
   h1:'Keeping Patrons for the Long Haul',
   promise:'How to stop rebuilding your audience from zero every season, and grow the people who already walked through your doors into patrons who stay.',
   by:'With Aubrey Bergauer, author of Run It Like a Business'},

  {t:'content', kicker:'Who this is for',
   h2:'For the people running arts and culture organizations',
   body:['Executive directors, marketing and development leaders, and boards at symphonies, opera, theatre, ballet, museums, and festivals.',
         'If you are responsible for filling seats and funding the mission, this hour is built for you.']},

  {t:'content', kicker:'The trap',
   h2:'Every season starts back at zero',
   body:['You pour the budget into selling this season. The curtain closes, and most of those buyers quietly disappear.',
         'So next season you buy the audience all over again. It is a treadmill, and it is exhausting and expensive.']},

  {t:'reframe', tag:'The reframe',
   big:'You do not have an audience problem. You have a retention problem.'},

  {t:'section', stageno:'Part One', h2:'Why single-ticket thinking leaks patrons'},

  {t:'content', kicker:'The core problem',
   h2:'A ticket is a transaction. A patron is a relationship.',
   body:['When the whole operation is built to sell the next single ticket, the first-time attendee is treated as a one-off.',
         'Nobody owns what happens after they leave the hall. So the relationship never starts, and the money you spent to acquire them is spent again next year.']},

  {t:'section', stageno:'Part Two', h2:'The Long Haul Model'},

  {t:'content', kicker:'The Long Haul Model',
   h2:'Grow a patron through four stages, on purpose',
   body:['Instead of chasing strangers each season, you deliberately move the people you already have from one stage to the next.',
         'Each stage has its own job. Do the job, and attendance and giving compound instead of resetting.']},

  {t:'stage', stageno:'Stage 1', h2:'The first-timer',
   body:['The entire goal of a first visit is to earn a second one. Most organizations never ask for it.',
         'A deliberate welcome, a reason to come back, and a simple follow-up turn a trial into a habit.']},

  {t:'stage', stageno:'Stage 2', h2:'The repeat attendee',
   body:['Two visits is the real beginning of loyalty. Now you are building a pattern, not hoping for one.',
         'This is where you learn what they love and give them more of it, so coming back becomes the default.']},

  {t:'stage', stageno:'Stage 3', h2:'The member and donor',
   body:['A loyal attendee is ready to belong, not just buy. Membership and giving are the natural next ask.',
         'This is the Membership Economy: you convert repeat attendance into recurring support and a sense of ownership.']},

  {t:'stage', stageno:'Stage 4', h2:'The win-back',
   body:['Lapsed patrons are not lost. They already know and trusted you once.',
         'A specific, respectful win-back path brings a meaningful share of them home, far cheaper than finding someone brand new.']},

  {t:'content', kicker:'Supporting pillar',
   h2:'Digital content that fills real seats',
   body:['Online content is not a vanity exercise. Its job is to drive analog attendance, real bodies in real seats.',
         'Measured against that goal, streaming and content become a top-of-funnel engine for the Long Haul Model, not a distraction from it.']},

  {t:'content', kicker:'The throughline',
   h2:'Run it like a business, without losing the art',
   body:['Customer experience, data, and retention are not corporate words. They are how you protect the art by funding it.',
         'The discipline is borrowed from the for-profit world. The mission stays exactly yours.']},

  {t:'section', stageno:'Part Three', h2:'When patrons compound instead of resetting'},

  {t:'content', kicker:'The compounding effect',
   h2:'Audience and revenue that build instead of reset',
   body:['When every stage has an owner and a plan, the audience you earned last season becomes the foundation for this one.',
         'You stop renting an audience and start owning one. Growth stops being a gamble and starts being a system.']},

  {t:'proof', kicker:'Why listen to me',
   h2:'I ran this playbook, not just wrote it',
   body:['As CEO of the California Symphony I used these exact principles to rebuild the audience and the donor base from the inside.'],
   metric:'Audience doubled. Donor base nearly quadrupled.',
   note:'Since then I have worked with hundreds of arts organizations, from startups to $300 million budgets, through Changing the Narrative.'},

  {t:'content', kicker:'The honest objection',
   h2:'"But we will lose the art"',
   body:['The opposite is true. An organization that keeps its patrons is an organization that can afford to be ambitious on stage.',
         'Retention is what buys you the freedom to take artistic risks. The business exists to serve the art, not replace it.']},

  {t:'content', kicker:'Recap',
   h2:'The whole model in one line',
   body:['Stop refilling the room from zero. Grow the people you already have from first-timer to repeat to member to patron for the long haul.',
         'That is the difference between an audience you rent and one you own.']},

  {t:'cta', kicker:'Your next season',
   h2:'Bring the Long Haul Model to your organization',
   step:'If you want the full system, the Run It Like a Business Academy and the Changing the Narrative community are where we go deep, stage by stage.',
   close:'Start where you are. Pick one stage, give it an owner, and measure what changes.',
   disclaimer:'Educational content only. Examples and past results are illustrative and specific to their organizations. Nothing here is a guarantee of audience, revenue, or fundraising outcomes. Results vary by organization, market, and execution.'}
];

const deck = document.getElementById('deck');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function para(arr){return (arr||[]).map((x,i)=>'<p'+(i===0?' class="lead"':'')+'>'+esc(x)+'</p>').join('');}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='title'?' title-slide':'');
  let h='';
  if(s.t==='title'){
    h+='<div class="kicker">'+esc(s.kicker)+'</div>';
    h+='<h1>'+esc(s.h1)+'</h1>';
    h+='<p class="promise">'+esc(s.promise)+'</p>';
    h+='<div class="by">'+esc(s.by)+'</div>';
    h+='<div class="baseline"><span class="on" style="width:46px"></span><span style="width:26px"></span><span style="width:14px"></span></div>';
  } else if(s.t==='reframe'){
    h+='<div class="tag">'+esc(s.tag)+'</div>';
    h+='<div class="big">'+esc(s.big)+'</div>';
  } else if(s.t==='section'){
    h+='<div class="stageno">'+esc(s.stageno)+'</div>';
    h+='<h2>'+esc(s.h2)+'</h2>';
  } else if(s.t==='stage'){
    h+='<div class="stageno">'+esc(s.stageno)+'</div>';
    h+='<h2>'+esc(s.h2)+'</h2>';
    h+=para(s.body);
  } else if(s.t==='proof'){
    h+='<div class="kicker">'+esc(s.kicker)+'</div>';
    h+='<h2>'+esc(s.h2)+'</h2>';
    h+=para(s.body);
    h+='<div class="metric">'+esc(s.metric)+'</div>';
    h+='<p>'+esc(s.note)+'</p>';
  } else if(s.t==='cta'){
    h+='<div class="kicker">'+esc(s.kicker)+'</div>';
    h+='<h2>'+esc(s.h2)+'</h2>';
    h+='<p class="cta-step">'+esc(s.step)+'</p>';
    h+='<p>'+esc(s.close)+'</p>';
    h+='<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
  } else {
    if(s.kicker) h+='<div class="kicker">'+esc(s.kicker)+'</div>';
    if(s.h2) h+='<h2>'+esc(s.h2)+'</h2>';
    h+=para(s.body);
  }
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
