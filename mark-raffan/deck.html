<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Negotiation Success System — a live masterclass with Mark Raffan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6faf9;
  --panel:#eaf4f1;
  --card:#ffffff;
  --rule:#d3e4df;
  --ink:#16222b;
  --muted:#4d6069;
  --accent:#30bba5;
  --accent-deep:#1f7e70;
  --headFont:'Playfair Display',Georgia,serif;
  --bodyFont:'Open Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bodyFont)}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
.slide{background:var(--card);border:1px solid var(--rule);border-radius:18px;
  padding:52px 54px;margin:22px 0;box-shadow:0 10px 30px rgba(22,34,43,.06);
  min-height:360px;display:flex;flex-direction:column;justify-content:center}
.slide.title{background:linear-gradient(180deg,#ffffff,var(--panel));
  border-color:var(--accent)}
.kick{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-deep);
  font-weight:700;margin-bottom:14px}
h1{font-family:var(--headFont);font-weight:800;font-size:46px;line-height:1.08;margin:0 0 16px}
h2{font-family:var(--headFont);font-weight:700;font-size:32px;line-height:1.14;margin:0 0 14px}
p{font-size:19px;line-height:1.6;color:var(--muted);margin:0 0 12px}
.lead{font-size:22px;color:var(--ink)}
.big{font-family:var(--headFont);font-weight:700;font-size:38px;line-height:1.18;color:var(--ink)}
.pill{display:inline-block;background:var(--panel);color:var(--accent-deep);
  border:1px solid var(--rule);border-radius:999px;padding:6px 14px;font-weight:700;
  font-size:14px;margin-bottom:18px}
ul{margin:8px 0 0;padding-left:0;list-style:none}
li{font-size:19px;line-height:1.5;color:var(--ink);padding:10px 0 10px 30px;position:relative;
  border-bottom:1px solid var(--rule)}
li:last-child{border-bottom:0}
li:before{content:"";position:absolute;left:4px;top:18px;width:10px;height:10px;
  background:var(--accent);border-radius:3px}
.num{font-family:var(--headFont);font-weight:800;font-size:20px;color:var(--accent-deep);
  border:2px solid var(--accent);border-radius:12px;width:46px;height:46px;display:flex;
  align-items:center;justify-content:center;margin-bottom:16px}
.cta{background:var(--ink);color:#eaf4f1;border-color:var(--ink)}
.cta h2,.cta .big{color:#ffffff}
.cta p{color:#bcd2cd}
.cta .pill{background:rgba(255,255,255,.08);color:#8fe6d5;border-color:rgba(255,255,255,.18)}
.disc{font-size:14px;color:#9fb6b1;margin-top:20px;line-height:1.5}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:30px}
.tag{color:var(--accent-deep);font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<div class="foot">Negotiations Ninja &middot; a live masterclass with Mark Raffan</div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Mark Raffan', h:'The Negotiation Success System', sub:'How prepared dealmakers win the deal before they walk in the room.'},
  {t:'who', h:'Who this is for', lead:'If a bad week comes down to a handful of conversations, this is for you.', items:['Sales leaders who negotiate price, scope, and terms','Procurement and supply-chain professionals buying complex deals','Founders and operators who sit across the table on the big ones']},
  {t:'trap', pill:'The trap', h:'Most people walk in and wing it', body:'They prepare their offer, their slides, their price. Then they improvise the actual negotiation, reacting to whatever the other side does. That is where margin, timelines, and relationships quietly leak away.'},
  {t:'reframe', pill:'The reframe', big:'The deal is won before anyone says a word.', body:'The best negotiators are not the fastest talkers. They are the most prepared people in the room. Preparation is a skill, and it is trainable.'},
  {t:'part', pill:'Part one', h:'The core problem', body:'Negotiation gets treated as a personality trait instead of a process. So results swing on mood, nerves, and who blinks first.'},
  {t:'point', h:'You cannot improvise leverage', body:'Under pressure, an unprepared negotiator gives ground to make the tension stop. Each reactive concession feels small. Added up across a deal, it is the difference between a good outcome and a costly one.'},
  {t:'point', h:'Both sides of the table', body:'Having sat in both procurement and sales, the pattern is the same on each side: the prepared party sets the terms, and the other party negotiates against themselves. The goal is to be the prepared party, every time.'},
  {t:'part', pill:'Part two', h:'The Negotiation Success Framework', body:'A repeatable system you run before and during every negotiation. Four moves.'},
  {t:'pillar', num:'1', h:'Plan the negotiation', body:'Treat it like a campaign: map the process, research the counterparty, and build your alternatives before you ever quote a number. Walking in prepared changes how the other side behaves.'},
  {t:'pillar', num:'2', h:'The Concession Roadmap', body:'Decide every concession you might make, and the order you would make them, in advance. Then you trade value deliberately instead of caving reactively when the pressure lands.'},
  {t:'pillar', num:'3', h:'Question Funneling', body:'A deliberate sequence of questions that surfaces what the counterparty actually needs. You stop arguing positions and start moving interests, which is where real agreement lives.'},
  {t:'pillar', num:'4', h:'Persuasion diagnostics', body:'Read what genuinely moves the person across from you before you make your case, so your argument is built for them, not for a generic buyer.'},
  {t:'part', pill:'Part three', h:'What it looks like in a real deal', body:'The system is not theory. Here is how it plays out when it is live.'},
  {t:'example', h:'The ten percent push', body:'"We need another ten percent off or we walk." An unprepared seller discounts. A prepared one has a roadmap: no movement on price, but room on timeline. So the answer becomes a trade, not a giveaway, and the deal holds its value.'},
  {t:'point', h:'The question that turns it', body:'One well-placed question, asked in the right order, often reveals that price was never the real issue. Funnel to the interest underneath it and the whole negotiation changes shape.'},
  {t:'recap', h:'Three moves to remember', items:['Plan the negotiation like a campaign','Map your concessions before the room','Funnel questions to the real interest']},
  {t:'whyme', pill:'Why learn this here', h:'Mark Raffan', body:'Procurement and sales veteran who has led multi-million-dollar, C-suite negotiations. Founder of Negotiations Ninja, host of the Negotiations Ninja podcast, author of the 9 Secrets field guide, and ranked by Global Gurus as a top negotiation thought leader worldwide.'},
  {t:'point', h:'What you will leave with', body:'Not a pep talk. A system you can run on your next real negotiation: how to prepare it, how to structure your concessions, and how to question your way to the actual deal.'},
  {t:'invite', pill:'Live and free', big:'This is a live session.', body:'You bring a real, upcoming negotiation. We work the system on it together, in real time. Come with a deal in mind and leave with a plan for it.'},
  {t:'cta', kick:'Your next step', h:'Bring this into your own negotiations', body:'If the live masterclass is useful, the full Negotiation Success Program goes deeper on the framework, the roadmap, and the questioning, built around the deals you actually run. Apply or book a consult at negotiations.ninja.', disc:'Educational only. No specific result or outcome is guaranteed. Results vary by situation, preparation, effort, and market conditions.'}
];
const deck=document.getElementById('deck');
for(const s of S){
  const el=document.createElement('section');
  el.className='slide '+(s.t==='title'?'title':s.t==='cta'?'cta':'');
  let html='';
  if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
  if(s.pill) html+='<span class="pill">'+s.pill+'</span>';
  if(s.num) html+='<div class="num">'+s.num+'</div>';
  if(s.h) html+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.sub) html+='<p class="lead">'+s.sub+'</p>';
  if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
  if(s.body) html+='<p>'+s.body+'</p>';
  if(s.items){html+='<ul>';for(const it of s.items)html+='<li>'+it+'</li>';html+='</ul>';}
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
}
</script>
</body>
</html>
