<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full-Spectrum Health, a masterclass with Gena Bradshaw Vitale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8f7;
    --panel:#eef4f2;
    --rule:#d4e2dd;
    --ink:#1c2321;
    --muted:#5d6b67;
    --accent:#477b72;
    --accent-deep:#34585a;
    --mint:#c9e2de;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;align-items:center;padding:40px 18px 80px}
  .deck{width:100%;max-width:960px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:18px;padding:64px 68px;margin:0 0 26px;min-height:540px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .num{position:absolute;right:26px;top:22px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .kicker{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-bottom:20px}
  h1{font-family:"Fraunces",serif;font-weight:500;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:"Fraunces",serif;font-weight:500;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  h3{font-family:"Fraunces",serif;font-weight:500;font-size:28px;line-height:1.15}
  .sub{font-size:21px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:40ch}
  .body{font-size:19px;line-height:1.6;color:var(--ink);margin-top:20px;max-width:46ch}
  .foot{margin-top:40px;font-size:15px;color:var(--muted);letter-spacing:.02em}
  .part{font-family:"Fraunces",serif;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
  .dims{display:flex;flex-direction:column;gap:14px;margin-top:30px}
  .dim{display:flex;align-items:flex-start;gap:20px;padding:16px 20px;background:var(--panel);border-radius:12px}
  .dim .n{font-family:"Fraunces",serif;font-size:22px;color:var(--accent-deep);min-width:34px;font-weight:600}
  .dim .label{font-weight:600;font-size:18px}
  .dim .txt{font-size:16px;color:var(--muted);line-height:1.5;margin-top:3px}
  .dim.focus{background:var(--accent);color:#fff}
  .dim.focus .n,.dim.focus .txt{color:var(--mint)}
  .stack{display:flex;flex-direction:column;gap:6px;margin-top:34px;max-width:360px}
  .bar{height:16px;border-radius:8px;background:var(--mint)}
  .bar.on{background:var(--accent)}
  .quote{font-family:"Fraunces",serif;font-weight:400;font-size:40px;line-height:1.28;letter-spacing:-.01em;max-width:24ch}
  .who{margin-top:28px;font-size:16px;color:var(--muted);letter-spacing:.04em}
  .creds{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;max-width:52ch}
  .cred{font-size:14px;color:var(--accent-deep);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:7px 14px}
  .steps{display:flex;flex-direction:column;gap:14px;margin-top:28px;max-width:48ch}
  .step{display:flex;gap:16px;align-items:baseline;font-size:18px;line-height:1.5}
  .step .d{font-family:"Fraunces",serif;color:var(--accent);font-weight:600;min-width:26px}
  .disc{margin-top:40px;font-size:13px;color:var(--muted);line-height:1.5;max-width:60ch;border-top:1px solid var(--rule);padding-top:16px}
  @media(max-width:640px){
    .slide{padding:40px 28px;min-height:460px}
    h1{font-size:40px}h2{font-size:30px}.quote{font-size:28px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:"A live masterclass",
    h:"Full-Spectrum Health",
    sub:"Why your energy and nervous system are the missing piece in every wellness plan you have ever tried.",
    foot:"With Gena Bradshaw Vitale  ·  Holistic Human Performance" },

  {t:'point',
    kicker:"Who this is for",
    h:"You take your health seriously. It still feels like something is off.",
    body:"This is for soul-led healers and high performers who have done the diets, the workouts, the mindset work, and the morning routines, and who still feel tired, scattered, or stuck in a body that will not fully cooperate." },

  {t:'point',
    kicker:"The trap",
    h:"You have been handed four separate health plans and told to run them all at once.",
    body:"A trainer for the body. A therapist for the mind. A coach for the goals. A retreat for the spirit. Each one is real. None of them talks to the others, so you end up managing four part-time jobs and wondering why it does not add up to feeling well." },

  {t:'point',
    kicker:"The reframe",
    h:"You can optimize four dimensions of your health and still stay stuck, because a fifth one runs the other four.",
    body:"Most plans quietly skip it. It is the dimension that decides whether everything else you are doing actually lands in your body, or just bounces off." },

  {t:'section',
    part:"Part One",
    h:"The problem is not effort. It is working in silos.",
    sub:"Your body, your nervous system, and your energy are not separate departments. They are one system, and when one is dysregulated it shows up everywhere else, as fatigue, as noise, as the plan that never quite works." },

  {t:'dims',
    kicker:"Part Two  ·  The model",
    h:"The Five Dimensions of Holistic Health",
    note:"Health is not one thing you fix. It is five dimensions you bring back into alignment. Four of them get all the attention. The fifth is the one we forget.",
    items:[
      { n:"01", label:"Physical", txt:"The measurable base: strength, movement, sleep, nutrition. What most plans start and end with." },
      { n:"02", label:"Mental", txt:"The subconscious programs quietly running the show, long after you consciously decided to change." },
      { n:"03", label:"Emotional", txt:"The feeling that got stored in the body instead of felt, and never left." },
      { n:"04", label:"Spiritual", txt:"Purpose, intuition, and the sense that your life is connected to something larger than the to-do list." },
      { n:"05", label:"Energetic", txt:"Your nervous system and your energy field, the master switch almost every wellness plan leaves out.", focus:true }
    ] },

  {t:'pillar', idx:1, label:"Physical",
    h:"Start with the body, but do not stop there.",
    body:"Exercise science, functional strength, movement quality, and real nutrition give you a measurable floor. This is the dimension the whole industry is comfortable with, which is exactly why doing it alone leaves so many people plateaued." },

  {t:'pillar', idx:2, label:"Mental",
    h:"You are not running your life. Your programming is.",
    body:"Most of what drives your days was coded long ago and runs on autopilot. Rewire and Recode is the five-day reset I use to release old programming and rewire the subconscious so your effort stops fighting your wiring." },

  {t:'pillar', idx:3, label:"Emotional",
    h:"The body keeps the score, and it keeps paying interest.",
    body:"Emotion that never got felt does not disappear. It gets stored, tightens the body, and drains energy you cannot account for. Somatic release is how we give it somewhere to go." },

  {t:'pillar', idx:4, label:"Spiritual",
    h:"Alignment is not a luxury. It is a signal.",
    body:"When purpose and intuition are offline, no protocol feels like enough. Reconnecting here is what turns a set of healthy habits back into a life that actually feels like yours." },

  {t:'pillar', idx:5, label:"Energetic", focus:true,
    h:"This is the dimension every other method skips.",
    body:"Your nervous system decides whether you are in a state to heal at all. A dysregulated system holds the pattern in place no matter how clean the diet or how hard the workout. Regulate it, and the other four finally have a system calm enough to integrate." },

  {t:'point',
    kicker:"The bridge",
    h:"Recode the nervous system, and the whole system comes online.",
    body:"This is the center of everything I teach. Science and energy work are not opposites here. Breath, somatic movement, sound, and subconscious work are simply how we recode a nervous system to align with your most magnetic self." },

  {t:'section',
    part:"Part Three",
    h:"What a full-spectrum recalibration actually looks like.",
    sub:"Not another protocol stacked on top of the four you already carry. One integrated path that reads where you are out of alignment across all five dimensions and brings them back into balance together." },

  {t:'steps2',
    kicker:"The path",
    h:"How the work sequences.",
    steps:[
      { d:"01", t:"Reset. A short, guided Rewire and Recode to release the old programming and quiet the nervous system before anything else is added." },
      { d:"02", t:"Recalibrate. Monthly, full-spectrum work across all five dimensions, with live teaching, subconscious reprogramming, somatic and energy healing." },
      { d:"03", t:"Integrate. The new baseline becomes who you are, not another plan you are managing. Regulated, clear, and resourced." }
    ] },

  {t:'credibility',
    kicker:"Why me",
    h:"I did not learn this from a book. I rebuilt my own body and nervous system, twice.",
    body:"As a two-time cancer survivor, I lived the difference between managing symptoms and healing a whole system. I brought my training in exercise science together with energy and subconscious work because, on my own body, neither one was enough alone.",
    creds:["B.S. Exercise Science","Certified Functional Strength Coach","FMS Practitioner","Precision Nutrition Coach","Reiki Practitioner","Integrated Energy Therapy","Sound Healing Practitioner","Author and Speaker"] },

  {t:'quote',
    q:"True wellness is a combination of science and spirituality, and healing is a reclamation of your power.",
    who:"Gena Bradshaw Vitale" },

  {t:'point',
    kicker:"What becomes possible",
    h:"Regulated. Clear. Resourced. Aligned.",
    body:"When all five dimensions move together, the habits finally hold, the energy comes back, and your health stops being a project you manage and becomes a baseline you live from." },

  {t:'cta',
    kicker:"Your next step",
    h:"Ready to bring your five dimensions back into alignment?",
    steps:[
      "Book a free 15-minute call with me to see where you are out of alignment.",
      "Start with the Rewire and Recode reset.",
      "Step into the Radiant Recalibration Experience for the full-spectrum work.",
      "Find it all at holistichumanperformance.co"
    ],
    disc:"This masterclass is for educational and informational purposes only. It is not medical advice, diagnosis, or treatment, and it is not a substitute for care from a qualified professional. No specific result is guaranteed. Results vary from person to person." }
];

const deck = document.getElementById("deck");
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

S.forEach((s,i)=>{
  const sl = el("div","slide");
  sl.appendChild(el("div","num", "0"+(i+1)+" / "+(S.length<10?"0":"")+S.length));
  if(s.t==="title"){
    sl.appendChild(el("div","kicker",esc(s.kicker)));
    sl.appendChild(el("h1",null,esc(s.h)));
    sl.appendChild(el("div","sub",esc(s.sub)));
    const st=el("div","stack");[0,1,2,3,4].forEach(k=>st.appendChild(el("div","bar"+(k===4?" on":""))));
    sl.appendChild(st);
    sl.appendChild(el("div","foot",esc(s.foot)));
  } else if(s.t==="point"){
    sl.appendChild(el("div","kicker",esc(s.kicker)));
    sl.appendChild(el("h2",null,esc(s.h)));
    sl.appendChild(el("div","body",esc(s.body)));
  } else if(s.t==="section"){
    sl.appendChild(el("div","part",esc(s.part)));
    sl.appendChild(el("h2",null,esc(s.h)));
    sl.appendChild(el("div","sub",esc(s.sub)));
  } else if(s.t==="dims"){
    sl.appendChild(el("div","kicker",esc(s.kicker)));
    sl.appendChild(el("h2",null,esc(s.h)));
    sl.appendChild(el("div","body",esc(s.note)));
    const d=el("div","dims");
    s.items.forEach(it=>{
      const row=el("div","dim"+(it.focus?" focus":""));
      row.appendChild(el("div","n",esc(it.n)));
      const c=el("div"); c.appendChild(el("div","label",esc(it.label))); c.appendChild(el("div","txt",esc(it.txt)));
      row.appendChild(c); d.appendChild(row);
    });
    sl.appendChild(d);
  } else if(s.t==="pillar"){
    sl.appendChild(el("div","kicker","Dimension 0"+s.idx+"  ·  "+esc(s.label)));
    sl.appendChild(el("h2",null,esc(s.h)));
    sl.appendChild(el("div","body",esc(s.body)));
    const st=el("div","stack");[1,2,3,4,5].forEach(k=>st.appendChild(el("div","bar"+(k<=s.idx?" on":""))));
    sl.appendChild(st);
  } else if(s.t==="steps2"){
    sl.appendChild(el("div","kicker",esc(s.kicker)));
    sl.appendChild(el("h2",null,esc(s.h)));
    const w=el("div","steps");
    s.steps.forEach(x=>{ const r=el("div","step"); r.appendChild(el("span","d",esc(x.d))); r.appendChild(el("span",null,esc(x.t))); w.appendChild(r); });
    sl.appendChild(w);
  } else if(s.t==="credibility"){
    sl.appendChild(el("div","kicker",esc(s.kicker)));
    sl.appendChild(el("h2",null,esc(s.h)));
    sl.appendChild(el("div","body",esc(s.body)));
    const c=el("div","creds"); s.creds.forEach(x=>c.appendChild(el("span","cred",esc(x)))); sl.appendChild(c);
  } else if(s.t==="quote"){
    sl.appendChild(el("div","quote","&ldquo;"+esc(s.q)+"&rdquo;"));
    sl.appendChild(el("div","who",esc(s.who)));
  } else if(s.t==="cta"){
    sl.appendChild(el("div","kicker",esc(s.kicker)));
    sl.appendChild(el("h2",null,esc(s.h)));
    const w=el("div","steps");
    s.steps.forEach((x,k)=>{ const r=el("div","step"); r.appendChild(el("span","d",(k+1)+".")); r.appendChild(el("span",null,esc(x))); w.appendChild(r); });
    sl.appendChild(w);
    sl.appendChild(el("div","disc",esc(s.disc)));
  }
  deck.appendChild(sl);
});
</script>
</body>
</html>
