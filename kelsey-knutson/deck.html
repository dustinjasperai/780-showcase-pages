<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work ON Your Business — A Masterclass with Kelsey Knutson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6EEE1; --panel:#FFFDF7; --panel2:#EEE3D1;
    --ink:#211A14; --muted:#6B5E50; --rule:#E0D3BC;
    --accent:#C4451F; --pine:#1F6F5C;
    --head:'Hanken Grotesk',system-ui,sans-serif;
    --body:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 48px;margin:0 0 28px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(33,26,20,.03);
  }
  .kick{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-.02em}
  h2{font-family:var(--head);font-weight:700;font-size:36px;line-height:1.08;letter-spacing:-.015em;margin-bottom:18px}
  p{font-size:21px;line-height:1.5;color:var(--ink);margin-top:14px;max-width:62ch}
  p.muted{color:var(--muted)}
  .lead{font-size:25px;line-height:1.45}
  ul{margin:18px 0 0 0;padding:0;list-style:none}
  li{font-size:21px;line-height:1.45;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:4px;top:20px;width:12px;height:12px;
    background:var(--accent);border-radius:3px}
  .pillar{font-family:var(--head);font-weight:700;color:var(--pine)}
  .foot{position:absolute;bottom:20px;left:56px;font-family:var(--head);font-size:12px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .num{position:absolute;top:22px;right:28px;font-family:var(--head);font-size:13px;color:var(--muted)}
  .big{font-size:72px;font-family:var(--head);font-weight:700;letter-spacing:-.03em;line-height:1}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:5px;color:var(--muted)}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:70ch;line-height:1.5}
  .cta{background:var(--panel2)}
  .btn{display:inline-block;font-family:var(--head);font-weight:700;font-size:18px;
    background:var(--accent);color:#fff;padding:14px 26px;border-radius:10px;margin-top:22px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kick:'A Free Masterclass with Kelsey Knutson',
   h:'Work ON Your Business',
   p:'How six and seven figure owners scale revenue and take-home without adding more of their own hours.'},

  {t:'who',kick:'Who this is for',
   h:'You already proved it works.',
   p:'You have real revenue, real customers, and real traction. What you do not have is a business that can grow without running through you for every decision. This hour is for the owner who is busy, profitable enough, and quietly stuck.'},

  {t:'trap',kick:'The trap',
   h:'More hours is not a strategy.',
   p:'When growth stalls, most owners reach for the only lever they trust: themselves. Longer days, more tasks, more fires. Revenue holds flat while the owner gets more tired. The harder you work in it, the less anyone else can.'},

  {t:'reframe',kick:'The reframe',
   h:'There are two jobs, and you only do one.',
   p:'Working IN the business is the money-making and operational work. Working ON it is strategy, systems, and direction. If every week is spent in it, nobody is building the thing that lets it scale. That is the whole problem in one sentence.'},

  {t:'part',kick:'Part One',
   h:'The core problem: you are the bottleneck.',
   p:'It is not a talent problem or a market problem. Everything routes through the one person who cannot be cloned. Until that changes, every new client, hire, or offer adds weight to the same pair of shoulders.'},

  {t:'cost',kick:'What it costs',
   h:'The three signs you have hit the ceiling.',
   list:['Revenue is flat while your hours keep climbing','You cannot take a week off without things slipping','Every important decision still waits for you']},

  {t:'part',kick:'Part Two',
   h:'The Get Shit Done method.',
   p:'This is the framework I use with owners to get out of the weeds and build a business that scales on systems and numbers instead of willpower. Four pillars.'},

  {t:'p1',kick:'Pillar 1',
   h:'<span class="pillar">Work ON it, on purpose.</span>',
   p:'Protected strategy time, scheduled like a client. Themed days, one thing at a time, sequential focus. You cannot build the business while you are buried inside it, so you put the ON-it work on the calendar first and defend it.'},

  {t:'p2',kick:'Pillar 2',
   h:'<span class="pillar">Decide from your KPIs.</span>',
   p:'Pricing, hiring, and marketing calls made from tracked numbers, not gut feel. Your KPIs are the instrument panel: they tell you what is actually working and what to fix first, so you stop guessing with your own money.'},

  {t:'p3',kick:'Pillar 3',
   h:'<span class="pillar">Scale without hiring first.</span>',
   p:'Before you add another salary, fix the systems, write the SOPs, and get the offer clear. Delegation only works once the process exists. Hire into a system, never into chaos, so you stop being the only one who can do it right.'},

  {t:'p4',kick:'Pillar 4',
   h:'<span class="pillar">Profit first, not revenue vanity.</span>',
   p:'Scaling should grow your take-home, not just the top line. We grow the number that actually reaches you, so a bigger business means a better-paid owner working fewer hours, not a busier one.'},

  {t:'diag',kick:'The sales diagnostic',
   h:'Right people, right offer, right time.',
   p:'When an offer is not selling, the fix is almost never more hustle. It is alignment: are you in front of the right people, with the right offer, at the right time. Miss one and the funnel leaks. This is how you find the leak fast.'},

  {t:'part',kick:'Part Three',
   h:'Your first 90 days, concretely.',
   list:['One protected CEO block a week, defended','A simple KPI dashboard you actually read','Two or three core SOPs so the business runs without you','A clear next hire, timed off the numbers']},

  {t:'shift',kick:'The shift',
   h:'From operator to owner.',
   p:'The goal is not a busier you. It is a business that grows while you step back into the work only you can do. That is what working ON it buys you: scale that does not cost you your life.'},

  {t:'why',kick:'Why me',
   h:'I built this from the chair out.',
   p:'I owned a hair salon before I coached. The demand for strategy outgrew the hours I had behind the chair, so I had to learn how to work ON a service business instead of in it. I have since helped over 60 owners across industries scale revenue, reach, and team with these exact systems.'},

  {t:'recap',kick:'Recap',
   h:'The whole method, one slide.',
   list:['Work ON it, on purpose','Decide from your KPIs','Scale without hiring first','Profit first, not revenue vanity']},

  {t:'cta',kick:'Your next step',
   h:'Let us build your scale-up plan.',
   p:'If you want help putting these systems and KPIs to work in your business, the Get Shit Done Mastermind is where we do it together. Bring your numbers and we will map the first 90 days.',
   btn:'Apply to the Get Shit Done Mastermind',
   disc:'This masterclass is for educational purposes only. It is not financial, legal, or business advice, and no specific income or result is promised or guaranteed. Outcomes vary and depend on your own business, effort, and market.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let inner='';
  if(s.kick) inner+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='title'){ inner+='<h1>'+s.h+'</h1>'; }
  else { inner+='<h2>'+s.h+'</h2>'; }
  if(s.p) inner+='<p'+(s.t==='title'?' class="lead"':'')+'>'+s.p+'</p>';
  if(s.list){ inner+='<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(s.btn) inner+='<div><span class="btn">'+s.btn+'</span></div>';
  if(s.disc) inner+='<div class="disc">'+s.disc+'</div>';
  inner+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  inner+='<div class="foot">Kelsey Marie Coaching &middot; Get Shit Done</div>';
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
