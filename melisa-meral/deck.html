<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 30-Day Pro Organizer Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7ef;      /* warm cream ground, derived from brand gold family */
    --panel:#ffffff;
    --ink:#17293c;     /* brand navy slate (brand.json h1 #17293c) */
    --muted:#55606c;
    --accent:#fab70c;  /* brand gold (brand.json #fab70c, 9 uses) */
    --rule:#e4dccb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:'Poppins',system-ui,sans-serif}
  .deck{max-width:1000px;margin:0 auto;padding:28px 16px}
  .slide{background:var(--bg);border-radius:14px;padding:64px 60px;margin:22px 0;
    min-height:520px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 34px rgba(0,0,0,.28);position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent)}
  .eyebrow{font-family:'Poppins';font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Zilla Slab';font-weight:700;font-size:54px;line-height:1.05;color:var(--ink);margin-bottom:18px}
  h2{font-family:'Zilla Slab';font-weight:700;font-size:40px;line-height:1.08;color:var(--ink);margin-bottom:16px}
  h3{font-family:'Zilla Slab';font-weight:600;font-size:26px;color:var(--ink);margin-bottom:8px}
  p{font-size:20px;line-height:1.5;color:var(--muted);max-width:46ch;margin-bottom:14px}
  .lead{font-size:24px;color:var(--ink);max-width:48ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;line-height:1.45;color:var(--ink);padding-left:34px;position:relative;margin-bottom:16px;max-width:52ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:14px;background:var(--accent);border-radius:3px}
  .step{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
  .step .n{font-family:'Zilla Slab';font-weight:700;font-size:30px;color:var(--accent);min-width:54px}
  .step .b h3{margin-bottom:4px}
  .step .b p{margin-bottom:0}
  .big{font-family:'Zilla Slab';font-weight:700;font-size:72px;color:var(--accent);line-height:1}
  .title h1{font-size:62px}
  .cta h2{font-size:46px}
  .disclaimer{margin-top:28px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.45}
  .brandline{position:absolute;right:30px;bottom:22px;font-family:'Poppins';font-weight:600;
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);opacity:.5}
  .count{position:absolute;left:30px;bottom:22px;font-size:12px;color:var(--muted);opacity:.7}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass with Melisa Meral', h1:'The 30-Day Pro Organizer Launch',
    lead:'How to get paid to organize without a fancy Instagram, certifications, or a big budget.'},

  {t:'who', eyebrow:'Who this is for', h2:'You love organizing. People already ask you for help.',
    p:'You are the one who sorts the pantry, color-codes the closet, and feels calm the second a room gets handled. Friends say you should do this for money. You keep thinking about it.',
    p2:'But every time you get close, a voice says you are not ready yet.'},

  {t:'trap', eyebrow:'The trap', h2:'So you wait.',
    bullets:['You wait until your Instagram looks professional.','You wait until you get some kind of certification.','You wait until you have the perfect name, logo, and website.','You wait until it feels less scary.'],
    foot:'And the waiting is the thing that is actually costing you.'},

  {t:'reframe', eyebrow:'The reframe', h2:'The problem was never you. It is the myth that you have to be ready.',
    lead:'Nobody who hired me cared about my feed or my credentials. They had a messy garage and they wanted it handled. That is the whole business.'},

  {t:'part', eyebrow:'Part one', big:'1', h2:'Why most aspiring organizers never start'},

  {t:'problem', eyebrow:'The real reason', h2:'You are trying to build a brand before you have a business.',
    p:'A pretty brand with no clients is a hobby that costs you money. A plain setup with paying clients is a business. I started with Craigslist ads, a ten dollar box of business cards, and before and after photos. That was enough to get booked.',
    p2:'Start messy. Start now. Polish later.'},

  {t:'part', eyebrow:'Part two', big:'2', h2:'The 30-Day Launch Roadmap'},

  {t:'roadmap', eyebrow:'The roadmap', h2:'Four weeks from thinking about it to booked and paid.',
    steps:[
      {n:'Wk 1', h:'Set up shop', p:'Register the business, sort payment and booking, and put up a simple page. Done in a weekend, not a quarter.'},
      {n:'Wk 2', h:'Price your sessions', p:'Set your hourly rate and session length so you are profitable from client number one, not run ragged for scraps.'},
      {n:'Wk 3', h:'Land your first clients', p:'Use the channels that actually convert for organizers now, from service marketplaces to word of mouth, with proof photos that sell.'},
      {n:'Wk 4', h:'Deliver and rebook', p:'Run a session clients rave about, then turn one project into repeat work and referrals.'}
    ]},

  {t:'pillar', eyebrow:'Pillar: pricing', h2:'Price for profit, not for permission.',
    p:'Most new organizers undercharge because they feel they need permission to be paid well. You do not. We set a real rate and a session structure so a full day of organizing pays you like a professional.',
    bullets:['Pick an hourly rate you are not embarrassed to say out loud.','Structure sessions so the math works before you ever walk in.','Package repeat work so income is not a guessing game.']},

  {t:'pillar', eyebrow:'Pillar: getting clients', h2:'Get clients without a fancy feed.',
    p:'You do not need a viral account to get booked. You need to be findable by people who already want this done and ready to prove you can do it.',
    bullets:['Show up where people are actively searching for an organizer.','Let before and after photos carry the pitch for you.','Turn every happy client into the next two clients.']},

  {t:'pillar', eyebrow:'Pillar: team', h2:'When you are ready, you stop being the only pair of hands.',
    p:'The ceiling on a solo organizer is your own calendar. The move past it is your first hire. I will show you when to make it and how to train someone so the work still feels like yours.'},

  {t:'mindset', eyebrow:'The mindset', h2:'Bold. Brave. No BS.',
    lead:'I left a six figure corporate job to do this. The pivot was not about having it all figured out. It was about deciding, then building. Pivot with purpose, and the confidence follows the action, not the other way around.'},

  {t:'part', eyebrow:'Part three', big:'3', h2:'What this actually looks like'},

  {t:'picture', eyebrow:'Six weeks from now', h2:'A booked week, in your own business.',
    bullets:['Two or three paid sessions on the calendar that you set.','A simple way new clients find and book you on repeat.','Rates that respect your time, and clients glad to pay them.','A real business, built on the thing you were already great at.']},

  {t:'why', eyebrow:'Why learn this from me', h2:'I have run this exact path since 2011.',
    p:'I built Let’s Get You Organized from those Craigslist ads into a team based organizing company, wrote a best selling book on the pivot, and have taught thousands of organizers through the podcast, the course, and the community of over a thousand of them.',
    p2:'I am not going to sell you a fantasy. I am going to hand you the roadmap I actually used.'},

  {t:'recap', eyebrow:'The recap', h2:'Here is the whole thing on one slide.',
    bullets:['Stop waiting to feel ready. Start messy, start now.','Week one: set up shop. Week two: price it right.','Week three: land clients. Week four: deliver and rebook.','Build a brand after you have a business, not before.']},

  {t:'cta', eyebrow:'Your next step', h2:'Ready to launch in the next 30 days?',
    lead:'If you want the roadmap applied to your situation step by step, the next move is to work with me one on one. Book a call and let us map your launch.',
    disclaimer:'This masterclass is educational. It shares a roadmap and real experience only. No income or result is guaranteed. Results vary from person to person, and building an organizing business takes work.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t === 'title' ? 'title' : s.t === 'cta' ? 'cta' : '');
  let h = '';
  if (s.eyebrow) h += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if (s.big) h += '<div class="big">' + s.big + '</div>';
  if (s.h1) h += '<h1>' + s.h1 + '</h1>';
  if (s.h2) h += '<h2>' + s.h2 + '</h2>';
  if (s.lead) h += '<p class="lead">' + s.lead + '</p>';
  if (s.p) h += '<p>' + s.p + '</p>';
  if (s.p2) h += '<p>' + s.p2 + '</p>';
  if (s.steps) { s.steps.forEach(st => { h += '<div class="step"><div class="n">' + st.n + '</div><div class="b"><h3>' + st.h + '</h3><p>' + st.p + '</p></div></div>'; }); }
  if (s.bullets) { h += '<ul>'; s.bullets.forEach(b => h += '<li>' + b + '</li>'); h += '</ul>'; }
  if (s.foot) h += '<p class="lead" style="margin-top:18px">' + s.foot + '</p>';
  if (s.disclaimer) h += '<div class="disclaimer">' + s.disclaimer + '</div>';
  h += '<div class="brandline">Pro Organizer Bootcamp</div>';
  h += '<div class="count">' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
