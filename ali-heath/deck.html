<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finding Your Creative Voice — a live masterclass with Ali Heath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfcfc;        /* brand near-white (brand.json) */
    --panel:#f3ede2;     /* warm paper panel, derived warm of --bg */
    --ink:#101010;       /* brand near-black (brand.json) */
    --accent:#261f12;    /* brand espresso brown (brand.json) */
    --rule:#261f12;
    --muted:#5c5346;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Karla",system-ui,sans-serif;line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px}
  .slide{background:var(--bg);border:1px solid rgba(38,31,18,.14);border-radius:2px;
    padding:64px 64px;margin:0 0 28px;min-height:62vh;display:flex;flex-direction:column;justify-content:center}
  .slide.alt{background:var(--panel)}
  h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:500;letter-spacing:-.01em;line-height:1.08}
  h1{font-size:54px}
  h2{font-size:38px;margin-bottom:18px}
  h3{font-size:26px;margin-bottom:12px}
  .kicker{font-family:"Karla",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.22em;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  .lead{font-size:20px;color:var(--muted);max-width:46ch;margin-top:10px}
  .hr{height:1px;background:var(--rule);opacity:.5;margin:26px 0;width:92px}
  p{font-size:18px;max-width:58ch;margin-top:14px}
  ul{margin:18px 0 0 0;list-style:none;max-width:60ch}
  li{position:relative;padding-left:26px;margin:12px 0;font-size:18px}
  li:before{content:"";position:absolute;left:0;top:11px;width:10px;height:1px;background:var(--accent)}
  .big{font-size:40px;font-family:"Newsreader",serif;font-weight:400;line-height:1.14;max-width:22ch}
  .part-num{font-family:"Newsreader",serif;font-size:19px;color:var(--accent);letter-spacing:.04em;margin-bottom:8px}
  .by{margin-top:30px;font-size:16px;color:var(--muted)}
  .pillar{font-family:"Newsreader",serif;font-size:30px;color:var(--accent);margin-bottom:6px}
  .disc{font-size:14px;color:var(--muted);max-width:60ch;margin-top:22px;line-height:1.5}
  .cta-line{font-size:22px;margin-top:8px}
  .page{font-family:"Karla";font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:18px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'', html:`
    <div class="kicker">A live masterclass with Ali Heath</div>
    <h1>Finding Your Creative Voice</h1>
    <div class="hr"></div>
    <p class="lead">How to build a creative brand people remember, in a world where every feed looks the same.</p>
    <div class="by">Ali Heath, creative director and three-time bestselling interiors author</div>
  `},
  {t:'promise', cls:'alt', html:`
    <div class="page">What you will leave with</div>
    <h2>Sixty minutes, three shifts</h2>
    <ul>
      <li>Why a distinctive voice is a decision, not a gift you are born with.</li>
      <li>A way to find yours in what you already love, not in what is trending.</li>
      <li>How to make your work felt, so the people who matter actually remember it.</li>
    </ul>
  `},
  {t:'who', cls:'', html:`
    <div class="page">Who this is for</div>
    <h2>The talented and the overlooked</h2>
    <p>Makers, designers, writers, founders and creatives whose work is genuinely good, and who quietly know it should be getting more attention than it is.</p>
    <p>If you have ever scrolled your own field and felt like one more voice in a crowd that all sounds alike, this hour is for you.</p>
  `},
  {t:'cost', cls:'alt', html:`
    <div class="page">What blending in costs you</div>
    <h2>Forgettable is expensive</h2>
    <ul>
      <li>You compete on price, because nothing else tells you apart.</li>
      <li>You wait to be picked, instead of being sought out.</li>
      <li>You keep making lovely work that scrolls straight past the people who would have loved it.</li>
    </ul>
  `},
  {t:'reframe', cls:'alt', html:`
    <div class="page">The honest part</div>
    <div class="big">You do not have a talent problem. You have a voice problem. And a voice can be found.</div>
  `},
  {t:'part', cls:'', html:`
    <div class="part-num">Part One</div>
    <h2>The sea of sameness</h2>
    <p>The tools got cheaper and the references got shared, so most creative work now rhymes. Beautiful, competent, and interchangeable.</p>
    <p>Sameness is comfortable. It is also forgettable, and forgettable work does not get chosen, featured, or paid well.</p>
  `},
  {t:'content', cls:'alt', html:`
    <div class="page">Why it happens</div>
    <h3>You have been decorating to the feed</h3>
    <p>When you build from what is popular, you inherit someone else's taste and lose your own. The feed rewards what already exists, so following it can only ever make you a slightly later version of someone else.</p>
    <p>The way out is not to try harder at their game. It is to play yours.</p>
  `},
  {t:'part', cls:'', html:`
    <div class="part-num">Part Two</div>
    <h2>How a voice is actually built</h2>
    <p>Three principles I have spent twenty years and three books putting into practice. They work for a home. They work just as well for a brand.</p>
  `},
  {t:'pillar', cls:'alt', html:`
    <div class="pillar">One. Curate</div>
    <h3>Start from what is already yours</h3>
    <p>A distinctive voice is curated, not invented. It comes from the things you have loved, collected and lived, not from the trend of the season. There is real joy in natural imperfection, and that is exactly where your fingerprint lives.</p>
    <p>Before you add anything new, name what is unmistakably yours already.</p>
  `},
  {t:'pillar', cls:'', html:`
    <div class="pillar">Two. Create</div>
    <h3>Mix freely, in your own way</h3>
    <p>Originality is not inventing from nothing. It is the imaginative mixing of old and new, done freely and in a more sustainable way. You combine what you curated into something only you would have put together.</p>
    <p>Permission is the whole trick, and it is yours to give.</p>
  `},
  {t:'pillar', cls:'alt', html:`
    <div class="pillar">Three. Cocoon</div>
    <h3>Make it felt, not just seen</h3>
    <p>The work people remember is felt through more than the eye. A home becomes a sanctuary when it engages every sense. A brand becomes memorable the same way, when it carries a mood and a point of view, not only a look.</p>
    <p>Ask of everything you make: how does this make someone feel?</p>
  `},
  {t:'thesis', cls:'', html:`
    <div class="page">The belief underneath it all</div>
    <h2>Bringing creativity to life</h2>
    <p>Creativity is not for a gifted few. It is within us all. Two habits turn that belief into a voice.</p>
    <ul>
      <li><strong>Curiosity.</strong> Follow what genuinely interests you, not what you think you should like.</li>
      <li><strong>Creating freely.</strong> Ship the work without waiting for permission or perfection.</li>
    </ul>
  `},
  {t:'part', cls:'alt', html:`
    <div class="part-num">Part Three</div>
    <h2>The same person, finally recognisable</h2>
    <p>Not a rebrand. A clarifying. You do not become someone new; you become more fully yourself, out loud.</p>
  `},
  {t:'apply', cls:'alt', html:`
    <div class="page">For wherever you create</div>
    <h3>One voice, many rooms</h3>
    <ul>
      <li>If you make things: your work starts to look like a signature, not a style you borrowed.</li>
      <li>If you write: an editor can tell it is you before they reach your name.</li>
      <li>If you are building something: your brand carries a feeling, and the right clients feel it first.</li>
    </ul>
  `},
  {t:'content', cls:'', html:`
    <div class="page">Before and after, in voice terms</div>
    <h3>From competent to unmistakable</h3>
    <ul>
      <li>Before: your work could belong to a dozen people. After: it could only be yours.</li>
      <li>Before: you explain what you do. After: people feel it in three seconds.</li>
      <li>Before: you chase the brief. After: the right people seek you out.</li>
    </ul>
  `},
  {t:'whyme', cls:'alt', html:`
    <div class="page">Why listen to me</div>
    <h2>Twenty years deciding what gets noticed</h2>
    <p>I write for Country Living, Elle Decoration, House and Garden, Homes and Gardens and the Telegraph, and I have written three bestselling books: Curate, Create and Cocoon.</p>
    <p>I built a creative career from a non-linear path, so I know how to help you find the voice that is already there and put it in front of the people who matter.</p>
  `},
  {t:'start', cls:'', html:`
    <div class="page">Start tonight</div>
    <h3>One small practice</h3>
    <p>Before the next thing you make, write down three things you genuinely love that have nothing to do with your field. A colour, a place, a texture, a time of day.</p>
    <p>That short list is the beginning of your voice. Curiosity first, permission second, polish last.</p>
  `},
  {t:'recap', cls:'alt', html:`
    <div class="page">To carry with you</div>
    <h2>Curate. Create. Cocoon.</h2>
    <ul>
      <li>Curate what is already yours.</li>
      <li>Create freely from it, in your own mix.</li>
      <li>Cocoon it, so the work is felt and not just seen.</li>
    </ul>
  `},
  {t:'cta', cls:'', html:`
    <div class="kicker">Your next step</div>
    <h2>Let's find your voice together</h2>
    <p class="cta-line">If this hour resonated, the next step is a 1:1 creative mentoring session with me. We go deep on your work, unlock what is distinctive, and map the way forward.</p>
    <p class="cta-line">Book a session or ask a question at <strong>aliheath.co.uk</strong>.</p>
    <p class="disc">This masterclass is educational. No income, outcome, or result is guaranteed; results vary with your own effort, craft and circumstances. The ideas here are shared to help you think, not as a promise of any specific commercial outcome.</p>
  `}
];
const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  el.innerHTML = s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
