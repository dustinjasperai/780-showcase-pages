<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Moving Sales Machine &middot; Louis Massaro / Moving Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#08121c; --panel:#16222f; --rule:#223244;
    --acc:#df3430; --ink:#cfdeef;
    --dim:#7e93ab;
  }
  html,body{height:100%}
  body{background:#04090f;font-family:'Plus Jakarta Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04090f}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.6% 9% 7.6% 9%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Plus Jakarta Sans',sans-serif;font-size:1vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Space Grotesk',Arial,sans-serif;font-weight:600;color:#f2f6fb;line-height:1.12;letter-spacing:-.01em}
  .t-title{align-items:flex-start}
  .t-title h1{font-size:4.6vw;max-width:80%}
  .t-title .sub{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.32vw;color:var(--dim);margin-top:3.2vh;max-width:62%;line-height:1.62;font-weight:400}
  .t-normal h1{font-size:2.7vw;max-width:80%}
  .t-normal .body{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.28vw;color:#a9bcd2;margin-top:2.6vh;max-width:70%;line-height:1.64;font-weight:400}
  .t-section{align-items:flex-start;border-left:.5vw solid var(--acc)}
  .t-section .idx{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.05vw;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.2vh}
  .t-section h1{font-size:3.7vw;max-width:78%;color:#f2f6fb}
  .t-hit{background:var(--panel);align-items:center;text-align:center}
  .t-hit h1{font-family:'Space Grotesk',Arial,sans-serif;font-size:2.5vw;max-width:70%;color:#f2f6fb;font-weight:500;line-height:1.28}
  .t-hit h1 b{color:var(--acc);font-weight:600}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.1vw;max-width:76%;color:#f2f6fb}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:#f2f6fb;border-radius:2px;padding:1.3vh 1.7vw;font-family:'Plus Jakarta Sans',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.03em}
  .disc{position:absolute;left:9%;right:9%;bottom:4.4vh;font-family:'Plus Jakarta Sans',sans-serif;font-size:.82vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .brandline{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.02vw;color:var(--dim);margin-top:3.6vh;font-weight:600;letter-spacing:.04em}
  .brandline b{color:var(--acc)}
  .route-motif{position:absolute;pointer-events:none;opacity:.85}
  .route-title{right:6%;bottom:10%;width:20vw}
  .route-corner{right:5%;bottom:8%;width:8vw;opacity:.5}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(207,222,239,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:13px;right:18px;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;letter-spacing:.18em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:13px;left:18px;font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-title .sub{font-size:3.2vw}
    .t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}.t-section h1{font-size:6.6vw}
    .t-hit h1{font-size:4.8vw}.t-cta h1{font-size:5.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">Moving Mastery</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- route motif: an ascending dispatch line with a single waypoint ring -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="route2" viewBox="0 0 240 160">
  <path d="M8 140 L60 140 L60 96 L120 96 L120 48 L200 48 L200 16" fill="none" stroke="#df3430" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="8" cy="140" r="5" fill="#df3430"/>
  <circle cx="200" cy="16" r="7" fill="none" stroke="#df3430" stroke-width="3"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Moving Sales Machine',sub:'A live masterclass for moving company owners whose estimates get sold a different way depending on who answers the phone, built from Louis Massaro’s own sales systemization method.',brand:true,line:true},

 {t:'normal',k:'Who this is for',title:'You can run trucks all day. That does not mean every estimate gets sold the same way.',body:'Two reps quote the same job two different ways, and the one who happens to be sharper that week closes it. That is not a sales team, that is a coin flip with a fuel bill attached.'},
 {t:'hit',title:'A truck that is booked is not the same thing as an estimate that is <b>sold</b>. One is activity. The other is revenue.'},

 {t:'section',idx:'Part One',title:'The Estimate You Did Not Sell'},
 {t:'normal',k:'The guess-and-hope estimate',title:'Every rep sells the job a little differently, and most of them are improvising.',body:'No script, no shared process, just whoever picked up the phone doing their best in the moment. It works fine on a good day. It falls apart the second volume goes up or a new hire takes the call.'},
 {t:'normal',k:'What that actually costs',title:'A booked estimate that does not close is a lead you already paid for, twice.',body:'Every unsold estimate is marketing money or a referral that already happened, and it walked. The fix is not more leads, it is a higher percentage of the leads you already have saying yes.'},

 {t:'section',idx:'Part Two',title:'The Estimate-Script System'},
 {t:'normal',k:'The script itself',title:'Word-for-word phone, video, and in-home scripts, so every estimate gets sold the same way.',body:'Not a general pitch outline, an actual script for the phone quote, the video walkthrough, and the in-home estimate, so the close does not depend on which rep happens to be working that day.'},
 {t:'normal',k:'Sales-meeting prep',title:'A structured pre-call process, so reps walk in already knowing the numbers and the objections.',body:'Before the estimate ever happens, the rep already knows what the job should cost, what the customer is likely to push back on, and how to answer it. Nobody is winging it live.'},
 {t:'normal',k:'Hiring for sales',title:'A process for bringing on and training salespeople, so growth stops being capped at your own calendar.',body:'The scripts and the prep process only compound once someone besides you can run them. This is the part that turns one good closer into a sales team.'},
 {t:'hit',title:'Scripts do not turn reps into robots. They make sure the company sells the job the same way, whether you are on the call or not.'},

 {t:'section',idx:'Part Three',title:'The Referral And Review Engine'},
 {t:'normal',k:'The referral program',title:'A built system that turns a finished move into the next move.',body:'Referrals that only happen when a happy customer thinks to mention you are luck, not a system. This is a structured program that asks at the right moment, every time, instead of hoping it comes up.'},
 {t:'normal',k:'The review-fetcher',title:'Turning every finished job into a fresh five-star review, not an afterthought.',body:'Reviews compound the way referrals do, but only if collecting them is a step in the process instead of something that happens by accident on the good jobs.'},
 {t:'hit',title:'Growth that only comes from advertising is growth you do not control. A referral and review system is growth you built.'},

 {t:'section',idx:'Part Four',title:'Why Louis Massaro'},
 {t:'normal',k:'He built the system on his own trucks first',title:'Two rental trucks in 2000 to a $20M/yr nationwide mover by 2012.',body:'Louis started with two rented trucks and grew Neighbors Moving & Storage into a $20M/yr nationwide operation, the sales process behind that growth is the one this masterclass is built from. He exited the company in 2016.'},
 {t:'normal',k:'Then he built the software too',title:'SmartMoving, a moving-industry software company, reportedly sold in a $41 million deal in 2022.',body:'Built after Neighbors, on top of everything he learned running estimates and sales for a company that size. He now teaches the sales side of that whole arc full time as Moving Mastery.'},

 {t:'section',idx:'Your Next Step',title:'Bring This Into Your Company'},
 {t:'normal',k:'How it is taught',title:'Moving Sales Academy: the scripts, the meeting prep, the hiring guide, and the referral and review system.',body:'A structured program built around the four pieces in this masterclass, taught by the person who had to build all four inside his own company before anyone else’s.'},
 {t:'normal',k:'What actually changes',title:'Every estimate gets sold the way your best rep sells it, not the way your newest one guesses at it.',body:'The scripts, the prep process, and the referral engine work together, so growth stops depending entirely on more leads and starts depending on a higher percentage of the leads already in front of you.'},

 {t:'cta',title:'Ready to sell every estimate the same way, every time?',chips:['Moving Sales Academy','Apply to work with Louis'],brand:true,disc:'Educational content for moving company owners. No income, growth, or business result is guaranteed. Results vary by company, market, and effort.'},
];

const deck=document.getElementById('deck');
function motif(cls){return `<svg class="route-motif ${cls}" viewBox="0 0 240 160"><use href="#route2"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1>`;
  } else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    if(s.title) h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Moving <b>Mastery</b> &middot; Louis Massaro</div>`;
  }
  if(s.line) h+=motif('route-title');
  else if(s.t==='section') h+=motif('route-corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
