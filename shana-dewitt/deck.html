<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Magnetic Client System — A Live Masterclass with Shana Dewitt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3; --panel:#ffffff; --ink:#1b1b1b; --muted:#54595f;
    --rule:#e4e1d9; --accent:#174c4d; --accent2:#2f6d6b;
    --head:'Playfair Display',Georgia,serif; --body:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;
    justify-content:center;padding:7vh 8vw;position:relative;border-bottom:1px solid var(--rule)}
  .eyebrow{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:1.4rem}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(2.4rem,6.2vw,4.6rem);line-height:1.04;
    letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(1.8rem,4.2vw,3rem);line-height:1.1;
    letter-spacing:-.01em}
  .sub{font-size:clamp(1.05rem,2vw,1.4rem);color:var(--muted);margin-top:1.6rem;max-width:40ch}
  .num{font-family:var(--head);font-style:italic;color:var(--accent2);font-size:1.1rem;margin-bottom:1rem}
  ul{list-style:none;margin-top:2rem;display:grid;gap:1.1rem;max-width:46ch}
  li{position:relative;padding-left:1.8rem;font-size:clamp(1.05rem,1.8vw,1.35rem)}
  li::before{content:"";position:absolute;left:0;top:.55em;width:.7rem;height:.7rem;border-radius:50%;
    background:var(--accent)}
  .pill{display:inline-block;font-family:var(--head);font-size:clamp(3rem,9vw,6rem);color:var(--accent);
    font-weight:700;line-height:1}
  .big{font-family:var(--head);font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.12;max-width:20ch;font-weight:600}
  .lead{font-size:clamp(1.1rem,2vw,1.4rem);max-width:44ch;margin-top:1.4rem;color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-top:2rem;max-width:60ch}
  .two h3{font-family:var(--head);color:var(--accent);font-size:1.1rem;margin-bottom:.8rem;font-weight:600}
  .two p,.two li{font-size:1.02rem;color:var(--muted)}
  .arc{position:absolute;right:8vw;top:50%;transform:translateY(-50%);width:34vw;max-width:340px;height:340px;
    border:1.5px solid var(--rule);border-radius:50%;opacity:.5;pointer-events:none}
  .arc::after{content:"";position:absolute;inset:18%;border-radius:50%;border:1.5px solid var(--accent);opacity:.4}
  .disclaimer{margin-top:2.4rem;font-size:.9rem;color:var(--muted);max-width:52ch;border-top:1px solid var(--rule);
    padding-top:1.2rem}
  .cta-line{font-family:var(--head);color:var(--accent);font-size:clamp(1.2rem,2.4vw,1.7rem);margin-top:1.8rem;font-weight:600}
  .ghost{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent2)}
  .tag{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);position:absolute;bottom:4vh;left:8vw}
  @media(max-width:720px){.two{grid-template-columns:1fr}.arc{display:none}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Shana Dewitt',
    title:'The Magnetic Client System',
    sub:'How women coaches and entrepreneurs attract consistent clients with marketing built around who they are, not more hustle.'},

  {t:'promise', eyebrow:'What you will walk away with',
    items:['Why consistent clients have nothing to do with working harder',
           'The one shift that turns a quiet audience into enrolled clients',
           'A simple way to choose the marketing strategy that actually fits you']},

  {t:'who', eyebrow:'This is for you if',
    items:['You post consistently and still hear crickets',
           'You have bought the courses and followed the steps, with little to show',
           'You feel like you have to be everywhere to be seen',
           'You know you are good at what you do, but the clients are not steady']},

  {t:'reframe', eyebrow:'The trap',
    big:'You keep looking for the next funnel, course, or strategy to fix it.',
    lead:'So you collect more tactics, borrow what worked for someone else, and wonder why it keeps falling flat.'},

  {t:'reframe', eyebrow:'The real reason',
    big:'The problem was never your effort. It is that you are running a strategy built for someone else.',
    lead:'A plan that fits another person’s energy will always feel like pushing a boulder uphill, no matter how disciplined you are.'},

  {t:'part', num:'Part One', title:'Why consistent clients feel so hard'},

  {t:'two', eyebrow:'Two things are usually missing',
    left:{h:'The right strategy for you',p:'Not every strategy is right for every person. The move that fills one coach’s calendar drains another. Fit comes first.'},
    right:{h:'The belief underneath it',p:'If some part of you does not believe you will be chosen, you quietly avoid the very actions that would grow your business.'}},

  {t:'reframe', eyebrow:'The sequence most people have backwards',
    big:'First comes the belief. Then the action. Then the results.',
    lead:'We can only consistently do the work when we truly believe our dream business is possible for us. Change the belief and the action gets easy.'},

  {t:'part', num:'Part Two', title:'The Magnetic Client System'},

  {t:'promise', eyebrow:'Four pillars',
    items:['Alignment: a strategy matched to your design',
           'Clarity: messaging your buyer instantly recognises',
           'Belief: the mindset to be 100% sold on yourself',
           'Consistency: the right move for you, repeated']},

  {t:'two', eyebrow:'Pillar one: Alignment',
    left:{h:'Build around your design',p:'Using Human Design, we look at how you naturally build relationships and where your energy is. A projector thrives on invitations, not cold DMs. Your Signature Marketing System is chosen to fit you.'},
    right:{h:'Why it works',p:'When the plan matches how you actually operate, showing up stops feeling like a performance and starts feeling like you.'}},

  {t:'two', eyebrow:'Pillar two: Clarity',
    left:{h:'Name the exact problem',p:'Your people need to know the precise problem you solve, clearly enough that they have Googled it. Sales pages for coaches beats heart-centered copywriter for entrepreneurs.'},
    right:{h:'Why it works',p:'People hire the expert who understands their challenge. Clarity is what makes you that obvious choice.'}},

  {t:'two', eyebrow:'Pillar three: Belief',
    left:{h:'Rewire the stories',p:'Using NLP and the TIME Technique, we go straight to the subconscious source of the beliefs holding you back, around money, visibility, and being chosen, and change them.'},
    right:{h:'Why it works',p:'Your inner critic gets an attitude adjustment. Instead of talking yourself out of the growth moves, you take confident action.'}},

  {t:'two', eyebrow:'Pillar four: Consistency',
    left:{h:'Repeat the right move',p:'Consistency is not posting more or being everywhere. It is doing the aligned actions that fit you, repeated, so trust compounds.'},
    right:{h:'Why it works',p:'A steady, recognisable presence is what turns a cold audience into clients who are ready before they ever reach out.'}},

  {t:'part', num:'Part Three', title:'What changes when the plan fits you'},

  {t:'two', eyebrow:'From chasing to magnetising',
    left:{h:'Before',p:'Posting daily into silence. Copying launches that do not fit. Second-guessing every offer. Clients arriving in unpredictable bursts.'},
    right:{h:'After',p:'A simple plan that fits you. A clear message your buyer recognises. The belief to show up fully. Clients arriving steadily.'}},

  {t:'reframe', eyebrow:'The one-line version',
    big:'Marketing matched to your design, plus the belief that you will be chosen, equals consistent clients.',
    lead:'That is the Magnetic Client System. Everything else is a tactic hanging off those two things.'},

  {t:'why', eyebrow:'Why learn this from me',
    title:'Shana Dewitt',
    items:['Former Fortune 100 Art Director who built three online businesses',
           'Certified life and success coach, with certifications in NLP, TIME Technique, Hypnosis, EFT, Human Design, and Reiki',
           'Host of The Magnetic Entrepreneur Podcast, 170+ episodes',
           'Has mentored hundreds of women entrepreneurs over 7+ years']},

  {t:'cta', eyebrow:'Your next step',
    title:'Build your Signature Marketing System',
    cta:'Book your free consultation with Shana at shanadewitt.com',
    sub:'We will map the strategy that fits you and the mindset to run it with confidence.',
    disclaimer:'This masterclass is educational. Results vary from person to person and nothing here is guaranteed; your outcome depends on your own work, your offer, and your market.'}
];

const el = document.getElementById('deck');
function esc(s){return (s||'').toString();}
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide';
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.t==='title'){
    h+=`<h1>${esc(s.title)}</h1><div class="sub">${esc(s.sub)}</div><div class="arc"></div>`;
  } else if(s.t==='promise'||s.t==='who'){
    h+=`<ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  } else if(s.t==='reframe'){
    h+=`<div class="big">${esc(s.big)}</div><div class="lead">${esc(s.lead)}</div><div class="arc"></div>`;
  } else if(s.t==='part'){
    h+=`<div class="num">${esc(s.num)}</div><h2>${esc(s.title)}</h2>`;
  } else if(s.t==='two'){
    h+=`<div class="two"><div><h3>${esc(s.left.h)}</h3><p>${esc(s.left.p)}</p></div>`+
       `<div><h3>${esc(s.right.h)}</h3><p>${esc(s.right.p)}</p></div></div>`;
  } else if(s.t==='why'){
    h+=`<h2>${esc(s.title)}</h2><ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  } else if(s.t==='cta'){
    h+=`<h2>${esc(s.title)}</h2><div class="cta-line">${esc(s.cta)}</div>`+
       `<div class="sub">${esc(s.sub)}</div>`+
       `<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  }
  h+=`<div class="tag">The Magnetic Client System &middot; ${i+1} / ${S.length}</div>`;
  sec.innerHTML=h;
  el.appendChild(sec);
});
</script>
</body>
</html>
