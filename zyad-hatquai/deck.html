<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SustainOS AI Lab, Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4f2fb;        /* warm paper shifted toward their indigo signature #4f4de0 */
    --panel:#faf9ff;     /* faint indigo-white panel, from the same accent */
    --rule:#e4e2f0;
    --ink:#2b2b2b;       /* their dominant charcoal */
    --ink-soft:#55534d;
    --ink-mute:#8a877f;
    --accent:#4f4de0;    /* their indigo link/CTA */
    --accent-soft:#edecfb;
  }
  html,body{height:100%}
  body{background:var(--ink);color:var(--ink);font-family:'Roboto',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{width:100vw;height:100vh;position:relative;background:var(--bg)}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:7vh 9vw;opacity:0;transition:opacity .25s ease}
  .slide.on{display:flex;opacity:1}
  .eyebrow{font-family:'Poppins',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:1.1rem}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:3.4rem;line-height:1.08;letter-spacing:-.02em;color:var(--ink);max-width:16ch}
  h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:2.3rem;line-height:1.14;letter-spacing:-.01em;color:var(--ink);max-width:18ch;margin-bottom:1.3rem}
  .lede{font-size:1.5rem;line-height:1.5;color:var(--ink-soft);max-width:30ch;margin-top:1.6rem;font-weight:300}
  p.body{font-size:1.28rem;line-height:1.6;color:var(--ink-soft);max-width:40ch;font-weight:300}
  p.body+p.body{margin-top:1rem}
  .part{font-family:'Poppins',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:1.4rem}
  .big-num{font-family:'Poppins',sans-serif;font-size:1rem;font-weight:700;color:var(--ink-mute);margin-bottom:.6rem}
  ul.clean{list-style:none;margin-top:1.4rem;max-width:40ch}
  ul.clean li{font-size:1.28rem;line-height:1.5;color:var(--ink-soft);padding-left:1.6rem;position:relative;margin-bottom:.95rem;font-weight:300}
  ul.clean li::before{content:"";position:absolute;left:0;top:.62em;width:.6rem;height:.6rem;background:var(--accent);border-radius:2px}
  .rail{display:flex;gap:.7rem;margin-top:2rem;flex-wrap:wrap}
  .rail .step{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:1rem 1.2rem;min-width:9.5rem}
  .rail .step .k{font-family:'Poppins',sans-serif;font-weight:600;color:var(--accent);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
  .rail .step .v{font-size:1.05rem;color:var(--ink);margin-top:.35rem;font-weight:400}
  .weeks{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;margin-top:1.8rem;max-width:52rem}
  .weeks .w{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:10px;padding:1rem 1.15rem}
  .weeks .w .wk{font-family:'Poppins',sans-serif;font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute)}
  .weeks .w .wt{font-size:1.1rem;color:var(--ink);margin-top:.3rem;font-weight:500}
  .weeks .w .wd{font-size:.95rem;color:var(--ink-soft);margin-top:.25rem;font-weight:300}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-top:1.8rem;max-width:52rem}
  .two .col{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:1.6rem 1.7rem}
  .two .col h3{font-family:'Poppins',sans-serif;font-size:1.3rem;color:var(--ink);margin-bottom:.5rem;font-weight:600}
  .two .col .tag{font-size:.85rem;color:var(--accent);font-weight:600;font-family:'Poppins',sans-serif;letter-spacing:.04em}
  .two .col p{font-size:1.05rem;color:var(--ink-soft);margin-top:.7rem;line-height:1.5;font-weight:300}
  .cta-slide{background:var(--ink);color:#fff}
  .cta-slide .eyebrow{color:#b9b7ff}
  .cta-slide h1{color:#fff}
  .cta-slide .lede{color:#d8d6cf}
  .cta-btn{display:inline-block;margin-top:2.2rem;background:var(--accent);color:#fff;font-family:'Poppins',sans-serif;font-weight:600;font-size:1.2rem;padding:1rem 2rem;border-radius:999px;text-decoration:none}
  .disclaimer{margin-top:2.4rem;font-size:.82rem;color:#9a988f;max-width:52ch;line-height:1.5;font-weight:300}
  .credit{display:flex;align-items:baseline;gap:1rem;margin-top:1.4rem}
  .credit .big{font-family:'Poppins',sans-serif;font-size:3rem;font-weight:700;color:var(--accent);line-height:1}
  .credit .lbl{font-size:1.1rem;color:var(--ink-soft);font-weight:300}
  #nav{position:fixed;bottom:20px;right:26px;display:flex;align-items:center;gap:14px;font-family:'Poppins',sans-serif;font-size:.8rem;color:var(--ink-mute);z-index:10}
  #nav button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem}
  #nav button:hover{border-color:var(--accent);color:var(--accent)}
  #count{min-width:48px;text-align:center}
  #notesToggle{position:fixed;bottom:20px;left:26px;background:var(--panel);border:1px solid var(--rule);color:var(--ink-soft);font-family:'Poppins',sans-serif;font-size:.74rem;padding:.5rem .9rem;border-radius:999px;cursor:pointer;z-index:10}
  .notes{display:none;position:fixed;left:26px;bottom:62px;max-width:40ch;background:var(--ink);color:#e9e7df;font-size:.9rem;line-height:1.5;padding:1rem 1.2rem;border-radius:10px;z-index:10;font-weight:300}
  body.show-notes .notes.on{display:block}
  @media(max-width:820px){h1{font-size:2.2rem}h2{font-size:1.7rem}.slide{padding:6vh 7vw}.weeks{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="notes" id="noteBox"></div>
<button id="notesToggle">Hide notes</button>
<div id="nav"><button id="prev">&#8249;</button><span id="count"></span><button id="next">&#8250;</button></div>
<script>
const S=[
 {t:'title',eyebrow:'A SustainOS Masterclass',h:'Build the AI tool your sustainability work actually needs',lede:'Six weeks, no code, no developer. You direct it, the AI builds it, and you keep it.',notes:'Welcome. This hour is about crossing one line: from chatting with AI to building a real tool for your own sustainability work.'},
 {t:'who',eyebrow:'Who this is for',h:'You already use AI. You are just stuck in chat mode.',body:['In-house sustainability and ESG managers, consultants, and people building their own practice.','You use AI every day for supplier engagement, Scope 3, materiality and reporting. But it stays a conversation. Nothing you build survives past the chat window.'],notes:'If you can describe your work, you can follow all of this. Nothing to install.'},
 {t:'trap',eyebrow:'The trap',h:'Every AI course is built for someone else',body:['The courses out there are for developers or for marketers. None of them are built for work like yours.','So you keep asking AI for the tool you need, copy the answer into a doc, and lose it by Friday.'],notes:'Name the frustration in the room. This is the thing nobody is solving for sustainability practitioners.'},
 {t:'reframe',eyebrow:'The real picture',h:'The gap is not a threat. It is a head start.',body:['Over 90% of sustainability professionals say AI is already changing the work. Almost nobody is building with it yet.','That space between what AI can already do for your work and what people actually use it for is your opening. It is closing.'],notes:'This is the hook: you are earlier than you think, and that is the advantage.'},
 {t:'part',part:'Part one',h:'Chatting is not building'},
 {t:'std',eyebrow:'Why chat mode stalls',h:'A conversation cannot do your job twice',body:['A chat gives you one answer, once. It does not remember. Your team cannot open it. Next month you start over.'],notes:'Draw the hard line between a one-off answer and a tool.'},
 {t:'list',eyebrow:'What a real tool does',h:'It lives past the conversation',items:['It stores your data instead of forgetting it','Your team can log in and use it','Different people get different access','It runs on its own, deployed, every day'],notes:'These four capabilities are the difference between a prompt and a product.'},
 {t:'part',part:'Part two',h:'The method: Design, Build, Test, Document, Deploy'},
 {t:'rail',eyebrow:'The build sequence',h:'You direct. The AI builds.',rail:[['Design','Scope and spec it'],['Build','With AI, not code'],['Test','On real work'],['Document','So it lasts'],['Deploy','Hand it over']],notes:'This five step sequence front-loads the thinking and replaces the code-first bottleneck. It is the spine of everything.'},
 {t:'std',eyebrow:'Step one',h:'Design and spec, before a single line',body:['Most builds fail because they start with code. We start by scoping the task and locking the spec, so the AI builds the right thing the first time.'],notes:'Week one and two. Your first MVP, then a locked spec and version control.'},
 {t:'std',eyebrow:'Step two',h:'A database, so your data persists',body:['This is where a tool stops being a toy. Registrations, submissions, supplier data, all of it stored and queryable instead of pasted into a chat.'],notes:'Week three. The moment it becomes real software.'},
 {t:'std',eyebrow:'Step three',h:'Login and roles, so your team can use it',body:['Authentication and access control mean the tool is not just yours on your laptop. Different roles see different things, enforced by the database.'],notes:'Weeks four and five. From single-user to team tool.'},
 {t:'std',eyebrow:'Step four',h:'Deploy and hand it over',body:['Week six you launch it to production with a documentation package. It stays yours. A tool your team is actually allowed to use.'],notes:'The finish line. You walk away with a deployed, documented tool.'},
 {t:'two',eyebrow:'Two ways through',h:'Pick the path that fits your week',two:[['Guided path','About 4 hours a week','Learn the method on a shared case company: a materiality matrix and a supplier portal, built step by step.'],['Open path','6 to 8 hours a week','Build your own tool from week two, with the same method applied to your real sustainability work.']],notes:'Both paths finish with a working tool. The guided path lowers the risk for busy people.'},
 {t:'part',part:'Part three',h:'What six weeks looks like'},
 {t:'weeks',eyebrow:'The arc',h:'One live session a week, one real tool at the end',weeks:[['Week 1','First MVP','Build a materiality matrix, scope your task'],['Week 2','Design and spec','Lock the spec, set up version control'],['Week 3','Database','Persistence, submissions, your data'],['Week 4','Login','Authentication and access control'],['Week 5','User roles','Permissions enforced by the database'],['Week 6','Deploy','Production launch and hand-over']],notes:'Two live sessions a week, Monday and Friday, plus office hours. If your tool is not done by week six, support continues at no extra cost.'},
 {t:'std',eyebrow:'A worked example',h:'A supplier data tool, built live',body:['In the workshop you watch a project tracker get built from nothing in under an hour. In the lab, that same method builds the tool your own work needs.'],notes:'Make the abstract concrete. People believe it when they watch it happen.'},
 {t:'credit',eyebrow:'Why learn this from me',h:'A practitioner who builds in the job, not a developer',credit:[['5+ yrs','as a corporate sustainability manager: supplier engagement, emissions accounting, audit prep, board decks'],['2,300+','sustainability professionals through the free workshops so far']],notes:'I am not the smartest on AI or the deepest on sustainability. I test things, I apply them, and I share what actually works.'},
 {t:'std',eyebrow:'The outcome',h:'Save a week out of every month',body:['The work that eats your week, the data pulls, the reformatting, the chasing, gets handed to a tool you built. You get the week back, every month.'],notes:'Tie it back to time, the thing every practitioner is short of.'},
 {t:'cta',eyebrow:'Your next step',h:'Apply to the next AI Lab cohort',lede:'Six weeks. You leave with a real tool your team can use, and the method to build the next one yourself.',btn:'Apply to the AI Lab',disclaimer:'This masterclass is educational. It teaches a method for building tools with AI; it is not a guarantee of any financial result, time saved, or career outcome. Results vary with the work you bring and the effort you put in.'}
];
const stage=document.getElementById('stage'),noteBox=document.getElementById('noteBox'),count=document.getElementById('count');
let i=0;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
 stage.innerHTML='';
 S.forEach((s,idx)=>{
  const d=document.createElement('div');d.className='slide'+(idx===i?' on':'');
  if(s.t==='cta')d.classList.add('cta-slide');
  let h='';
  if(s.eyebrow)h+=`<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.part)h+=`<div class="part">${esc(s.part)}</div>`;
  if(s.t==='title'||s.t==='cta'||s.t==='reframe'||s.t==='trap'||s.t==='who'){
   if(s.h)h+=`<h1>${esc(s.h)}</h1>`;
  } else if(s.h){h+=`<h2>${esc(s.h)}</h2>`}
  if(s.lede)h+=`<div class="lede">${esc(s.lede)}</div>`;
  if(s.body)s.body.forEach(b=>h+=`<p class="body">${esc(b)}</p>`);
  if(s.items){h+='<ul class="clean">';s.items.forEach(it=>h+=`<li>${esc(it)}</li>`);h+='</ul>'}
  if(s.rail){h+='<div class="rail">';s.rail.forEach(r=>h+=`<div class="step"><div class="k">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`);h+='</div>'}
  if(s.weeks){h+='<div class="weeks">';s.weeks.forEach(w=>h+=`<div class="w"><div class="wk">${esc(w[0])}</div><div class="wt">${esc(w[1])}</div><div class="wd">${esc(w[2])}</div></div>`);h+='</div>'}
  if(s.two){h+='<div class="two">';s.two.forEach(c=>h+=`<div class="col"><div class="tag">${esc(c[1])}</div><h3>${esc(c[0])}</h3><p>${esc(c[2])}</p></div>`);h+='</div>'}
  if(s.credit){h+='<div>';s.credit.forEach(c=>h+=`<div class="credit"><div class="big">${esc(c[0])}</div><div class="lbl">${esc(c[1])}</div></div>`);h+='</div>'}
  if(s.btn)h+=`<a class="cta-btn" href="#">${esc(s.btn)}</a>`;
  if(s.disclaimer)h+=`<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  d.innerHTML=h;stage.appendChild(d);
 });
 count.textContent=(i+1)+' / '+S.length;
 noteBox.className='notes on';noteBox.textContent=S[i].notes||'';
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render()}
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
stage.addEventListener('click',e=>{if(!e.target.closest('a'))go(i+1)});
const tgl=document.getElementById('notesToggle');
tgl.onclick=()=>{document.body.classList.toggle('show-notes');tgl.textContent=document.body.classList.contains('show-notes')?'Hide notes':'Show notes'};
document.body.classList.add('show-notes');
render();
</script>
</body>
</html>
