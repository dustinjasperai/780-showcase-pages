<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Blessed &amp; Balanced Business | KingdomMBA Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17121f;        /* royal plum-ink ground (her dark Kajabi scheme, warmed) */
    --panel:#221a2e;
    --rule:#3a2f49;
    --accent:#f1c40f;    /* her site gold (brand.json) */
    --ink:#f4efe6;       /* warm off-white */
    --muted:#b9aec6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Lato",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:linear-gradient(180deg,var(--panel),var(--bg));
    border:1px solid var(--rule);border-radius:18px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;top:0;left:0;width:6px;height:100%;background:var(--accent);opacity:.9}
  .num{position:absolute;top:22px;right:28px;font-family:"Archivo Narrow";font-size:14px;letter-spacing:.18em;color:var(--muted)}
  .eyebrow{font-family:"Archivo Narrow";font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-size:15px;margin-bottom:18px}
  h1{font-family:"Archivo Narrow";font-weight:700;font-size:62px;line-height:1.02;letter-spacing:.01em}
  h2{font-family:"Archivo Narrow";font-weight:700;font-size:44px;line-height:1.06;margin-bottom:14px}
  h3{font-family:"Archivo Narrow";font-weight:600;font-size:26px;color:var(--accent);margin-bottom:8px}
  p{font-size:21px;margin-bottom:14px;max-width:48ch}
  p.lead{font-size:24px;color:var(--ink)}
  .sub{color:var(--muted);font-size:20px;max-width:52ch}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:21px;padding:10px 0 10px 30px;position:relative;max-width:50ch}
  li::before{content:"";position:absolute;left:0;top:18px;width:11px;height:11px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .foot{position:absolute;bottom:20px;left:56px;font-family:"Archivo Narrow";letter-spacing:.18em;font-size:13px;color:var(--muted)}
  .title h1{font-size:76px}
  .disclaimer{margin-top:26px;font-size:14px;color:var(--muted);max-width:60ch;line-height:1.5}
  .cta-line{font-family:"Archivo Narrow";font-weight:600;color:var(--accent);font-size:24px;margin-top:8px}
  @media(max-width:680px){.slide{padding:38px 28px}h1{font-size:44px}.title h1{font-size:52px}h2{font-size:32px}p,li{font-size:18px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A Free Live Masterclass', h:'The Blessed & Balanced Business',
   lead:'Build a profitable, purpose-driven business in under 15 hours a week, without sacrificing your home or your faith.',
   foot:'With Efe Cierkowski'},

  {t:'content', eyebrow:'Who this is for', h:'You are a Kingdom-driven mom with a calling she can feel.',
   sub:'A Christian mom who knows she was made for meaningful work, but refuses to trade her home and her kids to go get it. If you have felt pulled in both directions, you are exactly who this hour is for.'},

  {t:'content', eyebrow:'The trap', h:'You were handed a false choice.',
   p:['Hustle harder, chase the business, and miss bedtime and dinners.',
      'Or stay small, stay safe, and quietly bury the thing God put in you.'],
   ctaline:'Neither one is the life you were called to.'},

  {t:'content', eyebrow:'The cost', h:'The false choice is quietly expensive.',
   p:['Pick the hustle and the home pays for it in missed moments and short tempers.',
      'Pick the home and the calling pays for it in resentment and what-ifs.'],
   sub:'Either way you are running on guilt, and guilt is a terrible operating system for a business or a family.'},

  {t:'content', eyebrow:'The real problem', h:'It was never your ambition. And it was never your faith.',
   sub:'The problem is that nobody ever gave you a system built to honor both the business AND the home at the same time. So you have been improvising, and improvising is exhausting.'},

  {t:'content', eyebrow:'The reframe', h:'A Kingdom business is not built by working more hours.',
   lead:'It is built on purpose, then systems, then order, in that exact sequence. Get the sequence right and the hours come down, not up.'},

  {t:'content', eyebrow:'One foundation', h:'Seek first the Kingdom, and the rest gets built in order.',
   sub:'When He is first, your priorities stop fighting each other. The business serves the calling, the systems serve the home, and the order you have been missing finally has something to hang on. That is the foundation everything in this hour sits on top of.'},

  {t:'content', eyebrow:'The framework', h:'KingdomMBA: the ABC path',
   sub:'Three stages, built on one foundation. We start with who you are, then we build what you do, then we protect the home it is all for.',
   bullets:['A   Activate your purpose and calling',
            'B   Build your business foundations and systems',
            'C   Cultivate a happy home']},

  {t:'content', eyebrow:'Foundation', h:'First, step into your identity as a Daughter of the King.',
   sub:'Most moms build backwards: strategy before identity, busyness before priorities. We flip it. You cannot build a confident business on a shaky sense of who you are and whose you are. Identity is the orientation, and it comes first.'},

  {t:'content', eyebrow:'Part one of three', kicker:'A · Activate', h:'Activate your purpose and uncover your calling.',
   bullets:['A deep-dive assessment of your gifts, season, and strengths',
            'Goal planning that fits your actual life, not someone else’s',
            'The mindset shifts and daily rituals that keep you steady']},

  {t:'content', eyebrow:'Part two of three', kicker:'B · Build', h:'Build your business foundations and systems.',
   bullets:['A simple, real business plan you will actually use',
            'A marketing and sales strategy that fits a mom’s calendar',
            'CEO-task focus and profitability systems, so the business pays you']},

  {t:'content', eyebrow:'Part three of three', kicker:'C · Cultivate', h:'Cultivate a happy home.',
   bullets:['Home organization systems that lower the daily noise',
            'Your Home Binder and family rhythms everyone can follow',
            'The Happy Home Toolkit, so the home is the win, not the casualty']},

  {t:'content', eyebrow:'The lever', h:'The 15-hour week.',
   sub:'This is where Maximize Your Day comes in. You map your number one thing and your daily fundamentals, so a lean, focused business runs in under 15 hours a week and you stay present for the people it is all for.'},

  {t:'content', eyebrow:'What to avoid', h:'The five mistakes I see moms make.',
   bullets:['Building the business before getting clear on the calling',
            'Copying a hustle playbook that was never built for a mom’s life',
            'Treating the home as the overflow instead of the priority',
            'Waiting to feel ready instead of getting a plan that makes you ready',
            'Going it alone when a guide would have saved you years']},

  {t:'content', eyebrow:'If you are still in a job', h:'The Plan 4 Freedom framework.',
   sub:'A three-part plan for the mom who has not left the paycheck yet:',
   bullets:['How to know if you are truly ready to transition',
            'The one question that tells you if it is the right move',
            'A concrete, step-by-step plan to exit on purpose, not in panic']},

  {t:'content', eyebrow:'An ordinary Tuesday', h:'Blessed and balanced, on an ordinary Tuesday.',
   p:['The business is profitable and it fits inside the day.',
      'You are present at pickup, and dinner happens as a family.',
      'And the calling is not on hold. It is growing, quietly, on purpose.']},

  {t:'content', eyebrow:'The sequence', h:'Identity, then purpose, then systems, then home.',
   sub:'That is the whole method in one line. Activate who you are and what you are called to. Build the business on real foundations. Cultivate the home it is all for. Keep the order and the 15-hour week stops being a dream and starts being a Tuesday.'},

  {t:'content', eyebrow:'Why this, why me', h:'I have built in both worlds.',
   sub:'I spent years in a six-figure corporate career, then left to build an award-winning brick-and-mortar business. I am a wife and a mom of four. I learned the hard way that more hours is not the answer, and I built KingdomMBA so you do not have to learn it the way I did.'},

  {t:'cta', eyebrow:'The invitation', h:'You can have the business and the home. Both.',
   lead:'If today gave you language for what you have been feeling, the next step is simple: let us map your Blessed and Balanced plan together.',
   ctaline:'Book your free Blessed & Balanced call.',
   discl:'This masterclass is for educational purposes only. It shares a framework and principles, not a promise. Results vary from person to person and are not guaranteed, and nothing here is financial, legal, or tax advice.',
   foot:'KingdomMBA · Efe Cierkowski'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'title' ? ' title' : '');
  let html = '';
  html += '<span class="num">' + (s.t === 'title' ? 'KINGDOMMBA' : String(i).padStart(2,'0')) + '</span>';
  if (s.eyebrow) html += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if (s.kicker) html += '<h3>' + s.kicker + '</h3>';
  if (s.t === 'title') html += '<h1>' + s.h + '</h1>';
  else if (s.h) html += '<h2>' + s.h + '</h2>';
  if (s.lead) html += '<p class="lead">' + s.lead + '</p>';
  if (s.p) s.p.forEach(x => html += '<p>' + x + '</p>');
  if (s.sub) html += '<p class="sub">' + s.sub + '</p>';
  if (s.bullets){ html += '<ul>'; s.bullets.forEach(b => html += '<li>' + b + '</li>'); html += '</ul>'; }
  if (s.ctaline) html += '<p class="cta-line">' + s.ctaline + '</p>';
  if (s.discl) html += '<p class="disclaimer">' + s.discl + '</p>';
  if (s.foot) html += '<div class="foot">' + s.foot + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
